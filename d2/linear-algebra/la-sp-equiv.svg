<svg xmlns="http://www.w3.org/2000/svg" width="1017" height="1122" class="d2-1302430200 d2-svg" viewBox="-101 -101 1017 1122"><rect width="1017" height="1122" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1302430200 .fill-N1{fill:#0a0f25}.d2-1302430200 .fill-B1{fill:#0d32b2}.d2-1302430200 .fill-B6{fill:#f7f8fe}.d2-1302430200 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M83 430 0 464l83 35h165l82-35-82-34Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="165" y="470" class="text-bold fill-N1 s0">n × n 행렬 A 가 가역이다</text></g><g ><g class="shape"><path d="M481 0h283v114H481z" class="stroke-B1 fill-B6 s1"/></g><text x="622.5" y="38.5" class="text-bold fill-N1 s0"><tspan x="622.5" dy="0">3장 — 소거로 보면</tspan><tspan x="622.5" dy="17.25">A 의 RREF 가 I 다</tspan><tspan x="622.5" dy="17.25">축이 n 개 (모든 열에 하나씩)</tspan><tspan x="622.5" dy="17.25">기본행렬의 곱으로 적힌다</tspan></text></g><g ><g class="shape"><path d="M430 174h385v98H430z" class="stroke-B1 fill-B6 s1"/></g><text x="622.5" y="212.5" class="text-bold fill-N1 s0"><tspan x="622.5" dy="0">3장 — 해로 보면</tspan><tspan x="622.5" dy="17.667">Ax = b 가 모든 b 에 대해 해를 하나 갖는다</tspan><tspan x="622.5" dy="17.667">Ax = 0 이 자명해뿐이다</tspan></text></g><g ><g class="shape"><path d="M467 332h311v98H467z" class="stroke-B1 fill-B6 s1"/></g><text x="622.5" y="370.5" class="text-bold fill-N1 s0"><tspan x="622.5" dy="0">4장 — 행렬식으로 보면</tspan><tspan x="622.5" dy="17.667">det A ≠ 0</tspan><tspan x="622.5" dy="17.667">열이 만드는 부피가 0 이 아니다</tspan></text></g><g ><g class="shape"><path d="M453 490h340v114H453z" class="stroke-B1 fill-B6 s1"/></g><text x="623" y="528.5" class="text-bold fill-N1 s0"><tspan x="623" dy="0">6장 — 공간으로 보면</tspan><tspan x="623" dy="17.25">열이 일차독립이고 Rⁿ 을 생성한다</tspan><tspan x="623" dy="17.25">열이 Rⁿ 의 기저다</tspan><tspan x="623" dy="17.25">rank(A) = n, nullity(A) = 0</tspan></text></g><g ><g class="shape"><path d="M485 664h276v114H485z" class="stroke-B1 fill-B6 s1"/></g><text x="623" y="702.5" class="text-bold fill-N1 s0"><tspan x="623" dy="0">7장 — 변환으로 보면</tspan><tspan x="623" dy="17.25">T(x) = Ax 가 단사이자 전사</tspan><tspan x="623" dy="17.25">핵이 영벡터뿐이고 상이 Rⁿ</tspan><tspan x="623" dy="17.25">동형사상이다</tspan></text></g><g ><g class="shape"><path d="M480 838h285v82H480z" class="stroke-B1 fill-B6 s1"/></g><text x="622.5" y="876.5" class="text-bold fill-N1 s0"><tspan x="622.5" dy="0">8장 — 고유값으로 보면</tspan><tspan x="622.5" dy="18.5">λ = 0 이 A 의 고유값이 아니다</tspan></text></g><marker id="mk-d2-1302430200-2451250203" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="3" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="M10 0 0 6l10 6z" class="connection fill-B1"/></marker><marker id="mk-d2-1302430200-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection fill-B1"/></marker><path fill="none" marker-end="url(#mk-d2-1302430200-3488378134)" marker-start="url(#mk-d2-1302430200-2451250203)" d="M184.868 426.463C340.6 131.599 400.2 57 477 57" class="connection stroke-B1 s1" mask="url(#d2-1302430200)"/><path fill="none" marker-end="url(#mk-d2-1302430200-3488378134)" marker-start="url(#mk-d2-1302430200-2451250203)" d="M197.665 427.018C343 264.4 390 223 426 223" class="connection stroke-B1 s1" mask="url(#d2-1302430200)"/><path fill="none" marker-end="url(#mk-d2-1302430200-3488378134)" marker-start="url(#mk-d2-1302430200-2451250203)" d="M253.733 429.564C354 391 397.4 381 463 381" class="connection stroke-B1 s1" mask="url(#d2-1302430200)"/><path fill="none" marker-end="url(#mk-d2-1302430200-3488378134)" marker-start="url(#mk-d2-1302430200-2451250203)" d="M254.74 499.42C354.2 537.2 394.5 547 448.5 547" class="connection stroke-B1 s1" mask="url(#d2-13024