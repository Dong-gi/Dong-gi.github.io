<svg xmlns="http://www.w3.org/2000/svg" width="2084" height="584" class="d2-1850900533 d2-svg" viewBox="-101 -101 2084 584"><rect width="2084" height="584" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1850900533 .fill-N1{fill:#0a0f25}.d2-1850900533 .fill-N2{fill:#676c7e}.d2-1850900533 .fill-N4{fill:#cfd2dd}.d2-1850900533 .fill-B6{fill:#f7f8fe}.d2-1850900533 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="309" cy="123" class="shape stroke-B1 fill-B6 s0" rx="147" ry="49"/></g><text x="309" y="120.5" class="text-bold fill-N1 s1"><tspan x="309" dy="0">첨가행렬을</tspan><tspan x="309" dy="18.5">기약 행사다리꼴로</tspan></text></g><g ><g class="shape"><path d="M858 201c-1 0-2 0-3-1l-137-75c-1-1-1-2 0-3l137-76c1-1 4-1 5 0l137 76c1 1 1 2 0 3l-136 75c-1 1-2 1-3 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="858" y="112.5" class="text-bold fill-N1 s1"><tspan x="858" dy="0">맨 오른쪽 열에</tspan><tspan x="858" dy="17.667">축이 있는가?</tspan><tspan x="858" dy="17.667">(0 = 1 꼴의 행)</tspan></text></g><g ><g class="shape"><path d="M1162 0h235v82h-235z" class="stroke-B1 fill-B6 s0"/></g><text x="1279.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1279.5" dy="0">해가 없다</tspan><tspan x="1279.5" dy="18.5">두 직선이 나란한 경우</tspan></text></g><g ><g class="shape"><path d="M1279 266h-3l-137-61c-1-1-1-2 0-2l137-61c1-1 4-1 5 0l137 60c1 1 1 2 0 2l-136 62z" class="stroke-B1 fill-N4 s0"/></g><text x="1279" y="201.5" class="text-bold fill-N1 s1"><tspan x="1279" dy="0">축이 없는 열이</tspan><tspan x="1279" dy="18.5">남아 있는가?</tspan></text></g><g ><g class="shape"><path d="M1564 92h314v82h-314z" class="stroke-B1 fill-B6 s0"/></g><text x="1721" y="130.5" class="text-bold fill-N1 s1"><tspan x="1721" dy="0">해가 무수히 많다</tspan><tspan x="1721" dy="18.5">자유변수의 수 = 축 없는 열의 수</tspan></text></g><g ><g class="shape"><path d="M1559 234h323v82h-323z" class="stroke-B1 fill-B6 s0"/></g><text x="1720.5" y="272.5" class="text-bold fill-N1 s1"><tspan x="1720.5" dy="0">해가 하나뿐이다</tspan><tspan x="1720.5" dy="18.5">두 직선이 한 점에서 만나는 경우</tspan></text></g><text x="308.5" y="248" class="fill-N1 s1"><tspan x="308.5" dy="0">동차연립방정식(상수항이 전부 0)은 첫 갈림길에서 반드시 ‘없다’ 로 간다.</tspan><tspan x="308.5" dy="17.667">영벡터가 언제나 해이기 때문이다. 그래서 동차연립방정식의 답은</tspan><tspan x="308.5" dy="17.667">자명해뿐이거나 무수히 많거나 둘 중 하나다</tspan></text><text x="309" y="361" class="fill-N1 s1"><tspan x="309" dy="0">미지수가 방정식보다 많으면 축이 없는 열이 반드시 남는다.</tspan><tspan x="309" dy="18.5">그래서 그런 동차연립방정식은 자명하지 않은 해를 반드시 갖는다</tspan></text><marker id="mk-d2-1850900533-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1850900533-3488378134)" d="M458 122.995c166.8-.395 219.2-.395 256-.034" class="connection stroke-B1 s0" mask="url(#d2-1850900533)"/><path fill="none" marker-end="url(#mk-d2-1850900533-3488378134)" d="M941.869 89.287C1042.8 50.8 1087.1 41 1157.5 41" class="connection stroke-B1 s0" mask="url(#d2-1850900533)"/><text x="1047.5" y="55" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-1850900533-3488378134)" d="M943.865 155.722C1043.2 194.2 1082.4 204 1134 204" class="connection stroke-B1 s0" mask="url(#d2-1850900533)"/><text x="1037.5" y="197" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-1850900533-3488378134)" d="M1360.9 175.374C1463.4 141.6 1504.3 133 1559.5 133" class="connection stroke-B1 s0" mask="url(#d2-1850900533)"/><text x="1459.5" y="148" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-1850900533-3488378134)" d="M1358.902 232.617C1463 266.4 1503.5 275 1555.5 275" class="connection stroke-B1 s0" mask="url(#d2-1850900533)"/><text x="1456.5" y="270" class="text-italic fill-N2 s1">없다</text><mask id="d2-1850900533" width="2084" height="584" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2084v584H-101z"/><path d="M1026 39h43v21h-43zM1016 181h43v21h-43zM1438 132h43v21h-43zM1435 254h43v21h-43z"/></mask></svg>