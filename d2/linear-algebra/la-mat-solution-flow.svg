<svg xmlns="http://www.w3.org/2000/svg" width="928" height="1256" class="d2-2893287565 d2-svg" viewBox="-89 -89 928 1256"><rect width="928" height="1256" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2893287565 .text-bold{font-weight:700}.d2-2893287565 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2893287565 .fill-N1{fill:#0a0f25}.d2-2893287565 .fill-N2{fill:#676c7e}.d2-2893287565 .fill-N4{fill:#cfd2dd}.d2-2893287565 .fill-B6{fill:#f7f8fe}.d2-2893287565 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="268" cy="61" class="shape stroke-B1 fill-B6 s0" rx="147" ry="49"/></g><text x="268" y="58.5" class="text-bold fill-N1 s1"><tspan x="268" dy="0">첨가행렬을</tspan><tspan x="268" dy="18.5">기약 행사다리꼴로</tspan></text></g><g ><g class="shape"><path d="M268 336c-1 0-2 0-3-1l-137-75c-1-1-1-2 0-3l137-76c1-1 4-1 5 0l137 76c1 1 1 2 0 3l-136 75c-1 1-2 1-3 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="268" y="247.5" class="text-bold fill-N1 s1"><tspan x="268" dy="0">맨 오른쪽 열에</tspan><tspan x="268" dy="17.667">축이 있는가?</tspan><tspan x="268" dy="17.667">(0 = 1 꼴의 행)</tspan></text></g><g ><g class="shape"><path d="M12 507h235v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="129.5" y="545.5" class="text-bold fill-N1 s1"><tspan x="129.5" dy="0">해가 없다</tspan><tspan x="129.5" dy="18.5">두 직선이 나란한 경우</tspan></text></g><g ><g class="shape"><path d="M408 631h-3l-137-61c-1-1-1-2 0-2l137-61c1-1 4-1 5 0l137 60c1 1 1 2 0 2l-136 62z" class="stroke-B1 fill-N4 s0"/></g><text x="408" y="566.5" class="text-bold fill-N1 s1"><tspan x="408" dy="0">축이 없는 열이</tspan><tspan x="408" dy="18.5">남아 있는가?</tspan></text></g><g ><g class="shape"><path d="M81 802h314v82H81z" class="stroke-B1 fill-B6 s0"/></g><text x="238" y="840.5" class="text-bold fill-N1 s1"><tspan x="238" dy="0">해가 무수히 많다</tspan><tspan x="238" dy="18.5">자유변수의 수 = 축 없는 열의 수</tspan></text></g><g ><g class="shape"><path d="M415 802h323v82H415z" class="stroke-B1 fill-B6 s0"/></g><text x="576.5" y="840.5" class="text-bold fill-N1 s1"><tspan x="576.5" dy="0">해가 하나뿐이다</tspan><tspan x="576.5" dy="18.5">두 직선이 한 점에서 만나는 경우</tspan></text></g><path fill="transparent" stroke="transparent" d="M42 904h665v162H42z" class="shape s0"/><text x="374.5" y="944" class="fill-N1 s1"><tspan x="374.5" dy="0">동차연립방정식(상수항이 전부 0)은 첫 갈림길에서 반드시 ‘없다’ 로 간다.</tspan><tspan x="374.5" dy="17.667">영벡터가 언제나 해이기 때문이다. 그래서 동차연립방정식의 답은</tspan><tspan x="374.5" dy="17.667">자명해뿐이거나 무수히 많거나 둘 중 하나다</tspan></text><text x="342" y="1021" class="fill-N1 s1"><tspan x="342" dy="0">미지수가 방정식보다 많으면 축이 없는 열이 반드시 남는다.</tspan><tspan x="342" dy="18.5">그래서 그런 동차연립방정식은 자명하지 않은 해를 반드시 갖는다</tspan></text><marker id="mk-d2-2893287565-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2893287565-3488378134)" d="M269 112v64" class="connection stroke-B1 s0" mask="url(#d2-2893287565)"/><path fill="none" marker-end="url(#mk-d2-2893287565-3488378134)" d="m221.997 313-.242 190" class="connection stroke-B1 s0" mask="url(#d2-2893287565)"/><text x="221.5" y="415" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-2893287565-3488378134)" d="M316 313v230" class="connection stroke-B1 s0" mask="url(#d2-2893287565)"/><text x="316.5" y="435" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-2893287565-3488378134)" d="M361 613v185" class="connection stroke-B1 s0" mask="url(#d2-2893287565)"/><text x="361.5" y="712" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-2893287565-3488378134)" d="M455 613v185" class="connection stroke-B1 s0" mask="url(#d2-2893287565)"/><text x="455.5" y="712" class="text-italic fill-N2 s1">없다</text><mask id="d2-2893287565" width="928" height="1256" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h928v1256H-89z"/><path d="M200 399h43v21h-43zM295 419h43v21h-43zM340 696h43v21h-43zM434 696h43v21h-43z"/></mask></svg>