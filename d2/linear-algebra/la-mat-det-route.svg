<svg xmlns="http://www.w3.org/2000/svg" width="1085" height="1021" class="d2-2237930516 d2-svg" viewBox="-101 -101 1085 1021"><rect width="1085" height="1021" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2237930516 .fill-N1{fill:#0a0f25}.d2-2237930516 .fill-N2{fill:#676c7e}.d2-2237930516 .fill-B6{fill:#f7f8fe}.d2-2237930516 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="103" cy="365" class="shape stroke-B1 fill-B6 s0" rx="103" ry="40"/></g><text x="103" y="362.5" class="text-bold fill-N1 s1"><tspan x="103" dy="0">det A 를</tspan><tspan x="103" dy="18.5">구해야 한다</tspan></text></g><g ><g class="shape"><path d="M618 0h259v114H618z" class="stroke-B1 fill-B6 s0"/></g><text x="747.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="747.5" dy="0">즉시 0 이다</tspan><tspan x="747.5" dy="17.25">같은 두 행이나 열이 있다</tspan><tspan x="747.5" dy="17.25">한 행이 전부 0 이다</tspan><tspan x="747.5" dy="17.25">한 행이 다른 행의 배수다</tspan></text></g><g ><g class="shape"><path d="M656 174h183v82H656z" class="stroke-B1 fill-B6 s0"/></g><text x="747.5" y="212.5" class="text-bold fill-N1 s1"><tspan x="747.5" dy="0">2×2</tspan><tspan x="747.5" dy="18.5">ad − bc 를 그대로</tspan></text></g><g ><g class="shape"><path d="M643 316h210v98H643z" class="stroke-B1 fill-B6 s0"/></g><text x="748" y="354.5" class="text-bold fill-N1 s1"><tspan x="748" dy="0">삼각행렬·대각행렬</tspan><tspan x="748" dy="17.667">주대각선 원소를</tspan><tspan x="748" dy="17.667">모두 곱한다</tspan></text></g><g ><g class="shape"><path d="M612 474h271v98H612z" class="stroke-B1 fill-B6 s0"/></g><text x="747.5" y="512.5" class="text-bold fill-N1 s1"><tspan x="747.5" dy="0">여인자 전개</tspan><tspan x="747.5" dy="17.667">0 이 가장 많은 행이나 열로</tspan><tspan x="747.5" dy="17.667">부호는 체스판 무늬</tspan></text></g><g ><g class="shape"><path d="M622 632h252v98H622z" class="stroke-B1 fill-B6 s0"/></g><text x="748" y="670.5" class="text-bold fill-N1 s1"><tspan x="748" dy="0">행 연산으로 삼각화</tspan><tspan x="748" dy="17.667">교환하면 부호를 뒤집고</tspan><tspan x="748" dy="17.667">배수를 더하면 그대로</tspan></text></g><text x="441.5" y="766" class="fill-N1 s1"><tspan x="441.5" dy="0">여인자 전개는 n 이 커지면 n! 에 가까운 곱셈이 필요해</tspan><tspan x="441.5" dy="17.25">손으로도 기계로도 감당할 수 없다.</tspan><tspan x="441.5" dy="17.25">실제 계산은 거의 언제나 소거로 삼각화한 뒤 대각선을 곱한다.</tspan><tspan x="441.5" dy="17.25">소거는 3장에서 이미 배운 그 절차 그대로다</tspan></text><marker id="mk-d2-2237930516-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2237930516-3488378134)" d="M141.409 326.58C355.2 111.2 450.8 57 614 57" class="connection stroke-B1 s0" mask="url(#d2-2237930516)"/><text x="345.5" y="119" class="text-italic fill-N2 s1"><tspan x="345.5" dy="0">행이나 열 사이에</tspan><tspan x="345.5" dy="18.5">눈에 띄는 관계가 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-2237930516-3488378134)" d="M168.795 333.117C360.6 238.8 458.4 215 652 215" class="connection stroke-B1 s0" mask="url(#d2-2237930516)"/><text x="400.5" y="235" class="text-italic fill-N2 s1">2×2 다</text><path fill="none" marker-end="url(#mk-d2-2237930516-3488378134)" d="M208 365h430.5" class="connection stroke-B1 s0" mask="url(#d2-2237930516)"/><text x="424" y="363" class="text-italic fill-N2 s1"><tspan x="424" dy="0">이미</tspan><tspan x="424" dy="18.5">삼각행렬이다</tspan></text><path fill="none" marker-end="url(#mk-d2-2237930516-3488378134)" d="M166.777 397.918C360.2 497.8 449.6 523 608 523" class="connection stroke-B1 s0" mask="url(#d2-2237930516)"/><text x="377" y="500" class="text-italic fill-N2 s1"><tspan x="377" dy="0">3×3 이고</tspan><tspan x="377" dy="18.5">0 이 많다</tspan></text><path fill="none" marker-end="url(#mk-d2-2237930516-3488378134)" d="M140.39 403.437C355 625.2 451.5 681 617.5 681" class="connection stroke-B1 s0" mask="url(#d2-2237930516)"/><text x="344.5" y="612" class="text-italic fill-N2 s1"><tspan x="344.5" dy="0">그 밖의</tspan><tspan x="344.5" dy="18.5">모든 경우</tspan></text><mask id="d2-2237930516" width="1085" height="1021" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H984V920H-101z"/><path d="M252 103h187v37H252zM375 219h51v21h-51zM364 347h120v37H364zM339 484h76v37h-76zM302 596h85v37h-85z"/></mask></svg>