<svg xmlns="http://www.w3.org/2000/svg" width="1929" height="916" class="d2-2776424809 d2-svg" viewBox="-101 -101 1929 916"><rect width="1929" height="916" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2776424809 .fill-N1{fill:#0a0f25}.d2-2776424809 .fill-N2{fill:#676c7e}.d2-2776424809 .fill-B6{fill:#f7f8fe}.d2-2776424809 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="369" cy="357" class="shape stroke-B1 fill-B6 s0" rx="103" ry="40"/></g><text x="369" y="354.5" class="text-bold fill-N1 s1"><tspan x="369" dy="0">det A 를</tspan><tspan x="369" dy="18.5">구해야 한다</tspan></text></g><g ><g class="shape"><path d="M1450 0h259v114h-259z" class="stroke-B1 fill-B6 s0"/></g><text x="1579.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1579.5" dy="0">즉시 0 이다</tspan><tspan x="1579.5" dy="17.25">같은 두 행이나 열이 있다</tspan><tspan x="1579.5" dy="17.25">한 행이 전부 0 이다</tspan><tspan x="1579.5" dy="17.25">한 행이 다른 행의 배수다</tspan></text></g><g ><g class="shape"><path d="M1488 174h183v82h-183z" class="stroke-B1 fill-B6 s0"/></g><text x="1579.5" y="212.5" class="text-bold fill-N1 s1"><tspan x="1579.5" dy="0">2×2</tspan><tspan x="1579.5" dy="18.5">ad − bc 를 그대로</tspan></text></g><g ><g class="shape"><path d="M1431 316h296v82h-296z" class="stroke-B1 fill-B6 s0"/></g><text x="1579" y="354.5" class="text-bold fill-N1 s1"><tspan x="1579" dy="0">삼각행렬·대각행렬</tspan><tspan x="1579" dy="18.5">주대각선 원소를 모두 곱한다</tspan></text></g><g ><g class="shape"><path d="M1444 458h271v98h-271z" class="stroke-B1 fill-B6 s0"/></g><text x="1579.5" y="496.5" class="text-bold fill-N1 s1"><tspan x="1579.5" dy="0">여인자 전개</tspan><tspan x="1579.5" dy="17.667">0 이 가장 많은 행이나 열로</tspan><tspan x="1579.5" dy="17.667">부호는 체스판 무늬</tspan></text></g><g ><g class="shape"><path d="M1453 616h252v98h-252z" class="stroke-B1 fill-B6 s0"/></g><text x="1579" y="654.5" class="text-bold fill-N1 s1"><tspan x="1579" dy="0">행 연산으로 삼각화</tspan><tspan x="1579" dy="17.667">교환하면 부호를 뒤집고</tspan><tspan x="1579" dy="17.667">배수를 더하면 그대로</tspan></text></g><text x="368.5" y="473" class="fill-N1 s1"><tspan x="368.5" dy="0">여인자 전개는 n 이 커지면 n! 에 가까운 곱셈이 필요해 손으로도 기계로도 감당할 수 없다.</tspan><tspan x="368.5" dy="17.667">실제 계산은 거의 언제나 소거로 삼각화한 뒤 대각선을 곱한다.</tspan><tspan x="368.5" dy="17.667">소거는 3장에서 이미 배운 그 절차 그대로다</tspan></text><marker id="mk-d2-2776424809-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2776424809-3488378134)" d="M440.844 327.225C955 111.2 1157.1 57 1445.5 57" class="connection stroke-B1 s0" mask="url(#d2-2776424809)"/><text x="928.5" y="128" class="text-italic fill-N2 s1">행이나 열 사이에 눈에 띄는 관계가 있다</text><path fill="none" marker-end="url(#mk-d2-2776424809-3488378134)" d="M462.962 338.61C959.4 239.8 1164.7 215 1483.5 215" class="connection stroke-B1 s0" mask="url(#d2-2776424809)"/><text x="970.5" y="244" class="text-italic fill-N2 s1">2×2 다</text><path fill="none" marker-end="url(#mk-d2-2776424809-3488378134)" d="M474 357h953" class="connection stroke-B1 s0" mask="url(#d2-2776424809)"/><text x="952" y="363" class="text-italic fill-N2 s1">이미 삼각행렬이다</text><path fill="none" marker-end="url(#mk-d2-2776424809-3488378134)" d="M461.957 376.41C959.2 480.8 1155.9 507 1439.5 507" class="connection stroke-B1 s0" mask="url(#d2-2776424809)"/><text x="947.5" y="484" class="text-italic fill-N2 s1">3×3 이고 0 이 많다</text><path fill="none" marker-end="url(#mk-d2-2776424809-3488378134)" d="M438.838 387.79C954.6 609.4 1157.8 665 1449 665" class="connection stroke-B1 s0" mask="url(#d2-2776424809)"/><text x="928.5" y="604" class="text-italic fill-N2 s1">그 밖의 모든 경우</text><mask id="d2-2776424809" width="1929" height="916" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1929v916H-101z"/><path d="M763 112h331v21H763zM945 228h51v21h-51zM871 347h162v21H871zM875 468h145v21H875zM854 588h149v21H854z"/></mask></svg>