<svg xmlns="http://www.w3.org/2000/svg" width="2229" height="474" class="d2-1799388695 d2-svg" viewBox="-101 -101 2229 474"><rect width="2229" height="474" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1799388695 .fill-N1{fill:#0a0f25}.d2-1799388695 .fill-N2{fill:#676c7e}.d2-1799388695 .fill-B6{fill:#f7f8fe}.d2-1799388695 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="298.5" cy="140" class="shape stroke-B1 fill-B6 s0" rx="93.5" ry="31"/></g><text x="298.5" y="145.5" class="text-bold fill-N1 s1">벡터 u 와 v</text></g><g ><g class="shape"><path d="M880 16h200v82H880z" class="stroke-B1 fill-B6 s0"/></g><text x="980" y="54.5" class="text-bold fill-N1 s1"><tspan x="980" dy="0">내적 u · v</tspan><tspan x="980" dy="18.5">결과는 수(스칼라)</tspan></text></g><g ><g class="shape"><path d="M906 182h148v82H906z" class="stroke-B1 fill-B6 s0"/></g><text x="980" y="220.5" class="text-bold fill-N1 s1"><tspan x="980" dy="0">외적 u × v</tspan><tspan x="980" dy="18.5">결과는 벡터</tspan></text></g><g ><g class="shape"><path d="M1242 16h371v82h-371z" class="stroke-B1 fill-B6 s0"/></g><text x="1427.5" y="54.5" class="text-bold fill-N1 s1"><tspan x="1427.5" dy="0">‖u‖‖v‖ cos θ = Σ u_i v_i</tspan><tspan x="1427.5" dy="18.5">v 의 그림자 길이에 u 의 길이를 곱한 것</tspan></text></g><g ><g class="shape"><path d="M1248 174h360v98h-360z" class="stroke-B1 fill-B6 s0"/></g><text x="1428" y="212.5" class="text-bold fill-N1 s1"><tspan x="1428" dy="0">크기는 ‖u‖‖v‖ sin θ</tspan><tspan x="1428" dy="17.667">두 벡터가 만드는 평행사변형의 넓이</tspan><tspan x="1428" dy="17.667">방향은 그 평면에 수직</tspan></text></g><g ><g class="shape"><path d="M1795 0h212v114h-212z" class="stroke-B1 fill-B6 s0"/></g><text x="1901" y="38.5" class="text-bold fill-N1 s1"><tspan x="1901" dy="0">각을 잰다</tspan><tspan x="1901" dy="17.25">수직인지 판정한다</tspan><tspan x="1901" dy="17.25">길이와 거리를 잰다</tspan><tspan x="1901" dy="17.25">정사영을 만든다</tspan></text></g><g ><g class="shape"><path d="M1775 174h252v98h-252z" class="stroke-B1 fill-B6 s0"/></g><text x="1901" y="212.5" class="text-bold fill-N1 s1"><tspan x="1901" dy="0">평면의 법선을 구한다</tspan><tspan x="1901" dy="17.667">넓이를 잰다</tspan><tspan x="1901" dy="17.667">삼중곱으로 부피를 잰다</tspan></text></g><text x="298" y="247" class="fill-N1 s1"><tspan x="298" dy="0">내적이 0 이면 두 벡터가 수직이고, 외적이 영벡터면 두 벡터가 나란하다.</tspan><tspan x="298" dy="18.5">cos 과 sin 이 0 이 되는 자리가 정반대이기 때문이다</tspan></text><marker id="mk-d2-1799388695-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1799388695-3488378134)" d="M381.965 124.627C666.4 70.6 766.4 57 876 57" class="connection stroke-B1 s0" mask="url(#d2-1799388695)"/><text x="629" y="83" class="text-italic fill-N2 s1">차원 제한 없음</text><path fill="none" marker-end="url(#mk-d2-1799388695-3488378134)" d="M381.965 155.373C666.4 209.4 771.6 223 902 223" class="connection stroke-B1 s0" mask="url(#d2-1799388695)"/><text x="641" y="210" class="text-italic fill-N2 s1">R³ 에서만</text><path fill="none" marker-end="url(#mk-d2-1799388695-3488378134)" d="M1082 57h156" class="connection stroke-B1 s0" mask="url(#d2-1799388695)"/><path fill="none" marker-end="url(#mk-d2-1799388695-3488378134)" d="M1615 57h176" class="connection stroke-B1 s0" mask="url(#d2-1799388695)"/><path fill="none" marker-end="url(#mk-d2-1799388695-3488378134)" d="M1056 223h187.5" class="connection stroke-B1 s0" mask="url(#d2-1799388695)"/><path fill="none" marker-end="url(#mk-d2-1799388695-3488378134)" d="M1610.5 223H1771" class="connection stroke-B1 s0" mask="url(#d2-1799388695)"/><mask id="d2-1799388695" width="2229" height="474" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2229v474H-101z"/><path d="M566 67h126v21H566zM601 194h80v21h-80z"/></mask></svg>