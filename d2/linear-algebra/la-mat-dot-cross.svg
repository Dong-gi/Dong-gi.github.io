<svg xmlns="http://www.w3.org/2000/svg" width="953" height="926" class="d2-1115079531 d2-svg" viewBox="-89 -89 953 926"><rect width="953" height="926" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1115079531 .fill-N1{fill:#0a0f25}.d2-1115079531 .fill-N2{fill:#676c7e}.d2-1115079531 .fill-B6{fill:#f7f8fe}.d2-1115079531 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="389.5" cy="43" class="shape stroke-B1 fill-B6 s0" rx="93.5" ry="31"/></g><text x="389.5" y="48.5" class="text-bold fill-N1 s1">벡터 u 와 v</text></g><g ><g class="shape"><path d="M97 245h200v82H97z" class="stroke-B1 fill-B6 s0"/></g><text x="197" y="283.5" class="text-bold fill-N1 s1"><tspan x="197" dy="0">내적 u · v</tspan><tspan x="197" dy="18.5">결과는 수(스칼라)</tspan></text></g><g ><g class="shape"><path d="M509 245h148v82H509z" class="stroke-B1 fill-B6 s0"/></g><text x="583" y="283.5" class="text-bold fill-N1 s1"><tspan x="583" dy="0">외적 u × v</tspan><tspan x="583" dy="18.5">결과는 벡터</tspan></text></g><g ><g class="shape"><path d="M12 405h371v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="197.5" y="443.5" class="text-bold fill-N1 s1"><tspan x="197.5" dy="0">‖u‖‖v‖ cos θ = Σ u_i v_i</tspan><tspan x="197.5" dy="18.5">v 의 그림자 길이에 u 의 길이를 곱한 것</tspan></text></g><g ><g class="shape"><path d="M403 397h360v98H403z" class="stroke-B1 fill-B6 s0"/></g><text x="583" y="435.5" class="text-bold fill-N1 s1"><tspan x="583" dy="0">크기는 ‖u‖‖v‖ sin θ</tspan><tspan x="583" dy="17.667">두 벡터가 만드는 평행사변형의 넓이</tspan><tspan x="583" dy="17.667">방향은 그 평면에 수직</tspan></text></g><g ><g class="shape"><path d="M91 565h212v114H91z" class="stroke-B1 fill-B6 s0"/></g><text x="197" y="603.5" class="text-bold fill-N1 s1"><tspan x="197" dy="0">각을 잰다</tspan><tspan x="197" dy="17.25">수직인지 판정한다</tspan><tspan x="197" dy="17.25">길이와 거리를 잰다</tspan><tspan x="197" dy="17.25">정사영을 만든다</tspan></text></g><g ><g class="shape"><path d="M457 565h252v98H457z" class="stroke-B1 fill-B6 s0"/></g><text x="583" y="603.5" class="text-bold fill-N1 s1"><tspan x="583" dy="0">평면의 법선을 구한다</tspan><tspan x="583" dy="17.667">넓이를 잰다</tspan><tspan x="583" dy="17.667">삼중곱으로 부피를 잰다</tspan></text></g><text x="387" y="715" class="fill-N1 s1"><tspan x="387" dy="0">내적이 0 이면 두 벡터가 수직이고, 외적이 영벡터면 두 벡터가 나란하다.</tspan><tspan x="387" dy="18.5">cos 과 sin 이 0 이 되는 자리가 정반대이기 때문이다</tspan></text><marker id="mk-d2-1115079531-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1115079531-3488378134)" d="m359.004 74 .06 30s.019 10-9.981 10H207.5s-10 0-10 10v117" class="connection stroke-B1 s0" mask="url(#d2-1115079531)"/><text x="234" y="120" class="text-italic fill-N2 s1">차원 제한 없음</text><path fill="none" marker-end="url(#mk-d2-1115079531-3488378134)" d="m421.02 74 .297 30s.099 10 10.099 10H573s10 0 10 10v117" class="connection stroke-B1 s0" mask="url(#d2-1115079531)"/><text x="547" y="120" class="text-italic fill-N2 s1">R³ 에서만</text><path fill="none" marker-end="url(#mk-d2-1115079531-3488378134)" d="M197.5 329v72" class="connection stroke-B1 s0" mask="url(#d2-1115079531)"/><path fill="none" marker-end="url(#mk-d2-1115079531-3488378134)" d="M197.5 489v72" class="connection stroke-B1 s0" mask="url(#d2-1115079531)"/><path fill="none" marker-end="url(#mk-d2-1115079531-3488378134)" d="M583 329v64" class="connection stroke-B1 s0" mask="url(#d2-1115079531)"/><path fill="none" marker-end="url(#mk-d2-1115079531-3488378134)" d="M583 497v64" class="connection stroke-B1 s0" mask="url(#d2-1115079531)"/><mask id="d2-1115079531" width="953" height="926" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h953v926H-89z"/><path d="M171 104h126v21H171zM5