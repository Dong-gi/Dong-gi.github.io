<svg xmlns="http://www.w3.org/2000/svg" width="1378" height="1762" class="d2-2420964992 d2-svg" viewBox="-101 -101 1378 1762"><rect width="1378" height="1762" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2420964992 .fill-N1{fill:#0a0f25}.d2-2420964992 .fill-B6{fill:#f7f8fe}.d2-2420964992 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="263.5" cy="48" class="shape stroke-B1 fill-B6 s0" rx="143.5" ry="48"/></g><text x="263.5" y="53.5" class="text-bold fill-N1 s1">임의의 m × n 행렬 A</text></g><g ><g class="shape"><path d="M39 196h448v82H39z" class="stroke-B1 fill-B6 s0"/></g><text x="263" y="234.5" class="text-bold fill-N1 s1"><tspan x="263" dy="0">A^T A 를 만든다</tspan><tspan x="263" dy="18.5">n × n 이고 언제나 대칭이며 고유값이 0 이상이다</tspan></text></g><g ><g class="shape"><path d="M51 378h424v82H51z" class="stroke-B1 fill-B6 s0"/></g><text x="263" y="416.5" class="text-bold fill-N1 s1"><tspan x="263" dy="0">A^T A 를 직교대각화한다 (8장 스펙트럼 정리)</tspan><tspan x="263" dy="18.5">고유값 λ_1 ≥ λ_2 ≥ … ≥ λ_n ≥ 0</tspan></text></g><g ><g class="shape"><path d="M101 560h325v82H101z" class="stroke-B1 fill-B6 s0"/></g><text x="263.5" y="598.5" class="text-bold fill-N1 s1"><tspan x="263.5" dy="0">특이값 σ_i = √λ_i</tspan><tspan x="263.5" dy="18.5">0 이 아닌 것의 개수가 계수 r 이다</tspan></text></g><g ><g class="shape"><path d="M90 742h347v82H90z" class="stroke-B1 fill-B6 s0"/></g><text x="263.5" y="780.5" class="text-bold fill-N1 s1"><tspan x="263.5" dy="0">V 의 열 = A^T A 의 정규직교 고유벡터</tspan><tspan x="263.5" dy="18.5">오른쪽 특이벡터</tspan></text></g><g ><g class="shape"><path d="M71 924h385v82H71z" class="stroke-B1 fill-B6 s0"/></g><text x="263.5" y="962.5" class="text-bold fill-N1 s1"><tspan x="263.5" dy="0">u_i = A v_i / σ_i (i ≤ r)</tspan><tspan x="263.5" dy="18.5">왼쪽 특이벡터. 저절로 정규직교가 된다</tspan></text></g><g ><g class="shape"><path d="M0 1106h526v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="263" y="1144.5" class="text-bold fill-N1 s1"><tspan x="263" dy="0">i &gt; r 이면 A v_i = 0 이다</tspan><tspan x="263" dy="18.5">남는 u 자리는 A^T 의 영공간에서 정규직교기저로 채운다</tspan></text></g><g ><g class="shape"><ellipse cx="263.5" cy="1317" class="shape stroke-B1 fill-B6 s0" rx="87.5" ry="29"/></g><text x="263.5" y="1322.5" class="text-bold fill-N1 s1">A = U Σ V^T</text></g><g ><g class="shape"><path d="M67 1446h392v114H67z" class="stroke-B1 fill-B6 s0"/></g><text x="263" y="1484.5" class="text-bold fill-N1 s1"><tspan x="263" dy="0">검산 세 가지</tspan><tspan x="263" dy="17.25">곱 σ_1 σ_2 … σ_n = |det A| (정사각일 때)</tspan><tspan x="263" dy="17.25">제곱 합 Σ σ_i² = 성분의 제곱 합</tspan><tspan x="263" dy="17.25">A v_i 를 실제로 계산해 σ_i u_i 와 맞춰 본다</tspan></text></g><text x="821.5" y="46" class="fill-N1 s1"><tspan x="821.5" dy="0">A A^T 로 시작해 U 를 먼저 구해도 된다. 크기가 작은 쪽을 잡는 것이 손계산에 유리하다.</tspan><tspan x="821.5" dy="18.5">두 행렬은 0 이 아닌 고유값이 서로 같아서 어느 쪽으로 가든 특이값은 같다</tspan></text><marker id="mk-d2-2420964992-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2420964992-3488378134)" d="M263 98v94" class="connection stroke-B1 s0" mask="url(#d2-2420964992)"/><path fill="none" marker-end="url(#mk-d2-2420964992-3488378134)" d="M263 280v94" class="connection stroke-B1 s0" mask="url(#d2-2420964992)"/><path fill="none" marker-end="url(#mk-d2-2420964992-3488378134)" d="M263 462v94" class="connection stroke-B1 s0" mask="url(#d2-2420964992)"/><path fill="none" marker-end="url(#mk-d2-2420964992-3488378134)" d="M263 644v94" class="connection stroke-B1 s0" mask="url(#d2-2420964992)"/><path fill="none" marker-end="url(#mk-d2-2420964992-3488378134)" d="M263 826v94" class="connection stroke-B1 s0" mask="url(#d2-2420964992)"/><path fill="none" marker-end="url(#mk-d2-2420964992-3488378134)" d="M263 1008v94" class="connection stroke-B1 s0" mask="url(#d2-2420964992)"/><path fill="none" marker-end="url(#mk-d2-2420964992-3488378134)" d="M263 1190v94" class="connection stroke-B1 s0" mask="url(#d2-2420964992)"/><path fill="none" marker-end="url(#mk-d2-2420964992-3488378134)" d="M263 1348v94" class="connection stroke-B1 s0" mask="url(#d2-2420964992)"/><mask id="d2-2420964992" width="1378" height="1762" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1378v1762H-101z"/></mask></svg>