<svg xmlns="http://www.w3.org/2000/svg" width="1102" height="1795" class="d2-732075771 d2-svg" viewBox="-101 -101 1102 1795"><rect width="1102" height="1795" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-732075771 .text-bold{font-weight:700}.d2-732075771 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-732075771 .fill-N1{fill:#0a0f25}.d2-732075771 .fill-N2{fill:#676c7e}.d2-732075771 .fill-N4{fill:#cfd2dd}.d2-732075771 .fill-B6{fill:#f7f8fe}.d2-732075771 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="342" cy="46.5" class="shape stroke-B1 fill-B6 s0" rx="140" ry="46.5"/></g><text x="342" y="52" class="text-bold fill-N1 s1">Ax = b 를 풀고 싶다</text></g><g ><g class="shape"><path d="M342 285h-5L83 240c-3 0-3-1 0-2l254-45h9l254 45c3 0 3 1 0 2l-253 45z" class="stroke-B1 fill-N4 s0"/></g><text x="342" y="244.5" class="text-bold fill-N1 s1">b 가 A 의 열공간 안에 있는가?</text></g><g ><g class="shape"><path d="M0 414h326v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="163" y="452.5" class="text-bold fill-N1 s1"><tspan x="163" dy="0">해가 있다</tspan><tspan x="163" dy="18.5">3장의 가우스 소거법으로 구한다</tspan></text></g><g ><g class="shape"><path d="M386 406h270v98H386z" class="stroke-B1 fill-B6 s0"/></g><text x="521" y="444.5" class="text-bold fill-N1 s1"><tspan x="521" dy="0">해가 없다</tspan><tspan x="521" dy="17.667">대신 ‖b − Ax‖ 를</tspan><tspan x="521" dy="17.667">가장 작게 하는 x 를 구한다</tspan></text></g><g ><g class="shape"><path d="M357 604h328v82H357z" class="stroke-B1 fill-B6 s0"/></g><text x="521" y="642.5" class="text-bold fill-N1 s1"><tspan x="521" dy="0">b 를 열공간에 수직으로 내린다</tspan><tspan x="521" dy="18.5">Ax = proj b 가 되는 x 를 찾는 것이다</tspan></text></g><g ><g class="shape"><path d="M369 786h304v82H369z" class="stroke-B1 fill-B6 s0"/></g><text x="521" y="824.5" class="text-bold fill-N1 s1"><tspan x="521" dy="0">잔차 r = b − Ax 가 열공간과 직교</tspan><tspan x="521" dy="18.5">곧 A 의 모든 열과 내적이 0</tspan></text></g><g ><g class="shape"><path d="M446 968h150v82H446z" class="stroke-B1 fill-B6 s0"/></g><text x="521" y="1006.5" class="text-bold fill-N1 s1"><tspan x="521" dy="0">정규방정식</tspan><tspan x="521" dy="18.5">A^T A x = A^T b</tspan></text></g><g ><g class="shape"><path d="M300 1282h-4l-218-45c-2 0-2-1 0-2l218-45h8l218 45c2 0 2 1 0 2l-218 45z" class="stroke-B1 fill-N4 s0"/></g><text x="300" y="1241.5" class="text-bold fill-N1 s1">A 의 열이 일차독립인가?</text></g><g ><g class="shape"><path d="M20 1414h240v82H20z" class="stroke-B1 fill-B6 s0"/></g><text x="140" y="1452.5" class="text-bold fill-N1 s1"><tspan x="140" dy="0">A^T A 가 가역이다</tspan><tspan x="140" dy="18.5">x = (A^T A)⁻¹ A^T b 하나뿐</tspan></text></g><g ><g class="shape"><path d="M320 1406h281v98H320z" class="stroke-B1 fill-B6 s0"/></g><text x="460.5" y="1444.5" class="text-bold fill-N1 s1"><tspan x="460.5" dy="0">최소제곱해가 무수히 많다</tspan><tspan x="460.5" dy="17.667">그중 길이가 가장 짧은 것을</tspan><tspan x="460.5" dy="17.667">고른다 (10장의 의사역행렬)</tspan></text></g><g ><g class="shape"><path d="M584 1187h316v98H584z" class="stroke-B1 fill-B6 s0"/></g><text x="742" y="1225.5" class="text-bold fill-N1 s1"><tspan x="742" dy="0">실제 계산은 QR 분해로 한다</tspan><tspan x="742" dy="17.667">A = QR 이면 R x = Q^T b</tspan><tspan x="742" dy="17.667">상삼각행렬 하나만 풀면 끝난다</tspan></text></g><text x="450" y="1540" class="fill-N1 s1"><tspan x="450" dy="0">정규방정식은 새로운 원리가 아니라</tspan><tspan x="450" dy="17.25">‘수선의 발이 가장 가깝다’ 를 식으로 옮긴 것이다.</tspan><tspan x="450" dy="17.25">5장에서 점과 직선 사이의 거리를 정사영으로 구한 계산이</tspan><tspan x="450" dy="17.25">차원만 올라간 것이다</tspan></text><marker id="mk-d2-732075771-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-732075771-3488378134)" d="M342 95v94" class="connection stroke-B1 s0" mask="url(#d2-732075771)"/><path fill="none" marker-end="url(#mk-d2-732075771-3488378134)" d="M279.283 276.026C186.6 331.4 163 359.3 163 410.5" class="connection stroke-B1 s0" mask="url(#d2-732075771)"/><text x="194.5" y="332" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-732075771-3488378134)" d="M404.717 276.026C497.4 331.4 521 357.7 521 402.5" class="connection stroke-B1 s0" mask="url(#d2-732075771)"/><text x="486.5" y="330" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-732075771-3488378134)" d="M521 506v94" class="connection stroke-B1 s0" mask="url(#d2-732075771)"/><path fill="none" marker-end="url(#mk-d2-732075771-3488378134)" d="M521 688v94" class="connection stroke-B1 s0" mask="url(#d2-732075771)"/><path fill="none" marker-end="url(#mk-d2-732075771-3488378134)" d="M521 870v94" class="connection stroke-B1 s0" mask="url(#d2-732075771)"/><path fill="none" marker-end="url(#mk-d2-732075771-3488378134)" d="M444.206 1047.385C329.2 1104.1 300 1132.8 300 1186" class="connection stroke-B1 s0" mask="url(#d2-732075771)"/><path fill="none" marker-end="url(#mk-d2-732075771-3488378134)" d="M245.35 1273.13c-84.15 57.67-105.6 86.17-105.6 137.37" class="connection stroke-B1 s0" mask="url(#d2-732075771)"/><text x="166.5" y="1333" class="text-italic fill-N2 s1">독립</text><path fill="none" marker-end="url(#mk-d2-732075771-3488378134)" d="M354.65 1273.13c84.15 57.67 105.6 84.57 105.6 129.37" class="connection stroke-B1 s0" mask="url(#d2-732075771)"/><text x="430.5" y="1330" class="text-italic fill-N2 s1">종속</text><path fill="none" marker-end="url(#mk-d2-732075771-3488378134)" d="M597.794 1047.385C712.8 1104.1 742 1132.3 742 1183.5" class="connection stroke-B1 s0" mask="url(#d2-732075771)"/><text x="697" y="1094" class="text-italic fill-N2 s1"><tspan x="697" dy="0">A^T A 를 직접 만들면</tspan><tspan x="697" dy="18.5">조건수가 제곱된다</tspan></text><mask id="d2-732075771" width="1102" height="1795" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1102v1795H-101z"/><path d="M173 316h43v21h-43zM465 314h43v21h-43zM145 1317h43v21h-43zM409 1314h43v21h-43zM614 1078h166v37H614z"/></mask></svg>