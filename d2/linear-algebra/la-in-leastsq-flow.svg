<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="1658" class="d2-3128165841 d2-svg" viewBox="-101 -101 1504 1658"><rect width="1504" height="1658" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3128165841 .fill-N1{fill:#0a0f25}.d2-3128165841 .fill-N2{fill:#676c7e}.d2-3128165841 .fill-N4{fill:#cfd2dd}.d2-3128165841 .fill-B6{fill:#f7f8fe}.d2-3128165841 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="376" cy="46.5" class="shape stroke-B1 fill-B6 s0" rx="140" ry="46.5"/></g><text x="376" y="52" class="text-bold fill-N1 s1">Ax = b 를 풀고 싶다</text></g><g ><g class="shape"><path d="M376 285h-5l-254-45c-3 0-3-1 0-2l254-45h9l254 45c3 0 3 1 0 2l-253 45z" class="stroke-B1 fill-N4 s0"/></g><text x="376" y="244.5" class="text-bold fill-N1 s1">b 가 A 의 열공간 안에 있는가?</text></g><g ><g class="shape"><path d="M0 406h326v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="163" y="444.5" class="text-bold fill-N1 s1"><tspan x="163" dy="0">해가 있다</tspan><tspan x="163" dy="18.5">3장의 가우스 소거법으로 구한다</tspan></text></g><g ><g class="shape"><path d="M386 406h406v82H386z" class="stroke-B1 fill-B6 s0"/></g><text x="589" y="444.5" class="text-bold fill-N1 s1"><tspan x="589" dy="0">해가 없다</tspan><tspan x="589" dy="18.5">대신 ‖b − Ax‖ 를 가장 작게 하는 x 를 구한다</tspan></text></g><g ><g class="shape"><path d="M425 588h328v82H425z" class="stroke-B1 fill-B6 s0"/></g><text x="589" y="626.5" class="text-bold fill-N1 s1"><tspan x="589" dy="0">b 를 열공간에 수직으로 내린다</tspan><tspan x="589" dy="18.5">Ax = proj b 가 되는 x 를 찾는 것이다</tspan></text></g><g ><g class="shape"><path d="M437 770h304v82H437z" class="stroke-B1 fill-B6 s0"/></g><text x="589" y="808.5" class="text-bold fill-N1 s1"><tspan x="589" dy="0">잔차 r = b − Ax 가 열공간과 직교</tspan><tspan x="589" dy="18.5">곧 A 의 모든 열과 내적이 0</tspan></text></g><g ><g class="shape"><path d="M514 952h150v82H514z" class="stroke-B1 fill-B6 s0"/></g><text x="589" y="990.5" class="text-bold fill-N1 s1"><tspan x="589" dy="0">정규방정식</tspan><tspan x="589" dy="18.5">A^T A x = A^T b</tspan></text></g><g ><g class="shape"><path d="M368 1250h-4l-218-45c-2 0-2-1 0-2l218-45h8l218 45c2 0 2 1 0 2l-218 45z" class="stroke-B1 fill-N4 s0"/></g><text x="368" y="1209.5" class="text-bold fill-N1 s1">A 의 열이 일차독립인가?</text></g><g ><g class="shape"><path d="M28 1374h240v82H28z" class="stroke-B1 fill-B6 s0"/></g><text x="148" y="1412.5" class="text-bold fill-N1 s1"><tspan x="148" dy="0">A^T A 가 가역이다</tspan><tspan x="148" dy="18.5">x = (A^T A)⁻¹ A^T b 하나뿐</tspan></text></g><g ><g class="shape"><path d="M328 1374h519v82H328z" class="stroke-B1 fill-B6 s0"/></g><text x="587.5" y="1412.5" class="text-bold fill-N1 s1"><tspan x="587.5" dy="0">최소제곱해가 무수히 많다</tspan><tspan x="587.5" dy="18.5">그중 길이가 가장 짧은 것을 고른다 (10장의 의사역행렬)</tspan></text></g><g ><g class="shape"><path d="M652 1155h316v98H652z" class="stroke-B1 fill-B6 s0"/></g><text x="810" y="1193.5" class="text-bold fill-N1 s1"><tspan x="810" dy="0">실제 계산은 QR 분해로 한다</tspan><tspan x="810" dy="17.667">A = QR 이면 R x = Q^T b</tspan><tspan x="810" dy="17.667">상삼각행렬 하나만 풀면 끝난다</tspan></text></g><text x="939" y="44" class="fill-N1 s1"><tspan x="939" dy="0">정규방정식은 새로운 원리가 아니라 ‘수선의 발이 가장 가깝다’ 를 식으로 옮긴 것이다.</tspan><tspan x="939" dy="18.5">5장에서 점과 직선 사이의 거리를 정사영으로 구한 계산이 차원만 올라간 것이다</tspan></text><marker id="mk-d2-3128165841-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3128165841-3488378134)" d="M376 95v94" class="connection stroke-B1 s0" mask="url(#d2-3128165841)"/><path fill="none" marker-end="url(#mk-d2-3128165841-3488378134)" d="M304.216 273.904C191.6 331 163 357.7 163 402.5" class="connection stroke-B1 s0" mask="url(#d2-3128165841)"/><text x="209.5" y="327" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-3128165841-3488378134)" d="M447.784 273.904C560.4 331 589 357.7 589 402.5" class="connection stroke-B1 s0" mask="url(#d2-3128165841)"/><text x="542.5" y="327" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-3128165841-3488378134)" d="M589 490v94" class="connection stroke-B1 s0" mask="url(#d2-3128165841)"/><path fill="none" marker-end="url(#mk-d2-3128165841-3488378134)" d="M589 672v94" class="connection stroke-B1 s0" mask="url(#d2-3128165841)"/><path fill="none" marker-end="url(#mk-d2-3128165841-3488378134)" d="M589 854v94" class="connection stroke-B1 s0" mask="url(#d2-3128165841)"/><path fill="none" marker-end="url(#mk-d2-3128165841-3488378134)" d="M512.182 1028.334C397.2 1081.1 368 1107.2 368 1154" class="connection stroke-B1 s0" mask="url(#d2-3128165841)"/><path fill="none" marker-end="url(#mk-d2-3128165841-3488378134)" d="M298.214 1237.9c-119.614 60.3-149.964 87.8-149.964 132.6" class="connection stroke-B1 s0" mask="url(#d2-3128165841)"/><text x="199.5" y="1293" class="text-italic fill-N2 s1">독립</text><path fill="none" marker-end="url(#mk-d2-3128165841-3488378134)" d="M437.786 1237.9c119.614 60.3 149.964 87.8 149.964 132.6" class="connection stroke-B1 s0" mask="url(#d2-3128165841)"/><text x="536.5" y="1293" class="text-italic fill-N2 s1">종속</text><path fill="none" marker-end="url(#mk-d2-3128165841-3488378134)" d="M665.818 1028.334C780.8 1081.1 810 1106.7 810 1151.5" class="connection stroke-B1 s0" mask="url(#d2-3128165841)"/><text x="762" y="1078" class="text-italic fill-N2 s1">A^T A 를 직접 만들면 조건수가 제곱된다</text><mask id="d2-3128165841" width="1504" height="1658" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1504v1658H-101z"/><path d="M188 311h43v21h-43zM521 311h43v21h-43zM178 1277h43v21h-43zM515 1277h43v21h-43zM599 1062h326v21H599z"/></mask></svg>