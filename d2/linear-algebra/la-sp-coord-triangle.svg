<svg xmlns="http://www.w3.org/2000/svg" width="1784" height="583" class="d2-1671758372 d2-svg" viewBox="-101 -101 1784 583"><rect width="1784" height="583" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1671758372 .fill-N1{fill:#0a0f25}.d2-1671758372 .fill-N2{fill:#676c7e}.d2-1671758372 .fill-B6{fill:#f7f8fe}.d2-1671758372 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><circle cx="219" cy="142" r="142" class="shape stroke-B1 fill-B6 s0"/></g><text x="219" y="139.5" class="text-bold fill-N1 s1"><tspan x="219" dy="0">벡터 v</tspan><tspan x="219" dy="18.5">기저와 무관한 실체</tspan></text></g><g ><g class="shape"><path d="M833 147h187v82H833z" class="stroke-B1 fill-B6 s0"/></g><text x="926.5" y="185.5" class="text-bold fill-N1 s1"><tspan x="926.5" dy="0">기저 B 로 잰 좌표</tspan><tspan x="926.5" dy="18.5">[v]_B</tspan></text></g><g ><g class="shape"><path d="M1384 101h198v82h-198z" class="stroke-B1 fill-B6 s0"/></g><text x="1483" y="139.5" class="text-bold fill-N1 s1"><tspan x="1483" dy="0">기저 B′ 로 잰 좌표</tspan><tspan x="1483" dy="18.5">[v]_B′</tspan></text></g><text x="218.5" y="360" class="fill-N1 s1"><tspan x="218.5" dy="0">구하는 법: [B′ | B] 를 소거해 [I | P(B→B′)] 로 만든다.</tspan><tspan x="218.5" dy="18.5">두 전이행렬은 서로 역행렬이다 — P(B′→B) = (P(B→B′))⁻¹</tspan></text><marker id="mk-d2-1671758372-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1671758372-3488378134)" d="M361.988 157.222C580 181.6 674.6 187.75 829 187.75" class="connection stroke-B1 s0" mask="url(#d2-1671758372)"/><text x="595.5" y="188" class="text-italic fill-N2 s1">B 의 눈금으로 읽는다</text><path fill="none" marker-end="url(#mk-d2-167175837