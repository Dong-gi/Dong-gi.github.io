<svg xmlns="http://www.w3.org/2000/svg" width="678" height="981" class="d2-1526147811 d2-svg" viewBox="-97 -101 678 981"><rect width="678" height="981" x="-97" y="-101" rx="0" style="fill:#fff"/><style>.d2-1526147811 .text-bold{font-weight:700}.d2-1526147811 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1526147811 .fill-N1{fill:#0a0f25}.d2-1526147811 .fill-N2{fill:#676c7e}.d2-1526147811 .fill-B6{fill:#f7f8fe}.d2-1526147811 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><circle cx="232" cy="142" r="142" class="shape stroke-B1 fill-B6 s0"/></g><text x="232" y="139.5" class="text-bold fill-N1 s1"><tspan x="232" dy="0">벡터 v</tspan><tspan x="232" dy="18.5">기저와 무관한 실체</tspan></text></g><g ><g class="shape"><path d="M251 405h187v82H251z" class="stroke-B1 fill-B6 s0"/></g><text x="344.5" y="443.5" class="text-bold fill-N1 s1"><tspan x="344.5" dy="0">기저 B 로 잰 좌표</tspan><tspan x="344.5" dy="18.5">[v]_B</tspan></text></g><g ><g class="shape"><path d="M155 608h198v82H155z" class="stroke-B1 fill-B6 s0"/></g><text x="254" y="646.5" class="text-bold fill-N1 s1"><tspan x="254" dy="0">기저 B′ 로 잰 좌표</tspan><tspan x="254" dy="18.5">[v]_B′</tspan></text></g><text x="264" y="726" class="fill-N1 s1"><tspan x="264" dy="0">구하는 법: [B′ | B] 를 소거해</tspan><tspan x="264" dy="17.25">[I | P(B→B′)] 로 만든다.</tspan><tspan x="264" dy="17.25">두 전이행렬은 서로 역행렬이다 —</tspan><tspan x="264" dy="17.25">P(B′→B) = (P(B→B′))⁻¹</tspan></text><marker id="mk-d2-1526147811-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1526147811-3488378134)" d="M301.974 267.747C336 328.8 344.75 356.7 344.75 401.5" class="connection stroke-B1 s0" mask="url(#d2-1526147811)"/><text x="336.5" y="337" class="text-italic fill-N2 s1">B 의 눈금으로 읽는다</text><path fill="none" marker-end="url(#mk-d2-1526147811-3488378134)" d="M149.867 259.648C103.4 327.2 91.5 364.8 91.5 395.25s19.2 164.45 92.624 211.105" class="connection stroke-B1 s0" mask="url(#d2-1526147811)"/><text x="94.5" y="452" class="text-italic fill-N2 s1">B′ 의 눈금으로 읽는다</text><path fill="none" marker-end="url(#mk-d2-1526147811-3488378134)" d="M306.924 487.998C265.05 535.3 254.25 559.7 254.25 604.5" class="connection stroke-B1 s0" mask="url(#d2-1526147811)"/><text x="262.5" y="546" class="text-italic fill-N2 s1">P(B→B′) 를 곱한다</text><path fill="none" marker-end="url(#mk-d2-1526147811-3488378134)" d="M328.991 607.516c84.659-47.816 95.459-72.216 54.91-118.021" class="connection stroke-B1 s0" mask="url(#d2-1526147811)"/><text x="410.5" y="567" class="text-italic fill-N2 s1">P(B′→B) 를 곱한다</text><mask id="d2-1526147811" width="678" height="981" x="-97" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-97-101h678v981H-97z"/><path d="M248 321h177v21H248zM1 436h187v21H1zM190 530h145v21H190zM338 551h145v21H338z"/></mask></svg>