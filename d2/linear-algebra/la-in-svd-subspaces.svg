<svg xmlns="http://www.w3.org/2000/svg" width="2403" height="722" class="d2-2677925571 d2-svg" viewBox="90 -85 2403 722"><rect width="2403" height="722" x="90" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2677925571 .fill-N1{fill:#0a0f25}.d2-2677925571 .fill-N2{fill:#676c7e}.d2-2677925571 .fill-B4{fill:#e3e9fd}.d2-2677925571 .fill-B5{fill:#edf0fd}.d2-2677925571 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M442 56h242v316H442z" class="stroke-B1 fill-B4 s0"/></g><text x="563" y="43" class="text-bold fill-N1 s1">정의역 R^n — x 가 사는 곳</text></g><g ><g class="shape"><path d="M2009 56h361v480h-361z" class="stroke-B1 fill-B4 s0"/></g><text x="2189.5" y="43" class="text-bold fill-N1 s1">공역 R^m — Ax 와 b 가 사는 곳</text></g><text x="563.5" y="438" class="fill-N1 s2"><tspan x="563.5" dy="0">계수 r = 0 이 아닌 특이값의 개수다.</tspan><tspan x="563.5" dy="17.667">네 기저가 모두 정규직교라서 사영도 최소제곱도 낮은 계수 근사도 여기서 곧바로 나온다.</tspan><tspan x="563.5" dy="17.667">b 를 열공간에 사영하려면 u_1 … u_r 과의 내적만 남기면 되고, 왼쪽 영공간 성분이 잔차다</tspan></text><g ><g class="shape"><path d="M484 86h159v98H484z" class="stroke-B1 fill-B5 s0"/></g><text x="563.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="563.5" dy="0">행공간 Row(A)</tspan><tspan x="563.5" dy="17.667">기저 v_1 … v_r</tspan><tspan x="563.5" dy="17.667">차원 r</tspan></text></g><g ><g class="shape"><path d="M472 244h182v98H472z" class="stroke-B1 fill-B5 s0"/></g><text x="563" y="282.5" class="text-bold fill-N1 s2"><tspan x="563" dy="0">영공간 N(A)</tspan><tspan x="563" dy="17.667">기저 v_{r+1} … v_n</tspan><tspan x="563" dy="17.667">차원 n − r</tspan></text></g><g ><g class="shape"><path d="M2112 86h155v98h-155z" class="stroke-B1 fill-B5 s0"/></g><text x="2189.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="2189.5" dy="0">열공간 Col(A)</tspan><tspan x="2189.5" dy="17.667">기저 u_1 … u_r</tspan><tspan x="2189.5" dy="17.667">차원 r</tspan></text></g><g ><g class="shape"><circle cx="2189.5" cy="293.5" r="38.5" class="shape stroke-B1 fill-B5 s0"/></g><text x="2189.5" y="299" class="text-bold fill-N1 s2">0</text></g><g ><g class="shape"><path d="M2039 392h301v114h-301z" class="stroke-B1 fill-B5 s0"/></g><text x="2189.5" y="430.5" class="text-bold fill-N1 s2"><tspan x="2189.5" dy="0">왼쪽 영공간</tspan><tspan x="2189.5" dy="17.25">기저 u_{r+1} … u_m</tspan><tspan x="2189.5" dy="17.25">차원 m − r</tspan><tspan x="2189.5" dy="17.25">Ax 로는 절대 닿지 못하는 방향</tspan></text></g><marker id="mk-d2-2677925571-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2677925571-3488378134)" d="M645.5 135h1462" class="connection stroke-B1 s0" mask="url(#d2-2677925571)"/><text x="1377.5" y="141" class="text-italic fill-N2 s2">A v_i = σ_i u_i — 방향은 그대로, 길이만 σ_i 배</text><path fill="none" marker-end="url(#mk-d2-2677925571-3488378134)" d="M656 293h1491" class="connection stroke-B1 s0" mask="url(#d2-2677925571)"/><text x="1402.5" y="299" class="text-italic fill-N2 s2">A v_i = 0 — 납작하게 눌린다</text><mask id="d2-2677925571" width="2403" height="722" x="90" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M90-85h2403v722H90z"/><path d="M1205 125h345v21h-345zM1295 283h215v21h-215z"/></mask></svg>