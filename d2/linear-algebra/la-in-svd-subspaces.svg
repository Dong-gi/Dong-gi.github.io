<svg xmlns="http://www.w3.org/2000/svg" width="2298" height="722" class="d2-1140664409 d2-svg" viewBox="72 -85 2298 722"><rect width="2298" height="722" x="72" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1140664409 .fill-N1{fill:#0a0f25}.d2-1140664409 .fill-N2{fill:#676c7e}.d2-1140664409 .fill-B4{fill:#e3e9fd}.d2-1140664409 .fill-B5{fill:#edf0fd}.d2-1140664409 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M425 56h242v316H425z" class="stroke-B1 fill-B4 s0"/></g><text x="546" y="43" class="text-bold fill-N1 s1">정의역 R^n — x 가 사는 곳</text></g><g ><g class="shape"><path d="M1886 56h361v480h-361z" class="stroke-B1 fill-B4 s0"/></g><text x="2066.5" y="43" class="text-bold fill-N1 s1">공역 R^m — Ax 와 b 가 사는 곳</text></g><text x="545.5" y="438" class="fill-N1 s2"><tspan x="545.5" dy="0">랭크 r = 0 이 아닌 특이값의 개수다.</tspan><tspan x="545.5" dy="17.667">네 기저가 모두 정규직교라서 사영도 최소제곱도 낮은 계수 근사도 여기서 곧바로 나온다.</tspan><tspan x="545.5" dy="17.667">b 를 열공간에 사영하려면 u_1 … u_r 과의 내적만 남기면 되고, 왼쪽 영공간 성분이 잔차다</tspan></text><g ><g class="shape"><path d="M466 86h159v98H466z" class="stroke-B1 fill-B5 s0"/></g><text x="545.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="545.5" dy="0">행공간 Row(A)</tspan><tspan x="545.5" dy="17.667">기저 v_1 … v_r</tspan><tspan x="545.5" dy="17.667">차원 r</tspan></text></g><g ><g class="shape"><path d="M455 244h182v98H455z" class="stroke-B1 fill-B5 s0"/></g><text x="546" y="282.5" class="text-bold fill-N1 s2"><tspan x="546" dy="0">영공간 N(A)</tspan><tspan x="546" dy="17.667">기저 v_{r+1} … v_n</tspan><tspan x="546" dy="17.667">차원 n − r</tspan></text></g><g ><g class="shape"><path d="M1989 86h155v98h-155z" class="stroke-B1 fill-B5 s0"/></g><text x="2066.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="2066.5" dy="0">열공간 Col(A)</tspan><tspan x="2066.5" dy="17.667">기저 u_1 … u_r</tspan><tspan x="2066.5" dy="17.667">차원 r</tspan></text></g><g ><g class="shape"><circle cx="2066.5" cy="293.5" r="38.5" class="shape stroke-B1 fill-B5 s0"/></g><text x="2066.5" y="299" class="text-bold fill-N1 s2">0</text></g><g ><g class="shape"><path d="M1916 392h301v114h-301z" class="stroke-B1 fill-B5 s0"/></g><text x="2066.5" y="430.5" class="text-bold fill-N1 s2"><tspan x="2066.5" dy="0">왼쪽 영공간</tspan><tspan x="2066.5" dy="17.25">기저 u_{r+1} … u_m</tspan><tspan x="2066.5" dy="17.25">차원 m − r</tspan><tspan x="2066.5" dy="17.25">Ax 로는 절대 닿지 못하는 방향</tspan></text></g><marker id="mk-d2-1140664409-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1140664409-3488378134)" d="M627 135h1358" class="connection stroke-B1 s0" mask="url(#d2-1140664409)"/><text x="1307" y="141" class="text-italic fill-N2 s2">A v_i = σ_i u_i — v_i 가 u_i 방향으로, σ_i 배</text><path fill="none" marker-end="url(#mk-d2-1140664409-3488378134)" d="M639.5 293H2024" class="connection stroke-B1 s0" mask="url(#d2-1140664409)"/><text x="1332.5" y="299" class="text-italic fill-N2 s2">A v_i = 0 — 납작하게 눌린다</text><mask id="d2-1140664409" width="2298" height="722" x="72" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M72-85h2298v722H72z"/><path d="M1152 125h310v21h-310zM1225 283h215v21h-215z"/></mask></svg>