<svg xmlns="http://www.w3.org/2000/svg" width="987" height="878" class="d2-1798343946 d2-svg" viewBox="-88 -89 987 878"><rect width="987" height="878" x="-88" y="-89" rx="0" style="fill:#fff"/><style>.d2-1798343946 .text-bold{font-weight:700}.d2-1798343946 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1798343946 .fill-N1{fill:#0a0f25}.d2-1798343946 .fill-N2{fill:#676c7e}.d2-1798343946 .fill-B4{fill:#e3e9fd}.d2-1798343946 .fill-B5{fill:#edf0fd}.d2-1798343946 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M75 12h461v198H75z" class="stroke-B1 fill-B4 s0"/></g><text x="305.5" y="45" class="text-bold fill-N1 s1">정의역 R^n — x 가 사는 곳</text></g><g ><g class="shape"><path d="M104 401h673v214H104z" class="stroke-B1 fill-B4 s0"/></g><text x="440.5" y="434" class="text-bold fill-N1 s1">공역 R^m — Ax 와 b 가 사는 곳</text></g><text x="425.5" y="651" class="fill-N1 s2"><tspan x="425.5" dy="0">랭크 r = 0 이 아닌 특이값의 개수다.</tspan><tspan x="425.5" dy="17.667">네 기저가 모두 정규직교라서 사영도 최소제곱도 낮은 계수 근사도 여기서 곧바로 나온다.</tspan><tspan x="425.5" dy="17.667">b 를 열공간에 사영하려면 u_1 … u_r 과의 내적만 남기면 되고, 왼쪽 영공간 성분이 잔차다</tspan></text><g ><g class="shape"><path d="M125 62h159v98H125z" class="stroke-B1 fill-B5 s0"/></g><text x="204.5" y="100.5" class="text-bold fill-N1 s2"><tspan x="204.5" dy="0">행공간 Row(A)</tspan><tspan x="204.5" dy="17.667">기저 v_1 … v_r</tspan><tspan x="204.5" dy="17.667">차원 r</tspan></text></g><g ><g class="shape"><path d="M304 62h182v98H304z" class="stroke-B1 fill-B5 s0"/></g><text x="395" y="100.5" class="text-bold fill-N1 s2"><tspan x="395" dy="0">영공간 N(A)</tspan><tspan x="395" dy="17.667">기저 v_{r+1} … v_n</tspan><tspan x="395" dy="17.667">차원 n − r</tspan></text></g><g ><g class="shape"><path d="M154 451h155v98H154z" class="stroke-B1 fill-B5 s0"/></g><text x="231.5" y="489.5" class="text-bold fill-N1 s2"><tspan x="231.5" dy="0">열공간 Col(A)</tspan><tspan x="231.5" dy="17.667">기저 u_1 … u_r</tspan><tspan x="231.5" dy="17.667">차원 r</tspan></text></g><g ><g class="shape"><circle cx="367.5" cy="489.5" r="38.5" class="shape stroke-B1 fill-B5 s0"/></g><text x="367.5" y="495" class="text-bold fill-N1 s2">0</text></g><g ><g class="shape"><path d="M426 451h301v114H426z" class="stroke-B1 fill-B5 s0"/></g><text x="576.5" y="489.5" class="text-bold fill-N1 s2"><tspan x="576.5" dy="0">왼쪽 영공간</tspan><tspan x="576.5" dy="17.25">기저 u_{r+1} … u_m</tspan><tspan x="576.5" dy="17.25">차원 m − r</tspan><tspan x="576.5" dy="17.25">Ax 로는 절대 닿지 못하는 방향</tspan></text></g><marker id="mk-d2-1798343946-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1798343946-3488378134)" d="M165 162v285" class="connection stroke-B1 s0" mask="url(#d2-1798343946)"/><text x="165" y="311" class="text-italic fill-N2 s2">A v_i = σ_i u_i — v_i 가 u_i 방향으로, σ_i 배</text><path fill="none" marker-end="url(#mk-d2-1798343946-3488378134)" d="M434.5 162v184s0 10-10 10h-46.75s-10 0-9.974 10l.213 81" class="connection stroke-B1 s0" mask="url(#d2-1798343946)"/><text x="434.5" y="344" class="text-italic fill-N2 s2">A v_i = 0 — 납작하게 눌린다</text><mask id="d2-1798343946" width="987" height="878" x="-88" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-88-89h987v878H-88z"/><path d="M10 295h310v21H10zM327 328h215v21H327z"/></mask></svg>