<svg xmlns="http://www.w3.org/2000/svg" width="1044" height="780" class="d2-2940280131 d2-svg" viewBox="-101 -101 1044 780"><rect width="1044" height="780" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2940280131 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2940280131 .fill-N1{fill:#0a0f25}.d2-2940280131 .fill-B6{fill:#f7f8fe}.d2-2940280131 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="m315 0-90 46 90 47h180l90-47-90-46Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="405" y="44" class="text-bold fill-N1 s0"><tspan x="405" dy="0">벡터공간의 열 개 공리</tspan><tspan x="405" dy="18.5">덧셈 다섯, 스칼라배 다섯</tspan></text></g><g ><g class="shape"><path d="M0 201h163v98H0z" class="stroke-B1 fill-B6 s1"/></g><text x="81.5" y="239.5" class="text-bold fill-N1 s0"><tspan x="81.5" dy="0">Rⁿ</tspan><tspan x="81.5" dy="17.667">수 n 개의 나열</tspan><tspan x="81.5" dy="17.667">(1, 3, −2)</tspan></text></g><g ><g class="shape"><path d="M223 201h140v98H223z" class="stroke-B1 fill-B6 s1"/></g><text x="293" y="239.5" class="text-bold fill-N1 s0"><tspan x="293" dy="0">차수 n 이하</tspan><tspan x="293" dy="17.667">다항식 P_n</tspan><tspan x="293" dy="17.667">1 + 3x − 2x²</tspan></text></g><g ><g class="shape"><path d="M423 201h188v98H423z" class="stroke-B1 fill-B6 s1"/></g><text x="517" y="239.5" class="text-bold fill-N1 s0"><tspan x="517" dy="0">m × n 행렬 M_mn</tspan><tspan x="517" dy="17.667">성분끼리 더하고</tspan><tspan x="517" dy="17.667">수를 곱한다</tspan></text></g><g ><g class="shape"><path d="M671 193h171v114H671z" class="stroke-B1 fill-B6 s1"/></g><text x="756.5" y="231.5" class="text-bold fill-N1 s0"><tspan x="756.5" dy="0">구간 위의 함수</tspan><tspan x="756.5" dy="17.25">F(a, b)</tspan><tspan x="756.5" dy="17.25">(f + g)(x) =</tspan><tspan x="756.5" dy="17.25">f(x) + g(x)</tspan></text></g><g ><g class="shape"><path d="M212 407h386v98H212z" class="stroke-B1 fill-B6 s1"/></g><text x="405" y="445.5" class="text-bold fill-N1 s0"><tspan x="405" dy="0">한 번 증명하면 네 곳 모두에서 성립한다</tspan><tspan x="405" dy="17.667">일차독립·기저·차원·계수 정리가</tspan><tspan x="405" dy="17.667">그대로 옮겨 간다</tspan></text></g><text x="420.5" y="541" class="fill-N1 s0"><tspan x="420.5" dy="0">이 표에 없는 것도 조건만 맞으면 벡터공간이다.</tspan><tspan x="420.5" dy="17.667">반대로 ‘양수만 모은 집합’처럼</tspan><tspan x="420.5" dy="17.667">−1 배가 밖으로 나가면 벡터공간이 아니다</tspan></text><marker id="mk-d2-2940280131-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2940280131-3488378134)" d="M289.082 81.568C123.4 130.6 81.5 154.6 81.5 197" class="connection stroke-B1 s1" mask="url(#d2-2940280131)"/><path fill="none" marker-end="url(#mk-d2-2940280131-3488378134)" d="M349.485 94.306C304.6 133 293 154.6 293 197" class="connection stroke-B1 s1" mask="url(#d2-2940280131)"/><path fill="none" marker-end="url(#mk-d2-2940280131-3488378134)" d="M460.515 94.306C505.4 133 517 154.6 517 197" class="connection stroke-B1 s1" mask="url(#d2-2940280131)"/><path fill="none" marker-end="url(#mk-d2-2940280131-3488378134)" d="M523.93 79.527C709.6 130.199 756.5 153 756.5 189" class="connection stroke-B1 s1" mask="url(#d2-2940280131)"/><path fill="none" marker-end="url(#mk-d2-2940280131-3488378134)" d="M81.5 301c0 44.4 32.6 66 159.176 104.827" class="connection stroke-B1 s1" mask="url(#d2-2940280131)"/><path fill="none" marker-end="url(#mk-d2-2940280131-3488378134)" d="M293 301c0 44.4 11.4 66 53.993 103.362" class="connection stroke-B1 s1" mask="url(#d2-2940280131)"/><path fill="none" marker-end="url(#mk-d2-2940280131-3488378134)" d="M517 301c0 44.4-11.4 66-53.993 103.362" class="connection stroke-B1 s1" mask="url(#d2-2940280131)"/><path fill="none" marker-end="url(#mk-d2-294028