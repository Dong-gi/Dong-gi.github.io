<svg xmlns="http://www.w3.org/2000/svg" width="1562" height="675" class="d2-2274192345 d2-svg" viewBox="-101 -101 1562 675"><rect width="1562" height="675" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2274192345 .fill-N1{fill:#0a0f25}.d2-2274192345 .fill-B6{fill:#f7f8fe}.d2-2274192345 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="m413 0-90 46 90 47h180l90-47-90-46Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="503" y="44" class="text-bold fill-N1 s0"><tspan x="503" dy="0">벡터공간의 열 개 공리</tspan><tspan x="503" dy="18.5">덧셈 다섯, 스칼라배 다섯</tspan></text></g><g ><g class="shape"><path d="M0 193h163v98H0z" class="stroke-B1 fill-B6 s1"/></g><text x="81.5" y="231.5" class="text-bold fill-N1 s0"><tspan x="81.5" dy="0">Rⁿ</tspan><tspan x="81.5" dy="17.667">수 n 개의 나열</tspan><tspan x="81.5" dy="17.667">(1, 3, −2)</tspan></text></g><g ><g class="shape"><path d="M223 201h235v82H223z" class="stroke-B1 fill-B6 s1"/></g><text x="340.5" y="239.5" class="text-bold fill-N1 s0"><tspan x="340.5" dy="0">차수 n 이하 다항식 P_n</tspan><tspan x="340.5" dy="18.5">1 + 3x − 2x²</tspan></text></g><g ><g class="shape"><path d="M518 201h296v82H518z" class="stroke-B1 fill-B6 s1"/></g><text x="666" y="239.5" class="text-bold fill-N1 s0"><tspan x="666" dy="0">m × n 행렬 M_mn</tspan><tspan x="666" dy="18.5">성분끼리 더하고 수를 곱한다</tspan></text></g><g ><g class="shape"><path d="M874 201h220v82H874z" class="stroke-B1 fill-B6 s1"/></g><text x="984" y="239.5" class="text-bold fill-N1 s0"><tspan x="984" dy="0">구간 위의 함수 F(a, b)</tspan><tspan x="984" dy="18.5">(f + g)(x) = f(x) + g(x)</tspan></text></g><g ><g class="shape"><path d="M107 391h475v82H107z" class="stroke-B1 fill-B6 s1"/></g><text x="344.5" y="429.5" class="text-bold fill-N1 s0"><tspan x="344.5" dy="0">한 번 증명하면 네 곳 모두에서 성립한다</tspan><tspan x="344.5" dy="18.5">일차독립·기저·차원·계수 정리가 그대로 옮겨 간다</tspan></text></g><text x="1051.5" y="44" class="fill-N1 s0"><tspan x="1051.5" dy="0">이 표에 없는 것도 조건만 맞으면 벡터공간이다.</tspan><tspan x="1051.5" dy="18.5">반대로 ‘양수만 모은 집합’처럼 −1 배가 밖으로 나가면 벡터공간이 아니다</tspan></text><marker id="mk-d2-2274192345-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2274192345-3488378134)" d="M377.05 75.446C141 129.4 81.5 153 81.5 189" class="connection stroke-B1 s1" mask="url(#d2-2274192345)"/><path fill="none" marker-end="url(#mk-d2-2274192345-3488378134)" d="M422.284 94.027C357.2 133 340.5 154.6 340.5 197" class="connection stroke-B1 s1" mask="url(#d2-2274192345)"/><path fill="none" marker-end="url(#mk-d2-2274192345-3488378134)" d="M583.719 94.023C649.2 133 666 154.6 666 197" class="connection stroke-B1 s1" mask="url(#d2-2274192345)"/><path fill="none" marker-end="url(#mk-d2-2274192345-3488378134)" d="M633.96 72.395C913.6 128.8 984 154.6 984 197" class="connection stroke-B1 s1" mask="url(#d2-2274192345)"/><path fill="none" marker-end="url(#mk-d2-2274192345-3488378134)" d="M81.5 293c0 38 28.8 58 140.221 96.688" class="connection stroke-B1 s1" mask="url(#d2-2274192345)"/><path fill="none" marker-end="url(#mk-d2-2274192345-3488378134)" d="M340.5 285c0 44.4.4 66 1.84 102.003" class="connection stroke-B1 s1" mask="url(#d2-2274192345)"/><path fill="none" marker-end="url(#mk-d2-2274192345-3488378134)" d="M666 285c0 44.4-35.4 66-173.15 104.913" class="connection stroke-B1 s1" mask="url(#d2-2274192345)"/><path fill="none" marker-end="url(#mk-d2-2274192345-3488378134)" d="M984 285c0 44.4-80.4 67.4-398.04 112.438" class="connection stroke-B1 s1" mask="url(#d2-2274192345)"/><mask id="d2-2274192345" width="1562" height="675" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1562v675H-101