<svg xmlns="http://www.w3.org/2000/svg" width="1948" height="592" class="d2-2487581049 d2-svg" viewBox="-101 -101 1948 592"><rect width="1948" height="592" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2487581049 .fill-N1{fill:#0a0f25}.d2-2487581049 .fill-B6{fill:#f7f8fe}.d2-2487581049 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><circle cx="223.5" cy="112.5" r="38.5" class="shape stroke-B1 fill-B6 s0"/></g><text x="223.5" y="118" class="text-bold fill-N1 s1">A</text></g><g ><g class="shape"><circle cx="1695.5" cy="112.5" r="50.5" class="shape stroke-B1 fill-B6 s0"/></g><text x="1695.5" y="118" class="text-bold fill-N1 s1">A¹⁰⁰</text></g><g ><g class="shape"><path d="M1332 0h213v82h-213z" class="stroke-B1 fill-B6 s0"/></g><text x="1438.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1438.5" dy="0">행렬 곱을 99번</tspan><tspan x="1438.5" dy="18.5">한 번에 n³ 번의 곱셈</tspan></text></g><g ><g class="shape"><path d="M546 142h293v82H546z" class="stroke-B1 fill-B6 s0"/></g><text x="692.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="692.5" dy="0">A = PDP⁻¹ 로 분해</tspan><tspan x="692.5" dy="18.5">고유값과 고유벡터를 구한다</tspan></text></g><g ><g class="shape"><path d="M939 142h293v82H939z" class="stroke-B1 fill-B6 s0"/></g><text x="1085.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="1085.5" dy="0">D¹⁰⁰ = diag(λ_1¹⁰⁰, …, λ_n¹⁰⁰)</tspan><tspan x="1085.5" dy="18.5">대각성분만 거듭제곱하면 끝</tspan></text></g><g ><g class="shape"><path d="M1350 142h178v82h-178z" class="stroke-B1 fill-B6 s0"/></g><text x="1439" y="180.5" class="text-bold fill-N1 s1"><tspan x="1439" dy="0">A¹⁰⁰ = P D¹⁰⁰ P⁻¹</tspan><tspan x="1439" dy="18.5">행렬 곱 두 번</tspan></text></g><g ><g class="shape"><path d="M61 211h325v82H61z" class="stroke-B1 fill-B6 s0"/></g><text x="223.5" y="249.5" class="text-bold fill-N1 s1"><tspan x="223.5" dy="0">왜 되는가: A² = PDP⁻¹PDP⁻¹ = PD²P⁻¹</tspan><tspan x="223.5" dy="18.5">가운데 P⁻¹P 가 계속 지워진다</tspan></text></g><text x="223" y="369" class="fill-N1 s1"><tspan x="223" dy="0">쓰는 곳: 점화식의 일반항, 마르코프 연쇄의 장기 상태,</tspan><tspan x="223" dy="18.5">미분방정식 계의 해 — 전부 같은 계산이다</tspan></text><marker id="mk-d2-2487581049-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2487581049-3488378134)" d="M262.936 101.497C449 53.2 535.3 41 594.25 41H1328" class="connection stroke-B1 s0" mask="url(#d2-2487581049)"/><path fill="none" marker-end="url(#mk-d2-2487581049-3488378134)" d="M1547 41c38 0 60 8.4 104.723 39.706" class="connection stroke-B1 s0" mask="url(#d2-2487581049)"/><path fill="none" marker-end="url(#mk-d2-2487581049-3488378134)" d="M262.936 122.502C449 170.8 506 183 542 183" class="connection stroke-B1 s0" mask="url(#d2-2487581049)"/><path fill="none" marker-end="url(#mk-d2-2487581049-3488378134)" d="M841 183h94" class="connection stroke-B1 s0" mask="url(#d2-2487581049)"/><path fill="none" marker-end="url(#mk-d2-2487581049-3488378134)" d="M1234 183h111.5" class="connection stroke-B1 s0" mask="url(#d2-2487581049)"/><path fill="none" marker-end="url(#mk-d2-2487581049-3488378134)" d="M1530.5 183c51.2 0 76.3-8.2 120.215-38.717" class="connection stroke-B1 s0" mask="url(#d2-2487581049)"/><mask id="d2-2487581049" width="1948" height="592" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1948v592H-101z"/></mask></svg>