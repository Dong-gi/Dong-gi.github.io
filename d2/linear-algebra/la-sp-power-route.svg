<svg xmlns="http://www.w3.org/2000/svg" width="728" height="1137" class="d2-2688938330 d2-svg" viewBox="-89 -89 728 1137"><rect width="728" height="1137" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2688938330 .fill-N1{fill:#0a0f25}.d2-2688938330 .fill-B6{fill:#f7f8fe}.d2-2688938330 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="254" cy="50.5" class="shape stroke-B1 fill-B6 s0" rx="40" ry="38.5"/></g><text x="254" y="56" class="text-bold fill-N1 s1">A</text></g><g ><g class="shape"><circle cx="254.5" cy="685.5" r="50.5" class="shape stroke-B1 fill-B6 s0"/></g><text x="254.5" y="691" class="text-bold fill-N1 s1">A¹⁰⁰</text></g><g ><g class="shape"><path d="M12 321h213v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="118.5" y="359.5" class="text-bold fill-N1 s1"><tspan x="118.5" dy="0">행렬 곱을 99번</tspan><tspan x="118.5" dy="18.5">한 번에 n³ 번의 곱셈</tspan></text></g><g ><g class="shape"><path d="M245 169h293v82H245z" class="stroke-B1 fill-B6 s0"/></g><text x="391.5" y="207.5" class="text-bold fill-N1 s1"><tspan x="391.5" dy="0">A = PDP⁻¹ 로 분해</tspan><tspan x="391.5" dy="18.5">고유값과 고유벡터를 구한다</tspan></text></g><g ><g class="shape"><path d="M245 321h293v82H245z" class="stroke-B1 fill-B6 s0"/></g><text x="391.5" y="359.5" class="text-bold fill-N1 s1"><tspan x="391.5" dy="0">D¹⁰⁰ = diag(λ_1¹⁰⁰, …, λ_n¹⁰⁰)</tspan><tspan x="391.5" dy="18.5">대각성분만 거듭제곱하면 끝</tspan></text></g><g ><g class="shape"><path d="M302 473h178v82H302z" class="stroke-B1 fill-B6 s0"/></g><text x="391" y="511.5" class="text-bold fill-N1 s1"><tspan x="391" dy="0">A¹⁰⁰ = P D¹⁰⁰ P⁻¹</tspan><tspan x="391" dy="18.5">행렬 곱 두 번</tspan></text></g><path fill="transparent" stroke="transparent" d="M28 756h494v191H28z" class="shape s0"/><g ><g class="shape"><path d="M52 780h446v82H52z" class="stroke-B1" style="fill:#edf0fd;stroke-width:2"/></g><text x="275" y="818.5" class="text-bold fill-N1 s1"><tspan x="275" dy="0">왜 되는가: A² = PDP⁻¹PDP⁻¹ = PD²P⁻¹</tspan><tspan x="275" dy="18.5">가운데 P⁻¹P 가 계속 지워진다</tspan></text></g><text x="275" y="902" class="fill-N1 s1"><tspan x="275" dy="0">쓰는 곳: 점화식의 일반항, 마르코프 연쇄의 장기 상태,</tspan><tspan x="275" dy="18.5">미분방정식 계의 해 — 전부 같은 계산이다</tspan></text><marker id="mk-d2-2688938330-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2688938330-3488378134)" d="m241.984 89-.238 30s-.08 10-10.08 10H128.5s-10 0-10 10v178" class="connection stroke-B1 s0" mask="url(#d2-2688938330)"/><path fill="none" marker-end="url(#mk-d2-2688938330-3488378134)" d="M118.5 405v180s0 10 10 10h99.666s10 0 9.961 10l-.112 29" class="connection stroke-B1 s0" mask="url(#d2-2688938330)"/><path fill="none" marker-end="url(#mk-d2-2688938330-3488378134)" d="m268.008 89 .309 76" class="connection stroke-B1 s0" mask="url(#d2-2688938330)"/><path fill="none" marker-end="url(#mk-d2-2688938330-3488378134)" d="M391.5 253v64" class="connection stroke-B1 s0" mask="url(#d2-2688938330)"/><path fill="none" marker-end="url(#mk-d2-2688938330-3488378134)" d="M391.5 405v64" class="connection stroke-B1 s0" mask="url(#d2-2688938330)"/><path fill="none" marker-end="url(#mk-d2-2688938330-3488378134)" d="M391.5 557v28s0 10-10 10h-99.667s-10 0-9.961 10l.112 29" class="connection stroke-B1 s0" mask="url(#d2-2688938330)"/><mask id="d2-2688938330" width="728" height="1137" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h728v1137H-89z"/></mask></svg>