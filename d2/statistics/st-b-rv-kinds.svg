<svg xmlns="http://www.w3.org/2000/svg" width="2878" height="584" class="d2-2688866448 d2-svg" viewBox="-101 -101 2878 584"><rect width="2878" height="584" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2688866448 .fill-N1{fill:#0a0f25}.d2-2688866448 .fill-N2{fill:#676c7e}.d2-2688866448 .fill-B6{fill:#f7f8fe}.d2-2688866448 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="184" cy="199.5" class="shape stroke-B1 fill-B6 s0" rx="125" ry="41.5"/></g><text x="184" y="197" class="text-bold fill-N1 s1"><tspan x="184" dy="0">확률변수 X</tspan><tspan x="184" dy="18.5">S 의 결과 → 실수</tspan></text></g><g ><g class="shape"><path d="M526 158h293v82H526z" class="stroke-B1 fill-B6 s0"/></g><text x="672.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="672.5" dy="0">X 가 가지는 값들이</tspan><tspan x="672.5" dy="18.5">띄엄띄엄인가 이어져 있는가</tspan></text></g><g ><g class="shape"><path d="M1116 11h174v82h-174z" class="stroke-B1 fill-B6 s0"/></g><text x="1203" y="49.5" class="text-bold fill-N1 s1"><tspan x="1203" dy="0">이산확률변수</tspan><tspan x="1203" dy="18.5">값을 셀 수 있다</tspan></text></g><g ><g class="shape"><path d="M1097 169h212v82h-212z" class="stroke-B1 fill-B6 s0"/></g><text x="1203" y="207.5" class="text-bold fill-N1 s1"><tspan x="1203" dy="0">연속확률변수</tspan><tspan x="1203" dy="18.5">값이 구간을 채운다</tspan></text></g><g ><g class="shape"><path d="M1468 3h265v98h-265z" class="stroke-B1 fill-B6 s0"/></g><text x="1600.5" y="41.5" class="text-bold fill-N1 s1"><tspan x="1600.5" dy="0">확률질량함수 p(x) = P(X = x)</tspan><tspan x="1600.5" dy="17.667">높이가 곧 확률</tspan><tspan x="1600.5" dy="17.667">합이 1</tspan></text></g><g ><g class="shape"><path d="M1475 161h252v98h-252z" class="stroke-B1 fill-B6 s0"/></g><text x="1601" y="199.5" class="text-bold fill-N1 s1"><tspan x="1601" dy="0">확률밀도함수 f(x)</tspan><tspan x="1601" dy="17.667">높이는 확률이 아니다</tspan><tspan x="1601" dy="17.667">넓이가 확률, 전체 넓이 1</tspan></text></g><g ><g class="shape"><path d="M1892 158h285v82h-285z" class="stroke-B1 fill-B6 s0"/></g><text x="2034.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="2034.5" dy="0">누적분포함수 F(x) = P(X ≤ x)</tspan><tspan x="2034.5" dy="18.5">둘 다 쓸 수 있는 하나의 언어</tspan></text></g><g ><g class="shape"><path d="M2376 0h260v98h-260z" class="stroke-B1 fill-B6 s0"/></g><text x="2506" y="38.5" class="text-bold fill-N1 s1"><tspan x="2506" dy="0">0 에서 1 로 올라가고</tspan><tspan x="2506" dy="17.667">절대 내려가지 않는다</tspan><tspan x="2506" dy="17.667">이산은 계단, 연속은 매끈</tspan></text></g><g ><g class="shape"><path d="M2384 158h244v82h-244z" class="stroke-B1 fill-B6 s0"/></g><text x="2506" y="196.5" class="text-bold fill-N1 s1"><tspan x="2506" dy="0">연속이면 F′(x) = f(x)</tspan><tspan x="2506" dy="18.5">이산이면 뛴 높이가 p(x)</tspan></text></g><g ><g class="shape"><path d="M2336 300h340v82h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="2506" y="338.5" class="text-bold fill-N1 s1"><tspan x="2506" dy="0">F 를 거꾸로 읽으면 분위수</tspan><tspan x="2506" dy="18.5">중앙값·사분위수·역변환 표본추출</tspan></text></g><text x="183.5" y="317" class="fill-N1 s1"><tspan x="183.5" dy="0">둘 다 아닌 것도 있다. 예컨대 ‘비가 온 양’ 은</tspan><tspan x="183.5" dy="17.667">0 에 덩어리가 있고 그 위로는 이어진다.</tspan><tspan x="183.5" dy="17.667">그런 혼합형도 F 로는 아무 문제 없이 적힌다</tspan></text><marker id="mk-d2-2688866448-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2688866448-3488378134)" d="M311 199h211.5" class="connection stroke-B1 s0" mask="url(#d2-2688866448)"/><path fill="none" marker-end="url(#mk-d2-2688866448-3488378134)" d="M753.778 157.085C916.8 73.199 989.6 52 1112 52" class="connection stroke-B1 s0" mask="url(#d2-2688866448)"/><text x="925" y="76" class="text-italic fill-N2 s1">셀 수 있다</text><path fill="none" marker-end="url(#mk-d2-2688866448-3488378134)" d="M820.999 205.072C930.2 209 985.8 210 1093 210" class="connection stroke-B1 s0" mask="url(#d2-2688866448)"/><text x="957.5" y="215" class="text-italic fill-N2 s1">구간을 채운다</text><path fill="none" marker-end="url(#mk-d2-2688866448-3488378134)" d="M1291.5 52h173" class="connection stroke-B1 s0" mask="url(#d2-2688866448)"/><path fill="none" marker-end="url(#mk-d2-2688866448-3488378134)" d="M1310.5 210h160" class="connection stroke-B1 s0" mask="url(#d2-2688866448)"/><path fill="none" marker-end="url(#mk-d2-2688866448-3488378134)" d="M1734.5 52c62 0 110 21.2 234.665 103.79" class="connection stroke-B1 s0" mask="url(#d2-2688866448)"/><path fill="none" marker-end="url(#mk-d2-2688866448-3488378134)" d="M1729.5 210c66 0 99-.8 159.005-3.8" class="connection stroke-B1 s0" mask="url(#d2-2688866448)"/><path fill="none" marker-end="url(#mk-d2-2688866448-3488378134)" d="M2097.156 156.879C2224.3 70.8 2280.5 49 2372.5 49" class="connection stroke-B1 s0" mask="url(#d2-2688866448)"/><path fill="none" marker-end="url(#mk-d2-2688866448-3488378134)" d="M2178.5 199h202" class="connection stroke-B1 s0" mask="url(#d2-2688866448)"/><path fill="none" marker-end="url(#mk-d2-2688866448-3488378134)" d="M2100.185 241.077C2224.9 320.8 2272.5 341 2332.5 341" class="connection stroke-B1 s0" mask="url(#d2-2688866448)"/><mask id="d2-2688866448" width="2878" height="584" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2878v584H-101z"/><path d="M881 60h88v21h-88zM896 199h123v21H896z"/></mask></svg>