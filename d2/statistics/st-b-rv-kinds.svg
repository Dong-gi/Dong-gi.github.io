<svg xmlns="http://www.w3.org/2000/svg" width="1086" height="1271" class="d2-2853724673 d2-svg" viewBox="-89 -89 1086 1271"><rect width="1086" height="1271" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2853724673 .fill-N1{fill:#0a0f25}.d2-2853724673 .fill-N2{fill:#676c7e}.d2-2853724673 .fill-B6{fill:#f7f8fe}.d2-2853724673 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="414" cy="53.5" class="shape stroke-B1 fill-B6 s0" rx="125" ry="41.5"/></g><text x="414" y="51" class="text-bold fill-N1 s1"><tspan x="414" dy="0">확률변수 X</tspan><tspan x="414" dy="18.5">S 의 결과 → 실수</tspan></text></g><g ><g class="shape"><path d="M267 165h293v82H267z" class="stroke-B1 fill-B6 s0"/></g><text x="413.5" y="203.5" class="text-bold fill-N1 s1"><tspan x="413.5" dy="0">X 가 가지는 값들이</tspan><tspan x="413.5" dy="18.5">띄엄띄엄인가 이어져 있는가</tspan></text></g><g ><g class="shape"><path d="M187 418h174v82H187z" class="stroke-B1 fill-B6 s0"/></g><text x="274" y="456.5" class="text-bold fill-N1 s1"><tspan x="274" dy="0">이산확률변수</tspan><tspan x="274" dy="18.5">값을 셀 수 있다</tspan></text></g><g ><g class="shape"><path d="M447 418h212v82H447z" class="stroke-B1 fill-B6 s0"/></g><text x="553" y="456.5" class="text-bold fill-N1 s1"><tspan x="553" dy="0">연속확률변수</tspan><tspan x="553" dy="18.5">값이 구간을 채운다</tspan></text></g><g ><g class="shape"><path d="M142 570h265v98H142z" class="stroke-B1 fill-B6 s0"/></g><text x="274.5" y="608.5" class="text-bold fill-N1 s1"><tspan x="274.5" dy="0">확률질량함수 p(x) = P(X = x)</tspan><tspan x="274.5" dy="17.667">높이가 곧 확률</tspan><tspan x="274.5" dy="17.667">합이 1</tspan></text></g><g ><g class="shape"><path d="M427 570h252v98H427z" class="stroke-B1 fill-B6 s0"/></g><text x="553" y="608.5" class="text-bold fill-N1 s1"><tspan x="553" dy="0">확률밀도함수 f(x)</tspan><tspan x="553" dy="17.667">높이는 확률이 아니다</tspan><tspan x="553" dy="17.667">넓이가 확률, 전체 넓이 1</tspan></text></g><g ><g class="shape"><path d="M271 748h285v82H271z" class="stroke-B1 fill-B6 s0"/></g><text x="413.5" y="786.5" class="text-bold fill-N1 s1"><tspan x="413.5" dy="0">누적분포함수 F(x) = P(X ≤ x)</tspan><tspan x="413.5" dy="18.5">둘 다 쓸 수 있는 하나의 언어</tspan></text></g><g ><g class="shape"><path d="M12 910h260v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="142" y="948.5" class="text-bold fill-N1 s1"><tspan x="142" dy="0">0 에서 1 로 올라가고</tspan><tspan x="142" dy="17.667">절대 내려가지 않는다</tspan><tspan x="142" dy="17.667">이산은 계단, 연속은 매끈</tspan></text></g><g ><g class="shape"><path d="M292 910h244v82H292z" class="stroke-B1 fill-B6 s0"/></g><text x="414" y="948.5" class="text-bold fill-N1 s1"><tspan x="414" dy="0">연속이면 F′(x) = f(x)</tspan><tspan x="414" dy="18.5">이산이면 뛴 높이가 p(x)</tspan></text></g><g ><g class="shape"><path d="M556 910h340v82H556z" class="stroke-B1 fill-B6 s0"/></g><text x="726" y="948.5" class="text-bold fill-N1 s1"><tspan x="726" dy="0">F 를 거꾸로 읽으면 분위수</tspan><tspan x="726" dy="18.5">중앙값·사분위수·역변환 표본추출</tspan></text></g><text x="453.5" y="1044" class="fill-N1 s1"><tspan x="453.5" dy="0">둘 다 아닌 것도 있다. 예컨대 ‘비가 온 양’ 은</tspan><tspan x="453.5" dy="17.667">0 에 덩어리가 있고 그 위로는 이어진다.</tspan><tspan x="453.5" dy="17.667">그런 혼합형도 F 로는 아무 문제 없이 적힌다</tspan></text><marker id="mk-d2-2853724673-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2853724673-3488378134)" d="M414 97v64" class="connection stroke-B1 s0" mask="url(#d2-2853724673)"/><path fill="none" marker-end="url(#mk-d2-2853724673-3488378134)" d="M365.166 249v28s0 10-10 10H284.75s-10 0-10 10v117" class="connection stroke-B1 s0" mask="url(#d2-2853724673)"/><text x="275" y="293" class="text-italic fill-N2 s1">셀 수 있다</text><path fill="none" marker-end="url(#mk-d2-2853724673-3488378134)" d="M462.833 249v165" class="connection stroke-B1 s0" mask="url(#d2-2853724673)"/><text x="462.5" y="338" class="text-italic fill-N2 s1">구간을 채운다</text><path fill="none" marker-end="url(#mk-d2-2853724673-3488378134)" d="M274.75 502v64" class="connection stroke-B1 s0" mask="url(#d2-2853724673)"/><path fill="none" marker-end="url(#mk-d2-2853724673-3488378134)" d="M553.25 502v64" class="connection stroke-B1 s0" mask="url(#d2-2853724673)"/><path fill="none" marker-end="url(#mk-d2-2853724673-3488378134)" d="M366.5 670v74" class="connection stroke-B1 s0" mask="url(#d2-2853724673)"/><path fill="none" marker-end="url(#mk-d2-2853724673-3488378134)" d="M461.5 670v74" class="connection stroke-B1 s0" mask="url(#d2-2853724673)"/><path fill="none" marker-end="url(#mk-d2-2853724673-3488378134)" d="M342.75 832v28s0 10-10 10H152s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-2853724673)"/><path fill="none" marker-end="url(#mk-d2-2853724673-3488378134)" d="M414 832v74" class="connection stroke-B1 s0" mask="url(#d2-2853724673)"/><path fill="none" marker-end="url(#mk-d2-2853724673-3488378134)" d="M485.25 832v28s0 10 10 10H716s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-2853724673)"/><mask id="d2-2853724673" width="1086" height="1271" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H997v1271H-89z"/><path d="M231 277h88v21h-88zM401 322h123v21H401z"/></mask></svg>