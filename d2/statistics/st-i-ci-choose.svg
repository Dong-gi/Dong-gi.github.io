<svg xmlns="http://www.w3.org/2000/svg" width="1381" height="2040" class="d2-3830715997 d2-svg" viewBox="-89 -89 1381 2040"><rect width="1381" height="2040" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3830715997 .fill-N1{fill:#0a0f25}.d2-3830715997 .fill-N2{fill:#676c7e}.d2-3830715997 .fill-N4{fill:#cfd2dd}.d2-3830715997 .fill-B6{fill:#f7f8fe}.d2-3830715997 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="628.5" cy="66.5" class="shape stroke-B1 fill-B6 s0" rx="163.5" ry="54.5"/></g><text x="628.5" y="64" class="text-bold fill-N1 s1"><tspan x="628.5" dy="0">구간추정을 하려 한다</tspan><tspan x="628.5" dy="18.5">무엇을 추정하는가</tspan></text></g><g ><g class="shape"><path d="M323 251h118v66H323z" class="stroke-B1 fill-B6 s0"/></g><text x="382" y="289.5" class="text-bold fill-N1 s1">모평균 μ</text></g><g ><g class="shape"><path d="M810 251h117v66H810z" class="stroke-B1 fill-B6 s0"/></g><text x="868.5" y="289.5" class="text-bold fill-N1 s1">모비율 p</text></g><g ><g class="shape"><path d="M133 844h125v66H133z" class="stroke-B1 fill-B6 s0"/></g><text x="195.5" y="882.5" class="text-bold fill-N1 s1">모분산 σ²</text></g><g ><g class="shape"><path d="M730 844h171v66H730z" class="stroke-B1 fill-B6 s0"/></g><text x="815.5" y="882.5" class="text-bold fill-N1 s1">두 모집단의 차</text></g><g ><g class="shape"><path d="M382 511h-3l-148-61c-2-1-2-2 0-2l148-61q3-1.5 6 0l148 60c2 1 2 2 0 2l-148 62z" class="stroke-B1 fill-N4 s0"/></g><text x="382" y="446.5" class="text-bold fill-N1 s1"><tspan x="382" dy="0">모표준편차 σ 를</tspan><tspan x="382" dy="18.5">아는가</tspan></text></g><g ><g class="shape"><path d="M173 682h188v82H173z" class="stroke-B1 fill-B6 s0"/></g><text x="267" y="720.5" class="text-bold fill-N1 s1"><tspan x="267" dy="0">x̄ ± z × σ/√n</tspan><tspan x="267" dy="18.5">표준정규 임곗값</tspan></text></g><g ><g class="shape"><path d="M381 682h232v82H381z" class="stroke-B1 fill-B6 s0"/></g><text x="497" y="720.5" class="text-bold fill-N1 s1"><tspan x="497" dy="0">x̄ ± t(n−1) × s/√n</tspan><tspan x="497" dy="18.5">실전에서는 거의 이쪽</tspan></text></g><g ><g class="shape"><path d="M869 511h-3l-147-61c-2-1-2-2 0-2l147-61c2-1 4-1 5 0l147 60c2 1 2 2 0 2l-146 62z" class="stroke-B1 fill-N4 s0"/></g><text x="869" y="446.5" class="text-bold fill-N1 s1"><tspan x="869" dy="0">np̂ ≥ 10 이고</tspan><tspan x="869" dy="18.5">n(1−p̂) ≥ 10 인가</tspan></text></g><g ><g class="shape"><path d="M885 682h209v66H885z" class="stroke-B1 fill-B6 s0"/></g><text x="989.5" y="720.5" class="text-bold fill-N1 s1">p̂ ± z × √(p̂(1−p̂)/n)</text></g><g ><g class="shape"><path d="M633 682h232v82H633z" class="stroke-B1 fill-B6 s0"/></g><text x="749" y="720.5" class="text-bold fill-N1 s1"><tspan x="749" dy="0">정규근사를 쓰지 않는</tspan><tspan x="749" dy="18.5">정확구간이 필요하다</tspan></text></g><g ><g class="shape"><path d="M12 980h368v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="196" y="1018.5" class="text-bold fill-N1 s1"><tspan x="196" dy="0">((n−1)s²/큰 임곗값, (n−1)s²/작은 임곗값)</tspan><tspan x="196" dy="18.5">좌우가 대칭이 아니다</tspan></text></g><g ><g class="shape"><path d="M815 1104h-3l-154-61c-2-1-2-2 0-2l154-61q3-1.5 6 0l154 60c2 1 2 2 0 2l-154 62z" class="stroke-B1 fill-N4 s0"/></g><text x="815" y="1039.5" class="text-bold fill-N1 s1"><tspan x="815" dy="0">두 표본이</tspan><tspan x="815" dy="18.5">짝지어져 있는가</tspan></text></g><g ><g class="shape"><path d="M578 1275h224v82H578z" class="stroke-B1 fill-B6 s0"/></g><text x="690" y="1313.5" class="text-bold fill-N1 s1"><tspan x="690" dy="0">차이 d 를 만들어</tspan><tspan x="690" dy="18.5">한 표본 t 구간을 쓴다</tspan></text></g><g ><g class="shape"><path d="M940 1399h-2l-115-61c-1-1-1-2 0-2l115-61c1-1 3-1 4 0l115 60c1 1 1 2 0 2l-115 62z" class="stroke-B1 fill-N4 s0"/></g><text x="940" y="1334.5" class="text-bold fill-N1 s1"><tspan x="940" dy="0">두 모분산이</tspan><tspan x="940" dy="18.5">비슷한가</tspan></text></g><g ><g class="shape"><path d="M702 1570h222v82H702z" class="stroke-B1 fill-B6 s0"/></g><text x="813" y="1608.5" class="text-bold fill-N1 s1"><tspan x="813" dy="0">합동분산을 만들고</tspan><tspan x="813" dy="18.5">자유도 n₁ + n₂ − 2 인 t</tspan></text></g><g ><g class="shape"><path d="M944 1570h247v82H944z" class="stroke-B1 fill-B6 s0"/></g><text x="1067.5" y="1608.5" class="text-bold fill-N1 s1"><tspan x="1067.5" dy="0">√(s₁²/n₁ + s₂²/n₂) 를 쓰고</tspan><tspan x="1067.5" dy="18.5">자유도는 근사식으로</tspan></text></g><path fill="transparent" stroke="transparent" d="M373 1672h456v178H373z" class="shape s0"/><text x="547" y="1712" class="fill-N1 s1"><tspan x="547" dy="0">어느 칸으로 가든 꼴은 하나다</tspan><tspan x="547" dy="17.667">점추정값 ± 임곗값 × 표준오차</tspan><tspan x="547" dy="17.667">분산만 예외 — 좌우가 대칭이 아니다</tspan></text><text x="601" y="1789" class="fill-N1 s1"><tspan x="601" dy="0">정규성 가정을 어디서 쓰는지 보라.</tspan><tspan x="601" dy="17.667">큰 표본에서는 중심극한정리가 대신 받쳐 주지만</tspan><tspan x="601" dy="17.667">분산의 구간은 끝까지 정규성에 기댄다</tspan></text><marker id="mk-d2-3830715997-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3830715997-3488378134)" d="m595.997 122-.101 79s-.013 10-10.013 10H392.166s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3830715997)"/><path fill="none" marker-end="url(#mk-d2-3830715997-3488378134)" d="m661.006 122 .246 79s.031 10 10.031 10h188.133s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3830715997)"/><path fill="none" marker-end="url(#mk-d2-3830715997-3488378134)" d="m530.019 112 .37 39s.094 10-9.906 10H138.5s-10 0-10 10v623s0 10 10 10h26.666s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3830715997)"/><path fill="none" marker-end="url(#mk-d2-3830715997-3488378134)" d="m726.988 112-.243 39s-.062 10 9.938 10h387.483s10 0 10 10v623s0 10-10 10h-270s-10