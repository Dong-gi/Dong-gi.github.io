<svg xmlns="http://www.w3.org/2000/svg" width="2834" height="1124" class="d2-3600744046 d2-svg" viewBox="-101 -101 2834 1124"><rect width="2834" height="1124" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3600744046 .fill-N1{fill:#0a0f25}.d2-3600744046 .fill-N2{fill:#676c7e}.d2-3600744046 .fill-N4{fill:#cfd2dd}.d2-3600744046 .fill-B6{fill:#f7f8fe}.d2-3600744046 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="204.5" cy="462.5" class="shape stroke-B1 fill-B6 s0" rx="163.5" ry="54.5"/></g><text x="204.5" y="460" class="text-bold fill-N1 s1"><tspan x="204.5" dy="0">구간추정을 하려 한다</tspan><tspan x="204.5" dy="18.5">무엇을 추정하는가</tspan></text></g><text x="204" y="593" class="fill-N1 s1"><tspan x="204" dy="0">어느 칸으로 가든 꼴은 하나다</tspan><tspan x="204" dy="17.667">점추정값 ± 임곗값 × 표준오차</tspan><tspan x="204" dy="17.667">분산만 예외 — 좌우가 대칭이 아니다</tspan></text><g ><g class="shape"><path d="M594 13h118v66H594z" class="stroke-B1 fill-B6 s0"/></g><text x="653" y="51.5" class="text-bold fill-N1 s1">모평균 μ</text></g><g ><g class="shape"><path d="M594 289h117v66H594z" class="stroke-B1 fill-B6 s0"/></g><text x="652.5" y="327.5" class="text-bold fill-N1 s1">모비율 p</text></g><g ><g class="shape"><path d="M590 436h125v66H590z" class="stroke-B1 fill-B6 s0"/></g><text x="652.5" y="474.5" class="text-bold fill-N1 s1">모분산 σ²</text></g><g ><g class="shape"><path d="M567 583h171v66H567z" class="stroke-B1 fill-B6 s0"/></g><text x="652.5" y="621.5" class="text-bold fill-N1 s1">두 모집단의 차</text></g><g ><g class="shape"><path d="M1159 92h-4L945 47c-2 0-2-1 0-2l210-45h8l210 45c2 0 2 1 0 2l-210 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1159" y="51.5" class="text-bold fill-N1 s1">모표준편차 σ 를 아는가</text></g><g ><g class="shape"><path d="M1807 5h188v82h-188z" class="stroke-B1 fill-B6 s0"/></g><text x="1901" y="43.5" class="text-bold fill-N1 s1"><tspan x="1901" dy="0">x̄ ± z × σ/√n</tspan><tspan x="1901" dy="18.5">표준정규 임곗값</tspan></text></g><g ><g class="shape"><path d="M1785 147h232v82h-232z" class="stroke-B1 fill-B6 s0"/></g><text x="1901" y="185.5" class="text-bold fill-N1 s1"><tspan x="1901" dy="0">x̄ ± t(n−1) × s/√n</tspan><tspan x="1901" dy="18.5">실전에서는 거의 이쪽</tspan></text></g><g ><g class="shape"><path d="M1159 368h-5l-255-45c-3 0-3-1 0-2l255-45h10l255 45c3 0 3 1 0 2l-255 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1159" y="327.5" class="text-bold fill-N1 s1">np̂ ≥ 10 이고 n(1−p̂) ≥ 10 인가</text></g><g ><g class="shape"><path d="M1797 289h209v66h-209z" class="stroke-B1 fill-B6 s0"/></g><text x="1901.5" y="327.5" class="text-bold fill-N1 s1">p̂ ± z × √(p̂(1−p̂)/n)</text></g><g ><g class="shape"><path d="M1785 424h232v82h-232z" class="stroke-B1 fill-B6 s0"/></g><text x="1901" y="462.5" class="text-bold fill-N1 s1"><tspan x="1901" dy="0">정규근사를 쓰지 않는</tspan><tspan x="1901" dy="18.5">정확구간이 필요하다</tspan></text></g><g ><g class="shape"><path d="M1013 428h293v82h-293z" class="stroke-B1 fill-B6 s0"/></g><text x="1159.5" y="466.5" class="text-bold fill-N1 s1"><tspan x="1159.5" dy="0">((n−1)s²/χ²~{우}, (n−1)s²/χ²~{좌})</tspan><tspan x="1159.5" dy="18.5">좌우가 대칭이 아니다</tspan></text></g><g ><g class="shape"><path d="M1159 662h-4l-240-45c-3 0-3-1 0-2l240-45h9l240 45c3 0 3 1 0 2l-241 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1159" y="621.5" class="text-bold fill-N1 s1">두 표본이 짝지어져 있는가</text></g><g ><g class="shape"><path d="M1789 566h224v82h-224z" class="stroke-B1 fill-B6 s0"/></g><text x="1901" y="604.5" class="text-bold fill-N1 s1"><tspan x="1901" dy="0">차이 d 를 만들어</tspan><tspan x="1901" dy="18.5">한 표본 t 구간을 쓴다</tspan></text></g><g ><g class="shape"><path d="M1901 809h-4l-196-45c-2 0-2-1 0-2l196-45h7l197 45c2 0 2 1 0 2l-196 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1901" y="768.5" class="text-bold fill-N1 s1">두 모분산이 비슷한가</text></g><g ><g class="shape"><path d="M2377 698h240v82h-240z" class="stroke-B1 fill-B6 s0"/></g><text x="2497" y="736.5" class="text-bold fill-N1 s1"><tspan x="2497" dy="0">합동분산 s~p 를 만들고</tspan><tspan x="2497" dy="18.5">자유도 n~1 + n~2 − 2 인 t</tspan></text></g><g ><g class="shape"><path d="M2362 840h270v82h-270z" class="stroke-B1 fill-B6 s0"/></g><text x="2497" y="878.5" class="text-bold fill-N1 s1"><tspan x="2497" dy="0">√(s~1²/n~1 + s~2²/n~2) 를 쓰고</tspan><tspan x="2497" dy="18.5">자유도는 근사식으로</tspan></text></g><text x="204" y="706" class="fill-N1 s1"><tspan x="204" dy="0">정규성 가정을 어디서 쓰는지 보라.</tspan><tspan x="204" dy="17.667">큰 표본에서는 중심극한정리가 대신 받쳐 주지만</tspan><tspan x="204" dy="17.667">분산의 구간은 끝까지 정규성에 기댄다</tspan></text><marker id="mk-d2-3600744046-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3600744046-3488378134)" d="M242.124 407.345C438.2 118.6 508.7 46 589.5 46" class="connection stroke-B1 s0" mask="url(#d2-3600744046)"/><path fill="none" marker-end="url(#mk-d2-3600744046-3488378134)" d="M296.793 416.115C449 341 508.9 322 590.5 322" class="connection stroke-B1 s0" mask="url(#d2-3600744046)"/><path fill="none" marker-end="url(#mk-d2-3600744046-3488378134)" d="M370 466.05c93.6 2.35 138.1 2.95 216.5 2.95" class="connection stroke-B1 s0" mask="url(#d2-3600744046)"/><path fill="none" marker-end="url(#mk-d2-3600744046-3488378134)" d="M291.759 509.953C448 594.6 503.5 616 563.5 616" class="connection stroke-B1 s0" mask="url(#d2-3600744046)"/><path fill="none" marker-end="url(#mk-d2-3600744046-3488378134)" d="M714.5 46H940" class="connection stroke-B1 s0" mask="url(#d2-3600744046)"/><path fill="none" marker-end="url(#mk-d2-3600744046-3488378134)" d="M1376 46h427" class="connection stroke-B1 s0" mask="url(#d2-3600744046)"/><text x="1590.5" y="52" class="text-italic fill-N2 s1">안다 (드물다)</text><path fill="none" marker-end=