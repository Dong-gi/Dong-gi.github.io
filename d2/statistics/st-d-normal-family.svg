<svg xmlns="http://www.w3.org/2000/svg" width="1347" height="1107" class="d2-3739577661 d2-svg" viewBox="-101 -101 1347 1107"><rect width="1347" height="1107" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3739577661 .fill-N1{fill:#0a0f25}.d2-3739577661 .fill-N2{fill:#676c7e}.d2-3739577661 .fill-B6{fill:#f7f8fe}.d2-3739577661 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M206 0h129v82H206z" class="stroke-B1 fill-B6 s0"/></g><text x="270.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="270.5" dy="0">정규분포</tspan><tspan x="270.5" dy="18.5">X ∼ N(μ, σ²)</tspan></text></g><g ><g class="shape"><path d="M172 203h198v82H172z" class="stroke-B1 fill-B6 s0"/></g><text x="271" y="241.5" class="text-bold fill-N1 s1"><tspan x="271" dy="0">표준정규</tspan><tspan x="271" dy="18.5">Z = (X − μ)/σ ∼ N(0, 1)</tspan></text></g><g ><g class="shape"><path d="M282 385h124v82H282z" class="stroke-B1 fill-B6 s0"/></g><text x="344" y="423.5" class="text-bold fill-N1 s1"><tspan x="344" dy="0">제곱한다</tspan><tspan x="344" dy="18.5">Z²</tspan></text></g><g ><g class="shape"><path d="M250 588h188v98H250z" class="stroke-B1 fill-B6 s0"/></g><text x="344" y="626.5" class="text-bold fill-N1 s1"><tspan x="344" dy="0">카이제곱분포</tspan><tspan x="344" dy="17.667">χ²(k) = Z₁² + ⋯ + Zₖ²</tspan><tspan x="344" dy="17.667">μ = k, σ² = 2k</tspan></text></g><g ><g class="shape"><path d="M0 807h252v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="126" y="845.5" class="text-bold fill-N1 s1"><tspan x="126" dy="0">t 분포</tspan><tspan x="126" dy="17.667">T = Z / √(V/k), V ∼ χ²(k)</tspan><tspan x="126" dy="17.667">정규보다 꼬리가 두껍다</tspan></text></g><g ><g class="shape"><path d="M342 807h206v98H342z" class="stroke-B1 fill-B6 s0"/></g><text x="445" y="845.5" class="text-bold fill-N1 s1"><tspan x="445" dy="0">F 분포</tspan><tspan x="445" dy="17.667">F = (U/d₁) / (V/d₂)</tspan><tspan x="445" dy="17.667">U ∼ χ²(d₁), V ∼ χ²(d₂)</tspan></text></g><text x="612" y="39" class="fill-N1 s1"><tspan x="612" dy="0">t 를 제곱하면 F 가 된다: T² ∼ F(1, k).</tspan><tspan x="612" dy="18.5">F 의 역수는 자유도를 맞바꾼 F 다: 1/F(d₁, d₂) ∼ F(d₂, d₁)</tspan></text><text x="1017" y="23" class="fill-N1 s1"><tspan x="1017" dy="0">9장에서 이렇게 쓴다.</tspan><tspan x="1017" dy="17.25">카이제곱 → 표본분산 S² 의 분포</tspan><tspan x="1017" dy="17.25">t → σ 를 모를 때의 표본평균</tspan><tspan x="1017" dy="17.25">F → 두 표본분산의 비</tspan></text><marker id="mk-d2-3739577661-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3739577661-3488378134)" d="M270.5 83.5v116" class="connection stroke-B1 s0" mask="url(#d2-3739577661)"/><text x="271" y="148" class="text-italic fill-N2 s1">표준화</text><path fill="none" marker-end="url(#mk-d2-3739577661-3488378134)" d="M304.75 286.562C335.5 325 343.5 345 343.5 381" class="connection stroke-B1 s0" mask="url(#d2-3739577661)"/><path fill="none" marker-end="url(#mk-d2-3739577661-3488378134)" d="M343.5 468.5v116" class="connection stroke-B1 s0" mask="url(#d2-3739577661)"/><text x="344" y="533" class="text-italic fill-N2 s1">독립인 것 k 개를 더한다</text><path fill="none" marker-end="url(#mk-d2-3739577661-3488378134)" d="M182.697 285.867C101.3 325 80.5 353.2 80.5 380.5v201.75c0 32.85 5 176.45 23.483 221.549" class="connection stroke-B1 s0" mask="url(#d2-3739577661)"/><text x="81" y="524" class="text-italic fill-N2 s1">분자에</text><path fill="none" marker-end="url(#mk-d2-3739577661-3488378134)" d="M277.41 686.713C215 734.3 191 758.7 161.193 804.155" class="connection stroke-B1 s0" mask="url(#d2-3739577661)"/><text x="211" y="744" class="text-italic fill-N2 s1">분모에 (Z 와 독립)</text><path fill="none" marker-end="url(#mk-d2-3739577661-3488378134)" d="M390.603 686.973C434.05 734.3 445.25 758.7 445.25 803.5" class="connection stroke-B1 s0" mask="url(#d2-3739577661)"/><text x="436.5" y="744" class="text-italic fill-N2 s1">독립인 카이제곱 두 개의 비</text><mask id="d2-3739577661" width="1347" height="1107" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1347v1107H-101z"/><path d="M240 132h62v21h-62zM245 517h198v21H245zM50 508h62v21H50zM138 728h146v21H138zM322 728h229v21H322z"/></mask></svg>