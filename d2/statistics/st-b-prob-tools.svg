<svg xmlns="http://www.w3.org/2000/svg" width="1301" height="1445" class="d2-2420070034 d2-svg" viewBox="-89 -89 1301 1445"><rect width="1301" height="1445" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2420070034 .text-bold{font-weight:700}.d2-2420070034 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2420070034 .fill-N1{fill:#0a0f25}.d2-2420070034 .fill-N2{fill:#676c7e}.d2-2420070034 .fill-B6{fill:#f7f8fe}.d2-2420070034 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="652" cy="62" class="shape stroke-B1 fill-B6 s0" rx="150" ry="50"/></g><text x="652" y="67.5" class="text-bold fill-N1 s1">확률을 구해야 한다</text></g><g ><g class="shape"><path d="M519 182h267v82H519z" class="stroke-B1 fill-B6 s0"/></g><text x="652.5" y="220.5" class="text-bold fill-N1 s1"><tspan x="652.5" dy="0">표본공간 S 를 먼저 적는다</tspan><tspan x="652.5" dy="18.5">무엇이 한 번의 결과인가</tspan></text></g><g ><g class="shape"><path d="M172 344h212v98H172z" class="stroke-B1 fill-B6 s0"/></g><text x="278" y="382.5" class="text-bold fill-N1 s1"><tspan x="278" dy="0">결과가 유한 개이고</tspan><tspan x="278" dy="17.667">모두 같은 정도로</tspan><tspan x="278" dy="17.667">일어나는가</tspan></text></g><g ><g class="shape"><path d="M12 637h226v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="125" y="675.5" class="text-bold fill-N1 s1"><tspan x="125" dy="0">P(A) = |A| / |S|</tspan><tspan x="125" dy="17.667">세는 문제로 바뀐다</tspan><tspan x="125" dy="17.667">(순열·조합·포함배제)</tspan></text></g><g ><g class="shape"><path d="M64 823h274v98H64z" class="stroke-B1 fill-B6 s0"/></g><text x="201" y="861.5" class="text-bold fill-N1 s1"><tspan x="201" dy="0">길이·넓이·부피의 비</tspan><tspan x="201" dy="17.667">‘균등하게 고른다’는 뜻을</tspan><tspan x="201" dy="17.667">먼저 정해야 한다</tspan></text></g><g ><g class="shape"><path d="M319 629h191v114H319z" class="stroke-B1 fill-B6 s0"/></g><text x="414.5" y="667.5" class="text-bold fill-N1 s1"><tspan x="414.5" dy="0">각 결과에 확률을</tspan><tspan x="414.5" dy="17.25">직접 준다</tspan><tspan x="414.5" dy="17.25">공리 세 개만</tspan><tspan x="414.5" dy="17.25">지키면 된다</tspan></text></g><g ><g class="shape"><path d="M568 352h168v82H568z" class="stroke-B1 fill-B6 s0"/></g><text x="652" y="390.5" class="text-bold fill-N1 s1"><tspan x="652" dy="0">이미 알려진</tspan><tspan x="652" dy="18.5">정보가 있는가</tspan></text></g><g ><g class="shape"><path d="M530 645h245v82H530z" class="stroke-B1 fill-B6 s0"/></g><text x="652.5" y="683.5" class="text-bold fill-N1 s1"><tspan x="652.5" dy="0">P(A|B) = P(A∩B) / P(B)</tspan><tspan x="652.5" dy="18.5">표본공간을 B 로 줄인다</tspan></text></g><g ><g class="shape"><path d="M493 831h319v82H493z" class="stroke-B1 fill-B6 s0"/></g><text x="652.5" y="869.5" class="text-bold fill-N1 s1"><tspan x="652.5" dy="0">원인으로 경우를 나눌 수 있는가</tspan><tspan x="652.5" dy="18.5">→ 전확률 정리로 더한다</tspan></text></g><g ><g class="shape"><path d="M482 991h340v82H482z" class="stroke-B1 fill-B6 s0"/></g><text x="652" y="1029.5" class="text-bold fill-N1 s1"><tspan x="652" dy="0">묻는 방향이 아는 방향과 반대인가</tspan><tspan x="652" dy="18.5">→ 베이즈 정리</tspan></text></g><g ><g class="shape"><path d="M857 352h191v82H857z" class="stroke-B1 fill-B6 s0"/></g><text x="952.5" y="390.5" class="text-bold fill-N1 s1"><tspan x="952.5" dy="0">여러 사건이 함께</tspan><tspan x="952.5" dy="18.5">일어날 확률인가</tspan></text></g><g ><g class="shape"><path d="M795 629h316v98H795z" class="stroke-B1 fill-B6 s0"/></g><text x="953" y="667.5" class="text-bold fill-N1 s1"><tspan x="953" dy="0">독립이면 곱한다</tspan><tspan x="953" dy="17.667">셋 이상이면 모든 부분집합에서</tspan><tspan x="953" dy="17.667">곱셈이 성립해야 한다</tspan></text></g><path fill="transparent" stroke="transparent" d="M312 1093h498v162H312z" class="shape s0"/><text x="561" y="1133" class="fill-N1 s1"><tspan x="561" dy="0">표본공간을 어떻게 적느냐가 답을 바꾼다.</tspan><tspan x="561" dy="17.667">주사위 두 개를 구별하지 않고 세면</tspan><tspan x="561" dy="17.667">근원사건이 같은 정도로 일어나지 않아 셈이 틀어진다</tspan></text><text x="512.5" y="1210" class="fill-N1 s1"><tspan x="512.5" dy="0">‘배반이니까 독립’ 은 틀렸다.</tspan><tspan x="512.5" dy="18.5">배반은 집합의 관계, 독립은 확률의 관계다</tspan></text><marker id="mk-d2-2420070034-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="m652.971 114-.914 64" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="M585.75 266v28s0 10-10 10H288s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="M225 444v189" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><text x="225" y="545" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="M278 444v375" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><text x="278.5" y="630" class="text-italic fill-N2 s1"><tspan x="278.5" dy="0">결과가</tspan><tspan x="278.5" dy="18.5">연속적이다</tspan></text><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="M331 444v181" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><text x="331" y="533" class="text-italic fill-N2 s1"><tspan x="331" dy="0">같은 정도가</tspan><tspan x="331" dy="18.5">아니다</tspan></text><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="M652.5 266v82" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="M652.5 436v205" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><text x="652.5" y="545" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="M652.5 729v98" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="M652.5 915v72" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="M719.25 266v28s0 10 10 10H943s10 0 10 10v34" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><path fill="none" marker-end="url(#mk-d2-2420070034-3488378134)" d="M953 436v189" class="connection stroke-B1 s0" mask="url(#d2-2420070034)"/><text x="953" y="537" class="text-italic fill-N2 s1">그렇다</text><mask id="d2-2420070034" width="1301" height="1445" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1301v1445H-89z"/><path d="M194 529h62v21h-62zM228 614h101v37H228zM279 517h104v37H279zM631 529h43v21h-43zM922 521h62v21h-62z"/></mask></svg>