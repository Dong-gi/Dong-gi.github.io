<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="915" class="d2-4165575751 d2-svg" viewBox="-101 -101 3400 915"><rect width="3400" height="915" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4165575751 .fill-N1{fill:#0a0f25}.d2-4165575751 .fill-N2{fill:#676c7e}.d2-4165575751 .fill-B6{fill:#f7f8fe}.d2-4165575751 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="225" cy="453" class="shape stroke-B1 fill-B6 s0" rx="150" ry="50"/></g><text x="225" y="458.5" class="text-bold fill-N1 s1">확률을 구해야 한다</text></g><g ><g class="shape"><path d="M651 412h267v82H651z" class="stroke-B1 fill-B6 s0"/></g><text x="784.5" y="450.5" class="text-bold fill-N1 s1"><tspan x="784.5" dy="0">표본공간 S 를 먼저 적는다</tspan><tspan x="784.5" dy="18.5">무엇이 한 번의 결과인가</tspan></text></g><g ><g class="shape"><path d="M1141 120h296v82h-296z" class="stroke-B1 fill-B6 s0"/></g><text x="1289" y="158.5" class="text-bold fill-N1 s1"><tspan x="1289" dy="0">결과가 유한 개이고</tspan><tspan x="1289" dy="18.5">모두 같은 정도로 일어나는가</tspan></text></g><g ><g class="shape"><path d="M1866 0h226v98h-226z" class="stroke-B1 fill-B6 s0"/></g><text x="1979" y="38.5" class="text-bold fill-N1 s1"><tspan x="1979" dy="0">P(A) = |A| / |S|</tspan><tspan x="1979" dy="17.667">세는 문제로 바뀐다</tspan><tspan x="1979" dy="17.667">(순열·조합·포함배제)</tspan></text></g><g ><g class="shape"><path d="M1842 158h274v98h-274z" class="stroke-B1 fill-B6 s0"/></g><text x="1979" y="196.5" class="text-bold fill-N1 s1"><tspan x="1979" dy="0">길이·넓이·부피의 비</tspan><tspan x="1979" dy="17.667">‘균등하게 고른다’는 뜻을</tspan><tspan x="1979" dy="17.667">먼저 정해야 한다</tspan></text></g><g ><g class="shape"><path d="M1840 316h279v82h-279z" class="stroke-B1 fill-B6 s0"/></g><text x="1979.5" y="354.5" class="text-bold fill-N1 s1"><tspan x="1979.5" dy="0">각 결과에 확률을 직접 준다</tspan><tspan x="1979.5" dy="18.5">공리 세 개만 지키면 된다</tspan></text></g><g ><g class="shape"><path d="M1151 466h276v66h-276z" class="stroke-B1 fill-B6 s0"/></g><text x="1289" y="504.5" class="text-bold fill-N1 s1">이미 알려진 정보가 있는가</text></g><g ><g class="shape"><path d="M1857 458h245v82h-245z" class="stroke-B1 fill-B6 s0"/></g><text x="1979.5" y="496.5" class="text-bold fill-N1 s1"><tspan x="1979.5" dy="0">P(A|B) = P(A∩B) / P(B)</tspan><tspan x="1979.5" dy="18.5">표본공간을 B 로 줄인다</tspan></text></g><g ><g class="shape"><path d="M2338 458h319v82h-319z" class="stroke-B1 fill-B6 s0"/></g><text x="2497.5" y="496.5" class="text-bold fill-N1 s1"><tspan x="2497.5" dy="0">원인으로 경우를 나눌 수 있는가</tspan><tspan x="2497.5" dy="18.5">→ 전확률 정리로 더한다</tspan></text></g><g ><g class="shape"><path d="M2858 458h340v82h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="3028" y="496.5" class="text-bold fill-N1 s1"><tspan x="3028" dy="0">묻는 방향이 아는 방향과 반대인가</tspan><tspan x="3028" dy="18.5">→ 베이즈 정리</tspan></text></g><g ><g class="shape"><path d="M1119 616h340v66h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="1289" y="654.5" class="text-bold fill-N1 s1">여러 사건이 함께 일어날 확률인가</text></g><g ><g class="shape"><path d="M1821 600h316v98h-316z" class="stroke-B1 fill-B6 s0"/></g><text x="1979" y="638.5" class="text-bold fill-N1 s1"><tspan x="1979" dy="0">독립이면 곱한다</tspan><tspan x="1979" dy="17.667">셋 이상이면 모든 부분집합에서</tspan><tspan x="1979" dy="17.667">곱셈이 성립해야 한다</tspan></text></g><text x="225" y="579" class="fill-N1 s1"><tspan x="225" dy="0">표본공간을 어떻게 적느냐가 답을 바꾼다.</tspan><tspan x="225" dy="17.667">주사위 두 개를 구별하지 않고 세면</tspan><tspan x="225" dy="17.667">근원사건이 같은 정도로 일어나지 않아 셈이 틀어진다</tspan></text><text x="225.5" y="692" class="fill-N1 s1"><tspan x="225.5" dy="0">‘배반이니까 독립’ 은 틀렸다.</tspan><tspan x="225.5" dy="18.5">배반은 집합의 관계, 독립은 확률의 관계다</tspan></text><marker id="mk-d2-4165575751-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4165575751-3488378134)" d="M377 453.003c138.4.197 193.7.247 270.5.247" class="connection stroke-B1 s0" mask="url(#d2-4165575751)"/><path fill="none" marker-end="url(#mk-d2-4165575751-3488378134)" d="M818.75 410.689C978.3 211.45 1043.1 161.25 1137.5 161.25" class="connection stroke-B1 s0" mask="url(#d2-4165575751)"/><path fill="none" marker-end="url(#mk-d2-4165575751-3488378134)" d="M1420.904 119.388C1595.8 63.2 1685.2 49 1862 49" class="connection stroke-B1 s0" mask="url(#d2-4165575751)"/><text x="1638" y="62" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-4165575751-3488378134)" d="M1438.984 181.254C1599.4 201.8 1680.4 207 1838 207" class="connection stroke-B1 s0" mask="url(#d2-4165575751)"/><text x="1639" y="210" class="text-italic fill-N2 s1">결과가 연속적이다</text><path fill="none" marker-end="url(#mk-d2-4165575751-3488378134)" d="M1364.264 203.224C1584.504 326.05 1679.9 357 1835.5 357" class="connection stroke-B1 s0" mask="url(#d2-4165575751)"/><text x="1587.5" y="332" class="text-italic fill-N2 s1">같은 정도가 아니다</text><path fill="none" marker-end="url(#mk-d2-4165575751-3488378134)" d="M919.462 479.388C998.3 495 1045.099 499 1147.5 499" class="connection stroke-B1 s0" mask="url(#d2-4165575751)"/><path fill="none" marker-end="url(#mk-d2-4165575751-3488378134)" d="M1429 499h423.5" class="connection stroke-B1 s0" mask="url(#d2-4165575751)"/><text x="1641.5" y="505" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-4165575751-3488378134)" d="M2104.5 499h230" class="connection stroke-B1 s0" mask="url(#d2-4165575751)"/><path fill="none" marker-end="url(#mk-d2-4165575751-3488378134)" d="M2658.5 499h196" class="connection stroke-B1 s0" mask="url(#d2-4165575751)"/><path fill="none" marker-end="url(#mk-d2-4165575751-3488378134)" d="M835.045 495.533C981.502 618.05 1038.7 649 1115.5 649" class="connection stroke-B1 s0" mask="