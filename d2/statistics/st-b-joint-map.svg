<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1297" class="d2-2062935444 d2-svg" viewBox="-89 -89 1220 1297"><rect width="1220" height="1297" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2062935444 .fill-N1{fill:#0a0f25}.d2-2062935444 .fill-N2{fill:#676c7e}.d2-2062935444 .fill-B6{fill:#f7f8fe}.d2-2062935444 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="517" cy="68" class="shape stroke-B1 fill-B6 s0" rx="168" ry="56"/></g><text x="517" y="65.5" class="text-bold fill-N1 s1"><tspan x="517" dy="0">결합분포 f(x, y)</tspan><tspan x="517" dy="18.5">두 변수를 함께 적은 것</tspan></text></g><g ><g class="shape"><path d="M12 345h168v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="96" y="383.5" class="text-bold fill-N1 s1"><tspan x="96" dy="0">주변분포 g(x)</tspan><tspan x="96" dy="17.667">y 를 더하거나</tspan><tspan x="96" dy="17.667">적분해 지운다</tspan></text></g><g ><g class="shape"><path d="M200 345h168v98H200z" class="stroke-B1 fill-B6 s0"/></g><text x="284" y="383.5" class="text-bold fill-N1 s1"><tspan x="284" dy="0">주변분포 h(y)</tspan><tspan x="284" dy="17.667">x 를 더하거나</tspan><tspan x="284" dy="17.667">적분해 지운다</tspan></text></g><g ><g class="shape"><path d="M388 345h259v98H388z" class="stroke-B1 fill-B6 s0"/></g><text x="517.5" y="383.5" class="text-bold fill-N1 s1"><tspan x="517.5" dy="0">조건부분포</tspan><tspan x="517.5" dy="17.667">f(y|x) = f(x,y)/g(x)</tspan><tspan x="517.5" dy="17.667">한 값을 알았을 때의 분포</tspan></text></g><g ><g class="shape"><path d="M401 513h232v98H401z" class="stroke-B1 fill-B6 s0"/></g><text x="517" y="551.5" class="text-bold fill-N1 s1"><tspan x="517" dy="0">조건부 기댓값 E[X|Y]</tspan><tspan x="517" dy="17.667">그 자체가 확률변수다</tspan><tspan x="517" dy="17.667">E[E[X|Y]] = E[X]</tspan></text></g><g ><g class="shape"><path d="M667 345h207v98H667z" class="stroke-B1 fill-B6 s0"/></g><text x="770.5" y="383.5" class="text-bold fill-N1 s1"><tspan x="770.5" dy="0">독립</tspan><tspan x="770.5" dy="17.667">f(x,y) = g(x)h(y) 가</tspan><tspan x="770.5" dy="17.667">모든 (x,y) 에서 성립</tspan></text></g><g ><g class="shape"><path d="M653 691h377v82H653z" class="stroke-B1 fill-B6 s0"/></g><text x="841.5" y="729.5" class="text-bold fill-N1 s1"><tspan x="841.5" dy="0">공분산 Cov(X,Y) = E[XY] − E[X]E[Y]</tspan><tspan x="841.5" dy="18.5">상관계수 ρ = 공분산 ÷ 두 표준편차의 곱</tspan></text></g><g ><g class="shape"><path d="M710 843h263v82H710z" class="stroke-B1 fill-B6 s0"/></g><text x="841.5" y="881.5" class="text-bold fill-N1 s1"><tspan x="841.5" dy="0">V(aX+bY)</tspan><tspan x="841.5" dy="18.5">= a²V(X) + b²V(Y) + 2ab Cov(X,Y)</tspan></text></g><path fill="transparent" stroke="transparent" d="M280 945h482v162H280z" class="shape s0"/><text x="521" y="985" class="fill-N1 s1"><tspan x="521" dy="0">화살표는 한쪽으로만 간다.</tspan><tspan x="521" dy="17.667">주변분포 둘을 안다고 결합분포를 복원할 수는 없다.</tspan><tspan x="521" dy="17.667">독립이라는 조건이 붙어야만 곱해서 되돌릴 수 있다</tspan></text><text x="447.5" y="1062" class="fill-N1 s1"><tspan x="447.5" dy="0">Cov = 0 은 독립을 뜻하지 않는다.</tspan><tspan x="447.5" dy="18.5">상관은 직선 관계만 잡기 때문이다</tspan></text><marker id="mk-d2-2062935444-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2062935444-3488378134)" d="m405.981 112-.388 42s-.093 10-10.093 10H106s-10 0-10 10v167" class="connection stroke-B1 s0" mask="url(#d2-2062935444)"/><text x="187" y="170" class="text-italic fill-N2 s1">y 를 지운다</text><path fill="none" marker-end="url(#mk-d2-2062935444-3488378134)" d="m461.99 123-.436 81s-.054 10-10.054 10H294s-10 0-10 10v117" class="connection stroke-B1 s0" mask="url(#d2-2062935444)"/><text x="354" y="220" class="text-italic fill-N2 s1">x 를 지운다</text><path fill="none" marker-end="url(#mk-d2-2062935444-3488378134)" d="m517.99 126-.972 215" class="connection stroke-B1 s0" mask="url(#d2-2062935444)"/><text x="517.5" y="240" class="text-italic fill-N2 s1">x 를 고정한다</text><path fill="none" marker-end="url(#mk-d2-2062935444-3488378134)" d="M517.5 445v64" class="connection stroke-B1 s0" mask="url(#d2-2062935444)"/><path fill="none" marker-end="url(#mk-d2-2062935444-3488378134)" d="m573.99 123-.436 81s-.054 10 9.946 10h177s10 0 10 10v117" class="connection stroke-B1 s0" mask="url(#d2-2062935444)"/><text x="691" y="220" class="text-italic fill-N2 s1">곱으로 쪼개지는가</text><path fill="none" marker-end="url(#mk-d2-2062935444-3488378134)" d="m629.981 112-.388 42s-.093 10 9.907 10H904s10 0 10 10v513" class="connection stroke-B1 s0" mask="url(#d2-2062935444)"/><path fill="none" marker-end="url(#mk-d2-2062935444-3488378134)" d="M842.25 775v64" class="connection stroke-B1 s0" mask="url(#d2-2062935444)"/><path fill="none" marker-end="url(#mk-d2-2062935444-3488378134)" d="M779.416 445v242" class="connection stroke-B1 s0" mask="url(#d2-2062935444)"/><text x="779.5" y="573" class="text-italic fill-N2 s1">독립이면 Cov = 0</text><mask id="d2-2062935444" width="1220" height="1297" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1220v1297H-89z"/><path d="M139 154h96v21h-96zM306 204h96v21h-96zM460 224h115v21H460zM610 204h162v21H610zM714 557h131v21H714z"/></mask></svg>