<svg xmlns="http://www.w3.org/2000/svg" width="2443" height="793" class="d2-3292361940 d2-svg" viewBox="-101 -101 2443 793"><rect width="2443" height="793" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3292361940 .fill-N1{fill:#0a0f25}.d2-3292361940 .fill-N2{fill:#676c7e}.d2-3292361940 .fill-B6{fill:#f7f8fe}.d2-3292361940 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="217" cy="325" class="shape stroke-B1 fill-B6 s0" rx="168" ry="56"/></g><text x="217" y="322.5" class="text-bold fill-N1 s1"><tspan x="217" dy="0">결합분포 f(x, y)</tspan><tspan x="217" dy="18.5">두 변수를 함께 적은 것</tspan></text></g><g ><g class="shape"><path d="M790 0h288v82H790z" class="stroke-B1 fill-B6 s0"/></g><text x="934" y="38.5" class="text-bold fill-N1 s1"><tspan x="934" dy="0">주변분포 g(x)</tspan><tspan x="934" dy="18.5">y 를 더하거나 적분해 지운다</tspan></text></g><g ><g class="shape"><path d="M790 142h288v82H790z" class="stroke-B1 fill-B6 s0"/></g><text x="934" y="180.5" class="text-bold fill-N1 s1"><tspan x="934" dy="0">주변분포 h(y)</tspan><tspan x="934" dy="18.5">x 를 더하거나 적분해 지운다</tspan></text></g><g ><g class="shape"><path d="M798 284h272v82H798z" class="stroke-B1 fill-B6 s0"/></g><text x="934" y="322.5" class="text-bold fill-N1 s1"><tspan x="934" dy="0">조건부분포 f(y|x) = f(x,y)/g(x)</tspan><tspan x="934" dy="18.5">한 값을 알았을 때의 분포</tspan></text></g><g ><g class="shape"><path d="M1476 276h232v98h-232z" class="stroke-B1 fill-B6 s0"/></g><text x="1592" y="314.5" class="text-bold fill-N1 s1"><tspan x="1592" dy="0">조건부 기댓값 E[X|Y]</tspan><tspan x="1592" dy="17.667">그 자체가 확률변수다</tspan><tspan x="1592" dy="17.667">E[E[X|Y]] = E[X]</tspan></text></g><g ><g class="shape"><path d="M831 481h207v98H831z" class="stroke-B1 fill-B6 s0"/></g><text x="934.5" y="519.5" class="text-bold fill-N1 s1"><tspan x="934.5" dy="0">독립</tspan><tspan x="934.5" dy="17.667">f(x,y) = g(x)h(y) 가</tspan><tspan x="934.5" dy="17.667">모든 (x,y) 에서 성립</tspan></text></g><g ><g class="shape"><path d="M1403 434h377v82h-377z" class="stroke-B1 fill-B6 s0"/></g><text x="1591.5" y="472.5" class="text-bold fill-N1 s1"><tspan x="1591.5" dy="0">공분산 Cov(X,Y) = E[XY] − E[X]E[Y]</tspan><tspan x="1591.5" dy="18.5">상관계수 ρ = 공분산 ÷ 두 표준편차의 곱</tspan></text></g><g ><g class="shape"><path d="M1978 434h263v82h-263z" class="stroke-B1 fill-B6 s0"/></g><text x="2109.5" y="472.5" class="text-bold fill-N1 s1"><tspan x="2109.5" dy="0">V(aX+bY)</tspan><tspan x="2109.5" dy="18.5">= a²V(X) + b²V(Y) + 2ab Cov(X,Y)</tspan></text></g><text x="217" y="457" class="fill-N1 s1"><tspan x="217" dy="0">화살표는 한쪽으로만 간다.</tspan><tspan x="217" dy="17.667">주변분포 둘을 안다고 결합분포를 복원할 수는 없다.</tspan><tspan x="217" dy="17.667">독립이라는 조건이 붙어야만 곱해서 되돌릴 수 있다</tspan></text><text x="217.5" y="570" class="fill-N1 s1"><tspan x="217.5" dy="0">Cov = 0 은 독립을 뜻하지 않는다.</tspan><tspan x="217.5" dy="18.5">상관은 직선 관계만 잡기 때문이다</tspan></text><marker id="mk-d2-3292361940-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3292361940-3488378134)" d="M289.624 272.832C547.2 87.6 647.6 41 786 41" class="connection stroke-B1 s0" mask="url(#d2-3292361940)"/><text x="520" y="112" class="text-italic fill-N2 s1">y 를 지운다</text><path fill="none" marker-end="url(#mk-d2-3292361940-3488378134)" d="M332.882 283.324C555.8 203.2 647.6 183 786 183" class="connection stroke-B1 s0" mask="url(#d2-3292361940)"/><text x="555" y="209" class="text-italic fill-N2 s1">x 를 지운다</text><path fill="none" marker-end="url(#mk-d2-3292361940-3488378134)" d="M387 325h407" class="connection stroke-B1 s0" mask="url(#d2-3292361940)"/><text x="591.5" y="331" class="text-italic fill-N2 s1">x 를 고정한다</text><path fill="none" marker-end="url(#mk-d2-3292361940-3488378134)" d="M1071.5 325h400" class="connection stroke-B1 s0" mask="url(#d2-3292361940)"/><path fill="none" marker-end="url(#mk-d2-3292361940-3488378134)" d="M310.775 372.922C551.4 498 655.7 529.5 826.5 529.5" class="connection stroke-B1 s0" mask="url(#d2-3292361940)"/><text x="556" y="505" class="text-italic fill-N2 s1">곱으로 쪼개지는가</text><path fill="none" marker-end="url(#mk-d2-3292361940-3488378134)" d="M344.92 362.56C558.2 424.8 676.4 440.5 773 440.5s500.1 3.2 626.52 15.61" class="connection stroke-B1 s0" mask="url(#d2-3292361940)"/><path fill="none" marker-end="url(#mk-d2-3292361940-3488378134)" d="M1782 475h192" class="connection stroke-B1 s0" mask="url(#d2-3292361940)"/><path fill="none" marker-end="url(#mk-d2-3292361940-3488378134)" d="M1040.5 529.5c159.6 0 232.6-5 359.046-24.394" class="connection stroke-B1 s0" mask="url(#d2-3292361940)"/><text x="1221.5" y="534" class="text-italic fill-N2 s1">독립이면 Cov = 0</text><mask id="d2-3292361940" width="2443" height="793" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2443v793H-101z"/><path d="M472 96h96v21h-96zM507 193h96v21h-96zM534 315h115v21H534zM475 489h162v21H475zM1156 518h131v21h-131z"/></mask></svg>