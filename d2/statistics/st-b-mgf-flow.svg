<svg xmlns="http://www.w3.org/2000/svg" width="2568" height="806" class="d2-758151770 d2-svg" viewBox="-101 -101 2568 806"><rect width="2568" height="806" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-758151770 .fill-N1{fill:#0a0f25}.d2-758151770 .fill-B6{fill:#f7f8fe}.d2-758151770 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="249" cy="349.5" class="shape stroke-B1 fill-B6 s0" rx="133" ry="44.5"/></g><text x="249" y="355" class="text-bold fill-N1 s1">분포 f(x) 또는 p(x)</text></g><g ><g class="shape"><path d="M866 308h165v82H866z" class="stroke-B1 fill-B6 s0"/></g><text x="948.5" y="346.5" class="text-bold fill-N1 s1"><tspan x="948.5" dy="0">적률생성함수</tspan><tspan x="948.5" dy="18.5">M(t) = E[e^tX]</tspan></text></g><g ><g class="shape"><path d="M1275 59h236v82h-236z" class="stroke-B1 fill-B6 s0"/></g><text x="1393" y="97.5" class="text-bold fill-N1 s1"><tspan x="1393" dy="0">e^tX 를 급수로 펴면</tspan><tspan x="1393" dy="18.5">M(t) = 1 + μt + E[X²]t²/2! + ⋯</tspan></text></g><g ><g class="shape"><path d="M1755 59h197v82h-197z" class="stroke-B1 fill-B6 s0"/></g><text x="1853.5" y="97.5" class="text-bold fill-N1 s1"><tspan x="1853.5" dy="0">t = 0 에서 k 번 미분</tspan><tspan x="1853.5" dy="18.5">M⁽ᵏ⁾(0) = E[Xᵏ]</tspan></text></g><g ><g class="shape"><path d="M2189 0h144v66h-144z" class="stroke-B1 fill-B6 s0"/></g><text x="2261" y="38.5" class="text-bold fill-N1 s1">1차 → 평균 μ</text></g><g ><g class="shape"><path d="M2181 126h160v82h-160z" class="stroke-B1 fill-B6 s0"/></g><text x="2261" y="164.5" class="text-bold fill-N1 s1"><tspan x="2261" dy="0">2차 → E[X²]</tspan><tspan x="2261" dy="18.5">V(X) = E[X²] − μ²</tspan></text></g><g ><g class="shape"><path d="M2156 268h210v66h-210z" class="stroke-B1 fill-B6 s0"/></g><text x="2261" y="306.5" class="text-bold fill-N1 s1">3차·4차 → 왜도·첨도</text></g><g ><g class="shape"><path d="M1235 201h316v82h-316z" class="stroke-B1 fill-B6 s0"/></g><text x="1393" y="239.5" class="text-bold fill-N1 s1"><tspan x="1393" dy="0">aX + b 의 적률생성함수는</tspan><tspan x="1393" dy="18.5">e^(bt) 를 곱하고 t 를 at 로 바꾼 것</tspan></text></g><g ><g class="shape"><path d="M1237 343h313v98h-313z" class="stroke-B1 fill-B6 s0"/></g><text x="1393.5" y="381.5" class="text-bold fill-N1 s1"><tspan x="1393.5" dy="0">독립이면 합의 적률생성함수는</tspan><tspan x="1393.5" dy="17.667">각각의 적률생성함수의 곱이다</tspan><tspan x="1393.5" dy="17.667">합의 분포를 곱셈으로 얻는다</tspan></text></g><g ><g class="shape"><path d="M1269 501h249v82h-249z" class="stroke-B1 fill-B6 s0"/></g><text x="1393.5" y="539.5" class="text-bold fill-N1 s1"><tspan x="1393.5" dy="0">적률생성함수가 같으면</tspan><tspan x="1393.5" dy="18.5">분포도 같다 (유일성)</tspan></text></g><text x="249.5" y="470" class="fill-N1 s1"><tspan x="249.5" dy="0">존재하지 않을 수도 있다. 꼬리가 두꺼우면</tspan><tspan x="249.5" dy="17.667">0 을 품는 어떤 구간에서도 E[e^tX] 가 발산한다.</tspan><tspan x="249.5" dy="17.667">그때는 e^tX 대신 복소수를 쓰는 특성함수를 쓴다</tspan></text><text x="249" y="583" class="fill-N1 s1"><tspan x="249" dy="0">9장 중심극한정리의 증명 얼개가</tspan><tspan x="249" dy="18.5">‘합의 M(t) 를 계산해 정규의 M(t) 로 수렴함을 보이는 것’ 이다</tspan></text><marker id="mk-d2-758151770-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-758151770-3488378134)" d="M384 349h478" class="connection stroke-B1 s0" mask="url(#d2-758151770)"/><text x="624" y="355" style="fill:#676c7e;text-anchor:middle;font-size:16px">기댓값을 한 번 계산</text><path fill="none" marker-end="url(#mk-d2-758151770-3488378134)" d="M980.19 306.393C1102.2 141.6 1161.4 100 1271 100" class="connection stroke-B1 s0" mask="url(#d2-758151770)"/><path fill="none" marker-end="url(#mk-d2-758151770-3488378134)" d="M1513 100h238" class="connection stroke-B1 s0" mask="url(#d2-758151770)"/><path fill="none" marker-end="url(#mk-d2-758151770-3488378134)" d="M1953.897 66.368C2033.6 39.8 2081 33 2185 33" class="connection stroke-B1 s0" mask="url(#d2-758151770)"/><path fill="none" marker-end="url(#mk-d2-758151770-3488378134)" d="M1953.897 133.632C2033.6 160.2 2079.4 167 2177 167" class="connection stroke-B1 s0" mask="url(#d2-758151770)"/><path fill="none" marker-end="url(#mk-d2-758151770-3488378134)" d="M1895.414 142.414C2022 269 2074.4 301 2152 301" class="connection stroke-B1 s0" mask="url(#d2-758151770)"/><path fill="none" marker-end="url(#mk-d2-758151770-3488378134)" d="M1020.73 306.998C1110.2 255.2 1153.4 242 1231 242" class="connection stroke-B1 s0" mask="url(#d2-758151770)"/><path fill="none" marker-end="url(#mk-d2-758151770-3488378134)" d="M1032.947 368.458C1112.6 387.2 1153.7 392 1232.5 392" class="connection stroke-B1 s0" mask="url(#d2-758151770)"/><path fill="none" marker-end="url(#mk-d2-758151770-3488378134)" d="M989.38 391.447C1104 511.6 1160.1 542 1264.5 542" class="connection stroke-B1 s0" mask="url(#d2-758151770)"/><mask id="d2-758151770" width="2568" height="806" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2568v806H-101z"/><path d="M540 339h168v21H540z"/></mask></svg>