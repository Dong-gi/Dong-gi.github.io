<svg xmlns="http://www.w3.org/2000/svg" width="1361" height="1340" class="d2-331540698 d2-svg" viewBox="-89 -89 1361 1340"><rect width="1361" height="1340" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-331540698 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-331540698 .fill-N1{fill:#0a0f25}.d2-331540698 .fill-B6{fill:#f7f8fe}.d2-331540698 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="668" cy="56.5" class="shape stroke-B1 fill-B6 s0" rx="133" ry="44.5"/></g><text x="668" y="62" class="text-bold fill-N1 s1">분포 f(x) 또는 p(x)</text></g><g ><g class="shape"><path d="M586 262h165v82H586z" class="stroke-B1 fill-B6 s0"/></g><text x="668.5" y="300.5" class="text-bold fill-N1 s1"><tspan x="668.5" dy="0">적률생성함수</tspan><tspan x="668.5" dy="18.5">M(t) = E[e^tX]</tspan></text></g><g ><g class="shape"><path d="M76 498h236v82H76z" class="stroke-B1 fill-B6 s0"/></g><text x="194" y="536.5" class="text-bold fill-N1 s1"><tspan x="194" dy="0">e^tX 를 급수로 펴면</tspan><tspan x="194" dy="18.5">M(t) = 1 + μt + E[X²]t²/2! + ⋯</tspan></text></g><g ><g class="shape"><path d="M96 674h197v82H96z" class="stroke-B1 fill-B6 s0"/></g><text x="194.5" y="712.5" class="text-bold fill-N1 s1"><tspan x="194.5" dy="0">t = 0 에서 k 번 미분</tspan><tspan x="194.5" dy="18.5">M⁽ᵏ⁾(0) = E[Xᵏ]</tspan></text></g><g ><g class="shape"><path d="M12 886h144v66H12z" class="stroke-B1 fill-B6 s0"/></g><text x="84" y="924.5" class="text-bold fill-N1 s1">1차 → 평균 μ</text></g><g ><g class="shape"><path d="M176 886h160v82H176z" class="stroke-B1 fill-B6 s0"/></g><text x="256" y="924.5" class="text-bold fill-N1 s1"><tspan x="256" dy="0">2차 → E[X²]</tspan><tspan x="256" dy="18.5">V(X) = E[X²] − μ²</tspan></text></g><g ><g class="shape"><path d="M356 886h210v66H356z" class="stroke-B1 fill-B6 s0"/></g><text x="461" y="924.5" class="text-bold fill-N1 s1">3차·4차 → 왜도·첨도</text></g><g ><g class="shape"><path d="M332 474h254v98H332z" class="stroke-B1 fill-B6 s0"/></g><text x="459" y="512.5" class="text-bold fill-N1 s1"><tspan x="459" dy="0">aX + b 의 적률생성함수는</tspan><tspan x="459" dy="17.667">e^(bt) 를 곱하고</tspan><tspan x="459" dy="17.667">t 를 at 로 바꾼 것</tspan></text></g><g ><g class="shape"><path d="M606 474h296v130H606z" class="stroke-B1 fill-B6 s0"/></g><text x="754" y="512.5" class="text-bold fill-N1 s1"><tspan x="754" dy="0">독립이면 합의</tspan><tspan x="754" dy="17">적률생성함수는</tspan><tspan x="754" dy="17">각각의</tspan><tspan x="754" dy="17">적률생성함수의 곱이다</tspan><tspan x="754" dy="17">합의 분포를 곱셈으로 얻는다</tspan></text></g><g ><g class="shape"><path d="M922 474h249v82H922z" class="stroke-B1 fill-B6 s0"/></g><text x="1046.5" y="512.5" class="text-bold fill-N1 s1"><tspan x="1046.5" dy="0">적률생성함수가 같으면</tspan><tspan x="1046.5" dy="18.5">분포도 같다 (유일성)</tspan></text></g><path fill="transparent" stroke="transparent" d="M318 988h546v162H318z" class="shape s0"/><text x="542.5" y="1028" class="fill-N1 s1"><tspan x="542.5" dy="0">존재하지 않을 수도 있다. 꼬리가 두꺼우면</tspan><tspan x="542.5" dy="17.667">0 을 품는 어떤 구간에서도 E[e^tX] 가 발산한다.</tspan><tspan x="542.5" dy="17.667">그때는 e^tX 대신 복소수를 쓰는 특성함수를 쓴다</tspan></text><text x="591" y="1105" class="fill-N1 s1"><tspan x="591" dy="0">9장 중심극한정리의 증명 얼개가</tspan><tspan x="591" dy="18.5">‘합의 M(t) 를 계산해 정규의 M(t) 로 수렴함을 보이는 것’ 이다</tspan></text><marker id="mk-d2-331540698-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-331540698-3488378134)" d="m668.988 103-.963 155" class="connection stroke-B1 s0" mask="url(#d2-331540698)"/><text x="669" y="187" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">기댓값을 한 번 계산</text><path fill="none" marker-end="url(#mk-d2-331540698-3488378134)" d="M619 346v28s0 10-10 10H204.625s-10 0-10 10v100" class="connection stroke-B1 s0" mask="url(#d2-331540698)"/><path fill="none" marker-end="url(#mk-d2-331540698-3488378134)" d="M194.625 582v88" class="connection stroke-B1 s0" mask="url(#d2-331540698)"/><path fill="none" marker-end="url(#mk-d2-331540698-3488378134)" d="M145.375 758v28s0 10-10 10H94s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-331540698)"/><path fill="none" marker-end="url(#mk-d2-331540698-3488378134)" d="M194.625 758v78s0 10 10 10H246s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-331540698)"/><path fill="none" marker-end="url(#mk-d2-331540698-3488378134)" d="M243.875 758v28s0 10 10 10H451s10 0 10 10v76" class="connection stroke-B1 s0" mask="url(#d2-331540698)"/><path fill="none" marker-end="url(#mk-d2-331540698-3488378134)" d="M652 346v78s0 10-10 10H469.625s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-331540698)"/><path fill="none" marker-end="url(#mk-d2-331540698-3488378134)" d="M685 346v124" class="connection stroke-B1 s0" mask="url(#d2-331540698)"/><path fill="none" marker-end="url(#mk-d2-331540698-3488378134)" d="M718 346v28s0 10 10 10h309.125s10 0 10 10v76" class="connection stroke-B1 s0" mask="url(#d2-331540698)"/><mask id="d2-331540698" width="1361" height="1340" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1361v1340H-89z"/><path d="M585 171h168v21H585z"/></mask></svg>