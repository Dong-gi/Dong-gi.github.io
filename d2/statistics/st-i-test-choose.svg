<svg xmlns="http://www.w3.org/2000/svg" width="1505" height="2614" class="d2-4032273003 d2-svg" viewBox="-89 -162 1505 2614"><rect width="1505" height="2614" x="-89" y="-162" rx="0" style="fill:#fff"/><style>.d2-4032273003 .text-bold{font-weight:700}.d2-4032273003 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4032273003 .fill-N1{fill:#0a0f25}.d2-4032273003 .fill-N2{fill:#676c7e}.d2-4032273003 .fill-N4{fill:#cfd2dd}.d2-4032273003 .fill-B6{fill:#f7f8fe}.d2-4032273003 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="569.5" cy="91" class="shape stroke-B1 fill-B6 s0" rx="237.5" ry="79"/></g><text x="569.5" y="96.5" class="text-bold fill-N1 s1">귀무가설은 무엇에 대한 주장인가</text></g><g ><g class="shape"><path d="M267 300h128v66H267z" class="stroke-B1 fill-B6 s0"/></g><text x="331" y="338.5" class="text-bold fill-N1 s1">평균 하나</text></g><g ><g class="shape"><path d="M183 1502h131v66H183z" class="stroke-B1 fill-B6 s0"/></g><text x="248.5" y="1540.5" class="text-bold fill-N1 s1">평균 두 개</text></g><g ><g class="shape"><path d="M821 300h84v66h-84z" class="stroke-B1 fill-B6 s0"/></g><text x="863" y="338.5" class="text-bold fill-N1 s1">비율</text></g><g ><g class="shape"><path d="M460 893h84v66h-84z" class="stroke-B1 fill-B6 s0"/></g><text x="502" y="931.5" class="text-bold fill-N1 s1">분산</text></g><g ><g class="shape"><path d="M965 893h200v66H965z" class="stroke-B1 fill-B6 s0"/></g><text x="1065" y="931.5" class="text-bold fill-N1 s1">도수(범주별 개수)</text></g><g ><g class="shape"><path d="M331 549h-2l-109-45c-1 0-1-1 0-2l109-45h4l109 45c1 0 1 1 0 2l-109 45z" class="stroke-B1 fill-N4 s0"/></g><text x="331" y="508.5" class="text-bold fill-N1 s1">σ 를 아는가</text></g><g ><g class="shape"><path d="M339 739h190v66H339z" class="stroke-B1 fill-B6 s0"/></g><text x="434" y="777.5" class="text-bold fill-N1 s1">z = (x̄ − μ₀)/(σ/√n)</text></g><g ><g class="shape"><path d="M134 731h185v82H134z" class="stroke-B1 fill-B6 s0"/></g><text x="226.5" y="769.5" class="text-bold fill-N1 s1"><tspan x="226.5" dy="0">t = (x̄ − μ₀)/(s/√n)</tspan><tspan x="226.5" dy="18.5">자유도 n − 1</tspan></text></g><g ><g class="shape"><path d="M249 1730h-3l-175-45c-2 0-2-1 0-2l175-45h7l174 45c2 0 2 1 0 2l-175 45z" class="stroke-B1 fill-N4 s0"/></g><text x="249" y="1689.5" class="text-bold fill-N1 s1">짝지어진 자료인가</text></g><g ><g class="shape"><path d="M12 1901h224v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="124" y="1939.5" class="text-bold fill-N1 s1"><tspan x="124" dy="0">대응표본 t</tspan><tspan x="124" dy="18.5">차이 d 하나로 줄인다</tspan></text></g><g ><g class="shape"><path d="M374 2025h-2l-115-61c-1-1-1-2 0-2l115-61c1-1 3-1 4 0l115 60c1 1 1 2 0 2l-115 62z" class="stroke-B1 fill-N4 s0"/></g><text x="374" y="1960.5" class="text-bold fill-N1 s1"><tspan x="374" dy="0">두 모분산이</tspan><tspan x="374" dy="18.5">비슷한가</tspan></text></g><g ><g class="shape"><path d="M175 2196h189v82H175z" class="stroke-B1 fill-B6 s0"/></g><text x="269.5" y="2234.5" class="text-bold fill-N1 s1"><tspan x="269.5" dy="0">합동분산 t</tspan><tspan x="269.5" dy="18.5">자유도 n₁ + n₂ − 2</tspan></text></g><g ><g class="shape"><path d="M384 2196h188v82H384z" class="stroke-B1 fill-B6 s0"/></g><text x="478" y="2234.5" class="text-bold fill-N1 s1"><tspan x="478" dy="0">웰치 t</tspan><tspan x="478" dy="18.5">자유도는 근사식</tspan></text></g><g ><g class="shape"><path d="M863 560h-3l-154-61c-2-1-2-2 0-2l154-61q3-1.5 6 0l154 60c2 1 2 2 0 2l-154 62z" class="stroke-B1 fill-N4 s0"/></g><text x="863" y="495.5" class="text-bold fill-N1 s1"><tspan x="863" dy="0">비율이 하나인가</tspan><tspan x="863" dy="18.5">둘인가</tspan></text></g><g ><g class="shape"><path d="M611 731h249v82H611z" class="stroke-B1 fill-B6 s0"/></g><text x="735.5" y="769.5" class="text-bold fill-N1 s1"><tspan x="735.5" dy="0">z = (p̂ − p₀)/√(p₀(1−p₀)/n)</tspan><tspan x="735.5" dy="18.5">분모에 p₀ 을 쓴다</tspan></text></g><g ><g class="shape"><path d="M880 731h220v82H880z" class="stroke-B1 fill-B6 s0"/></g><text x="990" y="769.5" class="text-bold fill-N1 s1"><tspan x="990" dy="0">합동비율로</tspan><tspan x="990" dy="18.5">표준오차를 만들고 z</tspan></text></g><g ><g class="shape"><path d="M502 1153h-3l-154-61c-2-1-2-2 0-2l154-61q3-1.5 6 0l154 60c2 1 2 2 0 2l-154 62z" class="stroke-B1 fill-N4 s0"/></g><text x="502" y="1088.5" class="text-bold fill-N1 s1"><tspan x="502" dy="0">분산이 하나인가</tspan><tspan x="502" dy="18.5">둘인가</tspan></text></g><g ><g class="shape"><path d="M318 1332h163v82H318z" class="stroke-B1 fill-B6 s0"/></g><text x="399.5" y="1370.5" class="text-bold fill-N1 s1"><tspan x="399.5" dy="0">χ² = (n−1)s²/σ₀²</tspan><tspan x="399.5" dy="18.5">자유도 n − 1</tspan></text></g><g ><g class="shape"><path d="M501 1324h206v82H501z" class="stroke-B1 fill-B6 s0"/></g><text x="604" y="1362.5" class="text-bold fill-N1 s1"><tspan x="604" dy="0">F = s₁²/s₂²</tspan><tspan x="604" dy="18.5">자유도 (n₁−1, n₂−1)</tspan></text></g><g ><g class="shape"><path d="M1065 1142h-3l-157-45c-2 0-2-1 0-2l157-45h6l157 45c2 0 2 1 0 2l-157 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1065" y="1101.5" class="text-bold fill-N1 s1">한 줄인가 표인가</text></g><g ><g class="shape"><path d="M775 1324h299v98H775z" class="stroke-B1 fill-B6 s0"/></g><text x="924.5" y="1362.5" class="text-bold fill-N1 s1"><tspan x="924.5" dy="0">적합도 검정</tspan><tspan x="924.5" dy="17.667">χ² = ∑(O−E)²/E,</tspan><tspan x="924.5" dy="17.667">자유도 k − 1 − (추정한 모수 수)</tspan></text></g><g ><g class="shape"><path d="M1094 1324h221v98h-221z" class="stroke-B1 fill-B6 s0"/></g><text x="1204.5" y="1362.5" class="text-bold fill-N1 s1"><tspan x="1204.5" dy="0">독립성 검정</tspan><tspan x="1204.5" dy="17.667">E = 행합 × 열합 / 총합,</tspan><tspan x="1204.5" dy="17.667">자유도 (r−1)(c−1)</tspan></text></g><text x="663" y="-45" class="fill-N1 s1"><tspan x="663" dy="0">꼬리를 정하는 것은 대립가설이다.</tspan><tspan x="663" dy="17.667">‘다르다’ 면 양쪽, ‘크다’ 나 ‘작다’ 면 한쪽.</tspan><tspan x="663" dy="17.667">자료를 보고 정하면 유의수준이 두 배가 된다</tspan></text><text x="663.5" y="2314" class="fill-N1 s1"><tspan x="663.5" dy="0">F 검정은 큰 쪽을 분자에 두는 관례가 있다.</tspan><tspan x="663.5" dy="17.667">그렇게 했으면 양쪽 검정에서도 오른쪽 꼬리만 보되</tspan><tspan x="663.5" dy="17.667">비교하는 것은 α 점이 아니라 α/2 점이다</tspan></text><marker id="mk-d2-4032273003-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4032273003-3488378134)" d="m490.995 167-.219 83s-.026 10-10.026 10H341.166s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4032273003)"/><path fill="none" marker-end="url(#mk-d2-4032273003-3488378134)" d="m411.986 152-.333 48s-.07 10-10.07 10H103.916s-10 0-10 10v1232s0 10 10 10h113.25s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4032273003)"/><path fill="none" marker-end="url(#mk-d2-4032273003-3488378134)" d="m649.002 167 .072 83s.009 10 10.009 10h194s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4032273003)"/><path fill="none" marker-end="url(#mk-d2-4032273003-3488378134)" d="m570 172-.083 671s-.001 10-10.001 10h-33.5s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4032273003)"/><path fill="none" marker-end="url(#mk-d2-4032273003-3488378134)" d="m728.008 152 .2 48s.042 10 10.042 10h392.083s10 0 10 10v669" class="connection stroke-B1 s0" mask="url(#d2-4032273003)"/><path fill="none" marker-end="url(#mk-d2-4032273003-3488378134)" d="M331.162 368.333 331.007 454" class="connection stroke-B1 s0" mask="url(#d2-4032273003)"/><path fill="none" marker-end="url(#mk-d2-4032273003-3488378134)" d="m368.005 537 .485 198" class="connection stroke-B1 s0" mask="url(#d2-4032273003)"/><text x="368.5" y="643" class="text-italic fill-N2 s1">안다</text><path fill="none" marker-end="url(#mk-d2-4032273003-3488378134)" d="m293.998 536-.162 191" class="connection stroke-B1 s0" mask="url(#d2-40