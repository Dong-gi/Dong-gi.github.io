<svg xmlns="http://www.w3.org/2000/svg" width="1236" height="2741" class="d2-577703694 d2-svg" viewBox="-89 -178 1236 2741"><rect width="1236" height="2741" x="-89" y="-178" rx="0" style="fill:#fff"/><style>.d2-577703694 .text-bold{font-weight:700}.d2-577703694 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-577703694 .fill-N1{fill:#0a0f25}.d2-577703694 .fill-N2{fill:#676c7e}.d2-577703694 .fill-N4{fill:#cfd2dd}.d2-577703694 .fill-B6{fill:#f7f8fe}.d2-577703694 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="468.5" cy="66.5" class="shape stroke-B1 fill-B6 s0" rx="163.5" ry="54.5"/></g><text x="468.5" y="64" class="text-bold fill-N1 s1"><tspan x="468.5" dy="0">귀무가설은</tspan><tspan x="468.5" dy="18.5">무엇에 대한 주장인가</tspan></text></g><g ><g class="shape"><path d="M210 251h128v66H210z" class="stroke-B1 fill-B6 s0"/></g><text x="274" y="289.5" class="text-bold fill-N1 s1">평균 하나</text></g><g ><g class="shape"><path d="M135 1581h131v66H135z" class="stroke-B1 fill-B6 s0"/></g><text x="200.5" y="1619.5" class="text-bold fill-N1 s1">평균 두 개</text></g><g ><g class="shape"><path d="M660 251h84v66h-84z" class="stroke-B1 fill-B6 s0"/></g><text x="702" y="289.5" class="text-bold fill-N1 s1">비율</text></g><g ><g class="shape"><path d="M370 897h84v66h-84z" class="stroke-B1 fill-B6 s0"/></g><text x="412" y="935.5" class="text-bold fill-N1 s1">분산</text></g><g ><g class="shape"><path d="M773 892h159v82H773z" class="stroke-B1 fill-B6 s0"/></g><text x="852.5" y="930.5" class="text-bold fill-N1 s1"><tspan x="852.5" dy="0">도수</tspan><tspan x="852.5" dy="18.5">(범주별 개수)</tspan></text></g><g ><g class="shape"><path d="M274 521h-2l-109-45c-1 0-1-1 0-2l109-45h4l109 45c1 0 1 1 0 2l-109 45z" class="stroke-B1 fill-N4 s0"/></g><text x="274" y="480.5" class="text-bold fill-N1 s1">σ 를 아는가</text></g><g ><g class="shape"><path d="M284 722h143v82H284z" class="stroke-B1 fill-B6 s0"/></g><text x="355.5" y="760.5" class="text-bold fill-N1 s1"><tspan x="355.5" dy="0">z = (x̄ − μ₀)/</tspan><tspan x="355.5" dy="18.5">(σ/√n)</tspan></text></g><g ><g class="shape"><path d="M121 714h143v98H121z" class="stroke-B1 fill-B6 s0"/></g><text x="192.5" y="752.5" class="text-bold fill-N1 s1"><tspan x="192.5" dy="0">t = (x̄ − μ₀)/</tspan><tspan x="192.5" dy="17.667">(s/√n)</tspan><tspan x="192.5" dy="17.667">자유도 n − 1</tspan></text></g><g ><g class="shape"><path d="M201 1841h-2l-91-61c-1-1-1-2 0-2l91-61c1-1 2-1 3 0l92 60c1 1 1 2 0 2l-91 62z" class="stroke-B1 fill-N4 s0"/></g><text x="201" y="1776.5" class="text-bold fill-N1 s1"><tspan x="201" dy="0">짝지어진</tspan><tspan x="201" dy="18.5">자료인가</tspan></text></g><g ><g class="shape"><path d="M12 2012h160v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="92" y="2050.5" class="text-bold fill-N1 s1"><tspan x="92" dy="0">대응표본 t</tspan><tspan x="92" dy="17.667">차이 d 하나로</tspan><tspan x="92" dy="17.667">줄인다</tspan></text></g><g ><g class="shape"><path d="M310 2136h-2l-115-61c-1-1-1-2 0-2l115-61c1-1 3-1 4 0l115 60c1 1 1 2 0 2l-115 62z" class="stroke-B1 fill-N4 s0"/></g><text x="310" y="2071.5" class="text-bold fill-N1 s1"><tspan x="310" dy="0">두 모분산이</tspan><tspan x="310" dy="18.5">비슷한가</tspan></text></g><g ><g class="shape"><path d="M111 2307h189v82H111z" class="stroke-B1 fill-B6 s0"/></g><text x="205.5" y="2345.5" class="text-bold fill-N1 s1"><tspan x="205.5" dy="0">합동분산 t</tspan><tspan x="205.5" dy="18.5">자유도 n₁ + n₂ − 2</tspan></text></g><g ><g class="shape"><path d="M320 2307h188v82H320z" class="stroke-B1 fill-B6 s0"/></g><text x="414" y="2345.5" class="text-bold fill-N1 s1"><tspan x="414" dy="0">웰치 t</tspan><tspan x="414" dy="18.5">자유도는 근사식</tspan></text></g><g ><g class="shape"><path d="M702 543c-1 0-1 0-2-1l-91-75c-1-1-1-2 0-3l91-76c1-1 2-1 3 0l92 76c1 1 1 2 0 3l-91 75c-1 1-1 1-2 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="702" y="454.5" class="text-bold fill-N1 s1"><tspan x="702" dy="0">비율이</tspan><tspan x="702" dy="17.667">하나인가</tspan><tspan x="702" dy="17.667">둘인가</tspan></text></g><g ><g class="shape"><path d="M509 714h195v98H509z" class="stroke-B1 fill-B6 s0"/></g><text x="606.5" y="752.5" class="text-bold fill-N1 s1"><tspan x="606.5" dy="0">z = (p̂ − p₀)/</tspan><tspan x="606.5" dy="17.667">√(p₀(1−p₀)/n)</tspan><tspan x="606.5" dy="17.667">분모에 p₀ 을 쓴다</tspan></text></g><g ><g class="shape"><path d="M724 714h145v98H724z" class="stroke-B1 fill-B6 s0"/></g><text x="796.5" y="752.5" class="text-bold fill-N1 s1"><tspan x="796.5" dy="0">합동비율로</tspan><tspan x="796.5" dy="17.667">표준오차를</tspan><tspan x="796.5" dy="17.667">만들고 z</tspan></text></g><g ><g class="shape"><path d="M412 1200c-1 0-1 0-2-1l-91-75c-1-1-1-2 0-3l91-76c1-1 2-1 3 0l92 76c1 1 1 2 0 3l-91 75c-1 1-1 1-2 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="412" y="1111.5" class="text-bold fill-N1 s1"><tspan x="412" dy="0">분산이</tspan><tspan x="412" dy="17.667">하나인가</tspan><tspan x="412" dy="17.667">둘인가</tspan></text></g><g ><g class="shape"><path d="M260 1395h143v98H260z" class="stroke-B1 fill-B6 s0"/></g><text x="331.5" y="1433.5" class="text-bold fill-N1 s1"><tspan x="331.5" dy="0">χ² =</tspan><tspan x="331.5" dy="17.667">(n−1)s²/σ₀²</tspan><tspan x="331.5" dy="17.667">자유도 n − 1</tspan></text></g><g ><g class="shape"><path d="M423 1387h142v98H423z" class="stroke-B1 fill-B6 s0"/></g><text x="494" y="1425.5" class="text-bold fill-N1 s1"><tspan x="494" dy="0">F = s₁²/s₂²</tspan><tspan x="494" dy="17.667">자유도</tspan><tspan x="494" dy="17.667">(n₁−1, n₂−1)</tspan></text></g><g ><g class="shape"><path d="M853 1189h-2l-95-61c-1-1-1-2 0-2l95-61c1-1 3-1 4 0l95 60c1 1 1 2 0 2l-95 62z" class="stroke-B1 fill-N4 s0"/></g><text x="853" y="1124.5" class="text-bold fill-N1 s1"><tspan x="853" dy="0">한 줄인가</tspan><tspan x="853" dy="18.5">표인가</tspan></text></g><g ><g class="shape"><path d="M660 1387h183v114H660z" class="stroke-B1 fill-B6 s0"/></g><text x="751.5" y="1425.5" class="text-bold fill-N1 s1"><tspan x="751.5" dy="0">적합도 검정</tspan><tspan x="751.5" dy="17.25">χ² = ∑(O−E)²/E,</tspan><tspan x="751.5" dy="17.25">자유도 k − 1 −</tspan><tspan x="751.5" dy="17.25">(추정한 모수 수)</tspan></text></g><g ><g class="shape"><path d="M863 1387h183v114H863z" class="stroke-B1 fill-B6 s0"/></g><text x="954.5" y="1425.5" class="text-bold fill-N1 s1"><tspan x="954.5" dy="0">독립성 검정</tspan><tspan x="954.5" dy="17.25">E = 행합 × 열합</tspan><tspan x="954.5" dy="17.25">/ 총합,</tspan><tspan x="954.5" dy="17.25">자유도 (r−1)(c−1)</tspan></text></g><text x="528.5" y="-61" class="fill-N1 s1"><tspan x="528.5" dy="0">꼬리를 정하는 것은 대립가설이다.</tspan><tspan x="528.5" dy="17.25">‘다르다’ 면 양쪽, ‘크다’ 나 ‘작다’ 면 한쪽.</tspan><tspan x="528.5" dy="17.25">자료를 보고 정하면</tspan><tspan x="528.5" dy="17.25">유의수준이 두 배가 된다</tspan></text><text x="528.5" y="2425" class="fill-N1 s1"><tspan x="528.5" dy="0">F 검정은 큰 쪽을 분자에 두는 관례가 있다.</tspan><tspan x="528.5" dy="17.667">그렇게 했으면 양쪽 검정에서도 오른쪽 꼬리만 보되</tspan><tspan x="528.5" dy="17.667">비교하는 것은 α 점이 아니라 α/2 점이다</tspan></text><marker id="mk-d2-577703694-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-577703694-3488378134)" d="m414.004 120 .144 81s.018 10-9.982 10H284.083s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-577703694)"/><path fill="none" marker-end="url(#mk-d2-577703694-3488378134)" d="m359.988 109-.26 42s-.062 10-10.062 10H88.5s-10 0-10 10v1360s0 10 10 10h80.666s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-577703694)"/><path fill="none" marker-end="url(#mk-d2-577703694-3488378134)" d="m523.004 120 .144 81s.018 10 10.018 10h159s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-577703694)"/><path fill="none" marker-end="url(#mk-d2-577703694-3488378134)" d="m469 123-.33 719s-.004 10-10.004 10h-21.75s-10 0-10 10v3