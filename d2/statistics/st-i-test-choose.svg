<svg xmlns="http://www.w3.org/2000/svg" width="2792" height="1553" class="d2-807646364 d2-svg" viewBox="-101 -101 2792 1553"><rect width="2792" height="1553" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-807646364 .fill-N1{fill:#0a0f25}.d2-807646364 .fill-N2{fill:#676c7e}.d2-807646364 .fill-N4{fill:#cfd2dd}.d2-807646364 .fill-B6{fill:#f7f8fe}.d2-807646364 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="237.5" cy="683" class="shape stroke-B1 fill-B6 s0" rx="237.5" ry="79"/></g><text x="237.5" y="688.5" class="text-bold fill-N1 s1">귀무가설은 무엇에 대한 주장인가</text></g><g ><g class="shape"><path d="M670 13h128v66H670z" class="stroke-B1 fill-B6 s0"/></g><text x="734" y="51.5" class="text-bold fill-N1 s1">평균 하나</text></g><g ><g class="shape"><path d="M669 289h131v66H669z" class="stroke-B1 fill-B6 s0"/></g><text x="734.5" y="327.5" class="text-bold fill-N1 s1">평균 두 개</text></g><g ><g class="shape"><path d="M692 583h84v66h-84z" class="stroke-B1 fill-B6 s0"/></g><text x="734" y="621.5" class="text-bold fill-N1 s1">비율</text></g><g ><g class="shape"><path d="M692 851h84v66h-84z" class="stroke-B1 fill-B6 s0"/></g><text x="734" y="889.5" class="text-bold fill-N1 s1">분산</text></g><g ><g class="shape"><path d="M634 1135h200v66H634z" class="stroke-B1 fill-B6 s0"/></g><text x="734" y="1173.5" class="text-bold fill-N1 s1">도수(범주별 개수)</text></g><g ><g class="shape"><path d="M1215 92h-2l-109-45c-1 0-1-1 0-2l109-45h4l109 45c1 0 1 1 0 2l-109 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1215" y="51.5" class="text-bold fill-N1 s1">σ 를 아는가</text></g><g ><g class="shape"><path d="M1825 13h196v66h-196z" class="stroke-B1 fill-B6 s0"/></g><text x="1923" y="51.5" class="text-bold fill-N1 s1">z = (x̄ − μ~0)/(σ/√n)</text></g><g ><g class="shape"><path d="M1827 139h191v82h-191z" class="stroke-B1 fill-B6 s0"/></g><text x="1922.5" y="177.5" class="text-bold fill-N1 s1"><tspan x="1922.5" dy="0">t = (x̄ − μ~0)/(s/√n)</tspan><tspan x="1922.5" dy="18.5">자유도 n − 1</tspan></text></g><g ><g class="shape"><path d="M1215 368h-3l-175-45c-2 0-2-1 0-2l175-45h7l174 45c2 0 2 1 0 2l-175 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1215" y="327.5" class="text-bold fill-N1 s1">짝지어진 자료인가</text></g><g ><g class="shape"><path d="M1811 281h224v82h-224z" class="stroke-B1 fill-B6 s0"/></g><text x="1923" y="319.5" class="text-bold fill-N1 s1"><tspan x="1923" dy="0">대응표본 t</tspan><tspan x="1923" dy="18.5">차이 d 하나로 줄인다</tspan></text></g><g ><g class="shape"><path d="M1923 515h-4l-196-45c-2 0-2-1 0-2l196-45h7l197 45c2 0 2 1 0 2l-196 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1923" y="474.5" class="text-bold fill-N1 s1">두 모분산이 비슷한가</text></g><g ><g class="shape"><path d="M2389 357h201v82h-201z" class="stroke-B1 fill-B6 s0"/></g><text x="2489.5" y="395.5" class="text-bold fill-N1 s1"><tspan x="2489.5" dy="0">합동분산 t</tspan><tspan x="2489.5" dy="18.5">자유도 n~1 + n~2 − 2</tspan></text></g><g ><g class="shape"><path d="M2396 499h188v82h-188z" class="stroke-B1 fill-B6 s0"/></g><text x="2490" y="537.5" class="text-bold fill-N1 s1"><tspan x="2490" dy="0">웰치 t</tspan><tspan x="2490" dy="18.5">자유도는 근사식</tspan></text></g><g ><g class="shape"><path d="M1215 662h-4l-216-45c-2 0-2-1 0-2l216-45h8l216 45c2 0 2 1 0 2l-216 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1215" y="621.5" class="text-bold fill-N1 s1">비율이 하나인가 둘인가</text></g><g ><g class="shape"><path d="M1789 575h267v82h-267z" class="stroke-B1 fill-B6 s0"/></g><text x="1922.5" y="613.5" class="text-bold fill-N1 s1"><tspan x="1922.5" dy="0">z = (p̂ − p~0)/√(p~0(1−p~0)/n)</tspan><tspan x="1922.5" dy="18.5">분모에 p~0 을 쓴다</tspan></text></g><g ><g class="shape"><path d="M1761 717h324v66h-324z" class="stroke-B1 fill-B6 s0"/></g><text x="1923" y="755.5" class="text-bold fill-N1 s1">합동비율로 표준오차를 만들고 z</text></g><g ><g class="shape"><path d="M1215 930h-4l-216-45c-2 0-2-1 0-2l216-45h8l216 45c2 0 2 1 0 2l-216 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1215" y="889.5" class="text-bold fill-N1 s1">분산이 하나인가 둘인가</text></g><g ><g class="shape"><path d="M1838 843h169v82h-169z" class="stroke-B1 fill-B6 s0"/></g><text x="1922.5" y="881.5" class="text-bold fill-N1 s1"><tspan x="1922.5" dy="0">χ² = (n−1)s²/σ~0²</tspan><tspan x="1922.5" dy="18.5">자유도 n − 1</tspan></text></g><g ><g class="shape"><path d="M1814 985h218v82h-218z" class="stroke-B1 fill-B6 s0"/></g><text x="1923" y="1023.5" class="text-bold fill-N1 s1"><tspan x="1923" dy="0">F = s~1²/s~2²</tspan><tspan x="1923" dy="18.5">자유도 (n~1−1, n~2−1)</tspan></text></g><g ><g class="shape"><path d="M1215 1214h-3l-157-45c-2 0-2-1 0-2l157-45h6l157 45c2 0 2 1 0 2l-157 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1215" y="1173.5" class="text-bold fill-N1 s1">한 줄인가 표인가</text></g><g ><g class="shape"><path d="M1715 1127h415v82h-415z" class="stroke-B1 fill-B6 s0"/></g><text x="1922.5" y="1165.5" class="text-bold fill-N1 s1"><tspan x="1922.5" dy="0">적합도 검정</tspan><tspan x="1922.5" dy="18.5">χ² = ∑(O−E)²/E, 자유도 k − 1 − (추정한 모수 수)</tspan></text></g><g ><g class="shape"><path d="M1740 1269h366v82h-366z" class="stroke-B1 fill-B6 s0"/></g><text x="1923" y="1307.5" class="text-bold fill-N1 s1"><tspan x="1923" dy="0">독립성 검정</tspan><tspan x="1923" dy="18.5">E = 행합 × 열합 / 총합, 자유도 (r−1)(c−1)</tspan></text></g><text x="238" y="838" class="fill-N1 s1"><tspan x="238" dy="0">꼬리를 정하는 것은 대립가설이다.</tspan><tspan x="238" dy="17.667">‘다르다’ 면 양쪽, ‘크다’ 나 ‘작다’ 면 한쪽.</tspan><tspan x="238" dy="17.667">자료를 보고 정하면 유의수준이 두 배가 된다</tspan></text><text x="237.5" y="951" class="fill-N1 s1"><tspan x="237.5" dy="0">F 검정은 큰 쪽을 분자에 두는 관례가 있다.</tspan><tspan x="237.5" dy="17.667">그렇게 했으면 양쪽 검정에서도 오른쪽 꼬리만 보되</tspan><tspan x="237.5" dy="17.667">비교하는 것은 α 점이 아니라 α/2 점이다</tspan></text><marker id="mk-d2-807646364-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" vie