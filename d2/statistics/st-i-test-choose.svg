<svg xmlns="http://www.w3.org/2000/svg" width="2780" height="1686" class="d2-1956053229 d2-svg" viewBox="-101 -174 2780 1686"><rect width="2780" height="1686" x="-101" y="-174" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1956053229 .fill-N1{fill:#0a0f25}.d2-1956053229 .fill-N2{fill:#676c7e}.d2-1956053229 .fill-N4{fill:#cfd2dd}.d2-1956053229 .fill-B6{fill:#f7f8fe}.d2-1956053229 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="237.5" cy="670" class="shape stroke-B1 fill-B6 s0" rx="237.5" ry="79"/></g><text x="237.5" y="675.5" class="text-bold fill-N1 s1">귀무가설은 무엇에 대한 주장인가</text></g><g ><g class="shape"><path d="M670 67h128v66H670z" class="stroke-B1 fill-B6 s0"/></g><text x="734" y="105.5" class="text-bold fill-N1 s1">평균 하나</text></g><g ><g class="shape"><path d="M669 350h131v66H669z" class="stroke-B1 fill-B6 s0"/></g><text x="734.5" y="388.5" class="text-bold fill-N1 s1">평균 두 개</text></g><g ><g class="shape"><path d="M692 637h84v66h-84z" class="stroke-B1 fill-B6 s0"/></g><text x="734" y="675.5" class="text-bold fill-N1 s1">비율</text></g><g ><g class="shape"><path d="M692 909h84v66h-84z" class="stroke-B1 fill-B6 s0"/></g><text x="734" y="947.5" class="text-bold fill-N1 s1">분산</text></g><g ><g class="shape"><path d="M634 1193h200v66H634z" class="stroke-B1 fill-B6 s0"/></g><text x="734" y="1231.5" class="text-bold fill-N1 s1">도수(범주별 개수)</text></g><g ><g class="shape"><path d="M1215 146h-2l-109-45c-1 0-1-1 0-2l109-45h4l109 45c1 0 1 1 0 2l-109 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1215" y="105.5" class="text-bold fill-N1 s1">σ 를 아는가</text></g><g ><g class="shape"><path d="M1828 0h190v66h-190z" class="stroke-B1 fill-B6 s0"/></g><text x="1923" y="38.5" class="text-bold fill-N1 s1">z = (x̄ − μ₀)/(σ/√n)</text></g><g ><g class="shape"><path d="M1830 126h185v82h-185z" class="stroke-B1 fill-B6 s0"/></g><text x="1922.5" y="164.5" class="text-bold fill-N1 s1"><tspan x="1922.5" dy="0">t = (x̄ − μ₀)/(s/√n)</tspan><tspan x="1922.5" dy="18.5">자유도 n − 1</tspan></text></g><g ><g class="shape"><path d="M1215 429h-3l-175-45c-2 0-2-1 0-2l175-45h7l174 45c2 0 2 1 0 2l-175 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1215" y="388.5" class="text-bold fill-N1 s1">짝지어진 자료인가</text></g><g ><g class="shape"><path d="M1811 268h224v82h-224z" class="stroke-B1 fill-B6 s0"/></g><text x="1923" y="306.5" class="text-bold fill-N1 s1"><tspan x="1923" dy="0">대응표본 t</tspan><tspan x="1923" dy="18.5">차이 d 하나로 줄인다</tspan></text></g><g ><g class="shape"><path d="M1923 502h-4l-196-45c-2 0-2-1 0-2l196-45h7l197 45c2 0 2 1 0 2l-196 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1923" y="461.5" class="text-bold fill-N1 s1">두 모분산이 비슷한가</text></g><g ><g class="shape"><path d="M2389 344h189v82h-189z" class="stroke-B1 fill-B6 s0"/></g><text x="2483.5" y="382.5" class="text-bold fill-N1 s1"><tspan x="2483.5" dy="0">합동분산 t</tspan><tspan x="2483.5" dy="18.5">자유도 n₁ + n₂ − 2</tspan></text></g><g ><g class="shape"><path d="M2390 486h188v82h-188z" class="stroke-B1 fill-B6 s0"/></g><text x="2484" y="524.5" class="text-bold fill-N1 s1"><tspan x="2484" dy="0">웰치 t</tspan><tspan x="2484" dy="18.5">자유도는 근사식</tspan></text></g><g ><g class="shape"><path d="M1215 716h-4l-216-45c-2 0-2-1 0-2l216-45h8l216 45c2 0 2 1 0 2l-216 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1215" y="675.5" class="text-bold fill-N1 s1">비율이 하나인가 둘인가</text></g><g ><g class="shape"><path d="M1798 562h249v82h-249z" class="stroke-B1 fill-B6 s0"/></g><text x="1922.5" y="600.5" class="text-bold fill-N1 s1"><tspan x="1922.5" dy="0">z = (p̂ − p₀)/√(p₀(1−p₀)/n)</tspan><tspan x="1922.5" dy="18.5">분모에 p₀ 을 쓴다</tspan></text></g><g ><g class="shape"><path d="M1761 704h324v66h-324z" class="stroke-B1 fill-B6 s0"/></g><text x="1923" y="742.5" class="text-bold fill-N1 s1">합동비율로 표준오차를 만들고 z</text></g><g ><g class="shape"><path d="M1215 988h-4l-216-45c-2 0-2-1 0-2l216-45h8l216 45c2 0 2 1 0 2l-216 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1215" y="947.5" class="text-bold fill-N1 s1">분산이 하나인가 둘인가</text></g><g ><g class="shape"><path d="M1841 830h163v82h-163z" class="stroke-B1 fill-B6 s0"/></g><text x="1922.5" y="868.5" class="text-bold fill-N1 s1"><tspan x="1922.5" dy="0">χ² = (n−1)s²/σ₀²</tspan><tspan x="1922.5" dy="18.5">자유도 n − 1</tspan></text></g><g ><g class="shape"><path d="M1820 972h206v82h-206z" class="stroke-B1 fill-B6 s0"/></g><text x="1923" y="1010.5" class="text-bold fill-N1 s1"><tspan x="1923" dy="0">F = s₁²/s₂²</tspan><tspan x="1923" dy="18.5">자유도 (n₁−1, n₂−1)</tspan></text></g><g ><g class="shape"><path d="M1215 1272h-3l-157-45c-2 0-2-1 0-2l157-45h6l157 45c2 0 2 1 0 2l-157 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1215" y="1231.5" class="text-bold fill-N1 s1">한 줄인가 표인가</text></g><g ><g class="shape"><path d="M1715 1114h415v82h-415z" class="stroke-B1 fill-B6 s0"/></g><text x="1922.5" y="1152.5" class="text-bold fill-N1 s1"><tspan x="1922.5" dy="0">적합도 검정</tspan><tspan x="1922.5" dy="18.5">χ² = ∑(O−E)²/E, 자유도 k − 1 − (추정한 모수 수)</tspan></text></g><g ><g class="shape"><path d="M1740 1256h366v82h-366z" class="stroke-B1 fill-B6 s0"/></g><text x="1923" y="1294.5" class="text-bold fill-N1 s1"><tspan x="1923" dy="0">독립성 검정</tspan><tspan x="1923" dy="18.5">E = 행합 × 열합 / 총합, 자유도 (r−1)(c−1)</tspan></text></g><text x="1289" y="-57" class="fill-N1 s1"><tspan x="1289" dy="0">꼬리를 정하는 것은 대립가설이다.</tspan><tspan x="1289" dy="17.667">‘다르다’ 면 양쪽, ‘크다’ 나 ‘작다’ 면 한쪽.</tspan><tspan x="1289" dy="17.667">자료를 보고 정하면 유의수준이 두 배가 된다</tspan></text><text x="1288.5" y="1374" class="fill-N1 s1"><tspan x="1288.5" dy="0">F 검정은 큰 쪽을 분자에 두는 관례가 있다.</tspan><tspan x="1288.5" dy="17.667">그렇게 했으면 양쪽 검정에서도 오른쪽 꼬리만 보되</tspan><tspan x="1288.5" dy="17.667">비교하는 것은 α 점이 아니라 α/2 점이다</tspan></text><marker id="mk-d2-1956053229-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M281.972 590.252C499.8 198.399 577.7 100 666.5 100" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M321.479 594.654C507.6 425.2 577.3 382.5 664.5 382.5" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M477 670h211.5" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M324.52 745.3C508.2 902.4 582.1 942 688.5 942" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M282.99 749.737C500 1130.4 570.5 1226 630.5 1226" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M799.5 100H1099" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M1294.967 84.639C1519.4 43.4 1626.3 33 1823.5 33" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><text x="1558.5" y="45" class="text-italic fill-N2 s1">안다</text><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M1294.967 115.361C1519.4 156.6 1626.8 167 1826 167" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><text x="1560" y="166" class="text-italic fill-N2 s1">모른다</text><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M802.5 382.5c88.4 0 135.5.1 229.5.484" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M1317.96 361.6C1524 319.6 1622.9 309 1806.5 309" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><text x="1561.5" y="321" class="text-italic fill-N2 s1">짝지어져 있다</text><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M1318.96 403.401C1524.2 445.4 1605.2 456 1718 456" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><text x="1517.5" y="450" class="text-italic fill-N2 s1">독립이다</text><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M2031.956 433.582C2213.6 394.8 2285.5 385 2385.5 385" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><text x="2208.5" y="401" class="text-italic fill-N2 s1">비슷하다</text><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M2031.956 478.418C2213.6 517.2 2285.5 527 2385.5 527" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><text x="2208" y="522" class="text-italic fill-N2 s1">많이 다르다</text><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M777.5 670H990" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M1336.966 647.633C1527.8 612 1620.4 603 1794 603" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><text x="1564.5" y="614" class="text-italic fill-N2 s1">하나</text><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M1336.966 692.367C1527.8 728 1612.9 737 1756.5 737" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><text x="1546" y="735" class="text-italic fill-N2 s1">둘</text><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M777.5 942H990" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M1330.963 918.618C1526.6 880.6 1629 871 1837 871" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><text x="1583.5" y="881" class="text-italic fill-N2 s1">하나</text><path fill="none" marker-end="url(#mk-d2-1956053229-3488378134)" d="M1330.963 965.382C1526.6 1003.4 1624.7 1013 1815.5 1013" class="connection stroke-B1 s0" mask="url(#d2-1956053229)"/><text x="1572" y="1013" class="text-