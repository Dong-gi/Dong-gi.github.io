<svg xmlns="http://www.w3.org/2000/svg" width="1363" height="1597" class="d2-3023277760 d2-svg" viewBox="-89 -89 1363 1597"><rect width="1363" height="1597" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3023277760 .fill-N1{fill:#0a0f25}.d2-3023277760 .fill-N2{fill:#676c7e}.d2-3023277760 .fill-N4{fill:#cfd2dd}.d2-3023277760 .fill-B6{fill:#f7f8fe}.d2-3023277760 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="569.5" cy="74" class="shape stroke-B1 fill-B6 s0" rx="186.5" ry="62"/></g><text x="569.5" y="71.5" class="text-bold fill-N1 s1"><tspan x="569.5" dy="0">이산확률변수 X 를 만났다</tspan><tspan x="569.5" dy="18.5">X 가 세는 것이 무엇인가</tspan></text></g><g ><g class="shape"><path d="M12 357h209v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="116.5" y="395.5" class="text-bold fill-N1 s1"><tspan x="116.5" dy="0">값 자체를 뽑는다</tspan><tspan x="116.5" dy="17.667">어느 값이나</tspan><tspan x="116.5" dy="17.667">똑같이 그럴듯하다</tspan></text></g><g ><g class="shape"><path d="M257 357h212v98H257z" class="stroke-B1 fill-B6 s0"/></g><text x="363" y="395.5" class="text-bold fill-N1 s1"><tspan x="363" dy="0">성공한 횟수를 센다</tspan><tspan x="363" dy="17.667">시행 수가</tspan><tspan x="363" dy="17.667">미리 정해져 있다</tspan></text></g><g ><g class="shape"><path d="M693 365h212v82H693z" class="stroke-B1 fill-B6 s0"/></g><text x="799" y="403.5" class="text-bold fill-N1 s1"><tspan x="799" dy="0">성공이 나올 때까지</tspan><tspan x="799" dy="18.5">시행 횟수를 센다</tspan></text></g><g ><g class="shape"><path d="M947 357h226v98H947z" class="stroke-B1 fill-B6 s0"/></g><text x="1060" y="395.5" class="text-bold fill-N1 s1"><tspan x="1060" dy="0">구간(시간·넓이·길이)</tspan><tspan x="1060" dy="17.667">안에서 일어난</tspan><tspan x="1060" dy="17.667">사건 수를 센다</tspan></text></g><g ><g class="shape"><path d="M34 525h165v82H34z" class="stroke-B1 fill-B6 s0"/></g><text x="116.5" y="563.5" class="text-bold fill-N1 s1"><tspan x="116.5" dy="0">이산균등분포</tspan><tspan x="116.5" dy="18.5">P(X = x) = 1/n</tspan></text></g><g ><g class="shape"><path d="M363 713c-1 0-2 0-3-1l-140-91c-1-1-1-2 0-3l140-92c1-1 4-1 5 0l140 92c1 1 1 2 0 3l-139 91c-1 1-2 1-3 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="363" y="600.5" class="text-bold fill-N1 s1"><tspan x="363" dy="0">뽑은 것을</tspan><tspan x="363" dy="17.25">도로 넣는가</tspan><tspan x="363" dy="17.25">(또는 모집단이</tspan><tspan x="363" dy="17.25">아주 큰가)</tspan></text></g><g ><g class="shape"><path d="M148 900h196v82H148z" class="stroke-B1 fill-B6 s0"/></g><text x="246" y="938.5" class="text-bold fill-N1 s1"><tspan x="246" dy="0">이항분포 b(x; n, p)</tspan><tspan x="246" dy="18.5">μ = np, σ² = np(1 − p)</tspan></text></g><g ><g class="shape"><path d="M364 900h230v82H364z" class="stroke-B1 fill-B6 s0"/></g><text x="479" y="938.5" class="text-bold fill-N1 s1"><tspan x="479" dy="0">초기하분포 h(x; N, n, K)</tspan><tspan x="479" dy="18.5">μ = nK/N</tspan></text></g><g ><g class="shape"><path d="M155 1143h183v82H155z" class="stroke-B1 fill-B6 s0"/></g><text x="246.5" y="1181.5" class="text-bold fill-N1 s1"><tspan x="246.5" dy="0">베르누이 시행</tspan><tspan x="246.5" dy="18.5">n = 1 인 이항분포</tspan></text></g><g ><g class="shape"><path d="M799 691h-3l-137-61c-1-1-1-2 0-2l137-61c1-1 4-1 5 0l137 60c1 1 1 2 0 2l-136 62z" class="stroke-B1 fill-N4 s0"/></g><text x="799" y="626.5" class="text-bold fill-N1 s1"><tspan x="799" dy="0">몇 번째 성공을</tspan><tspan x="799" dy="18.5">기다리는가</tspan></text></g><g ><g class="shape"><path d="M614 900h185v82H614z" class="stroke-B1 fill-B6 s0"/></g><text x="706.5" y="938.5" class="text-bold fill-N1 s1"><tspan x="706.5" dy="0">기하분포 g(x; p)</tspan><tspan x="706.5" dy="18.5">μ = 1/p. 무기억성</tspan></text></g><g ><g class="shape"><path d="M819 900h145v82H819z" class="stroke-B1 fill-B6 s0"/></g><text x="891.5" y="938.5" class="text-bold fill-N1 s1"><tspan x="891.5" dy="0">음이항분포</tspan><tspan x="891.5" dy="18.5">μ = r/p</tspan></text></g><g ><g class="shape"><path d="M960 525h199v82H960z" class="stroke-B1 fill-B6 s0"/></g><text x="1059.5" y="563.5" class="text-bold fill-N1 s1"><tspan x="1059.5" dy="0">푸아송 분포 p(x; λ)</tspan><tspan x="1059.5" dy="18.5">μ = σ² = λ</tspan></text></g><path fill="transparent" stroke="transparent" d="M386 1245h412v162H386z" class="shape s0"/><text x="566.5" y="1285" class="fill-N1 s1"><tspan x="566.5" dy="0">‘성공’ 은 좋은 일이라는 뜻이 아니라</tspan><tspan x="566.5" dy="17.667">관심 있는 쪽을 부르는 이름일 뿐이다.</tspan><tspan x="566.5" dy="17.667">불량품을 세면 불량이 성공이다</tspan></text><text x="592" y="1362" class="fill-N1 s1"><tspan x="592" dy="0">시행 수 n 이 고정인가, 성공 수 r 이 고정인가.</tspan><tspan x="592" dy="18.5">이항과 음이항을 가르는 것은 이 한 가지다</tspan></text><marker id="mk-d2-3023277760-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="m457.994 126-.115 40s-.029 10-10.029 10H126.5s-10 0-10 10v167" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><text x="222.5" y="182" class="text-italic fill-N2 s1">값 고르기</text><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="m532.01 137 .39 79s.05 10-9.95 10H373s-10 0-10 10v117" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><text x="427.5" y="232" class="text-italic fill-N2 s1">성공·실패가 n 번</text><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="m607.001 137 .043 79s.006 10 10.006 10H789.5s10 0 10 10v125" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><text x="727" y="232" class="text-italic fill-N2 s1">언제 나오나</text><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="m681.987 126-.27 40s-.067 10 9.933 10H1050s10 0 10 10v167" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><text x="935" y="182" class="text-italic fill-N2 s1">몇 번 일어나나</text><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="M116.5 457v64" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="M363 457v64" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="m246.004 640 .488 256" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><text x="246.5" y="767" class="text-italic fill-N2 s1"><tspan x="246.5" dy="0">넣는다 /</tspan><tspan x="246.5" dy="18.5">모집단이 크다</tspan></text><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="m479.004 640 .488 256" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><text x="479.5" y="767" class="text-italic fill-N2 s1"><tspan x="479.5" dy="0">안 넣는다 /</tspan><tspan x="479.5" dy="18.5">모집단이 작다</tspan></text><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="M246.5 984v155" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><text x="247" y="1068" class="text-italic fill-N2 s1">n = 1 이면</text><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="M799.508 448.666 799.983 563" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="M707 654v242" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><text x="707.5" y="782" class="text-italic fill-N2 s1">첫 번째</text><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="M892 653v243" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><text x="892" y="781" class="text-italic fill-N2 s1">r 번째</text><path fill="none" marker-end="url(#mk-d2-3023277760-3488378134)" d="M1060 457v64" class="connection stroke-B1 s0" mask="url(#d2-3023277760)"/><mask id="d2-3023277760" width="1363" height="1597" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1363v1597H-89z"/><path d="M180 166h85v21h-85zM358 216h139v21H35