<svg xmlns="http://www.w3.org/2000/svg" width="3218" height="878" class="d2-2445435416 d2-svg" viewBox="-101 -101 3218 878"><rect width="3218" height="878" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2445435416 .fill-N1{fill:#0a0f25}.d2-2445435416 .fill-N2{fill:#676c7e}.d2-2445435416 .fill-N4{fill:#cfd2dd}.d2-2445435416 .fill-B6{fill:#f7f8fe}.d2-2445435416 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="186.5" cy="346" class="shape stroke-B1 fill-B6 s0" rx="186.5" ry="62"/></g><text x="186.5" y="343.5" class="text-bold fill-N1 s1"><tspan x="186.5" dy="0">이산확률변수 X 를 만났다</tspan><tspan x="186.5" dy="18.5">X 가 세는 것이 무엇인가</tspan></text></g><g ><g class="shape"><path d="M759 0h316v82H759z" class="stroke-B1 fill-B6 s0"/></g><text x="917" y="38.5" class="text-bold fill-N1 s1"><tspan x="917" dy="0">값 자체를 뽑는다</tspan><tspan x="917" dy="18.5">어느 값이나 똑같이 그럴듯하다</tspan></text></g><g ><g class="shape"><path d="M778 163h279v82H778z" class="stroke-B1 fill-B6 s0"/></g><text x="917.5" y="201.5" class="text-bold fill-N1 s1"><tspan x="917.5" dy="0">성공한 횟수를 센다</tspan><tspan x="917.5" dy="18.5">시행 수가 미리 정해져 있다</tspan></text></g><g ><g class="shape"><path d="M811 447h212v82H811z" class="stroke-B1 fill-B6 s0"/></g><text x="917" y="485.5" class="text-bold fill-N1 s1"><tspan x="917" dy="0">성공이 나올 때까지</tspan><tspan x="917" dy="18.5">시행 횟수를 센다</tspan></text></g><g ><g class="shape"><path d="M772 594h290v82H772z" class="stroke-B1 fill-B6 s0"/></g><text x="917" y="632.5" class="text-bold fill-N1 s1"><tspan x="917" dy="0">구간(시간·넓이·길이) 안에서</tspan><tspan x="917" dy="18.5">일어난 사건 수를 센다</tspan></text></g><g ><g class="shape"><path d="M1490 0h165v82h-165z" class="stroke-B1 fill-B6 s0"/></g><text x="1572.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1572.5" dy="0">이산균등분포</tspan><tspan x="1572.5" dy="18.5">P(X = x) = 1/n</tspan></text></g><g ><g class="shape"><path d="M1572 266h-4l-231-61c-2-1-2-2 0-2l231-61c2-1 6-1 9 0l231 60c2 1 2 2 0 2l-232 62z" class="stroke-B1 fill-N4 s0"/></g><text x="1572" y="201.5" class="text-bold fill-N1 s1"><tspan x="1572" dy="0">뽑은 것을 도로 넣는가</tspan><tspan x="1572" dy="18.5">(또는 모집단이 아주 큰가)</tspan></text></g><g ><g class="shape"><path d="M2297 92h196v82h-196z" class="stroke-B1 fill-B6 s0"/></g><text x="2395" y="130.5" class="text-bold fill-N1 s1"><tspan x="2395" dy="0">이항분포 b(x; n, p)</tspan><tspan x="2395" dy="18.5">μ = np, σ² = np(1 − p)</tspan></text></g><g ><g class="shape"><path d="M2280 234h230v82h-230z" class="stroke-B1 fill-B6 s0"/></g><text x="2395" y="272.5" class="text-bold fill-N1 s1"><tspan x="2395" dy="0">초기하분포 h(x; N, n, K)</tspan><tspan x="2395" dy="18.5">μ = nK/N</tspan></text></g><g ><g class="shape"><path d="M2833 92h183v82h-183z" class="stroke-B1 fill-B6 s0"/></g><text x="2924.5" y="130.5" class="text-bold fill-N1 s1"><tspan x="2924.5" dy="0">베르누이 시행</tspan><tspan x="2924.5" dy="18.5">n = 1 인 이항분포</tspan></text></g><g ><g class="shape"><path d="M1572 534h-4l-240-45c-3 0-3-1 0-2l240-45h9l240 45c3 0 3 1 0 2l-241 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1572" y="493.5" class="text-bold fill-N1 s1">몇 번째 성공을 기다리는가</text></g><g ><g class="shape"><path d="M2303 376h185v82h-185z" class="stroke-B1 fill-B6 s0"/></g><text x="2395.5" y="414.5" class="text-bold fill-N1 s1"><tspan x="2395.5" dy="0">기하분포 g(x; p)</tspan><tspan x="2395.5" dy="18.5">μ = 1/p. 무기억성</tspan></text></g><g ><g class="shape"><path d="M2323 518h145v82h-145z" class="stroke-B1 fill-B6 s0"/></g><text x="2395.5" y="556.5" class="text-bold fill-N1 s1"><tspan x="2395.5" dy="0">음이항분포</tspan><tspan x="2395.5" dy="18.5">μ = r/p</tspan></text></g><g ><g class="shape"><path d="M1473 594h199v82h-199z" class="stroke-B1 fill-B6 s0"/></g><text x="1572.5" y="632.5" class="text-bold fill-N1 s1"><tspan x="1572.5" dy="0">푸아송 분포 p(x; λ)</tspan><tspan x="1572.5" dy="18.5">μ = σ² = λ</tspan></text></g><text x="186.5" y="484" class="fill-N1 s1"><tspan x="186.5" dy="0">‘성공’ 은 좋은 일이라는 뜻이 아니라</tspan><tspan x="186.5" dy="17.667">관심 있는 쪽을 부르는 이름일 뿐이다.</tspan><tspan x="186.5" dy="17.667">불량품을 세면 불량이 성공이다</tspan></text><text x="187" y="597" class="fill-N1 s1"><tspan x="187" dy="0">시행 수 n 이 고정인가, 성공 수 r 이 고정인가.</tspan><tspan x="187" dy="18.5">이항과 음이항을 가르는 것은 이 한 가지다</tspan></text><marker id="mk-d2-2445435416-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M259.558 287.746C504.4 90.6 604.6 41 755 41" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><text x="484.5" y="112" class="text-italic fill-N2 s1">값 고르기</text><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M311.873 299.298C514.799 223.2 608.3 204 773.5 204" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><text x="537.5" y="224" class="text-italic fill-N2 s1">성공·실패가 n 번</text><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M311.873 392.702C514.799 468.8 615 488 807 488" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><text x="554" y="482" class="text-italic fill-N2 s1">언제 나오나</text><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M262.592 404.21C505 588.6 607.2 635 768 635" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><text x="493" y="585" class="text-italic fill-N2 s1">몇 번 일어나나</text><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M1076.5 41h409" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M1059.5 204H1332" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M1729.978 180.704C1984.8 142.6 2098.6 133 2293 133" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><text x="2011.5" y="146" class="text-italic fill-N2 s1">넣는다 / 모집단이 크다</text><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M1725.978 226.298C1984 265.2 2095.199 275 2276 275" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><text x="2000.5" y="272" class="text-italic fill-N2 s1">안 넣는다 / 모집단이 작다</text><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M2494.5 133h335" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><text x="2663" y="139" class="text-italic fill-N2 s1">n = 1 이면</text><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M1024.5 488H1322" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M1711.979 466.708C1981.2 427 2099.7 417 2298.5 417" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><text x="2004.5" y="430" class="text-italic fill-N2 s1">첫 번째</text><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M1711.979 509.292C1981.2 549 2103.7 559 2318.5 559" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><text x="2015" y="557" class="text-italic fill-N2 s1">r 번째</text><path fill="none" marker-end="url(#mk-d2-2445435416-3488378134)" d="M1063.5 635h405" class="connection stroke-B1 s0" mask="url(#d2-2445435416)"/><mask id="d2-2445435416" width="3218" height="878" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3218v878H-101z"/><path d="M442 96h85v21h-85zM468 208h139v21H468zM502 466h104v21H502zM430 569h126v21H430zM1915 130h193v21h-193zM1893 256h215v21h-215zM2625 123h76v21h-76zM1972 414h65v21h-65zM1989 541h52v21h-52z"/></mask></svg>