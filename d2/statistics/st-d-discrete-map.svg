<svg xmlns="http://www.w3.org/2000/svg" width="2230" height="778" class="d2-679050352 d2-svg" viewBox="-101 -101 2230 778"><rect width="2230" height="778" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-679050352 .fill-N1{fill:#0a0f25}.d2-679050352 .fill-N2{fill:#676c7e}.d2-679050352 .fill-B6{fill:#f7f8fe}.d2-679050352 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M142 0h196v82H142z" class="stroke-B1 fill-B6 s0"/></g><text x="240" y="38.5" class="text-bold fill-N1 s1"><tspan x="240" dy="0">베르누이 시행</tspan><tspan x="240" dy="18.5">한 번의 성공·실패</tspan></text></g><g ><g class="shape"><path d="M885 71h124v82H885z" class="stroke-B1 fill-B6 s0"/></g><text x="947" y="109.5" class="text-bold fill-N1 s1"><tspan x="947" dy="0">이항분포</tspan><tspan x="947" dy="18.5">b(x; n, p)</tspan></text></g><g ><g class="shape"><path d="M167 142h145v82H167z" class="stroke-B1 fill-B6 s0"/></g><text x="239.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="239.5" dy="0">초기하분포</tspan><tspan x="239.5" dy="18.5">h(x; N, n, K)</tspan></text></g><g ><g class="shape"><path d="M178 284h124v82H178z" class="stroke-B1 fill-B6 s0"/></g><text x="240" y="322.5" class="text-bold fill-N1 s1"><tspan x="240" dy="0">기하분포</tspan><tspan x="240" dy="18.5">g(x; p)</tspan></text></g><g ><g class="shape"><path d="M874 284h145v82H874z" class="stroke-B1 fill-B6 s0"/></g><text x="946.5" y="322.5" class="text-bold fill-N1 s1"><tspan x="946.5" dy="0">음이항분포</tspan><tspan x="946.5" dy="18.5">b*(x; r, p)</tspan></text></g><g ><g class="shape"><path d="M1409 121h148v82h-148z" class="stroke-B1 fill-B6 s0"/></g><text x="1483" y="159.5" class="text-bold fill-N1 s1"><tspan x="1483" dy="0">푸아송 분포</tspan><tspan x="1483" dy="18.5">p(x; λ)</tspan></text></g><g ><g class="shape"><path d="M1872 63h156v98h-156z" class="stroke-B1 fill-B6 s0"/></g><text x="1950" y="101.5" class="text-bold fill-N1 s1"><tspan x="1950" dy="0">정규분포</tspan><tspan x="1950" dy="17.667">N(np, np(1 − p))</tspan><tspan x="1950" dy="17.667">(9장)</tspan></text></g><text x="239.5" y="442" class="fill-N1 s1"><tspan x="239.5" dy="0">기하분포만 갖는 성질:</tspan><tspan x="239.5" dy="17.667">P(X &gt; s + k | X &gt; s) = P(X &gt; k)</tspan><tspan x="239.5" dy="17.667">이미 실패한 횟수는 아무 정보도 아니다</tspan></text><text x="239.5" y="555" class="fill-N1 s1"><tspan x="239.5" dy="0">근사 화살표는 ‘같다’ 가 아니라 ‘가까워진다’ 는 뜻이다.</tspan><tspan x="239.5" dy="18.5">근사를 쓰기 전에 조건을 반드시 확인하라</tspan></text><marker id="mk-d2-679050352-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-679050352-3488378134)" d="M340.5 41c268.4 0 377.6 10.939 540.132 53.679" class="connection stroke-B1 s0" mask="url(#d2-679050352)"/><text x="615" y="47" class="text-italic fill-N2 s1">독립으로 n 번 더한다</text><path fill="none" marker-end="url(#mk-d2-679050352-3488378134)" d="M304.491 318.922c297.209-28.3 411.609-29.422 566.054-6.021" class="connection stroke-B1 s0" mask="url(#d2-679050352)"/><text x="589" y="297" class="text-italic fill-N2 s1">r 개를 이어 붙인다</text><path fill="none" marker-end="url(#mk-d2-679050352-3488378134)" d="M872.512 333.72C716.1 351.1 601.5 350.3 305.49 329.778" class="connection stroke-B1 s0" mask="url(#d2-679050352)"/><text x="588.5" y="355" class="text-italic fill-N2 s1">r = 1</text><path fill="none" marker-end="url(#mk-d2-679050352-3488378134)" d="M313.5 183c290 0 404.6-10.94 567.132-53.68" class="connection stroke-B1 s0" mask="url(#d2-679050352)"/><text x="601" y="181" class="text-italic fill-N2 s1"><tspan x="601" dy="0">N 이 크다</tspan><tspan x="601" dy="18.5">n/N ≤ 0.05</tspan></text><path fill="none" marker-end="url(#mk-d2-679050352-3488378134)" d="M1011.464 124.312C1165.9 154.186 1245.7 161.75 1404.5 161.75" class="connection stroke-B1 s0" mask="url(#d2-679050352)"/><text x="1207.5" y="156" class="text-italic fill-N2 s1"><tspan x="1207.5" dy="0">n 이 크고 p 가 작다</tspan><tspan x="1207.5" dy="18.5">np = λ 를 유지</tspan></text><path fill="none" marker-end="url(#mk-d2-679050352-3488378134)" d="M1011.464 99.687C1165.9 69.813 1260.5 62.25 1343.75 62.25s409.05 6.6 524.345 32.135" class="connection stroke-B1 s0" mask="url(#d2-679050352)"/><text x="1440.5" y="60" class="text-italic fill-N2 s1"><tspan x="1440.5" dy="0">n 이 크고 np, n(1 − p) ≥ 10</tspan><tspan x="1440.5" dy="18.5">연속성 수정 ±0.5</tspan></text><path fill="none" marker-end="url(#mk-d2-679050352-3488378134)" d="M1559.5 161.75c130.4 0 193.3-6.6 308.595-32.135" class="connection stroke-B1 s0" mask="url(#d2-679050352)"/><text x="1716.5" y="164" class="text-italic fill-N2 s1">λ 가 크다</text><mask id="d2-679050352" width="2230" height="778" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2230v778H-101z"/><path d="M527 31h176v21H527zM512 281h154v21H512zM573 339h31v21h-31zM562 165h78v37h-78zM1131 140h153v37h-153zM1347 44h187v37h-187zM1677 148h79v21h-79z"/></mask></svg>