<svg xmlns="http://www.w3.org/2000/svg" width="2188" height="778" class="d2-592263800 d2-svg" viewBox="-101 -101 2188 778"><rect width="2188" height="778" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-592263800 .fill-N1{fill:#0a0f25}.d2-592263800 .fill-N2{fill:#676c7e}.d2-592263800 .fill-B6{fill:#f7f8fe}.d2-592263800 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M121 0h196v82H121z" class="stroke-B1 fill-B6 s0"/></g><text x="219" y="38.5" class="text-bold fill-N1 s1"><tspan x="219" dy="0">베르누이 시행</tspan><tspan x="219" dy="18.5">한 번의 성공·실패</tspan></text></g><g ><g class="shape"><path d="M843 71h124v82H843z" class="stroke-B1 fill-B6 s0"/></g><text x="905" y="109.5" class="text-bold fill-N1 s1"><tspan x="905" dy="0">이항분포</tspan><tspan x="905" dy="18.5">b(x; n, p)</tspan></text></g><g ><g class="shape"><path d="M146 142h145v82H146z" class="stroke-B1 fill-B6 s0"/></g><text x="218.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="218.5" dy="0">초기하분포</tspan><tspan x="218.5" dy="18.5">h(x; N, n, K)</tspan></text></g><g ><g class="shape"><path d="M157 284h124v82H157z" class="stroke-B1 fill-B6 s0"/></g><text x="219" y="322.5" class="text-bold fill-N1 s1"><tspan x="219" dy="0">기하분포</tspan><tspan x="219" dy="18.5">g(x; p)</tspan></text></g><g ><g class="shape"><path d="M832 284h145v82H832z" class="stroke-B1 fill-B6 s0"/></g><text x="904.5" y="322.5" class="text-bold fill-N1 s1"><tspan x="904.5" dy="0">음이항분포</tspan><tspan x="904.5" dy="18.5">b*(x; r, p)</tspan></text></g><g ><g class="shape"><path d="M1367 121h148v82h-148z" class="stroke-B1 fill-B6 s0"/></g><text x="1441" y="159.5" class="text-bold fill-N1 s1"><tspan x="1441" dy="0">푸아송 분포</tspan><tspan x="1441" dy="18.5">p(x; λ)</tspan></text></g><g ><g class="shape"><path d="M1830 63h156v98h-156z" class="stroke-B1 fill-B6 s0"/></g><text x="1908" y="101.5" class="text-bold fill-N1 s1"><tspan x="1908" dy="0">정규분포</tspan><tspan x="1908" dy="17.667">N(np, np(1 − p))</tspan><tspan x="1908" dy="17.667">(8장)</tspan></text></g><text x="218.5" y="442" class="fill-N1 s1"><tspan x="218.5" dy="0">기하분포만 갖는 성질:</tspan><tspan x="218.5" dy="17.667">P(X &gt; s + k | X &gt; s) = P(X &gt; k)</tspan><tspan x="218.5" dy="17.667">이미 실패한 횟수는 아무 정보도 아니다</tspan></text><text x="218.5" y="555" class="fill-N1 s1"><tspan x="218.5" dy="0">화살표는 ‘같다’ 가 아니라 ‘가까워진다’ 는 뜻이다.</tspan><tspan x="218.5" dy="18.5">근사를 쓰기 전에 조건을 반드시 확인하라</tspan></text><marker id="mk-d2-592263800-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-592263800-3488378134)" d="M319.5 41c251.6 0 356.6 10.939 519.132 53.679" class="connection stroke-B1 s0" mask="url(#d2-592263800)"/><text x="583" y="48" class="text-italic fill-N2 s1">독립으로 n 번 더한다</text><path fill="none" marker-end="url(#mk-d2-592263800-3488378134)" d="M283.49 318.615C563.9 290.562 674.1 289.5 828.545 312.9" class="connection stroke-B1 s0" mask="url(#d2-592263800)"/><text x="557" y="297" class="text-italic fill-N2 s1">r 개를 이어 붙인다</text><path fill="none" marker-end="url(#mk-d2-592263800-3488378134)" d="M830.512 333.72C674.1 351.1 563.7 350.3 284.49 329.794" class="connection stroke-B1 s0" mask="url(#d2-592263800)"/><text x="556.5" y="355" class="text-italic fill-N2 s1">r = 1</text><path fill="none" marker-end="url(#mk-d2-592263800-3488378134)" d="M292.5 183c273.2 0 383.6-10.94 546.132-53.68" class="connection stroke-B1 s0" mask="url(#d2-592263800)"/><text x="570" y="180" class="text-italic fill-N2 s1"><tspan x="570" dy="0">N 이 크다</tspan><tspan x="570" dy="18.5">n/N ≤ 0.05</tspan></text><path fill="none" marker-end="url(#mk-d2-592263800-3488378134)" d="M969.464 124.312C1123.9 154.186 1203.7 161.75 1362.5 161.75" class="connection stroke-B1 s0" mask="url(#d2-592263800)"/><text x="1165.5" y="156" class="text-italic fill-N2 s1"><tspan x="1165.5" dy="0">n 이 크고 p 가 작다</tspan><tspan x="1165.5" dy="18.5">np = λ 를 유지</tspan></text><path fill="none" marker-end="url(#mk-d2-592263800-3488378134)" d="M969.464 99.687C1123.9 69.813 1218.5 62.25 1301.75 62.25s409.05 6.6 524.345 32.135" class="connection stroke-B1 s0" mask="url(#d2-592263800)"/><text x="1398.5" y="60" class="text-italic fill-N2 s1"><tspan x="1398.5" dy="0">n 이 크고 np, n(1 − p) ≥ 10</tspan><tspan x="1398.5" dy="18.5">연속성 수정 ±0.5</tspan></text><path fill="none" marker-end="url(#mk-d2-592263800-3488378134)" d="M1517.5 161.75c130.4 0 193.3-6.6 308.595-32.135" class="connection stroke-B1 s0" mask="url(#d2-592263800)"/><text x="1674.5" y="164" class="text-italic fill-N2 s1">λ 가 크다</text><mask id="d2-592263800" width="2188" height="778" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2188v778H-101z"/><path d="M495 32h176v21H495zM480 281h154v21H480zM541 339h31v21h-31zM531 164h78v37h-78zM1089 140h153v37h-153zM1305 44h187v37h-187zM1635 148h79v21h-79z"/></mask></svg>