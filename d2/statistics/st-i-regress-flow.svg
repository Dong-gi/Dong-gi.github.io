<svg xmlns="http://www.w3.org/2000/svg" width="1949" height="1090" class="d2-1782086301 d2-svg" viewBox="-101 -101 1949 1090"><rect width="1949" height="1090" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1782086301 .fill-N1{fill:#0a0f25}.d2-1782086301 .fill-N2{fill:#676c7e}.d2-1782086301 .fill-B6{fill:#f7f8fe}.d2-1782086301 .stroke-B1,.d2-1782086301 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M261 0h205v66H261z" class="stroke-B1 fill-B6 s0"/></g><text x="363.5" y="38.5" class="text-bold fill-N1 s1">1. 산점도를 그린다</text></g><text x="166.5" y="197" class="fill-N1 s1"><tspan x="166.5" dy="0">직선으로 볼 만한가, 이상점이 있는가.</tspan><tspan x="166.5" dy="18.5">이 단계를 건너뛰면 뒤가 다 헛일이 된다</tspan></text><g ><g class="shape"><path d="M393 166h333v66H393z" class="stroke-B1 fill-B6 s0"/></g><text x="559.5" y="204.5" class="text-bold fill-N1 s1">2. 최소제곱으로 b~0, b~1 을 구한다</text></g><text x="192" y="363" class="fill-N1 s1"><tspan x="192" dy="0">b~1 = S~{xy}/S~{xx}, b~0 = ȳ − b~1x̄</tspan><tspan x="192" dy="18.5">편미분 두 개를 0 으로 놓은 결과다</tspan></text><g ><g class="shape"><path d="M393 332h334v66H393z" class="stroke-B1 fill-B6 s0"/></g><text x="560" y="370.5" class="text-bold fill-N1 s1">3. 잔차 그림으로 가정을 확인한다</text></g><text x="188" y="550" class="fill-N1 s1"><tspan x="188" dy="0">직선성 · 등분산 · 독립 · 정규성</tspan><tspan x="188" dy="18.5">네 가지를 잔차 그림 하나로 본다</tspan></text><g ><g class="shape"><path d="M797 519h296v66H797z" class="stroke-B1 fill-B6 s0"/></g><text x="945" y="557.5" class="text-bold fill-N1 s1">변수를 바꾸거나 항을 더한다</text></g><g ><g class="shape"><path d="M383 519h354v66H383z" class="stroke-B1 fill-B6 s0"/></g><text x="560" y="557.5" class="text-bold fill-N1 s1">4. 기울기를 검정하고 구간을 만든다</text></g><text x="435" y="716" class="fill-N1 s1"><tspan x="435" dy="0">s² = SSE/(n−2), SE(b~1) = s/√S~{xx}</tspan><tspan x="435" dy="18.5">t = b~1/SE(b~1), 자유도 n − 2</tspan></text><g ><g class="shape"><path d="M614 685h142v66H614z" class="stroke-B1 fill-B6 s0"/></g><text x="685" y="723.5" class="text-bold fill-N1 s1">5. 예측한다</text></g><text x="685" y="867" class="fill-N1 s1"><tspan x="685" dy="0">평균을 물으면 신뢰구간, 개체 하나를 물으면 예측구간.</tspan><tspan x="685" dy="18.5">자료 범위 밖은 예측하지 않는다</tspan></text><text x="785" y="31" class="fill-N1 s1"><tspan x="785" dy="0">R² 은 3단계를 대신하지 못한다.</tspan><tspan x="785" dy="18.5">R² 이 커도 잔차에 패턴이 있으면 4·5단계의 수는 모두 못 믿는다</tspan></text><text x="1425.5" y="31" class="fill-N1 s1"><tspan x="1425.5" dy="0">관측자료에 회귀를 돌린 것은 관계를 요약한 것이지 원인을 찾은 것이 아니다.</tspan><tspan x="1425.5" dy="18.5">인과를 말하려면 무작위 배정이나 교란변수 통제가 있어야 한다</tspan></text><marker id="mk-d2-1782086301-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1782086301-2177206569)" d="M282.658 66.78C190.1 106 166.5 128.9 166.5 176.5" class="connection stroke-B2 s3" mask="url(#d2-1782086301)"/><path fill="none" marker-end="url(#mk-d2-1782086301-2177206569)" d="M411.549 232.44C235.899 272 191.5 294.9 191.5 342.5" class="connection stroke-B2 s3" mask="url(#d2-1782086301)"/><path fill="none" marker-end="url(#mk-d2-1782086301-2177206569)" d="M426.561 397.99C235.7 446.3 187.5 473.5 187.5 529.5" class="connection stroke-B2 s3" mask="url(#d2-1782086301)"/><path fill="none" marker-end="url(#mk-d2-1782086301-2177206569)" d="M507.836 586.11C449.5 625 434.5 647.9 434.5 695.5" class="connection stroke-B2 s3" mask="url(#d2-1782086301)"/><path fill="none" marker-end="url(#mk-d2-1782086301-2177206569)" d="M684.5 753v94" class="connection stroke-B2 s3" mask="url(#d2-1782086301)"/><marker id="mk-d2-1782086301-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1782086301-3488378134)" d="M443.342 66.78C535.9 106 559.5 126 559.5 162" class="connection stroke-B1 s0" mask="url(#d2-1782086301)"/><path fill="none" marker-end="url(#mk-d2-1782086301-3488378134)" d="M559.5 234v94" class="connection stroke-B1 s0" mask="url(#d2-1782086301)"/><path fill="none" marker-end="url(#mk-d2-1782086301-3488378134)" d="M559.5 399.5v116" class="connection stroke-B1 s0" mask="url(#d2-1782086301)"/><text x="560" y="464" class="text-italic fill-N2 s1">가정이 그럴듯하다</text><path fill="none" marker-end="url(#mk-d2-1782086301-3488378134)" d="M657.14 398.155C796.05 446.3 845.65 470.7 900.198 516.915" class="connection stroke-B1 s0" mask="url(#d2-1782086301)"/><text x="787.5" y="449" class="text-italic fill-N2 s1">패턴이 보인다</text><path fill="none" marker-end="url(#mk-d2-1782086301-3488378134)" d="M959.034 517.66c20.016-46.96 25.216-77.86 25.216-105.91S932.65 272 730.177 232.761" class="connection stroke-B1 s0" mask="url(#d2-1782086301)"/><text x="943.5" y="302" class="text-italic fill-N2 s1">다시 적합한다</text><path fill="none" marker-end="url(#mk-d2-1782086301-3488378134)" d="M611.164 586.11C669.5 625 684.5 645 684.5 681" class="connection stroke-B1 s0" mask="url(#d2-1782086301)"/><mask id="d2-1782086301" width="1949" height="1090" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1949V989H-101z"/><path d="M479 448h162v21H479zM726 433h123v21H726zM882 286h123v21H882z"/></mask></svg>