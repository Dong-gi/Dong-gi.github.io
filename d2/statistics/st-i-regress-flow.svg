<svg xmlns="http://www.w3.org/2000/svg" width="1946" height="1090" class="d2-2548019159 d2-svg" viewBox="-101 -101 1946 1090"><rect width="1946" height="1090" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2548019159 .fill-N1{fill:#0a0f25}.d2-2548019159 .fill-N2{fill:#676c7e}.d2-2548019159 .fill-B6{fill:#f7f8fe}.d2-2548019159 .stroke-B1,.d2-2548019159 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M258 0h205v66H258z" class="stroke-B1 fill-B6 s0"/></g><text x="360.5" y="38.5" class="text-bold fill-N1 s1">1. 산점도를 그린다</text></g><text x="166.5" y="197" class="fill-N1 s1"><tspan x="166.5" dy="0">직선으로 볼 만한가, 이상점이 있는가.</tspan><tspan x="166.5" dy="18.5">이 단계를 건너뛰면 뒤가 다 헛일이 된다</tspan></text><g ><g class="shape"><path d="M393 166h321v66H393z" class="stroke-B1 fill-B6 s0"/></g><text x="553.5" y="204.5" class="text-bold fill-N1 s1">2. 최소제곱으로 b₀, b₁ 을 구한다</text></g><text x="186" y="363" class="fill-N1 s1"><tspan x="186" dy="0">b₁ = Sxy/Sxx, b₀ = ȳ − b₁x̄</tspan><tspan x="186" dy="18.5">편미분 두 개를 0 으로 놓은 결과다</tspan></text><g ><g class="shape"><path d="M387 332h334v66H387z" class="stroke-B1 fill-B6 s0"/></g><text x="554" y="370.5" class="text-bold fill-N1 s1">3. 잔차 그림으로 가정을 확인한다</text></g><text x="182" y="550" class="fill-N1 s1"><tspan x="182" dy="0">직선성 · 등분산 · 독립 · 정규성</tspan><tspan x="182" dy="18.5">네 가지를 잔차 그림 하나로 본다</tspan></text><g ><g class="shape"><path d="M791 519h296v66H791z" class="stroke-B1 fill-B6 s0"/></g><text x="939" y="557.5" class="text-bold fill-N1 s1">변수를 바꾸거나 항을 더한다</text></g><g ><g class="shape"><path d="M377 519h354v66H377z" class="stroke-B1 fill-B6 s0"/></g><text x="554" y="557.5" class="text-bold fill-N1 s1">4. 기울기를 검정하고 구간을 만든다</text></g><text x="434.5" y="716" class="fill-N1 s1"><tspan x="434.5" dy="0">s² = SSE/(n−2), SE(b₁) = s/√Sxx</tspan><tspan x="434.5" dy="18.5">t = b₁/SE(b₁), 자유도 n − 2</tspan></text><g ><g class="shape"><path d="M602 685h142v66H602z" class="stroke-B1 fill-B6 s0"/></g><text x="673" y="723.5" class="text-bold fill-N1 s1">5. 예측한다</text></g><text x="673" y="867" class="fill-N1 s1"><tspan x="673" dy="0">평균을 물으면 신뢰구간, 개체 하나를 물으면 예측구간.</tspan><tspan x="673" dy="18.5">자료 범위 밖은 예측하지 않는다</tspan></text><text x="782" y="31" class="fill-N1 s1"><tspan x="782" dy="0">R² 은 3단계를 대신하지 못한다.</tspan><tspan x="782" dy="18.5">R² 이 커도 잔차에 패턴이 있으면 4·5단계의 수는 모두 못 믿는다</tspan></text><text x="1422.5" y="31" class="fill-N1 s1"><tspan x="1422.5" dy="0">관측자료에 회귀를 돌린 것은 관계를 요약한 것이지 원인을 찾은 것이 아니다.</tspan><tspan x="1422.5" dy="18.5">인과를 말하려면 무작위 배정이나 교란변수 통제 같은 설계가 있어야 한다</tspan></text><marker id="mk-d2-2548019159-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2548019159-2177206569)" d="M281.66 66.786C189.9 106 166.5 128.9 166.5 176.5" class="connection stroke-B2 s3" mask="url(#d2-2548019159)"/><path fill="none" marker-end="url(#mk-d2-2548019159-2177206569)" d="M405.549 232.44C229.899 272 185.5 294.9 185.5 342.5" class="connection stroke-B2 s3" mask="url(#d2-2548019159)"/><path fill="none" marker-end="url(#mk-d2-2548019159-2177206569)" d="M420.561 397.99C229.7 446.3 181.5 473.5 181.5 529.5" class="connection stroke-B2 s3" mask="url(#d2-2548019159)"/><path fill="none" marker-end="url(#mk-d2-2548019159-2177206569)" d="M504.607 586.14C448.65 625 434.25 647.9 434.25 695.5" class="connection stroke-B2 s3" mask="url(#d2-2548019159)"/><path fill="none" marker-end="url(#mk-d2-2548019159-2177206569)" d="M672.75 753v94" class="connection stroke-B2 s3" mask="url(#d2-2548019159)"/><marker id="mk-d2-2548019159-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2548019159-3488378134)" d="M438.34 66.786C530.1 106 553.5 126 553.5 162" class="connection stroke-B1 s0" mask="url(#d2-2548019159)"/><path fill="none" marker-end="url(#mk-d2-2548019159-3488378134)" d="M553.5 234v94" class="connection stroke-B1 s0" mask="url(#d2-2548019159)"/><path fill="none" marker-end="url(#mk-d2-2548019159-3488378134)" d="M553.5 399.5v116" class="connection stroke-B1 s0" mask="url(#d2-2548019159)"/><text x="554" y="464" class="text-italic fill-N2 s1">가정이 그럴듯하다</text><path fill="none" marker-end="url(#mk-d2-2548019159-3488378134)" d="M651.14 398.155C790.05 446.3 839.65 470.7 894.198 516.915" class="connection stroke-B1 s0" mask="url(#d2-2548019159)"/><text x="781.5" y="449" class="text-italic fill-N2 s1">패턴이 보인다</text><path fill="none" marker-end="url(#mk-d2-2548019159-3488378134)" d="M953.034 517.66c20.016-46.96 25.216-77.86 25.216-105.91s-52.8-140.15-260.075-180.977" class="connection stroke-B1 s0" mask="url(#d2-2548019159)"/><text x="935.5" y="299" class="text-italic fill-N2 s1">다시 적합한다</text><path fill="none" marker-end="url(#mk-d2-2548019159-3488378134)" d="M602.393 586.14C658.35 625 672.75 645 672.75 681" class="connection stroke-B1 s0" mask="url(#d2-2548019159)"/><mask id="d2-2548019159" width="1946" height="1090" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1946V989H-101z"/><path d="M473 448h162v21H473zM720 433h123v21H720zM874 283h123v21H874z"/></mask></svg>