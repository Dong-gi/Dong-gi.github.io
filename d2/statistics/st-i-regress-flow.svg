<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="1288" class="d2-676825358 d2-svg" viewBox="-101 -101 1328 1288"><rect width="1328" height="1288" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-676825358 .text-bold{font-weight:700}.d2-676825358 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-676825358 .fill-N1{fill:#0a0f25}.d2-676825358 .fill-N2{fill:#676c7e}.d2-676825358 .fill-B6{fill:#f7f8fe}.d2-676825358 .stroke-B1,.d2-676825358 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M258 0h205v66H258z" class="stroke-B1 fill-B6 s0"/></g><text x="360.5" y="38.5" class="text-bold fill-N1 s1">1. 산점도를 그린다</text></g><text x="166.5" y="197" class="fill-N1 s1"><tspan x="166.5" dy="0">직선으로 볼 만한가, 이상점이 있는가.</tspan><tspan x="166.5" dy="18.5">이 단계를 건너뛰면 뒤가 다 헛일이 된다</tspan></text><g ><g class="shape"><path d="M393 166h321v66H393z" class="stroke-B1 fill-B6 s0"/></g><text x="553.5" y="204.5" class="text-bold fill-N1 s1">2. 최소제곱으로 b₀, b₁ 을 구한다</text></g><text x="285" y="363" class="fill-N1 s1"><tspan x="285" dy="0">b₁ = Sxy/Sxx, b₀ = ȳ − b₁x̄</tspan><tspan x="285" dy="18.5">편미분 두 개를 0 으로 놓은 결과다</tspan></text><g ><g class="shape"><path d="M486 332h334v66H486z" class="stroke-B1 fill-B6 s0"/></g><text x="653" y="370.5" class="text-bold fill-N1 s1">3. 잔차 그림으로 가정을 확인한다</text></g><text x="201" y="550" class="fill-N1 s1"><tspan x="201" dy="0">직선성 · 등분산 · 독립 · 정규성</tspan><tspan x="201" dy="18.5">네 가지를 잔차 그림 하나로 본다</tspan></text><g ><g class="shape"><path d="M830 519h296v66H830z" class="stroke-B1 fill-B6 s0"/></g><text x="978" y="557.5" class="text-bold fill-N1 s1">변수를 바꾸거나 항을 더한다</text></g><g ><g class="shape"><path d="M396 519h354v66H396z" class="stroke-B1 fill-B6 s0"/></g><text x="573" y="557.5" class="text-bold fill-N1 s1">4. 기울기를 검정하고 구간을 만든다</text></g><text x="434.5" y="716" class="fill-N1 s1"><tspan x="434.5" dy="0">s² = SSE/(n−2), SE(b₁) = s/√Sxx</tspan><tspan x="434.5" dy="18.5">t = b₁/SE(b₁), 자유도 n − 2</tspan></text><g ><g class="shape"><path d="M602 685h142v66H602z" class="stroke-B1 fill-B6 s0"/></g><text x="673" y="723.5" class="text-bold fill-N1 s1">5. 예측한다</text></g><text x="673" y="867" class="fill-N1 s1"><tspan x="673" dy="0">평균을 물으면 신뢰구간, 개체 하나를 물으면 예측구간.</tspan><tspan x="673" dy="18.5">자료 범위 밖은 예측하지 않는다</tspan></text><path fill="transparent" stroke="transparent" d="M280 908h566v178H280z" class="shape s0"/><text x="563" y="948" class="fill-N1 s1"><tspan x="563" dy="0">R² 은 3단계를 대신하지 못한다.</tspan><tspan x="563" dy="18.5">R² 이 커도 잔차에 패턴이 있으면 4·5단계의 수는 모두 못 믿는다</tspan></text><text x="519.5" y="1009" class="fill-N1 s1"><tspan x="519.5" dy="0">관측자료에 회귀를 돌린 것은 관계를 요약한 것이지</tspan><tspan x="519.5" dy="17.25">원인을 찾은 것이 아니다.</tspan><tspan x="519.5" dy="17.25">인과를 말하려면 무작위 배정이나</tspan><tspan x="519.5" dy="17.25">교란변수 통제 같은 설계가 있어야 한다</tspan></text><marker id="mk-d2-676825358-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-676825358-2177206569)" d="M281.66 66.786C189.9 106 166.5 128.9 166.5 176.5" class="connection stroke-B2 s3" mask="url(#d2-676825358)"/><path fill="none" marker-end="url(#mk-d2-676825358-2177206569)" d="M444.589 232.59C316.9 272 284.5 294.9 284.5 342.5" class="connection stroke-B2 s3" mask="url(#d2-676825358)"/><path fill="none" marker-end="url(#mk-d2-676825358-2177206569)" d="M491.292 397.909C259.65 446.3 201.25 473.5 201.25 529.5" class="connection stroke-B2 s3" mask="url(#d2-676825358)"/><path fill="none" marker-end="url(#mk-d2-676825358-2177206569)" d="M516.531 586.023C451.05 625 434.25 647.9 434.25 695.5" class="connection stroke-B2 s3" mask="url(#d2-676825358)"/><path fill="none" marker-end="url(#mk-d2-676825358-2177206569)" d="M672.75 753v94" class="connection stroke-B2 s3" mask="url(#d2-676825358)"/><marker id="mk-d2-676825358-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-676825358-3488378134)" d="M438.34 66.786C530.1 106 553.5 126 553.5 162" class="connection stroke-B1 s0" mask="url(#d2-676825358)"/><path fill="none" marker-end="url(#mk-d2-676825358-3488378134)" d="M594.036 233.28C640.5 272 652.5 292 652.5 328" class="connection stroke-B1 s0" mask="url(#d2-676825358)"/><path fill="none" marker-end="url(#mk-d2-676825358-3488378134)" d="M622.967 399.034C583.45 446.3 573.25 470.7 573.25 515.5" class="connection stroke-B1 s0" mask="url(#d2-676825358)"/><text x="581" y="457" class="text-italic fill-N2 s1">가정이 그럴듯하다</text><path fill="none" marker-end="url(#mk-d2-676825358-3488378134)" d="M715.006 398.457C802.85 446.3 844.85 470.7 919.854 517.387" class="connection stroke-B1 s0" mask="url(#d2-676825358)"/><text x="819.5" y="462" class="text-italic fill-N2 s1">패턴이 보인다</text><path fill="none" marker-end="url(#mk-d2-676825358-3488378134)" d="M978.25 517.5V411.75c0-28.05-52.8-140.15-260.075-180.977" class="connection stroke-B1 s0" mask="url(#d2-676825358)"/><text x="934.5" y="297" class="text-italic fill-N2 s1">다시 적합한다</text><path fill="none" marker-end="url(#mk-d2-676825358-3488378134)" d="M614.286 586.28C660.75 625 672.75 645 672.75 681" class="connection stroke-B1 s0" mask="url(#d2-676825358)"/><mask id="d2-676825358" width="1328" height="1288" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1328v1288H-101z"/><path d="M500 441h162v21H500zM758 446h123v21H758zM873 281h123v21H873z"/></mask></svg>