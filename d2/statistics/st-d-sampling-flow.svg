<svg xmlns="http://www.w3.org/2000/svg" width="1543" height="1379" class="d2-1952079677 d2-svg" viewBox="-101 -101 1543 1379"><rect width="1543" height="1379" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1952079677 .fill-N1{fill:#0a0f25}.d2-1952079677 .fill-N2{fill:#676c7e}.d2-1952079677 .fill-B6{fill:#f7f8fe}.d2-1952079677 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M178 0h215v82H178z" class="stroke-B1 fill-B6 s0"/></g><text x="285.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="285.5" dy="0">모집단</tspan><tspan x="285.5" dy="18.5">관심 있는 대상 전체</tspan></text></g><g ><g class="shape"><path d="M312 625h243v98H312z" class="stroke-B1 fill-B6 s0"/></g><text x="433.5" y="663.5" class="text-bold fill-N1 s1"><tspan x="433.5" dy="0">모수 (parameter)</tspan><tspan x="433.5" dy="17.667">μ, σ², p</tspan><tspan x="433.5" dy="17.667">정해진 상수. 볼 수 없다</tspan></text></g><g ><g class="shape"><path d="M10 203h255v98H10z" class="stroke-B1 fill-B6 s0"/></g><text x="137.5" y="241.5" class="text-bold fill-N1 s1"><tspan x="137.5" dy="0">확률표본 뽑기</tspan><tspan x="137.5" dy="17.667">X₁, …, Xₙ 이 독립이고</tspan><tspan x="137.5" dy="17.667">모두 같은 분포를 따른다</tspan></text></g><g ><g class="shape"><path d="M10 422h255v82H10z" class="stroke-B1 fill-B6 s0"/></g><text x="137.5" y="460.5" class="text-bold fill-N1 s1"><tspan x="137.5" dy="0">표본</tspan><tspan x="137.5" dy="18.5">우리가 실제로 보는 수들</tspan></text></g><g ><g class="shape"><path d="M23 625h229v98H23z" class="stroke-B1 fill-B6 s0"/></g><text x="137.5" y="663.5" class="text-bold fill-N1 s1"><tspan x="137.5" dy="0">통계량 (statistic)</tspan><tspan x="137.5" dy="17.667">X̄, S², p̂</tspan><tspan x="137.5" dy="17.667">표본만으로 계산된다</tspan></text></g><g ><g class="shape"><path d="M151 844h269v98H151z" class="stroke-B1 fill-B6 s0"/></g><text x="285.5" y="882.5" class="text-bold fill-N1 s1"><tspan x="285.5" dy="0">표본분포</tspan><tspan x="285.5" dy="17.667">통계량도 확률변수이므로</tspan><tspan x="285.5" dy="17.667">분포를 갖는다</tspan></text></g><g ><g class="shape"><path d="M0 1063h235v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="117.5" y="1101.5" class="text-bold fill-N1 s1"><tspan x="117.5" dy="0">분포를 알려 주는 도구</tspan><tspan x="117.5" dy="17.25">· 큰 수의 법칙</tspan><tspan x="117.5" dy="17.25">· 중심극한정리</tspan><tspan x="117.5" dy="17.25">· 카이제곱 · t · F</tspan></text></g><g ><g class="shape"><path d="M295 1071h316v98H295z" class="stroke-B1 fill-B6 s0"/></g><text x="453" y="1109.5" class="text-bold fill-N1 s1"><tspan x="453" dy="0">10~12장</tspan><tspan x="453" dy="17.667">통계량을 보고 모수를 되짚는다</tspan><tspan x="453" dy="17.667">추정 · 검정 · 회귀</tspan></text></g><text x="651.5" y="39" class="fill-N1 s1"><tspan x="651.5" dy="0">표본분포는 ‘표본의 분포’ 가 아니라</tspan><tspan x="651.5" dy="18.5">‘통계량의 분포’ 다. 여기서 가장 많이 헷갈린다</tspan></text><text x="1125.5" y="31" class="fill-N1 s1"><tspan x="1125.5" dy="0">우리는 표본 하나만 본다.</tspan><tspan x="1125.5" dy="17.667">표본분포는 그 하나가 얼마나 흔들릴 수 있었는지를</tspan><tspan x="1125.5" dy="17.667">계산으로 알려 주는 것이다</tspan></text><marker id="mk-d2-1952079677-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1952079677-3488378134)" d="M346.894 82.64c68.756 47.66 86.356 81.76 86.356 114.61V621.5" class="connection stroke-B1 s0" mask="url(#d2-1952079677)"/><text x="433.5" y="338" class="text-italic fill-N2 s1">요약하면</text><path fill="none" marker-end="url(#mk-d2-1952079677-3488378134)" d="M223.606 82.64C154.85 130.3 137.25 154.7 137.25 199.5" class="connection stroke-B1 s0" mask="url(#d2-1952079677)"/><text x="158" y="134" class="text-italic fill-N2 s1">크기 n 으로</text><path fill="none" marker-end="url(#mk-d2-1952079677-3488378134)" d="M137.25 302.5v116" class="connection stroke-B1 s0" mask="url(#d2-1952079677)"/><path fill="none" marker-end="url(#mk-d2-1952079677-3488378134)" d="M137.25 505.5v116" class="connection stroke-B1 s0" mask="url(#d2-1952079677)"/><text x="137.5" y="570" class="text-italic fill-N2 s1">계산하면</text><path fill="none" marker-end="url(#mk-d2-1952079677-3488378134)" d="M137.25 724.5c0 46.8 16.2 71.2 77.805 117.594" class="connection stroke-B1 s0" mask="url(#d2-1952079677)"/><text x="154.5" y="802" class="text-italic fill-N2 s1">표본을 바꿔 가며 보면</text><path fill="none" marker-end="url(#mk-d2-1952079677-3488378134)" d="M208.828 942.597C136.1 990.3 117.5 1014.7 117.5 1059.5" class="connection stroke-B1 s0" mask="url(#d2-1952079677)"/><path fill="none" marker-end="url(#mk-d2-1952079677-3488378134)" d="M433.25 724.5c0 46.8-16.2 71.2-77.805 117.594" class="connection stroke-B1 s0" mask="url(#d2-1952079677)"/><text x="416" y="802" class="text-italic fill-N2 s1">분포의 중심과 폭을 정한다</text><path fill="none" marker-end="url(#mk-d2-1952079677-3488378134)" d="M361.672 942.597C434.4 990.3 453 1016.3 453 1067.5" class="connection stroke-B1 s0" mask="url(#d2-1952079677)"/><text x="433.5" y="995" class="text-italic fill-N2 s1">거꾸로 건넌다</text><mask id="d2-1952079677" width="1543" height="1379" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1543v1379H-101z"/><path d="M393 322h81v21h-81zM110 118h96v21h-96zM97 554h81v21H97zM61 786h187v21H61zM303 786h226v21H303zM372 979h123v21H372z"/></mask></svg>