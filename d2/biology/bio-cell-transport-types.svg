<svg xmlns="http://www.w3.org/2000/svg" width="1429" height="1501" class="d2-433847256 d2-svg" viewBox="-101 -101 1429 1501"><rect width="1429" height="1501" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-433847256 .fill-N1{fill:#0a0f25}.d2-433847256 .fill-N2{fill:#676c7e}.d2-433847256 .fill-N4{fill:#cfd2dd}.d2-433847256 .fill-B6{fill:#f7f8fe}.d2-433847256 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M481 0h296v66H481z" class="stroke-B1 fill-B6 s0"/></g><text x="629" y="38.5" class="text-bold fill-N1 s1">어떤 물질이 세포막을 건넌다</text></g><g ><g class="shape"><path d="M424 311h-4l-196-61c-2-1-2-2 0-2l196-61c2-1 5-1 7 0l197 60c2 1 2 2 0 2l-196 62z" class="stroke-B1 fill-N4 s0"/></g><text x="424" y="246.5" class="text-bold fill-N1 s1"><tspan x="424" dy="0">농도를 올리면 속도가</tspan><tspan x="424" dy="18.5">천장에 다가가는가?</tspan></text></g><g ><g class="shape"><path d="M0 432h343v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="171.5" y="470.5" class="text-bold fill-N1 s1"><tspan x="171.5" dy="0">단순 확산</tspan><tspan x="171.5" dy="17">지질 이중층을 그냥 통과한다</tspan><tspan x="171.5" dy="17">산소, 이산화탄소, 스테로이드처럼</tspan><tspan x="171.5" dy="17">작고 기름에 잘 녹는 것</tspan><tspan x="171.5" dy="17">에너지를 쓰지 않는다</tspan></text></g><g ><g class="shape"><path d="M677 559h-5l-267-61c-3-1-3-2 0-2l267-61c3-1 7-1 10 0l267 60c3 1 3 2 0 2l-267 62z" class="stroke-B1 fill-N4 s0"/></g><text x="677" y="494.5" class="text-bold fill-N1 s1"><tspan x="677" dy="0">농도가 낮은 쪽으로만 가는가,</tspan><tspan x="677" dy="18.5">높은 쪽으로도 밀어 올리는가?</tspan></text></g><g ><g class="shape"><path d="M271 683h305v130H271z" class="stroke-B1 fill-B6 s0"/></g><text x="423.5" y="721.5" class="text-bold fill-N1 s1"><tspan x="423.5" dy="0">촉진 확산</tspan><tspan x="423.5" dy="17">통로나 수송체를 지난다</tspan><tspan x="423.5" dy="17">낮은 쪽으로만 간다</tspan><tspan x="423.5" dy="17">에너지를 쓰지 않는다</tspan><tspan x="423.5" dy="17">예: 포도당 수송체, 아쿠아포린</tspan></text></g><g ><g class="shape"><path d="M930 794h-5l-287-45c-3 0-3-1 0-2l287-45h11l286 45c3 0 3 1 0 2l-287 45z" class="stroke-B1 fill-N4 s0"/></g><text x="930" y="753.5" class="text-bold fill-N1 s1">그 에너지를 어디서 가져오는가?</text></g><g ><g class="shape"><path d="M911 934h316v114H911z" class="stroke-B1 fill-B6 s0"/></g><text x="1069" y="972.5" class="text-bold fill-N1 s1"><tspan x="1069" dy="0">1차 능동 수송</tspan><tspan x="1069" dy="17.25">ATP 를 직접 쪼개 쓴다</tspan><tspan x="1069" dy="17.25">예: 나트륨-칼륨 펌프,</tspan><tspan x="1069" dy="17.25">리소좀을 산성으로 만드는 펌프</tspan></text></g><g ><g class="shape"><path d="M726 1169h408v130H726z" class="stroke-B1 fill-B6 s0"/></g><text x="930" y="1207.5" class="text-bold fill-N1 s1"><tspan x="930" dy="0">2차 능동 수송</tspan><tspan x="930" dy="17">다른 이온이 흘러내리는 힘을 빌린다</tspan><tspan x="930" dy="17">예: 나트륨과 포도당을 함께 들이는 수송체</tspan><tspan x="930" dy="17">펌프가 만든 기울기를 쓰므로</tspan><tspan x="930" dy="17">결국은 ATP 에 기대고 있다</tspan></text></g><g ><g class="shape"><path d="M686 192h296v114H686z" class="stroke-B1 fill-B6 s0"/></g><text x="834" y="230.5" class="text-bold fill-N1 s1"><tspan x="834" dy="0">소포 수송</tspan><tspan x="834" dy="17.25">막으로 싸서 통째로 옮긴다</tspan><tspan x="834" dy="17.25">분자 하나씩 다루지 않으므로</tspan><tspan x="834" dy="17.25">위 세 물음의 틀 밖이다</tspan></text></g><marker id="mk-d2-433847256-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-433847256-3488378134)" d="M555.432 66.334C450.85 114.3 424.2 138.4 424.017 182" class="connection stroke-B1 s0" mask="url(#d2-433847256)"/><path fill="none" marker-end="url(#mk-d2-433847256-3488378134)" d="M342.204 287.88C206 354.6 171.5 383.7 171.5 428.5" class="connection stroke-B1 s0" mask="url(#d2-433847256)"/><text x="233" y="347" class="text-italic fill-N2 s1">아니다 — 끝없이 비례해 오른다</text><path fill="none" marker-end="url(#mk-d2-433847256-3488378134)" d="M505.797 287.878C642.4 354.6 677 384 677 430" class="connection stroke-B1 s0" mask="url(#d2-433847256)"/><text x="616" y="347" class="text-italic fill-N2 s1">그렇다 — 결합 자리가 유한하다</text><path fill="none" marker-end="url(#mk-d2-433847256-3488378134)" d="M587.21 540.893C456.8 606 423.75 634.7 423.75 679.5" class="connection stroke-B1 s0" mask="url(#d2-433847256)"/><text x="481.5" y="599" class="text-italic fill-N2 s1">낮은 쪽으로만</text><path fill="none" marker-end="url(#mk-d2-433847256-3488378134)" d="M766.79 540.893C897.2 606 930.2 638.4 930.012 698" class="connection stroke-B1 s0" mask="url(#d2-433847256)"/><text x="880" y="603" class="text-italic fill-N2 s1">높은 쪽으로도 — 에너지를 쓴다</text><path fill="none" marker-end="url(#mk-d2-433847256-3488378134)" d="M975.485 789.34c74.315 67.06 93.265 96.36 93.265 141.16" class="connection stroke-B1 s0" mask="url(#d2-433847256)"/><text x="1042.5" y="856" class="text-italic fill-N2 s1">ATP 를 직접</text><path fill="none" marker-end="url(#mk-d2-433847256-3488378134)" d="M884.519 789.344C810.6 856.4 791.75 897 791.75 932.25s13.2 188.45 63.062 234.535" class="connection stroke-B1 s0" mask="url(#d2-433847256)"/><text x="792" y="977" class="text-italic fill-N2 s1">이온의 기울기에서</text><path fill="none" marker-end="url(#mk-d2-433847256-3488378134)" d="M703.068 66.334C807.65 114.3 834.25 139.7 834.25 188.5" class="connection stroke-B1 s0" mask="url(#d2-433847256)"/><text x="795" y="114" class="text-italic fill-N2 s1">분자가 아니라 덩어리라면</text><path fill="none" marker-end="url(#mk-d2-433847256-3488378134)" d="M1068.75 1049.5c0 46.8-13.2 71.2-63.062 117.285" class="connection stroke-B1 s0" mask="url(#d2-433847256)"/><text x="1056.5" y="1124" class="text-italic fill-N2 s1">펌프가 기울기를 만들고</text><mask id="d2-433847256" width="1429" height="1501" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1429v1501H-101z"/><path d="M104 331h258v21H104zM487 331h258v21H487zM420 583h123v21H420zM751 587h258v21H751zM995 840h95v21h-95zM711 961h162v21H711zM684 98h222v21H684zM955 1108h203v21H955z"/></mask></svg>