<svg xmlns="http://www.w3.org/2000/svg" width="1117" height="1693" class="d2-2015538408 d2-svg" viewBox="-101 -101 1117 1693"><rect width="1117" height="1693" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2015538408 .text-bold{font-weight:700}.d2-2015538408 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2015538408 .fill-N1{fill:#0a0f25}.d2-2015538408 .fill-N2{fill:#676c7e}.d2-2015538408 .fill-N4{fill:#cfd2dd}.d2-2015538408 .fill-B6{fill:#f7f8fe}.d2-2015538408 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M352 0h296v66H352z" class="stroke-B1 fill-B6 s0"/></g><text x="500" y="38.5" class="text-bold fill-N1 s1">어떤 물질이 세포막을 건넌다</text></g><g ><g class="shape"><path d="M310 338h-4l-196-61c-2-1-2-2 0-2l196-61c2-1 5-1 7 0l197 60c2 1 2 2 0 2l-196 62z" class="stroke-B1 fill-N4 s0"/></g><text x="310" y="273.5" class="text-bold fill-N1 s1"><tspan x="310" dy="0">농도를 올리면 속도가</tspan><tspan x="310" dy="18.5">천장에 다가가는가?</tspan></text></g><g ><g class="shape"><path d="M0 499h238v162H0z" class="stroke-B1 fill-B6 s0"/></g><text x="119" y="537.5" class="text-bold fill-N1 s1"><tspan x="119" dy="0">단순 확산</tspan><tspan x="119" dy="16.714">지질 이중층을</tspan><tspan x="119" dy="16.714">그냥 통과한다</tspan><tspan x="119" dy="16.714">산소, 이산화탄소,</tspan><tspan x="119" dy="16.714">스테로이드처럼</tspan><tspan x="119" dy="16.714">작고 기름에 잘 녹는 것</tspan><tspan x="119" dy="16.714">에너지를 쓰지 않는다</tspan></text></g><g ><g class="shape"><path d="M500 674c-2 0-3 0-4-1l-196-91q-3-1.5 0-3l196-92c2-1 5-1 7 0l197 92q3 1.5 0 3l-196 91c-1 1-2 1-4 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="500" y="561.5" class="text-bold fill-N1 s1"><tspan x="500" dy="0">농도가 낮은 쪽으로만</tspan><tspan x="500" dy="17.25">가는가,</tspan><tspan x="500" dy="17.25">높은 쪽으로도</tspan><tspan x="500" dy="17.25">밀어 올리는가?</tspan></text></g><g ><g class="shape"><path d="M148 811h305v130H148z" class="stroke-B1 fill-B6 s0"/></g><text x="300.5" y="849.5" class="text-bold fill-N1 s1"><tspan x="300.5" dy="0">촉진 확산</tspan><tspan x="300.5" dy="17">통로나 수송체를 지난다</tspan><tspan x="300.5" dy="17">낮은 쪽으로만 간다</tspan><tspan x="300.5" dy="17">에너지를 쓰지 않는다</tspan><tspan x="300.5" dy="17">예: 포도당 수송체, 아쿠아포린</tspan></text></g><g ><g class="shape"><path d="M700 938h-3l-183-61c-2-1-2-2 0-2l183-61c2-1 5-1 7 0l182 60c2 1 2 2 0 2l-183 62z" class="stroke-B1 fill-N4 s0"/></g><text x="700" y="873.5" class="text-bold fill-N1 s1"><tspan x="700" dy="0">그 에너지를</tspan><tspan x="700" dy="18.5">어디서 가져오는가?</tspan></text></g><g ><g class="shape"><path d="M687 1062h228v130H687z" class="stroke-B1 fill-B6 s0"/></g><text x="801" y="1100.5" class="text-bold fill-N1 s1"><tspan x="801" dy="0">1차 능동 수송</tspan><tspan x="801" dy="17">ATP 를 직접 쪼개 쓴다</tspan><tspan x="801" dy="17">예: 나트륨-칼륨 펌프,</tspan><tspan x="801" dy="17">리소좀을 산성으로</tspan><tspan x="801" dy="17">만드는 펌프</tspan></text></g><g ><g class="shape"><path d="M552 1329h296v162H552z" class="stroke-B1 fill-B6 s0"/></g><text x="700" y="1367.5" class="text-bold fill-N1 s1"><tspan x="700" dy="0">2차 능동 수송</tspan><tspan x="700" dy="16.714">다른 이온이 흘러내리는</tspan><tspan x="700" dy="16.714">힘을 빌린다</tspan><tspan x="700" dy="16.714">예: 나트륨과 포도당을</tspan><tspan x="700" dy="16.714">함께 들이는 수송체</tspan><tspan x="700" dy="16.714">펌프가 만든 기울기를 쓰므로</tspan><tspan x="700" dy="16.714">결국은 ATP 에 기대고 있다</tspan></text></g><g ><g class="shape"><path d="M572 203h238v146H572z" class="stroke-B1 fill-B6 s0"/></g><text x="691" y="241.5" class="text-bold fill-N1 s1"><tspan x="691" dy="0">소포 수송</tspan><tspan x="691" dy="16.833">막으로 싸서</tspan><tspan x="691" dy="16.833">통째로 옮긴다</tspan><tspan x="691" dy="16.833">분자 하나씩</tspan><tspan x="691" dy="16.833">다루지 않으므로</tspan><tspan x="691" dy="16.833">위 세 물음의 틀 밖이다</tspan></text></g><marker id="mk-d2-2015538408-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2015538408-3488378134)" d="M436.736 66.443C335.3 120.7 309.6 150.2 309.975 209" class="connection stroke-B1 s0" mask="url(#d2-2015538408)"/><path fill="none" marker-end="url(#mk-d2-2015538408-3488378134)" d="M247.4 321.2C145 398 119 433.9 119 495.5" class="connection stroke-B1 s0" mask="url(#d2-2015538408)"/><text x="153" y="389" class="text-italic fill-N2 s1"><tspan x="153" dy="0">아니다 —</tspan><tspan x="153" dy="18.5">끝없이 비례해 오른다</tspan></text><path fill="none" marker-end="url(#mk-d2-2015538408-3488378134)" d="M371.6 321.2C474 398 500 431.2 500 482" class="connection stroke-B1 s0" mask="url(#d2-2015538408)"/><text x="461" y="386" class="text-italic fill-N2 s1"><tspan x="461" dy="0">그렇다 —</tspan><tspan x="461" dy="18.5">결합 자리가 유한하다</tspan></text><path fill="none" marker-end="url(#mk-d2-2015538408-3488378134)" d="M423.455 641.27C325.2 722 300.25 756.3 300.25 807.5" class="connection stroke-B1 s0" mask="url(#d2-2015538408)"/><text x="337.5" y="717" class="text-italic fill-N2 s1">낮은 쪽으로만</text><path fill="none" marker-end="url(#mk-d2-2015538408-3488378134)" d="M576.545 641.27C674.8 722 699.8 756.6 699.985 809" class="connection stroke-B1 s0" mask="url(#d2-2015538408)"/><text x="663" y="710" class="text-italic fill-N2 s1"><tspan x="663" dy="0">높은 쪽으로도 —</tspan><tspan x="663" dy="18.5">에너지를 쓴다</tspan></text><path fill="none" marker-end="url(#mk-d2-2015538408-3488378134)" d="M741.247 926.564C788.8 986.2 801 1013.7 801 1058.5" class="connection stroke-B1 s0" mask="url(#d2-2015538408)"/><text x="788.5" y="992" class="text-italic fill-N2 s1">ATP 를 직접</text><path fill="none" marker-end="url(#mk-d2-2015538408-3488378134)" d="M657.76 926.569c-47.16 59.631-59.26 100.03-59.26 137.681 0 37.65 9.2 210.05 43.781 261.922" class="connection stroke-B1 s0" mask="url(#d2-2015538408)"/><text x="599.5" y="1121" class="text-italic fill-N2 s1"><tspan x="599.5" dy="0">이온의</tspan><tspan x="599.5" dy="18.5">기울기에서</tspan></text><path fill="none" marker-end="url(#mk-d2-2015538408-3488378134)" d="M563.264 66.443C664.7 120.7 690.5 148.3 690.5 199.5" class="connection stroke-B1 s0" mask="url(#d2-2015538408)"/><text x="654.5" y="113" class="text-italic fill-N2 s1"><tspan x="654.5" dy="0">분자가 아니라</tspan><tspan x="654.5" dy="18.5">덩어리라면</tspan></text><path fill="none" marker-end="url(#mk-d2-2015538408-3488378134)" d="M801 1193.5c0 53.2-9.2 80.8-43.781 132.672" class="connection stroke-B1 s0" mask="url(#d2-2015538408)"/><text x="795" y="1263" class="text-italic fill-N2 s1"><tspan x="795" dy="0">펌프가</tspan><tspan x="795" dy="18.5">기울기를 만들고</tspan></text><mask id="d2-2015538408" width="1117" height="1693" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1117v1693H-101z"/><path d="M61 373h184v37H61zM369 370h184v37H369zM276 701h123v21H276zM595 694h136v37H595zM741 976h95v21h-95zM549 1105h101v37H549zM593 97h123v37H593zM724 1247h142v37H724z"/></mask></svg>