<svg xmlns="http://www.w3.org/2000/svg" width="979" height="984" class="d2-3778755910 d2-svg" viewBox="-94 -101 979 984"><rect width="979" height="984" x="-94" y="-101" rx="0" style="fill:#fff"/><style>.d2-3778755910 .text-bold{font-weight:700}.d2-3778755910 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3778755910 .fill-N1{fill:#0a0f25}.d2-3778755910 .fill-N2{fill:#676c7e}.d2-3778755910 .fill-B6{fill:#f7f8fe}.d2-3778755910 .stroke-B1,.d2-3778755910 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{stroke-width:2;stroke-dasharray:10,9.865639}.s4{fill:#0d32b2}</style><g ><g class="shape"><path d="M353 0h188v98H353z" class="stroke-B1 fill-B6 s0"/></g><text x="447" y="38.5" class="text-bold fill-N1 s1"><tspan x="447" dy="0">DNA</tspan><tspan x="447" dy="17.667">정보를 보관한다</tspan><tspan x="447" dy="17.667">네 글자 A T G C</tspan></text></g><g ><g class="shape"><path d="M34 235h168v98H34z" class="stroke-B1 fill-B6 s0"/></g><text x="118" y="273.5" class="text-bold fill-N1 s1"><tspan x="118" dy="0">RNA</tspan><tspan x="118" dy="17.667">정보를 옮긴다</tspan><tspan x="118" dy="17.667">네 글자 A U G C</tspan></text></g><g ><g class="shape"><path d="M7 486h223v98H7z" class="stroke-B1 fill-B6 s0"/></g><text x="118.5" y="524.5" class="text-bold fill-N1 s1"><tspan x="118.5" dy="0">단백질</tspan><tspan x="118.5" dy="17.667">일을 한다</tspan><tspan x="118.5" dy="17.667">스무 글자 (아미노산)</tspan></text></g><g ><g class="shape"><path d="M290 486h314v98H290z" class="stroke-B2 fill-B6 s2"/></g><text x="447" y="524.5" class="text-bold fill-N1 s1"><tspan x="447" dy="0">역전사 (reverse transcription)</tspan><tspan x="447" dy="17.667">RNA 를 주형으로 DNA 를 만든다</tspan><tspan x="447" dy="17.667">레트로바이러스, 텔로머레이스</tspan></text></g><g ><g class="shape"><path d="M133 684h299v98H133z" class="stroke-B2 fill-B6 s3"/></g><text x="282.5" y="722.5" class="text-bold fill-N1 s1"><tspan x="282.5" dy="0">단백질의 아미노산 차례를</tspan><tspan x="282.5" dy="17.667">핵산 서열로 되돌려 적는 경로</tspan><tspan x="282.5" dy="17.667">— 알려진 것이 없다</tspan></text></g><marker id="mk-d2-3778755910-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-3778755910-3488378134)" d="M542.768 24.496C617.633 5 641.65 0 648.875 0s16.858 9.8 24.083 24.5 7.225 34.3 0 49-55.325 19.5-128.254.508" class="connection stroke-B1 s0" mask="url(#d2-3778755910)"/><text x="680.5" y="36" class="text-italic fill-N2 s1"><tspan x="680.5" dy="0">복제 (replication)</tspan><tspan x="680.5" dy="17.667">같은 것을 한 벌 더 만든다</tspan><tspan x="680.5" dy="17.667">반보존적</tspan></text><path fill="none" marker-end="url(#mk-d2-3778755910-3488378134)" d="M350.617 83.296C164.899 149.724 118 180.3 118 231.5" class="connection stroke-B1 s0" mask="url(#d2-3778755910)"/><text x="206" y="132" class="text-italic fill-N2 s1"><tspan x="206" dy="0">전사 (transcription)</tspan><tspan x="206" dy="18.5">한 가닥을 읽어 RNA 를 만든다</tspan></text><path fill="none" marker-end="url(#mk-d2-3778755910-3488378134)" d="M118 334.5v148" class="connection stroke-B1 s0" mask="url(#d2-3778755910)"/><text x="118" y="399" class="text-italic fill-N2 s1"><tspan x="118" dy="0">번역 (translation)</tspan><tspan x="118" dy="17.667">세 글자마다 아미노산 하나</tspan><tspan x="118" dy="17.667">리보솜이 한다</tspan></text><marker id="mk-d2-3778755910-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-3778755910-2177206569)" d="M203.504 330.461C318.55 393.5 359.75 424.9 405.291 483.345" class="connection stroke-B2 s2" mask="url(#d2-3778755910)"/><path fill="none" marker-end="url(#mk-d2-3778755910-2177206569)" d="M450.655 484.506C455.3 424.9 456.5 384.4 456.5 346.75s-1.2-194.05-5.653-245.265" class="connection stroke-B2 s2" mask="url(#d2-3778755910)"/><path fill="none" marker-end="url(#mk-d2-3778755910-2177206569)" d="M118 586c0 38 16.6 58 79.574 95.936" class="connection stroke-B2 s3" mask="url(#d2-3778755910)"/><path fill="none" marker-end="url(#mk-d2-3778755910-2177206569)" d="M433.43 691.472C601.1 645.6 643.5 614.2 643.5 584.5V346.75c0-37.65-22.8-194.05-110.578-247.179" class="connection stroke-B2 s3" mask="url(#d2-3778755910)"/><text x="643.5" y="449" class="text-italic fill-N2 s1">이 방향이 중심원리가 금지하는 것</text><mask id="d2-3778755910" width="979" height="984" x="-94" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-94-101h979v984H-94z"/><path d="M574 20h213v53H574zM86 116h240v37H86zM5 383h226v53H5zM500 433h287v21H500z"/></mask></svg>