<svg xmlns="http://www.w3.org/2000/svg" width="2687" height="535" class="d2-1668963536 d2-svg" viewBox="-118 -101 2687 535"><rect width="2687" height="535" x="-118" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1668963536 .fill-N1{fill:#0a0f25}.d2-1668963536 .fill-N2{fill:#676c7e}.d2-1668963536 .fill-B6{fill:#f7f8fe}.d2-1668963536 .stroke-B1,.d2-1668963536 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{stroke-width:2;stroke-dasharray:10,9.865639}.s4{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 145h188v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="94" y="183.5" class="text-bold fill-N1 s1"><tspan x="94" dy="0">DNA</tspan><tspan x="94" dy="17.667">정보를 보관한다</tspan><tspan x="94" dy="17.667">네 글자 A T G C</tspan></text></g><g ><g class="shape"><path d="M758 13h168v98H758z" class="stroke-B1 fill-B6 s0"/></g><text x="842" y="51.5" class="text-bold fill-N1 s1"><tspan x="842" dy="0">RNA</tspan><tspan x="842" dy="17.667">정보를 옮긴다</tspan><tspan x="842" dy="17.667">네 글자 A U G C</tspan></text></g><g ><g class="shape"><path d="M1577 0h223v98h-223z" class="stroke-B1 fill-B6 s0"/></g><text x="1688.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1688.5" dy="0">단백질</tspan><tspan x="1688.5" dy="17.667">일을 한다</tspan><tspan x="1688.5" dy="17.667">스무 글자 (아미노산)</tspan></text></g><g ><g class="shape"><path d="M1532 158h314v98h-314z" class="stroke-B2 fill-B6 s2"/></g><text x="1689" y="196.5" class="text-bold fill-N1 s1"><tspan x="1689" dy="0">역전사 (reverse transcription)</tspan><tspan x="1689" dy="17.667">RNA 를 주형으로 DNA 를 만든다</tspan><tspan x="1689" dy="17.667">레트로바이러스, 텔로머레이스</tspan></text></g><g ><g class="shape"><path d="M2169 79h299v98h-299z" class="stroke-B2 fill-B6 s3"/></g><text x="2318.5" y="117.5" class="text-bold fill-N1 s1"><tspan x="2318.5" dy="0">단백질의 아미노산 차례를</tspan