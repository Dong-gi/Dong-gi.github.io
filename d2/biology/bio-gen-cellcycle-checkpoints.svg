<svg xmlns="http://www.w3.org/2000/svg" width="1255" height="2358" class="d2-2369339836 d2-svg" viewBox="-101 -101 1255 2358"><rect width="1255" height="2358" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2369339836 .fill-N1{fill:#0a0f25}.d2-2369339836 .fill-N2{fill:#676c7e}.d2-2369339836 .fill-N4{fill:#cfd2dd}.d2-2369339836 .fill-B5{fill:#edf0fd}.d2-2369339836 .fill-B6{fill:#f7f8fe}.d2-2369339836 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M558 0h83v66h-83z" class="stroke-B1 fill-B6 s0"/></g><text x="599.5" y="38.5" class="text-bold fill-N1 s1">G1기</text></g><g ><g class="shape"><path d="M754 354c-2 0-3 0-5-1l-243-91c-3-1-3-2 0-3l243-92c3-1 6-1 9 0l244 92c3 1 3 2 0 3l-243 91c-2 1-3 1-5 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="754" y="241.5" class="text-bold fill-N1 s1"><tspan x="754" dy="0">G1/S 검문지점 (제한점)</tspan><tspan x="754" dy="17.25">확인: 세포가 충분히 컸는가</tspan><tspan x="754" dy="17.25">영양과 성장 신호가 있는가</tspan><tspan x="754" dy="17.25">DNA 에 손상은 없는가</tspan></text></g><g ><g class="shape"><path d="M527 475h117v82H527z" class="stroke-B1 fill-B6 s0"/></g><text x="585.5" y="513.5" class="text-bold fill-N1 s1"><tspan x="585.5" dy="0">S기</tspan><tspan x="585.5" dy="18.5">DNA 복제</tspan></text></g><g ><g class="shape"><path d="M544 657h83v66h-83z" class="stroke-B1 fill-B6 s0"/></g><text x="585.5" y="695.5" class="text-bold fill-N1 s1">G2기</text></g><g ><g class="shape"><path d="M585 1000c-2 0-3 0-5-1l-262-75c-3-1-3-2 0-3l262-76c3-1 7-1 10 0l262 76c3 1 3 2 0 3l-262 75c-2 1-3 1-5 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="585" y="911.5" class="text-bold fill-N1 s1"><tspan x="585" dy="0">G2/M 검문지점</tspan><tspan x="585" dy="17.667">확인: 복제가 끝났는가</tspan><tspan x="585" dy="17.667">복제 중 생긴 손상을 고쳤는가</tspan></text></g><g ><g class="shape"><path d="M334 1121h212v82H334z" class="stroke-B1 fill-B6 s0"/></g><text x="440" y="1159.5" class="text-bold fill-N1 s1"><tspan x="440" dy="0">M기 전기 ~ 중기</tspan><tspan x="440" dy="18.5">염색체 응축과 정렬</tspan></text></g><g ><g class="shape"><path d="M440 1480c-2 0-3 0-5-1l-243-75c-3-1-3-2 0-3l243-76c3-1 6-1 9 0l244 76c3 1 3 2 0 3l-243 75c-2 1-3 1-5 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="440" y="1391.5" class="text-bold fill-N1 s1"><tspan x="440" dy="0">방추사 부착 검문지점</tspan><tspan x="440" dy="17.667">확인: 모든 동원체가 양극에</tspan><tspan x="440" dy="17.667">제대로 붙었는가</tspan></text></g><g ><g class="shape"><path d="M0 1720h321v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="160.5" y="1758.5" class="text-bold fill-N1 s1"><tspan x="160.5" dy="0">M기 후기 ~ 세포질분열</tspan><tspan x="160.5" dy="18.5">자매염색분체 분리, 세포가 둘로</tspan></text></g><g ><g class="shape"><path d="M647 1601h406v320H647z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="850" y="1634" class="fill-N1" style="text-anchor:middle;font-size:28px">통과 실패 — 진행이 멈춘다</text></g><g ><g class="shape"><path d="M691 2058h319v98H691z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="850.5" y="2096.5" class="text-bold fill-N1 s1"><tspan x="850.5" dy="0">검문 장치가 망가지면</tspan><tspan x="850.5" dy="17.667">손상을 안은 채로 계속 분열한다</tspan><tspan x="850.5" dy="17.667">= 암으로 가는 첫 걸음</tspan></text></g><g ><g class="shape"><path d="M696 1647h307v66H696z" class="stroke-B1 fill-B5 s0"/></g><text x="849.5" y="1685.5" class="text-bold fill-N1 s1">손상을 고치고 다시 도전</text></g><g ><g class="shape"><path d="M696 1733h307v82H696z" class="stroke-B1 fill-B5 s0"/></g><text x="849.5" y="1771.5" class="text-bold fill-N1 s1"><tspan x="849.5" dy="0">G0 로 빠져 대기하거나</tspan><tspan x="849.5" dy="18.5">영구히 분열을 그만둔다 (노화)</tspan></text></g><g ><g class="shape"><path d="M696 1835h307v66H696z" class="stroke-B1 fill-B5 s0"/></g><text x="849.5" y="1873.5" class="text-bold fill-N1 s1">고칠 수 없으면 세포자멸사</text></g><marker id="mk-d2-2369339836-3488378134" markerHe