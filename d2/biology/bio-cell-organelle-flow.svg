<svg xmlns="http://www.w3.org/2000/svg" width="5350" height="552" class="d2-1494403385 d2-svg" viewBox="-101 -101 5350 552"><rect width="5350" height="552" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1494403385 .fill-N1{fill:#0a0f25}.d2-1494403385 .fill-N2{fill:#676c7e}.d2-1494403385 .fill-B6{fill:#f7f8fe}.d2-1494403385 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 21h309v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="154.5" y="59.5" class="text-bold fill-N1 s1"><tspan x="154.5" dy="0">핵</tspan><tspan x="154.5" dy="18.5">DNA 를 보관하고 지시를 만든다</tspan></text></g><g ><g class="shape"><path d="M938 124h-6L630 63c-3-1-3-2 0-2L932 0c3-1 8-1 11 0l302 60c3 1 3 2 0 2l-301 62z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="938" y="59.5" class="text-bold fill-N1 s1"><tspan x="938" dy="0">핵공</tspan><tspan x="938" dy="18.5">크기와 표지를 보고 골라 내보낸다</tspan></text></g><g ><g class="shape"><path d="M1642 21h316v82h-316z" class="stroke-B1 fill-B6 s0"/></g><text x="1800" y="59.5" class="text-bold fill-N1 s1"><tspan x="1800" dy="0">리보솜</tspan><tspan x="1800" dy="18.5">지시를 읽어 아미노산을 잇는다</tspan></text></g><g ><g class="shape"><path d="M2603 6h255v82h-255z" class="stroke-B1 fill-B6 s0"/></g><text x="2730.5" y="44.5" class="text-bold fill-N1 s1"><tspan x="2730.5" dy="0">세포질에 떠 있는 리보솜</tspan><tspan x="2730.5" dy="18.5">→ 세포질에서 쓸 단백질</tspan></text></g><g ><g class="shape"><path d="M2556 163h348v98h-348z" class="stroke-B1 fill-B6 s0"/></g><text x="2730" y="201.5" class="text-bold fill-N1 s1"><tspan x="2730" dy="0">조면소포체</tspan><tspan x="2730" dy="17.667">리보솜이 붙어 있다</tspan><tspan x="2730" dy="17.667">접힘과 품질 검사, 당사슬 부착 시작</tspan></text></g><g ><g class="shape"><path d="M3384 171h296v82h-296z" class="stroke-B1 fill-B6 s0"/></g><text x="3532" y="209.5" class="text-bold fill-N1 s1"><tspan x="3532" dy="0">골지체</tspan><tspan x="3532" dy="18.5">다듬고 주소를 붙여 분류한다</tspan></text></g><g ><g class="shape"><path d="M4873 14h214v98h-214z" class="stroke-B1 fill-B6 s0"/></g><text x="4980" y="52.5" class="text-bold fill-N1 s1"><tspan x="4980" dy="0">리소좀</tspan><tspan x="4980" dy="17.667">안이 산성(pH 4.5~5.0)</tspan><tspan x="4980" dy="17.667">낡은 것을 분해한다</tspan></text></g><g ><g class="shape"><path d="M4812 216h336v82h-336z" class="stroke-B1 fill-B6 s0"/></g><text x="4980" y="254.5" class="text-bold fill-N1 s1"><tspan x="4980" dy="0">세포막으로</tspan><tspan x="4980" dy="18.5">수용체와 수송체가 자리를 잡는다</tspan></text></g><g ><g class="shape"><path d="M4009 252h252v98h-252z" class="stroke-B1 fill-B6 s0"/></g><text x="4135" y="290.5" class="text-bold fill-N1 s1"><tspan x="4135" dy="0">세포외배출</tspan><tspan x="4135" dy="17.667">소포가 세포막과 융합해</tspan><tspan x="4135" dy="17.667">내용물을 밖으로 쏟는다</tspan></text></g><g ><g class="shape"><path d="M3999 74h272v98h-272z" class="stroke-B1 fill-B6 s0"/></g><text x="4135" y="112.5" class="text-bold fill-N1 s1"><tspan x="4135" dy="0">세포내섭취</tspan><tspan x="4135" dy="17.667">세포막이 안으로 오목해져</tspan><tspan x="4135" dy="17.667">밖의 것을 싸서 들여온다</tspan></text></g><g ><g class="shape"><path d="M1666 189h268v98h-268z" class="stroke-B1 fill-B6 s0"/></g><text x="1800" y="227.5" class="text-bold fill-N1 s1"><tspan x="1800" dy="0">활면소포체</tspan><tspan x="1800" dy="17.667">지질 합성, 해독, 칼슘 저장</tspan><tspan x="1800" dy="17.667">리보솜이 없다</tspan></text></g><marker id="mk-d2-1494403385-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M310.5 62H624" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M1247 62h391" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><text x="1443.5" y="68" class="text-italic fill-N2 s1">지시(RNA)</text><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M1959.999 56.683C2197.2 48.75 2326.1 46.75 2598.5 46.75" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><text x="2280.5" y="53" class="text-italic fill-N2 s1">표지가 없으면</text><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M1959.95 98.694c237.25 53.956 356.85 73.356 592.069 96.17" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><text x="2254.5" y="167" class="text-italic fill-N2 s1">표지가 있으면 소포체로 끌려간다</text><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M2906 212h474" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><text x="3144.5" y="218" class="text-italic fill-N2 s1">소포에 담아 보낸다</text><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M3604.228 169.744C3792.1 60.349 3898.6 32.75 3987.25 32.75s620.65 4.6 882.26 22.724" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M3681.5 212h305.75c88.65 0 608.45 5.4 821.27 26.603" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M3675.421 253.556C3806.3 291.4 3873.5 301 4005.5 301" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M4272.495 112.61C4487.3 97.55 4607.9 89.15 4869.51 71.026" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><text x="4572" y="97" class="text-italic fill-N2 s1">삼킨 것을 분해로 보낸다</text><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M4272.495 133.39c214.805 15.06 323.205 31.66 536.112 81.94" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><text x="4544" y="163" class="text-italic fill-N2 s1">막과 수용체는 되돌려 쓴다</text><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M4262.5 301c222.8 0 333.2-5.4 546.02-26.603" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><text x="4537.5" y="296" class="text-italic fill-N2 s1"><tspan x="4537.5" dy="0">쏟고 남은 소포막이</tspan><tspan x="4537.5" dy="18.5">세포막에 더해진다</tspan></text><path fill="none" marker-end="url(#mk-d2-1494403385-3488378134)" d="M1936 237.75c256.4 0 380.8-3.2 616.006-15.786" class="connection stroke-B1 s0" mask="url(#d2-1494403385)"/><text x="2245.5" y="242" class="text-italic fill-N2 s1">같은 막이 이어져 있다</text><mask id="d2-1494403385" width="5350" height="552" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h5350v552H-101z"/><path d="M1404 52h79v21h-79zM2219 37h123v21h-123zM2113 151h283v21h-283zM3062 202h165v21h-165zM4469 81h206v21h-206zM4431 147h226v21h-226zM4455 280h165v37h-165zM2152 226h187v21h-187z"/></mask></svg>