<svg xmlns="http://www.w3.org/2000/svg" width="1161" height="1582" class="d2-3210550100 d2-svg" viewBox="-101 -101 1161 1582"><rect width="1161" height="1582" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3210550100 .text-bold{font-weight:700}.d2-3210550100 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3210550100 .fill-N1{fill:#0a0f25}.d2-3210550100 .fill-N2{fill:#676c7e}.d2-3210550100 .fill-B6{fill:#f7f8fe}.d2-3210550100 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M156 0h309v82H156z" class="stroke-B1 fill-B6 s0"/></g><text x="310.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="310.5" dy="0">핵</tspan><tspan x="310.5" dy="18.5">DNA 를 보관하고 지시를 만든다</tspan></text></g><g ><g class="shape"><path d="M310 306h-6L2 245c-3-1-3-2 0-2l302-61c3-1 8-1 11 0l302 60c3 1 3 2 0 2l-301 62z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="310" y="241.5" class="text-bold fill-N1 s1"><tspan x="310" dy="0">핵공</tspan><tspan x="310" dy="18.5">크기와 표지를 보고 골라 내보낸다</tspan></text></g><g ><g class="shape"><path d="M152 435h316v82H152z" class="stroke-B1 fill-B6 s0"/></g><text x="310" y="473.5" class="text-bold fill-N1 s1"><tspan x="310" dy="0">리보솜</tspan><tspan x="310" dy="18.5">지시를 읽어 아미노산을 잇는다</tspan></text></g><g ><g class="shape"><path d="M67 654h255v82H67z" class="stroke-B1 fill-B6 s0"/></g><text x="194.5" y="692.5" class="text-bold fill-N1 s1"><tspan x="194.5" dy="0">세포질에 떠 있는 리보솜</tspan><tspan x="194.5" dy="18.5">→ 세포질에서 쓸 단백질</tspan></text></g><g ><g class="shape"><path d="M493 646h348v98H493z" class="stroke-B1 fill-B6 s0"/></g><text x="667" y="684.5" class="text-bold fill-N1 s1"><tspan x="667" dy="0">조면소포체</tspan><tspan x="667" dy="17.667">리보솜이 붙어 있다</tspan><tspan x="667" dy="17.667">접힘과 품질 검사, 당사슬 부착 시작</tspan></text></g><g ><g class="shape"><path d="M519 865h296v82H519z" class="stroke-B1 fill-B6 s0"/></g><text x="667" y="903.5" class="text-bold fill-N1 s1"><tspan x="667" dy="0">골지체</tspan><tspan x="667" dy="18.5">다듬고 주소를 붙여 분류한다</tspan></text></g><g ><g class="shape"><path d="M147 1282h214v98H147z" class="stroke-B1 fill-B6 s0"/></g><text x="254" y="1320.5" class="text-bold fill-N1 s1"><tspan x="254" dy="0">리소좀</tspan><tspan x="254" dy="17.667">안이 산성(pH 4.5~5.0)</tspan><tspan x="254" dy="17.667">낡은 것을 분해한다</tspan></text></g><g ><g class="shape"><path d="M577 1290h336v82H577z" class="stroke-B1 fill-B6 s0"/></g><text x="745" y="1328.5" class="text-bold fill-N1 s1"><tspan x="745" dy="0">세포막으로</tspan><tspan x="745" dy="18.5">수용체와 수송체가 자리를 잡는다</tspan></text></g><g ><g class="shape"><path d="M707 1047h252v98H707z" class="stroke-B1 fill-B6 s0"/></g><text x="833" y="1085.5" class="text-bold fill-N1 s1"><tspan x="833" dy="0">세포외배출</tspan><tspan x="833" dy="17.667">소포가 세포막과 융합해</tspan><tspan x="833" dy="17.667">내용물을 밖으로 쏟는다</tspan></text></g><g ><g class="shape"><path d="M350 1047h272v98H350z" class="stroke-B1 fill-B6 s0"/></g><text x="486" y="1085.5" class="text-bold fill-N1 s1"><tspan x="486" dy="0">세포내섭취</tspan><tspan x="486" dy="17.667">세포막이 안으로 오목해져</tspan><tspan x="486" dy="17.667">밖의 것을 싸서 들여온다</tspan></text></g><g ><g class="shape"><path d="M653 427h268v98H653z" class="stroke-B1 fill-B6 s0"/></g><text x="787" y="465.5" class="text-bold fill-N1 s1"><tspan x="787" dy="0">활면소포체</tspan><tspan x="787" dy="17.667">지질 합성, 해독, 칼슘 저장</tspan><tspan x="787" dy="17.667">리보솜이 없다</tspan></text></g><marker id="mk-d2-3210550100-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M310 84v93" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M310 308v123.5" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><text x="310.5" y="376" class="text-italic fill-N2 s1">지시(RNA)</text><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M265.306 517.884C209.15 571.7 194.75 599.3 194.75 650.5" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><text x="207.5" y="580" class="text-italic fill-N2 s1">표지가 없으면</text><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M377.69 517.57C463.2 571.7 504.8 597.7 580.595 644.402" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><text x="479.5" y="588" class="text-italic fill-N2 s1">표지가 있으면 소포체로 끌려간다</text><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M666.75 745.5v116" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><text x="666.5" y="810" class="text-italic fill-N2 s1">소포에 담아 보낸다</text><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M516.778 931.556C209.95 983.844 132.75 1016.8 132.75 1046.5s14 180.8 67.151 233.192" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M666.75 949v97.5c0 29.7 10.2 182.4 48.791 240.665" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M743.503 947.963C814.55 987 832.75 1007 832.75 1043" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M398.52 1145.503c-93.47 54.197-120.47 81.797-132.366 133.1" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><text x="311" y="1201" class="text-italic fill-N2 s1">삼킨 것을 분해로 보낸다</text><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M497.702 1146.448c12.348 53.252 45.548 82.452 161.99 142.225" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><text x="558" y="1242" class="text-italic fill-N2 s1">막과 수용체는 되돌려 쓴다</text><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M832.75 1146.5c0 53.2-11.4 82.4-54.62 140.785" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><text x="823.5" y="1222" class="text-italic fill-N2 s1"><tspan x="823.5" dy="0">쏟고 남은 소포막이</tspan><tspan x="823.5" dy="18.5">세포막에 더해진다</tspan></text><path fill="none" marker-end="url(#mk-d2-3210550100-3488378134)" d="M786.5 526.5c0 46.8-13 71.2-62.083 117.263" class="connection stroke-B1 s0" mask="url(#d2-3210550100)"/><text x="774.5" y="601" class="text-italic fill-N2 s1">같은 막이 이어져 있다</text><mask id="d2-3210550100" width="1161" height="1582" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1161v1582H-101z"/><path d="M271 360h79v21h-79zM146 564h123v21H146zM338 572h283v21H338zM584 794h165v21H584zM208 1185h206v21H208zM445 1226h226v21H445zM741 1206h165v37H741zM681 585h187v21H681z"/></mask></svg>