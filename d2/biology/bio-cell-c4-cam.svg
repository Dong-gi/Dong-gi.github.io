<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="1723" class="d2-2385754293 d2-svg" viewBox="-91 -101 1096 1723"><rect width="1096" height="1723" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2385754293 .fill-N1{fill:#0a0f25}.d2-2385754293 .fill-B4{fill:#e3e9fd}.d2-2385754293 .fill-B5{fill:#edf0fd}.d2-2385754293 .fill-B6{fill:#f7f8fe}.d2-2385754293 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M207 0h493v114H207z" class="stroke-B1 fill-B6 s0"/></g><text x="453.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="453.5" dy="0">같은 문제</tspan><tspan x="453.5" dy="17.25">루비스코는 CO2 대신 O2 를 붙이기도 한다</tspan><tspan x="453.5" dy="17.25">더울수록, 기공을 닫을수록 심해진다</tspan><tspan x="453.5" dy="17.25">해법은 하나다 — 루비스코 앞의 CO2 를 진하게 만든다</tspan></text></g><g ><g class="shape"><path d="M10 234h419v839H10z" class="stroke-B1 fill-B4 s0"/></g><text x="219.5" y="221" class="fill-N1 s2">C4 — 공간으로 나눈다</text></g><g ><g class="shape"><path d="M469 498h435v575H469z" class="stroke-B1 fill-B4 s0"/></g><text x="686.5" y="485" class="fill-N1 s2">CAM — 시간으로 나눈다</text></g><g ><g class="shape"><path d="M310 1193h287v114H310z" class="stroke-B1 fill-B6 s0"/></g><text x="453.5" y="1231.5" class="text-bold fill-N1 s1"><tspan x="453.5" dy="0">치르는 값</tspan><tspan x="453.5" dy="17.25">CO2 하나당 ATP 2개가 더 든다</tspan><tspan x="453.5" dy="17.25">(PEP 를 되만드는 데 쓴다)</tspan><tspan x="453.5" dy="17.25">C3 는 3, C4 는 5</tspan></text></g><g ><g class="shape"><path d="M206 1407h495v114H206z" class="stroke-B1 fill-B6 s0"/></g><text x="453.5" y="1445.5" class="text-bold fill-N1 s1"><tspan x="453.5" dy="0">그래서 갈린다</tspan><tspan x="453.5" dy="17.25">서늘하고 물이 넉넉하면 추가 비용이 손해다 → C3</tspan><tspan x="453.5" dy="17.25">덥고 볕이 세면 광호흡 손실이 더 크다 → C4</tspan><tspan x="453.5" dy="17.25">물이 극단적으로 모자라면 기공을 낮에 못 연다 → CAM</tspan></text></g><g ><g class="shape"><path d="M52 264h335v114H52z" class="stroke-B1 fill-B5 s0"/></g><text x="219.5" y="302.5" class="text-bold fill-N1 s1"><tspan x="219.5" dy="0">엽육세포 (잎의 바깥쪽)</tspan><tspan x="219.5" dy="17.25">PEP 카복실화효소가 CO2 를 잡는다</tspan><tspan x="219.5" dy="17.25">이 효소는 O2 와 반응하지 않고</tspan><tspan x="219.5" dy="17.25">낮은 농도에서도 잘 잡는다</tspan></text></g><g ><g class="shape"><path d="M40 544h359v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="219.5" y="582.5" class="text-bold fill-N1 s1"><tspan x="219.5" dy="0">탄소 4개짜리 산(말산 등)으로 만들어</tspan><tspan x="219.5" dy="18.5">안쪽 세포로 보낸다</tspan></text></g><g ><g class="shape"><path d="M64 763h311v98H64z" class="stroke-B1 fill-B5 s0"/></g><text x="219.5" y="801.5" class="text-bold fill-N1 s1"><tspan x="219.5" dy="0">관다발집세포 (잎의 안쪽)</tspan><tspan x="219.5" dy="17.667">여기서 CO2 를 다시 떼어 놓는다</tspan><tspan x="219.5" dy="17.667">→ 국소 CO2 농도가 크게 오른다</tspan></text></g><g ><g class="shape"><path d="M62 961h316v82H62z" class="stroke-B1 fill-B5 s0"/></g><text x="220" y="999.5" class="text-bold fill-N1 s1"><tspan x="220" dy="0">루비스코가 캘빈 회로를 돌린다</tspan><tspan x="220" dy="18.5">산소화가 거의 일어나지 않는다</tspan></text></g><g ><g class="shape"><path d="M499 528h375v114H499z" class="stroke-B1 fill-B5 s0"/></g><text x="686.5" y="566.5" class="text-bold fill-N1 s1"><tspan x="686.5" dy="0">밤</tspan><tspan x="686.5" dy="17.25">기공을 연다 (서늘해서 물을 덜 잃는다)</tspan><tspan x="686.5" dy="17.25">PEP 카복실화효소가 CO2 를 잡아</tspan><tspan x="686.5" dy="17.25">탄소 4개짜리 산으로 액포에 저장한다</tspan></text></g><g ><g class="shape"><path d="M510 763h354v98H510z" class="stroke-B1 fill-B5 s0"/></g><text x="687" y="801.5" class="text-bold fill-N1 s1"><tspan x="687" dy="0">낮</tspan><tspan x="687" dy="17.667">기공을 닫는다 (물을 지킨다)</tspan><tspan x="687" dy="17.667">저장해 둔 산에서 CO2 를 떼어 놓는다</tspan></text></g><g ><g class="shape"><path d="M521 961h331v82H521z" class="stroke-B1 fill-B5 s0"/></g><text x="686.5" y="999.5" class="text-bold fill-N1 s1"><tspan x="686.5" dy="0">닫힌 잎 안에서 CO2 농도가 오르고</tspan><tspan x="686.5" dy="18.5">루비스코가 캘빈 회로를 돌린다</tspan></text></g><marker id="mk-d2-2385754293-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2385754293-3488378134)" d="M219.5 380v160" class="connection stroke-B1 s0" mask="url(#d2-2385754293)"/><path fill="none" marker-end="url(#mk-d2-2385754293-3488378134)" d="M219.5 627.5v132" class="connection stroke-B1 s0" mask="url(#d2-2385754293)"/><path fill="none" marker-end="url(#mk-d2-2385754293-3488378134)" d="M219.5 863v94" class="connection stroke-B1 s0" mask="url(#d2-2385754293)"/><path fill="none" marker-end="url(#mk-d2-2385754293-3488378134)" d="M686.5 643.5v116" class="connection stroke-B1 s0" mask="url(#d2-2385754293)"/><text x="686.5" y="708" style="fill:#676c7e;text-anchor:middle;font-size:16px">하루가 지난다</text><path fill="none" marker-end="url(#mk-d2-2385754293-3488378134)" d="M686.5 863v94" class="connection stroke-B1 s0" mask="url(#d2-2385754293)"/><path fill="none" marker-end="url(#mk-d2-2385754293-3488378134)" d="M326.682 114.834C241.3 154 219.5 169.8 219.5 189" class="connection stroke-B1 s0" mask="url(#d2-2385754293)"/><path fill="none" marker-end="url(#mk-d2-2385754293-3488378134)" d="M579.318 114.834C664.7 154 686.5 174 686.5 189v264" class="connection stroke-B1 s0" mask="url(#d2-2385754293)"/><path fill="none" marker-end="url(#mk-d2-2385754293-3488378134)" d="M219.5 1075c0 54 21.8 78 105.364 116.332" class="connection stroke-B1 s0" mask="url(#d2-2385754293)"/><path fill="none" marker-end="url(#mk-d2-2385754293-3488378134)" d="M686.5 1075c0 54-21.8 78-105.364 116.332" class="connection stroke-B1 s0" mask="url(#d2-2385754293)"/><path fill="none" marker-end="url(#mk-d2-2385754293-3488378134)" d="M453 1309v94" class="connection stroke-B1 s0" mask="url(#d2-2385754293)"/><mask id="d2-2385754293" width="1096" height="1723" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1096v1723H-91z"/><path d="M625 692h123v21H625z"/></mask></svg>