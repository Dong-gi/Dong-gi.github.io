<svg xmlns="http://www.w3.org/2000/svg" width="729" height="1702" class="d2-762610396 d2-svg" viewBox="-101 -101 729 1702"><rect width="729" height="1702" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-762610396 .fill-N1{fill:#0a0f25}.d2-762610396 .fill-B6{fill:#f7f8fe}.d2-762610396 .stroke-B1,.d2-762610396 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}.s4{opacity:.6}</style><g ><g class="shape"><path d="M15 0h350v98H15z" class="stroke-B1 fill-B6 s0"/></g><text x="190" y="38.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">① 크로마틴 접근성</tspan><tspan x="190" dy="17.667">그 서열에 단백질이 닿을 수 있는가</tspan><tspan x="190" dy="17.667">(히스톤 수정, 리모델러, DNA 메틸화)</tspan></text></g><g ><g class="shape"><path d="M104 198h423v98H104z" class="stroke-B1 fill-B6 s0"/></g><text x="315.5" y="236.5" class="text-bold fill-N1 s1"><tspan x="315.5" dy="0">② 전사 개시</tspan><tspan x="315.5" dy="17.667">중합효소가 앉아 시작하는가</tspan><tspan x="315.5" dy="17.667">(전사인자, 인핸서, 오페론의 억압자·활성자)</tspan></text></g><g ><g class="shape"><path d="M155 396h321v98H155z" class="stroke-B1 fill-B6 s0"/></g><text x="315.5" y="434.5" class="text-bold fill-N1 s1"><tspan x="315.5" dy="0">③ 전사 신장과 종결</tspan><tspan x="315.5" dy="17.667">끝까지 가는가, 도중에 끊기는가</tspan><tspan x="315.5" dy="17.667">(감쇠)</tspan></text></g><g ><g class="shape"><path d="M188 594h255v98H188z" class="stroke-B1 fill-B6 s0"/></g><text x="315.5" y="632.5" class="text-bold fill-N1 s1"><tspan x="315.5" dy="0">④ RNA 가공</tspan><tspan x="315.5" dy="17.667">어떤 엑손을 남길 것인가</tspan><tspan x="315.5" dy="17.667">(대체 스플라이싱)</tspan></text></g><g ><g class="shape"><path d="M122 792h388v98H122z" class="stroke-B1 fill-B6 s0"/></g><text x="316" y="830.5" class="text-bold fill-N1 s1"><tspan x="316" dy="0">⑤ 수출과 안정성</tspan><tspan x="316" dy="17.667">핵 밖으로 나가는가, 얼마나 오래 남는가</tspan><tspan x="316" dy="17.667">(miRNA, 분해 신호)</tspan></text></g><g ><g class="shape"><path d="M222 990h188v98H222z" class="stroke-B1 fill-B6 s0"/></g><text x="316" y="1028.5" class="text-bold fill-N1 s1"><tspan x="316" dy="0">⑥ 번역 개시</tspan><tspan x="316" dy="17.667">리보솜이 붙는가</tspan><tspan x="316" dy="17.667">(번역 억제 인자)</tspan></text></g><g ><g class="shape"><path d="M199 1188h233v98H199z" class="stroke-B1 fill-B6 s0"/></g><text x="315.5" y="1226.5" class="text-bold fill-N1 s1"><tspan x="315.5" dy="0">⑦ 번역 후</tspan><tspan x="315.5" dy="17.667">켜고 끄고 버린다</tspan><tspan x="315.5" dy="17.667">(인산화, 국재화, 분해)</tspan></text></g><g ><g class="shape"><path d="M0 1386h380v114H0z" class="stroke-B2 fill-B6 s2"/></g><text x="190" y="1424.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">아래로 갈수록</tspan><tspan x="190" dy="17.25">이미 쓴 자원이 많다</tspan><tspan x="190" dy="17.25">= 막을 때의 손해가 크다</tspan><tspan x="190" dy="17.25">그래서 앞쪽에서 막는 편이 경제적이다</tspan></text></g><marker id="mk-d2-762610396-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-762610396-3488378134)" d="M253.326 99.231C302.95 138 315.75 158 315.75 194" class="connection stroke-B1 s0" mask="url(#d2-762610396)"/><path fill="none" marker-end="url(#mk-d2-762610396-3488378134)" d="M315.75 298v94" class="connection stroke-B1 s0" mask="url(#d2-762610396)"/><path fill="none" marker-end="url(#mk-d2-762610396-3488378134)" d="M315.75 496v94" class="connection stroke-B1 s0" mask="url(#d2-762610396)"/><path fill="none" marker-end="url(#mk-d2-762610396-3488378134)" d="M315.75 694v94" class="connection stroke-B1 s0" mask="url(#d2-762610396)"/><path fill="none" marker-end="url(#mk-d2-762610396-3488378134)" d="M315.75 892v94" class="connection stroke-B1 s0" mask="url(#d2-762610396)"/><path fill="none" marker-end="url(#mk-d2-76261039