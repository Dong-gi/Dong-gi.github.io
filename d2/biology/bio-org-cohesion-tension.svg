<svg xmlns="http://www.w3.org/2000/svg" width="841" height="1619" class="d2-247084636 d2-svg" viewBox="-91 -121 841 1619"><rect width="841" height="1619" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.d2-247084636 .text-bold{font-weight:700}.d2-247084636 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-247084636 .fill-N1{fill:#0a0f25}.d2-247084636 .fill-N2{fill:#676c7e}.d2-247084636 .fill-B4{fill:#e3e9fd}.d2-247084636 .fill-B5{fill:#edf0fd}.d2-247084636 .fill-B6{fill:#f7f8fe}.d2-247084636 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M178 20h356v174H178z" class="stroke-B1 fill-B4 s0"/></g><text x="356" y="7" class="fill-N1 s1">1. 잎에서 물이 증발한다</text></g><g ><g class="shape"><path d="M32 355h315v190H32z" class="stroke-B1 fill-B4 s0"/></g><text x="189.5" y="314" class="fill-N1 s1"><tspan x="189.5" dy="0">2. 물기둥이 그 당김을</tspan><tspan x="189.5" dy="32">아래로 전달한다</tspan></text></g><g ><g class="shape"><path d="M10 706h359v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="189.5" y="665" class="fill-N1 s1"><tspan x="189.5" dy="0">3. 뿌리에서 물이</tspan><tspan x="189.5" dy="32">딸려 올라온다</tspan></text></g><g ><g class="shape"><path d="M27 1025h326v190H27z" class="stroke-B1 fill-B4 s0"/></g><text x="190" y="984" class="fill-N1 s1"><tspan x="190" dy="0">4. 토양에서</tspan><tspan x="190" dy="32">뿌리로 들어온다</tspan></text></g><g ><g class="shape"><path d="M397 385h252v130H397z" class="stroke-B1 fill-B6 s0"/></g><text x="523" y="423.5" class="text-bold fill-N1 s2"><tspan x="523" dy="0">에너지는 어디서 오는가</tspan><tspan x="523" dy="17">물을 증발시키는 것은</tspan><tspan x="523" dy="17">태양이다</tspan><tspan x="523" dy="17">식물이 ATP 를 쓰는 곳은</tspan><tspan x="523" dy="17">이 사슬에 없다</tspan></text></g><g ><g class="shape"><path d="M125 1235h409v162H125z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="329.5" y="1273.5" class="text-bold fill-N1 s2"><tspan x="329.5" dy="0">이 설명이 옳다면 다음이 관찰되어야 한다</tspan><tspan x="329.5" dy="16.714">· 물기둥이 장력 상태이므로</tspan><tspan x="329.5" dy="16.714">낮에 줄기 지름이 미세하게 줄어든다</tspan><tspan x="329.5" dy="16.714">· 기둥이 끊기는 공동화가 실제로 일어나고</tspan><tspan x="329.5" dy="16.714">소리로 검출된다</tspan><tspan x="329.5" dy="16.714">· 잎을 제거하면 상승이 멈춘다</tspan><tspan x="329.5" dy="16.714">세 예측 모두 관찰로 확인되었다</tspan></text></g><g ><g class="shape"><path d="M208 50h296v114H208z" class="stroke-B1 fill-B5 s0"/></g><text x="356" y="88.5" class="text-bold fill-N1 s2"><tspan x="356" dy="0">세포벽의 미세 구멍에 있는</tspan><tspan x="356" dy="17.25">물 표면이 안으로 오목해진다</tspan><tspan x="356" dy="17.25">표면장력이 그 표면을 당긴다</tspan><tspan x="356" dy="17.25">→ 음압이 생긴다</tspan></text></g><g ><g class="shape"><path d="M62 385h255v130H62z" class="stroke-B1 fill-B5 s0"/></g><text x="189.5" y="423.5" class="text-bold fill-N1 s2"><tspan x="189.5" dy="0">물 분자끼리의 수소 결합</tspan><tspan x="189.5" dy="17">(응집력)이 강해</tspan><tspan x="189.5" dy="17">기둥이 끊기지 않는다</tspan><tspan x="189.5" dy="17">관벽과의 부착력이</tspan><tspan x="189.5" dy="17">기둥을 붙잡아 준다</tspan></text></g><g ><g class="shape"><path d="M40 736h299v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="189.5" y="774.5" class="text-bold fill-N1 s2"><tspan x="189.5" dy="0">물관은 죽어서 속이 빈 관이고</tspan><tspan x="189.5" dy="17.667">리그닌으로 보강되어 있어</tspan><tspan x="189.5" dy="17.667">음압에도 찌그러지지 않는다</tspan></text></g><g ><g class="shape"><path d="M57 1055h266v130H57z" class="stroke-B1 fill-B5 s0"/></g><text x="190" y="1093.5" class="text-bold fill-N1 s2"><tspan x="190" dy="0">내피의 카스파리대가</tspan><tspan x="190" dy="17">세포벽 경로를 막아</tspan><tspan x="190" dy="17">반드시 한 번은</tspan><tspan x="190" dy="17">세포막을 지나게 한다</tspan><tspan x="190" dy="17">→ 여기서 선택이 일어난다</tspan></text></g><marker id="mk-d2-247084636-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-247084636-3488378134)" d="M189.5 195.5v87" class="connection stroke-B1 s0" mask="url(#d2-247084636)"/><text x="189.5" y="246" class="text-italic fill-N2 s2">당김이 아래로 전해진다</text><path fill="none" marker-end="url(#mk-d2-247084636-3488378134)" d="M189.5 546.5v87" class="connection stroke-B1 s0" mask="url(#d2-247084636)"/><text x="189.5" y="597" class="text-italic fill-N2 s2">당김이 아래로 전해진다</text><path fill="none" marker-end="url(#mk-d2-247084636-3488378134)" d="M189.5 865.5v87" class="connection stroke-B1 s0" mask="url(#d2-247084636)"/><text x="189.5" y="916" class="text-italic fill-N2 s2">당김이 아래로 전해진다</text><path fill="none" marker-end="url(#mk-d2-247084636-3488378134)" d="M523 195.5V381" class="connection stroke-B1 s0" mask="url(#d2-247084636)"/><text x="523.5" y="295" class="text-italic fill-N2 s2">태양</text><mask id="d2-247084636" width="841" height="1619" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h841v1619H-91z"/><path d="M88 230h203v21H88zM88 581h203v21H88zM88 900h203v21H88zM502 279h43v21h-43z"/></mask></svg>