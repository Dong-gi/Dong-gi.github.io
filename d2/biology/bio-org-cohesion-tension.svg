<svg xmlns="http://www.w3.org/2000/svg" width="1771" height="1341" class="d2-3389266732 d2-svg" viewBox="-91 -105 1771 1341"><rect width="1771" height="1341" x="-91" y="-105" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3389266732 .fill-N1{fill:#0a0f25}.d2-3389266732 .fill-N2{fill:#676c7e}.d2-3389266732 .fill-B4{fill:#e3e9fd}.d2-3389266732 .fill-B5{fill:#edf0fd}.d2-3389266732 .fill-B6{fill:#f7f8fe}.d2-3389266732 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M318 36h498v158H318z" class="stroke-B1 fill-B4 s0"/></g><text x="567" y="23" class="fill-N1 s1">1. 잎에서 물이 증발한다</text></g><g ><g class="shape"><path d="M109 371h451v158H109z" class="stroke-B1 fill-B4 s0"/></g><text x="334.5" y="358" class="fill-N1 s1">2. 물기둥이 그 당김을 아래로 전달한다</text></g><g ><g class="shape"><path d="M39 690h591v142H39z" class="stroke-B1 fill-B4 s0"/></g><text x="334.5" y="677" class="fill-N1 s1">3. 뿌리에서 물이 딸려 올라온다</text></g><g ><g class="shape"><path d="M10 993h649v142H10z" class="stroke-B1 fill-B4 s0"/></g><text x="334.5" y="980" class="fill-N1 s1">4. 토양에서 뿌리로 들어온다</text></g><g ><g class="shape"><path d="M610 401h377v98H610z" class="stroke-B1 fill-B6 s0"/></g><text x="798.5" y="439.5" class="text-bold fill-N1 s2"><tspan x="798.5" dy="0">에너지는 어디서 오는가</tspan><tspan x="798.5" dy="17.667">물을 증발시키는 것은 태양이다</tspan><tspan x="798.5" dy="17.667">식물이 ATP 를 쓰는 곳은 이 사슬에 없다</tspan></text></g><g ><g class="shape"><path d="M978 50h601v130H978z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="1278.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="1278.5" dy="0">이 설명이 옳다면 다음이 관찰되어야 한다</tspan><tspan x="1278.5" dy="17">· 물기둥이 장력 상태이므로 낮에 줄기 지름이 미세하게 줄어든다</tspan><tspan x="1278.5" dy="17">· 기둥이 끊기는 공동화가 실제로 일어나고 소리로 검출된다</tspan><tspan x="1278.5" dy="17">· 잎을 제거하면 상승이 멈춘다</tspan><tspan x="1278.5" dy="17">세 예측 모두 관찰로 확인되었다</tspan></text></g><g ><g class="shape"><path d="M348 66h438v98H348z" class="stroke-B1 fill-B5 s0"/></g><text x="567" y="104.5" class="text-bold fill-N1 s2"><tspan x="567" dy="0">세포벽의 미세 구멍에 있는 물 표면이</tspan><tspan x="567" dy="17.667">안으로 오목해진다</tspan><tspan x="567" dy="17.667">표면장력이 그 표면을 당긴다 → 음압이 생긴다</tspan></text></g><g ><g class="shape"><path d="M139 401h391v98H139z" class="stroke-B1 fill-B5 s0"/></g><text x="334.5" y="439.5" class="text-bold fill-N1 s2"><tspan x="334.5" dy="0">물 분자끼리의 수소 결합(응집력)이 강해</tspan><tspan x="334.5" dy="17.667">기둥이 끊기지 않는다</tspan><tspan x="334.5" dy="17.667">관벽과의 부착력이 기둥을 붙잡아 준다</tspan></text></g><g ><g class="shape"><path d="M69 720h531v82H69z" class="stroke-B1 fill-B5 s0"/></g><text x="334.5" y="758.5" class="text-bold fill-N1 s2"><tspan x="334.5" dy="0">물관은 죽어서 속이 빈 관이고 리그닌으로 보강되어 있어</tspan><tspan x="334.5" dy="18.5">음압에도 찌그러지지 않는다</tspan></text></g><g ><g class="shape"><path d="M40 1023h589v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="334.5" y="1061.5" class="text-bold fill-N1 s2"><tspan x="334.5" dy="0">내피의 카스파리대가 세포벽 경로를 막아</tspan><tspan x="334.5" dy="18.5">반드시 한 번은 세포막을 지나게 한다 → 여기서 선택이 일어난다</tspan></text></g><marker id="mk-d2-3389266732-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3389266732-3488378134)" d="M334.5 195.5v131" class="connection stroke-B1 s0" mask="url(#d2-3389266732)"/><text x="335" y="268" class="text-italic fill-N2 s2">Ψ 가 낮은 쪽으로</text><path fill="none" marker-end="url(#mk-d2-3389266732-3488378134)" d="M334.5 530.5v115" class="connection stroke-B1 s0" mask="url(#d2-3389266732)"/><text x="335" y="595" class="text-italic fill-N2 s2">Ψ 가 낮은 쪽으로</text><path fill="none" marker-end="url(#mk-d2-3389266732-3488378134)" d="M334.5 833.5v115" class="connection stroke-B1 s0" mask="url(#d2-3389266732)"/><text x="335" y="898" class="text-italic fill-N2 s2">Ψ 가 낮은 쪽으로</text><path fill="none" marker-end="url(#mk-d2-3389266732-3488378134)" d="M798.5 195.5V397" class="connection stroke-B1 s0" mask="url(#d2-3389266732)"/><text x="798.5" y="303" class="text-italic fill-N2 s2">태양</text><mask id="d2-3389266732" width="1771" height="1341" x="-91" y="-105" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-105h1771v1341H-91z"/><path d="M265 252h140v21H265zM265 579h140v21H265zM265 882h140v21H265zM777 287h43v21h-43z"/></mask></svg>