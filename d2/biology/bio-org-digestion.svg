<svg xmlns="http://www.w3.org/2000/svg" width="1564" height="2106" class="d2-571059907 d2-svg" viewBox="-91 -105 1564 2106"><rect width="1564" height="2106" x="-91" y="-105" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-571059907 .fill-N1{fill:#0a0f25}.d2-571059907 .fill-B4{fill:#e3e9fd}.d2-571059907 .fill-B5{fill:#edf0fd}.d2-571059907 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M133 36h460v142H133z" class="stroke-B1 fill-B4 s0"/></g><text x="363" y="23" class="fill-N1 s1">입 — pH 6.5에서 7.5</text></g><g ><g class="shape"><path d="M57 334h611v340H57z" class="stroke-B1 fill-B4 s0"/></g><text x="362.5" y="321" class="fill-N1 s1">위 — pH 1.5에서 3.5</text></g><g ><g class="shape"><path d="M10 814h705v324H10z" class="stroke-B1 fill-B4 s0"/></g><text x="362.5" y="801" class="fill-N1 s1">십이지장 — pH 7에서 8</text></g><g ><g class="shape"><path d="M111 1278h504v324H111z" class="stroke-B1 fill-B4 s0"/></g><text x="363" y="1265" class="fill-N1 s1">소장 — 흡수</text></g><g ><g class="shape"><path d="M123 1742h480v158H123z" class="stroke-B1 fill-B4 s0"/></g><text x="363" y="1729" class="fill-N1 s1">대장 — pH 5에서 7</text></g><path d="M643 50h729v114H643z" class="shape" style="fill:#f7f8fe;stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><text x="1007.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="1007.5" dy="0">두 겹의 안전장치</tspan><tspan x="1007.5" dy="17.25">1. 지모젠 — 펩시노젠, 트립시노젠처럼 불활성 전구체로 분비해 목적지에서 켠다</tspan><tspan x="1007.5" dy="17.25">2. pH 구획 — 펩신은 소장 pH 에서, 트립신은 위 pH 에서 저절로 꺼진다</tspan><tspan x="1007.5" dy="17.25">이 장치가 깨져 이자 안에서 트립신이 일찍 켜지면 이자염이 생긴다</tspan></text><g ><g class="shape"><path d="M163 66h400v82H163z" class="stroke-B1 fill-B5 s0"/></g><text x="363" y="104.5" class="text-bold fill-N1 s2"><tspan x="363" dy="0">물리적 소화(저작)로 표면적을 늘린다</tspan><tspan x="363" dy="18.5">침 아밀레이스가 녹말을 자르기 시작한다</tspan></text></g><g ><g class="shape"><path d="M87 364h551v98H87z" class="stroke-B1 fill-B5 s0"/></g><text x="362.5" y="402.5" class="text-bold fill-N1 s2"><tspan x="362.5" dy="0">염산이 단백질을 변성시켜 펼친다</tspan><tspan x="362.5" dy="17.667">펩시노젠 → (산이 활성화) → 펩신 이 펩타이드 결합을 끊는다</tspan><tspan x="362.5" dy="17.667">강산성이 삼킨 미생물의 상당수를 죽인다</tspan></text></g><g ><g class="shape"><path d="M141 562h443v82H141z" class="stroke-B1 fill-B5 s0"/></g><text x="362.5" y="600.5" class="text-bold fill-N1 s2"><tspan x="362.5" dy="0">위가 하는 일은 &apos;자르기&apos;보다 &apos;펼치기&apos;에 가깝다</tspan><tspan x="362.5" dy="18.5">펼쳐 놓아야 뒤 효소가 결합에 접근할 수 있다</tspan></text></g><g ><g class="shape"><path d="M173 844h380v82H173z" class="stroke-B1 fill-B5 s0"/></g><text x="363" y="882.5" class="text-bold fill-N1 s2"><tspan x="363" dy="0">이자가 중탄산염을 내어 산을 중화한다</tspan><tspan x="363" dy="18.5">(하루 몇 g 규모)</tspan></text></g><g ><g class="shape"><path d="M40 1026h645v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="362.5" y="1064.5" class="text-bold fill-N1 s2"><tspan x="362.5" dy="0">이자 효소: 아밀레이스, 트립신, 키모트립신, 리페이스, 뉴클레이스</tspan><tspan x="362.5" dy="18.5">쓸개즙: 효소가 아니라 계면활성제. 지방을 잘게 쪼개 표면적을 늘린다</tspan></text></g><g ><g class="shape"><path d="M141 1308h444v82H141z" class="stroke-B1 fill-B5 s0"/></g><text x="363" y="1346.5" class="text-bold fill-N1 s2"><tspan x="363" dy="0">미세융모막의 효소가 마지막 한 단계를 자른다</tspan><tspan x="363" dy="18.5">이당류 분해효소, 펩티데이스</tspan></text></g><g ><g class="shape"><path d="M225 1490h276v82H225z" class="stroke-B1 fill-B5 s0"/></g><text x="363" y="1528.5" class="text-bold fill-N1 s2"><tspan x="363" dy="0">면적을 세 단계로 증폭한다</tspan><tspan x="363" dy="18.5">윤상주름 × 융모 × 미세융모</tspan></text></g><g ><g class="shape"><path d="M153 1772h420v98H153z" class="stroke-B1 fill-B5 s0"/></g><text x="363" y="1810.5" class="text-bold fill-N1 s2"><tspan x="363" dy="0">사람의 효소는 없다</tspan><tspan x="363" dy="17.667">장내 미생물이 난소화성 다당류를 발효한다</tspan><tspan x="363" dy="17.667">물과 이온을 회수한다</tspan></text></g><marker id="mk-d2-571059907-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-571059907-3488378134)" d="M362.5 464v94" class="connection stroke-B1 s0" mask="url(#d2-571059907)"/><path fill="none" marker-end="url(#mk-d2-571059907-3488378134)" d="M362.5 928v94" class="connection stroke-B1 s0" mask="url(#d2-571059907)"/><path fill="none" marker-end="url(#mk-d2-571059907-3488378134)" d="M362.5 1392v94" class="connection stroke-B1 s0" mask="url(#d2-571059907)"/><path fill="none" marker-end="url(#mk-d2-571059907-3488378134)" d="M362.5 180v109" class="connection stroke-B1 s0" mask="url(#d2-571059907)"/><path fill="none" marker-end="url(#mk-d2-571059907-3488378134)" d="M362.5 676v93" class="connection stroke-B1 s0" mask="url(#d2-571059907)"/><path fill="none" marker-end="url(#mk-d2-571059907-3488378134)" d="M362.5 1140v93" class="connection stroke-B1 s0" mask="url(#d2-571059907)"/><path fill="none" marker-end="url(#mk-d2-571059907-3488378134)" d="M362.5 1604v93" class="connection stroke-B1 s0" mask="url(#d2-571059907)"/><mask id="d2-571059907" width="1564" height="2106" x="-91" y="-105" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-105h1564v2106H-91z"/></mask></svg>