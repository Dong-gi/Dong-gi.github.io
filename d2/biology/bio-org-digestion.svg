<svg xmlns="http://www.w3.org/2000/svg" width="961" height="2314" class="d2-601839798 d2-svg" viewBox="-91 -73 961 2314"><rect width="961" height="2314" x="-91" y="-73" rx="0" style="fill:#fff"/><style>.d2-601839798 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-601839798 .fill-N1{fill:#0a0f25}.d2-601839798 .fill-B4{fill:#e3e9fd}.d2-601839798 .fill-B5{fill:#edf0fd}.d2-601839798 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M74 68h312v174H74z" class="stroke-B1 fill-B4 s0"/></g><text x="230" y="55" class="fill-N1 s1">입 — pH 6.5에서 7.5</text></g><g ><g class="shape"><path d="M31 430h399v404H31z" class="stroke-B1 fill-B4 s0"/></g><text x="230.5" y="417" class="fill-N1 s1">위 — pH 1.5에서 3.5</text></g><g ><g class="shape"><path d="M10 974h440v356H10z" class="stroke-B1 fill-B4 s0"/></g><text x="230" y="961" class="fill-N1 s1">십이지장 — pH 7에서 8</text></g><g ><g class="shape"><path d="M62 1470h336v356H62z" class="stroke-B1 fill-B4 s0"/></g><text x="230" y="1457" class="fill-N1 s1">소장 — 흡수</text></g><g ><g class="shape"><path d="M54 1966h353v174H54z" class="stroke-B1 fill-B4 s0"/></g><text x="230.5" y="1953" class="fill-N1 s1">대장 — pH 5에서 7</text></g><path d="M436 50h333v210H436z" class="shape" style="fill:#f7f8fe;stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><text x="602.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="602.5" dy="0">두 겹의 안전장치</tspan><tspan x="602.5" dy="16.5">1. 지모젠 — 펩시노젠,</tspan><tspan x="602.5" dy="16.5">트립시노젠처럼 불활성 전구체로</tspan><tspan x="602.5" dy="16.5">분비해 목적지에서 켠다</tspan><tspan x="602.5" dy="16.5">2. pH 구획 — 펩신은 소장 pH 에서,</tspan><tspan x="602.5" dy="16.5">트립신은 위 pH 에서</tspan><tspan x="602.5" dy="16.5">저절로 꺼진다</tspan><tspan x="602.5" dy="16.5">이 장치가 깨져 이자 안에서</tspan><tspan x="602.5" dy="16.5">트립신이 일찍 켜지면</tspan><tspan x="602.5" dy="16.5">이자염이 생긴다</tspan></text><g ><g class="shape"><path d="M104 98h252v114H104z" class="stroke-B1 fill-B5 s0"/></g><text x="230" y="136.5" class="text-bold fill-N1 s2"><tspan x="230" dy="0">물리적 소화(저작)로</tspan><tspan x="230" dy="17.25">표면적을 늘린다</tspan><tspan x="230" dy="17.25">침 아밀레이스가</tspan><tspan x="230" dy="17.25">녹말을 자르기 시작한다</tspan></text></g><g ><g class="shape"><path d="M61 460h339v130H61z" class="stroke-B1 fill-B5 s0"/></g><text x="230.5" y="498.5" class="text-bold fill-N1 s2"><tspan x="230.5" dy="0">염산이 단백질을 변성시켜 펼친다</tspan><tspan x="230.5" dy="17">펩시노젠 → (산이 활성화) → 펩신 이</tspan><tspan x="230.5" dy="17">펩타이드 결합을 끊는다</tspan><tspan x="230.5" dy="17">강산성이 삼킨 미생물의</tspan><tspan x="230.5" dy="17">상당수를 죽인다</tspan></text></g><g ><g class="shape"><path d="M88 690h285v114H88z" class="stroke-B1 fill-B5 s0"/></g><text x="230.5" y="728.5" class="text-bold fill-N1 s2"><tspan x="230.5" dy="0">위가 하는 일은 &apos;자르기&apos;보다</tspan><tspan x="230.5" dy="17.25">&apos;펼치기&apos;에 가깝다</tspan><tspan x="230.5" dy="17.25">펼쳐 놓아야 뒤 효소가</tspan><tspan x="230.5" dy="17.25">결합에 접근할 수 있다</tspan></text></g><g ><g class="shape"><path d="M40 1004h380v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="230" y="1042.5" class="text-bold fill-N1 s2"><tspan x="230" dy="0">이자가 중탄산염을 내어 산을 중화한다</tspan><tspan x="230" dy="18.5">(하루 몇 g 규모)</tspan></text></g><g ><g class="shape"><path d="M57 1186h346v114H57z" class="stroke-B1 fill-B5 s0"/></g><text x="230" y="1224.5" class="text-bold fill-N1 s2"><tspan x="230" dy="0">이자 효소: 아밀레이스, 트립신,</tspan><tspan x="230" dy="17.25">키모트립신, 리페이스, 뉴클레이스</tspan><tspan x="230" dy="17.25">쓸개즙: 효소가 아니라 계면활성제.</tspan><tspan x="230" dy="17.25">지방을 잘게 쪼개 표면적을 늘린다</tspan></text></g><g ><g class="shape"><path d="M103 1500h255v114H103z" class="stroke-B1 fill-B5 s0"/></g><text x="230.5" y="1538.5" class="text-bold fill-N1 s2"><tspan x="230.5" dy="0">미세융모막의 효소가</tspan><tspan x="230.5" dy="17.25">마지막 한 단계를 자른다</tspan><tspan x="230.5" dy="17.25">이당류 분해효소,</tspan><tspan x="230.5" dy="17.25">펩티데이스</tspan></text></g><g ><g class="shape"><path d="M92 1714h276v82H92z" class="stroke-B1 fill-B5 s0"/></g><text x="230" y="1752.5" class="text-bold fill-N1 s2"><tspan x="230" dy="0">면적을 세 단계로 증폭한다</tspan><tspan x="230" dy="18.5">윤상주름 × 융모 × 미세융모</tspan></text></g><g ><g class="shape"><path d="M84 1996h293v114H84z" class="stroke-B1 fill-B5 s0"/></g><text x="230.5" y="2034.5" class="text-bold fill-N1 s2"><tspan x="230.5" dy="0">사람의 효소는 없다</tspan><tspan x="230.5" dy="17.25">장내 미생물이</tspan><tspan x="230.5" dy="17.25">난소화성 다당류를 발효한다</tspan><tspan x="230.5" dy="17.25">물과 이온을 회수한다</tspan></text></g><marker id="mk-d2-601839798-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-601839798-3488378134)" d="M230 592v94" class="connection stroke-B1 s0" mask="url(#d2-601839798)"/><path fill="none" marker-end="url(#mk-d2-601839798-3488378134)" d="M230 1088v94" class="connection stroke-B1 s0" mask="url(#d2-601839798)"/><path fill="none" marker-end="url(#mk-d2-601839798-3488378134)" d="M230 1616v94" class="connection stroke-B1 s0" mask="url(#d2-601839798)"/><path fill="none" marker-end="url(#mk-d2-601839798-3488378134)" d="M230 244v141" class="connection stroke-B1 s0" mask="url(#d2-601839798)"/><path fill="none" marker-end="url(#mk-d2-601839798-3488378134)" d="M230 836v93" class="connection stroke-B1 s0" mask="url(#d2-601839798)"/><path fill="none" marker-end="url(#mk-d2-601839798-3488378134)" d="M230 1332v93" class="connection stroke-B1 s0" mask="url(#d2-601839798)"/><path fill="none" marker-end="url(#mk-d2-601839798-3488378134)" d="M230 1828v93" class="connection stroke-B1 s0" mask="url(#d2-601839798)"/><mask id="d2-601839798" width="961" height="2314" x="-91" y="-73" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-73h961v2314H-91z"/></mask></svg>