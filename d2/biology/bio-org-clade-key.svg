<svg xmlns="http://www.w3.org/2000/svg" width="1155" height="1523" class="d2-3004946265 d2-svg" viewBox="-89 -89 1155 1523"><rect width="1155" height="1523" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3004946265 .text-bold{font-weight:700}.d2-3004946265 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3004946265 .fill-N1{fill:#0a0f25}.d2-3004946265 .fill-N2{fill:#676c7e}.d2-3004946265 .fill-B4{fill:#e3e9fd}.d2-3004946265 .fill-B5{fill:#edf0fd}.d2-3004946265 .fill-B6{fill:#f7f8fe}.d2-3004946265 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M376 12h171v66H376z" class="stroke-B1 fill-B6 s0"/></g><text x="461.5" y="50.5" class="text-bold fill-N1 s1">처음 보는 생물</text></g><g ><g class="shape"><path d="M323 148h276v82H323z" class="stroke-B1 fill-B6 s0"/></g><text x="461" y="186.5" class="text-bold fill-N1 s1"><tspan x="461" dy="0">핵막으로 싸인 핵이 있는가</tspan><tspan x="461" dy="18.5">(배제력이 가장 크다)</tspan></text></g><g ><g class="shape"><path d="M91 401h255v82H91z" class="stroke-B1 fill-B6 s0"/></g><text x="218.5" y="439.5" class="text-bold fill-N1 s1"><tspan x="218.5" dy="0">없다 → 원핵생물</tspan><tspan x="218.5" dy="18.5">다음으로 막 지질을 본다</tspan></text></g><g ><g class="shape"><path d="M12 553h413v370H12z" class="stroke-B1 fill-B4 s0"/></g><text x="218.5" y="586" class="fill-N1 s2"><tspan x="218.5" dy="0">글리세롤에</tspan><tspan x="218.5" dy="32">무엇이 어떻게 붙었는가</tspan></text></g><g ><g class="shape"><path d="M525 401h360v82H525z" class="stroke-B1 fill-B6 s0"/></g><text x="705" y="439.5" class="text-bold fill-N1 s1"><tspan x="705" dy="0">있다 → 진핵생물</tspan><tspan x="705" dy="18.5">다음으로 세포벽과 영양 방식을 본다</tspan></text></g><g ><g class="shape"><path d="M445 553h520v646H445z" class="stroke-B1 fill-B4 s0"/></g><text x="705" y="586" class="fill-N1 s2"><tspan x="705" dy="0">세포벽이 있는가,</tspan><tspan x="705" dy="32">있다면 무엇으로 되어 있는가</tspan></text></g><g ><g class="shape"><path d="M121 1219h735v114H121z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="488.5" y="1257.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">형질에 가중치를 두어야 한다</tspan><tspan x="488.5" dy="17.25">강한 형질: 막 지질, 정보 처리 기구의 구조, 세포벽에서 검출된 성분</tspan><tspan x="488.5" dy="17.25">약한 형질: 영양 방식, 겉모양, 사는 곳 — 서로 다른 계통에서 독립적으로 같아진다</tspan><tspan x="488.5" dy="17.25">개수만 세면 수렴 형질에 끌려간다. 확정하려면 결국 서열이 필요하다</tspan></text></g><g ><g class="shape"><path d="M72 627h293v98H72z" class="stroke-B1 fill-B5 s0"/></g><text x="218.5" y="665.5" class="text-bold fill-N1 s1"><tspan x="218.5" dy="0">지방산이 에스터 결합</tspan><tspan x="218.5" dy="17.667">펩티도글리칸 세포벽</tspan><tspan x="218.5" dy="17.667">→ 세균</tspan></text></g><g ><g class="shape"><path d="M72 765h293v98H72z" class="stroke-B1 fill-B5 s0"/></g><text x="218.5" y="803.5" class="text-bold fill-N1 s1"><tspan x="218.5" dy="0">이소프레노이드가 에터 결합</tspan><tspan x="218.5" dy="17.667">펩티도글리칸이 없다</tspan><tspan x="218.5" dy="17.667">→ 고세균</tspan></text></g><g ><g class="shape"><path d="M505 627h400v98H505z" class="stroke-B1 fill-B5 s0"/></g><text x="705" y="665.5" class="text-bold fill-N1 s1"><tspan x="705" dy="0">셀룰로스 벽 + 엽록체</tspan><tspan x="705" dy="17.667">광합성으로 스스로 만든다</tspan><tspan x="705" dy="17.667">→ 식물 또는 조류</tspan></text></g><g ><g class="shape"><path d="M505 765h400v98H505z" class="stroke-B1 fill-B5 s0"/></g><text x="705" y="803.5" class="text-bold fill-N1 s1"><tspan x="705" dy="0">키틴 벽, 엽록체 없음</tspan><tspan x="705" dy="17.667">밖으로 효소를 내보내 녹여 흡수</tspan><tspan x="705" dy="17.667">→ 균류</tspan></text></g><g ><g class="shape"><path d="M505 903h400v98H505z" class="stroke-B1 fill-B5 s0"/></g><text x="705" y="941.5" class="text-bold fill-N1 s1"><tspan x="705" dy="0">세포벽 없음, 엽록체 없음</tspan><tspan x="705" dy="17.667">삼켜서 안에서 소화</tspan><tspan x="705" dy="17.667">→ 동물</tspan></text></g><g ><g class="shape"><path d="M505 1041h400v98H505z" class="stroke-B1 fill-B5 s0"/></g><text x="705" y="1079.5" class="text-bold fill-N1 s1"><tspan x="705" dy="0">위 어디에도 깔끔히 안 맞는다</tspan><tspan x="705" dy="17.667">→ 이른바 원생생물</tspan><tspan x="705" dy="17.667">계통군이 아니라 나머지를 모은 이름이다</tspan></text></g><marker id="mk-d2-3004946265-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3004946265-3488378134)" d="M461.75 80v64" class="connection stroke-B1 s0" mask="url(#d2-3004946265)"/><path fill="none" marker-end="url(#mk-d2-3004946265-3488378134)" d="M415.75 232v28s0 10-10 10H228.5s-10 0-10 10v117" class="connection stroke-B1 s0" mask="url(#d2-3004946265)"/><text x="271.5" y="276" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-3004946265-3488378134)" d="M507.75 232v28s0 10 10 10H695s10 0 10 10v117" class="connection stroke-B1 s0" mask="url(#d2-3004946265)"/><text x="651.5" y="276" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-3004946265-3488378134)" d="M218.5 485v64" class="connection stroke-B1 s0" mask="url(#d2-3004946265)"/><path fill="none" marker-end="url(#mk-d2-3004946265-3488378134)" d="M705 485v64" class="connection stroke-B1 s0" mask="url(#d2-3004946265)"/><mask id="d2-3004946265" width="1155" height="1523" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1155v1523H-89z"/><path d="M250 260h43v21h-43zM630 260h43v21h-43z"/></mask></svg>