<svg xmlns="http://www.w3.org/2000/svg" width="2378" height="979" class="d2-655132024 d2-svg" viewBox="-91 -101 2378 979"><rect width="2378" height="979" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-655132024 .fill-N1{fill:#0a0f25}.d2-655132024 .fill-N2{fill:#676c7e}.d2-655132024 .fill-B4{fill:#e3e9fd}.d2-655132024 .fill-B5{fill:#edf0fd}.d2-655132024 .fill-B6{fill:#f7f8fe}.d2-655132024 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M937 24h171v66H937z" class="stroke-B1 fill-B6 s0"/></g><text x="1022.5" y="62.5" class="text-bold fill-N1 s1">처음 보는 생물</text></g><g ><g class="shape"><path d="M884 214h276v82H884z" class="stroke-B1 fill-B6 s0"/></g><text x="1022" y="252.5" class="text-bold fill-N1 s1"><tspan x="1022" dy="0">핵막으로 싸인 핵이 있는가</tspan><tspan x="1022" dy="18.5">(배제력이 가장 크다)</tspan></text></g><g ><g class="shape"><path d="M351 417h255v82H351z" class="stroke-B1 fill-B6 s0"/></g><text x="478.5" y="455.5" class="text-bold fill-N1 s1"><tspan x="478.5" dy="0">없다 → 원핵생물</tspan><tspan x="478.5" dy="18.5">다음으로 막 지질을 본다</tspan></text></g><g ><g class="shape"><path d="M10 619h645v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="332.5" y="606" class="fill-N1 s2">글리세롤에 무엇이 어떻게 붙었는가</text></g><g ><g class="shape"><path d="M1386 417h360v82h-360z" class="stroke-B1 fill-B6 s0"/></g><text x="1566" y="455.5" class="text-bold fill-N1 s1"><tspan x="1566" dy="0">있다 → 진핵생물</tspan><tspan x="1566" dy="18.5">다음으로 세포벽과 영양 방식을 본다</tspan></text></g><g ><g class="shape"><path d="M695 619h1491v158H695z" class="stroke-B1 fill-B4 s0"/></g><text x="1440.5" y="606" class="fill-N1 s2">세포벽이 있는가, 있다면 무엇으로 되어 있는가</text></g><g ><g class="shape"><path d="M1168 0h735v114h-735z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="1535.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1535.5" dy="0">형질에 가중치를 두어야 한다</tspan><tspan x="1535.5" dy="17.25">강한 형질: 세포벽 성분, 막 지질, 정보 처리 기구의 구조</tspan><tspan x="1535.5" dy="17.25">약한 형질: 영양 방식, 겉모양, 사는 곳 — 서로 다른 계통에서 독립적으로 같아진다</tspan><tspan x="1535.5" dy="17.25">개수만 세면 수렴 형질에 끌려간다. 확정하려면 결국 서열이 필요하다</tspan></text></g><g ><g class="shape"><path d="M40 649h232v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="156" y="687.5" class="text-bold fill-N1 s1"><tspan x="156" dy="0">지방산이 에스터 결합</tspan><tspan x="156" dy="17.667">펩티도글리칸 세포벽</tspan><tspan x="156" dy="17.667">→ 세균</tspan></text></g><g ><g class="shape"><path d="M332 649h293v98H332z" class="stroke-B1 fill-B5 s0"/></g><text x="478.5" y="687.5" class="text-bold fill-N1 s1"><tspan x="478.5" dy="0">이소프레노이드가 에터 결합</tspan><tspan x="478.5" dy="17.667">펩티도글리칸이 없다</tspan><tspan x="478.5" dy="17.667">→ 고세균</tspan></text></g><g ><g class="shape"><path d="M725 649h272v98H725z" class="stroke-B1 fill-B5 s0"/></g><text x="861" y="687.5" class="text-bold fill-N1 s1"><tspan x="861" dy="0">셀룰로스 벽 + 엽록체</tspan><tspan x="861" dy="17.667">광합성으로 스스로 만든다</tspan><tspan x="861" dy="17.667">→ 식물 또는 조류</tspan></text></g><g ><g class="shape"><path d="M1057 649h319v98h-319z" class="stroke-B1 fill-B5 s0"/></g><text x="1216.5" y="687.5" class="text-bold fill-N1 s1"><tspan x="1216.5" dy="0">키틴 벽, 엽록체 없음</tspan><tspan x="1216.5" dy="17.667">밖으로 효소를 내보내 녹여 흡수</tspan><tspan x="1216.5" dy="17.667">→ 균류</tspan></text></g><g ><g class="shape"><path d="M1436 649h260v98h-260z" class="stroke-B1 fill-B5 s0"/></g><text x="1566" y="687.5" class="text-bold fill-N1 s1"><tspan x="1566" dy="0">세포벽 없음, 엽록체 없음</tspan><tspan x="1566" dy="17.667">삼켜서 안에서 소화</tspan><tspan x="1566" dy="17.667">→ 동물</tspan></text></g><g ><g class="shape"><path d="M1756 649h400v98h-400z" class="stroke-B1 fill-B5 s0"/></g><text x="1956" y="687.5" class="text-bold fill-N1 s1"><tspan x="1956" dy="0">위 어디에도 깔끔히 안 맞는다</tspan><tspan x="1956" dy="17.667">→ 이른바 원생생물</tspan><tspan x="1956" dy="17.667">계통군이 아니라 나머지를 모은 이름이다</tspan></text></g><marker id="mk-d2-655132024-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-655132024-3488378134)" d="M1022.25 92v118" class="connection stroke-B1 s0" mask="url(#d2-655132024)"/><path fill="none" marker-end="url(#mk-d2-655132024-3488378134)" d="M882.534 280.868C559.7 341.3 478.5 368.7 478.5 413.5" class="connection stroke-B1 s0" mask="url(#d2-655132024)"/><text x="655.5" y="329" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-655132024-3488378134)" d="M1162.216 281.127C1484.85 341.352 1566 368.7 1566 413.5" class="connection stroke-B1 s0" mask="url(#d2-655132024)"/><text x="1388.5" y="329" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-655132024-3488378134)" d="M478.5 501v73" class="connection stroke-B1 s0" mask="url(#d2-655132024)"/><path fill="none" marker-end="url(#mk-d2-655132024-3488378134)" d="M1566 501v73" class="connection stroke-B1 s0" mask="url(#d2-655132024)"/><mask id="d2-655132024" width="2378" height="979" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h2378v979H-91z"/><path d="M634 313h43v21h-43zM1367 313h43v21h-43z"/></mask></svg>