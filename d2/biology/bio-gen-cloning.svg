<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="1614" class="d2-878540971 d2-svg" viewBox="-101 -101 1208 1614"><rect width="1208" height="1614" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-878540971 .fill-N1{fill:#0a0f25}.d2-878540971 .fill-N2{fill:#676c7e}.d2-878540971 .fill-N4{fill:#cfd2dd}.d2-878540971 .fill-B6{fill:#f7f8fe}.d2-878540971 .stroke-B1,.d2-878540971 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M416 0h451v98H416z" class="stroke-B1 fill-B6 s0"/></g><text x="641.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="641.5" dy="0">① 삽입할 DNA 와 벡터를 준비한다</tspan><tspan x="641.5" dy="17.667">벡터에는 세 가지가 반드시 있어야 한다</tspan><tspan x="641.5" dy="17.667">복제원점 · 선별 표지(항생제 저항성) · 삽입 자리</tspan></text></g><g ><g class="shape"><path d="M384 198h514v98H384z" class="stroke-B1 fill-B6 s0"/></g><text x="641" y="236.5" class="text-bold fill-N1 s1"><tspan x="641" dy="0">② 같은 제한효소 두 가지로 양쪽을 자른다</tspan><tspan x="641" dy="17.667">서로 다른 두 효소를 쓰면 삽입 방향이 하나로 정해진다</tspan><tspan x="641" dy="17.667">점착 말단끼리는 서로 짝을 알아본다</tspan></text></g><g ><g class="shape"><path d="M429 396h424v98H429z" class="stroke-B1 fill-B6 s0"/></g><text x="641" y="434.5" class="text-bold fill-N1 s1"><tspan x="641" dy="0">③ 리게이스로 잇는다</tspan><tspan x="641" dy="17.667">삽입 DNA 와 벡터의 몰 비를 3:1 정도로 맞춘다</tspan><tspan x="641" dy="17.667">질량 비가 아니라 몰 비다</tspan></text></g><g ><g class="shape"><path d="M441 594h401v98H441z" class="stroke-B1 fill-B6 s0"/></g><text x="641.5" y="632.5" class="text-bold fill-N1 s1"><tspan x="641.5" dy="0">④ 세포에 넣는다 (형질전환)</tspan><tspan x="641.5" dy="17.667">효율이 아주 낮다 — 분자 수억 개를 넣어도</tspan><tspan x="641.5" dy="17.667">형질전환체는 수백~수천 개 규모다</tspan></text></g><g ><g class="shape"><path d="M641 948c-3 0-5 0-6-1l-345-75q-6-1.5 0-3l345-76c4-1 9-1 13 0l345 76q6 1.5 0 3l-346 75c-1 1-3 1-6 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="641" y="859.5" class="text-bold fill-N1 s1"><tspan x="641" dy="0">⑤ 선별 — 항생제를 넣는다</tspan><tspan x="641" dy="17.667">벡터가 들어간 세포만 살아남는다</tspan><tspan x="641" dy="17.667">(삽입 DNA 가 들어갔는지는 아직 모른다)</tspan></text></g><g ><g class="shape"><path d="M393 1193h-6l-310-61c-3-1-3-2 0-2l310-61c3-1 8-1 12 0l310 60c3 1 3 2 0 2l-310 62z" class="stroke-B1 fill-N4 s0"/></g><text x="393" y="1128.5" class="text-bold fill-N1 s1"><tspan x="393" dy="0">⑥ 선발 — 살아남은 것 중에서 고른다</tspan><tspan x="393" dy="18.5">색 변화, 콜로니 PCR, 크기 확인</tspan></text></g><g ><g class="shape"><path d="M0 1314h403v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="201.5" y="1352.5" class="text-bold fill-N1 s1"><tspan x="201.5" dy="0">⑦ 서열로 확인한다</tspan><tspan x="201.5" dy="17.667">크기만 맞고 서열이 틀린 경우가 있다</tspan><tspan x="201.5" dy="17.667">생어 시퀀싱이 지금도 이 자리의 표준이다</tspan></text></g><g ><g class="shape"><path d="M771 1090h235v82H771z" class="stroke-B2 fill-B6 s2"/></g><text x="888.5" y="1128.5" class="text-bold fill-N1 s1"><tspan x="888.5" dy="0">벡터가 안 들어간 세포</tspan><tspan x="888.5" dy="18.5">(대다수) — 죽는다</tspan></text></g><g ><g class="shape"><path d="M463 1322h244v82H463z" class="stroke-B2 fill-B6 s2"/></g><text x="585" y="1360.5" class="text-bold fill-N1 s1"><tspan x="585" dy="0">벡터만 들어간 세포</tspan><tspan x="585" dy="18.5">(자기끼리 이어진 벡터)</tspan></text></g><marker id="mk-d2-878540971-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-878540971-3488378134)" d="M641 100v94" class="connection stroke-B1 s0" mask="url(#d2-878540971)"/><path fill="none" marker-end="url(#mk-d2-878540971-3488378134)" d="M641 298v94" class="connection stroke-B1 s0" mask="url(#d2-878540971)"/><path fill="none" marker-end="url(#mk-d2-878540971-3488378134)" d="M641 496v94" class="connection stroke-B1 s0" mask="url(#d2-878540971)"/><path fill="none" marker-end="url(#mk-d2-878540971-3488378134)" d="M641 694v94" class="connection stroke-B1 s0" mask="url(#d2-878540971)"/><path fill="none" marker-end="url(#mk-d2-878540971-3488378134)" d="M537.26 926.985C422.4 992 393.2 1020.4 393.016 1064" class="connection stroke-B1 s0" mask="url(#d2-878540971)"/><path fill="none" marker-end="url(#mk-d2-878540971-3488378134)" d="M315.32 1180.084C224.6 1238.6 201.5 1265.7 201.5 1310.5" class="connection stroke-B1 s0" mask="url(#d2-878540971)"/><marker id="mk-d2-878540971-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-878540971-2177206569)" d="M744.74 926.985C859.6 992 888.75 1024.9 888.75 1086.5" class="connection stroke-B2 s2" mask="url(#d2-878540971)"/><text x="848.5" y="991" class="text-italic fill-N2 s1">탈락</text><path fill="none" marker-end="url(#mk-d2-878540971-2177206569)" d="M470.683 1180.08C561.8 1238.6 585 1267.3 585 1318.5" class="connection stroke-B2 s2" mask="url(#d2-878540971)"/><text x="554.5" y="1239" class="text-italic fill-N2 s1">탈락</text><mask id="d2-878540971" width="1208" height="1614" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1208v1614H-101z"/><path d="M827 975h43v21h-43zM533 1223h43v21h-43z"/></mask></svg>