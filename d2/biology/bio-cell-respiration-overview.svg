17.667">10단계, 산소가 필요 없다</tspan><tspan x="382.5" dy="17.667">ATP 2, NADH 2</tspan></text></g><g ><g class="shape"><path d="M337 376h264v66H337z" class="stroke-B1 fill-B5 s2"/></g><text x="469" y="414.5" class="text-bold fill-N1 s3">피루브산 2개 (탄소 3개씩)</text></g><g ><g class="shape"><path d="M326 783h516v512H326z" class="stroke-B2 fill-B5 s0"/></g><text x="584" y="812" class="fill-N1 s4">기질 — 안쪽 방</text></g><g ><g class="shape"><path d="M98 1486h521v467H98z" class="stroke-B2 fill-B5 s0"/></g><text x="358.5" y="1515" class="fill-N1 s4">내막 — 접혀 있는 안쪽 막</text></g><g ><g class="shape"><path d="M423 833h322v98H423z" class="stroke-B1 fill-B6 s2"/></g><text x="584" y="871.5" class="text-bold fill-N1 s3"><tspan x="584" dy="0">피루브산 산화</tspan><tspan x="584" dy="17.667">CO2 를 떼고 조각을 CoA 에 붙인다</tspan><tspan x="584" dy="17.667">NADH 2</tspan></text></g><g ><g class="shape"><path d="M446 1011h276v66H446z" class="stroke-B1 fill-B6 s2"/></g><text x="584" y="1049.5" class="text-bold fill-N1 s3">아세틸-CoA 2개 (탄소 2개씩)</text></g><g ><g class="shape"><path d="M417 1147h334v98H417z" class="stroke-B1 fill-B6 s2"/></g><text x="584" y="1185.5" class="text-bold fill-N1 s3"><tspan x="584" dy="0">TCA 회로</tspan><tspan x="584" dy="17.667">남은 탄소를 CO2 로 마저 떼어 낸다</tspan><tspan x="584" dy="17.667">ATP 2, NADH 6, FADH2 2</tspan></text></g><g ><g class="shape"><path d="M148 1536h296v98H148z" class="stroke-B1 fill-B6 s2"/></g><text x="296" y="1574.5" class="text-bold fill-N1 s3"><tspan x="296" dy="0">전자전달계</tspan><tspan x="296" dy="17.667">전자를 산소까지 흘리며</tspan><tspan x="296" dy="17.667">양성자를 막 바깥으로 퍼낸다</tspan></text></g><g ><g class="shape"><path d="M233 1805h336v98H233z" class="stroke-B1 fill-B6 s2"/></g><text x="401" y="1843.5" class="text-bold fill-N1 s3"><tspan x="401" dy="0">ATP 합성효소</tspan><tspan x="401" dy="17.667">양성자가 되돌아오는 힘으로 돈다</tspan><tspan x="401" dy="17.667">ATP 약 26~28</tspan></text></g><marker id="mk-d2-2930660601-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orie