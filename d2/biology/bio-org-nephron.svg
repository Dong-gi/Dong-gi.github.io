<svg xmlns="http://www.w3.org/2000/svg" width="1059" height="1978" class="d2-2813735488 d2-svg" viewBox="-88 -89 1059 1978"><rect width="1059" height="1978" x="-88" y="-89" rx="0" style="fill:#fff"/><style>.d2-2813735488 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2813735488 .fill-N1{fill:#0a0f25}.d2-2813735488 .fill-B4{fill:#e3e9fd}.d2-2813735488 .fill-B5{fill:#edf0fd}.d2-2813735488 .fill-B6{fill:#f7f8fe}.d2-2813735488 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M241 12h203v66H241z" class="stroke-B1 fill-B6 s0"/></g><text x="342.5" y="50.5" class="text-bold fill-N1 s1">들어온 혈액 (혈장)</text></g><g ><g class="shape"><path d="M165 163h456v480H165z" class="stroke-B1 fill-B4 s0"/></g><text x="393" y="196" class="fill-N1 s2"><tspan x="393" dy="0">1. 여과 —</tspan><tspan x="393" dy="32">사구체와 보먼주머니</tspan></text></g><g ><g class="shape"><path d="M199 733h511v674H199z" class="stroke-B1 fill-B4 s0"/></g><text x="454.5" y="766" class="fill-N1 s2"><tspan x="454.5" dy="0">2. 재흡수 —</tspan><tspan x="454.5" dy="32">여기가 선택이 일어나는 곳</tspan></text></g><g ><g class="shape"><path d="M641 346h229v114H641z" class="stroke-B1 fill-B6 s0"/></g><text x="755.5" y="384.5" class="text-bold fill-N1 s1"><tspan x="755.5" dy="0">3. 분비</tspan><tspan x="755.5" dy="17.25">혈액에서 세뇨관으로</tspan><tspan x="755.5" dy="17.25">추가로 밀어낸다</tspan><tspan x="755.5" dy="17.25">H⁺, K⁺, 여러 약물</tspan></text></g><g ><g class="shape"><path d="M465 1492h159v82H465z" class="stroke-B1 fill-B6 s0"/></g><text x="544.5" y="1530.5" class="text-bold fill-N1 s1"><tspan x="544.5" dy="0">4. 배설 — 오줌</tspan><tspan x="544.5" dy="18.5">하루 약 1.5 L</tspan></text></g><g ><g class="shape"><path d="M275 1594h380v194H275z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="465" y="1632.5" class="text-bold fill-N1 s1"><tspan x="465" dy="0">한 줄로 쓰면</tspan><tspan x="465" dy="16.556">배설 = 여과 − 재흡수 + 분비</tspan><tspan x="465" dy="16.556">청소율 C =</tspan><tspan x="465" dy="16.556">(오줌 농도 × 오줌 생성 속도) ÷ 혈장 농도</tspan><tspan x="465" dy="16.556">로 각 물질이 어느 쪽인지 판정한다</tspan><tspan x="465" dy="16.556">C &gt; GFR 이면 분비,</tspan><tspan x="465" dy="16.556">C = GFR 이면 그대로 통과,</tspan><tspan x="465" dy="16.556">0 &lt; C &lt; GFR 이면 순 재흡수,</tspan><tspan x="465" dy="16.556">C = 0 이면 완전 재흡수</tspan></text></g><g ><g class="shape"><path d="M294 431h277v162H294z" class="stroke-B1 fill-B5 s0"/></g><text x="432.5" y="469.5" class="text-bold fill-N1 s1"><tspan x="432.5" dy="0">순여과압 NFP</tspan><tspan x="432.5" dy="16.714">= P(사구체) − P(보먼주머니)</tspan><tspan x="432.5" dy="16.714">− π(혈장)</tspan><tspan x="432.5" dy="16.714">큰 압력들의 차로</tspan><tspan x="432.5" dy="16.714">작은 알짜가 남는 구조라</tspan><tspan x="432.5" dy="16.714">한 항만 흔들려도</tspan><tspan x="432.5" dy="16.714">여과량이 크게 변한다</tspan></text></g><g ><g class="shape"><path d="M215 237h255v114H215z" class="stroke-B1 fill-B5 s0"/></g><text x="342.5" y="275.5" class="text-bold fill-N1 s1"><tspan x="342.5" dy="0">크기로만 거른다</tspan><tspan x="342.5" dy="17.25">혈구와 큰 단백질은 남고</tspan><tspan x="342.5" dy="17.25">나머지는 다 나간다</tspan><tspan x="342.5" dy="17.25">하루 약 180 L</tspan></text></g><g ><g class="shape"><path d="M249 807h276v130H249z" class="stroke-B1 fill-B5 s0"/></g><text x="387" y="845.5" class="text-bold fill-N1 s1"><tspan x="387" dy="0">근위세뇨관</tspan><tspan x="387" dy="17">포도당, 아미노산,</tspan><tspan x="387" dy="17">대부분의 Na⁺ 와 물</tspan><tspan x="387" dy="17">수송체 용량에 한계가 있어</tspan><tspan x="387" dy="17">문턱을 넘으면 넘친다</tspan></text></g><g ><g class="shape"><path d="M348 1017h235v130H348z" class="stroke-B1 fill-B5 s0"/></g><text x="465.5" y="1055.5" class="text-bold fill-N1 s1"><tspan x="465.5" dy="0">헨레고리</tspan><tspan x="465.5" dy="17">수질에 삼투 기울기를</tspan><tspan x="465.5" dy="17">만들어 둔다</tspan><tspan x="465.5" dy="17">오줌을 농축할 수 있게</tspan><tspan x="465.5" dy="17">하는 장치</tspan></text></g><g ><g class="shape"><path d="M430 1227h229v130H430z" class="stroke-B1 fill-B5 s0"/></g><text x="544.5" y="1265.5" class="text-bold fill-N1 s1"><tspan x="544.5" dy="0">원위세뇨관과 집합관</tspan><tspan x="544.5" dy="17">호르몬이 조절하는</tspan><tspan x="544.5" dy="17">미세 조정 구간</tspan><tspan x="544.5" dy="17">알도스테론(Na⁺),</tspan><tspan x="544.5" dy="17">항이뇨호르몬(물)</tspan></text></g><path fill="none" marker-end="url(#mk-d2-2813735488-3488378134)" d="M466.375 939v74" class="connection stroke-B1 s0" mask="url(#d2-2813735488)"/><path fill="none" marker-end="url(#mk-d2-2813735488-3488378134)" d="M506.958 1149v74" class="connection stroke-B1 s0" mask="url(#d2-2813735488)"/><path fill="none" marker-end="url(#mk-d2-2813735488-3488378134)" d="M342.875 80v153" class="connection stroke-B1 s0" mask="url(#d2-2813735488)"/><path fill="none" marker-end="url(#mk-d2-2813735488-3488378134)" d="M253.125 353v325s0 10 10 10h114s10 0 10 10v105" class="connection stroke-B1 s0" mask="url(#d2-2813735488)"/><path fill="none" marker-end="url(#mk-d2-2813735488-3488378134)" d="M307.875 939v503s0 10-10 10H70.5s-10 0-10-10V128s0-10 10-10h211.625s10 0 10-10V82" class="connection stroke-B1 s0" mask="url(#d2-2813735488)"/><text x="60.5" y="1028" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px"><tspan x="60.5" dy="0">99% 넘게</tspan><tspan x="60.5" dy="18.5">되돌아간다</tspan></text><path fill="none" marker-end="url(#mk-d2-2813735488-3488378134)" d="M393.625 80v28s0 10 10 10h342s10 0 10 10v214" class="connection stroke-B1 s0" mask="url(#d2-2813735488)"/><path fill="none" marker-end="url(#mk-d2-2813735488-3488378134)" d="M755.625 462v216s0 10-10 10h-111.75s-10 0-10 10v525" class="connection stroke-B1 s0" mask="url(#d2-2813735488)"/><path fill="none" marker-end="url(#mk-d2-2813735488-3488378134)" d="M545.125 1359v129" class="connection stroke-B1 s0" mask="url(#d2-2813735488)"/><mask id="d2-2813735488" width="1059" height="1978" x="-88" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-88-89H971v1978H-88z"/><path d="M10 1012h101v37H10z"/></mask></svg>