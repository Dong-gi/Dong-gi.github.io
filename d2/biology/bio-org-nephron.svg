<svg xmlns="http://www.w3.org/2000/svg" width="1419" height="1754" class="d2-3395249459 d2-svg" viewBox="-88 -89 1419 1754"><rect width="1419" height="1754" x="-88" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3395249459 .fill-N1{fill:#0a0f25}.d2-3395249459 .fill-B4{fill:#e3e9fd}.d2-3395249459 .fill-B5{fill:#edf0fd}.d2-3395249459 .fill-B6{fill:#f7f8fe}.d2-3395249459 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M373 12h203v66H373z" class="stroke-B1 fill-B6 s0"/></g><text x="474.5" y="50.5" class="text-bold fill-N1 s1">들어온 혈액 (혈장)</text></g><g ><g class="shape"><path d="M211 163h622v408H211z" class="stroke-B1 fill-B4 s0"/></g><text x="522" y="196" class="fill-N1 s2">1. 여과 — 사구체와 보먼주머니</text></g><g ><g class="shape"><path d="M311 661h665v570H311z" class="stroke-B1 fill-B4 s0"/></g><text x="643.5" y="694" class="fill-N1 s2">2. 재흡수 — 여기가 선택이 일어나는 곳</text></g><g ><g class="shape"><path d="M853 318h377v98H853z" class="stroke-B1 fill-B6 s0"/></g><text x="1041.5" y="356.5" class="text-bold fill-N1 s1"><tspan x="1041.5" dy="0">3. 분비</tspan><tspan x="1041.5" dy="17.667">혈액에서 세뇨관으로 추가로 밀어낸다</tspan><tspan x="1041.5" dy="17.667">H⁺, K⁺, 여러 약물</tspan></text></g><g ><g class="shape"><path d="M673 1316h159v82H673z" class="stroke-B1 fill-B6 s0"/></g><text x="752.5" y="1354.5" class="text-bold fill-N1 s1"><tspan x="752.5" dy="0">4. 배설 — 오줌</tspan><tspan x="752.5" dy="18.5">하루 약 1.5 L</tspan></text></g><g ><g class="shape"><path d="M429 1418h468v146H429z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="663" y="1456.5" class="text-bold fill-N1 s1"><tspan x="663" dy="0">한 줄로 쓰면</tspan><tspan x="663" dy="16.833">배설 = 여과 − 재흡수 + 분비</tspan><tspan x="663" dy="16.833">청소율 C = (오줌 농도 × 오줌 생성 속도) ÷ 혈장 농도</tspan><tspan x="663" dy="16.833">로 각 물질이 어느 쪽인지 판정한다</tspan><tspan x="663" dy="16.833">C &gt; GFR 이면 분비, C = GFR 이면 그대로 통과,</tspan><tspan x="663" dy="16.833">0 &lt; C &lt; GFR 이면 순 재흡수, C = 0 이면 완전 재흡수</tspan></text></g><g ><g class="shape"><path d="M400 391h383v130H400z" class="stroke-B1 fill-B5 s0"/></g><text x="591.5" y="429.5" class="text-bold fill-N1 s1"><tspan x="591.5" dy="0">순여과압 NFP</tspan><tspan x="591.5" dy="17">= P(사구체) − P(보먼주머니) − π(혈장)</tspan><tspan x="591.5" dy="17">큰 압력들의 차로</tspan><tspan x="591.5" dy="17">작은 알짜가 남는 구조라</tspan><tspan x="591.5" dy="17">한 항만 흔들려도 여과량이 크게 변한다</tspan></text></g><g ><g class="shape"><path d="M261 213h427v98H261z" class="stroke-B1 fill-B5 s0"/></g><text x="474.5" y="251.5" class="text-bold fill-N1 s1"><tspan x="474.5" dy="0">크기로만 거른다</tspan><tspan x="474.5" dy="17.667">혈구와 큰 단백질은 남고 나머지는 다 나간다</tspan><tspan x="474.5" dy="17.667">하루 약 180 L</tspan></text></g><g ><g class="shape"><path d="M361 711h362v114H361z" class="stroke-B1 fill-B5 s0"/></g><text x="542" y="749.5" class="text-bold fill-N1 s1"><tspan x="542" dy="0">근위세뇨관</tspan><tspan x="542" dy="17.25">포도당, 아미노산, 대부분의 Na⁺ 와 물</tspan><tspan x="542" dy="17.25">수송체 용량에 한계가 있어</tspan><tspan x="542" dy="17.25">문턱을 넘으면 넘친다</tspan></text></g><g ><g class="shape"><path d="M478 905h340v98H478z" class="stroke-B1 fill-B5 s0"/></g><text x="648" y="943.5" class="text-bold fill-N1 s1"><tspan x="648" dy="0">헨레고리</tspan><tspan x="648" dy="17.667">수질에 삼투 기울기를 만들어 둔다</tspan><tspan x="648" dy="17.667">오줌을 농축할 수 있게 하는 장치</tspan></text></g><g ><g class="shape"><path d="M579 1083h347v98H579z" class="stroke-B1 fill-B5 s0"/></g><text x="752.5" y="1121.5" class="text-bold fill-N1 s1"><tspan x="752.5" dy="0">원위세뇨관과 집합관</tspan><tspan x="752.5" dy="17.667">호르몬이 조절하는 미세 조정 구간</tspan><tspan x="752.5" dy="17.667">알도스테론(Na⁺), 항이뇨호르몬(물)</tspan></text></g><path fill="none" marker-end="url(#mk-d2-3395249459-3488378134)" d="M648.125 827v74" class="connection stroke-B1 s0" mask="url(#d2-3395249459)"/><path fill="none" marker-end="url(#mk-d2-3395249459-3488378134)" d="M695.291 1005v74" class="connection stroke-B1 s0" mask="url(#d2-3395249459)"/><path fill="none" marker-end="url(#mk-d2-3395249459-3488378134)" d="M475.375 80v129" class="connection stroke-B1 s0" mask="url(#d2-3395249459)"/><path fill="none" marker-end="url(#mk-d2-3395249459-3488378134)" d="M359.125 313v293s0 10 10 10h163.5s10 0 10 10v81" class="connection stroke-B1 s0" mask="url(#d2-3395249459)"/><path fill="none" marker-end="url(#mk-d2-3395249459-3488378134)" d="M437.125 827v439s0 10-10 10H107s-10 0-10-10V128s0-10 10-10h307.625s10 0 10-10V82" class="connection stroke-B1 s0" mask="url(#d2-3395249459)"/><text x="97" y="914" style="fill:#676c7e;text-anchor:middle;font-size:16px">99% 넘게 되돌아간다</text><path fill="none" marker-end="url(#mk-d2-3395249459-3488378134)" d="M526.125 80v28s0 10 10 10h495.5s10 0 10 10v186" class="connection stroke-B1 s0" mask="url(#d2-3395249459)"/><path fill="none" marker-end="url(#mk-d2-3395249459-3488378134)" d="M1041.625 418v188s0 10-10 10h-163.5s-10 0-10 10v453" class="connection stroke-B1 s0" mask="url(#d2-3395249459)"/><path fill="none" marker-end="url(#mk-d2-3395249459-3488378134)" d="M753.125 1183v129" class="connection stroke-B1 s0" mask="url(#d2-3395249459)"/><mask id="d2-3395249459" width="1419" height="1754" x="-88" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-88-89h1419v1754H-88z"/><path d="M10 898h174v21H10z"/></mask></svg>