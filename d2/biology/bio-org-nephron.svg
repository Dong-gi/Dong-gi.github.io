<svg xmlns="http://www.w3.org/2000/svg" width="2143" height="1490" class="d2-996117538 d2-svg" viewBox="-91 -101 2143 1490"><rect width="2143" height="1490" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-996117538 .fill-N1{fill:#0a0f25}.d2-996117538 .fill-B4{fill:#e3e9fd}.d2-996117538 .fill-B5{fill:#edf0fd}.d2-996117538 .fill-B6{fill:#f7f8fe}.d2-996117538 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M885 24h203v66H885z" class="stroke-B1 fill-B6 s0"/></g><text x="986.5" y="62.5" class="text-bold fill-N1 s1">들어온 혈액 (혈장)</text></g><g ><g class="shape"><path d="M10 234h1019v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="519.5" y="221" class="fill-N1 s2">1. 여과 — 사구체와 보먼주머니</text></g><g ><g class="shape"><path d="M679 532h527v554H679z" class="stroke-B1 fill-B4 s0"/></g><text x="942.5" y="519" class="fill-N1 s2">2. 재흡수 — 여기가 선택이 일어나는 곳</text></g><g ><g class="shape"><path d="M1331 760h377v98h-377z" class="stroke-B1 fill-B6 s0"/></g><text x="1519.5" y="798.5" class="text-bold fill-N1 s1"><tspan x="1519.5" dy="0">3. 분비</tspan><tspan x="1519.5" dy="17.667">혈액에서 세뇨관으로 추가로 밀어낸다</tspan><tspan x="1519.5" dy="17.667">H⁺, K⁺, 여러 약물</tspan></text></g><g ><g class="shape"><path d="M863 1206h159v82H863z" class="stroke-B1 fill-B6 s0"/></g><text x="942.5" y="1244.5" class="text-bold fill-N1 s1"><tspan x="942.5" dy="0">4. 배설 — 오줌</tspan><tspan x="942.5" dy="18.5">하루 약 1.5 L</tspan></text></g><g ><g class="shape"><path d="M1148 0h803v114h-803z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="1549.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1549.5" dy="0">한 줄로 쓰면</tspan><tspan x="1549.5" dy="17.25">배설 = 여과 − 재흡수 + 분비</tspan><tspan x="1549.5" dy="17.25">청소율 C = (오줌 농도 × 오줌 생성 속도) ÷ 혈장 농도 로 각 물질이 어느 쪽인지 판정한다</tspan><tspan x="1549.5" dy="17.25">C &gt; GFR 이면 분비, C = GFR 이면 그대로 통과, 0 &lt; C &lt; GFR 이면 순 재흡수, C = 0 이면 완전 재흡수</tspan></text></g><g ><g class="shape"><path d="M40 264h472v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="276" y="302.5" class="text-bold fill-N1 s1"><tspan x="276" dy="0">순여과압 NFP = P(사구체) − P(보먼주머니) − π(혈장)</tspan><tspan x="276" dy="17.667">큰 압력들의 차로 작은 알짜가 남는 구조라</tspan><tspan x="276" dy="17.667">한 항만 흔들려도 여과량이 크게 변한다</tspan></text></g><g ><g class="shape"><path d="M572 264h427v98H572z" class="stroke-B1 fill-B5 s0"/></g><text x="785.5" y="302.5" class="text-bold fill-N1 s1"><tspan x="785.5" dy="0">크기로만 거른다</tspan><tspan x="785.5" dy="17.667">혈구와 큰 단백질은 남고 나머지는 다 나간다</tspan><tspan x="785.5" dy="17.667">하루 약 180 L</tspan></text></g><g ><g class="shape"><path d="M709 562h467v98H709z" class="stroke-B1 fill-B5 s0"/></g><text x="942.5" y="600.5" class="text-bold fill-N1 s1"><tspan x="942.5" dy="0">근위세뇨관</tspan><tspan x="942.5" dy="17.667">포도당, 아미노산, 대부분의 Na⁺ 와 물</tspan><tspan x="942.5" dy="17.667">수송체 용량에 한계가 있어 문턱을 넘으면 넘친다</tspan></text></g><g ><g class="shape"><path d="M773 760h340v98H773z" class="stroke-B1 fill-B5 s0"/></g><text x="943" y="798.5" class="text-bold fill-N1 s1"><tspan x="943" dy="0">헨레고리</tspan><tspan x="943" dy="17.667">수질에 삼투 기울기를 만들어 둔다</tspan><tspan x="943" dy="17.667">오줌을 농축할 수 있게 하는 장치</tspan></text></g><g ><g class="shape"><path d="M769 958h347v98H769z" class="stroke-B1 fill-B5 s0"/></g><text x="942.5" y="996.5" class="text-bold fill-N1 s1"><tspan x="942.5" dy="0">원위세뇨관과 집합관</tspan><tspan x="942.5" dy="17.667">호르몬이 조절하는 미세 조정 구간</tspan><tspan x="942.5" dy="17.667">알도스테론(Na⁺), 항이뇨호르몬(물)</tspan></text></g><marker id="mk-d2-996117538-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-996117538-3488378134)" d="M942.75 662v94" class="connection stroke-B1 s0" mask="url(#d2-996117538)"/><path fill="none" marker-end="url(#mk-d2-996117538-3488378134)" d="M942.75 860v94" class="connection stroke-B1 s0" mask="url(#d2-996117538)"/><path fill="none" marker-end="url(#mk-d2-996117538-3488378134)" d="M922.735 90.94C813.3 149.2 785.5 224 785.5 260" class="connection stroke-B1 s0" mask="url(#d2-996117538)"/><path fill="none" marker-end="url(#mk-d2-996117538-3488378134)" d="M785.5 364v73c0 15 15.8 85 75.62 122.86" class="connection stroke-B1 s0" mask="url(#d2-996117538)"/><path fill="none" marker-end="url(#mk-d2-996117538-3488378134)" d="M1043.796 561.12C1123.6 522 1144 502 1144 487V263.5c0-29.7-21.8-114.3-105.69-171.253" class="connection stroke-B1 s0" mask="url(#d2-996117538)"/><text x="1144" y="337" style="fill:#676c7e;text-anchor:middle;font-size:16px">99% 넘게 되돌아간다</text><path fill="none" marker-end="url(#mk-d2-996117538-3488378134)" d="M1090.21 77.789C1433.05 146.679 1519.25 174 1519.25 189v567" class="connection stroke-B1 s0" mask="url(#d2-996117538)"/><path fill="none" marker-end="url(#mk-d2-996117538-3488378134)" d="M1336.07 858.524C1190.8 898 1132.6 918 1050.624 956.307" class="connection stroke-B1 s0" mask="url(#d2-996117538)"/><path fill="none" marker-end="url(#mk-d2-996117538-3488378134)" d="M942.75 1058v144" class="connection stroke-B1 s0" mask="url(#d2-996117538)"/><mask id="d2-996117538" width="2143" height="1490" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h2143v1490H-91z"/><path d="M1057 321h174v21h-174z"/></mask></svg>