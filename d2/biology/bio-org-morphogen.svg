<svg xmlns="http://www.w3.org/2000/svg" width="1955" height="1453" class="d2-3606396943 d2-svg" viewBox="-101 -101 1955 1453"><rect width="1955" height="1453" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3606396943 .fill-N1{fill:#0a0f25}.d2-3606396943 .fill-N2{fill:#676c7e}.d2-3606396943 .fill-B5{fill:#edf0fd}.d2-3606396943 .fill-B6{fill:#f7f8fe}.d2-3606396943 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M337 8h555v66H337z" class="stroke-B1 fill-B6 s0"/></g><text x="614.5" y="46.5" class="text-bold fill-N1 s1">같은 유전체를 가진 세포들이 어떻게 서로 다른 것이 되는가</text></g><g ><g class="shape"><path d="M0 182h366v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="183" y="220.5" class="text-bold fill-N1 s1"><tspan x="183" dy="0">① 결정 인자의 불균등 분배</tspan><tspan x="183" dy="17.25">어미가 난자 안에 미리 넣어 둔 물질이</tspan><tspan x="183" dy="17.25">한쪽에 몰려 있다가 분열로 갈라진다</tspan><tspan x="183" dy="17.25">정보의 출처: 어미</tspan></text></g><g ><g class="shape"><path d="M426 182h447v114H426z" class="stroke-B1 fill-B6 s0"/></g><text x="649.5" y="220.5" class="text-bold fill-N1 s1"><tspan x="649.5" dy="0">② 유도</tspan><tspan x="649.5" dy="17.25">이웃 세포가 신호를 보내 상대의 운명을 바꾼다</tspan><tspan x="649.5" dy="17.25">같은 세포라도 어디에 놓이느냐로 달라진다</tspan><tspan x="649.5" dy="17.25">정보의 출처: 이웃</tspan></text></g><g ><g class="shape"><path d="M968 182h383v114H968z" class="stroke-B1 fill-B6 s0"/></g><text x="1159.5" y="220.5" class="text-bold fill-N1 s1"><tspan x="1159.5" dy="0">③ 모포젠</tspan><tspan x="1159.5" dy="17.25">물질 하나가 농도 기울기를 이루고</tspan><tspan x="1159.5" dy="17.25">농도에 따라 다른 유전자 집합이 켜진다</tspan><tspan x="1159.5" dy="17.25">정보의 출처: 자기 자리의 농도</tspan></text></g><g ><g class="shape"><path d="M977 437h365v596H977z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1159.5" y="424" class="fill-N1" style="text-anchor:middle;font-size:28px">모포젠을 읽는 법 — 경계를 만드는 것은 문턱이다</text></g><g ><g class="shape"><path d="M862 1153h595v98H862z" class="stroke-B1 fill-B6 s0"/></g><text x="1159.5" y="1191.5" class="text-bold fill-N1 s1"><tspan x="1159.5" dy="0">농도라는 하나의 연속량이 문턱을 거쳐 몇 개의 영역으로 잘린다</tspan><tspan x="1159.5" dy="17.667">이것이 &apos;위치를 농도로 표현한다&apos;는 말의 뜻이다</tspan><tspan x="1159.5" dy="17.667">경계의 자리를 옮기려면 기울기를 바꾸거나 문턱을 바꾸면 된다</tspan></text></g><g ><g class="shape"><path d="M952 0h801v82H952z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="1352.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1352.5" dy="0">셋은 서로 배타적이지 않다</tspan><tspan x="1352.5" dy="18.5">한 배에서 세 기작이 함께 작동하고, 앞 단계의 산물이 뒷 단계의 근원이 되는 일이 흔하다</tspan></text></g><g ><g class="shape"><path d="M1007 467h305v98h-305z" class="stroke-B1 fill-B5 s0"/></g><text x="1159.5" y="505.5" class="text-bold fill-N1 s1"><tspan x="1159.5" dy="0">근원 쪽 (농도 높음)</tspan><tspan x="1159.5" dy="17.667">문턱 1 과 문턱 2 를 모두 넘는다</tspan><tspan x="1159.5" dy="17.667">→ 유전자 집합 A 가 켜진다</tspan></text></g><g ><g class="shape"><path d="M1029 686h262v98h-262z" class="stroke-B1 fill-B5 s0"/></g><text x="1160" y="724.5" class="text-bold fill-N1 s1"><tspan x="1160" dy="0">가운데 (농도 중간)</tspan><tspan x="1160" dy="17.667">문턱 1 만 넘는다</tspan><tspan x="1160" dy="17.667">→ 유전자 집합 B 가 켜진다</tspan></text></g><g ><g class="shape"><path d="M1029 905h262v98h-262z" class="stroke-B1 fill-B5 s0"/></g><text x="1160" y="943.5" class="text-bold fill-N1 s1"><tspan x="1160" dy="0">먼 쪽 (농도 낮음)</tspan><tspan x="1160" dy="17.667">어느 문턱도 넘지 못한다</tspan><tspan x="1160" dy="17.667">→ 유전자 집합 C 가 켜진다</tspan></text></g><marker id="mk-d2-3606396943-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3606396943-3488378134)" d="M456.043 74.413C238 120.4 183 142 183 178" class="connection stroke-B1 s0" mask="url(#d2-3606396943)"/><path fill="none" marker-end="url(#mk-d2-3606396943-3488378134)" d="M628.21 75.87C645.1 120.4 649.5 142 649.5 178" class="connection stroke-B1 s0" mask="url(#d2-3606396943)"/><path fill="none" marker-end="url(#mk-d2-3606396943-3488378134)" d="M813.723 74.329C1090.15 120.4 1159.75 142 1159.75 178" class="connection stroke-B1 s0" mask="url(#d2-3606396943)"/><path fill="none" marker-end="url(#mk-d2-3606396943-3488378134)" d="M1159.75 566.5v116" class="connection stroke-B1 s0" mask="url(#d2-3606396943)"/><text x="1160" y="631" class="text-italic fill-N2 s1">멀어지면서 농도가 떨어진다</text><path fill="none" marker-end="url(#mk-d2-3606396943-3488378134)" d="M1159.75 785.5v116" class="connection stroke-B1 s0" mask="url(#d2-3606396943)"/><text x="1159.5" y="850" class="text-italic fill-N2 s1">계속 떨어진다</text><path fill="none" marker-end="url(#mk-d2-3606396943-3488378134)" d="M1159.75 297.5V463" class="connection stroke-B1 s0" mask="url(#d2-3606396943)"/><text x="1160" y="387" class="text-italic fill-N2 s1">근원에서 퍼져 나간다</text><path fill="none" marker-end="url(#mk-d2-3606396943-3488378134)" d="M1159.75 1005v144" class="connection stroke-B1 s0" mask="url(#d2-3606396943)"/><mask id="d2-3606396943" width="1955" height="1453" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1955v1453H-101z"/><path d="M1039 615h242v21h-242zM1098 834h123v21h-123zM1068 371h184v21h-184z"/></mask></svg>