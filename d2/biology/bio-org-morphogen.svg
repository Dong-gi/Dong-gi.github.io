<svg xmlns="http://www.w3.org/2000/svg" width="1347" height="1667" class="d2-3854651921 d2-svg" viewBox="-89 -89 1347 1667"><rect width="1347" height="1667" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3854651921 .text-bold{font-weight:700}.d2-3854651921 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3854651921 .fill-N1{fill:#0a0f25}.d2-3854651921 .fill-N2{fill:#676c7e}.d2-3854651921 .fill-B5{fill:#edf0fd}.d2-3854651921 .fill-B6{fill:#f7f8fe}.d2-3854651921 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M171 12h555v66H171z" class="stroke-B1 fill-B6 s0"/></g><text x="448.5" y="50.5" class="text-bold fill-N1 s1">같은 유전체를 가진 세포들이 어떻게 서로 다른 것이 되는가</text></g><g ><g class="shape"><path d="M12 158h270v146H12z" class="stroke-B1 fill-B6 s0"/></g><text x="147" y="196.5" class="text-bold fill-N1 s1"><tspan x="147" dy="0">① 결정 인자의 불균등 분배</tspan><tspan x="147" dy="16.833">어미가 난자 안에</tspan><tspan x="147" dy="16.833">미리 넣어 둔 물질이</tspan><tspan x="147" dy="16.833">한쪽에 몰려 있다가</tspan><tspan x="147" dy="16.833">분열로 갈라진다</tspan><tspan x="147" dy="16.833">정보의 출처: 어미</tspan></text></g><g ><g class="shape"><path d="M302 158h293v146H302z" class="stroke-B1 fill-B6 s0"/></g><text x="448.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="448.5" dy="0">② 유도</tspan><tspan x="448.5" dy="16.833">이웃 세포가 신호를 보내</tspan><tspan x="448.5" dy="16.833">상대의 운명을 바꾼다</tspan><tspan x="448.5" dy="16.833">같은 세포라도</tspan><tspan x="448.5" dy="16.833">어디에 놓이느냐로 달라진다</tspan><tspan x="448.5" dy="16.833">정보의 출처: 이웃</tspan></text></g><g ><g class="shape"><path d="M615 158h304v146H615z" class="stroke-B1 fill-B6 s0"/></g><text x="767" y="196.5" class="text-bold fill-N1 s1"><tspan x="767" dy="0">③ 모포젠</tspan><tspan x="767" dy="16.833">물질 하나가</tspan><tspan x="767" dy="16.833">농도 기울기를 이루고</tspan><tspan x="767" dy="16.833">농도에 따라</tspan><tspan x="767" dy="16.833">다른 유전자 집합이 켜진다</tspan><tspan x="767" dy="16.833">정보의 출처: 자기 자리의 농도</tspan></text></g><g ><g class="shape"><path d="M377 470h780v716H377z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="767" y="503" class="fill-N1" style="text-anchor:middle;font-size:28px">모포젠을 읽는 법 — 경계를 만드는 것은 문턱이다</text></g><g ><g class="shape"><path d="M469 1261h595v98H469z" class="stroke-B1 fill-B6 s0"/></g><text x="766.5" y="1299.5" class="text-bold fill-N1 s1"><tspan x="766.5" dy="0">농도라는 하나의 연속량이 문턱을 거쳐 몇 개의 영역으로 잘린다</tspan><tspan x="766.5" dy="17.667">이것이 &apos;위치를 농도로 표현한다&apos;는 말의 뜻이다</tspan><tspan x="766.5" dy="17.667">경계의 자리를 옮기려면 기울기를 바꾸거나 문턱을 바꾸면 된다</tspan></text></g><g ><g class="shape"><path d="M337 1379h494v98H337z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="584" y="1417.5" class="text-bold fill-N1 s1"><tspan x="584" dy="0">셋은 서로 배타적이지 않다</tspan><tspan x="584" dy="17.667">한 배에서 세 기작이 함께 작동하고,</tspan><tspan x="584" dy="17.667">앞 단계의 산물이 뒷 단계의 근원이 되는 일이 흔하다</tspan></text></g><g ><g class="shape"><path d="M614 520h305v98H614z" class="stroke-B1 fill-B5 s0"/></g><text x="766.5" y="558.5" class="text-bold fill-N1 s1"><tspan x="766.5" dy="0">근원 쪽 (농도 높음)</tspan><tspan x="766.5" dy="17.667">문턱 1 과 문턱 2 를 모두 넘는다</tspan><tspan x="766.5" dy="17.667">→ 유전자 집합 A 가 켜진다</tspan></text></g><g ><g class="shape"><path d="M636 779h262v98H636z" class="stroke-B1 fill-B5 s0"/></g><text x="767" y="817.5" class="text-bold fill-N1 s1"><tspan x="767" dy="0">가운데 (농도 중간)</tspan><tspan x="767" dy="17.667">문턱 1 만 넘는다</tspan><tspan x="767" dy="17.667">→ 유전자 집합 B 가 켜진다</tspan></text></g><g ><g class="shape"><path d="M636 1038h262v98H636z" class="stroke-B1 fill-B5 s0"/></g><text x="767" y="1076.5" class="text-bold fill-N1 s1"><tspan x="767" dy="0">먼 쪽 (농도 낮음)</tspan><tspan x="767" dy="17.667">어느 문턱도 넘지 못한다</tspan><tspan x="767" dy="17.667">→ 유전자 집합 C 가 켜진다</tspan></text></g><marker id="mk-d2-3854651921-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3854651921-3488378134)" d="M309.75 80v28s0 10-10 10H157s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3854651921)"/><path fill="none" marker-end="url(#mk-d2-3854651921-3488378134)" d="M448.5 80v74" class="connection stroke-B1 s0" mask="url(#d2-3854651921)"/><path fill="none" marker-end="url(#mk-d2-3854651921-3488378134)" d="M587.25 80v28s0 10 10 10H757s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3854651921)"/><path fill="none" marker-end="url(#mk-d2-3854651921-3488378134)" d="M767 620v155" class="connection stroke-B1 s0" mask="url(#d2-3854651921)"/><text x="767" y="704" class="text-italic fill-N2 s1">멀어지면서 농도가 떨어진다</text><path fill="none" marker-end="url(#mk-d2-3854651921-3488378134)" d="M767 879v155" class="connection stroke-B1 s0" mask="url(#d2-3854651921)"/><text x="767.5" y="963" class="text-italic fill-N2 s1">계속 떨어진다</text><path fill="none" marker-end="url(#mk-d2-3854651921-3488378134)" d="M767 306v210" class="connection stroke-B1 s0" mask="url(#d2-3854651921)"/><text x="767" y="418" class="text-italic fill-N2 s1">근원에서 퍼져 나간다</text><path fill="none" marker-end="url(#mk-d2-3854651921-3488378134)" d="M767 1138v119" class="connection stroke-B1 s0" mask="url(#d2-3854651921)"/><mask id="d2-3854651921" width="1347" height="1667" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1347v1667H-89z"/><path d="M646 688h242v21H646zM706 947h123v21H706zM675 402h184v21H675z"/></mask></svg>