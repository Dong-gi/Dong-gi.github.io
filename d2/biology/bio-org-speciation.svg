<svg xmlns="http://www.w3.org/2000/svg" width="1069" height="2248" class="d2-3137147548 d2-svg" viewBox="-89 -89 1069 2248"><rect width="1069" height="2248" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3137147548 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3137147548 .fill-N1{fill:#0a0f25}.d2-3137147548 .fill-B4{fill:#e3e9fd}.d2-3137147548 .fill-B5{fill:#edf0fd}.d2-3137147548 .fill-B6{fill:#f7f8fe}.d2-3137147548 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M327 12h313v82H327z" class="stroke-B1 fill-B6 s0"/></g><text x="483.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="483.5" dy="0">하나의 집단</tspan><tspan x="483.5" dy="18.5">구성원끼리 자유롭게 교배한다</tspan></text></g><g ><g class="shape"><path d="M297 174h372v590H297z" class="stroke-B1 fill-B4 s0"/></g><text x="483" y="207" class="fill-N1 s2"><tspan x="483" dy="0">이소적 종분화</tspan><tspan x="483" dy="32">(allopatric)</tspan></text></g><g ><g class="shape"><path d="M12 1352h416v512H12z" class="stroke-B1 fill-B4 s0"/></g><text x="220" y="1385" class="fill-N1 s2"><tspan x="220" dy="0">동소적 종분화</tspan><tspan x="220" dy="32">(sympatric)</tspan></text></g><g ><g class="shape"><path d="M545 834h334v438H545z" class="stroke-B1 fill-B4 s0"/></g><text x="712" y="867" class="fill-N1 s2"><tspan x="712" dy="0">인접분포적 종분화</tspan><tspan x="712" dy="32">(parapatric)</tspan></text></g><g ><g class="shape"><path d="M489 1452h217v210H489z" class="stroke-B1 fill-B6 s0"/></g><text x="597.5" y="1490.5" class="text-bold fill-N1 s1"><tspan x="597.5" dy="0">강화</tspan><tspan x="597.5" dy="16.5">(reinforcement)</tspan><tspan x="597.5" dy="16.5">잡종의 적응도가</tspan><tspan x="597.5" dy="16.5">낮으면</tspan><tspan x="597.5" dy="16.5">&apos;잘못된 짝을</tspan><tspan x="597.5" dy="16.5">고르지 않는 형질&apos;이</tspan><tspan x="597.5" dy="16.5">선택된다</tspan><tspan x="597.5" dy="16.5">→ 접합 전 격리가</tspan><tspan x="597.5" dy="16.5">나중에</tspan><tspan x="597.5" dy="16.5">더 단단해진다</tspan></text></g><g ><g class="shape"><path d="M315 1944h229v114H315z" class="stroke-B1 fill-B6 s0"/></g><text x="429.5" y="1982.5" class="text-bold fill-N1 s1"><tspan x="429.5" dy="0">생식적 격리 완성</tspan><tspan x="429.5" dy="17.25">= 두 종</tspan><tspan x="429.5" dy="17.25">서로의 유전자 풀이</tspan><tspan x="429.5" dy="17.25">독립적으로 진화한다</tspan></text></g><g ><g class="shape"><path d="M347 248h272v82H347z" class="stroke-B1 fill-B5 s0"/></g><text x="483" y="286.5" class="text-bold fill-N1 s1"><tspan x="483" dy="0">강, 산맥, 바다, 빙하가</tspan><tspan x="483" dy="18.5">집단을 물리적으로 가른다</tspan></text></g><g ><g class="shape"><path d="M367 400h232v114H367z" class="stroke-B1 fill-B5 s0"/></g><text x="483" y="438.5" class="text-bold fill-N1 s1"><tspan x="483" dy="0">두 집단이 각자</tspan><tspan x="483" dy="17.25">부동과 선택을 겪는다</tspan><tspan x="483" dy="17.25">환경이 다르면</tspan><tspan x="483" dy="17.25">다른 방향으로 간다</tspan></text></g><g ><g class="shape"><path d="M389 584h188v130H389z" class="stroke-B1 fill-B5 s0"/></g><text x="483" y="622.5" class="text-bold fill-N1 s1"><tspan x="483" dy="0">차이가 쌓여</tspan><tspan x="483" dy="17">다시 만나도</tspan><tspan x="483" dy="17">교배하지 않거나</tspan><tspan x="483" dy="17">교배해도 자손이</tspan><tspan x="483" dy="17">살지 못한다</tspan></text></g><g ><g class="shape"><path d="M136 1426h168v114H136z" class="stroke-B1 fill-B5 s0"/></g><text x="220" y="1464.5" class="text-bold fill-N1 s1"><tspan x="220" dy="0">같은 지역에</tspan><tspan x="220" dy="17.25">있으면서</tspan><tspan x="220" dy="17.25">유전자 흐름을</tspan><tspan x="220" dy="17.25">이겨야 한다</tspan></text></g><g ><g class="shape"><path d="M62 1620h148v194H62z" class="stroke-B1 fill-B5 s0"/></g><text x="136" y="1658.5" class="text-bold fill-N1 s1"><tspan x="136" dy="0">배수체화 —</tspan><tspan x="136" dy="16.556">유전체가</tspan><tspan x="136" dy="16.556">배가되어</tspan><tspan x="136" dy="16.556">한 세대에</tspan><tspan x="136" dy="16.556">부모 종과</tspan><tspan x="136" dy="16.556">교배 불가가</tspan><tspan x="136" dy="16.556">된다</tspan><tspan x="136" dy="16.556">식물에서</tspan><tspan x="136" dy="16.556">흔하다</tspan></text></g><g ><g class="shape"><path d="M230 1620h148v146H230z" class="stroke-B1 fill-B5 s0"/></g><text x="304" y="1658.5" class="text-bold fill-N1 s1"><tspan x="304" dy="0">숙주나</tspan><tspan x="304" dy="16.833">서식 층위</tspan><tspan x="304" dy="16.833">전환 —</tspan><tspan x="304" dy="16.833">짝을 만나는</tspan><tspan x="304" dy="16.833">자리가</tspan><tspan x="304" dy="16.833">갈린다</tspan></text></g><g ><g class="shape"><path d="M606 908h212v98H606z" class="stroke-B1 fill-B5 s0"/></g><text x="712" y="946.5" class="text-bold fill-N1 s1"><tspan x="712" dy="0">분포가 맞닿아 있고</tspan><tspan x="712" dy="17.667">접촉면에서만</tspan><tspan x="712" dy="17.667">잡종이 생긴다</tspan></text></g><g ><g class="shape"><path d="M606 1076h212v146H606z" class="stroke-B1 fill-B5 s0"/></g><text x="712" y="1114.5" class="text-bold fill-N1 s1"><tspan x="712" dy="0">환경 기울기를 따라</tspan><tspan x="712" dy="16.833">다른 방향의</tspan><tspan x="712" dy="16.833">선택이 걸린다</tspan><tspan x="712" dy="16.833">선택이</tspan><tspan x="712" dy="16.833">유전자 흐름보다</tspan><tspan x="712" dy="16.833">강해야 성립한다</tspan></text></g><marker id="mk-d2-3137147548-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3137147548-3488378134)" d="M483.666 332v64" class="connection stroke-B1 s0" mask="url(#d2-3137147548)"/><path fill="none" marker-end="url(#mk-d2-3137147548-3488378134)" d="M483.666 516v64" class="connection stroke-B1 s0" mask="url(#d2-3137147548)"/><path fill="none" marker-end="url(#mk-d2-3137147548-3488378134)" d="M192 1542v28s0 10-10 10h-36s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3137147548)"/><path fill="none" marker-end="url(#mk-d2-3137147548-3488378134)"