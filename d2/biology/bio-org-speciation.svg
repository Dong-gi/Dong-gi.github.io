<svg xmlns="http://www.w3.org/2000/svg" width="1439" height="1968" class="d2-1653858421 d2-svg" viewBox="-89 -89 1439 1968"><rect width="1439" height="1968" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1653858421 .fill-N1{fill:#0a0f25}.d2-1653858421 .fill-B4{fill:#e3e9fd}.d2-1653858421 .fill-B5{fill:#edf0fd}.d2-1653858421 .fill-B6{fill:#f7f8fe}.d2-1653858421 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M532 12h313v82H532z" class="stroke-B1 fill-B6 s0"/></g><text x="688.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="688.5" dy="0">하나의 집단</tspan><tspan x="688.5" dy="18.5">구성원끼리 자유롭게 교배한다</tspan></text></g><g ><g class="shape"><path d="M468 174h440v518H468z" class="stroke-B1 fill-B4 s0"/></g><text x="688" y="207" class="fill-N1 s2">이소적 종분화 (allopatric)</text></g><g ><g class="shape"><path d="M12 1208h611v392H12z" class="stroke-B1 fill-B4 s0"/></g><text x="317.5" y="1241" class="fill-N1 s2">동소적 종분화 (sympatric)</text></g><g ><g class="shape"><path d="M770 762h479v366H770z" class="stroke-B1 fill-B4 s0"/></g><text x="1009.5" y="795" class="fill-N1 s2">인접분포적 종분화 (parapatric)</text></g><g ><g class="shape"><path d="M643 1300h413v114H643z" class="stroke-B1 fill-B6 s0"/></g><text x="849.5" y="1338.5" class="text-bold fill-N1 s1"><tspan x="849.5" dy="0">강화 (reinforcement)</tspan><tspan x="849.5" dy="17.25">잡종의 적응도가 낮으면</tspan><tspan x="849.5" dy="17.25">&apos;잘못된 짝을 고르지 않는 형질&apos;이 선택된다</tspan><tspan x="849.5" dy="17.25">→ 접합 전 격리가 나중에 더 단단해진다</tspan></text></g><g ><g class="shape"><path d="M383 1680h400v98H383z" class="stroke-B1 fill-B6 s0"/></g><text x="583" y="1718.5" class="text-bold fill-N1 s1"><tspan x="583" dy="0">생식적 격리 완성</tspan><tspan x="583" dy="17.667">= 두 종</tspan><tspan x="583" dy="17.667">서로의 유전자 풀이 독립적으로 진화한다</tspan></text></g><g ><g class="shape"><path d="M552 224h272v82H552z" class="stroke-B1 fill-B5 s0"/></g><text x="688" y="262.5" class="text-bold fill-N1 s1"><tspan x="688" dy="0">강, 산맥, 바다, 빙하가</tspan><tspan x="688" dy="18.5">집단을 물리적으로 가른다</tspan></text></g><g ><g class="shape"><path d="M518 376h340v98H518z" class="stroke-B1 fill-B5 s0"/></g><text x="688" y="414.5" class="text-bold fill-N1 s1"><tspan x="688" dy="0">두 집단이 각자</tspan><tspan x="688" dy="17.667">부동과 선택을 겪는다</tspan><tspan x="688" dy="17.667">환경이 다르면 다른 방향으로 간다</tspan></text></g><g ><g class="shape"><path d="M540 544h296v98H540z" class="stroke-B1 fill-B5 s0"/></g><text x="688" y="582.5" class="text-bold fill-N1 s1"><tspan x="688" dy="0">차이가 쌓여</tspan><tspan x="688" dy="17.667">다시 만나도 교배하지 않거나</tspan><tspan x="688" dy="17.667">교배해도 자손이 살지 못한다</tspan></text></g><g ><g class="shape"><path d="M164 1258h276v82H164z" class="stroke-B1 fill-B5 s0"/></g><text x="302" y="1296.5" class="text-bold fill-N1 s1"><tspan x="302" dy="0">같은 지역에 있으면서</tspan><tspan x="302" dy="18.5">유전자 흐름을 이겨야 한다</tspan></text></g><g ><g class="shape"><path d="M62 1420h215v130H62z" class="stroke-B1 fill-B5 s0"/></g><text x="169.5" y="1458.5" class="text-bold fill-N1 s1"><tspan x="169.5" dy="0">배수체화 —</tspan><tspan x="169.5" dy="17">유전체가 배가되어</tspan><tspan x="169.5" dy="17">한 세대에 부모 종과</tspan><tspan x="169.5" dy="17">교배 불가가 된다</tspan><tspan x="169.5" dy="17">식물에서 흔하다</tspan></text></g><g ><g class="shape"><path d="M297 1420h276v82H297z" class="stroke-B1 fill-B5 s0"/></g><text x="435" y="1458.5" class="text-bold fill-N1 s1"><tspan x="435" dy="0">숙주나 서식 층위 전환 —</tspan><tspan x="435" dy="18.5">짝을 만나는 자리가 갈린다</tspan></text></g><g ><g class="shape"><path d="M863 812h293v82H863z" class="stroke-B1 fill-B5 s0"/></g><text x="1009.5" y="850.5" class="text-bold fill-N1 s1"><tspan x="1009.5" dy="0">분포가 맞닿아 있고</tspan><tspan x="1009.5" dy="18.5">접촉면에서만 잡종이 생긴다</tspan></text></g><g ><g class="shape"><path d="M872 964h276v114H872z" class="stroke-B1 fill-B5 s0"/></g><text x="1010" y="1002.5" class="text-bold fill-N1 s1"><tspan x="1010" dy="0">환경 기울기를 따라</tspan><tspan x="1010" dy="17.25">다른 방향의 선택이 걸린다</tspan><tspan x="1010" dy="17.25">선택이 유전자 흐름보다</tspan><tspan x="1010" dy="17.25">강해야 성립한다</tspan></text></g><marker id="mk-d2-1653858421-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M688.75 308v64" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M688.75 476v64" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M256.25 1342v74" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M348.25 1342v74" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M1010.25 896v64" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M688.75 96v74" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M610.5 96v28s0 10-10 10h-273s-10 0-10 10v1060" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M767 96v28s0 10 10 10h223.25s10 0 10 10v614" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M688.75 694v603" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><text x="689" y="1002" style="fill:#676c7e;text-anchor:middle;font-size:16px">다시 만났을 때</text><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M516.833 1602v74" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M918.333 1130v167" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><path fill="none" marker-end="url(#mk-d2-1653858421-3488378134)" d="M849.5 1417v213s0 10-10 10H660.166s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-1653858421)"/><mask id="d2-1653858421" width="1439" height="1968" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1439v1968H-89z"/><path d="M626 986h126v21H626z"/></mask></svg>