<svg xmlns="http://www.w3.org/2000/svg" width="2130" height="1497" class="d2-378742104 d2-svg" viewBox="-91 -101 2130 1497"><rect width="2130" height="1497" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-378742104 .fill-N1{fill:#0a0f25}.d2-378742104 .fill-B4{fill:#e3e9fd}.d2-378742104 .fill-B5{fill:#edf0fd}.d2-378742104 .fill-B6{fill:#f7f8fe}.d2-378742104 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M887 0h313v82H887z" class="stroke-B1 fill-B6 s0"/></g><text x="1043.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1043.5" dy="0">하나의 집단</tspan><tspan x="1043.5" dy="18.5">구성원끼리 자유롭게 교배한다</tspan></text></g><g ><g class="shape"><path d="M812 202h463v590H812z" class="stroke-B1 fill-B4 s0"/></g><text x="1043.5" y="161" class="fill-N1 s2"><tspan x="1043.5" dy="0">이소적 종분화 (allopatric)</tspan><tspan x="1043.5" dy="32">강, 산맥, 바다, 빙하가 집단을 물리적으로 가른다</tspan></text></g><g ><g class="shape"><path d="M10 658h762v411H10z" class="stroke-B1 fill-B4 s0"/></g><text x="391" y="617" class="fill-N1 s2"><tspan x="391" dy="0">동소적 종분화 (sympatric)</tspan><tspan x="391" dy="32">같은 지역에 있으면서 유전자 흐름을 이겨야 한다</tspan></text></g><g ><g class="shape"><path d="M1315 426h507v366h-507z" class="stroke-B1 fill-B4 s0"/></g><text x="1568.5" y="385" class="fill-N1 s2"><tspan x="1568.5" dy="0">인접분포적 종분화 (parapatric)</tspan><tspan x="1568.5" dy="32">분포가 맞닿아 있고 접촉면에서만 잡종이 생긴다</tspan></text></g><g ><g class="shape"><path d="M1100 933h413v114h-413z" class="stroke-B1 fill-B6 s0"/></g><text x="1306.5" y="971.5" class="text-bold fill-N1 s1"><tspan x="1306.5" dy="0">강화 (reinforcement)</tspan><tspan x="1306.5" dy="17.25">잡종의 적응도가 낮으면</tspan><tspan x="1306.5" dy="17.25">&apos;잘못된 짝을 고르지 않는 형질&apos;이 선택된다</tspan><tspan x="1306.5" dy="17.25">→ 접합 전 격리가 나중에 더 단단해진다</tspan></text></g><g ><g class="shape"><path d="M886 1197h400v98H886z" class="stroke-B1 fill-B6 s0"/></g><text x="1086" y="1235.5" class="text-bold fill-N1 s1"><tspan x="1086" dy="0">생식적 격리 완성</tspan><tspan x="1086" dy="17.667">= 두 종</tspan><tspan x="1086" dy="17.667">서로의 유전자 풀이 독립적으로 진화한다</tspan></text></g><g ><g class="shape"><path d="M862 448h363v82H862z" class="stroke-B1 fill-B5 s0"/></g><text x="1043.5" y="486.5" class="text-bold fill-N1 s1"><tspan x="1043.5" dy="0">두 집단이 각자 부동과 선택을 겪는다</tspan><tspan x="1043.5" dy="18.5">환경이 다르면 다른 방향으로 간다</tspan></text></g><g ><g class="shape"><path d="M842 680h403v82H842z" class="stroke-B1 fill-B5 s0"/></g><text x="1043.5" y="718.5" class="text-bold fill-N1 s1"><tspan x="1043.5" dy="0">차이가 쌓여 다시 만나도 교배하지 않거나</tspan><tspan x="1043.5" dy="18.5">교배해도 자손이 살지 못한다</tspan></text></g><g ><g class="shape"><path d="M1002 232h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="1044" y="270.5" class="text-bold fill-N1 s1">이소</text></g><g ><g class="shape"><path d="M40 941h366v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="223" y="979.5" class="text-bold fill-N1 s1"><tspan x="223" dy="0">배수체화 — 유전체가 배가되어</tspan><tspan x="223" dy="17.667">한 세대에 부모 종과 교배 불가가 된다</tspan><tspan x="223" dy="17.667">식물에서 흔하다</tspan></text></g><g ><g class="shape"><path d="M466 949h276v82H466z" class="stroke-B1 fill-B5 s0"/></g><text x="604" y="987.5" class="text-bold fill-N1 s1"><tspan x="604" dy="0">숙주나 서식 층위 전환 —</tspan><tspan x="604" dy="18.5">짝을 만나는 자리가 갈린다</tspan></text></g><g ><g class="shape"><path d="M372 688h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="414" y="726.5" class="text-bold fill-N1 s1">동소</text></g><g ><g class="shape"><path d="M1345 680h447v82h-447z" class="stroke-B1 fill-B5 s0"/></g><text x="1568.5" y="718.5" class="text-bold fill-N1 s1"><tspan x="1568.5" dy="0">환경 기울기를 따라 다른 방향의 선택이 걸린다</tspan><tspan x="1568.5" dy="18.5">선택이 유전자 흐름보다 강해야 성립한다</tspan></text></g><g ><g class="shape"><path d="M1527 456h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="1569" y="494.5" class="text-bold fill-N1 s1">인접</text></g><marker id="mk-d2-378742104-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-378742104-3488378134)" d="M1043.5 300v144" class="connection stroke-B1 s0" mask="url(#d2-378742104)"/><path fill="none" marker-end="url(#mk-d2-378742104-3488378134)" d="M1043.5 532v144" class="connection stroke-B1 s0" mask="url(#d2-378742104)"/><path fill="none" marker-end="url(#mk-d2-378742104-3488378134)" d="M369.695 741.924C252.7 797.812 223 886.3 223 937.5" class="connection stroke-B1 s0" mask="url(#d2-378742104)"/><path fill="none" marker-end="url(#mk-d2-378742104-3488378134)" d="M458.302 741.929C574.5 797.812 604 887.9 604 945.5" class="connection stroke-B1 s0" mask="url(#d2-378742104)"/><path fill="none" marker-end="url(#mk-d2-378742104-3488378134)" d="M1568.5 524v152" class="connection stroke-B1 s0" mask="url(#d2-378742104)"/><path fill="none" marker-end="url(#mk-d2-378742104-3488378134)" d="M1043.5 84v45" class="connection stroke-B1 s0" mask="url(#d2-378742104)"/><path fill="none" marker-end="url(#mk-d2-378742104-3488378134)" d="M885.52 64.284C508.3 118.4 413.5 142 413.5 157v428" class="connection stroke-B1 s0" mask="url(#d2-378742104)"/><path fill="none" marker-end="url(#mk-d2-378742104-3488378134)" d="M1201.47 68.342C1494.7 119.2 1568.5 142 1568.5 157v196" class="connection stroke-B1 s0" mask="url(#d2-378742104)"/><path fill="none" marker-end="url(#mk-d2-378742104-3488378134)" d="M1043.5 793.5c0 62.8 26.8 91.2 130.36 138.343" class="connection stroke-B1 s0" mask="url(#d2-378742104)"/><text x="1077" y="893" style="fill:#676c7e;text-anchor:middle;font-size:16px">다시 만났을 때</text><path fill="none" marker-end="url(#mk-d2-378742104-3488378134)" d="M604 1071c0 60.4 56.4 87.6 278.082 133.194" class="connection strok