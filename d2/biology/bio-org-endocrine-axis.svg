<svg xmlns="http://www.w3.org/2000/svg" width="886" height="1492" class="d2-2840960512 d2-svg" viewBox="-101 -101 886 1492"><rect width="886" height="1492" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2840960512 .text-bold{font-weight:700}.d2-2840960512 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2840960512 .fill-N1{fill:#0a0f25}.d2-2840960512 .fill-N2{fill:#676c7e}.d2-2840960512 .fill-B5{fill:#edf0fd}.d2-2840960512 .fill-B6{fill:#f7f8fe}.d2-2840960512 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M251 0h217v82H251z" class="stroke-B1 fill-B6 s0"/></g><text x="359.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="359.5" dy="0">시상하부</tspan><tspan x="359.5" dy="18.5">방출호르몬 (예: TRH)</tspan></text></g><g ><g class="shape"><path d="M106 182h216v82H106z" class="stroke-B1 fill-B6 s0"/></g><text x="214" y="220.5" class="text-bold fill-N1 s1"><tspan x="214" dy="0">뇌하수체</tspan><tspan x="214" dy="18.5">자극호르몬 (예: TSH)</tspan></text></g><g ><g class="shape"><path d="M120 401h272v82H120z" class="stroke-B1 fill-B6 s0"/></g><text x="256" y="439.5" class="text-bold fill-N1 s1"><tspan x="256" dy="0">표적 내분비샘 (예: 갑상샘)</tspan><tspan x="256" dy="18.5">최종 호르몬 (예: T4)</tspan></text></g><g ><g class="shape"><path d="M0 678h232v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="116" y="716.5" class="text-bold fill-N1 s1"><tspan x="116" dy="0">표적 조직</tspan><tspan x="116" dy="17.667">수용체를 가진</tspan><tspan x="116" dy="17.667">모든 세포에 작용한다</tspan></text></g><g ><g class="shape"><path d="M319 624h365v516H319z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="501.5" y="611" class="fill-N1" style="text-anchor:middle;font-size:28px">판정 규칙</text></g><g ><g class="shape"><path d="M152 1160h380v130H152z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="342" y="1198.5" class="text-bold fill-N1 s1"><tspan x="342" dy="0">마지막 줄이 특히 쓸모 있다</tspan><tspan x="342" dy="17">호르몬도 높고 자극호르몬도 높다면</tspan><tspan x="342" dy="17">표적이 반응하지 못하고 있다는 뜻이다</tspan><tspan x="342" dy="17">혈당과 인슐린이 함께 높은</tspan><tspan x="342" dy="17">인슐린 저항성이 같은 논리다</tspan></text></g><g ><g class="shape"><path d="M365 654h272v146H365z" class="stroke-B1 fill-B5 s0"/></g><text x="501" y="692.5" class="text-bold fill-N1 s1"><tspan x="501" dy="0">최종 호르몬이 낮으면</tspan><tspan x="501" dy="16.833">억제가 풀리므로</tspan><tspan x="501" dy="16.833">정상 뇌하수체는</tspan><tspan x="501" dy="16.833">자극호르몬을 늘려야 한다</tspan><tspan x="501" dy="16.833">그러지 않았다면</tspan><tspan x="501" dy="16.833">위 단계가 고장 난 것이다</tspan></text></g><g ><g class="shape"><path d="M349 900h305v210H349z" class="stroke-B1 fill-B5 s0"/></g><text x="501.5" y="938.5" class="text-bold fill-N1 s1"><tspan x="501.5" dy="0">최종 낮음 + 자극 높음 →</tspan><tspan x="501.5" dy="16.5">말단 샘의 결함 (일차성)</tspan><tspan x="501.5" dy="16.5">최종 낮음 + 자극 낮거나 정상 →</tspan><tspan x="501.5" dy="16.5">위 단계의 결함 (이차성 이상)</tspan><tspan x="501.5" dy="16.5">최종 높음 + 자극 낮음 →</tspan><tspan x="501.5" dy="16.5">말단 샘의 자율적 과다 분비</tspan><tspan x="501.5" dy="16.5">(되먹임은 정상)</tspan><tspan x="501.5" dy="16.5">최종 높음 + 자극 높음 →</tspan><tspan x="501.5" dy="16.5">위 단계의 과다 분비,</tspan><tspan x="501.5" dy="16.5">또는 표적 조직의 저항성</tspan></text></g><marker id="mk-d2-2840960512-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2840960512-3488378134)" d="M292.304 83.06C230 122 214 142 214 178" class="connection stroke-B1 s0" mask="url(#d2-2840960512)"/><path fill="none" marker-end="url(#mk-d2-2840960512-3488378134)" d="M189.785 265.252C160.35 318.7 165.75 346.3 215.007 398.588" class="connection stroke-B1 s0" mask="url(#d2-2840960512)"/><path fill="none" marker-end="url(#mk-d2-2840960512-3488378134)" d="M197.388 483.684C132.6 531.3 116 618.8 116 674" class="connection stroke-B1 s0" mask="url(#d2-2840960512)"/><path fill="none" marker-end="url(#mk-d2-2840960512-3488378134)" d="M256 399.5c0-53.2-5.2-80.8-24.59-132.257" class="connection stroke-B1 s0" mask="url(#d2-2840960512)"/><text x="253" y="328" class="text-italic fill-N2 s1"><tspan x="253" dy="0">억제</tspan><tspan x="253" dy="18.5">(음성 되먹임)</tspan></text><path fill="none" marker-end="url(#mk-d2-2840960512-3488378134)" d="M367.121 400.794C511.65 346.3 548.25 310.6 548.25 277.75c0-32.851-20.8-155.75-100.395-194.017" class="connection stroke-B1 s0" mask="url(#d2-2840960512)"/><text x="548.5" y="279" class="text-italic fill-N2 s1">억제</text><path fill="none" marker-end="url(#mk-d2-2840960512-3488378134)" d="M501.25 802v94" class="connection stroke-B1 s0" mask="url(#d2-2840960512)"/><path fill="none" marker-end="url(#mk-d2-2840960512-3488378134)" d="M310.833 483.722C372.45 531.3 397.45 614 431.542 651.056" class="connection stroke-B1 s0" mask="url(#d2-2840960512)"/><text x="381" y="566" class="text-italic fill-N2 s1">이 값을 읽는다</text><path fill="none" marker-end="url(#mk-d2-2840960512-3488378134)" d="M323.42 255.063C534.3 316.9 587.5 354.4 587.5 387.25v105.5c0 30.45-7 121.25-32.706 157.973" class="connection stroke-B1 s0" mask="url(#d2-2840960512)"/><text x="588" y="363" class="text-italic fill-N2 s1"><tspan x="588" dy="0">이 값도</tspan><tspan x="588" dy="18.5">함께 읽는다</tspan></text><mask id="d2-2840960512" width="886" height="1492" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h886v1492h-886z"/><path d="M197 312h112v37H197zM527 263h43v21h-43zM318 550h126v21H318zM536 347h104v37H536z"/></mask></svg>