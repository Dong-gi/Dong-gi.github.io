<svg xmlns="http://www.w3.org/2000/svg" width="1459" height="1198" class="d2-2719773683 d2-svg" viewBox="-101 -101 1459 1198"><rect width="1459" height="1198" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2719773683 .fill-N1{fill:#0a0f25}.d2-2719773683 .fill-N2{fill:#676c7e}.d2-2719773683 .fill-B5{fill:#edf0fd}.d2-2719773683 .fill-B6{fill:#f7f8fe}.d2-2719773683 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M284 8h217v82H284z" class="stroke-B1 fill-B6 s0"/></g><text x="392.5" y="46.5" class="text-bold fill-N1 s1"><tspan x="392.5" dy="0">시상하부</tspan><tspan x="392.5" dy="18.5">방출호르몬 (예: TRH)</tspan></text></g><g ><g class="shape"><path d="M201 198h216v82H201z" class="stroke-B1 fill-B6 s0"/></g><text x="309" y="236.5" class="text-bold fill-N1 s1"><tspan x="309" dy="0">뇌하수체</tspan><tspan x="309" dy="18.5">자극호르몬 (예: TSH)</tspan></text></g><g ><g class="shape"><path d="M232 401h272v82H232z" class="stroke-B1 fill-B6 s0"/></g><text x="368" y="439.5" class="text-bold fill-N1 s1"><tspan x="368" dy="0">표적 내분비샘 (예: 갑상샘)</tspan><tspan x="368" dy="18.5">최종 호르몬 (예: T4)</tspan></text></g><g ><g class="shape"><path d="M0 662h360v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="180" y="700.5" class="text-bold fill-N1 s1"><tspan x="180" dy="0">표적 조직</tspan><tspan x="180" dy="18.5">수용체를 가진 모든 세포에 작용한다</tspan></text></g><g ><g class="shape"><path d="M410 624h695v372H410z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="757.5" y="611" class="fill-N1" style="text-anchor:middle;font-size:28px">판정 규칙</text></g><g ><g class="shape"><path d="M561 0h696v98H561z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="909" y="38.5" class="text-bold fill-N1 s1"><tspan x="909" dy="0">마지막 줄이 특히 쓸모 있다</tspan><tspan x="909" dy="17.667">호르몬도 높고 자극호르몬도 높다면 표적이 반응하지 못하고 있다는 뜻이다</tspan><tspan x="909" dy="17.667">혈당과 인슐린이 함께 높은 인슐린 저항성이 같은 논리다</tspan></text></g><g ><g class="shape"><path d="M548 654h420v98H548z" class="stroke-B1 fill-B5 s0"/></g><text x="758" y="692.5" class="text-bold fill-N1 s1"><tspan x="758" dy="0">최종 호르몬이 낮으면 억제가 풀리므로</tspan><tspan x="758" dy="17.667">정상 뇌하수체는 자극호르몬을 늘려야 한다</tspan><tspan x="758" dy="17.667">그러지 않았다면 위 단계가 고장 난 것이다</tspan></text></g><g ><g class="shape"><path d="M440 852h635v114H440z" class="stroke-B1 fill-B5 s0"/></g><text x="757.5" y="890.5" class="text-bold fill-N1 s1"><tspan x="757.5" dy="0">최종 낮음 + 자극 높음 → 말단 샘의 결함 (일차성)</tspan><tspan x="757.5" dy="17.25">최종 낮음 + 자극 낮거나 정상 → 위 단계의 결함 (이차성 이상)</tspan><tspan x="757.5" dy="17.25">최종 높음 + 자극 낮음 → 말단 샘의 자율적 과다 분비 (되먹임은 정상)</tspan><tspan x="757.5" dy="17.25">최종 높음 + 자극 높음 → 위 단계의 과다 분비, 또는 표적 조직의 저항성</tspan></text></g><marker id="mk-d2-2719773683-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2719773683-3488378134)" d="M356.21 91.528C318.3 136.4 308.5 158 308.5 194" class="connection stroke-B1 s0" mask="url(#d2-2719773683)"/><path fill="none" marker-end="url(#mk-d2-2719773683-3488378134)" d="M265.063 280.891C216.1 328.3 222.9 352.7 297.113 399.371" class="connection stroke-B1 s0" mask="url(#d2-2719773683)"/><path fill="none" marker-end="url(#mk-d2-2719773683-3488378134)" d="M290.244 483.457C202.399 531.3 180 615.6 180 658" class="connection stroke-B1 s0" mask="url(#d2-2719773683)"/><path fill="none" marker-end="url(#mk-d2-2719773683-3488378134)" d="M342.505 399.765C315.5 352.7 308.5 328.3 308.5 283.5" class="connection stroke-B1 s0" mask="url(#d2-2719773683)"/><text x="313" y="350" class="text-italic fill-N2 s1">억제 (음성 되먹임)</text><path fill="none" marker-end="url(#mk-d2-2719773683-3488378134)" d="M505.706 413.084C778.15 355.1 846.75 320.2 846.75 289.75S777.55 133 504.66 73.847" class="connection stroke-B1 s0" mask="url(#d2-2719773683)"/><text x="844.5" y="261" class="text-italic fill-N2 s1">억제</text><path fill="none" marker-end="url(#mk-d2-2719773683-3488378134)" d="M757.5 754v94" class="connection stroke-B1 s0" mask="url(#d2-2719773683)"/><path fill="none" marker-end="url(#mk-d2-2719773683-3488378134)" d="M475.361 483.232C597.5 531.3 641.5 614 690.33 651.562" class="connection stroke-B1 s0" mask="url(#d2-2719773683)"/><text x="604" y="548" class="text-italic fill-N2 s1">이 값을 읽는다</text><path fill="none" marker-end="url(#mk-d2-2719773683-3488378134)" d="M419.473 257.07C824.5 323.749 926.25 360.8 926.25 391.25v101.5c0 30.45-17 121.25-81.552 159.222" class="connection stroke-B1 s0" mask="url(#d2-2719773683)"/><text x="838" y="334" class="text-italic fill-N2 s1">이 값도 함께 읽는다</text><mask id="d2-2719773683" width="1459" height="1198" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1459v1198H-101z"/><path d="M236 334h154v21H236zM823 245h43v21h-43zM541 532h126v21H541zM754 318h168v21H754z"/></mask></svg>