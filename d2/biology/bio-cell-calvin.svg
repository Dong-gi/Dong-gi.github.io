<svg xmlns="http://www.w3.org/2000/svg" width="3303" height="533" class="d2-2965876884 d2-svg" viewBox="-101 -101 3303 533"><rect width="3303" height="533" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2965876884 .fill-N1{fill:#0a0f25}.d2-2965876884 .fill-N2{fill:#676c7e}.d2-2965876884 .fill-B6{fill:#f7f8fe}.d2-2965876884 .stroke-B1,.d2-2965876884 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2;stroke-dasharray:6,5.919384}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2}</style><g ><g class="shape"><path d="M3 75h258v82H3z" class="stroke-B2 fill-B6 s0"/></g><text x="132" y="113.5" class="text-bold fill-N1 s1"><tspan x="132" dy="0">명반응 (틸라코이드 막)</tspan><tspan x="132" dy="18.5">ATP 와 NADPH 를 공급한다</tspan></text></g><g ><g class="shape"><path d="M1985 8h209v82h-209z" class="stroke-B1 fill-B6 s2"/></g><text x="2089.5" y="46.5" class="text-bold fill-N1 s1"><tspan x="2089.5" dy="0">CO2 3분자</tspan><tspan x="2089.5" dy="18.5">공기에서 들어온다</tspan></text></g><g ><g class="shape"><path d="M2361 63h434v114h-434z" class="stroke-B1 fill-B6 s2"/></g><text x="2578" y="101.5" class="text-bold fill-N1 s1"><tspan x="2578" dy="0">1. 카복실화</tspan><tspan x="2578" dy="17.25">루비스코가 RuBP(탄소 5개)에 CO2 를 붙인다</tspan><tspan x="2578" dy="17.25">곧바로 쪼개져 3-PGA(탄소 3개)가 2배로 나온다</tspan><tspan x="2578" dy="17.25">ATP·NADPH 를 쓰지 않는다</tspan></text></g><g ><g class="shape"><path d="M2953 128h148v82h-148z" class="stroke-B1 fill-B6 s2"/></g><text x="3027" y="166.5" class="text-bold fill-N1 s1"><tspan x="3027" dy="0">3-PGA 6분자</tspan><tspan x="3027" dy="18.5">(탄소 3개씩)</tspan></text></g><g ><g class="shape"><path d="M523 5h339v114H523z" class="stroke-B1 fill-B6 s2"/></g><text x="692.5" y="43.5" class="text-bold fill-N1 s1"><tspan x="692.5" dy="0">2. 환원</tspan><tspan x="692.5" dy="17.25">3-PGA 에 인산을 붙이고(ATP 6)</tspan><tspan x="692.5" dy="17.25">전자를 넣어(NADPH 6) G3P 로 만든다</tspan><tspan x="692.5" dy="17.25">여기서 탄소가 실제로 환원된다</tspan></text></g><g ><g class="shape"><path d="M1058 29h125v66h-125z" class="stroke-B1 fill-B6 s2"/></g><text x="1120.5" y="67.5" class="text-bold fill-N1 s1">G3P 6분자</text></g><g ><g class="shape"><path d="M1464 0h349v82h-349z" class="stroke-B1 fill-B6 s2"/></g><text x="1638.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1638.5" dy="0">G3P 1분자만 회로 밖으로 나간다</tspan><tspan x="1638.5" dy="18.5">2분자가 모이면 포도당 하나가 된다</tspan></text></g><g ><g class="shape"><path d="M1459 142h359v98h-359z" class="stroke-B1 fill-B6 s2"/></g><text x="1638.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="1638.5" dy="0">3. 재생</tspan><tspan x="1638.5" dy="17.667">남은 G3P 5분자를 여러 단계로 뒤섞어</tspan><tspan x="1638.5" dy="17.667">RuBP 3분자로 되돌린다 (ATP 3)</tspan></text></g><g ><g class="shape"><path d="M1976 150h227v82h-227z" class="stroke-B1 fill-B6 s2"/></g><text x="2089.5" y="188.5" class="text-bold fill-N1 s1"><tspan x="2089.5" dy="0">RuBP 3분자</tspan><tspan x="2089.5" dy="18.5">다음 CO2 를 받을 준비</tspan></text></g><g ><g class="shape"><path d="M0 217h263v114H0z" class="stroke-B2 fill-B6 s0"/></g><text x="131.5" y="255.5" class="text-bold fill-N1 s1"><tspan x="131.5" dy="0">CO2 3개당 장부</tspan><tspan x="131.5" dy="17.25">들어간 것: ATP 9, NADPH 6</tspan><tspan x="131.5" dy="17.25">나온 것: G3P 1</tspan><tspan x="131.5" dy="17.25">→ CO2 하나당 ATP 3, NADPH 2</tspan></text></g><marker id="mk-d2-2965876884-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2965876884-3488378134)" d="M2196 49c68.4 0 101.8 3.8 161.11 18.065" class="connection stroke-B1 s2" mask="url(#d2-2965876884)"/><path fill="none" marker-end="url(#mk-d2-2965876884-3488378134)" d="M2205 191c61.2 0 92.8-3.8 152.11-18.065" class="connection stroke-B1 s2" mask="url(#d2-2965876884)"/><path fill="none" marker-end="url(#mk-d2-2965876884-3488378134)" d="M2797 120c61.2 0 92.8 5 152.186 23.793" class="connection stroke-B1 s2" mask="url(#d2-2965876884)"/><path fill="none" marker-end="url(#mk-d2-2965876884-3488378134)" d="M2970.09 211.702C2893.537 269.3 2814.8 284 2726 284H1220.75c-60.15 0-300.35-33-455.677-162.44" class="connection stroke-B1 s2" mask="url(#d2-2965876884)"/><path fill="none" marker-end="url(#mk-d2-2965876884-3488378134)" d="M864 61.5h190" class="connection stroke-B1 s2" mask="url(#d2-2965876884)"/><path fill="none" marker-end="url(#mk-d2-2965876884-3488378134)" d="M1184.99 54.798C1293.4 43.8 1349.6 41 1460 41" class="connection stroke-B1 s2" mask="url(#d2-2965876884)"/><text x="1323" y="48" class="text-italic fill-N2 s1">6분자 중 1분자</text><path fill="none" marker-end="url(#mk-d2-2965876884-3488378134)" d="M1184.872 85.205C1293.4 126.1 1348.6 141.3 1455.059 159.815" class="connection stroke-B1 s2" mask="url(#d2-2965876884)"/><text x="1318" y="138" class="text-italic fill-N2 s1">6분자 중 5분자</text><path fill="none" marker-end="url(#mk-d2-2965876884-3488378134)" d="M1820 191h152" class="connection stroke-B1 s2" mask="url(#d2-2965876884)"/><path fill="none" marker-end="url(#mk-d2-2965876884-3488378134)" d="M263.457 88.703C366.7 67.022 419 61.5 519 61.5" class="connection stroke-B1 s2" mask="url(#d2-2965876884)"/><text x="391" y="70" class="text-italic fill-N2 s1">ATP 6, NADPH 6</text><path fill="none" marker-end="url(#mk-d2-2965876884-3488378134)" d="M235.86 157.987C361.2 207.65 452.9 220.25 542.75 220.25h497.5c48.15 0 308.35-2.6 414.768-12.625" class="connection stroke-B1 s2" mask="url(#d2-2965876884)"/><text x="842" y="226" class="text-italic fill-N2 s1">ATP 3</text><mask id="d2-2965876884" width="3303" height="533" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3303v533H-101z"/><path d="M1262 32h122v21h-122zM1257 122h122v21h-122zM338 54h106v21H338zM821 210h42v21h-42z"/></mask></svg>