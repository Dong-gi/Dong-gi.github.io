<svg xmlns="http://www.w3.org/2000/svg" width="1201" height="1433" class="d2-1170995217 d2-svg" viewBox="-89 -89 1201 1433"><rect width="1201" height="1433" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1170995217 .text-bold{font-weight:700}.d2-1170995217 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1170995217 .fill-N1{fill:#0a0f25}.d2-1170995217 .fill-N2{fill:#676c7e}.d2-1170995217 .fill-B6{fill:#f7f8fe}.d2-1170995217 .stroke-B1,.d2-1170995217 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2;stroke-dasharray:6,5.919384}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2}</style><g ><g class="shape"><path d="M129 228h258v82H129z" class="stroke-B2 fill-B6 s0"/></g><text x="258" y="266.5" class="text-bold fill-N1 s1"><tspan x="258" dy="0">명반응 (틸라코이드 막)</tspan><tspan x="258" dy="18.5">ATP 와 NADPH 를 공급한다</tspan></text></g><g ><g class="shape"><path d="M519 44h209v82H519z" class="stroke-B1 fill-B6 s2"/></g><text x="623.5" y="82.5" class="text-bold fill-N1 s1"><tspan x="623.5" dy="0">CO2 3분자</tspan><tspan x="623.5" dy="18.5">공기에서 들어온다</tspan></text></g><g ><g class="shape"><path d="M407 196h434v114H407z" class="stroke-B1 fill-B6 s2"/></g><text x="624" y="234.5" class="text-bold fill-N1 s1"><tspan x="624" dy="0">1. 카복실화</tspan><tspan x="624" dy="17.25">루비스코가 RuBP(탄소 5개)에 CO2 를 붙인다</tspan><tspan x="624" dy="17.25">곧바로 쪼개져 3-PGA(탄소 3개)가 2배로 나온다</tspan><tspan x="624" dy="17.25">ATP·NADPH 를 쓰지 않는다</tspan></text></g><g ><g class="shape"><path d="M460 390h148v82H460z" class="stroke-B1 fill-B6 s2"/></g><text x="534" y="428.5" class="text-bold fill-N1 s1"><tspan x="534" dy="0">3-PGA 6분자</tspan><tspan x="534" dy="18.5">(탄소 3개씩)</tspan></text></g><g ><g class="shape"><path d="M273 552h339v114H273z" class="stroke-B1 fill-B6 s2"/></g><text x="442.5" y="590.5" class="text-bold fill-N1 s1"><tspan x="442.5" dy="0">2. 환원</tspan><tspan x="442.5" dy="17.25">3-PGA 에 인산을 붙이고(ATP 6)</tspan><tspan x="442.5" dy="17.25">전자를 넣어(NADPH 6) G3P 로 만든다</tspan><tspan x="442.5" dy="17.25">여기서 탄소가 실제로 환원된다</tspan></text></g><g ><g class="shape"><path d="M380 736h125v66H380z" class="stroke-B1 fill-B6 s2"/></g><text x="442.5" y="774.5" class="text-bold fill-N1 s1">G3P 6분자</text></g><g ><g class="shape"><path d="M391 983h349v82H391z" class="stroke-B1 fill-B6 s2"/></g><text x="565.5" y="1021.5" class="text-bold fill-N1 s1"><tspan x="565.5" dy="0">G3P 1분자만 회로 밖으로 나간다</tspan><tspan x="565.5" dy="18.5">2분자가 모이면 포도당 하나가 된다</tspan></text></g><g ><g class="shape"><path d="M12 983h359v98H12z" class="stroke-B1 fill-B6 s2"/></g><text x="191.5" y="1021.5" class="text-bold fill-N1 s1"><tspan x="191.5" dy="0">3. 재생</tspan><tspan x="191.5" dy="17.667">남은 G3P 5분자를 여러 단계로 뒤섞어</tspan><tspan x="191.5" dy="17.667">RuBP 3분자로 되돌린다 (ATP 3)</tspan></text></g><g ><g class="shape"><path d="M372 1161h227v82H372z" class="stroke-B1 fill-B6 s2"/></g><text x="485.5" y="1199.5" class="text-bold fill-N1 s1"><tspan x="485.5" dy="0">RuBP 3분자</tspan><tspan x="485.5" dy="18.5">다음 CO2 를 받을 준비</tspan></text></g><g ><g class="shape"><path d="M748 12h263v114H748z" class="stroke-B2 fill-B6 s0"/></g><text x="879.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="879.5" dy="0">CO2 3개당 장부</tspan><tspan x="879.5" dy="17.25">들어간 것: ATP 9, NADPH 6</tspan><tspan x="879.5" dy="17.25">나온 것: G3P 1</tspan><tspan x="879.5" dy="17.25">→ CO2 하나당 ATP 3, NADPH 2</tspan></text></g><marker id="mk-d2-1170995217-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1170995217-3488378134)" d="M624.166 128v64" class="connection stroke-B1 s2" mask="url(#d2-1170995217)"/><path fill="none" marker-end="url(#mk-d2-1170995217-3488378134)" d="M523.583 1159v-28s0-10 10-10H770s10 0 10-10V314" class="connection stroke-B1 s2" mask="url(#d2-1170995217)"/><path fill="none" marker-end="url(#mk-d2-1170995217-3488378134)" d="M534.75 312v74" class="connection stroke-B1 s2" mask="url(#d2-1170995217)"/><path fill="none" marker-end="url(#mk-d2-1170995217-3488378134)" d="M499.416 474v74" class="connection stroke-B1 s2" mask="url(#d2-1170995217)"/><path fill="none" marker-end="url(#mk-d2-1170995217-3488378134)" d="M442.916 668v64" class="connection stroke-B1 s2" mask="url(#d2-1170995217)"/><path fill="none" marker-end="url(#mk-d2-1170995217-3488378134)" d="M463.75 804v175" class="connection stroke-B1 s2" mask="url(#d2-1170995217)"/><text x="464" y="898" class="text-italic fill-N2 s1">6분자 중 1분자</text><path fill="none" marker-end="url(#mk-d2-1170995217-3488378134)" d="M422.083 804v28s0 10-10 10h-116.25s-10 0-10 10v127" class="connection stroke-B1 s2" mask="url(#d2-1170995217)"/><text x="303" y="848" class="text-italic fill-N2 s1">6분자 중 5분자</text><path fill="none" marker-end="url(#mk-d2-1170995217-3488378134)" d="M191.5 1083v28s0 10 10 10h236.416s10 0 10 10v26" class="connection stroke-B1 s2" mask="url(#d2-1170995217)"/><path fill="none" marker-end="url(#mk-d2-1170995217-3488378134)" d="M334.666 312v236" class="connection stroke-B1 s2" mask="url(#d2-1170995217)"/><text x="335" y="437" class="text-italic fill-N2 s1">ATP 6, NADPH 6</text><path fill="none" marker-end="url(#mk-d2-1170995217-3488378134)" d="M141.5 312v667" class="connection stroke-B1 s2" mask="url(#d2-1170995217)"/><text x="142" y="652" class="text-italic fill-N2 s1">ATP 3</text><mask id="d2-1170995217" width="1201" height="1433" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1201v1433H-89z"/><path d="M403 882h122v21H403zM242 832h122v21H242zM282 421h106v21H282zM121 636h42v21h-42z"/></mask></svg>