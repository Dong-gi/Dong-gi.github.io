<svg xmlns="http://www.w3.org/2000/svg" width="1529" height="1962" class="d2-1077746275 d2-svg" viewBox="-16 -101 1529 1962"><rect width="1529" height="1962" x="-16" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1077746275 .fill-N1{fill:#0a0f25}.d2-1077746275 .fill-N2{fill:#676c7e}.d2-1077746275 .fill-B4{fill:#e3e9fd}.d2-1077746275 .fill-B5{fill:#edf0fd}.d2-1077746275 .fill-B6{fill:#f7f8fe}.d2-1077746275 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M377 0h319v114H377z" class="stroke-B1 fill-B6 s0"/></g><text x="536.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="536.5" dy="0">부착</tspan><tspan x="536.5" dy="17.25">캡시드나 외피의 단백질이</tspan><tspan x="536.5" dy="17.25">숙주 표면의 특정 분자에 붙는다</tspan><tspan x="536.5" dy="17.25">→ 숙주 범위가 여기서 정해진다</tspan></text></g><g ><g class="shape"><path d="M379 214h316v82H379z" class="stroke-B1 fill-B6 s0"/></g><text x="537" y="252.5" class="text-bold fill-N1 s1"><tspan x="537" dy="0">침입</tspan><tspan x="537" dy="18.5">유전체가 세포 안으로 들어간다</tspan></text></g><g ><g class="shape"><path d="M485 396h104v66H485z" class="stroke-B1 fill-B6 s0"/></g><text x="537" y="434.5" class="text-bold fill-N1 s1">갈림길</text></g><g ><g class="shape"><path d="M339 1270h396v490H339z" class="stroke-B1 fill-B4 s0"/></g><text x="537" y="1257" class="fill-N1 s2">용균 경로 (lytic)</text></g><g ><g class="shape"><path d="M195 603h973v506H195z" class="stroke-B1 fill-B4 s0"/></g><text x="681.5" y="590" class="fill-N1 s2">용원 경로 (lysogenic)</text></g><g ><g class="shape"><path d="M756 8h656v98H756z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="1084" y="46.5" class="text-bold fill-N1 s1"><tspan x="1084" dy="0">이 그림에 없는 것이 요점이다</tspan><tspan x="1084" dy="17.667">바이러스에는 리보솜도, ATP 를 만드는 장치도, 스스로 도는 대사도 없다</tspan><tspan x="1084" dy="17.667">그래서 세포 밖에서는 아무 일도 하지 못하고, 항생제의 표적도 없다</tspan></text></g><g ><g class="shape"><path d="M369 1300h336v82H369z" class="stroke-B1 fill-B5 s0"/></g><text x="537" y="1338.5" class="text-bold fill-N1 s1"><tspan x="537" dy="0">유전체를 곧바로 복제하고</tspan><tspan x="537" dy="18.5">숙주 리보솜으로 단백질을 만든다</tspan></text></g><g ><g class="shape"><path d="M431 1482h212v66H431z" class="stroke-B1 fill-B5 s0"/></g><text x="537" y="1520.5" class="text-bold fill-N1 s1">새 입자를 조립한다</text></g><g ><g class="shape"><path d="M379 1648h316v82H379z" class="stroke-B1 fill-B5 s0"/></g><text x="537" y="1686.5" class="text-bold fill-N1 s1"><tspan x="537" dy="0">세포를 터뜨리거나 싸여 나간다</tspan><tspan x="537" dy="18.5">→ 증상이 곧바로 나타난다</tspan></text></g><g ><g class="shape"><path d="M548 633h316v82H548z" class="stroke-B1 fill-B5 s0"/></g><text x="706" y="671.5" class="text-bold fill-N1 s1"><tspan x="706" dy="0">숙주 유전체에 끼어 들어가거나</tspan><tspan x="706" dy="18.5">플라스미드처럼 따로 유지된다</tspan></text></g><g ><g class="shape"><path d="M546 815h319v82H546z" class="stroke-B1 fill-B5 s0"/></g><text x="705.5" y="853.5" class="text-bold fill-N1 s1"><tspan x="705.5" dy="0">숙주가 분열할 때 함께 복제된다</tspan><tspan x="705.5" dy="18.5">겉으로는 아무 일도 없다</tspan></text></g><g ><g class="shape"><path d="M225 997h476v82H225z" class="stroke-B1 fill-B5 s0"/></g><text x="463" y="1035.5" class="text-bold fill-N1 s1"><tspan x="463" dy="0">잠복 중에도 숙주에 형질을 줄 수 있다</tspan><tspan x="463" dy="18.5">(용원 전환 — 일부 세균 독소 유전자가 여기서 온다)</tspan></text></g><g ><g class="shape"><path d="M761 997h377v82H761z" class="stroke-B1 fill-B5 s0"/></g><text x="949.5" y="1035.5" class="text-bold fill-N1 s1"><tspan x="949.5" dy="0">손상이나 스트레스를 받으면 빠져나와</tspan><tspan x="949.5" dy="18.5">용균 경로로 넘어간다</tspan></text></g><marker id="mk-d2-1077746275-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><pat