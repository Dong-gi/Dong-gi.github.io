<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="2144" class="d2-3998536918 d2-svg" viewBox="-16 -101 1016 2144"><rect width="1016" height="2144" x="-16" y="-101" rx="0" style="fill:#fff"/><style>.d2-3998536918 .text-bold{font-weight:700}.d2-3998536918 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3998536918 .fill-N1{fill:#0a0f25}.d2-3998536918 .fill-N2{fill:#676c7e}.d2-3998536918 .fill-B4{fill:#e3e9fd}.d2-3998536918 .fill-B5{fill:#edf0fd}.d2-3998536918 .fill-B6{fill:#f7f8fe}.d2-3998536918 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M259 0h319v114H259z" class="stroke-B1 fill-B6 s0"/></g><text x="418.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="418.5" dy="0">부착</tspan><tspan x="418.5" dy="17.25">캡시드나 외피의 단백질이</tspan><tspan x="418.5" dy="17.25">숙주 표면의 특정 분자에 붙는다</tspan><tspan x="418.5" dy="17.25">→ 숙주 범위가 여기서 정해진다</tspan></text></g><g ><g class="shape"><path d="M261 214h316v82H261z" class="stroke-B1 fill-B6 s0"/></g><text x="419" y="252.5" class="text-bold fill-N1 s1"><tspan x="419" dy="0">침입</tspan><tspan x="419" dy="18.5">유전체가 세포 안으로 들어간다</tspan></text></g><g ><g class="shape"><path d="M367 396h104v66H367z" class="stroke-B1 fill-B6 s0"/></g><text x="419" y="434.5" class="text-bold fill-N1 s1">갈림길</text></g><g ><g class="shape"><path d="M221 1302h396v490H221z" class="stroke-B1 fill-B4 s0"/></g><text x="419" y="1289" class="fill-N1 s2">용균 경로 (lytic)</text></g><g ><g class="shape"><path d="M204 603h695v538H204z" class="stroke-B1 fill-B4 s0"/></g><text x="551.5" y="590" class="fill-N1 s2">용원 경로 (lysogenic)</text></g><g ><g class="shape"><path d="M290 1812h442v130H290z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="511" y="1850.5" class="text-bold fill-N1 s1"><tspan x="511" dy="0">이 그림에 없는 것이 요점이다</tspan><tspan x="511" dy="17">바이러스에는 리보솜도, ATP 를 만드는 장치도,</tspan><tspan x="511" dy="17">스스로 도는 대사도 없다</tspan><tspan x="511" dy="17">그래서 세포 밖에서는 아무 일도 하지 못하고,</tspan><tspan x="511" dy="17">항생제의 표적도 없다</tspan></text></g><g ><g class="shape"><path d="M251 1332h336v82H251z" class="stroke-B1 fill-B5 s0"/></g><text x="419" y="1370.5" class="text-bold fill-N1 s1"><tspan x="419" dy="0">유전체를 곧바로 복제하고</tspan><tspan x="419" dy="18.5">숙주 리보솜으로 단백질을 만든다</tspan></text></g><g ><g class="shape"><path d="M313 1514h212v66H313z" class="stroke-B1 fill-B5 s0"/></g><text x="419" y="1552.5" class="text-bold fill-N1 s1">새 입자를 조립한다</text></g><g ><g class="shape"><path d="M261 1680h316v82H261z" class="stroke-B1 fill-B5 s0"/></g><text x="419" y="1718.5" class="text-bold fill-N1 s1"><tspan x="419" dy="0">세포를 터뜨리거나 싸여 나간다</tspan><tspan x="419" dy="18.5">→ 증상이 곧바로 나타난다</tspan></text></g><g ><g class="shape"><path d="M391 633h316v82H391z" class="stroke-B1 fill-B5 s0"/></g><text x="549" y="671.5" class="text-bold fill-N1 s1"><tspan x="549" dy="0">숙주 유전체에 끼어 들어가거나</tspan><tspan x="549" dy="18.5">플라스미드처럼 따로 유지된다</tspan></text></g><g ><g class="shape"><path d="M389 815h319v82H389z" class="stroke-B1 fill-B5 s0"/></g><text x="548.5" y="853.5" class="text-bold fill-N1 s1"><tspan x="548.5" dy="0">숙주가 분열할 때 함께 복제된다</tspan><tspan x="548.5" dy="18.5">겉으로는 아무 일도 없다</tspan></text></g><g ><g class="shape"><path d="M234 997h282v114H234z" class="stroke-B1 fill-B5 s0"/></g><text x="375" y="1035.5" class="text-bold fill-N1 s1"><tspan x="375" dy="0">잠복 중에도 숙주에</tspan><tspan x="375" dy="17.25">형질을 줄 수 있다</tspan><tspan x="375" dy="17.25">(용원 전환 — 일부 세균</tspan><tspan x="375" dy="17.25">독소 유전자가 여기서 온다)</tspan></text></g><g ><g class="shape"><path d="M576 1005h293v98H576z" class="stroke-B1 fill-B5 s0"/></g><text x="722.5" y="1043.5" class="text-bold fill-N1 s1"><tspan x="722.5" dy="0">손상이나 스트레스를 받으면</tspan><tspan x="722.5" dy="17.667">빠져나와</tspan><tspan x="722.5" dy="17.667">용균 경로로 넘어간다</tspan></text></g><marker id="mk-d2-3998536918-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3998536918-3488378134)" d="M418.5 1416v94" class="connection stroke-B1 s0" mask="url(#d2-3998536918)"/><path fill="none" marker-end="url(#mk-d2-3998536918-3488378134)" d="M418.5 1582v94" class="connection stroke-B1 s0" mask="url(#d2-3998536918)"/><path fill="none" marker-end="url(#mk-d2-3998536918-3488378134)" d="M548.5 717v94" class="connection stroke-B1 s0" mask="url(#d2-3998536918)"/><path fill="none" marker-end="url(#mk-d2-3998536918-3488378134)" d="M629.02 897.931C703.25 937 722.25 958.6 722.25 1001" class="connection stroke-B1 s0" mask="url(#d2-3998536918)"/><path fill="none" marker-end="url(#mk-d2-3998536918-3488378134)" d="M467.98 897.931C393.75 937 374.75 957 374.75 993" class="connection stroke-B1 s0" mask="url(#d2-3998536918)"/><path fill="none" marker-end="url(#mk-d2-3998536918-3488378134)" d="M418.5 116v94" class="connection stroke-B1 s0" mask="url(#d2-3998536918)"/><path fill="none" marker-end="url(#mk-d2-3998536918-3488378134)" d="M418.5 298v94" class="connection stroke-B1 s0" mask="url(#d2-3998536918)"/><path fill="none" marker-end="url(#mk-d2-3998536918-3488378134)" d="M364.594 446.114C172.5 507.101 124 534.6 124 552.75v638.5c0 18.15 32.4 100.75 158.178 139.57" class="connection stroke-B1 s0" mask="url(#d2-3998536918)"/><text x="124.5" y="860" class="text-italic fill-N2 s1">즉시 증식</text><path fill="none" marker-end="url(#mk-d2-3998536918-3488378134)" d="M466.118 462.675C531.7 510.3 548.5 593 548.5 629" class="connection stroke-B1 s0" mask="url(#d2-3998536918)"/><text x="535.5" y="536" class="text-italic fill-N2 s1">잠복</text><path fill="none" marker-end="url(#mk-d2-3998536918-3488378134)" d="M722.25 1105v86.25c0 18.15-33.4 100.75-163.168 139.603" class="connection stroke-B1 s0" mask="url(#d2-3998536918)"/><text x="699.5" y="1272" class="text-italic fill-N2 s1">깨어난다</text><mask id="d2-3998536918" width="1016" height="2144" x="-16" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-16-101h1016v2144H-16z"/><path d="M82 844h85v21H82zM514 520h43v21h-43zM659 1256h81v21h-81z"/></mask></svg>