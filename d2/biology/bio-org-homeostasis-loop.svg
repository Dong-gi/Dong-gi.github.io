<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="1464" class="d2-3268859155 d2-svg" viewBox="-101 -101 1284 1464"><rect width="1284" height="1464" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3268859155 .fill-N1{fill:#0a0f25}.d2-3268859155 .fill-N2{fill:#676c7e}.d2-3268859155 .fill-B5{fill:#edf0fd}.d2-3268859155 .fill-B6{fill:#f7f8fe}.d2-3268859155 .stroke-B1,.d2-3268859155 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M450 0h260v82H450z" class="stroke-B1 fill-B6 s0"/></g><text x="580" y="38.5" class="text-bold fill-N1 s1"><tspan x="580" dy="0">외란</tspan><tspan x="580" dy="18.5">예: 바깥 기온이 내려간다</tspan></text></g><g ><g class="shape"><path d="M0 406h344v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="172" y="444.5" class="text-bold fill-N1 s1"><tspan x="172" dy="0">감지기 (sensor)</tspan><tspan x="172" dy="17.667">조절 변수의 현재 값을 잰다</tspan><tspan x="172" dy="17.667">예: 피부와 시상하부의 온도 수용기</tspan></text></g><g ><g class="shape"><path d="M276 625h296v98H276z" class="stroke-B1 fill-B6 s0"/></g><text x="424" y="663.5" class="text-bold fill-N1 s1"><tspan x="424" dy="0">통합 중추 (integrator)</tspan><tspan x="424" dy="17.667">설정점과 비교해 오차를 낸다</tspan><tspan x="424" dy="17.667">예: 시상하부</tspan></text></g><g ><g class="shape"><path d="M422 844h316v98H422z" class="stroke-B1 fill-B6 s0"/></g><text x="580" y="882.5" class="text-bold fill-N1 s1"><tspan x="580" dy="0">실행기 (effector)</tspan><tspan x="580" dy="17.667">오차를 줄이는 쪽으로 작동한다</tspan><tspan x="580" dy="17.667">예: 떨림, 혈관 수축, 대사 증가</tspan></text></g><g ><g class="shape"><path d="M504 203h153v82H504z" class="stroke-B1 fill-B6 s0"/></g><text x="580.5" y="241.5" class="text-bold fill-N1 s1"><tspan x="580.5" dy="0">조절 변수</tspan><tspan x="580.5" dy="18.5">예: 심부체온</tspan></text></g><g ><g class="shape"><path d="M404 406h544v98H404z" class="stroke-B1 fill-B6 s0"/></g><text x="676" y="444.5" class="text-bold fill-N1 s1"><tspan x="676" dy="0">설정점 (set point)</tspan><tspan x="676" dy="17.667">고정된 상수가 아니다</tspan><tspan x="676" dy="17.667">발열, 일주기 리듬, 고지대 순응에서 이 값 자체가 옮겨간다</tspan></text></g><path fill="transparent" stroke="transparent" d="M103 962h782v300H103z" class="shape s0"/><g ><g class="shape"><path d="M127 986h734v114H127z" class="stroke-B2 fill-B5 s2"/></g><text x="494" y="1024.5" class="text-bold fill-N1 s1"><tspan x="494" dy="0">이 회로가 값을 완전히 고정할 수 없는 세 가지 이유</tspan><tspan x="494" dy="17.25">1. 오차에 비례해 교정하면 오차 0 에서 교정도 0 → 잔류 오차가 남는다</tspan><tspan x="494" dy="17.25">2. 감지와 전달과 실행에 시간이 걸린다 → 이득이 크면 과잉 교정과 진동이 생긴다</tspan><tspan x="494" dy="17.25">3. 실행기의 용량에 상한이 있다 → 아주 큰 외란은 이기지 못한다</tspan></text></g><g ><g class="shape"><path d="M127 1124h734v114H127z" class="stroke-B2 fill-B5 s2"/></g><text x="494" y="1162.5" class="text-bold fill-N1 s1"><tspan x="494" dy="0">양성 되먹임은 화살표 하나의 부호만 다르다</tspan><tspan x="494" dy="17.25">실행기의 효과가 변화를 되돌리는 대신 키운다</tspan><tspan x="494" dy="17.25">그래서 스스로 멈추지 않고, 반드시 바깥에서 끝내야 한다</tspan><tspan x="494" dy="17.25">분만 시 옥시토신, 혈액 응고, 활동전위의 상승기가 그 예다</tspan></text></g><marker id="mk-d2-3268859155-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3268859155-3488378134)" d="M580 83.5v116" class="connection stroke-B1 s0" mask="url(#d2-3268859155)"/><text x="580.5" y="148" class="text-italic fill-N2 s1">밀어낸다</text><path fill="none" marker-end="url(#mk-d2-3268859155-3488378134)" d="M501.56 263.514C238.3 329.006 172 357.7 172 402.5" class="connection stroke-B1 s0" mask="url(#d2-3268859155)"/><text x="312.5" y="316" class="text-italic fill-N2 s1">잰다</text><path fill="none" marker-end="url(#mk-d2-3268859155-3488378134)" d="M172 505.5c0 46.8 27.6 71.2 134.341 118.383" class="connection stroke-B1 s0" mask="url(#d2-3268859155)"/><path fill="none" marker-end="url(#mk-d2-3268859155-3488378134)" d="M424 724.5c0 46.8 17 71.2 81.75 117.668" class="connection stroke-B1 s0" mask="url(#d2-3268859155)"/><text x="443.5" y="803" class="text-italic fill-N2 s1">오차 신호</text><path fill="none" marker-end="url(#mk-d2-3268859155-3488378134)" d="M739.932 849.982C938 796.9 988 761.6 988 728.75v-219c0-32.85-66.2-180.65-327.117-245.288" class="connection stroke-B1 s0" mask="url(#d2-3268859155)"/><text x="988.5" y="542" class="text-italic fill-N2 s1">되돌린다 (음성 되먹임)</text><path fill="none" marker-end="url(#mk-d2-3268859155-3488378134)" d="M676 505.5c0 46.8-27.6 71.2-134.341 118.383" class="connection stroke-B1 s0" mask="url(#d2-3268859155)"/><mask id="d2-3268859155" width="1284" height="1464" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1284v1464H-101z"/><path d="M540 132h81v21h-81zM291 300h43v21h-43zM401 787h85v21h-85zM892 526h193v21H892z"/></mask></svg>