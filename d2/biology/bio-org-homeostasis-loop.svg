<svg xmlns="http://www.w3.org/2000/svg" width="3547" height="764" class="d2-371009823 d2-svg" viewBox="-101 -101 3547 764"><rect width="3547" height="764" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-371009823 .fill-N1{fill:#0a0f25}.d2-371009823 .fill-N2{fill:#676c7e}.d2-371009823 .fill-B6{fill:#f7f8fe}.d2-371009823 .stroke-B1,.d2-371009823 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M237 132h260v82H237z" class="stroke-B1 fill-B6 s0"/></g><text x="367" y="170.5" class="text-bold fill-N1 s1"><tspan x="367" dy="0">외란</tspan><tspan x="367" dy="18.5">예: 바깥 기온이 내려간다</tspan></text></g><g ><g class="shape"><path d="M1561 0h344v98h-344z" class="stroke-B1 fill-B6 s0"/></g><text x="1733" y="38.5" class="text-bold fill-N1 s1"><tspan x="1733" dy="0">감지기 (sensor)</tspan><tspan x="1733" dy="17.667">조절 변수의 현재 값을 잰다</tspan><tspan x="1733" dy="17.667">예: 피부와 시상하부의 온도 수용기</tspan></text></g><g ><g class="shape"><path d="M2423 79h296v98h-296z" class="stroke-B1 fill-B6 s0"/></g><text x="2571" y="117.5" class="text-bold fill-N1 s1"><tspan x="2571" dy="0">통합 중추 (integrator)</tspan><tspan x="2571" dy="17.667">설정점과 비교해 오차를 낸다</tspan><tspan x="2571" dy="17.667">예: 시상하부</tspan></text></g><g ><g class="shape"><path d="M3029 124h316v98h-316z" class="stroke-B1 fill-B6 s0"/></g><text x="3187" y="162.5" class="text-bold fill-N1 s1"><tspan x="3187" dy="0">실행기 (effector)</tspan><tspan x="3187" dy="17.667">오차를 줄이는 쪽으로 작동한다</tspan><tspan x="3187" dy="17.667">예: 떨림, 혈관 수축, 대사 증가</tspan></text></g><g ><g class="shape"><path d="M1040 132h153v82h-153z" class="stroke-B1 fill-B6 s0"/></g><text x="1116.5" y="170.5" class="text-bold fill-N1 s1"><tspan x="1116.5" dy="0">조절 변수</tspan><tspan x="1116.5" dy="18.5">예: 심부체온</tspan></text></g><g ><g class="shape"><path d="M1461 158h544v98h-544z" class="stroke-B1 fill-B6 s0"/></g><text x="1733" y="196.5" class="text-bold fill-N1 s1"><tspan x="1733" dy="0">설정점 (set point)</tspan><tspan x="1733" dy="17.667">고정된 상수가 아니다</tspan><tspan x="1733" dy="17.667">발열, 일주기 리듬, 고지대 순응에서 이 값 자체가 옮겨간다</tspan></text></g><g ><g class="shape"><path d="M0 274h734v114H0z" class="stroke-B2 fill-B6 s2"/></g><text x="367" y="312.5" class="text-bold fill-N1 s1"><tspan x="367" dy="0">이 회로가 값을 완전히 고정할 수 없는 세 가지 이유</tspan><tspan x="367" dy="17.25">1. 오차가 0 이면 교정 신호도 0 이다 → 잔류 오차가 반드시 남는다</tspan><tspan x="367" dy="17.25">2. 감지와 전달과 실행에 시간이 걸린다 → 이득이 크면 과잉 교정과 진동이 생긴다</tspan><tspan x="367" dy="17.25">3. 실행기의 용량에 상한이 있다 → 아주 큰 외란은 이기지 못한다</tspan></text></g><g ><g class="shape"><path d="M95 448h544v114H95z" class="stroke-B2 fill-B6 s2"/></g><text x="367" y="486.5" class="text-bold fill-N1 s1"><tspan x="367" dy="0">양성 되먹임은 화살표 하나의 부호만 다르다</tspan><tspan x="367" dy="17.25">실행기의 효과가 변화를 되돌리는 대신 키운다</tspan><tspan x="367" dy="17.25">그래서 스스로 멈추지 않고, 반드시 바깥에서 끝내야 한다</tspan><tspan x="367" dy="17.25">분만 시 옥시토신, 혈액 응고, 활동전위의 상승기가 그 예다</tspan></text></g><marker id="mk-d2-371009823-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-371009823-3488378134)" d="M499 172.5h537" class="connection stroke-B1 s0" mask="url(#d2-371009823)"/><text x="768.5" y="178" class="text-italic fill-N2 s1">밀어낸다</text><path fill="none" marker-end="url(#mk-d2-371009823-3488378134)" d="M1188.107 130.488C1298.876 65.5 1373.8 49 1557 49" class="connection stroke-B1 s0" mask="url(#d2-371009823)"/><text x="1364.5" y="57" class="text-italic fill-N2 s1">잰다</text><path fill="none" marker-end="url(#mk-d2-371009823-3488378134)" d="M1907 49c245.2 0 348.8 9.2 512.094 45.14" class="connection stroke-B1 s0" mask="url(#d2-371009823)"/><path fill="none" marker-end="url(#mk-d2-371009823-3488378134)" d="M2721 128c122 0 184 4.4 304.04 21.438" class="connection stroke-B1 s0" mask="url(#d2-371009823)"/><text x="2874.5" y="136" class="text-italic fill-N2 s1">오차 신호</text><path fill="none" marker-end="url(#mk-d2-371009823-3488378134)" d="M3059.95 223.229C2911.563 281.3 2813.4 296 2722.5 296h-749c-144.3 0-674.5-16.4-783.048-79.978" class="connection stroke-B1 s0" mask="url(#d2-371009823)"/><text x="2121.5" y="302" class="text-italic fill-N2 s1">되돌린다 (음성 되먹임)</text><path fill="none" marker-end="url(#mk-d2-371009823-3488378134)" d="M2007 207c165.2 0 248.8-9.2 412.094-45.14" class="connection stroke-B1 s0" mask="url(#d2-371009823)"/><mask id="d2-371009823" width="3547" height="764" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3547v764H-101z"/><path d="M728 162h81v21h-81zM1343 41h43v21h-43zM2832 120h85v21h-85zM2025 286h193v21h-193z"/></mask></svg>