<svg xmlns="http://www.w3.org/2000/svg" width="1197" height="2051" class="d2-1840871199 d2-svg" viewBox="-79 -101 1197 2051"><rect width="1197" height="2051" x="-79" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1840871199 .fill-N1{fill:#0a0f25}.d2-1840871199 .fill-N2{fill:#676c7e}.d2-1840871199 .fill-B4{fill:#e3e9fd}.d2-1840871199 .fill-B5{fill:#edf0fd}.d2-1840871199 .fill-B6{fill:#f7f8fe}.d2-1840871199 .stroke-B1,.d2-1840871199 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><path d="M197 16h209v66H197z" class="stroke-B1 fill-B6 s0"/></g><text x="301.5" y="54.5" class="text-bold fill-N1 s1">병원체가 들어온다</text></g><g ><g class="shape"><path d="M269 239h408v522H269z" class="stroke-B1 fill-B4 s0"/></g><text x="473" y="226" class="text-bold fill-N1 s2">선천 면역</text></g><g ><g class="shape"><path d="M91 922h421v506H91z" class="stroke-B1 fill-B4 s0"/></g><text x="301.5" y="909" class="text-bold fill-N1 s2">적응 면역</text></g><g ><g class="shape"><path d="M154 1569h296v66H154z" class="stroke-B1 fill-B6 s0"/></g><text x="302" y="1607.5" class="text-bold fill-N1 s1">같은 병원체가 다시 들어온다</text></g><g ><g class="shape"><path d="M110 1735h383v114H110z" class="stroke-B1 fill-B6 s0"/></g><text x="301.5" y="1773.5" class="text-bold fill-N1 s1"><tspan x="301.5" dy="0">2차 반응</tspan><tspan x="301.5" dy="17.25">며칠이 아니라 하루 이틀 안에 시작하고</tspan><tspan x="301.5" dy="17.25">항체의 양도 결합력도 1차보다 위다</tspan><tspan x="301.5" dy="17.25">예방접종이 노리는 것이 바로 이 상태다</tspan></text></g><g ><g class="shape"><path d="M466 0h551v98H466z" class="stroke-B2 fill-B6 s3"/></g><text x="741.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="741.5" dy="0">선천 면역을 &apos;약한 면역&apos;으로 읽지 말 것</tspan><tspan x="741.5" dy="17.667">감염의 대부분은 적응 면역이 켜지기도 전에 여기서 끝난다</tspan><tspan x="741.5" dy="17.667">적응 면역까지 간 감염은 선천 면역이 막지 못한 소수다</tspan></text></g><g ><g class="shape"><path d="M299 269h348v98H299z" class="stroke-B1 fill-B5 s0"/></g><text x="473" y="307.5" class="text-bold fill-N1 s1"><tspan x="473" dy="0">무엇을 알아보나</tspan><tspan x="473" dy="17.667">병원체 무리가 공통으로 가진 패턴</tspan><tspan x="473" dy="17.667">(세균 세포벽 성분, 이중가닥 RNA 등)</tspan></text></g><g ><g class="shape"><path d="M376 467h195v82H376z" class="stroke-B1 fill-B5 s0"/></g><text x="473.5" y="505.5" class="text-bold fill-N1 s1"><tspan x="473.5" dy="0">언제 작동하나</tspan><tspan x="473.5" dy="18.5">수 분에서 수 시간</tspan></text></g><g ><g class="shape"><path d="M310 649h327v82H310z" class="stroke-B1 fill-B5 s0"/></g><text x="473.5" y="687.5" class="text-bold fill-N1 s1"><tspan x="473.5" dy="0">기억</tspan><tspan x="473.5" dy="18.5">없다. 두 번째도 첫 번째와 똑같다</tspan></text></g><g ><g class="shape"><path d="M162 952h279v82H162z" class="stroke-B1 fill-B5 s0"/></g><text x="301.5" y="990.5" class="text-bold fill-N1 s1"><tspan x="301.5" dy="0">무엇을 알아보나</tspan><tspan x="301.5" dy="18.5">특정 항원의 특정 부위 하나</tspan></text></g><g ><g class="shape"><path d="M192 1134h220v82H192z" class="stroke-B1 fill-B5 s0"/></g><text x="302" y="1172.5" class="text-bold fill-N1 s1"><tspan x="302" dy="0">언제 작동하나</tspan><tspan x="302" dy="18.5">1차 감염에서는 며칠</tspan></text></g><g ><g class="shape"><path d="M121 1316h361v82H121z" class="stroke-B1 fill-B5 s0"/></g><text x="301.5" y="1354.5" class="text-bold fill-N1 s1"><tspan x="301.5" dy="0">기억</tspan><tspan x="301.5" dy="18.5">남는다. 기억세포가 오래 살아남는다</tspan></text></g><marker id="mk-d2-1840871199-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-1840871199-3488378134)" d="M473.25 369v94" class="connection stroke-B1 s0" mask="url(#d2-1840871199)"/><path fill="none" marker-end="url(#mk-d2-1840871199-3488378134)" d="M473.25 551v94" class="connection stroke-B1 s0" mask="url(#d2-1840871199)"/><path fill="none" marker-end="url(#mk-d2-1840871199-3488378134)" d="M301.75 1036v94" class="connection stroke-B1 s0" mask="url(#d2-1840871199)"/><path fill="none" marker-end="url(#mk-d2-1840871199-3488378134)" d="M301.75 1218v94" class="connection stroke-B1 s0" mask="url(#d2-1840871199)"/><path fill="none" marker-end="url(#mk-d2-1840871199-3488378134)" d="M354.933 82.58C449.25 143.1 473.25 229 473.25 265" class="connection stroke-B1 s0" mask="url(#d2-1840871199)"/><text x="451" y="156" class="text-italic fill-N2 s1">먼저 만난다</text><path fill="none" marker-end="url(#mk-d2-1840871199-3488378134)" d="M248.567 82.58C154.25 143.1 130.25 170.6 130.25 188.75v622.5c0 18.15 18.8 100.75 90.469 138.872" class="connection stroke-B1 s0" mask="url(#d2-1840871199)"/><text x="130" y="515" class="text-italic fill-N2 s1">동시에 시작하지만 느리다</text><path fill="none" marker-end="url(#mk-d2-1840871199-3488378134)" d="M473.25 762.5v156" class="connection stroke-B1 s0" mask="url(#d2-1840871199)"/><text x="473.5" y="847" class="text-italic fill-N2 s1">항원을 제시해 적응 면역을 켠다</text><marker id="mk-d2-1840871199-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-1840871199-2177206569)" d="M301.75 1400v165.5" class="connection stroke-B2 s3" mask="url(#d2-1840871199)"/><text x="301.5" y="1489" class="text-italic fill-N2 s1">이 상태로 기다린다</text><path fill="none" marker-end="url(#mk-d2-1840871199-3488378134)" d="M301.75 1637v94" class="connection stroke-B1 s0" mask="url(#d2-1840871199)"/><mask id="d2-1840871199" width="1197" height="2051" x="-79" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-79-101h1197v2051H-79z"/><path d="M399 140h104v21H399zM19 499h222v21H19zM340 831h267v21H340zM219 1473h165v21H219z"/></mask></s