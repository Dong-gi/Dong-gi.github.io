<svg xmlns="http://www.w3.org/2000/svg" width="1388" height="1409" class="d2-3860204963 d2-svg" viewBox="-89 -89 1388 1409"><rect width="1388" height="1409" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3860204963 .fill-N1{fill:#0a0f25}.d2-3860204963 .fill-B5{fill:#edf0fd}.d2-3860204963 .fill-B6{fill:#f7f8fe}.d2-3860204963 .stroke-B1,.d2-3860204963 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M563 12h383v82H563z" class="stroke-B1 fill-B6 s0"/></g><text x="754.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="754.5" dy="0">수정</tspan><tspan x="754.5" dy="18.5">반수체 둘이 만나 이배체 접합자가 된다</tspan></text></g><g ><g class="shape"><path d="M519 164h471v114H519z" class="stroke-B1 fill-B6 s0"/></g><text x="754.5" y="202.5" class="text-bold fill-N1 s1"><tspan x="754.5" dy="0">난할</tspan><tspan x="754.5" dy="17.25">성장 없이 분열만 한다</tspan><tspan x="754.5" dy="17.25">배 전체의 부피는 거의 그대로이고 세포 수만 는다</tspan><tspan x="754.5" dy="17.25">그래서 세포 하나는 분열할수록 작아진다</tspan></text></g><g ><g class="shape"><path d="M659 348h191v98H659z" class="stroke-B1 fill-B6 s0"/></g><text x="754.5" y="386.5" class="text-bold fill-N1 s1"><tspan x="754.5" dy="0">포배</tspan><tspan x="754.5" dy="17.667">속이 빈 세포 공</tspan><tspan x="754.5" dy="17.667">아직 배엽은 없다</tspan></text></g><g ><g class="shape"><path d="M585 516h340v98H585z" class="stroke-B1 fill-B6 s0"/></g><text x="755" y="554.5" class="text-bold fill-N1 s1"><tspan x="755" dy="0">낭배 형성</tspan><tspan x="755" dy="17.667">세포가 대규모로 이동한다</tspan><tspan x="755" dy="17.667">여기서 몸의 기본 배치가 정해진다</tspan></text></g><g ><g class="shape"><path d="M12 749h340v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="182" y="787.5" class="text-bold fill-N1 s1"><tspan x="182" dy="0">기관 형성</tspan><tspan x="182" dy="18.5">배엽마다 자기 몫의 기관을 만든다</tspan></text></g><g ><g class="shape"><path d="M372 749h826v198H372z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="785" y="934" class="fill-N1" style="text-anchor:middle;font-size:28px">낭배 형성이 만드는 세 배엽 — 무엇이 되는가</text></g><path fill="transparent" stroke="transparent" d="M242 967h726v252H242z" class="shape s0"/><g ><g class="shape"><path d="M422 799h248v82H422z" class="stroke-B1 fill-B5 s0"/></g><text x="546" y="837.5" class="text-bold fill-N1 s1"><tspan x="546" dy="0">외배엽</tspan><tspan x="546" dy="18.5">표피 · 신경계 · 감각기관</tspan></text></g><g ><g class="shape"><path d="M690 799h207v98H690z" class="stroke-B1 fill-B5 s0"/></g><text x="793.5" y="837.5" class="text-bold fill-N1 s1"><tspan x="793.5" dy="0">중배엽</tspan><tspan x="793.5" dy="17.667">근육 · 뼈 · 순환계</tspan><tspan x="793.5" dy="17.667">신장 · 생식샘 · 진피</tspan></text></g><g ><g class="shape"><path d="M917 799h231v98H917z" class="stroke-B1 fill-B5 s0"/></g><text x="1032.5" y="837.5" class="text-bold fill-N1 s1"><tspan x="1032.5" dy="0">내배엽</tspan><tspan x="1032.5" dy="17.667">소화관 상피 · 간 · 이자</tspan><tspan x="1032.5" dy="17.667">폐 상피 · 갑상샘</tspan></text></g><g ><g class="shape"><path d="M266 991h678v98H266z" class="stroke-B2 fill-B5 s2"/></g><text x="605" y="1029.5" class="text-bold fill-N1 s1"><tspan x="605" dy="0">헷갈리면 이 두 줄로 검산한다</tspan><tspan x="605" dy="17.667">난할은 수를 늘리고, 낭배 형성은 자리를 바꾼다</tspan><tspan x="605" dy="17.667">배엽으로 갈리기 전까지는 어느 세포가 무엇이 될지 정해져 있지 않다</tspan></text></g><g ><g class="shape"><path d="M266 1113h678v82H266z" class="stroke-B2 fill-B5 s2"/></g><text x="605" y="1151.5" class="text-bold fill-N1 s1"><tspan x="605" dy="0">세포 하나의 크기로도 단계를 가릴 수 있다</tspan><tspan x="605" dy="18.5">난할기에는 분열할수록 작아지고, 기관 형성기에는 성장이 다시 시작된다</tspan></text></g><marker id="mk-d2-3860204963-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="no