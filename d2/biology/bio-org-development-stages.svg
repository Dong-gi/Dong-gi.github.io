<svg xmlns="http://www.w3.org/2000/svg" width="2852" height="863" class="d2-4008119933 d2-svg" viewBox="-101 -101 2852 863"><rect width="2852" height="863" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4008119933 .fill-N1{fill:#0a0f25}.d2-4008119933 .fill-B5{fill:#edf0fd}.d2-4008119933 .fill-B6{fill:#f7f8fe}.d2-4008119933 .stroke-B1,.d2-4008119933 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M148 279h383v82H148z" class="stroke-B1 fill-B6 s0"/></g><text x="339.5" y="317.5" class="text-bold fill-N1 s1"><tspan x="339.5" dy="0">수정</tspan><tspan x="339.5" dy="18.5">반수체 둘이 만나 이배체 접합자가 된다</tspan></text></g><g ><g class="shape"><path d="M778 263h471v114H778z" class="stroke-B1 fill-B6 s0"/></g><text x="1013.5" y="301.5" class="text-bold fill-N1 s1"><tspan x="1013.5" dy="0">난할</tspan><tspan x="1013.5" dy="17.25">성장 없이 분열만 한다</tspan><tspan x="1013.5" dy="17.25">배 전체의 부피는 거의 그대로이고 세포 수만 는다</tspan><tspan x="1013.5" dy="17.25">그래서 세포 하나는 분열할수록 작아진다</tspan></text></g><g ><g class="shape"><path d="M1349 271h191v98h-191z" class="stroke-B1 fill-B6 s0"/></g><text x="1444.5" y="309.5" class="text-bold fill-N1 s1"><tspan x="1444.5" dy="0">포배</tspan><tspan x="1444.5" dy="17.667">속이 빈 세포 공</tspan><tspan x="1444.5" dy="17.667">아직 배엽은 없다</tspan></text></g><g ><g class="shape"><path d="M1640 271h340v98h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="1810" y="309.5" class="text-bold fill-N1 s1"><tspan x="1810" dy="0">낭배 형성</tspan><tspan x="1810" dy="17.667">세포가 대규모로 이동한다</tspan><tspan x="1810" dy="17.667">여기서 몸의 기본 배치가 정해진다</tspan></text></g><g ><g class="shape"><path d="M2149 0h340v82h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="2319" y="38.5" class="text-bold fill-N1 s1"><tspan x="2319" dy="0">기관 형성</tspan><tspan x="2319" dy="18.5">배엽마다 자기 몫의 기관을 만든다</tspan></text></g><g ><g class="shape"><path d="M2100 178h438v426h-438z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="2319" y="165" class="fill-N1" style="text-anchor:middle;font-size:28px">낭배 형성이 만드는 세 배엽 — 무엇이 되는가</text></g><g ><g class="shape"><path d="M20 421h639v98H20z" class="stroke-B2 fill-B6 s2"/></g><text x="339.5" y="459.5" class="text-bold fill-N1 s1"><tspan x="339.5" dy="0">헷갈리면 이 두 줄로 검산한다</tspan><tspan x="339.5" dy="17.667">난할은 수를 늘리고, 낭배 형성은 자리를 바꾼다</tspan><tspan x="339.5" dy="17.667">배엽으로 갈리기 전까지는 어느 세포가 무엇이 될지 정해져 있지 않다</tspan></text></g><g ><g class="shape"><path d="M0 579h678v82H0z" class="stroke-B2 fill-B6 s2"/></g><text x="339" y="617.5" class="text-bold fill-N1 s1"><tspan x="339" dy="0">세포 하나의 크기로도 단계를 가릴 수 있다</tspan><tspan x="339" dy="18.5">난할기에는 분열할수록 작아지고, 기관 형성기에는 성장이 다시 시작된다</tspan></text></g><g ><g class="shape"><path d="M2195 208h248v82h-248z" class="stroke-B1 fill-B5 s0"/></g><text x="2319" y="246.5" class="text-bold fill-N1 s1"><tspan x="2319" dy="0">외배엽</tspan><tspan x="2319" dy="18.5">표피 · 신경계 · 감각기관</tspan></text></g><g ><g class="shape"><path d="M2138 350h363v82h-363z" class="stroke-B1 fill-B5 s0"/></g><text x="2319.5" y="388.5" class="text-bold fill-N1 s1"><tspan x="2319.5" dy="0">중배엽</tspan><tspan x="2319.5" dy="18.5">근육 · 뼈 · 순환계 · 신장 · 생식샘 · 진피</tspan></text></g><g ><g class="shape"><path d="M2130 492h378v82h-378z" class="stroke-B1 fill-B5 s0"/></g><text x="2319" y="530.5" class="text-bold fill-N1 s1"><tspan x="2319" dy="0">내배엽</tspan><tspan x="2319" dy="18.5">소화관 상피 · 간 · 이자 · 폐 상피 · 갑상샘</tspan></text></g><marker id="mk-d2-4008119933-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4008119933-3488378134)" d="M533.5 320H774" class="connection stroke-B1 s0" mask="url(#d2-4008119933)"/><