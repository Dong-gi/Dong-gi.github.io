<svg xmlns="http://www.w3.org/2000/svg" width="1141" height="1566" class="d2-3655225063 d2-svg" viewBox="-89 -89 1141 1566"><rect width="1141" height="1566" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3655225063 .text-bold{font-weight:700}.d2-3655225063 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3655225063 .fill-N1{fill:#0a0f25}.d2-3655225063 .fill-N2{fill:#676c7e}.d2-3655225063 .fill-B5{fill:#edf0fd}.d2-3655225063 .fill-B6{fill:#f7f8fe}.d2-3655225063 .stroke-B1,.d2-3655225063 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M220 148h366v146H220z" class="stroke-B1 fill-B6 s0"/></g><text x="403" y="186.5" class="text-bold fill-N1 s1"><tspan x="403" dy="0">① 다양성을 미리 만든다 — V(D)J 재조합</tspan><tspan x="403" dy="16.833">V, D, J 조각 무리에서</tspan><tspan x="403" dy="16.833">하나씩 골라 이어 붙인다</tspan><tspan x="403" dy="16.833">조각 수의 곱에</tspan><tspan x="403" dy="16.833">이음매의 부정확성이 더해져</tspan><tspan x="403" dy="16.833">열 자릿수를 넘는 특이성이 나온다</tspan></text></g><g ><g class="shape"><path d="M141 379h776v270H141z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="529" y="412" class="fill-N1" style="text-anchor:middle;font-size:28px"><tspan x="529" dy="0">② 특이성이 하나뿐인 림프구가 잔뜩 준비된다</tspan><tspan x="529" dy="32">(항원을 만나기 전이다)</tspan></text></g><g ><g class="shape"><path d="M793 880c-1 0-2 0-2-1l-115-75c-1-1-1-2 0-3l115-76c1-1 3-1 4 0l115 76c1 1 1 2 0 3l-115 75c0 1-1 1-2 1Z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="793" y="791.5" class="text-bold fill-N1 s1"><tspan x="793" dy="0">③ 제거 관문</tspan><tspan x="793" dy="17.667">자기 분자에</tspan><tspan x="793" dy="17.667">반응하는가</tspan></text></g><g ><g class="shape"><path d="M635 1128h316v98H635z" class="stroke-B2 fill-B6 s2"/></g><text x="793" y="1166.5" class="text-bold fill-N1 s1"><tspan x="793" dy="0">죽거나 반응하지 못하게 잠긴다</tspan><tspan x="793" dy="17.667">이 관문이 깨진 것이</tspan><tspan x="793" dy="17.667">자가면역질환이다</tspan></text></g><g ><g class="shape"><path d="M19 12h218v66H19z" class="stroke-B1 fill-B6 s0"/></g><text x="128" y="50.5" class="text-bold fill-N1 s1">④ 항원 A 가 들어온다</text></g><g ><g class="shape"><path d="M113 762h296v98H113z" class="stroke-B1 fill-B6 s0"/></g><text x="261" y="800.5" class="text-bold fill-N1 s1"><tspan x="261" dy="0">⑤ 맞는 클론만 증식한다</tspan><tspan x="261" dy="17.667">항원이 새 수용체를 만들라고</tspan><tspan x="261" dy="17.667">지시하는 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M12 960h255v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="139.5" y="998.5" class="text-bold fill-N1 s1"><tspan x="139.5" dy="0">형질세포</tspan><tspan x="139.5" dy="17.667">항체를 대량으로 낸다</tspan><tspan x="139.5" dy="17.667">지금의 감염을 끝내는 쪽</tspan></text></g><g ><g class="shape"><path d="M287 960h191v98H287z" class="stroke-B1 fill-B6 s0"/></g><text x="382.5" y="998.5" class="text-bold fill-N1 s1"><tspan x="382.5" dy="0">기억세포</tspan><tspan x="382.5" dy="17.667">오래 살아남는다</tspan><tspan x="382.5" dy="17.667">다음번을 위한 쪽</tspan></text></g><g ><g class="shape"><path d="M273 1246h416v130H273z" class="stroke-B2 fill-B6 s2"/></g><text x="481" y="1284.5" class="text-bold fill-N1 s1"><tspan x="481" dy="0">13장의 자연선택과 논리 구조가 같다</tspan><tspan x="481" dy="17">변이가 먼저 있고 환경이 그중에서 고른다</tspan><tspan x="481" dy="17">여기서는 클론이 먼저 있고</tspan><tspan x="481" dy="17">항원이 그중에서 고른다</tspan><tspan x="481" dy="17">둘 다 &apos;쓰는 쪽이 만들라고 시킨다&apos;가 아니다</tspan></text></g><g ><g class="shape"><path d="M191 477h140v98H191z" class="stroke-B1 fill-B5 s0"/></g><text x="261" y="515.5" class="text-bold fill-N1 s1"><tspan x="261" dy="0">클론 A</tspan><tspan x="261" dy="17.667">항원 A 에만</tspan><tspan x="261" dy="17.667">반응</tspan></text></g><g ><g class="shape"><path d="M351 477h140v98H351z" class="stroke-B1 fill-B5 s0"/></g><text x="421" y="515.5" class="text-bold fill-N1 s1"><tspan x="421" dy="0">클론 B</tspan><tspan x="421" dy="17.667">항원 B 에만</tspan><tspan x="421" dy="17.667">반응</tspan></text></g><g ><g class="shape"><path d="M511 461h188v130H511z" class="stroke-B1 fill-B5 s0"/></g><text x="605" y="499.5" class="text-bold fill-N1 s1"><tspan x="605" dy="0">…</tspan><tspan x="605" dy="17">한 번도</tspan><tspan x="605" dy="17">만난 적 없는</tspan><tspan x="605" dy="17">항원용 클론까지</tspan><tspan x="605" dy="17">포함해서</tspan></text></g><g ><g class="shape"><path d="M719 453h148v146H719z" class="stroke-B2 fill-B5 s2"/></g><text x="793" y="491.5" class="text-bold fill-N1 s1"><tspan x="793" dy="0">클론 S</tspan><tspan x="793" dy="16.833">자기 분자에</tspan><tspan x="793" dy="16.833">반응한다</tspan><tspan x="793" dy="16.833">무작위로</tspan><tspan x="793" dy="16.833">만들었으니</tspan><tspan x="793" dy="16.833">섞여 나온다</tspan></text></g><marker id="mk-d2-3655225063-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3655225063-3488378134)" d="M271 296v79" class="connection stroke-B1 s0" mask="url(#d2-3655225063)"/><path fill="none" marker-end="url(#mk-d2-3655225063-3488378134)" d="M793 601v119" class="connection stroke-B1 s0" mask="url(#d2-3655225063)"/><path fill="none" marker-end="url(#mk-d2-3655225063-3488378134)" d="M793 882v242" class="connection stroke-B1 s0" mask="url(#d2-3655225063)"/><text x="793" y="1010" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-3655225063-3488378134)" d="M128.75 80v244s0 10 10 10H251s10 0 10 10v129" class="connection stroke-B1 s0" mask="url(#d2-3655225063)"/><text x="138.5" y="340" class="text-italic fill-N2 s1">맞는 것과 붙는다</text><path fill="none" marker-end="url(#mk-d2-3655225063-3488378134)" d="M261 576.666v182" class="connection stroke-B1 s0" mask="url(#d2-3655225063)"/><path fill="none" marker-end="url(#mk-d2-3655225063-348837813