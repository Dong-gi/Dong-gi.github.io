<svg xmlns="http://www.w3.org/2000/svg" width="1767" height="1078" class="d2-1860856602 d2-svg" viewBox="-101 -101 1767 1078"><rect width="1767" height="1078" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1860856602 .fill-N1{fill:#0a0f25}.d2-1860856602 .fill-N2{fill:#676c7e}.d2-1860856602 .fill-B5{fill:#edf0fd}.d2-1860856602 .fill-B6{fill:#f7f8fe}.d2-1860856602 .stroke-B1,.d2-1860856602 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M585 0h432v114H585z" class="stroke-B1 fill-B6 s0"/></g><text x="801" y="38.5" class="text-bold fill-N1 s1"><tspan x="801" dy="0">① 다양성을 미리 만든다 — V(D)J 재조합</tspan><tspan x="801" dy="17.25">V, D, J 조각 무리에서 하나씩 골라 이어 붙인다</tspan><tspan x="801" dy="17.25">조각 수의 곱에 이음매의 부정확성이 더해져</tspan><tspan x="801" dy="17.25">열 자릿수 규모의 특이성이 나온다</tspan></text></g><g ><g class="shape"><path d="M147 255h1216v158H147z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="755" y="242" class="fill-N1" style="text-anchor:middle;font-size:28px">② 특이성이 하나뿐인 림프구가 잔뜩 준비된다 (항원을 만나기 전이다)</text></g><g ><g class="shape"><path d="M1165 657h-4l-216-61c-2-1-2-2 0-2l216-61c2-1 6-1 8 0l216 60c2 1 2 2 0 2l-216 62z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="1165" y="592.5" class="text-bold fill-N1 s1"><tspan x="1165" dy="0">③ 제거 관문</tspan><tspan x="1165" dy="18.5">자기 분자에 반응하는가</tspan></text></g><g ><g class="shape"><path d="M975 786h380v82H975z" class="stroke-B2 fill-B6 s2"/></g><text x="1165" y="824.5" class="text-bold fill-N1 s1"><tspan x="1165" dy="0">죽거나 반응하지 못하게 잠긴다</tspan><tspan x="1165" dy="18.5">이 관문이 깨진 것이 자가면역질환이다</tspan></text></g><g ><g class="shape"><path d="M160 24h218v66H160z" class="stroke-B1 fill-B6 s0"/></g><text x="269" y="62.5" class="text-bold fill-N1 s1">④ 항원 A 가 들어온다</text></g><g ><g class="shape"><path d="M25 554h488v82H25z" class="stroke-B1 fill-B6 s0"/></g><text x="269" y="592.5" class="text-bold fill-N1 s1"><tspan x="269" dy="0">⑤ 맞는 클론만 증식한다</tspan><tspan x="269" dy="18.5">항원이 새 수용체를 만들라고 지시하는 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M0 778h255v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="127.5" y="816.5" class="text-bold fill-N1 s1"><tspan x="127.5" dy="0">형질세포</tspan><tspan x="127.5" dy="17.667">항체를 대량으로 낸다</tspan><tspan x="127.5" dy="17.667">지금의 감염을 끝내는 쪽</tspan></text></g><g ><g class="shape"><path d="M449 778h191v98H449z" class="stroke-B1 fill-B6 s0"/></g><text x="544.5" y="816.5" class="text-bold fill-N1 s1"><tspan x="544.5" dy="0">기억세포</tspan><tspan x="544.5" dy="17.667">오래 살아남는다</tspan><tspan x="544.5" dy="17.667">다음번을 위한 쪽</tspan></text></g><g ><g class="shape"><path d="M1077 0h488v114h-488z" class="stroke-B2 fill-B6 s2"/></g><text x="1321" y="38.5" class="text-bold fill-N1 s1"><tspan x="1321" dy="0">13장의 자연선택과 논리 구조가 같다</tspan><tspan x="1321" dy="17.25">변이가 먼저 있고 환경이 그중에서 고른다</tspan><tspan x="1321" dy="17.25">여기서는 클론이 먼저 있고 항원이 그중에서 고른다</tspan><tspan x="1321" dy="17.25">둘 다 &apos;쓰는 쪽이 만들라고 시킨다&apos;가 아니다</tspan></text></g><g ><g class="shape"><path d="M177 293h184v82H177z" class="stroke-B1 fill-B5 s0"/></g><text x="269" y="331.5" class="text-bold fill-N1 s1"><tspan x="269" dy="0">클론 A</tspan><tspan x="269" dy="18.5">항원 A 에만 반응</tspan></text></g><g ><g class="shape"><path d="M421 293h184v82H421z" class="stroke-B1 fill-B5 s0"/></g><text x="513" y="331.5" class="text-bold fill-N1 s1"><tspan x="513" dy="0">클론 B</tspan><tspan x="513" dy="18.5">항원 B 에만 반응</tspan></text></g><g ><g class="shape"><path d="M665 285h272v98H665z" class="stroke-B1 fill-B5 s0"/></g><text x="801" y="323.5" class="text-bold fill-N1 s1"><tspan x="801" dy="0">…</tspan><tspan x="801" dy="17.667">한 번도 만난 적 없는</tspan><tspan x="801" dy="17.667">항원용 클론까지 포함해서</tspan></text></g><g ><g class="shape"><path d="M997 285h336v98H997z" class="stroke-B2 fill-B5 s2"/></g><text x="1165" y="323.5" class="text-bold fill-N1 s1"><tspan x="1165" dy="0">클론 S</tspan><tspan x="1165" dy="17.667">자기 분자에 반응한다</tspan><tspan x="1165" dy="17.667">무작위로 만들었으니 섞여 나온다</tspan></text></g><marker id="mk-d2-1860856602-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1860856602-3488378134)" d="M801 115.5v95" class="connection stroke-B1 s0" mask="url(#d2-1860856602)"/><path fill="none" marker-end="url(#mk-d2-1860856602-3488378134)" d="M1165 385v143" class="connection stroke-B1 s0" mask="url(#d2-1860856602)"/><path fill="none" marker-end="url(#mk-d2-1860856602-3488378134)" d="M1165 659v123.5" class="connection stroke-B1 s0" mask="url(#d2-1860856602)"/><text x="1165" y="727" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-1860856602-3488378134)" d="M269 91.5V289" class="connection stroke-B1 s0" mask="url(#d2-1860856602)"/><text x="269.5" y="197" class="text-italic fill-N2 s1">맞는 것과 붙는다</text><path fill="none" marker-end="url(#mk-d2-1860856602-3488378134)" d="M269 377v173" class="connection stroke-B1 s0" mask="url(#d2-1860856602)"/><path fill="none" marker-end="url(#mk-d2-1860856602-3488378134)" d="M219.993 636.815C146.3 701.1 127.5 729.7 127.5 774.5" class="connection stroke-B1 s0" mask="url(#d2-1860856602)"/><path fill="none" marker-end="url(#mk-d2-1860856602-3488378134)" d="M363.075 636.318C507.65 701.1 544.25 729.7 544.25 774.5" class="connection stroke-B1 s0" mask="url(#d2-1860856602)"/><mask id="d2-1860856602" width="1767" height="1078" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1767V977H-101z"/><path d="M1134 711h62v21h-62zM197 181h145v21H197z"/></mask></svg>