<svg xmlns="http://www.w3.org/2000/svg" width="1326" height="2094" class="d2-3675657606 d2-svg" viewBox="-89 -89 1326 2094"><rect width="1326" height="2094" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3675657606 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3675657606 .fill-N1{fill:#0a0f25}.d2-3675657606 .fill-B4{fill:#e3e9fd}.d2-3675657606 .fill-B5{fill:#edf0fd}.d2-3675657606 .fill-B6{fill:#f7f8fe}.d2-3675657606 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M419 12h427v98H419z" class="stroke-B1 fill-B6 s0"/></g><text x="632.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="632.5" dy="0">대기의 N2</tspan><tspan x="632.5" dy="17.667">가장 큰 저장고이지만</tspan><tspan x="632.5" dy="17.667">삼중결합이 강해 대부분의 생물이 쓸 수 없다</tspan></text></g><g ><g class="shape"><path d="M12 245h944v230H12z" class="stroke-B1 fill-B4 s0"/></g><text x="484" y="278" class="fill-N1 s2">질소고정</text></g><g ><g class="shape"><path d="M235 560h238v82H235z" class="stroke-B1 fill-B6 s0"/></g><text x="354" y="598.5" class="text-bold fill-N1 s1"><tspan x="354" dy="0">암모늄 NH4+</tspan><tspan x="354" dy="18.5">식물이 바로 쓸 수 있다</tspan></text></g><g ><g class="shape"><path d="M324 777h566v302H324z" class="stroke-B1 fill-B4 s0"/></g><text x="607" y="810" class="fill-N1 s2">질산화 — 두 단계, 서로 다른 미생물</text></g><g ><g class="shape"><path d="M535 1164h467v98H535z" class="stroke-B1 fill-B6 s0"/></g><text x="768.5" y="1202.5" class="text-bold fill-N1 s1"><tspan x="768.5" dy="0">질산 NO3−</tspan><tspan x="768.5" dy="17.667">식물이 가장 많이 흡수하는 형태</tspan><tspan x="768.5" dy="17.667">음이온이라 토양에 붙지 못하고 잘 씻겨 내려간다</tspan></text></g><g ><g class="shape"><path d="M351 1347h420v98H351z" class="stroke-B1 fill-B6 s0"/></g><text x="561" y="1385.5" class="text-bold fill-N1 s1"><tspan x="561" dy="0">동화</tspan><tspan x="561" dy="17.667">식물이 흡수해 아미노산과 핵산으로 만든다</tspan><tspan x="561" dy="17.667">동물은 식물을 먹어 얻는다</tspan></text></g><g ><g class="shape"><path d="M465 1526h191v82H465z" class="stroke-B1 fill-B6 s0"/></g><text x="560.5" y="1564.5" class="text-bold fill-N1 s1"><tspan x="560.5" dy="0">생물의 유기 질소</tspan><tspan x="560.5" dy="18.5">단백질, 핵산</tspan></text></g><g ><g class="shape"><path d="M208 1688h529v82H208z" class="stroke-B1 fill-B6 s0"/></g><text x="472.5" y="1726.5" class="text-bold fill-N1 s1"><tspan x="472.5" dy="0">암모니아화</tspan><tspan x="472.5" dy="18.5">분해자가 사체와 배설물의 유기 질소를 NH4+ 로 되돌린다</tspan></text></g><g ><g class="shape"><path d="M791 1342h345v114H791z" class="stroke-B1 fill-B6 s0"/></g><text x="963.5" y="1380.5" class="text-bold fill-N1 s1"><tspan x="963.5" dy="0">탈질</tspan><tspan x="963.5" dy="17.25">탈질 세균이 NO3− 를 N2 로 되돌린다</tspan><tspan x="963.5" dy="17.25">산소가 없는 조건에서 일어난다</tspan><tspan x="963.5" dy="17.25">중간에 N2O 가 새어 나온다</tspan></text></g><g ><g class="shape"><path d="M241 1790h665v114H241z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="573.5" y="1828.5" class="text-bold fill-N1 s1"><tspan x="573.5" dy="0">사람이 바꿔 놓은 것</tspan><tspan x="573.5" dy="17.25">· 공업적 고정과 비료로 육상에 들어오는 질소량이 자연 고정에 맞먹는다</tspan><tspan x="573.5" dy="17.25">· 남은 질산이 씻겨 내려가 수계에 들어가면 부영양화를 일으킨다</tspan><tspan x="573.5" dy="17.25">· 탈질 과정에서 새어 나오는 N2O 는 온실기체다</tspan></text></g><g ><g class="shape"><path d="M62 295h296v130H62z" class="stroke-B1 fill-B5 s0"/></g><text x="210" y="333.5" class="text-bold fill-N1 s1"><tspan x="210" dy="0">질소고정 세균과 고세균</tspan><tspan x="210" dy="17">N2 → NH3</tspan><tspan x="210" dy="17">뿌리혹, 토양, 물속에 산다</tspan><tspan x="210" dy="17">질소고정효소는 산소에 약해</tspan><tspan x="210" dy="17">따로 격리된 조건이 필요하다</tspan></text></g><g ><g class="shape"><path d="M378 311h380v98H378z" class="stroke-B1 fill-B5 s0"/></g><text x="568" y="349.5" class="text-bold fill-N1 s1"><tspan x="568" dy="0">공업적 고정 (하버-보슈)</tspan><tspan x="568" dy="17.667">사람이 만든 경로</tspan><tspan x="568" dy="17.667">지금은 생물학적 고정에 맞먹는 규모다</tspan></text></g><g ><g class="shape"><path d="M778 319h128v82H778z" class="stroke-B1 fill-B5 s0"/></g><text x="842" y="357.5" class="text-bold fill-N1 s1"><tspan x="842" dy="0">번개</tspan><tspan x="842" dy="18.5">양이 작다</tspan></text></g><g ><g class="shape"><path d="M401 827h411v66H401z" class="stroke-B1 fill-B5 s0"/></g><text x="606.5" y="865.5" class="text-bold fill-N1 s1">NH4+ → NO2− (암모니아 산화 세균과 고세균)</text></g><g ><g class="shape"><path d="M452 963h309v66H452z" class="stroke-B1 fill-B5 s0"/></g><text x="606.5" y="1001.5" class="text-bold fill-N1 s1">NO2− → NO3− (아질산 산화 세균)</text></g><marker id="mk-d2-3675657606-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3675657606-3488378134)" d="M607.083 895v64" class="connection stroke-B1 s0" mask="url(#d2-3675657606)"/><path fill="none" marker-end="url(#mk-d2-3675657606-3488378134)" d="M504.533 112v28s0 10-10 10H220s-10 0-10 10v131" class="connection stroke-B1 s0" mask="url(#d2-3675657606)"/><path fill="none" marker-end="url(#mk-d2-3675657606-3488378134)" d="M314.916 427v129" class="connection stroke-B1 s0" mask="url(#d2-3675657606)"/><path fill="none" marker-end="url(#mk-d2-3675657606-3488378134)" d="M568 112v195" class="connection stroke-B1 s0" mask="url(#d2-3675657606)"/><path fill="none" marker-end="url(#mk-d2-3675657606-3488378134)" d="M568 411v99s0 10-10 10H404.25s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3675657606)"/><path fill="none" marker-end="url(#mk-d2-3675657606-3488378134)" d="M675.333 112v78s0 10 10 10H832s10 0 10 10v105" class="connection stroke-B1 s0" mask="url(#d2-3675657606)"/><path fill="none" marker-end="url(#mk-d2-3675657606-3488378134)" d="M842 403v107s0 10 10 10h68.083s10 0 10 10v630" class="connection stroke-B1 s0" mask="url(#d