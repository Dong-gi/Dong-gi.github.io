<svg xmlns="http://www.w3.org/2000/svg" width="4812" height="849" class="d2-956792197 d2-svg" viewBox="-101 -85 4812 849"><rect width="4812" height="849" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-956792197 .fill-N1{fill:#0a0f25}.d2-956792197 .fill-B4{fill:#e3e9fd}.d2-956792197 .fill-B5{fill:#edf0fd}.d2-956792197 .fill-B6{fill:#f7f8fe}.d2-956792197 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M119 341h427v98H119z" class="stroke-B1 fill-B6 s0"/></g><text x="332.5" y="379.5" class="text-bold fill-N1 s1"><tspan x="332.5" dy="0">대기의 N2</tspan><tspan x="332.5" dy="17.667">가장 큰 저장고이지만</tspan><tspan x="332.5" dy="17.667">삼중결합이 강해 대부분의 생물이 쓸 수 없다</tspan></text></g><g ><g class="shape"><path d="M785 56h440v490H785z" class="stroke-B1 fill-B4 s0"/></g><text x="1005" y="43" class="fill-N1 s2">질소고정</text></g><g ><g class="shape"><path d="M1345 329h238v82h-238z" class="stroke-B1 fill-B6 s0"/></g><text x="1464" y="367.5" class="text-bold fill-N1 s1"><tspan x="1464" dy="0">암모늄 NH4+</tspan><tspan x="1464" dy="18.5">식물이 바로 쓸 수 있다</tspan></text></g><g ><g class="shape"><path d="M1703 234h880v126h-880z" class="stroke-B1 fill-B4 s0"/></g><text x="2143" y="221" class="fill-N1 s2">질산화 — 두 단계, 서로 다른 미생물</text></g><g ><g class="shape"><path d="M2703 167h467v98h-467z" class="stroke-B1 fill-B6 s0"/></g><text x="2936.5" y="205.5" class="text-bold fill-N1 s1"><tspan x="2936.5" dy="0">질산 NO3−</tspan><tspan x="2936.5" dy="17.667">식물이 가장 많이 흡수하는 형태</tspan><tspan x="2936.5" dy="17.667">음이온이라 토양에 붙지 못하고 잘 씻겨 내려간다</tspan></text></g><g ><g class="shape"><path d="M3270 214h420v98h-420z" class="stroke-B1 fill-B6 s0"/></g><text x="3480" y="252.5" class="text-bold fill-N1 s1"><tspan x="3480" dy="0">동화</tspan><tspan x="3480" dy="17.667">식물이 흡수해 아미노산과 핵산으로 만든다</tspan><tspan x="3480" dy="17.667">동물은 식물을 먹어 얻는다</tspan></text></g><g ><g class="shape"><path d="M3790 222h191v82h-191z" class="stroke-B1 fill-B6 s0"/></g><text x="3885.5" y="260.5" class="text-bold fill-N1 s1"><tspan x="3885.5" dy="0">생물의 유기 질소</tspan><tspan x="3885.5" dy="18.5">단백질, 핵산</tspan></text></g><g ><g class="shape"><path d="M4081 353h529v82h-529z" class="stroke-B1 fill-B6 s0"/></g><text x="4345.5" y="391.5" class="text-bold fill-N1 s1"><tspan x="4345.5" dy="0">암모니아화</tspan><tspan x="4345.5" dy="18.5">분해자가 사체와 배설물의 유기 질소를 NH4+ 로 되돌린다</tspan></text></g><g ><g class="shape"><path d="M3308 509h345v114h-345z" class="stroke-B1 fill-B6 s0"/></g><text x="3480.5" y="547.5" class="text-bold fill-N1 s1"><tspan x="3480.5" dy="0">탈질</tspan><tspan x="3480.5" dy="17.25">탈질 세균이 NO3− 를 N2 로 되돌린다</tspan><tspan x="3480.5" dy="17.25">산소가 없는 조건에서 일어난다</tspan><tspan x="3480.5" dy="17.25">중간에 N2O 가 새어 나온다</tspan></text></g><g ><g class="shape"><path d="M0 499h665v114H0z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="332.5" y="537.5" class="text-bold fill-N1 s1"><tspan x="332.5" dy="0">사람이 바꿔 놓은 것</tspan><tspan x="332.5" dy="17.25">· 공업적 고정과 비료로 육상에 들어오는 질소량이 자연 고정에 맞먹는다</tspan><tspan x="332.5" dy="17.25">· 남은 질산이 씻겨 내려가 수계에 들어가면 부영양화를 일으킨다</tspan><tspan x="332.5" dy="17.25">· 탈질 과정에서 새어 나오는 N2O 는 온실기체다</tspan></text></g><g ><g class="shape"><path d="M857 228h296v130H857z" class="stroke-B1 fill-B5 s0"/></g><text x="1005" y="266.5" class="text-bold fill-N1 s1"><tspan x="1005" dy="0">질소고정 세균과 고세균</tspan><tspan x="1005" dy="17">N2 → NH3</tspan><tspan x="1005" dy="17">뿌리혹, 토양, 물속에 산다</tspan><tspan x="1005" dy="17">질소고정효소는 산소에 약해</tspan><tspan x="1005" dy="17">따로 격리된 조건이 필요하다</tspan></text></g><g ><g class="shape"><path d="M815 418h380v98H815z" class="stroke-B1 fill-B5 s0"/></g><text x="1005" y="456.5" class="text-bold fill-N1 s1"><tspan x="1005" dy="0">공업적 고정 (하버-보슈)</tspan><tspan x="1005" dy="17.667">사람이 만든 경로</tspan><tspan x="1005" dy="17.667">지금은 생물학적 고정에 맞먹는 규모다</tspan></text></g><g ><g class="shape"><path d="M941 86h128v82H941z" class="stroke-B1 fill-B5 s0"/></g><text x="1005" y="124.5" class="text-bold fill-N1 s1"><tspan x="1005" dy="0">번개</tspan><tspan x="1005" dy="18.5">양이 작다</tspan></text></g><g ><g class="shape"><path d="M1733 264h411v66h-411z" class="stroke-B1 fill-B5 s0"/></g><text x="1938.5" y="302.5" class="text-bold fill-N1 s1">NH4+ → NO2− (암모니아 산화 세균과 고세균)</text></g><g ><g class="shape"><path d="M2244 264h309v66h-309z" class="stroke-B1 fill-B5 s0"/></g><text x="2398.5" y="302.5" class="text-bold fill-N1 s1">NO2− → NO3− (아질산 산화 세균)</text></g><marker id="mk-d2-956792197-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-956792197-3488378134)" d="M2146 297h94" class="connection stroke-B1 s0" mask="url(#d2-956792197)"/><path fill="none" marker-end="url(#mk-d2-956792197-3488378134)" d="M527.938 340.508C677.2 302.6 783.4 293 853 293" class="connection stroke-B1 s0" mask="url(#d2-956792197)"/><path fill="none" marker-end="url(#mk-d2-956792197-3488378134)" d="M1155 293c71.6 0 155.8 7.2 215.36 34.341" class="connection stroke-B1 s0" mask="url(#d2-956792197)"/><path fill="none" marker-end="url(#mk-d2-956792197-3488378134)" d="M547.96 433.394C681.2 460.2 775 467 811 467" class="connection stroke-B1 s0" mask="url(#d2-956792197)"/><path fill="none" marker-end="url(#mk-d2-956792197-3488378134)" d="M1197 467c38 0 117.6-11.2 192.527-54.015" class="connection stroke-B1 s0" mask="url(#d2-956792197)"/><path fill="none" marker-end="url(#mk-d2-956792197-3488378134)" d="M405.648 339.866C652.8 169.8 800.2 127 937 127" class="connection stroke-B1 s0" mask="url(#d2-956792197)"/><path fill="none" marker-end="url(#mk-d2-956792197-3488378134)" d="M1071 127h1429.75c61.35 0 177.65 8 275.435 38.798" class="conn