<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="1646" class="d2-2988827127 d2-svg" viewBox="-89 -89 1168 1646"><rect width="1168" height="1646" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2988827127 .text-bold{font-weight:700}.d2-2988827127 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2988827127 .fill-N1{fill:#0a0f25}.d2-2988827127 .fill-N2{fill:#676c7e}.d2-2988827127 .fill-B4{fill:#e3e9fd}.d2-2988827127 .fill-B5{fill:#edf0fd}.d2-2988827127 .fill-B6{fill:#f7f8fe}.d2-2988827127 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M12 595h234v200H12z" class="stroke-B1 fill-B6 s0"/></g><text x="129" y="668.5" class="text-bold fill-N1 s1"><tspan x="129" dy="0">하디-바인베르크 평형</tspan><tspan x="129" dy="17">대립유전자 빈도가</tspan><tspan x="129" dy="17">변하지 않는다</tspan><tspan x="129" dy="17">f(AA)=p², f(Aa)=2pq,</tspan><tspan x="129" dy="17">f(aa)=q²</tspan></text></g><g ><g class="shape"><path d="M565 12h393v266H565z" class="stroke-B1 fill-B4 s0"/></g><text x="761.5" y="45" class="fill-N1 s2"><tspan x="761.5" dy="0">조건 1 이 깨진다</tspan><tspan x="761.5" dy="30.667">집단이 유한하다</tspan><tspan x="761.5" dy="30.667">→ 유전적 부동</tspan></text></g><g ><g class="shape"><path d="M565 298h376v266H565z" class="stroke-B1 fill-B4 s0"/></g><text x="753" y="331" class="fill-N1 s2"><tspan x="753" dy="0">조건 2 가 깨진다</tspan><tspan x="753" dy="30.667">이주가 있다</tspan><tspan x="753" dy="30.667">→ 유전자 흐름</tspan></text></g><g ><g class="shape"><path d="M565 584h396v222H565z" class="stroke-B1 fill-B4 s0"/></g><text x="763" y="617" class="fill-N1 s2"><tspan x="763" dy="0">조건 3 이 깨진다</tspan><tspan x="763" dy="32">돌연변이가 있다</tspan></text></g><g ><g class="shape"><path d="M565 826h396v222H565z" class="stroke-B1 fill-B4 s0"/></g><text x="763" y="859" class="fill-N1 s2"><tspan x="763" dy="0">조건 4 가 깨진다</tspan><tspan x="763" dy="32">선택이 있다</tspan></text></g><g ><g class="shape"><path d="M565 1068h413v222H565z" class="stroke-B1 fill-B4 s0"/></g><text x="771.5" y="1101" class="fill-N1 s2"><tspan x="771.5" dy="0">조건 5 가 깨진다</tspan><tspan x="771.5" dy="32">교배가 무작위가 아니다</tspan></text></g><g ><g class="shape"><path d="M260 1310h470v146H260z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="495" y="1348.5" class="text-bold fill-N1 s1"><tspan x="495" dy="0">이 그림을 쓰는 법</tspan><tspan x="495" dy="16.833">관찰된 유전자형 빈도가 p²:2pq:q² 에서 벗어났다면</tspan><tspan x="495" dy="16.833">동형접합자 과잉 →</tspan><tspan x="495" dy="16.833">근친 교배 또는 집단 구조를 의심하고</tspan><tspan x="495" dy="16.833">이형접합자 과잉 →</tspan><tspan x="495" dy="16.833">이형접합자 우세나 최근 잡종화를 의심한다</tspan></text></g><g ><g class="shape"><path d="M615 114h293v114H615z" class="stroke-B1 fill-B5 s0"/></g><text x="761.5" y="152.5" class="text-bold fill-N1 s1"><tspan x="761.5" dy="0">빈도가 무작위로 오르내리다</tspan><tspan x="761.5" dy="17.25">0 이나 1 에 붙어</tspan><tspan x="761.5" dy="17.25">되돌아오지 못한다</tspan><tspan x="761.5" dy="17.25">작은 집단일수록 빠르다</tspan></text></g><g ><g class="shape"><path d="M615 400h276v114H615z" class="stroke-B1 fill-B5 s0"/></g><text x="753" y="438.5" class="text-bold fill-N1 s1"><tspan x="753" dy="0">집단 사이의 차이를 지운다</tspan><tspan x="753" dy="17.25">새 대립유전자를 들여온다</tspan><tspan x="753" dy="17.25">종분화를 막는 방향으로</tspan><tspan x="753" dy="17.25">작동한다</tspan></text></g><g ><g class="shape"><path d="M615 658h296v98H615z" class="stroke-B1 fill-B5 s0"/></g><text x="763" y="696.5" class="text-bold fill-N1 s1"><tspan x="763" dy="0">느리지만 변이의 유일한 원천</tspan><tspan x="763" dy="17.667">선택과 맞서</tspan><tspan x="763" dy="17.667">평형 빈도를 만든다</tspan></text></g><g ><g class="shape"><path d="M615 900h296v98H615z" class="stroke-B1 fill-B5 s0"/></g><text x="763" y="938.5" class="text-bold fill-N1 s1"><tspan x="763" dy="0">방향을 가지고 빈도를 바꾼다</tspan><tspan x="763" dy="17.667">네 힘 가운데 유일하게</tspan><tspan x="763" dy="17.667">&apos;적응&apos;을 만든다</tspan></text></g><g ><g class="shape"><path d="M615 1142h313v98H615z" class="stroke-B1 fill-B5 s0"/></g><text x="771.5" y="1180.5" class="text-bold fill-N1 s1"><tspan x="771.5" dy="0">대립유전자 빈도는 그대로인데</tspan><tspan x="771.5" dy="17.667">동형접합자만 늘어난다</tspan><tspan x="771.5" dy="17.667">근친 교배가 대표적이다</tspan></text></g><marker id="mk-d2-2988827127-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2988827127-3488378134)" d="M248 628.333h28s10 0 10-10V155s0-10 10-10h265" class="connection stroke-B1 s0" mask="url(#d2-2988827127)"/><text x="286.5" y="273" class="text-italic fill-N2 s1">무한 집단</text><path fill="none" marker-end="url(#mk-d2-2988827127-3488378134)" d="M248 661.666h78s10 0 10-10V441s0-10 10-10h215" class="connection stroke-B1 s0" mask="url(#d2-2988827127)"/><text x="336.5" y="482" class="text-italic fill-N2 s1">이주 없음</text><path fill="none" marker-end="url(#mk-d2-2988827127-3488378134)" d="M248 695h313" class="connection stroke-B1 s0" mask="url(#d2-2988827127)"/><text x="405.5" y="701" class="text-italic fill-N2 s1">돌연변이 없음</text><path fill="none" marker-end="url(#mk-d2-2988827127-3488378134)" d="M248 728.333h78s10 0 10 10V927s0 10 10 10h215" class="connection stroke-B1 s0" mask="url(#d2-2988827127)"/><text x="336.5" y="908" class="text-italic fill-N2 s1">선택 없음</text><path fill="none" marker-end="url(#mk-d2-2988827127-3488378134)" d="M248 761.666h28s10 0 10 10V1169s0 10 10 10h265" class="connection stroke-B1 s0" mask="url(#d2-2988827127)"/><text x="286" y="1095" class="text-italic fill-N2 s1">무작위 교배</text><mask id="d2-2988827127" width="1168" height="1646" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1168v1646H-89z"/><path d="M244 257h85v21h-85zM294 466h85v21h-85zM344 685h123v21H344zM294 892h85v21h-85zM234 1079h104v21H234z"/></mask></svg>