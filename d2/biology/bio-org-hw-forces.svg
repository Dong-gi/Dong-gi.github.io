<svg xmlns="http://www.w3.org/2000/svg" width="1546" height="1540" class="d2-179056320 d2-svg" viewBox="-101 -85 1546 1540"><rect width="1546" height="1540" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-179056320 .fill-N1{fill:#0a0f25}.d2-179056320 .fill-N2{fill:#676c7e}.d2-179056320 .fill-B4{fill:#e3e9fd}.d2-179056320 .fill-B5{fill:#edf0fd}.d2-179056320 .fill-B6{fill:#f7f8fe}.d2-179056320 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M124 706h336v98H124z" class="stroke-B1 fill-B6 s0"/></g><text x="292" y="744.5" class="text-bold fill-N1 s1"><tspan x="292" dy="0">하디-바인베르크 평형</tspan><tspan x="292" dy="17.667">대립유전자 빈도가 변하지 않는다</tspan><tspan x="292" dy="17.667">f(AA)=p², f(Aa)=2pq, f(aa)=q²</tspan></text></g><g ><g class="shape"><path d="M925 112h404v158H925z" class="stroke-B1 fill-B4 s0"/></g><text x="1127" y="43" class="fill-N1 s2"><tspan x="1127" dy="0">조건 1 이 깨진다</tspan><tspan x="1127" dy="30.667">집단이 유한하다</tspan><tspan x="1127" dy="30.667">→ 유전적 부동</tspan></text></g><g ><g class="shape"><path d="M929 412h396v158H929z" class="stroke-B1 fill-B4 s0"/></g><text x="1127" y="343" class="fill-N1 s2"><tspan x="1127" dy="0">조건 2 가 깨진다</tspan><tspan x="1127" dy="30.667">이주가 있다</tspan><tspan x="1127" dy="30.667">→ 유전자 흐름</tspan></text></g><g ><g class="shape"><path d="M938 684h379v142H938z" class="stroke-B1 fill-B4 s0"/></g><text x="1127.5" y="643" class="fill-N1 s2"><tspan x="1127.5" dy="0">조건 3 이 깨진다</tspan><tspan x="1127.5" dy="32">돌연변이가 있다</tspan></text></g><g ><g class="shape"><path d="M911 940h433v142H911z" class="stroke-B1 fill-B4 s0"/></g><text x="1127.5" y="899" class="fill-N1 s2"><tspan x="1127.5" dy="0">조건 4 가 깨진다</tspan><tspan x="1127.5" dy="32">선택이 있다</tspan></text></g><g ><g class="shape"><path d="M941 1196h373v158H941z" class="stroke-B1 fill-B4 s0"/></g><text x="1127.5" y="1155" class="fill-N1 s2"><tspan x="1127.5" dy="0">조건 5 가 깨진다</tspan><tspan x="1127.5" dy="32">교배가 무작위가 아니다</tspan></text></g><g ><g class="shape"><path d="M0 864h583v114H0z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="291.5" y="902.5" class="text-bold fill-N1 s1"><tspan x="291.5" dy="0">이 그림을 쓰는 법</tspan><tspan x="291.5" dy="17.25">관찰된 유전자형 빈도가 p²:2pq:q² 에서 벗어났다면</tspan><tspan x="291.5" dy="17.25">동형접합자 과잉 → 근친 교배 또는 집단 구조를 의심하고</tspan><tspan x="291.5" dy="17.25">이형접합자 과잉 → 이형접합자 우세나 최근 잡종화를 의심한다</tspan></text></g><g ><g class="shape"><path d="M955 142h344v98H955z" class="stroke-B1 fill-B5 s0"/></g><text x="1127" y="180.5" class="text-bold fill-N1 s1"><tspan x="1127" dy="0">빈도가 무작위로 오르내리다</tspan><tspan x="1127" dy="17.667">0 이나 1 에 붙어 되돌아오지 못한다</tspan><tspan x="1127" dy="17.667">작은 집단일수록 빠르다</tspan></text></g><g ><g class="shape"><path d="M959 442h336v98H959z" class="stroke-B1 fill-B5 s0"/></g><text x="1127" y="480.5" class="text-bold fill-N1 s1"><tspan x="1127" dy="0">집단 사이의 차이를 지운다</tspan><tspan x="1127" dy="17.667">새 대립유전자를 들여온다</tspan><tspan x="1127" dy="17.667">종분화를 막는 방향으로 작동한다</tspan></text></g><g ><g class="shape"><path d="M968 714h319v82H968z" class="stroke-B1 fill-B5 s0"/></g><text x="1127.5" y="752.5" class="text-bold fill-N1 s1"><tspan x="1127.5" dy="0">느리지만 변이의 유일한 원천</tspan><tspan x="1127.5" dy="18.5">선택과 맞서 평형 빈도를 만든다</tspan></text></g><g ><g class="shape"><path d="M941 970h373v82H941z" class="stroke-B1 fill-B5 s0"/></g><text x="1127.5" y="1008.5" class="text-bold fill-N1 s1"><tspan x="1127.5" dy="0">방향을 가지고 빈도를 바꾼다</tspan><tspan x="1127.5" dy="18.5">네 힘 가운데 유일하게 &apos;적응&apos;을 만든다</tspan></text></g><g ><g class="shape"><path d="M971 1226h313v98H971z" class="stroke-B1 fill-B5 s0"/></g><text x="1127.5" y="1264.5" class="text-bold fill-N1 s1"><tspan x="1127.5" dy="0">대립유전자 빈도는 그대로인데</tspan><tspan x="1127.5" dy="17.667">동형접합자만 늘어난다</tspan><tspan x="1127.5" dy="17.667">근친 교배가 대표적이다</tspan></text></g><marker id="mk-d2-179056320-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-179056320-3488378134)" d="M347.18 704.385C646.8 294 762.6 191 921 191" class="connection stroke-B1 s0" mask="url(#d2-179056320)"/><text x="589.5" y="377" class="text-italic fill-N2 s1">무한 집단</text><path fill="none" marker-end="url(#mk-d2-179056320-3488378134)" d="M404.658 704.882C658.2 534 763.4 491 925 491" class="connection stroke-B1 s0" mask="url(#d2-179056320)"/><text x="646.5" y="547" class="text-italic fill-N2 s1">이주 없음</text><path fill="none" marker-end="url(#mk-d2-179056320-3488378134)" d="M462.5 755H934" class="connection stroke-B1 s0" mask="url(#d2-179056320)"/><text x="699.5" y="761" class="text-italic fill-N2 s1">돌연변이 없음</text><path fill="none" marker-end="url(#mk-d2-179056320-3488378134)" d="M408.671 805.098C659 969.6 759.8 1011 907 1011" class="connection stroke-B1 s0" mask="url(#d2-179056320)"/><text x="641.5" y="964" class="text-italic fill-N2 s1">선택 없음</text><path fill="none" marker-end="url(#mk-d2-179056320-3488378134)" d="M349.244 805.566C647.2 1180.8 765.8 1275 937 1275" class="connection stroke-B1 s0" mask="url(#d2-179056320)"/><text x="599" y="1126" class="text-italic fill-N2 s1">무작위 교배</text><mask id="d2-179056320" width="1546" height="1540" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h1546v1540H-101z"/><path d="M547 361h85v21h-85zM604 531h85v21h-85zM638 745h123v21H638zM599 948h85v21h-85zM547 1110h104v21H547z"/></mask></svg>