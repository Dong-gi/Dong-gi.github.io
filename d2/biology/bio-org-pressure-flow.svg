<svg xmlns="http://www.w3.org/2000/svg" width="882" height="1688" class="d2-169046867 d2-svg" viewBox="-91 -121 882 1688"><rect width="882" height="1688" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-169046867 .fill-N1{fill:#0a0f25}.d2-169046867 .fill-N2{fill:#676c7e}.d2-169046867 .fill-B4{fill:#e3e9fd}.d2-169046867 .fill-B5{fill:#edf0fd}.d2-169046867 .fill-B6{fill:#f7f8fe}.d2-169046867 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M10 20h591v474H10z" class="stroke-B1 fill-B4 s0"/></g><text x="305.5" y="7" class="fill-N1 s1">공급원 (source) — 성숙한 잎</text></g><g ><g class="shape"><path d="M70 635h340v98H70z" class="stroke-B1 fill-B6 s0"/></g><text x="240" y="673.5" class="text-bold fill-N1 s2"><tspan x="240" dy="0">체관요소</tspan><tspan x="240" dy="17.667">살아 있으나 핵과 액포가 없다</tspan><tspan x="240" dy="17.667">동반세포가 그 기능을 대신 맡는다</tspan></text></g><g ><g class="shape"><path d="M53 874h534v458H53z" class="stroke-B1 fill-B4 s0"/></g><text x="320" y="861" class="fill-N1 s1">수용부 (sink) — 뿌리, 열매, 어린 잎</text></g><g ><g class="shape"><path d="M17 1352h577v114H17z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="305.5" y="1390.5" class="text-bold fill-N1 s2"><tspan x="305.5" dy="0">방향이 고정되어 있지 않다는 점이 물관부와 다르다</tspan><tspan x="305.5" dy="17.25">어린 잎은 수용부였다가 자라면 공급원이 되고,</tspan><tspan x="305.5" dy="17.25">뿌리는 여름에 수용부, 봄에 저장물을 내보내는 공급원이 된다</tspan><tspan x="305.5" dy="17.25">같은 체관에서 계절에 따라 흐름의 방향이 바뀐다</tspan></text></g><g ><g class="shape"><path d="M239 50h332v82H239z" class="stroke-B1 fill-B5 s0"/></g><text x="405" y="88.5" class="text-bold fill-N1 s2"><tspan x="405" dy="0">1. 설탕을 체관으로 능동 적재</tspan><tspan x="405" dy="18.5">ATP 로 만든 양성자 기울기를 쓴다</tspan></text></g><g ><g class="shape"><path d="M40 232h399v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="239.5" y="270.5" class="text-bold fill-N1 s2">2. Ψs 가 낮아져 물관부에서 물이 들어온다</text></g><g ><g class="shape"><path d="M87 398h305v66H87z" class="stroke-B1 fill-B5 s0"/></g><text x="239.5" y="436.5" class="text-bold fill-N1 s2">3. 팽압이 올라간다 (높은 압력)</text></g><g ><g class="shape"><path d="M83 904h313v66H83z" class="stroke-B1 fill-B5 s0"/></g><text x="239.5" y="942.5" class="text-bold fill-N1 s2">4. 설탕을 내려 쓰거나 저장한다</text></g><g ><g class="shape"><path d="M83 1070h314v66H83z" class="stroke-B1 fill-B5 s0"/></g><text x="240" y="1108.5" class="text-bold fill-N1 s2">5. Ψs 가 올라가 물이 빠져나간다</text></g><g ><g class="shape"><path d="M252 1236h305v66H252z" class="stroke-B1 fill-B5 s0"/></g><text x="404.5" y="1274.5" class="text-bold fill-N1 s2">6. 팽압이 내려간다 (낮은 압력)</text></g><marker id="mk-d2-169046867-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-169046867-3488378134)" d="M328.747 132.963C257.7 172 239.5 192 239.5 228" class="connection stroke-B1 s0" mask="url(#d2-169046867)"/><path fill="none" marker-end="url(#mk-d2-169046867-3488378134)" d="M239.5 300v94" class="connection stroke-B1 s0" mask="url(#d2-169046867)"/><path fill="none" marker-end="url(#mk-d2-169046867-3488378134)" d="M239.5 972v94" class="connection stroke-B1 s0" mask="url(#d2-169046867)"/><path fill="none" marker-end="url(#mk-d2-169046867-3488378134)" d="M239.5 1138c0 38 20 58 96.422 96.211" class="connection stroke-B1 s0" mask="url(#d2-169046867)"/><path fill="none" marker-end="url(#mk-d2-169046867-3488378134)" d="M239.5 466v165.5" class="connection stroke-B1 s0" mask="url(#d2-169046867)"/><text x="240" y="555" class="text-italic fill-N2 s2">압력이 높은 쪽</text><path fill="none" marker-end="url(#mk-d2-169046867-3488378134)" d="M239.5 734.5V900" class="connection stroke-B1 s0" mask="url(#d2-169046867)"/><text x="240" y="824" class="text-italic fill-N2 s2">대량 흐름 (bulk flow)</text><path fill="none" marker-end="url(#mk-d2-169046867-3488378134)" d="M471.789 1235.106C550 1196 570 1169.4 570 1144.5v-838c0-24.9-18.2-134.5-87.494-172.574" class="connection stroke-B1 s0" mask="url(#d2-169046867)"/><text x="570.5" y="695" class="text-italic fill-N2 s2">물은 물관부를 통해 돌아간다</text><mask id="d2-169046867" width="882" height="1688" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h882v1688H-91z"/><path d="M177 539h126v21H177zM162 808h156v21H162zM448 679h245v21H448z"/></mask></svg>