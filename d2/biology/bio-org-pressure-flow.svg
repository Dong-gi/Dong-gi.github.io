<svg xmlns="http://www.w3.org/2000/svg" width="5026" height="609" class="d2-1537710931 d2-svg" viewBox="40 -81 5026 609"><rect width="5026" height="609" x="40" y="-81" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1537710931 .fill-N1{fill:#0a0f25}.d2-1537710931 .fill-N2{fill:#676c7e}.d2-1537710931 .fill-B4{fill:#e3e9fd}.d2-1537710931 .fill-B5{fill:#edf0fd}.d2-1537710931 .fill-B6{fill:#f7f8fe}.d2-1537710931 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M233 60h1781v184H233z" class="stroke-B1 fill-B4 s0"/></g><text x="1123.5" y="47" class="fill-N1 s1">공급원 (source) — 성숙한 잎</text></g><g ><g class="shape"><path d="M2527 74h340v98h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="2697" y="112.5" class="text-bold fill-N1 s2"><tspan x="2697" dy="0">체관요소</tspan><tspan x="2697" dy="17.667">살아 있으나 핵과 액포가 없다</tspan><tspan x="2697" dy="17.667">동반세포가 그 기능을 대신 맡는다</tspan></text></g><g ><g class="shape"><path d="M3411 60h1554v176H3411z" class="stroke-B1 fill-B4 s0"/></g><text x="4188" y="47" class="fill-N1 s1">수용부 (sink) — 뿌리, 열매, 어린 잎</text></g><g ><g class="shape"><path d="M141 313h577v114H141z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="429.5" y="351.5" class="text-bold fill-N1 s2"><tspan x="429.5" dy="0">방향이 고정되어 있지 않다는 점이 물관부와 다르다</tspan><tspan x="429.5" dy="17.25">어린 잎은 수용부였다가 자라면 공급원이 되고,</tspan><tspan x="429.5" dy="17.25">뿌리는 여름에 수용부, 봄에 저장물을 내보내는 공급원이 된다</tspan><tspan x="429.5" dy="17.25">같은 체관에서 계절에 따라 흐름의 방향이 바뀐다</tspan></text></g><g ><g class="shape"><path d="M263 132h332v82H263z" class="stroke-B1 fill-B5 s0"/></g><text x="429" y="170.5" class="text-bold fill-N1 s2"><tspan x="429" dy="0">1. 설탕을 체관으로 능동 적재</tspan><tspan x="429" dy="18.5">ATP 로 만든 양성자 기울기를 쓴다</tspan></text></g><g ><g class="shape"><path d="M999 90h399v66H999z" class="stroke-B1 fill-B5 s0"/></g><text x="1198.5" y="128.5" class="text-bold fill-N1 s2">2. Ψs 가 낮아져 물관부에서 물이 들어온다</text></g><g ><g class="shape"><path d="M1679 90h305v66h-305z" class="stroke-B1 fill-B5 s0"/></g><text x="1831.5" y="128.5" class="text-bold fill-N1 s2">3. 팽압이 올라간다 (높은 압력)</text></g><g ><g class="shape"><path d="M3441 90h313v66h-313z" class="stroke-B1 fill-B5 s0"/></g><text x="3597.5" y="128.5" class="text-bold fill-N1 s2">4. 설탕을 내려 쓰거나 저장한다</text></g><g ><g class="shape"><path d="M4035 90h314v66h-314z" class="stroke-B1 fill-B5 s0"/></g><text x="4192" y="128.5" class="text-bold fill-N1 s2">5. Ψs 가 올라가 물이 빠져나간다</text></g><g ><g class="shape"><path d="M4630 140h305v66h-305z" class="stroke-B1 fill-B5 s0"/></g><text x="4782.5" y="178.5" class="text-bold fill-N1 s2">6. 팽압이 내려간다 (낮은 압력)</text></g><marker id="mk-d2-1537710931-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1537710931-3488378134)" d="M596.987 152.773C805.4 129 886.1 123 994.5 123" class="connection stroke-B1 s0" mask="url(#d2-1537710931)"/><path fill="none" marker-end="url(#mk-d2-1537710931-3488378134)" d="M1400.5 123h274" class="connection stroke-B1 s0" mask="url(#d2-1537710931)"/><path fill="none" marker-end="url(#mk-d2-1537710931-3488378134)" d="M3756.5 123h274" class="connection stroke-B1 s0" mask="url(#d2-1537710931)"/><path fill="none" marker-end="url(#mk-d2-1537710931-3488378134)" d="M4351.5 123c109.6 0 165.6 4.771 274.056 23.186" class="connection stroke-B1 s0" mask="url(#d2-1537710931)"/><path fill="none" marker-end="url(#mk-d2-1537710931-3488378134)" d="M1986.5 123h537" class="connection stroke-B1 s0" mask="url(#d2-1537710931)"/><text x="2256" y="129" class="text-italic fill-N2 s2">압력이 높은 쪽</text><path fill="none" marker-end="url(#mk-d2-1537710931-3