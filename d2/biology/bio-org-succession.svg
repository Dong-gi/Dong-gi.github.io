<svg xmlns="http://www.w3.org/2000/svg" width="1118" height="1679" class="d2-3395509281 d2-svg" viewBox="-91 -121 1118 1679"><rect width="1118" height="1679" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3395509281 .fill-N1{fill:#0a0f25}.d2-3395509281 .fill-N2{fill:#676c7e}.d2-3395509281 .fill-B5{fill:#edf0fd}.d2-3395509281 .fill-B6{fill:#f7f8fe}.d2-3395509281 .stroke-B1,.d2-3395509281 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M10 20h916v174H10z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="468" y="7" class="fill-N1" style="text-anchor:middle;font-size:28px">출발 조건</text></g><g ><g class="shape"><path d="M494 314h411v114H494z" class="stroke-B1 fill-B6 s0"/></g><text x="699.5" y="352.5" class="text-bold fill-N1 s1"><tspan x="699.5" dy="0">지의류와 이끼</tspan><tspan x="699.5" dy="17.25">제약: 토양도 질소도 없다</tspan><tspan x="699.5" dy="17.25">이기는 성질: 암반에 붙고 영양 요구가 낮다</tspan><tspan x="699.5" dy="17.25">하는 일: 풍화와 유기물 축적</tspan></text></g><g ><g class="shape"><path d="M516 549h368v114H516z" class="stroke-B1 fill-B6 s0"/></g><text x="700" y="587.5" class="text-bold fill-N1 s1"><tspan x="700" dy="0">질소고정 능력이 있는 선구 관목</tspan><tspan x="700" dy="17.25">제약: 여전히 토양 질소가 없다</tspan><tspan x="700" dy="17.25">이기는 성질: 대기 질소를 쓸 수 있다</tspan><tspan x="700" dy="17.25">하는 일: 낙엽으로 토양 질소를 올린다</tspan></text></g><g ><g class="shape"><path d="M265 784h411v114H265z" class="stroke-B1 fill-B6 s0"/></g><text x="470.5" y="822.5" class="text-bold fill-N1 s1"><tspan x="470.5" dy="0">속성수 (빨리 자라는 나무)</tspan><tspan x="470.5" dy="17.25">제약: 이제 빛을 두고 다툰다</tspan><tspan x="470.5" dy="17.25">이기는 성질: 밝은 곳에서 빨리 자란다</tspan><tspan x="470.5" dy="17.25">하는 일: 그늘을 만들어 앞 단계를 밀어낸다</tspan></text></g><g ><g class="shape"><path d="M257 1019h428v114H257z" class="stroke-B1 fill-B6 s0"/></g><text x="471" y="1057.5" class="text-bold fill-N1 s1"><tspan x="471" dy="0">내음성 수종</tspan><tspan x="471" dy="17.25">제약: 그늘 아래에서 자랄 수 있는가</tspan><tspan x="471" dy="17.25">이기는 성질: 어두운 곳에서 발아하고 견딘다</tspan><tspan x="471" dy="17.25">결과: 하층을 점유했다가 상층으로 올라간다</tspan></text></g><path fill="transparent" stroke="transparent" d="M52 1153h831v304H52z" class="shape s0"/><g ><g class="shape"><path d="M503 50h393v114H503z" class="stroke-B1 fill-B5 s0"/></g><text x="699.5" y="88.5" class="text-bold fill-N1 s1"><tspan x="699.5" dy="0">1차 천이</tspan><tspan x="699.5" dy="17.25">토양이 아예 없는 맨땅</tspan><tspan x="699.5" dy="17.25">용암류, 빙하가 물러난 자리, 새 모래언덕</tspan><tspan x="699.5" dy="17.25">수백 년 이상</tspan></text></g><g ><g class="shape"><path d="M40 50h403v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="241.5" y="88.5" class="text-bold fill-N1 s1"><tspan x="241.5" dy="0">2차 천이</tspan><tspan x="241.5" dy="17.25">식생은 사라졌으나 토양과 종자가 남은 곳</tspan><tspan x="241.5" dy="17.25">산불 자리, 묵논, 벌채지</tspan><tspan x="241.5" dy="17.25">수십 년</tspan></text></g><g ><g class="shape"><path d="M72 1173h791v114H72z" class="stroke-B2 fill-B5 s2"/></g><text x="467.5" y="1211.5" class="text-bold fill-N1 s1"><tspan x="467.5" dy="0">제시된 세 기작. 실제 천이에서는 섞여 작동한다</tspan><tspan x="467.5" dy="17.25">촉진(facilitation): 앞 종이 환경을 바꿔 뒤 종이 들어올 수 있게 한다</tspan><tspan x="467.5" dy="17.25">내성(tolerance): 돕지도 막지도 않고, 자원이 적은 조건을 견디는 쪽이 나중에 우세해진다</tspan><tspan x="467.5" dy="17.25">억제(inhibition): 앞 종이 뒤 종을 막고 있다가 교란이나 죽음으로 자리를 내준다</tspan></text></g><g ><g class="shape"><path d="M72 1307h791v130H72z" class="stroke-B2 fill-B5 s2"/></g><text x="467.5" y="1345.5" class="text-bold fill-N1 s1"><tspan x="467.5" dy="0">종착점은 하나가 아니다</tspan><tspan x="467.5" dy="17">한때는 지역마다 정해진 극상 군집으로 수렴한다고 보았다</tspan><tspan x="467.5" dy="17">지금은 교란의 반복, 기후 변화, 어떤 종이 먼저 도착했는가의 우연 때문에</tspan><tspan x="467.5" dy="17">여러 대안 상태가 가능하다고 본다</tspan><tspan x="467.5" dy="17">방향성은 관찰되지만 종착점의 유일성은 확립된 사실이 아니다</tspan></text></g><marker id="mk-d2-3395509281-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3395509281-3488378134)" d="M699.5 166v144" class="connection stroke-B1 s0" mask="url(#d2-3395509281)"/><path fill="none" marker-end="url(#mk-d2-3395509281-3488378134)" d="M241.5 166v381.25c0 35.25 23.4 188.45 113.453 235.4" class="connection stroke-B1 s0" mask="url(#d2-3395509281)"/><text x="241.5" y="509" class="text-italic fill-N2 s1">토양이 남아 있어 앞 단계를 건너뛴다</text><path fill="none" marker-end="url(#mk-d2-3395509281-3488378134)" d="M699.5 429.5v116" class="connection stroke-B1 s0" mask="url(#d2-3395509281)"/><text x="700" y="494" class="text-italic fill-N2 s1">촉진 — 앞 종이 뒤 종의 조건을 만든다</text><path fill="none" marker-end="url(#mk-d2-3395509281-3488378134)" d="M699.5 664.5c0 46.8-23.4 71.2-113.453 118.15" class="connection stroke-B1 s0" mask="url(#d2-3395509281)"/><text x="666" y="747" class="text-italic fill-N2 s1">촉진 뒤의 경쟁 배제</text><path fill="none" marker-end="url(#mk-d2-3395509281-3488378134)" d="M470.5 899.5v116" class="connection stroke-B1 s0" mask="url(#d2-3395509281)"/><text x="471" y="964" class="text-italic fill-N2 s1">내성 — 견디는 쪽이 남는다</text><mask id="d2-3395509281" width="1118" height="1679" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1118v1679H-91z"/><path d="M87 493h309v21H87zM547 478h306v21H547zM582 731h168v21H582zM361 948h220v21H361z"/></mask></svg>