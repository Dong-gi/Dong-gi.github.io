<svg xmlns="http://www.w3.org/2000/svg" width="4848" height="944" class="d2-3112400516 d2-svg" viewBox="72 -85 4848 944"><rect width="4848" height="944" x="72" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3112400516 .fill-N1{fill:#0a0f25}.d2-3112400516 .fill-N2{fill:#676c7e}.d2-3112400516 .fill-B5{fill:#edf0fd}.d2-3112400516 .fill-B6{fill:#f7f8fe}.d2-3112400516 .stroke-B1,.d2-3112400516 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M337 56h463v348H337z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="568.5" y="43" class="fill-N1" style="text-anchor:middle;font-size:28px">출발 조건</text></g><g ><g class="shape"><path d="M1481 260h411v114h-411z" class="stroke-B1 fill-B6 s0"/></g><text x="1686.5" y="298.5" class="text-bold fill-N1 s1"><tspan x="1686.5" dy="0">지의류와 이끼</tspan><tspan x="1686.5" dy="17.25">제약: 토양도 질소도 없다</tspan><tspan x="1686.5" dy="17.25">이기는 성질: 암반에 붙고 영양 요구가 낮다</tspan><tspan x="1686.5" dy="17.25">하는 일: 풍화와 유기물 축적</tspan></text></g><g ><g class="shape"><path d="M2542 260h368v114h-368z" class="stroke-B1 fill-B6 s0"/></g><text x="2726" y="298.5" class="text-bold fill-N1 s1"><tspan x="2726" dy="0">질소고정 능력이 있는 선구 관목</tspan><tspan x="2726" dy="17.25">제약: 여전히 토양 질소가 없다</tspan><tspan x="2726" dy="17.25">이기는 성질: 대기 질소를 쓸 수 있다</tspan><tspan x="2726" dy="17.25">하는 일: 낙엽으로 토양 질소를 올린다</tspan></text></g><g ><g class="shape"><path d="M3419 173h411v114h-411z" class="stroke-B1 fill-B6 s0"/></g><text x="3624.5" y="211.5" class="text-bold fill-N1 s1"><tspan x="3624.5" dy="0">속성수 (빨리 자라는 나무)</tspan><tspan x="3624.5" dy="17.25">제약: 이제 빛을 두고 다툰다</tspan><tspan x="3624.5" dy="17.25">이기는 성질: 밝은 곳에서 빨리 자란다</tspan><tspan x="3624.5" dy="17.25">하는 일: 그늘을 만들어 앞 단계를 밀어낸다</tspan></text></g><g ><g class="shape"><path d="M4391 173h428v114h-428z" class="stroke-B1 fill-B6 s0"/></g><text x="4605" y="211.5" class="text-bold fill-N1 s1"><tspan x="4605" dy="0">내음성 수종</tspan><tspan x="4605" dy="17.25">제약: 그늘 아래에서 자랄 수 있는가</tspan><tspan x="4605" dy="17.25">이기는 성질: 어두운 곳에서 발아하고 견딘다</tspan><tspan x="4605" dy="17.25">결과: 하층을 점유했다가 상층으로 올라간다</tspan></text></g><g ><g class="shape"><path d="M173 454h791v114H173z" class="stroke-B2 fill-B6 s2"/></g><text x="568.5" y="492.5" class="text-bold fill-N1 s1"><tspan x="568.5" dy="0">제시된 세 기작. 실제 천이에서는 섞여 작동한다</tspan><tspan x="568.5" dy="17.25">촉진(facilitation): 앞 종이 환경을 바꿔 뒤 종이 들어올 수 있게 한다</tspan><tspan x="568.5" dy="17.25">내성(tolerance): 돕지도 막지도 않고, 자원이 적은 조건을 견디는 쪽이 나중에 우세해진다</tspan><tspan x="568.5" dy="17.25">억제(inhibition): 앞 종이 뒤 종을 막고 있다가 교란이나 죽음으로 자리를 내준다</tspan></text></g><g ><g class="shape"><path d="M232 628h672v130H232z" class="stroke-B2 fill-B6 s2"/></g><text x="568" y="666.5" class="text-bold fill-N1 s1"><tspan x="568" dy="0">종착점은 하나가 아니다</tspan><tspan x="568" dy="17">한때는 지역마다 정해진 극상 군집으로 수렴한다고 보았다</tspan><tspan x="568" dy="17">지금은 교란의 반복, 기후 변화, 어떤 종이 먼저 도착했는가의 우연 때문에</tspan><tspan x="568" dy="17">여러 대안 상태가 가능하다고 본다</tspan><tspan x="568" dy="17">방향성은 관찰되지만 종착점의 유일성은 확립된 사실이 아니다</tspan></text></g><g ><g class="shape"><path d="M372 260h393v114H372z" class="stroke-B1 fill-B5 s0"/></g><text x="568.5" y="298.5" class="text-bold fill-N1 s1"><tspan x="568.5" dy="0">1차 천이</tspan><tspan x="568.5" dy="17.25">토양이 아예 없는 맨땅</tspan><tspan x="568.5" dy="17.25">용암류, 빙하가 물러난 자리, 새 모래언덕</tspan><tspan x="568.5" dy="17.25">수백 년 이상</tspan></text></g><g ><g class="shape"><path d="M367 86h403v114H367z" class="stroke-B1 fill-B5 s0"/></g><text x="568.5" y="124.5" class="text-bold fill-N1 s1"><tspan x="568.5" dy="0">2차 천이</tspan><tspan x="568.5" dy="17.25">식생은 사라졌으나 토양과 종자가 남은 곳</tspan><tspan x="568.5" dy="17.25">산불 자리, 묵논, 벌채지</tspan><tspan x="568.5" dy="17.25">수십 년</tspan></text></g><marker id="mk-d2-3112400516-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3112400516-3488378134)" d="M767.5 317h710" class="connection stroke-B1 s0" mask="url(#d2-3112400516)"/><path fill="none" marker-end="url(#mk-d2-3112400516-3488378134)" d="M772.5 143h1699c152.7 0 744 9.6 944.069 47.26" class="connection stroke-B1 s0" mask="url(#d2-3112400516)"/><text x="2096.5" y="149" class="text-italic fill-N2 s1">토양이 남아 있어 앞 단계를 건너뛴다</text><path fill="none" marker-end="url(#mk-d2-3112400516-3488378134)" d="M1894 317h644" class="connection stroke-B1 s0" mask="url(#d2-3112400516)"/><text x="2217" y="323" class="text-italic fill-N2 s1">촉진 — 앞 종이 뒤 종의 조건을 만든다</text><path fill="none" marker-end="url(#mk-d2-3112400516-3488378134)" d="M2911.5 317c202 0 304-9.6 504.069-47.26" class="connection stroke-B1 s0" mask="url(#d2-3112400516)"/><text x="3166" y="318" class="text-italic fill-N2 s1">촉진 뒤의 경쟁 배제</text><path fill="none" marker-end="url(#mk-d2-3112400516-3488378134)" d="M3831.5 230h556" class="connection stroke-B1 s0" mask="url(#d2-3112400516)"/><text x="4111" y="236" class="text-italic fill-N2 s1">내성 — 견디는 쪽이 남는다</text><mask id="d2-3112400516" width="4848" height="944" x="72" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M72-85h4848v944H72z"/><path d="M1942 133h309v21h-309zM2064 307h306v21h-306zM3082 302h168v21h-168zM4001 220h220v21h-220z"/></mask></svg>