<svg xmlns="http://www.w3.org/2000/svg" width="4765" height="716" class="d2-2651854348 d2-svg" viewBox="-101 -85 4765 716"><rect width="4765" height="716" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2651854348 .fill-N1{fill:#0a0f25}.d2-2651854348 .fill-N2{fill:#676c7e}.d2-2651854348 .fill-B4{fill:#e3e9fd}.d2-2651854348 .fill-B5{fill:#edf0fd}.d2-2651854348 .fill-B6{fill:#f7f8fe}.d2-2651854348 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M265 94h163v82H265z" class="stroke-B1 fill-B6 s0"/></g><text x="346.5" y="132.5" class="text-bold fill-N1 s1"><tspan x="346.5" dy="0">토양 용액</tspan><tspan x="346.5" dy="18.5">물 + 무기 이온</tspan></text></g><g ><g class="shape"><path d="M973 94h255v82H973z" class="stroke-B1 fill-B6 s0"/></g><text x="1100.5" y="132.5" class="text-bold fill-N1 s1"><tspan x="1100.5" dy="0">뿌리털</tspan><tspan x="1100.5" dy="18.5">표면적을 몇 배로 늘린다</tspan></text></g><g ><g class="shape"><path d="M1620 56h512v474h-512z" class="stroke-B1 fill-B4 s0"/></g><text x="1876" y="43" class="fill-N1 s2">피층을 지나는 세 경로</text></g><g ><g class="shape"><path d="M2692 222h1285v300H2692z" class="stroke-B1 fill-B4 s0"/></g><text x="3334.5" y="209" class="fill-N1 s2">내피 — 카스파리대</text></g><g ><g class="shape"><path d="M4368 252h195v82h-195z" class="stroke-B1 fill-B6 s0"/></g><text x="4465.5" y="290.5" class="text-bold fill-N1 s1"><tspan x="4465.5" dy="0">물관부</tspan><tspan x="4465.5" dy="18.5">위로 한 방향 수송</tspan></text></g><g ><g class="shape"><path d="M0 236h692v114H0z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="346" y="274.5" class="text-bold fill-N1 s1"><tspan x="346" dy="0">왜 이렇게 만들었나</tspan><tspan x="346" dy="17.25">· 무엇을 들일지 고르려면 막이 필요하다. 세포벽 틈에는 고를 장치가 없다</tspan><tspan x="346" dy="17.25">· 검문소를 한 겹에 몰아 두면 그 한 겹만 관리하면 된다</tspan><tspan x="346" dy="17.25">· 물관부 안의 농도를 뿌리보다 높게 유지할 수 있어 뿌리압도 여기서 생긴다</tspan></text></g><g ><g class="shape"><path d="M1675 402h401v98h-401z" class="stroke-B1 fill-B5 s0"/></g><text x="1875.5" y="440.5" class="text-bold fill-N1 s1"><tspan x="1875.5" dy="0">세포벽 경로 (아포플라스트)</tspan><tspan x="1875.5" dy="17.667">세포벽 사이의 틈으로만 흐른다</tspan><tspan x="1875.5" dy="17.667">막을 한 번도 지나지 않는다 → 선택이 없다</tspan></text></g><g ><g class="shape"><path d="M1666 86h420v98h-420z" class="stroke-B1 fill-B5 s0"/></g><text x="1876" y="124.5" class="text-bold fill-N1 s1"><tspan x="1876" dy="0">세포질 경로 (심플라스트)</tspan><tspan x="1876" dy="17.667">원형질연락사로 이어진 세포질을 따라 간다</tspan><tspan x="1876" dy="17.667">들어올 때 한 번 막을 지났다</tspan></text></g><g ><g class="shape"><path d="M1650 244h452v98h-452z" class="stroke-B1 fill-B5 s0"/></g><text x="1876" y="282.5" class="text-bold fill-N1 s1"><tspan x="1876" dy="0">가로지름 경로</tspan><tspan x="1876" dy="17.667">세포막을 여러 번 드나든다</tspan><tspan x="1876" dy="17.667">물 통로 단백질(아쿠아포린)이 속도를 조절한다</tspan></text></g><g ><g class="shape"><path d="M2722 410h340v82h-340z" class="stroke-B1 fill-B5 s0"/></g><text x="2892" y="448.5" class="text-bold fill-N1 s1"><tspan x="2892" dy="0">세포벽에 소수성 띠가 둘러져 있어</tspan><tspan x="2892" dy="18.5">세포벽 경로가 여기서 끊긴다</tspan></text></g><g ><g class="shape"><path d="M3584 252h363v82h-363z" class="stroke-B1 fill-B5 s0"/></g><text x="3765.5" y="290.5" class="text-bold fill-N1 s1"><tspan x="3765.5" dy="0">그래서 모든 물과 이온이</tspan><tspan x="3765.5" dy="18.5">적어도 한 번은 세포막을 지나야 한다</tspan></text></g><marker id="mk-d2-2651854348-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2651854348-3488378134)" d="M430.5 135h539" class="connection stroke-B1 s0" mask="url(#d2-2651854348)"/><path fill="none" marker-end="url(#mk-d2-2651854348-3488378134)" d="M1229.5 135h387" class="connection stroke-B1 s0" mask="url(#d2-2651854348)"/><path fill="none" marker-end="url(#mk-d2-2651854348-3488378134)" d="M2078 451h639.5" class="connection stroke-B1 s0" mask="url(#d2-2651854348)"/><text x="2399" y="457" class="text-italic fill-N2 s1">막힌다</text><path fill="none" marker-end="url(#mk-d2-2651854348-3488378134)" d="M2088.5 135h647.75c93.15 0 651.85 23.4 910.483 115.656" class="connection stroke-B1 s0" mask="url(#d2-2651854348)"/><path fill="none" marker-end="url(#mk-d2-2651854348-3488378134)" d="M2104.5 293h1475" class="connection stroke-B1 s0" mask="url(#d2-2651854348)"/><path fill="none" marker-end="url(#mk-d2-2651854348-3488378134)" d="M3064.5 451c206 0 323.6-23.4 582.233-115.656" class="connection stroke-B1 s0" mask="url(#d2-2651854348)"/><text x="3363.5" y="438" class="text-italic fill-N2 s1">막을 지나는 경로로 갈아탄다</text><path fill="none" marker-end="url(#mk-d2-2651854348-3488378134)" d="M3949.5 293h415" class="connection stroke-B1 s0" mask="url(#d2-2651854348)"/><mask id="d2-2651854348" width="4765" height="716" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h4765v716H-101z"/><path d="M2368 441h62v21h-62zM3241 422h245v21h-245z"/></mask></svg>