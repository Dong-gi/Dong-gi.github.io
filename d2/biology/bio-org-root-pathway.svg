<svg xmlns="http://www.w3.org/2000/svg" width="1296" height="1602" class="d2-2640032657 d2-svg" viewBox="-91 -101 1296 1602"><rect width="1296" height="1602" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2640032657 .fill-N1{fill:#0a0f25}.d2-2640032657 .fill-N2{fill:#676c7e}.d2-2640032657 .fill-B4{fill:#e3e9fd}.d2-2640032657 .fill-B5{fill:#edf0fd}.d2-2640032657 .fill-B6{fill:#f7f8fe}.d2-2640032657 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M100 0h163v82H100z" class="stroke-B1 fill-B6 s0"/></g><text x="181.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="181.5" dy="0">토양 용액</tspan><tspan x="181.5" dy="18.5">물 + 무기 이온</tspan></text></g><g ><g class="shape"><path d="M54 182h255v82H54z" class="stroke-B1 fill-B6 s0"/></g><text x="181.5" y="220.5" class="text-bold fill-N1 s1"><tspan x="181.5" dy="0">뿌리털</tspan><tspan x="181.5" dy="18.5">표면적을 몇 배로 늘린다</tspan></text></g><g ><g class="shape"><path d="M10 384h1082v174H10z" class="stroke-B1 fill-B4 s0"/></g><text x="551" y="371" class="fill-N1 s2">피층을 지나는 세 경로</text></g><g ><g class="shape"><path d="M323 719h781v345H323z" class="stroke-B1 fill-B4 s0"/></g><text x="713.5" y="706" class="fill-N1 s2">내피 — 카스파리대</text></g><g ><g class="shape"><path d="M437 1184h195v82H437z" class="stroke-B1 fill-B6 s0"/></g><text x="534.5" y="1222.5" class="text-bold fill-N1 s1"><tspan x="534.5" dy="0">물관부</tspan><tspan x="534.5" dy="18.5">위로 한 방향 수송</tspan></text></g><g ><g class="shape"><path d="M211 1286h692v114H211z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="557" y="1324.5" class="text-bold fill-N1 s1"><tspan x="557" dy="0">왜 이렇게 만들었나</tspan><tspan x="557" dy="17.25">· 무엇을 들일지 고르려면 막이 필요하다. 세포벽 틈에는 고를 장치가 없다</tspan><tspan x="557" dy="17.25">· 검문소를 한 겹에 몰아 두면 그 한 겹만 관리하면 된다</tspan><tspan x="557" dy="17.25">· 물관부 안의 농도를 뿌리보다 높게 유지할 수 있어 뿌리압도 여기서 생긴다</tspan></text></g><g ><g class="shape"><path d="M746 414h316v114H746z" class="stroke-B1 fill-B5 s0"/></g><text x="904" y="452.5" class="text-bold fill-N1 s1"><tspan x="904" dy="0">세포벽 경로 (아포플라스트)</tspan><tspan x="904" dy="17.25">세포벽 사이의 틈으로만 흐른다</tspan><tspan x="904" dy="17.25">막을 한 번도 지나지 않는다</tspan><tspan x="904" dy="17.25">→ 선택이 없다</tspan></text></g><g ><g class="shape"><path d="M40 414h282v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="181" y="452.5" class="text-bold fill-N1 s1"><tspan x="181" dy="0">세포질 경로 (심플라스트)</tspan><tspan x="181" dy="17.25">원형질연락사로 이어진</tspan><tspan x="181" dy="17.25">세포질을 따라 간다</tspan><tspan x="181" dy="17.25">들어올 때 한 번 막을 지났다</tspan></text></g><g ><g class="shape"><path d="M382 414h304v114H382z" class="stroke-B1 fill-B5 s0"/></g><text x="534" y="452.5" class="text-bold fill-N1 s1"><tspan x="534" dy="0">가로지름 경로</tspan><tspan x="534" dy="17.25">세포막을 여러 번 드나든다</tspan><tspan x="534" dy="17.25">물 통로 단백질(아쿠아포린)이</tspan><tspan x="534" dy="17.25">속도를 조절한다</tspan></text></g><g ><g class="shape"><path d="M734 749h340v82H734z" class="stroke-B1 fill-B5 s0"/></g><text x="904" y="787.5" class="text-bold fill-N1 s1"><tspan x="904" dy="0">세포벽에 소수성 띠가 둘러져 있어</tspan><tspan x="904" dy="18.5">세포벽 경로가 여기서 끊긴다</tspan></text></g><g ><g class="shape"><path d="M353 952h363v82H353z" class="stroke-B1 fill-B5 s0"/></g><text x="534.5" y="990.5" class="text-bold fill-N1 s1"><tspan x="534.5" dy="0">그래서 모든 물과 이온이</tspan><tspan x="534.5" dy="18.5">적어도 한 번은 세포막을 지나야 한다</tspan></text></g><marker id="mk-d2-2640032657-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2640032657-3488378134)" d="M181 84v94" class="connection stroke-B1 s0" mask="url(#d2-2640032657)"/><path fill="none" marker-end="url(#mk-d2-2640032657-3488378134)" d="M181 266v114" class="connection stroke-B1 s0" mask="url(#d2-2640032657)"/><path fill="none" marker-end="url(#mk-d2-2640032657-3488378134)" d="M904 530v215" class="connection stroke-B1 s0" mask="url(#d2-2640032657)"/><text x="904" y="644" class="text-italic fill-N2 s1">막힌다</text><path fill="none" marker-end="url(#mk-d2-2640032657-3488378134)" d="M181 530v214.5c0 27.3 41.6 159.2 204.162 206.874" class="connection stroke-B1 s0" mask="url(#d2-2640032657)"/><path fill="none" marker-end="url(#mk-d2-2640032657-3488378134)" d="M534 530v418.5" class="connection stroke-B1 s0" mask="url(#d2-2640032657)"/><path fill="none" marker-end="url(#mk-d2-2640032657-3488378134)" d="M904 832.5c0 46.8-43.8 71.2-215.147 118.927" class="connection stroke-B1 s0" mask="url(#d2-2640032657)"/><text x="820.5" y="920" class="text-italic fill-N2 s1">막을 지나는 경로로 갈아탄다</text><path fill="none" marker-end="url(#mk-d2-2640032657-3488378134)" d="M534 1036v144" class="connection stroke-B1 s0" mask="url(#d2-2640032657)"/><mask id="d2-2640032657" width="1296" height="1602" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1296v1602H-91z"/><path d="M873 628h62v21h-62zM698 904h245v21H698z"/></mask></svg>