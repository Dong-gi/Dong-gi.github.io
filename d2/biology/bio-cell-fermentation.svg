<svg xmlns="http://www.w3.org/2000/svg" width="1257" height="1479" class="d2-3898822497 d2-svg" viewBox="-89 -89 1257 1479"><rect width="1257" height="1479" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3898822497 .text-bold{font-weight:700}.d2-3898822497 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3898822497 .fill-N1{fill:#0a0f25}.d2-3898822497 .fill-N2{fill:#676c7e}.d2-3898822497 .fill-B6{fill:#f7f8fe}.d2-3898822497 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M655 12h104v66H655z" class="stroke-B1 fill-B6 s0"/></g><text x="707" y="50.5" class="text-bold fill-N1 s1">포도당</text></g><g ><g class="shape"><path d="M561 148h292v98H561z" class="stroke-B1 fill-B6 s0"/></g><text x="707" y="186.5" class="text-bold fill-N1 s1"><tspan x="707" dy="0">해당과정</tspan><tspan x="707" dy="17.667">ATP 2 를 번다</tspan><tspan x="707" dy="17.667">NAD+ 를 써서 NADH 2 를 만든다</tspan></text></g><g ><g class="shape"><path d="M619 785h137v66H619z" class="stroke-B1 fill-B6 s0"/></g><text x="687.5" y="823.5" class="text-bold fill-N1 s1">피루브산 2</text></g><g ><g class="shape"><path d="M410 655c-2 0-4 0-5-1l-279-91c-3-1-3-2 0-3l279-92c3-1 7-1 10 0l279 92c3 1 3 2 0 3l-279 91c-1 1-3 1-5 1Z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="410" y="542.5" class="text-bold fill-N1 s1"><tspan x="410" dy="0">세포 안의 NAD+ 는</tspan><tspan x="410" dy="17.25">양이 정해져 있다</tspan><tspan x="410" dy="17.25">다 써 버리면</tspan><tspan x="410" dy="17.25">해당과정이 그 자리에서 멈춘다</tspan></text></g><g ><g class="shape"><path d="M72 939h232v114H72z" class="stroke-B1 fill-B6 s0"/></g><text x="188" y="977.5" class="text-bold fill-N1 s1"><tspan x="188" dy="0">산소가 있으면</tspan><tspan x="188" dy="17.25">NADH 가 전자전달계에</tspan><tspan x="188" dy="17.25">전자를 넘기고</tspan><tspan x="188" dy="17.25">NAD+ 로 돌아온다</tspan></text></g><g ><g class="shape"><path d="M12 1191h353v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="188.5" y="1229.5" class="text-bold fill-N1 s1"><tspan x="188.5" dy="0">피루브산은 미토콘드리아로 들어가</tspan><tspan x="188.5" dy="17.667">완전히 산화된다</tspan><tspan x="188.5" dy="17.667">포도당 하나당 ATP 약 30~32</tspan></text></g><g ><g class="shape"><path d="M354 936h320v114H354z" class="stroke-B1 fill-B6 s0"/></g><text x="514" y="974.5" class="text-bold fill-N1 s1"><tspan x="514" dy="0">젖산 발효</tspan><tspan x="514" dy="17.25">피루브산이 NADH 의 전자를 받아</tspan><tspan x="514" dy="17.25">젖산이 된다</tspan><tspan x="514" dy="17.25">근육, 젖산균</tspan></text></g><g ><g class="shape"><path d="M712 931h228v130H712z" class="stroke-B1 fill-B6 s0"/></g><text x="826" y="969.5" class="text-bold fill-N1 s1"><tspan x="826" dy="0">알코올 발효</tspan><tspan x="826" dy="17">CO2 를 떼고 남은 것이</tspan><tspan x="826" dy="17">NADH 의 전자를 받아</tspan><tspan x="826" dy="17">에탄올이 된다</tspan><tspan x="826" dy="17">효모</tspan></text></g><g ><g class="shape"><path d="M593 1191h298v98H593z" class="stroke-B1 fill-B6 s0"/></g><text x="742" y="1229.5" class="text-bold fill-N1 s1"><tspan x="742" dy="0">NAD+ 가 되돌아온다</tspan><tspan x="742" dy="17.667">→ 해당과정이 계속 돌 수 있다</tspan><tspan x="742" dy="17.667">포도당 하나당 ATP 는 2 뿐이다</tspan></text></g><marker id="mk-d2-3898822497-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="M707.333 80v64" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="M707.333 248v78s0 10 10 10H757s10 0 10 10v339s0 10-10 10h-59.417s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="m634.33 248-.325 288" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><text x="634.5" y="399" class="text-italic fill-N2 s1">NADH 가 쌓인다</text><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="m188.003 585 .491 350" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><text x="188" y="767" class="text-italic fill-N2 s1">산소가 있다</text><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="m387.002 650 .326 282" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><text x="387.5" y="790" class="text-italic fill-N2 s1"><tspan x="387.5" dy="0">산소가 없다</tspan><tspan x="387.5" dy="18.5">(동물, 젖산균)</tspan></text><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="m553.999 611-.077 124s-.006 10 9.994 10h319.333s10 0 10 10v172" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><text x="749" y="743" class="text-italic fill-N2 s1"><tspan x="749" dy="0">산소가 없다</tspan><tspan x="749" dy="18.5">(효모, 식물 일부)</tspan></text><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="M188.5 1055v132" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="M664.75 853v28s0 10-10 10h-77.334s-10 0-10 10v31" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="M710.416 853v28s0 10 10 10h58.5s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="M514.083 1052v39s0 10 10 10h133.833s10 0 10 10v76" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="M742.416 1063v124" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><path fill="none" marker-end="url(#mk-d2-3898822497-3488378134)" d="M816.916 1189v-28s0-10 10-10h169.083s10 0 10-10V296s0-10-10-10H790.333s-10 0-10-10v-26" class="connection stroke-B1 s0" mask="url(#d2-3898822497)"/><text x="1005.5" y="698" class="text-italic fill-N2 s1"><tspan x="1005.5" dy="0">다시 쓸 수 있는</tspan><tspan x="1005.5" dy="18.5">NAD+</tspan></text><mask id="d2-3898822497" width="1257" height="1479" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1257v1479H-89z"/><path d="M572 383h125v21H572zM136 751h104v21H136zM330 774h115v37H330zM680 727h138v37H680zM941 682h129v37H941z"/></mask></svg>