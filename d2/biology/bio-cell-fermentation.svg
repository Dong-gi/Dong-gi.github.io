<svg xmlns="http://www.w3.org/2000/svg" width="1871" height="1144" class="d2-2308916615 d2-svg" viewBox="-90 -101 1871 1144"><rect width="1871" height="1144" x="-90" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2308916615 .fill-N1{fill:#0a0f25}.d2-2308916615 .fill-N2{fill:#676c7e}.d2-2308916615 .fill-B6{fill:#f7f8fe}.d2-2308916615 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M709 0h104v66H709z" class="stroke-B1 fill-B6 s0"/></g><text x="761" y="38.5" class="text-bold fill-N1 s1">포도당</text></g><g ><g class="shape"><path d="M615 166h292v98H615z" class="stroke-B1 fill-B6 s0"/></g><text x="761" y="204.5" class="text-bold fill-N1 s1"><tspan x="761" dy="0">해당과정</tspan><tspan x="761" dy="17.667">ATP 2 를 번다</tspan><tspan x="761" dy="17.667">NAD+ 를 써서 NADH 2 를 만든다</tspan></text></g><g ><g class="shape"><path d="M186 414h137v66H186z" class="stroke-B1 fill-B6 s0"/></g><text x="254.5" y="452.5" class="text-bold fill-N1 s1">피루브산 2</text></g><g ><g class="shape"><path d="M780 509h-7l-387-61c-4-1-4-2 0-2l387-61c4-1 10-1 14 0l387 60c4 1 4 2 0 2l-387 62z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="780" y="444.5" class="text-bold fill-N1 s1"><tspan x="780" dy="0">세포 안의 NAD+ 는 양이 정해져 있다</tspan><tspan x="780" dy="18.5">다 써 버리면 해당과정이 그 자리에서 멈춘다</tspan></text></g><g ><g class="shape"><path d="M1320 638h360v98h-360z" class="stroke-B1 fill-B6 s0"/></g><text x="1500" y="676.5" class="text-bold fill-N1 s1"><tspan x="1500" dy="0">산소가 있으면</tspan><tspan x="1500" dy="17.667">NADH 가 전자전달계에 전자를 넘기고</tspan><tspan x="1500" dy="17.667">NAD+ 로 돌아온다</tspan></text></g><g ><g class="shape"><path d="M1324 844h353v98h-353z" class="stroke-B1 fill-B6 s0"/></g><text x="1500.5" y="882.5" class="text-bold fill-N1 s1"><tspan x="1500.5" dy="0">피루브산은 미토콘드리아로 들어가</tspan><tspan x="1500.5" dy="17.667">완전히 산화된다</tspan><tspan x="1500.5" dy="17.667">포도당 하나당 ATP 약 30~32</tspan></text></g><g ><g class="shape"><path d="M11 630h320v114H11z" class="stroke-B1 fill-B6 s0"/></g><text x="171" y="668.5" class="text-bold fill-N1 s1"><tspan x="171" dy="0">젖산 발효</tspan><tspan x="171" dy="17.25">피루브산이 NADH 의 전자를 받아</tspan><tspan x="171" dy="17.25">젖산이 된다</tspan><tspan x="171" dy="17.25">근육, 젖산균</tspan></text></g><g ><g class="shape"><path d="M628 630h403v114H628z" class="stroke-B1 fill-B6 s0"/></g><text x="829.5" y="668.5" class="text-bold fill-N1 s1"><tspan x="829.5" dy="0">알코올 발효</tspan><tspan x="829.5" dy="17.25">CO2 를 떼고 남은 것이 NADH 의 전자를 받아</tspan><tspan x="829.5" dy="17.25">에탄올이 된다</tspan><tspan x="829.5" dy="17.25">효모</tspan></text></g><g ><g class="shape"><path d="M567 844h298v98H567z" class="stroke-B1 fill-B6 s0"/></g><text x="716" y="882.5" class="text-bold fill-N1 s1"><tspan x="716" dy="0">NAD+ 가 되돌아온다</tspan><tspan x="716" dy="17.667">→ 해당과정이 계속 돌 수 있다</tspan><tspan x="716" dy="17.667">포도당 하나당 ATP 는 2 뿐이다</tspan></text></g><marker id="mk-d2-2308916615-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M760.5 68v94" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M612.545 246.986C326.1 308.912 254 342.5 254 410.5" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M769.824 265.474C777.5 312.3 779.6 336.4 779.966 380" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><text x="778.5" y="329" class="text-italic fill-N2 s1">NADH 가 쌓인다</text><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M974.971 479.338C1394.8 551.4 1500.25 583.3 1500.25 634.5" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><text x="1265" y="535" class="text-italic fill-N2 s1">산소가 있다</text><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M590.033 480.363C204.4 551.6 114.1 581.7 138.597 626.982" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><text x="324.5" y="535" class="text-italic fill-N2 s1">산소가 없다 (동물, 젖산균)</text><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M769.695 509.977C762.4 557.2 767.7 581.7 794.467 627.055" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><text x="765.5" y="578" class="text-italic fill-N2 s1">산소가 없다 (효모, 식물 일부)</text><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M1500.25 738v102" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M248.693 481.476C237.8 551.5 228.4 581.7 203.903 626.982" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M325.473 458.615C862.5 547.257 980.25 581.7 915.5 628.168" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M171.25 746c0 38 79.2 62.4 392.065 119.284" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M829.75 746c0 38-11.4 58-53.993 95.362" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><path fill="none" marker-end="url(#mk-d2-2308916615-3488378134)" d="M867.22 866.5c330.03-57.931 413.03-93.9 413.03-126V508.25c0-36.75-74.6-199.55-369.087-261.921" class="connection stroke-B1 s0" mask="url(#d2-2308916615)"/><text x="1280" y="599" class="text-italic fill-N2 s1">다시 쓸 수 있는 NAD+</text><mask id="d2-2308916615" width="1871" height="1144" x="-90" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-90-101h1871v1144H-90z"/><path d="M716 313h125v21H716zM1213 519h104v21h-104zM215 519h219v21H215zM645 562h241v21H645zM1196 583h168v21h-168z"/></mask></svg>