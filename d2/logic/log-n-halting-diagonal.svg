<svg xmlns="http://www.w3.org/2000/svg" width="2169" height="1799" class="d2-1783673286 d2-svg" viewBox="-101 -121 2169 1799"><rect width="2169" height="1799" x="-101" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1783673286 .fill-N1{fill:#0a0f25}.d2-1783673286 .fill-B4{fill:#e3e9fd}.d2-1783673286 .fill-B5{fill:#edf0fd}.d2-1783673286 .fill-B6{fill:#f7f8fe}.d2-1783673286 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M106 20h428v158H106z" class="stroke-B1 fill-B4 s0"/></g><text x="320" y="7" class="text-bold fill-N1 s1">가정 — 정지 판정 기계 H 가 있다</text></g><g ><g class="shape"><path d="M105 339h429v490H105z" class="stroke-B1 fill-B4 s0"/></g><text x="319.5" y="326" class="text-bold fill-N1 s1">조립 — H 를 부품으로 새 기계 D 를 만든다</text></g><g ><g class="shape"><path d="M220 949h200v66H220z" class="stroke-B1 fill-B6 s0"/></g><text x="320" y="987.5" class="text-bold fill-N1 s2">D 에 ⟨D⟩ 를 먹인다</text></g><g ><g class="shape"><path d="M0 1115h284v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="142" y="1153.5" class="text-bold fill-N1 s2"><tspan x="142" dy="0">D 가 ⟨D⟩ 에서 멈춘다고 하자</tspan><tspan x="142" dy="17.25">→ H 는 예라고 답한다</tspan><tspan x="142" dy="17.25">→ D 는 영원히 돈다</tspan><tspan x="142" dy="17.25">→ 멈추지 않는다</tspan></text></g><g ><g class="shape"><path d="M344 1115h307v114H344z" class="stroke-B1 fill-B6 s0"/></g><text x="497.5" y="1153.5" class="text-bold fill-N1 s2"><tspan x="497.5" dy="0">D 가 ⟨D⟩ 에서 안 멈춘다고 하자</tspan><tspan x="497.5" dy="17.25">→ H 는 아니오라고 답한다</tspan><tspan x="497.5" dy="17.25">→ D 는 곧바로 멈춘다</tspan><tspan x="497.5" dy="17.25">→ 멈춘다</tspan></text></g><g ><g class="shape"><path d="M105 1329h430v66H105z" class="stroke-B1 fill-B6 s0"/></g><text x="320" y="1367.5" class="text-bold fill-N1 s2">두 갈래 모두 자기가 말한 것과 반대로 끝난다</text></g><g ><g class="shape"><path d="M106 1495h428v82H106z" class="stroke-B1 fill-B6 s0"/></g><text x="320" y="1533.5" class="text-bold fill-N1 s2"><tspan x="320" dy="0">쓴 것은 ‘H 가 있다’ 뿐이므로 그것이 틀렸다.</tspan><tspan x="320" dy="18.5">정지 판정 기계는 없다</tspan></text></g><text x="914" y="89" class="fill-N1 s2"><tspan x="914" dy="0">대각선은 어디 있는가. 행이 기계이고 열이 입력인 표를 그리면,</tspan><tspan x="914" dy="17.667">기계도 문자열이므로 두 축이 같은 집합이다. ⟨M, ⟨M⟩⟩ 은 그 표의 대각선 칸이고</tspan><tspan x="914" dy="17.667">D 는 대각선을 자리마다 뒤집는다. 칸토어의 표에서 축 이름만 바꾼 것이다</tspan></text><text x="1635.5" y="89" class="fill-N1 s2"><tspan x="1635.5" dy="0">mcs 는 이 논증을 튜링 기계 없이, ‘문자열 프로시저’ 라는 비형식 모형으로 폈다.</tspan><tspan x="1635.5" dy="17.667">증명한 것도 조금 다르다 — 거기서는 ‘안멈춤 집합은 인식 가능하지 않다’ 였고</tspan><tspan x="1635.5" dy="17.667">여기서는 ‘정지 문제는 결정 가능하지 않다’ 다. 다음 절이 두 진술을 잇는다</tspan></text><g ><g class="shape"><path d="M136 50h368v98H136z" class="stroke-B1 fill-B5 s0"/></g><text x="320" y="88.5" class="text-bold fill-N1 s2"><tspan x="320" dy="0">H 는 ⟨M, w⟩ 를 입력으로 받는다.</tspan><tspan x="320" dy="17.667">반드시 멈추고 예 또는 아니오를 낸다.</tspan><tspan x="320" dy="17.667">예 = M 을 w 에 돌리면 멈춘다</tspan></text></g><g ><g class="shape"><path d="M155 369h330v66H155z" class="stroke-B1 fill-B5 s0"/></g><text x="320" y="407.5" class="text-bold fill-N1 s2">D 는 기계 코드 ⟨M⟩ 하나를 받는다</text></g><g ><g class="shape"><path d="M135 535h369v82H135z" class="stroke-B1 fill-B5 s0"/></g><text x="319.5" y="573.5" class="text-bold fill-N1 s2"><tspan x="319.5" dy="0">H 에게 ⟨M, ⟨M⟩⟩ 을 물어본다</tspan><tspan x="319.5" dy="18.5">= ‘M 을 자기 코드에 돌리면 멈추는가’</tspan></text></g><g ><g class="shape"><path d="M153 717h334v82H153z" class="stroke-B1 fill-B5 s0"/></g><text x="320" y="755.5" class="text-bold fill-N1 s2"><tspan x="320" dy="0">답이 예이면 → 일부러 영원히 돈다</tspan><tspan x="320" dy="18.5">답이 아니오이면 → 곧바로 멈춘다</tspan></text></g><marker id="mk-d2-1783673286-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1783673286-3488378134)" d="M319.75 437v94" class="connection stroke-B1 s0" mask="url(#d2-1783673286)"/><path fill="none" marker-end="url(#mk-d2-1783673286-3488378134)" d="M319.75 619v94" class="connection stroke-B1 s0" mask="url(#d2-1783673286)"/><path fill="none" marker-end="url(#mk-d2-1783673286-3488378134)" d="M319.75 179.5v115" class="connection stroke-B1 s0" mask="url(#d2-1783673286)"/><text x="319.5" y="244" style="fill:#676c7e;text-anchor:middle;font-size:16px">H 가 있으면 D 도 있다</text><path fill="none" marker-end="url(#mk-d2-1783673286-3488378134)" d="M319.75 831v114" class="connection stroke-B1 s0" mask="url(#d2-1783673286)"/><path fill="none" marker-end="url(#mk-d2-1783673286-3488378134)" d="M247.188 1015.847C163.4 1055 142 1075 142 1111" class="connection stroke-B1 s0" mask="url(#d2-1783673286)"/><path fill="none" marker-end="url(#mk-d2-1783673286-3488378134)" d="M392.312 1015.847C476.1 1055 497.5 1075 497.5 1111" class="connection stroke-B1 s0" mask="url(#d2-1783673286)"/><path fill="none" marker-end="url(#mk-d2-1783673286-3488378134)" d="M142 1231c0 38 21.4 58 103.376 96.307" class="connection stroke-B1 s0" mask="url(#d2-1783673286)"/><path fill="none" marker-end="url(#mk-d2-1783673286-3488378134)" d="M497.5 1231c0 38-21.4 58-103.376 96.307" class="connection stroke-B1 s0" mask="url(#d2-1783673286)"/><path fill="none" marker-end="url(#mk-d2-1783673286-3488378134)" d="M319.75 1397v94" class="connection stroke-B1 s0" mask="url(#d2-1783673286)"/><mask id="d2-1783673286" width="2169" height="1799" x="-101" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-121h2169v1799H-101z"/><path d="M232 228h175v21H232z"/></mask></svg>