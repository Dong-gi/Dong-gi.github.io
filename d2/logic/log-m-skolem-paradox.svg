<svg xmlns="http://www.w3.org/2000/svg" width="1341" height="1078" class="d2-2719157684 d2-svg" viewBox="-101 -101 1341 1078"><rect width="1341" height="1078" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2719157684 .fill-N1{fill:#0a0f25}.d2-2719157684 .fill-B4{fill:#e3e9fd}.d2-2719157684 .fill-B5{fill:#edf0fd}.d2-2719157684 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M153 0h834v66H153z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="570" y="38.5" class="text-bold fill-N1 s0">집합론의 공리를 전부 모은 집합 Γ. 이 안에는 ‘비가산 집합이 존재한다’ 가 정리로 들어 있다</text></g><g ><g class="shape"><path d="M0 166h1139v316H0z" class="stroke-B1 fill-B4 s1"/></g><text x="569.5" y="199" class="text-bold fill-N1 s2">같은 모형 ℳ 을 두 자리에서 본다</text></g><g ><g class="shape"><path d="M240 603h660v136H240z" class="stroke-B1 fill-B4 s1"/></g><text x="570" y="636" class="text-bold fill-N1 s2">어긋나는 자리는 한 곳뿐이다</text></g><text x="570" y="855" class="text-bold fill-N1 s0"><tspan x="570" dy="0">그래서 두 칸은 서로 모순되지 않는다. ‘가산이다’ 는 대상 혼자 지니는 성질이 아니라 어느 모형 안에서 보느냐에 딸린 성질이다.</tspan><tspan x="570" dy="18.5">1차 논리의 문장이 붙잡는 것은 언제나 모형 안에서의 뜻뿐이고, 모형 밖에서 우리가 보는 것은 그 문장이 닿지 않는 곳이다</tspan></text><g ><g class="shape"><path d="M8 212h654v66H8z" class="stroke-B1 fill-B5 s1"/></g><text x="335" y="250.5" class="text-bold fill-N1 s0">밖에서 — 우리가 ℳ 을 대상으로 놓고 볼 때</text></g><g ><g class="shape"><path d="M670 212h461v66H670z" class="stroke-B1 fill-B5 s1"/></g><text x="900.5" y="250.5" class="text-bold fill-N1 s0">안에서 — ℳ 이 자기 문장을 판정할 때</text></g><g ><g class="shape"><path d="M8 286h654v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="335" y="324.5" class="text-bold fill-N1 s0"><tspan x="335" dy="0">Γ 가 일관적이면 아래로 뢰벤하임-스콜렘에 따라 가산 모형 ℳ 을 갖는다.</tspan><tspan x="335" dy="18.5">정의역 D 의 원소 전부에 1, 2, 3, … 을 붙일 수 있다</tspan></text></g><g ><g class="shape"><path d="M670 286h461v82H670z" class="stroke-B1 fill-B5 s1"/></g><text x="900.5" y="324.5" class="text-bold fill-N1 s0"><tspan x="900.5" dy="0">ℳ ⊨ ‘비가산 집합 a 가 존재한다’.</tspan><tspan x="900.5" dy="18.5">ℳ 안에서 a 는 셀 수 없는 집합이다</tspan></text></g><g ><g class="shape"><path d="M8 376h654v98H8z" class="stroke-B1 fill-B5 s1"/></g><text x="335" y="414.5" class="text-bold fill-N1 s0"><tspan x="335" dy="0">a 가 가리키는 것도 D 의 원소이고,</tspan><tspan x="335" dy="17.667">ℳ 안에서 a 에 속하는 것들도 D 안에 있다.</tspan><tspan x="335" dy="17.667">그러니 밖에서 세면 그것도 가산이다</tspan></text></g><g ><g class="shape"><path d="M670 376h461v98H670z" class="stroke-B1 fill-B5 s1"/></g><text x="900.5" y="414.5" class="text-bold fill-N1 s0"><tspan x="900.5" dy="0">‘비가산이다’ 가 말하는 것은</tspan><tspan x="900.5" dy="17.667">‘무한한데 ℕ 에서 a 로 가는 전단사가 없다’ 이고,</tspan><tspan x="900.5" dy="17.667">그 전단사도 D 의 원소여야 한다</tspan></text></g><g ><g class="shape"><path d="M248 649h286v82H248z" class="stroke-B1 fill-B5 s1"/></g><text x="391" y="687.5" class="text-bold fill-N1 s0"><tspan x="391" dy="0">밖에는 그 전단사가 있다</tspan><tspan x="391" dy="18.5">— 우리가 D 를 세면서 만든 것</tspan></text></g><g ><g class="shape"><path d="M542 649h350v82H542z" class="stroke-B1 fill-B5 s1"/></g><text x="717" y="687.5" class="text-bold fill-N1 s0"><tspan x="717" dy="0">안에는 그 전단사가 없다</tspan><tspan x="717" dy="18.5">— D 안에 그런 원소가 들어 있지 않다</tspan></text></g><marker id="mk-d2-2719157684-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2719157684-3488378134)" d="M569.5 68v94" class="connection stroke-B1 s1" mask="url(#d2-2719157684)"/><path fill="none" marker-end="url(#mk-d2-2719157684-3488378134)" d="M569.5 483.5v116" class="connection stroke-B1 s1" mask="url(#d2-2719157684)"/><text x="570" y="548" style="fill:#676c7e;text-anchor:middle;font-size:16px">정말 부딪치는가</text><path fill="none" marker-end="url(#mk-d2-2719157684-3488378134)" d="M569.5 741v94" class="connection stroke-B1 s1" mask="url(#d2-2719157684)"/><mask id="d2-2719157684" width="1341" height="1078" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1341V977H-101z"/><path d="M499 532h142v21H499z"/></mask></svg>