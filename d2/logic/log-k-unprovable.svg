<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="976" class="d2-2105545737 d2-svg" viewBox="-101 -101 1188 976"><rect width="1188" height="976" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2105545737 .fill-N1{fill:#0a0f25}.d2-2105545737 .fill-B5{fill:#edf0fd}.d2-2105545737 .fill-B6{fill:#f7f8fe}.d2-2105545737 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M293 0h400v66H293z" class="stroke-B1 fill-B6 s0"/></g><text x="493" y="38.5" class="text-bold fill-N1 s1">묻는 것 — Γ ⊢ φ 가 아님을 어떻게 보이는가</text></g><g ><g class="shape"><path d="M0 166h986v220H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="493" y="199" class="fill-N1" style="text-anchor:middle;font-size:28px">길이 둘 있는데 하나만 끝난다</text></g><g ><g class="shape"><path d="M183 507h620v130H183z" class="stroke-B1 fill-B6 s0"/></g><text x="493" y="545.5" class="text-bold fill-N1 s1"><tspan x="493" dy="0">얻은 것의 크기</tspan><tspan x="493" dy="17"> </tspan><tspan x="493" dy="17">도출은 무한히 많고 ‘그중 하나도 목표에 이르지 않는다’ 는 주장을</tspan><tspan x="493" dy="17">도출을 하나씩 살펴 확인할 방법은 없다.</tspan><tspan x="493" dy="17">그런데 원소 둘짜리 모형 하나가 그 주장을 확정한다</tspan></text></g><text x="493" y="753" class="fill-N1 s1"><tspan x="493" dy="0">다만 이 길은 한 방향뿐이다. Γ ⊨ φ 임을 보였다고 도출이 있다고 말할 수는 없다 —</tspan><tspan x="493" dy="18.5">그 건너뜀을 허락하는 것은 14장의 완전성이고 건전성이 아니다</tspan></text><g ><g class="shape"><path d="M12 212h558v162H12z" class="stroke-B1 fill-B5 s0"/></g><text x="291" y="250.5" class="text-bold fill-N1 s1"><tspan x="291" dy="0">증명 체계 안에서만 — 끝나지 않는 길</tspan><tspan x="291" dy="16.714"> </tspan><tspan x="291" dy="16.714">도출을 하나 찾아본다 → 막혔다 → 다른 길로 → 또 막혔다</tspan><tspan x="291" dy="16.714"> </tspan><tspan x="291" dy="16.714">아무리 되풀이해도 얻는 것은 ‘아직 못 찾았다’ 하나뿐이다.</tspan><tspan x="291" dy="16.714">도출은 무한히 많으므로 다 살펴볼 수 없다.</tspan><tspan x="291" dy="16.714">7장이 이 문서의 가장 큰 구멍이라 부른 자리다</tspan></text></g><g ><g class="shape"><path d="M582 212h392v162H582z" class="stroke-B1 fill-B5 s0"/></g><text x="778" y="258.5" class="text-bold fill-N1 s1"><tspan x="778" dy="0">두 층을 잇는 길 — 세 걸음에 끝난다</tspan><tspan x="778" dy="16.833"> </tspan><tspan x="778" dy="16.833">① 반례를 하나 만든다 — Γ 를 모두 참으로,</tspan><tspan x="778" dy="16.833"> φ 는 거짓으로 만드는 배당 또는 모형</tspan><tspan x="778" dy="16.833">② 의미론의 결론 — Γ ⊨ φ 가 아니다</tspan><tspan x="778" dy="16.833">③ 건전성의 대우 — Γ ⊢ φ 도 아니다. 확정</tspan></text></g><marker id="mk-d2-2105545737-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2105545737-3488378134)" d="M493 68v94" class="connection stroke-B1 s0" mask="url(#d2-2105545737)"/><path fill="none" marker-end="url(#mk-d2-2105545737-3488378134)" d="M493 387.5v116" class="connection stroke-B1 s0" mask="url(#d2-2105545737)"/><text x="493.5" y="452" style="fill:#676c7e;text-anchor:middle;font-size:16px">오른쪽 길에서만 나온다</text><path fill="none" marker-end="url(#mk-d2-2105545737-3488378134)" d="M493 639v94" class="connection stroke-B1 s0" mask="url(#d2-2105545737)"/><mask id="d2-2105545737" width="1188" height="976" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1188v976H-101z"/><path d="M392 436h203v21H392z"/></mask></svg>