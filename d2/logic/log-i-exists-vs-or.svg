<svg xmlns="http://www.w3.org/2000/svg" width="1153" height="1217" class="d2-2109520308 d2-svg" viewBox="-101 -101 1153 1217"><rect width="1153" height="1217" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2109520308 .fill-N1{fill:#0a0f25}.d2-2109520308 .fill-B5{fill:#edf0fd}.d2-2109520308 .fill-B6{fill:#f7f8fe}.d2-2109520308 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:24px}</style><g ><g class="shape"><path d="M0 0h951v862H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="475.5" y="33" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">같은 짜임을 두 번 — 낱말만 바꾼다</text></g><text x="476" y="978" class="text-bold fill-N1 s0"><tspan x="476" dy="0">∨ 도 ∃ 도 ‘있기는 한데 어느 것인지 모른다’ 를 말한다. 둘을 쓰는 방법은 하나뿐이다 —</tspan><tspan x="476" dy="17.667">모르는 채로 경우를 나누고, 어느 경우든 같은 결론에 이르렀음을 보이는 것.</tspan><tspan x="476" dy="17.667">∃ 는 경우가 유한하지 않아 이름 하나로 대표시키고, 그 대표가 진짜 대표인지 확인하는 절차가 변수 조건이다</tspan></text><g ><g class="shape"><path d="M12 82h383v768H12z" class="stroke-B1 fill-B5 s1"/></g><text x="203.5" y="70" class="text-bold fill-N1 s2">∨E — 7장</text></g><g ><g class="shape"><path d="M407 82h532v768H407z" class="stroke-B1 fill-B5 s1"/></g><text x="673" y="70" class="text-bold fill-N1 s2">∃E — 11장</text></g><g ><g class="shape"><path d="M88 112h232v98H88z" class="stroke-B1 fill-B6 s1"/></g><text x="204" y="150.5" class="text-bold fill-N1 s0"><tspan x="204" dy="0">손에 든 것</tspan><tspan x="204" dy="17.667">φ ∨ ψ</tspan><tspan x="204" dy="17.667">어느 쪽인지는 모른다</tspan></text></g><g ><g class="shape"><path d="M89 310h229v98H89z" class="stroke-B1 fill-B6 s1"/></g><text x="203.5" y="348.5" class="text-bold fill-N1 s0"><tspan x="203.5" dy="0">갈래를 연다</tspan><tspan x="203.5" dy="17.667">φ 를 가정한 갈래 하나</tspan><tspan x="203.5" dy="17.667">ψ 를 가정한 갈래 하나</tspan></text></g><g ><g class="shape"><path d="M57 508h293v82H57z" class="stroke-B1 fill-B6 s1"/></g><text x="203.5" y="546.5" class="text-bold fill-N1 s0"><tspan x="203.5" dy="0">두 갈래가 같은 χ 에 이르면</tspan><tspan x="203.5" dy="18.5">χ 를 적고 두 가정을 방출한다</tspan></text></g><g ><g class="shape"><path d="M42 690h323v82H42z" class="stroke-B1 fill-B6 s1"/></g><text x="203.5" y="728.5" class="text-bold fill-N1 s0"><tspan x="203.5" dy="0">갈래가 둘뿐이라 다 적을 수 있다</tspan><tspan x="203.5" dy="18.5">조건이 붙지 않는다</tspan></text></g><g ><g class="shape"><path d="M557 112h232v98H557z" class="stroke-B1 fill-B6 s1"/></g><text x="673" y="150.5" class="text-bold fill-N1 s0"><tspan x="673" dy="0">손에 든 것</tspan><tspan x="673" dy="17.667">∃x φ</tspan><tspan x="673" dy="17.667">어느 것인지는 모른다</tspan></text></g><g ><g class="shape"><path d="M515 310h316v114H515z" class="stroke-B1 fill-B6 s1"/></g><text x="673" y="348.5" class="text-bold fill-N1 s0"><tspan x="673" dy="0">갈래를 연다 — 하나뿐이다</tspan><tspan x="673" dy="17.25">φ[c/x] 를 가정한 갈래.</tspan><tspan x="673" dy="17.25">c 는 ‘그 무엇인지 모르는 것’ 에</tspan><tspan x="673" dy="17.25">임시로 붙인 이름이다</tspan></text></g><g ><g class="shape"><path d="M538 524h270v82H538z" class="stroke-B1 fill-B6 s1"/></g><text x="673" y="562.5" class="text-bold fill-N1 s0"><tspan x="673" dy="0">그 갈래가 ψ 에 이르면</tspan><tspan x="673" dy="18.5">ψ 를 적고 가정을 방출한다</tspan></text></g><g ><g class="shape"><path d="M437 706h472v114H437z" class="stroke-B1 fill-B6 s1"/></g><text x="673" y="744.5" class="text-bold fill-N1 s0"><tspan x="673" dy="0">갈래가 D 의 원소 수만큼이라 다 적을 수 없다.</tspan><tspan x="673" dy="17.25">그래서 갈래 하나로 전부를 대신한다.</tspan><tspan x="673" dy="17.25">대신하려면 그 갈래가 c 에 대해 특별한 것을</tspan><tspan x="673" dy="17.25">하나도 쓰지 않았어야 하고, 그것이 변수 조건이다</tspan></text></g><marker id="mk-d2-2109520308-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2109520308-3488378134)" d="M203.5 212v94" class="connection stroke-B1 s1" mask="url(#d2-2109520308)"/><path fill="none" marker-end="url(#mk-d2-2109520308-3488378134)" d="M203.5 410v94" class="connection stroke-B1 s1" mask="url(#d2-2109520308)"/><path fill="none" marker-end="url(#mk-d2-2109520308-3488378134)" d="M203.5 592v94" class="connection stroke-B1 s1" mask="url(#d2-2109520308)"/><path fill="none" marker-end="url(#mk-d2-2109520308-3488378134)" d="M673 212v94" class="connection stroke-B1 s1" mask="url(#d2-2109520308)"/><path fill="none" marker-end="url(#mk-d2-2109520308-3488378134)" d="M673 426v94" class="connection stroke-B1 s1" mask="url(#d2-2109520308)"/><path fill="none" marker-end="url(#mk-d2-2109520308-3488378134)" d="M673 608v94" class="connection stroke-B1 s1" mask="url(#d2-2109520308)"/><path fill="none" marker-end="url(#mk-d2-2109520308-3488378134)" d="M475.5 864v94" class="connection stroke-B1 s1" mask="url(#d2-2109520308)"/><mask id="d2-2109520308" width="1153" height="1217" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1153v1217H-101z"/></mask></svg>