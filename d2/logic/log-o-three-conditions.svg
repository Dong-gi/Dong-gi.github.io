<svg xmlns="http://www.w3.org/2000/svg" width="1283" height="764" class="d2-3772032059 d2-svg" viewBox="-101 -101 1283 764"><rect width="1283" height="764" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3772032059 .fill-N1{fill:#0a0f25}.d2-3772032059 .fill-B4{fill:#e3e9fd}.d2-3772032059 .fill-B5{fill:#edf0fd}.d2-3772032059 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h1081v136H0z" class="stroke-B1 fill-B4 s0"/></g><text x="540.5" y="33" class="text-bold fill-N1 s1">세 조건을 다 만족하는 T 에만 정리가 적용된다</text></g><g ><g class="shape"><path d="M43 257h996v168H43z" class="stroke-B1 fill-B4 s0"/></g><text x="541" y="290" class="text-bold fill-N1 s1">하나를 빼면 — 실제로 완전한 이론이 있다</text></g><text x="541" y="541" class="text-bold fill-N1 s2"><tspan x="541" dy="0">‘괴델은 어떤 체계도 완전할 수 없음을 보였다’ 는 문장이 틀린 이유가 아래 줄이다.</tspan><tspan x="541" dy="18.5">조건 셋을 빼고 진술하면 저 세 이론이 전부 반례가 된다</tspan></text><g ><g class="shape"><path d="M8 46h333v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="174.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="174.5" dy="0">(가) 산술을 담을 만큼 강하다</tspan><tspan x="174.5" dy="18.5">적어도 로빈슨 산술 Q 를 증명한다</tspan></text></g><g ><g class="shape"><path d="M349 46h400v82H349z" class="stroke-B1 fill-B5 s0"/></g><text x="549" y="84.5" class="text-bold fill-N1 s2"><tspan x="549" dy="0">(나) 재귀적으로 공리화된다</tspan><tspan x="549" dy="18.5">어떤 기호열이 공리인지 기계가 판정한다</tspan></text></g><g ><g class="shape"><path d="M757 46h316v82H757z" class="stroke-B1 fill-B5 s0"/></g><text x="915" y="84.5" class="text-bold fill-N1 s2"><tspan x="915" dy="0">(다) 일관적이다</tspan><tspan x="915" dy="18.5">φ 와 ¬φ 를 함께 도출하지 않는다</tspan></text></g><g ><g class="shape"><path d="M51 303h281v114H51z" class="stroke-B1 fill-B5 s0"/></g><text x="191.5" y="349.5" class="text-bold fill-N1 s2"><tspan x="191.5" dy="0">(가) 없음 — 프레스버거 산술</tspan><tspan x="191.5" dy="17.667">덧셈만 있고 곱셈이 없다.</tspan><tspan x="191.5" dy="17.667">완전하고 결정 가능하다</tspan></text></g><g ><g class="shape"><path d="M340 303h382v114H340z" class="stroke-B1 fill-B5 s0"/></g><text x="531" y="341.5" class="text-bold fill-N1 s2"><tspan x="531" dy="0">(나) 없음 — 진 산술 Th(ℕ)</tspan><tspan x="531" dy="17.25">ℕ 에서 참인 문장을 전부 공리로 삼는다.</tspan><tspan x="531" dy="17.25">완전하다. 그러나 공리 목록을</tspan><tspan x="531" dy="17.25">기계가 알아볼 수 없다</tspan></text></g><g ><g class="shape"><path d="M730 303h301v114H730z" class="stroke-B1 fill-B5 s0"/></g><text x="880.5" y="349.5" class="text-bold fill-N1 s2"><tspan x="880.5" dy="0">(다) 없음 — 비일관 이론</tspan><tspan x="880.5" dy="17.667">⊥E 로 모든 문장을 도출한다.</tspan><tspan x="880.5" dy="17.667">완전하다. 그리고 쓸모가 없다</tspan></text></g><marker id="mk-d2-3772032059-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3772032059-3488378134)" d="M540.5 137.5v116" class="connection stroke-B1 s0" mask="url(#d2-3772032059)"/><text x="540.5" y="202" style="fill:#676c7e;text-anchor:middle;font-size:16px">위아래로 짝지어 읽는다</text><path fill="none" marker-end="url(#mk-d2-3772032059-3488378134)" d="M540.5 427v94" class="connection stroke-B1 s0" mask="url(#d2-3772032059)"/><mask id="d2-3772032059" width="1283" height="764" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1283v764H-101z"/><path d="M439 186h203v21H439z"/></mask></svg>