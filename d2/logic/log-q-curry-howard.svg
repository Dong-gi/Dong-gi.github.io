<svg xmlns="http://www.w3.org/2000/svg" width="1109" height="1265" class="d2-1235738313 d2-svg" viewBox="-101 -101 1109 1265"><rect width="1109" height="1265" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1235738313 .fill-N1{fill:#0a0f25}.d2-1235738313 .fill-B5{fill:#edf0fd}.d2-1235738313 .stroke-B1,.d2-1235738313 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{stroke-width:2;stroke-dasharray:8,7.892511}</style><g ><g class="shape"><path d="M67 0h774v910H67z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="454" y="33" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">명제는 타입이고, 증명은 프로그램이다</text></g><text x="453.5" y="1026" class="text-bold fill-N1 s0"><tspan x="453.5" dy="0">BHK 해석의 오른쪽 칸이 전부 ‘쌍’, ‘함수’, ‘표가 붙은 값’ 이었던 것이 우연이 아니다.</tspan><tspan x="453.5" dy="17.667">직관주의 증명은 그대로 프로그램이고, 존재 정리를 증명하면 증인을 계산하는 프로그램이 딸려 나온다.</tspan><tspan x="453.5" dy="17.667">마지막 줄이 이 대응의 경계다 — 언어에 제어 흐름을 뒤집는 장치를 넣으면 대응이 고전 논리까지 늘어난다</tspan></text><g ><g class="shape"><path d="M73 46h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="84.5" class="text-bold fill-N1 s0">논리 쪽 — 7장에서 세운 것</text></g><g ><g class="shape"><path d="M395 46h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="84.5" class="text-bold fill-N1 s0">프로그램 쪽</text></g><g ><g class="shape"><path d="M73 118h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="156.5" class="text-bold fill-N1 s0">명제 φ</text></g><g ><g class="shape"><path d="M395 118h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="156.5" class="text-bold fill-N1 s0">타입 φ</text></g><g ><g class="shape"><path d="M73 190h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="228.5" class="text-bold fill-N1 s0">φ 의 증명</text></g><g ><g class="shape"><path d="M395 190h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="228.5" class="text-bold fill-N1 s0">타입 φ 를 갖는 프로그램</text></g><g ><g class="shape"><path d="M73 262h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="300.5" class="text-bold fill-N1 s0">φ → ψ</text></g><g ><g class="shape"><path d="M395 262h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="300.5" class="text-bold fill-N1 s0">φ 를 받아 ψ 를 돌려주는 함수의 타입</text></g><g ><g class="shape"><path d="M73 334h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="372.5" class="text-bold fill-N1 s0">→I — 가정을 열고 닫는다</text></g><g ><g class="shape"><path d="M395 334h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="372.5" class="text-bold fill-N1 s0">함수를 정의한다. 가정이 매개변수가 된다</text></g><g ><g class="shape"><path d="M73 406h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="444.5" class="text-bold fill-N1 s0">→E — 전건 긍정</text></g><g ><g class="shape"><path d="M395 406h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="444.5" class="text-bold fill-N1 s0">함수를 호출한다</text></g><g ><g class="shape"><path d="M73 478h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="516.5" class="text-bold fill-N1 s0">φ ∧ ψ 와 ∧E</text></g><g ><g class="shape"><path d="M395 478h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="516.5" class="text-bold fill-N1 s0">쌍의 타입. ∧E 는 쌍에서 한쪽을 꺼내는 일</text></g><g ><g class="shape"><path d="M73 550h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="588.5" class="text-bold fill-N1 s0">φ ∨ ψ 와 ∨E</text></g><g ><g class="shape"><path d="M395 550h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="588.5" class="text-bold fill-N1 s0">어느 쪽인지 표가 붙은 값의 타입. ∨E 는 분기</text></g><g ><g class="shape"><path d="M73 622h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="660.5" class="text-bold fill-N1 s0">⊥</text></g><g ><g class="shape"><path d="M395 622h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="660.5" class="text-bold fill-N1 s0">값이 하나도 없는 타입</text></g><g ><g class="shape"><path d="M73 694h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="732.5" class="text-bold fill-N1 s0">∃x Fx 의 증명</text></g><g ><g class="shape"><path d="M395 694h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="732.5" class="text-bold fill-N1 s0">원소 하나와 그것에 대한 증명의 쌍</text></g><g ><g class="shape"><path d="M73 766h316v66H73z" class="stroke-B1 fill-B5 s1"/></g><text x="231" y="804.5" class="text-bold fill-N1 s0">증명에서 군더더기를 없애는 일</text></g><g ><g class="shape"><path d="M395 766h440v66H395z" class="stroke-B1 fill-B5 s1"/></g><text x="615" y="804.5" class="text-bold fill-N1 s0">프로그램을 실행하는 일</text></g><g ><g class="shape"><path d="M73 838h316v66H73z" class="stroke-B2 fill-B5 s2"/></g><text x="231" y="876.5" class="text-bold fill-N1 s0">IP</text></g><g ><g class="shape"><path d="M395 838h440v66H395z" class="stroke-B2 fill-B5 s2"/></g><text x="615" y="876.5" class="text-bold fill-N1 s0">짝이 없다 — ¬¬φ → φ 타입의 함수는 적을 수 없다</text></g><marker id="mk-d2-1235738313-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1235738313-3488378134)" d="M453.5 912v94" class="connection stroke-B1 s1" mask="url(#d2-1235738313)"/><mask id="d2-1235738313" width="1109" height="1265" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1109v1265H-101z"/></mask></svg>