<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="1121" class="d2-209203246 d2-svg" viewBox="-101 -101 1248 1121"><rect width="1248" height="1121" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-209203246 .fill-N1{fill:#0a0f25}.d2-209203246 .fill-B4{fill:#e3e9fd}.d2-209203246 .fill-B5{fill:#edf0fd}.d2-209203246 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M87 0h872v480H87z" class="stroke-B1 fill-B4 s0"/></g><text x="523" y="33" class="fill-N1 s1">규칙표</text></g><g ><g class="shape"><path d="M0 580h1046v202H0z" class="stroke-B1 fill-B4 s0"/></g><text x="523" y="613" class="text-bold fill-N1 s1">조건이 붙고 안 붙고를 가르는 것</text></g><text x="523" y="898" class="fill-N1 s2"><tspan x="523" dy="0">∀I 나 ∃E 를 쓸 때마다 도출 어디에도 없던 새 이름을 만들어 쓰면 조건이 저절로 통과된다.</tspan><tspan x="523" dy="18.5">조건을 실제로 따지는 일은 남의 도출을 검사할 때 남는다</tspan></text><g ><g class="shape"><path d="M95 46h181v66H95z" class="stroke-B1 fill-B5 s0"/></g><text x="185.5" y="84.5" class="text-bold fill-N1 s2">규칙</text></g><g ><g class="shape"><path d="M284 46h186v66H284z" class="stroke-B1 fill-B5 s0"/></g><text x="377" y="84.5" class="text-bold fill-N1 s2">재료</text></g><g ><g class="shape"><path d="M478 46h238v66H478z" class="stroke-B1 fill-B5 s0"/></g><text x="597" y="84.5" class="text-bold fill-N1 s2">결과</text></g><g ><g class="shape"><path d="M724 46h227v66H724z" class="stroke-B1 fill-B5 s0"/></g><text x="837.5" y="84.5" class="text-bold fill-N1 s2">변수 조건</text></g><g ><g class="shape"><path d="M95 120h181v82H95z" class="stroke-B1 fill-B5 s0"/></g><text x="185.5" y="166.5" class="text-bold fill-N1 s2">∀E — 전칭 예화</text></g><g ><g class="shape"><path d="M284 120h186v82H284z" class="stroke-B1 fill-B5 s0"/></g><text x="377" y="166.5" class="text-bold fill-N1 s2">∀x φ</text></g><g ><g class="shape"><path d="M478 120h238v82H478z" class="stroke-B1 fill-B5 s0"/></g><text x="597" y="158.5" class="text-bold fill-N1 s2"><tspan x="597" dy="0">φ[a/x]</tspan><tspan x="597" dy="18.5">a 는 아무 개체상수나</tspan></text></g><g ><g class="shape"><path d="M724 120h227v82H724z" class="stroke-B1 fill-B5 s0"/></g><text x="837.5" y="166.5" class="text-bold fill-N1 s2">없다</text></g><g ><g class="shape"><path d="M95 210h181v66H95z" class="stroke-B1 fill-B5 s0"/></g><text x="185.5" y="248.5" class="text-bold fill-N1 s2">∃I — 존재 일반화</text></g><g ><g class="shape"><path d="M284 210h186v66H284z" class="stroke-B1 fill-B5 s0"/></g><text x="377" y="248.5" class="text-bold fill-N1 s2">φ[a/x]</text></g><g ><g class="shape"><path d="M478 210h238v66H478z" class="stroke-B1 fill-B5 s0"/></g><text x="597" y="248.5" class="text-bold fill-N1 s2">∃x φ</text></g><g ><g class="shape"><path d="M724 210h227v66H724z" class="stroke-B1 fill-B5 s0"/></g><text x="837.5" y="248.5" class="text-bold fill-N1 s2">없다</text></g><g ><g class="shape"><path d="M95 284h181v82H95z" class="stroke-B1 fill-B5 s0"/></g><text x="185.5" y="330.5" class="text-bold fill-N1 s2">∀I — 전칭 일반화</text></g><g ><g class="shape"><path d="M284 284h186v82H284z" class="stroke-B1 fill-B5 s0"/></g><text x="377" y="330.5" class="text-bold fill-N1 s2">φ[c/x]</text></g><g ><g class="shape"><path d="M478 284h238v82H478z" class="stroke-B1 fill-B5 s0"/></g><text x="597" y="330.5" class="text-bold fill-N1 s2">∀x φ</text></g><g ><g class="shape"><path d="M724 284h227v82H724z" class="stroke-B1 fill-B5 s0"/></g><text x="837.5" y="322.5" class="text-bold fill-N1 s2"><tspan x="837.5" dy="0">c 가 열린 가정에 없고</tspan><tspan x="837.5" dy="18.5">결과 ∀x φ 에도 없다</tspan></text></g><g ><g class="shape"><path d="M95 374h181v98H95z" class="stroke-B1 fill-B5 s0"/></g><text x="185.5" y="428.5" class="text-bold fill-N1 s2">∃E — 존재 예화</text></g><g ><g class="shape"><path d="M284 374h186v98H284z" class="stroke-B1 fill-B5 s0"/></g><text x="377" y="412.5" class="text-bold fill-N1 s2"><tspan x="377" dy="0">∃x φ, 그리고</tspan><tspan x="377" dy="17.667">φ[c/x] 를 가정해</tspan><tspan x="377" dy="17.667">ψ 에 이르는 갈래</tspan></text></g><g ><g class="shape"><path d="M478 374h238v98H478z" class="stroke-B1 fill-B5 s0"/></g><text x="597" y="420.5" class="text-bold fill-N1 s2"><tspan x="597" dy="0">ψ</tspan><tspan x="597" dy="18.5">가정 φ[c/x] 를 방출한다</tspan></text></g><g ><g class="shape"><path d="M724 374h227v98H724z" class="stroke-B1 fill-B5 s0"/></g><text x="837.5" y="420.5" class="text-bold fill-N1 s2"><tspan x="837.5" dy="0">c 가 열린 가정에 없고</tspan><tspan x="837.5" dy="18.5">∃x φ 에도 ψ 에도 없다</tspan></text></g><g ><g class="shape"><path d="M10 626h436v146H10z" class="stroke-B1 fill-B5 s0"/></g><text x="228" y="664.5" class="text-bold fill-N1 s2"><tspan x="228" dy="0">위 둘 — 이름을 내가 고른다</tspan><tspan x="228" dy="16.833"> </tspan><tspan x="228" dy="16.833">∀E 는 ‘모두에게 성립하니 이 이름에도’ 이고</tspan><tspan x="228" dy="16.833">∃I 는 ‘이 이름에 성립하니 어떤 것이 있다’ 다.</tspan><tspan x="228" dy="16.833">고른 이름에 대해 무엇을 알든 상관없다.</tspan><tspan x="228" dy="16.833">그래서 살펴볼 곳이 없다</tspan></text></g><g ><g class="shape"><path d="M456 626h580v146H456z" class="stroke-B1 fill-B5 s0"/></g><text x="746" y="664.5" class="text-bold fill-N1 s2"><tspan x="746" dy="0">아래 둘 — 이름이 아무 것이어도 되어야 한다</tspan><tspan x="746" dy="16.833"> </tspan><tspan x="746" dy="16.833">∀I 는 ‘아무 것에 성립하니 모두에게’ 이고</tspan><tspan x="746" dy="16.833">∃E 는 ‘무엇인지 모르는 하나를 임시로 c 라 부르자’ 다.</tspan><tspan x="746" dy="16.833">둘 다 c 에 대해 우리가 따로 아는 것이 하나도 없어야 말이 된다.</tspan><tspan x="746" dy="16.833">그 ‘아는 것이 없다’ 를 문법으로 옮긴 것이 변수 조건이다</tspan></text></g><marker id="mk-d2-209203246-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-209203246-3488378134)" d="M523 482v94" class="connection stroke-B1 s0" mask="url(#d2-209203246)"/><path fill="none" marker-end="url(#mk-d2-209203246-3488378134)" d="M523 784v94" class="connection stroke-B1 s0" mask="url(#d2-209203246)"/><mask id="d2-209203246" width="1248" height="1121" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1248v1121H-101z"/></mask></svg>