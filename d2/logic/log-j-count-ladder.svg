<svg xmlns="http://www.w3.org/2000/svg" width="1387" height="1018" class="d2-2879068686 d2-svg" viewBox="-101 -101 1387 1018"><rect width="1387" height="1018" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2879068686 .fill-N1{fill:#0a0f25}.d2-2879068686 .fill-B4{fill:#e3e9fd}.d2-2879068686 .fill-B5{fill:#edf0fd}.d2-2879068686 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M82 0h1022v390H82z" class="stroke-B1 fill-B4 s0"/></g><text x="593" y="33" class="text-bold fill-N1 s1">F 인 것을 세는 문장 셋</text></g><text x="592.5" y="506" class="text-bold fill-N1 s2"><tspan x="592.5" dy="0">≠ 와 = 가 하는 일이 서로 반대라는 것이 요점이다. ‘적어도’ 쪽에서 ≠ 를 빼면 두 ∃ 가 같은 점을 집을 수 있어 아무 수도 세지 못하고,</tspan><tspan x="592.5" dy="18.5">‘많아야’ 쪽에서 = 를 빼면 후건에 넣을 것이 남지 않아 문장 자체를 적을 수 없다. 두 문장 다 동일성 없이는 쓸 수 없다</tspan></text><g ><g class="shape"><path d="M0 648h1185v168H0z" class="stroke-B1 fill-B4 s0"/></g><text x="592.5" y="681" class="text-bold fill-N1 s1">F 를 지우면 정의역의 크기를 세는 문장이 된다</text></g><g ><g class="shape"><path d="M90 46h209v66H90z" class="stroke-B1 fill-B5 s0"/></g><text x="194.5" y="84.5" class="text-bold fill-N1 s2">무엇을 말하려는가</text></g><g ><g class="shape"><path d="M307 46h273v66H307z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="84.5" class="text-bold fill-N1 s2">그것을 적은 문장</text></g><g ><g class="shape"><path d="M588 46h508v66H588z" class="stroke-B1 fill-B5 s0"/></g><text x="842" y="84.5" class="text-bold fill-N1 s2">모양의 규칙성</text></g><g ><g class="shape"><path d="M90 120h209v82H90z" class="stroke-B1 fill-B5 s0"/></g><text x="194.5" y="158.5" class="text-bold fill-N1 s2"><tspan x="194.5" dy="0">F 인 것이</tspan><tspan x="194.5" dy="18.5">적어도 둘 있다</tspan></text></g><g ><g class="shape"><path d="M307 120h273v82H307z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="166.5" class="text-bold fill-N1 s2">∃x ∃y (Fx ∧ Fy ∧ x ≠ y)</text></g><g ><g class="shape"><path d="M588 120h508v82H588z" class="stroke-B1 fill-B5 s0"/></g><text x="842" y="158.5" class="text-bold fill-N1 s2"><tspan x="842" dy="0">세려는 만큼 ∃ 를 쌓고, 고른 것들이 서로</tspan><tspan x="842" dy="18.5">다르다고 못 박는다. 적어도 n 개면 ≠ 가 n(n−1)/2 개</tspan></text></g><g ><g class="shape"><path d="M90 210h209v82H90z" class="stroke-B1 fill-B5 s0"/></g><text x="194.5" y="248.5" class="text-bold fill-N1 s2"><tspan x="194.5" dy="0">F 인 것이</tspan><tspan x="194.5" dy="18.5">많아야 둘 있다</tspan></text></g><g ><g class="shape"><path d="M307 210h273v82H307z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="248.5" class="text-bold fill-N1 s2"><tspan x="443.5" dy="0">∀x ∀y ∀z ((Fx ∧ Fy ∧ Fz)</tspan><tspan x="443.5" dy="18.5">→ (x = y ∨ x = z ∨ y = z))</tspan></text></g><g ><g class="shape"><path d="M588 210h508v82H588z" class="stroke-B1 fill-B5 s0"/></g><text x="842" y="248.5" class="text-bold fill-N1 s2"><tspan x="842" dy="0">하나 더 많게 ∀ 를 쌓아 셋을 집어 오고, 셋 중</tspan><tspan x="842" dy="18.5">어딘가는 겹친다고 요구한다. 많아야 n 개면 ∀ 가 n+1 개</tspan></text></g><g ><g class="shape"><path d="M90 300h209v82H90z" class="stroke-B1 fill-B5 s0"/></g><text x="194.5" y="338.5" class="text-bold fill-N1 s2"><tspan x="194.5" dy="0">F 인 것이</tspan><tspan x="194.5" dy="18.5">정확히 둘 있다</tspan></text></g><g ><g class="shape"><path d="M307 300h273v82H307z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="346.5" class="text-bold fill-N1 s2">위의 두 문장을 ∧ 로 묶는다</text></g><g ><g class="shape"><path d="M588 300h508v82H588z" class="stroke-B1 fill-B5 s0"/></g><text x="842" y="346.5" class="text-bold fill-N1 s2">새 모양이 아니다 — 적어도 n 개 ∧ 많아야 n 개</text></g><g ><g class="shape"><path d="M8 694h319v114H8z" class="stroke-B1 fill-B5 s0"/></g><text x="167.5" y="748.5" class="text-bold fill-N1 s2"><tspan x="167.5" dy="0">λ₂ = ∃x ∃y x ≠ y</tspan><tspan x="167.5" dy="18.5">정의역에 원소가 적어도 둘 있다</tspan></text></g><g ><g class="shape"><path d="M335 694h342v114H335z" class="stroke-B1 fill-B5 s0"/></g><text x="506" y="748.5" class="text-bold fill-N1 s2"><tspan x="506" dy="0">λ₃ = ∃x ∃y ∃z (x ≠ y ∧ x ≠ z ∧ y ≠ z)</tspan><tspan x="506" dy="18.5">적어도 셋 있다. ≠ 가 셋으로 늘었다</tspan></text></g><g ><g class="shape"><path d="M685 694h492v114H685z" class="stroke-B1 fill-B5 s0"/></g><text x="931" y="732.5" class="text-bold fill-N1 s2"><tspan x="931" dy="0">λₙ — 적어도 n 개.</tspan><tspan x="931" dy="17.25">10장이 ‘크기 k 까지만 보면 되지 않는가’ 를 닫을 때</tspan><tspan x="931" dy="17.25">쓴 문장이 이것이고, 15장이 무한 모형을 끌어내는 데</tspan><tspan x="931" dy="17.25">쓰는 문장 무리도 이것이다</tspan></text></g><marker id="mk-d2-2879068686-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2879068686-3488378134)" d="M592.5 392v94" class="connection stroke-B1 s0" mask="url(#d2-2879068686)"/><path fill="none" marker-end="url(#mk-d2-2879068686-3488378134)" d="M592.5 528.5v116" class="connection stroke-B1 s0" mask="url(#d2-2879068686)"/><text x="592.5" y="593" style="fill:#676c7e;text-anchor:middle;font-size:16px">F 를 지운다</text><mask id="d2-2879068686" width="1387" height="1018" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1387V917H-101z"/><path d="M545 577h95v21h-95z"/></mask></svg>