<svg xmlns="http://www.w3.org/2000/svg" width="1263" height="1518" class="d2-3811379283 d2-svg" viewBox="-89 -89 1263 1518"><rect width="1263" height="1518" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3811379283 .text-bold{font-weight:700}.d2-3811379283 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3811379283 .fill-N1{fill:#0a0f25}.d2-3811379283 .fill-N2{fill:#676c7e}.d2-3811379283 .fill-B5{fill:#edf0fd}.d2-3811379283 .fill-B6{fill:#f7f8fe}.d2-3811379283 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M189 12h884v198H189z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="631" y="45" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">도출의 줄 하나</text></g><g ><g class="shape"><path d="M483 280h296v82H483z" class="stroke-B1 fill-B6 s0"/></g><text x="631" y="318.5" class="text-bold fill-N1 s1"><tspan x="631" dy="0">물음 하나 —</tspan><tspan x="631" dy="18.5">근거가 규칙의 모양과 맞는가</tspan></text></g><g ><g class="shape"><path d="M190 660h383v82H190z" class="stroke-B1 fill-B6 s0"/></g><text x="381.5" y="698.5" class="text-bold fill-N1 s1"><tspan x="381.5" dy="0">물음 둘 —</tspan><tspan x="381.5" dy="18.5">인용한 줄이 지금 손닿는 범위에 있는가</tspan></text></g><g ><g class="shape"><path d="M493 492h401v98H493z" class="stroke-B1 fill-B6 s0"/></g><text x="693.5" y="530.5" class="text-bold fill-N1 s1"><tspan x="693.5" dy="0">예: 근거가 ‘3, 7 →E’ 라면</tspan><tspan x="693.5" dy="17.667">7 번 줄이 3 번 줄의 전건과 같은 식인지,</tspan><tspan x="693.5" dy="17.667">이 줄이 3 번 줄의 후건과 같은 식인지 본다</tspan></text></g><g ><g class="shape"><path d="M12 822h323v114H12z" class="stroke-B1 fill-B6 s0"/></g><text x="173.5" y="860.5" class="text-bold fill-N1 s1"><tspan x="173.5" dy="0">인용한 줄이 이미 닫힌 범위 안에</tspan><tspan x="173.5" dy="17.25">있으면 안 된다.</tspan><tspan x="173.5" dy="17.25">닫힌 범위 안의 줄은</tspan><tspan x="173.5" dy="17.25">밖에서 없는 것과 같다</tspan></text></g><g ><g class="shape"><path d="M234 1016h299v82H234z" class="stroke-B1 fill-B6 s0"/></g><text x="383.5" y="1054.5" class="text-bold fill-N1 s1"><tspan x="383.5" dy="0">모든 줄이 두 물음을 통과하면</tspan><tspan x="383.5" dy="18.5">그 도출은 옳은 도출이다</tspan></text></g><g ><g class="shape"><path d="M629 1016h345v98H629z" class="stroke-B1 fill-B6 s0"/></g><text x="801.5" y="1054.5" class="text-bold fill-N1 s1"><tspan x="801.5" dy="0">한 줄이라도 걸리면 도출이 아니다.</tspan><tspan x="801.5" dy="17.667">걸린 줄 하나를 짚어 보이면</tspan><tspan x="801.5" dy="17.667">반박이 끝난다</tspan></text></g><path fill="transparent" stroke="transparent" d="M213 1134h659v194H213z" class="shape s0"/><g ><g class="shape"><path d="M239 70h203v82H239z" class="stroke-B1 fill-B5 s0"/></g><text x="340.5" y="108.5" class="text-bold fill-N1 s1"><tspan x="340.5" dy="0">줄 번호</tspan><tspan x="340.5" dy="18.5">위에서부터 1, 2, 3 …</tspan></text></g><g ><g class="shape"><path d="M462 70h262v82H462z" class="stroke-B1 fill-B5 s0"/></g><text x="593" y="108.5" class="text-bold fill-N1 s1"><tspan x="593" dy="0">논리식 하나</tspan><tspan x="593" dy="18.5">5장의 적형식이어야 한다</tspan></text></g><g ><g class="shape"><path d="M744 62h279v98H744z" class="stroke-B1 fill-B5 s0"/></g><text x="883.5" y="100.5" class="text-bold fill-N1 s1"><tspan x="883.5" dy="0">근거 하나</tspan><tspan x="883.5" dy="17.667">전제 / 가정 /</tspan><tspan x="883.5" dy="17.667">규칙 이름과 인용한 줄 번호</tspan></text></g><text x="519" y="1174" class="fill-N1 s1"><tspan x="519" dy="0">이 절차에 없는 것을 보라 — 진리값, 배당, 진리표.</tspan><tspan x="519" dy="17.667">검사하는 사람은 P 가 무엇을 뜻하는지 몰라도 되고 알 필요도 없다.</tspan><tspan x="519" dy="17.667">5장이 문법을 모양만으로 정한 것과 같은 규율이 여기서도 지켜진다</tspan></text><text x="542.5" y="1251" class="fill-N1 s1"><tspan x="542.5" dy="0">이것이 6장과 갈리는 자리다.</tspan><tspan x="542.5" dy="17.25">진리표를 다 채운 사람은 ‘어긋나는 줄이 없었다’ 만 손에 쥐지만,</tspan><tspan x="542.5" dy="17.25">도출을 적은 사람은 남이 줄 단위로 다시 검사할 수 있는 종이를 손에 쥔다.</tspan><tspan x="542.5" dy="17.25">증명이 설득의 도구가 되는 것은 검사가 이렇게 값싸기 때문이다</tspan></text><marker id="mk-d2-3811379283-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3811379283-3488378134)" d="M631.375 212v64" class="connection stroke-B1 s0" mask="url(#d2-3811379283)"/><path fill="none" marker-end="url(#mk-d2-3811379283-3488378134)" d="M557.375 364v28s0 10-10 10H392s-10 0-10 10v244" class="connection stroke-B1 s0" mask="url(#d2-3811379283)"/><text x="382" y="429" class="text-italic fill-N2 s1">맞으면 다음 물음으로</text><path fill="none" marker-end="url(#mk-d2-3811379283-3488378134)" d="M631.375 364v124" class="connection stroke-B1 s0" mask="url(#d2-3811379283)"/><path fill="none" marker-end="url(#mk-d2-3811379283-3488378134)" d="M286.25 744v74" class="connection stroke-B1 s0" mask="url(#d2-3811379283)"/><path fill="none" marker-end="url(#mk-d2-3811379283-3488378134)" d="M384 744v268" class="connection stroke-B1 s0" mask="url(#d2-3811379283)"/><text x="384" y="885" class="text-italic fill-N2 s1">맞으면</text><path fill="none" marker-end="url(#mk-d2-3811379283-3488378134)" d="M705.375 364v28s0 10 10 10H924s10 0 10 10v600" class="connection stroke-B1 s0" mask="url(#d2-3811379283)"/><text x="934.5" y="580" class="text-italic fill-N2 s1">어긋나면</text><path fill="none" marker-end="url(#mk-d2-3811379283-3488378134)" d="M477.75 744v28s0 10 10 10h247s10 0 10 10v220" class="connection stroke-B1 s0" mask="url(#d2-3811379283)"/><text x="708.5" y="788" class="text-italic fill-N2 s1">어긋나면</text><mask id="d2-3811379283" width="1263" height="1518" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1263v1518H-89z"/><path d="M290 413h184v21H290zM353 869h62v21h-62zM894 564h81v21h-81zM668 772h81v21h-81z"/></mask></svg>