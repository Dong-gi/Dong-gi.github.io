<svg xmlns="http://www.w3.org/2000/svg" width="3178" height="992" class="d2-4263311146 d2-svg" viewBox="-101 -121 3178 992"><rect width="3178" height="992" x="-101" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4263311146 .fill-N1{fill:#0a0f25}.d2-4263311146 .fill-N2{fill:#676c7e}.d2-4263311146 .fill-B5{fill:#edf0fd}.d2-4263311146 .fill-B6{fill:#f7f8fe}.d2-4263311146 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M489 20h1028v142H489z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1003" y="7" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">도출의 줄 하나</text></g><g ><g class="shape"><path d="M714 282h397v66H714z" class="stroke-B1 fill-B6 s0"/></g><text x="912.5" y="320.5" class="text-bold fill-N1 s1">물음 하나 — 근거가 규칙의 모양과 맞는가</text></g><g ><g class="shape"><path d="M434 485h465v66H434z" class="stroke-B1 fill-B6 s0"/></g><text x="666.5" y="523.5" class="text-bold fill-N1 s1">물음 둘 — 인용한 줄이 지금 손닿는 범위에 있는가</text></g><g ><g class="shape"><path d="M961 469h401v98H961z" class="stroke-B1 fill-B6 s0"/></g><text x="1161.5" y="507.5" class="text-bold fill-N1 s1"><tspan x="1161.5" dy="0">예: 근거가 ‘3, 7 →E’ 라면</tspan><tspan x="1161.5" dy="17.667">7 번 줄이 3 번 줄의 전건과 같은 식인지,</tspan><tspan x="1161.5" dy="17.667">이 줄이 3 번 줄의 후건과 같은 식인지 본다</tspan></text></g><g ><g class="shape"><path d="M0 688h459v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="229.5" y="726.5" class="text-bold fill-N1 s1"><tspan x="229.5" dy="0">인용한 줄이 이미 닫힌 범위 안에 있으면 안 된다.</tspan><tspan x="229.5" dy="18.5">닫힌 범위 안의 줄은 밖에서 없는 것과 같다</tspan></text></g><g ><g class="shape"><path d="M519 688h299v82H519z" class="stroke-B1 fill-B6 s0"/></g><text x="668.5" y="726.5" class="text-bold fill-N1 s1"><tspan x="668.5" dy="0">모든 줄이 두 물음을 통과하면</tspan><tspan x="668.5" dy="18.5">그 도출은 옳은 도출이다</tspan></text></g><g ><g class="shape"><path d="M1208 688h407v82h-407z" class="stroke-B1 fill-B6 s0"/></g><text x="1411.5" y="726.5" class="text-bold fill-N1 s1"><tspan x="1411.5" dy="0">한 줄이라도 걸리면 도출이 아니다.</tspan><tspan x="1411.5" dy="18.5">걸린 줄 하나를 짚어 보이면 반박이 끝난다</tspan></text></g><text x="1849" y="81" class="fill-N1 s1"><tspan x="1849" dy="0">이 절차에 없는 것을 보라 — 진리값, 배당, 진리표.</tspan><tspan x="1849" dy="17.667">검사하는 사람은 P 가 무엇을 뜻하는지 몰라도 되고 알 필요도 없다.</tspan><tspan x="1849" dy="17.667">5장이 문법을 모양만으로 정한 것과 같은 규율이 여기서도 지켜진다</tspan></text><text x="2583.5" y="81" class="fill-N1 s1"><tspan x="2583.5" dy="0">이것이 6장과 갈리는 자리다. 진리표를 다 채운 사람은 ‘어긋나는 줄이 없었다’ 만 손에 쥐지만,</tspan><tspan x="2583.5" dy="17.667">도출을 적은 사람은 남이 줄 단위로 다시 검사할 수 있는 종이를 손에 쥔다.</tspan><tspan x="2583.5" dy="17.667">증명이 설득의 도구가 되는 것은 검사가 이렇게 값싸기 때문이다</tspan></text><g ><g class="shape"><path d="M519 50h203v82H519z" class="stroke-B1 fill-B5 s0"/></g><text x="620.5" y="88.5" class="text-bold fill-N1 s1"><tspan x="620.5" dy="0">줄 번호</tspan><tspan x="620.5" dy="18.5">위에서부터 1, 2, 3 …</tspan></text></g><g ><g class="shape"><path d="M782 50h262v82H782z" class="stroke-B1 fill-B5 s0"/></g><text x="913" y="88.5" class="text-bold fill-N1 s1"><tspan x="913" dy="0">논리식 하나</tspan><tspan x="913" dy="18.5">5장의 적형식이어야 한다</tspan></text></g><g ><g class="shape"><path d="M1104 50h383v82h-383z" class="stroke-B1 fill-B5 s0"/></g><text x="1295.5" y="88.5" class="text-bold fill-N1 s1"><tspan x="1295.5" dy="0">근거 하나</tspan><tspan x="1295.5" dy="18.5">전제 / 가정 / 규칙 이름과 인용한 줄 번호</tspan></text></g><marker id="mk-d2-4263311146-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4263311146-3488378134)" d="M912.5 164v114" class="connection stroke-B1 s0" mask="url(#d2-4263311146)"/><path fill="none" marker-end="url(#mk-d2-4263311146-3488378134)" d="M824.131 348.212C698 396.3 666 423.9 666 481.5" class="connection stroke-B1 s0" mask="url(#d2-4263311146)"/><text x="713" y="396" class="text-italic fill-N2 s1">맞으면 다음 물음으로</text><path fill="none" marker-end="url(#mk-d2-4263311146-3488378134)" d="M1002.37 348.209C1129.3 396.3 1161.5 420.7 1161.5 465.5" class="connection stroke-B1 s0" mask="url(#d2-4263311146)"/><path fill="none" marker-end="url(#mk-d2-4263311146-3488378134)" d="M532.56 550.99C290.5 612.1 229.5 639.7 229.5 684.5" class="connection stroke-B1 s0" mask="url(#d2-4263311146)"/><path fill="none" marker-end="url(#mk-d2-4263311146-3488378134)" d="M666.552 552.5c1.548 59.6 1.948 87.2 1.948 132" class="connection stroke-B1 s0" mask="url(#d2-4263311146)"/><text x="668" y="625" class="text-italic fill-N2 s1">맞으면</text><path fill="none" marker-end="url(#mk-d2-4263311146-3488378134)" d="M1100.469 347.851C1372.1 396.3 1440.5 430.4 1440.5 463.25s-3.4 176.45-15.926 221.397" class="connection stroke-B1 s0" mask="url(#d2-4263311146)"/><text x="1398.5" y="415" class="text-italic fill-N2 s1">어긋나면</text><path fill="none" marker-end="url(#mk-d2-4263311146-3488378134)" d="M788.93 551.027C1012.6 612.1 1109.4 639.7 1267.17 687.344" class="connection stroke-B1 s0" mask="url(#d2-4263311146)"/><text x="1029.5" y="622" class="text-italic fill-N2 s1">어긋나면</text><mask id="d2-4263311146" width="3178" height="992" x="-101" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-121h3178v992H-101z"/><path d="M621 380h184v21H621zM637 609h62v21h-62zM1358 399h81v21h-81zM989 606h81v21h-81z"/></mask></svg>