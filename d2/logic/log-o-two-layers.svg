<svg xmlns="http://www.w3.org/2000/svg" width="1329" height="808" class="d2-4189238707 d2-svg" viewBox="-101 -101 1329 808"><rect width="1329" height="808" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4189238707 .fill-N1{fill:#0a0f25}.d2-4189238707 .fill-B5{fill:#edf0fd}.d2-4189238707 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M0 0h1127v432H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="563.5" y="33" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">메타언어의 말이 산술의 식으로 내려온다 — 줄마다 가로로 읽는다</text></g><text x="564" y="569" class="text-bold fill-N1 s0"><tspan x="564" dy="0">왜 힘든가: 산술의 언어에는 수열도, 목록도, ‘i 번째 원소’ 도 없다.</tspan><tspan x="564" dy="17.667">그런 것을 전부 0 과 S 와 + 와 × 만으로 만들어 내야 한다.</tspan><tspan x="564" dy="17.667">괴델의 β 함수가 그 다리를 놓는다 — 이 장은 결과만 쓴다</tspan></text><g ><g class="shape"><path d="M8 46h410v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="213" y="84.5" class="text-bold fill-N1 s0"><tspan x="213" dy="0">① 메타언어</tspan><tspan x="213" dy="18.5">우리가 체계에 대해 하는 말</tspan></text></g><g ><g class="shape"><path d="M426 46h337v82H426z" class="stroke-B1 fill-B5 s1"/></g><text x="594.5" y="84.5" class="text-bold fill-N1 s0"><tspan x="594.5" dy="0">② 산술화</tspan><tspan x="594.5" dy="18.5">번호를 붙인다</tspan></text></g><g ><g class="shape"><path d="M771 46h348v82H771z" class="stroke-B1 fill-B5 s1"/></g><text x="945" y="84.5" class="text-bold fill-N1 s0"><tspan x="945" dy="0">③ 표현 가능성 정리</tspan><tspan x="945" dy="18.5">0, S, +, × 만으로 적은 대상언어의 식</tspan></text></g><g ><g class="shape"><path d="M8 136h410v66H8z" class="stroke-B1 fill-B5 s1"/></g><text x="213" y="174.5" class="text-bold fill-N1 s0">이 기호열은 적형식이다</text></g><g ><g class="shape"><path d="M426 136h337v66H426z" class="stroke-B1 fill-B5 s1"/></g><text x="594.5" y="174.5" class="text-bold fill-N1 s0">기호열 ↦ 수</text></g><g ><g class="shape"><path d="M771 136h348v66H771z" class="stroke-B1 fill-B5 s1"/></g><text x="945" y="174.5" class="text-bold fill-N1 s0">Fml(x)</text></g><g ><g class="shape"><path d="M8 210h410v66H8z" class="stroke-B1 fill-B5 s1"/></g><text x="213" y="248.5" class="text-bold fill-N1 s0">이 목록은 T 에서의 도출이다</text></g><g ><g class="shape"><path d="M426 210h337v66H426z" class="stroke-B1 fill-B5 s1"/></g><text x="594.5" y="248.5" class="text-bold fill-N1 s0">도출(문장 목록) ↦ 수</text></g><g ><g class="shape"><path d="M771 210h348v66H771z" class="stroke-B1 fill-B5 s1"/></g><text x="945" y="248.5" class="text-bold fill-N1 s0">Prf(y, x) — 아래첨자 T 는 줄여 적는다</text></g><g ><g class="shape"><path d="M8 284h410v66H8z" class="stroke-B1 fill-B5 s1"/></g><text x="213" y="322.5" class="text-bold fill-N1 s0">이 식에 이 이름을 대입한 결과는 저 식이다</text></g><g ><g class="shape"><path d="M426 284h337v66H426z" class="stroke-B1 fill-B5 s1"/></g><text x="594.5" y="322.5" class="text-bold fill-N1 s0">대입 ↦ 수에서 수로 가는 계산</text></g><g ><g class="shape"><path d="M771 284h348v66H771z" class="stroke-B1 fill-B5 s1"/></g><text x="945" y="322.5" class="text-bold fill-N1 s0">Sub(x, y, z)</text></g><g ><g class="shape"><path d="M8 358h410v66H8z" class="stroke-B1 fill-B5 s1"/></g><text x="213" y="396.5" class="text-bold fill-N1 s0">φ 는 T 에서 도출된다</text></g><g ><g class="shape"><path d="M426 358h337v66H426z" class="stroke-B1 fill-B5 s1"/></g><text x="594.5" y="396.5" class="text-bold fill-N1 s0">‘도출이 있다’ ↦ ‘그런 수가 있다’</text></g><g ><g class="shape"><path d="M771 358h348v66H771z" class="stroke-B1 fill-B5 s1"/></g><text x="945" y="396.5" class="text-bold fill-N1 s0">Prov(x) = ∃y Prf(y, x)</text></g><marker id="mk-d2-4189238707-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4189238707-3488378134)" d="M563.5 433.5v116" class="connection stroke-B1 s1" mask="url(#d2-4189238707)"/><text x="563.5" y="498" style="fill:#676c7e;text-anchor:middle;font-size:16px">가장 힘든 기술적 부분</text><mask id="d2-4189238707" width="1329" height="808" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1329v808H-101z"/><path d="M470 482h187v21H470z"/></mask></svg>