<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1456" class="d2-128894937 d2-svg" viewBox="-101 -101 1050 1456"><rect width="1050" height="1456" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-128894937 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-128894937 .fill-N1{fill:#0a0f25}.d2-128894937 .fill-B4{fill:#e3e9fd}.d2-128894937 .fill-B5{fill:#edf0fd}.d2-128894937 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M170 0h508v66H170z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="424" y="38.5" class="text-bold fill-N1 s0">완전성 — Γ ⊨ φ 이면 Γ ⊢ φ. 참인 것은 빠짐없이 증명된다</text></g><g ><g class="shape"><path d="M0 166h848v390H0z" class="stroke-B1 fill-B4 s1"/></g><text x="424" y="199" class="fill-N1 s2">그런데 두 쪽이 쓰는 재료가 이렇게 다르다</text></g><g ><g class="shape"><path d="M56 656h737v324H56z" class="stroke-B1 fill-B4 s1"/></g><text x="424.5" y="689" class="text-bold fill-N1 s2">그러니 의심하는 것이 옳다</text></g><text x="424" y="1096" class="text-bold fill-N1 s0">의심이 풀리는 자리를 미리 적어 둔다</text><text x="424" y="1217" class="fill-N1 s0"><tspan x="424" dy="0">세는 것이 어긋나 보이는 까닭은 ⊨ 가 모형 전부를 세라고 요구하기 때문인데,</tspan><tspan x="424" dy="17.667">완전성 증명은 모형을 세지 않는다. 일관된 집합 하나에서 모형 하나를 지어 낸다.</tspan><tspan x="424" dy="17.667">그 모형은 언제나 가산이다 — 셀 수 없는 것을 따라잡을 일이 애초에 없었다</tspan></text><g ><g class="shape"><path d="M8 212h397v66H8z" class="stroke-B1 fill-B5 s1"/></g><text x="206.5" y="250.5" class="text-bold fill-N1 s0">⊢ 쪽 — 증명 체계</text></g><g ><g class="shape"><path d="M413 212h427v66H413z" class="stroke-B1 fill-B5 s1"/></g><text x="626.5" y="250.5" class="text-bold fill-N1 s0">⊨ 쪽 — 의미론</text></g><g ><g class="shape"><path d="M8 286h397v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="206.5" y="324.5" class="text-bold fill-N1 s0"><tspan x="206.5" dy="0">규칙이 열아홉 개다.</tspan><tspan x="206.5" dy="18.5">7장에서 열셋, 11장에서 넷, 12장에서 =I · =E</tspan></text></g><g ><g class="shape"><path d="M413 286h427v82H413z" class="stroke-B1 fill-B5 s1"/></g><text x="626.5" y="324.5" class="text-bold fill-N1 s0"><tspan x="626.5" dy="0">모형은 무한히 많다.</tspan><tspan x="626.5" dy="18.5">정의역 크기마다 있고 해석은 그보다 더 많다</tspan></text></g><g ><g class="shape"><path d="M8 376h397v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="206.5" y="414.5" class="text-bold fill-N1 s0"><tspan x="206.5" dy="0">도출은 유한한 기호열이다.</tspan><tspan x="206.5" dy="18.5">줄 수도 유한하고 각 줄도 유한하다</tspan></text></g><g ><g class="shape"><path d="M413 376h427v82H413z" class="stroke-B1 fill-B5 s1"/></g><text x="626.5" y="414.5" class="text-bold fill-N1 s0"><tspan x="626.5" dy="0">정의역이 무한한 모형도 있다.</tspan><tspan x="626.5" dy="18.5">모형 하나를 다 적는 일조차 끝나지 않는다</tspan></text></g><g ><g class="shape"><path d="M8 466h397v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="206.5" y="504.5" class="text-bold fill-N1 s0"><tspan x="206.5" dy="0">그래서 도출 전체에 번호를 붙일 수 있다.</tspan><tspan x="206.5" dy="18.5">적형식이 가산인 것과 같은 논법 (5장)</tspan></text></g><g ><g class="shape"><path d="M413 466h427v82H413z" class="stroke-B1 fill-B5 s1"/></g><text x="626.5" y="504.5" class="text-bold fill-N1 s0"><tspan x="626.5" dy="0">모형 전체에는 번호를 붙일 수 없다.</tspan><tspan x="626.5" dy="18.5">한 줄로 세울 수 있는 모임이 아니다</tspan></text></g><g ><g class="shape"><path d="M72 702h705v66H72z" class="stroke-B1 fill-B5 s1"/></g><text x="424.5" y="740.5" class="text-bold fill-N1 s0">셀 수 있는 것으로 셀 수 없는 것을 전부 따라잡는다는 말로 들린다</text></g><g ><g class="shape"><path d="M72 784h705v82H72z" class="stroke-B1 fill-B5 s1"/></g><text x="424.5" y="822.5" class="text-bold fill-N1 s0"><tspan x="424.5" dy="0">규칙 하나하나는 연결자 한 개의 뜻만 본다.</tspan><tspan x="424.5" dy="18.5">그런 조각들을 이어 붙여 모든 모형에 대한 주장에 닿는다는 말로 들린다</tspan></text></g><g ><g class="shape"><path d="M72 882h705v82H72z" class="stroke-B1 fill-B5 s1"/></g><text x="424.5" y="920.5" class="text-bold fill-N1 s0"><tspan x="424.5" dy="0">그리고 ⊢ 은 있음의 주장이라 확인이 값싸고</tspan><tspan x="424.5" dy="18.5">⊨ 는 전부에 대한 주장이라 확인이 비싸다. 값이 다른 둘이 같다는 말로 들린다</tspan></text></g><marker id="mk-d2-128894937-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-128894937-3488378134)" d="M424 68v94" class="connection stroke-B1 s1" mask="url(#d2-128894937)"/><path fill="none" marker-end="url(#mk-d2-128894937-3488378134)" d="M424 558v94" class="connection stroke-B1 s1" mask="url(#d2-128894937)"/><path fill="none" marker-end="url(#mk-d2-128894937-3488378134)" d="M424 982v94" class="connection stroke-B1 s1" mask="url(#d2-128894937)"/><path fill="none" marker-end="url(#mk-d2-128894937-3488378134)" d="M424 1103v94" class="connection stroke-B1 s1" mask="url(#d2-128894937)"/><mask id="d2-128894937" width="1050" height="1456" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H949v1456H-101z"/></mask></svg>