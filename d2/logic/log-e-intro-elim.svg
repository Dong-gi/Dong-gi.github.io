<svg xmlns="http://www.w3.org/2000/svg" width="1323" height="1450" class="d2-1358148494 d2-svg" viewBox="-91 -101 1323 1450"><rect width="1323" height="1450" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1358148494 .fill-N1{fill:#0a0f25}.d2-1358148494 .fill-B4{fill:#e3e9fd}.d2-1358148494 .fill-B5{fill:#edf0fd}.d2-1358148494 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M236 0h895v660H236z" class="stroke-B1 fill-B4 s0"/></g><text x="683.5" y="33" class="fill-N1 s1">규칙표</text></g><g ><g class="shape"><path d="M10 780h883v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="451.5" y="767" class="text-bold fill-N1 s1">표에 들어가지 않는 규칙 둘</text></g><text x="683.5" y="1074" class="fill-N1 s2"><tspan x="683.5" dy="0">도입 규칙은 결론에 그 연결자가 있고, 제거 규칙은 전제에 그 연결자가 있다.</tspan><tspan x="683.5" dy="17.667">그래서 규칙을 고를 때 볼 것은 5장의 주연결자다 — 얻으려는 식의 주연결자를 보면 도입 규칙이,</tspan><tspan x="683.5" dy="17.667">손에 든 식의 주연결자를 보면 제거 규칙이 나온다. 8장의 전략이 이 관찰 위에 선다</tspan></text><text x="683.5" y="1227" class="text-bold fill-N1 s2"><tspan x="683.5" dy="0">IP 를 눈여겨보라. 나머지 열두 규칙은 연결자 하나의 뜻을 풀어 쓴 것이지만 IP 는 그렇지 않다.</tspan><tspan x="683.5" dy="18.5">이 규칙 하나가 고전 논리를 만들고, 이것을 빼면 19장의 직관주의 논리가 된다</tspan></text><g ><g class="shape"><path d="M244 46h104v66H244z" class="stroke-B1 fill-B5 s0"/></g><text x="296" y="84.5" class="text-bold fill-N1 s2">연결자</text></g><g ><g class="shape"><path d="M356 46h340v66H356z" class="stroke-B1 fill-B5 s0"/></g><text x="526" y="84.5" class="text-bold fill-N1 s2">도입 — 이 연결자가 든 식을 얻는 길</text></g><g ><g class="shape"><path d="M704 46h419v66H704z" class="stroke-B1 fill-B5 s0"/></g><text x="913.5" y="84.5" class="text-bold fill-N1 s2">제거 — 이 연결자가 든 식을 쓰는 길</text></g><g ><g class="shape"><path d="M244 120h104v82H244z" class="stroke-B1 fill-B5 s0"/></g><text x="296" y="166.5" class="text-bold fill-N1 s2">∧</text></g><g ><g class="shape"><path d="M356 120h340v82H356z" class="stroke-B1 fill-B5 s0"/></g><text x="526" y="158.5" class="text-bold fill-N1 s2"><tspan x="526" dy="0">∧I</tspan><tspan x="526" dy="18.5">φ 와 ψ 에서 φ ∧ ψ</tspan></text></g><g ><g class="shape"><path d="M704 120h419v82H704z" class="stroke-B1 fill-B5 s0"/></g><text x="913.5" y="158.5" class="text-bold fill-N1 s2"><tspan x="913.5" dy="0">∧E</tspan><tspan x="913.5" dy="18.5">φ ∧ ψ 에서 φ. ψ 도 된다</tspan></text></g><g ><g class="shape"><path d="M244 210h104v82H244z" class="stroke-B1 fill-B5 s0"/></g><text x="296" y="256.5" class="text-bold fill-N1 s2">∨</text></g><g ><g class="shape"><path d="M356 210h340v82H356z" class="stroke-B1 fill-B5 s0"/></g><text x="526" y="248.5" class="text-bold fill-N1 s2"><tspan x="526" dy="0">∨I</tspan><tspan x="526" dy="18.5">φ 에서 φ ∨ ψ. ψ ∨ φ 도 된다</tspan></text></g><g ><g class="shape"><path d="M704 210h419v82H704z" class="stroke-B1 fill-B5 s0"/></g><text x="913.5" y="248.5" class="text-bold fill-N1 s2"><tspan x="913.5" dy="0">∨E — 경우 나누기</tspan><tspan x="913.5" dy="18.5">φ ∨ ψ, 그리고 두 갈래에서 각각 χ 를 얻으면 χ</tspan></text></g><g ><g class="shape"><path d="M244 300h104v82H244z" class="stroke-B1 fill-B5 s0"/></g><text x="296" y="346.5" class="text-bold fill-N1 s2">→</text></g><g ><g class="shape"><path d="M356 300h340v82H356z" class="stroke-B1 fill-B5 s0"/></g><text x="526" y="338.5" class="text-bold fill-N1 s2"><tspan x="526" dy="0">→I — 가정 방출</tspan><tspan x="526" dy="18.5">φ 를 가정해 ψ 를 얻으면 φ → ψ</tspan></text></g><g ><g class="shape"><path d="M704 300h419v82H704z" class="stroke-B1 fill-B5 s0"/></g><text x="913.5" y="338.5" class="text-bold fill-N1 s2"><tspan x="913.5" dy="0">→E — 전건 긍정</tspan><tspan x="913.5" dy="18.5">φ → ψ 와 φ 에서 ψ</tspan></text></g><g ><g class="shape"><path d="M244 390h104v82H244z" class="stroke-B1 fill-B5 s0"/></g><text x="296" y="436.5" class="text-bold fill-N1 s2">↔</text></g><g ><g class="shape"><path d="M356 390h340v82H356z" class="stroke-B1 fill-B5 s0"/></g><text x="526" y="428.5" class="text-bold fill-N1 s2"><tspan x="526" dy="0">↔I</tspan><tspan x="526" dy="18.5">φ → ψ 와 ψ → φ 에서 φ ↔ ψ</tspan></text></g><g ><g class="shape"><path d="M704 390h419v82H704z" class="stroke-B1 fill-B5 s0"/></g><text x="913.5" y="428.5" class="text-bold fill-N1 s2"><tspan x="913.5" dy="0">↔E</tspan><tspan x="913.5" dy="18.5">φ ↔ ψ 와 φ 에서 ψ. 반대쪽도 된다</tspan></text></g><g ><g class="shape"><path d="M244 480h104v82H244z" class="stroke-B1 fill-B5 s0"/></g><text x="296" y="526.5" class="text-bold fill-N1 s2">¬</text></g><g ><g class="shape"><path d="M356 480h340v82H356z" class="stroke-B1 fill-B5 s0"/></g><text x="526" y="518.5" class="text-bold fill-N1 s2"><tspan x="526" dy="0">¬I — 가정 방출</tspan><tspan x="526" dy="18.5">φ 를 가정해 ⊥ 를 얻으면 ¬φ</tspan></text></g><g ><g class="shape"><path d="M704 480h419v82H704z" class="stroke-B1 fill-B5 s0"/></g><text x="913.5" y="518.5" class="text-bold fill-N1 s2"><tspan x="913.5" dy="0">¬E</tspan><tspan x="913.5" dy="18.5">φ 와 ¬φ 에서 ⊥</tspan></text></g><g ><g class="shape"><path d="M244 570h104v82H244z" class="stroke-B1 fill-B5 s0"/></g><text x="296" y="616.5" class="text-bold fill-N1 s2">⊥</text></g><g ><g class="shape"><path d="M356 570h340v82H356z" class="stroke-B1 fill-B5 s0"/></g><text x="526" y="608.5" class="text-bold fill-N1 s2"><tspan x="526" dy="0">도입 규칙이 없다</tspan><tspan x="526" dy="18.5">⊥ 를 얻는 길은 ¬E 하나뿐이다</tspan></text></g><g ><g class="shape"><path d="M704 570h419v82H704z" class="stroke-B1 fill-B5 s0"/></g><text x="913.5" y="608.5" class="text-bold fill-N1 s2"><tspan x="913.5" dy="0">⊥E — 폭발률</tspan><tspan x="913.5" dy="18.5">⊥ 에서 무엇이든</tspan></text></g><g ><g class="shape"><path d="M40 810h403v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="241.5" y="848.5" class="text-bold fill-N1 s2"><tspan x="241.5" dy="0">R — 반복</tspan><tspan x="241.5" dy="17.667">앞선 줄의 φ 를 그대로 다시 적는다.</tspan><tspan x="241.5" dy="17.667">연결자와 아무 상관이 없어서 자리가 없다</tspan></text></g><g ><g class="shape"><path d="M503 810h360v98H503z" class="stroke-B1 fill-B5 s0"/></g><text x="683" y="848.5" class="text-bold fill-N1 s2"><tspan x="683" dy="0">IP — 간접증명</tspan><tspan x="683" dy="17.667">¬φ 를 가정해 ⊥ 를 얻으면 φ.</tspan><tspan x="683" dy="17.667">어느 연결자의 도입도 제거도 아니다</tspan></text></g><marker id="mk-d2-1358148494-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1358148494-3488378134)" d="M683 662v114" class="connection stroke-B1 s0" mask="url(#d2-1358148494)"/><path fill="none" marker-end="url(#mk-d2-1358148494-3488378134)" d="M683 940v114" class="connection stroke-B1 s0" mask="url(#d2-1358148494)"/><path fill="none" marker-end="url(#mk-d2-1358148494-3488378134)" d="M683 1113v94" class="connection stroke-B1 s0" mask="url(#d2-1358148494)"/><mask id="d2-1358148494" width="1323" height="1450" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1323v1450H-91z"/></mask></svg>