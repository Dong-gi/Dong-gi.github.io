<svg xmlns="http://www.w3.org/2000/svg" width="1323" height="1052" class="d2-3587770653 d2-svg" viewBox="-101 -101 1323 1052"><rect width="1323" height="1052" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3587770653 .fill-N1{fill:#0a0f25}.d2-3587770653 .fill-B4{fill:#e3e9fd}.d2-3587770653 .fill-B5{fill:#edf0fd}.d2-3587770653 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h1121v424H0z" class="stroke-B1 fill-B4 s0"/></g><text x="560.5" y="33" class="text-bold fill-N1 s1">3부가 끝나면 채워지는 격자 — 아홉 칸에 빈 곳이 없다</text></g><text x="561" y="540" class="text-bold fill-N1 s2"><tspan x="561" dy="0">빈 칸이 없다. 그리고 세로줄 셋은 아직 서로 만난 적이 없다 —</tspan><tspan x="561" dy="17.667">⊢ 로 얻은 것이 ⊨ 로도 성립하는지, 그 반대는 어떤지 우리는 한 번도 묻지 않았다.</tspan><tspan x="561" dy="17.667">지금까지 우리는 체계 안에서 일했다. 식을 적고, 모형을 만들고, 도출을 찾았다</tspan></text><g ><g class="shape"><path d="M150 698h822v152H150z" class="stroke-B1 fill-B4 s0"/></g><text x="561" y="731" class="text-bold fill-N1 s1">13장부터는 체계 밖에 서서 체계를 대상으로 삼는다</text></g><g ><g class="shape"><path d="M140 46h293v100H140z" class="stroke-B1 fill-B5 s0"/></g><text x="286.5" y="101.5" class="text-bold fill-N1 s2">문법 — 무엇을 적을 수 있는가</text></g><g ><g class="shape"><path d="M441 46h330v100H441z" class="stroke-B1 fill-B5 s0"/></g><text x="606" y="101.5" class="text-bold fill-N1 s2">의미론 — 그것이 무엇을 말하는가</text></g><g ><g class="shape"><path d="M779 46h334v100H779z" class="stroke-B1 fill-B5 s0"/></g><text x="946" y="101.5" class="text-bold fill-N1 s2">증명 체계 — 어떻게 이어 붙이는가</text></g><g ><g class="shape"><path d="M8 154h124v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="70" y="200.5" class="text-bold fill-N1 s2">명제논리</text></g><g ><g class="shape"><path d="M140 154h293v82H140z" class="stroke-B1 fill-B5 s0"/></g><text x="286.5" y="192.5" class="text-bold fill-N1 s2"><tspan x="286.5" dy="0">5장 — 적형식 세 조항</tspan><tspan x="286.5" dy="18.5">주연결자, 파스 트리</tspan></text></g><g ><g class="shape"><path d="M441 154h330v82H441z" class="stroke-B1 fill-B5 s0"/></g><text x="606" y="192.5" class="text-bold fill-N1 s2"><tspan x="606" dy="0">6장 — 배당 v, 진리표</tspan><tspan x="606" dy="18.5">v ⊨ φ, Γ ⊨ φ</tspan></text></g><g ><g class="shape"><path d="M779 154h334v82H779z" class="stroke-B1 fill-B5 s0"/></g><text x="946" y="192.5" class="text-bold fill-N1 s2"><tspan x="946" dy="0">7장 · 8장 — 규칙 열셋</tspan><tspan x="946" dy="18.5">Γ ⊢ φ, 가정과 방출</tspan></text></g><g ><g class="shape"><path d="M8 244h124v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="70" y="290.5" class="text-bold fill-N1 s2">술어논리</text></g><g ><g class="shape"><path d="M140 244h293v82H140z" class="stroke-B1 fill-B5 s0"/></g><text x="286.5" y="282.5" class="text-bold fill-N1 s2"><tspan x="286.5" dy="0">9장 — 항 · 원자식 · 한정사</tspan><tspan x="286.5" dy="18.5">자유와 속박, 대입 φ[a/x]</tspan></text></g><g ><g class="shape"><path d="M441 244h330v82H441z" class="stroke-B1 fill-B5 s0"/></g><text x="606" y="282.5" class="text-bold fill-N1 s2"><tspan x="606" dy="0">10장 — 모형 ℳ = ⟨D, I⟩</tspan><tspan x="606" dy="18.5">배정 g, 만족 조항 아홉</tspan></text></g><g ><g class="shape"><path d="M779 244h334v82H779z" class="stroke-B1 fill-B5 s0"/></g><text x="946" y="282.5" class="text-bold fill-N1 s2"><tspan x="946" dy="0">11장 — 한정사 규칙 넷</tspan><tspan x="946" dy="18.5">∀I ∀E ∃I ∃E 와 변수 조건</tspan></text></g><g ><g class="shape"><path d="M8 334h124v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="70" y="380.5" class="text-bold fill-N1 s2">동일성</text></g><g ><g class="shape"><path d="M140 334h293v82H140z" class="stroke-B1 fill-B5 s0"/></g><text x="286.5" y="372.5" class="text-bold fill-N1 s2"><tspan x="286.5" dy="0">12장 — 원자식 조항 하나</tspan><tspan x="286.5" dy="18.5">t₁ = t₂</tspan></text></g><g ><g class="shape"><path d="M441 334h330v82H441z" class="stroke-B1 fill-B5 s0"/></g><text x="606" y="372.5" class="text-bold fill-N1 s2"><tspan x="606" dy="0">12장 — 만족 조항 하나</tspan><tspan x="606" dy="18.5">해석이 고정된다</tspan></text></g><g ><g class="shape"><path d="M779 334h334v82H779z" class="stroke-B1 fill-B5 s0"/></g><text x="946" y="372.5" class="text-bold fill-N1 s2"><tspan x="946" dy="0">12장 — 규칙 둘</tspan><tspan x="946" dy="18.5">=I 와 =E</tspan></text></g><g ><g class="shape"><path d="M158 744h212v98H158z" class="stroke-B1 fill-B5 s0"/></g><text x="264" y="782.5" class="text-bold fill-N1 s2"><tspan x="264" dy="0">13장 건전성</tspan><tspan x="264" dy="17.667">Γ ⊢ φ 이면 Γ ⊨ φ</tspan><tspan x="264" dy="17.667">증명한 것은 참이다</tspan></text></g><g ><g class="shape"><path d="M378 744h212v98H378z" class="stroke-B1 fill-B5 s0"/></g><text x="484" y="782.5" class="text-bold fill-N1 s2"><tspan x="484" dy="0">14장 완전성</tspan><tspan x="484" dy="17.667">Γ ⊨ φ 이면 Γ ⊢ φ</tspan><tspan x="484" dy="17.667">참인 것은 증명된다</tspan></text></g><g ><g class="shape"><path d="M598 744h366v98H598z" class="stroke-B1 fill-B5 s0"/></g><text x="781" y="782.5" class="text-bold fill-N1 s2"><tspan x="781" dy="0">15 · 16 · 17장 — 두 다리가 놓이고 나서</tspan><tspan x="781" dy="17.667">무엇을 잃었는지 센다.</tspan><tspan x="781" dy="17.667">비표준 모형, 결정불가능성, 불완전성</tspan></text></g><marker id="mk-d2-3587770653-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3587770653-3488378134)" d="M560.5 426v94" class="connection stroke-B1 s0" mask="url(#d2-3587770653)"/><path fill="none" marker-end="url(#mk-d2-3587770653-3488378134)" d="M560.5 578.5v116" class="connection stroke-B1 s0" mask="url(#d2-3587770653)"/><text x="561" y="643" style="fill:#676c7e;text-anchor:middle;font-size:16px">층이 바뀐다</text><mask id="d2-3587770653" width="1323" height="1052" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1323V951H-101z"/><path d="M509 627h104v21H509z"/></mask></svg>