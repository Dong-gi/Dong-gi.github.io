<svg xmlns="http://www.w3.org/2000/svg" width="1001" height="1651" class="d2-1036175118 d2-svg" viewBox="-101 -101 1001 1651"><rect width="1001" height="1651" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1036175118 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1036175118 .fill-N1{fill:#0a0f25}.d2-1036175118 .fill-B6{fill:#f7f8fe}.d2-1036175118 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="396.5" cy="65" class="shape stroke-B1 fill-B6 s0" rx="194.5" ry="65"/></g><text x="396.5" y="70.5" class="text-bold fill-N1 s1">ℳ 에서 ∀x (Fx → Gx) 가 참인가</text></g><g ><g class="shape"><path d="M248 230h296v114H248z" class="stroke-B1 fill-B6 s0"/></g><text x="396" y="268.5" class="text-bold fill-N1 s1"><tspan x="396" dy="0">만족은 재귀로 정의해야 한다</tspan><tspan x="396" dy="17.25">(9장 문법 조항마다 절 하나).</tspan><tspan x="396" dy="17.25">∀x φ 의 값을 정하려면</tspan><tspan x="396" dy="17.25">먼저 φ 의 값을 알아야 한다</tspan></text></g><g ><g class="shape"><path d="M215 444h363v146H215z" class="stroke-B1 fill-B6 s0"/></g><text x="396.5" y="482.5" class="text-bold fill-N1 s1"><tspan x="396.5" dy="0">여기서 막힌다</tspan><tspan x="396.5" dy="16.833">φ = Fx → Gx 는 자유 변수 x 를 가진다.</tspan><tspan x="396.5" dy="16.833">ℳ 는 상수 a, b, c 에만 원소를 배정한다.</tspan><tspan x="396.5" dy="16.833">x 에는 아무것도 배정하지 않는다.</tspan><tspan x="396.5" dy="16.833">→ ‘Fx 가 참인가’ 라는 물음 자체가</tspan><tspan x="396.5" dy="16.833">성립하지 않는다</tspan></text></g><g ><g class="shape"><path d="M28 698h307v98H28z" class="stroke-B1 fill-B6 s0"/></g><text x="181.5" y="736.5" class="text-bold fill-N1 s1"><tspan x="181.5" dy="0">시도 1 —</tspan><tspan x="181.5" dy="17.667">자유 변수가 없는 식(문장)에만</tspan><tspan x="181.5" dy="17.667">참을 정의한다</tspan></text></g><g ><g class="shape"><path d="M0 912h363v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="181.5" y="950.5" class="text-bold fill-N1 s1"><tspan x="181.5" dy="0">실패. ∀x (Fx → Gx) 는 문장이지만</tspan><tspan x="181.5" dy="17.25">그 값을 계산하는 길이</tspan><tspan x="181.5" dy="17.25">열린 식 Fx → Gx 를 반드시 지난다.</tspan><tspan x="181.5" dy="17.25">재귀는 문장 안에 머물러 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M441 690h341v114H441z" class="stroke-B1 fill-B6 s0"/></g><text x="611.5" y="728.5" class="text-bold fill-N1 s1"><tspan x="611.5" dy="0">시도 2 — x 를 이름으로 갈아 끼운다.</tspan><tspan x="611.5" dy="17.25">∀x φ 가 참이라는 것을</tspan><tspan x="611.5" dy="17.25">모든 상수 a 에 대해</tspan><tspan x="611.5" dy="17.25">φ[a/x] 가 참이라는 것으로 읽는다</tspan></text></g><g ><g class="shape"><path d="M423 904h376v130H423z" class="stroke-B1 fill-B6 s0"/></g><text x="611" y="942.5" class="text-bold fill-N1 s1"><tspan x="611" dy="0">실패. D 에는 이름이 없는</tspan><tspan x="611" dy="17">원소가 있을 수 있다.</tspan><tspan x="611" dy="17">D 가 모든 실수이고 상수가 열 개뿐이면</tspan><tspan x="611" dy="17">이름 붙은 열 개만 확인하고 끝난다 —</tspan><tspan x="611" dy="17">∀ 를 훑은 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M168 1134h456v146H168z" class="stroke-B1 fill-B6 s0"/></g><text x="396" y="1172.5" class="text-bold fill-N1 s1"><tspan x="396" dy="0">해결 — 변수 배정 g 를 모형 밖에 하나 더 둔다</tspan><tspan x="396" dy="16.833">g 는 변수마다 D 의 원소를 하나씩 준다.</tspan><tspan x="396" dy="16.833">만족은 ℳ 혼자가 아니라</tspan><tspan x="396" dy="16.833">ℳ 와 g 의 짝에 대해 정의한다: ℳ, g ⊨ φ</tspan><tspan x="396" dy="16.833">∀ 조항은 이름이 아니라 D 의 원소 d 를 직접 훑고,</tspan><tspan x="396" dy="16.833">그때마다 g 의 x 자리만 d 로 갈아 끼운다</tspan></text></g><text x="396" y="1396" class="fill-N1 s1"><tspan x="396" dy="0">잃은 것은 없다. 자유 변수가 없는 식에서는</tspan><tspan x="396" dy="17.25">g 를 무엇으로 잡든 값이 같으므로</tspan><tspan x="396" dy="17.25">문장에 대해서는 g 를 지우고 ℳ ⊨ φ 라고 쓸 수 있다.</tspan><tspan x="396" dy="17.25">배정은 계산하는 동안만 쓰이고 결과에는 남지 않는다</tspan></text><marker id="mk-d2-1036175118-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1036175118-3488378134)" d="M396.01 132c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-1036175118)"/><path fill="none" marker-end="url(#mk-d2-1036175118-3488378134)" d="M396.25 346v94" class="connection stroke-B1 s0" mask="url(#d2-1036175118)"/><path fill="none" marker-end="url(#mk-d2-1036175118-3488378134)" d="M266.766 590.997C198.899 630 181.5 651.6 181.5 694" class="connection stroke-B1 s0" mask="url(#d2-1036175118)"/><path fill="none" marker-end="url(#mk-d2-1036175118-3488378134)" d="M525.734 590.997C593.6 630 611 650 611 686" class="connection stroke-B1 s0" mask="url(#d2-1036175118)"/><path fill="none" marker-end="url(#mk-d2-1036175118-3488378134)" d="M181.5 798v110" class="connection stroke-B1 s0" mask="url(#d2-1036175118)"/><path fill="none" marker-end="url(#mk-d2-1036175118-3488378134)" d="M611 806v94" class="connection stroke-B1 s0" mask="url(#d2-1036175118)"/><path fill="none" marker-end="url(#mk-d2-1036175118-3488378134)" d="M181.5 1028c0 44.4 17.4 66 83.532 104.007" class="connection stroke-B1 s0" mask="url(#d2-1036175118)"/><path fill="none" marker-end="url(#mk-d2-1036175118-3488378134)" d="M611 1036c0 38-17.4 58-83.532 96.007" class="connection stroke-B1 s0" mask="url(#d2-1036175118)"/><path fill="none" marker-end="url(#mk-d2-1036175118-3488378134)" d="M396.25 1282v94" class="connection stroke-B1 s0" mask="url(#d2-1036175118)"/><mask id="d2-1036175118" width="1001" height="1651" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H900v1651H-101z"/></mask></svg>