<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1475" class="d2-1634649197 d2-svg" viewBox="-101 -101 1448 1475"><rect width="1448" height="1475" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1634649197 .fill-N1{fill:#0a0f25}.d2-1634649197 .fill-B6{fill:#f7f8fe}.d2-1634649197 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="582.5" cy="65" class="shape stroke-B1 fill-B6 s0" rx="194.5" ry="65"/></g><text x="582.5" y="70.5" class="text-bold fill-N1 s1">ℳ 에서 ∀x (Fx → Gx) 가 참인가</text></g><g ><g class="shape"><path d="M313 230h539v82H313z" class="stroke-B1 fill-B6 s0"/></g><text x="582.5" y="268.5" class="text-bold fill-N1 s1"><tspan x="582.5" dy="0">만족은 재귀로 정의해야 한다 (9장 문법 조항마다 절 하나).</tspan><tspan x="582.5" dy="18.5">∀x φ 의 값을 정하려면 먼저 φ 의 값을 알아야 한다</tspan></text></g><g ><g class="shape"><path d="M255 412h655v114H255z" class="stroke-B1 fill-B6 s0"/></g><text x="582.5" y="450.5" class="text-bold fill-N1 s1"><tspan x="582.5" dy="0">여기서 막힌다</tspan><tspan x="582.5" dy="17.25">φ = Fx → Gx 는 자유 변수 x 를 가진다.</tspan><tspan x="582.5" dy="17.25">ℳ 는 상수 a, b, c 에만 원소를 배정한다. x 에는 아무것도 배정하지 않는다.</tspan><tspan x="582.5" dy="17.25">→ ‘Fx 가 참인가’ 라는 물음 자체가 성립하지 않는다</tspan></text></g><g ><g class="shape"><path d="M5 634h504v66H5z" class="stroke-B1 fill-B6 s0"/></g><text x="257" y="672.5" class="text-bold fill-N1 s1">시도 1 — 자유 변수가 없는 식(문장)에만 참을 정의한다</text></g><g ><g class="shape"><path d="M0 808h514v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="257" y="846.5" class="text-bold fill-N1 s1"><tspan x="257" dy="0">실패. ∀x (Fx → Gx) 는 문장이지만</tspan><tspan x="257" dy="17.667">그 값을 계산하는 길이 열린 식 Fx → Gx 를 반드시 지난다.</tspan><tspan x="257" dy="17.667">재귀는 문장 안에 머물러 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M569 626h677v82H569z" class="stroke-B1 fill-B6 s0"/></g><text x="907.5" y="664.5" class="text-bold fill-N1 s1"><tspan x="907.5" dy="0">시도 2 — x 를 이름으로 갈아 끼운다.</tspan><tspan x="907.5" dy="18.5">∀x φ 가 참이라는 것을 모든 상수 a 에 대해 φ[a/x] 가 참이라는 것으로 읽는다</tspan></text></g><g ><g class="shape"><path d="M635 808h546v98H635z" class="stroke-B1 fill-B6 s0"/></g><text x="908" y="846.5" class="text-bold fill-N1 s1"><tspan x="908" dy="0">실패. D 에는 이름이 없는 원소가 있을 수 있다.</tspan><tspan x="908" dy="17.667">D 가 모든 실수이고 상수가 열 개뿐이면</tspan><tspan x="908" dy="17.667">이름 붙은 열 개만 확인하고 끝난다 — ∀ 를 훑은 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M186 1006h793v114H186z" class="stroke-B1 fill-B6 s0"/></g><text x="582.5" y="1044.5" class="text-bold fill-N1 s1"><tspan x="582.5" dy="0">해결 — 변수 배정 g 를 모형 밖에 하나 더 둔다</tspan><tspan x="582.5" dy="17.25">g 는 변수마다 D 의 원소를 하나씩 준다.</tspan><tspan x="582.5" dy="17.25">만족은 ℳ 혼자가 아니라 ℳ 와 g 의 짝에 대해 정의한다: ℳ, g ⊨ φ</tspan><tspan x="582.5" dy="17.25">∀ 조항은 이름이 아니라 D 의 원소 d 를 직접 훑고, 그때마다 g 의 x 자리만 d 로 갈아 끼운다</tspan></text></g><text x="582.5" y="1236" class="fill-N1 s1"><tspan x="582.5" dy="0">잃은 것은 없다. 자유 변수가 없는 식에서는 g 를 무엇으로 잡든 값이 같으므로</tspan><tspan x="582.5" dy="17.667">문장에 대해서는 g 를 지우고 ℳ ⊨ φ 라고 쓸 수 있다.</tspan><tspan x="582.5" dy="17.667">배정은 계산하는 동안만 쓰이고 결과에는 남지 않는다</tspan></text><marker id="mk-d2-1634649197-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1634649197-3488378134)" d="M582.01 132c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-1634649197)"/><path fill="none" marker-end="url(#mk-d2-1634649197-3488378134)" d="M582.25 314v94" class="connection stroke-B1 s0" mask="url(#d2-1634649197)"/><path fill="none" marker-end="url(#mk-d2-1634649197-3488378134)" d="M407.1 526.625C287.4 566 257 587.6 257 630" class="connection stroke-B1 s0" mask="url(#d2-1634649197)"/><path fill="none" marker-end="url(#mk-d2-1634649197-3488378134)" d="M757.4 526.625C877.1 566 907.5 586 907.5 622" class="connection stroke-B1 s0" mask="url(#d2-1634649197)"/><path fill="none" marker-end="url(#mk-d2-1634649197-3488378134)" d="M257 702v102" class="connection stroke-B1 s0" mask="url(#d2-1634649197)"/><path fill="none" marker-end="url(#mk-d2-1634649197-3488378134)" d="M907.5 710v94" class="connection stroke-B1 s0" mask="url(#d2-1634649197)"/><path fill="none" marker-end="url(#mk-d2-1634649197-3488378134)" d="M257 908c0 38 30.4 58 148.2 96.75" class="connection stroke-B1 s0" mask="url(#d2-1634649197)"/><path fill="none" marker-end="url(#mk-d2-1634649197-3488378134)" d="M907.5 908c0 38-30.4 58-148.2 96.75" class="connection stroke-B1 s0" mask="url(#d2-1634649197)"/><path fill="none" marker-end="url(#mk-d2-1634649197-3488378134)" d="M582.25 1122v94" class="connection stroke-B1 s0" mask="url(#d2-1634649197)"/><mask id="d2-1634649197" width="1448" height="1475" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1448v1475H-101z"/></mask></svg>