<svg xmlns="http://www.w3.org/2000/svg" width="2036" height="1363" class="d2-51028879 d2-svg" viewBox="-101 -101 2036 1363"><rect width="2036" height="1363" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-51028879 .fill-N1{fill:#0a0f25}.d2-51028879 .fill-N2{fill:#676c7e}.d2-51028879 .fill-B6{fill:#f7f8fe}.d2-51028879 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="415" cy="29.5" class="shape stroke-B1 fill-B6 s0" rx="89" ry="29.5"/></g><text x="415" y="35" class="text-bold fill-N1 s1">Γ ⊨ φ 인가</text></g><g ><g class="shape"><path d="M178 159h474v82H178z" class="stroke-B1 fill-B6 s0"/></g><text x="415" y="197.5" class="text-bold fill-N1 s1"><tspan x="415" dy="0">귀결이 아니라고 해 보자.</tspan><tspan x="415" dy="18.5">그러면 전제가 전부 T 이고 결론이 F 인 배당이 있다</tspan></text></g><g ><g class="shape"><path d="M297 341h237v66H297z" class="stroke-B1 fill-B6 s0"/></g><text x="415.5" y="379.5" class="text-bold fill-N1 s1">1. 결론 φ 를 F 로 놓는다</text></g><g ><g class="shape"><path d="M273 507h285v66H273z" class="stroke-B1 fill-B6 s0"/></g><text x="415.5" y="545.5" class="text-bold fill-N1 s1">2. 전제를 하나씩 T 로 놓는다</text></g><g ><g class="shape"><path d="M237 673h356v82H237z" class="stroke-B1 fill-B6 s0"/></g><text x="415" y="711.5" class="text-bold fill-N1 s1"><tspan x="415" dy="0">3. 값이 강제되는 자리부터 채운다</tspan><tspan x="415" dy="18.5">예: ψ → χ 가 T 이고 χ 가 F 이면 ψ 는 F 다</tspan></text></g><g ><g class="shape"><path d="M260 876h310v82H260z" class="stroke-B1 fill-B6 s0"/></g><text x="415" y="914.5" class="text-bold fill-N1 s1"><tspan x="415" dy="0">4. 강제되지 않으면 갈림길에서</tspan><tspan x="415" dy="18.5">한 쪽을 골라 두고 계속한다</tspan></text></g><g ><g class="shape"><path d="M0 1079h341v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="170.5" y="1117.5" class="text-bold fill-N1 s1"><tspan x="170.5" dy="0">모순 없이 다 채워졌다</tspan><tspan x="170.5" dy="18.5">→ 그 배당이 반례다. Γ ⊨ φ 가 아니다</tspan></text></g><g ><g class="shape"><path d="M401 1079h518v82H401z" class="stroke-B1 fill-B6 s0"/></g><text x="660" y="1117.5" class="text-bold fill-N1 s1"><tspan x="660" dy="0">어느 길로 가도 같은 문장문자에 T 와 F 가 함께 요구된다</tspan><tspan x="660" dy="18.5">→ 반례가 없다. Γ ⊨ φ 다</tspan></text></g><text x="843" y="19" class="fill-N1 s1"><tspan x="843" dy="0">두 끝의 값이 다르다.</tspan><tspan x="843" dy="17.667">왼쪽은 배당 하나를 보이면 끝난다 — 남에게 건네 확인시킬 수 있다.</tspan><tspan x="843" dy="17.667">오른쪽은 열려 있던 길이 전부 막혔다는 것을 스스로 확인해야 한다</tspan></text><text x="1508" y="19" class="fill-N1 s1"><tspan x="1508" dy="0">오른쪽 끝이 7장이 필요한 이유다.</tspan><tspan x="1508" dy="17.667">진리표와 이 절차는 ‘그렇다’ 를 알려 주지만 ‘왜 그런가’ 를 말해 주지 않는다.</tspan><tspan x="1508" dy="17.667">증명은 그 이유를 남이 읽을 수 있는 형태로 적은 것이다</tspan></text><marker id="mk-d2-51028879-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-51028879-3488378134)" d="M415.01 61c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-51028879)"/><path fill="none" marker-end="url(#mk-d2-51028879-3488378134)" d="M415.25 243v94" class="connection stroke-B1 s0" mask="url(#d2-51028879)"/><path fill="none" marker-end="url(#mk-d2-51028879-3488378134)" d="M415.25 409v94" class="connection stroke-B1 s0" mask="url(#d2-51028879)"/><path fill="none" marker-end="url(#mk-d2-51028879-3488378134)" d="M415.25 575v94" class="connection stroke-B1 s0" mask="url(#d2-51028879)"/><path fill="none" marker-end="url(#mk-d2-51028879-3488378134)" d="M382.013 756.072C344.85 803.3 344.85 827.7 380.776 873.357" class="connection stroke-B1 s0" mask="url(#d2-51028879)"/><path fill="none" marker-end="url(#mk-d2-51028879-3488378134)" d="M448.487 874.928c37.163-47.228 37.163-71.628 1.237-117.285" class="connection stroke-B1 s0" mask="url(#d2-51028879)"/><text x="486" y="821" class="text-italic fill-N2 s1">값이 새로 강제되면 되돌아온다</text><path fill="none" marker-end="url(#mk-d2-51028879-3488378134)" d="M314.655 958.271C199.7 1006.3 170.5 1030.7 170.5 1075.5" class="connection stroke-B1 s0" mask="url(#d2-51028879)"/><text x="218" y="1004" class="text-italic fill-N2 s1">한 길이 열린다</text><path fill="none" marker-end="url(#mk-d2-51028879-3488378134)" d="M515.845 958.271C630.8 1006.3 660 1030.7 660 1075.5" class="connection stroke-B1 s0" mask="url(#d2-51028879)"/><text x="612.5" y="1004" class="text-italic fill-N2 s1">모든 길이 막힌다</text><mask id="d2-51028879" width="2036" height="1363" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2036v1363H-101z"/><path d="M354 805h264v21H354zM155 988h126v21H155zM540 988h145v21H540z"/></mask></svg>