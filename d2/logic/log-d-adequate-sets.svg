<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="1294" class="d2-2012991758 d2-svg" viewBox="-98 -101 1168 1294"><rect width="1168" height="1294" x="-98" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2012991758 .fill-N1{fill:#0a0f25}.d2-2012991758 .fill-N2{fill:#676c7e}.d2-2012991758 .fill-B6{fill:#f7f8fe}.d2-2012991758 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M319 0h123v66H319z" class="stroke-B1 fill-B6 s0"/></g><text x="380.5" y="38.5" class="text-bold fill-N1 s1">¬ ∧ ∨ → ↔</text></g><g ><g class="shape"><path d="M328 203h105v66H328z" class="stroke-B1 fill-B6 s0"/></g><text x="380.5" y="241.5" class="text-bold fill-N1 s1">¬ ∧ ∨ →</text></g><g ><g class="shape"><path d="M336 406h88v66h-88z" class="stroke-B1 fill-B6 s0"/></g><text x="380" y="444.5" class="text-bold fill-N1 s1">¬ ∧ ∨</text></g><g ><g class="shape"><path d="M345 609h70v66h-70z" class="stroke-B1 fill-B6 s0"/></g><text x="380" y="647.5" class="text-bold fill-N1 s1">¬ ∧</text></g><g ><g class="shape"><path d="M3 804h156v82H3z" class="stroke-B1 fill-B6 s0"/></g><text x="81" y="842.5" class="text-bold fill-N1 s1"><tspan x="81" dy="0">{ ¬, ∨ } 도 된다</tspan><tspan x="81" dy="18.5">{ ¬, → } 도 된다</tspan></text></g><g ><g class="shape"><path d="M219 804h323v82H219z" class="stroke-B1 fill-B6 s0"/></g><text x="380.5" y="842.5" class="text-bold fill-N1 s1"><tspan x="380.5" dy="0">NAND 하나로도 된다</tspan><tspan x="380.5" dy="18.5">¬φ 는 φ ↑ φ, φ ∧ ψ 는 (φ ↑ ψ) ↑ (φ ↑ ψ)</tspan></text></g><g ><g class="shape"><path d="M602 796h367v98H602z" class="stroke-B1 fill-B6 s0"/></g><text x="785.5" y="834.5" class="text-bold fill-N1 s1"><tspan x="785.5" dy="0">{ ∧, ∨ } 로는 안 된다</tspan><tspan x="785.5" dy="17.667">모두 T 를 넣으면 반드시 T 가 나오므로</tspan><tspan x="785.5" dy="17.667">¬ 를 만들 수 없다</tspan></text></g><path fill="transparent" stroke="transparent" d="M79 914h814v178H79z" class="shape s0"/><text x="486" y="954" class="fill-N1 s1"><tspan x="486" dy="0">왜 이런 줄이기가 가능한가 — 진리표에서 거꾸로 읽으면 된다.</tspan><tspan x="486" dy="17.667">어떤 진리함수든 참인 줄마다 항을 하나 만들어 ∨ 로 묶으면 그 함수를 나타내는 식이 나오고,</tspan><tspan x="486" dy="17.667">그 식에는 ¬ 와 ∧ 와 ∨ 만 들어 있다. 남은 ∨ 를 드모르간으로 지우면 { ¬, ∧ } 만 남는다</tspan></text><text x="430" y="1031" class="fill-N1 s1"><tspan x="430" dy="0">쓸모 — 연결자가 둘뿐이면 논리식에 대한 증명에서 따져야 할 경우도 둘뿐이다.</tspan><tspan x="430" dy="17.667">다만 이 문서의 13·14장은 그 이득을 쓰지 않고 연결자 다섯을 다 확인한다.</tspan><tspan x="430" dy="17.667">제대로 된 증명은 13장에 있고, 적정 집합의 분류는 이 문서에서 다루지 않는다</tspan></text><marker id="mk-d2-2012991758-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2012991758-3488378134)" d="M380 67.5v132" class="connection stroke-B1 s0" mask="url(#d2-2012991758)"/><text x="380" y="132" class="text-italic fill-N2 s1"><tspan x="380" dy="0">φ ↔ ψ 를</tspan><tspan x="380" dy="18.5">(φ → ψ) ∧ (ψ → φ) 로</tspan></text><path fill="none" marker-end="url(#mk-d2-2012991758-3488378134)" d="M380 270.5v132" class="connection stroke-B1 s0" mask="url(#d2-2012991758)"/><text x="380.5" y="335" class="text-italic fill-N2 s1"><tspan x="380.5" dy="0">φ → ψ 를</tspan><tspan x="380.5" dy="18.5">¬φ ∨ ψ 로</tspan></text><path fill="none" marker-end="url(#mk-d2-2012991758-3488378134)" d="M380 473.5v132" class="connection stroke-B1 s0" mask="url(#d2-2012991758)"/><text x="380.5" y="538" class="text-italic fill-N2 s1"><tspan x="380.5" dy="0">φ ∨ ψ 를</tspan><tspan x="380.5" dy="18.5">¬(¬φ ∧ ¬ψ) 로 — 드모르간</tspan></text><path fill="none" marker-end="url(#mk-d2-2012991758-3488378134)" d="M343.591 653.098C133.5 718.9 80.5 749.3 80.5 800.5" class="connection stroke-B1 s0" mask="url(#d2-2012991758)"/><text x="184.5" y="709" class="text-italic fill-N2 s1">고르는 방법은 여럿</text><path fill="none" marker-end="url(#mk-d2-2012991758-3488378134)" d="M380 676.5v124" class="connection stroke-B1 s0" mask="url(#d2-2012991758)"/><text x="380.5" y="745" class="text-italic fill-N2 s1">끝까지 줄이면</text><path fill="none" marker-end="url(#mk-d2-2012991758-3488378134)" d="M416.95 650.948C711 718.5 785 747.7 785 792.5" class="connection stroke-B1 s0" mask="url(#d2-2012991758)"/><text x="626" y="704" class="text-italic fill-N2 s1">부정을 빼면 무너진다</text><mask id="d2-2012991758" width="1168" height="1294" x="-98" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-98-101h1168v1294H-98z"/><path d="M313 116h134v37H313zM345 319h71v37h-71zM286 522h189v37H286zM102 693h165v21H102zM319 729h123v21H319zM534 688h184v21H534z"/></mask></svg>