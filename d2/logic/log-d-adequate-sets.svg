<svg xmlns="http://www.w3.org/2000/svg" width="2031" height="1080" class="d2-1761769810 d2-svg" viewBox="-98 -101 2031 1080"><rect width="2031" height="1080" x="-98" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1761769810 .fill-N1{fill:#0a0f25}.d2-1761769810 .fill-N2{fill:#676c7e}.d2-1761769810 .fill-B6{fill:#f7f8fe}.d2-1761769810 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M169 0h123v66H169z" class="stroke-B1 fill-B6 s0"/></g><text x="230.5" y="38.5" class="text-bold fill-N1 s1">¬ ∧ ∨ → ↔</text></g><g ><g class="shape"><path d="M178 203h105v66H178z" class="stroke-B1 fill-B6 s0"/></g><text x="230.5" y="241.5" class="text-bold fill-N1 s1">¬ ∧ ∨ →</text></g><g ><g class="shape"><path d="M186 406h88v66h-88z" class="stroke-B1 fill-B6 s0"/></g><text x="230" y="444.5" class="text-bold fill-N1 s1">¬ ∧ ∨</text></g><g ><g class="shape"><path d="M195 609h70v66h-70z" class="stroke-B1 fill-B6 s0"/></g><text x="230" y="647.5" class="text-bold fill-N1 s1">¬ ∧</text></g><g ><g class="shape"><path d="M3 796h156v82H3z" class="stroke-B1 fill-B6 s0"/></g><text x="81" y="834.5" class="text-bold fill-N1 s1"><tspan x="81" dy="0">{ ¬, ∨ } 도 된다</tspan><tspan x="81" dy="18.5">{ ¬, → } 도 된다</tspan></text></g><g ><g class="shape"><path d="M219 796h323v82H219z" class="stroke-B1 fill-B6 s0"/></g><text x="380.5" y="834.5" class="text-bold fill-N1 s1"><tspan x="380.5" dy="0">NAND 하나로도 된다</tspan><tspan x="380.5" dy="18.5">¬φ 는 φ ↑ φ, φ ∧ ψ 는 (φ ↑ ψ) ↑ (φ ↑ ψ)</tspan></text></g><g ><g class="shape"><path d="M602 796h513v82H602z" class="stroke-B1 fill-B6 s0"/></g><text x="858.5" y="834.5" class="text-bold fill-N1 s1"><tspan x="858.5" dy="0">{ ∧, ∨ } 로는 안 된다</tspan><tspan x="858.5" dy="18.5">모두 T 를 넣으면 반드시 T 가 나오므로 ¬ 를 만들 수 없다</tspan></text></g><text x="735" y="23" class="fill-N1 s1"><tspan x="735" dy="0">왜 이런 줄이기가 가능한가 — 진리표에서 거꾸로 읽으면 된다.</tspan><tspan x="735" dy="17.667">어떤 진리함수든 참인 줄마다 항을 하나 만들어 ∨ 로 묶으면 그 함수를 나타내는 식이 나오고,</tspan><tspan x="735" dy="17.667">그 식에는 ¬ 와 ∧ 와 ∨ 만 들어 있다. 남은 ∨ 를 드모르간으로 지우면 { ¬, ∧ } 만 남는다</tspan></text><text x="1505" y="23" class="fill-N1 s1"><tspan x="1505" dy="0">쓸모 — 연결자가 둘뿐이면 논리식에 대한 증명에서 따져야 할 경우도 둘뿐이다.</tspan><tspan x="1505" dy="17.667">13장(건전성)과 14장(완전성)이 그 이득을 그대로 가져간다.</tspan><tspan x="1505" dy="17.667">제대로 된 증명과 ‘줄일 수 없는 집합’ 의 분류는 19장의 몫이다</tspan></text><marker id="mk-d2-1761769810-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1761769810-3488378134)" d="M230.25 67.5v132" class="connection stroke-B1 s0" mask="url(#d2-1761769810)"/><text x="230" y="132" class="text-italic fill-N2 s1"><tspan x="230" dy="0">φ ↔ ψ 를</tspan><tspan x="230" dy="18.5">(φ → ψ) ∧ (ψ → φ) 로</tspan></text><path fill="none" marker-end="url(#mk-d2-1761769810-3488378134)" d="M230.25 270.5v132" class="connection stroke-B1 s0" mask="url(#d2-1761769810)"/><text x="230.5" y="335" class="text-italic fill-N2 s1"><tspan x="230.5" dy="0">φ → ψ 를</tspan><tspan x="230.5" dy="18.5">¬φ ∨ ψ 로</tspan></text><path fill="none" marker-end="url(#mk-d2-1761769810-3488378134)" d="M230.25 473.5v132" class="connection stroke-B1 s0" mask="url(#d2-1761769810)"/><text x="230.5" y="538" class="text-italic fill-N2 s1"><tspan x="230.5" dy="0">φ ∨ ψ 를</tspan><tspan x="230.5" dy="18.5">¬(¬φ ∧ ¬ψ) 로 — 드모르간</tspan></text><path fill="none" marker-end="url(#mk-d2-1761769810-3488378134)" d="M193.798 665.55C103.5 721.3 80.5 747.7 80.5 792.5" class="connection stroke-B1 s0" mask="url(#d2-1761769810)"/><text x="113.5" y="720" class="text-italic fill-N2 s1">고르는 방법은 여럿</text><path fill="none" marker-end="url(#mk-d2-1761769810-3488378134)" d="M266.946 664.912C357.05 721.17 380 747.7 380 792.5" class="connection stroke-B1 s0" mask="url(#d2-1761769810)"/><text x="346.5" y="720" class="text-italic fill-N2 s1">끝까지 줄이면</text><path fill="none" marker-end="url(#mk-d2-1761769810-3488378134)" d="M267.228 647.508C739.45 717.842 858 747.7 858 792.5" class="connection stroke-B1 s0" mask="url(#d2-1761769810)"/><text x="587" y="701" class="text-italic fill-N2 s1">부정을 빼면 무너진다</text><mask id="d2-1761769810" width="2031" height="1080" x="-98" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-98-101h2031V979H-98z"/><path d="M163 116h134v37H163zM195 319h71v37h-71zM136 522h189v37H136zM31 704h165v21H31zM285 704h123v21H285zM495 685h184v21H495z"/></mask></svg>