<svg xmlns="http://www.w3.org/2000/svg" width="2813" height="1836" class="d2-4163584537 d2-svg" viewBox="-90 -121 2813 1836"><rect width="2813" height="1836" x="-90" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4163584537 .fill-N1{fill:#0a0f25}.d2-4163584537 .fill-N2{fill:#676c7e}.d2-4163584537 .fill-B4{fill:#e3e9fd}.d2-4163584537 .fill-B5{fill:#edf0fd}.d2-4163584537 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M65 20h696v458H65z" class="stroke-B1 fill-B4 s0"/></g><text x="413" y="7" class="text-bold fill-N1 s1">¬I — 부정 도입</text></g><g ><g class="shape"><path d="M171 639h696v458H171z" class="stroke-B1 fill-B4 s0"/></g><text x="519" y="626" class="text-bold fill-N1 s1">IP — 간접증명(귀류법)</text></g><g ><g class="shape"><path d="M11 1237h465v377H11z" class="stroke-B1 fill-B4 s0"/></g><text x="243.5" y="1224" class="text-bold fill-N1 s1">차이는 마지막 한 걸음이다</text></g><text x="1312" y="73" class="fill-N1 s2"><tspan x="1312" dy="0">다른 열두 규칙은 연결자 하나의 뜻을 풀어 쓴 것이다. ∧I 는 ∧ 를 만드는 법, ∧E 는 쓰는 법.</tspan><tspan x="1312" dy="17.667">IP 는 어느 연결자에도 속하지 않는다. IP 가 말하는 것은 연결자의 뜻이 아니라 ‘참과 거짓 말고 다른 것은 없다’ 는 태도다.</tspan><tspan x="1312" dy="17.667">그래서 IP 를 빼도 남은 규칙들은 그대로 돌아간다 — 다만 증명되는 것이 줄어든다</tspan></text><text x="2247.5" y="73" class="text-bold fill-N1 s2"><tspan x="2247.5" dy="0">IP 없이는 얻지 못하는 대표적인 것이 배중률 φ ∨ ¬φ 다.</tspan><tspan x="2247.5" dy="17.667">IP 를 빼고 나머지 열두 규칙만 남긴 체계가 직관주의 논리이고, 19장이 그 체계를 다룬다.</tspan><tspan x="2247.5" dy="17.667">그때 이 그림으로 되돌아온다</tspan></text><g ><g class="shape"><path d="M163 50h162v66H163z" class="stroke-B1 fill-B5 s0"/></g><text x="244" y="88.5" class="text-bold fill-N1 s2">φ 를 가정한다</text></g><g ><g class="shape"><path d="M107 216h273v66H107z" class="stroke-B1 fill-B5 s0"/></g><text x="243.5" y="254.5" class="text-bold fill-N1 s2">그 범위 안에서 ⊥ 를 얻는다</text></g><g ><g class="shape"><path d="M95 382h298v66H95z" class="stroke-B1 fill-B5 s0"/></g><text x="244" y="420.5" class="text-bold fill-N1 s2">가정을 방출하고 ¬φ 를 적는다</text></g><text x="592" y="413" class="fill-N1 s2"><tspan x="592" dy="0">읽기 — φ 를 놓았더니 모순이 났다.</tspan><tspan x="592" dy="18.5">그러므로 φ 는 아니다</tspan></text><g ><g class="shape"><path d="M260 669h172v66H260z" class="stroke-B1 fill-B5 s0"/></g><text x="346" y="707.5" class="text-bold fill-N1 s2">¬φ 를 가정한다</text></g><g ><g class="shape"><path d="M210 835h273v66H210z" class="stroke-B1 fill-B5 s0"/></g><text x="346.5" y="873.5" class="text-bold fill-N1 s2">그 범위 안에서 ⊥ 를 얻는다</text></g><g ><g class="shape"><path d="M201 1001h290v66H201z" class="stroke-B1 fill-B5 s0"/></g><text x="346" y="1039.5" class="text-bold fill-N1 s2">가정을 방출하고 φ 를 적는다</text></g><text x="694" y="1032" class="fill-N1 s2"><tspan x="694" dy="0">읽기 — ¬φ 를 놓았더니 모순이 났다.</tspan><tspan x="694" dy="18.5">그러므로 φ 다</tspan></text><g ><g class="shape"><path d="M41 1267h405v98H41z" class="stroke-B1 fill-B5 s0"/></g><text x="243.5" y="1305.5" class="text-bold fill-N1 s2"><tspan x="243.5" dy="0">¬I 가 주는 것은 ¬φ 다.</tspan><tspan x="243.5" dy="17.667">‘φ 는 성립하지 않는다’ 를 얻었을 뿐이고,</tspan><tspan x="243.5" dy="17.667">그 말 자체가 결론이다</tspan></text></g><g ><g class="shape"><path d="M50 1486h388v98H50z" class="stroke-B1 fill-B5 s0"/></g><text x="244" y="1524.5" class="text-bold fill-N1 s2"><tspan x="244" dy="0">IP 가 주는 것은 φ 다.</tspan><tspan x="244" dy="17.667">얻은 것은 ‘¬φ 가 성립하지 않는다’ 인데</tspan><tspan x="244" dy="17.667">거기서 φ 로 건너뛴다</tspan></text></g><marker id="mk-d2-4163584537-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4163584537-3488378134)" d="M243.75 118v94" class="connection stroke-B1 s0" mask="url(#d2-4163584537)"/><path fill="none" marker-end="url(#mk-d2-4163584537-3488378134)" d="M243.75 284v94" class="connection stroke-B1 s0" mask="url(#d2-4163584537)"/><path fill="none" marker-end="url(#mk-d2-4163584537-3488378134)" d="M346.25 737v94" class="connection stroke-B1 s0" mask="url(#d2-4163584537)"/><path fill="none" marker-end="url(#mk-d2-4163584537-3488378134)" d="M346.25 903v94" class="connection stroke-B1 s0" mask="url(#d2-4163584537)"/><path fill="none" marker-end="url(#mk-d2-4163584537-3488378134)" d="M346.25 479.5v156" class="connection stroke-B1 s0" mask="url(#d2-4163584537)"/><text x="346.5" y="564" class="text-italic fill-N2 s2">가정과 결론에서 ¬ 를 한 번씩 옮겼을 뿐</text><path fill="none" marker-end="url(#mk-d2-4163584537-3488378134)" d="M243.75 1366.5v116" class="connection stroke-B1 s0" mask="url(#d2-4163584537)"/><text x="243.5" y="1431" class="text-italic fill-N2 s2">이 건너뜀이 IP 의 전부다</text><path fill="none" marker-end="url(#mk-d2-4163584537-3488378134)" d="M141.25 479.5V1192" class="connection stroke-B1 s0" mask="url(#d2-4163584537)"/><path fill="none" marker-end="url(#mk-d2-4163584537-3488378134)" d="M346.25 1099v93" class="connection stroke-B1 s0" mask="url(#d2-4163584537)"/><mask id="d2-4163584537" width="2813" height="1836" x="-90" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-90-121h2813v1836H-90z"/><path d="M185 548h323v21H185zM142 1415h203v21H142z"/></mask></svg>