<svg xmlns="http://www.w3.org/2000/svg" width="1407" height="901" class="d2-3083493311 d2-svg" viewBox="-101 -101 1407 901"><rect width="1407" height="901" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3083493311 .fill-N1{fill:#0a0f25}.d2-3083493311 .fill-B4{fill:#e3e9fd}.d2-3083493311 .fill-B5{fill:#edf0fd}.d2-3083493311 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M100 0h1006v152H100z" class="stroke-B1 fill-B4 s0"/></g><text x="603" y="33" class="text-bold fill-N1 s1">‘그 F 는 G 다’ ⟹ ∃x ( Fx ∧ ∀y (Fy → y = x) ∧ Gx )</text></g><text x="602.5" y="268" class="text-bold fill-N1 s2"><tspan x="602.5" dy="0">‘그 F’ 는 이름이 아니다. 개체상수 하나로 옮길 수 없고 옮겨서도 안 된다 — 개체상수는 정의역의 원소를 반드시 하나 가리켜야 하는데,</tspan><tspan x="602.5" dy="18.5">왕이 없으면 가리킬 것이 없어 해석 자체가 완성되지 않는다. 확정기술은 이름이 아니라 한정사 뭉치이고, 그 뭉치 안에 존재 주장이 들어 있다</tspan></text><g ><g class="shape"><path d="M90 410h1025v152H90z" class="stroke-B1 fill-B4 s0"/></g><text x="602.5" y="443" class="text-bold fill-N1 s1">그래서 부정이 두 갈래로 갈린다 — 한국어에서는 한 문장이 두 뜻이다</text></g><text x="603" y="678" class="text-bold fill-N1 s2"><tspan x="603" dy="0">왕이 없을 때 ‘그 왕은 대머리다’ 는 거짓이다 — 참도 거짓도 아닌 것이 아니라 거짓이다.</tspan><tspan x="603" dy="18.5">한국어의 애매함이 술어논리에서는 괄호 자리의 차이로 드러난다. 이것이 형식화가 갚아 주는 값이다</tspan></text><g ><g class="shape"><path d="M108 46h279v98H108z" class="stroke-B1 fill-B5 s0"/></g><text x="247.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="247.5" dy="0">Fx</tspan><tspan x="247.5" dy="17.667">존재 주장 — F 인 것이 있다</tspan><tspan x="247.5" dy="17.667">숨어 있던 것이 이 조각이다</tspan></text></g><g ><g class="shape"><path d="M395 46h389v98H395z" class="stroke-B1 fill-B5 s0"/></g><text x="589.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="589.5" dy="0">∀y (Fy → y = x)</tspan><tspan x="589.5" dy="17.667">유일성 주장 — F 인 것은 그것 하나뿐이다</tspan><tspan x="589.5" dy="17.667">‘그’ 라는 낱말이 여기서 값을 한다</tspan></text></g><g ><g class="shape"><path d="M792 46h306v98H792z" class="stroke-B1 fill-B5 s0"/></g><text x="945" y="92.5" class="text-bold fill-N1 s2"><tspan x="945" dy="0">Gx</tspan><tspan x="945" dy="18.5">원래 하려던 주장 — 그것이 G 다</tspan></text></g><g ><g class="shape"><path d="M133 456h477v98H133z" class="stroke-B1 fill-B5 s0"/></g><text x="371.5" y="494.5" class="text-bold fill-N1 s2"><tspan x="371.5" dy="0">¬ ∃x (Fx ∧ ∀y (Fy → y = x) ∧ Gx)</tspan><tspan x="371.5" dy="17.667">부정이 존재 주장까지 삼킨다. 왕이 없으면 참이다.</tspan><tspan x="371.5" dy="17.667">읽기: ‘그 왕이 대머리라는 것은 사실이 아니다’</tspan></text></g><g ><g class="shape"><path d="M618 456h454v98H618z" class="stroke-B1 fill-B5 s0"/></g><text x="845" y="494.5" class="text-bold fill-N1 s2"><tspan x="845" dy="0">∃x (Fx ∧ ∀y (Fy → y = x) ∧ ¬Gx)</tspan><tspan x="845" dy="17.667">부정이 술어에만 걸린다. 왕이 없으면 거짓이다.</tspan><tspan x="845" dy="17.667">읽기: ‘그 왕은 대머리 아닌 사람이다’</tspan></text></g><marker id="mk-d2-3083493311-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3083493311-3488378134)" d="M602.5 154v94" class="connection stroke-B1 s0" mask="url(#d2-3083493311)"/><path fill="none" marker-end="url(#mk-d2-3083493311-3488378134)" d="M602.5 290.5v116" class="connection stroke-B1 s0" mask="url(#d2-3083493311)"/><text x="603" y="355" style="fill:#676c7e;text-anchor:middle;font-size:16px">¬ 를 어디에 붙이는가</text><path fill="none" marker-end="url(#mk-d2-3083493311-3488378134)" d="M602.5 564v94" class="connection stroke-B1 s0" mask="url(#d2-3083493311)"/><mask id="d2-3083493311" width="1407" height="901" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1407v901H-101z"/><path d="M515 339h176v21H515z"/></mask></svg>