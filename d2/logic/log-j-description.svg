<svg xmlns="http://www.w3.org/2000/svg" width="911" height="1149" class="d2-2174083568 d2-svg" viewBox="-101 -101 911 1149"><rect width="911" height="1149" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2174083568 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2174083568 .fill-N1{fill:#0a0f25}.d2-2174083568 .fill-B4{fill:#e3e9fd}.d2-2174083568 .fill-B5{fill:#edf0fd}.d2-2174083568 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M17 0h676v212H17z" class="stroke-B1 fill-B4 s0"/></g><text x="355" y="33" class="text-bold fill-N1 s1"><tspan x="355" dy="0">‘그 F 는 G 다’ ⟹</tspan><tspan x="355" dy="32">∃x ( Fx ∧ ∀y (Fy → y = x) ∧ Gx )</tspan></text></g><text x="354.5" y="328" class="text-bold fill-N1 s2"><tspan x="354.5" dy="0">‘그 F’ 는 이름이 아니다.</tspan><tspan x="354.5" dy="16.833">개체상수 하나로 옮길 수 없고 옮겨서도 안 된다 —</tspan><tspan x="354.5" dy="16.833">개체상수는 정의역의 원소를 반드시 하나 가리켜야 하는데,</tspan><tspan x="354.5" dy="16.833">왕이 없으면 가리킬 것이 없어 해석 자체가 완성되지 않는다.</tspan><tspan x="354.5" dy="16.833">확정기술은 이름이 아니라 한정사 뭉치이고,</tspan><tspan x="354.5" dy="16.833">그 뭉치 안에 존재 주장이 들어 있다</tspan></text><g ><g class="shape"><path d="M0 534h709v212H0z" class="stroke-B1 fill-B4 s0"/></g><text x="354.5" y="567" class="text-bold fill-N1 s1"><tspan x="354.5" dy="0">그래서 부정이 두 갈래로 갈린다 —</tspan><tspan x="354.5" dy="32">한국어에서는 한 문장이 두 뜻이다</tspan></text></g><text x="354.5" y="862" class="text-bold fill-N1 s2"><tspan x="354.5" dy="0">러셀의 분석으로는 왕이 없을 때</tspan><tspan x="354.5" dy="16.833">‘그 왕은 대머리다’ 는 거짓이다 —</tspan><tspan x="354.5" dy="16.833">참도 거짓도 아닌 것이 아니라 거짓이다.</tspan><tspan x="354.5" dy="16.833">한국어의 애매함이 술어논리에서는</tspan><tspan x="354.5" dy="16.833">괄호 자리의 차이로 드러난다.</tspan><tspan x="354.5" dy="16.833">이것이 형식화가 갚아 주는 값이다</tspan></text><g ><g class="shape"><path d="M25 74h171v130H25z" class="stroke-B1 fill-B5 s0"/></g><text x="110.5" y="112.5" class="text-bold fill-N1 s2"><tspan x="110.5" dy="0">Fx</tspan><tspan x="110.5" dy="17">존재 주장 —</tspan><tspan x="110.5" dy="17">F 인 것이 있다</tspan><tspan x="110.5" dy="17">숨어 있던 것이</tspan><tspan x="110.5" dy="17">이 조각이다</tspan></text></g><g ><g class="shape"><path d="M204 74h267v130H204z" class="stroke-B1 fill-B5 s0"/></g><text x="337.5" y="112.5" class="text-bold fill-N1 s2"><tspan x="337.5" dy="0">∀y (Fy → y = x)</tspan><tspan x="337.5" dy="17">유일성 주장 —</tspan><tspan x="337.5" dy="17">F 인 것은 그것 하나뿐이다</tspan><tspan x="337.5" dy="17">‘그’ 라는 낱말이</tspan><tspan x="337.5" dy="17">여기서 값을 한다</tspan></text></g><g ><g class="shape"><path d="M479 74h206v130H479z" class="stroke-B1 fill-B5 s0"/></g><text x="582" y="128.5" class="text-bold fill-N1 s2"><tspan x="582" dy="0">Gx</tspan><tspan x="582" dy="17.667">원래 하려던 주장 —</tspan><tspan x="582" dy="17.667">그것이 G 다</tspan></text></g><g ><g class="shape"><path d="M8 608h315v130H8z" class="stroke-B1 fill-B5 s0"/></g><text x="165.5" y="646.5" class="text-bold fill-N1 s2"><tspan x="165.5" dy="0">¬ ∃x (Fx ∧ ∀y (Fy → y = x) ∧ Gx)</tspan><tspan x="165.5" dy="17">부정이 존재 주장까지 삼킨다.</tspan><tspan x="165.5" dy="17">왕이 없으면 참이다.</tspan><tspan x="165.5" dy="17">읽기: ‘그 왕이 대머리라는 것은</tspan><tspan x="165.5" dy="17">사실이 아니다’</tspan></text></g><g ><g class="shape"><path d="M331 608h370v130H331z" class="stroke-B1 fill-B5 s0"/></g><text x="516" y="654.5" class="text-bold fill-N1 s2"><tspan x="516" dy="0">∃x (Fx ∧ ∀y (Fy → y = x) ∧ ¬Gx)</tspan><tspan x="516" dy="17.25">부정이 술어에만 걸린다.</tspan><tspan x="516" dy="17.25">왕이 없으면 거짓이다.</tspan><tspan x="516" dy="17.25">읽기: ‘그 왕은 대머리 아닌 사람이다’</tspan></text></g><marker id="mk-d2-2174083568-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2174083568-3488378134)" d="M354.5 214v94" class="connection stroke-B1 s0" mask="url(#d2-2174083568)"/><path fill="none" marker-end="url(#mk-d2-2174083568-3488378134)" d="M354.5 414.5v116" class="connection stroke-B1 s0" mask="url(#d2-2174083568)"/><text x="355" y="479" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">¬ 를 어디에 붙이는가</text><path fill="none" marker-end="url(#mk-d2-2174083568-3488378134)" d="M354.5 748v94" class="connection stroke-B1 s0" mask="url(#d2-2174083568)"/><mask id="d2-2174083568" width="911" height="1149" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h911v1149h-911z"/><path d="M267 463h176v21H267z"/></mask></svg>