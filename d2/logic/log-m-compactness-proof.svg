<svg xmlns="http://www.w3.org/2000/svg" width="1149" height="1408" class="d2-639429067 d2-svg" viewBox="-101 -101 1149 1408"><rect width="1149" height="1408" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-639429067 .fill-N1{fill:#0a0f25}.d2-639429067 .fill-B4{fill:#e3e9fd}.d2-639429067 .fill-B5{fill:#edf0fd}.d2-639429067 .fill-B6{fill:#f7f8fe}.d2-639429067 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M101 0h745v66H101z" class="stroke-B1 fill-B6 s0"/></g><text x="473.5" y="38.5" class="text-bold fill-N1 s1">컴팩트성 정리 — Γ 의 모든 유한 부분집합이 모형을 가지면 Γ 자체도 모형을 갖는다</text></g><g ><g class="shape"><path d="M75 166h798v152H75z" class="stroke-B1 fill-B4 s0"/></g><text x="474" y="199" class="text-bold fill-N1 s2">곧바로는 손댈 데가 없다. 대우로 뒤집는다</text></g><g ><g class="shape"><path d="M0 439h947v448H0z" class="stroke-B1 fill-B4 s0"/></g><text x="473.5" y="472" class="text-bold fill-N1 s2">네 걸음. 새로 만든 것은 하나도 없다</text></g><g ><g class="shape"><path d="M72 987h803v66H72z" class="stroke-B1 fill-B6 s0"/></g><text x="473.5" y="1025.5" class="text-bold fill-N1 s1">모형 없는 유한 부분집합 Δ 를 실제로 찾았다. 대우가 증명되었으므로 정리도 증명되었다</text></g><text x="474" y="1169" class="text-bold fill-N1 s1"><tspan x="474" dy="0">일하는 걸음은 3 번 하나뿐이다.</tspan><tspan x="474" dy="17.667">1 · 2 · 4 는 두 다리를 건너는 것이고, 무한한 Γ 를 유한한 Δ 로 줄이는 일은 ‘도출은 유한하다’ 가 혼자 한다.</tspan><tspan x="474" dy="17.667">증명이 짧은 것은 요행이 아니라 앞의 세 장이 미리 값을 치러 두었기 때문이다</tspan></text><g ><g class="shape"><path d="M83 212h316v98H83z" class="stroke-B1 fill-B5 s0"/></g><text x="241" y="250.5" class="text-bold fill-N1 s1"><tspan x="241" dy="0">원래 진술</tspan><tspan x="241" dy="17.667">유한 부분집합이 모두 만족가능</tspan><tspan x="241" dy="17.667">→ Γ 가 만족가능</tspan></text></g><g ><g class="shape"><path d="M407 212h458v98H407z" class="stroke-B1 fill-B5 s0"/></g><text x="636" y="250.5" class="text-bold fill-N1 s1"><tspan x="636" dy="0">대우</tspan><tspan x="636" dy="17.667">Γ 가 만족가능하지 않다</tspan><tspan x="636" dy="17.667">→ 만족가능하지 않은 유한 부분집합이 하나 있다</tspan></text></g><g ><g class="shape"><path d="M8 485h84v66H8z" class="stroke-B1 fill-B5 s0"/></g><text x="50" y="523.5" class="text-bold fill-N1 s1">걸음</text></g><g ><g class="shape"><path d="M100 485h539v66H100z" class="stroke-B1 fill-B5 s0"/></g><text x="369.5" y="523.5" class="text-bold fill-N1 s1">무엇을 쓰는가</text></g><g ><g class="shape"><path d="M647 485h292v66H647z" class="stroke-B1 fill-B5 s0"/></g><text x="793" y="523.5" class="text-bold fill-N1 s1">얻는 것</text></g><g ><g class="shape"><path d="M8 559h84v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="50" y="605.5" class="text-bold fill-N1 s1">1</text></g><g ><g class="shape"><path d="M100 559h539v82H100z" class="stroke-B1 fill-B5 s0"/></g><text x="369.5" y="597.5" class="text-bold fill-N1 s1"><tspan x="369.5" dy="0">Γ 에 모형이 없다 = Γ 를 참으로 만드는 모형이 하나도 없다.</tspan><tspan x="369.5" dy="18.5">그러면 Γ ⊨ ⊥ 이 공허하게 성립한다</tspan></text></g><g ><g class="shape"><path d="M647 559h292v82H647z" class="stroke-B1 fill-B5 s0"/></g><text x="793" y="605.5" class="text-bold fill-N1 s1">Γ ⊨ ⊥</text></g><g ><g class="shape"><path d="M8 649h84v66H8z" class="stroke-B1 fill-B5 s0"/></g><text x="50" y="687.5" class="text-bold fill-N1 s1">2</text></g><g ><g class="shape"><path d="M100 649h539v66H100z" class="stroke-B1 fill-B5 s0"/></g><text x="369.5" y="687.5" class="text-bold fill-N1 s1">14장 완전성 — ⊨ 로 성립하는 것은 ⊢ 로도 얻어진다</text></g><g ><g class="shape"><path d="M647 649h292v66H647z" class="stroke-B1 fill-B5 s0"/></g><text x="793" y="687.5" class="text-bold fill-N1 s1">Γ ⊢ ⊥</text></g><g ><g class="shape"><path d="M8 723h84v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="50" y="769.5" class="text-bold fill-N1 s1">3</text></g><g ><g class="shape"><path d="M100 723h539v82H100z" class="stroke-B1 fill-B5 s0"/></g><text x="369.5" y="761.5" class="text-bold fill-N1 s1"><tspan x="369.5" dy="0">7장 도출의 유한성 — 도출은 줄의 유한한 목록이므로</tspan><tspan x="369.5" dy="18.5">전제로 인용된 것도 유한 개뿐이다. 그 유한 개를 Δ 라 한다</tspan></text></g><g ><g class="shape"><path d="M647 723h292v82H647z" class="stroke-B1 fill-B5 s0"/></g><text x="793" y="769.5" class="text-bold fill-N1 s1">Δ ⊆ Γ 가 유한하고 Δ ⊢ ⊥</text></g><g ><g class="shape"><path d="M8 813h84v66H8z" class="stroke-B1 fill-B5 s0"/></g><text x="50" y="851.5" class="text-bold fill-N1 s1">4</text></g><g ><g class="shape"><path d="M100 813h539v66H100z" class="stroke-B1 fill-B5 s0"/></g><text x="369.5" y="851.5" class="text-bold fill-N1 s1">13장 건전성 — ⊢ 로 얻은 것은 ⊨ 로도 성립한다</text></g><g ><g class="shape"><path d="M647 813h292v66H647z" class="stroke-B1 fill-B5 s0"/></g><text x="793" y="851.5" class="text-bold fill-N1 s1">Δ ⊨ ⊥ 이므로 Δ 에 모형이 없다</text></g><marker id="mk-d2-639429067-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-639429067-3488378134)" d="M473.5 68v94" class="connection stroke-B1 s0" mask="url(#d2-639429067)"/><path fill="none" marker-end="url(#mk-d2-639429067-3488378134)" d="M473.5 319.5v116" class="connection stroke-B1 s0" mask="url(#d2-639429067)"/><text x="474" y="384" style="fill:#676c7e;text-anchor:middle;font-size:16px">Γ 가 만족가능하지 않다고 두고 시작한다</text><path fill="none" marker-end="url(#mk-d2-639429067-3488378134)" d="M473.5 889v94" class="connection stroke-B1 s0" mask="url(#d2-639429067)"/><path fill="none" marker-end="url(#mk-d2-639429067-3488378134)" d="M473.5 1055v94" class="connection stroke-B1 s0" mask="url(#d2-639429067)"/><mask id="d2-639429067" width="1149" height="1408" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1149v1408H-101z"/><path d="M305 368h338v21H305z"/></mask></svg>