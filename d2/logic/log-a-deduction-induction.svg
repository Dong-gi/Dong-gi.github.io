<svg xmlns="http://www.w3.org/2000/svg" width="1167" height="1127" class="d2-1278274304 d2-svg" viewBox="-101 -101 1167 1127"><rect width="1167" height="1127" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1278274304 .text-bold{font-weight:700}.d2-1278274304 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1278274304 .fill-N1{fill:#0a0f25}.d2-1278274304 .fill-N2{fill:#676c7e}.d2-1278274304 .fill-B6{fill:#f7f8fe}.d2-1278274304 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="488.5" cy="80" class="shape stroke-B1 fill-B6 s0" rx="240.5" ry="80"/></g><text x="488.5" y="77.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">전제가 결론을 얼마나 받쳐 준다고</tspan><tspan x="488.5" dy="18.5">주장하는가</tspan></text></g><g ><g class="shape"><path d="M0 281h464v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="232" y="319.5" class="text-bold fill-N1 s1"><tspan x="232" dy="0">연역 논증(deductive)</tspan><tspan x="232" dy="18.5">전제가 참이면 결론이 반드시 참이라고 주장한다</tspan></text></g><g ><g class="shape"><path d="M524 281h441v82H524z" class="stroke-B1 fill-B6 s0"/></g><text x="744.5" y="319.5" class="text-bold fill-N1 s1"><tspan x="744.5" dy="0">귀납 논증(inductive)</tspan><tspan x="744.5" dy="18.5">전제가 결론을 그럴듯하게 만든다고 주장한다</tspan></text></g><g ><g class="shape"><path d="M132 463h200v82H132z" class="stroke-B1 fill-B6 s0"/></g><text x="232" y="501.5" class="text-bold fill-N1 s1"><tspan x="232" dy="0">잣대는 타당 / 부당</tspan><tspan x="232" dy="18.5">중간이 없다</tspan></text></g><g ><g class="shape"><path d="M624 463h241v82H624z" class="stroke-B1 fill-B6 s0"/></g><text x="744.5" y="501.5" class="text-bold fill-N1 s1"><tspan x="744.5" dy="0">잣대는 강하다 / 약하다</tspan><tspan x="744.5" dy="18.5">정도가 있다</tspan></text></g><g ><g class="shape"><path d="M96 645h272v82H96z" class="stroke-B1 fill-B6 s0"/></g><text x="232" y="683.5" class="text-bold fill-N1 s1"><tspan x="232" dy="0">전제를 더해도</tspan><tspan x="232" dy="18.5">타당성은 사라지지 않는다</tspan></text></g><g ><g class="shape"><path d="M629 645h232v82H629z" class="stroke-B1 fill-B6 s0"/></g><text x="745" y="683.5" class="text-bold fill-N1 s1"><tspan x="745" dy="0">전제 하나가 더해지면</tspan><tspan x="745" dy="18.5">무너질 수 있다</tspan></text></g><path fill="transparent" stroke="transparent" d="M102 747h761v178H102z" class="shape s0"/><text x="482.5" y="787" class="fill-N1 s1"><tspan x="482.5" dy="0">귀납의 예 — 지금까지 본 백조가 모두 희었다. 그러므로 다음에 볼 백조도 흴 것이다.</tspan><tspan x="482.5" dy="17.667">타당성 잣대로 재면 부당하다. 전제가 다 참인데 결론이 거짓인 상황을 상상할 수 있다.</tspan><tspan x="482.5" dy="17.667">그러나 나쁜 논증이라는 뜻은 아니다. 잣대가 다를 뿐이다</tspan></text><text x="461.5" y="864" class="text-bold fill-N1 s1"><tspan x="461.5" dy="0">이 문서는 연역만 다룬다.</tspan><tspan x="461.5" dy="17.667">앞으로 ‘논증’ 이라고 쓰면 연역 논증을 뜻하고, ‘좋다’ 는 타당하다는 뜻이다.</tspan><tspan x="461.5" dy="17.667">귀납의 강도를 재는 일은 확률론과 통계의 몫이다</tspan></text><marker id="mk-d2-1278274304-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1278274304-3488378134)" d="M360.253 148.974C258 206 232 232.7 232 277.5" class="connection stroke-B1 s0" mask="url(#d2-1278274304)"/><text x="272" y="203" class="text-italic fill-N2 s1">남김없이 보증한다</text><path fill="none" marker-end="url(#mk-d2-1278274304-3488378134)" d="M615.748 148.971C718.4 206 744.5 232.7 744.5 277.5" class="connection stroke-B1 s0" mask="url(#d2-1278274304)"/><text x="704" y="203" class="text-italic fill-N2 s1">조금 더 그럴듯하게 만든다</text><path fill="none" marker-end="url(#mk-d2-1278274304-3488378134)" d="M232 365v94" class="connection stroke-B1 s0" mask="url(#d2-1278274304)"/><path fill="none" marker-end="url(#mk-d2-1278274304-3488378134)" d="M744.5 365v94" class="connection stroke-B1 s0" mask="url(#d2-1278274304)"/><path fill="none" marker-end="url(#mk-d2-1278274304-3488378134)" d="M232 547v94" class="connection stroke-B1 s0" mask="url(#d2-1278274304)"/><path fill="none" marker-end="url(#mk-d2-1278274304-3488378134)" d="M744.5 547v94" class="connection stroke-B1 s0" mask="url(#d2-1278274304)"/><mask id="d2-1278274304" width="1167" height="1127" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1167v1127H-101z"/><path d="M191 187h162v21H191zM591 187h226v21H591z"/></mask></svg>