<svg xmlns="http://www.w3.org/2000/svg" width="2900" height="620" class="d2-814275089 d2-svg" viewBox="-101 -101 2900 620"><rect width="2900" height="620" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-814275089 .fill-N1{fill:#0a0f25}.d2-814275089 .fill-N2{fill:#676c7e}.d2-814275089 .fill-B6{fill:#f7f8fe}.d2-814275089 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="356.5" cy="112" class="shape stroke-B1 fill-B6 s0" rx="240.5" ry="80"/></g><text x="356.5" y="109.5" class="text-bold fill-N1 s1"><tspan x="356.5" dy="0">전제가 결론을 얼마나 받쳐 준다고</tspan><tspan x="356.5" dy="18.5">주장하는가</tspan></text></g><g ><g class="shape"><path d="M1197 0h464v82h-464z" class="stroke-B1 fill-B6 s0"/></g><text x="1429" y="38.5" class="text-bold fill-N1 s1"><tspan x="1429" dy="0">연역 논증(deductive)</tspan><tspan x="1429" dy="18.5">전제가 참이면 결론이 반드시 참이라고 주장한다</tspan></text></g><g ><g class="shape"><path d="M1209 142h441v82h-441z" class="stroke-B1 fill-B6 s0"/></g><text x="1429.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="1429.5" dy="0">귀납 논증(inductive)</tspan><tspan x="1429.5" dy="18.5">전제가 결론을 그럴듯하게 만든다고 주장한다</tspan></text></g><g ><g class="shape"><path d="M1944 0h200v82h-200z" class="stroke-B1 fill-B6 s0"/></g><text x="2044" y="38.5" class="text-bold fill-N1 s1"><tspan x="2044" dy="0">잣대는 타당 / 부당</tspan><tspan x="2044" dy="18.5">중간이 없다</tspan></text></g><g ><g class="shape"><path d="M1923 142h241v82h-241z" class="stroke-B1 fill-B6 s0"/></g><text x="2043.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="2043.5" dy="0">잣대는 강하다 / 약하다</tspan><tspan x="2043.5" dy="18.5">정도가 있다</tspan></text></g><g ><g class="shape"><path d="M2426 0h272v82h-272z" class="stroke-B1 fill-B6 s0"/></g><text x="2562" y="38.5" class="text-bold fill-N1 s1"><tspan x="2562" dy="0">전제를 더해도</tspan><tspan x="2562" dy="18.5">타당성은 사라지지 않는다</tspan></text></g><g ><g class="shape"><path d="M2446 142h232v82h-232z" class="stroke-B1 fill-B6 s0"/></g><text x="2562" y="180.5" class="text-bold fill-N1 s1"><tspan x="2562" dy="0">전제 하나가 더해지면</tspan><tspan x="2562" dy="18.5">무너질 수 있다</tspan></text></g><text x="356.5" y="268" class="fill-N1 s1"><tspan x="356.5" dy="0">귀납의 예 — 지금까지 본 백조가 모두 희었다. 그러므로 다음에 볼 백조도 흴 것이다.</tspan><tspan x="356.5" dy="17.667">타당성 잣대로 재면 부당하다. 전제가 다 참인데 결론이 거짓인 상황을 상상할 수 있다.</tspan><tspan x="356.5" dy="17.667">그러나 나쁜 논증이라는 뜻은 아니다. 잣대가 다를 뿐이다</tspan></text><text x="356.5" y="381" class="text-bold fill-N1 s1"><tspan x="356.5" dy="0">이 문서는 연역만 다룬다.</tspan><tspan x="356.5" dy="17.667">앞으로 ‘논증’ 이라고 쓰면 연역 논증을 뜻하고, ‘좋다’ 는 타당하다는 뜻이다.</tspan><tspan x="356.5" dy="17.667">귀납의 강도를 재는 일은 확률론과 통계의 몫이다</tspan></text><marker id="mk-d2-814275089-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-814275089-3488378134)" d="M584.986 84.765C880.6 49.8 1003.4 41 1193 41" class="connection stroke-B1 s0" mask="url(#d2-814275089)"/><text x="889" y="55" class="text-italic fill-N2 s1">남김없이 보증한다</text><path fill="none" marker-end="url(#mk-d2-814275089-3488378134)" d="M584.986 139.235C880.6 174.2 1005.7 183 1204.5 183" class="connection stroke-B1 s0" mask="url(#d2-814275089)"/><text x="895" y="181" class="text-italic fill-N2 s1">조금 더 그럴듯하게 만든다</text><path fill="none" marker-end="url(#mk-d2-814275089-3488378134)" d="M1663 41h276.5" class="connection stroke-B1 s0" mask="url(#d2-814275089)"/><path fill="none" marker-end="url(#mk-d2-814275089-3488378134)" d="M1652.5 183H1919" class="connection stroke-B1 s0" mask="url(#d2-814275089)"/><path fill="none" marker-end="url(#mk-d2-814275089-3488378134)" d="M2146.5 41H2422" class="connection stroke-B1 s0" mask="url(#d2-814275089)"/><path fill="none" marker-end="url(#mk-d2-814275089-3488378134)" d="M2166 183h276" class="connection stroke-B1 s0" mask="url(#d2-814275089)"/><mask id="d2-814275089" width="2900" height="620" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2900v620H-101z"/><path d="M808 39h162v21H808zM782 165h226v21H782z"/></mask></svg>