<svg xmlns="http://www.w3.org/2000/svg" width="1063" height="1544" class="d2-1845985920 d2-svg" viewBox="-101 -101 1063 1544"><rect width="1063" height="1544" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1845985920 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1845985920 .fill-N1{fill:#0a0f25}.d2-1845985920 .fill-B4{fill:#e3e9fd}.d2-1845985920 .fill-B5{fill:#edf0fd}.d2-1845985920 .fill-B6{fill:#f7f8fe}.d2-1845985920 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{text-anchor:middle;font-size:24px}</style><g ><g class="shape"><path d="M0 0h861v664H0z" class="stroke-B1 fill-B4 s0"/></g><text x="430.5" y="33" class="text-bold fill-N1 s1">같은 걸음을 두 번 걷는다 — 의미론에서 증명 체계로</text></g><g ><g class="shape"><path d="M220 785h422v388H220z" class="stroke-B1 fill-B4 s0"/></g><text x="431" y="818" class="text-bold fill-N1 s1">규칙 넷을 더해서 얻는 것</text></g><text x="430.5" y="1289" class="text-bold fill-N1 s2"><tspan x="430.5" dy="0">다만 값을 치른다 —</tspan><tspan x="430.5" dy="17.25">규칙 넷 가운데 둘에 변수 조건이 붙는다.</tspan><tspan x="430.5" dy="17.25">명제논리의 규칙 열셋에는 없던 종류의 조건이고,</tspan><tspan x="430.5" dy="17.25">이 장에서 가장 자주 틀리는 자리다</tspan></text><g ><g class="shape"><path d="M12 82h397v570H12z" class="stroke-B1 fill-B5 s0"/></g><text x="210.5" y="70" class="fill-N1 s3">명제논리 — 6장에서 7장으로</text></g><g ><g class="shape"><path d="M421 82h428v570H421z" class="stroke-B1 fill-B5 s0"/></g><text x="635" y="70" class="fill-N1 s3">술어논리 — 10장에서 11장으로</text></g><g ><g class="shape"><path d="M236 831h390v98H236z" class="stroke-B1 fill-B5 s0"/></g><text x="431" y="869.5" class="text-bold fill-N1 s2"><tspan x="431" dy="0">도출은 유한한 줄의 목록이다</tspan><tspan x="431" dy="17.667">모형이 무한히 많은 것과 상관없이</tspan><tspan x="431" dy="17.667">종이 한 장에 다 적힌다</tspan></text></g><g ><g class="shape"><path d="M236 945h390v98H236z" class="stroke-B1 fill-B5 s0"/></g><text x="431" y="983.5" class="text-bold fill-N1 s2"><tspan x="431" dy="0">검사가 모양만 본다</tspan><tspan x="431" dy="17.667">D 가 무엇인지, I 가 무엇을 골랐는지</tspan><tspan x="431" dy="17.667">몰라도 줄마다 규칙과 맞는지 볼 수 있다</tspan></text></g><g ><g class="shape"><path d="M236 1059h390v98H236z" class="stroke-B1 fill-B5 s0"/></g><text x="431" y="1097.5" class="text-bold fill-N1 s2"><tspan x="431" dy="0">절반의 판정이 생긴다</tspan><tspan x="431" dy="17.667">‘도출이 있다’ 는 유한 단계에 확정된다.</tspan><tspan x="431" dy="17.667">‘없다’ 는 여전히 확정되지 않는다</tspan></text></g><g ><g class="shape"><path d="M87 112h247v98H87z" class="stroke-B1 fill-B6 s0"/></g><text x="210.5" y="150.5" class="text-bold fill-N1 s2"><tspan x="210.5" dy="0">6장 의미론</tspan><tspan x="210.5" dy="17.667">배당 v 를 훑는다.</tspan><tspan x="210.5" dy="17.667">문장문자가 n 개면 2ⁿ 줄</tspan></text></g><g ><g class="shape"><path d="M42 310h337v114H42z" class="stroke-B1 fill-B6 s0"/></g><text x="210.5" y="348.5" class="text-bold fill-N1 s2"><tspan x="210.5" dy="0">훑기가 끝나기는 한다</tspan><tspan x="210.5" dy="17.25">느릴 뿐 판정은 나온다.</tspan><tspan x="210.5" dy="17.25">증명 체계는 ‘빠르고 남에게</tspan><tspan x="210.5" dy="17.25">건넬 수 있는 것’ 을 얻으려고 왔다</tspan></text></g><g ><g class="shape"><path d="M132 524h157v82H132z" class="stroke-B1 fill-B6 s0"/></g><text x="210.5" y="562.5" class="text-bold fill-N1 s2"><tspan x="210.5" dy="0">7장 자연연역</tspan><tspan x="210.5" dy="18.5">규칙 열셋</tspan></text></g><g ><g class="shape"><path d="M510 112h250v98H510z" class="stroke-B1 fill-B6 s0"/></g><text x="635" y="150.5" class="text-bold fill-N1 s2"><tspan x="635" dy="0">10장 의미론</tspan><tspan x="635" dy="17.667">모형 ℳ = ⟨D, I⟩ 를 훑는다.</tspan><tspan x="635" dy="17.667">D 의 크기에 상한이 없다</tspan></text></g><g ><g class="shape"><path d="M451 310h368v130H451z" class="stroke-B1 fill-B6 s0"/></g><text x="635" y="348.5" class="text-bold fill-N1 s2"><tspan x="635" dy="0">훑기가 끝나지 않는다</tspan><tspan x="635" dy="17">모형이 무한히 많고</tspan><tspan x="635" dy="17">크기에 상한이 없다.</tspan><tspan x="635" dy="17">진리표에 해당하는 표를 그릴 수 없다.</tspan><tspan x="635" dy="17">증명 체계 말고 손에 쥘 것이 없다</tspan></text></g><g ><g class="shape"><path d="M508 540h255v82H508z" class="stroke-B1 fill-B6 s0"/></g><text x="635.5" y="578.5" class="text-bold fill-N1 s2"><tspan x="635.5" dy="0">11장 자연연역</tspan><tspan x="635.5" dy="18.5">규칙 열셋에 넷을 더한다</tspan></text></g><marker id="mk-d2-1845985920-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1845985920-3488378134)" d="M210.5 212v94" class="connection stroke-B1 s0" mask="url(#d2-1845985920)"/><path fill="none" marker-end="url(#mk-d2-1845985920-3488378134)" d="M210.5 426v94" class="connection stroke-B1 s0" mask="url(#d2-1845985920)"/><path fill="none" marker-end="url(#mk-d2-1845985920-3488378134)" d="M635 212v94" class="connection stroke-B1 s0" mask="url(#d2-1845985920)"/><path fill="none" marker-end="url(#mk-d2-1845985920-3488378134)" d="M635 442v94" class="connection stroke-B1 s0" mask="url(#d2-1845985920)"/><path fill="none" marker-end="url(#mk-d2-1845985920-3488378134)" d="M430.5 665.5v116" class="connection stroke-B1 s0" mask="url(#d2-1845985920)"/><text x="430.5" y="730" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">규칙 넷을 더한다</text><path fill="none" marker-end="url(#mk-d2-1845985920-3488378134)" d="M430.5 1175v94" class="connection stroke-B1 s0" mask="url(#d2-1845985920)"/><mask id="d2-1845985920" width="1063" height="1544" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H962v1544H-101z"/><path d="M358 714h145v21H358z"/></mask></svg>