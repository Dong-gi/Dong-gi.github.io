<svg xmlns="http://www.w3.org/2000/svg" width="1498" height="1306" class="d2-193875343 d2-svg" viewBox="-91 -101 1498 1306"><rect width="1498" height="1306" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-193875343 .fill-N1{fill:#0a0f25}.d2-193875343 .fill-B4{fill:#e3e9fd}.d2-193875343 .fill-B5{fill:#edf0fd}.d2-193875343 .fill-B6{fill:#f7f8fe}.d2-193875343 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{text-anchor:middle;font-size:24px}</style><g ><g class="shape"><path d="M193 0h881v648H193z" class="stroke-B1 fill-B4 s0"/></g><text x="633.5" y="33" class="text-bold fill-N1 s1">같은 걸음을 두 번 걷는다 — 의미론에서 증명 체계로</text></g><g ><g class="shape"><path d="M10 789h1296v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="658" y="776" class="text-bold fill-N1 s1">규칙 넷을 더해서 얻는 것</text></g><text x="633" y="1083" class="text-bold fill-N1 s2"><tspan x="633" dy="0">다만 값을 치른다 — 규칙 넷 가운데 둘에 변수 조건이 붙는다.</tspan><tspan x="633" dy="18.5">명제논리의 규칙 열셋에는 없던 종류의 조건이고, 이 장에서 가장 자주 틀리는 자리다</tspan></text><g ><g class="shape"><path d="M205 82h397v554H205z" class="stroke-B1 fill-B5 s0"/></g><text x="403.5" y="70" class="fill-N1 s3">명제논리 — 6장에서 7장으로</text></g><g ><g class="shape"><path d="M614 82h448v554H614z" class="stroke-B1 fill-B5 s0"/></g><text x="838" y="70" class="fill-N1 s3">술어논리 — 10장에서 11장으로</text></g><g ><g class="shape"><path d="M40 819h340v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="210" y="857.5" class="text-bold fill-N1 s2"><tspan x="210" dy="0">도출은 유한한 줄의 목록이다</tspan><tspan x="210" dy="17.667">모형이 무한히 많은 것과 상관없이</tspan><tspan x="210" dy="17.667">종이 한 장에 다 적힌다</tspan></text></g><g ><g class="shape"><path d="M440 819h386v98H440z" class="stroke-B1 fill-B5 s0"/></g><text x="633" y="857.5" class="text-bold fill-N1 s2"><tspan x="633" dy="0">검사가 모양만 본다</tspan><tspan x="633" dy="17.667">D 가 무엇인지, I 가 무엇을 골랐는지</tspan><tspan x="633" dy="17.667">몰라도 줄마다 규칙과 맞는지 볼 수 있다</tspan></text></g><g ><g class="shape"><path d="M886 819h390v98H886z" class="stroke-B1 fill-B5 s0"/></g><text x="1081" y="857.5" class="text-bold fill-N1 s2"><tspan x="1081" dy="0">절반의 판정이 생긴다</tspan><tspan x="1081" dy="17.667">‘도출이 있다’ 는 유한 단계에 확정된다.</tspan><tspan x="1081" dy="17.667">‘없다’ 는 여전히 확정되지 않는다</tspan></text></g><g ><g class="shape"><path d="M280 112h247v98H280z" class="stroke-B1 fill-B6 s0"/></g><text x="403.5" y="150.5" class="text-bold fill-N1 s2"><tspan x="403.5" dy="0">6장 의미론</tspan><tspan x="403.5" dy="17.667">배당 v 를 훑는다.</tspan><tspan x="403.5" dy="17.667">문장문자가 n 개면 2ⁿ 줄</tspan></text></g><g ><g class="shape"><path d="M235 310h337v114H235z" class="stroke-B1 fill-B6 s0"/></g><text x="403.5" y="348.5" class="text-bold fill-N1 s2"><tspan x="403.5" dy="0">훑기가 끝나기는 한다</tspan><tspan x="403.5" dy="17.25">느릴 뿐 판정은 나온다.</tspan><tspan x="403.5" dy="17.25">증명 체계는 ‘빠르고 남에게</tspan><tspan x="403.5" dy="17.25">건넬 수 있는 것’ 을 얻으려고 왔다</tspan></text></g><g ><g class="shape"><path d="M325 524h157v82H325z" class="stroke-B1 fill-B6 s0"/></g><text x="403.5" y="562.5" class="text-bold fill-N1 s2"><tspan x="403.5" dy="0">7장 자연연역</tspan><tspan x="403.5" dy="18.5">규칙 열셋</tspan></text></g><g ><g class="shape"><path d="M713 112h250v98H713z" class="stroke-B1 fill-B6 s0"/></g><text x="838" y="150.5" class="text-bold fill-N1 s2"><tspan x="838" dy="0">10장 의미론</tspan><tspan x="838" dy="17.667">모형 ℳ = ⟨D, I⟩ 를 훑는다.</tspan><tspan x="838" dy="17.667">D 의 크기에 상한이 없다</tspan></text></g><g ><g class="shape"><path d="M644 310h388v114H644z" class="stroke-B1 fill-B6 s0"/></g><text x="838" y="348.5" class="text-bold fill-N1 s2"><tspan x="838" dy="0">훑기가 끝나지 않는다</tspan><tspan x="838" dy="17.25">모형이 무한히 많고 크기에 상한이 없다.</tspan><tspan x="838" dy="17.25">진리표에 해당하는 표를 그릴 수 없다.</tspan><tspan x="838" dy="17.25">증명 체계 말고 손에 쥘 것이 없다</tspan></text></g><g ><g class="shape"><path d="M711 524h255v82H711z" class="stroke-B1 fill-B6 s0"/></g><text x="838.5" y="562.5" class="text-bold fill-N1 s2"><tspan x="838.5" dy="0">11장 자연연역</tspan><tspan x="838.5" dy="18.5">규칙 열셋에 넷을 더한다</tspan></text></g><marker id="mk-d2-193875343-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-193875343-3488378134)" d="M403.5 212v94" class="connection stroke-B1 s0" mask="url(#d2-193875343)"/><path fill="none" marker-end="url(#mk-d2-193875343-3488378134)" d="M403.5 426v94" class="connection stroke-B1 s0" mask="url(#d2-193875343)"/><path fill="none" marker-end="url(#mk-d2-193875343-3488378134)" d="M838 212v94" class="connection stroke-B1 s0" mask="url(#d2-193875343)"/><path fill="none" marker-end="url(#mk-d2-193875343-3488378134)" d="M838 426v94" class="connection stroke-B1 s0" mask="url(#d2-193875343)"/><path fill="none" marker-end="url(#mk-d2-193875343-3488378134)" d="M633 649.5v95" class="connection stroke-B1 s0" mask="url(#d2-193875343)"/><text x="633.5" y="704" style="fill:#676c7e;text-anchor:middle;font-size:16px">규칙 넷을 더한다</text><path fill="none" marker-end="url(#mk-d2-193875343-3488378134)" d="M633 949v114" class="connection stroke-B1 s0" mask="url(#d2-193875343)"/><mask id="d2-193875343" width="1498" height="1306" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1498v1306H-91z"/><path d="M561 688h145v21H561z"/></mask></svg>