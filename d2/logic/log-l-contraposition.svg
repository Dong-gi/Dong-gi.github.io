<svg xmlns="http://www.w3.org/2000/svg" width="1352" height="1071" class="d2-855134830 d2-svg" viewBox="-101 -101 1352 1071"><rect width="1352" height="1071" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-855134830 .fill-N1{fill:#0a0f25}.d2-855134830 .fill-B4{fill:#e3e9fd}.d2-855134830 .fill-B5{fill:#edf0fd}.d2-855134830 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h1150v480H0z" class="stroke-B1 fill-B4 s0"/></g><text x="575" y="33" class="text-bold fill-N1 s1">같은 주장을 네 번 고쳐 적는다 — 오른쪽 칸이 달라지는 것을 보라</text></g><g ><g class="shape"><path d="M123 580h905v152H123z" class="stroke-B1 fill-B4 s0"/></g><text x="575.5" y="613" class="text-bold fill-N1 s1">④ 를 증명하면 ① 로 되돌아온다</text></g><text x="575.5" y="848" class="text-bold fill-N1 s2"><tspan x="575.5" dy="0">바뀐 것은 증명해야 할 내용이 아니라 증명을 시작할 수 있는가다.</tspan><tspan x="575.5" dy="18.5">‘ 없음을 보여라 ’ 가 ‘ 만들어라 ’ 로 바뀌었고, 만드는 일에는 절차가 있다</tspan></text><g ><g class="shape"><path d="M8 46h212v66H8z" class="stroke-B1 fill-B5 s0"/></g><text x="114" y="84.5" class="text-bold fill-N1 s2">형태</text></g><g ><g class="shape"><path d="M228 46h316v66H228z" class="stroke-B1 fill-B5 s0"/></g><text x="386" y="84.5" class="text-bold fill-N1 s2">진술</text></g><g ><g class="shape"><path d="M552 46h590v66H552z" class="stroke-B1 fill-B5 s0"/></g><text x="847" y="84.5" class="text-bold fill-N1 s2">그러면 할 일이 무엇이 되는가</text></g><g ><g class="shape"><path d="M8 120h212v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="114" y="158.5" class="text-bold fill-N1 s2"><tspan x="114" dy="0">① 원래 형태</tspan><tspan x="114" dy="18.5">완전성</tspan></text></g><g ><g class="shape"><path d="M228 120h316v82H228z" class="stroke-B1 fill-B5 s0"/></g><text x="386" y="166.5" class="text-bold fill-N1 s2">Γ ⊨ φ 이면 Γ ⊢ φ</text></g><g ><g class="shape"><path d="M552 120h590v82H552z" class="stroke-B1 fill-B5 s0"/></g><text x="847" y="158.5" class="text-bold fill-N1 s2"><tspan x="847" dy="0">모든 모형에서 참인 것을 받아 도출을 하나 만들어라.</tspan><tspan x="847" dy="18.5">손에 쥔 것이 ‘ 반례가 없다 ’ 뿐이라 어디서 시작할지 알 수 없다</tspan></text></g><g ><g class="shape"><path d="M8 210h212v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="114" y="256.5" class="text-bold fill-N1 s2">② 대우</text></g><g ><g class="shape"><path d="M228 210h316v82H228z" class="stroke-B1 fill-B5 s0"/></g><text x="386" y="256.5" class="text-bold fill-N1 s2">Γ ⊬ φ 이면 Γ ⊭ φ</text></g><g ><g class="shape"><path d="M552 210h590v82H552z" class="stroke-B1 fill-B5 s0"/></g><text x="847" y="248.5" class="text-bold fill-N1 s2"><tspan x="847" dy="0">도출이 없다는 것에서 반례 모형을 하나 만들어라.</tspan><tspan x="847" dy="18.5">만들 것이 정해졌다 — 모형이다</tspan></text></g><g ><g class="shape"><path d="M8 300h212v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="114" y="346.5" class="text-bold fill-N1 s2">③ 짐을 왼쪽으로</text></g><g ><g class="shape"><path d="M228 300h316v82H228z" class="stroke-B1 fill-B5 s0"/></g><text x="386" y="338.5" class="text-bold fill-N1 s2"><tspan x="386" dy="0">Γ ∪ {¬φ} 가 일관적이면</tspan><tspan x="386" dy="18.5">그 집합은 모형을 갖는다</tspan></text></g><g ><g class="shape"><path d="M552 300h590v82H552z" class="stroke-B1 fill-B5 s0"/></g><text x="847" y="338.5" class="text-bold fill-N1 s2"><tspan x="847" dy="0">Γ ⊬ φ 와 ‘ Γ ∪ {¬φ} 가 일관적 ’ 은 같은 말이다.</tspan><tspan x="847" dy="18.5">한쪽에서 다른 쪽으로 건너가는 데 IP 와 ¬I 를 쓴다</tspan></text></g><g ><g class="shape"><path d="M8 390h212v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="114" y="428.5" class="text-bold fill-N1 s2"><tspan x="114" dy="0">④ 모형 존재 정리</tspan><tspan x="114" dy="18.5">증명할 것은 이것뿐</tspan></text></g><g ><g class="shape"><path d="M228 390h316v82H228z" class="stroke-B1 fill-B5 s0"/></g><text x="386" y="436.5" class="text-bold fill-N1 s2">일관적인 집합은 모형을 갖는다</text></g><g ><g class="shape"><path d="M552 390h590v82H552z" class="stroke-B1 fill-B5 s0"/></g><text x="847" y="428.5" class="text-bold fill-N1 s2"><tspan x="847" dy="0">집합 하나를 받아 모형 하나를 지어라.</tspan><tspan x="847" dy="18.5">φ 가 사라졌다. 남은 것은 Γ 하나다</tspan></text></g><g ><g class="shape"><path d="M131 626h194v98H131z" class="stroke-B1 fill-B5 s0"/></g><text x="228" y="672.5" class="text-bold fill-N1 s2"><tspan x="228" dy="0">Γ ⊨ φ 인데</tspan><tspan x="228" dy="18.5">Γ ⊬ φ 라고 해 보자</tspan></text></g><g ><g class="shape"><path d="M333 626h190v98H333z" class="stroke-B1 fill-B5 s0"/></g><text x="428" y="672.5" class="text-bold fill-N1 s2"><tspan x="428" dy="0">그러면 Γ ∪ {¬φ} 가</tspan><tspan x="428" dy="18.5">일관적이다</tspan></text></g><g ><g class="shape"><path d="M531 626h191v98H531z" class="stroke-B1 fill-B5 s0"/></g><text x="626.5" y="672.5" class="text-bold fill-N1 s2"><tspan x="626.5" dy="0">④ 가 그 집합에</tspan><tspan x="626.5" dy="18.5">모형을 하나 준다</tspan></text></g><g ><g class="shape"><path d="M730 626h290v98H730z" class="stroke-B1 fill-B5 s0"/></g><text x="875" y="664.5" class="text-bold fill-N1 s2"><tspan x="875" dy="0">그 모형은 Γ 를 만족시키면서</tspan><tspan x="875" dy="17.667">φ 를 거짓으로 만든다.</tspan><tspan x="875" dy="17.667">Γ ⊨ φ 에 어긋난다</tspan></text></g><marker id="mk-d2-855134830-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-855134830-3488378134)" d="M327 675h2" class="connection stroke-B1 s0" mask="url(#d2-855134830)"/><path fill="none" marker-end="url(#mk-d2-855134830-3488378134)" d="M524.5 675h3" class="connection stroke-B1 s0" mask="url(#d2-855134830)"/><path fill="none" marker-end="url(#mk-d2-855134830-3488378134)" d="M724 675h2" class="connection stroke-B1 s0" mask="url(#d2-855134830)"/><path fill="none" marker-end="url(#mk-d2-855134830-3488378134)" d="M575 482v94" class="connection stroke-B1 s0" mask="url(#d2-855134830)"/><path fill="none" marker-end="url(#mk-d2-855134830-3488378134)" d="M575 734v94" class="connection stroke-B1 s0" mask="url(#d2-855134830)"/><mask id="d2-855134830" width="1352" height="1071" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1352V970H-101z"/></mask></svg>