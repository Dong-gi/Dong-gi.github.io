<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="885" class="d2-1058398982 d2-svg" viewBox="-101 -101 1032 885"><rect width="1032" height="885" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1058398982 .fill-N1{fill:#0a0f25}.d2-1058398982 .fill-B5{fill:#edf0fd}.d2-1058398982 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M0 0h830v480H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="415" y="33" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">떠도는 문장과 거기서 빠진 것 — 줄마다 가로로 읽는다</text></g><g ><g class="shape"><path d="M58 601h714v82H58z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="415" y="639.5" class="text-bold fill-N1 s0"><tspan x="415" dy="0">T 가 (가) 산술을 담을 만큼 강하고 (나) 재귀적으로 공리화되고 (다) 일관적이면,</tspan><tspan x="415" dy="18.5">T ⊬ G 이고 T ⊬ ¬G 인 산술 문장 G 가 있다. 그 G 는 표준 모형 ℕ 에서 참이다</tspan></text></g><g ><g class="shape"><path d="M8 46h407v66H8z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="84.5" class="text-bold fill-N1 s0">떠도는 문장</text></g><g ><g class="shape"><path d="M423 46h399v66H423z" class="stroke-B1 fill-B5 s1"/></g><text x="622.5" y="84.5" class="text-bold fill-N1 s0">무엇이 빠졌나</text></g><g ><g class="shape"><path d="M8 120h407v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="158.5" class="text-bold fill-N1 s0"><tspan x="211.5" dy="0">괴델이 수학을 무너뜨렸다.</tspan><tspan x="211.5" dy="18.5">수학에 모순이 있다는 뜻이다</tspan></text></g><g ><g class="shape"><path d="M423 120h399v82H423z" class="stroke-B1 fill-B5 s1"/></g><text x="622.5" y="158.5" class="text-bold fill-N1 s0"><tspan x="622.5" dy="0">가정 (다) 일관성을 빠뜨렸다.</tspan><tspan x="622.5" dy="18.5">정리는 일관성을 가정한 위에서 말한다</tspan></text></g><g ><g class="shape"><path d="M8 210h407v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="248.5" class="text-bold fill-N1 s0"><tspan x="211.5" dy="0">모든 것은 증명 불가능하다.</tspan><tspan x="211.5" dy="18.5">무엇도 확실하지 않다</tspan></text></g><g ><g class="shape"><path d="M423 210h399v82H423z" class="stroke-B1 fill-B5 s1"/></g><text x="622.5" y="248.5" class="text-bold fill-N1 s0"><tspan x="622.5" dy="0">∃ 를 ∀ 로 바꿔치기했다.</tspan><tspan x="622.5" dy="18.5">정리는 ‘그런 문장이 있다’ 고 말한다</tspan></text></g><g ><g class="shape"><path d="M8 300h407v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="338.5" class="text-bold fill-N1 s0"><tspan x="211.5" dy="0">인간은 기계보다 낫다는 것이</tspan><tspan x="211.5" dy="18.5">수학적으로 증명되었다</tspan></text></g><g ><g class="shape"><path d="M423 300h399v82H423z" class="stroke-B1 fill-B5 s1"/></g><text x="622.5" y="338.5" class="text-bold fill-N1 s0"><tspan x="622.5" dy="0">‘T 가 일관적이면’ 이라는 전건을 지웠다.</tspan><tspan x="622.5" dy="18.5">그 전건을 아는 것이 문제의 전부다</tspan></text></g><g ><g class="shape"><path d="M8 390h407v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="428.5" class="text-bold fill-N1 s0"><tspan x="211.5" dy="0">어떤 체계도 자기를 완전히 설명할 수 없다</tspan><tspan x="211.5" dy="18.5">— 법도 사회도 마음도</tspan></text></g><g ><g class="shape"><path d="M423 390h399v82H423z" class="stroke-B1 fill-B5 s1"/></g><text x="622.5" y="428.5" class="text-bold fill-N1 s0"><tspan x="622.5" dy="0">가정 (가) 를 빠뜨렸다.</tspan><tspan x="622.5" dy="18.5">산술을 담는 형식 언어에만 적용된다</tspan></text></g><marker id="mk-d2-1058398982-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1058398982-3488378134)" d="M415 481.5v116" class="connection stroke-B1 s1" mask="url(#d2-1058398982)"/><text x="415.5" y="546" style="fill:#676c7e;text-anchor:middle;font-size:16px">빠진 조각을 전부 되돌려 놓으면</text><mask id="d2-1058398982" width="1032" height="885" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H931v885H-101z"/><path d="M282 530h267v21H282z"/></mask></svg>