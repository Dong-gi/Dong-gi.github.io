<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="1272" class="d2-632262390 d2-svg" viewBox="-101 -101 1232 1272"><rect width="1232" height="1272" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-632262390 .fill-N1{fill:#0a0f25}.d2-632262390 .fill-B4{fill:#e3e9fd}.d2-632262390 .fill-B5{fill:#edf0fd}.d2-632262390 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M150 0h731v152H150z" class="stroke-B1 fill-B4 s0"/></g><text x="515.5" y="33" class="text-bold fill-N1 s1">고전 논리 — 18장까지 세운 것</text></g><text x="515" y="268" class="fill-N1 s2"><tspan x="515" dy="0">고전 논리 안에서는 셋이 서로를 낳는다 — (가) 는 진리표 두 줄로 (나) 를 주고, (나) 와 (다) 는 나머지 규칙만으로 서로 도출된다.</tspan><tspan x="515" dy="18.5">그래서 18장까지는 셋을 구분할 이유가 없었다. 구분이 필요해지는 것은 하나를 뺄 때다</tspan></text><g ><g class="shape"><path d="M95 389h840v200H95z" class="stroke-B1 fill-B4 s0"/></g><text x="515" y="422" class="text-bold fill-N1 s1">하나를 빼면 — 나머지가 따라 빠지지 않는다</text></g><g ><g class="shape"><path d="M260 730h510v340H260z" class="stroke-B1 fill-B4 s0"/></g><text x="515" y="717" class="text-bold fill-N1 s1">목록에 없던 넷째 자리 — 폭발률 ⊥E</text></g><g ><g class="shape"><path d="M158 46h275v98H158z" class="stroke-B1 fill-B5 s0"/></g><text x="295.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="295.5" dy="0">(가) 진리값은 둘</tspan><tspan x="295.5" dy="17.667">배당은 {T, F} 로 가는 함수다</tspan><tspan x="295.5" dy="17.667">6장</tspan></text></g><g ><g class="shape"><path d="M441 46h222v98H441z" class="stroke-B1 fill-B5 s0"/></g><text x="552" y="84.5" class="text-bold fill-N1 s2"><tspan x="552" dy="0">(나) 배중률</tspan><tspan x="552" dy="17.667">φ ∨ ¬φ 가 늘 성립한다</tspan><tspan x="552" dy="17.667">7·8장</tspan></text></g><g ><g class="shape"><path d="M671 46h202v98H671z" class="stroke-B1 fill-B5 s0"/></g><text x="772" y="84.5" class="text-bold fill-N1 s2"><tspan x="772" dy="0">(다) 이중부정 제거</tspan><tspan x="772" dy="17.667">¬¬φ 에서 φ 로 간다</tspan><tspan x="772" dy="17.667">7장</tspan></text></g><g ><g class="shape"><path d="M103 435h232v146H103z" class="stroke-B1 fill-B5 s0"/></g><text x="219" y="473.5" class="text-bold fill-N1 s2"><tspan x="219" dy="0">(나)(다) 를 뺀다</tspan><tspan x="219" dy="16.833">규칙으로는 IP 한 줄</tspan><tspan x="219" dy="16.833"> </tspan><tspan x="219" dy="16.833">직관주의 논리</tspan><tspan x="219" dy="16.833">남는 규칙 열여섯</tspan><tspan x="219" dy="16.833">증명이 구성적이 된다</tspan></text></g><g ><g class="shape"><path d="M343 435h309v146H343z" class="stroke-B1 fill-B5 s0"/></g><text x="497.5" y="473.5" class="text-bold fill-N1 s2"><tspan x="497.5" dy="0">(가) 를 뺀다</tspan><tspan x="497.5" dy="16.833">값을 셋 이상으로</tspan><tspan x="497.5" dy="16.833"> </tspan><tspan x="497.5" dy="16.833">다치논리</tspan><tspan x="497.5" dy="16.833">클레이니 · 루카시에비치 · 퍼지</tspan><tspan x="497.5" dy="16.833">지정값을 따로 정해야 한다</tspan></text></g><text x="793.5" y="451" class="fill-N1 s2"><tspan x="793.5" dy="0">(가) 를 뺀다고</tspan><tspan x="793.5" dy="16.833">(나) 가 따라 빠지지는 않는다</tspan><tspan x="793.5" dy="16.833"> </tspan><tspan x="793.5" dy="16.833">값이 셋인데 배중률은 타당한</tspan><tspan x="793.5" dy="16.833">체계가 실제로 있다</tspan><tspan x="793.5" dy="16.833">넷째 절의 준일관 논리가 그렇다</tspan></text><g ><g class="shape"><path d="M290 760h450v98H290z" class="stroke-B1 fill-B5 s0"/></g><text x="515" y="798.5" class="text-bold fill-N1 s2"><tspan x="515" dy="0">위의 셋과 성격이 다르다.</tspan><tspan x="515" dy="17.667">⊥E 를 빼면 고전 논리보다 약해지는 것이 아니라</tspan><tspan x="515" dy="17.667">다른 방향으로 약해진다</tspan></text></g><g ><g class="shape"><path d="M334 958h362v82H334z" class="stroke-B1 fill-B5 s0"/></g><text x="515" y="996.5" class="text-bold fill-N1 s2"><tspan x="515" dy="0">관련성 논리 · 준일관 논리</tspan><tspan x="515" dy="18.5">‘모순에서 무엇이든’ 을 문제 삼는다</tspan></text></g><marker id="mk-d2-632262390-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-632262390-3488378134)" d="M515 154v94" class="connection stroke-B1 s0" mask="url(#d2-632262390)"/><path fill="none" marker-end="url(#mk-d2-632262390-3488378134)" d="M515 291v94" class="connection stroke-B1 s0" mask="url(#d2-632262390)"/><path fill="none" marker-end="url(#mk-d2-632262390-3488378134)" d="M515 860v94" class="connection stroke-B1 s0" mask="url(#d2-632262390)"/><path fill="none" marker-end="url(#mk-d2-632262390-3488378134)" d="M515 590.5v95" class="connection stroke-B1 s0" mask="url(#d2-632262390)"/><text x="515.5" y="645" style="fill:#676c7e;text-anchor:middle;font-size:16px">가정 셋을 다 지켜도 남는 불만</text><mask id="d2-632262390" width="1232" height="1272" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1232v1272H-101z"/><path d="M390 629h251v21H390z"/></mask></svg>