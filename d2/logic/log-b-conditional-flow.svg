<svg xmlns="http://www.w3.org/2000/svg" width="996" height="910" class="d2-62776565 d2-svg" viewBox="-89 -89 996 910"><rect width="996" height="910" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-62776565 .text-bold{font-weight:700}.d2-62776565 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-62776565 .fill-N1{fill:#0a0f25}.d2-62776565 .fill-N2{fill:#676c7e}.d2-62776565 .fill-B6{fill:#f7f8fe}.d2-62776565 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="144.5" cy="283" class="shape stroke-B1 fill-B6 s0" rx="132.5" ry="65"/></g><text x="144.5" y="264.5" class="text-bold fill-N1 s1"><tspan x="144.5" dy="0">A 와 B 가 든</tspan><tspan x="144.5" dy="17.25">조건 표현</tspan><tspan x="144.5" dy="17.25">어느 쪽이</tspan><tspan x="144.5" dy="17.25">없으면 안 되는가</tspan></text></g><g ><g class="shape"><path d="M527 12h239v162H527z" class="stroke-B1 fill-B6 s0"/></g><text x="646.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="646.5" dy="0">앞의 것이 전건 — A → B</tspan><tspan x="646.5" dy="16.714"> </tspan><tspan x="646.5" dy="16.714">A 이면 B 다</tspan><tspan x="646.5" dy="16.714">A 인 한 B 다</tspan><tspan x="646.5" dy="16.714">A 하는 경우 B 다</tspan><tspan x="646.5" dy="16.714">A 이기만 하면 B 다</tspan><tspan x="646.5" dy="16.714">A 는 B 의 충분조건이다</tspan></text></g><g ><g class="shape"><path d="M527 194h242v178H527z" class="stroke-B1 fill-B6 s0"/></g><text x="648" y="232.5" class="text-bold fill-N1 s1"><tspan x="648" dy="0">앞의 것이 후건 — B → A</tspan><tspan x="648" dy="16.625"> </tspan><tspan x="648" dy="16.625">A 일 때만 B 다</tspan><tspan x="648" dy="16.625">A 이어야만 B 다</tspan><tspan x="648" dy="16.625">A 가 아니면 B 가 아니다</tspan><tspan x="648" dy="16.625">A 없이는 B 일 수 없다</tspan><tspan x="648" dy="16.625">A 는 B 의 필요조건이다</tspan><tspan x="648" dy="16.625">B 이려면 A 여야 한다</tspan></text></g><g ><g class="shape"><path d="M527 392h279v114H527z" class="stroke-B1 fill-B6 s0"/></g><text x="666.5" y="430.5" class="text-bold fill-N1 s1"><tspan x="666.5" dy="0">양쪽 다 — A ↔ B</tspan><tspan x="666.5" dy="17.25"> </tspan><tspan x="666.5" dy="17.25">A 이면 그리고 그때만 B 다</tspan><tspan x="666.5" dy="17.25">A 는 B 의 필요충분조건이다</tspan></text></g><path fill="transparent" stroke="transparent" d="M156 526h505v194H156z" class="shape s0"/><text x="397.5" y="566" class="fill-N1 s1"><tspan x="397.5" dy="0">요령: 화살표는 늘 충분조건에서 필요조건으로 간다.</tspan><tspan x="397.5" dy="17.667">표현을 외우는 대신 ‘없으면 안 되는 쪽’ 을 찾아</tspan><tspan x="397.5" dy="17.667">화살촉 자리에 놓으면 된다</tspan></text><text x="408.5" y="643" class="fill-N1 s1"><tspan x="408.5" dy="0">가장 흔한 잘못은 필요를 충분으로 뒤집어 읽는 것이다.</tspan><tspan x="408.5" dy="17.25">‘비자가 없으면 입국할 수 없다’ 는</tspan><tspan x="408.5" dy="17.25">‘비자가 있으면 입국할 수 있다’ 를 말하지 않는다.</tspan><tspan x="408.5" dy="17.25">3장의 후건 긍정 오류와 같은 뿌리다</tspan></text><marker id="mk-d2-62776565-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-62776565-3488378134)" d="m261 250.983 46-.397s10-.086 10-10.086V103s0-10 10-10h196" class="connection stroke-B1 s0" mask="url(#d2-62776565)"/><text x="317.5" y="93" class="text-italic fill-N2 s1"><tspan x="317.5" dy="0">B 가 없으면</tspan><tspan x="317.5" dy="18.5">안 된다</tspan></text><path fill="none" marker-end="url(#mk-d2-62776565-3488378134)" d="M279 283h244" class="connection stroke-B1 s0" mask="url(#d2-62776565)"/><text x="402.5" y="281" class="text-italic fill-N2 s1"><tspan x="402.5" dy="0">A 가 없으면</tspan><tspan x="402.5" dy="18.5">안 된다</tspan></text><path fill="none" marker-end="url(#mk-d2-62776565-3488378134)" d="m261 315.983 46-.397s10-.086 10 9.914V439s0 10 10 10h196" class="connection stroke-B1 s0" mask="url(#d2-62776565)"/><text x="326" y="447" class="text-italic fill-N2 s1"><tspan x="326" dy="0">서로 없으면</tspan><tspan x="326" dy="18.5">안 된다</tspan></text><mask id="d2-62776565" width="996" height="910" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h996v910H-89z"/><path d="M269 77h97v37h-97zM354 265h97v37h-97zM274 431h104v37H274z"/></mask></svg>