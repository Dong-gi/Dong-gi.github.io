<svg xmlns="http://www.w3.org/2000/svg" width="1563" height="776" class="d2-4162656522 d2-svg" viewBox="-101 -101 1563 776"><rect width="1563" height="776" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4162656522 .fill-N1{fill:#0a0f25}.d2-4162656522 .fill-N2{fill:#676c7e}.d2-4162656522 .fill-B6{fill:#f7f8fe}.d2-4162656522 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="357" cy="289.5" class="shape stroke-B1 fill-B6 s0" rx="197" ry="65.5"/></g><text x="357" y="287" class="text-bold fill-N1 s1"><tspan x="357" dy="0">A 와 B 가 든 조건 표현</tspan><tspan x="357" dy="18.5">어느 쪽이 없으면 안 되는가</tspan></text></g><g ><g class="shape"><path d="M1102 0h239v162h-239z" class="stroke-B1 fill-B6 s0"/></g><text x="1221.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1221.5" dy="0">앞의 것이 전건 — A → B</tspan><tspan x="1221.5" dy="16.714"> </tspan><tspan x="1221.5" dy="16.714">A 이면 B 다</tspan><tspan x="1221.5" dy="16.714">A 인 한 B 다</tspan><tspan x="1221.5" dy="16.714">A 하는 경우 B 다</tspan><tspan x="1221.5" dy="16.714">A 이기만 하면 B 다</tspan><tspan x="1221.5" dy="16.714">A 는 B 의 충분조건이다</tspan></text></g><g ><g class="shape"><path d="M1101 222h242v178h-242z" class="stroke-B1 fill-B6 s0"/></g><text x="1222" y="260.5" class="text-bold fill-N1 s1"><tspan x="1222" dy="0">앞의 것이 후건 — B → A</tspan><tspan x="1222" dy="16.625"> </tspan><tspan x="1222" dy="16.625">A 일 때만 B 다</tspan><tspan x="1222" dy="16.625">A 이어야만 B 다</tspan><tspan x="1222" dy="16.625">A 가 아니면 B 가 아니다</tspan><tspan x="1222" dy="16.625">A 없이는 B 일 수 없다</tspan><tspan x="1222" dy="16.625">A 는 B 의 필요조건이다</tspan><tspan x="1222" dy="16.625">B 이려면 A 여야 한다</tspan></text></g><g ><g class="shape"><path d="M1082 460h279v114h-279z" class="stroke-B1 fill-B6 s0"/></g><text x="1221.5" y="498.5" class="text-bold fill-N1 s1"><tspan x="1221.5" dy="0">양쪽 다 — A ↔ B</tspan><tspan x="1221.5" dy="17.25"> </tspan><tspan x="1221.5" dy="17.25">A 이면 그리고 그때만 B 다</tspan><tspan x="1221.5" dy="17.25">A 는 B 의 필요충분조건이다</tspan></text></g><text x="357" y="431" class="fill-N1 s1"><tspan x="357" dy="0">요령: 화살표는 늘 충분조건에서 필요조건으로 간다.</tspan><tspan x="357" dy="18.5">표현을 외우는 대신 ‘없으면 안 되는 쪽’ 을 찾아 화살촉 자리에 놓으면 된다</tspan></text><text x="357" y="528" class="fill-N1 s1"><tspan x="357" dy="0">가장 흔한 잘못은 필요를 충분으로 뒤집어 읽는 것이다.</tspan><tspan x="357" dy="17.667">‘비자가 없으면 입국할 수 없다’ 는 ‘비자가 있으면 입국할 수 있다’ 를 말하지 않는다.</tspan><tspan x="357" dy="17.667">3장의 후건 긍정 오류와 같은 뿌리다</tspan></text><marker id="mk-d2-4162656522-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4162656522-3488378134)" d="M487.866 239.28C815.6 112.8 938.8 81 1098 81" class="connection stroke-B1 s0" mask="url(#d2-4162656522)"/><text x="786.5" y="130" class="text-italic fill-N2 s1">B 가 없으면 안 된다</text><path fill="none" marker-end="url(#mk-d2-4162656522-3488378134)" d="M554.998 297.081C829 308.2 938.5 311 1096.5 311" class="connection stroke-B1 s0" mask="url(#d2-4162656522)"/><text x="826.5" y="314" class="text-italic fill-N2 s1">A 가 없으면 안 된다</text><path fill="none" marker-end="url(#mk-d2-4162656522-3488378134)" d="M480.844 341.775C814.2 481.8 934.8 517 1078 517" class="connection stroke-B1 s0" mask="url(#d2-4162656522)"/><text x="772" y="470" class="text-italic fill-N2 s1">서로 없으면 안 된다</text><mask id="d2-4162656522" width="1563" height="776" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1563v776H-101z"/><path d="M706 114h161v21H706zM746 298h161v21H746zM688 454h168v21H688z"/></mask></svg>