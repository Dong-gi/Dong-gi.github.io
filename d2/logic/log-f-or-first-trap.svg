<svg xmlns="http://www.w3.org/2000/svg" width="1387" height="680" class="d2-3564206745 d2-svg" viewBox="-101 -101 1387 680"><rect width="1387" height="680" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3564206745 .fill-N1{fill:#0a0f25}.d2-3564206745 .fill-B6{fill:#f7f8fe}.d2-3564206745 .stroke-B1,.d2-3564206745 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M447 0h217v82H447z" class="stroke-B1 fill-B6 s0"/></g><text x="555.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="555.5" dy="0">목표: ¬P ∨ ¬Q</tspan><tspan x="555.5" dy="18.5">손에 있는 것: ¬(P ∧ Q)</tspan></text></g><g ><g class="shape"><path d="M55 182h236v82H55z" class="stroke-B1 fill-B6 s0"/></g><text x="173" y="220.5" class="text-bold fill-N1 s1"><tspan x="173" dy="0">∨I 로 왼쪽을 고른다</tspan><tspan x="173" dy="18.5">먼저 ¬P 를 얻어야 한다</tspan></text></g><g ><g class="shape"><path d="M439 182h238v82H439z" class="stroke-B1 fill-B6 s0"/></g><text x="558" y="220.5" class="text-bold fill-N1 s1"><tspan x="558" dy="0">∨I 로 오른쪽을 고른다</tspan><tspan x="558" dy="18.5">먼저 ¬Q 를 얻어야 한다</tspan></text></g><g ><g class="shape"><path d="M824 182h257v82H824z" class="stroke-B1 fill-B6 s0"/></g><text x="952.5" y="220.5" class="text-bold fill-N1 s1"><tspan x="952.5" dy="0">IP — ¬(¬P ∨ ¬Q) 를 가정하고</tspan><tspan x="952.5" dy="18.5">⊥ 을 찾는다</tspan></text></g><g ><g class="shape"><path d="M0 364h346v114H0z" class="stroke-B2 fill-B6 s2"/></g><text x="173" y="402.5" class="text-bold fill-N1 s1"><tspan x="173" dy="0">막힌다</tspan><tspan x="173" dy="17.25">¬(P ∧ Q) 는 둘 중 어느 쪽이 거짓인지</tspan><tspan x="173" dy="17.25">말해 주지 않는다. P 가 거짓일 수도,</tspan><tspan x="173" dy="17.25">Q 가 거짓일 수도 있다</tspan></text></g><g ><g class="shape"><path d="M406 380h304v82H406z" class="stroke-B2 fill-B6 s2"/></g><text x="558" y="418.5" class="text-bold fill-N1 s1"><tspan x="558" dy="0">막힌다</tspan><tspan x="558" dy="18.5">같은 이유다. 고를 근거가 없다</tspan></text></g><g ><g class="shape"><path d="M770 372h365v98H770z" class="stroke-B1 fill-B6 s0"/></g><text x="952.5" y="410.5" class="text-bold fill-N1 s1"><tspan x="952.5" dy="0">풀린다</tspan><tspan x="952.5" dy="17.667">가정에서 ¬P 도 ¬Q 도 각각 ⊥ 을 부른다.</tspan><tspan x="952.5" dy="17.667">한쪽을 고를 필요가 없어졌다</tspan></text></g><text x="954.5" y="23" class="fill-N1 s1"><tspan x="954.5" dy="0">읽어낼 것 — 막힌 이유는 규칙을 잘못 쓴 것이 아니라</tspan><tspan x="954.5" dy="17.25">손에 있는 전제가 ‘둘 중 하나’ 만 말하는데</tspan><tspan x="954.5" dy="17.25">∨I 는 ‘어느 쪽’ 인지를 요구하기 때문이다.</tspan><tspan x="954.5" dy="17.25">전제가 고를 근거를 주지 않으면 ∨I 는 첫 수가 될 수 없다</tspan></text><marker id="mk-d2-3564206745-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3564206745-3488378134)" d="M445.054 67.462C227.799 119 173 142 173 178" class="connection stroke-B1 s0" mask="url(#d2-3564206745)"/><path fill="none" marker-end="url(#mk-d2-3564206745-3488378134)" d="M557.04 84c.76 38 .96 58 .96 94" class="connection stroke-B1 s0" mask="url(#d2-3564206745)"/><path fill="none" marker-end="url(#mk-d2-3564206745-3488378134)" d="M666.2 66.332C894.85 118.777 952.5 142 952.5 178" class="connection stroke-B1 s0" mask="url(#d2-3564206745)"/><path fill="none" marker-end="url(#mk-d2-3564206745-3488378134)" d="M173 266v94" class="connection stroke-B1 s0" mask="url(#d2-3564206745)"/><path fill="none" marker-end="url(#mk-d2-3564206745-3488378134)" d="M558 266v110" class="connection stroke-B1 s0" mask="url(#d2-3564206745)"/><path fill="none" marker-end="url(#mk-d2-3564206745-3488378134)" d="M952.5 266v102" class="connection stroke-B1 s0" mask="url(#d2-3564206745)"/><mask id="d2-3564206745" width="1387" height="680" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1387v680H-101z"/></mask></svg>