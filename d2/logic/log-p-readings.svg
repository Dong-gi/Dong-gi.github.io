<svg xmlns="http://www.w3.org/2000/svg" width="1162" height="1165" class="d2-661773242 d2-svg" viewBox="-101 -101 1162 1165"><rect width="1162" height="1165" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-661773242 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-661773242 .fill-N1{fill:#0a0f25}.d2-661773242 .fill-B5{fill:#edf0fd}.d2-661773242 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M0 0h960v810H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="480" y="33" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">같은 □, 같은 진리 조항 — 다른 W · R · 공리</text></g><text x="480" y="926" class="text-bold fill-N1 s0"><tspan x="480" dy="0">‘어느 것이 옳은 양상논리인가’ 는 잘못된 물음이다.</tspan><tspan x="480" dy="17.667">무엇을 읽으려는가가 R 을 정하고, R 이 공리를 정한다.</tspan><tspan x="480" dy="17.667">앞 그림의 대응표가 그 사이를 이어 주는 다리다</tspan></text><g ><g class="shape"><path d="M8 46h183v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="92.5" class="text-bold fill-N1 s0">읽기</text></g><g ><g class="shape"><path d="M199 46h219v82H199z" class="stroke-B1 fill-B5 s1"/></g><text x="308.5" y="92.5" class="text-bold fill-N1 s0">□φ 를 어떻게 읽는가</text></g><g ><g class="shape"><path d="M426 46h252v82H426z" class="stroke-B1 fill-B5 s1"/></g><text x="552" y="92.5" class="text-bold fill-N1 s0">세계 W 와 접근관계 R</text></g><g ><g class="shape"><path d="M686 46h266v82H686z" class="stroke-B1 fill-B5 s1"/></g><text x="819" y="84.5" class="text-bold fill-N1 s0"><tspan x="819" dy="0">받아들이는 공리 /</tspan><tspan x="819" dy="18.5">버리는 공리</tspan></text></g><g ><g class="shape"><path d="M8 136h183v114H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="190.5" class="text-bold fill-N1 s0"><tspan x="99.5" dy="0">알레틱</tspan><tspan x="99.5" dy="18.5">(양상 본래의 뜻)</tspan></text></g><g ><g class="shape"><path d="M199 136h219v114H199z" class="stroke-B1 fill-B5 s1"/></g><text x="308.5" y="190.5" class="text-bold fill-N1 s0"><tspan x="308.5" dy="0">필연적으로 φ</tspan><tspan x="308.5" dy="18.5">◇φ 는 φ 일 수 있다</tspan></text></g><g ><g class="shape"><path d="M426 136h252v114H426z" class="stroke-B1 fill-B5 s1"/></g><text x="552" y="174.5" class="text-bold fill-N1 s0"><tspan x="552" dy="0">W = 있을 수 있는</tspan><tspan x="552" dy="17.25">상황 전체</tspan><tspan x="552" dy="17.25">R = 저기서 보아</tspan><tspan x="552" dy="17.25">여기가 있을 법하다</tspan></text></g><g ><g class="shape"><path d="M686 136h266v114H686z" class="stroke-B1 fill-B5 s1"/></g><text x="819" y="182.5" class="text-bold fill-N1 s0"><tspan x="819" dy="0">보통 S5.</tspan><tspan x="819" dy="17.667">필연이면 실제로 그렇다 —</tspan><tspan x="819" dy="17.667">T 를 받는다</tspan></text></g><g ><g class="shape"><path d="M8 258h183v114H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="312.5" class="text-bold fill-N1 s0"><tspan x="99.5" dy="0">인식</tspan><tspan x="99.5" dy="18.5">(안다 / 모른다)</tspan></text></g><g ><g class="shape"><path d="M199 258h219v114H199z" class="stroke-B1 fill-B5 s1"/></g><text x="308.5" y="304.5" class="text-bold fill-N1 s0"><tspan x="308.5" dy="0">그 사람은 φ 를 안다</tspan><tspan x="308.5" dy="17.667">◇φ 는 φ 를</tspan><tspan x="308.5" dy="17.667">배제하지 못한다</tspan></text></g><g ><g class="shape"><path d="M426 258h252v114H426z" class="stroke-B1 fill-B5 s1"/></g><text x="552" y="296.5" class="text-bold fill-N1 s0"><tspan x="552" dy="0">W = 그 사람이</tspan><tspan x="552" dy="17.25">배제하지 못한 상황</tspan><tspan x="552" dy="17.25">R = 그 상황과 지금이</tspan><tspan x="552" dy="17.25">구별되지 않는다</tspan></text></g><g ><g class="shape"><path d="M686 258h266v114H686z" class="stroke-B1 fill-B5 s1"/></g><text x="819" y="296.5" class="text-bold fill-N1 s0"><tspan x="819" dy="0">T 는 지식의 사실성.</tspan><tspan x="819" dy="17.25">믿음으로 읽으면</tspan><tspan x="819" dy="17.25">T 를 버리고</tspan><tspan x="819" dy="17.25">그 자리에 D 를 둔다</tspan></text></g><g ><g class="shape"><path d="M8 380h183v130H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="442.5" class="text-bold fill-N1 s0"><tspan x="99.5" dy="0">의무</tspan><tspan x="99.5" dy="18.5">(해야 / 해도)</tspan></text></g><g ><g class="shape"><path d="M199 380h219v130H199z" class="stroke-B1 fill-B5 s1"/></g><text x="308.5" y="442.5" class="text-bold fill-N1 s0"><tspan x="308.5" dy="0">φ 해야 한다</tspan><tspan x="308.5" dy="18.5">◇φ 는 φ 해도 된다</tspan></text></g><g ><g class="shape"><path d="M426 380h252v130H426z" class="stroke-B1 fill-B5 s1"/></g><text x="552" y="434.5" class="text-bold fill-N1 s0"><tspan x="552" dy="0">W = 규범이 지켜진 상황</tspan><tspan x="552" dy="17.667">R = 저 상황은</tspan><tspan x="552" dy="17.667">여기서 보아 이상적이다</tspan></text></g><g ><g class="shape"><path d="M686 380h266v130H686z" class="stroke-B1 fill-B5 s1"/></g><text x="819" y="418.5" class="text-bold fill-N1 s0"><tspan x="819" dy="0">T 를 반드시 버린다 —</tspan><tspan x="819" dy="17">해야 한다고</tspan><tspan x="819" dy="17">그런 것은 아니다.</tspan><tspan x="819" dy="17">대신 D: 의무는</tspan><tspan x="819" dy="17">서로 모순되지 않는다</tspan></text></g><g ><g class="shape"><path d="M8 518h183v114H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="572.5" class="text-bold fill-N1 s0"><tspan x="99.5" dy="0">시제</tspan><tspan x="99.5" dy="18.5">(항상 / 언젠가)</tspan></text></g><g ><g class="shape"><path d="M199 518h219v114H199z" class="stroke-B1 fill-B5 s1"/></g><text x="308.5" y="572.5" class="text-bold fill-N1 s0"><tspan x="308.5" dy="0">앞으로 늘 φ 다</tspan><tspan x="308.5" dy="18.5">◇φ 는 언젠가 φ 다</tspan></text></g><g ><g class="shape"><path d="M426 518h252v114H426z" class="stroke-B1 fill-B5 s1"/></g><text x="552" y="572.5" class="text-bold fill-N1 s0"><tspan x="552" dy="0">W = 시각</tspan><tspan x="552" dy="18.5">R = 나중이다</tspan></text></g><g ><g class="shape"><path d="M686 518h266v114H686z" class="stroke-B1 fill-B5 s1"/></g><text x="819" y="556.5" class="text-bold fill-N1 s0"><tspan x="819" dy="0">4 를 받는다 —</tspan><tspan x="819" dy="17.25">나중의 나중은 나중이다.</tspan><tspan x="819" dy="17.25">T 는 ‘지금 포함’ 으로</tspan><tspan x="819" dy="17.25">읽을 때만</tspan></text></g><g ><g class="shape"><path d="M8 640h183v162H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="718.5" class="text-bold fill-N1 s0"><tspan x="99.5" dy="0">증명 가능성</tspan><tspan x="99.5" dy="18.5">(17장의 다리)</tspan></text></g><g ><g class="shape"><path d="M199 640h219v162H199z" class="stroke-B1 fill-B5 s1"/></g><text x="308.5" y="718.5" class="text-bold fill-N1 s0"><tspan x="308.5" dy="0">T 에서 φ 가 증명된다</tspan><tspan x="308.5" dy="18.5">= Prov(⌜φ⌝)</tspan></text></g><g ><g class="shape"><path d="M426 640h252v162H426z" class="stroke-B1 fill-B5 s1"/></g><text x="552" y="702.5" class="text-bold fill-N1 s0"><tspan x="552" dy="0">W = 이론의 세계들</tspan><tspan x="552" dy="17.25">R = 추이적이고</tspan><tspan x="552" dy="17.25">끝없이 이어지는</tspan><tspan x="552" dy="17.25">길이 없다</tspan></text></g><g ><g class="shape"><path d="M686 640h266v162H686z" class="stroke-B1 fill-B5 s1"/></g><text x="819" y="678.5" class="text-bold fill-N1 s0"><tspan x="819" dy="0">T 를 버린다 —</tspan><tspan x="819" dy="16.714">증명 가능하다고</tspan><tspan x="819" dy="16.714">참인 것을 T 가</tspan><tspan x="819" dy="16.714">증명하지는 못한다.</tspan><tspan x="819" dy="16.714">대신 뢰브 공리</tspan><tspan x="819" dy="16.714">□(□φ → φ) → □φ.</tspan><tspan x="819" dy="16.714">이 체계를 GL 이라 한다</tspan></text></g><marker id="mk-d2-661773242-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-661773242-3488378134)" d="M480 812v94" class="connection stroke-B1 s1" mask="url(#d2-661773242)"/><mask id="d2-661773242" width="1162" height="1165" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1162v1165H-101z"/></mask></svg>