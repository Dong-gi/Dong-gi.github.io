<svg xmlns="http://www.w3.org/2000/svg" width="1663" height="925" class="d2-3226370625 d2-svg" viewBox="-101 -101 1663 925"><rect width="1663" height="925" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3226370625 .fill-N1{fill:#0a0f25}.d2-3226370625 .fill-B5{fill:#edf0fd}.d2-3226370625 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M0 0h1461v570H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="730.5" y="33" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">같은 □, 같은 진리 조항 — 다른 W · R · 공리</text></g><text x="731" y="686" class="text-bold fill-N1 s0"><tspan x="731" dy="0">‘어느 것이 옳은 양상논리인가’ 는 잘못된 물음이다.</tspan><tspan x="731" dy="17.667">무엇을 읽으려는가가 R 을 정하고, R 이 공리를 정한다.</tspan><tspan x="731" dy="17.667">앞 그림의 대응표가 그 사이를 이어 주는 다리다</tspan></text><g ><g class="shape"><path d="M8 46h183v66H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="84.5" class="text-bold fill-N1 s0">읽기</text></g><g ><g class="shape"><path d="M199 46h275v66H199z" class="stroke-B1 fill-B5 s1"/></g><text x="336.5" y="84.5" class="text-bold fill-N1 s0">□φ 를 어떻게 읽는가</text></g><g ><g class="shape"><path d="M482 46h364v66H482z" class="stroke-B1 fill-B5 s1"/></g><text x="664" y="84.5" class="text-bold fill-N1 s0">세계 W 와 접근관계 R</text></g><g ><g class="shape"><path d="M854 46h599v66H854z" class="stroke-B1 fill-B5 s1"/></g><text x="1153.5" y="84.5" class="text-bold fill-N1 s0">받아들이는 공리 / 버리는 공리</text></g><g ><g class="shape"><path d="M8 120h183v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="158.5" class="text-bold fill-N1 s0"><tspan x="99.5" dy="0">알레틱</tspan><tspan x="99.5" dy="18.5">(양상 본래의 뜻)</tspan></text></g><g ><g class="shape"><path d="M199 120h275v82H199z" class="stroke-B1 fill-B5 s1"/></g><text x="336.5" y="158.5" class="text-bold fill-N1 s0"><tspan x="336.5" dy="0">필연적으로 φ</tspan><tspan x="336.5" dy="18.5">◇φ 는 φ 일 수 있다</tspan></text></g><g ><g class="shape"><path d="M482 120h364v82H482z" class="stroke-B1 fill-B5 s1"/></g><text x="664" y="158.5" class="text-bold fill-N1 s0"><tspan x="664" dy="0">W = 있을 수 있는 상황 전체</tspan><tspan x="664" dy="18.5">R = 저기서 보아 여기가 있을 법하다</tspan></text></g><g ><g class="shape"><path d="M854 120h599v82H854z" class="stroke-B1 fill-B5 s1"/></g><text x="1153.5" y="158.5" class="text-bold fill-N1 s0"><tspan x="1153.5" dy="0">보통 S5.</tspan><tspan x="1153.5" dy="18.5">필연이면 실제로 그렇다 — T 를 받는다</tspan></text></g><g ><g class="shape"><path d="M8 210h183v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="248.5" class="text-bold fill-N1 s0"><tspan x="99.5" dy="0">인식</tspan><tspan x="99.5" dy="18.5">(안다 / 모른다)</tspan></text></g><g ><g class="shape"><path d="M199 210h275v82H199z" class="stroke-B1 fill-B5 s1"/></g><text x="336.5" y="248.5" class="text-bold fill-N1 s0"><tspan x="336.5" dy="0">그 사람은 φ 를 안다</tspan><tspan x="336.5" dy="18.5">◇φ 는 φ 를 배제하지 못한다</tspan></text></g><g ><g class="shape"><path d="M482 210h364v82H482z" class="stroke-B1 fill-B5 s1"/></g><text x="664" y="248.5" class="text-bold fill-N1 s0"><tspan x="664" dy="0">W = 그 사람이 배제하지 못한 상황</tspan><tspan x="664" dy="18.5">R = 그 상황과 지금이 구별되지 않는다</tspan></text></g><g ><g class="shape"><path d="M854 210h599v82H854z" class="stroke-B1 fill-B5 s1"/></g><text x="1153.5" y="248.5" class="text-bold fill-N1 s0"><tspan x="1153.5" dy="0">T 는 지식의 사실성.</tspan><tspan x="1153.5" dy="18.5">믿음으로 읽으면 T 를 버리고 D 만 남긴다</tspan></text></g><g ><g class="shape"><path d="M8 300h183v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="338.5" class="text-bold fill-N1 s0"><tspan x="99.5" dy="0">의무</tspan><tspan x="99.5" dy="18.5">(해야 / 해도)</tspan></text></g><g ><g class="shape"><path d="M199 300h275v82H199z" class="stroke-B1 fill-B5 s1"/></g><text x="336.5" y="338.5" class="text-bold fill-N1 s0"><tspan x="336.5" dy="0">φ 해야 한다</tspan><tspan x="336.5" dy="18.5">◇φ 는 φ 해도 된다</tspan></text></g><g ><g class="shape"><path d="M482 300h364v82H482z" class="stroke-B1 fill-B5 s1"/></g><text x="664" y="338.5" class="text-bold fill-N1 s0"><tspan x="664" dy="0">W = 규범이 지켜진 상황</tspan><tspan x="664" dy="18.5">R = 저 상황은 여기서 보아 이상적이다</tspan></text></g><g ><g class="shape"><path d="M854 300h599v82H854z" class="stroke-B1 fill-B5 s1"/></g><text x="1153.5" y="338.5" class="text-bold fill-N1 s0"><tspan x="1153.5" dy="0">T 를 반드시 버린다 — 해야 한다고 그런 것은 아니다.</tspan><tspan x="1153.5" dy="18.5">대신 D: 의무는 서로 모순되지 않는다</tspan></text></g><g ><g class="shape"><path d="M8 390h183v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="428.5" class="text-bold fill-N1 s0"><tspan x="99.5" dy="0">시제</tspan><tspan x="99.5" dy="18.5">(항상 / 언젠가)</tspan></text></g><g ><g class="shape"><path d="M199 390h275v82H199z" class="stroke-B1 fill-B5 s1"/></g><text x="336.5" y="428.5" class="text-bold fill-N1 s0"><tspan x="336.5" dy="0">앞으로 늘 φ 다</tspan><tspan x="336.5" dy="18.5">◇φ 는 언젠가 φ 다</tspan></text></g><g ><g class="shape"><path d="M482 390h364v82H482z" class="stroke-B1 fill-B5 s1"/></g><text x="664" y="428.5" class="text-bold fill-N1 s0"><tspan x="664" dy="0">W = 시각</tspan><tspan x="664" dy="18.5">R = 나중이다</tspan></text></g><g ><g class="shape"><path d="M854 390h599v82H854z" class="stroke-B1 fill-B5 s1"/></g><text x="1153.5" y="428.5" class="text-bold fill-N1 s0"><tspan x="1153.5" dy="0">4 를 받는다 — 나중의 나중은 나중이다.</tspan><tspan x="1153.5" dy="18.5">T 는 ‘지금 포함’ 으로 읽을 때만</tspan></text></g><g ><g class="shape"><path d="M8 480h183v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="99.5" y="518.5" class="text-bold fill-N1 s0"><tspan x="99.5" dy="0">증명 가능성</tspan><tspan x="99.5" dy="18.5">(17장의 다리)</tspan></text></g><g ><g class="shape"><path d="M199 480h275v82H199z" class="stroke-B1 fill-B5 s1"/></g><text x="336.5" y="518.5" class="text-bold fill-N1 s0"><tspan x="336.5" dy="0">T 에서 φ 가 증명된다</tspan><tspan x="336.5" dy="18.5">= Prov(⌜φ⌝)</tspan></text></g><g ><g class="shape"><path d="M482 480h364v82H482z" class="stroke-B1 fill-B5 s1"/></g><text x="664" y="518.5" class="text-bold fill-N1 s0"><tspan x="664" dy="0">W = 이론의 세계들</tspan><tspan x="664" dy="18.5">R = 증명력이 한 단계 줄어드는 방향</tspan></text></g><g ><g class="shape"><path d="M854 480h599v82H854z" class="stroke-B1 fill-B5 s1"/></g><text x="1153.5" y="518.5" class="text-bold fill-N1 s0"><tspan x="1153.5" dy="0">T 를 버린다 — 증명 가능하다고 참인 것을 T 가 증명하지는 못한다.</tspan><tspan x="1153.5" dy="18.5">대신 뢰브 공리 □(□φ → φ) → □φ. 이 체계를 GL 이라 한다</tspan></text></g><marker id="mk-d2-3226370625-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3226370625-3488378134)" d="M730.5 572v94" class="connection stroke-B1 s1" mask="url(#d2-3226370625)"/><mask id="d2-3226370625" width="1663" height="925" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1663v925H-101z"/></mask></svg>