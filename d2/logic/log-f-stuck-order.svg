<svg xmlns="http://www.w3.org/2000/svg" width="1007" height="1515" class="d2-1064509837 d2-svg" viewBox="-101 -101 1007 1515"><rect width="1007" height="1515" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1064509837 .text-bold{font-weight:700}.d2-1064509837 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1064509837 .fill-N1{fill:#0a0f25}.d2-1064509837 .fill-N2{fill:#676c7e}.d2-1064509837 .fill-B6{fill:#f7f8fe}.d2-1064509837 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="515.5" cy="75" class="shape stroke-B1 fill-B6 s0" rx="225.5" ry="75"/></g><text x="515.5" y="72.5" class="text-bold fill-N1 s1"><tspan x="515.5" dy="0">막혔다 —</tspan><tspan x="515.5" dy="18.5">다음 줄에 무엇을 쓸지 모르겠다</tspan></text></g><g ><g class="shape"><path d="M349 250h333v98H349z" class="stroke-B1 fill-B6 s0"/></g><text x="515.5" y="288.5" class="text-bold fill-N1 s1"><tspan x="515.5" dy="0">1. 목표에 주연결자가 남아 있는가</tspan><tspan x="515.5" dy="17.667">남아 있으면 그 도입 규칙으로</tspan><tspan x="515.5" dy="17.667">목표를 더 쪼갠다</tspan></text></g><g ><g class="shape"><path d="M213 469h377v98H213z" class="stroke-B1 fill-B6 s0"/></g><text x="401.5" y="507.5" class="text-bold fill-N1 s1"><tspan x="401.5" dy="0">2. 전제에서 공짜로 꺼낼 것이 남았는가</tspan><tspan x="401.5" dy="17.667">∧E 와 ↔E 는 언제나 안전하다.</tspan><tspan x="401.5" dy="17.667">¬¬ 는 벗겨 둔다</tspan></text></g><g ><g class="shape"><path d="M129 688h337v82H129z" class="stroke-B1 fill-B6 s0"/></g><text x="297.5" y="726.5" class="text-bold fill-N1 s1"><tspan x="297.5" dy="0">3. 전제 가운데 → 나 ↔ 의 앞부분을</tspan><tspan x="297.5" dy="18.5">이미 손에 쥐고 있는가 — 있으면 →E</tspan></text></g><g ><g class="shape"><path d="M25 891h323v98H25z" class="stroke-B1 fill-B6 s0"/></g><text x="186.5" y="929.5" class="text-bold fill-N1 s1"><tspan x="186.5" dy="0">4. 전제에 ∨ 가 있는가</tspan><tspan x="186.5" dy="17.667">있으면 ∨E 로 경우를 나눈다.</tspan><tspan x="186.5" dy="17.667">두 갈래 모두 지금 목표를 향한다</tspan></text></g><g ><g class="shape"><path d="M0 1118h314v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="157" y="1156.5" class="text-bold fill-N1 s1"><tspan x="157" dy="0">5. IP</tspan><tspan x="157" dy="18.5">¬(목표) 를 가정하고 ⊥ 을 찾는다</tspan></text></g><g ><g class="shape"><ellipse cx="658" cy="1159" class="shape stroke-B1 fill-B6 s0" rx="147" ry="49"/></g><text x="658" y="1156.5" class="text-bold fill-N1 s1"><tspan x="658" dy="0">한 걸음 나아갔다 —</tspan><tspan x="658" dy="18.5">처음으로 돌아간다</tspan></text></g><text x="402.5" y="1244" class="fill-N1 s1"><tspan x="402.5" dy="0">IP 가 마지막인 이유 — 앞의 네 수는</tspan><tspan x="402.5" dy="17">목표를 그대로 두거나 작게 만든다.</tspan><tspan x="402.5" dy="17">IP 는 가정 하나를 얹고 목표를 ⊥ 으로 바꿀 뿐이라</tspan><tspan x="402.5" dy="17">무엇과 무엇을 부딪쳐야 하는지는</tspan><tspan x="402.5" dy="17">여전히 스스로 찾아야 한다</tspan></text><marker id="mk-d2-1064509837-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1064509837-3488378134)" d="M515.98 152c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-1064509837)"/><path fill="none" marker-end="url(#mk-d2-1064509837-3488378134)" d="M462.813 348.891C413.85 396.3 401.25 420.7 401.25 465.5" class="connection stroke-B1 s0" mask="url(#d2-1064509837)"/><text x="412.5" y="405" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-1064509837-3488378134)" d="M353.622 567.95C308.6 615.3 297 639.7 297 684.5" class="connection stroke-B1 s0" mask="url(#d2-1064509837)"/><text x="306.5" y="625" class="text-italic fill-N2 s1">다 꺼냈다</text><path fill="none" marker-end="url(#mk-d2-1064509837-3488378134)" d="M251.031 770.857C199.7 818.3 186.5 842.7 186.5 887.5" class="connection stroke-B1 s0" mask="url(#d2-1064509837)"/><text x="198.5" y="826" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-1064509837-3488378134)" d="M172.493 990.435C160.2 1037.3 157 1063.3 157 1114.5" class="connection stroke-B1 s0" mask="url(#d2-1064509837)"/><text x="158.5" y="1058" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-1064509837-3488378134)" d="M616.789 348.394C712.6 396.3 737 430.4 737 463.25v422c0 32.85-9 176.55-42.638 222.522" class="connection stroke-B1 s0" mask="url(#d2-1064509837)"/><text x="737.5" y="707" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-1064509837-3488378134)" d="M493.753 567.463C580.8 615.3 603 647.8 603 678.25v207c0 32.85 6 176.55 28.246 222.155" class="connection stroke-B1 s0" mask="url(#d2-1064509837)"/><text x="603.5" y="817" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-1064509837-3488378134)" d="M372.741 770.484C457.4 818.3 479 852.4 479 885.25s21.4 177.55 103.603 228.639" class="connection stroke-B1 s0" mask="url(#d2-1064509837)"/><text x="482.5" y="944" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-1064509837-3488378134)" d="M260.406 989.622c70.344 47.678 129.794 74.778 291.83 133.025" class="connection stroke-B1 s0" mask="url(#d2-1064509837)"/><text x="401.5" y="1074" class="text-italic fill-N2 s1">있다</text><mask id="d2-1064509837" width="1007" height="1515" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H906v1515H-101z"/><path d="M391 389h43v21h-43zM264 609h85v21h-85zM177 810h43v21h-43zM137 1042h43v21h-43zM716 691h43v21h-43zM582 801h43v21h-43zM461 928h43v21h-43zM380 1058h43v21h-43z"/></mask></svg>