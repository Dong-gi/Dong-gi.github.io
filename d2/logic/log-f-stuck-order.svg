<svg xmlns="http://www.w3.org/2000/svg" width="1737" height="1476" class="d2-2790879021 d2-svg" viewBox="-101 -101 1737 1476"><rect width="1737" height="1476" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2790879021 .fill-N1{fill:#0a0f25}.d2-2790879021 .fill-N2{fill:#676c7e}.d2-2790879021 .fill-B6{fill:#f7f8fe}.d2-2790879021 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="682" cy="93.5" class="shape stroke-B1 fill-B6 s0" rx="281" ry="93.5"/></g><text x="682" y="99" class="text-bold fill-N1 s1">막혔다 — 다음 줄에 무엇을 쓸지 모르겠다</text></g><g ><g class="shape"><path d="M457 287h450v82H457z" class="stroke-B1 fill-B6 s0"/></g><text x="682" y="325.5" class="text-bold fill-N1 s1"><tspan x="682" dy="0">1. 목표에 주연결자가 남아 있는가</tspan><tspan x="682" dy="18.5">남아 있으면 그 도입 규칙으로 목표를 더 쪼갠다</tspan></text></g><g ><g class="shape"><path d="M349 490h417v82H349z" class="stroke-B1 fill-B6 s0"/></g><text x="557.5" y="528.5" class="text-bold fill-N1 s1"><tspan x="557.5" dy="0">2. 전제에서 공짜로 꺼낼 것이 남았는가</tspan><tspan x="557.5" dy="18.5">∧E 와 ↔E 는 언제나 안전하다. ¬¬ 는 벗겨 둔다</tspan></text></g><g ><g class="shape"><path d="M285 693h337v82H285z" class="stroke-B1 fill-B6 s0"/></g><text x="453.5" y="731.5" class="text-bold fill-N1 s1"><tspan x="453.5" dy="0">3. 전제 가운데 → 나 ↔ 의 앞부분을</tspan><tspan x="453.5" dy="18.5">이미 손에 쥐고 있는가 — 있으면 →E</tspan></text></g><g ><g class="shape"><path d="M0 896h565v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="282.5" y="934.5" class="text-bold fill-N1 s1"><tspan x="282.5" dy="0">4. 전제에 ∨ 가 있는가</tspan><tspan x="282.5" dy="18.5">있으면 ∨E 로 경우를 나눈다. 두 갈래 모두 지금 목표를 향한다</tspan></text></g><g ><g class="shape"><path d="M96 1146h314v82H96z" class="stroke-B1 fill-B6 s0"/></g><text x="253" y="1184.5" class="text-bold fill-N1 s1"><tspan x="253" dy="0">5. IP</tspan><tspan x="253" dy="18.5">¬(목표) 를 가정하고 ⊥ 을 찾는다</tspan></text></g><g ><g class="shape"><ellipse cx="921.5" cy="1186.5" class="shape stroke-B1 fill-B6 s0" rx="262.5" ry="87.5"/></g><text x="921.5" y="1192" class="text-bold fill-N1 s1">목표가 작아졌다 — 처음으로 돌아간다</text></g><text x="1279" y="83" class="fill-N1 s1"><tspan x="1279" dy="0">IP 가 마지막인 이유 — 앞의 네 수는 목표를 작게 만든다.</tspan><tspan x="1279" dy="17.667">IP 는 가정 하나를 얹고 목표를 ⊥ 으로 바꿀 뿐이라</tspan><tspan x="1279" dy="17.667">무엇과 무엇을 부딪쳐야 하는지는 여전히 스스로 찾아야 한다</tspan></text><marker id="mk-d2-2790879021-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2790879021-3488378134)" d="M682 189v94" class="connection stroke-B1 s0" mask="url(#d2-2790879021)"/><path fill="none" marker-end="url(#mk-d2-2790879021-3488378134)" d="M630.207 369.772C572.55 417.3 557.75 441.7 557.75 486.5" class="connection stroke-B1 s0" mask="url(#d2-2790879021)"/><text x="572.5" y="423" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-2790879021-3488378134)" d="M514.074 572.903C465.9 620.3 453.5 644.7 453.5 689.5" class="connection stroke-B1 s0" mask="url(#d2-2790879021)"/><text x="464.5" y="629" class="text-italic fill-N2 s1">다 꺼냈다</text><path fill="none" marker-end="url(#mk-d2-2790879021-3488378134)" d="M382.784 775.527C302.9 823.3 282.5 847.7 282.5 892.5" class="connection stroke-B1 s0" mask="url(#d2-2790879021)"/><text x="309.5" y="825" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-2790879021-3488378134)" d="M270.434 979.418C256.6 1026.3 253 1059.9 253 1141.5" class="connection stroke-B1 s0" mask="url(#d2-2790879021)"/><text x="253.5" y="1066" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-2790879021-3488378134)" d="M797.127 369.19C928.05 417.3 961.25 449.8 961.25 480.25v406c0 30.45-3.25 164.35-15.212 208.887" class="connection stroke-B1 s0" mask="url(#d2-2790879021)"/><text x="961.5" y="687" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-2790879021-3488378134)" d="M664.111 572.232C786.25 620.3 817.25 652.8 817.25 683.25v203c0 30.45 8.95 164.75 42.421 211.498" class="connection stroke-B1 s0" mask="url(#d2-2790879021)"/><text x="817.5" y="799" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-2790879021-3488378134)" d="M552.09 775.285C664.65 823.3 693.25 855.8 693.25 886.25s21.35 166.35 103.412 220.546" class="connection stroke-B1 s0" mask="url(#d2-2790879021)"/><text x="694.5" y="928" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-2790879021-3488378134)" d="M373.313 978.344C476.3 1026.3 549.8 1055.4 735.233 1121.654" class="connection stroke-B1 s0" mask="url(#d2-2790879021)"/><text x="552.5" y="1062" class="text-italic fill-N2 s1">있다</text><mask id="d2-2790879021" width="1737" height="1476" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1737v1476H-101z"/><path d="M551 407h43v21h-43zM422 613h85v21h-85zM288 809h43v21h-43zM232 1050h43v21h-43zM940 671h43v21h-43zM796 783h43v21h-43zM673 912h43v21h-43zM531 1046h43v21h-43z"/></mask></svg>