<svg xmlns="http://www.w3.org/2000/svg" width="1524" height="693" class="d2-526579389 d2-svg" viewBox="-101 -101 1524 693"><rect width="1524" height="693" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-526579389 .fill-N1{fill:#0a0f25}.d2-526579389 .fill-N2{fill:#676c7e}.d2-526579389 .fill-B6{fill:#f7f8fe}.d2-526579389 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 2h128v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="64" y="40.5" class="text-bold fill-N1 s1"><tspan x="64" dy="0">① P</tspan><tspan x="64" dy="18.5">기저 조항</tspan></text></g><g ><g class="shape"><path d="M188 2h128v82H188z" class="stroke-B1 fill-B6 s0"/></g><text x="252" y="40.5" class="text-bold fill-N1 s1"><tspan x="252" dy="0">② Q</tspan><tspan x="252" dy="18.5">기저 조항</tspan></text></g><g ><g class="shape"><path d="M389 2h128v82H389z" class="stroke-B1 fill-B6 s0"/></g><text x="453" y="40.5" class="text-bold fill-N1 s1"><tspan x="453" dy="0">③ R</tspan><tspan x="453" dy="18.5">기저 조항</tspan></text></g><g ><g class="shape"><path d="M71 206h174v82H71z" class="stroke-B1 fill-B6 s0"/></g><text x="158" y="244.5" class="text-bold fill-N1 s1"><tspan x="158" dy="0">④ (P ∧ Q)</tspan><tspan x="158" dy="18.5">① 과 ② 에 ∧ 조항</tspan></text></g><g ><g class="shape"><path d="M386 206h133v82H386z" class="stroke-B1 fill-B6 s0"/></g><text x="452.5" y="244.5" class="text-bold fill-N1 s1"><tspan x="452.5" dy="0">⑤ ¬R</tspan><tspan x="452.5" dy="18.5">③ 에 ¬ 조항</tspan></text></g><g ><g class="shape"><path d="M178 409h174v82H178z" class="stroke-B1 fill-B6 s0"/></g><text x="265" y="447.5" class="text-bold fill-N1 s1"><tspan x="265" dy="0">⑥ ((P ∧ Q) → ¬R)</tspan><tspan x="265" dy="18.5">④ 와 ⑤ 에 → 조항</tspan></text></g><text x="741.5" y="16" class="fill-N1 s1"><tspan x="741.5" dy="0">적형식임을 보이는 방법은 하나다 —</tspan><tspan x="741.5" dy="17">기저에서 출발해 조항을 유한 번 적용한</tspan><tspan x="741.5" dy="17">목록을 내놓는 것이다. 목록의 각 줄은</tspan><tspan x="741.5" dy="17">문장문자이거나, 위쪽 줄들을 재료로</tspan><tspan x="741.5" dy="17">조항 하나를 쓴 결과여야 한다</tspan></text><text x="1144" y="16" class="fill-N1 s1"><tspan x="1144" dy="0">괄호가 붙는 자리를 보라. ④ 와 ⑥ 은</tspan><tspan x="1144" dy="17">이항 조항이 만들었으므로 바깥에 괄호가</tspan><tspan x="1144" dy="17">한 쌍 있고, ⑤ 는 ¬ 조항이 만들었으므로</tspan><tspan x="1144" dy="17">없다. 폐포 조항은 이런 목록을 가진 것만이</tspan><tspan x="1144" dy="17">적형식이라고 말한다 — 배제의 근거다</tspan></text><marker id="mk-d2-526579389-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-526579389-3488378134)" d="M64 86.5c0 46.8 11.2 71.2 53.295 117.053" class="connection stroke-B1 s0" mask="url(#d2-526579389)"/><text x="73.5" y="159" class="text-italic fill-N2 s1">왼쪽 재료</text><path fill="none" marker-end="url(#mk-d2-526579389-3488378134)" d="M252 86.5c0 46.8-11.2 71.2-53.295 117.053" class="connection stroke-B1 s0" mask="url(#d2-526579389)"/><text x="243" y="159" class="text-italic fill-N2 s1">오른쪽 재료</text><path fill="none" marker-end="url(#mk-d2-526579389-3488378134)" d="M452.75 86.5v116" class="connection stroke-B1 s0" mask="url(#d2-526579389)"/><text x="453" y="151" class="text-italic fill-N2 s1">유일한 재료</text><path fill="none" marker-end="url(#mk-d2-526579389-3488378134)" d="M158 289.5c0 46.8 12.6 71.2 60.126 117.218" class="connection stroke-B1 s0" mask="url(#d2-526579389)"/><text x="169.5" y="363" class="text-italic fill-N2 s1">왼쪽 재료</text><path fill="none" marker-end="url(#mk-d2-526579389-3488378134)" d="M452.75 289.5c0 46.8-22.2 71.2-107.494 118.074" class="connection stroke-B1 s0" mask="url(#d2-526579389)"/><text x="422" y="371" class="text-italic fill-N2 s1">오른쪽 재료</text><mask id="d2-526579389" width="1524" height="693" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1524v693H-101z"/><path d="M31 143h85v21H31zM191 143h104v21H191zM401 135h104v21H401zM127 347h85v21h-85zM370 355h104v21H370z"/></mask></svg>