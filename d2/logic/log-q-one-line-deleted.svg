<svg xmlns="http://www.w3.org/2000/svg" width="1286" height="1137" class="d2-1525622487 d2-svg" viewBox="-101 -101 1286 1137"><rect width="1286" height="1137" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1525622487 .fill-N1{fill:#0a0f25}.d2-1525622487 .fill-B4{fill:#e3e9fd}.d2-1525622487 .fill-B5{fill:#edf0fd}.d2-1525622487 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h1084v294H0z" class="stroke-B1 fill-B4 s0"/></g><text x="542" y="33" class="text-bold fill-N1 s1">직관주의 논리 — 열여섯 줄이 그대로 남는다 (동일성 규칙 둘은 따로 센다)</text></g><g ><g class="shape"><path d="M188 415h709v170H188z" class="stroke-B1 fill-B4 s0"/></g><text x="542.5" y="448" class="text-bold fill-N1 s1">지우는 규칙 — 한 줄</text></g><g ><g class="shape"><path d="M181 685h722v250H181z" class="stroke-B1 fill-B4 s0"/></g><text x="542" y="718" class="text-bold fill-N1 s1">지운 결과 — 거래다</text></g><g ><g class="shape"><path d="M193 46h91v66h-91z" class="stroke-B1 fill-B5 s0"/></g><text x="238.5" y="84.5" class="text-bold fill-N1 s2">∧I / ∧E</text></g><g ><g class="shape"><path d="M290 46h322v66H290z" class="stroke-B1 fill-B5 s0"/></g><text x="451" y="84.5" class="text-bold fill-N1 s2">∨I / ∨E</text></g><g ><g class="shape"><path d="M618 46h272v66H618z" class="stroke-B1 fill-B5 s0"/></g><text x="754" y="84.5" class="text-bold fill-N1 s2">→I / →E</text></g><g ><g class="shape"><path d="M193 118h91v82h-91z" class="stroke-B1 fill-B5 s0"/></g><text x="238.5" y="164.5" class="text-bold fill-N1 s2">↔I / ↔E</text></g><g ><g class="shape"><path d="M290 118h322v82H290z" class="stroke-B1 fill-B5 s0"/></g><text x="451" y="156.5" class="text-bold fill-N1 s2"><tspan x="451" dy="0">¬I / ¬E</tspan><tspan x="451" dy="18.5">가정 아래 ⊥ 를 얻어 ¬φ 를 적는 쪽</tspan></text></g><g ><g class="shape"><path d="M618 118h272v82H618z" class="stroke-B1 fill-B5 s0"/></g><text x="754" y="156.5" class="text-bold fill-N1 s2"><tspan x="754" dy="0">⊥E 폭발률</tspan><tspan x="754" dy="18.5">직관주의는 이것을 지킨다</tspan></text></g><g ><g class="shape"><path d="M193 206h91v82h-91z" class="stroke-B1 fill-B5 s0"/></g><text x="238.5" y="252.5" class="text-bold fill-N1 s2">∀I / ∀E</text></g><g ><g class="shape"><path d="M290 206h322v82H290z" class="stroke-B1 fill-B5 s0"/></g><text x="451" y="244.5" class="text-bold fill-N1 s2"><tspan x="451" dy="0">∃I / ∃E</tspan><tspan x="451" dy="18.5">변수 조건도 그대로</tspan></text></g><g ><g class="shape"><path d="M618 206h272v82H618z" class="stroke-B1 fill-B5 s0"/></g><text x="754" y="252.5" class="text-bold fill-N1 s2">=I / =E · R 반복</text></g><g ><g class="shape"><path d="M198 461h267v114H198z" class="fill-B5" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:8,7.892511"/></g><text x="331.5" y="515.5" class="text-bold fill-N1 s2"><tspan x="331.5" dy="0">IP 간접증명</tspan><tspan x="331.5" dy="18.5">¬φ 를 가정해 ⊥ 를 얻으면 φ</tspan></text></g><g ><g class="shape"><path d="M475 461h412v114H475z" class="stroke-B1 fill-B5 s0"/></g><text x="681" y="499.5" class="text-bold fill-N1 s2"><tspan x="681" dy="0">위 표의 어느 칸에도 들어가지 않는다.</tspan><tspan x="681" dy="17.25">어느 연결자의 도입도 제거도 아니다.</tspan><tspan x="681" dy="17.25">IP 가 말하는 것은 연결자의 뜻이 아니라</tspan><tspan x="681" dy="17.25">‘참과 거짓 말고 다른 것은 없다’ 는 태도다</tspan></text></g><g ><g class="shape"><path d="M191 731h316v194H191z" class="stroke-B1 fill-B5 s0"/></g><text x="349" y="769.5" class="text-bold fill-N1 s2"><tspan x="349" dy="0">잃는 것</tspan><tspan x="349" dy="16.556"> </tspan><tspan x="349" dy="16.556">φ ∨ ¬φ 배중률</tspan><tspan x="349" dy="16.556">¬¬φ → φ 이중부정 제거</tspan><tspan x="349" dy="16.556">¬(φ ∧ ψ) → (¬φ ∨ ¬ψ)</tspan><tspan x="349" dy="16.556">((φ → ψ) → φ) → φ 페이르스 법칙</tspan><tspan x="349" dy="16.556">(¬ψ → ¬φ) → (φ → ψ)</tspan><tspan x="349" dy="16.556">¬∀x Fx → ∃x ¬Fx</tspan><tspan x="349" dy="16.556">귀류법으로 존재를 보이는 논증</tspan></text></g><g ><g class="shape"><path d="M517 731h376v194H517z" class="stroke-B1 fill-B5 s0"/></g><text x="705" y="769.5" class="text-bold fill-N1 s2"><tspan x="705" dy="0">얻는 것</tspan><tspan x="705" dy="16.556"> </tspan><tspan x="705" dy="16.556">선언 성질</tspan><tspan x="705" dy="16.556">⊢ φ ∨ ψ 이면 어느 한쪽이 따로 도출된다</tspan><tspan x="705" dy="16.556"> </tspan><tspan x="705" dy="16.556">존재 성질</tspan><tspan x="705" dy="16.556">⊢ ∃x Fx 이면 증인이 하나 나온다</tspan><tspan x="705" dy="16.556"> </tspan><tspan x="705" dy="16.556">증명이 그대로 프로그램이 된다</tspan></text></g><marker id="mk-d2-1525622487-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1525622487-3488378134)" d="M542 295.5v116" class="connection stroke-B1 s0" mask="url(#d2-1525622487)"/><text x="542.5" y="360" style="fill:#676c7e;text-anchor:middle;font-size:16px">열일곱 줄 가운데 하나</text><path fill="none" marker-end="url(#mk-d2-1525622487-3488378134)" d="M542 587v94" class="connection stroke-B1 s0" mask="url(#d2-1525622487)"/><mask id="d2-1525622487" width="1286" height="1137" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1286v1137H-101z"/><path d="M449 344h187v21H449z"/></mask></svg>