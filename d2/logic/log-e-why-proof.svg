<svg xmlns="http://www.w3.org/2000/svg" width="3227" height="625" class="d2-3021433345 d2-svg" viewBox="-101 -85 3227 625"><rect width="3227" height="625" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3021433345 .fill-N1{fill:#0a0f25}.d2-3021433345 .fill-B4{fill:#e3e9fd}.d2-3021433345 .fill-B5{fill:#edf0fd}.d2-3021433345 .fill-B6{fill:#f7f8fe}.d2-3021433345 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="384.5" cy="264" class="shape stroke-B1 fill-B6 s0" rx="186.5" ry="62"/></g><text x="384.5" y="269.5" class="text-bold fill-N1 s1">Γ 에서 φ 가 따라 나오는가</text></g><g ><g class="shape"><path d="M893 56h987v142H893z" class="stroke-B1 fill-B4 s0"/></g><text x="1386.5" y="43" class="text-bold fill-N1 s2">6장의 길 — 배당을 전부 훑는다</text></g><g ><g class="shape"><path d="M889 284h995v142H889z" class="stroke-B1 fill-B4 s0"/></g><text x="1386.5" y="271" class="text-bold fill-N1 s2">7장의 길 — 규칙을 이어 붙인다</text></g><g ><g class="shape"><path d="M2004 86h427v82h-427z" class="stroke-B1 fill-B6 s0"/></g><text x="2217.5" y="124.5" class="text-bold fill-N1 s1"><tspan x="2217.5" dy="0">문자 20 개면 100 만 줄, 30 개면 10 억 줄.</tspan><tspan x="2217.5" dy="18.5">논증이 아무리 단순해도 줄 수는 줄지 않는다</tspan></text></g><g ><g class="shape"><path d="M2028 306h380v98h-380z" class="stroke-B1 fill-B6 s0"/></g><text x="2218" y="344.5" class="text-bold fill-N1 s1"><tspan x="2218" dy="0">줄 수는 논증의 모양이 정한다.</tspan><tspan x="2218" dy="17.667">6장에서 열아홉 단계로 끝낸 그 논증은</tspan><tspan x="2218" dy="17.667">문자가 20 개여도 전제까지 마흔 줄이다</tspan></text></g><g ><g class="shape"><path d="M2589 86h379v82h-379z" class="stroke-B1 fill-B6 s0"/></g><text x="2778.5" y="124.5" class="text-bold fill-N1 s1"><tspan x="2778.5" dy="0">손에 남는 것 — ‘어긋나는 줄이 없었다’</tspan><tspan x="2778.5" dy="18.5">확인 과정을 남에게 건넬 수 없다</tspan></text></g><g ><g class="shape"><path d="M2531 314h494v82h-494z" class="stroke-B1 fill-B6 s0"/></g><text x="2778" y="352.5" class="text-bold fill-N1 s1"><tspan x="2778" dy="0">손에 남는 것 — 종이 한 장.</tspan><tspan x="2778" dy="18.5">줄마다 근거가 적혀 있어 남이 그대로 검사할 수 있다</tspan></text></g><text x="384.5" y="402" class="fill-N1 s1"><tspan x="384.5" dy="0">두 길이 같은 답을 준다는 보장은 아직 없다.</tspan><tspan x="384.5" dy="17.667">아래 길이 얻는 것이 위 길에서도 참인가, 위 길이 인정하는 것을 아래 길이 전부 잡아내는가 —</tspan><tspan x="384.5" dy="17.667">이 두 물음이 13장(건전성)과 14장(완전성)이다. 7장은 아래 길을 놓기만 한다</tspan></text><g ><g class="shape"><path d="M923 86h201v82H923z" class="stroke-B1 fill-B5 s0"/></g><text x="1023.5" y="124.5" class="text-bold fill-N1 s1"><tspan x="1023.5" dy="0">문장문자가 n 개면</tspan><tspan x="1023.5" dy="18.5">배당이 2ⁿ 개</tspan></text></g><g ><g class="shape"><path d="M1228 86h247v82h-247z" class="stroke-B1 fill-B5 s0"/></g><text x="1351.5" y="124.5" class="text-bold fill-N1 s1"><tspan x="1351.5" dy="0">전제가 전부 T 인 줄마다</tspan><tspan x="1351.5" dy="18.5">결론도 T 인지 본다</tspan></text></g><g ><g class="shape"><path d="M1580 94h270v66h-270z" class="stroke-B1 fill-B5 s0"/></g><text x="1715" y="132.5" class="text-bold fill-N1 s1">그런 줄이 없다 → 귀결이다</text></g><g ><g class="shape"><path d="M919 322h209v66H919z" class="stroke-B1 fill-B5 s0"/></g><text x="1023.5" y="360.5" class="text-bold fill-N1 s1">전제에서 출발한다</text></g><g ><g class="shape"><path d="M1233 314h238v82h-238z" class="stroke-B1 fill-B5 s0"/></g><text x="1352" y="352.5" class="text-bold fill-N1 s1"><tspan x="1352" dy="0">규칙을 한 번 쓸 때마다</tspan><tspan x="1352" dy="18.5">줄이 하나 늘어난다</tspan></text></g><g ><g class="shape"><path d="M1575 322h279v66h-279z" class="stroke-B1 fill-B5 s0"/></g><text x="1714.5" y="360.5" class="text-bold fill-N1 s1">결론이 적힌 줄에 이르면 끝</text></g><marker id="mk-d2-3021433345-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3021433345-3488378134)" d="M1126 127h98" class="connection stroke-B1 s0" mask="url(#d2-3021433345)"/><path fill="none" marker-end="url(#mk-d2-3021433345-3488378134)" d="M1477 127h98.5" class="connection stroke-B1 s0" mask="url(#d2-3021433345)"/><path fill="none" marker-end="url(#mk-d2-3021433345-3488378134)" d="M1130 355h98.5" class="connection stroke-B1 s0" mask="url(#d2-3021433345)"/><path fill="none" marker-end="url(#mk-d2-3021433345-3488378134)" d="M1473.5 355h97.5" class="connection stroke-B1 s0" mask="url(#d2-3021433345)"/><path fill="none" marker-end="url(#mk-d2-3021433345-3488378134)" d="M549.86 233.266C764.8 148.399 833.8 127 889 127" class="connection stroke-B1 s0" mask="url(#d2-3021433345)"/><path fill="none" marker-end="url(#mk-d2-3021433345-3488378134)" d="M543.958 297.41C763.6 343.4 833 355 885 355" class="connection stroke-B1 s0" mask="url(#d2-3021433345)"/><path fill="none" marker-end="url(#mk-d2-3021433345-3488378134)" d="M1882 127h118" class="connection stroke-B1 s0" mask="url(#d2-3021433345)"/><path fill="none" marker-end="url(#mk-d2-3021433345-3488378134)" d="M1886 355h137.5" class="connection stroke-B1 s0" mask="url(#d2-3021433345)"/><path fill="none" marker-end="url(#mk-d2-3021433345-3488378134)" d="M2433 127h151.5" class="connection stroke-B1 s0" mask="url(#d2-3021433345)"/><path fill="none" marker-end="url(#mk-d2-3021433345-3488378134)" d="M2410.5 355H2527" class="connection stroke-B1 s0" mask="url(#d2-3021433345)"/><mask id="d2-3021433345" width="3227" height="625" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h3227v625H-101z"/></mask></svg>