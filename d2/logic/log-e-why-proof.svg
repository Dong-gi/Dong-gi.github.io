<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="1293" class="d2-1658003249 d2-svg" viewBox="-101 -101 1170 1293"><rect width="1170" height="1293" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1658003249 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1658003249 .fill-N1{fill:#0a0f25}.d2-1658003249 .fill-B4{fill:#e3e9fd}.d2-1658003249 .fill-B5{fill:#edf0fd}.d2-1658003249 .fill-B6{fill:#f7f8fe}.d2-1658003249 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="484.5" cy="62" class="shape stroke-B1 fill-B6 s0" rx="186.5" ry="62"/></g><text x="484.5" y="67.5" class="text-bold fill-N1 s1">Γ 에서 φ 가 따라 나오는가</text></g><g ><g class="shape"><path d="M0 224h454v366H0z" class="stroke-B1 fill-B4 s0"/></g><text x="227" y="257" class="text-bold fill-N1 s2">6장의 길 — 배당을 전부 훑는다</text></g><g ><g class="shape"><path d="M514 232h454v350H514z" class="stroke-B1 fill-B4 s0"/></g><text x="741" y="265" class="text-bold fill-N1 s2">7장의 길 — 규칙을 이어 붙인다</text></g><g ><g class="shape"><path d="M101 690h252v114H101z" class="stroke-B1 fill-B6 s0"/></g><text x="227" y="728.5" class="text-bold fill-N1 s1"><tspan x="227" dy="0">문자 20 개면 100 만 줄,</tspan><tspan x="227" dy="17.25">30 개면 10 억 줄.</tspan><tspan x="227" dy="17.25">논증이 아무리 단순해도</tspan><tspan x="227" dy="17.25">줄 수는 줄지 않는다</tspan></text></g><g ><g class="shape"><path d="M551 698h380v98H551z" class="stroke-B1 fill-B6 s0"/></g><text x="741" y="736.5" class="text-bold fill-N1 s1"><tspan x="741" dy="0">줄 수는 논증의 모양이 정한다.</tspan><tspan x="741" dy="17.667">6장에서 열아홉 단계로 끝낸 그 논증은</tspan><tspan x="741" dy="17.667">문자가 20 개여도 전제까지 마흔 줄이다</tspan></text></g><g ><g class="shape"><path d="M66 904h323v98H66z" class="stroke-B1 fill-B6 s0"/></g><text x="227.5" y="942.5" class="text-bold fill-N1 s1"><tspan x="227.5" dy="0">손에 남는 것 —</tspan><tspan x="227.5" dy="17.667">‘어긋나는 줄이 없었다’</tspan><tspan x="227.5" dy="17.667">확인 과정을 남에게 건넬 수 없다</tspan></text></g><g ><g class="shape"><path d="M602 904h279v98H602z" class="stroke-B1 fill-B6 s0"/></g><text x="741.5" y="942.5" class="text-bold fill-N1 s1"><tspan x="741.5" dy="0">손에 남는 것 — 종이 한 장.</tspan><tspan x="741.5" dy="17.667">줄마다 근거가 적혀 있어</tspan><tspan x="741.5" dy="17.667">남이 그대로 검사할 수 있다</tspan></text></g><text x="484" y="1038" class="fill-N1 s1"><tspan x="484" dy="0">두 길이 같은 답을 준다는 보장은 아직 없다.</tspan><tspan x="484" dy="17.25">7장의 길이 얻는 것이 6장의 길에서도 참인가,</tspan><tspan x="484" dy="17.25">6장의 길이 인정하는 것을 7장의 길이 전부 잡아내는가 —</tspan><tspan x="484" dy="17.25">이 두 물음이 13장(건전성)과 14장(완전성)이다. 7장은 그 길을 놓기만 한다</tspan></text><g ><g class="shape"><path d="M92 270h270v82H92z" class="stroke-B1 fill-B5 s0"/></g><text x="227" y="308.5" class="text-bold fill-N1 s1"><tspan x="227" dy="0">문장문자가 n 개면</tspan><tspan x="227" dy="18.5">배당이 2ⁿ 개</tspan></text></g><g ><g class="shape"><path d="M92 382h270v82H92z" class="stroke-B1 fill-B5 s0"/></g><text x="227" y="420.5" class="text-bold fill-N1 s1"><tspan x="227" dy="0">전제가 전부 T 인 줄마다</tspan><tspan x="227" dy="18.5">결론도 T 인지 본다</tspan></text></g><g ><g class="shape"><path d="M92 494h270v66H92z" class="stroke-B1 fill-B5 s0"/></g><text x="227" y="532.5" class="text-bold fill-N1 s1">그런 줄이 없다 → 귀결이다</text></g><g ><g class="shape"><path d="M601 278h279v66H601z" class="stroke-B1 fill-B5 s0"/></g><text x="740.5" y="316.5" class="text-bold fill-N1 s1">전제에서 출발한다</text></g><g ><g class="shape"><path d="M601 374h279v82H601z" class="stroke-B1 fill-B5 s0"/></g><text x="740.5" y="412.5" class="text-bold fill-N1 s1"><tspan x="740.5" dy="0">규칙을 한 번 쓸 때마다</tspan><tspan x="740.5" dy="18.5">줄이 하나 늘어난다</tspan></text></g><g ><g class="shape"><path d="M601 486h279v66H601z" class="stroke-B1 fill-B5 s0"/></g><text x="740.5" y="524.5" class="text-bold fill-N1 s1">결론이 적힌 줄에 이르면 끝</text></g><marker id="mk-d2-1658003249-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1658003249-3488378134)" d="M227 354v24" class="connection stroke-B1 s0" mask="url(#d2-1658003249)"/><path fill="none" marker-end="url(#mk-d2-1658003249-3488378134)" d="M227 466v24" class="connection stroke-B1 s0" mask="url(#d2-1658003249)"/><path fill="none" marker-end="url(#mk-d2-1658003249-3488378134)" d="M741 346v24" class="connection stroke-B1 s0" mask="url(#d2-1658003249)"/><path fill="none" marker-end="url(#mk-d2-1658003249-3488378134)" d="M741 458v24" class="connection stroke-B1 s0" mask="url(#d2-1658003249)"/><path fill="none" marker-end="url(#mk-d2-1658003249-3488378134)" d="M369.168 111.802C255.8 161.4 227 184 227 220" class="connection stroke-B1 s0" mask="url(#d2-1658003249)"/><path fill="none" marker-end="url(#mk-d2-1658003249-3488378134)" d="M598.832 111.802C712.2 161.4 741 185.6 741 228" class="connection stroke-B1 s0" mask="url(#d2-1658003249)"/><path fill="none" marker-end="url(#mk-d2-1658003249-3488378134)" d="M227 592v94" class="connection stroke-B1 s0" mask="url(#d2-1658003249)"/><path fill="none" marker-end="url(#mk-d2-1658003249-3488378134)" d="M741 584v110" class="connection stroke-B1 s0" mask="url(#d2-1658003249)"/><path fill="none" marker-end="url(#mk-d2-1658003249-3488378134)" d="M227 806v94" class="connection stroke-B1 s0" mask="url(#d2-1658003249)"/><path fill="none" marker-end="url(#mk-d2-1658003249-3488378134)" d="M741 798v102" class="connection stroke-B1 s0" mask="url(#d2-1658003249)"/><mask id="d2-1658003249" width="1170" height="1293" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1170v1293H-101z"/></mask></svg>