<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="1768" class="d2-684340480 d2-svg" viewBox="-101 -112 1232 1768"><rect width="1232" height="1768" x="-101" y="-112" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-684340480 .fill-N1{fill:#0a0f25}.d2-684340480 .fill-N2{fill:#676c7e}.d2-684340480 .fill-B4{fill:#e3e9fd}.d2-684340480 .fill-B5{fill:#edf0fd}.d2-684340480 .fill-B6{fill:#f7f8fe}.d2-684340480 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{text-anchor:middle;font-size:24px}</style><g ><g class="shape"><path d="M0 29h871v641H0z" class="stroke-B1 fill-B4 s0"/></g><text x="435.5" y="16" class="text-bold fill-N1 s1">갈라지는 자리 — ‘상황 하나’ 를 무엇으로 잡는가</text></g><g ><g class="shape"><path d="M39 851h788v190H39z" class="stroke-B1 fill-B4 s0"/></g><text x="433" y="838" class="text-bold fill-N1 s1">빠져나갈 길을 둘 찾아보고 둘 다 닫는다</text></g><g ><g class="shape"><ellipse cx="641" cy="1292" class="shape stroke-B1 fill-B6 s0" rx="330" ry="110"/></g><text x="641" y="1281.5" class="text-bold fill-N1 s2"><tspan x="641" dy="0">그래도 판정 절차가 있기는 한가</tspan><tspan x="641" dy="17.667">모형을 훑는 것 말고 다른 방법으로, 어떤 식이</tspan><tspan x="641" dy="17.667">논리적 참인지 유한 단계에 답하는 기계가 있는가</tspan></text></g><text x="641.5" y="1518" class="fill-N1 s2"><tspan x="641.5" dy="0">답은 16장에 있고, 없다는 쪽이다.</tspan><tspan x="641.5" dy="17.667">다만 절반은 된다 — 논리적 참인 것은 언제나 유한 단계에 찾아낼 수 있다.</tspan><tspan x="641.5" dy="17.667">그 절반을 만드는 것이 11장의 증명 체계이고, 그것이 정말 의미론과 맞는지가 13장과 14장이다</tspan></text><g ><g class="shape"><path d="M30 78h371v562H30z" class="stroke-B1 fill-B5 s0"/></g><text x="215.5" y="66" class="text-bold fill-N1 s3">명제논리 — 6장</text></g><g ><g class="shape"><path d="M441 70h400v554H441z" class="stroke-B1 fill-B5 s0"/></g><text x="641" y="58" class="text-bold fill-N1 s3">술어논리 — 10장</text></g><g ><g class="shape"><path d="M69 881h357v130H69z" class="stroke-B1 fill-B5 s0"/></g><text x="247.5" y="919.5" class="text-bold fill-N1 s2"><tspan x="247.5" dy="0">유한한 D 만 보면 되지 않는가</tspan><tspan x="247.5" dy="17">안 된다. 유한 모형이 하나도 없고</tspan><tspan x="247.5" dy="17">무한 모형만 갖는 식이 있다.</tspan><tspan x="247.5" dy="17">유한만 훑으면 그런 식을</tspan><tspan x="247.5" dy="17">만족가능하지 않다고 잘못 판정한다</tspan></text></g><g ><g class="shape"><path d="M486 881h311v130H486z" class="stroke-B1 fill-B5 s0"/></g><text x="641.5" y="919.5" class="text-bold fill-N1 s2"><tspan x="641.5" dy="0">크기 k 까지만 보면 되지 않는가</tspan><tspan x="641.5" dy="17">안 된다. 어떤 k 를 정해도</tspan><tspan x="641.5" dy="17">크기 k 이하에서는 모두 참인데</tspan><tspan x="641.5" dy="17">더 큰 모형에서 거짓이 되는</tspan><tspan x="641.5" dy="17">식을 만들 수 있다</tspan></text></g><g ><g class="shape"><path d="M109 108h213v82H109z" class="stroke-B1 fill-B6 s0"/></g><text x="215.5" y="146.5" class="text-bold fill-N1 s2"><tspan x="215.5" dy="0">상황 하나 = 배당 v</tspan><tspan x="215.5" dy="18.5">문장문자마다 T 나 F</tspan></text></g><g ><g class="shape"><path d="M96 306h239v82H96z" class="stroke-B1 fill-B6 s0"/></g><text x="215.5" y="344.5" class="text-bold fill-N1 s2"><tspan x="215.5" dy="0">문장문자가 n 개면</tspan><tspan x="215.5" dy="18.5">배당은 2ⁿ 개. 유한하다</tspan></text></g><g ><g class="shape"><path d="M60 496h311v114H60z" class="stroke-B1 fill-B6 s0"/></g><text x="215.5" y="534.5" class="text-bold fill-N1 s2"><tspan x="215.5" dy="0">전부 훑으면 끝난다 = 진리표</tspan><tspan x="215.5" dy="17.25">명제논리는 결정 가능하다.</tspan><tspan x="215.5" dy="17.25">대가는 시간뿐이라 n 이 열 늘면</tspan><tspan x="215.5" dy="17.25">천 배 느려질 뿐이다</tspan></text></g><g ><g class="shape"><path d="M471 100h340v98H471z" class="stroke-B1 fill-B6 s0"/></g><text x="641" y="138.5" class="text-bold fill-N1 s2"><tspan x="641" dy="0">상황 하나 = 모형 ℳ = ⟨D, I⟩</tspan><tspan x="641" dy="17.667">정의역 D 를 먼저 고르고</tspan><tspan x="641" dy="17.667">그 위에서 상수와 술어를 해석한다</tspan></text></g><g ><g class="shape"><path d="M514 298h254v98H514z" class="stroke-B1 fill-B6 s0"/></g><text x="641" y="336.5" class="text-bold fill-N1 s2"><tspan x="641" dy="0">D 의 크기에 상한이 없다.</tspan><tspan x="641" dy="17.667">크기를 정해도 그 위의</tspan><tspan x="641" dy="17.667">해석이 또 여럿이다</tspan></text></g><g ><g class="shape"><path d="M482 512h319v82H482z" class="stroke-B1 fill-B6 s0"/></g><text x="641.5" y="550.5" class="text-bold fill-N1 s2"><tspan x="641.5" dy="0">전부 훑는다는 말이 뜻을 잃는다</tspan><tspan x="641.5" dy="18.5">진리표에 해당하는 것이 없다</tspan></text></g><marker id="mk-d2-684340480-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-684340480-3488378134)" d="M215.5 192v110" class="connection stroke-B1 s0" mask="url(#d2-684340480)"/><path fill="none" marker-end="url(#mk-d2-684340480-3488378134)" d="M215.5 390v102" class="connection stroke-B1 s0" mask="url(#d2-684340480)"/><path fill="none" marker-end="url(#mk-d2-684340480-3488378134)" d="M641 200v94" class="connection stroke-B1 s0" mask="url(#d2-684340480)"/><path fill="none" marker-end="url(#mk-d2-684340480-3488378134)" d="M641 398v110" class="connection stroke-B1 s0" mask="url(#d2-684340480)"/><path fill="none" marker-end="url(#mk-d2-684340480-3488378134)" d="M641 671.5v135" class="connection stroke-B1 s0" mask="url(#d2-684340480)"/><text x="641" y="746" class="text-italic fill-N2 s2">진리표를 잃었다</text><path fill="none" marker-end="url(#mk-d2-684340480-3488378134)" d="M641 1042.5V1178" class="connection stroke-B1 s0" mask="url(#d2-684340480)"/><text x="641.5" y="1117" class="text-italic fill-N2 s2">둘 다 막혔다</text><path fill="none" marker-end="url(#mk-d2-684340480-3488378134)" d="M641 1404v94" class="connection stroke-B1 s0" mask="url(#d2-684340480)"/><mask id="d2-684340480" width="1232" height="1768" x="-101" y="-112" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-112h1232v1768H-101z"/><path d="M570 730h142v21H570zM588 1101h107v21H588z"/></mask></svg>