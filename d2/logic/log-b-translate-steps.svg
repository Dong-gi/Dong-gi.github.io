<svg xmlns="http://www.w3.org/2000/svg" width="1134" height="1429" class="d2-3857885911 d2-svg" viewBox="-101 -101 1134 1429"><rect width="1134" height="1429" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3857885911 .text-bold{font-weight:700}.d2-3857885911 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3857885911 .fill-N1{fill:#0a0f25}.d2-3857885911 .fill-N2{fill:#676c7e}.d2-3857885911 .fill-B6{fill:#f7f8fe}.d2-3857885911 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="682.5" cy="63.5" class="shape stroke-B1 fill-B6 s0" rx="190.5" ry="63.5"/></g><text x="682.5" y="53" class="text-bold fill-N1 s1"><tspan x="682.5" dy="0">① 문장을 따로 떼어 적는다</tspan><tspan x="682.5" dy="17.667">‘시험을 보지 않으면</tspan><tspan x="682.5" dy="17.667">학점을 받지 못한다’</tspan></text></g><g ><g class="shape"><path d="M536 227h293v98H536z" class="stroke-B1 fill-B6 s0"/></g><text x="682.5" y="265.5" class="text-bold fill-N1 s1"><tspan x="682.5" dy="0">② 논리 상항을 찾아 표시한다</tspan><tspan x="682.5" dy="17.667">‘-지 않-’ 과 ‘-지 못-’ 하나씩,</tspan><tspan x="682.5" dy="17.667">‘-으면’ 한 번</tspan></text></g><g ><g class="shape"><path d="M534 425h297v130H534z" class="stroke-B1 fill-B6 s0"/></g><text x="682.5" y="463.5" class="text-bold fill-N1 s1"><tspan x="682.5" dy="0">③ 남은 조각을 원자로 잡고</tspan><tspan x="682.5" dy="17">사전을 적는다</tspan><tspan x="682.5" dy="17">P: 시험을 본다</tspan><tspan x="682.5" dy="17">Q: 학점을 받는다</tspan><tspan x="682.5" dy="17">긍정형으로, 완전한 문장으로</tspan></text></g><g ><g class="shape"><path d="M203 676h264v114H203z" class="stroke-B1 fill-B6 s0"/></g><text x="335" y="714.5" class="text-bold fill-N1 s1"><tspan x="335" dy="0">④ 뼈대를 만든다 —</tspan><tspan x="335" dy="17.25">조각만 글자로 바꾸고</tspan><tspan x="335" dy="17.25">연결은 한국어로 둔다</tspan><tspan x="335" dy="17.25">‘P 가 아니면 Q 가 아니다’</tspan></text></g><g ><g class="shape"><path d="M0 929h310v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="155" y="967.5" class="text-bold fill-N1 s1"><tspan x="155" dy="0">⑤ 기호로 바꾸고 괄호를 넣는다</tspan><tspan x="155" dy="18.5">¬P → ¬Q</tspan></text></g><g ><g class="shape"><ellipse cx="593" cy="1169.5" class="shape stroke-B1 fill-B6 s0" rx="173" ry="57.5"/></g><text x="593" y="1159" class="text-bold fill-N1 s1"><tspan x="593" dy="0">⑥ 되읽어 원문과 견준다</tspan><tspan x="593" dy="17.667">‘시험을 안 보면</tspan><tspan x="593" dy="17.667">학점을 못 받는다’</tspan></text></g><text x="682" y="707" class="fill-N1 s1"><tspan x="682" dy="0">사전을 빼먹으면 ¬P → ¬Q 만 남는다.</tspan><tspan x="682" dy="17">그것만으로는</tspan><tspan x="682" dy="17">참인지 거짓인지 물을 수도 없다.</tspan><tspan x="682" dy="17">사전은 장식이 아니라</tspan><tspan x="682" dy="17">옮긴 결과의 절반이다</tspan></text><text x="514" y="943" class="fill-N1 s1"><tspan x="514" dy="0">④ 에서 뼈대가 두 갈래로 읽히면</tspan><tspan x="514" dy="17">애매한 문장이다.</tspan><tspan x="514" dy="17">하나를 몰래 고르지 말고</tspan><tspan x="514" dy="17">두 읽기를 다 적은 뒤</tspan><tspan x="514" dy="17">문맥으로 고르고, 골랐다고 밝혀라</tspan></text><marker id="mk-d2-3857885911-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3857885911-3488378134)" d="M682 129v94" class="connection stroke-B1 s0" mask="url(#d2-3857885911)"/><path fill="none" marker-end="url(#mk-d2-3857885911-3488378134)" d="M682 327v94" class="connection stroke-B1 s0" mask="url(#d2-3857885911)"/><path fill="none" marker-end="url(#mk-d2-3857885911-3488378134)" d="M531.619 544.31C374.299 601.125 334.5 627.7 334.5 672.5" class="connection stroke-B1 s0" mask="url(#d2-3857885911)"/><path fill="none" marker-end="url(#mk-d2-3857885911-3488378134)" d="M251.365 790.651C174.6 844.7 155 872.5 155 924.5" class="connection stroke-B1 s0" mask="url(#d2-3857885911)"/><path fill="none" marker-end="url(#mk-d2-3857885911-3488378134)" d="M155 1013c0 38.8 59.8 63.6 295.114 121.051" class="connection stroke-B1 s0" mask="url(#d2-3857885911)"/><path fill="none" marker-end="url(#mk-d2-3857885911-3488378134)" d="M705.86 1124.267C832 1074.6 864 1043.5 864 1015.75v-220c0-37.65-17.4-192.45-83.725-238.954" class="connection stroke-B1 s0" mask="url(#d2-3857885911)"/><text x="864" y="869" class="text-italic fill-N2 s1"><tspan x="864" dy="0">어긋나면</tspan><tspan x="864" dy="18.5">사전부터 고친다</tspan></text><path fill="none" marker-end="url(#mk-d2-3857885911-3488378134)" d="M682 556.5v130" class="connection stroke-B1 s0" mask="url(#d2-3857885911)"/><text x="682" y="628" class="text-italic fill-N2 s1">이 단계를 빼면</text><path fill="none" marker-end="url(#mk-d2-3857885911-3488378134)" d="M417.635 790.651C494.4 844.7 514 872.3 514 923.5" class="connection stroke-B1 s0" mask="url(#d2-3857885911)"/><text x="492" y="848" class="text-italic fill-N2 s1">여기서 갈라지면</text><mask id="d2-3857885911" width="1134" height="1429" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1134v1429H-101z"/><path d="M793 853h142v37H793zM619 612h126v21H619zM421 832h142v21H421z"/></mask></svg>