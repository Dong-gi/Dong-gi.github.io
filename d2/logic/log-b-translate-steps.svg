<svg xmlns="http://www.w3.org/2000/svg" width="1457" height="1442" class="d2-2292529368 d2-svg" viewBox="-101 -101 1457 1442"><rect width="1457" height="1442" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2292529368 .fill-N1{fill:#0a0f25}.d2-2292529368 .fill-N2{fill:#676c7e}.d2-2292529368 .fill-B6{fill:#f7f8fe}.d2-2292529368 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="910.5" cy="95.5" class="shape stroke-B1 fill-B6 s0" rx="286.5" ry="95.5"/></g><text x="910.5" y="93" class="text-bold fill-N1 s1"><tspan x="910.5" dy="0">① 문장을 따로 떼어 적는다</tspan><tspan x="910.5" dy="18.5">‘시험을 보지 않으면 학점을 받지 못한다’</tspan></text></g><g ><g class="shape"><path d="M766 291h290v82H766z" class="stroke-B1 fill-B6 s0"/></g><text x="911" y="329.5" class="text-bold fill-N1 s1"><tspan x="911" dy="0">② 논리 상항을 찾아 표시한다</tspan><tspan x="911" dy="18.5">‘-지 않-’ 두 번, ‘-으면’ 한 번</tspan></text></g><g ><g class="shape"><path d="M712 473h397v98H712z" class="stroke-B1 fill-B6 s0"/></g><text x="910.5" y="511.5" class="text-bold fill-N1 s1"><tspan x="910.5" dy="0">③ 남은 조각을 원자로 잡고 사전을 적는다</tspan><tspan x="910.5" dy="17.667">P: 시험을 본다 Q: 학점을 받는다</tspan><tspan x="910.5" dy="17.667">긍정형으로, 완전한 문장으로</tspan></text></g><g ><g class="shape"><path d="M75 692h580v82H75z" class="stroke-B1 fill-B6 s0"/></g><text x="365" y="730.5" class="text-bold fill-N1 s1"><tspan x="365" dy="0">④ 뼈대를 만든다 — 조각만 글자로 바꾸고 연결은 한국어로 둔다</tspan><tspan x="365" dy="18.5">‘P 가 아니면 Q 가 아니다’</tspan></text></g><g ><g class="shape"><path d="M0 895h310v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="155" y="933.5" class="text-bold fill-N1 s1"><tspan x="155" dy="0">⑤ 기호로 바꾸고 괄호를 넣는다</tspan><tspan x="155" dy="18.5">¬P → ¬Q</tspan></text></g><g ><g class="shape"><ellipse cx="756" cy="1158.5" class="shape stroke-B1 fill-B6 s0" rx="244" ry="81.5"/></g><text x="756" y="1156" class="text-bold fill-N1 s1"><tspan x="756" dy="0">⑥ 되읽어 원문과 견준다</tspan><tspan x="756" dy="18.5">‘시험을 안 보면 학점을 못 받는다’</tspan></text></g><text x="911" y="723" class="fill-N1 s1"><tspan x="911" dy="0">사전을 빼먹으면 ¬P → ¬Q 만 남는다.</tspan><tspan x="911" dy="17.667">그것만으로는 참인지 거짓인지 물을 수도 없다.</tspan><tspan x="911" dy="17.667">사전은 장식이 아니라 옮긴 결과의 절반이다</tspan></text><text x="633.5" y="926" class="fill-N1 s1"><tspan x="633.5" dy="0">④ 에서 뼈대가 두 갈래로 읽히면 애매한 문장이다.</tspan><tspan x="633.5" dy="17.667">하나를 몰래 고르지 말고 두 읽기를 다 적은 뒤</tspan><tspan x="633.5" dy="17.667">문맥으로 고르고, 골랐다고 밝혀라</tspan></text><marker id="mk-d2-2292529368-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2292529368-3488378134)" d="M910.99 193c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-2292529368)"/><path fill="none" marker-end="url(#mk-d2-2292529368-3488378134)" d="M910.75 375v94" class="connection stroke-B1 s0" mask="url(#d2-2292529368)"/><path fill="none" marker-end="url(#mk-d2-2292529368-3488378134)" d="M709.79 561.895C434.15 617.5 364.75 643.7 364.75 688.5" class="connection stroke-B1 s0" mask="url(#d2-2292529368)"/><path fill="none" marker-end="url(#mk-d2-2292529368-3488378134)" d="M278.203 774.377C180 822.3 155 846.7 155 891.5" class="connection stroke-B1 s0" mask="url(#d2-2292529368)"/><path fill="none" marker-end="url(#mk-d2-2292529368-3488378134)" d="M155 979c0 38 79.4 65.4 393.093 134.144" class="connection stroke-B1 s0" mask="url(#d2-2292529368)"/><path fill="none" marker-end="url(#mk-d2-2292529368-3488378134)" d="M929.895 1100.36C1103 1041.8 1146.75 1008.8 1146.75 981.5V783.75c0-30.45-25.8-164.45-125.384-211.54" class="connection stroke-B1 s0" mask="url(#d2-2292529368)"/><text x="1147" y="881" class="text-italic fill-N2 s1">어긋나면 사전부터 고친다</text><path fill="none" marker-end="url(#mk-d2-2292529368-3488378134)" d="M910.75 572.5v130" class="connection stroke-B1 s0" mask="url(#d2-2292529368)"/><text x="911" y="644" class="text-italic fill-N2 s1">이 단계를 빼면</text><path fill="none" marker-end="url(#mk-d2-2292529368-3488378134)" d="M475.369 774.212C601.5 822.3 633.5 849.5 633.5 905.5" class="connection stroke-B1 s0" mask="url(#d2-2292529368)"/><text x="585" y="822" class="text-italic fill-N2 s1">여기서 갈라지면</text><mask id="d2-2292529368" width="1457" height="1442" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1457v1442H-101z"/><path d="M1036 865h222v21h-222zM848 628h126v21H848zM514 806h142v21H514z"/></mask></svg>