<svg xmlns="http://www.w3.org/2000/svg" width="795" height="1079" class="d2-1727395476 d2-svg" viewBox="-101 -101 795 1079"><rect width="795" height="1079" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1727395476 .fill-N1{fill:#0a0f25}.d2-1727395476 .fill-N2{fill:#676c7e}.d2-1727395476 .fill-B4{fill:#e3e9fd}.d2-1727395476 .fill-B5{fill:#edf0fd}.d2-1727395476 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M2 0h590v136H2z" class="stroke-B1 fill-B4 s0"/></g><text x="297" y="33" class="text-bold fill-N1 s1">자연어 문장 둘 — 뜻이 분명히 다르다</text></g><g ><g class="shape"><path d="M52 257h490v181H52z" class="stroke-B1 fill-B4 s0"/></g><text x="297" y="290" class="text-bold fill-N1 s1">4장의 도구로 옮기면 — 손실 압축</text></g><g ><g class="shape"><path d="M1 559h591v181H1z" class="stroke-B1 fill-B4 s0"/></g><text x="296.5" y="592" class="text-bold fill-N1 s1">18장의 도구로 옮기면 — 갈라진다</text></g><text x="296.5" y="856" class="fill-N1 s2"><tspan x="296.5" dy="0">되찾은 것은 ‘양상’ 이지 ‘시제’ 도 ‘정도’ 도 아니다.</tspan><tspan x="296.5" dy="18.5">4장 손실 표의 나머지 줄은 여전히 열려 있고, 그중 정도는 19장이 맡는다</tspan></text><g ><g class="shape"><path d="M10 46h249v82H10z" class="stroke-B1 fill-B5 s0"/></g><text x="134.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="134.5" dy="0">독신자는 미혼이다</tspan><tspan x="134.5" dy="18.5">— 어길 수 없는 사실이다</tspan></text></g><g ><g class="shape"><path d="M267 46h317v82H267z" class="stroke-B1 fill-B5 s0"/></g><text x="425.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="425.5" dy="0">이 방의 사람은 미혼이다</tspan><tspan x="425.5" dy="18.5">— 그럴 수도 있고 아닐 수도 있다</tspan></text></g><g ><g class="shape"><path d="M76 303h369v66H76z" class="stroke-B1 fill-B5 s0"/></g><text x="260.5" y="341.5" class="text-bold fill-N1 s2">P</text></g><g ><g class="shape"><path d="M453 303h64v66h-64z" class="stroke-B1 fill-B5 s0"/></g><text x="485" y="341.5" class="text-bold fill-N1 s2">P′</text></g><text x="260.5" y="393" class="fill-N1 s2"><tspan x="260.5" dy="0">둘 다 문장문자 하나다. ‘어길 수 없다’ 는</tspan><tspan x="260.5" dy="17.667">연결자에도 원자에도 자리가 없어 사라진다.</tspan><tspan x="260.5" dy="17.667">4장 손실 표의 ‘양상’ 줄이 이것이다</tspan></text><g ><g class="shape"><path d="M9 605h299v82H9z" class="stroke-B1 fill-B5 s0"/></g><text x="158.5" y="643.5" class="text-bold fill-N1 s2"><tspan x="158.5" dy="0">□P</tspan><tspan x="158.5" dy="18.5">필연적으로 P</tspan></text></g><g ><g class="shape"><path d="M316 605h268v82H316z" class="stroke-B1 fill-B5 s0"/></g><text x="450" y="643.5" class="text-bold fill-N1 s2"><tspan x="450" dy="0">P ∧ ◇¬P</tspan><tspan x="450" dy="18.5">P 이지만 아닐 수도 있었다</tspan></text></g><text x="158.5" y="711" class="fill-N1 s2"><tspan x="158.5" dy="0">연결자 하나를 어휘에 더한 값이다.</tspan><tspan x="158.5" dy="18.5">문법은 5장 그대로, 의미론만 넓힌다</tspan></text><marker id="mk-d2-1727395476-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1727395476-3488378134)" d="M296.5 137.5v116" class="connection stroke-B1 s0" mask="url(#d2-1727395476)"/><text x="297" y="202" class="text-italic fill-N2 s2">옮긴다</text><path fill="none" marker-end="url(#mk-d2-1727395476-3488378134)" d="M296.5 439.5v116" class="connection stroke-B1 s0" mask="url(#d2-1727395476)"/><text x="296.5" y="504" class="text-italic fill-N2 s2">되찾는다</text><path fill="none" marker-end="url(#mk-d2-1727395476-3488378134)" d="M296.5 742v94" class="connection stroke-B1 s0" mask="url(#d2-1727395476)"/><mask id="d2-1727395476" width="795" height="1079" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h795V978h-795z"/><path d="M266 186h62v21h-62zM256 488h81v21h-81z"/></mask></svg>