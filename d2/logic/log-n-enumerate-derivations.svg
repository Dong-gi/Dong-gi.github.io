<svg xmlns="http://www.w3.org/2000/svg" width="1189" height="2109" class="d2-3227599832 d2-svg" viewBox="-89 -101 1189 2109"><rect width="1189" height="2109" x="-89" y="-101" rx="0" style="fill:#fff"/><style>.d2-3227599832 .text-bold{font-weight:700}.d2-3227599832 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3227599832 .fill-N1{fill:#0a0f25}.d2-3227599832 .fill-N2{fill:#676c7e}.d2-3227599832 .fill-B4{fill:#e3e9fd}.d2-3227599832 .fill-B5{fill:#edf0fd}.d2-3227599832 .fill-B6{fill:#f7f8fe}.d2-3227599832 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="302" cy="53.5" class="shape stroke-B1 fill-B6 s0" rx="160" ry="53.5"/></g><text x="302" y="59" class="text-bold fill-N1 s1">술어논리 문장 φ 하나</text></g><g ><g class="shape"><path d="M28 227h773v372H28z" class="stroke-B1 fill-B4 s0"/></g><text x="414.5" y="214" class="text-bold fill-N1 s2">도출을 길이 순으로 늘어놓는다</text></g><g ><g class="shape"><path d="M12 760h458v356H12z" class="stroke-B1 fill-B4 s0"/></g><text x="241" y="747" class="fill-N1 s2">꺼낸 도출 한 벌을 검사한다</text></g><g ><g class="shape"><path d="M165 1257h274v82H165z" class="stroke-B1 fill-B6 s0"/></g><text x="302" y="1295.5" class="text-bold fill-N1 s1"><tspan x="302" dy="0">찾았다 →</tspan><tspan x="302" dy="18.5">‘예, ⊨ φ 다’ 를 내고 멈춘다</tspan></text></g><g ><g class="shape"><path d="M102 1439h400v146H102z" class="stroke-B1 fill-B6 s0"/></g><text x="302" y="1477.5" class="text-bold fill-N1 s1"><tspan x="302" dy="0">φ 가 논리적 참이면</tspan><tspan x="302" dy="16.833">14장(완전성)에 의해 ⊢ φ 다 —</tspan><tspan x="302" dy="16.833">도출이 있다.</tspan><tspan x="302" dy="16.833">목록은 도출을 하나도 빠뜨리지 않으므로</tspan><tspan x="302" dy="16.833">언젠가 그것을 꺼낸다.</tspan><tspan x="302" dy="16.833">반드시 멈춘다</tspan></text></g><g ><g class="shape"><path d="M562 1439h437v146H562z" class="stroke-B1 fill-B6 s0"/></g><text x="780.5" y="1477.5" class="text-bold fill-N1 s1"><tspan x="780.5" dy="0">φ 가 논리적 참이 아니면</tspan><tspan x="780.5" dy="16.833">13장(건전성)에 의해</tspan><tspan x="780.5" dy="16.833">도출이 아예 없다.</tspan><tspan x="780.5" dy="16.833">목록에는 끝이 없으므로</tspan><tspan x="780.5" dy="16.833">‘다 봤는데 없다’ 고 말할 시점이 오지 않는다.</tspan><tspan x="780.5" dy="16.833">영원히 돈다</tspan></text></g><text x="542" y="1701" class="text-bold fill-N1 s1"><tspan x="542" dy="0">그래서 모순이 아니다.</tspan><tspan x="542" dy="16.714">완전성은 존재에 관한 정리이고 —</tspan><tspan x="542" dy="16.714">논리적 참이면 도출이 있다 —</tspan><tspan x="542" dy="16.714">결정 가능성은 절차에 관한 요구다 —</tspan><tspan x="542" dy="16.714">있든 없든 유한 시간에 답하라.</tspan><tspan x="542" dy="16.714">‘있으면 언젠가 찾는다’ 는</tspan><tspan x="542" dy="16.714">‘없으면 없다고 안다’ 를 함의하지 않는다</tspan></text><text x="505" y="1838" class="fill-N1 s1"><tspan x="505" dy="0">두 정리가 각각 한 갈래를 맡는다.</tspan><tspan x="505" dy="17">완전성이 없으면 왼쪽 갈래가 무너진다 —</tspan><tspan x="505" dy="17">논리적 참인데도 도출이 없을 수 있으니 절차가 영영 못 찾는다.</tspan><tspan x="505" dy="17">건전성이 없으면 오른쪽 갈래가 무너진다 —</tspan><tspan x="505" dy="17">논리적 참이 아닌 식의 도출을 주워 ‘예’ 라고 답해 버린다</tspan></text><g ><g class="shape"><path d="M122 257h360v146H122z" class="stroke-B1 fill-B5 s0"/></g><text x="302" y="295.5" class="text-bold fill-N1 s1"><tspan x="302" dy="0">왜 늘어놓을 수 있는가</tspan><tspan x="302" dy="16.833">도출은 유한한 대상이다 —</tspan><tspan x="302" dy="16.833">줄이 유한하고 줄마다 식이 유한하고</tspan><tspan x="302" dy="16.833">규칙이 스무 개가 안 된다.</tspan><tspan x="302" dy="16.833">길이 1 짜리부터</tspan><tspan x="302" dy="16.833">차례로 다 적을 수 있다</tspan></text></g><g ><g class="shape"><path d="M58 503h288v66H58z" class="stroke-B1 fill-B5 s0"/></g><text x="202" y="541.5" class="text-bold fill-N1 s1">1번, 2번, 3번 … 하나씩 꺼낸다</text></g><g ><g class="shape"><path d="M42 790h321v114H42z" class="stroke-B1 fill-B5 s0"/></g><text x="202.5" y="828.5" class="text-bold fill-N1 s1"><tspan x="202.5" dy="0">줄마다 규칙 이름이 맞는지,</tspan><tspan x="202.5" dy="17.25">가정이 제대로 방출됐는지 본다.</tspan><tspan x="202.5" dy="17.25">이 검사는 결정 가능하다 —</tspan><tspan x="202.5" dy="17.25">유한한 확인이고 반드시 끝난다</tspan></text></g><g ><g class="shape"><path d="M164 1004h276v82H164z" class="stroke-B1 fill-B5 s0"/></g><text x="302" y="1042.5" class="text-bold fill-N1 s1"><tspan x="302" dy="0">마지막 줄이 φ 이고</tspan><tspan x="302" dy="18.5">열린 가정이 하나도 없는가</tspan></text></g><marker id="mk-d2-3227599832-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3227599832-3488378134)" d="M241.732 404.547C210.2 443 202 463 202 499" class="connection stroke-B1 s0" mask="url(#d2-3227599832)"/><path fill="none" marker-end="url(#mk-d2-3227599832-3488378134)" d="M202 906c0 38 11 58 52.04 95.31" class="connection stroke-B1 s0" mask="url(#d2-3227599832)"/><path fill="none" marker-end="url(#mk-d2-3227599832-3488378134)" d="M302.01 109c.19 38 .24 53.8.24 73" class="connection stroke-B1 s0" mask="url(#d2-3227599832)"/><path fill="none" marker-end="url(#mk-d2-3227599832-3488378134)" d="M202 600.5v115" class="connection stroke-B1 s0" mask="url(#d2-3227599832)"/><path fill="none" marker-end="url(#mk-d2-3227599832-3488378134)" d="M402.5 717.5v-115" class="connection stroke-B1 s0" mask="url(#d2-3227599832)"/><text x="402.5" y="665" class="text-italic fill-N2 s1">아니면 다음 도출로</text><path fill="none" marker-end="url(#mk-d2-3227599832-3488378134)" d="M302.25 1117.5v136" class="connection stroke-B1 s0" mask="url(#d2-3227599832)"/><text x="302" y="1192" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-3227599832-3488378134)" d="M302.25 1341v94" class="connection stroke-B1 s0" mask="url(#d2-3227599832)"/><path fill="none" marker-end="url(#mk-d2-3227599832-3488378134)" d="M780.75 600.5V1435" class="connection stroke-B1 s0" mask="url(#d2-3227599832)"/><text x="781" y="1024" class="text-italic fill-N2 s1">이 화살표에는 끝이 없다</text><path fill="none" marker-end="url(#mk-d2-3227599832-3488378134)" d="M302.25 1587c0 38 22 58 106.359 96.345" class="connection stroke-B1 s0" mask="url(#d2-3227599832)"/><path fill="none" marker-end="url(#mk-d2-3227599832-3488378134)" d="M780.75 1587c0 38-22 58-106.359 96.345" class="connection stroke-B1 s0" mask="url(#d2-3227599832)"/><mask id="d2-3227599832" width="1189" height="2109" x="-89" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-101h1189v2109H-89z"/><path d="M320 649h165v21H320zM271 1176h62v21h-62zM678 1008h206v21H678z"/></mask></svg>