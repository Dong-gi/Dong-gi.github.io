<svg xmlns="http://www.w3.org/2000/svg" width="1737" height="1812" class="d2-1117527993 d2-svg" viewBox="-91 -101 1737 1812"><rect width="1737" height="1812" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1117527993 .fill-N1{fill:#0a0f25}.d2-1117527993 .fill-N2{fill:#676c7e}.d2-1117527993 .fill-B4{fill:#e3e9fd}.d2-1117527993 .fill-B5{fill:#edf0fd}.d2-1117527993 .fill-B6{fill:#f7f8fe}.d2-1117527993 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="481" cy="53.5" class="shape stroke-B1 fill-B6 s0" rx="160" ry="53.5"/></g><text x="481" y="59" class="text-bold fill-N1 s1">술어논리 문장 φ 하나</text></g><g ><g class="shape"><path d="M147 227h1037v340H147z" class="stroke-B1 fill-B4 s0"/></g><text x="665.5" y="214" class="text-bold fill-N1 s2">도출을 길이 순으로 늘어놓는다</text></g><g ><g class="shape"><path d="M10 728h721v308H10z" class="stroke-B1 fill-B4 s0"/></g><text x="370.5" y="715" class="fill-N1 s2">꺼낸 도출 한 벌을 검사한다</text></g><g ><g class="shape"><path d="M305 1177h352v66H305z" class="stroke-B1 fill-B6 s0"/></g><text x="481" y="1215.5" class="text-bold fill-N1 s1">찾았다 → ‘예, ⊨ φ 다’ 를 내고 멈춘다</text></g><g ><g class="shape"><path d="M182 1343h597v114H182z" class="stroke-B1 fill-B6 s0"/></g><text x="480.5" y="1381.5" class="text-bold fill-N1 s1"><tspan x="480.5" dy="0">φ 가 논리적 참이면</tspan><tspan x="480.5" dy="17.25">14장(완전성)에 의해 ⊢ φ 다 — 도출이 있다.</tspan><tspan x="480.5" dy="17.25">목록은 도출을 하나도 빠뜨리지 않으므로 언젠가 그것을 꺼낸다.</tspan><tspan x="480.5" dy="17.25">반드시 멈춘다</tspan></text></g><g ><g class="shape"><path d="M839 1343h649v114H839z" class="stroke-B1 fill-B6 s0"/></g><text x="1163.5" y="1381.5" class="text-bold fill-N1 s1"><tspan x="1163.5" dy="0">φ 가 논리적 참이 아니면</tspan><tspan x="1163.5" dy="17.25">13장(건전성)에 의해 도출이 아예 없다.</tspan><tspan x="1163.5" dy="17.25">목록에는 끝이 없으므로 ‘다 봤는데 없다’ 고 말할 시점이 오지 않는다.</tspan><tspan x="1163.5" dy="17.25">영원히 돈다</tspan></text></g><text x="822" y="1573" class="text-bold fill-N1 s1"><tspan x="822" dy="0">그래서 모순이 아니다. 완전성은 존재에 관한 정리이고 — 논리적 참이면 도출이 있다 —</tspan><tspan x="822" dy="17.667">결정 가능성은 절차에 관한 요구다 — 있든 없든 유한 시간에 답하라.</tspan><tspan x="822" dy="17.667">‘있으면 언젠가 찾는다’ 는 ‘없으면 없다고 안다’ 를 함의하지 않는다</tspan></text><text x="1123" y="43" class="fill-N1 s1"><tspan x="1123" dy="0">두 정리가 각각 한 갈래를 맡는다. 완전성이 없으면 왼쪽 갈래가 무너진다 —</tspan><tspan x="1123" dy="17.667">논리적 참인데도 도출이 없을 수 있으니 절차가 영영 못 찾는다.</tspan><tspan x="1123" dy="17.667">건전성이 없으면 오른쪽 갈래가 무너진다 — 논리적 참이 아닌 식의 도출을 주워 ‘예’ 라고 답해 버린다</tspan></text><g ><g class="shape"><path d="M253 257h455v114H253z" class="stroke-B1 fill-B5 s0"/></g><text x="480.5" y="295.5" class="text-bold fill-N1 s1"><tspan x="480.5" dy="0">왜 늘어놓을 수 있는가</tspan><tspan x="480.5" dy="17.25">도출은 유한한 대상이다 — 줄이 유한하고</tspan><tspan x="480.5" dy="17.25">줄마다 식이 유한하고 규칙이 스무 개가 안 된다.</tspan><tspan x="480.5" dy="17.25">길이 1 짜리부터 차례로 다 적을 수 있다</tspan></text></g><g ><g class="shape"><path d="M177 471h288v66H177z" class="stroke-B1 fill-B5 s0"/></g><text x="321" y="509.5" class="text-bold fill-N1 s1">1번, 2번, 3번 … 하나씩 꺼낸다</text></g><g ><g class="shape"><path d="M40 758h561v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="320.5" y="796.5" class="text-bold fill-N1 s1"><tspan x="320.5" dy="0">줄마다 규칙 이름이 맞는지, 가정이 제대로 방출됐는지 본다.</tspan><tspan x="320.5" dy="18.5">이 검사는 결정 가능하다 — 유한한 확인이고 반드시 끝난다</tspan></text></g><g ><g class="shape"><path d="M260 940h441v66H260z" class="stroke-B1 fill-B5 s0"/></g><text x="480.5" y="978.5" class="text-bold fill-N1 s1">마지막 줄이 φ 이고 열린 가정이 하나도 없는가</text></g><marker id="mk-d2-1117527993-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1117527993-3488378134)" d="M393.836 372.11C335.5 411 320.5 431 320.5 467" class="connection stroke-B1 s0" mask="url(#d2-1117527993)"/><path fill="none" marker-end="url(#mk-d2-1117527993-3488378134)" d="M320.5 842c0 38 19.4 58 93.445 96.167" class="connection stroke-B1 s0" mask="url(#d2-1117527993)"/><path fill="none" marker-end="url(#mk-d2-1117527993-3488378134)" d="M480.99 109c-.19 38-.24 53.8-.24 73" class="connection stroke-B1 s0" mask="url(#d2-1117527993)"/><path fill="none" marker-end="url(#mk-d2-1117527993-3488378134)" d="M320.5 568.5v115" class="connection stroke-B1 s0" mask="url(#d2-1117527993)"/><path fill="none" marker-end="url(#mk-d2-1117527993-3488378134)" d="M641 726.5v-156" class="connection stroke-B1 s0" mask="url(#d2-1117527993)"/><text x="641.5" y="653" class="text-italic fill-N2 s1">아니면 다음 도출로</text><path fill="none" marker-end="url(#mk-d2-1117527993-3488378134)" d="M480.75 1037.5v136" class="connection stroke-B1 s0" mask="url(#d2-1117527993)"/><text x="481" y="1112" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-1117527993-3488378134)" d="M480.75 1245v94" class="connection stroke-B1 s0" mask="url(#d2-1117527993)"/><path fill="none" marker-end="url(#mk-d2-1117527993-3488378134)" d="M1163.75 568.5V1339" class="connection stroke-B1 s0" mask="url(#d2-1117527993)"/><text x="1164" y="960" class="text-italic fill-N2 s1">이 화살표에는 끝이 없다</text><path fill="none" marker-end="url(#mk-d2-1117527993-3488378134)" d="M480.75 1459c0 38 44.6 58 219.097 97.125" class="connection stroke-B1 s0" mask="url(#d2-1117527993)"/><path fill="none" marker-end="url(#mk-d2-1117527993-3488378134)" d="M1163.75 1459c0 38-44.6 58-219.097 97.125" class="connection stroke-B1 s0" mask="url(#d2-1117527993)"/><mask id="d2-1117527993" width="1737" height="1812" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1737v1812H-91z"/><path d="M559 637h165v21H559zM450 1096h62v21h-62zM1061 944h206v21h-206z"/></mask></svg>