<svg xmlns="http://www.w3.org/2000/svg" width="966" height="1978" class="d2-4146649363 d2-svg" viewBox="-165 -101 966 1978"><rect width="966" height="1978" x="-165" y="-101" rx="0" style="fill:#fff"/><style>.d2-4146649363 .text-bold{font-weight:700}.d2-4146649363 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4146649363 .fill-N1{fill:#0a0f25}.d2-4146649363 .fill-N2{fill:#676c7e}.d2-4146649363 .fill-B5{fill:#edf0fd}.d2-4146649363 .fill-B6{fill:#f7f8fe}.d2-4146649363 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="318" cy="55.5" class="shape stroke-B1 fill-B6 s0" rx="166" ry="55.5"/></g><text x="318" y="53" class="text-bold fill-N1 s1"><tspan x="318" dy="0">⟨M, w⟩</tspan><tspan x="318" dy="18.5">기계 하나와 입력 하나</tspan></text></g><g ><g class="shape"><path d="M101 232h433v380H101z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="317.5" y="265" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">변환기 — 여기가 환원이다</text></g><g ><g class="shape"><path d="M89 733h458v82H89z" class="stroke-B1 fill-B6 s0"/></g><text x="318" y="771.5" class="text-bold fill-N1 s1"><tspan x="318" dy="0">술어논리 문장 φ(M, w)</tspan><tspan x="318" dy="18.5">시작 조건 ∧ 전이 조건 ∧ 유지 조건 → ∃ 시각 (정지)</tspan></text></g><g ><g class="shape"><path d="M222 936h191v98H222z" class="stroke-B1 fill-B6 s0"/></g><text x="317.5" y="974.5" class="text-bold fill-N1 s1"><tspan x="317.5" dy="0">있다고 가정한</tspan><tspan x="317.5" dy="17.667">논리적 참 판정기</tspan><tspan x="317.5" dy="17.667">⊨ φ 인가</tspan></text></g><g ><g class="shape"><ellipse cx="317.5" cy="1166" class="shape stroke-B1 fill-B6 s0" rx="95.5" ry="32"/></g><text x="317.5" y="1171.5" class="text-bold fill-N1 s1">예 / 아니오</text></g><g ><g class="shape"><path d="M0 1298h635v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="317.5" y="1336.5" class="text-bold fill-N1 s1"><tspan x="317.5" dy="0">이 셋을 이어 붙인 것 전체가 하나의 기계다.</tspan><tspan x="317.5" dy="17.667">⟨M, w⟩ 를 받아 반드시 멈추고 정지 여부를 답한다 — 정지 판정 기계다.</tspan><tspan x="317.5" dy="17.667">그런데 앞 절에서 그런 기계가 없다고 증명했다</tspan></text></g><g ><g class="shape"><path d="M165 1496h305v82H165z" class="stroke-B1 fill-B6 s0"/></g><text x="317.5" y="1534.5" class="text-bold fill-N1 s1"><tspan x="317.5" dy="0">따라서 그런 판정기는 없다</tspan><tspan x="317.5" dy="18.5">= 술어논리는 결정 불가능하다</tspan></text></g><path fill="transparent" stroke="transparent" d="M-64 1598h764v178H-64z" class="shape s0"/><g ><g class="shape"><path d="M125 278h385v98H125z" class="stroke-B1 fill-B5 s0"/></g><text x="317.5" y="316.5" class="text-bold fill-N1 s1"><tspan x="317.5" dy="0">기계적이다</tspan><tspan x="317.5" dy="17.667">표를 훑어 문장을 조립할 뿐이다.</tspan><tspan x="317.5" dy="17.667">계산 결과를 미리 알 필요가 없다</tspan></text></g><g ><g class="shape"><path d="M125 400h385v82H125z" class="stroke-B1 fill-B5 s0"/></g><text x="317.5" y="438.5" class="text-bold fill-N1 s1"><tspan x="317.5" dy="0">반드시 멈춘다</tspan><tspan x="317.5" dy="18.5">전이표가 유한하므로 조립도 유한하다</tspan></text></g><g ><g class="shape"><path d="M125 506h385v82H125z" class="stroke-B1 fill-B5 s0"/></g><text x="317.5" y="544.5" class="text-bold fill-N1 s1"><tspan x="317.5" dy="0">옳게 옮긴다</tspan><tspan x="317.5" dy="18.5">⊨ φ 인 것과 M 이 w 에서 멈추는 것이 같다</tspan></text></g><text x="280.5" y="1638" class="text-bold fill-N1 s1"><tspan x="280.5" dy="0">방향을 뒤집지 마라. 환원은 ‘어려운 것을 새 문제로 옮기는’ 화살표다.</tspan><tspan x="280.5" dy="17.667">정지 문제 → 논리적 참 은 논리적 참 판정이 정지 문제만큼 어렵다는 말이고,</tspan><tspan x="280.5" dy="17.667">반대 방향은 아무것도 말해 주지 않는다. 이 방향 착각이 가장 흔한 오류다</tspan></text><text x="318" y="1715" class="fill-N1 s1"><tspan x="318" dy="0">변환기 자체가 멈춰야 한다는 조건을 빠뜨리기 쉽다. 변환기가 안 멈추면</tspan><tspan x="318" dy="17.667">이어 붙인 전체도 안 멈추고, 그러면 정지 판정 기계를 얻지 못해 모순이 나오지 않는다.</tspan><tspan x="318" dy="17.667">환원은 계산 가능한 함수여야 한다는 말이 이 조건이다</tspan></text><marker id="mk-d2-4146649363-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4146649363-3488378134)" d="M317.983 113c-.383 46.4-.483 70.7-.483 115.5" class="connection stroke-B1 s0" mask="url(#d2-4146649363)"/><text x="318" y="177" class="text-italic fill-N2 s1">받는다</text><path fill="none" marker-end="url(#mk-d2-4146649363-3488378134)" d="M317.5 613.5v116" class="connection stroke-B1 s0" mask="url(#d2-4146649363)"/><text x="318" y="678" class="text-italic fill-N2 s1">만든다</text><path fill="none" marker-end="url(#mk-d2-4146649363-3488378134)" d="M317.5 816.5v116" class="connection stroke-B1 s0" mask="url(#d2-4146649363)"/><text x="318" y="881" class="text-italic fill-N2 s1">넣는다</text><path fill="none" marker-end="url(#mk-d2-4146649363-3488378134)" d="M317.5 1036c0 38 .1 58 .46 94" class="connection stroke-B1 s0" mask="url(#d2-4146649363)"/><path fill="none" marker-end="url(#mk-d2-4146649363-3488378134)" d="M317.98 1200c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-4146649363)"/><path fill="none" marker-end="url(#mk-d2-4146649363-3488378134)" d="M317.5 1398v94" class="connection stroke-B1 s0" mask="url(#d2-4146649363)"/><mask id="d2-4146649363" width="966" height="1978" x="-165" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-165-101h966v1978h-966z"/><path d="M287 161h62v21h-62zM287 662h62v21h-62zM287 865h62v21h-62z"/></mask></svg>