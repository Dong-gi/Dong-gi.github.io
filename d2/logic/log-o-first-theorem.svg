<svg xmlns="http://www.w3.org/2000/svg" width="1076" height="1536" class="d2-281050609 d2-svg" viewBox="-101 -101 1076 1536"><rect width="1076" height="1536" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-281050609 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-281050609 .fill-N1{fill:#0a0f25}.d2-281050609 .fill-B4{fill:#e3e9fd}.d2-281050609 .fill-B5{fill:#edf0fd}.d2-281050609 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M299 0h358v114H299z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="478" y="38.5" class="text-bold fill-N1 s0"><tspan x="478" dy="0">대각화 보조정리를 ψ(x) = ¬Prov(x) 에</tspan><tspan x="478" dy="17.25">적용해 얻은 문장 G</tspan><tspan x="478" dy="17.25">T ⊢ G ↔ ¬Prov(⌜G⌝)</tspan><tspan x="478" dy="17.25">읽기: ‘나는 T 에서 증명되지 않는다’</tspan></text></g><g ><g class="shape"><path d="M96 246h346v434H96z" class="stroke-B1 fill-B4 s1"/></g><text x="269" y="279" class="text-bold fill-N1 s2"><tspan x="269" dy="0">갈래 1 — T ⊬ G</tspan><tspan x="269" dy="32">(일관성만으로 닫힌다)</tspan></text></g><g ><g class="shape"><path d="M502 214h372v498H502z" class="stroke-B1 fill-B4 s1"/></g><text x="688" y="247" class="text-bold fill-N1 s2"><tspan x="688" dy="0">갈래 2 — T ⊬ ¬G</tspan><tspan x="688" dy="32">(여기가 어려운 쪽이다)</tspan></text></g><g ><g class="shape"><path d="M0 833h537v332H0z" class="stroke-B1 fill-B4 s1"/></g><text x="268.5" y="866" class="text-bold fill-N1 s2">그리고 G 는 표준 모형 ℕ 에서 참이다</text></g><text x="268.5" y="1281" class="text-bold fill-N1 s0"><tspan x="268.5" dy="0">이 마지막 줄은 우리가 메타언어에서 확인한 것이지</tspan><tspan x="268.5" dy="17.25">T 가 증명한 것이 아니다.</tspan><tspan x="268.5" dy="17.25">‘참’ 은 표준 모형 ℕ 에서 참이라는 뜻이고,</tspan><tspan x="268.5" dy="17.25">T 의 모든 모형에서 참이라는 뜻이 아니다</tspan></text><g ><g class="shape"><path d="M124 320h290v66H124z" class="stroke-B1 fill-B5 s1"/></g><text x="269" y="358.5" class="text-bold fill-N1 s0">① T ⊢ G 라고 하자</text></g><g ><g class="shape"><path d="M124 394h290v98H124z" class="stroke-B1 fill-B5 s1"/></g><text x="269" y="432.5" class="text-bold fill-N1 s0"><tspan x="269" dy="0">② 도출이 실제로 있으니</tspan><tspan x="269" dy="17.667">그 번호를 넣어</tspan><tspan x="269" dy="17.667">T ⊢ Prov(⌜G⌝)</tspan></text></g><g ><g class="shape"><path d="M124 500h290v82H124z" class="stroke-B1 fill-B5 s1"/></g><text x="269" y="538.5" class="text-bold fill-N1 s0"><tspan x="269" dy="0">③ 그런데 G 의 뜻에서</tspan><tspan x="269" dy="18.5">T ⊢ ¬Prov(⌜G⌝)</tspan></text></g><g ><g class="shape"><path d="M124 590h290v82H124z" class="stroke-B1 fill-B5 s1"/></g><text x="269" y="628.5" class="text-bold fill-N1 s0"><tspan x="269" dy="0">④ 둘 다 도출되니 T 가 비일관.</tspan><tspan x="269" dy="18.5">조건 (다) 위반이다</tspan></text></g><g ><g class="shape"><path d="M510 288h356v66H510z" class="stroke-B1 fill-B5 s1"/></g><text x="688" y="326.5" class="text-bold fill-N1 s0">① T ⊢ ¬G 라고 하자</text></g><g ><g class="shape"><path d="M510 362h356v98H510z" class="stroke-B1 fill-B5 s1"/></g><text x="688" y="400.5" class="text-bold fill-N1 s0"><tspan x="688" dy="0">② 그러면 T ⊢ Prov(⌜G⌝).</tspan><tspan x="688" dy="17.667">‘G 의 도출이 있다’ 를</tspan><tspan x="688" dy="17.667">T 가 증명한다</tspan></text></g><g ><g class="shape"><path d="M510 468h356v98H510z" class="stroke-B1 fill-B5 s1"/></g><text x="688" y="506.5" class="text-bold fill-N1 s0"><tspan x="688" dy="0">③ 그런데 갈래 1 에서</tspan><tspan x="688" dy="17.667">실제 도출은 없었다. 즉 낱낱의</tspan><tspan x="688" dy="17.667">수 n 마다 T ⊢ ¬Prf(n, ⌜G⌝)</tspan></text></g><g ><g class="shape"><path d="M510 574h356v130H510z" class="stroke-B1 fill-B5 s1"/></g><text x="688" y="612.5" class="text-bold fill-N1 s0"><tspan x="688" dy="0">④ ‘하나 있다’ 는 증명하면서 후보를</tspan><tspan x="688" dy="17">대면 모두 아니라고 증명한다</tspan><tspan x="688" dy="17">= ω-비일관.</tspan><tspan x="688" dy="17">로서는 G 를 손봐</tspan><tspan x="688" dy="17">단순 일관성만으로 닫았다</tspan></text></g><g ><g class="shape"><path d="M125 879h286v82H125z" class="stroke-B1 fill-B5 s1"/></g><text x="268" y="917.5" class="text-bold fill-N1 s0"><tspan x="268" dy="0">① 갈래 1 에서</tspan><tspan x="268" dy="18.5">T ⊬ G 를 얻었다</tspan></text></g><g ><g class="shape"><path d="M125 969h286v82H125z" class="stroke-B1 fill-B5 s1"/></g><text x="268" y="1007.5" class="text-bold fill-N1 s0"><tspan x="268" dy="0">② 그러니 어떤 자연수도</tspan><tspan x="268" dy="18.5">G 의 도출 번호가 아니다</tspan></text></g><g ><g class="shape"><path d="M125 1059h286v98H125z" class="stroke-B1 fill-B5 s1"/></g><text x="268" y="1097.5" class="text-bold fill-N1 s0"><tspan x="268" dy="0">③ ℕ 에서 ∃y Prf(y, ⌜G⌝) 는 거짓</tspan><tspan x="268" dy="17.667">→ ¬Prov(⌜G⌝) 는 참</tspan><tspan x="268" dy="17.667">→ G 는 참</tspan></text></g><marker id="mk-d2-281050609-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-281050609-3488378134)" d="M364.718 114.909C288.1 154 268.5 180.4 268.5 242" class="connection stroke-B1 s1" mask="url(#d2-281050609)"/><path fill="none" marker-end="url(#mk-d2-281050609-3488378134)" d="M591.282 114.909C667.9 154 687.5 174 687.5 210" class="connection stroke-B1 s1" mask="url(#d2-281050609)"/><path fill="none" marker-end="url(#mk-d2-281050609-3488378134)" d="M268.5 681.5v148" class="connection stroke-B1 s1" mask="url(#d2-281050609)"/><text x="268.5" y="762" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">갈래 1 에서만 따라 나온다</text><path fill="none" marker-end="url(#mk-d2-281050609-3488378134)" d="M268.5 1167v94" class="connection stroke-B1 s1" mask="url(#d2-281050609)"/><mask id="d2-281050609" width="1076" height="1536" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H975v1536H-101z"/><path d="M160 746h217v21H160z"/></mask></svg>