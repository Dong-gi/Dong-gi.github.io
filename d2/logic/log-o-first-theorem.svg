<svg xmlns="http://www.w3.org/2000/svg" width="1657" height="1036" class="d2-1263532183 d2-svg" viewBox="-101 -101 1657 1036"><rect width="1657" height="1036" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1263532183 .fill-N1{fill:#0a0f25}.d2-1263532183 .fill-B4{fill:#e3e9fd}.d2-1263532183 .fill-B5{fill:#edf0fd}.d2-1263532183 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M468 0h514v82H468z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="725" y="38.5" class="text-bold fill-N1 s0"><tspan x="725" dy="0">대각화 보조정리를 ψ(x) = ¬Prov(x) 에 적용해 얻은 문장 G</tspan><tspan x="725" dy="18.5">T ⊢ G ↔ ¬Prov(⌜G⌝) 읽기: ‘나는 T 에서 증명되지 않는다’</tspan></text></g><g ><g class="shape"><path d="M86 190h564v242H86z" class="stroke-B1 fill-B4 s1"/></g><text x="368" y="223" class="text-bold fill-N1 s2">갈래 1 — T ⊬ G (일관성만으로 닫힌다)</text></g><g ><g class="shape"><path d="M710 182h745v258H710z" class="stroke-B1 fill-B4 s1"/></g><text x="1082.5" y="215" class="text-bold fill-N1 s2">갈래 2 — T ⊬ ¬G (여기가 어려운 쪽이다)</text></g><g ><g class="shape"><path d="M0 561h736v136H0z" class="stroke-B1 fill-B4 s1"/></g><text x="368" y="594" class="text-bold fill-N1 s2">그리고 G 는 표준 모형 ℕ 에서 참이다</text></g><text x="368.5" y="813" class="text-bold fill-N1 s0"><tspan x="368.5" dy="0">이 마지막 줄은 우리가 메타언어에서 확인한 것이지 T 가 증명한 것이 아니다.</tspan><tspan x="368.5" dy="18.5">‘참’ 은 표준 모형 ℕ 에서 참이라는 뜻이고, T 의 모든 모형에서 참이라는 뜻이 아니다</tspan></text><g ><g class="shape"><path d="M109 236h219v98H109z" class="stroke-B1 fill-B5 s1"/></g><text x="218.5" y="290.5" class="text-bold fill-N1 s0">① T ⊢ G 라고 하자</text></g><g ><g class="shape"><path d="M336 236h290v98H336z" class="stroke-B1 fill-B5 s1"/></g><text x="481" y="274.5" class="text-bold fill-N1 s0"><tspan x="481" dy="0">② 도출이 실제로 있으니</tspan><tspan x="481" dy="17.667">그 번호를 넣어</tspan><tspan x="481" dy="17.667">T ⊢ Prov(⌜G⌝)</tspan></text></g><g ><g class="shape"><path d="M109 342h219v82H109z" class="stroke-B1 fill-B5 s1"/></g><text x="218.5" y="380.5" class="text-bold fill-N1 s0"><tspan x="218.5" dy="0">③ 그런데 G 의 뜻에서</tspan><tspan x="218.5" dy="18.5">T ⊢ ¬Prov(⌜G⌝)</tspan></text></g><g ><g class="shape"><path d="M336 342h290v82H336z" class="stroke-B1 fill-B5 s1"/></g><text x="481" y="380.5" class="text-bold fill-N1 s0"><tspan x="481" dy="0">④ 둘 다 도출되니 T 가 비일관.</tspan><tspan x="481" dy="18.5">조건 (다) 위반이다</tspan></text></g><g ><g class="shape"><path d="M718 228h304v98H718z" class="stroke-B1 fill-B5 s1"/></g><text x="870" y="282.5" class="text-bold fill-N1 s0">① T ⊢ ¬G 라고 하자</text></g><g ><g class="shape"><path d="M1030 228h417v98h-417z" class="stroke-B1 fill-B5 s1"/></g><text x="1238.5" y="266.5" class="text-bold fill-N1 s0"><tspan x="1238.5" dy="0">② 그러면 T ⊢ Prov(⌜G⌝).</tspan><tspan x="1238.5" dy="17.667">‘G 의 도출이 있다’ 를</tspan><tspan x="1238.5" dy="17.667">T 가 증명한다</tspan></text></g><g ><g class="shape"><path d="M718 334h304v98H718z" class="stroke-B1 fill-B5 s1"/></g><text x="870" y="372.5" class="text-bold fill-N1 s0"><tspan x="870" dy="0">③ 그런데 갈래 1 에서</tspan><tspan x="870" dy="17.667">실제 도출은 없었다. 즉 낱낱의</tspan><tspan x="870" dy="17.667">수 n 마다 T ⊢ ¬Prf(n, ⌜G⌝)</tspan></text></g><g ><g class="shape"><path d="M1030 334h417v98h-417z" class="stroke-B1 fill-B5 s1"/></g><text x="1238.5" y="372.5" class="text-bold fill-N1 s0"><tspan x="1238.5" dy="0">④ ‘하나 있다’ 는 증명하면서 후보를</tspan><tspan x="1238.5" dy="17.667">대면 모두 아니라고 증명한다 = ω-비일관.</tspan><tspan x="1238.5" dy="17.667">로서는 G 를 손봐 단순 일관성만으로 닫았다</tspan></text></g><g ><g class="shape"><path d="M8 607h168v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="92" y="645.5" class="text-bold fill-N1 s0"><tspan x="92" dy="0">① 갈래 1 에서</tspan><tspan x="92" dy="18.5">T ⊬ G 를 얻었다</tspan></text></g><g ><g class="shape"><path d="M184 607h250v82H184z" class="stroke-B1 fill-B5 s1"/></g><text x="309" y="645.5" class="text-bold fill-N1 s0"><tspan x="309" dy="0">② 그러니 어떤 자연수도</tspan><tspan x="309" dy="18.5">G 의 도출 번호가 아니다</tspan></text></g><g ><g class="shape"><path d="M442 607h286v82H442z" class="stroke-B1 fill-B5 s1"/></g><text x="585" y="645.5" class="text-bold fill-N1 s0"><tspan x="585" dy="0">③ ℕ 에서 ∃y Prf(y, ⌜G⌝) 는 거짓</tspan><tspan x="585" dy="18.5">→ ¬Prov(⌜G⌝) 는 참 → G 는 참</tspan></text></g><marker id="mk-d2-1263532183-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1263532183-3488378134)" d="M562.062 82.494C407.2 122 368 143.6 368 186" class="connection stroke-B1 s1" mask="url(#d2-1263532183)"/><path fill="none" marker-end="url(#mk-d2-1263532183-3488378134)" d="M888.438 82.494C1043.3 122 1082.5 142 1082.5 178" class="connection stroke-B1 s1" mask="url(#d2-1263532183)"/><path fill="none" marker-end="url(#mk-d2-1263532183-3488378134)" d="M368 433.5v124" class="connection stroke-B1 s1" mask="url(#d2-1263532183)"/><text x="368.5" y="502" style="fill:#676c7e;text-anchor:middle;font-size:16px">갈래 1 에서만 따라 나온다</text><path fill="none" marker-end="url(#mk-d2-1263532183-3488378134)" d="M368 699v94" class="connection stroke-B1 s1" mask="url(#d2-1263532183)"/><mask id="d2-1263532183" width="1657" height="1036" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1657V935H-101z"/><path d="M260 486h217v21H260z"/></mask></svg>