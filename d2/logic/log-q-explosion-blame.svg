<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="1384" class="d2-868016773 d2-svg" viewBox="-101 -101 1248 1384"><rect width="1248" height="1384" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-868016773 .fill-N1{fill:#0a0f25}.d2-868016773 .fill-B4{fill:#e3e9fd}.d2-868016773 .fill-B5{fill:#edf0fd}.d2-868016773 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M17 0h1012v202H17z" class="stroke-B1 fill-B4 s0"/></g><text x="523" y="33" class="text-bold fill-N1 s1">불만 — 결론이 전제와 상관이 없다</text></g><g ><g class="shape"><path d="M141 323h765v136H141z" class="stroke-B1 fill-B4 s0"/></g><text x="523.5" y="356" class="text-bold fill-N1 s1">루이스 논증 — ⊥ 를 한 번도 쓰지 않고 폭발이 나온다</text></g><text x="523.5" y="575" class="text-bold fill-N1 s2"><tspan x="523.5" dy="0">네 줄 어디에도 ⊥ 가 없다. 쓴 것은 ∨I 와 선언 삼단논법 둘뿐이다.</tspan><tspan x="523.5" dy="18.5">그러므로 규칙 목록에서 ⊥E 만 지운다고 폭발이 멈추지 않는다</tspan></text><g ><g class="shape"><path d="M0 696h1046v184H0z" class="stroke-B1 fill-B4 s0"/></g><text x="523" y="729" class="text-bold fill-N1 s1">폭발을 막으려면 셋 가운데 적어도 하나를 버려야 한다</text></g><g ><g class="shape"><path d="M136 980h774v202H136z" class="stroke-B1 fill-B4 s0"/></g><text x="523" y="1013" class="text-bold fill-N1 s1">두 갈래 — 이름과 문제의식만</text></g><g ><g class="shape"><path d="M27 46h446v146H27z" class="stroke-B1 fill-B5 s0"/></g><text x="250" y="92.5" class="text-bold fill-N1 s2"><tspan x="250" dy="0">‘달은 치즈로 되어 있고 치즈로 되어 있지 않다.</tspan><tspan x="250" dy="17">그러므로 오늘 비가 온다’</tspan><tspan x="250" dy="17"> </tspan><tspan x="250" dy="17">고전 논리에서 이 논증은 타당하다.</tspan><tspan x="250" dy="17">전제가 만족가능하지 않으므로 정의에 걸린다</tspan></text></g><g ><g class="shape"><path d="M483 46h536v146H483z" class="stroke-B1 fill-B5 s0"/></g><text x="751" y="84.5" class="text-bold fill-N1 s2"><tspan x="751" dy="0">6장 — 만족가능하지 않은 집합은</tspan><tspan x="751" dy="16.833">무엇이든 귀결로 갖는다</tspan><tspan x="751" dy="16.833"> </tspan><tspan x="751" dy="16.833">7장 — ⊥E, ⊥ 에서 무엇이든</tspan><tspan x="751" dy="16.833"> </tspan><tspan x="751" dy="16.833">두 장 모두 ‘이상하게 느껴지는 것이 정상’ 이라고 적었다</tspan></text></g><g ><g class="shape"><path d="M267 369h84v82h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="309" y="407.5" class="text-bold fill-N1 s2"><tspan x="309" dy="0">1. φ</tspan><tspan x="309" dy="18.5">전제</tspan></text></g><g ><g class="shape"><path d="M359 369h84v82h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="401" y="407.5" class="text-bold fill-N1 s2"><tspan x="401" dy="0">2. ¬φ</tspan><tspan x="401" dy="18.5">전제</tspan></text></g><g ><g class="shape"><path d="M451 369h100v82H451z" class="stroke-B1 fill-B5 s0"/></g><text x="501" y="407.5" class="text-bold fill-N1 s2"><tspan x="501" dy="0">3. φ ∨ ψ</tspan><tspan x="501" dy="18.5">1 에 ∨I</tspan></text></g><g ><g class="shape"><path d="M559 369h221v82H559z" class="stroke-B1 fill-B5 s0"/></g><text x="669.5" y="407.5" class="text-bold fill-N1 s2"><tspan x="669.5" dy="0">4. ψ</tspan><tspan x="669.5" dy="18.5">3, 2 에 선언 삼단논법</tspan></text></g><g ><g class="shape"><path d="M8 742h340v130H8z" class="stroke-B1 fill-B5 s0"/></g><text x="178" y="788.5" class="text-bold fill-N1 s2"><tspan x="178" dy="0">⊥E 를 버린다</tspan><tspan x="178" dy="17.25"> </tspan><tspan x="178" dy="17.25">최소 논리가 된다.</tspan><tspan x="178" dy="17.25">그러나 위의 루이스 논증이 남는다</tspan></text></g><g ><g class="shape"><path d="M356 742h337v130H356z" class="fill-B5" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:8,7.892511"/></g><text x="524.5" y="788.5" class="text-bold fill-N1 s2"><tspan x="524.5" dy="0">∨I 를 버린다</tspan><tspan x="524.5" dy="17.25"> </tspan><tspan x="524.5" dy="17.25">택하기 어렵다.</tspan><tspan x="524.5" dy="17.25">이것 없이는 ∨ 를 만들 방법이 없다</tspan></text></g><g ><g class="shape"><path d="M701 742h337v130H701z" class="stroke-B1 fill-B5 s0"/></g><text x="869.5" y="780.5" class="text-bold fill-N1 s2"><tspan x="869.5" dy="0">선언 삼단논법을 버린다</tspan><tspan x="869.5" dy="17"> </tspan><tspan x="869.5" dy="17">대부분의 갈래가 이쪽이다.</tspan><tspan x="869.5" dy="17">φ 하나로 만든 φ ∨ ψ 는</tspan><tspan x="869.5" dy="17">ψ 에 대해 아무 정보도 담지 않는다</tspan></text></g><g ><g class="shape"><path d="M146 1026h353v146H146z" class="stroke-B1 fill-B5 s0"/></g><text x="322.5" y="1072.5" class="text-bold fill-N1 s2"><tspan x="322.5" dy="0">관련성 논리</tspan><tspan x="322.5" dy="17"> </tspan><tspan x="322.5" dy="17">변수 공유 — φ → ψ 가 정리이려면</tspan><tspan x="322.5" dy="17">φ 와 ψ 가 문장문자를 공유해야 한다.</tspan><tspan x="322.5" dy="17">(P ∧ ¬P) → Q 도 P → (Q → P) 도 걸러진다</tspan></text></g><g ><g class="shape"><path d="M509 1026h391v146H509z" class="stroke-B1 fill-B5 s0"/></g><text x="704.5" y="1064.5" class="text-bold fill-N1 s2"><tspan x="704.5" dy="0">준일관 논리</tspan><tspan x="704.5" dy="16.833"> </tspan><tspan x="704.5" dy="16.833">비일관적인 집합에서도</tspan><tspan x="704.5" dy="16.833">모든 것을 도출하지는 않는다.</tspan><tspan x="704.5" dy="16.833">부딪히는 법 조항, 어긋난 데이터베이스,</tspan><tspan x="704.5" dy="16.833">아직 정리되지 않은 과학 이론</tspan></text></g><marker id="mk-d2-868016773-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-868016773-3488378134)" d="M523 203.5v116" class="connection stroke-B1 s0" mask="url(#d2-868016773)"/><text x="523" y="268" style="fill:#676c7e;text-anchor:middle;font-size:16px">그래서 ⊥E 만 빼 보면</text><path fill="none" marker-end="url(#mk-d2-868016773-3488378134)" d="M523 461v94" class="connection stroke-B1 s0" mask="url(#d2-868016773)"/><path fill="none" marker-end="url(#mk-d2-868016773-3488378134)" d="M523 598v94" class="connection stroke-B1 s0" mask="url(#d2-868016773)"/><path fill="none" marker-end="url(#mk-d2-868016773-3488378134)" d="M523 882v94" class="connection stroke-B1 s0" mask="url(#d2-868016773)"/><mask id="d2-868016773" width="1248" height="1384" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1248v1384H-101z"/><path d="M438 252h170v21H438z"/></mask></svg>