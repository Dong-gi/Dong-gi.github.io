<svg xmlns="http://www.w3.org/2000/svg" width="1775" height="792" class="d2-488528879 d2-svg" viewBox="-91 -95 1775 792"><rect width="1775" height="792" x="-91" y="-95" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-488528879 .fill-N1{fill:#0a0f25}.d2-488528879 .fill-B4{fill:#e3e9fd}.d2-488528879 .fill-B5{fill:#edf0fd}.d2-488528879 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M10 46h1056v174H10z" class="stroke-B1 fill-B4 s0"/></g><text x="538" y="33" class="text-bold fill-N1 s1">메타언어 — 우리가 말하는 데 쓰는 언어</text></g><g ><g class="shape"><path d="M101 406h1002v190H101z" class="stroke-B1 fill-B4 s0"/></g><text x="602" y="393" class="text-bold fill-N1 s1">대상언어 — 우리가 연구 대상으로 삼는 언어</text></g><text x="1349.5" y="66" class="fill-N1 s2"><tspan x="1349.5" dy="0">왜 이 구분이 필요한가 — 13장부터 증명하는 것이</tspan><tspan x="1349.5" dy="16.5">전부 이 언어에 대한 주장이다. ‘증명할 수 있는 것은</tspan><tspan x="1349.5" dy="16.5">의미론이 인정하는 것이다’ 는 대상언어로 적을 수 없다.</tspan><tspan x="1349.5" dy="16.5">그래서 그 정리들을 메타정리라 부른다.</tspan><tspan x="1349.5" dy="16.5"> </tspan><tspan x="1349.5" dy="16.5">17장이 특별한 이유 — 괴델은 대상언어가 위 상자의</tspan><tspan x="1349.5" dy="16.5">말을 흉내 내게 만든다. 두 상자가 원래 갈라져 있다는</tspan><tspan x="1349.5" dy="16.5">것을 지금 확실히 해 두면 그때 무슨 일이 벌어지는지</tspan><tspan x="1349.5" dy="16.5">보인다. 일상어에도 있는 구분이다 —</tspan><tspan x="1349.5" dy="16.5">‘서울’ 은 두 글자이고 서울은 도시다</tspan></text><g ><g class="shape"><path d="M40 84h309v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="194.5" y="122.5" class="text-bold fill-N1 s2"><tspan x="194.5" dy="0">메타변수</tspan><tspan x="194.5" dy="17.667">φ ψ χ — 적형식 하나를 가리킨다</tspan><tspan x="194.5" dy="17.667">Γ Δ — 적형식 집합을 가리킨다</tspan></text></g><g ><g class="shape"><path d="M409 84h278v98H409z" class="stroke-B1 fill-B5 s0"/></g><text x="548" y="122.5" class="text-bold fill-N1 s2"><tspan x="548" dy="0">한국어 낱말</tspan><tspan x="548" dy="17.667">‘적형식이다’ ‘주연결자’</tspan><tspan x="548" dy="17.667">‘부분식’ ‘도식’ ‘줄임말’</tspan></text></g><g ><g class="shape"><path d="M747 76h289v114H747z" class="stroke-B1 fill-B5 s0"/></g><text x="891.5" y="114.5" class="text-bold fill-N1 s2"><tspan x="891.5" dy="0">이 언어로 하는 말의 예</tspan><tspan x="891.5" dy="17.25">‘((P ∧ Q) → ¬R) 은 적형식이다’</tspan><tspan x="891.5" dy="17.25">‘φ 의 주연결자가 ∧ 이면</tspan><tspan x="891.5" dy="17.25"> φ 는 (ψ ∧ χ) 꼴이다’</tspan></text></g><g ><g class="shape"><path d="M131 444h226v114H131z" class="stroke-B1 fill-B5 s0"/></g><text x="244" y="482.5" class="text-bold fill-N1 s2"><tspan x="244" dy="0">어휘가 전부다</tspan><tspan x="244" dy="17.25">문장문자 P Q R P₁ P₂ …</tspan><tspan x="244" dy="17.25">연결자 ¬ ∧ ∨ → ↔</tspan><tspan x="244" dy="17.25">괄호 ( )</tspan></text></g><g ><g class="shape"><path d="M417 436h262v130H417z" class="stroke-B1 fill-B5 s0"/></g><text x="548" y="474.5" class="text-bold fill-N1 s2"><tspan x="548" dy="0">이 언어로 적을 수 있는 것</tspan><tspan x="548" dy="17">P</tspan><tspan x="548" dy="17">¬R</tspan><tspan x="548" dy="17">(P ∧ Q)</tspan><tspan x="548" dy="17">((P ∧ Q) → ¬R)</tspan></text></g><g ><g class="shape"><path d="M739 444h334v114H739z" class="stroke-B1 fill-B5 s0"/></g><text x="906" y="482.5" class="text-bold fill-N1 s2"><tspan x="906" dy="0">여기 없는 것</tspan><tspan x="906" dy="17.25">φ ψ Γ</tspan><tspan x="906" dy="17.25">‘적형식’ 이라는 낱말</tspan><tspan x="906" dy="17.25">— 자기 자신에 대해 말하지 못한다</tspan></text></g><marker id="mk-d2-488528879-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-488528879-3488378134)" d="M548 221.5v140" class="connection stroke-B1 s0" mask="url(#d2-488528879)"/><text x="548" y="298" style="fill:#676c7e;text-anchor:middle;font-size:16px">…에 대해 말한다</text><mask id="d2-488528879" width="1775" height="792" x="-91" y="-95" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-95h1775v792H-91z"/><path d="M480 282h136v21H480z"/></mask></svg>