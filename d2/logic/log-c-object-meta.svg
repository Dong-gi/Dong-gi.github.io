<svg xmlns="http://www.w3.org/2000/svg" width="870" height="1152" class="d2-3496866089 d2-svg" viewBox="-101 -101 870 1152"><rect width="870" height="1152" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3496866089 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3496866089 .fill-N1{fill:#0a0f25}.d2-3496866089 .fill-B4{fill:#e3e9fd}.d2-3496866089 .fill-B5{fill:#edf0fd}.d2-3496866089 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M5 0h659v306H5z" class="stroke-B1 fill-B4 s0"/></g><text x="334.5" y="33" class="text-bold fill-N1 s1">메타언어 — 우리가 말하는 데 쓰는 언어</text></g><g ><g class="shape"><path d="M0 427h668v338H0z" class="stroke-B1 fill-B4 s0"/></g><text x="334" y="460" class="text-bold fill-N1 s1">대상언어 — 우리가 연구 대상으로 삼는 언어</text></g><text x="333.5" y="801" class="fill-N1 s2"><tspan x="333.5" dy="0">왜 이 구분이 필요한가 — 13장부터 증명하는 것이</tspan><tspan x="333.5" dy="16.5">전부 이 언어에 대한 주장이다. ‘증명할 수 있는 것은</tspan><tspan x="333.5" dy="16.5">의미론이 인정하는 것이다’ 는 대상언어로 적을 수 없다.</tspan><tspan x="333.5" dy="16.5">그래서 그 정리들을 메타정리라 부른다.</tspan><tspan x="333.5" dy="16.5"> </tspan><tspan x="333.5" dy="16.5">17장이 특별한 이유 — 괴델은 대상언어가 위 상자의</tspan><tspan x="333.5" dy="16.5">말을 흉내 내게 만든다. 두 상자가 원래 갈라져 있다는</tspan><tspan x="333.5" dy="16.5">것을 지금 확실히 해 두면 그때 무슨 일이 벌어지는지</tspan><tspan x="333.5" dy="16.5">보인다. 일상어에도 있는 구분이다 —</tspan><tspan x="333.5" dy="16.5">‘서울’ 은 두 글자이고 서울은 도시다</tspan></text><g ><g class="shape"><path d="M29 46h309v98H29z" class="stroke-B1 fill-B5 s0"/></g><text x="183.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="183.5" dy="0">메타변수</tspan><tspan x="183.5" dy="17.667">φ ψ χ — 적형식 하나를 가리킨다</tspan><tspan x="183.5" dy="17.667">Γ Δ — 적형식 집합을 가리킨다</tspan></text></g><g ><g class="shape"><path d="M362 46h278v98H362z" class="stroke-B1 fill-B5 s0"/></g><text x="501" y="84.5" class="text-bold fill-N1 s2"><tspan x="501" dy="0">한국어 낱말</tspan><tspan x="501" dy="17.667">‘적형식이다’ ‘주연결자’</tspan><tspan x="501" dy="17.667">‘부분식’ ‘도식’ ‘줄임말’</tspan></text></g><g ><g class="shape"><path d="M29 168h309v114H29z" class="stroke-B1 fill-B5 s0"/></g><text x="183.5" y="206.5" class="text-bold fill-N1 s2"><tspan x="183.5" dy="0">이 언어로 하는 말의 예</tspan><tspan x="183.5" dy="17.25">‘((P ∧ Q) → ¬R) 은 적형식이다’</tspan><tspan x="183.5" dy="17.25">‘φ 의 주연결자가 ∧ 이면</tspan><tspan x="183.5" dy="17.25"> φ 는 (ψ ∧ χ) 꼴이다’</tspan></text></g><g ><g class="shape"><path d="M24 473h334v130H24z" class="stroke-B1 fill-B5 s0"/></g><text x="191" y="519.5" class="text-bold fill-N1 s2"><tspan x="191" dy="0">어휘가 전부다</tspan><tspan x="191" dy="17.25">문장문자 P Q R P₁ P₂ …</tspan><tspan x="191" dy="17.25">연결자 ¬ ∧ ∨ → ↔</tspan><tspan x="191" dy="17.25">괄호 ( )</tspan></text></g><g ><g class="shape"><path d="M382 473h262v130H382z" class="stroke-B1 fill-B5 s0"/></g><text x="513" y="511.5" class="text-bold fill-N1 s2"><tspan x="513" dy="0">이 언어로 적을 수 있는 것</tspan><tspan x="513" dy="17">P</tspan><tspan x="513" dy="17">¬R</tspan><tspan x="513" dy="17">(P ∧ Q)</tspan><tspan x="513" dy="17">((P ∧ Q) → ¬R)</tspan></text></g><g ><g class="shape"><path d="M24 627h334v114H24z" class="stroke-B1 fill-B5 s0"/></g><text x="191" y="665.5" class="text-bold fill-N1 s2"><tspan x="191" dy="0">여기 없는 것</tspan><tspan x="191" dy="17.25">φ ψ Γ</tspan><tspan x="191" dy="17.25">‘적형식’ 이라는 낱말</tspan><tspan x="191" dy="17.25">— 자기 자신에 대해 말하지 못한다</tspan></text></g><marker id="mk-d2-3496866089-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3496866089-3488378134)" d="M334 307.5v116" class="connection stroke-B1 s0" mask="url(#d2-3496866089)"/><text x="334" y="372" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">…에 대해 말한다</text><mask id="d2-3496866089" width="870" height="1152" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h870v1152h-870z"/><path d="M266 356h136v21H266z"/></mask></svg>