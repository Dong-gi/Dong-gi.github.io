<svg xmlns="http://www.w3.org/2000/svg" width="1546" height="1351" class="d2-2036522061 d2-svg" viewBox="-91 -101 1546 1351"><rect width="1546" height="1351" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2036522061 .fill-N1{fill:#0a0f25}.d2-2036522061 .fill-B4{fill:#e3e9fd}.d2-2036522061 .fill-B5{fill:#edf0fd}.d2-2036522061 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M419 0h694v416H419z" class="stroke-B1 fill-B4 s0"/></g><text x="766" y="33" class="text-bold fill-N1 s1">이 장의 개념 ↔ 검증 도구의 이름</text></g><g ><g class="shape"><path d="M237 536h1117v142H237z" class="stroke-B1 fill-B4 s0"/></g><text x="795.5" y="523" class="text-bold fill-N1 s1">요구사항을 시제 논리 식으로 적는다</text></g><g ><g class="shape"><path d="M10 818h1008v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="514" y="805" class="text-bold fill-N1 s1">기계가 판정한다</text></g><text x="766.5" y="1112" class="text-bold fill-N1 s2"><tspan x="766.5" dy="0">실제로 걸리는 벽 — 상태 폭발</tspan><tspan x="766.5" dy="17.667">변수 30개가 켜짐/꺼짐이면 상태가 2³⁰ 개다. 6장의 지수 폭발과 같은 뿌리다.</tspan><tspan x="766.5" dy="17.667">기호적 표현과 부분 순서 축약 같은 기법이 이 벽을 미는 일을 한다</tspan></text><g ><g class="shape"><path d="M427 46h188v66H427z" class="stroke-B1 fill-B5 s0"/></g><text x="521" y="84.5" class="text-bold fill-N1 s2">18장에서 세운 것</text></g><g ><g class="shape"><path d="M623 46h482v66H623z" class="stroke-B1 fill-B5 s0"/></g><text x="864" y="84.5" class="text-bold fill-N1 s2">실무에서 부르는 이름</text></g><g ><g class="shape"><path d="M427 120h188v66H427z" class="stroke-B1 fill-B5 s0"/></g><text x="521" y="158.5" class="text-bold fill-N1 s2">세계 w ∈ W</text></g><g ><g class="shape"><path d="M623 120h482v66H623z" class="stroke-B1 fill-B5 s0"/></g><text x="864" y="158.5" class="text-bold fill-N1 s2">시스템의 상태 — 변수 값들의 조합 하나</text></g><g ><g class="shape"><path d="M427 194h188v66H427z" class="stroke-B1 fill-B5 s0"/></g><text x="521" y="232.5" class="text-bold fill-N1 s2">접근관계 wRu</text></g><g ><g class="shape"><path d="M623 194h482v66H623z" class="stroke-B1 fill-B5 s0"/></g><text x="864" y="232.5" class="text-bold fill-N1 s2">한 걸음 실행하면 u 로 갈 수 있다 (전이)</text></g><g ><g class="shape"><path d="M427 268h188v66H427z" class="stroke-B1 fill-B5 s0"/></g><text x="521" y="306.5" class="text-bold fill-N1 s2">배당 V(P) ⊆ W</text></g><g ><g class="shape"><path d="M623 268h482v66H623z" class="stroke-B1 fill-B5 s0"/></g><text x="864" y="306.5" class="text-bold fill-N1 s2">각 상태에서 성립하는 원자 명제 (버퍼가 비었다 등)</text></g><g ><g class="shape"><path d="M427 342h188v66H427z" class="stroke-B1 fill-B5 s0"/></g><text x="521" y="380.5" class="text-bold fill-N1 s2">ℳ, w ⊨ φ 판정</text></g><g ><g class="shape"><path d="M623 342h482v66H623z" class="stroke-B1 fill-B5 s0"/></g><text x="864" y="380.5" class="text-bold fill-N1 s2">모형 검사 — 초기 상태에서 요구사항이 성립하는가</text></g><g ><g class="shape"><path d="M267 566h293v82H267z" class="stroke-B1 fill-B5 s0"/></g><text x="413.5" y="604.5" class="text-bold fill-N1 s2"><tspan x="413.5" dy="0">안전성 — 나쁜 일이 결코 없다</tspan><tspan x="413.5" dy="18.5">□(¬둘다임계구역)</tspan></text></g><g ><g class="shape"><path d="M620 566h293v82H620z" class="stroke-B1 fill-B5 s0"/></g><text x="766.5" y="604.5" class="text-bold fill-N1 s2"><tspan x="766.5" dy="0">활성 — 좋은 일이 언젠가 온다</tspan><tspan x="766.5" dy="18.5">□(요청 → ◇허가)</tspan></text></g><text x="1148.5" y="597" class="fill-N1 s2"><tspan x="1148.5" dy="0">실무의 LTL 은 □ 를 G, ◇ 를 F 로 적고</tspan><tspan x="1148.5" dy="17.667">다음 걸음 X 와 까지 U 를 더 둔다.</tspan><tspan x="1148.5" dy="17.667">기호가 다를 뿐 이 장의 □ · ◇ 와 같은 것이다</tspan></text><g ><g class="shape"><path d="M40 848h444v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="262" y="886.5" class="text-bold fill-N1 s2"><tspan x="262" dy="0">왜 되는가 — 결정 가능하기 때문이다.</tspan><tspan x="262" dy="17.667">16장에서 술어논리는 결정 불가능했다.</tspan><tspan x="262" dy="17.667">상태가 유한하면 그래프를 훑어 판정이 끝난다</tspan></text></g><g ><g class="shape"><path d="M544 848h444v98H544z" class="stroke-B1 fill-B5 s0"/></g><text x="766" y="886.5" class="text-bold fill-N1 s2"><tspan x="766" dy="0">참이면 증명 끝.</tspan><tspan x="766" dy="17.667">거짓이면 반례를 실행 경로로 내놓는다 —</tspan><tspan x="766" dy="17.667">10장의 반례 모형이 여기서는 버그 재현 절차다</tspan></text></g><marker id="mk-d2-2036522061-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2036522061-3488378134)" d="M766 418v73" class="connection stroke-B1 s0" mask="url(#d2-2036522061)"/><path fill="none" marker-end="url(#mk-d2-2036522061-3488378134)" d="M766 680v134" class="connection stroke-B1 s0" mask="url(#d2-2036522061)"/><path fill="none" marker-end="url(#mk-d2-2036522061-3488378134)" d="M766 978v114" class="connection stroke-B1 s0" mask="url(#d2-2036522061)"/><mask id="d2-2036522061" width="1546" height="1351" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1546v1351H-91z"/></mask></svg>