<svg xmlns="http://www.w3.org/2000/svg" width="1003" height="1624" class="d2-2579656127 d2-svg" viewBox="-91 -101 1003 1624"><rect width="1003" height="1624" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.d2-2579656127 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2579656127 .fill-N1{fill:#0a0f25}.d2-2579656127 .fill-B4{fill:#e3e9fd}.d2-2579656127 .fill-B5{fill:#edf0fd}.d2-2579656127 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M269 0h531v480H269z" class="stroke-B1 fill-B4 s0"/></g><text x="534.5" y="33" class="text-bold fill-N1 s1">이 장의 개념 ↔ 검증 도구의 이름</text></g><g ><g class="shape"><path d="M258 580h553v311H258z" class="stroke-B1 fill-B4 s0"/></g><text x="534.5" y="613" class="text-bold fill-N1 s1">요구사항을 시제 논리 식으로 적는다</text></g><g ><g class="shape"><path d="M10 1011h692v206H10z" class="stroke-B1 fill-B4 s0"/></g><text x="356" y="998" class="text-bold fill-N1 s1">기계가 판정한다</text></g><text x="534.5" y="1353" class="text-bold fill-N1 s2"><tspan x="534.5" dy="0">실제로 걸리는 벽 — 상태 폭발</tspan><tspan x="534.5" dy="17">변수 30개가 켜짐/꺼짐이면 상태가 2³⁰ 개다.</tspan><tspan x="534.5" dy="17">6장의 지수 폭발과 같은 뿌리다.</tspan><tspan x="534.5" dy="17">기호적 표현과 부분 순서 축약 같은 기법이</tspan><tspan x="534.5" dy="17">이 벽을 미는 일을 한다</tspan></text><g ><g class="shape"><path d="M277 46h188v66H277z" class="stroke-B1 fill-B5 s0"/></g><text x="371" y="84.5" class="text-bold fill-N1 s2">18장에서 세운 것</text></g><g ><g class="shape"><path d="M473 46h319v66H473z" class="stroke-B1 fill-B5 s0"/></g><text x="632.5" y="84.5" class="text-bold fill-N1 s2">실무에서 부르는 이름</text></g><g ><g class="shape"><path d="M277 120h188v82H277z" class="stroke-B1 fill-B5 s0"/></g><text x="371" y="166.5" class="text-bold fill-N1 s2">세계 w ∈ W</text></g><g ><g class="shape"><path d="M473 120h319v82H473z" class="stroke-B1 fill-B5 s0"/></g><text x="632.5" y="158.5" class="text-bold fill-N1 s2"><tspan x="632.5" dy="0">시스템의 상태 —</tspan><tspan x="632.5" dy="18.5">변수 값들의 조합 하나</tspan></text></g><g ><g class="shape"><path d="M277 210h188v82H277z" class="stroke-B1 fill-B5 s0"/></g><text x="371" y="256.5" class="text-bold fill-N1 s2">접근관계 wRu</text></g><g ><g class="shape"><path d="M473 210h319v82H473z" class="stroke-B1 fill-B5 s0"/></g><text x="632.5" y="248.5" class="text-bold fill-N1 s2"><tspan x="632.5" dy="0">한 걸음 실행하면</tspan><tspan x="632.5" dy="18.5">u 로 갈 수 있다 (전이)</tspan></text></g><g ><g class="shape"><path d="M277 300h188v82H277z" class="stroke-B1 fill-B5 s0"/></g><text x="371" y="346.5" class="text-bold fill-N1 s2">배당 V(P) ⊆ W</text></g><g ><g class="shape"><path d="M473 300h319v82H473z" class="stroke-B1 fill-B5 s0"/></g><text x="632.5" y="338.5" class="text-bold fill-N1 s2"><tspan x="632.5" dy="0">각 상태에서 성립하는 원자 명제</tspan><tspan x="632.5" dy="18.5">(버퍼가 비었다 등)</tspan></text></g><g ><g class="shape"><path d="M277 390h188v82H277z" class="stroke-B1 fill-B5 s0"/></g><text x="371" y="436.5" class="text-bold fill-N1 s2">ℳ, w ⊨ φ 판정</text></g><g ><g class="shape"><path d="M473 390h319v82H473z" class="stroke-B1 fill-B5 s0"/></g><text x="632.5" y="428.5" class="text-bold fill-N1 s2"><tspan x="632.5" dy="0">모형 검사 — 초기 상태에서</tspan><tspan x="632.5" dy="18.5">요구사항이 성립하는가</tspan></text></g><g ><g class="shape"><path d="M359 626h351v82H359z" class="stroke-B1 fill-B5 s0"/></g><text x="534.5" y="664.5" class="text-bold fill-N1 s2"><tspan x="534.5" dy="0">안전성 — 나쁜 일이 결코 없다</tspan><tspan x="534.5" dy="18.5">□(¬둘다임계구역)</tspan></text></g><g ><g class="shape"><path d="M359 724h351v82H359z" class="stroke-B1 fill-B5 s0"/></g><text x="534.5" y="762.5" class="text-bold fill-N1 s2"><tspan x="534.5" dy="0">활성 — 좋은 일이 언젠가 온다</tspan><tspan x="534.5" dy="18.5">□(요청 → ◇허가)</tspan></text></g><text x="534.5" y="838" class="fill-N1 s2"><tspan x="534.5" dy="0">실무의 LTL 은 □ 를 G, ◇ 를 F 로 적고</tspan><tspan x="534.5" dy="17.667">다음 걸음 X 와 까지 U 를 더 둔다.</tspan><tspan x="534.5" dy="17.667">기호가 다를 뿐 이 장의 □ · ◇ 와 같은 것이다</tspan></text><g ><g class="shape"><path d="M40 1041h296v146H40z" class="stroke-B1 fill-B5 s0"/></g><text x="188" y="1079.5" class="text-bold fill-N1 s2"><tspan x="188" dy="0">왜 되는가 —</tspan><tspan x="188" dy="16.833">결정 가능하기 때문이다.</tspan><tspan x="188" dy="16.833">16장에서 술어논리는</tspan><tspan x="188" dy="16.833">결정 불가능했다.</tspan><tspan x="188" dy="16.833">상태가 유한하면</tspan><tspan x="188" dy="16.833">그래프를 훑어 판정이 끝난다</tspan></text></g><g ><g class="shape"><path d="M396 1049h276v130H396z" class="stroke-B1 fill-B5 s0"/></g><text x="534" y="1087.5" class="text-bold fill-N1 s2"><tspan x="534" dy="0">참이면 증명 끝.</tspan><tspan x="534" dy="17">거짓이면 반례를</tspan><tspan x="534" dy="17">실행 경로로 내놓는다 —</tspan><tspan x="534" dy="17">10장의 반례 모형이</tspan><tspan x="534" dy="17">여기서는 버그 재현 절차다</tspan></text></g><marker id="mk-d2-2579656127-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2579656127-3488378134)" d="M534 482v94" class="connection stroke-B1 s0" mask="url(#d2-2579656127)"/><path fill="none" marker-end="url(#mk-d2-2579656127-3488378134)" d="M534 893v114" class="connection stroke-B1 s0" mask="url(#d2-2579656127)"/><path fill="none" marker-end="url(#mk-d2-2579656127-3488378134)" d="M534 1219v114" class="connection stroke-B1 s0" mask="url(#d2-2579656127)"/><mask id="d2-2579656127" width="1003" height="1624" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101H912v1624H-91z"/></mask></svg>