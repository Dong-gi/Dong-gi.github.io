<svg xmlns="http://www.w3.org/2000/svg" width="1334" height="1289" class="d2-2512055880 d2-svg" viewBox="-89 -89 1334 1289"><rect width="1334" height="1289" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2512055880 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2512055880 .fill-N1{fill:#0a0f25}.d2-2512055880 .fill-B4{fill:#e3e9fd}.d2-2512055880 .fill-B5{fill:#edf0fd}.d2-2512055880 .fill-B6{fill:#f7f8fe}.d2-2512055880 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M368 12h491v182H368z" class="stroke-B1 fill-B4 s0"/></g><text x="613.5" y="45" class="text-bold fill-N1 s1">다툼이 없는 두 줄</text></g><g ><g class="shape"><path d="M324 355h580v166H324z" class="stroke-B1 fill-B4 s0"/></g><text x="614" y="388" class="text-bold fill-N1 s1">고를 수 있는 두 줄 — 전건이 F 인 자리</text></g><g ><g class="shape"><path d="M48 651h187v66H48z" class="stroke-B1 fill-B6 s0"/></g><text x="141.5" y="689.5" class="text-bold fill-N1 s2">둘 다 T 로 채운다</text></g><g ><g class="shape"><path d="M361 651h186v66H361z" class="stroke-B1 fill-B6 s0"/></g><text x="454" y="689.5" class="text-bold fill-N1 s2">둘 다 F 로 채운다</text></g><g ><g class="shape"><path d="M678 651h192v66H678z" class="stroke-B1 fill-B6 s0"/></g><text x="774" y="689.5" class="text-bold fill-N1 s2">F → T 는 F, F → F 는 T</text></g><g ><g class="shape"><path d="M942 651h192v66H942z" class="stroke-B1 fill-B6 s0"/></g><text x="1038" y="689.5" class="text-bold fill-N1 s2">F → T 는 T, F → F 는 F</text></g><g ><g class="shape"><path d="M12 787h260v114H12z" class="stroke-B1 fill-B6 s0"/></g><text x="142" y="825.5" class="text-bold fill-N1 s2"><tspan x="142" dy="0">φ → ψ</tspan><tspan x="142" dy="17.25">새 연결자가 하나 생긴다.</tspan><tspan x="142" dy="17.25">전건이 거짓인 조건문을</tspan><tspan x="142" dy="17.25">주장할 수 있다</tspan></text></g><g ><g class="shape"><path d="M292 787h324v98H292z" class="stroke-B1 fill-B6 s0"/></g><text x="454" y="825.5" class="text-bold fill-N1 s2"><tspan x="454" dy="0">φ ∧ ψ 와 같아진다</tspan><tspan x="454" dy="17.667">‘비는 안 오지만 오면 젖는다’ 를</tspan><tspan x="454" dy="17.667">말할 수 없다</tspan></text></g><g ><g class="shape"><path d="M636 787h276v98H636z" class="stroke-B1 fill-B6 s0"/></g><text x="774" y="825.5" class="text-bold fill-N1 s2"><tspan x="774" dy="0">φ ↔ ψ 와 같아진다</tspan><tspan x="774" dy="17.667">방향이 사라져</tspan><tspan x="774" dy="17.667">전건과 후건을 바꿔도 같다</tspan></text></g><g ><g class="shape"><path d="M932 787h212v98H932z" class="stroke-B1 fill-B6 s0"/></g><text x="1038" y="825.5" class="text-bold fill-N1 s2"><tspan x="1038" dy="0">ψ 와 같아진다</tspan><tspan x="1038" dy="17.667">전건이 아무 구실도</tspan><tspan x="1038" dy="17.667">하지 않는다</tspan></text></g><path fill="transparent" stroke="transparent" d="M265 921h625v178H265z" class="shape s0"/><g ><g class="shape"><path d="M418 70h116v66H418z" class="stroke-B1 fill-B5 s0"/></g><text x="476" y="108.5" class="text-bold fill-N1 s2">T → T 는 T</text></g><g ><g class="shape"><path d="M554 62h255v82H554z" class="stroke-B1 fill-B5 s0"/></g><text x="681.5" y="100.5" class="text-bold fill-N1 s2"><tspan x="681.5" dy="0">T → F 는 F</tspan><tspan x="681.5" dy="18.5">약속을 어긴 유일한 경우</tspan></text></g><g ><g class="shape"><path d="M491 405h113v66H491z" class="stroke-B1 fill-B5 s0"/></g><text x="547.5" y="443.5" class="text-bold fill-N1 s2">F → T 는 ?</text></g><g ><g class="shape"><path d="M624 405h112v66H624z" class="stroke-B1 fill-B5 s0"/></g><text x="680" y="443.5" class="text-bold fill-N1 s2">F → F 는 ?</text></g><text x="577.5" y="961" class="fill-N1 s2"><tspan x="577.5" dy="0">네 채움 가운데 셋은 이미 있는 것(∧, ↔, ψ 자신)과 같아진다.</tspan><tspan x="577.5" dy="18.5">조건문에 쓸 만한 것은 둘 다 T 로 채운 하나뿐이고, 그것이 실질함의다</tspan></text><text x="534" y="1022" class="fill-N1 s2"><tspan x="534" dy="0">여기서 쓴 전제는 하나다 — 함의를 진리함수로 쓰겠다는 것.</tspan><tspan x="534" dy="17.25">즉 전건과 후건의 진리값만으로 전체 값이 정해져야 한다.</tspan><tspan x="534" dy="17.25">인과나 관련성을 담고 싶으면 진리함수를 포기해야 하고,</tspan><tspan x="534" dy="17.25">그 길이 18장(양상논리)과 19장(관련성 논리)이다</tspan></text><marker id="mk-d2-2512055880-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2512055880-3488378134)" d="M614 196v155" class="connection stroke-B1 s0" mask="url(#d2-2512055880)"/><text x="614" y="280" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">나머지 두 줄을 어떻게 채울까</text><path fill="none" marker-end="url(#mk-d2-2512055880-3488378134)" d="M440 523v28s0 10-10 10H152s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-2512055880)"/><path fill="none" marker-end="url(#mk-d2-2512055880-3488378134)" d="M556 523v78s0 10-10 10h-82s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-2512055880)"/><path fill="none" marker-end="url(#mk-d2-2512055880-3488378134)" d="M672 523v78s0 10 10 10h82s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-2512055880)"/><path fill="none" marker-end="url(#mk-d2-2512055880-3488378134)" d="M788 523v28s0 10 10 10h230s10 0 10 10v76" class="connection stroke-B1 s0" mask="url(#d2-2512055880)"/><path fill="none" marker-end="url(#mk-d2-2512055880-3488378134)" d="M142 719v64" class="connection stroke-B1 s0" mask="url(#d2-2512055880)"/><path fill="none" marker-end="url(#mk-d2-2512055880-3488378134)" d="M454 719v64" class="connection stroke-B1 s0" mask="url(#d2-2512055880)"/><path fill="none" marker-end="url(#mk-d2-2512055880-3488378134)" d="M774 719v64" class="connection stroke-B1 s0" mask="url(#d2-2512055880)"/><path fill="none" marker-end="url(#mk-d2-2512055880-3488378134)" d="M1038 719v64" class="connection stroke-B1 s0" mask="url(#d2-2512055880)"/><mask id="d2-2512055880" width="1334" height="1289" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1334v1289H-89z"/><path d="M490 264h248v21H490z"/></mask></svg>