<svg xmlns="http://www.w3.org/2000/svg" width="2360" height="1055" class="d2-3337747658 d2-svg" viewBox="-101 -121 2360 1055"><rect width="2360" height="1055" x="-101" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3337747658 .fill-N1{fill:#0a0f25}.d2-3337747658 .fill-B4{fill:#e3e9fd}.d2-3337747658 .fill-B5{fill:#edf0fd}.d2-3337747658 .fill-B6{fill:#f7f8fe}.d2-3337747658 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M567 20h491v142H567z" class="stroke-B1 fill-B4 s0"/></g><text x="812.5" y="7" class="text-bold fill-N1 s1">다툼이 없는 두 줄</text></g><g ><g class="shape"><path d="M161 323h1419v126H161z" class="stroke-B1 fill-B4 s0"/></g><text x="870.5" y="310" class="text-bold fill-N1 s1">고를 수 있는 두 줄 — 전건이 F 인 자리</text></g><g ><g class="shape"><path d="M98 569h187v66H98z" class="stroke-B1 fill-B6 s0"/></g><text x="191.5" y="607.5" class="text-bold fill-N1 s2">둘 다 T 로 채운다</text></g><g ><g class="shape"><path d="M568 569h186v66H568z" class="stroke-B1 fill-B6 s0"/></g><text x="661" y="607.5" class="text-bold fill-N1 s2">둘 다 F 로 채운다</text></g><g ><g class="shape"><path d="M1044 569h192v66h-192z" class="stroke-B1 fill-B6 s0"/></g><text x="1140" y="607.5" class="text-bold fill-N1 s2">F → T 는 F, F → F 는 T</text></g><g ><g class="shape"><path d="M1465 569h192v66h-192z" class="stroke-B1 fill-B6 s0"/></g><text x="1561" y="607.5" class="text-bold fill-N1 s2">F → T 는 T, F → F 는 F</text></g><g ><g class="shape"><path d="M0 735h383v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="191.5" y="773.5" class="text-bold fill-N1 s2"><tspan x="191.5" dy="0">φ → ψ</tspan><tspan x="191.5" dy="17.667">새 연결자가 하나 생긴다.</tspan><tspan x="191.5" dy="17.667">전건이 거짓인 조건문을 주장할 수 있다</tspan></text></g><g ><g class="shape"><path d="M443 743h435v82H443z" class="stroke-B1 fill-B6 s0"/></g><text x="660.5" y="781.5" class="text-bold fill-N1 s2"><tspan x="660.5" dy="0">φ ∧ ψ 와 같아진다</tspan><tspan x="660.5" dy="18.5">‘비는 안 오지만 오면 젖는다’ 를 말할 수 없다</tspan></text></g><g ><g class="shape"><path d="M938 743h403v82H938z" class="stroke-B1 fill-B6 s0"/></g><text x="1139.5" y="781.5" class="text-bold fill-N1 s2"><tspan x="1139.5" dy="0">φ ↔ ψ 와 같아진다</tspan><tspan x="1139.5" dy="18.5">방향이 사라져 전건과 후건을 바꿔도 같다</tspan></text></g><g ><g class="shape"><path d="M1401 743h319v82h-319z" class="stroke-B1 fill-B6 s0"/></g><text x="1560.5" y="781.5" class="text-bold fill-N1 s2"><tspan x="1560.5" dy="0">ψ 와 같아진다</tspan><tspan x="1560.5" dy="18.5">전건이 아무 구실도 하지 않는다</tspan></text></g><text x="1358" y="89" class="fill-N1 s2"><tspan x="1358" dy="0">네 채움 가운데 셋은 이미 이름이 있는 연결자다.</tspan><tspan x="1358" dy="18.5">조건문에 쓸 만한 것은 맨 위 하나뿐이고, 그것이 실질함의다</tspan></text><text x="1913" y="73" class="fill-N1 s2"><tspan x="1913" dy="0">여기서 쓴 전제는 하나다 — 함의를 진리함수로 쓰겠다는 것.</tspan><tspan x="1913" dy="17.25">즉 전건과 후건의 진리값만으로 전체 값이 정해져야 한다.</tspan><tspan x="1913" dy="17.25">인과나 관련성을 담고 싶으면 진리함수를 포기해야 하고,</tspan><tspan x="1913" dy="17.25">그 길이 18장(양상논리)과 19장(관련성 논리)이다</tspan></text><g ><g class="shape"><path d="M597 58h116v66H597z" class="stroke-B1 fill-B5 s0"/></g><text x="655" y="96.5" class="text-bold fill-N1 s2">T → T 는 T</text></g><g ><g class="shape"><path d="M773 50h255v82H773z" class="stroke-B1 fill-B5 s0"/></g><text x="900.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="900.5" dy="0">T → F 는 F</tspan><tspan x="900.5" dy="18.5">약속을 어긴 유일한 경우</tspan></text></g><g ><g class="shape"><path d="M229 353h113v66H229z" class="stroke-B1 fill-B5 s0"/></g><text x="285.5" y="391.5" class="text-bold fill-N1 s2">F → T 는 ?</text></g><g ><g class="shape"><path d="M844 353h112v66H844z" class="stroke-B1 fill-B5 s0"/></g><text x="900" y="391.5" class="text-bold fill-N1 s2">F → F 는 ?</text></g><marker id="mk-d2-3337747658-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3337747658-3488378134)" d="M900 163.5v115" class="connection stroke-B1 s0" mask="url(#d2-3337747658)"/><text x="900" y="228" style="fill:#676c7e;text-anchor:middle;font-size:16px">나머지 두 줄을 어떻게 채울까</text><path fill="none" marker-end="url(#mk-d2-3337747658-3488378134)" d="M191.5 451v114" class="connection stroke-B1 s0" mask="url(#d2-3337747658)"/><path fill="none" marker-end="url(#mk-d2-3337747658-3488378134)" d="M660.5 451v114" class="connection stroke-B1 s0" mask="url(#d2-3337747658)"/><path fill="none" marker-end="url(#mk-d2-3337747658-3488378134)" d="M1139.5 451v114" class="connection stroke-B1 s0" mask="url(#d2-3337747658)"/><path fill="none" marker-end="url(#mk-d2-3337747658-3488378134)" d="M1560.5 451v114" class="connection stroke-B1 s0" mask="url(#d2-3337747658)"/><path fill="none" marker-end="url(#mk-d2-3337747658-3488378134)" d="M191.5 637v94" class="connection stroke-B1 s0" mask="url(#d2-3337747658)"/><path fill="none" marker-end="url(#mk-d2-3337747658-3488378134)" d="M660.5 637v102" class="connection stroke-B1 s0" mask="url(#d2-3337747658)"/><path fill="none" marker-end="url(#mk-d2-3337747658-3488378134)" d="M1139.5 637v102" class="connection stroke-B1 s0" mask="url(#d2-3337747658)"/><path fill="none" marker-end="url(#mk-d2-3337747658-3488378134)" d="M1560.5 637v102" class="connection stroke-B1 s0" mask="url(#d2-3337747658)"/><mask id="d2-3337747658" width="2360" height="1055" x="-101" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-121h2360V934H-101z"/><path d="M776 212h248v21H776z"/></mask></svg>