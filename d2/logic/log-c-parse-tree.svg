<svg xmlns="http://www.w3.org/2000/svg" width="1735" height="672" class="d2-3799289625 d2-svg" viewBox="-101 -101 1735 672"><rect width="1735" height="672" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3799289625 .fill-N1{fill:#0a0f25}.d2-3799289625 .fill-N2{fill:#676c7e}.d2-3799289625 .fill-B6{fill:#f7f8fe}.d2-3799289625 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M183 2h140v82H183z" class="stroke-B1 fill-B6 s0"/></g><text x="253" y="40.5" class="text-bold fill-N1 s1"><tspan x="253" dy="0">((P ∧ Q) → ¬R)</tspan><tspan x="253" dy="18.5">주연결자 →</tspan></text></g><g ><g class="shape"><path d="M85 206h139v82H85z" class="stroke-B1 fill-B6 s0"/></g><text x="154.5" y="244.5" class="text-bold fill-N1 s1"><tspan x="154.5" dy="0">(P ∧ Q)</tspan><tspan x="154.5" dy="18.5">주연결자 ∧</tspan></text></g><g ><g class="shape"><path d="M369 206h137v82H369z" class="stroke-B1 fill-B6 s0"/></g><text x="437.5" y="244.5" class="text-bold fill-N1 s1"><tspan x="437.5" dy="0">¬R</tspan><tspan x="437.5" dy="18.5">주연결자 ¬</tspan></text></g><g ><g class="shape"><path d="M0 388h124v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="62" y="426.5" class="text-bold fill-N1 s1"><tspan x="62" dy="0">P</tspan><tspan x="62" dy="18.5">문장문자</tspan></text></g><g ><g class="shape"><path d="M184 388h124v82H184z" class="stroke-B1 fill-B6 s0"/></g><text x="246" y="426.5" class="text-bold fill-N1 s1"><tspan x="246" dy="0">Q</tspan><tspan x="246" dy="18.5">문장문자</tspan></text></g><g ><g class="shape"><path d="M375 388h124v82H375z" class="stroke-B1 fill-B6 s0"/></g><text x="437" y="426.5" class="text-bold fill-N1 s1"><tspan x="437" dy="0">R</tspan><tspan x="437" dy="18.5">문장문자</tspan></text></g><text x="543" y="16" class="fill-N1 s1"><tspan x="543" dy="0">부분식은 마디의 라벨을 모은 것이다 —</tspan><tspan x="543" dy="17">((P ∧ Q) → ¬R), (P ∧ Q), ¬R, P, Q, R</tspan><tspan x="543" dy="17">여섯 개. 식 자신도 자기의 부분식이고</tspan><tspan x="543" dy="17">(뿌리도 마디다), 잎에 있는 것만이</tspan><tspan x="543" dy="17">문장문자다</tspan></text><text x="945.5" y="16" class="fill-N1 s1"><tspan x="945.5" dy="0">왜 나무가 하나로 정해지는가 — 이항 조항이</tspan><tspan x="945.5" dy="17">붙여 둔 괄호 덕이다. 괄호를 빼고</tspan><tspan x="945.5" dy="17">P ∧ Q → ¬R 이라고만 적으면 나무가 둘</tspan><tspan x="945.5" dy="17">생길 수 있다. 적형식마다 나무가 정확히</tspan><tspan x="945.5" dy="17">하나라는 것은 정리이고 13장의 도구가 든다</tspan></text><text x="1360.5" y="16" class="fill-N1 s1"><tspan x="1360.5" dy="0">주연결자를 손으로 찾는 법 — 맨 바깥</tspan><tspan x="1360.5" dy="17">괄호를 지운 뒤 왼쪽부터 깊이를 센다.</tspan><tspan x="1360.5" dy="17">여는 괄호에서 +1, 닫는 괄호에서 −1.</tspan><tspan x="1360.5" dy="17">깊이 0 에 이항 연결자가 있으면 그것이고,</tspan><tspan x="1360.5" dy="17">없으면서 맨 앞이 ¬ 이면 ¬ 가 주연결자다</tspan></text><marker id="mk-d2-3799289625-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3799289625-3488378134)" d="M212.194 85.93C165.918 133.3 154 157.7 154 202.5" class="connection stroke-B1 s0" mask="url(#d2-3799289625)"/><text x="164.5" y="142" class="text-italic fill-N2 s1">→ 조항의 왼쪽 재료</text><path fill="none" marker-end="url(#mk-d2-3799289625-3488378134)" d="M324.744 82.48C414.2 132.7 437 157.7 437 202.5" class="connection stroke-B1 s0" mask="url(#d2-3799289625)"/><text x="405" y="133" class="text-italic fill-N2 s1">→ 조항의 오른쪽 재료</text><path fill="none" marker-end="url(#mk-d2-3799289625-3488378134)" d="M111.572 289.4C72.199 328 62 348 62 384" class="connection stroke-B1 s0" mask="url(#d2-3799289625)"/><path fill="none" marker-end="url(#mk-d2-3799289625-3488378134)" d="M196.428 289.4C235.8 328 246 348 246 384" class="connection stroke-B1 s0" mask="url(#d2-3799289625)"/><path fill="none" marker-end="url(#mk-d2-3799289625-3488378134)" d="M437 290v94" class="connection stroke-B1 s0" mask="url(#d2-3799289625)"/><mask id="d2-3799289625" width="1735" height="672" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1735v672H-101z"/><path d="M85 126h159v21H85zM316 117h178v21H316z"/></mask></svg>