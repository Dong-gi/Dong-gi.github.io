<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1036" class="d2-3165228212 d2-svg" viewBox="-101 -101 1160 1036"><rect width="1160" height="1036" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3165228212 .fill-N1{fill:#0a0f25}.d2-3165228212 .fill-B4{fill:#e3e9fd}.d2-3165228212 .fill-B5{fill:#edf0fd}.d2-3165228212 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h958v424H0z" class="stroke-B1 fill-B4 s0"/></g><text x="479" y="33" class="text-bold fill-N1 s1">‘완전하다’ 가 두 곳에서 서로 다른 뜻으로 쓰인다</text></g><g ><g class="shape"><path d="M42 545h875v152H42z" class="stroke-B1 fill-B4 s0"/></g><text x="479.5" y="578" class="text-bold fill-N1 s1">둘을 함께 놓으면 — 모순이 아니라 협력이다</text></g><text x="479.5" y="813" class="text-bold fill-N1 s2"><tspan x="479.5" dy="0">괴델이 둘 다 증명했다 — 완전성은 1929년 학위논문, 불완전성은 1931년.</tspan><tspan x="479.5" dy="18.5">같은 사람이 두 해 사이에 증명한 정리가 서로 모순일 리 없다</tspan></text><g ><g class="shape"><path d="M184 46h403v100H184z" class="stroke-B1 fill-B5 s0"/></g><text x="385.5" y="101.5" class="text-bold fill-N1 s2">14장 — 증명 체계가 완전하다</text></g><g ><g class="shape"><path d="M595 46h355v100H595z" class="stroke-B1 fill-B5 s0"/></g><text x="772.5" y="101.5" class="text-bold fill-N1 s2">17장 — 이론이 완전하다 · 불완전하다</text></g><g ><g class="shape"><path d="M8 154h168v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="92" y="200.5" class="text-bold fill-N1 s2">주어</text></g><g ><g class="shape"><path d="M184 154h403v82H184z" class="stroke-B1 fill-B5 s0"/></g><text x="385.5" y="192.5" class="text-bold fill-N1 s2"><tspan x="385.5" dy="0">증명 체계</tspan><tspan x="385.5" dy="18.5">7 · 11 · 12장의 규칙 전체</tspan></text></g><g ><g class="shape"><path d="M595 154h355v82H595z" class="stroke-B1 fill-B5 s0"/></g><text x="772.5" y="192.5" class="text-bold fill-N1 s2"><tspan x="772.5" dy="0">이론 T</tspan><tspan x="772.5" dy="18.5">공리로 고른 문장들</tspan></text></g><g ><g class="shape"><path d="M8 244h168v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="92" y="290.5" class="text-bold fill-N1 s2">무슨 주장인가</text></g><g ><g class="shape"><path d="M184 244h403v82H184z" class="stroke-B1 fill-B5 s0"/></g><text x="385.5" y="282.5" class="text-bold fill-N1 s2"><tspan x="385.5" dy="0">Γ ⊨ φ 이면 Γ ⊢ φ</tspan><tspan x="385.5" dy="18.5">의미론이 인정하는 것을 규칙이 다 잡는다</tspan></text></g><g ><g class="shape"><path d="M595 244h355v82H595z" class="stroke-B1 fill-B5 s0"/></g><text x="772.5" y="282.5" class="text-bold fill-N1 s2"><tspan x="772.5" dy="0">모든 문장 φ 에 대해</tspan><tspan x="772.5" dy="18.5">T ⊢ φ 이거나 T ⊢ ¬φ 이다</tspan></text></g><g ><g class="shape"><path d="M8 334h168v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="92" y="380.5" class="text-bold fill-N1 s2">성립하는가</text></g><g ><g class="shape"><path d="M184 334h403v82H184z" class="stroke-B1 fill-B5 s0"/></g><text x="385.5" y="372.5" class="text-bold fill-N1 s2"><tspan x="385.5" dy="0">성립한다. 어떤 Γ 를 놓든</tspan><tspan x="385.5" dy="18.5">1차 논리 전체에 대해</tspan></text></g><g ><g class="shape"><path d="M595 334h355v82H595z" class="stroke-B1 fill-B5 s0"/></g><text x="772.5" y="372.5" class="text-bold fill-N1 s2"><tspan x="772.5" dy="0">산술을 담을 만큼 강한 T 는</tspan><tspan x="772.5" dy="18.5">이 성질을 가질 수 없다</tspan></text></g><g ><g class="shape"><path d="M50 591h200v98H50z" class="stroke-B1 fill-B5 s0"/></g><text x="150" y="637.5" class="text-bold fill-N1 s2"><tspan x="150" dy="0">① 17장이 주는 것</tspan><tspan x="150" dy="18.5">T ⊬ G 그리고 T ⊬ ¬G</tspan></text></g><g ><g class="shape"><path d="M258 591h287v98H258z" class="stroke-B1 fill-B5 s0"/></g><text x="401.5" y="637.5" class="text-bold fill-N1 s2"><tspan x="401.5" dy="0">② 여기에 14장을 대우로 쓰면</tspan><tspan x="401.5" dy="18.5">T ⊭ G 그리고 T ⊭ ¬G</tspan></text></g><g ><g class="shape"><path d="M553 591h356v98H553z" class="stroke-B1 fill-B5 s0"/></g><text x="731" y="629.5" class="text-bold fill-N1 s2"><tspan x="731" dy="0">③ 그러니 G 가 참인 T-모형도</tspan><tspan x="731" dy="17.667">G 가 거짓인 T-모형도 있다.</tspan><tspan x="731" dy="17.667">그중 하나가 15장의 비표준 모형이다</tspan></text></g><marker id="mk-d2-3165228212-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3165228212-3488378134)" d="M479 425.5v116" class="connection stroke-B1 s0" mask="url(#d2-3165228212)"/><text x="479.5" y="490" style="fill:#676c7e;text-anchor:middle;font-size:16px">주어가 다르므로 부딪치지 않는다</text><path fill="none" marker-end="url(#mk-d2-3165228212-3488378134)" d="M479 699v94" class="connection stroke-B1 s0" mask="url(#d2-3165228212)"/><mask id="d2-3165228212" width="1160" height="1036" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1160V935H-101z"/><path d="M338 474h283v21H338z"/></mask></svg>