<svg xmlns="http://www.w3.org/2000/svg" width="1257" height="1030" class="d2-1437685177 d2-svg" viewBox="-101 -101 1257 1030"><rect width="1257" height="1030" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1437685177 .fill-N1{fill:#0a0f25}.d2-1437685177 .fill-B4{fill:#e3e9fd}.d2-1437685177 .fill-B5{fill:#edf0fd}.d2-1437685177 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M209 0h638v98H209z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="528" y="38.5" class="text-bold fill-N1 s0"><tspan x="528" dy="0">건전성 정리 — 이 장이 증명할 것</tspan><tspan x="528" dy="17.667"> </tspan><tspan x="528" dy="17.667">‘모든 논리식 집합 Γ 와 모든 논리식 φ 에 대하여, Γ ⊢ φ 이면 Γ ⊨ φ 이다’</tspan></text></g><g ><g class="shape"><path d="M0 219h1055v152H0z" class="stroke-B1 fill-B4 s1"/></g><text x="527.5" y="252" class="fill-N1 s2">이 문장을 이루는 것 — 넷을 세어 보면 대상언어의 기호가 하나도 없다</text></g><g ><g class="shape"><path d="M11 471h1033v204H11z" class="stroke-B1 fill-B4 s1"/></g><text x="527.5" y="504" class="fill-N1 s2">그래서 이 정리는 두 언어 가운데 오른쪽에 산다</text></g><text x="527.5" y="791" class="fill-N1 s0"><tspan x="527.5" dy="0">5장은 이런 주장을 메타정리라 불렀다.</tspan><tspan x="527.5" dy="17.667">7장이 ‘두 기호를 섞지 마라’ 고 한 금지는 그대로 유효하다 —</tspan><tspan x="527.5" dy="17.667">논증 중간에 몰래 갈아타는 것과 둘의 관계를 정리로 진술하는 것은 다른 일이다</tspan></text><g ><g class="shape"><path d="M28 265h212v98H28z" class="stroke-B1 fill-B5 s1"/></g><text x="134" y="303.5" class="text-bold fill-N1 s0"><tspan x="134" dy="0">Γ, φ</tspan><tspan x="134" dy="17.667">메타변수.</tspan><tspan x="134" dy="17.667">어휘에 없는 글자다</tspan></text></g><g ><g class="shape"><path d="M248 265h296v98H248z" class="stroke-B1 fill-B5 s1"/></g><text x="396" y="303.5" class="text-bold fill-N1 s0"><tspan x="396" dy="0">⊢, ⊨</tspan><tspan x="396" dy="17.667">메타언어의 기호.</tspan><tspan x="396" dy="17.667">논리식 안에 들어가지 않는다</tspan></text></g><g ><g class="shape"><path d="M552 265h278v98H552z" class="stroke-B1 fill-B5 s1"/></g><text x="691" y="311.5" class="text-bold fill-N1 s0"><tspan x="691" dy="0">‘모든 … 에 대하여’, ‘이면’</tspan><tspan x="691" dy="18.5">한국어</tspan></text></g><g ><g class="shape"><path d="M838 265h188v98H838z" class="stroke-B1 fill-B5 s1"/></g><text x="932" y="311.5" class="text-bold fill-N1 s0"><tspan x="932" dy="0">대상언어의 기호</tspan><tspan x="932" dy="18.5">하나도 없다</tspan></text></g><g ><g class="shape"><path d="M23 517h467v146H23z" class="stroke-B1 fill-B5 s1"/></g><text x="256.5" y="555.5" class="text-bold fill-N1 s0"><tspan x="256.5" dy="0">대상언어 — 연구 대상. 12장까지 이 안에서 일했다</tspan><tspan x="256.5" dy="16.833"> </tspan><tspan x="256.5" dy="16.833">어휘가 전부다 — 문장문자 · 연결자 다섯 · 괄호 · ⊥ ·</tspan><tspan x="256.5" dy="16.833">술어 · 항 · 변수 · 한정사 둘 · =</tspan><tspan x="256.5" dy="16.833"> </tspan><tspan x="256.5" dy="16.833">이제 적형식과 도출이 우리가 말하는 대상이 된다</tspan></text></g><g ><g class="shape"><path d="M502 517h530v146H502z" class="stroke-B1 fill-B5 s1"/></g><text x="767" y="555.5" class="text-bold fill-N1 s0"><tspan x="767" dy="0">메타언어 — 한국어와 메타변수. 여기서 이 장의 일을 한다</tspan><tspan x="767" dy="16.833"> </tspan><tspan x="767" dy="16.833">쓰는 수단은 경우 나누기 · 귀류법 · 귀납법.</tspan><tspan x="767" dy="16.833">평범한 수학의 논법이다</tspan><tspan x="767" dy="16.833"> </tspan><tspan x="767" dy="16.833">규칙 열일곱 개로는 위 문장을 적을 수조차 없다</tspan></text></g><marker id="mk-d2-1437685177-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1437685177-3488378134)" d="M527.5 99.5v116" class="connection stroke-B1 s1" mask="url(#d2-1437685177)"/><text x="527.5" y="164" style="fill:#676c7e;text-anchor:middle;font-size:16px">뜯어보면</text><path fill="none" marker-end="url(#mk-d2-1437685177-3488378134)" d="M527.5 373v94" class="connection stroke-B1 s1" mask="url(#d2-1437685177)"/><path fill="none" marker-end="url(#mk-d2-1437685177-3488378134)" d="M527.5 677v94" class="connection stroke-B1 s1" mask="url(#d2-1437685177)"/><mask id="d2-1437685177" width="1257" height="1030" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1257V929H-101z"/><path d="M487 148h81v21h-81z"/></mask></svg>