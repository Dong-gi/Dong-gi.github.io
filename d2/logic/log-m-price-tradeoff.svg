<svg xmlns="http://www.w3.org/2000/svg" width="1059" height="1407" class="d2-2739291289 d2-svg" viewBox="-89 -89 1059 1407"><rect width="1059" height="1407" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2739291289 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2739291289 .fill-N1{fill:#0a0f25}.d2-2739291289 .fill-B4{fill:#e3e9fd}.d2-2739291289 .fill-B5{fill:#edf0fd}.d2-2739291289 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M258 12h365v82H258z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="440.5" y="50.5" class="text-bold fill-N1 s0"><tspan x="440.5" dy="0">1차 논리는 왜 이런 대가를 치르는가 —</tspan><tspan x="440.5" dy="18.5">그 대가를 안 치르는 논리는 없는가</tspan></text></g><g ><g class="shape"><path d="M12 164h857v676H12z" class="stroke-B1 fill-B4 s1"/></g><text x="440.5" y="197" class="text-bold fill-N1 s2">같은 물음을 두 논리에 던져 본다</text></g><text x="440.5" y="926" class="text-bold fill-N1 s0"><tspan x="440.5" dy="0">세로줄 둘에 찍힌 ○ 와 × 가</tspan><tspan x="440.5" dy="17.25">마지막 줄만 빼고 정확히 뒤집혀 있다.</tspan><tspan x="440.5" dy="17.25">1차 논리의 표현력이 낮은 것은</tspan><tspan x="440.5" dy="17.25">설계 실패가 아니라 완전성을 사는 값이었다</tspan></text><g ><g class="shape"><path d="M33 1049h815v168H33z" class="stroke-B1 fill-B4 s1"/></g><text x="440.5" y="1082" class="text-bold fill-N1 s2">이 대가는 아직 다 세지 않았다</text></g><g ><g class="shape"><path d="M20 210h279v98H20z" class="stroke-B1 fill-B5 s1"/></g><text x="159.5" y="264.5" class="text-bold fill-N1 s0">물음</text></g><g ><g class="shape"><path d="M307 210h257v98H307z" class="stroke-B1 fill-B5 s1"/></g><text x="435.5" y="256.5" class="text-bold fill-N1 s0"><tspan x="435.5" dy="0">1차 논리 —</tspan><tspan x="435.5" dy="18.5">이 문서가 세운 것</tspan></text></g><g ><g class="shape"><path d="M572 210h289v98H572z" class="stroke-B1 fill-B5 s1"/></g><text x="716.5" y="248.5" class="text-bold fill-N1 s0"><tspan x="716.5" dy="0">2차 논리 —</tspan><tspan x="716.5" dy="17.667">술어에도 ∀ 를</tspan><tspan x="716.5" dy="17.667">붙일 수 있게 한 것</tspan></text></g><g ><g class="shape"><path d="M20 316h279v82H20z" class="stroke-B1 fill-B5 s1"/></g><text x="159.5" y="354.5" class="text-bold fill-N1 s0"><tspan x="159.5" dy="0">‘정의역이 유한하다’ 를</tspan><tspan x="159.5" dy="18.5">문장 하나로 말할 수 있는가</tspan></text></g><g ><g class="shape"><path d="M307 316h257v82H307z" class="stroke-B1 fill-B5 s1"/></g><text x="435.5" y="362.5" class="text-bold fill-N1 s0">× — 이 장에서 증명했다</text></g><g ><g class="shape"><path d="M572 316h289v82H572z" class="stroke-B1 fill-B5 s1"/></g><text x="716.5" y="362.5" class="text-bold fill-N1 s0">○</text></g><g ><g class="shape"><path d="M20 406h279v82H20z" class="stroke-B1 fill-B5 s1"/></g><text x="159.5" y="444.5" class="text-bold fill-N1 s0"><tspan x="159.5" dy="0">ℕ 을 동형인 것들만</tspan><tspan x="159.5" dy="18.5">남기고 붙잡을 수 있는가</tspan></text></g><g ><g class="shape"><path d="M307 406h257v82H307z" class="stroke-B1 fill-B5 s1"/></g><text x="435.5" y="444.5" class="text-bold fill-N1 s0"><tspan x="435.5" dy="0">× — 비표준 모형이</tspan><tspan x="435.5" dy="18.5">늘 따라 붙는다</tspan></text></g><g ><g class="shape"><path d="M572 406h289v82H572z" class="stroke-B1 fill-B5 s1"/></g><text x="716.5" y="444.5" class="text-bold fill-N1 s0"><tspan x="716.5" dy="0">○ — 귀납 공리를</tspan><tspan x="716.5" dy="18.5">집합 전체에 걸면 된다</tspan></text></g><g ><g class="shape"><path d="M20 496h279v66H20z" class="stroke-B1 fill-B5 s1"/></g><text x="159.5" y="534.5" class="text-bold fill-N1 s0">컴팩트성이 성립하는가</text></g><g ><g class="shape"><path d="M307 496h257v66H307z" class="stroke-B1 fill-B5 s1"/></g><text x="435.5" y="534.5" class="text-bold fill-N1 s0">○</text></g><g ><g class="shape"><path d="M572 496h289v66H572z" class="stroke-B1 fill-B5 s1"/></g><text x="716.5" y="534.5" class="text-bold fill-N1 s0">×</text></g><g ><g class="shape"><path d="M20 570h279v82H20z" class="stroke-B1 fill-B5 s1"/></g><text x="159.5" y="608.5" class="text-bold fill-N1 s0"><tspan x="159.5" dy="0">뢰벤하임-스콜렘이</tspan><tspan x="159.5" dy="18.5">성립하는가</tspan></text></g><g ><g class="shape"><path d="M307 570h257v82H307z" class="stroke-B1 fill-B5 s1"/></g><text x="435.5" y="616.5" class="text-bold fill-N1 s0">○ — 위아래로 미끄러진다</text></g><g ><g class="shape"><path d="M572 570h289v82H572z" class="stroke-B1 fill-B5 s1"/></g><text x="716.5" y="616.5" class="text-bold fill-N1 s0">×</text></g><g ><g class="shape"><path d="M20 660h279v82H20z" class="stroke-B1 fill-B5 s1"/></g><text x="159.5" y="698.5" class="text-bold fill-N1 s0"><tspan x="159.5" dy="0">건전하고 완전한</tspan><tspan x="159.5" dy="18.5">증명 체계가 있는가</tspan></text></g><g ><g class="shape"><path d="M307 660h257v82H307z" class="stroke-B1 fill-B5 s1"/></g><text x="435.5" y="706.5" class="text-bold fill-N1 s0">○ — 13장과 14장</text></g><g ><g class="shape"><path d="M572 660h289v82H572z" class="stroke-B1 fill-B5 s1"/></g><text x="716.5" y="698.5" class="text-bold fill-N1 s0"><tspan x="716.5" dy="0">× — 어떤 규칙 목록으로도</tspan><tspan x="716.5" dy="18.5">안 된다</tspan></text></g><g ><g class="shape"><path d="M20 750h279v82H20z" class="stroke-B1 fill-B5 s1"/></g><text x="159.5" y="788.5" class="text-bold fill-N1 s0"><tspan x="159.5" dy="0">규칙만 보고 도출을</tspan><tspan x="159.5" dy="18.5">검사할 수 있는가</tspan></text></g><g ><g class="shape"><path d="M307 750h257v82H307z" class="stroke-B1 fill-B5 s1"/></g><text x="435.5" y="796.5" class="text-bold fill-N1 s0">○ — 7장의 검사 절차</text></g><g ><g class="shape"><path d="M572 750h289v82H572z" class="stroke-B1 fill-B5 s1"/></g><text x="716.5" y="788.5" class="text-bold fill-N1 s0"><tspan x="716.5" dy="0">○ — 건전한 규칙 목록은 있다.</tspan><tspan x="716.5" dy="18.5">완전하지 않을 뿐이다</tspan></text></g><g ><g class="shape"><path d="M41 1095h276v114H41z" class="stroke-B1 fill-B5 s1"/></g><text x="179" y="1141.5" class="text-bold fill-N1 s0"><tspan x="179" dy="0">16장 — 도출이 있으면</tspan><tspan x="179" dy="17.667">언젠가 찾는다.</tspan><tspan x="179" dy="17.667">그런데 없으면 영영 모른다</tspan></text></g><g ><g class="shape"><path d="M325 1095h255v114H325z" class="stroke-B1 fill-B5 s1"/></g><text x="452.5" y="1133.5" class="text-bold fill-N1 s0"><tspan x="452.5" dy="0">17장 — 산술의 참을</tspan><tspan x="452.5" dy="17.25">공리로 붙잡으려 하면</tspan><tspan x="452.5" dy="17.25">비표준 모형이</tspan><tspan x="452.5" dy="17.25">모양을 바꿔 다시 나온다</tspan></text></g><g ><g class="shape"><path d="M588 1095h252v114H588z" class="stroke-B1 fill-B5 s1"/></g><text x="714" y="1133.5" class="text-bold fill-N1 s0"><tspan x="714" dy="0">20장 — 2차 논리는</tspan><tspan x="714" dy="17.25">여기서 이름만 얹는다.</tspan><tspan x="714" dy="17.25">무엇을 더 말할 수 있고</tspan><tspan x="714" dy="17.25">무엇을 잃는지는 거기서</tspan></text></g><marker id="mk-d2-2739291289-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2739291289-3488378134)" d="M440.5 96v64" class="connection stroke-B1 s1" mask="url(#d2-2739291289)"/><path fill="none" marker-end="url(#mk-d2-2739291289-3488378134)" d="M440.5 842v64" class="connection stroke-B1 s1" mask="url(#d2-2739291289)"/><path fill="none" marker-end="url(#mk-d2-2739291289-3488378134)" d="M440.5 981v64" class="connection stroke-B1 s1" mask="url(#d2-2739291289)"/><mask id="d2-2739291289" width="1059" height="1407" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H970v1407H-89z"/></mask></svg>