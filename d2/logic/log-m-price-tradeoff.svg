<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="1337" class="d2-2090911140 d2-svg" viewBox="-101 -101 1434 1337"><rect width="1434" height="1337" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2090911140 .fill-N1{fill:#0a0f25}.d2-2090911140 .fill-B4{fill:#e3e9fd}.d2-2090911140 .fill-B5{fill:#edf0fd}.d2-2090911140 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M282 0h668v66H282z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="616" y="38.5" class="text-bold fill-N1 s0">1차 논리는 왜 이런 대가를 치르는가 — 그 대가를 안 치르는 논리는 없는가</text></g><g ><g class="shape"><path d="M22 166h1188v596H22z" class="stroke-B1 fill-B4 s1"/></g><text x="616" y="199" class="text-bold fill-N1 s2">같은 물음을 두 논리에 던져 본다</text></g><text x="616" y="878" class="text-bold fill-N1 s0"><tspan x="616" dy="0">세로줄 둘에 찍힌 ○ 와 × 가 정확히 뒤집혀 있다.</tspan><tspan x="616" dy="18.5">1차 논리의 표현력이 낮은 것은 설계 실패가 아니라 완전성을 사는 값이었다</tspan></text><g ><g class="shape"><path d="M0 999h1232v136H0z" class="stroke-B1 fill-B4 s1"/></g><text x="616" y="1032" class="text-bold fill-N1 s2">이 대가는 아직 다 세지 않았다</text></g><g ><g class="shape"><path d="M30 212h363v66H30z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="250.5" class="text-bold fill-N1 s0">물음</text></g><g ><g class="shape"><path d="M401 212h326v66H401z" class="stroke-B1 fill-B5 s1"/></g><text x="564" y="250.5" class="text-bold fill-N1 s0">1차 논리 — 이 문서가 세운 것</text></g><g ><g class="shape"><path d="M735 212h467v66H735z" class="stroke-B1 fill-B5 s1"/></g><text x="968.5" y="250.5" class="text-bold fill-N1 s0">2차 논리 — 술어에도 ∀ 를 붙일 수 있게 한 것</text></g><g ><g class="shape"><path d="M30 286h363v82H30z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="324.5" class="text-bold fill-N1 s0"><tspan x="211.5" dy="0">‘정의역이 유한하다’ 를</tspan><tspan x="211.5" dy="18.5">문장 하나로 말할 수 있는가</tspan></text></g><g ><g class="shape"><path d="M401 286h326v82H401z" class="stroke-B1 fill-B5 s1"/></g><text x="564" y="332.5" class="text-bold fill-N1 s0">× — 이 장에서 증명했다</text></g><g ><g class="shape"><path d="M735 286h467v82H735z" class="stroke-B1 fill-B5 s1"/></g><text x="968.5" y="332.5" class="text-bold fill-N1 s0">○</text></g><g ><g class="shape"><path d="M30 376h363v82H30z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="414.5" class="text-bold fill-N1 s0"><tspan x="211.5" dy="0">ℕ 을 동형인 것들만</tspan><tspan x="211.5" dy="18.5">남기고 붙잡을 수 있는가</tspan></text></g><g ><g class="shape"><path d="M401 376h326v82H401z" class="stroke-B1 fill-B5 s1"/></g><text x="564" y="422.5" class="text-bold fill-N1 s0">× — 비표준 모형이 늘 따라 붙는다</text></g><g ><g class="shape"><path d="M735 376h467v82H735z" class="stroke-B1 fill-B5 s1"/></g><text x="968.5" y="422.5" class="text-bold fill-N1 s0">○ — 귀납 공리를 집합 전체에 걸면 된다</text></g><g ><g class="shape"><path d="M30 466h363v66H30z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="504.5" class="text-bold fill-N1 s0">컴팩트성이 성립하는가</text></g><g ><g class="shape"><path d="M401 466h326v66H401z" class="stroke-B1 fill-B5 s1"/></g><text x="564" y="504.5" class="text-bold fill-N1 s0">○</text></g><g ><g class="shape"><path d="M735 466h467v66H735z" class="stroke-B1 fill-B5 s1"/></g><text x="968.5" y="504.5" class="text-bold fill-N1 s0">×</text></g><g ><g class="shape"><path d="M30 540h363v66H30z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="578.5" class="text-bold fill-N1 s0">뢰벤하임-스콜렘이 성립하는가</text></g><g ><g class="shape"><path d="M401 540h326v66H401z" class="stroke-B1 fill-B5 s1"/></g><text x="564" y="578.5" class="text-bold fill-N1 s0">○ — 위아래로 미끄러진다</text></g><g ><g class="shape"><path d="M735 540h467v66H735z" class="stroke-B1 fill-B5 s1"/></g><text x="968.5" y="578.5" class="text-bold fill-N1 s0">×</text></g><g ><g class="shape"><path d="M30 614h363v66H30z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="652.5" class="text-bold fill-N1 s0">건전하고 완전한 증명 체계가 있는가</text></g><g ><g class="shape"><path d="M401 614h326v66H401z" class="stroke-B1 fill-B5 s1"/></g><text x="564" y="652.5" class="text-bold fill-N1 s0">○ — 13장과 14장</text></g><g ><g class="shape"><path d="M735 614h467v66H735z" class="stroke-B1 fill-B5 s1"/></g><text x="968.5" y="652.5" class="text-bold fill-N1 s0">× — 어떤 규칙 목록으로도 안 된다</text></g><g ><g class="shape"><path d="M30 688h363v66H30z" class="stroke-B1 fill-B5 s1"/></g><text x="211.5" y="726.5" class="text-bold fill-N1 s0">규칙만 보고 도출을 검사할 수 있는가</text></g><g ><g class="shape"><path d="M401 688h326v66H401z" class="stroke-B1 fill-B5 s1"/></g><text x="564" y="726.5" class="text-bold fill-N1 s0">○ — 7장의 검사 절차</text></g><g ><g class="shape"><path d="M735 688h467v66H735z" class="stroke-B1 fill-B5 s1"/></g><text x="968.5" y="726.5" class="text-bold fill-N1 s0">규칙 목록 자체가 없으니 물음이 성립하지 않는다</text></g><g ><g class="shape"><path d="M8 1045h356v82H8z" class="stroke-B1 fill-B5 s1"/></g><text x="186" y="1083.5" class="text-bold fill-N1 s0"><tspan x="186" dy="0">16장 — 도출이 있으면 언젠가 찾는다.</tspan><tspan x="186" dy="18.5">그런데 없으면 영영 모른다</tspan></text></g><g ><g class="shape"><path d="M372 1045h394v82H372z" class="stroke-B1 fill-B5 s1"/></g><text x="569" y="1083.5" class="text-bold fill-N1 s0"><tspan x="569" dy="0">17장 — 산술의 참을 공리로 붙잡으려 하면</tspan><tspan x="569" dy="18.5">이 장의 비표준 모형이 다시 나온다</tspan></text></g><g ><g class="shape"><path d="M774 1045h450v82H774z" class="stroke-B1 fill-B5 s1"/></g><text x="999" y="1083.5" class="text-bold fill-N1 s0"><tspan x="999" dy="0">20장 — 2차 논리는 여기서 이름만 얹는다.</tspan><tspan x="999" dy="18.5">무엇을 더 말할 수 있고 무엇을 잃는지는 거기서</tspan></text></g><marker id="mk-d2-2090911140-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2090911140-3488378134)" d="M616 68v94" class="connection stroke-B1 s1" mask="url(#d2-2090911140)"/><path fill="none" marker-end="url(#mk-d2-2090911140-3488378134)" d="M616 764v94" class="connection stroke-B1 s1" mask="url(#d2-2090911140)"/><path fill="none" marker-end="url(#mk-d2-2090911140-3488378134)" d="M616 901v94" class="connection stroke-B1 s1" mask="url(#d2-2090911140)"/><mask id="d2-2090911140" width="1434" height="1337" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1434v1337H-101z"/></mask></svg>