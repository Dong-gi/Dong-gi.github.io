<svg xmlns="http://www.w3.org/2000/svg" width="1958" height="1087" class="d2-256927441 d2-svg" viewBox="-91 -149 1958 1087"><rect width="1958" height="1087" x="-91" y="-149" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-256927441 .fill-N1{fill:#0a0f25}.d2-256927441 .fill-N2{fill:#676c7e}.d2-256927441 .fill-B4{fill:#e3e9fd}.d2-256927441 .fill-B5{fill:#edf0fd}.d2-256927441 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M130 676h1128v158H130z" class="stroke-B1 fill-B4 s0"/></g><text x="694" y="635" class="text-bold fill-N1 s1"><tspan x="694" dy="0">1층 — 항(term)</tspan><tspan x="694" dy="32">대상을 가리키는 자리</tspan></text></g><g ><g class="shape"><path d="M102 323h698v158H102z" class="stroke-B1 fill-B4 s0"/></g><text x="451" y="282" class="text-bold fill-N1 s1"><tspan x="451" dy="0">2층 — 원자식(atomic formula)</tspan><tspan x="451" dy="32">술어 하나 + 항수만큼의 항</tspan></text></g><g ><g class="shape"><path d="M10 20h1183v142H10z" class="stroke-B1 fill-B4 s0"/></g><text x="601.5" y="-21" class="text-bold fill-N1 s1"><tspan x="601.5" dy="0">3층 — 적형식(wff)</tspan><tspan x="601.5" dy="32">5장의 세 조항 + 한정사 조항</tspan></text></g><text x="1537" y="688" class="fill-N1 s2"><tspan x="1537" dy="0">화살표가 한 방향뿐인 것이 이 그림의 요점이다.</tspan><tspan x="1537" dy="16.5"> </tspan><tspan x="1537" dy="16.5">Fa 는 원자식이지 항이 아니다. 그래서 FFa 라고 적을</tspan><tspan x="1537" dy="16.5">수 없다 — F 는 항 하나를 받는데 Fa 가 항이 아니기</tspan><tspan x="1537" dy="16.5">때문이다. 항은 대상 자리, 원자식부터는 문장 자리이고</tspan><tspan x="1537" dy="16.5">그 둘은 섞이지 않는다.</tspan><tspan x="1537" dy="16.5"> </tspan><tspan x="1537" dy="16.5">거꾸로 원자식 자리에 항만 적어 두는 것도 안 된다.</tspan><tspan x="1537" dy="16.5">‘a’ 나 ‘x’ 는 적형식이 아니다. 대상을 가리킬 뿐</tspan><tspan x="1537" dy="16.5">무엇이라고 말하지 않기 때문이다</tspan></text><g ><g class="shape"><path d="M160 706h252v98H160z" class="stroke-B1 fill-B5 s0"/></g><text x="286" y="744.5" class="text-bold fill-N1 s2"><tspan x="286" dy="0">개체상수</tspan><tspan x="286" dy="17.667">a b c a₁ a₂ …</tspan><tspan x="286" dy="17.667">정해진 하나를 가리킨다</tspan></text></g><g ><g class="shape"><path d="M472 706h272v98H472z" class="stroke-B1 fill-B5 s0"/></g><text x="608" y="744.5" class="text-bold fill-N1 s2"><tspan x="608" dy="0">변수</tspan><tspan x="608" dy="17.667">x y z x₁ x₂ …</tspan><tspan x="608" dy="17.667">혼자서는 정해지지 않는다</tspan></text></g><g ><g class="shape"><path d="M804 706h424v98H804z" class="stroke-B1 fill-B5 s0"/></g><text x="1016" y="744.5" class="text-bold fill-N1 s2"><tspan x="1016" dy="0">재귀 조항은 비어 있다</tspan><tspan x="1016" dy="17.667">함수기호를 어휘에 넣지 않았기 때문이다.</tspan><tspan x="1016" dy="17.667">17장에서 산술을 다룰 때 이 자리가 채워진다</tspan></text></g><g ><g class="shape"><path d="M132 353h255v98H132z" class="stroke-B1 fill-B5 s0"/></g><text x="259.5" y="391.5" class="text-bold fill-N1 s2"><tspan x="259.5" dy="0">F 가 1항이면 Fa Fx</tspan><tspan x="259.5" dy="17.667">G 가 2항이면 Gab Gxy Gax</tspan><tspan x="259.5" dy="17.667">H 가 3항이면 Habc</tspan></text></g><g ><g class="shape"><path d="M447 353h323v98H447z" class="stroke-B1 fill-B5 s0"/></g><text x="608.5" y="391.5" class="text-bold fill-N1 s2"><tspan x="608.5" dy="0">쉼표도 괄호도 쓰지 않는다.</tspan><tspan x="608.5" dy="17.667">항수가 미리 정해져 있으므로</tspan><tspan x="608.5" dy="17.667">몇 개를 읽을지 세기만 하면 된다</tspan></text></g><g ><g class="shape"><path d="M40 50h330v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="205" y="88.5" class="text-bold fill-N1 s2"><tspan x="205" dy="0">기저 — 모든 원자식은 적형식이다</tspan><tspan x="205" dy="18.5">(5장은 여기가 문장문자였다)</tspan></text></g><g ><g class="shape"><path d="M430 50h356v82H430z" class="stroke-B1 fill-B5 s0"/></g><text x="608" y="88.5" class="text-bold fill-N1 s2"><tspan x="608" dy="0">재귀 — ¬φ, (φ ∧ ψ), (φ ∨ ψ), (φ → ψ), (φ ↔ ψ)</tspan><tspan x="608" dy="18.5">그리고 새 조항 ∀xφ 와 ∃xφ</tspan></text></g><g ><g class="shape"><path d="M846 50h317v82H846z" class="stroke-B1 fill-B5 s0"/></g><text x="1004.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="1004.5" dy="0">폐포 — 위 조항을 유한 번 적용해</tspan><tspan x="1004.5" dy="18.5">얻어지는 것만이 적형식이다</tspan></text></g><marker id="mk-d2-256927441-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-256927441-3488378134)" d="M608 605.5v-121" class="connection stroke-B1 s0" mask="url(#d2-256927441)"/><text x="608" y="550" class="text-italic fill-N2 s2">술어 뒤에 항수만큼 늘어놓는다</text><path fill="none" marker-end="url(#mk-d2-256927441-3488378134)" d="M608 252.5v-87" class="connection stroke-B1 s0" mask="url(#d2-256927441)"/><text x="608.5" y="214" class="text-italic fill-N2 s2">기저 조항이 된다</text><mask id="d2-256927441" width="1958" height="1087" x="-91" y="-149" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-149h1958V938H-91z"/><path d="M476 534h264v21H476zM536 198h145v21H536z"/></mask></svg>