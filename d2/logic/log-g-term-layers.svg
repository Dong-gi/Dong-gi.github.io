<svg xmlns="http://www.w3.org/2000/svg" width="1996" height="1087" class="d2-837453270 d2-svg" viewBox="-91 -149 1996 1087"><rect width="1996" height="1087" x="-91" y="-149" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-837453270 .fill-N1{fill:#0a0f25}.d2-837453270 .fill-N2{fill:#676c7e}.d2-837453270 .fill-B4{fill:#e3e9fd}.d2-837453270 .fill-B5{fill:#edf0fd}.d2-837453270 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M168 676h1128v158H168z" class="stroke-B1 fill-B4 s0"/></g><text x="732" y="635" class="text-bold fill-N1 s1"><tspan x="732" dy="0">1층 — 항(term)</tspan><tspan x="732" dy="32">대상을 가리키는 자리</tspan></text></g><g ><g class="shape"><path d="M140 323h698v158H140z" class="stroke-B1 fill-B4 s0"/></g><text x="489" y="282" class="text-bold fill-N1 s1"><tspan x="489" dy="0">2층 — 원자식(atomic formula)</tspan><tspan x="489" dy="32">술어 하나 + 항수만큼의 항</tspan></text></g><g ><g class="shape"><path d="M10 20h1221v142H10z" class="stroke-B1 fill-B4 s0"/></g><text x="620.5" y="-21" class="text-bold fill-N1 s1"><tspan x="620.5" dy="0">3층 — 적형식(wff)</tspan><tspan x="620.5" dy="32">5장의 세 조항 + 한정사 조항</tspan></text></g><text x="1575" y="688" class="fill-N1 s2"><tspan x="1575" dy="0">화살표가 한 방향뿐인 것이 이 그림의 요점이다.</tspan><tspan x="1575" dy="16.5"> </tspan><tspan x="1575" dy="16.5">Fa 는 원자식이지 항이 아니다. 그래서 FFa 라고 적을</tspan><tspan x="1575" dy="16.5">수 없다 — F 는 항 하나를 받는데 Fa 가 항이 아니기</tspan><tspan x="1575" dy="16.5">때문이다. 항은 대상 자리, 원자식부터는 문장 자리이고</tspan><tspan x="1575" dy="16.5">그 둘은 섞이지 않는다.</tspan><tspan x="1575" dy="16.5"> </tspan><tspan x="1575" dy="16.5">거꾸로 원자식 자리에 항만 적어 두는 것도 안 된다.</tspan><tspan x="1575" dy="16.5">‘a’ 나 ‘x’ 는 적형식이 아니다. 대상을 가리킬 뿐</tspan><tspan x="1575" dy="16.5">무엇이라고 말하지 않기 때문이다</tspan></text><g ><g class="shape"><path d="M198 706h252v98H198z" class="stroke-B1 fill-B5 s0"/></g><text x="324" y="744.5" class="text-bold fill-N1 s2"><tspan x="324" dy="0">개체상수</tspan><tspan x="324" dy="17.667">a b c a₁ a₂ …</tspan><tspan x="324" dy="17.667">정해진 하나를 가리킨다</tspan></text></g><g ><g class="shape"><path d="M510 706h272v98H510z" class="stroke-B1 fill-B5 s0"/></g><text x="646" y="744.5" class="text-bold fill-N1 s2"><tspan x="646" dy="0">변수</tspan><tspan x="646" dy="17.667">x y z x₁ x₂ …</tspan><tspan x="646" dy="17.667">혼자서는 정해지지 않는다</tspan></text></g><g ><g class="shape"><path d="M842 706h424v98H842z" class="stroke-B1 fill-B5 s0"/></g><text x="1054" y="744.5" class="text-bold fill-N1 s2"><tspan x="1054" dy="0">재귀 조항은 비어 있다</tspan><tspan x="1054" dy="17.667">함수기호를 어휘에 넣지 않았기 때문이다.</tspan><tspan x="1054" dy="17.667">17장에서 산술을 다룰 때 이 자리가 채워진다</tspan></text></g><g ><g class="shape"><path d="M170 353h255v98H170z" class="stroke-B1 fill-B5 s0"/></g><text x="297.5" y="391.5" class="text-bold fill-N1 s2"><tspan x="297.5" dy="0">F 가 1항이면 Fa Fx</tspan><tspan x="297.5" dy="17.667">G 가 2항이면 Gab Gxy Gax</tspan><tspan x="297.5" dy="17.667">H 가 3항이면 Habc</tspan></text></g><g ><g class="shape"><path d="M485 353h323v98H485z" class="stroke-B1 fill-B5 s0"/></g><text x="646.5" y="391.5" class="text-bold fill-N1 s2"><tspan x="646.5" dy="0">쉼표도 괄호도 쓰지 않는다.</tspan><tspan x="646.5" dy="17.667">항수가 미리 정해져 있으므로</tspan><tspan x="646.5" dy="17.667">몇 개를 읽을지 세기만 하면 된다</tspan></text></g><g ><g class="shape"><path d="M40 50h368v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="224" y="88.5" class="text-bold fill-N1 s2"><tspan x="224" dy="0">기저 — 모든 원자식과 ⊥ 은 적형식이다</tspan><tspan x="224" dy="18.5">(5장은 여기가 문장문자였다)</tspan></text></g><g ><g class="shape"><path d="M468 50h356v82H468z" class="stroke-B1 fill-B5 s0"/></g><text x="646" y="88.5" class="text-bold fill-N1 s2"><tspan x="646" dy="0">재귀 — ¬φ, (φ ∧ ψ), (φ ∨ ψ), (φ → ψ), (φ ↔ ψ)</tspan><tspan x="646" dy="18.5">그리고 새 조항 ∀xφ 와 ∃xφ</tspan></text></g><g ><g class="shape"><path d="M884 50h317v82H884z" class="stroke-B1 fill-B5 s0"/></g><text x="1042.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="1042.5" dy="0">폐포 — 위 조항을 유한 번 적용해</tspan><tspan x="1042.5" dy="18.5">얻어지는 것만이 적형식이다</tspan></text></g><marker id="mk-d2-837453270-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-837453270-3488378134)" d="M646 605.5v-121" class="connection stroke-B1 s0" mask="url(#d2-837453270)"/><text x="646" y="550" class="text-italic fill-N2 s2">술어 뒤에 항수만큼 늘어놓는다</text><path fill="none" marker-end="url(#mk-d2-837453270-3488378134)" d="M646 252.5v-87" class="connection stroke-B1 s0" mask="url(#d2-837453270)"/><text x="646.5" y="214" class="text-italic fill-N2 s2">기저 조항이 된다</text><mask id="d2-837453270" width="1996" height="1087" x="-91" y="-149" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-149h1996V938H-91z"/><path d="M514 534h264v21H514zM574 198h145v21H574z"/></mask></svg>