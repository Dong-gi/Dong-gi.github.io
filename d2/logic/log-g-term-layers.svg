<svg xmlns="http://www.w3.org/2000/svg" width="1383" height="1423" class="d2-1316216463 d2-svg" viewBox="-89 -89 1383 1423"><rect width="1383" height="1423" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1316216463 .text-bold{font-weight:700}.d2-1316216463 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1316216463 .fill-N1{fill:#0a0f25}.d2-1316216463 .fill-N2{fill:#676c7e}.d2-1316216463 .fill-B4{fill:#e3e9fd}.d2-1316216463 .fill-B5{fill:#edf0fd}.d2-1316216463 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M68 762h1069v238H68z" class="stroke-B1 fill-B4 s0"/></g><text x="602.5" y="795" class="text-bold fill-N1 s1"><tspan x="602.5" dy="0">1층 — 항(term)</tspan><tspan x="602.5" dy="32">대상을 가리키는 자리</tspan></text></g><g ><g class="shape"><path d="M253 379h698v222H253z" class="stroke-B1 fill-B4 s0"/></g><text x="602" y="412" class="text-bold fill-N1 s1"><tspan x="602" dy="0">2층 — 원자식(atomic formula)</tspan><tspan x="602" dy="32">술어 하나 + 항수만큼의 항</tspan></text></g><g ><g class="shape"><path d="M12 12h1181v206H12z" class="stroke-B1 fill-B4 s0"/></g><text x="602.5" y="45" class="text-bold fill-N1 s1"><tspan x="602.5" dy="0">3층 — 적형식(wff)</tspan><tspan x="602.5" dy="32">5장의 세 조항 + 한정사 조항</tspan></text></g><path fill="transparent" stroke="transparent" d="M349 1020h506v213H349z" class="shape s0"/><g ><g class="shape"><path d="M118 844h252v98H118z" class="stroke-B1 fill-B5 s0"/></g><text x="244" y="882.5" class="text-bold fill-N1 s2"><tspan x="244" dy="0">개체상수</tspan><tspan x="244" dy="17.667">a b c a₁ a₂ …</tspan><tspan x="244" dy="17.667">정해진 하나를 가리킨다</tspan></text></g><g ><g class="shape"><path d="M390 844h272v98H390z" class="stroke-B1 fill-B5 s0"/></g><text x="526" y="882.5" class="text-bold fill-N1 s2"><tspan x="526" dy="0">변수</tspan><tspan x="526" dy="17.667">x y z x₁ x₂ …</tspan><tspan x="526" dy="17.667">혼자서는 정해지지 않는다</tspan></text></g><g ><g class="shape"><path d="M682 836h405v114H682z" class="stroke-B1 fill-B5 s0"/></g><text x="884.5" y="874.5" class="text-bold fill-N1 s2"><tspan x="884.5" dy="0">재귀 조항은 비어 있다</tspan><tspan x="884.5" dy="17.25">함수기호를 어휘에 넣지 않았기 때문이다.</tspan><tspan x="884.5" dy="17.25">17장에서 산술을 다룰 때</tspan><tspan x="884.5" dy="17.25">이 자리가 채워진다</tspan></text></g><g ><g class="shape"><path d="M303 453h255v98H303z" class="stroke-B1 fill-B5 s0"/></g><text x="430.5" y="491.5" class="text-bold fill-N1 s2"><tspan x="430.5" dy="0">F 가 1항이면 Fa Fx</tspan><tspan x="430.5" dy="17.667">G 가 2항이면 Gab Gxy Gax</tspan><tspan x="430.5" dy="17.667">H 가 3항이면 Habc</tspan></text></g><g ><g class="shape"><path d="M578 453h323v98H578z" class="stroke-B1 fill-B5 s0"/></g><text x="739.5" y="491.5" class="text-bold fill-N1 s2"><tspan x="739.5" dy="0">쉼표도 괄호도 쓰지 않는다.</tspan><tspan x="739.5" dy="17.667">항수가 미리 정해져 있으므로</tspan><tspan x="739.5" dy="17.667">몇 개를 읽을지 세기만 하면 된다</tspan></text></g><g ><g class="shape"><path d="M62 86h368v82H62z" class="stroke-B1 fill-B5 s0"/></g><text x="246" y="124.5" class="text-bold fill-N1 s2"><tspan x="246" dy="0">기저 — 모든 원자식과 ⊥ 은 적형식이다</tspan><tspan x="246" dy="18.5">(5장은 여기가 문장문자였다)</tspan></text></g><g ><g class="shape"><path d="M450 86h356v82H450z" class="stroke-B1 fill-B5 s0"/></g><text x="628" y="124.5" class="text-bold fill-N1 s2"><tspan x="628" dy="0">재귀 — ¬φ, (φ ∧ ψ), (φ ∨ ψ), (φ → ψ), (φ ↔ ψ)</tspan><tspan x="628" dy="18.5">그리고 새 조항 ∀xφ 와 ∃xφ</tspan></text></g><g ><g class="shape"><path d="M826 86h317v82H826z" class="stroke-B1 fill-B5 s0"/></g><text x="984.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="984.5" dy="0">폐포 — 위 조항을 유한 번 적용해</tspan><tspan x="984.5" dy="18.5">얻어지는 것만이 적형식이다</tspan></text></g><text x="602" y="1060" class="fill-N1 s2"><tspan x="602" dy="0">화살표가 한 방향뿐인 것이 이 그림의 요점이다.</tspan><tspan x="602" dy="16.5"> </tspan><tspan x="602" dy="16.5">Fa 는 원자식이지 항이 아니다. 그래서 FFa 라고 적을</tspan><tspan x="602" dy="16.5">수 없다 — F 는 항 하나를 받는데 Fa 가 항이 아니기</tspan><tspan x="602" dy="16.5">때문이다. 항은 대상 자리, 원자식부터는 문장 자리이고</tspan><tspan x="602" dy="16.5">그 둘은 섞이지 않는다.</tspan><tspan x="602" dy="16.5"> </tspan><tspan x="602" dy="16.5">거꾸로 원자식 자리에 항만 적어 두는 것도 안 된다.</tspan><tspan x="602" dy="16.5">‘a’ 나 ‘x’ 는 적형식이 아니다. 대상을 가리킬 뿐</tspan><tspan x="602" dy="16.5">무엇이라고 말하지 않기 때문이다</tspan></text><marker id="mk-d2-1316216463-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1316216463-3488378134)" d="M602.5 760V605" class="connection stroke-B1 s0" mask="url(#d2-1316216463)"/><text x="603" y="687" class="text-italic fill-N2 s2">술어 뒤에 항수만큼 늘어놓는다</text><path fill="none" marker-end="url(#mk-d2-1316216463-3488378134)" d="M602.5 377V222" class="connection stroke-B1 s0" mask="url(#d2-1316216463)"/><text x="602.5" y="304" class="text-italic fill-N2 s2">기저 조항이 된다</text><mask id="d2-1316216463" width="1383" height="1423" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1383v1423H-89z"/><path d="M471 671h264v21H471zM530 288h145v21H530z"/></mask></svg>