<svg xmlns="http://www.w3.org/2000/svg" width="1924" height="1409" class="d2-3751403827 d2-svg" viewBox="-91 -121 1924 1409"><rect width="1924" height="1409" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3751403827 .fill-N1{fill:#0a0f25}.d2-3751403827 .fill-N2{fill:#676c7e}.d2-3751403827 .fill-B4{fill:#e3e9fd}.d2-3751403827 .fill-B5{fill:#edf0fd}.d2-3751403827 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M321 20h484v377H321z" class="stroke-B1 fill-B4 s0"/></g><text x="563" y="7" class="text-bold fill-N1 s1">판정 문제 하나</text></g><g ><g class="shape"><path d="M22 558h1039v158H22z" class="stroke-B1 fill-B4 s0"/></g><text x="541.5" y="545" class="text-bold fill-N1 s1">판정 절차 — 세 조건을 다 지켜야 한다</text></g><g ><g class="shape"><path d="M10 856h1149v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="584.5" y="843" class="fill-N1 s1">하나라도 어기면</text></g><text x="964.5" y="1150" class="text-bold fill-N1 s2"><tspan x="964.5" dy="0">셋째만 어긴 것에는 따로 이름이 있다 — 반결정 가능(semi-decidable).</tspan><tspan x="964.5" dy="17.667">쓸모가 없지 않기 때문이다. 답이 예일 때는 확실히 알려 준다.</tspan><tspan x="964.5" dy="17.667">이 장의 마지막 절이 술어논리의 논리적 참 문제가 정확히 그 자리에 있음을 보인다</tspan></text><text x="1293.5" y="97" class="fill-N1 s2"><tspan x="1293.5" dy="0">판정 문제와 계산 문제를 섞지 않는다. ‘이 식의 파스 트리 높이는 얼마인가’ 는 값을 내놓으라는 문제이지</tspan><tspan x="1293.5" dy="18.5">예 · 아니오 물음이 아니다. 다만 ‘높이가 k 이상인가’ 처럼 물으면 판정 문제로 바꿔 놓을 수 있다</tspan></text><g ><g class="shape"><path d="M371 50h383v98H371z" class="stroke-B1 fill-B5 s0"/></g><text x="562.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="562.5" dy="0">입력의 모임</tspan><tspan x="562.5" dy="17.667">문자열로 적을 수 있는 것이면 무엇이든</tspan><tspan x="562.5" dy="17.667">— 논리식, 논증, 기계, 자연수</tspan></text></g><g ><g class="shape"><path d="M351 269h424v98H351z" class="stroke-B1 fill-B5 s0"/></g><text x="563" y="307.5" class="text-bold fill-N1 s2"><tspan x="563" dy="0">입력마다 붙는 예 · 아니오 물음</tspan><tspan x="563" dy="17.667">‘이 명제논리식은 항진명제인가’</tspan><tspan x="563" dy="17.667">물음 하나가 아니라 물음의 무한한 가족이다</tspan></text></g><g ><g class="shape"><path d="M52 588h301v98H52z" class="stroke-B1 fill-B5 s0"/></g><text x="202.5" y="626.5" class="text-bold fill-N1 s2"><tspan x="202.5" dy="0">1. 기계적이다</tspan><tspan x="202.5" dy="17.667">유한하게 적힌 규칙만 따른다.</tspan><tspan x="202.5" dy="17.667">통찰도 운도 쓰지 않는다</tspan></text></g><g ><g class="shape"><path d="M413 596h299v82H413z" class="stroke-B1 fill-B5 s0"/></g><text x="562.5" y="634.5" class="text-bold fill-N1 s2"><tspan x="562.5" dy="0">2. 모든 입력에 답한다</tspan><tspan x="562.5" dy="18.5">입력 하나라도 빠지면 안 된다</tspan></text></g><g ><g class="shape"><path d="M772 596h259v82H772z" class="stroke-B1 fill-B5 s0"/></g><text x="901.5" y="634.5" class="text-bold fill-N1 s2"><tspan x="901.5" dy="0">3. 반드시 멈춘다</tspan><tspan x="901.5" dy="18.5">유한 걸음 안에 답을 낸다</tspan></text></g><g ><g class="shape"><path d="M40 894h286v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="183" y="932.5" class="text-bold fill-N1 s2"><tspan x="183" dy="0">‘적당히 감으로 고른다’</tspan><tspan x="183" dy="18.5">— 1 을 어긴다. 절차가 아니다</tspan></text></g><g ><g class="shape"><path d="M386 894h353v82H386z" class="stroke-B1 fill-B5 s0"/></g><text x="562.5" y="932.5" class="text-bold fill-N1 s2"><tspan x="562.5" dy="0">‘문자 열 개 이하인 식만 다룬다’</tspan><tspan x="562.5" dy="18.5">— 2 를 어긴다. 다른 문제를 푼 것이다</tspan></text></g><g ><g class="shape"><path d="M799 886h330v98H799z" class="stroke-B1 fill-B5 s0"/></g><text x="964" y="924.5" class="text-bold fill-N1 s2"><tspan x="964" dy="0">‘답이 예이면 멈추고 알려 준다.</tspan><tspan x="964" dy="17.667">아니오이면 영원히 돌 수도 있다’</tspan><tspan x="964" dy="17.667">— 3 만 어긴다</tspan></text></g><marker id="mk-d2-3751403827-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3751403827-3488378134)" d="M562.5 149.5v116" class="connection stroke-B1 s0" mask="url(#d2-3751403827)"/><text x="562.5" y="214" class="text-italic fill-N2 s2">각 입력에</text><path fill="none" marker-end="url(#mk-d2-3751403827-3488378134)" d="M562.5 398.5v115" class="connection stroke-B1 s0" mask="url(#d2-3751403827)"/><text x="562.5" y="463" class="text-italic fill-N2 s2">이 물음에 답하라</text><path fill="none" marker-end="url(#mk-d2-3751403827-3488378134)" d="M562.5 718v93" class="connection stroke-B1 s0" mask="url(#d2-3751403827)"/><path fill="none" marker-end="url(#mk-d2-3751403827-3488378134)" d="M964 986v144" class="connection stroke-B1 s0" mask="url(#d2-3751403827)"/><mask id="d2-3751403827" width="1924" height="1409" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1924v1409H-91z"/><path d="M520 198h85v21h-85zM490 447h145v21H490z"/></mask></svg>