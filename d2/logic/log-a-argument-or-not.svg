<svg xmlns="http://www.w3.org/2000/svg" width="1286" height="1377" class="d2-1269779092 d2-svg" viewBox="-101 -101 1286 1377"><rect width="1286" height="1377" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1269779092 .text-bold{font-weight:700}.d2-1269779092 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1269779092 .fill-N1{fill:#0a0f25}.d2-1269779092 .fill-N2{fill:#676c7e}.d2-1269779092 .fill-B6{fill:#f7f8fe}.d2-1269779092 .stroke-B1,.d2-1269779092 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="715" cy="61" class="shape stroke-B1 fill-B6 s0" rx="183" ry="61"/></g><text x="715" y="66.5" class="text-bold fill-N1 s1">문장 몇 개가 나란히 있다</text></g><g ><g class="shape"><path d="M567 222h296v82H567z" class="stroke-B1 fill-B6 s0"/></g><text x="715" y="260.5" class="text-bold fill-N1 s1"><tspan x="715" dy="0">이 묶음이 받아들이게 하려는</tspan><tspan x="715" dy="18.5">문장이 하나 있는가</tspan></text></g><g ><g class="shape"><path d="M388 433h276v82H388z" class="stroke-B1 fill-B6 s0"/></g><text x="526" y="471.5" class="text-bold fill-N1 s1"><tspan x="526" dy="0">그 문장을 받아들일 이유로</tspan><tspan x="526" dy="18.5">다른 문장을 대는가</tspan></text></g><g ><g class="shape"><path d="M243 652h252v82H243z" class="stroke-B1 fill-B6 s0"/></g><text x="369" y="690.5" class="text-bold fill-N1 s1"><tspan x="369" dy="0">듣는 사람이 그 문장을</tspan><tspan x="369" dy="18.5">이미 참이라고 여기는가</tspan></text></g><g ><g class="shape"><path d="M724 425h360v98H724z" class="stroke-B2 fill-B6 s2"/></g><text x="904" y="463.5" class="text-bold fill-N1 s1"><tspan x="904" dy="0">서술</tspan><tspan x="904" dy="17.667">무슨 일이 있었는지 늘어놓을 뿐이다</tspan><tspan x="904" dy="17.667">결론이라 할 문장이 없다</tspan></text></g><g ><g class="shape"><path d="M555 644h255v98H555z" class="stroke-B2 fill-B6 s2"/></g><text x="682.5" y="682.5" class="text-bold fill-N1 s1"><tspan x="682.5" dy="0">주장</tspan><tspan x="682.5" dy="17.667">결론만 있고 이유가 없다</tspan><tspan x="682.5" dy="17.667">전제가 없다</tspan></text></g><g ><g class="shape"><path d="M0 863h319v98H0z" class="stroke-B2 fill-B6 s2"/></g><text x="159.5" y="901.5" class="text-bold fill-N1 s1"><tspan x="159.5" dy="0">설명</tspan><tspan x="159.5" dy="17.667">왜 그렇게 되었는지를 말한다</tspan><tspan x="159.5" dy="17.667">결론을 믿게 하려는 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M379 871h400v82H379z" class="stroke-B1 fill-B6 s0"/></g><text x="579" y="909.5" class="text-bold fill-N1 s1"><tspan x="579" dy="0">논증(argument)</tspan><tspan x="579" dy="18.5">전제가 결론을 받아들일 이유로 제시된다</tspan></text></g><path fill="transparent" stroke="transparent" d="M233 981h617v194H233z" class="shape s0"/><text x="502" y="1021" class="fill-N1 s1"><tspan x="502" dy="0">설명과 논증은 겉모양이 같다. 둘 다 ‘A 이므로 B 다’ 꼴이다.</tspan><tspan x="502" dy="17.25">가르는 것은 B 의 지위다. B 를 이미 받아들였으면 설명이고,</tspan><tspan x="502" dy="17.25">B 를 받아들이게 하려는 것이면 논증이다.</tspan><tspan x="502" dy="17.25">같은 문장이 자리를 바꾸면 설명이 논증이 되기도 한다</tspan></text><text x="541.5" y="1114" class="fill-N1 s1"><tspan x="541.5" dy="0">논리학이 다루는 것은 실선으로 그린 상자 하나, 곧 논증뿐이다.</tspan><tspan x="541.5" dy="17.667">점선 상자 셋이 나쁘다는 뜻이 아니다. 좋은 서술도 좋은 설명도 있다.</tspan><tspan x="541.5" dy="17.667">다만 타당·부당이라는 잣대가 그것들에는 맞지 않는다</tspan></text><marker id="mk-d2-1269779092-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1269779092-3488378134)" d="M715 124v94" class="connection stroke-B1 s0" mask="url(#d2-1269779092)"/><path fill="none" marker-end="url(#mk-d2-1269779092-3488378134)" d="M792.76 304.45C881.4 352.3 904 376.7 904 421.5" class="connection stroke-B1 s0" mask="url(#d2-1269779092)"/><text x="872" y="353" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1269779092-3488378134)" d="M637.24 304.45C548.6 352.3 526 378.3 526 429.5" class="connection stroke-B1 s0" mask="url(#d2-1269779092)"/><text x="554" y="355" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-1269779092-3488378134)" d="M586.385 515.651C663.15 569.7 682.75 595.7 682.75 640.5" class="connection stroke-B1 s0" mask="url(#d2-1269779092)"/><text x="657" y="571" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1269779092-3488378134)" d="M465.615 515.651C388.85 569.7 369.25 597.3 369.25 648.5" class="connection stroke-B1 s0" mask="url(#d2-1269779092)"/><text x="392" y="573" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-1269779092-3488378134)" d="M288.73 734.432C185.7 788.7 159.5 814.7 159.5 859.5" class="connection stroke-B1 s0" mask="url(#d2-1269779092)"/><text x="200" y="787" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-1269779092-3488378134)" d="M449.77 734.432C552.8 788.7 579 816.3 579 867.5" class="connection stroke-B1 s0" mask="url(#d2-1269779092)"/><text x="542" y="788" class="text-italic fill-N2 s1">아니오</text><mask id="d2-1269779092" width="1286" height="1377" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1286v1377H-101z"/><path d="M841 337h62v21h-62zM542 339h24v21h-24zM626 555h62v21h-62zM380 557h24v21h-24zM188 771h24v21h-24zM511 772h62v21h-62z"/></mask></svg>