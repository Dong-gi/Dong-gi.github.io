<svg xmlns="http://www.w3.org/2000/svg" width="2656" height="779" class="d2-3959304665 d2-svg" viewBox="-101 -101 2656 779"><rect width="2656" height="779" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3959304665 .fill-N1{fill:#0a0f25}.d2-3959304665 .fill-N2{fill:#676c7e}.d2-3959304665 .fill-B6{fill:#f7f8fe}.d2-3959304665 .stroke-B1,.d2-3959304665 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="285" cy="274" class="shape stroke-B1 fill-B6 s0" rx="183" ry="61"/></g><text x="285" y="279.5" class="text-bold fill-N1 s1">문장 몇 개가 나란히 있다</text></g><g ><g class="shape"><path d="M669 233h296v82H669z" class="stroke-B1 fill-B6 s0"/></g><text x="817" y="271.5" class="text-bold fill-N1 s1"><tspan x="817" dy="0">이 묶음이 받아들이게 하려는</tspan><tspan x="817" dy="18.5">문장이 하나 있는가</tspan></text></g><g ><g class="shape"><path d="M1165 158h276v82h-276z" class="stroke-B1 fill-B6 s0"/></g><text x="1303" y="196.5" class="text-bold fill-N1 s1"><tspan x="1303" dy="0">그 문장을 받아들일 이유로</tspan><tspan x="1303" dy="18.5">다른 문장을 대는가</tspan></text></g><g ><g class="shape"><path d="M1643 83h252v82h-252z" class="stroke-B1 fill-B6 s0"/></g><text x="1769" y="121.5" class="text-bold fill-N1 s1"><tspan x="1769" dy="0">듣는 사람이 그 문장을</tspan><tspan x="1769" dy="18.5">이미 참이라고 여기는가</tspan></text></g><g ><g class="shape"><path d="M1123 300h360v98h-360z" class="stroke-B2 fill-B6 s2"/></g><text x="1303" y="338.5" class="text-bold fill-N1 s1"><tspan x="1303" dy="0">서술</tspan><tspan x="1303" dy="17.667">무슨 일이 있었는지 늘어놓을 뿐이다</tspan><tspan x="1303" dy="17.667">결론이라 할 문장이 없다</tspan></text></g><g ><g class="shape"><path d="M1641 225h255v98h-255z" class="stroke-B2 fill-B6 s2"/></g><text x="1768.5" y="263.5" class="text-bold fill-N1 s1"><tspan x="1768.5" dy="0">주장</tspan><tspan x="1768.5" dy="17.667">결론만 있고 이유가 없다</tspan><tspan x="1768.5" dy="17.667">전제가 없다</tspan></text></g><g ><g class="shape"><path d="M2095 0h319v98h-319z" class="stroke-B2 fill-B6 s2"/></g><text x="2254.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="2254.5" dy="0">설명</tspan><tspan x="2254.5" dy="17.667">왜 그렇게 되었는지를 말한다</tspan><tspan x="2254.5" dy="17.667">결론을 믿게 하려는 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M2054 158h400v82h-400z" class="stroke-B1 fill-B6 s0"/></g><text x="2254" y="196.5" class="text-bold fill-N1 s1"><tspan x="2254" dy="0">논증(argument)</tspan><tspan x="2254" dy="18.5">전제가 결론을 받아들일 이유로 제시된다</tspan></text></g><text x="285" y="411" class="fill-N1 s1"><tspan x="285" dy="0">설명과 논증은 겉모양이 같다. 둘 다 ‘A 이므로 B 다’ 꼴이다.</tspan><tspan x="285" dy="17.25">가르는 것은 B 의 지위다. B 를 이미 받아들였으면 설명이고,</tspan><tspan x="285" dy="17.25">B 를 받아들이게 하려는 것이면 논증이다.</tspan><tspan x="285" dy="17.25">같은 문장이 자리를 바꾸면 설명이 논증이 되기도 한다</tspan></text><text x="284.5" y="540" class="fill-N1 s1"><tspan x="284.5" dy="0">논리학이 다루는 것은 실선으로 그린 상자 하나, 곧 논증뿐이다.</tspan><tspan x="284.5" dy="17.667">점선 상자 셋이 나쁘다는 뜻이 아니다. 좋은 서술도 좋은 설명도 있다.</tspan><tspan x="284.5" dy="17.667">다만 타당·부당이라는 잣대가 그것들에는 맞지 않는다</tspan></text><marker id="mk-d2-3959304665-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3959304665-3488378134)" d="M470 274h195" class="connection stroke-B1 s0" mask="url(#d2-3959304665)"/><path fill="none" marker-end="url(#mk-d2-3959304665-3488378134)" d="M942.9 315.627C1023.4 342.2 1059.8 349 1119 349" class="connection stroke-B1 s0" mask="url(#d2-3959304665)"/><text x="1030" y="349" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-3959304665-3488378134)" d="M942.9 232.373C1023.4 205.8 1068.2 199 1161 199" class="connection stroke-B1 s0" mask="url(#d2-3959304665)"/><text x="1051" y="207" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-3959304665-3488378134)" d="M1442.921 239.556C1537.8 267 1577.8 274 1637 274" class="connection stroke-B1 s0" mask="url(#d2-3959304665)"/><text x="1539" y="273" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-3959304665-3488378134)" d="M1442.921 158.444C1537.8 131 1578.1 124 1638.5 124" class="connection stroke-B1 s0" mask="url(#d2-3959304665)"/><text x="1540" y="136" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-3959304665-3488378134)" d="M1882.88 82.32C1956.2 55.8 1998.9 49 2090.5 49" class="connection stroke-B1 s0" mask="url(#d2-3959304665)"/><text x="1985" y="57" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-3959304665-3488378134)" d="M1882.88 165.68C1956.2 192.2 1990.8 199 2050 199" class="connection stroke-B1 s0" mask="url(#d2-3959304665)"/><text x="1965" y="199" class="text-italic fill-N2 s1">아니오</text><mask id="d2-3959304665" width="2656" height="779" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2656v779H-101z"/><path d="M999 333h62v21h-62zM1039 191h24v21h-24zM1508 257h62v21h-62zM1528 120h24v21h-24zM1973 41h24v21h-24zM1934 183h62v21h-62z"/></mask></svg>