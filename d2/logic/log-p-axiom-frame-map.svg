<svg xmlns="http://www.w3.org/2000/svg" width="1439" height="1191" class="d2-1009779548 d2-svg" viewBox="-91 -101 1439 1191"><rect width="1439" height="1191" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1009779548 .fill-N1{fill:#0a0f25}.d2-1009779548 .fill-B4{fill:#e3e9fd}.d2-1009779548 .fill-B5{fill:#edf0fd}.d2-1009779548 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M378 0h869v522H378z" class="stroke-B1 fill-B4 s0"/></g><text x="812.5" y="33" class="text-bold fill-N1 s1">공리 하나가 관계 조건 하나와 정확히 맞물린다</text></g><g ><g class="shape"><path d="M10 642h1116v174H10z" class="stroke-B1 fill-B4 s0"/></g><text x="568" y="629" class="text-bold fill-N1 s1">이 표 자체가 정리다</text></g><text x="812.5" y="952" class="text-bold fill-N1 s2"><tspan x="812.5" dy="0">양쪽 층을 섞지 마라. 왼쪽 칸은 논리식이고 오른쪽 칸은 논리식이 아니다.</tspan><tspan x="812.5" dy="17.667">R 이 반사적이라는 말은 양상 언어 안에서 적을 수 없다 — 우리가 프레임에 대해 하는 말이다.</tspan><tspan x="812.5" dy="17.667">5장이 대상언어와 메타언어를 갈라 둔 것이 이 장에서 다시 값을 한다</tspan></text><g ><g class="shape"><path d="M386 46h252v82H386z" class="stroke-B1 fill-B5 s0"/></g><text x="512" y="84.5" class="text-bold fill-N1 s2"><tspan x="512" dy="0">공리 이름과 도식</tspan><tspan x="512" dy="18.5">대상언어에 적힌 논리식</tspan></text></g><g ><g class="shape"><path d="M646 46h128v82H646z" class="stroke-B1 fill-B5 s0"/></g><text x="710" y="92.5" class="text-bold fill-N1 s2">⟺</text></g><g ><g class="shape"><path d="M782 46h457v82H782z" class="stroke-B1 fill-B5 s0"/></g><text x="1010.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="1010.5" dy="0">프레임 ⟨W, R⟩ 의 조건</tspan><tspan x="1010.5" dy="18.5">R 에 대한 메타언어의 말</tspan></text></g><g ><g class="shape"><path d="M386 136h252v82H386z" class="stroke-B1 fill-B5 s0"/></g><text x="512" y="182.5" class="text-bold fill-N1 s2">K □(φ → ψ) → (□φ → □ψ)</text></g><g ><g class="shape"><path d="M646 136h128v82H646z" class="stroke-B1 fill-B5 s0"/></g><text x="710" y="182.5" class="text-bold fill-N1 s2">조건 없음</text></g><g ><g class="shape"><path d="M782 136h457v82H782z" class="stroke-B1 fill-B5 s0"/></g><text x="1010.5" y="174.5" class="text-bold fill-N1 s2"><tspan x="1010.5" dy="0">모든 프레임에서 타당하다.</tspan><tspan x="1010.5" dy="18.5">대응이라 부를 것이 없는 바닥이다</tspan></text></g><g ><g class="shape"><path d="M386 226h252v66H386z" class="stroke-B1 fill-B5 s0"/></g><text x="512" y="264.5" class="text-bold fill-N1 s2">D □φ → ◇φ</text></g><g ><g class="shape"><path d="M646 226h128v66H646z" class="stroke-B1 fill-B5 s0"/></g><text x="710" y="264.5" class="text-bold fill-N1 s2">⟺</text></g><g ><g class="shape"><path d="M782 226h457v66H782z" class="stroke-B1 fill-B5 s0"/></g><text x="1010.5" y="264.5" class="text-bold fill-N1 s2">직렬적 — 모든 w 에 나가는 화살표가 하나는 있다</text></g><g ><g class="shape"><path d="M386 300h252v66H386z" class="stroke-B1 fill-B5 s0"/></g><text x="512" y="338.5" class="text-bold fill-N1 s2">T □φ → φ</text></g><g ><g class="shape"><path d="M646 300h128v66H646z" class="stroke-B1 fill-B5 s0"/></g><text x="710" y="338.5" class="text-bold fill-N1 s2">⟺</text></g><g ><g class="shape"><path d="M782 300h457v66H782z" class="stroke-B1 fill-B5 s0"/></g><text x="1010.5" y="338.5" class="text-bold fill-N1 s2">반사적 — 모든 w 에 대해 wRw</text></g><g ><g class="shape"><path d="M386 374h252v66H386z" class="stroke-B1 fill-B5 s0"/></g><text x="512" y="412.5" class="text-bold fill-N1 s2">4 □φ → □□φ</text></g><g ><g class="shape"><path d="M646 374h128v66H646z" class="stroke-B1 fill-B5 s0"/></g><text x="710" y="412.5" class="text-bold fill-N1 s2">⟺</text></g><g ><g class="shape"><path d="M782 374h457v66H782z" class="stroke-B1 fill-B5 s0"/></g><text x="1010.5" y="412.5" class="text-bold fill-N1 s2">추이적 — wRu 이고 uRv 이면 wRv</text></g><g ><g class="shape"><path d="M386 448h252v66H386z" class="stroke-B1 fill-B5 s0"/></g><text x="512" y="486.5" class="text-bold fill-N1 s2">5 ◇φ → □◇φ</text></g><g ><g class="shape"><path d="M646 448h128v66H646z" class="stroke-B1 fill-B5 s0"/></g><text x="710" y="486.5" class="text-bold fill-N1 s2">⟺</text></g><g ><g class="shape"><path d="M782 448h457v66H782z" class="stroke-B1 fill-B5 s0"/></g><text x="1010.5" y="486.5" class="text-bold fill-N1 s2">유클리드적 — wRu 이고 wRv 이면 uRv</text></g><g ><g class="shape"><path d="M40 680h429v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="254.5" y="718.5" class="text-bold fill-N1 s2"><tspan x="254.5" dy="0">← 쉬운 방향</tspan><tspan x="254.5" dy="17.667">프레임이 그 성질을 가지면 공리가 타당하다.</tspan><tspan x="254.5" dy="17.667">□ 조항을 펴고 성질을 한 번 쓰면 끝난다</tspan></text></g><g ><g class="shape"><path d="M529 672h567v114H529z" class="stroke-B1 fill-B5 s0"/></g><text x="812.5" y="710.5" class="text-bold fill-N1 s2"><tspan x="812.5" dy="0">→ 어려운 방향</tspan><tspan x="812.5" dy="17.25">공리가 프레임에서 타당하면 프레임이 그 성질을 갖는다.</tspan><tspan x="812.5" dy="17.25">대우로 간다 — 성질이 깨진 자리를 잡고</tspan><tspan x="812.5" dy="17.25">그 자리를 겨냥한 배당 V 를 손으로 만들어 공리를 무너뜨린다</tspan></text></g><marker id="mk-d2-1009779548-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1009779548-3488378134)" d="M812.5 524v114" class="connection stroke-B1 s0" mask="url(#d2-1009779548)"/><path fill="none" marker-end="url(#mk-d2-1009779548-3488378134)" d="M812.5 818v114" class="connection stroke-B1 s0" mask="url(#d2-1009779548)"/><mask id="d2-1009779548" width="1439" height="1191" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1439v1191H-91z"/></mask></svg>