<svg xmlns="http://www.w3.org/2000/svg" width="1038" height="1211" class="d2-3186208902 d2-svg" viewBox="-89 -89 1038 1211"><rect width="1038" height="1211" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3186208902 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3186208902 .fill-N1{fill:#0a0f25}.d2-3186208902 .fill-B4{fill:#e3e9fd}.d2-3186208902 .fill-B5{fill:#edf0fd}.d2-3186208902 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M50 12h759v538H50z" class="stroke-B1 fill-B4 s0"/></g><text x="429.5" y="45" class="text-bold fill-N1 s1">공리 하나가 관계 조건 하나와 정확히 맞물린다</text></g><g ><g class="shape"><path d="M12 620h836v246H12z" class="stroke-B1 fill-B4 s0"/></g><text x="430" y="653" class="text-bold fill-N1 s1">이 표 자체가 정리다</text></g><text x="430" y="952" class="text-bold fill-N1 s2"><tspan x="430" dy="0">양쪽 층을 섞지 마라.</tspan><tspan x="430" dy="17">왼쪽 칸은 논리식이고 오른쪽 칸은 논리식이 아니다.</tspan><tspan x="430" dy="17">R 이 반사적이라는 말은 양상 언어 안에서 적을 수 없다 —</tspan><tspan x="430" dy="17">우리가 프레임에 대해 하는 말이다.</tspan><tspan x="430" dy="17">5장이 대상언어와 메타언어를 갈라 둔 것이 이 장에서 다시 값을 한다</tspan></text><g ><g class="shape"><path d="M58 58h252v82H58z" class="stroke-B1 fill-B5 s0"/></g><text x="184" y="96.5" class="text-bold fill-N1 s2"><tspan x="184" dy="0">공리 이름과 도식</tspan><tspan x="184" dy="18.5">대상언어에 적힌 논리식</tspan></text></g><g ><g class="shape"><path d="M318 58h128v82H318z" class="stroke-B1 fill-B5 s0"/></g><text x="382" y="104.5" class="text-bold fill-N1 s2">⟺</text></g><g ><g class="shape"><path d="M454 58h347v82H454z" class="stroke-B1 fill-B5 s0"/></g><text x="627.5" y="96.5" class="text-bold fill-N1 s2"><tspan x="627.5" dy="0">프레임 ⟨W, R⟩ 의 조건</tspan><tspan x="627.5" dy="18.5">R 에 대한 메타언어의 말</tspan></text></g><g ><g class="shape"><path d="M58 148h252v82H58z" class="stroke-B1 fill-B5 s0"/></g><text x="184" y="194.5" class="text-bold fill-N1 s2">K □(φ → ψ) → (□φ → □ψ)</text></g><g ><g class="shape"><path d="M318 148h128v82H318z" class="stroke-B1 fill-B5 s0"/></g><text x="382" y="194.5" class="text-bold fill-N1 s2">조건 없음</text></g><g ><g class="shape"><path d="M454 148h347v82H454z" class="stroke-B1 fill-B5 s0"/></g><text x="627.5" y="186.5" class="text-bold fill-N1 s2"><tspan x="627.5" dy="0">모든 프레임에서 타당하다.</tspan><tspan x="627.5" dy="18.5">대응이라 부를 것이 없는 바닥이다</tspan></text></g><g ><g class="shape"><path d="M58 238h252v82H58z" class="stroke-B1 fill-B5 s0"/></g><text x="184" y="284.5" class="text-bold fill-N1 s2">D □φ → ◇φ</text></g><g ><g class="shape"><path d="M318 238h128v82H318z" class="stroke-B1 fill-B5 s0"/></g><text x="382" y="284.5" class="text-bold fill-N1 s2">⟺</text></g><g ><g class="shape"><path d="M454 238h347v82H454z" class="stroke-B1 fill-B5 s0"/></g><text x="627.5" y="276.5" class="text-bold fill-N1 s2"><tspan x="627.5" dy="0">직렬적 — 모든 w 에</tspan><tspan x="627.5" dy="18.5">나가는 화살표가 하나는 있다</tspan></text></g><g ><g class="shape"><path d="M58 328h252v66H58z" class="stroke-B1 fill-B5 s0"/></g><text x="184" y="366.5" class="text-bold fill-N1 s2">T □φ → φ</text></g><g ><g class="shape"><path d="M318 328h128v66H318z" class="stroke-B1 fill-B5 s0"/></g><text x="382" y="366.5" class="text-bold fill-N1 s2">⟺</text></g><g ><g class="shape"><path d="M454 328h347v66H454z" class="stroke-B1 fill-B5 s0"/></g><text x="627.5" y="366.5" class="text-bold fill-N1 s2">반사적 — 모든 w 에 대해 wRw</text></g><g ><g class="shape"><path d="M58 402h252v66H58z" class="stroke-B1 fill-B5 s0"/></g><text x="184" y="440.5" class="text-bold fill-N1 s2">4 □φ → □□φ</text></g><g ><g class="shape"><path d="M318 402h128v66H318z" class="stroke-B1 fill-B5 s0"/></g><text x="382" y="440.5" class="text-bold fill-N1 s2">⟺</text></g><g ><g class="shape"><path d="M454 402h347v66H454z" class="stroke-B1 fill-B5 s0"/></g><text x="627.5" y="440.5" class="text-bold fill-N1 s2">추이적 — wRu 이고 uRv 이면 wRv</text></g><g ><g class="shape"><path d="M58 476h252v66H58z" class="stroke-B1 fill-B5 s0"/></g><text x="184" y="514.5" class="text-bold fill-N1 s2">5 ◇φ → □◇φ</text></g><g ><g class="shape"><path d="M318 476h128v66H318z" class="stroke-B1 fill-B5 s0"/></g><text x="382" y="514.5" class="text-bold fill-N1 s2">⟺</text></g><g ><g class="shape"><path d="M454 476h347v66H454z" class="stroke-B1 fill-B5 s0"/></g><text x="627.5" y="514.5" class="text-bold fill-N1 s2">유클리드적 — wRu 이고 wRv 이면 uRv</text></g><g ><g class="shape"><path d="M62 678h317v130H62z" class="stroke-B1 fill-B5 s0"/></g><text x="220.5" y="716.5" class="text-bold fill-N1 s2"><tspan x="220.5" dy="0">← 쉬운 방향</tspan><tspan x="220.5" dy="17">프레임이 그 성질을 가지면</tspan><tspan x="220.5" dy="17">공리가 타당하다.</tspan><tspan x="220.5" dy="17">□ 조항을 펴고 성질을 한 번 쓰면</tspan><tspan x="220.5" dy="17">끝난다</tspan></text></g><g ><g class="shape"><path d="M399 670h399v146H399z" class="stroke-B1 fill-B5 s0"/></g><text x="598.5" y="708.5" class="text-bold fill-N1 s2"><tspan x="598.5" dy="0">→ 어려운 방향</tspan><tspan x="598.5" dy="16.833">공리가 프레임에서 타당하면</tspan><tspan x="598.5" dy="16.833">프레임이 그 성질을 갖는다.</tspan><tspan x="598.5" dy="16.833">대우로 간다 — 성질이 깨진 자리를 잡고</tspan><tspan x="598.5" dy="16.833">그 자리를 겨냥한 배당 V 를 손으로 만들어</tspan><tspan x="598.5" dy="16.833">공리를 무너뜨린다</tspan></text></g><marker id="mk-d2-3186208902-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3186208902-3488378134)" d="M430 552v64" class="connection stroke-B1 s0" mask="url(#d2-3186208902)"/><path fill="none" marker-end="url(#mk-d2-3186208902-3488378134)" d="M430 868v64" class="connection stroke-B1 s0" mask="url(#d2-3186208902)"/><mask id="d2-3186208902" width="1038" height="1211" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H949v1211H-89z"/></mask></svg>