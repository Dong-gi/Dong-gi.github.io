<svg xmlns="http://www.w3.org/2000/svg" width="1412" height="1378" class="d2-302395895 d2-svg" viewBox="-91 -101 1412 1378"><rect width="1412" height="1378" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-302395895 .fill-N1{fill:#0a0f25}.d2-302395895 .fill-B4{fill:#e3e9fd}.d2-302395895 .fill-B5{fill:#edf0fd}.d2-302395895 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M183 0h838v154H183z" class="stroke-B1 fill-B4 s0"/></g><text x="602" y="33" class="text-bold fill-N1 s1">4부의 결론 — 두 층이 만난다</text></g><g ><g class="shape"><path d="M136 254h932v168H136z" class="stroke-B1 fill-B4 s0"/></g><text x="602" y="287" class="fill-N1 s1">곧바로 따라 나오는 것 셋</text></g><text x="602.5" y="538" class="fill-N1 s2"><tspan x="602.5" dy="0">쓸 수 있게 되는 것 — 7장과 11장이 남긴 구멍이 메워진다.</tspan><tspan x="602.5" dy="17.667">‘ 도출이 없다 ’ 를 반례 모형 하나로 확정할 수 있고,</tspan><tspan x="602.5" dy="17.667">‘ 귀결이다 ’ 를 도출 한 벌로 확정할 수 있다. 편한 쪽을 골라 쓴다</tspan></text><g ><g class="shape"><path d="M10 695h1189v324H10z" class="stroke-B1 fill-B4 s0"/></g><text x="604.5" y="682" class="text-bold fill-N1 s1">그런데 여기는 여전히 비어 있다</text></g><text x="899.5" y="1155" class="text-bold fill-N1 s2"><tspan x="899.5" dy="0">명제논리는 사정이 다르다 — 6장의 진리표가 유한한 판정 절차를 준다.</tspan><tspan x="899.5" dy="18.5">술어논리에는 그런 절차가 없고, 없다는 것 자체가 정리다. 그것이 16장이다</tspan></text><g ><g class="shape"><path d="M193 46h293v98H193z" class="stroke-B1 fill-B5 s0"/></g><text x="339.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="339.5" dy="0">Γ ⊢ φ</tspan><tspan x="339.5" dy="17.667">도출이 하나 있다.</tspan><tspan x="339.5" dy="17.667">확인 — 종이 한 장을 내놓는다</tspan></text></g><g ><g class="shape"><path d="M496 46h235v98H496z" class="stroke-B1 fill-B5 s0"/></g><text x="613.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="613.5" dy="0">13장 건전성 ⊢ ⟹ ⊨</tspan><tspan x="613.5" dy="17.667">14장 완전성 ⊨ ⟹ ⊢</tspan><tspan x="613.5" dy="17.667">두 화살표가 다 놓였다</tspan></text></g><g ><g class="shape"><path d="M741 46h270v98H741z" class="stroke-B1 fill-B5 s0"/></g><text x="876" y="84.5" class="text-bold fill-N1 s2"><tspan x="876" dy="0">Γ ⊨ φ</tspan><tspan x="876" dy="17.667">모든 모형이 그렇다.</tspan><tspan x="876" dy="17.667">확인 — 모형 전부를 훑는다</tspan></text></g><g ><g class="shape"><path d="M144 300h305v114H144z" class="stroke-B1 fill-B5 s0"/></g><text x="296.5" y="338.5" class="text-bold fill-N1 s2"><tspan x="296.5" dy="0">일관적 ⟺ 만족가능하다</tspan><tspan x="296.5" dy="17.25">7장이 도출로 정의한 성질과</tspan><tspan x="296.5" dy="17.25">6장이 배당으로 정의한 성질이</tspan><tspan x="296.5" dy="17.25">같은 집합을 가려낸다</tspan></text></g><g ><g class="shape"><path d="M457 300h235v114H457z" class="stroke-B1 fill-B5 s0"/></g><text x="574.5" y="346.5" class="text-bold fill-N1 s2"><tspan x="574.5" dy="0">⊢ φ ⟺ ⊨ φ</tspan><tspan x="574.5" dy="17.667">이 체계의 정리 전체가</tspan><tspan x="574.5" dy="17.667">논리적 참 전체와 같다</tspan></text></g><g ><g class="shape"><path d="M700 300h360v114H700z" class="stroke-B1 fill-B5 s0"/></g><text x="880" y="338.5" class="text-bold fill-N1 s2"><tspan x="880" dy="0">컴팩트성</tspan><tspan x="880" dy="17.25">모든 유한 부분집합이 모형을 가지면</tspan><tspan x="880" dy="17.25">전체도 모형을 갖는다.</tspan><tspan x="880" dy="17.25">15장이 여기서 시작한다</tspan></text></g><g ><g class="shape"><path d="M357 725h491v82H357z" class="stroke-B1 fill-B5 s0"/></g><text x="602.5" y="763.5" class="text-bold fill-N1 s2"><tspan x="602.5" dy="0">판정 절차 — 아무 Γ 와 φ 를 받아</tspan><tspan x="602.5" dy="18.5">언제나 유한한 시간에 예 또는 아니오를 내놓는 방법</tspan></text></g><g ><g class="shape"><path d="M40 907h530v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="305" y="945.5" class="text-bold fill-N1 s2"><tspan x="305" dy="0">얻은 것 — 반열거. 도출을 전부 늘어놓고 하나씩 검사하면</tspan><tspan x="305" dy="18.5">Γ ⊨ φ 인 경우 언젠가 반드시 찾는다</tspan></text></g><g ><g class="shape"><path d="M630 907h539v82H630z" class="stroke-B1 fill-B5 s0"/></g><text x="899.5" y="945.5" class="text-bold fill-N1 s2"><tspan x="899.5" dy="0">못 얻은 것 — Γ ⊭ φ 인 경우 그 절차는 영원히 멈추지 않는다.</tspan><tspan x="899.5" dy="18.5">멈추지 않는 것과 아직 못 찾은 것을 구별할 방법이 없다</tspan></text></g><marker id="mk-d2-302395895-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-302395895-3488378134)" d="M466.088 807.587C337.6 847 305 867 305 903" class="connection stroke-B1 s0" mask="url(#d2-302395895)"/><path fill="none" marker-end="url(#mk-d2-302395895-3488378134)" d="M738.412 807.587C866.9 847 899.5 867 899.5 903" class="connection stroke-B1 s0" mask="url(#d2-302395895)"/><path fill="none" marker-end="url(#mk-d2-302395895-3488378134)" d="M602.25 156v94" class="connection stroke-B1 s0" mask="url(#d2-302395895)"/><path fill="none" marker-end="url(#mk-d2-302395895-3488378134)" d="M602.25 424v94" class="connection stroke-B1 s0" mask="url(#d2-302395895)"/><path fill="none" marker-end="url(#mk-d2-302395895-3488378134)" d="M602.25 577v73" class="connection stroke-B1 s0" mask="url(#d2-302395895)"/><path fill="none" marker-end="url(#mk-d2-302395895-3488378134)" d="M899.5 1021v114" class="connection stroke-B1 s0" mask="url(#d2-302395895)"/><mask id="d2-302395895" width="1412" height="1378" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1412v1378H-91z"/></mask></svg>