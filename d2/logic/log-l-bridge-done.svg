<svg xmlns="http://www.w3.org/2000/svg" width="1023" height="1398" class="d2-855978747 d2-svg" viewBox="-89 -89 1023 1398"><rect width="1023" height="1398" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-855978747 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-855978747 .fill-N1{fill:#0a0f25}.d2-855978747 .fill-B4{fill:#e3e9fd}.d2-855978747 .fill-B5{fill:#edf0fd}.d2-855978747 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M59 12h727v170H59z" class="stroke-B1 fill-B4 s0"/></g><text x="422.5" y="45" class="text-bold fill-N1 s1">4부의 결론 — 두 층이 만난다</text></g><g ><g class="shape"><path d="M12 252h821v184H12z" class="stroke-B1 fill-B4 s0"/></g><text x="422.5" y="285" class="fill-N1 s1">곧바로 따라 나오는 것 셋</text></g><text x="422" y="522" class="fill-N1 s2"><tspan x="422" dy="0">쓸 수 있게 되는 것 —</tspan><tspan x="422" dy="17">7장과 11장이 남긴 구멍이 메워진다.</tspan><tspan x="422" dy="17">‘ 도출이 없다 ’ 를 반례 모형 하나로 확정할 수 있고,</tspan><tspan x="422" dy="17">‘ 귀결이다 ’ 를 도출 한 벌로 확정할 수 있다.</tspan><tspan x="422" dy="17">편한 쪽을 골라 쓴다</tspan></text><g ><g class="shape"><path d="M84 661h676v408H84z" class="stroke-B1 fill-B4 s0"/></g><text x="422" y="694" class="text-bold fill-N1 s1">그런데 여기는 여전히 비어 있다</text></g><text x="422" y="1155" class="text-bold fill-N1 s2"><tspan x="422" dy="0">명제논리는 사정이 다르다 —</tspan><tspan x="422" dy="17.25">6장의 진리표가 유한한 판정 절차를 준다.</tspan><tspan x="422" dy="17.25">술어논리에는 그런 절차가 없고,</tspan><tspan x="422" dy="17.25">없다는 것 자체가 정리다. 그것이 16장이다</tspan></text><g ><g class="shape"><path d="M69 58h235v114H69z" class="stroke-B1 fill-B5 s0"/></g><text x="186.5" y="96.5" class="text-bold fill-N1 s2"><tspan x="186.5" dy="0">Γ ⊢ φ</tspan><tspan x="186.5" dy="17.25">도출이 하나 있다.</tspan><tspan x="186.5" dy="17.25">확인 —</tspan><tspan x="186.5" dy="17.25">종이 한 장을 내놓는다</tspan></text></g><g ><g class="shape"><path d="M314 58h235v114H314z" class="stroke-B1 fill-B5 s0"/></g><text x="431.5" y="104.5" class="text-bold fill-N1 s2"><tspan x="431.5" dy="0">13장 건전성 ⊢ ⟹ ⊨</tspan><tspan x="431.5" dy="17.667">14장 완전성 ⊨ ⟹ ⊢</tspan><tspan x="431.5" dy="17.667">두 화살표가 다 놓였다</tspan></text></g><g ><g class="shape"><path d="M559 58h217v114H559z" class="stroke-B1 fill-B5 s0"/></g><text x="667.5" y="96.5" class="text-bold fill-N1 s2"><tspan x="667.5" dy="0">Γ ⊨ φ</tspan><tspan x="667.5" dy="17.25">모든 모형이 그렇다.</tspan><tspan x="667.5" dy="17.25">확인 —</tspan><tspan x="667.5" dy="17.25">모형 전부를 훑는다</tspan></text></g><g ><g class="shape"><path d="M20 298h305v130H20z" class="stroke-B1 fill-B5 s0"/></g><text x="172.5" y="344.5" class="text-bold fill-N1 s2"><tspan x="172.5" dy="0">일관적 ⟺ 만족가능하다</tspan><tspan x="172.5" dy="17.25">7장이 도출로 정의한 성질과</tspan><tspan x="172.5" dy="17.25">6장이 배당으로 정의한 성질이</tspan><tspan x="172.5" dy="17.25">같은 집합을 가려낸다</tspan></text></g><g ><g class="shape"><path d="M333 298h235v130H333z" class="stroke-B1 fill-B5 s0"/></g><text x="450.5" y="352.5" class="text-bold fill-N1 s2"><tspan x="450.5" dy="0">⊢ φ ⟺ ⊨ φ</tspan><tspan x="450.5" dy="17.667">이 체계의 정리 전체가</tspan><tspan x="450.5" dy="17.667">논리적 참 전체와 같다</tspan></text></g><g ><g class="shape"><path d="M576 298h249v130H576z" class="stroke-B1 fill-B5 s0"/></g><text x="700.5" y="336.5" class="text-bold fill-N1 s2"><tspan x="700.5" dy="0">컴팩트성</tspan><tspan x="700.5" dy="17">모든 유한 부분집합이</tspan><tspan x="700.5" dy="17">모형을 가지면</tspan><tspan x="700.5" dy="17">전체도 모형을 갖는다.</tspan><tspan x="700.5" dy="17">15장이 여기서 시작한다</tspan></text></g><g ><g class="shape"><path d="M247 711h305v98H247z" class="stroke-B1 fill-B5 s0"/></g><text x="399.5" y="749.5" class="text-bold fill-N1 s2"><tspan x="399.5" dy="0">판정 절차 — 아무 Γ 와 φ 를 받아</tspan><tspan x="399.5" dy="17.667">언제나 유한한 시간에</tspan><tspan x="399.5" dy="17.667">예 또는 아니오를 내놓는 방법</tspan></text></g><g ><g class="shape"><path d="M134 889h232v130H134z" class="stroke-B1 fill-B5 s0"/></g><text x="250" y="927.5" class="text-bold fill-N1 s2"><tspan x="250" dy="0">얻은 것 — 반결정.</tspan><tspan x="250" dy="17">도출을 전부 늘어놓고</tspan><tspan x="250" dy="17">하나씩 검사하면</tspan><tspan x="250" dy="17">Γ ⊨ φ 인 경우</tspan><tspan x="250" dy="17">언젠가 반드시 찾는다</tspan></text></g><g ><g class="shape"><path d="M386 889h324v130H386z" class="stroke-B1 fill-B5 s0"/></g><text x="548" y="927.5" class="text-bold fill-N1 s2"><tspan x="548" dy="0">못 얻은 것 — Γ ⊭ φ 인 경우</tspan><tspan x="548" dy="17">그 절차는 영원히 멈추지 않는다.</tspan><tspan x="548" dy="17">멈추지 않는 것과</tspan><tspan x="548" dy="17">아직 못 찾은 것을</tspan><tspan x="548" dy="17">구별할 방법이 없다</tspan></text></g><marker id="mk-d2-855978747-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-855978747-3488378134)" d="M348.666 811v28s0 10-10 10H260.5s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-855978747)"/><path fill="none" marker-end="url(#mk-d2-855978747-3488378134)" d="M450.333 811v74" class="connection stroke-B1 s0" mask="url(#d2-855978747)"/><path fill="none" marker-end="url(#mk-d2-855978747-3488378134)" d="M422.5 184v64" class="connection stroke-B1 s0" mask="url(#d2-855978747)"/><path fill="none" marker-end="url(#mk-d2-855978747-3488378134)" d="M422.5 438v64" class="connection stroke-B1 s0" mask="url(#d2-855978747)"/><path fill="none" marker-end="url(#mk-d2-855978747-3488378134)" d="M422.5 593v64" class="connection stroke-B1 s0" mask="url(#d2-855978747)"/><path fill="none" marker-end="url(#mk-d2-855978747-3488378134)" d="M422.5 1071v64" class="connection stroke-B1 s0" mask="url(#d2-855978747)"/><mask id="d2-855978747" width="1023" height="1398" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H934v1398H-89z"/></mask></svg>