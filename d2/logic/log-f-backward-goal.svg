<svg xmlns="http://www.w3.org/2000/svg" width="1895" height="1090" class="d2-649534790 d2-svg" viewBox="-101 -101 1895 1090"><rect width="1895" height="1090" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-649534790 .fill-N1{fill:#0a0f25}.d2-649534790 .fill-B6{fill:#f7f8fe}.d2-649534790 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="161.5" cy="444" class="shape stroke-B1 fill-B6 s0" rx="161.5" ry="54"/></g><text x="161.5" y="441.5" class="text-bold fill-N1 s1"><tspan x="161.5" dy="0">지금 목표의</tspan><tspan x="161.5" dy="18.5">주연결자는 무엇인가</tspan></text></g><g ><g class="shape"><path d="M489 16h83v66h-83z" class="stroke-B1 fill-B6 s0"/></g><text x="530.5" y="54.5" class="text-bold fill-N1 s1">φ → ψ</text></g><g ><g class="shape"><path d="M489 174h83v66h-83z" class="stroke-B1 fill-B6 s0"/></g><text x="530.5" y="212.5" class="text-bold fill-N1 s1">φ ∧ ψ</text></g><g ><g class="shape"><path d="M499 332h64v66h-64z" class="stroke-B1 fill-B6 s0"/></g><text x="531" y="370.5" class="text-bold fill-N1 s1">¬φ</text></g><g ><g class="shape"><path d="M489 490h83v66h-83z" class="stroke-B1 fill-B6 s0"/></g><text x="530.5" y="528.5" class="text-bold fill-N1 s1">φ ↔ ψ</text></g><g ><g class="shape"><path d="M489 648h83v66h-83z" class="stroke-B1 fill-B6 s0"/></g><text x="530.5" y="686.5" class="text-bold fill-N1 s1">φ ∨ ψ</text></g><g ><g class="shape"><path d="M423 806h215v66H423z" class="stroke-B1 fill-B6 s0"/></g><text x="530.5" y="844.5" class="text-bold fill-N1 s1">P — 주연결자가 없다</text></g><g ><g class="shape"><path d="M747 0h340v98H747z" class="stroke-B1 fill-B6 s0"/></g><text x="917" y="38.5" class="text-bold fill-N1 s1"><tspan x="917" dy="0">→I</tspan><tspan x="917" dy="17.667">새 목표: φ 를 가정하고 ψ.</tspan><tspan x="917" dy="17.667">가정이 하나 늘고 목표는 짧아진다</tspan></text></g><g ><g class="shape"><path d="M787 158h261v98H787z" class="stroke-B1 fill-B6 s0"/></g><text x="917.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="917.5" dy="0">∧I</tspan><tspan x="917.5" dy="17.667">새 목표 둘: φ 하나, ψ 하나.</tspan><tspan x="917.5" dy="17.667">따로 얻은 뒤 붙인다</tspan></text></g><g ><g class="shape"><path d="M761 316h313v98H761z" class="stroke-B1 fill-B6 s0"/></g><text x="917.5" y="354.5" class="text-bold fill-N1 s1"><tspan x="917.5" dy="0">¬I</tspan><tspan x="917.5" dy="17.667">새 목표: φ 를 가정하고 ⊥.</tspan><tspan x="917.5" dy="17.667">목표가 ⊥ 이 되는 것이 이득이다</tspan></text></g><g ><g class="shape"><path d="M766 474h302v98H766z" class="stroke-B1 fill-B6 s0"/></g><text x="917" y="512.5" class="text-bold fill-N1 s1"><tspan x="917" dy="0">↔I</tspan><tspan x="917" dy="17.667">새 목표 둘: φ → ψ 하나,</tspan><tspan x="917" dy="17.667">ψ → φ 하나. 각각 →I 로 내려간다</tspan></text></g><g ><g class="shape"><path d="M746 632h343v98H746z" class="stroke-B1 fill-B6 s0"/></g><text x="917.5" y="670.5" class="text-bold fill-N1 s1"><tspan x="917.5" dy="0">∨I — 다만 한쪽을 골라야 한다</tspan><tspan x="917.5" dy="17.667">새 목표: φ 하나 또는 ψ 하나.</tspan><tspan x="917.5" dy="17.667">고를 근거가 없으면 이 길은 막힌다</tspan></text></g><g ><g class="shape"><path d="M738 790h358v98H738z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="917" y="828.5" class="text-bold fill-N1 s1"><tspan x="917" dy="0">도입 규칙이 없다</tspan><tspan x="917" dy="17.667">전제에서 앞으로 밀어 P 를 꺼내거나,</tspan><tspan x="917" dy="17.667">그래도 안 되면 IP</tspan></text></g><text x="1444.5" y="829" class="fill-N1 s1"><tspan x="1444.5" dy="0">다섯 줄에 공통인 것 하나 — 규칙을 고른 순간 목표가 바뀐다.</tspan><tspan x="1444.5" dy="17.667">증명을 찾는 일은 규칙을 고르는 일이 아니라</tspan><tspan x="1444.5" dy="17.667">목표를 더 작은 목표로 갈아 치우는 일이다</tspan></text><marker id="mk-d2-649534790-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M190.944 389.237C336.4 117.399 396.2 49 485 49" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M209.331 390.507C340 244 396.2 207 485 207" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M270.873 403.298C352.2 372.8 398.1 365 494.5 365" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M270.873 484.702C352.2 515.2 396.2 523 485 523" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M209.331 497.493C340 644 396.2 681 485 681" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M190.944 498.763C336.4 770.6 383 839 419 839" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M574 49h169" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M574 207h208.5" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M565.5 365h191" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M574 523h188" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M574 681h167.5" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><path fill="none" marker-end="url(#mk-d2-649534790-3488378134)" d="M640 839h94" class="connection stroke-B1 s0" mask="url(#d2-649534790)"/><mask id="d2-649534790" width="1895" height="1090" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" 