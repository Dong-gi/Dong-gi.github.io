<svg xmlns="http://www.w3.org/2000/svg" width="1378" height="1302" class="d2-420081250 d2-svg" viewBox="-101 -101 1378 1302"><rect width="1378" height="1302" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-420081250 .fill-N1{fill:#0a0f25}.d2-420081250 .fill-B4{fill:#e3e9fd}.d2-420081250 .fill-B5{fill:#edf0fd}.d2-420081250 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M80 0h1016v152H80z" class="stroke-B1 fill-B4 s0"/></g><text x="588" y="33" class="text-bold fill-N1 s1">헨킨의 착상 — 정의역을 언어에서 꺼낸다</text></g><g ><g class="shape"><path d="M0 252h1176v168H0z" class="stroke-B1 fill-B4 s0"/></g><text x="588" y="285" class="text-bold fill-N1 s1">그런데 여기서 막힌다</text></g><g ><g class="shape"><path d="M84 520h1009v274H84z" class="stroke-B1 fill-B4 s0"/></g><text x="588.5" y="553" class="text-bold fill-N1 s1">메우는 방법 — 없는 이름을 만들어 준다</text></g><text x="588.5" y="910" class="text-bold fill-N1 s2"><tspan x="588.5" dy="0">11장이 변수 조건에 붙여 둔 말 — ‘ 그 이름에 대해 우리가 따로 아는 것이 없는가 ’ — 가 여기서 값을 치른다.</tspan><tspan x="588.5" dy="17.667">새 상수는 아무 새 정보를 주지 않는다는 사실이 증인 공리를 공짜로 만든다.</tspan><tspan x="588.5" dy="17.667">조건이 있어서 규칙이 약해진 것이 아니라, 조건이 있어서 이 걸음이 가능해진 것이다</tspan></text><text x="588" y="1063" class="fill-N1 s2"><tspan x="588" dy="0">= 가 있으면 한 걸음 더 — a = b ∈ Γ* 인데 항 모형에서 a 와 b 는 서로 다른 점이다.</tspan><tspan x="588" dy="17.667">Γ* 가 같다고 말하는 상수끼리 묶어 한 점으로 만들고 그 묶음을 D 로 쓴다.</tspan><tspan x="588" dy="17.667">12장이 =I · =E 에서 도출해 둔 대칭성과 추이성이 이 묶기를 떠받친다</tspan></text><g ><g class="shape"><path d="M88 46h454v98H88z" class="stroke-B1 fill-B5 s0"/></g><text x="315" y="84.5" class="text-bold fill-N1 s2"><tspan x="315" dy="0">명제논리에서는 Γ* 가 배당을 그대로 주었다.</tspan><tspan x="315" dy="17.667">술어논리에서는 모형 ℳ = ⟨D, I⟩ 를 지어야 하는데</tspan><tspan x="315" dy="17.667">Γ* 는 문장의 집합일 뿐 D 를 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M550 46h538v98H550z" class="stroke-B1 fill-B5 s0"/></g><text x="819" y="84.5" class="text-bold fill-N1 s2"><tspan x="819" dy="0">그러면 D 를 개체상수들의 집합으로 잡는다.</tspan><tspan x="819" dy="17.667">I(a) = a 자신, I(F) = { a : Fa ∈ Γ* }.</tspan><tspan x="819" dy="17.667">9장이 함수기호를 넣지 않았으므로 닫힌 항은 상수뿐이다</tspan></text></g><g ><g class="shape"><path d="M8 298h390v114H8z" class="stroke-B1 fill-B5 s0"/></g><text x="203" y="336.5" class="text-bold fill-N1 s2"><tspan x="203" dy="0">∃ 조항이 요구하는 것 — ∃x Fx 가 참이려면</tspan><tspan x="203" dy="17.25">D 의 어떤 원소가 F 여야 한다.</tspan><tspan x="203" dy="17.25">D 가 상수들이므로 어떤 상수 a 에 대해</tspan><tspan x="203" dy="17.25">Fa ∈ Γ* 여야 한다</tspan></text></g><g ><g class="shape"><path d="M406 298h325v114H406z" class="stroke-B1 fill-B5 s0"/></g><text x="568.5" y="336.5" class="text-bold fill-N1 s2"><tspan x="568.5" dy="0">그런 보장이 없다.</tspan><tspan x="568.5" dy="17.25">상수가 a 하나뿐인 언어에서</tspan><tspan x="568.5" dy="17.25">Γ = { ∃x Fx, ¬Fa } 는 일관적이다.</tspan><tspan x="568.5" dy="17.25">키워도 ∃x Fx ∈ Γ* 이면서 Fa ∉ Γ* 다</tspan></text></g><g ><g class="shape"><path d="M739 298h429v114H739z" class="stroke-B1 fill-B5 s0"/></g><text x="953.5" y="344.5" class="text-bold fill-N1 s2"><tspan x="953.5" dy="0">항 모형에서 ∃x Fx 가 거짓이 된다.</tspan><tspan x="953.5" dy="17.667">집합은 있다고 말하는데 모형은 없다고 한다.</tspan><tspan x="953.5" dy="17.667">진리 보조정리가 그 자리에서 깨진다</tspan></text></g><g ><g class="shape"><path d="M92 566h472v98H92z" class="stroke-B1 fill-B5 s0"/></g><text x="328" y="604.5" class="text-bold fill-N1 s2"><tspan x="328" dy="0">① 새 개체상수 c₀, c₁, c₂, … 를 가산 개 더한다.</tspan><tspan x="328" dy="17.667">언어가 넓어져도 적형식은 여전히 가산이라</tspan><tspan x="328" dy="17.667">린덴바움이 그대로 통한다</tspan></text></g><g ><g class="shape"><path d="M572 566h513v98H572z" class="stroke-B1 fill-B5 s0"/></g><text x="828.5" y="604.5" class="text-bold fill-N1 s2"><tspan x="828.5" dy="0">② 식 ∃x φ 마다 새 상수 c 를 배정하고</tspan><tspan x="828.5" dy="17.667">증인 공리 ∃x φ → φ[c/x] 를 더한다.</tspan><tspan x="828.5" dy="17.667">이 성질을 가진 집합을 증인 성질을 가졌다고 한다</tspan></text></g><g ><g class="shape"><path d="M92 672h472v114H92z" class="stroke-B1 fill-B5 s0"/></g><text x="328" y="710.5" class="text-bold fill-N1 s2"><tspan x="328" dy="0">③ 더해도 일관성이 깨지지 않음을 보인다.</tspan><tspan x="328" dy="17.25">깨진다면 Γ ⊢ ∃x φ 와 Γ ⊢ ¬φ[c/x] 가 함께 나오는데,</tspan><tspan x="328" dy="17.25">c 가 Γ 어디에도 없으므로 ∀I 의 변수 조건이 통과해</tspan><tspan x="328" dy="17.25">Γ ⊢ ∀x ¬φ 가 되고 ∃x φ 와 부딪힌다</tspan></text></g><g ><g class="shape"><path d="M572 672h513v114H572z" class="stroke-B1 fill-B5 s0"/></g><text x="828.5" y="710.5" class="text-bold fill-N1 s2"><tspan x="828.5" dy="0">④ 새 상수가 새 식을 만드므로 한 번으로 끝나지 않는다.</tspan><tspan x="828.5" dy="17.25">층을 쌓아 무한히 되풀이한 뒤 합집합을 잡고,</tspan><tspan x="828.5" dy="17.25">그다음에 린덴바움으로 극대화한다.</tspan><tspan x="828.5" dy="17.25">순서를 바꾸면 극대성이 깨진다</tspan></text></g><marker id="mk-d2-420081250-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-420081250-3488378134)" d="M588 154v94" class="connection stroke-B1 s0" mask="url(#d2-420081250)"/><path fill="none" marker-end="url(#mk-d2-420081250-3488378134)" d="M588 422v94" class="connection stroke-B1 s0" mask="url(#d2-420081250)"/><path fill="none" marker-end="url(#mk-d2-420081250-3488378134)" d="M588 796v94" class="connection stroke-B1 s0" mask="url(#d2-420081250)"/><path fill="none" marker-end="url(#mk-d2-420081250-3488378134)" d="M588 949v94" class="connection stroke-B1 s0" mask="url(#d2-420081250)"/><mask id="d2-420081250" width="1378" height="1302" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1378v1302H-101z"/></mask></svg>