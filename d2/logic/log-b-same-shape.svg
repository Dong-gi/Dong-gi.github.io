<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="1282" class="d2-2778038902 d2-svg" viewBox="-101 -101 1424 1282"><rect width="1424" height="1282" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2778038902 .fill-N1{fill:#0a0f25}.d2-2778038902 .fill-N2{fill:#676c7e}.d2-2778038902 .fill-B6{fill:#f7f8fe}.d2-2778038902 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M227 0h235v98H227z" class="stroke-B1 fill-B6 s0"/></g><text x="344.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="344.5" dy="0">비가 오면 길이 젖는다</tspan><tspan x="344.5" dy="17.667">비가 온다</tspan><tspan x="344.5" dy="17.667">∴ 길이 젖는다</tspan></text></g><g ><g class="shape"><path d="M522 0h287v98H522z" class="stroke-B1 fill-B6 s0"/></g><text x="665.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="665.5" dy="0">이 수가 4의 배수이면 짝수다</tspan><tspan x="665.5" dy="17.667">이 수는 4의 배수다</tspan><tspan x="665.5" dy="17.667">∴ 이 수는 짝수다</tspan></text></g><g ><g class="shape"><path d="M869 0h252v98H869z" class="stroke-B1 fill-B6 s0"/></g><text x="995" y="38.5" class="text-bold fill-N1 s1"><tspan x="995" dy="0">회원이면 할인을 받는다</tspan><tspan x="995" dy="17.667">나는 회원이다</tspan><tspan x="995" dy="17.667">∴ 나는 할인을 받는다</tspan></text></g><g ><g class="shape"><path d="M624 219h83v98h-83z" class="stroke-B1 fill-B6 s0"/></g><text x="665.5" y="257.5" class="text-bold fill-N1 s1"><tspan x="665.5" dy="0">φ → ψ</tspan><tspan x="665.5" dy="17.667">φ</tspan><tspan x="665.5" dy="17.667">∴ ψ</tspan></text></g><g ><g class="shape"><ellipse cx="349.5" cy="554.5" class="shape stroke-B1 fill-B6 s0" rx="349.5" ry="116.5"/></g><text x="349.5" y="552" class="text-bold fill-N1 s1"><tspan x="349.5" dy="0">이 뼈대는 타당하다</tspan><tspan x="349.5" dy="18.5">전제가 다 참인데 결론이 거짓인 경우를 만들 수 없다</tspan></text></g><g ><g class="shape"><path d="M200 808h299v98H200z" class="stroke-B1 fill-B6 s0"/></g><text x="349.5" y="846.5" class="text-bold fill-N1 s1"><tspan x="349.5" dy="0">달이 치즈이면 달에 쥐가 산다</tspan><tspan x="349.5" dy="17.667">달은 치즈다</tspan><tspan x="349.5" dy="17.667">∴ 달에 쥐가 산다</tspan></text></g><text x="990.5" y="544" class="fill-N1 s1"><tspan x="990.5" dy="0">세상의 문장은 끝이 없지만 뼈대는 셀 수 있을 만큼 적다.</tspan><tspan x="990.5" dy="17.667">뼈대 하나를 한 번 판정하면 그 뼈대의 모든 대입례를</tspan><tspan x="990.5" dy="17.667">한꺼번에 판정한 셈이 된다</tspan></text><text x="350" y="1043" class="fill-N1 s1"><tspan x="350" dy="0">이 논증은 타당하지만 건전하지 않다. 전제가 거짓이기 때문이다.</tspan><tspan x="350" dy="17.667">형태는 ‘전제가 참이면 결론도 참’ 만 보증한다 —</tspan><tspan x="350" dy="17.667">전제가 참인지는 형태가 대답할 수 없다</tspan></text><marker id="mk-d2-2778038902-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2778038902-3488378134)" d="M344.75 99.5c0 46.8 55.8 78 275.213 152.71" class="connection stroke-B1 s0" mask="url(#d2-2778038902)"/><text x="458.5" y="203" class="text-italic fill-N2 s1">낱말을 지운다</text><path fill="none" marker-end="url(#mk-d2-2778038902-3488378134)" d="M665.75 99.5v116" class="connection stroke-B1 s0" mask="url(#d2-2778038902)"/><text x="665.5" y="164" class="text-italic fill-N2 s1">낱말을 지운다</text><path fill="none" marker-end="url(#mk-d2-2778038902-3488378134)" d="M995.25 99.5c0 46.8-57.6 78.141-284.204 153.447" class="connection stroke-B1 s0" mask="url(#d2-2778038902)"/><text x="876.5" y="203" class="text-italic fill-N2 s1">낱말을 지운다</text><path fill="none" marker-end="url(#mk-d2-2778038902-3488378134)" d="M622.61 283.153C404.5 358.5 349.6 389.6 349.967 434" class="connection stroke-B1 s0" mask="url(#d2-2778038902)"/><path fill="none" marker-end="url(#mk-d2-2778038902-3488378134)" d="M349.985 673c-.385 52.8-.485 80.3-.485 131.5" class="connection stroke-B1 s0" mask="url(#d2-2778038902)"/><text x="350" y="737" class="text-italic fill-N2 s1"><tspan x="350" dy="0">자리를 아무렇게나 채워도</tspan><tspan x="350" dy="18.5">타당성은 물려받는다</tspan></text><path fill="none" marker-end="url(#mk-d2-2778038902-3488378134)" d="M709.145 282.632C933.85 358.398 990.5 407.7 990.5 524.5" class="connection stroke-B1 s0" mask="url(#d2-2778038902)"/><text x="913.5" y="357" class="text-italic fill-N2 s1">형태로 옮기는 이득</text><path fill="none" marker-end="url(#mk-d2-2778038902-3488378134)" d="M349.5 907.5v116" class="connection stroke-B1 s0" mask="url(#d2-2778038902)"/><text x="350" y="972" class="text-italic fill-N2 s1">그러나</text><mask id="d2-2778038902" width="1424" height="1282" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1424v1282H-101z"/><path d="M397 187h123v21H397zM604 148h123v21H604zM815 187h123v21H815zM239 721h222v37H239zM831 341h165v21H831zM319 956h62v21h-62z"/></mask></svg>