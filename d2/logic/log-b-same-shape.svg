<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="1190" class="d2-221887369 d2-svg" viewBox="-101 -101 1096 1190"><rect width="1096" height="1190" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-221887369 .text-bold{font-weight:700}.d2-221887369 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-221887369 .fill-N1{fill:#0a0f25}.d2-221887369 .fill-N2{fill:#676c7e}.d2-221887369 .fill-B6{fill:#f7f8fe}.d2-221887369 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h235v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="117.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="117.5" dy="0">비가 오면 길이 젖는다</tspan><tspan x="117.5" dy="17.667">비가 온다</tspan><tspan x="117.5" dy="17.667">∴ 길이 젖는다</tspan></text></g><g ><g class="shape"><path d="M295 0h287v98H295z" class="stroke-B1 fill-B6 s0"/></g><text x="438.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="438.5" dy="0">이 수가 4의 배수이면 짝수다</tspan><tspan x="438.5" dy="17.667">이 수는 4의 배수다</tspan><tspan x="438.5" dy="17.667">∴ 이 수는 짝수다</tspan></text></g><g ><g class="shape"><path d="M642 0h252v98H642z" class="stroke-B1 fill-B6 s0"/></g><text x="768" y="38.5" class="text-bold fill-N1 s1"><tspan x="768" dy="0">회원이면 할인을 받는다</tspan><tspan x="768" dy="17.667">나는 회원이다</tspan><tspan x="768" dy="17.667">∴ 나는 할인을 받는다</tspan></text></g><g ><g class="shape"><path d="M397 219h83v98h-83z" class="stroke-B1 fill-B6 s0"/></g><text x="438.5" y="257.5" class="text-bold fill-N1 s1"><tspan x="438.5" dy="0">φ → ψ</tspan><tspan x="438.5" dy="17.667">φ</tspan><tspan x="438.5" dy="17.667">∴ ψ</tspan></text></g><g ><g class="shape"><ellipse cx="272.5" cy="500.5" class="shape stroke-B1 fill-B6 s0" rx="162.5" ry="62.5"/></g><text x="272.5" y="482" class="text-bold fill-N1 s1"><tspan x="272.5" dy="0">이 뼈대는 타당하다</tspan><tspan x="272.5" dy="17.25">전제가 다 참인데</tspan><tspan x="272.5" dy="17.25">결론이 거짓인 경우를</tspan><tspan x="272.5" dy="17.25">만들 수 없다</tspan></text></g><g ><g class="shape"><path d="M123 700h299v98H123z" class="stroke-B1 fill-B6 s0"/></g><text x="272.5" y="738.5" class="text-bold fill-N1 s1"><tspan x="272.5" dy="0">달이 치즈이면 달에 쥐가 산다</tspan><tspan x="272.5" dy="17.667">달은 치즈다</tspan><tspan x="272.5" dy="17.667">∴ 달에 쥐가 산다</tspan></text></g><text x="612.5" y="474" class="fill-N1 s1"><tspan x="612.5" dy="0">세상의 문장은 끝이 없지만</tspan><tspan x="612.5" dy="17">뼈대는 셀 수 있을 만큼 적다.</tspan><tspan x="612.5" dy="17">뼈대 하나를 한 번 판정하면</tspan><tspan x="612.5" dy="17">그 뼈대의 모든 대입례를</tspan><tspan x="612.5" dy="17">한꺼번에 판정한 셈이 된다</tspan></text><text x="273" y="935" class="fill-N1 s1"><tspan x="273" dy="0">이 논증은 타당하지만 건전하지 않다.</tspan><tspan x="273" dy="17.25">전제가 거짓이기 때문이다.</tspan><tspan x="273" dy="17.25">형태는 ‘전제가 참이면 결론도 참’ 만 보증한다 —</tspan><tspan x="273" dy="17.25">전제가 참인지는 형태가 대답할 수 없다</tspan></text><marker id="mk-d2-221887369-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-221887369-3488378134)" d="M117.5 99.5c0 46.8 56 78 276.212 152.715" class="connection stroke-B1 s0" mask="url(#d2-221887369)"/><text x="232.5" y="203" class="text-italic fill-N2 s1">낱말을 지운다</text><path fill="none" marker-end="url(#mk-d2-221887369-3488378134)" d="M438.5 99.5v116" class="connection stroke-B1 s0" mask="url(#d2-221887369)"/><text x="438.5" y="164" class="text-italic fill-N2 s1">낱말을 지운다</text><path fill="none" marker-end="url(#mk-d2-221887369-3488378134)" d="M768 99.5c0 46.8-57.6 78.2-284.205 153.735" class="connection stroke-B1 s0" mask="url(#d2-221887369)"/><text x="649.5" y="204" class="text-italic fill-N2 s1">낱말을 지운다</text><path fill="none" marker-end="url(#mk-d2-221887369-3488378134)" d="M395.082 296.603C297.55 361.1 272.8 389.6 272.983 434" class="connection stroke-B1 s0" mask="url(#d2-221887369)"/><path fill="none" marker-end="url(#mk-d2-221887369-3488378134)" d="M272.993 565c-.193 52.8-.243 80.3-.243 131.5" class="connection stroke-B1 s0" mask="url(#d2-221887369)"/><text x="273" y="629" class="text-italic fill-N2 s1"><tspan x="273" dy="0">자리를 아무렇게나 채워도</tspan><tspan x="273" dy="18.5">타당성은 물려받는다</tspan></text><path fill="none" marker-end="url(#mk-d2-221887369-3488378134)" d="M481.447 295.559C586.15 360.9 612.75 393.7 612.75 454.5" class="connection stroke-B1 s0" mask="url(#d2-221887369)"/><text x="578.5" y="362" class="text-italic fill-N2 s1">형태로 옮기는 이득</text><path fill="none" marker-end="url(#mk-d2-221887369-3488378134)" d="M272.75 799.5v116" class="connection stroke-B1 s0" mask="url(#d2-221887369)"/><text x="273" y="864" class="text-italic fill-N2 s1">그러나</text><mask id="d2-221887369" width="1096" height="1190" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H995v1190H-101z"/><path d="M171 187h123v21H171zM377 148h123v21H377zM588 188h123v21H588zM162 613h222v37H162zM496 346h165v21H496zM242 848h62v21h-62z"/></mask></svg>