<svg xmlns="http://www.w3.org/2000/svg" width="2738" height="738" class="d2-3679195759 d2-svg" viewBox="-101 -101 2738 738"><rect width="2738" height="738" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3679195759 .fill-N1{fill:#0a0f25}.d2-3679195759 .fill-N2{fill:#676c7e}.d2-3679195759 .fill-B6{fill:#f7f8fe}.d2-3679195759 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="388.5" cy="183" class="shape stroke-B1 fill-B6 s0" rx="89.5" ry="30"/></g><text x="388.5" y="188.5" class="text-bold fill-N1 s1">논증 하나</text></g><g ><g class="shape"><path d="M951 142h380v82H951z" class="stroke-B1 fill-B6 s0"/></g><text x="1141" y="180.5" class="text-bold fill-N1 s1"><tspan x="1141" dy="0">전제를 모두 참으로 만들면서</tspan><tspan x="1141" dy="18.5">결론을 거짓으로 만드는 상황이 있는가</tspan></text></g><g ><g class="shape"><path d="M1641 79h276v66h-276z" class="stroke-B1 fill-B6 s0"/></g><text x="1779" y="117.5" class="text-bold fill-N1 s1">전제가 실제로 모두 참인가</text></g><g ><g class="shape"><path d="M1662 205h235v98h-235z" class="stroke-B1 fill-B6 s0"/></g><text x="1779.5" y="243.5" class="text-bold fill-N1 s1"><tspan x="1779.5" dy="0">부당(invalid)</tspan><tspan x="1779.5" dy="17.667">그 상황 하나가 반례다</tspan><tspan x="1779.5" dy="17.667">건전할 수 없다</tspan></text></g><g ><g class="shape"><path d="M2150 0h386v82h-386z" class="stroke-B1 fill-B6 s0"/></g><text x="2343" y="38.5" class="text-bold fill-N1 s1"><tspan x="2343" dy="0">타당하지만 건전하지 않다</tspan><tspan x="2343" dy="18.5">결론이 참인지는 이 논증으로 알 수 없다</tspan></text></g><g ><g class="shape"><path d="M2227 142h232v82h-232z" class="stroke-B1 fill-B6 s0"/></g><text x="2343" y="180.5" class="text-bold fill-N1 s1"><tspan x="2343" dy="0">건전(sound)</tspan><tspan x="2343" dy="18.5">결론은 실제로 참이다</tspan></text></g><text x="388.5" y="289" class="fill-N1 s1"><tspan x="388.5" dy="0">부당하다는 것은 결론이 거짓이라는 뜻이 아니다.</tspan><tspan x="388.5" dy="17.667">부당한 논증의 결론도 얼마든지 참일 수 있다.</tspan><tspan x="388.5" dy="17.667">부당함이 말하는 것은 ‘전제가 결론을 보증하지 않는다’ 하나뿐이다</tspan></text><text x="388.5" y="402" class="fill-N1 s1"><tspan x="388.5" dy="0">순서를 바꿀 수 없다. 타당하지 않으면 전제가 아무리 참이어도 건전하지 않다.</tspan><tspan x="388.5" dy="18.5">그래서 논증을 검사할 때는 전제가 참인지 따지기 전에 타당한지를 먼저 본다</tspan></text><text x="388" y="499" class="fill-N1 s1"><tspan x="388" dy="0">‘건전(sound)’ 은 이 문서에서 세 번 다른 것에 붙는다.</tspan><tspan x="388" dy="17.667">논증에 붙으면 이 그림의 뜻이고, 추론 규칙 하나에 붙으면 그 규칙이 참을 보존한다는 뜻이고,</tspan><tspan x="388" dy="17.667">증명 체계 전체에 붙으면 그 체계로 증명되는 것이 모두 참이라는 뜻이다(13장)</tspan></text><marker id="mk-d2-3679195759-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3679195759-3488378134)" d="M480 183h467.5" class="connection stroke-B1 s0" mask="url(#d2-3679195759)"/><path fill="none" marker-end="url(#mk-d2-3679195759-3488378134)" d="M1332.959 222.404C1455 247.6 1521.1 254 1657.5 254" class="connection stroke-B1 s0" mask="url(#d2-3679195759)"/><text x="1494.5" y="257" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-3679195759-3488378134)" d="M1332.959 143.596C1455 118.4 1517 112 1637 112" class="connection stroke-B1 s0" mask="url(#d2-3679195759)"/><text x="1484.5" y="121" class="text-italic fill-N2 s1">없다 — 타당(valid)</text><path fill="none" marker-end="url(#mk-d2-3679195759-3488378134)" d="M1899.426 78.462C2006.3 48.599 2056.9 41 2146.5 41" class="connection stroke-B1 s0" mask="url(#d2-3679195759)"/><text x="2022" y="52" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-3679195759-3488378134)" d="M1899.426 145.538C2006.3 175.4 2072.3 183 2223.5 183" class="connection stroke-B1 s0" mask="url(#d2-3679195759)"/><text x="2060" y="187" class="text-italic fill-N2 s1">예</text><mask id="d2-3679195759" width="2738" height="738" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2738v738H-101z"/><path d="M1473 241h43v21h-43zM1415 105h139v21h-139zM1991 36h62v21h-62zM2048 171h24v21h-24z"/></mask></svg>