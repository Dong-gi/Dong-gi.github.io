<svg xmlns="http://www.w3.org/2000/svg" width="1026" height="1125" class="d2-4288917618 d2-svg" viewBox="-107 -101 1026 1125"><rect width="1026" height="1125" x="-107" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4288917618 .fill-N1{fill:#0a0f25}.d2-4288917618 .fill-N2{fill:#676c7e}.d2-4288917618 .fill-B6{fill:#f7f8fe}.d2-4288917618 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="535.5" cy="30" class="shape stroke-B1 fill-B6 s0" rx="89.5" ry="30"/></g><text x="535.5" y="35.5" class="text-bold fill-N1 s1">논증 하나</text></g><g ><g class="shape"><path d="M345 160h380v82H345z" class="stroke-B1 fill-B6 s0"/></g><text x="535" y="198.5" class="text-bold fill-N1 s1"><tspan x="535" dy="0">전제를 모두 참으로 만들면서</tspan><tspan x="535" dy="18.5">결론을 거짓으로 만드는 상황이 있는가</tspan></text></g><g ><g class="shape"><path d="M240 379h276v66H240z" class="stroke-B1 fill-B6 s0"/></g><text x="378" y="417.5" class="text-bold fill-N1 s1">전제가 실제로 모두 참인가</text></g><g ><g class="shape"><path d="M576 363h235v98H576z" class="stroke-B1 fill-B6 s0"/></g><text x="693.5" y="401.5" class="text-bold fill-N1 s1"><tspan x="693.5" dy="0">부당(invalid)</tspan><tspan x="693.5" dy="17.667">그 상황 하나가 반례다</tspan><tspan x="693.5" dy="17.667">건전할 수 없다</tspan></text></g><g ><g class="shape"><path d="M0 582h386v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="193" y="620.5" class="text-bold fill-N1 s1"><tspan x="193" dy="0">타당하지만 건전하지 않다</tspan><tspan x="193" dy="18.5">결론이 참인지는 이 논증으로 알 수 없다</tspan></text></g><g ><g class="shape"><path d="M446 582h232v82H446z" class="stroke-B1 fill-B6 s0"/></g><text x="562" y="620.5" class="text-bold fill-N1 s1"><tspan x="562" dy="0">건전(sound)</tspan><tspan x="562" dy="18.5">결론은 실제로 참이다</tspan></text></g><path fill="transparent" stroke="transparent" d="M-6 684h824v239H-6z" class="shape s0"/><text x="303.5" y="724" class="fill-N1 s1"><tspan x="303.5" dy="0">부당하다는 것은 결론이 거짓이라는 뜻이 아니다.</tspan><tspan x="303.5" dy="17.667">부당한 논증의 결론도 얼마든지 참일 수 있다.</tspan><tspan x="303.5" dy="17.667">부당함이 말하는 것은 ‘전제가 결론을 보증하지 않는다’ 하나뿐이다</tspan></text><text x="340.5" y="801" class="fill-N1 s1"><tspan x="340.5" dy="0">순서를 바꿀 수 없다. 타당하지 않으면 전제가 아무리 참이어도 건전하지 않다.</tspan><tspan x="340.5" dy="18.5">그래서 논증을 검사할 때는 전제가 참인지 따지기 전에 타당한지를 먼저 본다</tspan></text><text x="405" y="862" class="fill-N1 s1"><tspan x="405" dy="0">‘건전(sound)’ 은 이 문서에서 세 번 다른 것에 붙는다.</tspan><tspan x="405" dy="17.667">논증에 붙으면 이 그림의 뜻이고, 추론 규칙 하나에 붙으면 그 규칙이 참을 보존한다는 뜻이고,</tspan><tspan x="405" dy="17.667">증명 체계 전체에 붙으면 그 체계로 증명되는 것이 모두 참이라는 뜻이다(13장)</tspan></text><marker id="mk-d2-4288917618-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4288917618-3488378134)" d="M535.01 62c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-4288917618)"/><path fill="none" marker-end="url(#mk-d2-4288917618-3488378134)" d="M600.678 242.589C674.2 290.3 693 314.7 693 359.5" class="connection stroke-B1 s0" mask="url(#d2-4288917618)"/><text x="669.5" y="293" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-4288917618-3488378134)" d="M469.822 242.589C396.3 290.3 377.5 317.9 377.5 375.5" class="connection stroke-B1 s0" mask="url(#d2-4288917618)"/><text x="394.5" y="298" class="text-italic fill-N2 s1">없다 — 타당(valid)</text><path fill="none" marker-end="url(#mk-d2-4288917618-3488378134)" d="M320.283 445.525C218.8 506.1 193 533.7 193 578.5" class="connection stroke-B1 s0" mask="url(#d2-4288917618)"/><text x="233" y="503" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-4288917618-3488378134)" d="M434.717 445.525C536.2 506.1 562 533.7 562 578.5" class="connection stroke-B1 s0" mask="url(#d2-4288917618)"/><text x="522" y="503" class="text-italic fill-N2 s1">예</text><mask id="d2-4288917618" width="1026" height="1125" x="-107" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-107-101H919v1125H-107z"/><path d="M648 277h43v21h-43zM325 282h139v21H325zM202 487h62v21h-62zM510 487h24v21h-24z"/></mask></svg>