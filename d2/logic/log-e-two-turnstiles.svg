<svg xmlns="http://www.w3.org/2000/svg" width="3031" height="1130" class="d2-2930951581 d2-svg" viewBox="-91 -121 3031 1130"><rect width="3031" height="1130" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2930951581 .fill-N1{fill:#0a0f25}.d2-2930951581 .fill-B4{fill:#e3e9fd}.d2-2930951581 .fill-B5{fill:#edf0fd}.d2-2930951581 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M410 20h917v142H410z" class="stroke-B1 fill-B4 s0"/></g><text x="868.5" y="7" class="fill-N1 s1">5장 — 문법. 두 층이 함께 딛고 선 바닥</text></g><g ><g class="shape"><path d="M10 302h855v340H10z" class="stroke-B1 fill-B4 s0"/></g><text x="437.5" y="289" class="text-bold fill-N1 s1">7장 — 증명 체계</text></g><g ><g class="shape"><path d="M905 302h803v340H905z" class="stroke-B1 fill-B4 s0"/></g><text x="1306.5" y="289" class="text-bold fill-N1 s1">6장 — 의미론</text></g><g ><g class="shape"><path d="M342 782h1186v126H342z" class="stroke-B1 fill-B4 s0"/></g><text x="935" y="769" class="text-bold fill-N1 s1">여기에 화살표가 없다</text></g><text x="1765" y="81" class="text-bold fill-N1 s2"><tspan x="1765" dy="0">그러므로 7장 안에서는 두 기호를 섞어 쓸 수 없다.</tspan><tspan x="1765" dy="17.667">‘⊢ 이니까 ⊨ 다’ 라고 적는 순간 아직 증명하지 않은 정리를 쓴 것이 된다.</tspan><tspan x="1765" dy="17.667">도출에서 진리표를 꺼내지 않고, 진리표에서 규칙 이름을 꺼내지 않는다</tspan></text><text x="2486" y="81" class="fill-N1 s2"><tspan x="2486" dy="0">두 기호가 같은 것을 가리킨다는 것이 밝혀져도 두 기호를 하나로 합치지는 않는다.</tspan><tspan x="2486" dy="17.667">일치는 정리이지 정의가 아니고, 술어논리(9~11장)에서 같은 물음을 다시 물어야 하며,</tspan><tspan x="2486" dy="17.667">19장의 체계처럼 둘이 갈라지는 경우도 있기 때문이다</tspan></text><g ><g class="shape"><path d="M682 50h360v82H682z" class="stroke-B1 fill-B5 s0"/></g><text x="862" y="88.5" class="text-bold fill-N1 s2"><tspan x="862" dy="0">적형식이 무엇인지만 정한다.</tspan><tspan x="862" dy="18.5">여기까지는 참도 거짓도 도출도 없다</tspan></text></g><g ><g class="shape"><path d="M294 332h293v98H294z" class="stroke-B1 fill-B5 s0"/></g><text x="440.5" y="370.5" class="text-bold fill-N1 s2"><tspan x="440.5" dy="0">Γ ⊢ φ 의 정의</tspan><tspan x="440.5" dy="17.667">열린 가정이 전부 Γ 안에 있고</tspan><tspan x="440.5" dy="17.667">마지막 줄이 φ 인 도출이 있다</tspan></text></g><g ><g class="shape"><path d="M40 538h373v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="226.5" y="576.5" class="text-bold fill-N1 s2">쓰는 것 — 규칙 열세 개, 줄, 가정의 범위</text></g><g ><g class="shape"><path d="M473 530h362v82H473z" class="stroke-B1 fill-B5 s0"/></g><text x="654" y="568.5" class="text-bold fill-N1 s2"><tspan x="654" dy="0">확인하는 법 — 도출 한 벌을 내놓는다.</tspan><tspan x="654" dy="18.5">하나 내놓으면 끝난다</tspan></text></g><g ><g class="shape"><path d="M1141 332h313v98h-313z" class="stroke-B1 fill-B5 s0"/></g><text x="1297.5" y="370.5" class="text-bold fill-N1 s2"><tspan x="1297.5" dy="0">Γ ⊨ φ 의 정의</tspan><tspan x="1297.5" dy="17.667">Γ 를 모두 참으로 만드는 배당이</tspan><tspan x="1297.5" dy="17.667">전부 φ 도 참으로 만든다</tspan></text></g><g ><g class="shape"><path d="M935 538h323v66H935z" class="stroke-B1 fill-B5 s0"/></g><text x="1096.5" y="576.5" class="text-bold fill-N1 s2">쓰는 것 — 배당, 진리함수, 진리표</text></g><g ><g class="shape"><path d="M1318 530h360v82h-360z" class="stroke-B1 fill-B5 s0"/></g><text x="1498" y="568.5" class="text-bold fill-N1 s2"><tspan x="1498" dy="0">확인하는 법 — 배당 전부를 훑는다.</tspan><tspan x="1498" dy="18.5">아님을 보이려면 반례 하나면 끝난다</tspan></text></g><g ><g class="shape"><path d="M372 812h336v66H372z" class="stroke-B1 fill-B5 s0"/></g><text x="540" y="850.5" class="text-bold fill-N1 s2">Γ ⊢ φ 이면 Γ ⊨ φ 인가 — 건전성. 13장</text></g><g ><g class="shape"><path d="M908 812h336v66H908z" class="stroke-B1 fill-B5 s0"/></g><text x="1076" y="850.5" class="text-bold fill-N1 s2">Γ ⊨ φ 이면 Γ ⊢ φ 인가 — 완전성. 14장</text></g><marker id="mk-d2-2930951581-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2930951581-3488378134)" d="M332.685 430.84C248.1 470 226.5 491.6 226.5 534" class="connection stroke-B1 s0" mask="url(#d2-2930951581)"/><path fill="none" marker-end="url(#mk-d2-2930951581-3488378134)" d="M547.815 430.84C632.4 470 654 490 654 526" class="connection stroke-B1 s0" mask="url(#d2-2930951581)"/><path fill="none" marker-end="url(#mk-d2-2930951581-3488378134)" d="M1195.708 430.887C1116.7 470 1096.5 491.6 1096.5 534" class="connection stroke-B1 s0" mask="url(#d2-2930951581)"/><path fill="none" marker-end="url(#mk-d2-2930951581-3488378134)" d="M1398.792 430.887C1477.8 470 1498 490 1498 526" class="connection stroke-B1 s0" mask="url(#d2-2930951581)"/><path fill="none" marker-end="url(#mk-d2-2930951581-3488378134)" d="M440.25 164v93" class="connection stroke-B1 s0" mask="url(#d2-2930951581)"/><path fill="none" marker-end="url(#mk-d2-2930951581-3488378134)" d="M1297.25 164v93" class="connection stroke-B1 s0" mask="url(#d2-2930951581)"/><path fill="none" marker-end="url(#mk-d2-2930951581-3488378134)" d="M654 644v134" class="connection stroke-B1 s0" mask="url(#d2-2930951581)"/><path fill="none" marker-end="url(#mk-d2-2930951581-3488378134)" d="M1498 644v134" class="connection stroke-B1 s0" mask="url(#d2-2930951581)"/><mask id="d2-2930951581" width="3031" height="1130" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h3031v1130H-91z"/></mask></svg>