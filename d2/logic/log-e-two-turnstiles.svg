<svg xmlns="http://www.w3.org/2000/svg" width="1211" height="1364" class="d2-2125688143 d2-svg" viewBox="-89 -89 1211 1364"><rect width="1211" height="1364" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2125688143 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2125688143 .fill-N1{fill:#0a0f25}.d2-2125688143 .fill-B4{fill:#e3e9fd}.d2-2125688143 .fill-B5{fill:#edf0fd}.d2-2125688143 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M208 12h594v182H208z" class="stroke-B1 fill-B4 s0"/></g><text x="505" y="45" class="fill-N1 s1">5장 — 문법. 두 층이 함께 딛고 선 바닥</text></g><g ><g class="shape"><path d="M12 274h473v408H12z" class="stroke-B1 fill-B4 s0"/></g><text x="248.5" y="307" class="text-bold fill-N1 s1">7장 — 증명 체계</text></g><g ><g class="shape"><path d="M505 282h516v392H505z" class="stroke-B1 fill-B4 s0"/></g><text x="763" y="315" class="text-bold fill-N1 s1">6장 — 의미론</text></g><g ><g class="shape"><path d="M218 762h574v182H218z" class="stroke-B1 fill-B4 s0"/></g><text x="505" y="795" class="text-bold fill-N1 s1">여기에 화살표가 없다</text></g><path fill="transparent" stroke="transparent" d="M149 964h734v210H149z" class="shape s0"/><g ><g class="shape"><path d="M325 62h360v82H325z" class="stroke-B1 fill-B5 s0"/></g><text x="505" y="100.5" class="text-bold fill-N1 s2"><tspan x="505" dy="0">적형식이 무엇인지만 정한다.</tspan><tspan x="505" dy="18.5">여기까지는 참도 거짓도 도출도 없다</tspan></text></g><g ><g class="shape"><path d="M106 324h293v98H106z" class="stroke-B1 fill-B5 s0"/></g><text x="252.5" y="362.5" class="text-bold fill-N1 s2"><tspan x="252.5" dy="0">Γ ⊢ φ 의 정의</tspan><tspan x="252.5" dy="17.667">열린 가정이 전부 Γ 안에 있고</tspan><tspan x="252.5" dy="17.667">마지막 줄이 φ 인 도출이 있다</tspan></text></g><g ><g class="shape"><path d="M62 502h185v98H62z" class="stroke-B1 fill-B5 s0"/></g><text x="154.5" y="540.5" class="text-bold fill-N1 s2"><tspan x="154.5" dy="0">쓰는 것 —</tspan><tspan x="154.5" dy="17.667">규칙 열세 개, 줄,</tspan><tspan x="154.5" dy="17.667">가정의 범위</tspan></text></g><g ><g class="shape"><path d="M267 502h168v130H267z" class="stroke-B1 fill-B5 s0"/></g><text x="351" y="540.5" class="text-bold fill-N1 s2"><tspan x="351" dy="0">확인하는 법 —</tspan><tspan x="351" dy="17">도출 한 벌을</tspan><tspan x="351" dy="17">내놓는다.</tspan><tspan x="351" dy="17">하나 내놓으면</tspan><tspan x="351" dy="17">끝난다</tspan></text></g><g ><g class="shape"><path d="M597 332h313v98H597z" class="stroke-B1 fill-B5 s0"/></g><text x="753.5" y="370.5" class="text-bold fill-N1 s2"><tspan x="753.5" dy="0">Γ ⊨ φ 의 정의</tspan><tspan x="753.5" dy="17.667">Γ 를 모두 참으로 만드는 배당이</tspan><tspan x="753.5" dy="17.667">전부 φ 도 참으로 만든다</tspan></text></g><g ><g class="shape"><path d="M555 510h179v98H555z" class="stroke-B1 fill-B5 s0"/></g><text x="644.5" y="548.5" class="text-bold fill-N1 s2"><tspan x="644.5" dy="0">쓰는 것 —</tspan><tspan x="644.5" dy="17.667">배당, 진리함수,</tspan><tspan x="644.5" dy="17.667">진리표</tspan></text></g><g ><g class="shape"><path d="M754 510h217v114H754z" class="stroke-B1 fill-B5 s0"/></g><text x="862.5" y="548.5" class="text-bold fill-N1 s2"><tspan x="862.5" dy="0">확인하는 법 —</tspan><tspan x="862.5" dy="17.25">배당 전부를 훑는다.</tspan><tspan x="862.5" dy="17.25">아님을 보이려면</tspan><tspan x="862.5" dy="17.25">반례 하나면 끝난다</tspan></text></g><g ><g class="shape"><path d="M268 812h227v82H268z" class="stroke-B1 fill-B5 s0"/></g><text x="381.5" y="850.5" class="text-bold fill-N1 s2"><tspan x="381.5" dy="0">Γ ⊢ φ 이면 Γ ⊨ φ 인가 —</tspan><tspan x="381.5" dy="18.5">건전성. 13장</tspan></text></g><g ><g class="shape"><path d="M515 812h227v82H515z" class="stroke-B1 fill-B5 s0"/></g><text x="628.5" y="850.5" class="text-bold fill-N1 s2"><tspan x="628.5" dy="0">Γ ⊨ φ 이면 Γ ⊢ φ 인가 —</tspan><tspan x="628.5" dy="18.5">완전성. 14장</tspan></text></g><text x="481" y="1004" class="text-bold fill-N1 s2"><tspan x="481" dy="0">그러므로 7장 안에서는 두 기호를 섞어 쓸 수 없다.</tspan><tspan x="481" dy="17.25">‘⊢ 이니까 ⊨ 다’ 라고 적는 순간</tspan><tspan x="481" dy="17.25">아직 증명하지 않은 정리를 쓴 것이 된다.</tspan><tspan x="481" dy="17.25">도출에서 진리표를 꺼내지 않고, 진리표에서 규칙 이름을 꺼내지 않는다</tspan></text><text x="516" y="1097" class="fill-N1 s2"><tspan x="516" dy="0">두 기호가 같은 것을 가리킨다는 것이 밝혀져도 두 기호를 하나로 합치지는 않는다.</tspan><tspan x="516" dy="17.25">일치는 정리이지 정의가 아니고,</tspan><tspan x="516" dy="17.25">술어논리(9~11장)에서 같은 물음을 다시 물어야 하며,</tspan><tspan x="516" dy="17.25">19장의 체계처럼 둘이 갈라지는 경우도 있기 때문이다</tspan></text><marker id="mk-d2-2125688143-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2125688143-3488378134)" d="M154.5 424v74" class="connection stroke-B1 s0" mask="url(#d2-2125688143)"/><path fill="none" marker-end="url(#mk-d2-2125688143-3488378134)" d="M351 424v74" class="connection stroke-B1 s0" mask="url(#d2-2125688143)"/><path fill="none" marker-end="url(#mk-d2-2125688143-3488378134)" d="M644.5 432v74" class="connection stroke-B1 s0" mask="url(#d2-2125688143)"/><path fill="none" marker-end="url(#mk-d2-2125688143-3488378134)" d="M862.5 432v74" class="connection stroke-B1 s0" mask="url(#d2-2125688143)"/><path fill="none" marker-end="url(#mk-d2-2125688143-3488378134)" d="M248.5 196v74" class="connection stroke-B1 s0" mask="url(#d2-2125688143)"/><path fill="none" marker-end="url(#mk-d2-2125688143-3488378134)" d="M763 196v82" class="connection stroke-B1 s0" mask="url(#d2-2125688143)"/><path fill="none" marker-end="url(#mk-d2-2125688143-3488378134)" d="M410.083 684v74" class="connection stroke-B1 s0" mask="url(#d2-2125688143)"/><path fill="none" marker-end="url(#mk-d2-2125688143-3488378134)" d="M601.416 676v82" class="connection stroke-B1 s0" mask="url(#d2-2125688143)"/><mask id="d2-2125688143" width="1211" height="1364" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1211v1364H-89z"/></mask></svg>