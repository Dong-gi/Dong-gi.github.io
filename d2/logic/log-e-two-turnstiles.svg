<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="1408" class="d2-1462313459 d2-svg" viewBox="-91 -121 1504 1408"><rect width="1504" height="1408" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.d2-1462313459 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1462313459 .fill-N1{fill:#0a0f25}.d2-1462313459 .fill-B4{fill:#e3e9fd}.d2-1462313459 .fill-B5{fill:#edf0fd}.d2-1462313459 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M319 20h739v142H319z" class="stroke-B1 fill-B4 s0"/></g><text x="688.5" y="7" class="fill-N1 s1">5장 — 문법. 두 층이 함께 딛고 선 바닥</text></g><g ><g class="shape"><path d="M10 302h652v364H10z" class="stroke-B1 fill-B4 s0"/></g><text x="336" y="289" class="text-bold fill-N1 s1">7장 — 증명 체계</text></g><g ><g class="shape"><path d="M733 302h579v372H733z" class="stroke-B1 fill-B4 s0"/></g><text x="1022.5" y="289" class="text-bold fill-N1 s1">6장 — 의미론</text></g><g ><g class="shape"><path d="M282 814h921v142H282z" class="stroke-B1 fill-B4 s0"/></g><text x="742.5" y="801" class="text-bold fill-N1 s1">여기에 화살표가 없다</text></g><path fill="transparent" stroke="transparent" d="M294 976h734v210H294z" class="shape s0"/><g ><g class="shape"><path d="M498 50h360v82H498z" class="stroke-B1 fill-B5 s0"/></g><text x="678" y="88.5" class="text-bold fill-N1 s2"><tspan x="678" dy="0">적형식이 무엇인지만 정한다.</tspan><tspan x="678" dy="18.5">여기까지는 참도 거짓도 도출도 없다</tspan></text></g><g ><g class="shape"><path d="M203 332h293v98H203z" class="stroke-B1 fill-B5 s0"/></g><text x="349.5" y="370.5" class="text-bold fill-N1 s2"><tspan x="349.5" dy="0">Γ ⊢ φ 의 정의</tspan><tspan x="349.5" dy="17.667">열린 가정이 전부 Γ 안에 있고</tspan><tspan x="349.5" dy="17.667">마지막 줄이 φ 인 도출이 있다</tspan></text></g><g ><g class="shape"><path d="M40 546h292v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="186" y="584.5" class="text-bold fill-N1 s2"><tspan x="186" dy="0">쓰는 것 —</tspan><tspan x="186" dy="18.5">규칙 열세 개, 줄, 가정의 범위</tspan></text></g><g ><g class="shape"><path d="M392 538h240v98H392z" class="stroke-B1 fill-B5 s0"/></g><text x="512" y="576.5" class="text-bold fill-N1 s2"><tspan x="512" dy="0">확인하는 법 —</tspan><tspan x="512" dy="17.667">도출 한 벌을 내놓는다.</tspan><tspan x="512" dy="17.667">하나 내놓으면 끝난다</tspan></text></g><g ><g class="shape"><path d="M873 332h313v98H873z" class="stroke-B1 fill-B5 s0"/></g><text x="1029.5" y="370.5" class="text-bold fill-N1 s2"><tspan x="1029.5" dy="0">Γ ⊨ φ 의 정의</tspan><tspan x="1029.5" dy="17.667">Γ 를 모두 참으로 만드는 배당이</tspan><tspan x="1029.5" dy="17.667">전부 φ 도 참으로 만든다</tspan></text></g><g ><g class="shape"><path d="M763 546h242v82H763z" class="stroke-B1 fill-B5 s0"/></g><text x="884" y="584.5" class="text-bold fill-N1 s2"><tspan x="884" dy="0">쓰는 것 —</tspan><tspan x="884" dy="18.5">배당, 진리함수, 진리표</tspan></text></g><g ><g class="shape"><path d="M1065 530h217v114h-217z" class="stroke-B1 fill-B5 s0"/></g><text x="1173.5" y="568.5" class="text-bold fill-N1 s2"><tspan x="1173.5" dy="0">확인하는 법 —</tspan><tspan x="1173.5" dy="17.25">배당 전부를 훑는다.</tspan><tspan x="1173.5" dy="17.25">아님을 보이려면</tspan><tspan x="1173.5" dy="17.25">반례 하나면 끝난다</tspan></text></g><g ><g class="shape"><path d="M312 844h227v82H312z" class="stroke-B1 fill-B5 s0"/></g><text x="425.5" y="882.5" class="text-bold fill-N1 s2"><tspan x="425.5" dy="0">Γ ⊢ φ 이면 Γ ⊨ φ 인가 —</tspan><tspan x="425.5" dy="18.5">건전성. 13장</tspan></text></g><g ><g class="shape"><path d="M727 844h227v82H727z" class="stroke-B1 fill-B5 s0"/></g><text x="840.5" y="882.5" class="text-bold fill-N1 s2"><tspan x="840.5" dy="0">Γ ⊨ φ 이면 Γ ⊢ φ 인가 —</tspan><tspan x="840.5" dy="18.5">완전성. 14장</tspan></text></g><text x="626" y="1016" class="text-bold fill-N1 s2"><tspan x="626" dy="0">그러므로 7장 안에서는 두 기호를 섞어 쓸 수 없다.</tspan><tspan x="626" dy="17.25">‘⊢ 이니까 ⊨ 다’ 라고 적는 순간</tspan><tspan x="626" dy="17.25">아직 증명하지 않은 정리를 쓴 것이 된다.</tspan><tspan x="626" dy="17.25">도출에서 진리표를 꺼내지 않고, 진리표에서 규칙 이름을 꺼내지 않는다</tspan></text><text x="661" y="1109" class="fill-N1 s2"><tspan x="661" dy="0">두 기호가 같은 것을 가리킨다는 것이 밝혀져도 두 기호를 하나로 합치지는 않는다.</tspan><tspan x="661" dy="17.25">일치는 정리이지 정의가 아니고,</tspan><tspan x="661" dy="17.25">술어논리(9~11장)에서 같은 물음을 다시 물어야 하며,</tspan><tspan x="661" dy="17.25">19장의 체계처럼 둘이 갈라지는 경우도 있기 때문이다</tspan></text><marker id="mk-d2-1462313459-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1462313459-3488378134)" d="M266.542 431.041C202.65 470 186.25 493.2 186.25 542" class="connection stroke-B1 s0" mask="url(#d2-1462313459)"/><path fill="none" marker-end="url(#mk-d2-1462313459-3488378134)" d="M431.958 431.041C495.85 470 512.25 491.6 512.25 534" class="connection stroke-B1 s0" mask="url(#d2-1462313459)"/><path fill="none" marker-end="url(#mk-d2-1462313459-3488378134)" d="M955.6 431.13C898.85 470 884.25 493.2 884.25 542" class="connection stroke-B1 s0" mask="url(#d2-1462313459)"/><path fill="none" marker-end="url(#mk-d2-1462313459-3488378134)" d="M1102.4 431.13c56.75 38.87 71.35 58.87 71.35 94.87" class="connection stroke-B1 s0" mask="url(#d2-1462313459)"/><path fill="none" marker-end="url(#mk-d2-1462313459-3488378134)" d="M349.25 164v93" class="connection stroke-B1 s0" mask="url(#d2-1462313459)"/><path fill="none" marker-end="url(#mk-d2-1462313459-3488378134)" d="M1029 164v93" class="connection stroke-B1 s0" mask="url(#d2-1462313459)"/><path fill="none" marker-end="url(#mk-d2-1462313459-3488378134)" d="M512.25 668v142" class="connection stroke-B1 s0" mask="url(#d2-1462313459)"/><path fill="none" marker-end="url(#mk-d2-1462313459-3488378134)" d="M1173.75 676v134" class="connection stroke-B1 s0" mask="url(#d2-1462313459)"/><mask id="d2-1462313459" width="1504" height="1408" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1504v1408H-91z"/></mask></svg>