<svg xmlns="http://www.w3.org/2000/svg" width="1469" height="1702" class="d2-605298114 d2-svg" viewBox="-101 -101 1469 1702"><rect width="1469" height="1702" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-605298114 .fill-N1{fill:#0a0f25}.d2-605298114 .fill-B4{fill:#e3e9fd}.d2-605298114 .fill-B5{fill:#edf0fd}.d2-605298114 .stroke-B1,.d2-605298114 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h420v524H0z" class="stroke-B1 fill-B4 s0"/></g><text x="210" y="33" class="fill-N1 s1">정신역동</text></g><g ><g class="shape"><path d="M460 0h382v524H460z" class="stroke-B1 fill-B4 s0"/></g><text x="651" y="33" class="fill-N1 s1">인간중심</text></g><g ><g class="shape"><path d="M882 0h385v524H882z" class="stroke-B1 fill-B4 s0"/></g><text x="1074.5" y="33" class="fill-N1 s1">행동</text></g><text x="166" y="650" class="fill-N1 s2"><tspan x="166" dy="0"> </tspan><tspan x="166" dy="16.385">현장에서 가장 흔한 형태는</tspan><tspan x="166" dy="16.385">어느 하나가 아니라</tspan><tspan x="166" dy="16.385">여러 계열을 섞어 쓰는 것이다.</tspan><tspan x="166" dy="16.385">조사에서 자기 방식을</tspan><tspan x="166" dy="16.385">‘통합’ 또는 ‘절충’ 이라 답하는 비율이</tspan><tspan x="166" dy="16.385">큰 편이라고 보고된다.</tspan><tspan x="166" dy="16.385"> </tspan><tspan x="166" dy="16.385">그리고 이 그림에서 읽어야 할 것 하나 —</tspan><tspan x="166" dy="16.385">계열마다 ‘무엇이 바뀌어야 하는가’ 가</tspan><tspan x="166" dy="16.385">다르므로, 계열을 견주는 연구는</tspan><tspan x="166" dy="16.385">‘무엇을 재서 나아졌다고 할지’ 부터</tspan><tspan x="166" dy="16.385">정해야 한다</tspan></text><g ><g class="shape"><ellipse cx="651" cy="827" class="shape stroke-B1" rx="191" ry="193" style="fill:#f7f8fe;stroke-width:2"/></g><text x="651" y="824.5" class="text-bold fill-N1 s2"><tspan x="651" dy="0">무엇이 바뀌면</tspan><tspan x="651" dy="18.5">사람이 달라지는가</tspan></text></g><g ><g class="shape"><path d="M882 634h385v386H882z" class="stroke-B1 fill-B4 s0"/></g><text x="1074.5" y="667" class="fill-N1 s1">인지행동</text></g><g ><g class="shape"><path d="M0 1130h420v370H0z" class="stroke-B1 fill-B4 s0"/></g><text x="210" y="1163" class="fill-N1 s1">수용전념 계열</text></g><g ><g class="shape"><path d="M40 46h340v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="210" y="84.5" class="text-bold fill-N1 s2"><tspan x="210" dy="0">출발 — 20세기 초.</tspan><tspan x="210" dy="17.667">이후 크게 갈라졌고</tspan><tspan x="210" dy="17.667">지금의 형태는 초기와 많이 다르다</tspan></text></g><g ><g class="shape"><path d="M40 184h340v130H40z" class="stroke-B1 fill-B5 s0"/></g><text x="210" y="222.5" class="text-bold fill-N1 s2"><tspan x="210" dy="0">변화의 원천 —</tspan><tspan x="210" dy="17">알아차리지 못하던 것을</tspan><tspan x="210" dy="17">알아차리게 되는 것,</tspan><tspan x="210" dy="17">그리고 관계에서 되풀이되는</tspan><tspan x="210" dy="17">방식을 보게 되는 것</tspan></text></g><g ><g class="shape"><path d="M40 354h340v130H40z" class="stroke-B1 fill-B5 s0"/></g><text x="210" y="392.5" class="text-bold fill-N1 s2"><tspan x="210" dy="0">비판 — 초기의 여러 주장이</tspan><tspan x="210" dy="17">검사 가능한 형태가 아니었다.</tspan><tspan x="210" dy="17">무엇이 관찰되면 그 주장이</tspan><tspan x="210" dy="17">틀린 것이 되는지가</tspan><tspan x="210" dy="17">정해져 있지 않았다</tspan></text></g><g ><g class="shape"><path d="M500 46h302v114H500z" class="stroke-B1 fill-B5 s0"/></g><text x="651" y="84.5" class="text-bold fill-N1 s2"><tspan x="651" dy="0">변화의 원천 — 치료자의 태도.</tspan><tspan x="651" dy="17.25">조건 없이 존중하는 것,</tspan><tspan x="651" dy="17.25">상대의 자리에서 이해하는 것,</tspan><tspan x="651" dy="17.25">겉과 속이 일치하는 것</tspan></text></g><g ><g class="shape"><path d="M500 200h302v130H500z" class="stroke-B1 fill-B5 s0"/></g><text x="651" y="238.5" class="text-bold fill-N1 s2"><tspan x="651" dy="0">이 계열이 남긴 것 —</tspan><tspan x="651" dy="17">관계 자체를</tspan><tspan x="651" dy="17">변화의 원천으로 본 것.</tspan><tspan x="651" dy="17">다음 절의 공통요인 논의가</tspan><tspan x="651" dy="17">여기서 자란다</tspan></text></g><g ><g class="shape"><path d="M922 46h282v98H922z" class="stroke-B1 fill-B5 s0"/></g><text x="1063" y="84.5" class="text-bold fill-N1 s2"><tspan x="1063" dy="0">변화의 원천 — 학습.</tspan><tspan x="1063" dy="17.667">7장의 조건형성을</tspan><tspan x="1063" dy="17.667">임상에 적용한 계열이다</tspan></text></g><g ><g class="shape"><path d="M922 184h282v146H922z" class="stroke-B1 fill-B5 s0"/></g><text x="1063" y="222.5" class="text-bold fill-N1 s2"><tspan x="1063" dy="0">이 계열이 가져온 것 —</tspan><tspan x="1063" dy="16.833">무엇을 재서</tspan><tspan x="1063" dy="16.833">나아졌다고 할지</tspan><tspan x="1063" dy="16.833">미리 정하는 관행.</tspan><tspan x="1063" dy="16.833">효과를 셀 수 있게 만든 것이</tspan><tspan x="1063" dy="16.833">이 계열의 몫이 크다</tspan></text></g><g ><g class="shape"><path d="M922 680h305v146H922z" class="stroke-B1 fill-B5 s0"/></g><text x="1074.5" y="718.5" class="text-bold fill-N1 s2"><tspan x="1074.5" dy="0">변화의 원천 —</tspan><tspan x="1074.5" dy="16.833">생각과 행동과</tspan><tspan x="1074.5" dy="16.833">정서가 서로 물려 있고,</tspan><tspan x="1074.5" dy="16.833">그 고리의 어느 지점에</tspan><tspan x="1074.5" dy="16.833">손을 대면 나머지가</tspan><tspan x="1074.5" dy="16.833">따라 움직인다</tspan></text></g><g ><g class="shape"><path d="M922 866h305v114H922z" class="stroke-B1 fill-B5 s0"/></g><text x="1074.5" y="904.5" class="text-bold fill-N1 s2"><tspan x="1074.5" dy="0">가장 많이 연구된 계열이다.</tspan><tspan x="1074.5" dy="17.25">그래서 근거의 양이 가장 많고,</tspan><tspan x="1074.5" dy="17.25">동시에 재현 검사를</tspan><tspan x="1074.5" dy="17.25">가장 많이 받았다</tspan></text></g><g ><g class="shape"><path d="M40 1176h316v146H40z" class="stroke-B1 fill-B5 s0"/></g><text x="198" y="1214.5" class="text-bold fill-N1 s2"><tspan x="198" dy="0">변화의 원천 —</tspan><tspan x="198" dy="16.833">생각의 내용을</tspan><tspan x="198" dy="16.833">바꾸는 것이 아니라</tspan><tspan x="198" dy="16.833">생각과 맺는 관계를 바꾸는 것.</tspan><tspan x="198" dy="16.833">그리고 무엇이 중요한지에 따라</tspan><tspan x="198" dy="16.833">행동하는 것</tspan></text></g><g ><g class="shape"><path d="M40 1362h316v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="198" y="1400.5" class="text-bold fill-N1 s2"><tspan x="198" dy="0">이른바 3세대라 불린다.</tspan><tspan x="198" dy="17.667">앞 계열과의 차이가</tspan><tspan x="198" dy="17.667">얼마나 큰지는 논쟁 중이다</tspan></text></g><marker id="mk-d2-605298114-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="M210 146v34" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="M210 316v34" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="M651 162v34" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="M1063 146v34" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="M1074.5 828v34" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="M198 1324v34" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="M530.774 674.42 416.453 527.16" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="M651 632V528" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="m767.198 671.399 112.405-150.197" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="M844 827h34" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-3488378134)" d="m520.657 971.482-140.97 155.554" class="connection stroke-B1 s0" mask="url(#d2-605298114)"/><marker id="mk-d2-605298114-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-605298114-2177206569)" d="M210 526v104" class="connection stroke-B2 s4" mask="url(#d2-605298114)"/><path fill="none" marker-end="url(#mk-d2-605298114-2177206569)" d="M210 1128v-104" class="connection stroke-B2 s4" mask="url(#d2-605298114)"/><mask id="d2-605298114" width="1469" height="1702" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1469v1702H-101z"/></mask></svg>