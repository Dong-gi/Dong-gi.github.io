<svg xmlns="http://www.w3.org/2000/svg" width="1209" height="1593" class="d2-3682586890 d2-svg" viewBox="-101 -101 1209 1593"><rect width="1209" height="1593" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3682586890 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3682586890 .fill-N1{fill:#0a0f25}.d2-3682586890 .fill-B4{fill:#e3e9fd}.d2-3682586890 .fill-B5{fill:#edf0fd}.d2-3682586890 .stroke-B1,.d2-3682586890 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h351v511H0z" class="stroke-B1 fill-B4 s0"/></g><text x="175.5" y="33" class="fill-N1 s1">정신역동</text></g><g ><g class="shape"><path d="M381 0h294v511H381z" class="stroke-B1 fill-B4 s0"/></g><text x="528" y="33" class="fill-N1 s1">인간중심</text></g><g ><g class="shape"><path d="M705 0h302v511H705z" class="stroke-B1 fill-B4 s0"/></g><text x="856" y="33" class="fill-N1 s1">행동</text></g><text x="125.5" y="587" class="fill-N1 s2"><tspan x="125.5" dy="0"> </tspan><tspan x="125.5" dy="16.278">현장에서 가장 흔한 형태는</tspan><tspan x="125.5" dy="16.278">어느 하나가 아니라</tspan><tspan x="125.5" dy="16.278">여러 계열을 섞어 쓰는 것이다.</tspan><tspan x="125.5" dy="16.278">조사에서 자기 방식을</tspan><tspan x="125.5" dy="16.278">‘통합’ 또는 ‘절충’ 이라</tspan><tspan x="125.5" dy="16.278">답하는 비율이</tspan><tspan x="125.5" dy="16.278">큰 편이라고 보고된다.</tspan><tspan x="125.5" dy="16.278"> </tspan><tspan x="125.5" dy="16.278">그리고 이 그림에서</tspan><tspan x="125.5" dy="16.278">읽어야 할 것 하나 —</tspan><tspan x="125.5" dy="16.278">계열마다</tspan><tspan x="125.5" dy="16.278">‘무엇이 바뀌어야 하는가’ 가</tspan><tspan x="125.5" dy="16.278">다르므로,</tspan><tspan x="125.5" dy="16.278">계열을 견주는 연구는</tspan><tspan x="125.5" dy="16.278">‘무엇을 재서</tspan><tspan x="125.5" dy="16.278">나아졌다고 할지’ 부터</tspan><tspan x="125.5" dy="16.278">정해야 한다</tspan></text><g ><g class="shape"><ellipse cx="528" cy="765" class="shape stroke-B1" rx="147" ry="194" style="fill:#f7f8fe;stroke-width:2"/></g><text x="528" y="762.5" class="text-bold fill-N1 s2"><tspan x="528" dy="0">무엇이 바뀌면</tspan><tspan x="528" dy="18.5">사람이 달라지는가</tspan></text></g><g ><g class="shape"><path d="M705 571h302v388H705z" class="stroke-B1 fill-B4 s0"/></g><text x="856" y="604" class="fill-N1 s1">인지행동</text></g><g ><g class="shape"><path d="M0 1019h351v372H0z" class="stroke-B1 fill-B4 s0"/></g><text x="175.5" y="1052" class="fill-N1 s1">수용전념 계열</text></g><g ><g class="shape"><path d="M25 46h301v114H25z" class="stroke-B1 fill-B5 s0"/></g><text x="175.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="175.5" dy="0">출발 — 20세기 초.</tspan><tspan x="175.5" dy="17.25">이후 크게 갈라졌고</tspan><tspan x="175.5" dy="17.25">지금의 형태는</tspan><tspan x="175.5" dy="17.25">초기와 많이 다르다</tspan></text></g><g ><g class="shape"><path d="M25 185h301v146H25z" class="stroke-B1 fill-B5 s0"/></g><text x="175.5" y="223.5" class="text-bold fill-N1 s2"><tspan x="175.5" dy="0">변화의 원천 —</tspan><tspan x="175.5" dy="16.833">알아차리지 못하던 것을</tspan><tspan x="175.5" dy="16.833">알아차리게 되는 것,</tspan><tspan x="175.5" dy="16.833">그리고 관계에서</tspan><tspan x="175.5" dy="16.833">되풀이되는 방식을</tspan><tspan x="175.5" dy="16.833">보게 되는 것</tspan></text></g><g ><g class="shape"><path d="M25 356h301v130H25z" class="stroke-B1 fill-B5 s0"/></g><text x="175.5" y="394.5" class="text-bold fill-N1 s2"><tspan x="175.5" dy="0">비판 — 초기의 여러 주장이</tspan><tspan x="175.5" dy="17">검사 가능한 형태가 아니었다.</tspan><tspan x="175.5" dy="17">무엇이 관찰되면 그 주장이</tspan><tspan x="175.5" dy="17">틀린 것이 되는지가</tspan><tspan x="175.5" dy="17">정해져 있지 않았다</tspan></text></g><g ><g class="shape"><path d="M406 46h241v146H406z" class="stroke-B1 fill-B5 s0"/></g><text x="526.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="526.5" dy="0">변화의 원천 —</tspan><tspan x="526.5" dy="16.833">치료자의 태도.</tspan><tspan x="526.5" dy="16.833">조건 없이 존중하는 것,</tspan><tspan x="526.5" dy="16.833">상대의 자리에서</tspan><tspan x="526.5" dy="16.833">이해하는 것,</tspan><tspan x="526.5" dy="16.833">겉과 속이 일치하는 것</tspan></text></g><g ><g class="shape"><path d="M406 217h241v146H406z" class="stroke-B1 fill-B5 s0"/></g><text x="526.5" y="255.5" class="text-bold fill-N1 s2"><tspan x="526.5" dy="0">이 계열이 남긴 것 —</tspan><tspan x="526.5" dy="16.833">관계 자체를</tspan><tspan x="526.5" dy="16.833">변화의 원천으로 본 것.</tspan><tspan x="526.5" dy="16.833">다음 절의</tspan><tspan x="526.5" dy="16.833">공통요인 논의가</tspan><tspan x="526.5" dy="16.833">여기서 자란다</tspan></text></g><g ><g class="shape"><path d="M730 46h252v98H730z" class="stroke-B1 fill-B5 s0"/></g><text x="856" y="84.5" class="text-bold fill-N1 s2"><tspan x="856" dy="0">변화의 원천 — 학습.</tspan><tspan x="856" dy="17.667">7장의 조건형성을</tspan><tspan x="856" dy="17.667">임상에 적용한 계열이다</tspan></text></g><g ><g class="shape"><path d="M730 169h252v162H730z" class="stroke-B1 fill-B5 s0"/></g><text x="856" y="207.5" class="text-bold fill-N1 s2"><tspan x="856" dy="0">이 계열이 가져온 것 —</tspan><tspan x="856" dy="16.714">무엇을 재서</tspan><tspan x="856" dy="16.714">나아졌다고 할지</tspan><tspan x="856" dy="16.714">미리 정하는 관행.</tspan><tspan x="856" dy="16.714">효과를 셀 수 있게</tspan><tspan x="856" dy="16.714">만든 것이</tspan><tspan x="856" dy="16.714">이 계열의 몫이 크다</tspan></text></g><g ><g class="shape"><path d="M730 617h241v146H730z" class="stroke-B1 fill-B5 s0"/></g><text x="850.5" y="655.5" class="text-bold fill-N1 s2"><tspan x="850.5" dy="0">변화의 원천 —</tspan><tspan x="850.5" dy="16.833">생각과 행동과</tspan><tspan x="850.5" dy="16.833">정서가 서로 물려 있고,</tspan><tspan x="850.5" dy="16.833">그 고리의 어느 지점에</tspan><tspan x="850.5" dy="16.833">손을 대면 나머지가</tspan><tspan x="850.5" dy="16.833">따라 움직인다</tspan></text></g><g ><g class="shape"><path d="M730 788h241v146H730z" class="stroke-B1 fill-B5 s0"/></g><text x="850.5" y="826.5" class="text-bold fill-N1 s2"><tspan x="850.5" dy="0">가장 많이 연구된</tspan><tspan x="850.5" dy="16.833">계열이다.</tspan><tspan x="850.5" dy="16.833">그래서 근거의 양이</tspan><tspan x="850.5" dy="16.833">가장 많고,</tspan><tspan x="850.5" dy="16.833">동시에 재현 검사를</tspan><tspan x="850.5" dy="16.833">가장 많이 받았다</tspan></text></g><g ><g class="shape"><path d="M25 1065h276v178H25z" class="stroke-B1 fill-B5 s0"/></g><text x="163" y="1103.5" class="text-bold fill-N1 s2"><tspan x="163" dy="0">변화의 원천 —</tspan><tspan x="163" dy="16.625">생각의 내용을</tspan><tspan x="163" dy="16.625">바꾸는 것이 아니라</tspan><tspan x="163" dy="16.625">생각과 맺는 관계를</tspan><tspan x="163" dy="16.625">바꾸는 것.</tspan><tspan x="163" dy="16.625">그리고 무엇이</tspan><tspan x="163" dy="16.625">중요한지에 따라</tspan><tspan x="163" dy="16.625">행동하는 것</tspan></text></g><g ><g class="shape"><path d="M25 1268h276v98H25z" class="stroke-B1 fill-B5 s0"/></g><text x="163" y="1306.5" class="text-bold fill-N1 s2"><tspan x="163" dy="0">이른바 3세대라 불린다.</tspan><tspan x="163" dy="17.667">앞 계열과의 차이가</tspan><tspan x="163" dy="17.667">얼마나 큰지는 논쟁 중이다</tspan></text></g><marker id="mk-d2-3682586890-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="M175.5 162v19" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="M175.5 333v19" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="M526.5 194v19" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="M856 146v19" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="M850.5 765v19" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="M163 1245v19" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="m426.867 620.352-73.6-107.056" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="M528 569v-54" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="m624.085 615.32 78.745-121.96" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="M677 765h24" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-3488378134)" d="m419.749 899.56-93.247 116.319" class="connection stroke-B1 s0" mask="url(#d2-3682586890)"/><marker id="mk-d2-3682586890-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3682586890-2177206569)" d="M175.5 513v54" class="connection stroke-B2 s4" mask="url(#d2-3682586890)"/><path fill="none" marker-end="url(#mk-d2-3682586890-2177206569)" d="M175.5 1017v-54" class="connection stroke-B2 s4" mask="url(#d2-3682586890)"/><mask id="d2-3682586890" width="1209" height="1593" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1209v1593H-101z"/></mask></svg>