<svg xmlns="http://www.w3.org/2000/svg" width="1802" height="1526" class="d2-3609486284 d2-svg" viewBox="-101 -101 1802 1526"><rect width="1802" height="1526" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3609486284 .fill-N1{fill:#0a0f25}.d2-3609486284 .fill-B4{fill:#e3e9fd}.d2-3609486284 .fill-B5{fill:#edf0fd}.d2-3609486284 .stroke-B1,.d2-3609486284 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h547v460H0z" class="stroke-B1 fill-B4 s0"/></g><text x="273.5" y="33" class="fill-N1 s1">정신역동</text></g><g ><g class="shape"><path d="M587 0h483v460H587z" class="stroke-B1 fill-B4 s0"/></g><text x="828.5" y="33" class="fill-N1 s1">인간중심</text></g><g ><g class="shape"><path d="M1110 0h490v460h-490z" class="stroke-B1 fill-B4 s0"/></g><text x="1355" y="33" class="fill-N1 s1">행동</text></g><text x="261" y="586" class="fill-N1 s2"><tspan x="261" dy="0"> </tspan><tspan x="261" dy="16.5">현장에서 가장 흔한 형태는 어느 하나가 아니라</tspan><tspan x="261" dy="16.5">여러 계열을 섞어 쓰는 것이다.</tspan><tspan x="261" dy="16.5">조사에서 자기 방식을</tspan><tspan x="261" dy="16.5">‘통합’ 또는 ‘절충’ 이라 답하는 비율이 큰 편이라고 보고된다.</tspan><tspan x="261" dy="16.5"> </tspan><tspan x="261" dy="16.5">그리고 이 그림에서 읽어야 할 것 하나 —</tspan><tspan x="261" dy="16.5">계열마다 ‘무엇이 바뀌어야 하는가’ 가 다르므로,</tspan><tspan x="261" dy="16.5">계열을 견주는 연구는</tspan><tspan x="261" dy="16.5">‘무엇을 재서 나아졌다고 할지’ 부터 정해야 한다</tspan></text><g ><g class="shape"><ellipse cx="828.5" cy="739" class="shape stroke-B1" rx="241.5" ry="169" style="fill:#f7f8fe;stroke-width:2"/></g><text x="828.5" y="744.5" class="text-bold fill-N1 s2">무엇이 바뀌면 사람이 달라지는가</text></g><g ><g class="shape"><path d="M1110 570h490v338h-490z" class="stroke-B1 fill-B4 s0"/></g><text x="1355" y="603" class="fill-N1 s1">인지행동</text></g><g ><g class="shape"><path d="M0 1018h547v306H0z" class="stroke-B1 fill-B4 s0"/></g><text x="273.5" y="1051" class="fill-N1 s1">수용전념 계열</text></g><g ><g class="shape"><path d="M40 46h467v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="273.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="273.5" dy="0">출발 — 20세기 초. 이후 크게 갈라졌고</tspan><tspan x="273.5" dy="18.5">지금의 형태는 초기와 많이 다르다</tspan></text></g><g ><g class="shape"><path d="M40 168h467v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="273.5" y="206.5" class="text-bold fill-N1 s2"><tspan x="273.5" dy="0">변화의 원천 — 알아차리지 못하던 것을</tspan><tspan x="273.5" dy="17.667">알아차리게 되는 것,</tspan><tspan x="273.5" dy="17.667">그리고 관계에서 되풀이되는 방식을 보게 되는 것</tspan></text></g><g ><g class="shape"><path d="M40 306h467v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="273.5" y="344.5" class="text-bold fill-N1 s2"><tspan x="273.5" dy="0">비판 — 초기의 여러 주장이</tspan><tspan x="273.5" dy="17.25">검사 가능한 형태가 아니었다.</tspan><tspan x="273.5" dy="17.25">무엇이 관찰되면 그 주장이</tspan><tspan x="273.5" dy="17.25">틀린 것이 되는지가 정해져 있지 않았다</tspan></text></g><g ><g class="shape"><path d="M627 46h403v114H627z" class="stroke-B1 fill-B5 s0"/></g><text x="828.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="828.5" dy="0">변화의 원천 — 치료자의 태도.</tspan><tspan x="828.5" dy="17.25">조건 없이 존중하는 것,</tspan><tspan x="828.5" dy="17.25">상대의 자리에서 이해하는 것,</tspan><tspan x="828.5" dy="17.25">겉과 속이 일치하는 것</tspan></text></g><g ><g class="shape"><path d="M627 200h403v98H627z" class="stroke-B1 fill-B5 s0"/></g><text x="828.5" y="238.5" class="text-bold fill-N1 s2"><tspan x="828.5" dy="0">이 계열이 남긴 것 —</tspan><tspan x="828.5" dy="17.667">관계 자체를 변화의 원천으로 본 것.</tspan><tspan x="828.5" dy="17.667">다음 절의 공통요인 논의가 여기서 자란다</tspan></text></g><g ><g class="shape"><path d="M1150 46h410v82h-410z" class="stroke-B1 fill-B5 s0"/></g><text x="1355" y="84.5" class="text-bold fill-N1 s2"><tspan x="1355" dy="0">변화의 원천 — 학습.</tspan><tspan x="1355" dy="18.5">7장의 조건형성을 임상에 적용한 계열이다</tspan></text></g><g ><g class="shape"><path d="M1150 168h410v114h-410z" class="stroke-B1 fill-B5 s0"/></g><text x="1355" y="206.5" class="text-bold fill-N1 s2"><tspan x="1355" dy="0">이 계열이 가져온 것 — 무엇을 재서</tspan><tspan x="1355" dy="17.25">나아졌다고 할지 미리 정하는 관행.</tspan><tspan x="1355" dy="17.25">효과를 셀 수 있게 만든 것이</tspan><tspan x="1355" dy="17.25">이 계열의 몫이 크다</tspan></text></g><g ><g class="shape"><path d="M1150 616h363v114h-363z" class="stroke-B1 fill-B5 s0"/></g><text x="1331.5" y="654.5" class="text-bold fill-N1 s2"><tspan x="1331.5" dy="0">변화의 원천 — 생각과 행동과</tspan><tspan x="1331.5" dy="17.25">정서가 서로 물려 있고,</tspan><tspan x="1331.5" dy="17.25">그 고리의 어느 지점에</tspan><tspan x="1331.5" dy="17.25">손을 대면 나머지가 따라 움직인다</tspan></text></g><g ><g class="shape"><path d="M1150 770h363v98h-363z" class="stroke-B1 fill-B5 s0"/></g><text x="1331.5" y="808.5" class="text-bold fill-N1 s2"><tspan x="1331.5" dy="0">가장 많이 연구된 계열이다.</tspan><tspan x="1331.5" dy="17.667">그래서 근거의 양이 가장 많고,</tspan><tspan x="1331.5" dy="17.667">동시에 재현 검사를 가장 많이 받았다</tspan></text></g><g ><g class="shape"><path d="M40 1064h461v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="270.5" y="1102.5" class="text-bold fill-N1 s2"><tspan x="270.5" dy="0">변화의 원천 — 생각의 내용을 바꾸는 것이 아니라</tspan><tspan x="270.5" dy="17.667">생각과 맺는 관계를 바꾸는 것. 그리고</tspan><tspan x="270.5" dy="17.667">무엇이 중요한지에 따라 행동하는 것</tspan></text></g><g ><g class="shape"><path d="M40 1202h461v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="270.5" y="1240.5" class="text-bold fill-N1 s2"><tspan x="270.5" dy="0">이른바 3세대라 불린다. 앞 계열과의</tspan><tspan x="270.5" dy="18.5">차이가 얼마나 큰지는 논쟁 중이다</tspan></text></g><marker id="mk-d2-3609486284-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="M273.5 130v34" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="M273.5 268v34" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="M828.5 162v34" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="M1355 130v34" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="M1331.5 732v34" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="M270.5 1164v34" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="M680.526 603.648 526.947 462.705" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="M829 568V464" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="m971.438 600.61 142.685-137.83" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="M1072 739h34" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-3488378134)" d="m665.42 866.227-192.26 149.32" class="connection stroke-B1 s0" mask="url(#d2-3609486284)"/><marker id="mk-d2-3609486284-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3609486284-2177206569)" d="M273.5 462v104" class="connection stroke-B2 s4" mask="url(#d2-3609486284)"/><path fill="none" marker-end="url(#mk-d2-3609486284-2177206569)" d="M273.5 1016V912" class="connection stroke-B2 s4" mask="url(#d2-3609486284)"/><mask id="d2-3609486284" width="1802" height="1526" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1802v1526H-101z"/></mask></svg>