<svg xmlns="http://www.w3.org/2000/svg" width="3709" height="1307" class="d2-2908318775 d2-svg" viewBox="-91 -101 3709 1307"><rect width="3709" height="1307" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2908318775 .fill-N1{fill:#0a0f25}.d2-2908318775 .fill-B4{fill:#e3e9fd}.d2-2908318775 .fill-B5{fill:#edf0fd}.d2-2908318775 .stroke-B1,.d2-2908318775 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="1734.5" cy="79" class="shape stroke-B1" rx="237.5" ry="79" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1734.5" y="84.5" class="text-bold fill-N1 s0">무엇이 바뀌면 사람이 달라지는가</text></g><g ><g class="shape"><path d="M10 286h718v598H10z" class="stroke-B1 fill-B4 s1"/></g><text x="369" y="273" class="fill-N1 s2">정신역동</text></g><g ><g class="shape"><path d="M768 278h576v374H768z" class="stroke-B1 fill-B4 s1"/></g><text x="1056" y="265" class="fill-N1 s2">인간중심</text></g><g ><g class="shape"><path d="M1384 286h701v366h-701z" class="stroke-B1 fill-B4 s1"/></g><text x="1734.5" y="273" class="fill-N1 s2">행동</text></g><g ><g class="shape"><path d="M2125 278h605v374h-605z" class="stroke-B1 fill-B4 s1"/></g><text x="2427.5" y="265" class="fill-N1 s2">인지행동</text></g><g ><g class="shape"><path d="M2770 510h747v366h-747z" class="stroke-B1 fill-B4 s1"/></g><text x="3143.5" y="497" class="fill-N1 s2">수용전념 계열</text></g><text x="1756" y="1020" class="fill-N1 s0"><tspan x="1756" dy="0"> </tspan><tspan x="1756" dy="16.833">현장에서 가장 흔한 형태는 어느 하나가 아니라 여러 계열을 섞어 쓰는 것이다.</tspan><tspan x="1756" dy="16.833">조사에서 자기 방식을 ‘통합’ 또는 ‘절충’ 이라 답하는 비율이 큰 편이라고 보고된다.</tspan><tspan x="1756" dy="16.833"> </tspan><tspan x="1756" dy="16.833">그리고 이 그림에서 읽어야 할 것 하나 — 계열마다 ‘무엇이 바뀌어야 하는가’ 가 다르므로,</tspan><tspan x="1756" dy="16.833">계열을 견주는 연구는 ‘무엇을 재서 나아졌다고 할지’ 부터 정해야 한다</tspan></text><g ><g class="shape"><path d="M40 316h658v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="369" y="354.5" class="text-bold fill-N1 s0">출발 — 20세기 초. 이후 크게 갈라졌고 지금의 형태는 초기와 많이 다르다</text></g><g ><g class="shape"><path d="M93 540h552v82H93z" class="stroke-B1 fill-B5 s1"/></g><text x="369" y="578.5" class="text-bold fill-N1 s0"><tspan x="369" dy="0">변화의 원천 — 알아차리지 못하던 것을 알아차리게 되는 것,</tspan><tspan x="369" dy="18.5">그리고 관계에서 되풀이되는 방식을 보게 되는 것</tspan></text></g><g ><g class="shape"><path d="M60 772h619v82H60z" class="stroke-B1 fill-B5 s1"/></g><text x="369.5" y="810.5" class="text-bold fill-N1 s0"><tspan x="369.5" dy="0">비판 — 초기의 여러 주장이 검사 가능한 형태가 아니었다.</tspan><tspan x="369.5" dy="18.5">무엇이 관찰되면 그 주장이 틀린 것이 되는지가 정해져 있지 않았다</tspan></text></g><g ><g class="shape"><path d="M808 308h496v82H808z" class="stroke-B1 fill-B5 s1"/></g><text x="1056" y="346.5" class="text-bold fill-N1 s0"><tspan x="1056" dy="0">변화의 원천 — 치료자의 태도. 조건 없이 존중하는 것,</tspan><tspan x="1056" dy="18.5">상대의 자리에서 이해하는 것, 겉과 속이 일치하는 것</tspan></text></g><g ><g class="shape"><path d="M798 540h516v82H798z" class="stroke-B1 fill-B5 s1"/></g><text x="1056" y="578.5" class="text-bold fill-N1 s0"><tspan x="1056" dy="0">이 계열이 남긴 것 — 관계 자체를 변화의 원천으로 본 것.</tspan><tspan x="1056" dy="18.5">다음 절의 공통요인 논의가 여기서 자란다</tspan></text></g><g ><g class="shape"><path d="M1445 316h579v66h-579z" class="stroke-B1 fill-B5 s1"/></g><text x="1734.5" y="354.5" class="text-bold fill-N1 s0">변화의 원천 — 학습. 7장의 조건형성을 임상에 적용한 계열이다</text></g><g ><g class="shape"><path d="M1414 540h641v82h-641z" class="stroke-B1 fill-B5 s1"/></g><text x="1734.5" y="578.5" class="text-bold fill-N1 s0"><tspan x="1734.5" dy="0">이 계열이 가져온 것 — 무엇을 재서 나아졌다고 할지 미리 정하는 관행.</tspan><tspan x="1734.5" dy="18.5">효과를 셀 수 있게 만든 것이 이 계열의 몫이 크다</tspan></text></g><g ><g class="shape"><path d="M2161 308h534v82h-534z" class="stroke-B1 fill-B5 s1"/></g><text x="2428" y="346.5" class="text-bold fill-N1 s0"><tspan x="2428" dy="0">변화의 원천 — 생각과 행동과 정서가 서로 물려 있고,</tspan><tspan x="2428" dy="18.5">그 고리의 어느 지점에 손을 대면 나머지가 따라 움직인다</tspan></text></g><g ><g class="shape"><path d="M2155 540h545v82h-545z" class="stroke-B1 fill-B5 s1"/></g><text x="2427.5" y="578.5" class="text-bold fill-N1 s0"><tspan x="2427.5" dy="0">가장 많이 연구된 계열이다. 그래서 근거의 양이 가장 많고,</tspan><tspan x="2427.5" dy="18.5">동시에 재현 검사를 가장 많이 받았다</tspan></text></g><g ><g class="shape"><path d="M2800 540h687v82h-687z" class="stroke-B1 fill-B5 s1"/></g><text x="3143.5" y="578.5" class="text-bold fill-N1 s0"><tspan x="3143.5" dy="0">변화의 원천 — 생각의 내용을 바꾸는 것이 아니라</tspan><tspan x="3143.5" dy="18.5">생각과 맺는 관계를 바꾸는 것. 그리고 무엇이 중요한지에 따라 행동하는 것</tspan></text></g><g ><g class="shape"><path d="M2818 780h652v66h-652z" class="stroke-B1 fill-B5 s1"/></g><text x="3144" y="818.5" class="text-bold fill-N1 s0">이른바 3세대라 불린다. 앞 계열과의 차이가 얼마나 큰지는 논쟁 중이다</text></g><marker id="mk-d2-2908318775-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M369 384v152" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M369 624v144" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M1056 392v144" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M1734.5 384v152" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M2427.5 392v144" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M3143.5 624v152" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M1504.009 100.19C596.4 186.4 369 215.4 369 241" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M1526.035 118.375C1150.4 190 1056 213.8 1056 233" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M1734.98 160c-.38 38-.48 55.4-.48 81" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M1943.966 117.368C2330.4 189.8 2427.5 213.8 2427.5 233" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-3488378134)" d="M1964.992 100.182C2907.4 186.4 3143.5 218 3143.5 233v232" class="connection stroke-B1 s1" mask="url(#d2-2908318775)"/><marker id="mk-d2-2908318775-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2908318775-2177206569)" d="M369 886c0 54 203 82.8 1011.01 141.71" class="connection stroke-B2 s4" mask="url(#d2-2908318775)"/><path fill="none" marker-end="url(#mk-d2-2908318775-2177206569)" d="M3143.5 878c0 60.4-203.05 90.71-1011.26 149.261" class="connection stroke-B2 s4" mask="url(#d2-2908318775)"/><mask id="d2-2908318775" width="3709" height="1307" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h3709v1307H-91z"/></mask></svg>