<svg xmlns="http://www.w3.org/2000/svg" width="1556" height="1392" class="d2-399957033 d2-svg" viewBox="-101 -101 1556 1392"><rect width="1556" height="1392" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-399957033 .fill-N1{fill:#0a0f25}.d2-399957033 .fill-B5{fill:#edf0fd}.d2-399957033 .fill-B6{fill:#f7f8fe}.d2-399957033 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="677" cy="81" class="shape stroke-B1 fill-B6 s0" rx="677" ry="81"/></g><text x="677" y="86.5" class="text-bold fill-N1 s1">이 점수를 그 뜻으로 읽어도 되는가</text></g><g ><g class="shape"><path d="M0 242h1354v230H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="677" y="275" class="fill-N1" style="text-anchor:middle;font-size:28px">무엇으로 확인하는가</text></g><path fill="transparent" stroke="transparent" d="M0 552h1354v638H0z" class="shape s0"/><g ><g class="shape"><path d="M50 292h345v130H50z" class="stroke-B1 fill-B5 s0"/></g><text x="222.5" y="338.5" class="text-bold fill-N1 s1"><tspan x="222.5" dy="0">내용 타당도</tspan><tspan x="222.5" dy="17.25">재려는 범위를 문항이 고루 덮는가.</tspan><tspan x="222.5" dy="17.25">덧셈만 묻는 수학 시험은</tspan><tspan x="222.5" dy="17.25">수학 실력을 덮지 못한다</tspan></text></g><g ><g class="shape"><path d="M445 292h362v130H445z" class="stroke-B1 fill-B5 s0"/></g><text x="626" y="338.5" class="text-bold fill-N1 s1"><tspan x="626" dy="0">준거 타당도</tspan><tspan x="626" dy="17.25">바깥의 다른 지표와 맞아떨어지는가.</tspan><tspan x="626" dy="17.25">지금의 다른 지표(공인)일 수도,</tspan><tspan x="626" dy="17.25">나중의 결과(예언)일 수도 있다</tspan></text></g><g ><g class="shape"><path d="M857 292h447v130H857z" class="stroke-B1 fill-B5 s0"/></g><text x="1080.5" y="330.5" class="text-bold fill-N1 s1"><tspan x="1080.5" dy="0">구성 타당도</tspan><tspan x="1080.5" dy="17">재려는 구성개념의 이론이</tspan><tspan x="1080.5" dy="17">시키는 대로 움직이는가.</tspan><tspan x="1080.5" dy="17">같은 것을 잰다는 지표와는 높게,</tspan><tspan x="1080.5" dy="17">다른 것을 잰다는 지표와는 낮게 상관해야 한다</tspan></text></g><g ><g class="shape"><path d="M80 632h407v478H80z" class="stroke-B1 fill-B5 s0"/></g><text x="283.5" y="844.5" class="text-bold fill-N1 s1"><tspan x="283.5" dy="0">신뢰도와의 관계</tspan><tspan x="283.5" dy="17">신뢰도는 타당도의 필요조건이고</tspan><tspan x="283.5" dy="17">충분조건이 아니다.</tspan><tspan x="283.5" dy="17">흔들리는 자로는 아무것도 잴 수 없지만,</tspan><tspan x="283.5" dy="17">안 흔들린다고 옳은 것을 재는 것은 아니다</tspan></text></g><g ><g class="shape"><path d="M567 632h528v478H567z" class="stroke-B1 fill-B5 s0"/></g><text x="831" y="661" class="fill-N1" style="text-anchor:middle;font-size:24px">구성 타당도가 특이한 이유</text></g><g ><g class="shape"><path d="M627 692h408v82H627z" class="stroke-B1 fill-B6 s0"/></g><text x="831" y="730.5" class="text-bold fill-N1 s1"><tspan x="831" dy="0">정답지가 없다. 지능이나 불안에는</tspan><tspan x="831" dy="18.5">‘참값’ 을 알려 주는 바깥의 자가 없다</tspan></text></g><g ><g class="shape"><path d="M627 814h408v98H627z" class="stroke-B1 fill-B6 s0"/></g><text x="831" y="852.5" class="text-bold fill-N1 s1"><tspan x="831" dy="0">그래서 검사와 이론을 함께 검사하게 된다.</tspan><tspan x="831" dy="17.667">예측이 빗나가면 검사가 나쁜 것일 수도,</tspan><tspan x="831" dy="17.667">이론이 틀린 것일 수도 있다</tspan></text></g><g ><g class="shape"><path d="M627 952h408v98H627z" class="stroke-B1 fill-B6 s0"/></g><text x="831" y="990.5" class="text-bold fill-N1 s1"><tspan x="831" dy="0">한 번에 끝나지 않는다.</tspan><tspan x="831" dy="17.667">증거가 쌓이면서 올라가고,</tspan><tspan x="831" dy="17.667">반증이 나오면 내려간다</tspan></text></g><marker id="mk-d2-399957033-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-399957033-3488378134)" d="M677 164v74" class="connection stroke-B1 s0" mask="url(#d2-399957033)"/><path fill="none" marker-end="url(#mk-d2-399957033-3488378134)" d="m1048.126 423.799-99.378 204.603" class="connection stroke-B1 s0" mask="url(#d2-399957033)"/><marker id="mk-d2-399957033-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-399957033-2177206569)" d="M587.287 473.59 468.925 628.82" class="connection" mask="url(#d2-399957033)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-399957033" width="1556" height="1392" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1556v1392H-101z"/></mask></svg>