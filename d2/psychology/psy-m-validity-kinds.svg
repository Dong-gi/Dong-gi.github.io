<svg xmlns="http://www.w3.org/2000/svg" width="1197" height="1504" class="d2-2277345311 d2-svg" viewBox="-101 -101 1197 1504"><rect width="1197" height="1504" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2277345311 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2277345311 .fill-N1{fill:#0a0f25}.d2-2277345311 .fill-B5{fill:#edf0fd}.d2-2277345311 .fill-B6{fill:#f7f8fe}.d2-2277345311 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="497.5" cy="81" class="shape stroke-B1 fill-B6 s0" rx="497.5" ry="81"/></g><text x="497.5" y="86.5" class="text-bold fill-N1 s1">이 점수를 그 뜻으로 읽어도 되는가</text></g><g ><g class="shape"><path d="M0 242h995v278H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="497.5" y="275" class="fill-N1" style="text-anchor:middle;font-size:28px">무엇으로 확인하는가</text></g><path fill="transparent" stroke="transparent" d="M0 600h995v702H0z" class="shape s0"/><g ><g class="shape"><path d="M50 292h255v178H50z" class="stroke-B1 fill-B5 s0"/></g><text x="177.5" y="354.5" class="text-bold fill-N1 s1"><tspan x="177.5" dy="0">내용 타당도</tspan><tspan x="177.5" dy="17">재려는 범위를</tspan><tspan x="177.5" dy="17">문항이 고루 덮는가.</tspan><tspan x="177.5" dy="17">덧셈만 묻는 수학 시험은</tspan><tspan x="177.5" dy="17">수학 실력을 덮지 못한다</tspan></text></g><g ><g class="shape"><path d="M355 292h268v178H355z" class="stroke-B1 fill-B5 s0"/></g><text x="489" y="346.5" class="text-bold fill-N1 s1"><tspan x="489" dy="0">준거 타당도</tspan><tspan x="489" dy="16.833">바깥의 다른 지표와</tspan><tspan x="489" dy="16.833">맞아떨어지는가.</tspan><tspan x="489" dy="16.833">지금의 다른 지표(공인)일</tspan><tspan x="489" dy="16.833">수도, 나중의 결과(예언)일</tspan><tspan x="489" dy="16.833">수도 있다</tspan></text></g><g ><g class="shape"><path d="M673 292h272v178H673z" class="stroke-B1 fill-B5 s0"/></g><text x="809" y="330.5" class="text-bold fill-N1 s1"><tspan x="809" dy="0">구성 타당도</tspan><tspan x="809" dy="16.625">재려는 구성개념의 이론이</tspan><tspan x="809" dy="16.625">시키는 대로 움직이는가.</tspan><tspan x="809" dy="16.625">같은 것을 잰다는</tspan><tspan x="809" dy="16.625">지표와는 높게,</tspan><tspan x="809" dy="16.625">다른 것을 잰다는</tspan><tspan x="809" dy="16.625">지표와는 낮게</tspan><tspan x="809" dy="16.625">상관해야 한다</tspan></text></g><g ><g class="shape"><path d="M80 680h279v542H80z" class="stroke-B1 fill-B5 s0"/></g><text x="219.5" y="900.5" class="text-bold fill-N1 s1"><tspan x="219.5" dy="0">신뢰도와의 관계</tspan><tspan x="219.5" dy="16.625">신뢰도는 타당도의</tspan><tspan x="219.5" dy="16.625">필요조건이고</tspan><tspan x="219.5" dy="16.625">충분조건이 아니다.</tspan><tspan x="219.5" dy="16.625">흔들리는 자로는</tspan><tspan x="219.5" dy="16.625">아무것도 잴 수 없지만,</tspan><tspan x="219.5" dy="16.625">안 흔들린다고</tspan><tspan x="219.5" dy="16.625">옳은 것을 재는 것은 아니다</tspan></text></g><g ><g class="shape"><path d="M439 680h399v542H439z" class="stroke-B1 fill-B5 s0"/></g><text x="638.5" y="709" class="fill-N1" style="text-anchor:middle;font-size:24px">구성 타당도가 특이한 이유</text></g><g ><g class="shape"><path d="M499 740h279v114H499z" class="stroke-B1 fill-B6 s0"/></g><text x="638.5" y="778.5" class="text-bold fill-N1 s1"><tspan x="638.5" dy="0">정답지가 없다.</tspan><tspan x="638.5" dy="17.25">지능이나 불안에는</tspan><tspan x="638.5" dy="17.25">‘참값’ 을 알려 주는</tspan><tspan x="638.5" dy="17.25">바깥의 자가 없다</tspan></text></g><g ><g class="shape"><path d="M499 894h279v130H499z" class="stroke-B1 fill-B6 s0"/></g><text x="638.5" y="932.5" class="text-bold fill-N1 s1"><tspan x="638.5" dy="0">그래서 검사와 이론을</tspan><tspan x="638.5" dy="17">함께 검사하게 된다.</tspan><tspan x="638.5" dy="17">예측이 빗나가면</tspan><tspan x="638.5" dy="17">검사가 나쁜 것일 수도,</tspan><tspan x="638.5" dy="17">이론이 틀린 것일 수도 있다</tspan></text></g><g ><g class="shape"><path d="M499 1064h279v98H499z" class="stroke-B1 fill-B6 s0"/></g><text x="638.5" y="1102.5" class="text-bold fill-N1 s1"><tspan x="638.5" dy="0">한 번에 끝나지 않는다.</tspan><tspan x="638.5" dy="17.667">증거가 쌓이면서 올라가고,</tspan><tspan x="638.5" dy="17.667">반증이 나오면 내려간다</tspan></text></g><marker id="mk-d2-2277345311-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2277345311-3488378134)" d="M498 164v74" class="connection stroke-B1 s0" mask="url(#d2-2277345311)"/><path fill="none" marker-end="url(#mk-d2-2277345311-3488378134)" d="M781.925 471.916 720.65 676.169" class="connection stroke-B1 s0" mask="url(#d2-2277345311)"/><marker id="mk-d2-2277345311-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2277345311-2177206569)" d="m428.624 521.798-75.371 154.606" class="connection" mask="url(#d2-2277345311)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-2277345311" width="1197" height="1504" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1197v1504H-101z"/></mask></svg>