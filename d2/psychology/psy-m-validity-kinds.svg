<svg xmlns="http://www.w3.org/2000/svg" width="3171" height="932" class="d2-949916255 d2-svg" viewBox="-91 -101 3171 932"><rect width="3171" height="932" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-949916255 .fill-N1{fill:#0a0f25}.d2-949916255 .fill-B4{fill:#e3e9fd}.d2-949916255 .fill-B5{fill:#edf0fd}.d2-949916255 .fill-B6{fill:#f7f8fe}.d2-949916255 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="2602.5" cy="81" class="shape stroke-B1 fill-B6 s0" rx="242.5" ry="81"/></g><text x="2602.5" y="86.5" class="text-bold fill-N1 s1">이 점수를 그 뜻으로 읽어도 되는가</text></g><g ><g class="shape"><path d="M156 282h2765v158H156z" class="stroke-B1 fill-B4 s0"/></g><text x="1538.5" y="269" class="fill-N1 s2">무엇으로 확인하는가</text></g><g ><g class="shape"><path d="M10 588h2165v142H10z" class="stroke-B1 fill-B4 s0"/></g><text x="1092.5" y="575" class="fill-N1 s2">구성 타당도가 특이한 이유</text></g><g ><g class="shape"><path d="M2225 610h754v98h-754z" class="stroke-B1 fill-B6 s0"/></g><text x="2602" y="648.5" class="text-bold fill-N1 s1"><tspan x="2602" dy="0">신뢰도와의 관계</tspan><tspan x="2602" dy="17.667">신뢰도는 타당도의 필요조건이고 충분조건이 아니다.</tspan><tspan x="2602" dy="17.667">흔들리는 자로는 아무것도 잴 수 없지만, 안 흔들린다고 옳은 것을 재는 것은 아니다</tspan></text></g><g ><g class="shape"><path d="M186 312h471v98H186z" class="stroke-B1 fill-B5 s0"/></g><text x="421.5" y="350.5" class="text-bold fill-N1 s1"><tspan x="421.5" dy="0">내용 타당도</tspan><tspan x="421.5" dy="17.667">재려는 범위를 문항이 고루 덮는가.</tspan><tspan x="421.5" dy="17.667">덧셈만 묻는 수학 시험은 수학 실력을 덮지 못한다</tspan></text></g><g ><g class="shape"><path d="M2313 312h578v98h-578z" class="stroke-B1 fill-B5 s0"/></g><text x="2602" y="350.5" class="text-bold fill-N1 s1"><tspan x="2602" dy="0">준거 타당도</tspan><tspan x="2602" dy="17.667">바깥의 다른 지표와 맞아떨어지는가.</tspan><tspan x="2602" dy="17.667">지금의 다른 지표(공인)일 수도, 나중의 결과(예언)일 수도 있다</tspan></text></g><g ><g class="shape"><path d="M717 312h731v98H717z" class="stroke-B1 fill-B5 s0"/></g><text x="1082.5" y="350.5" class="text-bold fill-N1 s1"><tspan x="1082.5" dy="0">구성 타당도</tspan><tspan x="1082.5" dy="17.667">재려는 구성개념의 이론이 시키는 대로 움직이는가.</tspan><tspan x="1082.5" dy="17.667">같은 것을 잰다는 지표와는 높게, 다른 것을 잰다는 지표와는 낮게 상관해야 한다</tspan></text></g><g ><g class="shape"><path d="M40 626h669v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="374.5" y="664.5" class="text-bold fill-N1 s1">정답지가 없다. 지능이나 불안에는 ‘참값’ 을 알려 주는 바깥의 자가 없다</text></g><g ><g class="shape"><path d="M769 618h627v82H769z" class="stroke-B1 fill-B5 s0"/></g><text x="1082.5" y="656.5" class="text-bold fill-N1 s1"><tspan x="1082.5" dy="0">그래서 검사와 이론을 함께 검사하게 된다.</tspan><tspan x="1082.5" dy="18.5">예측이 빗나가면 검사가 나쁜 것일 수도, 이론이 틀린 것일 수도 있다</tspan></text></g><g ><g class="shape"><path d="M1456 626h689v66h-689z" class="stroke-B1 fill-B5 s0"/></g><text x="1800.5" y="664.5" class="text-bold fill-N1 s1">한 번에 끝나지 않는다. 증거가 쌓이면서 올라가고, 반증이 나오면 내려간다</text></g><marker id="mk-d2-949916255-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-949916255-3488378134)" d="M2602 164v114" class="connection stroke-B1 s0" mask="url(#d2-949916255)"/><path fill="none" marker-end="url(#mk-d2-949916255-3488378134)" d="M1082.5 412v131" class="connection stroke-B1 s0" mask="url(#d2-949916255)"/><marker id="mk-d2-949916255-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-949916255-2177206569)" d="M2602 442v164" class="connection" mask="url(#d2-949916255)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-949916255" width="3171" height="932" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h3171v932H-91z"/></mask></svg>