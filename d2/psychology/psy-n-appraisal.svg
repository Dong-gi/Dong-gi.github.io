<svg xmlns="http://www.w3.org/2000/svg" width="843" height="1568" class="d2-1464438067 d2-svg" viewBox="-89 -89 843 1568"><rect width="843" height="1568" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1464438067 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1464438067 .fill-N1{fill:#0a0f25}.d2-1464438067 .fill-B4{fill:#e3e9fd}.d2-1464438067 .fill-B5{fill:#edf0fd}.d2-1464438067 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="332" cy="86.5" class="shape stroke-B1" rx="224" ry="74.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="332" y="76" class="text-bold fill-N1 s0"><tspan x="332" dy="0">같은 사건</tspan><tspan x="332" dy="17.667">예 — 다음 주에 여러 사람 앞에서</tspan><tspan x="332" dy="17.667">발표를 해야 한다</tspan></text></g><g ><g class="shape"><path d="M12 231h641v190H12z" class="stroke-B1 fill-B4 s1"/></g><text x="332.5" y="264" class="fill-N1 s2"><tspan x="332.5" dy="0">1차 평가</tspan><tspan x="332.5" dy="32">이것이 나에게 무엇인가</tspan></text></g><g ><g class="shape"><path d="M62 491h540v222H62z" class="stroke-B1 fill-B4 s1"/></g><text x="332" y="524" class="fill-N1 s2"><tspan x="332" dy="0">2차 평가</tspan><tspan x="332" dy="32">내가 무엇을 할 수 있는가</tspan></text></g><g ><g class="shape"><path d="M13 783h639v440H13z" class="stroke-B1 fill-B4 s1"/></g><text x="332.5" y="816" class="fill-N1 s2">대처</text></g><text x="332" y="1309" class="fill-N1 s0"><tspan x="332" dy="0"> </tspan><tspan x="332" dy="17">이 그림의 요점 —</tspan><tspan x="332" dy="17">사건의 크기가 반응의 크기를 정하지 않는다.</tspan><tspan x="332" dy="17">그래서 ‘무엇이 스트레스를 주는가’ 는</tspan><tspan x="332" dy="17">사건 목록으로 답할 수 없는 물음이다</tspan></text><g ><g class="shape"><path d="M62 305h124v66H62z" class="stroke-B1 fill-B5 s1"/></g><text x="124" y="343.5" class="text-bold fill-N1 s0">무관하다</text></g><g ><g class="shape"><path d="M206 305h148v66H206z" class="stroke-B1 fill-B5 s1"/></g><text x="280" y="343.5" class="text-bold fill-N1 s0">좋은 일이다</text></g><g ><g class="shape"><path d="M374 305h229v66H374z" class="stroke-B1 fill-B5 s1"/></g><text x="488.5" y="343.5" class="text-bold fill-N1 s0">위협이거나 도전이다</text></g><g ><g class="shape"><path d="M112 565h246v98H112z" class="stroke-B1 fill-B5 s1"/></g><text x="235" y="603.5" class="text-bold fill-N1 s0"><tspan x="235" dy="0">쓸 수 있는 것이 있다 —</tspan><tspan x="235" dy="17.667">시간 · 준비 ·</tspan><tspan x="235" dy="17.667">도와줄 사람 · 해 본 경험</tspan></text></g><g ><g class="shape"><path d="M378 573h174v82H378z" class="stroke-B1 fill-B5 s1"/></g><text x="465" y="611.5" class="text-bold fill-N1 s0"><tspan x="465" dy="0">쓸 수 있는 것이</tspan><tspan x="465" dy="18.5">별로 없다</tspan></text></g><g ><g class="shape"><path d="M63 833h260v130H63z" class="stroke-B1 fill-B5 s1"/></g><text x="193" y="871.5" class="text-bold fill-N1 s0"><tspan x="193" dy="0">문제중심 —</tspan><tspan x="193" dy="17">상황 자체를 바꾸려 한다.</tspan><tspan x="193" dy="17">준비를 나눠 하고</tspan><tspan x="193" dy="17">자료를 구하고</tspan><tspan x="193" dy="17">도움을 청한다</tspan></text></g><g ><g class="shape"><path d="M343 833h259v130H343z" class="stroke-B1 fill-B5 s1"/></g><text x="472.5" y="871.5" class="text-bold fill-N1 s0"><tspan x="472.5" dy="0">정서중심 —</tspan><tspan x="472.5" dy="17">상황에 대한 내 반응 쪽을</tspan><tspan x="472.5" dy="17">다룬다. 달리 보기,</tspan><tspan x="472.5" dy="17">잠시 떼어 놓기,</tspan><tspan x="472.5" dy="17">이야기하기</tspan></text></g><g ><g class="shape"><path d="M170 1043h325v130H170z" class="stroke-B1 fill-B5 s1"/></g><text x="332.5" y="1081.5" class="text-bold fill-N1 s0"><tspan x="332.5" dy="0">어느 쪽이 낫다는</tspan><tspan x="332.5" dy="17">순서가 있는 것이 아니다.</tspan><tspan x="332.5" dy="17">바꿀 수 있는 상황에서는 앞쪽이,</tspan><tspan x="332.5" dy="17">바꿀 수 없는 상황에서는</tspan><tspan x="332.5" dy="17">뒤쪽이 대체로 맞는다</tspan></text></g><marker id="mk-d2-1464438067-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1464438067-3488378134)" d="M278.583 965v74" class="connection stroke-B1 s1" mask="url(#d2-1464438067)"/><path fill="none" marker-end="url(#mk-d2-1464438067-3488378134)" d="M386.916 965v74" class="connection stroke-B1 s1" mask="url(#d2-1464438067)"/><path fill="none" marker-end="url(#mk-d2-1464438067-3488378134)" d="m332.971 163-.914 64" class="connection stroke-B1 s1" mask="url(#d2-1464438067)"/><path fill="none" marker-end="url(#mk-d2-1464438067-3488378134)" d="M332.5 423v64" class="connection stroke-B1 s1" mask="url(#d2-1464438067)"/><path fill="none" marker-end="url(#mk-d2-1464438067-3488378134)" d="M332.5 715v64" class="connection stroke-B1 s1" mask="url(#d2-1464438067)"/><marker id="mk-d2-1464438067-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1464438067-2177206569)" d="M332.5 1225v64" class="connection" mask="url(#d2-1464438067)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1464438067" width="843" height="1568" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h843v1568H-89z"/></mask></svg>