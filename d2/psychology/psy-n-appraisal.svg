<svg xmlns="http://www.w3.org/2000/svg" width="4254" height="672" class="d2-1629403229 d2-svg" viewBox="-101 -85 4254 672"><rect width="4254" height="672" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1629403229 .fill-N1{fill:#0a0f25}.d2-1629403229 .fill-B4{fill:#e3e9fd}.d2-1629403229 .fill-B5{fill:#edf0fd}.d2-1629403229 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="331" cy="273.5" class="shape stroke-B1" rx="331" ry="110.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="331" y="271" class="text-bold fill-N1 s0"><tspan x="331" dy="0">같은 사건</tspan><tspan x="331" dy="18.5">예 — 다음 주에 여러 사람 앞에서 발표를 해야 한다</tspan></text></g><g ><g class="shape"><path d="M782 84h289v378H782z" class="stroke-B1 fill-B4 s1"/></g><text x="926.5" y="43" class="fill-N1 s2"><tspan x="926.5" dy="0">1차 평가</tspan><tspan x="926.5" dy="32">이것이 나에게 무엇인가</tspan></text></g><g ><g class="shape"><path d="M1211 84h602v252h-602z" class="stroke-B1 fill-B4 s1"/></g><text x="1512" y="43" class="fill-N1 s2"><tspan x="1512" dy="0">2차 평가</tspan><tspan x="1512" dy="32">내가 무엇을 할 수 있는가</tspan></text></g><g ><g class="shape"><path d="M1953 202h1338v284H1953z" class="stroke-B1 fill-B4 s1"/></g><text x="2622" y="189" class="fill-N1 s2">대처</text></g><text x="3731.5" y="334" class="fill-N1 s0"><tspan x="3731.5" dy="0"> </tspan><tspan x="3731.5" dy="17.667">이 그림의 요점 — 사건의 크기가 반응의 크기를 정하지 않는다.</tspan><tspan x="3731.5" dy="17.667">그래서 ‘무엇이 스트레스를 주는가’ 는 사건 목록으로 답할 수 없는 물음이다</tspan></text><g ><g class="shape"><path d="M865 114h124v66H865z" class="stroke-B1 fill-B5 s1"/></g><text x="927" y="152.5" class="text-bold fill-N1 s0">무관하다</text></g><g ><g class="shape"><path d="M853 240h148v66H853z" class="stroke-B1 fill-B5 s1"/></g><text x="927" y="278.5" class="text-bold fill-N1 s0">좋은 일이다</text></g><g ><g class="shape"><path d="M812 366h229v66H812z" class="stroke-B1 fill-B5 s1"/></g><text x="926.5" y="404.5" class="text-bold fill-N1 s0">위협이거나 도전이다</text></g><g ><g class="shape"><path d="M1241 114h542v66h-542z" class="stroke-B1 fill-B5 s1"/></g><text x="1512" y="152.5" class="text-bold fill-N1 s0">쓸 수 있는 것이 있다 — 시간 · 준비 · 도와줄 사람 · 해 본 경험</text></g><g ><g class="shape"><path d="M1381 240h262v66h-262z" class="stroke-B1 fill-B5 s1"/></g><text x="1512" y="278.5" class="text-bold fill-N1 s0">쓸 수 있는 것이 별로 없다</text></g><g ><g class="shape"><path d="M1983 232h447v82h-447z" class="stroke-B1 fill-B5 s1"/></g><text x="2206.5" y="270.5" class="text-bold fill-N1 s0"><tspan x="2206.5" dy="0">문제중심 — 상황 자체를 바꾸려 한다.</tspan><tspan x="2206.5" dy="18.5">준비를 나눠 하고 자료를 구하고 도움을 청한다</tspan></text></g><g ><g class="shape"><path d="M1994 374h426v82h-426z" class="stroke-B1 fill-B5 s1"/></g><text x="2207" y="412.5" class="text-bold fill-N1 s0"><tspan x="2207" dy="0">정서중심 — 상황에 대한 내 반응 쪽을 다룬다.</tspan><tspan x="2207" dy="18.5">달리 보기, 잠시 떼어 놓기, 이야기하기</tspan></text></g><g ><g class="shape"><path d="M2530 303h731v82h-731z" class="stroke-B1 fill-B5 s1"/></g><text x="2895.5" y="341.5" class="text-bold fill-N1 s0"><tspan x="2895.5" dy="0">어느 쪽이 낫다는 순서가 있는 것이 아니다.</tspan><tspan x="2895.5" dy="18.5">바꿀 수 있는 상황에서는 앞쪽이, 바꿀 수 없는 상황에서는 뒤쪽이 대체로 맞는다</tspan></text></g><marker id="mk-d2-1629403229-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1629403229-3488378134)" d="M2432 273c38 0 83.2 6 220.057 29.328" class="connection stroke-B1 s1" mask="url(#d2-1629403229)"/><path fill="none" marker-end="url(#mk-d2-1629403229-3488378134)" d="M2422.5 415c45.6 0 92.7-6 229.557-29.328" class="connection stroke-B1 s1" mask="url(#d2-1629403229)"/><path fill="none" marker-end="url(#mk-d2-1629403229-3488378134)" d="M664 273h114" class="connection stroke-B1 s1" mask="url(#d2-1629403229)"/><path fill="none" marker-end="url(#mk-d2-1629403229-3488378134)" d="M1073 273h134" class="connection stroke-B1 s1" mask="url(#d2-1629403229)"/><path fill="none" marker-end="url(#mk-d2-1629403229-3488378134)" d="M1815 273h134" class="connection stroke-B1 s1" mask="url(#d2-1629403229)"/><marker id="mk-d2-1629403229-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1629403229-2177206569)" d="M3293 344h114" class="connection" mask="url(#d2-1629403229)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1629403229" width="4254" height="672" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h4254v672H-101z"/></mask></svg>