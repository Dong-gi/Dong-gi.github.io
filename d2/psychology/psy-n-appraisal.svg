<svg xmlns="http://www.w3.org/2000/svg" width="1513" height="1604" class="d2-649007623 d2-svg" viewBox="-91 -101 1513 1604"><rect width="1513" height="1604" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.d2-649007623 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-649007623 .fill-N1{fill:#0a0f25}.d2-649007623 .fill-B4{fill:#e3e9fd}.d2-649007623 .fill-B5{fill:#edf0fd}.d2-649007623 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="581" cy="110.5" class="shape stroke-B1" rx="331" ry="110.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="581" y="108" class="text-bold fill-N1 s0"><tspan x="581" dy="0">같은 사건</tspan><tspan x="581" dy="18.5">예 — 다음 주에 여러 사람 앞에서 발표를 해야 한다</tspan></text></g><g ><g class="shape"><path d="M293 341h681v126H293z" class="stroke-B1 fill-B4 s1"/></g><text x="633.5" y="300" class="fill-N1 s2"><tspan x="633.5" dy="0">1차 평가</tspan><tspan x="633.5" dy="32">이것이 나에게 무엇인가</tspan></text></g><g ><g class="shape"><path d="M10 607h732v142H10z" class="stroke-B1 fill-B4 s1"/></g><text x="376" y="566" class="fill-N1 s2"><tspan x="376" dy="0">2차 평가</tspan><tspan x="376" dy="32">내가 무엇을 할 수 있는가</tspan></text></g><g ><g class="shape"><path d="M328 889h993v340H328z" class="stroke-B1 fill-B4 s1"/></g><text x="824.5" y="876" class="fill-N1 s2">대처</text></g><text x="829.5" y="1365" class="fill-N1 s0"><tspan x="829.5" dy="0"> </tspan><tspan x="829.5" dy="17.667">이 그림의 요점 — 사건의 크기가 반응의 크기를 정하지 않는다.</tspan><tspan x="829.5" dy="17.667">그래서 ‘무엇이 스트레스를 주는가’ 는 사건 목록으로 답할 수 없는 물음이다</tspan></text><g ><g class="shape"><path d="M323 371h124v66H323z" class="stroke-B1 fill-B5 s1"/></g><text x="385" y="409.5" class="text-bold fill-N1 s0">무관하다</text></g><g ><g class="shape"><path d="M507 371h148v66H507z" class="stroke-B1 fill-B5 s1"/></g><text x="581" y="409.5" class="text-bold fill-N1 s0">좋은 일이다</text></g><g ><g class="shape"><path d="M715 371h229v66H715z" class="stroke-B1 fill-B5 s1"/></g><text x="829.5" y="409.5" class="text-bold fill-N1 s0">위협이거나 도전이다</text></g><g ><g class="shape"><path d="M40 637h350v82H40z" class="stroke-B1 fill-B5 s1"/></g><text x="215" y="675.5" class="text-bold fill-N1 s0"><tspan x="215" dy="0">쓸 수 있는 것이 있다 —</tspan><tspan x="215" dy="18.5">시간 · 준비 · 도와줄 사람 · 해 본 경험</tspan></text></g><g ><g class="shape"><path d="M450 645h262v66H450z" class="stroke-B1 fill-B5 s1"/></g><text x="581" y="683.5" class="text-bold fill-N1 s0">쓸 수 있는 것이 별로 없다</text></g><g ><g class="shape"><path d="M358 919h447v82H358z" class="stroke-B1 fill-B5 s1"/></g><text x="581.5" y="957.5" class="text-bold fill-N1 s0"><tspan x="581.5" dy="0">문제중심 — 상황 자체를 바꾸려 한다.</tspan><tspan x="581.5" dy="18.5">준비를 나눠 하고 자료를 구하고 도움을 청한다</tspan></text></g><g ><g class="shape"><path d="M865 919h426v82H865z" class="stroke-B1 fill-B5 s1"/></g><text x="1078" y="957.5" class="text-bold fill-N1 s0"><tspan x="1078" dy="0">정서중심 — 상황에 대한 내 반응 쪽을 다룬다.</tspan><tspan x="1078" dy="18.5">달리 보기, 잠시 떼어 놓기, 이야기하기</tspan></text></g><g ><g class="shape"><path d="M606 1101h447v98H606z" class="stroke-B1 fill-B5 s1"/></g><text x="829.5" y="1139.5" class="text-bold fill-N1 s0"><tspan x="829.5" dy="0">어느 쪽이 낫다는 순서가 있는 것이 아니다.</tspan><tspan x="829.5" dy="17.667">바꿀 수 있는 상황에서는 앞쪽이,</tspan><tspan x="829.5" dy="17.667">바꿀 수 없는 상황에서는 뒤쪽이 대체로 맞는다</tspan></text></g><marker id="mk-d2-649007623-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-649007623-3488378134)" d="M581 1003c0 38 25 58 121.286 96.514" class="connection stroke-B1 s1" mask="url(#d2-649007623)"/><path fill="none" marker-end="url(#mk-d2-649007623-3488378134)" d="M1077.5 1003c0 38-25 58-121.286 96.514" class="connection stroke-B1 s1" mask="url(#d2-649007623)"/><path fill="none" marker-end="url(#mk-d2-649007623-3488378134)" d="M581 223v45" class="connection stroke-B1 s1" mask="url(#d2-649007623)"/><path fill="none" marker-end="url(#mk-d2-649007623-3488378134)" d="M581 469v134" class="connection stroke-B1 s1" mask="url(#d2-649007623)"/><path fill="none" marker-end="url(#mk-d2-649007623-3488378134)" d="M581 751v134" class="connection stroke-B1 s1" mask="url(#d2-649007623)"/><marker id="mk-d2-649007623-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-649007623-2177206569)" d="M829.25 1231v114" class="connection" mask="url(#d2-649007623)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-649007623" width="1513" height="1604" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1513v1604H-91z"/></mask></svg>