<svg xmlns="http://www.w3.org/2000/svg" width="1081" height="1354" class="d2-3743096905 d2-svg" viewBox="-101 -101 1081 1354"><rect width="1081" height="1354" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3743096905 .fill-N1{fill:#0a0f25}.d2-3743096905 .fill-B5{fill:#edf0fd}.d2-3743096905 .fill-B6{fill:#f7f8fe}.d2-3743096905 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h543v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="271.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="271.5" dy="0">들려주는 목록</tspan><tspan x="271.5" dy="17.667">침대 · 쉬다 · 깨다 · 피곤 · 꿈 · 밤 · 담요 · 졸다 · 하품 · 코골이 …</tspan><tspan x="271.5" dy="17.667">하나하나가 어떤 낱말과 강하게 이어져 있다</tspan></text></g><g ><g class="shape"><path d="M603 0h276v98H603z" class="stroke-B1 fill-B6 s0"/></g><text x="741" y="38.5" class="text-bold fill-N1 s1"><tspan x="741" dy="0">목록에 없는 낱말</tspan><tspan x="741" dy="17.667">‘잠’</tspan><tspan x="741" dy="17.667">이 낱말만 들려주지 않는다</tspan></text></g><g ><g class="shape"><path d="M280 198h452v98H280z" class="stroke-B1 fill-B6 s0"/></g><text x="506" y="236.5" class="text-bold fill-N1 s1"><tspan x="506" dy="0">검사</tspan><tspan x="506" dy="17.667">들은 낱말을 적게 하거나, 낱말을 하나씩 보이며</tspan><tspan x="506" dy="17.667">들었는지 아닌지를 답하게 한다</tspan></text></g><g ><g class="shape"><path d="M209 396h595v98H209z" class="stroke-B1 fill-B6 s0"/></g><text x="506.5" y="434.5" class="text-bold fill-N1 s1"><tspan x="506.5" dy="0">무엇이 나오나</tspan><tspan x="506.5" dy="17.667">‘잠’ 을 들었다고 보고하는 일이 자주 일어난다.</tspan><tspan x="506.5" dy="17.667">게다가 실제로 들은 낱말에 대한 확신과 비슷한 정도로 확신한다</tspan></text></g><g ><g class="shape"><path d="M196 614h620v538H196z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="506" y="601" class="fill-N1" style="text-anchor:middle;font-size:28px">이 절차가 좋은 소재인 이유</text></g><g ><g class="shape"><path d="M245 644h522v82H245z" class="stroke-B1 fill-B5 s0"/></g><text x="506" y="682.5" class="text-bold fill-N1 s1"><tspan x="506" dy="0">재현이 매우 잘 된다. 여러 연구실에서 되풀이해 나오고,</tspan><tspan x="506" dy="18.5">독자가 스스로 해 보아도 대개 나온다</tspan></text></g><g ><g class="shape"><path d="M280 826h452v98H280z" class="stroke-B1 fill-B5 s0"/></g><text x="506" y="864.5" class="text-bold fill-N1 s1"><tspan x="506" dy="0">기억이 녹화기가 아니라는 것을 한 번에 보인다.</tspan><tspan x="506" dy="17.667">들어온 낱말들의 공통된 뜻이 함께 활성화되고,</tspan><tspan x="506" dy="17.667">그 활성화가 ‘들었다’ 는 판단으로 이어진다</tspan></text></g><g ><g class="shape"><path d="M226 1024h560v98H226z" class="stroke-B1 fill-B5 s0"/></g><text x="506" y="1062.5" class="text-bold fill-N1 s1"><tspan x="506" dy="0">다만 여기서 실제 사건의 오기억으로 곧장 건너뛰면 안 된다.</tspan><tspan x="506" dy="17.667">낱말 목록과 겪은 사건은 다른 자료이고,</tspan><tspan x="506" dy="17.667">둘을 잇는 다리는 따로 놓아야 한다 — 네 물음의 넷째</tspan></text></g><marker id="mk-d2-3743096905-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3743096905-3488378134)" d="M271.5 100c0 38 23.8 58 115.312 96.45" class="connection stroke-B1 s0" mask="url(#d2-3743096905)"/><path fill="none" marker-end="url(#mk-d2-3743096905-3488378134)" d="M506.25 298v94" class="connection stroke-B1 s0" mask="url(#d2-3743096905)"/><marker id="mk-d2-3743096905-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3743096905-2177206569)" d="M741 100c0 38-23.8 58-115.312 96.45" class="connection" mask="url(#d2-3743096905)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><path fill="none" marker-end="url(#mk-d2-3743096905-3488378134)" d="M506.25 728v94" class="connection stroke-B1 s0" mask="url(#d2-3743096905)"/><path fill="none" marker-end="url(#mk-d2-3743096905-3488378134)" d="M506.25 926v94" class="connection stroke-B1 s0" mask="url(#d2-3743096905)"/><path fill="none" marker-end="url(#mk-d2-3743096905-3488378134)" d="M506.25 496v73" class="connection stroke-B1 s0" mask="url(#d2-3743096905)"/><mask id="d2-3743096905" width="1081" height="1354" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H980v1354H-101z"/></mask></svg>