<svg xmlns="http://www.w3.org/2000/svg" width="1165" height="950" class="d2-3415331691 d2-svg" viewBox="-101 -101 1165 950"><rect width="1165" height="950" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3415331691 .fill-N1{fill:#0a0f25}.d2-3415331691 .fill-N2{fill:#676c7e}.d2-3415331691 .fill-B6{fill:#f7f8fe}.d2-3415331691 .stroke-B1,.d2-3415331691 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h398v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="199" y="38.5" class="text-bold fill-N1 s1"><tspan x="199" dy="0">명목척도</tspan><tspan x="199" dy="17.667">예 — 전공, 이용한 교통수단</tspan><tspan x="199" dy="17.667">숫자는 이름표일 뿐이다</tspan></text></g><text x="659.5" y="16" class="fill-N1 s1"><tspan x="659.5" dy="0">할 수 있는 것 — 같다/다르다, 개수 세기, 최빈값</tspan><tspan x="659.5" dy="18.5">할 수 없는 것 — 크기 비교, 평균</tspan></text><g ><g class="shape"><path d="M0 168h398v244H0z" class="stroke-B1 fill-B6 s0"/></g><text x="199" y="271.5" class="text-bold fill-N1 s1"><tspan x="199" dy="0">서열척도</tspan><tspan x="199" dy="17.25">예 — 등수, 매우 그렇다에서</tspan><tspan x="199" dy="17.25">전혀 아니다까지의 다섯 칸</tspan><tspan x="199" dy="17.25">순서는 있고 간격은 뜻이 없다</tspan></text></g><path fill="transparent" stroke="transparent" d="M468 168h495v244H468z" class="shape s0"/><g ><g class="shape"><path d="M0 482h398v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="199" y="520.5" class="text-bold fill-N1 s1"><tspan x="199" dy="0">등간척도</tspan><tspan x="199" dy="17.667">예 — 섭씨 온도</tspan><tspan x="199" dy="17.667">간격은 뜻이 있고 0 은 임의로 정한 자리다</tspan></text></g><text x="646.5" y="498" class="fill-N1 s1"><tspan x="646.5" dy="0">할 수 있는 것 — 덧셈과 뺄셈, 평균, 표준편차</tspan><tspan x="646.5" dy="17.667">할 수 없는 것 — 비율로 말하기.</tspan><tspan x="646.5" dy="17.667">20 °C 는 10 °C 의 두 배로 덥지 않다</tspan></text><g ><g class="shape"><path d="M0 650h398v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="199" y="688.5" class="text-bold fill-N1 s1"><tspan x="199" dy="0">비율척도</tspan><tspan x="199" dy="17.667">예 — 반응 시간, 맞힌 문항 수</tspan><tspan x="199" dy="17.667">0 이 ‘없음’ 을 뜻한다</tspan></text></g><text x="594" y="666" class="fill-N1 s1"><tspan x="594" dy="0">할 수 있는 것 — 나눗셈까지.</tspan><tspan x="594" dy="18.5">‘두 배 빠르다’ 가 뜻을 갖는다</tspan></text><text x="678.5" y="214" class="fill-N1 s1"><tspan x="678.5" dy="0">할 수 있는 것 — 순서 비교, 중앙값, 순위 상관</tspan><tspan x="678.5" dy="17.667">할 수 없는 것 — 뺄셈. 1등과 2등의 차이가</tspan><tspan x="678.5" dy="17.667">2등과 3등의 차이와 같다는 보장이 없다</tspan></text><text x="715.5" y="297" class="fill-N1 s1"><tspan x="715.5" dy="0">심리학이 가장 자주 걸리는 자리 —</tspan><tspan x="715.5" dy="16.833">설문의 다섯 칸 척도는 서열인가 등간인가.</tspan><tspan x="715.5" dy="16.833">엄밀히는 서열이다. 실무에서는 문항을 여러 개 더해</tspan><tspan x="715.5" dy="16.833">등간처럼 다루는 일이 흔하고,</tspan><tspan x="715.5" dy="16.833">그 처리가 언제 괜찮은지는 지금도 논쟁 중이다.</tspan><tspan x="715.5" dy="16.833">이 문서는 어느 쪽도 정설로 적지 않는다</tspan></text><marker id="mk-d2-3415331691-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3415331691-2177206569)" d="M399.5 49h65" class="connection stroke-B2 s3" mask="url(#d2-3415331691)"/><path fill="none" marker-end="url(#mk-d2-3415331691-2177206569)" d="m399.483 264.24 101.05-13.221" class="connection stroke-B2 s3" mask="url(#d2-3415331691)"/><path fill="none" marker-end="url(#mk-d2-3415331691-2177206569)" d="M399.5 531h65" class="connection stroke-B2 s3" mask="url(#d2-3415331691)"/><path fill="none" marker-end="url(#mk-d2-3415331691-2177206569)" d="M399.5 699h65" class="connection stroke-B2 s3" mask="url(#d2-3415331691)"/><marker id="mk-d2-3415331691-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3415331691-3488378134)" d="M199 100v64" class="connection stroke-B1 s0" mask="url(#d2-3415331691)"/><text x="199" y="139" class="text-italic fill-N2 s1">할 수 있는 일이 늘어난다</text><path fill="none" marker-end="url(#mk-d2-3415331691-3488378134)" d="M199 414v64" class="connection stroke-B1 s0" mask="url(#d2-3415331691)"/><text x="199" y="453" class="text-italic fill-N2 s1">할 수 있는 일이 늘어난다</text><path fill="none" marker-end="url(#mk-d2-3415331691-3488378134)" d="M199 582v64" class="connection stroke-B1 s0" mask="url(#d2-3415331691)"/><text x="199" y="621" class="text-italic fill-N2 s1">할 수 있는 일이 늘어난다</text><path fill="none" marker-end="url(#mk-d2-3415331691-2177206569)" d="m399.494 305.658 95.018 7.526" class="connection stroke-B2 s3" mask="url(#d2-3415331691)"/><mask id="d2-3415331691" width="1165" height="950" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1165v950H-101z"/><path d="M94 123h210v21H94zM94 437h210v21H94zM94 605h210v21H94z"/></mask></svg>