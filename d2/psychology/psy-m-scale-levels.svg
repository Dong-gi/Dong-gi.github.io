<svg xmlns="http://www.w3.org/2000/svg" width="2112" height="1078" class="d2-1406309 d2-svg" viewBox="-101 -101 2112 1078"><rect width="2112" height="1078" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1406309 .fill-N1{fill:#0a0f25}.d2-1406309 .fill-N2{fill:#676c7e}.d2-1406309 .fill-B6{fill:#f7f8fe}.d2-1406309 .stroke-B1,.d2-1406309 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M529 0h274v98H529z" class="stroke-B1 fill-B6 s0"/></g><text x="666" y="38.5" class="text-bold fill-N1 s1"><tspan x="666" dy="0">명목척도</tspan><tspan x="666" dy="17.667">예 — 전공, 이용한 교통수단</tspan><tspan x="666" dy="17.667">숫자는 이름표일 뿐이다</tspan></text></g><text x="412.5" y="266" class="fill-N1 s1"><tspan x="412.5" dy="0">할 수 있는 것 — 같다/다르다, 개수 세기, 최빈값</tspan><tspan x="412.5" dy="18.5">할 수 없는 것 — 크기 비교, 평균</tspan></text><g ><g class="shape"><path d="M664 219h510v98H664z" class="stroke-B1 fill-B6 s0"/></g><text x="919" y="257.5" class="text-bold fill-N1 s1"><tspan x="919" dy="0">서열척도</tspan><tspan x="919" dy="17.667">예 — 등수, 매우 그렇다에서 전혀 아니다까지의 다섯 칸</tspan><tspan x="919" dy="17.667">순서는 있고 간격은 뜻이 없다</tspan></text></g><text x="330" y="485" class="fill-N1 s1"><tspan x="330" dy="0">할 수 있는 것 — 순서 비교, 중앙값, 순위 상관</tspan><tspan x="330" dy="18.5">할 수 없는 것 — 뺄셈. 1등과 2등의 차이가 2등과 3등의 차이와 같다는 보장이 없다</tspan></text><g ><g class="shape"><path d="M720 438h398v98H720z" class="stroke-B1 fill-B6 s0"/></g><text x="919" y="476.5" class="text-bold fill-N1 s1"><tspan x="919" dy="0">등간척도</tspan><tspan x="919" dy="17.667">예 — 섭씨 온도</tspan><tspan x="919" dy="17.667">간격은 뜻이 있고 0 은 임의로 정한 자리다</tspan></text></g><text x="689" y="704" class="fill-N1 s1"><tspan x="689" dy="0">할 수 있는 것 — 덧셈과 뺄셈, 평균, 표준편차</tspan><tspan x="689" dy="18.5">할 수 없는 것 — 비율로 말하기. 20 °C 는 10 °C 의 두 배로 덥지 않다</tspan></text><g ><g class="shape"><path d="M1008 657h281v98h-281z" class="stroke-B1 fill-B6 s0"/></g><text x="1148.5" y="695.5" class="text-bold fill-N1 s1"><tspan x="1148.5" dy="0">비율척도</tspan><tspan x="1148.5" dy="17.667">예 — 반응 시간, 맞힌 문항 수</tspan><tspan x="1148.5" dy="17.667">0 이 ‘없음’ 을 뜻한다</tspan></text></g><text x="1149" y="871" class="fill-N1 s1">할 수 있는 것 — 나눗셈까지. ‘두 배 빠르다’ 가 뜻을 갖는다</text><text x="1544" y="469" class="fill-N1 s1"><tspan x="1544" dy="0"> </tspan><tspan x="1544" dy="17.25">심리학이 가장 자주 걸리는 자리 — 설문의 다섯 칸 척도는 서열인가 등간인가.</tspan><tspan x="1544" dy="17.25">엄밀히는 서열이다. 실무에서는 문항을 여러 개 더해 등간처럼 다루는 일이 흔하고,</tspan><tspan x="1544" dy="17.25">그 처리가 언제 괜찮은지는 지금도 논쟁 중이다. 이 문서는 어느 쪽도 정설로 적지 않는다</tspan></text><marker id="mk-d2-1406309-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1406309-2177206569)" d="M550.666 98.299C440.5 146.3 412.5 176.7 412.5 245.5" class="connection stroke-B2 s3" mask="url(#d2-1406309)"/><path fill="none" marker-end="url(#mk-d2-1406309-2177206569)" d="M662.034 315.865C396.8 365.1 330 395.7 330 464.5" class="connection stroke-B2 s3" mask="url(#d2-1406309)"/><path fill="none" marker-end="url(#mk-d2-1406309-2177206569)" d="M814.447 536.366C714.65 584.3 689.25 614.7 689.25 683.5" class="connection stroke-B2 s3" mask="url(#d2-1406309)"/><path fill="none" marker-end="url(#mk-d2-1406309-2177206569)" d="M1148.75 757v94" class="connection stroke-B2 s3" mask="url(#d2-1406309)"/><marker id="mk-d2-1406309-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1406309-3488378134)" d="M780.834 98.299C891 146.3 919 170.7 919 215.5" class="connection stroke-B1 s0" mask="url(#d2-1406309)"/><text x="874" y="145" class="text-italic fill-N2 s1">할 수 있는 일이 늘어난다</text><path fill="none" marker-end="url(#mk-d2-1406309-3488378134)" d="M919 318.5v116" class="connection stroke-B1 s0" mask="url(#d2-1406309)"/><text x="919" y="383" class="text-italic fill-N2 s1">할 수 있는 일이 늘어난다</text><path fill="none" marker-end="url(#mk-d2-1406309-3488378134)" d="M1023.553 536.366C1123.35 584.3 1148.75 608.7 1148.75 653.5" class="connection stroke-B1 s0" mask="url(#d2-1406309)"/><text x="1110" y="584" class="text-italic fill-N2 s1">할 수 있는 일이 늘어난다</text><path fill="none" marker-end="url(#mk-d2-1406309-2177206569)" d="M1175.97 312.846C1470 364.5 1544 392.5 1544 448.5" class="connection stroke-B2 s3" mask="url(#d2-1406309)"/><mask id="d2-1406309" width="2112" height="1078" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2112V977H-101z"/><path d="M769 129h210v21H769zM814 367h210v21H814zM1005 568h210v21h-210z"/></mask></svg>