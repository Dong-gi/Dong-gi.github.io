<svg xmlns="http://www.w3.org/2000/svg" width="1526" height="1460" class="d2-1187450558 d2-svg" viewBox="-101 -101 1526 1460"><rect width="1526" height="1460" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1187450558 .fill-N1{fill:#0a0f25}.d2-1187450558 .fill-B5{fill:#edf0fd}.d2-1187450558 .fill-B6{fill:#f7f8fe}.d2-1187450558 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="86.5" cy="385" class="shape stroke-B1 fill-B6 s0" rx="86.5" ry="29"/></g><text x="86.5" y="390.5" class="text-bold fill-N1 s1">장기기억</text></g><g ><g class="shape"><path d="M282 91h376v82H282z" class="stroke-B1 fill-B6 s0"/></g><text x="470" y="129.5" class="text-bold fill-N1 s1"><tspan x="470" dy="0">서술기억</tspan><tspan x="470" dy="18.5">말로 꺼내 놓을 수 있다. ‘무엇’ 을 안다</tspan></text></g><g ><g class="shape"><path d="M273 601h393v82H273z" class="stroke-B1 fill-B6 s0"/></g><text x="469.5" y="639.5" class="text-bold fill-N1 s1"><tspan x="469.5" dy="0">비서술기억</tspan><tspan x="469.5" dy="18.5">말로 꺼내 놓기 어렵다. ‘어떻게’ 를 안다</tspan></text></g><g ><g class="shape"><path d="M838 0h415v98H838z" class="stroke-B1 fill-B6 s0"/></g><text x="1045.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1045.5" dy="0">일화기억</tspan><tspan x="1045.5" dy="17.667">내가 겪은 일. 언제 어디서가 함께 붙어 있다</tspan><tspan x="1045.5" dy="17.667">보기 — 지난주에 처음 이 길을 걸었던 일</tspan></text></g><g ><g class="shape"><path d="M864 158h363v114H864z" class="stroke-B1 fill-B6 s0"/></g><text x="1045.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="1045.5" dy="0">의미기억</tspan><tspan x="1045.5" dy="17.25">세상에 대한 앎.</tspan><tspan x="1045.5" dy="17.25">언제 배웠는지는 대개 붙어 있지 않다</tspan><tspan x="1045.5" dy="17.25">보기 — 물이 얼면 얼음이 된다는 것</tspan></text></g><g ><g class="shape"><path d="M853 332h385v114H853z" class="stroke-B1 fill-B6 s0"/></g><text x="1045.5" y="370.5" class="text-bold fill-N1 s1"><tspan x="1045.5" dy="0">절차기억</tspan><tspan x="1045.5" dy="17.25">몸으로 하는 일의 순서.</tspan><tspan x="1045.5" dy="17.25">설명하기 어렵고 해 보이기는 쉽다</tspan><tspan x="1045.5" dy="17.25">보기 — 자전거를 타는 일, 자판을 치는 일</tspan></text></g><g ><g class="shape"><path d="M839 506h412v114H839z" class="stroke-B1 fill-B6 s0"/></g><text x="1045" y="544.5" class="text-bold fill-N1 s1"><tspan x="1045" dy="0">점화</tspan><tspan x="1045" dy="17.25">먼저 만난 것 때문에 뒤의 처리가 빨라진다.</tspan><tspan x="1045" dy="17.25">본인은 그런 일이 있었다는 것을</tspan><tspan x="1045" dy="17.25">알아채지 못해도 나타난다</tspan></text></g><g ><g class="shape"><path d="M882 680h326v82H882z" class="stroke-B1 fill-B6 s0"/></g><text x="1045" y="718.5" class="text-bold fill-N1 s1"><tspan x="1045" dy="0">조건형성으로 붙은 것</tspan><tspan x="1045" dy="18.5">7장의 조건반응이 여기 들어온다</tspan></text></g><g ><g class="shape"><path d="M766 822h558v436H766z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1045" y="855" class="fill-N1" style="text-anchor:middle;font-size:28px">이 갈림을 세운 근거</text></g><g ><g class="shape"><path d="M826 882h438v130H826z" class="stroke-B1 fill-B5 s0"/></g><text x="1045" y="920.5" class="text-bold fill-N1 s1"><tspan x="1045" dy="0">뇌의 특정 부위가 손상된 사람에게서</tspan><tspan x="1045" dy="17">두 갈래가 ‘따로’ 무너진다.</tspan><tspan x="1045" dy="17">새로 겪은 일을 말로 꺼내지 못하게 된 사람이</tspan><tspan x="1045" dy="17">같은 기술을 날마다 연습하면 성적이 오른다 —</tspan><tspan x="1045" dy="17">연습했다는 사실 자체는 기억하지 못하면서</tspan></text></g><g ><g class="shape"><path d="M826 1052h438v146H826z" class="stroke-B1 fill-B5 s0"/></g><text x="1045" y="1090.5" class="text-bold fill-N1 s1"><tspan x="1045" dy="0">다만 이런 사례는 수가 적고</tspan><tspan x="1045" dy="16.833">한 사람마다 손상 부위가 다르다.</tspan><tspan x="1045" dy="16.833">사례가 보이는 것은</tspan><tspan x="1045" dy="16.833">‘두 갈래가 갈린다’ 까지이고,</tspan><tspan x="1045" dy="16.833">어느 부위가 무엇을 한다는</tspan><tspan x="1045" dy="16.833">결론은 사례만으로 나오지 않는다</tspan></text></g><marker id="mk-d2-1187450558-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1187450558-3488378134)" d="M102.95 354.24C198.8 176.8 234.7 132 277.5 132" class="connection stroke-B1 s0" mask="url(#d2-1187450558)"/><path fill="none" marker-end="url(#mk-d2-1187450558-3488378134)" d="M102.938 415.767C198.8 596.4 233 642 269 642" class="connection stroke-B1 s0" mask="url(#d2-1187450558)"/><path fill="none" marker-end="url(#mk-d2-1187450558-3488378134)" d="M592.896 90.363C691 57.4 740.3 49 833.5 49" class="connection stroke-B1 s0" mask="url(#d2-1187450558)"/><path fill="none" marker-end="url(#mk-d2-1187450558-3488378134)" d="M592.896 173.637C691 206.6 745.5 215 859.5 215" class="connection stroke-B1 s0" mask="url(#d2-1187450558)"/><path fill="none" marker-end="url(#mk-d2-1187450558-3488378134)" d="M510.397 599.569C674.6 431.4 743.3 389 848.5 389" class="connection stroke-B1 s0" mask="url(#d2-1187450558)"/><path fill="none" marker-end="url(#mk-d2-1187450558-3488378134)" d="M598.905 600.392C692.2 570.6 740.6 563 835 563" class="connection stroke-B1 s0" mask="url(#d2-1187450558)"/><path fill="none" marker-end="url(#mk-d2-1187450558-3488378134)" d="M598.905 683.608C692.2 713.4 749.2 721 878 721" class="connection stroke-B1 s0" mask="url(#d2-1187450558)"/><path fill="none" marker-end="url(#mk-d2-1187450558-3488378134)" d="M1045 1014v34" class="connection stroke-B1 s0" mask="url(#d2-1187450558)"/><marker id="mk-d2-1187450558-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1187450558-2177206569)" d="M496.053 684.7C671.8 968.6 726 1040 762 1040" class="connection" mask="url(#d2-1187450558)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-11874