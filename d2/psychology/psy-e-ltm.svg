<svg xmlns="http://www.w3.org/2000/svg" width="3484" height="934" class="d2-2833344662 d2-svg" viewBox="-101 -101 3484 934"><rect width="3484" height="934" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2833344662 .fill-N1{fill:#0a0f25}.d2-2833344662 .fill-B5{fill:#edf0fd}.d2-2833344662 .fill-B6{fill:#f7f8fe}.d2-2833344662 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="1307.5" cy="29" class="shape stroke-B1 fill-B6 s0" rx="86.5" ry="29"/></g><text x="1307.5" y="34.5" class="text-bold fill-N1 s1">장기기억</text></g><g ><g class="shape"><path d="M278 158h376v82H278z" class="stroke-B1 fill-B6 s0"/></g><text x="466" y="196.5" class="text-bold fill-N1 s1"><tspan x="466" dy="0">서술기억</tspan><tspan x="466" dy="18.5">말로 꺼내 놓을 수 있다. ‘무엇’ 을 안다</tspan></text></g><g ><g class="shape"><path d="M1961 158h393v82h-393z" class="stroke-B1 fill-B6 s0"/></g><text x="2157.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="2157.5" dy="0">비서술기억</tspan><tspan x="2157.5" dy="18.5">말로 꺼내 놓기 어렵다. ‘어떻게’ 를 안다</tspan></text></g><g ><g class="shape"><path d="M0 398h415v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="207.5" y="436.5" class="text-bold fill-N1 s1"><tspan x="207.5" dy="0">일화기억</tspan><tspan x="207.5" dy="17.667">내가 겪은 일. 언제 어디서가 함께 붙어 있다</tspan><tspan x="207.5" dy="17.667">보기 — 지난주에 처음 이 길을 걸었던 일</tspan></text></g><g ><g class="shape"><path d="M475 398h499v98H475z" class="stroke-B1 fill-B6 s0"/></g><text x="724.5" y="436.5" class="text-bold fill-N1 s1"><tspan x="724.5" dy="0">의미기억</tspan><tspan x="724.5" dy="17.667">세상에 대한 앎. 언제 배웠는지는 대개 붙어 있지 않다</tspan><tspan x="724.5" dy="17.667">보기 — 물이 얼면 얼음이 된다는 것</tspan></text></g><g ><g class="shape"><path d="M1034 398h539v98h-539z" class="stroke-B1 fill-B6 s0"/></g><text x="1303.5" y="436.5" class="text-bold fill-N1 s1"><tspan x="1303.5" dy="0">절차기억</tspan><tspan x="1303.5" dy="17.667">몸으로 하는 일의 순서. 설명하기 어렵고 해 보이기는 쉽다</tspan><tspan x="1303.5" dy="17.667">보기 — 자전거를 타는 일, 자판을 치는 일</tspan></text></g><g ><g class="shape"><path d="M1633 398h551v98h-551z" class="stroke-B1 fill-B6 s0"/></g><text x="1908.5" y="436.5" class="text-bold fill-N1 s1"><tspan x="1908.5" dy="0">점화</tspan><tspan x="1908.5" dy="17.667">먼저 만난 것 때문에 뒤의 처리가 빨라진다.</tspan><tspan x="1908.5" dy="17.667">본인은 그런 일이 있었다는 것을 알아채지 못해도 나타난다</tspan></text></g><g ><g class="shape"><path d="M2244 406h326v82h-326z" class="stroke-B1 fill-B6 s0"/></g><text x="2407" y="444.5" class="text-bold fill-N1 s1"><tspan x="2407" dy="0">조건형성으로 붙은 것</tspan><tspan x="2407" dy="18.5">7장의 조건반응이 여기 들어온다</tspan></text></g><g ><g class="shape"><path d="M2620 360h662v372h-662z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="2951" y="347" class="fill-N1" style="text-anchor:middle;font-size:28px">이 갈림을 세운 근거</text></g><g ><g class="shape"><path d="M2650 390h602v114h-602z" class="stroke-B1 fill-B5 s0"/></g><text x="2951" y="428.5" class="text-bold fill-N1 s1"><tspan x="2951" dy="0">뇌의 특정 부위가 손상된 사람에게서 두 갈래가 ‘따로’ 무너진다.</tspan><tspan x="2951" dy="17.25">새로 겪은 일을 말로 꺼내지 못하게 된 사람이</tspan><tspan x="2951" dy="17.25">같은 기술을 날마다 연습하면 성적이 오른다 —</tspan><tspan x="2951" dy="17.25">연습했다는 사실 자체는 기억하지 못하면서</tspan></text></g><g ><g class="shape"><path d="M2665 604h572v98h-572z" class="stroke-B1 fill-B5 s0"/></g><text x="2951" y="642.5" class="text-bold fill-N1 s1"><tspan x="2951" dy="0">다만 이런 사례는 수가 적고 한 사람마다 손상 부위가 다르다.</tspan><tspan x="2951" dy="17.667">사례가 보이는 것은 ‘두 갈래가 갈린다’ 까지이고,</tspan><tspan x="2951" dy="17.667">어느 부위가 무엇을 한다는 결론은 사례만으로 나오지 않는다</tspan></text></g><marker id="mk-d2-2833344662-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2833344662-3488378134)" d="M1222.009 37.187C617.6 93.8 466 118 466 154" class="connection stroke-B1 s0" mask="url(#d2-2833344662)"/><path fill="none" marker-end="url(#mk-d2-2833344662-3488378134)" d="M1392.991 37.184C2004.4 93.8 2157.75 118 2157.75 154" class="connection stroke-B1 s0" mask="url(#d2-2833344662)"/><path fill="none" marker-end="url(#mk-d2-2833344662-3488378134)" d="M347.614 240.664C235.899 280 207.5 351.6 207.5 394" class="connection stroke-B1 s0" mask="url(#d2-2833344662)"/><path fill="none" marker-end="url(#mk-d2-2833344662-3488378134)" d="M584.386 240.664C696.1 280 724.5 351.6 724.5 394" class="connection stroke-B1 s0" mask="url(#d2-2833344662)"/><path fill="none" marker-end="url(#mk-d2-2833344662-3488378134)" d="M1959.511 220.212C1435.1 276 1303.5 351.6 1303.5 394" class="connection stroke-B1 s0" mask="url(#d2-2833344662)"/><path fill="none" marker-end="url(#mk-d2-2833344662-3488378134)" d="M2043.621 240.686C1935.9 280 1908.5 351.6 1908.5 394" class="connection stroke-B1 s0" mask="url(#d2-2833344662)"/><path fill="none" marker-end="url(#mk-d2-2833344662-3488378134)" d="M2271.879 240.686C2379.6 280 2407 353.2 2407 402" class="connection stroke-B1 s0" mask="url(#d2-2833344662)"/><path fill="none" marker-end="url(#mk-d2-2833344662-3488378134)" d="M2951 506v94" class="connection stroke-B1 s0" mask="url(#d2-2833344662)"/><marker id="mk-d2-2833344662-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2833344662-2177206569)" d="M2356.237 221.77C2831.65 276.308 2951 295.8 2951 315" class="connection" mask="url(#d2-2833344662)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-2833344662" width="3484" height="934" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3484v934H-101z"/></mask></svg>