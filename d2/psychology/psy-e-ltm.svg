<svg xmlns="http://www.w3.org/2000/svg" width="1231" height="1532" class="d2-841001616 d2-svg" viewBox="-89 -89 1231 1532"><rect width="1231" height="1532" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-841001616 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-841001616 .fill-N1{fill:#0a0f25}.d2-841001616 .fill-B5{fill:#edf0fd}.d2-841001616 .fill-B6{fill:#f7f8fe}.d2-841001616 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="98.5" cy="393" class="shape stroke-B1 fill-B6 s0" rx="86.5" ry="40"/></g><text x="98.5" y="398.5" class="text-bold fill-N1 s1">장기기억</text></g><g ><g class="shape"><path d="M265 106h243v98H265z" class="stroke-B1 fill-B6 s0"/></g><text x="386.5" y="144.5" class="text-bold fill-N1 s1"><tspan x="386.5" dy="0">서술기억</tspan><tspan x="386.5" dy="17.667">말로 꺼내 놓을 수 있다.</tspan><tspan x="386.5" dy="17.667">‘무엇’ 을 안다</tspan></text></g><g ><g class="shape"><path d="M267 558h240v160H267z" class="stroke-B1 fill-B6 s0"/></g><text x="387" y="627.5" class="text-bold fill-N1 s1"><tspan x="387" dy="0">비서술기억</tspan><tspan x="387" dy="17.667">말로 꺼내 놓기 어렵다.</tspan><tspan x="387" dy="17.667">‘어떻게’ 를 안다</tspan></text></g><g ><g class="shape"><path d="M638 12h299v130H638z" class="stroke-B1 fill-B6 s0"/></g><text x="787.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="787.5" dy="0">일화기억</tspan><tspan x="787.5" dy="17">내가 겪은 일.</tspan><tspan x="787.5" dy="17">언제 어디서가 함께 붙어 있다</tspan><tspan x="787.5" dy="17">보기 — 지난주에 처음</tspan><tspan x="787.5" dy="17">이 길을 걸었던 일</tspan></text></g><g ><g class="shape"><path d="M638 162h215v146H638z" class="stroke-B1 fill-B6 s0"/></g><text x="745.5" y="200.5" class="text-bold fill-N1 s1"><tspan x="745.5" dy="0">의미기억</tspan><tspan x="745.5" dy="16.833">세상에 대한 앎.</tspan><tspan x="745.5" dy="16.833">언제 배웠는지는</tspan><tspan x="745.5" dy="16.833">대개 붙어 있지 않다</tspan><tspan x="745.5" dy="16.833">보기 — 물이 얼면</tspan><tspan x="745.5" dy="16.833">얼음이 된다는 것</tspan></text></g><g ><g class="shape"><path d="M638 328h255v146H638z" class="stroke-B1 fill-B6 s0"/></g><text x="765.5" y="366.5" class="text-bold fill-N1 s1"><tspan x="765.5" dy="0">절차기억</tspan><tspan x="765.5" dy="16.833">몸으로 하는 일의 순서.</tspan><tspan x="765.5" dy="16.833">설명하기 어렵고</tspan><tspan x="765.5" dy="16.833">해 보이기는 쉽다</tspan><tspan x="765.5" dy="16.833">보기 — 자전거를 타는 일,</tspan><tspan x="765.5" dy="16.833">자판을 치는 일</tspan></text></g><g ><g class="shape"><path d="M638 494h272v146H638z" class="stroke-B1 fill-B6 s0"/></g><text x="774" y="532.5" class="text-bold fill-N1 s1"><tspan x="774" dy="0">점화</tspan><tspan x="774" dy="16.833">먼저 만난 것 때문에</tspan><tspan x="774" dy="16.833">뒤의 처리가 빨라진다.</tspan><tspan x="774" dy="16.833">본인은 그런 일이</tspan><tspan x="774" dy="16.833">있었다는 것을</tspan><tspan x="774" dy="16.833">알아채지 못해도 나타난다</tspan></text></g><g ><g class="shape"><path d="M638 660h232v98H638z" class="stroke-B1 fill-B6 s0"/></g><text x="754" y="698.5" class="text-bold fill-N1 s1"><tspan x="754" dy="0">조건형성으로 붙은 것</tspan><tspan x="754" dy="17.667">7장의 조건반응이</tspan><tspan x="754" dy="17.667">여기 들어온다</tspan></text></g><g ><g class="shape"><path d="M638 778h403v564H638z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="839.5" y="811" class="fill-N1" style="text-anchor:middle;font-size:28px">이 갈림을 세운 근거</text></g><g ><g class="shape"><path d="M698 838h283v210H698z" class="stroke-B1 fill-B5 s0"/></g><text x="839.5" y="876.5" class="text-bold fill-N1 s1"><tspan x="839.5" dy="0">뇌의 특정 부위가</tspan><tspan x="839.5" dy="16.5">손상된 사람에게서</tspan><tspan x="839.5" dy="16.5">두 갈래가 ‘따로’ 무너진다.</tspan><tspan x="839.5" dy="16.5">새로 겪은 일을 말로</tspan><tspan x="839.5" dy="16.5">꺼내지 못하게 된</tspan><tspan x="839.5" dy="16.5">사람이 같은 기술을</tspan><tspan x="839.5" dy="16.5">날마다 연습하면</tspan><tspan x="839.5" dy="16.5">성적이 오른다 —</tspan><tspan x="839.5" dy="16.5">연습했다는 사실 자체는</tspan><tspan x="839.5" dy="16.5">기억하지 못하면서</tspan></text></g><g ><g class="shape"><path d="M698 1088h283v194H698z" class="stroke-B1 fill-B5 s0"/></g><text x="839.5" y="1126.5" class="text-bold fill-N1 s1"><tspan x="839.5" dy="0">다만 이런 사례는</tspan><tspan x="839.5" dy="16.556">수가 적고 한 사람마다</tspan><tspan x="839.5" dy="16.556">손상 부위가 다르다.</tspan><tspan x="839.5" dy="16.556">사례가 보이는 것은</tspan><tspan x="839.5" dy="16.556">‘두 갈래가 갈린다’</tspan><tspan x="839.5" dy="16.556">까지이고, 어느 부위가</tspan><tspan x="839.5" dy="16.556">무엇을 한다는</tspan><tspan x="839.5" dy="16.556">결론은 사례만으로</tspan><tspan x="839.5" dy="16.556">나오지 않는다</tspan></text></g><marker id="mk-d2-841001616-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-841001616-3488378134)" d="m182 379.993 33-.123s10-.037 10-10.037V165.999s0-10 10-10h26" class="connection stroke-B1 s0" mask="url(#d2-841001616)"/><path fill="none" marker-end="url(#mk-d2-841001616-3488378134)" d="m182 406.978 33-.368s10-.111 10 9.889V628s0 10 10 10h28" class="connection stroke-B1 s0" mask="url(#d2-841001616)"/><path fill="none" marker-end="url(#mk-d2-841001616-3488378134)" d="M510 139.666h28s10 0 10-10V87s0-10 10-10h76" class="connection stroke-B1 s0" mask="url(#d2-841001616)"/><path fill="none" marker-end="url(#mk-d2-841001616-3488378134)" d="M510 172.333h28s10 0 10 10V225s0 10 10 10h76" class="connection stroke-B1 s0" mask="url(#d2-841001616)"/><path fill="none" marker-end="url(#mk-d2-841001616-3488378134)" d="M509 590h29s10 0 10-10V411s0-10 10-10h76" class="connection stroke-B1 s0" mask="url(#d2-841001616)"/><path fill="none" marker-end="url(#mk-d2-841001616-3488378134)" d="M509 622h79s10 0 10-10v-35s0-10 10-10h26" class="connection stroke-B1 s0" mask="url(#d2-841001616)"/><path fill="none" marker-end="url(#mk-d2-841001616-3488378134)" d="M509 654h79s10 0 10 10v35s0 10 10 10h26" class="connection stroke-B1 s0" mask="url(#d2-841001616)"/><path fill="none" marker-end="url(#mk-d2-841001616-3488378134)" d="M839.5 1050v34" class="connection stroke-B1 s0" mask="url(#d2-841001616)"/><marker id="mk-d2-841001616-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-841001616-2177206569)" d="M509 686h29s10 0 10 10v354s0 10 10 10h76" class="connection" mask="url(#d2-841001616)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-841001616" width="1231" height="1532" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1231v1532H-89z"/></mask></svg>