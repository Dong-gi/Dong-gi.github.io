<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1637" class="d2-1486580076 d2-svg" viewBox="-89 -89 1350 1637"><rect width="1350" height="1637" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1486580076 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1486580076 .fill-N1{fill:#0a0f25}.d2-1486580076 .fill-B4{fill:#e3e9fd}.d2-1486580076 .fill-B5{fill:#edf0fd}.d2-1486580076 .fill-B6{fill:#f7f8fe}.d2-1486580076 .stroke-B1,.d2-1486580076 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="586" cy="96" class="shape stroke-B1 fill-B6 s0" rx="252" ry="84"/></g><text x="586" y="77.5" class="text-bold fill-N1 s1"><tspan x="586" dy="0">정설 — 심리치료는 효과가 있다</tspan><tspan x="586" dy="17.25">무처치나 대기자와 견준</tspan><tspan x="586" dy="17.25">무선배정 시험이 많고,</tspan><tspan x="586" dy="17.25">종합에서 이득이 되풀이 보고되었다</tspan></text></g><g ><g class="shape"><ellipse cx="585.5" cy="303" class="shape stroke-B1 fill-B6 s0" rx="159.5" ry="53"/></g><text x="585.5" y="300.5" class="text-bold fill-N1 s1"><tspan x="585.5" dy="0">미결 — 그러면 무엇이</tspan><tspan x="585.5" dy="18.5">그 효과를 내는가</tspan></text></g><g ><g class="shape"><path d="M12 460h564v450H12z" class="stroke-B1 fill-B4 s0"/></g><text x="294" y="493" class="fill-N1 s2">공통요인 쪽</text></g><g ><g class="shape"><path d="M596 436h564v498H596z" class="stroke-B1 fill-B4 s0"/></g><text x="878" y="469" class="fill-N1 s2">특정성분 쪽</text></g><g ><g class="shape"><path d="M56 1014h1059v278H56z" class="stroke-B1 fill-B4 s0"/></g><text x="585.5" y="1047" class="fill-N1 s2">이른바 도도새 판결</text></g><text x="586" y="1378" class="fill-N1 s1"><tspan x="586" dy="0"> </tspan><tspan x="586" dy="17">이 문서가 적는 방식 —</tspan><tspan x="586" dy="17">‘효과가 있다’ 는 그냥 적고,</tspan><tspan x="586" dy="17">‘무엇 때문인가’ 는 입장을 나란히 놓는다.</tspan><tspan x="586" dy="17">저자가 고르지 않는다</tspan></text><g ><g class="shape"><path d="M52 506h232v146H52z" class="stroke-B1 fill-B5 s0"/></g><text x="168" y="560.5" class="text-bold fill-N1 s1"><tspan x="168" dy="0">주장 — 계열이 달라도</tspan><tspan x="168" dy="17.25">함께 들어 있는</tspan><tspan x="168" dy="17.25">것들이 효과의</tspan><tspan x="168" dy="17.25">큰 몫을 낸다</tspan></text></g><g ><g class="shape"><path d="M324 506h212v146H324z" class="stroke-B1 fill-B5 s0"/></g><text x="430" y="544.5" class="text-bold fill-N1 s1"><tspan x="430" dy="0">후보 — 치료 동맹,</tspan><tspan x="430" dy="16.833">나아질 것이라는</tspan><tspan x="430" dy="16.833">기대, 무슨 일이</tspan><tspan x="430" dy="16.833">왜 일어나는지</tspan><tspan x="430" dy="16.833">설명해 주는 틀,</tspan><tspan x="430" dy="16.833">치료자 개인의 차이</tspan></text></g><g ><g class="shape"><path d="M52 692h232v178H52z" class="stroke-B1 fill-B5 s0"/></g><text x="168" y="746.5" class="text-bold fill-N1 s1"><tspan x="168" dy="0">근거 — 계열끼리</tspan><tspan x="168" dy="16.833">견준 시험에서</tspan><tspan x="168" dy="16.833">차이가 대체로 작다.</tspan><tspan x="168" dy="16.833">그리고 동맹의 질이</tspan><tspan x="168" dy="16.833">결과와 관련된다는</tspan><tspan x="168" dy="16.833">보고가 되풀이 나왔다</tspan></text></g><g ><g class="shape"><path d="M324 692h212v178H324z" class="stroke-B1 fill-B5 s0"/></g><text x="430" y="730.5" class="text-bold fill-N1 s1"><tspan x="430" dy="0">약한 자리 —</tspan><tspan x="430" dy="16.625">동맹과 결과의</tspan><tspan x="430" dy="16.625">관계는 대부분</tspan><tspan x="430" dy="16.625">상관이다.</tspan><tspan x="430" dy="16.625">좋아지고 있어서</tspan><tspan x="430" dy="16.625">동맹이 좋아졌을</tspan><tspan x="430" dy="16.625">수도 있다. 방향이</tspan><tspan x="430" dy="16.625">확인되지 않았다</tspan></text></g><g ><g class="shape"><path d="M636 482h212v178H636z" class="stroke-B1 fill-B5 s0"/></g><text x="742" y="552.5" class="text-bold fill-N1 s1"><tspan x="742" dy="0">주장 —</tspan><tspan x="742" dy="17.25">어떤 문제에는</tspan><tspan x="742" dy="17.25">특정한 절차가</tspan><tspan x="742" dy="17.25">실제로 더 낫다</tspan></text></g><g ><g class="shape"><path d="M888 482h232v178H888z" class="stroke-B1 fill-B5 s0"/></g><text x="1004" y="520.5" class="text-bold fill-N1 s1"><tspan x="1004" dy="0">근거 — 성분을 빼고</tspan><tspan x="1004" dy="16.625">나머지를 그대로</tspan><tspan x="1004" dy="16.625">두는 해체 설계에서</tspan><tspan x="1004" dy="16.625">결과가 달라지는</tspan><tspan x="1004" dy="16.625">경우가 있고,</tspan><tspan x="1004" dy="16.625">어떤 비교 시험에서는</tspan><tspan x="1004" dy="16.625">계열 사이에</tspan><tspan x="1004" dy="16.625">차이가 나온다</tspan></text></g><g ><g class="shape"><path d="M636 700h212v194H636z" class="stroke-B1 fill-B5 s0"/></g><text x="742" y="738.5" class="text-bold fill-N1 s1"><tspan x="742" dy="0">약한 자리 —</tspan><tspan x="742" dy="16.556">해체 설계는 표본이</tspan><tspan x="742" dy="16.556">커야 하는데</tspan><tspan x="742" dy="16.556">실제로는 작다.</tspan><tspan x="742" dy="16.556">작은 차이를 잡을</tspan><tspan x="742" dy="16.556">검정력이 모자라면</tspan><tspan x="742" dy="16.556">‘차이가 없다’ 가</tspan><tspan x="742" dy="16.556">아니라</tspan><tspan x="742" dy="16.556">‘못 잡았다’ 이다</tspan></text></g><g ><g class="shape"><path d="M106 1064h270v178H106z" class="stroke-B1 fill-B5 s0"/></g><text x="241" y="1102.5" class="text-bold fill-N1 s1"><tspan x="241" dy="0">이름의 유래 — 동화에서</tspan><tspan x="241" dy="16.625">도도새가 경주를 끝내며</tspan><tspan x="241" dy="16.625">‘모두가 이겼고</tspan><tspan x="241" dy="16.625">모두 상을 받아야 한다’ 고</tspan><tspan x="241" dy="16.625">말한다.</tspan><tspan x="241" dy="16.625">계열끼리 견주면</tspan><tspan x="241" dy="16.625">승자가 없다는 관찰에</tspan><tspan x="241" dy="16.625">이 이름이 붙었다</tspan></text></g><g ><g class="shape"><path d="M426 1064h293v178H426z" class="stroke-B1 fill-B5 s0"/></g><text x="572.5" y="1118.5" class="text-bold fill-N1 s1"><tspan x="572.5" dy="0">정확한 지위 —</tspan><tspan x="572.5" dy="16.833">‘모두 같다’ 가 아니다.</tspan><tspan x="572.5" dy="16.833">‘차이가 있어도 대체로 작고,</tspan><tspan x="572.5" dy="16.833">있는 차이가</tspan><tspan x="572.5" dy="16.833">설계와 얽혀 있다’ 가</tspan><tspan x="572.5" dy="16.833">자료에 맞는 요약이다</tspan></text></g><g ><g class="shape"><path d="M769 1064h296v178H769z" class="stroke-B1 fill-B5 s0"/></g><text x="917" y="1102.5" class="text-bold fill-N1 s1"><tspan x="917" dy="0">얽힌 것 하나 —</tspan><tspan x="917" dy="16.625">연구자 충성도.</tspan><tspan x="917" dy="16.625">비교 시험의 결과가</tspan><tspan x="917" dy="16.625">연구자가 어느 계열에</tspan><tspan x="917" dy="16.625">속하는가와 관련된다는</tspan><tspan x="917" dy="16.625">보고가 되풀이 나왔다.</tspan><tspan x="917" dy="16.625">4장의 실험자 기대가</tspan><tspan x="917" dy="16.625">시험 수준에서 나타난 것이다</tspan></text></g><marker id="mk-d2-1486580076-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="M586 182v64" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="M286 579h34" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="M333.415 653.22 286.17 689.56" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="M286 781h34" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="M850 571h34" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="m899.49 661.31-48.47 42.068" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="m532.997 355-.158 101" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="m639.004 355 .154 77" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="M378 1153h45" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="M721.5 1153h44" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><marker id="mk-d2-1486580076-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1486580076-2177206569)" d="M409.5 912v98" class="connection stroke-B2 s4" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-2177206569)" d="M762.5 936v74" class="connection stroke-B2 s4" mask="url(#d2-1486580076)"/><path fill="none" marker-end="url(#mk-d2-1486580076-3488378134)" d="M586 1294v64" class="connection stroke-B1 s0" mask="url(#d2-1486580076)"/><mask id="d2-1486580076" width="1350" height="1637" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1350v1637H-89z"/></mask></svg>