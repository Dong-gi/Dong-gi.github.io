<svg xmlns="http://www.w3.org/2000/svg" width="1732" height="2518" class="d2-271489055 d2-svg" viewBox="-91 -101 1732 2518"><rect width="1732" height="2518" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-271489055 .fill-N1{fill:#0a0f25}.d2-271489055 .fill-B4{fill:#e3e9fd}.d2-271489055 .fill-B5{fill:#edf0fd}.d2-271489055 .fill-B6{fill:#f7f8fe}.d2-271489055 .stroke-B1,.d2-271489055 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="753" cy="180.5" class="shape stroke-B1 fill-B6 s0" rx="541" ry="180.5"/></g><text x="753" y="178" class="text-bold fill-N1 s1"><tspan x="753" dy="0">정설 — 심리치료는 효과가 있다</tspan><tspan x="753" dy="18.5">무처치나 대기자와 견준 무선배정 시험이 많고, 종합에서 이득이 되풀이 보고되었다</tspan></text></g><g ><g class="shape"><ellipse cx="752.5" cy="550" class="shape stroke-B1 fill-B6 s0" rx="266.5" ry="89"/></g><text x="752.5" y="555.5" class="text-bold fill-N1 s1">미결 — 그러면 무엇이 그 효과를 내는가</text></g><g ><g class="shape"><path d="M10 759h700v722H10z" class="stroke-B1 fill-B4 s0"/></g><text x="360" y="746" class="fill-N1 s2">공통요인 쪽</text></g><g ><g class="shape"><path d="M750 983h790v498H750z" class="stroke-B1 fill-B4 s0"/></g><text x="1145" y="970" class="fill-N1 s2">특정성분 쪽</text></g><g ><g class="shape"><path d="M275 1621h955v522H275z" class="stroke-B1 fill-B4 s0"/></g><text x="752.5" y="1608" class="fill-N1 s2">이른바 도도새 판결</text></g><text x="752.5" y="2279" class="fill-N1 s1"><tspan x="752.5" dy="0"> </tspan><tspan x="752.5" dy="17.667">이 문서가 적는 방식 — ‘효과가 있다’ 는 그냥 적고,</tspan><tspan x="752.5" dy="17.667">‘무엇 때문인가’ 는 입장을 나란히 놓는다. 저자가 고르지 않는다</tspan></text><g ><g class="shape"><path d="M62 789h596v66H62z" class="stroke-B1 fill-B5 s0"/></g><text x="360" y="827.5" class="text-bold fill-N1 s1">주장 — 계열이 달라도 함께 들어 있는 것들이 효과의 큰 몫을 낸다</text></g><g ><g class="shape"><path d="M79 1005h563v82H79z" class="stroke-B1 fill-B5 s0"/></g><text x="360.5" y="1043.5" class="text-bold fill-N1 s1"><tspan x="360.5" dy="0">후보 — 치료 동맹, 나아질 것이라는 기대,</tspan><tspan x="360.5" dy="18.5">무슨 일이 왜 일어나는지 설명해 주는 틀, 치료자 개인의 차이</tspan></text></g><g ><g class="shape"><path d="M74 1187h572v82H74z" class="stroke-B1 fill-B5 s0"/></g><text x="360" y="1225.5" class="text-bold fill-N1 s1"><tspan x="360" dy="0">근거 — 계열끼리 견준 시험에서 차이가 대체로 작다.</tspan><tspan x="360" dy="18.5">그리고 동맹의 질이 결과와 관련된다는 보고가 되풀이 나왔다</tspan></text></g><g ><g class="shape"><path d="M40 1369h640v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="360" y="1407.5" class="text-bold fill-N1 s1"><tspan x="360" dy="0">약한 자리 — 동맹과 결과의 관계는 대부분 상관이다.</tspan><tspan x="360" dy="18.5">좋아지고 있어서 동맹이 좋아졌을 수도 있다. 방향이 확인되지 않았다</tspan></text></g><g ><g class="shape"><path d="M903 1013h485v66H903z" class="stroke-B1 fill-B5 s0"/></g><text x="1145.5" y="1051.5" class="text-bold fill-N1 s1">주장 — 어떤 문제에는 특정한 절차가 실제로 더 낫다</text></g><g ><g class="shape"><path d="M781 1187h728v82H781z" class="stroke-B1 fill-B5 s0"/></g><text x="1145" y="1225.5" class="text-bold fill-N1 s1"><tspan x="1145" dy="0">근거 — 성분을 빼고 나머지를 그대로 두는 해체 설계에서</tspan><tspan x="1145" dy="18.5">결과가 달라지는 경우가 있고, 어떤 비교 시험에서는 계열 사이에 차이가 나온다</tspan></text></g><g ><g class="shape"><path d="M780 1369h730v82H780z" class="stroke-B1 fill-B5 s0"/></g><text x="1145" y="1407.5" class="text-bold fill-N1 s1"><tspan x="1145" dy="0">약한 자리 — 해체 설계는 표본이 커야 하는데 실제로는 작다.</tspan><tspan x="1145" dy="18.5">작은 차이를 잡을 검정력이 모자라면 ‘차이가 없다’ 가 아니라 ‘못 잡았다’ 이다</tspan></text></g><g ><g class="shape"><path d="M305 1651h895v82H305z" class="stroke-B1 fill-B5 s0"/></g><text x="752.5" y="1689.5" class="text-bold fill-N1 s1"><tspan x="752.5" dy="0">이름의 유래 — 동화에서 도도새가 경주를 끝내며 ‘모두가 이겼고 모두 상을 받아야 한다’ 고 말한다.</tspan><tspan x="752.5" dy="18.5">계열끼리 견주면 승자가 없다는 관찰에 이 이름이 붙었다</tspan></text></g><g ><g class="shape"><path d="M364 1833h777v82H364z" class="stroke-B1 fill-B5 s0"/></g><text x="752.5" y="1871.5" class="text-bold fill-N1 s1"><tspan x="752.5" dy="0">정확한 지위 — ‘모두 같다’ 가 아니다.</tspan><tspan x="752.5" dy="18.5">‘차이가 있어도 대체로 작고, 있는 차이가 설계와 얽혀 있다’ 가 자료에 맞는 요약이다</tspan></text></g><g ><g class="shape"><path d="M348 2015h809v98H348z" class="stroke-B1 fill-B5 s0"/></g><text x="752.5" y="2053.5" class="text-bold fill-N1 s1"><tspan x="752.5" dy="0">얽힌 것 하나 — 연구자 충성도.</tspan><tspan x="752.5" dy="17.667">비교 시험의 결과가 연구자가 어느 계열에 속하는가와 관련된다는 보고가 되풀이 나왔다.</tspan><tspan x="752.5" dy="17.667">4장의 실험자 기대가 시험 수준에서 나타난 것이다</tspan></text></g><marker id="mk-d2-271489055-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M752.98 363c-.38 38-.38 58-.02 94" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M360 857v144" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M360 1089v94" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M360 1271v94" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M1145 1081v102" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M1145 1271v94" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M568.114 615.665C402 674.2 360 694.8 360 714" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M936.886 615.665C1103 674.2 1145 699 1145 714v224" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M752.5 1735v94" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M752.5 1917v94" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><marker id="mk-d2-271489055-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-271489055-2177206569)" d="M360 1483v134" class="connection stroke-B2 s4" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-2177206569)" d="M1145 1483v134" class="connection stroke-B2 s4" mask="url(#d2-271489055)"/><path fill="none" marker-end="url(#mk-d2-271489055-3488378134)" d="M752.5 2145v114" class="connection stroke-B1 s0" mask="url(#d2-271489055)"/><mask id="d2-271489055" width="1732" height="2518" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1732v2518H-91z"/></mask></svg>