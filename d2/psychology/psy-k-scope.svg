<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="1557" class="d2-4132803673 d2-svg" viewBox="-101 -101 1110 1557"><rect width="1110" height="1557" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-4132803673 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4132803673 .fill-N1{fill:#0a0f25}.d2-4132803673 .fill-B4{fill:#e3e9fd}.d2-4132803673 .fill-B5{fill:#edf0fd}.d2-4132803673 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="226.5" cy="245" class="shape stroke-B1" rx="226.5" ry="245" style="fill:#f7f8fe;stroke-width:2"/></g><text x="226.5" y="250.5" class="text-bold fill-N1 s0">19장 — 임상과 상담의 개관</text></g><g ><g class="shape"><path d="M513 0h395v490H513z" class="stroke-B1 fill-B4 s1"/></g><text x="710.5" y="33" class="fill-N1 s2">이 장이 다루지 않는 것</text></g><g ><g class="shape"><path d="M0 550h453v645H0z" class="stroke-B1 fill-B4 s1"/></g><text x="226.5" y="583" class="fill-N1 s2">이 장이 다루는 것</text></g><g ><g class="shape"><path d="M513 550h395v645H513z" class="stroke-B1 fill-B4 s1"/></g><text x="710.5" y="583" class="fill-N1 s2">왜 선을 긋는가</text></g><path fill="transparent" stroke="transparent" d="M0 1255h453v100H0z" class="shape s1"/><text x="702.5" y="1271" class="text-bold fill-N1 s0"><tspan x="702.5" dy="0"> </tspan><tspan x="702.5" dy="17">지금 힘든 상태에 있다면</tspan><tspan x="702.5" dy="17">이 문서가 도울 수 있는 것이 없다.</tspan><tspan x="702.5" dy="17">자격을 갖춘 전문가나 의료기관을 찾는 것이</tspan><tspan x="702.5" dy="17">이 장을 읽는 것보다 먼저다</tspan></text><g ><g class="shape"><path d="M25 596h403v114H25z" class="stroke-B1 fill-B5 s1"/></g><text x="226.5" y="634.5" class="text-bold fill-N1 s0"><tspan x="226.5" dy="0">이론 계보 —</tspan><tspan x="226.5" dy="17.25">정신역동 · 인간중심 · 행동 ·</tspan><tspan x="226.5" dy="17.25">인지행동 · 수용전념.</tspan><tspan x="226.5" dy="17.25">각 계열이 무엇을 변화의 원천으로 보는가</tspan></text></g><g ><g class="shape"><path d="M25 735h403v98H25z" class="stroke-B1 fill-B5 s1"/></g><text x="226.5" y="773.5" class="text-bold fill-N1 s0"><tspan x="226.5" dy="0">진단 체계가 무엇이고 무엇이 아닌가.</tspan><tspan x="226.5" dy="17.667">분류 규약의 성질,</tspan><tspan x="226.5" dy="17.667">그리고 그 경계가 어떻게 정해지는가</tspan></text></g><g ><g class="shape"><path d="M25 858h403v98H25z" class="stroke-B1 fill-B5 s1"/></g><text x="226.5" y="896.5" class="text-bold fill-N1 s0"><tspan x="226.5" dy="0">효과 연구의 지형 —</tspan><tspan x="226.5" dy="17.667">공통요인과 특정성분,</tspan><tspan x="226.5" dy="17.667">그리고 그 둘을 가르는 일이 왜 어려운가</tspan></text></g><g ><g class="shape"><path d="M25 981h403v82H25z" class="stroke-B1 fill-B5 s1"/></g><text x="226.5" y="1019.5" class="text-bold fill-N1 s0"><tspan x="226.5" dy="0">이 분야의 연구가</tspan><tspan x="226.5" dy="18.5">방법론적으로 어려운 자리들</tspan></text></g><g ><g class="shape"><path d="M25 1088h403v82H25z" class="stroke-B1 fill-B5 s1"/></g><text x="226.5" y="1126.5" class="text-bold fill-N1 s0"><tspan x="226.5" dy="0">이 분야가 어떻게 훈련되는가,</tspan><tspan x="226.5" dy="18.5">그리고 왜 글로는 배울 수 없는가</tspan></text></g><g ><g class="shape"><path d="M538 46h340v82H538z" class="stroke-B1 fill-B5 s1"/></g><text x="708" y="84.5" class="text-bold fill-N1 s0"><tspan x="708" dy="0">기법의 절차.</tspan><tspan x="708" dy="18.5">무엇을 어떻게 하는지 적지 않는다</tspan></text></g><g ><g class="shape"><path d="M538 153h340v98H538z" class="stroke-B1 fill-B5 s1"/></g><text x="708" y="191.5" class="text-bold fill-N1 s0"><tspan x="708" dy="0">자가 진단.</tspan><tspan x="708" dy="17.667">독자가 자기 상태를 재 보게 하는</tspan><tspan x="708" dy="17.667">척도를 싣지 않는다</tspan></text></g><g ><g class="shape"><path d="M538 276h340v82H538z" class="stroke-B1 fill-B5 s1"/></g><text x="708" y="314.5" class="text-bold fill-N1 s0"><tspan x="708" dy="0">증상 목록을</tspan><tspan x="708" dy="18.5">진단처럼 늘어놓기</tspan></text></g><g ><g class="shape"><path d="M538 383h340v82H538z" class="stroke-B1 fill-B5 s1"/></g><text x="708" y="421.5" class="text-bold fill-N1 s0"><tspan x="708" dy="0">‘이럴 때는 이렇게 하라’</tspan><tspan x="708" dy="18.5">형태의 조언</tspan></text></g><g ><g class="shape"><path d="M538 596h345v114H538z" class="stroke-B1 fill-B5 s1"/></g><text x="710.5" y="634.5" class="text-bold fill-N1 s0"><tspan x="710.5" dy="0">상담은 수퍼비전 아래</tspan><tspan x="710.5" dy="17.25">실습으로 익히는 것이다.</tspan><tspan x="710.5" dy="17.25">글로 옮기면 읽은 사람이</tspan><tspan x="710.5" dy="17.25">할 수 있다고 착각하게 만든다</tspan></text></g><g ><g class="shape"><path d="M538 735h345v114H538z" class="stroke-B1 fill-B5 s1"/></g><text x="710.5" y="773.5" class="text-bold fill-N1 s0"><tspan x="710.5" dy="0">자습서라는 형식 자체가 독자를</tspan><tspan x="710.5" dy="17.25">자기 문제에 적용하는 쪽으로 민다.</tspan><tspan x="710.5" dy="17.25">그래서 형식이 하는 일을</tspan><tspan x="710.5" dy="17.25">문서가 미리 막아야 한다</tspan></text></g><g ><g class="shape"><path d="M538 874h345v98H538z" class="stroke-B1 fill-B5 s1"/></g><text x="710.5" y="912.5" class="text-bold fill-N1 s0"><tspan x="710.5" dy="0">판별 기준을 적는 것과</tspan><tspan x="710.5" dy="17.667">분류 체계의 성질을 설명하는 것은</tspan><tspan x="710.5" dy="17.667">다르다. 이 장은 뒤쪽만 한다</tspan></text></g><marker id="mk-d2-4132803673-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4132803673-3488378134)" d="M227 492v54" class="connection stroke-B1 s1" mask="url(#d2-4132803673)"/><path fill="none" marker-end="url(#mk-d2-4132803673-3488378134)" d="M455 245h54" class="connection stroke-B1 s1" mask="url(#d2-4132803673)"/><marker id="mk-d2-4132803673-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4132803673-2177206569)" d="M710.5 491.5v55" class="connection" mask="url(#d2-4132803673)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><path fill="none" marker-end="url(#mk-d2-4132803673-3488378134)" d="M710.5 1197v54" class="connection stroke-B1 s1" mask="url(#d2-4132803673)"/><mask id="d2-4132803673" width="1110" height="1557" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1110v1557H-101z"/></mask></svg>