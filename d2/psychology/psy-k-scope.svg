<svg xmlns="http://www.w3.org/2000/svg" width="3060" height="1518" class="d2-2037207016 d2-svg" viewBox="-101 -85 3060 1518"><rect width="3060" height="1518" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2037207016 .fill-N1{fill:#0a0f25}.d2-2037207016 .fill-B4{fill:#e3e9fd}.d2-2037207016 .fill-B5{fill:#edf0fd}.d2-2037207016 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="188" cy="784.5" class="shape stroke-B1" rx="188" ry="62.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="188" y="790" class="text-bold fill-N1 s0">19장 — 임상과 상담의 개관</text></g><g ><g class="shape"><path d="M496 56h805v662H496z" class="stroke-B1 fill-B4 s1"/></g><text x="898.5" y="43" class="fill-N1 s2">이 장이 다루는 것</text></g><g ><g class="shape"><path d="M576 804h646v504H576z" class="stroke-B1 fill-B4 s1"/></g><text x="899" y="791" class="fill-N1 s2">이 장이 다루지 않는 것</text></g><g ><g class="shape"><path d="M1441 906h680v426h-680z" class="stroke-B1 fill-B4 s1"/></g><text x="1781" y="893" class="fill-N1 s2">왜 선을 긋는가</text></g><text x="2549.5" y="1109" class="text-bold fill-N1 s0"><tspan x="2549.5" dy="0"> </tspan><tspan x="2549.5" dy="17.667">지금 힘든 상태에 있다면 이 문서가 도울 수 있는 것이 없다.</tspan><tspan x="2549.5" dy="17.667">자격을 갖춘 전문가나 의료기관을 찾는 것이 이 장을 읽는 것보다 먼저다</tspan></text><g ><g class="shape"><path d="M619 86h559v82H619z" class="stroke-B1 fill-B5 s1"/></g><text x="898.5" y="124.5" class="text-bold fill-N1 s0"><tspan x="898.5" dy="0">이론 계보 — 정신역동 · 인간중심 · 행동 · 인지행동 · 수용전념.</tspan><tspan x="898.5" dy="18.5">각 계열이 무엇을 변화의 원천으로 보는가</tspan></text></g><g ><g class="shape"><path d="M641 228h516v82H641z" class="stroke-B1 fill-B5 s1"/></g><text x="899" y="266.5" class="text-bold fill-N1 s0"><tspan x="899" dy="0">진단 체계가 무엇이고 무엇이 아닌가.</tspan><tspan x="899" dy="18.5">분류 규약의 성질, 그리고 그 경계가 어떻게 정해지는가</tspan></text></g><g ><g class="shape"><path d="M526 370h745v66H526z" class="stroke-B1 fill-B5 s1"/></g><text x="898.5" y="408.5" class="text-bold fill-N1 s0">효과 연구의 지형 — 공통요인과 특정성분, 그리고 그 둘을 가르는 일이 왜 어려운가</text></g><g ><g class="shape"><path d="M677 496h444v66H677z" class="stroke-B1 fill-B5 s1"/></g><text x="899" y="534.5" class="text-bold fill-N1 s0">이 분야의 연구가 방법론적으로 어려운 자리들</text></g><g ><g class="shape"><path d="M607 622h583v66H607z" class="stroke-B1 fill-B5 s1"/></g><text x="898.5" y="660.5" class="text-bold fill-N1 s0">이 분야가 어떻게 훈련되는가, 그리고 왜 글로는 배울 수 없는가</text></g><g ><g class="shape"><path d="M673 834h452v66H673z" class="stroke-B1 fill-B5 s1"/></g><text x="899" y="872.5" class="text-bold fill-N1 s0">기법의 절차. 무엇을 어떻게 하는지 적지 않는다</text></g><g ><g class="shape"><path d="M606 960h586v66H606z" class="stroke-B1 fill-B5 s1"/></g><text x="899" y="998.5" class="text-bold fill-N1 s0">자가 진단. 독자가 자기 상태를 재 보게 하는 척도를 싣지 않는다</text></g><g ><g class="shape"><path d="M741 1086h316v66H741z" class="stroke-B1 fill-B5 s1"/></g><text x="899" y="1124.5" class="text-bold fill-N1 s0">증상 목록을 진단처럼 늘어놓기</text></g><g ><g class="shape"><path d="M716 1212h365v66H716z" class="stroke-B1 fill-B5 s1"/></g><text x="898.5" y="1250.5" class="text-bold fill-N1 s0">‘이럴 때는 이렇게 하라’ 형태의 조언</text></g><g ><g class="shape"><path d="M1524 936h514v82h-514z" class="stroke-B1 fill-B5 s1"/></g><text x="1781" y="974.5" class="text-bold fill-N1 s0"><tspan x="1781" dy="0">상담은 수퍼비전 아래 실습으로 익히는 것이다.</tspan><tspan x="1781" dy="18.5">글로 옮기면 읽은 사람이 할 수 있다고 착각하게 만든다</tspan></text></g><g ><g class="shape"><path d="M1471 1078h620v82h-620z" class="stroke-B1 fill-B5 s1"/></g><text x="1781" y="1116.5" class="text-bold fill-N1 s0"><tspan x="1781" dy="0">자습서라는 형식 자체가 독자를 자기 문제에 적용하는 쪽으로 민다.</tspan><tspan x="1781" dy="18.5">그래서 형식이 하는 일을 문서가 미리 막아야 한다</tspan></text></g><g ><g class="shape"><path d="M1480 1220h603v82h-603z" class="stroke-B1 fill-B5 s1"/></g><text x="1781.5" y="1258.5" class="text-bold fill-N1 s0"><tspan x="1781.5" dy="0">판별 기준을 적는 것과 분류 체계의 성질을 설명하는 것은 다르다.</tspan><tspan x="1781.5" dy="18.5">이 장은 뒤쪽만 한다</tspan></text></g><marker id="mk-d2-2037207016-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2037207016-3488378134)" d="M232.038 722.29C387 467.2 440 403 492 403" class="connection stroke-B1 s1" mask="url(#d2-2037207016)"/><path fill="none" marker-end="url(#mk-d2-2037207016-3488378134)" d="M232.16 846.63C387 1064.2 456 1119 572 1119" class="connection stroke-B1 s1" mask="url(#d2-2037207016)"/><marker id="mk-d2-2037207016-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2037207016-2177206569)" d="M1224 1119h213" class="connection" mask="url(#d2-2037207016)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><path fill="none" marker-end="url(#mk-d2-2037207016-3488378134)" d="M2123 1119h114" class="connection stroke-B1 s1" mask="url(#d2-2037207016)"/><mask id="d2-2037207016" width="3060" height="1518" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h3060v1518H-101z"/></mask></svg>