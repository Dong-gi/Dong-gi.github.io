<svg xmlns="http://www.w3.org/2000/svg" width="1522" height="1864" class="d2-2507964444 d2-svg" viewBox="-101 -101 1522 1864"><rect width="1522" height="1864" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2507964444 .fill-N1{fill:#0a0f25}.d2-2507964444 .fill-B4{fill:#e3e9fd}.d2-2507964444 .fill-B5{fill:#edf0fd}.d2-2507964444 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="661" cy="62.5" class="shape stroke-B1" rx="188" ry="62.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="661" y="68" class="text-bold fill-N1 s0">19장 — 임상과 상담의 개관</text></g><g ><g class="shape"><path d="M0 225h636v690H0z" class="stroke-B1 fill-B4 s1"/></g><text x="318" y="258" class="fill-N1 s2">이 장이 다루는 것</text></g><g ><g class="shape"><path d="M696 310h614v520H696z" class="stroke-B1 fill-B4 s1"/></g><text x="1003" y="343" class="fill-N1 s2">이 장이 다루지 않는 것</text></g><g ><g class="shape"><path d="M686 1015h634v478H686z" class="stroke-B1 fill-B4 s1"/></g><text x="1003" y="1048" class="fill-N1 s2">왜 선을 긋는가</text></g><text x="1003.5" y="1609" class="text-bold fill-N1 s0"><tspan x="1003.5" dy="0"> </tspan><tspan x="1003.5" dy="17.25">지금 힘든 상태에 있다면 이 문서가 도울 수 있는 것이 없다.</tspan><tspan x="1003.5" dy="17.25">자격을 갖춘 전문가나 의료기관을 찾는 것이</tspan><tspan x="1003.5" dy="17.25">이 장을 읽는 것보다 먼저다</tspan></text><g ><g class="shape"><path d="M60 285h516v98H60z" class="stroke-B1 fill-B5 s1"/></g><text x="318" y="323.5" class="text-bold fill-N1 s0"><tspan x="318" dy="0">이론 계보 —</tspan><tspan x="318" dy="17.667">정신역동 · 인간중심 · 행동 · 인지행동 · 수용전념.</tspan><tspan x="318" dy="17.667">각 계열이 무엇을 변화의 원천으로 보는가</tspan></text></g><g ><g class="shape"><path d="M60 423h516v82H60z" class="stroke-B1 fill-B5 s1"/></g><text x="318" y="461.5" class="text-bold fill-N1 s0"><tspan x="318" dy="0">진단 체계가 무엇이고 무엇이 아닌가.</tspan><tspan x="318" dy="18.5">분류 규약의 성질, 그리고 그 경계가 어떻게 정해지는가</tspan></text></g><g ><g class="shape"><path d="M60 545h516v82H60z" class="stroke-B1 fill-B5 s1"/></g><text x="318" y="583.5" class="text-bold fill-N1 s0"><tspan x="318" dy="0">효과 연구의 지형 — 공통요인과 특정성분,</tspan><tspan x="318" dy="18.5">그리고 그 둘을 가르는 일이 왜 어려운가</tspan></text></g><g ><g class="shape"><path d="M60 667h516v66H60z" class="stroke-B1 fill-B5 s1"/></g><text x="318" y="705.5" class="text-bold fill-N1 s0">이 분야의 연구가 방법론적으로 어려운 자리들</text></g><g ><g class="shape"><path d="M60 773h516v82H60z" class="stroke-B1 fill-B5 s1"/></g><text x="318" y="811.5" class="text-bold fill-N1 s0"><tspan x="318" dy="0">이 분야가 어떻게 훈련되는가,</tspan><tspan x="318" dy="18.5">그리고 왜 글로는 배울 수 없는가</tspan></text></g><g ><g class="shape"><path d="M756 370h494v66H756z" class="stroke-B1 fill-B5 s1"/></g><text x="1003" y="408.5" class="text-bold fill-N1 s0">기법의 절차. 무엇을 어떻게 하는지 적지 않는다</text></g><g ><g class="shape"><path d="M756 476h494v82H756z" class="stroke-B1 fill-B5 s1"/></g><text x="1003" y="514.5" class="text-bold fill-N1 s0"><tspan x="1003" dy="0">자가 진단.</tspan><tspan x="1003" dy="18.5">독자가 자기 상태를 재 보게 하는 척도를 싣지 않는다</tspan></text></g><g ><g class="shape"><path d="M756 598h494v66H756z" class="stroke-B1 fill-B5 s1"/></g><text x="1003" y="636.5" class="text-bold fill-N1 s0">증상 목록을 진단처럼 늘어놓기</text></g><g ><g class="shape"><path d="M756 704h494v66H756z" class="stroke-B1 fill-B5 s1"/></g><text x="1003" y="742.5" class="text-bold fill-N1 s0">‘이럴 때는 이렇게 하라’ 형태의 조언</text></g><g ><g class="shape"><path d="M746 1075h514v82H746z" class="stroke-B1 fill-B5 s1"/></g><text x="1003" y="1113.5" class="text-bold fill-N1 s0"><tspan x="1003" dy="0">상담은 수퍼비전 아래 실습으로 익히는 것이다.</tspan><tspan x="1003" dy="18.5">글로 옮기면 읽은 사람이 할 수 있다고 착각하게 만든다</tspan></text></g><g ><g class="shape"><path d="M746 1197h514v98H746z" class="stroke-B1 fill-B5 s1"/></g><text x="1003" y="1235.5" class="text-bold fill-N1 s0"><tspan x="1003" dy="0">자습서라는 형식 자체가 독자를</tspan><tspan x="1003" dy="17.667">자기 문제에 적용하는 쪽으로 민다.</tspan><tspan x="1003" dy="17.667">그래서 형식이 하는 일을 문서가 미리 막아야 한다</tspan></text></g><g ><g class="shape"><path d="M746 1335h514v98H746z" class="stroke-B1 fill-B5 s1"/></g><text x="1003" y="1373.5" class="text-bold fill-N1 s0"><tspan x="1003" dy="0">판별 기준을 적는 것과</tspan><tspan x="1003" dy="17.667">분류 체계의 성질을 설명하는 것은 다르다.</tspan><tspan x="1003" dy="17.667">이 장은 뒤쪽만 한다</tspan></text></g><marker id="mk-d2-2507964444-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2507964444-3488378134)" d="M525.1 106.627C359.8 161.2 318 185 318 221" class="connection stroke-B1 s1" mask="url(#d2-2507964444)"/><path fill="none" marker-end="url(#mk-d2-2507964444-3488378134)" d="M796.898 106.63C961.4 161.2 1003 202 1003 306" class="connection stroke-B1 s1" mask="url(#d2-2507964444)"/><marker id="mk-d2-2507964444-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2507964444-2177206569)" d="M1003 832v179" class="connection" mask="url(#d2-2507964444)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><path fill="none" marker-end="url(#mk-d2-2507964444-3488378134)" d="M1003 1495v94" class="connection stroke-B1 s1" mask="url(#d2-2507964444)"/><mask id="d2-2507964444" width="1522" height="1864" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1522v1864H-101z"/></mask></svg>