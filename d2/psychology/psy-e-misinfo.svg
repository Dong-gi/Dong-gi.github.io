<svg xmlns="http://www.w3.org/2000/svg" width="1249" height="1636" class="d2-1889006253 d2-svg" viewBox="-99 -101 1249 1636"><rect width="1249" height="1636" x="-99" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1889006253 .fill-N1{fill:#0a0f25}.d2-1889006253 .fill-B4{fill:#e3e9fd}.d2-1889006253 .fill-B5{fill:#edf0fd}.d2-1889006253 .fill-B6{fill:#f7f8fe}.d2-1889006253 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M363 0h539v82H363z" class="stroke-B1 fill-B6 s0"/></g><text x="632.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="632.5" dy="0">1. 사건을 본다</tspan><tspan x="632.5" dy="18.5">모든 참가자가 같은 장면을 본다. 짧은 영상이나 사진 묶음</tspan></text></g><g ><g class="shape"><path d="M10 202h782v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="401" y="189" class="fill-N1 s2">2. 사건 뒤의 정보가 들어온다 — 여기서 조건이 갈린다</text></g><g ><g class="shape"><path d="M439 480h387v98H439z" class="stroke-B1 fill-B6 s0"/></g><text x="632.5" y="518.5" class="text-bold fill-N1 s1"><tspan x="632.5" dy="0">3. 기억 검사</tspan><tspan x="632.5" dy="17.667">‘영상에서 무엇을 보았는가’ 를 묻는다.</tspan><tspan x="632.5" dy="17.667">읽은 글에 대해 묻는 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M322 678h622v98H322z" class="stroke-B1 fill-B6 s0"/></g><text x="633" y="716.5" class="text-bold fill-N1 s1"><tspan x="633" dy="0">무엇이 나오나</tspan><tspan x="633" dy="17.667">오정보 조건에서 없던 세부를 ‘보았다’ 고 보고하는 일이 늘어난다.</tspan><tspan x="633" dy="17.667">여러 절차, 여러 나라, 여러 연령대에서 되풀이 확인되었다</tspan></text></g><g ><g class="shape"><path d="M216 896h833v538H216z" class="stroke-B1 fill-B4 s0"/></g><text x="632.5" y="883" class="fill-N1 s2">이 설계가 말하는 것과 말하지 않는 것</text></g><g ><g class="shape"><path d="M40 232h403v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="241.5" y="270.5" class="text-bold fill-N1 s1"><tspan x="241.5" dy="0">오정보 조건</tspan><tspan x="241.5" dy="17.667">장면에 없던 세부가 들어간 문장을 읽거나</tspan><tspan x="241.5" dy="17.667">그런 전제가 깔린 질문을 받는다</tspan></text></g><g ><g class="shape"><path d="M503 232h259v98H503z" class="stroke-B1 fill-B5 s0"/></g><text x="632.5" y="270.5" class="text-bold fill-N1 s1"><tspan x="632.5" dy="0">통제 조건</tspan><tspan x="632.5" dy="17.667">같은 길이의 글을 읽지만</tspan><tspan x="632.5" dy="17.667">그 세부가 들어 있지 않다</tspan></text></g><g ><g class="shape"><path d="M322 926h621v82H322z" class="stroke-B1 fill-B5 s0"/></g><text x="632.5" y="964.5" class="text-bold fill-N1 s1"><tspan x="632.5" dy="0">말하는 것 — 사건 뒤에 들어온 정보가 그 사건에 대한 보고를 바꾼다.</tspan><tspan x="632.5" dy="18.5">이것이 정설이다</tspan></text></g><g ><g class="shape"><path d="M246 1108h773v98H246z" class="stroke-B1 fill-B5 s0"/></g><text x="632.5" y="1146.5" class="text-bold fill-N1 s1"><tspan x="632.5" dy="0">말하지 않는 것 — 원래 기억이 지워졌는지.</tspan><tspan x="632.5" dy="17.667">덮어썼다는 설명과 뒤에 들어온 것을 잘못 고른 것뿐이라는 설명이 오래 겨루었고,</tspan><tspan x="632.5" dy="17.667">단서를 잘 주면 원래 것이 나오는 경우가 있다는 보고가 뒤의 설명 쪽에 무게를 실었다</tspan></text></g><g ><g class="shape"><path d="M313 1306h639v98H313z" class="stroke-B1 fill-B5 s0"/></g><text x="632.5" y="1344.5" class="text-bold fill-N1 s1"><tspan x="632.5" dy="0">그래서 실무에 옮길 때 중요한 것은 원인 논쟁이 아니라 결과다 —</tspan><tspan x="632.5" dy="17.667">‘사건 뒤에 무엇이 들어가느냐가 나중의 진술을 바꾼다.’</tspan><tspan x="632.5" dy="17.667">그러므로 진술을 받기 전에 정보가 새어 들어가지 않도록 절차를 짠다</tspan></text></g><marker id="mk-d2-1889006253-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1889006253-3488378134)" d="M632.5 84v73" class="connection stroke-B1 s0" mask="url(#d2-1889006253)"/><path fill="none" marker-end="url(#mk-d2-1889006253-3488378134)" d="M632.5 362v114" class="connection stroke-B1 s0" mask="url(#d2-1889006253)"/><path fill="none" marker-end="url(#mk-d2-1889006253-3488378134)" d="M632.5 580v94" class="connection stroke-B1 s0" mask="url(#d2-1889006253)"/><path fill="none" marker-end="url(#mk-d2-1889006253-3488378134)" d="M632.5 1010v94" class="connection stroke-B1 s0" mask="url(#d2-1889006253)"/><path fill="none" marker-end="url(#mk-d2-1889006253-3488378134)" d="M632.5 1208v94" class="connection stroke-B1 s0" mask="url(#d2-1889006253)"/><marker id="mk-d2-1889006253-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1889006253-2177206569)" d="M632.5 778v73" class="connection" mask="url(#d2-1889006253)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1889006253" width="1249" height="1636" x="-99" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-99-101h1249v1636H-99z"/></mask></svg>