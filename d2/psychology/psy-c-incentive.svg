<svg xmlns="http://www.w3.org/2000/svg" width="1049" height="1576" class="d2-1977128098 d2-svg" viewBox="-101 -100 1049 1576"><rect width="1049" height="1576" x="-101" y="-100" rx="0" style="fill:#fff"/><style>.d2-1977128098 .text-bold{font-weight:700}.d2-1977128098 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1977128098 .fill-N1{fill:#0a0f25}.d2-1977128098 .fill-N2{fill:#676c7e}.d2-1977128098 .fill-B4{fill:#e3e9fd}.d2-1977128098 .fill-B5{fill:#edf0fd}.d2-1977128098 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 41h847v1051H0z" class="stroke-B1 fill-B4 s0"/></g><text x="423.5" y="28" class="fill-N1 s1">닫힌 고리</text></g><g ><g class="shape"><path d="M0 1142h847v233H0z" class="stroke-B1 fill-B4 s0"/></g><text x="423.5" y="1175" class="fill-N1 s1">이 그림의 요점</text></g><g ><g class="shape"><path d="M329 71h232v114H329z" class="stroke-B1 fill-B5 s0"/></g><text x="445" y="109.5" class="text-bold fill-N1 s2"><tspan x="445" dy="0">학술지는 새롭고</tspan><tspan x="445" dy="17.25">유의한 결과를 싣는다</tspan><tspan x="445" dy="17.25">‘차이가 없었다’ 는</tspan><tspan x="445" dy="17.25">실리기 어렵다</tspan></text></g><g ><g class="shape"><path d="M214 285h235v98H214z" class="stroke-B1 fill-B5 s0"/></g><text x="331.5" y="323.5" class="text-bold fill-N1 s2"><tspan x="331.5" dy="0">채용 · 승진 · 연구비가</tspan><tspan x="331.5" dy="17.667">논문 수와 실린 곳으로</tspan><tspan x="331.5" dy="17.667">정해진다</tspan></text></g><g ><g class="shape"><path d="M30 483h285v146H30z" class="stroke-B1 fill-B5 s0"/></g><text x="172.5" y="521.5" class="text-bold fill-N1 s2"><tspan x="172.5" dy="0">유의한 결과를 내는 쪽으로</tspan><tspan x="172.5" dy="16.833">선택이 쌓인다</tspan><tspan x="172.5" dy="16.833">분석을 여러 갈래로 해 보고,</tspan><tspan x="172.5" dy="16.833">되는 것만 보고하고,</tspan><tspan x="172.5" dy="16.833">결과를 보고 나서</tspan><tspan x="172.5" dy="16.833">가설을 맞춘다</tspan></text></g><g ><g class="shape"><path d="M375 499h232v114H375z" class="stroke-B1 fill-B5 s0"/></g><text x="491" y="537.5" class="text-bold fill-N1 s2"><tspan x="491" dy="0">표본은 작게 유지된다</tspan><tspan x="491" dy="17.25">같은 예산으로</tspan><tspan x="491" dy="17.25">논문을 여럿 내려면</tspan><tspan x="491" dy="17.25">연구마다 작아진다</tspan></text></g><g ><g class="shape"><path d="M196 782h272v82H196z" class="stroke-B1 fill-B5 s0"/></g><text x="332" y="820.5" class="text-bold fill-N1 s2"><tspan x="332" dy="0">문헌에 위양성과</tspan><tspan x="332" dy="18.5">부풀린 효과크기가 쌓인다</tspan></text></g><g ><g class="shape"><path d="M306 964h279v98H306z" class="stroke-B1 fill-B5 s0"/></g><text x="445.5" y="1002.5" class="text-bold fill-N1 s2"><tspan x="445.5" dy="0">걸러지지 않는다</tspan><tspan x="445.5" dy="17.667">재현 연구는 실어 주지 않고</tspan><tspan x="445.5" dy="17.667">보상도 없다</tspan></text></g><g ><g class="shape"><path d="M25 1188h235v162H25z" class="stroke-B1 fill-B5 s0"/></g><text x="142.5" y="1242.5" class="text-bold fill-N1 s2"><tspan x="142.5" dy="0">고리 안 어디에도</tspan><tspan x="142.5" dy="17">자료를 조작하는</tspan><tspan x="142.5" dy="17">사람이 없다.</tspan><tspan x="142.5" dy="17">각 칸은 그 자리에서는</tspan><tspan x="142.5" dy="17">합리적인 행동이다</tspan></text></g><g ><g class="shape"><path d="M285 1188h234v162H285z" class="stroke-B1 fill-B5 s0"/></g><text x="402" y="1242.5" class="text-bold fill-N1 s2"><tspan x="402" dy="0">그래서</tspan><tspan x="402" dy="17">‘더 정직해지자’ 로는</tspan><tspan x="402" dy="17">끊기지 않는다.</tspan><tspan x="402" dy="17">끊으려면 화살표</tspan><tspan x="402" dy="17">자체를 바꿔야 한다</tspan></text></g><g ><g class="shape"><path d="M544 1188h278v162H544z" class="stroke-B1 fill-B5 s0"/></g><text x="683" y="1226.5" class="text-bold fill-N1 s2"><tspan x="683" dy="0">실제로 바뀐 것들은</tspan><tspan x="683" dy="16.714">전부 화살표를 겨눈다 —</tspan><tspan x="683" dy="16.714">사전등록은 선택을,</tspan><tspan x="683" dy="16.714">등록보고서는 출판을,</tspan><tspan x="683" dy="16.714">다중연구실은 작은 표본을,</tspan><tspan x="683" dy="16.714">재현 특집호는</tspan><tspan x="683" dy="16.714">마지막 화살표를</tspan></text></g><marker id="mk-d2-1977128098-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1977128098-3488378134)" d="M383.295 186.372C342.35 225 331.75 245 331.75 281" class="connection stroke-B1 s0" mask="url(#d2-1977128098)"/><path fill="none" marker-end="url(#mk-d2-1977128098-3488378134)" d="M250.804 384.06C188.5 423 172.5 443 172.5 479" class="connection stroke-B1 s0" mask="url(#d2-1977128098)"/><path fill="none" marker-end="url(#mk-d2-1977128098-3488378134)" d="M172.5 630.5c0 59.6 20.6 90.4 99.796 149.605" class="connection stroke-B1 s0" mask="url(#d2-1977128098)"/><path fill="none" marker-end="url(#mk-d2-1977128098-3488378134)" d="M491 614.5c0 72.4-20.6 106.4-99.796 165.605" class="connection stroke-B1 s0" mask="url(#d2-1977128098)"/><text x="473" y="706" class="text-italic fill-N2 s2"><tspan x="473" dy="0">작은 표본은</tspan><tspan x="473" dy="17.667">유의할 때</tspan><tspan x="473" dy="17.667">효과를 부풀린다</tspan></text><path fill="none" marker-end="url(#mk-d2-1977128098-3488378134)" d="M412.696 384.06C475 423 491 446.2 491 495" class="connection stroke-B1 s0" mask="url(#d2-1977128098)"/><path fill="none" marker-end="url(#mk-d2-1977128098-3488378134)" d="M331.75 866c0 38 11.4 58 53.993 95.362" class="connection stroke-B1 s0" mask="url(#d2-1977128098)"/><path fill="none" marker-end="url(#mk-d2-1977128098-3488378134)" d="M581.88 963.319C690.4 924 718 895.8 718 868.5v-485c0-29.7-31.35-160.799-153.026-208.533" class="connection stroke-B1 s0" mask="url(#d2-1977128098)"/><text x="718" y="558" class="text-italic fill-N2 s2"><tspan x="718" dy="0">쌓인 것이 다시</tspan><tspan x="718" dy="17.667">‘알려진 사실’ 이</tspan><tspan x="718" dy="17.667">된다</tspan></text><marker id="mk-d2-1977128098-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1977128098-2177206569)" d="M423.5 1093.5v45" class="connection" mask="url(#d2-1977128098)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1977128098" width="1049" height="1576" x="-101" y="-100" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-100H948v1576H-101z"/><path d="M402 690h142v53H402zM645 542h146v53H645z"/></mask></svg>