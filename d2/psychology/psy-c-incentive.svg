<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="1665" class="d2-453831746 d2-svg" viewBox="-101 -100 1472 1665"><rect width="1472" height="1665" x="-101" y="-100" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-453831746 .fill-N1{fill:#0a0f25}.d2-453831746 .fill-N2{fill:#676c7e}.d2-453831746 .fill-B4{fill:#e3e9fd}.d2-453831746 .fill-B5{fill:#edf0fd}.d2-453831746 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 41h1270v891H0z" class="stroke-B1 fill-B4 s0"/></g><text x="635" y="28" class="fill-N1 s1">닫힌 고리</text></g><g ><g class="shape"><path d="M0 1002h1270v462H0z" class="stroke-B1 fill-B4 s0"/></g><text x="635" y="1035" class="fill-N1 s1">이 그림의 요점</text></g><g ><g class="shape"><path d="M483 71h380v82H483z" class="stroke-B1 fill-B5 s0"/></g><text x="673" y="109.5" class="text-bold fill-N1 s2"><tspan x="673" dy="0">학술지는 새롭고 유의한 결과를 싣는다</tspan><tspan x="673" dy="18.5">‘차이가 없었다’ 는 실리기 어렵다</tspan></text></g><g ><g class="shape"><path d="M331 253h319v82H331z" class="stroke-B1 fill-B5 s0"/></g><text x="490.5" y="291.5" class="text-bold fill-N1 s2"><tspan x="490.5" dy="0">채용 · 승진 · 연구비가</tspan><tspan x="490.5" dy="18.5">논문 수와 실린 곳으로 정해진다</tspan></text></g><g ><g class="shape"><path d="M30 435h461v98H30z" class="stroke-B1 fill-B5 s0"/></g><text x="260.5" y="473.5" class="text-bold fill-N1 s2"><tspan x="260.5" dy="0">유의한 결과를 내는 쪽으로 선택이 쌓인다</tspan><tspan x="260.5" dy="17.667">분석을 여러 갈래로 해 보고, 되는 것만 보고하고,</tspan><tspan x="260.5" dy="17.667">결과를 보고 나서 가설을 맞춘다</tspan></text></g><g ><g class="shape"><path d="M551 435h340v98H551z" class="stroke-B1 fill-B5 s0"/></g><text x="721" y="473.5" class="text-bold fill-N1 s2"><tspan x="721" dy="0">표본은 작게 유지된다</tspan><tspan x="721" dy="17.667">같은 예산으로 논문을 여럿 내려면</tspan><tspan x="721" dy="17.667">연구마다 작아진다</tspan></text></g><g ><g class="shape"><path d="M281 654h420v66H281z" class="stroke-B1 fill-B5 s0"/></g><text x="491" y="692.5" class="text-bold fill-N1 s2">문헌에 위양성과 부풀린 효과크기가 쌓인다</text></g><g ><g class="shape"><path d="M480 820h386v82H480z" class="stroke-B1 fill-B5 s0"/></g><text x="673" y="858.5" class="text-bold fill-N1 s2"><tspan x="673" dy="0">걸러지지 않는다</tspan><tspan x="673" dy="18.5">재현 연구는 실어 주지 않고 보상도 없다</tspan></text></g><g ><g class="shape"><path d="M60 1062h553v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="336.5" y="1100.5" class="text-bold fill-N1 s2"><tspan x="336.5" dy="0">고리 안 어디에도 자료를 조작하는 사람이 없다.</tspan><tspan x="336.5" dy="18.5">각 칸은 그 자리에서는 합리적인 행동이다</tspan></text></g><g ><g class="shape"><path d="M60 1184h553v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="336.5" y="1222.5" class="text-bold fill-N1 s2"><tspan x="336.5" dy="0">그래서 ‘더 정직해지자’ 로는 끊기지 않는다.</tspan><tspan x="336.5" dy="18.5">끊으려면 화살표 자체를 바꿔야 한다</tspan></text></g><g ><g class="shape"><path d="M60 1306h553v98H60z" class="stroke-B1 fill-B5 s0"/></g><text x="336.5" y="1344.5" class="text-bold fill-N1 s2"><tspan x="336.5" dy="0">실제로 바뀐 것들은 전부 화살표를 겨눈다 —</tspan><tspan x="336.5" dy="17.667">사전등록은 선택을, 등록보고서는 출판을,</tspan><tspan x="336.5" dy="17.667">다중연구실은 작은 표본을, 재현 특집호는 마지막 화살표를</tspan></text></g><marker id="mk-d2-453831746-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-453831746-3488378134)" d="M588.961 153.894C510.75 193 490.75 213 490.75 249" class="connection stroke-B1 s0" mask="url(#d2-453831746)"/><path fill="none" marker-end="url(#mk-d2-453831746-3488378134)" d="M385.639 335.733C285.9 375 260.5 395 260.5 431" class="connection stroke-B1 s0" mask="url(#d2-453831746)"/><path fill="none" marker-end="url(#mk-d2-453831746-3488378134)" d="M260.5 534.5c0 46.8 29.6 71.2 144.302 118.476" class="connection stroke-B1 s0" mask="url(#d2-453831746)"/><path fill="none" marker-end="url(#mk-d2-453831746-3488378134)" d="M721 534.5c0 46.8-29.6 71.2-144.302 118.476" class="connection stroke-B1 s0" mask="url(#d2-453831746)"/><text x="672" y="619" class="text-italic fill-N2 s2">작은 표본은 유의할 때 효과를 부풀린다</text><path fill="none" marker-end="url(#mk-d2-453831746-3488378134)" d="M595.861 335.733C695.6 375 721 395 721 431" class="connection stroke-B1 s0" mask="url(#d2-453831746)"/><path fill="none" marker-end="url(#mk-d2-453831746-3488378134)" d="M490.75 722c0 38 20 58 96.422 96.211" class="connection stroke-B1 s0" mask="url(#d2-453831746)"/><path fill="none" marker-end="url(#mk-d2-453831746-3488378134)" d="M860.453 819.57C1040.1 780 1085.5 753.4 1085.5 728.5v-389c0-27.3-45.401-146.5-223.094-185.64" class="connection stroke-B1 s0" mask="url(#d2-453831746)"/><text x="1085.5" y="501" class="text-italic fill-N2 s2">쌓인 것이 다시 ‘알려진 사실’ 이 된다</text><marker id="mk-d2-453831746-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-453831746-2177206569)" d="M635 934v64" class="connection" mask="url(#d2-453831746)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-453831746" width="1472" height="1665" x="-101" y="-100" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-100h1472v1665H-101z"/><path d="M508 603h328v21H508zM929 485h313v21H929z"/></mask></svg>