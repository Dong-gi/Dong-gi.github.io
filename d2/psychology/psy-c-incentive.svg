<svg xmlns="http://www.w3.org/2000/svg" width="3305" height="1249" class="d2-1085455644 d2-svg" viewBox="-79 -121 3305 1249"><rect width="3305" height="1249" x="-79" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1085455644 .fill-N1{fill:#0a0f25}.d2-1085455644 .fill-N2{fill:#676c7e}.d2-1085455644 .fill-B4{fill:#e3e9fd}.d2-1085455644 .fill-B5{fill:#edf0fd}.d2-1085455644 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M22 20h1438v1007H22z" class="stroke-B1 fill-B4 s0"/></g><text x="741" y="7" class="fill-N1 s1">닫힌 고리</text></g><g ><g class="shape"><path d="M1509 617h1616v178H1509z" class="stroke-B1 fill-B4 s0"/></g><text x="2317" y="604" class="fill-N1 s1">이 그림의 요점</text></g><g ><g class="shape"><path d="M589 50h380v82H589z" class="stroke-B1 fill-B5 s0"/></g><text x="779" y="88.5" class="text-bold fill-N1 s2"><tspan x="779" dy="0">학술지는 새롭고 유의한 결과를 싣는다</tspan><tspan x="779" dy="18.5">‘차이가 없었다’ 는 실리기 어렵다</tspan></text></g><g ><g class="shape"><path d="M301 232h507v66H301z" class="stroke-B1 fill-B5 s0"/></g><text x="554.5" y="270.5" class="text-bold fill-N1 s2">채용 · 승진 · 연구비가 논문 수와 실린 곳으로 정해진다</text></g><g ><g class="shape"><path d="M52 398h461v98H52z" class="stroke-B1 fill-B5 s0"/></g><text x="282.5" y="436.5" class="text-bold fill-N1 s2"><tspan x="282.5" dy="0">유의한 결과를 내는 쪽으로 선택이 쌓인다</tspan><tspan x="282.5" dy="17.667">분석을 여러 갈래로 해 보고, 되는 것만 보고하고,</tspan><tspan x="282.5" dy="17.667">결과를 보고 나서 가설을 맞춘다</tspan></text></g><g ><g class="shape"><path d="M573 406h508v82H573z" class="stroke-B1 fill-B5 s0"/></g><text x="827" y="444.5" class="text-bold fill-N1 s2"><tspan x="827" dy="0">표본은 작게 유지된다</tspan><tspan x="827" dy="18.5">같은 예산으로 논문을 여럿 내려면 연구마다 작아진다</tspan></text></g><g ><g class="shape"><path d="M344 683h420v66H344z" class="stroke-B1 fill-B5 s0"/></g><text x="554" y="721.5" class="text-bold fill-N1 s2">문헌에 위양성과 부풀린 효과크기가 쌓인다</text></g><g ><g class="shape"><path d="M586 915h386v82H586z" class="stroke-B1 fill-B5 s0"/></g><text x="779" y="953.5" class="text-bold fill-N1 s2"><tspan x="779" dy="0">걸러지지 않는다</tspan><tspan x="779" dy="18.5">재현 연구는 실어 주지 않고 보상도 없다</tspan></text></g><g ><g class="shape"><path d="M1539 675h452v82h-452z" class="stroke-B1 fill-B5 s0"/></g><text x="1765" y="713.5" class="text-bold fill-N1 s2"><tspan x="1765" dy="0">고리 안 어디에도 자료를 조작하는 사람이 없다.</tspan><tspan x="1765" dy="18.5">각 칸은 그 자리에서는 합리적인 행동이다</tspan></text></g><g ><g class="shape"><path d="M2051 675h431v82h-431z" class="stroke-B1 fill-B5 s0"/></g><text x="2266.5" y="713.5" class="text-bold fill-N1 s2"><tspan x="2266.5" dy="0">그래서 ‘더 정직해지자’ 로는 끊기지 않는다.</tspan><tspan x="2266.5" dy="18.5">끊으려면 화살표 자체를 바꿔야 한다</tspan></text></g><g ><g class="shape"><path d="M2542 667h553v98h-553z" class="stroke-B1 fill-B5 s0"/></g><text x="2818.5" y="705.5" class="text-bold fill-N1 s2"><tspan x="2818.5" dy="0">실제로 바뀐 것들은 전부 화살표를 겨눈다 —</tspan><tspan x="2818.5" dy="17.667">사전등록은 선택을, 등록보고서는 출판을,</tspan><tspan x="2818.5" dy="17.667">다중연구실은 작은 표본을, 재현 특집호는 마지막 화살표를</tspan></text></g><marker id="mk-d2-1085455644-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1085455644-3488378134)" d="M675.397 132.753C578.85 172 554.25 192 554.25 228" class="connection stroke-B1 s0" mask="url(#d2-1085455644)"/><path fill="none" marker-end="url(#mk-d2-1085455644-3488378134)" d="M444.087 298.583C314.799 338 282 358 282 394" class="connection stroke-B1 s0" mask="url(#d2-1085455644)"/><path fill="none" marker-end="url(#mk-d2-1085455644-3488378134)" d="M282 497.5c0 46.8 36.4 132.7 178.24 184.136" class="connection stroke-B1 s0" mask="url(#d2-1085455644)"/><path fill="none" marker-end="url(#mk-d2-1085455644-3488378134)" d="M826.5 489.5c0 53.2-36.4 140.7-178.24 192.136" class="connection stroke-B1 s0" mask="url(#d2-1085455644)"/><text x="788" y="637" class="text-italic fill-N2 s2">작은 표본은 유의할 때 효과를 부풀린다</text><path fill="none" marker-end="url(#mk-d2-1085455644-3488378134)" d="M664.413 298.583C793.7 338 826.5 359.6 826.5 402" class="connection stroke-B1 s0" mask="url(#d2-1085455644)"/><path fill="none" marker-end="url(#mk-d2-1085455644-3488378134)" d="M554.25 751c0 50.8 24.6 124 119.294 162.494" class="connection stroke-B1 s0" mask="url(#d2-1085455644)"/><path fill="none" marker-end="url(#mk-d2-1085455644-3488378134)" d="M974.467 920.264C1214.5 876.125 1275 855 1275 840V306.5c0-24.9-61.2-135.7-302.065-179.78" class="connection stroke-B1 s0" mask="url(#d2-1085455644)"/><text x="1275.5" y="541" class="text-italic fill-N2 s2">쌓인 것이 다시 ‘알려진 사실’ 이 된다</text><marker id="mk-d2-1085455644-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1085455644-2177206569)" d="m1462.248 630.082 43.005 1.755" class="connection" mask="url(#d2-1085455644)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1085455644" width="3305" height="1249" x="-79" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-79-121h3305v1249H-79z"/><path d="M624 621h328v21H624zM1119 525h313v21h-313z"/></mask></svg>