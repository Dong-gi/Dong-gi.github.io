<svg xmlns="http://www.w3.org/2000/svg" width="2786" height="855" class="d2-808711744 d2-svg" viewBox="-101 -101 2786 855"><rect width="2786" height="855" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-808711744 .fill-N1{fill:#0a0f25}.d2-808711744 .fill-N2{fill:#676c7e}.d2-808711744 .fill-B6{fill:#f7f8fe}.d2-808711744 .stroke-B1,.d2-808711744 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="756" cy="50" class="shape stroke-B1 fill-B6 s0" rx="150" ry="50"/></g><text x="756" y="55.5" class="text-bold fill-N1 s1">무엇을 알고 싶은가</text></g><g ><g class="shape"><path d="M58 226h341v82H58z" class="stroke-B1 fill-B6 s0"/></g><text x="228.5" y="264.5" class="text-bold fill-N1 s1"><tspan x="228.5" dy="0">무엇이 일어나는지 적고 싶다</tspan><tspan x="228.5" dy="18.5">→ 기술 연구 (자연관찰 · 사례 · 조사)</tspan></text></g><text x="228.5" y="473" class="fill-N1 s1"><tspan x="228.5" dy="0">말할 수 있는 것 — 이런 일이 있었고 대략 얼마나 흔하다.</tspan><tspan x="228.5" dy="18.5">말할 수 없는 것 — 왜 그런지, 무엇이 무엇을 일으켰는지</tspan></text><g ><g class="shape"><path d="M575 226h363v82H575z" class="stroke-B1 fill-B6 s0"/></g><text x="756.5" y="264.5" class="text-bold fill-N1 s1"><tspan x="756.5" dy="0">두 가지가 함께 움직이는지 알고 싶다</tspan><tspan x="756.5" dy="18.5">→ 상관 연구</tspan></text></g><text x="756" y="465" class="fill-N1 s1"><tspan x="756" dy="0">말할 수 있는 것 — 함께 움직인다, 그리고 얼마나 세게.</tspan><tspan x="756" dy="17.667">한쪽을 알면 다른 쪽을 얼마간 예측할 수 있다.</tspan><tspan x="756" dy="17.667">말할 수 없는 것 — 어느 쪽이 원인인지, 원인이 따로 있는지</tspan></text><g ><g class="shape"><path d="M1734 313h-8l-430-45c-5 0-5-1 0-2l430-45h16l430 45c5 0 5 1 0 2l-430 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="1734" y="272.5" class="text-bold fill-N1 s1">누가 어느 조건에 들어갈지를 내가 정할 수 있는가</text></g><g ><g class="shape"><path d="M1055 434h188v82h-188z" class="stroke-B1 fill-B6 s0"/></g><text x="1149" y="472.5" class="text-bold fill-N1 s1"><tspan x="1149" dy="0">무선배정을 한다</tspan><tspan x="1149" dy="18.5">→ 실험</tspan></text></g><text x="1149" y="632" class="fill-N1 s1"><tspan x="1149" dy="0">말할 수 있는 것 — 이 조작이 이 측정치를 움직였다.</tspan><tspan x="1149" dy="18.5">말할 수 없는 것 — 실험실 밖에서도, 다른 사람에게도 같은지</tspan></text><g ><g class="shape"><path d="M1559 434h351v82h-351z" class="stroke-B1 fill-B6 s0"/></g><text x="1734.5" y="472.5" class="text-bold fill-N1 s1"><tspan x="1734.5" dy="0">정할 수 없다. 집단이 이미 갈려 있다</tspan><tspan x="1734.5" dy="18.5">→ 준실험 · 자연실험</tspan></text></g><text x="1734" y="632" class="fill-N1 s1"><tspan x="1734" dy="0">말할 수 있는 것 — 통제한 혼입변수에 대해서는 인과 주장이 버틴다.</tspan><tspan x="1734" dy="18.5">말할 수 없는 것 — 재지 않은 혼입변수에 대해서는 아무것도</tspan></text><text x="2277" y="465" class="fill-N1 s1"><tspan x="2277" dy="0"> </tspan><tspan x="2277" dy="17.667">‘정할 수 있는가’ 는 기술의 문제만이 아니다.</tspan><tspan x="2277" dy="17.667">할 수 있어도 해서는 안 되는 배정이 있다. 그것이 이 장 마지막 절의 주제다</tspan></text><marker id="mk-d2-808711744-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-808711744-2177206569)" d="M228.5 309.5v143" class="connection stroke-B2 s3" mask="url(#d2-808711744)"/><path fill="none" marker-end="url(#mk-d2-808711744-2177206569)" d="M756 309.5v135" class="connection stroke-B2 s3" mask="url(#d2-808711744)"/><path fill="none" marker-end="url(#mk-d2-808711744-2177206569)" d="M1149 518v94" class="connection stroke-B2 s3" mask="url(#d2-808711744)"/><path fill="none" marker-end="url(#mk-d2-808711744-2177206569)" d="M1734 518v94" class="connection stroke-B2 s3" mask="url(#d2-808711744)"/><marker id="mk-d2-808711744-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-808711744-3488378134)" d="M627.042 77.408C308.6 143.8 228.5 173.7 228.5 222.5" class="connection stroke-B1 s0" mask="url(#d2-808711744)"/><text x="401" y="130" class="text-italic fill-N2 s1">무엇이</text><path fill="none" marker-end="url(#mk-d2-808711744-3488378134)" d="M756 102v120.5" class="connection stroke-B1 s0" mask="url(#d2-808711744)"/><text x="756" y="169" class="text-italic fill-N2 s1">함께 움직이는가</text><path fill="none" marker-end="url(#mk-d2-808711744-3488378134)" d="M899.987 66.225C1566.8 141.6 1734 172.6 1734 217" class="connection stroke-B1 s0" mask="url(#d2-808711744)"/><text x="1341" y="122" class="text-italic fill-N2 s1">무엇 때문에</text><path fill="none" marker-end="url(#mk-d2-808711744-3488378134)" d="M1566.033 296.364C1232.8 358 1149 385.7 1149 430.5" class="connection stroke-B1 s0" mask="url(#d2-808711744)"/><text x="1333" y="345" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-808711744-3488378134)" d="M1734 315v115.5" class="connection stroke-B1 s0" mask="url(#d2-808711744)"/><text x="1734" y="379" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-808711744-2177206569)" d="M1893.962 297.39C2199.6 358.2 2276.5 388.5 2276.5 444.5" class="connection stroke-B2 s3" mask="url(#d2-808711744)"/><mask id="d2-808711744" width="2786" height="855" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2786v855H-101z"/><path d="M370 114h62v21h-62zM685 153h142v21H685zM1289 106h104v21h-104zM1321 329h24v21h-24zM1703 363h62v21h-62z"/></mask></svg>