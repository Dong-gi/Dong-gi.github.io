<svg xmlns="http://www.w3.org/2000/svg" width="1377" height="1168" class="d2-301878800 d2-svg" viewBox="-101 -101 1377 1168"><rect width="1377" height="1168" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-301878800 .fill-N1{fill:#0a0f25}.d2-301878800 .fill-N2{fill:#676c7e}.d2-301878800 .fill-B6{fill:#f7f8fe}.d2-301878800 .stroke-B1,.d2-301878800 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="361" cy="50" class="shape stroke-B1 fill-B6 s0" rx="150" ry="50"/></g><text x="361" y="55.5" class="text-bold fill-N1 s1">무엇을 알고 싶은가</text></g><g ><g class="shape"><path d="M0 221h296v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="148" y="259.5" class="text-bold fill-N1 s1"><tspan x="148" dy="0">무엇이 일어나는지 적고 싶다</tspan><tspan x="148" dy="17.667">→ 기술 연구</tspan><tspan x="148" dy="17.667">(자연관찰 · 사례 · 조사)</tspan></text></g><text x="148.5" y="479" class="fill-N1 s1"><tspan x="148.5" dy="0">말할 수 있는 것 — 이런 일이 있었고</tspan><tspan x="148.5" dy="17.25">대략 얼마나 흔하다.</tspan><tspan x="148.5" dy="17.25">말할 수 없는 것 — 왜 그런지,</tspan><tspan x="148.5" dy="17.25">무엇이 무엇을 일으켰는지</tspan></text><g ><g class="shape"><path d="M369 221h276v98H369z" class="stroke-B1 fill-B6 s0"/></g><text x="507" y="259.5" class="text-bold fill-N1 s1"><tspan x="507" dy="0">두 가지가 함께 움직이는지</tspan><tspan x="507" dy="17.667">알고 싶다</tspan><tspan x="507" dy="17.667">→ 상관 연구</tspan></text></g><text x="507.5" y="463" class="fill-N1 s1"><tspan x="507.5" dy="0">말할 수 있는 것 — 함께 움직인다,</tspan><tspan x="507.5" dy="16.833">그리고 얼마나 세게.</tspan><tspan x="507.5" dy="16.833">한쪽을 알면 다른 쪽을</tspan><tspan x="507.5" dy="16.833">얼마간 예측할 수 있다.</tspan><tspan x="507.5" dy="16.833">말할 수 없는 것 — 어느 쪽이 원인인지,</tspan><tspan x="507.5" dy="16.833">원인이 따로 있는지</tspan></text><g ><g class="shape"><path d="M884 575c-1 0-2 0-3-1l-157-75q-3-1.5 0-3l157-76q3-1.5 6 0l157 76q3 1.5 0 3l-157 75c-1 1-2 1-3 1Z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="884" y="486.5" class="text-bold fill-N1 s1"><tspan x="884" dy="0">누가 어느 조건에</tspan><tspan x="884" dy="17.667">들어갈지를 내가</tspan><tspan x="884" dy="17.667">정할 수 있는가</tspan></text></g><g ><g class="shape"><path d="M277 706h188v82H277z" class="stroke-B1 fill-B6 s0"/></g><text x="371" y="744.5" class="text-bold fill-N1 s1"><tspan x="371" dy="0">무선배정을 한다</tspan><tspan x="371" dy="18.5">→ 실험</tspan></text></g><text x="371" y="913" class="fill-N1 s1"><tspan x="371" dy="0">말할 수 있는 것 — 이 조작이</tspan><tspan x="371" dy="17.25">이 측정치를 움직였다.</tspan><tspan x="371" dy="17.25">말할 수 없는 것 — 실험실 밖에서도,</tspan><tspan x="371" dy="17.25">다른 사람에게도 같은지</tspan></text><g ><g class="shape"><path d="M610 698h235v98H610z" class="stroke-B1 fill-B6 s0"/></g><text x="727.5" y="736.5" class="text-bold fill-N1 s1"><tspan x="727.5" dy="0">정할 수 없다.</tspan><tspan x="727.5" dy="17.667">집단이 이미 갈려 있다</tspan><tspan x="727.5" dy="17.667">→ 준실험 · 자연실험</tspan></text></g><text x="727" y="913" class="fill-N1 s1"><tspan x="727" dy="0">말할 수 있는 것 — 통제한 혼입변수에</tspan><tspan x="727" dy="17.25">대해서는 인과 주장이 버틴다.</tspan><tspan x="727" dy="17.25">말할 수 없는 것 — 재지 않은</tspan><tspan x="727" dy="17.25">혼입변수에 대해서는 아무것도</tspan></text><text x="1040" y="712" class="fill-N1 s1"><tspan x="1040" dy="0"> </tspan><tspan x="1040" dy="16.833">‘정할 수 있는가’ 는</tspan><tspan x="1040" dy="16.833">기술의 문제만이 아니다.</tspan><tspan x="1040" dy="16.833">할 수 있어도 해서는</tspan><tspan x="1040" dy="16.833">안 되는 배정이 있다.</tspan><tspan x="1040" dy="16.833">그것이 이 장 마지막 절의 주제다</tspan></text><marker id="mk-d2-301878800-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-301878800-2177206569)" d="M148 321v137.5" class="connection stroke-B2 s3" mask="url(#d2-301878800)"/><path fill="none" marker-end="url(#mk-d2-301878800-2177206569)" d="M507 321v121.5" class="connection stroke-B2 s3" mask="url(#d2-301878800)"/><path fill="none" marker-end="url(#mk-d2-301878800-2177206569)" d="M371.25 790.5V893" class="connection stroke-B2 s3" mask="url(#d2-301878800)"/><path fill="none" marker-end="url(#mk-d2-301878800-2177206569)" d="M727.25 798v95" class="connection stroke-B2 s3" mask="url(#d2-301878800)"/><marker id="mk-d2-301878800-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-301878800-3488378134)" d="M277.228 92.927C174.2 146.8 148 172.7 148 217.5" class="connection stroke-B1 s0" mask="url(#d2-301878800)"/><text x="189" y="145" class="text-italic fill-N2 s1">무엇이</text><path fill="none" marker-end="url(#mk-d2-301878800-3488378134)" d="M423.593 97.209C490 147.6 507 172.7 507 217.5" class="connection stroke-B1 s0" mask="url(#d2-301878800)"/><text x="488" y="151" class="text-italic fill-N2 s1">함께 움직이는가</text><path fill="none" marker-end="url(#mk-d2-301878800-3488378134)" d="M489.959 77.403C812.4 143.8 893.5 182.4 893.5 215.25s-.9 164.15-4.155 201.765" class="connection stroke-B1 s0" mask="url(#d2-301878800)"/><text x="811" y="149" class="text-italic fill-N2 s1">무엇 때문에</text><path fill="none" marker-end="url(#mk-d2-301878800-3488378134)" d="M777.07 525.523C452.799 613.4 371.25 649.5 371.25 701.5" class="connection stroke-B1 s0" mask="url(#d2-301878800)"/><text x="546" y="594" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-301878800-3488378134)" d="M823.517 548.342C746.8 617.8 727.25 647.9 727.25 693.5" class="connection stroke-B1 s0" mask="url(#d2-301878800)"/><text x="754" y="617" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-301878800-2177206569)" d="M943.49 549.334C1020.2 618 1039.75 647.7 1039.75 692.5" class="connection stroke-B2 s3" mask="url(#d2-301878800)"/><mask id="d2-301878800" width="1377" height="1168" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1377v1168H-101z"/><path d="M158 129h62v21h-62zM417 135h142v21H417zM759 133h104v21H759zM534 578h24v21h-24zM723 601h62v21h-62z"/></mask></svg>