<svg xmlns="http://www.w3.org/2000/svg" width="2261" height="1158" class="d2-2098311764 d2-svg" viewBox="-91 -121 2261 1158"><rect width="2261" height="1158" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2098311764 .fill-N1{fill:#0a0f25}.d2-2098311764 .fill-B4{fill:#e3e9fd}.d2-2098311764 .fill-B5{fill:#edf0fd}.d2-2098311764 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M10 20h2059v142H10z" class="stroke-B1 fill-B4 s0"/></g><text x="1039.5" y="7" class="fill-N1 s1">시작하기 전</text></g><g ><g class="shape"><path d="M878 323h1029v142H878z" class="stroke-B1 fill-B4 s0"/></g><text x="1392.5" y="310" class="fill-N1 s1">진행하는 동안</text></g><g ><g class="shape"><path d="M175 605h1762v142H175z" class="stroke-B1 fill-B4 s0"/></g><text x="1056" y="592" class="fill-N1 s1">끝난 뒤</text></g><g ><g class="shape"><path d="M78 323h760v142H78z" class="stroke-B1 fill-B4 s0"/></g><text x="458" y="310" class="fill-N1 s1">속임은 언제 허락되는가</text></g><text x="1644.5" y="883" class="fill-N1 s2"><tspan x="1644.5" dy="0"> </tspan><tspan x="1644.5" dy="17.25">이 규칙들은 책상에서 만들어진 것이 아니라 실제로 사람이 해를 입은 뒤에 만들어졌다.</tspan><tspan x="1644.5" dy="17.25">20세기 중반의 몇몇 연구가 그 계기였고, 18장에서 그 가운데 둘을 다시 본다.</tspan><tspan x="1644.5" dy="17.25">규칙을 외우는 것보다 ‘무엇을 막으려고 생긴 규칙인가’ 를 아는 편이 쓸모 있다</tspan></text><g ><g class="shape"><path d="M40 50h514v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="297" y="88.5" class="text-bold fill-N1 s2"><tspan x="297" dy="0">1. 이 연구가 낼 수 있는 앎이 참가자가 질 부담보다 큰가</tspan><tspan x="297" dy="18.5">부담이 크면 설계를 바꾸거나 하지 않는다</tspan></text></g><g ><g class="shape"><path d="M789 50h525v82H789z" class="stroke-B1 fill-B5 s0"/></g><text x="1051.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="1051.5" dy="0">2. 참가자가 무엇을 하게 되는지 알고 스스로 들어오는가</tspan><tspan x="1051.5" dy="18.5">사전동의 — 미리, 이해할 수 있는 말로, 압력 없이</tspan></text></g><g ><g class="shape"><path d="M1554 50h485v82h-485z" class="stroke-B1 fill-B5 s0"/></g><text x="1796.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="1796.5" dy="0">3. 연구자 자신이 아닌 사람이 이 판단을 검토했는가</tspan><tspan x="1796.5" dy="18.5">기관생명윤리위원회 같은 외부 심사</tspan></text></g><g ><g class="shape"><path d="M908 353h444v82H908z" class="stroke-B1 fill-B5 s0"/></g><text x="1130" y="391.5" class="text-bold fill-N1 s2"><tspan x="1130" dy="0">4. 참가자가 언제든 이유 없이 그만둘 수 있는가</tspan><tspan x="1130" dy="18.5">그만둔다고 불이익이 없어야 한다</tspan></text></g><g ><g class="shape"><path d="M1412 361h465v66h-465z" class="stroke-B1 fill-B5 s0"/></g><text x="1644.5" y="399.5" class="text-bold fill-N1 s2">5. 자료가 누구의 것인지 알아볼 수 없게 다루는가</text></g><g ><g class="shape"><path d="M205 635h507v82H205z" class="stroke-B1 fill-B5 s0"/></g><text x="458.5" y="673.5" class="text-bold fill-N1 s2"><tspan x="458.5" dy="0">6. 속임을 썼다면 끝나고 반드시 밝히는가</tspan><tspan x="458.5" dy="18.5">사후설명 — 무엇을 왜 감췄는지, 실제 결과가 무엇인지</tspan></text></g><g ><g class="shape"><path d="M1382 643h525v66h-525z" class="stroke-B1 fill-B5 s0"/></g><text x="1644.5" y="681.5" class="text-bold fill-N1 s2">7. 참가자가 들어오기 전보다 나쁜 상태로 나가지 않는가</text></g><g ><g class="shape"><path d="M108 353h700v82H108z" class="stroke-B1 fill-B5 s0"/></g><text x="458" y="391.5" class="text-bold fill-N1 s2"><tspan x="458" dy="0">속이지 않으면 그 물음을 물을 수 없고, 부담이 작고, 사후설명이 보장될 때만.</tspan><tspan x="458" dy="18.5">‘그러는 편이 편해서’ 는 이유가 되지 않는다</tspan></text></g><marker id="mk-d2-2098311764-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2098311764-3488378134)" d="M1644.75 163.5v156" class="connection stroke-B1 s0" mask="url(#d2-2098311764)"/><path fill="none" marker-end="url(#mk-d2-2098311764-3488378134)" d="M1644.75 467v134" class="connection stroke-B1 s0" mask="url(#d2-2098311764)"/><path fill="none" marker-end="url(#mk-d2-2098311764-3488378134)" d="M787.273 131.305C524.45 171.8 458.25 250.5 458.25 278.5" class="connection stroke-B1 s0" mask="url(#d2-2098311764)"/><text x="590" y="167" style="fill:#676c7e;text-anchor:middle;font-size:16px">동의와 부딪히는 자리</text><path fill="none" marker-end="url(#mk-d2-2098311764-3488378134)" d="M458.25 467v164" class="connection stroke-B1 s0" mask="url(#d2-2098311764)"/><marker id="mk-d2-2098311764-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2098311764-2177206569)" d="M1644.75 749v114" class="connection" mask="url(#d2-2098311764)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-2098311764" width="2261" height="1158" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h2261v1158H-91z"/><path d="M498 151h184v21H498z"/></mask></svg>