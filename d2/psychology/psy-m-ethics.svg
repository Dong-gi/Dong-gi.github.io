<svg xmlns="http://www.w3.org/2000/svg" width="1368" height="1276" class="d2-2875759536 d2-svg" viewBox="-89 -89 1368 1276"><rect width="1368" height="1276" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2875759536 .fill-N1{fill:#0a0f25}.d2-2875759536 .fill-B4{fill:#e3e9fd}.d2-2875759536 .fill-B5{fill:#edf0fd}.d2-2875759536 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M12 12h1079v214H12z" class="stroke-B1 fill-B4 s0"/></g><text x="551.5" y="45" class="fill-N1 s1">시작하기 전</text></g><g ><g class="shape"><path d="M510 402h668v214H510z" class="stroke-B1 fill-B4 s0"/></g><text x="844" y="435" class="fill-N1 s1">진행하는 동안</text></g><g ><g class="shape"><path d="M295 701h807v198H295z" class="stroke-B1 fill-B4 s0"/></g><text x="698.5" y="734" class="fill-N1 s1">끝난 뒤</text></g><g ><g class="shape"><path d="M18 402h472v214H18z" class="stroke-B1 fill-B4 s0"/></g><text x="254" y="435" class="fill-N1 s1">속임은 언제 허락되는가</text></g><text x="449" y="985" class="fill-N1 s2"><tspan x="449" dy="0"> </tspan><tspan x="449" dy="16.714">이 규칙들은 책상에서 만들어진 것이 아니라</tspan><tspan x="449" dy="16.714">실제로 사람이 해를 입은 뒤에 만들어졌다.</tspan><tspan x="449" dy="16.714">20세기 중반의 몇몇 연구가 그 계기였고,</tspan><tspan x="449" dy="16.714">18장에서 그 가운데 둘을 다시 본다.</tspan><tspan x="449" dy="16.714">규칙을 외우는 것보다 ‘무엇을 막으려고 생긴 규칙인가’ 를</tspan><tspan x="449" dy="16.714">아는 편이 쓸모 있다</tspan></text><g ><g class="shape"><path d="M62 62h278v114H62z" class="stroke-B1 fill-B5 s0"/></g><text x="201" y="100.5" class="text-bold fill-N1 s2"><tspan x="201" dy="0">1. 이 연구가 낼 수 있는 앎이</tspan><tspan x="201" dy="17.25">참가자가 질 부담보다 큰가</tspan><tspan x="201" dy="17.25">부담이 크면 설계를</tspan><tspan x="201" dy="17.25">바꾸거나 하지 않는다</tspan></text></g><g ><g class="shape"><path d="M360 62h368v114H360z" class="stroke-B1 fill-B5 s0"/></g><text x="544" y="100.5" class="text-bold fill-N1 s2"><tspan x="544" dy="0">2. 참가자가 무엇을 하게 되는지 알고</tspan><tspan x="544" dy="17.25">스스로 들어오는가</tspan><tspan x="544" dy="17.25">사전동의 — 미리, 이해할 수 있는 말로,</tspan><tspan x="544" dy="17.25">압력 없이</tspan></text></g><g ><g class="shape"><path d="M748 62h293v114H748z" class="stroke-B1 fill-B5 s0"/></g><text x="894.5" y="100.5" class="text-bold fill-N1 s2"><tspan x="894.5" dy="0">3. 연구자 자신이 아닌 사람이</tspan><tspan x="894.5" dy="17.25">이 판단을 검토했는가</tspan><tspan x="894.5" dy="17.25">기관생명윤리위원회 같은</tspan><tspan x="894.5" dy="17.25">외부 심사</tspan></text></g><g ><g class="shape"><path d="M560 452h293v114H560z" class="stroke-B1 fill-B5 s0"/></g><text x="706.5" y="490.5" class="text-bold fill-N1 s2"><tspan x="706.5" dy="0">4. 참가자가 언제든 이유 없이</tspan><tspan x="706.5" dy="17.25">그만둘 수 있는가</tspan><tspan x="706.5" dy="17.25">그만둔다고 불이익이</tspan><tspan x="706.5" dy="17.25">없어야 한다</tspan></text></g><g ><g class="shape"><path d="M873 468h255v82H873z" class="stroke-B1 fill-B5 s0"/></g><text x="1000.5" y="506.5" class="text-bold fill-N1 s2"><tspan x="1000.5" dy="0">5. 자료가 누구의 것인지</tspan><tspan x="1000.5" dy="18.5">알아볼 수 없게 다루는가</tspan></text></g><g ><g class="shape"><path d="M345 751h397v98H345z" class="stroke-B1 fill-B5 s0"/></g><text x="543.5" y="789.5" class="text-bold fill-N1 s2"><tspan x="543.5" dy="0">6. 속임을 썼다면 끝나고 반드시 밝히는가</tspan><tspan x="543.5" dy="17.667">사후설명 — 무엇을 왜 감췄는지,</tspan><tspan x="543.5" dy="17.667">실제 결과가 무엇인지</tspan></text></g><g ><g class="shape"><path d="M762 759h290v82H762z" class="stroke-B1 fill-B5 s0"/></g><text x="907" y="797.5" class="text-bold fill-N1 s2"><tspan x="907" dy="0">7. 참가자가 들어오기 전보다</tspan><tspan x="907" dy="18.5">나쁜 상태로 나가지 않는가</tspan></text></g><g ><g class="shape"><path d="M68 452h372v114H68z" class="stroke-B1 fill-B5 s0"/></g><text x="254" y="490.5" class="text-bold fill-N1 s2"><tspan x="254" dy="0">속이지 않으면 그 물음을 물을 수 없고,</tspan><tspan x="254" dy="17.25">부담이 작고, 사후설명이 보장될 때만.</tspan><tspan x="254" dy="17.25">‘그러는 편이 편해서’ 는</tspan><tspan x="254" dy="17.25">이유가 되지 않는다</tspan></text></g><marker id="mk-d2-2875759536-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2875759536-3488378134)" d="M844 228v170" class="connection stroke-B1 s0" mask="url(#d2-2875759536)"/><path fill="none" marker-end="url(#mk-d2-2875759536-3488378134)" d="M554 618v79" class="connection stroke-B1 s0" mask="url(#d2-2875759536)"/><path fill="none" marker-end="url(#mk-d2-2875759536-3488378134)" d="M544 178v83s0 10-10 10H264s-10 0-10 10v117" class="connection stroke-B1 s0" mask="url(#d2-2875759536)"/><text x="381" y="277" style="fill:#676c7e;text-anchor:middle;font-size:16px">동의와 부딪히는 자리</text><path fill="none" marker-end="url(#mk-d2-2875759536-3488378134)" d="M254 618v28s0 10 10 10h270s10 0 10 10v81" class="connection stroke-B1 s0" mask="url(#d2-2875759536)"/><marker id="mk-d2-2875759536-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2875759536-2177206569)" d="M449.75 901v64" class="connection" mask="url(#d2-2875759536)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-2875759536" width="1368" height="1276" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1368v1276H-89z"/><path d="M289 261h184v21H289z"/></mask></svg>