<svg xmlns="http://www.w3.org/2000/svg" width="3502" height="1062" class="d2-3513543994 d2-svg" viewBox="-81 -85 3502 1062"><rect width="3502" height="1062" x="-81" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3513543994 .fill-N1{fill:#0a0f25}.d2-3513543994 .fill-B4{fill:#e3e9fd}.d2-3513543994 .fill-B5{fill:#edf0fd}.d2-3513543994 .stroke-B1,.d2-3513543994 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M20 64h450v812H20z" class="stroke-B1 fill-B4 s0"/></g><text x="245" y="51" class="fill-N1 s1">무엇이 문제였나</text></g><g ><g class="shape"><path d="M610 56h729v820H610z" class="stroke-B1 fill-B4 s0"/></g><text x="974.5" y="43" class="fill-N1 s1">무엇이 생겼나</text></g><g ><g class="shape"><path d="M1479 356h785v394h-785z" class="stroke-B1 fill-B4 s0"/></g><text x="1871.5" y="343" class="fill-N1 s1">바뀌었다는 근거</text></g><g ><g class="shape"><path d="M2404 372h916v378h-916z" class="stroke-B1 fill-B4 s0"/></g><text x="2862" y="359" class="fill-N1 s1">아직 남은 것</text></g><g ><g class="shape"><path d="M54 94h383v66H54z" class="stroke-B1 fill-B5 s0"/></g><text x="245.5" y="132.5" class="text-bold fill-N1 s2">결과를 보고 나서 가설과 분석을 정한다</text></g><g ><g class="shape"><path d="M139 244h212v66H139z" class="stroke-B1 fill-B5 s0"/></g><text x="245" y="282.5" class="text-bold fill-N1 s2">유의한 것만 실린다</text></g><g ><g class="shape"><path d="M107 394h276v66H107z" class="stroke-B1 fill-B5 s0"/></g><text x="245" y="432.5" class="text-bold fill-N1 s2">표본이 작아 검정력이 낮다</text></g><g ><g class="shape"><path d="M107 528h276v66H107z" class="stroke-B1 fill-B5 s0"/></g><text x="245" y="566.5" class="text-bold fill-N1 s2">재현을 아무도 하지 않는다</text></g><g ><g class="shape"><path d="M50 654h390v66H50z" class="stroke-B1 fill-B5 s0"/></g><text x="245" y="692.5" class="text-bold fill-N1 s2">자료와 재료를 볼 수 없어 확인이 안 된다</text></g><g ><g class="shape"><path d="M77 780h336v66H77z" class="stroke-B1 fill-B5 s0"/></g><text x="245" y="818.5" class="text-bold fill-N1 s2">효과크기 없이 유의성만 보고한다</text></g><g ><g class="shape"><path d="M640 86h669v82H640z" class="stroke-B1 fill-B5 s0"/></g><text x="974.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="974.5" dy="0">사전등록</tspan><tspan x="974.5" dy="18.5">가설 · 표본 크기 · 제외 기준 · 분석을 자료 보기 전에 공개 저장소에 올린다</tspan></text></g><g ><g class="shape"><path d="M698 228h553v98H698z" class="stroke-B1 fill-B5 s0"/></g><text x="974.5" y="266.5" class="text-bold fill-N1 s2"><tspan x="974.5" dy="0">등록보고서</tspan><tspan x="974.5" dy="17.667">결과가 나오기 전에 설계만으로 심사하고 게재를 확정한다.</tspan><tspan x="974.5" dy="17.667">결과가 어떻게 나오든 실린다</tspan></text></g><g ><g class="shape"><path d="M687 386h575v82H687z" class="stroke-B1 fill-B5 s0"/></g><text x="974.5" y="424.5" class="text-bold fill-N1 s2"><tspan x="974.5" dy="0">다중연구실 프로젝트</tspan><tspan x="974.5" dy="18.5">여러 나라의 연구실이 같은 절차로 동시에 재서 표본을 키운다</tspan></text></g><g ><g class="shape"><path d="M793 528h363v66H793z" class="stroke-B1 fill-B5 s0"/></g><text x="974.5" y="566.5" class="text-bold fill-N1 s2">재현 연구를 싣는 지면과 재현 특집호</text></g><g ><g class="shape"><path d="M707 654h535v66H707z" class="stroke-B1 fill-B5 s0"/></g><text x="974.5" y="692.5" class="text-bold fill-N1 s2">자료 · 재료 · 분석 코드 공개, 그리고 그것을 표시하는 배지</text></g><g ><g class="shape"><path d="M712 780h525v66H712z" class="stroke-B1 fill-B5 s0"/></g><text x="974.5" y="818.5" class="text-bold fill-N1 s2">효과크기와 구간을 함께 보고하도록 학술지가 요구한다</text></g><g ><g class="shape"><path d="M1509 386h725v82h-725z" class="stroke-B1 fill-B5 s0"/></g><text x="1871.5" y="424.5" class="text-bold fill-N1 s2"><tspan x="1871.5" dy="0">등록보고서로 실린 논문에서는 가설이 지지된 비율이 표준 논문보다 훨씬 낮다.</tspan><tspan x="1871.5" dy="18.5">같은 분야에서 같은 종류의 물음을 다루는데 그렇다</tspan></text></g><g ><g class="shape"><path d="M1615 528h513v66h-513z" class="stroke-B1 fill-B5 s0"/></g><text x="1871.5" y="566.5" class="text-bold fill-N1 s2">표본 크기가 커졌고, 다중연구실 재현이 정례가 되었다</text></g><g ><g class="shape"><path d="M1562 654h620v66h-620z" class="stroke-B1 fill-B5 s0"/></g><text x="1872" y="692.5" class="text-bold fill-N1 s2">‘이 결과는 재현되었는가’ 가 논문을 읽을 때의 기본 물음이 되었다</text></g><g ><g class="shape"><path d="M2434 402h856v66h-856z" class="stroke-B1 fill-B5 s0"/></g><text x="2862" y="440.5" class="text-bold fill-N1 s2">사전등록을 했다고 계획대로 했다는 뜻은 아니다. 벗어난 곳을 밝히지 않으면 확인할 길이 없다</text></g><g ><g class="shape"><path d="M2466 528h792v66h-792z" class="stroke-B1 fill-B5 s0"/></g><text x="2862" y="566.5" class="text-bold fill-N1 s2">재현이 여전히 잘 보상되지 않는다. 지면은 생겼지만 채용과 승진의 셈법은 덜 바뀌었다</text></g><g ><g class="shape"><path d="M2544 654h636v66h-636z" class="stroke-B1 fill-B5 s0"/></g><text x="2862" y="692.5" class="text-bold fill-N1 s2">2015년 이전에 쌓인 문헌은 대부분 다시 확인되지 않은 채로 남아 있다</text></g><marker id="mk-d2-3513543994-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3513543994-3488378134)" d="M439 127h197" class="connection stroke-B1 s0" mask="url(#d2-3513543994)"/><path fill="none" marker-end="url(#mk-d2-3513543994-3488378134)" d="M353 277h341" class="connection stroke-B1 s0" mask="url(#d2-3513543994)"/><path fill="none" marker-end="url(#mk-d2-3513543994-3488378134)" d="M385 427h298" class="connection stroke-B1 s0" mask="url(#d2-3513543994)"/><path fill="none" marker-end="url(#mk-d2-3513543994-3488378134)" d="M385 561h404" class="connection stroke-B1 s0" mask="url(#d2-3513543994)"/><path fill="none" marker-end="url(#mk-d2-3513543994-3488378134)" d="M442 687h261" class="connection stroke-B1 s0" mask="url(#d2-3513543994)"/><path fill="none" marker-end="url(#mk-d2-3513543994-3488378134)" d="M415 813h293" class="connection stroke-B1 s0" mask="url(#d2-3513543994)"/><marker id="mk-d2-351354