<svg xmlns="http://www.w3.org/2000/svg" width="1573" height="1578" class="d2-1170923413 d2-svg" viewBox="-101 -101 1573 1578"><rect width="1573" height="1578" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1170923413 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1170923413 .fill-N1{fill:#0a0f25}.d2-1170923413 .fill-B4{fill:#e3e9fd}.d2-1170923413 .fill-B5{fill:#edf0fd}.d2-1170923413 .stroke-B1,.d2-1170923413 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h608v844H0z" class="stroke-B1 fill-B4 s0"/></g><text x="304" y="33" class="fill-N1 s1">무엇이 문제였나</text></g><g ><g class="shape"><path d="M698 0h673v844H698z" class="stroke-B1 fill-B4 s0"/></g><text x="1034.5" y="33" class="fill-N1 s1">무엇이 생겼나</text></g><g ><g class="shape"><path d="M0 914h608v462H0z" class="stroke-B1 fill-B4 s0"/></g><text x="304" y="947" class="fill-N1 s1">아직 남은 것</text></g><g ><g class="shape"><path d="M698 914h673v462H698z" class="stroke-B1 fill-B4 s0"/></g><text x="1034.5" y="947" class="fill-N1 s1">바뀌었다는 근거</text></g><g ><g class="shape"><path d="M60 60h276v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="198" y="98.5" class="text-bold fill-N1 s2"><tspan x="198" dy="0">결과를 보고 나서</tspan><tspan x="198" dy="18.5">가설과 분석을 정한다</tspan></text></g><g ><g class="shape"><path d="M60 182h276v66H60z" class="stroke-B1 fill-B5 s0"/></g><text x="198" y="220.5" class="text-bold fill-N1 s2">유의한 것만 실린다</text></g><g ><g class="shape"><path d="M60 288h276v66H60z" class="stroke-B1 fill-B5 s0"/></g><text x="198" y="326.5" class="text-bold fill-N1 s2">표본이 작아 검정력이 낮다</text></g><g ><g class="shape"><path d="M60 394h276v66H60z" class="stroke-B1 fill-B5 s0"/></g><text x="198" y="432.5" class="text-bold fill-N1 s2">재현을 아무도 하지 않는다</text></g><g ><g class="shape"><path d="M60 500h276v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="198" y="538.5" class="text-bold fill-N1 s2"><tspan x="198" dy="0">자료와 재료를 볼 수 없어</tspan><tspan x="198" dy="18.5">확인이 안 된다</tspan></text></g><g ><g class="shape"><path d="M60 622h276v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="198" y="660.5" class="text-bold fill-N1 s2"><tspan x="198" dy="0">효과크기 없이</tspan><tspan x="198" dy="18.5">유의성만 보고한다</tspan></text></g><g ><g class="shape"><path d="M758 60h553v98H758z" class="stroke-B1 fill-B5 s0"/></g><text x="1034.5" y="98.5" class="text-bold fill-N1 s2"><tspan x="1034.5" dy="0">사전등록</tspan><tspan x="1034.5" dy="17.667">가설 · 표본 크기 · 제외 기준 · 분석을</tspan><tspan x="1034.5" dy="17.667">자료 보기 전에 공개 저장소에 올린다</tspan></text></g><g ><g class="shape"><path d="M758 198h553v98H758z" class="stroke-B1 fill-B5 s0"/></g><text x="1034.5" y="236.5" class="text-bold fill-N1 s2"><tspan x="1034.5" dy="0">등록보고서</tspan><tspan x="1034.5" dy="17.667">결과가 나오기 전에 설계만으로 심사하고 게재를 확정한다.</tspan><tspan x="1034.5" dy="17.667">결과가 어떻게 나오든 실린다</tspan></text></g><g ><g class="shape"><path d="M758 336h553v98H758z" class="stroke-B1 fill-B5 s0"/></g><text x="1034.5" y="374.5" class="text-bold fill-N1 s2"><tspan x="1034.5" dy="0">다중연구실 프로젝트</tspan><tspan x="1034.5" dy="17.667">여러 나라의 연구실이 같은 절차로</tspan><tspan x="1034.5" dy="17.667">동시에 재서 표본을 키운다</tspan></text></g><g ><g class="shape"><path d="M758 474h553v66H758z" class="stroke-B1 fill-B5 s0"/></g><text x="1034.5" y="512.5" class="text-bold fill-N1 s2">재현 연구를 싣는 지면과 재현 특집호</text></g><g ><g class="shape"><path d="M758 580h553v82H758z" class="stroke-B1 fill-B5 s0"/></g><text x="1034.5" y="618.5" class="text-bold fill-N1 s2"><tspan x="1034.5" dy="0">자료 · 재료 · 분석 코드 공개,</tspan><tspan x="1034.5" dy="18.5">그리고 그것을 표시하는 배지</tspan></text></g><g ><g class="shape"><path d="M758 702h553v82H758z" class="stroke-B1 fill-B5 s0"/></g><text x="1034.5" y="740.5" class="text-bold fill-N1 s2"><tspan x="1034.5" dy="0">효과크기와 구간을 함께 보고하도록</tspan><tspan x="1034.5" dy="18.5">학술지가 요구한다</tspan></text></g><g ><g class="shape"><path d="M60 974h488v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="304" y="1012.5" class="text-bold fill-N1 s2"><tspan x="304" dy="0">사전등록을 했다고 계획대로 했다는 뜻은 아니다.</tspan><tspan x="304" dy="18.5">벗어난 곳을 밝히지 않으면 확인할 길이 없다</tspan></text></g><g ><g class="shape"><path d="M60 1096h488v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="304" y="1134.5" class="text-bold fill-N1 s2"><tspan x="304" dy="0">재현이 여전히 잘 보상되지 않는다.</tspan><tspan x="304" dy="18.5">지면은 생겼지만 채용과 승진의 셈법은 덜 바뀌었다</tspan></text></g><g ><g class="shape"><path d="M60 1218h488v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="304" y="1256.5" class="text-bold fill-N1 s2"><tspan x="304" dy="0">2015년 이전에 쌓인 문헌은 대부분</tspan><tspan x="304" dy="18.5">다시 확인되지 않은 채로 남아 있다</tspan></text></g><g ><g class="shape"><path d="M758 974h488v98H758z" class="stroke-B1 fill-B5 s0"/></g><text x="1002" y="1012.5" class="text-bold fill-N1 s2"><tspan x="1002" dy="0">등록보고서로 실린 논문에서는</tspan><tspan x="1002" dy="17.667">가설이 지지된 비율이 표준 논문보다 훨씬 낮다.</tspan><tspan x="1002" dy="17.667">같은 분야에서 같은 종류의 물음을 다루는데 그렇다</tspan></text></g><g ><g class="shape"><path d="M758 1112h488v82H758z" class="stroke-B1 fill-B5 s0"/></g><text x="1002" y="1150.5" class="text-bold fill-N1 s2"><tspan x="1002" dy="0">표본 크기가 커졌고,</tspan><tspan x="1002" dy="18.5">다중연구실 재현이 정례가 되었다</tspan></text></g><g ><g class="shape"><path d="M758 1234h488v82H758z" class="stroke-B1 fill-B5 s0"/></g><text x="1002" y="1272.5" class="text-bold fill-N1 s2"><tspan x="1002" dy="0">‘이 결과는 재현되었는가’ 가</tspan><tspan x="1002" dy="18.5">논문을 읽을 때의 기본 물음이 되었다</tspan></text></g><marker id="mk-d2-1170923413-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1170923413-3488378134)" d="m337.5 102.019 417 3.943" class="connection stroke-B1 s0" mask="url(#d2-1170923413)"/><path fill="none" marker-end="url(#mk-d2-1170923413-3488378134)" d="m337.499 220.076 417.004 15.773" class="connection stroke-B1 s0" mask="url(#d2-1170923413)"/><path fill="none" marker-end="url(#mk-d2-1170923413-3488378134)" d="m337.494 332.15 417.017 31.548" class="connection stroke-B1 s0" mask="url(#d2-1170923413)"/><path fill="none" marker-end="url(#mk-d2-1170923413-3488378134)" d="m337.491 440.188 417.027 39.435" class="connection stroke-B1 s0" mask="url(#d2-1170923413)"/><path fill="none" marker-end="url(#mk-d2-1170923413-3488378134)" d="m337.491 554.188 417.027 39.435" class="connection stroke-B1 s0" mask="url(#d2-1170923413)"/><path fill="none" marker-end="url(#mk-d2-1170923413-3488378134)" d="m337.491 676.188 417.027 39.435" class="connection stroke-B1 s0" mask="url(#d2-1170923413)"/><marker id="mk-d2-1170923413-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1170923413-2177206569)" d="M1034.5 846v64" class="connection stroke-B2 s4" mask="url(#d2-1170923413)"/><path fill="none" marker-end="url(#mk-d2-1170923413-2177206569)" d="M696 1145h-84" class="connection stroke-B2 s4" mask="url(#d2-1170923413)"/><mask id="d2-1170923413" width="1573" height="1578" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1573v1578H-101z"/></mask></svg>