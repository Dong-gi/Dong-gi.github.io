<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1451" class="d2-1062660933 d2-svg" viewBox="-101 -101 1100 1451"><rect width="1100" height="1451" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1062660933 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1062660933 .fill-N1{fill:#0a0f25}.d2-1062660933 .fill-B4{fill:#e3e9fd}.d2-1062660933 .fill-B5{fill:#edf0fd}.d2-1062660933 .stroke-B1,.d2-1062660933 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h395v752H0z" class="stroke-B1 fill-B4 s0"/></g><text x="197.5" y="33" class="fill-N1 s1">무엇이 문제였나</text></g><g ><g class="shape"><path d="M485 0h413v752H485z" class="stroke-B1 fill-B4 s0"/></g><text x="691.5" y="33" class="fill-N1 s1">무엇이 생겼나</text></g><g ><g class="shape"><path d="M0 802h395v447H0z" class="stroke-B1 fill-B4 s0"/></g><text x="197.5" y="835" class="fill-N1 s1">아직 남은 것</text></g><g ><g class="shape"><path d="M485 802h413v447H485z" class="stroke-B1 fill-B4 s0"/></g><text x="691.5" y="835" class="fill-N1 s1">바뀌었다는 근거</text></g><g ><g class="shape"><path d="M25 46h276v82H25z" class="stroke-B1 fill-B5 s0"/></g><text x="163" y="84.5" class="text-bold fill-N1 s2"><tspan x="163" dy="0">결과를 보고 나서</tspan><tspan x="163" dy="18.5">가설과 분석을 정한다</tspan></text></g><g ><g class="shape"><path d="M25 153h276v66H25z" class="stroke-B1 fill-B5 s0"/></g><text x="163" y="191.5" class="text-bold fill-N1 s2">유의한 것만 실린다</text></g><g ><g class="shape"><path d="M25 244h276v66H25z" class="stroke-B1 fill-B5 s0"/></g><text x="163" y="282.5" class="text-bold fill-N1 s2">표본이 작아 검정력이 낮다</text></g><g ><g class="shape"><path d="M25 335h276v66H25z" class="stroke-B1 fill-B5 s0"/></g><text x="163" y="373.5" class="text-bold fill-N1 s2">재현을 아무도 하지 않는다</text></g><g ><g class="shape"><path d="M25 426h276v82H25z" class="stroke-B1 fill-B5 s0"/></g><text x="163" y="464.5" class="text-bold fill-N1 s2"><tspan x="163" dy="0">자료와 재료를 볼 수 없어</tspan><tspan x="163" dy="18.5">확인이 안 된다</tspan></text></g><g ><g class="shape"><path d="M25 533h276v82H25z" class="stroke-B1 fill-B5 s0"/></g><text x="163" y="571.5" class="text-bold fill-N1 s2"><tspan x="163" dy="0">효과크기 없이</tspan><tspan x="163" dy="18.5">유의성만 보고한다</tspan></text></g><g ><g class="shape"><path d="M510 46h363v98H510z" class="stroke-B1 fill-B5 s0"/></g><text x="691.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="691.5" dy="0">사전등록</tspan><tspan x="691.5" dy="17.667">가설 · 표본 크기 · 제외 기준 · 분석을</tspan><tspan x="691.5" dy="17.667">자료 보기 전에 공개 저장소에 올린다</tspan></text></g><g ><g class="shape"><path d="M510 169h363v114H510z" class="stroke-B1 fill-B5 s0"/></g><text x="691.5" y="207.5" class="text-bold fill-N1 s2"><tspan x="691.5" dy="0">등록보고서</tspan><tspan x="691.5" dy="17.25">결과가 나오기 전에 설계만으로</tspan><tspan x="691.5" dy="17.25">심사하고 게재를 확정한다.</tspan><tspan x="691.5" dy="17.25">결과가 어떻게 나오든 실린다</tspan></text></g><g ><g class="shape"><path d="M510 308h363v98H510z" class="stroke-B1 fill-B5 s0"/></g><text x="691.5" y="346.5" class="text-bold fill-N1 s2"><tspan x="691.5" dy="0">다중연구실 프로젝트</tspan><tspan x="691.5" dy="17.667">여러 나라의 연구실이 같은 절차로</tspan><tspan x="691.5" dy="17.667">동시에 재서 표본을 키운다</tspan></text></g><g ><g class="shape"><path d="M510 431h363v82H510z" class="stroke-B1 fill-B5 s0"/></g><text x="691.5" y="469.5" class="text-bold fill-N1 s2"><tspan x="691.5" dy="0">재현 연구를 싣는 지면과</tspan><tspan x="691.5" dy="18.5">재현 특집호</tspan></text></g><g ><g class="shape"><path d="M510 538h363v82H510z" class="stroke-B1 fill-B5 s0"/></g><text x="691.5" y="576.5" class="text-bold fill-N1 s2"><tspan x="691.5" dy="0">자료 · 재료 · 분석 코드 공개,</tspan><tspan x="691.5" dy="18.5">그리고 그것을 표시하는 배지</tspan></text></g><g ><g class="shape"><path d="M510 645h363v82H510z" class="stroke-B1 fill-B5 s0"/></g><text x="691.5" y="683.5" class="text-bold fill-N1 s2"><tspan x="691.5" dy="0">효과크기와 구간을 함께 보고하도록</tspan><tspan x="691.5" dy="18.5">학술지가 요구한다</tspan></text></g><g ><g class="shape"><path d="M25 848h345v114H25z" class="stroke-B1 fill-B5 s0"/></g><text x="197.5" y="886.5" class="text-bold fill-N1 s2"><tspan x="197.5" dy="0">사전등록을 했다고</tspan><tspan x="197.5" dy="17.25">계획대로 했다는 뜻은 아니다.</tspan><tspan x="197.5" dy="17.25">벗어난 곳을 밝히지 않으면</tspan><tspan x="197.5" dy="17.25">확인할 길이 없다</tspan></text></g><g ><g class="shape"><path d="M25 987h345v98H25z" class="stroke-B1 fill-B5 s0"/></g><text x="197.5" y="1025.5" class="text-bold fill-N1 s2"><tspan x="197.5" dy="0">재현이 여전히 잘 보상되지 않는다.</tspan><tspan x="197.5" dy="17.667">지면은 생겼지만</tspan><tspan x="197.5" dy="17.667">채용과 승진의 셈법은 덜 바뀌었다</tspan></text></g><g ><g class="shape"><path d="M25 1110h345v82H25z" class="stroke-B1 fill-B5 s0"/></g><text x="197.5" y="1148.5" class="text-bold fill-N1 s2"><tspan x="197.5" dy="0">2015년 이전에 쌓인 문헌은 대부분</tspan><tspan x="197.5" dy="18.5">다시 확인되지 않은 채로 남아 있다</tspan></text></g><g ><g class="shape"><path d="M510 848h313v130H510z" class="stroke-B1 fill-B5 s0"/></g><text x="666.5" y="886.5" class="text-bold fill-N1 s2"><tspan x="666.5" dy="0">등록보고서로 실린 논문에서는</tspan><tspan x="666.5" dy="17">가설이 지지된 비율이</tspan><tspan x="666.5" dy="17">표준 논문보다 훨씬 낮다.</tspan><tspan x="666.5" dy="17">같은 분야에서 같은 종류의</tspan><tspan x="666.5" dy="17">물음을 다루는데 그렇다</tspan></text></g><g ><g class="shape"><path d="M510 1003h313v98H510z" class="stroke-B1 fill-B5 s0"/></g><text x="666.5" y="1041.5" class="text-bold fill-N1 s2"><tspan x="666.5" dy="0">표본 크기가 커졌고,</tspan><tspan x="666.5" dy="17.667">다중연구실 재현이</tspan><tspan x="666.5" dy="17.667">정례가 되었다</tspan></text></g><g ><g class="shape"><path d="M510 1126h313v98H510z" class="stroke-B1 fill-B5 s0"/></g><text x="666.5" y="1164.5" class="text-bold fill-N1 s2"><tspan x="666.5" dy="0">‘이 결과는 재현되었는가’ 가</tspan><tspan x="666.5" dy="17.667">논문을 읽을 때의</tspan><tspan x="666.5" dy="17.667">기본 물음이 되었다</tspan></text></g><marker id="mk-d2-1062660933-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1062660933-3488378134)" d="m302.5 89.029 203 2.914" class="connection stroke-B1 s0" mask="url(#d2-1062660933)"/><path fill="none" marker-end="url(#mk-d2-1062660933-3488378134)" d="m302.494 196.153 203.018 15.542" class="connection stroke-B1 s0" mask="url(#d2-1062660933)"/><path fill="none" marker-end="url(#mk-d2-1062660933-3488378134)" d="m302.477 298.303 203.07 31.092" class="connection stroke-B1 s0" mask="url(#d2-1062660933)"/><path fill="none" marker-end="url(#mk-d2-1062660933-3488378134)" d="m302.463 395.385 203.112 39.845" class="connection stroke-B1 s0" mask="url(#d2-1062660933)"/><path fill="none" marker-end="url(#mk-d2-1062660933-3488378134)" d="m302.457 496.412 203.129 42.764" class="connection stroke-B1 s0" mask="url(#d2-1062660933)"/><path fill="none" marker-end="url(#mk-d2-1062660933-3488378134)" d="m302.457 603.412 203.129 42.764" class="connection stroke-B1 s0" mask="url(#d2-1062660933)"/><marker id="mk-d2-1062660933-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1062660933-2177206569)" d="M691.5 753.5v45" class="connection stroke-B2 s4" mask="url(#d2-1062660933)"/><path fill="none" marker-end="url(#mk-d2-1062660933-2177206569)" d="M483.5 1025.5h-85" class="connection stroke-B2 s4" mask="url(#d2-1062660933)"/><mask id="d2-1062660933" width="1100" height="1451" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H999v1451H-101z"/></mask></svg>