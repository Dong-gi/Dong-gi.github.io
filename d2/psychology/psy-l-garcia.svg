<svg xmlns="http://www.w3.org/2000/svg" width="1043" height="1337" class="d2-1832334753 d2-svg" viewBox="-101 -101 1043 1337"><rect width="1043" height="1337" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1832334753 .fill-N1{fill:#0a0f25}.d2-1832334753 .fill-B4{fill:#e3e9fd}.d2-1832334753 .fill-B5{fill:#edf0fd}.d2-1832334753 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:3}</style><text x="420.5" y="16" class="fill-N1 s0"><tspan x="420.5" dy="0">쥐에게 두 가지를 함께 준다 — 맛이 있는 물, 그리고 마실 때 켜지는 빛과 소리.</tspan><tspan x="420.5" dy="18.5">그 뒤에 오는 결과만 조건마다 다르게 한다</tspan></text><g ><g class="shape"><path d="M0 137h841v356H0z" class="stroke-B1 fill-B4 s1"/></g><text x="420.5" y="170" class="fill-N1 s2">네 칸 — 가로줄은 뒤에 오는 결과, 세로줄은 함께 준 자극</text></g><g ><g class="shape"><path d="M82 613h678v522H82z" class="stroke-B1 fill-B4 s1"/></g><text x="421" y="600" class="fill-N1 s2">무엇이 무너졌나</text></g><path fill="transparent" stroke="transparent" d="M60 183h191v66H60z" class="shape s1"/><text x="155.5" y="221.5" class="text-bold fill-N1 s0">결과 ↓ · 자극 →</text><g class="64Sk7Lm4Luunm-uouOumrA== 머리칸"><path fill="transparent" stroke="transparent" d="M267 183h263v66H267z" class="shape s1"/><text x="398.5" y="221.5" class="text-bold fill-N1 s0">맛</text></g><g class="64Sk7Lm4Luu5m-uouOumrA== 머리칸"><path fill="transparent" stroke="transparent" d="M546 183h235v66H546z" class="shape s1"/><text x="663.5" y="221.5" class="text-bold fill-N1 s0">빛과 소리</text></g><g class="64Sk7Lm4LuuplOyKpA== 머리칸"><path fill="transparent" stroke="transparent" d="M60 265h191v114H60z" class="shape s1"/><text x="155.5" y="319.5" class="text-bold fill-N1 s0"><tspan x="155.5" dy="0">뒤에 속이</tspan><tspan x="155.5" dy="18.5">불편해진다</tspan></text></g><g ><g class="shape"><path d="M267 265h263v114H267z" class="stroke-B1 fill-B5 s3"/></g><text x="398.5" y="303.5" class="text-bold fill-N1 s0"><tspan x="398.5" dy="0">배운다</tspan><tspan x="398.5" dy="17.25">그 맛을 피하게 된다.</tspan><tspan x="398.5" dy="17.25">한 번으로도, 몇 시간 뒤에</tspan><tspan x="398.5" dy="17.25">불편해져도 배운다</tspan></text></g><g ><g class="shape"><path d="M546 265h235v114H546z" class="stroke-B1 fill-B5 s1"/></g><text x="663.5" y="311.5" class="text-bold fill-N1 s0"><tspan x="663.5" dy="0">거의 배우지 않는다</tspan><tspan x="663.5" dy="17.667">같은 횟수를 짝지어도</tspan><tspan x="663.5" dy="17.667">피하게 되지 않는다</tspan></text></g><g class="64Sk7Lm4Lu2GteymnQ== 머리칸"><path fill="transparent" stroke="transparent" d="M60 395h191v82H60z" class="shape s1"/><text x="155.5" y="433.5" class="text-bold fill-N1 s0"><tspan x="155.5" dy="0">뒤에 발에</tspan><tspan x="155.5" dy="18.5">짧은 자극이 온다</tspan></text></g><g ><g class="shape"><path d="M267 395h263v82H267z" class="stroke-B1 fill-B5 s1"/></g><text x="398.5" y="441.5" class="text-bold fill-N1 s0">거의 배우지 않는다</text></g><g ><g class="shape"><path d="M546 395h235v82H546z" class="stroke-B1 fill-B5 s3"/></g><text x="663.5" y="433.5" class="text-bold fill-N1 s0"><tspan x="663.5" dy="0">배운다</tspan><tspan x="663.5" dy="18.5">그 신호를 피하게 된다</tspan></text></g><g ><g class="shape"><path d="M112 643h618v82H112z" class="stroke-B1 fill-B5 s1"/></g><text x="421" y="681.5" class="text-bold fill-N1 s0"><tspan x="421" dy="0">무너진 가정 — 어떤 자극이든 어떤 결과와도 똑같이 연합될 수 있다.</tspan><tspan x="421" dy="18.5">이것을 등가능성 가정이라 부른다. 이 설계가 그것을 반증했다</tspan></text></g><g ><g class="shape"><path d="M142 825h557v82H142z" class="stroke-B1 fill-B5 s1"/></g><text x="420.5" y="863.5" class="text-bold fill-N1 s0"><tspan x="420.5" dy="0">함께 무너진 것 — 연합은 두 사건이 거의 동시일 때만 생긴다.</tspan><tspan x="420.5" dy="18.5">맛과 불편함은 몇 시간이 떨어져 있어도 붙는다</tspan></text></g><g ><g class="shape"><path d="M139 1007h563v98H139z" class="stroke-B1 fill-B5 s1"/></g><text x="420.5" y="1045.5" class="text-bold fill-N1 s0"><tspan x="420.5" dy="0">대신 세워진 것 — 준비성.</tspan><tspan x="420.5" dy="17.667">동물마다 붙기 쉬운 짝과 붙기 어려운 짝이 미리 정해져 있다.</tspan><tspan x="420.5" dy="17.667">그 짝은 그 종이 살아온 환경과 무관하지 않다</tspan></text></g><marker id="mk-d2-1832334753-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1832334753-3488378134)" d="M420.5 39v94" class="connection stroke-B1 s1" mask="url(#d2-1832334753)"/><path fill="none" marker-end="url(#mk-d2-1832334753-3488378134)" d="M420.5 727v94" class="connection stroke-B1 s1" mask="url(#d2-1832334753)"/><path fill="none" marker-end="url(#mk-d2-1832334753-3488378134)" d="M420.5 909v94" class="connection stroke-B1 s1" mask="url(#d2-1832334753)"/><path fill="none" marker-end="url(#mk-d2-1832334753-3488378134)" d="M420.5 495v73" class="connection stroke-B1 s1" mask="url(#d2-1832334753)"/><mask id="d2-1832334753" width="1043" height="1337" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H942v1337H-101z"/></mask></svg>