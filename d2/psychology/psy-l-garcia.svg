<svg xmlns="http://www.w3.org/2000/svg" width="1524" height="1231" class="d2-3975848814 d2-svg" viewBox="-101 -101 1524 1231"><rect width="1524" height="1231" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3975848814 .fill-N1{fill:#0a0f25}.d2-3975848814 .fill-B4{fill:#e3e9fd}.d2-3975848814 .fill-B5{fill:#edf0fd}.d2-3975848814 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><text x="673.5" y="16" class="fill-N1 s0"><tspan x="673.5" dy="0">쥐에게 두 가지를 함께 준다 — 맛이 있는 물, 그리고 마실 때 켜지는 빛과 소리.</tspan><tspan x="673.5" dy="18.5">그 뒤에 오는 결과만 조건마다 다르게 한다</tspan></text><g ><g class="shape"><path d="M0 137h655v250H0z" class="stroke-B1 fill-B4 s1"/></g><text x="327.5" y="170" class="fill-N1 s2">뒤에 속이 불편해진다</text></g><g ><g class="shape"><path d="M715 153h607v218H715z" class="stroke-B1 fill-B4 s1"/></g><text x="1018.5" y="186" class="fill-N1 s2">뒤에 발에 짧은 자극이 온다</text></g><g ><g class="shape"><path d="M297 507h751v522H297z" class="stroke-B1 fill-B4 s1"/></g><text x="672.5" y="494" class="fill-N1 s2">무엇이 무너졌나</text></g><g ><g class="shape"><path d="M60 197h263v130H60z" class="stroke-B1 fill-B5 s1"/></g><text x="191.5" y="235.5" class="text-bold fill-N1 s0"><tspan x="191.5" dy="0">맛</tspan><tspan x="191.5" dy="17">배운다</tspan><tspan x="191.5" dy="17">그 맛을 피하게 된다.</tspan><tspan x="191.5" dy="17">한 번으로도, 몇 시간 뒤에</tspan><tspan x="191.5" dy="17">불편해져도 배운다</tspan></text></g><g ><g class="shape"><path d="M363 197h232v130H363z" class="stroke-B1 fill-B5 s1"/></g><text x="479" y="243.5" class="text-bold fill-N1 s0"><tspan x="479" dy="0">빛과 소리</tspan><tspan x="479" dy="17.25">거의 배우지 않는다</tspan><tspan x="479" dy="17.25">같은 횟수를 짝지어도</tspan><tspan x="479" dy="17.25">피하게 되지 않는다</tspan></text></g><g ><g class="shape"><path d="M775 213h212v98H775z" class="stroke-B1 fill-B5 s1"/></g><text x="881" y="259.5" class="text-bold fill-N1 s0"><tspan x="881" dy="0">맛</tspan><tspan x="881" dy="18.5">거의 배우지 않는다</tspan></text></g><g ><g class="shape"><path d="M1027 213h235v98h-235z" class="stroke-B1 fill-B5 s1"/></g><text x="1144.5" y="251.5" class="text-bold fill-N1 s0"><tspan x="1144.5" dy="0">빛과 소리</tspan><tspan x="1144.5" dy="17.667">배운다</tspan><tspan x="1144.5" dy="17.667">그 신호를 피하게 된다</tspan></text></g><g ><g class="shape"><path d="M364 537h618v82H364z" class="stroke-B1 fill-B5 s1"/></g><text x="673" y="575.5" class="text-bold fill-N1 s0"><tspan x="673" dy="0">무너진 가정 — 어떤 자극이든 어떤 결과와도 똑같이 연합될 수 있다.</tspan><tspan x="673" dy="18.5">이것을 등가능성 가정이라 부른다. 이 설계가 그것을 반증했다</tspan></text></g><g ><g class="shape"><path d="M395 719h557v82H395z" class="stroke-B1 fill-B5 s1"/></g><text x="673.5" y="757.5" class="text-bold fill-N1 s0"><tspan x="673.5" dy="0">함께 무너진 것 — 연합은 두 사건이 거의 동시일 때만 생긴다.</tspan><tspan x="673.5" dy="18.5">맛과 불편함은 몇 시간이 떨어져 있어도 붙는다</tspan></text></g><g ><g class="shape"><path d="M392 901h563v98H392z" class="stroke-B1 fill-B5 s1"/></g><text x="673.5" y="939.5" class="text-bold fill-N1 s0"><tspan x="673.5" dy="0">대신 세워진 것 — 준비성.</tspan><tspan x="673.5" dy="17.667">동물마다 붙기 쉬운 짝과 붙기 어려운 짝이 미리 정해져 있다.</tspan><tspan x="673.5" dy="17.667">그 짝은 그 종이 살아온 환경과 무관하지 않다</tspan></text></g><marker id="mk-d2-3975848814-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3975848814-3488378134)" d="M577.538 37.39C377.9 77 327.5 97 327.5 133" class="connection stroke-B1 s1" mask="url(#d2-3975848814)"/><path fill="none" marker-end="url(#mk-d2-3975848814-3488378134)" d="M768.462 37.39C968.1 77 1018.5 100.2 1018.5 149" class="connection stroke-B1 s1" mask="url(#d2-3975848814)"/><path fill="none" marker-end="url(#mk-d2-3975848814-3488378134)" d="M673 621v94" class="connection stroke-B1 s1" mask="url(#d2-3975848814)"/><path fill="none" marker-end="url(#mk-d2-3975848814-3488378134)" d="M673 803v94" class="connection stroke-B1 s1" mask="url(#d2-3975848814)"/><path fill="none" marker-end="url(#mk-d2-3975848814-3488378134)" d="M327.5 389v114" class="connection stroke-B1 s1" mask="url(#d2-3975848814)"/><path fill="none" marker-end="url(#mk-d2-3975848814-3488378134)" d="M1018.5 373v130" class="connection stroke-B1 s1" mask="url(#d2-3975848814)"/><mask id="d2-3975848814" width="1524" height="1231" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1524v1231H-101z"/></mask></svg>