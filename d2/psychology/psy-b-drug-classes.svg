<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="1497" class="d2-3531737140 d2-svg" viewBox="-101 -101 1545 1497"><rect width="1545" height="1497" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3531737140 .fill-N1{fill:#0a0f25}.d2-3531737140 .fill-B4{fill:#e3e9fd}.d2-3531737140 .fill-B5{fill:#edf0fd}.d2-3531737140 .stroke-B1,.d2-3531737140 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h443v338H0z" class="stroke-B1 fill-B4 s0"/></g><text x="221.5" y="33" class="fill-N1 s1">흥분 계열</text></g><g ><g class="shape"><ellipse cx="692.5" cy="169" class="shape stroke-B1" rx="209.5" ry="169" style="fill:#f7f8fe;stroke-width:2"/></g><text x="692.5" y="142.5" class="text-bold fill-N1 s2"><tspan x="692.5" dy="0">무엇을 기준으로</tspan><tspan x="692.5" dy="17">나누는가 —</tspan><tspan x="692.5" dy="17">각성 수준과</tspan><tspan x="692.5" dy="17">지각에 미치는</tspan><tspan x="692.5" dy="17">영향의 방향</tspan></text></g><g ><g class="shape"><path d="M942 0h401v338H942z" class="stroke-B1 fill-B4 s0"/></g><text x="1142.5" y="33" class="fill-N1 s1">지각 변화 계열</text></g><g ><g class="shape"><path d="M0 448h443v492H0z" class="stroke-B1 fill-B4 s0"/></g><text x="221.5" y="481" class="fill-N1 s1">억제 계열</text></g><g ><g class="shape"><path d="M483 448h419v492H483z" class="stroke-B1 fill-B4 s0"/></g><text x="692.5" y="481" class="fill-N1 s1"><tspan x="692.5" dy="0">계열과 상관없이</tspan><tspan x="692.5" dy="32">나타나는 세 가지</tspan></text></g><g ><g class="shape"><path d="M942 448h401v492H942z" class="stroke-B1 fill-B4 s0"/></g><text x="1142.5" y="481" class="fill-N1 s1"><tspan x="1142.5" dy="0">통증에</tspan><tspan x="1142.5" dy="32">작용하는 계열</tspan></text></g><path fill="transparent" stroke="transparent" d="M0 1050h443v245H0z" class="shape s0"/><text x="688.5" y="1066" class="fill-N1 s2"><tspan x="688.5" dy="0"> </tspan><tspan x="688.5" dy="16.333">이 분류를 읽을 때 조심할 것 —</tspan><tspan x="688.5" dy="16.333"> </tspan><tspan x="688.5" dy="16.333">· 경계가 깔끔하지 않다.</tspan><tspan x="688.5" dy="16.333"> 양에 따라 다른 계열처럼 작용하는 것이 있다</tspan><tspan x="688.5" dy="16.333">· 이 분류는 ‘효과의 방향’ 에 따른 것이지</tspan><tspan x="688.5" dy="16.333"> 위험도나 법적 지위에 따른 것이 아니다</tspan><tspan x="688.5" dy="16.333">· ‘기대가 효과의 일부를 만든다.’</tspan><tspan x="688.5" dy="16.333"> 무엇을 받았다고 믿는지가 나타나는 것을 바꾼다.</tspan><tspan x="688.5" dy="16.333"> 그래서 이 분야의 연구는</tspan><tspan x="688.5" dy="16.333"> 4장의 은폐와 위약 조건을</tspan><tspan x="688.5" dy="16.333"> 특히 엄격하게 다뤄야 한다</tspan><tspan x="688.5" dy="16.333"> </tspan><tspan x="688.5" dy="16.333">이 문서는 여기까지만 다룬다.</tspan><tspan x="688.5" dy="16.333">사용법 · 양 · 구하는 방법은 적지 않는다</tspan></text><g ><g class="shape"><path d="M40 46h363v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="221.5" y="84.5" class="text-bold fill-N1 s2">방향 — 신경계의 활동을 높인다</text></g><g ><g class="shape"><path d="M40 152h363v130H40z" class="stroke-B1 fill-B5 s0"/></g><text x="221.5" y="190.5" class="text-bold fill-N1 s2"><tspan x="221.5" dy="0">겉으로 나타나는 것 —</tspan><tspan x="221.5" dy="17">각성 수준이 올라가고</tspan><tspan x="221.5" dy="17">졸림이 줄어든다.</tspan><tspan x="221.5" dy="17">효과가 지난 뒤에</tspan><tspan x="221.5" dy="17">반대 방향의 상태가 오는 경우가 많다</tspan></text></g><g ><g class="shape"><path d="M982 46h321v82H982z" class="stroke-B1 fill-B5 s0"/></g><text x="1142.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="1142.5" dy="0">방향 — 각성 수준보다</tspan><tspan x="1142.5" dy="18.5">‘지각과 사고의 내용’ 을 바꾼다</tspan></text></g><g ><g class="shape"><path d="M982 168h321v130H982z" class="stroke-B1 fill-B5 s0"/></g><text x="1142.5" y="206.5" class="text-bold fill-N1 s2"><tspan x="1142.5" dy="0">겉으로 나타나는 것 —</tspan><tspan x="1142.5" dy="17">없는 것이 지각되거나</tspan><tspan x="1142.5" dy="17">있는 것이 달리 지각된다.</tspan><tspan x="1142.5" dy="17">시간 감각과 자기 감각이</tspan><tspan x="1142.5" dy="17">달라졌다는 보고가 많다</tspan></text></g><g ><g class="shape"><path d="M40 494h340v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="210" y="532.5" class="text-bold fill-N1 s2"><tspan x="210" dy="0">방향 — 신경계의 활동을</tspan><tspan x="210" dy="18.5">전반적으로 낮춘다</tspan></text></g><g ><g class="shape"><path d="M40 616h340v130H40z" class="stroke-B1 fill-B5 s0"/></g><text x="210" y="654.5" class="text-bold fill-N1 s2"><tspan x="210" dy="0">겉으로 나타나는 것 —</tspan><tspan x="210" dy="17">각성 수준이 내려가고,</tspan><tspan x="210" dy="17">반응이 느려지고,</tspan><tspan x="210" dy="17">판단과 조절이 무뎌지고,</tspan><tspan x="210" dy="17">많은 양에서는 기억이 남지 않는다</tspan></text></g><g ><g class="shape"><path d="M543 522h299v82H543z" class="stroke-B1 fill-B5 s0"/></g><text x="692.5" y="560.5" class="text-bold fill-N1 s2"><tspan x="692.5" dy="0">내성 — 같은 효과를 얻는 데</tspan><tspan x="692.5" dy="18.5">필요한 양이 늘어난다</tspan></text></g><g ><g class="shape"><path d="M543 644h299v82H543z" class="stroke-B1 fill-B5 s0"/></g><text x="692.5" y="682.5" class="text-bold fill-N1 s2"><tspan x="692.5" dy="0">금단 — 끊었을 때 나타나는</tspan><tspan x="692.5" dy="18.5">반대 방향의 상태</tspan></text></g><g ><g class="shape"><path d="M543 766h299v114H543z" class="stroke-B1 fill-B5 s0"/></g><text x="692.5" y="804.5" class="text-bold fill-N1 s2"><tspan x="692.5" dy="0">의존 — 쓰는 일이</tspan><tspan x="692.5" dy="17.25">다른 활동을 밀어내는 상태.</tspan><tspan x="692.5" dy="17.25">이것은 이 문서가 다루지 않는</tspan><tspan x="692.5" dy="17.25">임상의 영역과 맞닿는다</tspan></text></g><g ><g class="shape"><path d="M982 522h235v98H982z" class="stroke-B1 fill-B5 s0"/></g><text x="1099.5" y="560.5" class="text-bold fill-N1 s2"><tspan x="1099.5" dy="0">방향 — 통증 신호의</tspan><tspan x="1099.5" dy="17.667">처리에 작용하며</tspan><tspan x="1099.5" dy="17.667">진정 효과도 함께 온다</tspan></text></g><g ><g class="shape"><path d="M982 660h235v98H982z" class="stroke-B1 fill-B5 s0"/></g><text x="1099.5" y="698.5" class="text-bold fill-N1 s2"><tspan x="1099.5" dy="0">겉으로 나타나는 것 —</tspan><tspan x="1099.5" dy="17.667">통증이 줄고</tspan><tspan x="1099.5" dy="17.667">각성 수준이 내려간다</tspan></text></g><marker id="mk-d2-3531737140-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3531737140-3488378134)" d="M221.5 114v34" class="connection stroke-B1 s0" mask="url(#d2-3531737140)"/><path fill="none" marker-end="url(#mk-d2-3531737140-3488378134)" d="M1142.5 130v34" class="connection stroke-B1 s0" mask="url(#d2-3531737140)"/><path fill="none" marker-end="url(#mk-d2-3531737140-3488378134)" d="M210 578v34" class="connection stroke-B1 s0" mask="url(#d2-3531737140)"/><path fill="none" marker-end="url(#mk-d2-3531737140-3488378134)" d="M1099.5 622v34" class="connection stroke-B1 s0" mask="url(#d2-3531737140)"/><path fill="none" marker-end="url(#mk-d2-3531737140-3488378134)" d="m567.667 307.49-123 137.528" class="connection stroke-B1 s0" mask="url(#d2-3531737140)"/><path fill="none" marker-end="url(#mk-d2-3531737140-3488378134)" d="M481 169h-34" class="connection stroke-B1 s0" mask="url(#d2-3531737140)"/><path fill="none" marker-end="url(#mk-d2-3531737140-3488378134)" d="M904 169h34" class="connection stroke-B1 s0" mask="url(#d2-3531737140)"/><path fill="none" marker-end="url(#mk-d2-3531737140-3488378134)" d="m813.3 309.52 126.1 147.44" class="connection stroke-B1 s0" mask="url(#d2-3531737140)"/><marker id="mk-d2-3531737140-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3531737140-2177206569)" d="M444.5 694h35" class="connection stroke-B2 s4" mask="url(#d2-3531737140)"/><path fill="none" marker-end="url(#mk-d2-3531737140-2177206569)" d="M939.5 694h-34" class="connection stroke-B2 s4" mask="url(#d2-3531737140)"/><path fill="none" marker-end="url(#mk-d2-3531737140-2177206569)" d="M692.5 941.5v105" class="connection stroke-B2 s4" mask="url(#d2-3531737140)"/><mask id="d2-3531737140" width="1545" height="1497" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1545v1497H-101z"/></mask></svg>