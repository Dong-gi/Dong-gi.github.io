<svg xmlns="http://www.w3.org/2000/svg" width="1209" height="1573" class="d2-2561334664 d2-svg" viewBox="-101 -101 1209 1573"><rect width="1209" height="1573" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2561334664 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2561334664 .fill-N1{fill:#0a0f25}.d2-2561334664 .fill-B4{fill:#e3e9fd}.d2-2561334664 .fill-B5{fill:#edf0fd}.d2-2561334664 .stroke-B1,.d2-2561334664 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h298v382H0z" class="stroke-B1 fill-B4 s0"/></g><text x="149" y="33" class="fill-N1 s1">흥분 계열</text></g><g ><g class="shape"><ellipse cx="506.5" cy="191" class="shape stroke-B1" rx="178.5" ry="191" style="fill:#f7f8fe;stroke-width:2"/></g><text x="506.5" y="164.5" class="text-bold fill-N1 s2"><tspan x="506.5" dy="0">무엇을 기준으로</tspan><tspan x="506.5" dy="17">나누는가 —</tspan><tspan x="506.5" dy="17">각성 수준과</tspan><tspan x="506.5" dy="17">지각에 미치는</tspan><tspan x="506.5" dy="17">영향의 방향</tspan></text></g><g ><g class="shape"><path d="M715 0h292v382H715z" class="stroke-B1 fill-B4 s0"/></g><text x="861" y="33" class="fill-N1 s1">지각 변화 계열</text></g><g ><g class="shape"><path d="M0 452h298v540H0z" class="stroke-B1 fill-B4 s0"/></g><text x="149" y="485" class="fill-N1 s1">억제 계열</text></g><g ><g class="shape"><path d="M328 452h357v540H328z" class="stroke-B1 fill-B4 s0"/></g><text x="506.5" y="485" class="fill-N1 s1"><tspan x="506.5" dy="0">계열과 상관없이</tspan><tspan x="506.5" dy="32">나타나는 세 가지</tspan></text></g><g ><g class="shape"><path d="M715 452h292v540H715z" class="stroke-B1 fill-B4 s0"/></g><text x="861" y="485" class="fill-N1 s1"><tspan x="861" dy="0">통증에</tspan><tspan x="861" dy="32">작용하는 계열</tspan></text></g><path fill="transparent" stroke="transparent" d="M0 1062h298v309H0z" class="shape s0"/><text x="466" y="1078" class="fill-N1 s2"><tspan x="466" dy="0"> </tspan><tspan x="466" dy="16.263">이 분류를 읽을 때 조심할 것 —</tspan><tspan x="466" dy="16.263"> </tspan><tspan x="466" dy="16.263">· 경계가 깔끔하지 않다.</tspan><tspan x="466" dy="16.263"> 양에 따라 다른 계열처럼</tspan><tspan x="466" dy="16.263"> 작용하는 것이 있다</tspan><tspan x="466" dy="16.263">· 이 분류는 ‘효과의 방향’ 에</tspan><tspan x="466" dy="16.263"> 따른 것이지 위험도나</tspan><tspan x="466" dy="16.263"> 법적 지위에 따른 것이 아니다</tspan><tspan x="466" dy="16.263">· ‘기대가 효과의 일부를 만든다.’</tspan><tspan x="466" dy="16.263"> 무엇을 받았다고 믿는지가</tspan><tspan x="466" dy="16.263"> 나타나는 것을 바꾼다.</tspan><tspan x="466" dy="16.263"> 그래서 이 분야의 연구는</tspan><tspan x="466" dy="16.263"> 4장의 은폐와 위약 조건을</tspan><tspan x="466" dy="16.263"> 특히 엄격하게 다뤄야 한다</tspan><tspan x="466" dy="16.263"> </tspan><tspan x="466" dy="16.263">이 문서는 여기까지만 다룬다.</tspan><tspan x="466" dy="16.263">사용법 · 양 · 구하는 방법은</tspan><tspan x="466" dy="16.263">적지 않는다</tspan></text><g ><g class="shape"><path d="M30 46h232v82H30z" class="stroke-B1 fill-B5 s0"/></g><text x="146" y="84.5" class="text-bold fill-N1 s2"><tspan x="146" dy="0">방향 — 신경계의</tspan><tspan x="146" dy="18.5">활동을 높인다</tspan></text></g><g ><g class="shape"><path d="M30 158h232v146H30z" class="stroke-B1 fill-B5 s0"/></g><text x="146" y="196.5" class="text-bold fill-N1 s2"><tspan x="146" dy="0">겉으로 나타나는 것 —</tspan><tspan x="146" dy="16.833">각성 수준이 올라가고</tspan><tspan x="146" dy="16.833">졸림이 줄어든다.</tspan><tspan x="146" dy="16.833">효과가 지난 뒤에</tspan><tspan x="146" dy="16.833">반대 방향의 상태가</tspan><tspan x="146" dy="16.833">오는 경우가 많다</tspan></text></g><g ><g class="shape"><path d="M745 46h232v98H745z" class="stroke-B1 fill-B5 s0"/></g><text x="861" y="84.5" class="text-bold fill-N1 s2"><tspan x="861" dy="0">방향 — 각성 수준보다</tspan><tspan x="861" dy="17.667">‘지각과 사고의</tspan><tspan x="861" dy="17.667">내용’ 을 바꾼다</tspan></text></g><g ><g class="shape"><path d="M745 174h232v178H745z" class="stroke-B1 fill-B5 s0"/></g><text x="861" y="212.5" class="text-bold fill-N1 s2"><tspan x="861" dy="0">겉으로 나타나는 것 —</tspan><tspan x="861" dy="16.625">없는 것이 지각되거나</tspan><tspan x="861" dy="16.625">있는 것이</tspan><tspan x="861" dy="16.625">달리 지각된다.</tspan><tspan x="861" dy="16.625">시간 감각과</tspan><tspan x="861" dy="16.625">자기 감각이</tspan><tspan x="861" dy="16.625">달라졌다는</tspan><tspan x="861" dy="16.625">보고가 많다</tspan></text></g><g ><g class="shape"><path d="M30 498h238v98H30z" class="stroke-B1 fill-B5 s0"/></g><text x="149" y="536.5" class="text-bold fill-N1 s2"><tspan x="149" dy="0">방향 — 신경계의</tspan><tspan x="149" dy="17.667">활동을 전반적으로</tspan><tspan x="149" dy="17.667">낮춘다</tspan></text></g><g ><g class="shape"><path d="M30 626h238v162H30z" class="stroke-B1 fill-B5 s0"/></g><text x="149" y="664.5" class="text-bold fill-N1 s2"><tspan x="149" dy="0">겉으로 나타나는 것 —</tspan><tspan x="149" dy="16.714">각성 수준이 내려가고,</tspan><tspan x="149" dy="16.714">반응이 느려지고,</tspan><tspan x="149" dy="16.714">판단과 조절이</tspan><tspan x="149" dy="16.714">무뎌지고,</tspan><tspan x="149" dy="16.714">많은 양에서는</tspan><tspan x="149" dy="16.714">기억이 남지 않는다</tspan></text></g><g ><g class="shape"><path d="M388 526h237v98H388z" class="stroke-B1 fill-B5 s0"/></g><text x="506.5" y="564.5" class="text-bold fill-N1 s2"><tspan x="506.5" dy="0">내성 — 같은 효과를</tspan><tspan x="506.5" dy="17.667">얻는 데 필요한 양이</tspan><tspan x="506.5" dy="17.667">늘어난다</tspan></text></g><g ><g class="shape"><path d="M388 664h237v98H388z" class="stroke-B1 fill-B5 s0"/></g><text x="506.5" y="702.5" class="text-bold fill-N1 s2"><tspan x="506.5" dy="0">금단 — 끊었을 때</tspan><tspan x="506.5" dy="17.667">나타나는 반대 방향의</tspan><tspan x="506.5" dy="17.667">상태</tspan></text></g><g ><g class="shape"><path d="M388 802h237v130H388z" class="stroke-B1 fill-B5 s0"/></g><text x="506.5" y="840.5" class="text-bold fill-N1 s2"><tspan x="506.5" dy="0">의존 — 쓰는 일이 다른</tspan><tspan x="506.5" dy="17">활동을 밀어내는 상태.</tspan><tspan x="506.5" dy="17">이것은 이 문서가</tspan><tspan x="506.5" dy="17">다루지 않는 임상의</tspan><tspan x="506.5" dy="17">영역과 맞닿는다</tspan></text></g><g ><g class="shape"><path d="M745 526h232v114H745z" class="stroke-B1 fill-B5 s0"/></g><text x="861" y="564.5" class="text-bold fill-N1 s2"><tspan x="861" dy="0">방향 — 통증 신호의</tspan><tspan x="861" dy="17.25">처리에 작용하며</tspan><tspan x="861" dy="17.25">진정 효과도</tspan><tspan x="861" dy="17.25">함께 온다</tspan></text></g><g ><g class="shape"><path d="M745 670h232v98H745z" class="stroke-B1 fill-B5 s0"/></g><text x="861" y="708.5" class="text-bold fill-N1 s2"><tspan x="861" dy="0">겉으로 나타나는 것 —</tspan><tspan x="861" dy="17.667">통증이 줄고</tspan><tspan x="861" dy="17.667">각성 수준이 내려간다</tspan></text></g><marker id="mk-d2-2561334664-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2561334664-3488378134)" d="M146 130v24" class="connection stroke-B1 s0" mask="url(#d2-2561334664)"/><path fill="none" marker-end="url(#mk-d2-2561334664-3488378134)" d="M861 146v24" class="connection stroke-B1 s0" mask="url(#d2-2561334664)"/><path fill="none" marker-end="url(#mk-d2-2561334664-3488378134)" d="M149 598v24" class="connection stroke-B1 s0" mask="url(#d2-2561334664)"/><path fill="none" marker-end="url(#mk-d2-2561334664-3488378134)" d="M861 642v24" class="connection stroke-B1 s0" mask="url(#d2-2561334664)"/><path fill="none" marker-end="url(#mk-d2-2561334664-3488378134)" d="M400.886 347.66 300.229 497.679" class="connection stroke-B1 s0" mask="url(#d2-2561334664)"/><path fill="none" marker-end="url(#mk-d2-2561334664-3488378134)" d="M326 191h-24" class="connection stroke-B1 s0" mask="url(#d2-2561334664)"/><path fill="none" marker-end="url(#mk-d2-2561334664-3488378134)" d="M687 191h24" class="connection stroke-B1 s0" mask="url(#d2-2561334664)"/><path fill="none" marker-end="url(#mk-d2-2561334664-3488378134)" d="m611.112 347.662 101.664 152.013" class="connection stroke-B1 s0" mask="url(#d2-2561334664)"/><marker id="mk-d2-2561334664-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2561334664-2177206569)" d="M300.5 722h24" class="connection stroke-B2 s4" mask="url(#d2-2561334664)"/><path fill="none" marker-end="url(#mk-d2-2561334664-2177206569)" d="M713.5 722h-25" class="connection stroke-B2 s4" mask="url(#d2-2561334664)"/><path fill="none" marker-end="url(#mk-d2-2561334664-2177206569)" d="M506.5 993.5v65" class="connection stroke-B2 s4" mask="url(#d2-2561334664)"/><mask id="d2-2561334664" width="1209" height="1573" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1209v1573H-101z"/></mask></svg>