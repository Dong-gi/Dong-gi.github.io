<svg xmlns="http://www.w3.org/2000/svg" width="3083" height="1478" class="d2-1592985900 d2-svg" viewBox="-91 -101 3083 1478"><rect width="3083" height="1478" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1592985900 .fill-N1{fill:#0a0f25}.d2-1592985900 .fill-B4{fill:#e3e9fd}.d2-1592985900 .fill-B5{fill:#edf0fd}.d2-1592985900 .stroke-B1,.d2-1592985900 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="1434.5" cy="148.5" class="shape stroke-B1" rx="445.5" ry="148.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1434.5" y="154" class="text-bold fill-N1 s0">무엇을 기준으로 나누는가 — 각성 수준과 지각에 미치는 영향의 방향</text></g><g ><g class="shape"><path d="M89 417h637v308H89z" class="stroke-B1 fill-B4 s1"/></g><text x="407.5" y="404" class="fill-N1 s2">억제 계열</text></g><g ><g class="shape"><path d="M766 417h631v308H766z" class="stroke-B1 fill-B4 s1"/></g><text x="1081.5" y="404" class="fill-N1 s2">흥분 계열</text></g><g ><g class="shape"><path d="M1437 417h698v308h-698z" class="stroke-B1 fill-B4 s1"/></g><text x="1786" y="404" class="fill-N1 s2">지각 변화 계열</text></g><g ><g class="shape"><path d="M2175 417h609v300h-609z" class="stroke-B1 fill-B4 s1"/></g><text x="2479.5" y="404" class="fill-N1 s2">통증에 작용하는 계열</text></g><g ><g class="shape"><path d="M10 865h2881v142H10z" class="stroke-B1 fill-B4 s1"/></g><text x="1450.5" y="852" class="fill-N1 s2">계열과 상관없이 나타나는 세 가지</text></g><text x="1444" y="1143" class="fill-N1 s0"><tspan x="1444" dy="0"> </tspan><tspan x="1444" dy="16.556">이 분류를 읽을 때 조심할 것 —</tspan><tspan x="1444" dy="16.556"> </tspan><tspan x="1444" dy="16.556">· 경계가 깔끔하지 않다. 양에 따라 다른 계열처럼 작용하는 것이 있다</tspan><tspan x="1444" dy="16.556">· 이 분류는 ‘효과의 방향’ 에 따른 것이지 위험도나 법적 지위에 따른 것이 아니다</tspan><tspan x="1444" dy="16.556">· ‘기대가 효과의 일부를 만든다.’ 무엇을 받았다고 믿는지가 나타나는 것을 바꾼다.</tspan><tspan x="1444" dy="16.556"> 그래서 이 분야의 연구는 4장의 은폐와 위약 조건을 특히 엄격하게 다뤄야 한다</tspan><tspan x="1444" dy="16.556"> </tspan><tspan x="1444" dy="16.556">이 문서는 여기까지만 다룬다. 사용법 · 양 · 구하는 방법은 적지 않는다</tspan></text><g ><g class="shape"><path d="M201 447h414v66H201z" class="stroke-B1 fill-B5 s1"/></g><text x="408" y="485.5" class="text-bold fill-N1 s0">방향 — 신경계의 활동을 전반적으로 낮춘다</text></g><g ><g class="shape"><path d="M119 613h577v82H119z" class="stroke-B1 fill-B5 s1"/></g><text x="407.5" y="651.5" class="text-bold fill-N1 s0"><tspan x="407.5" dy="0">겉으로 나타나는 것 — 각성 수준이 내려가고, 반응이 느려지고,</tspan><tspan x="407.5" dy="18.5">판단과 조절이 무뎌지고, 많은 양에서는 기억이 남지 않는다</tspan></text></g><g ><g class="shape"><path d="M927 447h310v66H927z" class="stroke-B1 fill-B5 s1"/></g><text x="1082" y="485.5" class="text-bold fill-N1 s0">방향 — 신경계의 활동을 높인다</text></g><g ><g class="shape"><path d="M796 613h571v82H796z" class="stroke-B1 fill-B5 s1"/></g><text x="1081.5" y="651.5" class="text-bold fill-N1 s0"><tspan x="1081.5" dy="0">겉으로 나타나는 것 — 각성 수준이 올라가고 졸림이 줄어든다.</tspan><tspan x="1081.5" dy="18.5">효과가 지난 뒤에 반대 방향의 상태가 오는 경우가 많다</tspan></text></g><g ><g class="shape"><path d="M1533 447h507v66h-507z" class="stroke-B1 fill-B5 s1"/></g><text x="1786.5" y="485.5" class="text-bold fill-N1 s0">방향 — 각성 수준보다 ‘지각과 사고의 내용’ 을 바꾼다</text></g><g ><g class="shape"><path d="M1467 613h638v82h-638z" class="stroke-B1 fill-B5 s1"/></g><text x="1786" y="651.5" class="text-bold fill-N1 s0"><tspan x="1786" dy="0">겉으로 나타나는 것 — 없는 것이 지각되거나 있는 것이 달리 지각된다.</tspan><tspan x="1786" dy="18.5">시간 감각과 자기 감각이 달라졌다는 보고가 많다</tspan></text></g><g ><g class="shape"><path d="M2205 447h549v66h-549z" class="stroke-B1 fill-B5 s1"/></g><text x="2479.5" y="485.5" class="text-bold fill-N1 s0">방향 — 통증 신호의 처리에 작용하며 진정 효과도 함께 온다</text></g><g ><g class="shape"><path d="M2217 621h525v66h-525z" class="stroke-B1 fill-B5 s1"/></g><text x="2479.5" y="659.5" class="text-bold fill-N1 s0">겉으로 나타나는 것 — 통증이 줄고 각성 수준이 내려간다</text></g><g ><g class="shape"><path d="M40 903h465v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="272.5" y="941.5" class="text-bold fill-N1 s0">내성 — 같은 효과를 얻는 데 필요한 양이 늘어난다</text></g><g ><g class="shape"><path d="M1233 903h421v66h-421z" class="stroke-B1 fill-B5 s1"/></g><text x="1443.5" y="941.5" class="text-bold fill-N1 s0">금단 — 끊었을 때 나타나는 반대 방향의 상태</text></g><g ><g class="shape"><path d="M2350 895h511v82h-511z" class="stroke-B1 fill-B5 s1"/></g><text x="2605.5" y="933.5" class="text-bold fill-N1 s0"><tspan x="2605.5" dy="0">의존 — 쓰는 일이 다른 활동을 밀어내는 상태.</tspan><tspan x="2605.5" dy="18.5">이것은 이 문서가 다루지 않는 임상의 영역과 맞닿는다</tspan></text></g><marker id="mk-d2-1592985900-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1592985900-3488378134)" d="M407.75 515v94" class="connection stroke-B1 s1" mask="url(#d2-1592985900)"/><path fill="none" marker-end="url(#mk-d2-1592985900-3488378134)" d="M1081.75 515v94" class="connection stroke-B1 s1" mask="url(#d2-1592985900)"/><path fill="none" marker-end="url(#mk-d2-1592985900-3488378134)" d="M1786.25 515v94" class="connection stroke-B1 s1" mask="url(#d2-1592985900)"/><path fill="none" marker-end="url(#mk-d2-1592985900-3488378134)" d="M2479.75 515v102" class="connection stroke-B1 s1" mask="url(#d2-1592985900)"/><path fill="none" marker-end="url(#mk-d2-1592985900-3488378134)" d="M1047.036 223.38C536 322.2 407.75 352.8 407.75 372" class="connection stroke-B1 s1" mask="url(#d2-1592985900)"/><path fill="none" marker-end="url(#mk-d2-1592985900-3488378134)" d="M1206.257 276.98C1107 332.8 1081.75 352.8 1081.75 372" class="connection stroke-B1 s1" mask="url(#d2-1592985900)"/><path fill="none" marker-end="url(#mk-d2-1592985900-3488378134)" d="M1662.74 276.986C1761.2 332.8 1786.25 352.8 1786.25 372" class="connection stroke-B1 s1" mask="url(#d2-1592985900)"/><path fill="none" marker-end="url(#mk-d2-1592985900-3488378134)" d="M1823.965 222.373C2348.2 322 2479.75 352.8 2479.75 372" class="connection stroke-B1 s1" mask="url(#d2-1592985900)"/><marker id="mk-d2-1592985900-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1592985900-2177206569)" d="M407.75 727v134" class="connection stroke-B2 s4" mask="url(#d2-1592985900)"/><path fill="none" marker-end="url(#mk-d2-1592985900-2177206569)" d="M2479.75 719v142" class="connection stroke-B2 s4" mask="url(#d2-1592985900)"/><path fill="none" marker-end="url(#mk-d2-1592985900-2177206569)" d="M1443.75 1009v114" class="connection stroke-B2 s4" mask="url(#d2-1592985900)"/><mask id="d2-1592985900" width="3083" height="1478" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h3083v1478H-91z"/></mask></svg>