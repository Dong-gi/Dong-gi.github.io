<svg xmlns="http://www.w3.org/2000/svg" width="1869" height="1435" class="d2-2695002931 d2-svg" viewBox="-101 -101 1869 1435"><rect width="1869" height="1435" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2695002931 .fill-N1{fill:#0a0f25}.d2-2695002931 .fill-B4{fill:#e3e9fd}.d2-2695002931 .fill-B5{fill:#edf0fd}.d2-2695002931 .stroke-B1,.d2-2695002931 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h494v306H0z" class="stroke-B1 fill-B4 s0"/></g><text x="247" y="33" class="fill-N1 s1">흥분 계열</text></g><g ><g class="shape"><ellipse cx="807" cy="153" class="shape stroke-B1" rx="273" ry="153" style="fill:#f7f8fe;stroke-width:2"/></g><text x="807" y="142.5" class="text-bold fill-N1 s2"><tspan x="807" dy="0">무엇을 기준으로 나누는가 —</tspan><tspan x="807" dy="17.667">각성 수준과 지각에 미치는</tspan><tspan x="807" dy="17.667">영향의 방향</tspan></text></g><g ><g class="shape"><path d="M1120 0h547v306h-547z" class="stroke-B1 fill-B4 s0"/></g><text x="1393.5" y="33" class="fill-N1 s1">지각 변화 계열</text></g><g ><g class="shape"><path d="M0 416h494v462H0z" class="stroke-B1 fill-B4 s0"/></g><text x="247" y="449" class="fill-N1 s1">억제 계열</text></g><g ><g class="shape"><path d="M534 416h546v462H534z" class="stroke-B1 fill-B4 s0"/></g><text x="807" y="449" class="fill-N1 s1">계열과 상관없이 나타나는 세 가지</text></g><g ><g class="shape"><path d="M1120 416h547v462h-547z" class="stroke-B1 fill-B4 s0"/></g><text x="1393.5" y="449" class="fill-N1 s1">통증에 작용하는 계열</text></g><path fill="transparent" stroke="transparent" d="M0 988h494v245H0z" class="shape s0"/><text x="739.5" y="1004" class="fill-N1 s2"><tspan x="739.5" dy="0"> </tspan><tspan x="739.5" dy="16.333">이 분류를 읽을 때 조심할 것 —</tspan><tspan x="739.5" dy="16.333"> </tspan><tspan x="739.5" dy="16.333">· 경계가 깔끔하지 않다.</tspan><tspan x="739.5" dy="16.333"> 양에 따라 다른 계열처럼 작용하는 것이 있다</tspan><tspan x="739.5" dy="16.333">· 이 분류는 ‘효과의 방향’ 에 따른 것이지</tspan><tspan x="739.5" dy="16.333"> 위험도나 법적 지위에 따른 것이 아니다</tspan><tspan x="739.5" dy="16.333">· ‘기대가 효과의 일부를 만든다.’</tspan><tspan x="739.5" dy="16.333"> 무엇을 받았다고 믿는지가 나타나는 것을 바꾼다.</tspan><tspan x="739.5" dy="16.333"> 그래서 이 분야의 연구는</tspan><tspan x="739.5" dy="16.333"> 4장의 은폐와 위약 조건을</tspan><tspan x="739.5" dy="16.333"> 특히 엄격하게 다뤄야 한다</tspan><tspan x="739.5" dy="16.333"> </tspan><tspan x="739.5" dy="16.333">이 문서는 여기까지만 다룬다.</tspan><tspan x="739.5" dy="16.333">사용법 · 양 · 구하는 방법은 적지 않는다</tspan></text><g ><g class="shape"><path d="M40 46h385v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="232.5" y="84.5" class="text-bold fill-N1 s2">방향 — 신경계의 활동을 높인다</text></g><g ><g class="shape"><path d="M40 152h385v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="232.5" y="190.5" class="text-bold fill-N1 s2"><tspan x="232.5" dy="0">겉으로 나타나는 것 —</tspan><tspan x="232.5" dy="17.25">각성 수준이 올라가고 졸림이 줄어든다.</tspan><tspan x="232.5" dy="17.25">효과가 지난 뒤에</tspan><tspan x="232.5" dy="17.25">반대 방향의 상태가 오는 경우가 많다</tspan></text></g><g ><g class="shape"><path d="M1160 46h467v82h-467z" class="stroke-B1 fill-B5 s0"/></g><text x="1393.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="1393.5" dy="0">방향 — 각성 수준보다</tspan><tspan x="1393.5" dy="18.5">‘지각과 사고의 내용’ 을 바꾼다</tspan></text></g><g ><g class="shape"><path d="M1160 168h467v98h-467z" class="stroke-B1 fill-B5 s0"/></g><text x="1393.5" y="206.5" class="text-bold fill-N1 s2"><tspan x="1393.5" dy="0">겉으로 나타나는 것 —</tspan><tspan x="1393.5" dy="17.667">없는 것이 지각되거나 있는 것이 달리 지각된다.</tspan><tspan x="1393.5" dy="17.667">시간 감각과 자기 감각이 달라졌다는 보고가 많다</tspan></text></g><g ><g class="shape"><path d="M40 462h414v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="247" y="500.5" class="text-bold fill-N1 s2">방향 — 신경계의 활동을 전반적으로 낮춘다</text></g><g ><g class="shape"><path d="M40 568h414v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="247" y="606.5" class="text-bold fill-N1 s2"><tspan x="247" dy="0">겉으로 나타나는 것 —</tspan><tspan x="247" dy="17.25">각성 수준이 내려가고, 반응이 느려지고,</tspan><tspan x="247" dy="17.25">판단과 조절이 무뎌지고,</tspan><tspan x="247" dy="17.25">많은 양에서는 기억이 남지 않는다</tspan></text></g><g ><g class="shape"><path d="M594 476h426v82H594z" class="stroke-B1 fill-B5 s0"/></g><text x="807" y="514.5" class="text-bold fill-N1 s2"><tspan x="807" dy="0">내성 — 같은 효과를 얻는 데</tspan><tspan x="807" dy="18.5">필요한 양이 늘어난다</tspan></text></g><g ><g class="shape"><path d="M594 598h426v82H594z" class="stroke-B1 fill-B5 s0"/></g><text x="807" y="636.5" class="text-bold fill-N1 s2"><tspan x="807" dy="0">금단 — 끊었을 때 나타나는</tspan><tspan x="807" dy="18.5">반대 방향의 상태</tspan></text></g><g ><g class="shape"><path d="M594 720h426v98H594z" class="stroke-B1 fill-B5 s0"/></g><text x="807" y="758.5" class="text-bold fill-N1 s2"><tspan x="807" dy="0">의존 — 쓰는 일이 다른 활동을 밀어내는 상태.</tspan><tspan x="807" dy="17.667">이것은 이 문서가 다루지 않는</tspan><tspan x="807" dy="17.667">임상의 영역과 맞닿는다</tspan></text></g><g ><g class="shape"><path d="M1160 462h354v82h-354z" class="stroke-B1 fill-B5 s0"/></g><text x="1337" y="500.5" class="text-bold fill-N1 s2"><tspan x="1337" dy="0">방향 — 통증 신호의 처리에 작용하며</tspan><tspan x="1337" dy="18.5">진정 효과도 함께 온다</tspan></text></g><g ><g class="shape"><path d="M1160 584h354v82h-354z" class="stroke-B1 fill-B5 s0"/></g><text x="1337" y="622.5" class="text-bold fill-N1 s2"><tspan x="1337" dy="0">겉으로 나타나는 것 —</tspan><tspan x="1337" dy="18.5">통증이 줄고 각성 수준이 내려간다</tspan></text></g><marker id="mk-d2-2695002931-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2695002931-3488378134)" d="M232.5 114v34" class="connection stroke-B1 s0" mask="url(#d2-2695002931)"/><path fill="none" marker-end="url(#mk-d2-2695002931-3488378134)" d="M1393.5 130v34" class="connection stroke-B1 s0" mask="url(#d2-2695002931)"/><path fill="none" marker-end="url(#mk-d2-2695002931-3488378134)" d="M247 530v34" class="connection stroke-B1 s0" mask="url(#d2-2695002931)"/><path fill="none" marker-end="url(#mk-d2-2695002931-3488378134)" d="M1337 546v34" class="connection stroke-B1 s0" mask="url(#d2-2695002931)"/><path fill="none" marker-end="url(#mk-d2-2695002931-3488378134)" d="M659.499 283.321 497.002 426.357" class="connection stroke-B1 s0" mask="url(#d2-2695002931)"/><path fill="none" marker-end="url(#mk-d2-2695002931-3488378134)" d="M532 153h-34" class="connection stroke-B1 s0" mask="url(#d2-2695002931)"/><path fill="none" marker-end="url(#mk-d2-2695002931-3488378134)" d="M1082 153h34" class="connection stroke-B1 s0" mask="url(#d2-2695002931)"/><path fill="none" marker-end="url(#mk-d2-2695002931-3488378134)" d="m959.527 281.291 157.419 133.126" class="connection stroke-B1 s0" mask="url(#d2-2695002931)"/><marker id="mk-d2-2695002931-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2695002931-2177206569)" d="M496 647h34" class="connection stroke-B2 s4" mask="url(#d2-2695002931)"/><path fill="none" marker-end="url(#mk-d2-2695002931-2177206569)" d="M1118 647h-34" class="connection stroke-B2 s4" mask="url(#d2-2695002931)"/><path fill="none" marker-end="url(#mk-d2-2695002931-2177206569)" d="M807 879.5v105" class="connection stroke-B2 s4" mask="url(#d2-2695002931)"/><mask id="d2-2695002931" width="1869" height="1435" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1869v1435H-101z"/></mask></svg>