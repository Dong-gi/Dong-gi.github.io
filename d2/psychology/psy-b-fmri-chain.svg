<svg xmlns="http://www.w3.org/2000/svg" width="2502" height="1507" class="d2-3013383292 d2-svg" viewBox="-101 -101 2502 1507"><rect width="2502" height="1507" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3013383292 .fill-N1{fill:#0a0f25}.d2-3013383292 .fill-B6{fill:#f7f8fe}.d2-3013383292 .stroke-B1,.d2-3013383292 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M300 0h231v66H300z" class="stroke-B1 fill-B6 s0"/></g><text x="415.5" y="38.5" class="text-bold fill-N1 s1">1. 알고 싶은 심리 과정</text></g><text x="204.5" y="205" class="fill-N1 s1">이것은 구성개념이다. 직접 관찰되지 않는다 (5장)</text><g ><g class="shape"><path d="M469 166h313v66H469z" class="stroke-B1 fill-B6 s0"/></g><text x="625.5" y="204.5" class="text-bold fill-N1 s1">2. 그것을 일으킨다고 보는 과제</text></g><text x="394.5" y="363" class="fill-N1 s1"><tspan x="394.5" dy="0">여기가 첫 관문이다 — 과제가 그 과정‘만’ 일으키지 않는다.</tspan><tspan x="394.5" dy="18.5">화면을 보고 손가락을 움직이고 규칙을 기억하는 일이 함께 일어난다</tspan></text><g ><g class="shape"><path d="M742 332h229v66H742z" class="stroke-B1 fill-B6 s0"/></g><text x="856.5" y="370.5" class="text-bold fill-N1 s1">3. 신경 세포들의 활동</text></g><g ><g class="shape"><path d="M741 498h232v66H741z" class="stroke-B1 fill-B6 s0"/></g><text x="857" y="536.5" class="text-bold fill-N1 s1">4. 그 근처의 혈류 변화</text></g><text x="626.5" y="687" class="fill-N1 s1"><tspan x="626.5" dy="0">널리 쓰이는 영상 방법이 재는 것은 ‘혈류에 딸린 신호’이지</tspan><tspan x="626.5" dy="17.667">신경 활동 자체가 아니다. 둘 사이의 관계는 그 자체가 연구 주제다.</tspan><tspan x="626.5" dy="17.667">그리고 혈류는 느리게 변하므로 시간 해상도가 낮다</tspan></text><g ><g class="shape"><path d="M961 664h253v66H961z" class="stroke-B1 fill-B6 s0"/></g><text x="1087.5" y="702.5" class="text-bold fill-N1 s1">5. 두 조건의 신호를 뺀다</text></g><text x="835.5" y="853" class="fill-N1 s1"><tspan x="835.5" dy="0">그림에 남는 것은 ‘차이’다. 색이 없는 곳이 쉬고 있는 것이 아니고,</tspan><tspan x="835.5" dy="17.667">색이 있는 곳이 그때만 일하는 것도 아니다.</tspan><tspan x="835.5" dy="17.667">무엇에서 무엇을 뺐는지를 모르면 그림을 읽을 수 없다</tspan></text><g ><g class="shape"><path d="M1171 830h334v66h-334z" class="stroke-B1 fill-B6 s0"/></g><text x="1338" y="868.5" class="text-bold fill-N1 s1">6. 칸마다 검정하고 문턱을 정한다</text></g><text x="1066.5" y="1048" class="fill-N1 s1"><tspan x="1066.5" dy="0">칸이 아주 많으므로 보정하지 않으면 우연히 문턱을 넘는 칸이 반드시 남는다.</tspan><tspan x="1066.5" dy="18.5">보정 방법과 문턱을 어떻게 고르느냐에 따라 그림이 달라진다</tspan></text><g ><g class="shape"><ellipse cx="1610" cy="1050" class="shape stroke-B1 fill-B6 s0" rx="162" ry="54"/></g><text x="1610" y="1055.5" class="text-bold fill-N1 s1">7. 색깔이 입혀진 그림</text></g><text x="1252" y="1244" class="fill-N1 s1"><tspan x="1252" dy="0">색은 실제 색이 아니라 통계값에 입힌 것이다.</tspan><tspan x="1252" dy="17.667">여러 사람의 뇌를 하나의 표준 모양에 맞춘 뒤 평균한 그림인 경우가 많으므로,</tspan><tspan x="1252" dy="17.667">한 사람의 뇌에서 그 자리가 어디인지와는 또 다르다</tspan></text><text x="1968" y="1220" class="fill-N1 s1"><tspan x="1968" dy="0"> </tspan><tspan x="1968" dy="16.833">그래서 ‘뇌 사진이 보여 준다’ 는 말은 일곱 단계를 한 번에 건너뛴 말이다.</tspan><tspan x="1968" dy="16.833"> </tspan><tspan x="1968" dy="16.833">그렇다고 영상 연구가 쓸모없다는 뜻은 아니다. 이 사슬을 알고 읽으면</tspan><tspan x="1968" dy="16.833">무엇을 물을 수 있는지도 분명해진다 — 어느 조건이 어느 조건과 다른가,</tspan><tspan x="1968" dy="16.833">같은 과제가 사람들 사이에서 얼마나 비슷한가, 손상 연구가 짚은 자리와 맞는가</tspan></text><marker id="mk-d2-3013383292-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3013383292-2177206569)" d="M329.639 66.733C229.899 106 204.5 130.5 204.5 184.5" class="connection stroke-B2 s3" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-2177206569)" d="M531.618 232.677C422.3 272 394.5 294.9 394.5 342.5" class="connection stroke-B2 s3" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-2177206569)" d="M763.118 564.677C653.8 604 626 625.3 626 666.5" class="connection stroke-B2 s3" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-2177206569)" d="M984.851 730.629C865.95 770 835.75 791.3 835.75 832.5" class="connection stroke-B2 s3" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-2177206569)" d="M1228.587 896.583C1099.3 936 1066.5 963.1 1066.5 1027.5" class="connection stroke-B2 s3" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-2177206569)" d="M1486.08 1085.561C1299.2 1140.2 1252 1168.8 1252 1224" class="connection stroke-B2 s3" mask="url(#d2-3013383292)"/><marker id="mk-d2-3013383292-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3013383292-3488378134)" d="M500.361 66.733C600.1 106 625.5 126 625.5 162" class="connection stroke-B1 s0" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-3488378134)" d="M719.382 232.677C828.7 272 856.5 292 856.5 328" class="connection stroke-B1 s0" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-3488378134)" d="M856.5 400v94" class="connection stroke-B1 s0" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-3488378134)" d="M949.882 564.677C1059.2 604 1087 624 1087 660" class="connection stroke-B1 s0" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-3488378134)" d="M1189.149 730.629C1308.05 770 1338.25 790 1338.25 826" class="connection stroke-B1 s0" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-3488378134)" d="M1447.913 896.583C1577.2 936 1610 956 1610 992" class="connection stroke-B1 s0" mask="url(#d2-3013383292)"/><path fill="none" marker-end="url(#mk-d2-3013383292-2177206569)" d="M1733.92 1085.561C1920.8 1140.2 1968 1164 1968 1200" class="connection stroke-B2 s3" mask="url(#d2-3013383292)"/><mask id="d2-3013383292" width="2502" height="1507" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2502v1507H-101z"/></mask></svg>