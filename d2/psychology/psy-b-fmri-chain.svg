<svg xmlns="http://www.w3.org/2000/svg" width="1162" height="1214" class="d2-1497234463 d2-svg" viewBox="-101 -101 1162 1214"><rect width="1162" height="1214" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1497234463 .fill-N1{fill:#0a0f25}.d2-1497234463 .fill-B6{fill:#f7f8fe}.d2-1497234463 .stroke-B1,.d2-1497234463 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h393v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="196.5" y="38.5" class="text-bold fill-N1 s1">1. 알고 싶은 심리 과정</text></g><text x="667.5" y="16" class="fill-N1 s1">이것은 구성개념이다. 직접 관찰되지 않는다 (5장)</text><g ><g class="shape"><path d="M0 116h393v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="196.5" y="154.5" class="text-bold fill-N1 s1">2. 그것을 일으킨다고 보는 과제</text></g><text x="709" y="132" class="fill-N1 s1"><tspan x="709" dy="0">여기가 첫 관문이다 — 과제가 그 과정‘만’ 일으키지 않는다.</tspan><tspan x="709" dy="17.667">화면을 보고 손가락을 움직이고 규칙을 기억하는 일이</tspan><tspan x="709" dy="17.667">함께 일어난다</tspan></text><g ><g class="shape"><path d="M0 232h393v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="196.5" y="270.5" class="text-bold fill-N1 s1">3. 신경 세포들의 활동</text></g><path fill="transparent" stroke="transparent" d="M463 232h497v66H463z" class="shape s0"/><g ><g class="shape"><path d="M0 348h393v69H0z" class="stroke-B1 fill-B6 s0"/></g><text x="196.5" y="388" class="text-bold fill-N1 s1">4. 그 근처의 혈류 변화</text></g><text x="711.5" y="364" class="fill-N1 s1"><tspan x="711.5" dy="0">널리 쓰이는 영상 방법이 재는 것은 ‘혈류에 딸린 신호’이지</tspan><tspan x="711.5" dy="17.25">신경 활동 자체가 아니다.</tspan><tspan x="711.5" dy="17.25">둘 사이의 관계는 그 자체가 연구 주제다.</tspan><tspan x="711.5" dy="17.25">그리고 혈류는 느리게 변하므로 시간 해상도가 낮다</tspan></text><g ><g class="shape"><path d="M0 467h393v69H0z" class="stroke-B1 fill-B6 s0"/></g><text x="196.5" y="507" class="text-bold fill-N1 s1">5. 두 조건의 신호를 뺀다</text></g><text x="690" y="483" class="fill-N1 s1"><tspan x="690" dy="0">그림에 남는 것은 ‘차이’다.</tspan><tspan x="690" dy="17.25">색이 없는 곳이 쉬고 있는 것이 아니고,</tspan><tspan x="690" dy="17.25">색이 있는 곳이 그때만 일하는 것도 아니다.</tspan><tspan x="690" dy="17.25">무엇에서 무엇을 뺐는지를 모르면 그림을 읽을 수 없다</tspan></text><g ><g class="shape"><path d="M0 586h393v69H0z" class="stroke-B1 fill-B6 s0"/></g><text x="196.5" y="626" class="text-bold fill-N1 s1">6. 칸마다 검정하고 문턱을 정한다</text></g><text x="647.5" y="602" class="fill-N1 s1"><tspan x="647.5" dy="0">칸이 아주 많으므로 보정하지 않으면</tspan><tspan x="647.5" dy="17.25">우연히 문턱을 넘는 칸이 반드시 남는다.</tspan><tspan x="647.5" dy="17.25">보정 방법과 문턱을 어떻게 고르느냐에 따라</tspan><tspan x="647.5" dy="17.25">그림이 달라진다</tspan></text><g ><g class="shape"><ellipse cx="196.5" cy="759" class="shape stroke-B1 fill-B6 s0" rx="196.5" ry="54"/></g><text x="196.5" y="764.5" class="text-bold fill-N1 s1">7. 색깔이 입혀진 그림</text></g><text x="680" y="721" class="fill-N1 s1"><tspan x="680" dy="0">색은 실제 색이 아니라 통계값에 입힌 것이다.</tspan><tspan x="680" dy="17.25">여러 사람의 뇌를 하나의 표준 모양에 맞춘 뒤</tspan><tspan x="680" dy="17.25">평균한 그림인 경우가 많으므로,</tspan><tspan x="680" dy="17.25">한 사람의 뇌에서 그 자리가 어디인지와는 또 다르다</tspan></text><text x="196.5" y="879" class="fill-N1 s1"><tspan x="196.5" dy="0">그래서 ‘뇌 사진이 보여 준다’ 는 말은</tspan><tspan x="196.5" dy="16.556">일곱 단계를 한 번에 건너뛴 말이다.</tspan><tspan x="196.5" dy="16.556"> </tspan><tspan x="196.5" dy="16.556">그렇다고 영상 연구가 쓸모없다는 뜻은 아니다.</tspan><tspan x="196.5" dy="16.556">이 사슬을 알고 읽으면</tspan><tspan x="196.5" dy="16.556">무엇을 물을 수 있는지도 분명해진다 —</tspan><tspan x="196.5" dy="16.556">어느 조건이 어느 조건과 다른가,</tspan><tspan x="196.5" dy="16.556">같은 과제가 사람들 사이에서 얼마나 비슷한가,</tspan><tspan x="196.5" dy="16.556">손상 연구가 짚은 자리와 맞는가</tspan></text><marker id="mk-d2-1497234463-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1497234463-2177206569)" d="M394.5 33h65" class="connection stroke-B2 s3" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-2177206569)" d="M394.5 149h65" class="connection stroke-B2 s3" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-2177206569)" d="M394.5 382.5h65" class="connection stroke-B2 s3" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-2177206569)" d="M394.5 501.5h65" class="connection stroke-B2 s3" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-2177206569)" d="M394.5 620.5h65" class="connection stroke-B2 s3" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-2177206569)" d="M395 759h64" class="connection stroke-B2 s3" mask="url(#d2-1497234463)"/><marker id="mk-d2-1497234463-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1497234463-3488378134)" d="M196.5 68v44" class="connection stroke-B1 s0" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-3488378134)" d="M196.5 184v44" class="connection stroke-B1 s0" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-3488378134)" d="M196.5 299.5v45" class="connection stroke-B1 s0" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-3488378134)" d="M196.5 418.5v45" class="connection stroke-B1 s0" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-3488378134)" d="M196.5 537.5v45" class="connection stroke-B1 s0" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-3488378134)" d="m196.52 657 .44 44" class="connection stroke-B1 s0" mask="url(#d2-1497234463)"/><path fill="none" marker-end="url(#mk-d2-1497234463-2177206569)" d="M197 815v44" class="connection stroke-B2 s3" mask="url(#d2-1497234463)"/><mask id="d2-1497234463" width="1162" height="1214" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1162v1214H-101z"/></mask></svg>