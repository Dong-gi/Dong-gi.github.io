<svg xmlns="http://www.w3.org/2000/svg" width="1927" height="1879" class="d2-1617423355 d2-svg" viewBox="-91 -121 1927 1879"><rect width="1927" height="1879" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1617423355 .fill-N1{fill:#0a0f25}.d2-1617423355 .fill-B4{fill:#e3e9fd}.d2-1617423355 .fill-B5{fill:#edf0fd}.d2-1617423355 .stroke-B1,.d2-1617423355 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M665 20h534v645H665z" class="stroke-B1 fill-B4 s0"/></g><text x="932" y="7" class="fill-N1 s1">문제 공간</text></g><g ><g class="shape"><path d="M10 805h1249v356H10z" class="stroke-B1 fill-B4 s0"/></g><text x="634.5" y="792" class="fill-N1 s1">길을 고르는 두 가지 방식</text></g><g ><g class="shape"><path d="M600 1301h1135v356H600z" class="stroke-B1 fill-B4 s0"/></g><text x="1167.5" y="1288" class="fill-N1 s1">막히는 자리</text></g><g ><g class="shape"><path d="M767 382h330v66H767z" class="stroke-B1 fill-B5 s0"/></g><text x="932" y="420.5" class="text-bold fill-N1 s2">지금 상태 — 어디에서 출발하는가</text></g><g ><g class="shape"><path d="M753 569h357v66H753z" class="stroke-B1 fill-B5 s0"/></g><text x="931.5" y="607.5" class="text-bold fill-N1 s2">목표 상태 — 무엇이 되면 풀린 것인가</text></g><g ><g class="shape"><path d="M695 216h474v66H695z" class="stroke-B1 fill-B5 s0"/></g><text x="932" y="254.5" class="text-bold fill-N1 s2">쓸 수 있는 수 — 상태를 바꾸는 데 쓸 수 있는 조작들</text></g><g ><g class="shape"><path d="M805 50h253v66H805z" class="stroke-B1 fill-B5 s0"/></g><text x="931.5" y="88.5" class="text-bold fill-N1 s2">제약 — 해서는 안 되는 것</text></g><g ><g class="shape"><path d="M40 1033h534v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="307" y="1071.5" class="text-bold fill-N1 s2"><tspan x="307" dy="0">샅샅이 훑기</tspan><tspan x="307" dy="17.667">모든 길을 다 따져 본다. 답이 있으면 반드시 찾는다.</tspan><tspan x="307" dy="17.667">문제가 조금만 커져도 길의 수가 감당할 수 없이 늘어난다</tspan></text></g><g ><g class="shape"><path d="M671 835h522v98H671z" class="stroke-B1 fill-B5 s0"/></g><text x="932" y="873.5" class="text-bold fill-N1 s2"><tspan x="932" dy="0">어림법</tspan><tspan x="932" dy="17.667">답에 가까워 보이는 쪽으로만 간다. 대개 빠르다.</tspan><tspan x="932" dy="17.667">대신 놓칠 수 있고, 잘못된 방향으로 깊이 들어갈 수 있다</tspan></text></g><g ><g class="shape"><path d="M634 1041h595v82H634z" class="stroke-B1 fill-B5 s0"/></g><text x="931.5" y="1079.5" class="text-bold fill-N1 s2"><tspan x="931.5" dy="0">자주 쓰이는 어림법 — 지금과 목표의 차이를 줄이는 수를 고르기,</tspan><tspan x="931.5" dy="18.5">큰 목표를 작은 목표로 쪼개기, 목표에서 거꾸로 내려오기</tspan></text></g><g ><g class="shape"><path d="M630 1331h603v98H630z" class="stroke-B1 fill-B5 s0"/></g><text x="931.5" y="1369.5" class="text-bold fill-N1 s2"><tspan x="931.5" dy="0">쓰임에 갇힘</tspan><tspan x="931.5" dy="17.667">어떤 물건을 늘 쓰던 쓰임으로만 보아서, 그것을 다르게 쓰는 수가</tspan><tspan x="931.5" dy="17.667">‘쓸 수 있는 수’ 목록에 아예 들어오지 않는다</tspan></text></g><g ><g class="shape"><path d="M1293 1331h412v98h-412z" class="stroke-B1 fill-B5 s0"/></g><text x="1499" y="1369.5" class="text-bold fill-N1 s2"><tspan x="1499" dy="0">굳어진 방식</tspan><tspan x="1499" dy="17.667">앞의 몇 문제에서 통했던 방식을 계속 쓴다.</tspan><tspan x="1499" dy="17.667">더 짧은 길이 생겨도 그 길을 보지 않는다</tspan></text></g><g ><g class="shape"><path d="M894 1529h642v98H894z" class="stroke-B1 fill-B5 s0"/></g><text x="1215" y="1567.5" class="text-bold fill-N1 s2"><tspan x="1215" dy="0">둘 다 ‘길을 잘못 고른 것’ 이 아니라 ‘공간을 좁게 잡은 것’ 이다.</tspan><tspan x="1215" dy="17.667">그래서 더 열심히 생각하는 것으로는 잘 풀리지 않고,</tspan><tspan x="1215" dy="17.667">문제를 다시 적거나 잠시 떨어졌다 오는 것이 도움이 되는 경우가 있다</tspan></text></g><marker id="mk-d2-1617423355-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1617423355-3488378134)" d="M931.5 449.5v116" class="connection stroke-B1 s0" mask="url(#d2-1617423355)"/><text x="931.5" y="514" style="fill:#676c7e;text-anchor:middle;font-size:16px">이 사이를 잇는다</text><marker id="mk-d2-1617423355-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1617423355-2177206569)" d="M931.5 284v94" class="connection stroke-B2 s4" mask="url(#d2-1617423355)"/><path fill="none" marker-end="url(#mk-d2-1617423355-2177206569)" d="M931.5 118v94" class="connection stroke-B2 s4" mask="url(#d2-1617423355)"/><path fill="none" marker-end="url(#mk-d2-1617423355-3488378134)" d="M931.5 935v102" class="connection stroke-B1 s0" mask="url(#d2-1617423355)"/><path fill="none" marker-end="url(#mk-d2-1617423355-3488378134)" d="M931.5 1431c0 38 28.6 58 139.224 96.68" class="connection stroke-B1 s0" mask="url(#d2-1617423355)"/><path fill="none" marker-end="url(#mk-d2-1617423355-3488378134)" d="M1499 1431c0 38-28.6 58-139.224 96.68" class="connection stroke-B1 s0" mask="url(#d2-1617423355)"/><path fill="none" marker-end="url(#mk-d2-1617423355-3488378134)" d="M931.5 667v134" class="connection stroke-B1 s0" mask="url(#d2-1617423355)"/><path fill="none" marker-end="url(#mk-d2-1617423355-3488378134)" d="M931.5 1163v134" class="connection stroke-B1 s0" mask="url(#d2-1617423355)"/><mask id="d2-1617423355" width="1927" height="1879" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1927v1879H-91z"/><path d="M859 498h145v21H859z"/></mask></svg>