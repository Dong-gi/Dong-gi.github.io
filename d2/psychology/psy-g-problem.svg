<svg xmlns="http://www.w3.org/2000/svg" width="1403" height="1676" class="d2-857290813 d2-svg" viewBox="-101 -101 1403 1676"><rect width="1403" height="1676" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-857290813 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-857290813 .fill-N1{fill:#0a0f25}.d2-857290813 .fill-B4{fill:#e3e9fd}.d2-857290813 .fill-B5{fill:#edf0fd}.d2-857290813 .stroke-B1,.d2-857290813 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h1201v404H0z" class="stroke-B1 fill-B4 s0"/></g><text x="600.5" y="33" class="fill-N1 s1">문제 공간</text></g><g ><g class="shape"><path d="M0 535h1201v404H0z" class="stroke-B1 fill-B4 s0"/></g><text x="600.5" y="522" class="fill-N1 s1">길을 고르는 두 가지 방식</text></g><g ><g class="shape"><path d="M0 1070h1201v404H0z" class="stroke-B1 fill-B4 s0"/></g><text x="600.5" y="1057" class="fill-N1 s1">막히는 자리</text></g><g ><g class="shape"><path d="M200 80h255v82H200z" class="stroke-B1 fill-B5 s0"/></g><text x="327.5" y="118.5" class="text-bold fill-N1 s2"><tspan x="327.5" dy="0">제약 —</tspan><tspan x="327.5" dy="18.5">해서는 안 되는 것</tspan></text></g><g ><g class="shape"><path d="M655 80h346v82H655z" class="stroke-B1 fill-B5 s0"/></g><text x="828" y="118.5" class="text-bold fill-N1 s2"><tspan x="828" dy="0">쓸 수 있는 수 —</tspan><tspan x="828" dy="18.5">상태를 바꾸는 데 쓸 수 있는 조작들</tspan></text></g><g ><g class="shape"><path d="M200 242h255v82H200z" class="stroke-B1 fill-B5 s0"/></g><text x="327.5" y="280.5" class="text-bold fill-N1 s2"><tspan x="327.5" dy="0">목표 상태 —</tspan><tspan x="327.5" dy="18.5">무엇이 되면 풀린 것인가</tspan></text></g><g ><g class="shape"><path d="M655 242h346v82H655z" class="stroke-B1 fill-B5 s0"/></g><text x="828" y="280.5" class="text-bold fill-N1 s2"><tspan x="828" dy="0">지금 상태 —</tspan><tspan x="828" dy="18.5">어디에서 출발하는가</tspan></text></g><g ><g class="shape"><path d="M30 779h343v130H30z" class="stroke-B1 fill-B5 s0"/></g><text x="201.5" y="817.5" class="text-bold fill-N1 s2"><tspan x="201.5" dy="0">샅샅이 훑기</tspan><tspan x="201.5" dy="17">모든 길을 다 따져 본다.</tspan><tspan x="201.5" dy="17">답이 있으면 반드시 찾는다.</tspan><tspan x="201.5" dy="17">문제가 조금만 커져도</tspan><tspan x="201.5" dy="17">길의 수가 감당할 수 없이 늘어난다</tspan></text></g><g ><g class="shape"><path d="M456 565h363v114H456z" class="stroke-B1 fill-B5 s0"/></g><text x="637.5" y="603.5" class="text-bold fill-N1 s2"><tspan x="637.5" dy="0">어림법</tspan><tspan x="637.5" dy="17.25">답에 가까워 보이는 쪽으로만 간다.</tspan><tspan x="637.5" dy="17.25">대개 빠르다. 대신 놓칠 수 있고,</tspan><tspan x="637.5" dy="17.25">잘못된 방향으로 깊이 들어갈 수 있다</tspan></text></g><g ><g class="shape"><path d="M433 787h409v114H433z" class="stroke-B1 fill-B5 s0"/></g><text x="637.5" y="825.5" class="text-bold fill-N1 s2"><tspan x="637.5" dy="0">자주 쓰이는 어림법 —</tspan><tspan x="637.5" dy="17.25">지금과 목표의 차이를 줄이는 수를 고르기,</tspan><tspan x="637.5" dy="17.25">큰 목표를 작은 목표로 쪼개기,</tspan><tspan x="637.5" dy="17.25">목표에서 거꾸로 내려오기</tspan></text></g><g ><g class="shape"><path d="M30 1100h432v114H30z" class="stroke-B1 fill-B5 s0"/></g><text x="246" y="1138.5" class="text-bold fill-N1 s2"><tspan x="246" dy="0">쓰임에 갇힘</tspan><tspan x="246" dy="17.25">어떤 물건을 늘 쓰던 쓰임으로만 보아서,</tspan><tspan x="246" dy="17.25">그것을 다르게 쓰는 수가</tspan><tspan x="246" dy="17.25">‘쓸 수 있는 수’ 목록에 아예 들어오지 않는다</tspan></text></g><g ><g class="shape"><path d="M522 1100h390v114H522z" class="stroke-B1 fill-B5 s0"/></g><text x="717" y="1138.5" class="text-bold fill-N1 s2"><tspan x="717" dy="0">굳어진 방식</tspan><tspan x="717" dy="17.25">앞의 몇 문제에서 통했던 방식을</tspan><tspan x="717" dy="17.25">계속 쓴다.</tspan><tspan x="717" dy="17.25">더 짧은 길이 생겨도 그 길을 보지 않는다</tspan></text></g><g ><g class="shape"><path d="M233 1314h497v130H233z" class="stroke-B1 fill-B5 s0"/></g><text x="481.5" y="1352.5" class="text-bold fill-N1 s2"><tspan x="481.5" dy="0">둘 다 ‘길을 잘못 고른 것’ 이 아니라</tspan><tspan x="481.5" dy="17">‘공간을 좁게 잡은 것’ 이다.</tspan><tspan x="481.5" dy="17">그래서 더 열심히 생각하는 것으로는 잘 풀리지 않고,</tspan><tspan x="481.5" dy="17">문제를 다시 적거나 잠시 떨어졌다 오는 것이</tspan><tspan x="481.5" dy="17">도움이 되는 경우가 있다</tspan></text></g><marker id="mk-d2-857290813-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-857290813-3488378134)" d="M653.5 283h-195" class="connection stroke-B1 s0" mask="url(#d2-857290813)"/><text x="555.5" y="289" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">이 사이를 잇는다</text><marker id="mk-d2-857290813-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-857290813-2177206569)" d="M828 164v74" class="connection stroke-B2 s4" mask="url(#d2-857290813)"/><path fill="none" marker-end="url(#mk-d2-857290813-2177206569)" d="M457 121h194" class="connection stroke-B2 s4" mask="url(#d2-857290813)"/><path fill="none" marker-end="url(#mk-d2-857290813-3488378134)" d="M637.5 681v102" class="connection stroke-B1 s0" mask="url(#d2-857290813)"/><path fill="none" marker-end="url(#mk-d2-857290813-3488378134)" d="M246.25 1216c0 38 20.4 58 98.408 96.24" class="connection stroke-B1 s0" mask="url(#d2-857290813)"/><path fill="none" marker-end="url(#mk-d2-857290813-3488378134)" d="M717.25 1216c0 38-20.4 58-98.408 96.24" class="connection stroke-B1 s0" mask="url(#d2-857290813)"/><path fill="none" marker-end="url(#mk-d2-857290813-3488378134)" d="M600.5 406v84" class="connection stroke-B1 s0" mask="url(#d2-857290813)"/><path fill="none" marker-end="url(#mk-d2-857290813-3488378134)" d="M600.5 941v84" class="connection stroke-B1 s0" mask="url(#d2-857290813)"/><mask id="d2-857290813" width="1403" height="1676" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1403v1676H-101z"/><path d="M483 273h145v21H483z"/></mask></svg>