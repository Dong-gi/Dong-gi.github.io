<svg xmlns="http://www.w3.org/2000/svg" width="4295" height="1158" class="d2-1825222959 d2-svg" viewBox="-91 -101 4295 1158"><rect width="4295" height="1158" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1825222959 .fill-N1{fill:#0a0f25}.d2-1825222959 .fill-B4{fill:#e3e9fd}.d2-1825222959 .fill-B5{fill:#edf0fd}.d2-1825222959 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="2394.5" cy="117" class="shape stroke-B1" rx="351.5" ry="117" style="fill:#f7f8fe;stroke-width:2"/></g><text x="2394.5" y="122.5" class="text-bold fill-N1 s0">‘처치를 받은 뒤 점수가 올랐다. 처치가 효과가 있다’</text></g><g ><g class="shape"><path d="M10 375h4093v126H10z" class="stroke-B1 fill-B4 s1"/></g><text x="2056.5" y="362" class="fill-N1 s2">처치가 아니어도 점수를 올릴 수 있는 것들</text></g><g ><g class="shape"><path d="M1447 641h1689v142H1447z" class="stroke-B1 fill-B4 s1"/></g><text x="2291.5" y="628" class="fill-N1 s2">무엇이 막는가</text></g><text x="2394.5" y="919" class="fill-N1 s0"><tspan x="2394.5" dy="0"> </tspan><tspan x="2394.5" dy="17.667">통제 집단을 두어도 남는 것이 있다. 탈락이 두 집단에서 다르게 일어나면</tspan><tspan x="2394.5" dy="17.667">무선배정으로 맞춰 놓은 균형이 깨진다. 그래서 탈락률은 결과와 함께 보고해야 한다</tspan></text><g ><g class="shape"><path d="M40 405h394v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="237" y="443.5" class="text-bold fill-N1 s0">성숙 — 시간이 지나면서 저절로 좋아진다</text></g><g ><g class="shape"><path d="M494 405h441v66H494z" class="stroke-B1 fill-B5 s1"/></g><text x="714.5" y="443.5" class="text-bold fill-N1 s0">역사 — 연구 기간에 바깥에서 다른 일이 있었다</text></g><g ><g class="shape"><path d="M995 405h528v66H995z" class="stroke-B1 fill-B5 s1"/></g><text x="1259" y="443.5" class="text-bold fill-N1 s0">검사 — 사전 검사를 봤다는 것 자체가 사후 점수를 올린다</text></g><g ><g class="shape"><path d="M1583 405h458v66h-458z" class="stroke-B1 fill-B5 s1"/></g><text x="1812" y="443.5" class="text-bold fill-N1 s0">도구 — 재는 방법이나 채점자가 도중에 달라졌다</text></g><g ><g class="shape"><path d="M2101 405h586v66h-586z" class="stroke-B1 fill-B5 s1"/></g><text x="2394" y="443.5" class="text-bold fill-N1 s0">평균으로의 회귀 — 낮은 사람만 골라 뽑았다면 저절로 올라간다</text></g><g ><g class="shape"><path d="M2747 405h334v66h-334z" class="stroke-B1 fill-B5 s1"/></g><text x="2914" y="443.5" class="text-bold fill-N1 s0">선택 — 두 집단이 처음부터 달랐다</text></g><g ><g class="shape"><path d="M3141 405h414v66h-414z" class="stroke-B1 fill-B5 s1"/></g><text x="3348" y="443.5" class="text-bold fill-N1 s0">탈락 — 힘들어한 사람이 중간에 그만두었다</text></g><g ><g class="shape"><path d="M3615 405h458v66h-458z" class="stroke-B1 fill-B5 s1"/></g><text x="3844" y="443.5" class="text-bold fill-N1 s0">기대 — 참가자도 실험자도 무엇을 노리는지 안다</text></g><g ><g class="shape"><path d="M1477 671h763v82h-763z" class="stroke-B1 fill-B5 s1"/></g><text x="1858.5" y="709.5" class="text-bold fill-N1 s0"><tspan x="1858.5" dy="0">무선배정한 통제 집단</tspan><tspan x="1858.5" dy="18.5">성숙 · 역사 · 검사 · 도구 · 회귀를 한꺼번에 막는다. 두 집단에 똑같이 걸리기 때문이다</tspan></text></g><g ><g class="shape"><path d="M2300 671h188v82h-188z" class="stroke-B1 fill-B5 s1"/></g><text x="2394" y="709.5" class="text-bold fill-N1 s0"><tspan x="2394" dy="0">이중은폐와 위약</tspan><tspan x="2394" dy="18.5">기대를 막는다</tspan></text></g><g ><g class="shape"><path d="M2548 671h558v82h-558z" class="stroke-B1 fill-B5 s1"/></g><text x="2827" y="709.5" class="text-bold fill-N1 s0"><tspan x="2827" dy="0">탈락자를 세어 보고하기</tspan><tspan x="2827" dy="18.5">탈락은 설계로 막을 수 없고 드러내 놓고 다루는 수밖에 없다</tspan></text></g><marker id="mk-d2-1825222959-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1825222959-3488378134)" d="M2394 236v135.5" class="connection stroke-B1 s1" mask="url(#d2-1825222959)"/><text x="2394.5" y="310" style="fill:#676c7e;text-anchor:middle;font-size:16px">정말 처치인가</text><path fill="none" marker-end="url(#mk-d2-1825222959-3488378134)" d="M2394 503v93" class="connection stroke-B1 s1" mask="url(#d2-1825222959)"/><marker id="mk-d2-1825222959-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1825222959-2177206569)" d="M2394 785v114" class="connection" mask="url(#d2-1825222959)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1825222959" width="4295" height="1158" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h4295v1158H-91z"/><path d="M2333 294h123v21h-123z"/></mask></svg>