<svg xmlns="http://www.w3.org/2000/svg" width="1019" height="1480" class="d2-1293765897 d2-svg" viewBox="-101 -101 1019 1480"><rect width="1019" height="1480" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1293765897 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1293765897 .fill-N1{fill:#0a0f25}.d2-1293765897 .fill-B4{fill:#e3e9fd}.d2-1293765897 .fill-B5{fill:#edf0fd}.d2-1293765897 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="408.5" cy="74" class="shape stroke-B1" rx="222.5" ry="74" style="fill:#f7f8fe;stroke-width:2"/></g><text x="408.5" y="71.5" class="text-bold fill-N1 s0"><tspan x="408.5" dy="0">‘처치를 받은 뒤 점수가 올랐다.</tspan><tspan x="408.5" dy="18.5">처치가 효과가 있다’</tspan></text></g><g ><g class="shape"><path d="M73 269h672v518H73z" class="stroke-B1 fill-B4 s1"/></g><text x="409" y="302" class="fill-N1 s2">처치가 아니어도 점수를 올릴 수 있는 것들</text></g><g ><g class="shape"><path d="M0 887h817v206H0z" class="stroke-B1 fill-B4 s1"/></g><text x="408.5" y="920" class="fill-N1 s2">무엇이 막는가</text></g><text x="408.5" y="1209" class="fill-N1 s0"><tspan x="408.5" dy="0"> </tspan><tspan x="408.5" dy="17">통제 집단을 두어도 남는 것이 있다.</tspan><tspan x="408.5" dy="17">탈락이 두 집단에서 다르게 일어나면</tspan><tspan x="408.5" dy="17">무선배정으로 맞춰 놓은 균형이 깨진다.</tspan><tspan x="408.5" dy="17">그래서 탈락률은 결과와 함께 보고해야 한다</tspan></text><g ><g class="shape"><path d="M93 315h336v98H93z" class="stroke-B1 fill-B5 s1"/></g><text x="261" y="361.5" class="text-bold fill-N1 s0"><tspan x="261" dy="0">성숙 —</tspan><tspan x="261" dy="18.5">시간이 지나면서 저절로 좋아진다</tspan></text></g><g ><g class="shape"><path d="M449 315h276v98H449z" class="stroke-B1 fill-B5 s1"/></g><text x="587" y="353.5" class="text-bold fill-N1 s0"><tspan x="587" dy="0">역사 —</tspan><tspan x="587" dy="17.667">연구 기간에 바깥에서</tspan><tspan x="587" dy="17.667">다른 일이 있었다</tspan></text></g><g ><g class="shape"><path d="M93 433h336v98H93z" class="stroke-B1 fill-B5 s1"/></g><text x="261" y="471.5" class="text-bold fill-N1 s0"><tspan x="261" dy="0">검사 —</tspan><tspan x="261" dy="17.667">사전 검사를 봤다는 것 자체가</tspan><tspan x="261" dy="17.667">사후 점수를 올린다</tspan></text></g><g ><g class="shape"><path d="M449 433h276v98H449z" class="stroke-B1 fill-B5 s1"/></g><text x="587" y="471.5" class="text-bold fill-N1 s0"><tspan x="587" dy="0">도구 —</tspan><tspan x="587" dy="17.667">재는 방법이나 채점자가</tspan><tspan x="587" dy="17.667">도중에 달라졌다</tspan></text></g><g ><g class="shape"><path d="M93 551h336v98H93z" class="stroke-B1 fill-B5 s1"/></g><text x="261" y="589.5" class="text-bold fill-N1 s0"><tspan x="261" dy="0">평균으로의 회귀 —</tspan><tspan x="261" dy="17.667">낮은 사람만 골라 뽑았다면</tspan><tspan x="261" dy="17.667">저절로 올라간다</tspan></text></g><g ><g class="shape"><path d="M449 551h276v98H449z" class="stroke-B1 fill-B5 s1"/></g><text x="587" y="597.5" class="text-bold fill-N1 s0"><tspan x="587" dy="0">선택 —</tspan><tspan x="587" dy="18.5">두 집단이 처음부터 달랐다</tspan></text></g><g ><g class="shape"><path d="M93 669h336v98H93z" class="stroke-B1 fill-B5 s1"/></g><text x="261" y="707.5" class="text-bold fill-N1 s0"><tspan x="261" dy="0">탈락 —</tspan><tspan x="261" dy="17.667">힘들어한 사람이</tspan><tspan x="261" dy="17.667">중간에 그만두었다</tspan></text></g><g ><g class="shape"><path d="M449 669h276v98H449z" class="stroke-B1 fill-B5 s1"/></g><text x="587" y="707.5" class="text-bold fill-N1 s0"><tspan x="587" dy="0">기대 —</tspan><tspan x="587" dy="17.667">참가자도 실험자도</tspan><tspan x="587" dy="17.667">무엇을 노리는지 안다</tspan></text></g><g ><g class="shape"><path d="M30 933h257v130H30z" class="stroke-B1 fill-B5 s1"/></g><text x="158.5" y="971.5" class="text-bold fill-N1 s0"><tspan x="158.5" dy="0">무선배정한 통제 집단</tspan><tspan x="158.5" dy="17">성숙 · 역사 · 검사 · 도구 ·</tspan><tspan x="158.5" dy="17">회귀를 한꺼번에 막는다.</tspan><tspan x="158.5" dy="17">두 집단에 똑같이</tspan><tspan x="158.5" dy="17">걸리기 때문이다</tspan></text></g><g ><g class="shape"><path d="M317 933h188v130H317z" class="stroke-B1 fill-B5 s1"/></g><text x="411" y="995.5" class="text-bold fill-N1 s0"><tspan x="411" dy="0">이중은폐와 위약</tspan><tspan x="411" dy="18.5">기대를 막는다</tspan></text></g><g ><g class="shape"><path d="M535 933h252v130H535z" class="stroke-B1 fill-B5 s1"/></g><text x="661" y="971.5" class="text-bold fill-N1 s0"><tspan x="661" dy="0">탈락자를 세어 보고하기</tspan><tspan x="661" dy="17">탈락은 설계로</tspan><tspan x="661" dy="17">막을 수 없고</tspan><tspan x="661" dy="17">드러내 놓고 다루는</tspan><tspan x="661" dy="17">수밖에 없다</tspan></text></g><marker id="mk-d2-1293765897-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1293765897-3488378134)" d="M408.983 150c-.383 46.4-.483 70.7-.483 115.5" class="connection stroke-B1 s1" mask="url(#d2-1293765897)"/><text x="408.5" y="214" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">정말 처치인가</text><path fill="none" marker-end="url(#mk-d2-1293765897-3488378134)" d="M408.5 789v94" class="connection stroke-B1 s1" mask="url(#d2-1293765897)"/><marker id="mk-d2-1293765897-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1293765897-2177206569)" d="M408.5 1095v94" class="connection" mask="url(#d2-1293765897)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1293765897" width="1019" height="1480" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H918v1480H-101z"/><path d="M347 198h123v21H347z"/></mask></svg>