<svg xmlns="http://www.w3.org/2000/svg" width="827" height="1886" class="d2-354107064 d2-svg" viewBox="-91 -121 827 1886"><rect width="827" height="1886" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-354107064 .fill-N1{fill:#0a0f25}.d2-354107064 .fill-B5{fill:#edf0fd}.d2-354107064 .fill-B6{fill:#f7f8fe}.d2-354107064 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><path d="M82 1534h482v130H82z" class="stroke-B1 fill-B6 s0"/></g><text x="323" y="1572.5" class="text-bold fill-N1 s1"><tspan x="323" dy="0">음소</tspan><tspan x="323" dy="17">뜻을 갈라 주는 가장 작은 소리 단위.</tspan><tspan x="323" dy="17">어떤 두 소리가 다른 음소인지는 언어마다 다르다 —</tspan><tspan x="323" dy="17">한 언어에서 다른 낱말을 만드는 소리 차이가</tspan><tspan x="323" dy="17">다른 언어에서는 같은 소리의 변이일 뿐이다</tspan></text></g><g ><g class="shape"><path d="M106 1320h434v114H106z" class="stroke-B1 fill-B6 s0"/></g><text x="323" y="1358.5" class="text-bold fill-N1 s1"><tspan x="323" dy="0">형태소</tspan><tspan x="323" dy="17.25">뜻을 가진 가장 작은 단위.</tspan><tspan x="323" dy="17.25">낱말과 같지 않다. ‘먹었다’ 는 한 낱말이지만</tspan><tspan x="323" dy="17.25">뜻을 가진 조각이 여럿 들어 있다</tspan></text></g><g ><g class="shape"><path d="M118 1106h409v114H118z" class="stroke-B1 fill-B6 s0"/></g><text x="322.5" y="1144.5" class="text-bold fill-N1 s1"><tspan x="322.5" dy="0">낱말</tspan><tspan x="322.5" dy="17.25">형태소가 모여 이룬 단위.</tspan><tspan x="322.5" dy="17.25">무엇을 한 낱말로 셀지가 언어마다 다르고,</tspan><tspan x="322.5" dy="17.25">이 점이 11장 뒤쪽에서 다시 중요해진다</tspan></text></g><g ><g class="shape"><path d="M106 892h433v114H106z" class="stroke-B1 fill-B6 s0"/></g><text x="322.5" y="930.5" class="text-bold fill-N1 s1"><tspan x="322.5" dy="0">통사</tspan><tspan x="322.5" dy="17.25">낱말을 배열해 문장을 만드는 규칙.</tspan><tspan x="322.5" dy="17.25">같은 낱말을 다르게 배열하면 다른 뜻이 되고,</tspan><tspan x="322.5" dy="17.25">어떤 배열은 아예 문장이 되지 않는다</tspan></text></g><g ><g class="shape"><path d="M56 694h534v98H56z" class="stroke-B1 fill-B6 s0"/></g><text x="323" y="732.5" class="text-bold fill-N1 s1"><tspan x="323" dy="0">의미</tspan><tspan x="323" dy="17.667">문장이 무엇을 말하는가.</tspan><tspan x="323" dy="17.667">낱말의 뜻을 다 알아도 문장의 뜻이 저절로 나오지 않는다</tspan></text></g><g ><g class="shape"><path d="M44 480h558v114H44z" class="stroke-B1 fill-B6 s0"/></g><text x="323" y="518.5" class="text-bold fill-N1 s1"><tspan x="323" dy="0">화용</tspan><tspan x="323" dy="17.25">그 상황에서 그 말이 무엇을 하는가.</tspan><tspan x="323" dy="17.25">‘소금 있어요’ 는 형태로는 물음이지만 하는 일은 부탁이다.</tspan><tspan x="323" dy="17.25">뜻을 다 알아도 이것을 놓칠 수 있다</tspan></text></g><g ><g class="shape"><path d="M10 20h625v340H10z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="322.5" y="7" class="fill-N1" style="text-anchor:middle;font-size:28px">이 층 구조가 주는 것</text></g><g ><g class="shape"><path d="M40 232h565v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="322.5" y="270.5" class="text-bold fill-N1 s1"><tspan x="322.5" dy="0">적은 수의 소리 단위로 수많은 낱말을 만들고,</tspan><tspan x="322.5" dy="17.667">그 낱말들로 ‘이제까지 아무도 말한 적 없는 문장’ 을 만든다.</tspan><tspan x="322.5" dy="17.667">이것을 생산성이라 부른다</tspan></text></g><g ><g class="shape"><path d="M109 50h427v82H109z" class="stroke-B1 fill-B5 s0"/></g><text x="322.5" y="88.5" class="text-bold fill-N1 s1"><tspan x="322.5" dy="0">소리와 뜻 사이에 필연적인 연결이 없다.</tspan><tspan x="322.5" dy="18.5">같은 것을 언어마다 전혀 다른 소리로 부른다</tspan></text></g><marker id="mk-d2-354107064-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-354107064-3488378134)" d="M322.5 1532v-94" class="connection stroke-B1 s0" mask="url(#d2-354107064)"/><path fill="none" marker-end="url(#mk-d2-354107064-3488378134)" d="M322.5 1318v-94" class="connection stroke-B1 s0" mask="url(#d2-354107064)"/><path fill="none" marker-end="url(#mk-d2-354107064-3488378134)" d="M322.5 1104v-94" class="connection stroke-B1 s0" mask="url(#d2-354107064)"/><path fill="none" marker-end="url(#mk-d2-354107064-3488378134)" d="M322.5 890v-94" class="connection stroke-B1 s0" mask="url(#d2-354107064)"/><path fill="none" marker-end="url(#mk-d2-354107064-3488378134)" d="M322.5 692v-94" class="connection stroke-B1 s0" mask="url(#d2-354107064)"/><path fill="none" marker-end="url(#mk-d2-354107064-3488378134)" d="M322.5 230v-94" class="connection stroke-B1 s0" mask="url(#d2-354107064)"/><marker id="mk-d2-354107064-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-354107064-2177206569)" d="M322.5 478V364" class="connection" mask="url(#d2-354107064)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-354107064" width="827" height="1886" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h827v1886H-91z"/></mask></svg>