<svg xmlns="http://www.w3.org/2000/svg" width="4053" height="849" class="d2-3514143380 d2-svg" viewBox="-101 -85 4053 849"><rect width="4053" height="849" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3514143380 .fill-N1{fill:#0a0f25}.d2-3514143380 .fill-N2{fill:#676c7e}.d2-3514143380 .fill-B4{fill:#e3e9fd}.d2-3514143380 .fill-B5{fill:#edf0fd}.d2-3514143380 .stroke-B1,.d2-3514143380 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 471h168v66H0z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="84" y="509.5" class="text-bold fill-N1 s0">전달물질 하나</text></g><g ><g class="shape"><path d="M855 56h156v504H855z" class="stroke-B1 fill-B4 s1"/></g><text x="933" y="43" class="fill-N1 s2">그 물질을 쓰는 회로들</text></g><g ><g class="shape"><path d="M1853 56h295v504h-295z" class="stroke-B1 fill-B4 s1"/></g><text x="2000.5" y="43" class="fill-N1 s2">그 회로들이 관여하는 일</text></g><text x="933" y="626" class="fill-N1 s0"><tspan x="933" dy="0">게다가 받는 쪽도 여러 종류다.</tspan><tspan x="933" dy="17.667">같은 물질이 어떤 수용체에 닿느냐에 따라</tspan><tspan x="933" dy="17.667">다음 세포를 흥분시키기도 하고 억제하기도 한다</tspan></text><text x="2747.5" y="361" class="fill-N1 s0"><tspan x="2747.5" dy="0">그리고 거꾸로도 여럿이다 —</tspan><tspan x="2747.5" dy="17.667">하나의 심리 기능에 여러 물질이 함께 관여한다.</tspan><tspan x="2747.5" dy="17.667">어느 하나를 늘리거나 줄여도 그 기능만 달라지지 않는다</tspan></text><text x="3548.5" y="329" class="fill-N1 s0"><tspan x="3548.5" dy="0"> </tspan><tspan x="3548.5" dy="16.714">그래서 ‘어떤 물질이 모자라서 어떤 상태가 된다’ 는 도식은</tspan><tspan x="3548.5" dy="16.714">이 그림과 맞지 않는다. 널리 퍼진 그 도식은 지금 지지되지 않는다.</tspan><tspan x="3548.5" dy="16.714"> </tspan><tspan x="3548.5" dy="16.714">조심할 것 — 이 문단은 ‘물질이 상관없다’ 는 뜻이 아니다.</tspan><tspan x="3548.5" dy="16.714">물질에 작용하는 약이 효과를 내는 것과, 그 물질의 양이 원인이라는 것은</tspan><tspan x="3548.5" dy="16.714">서로 다른 주장이다. 앞엣것이 참이어도 뒤엣것이 따라 나오지 않는다</tspan></text><g ><g class="shape"><path d="M885 86h96v66h-96z" class="stroke-B1 fill-B5 s1"/></g><text x="933" y="124.5" class="text-bold fill-N1 s0">회로 1</text></g><g ><g class="shape"><path d="M885 212h96v66h-96z" class="stroke-B1 fill-B5 s1"/></g><text x="933" y="250.5" class="text-bold fill-N1 s0">회로 2</text></g><g ><g class="shape"><path d="M885 338h96v66h-96z" class="stroke-B1 fill-B5 s1"/></g><text x="933" y="376.5" class="text-bold fill-N1 s0">회로 3</text></g><g ><g class="shape"><path d="M906 464h54v66h-54z" class="stroke-B2 fill-B5 s3"/></g><text x="933" y="502.5" class="text-bold fill-N1 s0">…</text></g><g ><g class="shape"><path d="M1917 86h168v66h-168z" class="stroke-B1 fill-B5 s1"/></g><text x="2001" y="124.5" class="text-bold fill-N1 s0">움직임의 조절</text></g><g ><g class="shape"><path d="M1905 212h191v66h-191z" class="stroke-B1 fill-B5 s1"/></g><text x="2000.5" y="250.5" class="text-bold fill-N1 s0">무엇을 하려는 힘</text></g><g ><g class="shape"><path d="M1883 338h235v66h-235z" class="stroke-B1 fill-B5 s1"/></g><text x="2000.5" y="376.5" class="text-bold fill-N1 s0">배운 것을 갱신하는 일</text></g><g ><g class="shape"><path d="M1915 464h171v66h-171z" class="stroke-B1 fill-B5 s1"/></g><text x="2000.5" y="502.5" class="text-bold fill-N1 s0">몸 안쪽의 조절</text></g><marker id="mk-d2-3514143380-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-3514143380-3488378134)" d="M160.155 469.938C338.065 390.95 477.4 371 851 371" class="connection stroke-B1 s1" mask="url(#d2-3514143380)"/><text x="497" y="377" class="text-italic fill-N2 s0">같은 물질, 다른 자리</text><path fill="none" marker-end="url(#mk-d2-3514143380-3488378134)" d="M1013 371h836" class="connection stroke-B1 s1" mask="url(#d2-3514143380)"/><text x="1432" y="377" class="text-italic fill-N2 s0">회로마다 하는 일이 다르다</text><marker id="mk-d2-3514143380-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-3514143380-2177206569)" d="M161.825 537.318C338.4 616.5 624.2 636.5 725 636.5" class="connection stroke-B2 s3" mask="url(#d2-3514143380)"/><path fill="none" marker-end="url(#mk-d2-3514143380-2177206569)" d="M2150 371h357" class="connection stroke-B2 s3" mask="url(#d2-3514143380)"/><path fill="none" marker-end="url(#mk-d2-3514143380-2177206569)" d="M2986 371h256" class="connection stroke-B2 s3" mask="url(#d2-3514143380)"/><mask id="d2-3514143380" width="4053" height="849" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h4053v849H-101z"/><path d="M411 361h172v21H411zM1319 361h226v21h-226z"/></mask></svg>