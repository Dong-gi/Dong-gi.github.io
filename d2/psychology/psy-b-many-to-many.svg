<svg xmlns="http://www.w3.org/2000/svg" width="1479" height="1212" class="d2-3053949723 d2-svg" viewBox="-91 -101 1479 1212"><rect width="1479" height="1212" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3053949723 .fill-N1{fill:#0a0f25}.d2-3053949723 .fill-N2{fill:#676c7e}.d2-3053949723 .fill-B4{fill:#e3e9fd}.d2-3053949723 .fill-B5{fill:#edf0fd}.d2-3053949723 .stroke-B1,.d2-3053949723 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><path d="M776 0h168v66H776z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="860" y="38.5" class="text-bold fill-N1 s0">전달물질 하나</text></g><g ><g class="shape"><path d="M247 207h582v126H247z" class="stroke-B1 fill-B4 s1"/></g><text x="538" y="194" class="fill-N1 s2">그 물질을 쓰는 회로들</text></g><g ><g class="shape"><path d="M10 494h1005v126H10z" class="stroke-B1 fill-B4 s1"/></g><text x="512.5" y="481" class="fill-N1 s2">그 회로들이 관여하는 일</text></g><text x="1083" y="260" class="fill-N1 s0"><tspan x="1083" dy="0">게다가 받는 쪽도 여러 종류다.</tspan><tspan x="1083" dy="17.667">같은 물질이 어떤 수용체에 닿느냐에 따라</tspan><tspan x="1083" dy="17.667">다음 세포를 흥분시키기도 하고 억제하기도 한다</tspan></text><text x="636.5" y="756" class="fill-N1 s0"><tspan x="636.5" dy="0">그리고 거꾸로도 여럿이다 —</tspan><tspan x="636.5" dy="17.667">하나의 심리 기능에 여러 물질이 함께 관여한다.</tspan><tspan x="636.5" dy="17.667">어느 하나를 늘리거나 줄여도 그 기능만 달라지지 않는다</tspan></text><text x="636.5" y="909" class="fill-N1 s0"><tspan x="636.5" dy="0"> </tspan><tspan x="636.5" dy="16.714">그래서 ‘어떤 물질이 모자라서 어떤 상태가 된다’ 는 도식은</tspan><tspan x="636.5" dy="16.714">이 그림과 맞지 않는다. 널리 퍼진 그 도식은 지금 지지되지 않는다.</tspan><tspan x="636.5" dy="16.714"> </tspan><tspan x="636.5" dy="16.714">조심할 것 — 이 문단은 ‘물질이 상관없다’ 는 뜻이 아니다.</tspan><tspan x="636.5" dy="16.714">물질에 작용하는 약이 효과를 내는 것과, 그 물질의 양이 원인이라는 것은</tspan><tspan x="636.5" dy="16.714">서로 다른 주장이다. 앞엣것이 참이어도 뒤엣것이 따라 나오지 않는다</tspan></text><g ><g class="shape"><path d="M277 237h96v66h-96z" class="stroke-B1 fill-B5 s1"/></g><text x="325" y="275.5" class="text-bold fill-N1 s0">회로 1</text></g><g ><g class="shape"><path d="M433 237h96v66h-96z" class="stroke-B1 fill-B5 s1"/></g><text x="481" y="275.5" class="text-bold fill-N1 s0">회로 2</text></g><g ><g class="shape"><path d="M589 237h96v66h-96z" class="stroke-B1 fill-B5 s1"/></g><text x="637" y="275.5" class="text-bold fill-N1 s0">회로 3</text></g><g ><g class="shape"><path d="M745 237h54v66h-54z" class="stroke-B2 fill-B5 s3"/></g><text x="772" y="275.5" class="text-bold fill-N1 s0">…</text></g><g ><g class="shape"><path d="M40 524h168v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="124" y="562.5" class="text-bold fill-N1 s0">움직임의 조절</text></g><g ><g class="shape"><path d="M268 524h191v66H268z" class="stroke-B1 fill-B5 s1"/></g><text x="363.5" y="562.5" class="text-bold fill-N1 s0">무엇을 하려는 힘</text></g><g ><g class="shape"><path d="M519 524h235v66H519z" class="stroke-B1 fill-B5 s1"/></g><text x="636.5" y="562.5" class="text-bold fill-N1 s0">배운 것을 갱신하는 일</text></g><g ><g class="shape"><path d="M814 524h171v66H814z" class="stroke-B1 fill-B5 s1"/></g><text x="899.5" y="562.5" class="text-bold fill-N1 s0">몸 안쪽의 조절</text></g><marker id="mk-d2-3053949723-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-3053949723-3488378134)" d="M778.658 66.28C665.3 114.3 636.5 134.5 636.5 162.5" class="connection stroke-B1 s1" mask="url(#d2-3053949723)"/><text x="692" y="109" class="text-italic fill-N2 s0">같은 물질, 다른 자리</text><path fill="none" marker-end="url(#mk-d2-3053949723-3488378134)" d="M636.5 334.5v115" class="connection stroke-B1 s1" mask="url(#d2-3053949723)"/><text x="637" y="399" class="text-italic fill-N2 s0">회로마다 하는 일이 다르다</text><marker id="mk-d2-3053949723-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-3053949723-2177206569)" d="M940.342 66.28C1053.7 114.3 1082.5 198.3 1082.5 239.5" class="connection stroke-B2 s3" mask="url(#d2-3053949723)"/><path fill="none" marker-end="url(#mk-d2-3053949723-2177206569)" d="M636.5 622v114" class="connection stroke-B2 s3" mask="url(#d2-3053949723)"/><path fill="none" marker-end="url(#mk-d2-3053949723-2177206569)" d="M636.5 795v94" class="connection stroke-B2 s3" mask="url(#d2-3053949723)"/><mask id="d2-3053949723" width="1479" height="1212" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1479v1212H-91z"/><path d="M606 93h172v21H606zM524 383h226v21H524z"/></mask></svg>