<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="1469" class="d2-4159341858 d2-svg" viewBox="-91 -101 1098 1469"><rect width="1098" height="1469" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.d2-4159341858 .text-bold{font-weight:700}.d2-4159341858 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4159341858 .fill-N1{fill:#0a0f25}.d2-4159341858 .fill-N2{fill:#676c7e}.d2-4159341858 .fill-B4{fill:#e3e9fd}.d2-4159341858 .fill-B5{fill:#edf0fd}.d2-4159341858 .stroke-B1,.d2-4159341858 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><path d="M503 0h168v66H503z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="587" y="38.5" class="text-bold fill-N1 s0">전달물질 하나</text></g><g ><g class="shape"><path d="M10 217h582v126H10z" class="stroke-B1 fill-B4 s1"/></g><text x="301" y="204" class="fill-N1 s2">그 물질을 쓰는 회로들</text></g><g ><g class="shape"><path d="M107 493h586v292H107z" class="stroke-B1 fill-B4 s1"/></g><text x="400" y="526" class="fill-N1 s2">그 회로들이 관여하는 일</text></g><text x="774" y="253" class="fill-N1 s0"><tspan x="774" dy="0">게다가 받는 쪽도 여러 종류다.</tspan><tspan x="774" dy="17">같은 물질이 어떤 수용체에</tspan><tspan x="774" dy="17">닿느냐에 따라</tspan><tspan x="774" dy="17">다음 세포를 흥분시키기도 하고</tspan><tspan x="774" dy="17">억제하기도 한다</tspan></text><text x="400" y="901" class="fill-N1 s0"><tspan x="400" dy="0">그리고 거꾸로도 여럿이다 —</tspan><tspan x="400" dy="17">하나의 심리 기능에</tspan><tspan x="400" dy="17">여러 물질이 함께 관여한다.</tspan><tspan x="400" dy="17">어느 하나를 늘리거나 줄여도</tspan><tspan x="400" dy="17">그 기능만 달라지지 않는다</tspan></text><text x="400" y="1086" class="fill-N1 s0"><tspan x="400" dy="0"> </tspan><tspan x="400" dy="16.417">그래서 ‘어떤 물질이 모자라서</tspan><tspan x="400" dy="16.417">어떤 상태가 된다’ 는 도식은</tspan><tspan x="400" dy="16.417">이 그림과 맞지 않는다.</tspan><tspan x="400" dy="16.417">널리 퍼진 그 도식은 지금 지지되지 않는다.</tspan><tspan x="400" dy="16.417"> </tspan><tspan x="400" dy="16.417">조심할 것 —</tspan><tspan x="400" dy="16.417">이 문단은 ‘물질이 상관없다’ 는 뜻이 아니다.</tspan><tspan x="400" dy="16.417">물질에 작용하는 약이 효과를 내는 것과,</tspan><tspan x="400" dy="16.417">그 물질의 양이 원인이라는 것은</tspan><tspan x="400" dy="16.417">서로 다른 주장이다.</tspan><tspan x="400" dy="16.417">앞엣것이 참이어도 뒤엣것이 따라 나오지 않는다</tspan></text><g ><g class="shape"><path d="M40 247h96v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="88" y="285.5" class="text-bold fill-N1 s0">회로 1</text></g><g ><g class="shape"><path d="M196 247h96v66h-96z" class="stroke-B1 fill-B5 s1"/></g><text x="244" y="285.5" class="text-bold fill-N1 s0">회로 2</text></g><g ><g class="shape"><path d="M352 247h96v66h-96z" class="stroke-B1 fill-B5 s1"/></g><text x="400" y="285.5" class="text-bold fill-N1 s0">회로 3</text></g><g ><g class="shape"><path d="M508 247h54v66h-54z" class="stroke-B2 fill-B5 s3"/></g><text x="535" y="285.5" class="text-bold fill-N1 s0">…</text></g><g ><g class="shape"><path d="M167 553h235v66H167z" class="stroke-B1 fill-B5 s1"/></g><text x="284.5" y="591.5" class="text-bold fill-N1 s0">움직임의 조절</text></g><g ><g class="shape"><path d="M442 553h191v66H442z" class="stroke-B1 fill-B5 s1"/></g><text x="537.5" y="591.5" class="text-bold fill-N1 s0">무엇을 하려는 힘</text></g><g ><g class="shape"><path d="M167 659h235v66H167z" class="stroke-B1 fill-B5 s1"/></g><text x="284.5" y="697.5" class="text-bold fill-N1 s0">배운 것을 갱신하는 일</text></g><g ><g class="shape"><path d="M442 659h191v66H442z" class="stroke-B1 fill-B5 s1"/></g><text x="537.5" y="697.5" class="text-bold fill-N1 s0">몸 안쪽의 조절</text></g><marker id="mk-d2-4159341858-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-4159341858-3488378134)" d="M519.214 66.4C424.2 114.3 400 136.3 400 171.5" class="connection stroke-B1 s1" mask="url(#d2-4159341858)"/><text x="440" y="112" class="text-italic fill-N2 s0">같은 물질, 다른 자리</text><path fill="none" marker-end="url(#mk-d2-4159341858-3488378134)" d="M400 344.5v145" class="connection stroke-B1 s1" mask="url(#d2-4159341858)"/><text x="400" y="424" class="text-italic fill-N2 s0">회로마다 하는 일이 다르다</text><marker id="mk-d2-4159341858-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-4159341858-2177206569)" d="M654.786 66.4C749.8 114.3 774 197 774 233" class="connection stroke-B2 s3" mask="url(#d2-4159341858)"/><path fill="none" marker-end="url(#mk-d2-4159341858-2177206569)" d="M400 787v94" class="connection stroke-B2 s3" mask="url(#d2-4159341858)"/><path fill="none" marker-end="url(#mk-d2-4159341858-2177206569)" d="M400 972v94" class="connection stroke-B2 s3" mask="url(#d2-4159341858)"/><mask id="d2-4159341858" width="1098" height="1469" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1098v1469H-91z"/><path d="M354 96h172v21H354zM287 408h226v21H287z"/></mask></svg>