<svg xmlns="http://www.w3.org/2000/svg" width="1676" height="1454" class="d2-3448660106 d2-svg" viewBox="-208 -121 1676 1454"><rect width="1676" height="1454" x="-208" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3448660106 .fill-N1{fill:#0a0f25}.d2-3448660106 .fill-N2{fill:#676c7e}.d2-3448660106 .fill-B4{fill:#e3e9fd}.d2-3448660106 .fill-B5{fill:#edf0fd}.d2-3448660106 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M26 20h359v543H26z" class="stroke-B1 fill-B4 s0"/></g><text x="205.5" y="7" class="fill-N1 s1">순행 간섭 — 앞의 것이 뒤의 것을 방해한다</text></g><g ><g class="shape"><path d="M425 20h339v543H425z" class="stroke-B1 fill-B4 s0"/></g><text x="594.5" y="7" class="fill-N1 s1">역행 간섭 — 뒤의 것이 앞의 것을 방해한다</text></g><g ><g class="shape"><path d="M103 703h1264v340H103z" class="stroke-B1 fill-B4 s0"/></g><text x="735" y="690" class="fill-N1 s1">어떻게 갈라 내나 — 통제 집단이 필요하다</text></g><text x="716" y="1179" class="fill-N1 s2"><tspan x="716" dy="0"> </tspan><tspan x="716" dy="17.25">간섭이 크게 일어나는 조건은 대체로 같다 — 두 자료가 서로 비슷할 때다.</tspan><tspan x="716" dy="17.25">그래서 완전히 다른 과목을 이어 공부하는 편이 비슷한 두 과목을 이어 하는 것보다 낫다는</tspan><tspan x="716" dy="17.25">제안이 나오지만, 이 제안이 실제 공부 상황에서 얼마나 도움이 되는지는 따로 확인할 일이다</tspan></text><g ><g class="shape"><path d="M88 50h235v82H88z" class="stroke-B1 fill-B5 s0"/></g><text x="205.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="205.5" dy="0">먼저 배운 것</tspan><tspan x="205.5" dy="18.5">지난 학기의 자리 배치</tspan></text></g><g ><g class="shape"><path d="M88 253h235v82H88z" class="stroke-B1 fill-B5 s0"/></g><text x="205.5" y="291.5" class="text-bold fill-N1 s2"><tspan x="205.5" dy="0">나중에 배울 것</tspan><tspan x="205.5" dy="18.5">이번 학기의 자리 배치</tspan></text></g><g ><g class="shape"><path d="M56 435h299v98H56z" class="stroke-B1 fill-B5 s0"/></g><text x="205.5" y="473.5" class="text-bold fill-N1 s2"><tspan x="205.5" dy="0">검사</tspan><tspan x="205.5" dy="17.667">이번 학기 배치를 떠올린다.</tspan><tspan x="205.5" dy="17.667">지난 학기 것이 먼저 떠오른다</tspan></text></g><g ><g class="shape"><path d="M478 253h232v82H478z" class="stroke-B1 fill-B5 s0"/></g><text x="594" y="291.5" class="text-bold fill-N1 s2"><tspan x="594" dy="0">먼저 배운 것</tspan><tspan x="594" dy="18.5">예전에 쓰던 비밀번호</tspan></text></g><g ><g class="shape"><path d="M488 50h212v82H488z" class="stroke-B1 fill-B5 s0"/></g><text x="594" y="88.5" class="text-bold fill-N1 s2"><tspan x="594" dy="0">나중에 배운 것</tspan><tspan x="594" dy="18.5">새로 바꾼 비밀번호</tspan></text></g><g ><g class="shape"><path d="M455 435h279v98H455z" class="stroke-B1 fill-B5 s0"/></g><text x="594.5" y="473.5" class="text-bold fill-N1 s2"><tspan x="594.5" dy="0">검사</tspan><tspan x="594.5" dy="17.667">예전 것을 떠올린다.</tspan><tspan x="594.5" dy="17.667">새 것에 밀려 나오지 않는다</tspan></text></g><g ><g class="shape"><path d="M133 733h534v98H133z" class="stroke-B1 fill-B5 s0"/></g><text x="400" y="771.5" class="text-bold fill-N1 s2"><tspan x="400" dy="0">순행 간섭을 재려면, 한 집단만 앞의 목록을 배우게 하고</tspan><tspan x="400" dy="17.667">다른 집단은 그 시간에 관계없는 일을 하게 한다.</tspan><tspan x="400" dy="17.667">그러고 나서 두 집단 모두 뒤의 목록을 배우고 검사받는다</tspan></text></g><g ><g class="shape"><path d="M727 741h610v82H727z" class="stroke-B1 fill-B5 s0"/></g><text x="1032" y="779.5" class="text-bold fill-N1 s2"><tspan x="1032" dy="0">역행 간섭은 순서를 뒤집는다. 두 집단 모두 앞의 목록을 배우고,</tspan><tspan x="1032" dy="18.5">한 집단만 뒤의 목록을 더 배운 다음, 둘 다 앞의 목록을 검사받는다</tspan></text></g><g ><g class="shape"><path d="M386 931h660v82H386z" class="stroke-B1 fill-B5 s0"/></g><text x="716" y="969.5" class="text-bold fill-N1 s2"><tspan x="716" dy="0">두 설계 모두 ‘시간이 흐른 것’ 과 ‘다른 것이 끼어든 것’ 을 갈라 놓는다.</tspan><tspan x="716" dy="18.5">통제 집단이 없으면 그냥 시간이 지나서 잊은 것과 구별되지 않는다</tspan></text></g><marker id="mk-d2-3448660106-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3448660106-3488378134)" d="M205 133.5v116" class="connection stroke-B1 s0" mask="url(#d2-3448660106)"/><text x="205" y="198" class="text-italic fill-N2 s2">방해가 이 방향으로 간다</text><path fill="none" marker-end="url(#mk-d2-3448660106-3488378134)" d="M205 337v94" class="connection stroke-B1 s0" mask="url(#d2-3448660106)"/><path fill="none" marker-end="url(#mk-d2-3448660106-3488378134)" d="M594 133.5v116" class="connection stroke-B1 s0" mask="url(#d2-3448660106)"/><text x="594" y="198" class="text-italic fill-N2 s2">방해가 이 방향으로 간다</text><path fill="none" marker-end="url(#mk-d2-3448660106-3488378134)" d="M594 337v94" class="connection stroke-B1 s0" mask="url(#d2-3448660106)"/><path fill="none" marker-end="url(#mk-d2-3448660106-3488378134)" d="M399.5 833c0 38 34.8 58 170.156 96.895" class="connection stroke-B1 s0" mask="url(#d2-3448660106)"/><path fill="none" marker-end="url(#mk-d2-3448660106-3488378134)" d="M1031.5 825c0 44.4-34.8 66-170.156 104.895" class="connection stroke-B1 s0" mask="url(#d2-3448660106)"/><path fill="none" marker-end="url(#mk-d2-3448660106-3488378134)" d="M205 565v134" class="connection stroke-B1 s0" mask="url(#d2-3448660106)"/><path fill="none" marker-end="url(#mk-d2-3448660106-3488378134)" d="M594 565v93" class="connection stroke-B1 s0" mask="url(#d2-3448660106)"/><marker id="mk-d2-3448660106-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3448660106-2177206569)" d="M715.5 1045v114" class="connection" mask="url(#d2-3448660106)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3448660106" width="1676" height="1454" x="-208" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-208-121h1