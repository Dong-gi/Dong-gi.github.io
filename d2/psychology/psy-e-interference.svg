<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1587" class="d2-3175024692 d2-svg" viewBox="-101 -101 1040 1587"><rect width="1040" height="1587" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3175024692 .text-bold{font-weight:700}.d2-3175024692 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3175024692 .fill-N1{fill:#0a0f25}.d2-3175024692 .fill-N2{fill:#676c7e}.d2-3175024692 .fill-B4{fill:#e3e9fd}.d2-3175024692 .fill-B5{fill:#edf0fd}.d2-3175024692 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h355v576H0z" class="stroke-B1 fill-B4 s0"/></g><text x="177.5" y="33" class="fill-N1 s1"><tspan x="177.5" dy="0">순행 간섭 —</tspan><tspan x="177.5" dy="30.667">앞의 것이</tspan><tspan x="177.5" dy="30.667">뒤의 것을 방해한다</tspan></text></g><g ><g class="shape"><path d="M431 8h352v560H431z" class="stroke-B1 fill-B4 s0"/></g><text x="607" y="41" class="fill-N1 s1"><tspan x="607" dy="0">역행 간섭 —</tspan><tspan x="607" dy="30.667">뒤의 것이</tspan><tspan x="607" dy="30.667">앞의 것을 방해한다</tspan></text></g><g ><g class="shape"><path d="M147 696h691v468H147z" class="stroke-B1 fill-B4 s0"/></g><text x="492.5" y="655" class="fill-N1 s1"><tspan x="492.5" dy="0">어떻게 갈라 내나 —</tspan><tspan x="492.5" dy="32">통제 집단이 필요하다</tspan></text></g><text x="538" y="1300" class="fill-N1 s2"><tspan x="538" dy="0"> </tspan><tspan x="538" dy="16.833">간섭이 크게 일어나는 조건은 대체로 같다 — 두 자료가 서로 비슷할 때다.</tspan><tspan x="538" dy="16.833">그래서 완전히 다른 과목을 이어 공부하는 편이</tspan><tspan x="538" dy="16.833">비슷한 두 과목을 이어 하는 것보다 낫다는 제안이 나오지만,</tspan><tspan x="538" dy="16.833">이 제안이 실제 공부 상황에서 얼마나 도움이 되는지는</tspan><tspan x="538" dy="16.833">따로 확인할 일이다</tspan></text><g ><g class="shape"><path d="M60 102h235v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="177.5" y="140.5" class="text-bold fill-N1 s2"><tspan x="177.5" dy="0">먼저 배운 것</tspan><tspan x="177.5" dy="18.5">지난 학기의 자리 배치</tspan></text></g><g ><g class="shape"><path d="M60 244h235v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="177.5" y="282.5" class="text-bold fill-N1 s2"><tspan x="177.5" dy="0">나중에 배울 것</tspan><tspan x="177.5" dy="18.5">이번 학기의 자리 배치</tspan></text></g><g ><g class="shape"><path d="M60 386h235v130H60z" class="stroke-B1 fill-B5 s0"/></g><text x="177.5" y="424.5" class="text-bold fill-N1 s2"><tspan x="177.5" dy="0">검사</tspan><tspan x="177.5" dy="17">이번 학기 배치를</tspan><tspan x="177.5" dy="17">떠올린다.</tspan><tspan x="177.5" dy="17">지난 학기 것이</tspan><tspan x="177.5" dy="17">먼저 떠오른다</tspan></text></g><g ><g class="shape"><path d="M491 110h232v82H491z" class="stroke-B1 fill-B5 s0"/></g><text x="607" y="148.5" class="text-bold fill-N1 s2"><tspan x="607" dy="0">나중에 배운 것</tspan><tspan x="607" dy="18.5">새로 바꾼 비밀번호</tspan></text></g><g ><g class="shape"><path d="M491 252h232v82H491z" class="stroke-B1 fill-B5 s0"/></g><text x="607" y="290.5" class="text-bold fill-N1 s2"><tspan x="607" dy="0">먼저 배운 것</tspan><tspan x="607" dy="18.5">예전에 쓰던 비밀번호</tspan></text></g><g ><g class="shape"><path d="M491 394h232v114H491z" class="stroke-B1 fill-B5 s0"/></g><text x="607" y="432.5" class="text-bold fill-N1 s2"><tspan x="607" dy="0">검사</tspan><tspan x="607" dy="17.25">예전 것을 떠올린다.</tspan><tspan x="607" dy="17.25">새 것에 밀려</tspan><tspan x="607" dy="17.25">나오지 않는다</tspan></text></g><g ><g class="shape"><path d="M254 726h260v178H254z" class="stroke-B1 fill-B5 s0"/></g><text x="384" y="764.5" class="text-bold fill-N1 s2"><tspan x="384" dy="0">순행 간섭을 재려면,</tspan><tspan x="384" dy="16.625">한 집단만</tspan><tspan x="384" dy="16.625">앞의 목록을 배우게 하고</tspan><tspan x="384" dy="16.625">다른 집단은 그 시간에</tspan><tspan x="384" dy="16.625">관계없는 일을 하게 한다.</tspan><tspan x="384" dy="16.625">그러고 나서 두 집단 모두</tspan><tspan x="384" dy="16.625">뒤의 목록을 배우고</tspan><tspan x="384" dy="16.625">검사받는다</tspan></text></g><g ><g class="shape"><path d="M574 726h235v178H574z" class="stroke-B1 fill-B5 s0"/></g><text x="691.5" y="764.5" class="text-bold fill-N1 s2"><tspan x="691.5" dy="0">역행 간섭은</tspan><tspan x="691.5" dy="16.625">순서를 뒤집는다.</tspan><tspan x="691.5" dy="16.625">두 집단 모두</tspan><tspan x="691.5" dy="16.625">앞의 목록을 배우고,</tspan><tspan x="691.5" dy="16.625">한 집단만 뒤의 목록을</tspan><tspan x="691.5" dy="16.625">더 배운 다음,</tspan><tspan x="691.5" dy="16.625">둘 다 앞의 목록을</tspan><tspan x="691.5" dy="16.625">검사받는다</tspan></text></g><g ><g class="shape"><path d="M352 1004h373v130H352z" class="stroke-B1 fill-B5 s0"/></g><text x="538.5" y="1042.5" class="text-bold fill-N1 s2"><tspan x="538.5" dy="0">두 설계 모두 ‘시간이 흐른 것’ 과</tspan><tspan x="538.5" dy="17">‘다른 것이 끼어든 것’ 을 갈라 놓는다.</tspan><tspan x="538.5" dy="17">통제 집단이 없으면</tspan><tspan x="538.5" dy="17">그냥 시간이 지나서 잊은 것과</tspan><tspan x="538.5" dy="17">구별되지 않는다</tspan></text></g><marker id="mk-d2-3175024692-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3175024692-3488378134)" d="M177.5 186v54" class="connection stroke-B1 s0" mask="url(#d2-3175024692)"/><text x="178" y="220" class="text-italic fill-N2 s2">방해가 이 방향으로 간다</text><path fill="none" marker-end="url(#mk-d2-3175024692-3488378134)" d="M177.5 328v54" class="connection stroke-B1 s0" mask="url(#d2-3175024692)"/><path fill="none" marker-end="url(#mk-d2-3175024692-3488378134)" d="M607 194v54" class="connection stroke-B1 s0" mask="url(#d2-3175024692)"/><text x="607" y="228" class="text-italic fill-N2 s2">방해가 이 방향으로 간다</text><path fill="none" marker-end="url(#mk-d2-3175024692-3488378134)" d="M607 336v54" class="connection stroke-B1 s0" mask="url(#d2-3175024692)"/><path fill="none" marker-end="url(#mk-d2-3175024692-3488378134)" d="M384.25 906c0 38 13.4 58 63.794 95.608" class="connection stroke-B1 s0" mask="url(#d2-3175024692)"/><path fill="n