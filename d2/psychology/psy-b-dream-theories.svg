<svg xmlns="http://www.w3.org/2000/svg" width="3553" height="1277" class="d2-1967967407 d2-svg" viewBox="-91 -101 3553 1277"><rect width="3553" height="1277" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1967967407 .fill-N1{fill:#0a0f25}.d2-1967967407 .fill-B4{fill:#e3e9fd}.d2-1967967407 .fill-B5{fill:#edf0fd}.d2-1967967407 .stroke-B1,.d2-1967967407 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="1777.5" cy="73" class="shape stroke-B1" rx="219.5" ry="73" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1777.5" y="78.5" class="text-bold fill-N1 s0">꿈은 무엇을 하는가 — 미결이다</text></g><g ><g class="shape"><path d="M10 498h785v340H10z" class="stroke-B1 fill-B4 s1"/></g><text x="402.5" y="485" class="fill-N1 s2">소망의 충족</text></g><g ><g class="shape"><path d="M835 266h576v572H835z" class="stroke-B1 fill-B4 s1"/></g><text x="1123" y="253" class="fill-N1 s2">활성화와 종합</text></g><g ><g class="shape"><path d="M1451 274h652v556h-652z" class="stroke-B1 fill-B4 s1"/></g><text x="1777" y="261" class="fill-N1 s2">깨어 있는 삶의 연속</text></g><g ><g class="shape"><path d="M2143 266h594v564h-594z" class="stroke-B1 fill-B4 s1"/></g><text x="2440" y="253" class="fill-N1 s2">위협의 연습</text></g><g ><g class="shape"><path d="M2777 266h584v564h-584z" class="stroke-B1 fill-B4 s1"/></g><text x="3069" y="253" class="fill-N1 s2">기억 처리의 부산물</text></g><text x="1736" y="974" class="fill-N1 s0"><tspan x="1736" dy="0"> </tspan><tspan x="1736" dy="16.714">이 문서의 태도 — 어느 하나를 정답으로 쓰지 않는다. 미결이다.</tspan><tspan x="1736" dy="16.714"> </tspan><tspan x="1736" dy="16.714">그리고 이 다섯을 견주는 기준을 하나 세워 둔다 —</tspan><tspan x="1736" dy="16.714">‘무엇이 관찰되면 그 이론이 곤란해지는가’ 에 답할 수 있는 이론이 그렇지 못한 이론보다</tspan><tspan x="1736" dy="16.714">낫다. 이 기준으로 보면 첫 번째 이론이 가장 약하다.</tspan><tspan x="1736" dy="16.714">그것이 ‘틀렸다’ 는 뜻은 아니고 ‘검사되지 않는다’ 는 뜻이다</tspan></text><g ><g class="shape"><path d="M138 528h530v82H138z" class="stroke-B1 fill-B5 s1"/></g><text x="403" y="566.5" class="text-bold fill-N1 s0"><tspan x="403" dy="0">주장 — 꿈은 감춰진 소망이 모습을 바꾸어 나타난 것이다.</tspan><tspan x="403" dy="18.5">20세기 초에 나왔고 문화적으로 큰 영향을 남겼다</tspan></text></g><g ><g class="shape"><path d="M40 710h725v98H40z" class="stroke-B1 fill-B5 s1"/></g><text x="402.5" y="748.5" class="text-bold fill-N1 s0"><tspan x="402.5" dy="0">곤란한 자리 — 무엇이 관찰되면 이 주장이 틀린 것이 되는지가 정해져 있지 않다.</tspan><tspan x="402.5" dy="17.667">어떤 꿈이 나와도 ‘모습을 바꾼 것’ 으로 설명된다.</tspan><tspan x="402.5" dy="17.667">철학 문서 9장의 반증 가능성 이야기가 여기에 걸린다</tspan></text></g><g ><g class="shape"><path d="M865 296h516v82H865z" class="stroke-B1 fill-B5 s1"/></g><text x="1123" y="334.5" class="text-bold fill-N1 s0"><tspan x="1123" dy="0">주장 — 자는 동안 무작위에 가깝게 일어난 신경 활동을</tspan><tspan x="1123" dy="18.5">앞쪽 회로가 이야기로 엮은 것이 꿈이다 (1970년대 후반)</tspan></text></g><g ><g class="shape"><path d="M910 528h427v82H910z" class="stroke-B1 fill-B5 s1"/></g><text x="1123.5" y="566.5" class="text-bold fill-N1 s0"><tspan x="1123.5" dy="0">예측 — 꿈의 내용에 특별한 뜻이 없어야 하고,</tspan><tspan x="1123.5" dy="18.5">특정 수면 단계와 강하게 묶여야 한다</tspan></text></g><g ><g class="shape"><path d="M881 710h485v98H881z" class="stroke-B1 fill-B5 s1"/></g><text x="1123.5" y="748.5" class="text-bold fill-N1 s0"><tspan x="1123.5" dy="0">곤란한 자리 — 꿈 내용이 무작위 조합에 그치지 않고</tspan><tspan x="1123.5" dy="17.667">깨어 있는 삶의 관심사와 이어진다는 자료가 있다.</tspan><tspan x="1123.5" dy="17.667">그리고 REM 이 아닌 구간에서도 꿈 보고가 나온다</tspan></text></g><g ><g class="shape"><path d="M1481 304h592v66h-592z" class="stroke-B1 fill-B5 s1"/></g><text x="1777" y="342.5" class="text-bold fill-N1 s0">주장 — 꿈의 내용은 깨어 있는 동안의 관심사와 걱정을 이어 간다</text></g><g ><g class="shape"><path d="M1503 536h549v66h-549z" class="stroke-B1 fill-B5 s1"/></g><text x="1777.5" y="574.5" class="text-bold fill-N1 s0">예측 — 꿈 보고의 내용과 낮의 관심사가 함께 움직여야 한다</text></g><g ><g class="shape"><path d="M1504 718h547v82h-547z" class="stroke-B1 fill-B5 s1"/></g><text x="1777.5" y="756.5" class="text-bold fill-N1 s0"><tspan x="1777.5" dy="0">곤란한 자리 — 이것이 참이어도 ‘꿈이 무엇을 하는가’ 에는</tspan><tspan x="1777.5" dy="18.5">답하지 않는다. 기능이 아니라 내용에 대한 주장이다</tspan></text></g><g ><g class="shape"><path d="M2196 296h488v82h-488z" class="stroke-B1 fill-B5 s1"/></g><text x="2440" y="334.5" class="text-bold fill-N1 s0"><tspan x="2440" dy="0">주장 — 위협 상황을 안전하게 되풀이해 보는 일이고,</tspan><tspan x="2440" dy="18.5">그래서 진화적으로 자리 잡았다</tspan></text></g><g ><g class="shape"><path d="M2195 528h491v82h-491z" class="stroke-B1 fill-B5 s1"/></g><text x="2440.5" y="566.5" class="text-bold fill-N1 s0"><tspan x="2440.5" dy="0">예측 — 꿈에 위협 장면이 특히 많아야 하고,</tspan><tspan x="2440.5" dy="18.5">위협이 많은 환경에서 자란 사람에게 더 많아야 한다</tspan></text></g><g ><g class="shape"><path d="M2173 718h534v82h-534z" class="stroke-B1 fill-B5 s1"/></g><text x="2440" y="756.5" class="text-bold fill-N1 s0"><tspan x="2440" dy="0">곤란한 자리 — 꿈 내용을 세는 방식에 따라 결과가 갈린다.</tspan><tspan x="2440" dy="18.5">무엇을 ‘위협’ 으로 셀지부터 정해야 한다</tspan></text></g><g ><g class="shape"><path d="M2817 296h505v82h-505z" class="stroke-B1 fill-B5 s1"/></g><text x="3069.5" y="334.5" class="text-bold fill-N1 s0"><tspan x="3069.5" dy="0">주장 — 자는 동안 기억을 다시 처리하는 일이 일어나고</tspan><tspan x="3069.5" dy="18.5">꿈은 그 과정에서 겉으로 드러난 것이다</tspan></text></g><g ><g class="shape"><path d="M2822 528h494v82h-494z" class="stroke-B1 fill-B5 s1"/></g><text x="3069" y="566.5" class="text-bold fill-N1 s0"><tspan x="3069" dy="0">예측 — 낮에 익힌 것과 꿈 내용이 관계를 가져야 하고,</tspan><tspan x="3069" dy="18.5">꿈을 꾼 뒤 그 과제의 성적이 달라져야 한다</tspan></text></g><g ><g class="shape"><path d="M2807 718h524v82h-524z" class="stroke-B1 fill-B5 s1"/></g><text x="3069" y="756.5" class="text-bold fill-N1 s0"><tspan x="3069" dy="0">곤란한 자리 — 관계가 보고되어도 그것이 ‘부산물’ 인지</tspan><tspan x="3069" dy="18.5">‘과정의 일부’ 인지가 자료에서 갈리지 않는다</tspan></text></g><marker id="mk-d2-1967967407-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M402.5 612v94" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M1123 380v144" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M1123 612v94" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M1777 372v160" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M1777 604v110" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M2440 380v144" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M2440 612v102" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M3069 380v144" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M3069 612v102" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M1564.008 92.178C635.199 175.2 402.5 206 402.5 221v232" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M1584.034 109.37C1215.6 178.6 1123 201.8 1123 221" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M1777 148v81" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M1970.966 108.367C2345.8 178.4 2440 201.8 2440 221" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-3488378134)" d="M1990.991 93.19C2853 175.4 3069 201.8 3069 221" class="connection stroke-B1 s1" mask="url(#d2-1967967407)"/><marker id="mk-d2-1967967407-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1967967407-2177206569)" d="M402.5 840c0 54 192.05 83.629 956.263 145.82" class="connection stroke-B2 s4" mask="url(#d2-1967967407)"/><path fill="none" marker-end="url(#mk-d2-1967967407-2177206569)" d="M3069 832c0 60.4-192 91.6-956.013 153.676" class="connection stroke-B2 s4" mask="url(#d2-1967967407)"/><mask id="d2-1967967407" width="3553" height="1277" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h3553v1277H-91z"/></mask></svg>