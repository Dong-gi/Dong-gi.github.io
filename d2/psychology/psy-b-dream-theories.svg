<svg xmlns="http://www.w3.org/2000/svg" width="1786" height="1834" class="d2-145722137 d2-svg" viewBox="-101 -101 1786 1834"><rect width="1786" height="1834" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-145722137 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-145722137 .fill-N1{fill:#0a0f25}.d2-145722137 .fill-B4{fill:#e3e9fd}.d2-145722137 .fill-B5{fill:#edf0fd}.d2-145722137 .stroke-B1,.d2-145722137 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h507v492H0z" class="stroke-B1 fill-B4 s0"/></g><text x="253.5" y="33" class="fill-N1 s1">소망의 충족</text></g><g ><g class="shape"><path d="M547 0h507v492H547z" class="stroke-B1 fill-B4 s0"/></g><text x="800.5" y="33" class="fill-N1 s1">활성화와 종합</text></g><g ><g class="shape"><path d="M1094 0h490v492h-490z" class="stroke-B1 fill-B4 s0"/></g><text x="1339" y="33" class="fill-N1 s1">깨어 있는 삶의 연속</text></g><text x="204" y="618" class="fill-N1 s2"><tspan x="204" dy="0"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208">이 문서의 태도 — 어느 하나를</tspan><tspan x="204" dy="16.208">정답으로 쓰지 않는다. 미결이다.</tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208">그리고 이 다섯을 견주는 기준을 하나 세워 둔다 —</tspan><tspan x="204" dy="16.208">‘무엇이 관찰되면 그 이론이 곤란해지는가’ 에</tspan><tspan x="204" dy="16.208">답할 수 있는 이론이 그렇지 못한 이론보다</tspan><tspan x="204" dy="16.208">낫다. 이 기준으로 보면</tspan><tspan x="204" dy="16.208">첫 번째 이론이 가장 약하다.</tspan><tspan x="204" dy="16.208">그것이 ‘틀렸다’ 는 뜻은 아니고</tspan><tspan x="204" dy="16.208">‘검사되지 않는다’ 는 뜻이다</tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan><tspan x="204" dy="16.208"> </tspan></text><g ><g class="shape"><ellipse cx="800.5" cy="832" class="shape stroke-B1" rx="253.5" ry="230" style="fill:#f7f8fe;stroke-width:2"/></g><text x="800.5" y="837.5" class="text-bold fill-N1 s2">꿈은 무엇을 하는가 — 미결이다</text></g><g ><g class="shape"><path d="M1094 602h490v460h-490z" class="stroke-B1 fill-B4 s0"/></g><text x="1339" y="635" class="fill-N1 s1">위협의 연습</text></g><g ><g class="shape"><path d="M0 1172h507v460H0z" class="stroke-B1 fill-B4 s0"/></g><text x="253.5" y="1205" class="fill-N1 s1">기억 처리의 부산물</text></g><g ><g class="shape"><path d="M40 46h326v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="203" y="84.5" class="text-bold fill-N1 s2"><tspan x="203" dy="0">주장 — 꿈은 감춰진 소망이</tspan><tspan x="203" dy="17.25">모습을 바꾸어 나타난 것이다.</tspan><tspan x="203" dy="17.25">20세기 초에 나왔고</tspan><tspan x="203" dy="17.25">문화적으로 큰 영향을 남겼다</tspan></text></g><g ><g class="shape"><path d="M40 200h326v162H40z" class="stroke-B1 fill-B5 s0"/></g><text x="203" y="238.5" class="text-bold fill-N1 s2"><tspan x="203" dy="0">곤란한 자리 — 무엇이 관찰되면</tspan><tspan x="203" dy="16.714">이 주장이 틀린 것이</tspan><tspan x="203" dy="16.714">되는지가 정해져 있지 않다.</tspan><tspan x="203" dy="16.714">어떤 꿈이 나와도</tspan><tspan x="203" dy="16.714">‘모습을 바꾼 것’ 으로 설명된다.</tspan><tspan x="203" dy="16.714">철학 문서 9장의 반증 가능성</tspan><tspan x="203" dy="16.714">이야기가 여기에 걸린다</tspan></text></g><g ><g class="shape"><path d="M587 46h427v98H587z" class="stroke-B1 fill-B5 s0"/></g><text x="800.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="800.5" dy="0">주장 — 자는 동안 무작위에 가깝게 일어난</tspan><tspan x="800.5" dy="17.667">신경 활동을 앞쪽 회로가 이야기로 엮은 것이</tspan><tspan x="800.5" dy="17.667">꿈이다 (1970년대 후반)</tspan></text></g><g ><g class="shape"><path d="M587 184h427v82H587z" class="stroke-B1 fill-B5 s0"/></g><text x="800.5" y="222.5" class="text-bold fill-N1 s2"><tspan x="800.5" dy="0">예측 — 꿈의 내용에 특별한 뜻이 없어야 하고,</tspan><tspan x="800.5" dy="18.5">특정 수면 단계와 강하게 묶여야 한다</tspan></text></g><g ><g class="shape"><path d="M587 306h427v146H587z" class="stroke-B1 fill-B5 s0"/></g><text x="800.5" y="344.5" class="text-bold fill-N1 s2"><tspan x="800.5" dy="0">곤란한 자리 — 꿈 내용이</tspan><tspan x="800.5" dy="16.833">무작위 조합에 그치지 않고</tspan><tspan x="800.5" dy="16.833">깨어 있는 삶의 관심사와</tspan><tspan x="800.5" dy="16.833">이어진다는 자료가 있다.</tspan><tspan x="800.5" dy="16.833">그리고 REM 이 아닌</tspan><tspan x="800.5" dy="16.833">구간에서도 꿈 보고가 나온다</tspan></text></g><g ><g class="shape"><path d="M1134 46h410v82h-410z" class="stroke-B1 fill-B5 s0"/></g><text x="1339" y="84.5" class="text-bold fill-N1 s2"><tspan x="1339" dy="0">주장 — 꿈의 내용은 깨어 있는 동안의</tspan><tspan x="1339" dy="18.5">관심사와 걱정을 이어 간다</tspan></text></g><g ><g class="shape"><path d="M1134 168h410v82h-410z" class="stroke-B1 fill-B5 s0"/></g><text x="1339" y="206.5" class="text-bold fill-N1 s2"><tspan x="1339" dy="0">예측 — 꿈 보고의 내용과 낮의 관심사가</tspan><tspan x="1339" dy="18.5">함께 움직여야 한다</tspan></text></g><g ><g class="shape"><path d="M1134 290h410v98h-410z" class="stroke-B1 fill-B5 s0"/></g><text x="1339" y="328.5" class="text-bold fill-N1 s2"><tspan x="1339" dy="0">곤란한 자리 — 이것이 참이어도</tspan><tspan x="1339" dy="17.667">‘꿈이 무엇을 하는가’ 에는 답하지 않는다.</tspan><tspan x="1339" dy="17.667">기능이 아니라 내용에 대한 주장이다</tspan></text></g><g ><g class="shape"><path d="M1134 648h407v98h-407z" class="stroke-B1 fill-B5 s0"/></g><text x="1337.5" y="686.5" class="text-bold fill-N1 s2"><tspan x="1337.5" dy="0">주장 — 위협 상황을 안전하게</tspan><tspan x="1337.5" dy="17.667">되풀이해 보는 일이고,</tspan><tspan x="1337.5" dy="17.667">그래서 진화적으로 자리 잡았다</tspan></text></g><g ><g class="shape"><path d="M1134 786h407v98h-407z" class="stroke-B1 fill-B5 s0"/></g><text x="1337.5" y="824.5" class="text-bold fill-N1 s2"><tspan x="1337.5" dy="0">예측 — 꿈에 위협 장면이 특히 많아야 하고,</tspan><tspan x="1337.5" dy="17.667">위협이 많은 환경에서 자란 사람에게</tspan><tspan x="1337.5" dy="17.667">더 많아야 한다</tspan></text></g><g ><g class="shape"><path d="M1134 924h407v98h-407z" class="stroke-B1 fill-B5 s0"/></g><text x="1337.5" y="962.5" class="text-bold fill-N1 s2"><tspan x="1337.5" dy="0">곤란한 자리 — 꿈 내용을 세는 방식에 따라</tspan><tspan x="1337.5" dy="17.667">결과가 갈린다.</tspan><tspan x="1337.5" dy="17.667">무엇을 ‘위협’ 으로 셀지부터 정해야 한다</tspan></text></g><g ><g class="shape"><path d="M40 1218h427v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="253.5" y="1256.5" class="text-bold fill-N1 s2"><tspan x="253.5" dy="0">주장 — 자는 동안 기억을</tspan><tspan x="253.5" dy="17.667">다시 처리하는 일이 일어나고</tspan><tspan x="253.5" dy="17.667">꿈은 그 과정에서 겉으로 드러난 것이다</tspan></text></g><g ><g class="shape"><path d="M40 1356h427v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="253.5" y="1394.5" class="text-bold fill-N1 s2"><tspan x="253.5" dy="0">예측 — 낮에 익힌 것과</tspan><tspan x="253.5" dy="17.667">꿈 내용이 관계를 가져야 하고,</tspan><tspan x="253.5" dy="17.667">꿈을 꾼 뒤 그 과제의 성적이 달라져야 한다</tspan></text></g><g ><g class="shape"><path d="M40 1494h427v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="253.5" y="1532.5" class="text-bold fill-N1 s2"><tspan x="253.5" dy="0">곤란한 자리 — 관계가 보고되어도</tspan><tspan x="253.5" dy="17.667">그것이 ‘부산물’ 인지 ‘과정의 일부’ 인지가</tspan><tspan x="253.5" dy="17.667">자료에서 갈리지 않는다</tspan></text></g><marker id="mk-d2-145722137-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M203 162v34" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M800.5 146v34" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M800.5 268v34" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M1339 130v34" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M1339 252v34" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M1337.5 748v34" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M1337.5 886v34" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M253.5 1318v34" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M253.5 1456v34" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M634.635 655.538 484.73 494.924" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M801 600V496" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="m964.354 653.528 145.937-158.585" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="M1056 832h34" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-3488378134)" d="m632.616 1006.444-155.849 162.668" class="connection stroke-B1 s0" mask="url(#d2-145722137)"/><marker id="mk-d2-145722137-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-145722137-2177206569)" d="M253.5 494v104" class="connection stroke-B2 s4" mask="url(#d2-145722137)"/><path fill="none" marker-end="url(#mk-d2-145722137-2177206569)" d="M253.5 1170v-104" class="connection stroke-B2 s4" mask="url(#d2-145722137)"/><mask id="d2-145722137" width="1786" height="1834" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1786v1834H-101z"/></mask></svg>