<svg xmlns="http://www.w3.org/2000/svg" width="1467" height="1564" class="d2-2413419831 d2-svg" viewBox="-101 -101 1467 1564"><rect width="1467" height="1564" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2413419831 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2413419831 .fill-N1{fill:#0a0f25}.d2-2413419831 .fill-B4{fill:#e3e9fd}.d2-2413419831 .fill-B5{fill:#edf0fd}.d2-2413419831 .fill-B6{fill:#f7f8fe}.d2-2413419831 .stroke-B1,.d2-2413419831 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M226 0h332v668H226z" class="stroke-B1 fill-B4 s0"/></g><text x="392" y="33" class="fill-N1 s1">소망의 충족</text></g><g ><g class="shape"><path d="M598 0h309v668H598z" class="stroke-B1 fill-B4 s0"/></g><text x="752.5" y="33" class="fill-N1 s1">활성화와 종합</text></g><g ><g class="shape"><path d="M947 0h318v668H947z" class="stroke-B1 fill-B4 s0"/></g><text x="1106" y="33" class="fill-N1 s1">깨어 있는 삶의 연속</text></g><text x="93" y="774" class="fill-N1 s2"><tspan x="93" dy="0"> </tspan><tspan x="93" dy="16.161"> </tspan><tspan x="93" dy="16.161"> </tspan><tspan x="93" dy="16.161"> </tspan><tspan x="93" dy="16.161"> </tspan><tspan x="93" dy="16.161">이 문서의 태도 —</tspan><tspan x="93" dy="16.161">어느 하나를</tspan><tspan x="93" dy="16.161">정답으로 쓰지 않는다.</tspan><tspan x="93" dy="16.161">미결이다.</tspan><tspan x="93" dy="16.161"> </tspan><tspan x="93" dy="16.161">그리고 이 다섯을</tspan><tspan x="93" dy="16.161">견주는 기준을</tspan><tspan x="93" dy="16.161">하나 세워 둔다 —</tspan><tspan x="93" dy="16.161">‘무엇이 관찰되면</tspan><tspan x="93" dy="16.161">그 이론이</tspan><tspan x="93" dy="16.161">곤란해지는가’ 에</tspan><tspan x="93" dy="16.161">답할 수 있는 이론이</tspan><tspan x="93" dy="16.161">그렇지 못한</tspan><tspan x="93" dy="16.161">이론보다 낫다.</tspan><tspan x="93" dy="16.161">이 기준으로 보면</tspan><tspan x="93" dy="16.161">첫 번째 이론이</tspan><tspan x="93" dy="16.161">가장 약하다.</tspan><tspan x="93" dy="16.161">그것이 ‘틀렸다’ 는</tspan><tspan x="93" dy="16.161">뜻은 아니고</tspan><tspan x="93" dy="16.161">‘검사되지 않는다’ 는</tspan><tspan x="93" dy="16.161">뜻이다</tspan><tspan x="93" dy="16.161"> </tspan><tspan x="93" dy="16.161"> </tspan><tspan x="93" dy="16.161"> </tspan><tspan x="93" dy="16.161"> </tspan><tspan x="93" dy="16.161"> </tspan></text><g ><g class="shape"><path d="M226 758h332v604H226z" class="stroke-B1 fill-B4 s0"/></g><text x="392" y="791" class="fill-N1 s1">기억 처리의 부산물</text></g><g ><g class="shape"><ellipse cx="752.5" cy="1060" class="shape stroke-B1 fill-B6 s0" rx="154.5" ry="302"/></g><text x="752.5" y="1057.5" class="text-bold fill-N1 s2"><tspan x="752.5" dy="0">꿈은 무엇을 하는가</tspan><tspan x="752.5" dy="18.5">— 미결이다</tspan></text></g><g ><g class="shape"><path d="M947 758h318v604H947z" class="stroke-B1 fill-B4 s0"/></g><text x="1106" y="791" class="fill-N1 s1">위협의 연습</text></g><g ><g class="shape"><path d="M266 46h252v162H266z" class="stroke-B1 fill-B5 s0"/></g><text x="392" y="84.5" class="text-bold fill-N1 s2"><tspan x="392" dy="0">주장 — 꿈은</tspan><tspan x="392" dy="16.714">감춰진 소망이</tspan><tspan x="392" dy="16.714">모습을 바꾸어</tspan><tspan x="392" dy="16.714">나타난 것이다.</tspan><tspan x="392" dy="16.714">20세기 초에 나왔고</tspan><tspan x="392" dy="16.714">문화적으로 큰</tspan><tspan x="392" dy="16.714">영향을 남겼다</tspan></text></g><g ><g class="shape"><path d="M266 248h252v226H266z" class="stroke-B1 fill-B5 s0"/></g><text x="392" y="286.5" class="text-bold fill-N1 s2"><tspan x="392" dy="0">곤란한 자리 —</tspan><tspan x="392" dy="16.455">무엇이 관찰되면</tspan><tspan x="392" dy="16.455">이 주장이 틀린 것이</tspan><tspan x="392" dy="16.455">되는지가 정해져</tspan><tspan x="392" dy="16.455">있지 않다.</tspan><tspan x="392" dy="16.455">어떤 꿈이 나와도</tspan><tspan x="392" dy="16.455">‘모습을 바꾼 것’ 으로</tspan><tspan x="392" dy="16.455">설명된다.</tspan><tspan x="392" dy="16.455">철학 문서 9장의</tspan><tspan x="392" dy="16.455">반증 가능성</tspan><tspan x="392" dy="16.455">이야기가 여기에 걸린다</tspan></text></g><g ><g class="shape"><path d="M638 46h229v162H638z" class="stroke-B1 fill-B5 s0"/></g><text x="752.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="752.5" dy="0">주장 — 자는 동안</tspan><tspan x="752.5" dy="16.714">무작위에 가깝게</tspan><tspan x="752.5" dy="16.714">일어난 신경 활동을</tspan><tspan x="752.5" dy="16.714">앞쪽 회로가</tspan><tspan x="752.5" dy="16.714">이야기로 엮은 것이</tspan><tspan x="752.5" dy="16.714">꿈이다</tspan><tspan x="752.5" dy="16.714">(1970년대 후반)</tspan></text></g><g ><g class="shape"><path d="M638 248h229v130H638z" class="stroke-B1 fill-B5 s0"/></g><text x="752.5" y="286.5" class="text-bold fill-N1 s2"><tspan x="752.5" dy="0">예측 — 꿈의 내용에</tspan><tspan x="752.5" dy="17">특별한 뜻이</tspan><tspan x="752.5" dy="17">없어야 하고,</tspan><tspan x="752.5" dy="17">특정 수면 단계와</tspan><tspan x="752.5" dy="17">강하게 묶여야 한다</tspan></text></g><g ><g class="shape"><path d="M638 418h229v210H638z" class="stroke-B1 fill-B5 s0"/></g><text x="752.5" y="456.5" class="text-bold fill-N1 s2"><tspan x="752.5" dy="0">곤란한 자리 —</tspan><tspan x="752.5" dy="16.5">꿈 내용이</tspan><tspan x="752.5" dy="16.5">무작위 조합에</tspan><tspan x="752.5" dy="16.5">그치지 않고</tspan><tspan x="752.5" dy="16.5">깨어 있는 삶의</tspan><tspan x="752.5" dy="16.5">관심사와 이어진다는</tspan><tspan x="752.5" dy="16.5">자료가 있다.</tspan><tspan x="752.5" dy="16.5">그리고 REM 이 아닌</tspan><tspan x="752.5" dy="16.5">구간에서도</tspan><tspan x="752.5" dy="16.5">꿈 보고가 나온다</tspan></text></g><g ><g class="shape"><path d="M987 46h232v114H987z" class="stroke-B1 fill-B5 s0"/></g><text x="1103" y="84.5" class="text-bold fill-N1 s2"><tspan x="1103" dy="0">주장 — 꿈의 내용은</tspan><tspan x="1103" dy="17.25">깨어 있는 동안의</tspan><tspan x="1103" dy="17.25">관심사와 걱정을</tspan><tspan x="1103" dy="17.25">이어 간다</tspan></text></g><g ><g class="shape"><path d="M987 200h232v98H987z" class="stroke-B1 fill-B5 s0"/></g><text x="1103" y="238.5" class="text-bold fill-N1 s2"><tspan x="1103" dy="0">예측 — 꿈 보고의</tspan><tspan x="1103" dy="17.667">내용과 낮의 관심사가</tspan><tspan x="1103" dy="17.667">함께 움직여야 한다</tspan></text></g><g ><g class="shape"><path d="M987 338h232v162H987z" class="stroke-B1 fill-B5 s0"/></g><text x="1103" y="376.5" class="text-bold fill-N1 s2"><tspan x="1103" dy="0">곤란한 자리 —</tspan><tspan x="1103" dy="16.714">이것이 참이어도</tspan><tspan x="1103" dy="16.714">‘꿈이 무엇을</tspan><tspan x="1103" dy="16.714">하는가’ 에는</tspan><tspan x="1103" dy="16.714">답하지 않는다.</tspan><tspan x="1103" dy="16.714">기능이 아니라</tspan><tspan x="1103" dy="16.714">내용에 대한 주장이다</tspan></text></g><g ><g class="shape"><path d="M266 804h252v146H266z" class="stroke-B1 fill-B5 s0"/></g><text x="392" y="842.5" class="text-bold fill-N1 s2"><tspan x="392" dy="0">주장 — 자는 동안</tspan><tspan x="392" dy="16.833">기억을 다시</tspan><tspan x="392" dy="16.833">처리하는 일이</tspan><tspan x="392" dy="16.833">일어나고</tspan><tspan x="392" dy="16.833">꿈은 그 과정에서</tspan><tspan x="392" dy="16.833">겉으로 드러난 것이다</tspan></text></g><g ><g class="shape"><path d="M266 990h252v146H266z" class="stroke-B1 fill-B5 s0"/></g><text x="392" y="1028.5" class="text-bold fill-N1 s2"><tspan x="392" dy="0">예측 — 낮에 익힌</tspan><tspan x="392" dy="16.833">것과 꿈 내용이</tspan><tspan x="392" dy="16.833">관계를 가져야 하고,</tspan><tspan x="392" dy="16.833">꿈을 꾼 뒤</tspan><tspan x="392" dy="16.833">그 과제의 성적이</tspan><tspan x="392" dy="16.833">달라져야 한다</tspan></text></g><g ><g class="shape"><path d="M266 1176h252v130H266z" class="stroke-B1 fill-B5 s0"/></g><text x="392" y="1214.5" class="text-bold fill-N1 s2"><tspan x="392" dy="0">곤란한 자리 —</tspan><tspan x="392" dy="17">관계가 보고되어도</tspan><tspan x="392" dy="17">그것이 ‘부산물’ 인지</tspan><tspan x="392" dy="17">‘과정의 일부’ 인지가</tspan><tspan x="392" dy="17">자료에서 갈리지 않는다</tspan></text></g><g ><g class="shape"><path d="M987 804h238v130H987z" class="stroke-B1 fill-B5 s0"/></g><text x="1106" y="842.5" class="text-bold fill-N1 s2"><tspan x="1106" dy="0">주장 — 위협 상황을</tspan><tspan x="1106" dy="17">안전하게</tspan><tspan x="1106" dy="17">되풀이해 보는 일이고,</tspan><tspan x="1106" dy="17">그래서 진화적으로</tspan><tspan x="1106" dy="17">자리 잡았다</tspan></text></g><g ><g class="shape"><path d="M987 974h238v146H987z" class="stroke-B1 fill-B5 s0"/></g><text x="1106" y="1012.5" class="text-bold fill-N1 s2"><tspan x="1106" dy="0">예측 — 꿈에</tspan><tspan x="1106" dy="16.833">위협 장면이</tspan><tspan x="1106" dy="16.833">특히 많아야 하고,</tspan><tspan x="1106" dy="16.833">위협이 많은 환경에서</tspan><tspan x="1106" dy="16.833">자란 사람에게</tspan><tspan x="1106" dy="16.833">더 많아야 한다</tspan></text></g><g ><g class="shape"><path d="M987 1160h238v162H987z" class="stroke-B1 fill-B5 s0"/></g><text x="1106" y="1198.5" class="text-bold fill-N1 s2"><tspan x="1106" dy="0">곤란한 자리 —</tspan><tspan x="1106" dy="16.714">꿈 내용을 세는</tspan><tspan x="1106" dy="16.714">방식에 따라</tspan><tspan x="1106" dy="16.714">결과가 갈린다.</tspan><tspan x="1106" dy="16.714">무엇을 ‘위협’ 으로</tspan><tspan x="1106" dy="16.714">셀지부터</tspan><tspan x="1106" dy="16.714">정해야 한다</tspan></text></g><marker id="mk-d2-2413419831-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M392 210v34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M752.5 210v34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M752.5 380v34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M1103 162v34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M1103 300v34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M392 952v34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M392 1138v34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M1106 936v34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M1106 1122v34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="m644.11 841.21-84.33-169.628" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M753 756v-84" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="m859.874 840.201 85.377-175.604" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M909 1060h34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-3488378134)" d="M596 1060h-34" class="connection stroke-B1 s0" mask="url(#d2-2413419831)"/><marker id="mk-d2-2413419831-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2413419831-2177206569)" d="M253.242 669.85 187.516 830.3" class="connection stroke-B2 s4" mask="url(#d2-2413419831)"/><path fill="none" marker-end="url(#mk-d2-2413419831-2177206569)" d="M224 1060h-34" class="connection stroke-B2 s4" mask="url(#d2-2413419831)"/><mask id="d2-2413419831" width="1467" height="1564" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1467v1564H-101z"/></mask></svg>