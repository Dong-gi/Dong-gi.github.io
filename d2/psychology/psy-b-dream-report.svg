<svg xmlns="http://www.w3.org/2000/svg" width="1132" height="1234" class="d2-3990192770 d2-svg" viewBox="-101 -101 1132 1234"><rect width="1132" height="1234" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3990192770 .fill-N1{fill:#0a0f25}.d2-3990192770 .fill-B6{fill:#f7f8fe}.d2-3990192770 .stroke-B1,.d2-3990192770 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="212.5" cy="69.5" class="shape stroke-B1 fill-B6 s0" rx="212.5" ry="69.5"/></g><text x="212.5" y="75" class="text-bold fill-N1 s1">1. 자는 동안 실제로 일어난 것</text></g><text x="640" y="16" class="fill-N1 s1">연구자는 여기에 직접 닿을 수 없다</text><g ><g class="shape"><path d="M0 189h425v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="212.5" y="227.5" class="text-bold fill-N1 s1">2. 깨어남</text></g><text x="696.5" y="205" class="fill-N1 s1"><tspan x="696.5" dy="0">깨우는 방식이 결과를 바꾼다.</tspan><tspan x="696.5" dy="17.667">언제 깨우는가(어느 단계에서), 어떻게 깨우는가,</tspan><tspan x="696.5" dy="17.667">깨자마자 묻는가 아침에 묻는가</tspan></text><g ><g class="shape"><path d="M0 305h425v69H0z" class="stroke-B1 fill-B6 s0"/></g><text x="212.5" y="345" class="text-bold fill-N1 s1">3. 깨어난 뒤 남아 있는 기억</text></g><text x="712.5" y="321" class="fill-N1 s1"><tspan x="712.5" dy="0">여기가 가장 큰 관문이다. 대부분은 남지 않는다.</tspan><tspan x="712.5" dy="17.25">그리고 남은 것도 9장이 다룬 기억의 성질을</tspan><tspan x="712.5" dy="17.25">그대로 갖는다 —</tspan><tspan x="712.5" dy="17.25">빈자리가 메워지고, 나중에 들은 것이 섞여 들어간다</tspan></text><g ><g class="shape"><path d="M0 424h425v85H0z" class="stroke-B1 fill-B6 s0"/></g><text x="212.5" y="472" class="text-bold fill-N1 s1">4. 말이나 글로 옮기기</text></g><text x="676.5" y="440" class="fill-N1 s1"><tspan x="676.5" dy="0">이야기가 아니었던 것이 이야기가 된다.</tspan><tspan x="676.5" dy="17">앞뒤가 없던 것에 순서가 생기고,</tspan><tspan x="676.5" dy="17">말로 옮기기 어려운 것은 빠진다.</tspan><tspan x="676.5" dy="17">그리고 무엇을 물었느냐에 따라</tspan><tspan x="676.5" dy="17">무엇을 적을지가 달라진다 (5장의 요구특성)</tspan></text><g ><g class="shape"><path d="M0 559h425v85H0z" class="stroke-B1 fill-B6 s0"/></g><text x="212.5" y="607" class="text-bold fill-N1 s1">5. 연구자가 항목으로 세기</text></g><text x="694.5" y="575" class="fill-N1 s1"><tspan x="694.5" dy="0">‘위협 장면’ 이나 ‘아는 사람’ 을</tspan><tspan x="694.5" dy="17">무엇으로 셀지 미리 정해야 하고,</tspan><tspan x="694.5" dy="17">그 정의가 결과를 정한다. 여러 사람이 따로 세어</tspan><tspan x="694.5" dy="17">얼마나 일치하는지를 보고해야 한다</tspan><tspan x="694.5" dy="17">(5장의 평정자 간 신뢰도)</tspan></text><g ><g class="shape"><ellipse cx="212.5" cy="723.5" class="shape stroke-B1 fill-B6 s0" rx="212.5" ry="29.5"/></g><text x="212.5" y="729" class="text-bold fill-N1 s1">6. 자료</text></g><path fill="transparent" stroke="transparent" d="M495 694h435v59H495z" class="shape s0"/><text x="212.5" y="819" class="fill-N1 s1"><tspan x="212.5" dy="0"> </tspan><tspan x="212.5" dy="16.357">그래서 꿈 연구의 자료는</tspan><tspan x="212.5" dy="16.357">‘꿈이 아니라 꿈에 대한 보고’ 다.</tspan><tspan x="212.5" dy="16.357"> </tspan><tspan x="212.5" dy="16.357">이것은 꿈 연구가 쓸모없다는 뜻이 아니다.</tspan><tspan x="212.5" dy="16.357">12장의 지각 연구도, 16장의 정서 연구도</tspan><tspan x="212.5" dy="16.357">자기보고를 쓴다. 뜻하는 것은 이것이다 —</tspan><tspan x="212.5" dy="16.357">‘보고에 나타난 규칙성을 꿈 자체의 성질로</tspan><tspan x="212.5" dy="16.357">곧바로 옮겨 적으면 안 된다.’</tspan><tspan x="212.5" dy="16.357"> </tspan><tspan x="212.5" dy="16.357">그리고 이 사슬을 알면 무엇을 개선할지도 보인다 —</tspan><tspan x="212.5" dy="16.357">깨우는 시점을 통제하고, 깨자마자 받아 적게 하고,</tspan><tspan x="212.5" dy="16.357">세는 규칙을 미리 정해 공개하고,</tspan><tspan x="212.5" dy="16.357">여러 사람이 따로 세어 일치도를 보고하는 것이다</tspan></text><marker id="mk-d2-3990192770-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3990192770-2177206569)" d="M427 70h64" class="connection stroke-B2 s3" mask="url(#d2-3990192770)"/><path fill="none" marker-end="url(#mk-d2-3990192770-2177206569)" d="M426.5 222h65" class="connection stroke-B2 s3" mask="url(#d2-3990192770)"/><path fill="none" marker-end="url(#mk-d2-3990192770-2177206569)" d="M426.5 339.5h65" class="connection stroke-B2 s3" mask="url(#d2-3990192770)"/><path fill="none" marker-end="url(#mk-d2-3990192770-2177206569)" d="M426.5 466.5h65" class="connection stroke-B2 s3" mask="url(#d2-3990192770)"/><path fill="none" marker-end="url(#mk-d2-3990192770-2177206569)" d="M426.5 601.5h65" class="connection stroke-B2 s3" mask="url(#d2-3990192770)"/><marker id="mk-d2-3990192770-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3990192770-3488378134)" d="M213 141v44" class="connection stroke-B1 s0" mask="url(#d2-3990192770)"/><path fill="none" marker-end="url(#mk-d2-3990192770-3488378134)" d="M212.5 256.5v45" class="connection stroke-B1 s0" mask="url(#d2-3990192770)"/><path fill="none" marker-end="url(#mk-d2-3990192770-3488378134)" d="M212.5 375.5v45" class="connection stroke-B1 s0" mask="url(#d2-3990192770)"/><path fill="none" marker-end="url(#mk-d2-3990192770-3488378134)" d="M212.5 510.5v45" class="connection stroke-B1 s0" mask="url(#d2-3990192770)"/><path fill="none" marker-end="url(#mk-d2-3990192770-3488378134)" d="m212.52 645.5.44 44.5" class="connection stroke-B1 s0" mask="url(#d2-3990192770)"/><path fill="none" marker-end="url(#mk-d2-3990192770-2177206569)" d="M213 755v44" class="connection stroke-B2 s3" mask="url(#d2-3990192770)"/><mask id="d2-3990192770" width="1132" height="1234" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1132v1234H-101z"/></mask></svg>