<svg xmlns="http://www.w3.org/2000/svg" width="1895" height="1429" class="d2-4266293274 d2-svg" viewBox="-101 -101 1895 1429"><rect width="1895" height="1429" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4266293274 .fill-N1{fill:#0a0f25}.d2-4266293274 .fill-B6{fill:#f7f8fe}.d2-4266293274 .stroke-B1,.d2-4266293274 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="347.5" cy="69.5" class="shape stroke-B1 fill-B6 s0" rx="208.5" ry="69.5"/></g><text x="347.5" y="75" class="text-bold fill-N1 s1">1. 자는 동안 실제로 일어난 것</text></g><text x="214" y="278" class="fill-N1 s1">연구자는 여기에 직접 닿을 수 없다</text><g ><g class="shape"><path d="M419 239h122v66H419z" class="stroke-B1 fill-B6 s0"/></g><text x="480" y="277.5" class="text-bold fill-N1 s1">2. 깨어남</text></g><text x="254" y="436" class="fill-N1 s1"><tspan x="254" dy="0">깨우는 방식이 결과를 바꾼다. 언제 깨우는가(어느 단계에서),</tspan><tspan x="254" dy="18.5">어떻게 깨우는가, 깨자마자 묻는가 아침에 묻는가</tspan></text><g ><g class="shape"><path d="M568 405h276v66H568z" class="stroke-B1 fill-B6 s0"/></g><text x="706" y="443.5" class="text-bold fill-N1 s1">3. 깨어난 뒤 남아 있는 기억</text></g><text x="494" y="594" class="fill-N1 s1"><tspan x="494" dy="0">여기가 가장 큰 관문이다. 대부분은 남지 않는다.</tspan><tspan x="494" dy="17.667">그리고 남은 것도 9장이 다룬 기억의 성질을 그대로 갖는다 —</tspan><tspan x="494" dy="17.667">빈자리가 메워지고, 나중에 들은 것이 섞여 들어간다</tspan></text><g ><g class="shape"><path d="M803 571h229v66H803z" class="stroke-B1 fill-B6 s0"/></g><text x="917.5" y="609.5" class="text-bold fill-N1 s1">4. 말이나 글로 옮기기</text></g><text x="662.5" y="760" class="fill-N1 s1"><tspan x="662.5" dy="0">이야기가 아니었던 것이 이야기가 된다. 앞뒤가 없던 것에 순서가 생기고,</tspan><tspan x="662.5" dy="17.667">말로 옮기기 어려운 것은 빠진다.</tspan><tspan x="662.5" dy="17.667">그리고 무엇을 물었느냐에 따라 무엇을 적을지가 달라진다 (4장의 요구특성)</tspan></text><g ><g class="shape"><path d="M1038 737h270v66h-270z" class="stroke-B1 fill-B6 s0"/></g><text x="1173" y="775.5" class="text-bold fill-N1 s1">5. 연구자가 항목으로 세기</text></g><text x="971.5" y="922" class="fill-N1 s1"><tspan x="971.5" dy="0">‘위협 장면’ 이나 ‘아는 사람’ 을 무엇으로 셀지 미리 정해야 하고,</tspan><tspan x="971.5" dy="17.667">그 정의가 결과를 정한다. 여러 사람이 따로 세어</tspan><tspan x="971.5" dy="17.667">얼마나 일치하는지를 보고해야 한다 (5장의 평정자 간 신뢰도)</tspan></text><g ><g class="shape"><ellipse cx="1375.5" cy="932.5" class="shape stroke-B1 fill-B6 s0" rx="69.5" ry="29.5"/></g><text x="1375.5" y="938" class="text-bold fill-N1 s1">6. 자료</text></g><text x="1375.5" y="1078" class="fill-N1 s1"><tspan x="1375.5" dy="0"> </tspan><tspan x="1375.5" dy="16.5">그래서 꿈 연구의 자료는 ‘꿈이 아니라 꿈에 대한 보고’ 다.</tspan><tspan x="1375.5" dy="16.5"> </tspan><tspan x="1375.5" dy="16.5">이것은 꿈 연구가 쓸모없다는 뜻이 아니다. 12장의 지각 연구도,</tspan><tspan x="1375.5" dy="16.5">16장의 정서 연구도 자기보고를 쓴다. 뜻하는 것은 이것이다 —</tspan><tspan x="1375.5" dy="16.5">‘보고에 나타난 규칙성을 꿈 자체의 성질로 곧바로 옮겨 적으면 안 된다.’</tspan><tspan x="1375.5" dy="16.5"> </tspan><tspan x="1375.5" dy="16.5">그리고 이 사슬을 알면 무엇을 개선할지도 보인다 — 깨우는 시점을 통제하고,</tspan><tspan x="1375.5" dy="16.5">깨자마자 받아 적게 하고, 세는 규칙을 미리 정해 공개하고,</tspan><tspan x="1375.5" dy="16.5">여러 사람이 따로 세어 일치도를 보고하는 것이다</tspan></text><marker id="mk-d2-4266293274-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-4266293274-2177206569)" d="M273.502 136.326C226.2 178.2 214 203.5 214 257.5" class="connection stroke-B2 s3" mask="url(#d2-4266293274)"/><path fill="none" marker-end="url(#mk-d2-4266293274-2177206569)" d="M417.124 294.694C287 342.8 254 367.9 254 415.5" class="connection stroke-B2 s3" mask="url(#d2-4266293274)"/><path fill="none" marker-end="url(#mk-d2-4266293274-2177206569)" d="M620.387 471.728C519.85 511 494.25 532.3 494.25 573.5" class="connection stroke-B2 s3" mask="url(#d2-4266293274)"/><path fill="none" marker-end="url(#mk-d2-4266293274-2177206569)" d="M814.598 637.618C693.3 677 662.5 698.3 662.5 739.5" class="connection stroke-B2 s3" mask="url(#d2-4266293274)"/><path fill="none" marker-end="url(#mk-d2-4266293274-2177206569)" d="M1091.15 803.758C995.4 843 971 863.6 971 902" class="connection stroke-B2 s3" mask="url(#d2-4266293274)"/><marker id="mk-d2-4266293274-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-4266293274-3488378134)" d="M420.498 136.326C467.8 178.2 480 199 480 235" class="connection stroke-B1 s0" mask="url(#d2-4266293274)"/><path fill="none" marker-end="url(#mk-d2-4266293274-3488378134)" d="M542.876 294.694C673 342.8 706 365 706 401" class="connection stroke-B1 s0" mask="url(#d2-4266293274)"/><path fill="none" marker-end="url(#mk-d2-4266293274-3488378134)" d="M791.613 471.728C892.15 511 917.75 531 917.75 567" class="connection stroke-B1 s0" mask="url(#d2-4266293274)"/><path fill="none" marker-end="url(#mk-d2-4266293274-3488378134)" d="M1020.902 637.618C1142.2 677 1173 697 1173 733" class="connection stroke-B1 s0" mask="url(#d2-4266293274)"/><path fill="none" marker-end="url(#mk-d2-4266293274-3488378134)" d="M1254.85 803.758C1350.6 843 1375 863 1375 899" class="connection stroke-B1 s0" mask="url(#d2-4266293274)"/><path fill="none" marker-end="url(#mk-d2-4266293274-2177206569)" d="M1375 964v94" class="connection stroke-B2 s3" mask="url(#d2-4266293274)"/><mask id="d2-4266293274" width="1895" height="1429" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1895v1429H-101z"/></mask></svg>