<svg xmlns="http://www.w3.org/2000/svg" width="5975" height="1083" class="d2-2304115536 d2-svg" viewBox="-91 -101 5975 1083"><rect width="5975" height="1083" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2304115536 .fill-N1{fill:#0a0f25}.d2-2304115536 .fill-B4{fill:#e3e9fd}.d2-2304115536 .fill-B5{fill:#edf0fd}.d2-2304115536 .stroke-B1,.d2-2304115536 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="1756" cy="58" class="shape stroke-B1" rx="174" ry="58" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1756" y="63.5" class="text-bold fill-N1 s0">1971년에 무엇이 있었나</text></g><text x="1413.5" y="305" class="fill-N1 s0"><tspan x="1413.5" dy="0">대학생 지원자를 모아 한쪽에 간수 역할, 다른 쪽에 수감자 역할을 맡기고</tspan><tspan x="1413.5" dy="17.667">지하실에 만든 모의 감옥에서 지내게 했다. 예정보다 일찍 중단되었다.</tspan><tspan x="1413.5" dy="17.667">‘상황이 사람을 바꾼다’ 는 결론이 널리 퍼졌다</tspan></text><g ><g class="shape"><path d="M1786 236h3997v158H1786z" class="stroke-B1 fill-B4 s1"/></g><text x="3784.5" y="223" class="fill-N1 s2">왜 연구로 성립하지 않는가</text></g><g ><g class="shape"><path d="M10 542h3627v142H10z" class="stroke-B1 fill-B4 s1"/></g><text x="1823.5" y="529" class="fill-N1 s2">그런데 왜 그토록 널리 인용되었나</text></g><g ><g class="shape"><path d="M3964 534h799v158h-799z" class="stroke-B1 fill-B4 s1"/></g><text x="4363.5" y="521" class="fill-N1 s2">견줄 것이 하나 있다</text></g><text x="3059.5" y="828" class="fill-N1 s0"><tspan x="3059.5" dy="0"> </tspan><tspan x="3059.5" dy="17.25">이 장이 이것을 다루는 이유 — 결과를 소개하기 위해서가 아니라</tspan><tspan x="3059.5" dy="17.25">‘검사받지 않은 이야기가 어떻게 사실이 되는가’ 를 보이기 위해서다.</tspan><tspan x="3059.5" dy="17.25">이 사례에서 배울 것은 감옥에 대한 것이 아니라 인용에 대한 것이다</tspan></text><g ><g class="shape"><path d="M1816 266h622v98h-622z" class="stroke-B1 fill-B5 s1"/></g><text x="2127" y="304.5" class="text-bold fill-N1 s0"><tspan x="2127" dy="0">비교 조건이 없다</tspan><tspan x="2127" dy="17.667">조건이 하나뿐이므로 ‘상황 때문’ 이라고 말할 자료 구조가 아니다.</tspan><tspan x="2127" dy="17.667">무엇과 견주어 달라졌다고 하는지가 없다</tspan></text></g><g ><g class="shape"><path d="M2498 266h628v98h-628z" class="stroke-B1 fill-B5 s1"/></g><text x="2812" y="304.5" class="text-bold fill-N1 s0"><tspan x="2812" dy="0">모집 광고가 표본을 골랐다</tspan><tspan x="2812" dy="17.667">‘감옥 생활 연구’ 라고 밝히고 모집했다. 뒷날 한 연구가 같은 문구와</tspan><tspan x="2812" dy="17.667">중립적인 문구로 각각 모집해, 모이는 사람이 다르다는 것을 보였다</tspan></text></g><g ><g class="shape"><path d="M3186 266h725v98h-725z" class="stroke-B1 fill-B5 s1"/></g><text x="3548.5" y="304.5" class="text-bold fill-N1 s0"><tspan x="3548.5" dy="0">연구자가 참여자였다</tspan><tspan x="3548.5" dy="17.667">연구를 이끈 사람이 교도소장 역할을 맡았다. 관찰자와 개입자가 같은 사람이면</tspan><tspan x="3548.5" dy="17.667">실험자 기대가 결과와 구별되지 않는다 — 6장에서 본 문제다</tspan></text></g><g ><g class="shape"><path d="M3971 266h786v98h-786z" class="stroke-B1 fill-B5 s1"/></g><text x="4364" y="304.5" class="text-bold fill-N1 s0"><tspan x="4364" dy="0">간수에게 지시가 있었다</tspan><tspan x="4364" dy="17.667">공개된 기록에서 연구진이 간수 역할에게 어떻게 행동하라고 이르는 것이 확인되었다.</tspan><tspan x="4364" dy="17.667">그러면 ‘역할이 저절로 사람을 바꾸었다’ 는 서술이 성립하지 않는다</tspan></text></g><g ><g class="shape"><path d="M4817 266h496v98h-496z" class="stroke-B1 fill-B5 s1"/></g><text x="5065" y="304.5" class="text-bold fill-N1 s0"><tspan x="5065" dy="0">자료가 체계적으로 기록되지 않았다</tspan><tspan x="5065" dy="17.667">무엇을 언제 어떤 규칙으로 셌는지가 남아 있지 않다.</tspan><tspan x="5065" dy="17.667">지금의 기준으로는 자료라고 부를 수 있는 것이 없다</tspan></text></g><g ><g class="shape"><path d="M5373 282h380v66h-380z" class="stroke-B1 fill-B5 s1"/></g><text x="5563" y="320.5" class="text-bold fill-N1 s0">일부 참가자가 뒷날 연기였다고 말했다</text></g><g ><g class="shape"><path d="M40 572h582v82H40z" class="stroke-B1 fill-B5 s1"/></g><text x="331" y="610.5" class="text-bold fill-N1 s0"><tspan x="331" dy="0">이야기가 강하다. 줄거리가 있고 장면이 그려지고 결말이 있다.</tspan><tspan x="331" dy="18.5">표와 구간이 있는 연구는 이렇게 옮겨지지 않는다</tspan></text></g><g ><g class="shape"><path d="M682 580h711v66H682z" class="stroke-B1 fill-B5 s1"/></g><text x="1037.5" y="618.5" class="text-bold fill-N1 s0">결론이 쓸모 있어 보였다. 현실에서 벌어진 일을 설명하는 데 계속 불려 나왔다</text></g><g ><g class="shape"><path d="M1453 572h605v82h-605z" class="stroke-B1 fill-B5 s1"/></g><text x="1755.5" y="610.5" class="text-bold fill-N1 s0"><tspan x="1755.5" dy="0">검사할 수 있는 예측을 내놓지 않았다. 그래서 반증되지도 않았다.</tspan><tspan x="1755.5" dy="18.5">무엇이 나와도 ‘상황의 힘’ 으로 설명된다</tspan></text></g><g ><g class="shape"><path d="M2118 580h704v66h-704z" class="stroke-B1 fill-B5 s1"/></g><text x="2470" y="618.5" class="text-bold fill-N1 s0">교과서와 대중매체가 서로를 인용했다. 원 자료로 돌아간 사람이 오래 없었다</text></g><g ><g class="shape"><path d="M2882 580h725v66h-725z" class="stroke-B1 fill-B5 s1"/></g><text x="3244.5" y="618.5" class="text-bold fill-N1 s0">재현할 필요를 아무도 느끼지 않았다. 이미 아는 사실처럼 다루어졌기 때문이다</text></g><g ><g class="shape"><path d="M3994 564h739v98h-739z" class="stroke-B1 fill-B5 s1"/></g><text x="4363.5" y="602.5" class="text-bold fill-N1 s0"><tspan x="4363.5" dy="0">2000년대 초에 방송사와 함께 이루어진 다른 모의 감옥 연구가 있다.</tspan><tspan x="4363.5" dy="17.667">절차와 자료가 공개되었고 결과가 달랐다 — 역할이 저절로 사람을 바꾸지 않았다.</tspan><tspan x="4363.5" dy="17.667">같은 설정에서 다른 결과가 나왔다는 것 자체가 첫 사례의 결론을 흔든다</tspan></text></g><marker id="mk-d2-2304115536-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2304115536-2177206569)" d="M1627.092 98.6C1456.2 152.4 1413 230.5 1413 284.5" class="connection stroke-B2 s4" mask="url(#d2-2304115536)"/><marker id="mk-d2-2304115536-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2304115536-3488378134)" d="M1930.998 65.083C3876.6 145.8 4363.5 180 4363.5 232" class="connection stroke-B1 s1" mask="url(#d2-2304115536)"/><path fill="none" marker-end="url(#mk-d2-2304115536-3488378134)" d="M1755.98 118c-.38 38-.48 58-.48 73v306" class="connection stroke-B1 s1" mask="url(#d2-2304115536)"/><path fill="none" marker-end="url(#mk-d2-2304115536-2177206569)" d="M4363.5 396v93" class="connection stroke-B2 s4" mask="url(#d2-2304115536)"/><path fill="none" marker-end="url(#mk-d2-2304115536-3488378134)" d="M1755.5 686c0 60.4 203 89.2 1011.008 141.74" class="connection stroke-B1 s1" mask="url(#d2-2304115536)"/><path fill="none" marker-end="url(#mk-d2-2304115536-3488378134)" d="M4363.5 694c0 54-203 81.2-1011.008 133.74" class="connection stroke-B1 s1" mask="url(#d2-2304115536)"/><mask id="d2-2304115536" width="5975" height="1083" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h5975V982H-91z"/></mask></svg>