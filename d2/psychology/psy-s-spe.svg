<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="1559" class="d2-1233963728 d2-svg" viewBox="-101 -101 1330 1559"><rect width="1330" height="1559" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1233963728 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1233963728 .fill-N1{fill:#0a0f25}.d2-1233963728 .fill-B4{fill:#e3e9fd}.d2-1233963728 .fill-B5{fill:#edf0fd}.d2-1233963728 .stroke-B1,.d2-1233963728 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><text x="133.5" y="16" class="fill-N1 s0"><tspan x="133.5" dy="0">대학생 지원자를 모아</tspan><tspan x="133.5" dy="16.625">한쪽에 간수 역할,</tspan><tspan x="133.5" dy="16.625">다른 쪽에 수감자 역할을 맡기고</tspan><tspan x="133.5" dy="16.625">지하실에 만든 모의 감옥에서</tspan><tspan x="133.5" dy="16.625">지내게 했다.</tspan><tspan x="133.5" dy="16.625">예정보다 일찍 중단되었다.</tspan><tspan x="133.5" dy="16.625">‘상황이 사람을 바꾼다’ 는</tspan><tspan x="133.5" dy="16.625">결론이 널리 퍼졌다</tspan></text><g ><g class="shape"><ellipse cx="877.5" cy="66.5" class="shape stroke-B1" rx="250.5" ry="66.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="877.5" y="72" class="text-bold fill-N1 s0">1971년에 무엇이 있었나</text></g><g ><g class="shape"><path d="M0 183h577v794H0z" class="stroke-B1 fill-B4 s1"/></g><text x="288.5" y="216" class="fill-N1 s2"><tspan x="288.5" dy="0">왜 연구로</tspan><tspan x="288.5" dy="32">성립하지 않는가</tspan></text></g><g ><g class="shape"><path d="M627 183h501v794H627z" class="stroke-B1 fill-B4 s1"/></g><text x="877.5" y="216" class="fill-N1 s2"><tspan x="877.5" dy="0">그런데 왜 그토록</tspan><tspan x="877.5" dy="32">널리 인용되었나</tspan></text></g><g ><g class="shape"><path d="M0 1027h577v330H0z" class="stroke-B1 fill-B4 s1"/></g><text x="288.5" y="1060" class="fill-N1 s2">견줄 것이 하나 있다</text></g><text x="769" y="1043" class="fill-N1 s0"><tspan x="769" dy="0"> </tspan><tspan x="769" dy="16.455"> </tspan><tspan x="769" dy="16.455"> </tspan><tspan x="769" dy="16.455">이 장이 이것을 다루는 이유 —</tspan><tspan x="769" dy="16.455">결과를 소개하기 위해서가 아니라</tspan><tspan x="769" dy="16.455">‘검사받지 않은 이야기가</tspan><tspan x="769" dy="16.455">어떻게 사실이 되는가’ 를</tspan><tspan x="769" dy="16.455">보이기 위해서다.</tspan><tspan x="769" dy="16.455">이 사례에서 배울 것은</tspan><tspan x="769" dy="16.455">감옥에 대한 것이 아니라</tspan><tspan x="769" dy="16.455">인용에 대한 것이다</tspan></text><g ><g class="shape"><path d="M30 257h235v210H30z" class="stroke-B1 fill-B5 s1"/></g><text x="147.5" y="311.5" class="text-bold fill-N1 s0"><tspan x="147.5" dy="0">비교 조건이 없다</tspan><tspan x="147.5" dy="16.625">조건이 하나뿐이므로</tspan><tspan x="147.5" dy="16.625">‘상황 때문’ 이라고</tspan><tspan x="147.5" dy="16.625">말할 자료 구조가</tspan><tspan x="147.5" dy="16.625">아니다.</tspan><tspan x="147.5" dy="16.625">무엇과 견주어</tspan><tspan x="147.5" dy="16.625">달라졌다고</tspan><tspan x="147.5" dy="16.625">하는지가 없다</tspan></text></g><g ><g class="shape"><path d="M295 257h252v210H295z" class="stroke-B1 fill-B5 s1"/></g><text x="421" y="295.5" class="text-bold fill-N1 s0"><tspan x="421" dy="0">모집 광고가</tspan><tspan x="421" dy="16.5">표본을 골랐다</tspan><tspan x="421" dy="16.5">‘감옥 생활 연구’ 라고</tspan><tspan x="421" dy="16.5">밝히고 모집했다.</tspan><tspan x="421" dy="16.5">뒷날 한 연구가</tspan><tspan x="421" dy="16.5">같은 문구와</tspan><tspan x="421" dy="16.5">중립적인 문구로</tspan><tspan x="421" dy="16.5">각각 모집해,</tspan><tspan x="421" dy="16.5">모이는 사람이</tspan><tspan x="421" dy="16.5">다르다는 것을 보였다</tspan></text></g><g ><g class="shape"><path d="M30 497h235v226H30z" class="stroke-B1 fill-B5 s1"/></g><text x="147.5" y="535.5" class="text-bold fill-N1 s0"><tspan x="147.5" dy="0">연구자가</tspan><tspan x="147.5" dy="16.455">참여자였다</tspan><tspan x="147.5" dy="16.455">연구를 이끈 사람이</tspan><tspan x="147.5" dy="16.455">교도소장 역할을</tspan><tspan x="147.5" dy="16.455">맡았다.</tspan><tspan x="147.5" dy="16.455">관찰자와 개입자가</tspan><tspan x="147.5" dy="16.455">같은 사람이면</tspan><tspan x="147.5" dy="16.455">실험자 기대가</tspan><tspan x="147.5" dy="16.455">결과와 구별되지</tspan><tspan x="147.5" dy="16.455">않는다</tspan><tspan x="147.5" dy="16.455">— 6장에서 본 문제다</tspan></text></g><g ><g class="shape"><path d="M295 497h252v226H295z" class="stroke-B1 fill-B5 s1"/></g><text x="421" y="535.5" class="text-bold fill-N1 s0"><tspan x="421" dy="0">간수에게</tspan><tspan x="421" dy="16.455">지시가 있었다</tspan><tspan x="421" dy="16.455">공개된 기록에서</tspan><tspan x="421" dy="16.455">연구진이</tspan><tspan x="421" dy="16.455">간수 역할에게</tspan><tspan x="421" dy="16.455">어떻게 행동하라고</tspan><tspan x="421" dy="16.455">이르는 것이</tspan><tspan x="421" dy="16.455">확인되었다.</tspan><tspan x="421" dy="16.455">그러면 ‘역할이 저절로</tspan><tspan x="421" dy="16.455">사람을 바꾸었다’ 는</tspan><tspan x="421" dy="16.455">서술이 성립하지 않는다</tspan></text></g><g ><g class="shape"><path d="M30 753h235v194H30z" class="stroke-B1 fill-B5 s1"/></g><text x="147.5" y="791.5" class="text-bold fill-N1 s0"><tspan x="147.5" dy="0">자료가 체계적으로</tspan><tspan x="147.5" dy="16.556">기록되지 않았다</tspan><tspan x="147.5" dy="16.556">무엇을 언제</tspan><tspan x="147.5" dy="16.556">어떤 규칙으로</tspan><tspan x="147.5" dy="16.556">셌는지가</tspan><tspan x="147.5" dy="16.556">남아 있지 않다.</tspan><tspan x="147.5" dy="16.556">지금의 기준으로는</tspan><tspan x="147.5" dy="16.556">자료라고 부를 수 있는</tspan><tspan x="147.5" dy="16.556">것이 없다</tspan></text></g><g ><g class="shape"><path d="M295 753h252v194H295z" class="stroke-B1 fill-B5 s1"/></g><text x="421" y="839.5" class="text-bold fill-N1 s0"><tspan x="421" dy="0">일부 참가자가</tspan><tspan x="421" dy="17.667">뒷날 연기였다고</tspan><tspan x="421" dy="17.667">말했다</tspan></text></g><g ><g class="shape"><path d="M657 257h214v178H657z" class="stroke-B1 fill-B5 s1"/></g><text x="764" y="295.5" class="text-bold fill-N1 s0"><tspan x="764" dy="0">이야기가</tspan><tspan x="764" dy="16.625">강하다.</tspan><tspan x="764" dy="16.625">줄거리가 있고</tspan><tspan x="764" dy="16.625">장면이 그려지고</tspan><tspan x="764" dy="16.625">결말이 있다.</tspan><tspan x="764" dy="16.625">표와 구간이 있는</tspan><tspan x="764" dy="16.625">연구는 이렇게</tspan><tspan x="764" dy="16.625">옮겨지지 않는다</tspan></text></g><g ><g class="shape"><path d="M901 257h197v178H901z" class="stroke-B1 fill-B5 s1"/></g><text x="999.5" y="311.5" class="text-bold fill-N1 s0"><tspan x="999.5" dy="0">결론이</tspan><tspan x="999.5" dy="16.833">쓸모 있어 보였다.</tspan><tspan x="999.5" dy="16.833">현실에서</tspan><tspan x="999.5" dy="16.833">벌어진 일을</tspan><tspan x="999.5" dy="16.833">설명하는 데</tspan><tspan x="999.5" dy="16.833">계속 불려 나왔다</tspan></text></g><g ><g class="shape"><path d="M657 465h214v178H657z" class="stroke-B1 fill-B5 s1"/></g><text x="764" y="503.5" class="text-bold fill-N1 s0"><tspan x="764" dy="0">검사할 수 있는</tspan><tspan x="764" dy="16.625">예측을</tspan><tspan x="764" dy="16.625">내놓지 않았다.</tspan><tspan x="764" dy="16.625">그래서</tspan><tspan x="764" dy="16.625">반증되지도 않았다.</tspan><tspan x="764" dy="16.625">무엇이 나와도</tspan><tspan x="764" dy="16.625">‘상황의 힘’ 으로</tspan><tspan x="764" dy="16.625">설명된다</tspan></text></g><g ><g class="shape"><path d="M901 465h197v178H901z" class="stroke-B1 fill-B5 s1"/></g><text x="999.5" y="519.5" class="text-bold fill-N1 s0"><tspan x="999.5" dy="0">교과서와</tspan><tspan x="999.5" dy="16.833">대중매체가</tspan><tspan x="999.5" dy="16.833">서로를 인용했다.</tspan><tspan x="999.5" dy="16.833">원 자료로</tspan><tspan x="999.5" dy="16.833">돌아간 사람이</tspan><tspan x="999.5" dy="16.833">오래 없었다</tspan></text></g><g ><g class="shape"><path d="M657 673h214v162H657z" class="stroke-B1 fill-B5 s1"/></g><text x="764" y="711.5" class="text-bold fill-N1 s0"><tspan x="764" dy="0">재현할 필요를</tspan><tspan x="764" dy="16.714">아무도</tspan><tspan x="764" dy="16.714">느끼지 않았다.</tspan><tspan x="764" dy="16.714">이미 아는</tspan><tspan x="764" dy="16.714">사실처럼</tspan><tspan x="764" dy="16.714">다루어졌기</tspan><tspan x="764" dy="16.714">때문이다</tspan></text></g><g ><g class="shape"><path d="M60 1087h319v210H60z" class="stroke-B1 fill-B5 s1"/></g><text x="219.5" y="1125.5" class="text-bold fill-N1 s0"><tspan x="219.5" dy="0">2000년대 초에 방송사와</tspan><tspan x="219.5" dy="16.5">함께 이루어진</tspan><tspan x="219.5" dy="16.5">다른 모의 감옥 연구가 있다.</tspan><tspan x="219.5" dy="16.5">절차와 자료가 공개되었고</tspan><tspan x="219.5" dy="16.5">결과가 달랐다</tspan><tspan x="219.5" dy="16.5">— 역할이 저절로</tspan><tspan x="219.5" dy="16.5">사람을 바꾸지 않았다.</tspan><tspan x="219.5" dy="16.5">같은 설정에서</tspan><tspan x="219.5" dy="16.5">다른 결과가 나왔다는 것 자체가</tspan><tspan x="219.5" dy="16.5">첫 사례의 결론을 흔든다</tspan></text></g><marker id="mk-d2-1233963728-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1233963728-2177206569)" d="M625 67h-44" class="connection stroke-B2 s4" mask="url(#d2-1233963728)"/><marker id="mk-d2-1233963728-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1233963728-3488378134)" d="M803.493 131.315 580.013 326.37" class="connection stroke-B1 s1" mask="url(#d2-1233963728)"/><path fill="none" marker-end="url(#mk-d2-1233963728-3488378134)" d="M878 135v44" class="connection stroke-B1 s1" mask="url(#d2-1233963728)"/><path fill="none" marker-end="url(#mk-d2-1233963728-2177206569)" d="M288.5 979v44" class="connection stroke-B2 s4" mask="url(#d2-1233963728)"/><path fill="none" marker-end="url(#mk-d2-1233963728-3488378134)" d="M877.5 979v44" class="connection stroke-B1 s1" mask="url(#d2-1233963728)"/><path fill="none" marker-end="url(#mk-d2-1233963728-3488378134)" d="M578.5 1192h45" class="connection stroke-B1 s1" mask="url(#d2-1233963728)"/><mask id="d2-1233963728" width="1330" height="1559" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1330v1559H-101z"/></mask></svg>