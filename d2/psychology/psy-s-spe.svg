<svg xmlns="http://www.w3.org/2000/svg" width="1609" height="2048" class="d2-1783403232 d2-svg" viewBox="-101 -101 1609 2048"><rect width="1609" height="2048" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1783403232 .fill-N1{fill:#0a0f25}.d2-1783403232 .fill-B5{fill:#edf0fd}.d2-1783403232 .fill-B6{fill:#f7f8fe}.d2-1783403232 .stroke-B1,.d2-1783403232 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:24px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><path fill="transparent" stroke="transparent" d="M0 0h1407v236H0z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M0 306h1407v1108H0z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M0 1484h1407v362H0z" class="shape s0"/><text x="256.5" y="76" class="fill-N1 s1"><tspan x="256.5" dy="0">대학생 지원자를 모아 한쪽에 간수 역할,</tspan><tspan x="256.5" dy="17">다른 쪽에 수감자 역할을 맡기고</tspan><tspan x="256.5" dy="17">지하실에 만든 모의 감옥에서 지내게 했다.</tspan><tspan x="256.5" dy="17">예정보다 일찍 중단되었다.</tspan><tspan x="256.5" dy="17">‘상황이 사람을 바꾼다’ 는 결론이 널리 퍼졌다</tspan></text><g ><g class="shape"><ellipse cx="687" cy="118" class="shape stroke-B1 fill-B5 s0" rx="174" ry="58"/></g><text x="687" y="123.5" class="text-bold fill-N1 s1">1971년에 무엇이 있었나</text></g><g ><g class="shape"><path d="M60 366h616v988H60z" class="stroke-B1 fill-B5 s0"/></g><text x="368" y="395" class="fill-N1 s2">왜 연구로 성립하지 않는가</text></g><g ><g class="shape"><path d="M736 366h611v988H736z" class="stroke-B1 fill-B5 s0"/></g><text x="1041.5" y="395" class="fill-N1 s2">그런데 왜 그토록 널리 인용되었나</text></g><g ><g class="shape"><path d="M60 1580h507v206H60z" class="stroke-B1 fill-B5 s0"/></g><text x="313.5" y="1568" class="fill-N1 s2">견줄 것이 하나 있다</text></g><text x="916.5" y="1560" class="fill-N1 s1"><tspan x="916.5" dy="0"> </tspan><tspan x="916.5" dy="17.25">이 장이 이것을 다루는 이유 — 결과를 소개하기 위해서가 아니라</tspan><tspan x="916.5" dy="17.25">‘검사받지 않은 이야기가 어떻게 사실이 되는가’ 를 보이기 위해서다.</tspan><tspan x="916.5" dy="17.25">이 사례에서 배울 것은 감옥에 대한 것이 아니라 인용에 대한 것이다</tspan></text><g ><g class="shape"><path d="M120 426h496v114H120z" class="stroke-B1 fill-B6 s0"/></g><text x="368" y="464.5" class="text-bold fill-N1 s1"><tspan x="368" dy="0">비교 조건이 없다</tspan><tspan x="368" dy="17.25">조건이 하나뿐이므로 ‘상황 때문’ 이라고</tspan><tspan x="368" dy="17.25">말할 자료 구조가 아니다.</tspan><tspan x="368" dy="17.25">무엇과 견주어 달라졌다고 하는지가 없다</tspan></text></g><g ><g class="shape"><path d="M120 580h496v130H120z" class="stroke-B1 fill-B6 s0"/></g><text x="368" y="618.5" class="text-bold fill-N1 s1"><tspan x="368" dy="0">모집 광고가 표본을 골랐다</tspan><tspan x="368" dy="17">‘감옥 생활 연구’ 라고 밝히고 모집했다.</tspan><tspan x="368" dy="17">뒷날 한 연구가 같은 문구와</tspan><tspan x="368" dy="17">중립적인 문구로 각각 모집해,</tspan><tspan x="368" dy="17">모이는 사람이 다르다는 것을 보였다</tspan></text></g><g ><g class="shape"><path d="M120 750h496v130H120z" class="stroke-B1 fill-B6 s0"/></g><text x="368" y="788.5" class="text-bold fill-N1 s1"><tspan x="368" dy="0">연구자가 참여자였다</tspan><tspan x="368" dy="17">연구를 이끈 사람이 교도소장 역할을 맡았다.</tspan><tspan x="368" dy="17">관찰자와 개입자가 같은 사람이면</tspan><tspan x="368" dy="17">실험자 기대가 결과와 구별되지 않는다</tspan><tspan x="368" dy="17">— 6장에서 본 문제다</tspan></text></g><g ><g class="shape"><path d="M120 920h496v130H120z" class="stroke-B1 fill-B6 s0"/></g><text x="368" y="958.5" class="text-bold fill-N1 s1"><tspan x="368" dy="0">간수에게 지시가 있었다</tspan><tspan x="368" dy="17">공개된 기록에서 연구진이 간수 역할에게</tspan><tspan x="368" dy="17">어떻게 행동하라고 이르는 것이 확인되었다.</tspan><tspan x="368" dy="17">그러면 ‘역할이 저절로 사람을 바꾸었다’ 는</tspan><tspan x="368" dy="17">서술이 성립하지 않는다</tspan></text></g><g ><g class="shape"><path d="M120 1090h496v98H120z" class="stroke-B1 fill-B6 s0"/></g><text x="368" y="1128.5" class="text-bold fill-N1 s1"><tspan x="368" dy="0">자료가 체계적으로 기록되지 않았다</tspan><tspan x="368" dy="17.667">무엇을 언제 어떤 규칙으로 셌는지가 남아 있지 않다.</tspan><tspan x="368" dy="17.667">지금의 기준으로는 자료라고 부를 수 있는 것이 없다</tspan></text></g><g ><g class="shape"><path d="M120 1228h496v66H120z" class="stroke-B1 fill-B6 s0"/></g><text x="368" y="1266.5" class="text-bold fill-N1 s1">일부 참가자가 뒷날 연기였다고 말했다</text></g><g ><g class="shape"><path d="M796 426h491v98H796z" class="stroke-B1 fill-B6 s0"/></g><text x="1041.5" y="464.5" class="text-bold fill-N1 s1"><tspan x="1041.5" dy="0">이야기가 강하다.</tspan><tspan x="1041.5" dy="17.667">줄거리가 있고 장면이 그려지고 결말이 있다.</tspan><tspan x="1041.5" dy="17.667">표와 구간이 있는 연구는 이렇게 옮겨지지 않는다</tspan></text></g><g ><g class="shape"><path d="M796 564h491v82H796z" class="stroke-B1 fill-B6 s0"/></g><text x="1041.5" y="602.5" class="text-bold fill-N1 s1"><tspan x="1041.5" dy="0">결론이 쓸모 있어 보였다.</tspan><tspan x="1041.5" dy="18.5">현실에서 벌어진 일을 설명하는 데 계속 불려 나왔다</tspan></text></g><g ><g class="shape"><path d="M796 686h491v98H796z" class="stroke-B1 fill-B6 s0"/></g><text x="1041.5" y="724.5" class="text-bold fill-N1 s1"><tspan x="1041.5" dy="0">검사할 수 있는 예측을 내놓지 않았다.</tspan><tspan x="1041.5" dy="17.667">그래서 반증되지도 않았다.</tspan><tspan x="1041.5" dy="17.667">무엇이 나와도 ‘상황의 힘’ 으로 설명된다</tspan></text></g><g ><g class="shape"><path d="M796 824h491v82H796z" class="stroke-B1 fill-B6 s0"/></g><text x="1041.5" y="862.5" class="text-bold fill-N1 s1"><tspan x="1041.5" dy="0">교과서와 대중매체가 서로를 인용했다.</tspan><tspan x="1041.5" dy="18.5">원 자료로 돌아간 사람이 오래 없었다</tspan></text></g><g ><g class="shape"><path d="M796 946h491v82H796z" class="stroke-B1 fill-B6 s0"/></g><text x="1041.5" y="984.5" class="text-bold fill-N1 s1"><tspan x="1041.5" dy="0">재현할 필요를 아무도 느끼지 않았다.</tspan><tspan x="1041.5" dy="18.5">이미 아는 사실처럼 다루어졌기 때문이다</tspan></text></g><g ><g class="shape"><path d="M90 1610h447v146H90z" class="stroke-B1 fill-B6 s0"/></g><text x="313.5" y="1648.5" class="text-bold fill-N1 s1"><tspan x="313.5" dy="0">2000년대 초에 방송사와 함께 이루어진</tspan><tspan x="313.5" dy="16.833">다른 모의 감옥 연구가 있다.</tspan><tspan x="313.5" dy="16.833">절차와 자료가 공개되었고 결과가 달랐다</tspan><tspan x="313.5" dy="16.833">— 역할이 저절로 사람을 바꾸지 않았다.</tspan><tspan x="313.5" dy="16.833">같은 설정에서 다른 결과가 나왔다는 것 자체가</tspan><tspan x="313.5" dy="16.833">첫 사례의 결론을 흔든다</tspan></text></g><marker id="mk-d2-1783403232-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1783403232-2177206569)" d="M511 118h-54" class="connection stroke-B2 s4" mask="url(#d2-1783403232)"/><marker id="mk-d2-1783403232-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1783403232-3488378134)" d="m661.211 176.838-79.633 185.486" class="connection stroke-B1 s0" mask="url(#d2-1783403232)"/><path fill="none" marker-end="url(#mk-d2-1783403232-3488378134)" d="m714.86 176.806 88.42 185.583" class="connection stroke-B1 s0" mask="url(#d2-1783403232)"/><path fill="none" marker-end="url(#mk-d2-1783403232-3488378134)" d="m568.499 1674.934 55.003-1.803" class="connection stroke-B1 s0" mask="url(#d2-1783403232)"/><path fill="none" marker-end="url(#mk-d2-1783403232-2177206569)" d="m335.363 1355.995-12.59 184.014" class="connection stroke-B2 s4" mask="url(#d2-1783403232)"/><path fill="none" marker-end="url(#mk-d2-1783403232-3488378134)" d="m964.198 1355.977-28.094 184.069" class="connection stroke-B1 s0" mask="url(#d2-1783403232)"/><mask id="d2-1783403232" width="1609" height="2048" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1609v2048H-101z"/></mask></svg>