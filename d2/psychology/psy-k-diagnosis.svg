<svg xmlns="http://www.w3.org/2000/svg" width="1314" height="1594" class="d2-1141400340 d2-svg" viewBox="-101 -101 1314 1594"><rect width="1314" height="1594" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1141400340 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1141400340 .fill-N1{fill:#0a0f25}.d2-1141400340 .fill-B4{fill:#e3e9fd}.d2-1141400340 .fill-B5{fill:#edf0fd}.d2-1141400340 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><text x="143" y="16" class="fill-N1 s0"><tspan x="143" dy="0">세계보건기구가 만드는</tspan><tspan x="143" dy="16.714">국제 질병 분류는</tspan><tspan x="143" dy="16.714">통계 · 행정 · 보험의 국제 기준이고,</tspan><tspan x="143" dy="16.714">미국정신의학회가 만드는 편람은</tspan><tspan x="143" dy="16.714">그 나라와 연구에서 널리 쓰인다.</tspan><tspan x="143" dy="16.714">둘은 서로를 참조하며 개정되고,</tspan><tspan x="143" dy="16.714">개정마다 경계가 바뀐다</tspan></text><g ><g class="shape"><ellipse cx="844" cy="66" class="shape stroke-B1" rx="268" ry="66" style="fill:#f7f8fe;stroke-width:2"/></g><text x="844" y="71.5" class="text-bold fill-N1 s0">국제 분류 체계와 진단 편람</text></g><g ><g class="shape"><path d="M0 202h506v498H0z" class="stroke-B1 fill-B4 s1"/></g><text x="253" y="235" class="fill-N1 s2">무엇인가</text></g><g ><g class="shape"><path d="M576 202h536v498H576z" class="stroke-B1 fill-B4 s1"/></g><text x="844" y="235" class="fill-N1 s2">무엇이 아닌가</text></g><text x="104" y="786" class="fill-N1 s0"><tspan x="104" dy="0"> </tspan><tspan x="104" dy="16.192"> </tspan><tspan x="104" dy="16.192"> </tspan><tspan x="104" dy="16.192"> </tspan><tspan x="104" dy="16.192"> </tspan><tspan x="104" dy="16.192"> </tspan><tspan x="104" dy="16.192"> </tspan><tspan x="104" dy="16.192"> </tspan><tspan x="104" dy="16.192"> </tspan><tspan x="104" dy="16.192"> </tspan><tspan x="104" dy="16.192">5장의 도구로</tspan><tspan x="104" dy="16.192">다시 보면 —</tspan><tspan x="104" dy="16.192">분류 체계에는</tspan><tspan x="104" dy="16.192">신뢰도 물음과</tspan><tspan x="104" dy="16.192">타당도 물음이</tspan><tspan x="104" dy="16.192">따로 있다.</tspan><tspan x="104" dy="16.192">두 임상가가</tspan><tspan x="104" dy="16.192">같은 사람을 보고</tspan><tspan x="104" dy="16.192">같은 이름을</tspan><tspan x="104" dy="16.192">붙이는가(신뢰도)와</tspan><tspan x="104" dy="16.192">그 이름이</tspan><tspan x="104" dy="16.192">뜻하는 대로</tspan><tspan x="104" dy="16.192">읽어도 되는가(타당도)는</tspan><tspan x="104" dy="16.192">다른 물음이고,</tspan><tspan x="104" dy="16.192">앞이 좋아도</tspan><tspan x="104" dy="16.192">뒤가 따라오지 않는다</tspan></text><g ><g class="shape"><path d="M576 770h536v622H576z" class="stroke-B1 fill-B4 s1"/></g><text x="844" y="803" class="fill-N1 s2"><tspan x="844" dy="0">범주인가 차원인가 —</tspan><tspan x="844" dy="32">이 문서는 어느 쪽도 고르지 않는다</tspan></text></g><g ><g class="shape"><path d="M40 248h191v146H40z" class="stroke-B1 fill-B5 s1"/></g><text x="135.5" y="286.5" class="text-bold fill-N1 s0"><tspan x="135.5" dy="0">합의로 만들어진</tspan><tspan x="135.5" dy="16.833">분류 규약이다.</tspan><tspan x="135.5" dy="16.833">같은 말을</tspan><tspan x="135.5" dy="16.833">쓰기 위한</tspan><tspan x="135.5" dy="16.833">약속이라는 것이</tspan><tspan x="135.5" dy="16.833">첫 번째 쓰임이다</tspan></text></g><g ><g class="shape"><path d="M271 248h195v146H271z" class="stroke-B1 fill-B5 s1"/></g><text x="368.5" y="302.5" class="text-bold fill-N1 s0"><tspan x="368.5" dy="0">임상가 사이의</tspan><tspan x="368.5" dy="17.25">소통 —</tspan><tspan x="368.5" dy="17.25">다른 곳의 기록을</tspan><tspan x="368.5" dy="17.25">읽을 수 있게 한다</tspan></text></g><g ><g class="shape"><path d="M40 434h191v130H40z" class="stroke-B1 fill-B5 s1"/></g><text x="135.5" y="472.5" class="text-bold fill-N1 s0"><tspan x="135.5" dy="0">연구 표본의</tspan><tspan x="135.5" dy="17">정의 —</tspan><tspan x="135.5" dy="17">어떤 사람들을</tspan><tspan x="135.5" dy="17">모았는지 남이</tspan><tspan x="135.5" dy="17">알 수 있게 한다</tspan></text></g><g ><g class="shape"><path d="M271 434h195v130H271z" class="stroke-B1 fill-B5 s1"/></g><text x="368.5" y="480.5" class="text-bold fill-N1 s0"><tspan x="368.5" dy="0">행정과 보험의</tspan><tspan x="368.5" dy="17.25">기준 —</tspan><tspan x="368.5" dy="17.25">자원이 어디로</tspan><tspan x="368.5" dy="17.25">가는지를 정한다</tspan></text></g><g ><g class="shape"><path d="M616 248h197v178H616z" class="stroke-B1 fill-B5 s1"/></g><text x="714.5" y="286.5" class="text-bold fill-N1 s0"><tspan x="714.5" dy="0">자연에서 발견한</tspan><tspan x="714.5" dy="16.625">종류의 목록이</tspan><tspan x="714.5" dy="16.625">아니다.</tspan><tspan x="714.5" dy="16.625">경계는 자료에서</tspan><tspan x="714.5" dy="16.625">튀어나온 것이</tspan><tspan x="714.5" dy="16.625">아니라</tspan><tspan x="714.5" dy="16.625">위원회에서</tspan><tspan x="714.5" dy="16.625">정해진 것이다</tspan></text></g><g ><g class="shape"><path d="M853 248h188v178H853z" class="stroke-B1 fill-B5 s1"/></g><text x="947" y="302.5" class="text-bold fill-N1 s0"><tspan x="947" dy="0">원인의 이론이</tspan><tspan x="947" dy="16.833">아니다.</tspan><tspan x="947" dy="16.833">대부분의 범주가</tspan><tspan x="947" dy="16.833">겉으로 관찰되는</tspan><tspan x="947" dy="16.833">것들의 묶음으로</tspan><tspan x="947" dy="16.833">정의된다</tspan></text></g><g ><g class="shape"><path d="M616 466h197v194H616z" class="stroke-B1 fill-B5 s1"/></g><text x="714.5" y="504.5" class="text-bold fill-N1 s0"><tspan x="714.5" dy="0">그 사람에 대한</tspan><tspan x="714.5" dy="16.556">설명이 아니다.</tspan><tspan x="714.5" dy="16.556">이름은</tspan><tspan x="714.5" dy="16.556">왜 그런지를</tspan><tspan x="714.5" dy="16.556">말해 주지 않는다.</tspan><tspan x="714.5" dy="16.556">이름으로</tspan><tspan x="714.5" dy="16.556">이유를 대면</tspan><tspan x="714.5" dy="16.556">같은 말을</tspan><tspan x="714.5" dy="16.556">되풀이한 것이다</tspan></text></g><g ><g class="shape"><path d="M853 466h188v194H853z" class="stroke-B1 fill-B5 s1"/></g><text x="947" y="512.5" class="text-bold fill-N1 s0"><tspan x="947" dy="0">스스로 써 보는</tspan><tspan x="947" dy="16.625">도구가 아니다.</tspan><tspan x="947" dy="16.625">판정에는 훈련과</tspan><tspan x="947" dy="16.625">면담과 맥락이</tspan><tspan x="947" dy="16.625">든다.</tspan><tspan x="947" dy="16.625">목록을 읽는</tspan><tspan x="947" dy="16.625">것으로</tspan><tspan x="947" dy="16.625">대신할 수 없다</tspan></text></g><g ><g class="shape"><path d="M617 844h198v242H617z" class="stroke-B1 fill-B5 s1"/></g><text x="716" y="890.5" class="text-bold fill-N1 s0"><tspan x="716" dy="0">범주 쪽의</tspan><tspan x="716" dy="16.455">가장 강한 형태 —</tspan><tspan x="716" dy="16.455">임상의 결정은</tspan><tspan x="716" dy="16.455">이산적이다.</tspan><tspan x="716" dy="16.455">하느냐 마느냐를</tspan><tspan x="716" dy="16.455">정해야 하고,</tspan><tspan x="716" dy="16.455">행정과 소통에도</tspan><tspan x="716" dy="16.455">이름이 필요하다.</tspan><tspan x="716" dy="16.455">그리고 이름이</tspan><tspan x="716" dy="16.455">없으면 연구도</tspan><tspan x="716" dy="16.455">모을 수 없다</tspan></text></g><g ><g class="shape"><path d="M855 844h215v242H855z" class="stroke-B1 fill-B5 s1"/></g><text x="962.5" y="882.5" class="text-bold fill-N1 s0"><tspan x="962.5" dy="0">차원 쪽의</tspan><tspan x="962.5" dy="16.417">가장 강한 형태 —</tspan><tspan x="962.5" dy="16.417">관찰된 점수의</tspan><tspan x="962.5" dy="16.417">분포에</tspan><tspan x="962.5" dy="16.417">골짜기가 없고,</tspan><tspan x="962.5" dy="16.417">한 이름 아래</tspan><tspan x="962.5" dy="16.417">서로 아주 다른</tspan><tspan x="962.5" dy="16.417">사람들이 들어오며,</tspan><tspan x="962.5" dy="16.417">두 이름을</tspan><tspan x="962.5" dy="16.417">함께 받는 일이</tspan><tspan x="962.5" dy="16.417">예외가 아니라</tspan><tspan x="962.5" dy="16.417">규칙에 가깝다</tspan></text></g><g ><g class="shape"><path d="M617 1126h198v226H617z" class="stroke-B1 fill-B5 s1"/></g><text x="716" y="1164.5" class="text-bold fill-N1 s0"><tspan x="716" dy="0">대안 체계가</tspan><tspan x="716" dy="16.455">제안되어 있다.</tspan><tspan x="716" dy="16.455">연구용으로</tspan><tspan x="716" dy="16.455">차원과 기제를</tspan><tspan x="716" dy="16.455">축으로 삼자는 틀,</tspan><tspan x="716" dy="16.455">그리고 위계적</tspan><tspan x="716" dy="16.455">차원 구조를</tspan><tspan x="716" dy="16.455">쓰자는 틀이 있다.</tspan><tspan x="716" dy="16.455">어느 것도 아직</tspan><tspan x="716" dy="16.455">임상 표준을</tspan><tspan x="716" dy="16.455">대신하지 않았다</tspan></text></g><marker id="mk-d2-1141400340-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1141400340-2177206569)" d="M574 66h-64" class="connection" mask="url(#d2-1141400340)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><marker id="mk-d2-1141400340-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1141400340-3488378134)" d="M748.324 129.092 509.351 284.816" class="connection stroke-B1 s1" mask="url(#d2-1141400340)"/><path fill="none" marker-end="url(#mk-d2-1141400340-3488378134)" d="M844 134v64" class="connection stroke-B1 s1" mask="url(#d2-1141400340)"/><path fill="none" marker-end="url(#mk-d2-1141400340-3488378134)" d="M844 702v64" class="connection stroke-B1 s1" mask="url(#d2-1141400340)"/><path fill="none" marker-end="url(#mk-d2-1141400340-3488378134)" d="M574 1081h-64" class="connection stroke-B1 s1" mask="url(#d2-1141400340)"/><mask id="d2-1141400340" width="1314" height="1594" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1314v1594H-101z"/></mask></svg>