<svg xmlns="http://www.w3.org/2000/svg" width="3529" height="1549" class="d2-3067445125 d2-svg" viewBox="-101 -101 3529 1549"><rect width="3529" height="1549" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3067445125 .fill-N1{fill:#0a0f25}.d2-3067445125 .fill-B4{fill:#e3e9fd}.d2-3067445125 .fill-B5{fill:#edf0fd}.d2-3067445125 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="197.5" cy="480" class="shape stroke-B1" rx="197.5" ry="66" style="fill:#f7f8fe;stroke-width:2"/></g><text x="197.5" y="485.5" class="text-bold fill-N1 s0">국제 분류 체계와 진단 편람</text></g><text x="943" y="16" class="fill-N1 s0"><tspan x="943" dy="0">세계보건기구가 만드는 국제 질병 분류는 통계 · 행정 · 보험의 국제 기준이고,</tspan><tspan x="943" dy="17.667">미국정신의학회가 만드는 편람은 그 나라와 연구에서 널리 쓰인다.</tspan><tspan x="943" dy="17.667">둘은 서로를 참조하며 개정되고, 개정마다 경계가 바뀐다</tspan></text><g ><g class="shape"><path d="M615 149h656v520H615z" class="stroke-B1 fill-B4 s1"/></g><text x="943" y="136" class="fill-N1 s2">무엇인가</text></g><g ><g class="shape"><path d="M515 755h855v568H515z" class="stroke-B1 fill-B4 s1"/></g><text x="942.5" y="742" class="fill-N1 s2">무엇이 아닌가</text></g><g ><g class="shape"><path d="M1510 873h880v474h-880z" class="stroke-B1 fill-B4 s1"/></g><text x="1950" y="860" class="fill-N1 s2">범주인가 차원인가 — 이 문서는 어느 쪽도 고르지 않는다</text></g><text x="2918.5" y="1092" class="fill-N1 s0"><tspan x="2918.5" dy="0"> </tspan><tspan x="2918.5" dy="17.25">5장의 도구로 다시 보면 — 분류 체계에는 신뢰도 물음과 타당도 물음이 따로 있다.</tspan><tspan x="2918.5" dy="17.25">두 임상가가 같은 사람을 보고 같은 이름을 붙이는가(신뢰도)와</tspan><tspan x="2918.5" dy="17.25">그 이름이 뜻하는 대로 읽어도 되는가(타당도)는 다른 물음이고, 앞이 좋아도 뒤가 따라오지 않는다</tspan></text><g ><g class="shape"><path d="M686 179h514v82H686z" class="stroke-B1 fill-B5 s1"/></g><text x="943" y="217.5" class="text-bold fill-N1 s0"><tspan x="943" dy="0">합의로 만들어진 분류 규약이다.</tspan><tspan x="943" dy="18.5">같은 말을 쓰기 위한 약속이라는 것이 첫 번째 쓰임이다</tspan></text></g><g ><g class="shape"><path d="M677 321h532v66H677z" class="stroke-B1 fill-B5 s1"/></g><text x="943" y="359.5" class="text-bold fill-N1 s0">임상가 사이의 소통 — 다른 곳의 기록을 읽을 수 있게 한다</text></g><g ><g class="shape"><path d="M645 447h596v66H645z" class="stroke-B1 fill-B5 s1"/></g><text x="943" y="485.5" class="text-bold fill-N1 s0">연구 표본의 정의 — 어떤 사람들을 모았는지 남이 알 수 있게 한다</text></g><g ><g class="shape"><path d="M692 573h502v66H692z" class="stroke-B1 fill-B5 s1"/></g><text x="943" y="611.5" class="text-bold fill-N1 s0">행정과 보험의 기준 — 자원이 어디로 가는지를 정한다</text></g><g ><g class="shape"><path d="M637 785h612v82H637z" class="stroke-B1 fill-B5 s1"/></g><text x="943" y="823.5" class="text-bold fill-N1 s0"><tspan x="943" dy="0">자연에서 발견한 종류의 목록이 아니다.</tspan><tspan x="943" dy="18.5">경계는 자료에서 튀어나온 것이 아니라 위원회에서 정해진 것이다</tspan></text></g><g ><g class="shape"><path d="M658 927h569v82H658z" class="stroke-B1 fill-B5 s1"/></g><text x="942.5" y="965.5" class="text-bold fill-N1 s0"><tspan x="942.5" dy="0">원인의 이론이 아니다.</tspan><tspan x="942.5" dy="18.5">대부분의 범주가 겉으로 관찰되는 것들의 묶음으로 정의된다</tspan></text></g><g ><g class="shape"><path d="M545 1069h795v82H545z" class="stroke-B1 fill-B5 s1"/></g><text x="942.5" y="1107.5" class="text-bold fill-N1 s0"><tspan x="942.5" dy="0">그 사람에 대한 설명이 아니다.</tspan><tspan x="942.5" dy="18.5">이름은 왜 그런지를 말해 주지 않는다. 이름으로 이유를 대면 같은 말을 되풀이한 것이다</tspan></text></g><g ><g class="shape"><path d="M609 1211h667v82H609z" class="stroke-B1 fill-B5 s1"/></g><text x="942.5" y="1249.5" class="text-bold fill-N1 s0"><tspan x="942.5" dy="0">스스로 써 보는 도구가 아니다.</tspan><tspan x="942.5" dy="18.5">판정에는 훈련과 면담과 맥락이 든다. 목록을 읽는 것으로 대신할 수 없다</tspan></text></g><g ><g class="shape"><path d="M1596 903h708v98h-708z" class="stroke-B1 fill-B5 s1"/></g><text x="1950" y="941.5" class="text-bold fill-N1 s0"><tspan x="1950" dy="0">범주 쪽의 가장 강한 형태 —</tspan><tspan x="1950" dy="17.667">임상의 결정은 이산적이다. 하느냐 마느냐를 정해야 하고,</tspan><tspan x="1950" dy="17.667">행정과 소통에도 이름이 필요하다. 그리고 이름이 없으면 연구도 모을 수 없다</tspan></text></g><g ><g class="shape"><path d="M1560 1061h781v98h-781z" class="stroke-B1 fill-B5 s1"/></g><text x="1950.5" y="1099.5" class="text-bold fill-N1 s0"><tspan x="1950.5" dy="0">차원 쪽의 가장 강한 형태 —</tspan><tspan x="1950.5" dy="17.667">관찰된 점수의 분포에 골짜기가 없고, 한 이름 아래 서로 아주 다른 사람들이 들어오며,</tspan><tspan x="1950.5" dy="17.667">두 이름을 함께 받는 일이 예외가 아니라 규칙에 가깝다</tspan></text></g><g ><g class="shape"><path d="M1540 1219h820v98h-820z" class="stroke-B1 fill-B5 s1"/></g><text x="1950" y="1257.5" class="text-bold fill-N1 s0"><tspan x="1950" dy="0">대안 체계가 제안되어 있다.</tspan><tspan x="1950" dy="17.667">연구용으로 차원과 기제를 축으로 삼자는 틀, 그리고 위계적 차원 구조를 쓰자는 틀이 있다.</tspan><tspan x="1950" dy="17.667">어느 것도 아직 임상 표준을 대신하지 않았다</tspan></text></g><marker id="mk-d2-3067445125-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3067445125-2177206569)" d="M238.94 413.235C403.6 104.199 520.9 26.5 620.5 26.5" class="connection" mask="url(#d2-3067445125)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><marker id="mk-d2-3067445125-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3067445125-3488378134)" d="M397 480h214" class="connection stroke-B1 s1" mask="url(#d2-3067445125)"/><path fill="none" marker-end="url(#mk-d2-3067445125-3488378134)" d="M225.726 546.864C401 997 459 1110 511 1110" class="connection stroke-B1 s1" mask="url(#d2-3067445125)"/><path fill="none" marker-end="url(#mk-d2-3067445125-3488378134)" d="M1372 1110h134" class="connection stroke-B1 s1" mask="url(#d2-3067445125)"/><path fill="none" marker-end="url(#mk-d2-3067445125-3488378134)" d="M2392 1110h114" class="connection stroke-B1 s1" mask="url(#d2-3067445125)"/><mask id="d2-3067445125" width="3529" height="1549" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3529v1549H-101z"/></mask></svg>