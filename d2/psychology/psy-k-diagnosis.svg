<svg xmlns="http://www.w3.org/2000/svg" width="1633" height="2020" class="d2-3418861016 d2-svg" viewBox="-101 -101 1633 2020"><rect width="1633" height="2020" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3418861016 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3418861016 .fill-N1{fill:#0a0f25}.d2-3418861016 .fill-B5{fill:#edf0fd}.d2-3418861016 .fill-B6{fill:#f7f8fe}.d2-3418861016 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:24px}.s3{fill:#0d32b2}</style><path fill="transparent" stroke="transparent" d="M0 0h1431v272H0z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M0 342h1431v772H0z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M0 1184h1431v634H0z" class="shape s0"/><text x="307" y="86" class="fill-N1 s1"><tspan x="307" dy="0">세계보건기구가 만드는 국제 질병 분류는</tspan><tspan x="307" dy="17">통계 · 행정 · 보험의 국제 기준이고,</tspan><tspan x="307" dy="17">미국정신의학회가 만드는 편람은</tspan><tspan x="307" dy="17">그 나라와 연구에서 널리 쓰인다.</tspan><tspan x="307" dy="17">둘은 서로를 참조하며 개정되고, 개정마다 경계가 바뀐다</tspan></text><g ><g class="shape"><ellipse cx="811.5" cy="136" class="shape stroke-B1 fill-B5 s0" rx="197.5" ry="66"/></g><text x="811.5" y="141.5" class="text-bold fill-N1 s1">국제 분류 체계와 진단 편람</text></g><g ><g class="shape"><path d="M70 412h634v632H70z" class="stroke-B1 fill-B5 s0"/></g><text x="387" y="441" class="fill-N1 s2">무엇인가</text></g><g ><g class="shape"><path d="M774 412h587v632H774z" class="stroke-B1 fill-B5 s0"/></g><text x="1067.5" y="441" class="fill-N1 s2">무엇이 아닌가</text></g><text x="1123" y="1467" class="fill-N1 s1"><tspan x="1123" dy="0"> </tspan><tspan x="1123" dy="16.833">5장의 도구로 다시 보면 — 분류 체계에는</tspan><tspan x="1123" dy="16.833">신뢰도 물음과 타당도 물음이 따로 있다.</tspan><tspan x="1123" dy="16.833">두 임상가가 같은 사람을 보고 같은 이름을 붙이는가(신뢰도)와</tspan><tspan x="1123" dy="16.833">그 이름이 뜻하는 대로 읽어도 되는가(타당도)는</tspan><tspan x="1123" dy="16.833">다른 물음이고, 앞이 좋아도 뒤가 따라오지 않는다</tspan></text><g ><g class="shape"><path d="M30 1214h732v574H30z" class="stroke-B1 fill-B5 s0"/></g><text x="396" y="1243" class="fill-N1 s2">범주인가 차원인가 — 이 문서는 어느 쪽도 고르지 않는다</text></g><g ><g class="shape"><path d="M130 472h514v82H130z" class="stroke-B1 fill-B6 s0"/></g><text x="387" y="510.5" class="text-bold fill-N1 s1"><tspan x="387" dy="0">합의로 만들어진 분류 규약이다.</tspan><tspan x="387" dy="18.5">같은 말을 쓰기 위한 약속이라는 것이 첫 번째 쓰임이다</tspan></text></g><g ><g class="shape"><path d="M130 594h514v82H130z" class="stroke-B1 fill-B6 s0"/></g><text x="387" y="632.5" class="text-bold fill-N1 s1"><tspan x="387" dy="0">임상가 사이의 소통 —</tspan><tspan x="387" dy="18.5">다른 곳의 기록을 읽을 수 있게 한다</tspan></text></g><g ><g class="shape"><path d="M130 716h514v82H130z" class="stroke-B1 fill-B6 s0"/></g><text x="387" y="754.5" class="text-bold fill-N1 s1"><tspan x="387" dy="0">연구 표본의 정의 — 어떤 사람들을</tspan><tspan x="387" dy="18.5">모았는지 남이 알 수 있게 한다</tspan></text></g><g ><g class="shape"><path d="M130 838h514v66H130z" class="stroke-B1 fill-B6 s0"/></g><text x="387" y="876.5" class="text-bold fill-N1 s1">행정과 보험의 기준 — 자원이 어디로 가는지를 정한다</text></g><g ><g class="shape"><path d="M834 472h467v98H834z" class="stroke-B1 fill-B6 s0"/></g><text x="1067.5" y="510.5" class="text-bold fill-N1 s1"><tspan x="1067.5" dy="0">자연에서 발견한 종류의 목록이 아니다.</tspan><tspan x="1067.5" dy="17.667">경계는 자료에서 튀어나온 것이 아니라</tspan><tspan x="1067.5" dy="17.667">위원회에서 정해진 것이다</tspan></text></g><g ><g class="shape"><path d="M834 610h467v98H834z" class="stroke-B1 fill-B6 s0"/></g><text x="1067.5" y="648.5" class="text-bold fill-N1 s1"><tspan x="1067.5" dy="0">원인의 이론이 아니다.</tspan><tspan x="1067.5" dy="17.667">대부분의 범주가</tspan><tspan x="1067.5" dy="17.667">겉으로 관찰되는 것들의 묶음으로 정의된다</tspan></text></g><g ><g class="shape"><path d="M834 748h467v98H834z" class="stroke-B1 fill-B6 s0"/></g><text x="1067.5" y="786.5" class="text-bold fill-N1 s1"><tspan x="1067.5" dy="0">그 사람에 대한 설명이 아니다.</tspan><tspan x="1067.5" dy="17.667">이름은 왜 그런지를 말해 주지 않는다.</tspan><tspan x="1067.5" dy="17.667">이름으로 이유를 대면 같은 말을 되풀이한 것이다</tspan></text></g><g ><g class="shape"><path d="M834 886h467v98H834z" class="stroke-B1 fill-B6 s0"/></g><text x="1067.5" y="924.5" class="text-bold fill-N1 s1"><tspan x="1067.5" dy="0">스스로 써 보는 도구가 아니다.</tspan><tspan x="1067.5" dy="17.667">판정에는 훈련과 면담과 맥락이 든다.</tspan><tspan x="1067.5" dy="17.667">목록을 읽는 것으로 대신할 수 없다</tspan></text></g><g ><g class="shape"><path d="M168 1274h456v130H168z" class="stroke-B1 fill-B6 s0"/></g><text x="396" y="1312.5" class="text-bold fill-N1 s1"><tspan x="396" dy="0">범주 쪽의 가장 강한 형태 —</tspan><tspan x="396" dy="17">임상의 결정은 이산적이다.</tspan><tspan x="396" dy="17">하느냐 마느냐를 정해야 하고,</tspan><tspan x="396" dy="17">행정과 소통에도 이름이 필요하다. 그리고</tspan><tspan x="396" dy="17">이름이 없으면 연구도 모을 수 없다</tspan></text></g><g ><g class="shape"><path d="M168 1444h456v130H168z" class="stroke-B1 fill-B6 s0"/></g><text x="396" y="1482.5" class="text-bold fill-N1 s1"><tspan x="396" dy="0">차원 쪽의 가장 강한 형태 —</tspan><tspan x="396" dy="17">관찰된 점수의 분포에 골짜기가 없고,</tspan><tspan x="396" dy="17">한 이름 아래 서로 아주 다른 사람들이 들어오며,</tspan><tspan x="396" dy="17">두 이름을 함께 받는 일이 예외가 아니라</tspan><tspan x="396" dy="17">규칙에 가깝다</tspan></text></g><g ><g class="shape"><path d="M168 1614h456v114H168z" class="stroke-B1 fill-B6 s0"/></g><text x="396" y="1652.5" class="text-bold fill-N1 s1"><tspan x="396" dy="0">대안 체계가 제안되어 있다.</tspan><tspan x="396" dy="17.25">연구용으로 차원과 기제를 축으로 삼자는 틀,</tspan><tspan x="396" dy="17.25">그리고 위계적 차원 구조를 쓰자는 틀이 있다.</tspan><tspan x="396" dy="17.25">어느 것도 아직 임상 표준을 대신하지 않았다</tspan></text></g><marker id="mk-d2-3418861016-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3418861016-2177206569)" d="M612 136h-64" class="connection" mask="url(#d2-3418861016)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><marker id="mk-d2-3418861016-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3418861016-3488378134)" d="M764 1501h94" class="connection stroke-B1 s0" mask="url(#d2-3418861016)"/><path fill="none" marker-end="url(#mk-d2-3418861016-3488378134)" d="M763.835 201.625 615.33 408.75" class="connection stroke-B1 s0" mask="url(#d2-3418861016)"/><path fill="none" marker-end="url(#mk-d2-3418861016-3488378134)" d="m840.792 202.836 88.624 205.491" class="connection stroke-B1 s0" mask="url(#d2-3418861016)"/><path fill="none" marker-end="url(#mk-d2-3418861016-3488378134)" d="m791.687 1045.508-144.06 165.475" class="connection stroke-B1 s0" mask="url(#d2-3418861016)"/><mask id="d2-3418861016" width="1633" height="2020" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1633v2020H-101z"/></mask></svg>