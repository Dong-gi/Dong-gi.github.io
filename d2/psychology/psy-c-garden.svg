<svg xmlns="http://www.w3.org/2000/svg" width="1221" height="1526" class="d2-1397185831 d2-svg" viewBox="-101 -101 1221 1526"><rect width="1221" height="1526" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1397185831 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1397185831 .fill-N1{fill:#0a0f25}.d2-1397185831 .fill-N4{fill:#cfd2dd}.d2-1397185831 .fill-B5{fill:#edf0fd}.d2-1397185831 .fill-B6{fill:#f7f8fe}.d2-1397185831 .stroke-B1,.d2-1397185831 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><path fill="transparent" stroke="transparent" d="M0 0h546v1324H0z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M596 0h423v1324H596z" class="shape s0"/><g ><g class="shape"><ellipse cx="273" cy="66" class="shape stroke-B1 fill-B5 s0" rx="213" ry="50"/></g><text x="273" y="71.5" class="text-bold fill-N1 s1">자료를 손에 넣었다</text></g><g ><g class="shape"><path d="M273 352c-2 0-3 0-4-1L62 244c-2-1-2-3 0-4l207-107c2-1 6-1 8 0l207 107c2 1 2 3 0 4L277 351c-1 1-2 1-4 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="273" y="215.5" class="text-bold fill-N1 s1"><tspan x="273" dy="0">1. 누구를 뺄까</tspan><tspan x="273" dy="17">반응이 너무 빠른 사람?</tspan><tspan x="273" dy="17">너무 느린 사람?</tspan><tspan x="273" dy="17">지시를 못 따른 사람?</tspan><tspan x="273" dy="17">아무도 안 뺀다?</tspan></text></g><g ><g class="shape"><path d="M273 588c-2 0-3 0-4-1L62 480c-2-1-2-3 0-4l207-107c2-1 6-1 8 0l207 107c2 1 2 3 0 4L277 587c-1 1-2 1-4 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="273" y="451.5" class="text-bold fill-N1 s1"><tspan x="273" dy="0">2. 종속변수를</tspan><tspan x="273" dy="17">무엇으로 할까</tspan><tspan x="273" dy="17">정확률? 반응 시간?</tspan><tspan x="273" dy="17">둘을 합친 값?</tspan><tspan x="273" dy="17">로그를 씌운 반응 시간?</tspan></text></g><g ><g class="shape"><path d="M273 760c-2 0-3 0-4-1L62 684q-3-1.5 0-3l207-76c2-1 6-1 8 0l207 76q3 1.5 0 3l-207 75c-1 1-2 1-4 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="273" y="671.5" class="text-bold fill-N1 s1"><tspan x="273" dy="0">3. 무엇을 통제할까</tspan><tspan x="273" dy="17.667">나이? 성별? 사전 점수?</tspan><tspan x="273" dy="17.667">아무것도 넣지 않는다?</tspan></text></g><g ><g class="shape"><path d="M273 964c-2 0-3 0-4-1L62 872q-3-1.5 0-3l207-92c2-1 6-1 8 0l207 92q3 1.5 0 3l-207 91c-1 1-2 1-4 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="273" y="851.5" class="text-bold fill-N1 s1"><tspan x="273" dy="0">4. 언제 멈출까</tspan><tspan x="273" dy="17.25">미리 정한 수에서?</tspan><tspan x="273" dy="17.25">유의해질 때까지?</tspan><tspan x="273" dy="17.25">조금 더 모아 볼까?</tspan></text></g><g ><g class="shape"><path d="M273 1200c-2 0-3 0-4-1L62 1092c-2-1-2-3 0-4l207-107c2-1 6-1 8 0l207 107c2 1 2 3 0 4l-207 107c-1 1-2 1-4 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="273" y="1063.5" class="text-bold fill-N1 s1"><tspan x="273" dy="0">5. 누구에게서</tspan><tspan x="273" dy="17">효과가 나올까</tspan><tspan x="273" dy="17">전체? 여자만?</tspan><tspan x="273" dy="17">어린 참가자만?</tspan><tspan x="273" dy="17">첫 시행만?</tspan></text></g><g ><g class="shape"><path d="M60 1216h426v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="273" y="1254.5" class="text-bold fill-N1 s1"><tspan x="273" dy="0">유의한 결과 하나</tspan><tspan x="273" dy="18.5">논문에는 이 길만 적힌다</tspan></text></g><path fill="transparent" stroke="transparent" d="M656 40h303v400H656z" class="shape s0"/><text x="770" y="496" class="fill-N1 s1"><tspan x="770" dy="0">그래서 사전등록은</tspan><tspan x="770" dy="16.556">‘정직 서약’ 이 아니라</tspan><tspan x="770" dy="16.556">지도를 미리 그려</tspan><tspan x="770" dy="16.556">봉해 두는 일이다.</tspan><tspan x="770" dy="16.556">다섯 갈림에서 어디로 갈지</tspan><tspan x="770" dy="16.556">자료를 보기 전에 적어 두면</tspan><tspan x="770" dy="16.556">길이 하나가 되고,</tspan><tspan x="770" dy="16.556">그때 비로소 5% 라는 값이</tspan><tspan x="770" dy="16.556">뜻을 갖는다</tspan></text><g ><g class="shape"><path d="M656 669h303v615H656z" class="stroke-B1 fill-B5 s0"/></g><text x="807.5" y="698" class="fill-N1" style="text-anchor:middle;font-size:24px">셈해 보면</text></g><g ><g class="shape"><path d="M680 710h255v114H680z" class="stroke-B1 fill-B6 s0"/></g><text x="807.5" y="748.5" class="text-bold fill-N1 s1"><tspan x="807.5" dy="0">갈림마다 선택지가</tspan><tspan x="807.5" dy="17.25">셋이라면 길은</tspan><tspan x="807.5" dy="17.25">3 × 3 × 3 × 3 × 3</tspan><tspan x="807.5" dy="17.25">= 243 가지다</tspan></text></g><g ><g class="shape"><path d="M680 848h255v146H680z" class="stroke-B1 fill-B6 s0"/></g><text x="807.5" y="886.5" class="text-bold fill-N1 s1"><tspan x="807.5" dy="0">243 갈래를</tspan><tspan x="807.5" dy="16.833">다 걸어 보고</tspan><tspan x="807.5" dy="16.833">유의한 것 하나를 고르면</tspan><tspan x="807.5" dy="16.833">‘20번에 한 번</tspan><tspan x="807.5" dy="16.833">우연히 유의하다’ 는</tspan><tspan x="807.5" dy="16.833">보장은 남아 있지 않다</tspan></text></g><g ><g class="shape"><path d="M680 1018h255v242H680z" class="stroke-B1 fill-B6 s0"/></g><text x="807.5" y="1056.5" class="text-bold fill-N1 s1"><tspan x="807.5" dy="0">여기서 무서운 것은</tspan><tspan x="807.5" dy="16.417">다 걸어 보지 않아도</tspan><tspan x="807.5" dy="16.417">같은 일이 벌어진다는</tspan><tspan x="807.5" dy="16.417">점이다.</tspan><tspan x="807.5" dy="16.417">자료를 보면서</tspan><tspan x="807.5" dy="16.417">그럴듯한 쪽으로</tspan><tspan x="807.5" dy="16.417">한 번씩 정해 나가면</tspan><tspan x="807.5" dy="16.417">연구자 자신은</tspan><tspan x="807.5" dy="16.417">한 길만 걸었다고</tspan><tspan x="807.5" dy="16.417">느끼지만</tspan><tspan x="807.5" dy="16.417">결과는 자료에 맞춰</tspan><tspan x="807.5" dy="16.417">골라진 것이다</tspan></text></g><marker id="mk-d2-1397185831-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1397185831-3488378134)" d="M273 118v10" class="connection stroke-B1 s0" mask="url(#d2-1397185831)"/><path fill="none" marker-end="url(#mk-d2-1397185831-3488378134)" d="M273 354v10" class="connection stroke-B1 s0" mask="url(#d2-1397185831)"/><path fill="none" marker-end="url(#mk-d2-1397185831-3488378134)" d="M273 590v10" class="connection stroke-B1 s0" mask="url(#d2-1397185831)"/><path fill="none" marker-end="url(#mk-d2-1397185831-3488378134)" d="M273 762v10" class="connection stroke-B1 s0" mask="url(#d2-1397185831)"/><path fill="none" marker-end="url(#mk-d2-1397185831-3488378134)" d="M273 966v10" class="connection stroke-B1 s0" mask="url(#d2-1397185831)"/><path fill="none" marker-end="url(#mk-d2-1397185831-3488378134)" d="M273 1202v10" class="connection stroke-B1 s0" mask="url(#d2-1397185831)"/><marker id="mk-d2-1397185831-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1397185831-2177206569)" d="M807.5 667.5v-35" class="connection stroke-B2 s3" mask="url(#d2-1397185831)"/><path fill="none" marker-end="url(#mk-d2-1397185831-2177206569)" d="m353.271 1215.57 299.687-157.212" class="connection stroke-B2 s3" mask="url(#d2-1397185831)"/><mask id="d2-1397185831" width="1221" height="1526" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1221v1526H-101z"/></mask></svg>