<svg xmlns="http://www.w3.org/2000/svg" width="2166" height="2215" class="d2-3337987894 d2-svg" viewBox="-91 -101 2166 2215"><rect width="2166" height="2215" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3337987894 .fill-N1{fill:#0a0f25}.d2-3337987894 .fill-N4{fill:#cfd2dd}.d2-3337987894 .fill-B5{fill:#edf0fd}.d2-3337987894 .fill-B6{fill:#f7f8fe}.d2-3337987894 .stroke-B1,.d2-3337987894 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="913" cy="50" class="shape stroke-B1 fill-B6 s0" rx="150" ry="50"/></g><text x="913" y="55.5" class="text-bold fill-N1 s1">자료를 손에 넣었다</text></g><g ><g class="shape"><path d="M913 356c-3 0-5 0-6-1l-343-75q-6-1.5 0-3l343-76c4-1 9-1 13 0l343 76q6 1.5 0 3l-344 75c-1 1-3 1-6 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="913" y="267.5" class="text-bold fill-N1 s1"><tspan x="913" dy="0">1. 누구를 뺄까</tspan><tspan x="913" dy="17.667">반응이 너무 빠른 사람? 너무 느린 사람?</tspan><tspan x="913" dy="17.667">지시를 못 따른 사람? 아무도 안 뺀다?</tspan></text></g><g ><g class="shape"><path d="M913 612c-2 0-4 0-5-1l-288-75c-3-1-3-2 0-3l288-76c3-1 8-1 11 0l287 76c3 1 3 2 0 3l-288 75c-1 1-3 1-5 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="913" y="523.5" class="text-bold fill-N1 s1"><tspan x="913" dy="0">2. 종속변수를 무엇으로 할까</tspan><tspan x="913" dy="17.667">정확률? 반응 시간? 둘을 합친 값?</tspan><tspan x="913" dy="17.667">로그를 씌운 반응 시간?</tspan></text></g><g ><g class="shape"><path d="M913 868c-2 0-3 0-4-1l-204-75q-3-1.5 0-3l204-76c2-1 5-1 8 0l205 76q3 1.5 0 3l-205 75c-1 1-2 1-4 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="913" y="779.5" class="text-bold fill-N1 s1"><tspan x="913" dy="0">3. 무엇을 통제할까</tspan><tspan x="913" dy="17.667">나이? 성별? 사전 점수?</tspan><tspan x="913" dy="17.667">아무것도 넣지 않는다?</tspan></text></g><g ><g class="shape"><path d="M913 1124c-3 0-4 0-6-1l-316-75c-3-1-3-2 0-3l316-76c3-1 8-1 12 0l317 76c3 1 3 2 0 3l-317 75c-2 1-3 1-6 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="913" y="1035.5" class="text-bold fill-N1 s1"><tspan x="913" dy="0">4. 언제 멈출까</tspan><tspan x="913" dy="17.667">미리 정한 수에서? 유의해질 때까지?</tspan><tspan x="913" dy="17.667">조금 더 모아 볼까?</tspan></text></g><g ><g class="shape"><path d="M913 1380c-2 0-3 0-5-1l-261-75c-3-1-3-2 0-3l261-76c3-1 7-1 10 0l261 76c3 1 3 2 0 3l-261 75c-2 1-3 1-5 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="913" y="1291.5" class="text-bold fill-N1 s1"><tspan x="913" dy="0">5. 누구에게서 효과가 나올까</tspan><tspan x="913" dy="17.667">전체? 여자만? 어린 참가자만?</tspan><tspan x="913" dy="17.667">첫 시행만?</tspan></text></g><g ><g class="shape"><path d="M786 1480h255v82H786z" class="stroke-B1 fill-B6 s0"/></g><text x="913.5" y="1518.5" class="text-bold fill-N1 s1"><tspan x="913.5" dy="0">유의한 결과 하나</tspan><tspan x="913.5" dy="18.5">논문에는 이 길만 적힌다</tspan></text></g><g ><g class="shape"><path d="M10 1682h1964v158H10z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="992" y="1669" class="fill-N1" style="text-anchor:middle;font-size:28px">셈해 보면</text></g><text x="913" y="1976" class="fill-N1 s1"><tspan x="913" dy="0">그래서 사전등록은 ‘정직 서약’ 이 아니라 지도를 미리 그려 봉해 두는 일이다.</tspan><tspan x="913" dy="17.667">다섯 갈림에서 어디로 갈지 자료를 보기 전에 적어 두면 길이 하나가 되고,</tspan><tspan x="913" dy="17.667">그때 비로소 5% 라는 값이 뜻을 갖는다</tspan></text><g ><g class="shape"><path d="M40 1728h545v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="312.5" y="1766.5" class="text-bold fill-N1 s1">갈림마다 선택지가 셋이라면 길은 3 × 3 × 3 × 3 × 3 = 243 가지다</text></g><g ><g class="shape"><path d="M645 1720h536v82H645z" class="stroke-B1 fill-B5 s0"/></g><text x="913" y="1758.5" class="text-bold fill-N1 s1"><tspan x="913" dy="0">243 갈래를 다 걸어 보고 유의한 것 하나를 고르면</tspan><tspan x="913" dy="18.5">‘20번에 한 번 우연히 유의하다’ 는 보장은 남아 있지 않다</tspan></text></g><g ><g class="shape"><path d="M1241 1712h703v98h-703z" class="stroke-B1 fill-B5 s0"/></g><text x="1592.5" y="1750.5" class="text-bold fill-N1 s1"><tspan x="1592.5" dy="0">여기서 무서운 것은 다 걸어 보지 않아도 같은 일이 벌어진다는 점이다.</tspan><tspan x="1592.5" dy="17.667">자료를 보면서 그럴듯한 쪽으로 한 번씩 정해 나가면</tspan><tspan x="1592.5" dy="17.667">연구자 자신은 한 길만 걸었다고 느끼지만 결과는 자료에 맞춰 골라진 것이다</tspan></text></g><marker id="mk-d2-3337987894-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3337987894-3488378134)" d="M913 102v94" class="connection stroke-B1 s0" mask="url(#d2-3337987894)"/><path fill="none" marker-end="url(#mk-d2-3337987894-3488378134)" d="M913 358v94" class="connection stroke-B1 s0" mask="url(#d2-3337987894)"/><path fill="none" marker-end="url(#mk-d2-3337987894-3488378134)" d="M913 614v94" class="connection stroke-B1 s0" mask="url(#d2-3337987894)"/><path fill="none" marker-end="url(#mk-d2-3337987894-3488378134)" d="M913 870v94" class="connection stroke-B1 s0" mask="url(#d2-3337987894)"/><path fill="none" marker-end="url(#mk-d2-3337987894-3488378134)" d="M913 1126v94" class="connection stroke-B1 s0" mask="url(#d2-3337987894)"/><path fill="none" marker-end="url(#mk-d2-3337987894-3488378134)" d="M913 1382v94" class="connection stroke-B1 s0" mask="url(#d2-3337987894)"/><marker id="mk-d2-3337987894-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3337987894-2177206569)" d="M913 1564v114" class="connection stroke-B2 s3" mask="url(#d2-3337987894)"/><path fill="none" marker-end="url(#mk-d2-3337987894-2177206569)" d="M913 1842v114" class="connection stroke-B2 s3" mask="url(#d2-3337987894)"/><mask id="d2-3337987894" width="2166" height="2215" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h2166v2215H-91z"/></mask></svg>