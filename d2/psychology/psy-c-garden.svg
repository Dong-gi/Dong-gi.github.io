<svg xmlns="http://www.w3.org/2000/svg" width="1433" height="1952" class="d2-944205058 d2-svg" viewBox="-101 -101 1433 1952"><rect width="1433" height="1952" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-944205058 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-944205058 .fill-N1{fill:#0a0f25}.d2-944205058 .fill-N4{fill:#cfd2dd}.d2-944205058 .fill-B5{fill:#edf0fd}.d2-944205058 .fill-B6{fill:#f7f8fe}.d2-944205058 .stroke-B1,.d2-944205058 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><path fill="transparent" stroke="transparent" d="M0 0h580v1750H0z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M660 0h571v1750H660z" class="shape s0"/><g ><g class="shape"><ellipse cx="290" cy="80" class="shape stroke-B1 fill-B5 s0" rx="150" ry="50"/></g><text x="290" y="85.5" class="text-bold fill-N1 s1">자료를 손에 넣었다</text></g><g ><g class="shape"><path d="M290 450c-2 0-3 0-4-1L79 342c-2-1-2-3 0-4l207-107c2-1 6-1 8 0l207 107c2 1 2 3 0 4L294 449c-1 1-2 1-4 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="290" y="313.5" class="text-bold fill-N1 s1"><tspan x="290" dy="0">1. 누구를 뺄까</tspan><tspan x="290" dy="17">반응이 너무 빠른 사람?</tspan><tspan x="290" dy="17">너무 느린 사람?</tspan><tspan x="290" dy="17">지시를 못 따른 사람?</tspan><tspan x="290" dy="17">아무도 안 뺀다?</tspan></text></g><g ><g class="shape"><path d="M290 738c-2 0-3 0-5-1L32 646c-3-1-3-2 0-3l253-92c3-1 7-1 9 0l253 92c3 1 3 2 0 3l-252 91c-2 1-3 1-5 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="290" y="625.5" class="text-bold fill-N1 s1"><tspan x="290" dy="0">2. 종속변수를 무엇으로 할까</tspan><tspan x="290" dy="17.25">정확률? 반응 시간?</tspan><tspan x="290" dy="17.25">둘을 합친 값?</tspan><tspan x="290" dy="17.25">로그를 씌운 반응 시간?</tspan></text></g><g ><g class="shape"><path d="M290 994c-2 0-3 0-4-1L82 918q-3-1.5 0-3l204-76c2-1 5-1 8 0l205 76q3 1.5 0 3l-205 75c-1 1-2 1-4 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="290" y="905.5" class="text-bold fill-N1 s1"><tspan x="290" dy="0">3. 무엇을 통제할까</tspan><tspan x="290" dy="17.667">나이? 성별? 사전 점수?</tspan><tspan x="290" dy="17.667">아무것도 넣지 않는다?</tspan></text></g><g ><g class="shape"><path d="M290 1282c-1 0-2 0-3-1l-169-91q-3-1.5 0-3l169-92q3-1.5 6 0l169 92q3 1.5 0 3l-169 91c-1 1-2 1-3 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="290" y="1169.5" class="text-bold fill-N1 s1"><tspan x="290" dy="0">4. 언제 멈출까</tspan><tspan x="290" dy="17.25">미리 정한 수에서?</tspan><tspan x="290" dy="17.25">유의해질 때까지?</tspan><tspan x="290" dy="17.25">조금 더 모아 볼까?</tspan></text></g><g ><g class="shape"><path d="M290 1538c-2 0-3 0-5-1l-253-75c-3-1-3-2 0-3l253-76c3-1 7-1 9 0l253 76c3 1 3 2 0 3l-252 75c-2 1-3 1-5 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="290" y="1449.5" class="text-bold fill-N1 s1"><tspan x="290" dy="0">5. 누구에게서 효과가 나올까</tspan><tspan x="290" dy="17.667">전체? 여자만?</tspan><tspan x="290" dy="17.667">어린 참가자만? 첫 시행만?</tspan></text></g><g ><g class="shape"><path d="M163 1638h255v82H163z" class="stroke-B1 fill-B5 s0"/></g><text x="290.5" y="1676.5" class="text-bold fill-N1 s1"><tspan x="290.5" dy="0">유의한 결과 하나</tspan><tspan x="290.5" dy="18.5">논문에는 이 길만 적힌다</tspan></text></g><path fill="transparent" stroke="transparent" d="M720 40h451v960H720z" class="shape s0"/><text x="909.5" y="1056" class="fill-N1 s1"><tspan x="909.5" dy="0">그래서 사전등록은 ‘정직 서약’ 이 아니라</tspan><tspan x="909.5" dy="17">지도를 미리 그려 봉해 두는 일이다.</tspan><tspan x="909.5" dy="17">다섯 갈림에서 어디로 갈지</tspan><tspan x="909.5" dy="17">자료를 보기 전에 적어 두면 길이 하나가 되고,</tspan><tspan x="909.5" dy="17">그때 비로소 5% 라는 값이 뜻을 갖는다</tspan></text><g ><g class="shape"><path d="M720 1165h451v471H720z" class="stroke-B1 fill-B5 s0"/></g><text x="945.5" y="1194" class="fill-N1" style="text-anchor:middle;font-size:24px">셈해 보면</text></g><g ><g class="shape"><path d="M744 1206h403v82H744z" class="stroke-B1 fill-B6 s0"/></g><text x="945.5" y="1244.5" class="text-bold fill-N1 s1"><tspan x="945.5" dy="0">갈림마다 선택지가 셋이라면</tspan><tspan x="945.5" dy="18.5">길은 3 × 3 × 3 × 3 × 3 = 243 가지다</tspan></text></g><g ><g class="shape"><path d="M744 1312h403v114H744z" class="stroke-B1 fill-B6 s0"/></g><text x="945.5" y="1350.5" class="text-bold fill-N1 s1"><tspan x="945.5" dy="0">243 갈래를 다 걸어 보고</tspan><tspan x="945.5" dy="17.25">유의한 것 하나를 고르면</tspan><tspan x="945.5" dy="17.25">‘20번에 한 번 우연히 유의하다’ 는</tspan><tspan x="945.5" dy="17.25">보장은 남아 있지 않다</tspan></text></g><g ><g class="shape"><path d="M744 1450h403v162H744z" class="stroke-B1 fill-B6 s0"/></g><text x="945.5" y="1488.5" class="text-bold fill-N1 s1"><tspan x="945.5" dy="0">여기서 무서운 것은</tspan><tspan x="945.5" dy="16.714">다 걸어 보지 않아도</tspan><tspan x="945.5" dy="16.714">같은 일이 벌어진다는 점이다.</tspan><tspan x="945.5" dy="16.714">자료를 보면서 그럴듯한 쪽으로</tspan><tspan x="945.5" dy="16.714">한 번씩 정해 나가면</tspan><tspan x="945.5" dy="16.714">연구자 자신은 한 길만 걸었다고 느끼지만</tspan><tspan x="945.5" dy="16.714">결과는 자료에 맞춰 골라진 것이다</tspan></text></g><marker id="mk-d2-944205058-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-944205058-3488378134)" d="M290 132v94" class="connection stroke-B1 s0" mask="url(#d2-944205058)"/><path fill="none" marker-end="url(#mk-d2-944205058-3488378134)" d="M290 452v94" class="connection stroke-B1 s0" mask="url(#d2-944205058)"/><path fill="none" marker-end="url(#mk-d2-944205058-3488378134)" d="M290 740v94" class="connection stroke-B1 s0" mask="url(#d2-944205058)"/><path fill="none" marker-end="url(#mk-d2-944205058-3488378134)" d="M290 996v94" class="connection stroke-B1 s0" mask="url(#d2-944205058)"/><path fill="none" marker-end="url(#mk-d2-944205058-3488378134)" d="M290 1284v94" class="connection stroke-B1 s0" mask="url(#d2-944205058)"/><path fill="none" marker-end="url(#mk-d2-944205058-3488378134)" d="M290 1540v94" class="connection stroke-B1 s0" mask="url(#d2-944205058)"/><marker id="mk-d2-944205058-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-944205058-2177206569)" d="M945.5 1163.5v-35" class="connection stroke-B2 s3" mask="url(#d2-944205058)"/><path fill="none" marker-end="url(#mk-d2-944205058-2177206569)" d="m388.34 1637.717 328.479-139.652" class="connection stroke-B2 s3" mask="url(#d2-944205058)"/><mask id="d2-944205058" width="1433" height="1952" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1433v1952H-101z"/></mask></svg>