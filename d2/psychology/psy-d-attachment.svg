<svg xmlns="http://www.w3.org/2000/svg" width="4957" height="888" class="d2-1565262580 d2-svg" viewBox="-30 -85 4957 888"><rect width="4957" height="888" x="-30" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1565262580 .fill-N1{fill:#0a0f25}.d2-1565262580 .fill-B4{fill:#e3e9fd}.d2-1565262580 .fill-B5{fill:#edf0fd}.d2-1565262580 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M71 472h1448v142H71z" class="stroke-B1 fill-B4 s0"/></g><text x="795" y="459" class="fill-N1 s1">낯선 상황 절차</text></g><g ><g class="shape"><path d="M2022 182h661v520h-661z" class="stroke-B1 fill-B4 s0"/></g><text x="2352.5" y="169" class="fill-N1 s1">기록에서 붙이는 분류</text></g><g ><g class="shape"><path d="M3025 56h808v632h-808z" class="stroke-B1 fill-B4 s0"/></g><text x="3429" y="43" class="fill-N1 s1">무엇이 다투어지는가</text></g><text x="4465" y="441" class="fill-N1 s2"><tspan x="4465" dy="0"> </tspan><tspan x="4465" dy="17.667">널리 퍼진 ‘어릴 때 애착 유형이 평생의 관계를 정한다’ 는 문장은</tspan><tspan x="4465" dy="17.667">자료가 지지하는 것보다 훨씬 세다. 관련은 관찰되지만 결정이라고 부를 크기가 아니다</tspan></text><g ><g class="shape"><path d="M101 502h668v82H101z" class="stroke-B1 fill-B5 s0"/></g><text x="435" y="540.5" class="text-bold fill-N1 s2"><tspan x="435" dy="0">낯선 방에서 양육자가 잠깐 나갔다 돌아오는 짧은 장면을 여러 번 만들고,</tspan><tspan x="435" dy="18.5">그 사이 아이의 행동을 정해진 규칙으로 기록한다</tspan></text></g><g ><g class="shape"><path d="M970 502h519v82H970z" class="stroke-B1 fill-B5 s0"/></g><text x="1229.5" y="540.5" class="text-bold fill-N1 s2"><tspan x="1229.5" dy="0">판정의 무게는 헤어질 때가 아니라 다시 만날 때에 있다.</tspan><tspan x="1229.5" dy="18.5">돌아온 양육자를 아이가 어떻게 쓰는가를 본다</tspan></text></g><g ><g class="shape"><path d="M2152 212h401v66h-401z" class="stroke-B1 fill-B5 s0"/></g><text x="2352.5" y="250.5" class="text-bold fill-N1 s2">안정 — 재회 때 다가가 달래지고 다시 논다</text></g><g ><g class="shape"><path d="M2110 338h485v66h-485z" class="stroke-B1 fill-B5 s0"/></g><text x="2352.5" y="376.5" class="text-bold fill-N1 s2">회피 — 재회 때 다가가지 않고 장난감에 붙어 있는다</text></g><g ><g class="shape"><path d="M2081 464h542v66h-542z" class="stroke-B1 fill-B5 s0"/></g><text x="2352" y="502.5" class="text-bold fill-N1 s2">저항 — 다가가면서 동시에 밀어내고 오래 달래지지 않는다</text></g><g ><g class="shape"><path d="M2052 590h601v82h-601z" class="stroke-B1 fill-B5 s0"/></g><text x="2352.5" y="628.5" class="text-bold fill-N1 s2"><tspan x="2352.5" dy="0">혼란 — 위 셋 어디에도 잘 맞지 않고 서로 어긋나는 행동이 나온다.</tspan><tspan x="2352.5" dy="18.5">뒤에 덧붙여진 범주다</tspan></text></g><g ><g class="shape"><path d="M3055 86h748v98h-748z" class="stroke-B1 fill-B5 s0"/></g><text x="3429" y="124.5" class="text-bold fill-N1 s2"><tspan x="3429" dy="0">범주인가 차원인가</tspan><tspan x="3429" dy="17.667">점수를 늘어놓으면 네 덩어리로 갈라지지 않고 한 덩어리로 퍼진다는 분석이 있다.</tspan><tspan x="3429" dy="17.667">경계 가까이의 아이는 다시 재면 유형이 바뀔 수 있다</tspan></text></g><g ><g class="shape"><path d="M3085 244h688v98h-688z" class="stroke-B1 fill-B5 s0"/></g><text x="3429" y="282.5" class="text-bold fill-N1 s2"><tspan x="3429" dy="0">얼마나 안정적인가</tspan><tspan x="3429" dy="17.667">어린 시절의 분류와 나중의 관계 사이에 관련이 관찰되지만 그 크기가 작다.</tspan><tspan x="3429" dy="17.667">사이에 놓인 환경이 크게 개입한다</tspan></text></g><g ><g class="shape"><path d="M3168 402h522v98h-522z" class="stroke-B1 fill-B5 s0"/></g><text x="3429" y="440.5" class="text-bold fill-N1 s2"><tspan x="3429" dy="0">절차가 문화를 가로지르는가</tspan><tspan x="3429" dy="17.667">양육 관습이 다르면 같은 행동이 다른 뜻을 가질 수 있다.</tspan><tspan x="3429" dy="17.667">낯선 상황이 어디에서나 같은 것을 재는지가 논쟁이다</tspan></text></g><g ><g class="shape"><path d="M3140 560h577v98h-577z" class="stroke-B1 fill-B5 s0"/></g><text x="3428.5" y="598.5" class="text-bold fill-N1 s2"><tspan x="3428.5" dy="0">무엇의 원인인가</tspan><tspan x="3428.5" dy="17.667">양육자의 행동만이 아니라 아이의 기질도 이 행동에 들어온다.</tspan><tspan x="3428.5" dy="17.667">두 몫을 이 절차 하나로 가를 수 없다</tspan></text></g><marker id="mk-d2-1565262580-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1565262580-3488378134)" d="M771.5 543h194" class="connection stroke-B1 s0" mask="url(#d2-1565262580)"/><path fill="none" marker-end="url(#mk-d2-1565262580-3488378134)" d="M1521 543h497" class="connection stroke-B1 s0" mask="url(#d2-1565262580)"/><text x="1770.5" y="549" style="fill:#676c7e;text-anchor:middle;font-size:16px">규칙에 따라 붙인다</text><path fill="none" marker-end="url(#mk-d2-1565262580-3488378134)" d="M2684.5 497h337" class="connection stroke-B1 s0" mask="url(#d2-1565262580)"/><marker id="mk-d2-1565262580-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1565262580-2177206569)" d="M3834.5 451h266" class="connection" mask="url(#d2-1565262580)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1565262580" width="4957" height="888" x="-30" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-30-85h4957v888H-30z"/><path d="M1688 533h165v21h-165z"/></mask></svg>