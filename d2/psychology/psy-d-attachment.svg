<svg xmlns="http://www.w3.org/2000/svg" width="1656" height="1488" class="d2-3178791472 d2-svg" viewBox="-101 -101 1656 1488"><rect width="1656" height="1488" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3178791472 .fill-N1{fill:#0a0f25}.d2-3178791472 .fill-B4{fill:#e3e9fd}.d2-3178791472 .fill-B5{fill:#edf0fd}.d2-3178791472 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h567v552H0z" class="stroke-B1 fill-B4 s0"/></g><text x="283.5" y="33" class="fill-N1 s1">낯선 상황 절차</text></g><g ><g class="shape"><path d="M757 0h697v552H757z" class="stroke-B1 fill-B4 s0"/></g><text x="1105.5" y="33" class="fill-N1 s1">기록에서 붙이는 분류</text></g><text x="271.5" y="638" class="fill-N1 s2"><tspan x="271.5" dy="0"> </tspan><tspan x="271.5" dy="17.25">널리 퍼진 ‘어릴 때 애착 유형이 평생의 관계를 정한다’ 는 문장은</tspan><tspan x="271.5" dy="17.25">자료가 지지하는 것보다 훨씬 세다.</tspan><tspan x="271.5" dy="17.25">관련은 관찰되지만 결정이라고 부를 크기가 아니다</tspan></text><g ><g class="shape"><path d="M757 622h697v664H757z" class="stroke-B1 fill-B4 s0"/></g><text x="1105.5" y="655" class="fill-N1 s1">무엇이 다투어지는가</text></g><g ><g class="shape"><path d="M50 50h467v98H50z" class="stroke-B1 fill-B5 s0"/></g><text x="283.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="283.5" dy="0">낯선 방에서 양육자가 잠깐 나갔다 돌아오는</tspan><tspan x="283.5" dy="17.667">짧은 장면을 여러 번 만들고,</tspan><tspan x="283.5" dy="17.667">그 사이 아이의 행동을 정해진 규칙으로 기록한다</tspan></text></g><g ><g class="shape"><path d="M50 198h467v98H50z" class="stroke-B1 fill-B5 s0"/></g><text x="283.5" y="236.5" class="text-bold fill-N1 s2"><tspan x="283.5" dy="0">판정의 무게는 헤어질 때가 아니라</tspan><tspan x="283.5" dy="17.667">다시 만날 때에 있다.</tspan><tspan x="283.5" dy="17.667">돌아온 양육자를 아이가 어떻게 쓰는가를 본다</tspan></text></g><g ><g class="shape"><path d="M817 60h485v66H817z" class="stroke-B1 fill-B5 s0"/></g><text x="1059.5" y="98.5" class="text-bold fill-N1 s2">안정 — 재회 때 다가가 달래지고 다시 논다</text></g><g ><g class="shape"><path d="M817 166h485v66H817z" class="stroke-B1 fill-B5 s0"/></g><text x="1059.5" y="204.5" class="text-bold fill-N1 s2">회피 — 재회 때 다가가지 않고 장난감에 붙어 있는다</text></g><g ><g class="shape"><path d="M817 272h485v82H817z" class="stroke-B1 fill-B5 s0"/></g><text x="1059.5" y="310.5" class="text-bold fill-N1 s2"><tspan x="1059.5" dy="0">저항 — 다가가면서 동시에 밀어내고</tspan><tspan x="1059.5" dy="18.5">오래 달래지지 않는다</tspan></text></g><g ><g class="shape"><path d="M817 394h485v98H817z" class="stroke-B1 fill-B5 s0"/></g><text x="1059.5" y="432.5" class="text-bold fill-N1 s2"><tspan x="1059.5" dy="0">혼란 — 위 셋 어디에도 잘 맞지 않고</tspan><tspan x="1059.5" dy="17.667">서로 어긋나는 행동이 나온다.</tspan><tspan x="1059.5" dy="17.667">뒤에 덧붙여진 범주다</tspan></text></g><g ><g class="shape"><path d="M817 682h577v114H817z" class="stroke-B1 fill-B5 s0"/></g><text x="1105.5" y="720.5" class="text-bold fill-N1 s2"><tspan x="1105.5" dy="0">범주인가 차원인가</tspan><tspan x="1105.5" dy="17.25">점수를 늘어놓으면 네 덩어리로 갈라지지 않고</tspan><tspan x="1105.5" dy="17.25">한 덩어리로 퍼진다는 분석이 있다.</tspan><tspan x="1105.5" dy="17.25">경계 가까이의 아이는 다시 재면 유형이 바뀔 수 있다</tspan></text></g><g ><g class="shape"><path d="M817 836h577v114H817z" class="stroke-B1 fill-B5 s0"/></g><text x="1105.5" y="874.5" class="text-bold fill-N1 s2"><tspan x="1105.5" dy="0">얼마나 안정적인가</tspan><tspan x="1105.5" dy="17.25">어린 시절의 분류와 나중의 관계 사이에</tspan><tspan x="1105.5" dy="17.25">관련이 관찰되지만 그 크기가 작다.</tspan><tspan x="1105.5" dy="17.25">사이에 놓인 환경이 크게 개입한다</tspan></text></g><g ><g class="shape"><path d="M817 990h577v98H817z" class="stroke-B1 fill-B5 s0"/></g><text x="1105.5" y="1028.5" class="text-bold fill-N1 s2"><tspan x="1105.5" dy="0">절차가 문화를 가로지르는가</tspan><tspan x="1105.5" dy="17.667">양육 관습이 다르면 같은 행동이 다른 뜻을 가질 수 있다.</tspan><tspan x="1105.5" dy="17.667">낯선 상황이 어디에서나 같은 것을 재는지가 논쟁이다</tspan></text></g><g ><g class="shape"><path d="M817 1128h577v98H817z" class="stroke-B1 fill-B5 s0"/></g><text x="1105.5" y="1166.5" class="text-bold fill-N1 s2"><tspan x="1105.5" dy="0">무엇의 원인인가</tspan><tspan x="1105.5" dy="17.667">양육자의 행동만이 아니라 아이의 기질도 이 행동에 들어온다.</tspan><tspan x="1105.5" dy="17.667">두 몫을 이 절차 하나로 가를 수 없다</tspan></text></g><marker id="mk-d2-3178791472-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3178791472-3488378134)" d="M283.5 150v44" class="connection stroke-B1 s0" mask="url(#d2-3178791472)"/><path fill="none" marker-end="url(#mk-d2-3178791472-3488378134)" d="M568.5 276h185" class="connection stroke-B1 s0" mask="url(#d2-3178791472)"/><text x="662.5" y="282" style="fill:#676c7e;text-anchor:middle;font-size:16px">규칙에 따라 붙인다</text><path fill="none" marker-end="url(#mk-d2-3178791472-3488378134)" d="M1105.5 554v64" class="connection stroke-B1 s0" mask="url(#d2-3178791472)"/><marker id="mk-d2-3178791472-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3178791472-2177206569)" d="M755.5 954h-185" class="connection" mask="url(#d2-3178791472)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3178791472" width="1656" height="1488" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1656v1488H-101z"/><path d="M580 266h165v21H580z"/></mask></svg>