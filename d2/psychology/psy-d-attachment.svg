<svg xmlns="http://www.w3.org/2000/svg" width="1262" height="1260" class="d2-4171683841 d2-svg" viewBox="-101 -101 1262 1260"><rect width="1262" height="1260" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-4171683841 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4171683841 .fill-N1{fill:#0a0f25}.d2-4171683841 .fill-B4{fill:#e3e9fd}.d2-4171683841 .fill-B5{fill:#edf0fd}.d2-4171683841 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h335v474H0z" class="stroke-B1 fill-B4 s0"/></g><text x="167.5" y="33" class="fill-N1 s1">낯선 상황 절차</text></g><g ><g class="shape"><path d="M465 0h595v474H465z" class="stroke-B1 fill-B4 s0"/></g><text x="762.5" y="33" class="fill-N1 s1">기록에서 붙이는 분류</text></g><text x="101" y="560" class="fill-N1 s2"><tspan x="101" dy="0"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227"> </tspan><tspan x="101" dy="16.227">널리 퍼진</tspan><tspan x="101" dy="16.227">‘어릴 때 애착 유형이</tspan><tspan x="101" dy="16.227">평생의 관계를</tspan><tspan x="101" dy="16.227">정한다’ 는 문장은</tspan><tspan x="101" dy="16.227">자료가 지지하는 것보다</tspan><tspan x="101" dy="16.227">훨씬 세다.</tspan><tspan x="101" dy="16.227">관련은 관찰되지만</tspan><tspan x="101" dy="16.227">결정이라고 부를</tspan><tspan x="101" dy="16.227">크기가 아니다</tspan></text><g ><g class="shape"><path d="M465 544h595v514H465z" class="stroke-B1 fill-B4 s0"/></g><text x="762.5" y="577" class="fill-N1 s1">무엇이 다투어지는가</text></g><g ><g class="shape"><path d="M50 50h235v178H50z" class="stroke-B1 fill-B5 s0"/></g><text x="167.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="167.5" dy="0">낯선 방에서</tspan><tspan x="167.5" dy="16.625">양육자가 잠깐</tspan><tspan x="167.5" dy="16.625">나갔다 돌아오는</tspan><tspan x="167.5" dy="16.625">짧은 장면을</tspan><tspan x="167.5" dy="16.625">여러 번 만들고,</tspan><tspan x="167.5" dy="16.625">그 사이 아이의 행동을</tspan><tspan x="167.5" dy="16.625">정해진 규칙으로</tspan><tspan x="167.5" dy="16.625">기록한다</tspan></text></g><g ><g class="shape"><path d="M50 278h235v146H50z" class="stroke-B1 fill-B5 s0"/></g><text x="167.5" y="316.5" class="text-bold fill-N1 s2"><tspan x="167.5" dy="0">판정의 무게는</tspan><tspan x="167.5" dy="16.833">헤어질 때가 아니라</tspan><tspan x="167.5" dy="16.833">다시 만날 때에 있다.</tspan><tspan x="167.5" dy="16.833">돌아온 양육자를</tspan><tspan x="167.5" dy="16.833">아이가 어떻게</tspan><tspan x="167.5" dy="16.833">쓰는가를 본다</tspan></text></g><g ><g class="shape"><path d="M505 46h232v114H505z" class="stroke-B1 fill-B5 s0"/></g><text x="621" y="92.5" class="text-bold fill-N1 s2"><tspan x="621" dy="0">안정 —</tspan><tspan x="621" dy="17.667">재회 때 다가가</tspan><tspan x="621" dy="17.667">달래지고 다시 논다</tspan></text></g><g ><g class="shape"><path d="M777 46h232v114H777z" class="stroke-B1 fill-B5 s0"/></g><text x="893" y="84.5" class="text-bold fill-N1 s2"><tspan x="893" dy="0">회피 —</tspan><tspan x="893" dy="17.25">재회 때</tspan><tspan x="893" dy="17.25">다가가지 않고</tspan><tspan x="893" dy="17.25">장난감에 붙어 있는다</tspan></text></g><g ><g class="shape"><path d="M505 200h232v146H505z" class="stroke-B1 fill-B5 s0"/></g><text x="621" y="254.5" class="text-bold fill-N1 s2"><tspan x="621" dy="0">저항 —</tspan><tspan x="621" dy="17.25">다가가면서</tspan><tspan x="621" dy="17.25">동시에 밀어내고</tspan><tspan x="621" dy="17.25">오래 달래지지 않는다</tspan></text></g><g ><g class="shape"><path d="M777 200h232v146H777z" class="stroke-B1 fill-B5 s0"/></g><text x="893" y="238.5" class="text-bold fill-N1 s2"><tspan x="893" dy="0">혼란 —</tspan><tspan x="893" dy="16.833">위 셋 어디에도</tspan><tspan x="893" dy="16.833">잘 맞지 않고</tspan><tspan x="893" dy="16.833">서로 어긋나는</tspan><tspan x="893" dy="16.833">행동이 나온다.</tspan><tspan x="893" dy="16.833">뒤에 덧붙여진 범주다</tspan></text></g><g ><g class="shape"><path d="M505 590h243v194H505z" class="stroke-B1 fill-B5 s0"/></g><text x="626.5" y="628.5" class="text-bold fill-N1 s2"><tspan x="626.5" dy="0">범주인가 차원인가</tspan><tspan x="626.5" dy="16.556">점수를 늘어놓으면</tspan><tspan x="626.5" dy="16.556">네 덩어리로</tspan><tspan x="626.5" dy="16.556">갈라지지 않고</tspan><tspan x="626.5" dy="16.556">한 덩어리로 퍼진다는</tspan><tspan x="626.5" dy="16.556">분석이 있다.</tspan><tspan x="626.5" dy="16.556">경계 가까이의 아이는</tspan><tspan x="626.5" dy="16.556">다시 재면 유형이</tspan><tspan x="626.5" dy="16.556">바뀔 수 있다</tspan></text></g><g ><g class="shape"><path d="M788 590h232v194H788z" class="stroke-B1 fill-B5 s0"/></g><text x="904" y="644.5" class="text-bold fill-N1 s2"><tspan x="904" dy="0">얼마나 안정적인가</tspan><tspan x="904" dy="16.714">어린 시절의 분류와</tspan><tspan x="904" dy="16.714">나중의 관계 사이에</tspan><tspan x="904" dy="16.714">관련이 관찰되지만</tspan><tspan x="904" dy="16.714">그 크기가 작다.</tspan><tspan x="904" dy="16.714">사이에 놓인 환경이</tspan><tspan x="904" dy="16.714">크게 개입한다</tspan></text></g><g ><g class="shape"><path d="M505 824h243v194H505z" class="stroke-B1 fill-B5 s0"/></g><text x="626.5" y="862.5" class="text-bold fill-N1 s2"><tspan x="626.5" dy="0">절차가 문화를</tspan><tspan x="626.5" dy="16.556">가로지르는가</tspan><tspan x="626.5" dy="16.556">양육 관습이 다르면</tspan><tspan x="626.5" dy="16.556">같은 행동이</tspan><tspan x="626.5" dy="16.556">다른 뜻을 가질 수 있다.</tspan><tspan x="626.5" dy="16.556">낯선 상황이</tspan><tspan x="626.5" dy="16.556">어디에서나</tspan><tspan x="626.5" dy="16.556">같은 것을 재는지가</tspan><tspan x="626.5" dy="16.556">논쟁이다</tspan></text></g><g ><g class="shape"><path d="M788 824h232v194H788z" class="stroke-B1 fill-B5 s0"/></g><text x="904" y="878.5" class="text-bold fill-N1 s2"><tspan x="904" dy="0">무엇의 원인인가</tspan><tspan x="904" dy="16.714">양육자의 행동만이</tspan><tspan x="904" dy="16.714">아니라 아이의 기질도</tspan><tspan x="904" dy="16.714">이 행동에 들어온다.</tspan><tspan x="904" dy="16.714">두 몫을</tspan><tspan x="904" dy="16.714">이 절차 하나로</tspan><tspan x="904" dy="16.714">가를 수 없다</tspan></text></g><marker id="mk-d2-4171683841-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4171683841-3488378134)" d="M167.5 230v44" class="connection stroke-B1 s0" mask="url(#d2-4171683841)"/><path fill="none" marker-end="url(#mk-d2-4171683841-3488378134)" d="M336.5 237h125" class="connection stroke-B1 s0" mask="url(#d2-4171683841)"/><text x="400" y="235" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px"><tspan x="400" dy="0">규칙에 따라</tspan><tspan x="400" dy="18.5">붙인다</tspan></text><path fill="none" marker-end="url(#mk-d2-4171683841-3488378134)" d="M762.5 476v64" class="connection stroke-B1 s0" mask="url(#d2-4171683841)"/><marker id="mk-d2-4171683841-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4171683841-2177206569)" d="M463.5 801h-125" class="connection" mask="url(#d2-4171683841)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-4171683841" width="1262" height="1260" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1262v1260H-101z"/><path d="M348 219h104v37H348z"/></mask></svg>