<svg xmlns="http://www.w3.org/2000/svg" width="3513" height="1392" class="d2-3884855628 d2-svg" viewBox="-91 -121 3513 1392"><rect width="3513" height="1392" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3884855628 .fill-N1{fill:#0a0f25}.d2-3884855628 .fill-B4{fill:#e3e9fd}.d2-3884855628 .fill-B5{fill:#edf0fd}.d2-3884855628 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M10 20h1459v174H10z" class="stroke-B1 fill-B4 s0"/></g><text x="739.5" y="7" class="fill-N1 s1">널리 쓰이는 구분</text></g><g ><g class="shape"><path d="M226 334h827v356H226z" class="stroke-B1 fill-B4 s0"/></g><text x="639.5" y="321" class="fill-N1 s1">이 구분이 하는 일 — 다수설</text></g><g ><g class="shape"><path d="M1093 334h2228v372H1093z" class="stroke-B1 fill-B4 s0"/></g><text x="2207" y="321" class="fill-N1 s1">그런데 크게 흔들렸다</text></g><g ><g class="shape"><path d="M609 846h2087v324H609z" class="stroke-B1 fill-B4 s0"/></g><text x="1652.5" y="833" class="fill-N1 s1">이 문서가 쓰는 방식</text></g><g ><g class="shape"><path d="M40 50h554v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="317" y="88.5" class="text-bold fill-N1 s2"><tspan x="317" dy="0">빠르고 저절로 일어나는 처리</tspan><tspan x="317" dy="17.25">애쓰지 않아도 일어나고, 여러 가지가 한꺼번에 진행되며,</tspan><tspan x="317" dy="17.25">결과만 의식에 떠오른다</tspan><tspan x="317" dy="17.25">보기 — 익은 얼굴을 알아보는 일, 모국어 문장을 알아듣는 일</tspan></text></g><g ><g class="shape"><path d="M654 50h401v114H654z" class="stroke-B1 fill-B5 s0"/></g><text x="854.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="854.5" dy="0">느리고 애써서 하는 처리</tspan><tspan x="854.5" dy="17.25">주의를 잡아먹고, 한 번에 하나씩 가며,</tspan><tspan x="854.5" dy="17.25">중간 단계를 스스로 따라갈 수 있다</tspan><tspan x="854.5" dy="17.25">보기 — 처음 보는 규칙을 따라 계산하는 일</tspan></text></g><g ><g class="shape"><path d="M256 364h767v98H256z" class="stroke-B1 fill-B5 s0"/></g><text x="639.5" y="402.5" class="text-bold fill-N1 s2"><tspan x="639.5" dy="0">서로 다른 과제들을 하나로 묶어 준다.</tspan><tspan x="639.5" dy="17.667">주의를 다른 데 쓰게 하거나 시간을 촉박하게 하면 판단이 한쪽으로 기운다는 결과가</tspan><tspan x="639.5" dy="17.667">여러 절차에서 되풀이되었다</tspan></text></g><g ><g class="shape"><path d="M381 578h516v82H381z" class="stroke-B1 fill-B5 s0"/></g><text x="639" y="616.5" class="text-bold fill-N1 s2"><tspan x="639" dy="0">그래서 연구를 조직하는 틀로는 널리 쓰인다.</tspan><tspan x="639" dy="18.5">무엇을 조작해 볼지, 무엇과 무엇을 견줄지를 정해 준다</tspan></text></g><g ><g class="shape"><path d="M1123 364h633v98h-633z" class="stroke-B1 fill-B5 s0"/></g><text x="1439.5" y="402.5" class="text-bold fill-N1 s2"><tspan x="1439.5" dy="0">1. 성질들이 함께 가지 않는다</tspan><tspan x="1439.5" dy="17.667">빠름 · 저절로 일어남 · 의식되지 않음 · 여럿을 한꺼번에 — 이 성질들이</tspan><tspan x="1439.5" dy="17.667">한 묶음으로 붙어 다닌다는 근거가 약하다는 지적이 이어졌다</tspan></text></g><g ><g class="shape"><path d="M1816 364h775v98h-775z" class="stroke-B1 fill-B5 s0"/></g><text x="2203.5" y="402.5" class="text-bold fill-N1 s2"><tspan x="2203.5" dy="0">2. 순환에 빠지기 쉽다</tspan><tspan x="2203.5" dy="17.667">어느 쪽 처리였는지를 결과를 보고 정하면, 이 틀은 어떤 결과든 뒤에서 설명하게 되고</tspan><tspan x="2203.5" dy="17.667">미리 무엇을 금지하지 못한다. 금지하지 못하는 틀은 검사할 수 없다</tspan></text></g><g ><g class="shape"><path d="M2651 372h640v82h-640z" class="stroke-B1 fill-B5 s0"/></g><text x="2971" y="410.5" class="text-bold fill-N1 s2"><tspan x="2971" dy="0">3. 이 틀로 얻은 개별 결과 다수가 재현에 실패했다</tspan><tspan x="2971" dy="18.5">자아 고갈, 사회적 점화가 대표적이다. 이 문서 6장이 그 사례를 다뤘다</tspan></text></g><g ><g class="shape"><path d="M1714 562h563v114h-563z" class="stroke-B1 fill-B5 s0"/></g><text x="1995.5" y="600.5" class="text-bold fill-N1 s2"><tspan x="1995.5" dy="0">가장 강한 형태의 반론(이 틀을 지지하는 쪽) —</tspan><tspan x="1995.5" dy="17.25">‘두 체계’ 를 실재하는 기관으로 읽는 것이 애초에 잘못이고,</tspan><tspan x="1995.5" dy="17.25">이것은 처리의 두 성격을 가리키는 이름일 뿐이며,</tspan><tspan x="1995.5" dy="17.25">그 성격 차이를 조작하는 실험 자체는 잘 되풀이된다는 것</tspan></text></g><g ><g class="shape"><path d="M1080 884h683v66h-683z" class="stroke-B1 fill-B5 s0"/></g><text x="1421.5" y="922.5" class="text-bold fill-N1 s2">쓴다 — ‘애쓰지 않고 나오는 판단’ 과 ‘따져서 나오는 판단’ 을 나누는 말로</text></g><g ><g class="shape"><path d="M2121 876h545v82h-545z" class="stroke-B1 fill-B5 s0"/></g><text x="2393.5" y="914.5" class="text-bold fill-N1 s2"><tspan x="2393.5" dy="0">쓰지 않는다 — 머릿속에 두 개의 체계가 확정된 사실처럼.</tspan><tspan x="2393.5" dy="18.5">‘체계 1이 그렇게 시켰다’ 는 설명이 아니라 이름 붙이기다</tspan></text></g><g ><g class="shape"><path d="M1381 1058h755v82h-755z" class="stroke-B1 fill-B5 s0"/></g><text x="1758.5" y="1096.5" class="text-bold fill-N1 s2"><tspan x="1758.5" dy="0">그리고 이 틀에 기대어 소개되는 개별 결과는 그 결과의 재현 상태를 따로 확인한다.</tspan><tspan x="1758.5" dy="18.5">틀이 유용하다는 것이 그 아래 결과들을 보증하지 않는다</tspan></text></g><marker id="mk-d2-3884855628-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3884855628-3488378134)" d="M639 464v110" class="connection stroke-B1 s0" mask="url(#d2-3884855628)"/><path fill="none" marker-end="url(#mk-d2-3884855628-3488378134)" d="M1439 464c0 38 55 58.6 271.072 100.243" class="connection stroke-B1 s0" mask="url(#d2-3884855628)"/><path fill="none" marker-end="url(#mk-d2-3884855628-3488378134)" d="M2203 464c0 38-19.4 58-93.445 96.167" class="connection stroke-B1 s0" mask="url(#d2-3884855628)"/><path fill="none" marker-end="url(#mk-d2-3884855628-3488378134)" d="M2970.5 456c0 44.4-138.8 71.2-690.024 131.565" class="connection stroke-B1 s0" mask="url(#d2-3884855628)"/><path fill="none" marker-end="url(#mk-d2-3884855628-3488378134)" d="M1421 952c0 44.4 37 66 181.139 104.956" class="connection stroke-B1 s0" mask="url(#d2-3884855628)"/><path fill="none" marker-end="url(#mk-d2-3884855628-3488378134)" d="M2393.75 960c0 38-69.8 58-345.04 97.433" class="connection stroke-B1 s0" mask="url(#d2-3884855628)"/><path fill="none" marker-end="url(#mk-d2-3884855628-3488378134)" d="M639 196v93" class="connection stroke-B1 s0" mask="url(#d2-3884855628)"/><path fill="none" marker-end="url(#mk-d2-3884855628-3488378134)" d="M1439 196v134" class="connection stroke-B1 s0" mask="url(#d2-3884855628)"/><path fill="none" marker-end="url(#mk-d2-3884855628-3488378134)" d="M639 692v150" class="connection stroke-B1 s0" mask="url(#d2-3884855628)"/><path fill="none" marker-end="url(#mk-d2-3884855628-3488378134)" d="M1995.5 708v134" class="connection stroke-B1 s0" mask="url(#d2-3884855628)"/><mask id="d2-3884855628" width="3513" height="1392" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h3513v1392H-91z"/></mask></svg>