<svg xmlns="http://www.w3.org/2000/svg" width="1772" height="1202" class="d2-2538473579 d2-svg" viewBox="-101 -101 1772 1202"><rect width="1772" height="1202" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2538473579 .fill-N1{fill:#0a0f25}.d2-2538473579 .fill-B4{fill:#e3e9fd}.d2-2538473579 .fill-B5{fill:#edf0fd}.d2-2538473579 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h929v420H0z" class="stroke-B1 fill-B4 s0"/></g><text x="464.5" y="33" class="fill-N1 s1">널리 쓰이는 구분</text></g><g ><g class="shape"><path d="M999 0h571v420H999z" class="stroke-B1 fill-B4 s0"/></g><text x="1284.5" y="33" class="fill-N1 s1">이 구분이 하는 일 — 다수설</text></g><g ><g class="shape"><path d="M0 490h929v510H0z" class="stroke-B1 fill-B4 s0"/></g><text x="464.5" y="523" class="fill-N1 s1">그런데 크게 흔들렸다</text></g><g ><g class="shape"><path d="M999 490h571v510H999z" class="stroke-B1 fill-B4 s0"/></g><text x="1284.5" y="523" class="fill-N1 s1">이 문서가 쓰는 방식</text></g><g ><g class="shape"><path d="M60 60h401v146H60z" class="stroke-B1 fill-B5 s0"/></g><text x="260.5" y="98.5" class="text-bold fill-N1 s2"><tspan x="260.5" dy="0">빠르고 저절로 일어나는 처리</tspan><tspan x="260.5" dy="16.833">애쓰지 않아도 일어나고,</tspan><tspan x="260.5" dy="16.833">여러 가지가 한꺼번에 진행되며,</tspan><tspan x="260.5" dy="16.833">결과만 의식에 떠오른다</tspan><tspan x="260.5" dy="16.833">보기 — 익은 얼굴을 알아보는 일,</tspan><tspan x="260.5" dy="16.833">모국어 문장을 알아듣는 일</tspan></text></g><g ><g class="shape"><path d="M60 246h401v114H60z" class="stroke-B1 fill-B5 s0"/></g><text x="260.5" y="284.5" class="text-bold fill-N1 s2"><tspan x="260.5" dy="0">느리고 애써서 하는 처리</tspan><tspan x="260.5" dy="17.25">주의를 잡아먹고, 한 번에 하나씩 가며,</tspan><tspan x="260.5" dy="17.25">중간 단계를 스스로 따라갈 수 있다</tspan><tspan x="260.5" dy="17.25">보기 — 처음 보는 규칙을 따라 계산하는 일</tspan></text></g><g ><g class="shape"><path d="M1049 50h471v114h-471z" class="stroke-B1 fill-B5 s0"/></g><text x="1284.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="1284.5" dy="0">서로 다른 과제들을 하나로 묶어 준다.</tspan><tspan x="1284.5" dy="17.25">주의를 다른 데 쓰게 하거나 시간을 촉박하게 하면</tspan><tspan x="1284.5" dy="17.25">판단이 한쪽으로 기운다는 결과가</tspan><tspan x="1284.5" dy="17.25">여러 절차에서 되풀이되었다</tspan></text></g><g ><g class="shape"><path d="M1049 214h471v98h-471z" class="stroke-B1 fill-B5 s0"/></g><text x="1284.5" y="252.5" class="text-bold fill-N1 s2"><tspan x="1284.5" dy="0">그래서 연구를 조직하는 틀로는 널리 쓰인다.</tspan><tspan x="1284.5" dy="17.667">무엇을 조작해 볼지,</tspan><tspan x="1284.5" dy="17.667">무엇과 무엇을 견줄지를 정해 준다</tspan></text></g><g ><g class="shape"><path d="M50 540h370v130H50z" class="stroke-B1 fill-B5 s0"/></g><text x="235" y="578.5" class="text-bold fill-N1 s2"><tspan x="235" dy="0">1. 성질들이 함께 가지 않는다</tspan><tspan x="235" dy="17">빠름 · 저절로 일어남 · 의식되지 않음 ·</tspan><tspan x="235" dy="17">여럿을 한꺼번에 — 이 성질들이</tspan><tspan x="235" dy="17">한 묶음으로 붙어 다닌다는</tspan><tspan x="235" dy="17">근거가 약하다는 지적이 이어졌다</tspan></text></g><g ><g class="shape"><path d="M470 540h409v130H470z" class="stroke-B1 fill-B5 s0"/></g><text x="674.5" y="578.5" class="text-bold fill-N1 s2"><tspan x="674.5" dy="0">2. 순환에 빠지기 쉽다</tspan><tspan x="674.5" dy="17">어느 쪽 처리였는지를 결과를 보고 정하면,</tspan><tspan x="674.5" dy="17">이 틀은 어떤 결과든 뒤에서 설명하게 되고</tspan><tspan x="674.5" dy="17">미리 무엇을 금지하지 못한다.</tspan><tspan x="674.5" dy="17">금지하지 못하는 틀은 검사할 수 없다</tspan></text></g><g ><g class="shape"><path d="M50 720h370v178H50z" class="stroke-B1 fill-B5 s0"/></g><text x="235" y="790.5" class="text-bold fill-N1 s2"><tspan x="235" dy="0">3. 이 틀로 얻은</tspan><tspan x="235" dy="17.25">개별 결과 여럿이 재현에 실패했다</tspan><tspan x="235" dy="17.25">자아 고갈, 사회적 점화가 대표적이다.</tspan><tspan x="235" dy="17.25">이 문서 6장이 그 사례를 다뤘다</tspan></text></g><g ><g class="shape"><path d="M470 720h409v178H470z" class="stroke-B1 fill-B5 s0"/></g><text x="674.5" y="758.5" class="text-bold fill-N1 s2"><tspan x="674.5" dy="0">가장 강한 형태의 반론(이 틀을</tspan><tspan x="674.5" dy="16.625">지지하는 쪽) —</tspan><tspan x="674.5" dy="16.625">‘두 체계’ 를 실재하는 기관으로</tspan><tspan x="674.5" dy="16.625">읽는 것이 애초에 잘못이고,</tspan><tspan x="674.5" dy="16.625">이것은 처리의 두 성격을</tspan><tspan x="674.5" dy="16.625">가리키는 이름일 뿐이며,</tspan><tspan x="674.5" dy="16.625">그 성격 차이를 조작하는</tspan><tspan x="674.5" dy="16.625">실험 자체는 잘 되풀이된다는 것</tspan></text></g><g ><g class="shape"><path d="M1049 540h427v82h-427z" class="stroke-B1 fill-B5 s0"/></g><text x="1262.5" y="578.5" class="text-bold fill-N1 s2"><tspan x="1262.5" dy="0">쓴다 — ‘애쓰지 않고 나오는 판단’ 과</tspan><tspan x="1262.5" dy="18.5">‘따져서 나오는 판단’ 을 나누는 말로</tspan></text></g><g ><g class="shape"><path d="M1049 672h427v114h-427z" class="stroke-B1 fill-B5 s0"/></g><text x="1262.5" y="710.5" class="text-bold fill-N1 s2"><tspan x="1262.5" dy="0">그리고 이 틀에 기대어 소개되는 개별 결과는</tspan><tspan x="1262.5" dy="17.25">그 결과의 재현 상태를 따로 확인한다.</tspan><tspan x="1262.5" dy="17.25">틀이 유용하다는 것이</tspan><tspan x="1262.5" dy="17.25">그 아래 결과들을 보증하지 않는다</tspan></text></g><g ><g class="shape"><path d="M1049 836h427v114h-427z" class="stroke-B1 fill-B5 s0"/></g><text x="1262.5" y="874.5" class="text-bold fill-N1 s2"><tspan x="1262.5" dy="0">쓰지 않는다 — 머릿속에</tspan><tspan x="1262.5" dy="17.25">두 개의 체계가 확정된 사실처럼.</tspan><tspan x="1262.5" dy="17.25">‘체계 1이 그렇게 시켰다’ 는</tspan><tspan x="1262.5" dy="17.25">설명이 아니라 이름 붙이기다</tspan></text></g><marker id="mk-d2-2538473579-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2538473579-3488378134)" d="M1284.5 166v44" class="connection stroke-B1 s0" mask="url(#d2-2538473579)"/><path fill="none" marker-end="url(#mk-d2-2538473579-3488378134)" d="m377.315 670.84 102.555 47.48" class="connection stroke-B1 s0" mask="url(#d2-2538473579)"/><path fill="none" marker-end="url(#mk-d2-2538473579-3488378134)" d="M674.5 672v44" class="connection stroke-B1 s0" mask="url(#d2-2538473579)"/><path fill="none" marker-end="url(#mk-d2-2538473579-3488378134)" d="M421.5 809h45" class="connection stroke-B1 s0" mask="url(#d2-2538473579)"/><path fill="none" marker-end="url(#mk-d2-2538473579-3488378134)" d="M1262.5 624v44" class="connection stroke-B1 s0" mask="url(#d2-2538473579)"/><path fill="none" marker-end="url(#mk-d2-2538473579-3488378134)" d="M1262.5 834v-44" class="connection stroke-B1 s0" mask="url(#d2-2538473579)"/><path fill="none" marker-end="url(#mk-d2-2538473579-3488378134)" d="M930.5 210h65" class="connection stroke-B1 s0" mask="url(#d2-2538473579)"/><path fill="none" marker-end="url(#mk-d2-2538473579-3488378134)" d="M464.5 422v64" class="connection stroke-B1 s0" mask="url(#d2-2538473579)"/><path fill="none" marker-end="url(#mk-d2-2538473579-3488378134)" d="M1284.5 422v64" class="connection stroke-B1 s0" mask="url(#d2-2538473579)"/><path fill="none" marker-end="url(#mk-d2-2538473579-3488378134)" d="M930.5 745h65" class="connection stroke-B1 s0" mask="url(#d2-2538473579)"/><mask id="d2-2538473579" width="1772" height="1202" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1772v1202H-101z"/></mask></svg>