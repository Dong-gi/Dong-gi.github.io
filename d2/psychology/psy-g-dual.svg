<svg xmlns="http://www.w3.org/2000/svg" width="1264" height="1594" class="d2-1592649569 d2-svg" viewBox="-101 -101 1264 1594"><rect width="1264" height="1594" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1592649569 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1592649569 .fill-N1{fill:#0a0f25}.d2-1592649569 .fill-B4{fill:#e3e9fd}.d2-1592649569 .fill-B5{fill:#edf0fd}.d2-1592649569 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M155 0h671v264H155z" class="stroke-B1 fill-B4 s0"/></g><text x="490.5" y="33" class="fill-N1 s1">널리 쓰이는 구분</text></g><g ><g class="shape"><path d="M6 460h411v474H6z" class="stroke-B1 fill-B4 s0"/></g><text x="211.5" y="493" class="fill-N1 s1">이 구분이 하는 일 — 다수설</text></g><g ><g class="shape"><path d="M477 364h585v666H477z" class="stroke-B1 fill-B4 s0"/></g><text x="769.5" y="397" class="fill-N1 s1">그런데 크게 흔들렸다</text></g><g ><g class="shape"><path d="M0 1130h981v262H0z" class="stroke-B1 fill-B4 s0"/></g><text x="490.5" y="1163" class="fill-N1 s1">이 문서가 쓰는 방식</text></g><g ><g class="shape"><path d="M195 46h296v178H195z" class="stroke-B1 fill-B5 s0"/></g><text x="343" y="84.5" class="text-bold fill-N1 s2"><tspan x="343" dy="0">빠르고 저절로 일어나는 처리</tspan><tspan x="343" dy="16.625">애쓰지 않아도 일어나고,</tspan><tspan x="343" dy="16.625">여러 가지가</tspan><tspan x="343" dy="16.625">한꺼번에 진행되며,</tspan><tspan x="343" dy="16.625">결과만 의식에 떠오른다</tspan><tspan x="343" dy="16.625">보기 — 익은 얼굴을</tspan><tspan x="343" dy="16.625">알아보는 일,</tspan><tspan x="343" dy="16.625">모국어 문장을 알아듣는 일</tspan></text></g><g ><g class="shape"><path d="M531 46h255v178H531z" class="stroke-B1 fill-B5 s0"/></g><text x="658.5" y="92.5" class="text-bold fill-N1 s2"><tspan x="658.5" dy="0">느리고 애써서 하는 처리</tspan><tspan x="658.5" dy="16.714">주의를 잡아먹고,</tspan><tspan x="658.5" dy="16.714">한 번에 하나씩 가며,</tspan><tspan x="658.5" dy="16.714">중간 단계를</tspan><tspan x="658.5" dy="16.714">스스로 따라갈 수 있다</tspan><tspan x="658.5" dy="16.714">보기 — 처음 보는 규칙을</tspan><tspan x="658.5" dy="16.714">따라 계산하는 일</tspan></text></g><g ><g class="shape"><path d="M85 510h252v194H85z" class="stroke-B1 fill-B5 s0"/></g><text x="211" y="548.5" class="text-bold fill-N1 s2"><tspan x="211" dy="0">서로 다른 과제들을</tspan><tspan x="211" dy="16.556">하나로 묶어 준다.</tspan><tspan x="211" dy="16.556">주의를 다른 데</tspan><tspan x="211" dy="16.556">쓰게 하거나</tspan><tspan x="211" dy="16.556">시간을 촉박하게 하면</tspan><tspan x="211" dy="16.556">판단이 한쪽으로</tspan><tspan x="211" dy="16.556">기운다는 결과가</tspan><tspan x="211" dy="16.556">여러 절차에서</tspan><tspan x="211" dy="16.556">되풀이되었다</tspan></text></g><g ><g class="shape"><path d="M85 754h252v130H85z" class="stroke-B1 fill-B5 s0"/></g><text x="211" y="792.5" class="text-bold fill-N1 s2"><tspan x="211" dy="0">그래서 연구를 조직하는</tspan><tspan x="211" dy="17">틀로는 널리 쓰인다.</tspan><tspan x="211" dy="17">무엇을 조작해 볼지,</tspan><tspan x="211" dy="17">무엇과 무엇을</tspan><tspan x="211" dy="17">견줄지를 정해 준다</tspan></text></g><g ><g class="shape"><path d="M527 414h203v226H527z" class="stroke-B1 fill-B5 s0"/></g><text x="628.5" y="452.5" class="text-bold fill-N1 s2"><tspan x="628.5" dy="0">1. 성질들이</tspan><tspan x="628.5" dy="16.455">함께 가지 않는다</tspan><tspan x="628.5" dy="16.455">빠름 ·</tspan><tspan x="628.5" dy="16.455">저절로 일어남 ·</tspan><tspan x="628.5" dy="16.455">의식되지 않음 ·</tspan><tspan x="628.5" dy="16.455">여럿을 한꺼번에 —</tspan><tspan x="628.5" dy="16.455">이 성질들이</tspan><tspan x="628.5" dy="16.455">한 묶음으로</tspan><tspan x="628.5" dy="16.455">붙어 다닌다는</tspan><tspan x="628.5" dy="16.455">근거가 약하다는</tspan><tspan x="628.5" dy="16.455">지적이 이어졌다</tspan></text></g><g ><g class="shape"><path d="M780 414h232v226H780z" class="stroke-B1 fill-B5 s0"/></g><text x="896" y="468.5" class="text-bold fill-N1 s2"><tspan x="896" dy="0">2. 순환에 빠지기 쉽다</tspan><tspan x="896" dy="16.556">어느 쪽 처리였는지를</tspan><tspan x="896" dy="16.556">결과를 보고 정하면,</tspan><tspan x="896" dy="16.556">이 틀은 어떤 결과든</tspan><tspan x="896" dy="16.556">뒤에서 설명하게 되고</tspan><tspan x="896" dy="16.556">미리 무엇을</tspan><tspan x="896" dy="16.556">금지하지 못한다.</tspan><tspan x="896" dy="16.556">금지하지 못하는 틀은</tspan><tspan x="896" dy="16.556">검사할 수 없다</tspan></text></g><g ><g class="shape"><path d="M527 690h203v290H527z" class="stroke-B1 fill-B5 s0"/></g><text x="628.5" y="784.5" class="text-bold fill-N1 s2"><tspan x="628.5" dy="0">3. 이 틀로 얻은</tspan><tspan x="628.5" dy="16.625">개별 결과 여럿이</tspan><tspan x="628.5" dy="16.625">재현에 실패했다</tspan><tspan x="628.5" dy="16.625">자아 고갈,</tspan><tspan x="628.5" dy="16.625">사회적 점화가</tspan><tspan x="628.5" dy="16.625">대표적이다.</tspan><tspan x="628.5" dy="16.625">이 문서 6장이</tspan><tspan x="628.5" dy="16.625">그 사례를 다뤘다</tspan></text></g><g ><g class="shape"><path d="M780 690h232v290H780z" class="stroke-B1 fill-B5 s0"/></g><text x="896" y="728.5" class="text-bold fill-N1 s2"><tspan x="896" dy="0">가장 강한 형태의</tspan><tspan x="896" dy="16.333">반론(이 틀을</tspan><tspan x="896" dy="16.333">지지하는 쪽) —</tspan><tspan x="896" dy="16.333">‘두 체계’ 를</tspan><tspan x="896" dy="16.333">실재하는 기관으로</tspan><tspan x="896" dy="16.333">읽는 것이</tspan><tspan x="896" dy="16.333">애초에 잘못이고,</tspan><tspan x="896" dy="16.333">이것은 처리의</tspan><tspan x="896" dy="16.333">두 성격을</tspan><tspan x="896" dy="16.333">가리키는 이름일</tspan><tspan x="896" dy="16.333">뿐이며,</tspan><tspan x="896" dy="16.333">그 성격 차이를</tspan><tspan x="896" dy="16.333">조작하는</tspan><tspan x="896" dy="16.333">실험 자체는</tspan><tspan x="896" dy="16.333">잘 되풀이된다는 것</tspan></text></g><g ><g class="shape"><path d="M50 1180h257v162H50z" class="stroke-B1 fill-B5 s0"/></g><text x="178.5" y="1242.5" class="text-bold fill-N1 s2"><tspan x="178.5" dy="0">쓴다 — ‘애쓰지 않고</tspan><tspan x="178.5" dy="17.25">나오는 판단’ 과</tspan><tspan x="178.5" dy="17.25">‘따져서 나오는 판단’ 을</tspan><tspan x="178.5" dy="17.25">나누는 말로</tspan></text></g><g ><g class="shape"><path d="M357 1180h235v162H357z" class="stroke-B1 fill-B5 s0"/></g><text x="474.5" y="1218.5" class="text-bold fill-N1 s2"><tspan x="474.5" dy="0">그리고 이 틀에 기대어</tspan><tspan x="474.5" dy="16.714">소개되는 개별 결과는</tspan><tspan x="474.5" dy="16.714">그 결과의 재현 상태를</tspan><tspan x="474.5" dy="16.714">따로 확인한다.</tspan><tspan x="474.5" dy="16.714">틀이 유용하다는 것이</tspan><tspan x="474.5" dy="16.714">그 아래 결과들을</tspan><tspan x="474.5" dy="16.714">보증하지 않는다</tspan></text></g><g ><g class="shape"><path d="M642 1180h289v162H642z" class="stroke-B1 fill-B5 s0"/></g><text x="786.5" y="1226.5" class="text-bold fill-N1 s2"><tspan x="786.5" dy="0">쓰지 않는다 — 머릿속에</tspan><tspan x="786.5" dy="16.833">두 개의 체계가</tspan><tspan x="786.5" dy="16.833">확정된 사실처럼.</tspan><tspan x="786.5" dy="16.833">‘체계 1이 그렇게 시켰다’ 는</tspan><tspan x="786.5" dy="16.833">설명이 아니라</tspan><tspan x="786.5" dy="16.833">이름 붙이기다</tspan></text></g><marker id="mk-d2-1592649569-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1592649569-3488378134)" d="M211.5 706v44" class="connection stroke-B1 s0" mask="url(#d2-1592649569)"/><path fill="none" marker-end="url(#mk-d2-1592649569-3488378134)" d="m728.312 641.51 49.065 56.47" class="connection stroke-B1 s0" mask="url(#d2-1592649569)"/><path fill="none" marker-end="url(#mk-d2-1592649569-3488378134)" d="M896 642v44" class="connection stroke-B1 s0" mask="url(#d2-1592649569)"/><path fill="none" marker-end="url(#mk-d2-1592649569-3488378134)" d="M732 835h44" class="connection stroke-B1 s0" mask="url(#d2-1592649569)"/><path fill="none" marker-end="url(#mk-d2-1592649569-3488378134)" d="M308.5 1261h45" class="connection stroke-B1 s0" mask="url(#d2-1592649569)"/><path fill="none" marker-end="url(#mk-d2-1592649569-3488378134)" d="M640.5 1261h-45" class="connection stroke-B1 s0" mask="url(#d2-1592649569)"/><path fill="none" marker-end="url(#mk-d2-1592649569-3488378134)" d="M286.823 265.09C226.9 304 211.5 343.2 211.5 456" class="connection stroke-B1 s0" mask="url(#d2-1592649569)"/><path fill="none" marker-end="url(#mk-d2-1592649569-3488378134)" d="M694.177 265.09C754.1 304 769.5 324 769.5 360" class="connection stroke-B1 s0" mask="url(#d2-1592649569)"/><path fill="none" marker-end="url(#mk-d2-1592649569-3488378134)" d="M211.5 936c0 114.8 15.4 154 73.645 191.822" class="connection stroke-B1 s0" mask="url(#d2-1592649569)"/><path fill="none" marker-end="url(#mk-d2-1592649569-3488378134)" d="M769.5 1032c0 38-15.4 58-73.645 95.822" class="connection stroke-B1 s0" mask="url(#d2-1592649569)"/><mask id="d2-1592649569" width="1264" height="1594" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1264v1594H-101z"/></mask></svg>