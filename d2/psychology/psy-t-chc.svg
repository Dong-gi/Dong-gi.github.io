<svg xmlns="http://www.w3.org/2000/svg" width="1413" height="1679" class="d2-1068223443 d2-svg" viewBox="-91 -101 1413 1679"><rect width="1413" height="1679" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1068223443 .fill-N1{fill:#0a0f25}.d2-1068223443 .fill-N2{fill:#676c7e}.d2-1068223443 .fill-B4{fill:#e3e9fd}.d2-1068223443 .fill-B5{fill:#edf0fd}.d2-1068223443 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M327 1121h568v356H327z" class="stroke-B1 fill-B4 s0"/></g><text x="611" y="1108" class="fill-N1 s1">맨 아래 — 관찰된 사실</text></g><g ><g class="shape"><path d="M182 707h857v273H182z" class="stroke-B1 fill-B4 s0"/></g><text x="610.5" y="740" class="fill-N1 s1">가운데 — 넓은 능력들</text></g><g ><g class="shape"><path d="M441 504h340v82H441z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="611" y="542.5" class="text-bold fill-N1 s2"><tspan x="611" dy="0">맨 위 — g</tspan><tspan x="611" dy="18.5">모든 과제에 공통으로 들어가는 것</tspan></text></g><g ><g class="shape"><path d="M10 205h1211v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="615.5" y="164" class="fill-N1 s1"><tspan x="615.5" dy="0">g 를 무엇으로 볼 것인가 —</tspan><tspan x="615.5" dy="32">여기가 논쟁이다</tspan></text></g><text x="610.5" y="16" class="fill-N1 s2"><tspan x="610.5" dy="0"> </tspan><tspan x="610.5" dy="17">읽을 때 조심할 것 —</tspan><tspan x="610.5" dy="17">‘g 가 있다’ 는 관찰이고 ‘g 가 무엇인가’ 는 해석이다.</tspan><tspan x="610.5" dy="17">앞의 것은 튼튼하고 뒤의 것은 다투어진다.</tspan><tspan x="610.5" dy="17">두 문장을 섞어 쓰면 관찰의 힘이 해석에 옮겨 붙는다</tspan></text><g ><g class="shape"><path d="M357 1349h508v98H357z" class="stroke-B1 fill-B5 s0"/></g><text x="611" y="1387.5" class="text-bold fill-N1 s2"><tspan x="611" dy="0">서로 다른 인지 과제의 점수들이</tspan><tspan x="611" dy="17.667">대체로 양의 상관을 이룬다.</tspan><tspan x="611" dy="17.667">어휘를 잘하는 사람이 도형 추론도 평균적으로 잘한다</tspan></text></g><g ><g class="shape"><path d="M435 1151h351v98H435z" class="stroke-B1 fill-B5 s0"/></g><text x="610.5" y="1189.5" class="text-bold fill-N1 s2"><tspan x="610.5" dy="0">이 패턴은 여러 표본 · 여러 검사에서</tspan><tspan x="610.5" dy="17.667">되풀이 관찰되었다.</tspan><tspan x="610.5" dy="17.667">이 자리까지는 다툼이 거의 없다</tspan></text></g><g ><g class="shape"><path d="M212 753h212v98H212z" class="stroke-B1 fill-B5 s0"/></g><text x="318" y="791.5" class="text-bold fill-N1 s2"><tspan x="318" dy="0">유동추론</tspan><tspan x="318" dy="17.667">처음 보는 문제에서</tspan><tspan x="318" dy="17.667">규칙을 찾아내는 힘</tspan></text></g><g ><g class="shape"><path d="M454 753h215v98H454z" class="stroke-B1 fill-B5 s0"/></g><text x="561.5" y="799.5" class="text-bold fill-N1 s2"><tspan x="561.5" dy="0">결정성 지식</tspan><tspan x="561.5" dy="18.5">쌓아 온 지식과 어휘</tspan></text></g><g ><g class="shape"><path d="M699 753h310v98H699z" class="stroke-B1 fill-B5 s0"/></g><text x="854" y="807.5" class="text-bold fill-N1 s2">작업기억</text></g><g ><g class="shape"><path d="M212 881h212v69H212z" class="stroke-B1 fill-B5 s0"/></g><text x="318" y="921" class="text-bold fill-N1 s2">처리 속도</text></g><g ><g class="shape"><path d="M454 881h215v69H454z" class="stroke-B1 fill-B5 s0"/></g><text x="561.5" y="921" class="text-bold fill-N1 s2">시공간 처리</text></g><text x="854" y="897" class="fill-N1 s2"><tspan x="854" dy="0">함께 움직이는 과제들을 묶어</tspan><tspan x="854" dy="17.25">이름을 붙인 층이다.</tspan><tspan x="854" dy="17.25">이 층이 실무에서 가장 많이 쓰인다 —</tspan><tspan x="854" dy="17.25">검사의 하위 점수가 이 층에 대응한다</tspan></text><g ><g class="shape"><path d="M40 243h319v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="199.5" y="281.5" class="text-bold fill-N1 s2"><tspan x="199.5" dy="0">하나의 일반 능력이 실제로 있고</tspan><tspan x="199.5" dy="18.5">그것이 상관을 만든다</tspan></text></g><g ><g class="shape"><path d="M419 235h383v98H419z" class="stroke-B1 fill-B5 s0"/></g><text x="610.5" y="273.5" class="text-bold fill-N1 s2"><tspan x="610.5" dy="0">여러 과정이 함께 발달하고</tspan><tspan x="610.5" dy="17.667">서로 돕기 때문에 상관이 생긴다.</tspan><tspan x="610.5" dy="17.667">공통 원인이 없어도 양의 상관은 나온다</tspan></text></g><g ><g class="shape"><path d="M862 235h329v98H862z" class="stroke-B1 fill-B5 s0"/></g><text x="1026.5" y="273.5" class="text-bold fill-N1 s2"><tspan x="1026.5" dy="0">표집과 검사 구성의 산물이다.</tspan><tspan x="1026.5" dy="17.667">어떤 과제를 넣느냐가</tspan><tspan x="1026.5" dy="17.667">g 가 무엇처럼 보이는지를 바꾼다</tspan></text></g><marker id="mk-d2-1068223443-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1068223443-3488378134)" d="M610.5 1347v-94" class="connection stroke-B1 s0" mask="url(#d2-1068223443)"/><path fill="none" marker-end="url(#mk-d2-1068223443-3488378134)" d="M610.5 1078.5v-95" class="connection stroke-B1 s0" mask="url(#d2-1068223443)"/><text x="611" y="1036" class="text-italic fill-N2 s2">묶는다</text><path fill="none" marker-end="url(#mk-d2-1068223443-3488378134)" d="M610.5 705.5v-116" class="connection stroke-B1 s0" mask="url(#d2-1068223443)"/><text x="611" y="652" class="text-italic fill-N2 s2">다시 묶는다</text><marker id="mk-d2-1068223443-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1068223443-2177206569)" d="M610.5 502.5v-136" class="connection" mask="url(#d2-1068223443)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><text x="611" y="439" class="text-italic fill-N2 s2">무엇의 이름인가</text><path fill="none" marker-end="url(#mk-d2-1068223443-3488378134)" d="M610.5 134V89" class="connection stroke-B1 s0" mask="url(#d2-1068223443)"/><mask id="d2-1068223443" width="1413" height="1679" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1413v1679H-91z"/><path d="M580 1020h62v21h-62zM559 636h104v21H559zM540 423h142v21H540z"/></mask></svg>