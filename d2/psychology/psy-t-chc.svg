<svg xmlns="http://www.w3.org/2000/svg" width="2063" height="1524" class="d2-2510856430 d2-svg" viewBox="-91 -101 2063 1524"><rect width="2063" height="1524" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2510856430 .fill-N1{fill:#0a0f25}.d2-2510856430 .fill-N2{fill:#676c7e}.d2-2510856430 .fill-B4{fill:#e3e9fd}.d2-2510856430 .fill-B5{fill:#edf0fd}.d2-2510856430 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M581 998h620v324H581z" class="stroke-B1 fill-B4 s0"/></g><text x="891" y="985" class="fill-N1 s1">맨 아래 — 관찰된 사실</text></g><g ><g class="shape"><path d="M66 679h1805v158H66z" class="stroke-B1 fill-B4 s0"/></g><text x="968.5" y="666" class="fill-N1 s1">가운데 — 넓은 능력들</text></g><g ><g class="shape"><path d="M721 456h340v82H721z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="891" y="494.5" class="text-bold fill-N1 s2"><tspan x="891" dy="0">맨 위 — g</tspan><tspan x="891" dy="18.5">모든 과제에 공통으로 들어가는 것</tspan></text></g><g ><g class="shape"><path d="M10 173h1771v142H10z" class="stroke-B1 fill-B4 s0"/></g><text x="895.5" y="160" class="fill-N1 s1">g 를 무엇으로 볼 것인가 — 여기가 논쟁이다</text></g><text x="891" y="16" class="fill-N1 s2"><tspan x="891" dy="0"> </tspan><tspan x="891" dy="17.667">읽을 때 조심할 것 — ‘g 가 있다’ 는 관찰이고 ‘g 가 무엇인가’ 는 해석이다.</tspan><tspan x="891" dy="17.667">앞의 것은 튼튼하고 뒤의 것은 다투어진다. 두 문장을 섞어 쓰면 관찰의 힘이 해석에 옮겨 붙는다</tspan></text><g ><g class="shape"><path d="M611 1210h560v82H611z" class="stroke-B1 fill-B5 s0"/></g><text x="891" y="1248.5" class="text-bold fill-N1 s2"><tspan x="891" dy="0">서로 다른 인지 과제의 점수들이 대체로 양의 상관을 이룬다.</tspan><tspan x="891" dy="18.5">어휘를 잘하는 사람이 도형 추론도 평균적으로 잘한다</tspan></text></g><g ><g class="shape"><path d="M629 1028h524v82H629z" class="stroke-B1 fill-B5 s0"/></g><text x="891" y="1066.5" class="text-bold fill-N1 s2"><tspan x="891" dy="0">이 패턴은 여러 표본 · 여러 검사에서 되풀이 관찰되었다.</tspan><tspan x="891" dy="18.5">이 자리까지는 다툼이 거의 없다</tspan></text></g><g ><g class="shape"><path d="M96 709h212v98H96z" class="stroke-B1 fill-B5 s0"/></g><text x="202" y="747.5" class="text-bold fill-N1 s2"><tspan x="202" dy="0">유동추론</tspan><tspan x="202" dy="17.667">처음 보는 문제에서</tspan><tspan x="202" dy="17.667">규칙을 찾아내는 힘</tspan></text></g><g ><g class="shape"><path d="M368 717h215v82H368z" class="stroke-B1 fill-B5 s0"/></g><text x="475.5" y="755.5" class="text-bold fill-N1 s2"><tspan x="475.5" dy="0">결정성 지식</tspan><tspan x="475.5" dy="18.5">쌓아 온 지식과 어휘</tspan></text></g><g ><g class="shape"><path d="M643 725h124v66H643z" class="stroke-B1 fill-B5 s0"/></g><text x="705" y="763.5" class="text-bold fill-N1 s2">작업기억</text></g><g ><g class="shape"><path d="M827 725h128v66H827z" class="stroke-B1 fill-B5 s0"/></g><text x="891" y="763.5" class="text-bold fill-N1 s2">처리 속도</text></g><g ><g class="shape"><path d="M1015 725h148v66h-148z" class="stroke-B1 fill-B5 s0"/></g><text x="1089" y="763.5" class="text-bold fill-N1 s2">시공간 처리</text></g><text x="1532" y="756" class="fill-N1 s2"><tspan x="1532" dy="0">함께 움직이는 과제들을 묶어 이름을 붙인 층이다.</tspan><tspan x="1532" dy="18.5">이 층이 실무에서 가장 많이 쓰인다 — 검사의 하위 점수가 이 층에 대응한다</tspan></text><g ><g class="shape"><path d="M40 211h511v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="295.5" y="249.5" class="text-bold fill-N1 s2">하나의 일반 능력이 실제로 있고 그것이 상관을 만든다</text></g><g ><g class="shape"><path d="M611 203h560v82H611z" class="stroke-B1 fill-B5 s0"/></g><text x="891" y="241.5" class="text-bold fill-N1 s2"><tspan x="891" dy="0">여러 과정이 함께 발달하고 서로 돕기 때문에 상관이 생긴다.</tspan><tspan x="891" dy="18.5">공통 원인이 없어도 양의 상관은 나온다</tspan></text></g><g ><g class="shape"><path d="M1231 203h520v82h-520z" class="stroke-B1 fill-B5 s0"/></g><text x="1491" y="241.5" class="text-bold fill-N1 s2"><tspan x="1491" dy="0">표집과 검사 구성의 산물이다.</tspan><tspan x="1491" dy="18.5">어떤 과제를 넣느냐가 g 가 무엇처럼 보이는지를 바꾼다</tspan></text></g><marker id="mk-d2-2510856430-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2510856430-3488378134)" d="M891 1208v-94" class="connection stroke-B1 s0" mask="url(#d2-2510856430)"/><path fill="none" marker-end="url(#mk-d2-2510856430-3488378134)" d="M891 955.5v-115" class="connection stroke-B1 s0" mask="url(#d2-2510856430)"/><text x="891" y="903" class="text-italic fill-N2 s2">묶는다</text><path fill="none" marker-end="url(#mk-d2-2510856430-3488378134)" d="M891 636.5v-95" class="connection stroke-B1 s0" mask="url(#d2-2510856430)"/><text x="891" y="594" class="text-italic fill-N2 s2">다시 묶는다</text><marker id="mk-d2-2510856430-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2510856430-2177206569)" d="M891 454.5v-136" class="connection" mask="url(#d2-2510856430)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><text x="891" y="391" class="text-italic fill-N2 s2">무엇의 이름인가</text><path fill="none" marker-end="url(#mk-d2-2510856430-3488378134)" d="M891 130V57" class="connection stroke-B1 s0" mask="url(#d2-2510856430)"/><mask id="d2-2510856430" width="2063" height="1524" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h2063v1524H-91z"/><path d="M860 887h62v21h-62zM839 578h104v21H839zM820 375h142v21H820z"/></mask></svg>