<svg xmlns="http://www.w3.org/2000/svg" width="1058" height="1597" class="d2-3858498384 d2-svg" viewBox="-91 -101 1058 1597"><rect width="1058" height="1597" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.d2-3858498384 .text-bold{font-weight:700}.d2-3858498384 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3858498384 .fill-N1{fill:#0a0f25}.d2-3858498384 .fill-N2{fill:#676c7e}.d2-3858498384 .fill-B4{fill:#e3e9fd}.d2-3858498384 .fill-B5{fill:#edf0fd}.d2-3858498384 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M33 1181h810v214H33z" class="stroke-B1 fill-B4 s0"/></g><text x="438" y="1214" class="fill-N1 s1">맨 아래 — 관찰된 사실</text></g><g ><g class="shape"><path d="M60 755h756v305H60z" class="stroke-B1 fill-B4 s0"/></g><text x="438" y="788" class="fill-N1 s1">가운데 — 넓은 능력들</text></g><g ><g class="shape"><path d="M268 552h340v82H268z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="438" y="590.5" class="text-bold fill-N1 s2"><tspan x="438" dy="0">맨 위 — g</tspan><tspan x="438" dy="18.5">모든 과제에 공통으로 들어가는 것</tspan></text></g><g ><g class="shape"><path d="M10 205h856v206H10z" class="stroke-B1 fill-B4 s0"/></g><text x="438" y="164" class="fill-N1 s1"><tspan x="438" dy="0">g 를 무엇으로 볼 것인가 —</tspan><tspan x="438" dy="32">여기가 논쟁이다</tspan></text></g><text x="438.5" y="16" class="fill-N1 s2"><tspan x="438.5" dy="0"> </tspan><tspan x="438.5" dy="17">읽을 때 조심할 것 —</tspan><tspan x="438.5" dy="17">‘g 가 있다’ 는 관찰이고 ‘g 가 무엇인가’ 는 해석이다.</tspan><tspan x="438.5" dy="17">앞의 것은 튼튼하고 뒤의 것은 다투어진다.</tspan><tspan x="438.5" dy="17">두 문장을 섞어 쓰면 관찰의 힘이 해석에 옮겨 붙는다</tspan></text><g ><g class="shape"><path d="M83 1231h319v114H83z" class="stroke-B1 fill-B5 s0"/></g><text x="242.5" y="1269.5" class="text-bold fill-N1 s2"><tspan x="242.5" dy="0">서로 다른 인지 과제의 점수들이</tspan><tspan x="242.5" dy="17.25">대체로 양의 상관을 이룬다.</tspan><tspan x="242.5" dy="17.25">어휘를 잘하는 사람이</tspan><tspan x="242.5" dy="17.25">도형 추론도 평균적으로 잘한다</tspan></text></g><g ><g class="shape"><path d="M452 1231h341v114H452z" class="stroke-B1 fill-B5 s0"/></g><text x="622.5" y="1277.5" class="text-bold fill-N1 s2"><tspan x="622.5" dy="0">이 패턴은 여러 표본 ·</tspan><tspan x="622.5" dy="17.667">여러 검사에서 되풀이 관찰되었다.</tspan><tspan x="622.5" dy="17.667">이 자리까지는 다툼이 거의 없다</tspan></text></g><g ><g class="shape"><path d="M90 801h212v98H90z" class="stroke-B1 fill-B5 s0"/></g><text x="196" y="839.5" class="text-bold fill-N1 s2"><tspan x="196" dy="0">유동추론</tspan><tspan x="196" dy="17.667">처음 보는 문제에서</tspan><tspan x="196" dy="17.667">규칙을 찾아내는 힘</tspan></text></g><g ><g class="shape"><path d="M332 801h215v98H332z" class="stroke-B1 fill-B5 s0"/></g><text x="439.5" y="847.5" class="text-bold fill-N1 s2"><tspan x="439.5" dy="0">결정성 지식</tspan><tspan x="439.5" dy="18.5">쌓아 온 지식과 어휘</tspan></text></g><g ><g class="shape"><path d="M577 801h209v98H577z" class="stroke-B1 fill-B5 s0"/></g><text x="681.5" y="855.5" class="text-bold fill-N1 s2">작업기억</text></g><g ><g class="shape"><path d="M90 929h212v101H90z" class="stroke-B1 fill-B5 s0"/></g><text x="196" y="985" class="text-bold fill-N1 s2">처리 속도</text></g><g ><g class="shape"><path d="M332 929h215v101H332z" class="stroke-B1 fill-B5 s0"/></g><text x="439.5" y="985" class="text-bold fill-N1 s2">시공간 처리</text></g><text x="681.5" y="945" class="fill-N1 s2"><tspan x="681.5" dy="0">함께 움직이는 과제들을</tspan><tspan x="681.5" dy="16.833">묶어 이름을 붙인 층이다.</tspan><tspan x="681.5" dy="16.833">이 층이 실무에서</tspan><tspan x="681.5" dy="16.833">가장 많이 쓰인다 —</tspan><tspan x="681.5" dy="16.833">검사의 하위 점수가</tspan><tspan x="681.5" dy="16.833">이 층에 대응한다</tspan></text><g ><g class="shape"><path d="M40 259h232v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="156" y="297.5" class="text-bold fill-N1 s2"><tspan x="156" dy="0">하나의 일반 능력이</tspan><tspan x="156" dy="17.667">실제로 있고</tspan><tspan x="156" dy="17.667">그것이 상관을 만든다</tspan></text></g><g ><g class="shape"><path d="M332 235h212v146H332z" class="stroke-B1 fill-B5 s0"/></g><text x="438" y="273.5" class="text-bold fill-N1 s2"><tspan x="438" dy="0">여러 과정이</tspan><tspan x="438" dy="16.833">함께 발달하고</tspan><tspan x="438" dy="16.833">서로 돕기 때문에</tspan><tspan x="438" dy="16.833">상관이 생긴다.</tspan><tspan x="438" dy="16.833">공통 원인이 없어도</tspan><tspan x="438" dy="16.833">양의 상관은 나온다</tspan></text></g><g ><g class="shape"><path d="M604 243h232v130H604z" class="stroke-B1 fill-B5 s0"/></g><text x="720" y="281.5" class="text-bold fill-N1 s2"><tspan x="720" dy="0">표집과 검사 구성의</tspan><tspan x="720" dy="17">산물이다.</tspan><tspan x="720" dy="17">어떤 과제를 넣느냐가</tspan><tspan x="720" dy="17">g 가 무엇처럼</tspan><tspan x="720" dy="17">보이는지를 바꾼다</tspan></text></g><marker id="mk-d2-3858498384-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3858498384-3488378134)" d="M403.5 1288h45" class="connection stroke-B1 s0" mask="url(#d2-3858498384)"/><path fill="none" marker-end="url(#mk-d2-3858498384-3488378134)" d="M438 1179.5v-116" class="connection stroke-B1 s0" mask="url(#d2-3858498384)"/><text x="438" y="1126" class="text-italic fill-N2 s2">묶는다</text><path fill="none" marker-end="url(#mk-d2-3858498384-3488378134)" d="M438 753.5v-116" class="connection stroke-B1 s0" mask="url(#d2-3858498384)"/><text x="438" y="700" class="text-italic fill-N2 s2">다시 묶는다</text><marker id="mk-d2-3858498384-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3858498384-2177206569)" d="M438 550.5v-136" class="connection" mask="url(#d2-3858498384)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><text x="438" y="487" class="text-italic fill-N2 s2">무엇의 이름인가</text><path fill="none" marker-end="url(#mk-d2-3858498384-3488378134)" d="M438 134V89" class="connection stroke-B1 s0" mask="url(#d2-3858498384)"/><mask id="d2-3858498384" width="1058" height="1597" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101H967v1597H-91z"/><path d="M407 1110h62v21h-62zM386 684h104v21H386zM367 471h142v21H367z"/></mask></svg>