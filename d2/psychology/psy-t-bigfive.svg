<svg xmlns="http://www.w3.org/2000/svg" width="1526" height="1860" class="d2-403615497 d2-svg" viewBox="-101 -101 1526 1860"><rect width="1526" height="1860" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-403615497 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-403615497 .fill-N1{fill:#0a0f25}.d2-403615497 .fill-B4{fill:#e3e9fd}.d2-403615497 .fill-B5{fill:#edf0fd}.d2-403615497 .stroke-B1,.d2-403615497 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="663" cy="121.5" class="shape stroke-B1" rx="365" ry="121.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="663" y="103" class="text-bold fill-N1 s0"><tspan x="663" dy="0">어휘 가설</tspan><tspan x="663" dy="17.25">사람들 사이의 중요한 차이는 말에 새겨져 있을 것이다.</tspan><tspan x="663" dy="17.25">그래서 사전에서 사람을 묘사하는 낱말을 모두 모아</tspan><tspan x="663" dy="17.25">서로 함께 움직이는 것끼리 묶는다</tspan></text></g><g ><g class="shape"><path d="M78 343h1170v414H78z" class="stroke-B1 fill-B4 s1"/></g><text x="663" y="376" class="fill-N1 s2">되풀이 나온 다섯 축</text></g><g ><g class="shape"><path d="M0 857h634v600H0z" class="stroke-B1 fill-B4 s1"/></g><text x="317" y="890" class="fill-N1 s2">이 다섯이 말하지 않는 것</text></g><g ><g class="shape"><path d="M694 910h630v494H694z" class="stroke-B1 fill-B4 s1"/></g><text x="1009" y="943" class="fill-N1 s2">아직 다투는 자리</text></g><text x="663" y="1573" class="fill-N1 s0"><tspan x="663" dy="0"> </tspan><tspan x="663" dy="16.833">이 문서의 등급 — 다수설이다.</tspan><tspan x="663" dy="16.833">성격을 재는 표준 틀로 널리 쓰이고</tspan><tspan x="663" dy="16.833">여러 언어에서 되풀이 나왔다.</tspan><tspan x="663" dy="16.833">다만 요인 수와 문화 보편성은 논쟁 중이므로</tspan><tspan x="663" dy="16.833">‘사람의 성격은 다섯 가지다’ 라고 적으면 안 된다</tspan></text><g ><g class="shape"><path d="M138 403h508v127H138z" class="stroke-B1 fill-B5 s1"/></g><text x="392" y="464" class="text-bold fill-N1 s0"><tspan x="392" dy="0">개방성 —</tspan><tspan x="392" dy="18.5">새로운 것 · 생각 · 예술 쪽으로 얼마나 기우는가</tspan></text></g><g ><g class="shape"><path d="M138 570h508v127H138z" class="stroke-B1 fill-B5 s1"/></g><text x="392" y="631" class="text-bold fill-N1 s0"><tspan x="392" dy="0">성실성 —</tspan><tspan x="392" dy="18.5">계획하고 지키고 미루지 않는 쪽으로 얼마나 기우는가</tspan></text></g><g ><g class="shape"><path d="M686 403h502v66H686z" class="stroke-B1 fill-B5 s1"/></g><text x="937" y="441.5" class="text-bold fill-N1 s0">외향성 — 사람과 자극이 있는 쪽으로 얼마나 기우는가</text></g><g ><g class="shape"><path d="M686 509h502v66H686z" class="stroke-B1 fill-B5 s1"/></g><text x="937" y="547.5" class="text-bold fill-N1 s0">우호성 — 남과 맞추고 믿는 쪽으로 얼마나 기우는가</text></g><g ><g class="shape"><path d="M686 615h502v82H686z" class="stroke-B1 fill-B5 s1"/></g><text x="937" y="653.5" class="text-bold fill-N1 s0"><tspan x="937" dy="0">신경증 성향 — 부정적인 정서를</tspan><tspan x="937" dy="18.5">얼마나 자주 세게 겪는가</tspan></text></g><g ><g class="shape"><path d="M60 917h514v98H60z" class="stroke-B1 fill-B5 s1"/></g><text x="317" y="955.5" class="text-bold fill-N1 s0"><tspan x="317" dy="0">사람의 종류가 다섯이라는 뜻이 아니다.</tspan><tspan x="317" dy="17.667">각 축이 연속된 점수이고 사람은</tspan><tspan x="317" dy="17.667">다섯 점수의 묶음으로 적힌다</tspan></text></g><g ><g class="shape"><path d="M60 1055h514v82H60z" class="stroke-B1 fill-B5 s1"/></g><text x="317" y="1093.5" class="text-bold fill-N1 s0"><tspan x="317" dy="0">무엇이 좋은 성격인지 말하지 않는다.</tspan><tspan x="317" dy="18.5">어느 쪽 끝이 유리한지는 그 사람이 놓인 자리가 정한다</tspan></text></g><g ><g class="shape"><path d="M60 1177h514v98H60z" class="stroke-B1 fill-B5 s1"/></g><text x="317" y="1215.5" class="text-bold fill-N1 s0"><tspan x="317" dy="0">왜 그런지 설명하지 않는다.</tspan><tspan x="317" dy="17.667">요인은 함께 움직이는 것들을</tspan><tspan x="317" dy="17.667">묶은 요약이지 원인이 아니다</tspan></text></g><g ><g class="shape"><path d="M60 1315h514v82H60z" class="stroke-B1 fill-B5 s1"/></g><text x="317" y="1353.5" class="text-bold fill-N1 s0"><tspan x="317" dy="0">한 상황에서의 행동을 잘 맞히지 않는다.</tspan><tspan x="317" dy="18.5">여러 상황 · 여러 시점을 합쳐야 관계가 드러난다</tspan></text></g><g ><g class="shape"><path d="M754 970h510v98H754z" class="stroke-B1 fill-B5 s1"/></g><text x="1009" y="1008.5" class="text-bold fill-N1 s0"><tspan x="1009" dy="0">요인이 몇 개인가.</tspan><tspan x="1009" dy="17.667">정직-겸손을 따로 세운</tspan><tspan x="1009" dy="17.667">여섯 요인 모형이 대안으로 제시되어 있다</tspan></text></g><g ><g class="shape"><path d="M754 1108h510v114H754z" class="stroke-B1 fill-B5 s1"/></g><text x="1009" y="1146.5" class="text-bold fill-N1 s0"><tspan x="1009" dy="0">이 다섯이 어디에서나 나오는가.</tspan><tspan x="1009" dy="17.25">큰 산업사회 표본에서는 잘 재현되지만,</tspan><tspan x="1009" dy="17.25">소규모 사회 표본에서</tspan><tspan x="1009" dy="17.25">다섯 구조가 나오지 않았다는 보고가 있다</tspan></text></g><g ><g class="shape"><path d="M754 1262h510v82H754z" class="stroke-B1 fill-B5 s1"/></g><text x="1009" y="1300.5" class="text-bold fill-N1 s0"><tspan x="1009" dy="0">요인은 자기보고 문항들의 구조인가 사람의 구조인가.</tspan><tspan x="1009" dy="18.5">자료가 문항에서 나왔다는 것을 잊으면 안 된다</tspan></text></g><marker id="mk-d2-403615497-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-403615497-3488378134)" d="M663 245v94" class="connection stroke-B1 s1" mask="url(#d2-403615497)"/><path fill="none" marker-end="url(#mk-d2-403615497-3488378134)" d="M382.397 758.196C330.4 797 317 817 317 853" class="connection stroke-B1 s1" mask="url(#d2-403615497)"/><path fill="none" marker-end="url(#mk-d2-403615497-3488378134)" d="M943.603 758.196C995.6 797 1009 827.6 1009 906" class="connection stroke-B1 s1" mask="url(#d2-403615497)"/><marker id="mk-d2-403615497-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-403615497-2177206569)" d="M317 1459c0 38 34.4 58 168.159 96.883" class="connection stroke-B2 s4" mask="url(#d2-403615497)"/><path fill="none" marker-end="url(#mk-d2-403615497-2177206569)" d="M1009 1406c0 80.4-34.4 111-168.159 149.883" class="connection stroke-B2 s4" mask="url(#d2-403615497)"/><mask id="d2-403615497" width="1526" height="1860" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1526v1860H-101z"/></mask></svg>