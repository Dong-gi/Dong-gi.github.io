<svg xmlns="http://www.w3.org/2000/svg" width="1283" height="1565" class="d2-2742880162 d2-svg" viewBox="-101 -101 1283 1565"><rect width="1283" height="1565" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2742880162 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2742880162 .fill-N1{fill:#0a0f25}.d2-2742880162 .fill-B4{fill:#e3e9fd}.d2-2742880162 .fill-B5{fill:#edf0fd}.d2-2742880162 .stroke-B1,.d2-2742880162 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="324.5" cy="84.5" class="shape stroke-B1" rx="324.5" ry="84.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="324.5" y="50" class="text-bold fill-N1 s0"><tspan x="324.5" dy="0">어휘 가설</tspan><tspan x="324.5" dy="16.833">사람들 사이의 중요한 차이는</tspan><tspan x="324.5" dy="16.833">말에 새겨져 있을 것이다.</tspan><tspan x="324.5" dy="16.833">그래서 사전에서 사람을</tspan><tspan x="324.5" dy="16.833">묘사하는 낱말을 모두 모아</tspan><tspan x="324.5" dy="16.833">서로 함께 움직이는 것끼리 묶는다</tspan></text></g><path fill="transparent" stroke="transparent" d="M709 0h372v169H709z" class="shape s1"/><g ><g class="shape"><path d="M0 229h649v638H0z" class="stroke-B1 fill-B4 s1"/></g><text x="324.5" y="262" class="fill-N1 s2">되풀이 나온 다섯 축</text></g><g ><g class="shape"><path d="M709 229h372v638H709z" class="stroke-B1 fill-B4 s1"/></g><text x="895" y="262" class="fill-N1 s2">아직 다투는 자리</text></g><g ><g class="shape"><path d="M0 927h649v436H0z" class="stroke-B1 fill-B4 s1"/></g><text x="324.5" y="960" class="fill-N1 s2">이 다섯이 말하지 않는 것</text></g><text x="833" y="943" class="fill-N1 s0"><tspan x="833" dy="0"> </tspan><tspan x="833" dy="16.455"> </tspan><tspan x="833" dy="16.455"> </tspan><tspan x="833" dy="16.455">이 문서의 등급 — 다수설이다.</tspan><tspan x="833" dy="16.455">성격을 재는 표준 틀로</tspan><tspan x="833" dy="16.455">널리 쓰이고 여러 언어에서</tspan><tspan x="833" dy="16.455">되풀이 나왔다.</tspan><tspan x="833" dy="16.455">다만 요인 수와 문화 보편성은</tspan><tspan x="833" dy="16.455">논쟁 중이므로</tspan><tspan x="833" dy="16.455">‘사람의 성격은 다섯 가지다’</tspan><tspan x="833" dy="16.455">라고 적으면 안 된다</tspan></text><g ><g class="shape"><path d="M60 289h212v114H60z" class="stroke-B1 fill-B5 s1"/></g><text x="166" y="327.5" class="text-bold fill-N1 s0"><tspan x="166" dy="0">개방성 —</tspan><tspan x="166" dy="17.25">새로운 것 · 생각 ·</tspan><tspan x="166" dy="17.25">예술 쪽으로</tspan><tspan x="166" dy="17.25">얼마나 기우는가</tspan></text></g><g ><g class="shape"><path d="M312 289h212v114H312z" class="stroke-B1 fill-B5 s1"/></g><text x="418" y="327.5" class="text-bold fill-N1 s0"><tspan x="418" dy="0">성실성 —</tspan><tspan x="418" dy="17.25">계획하고 지키고</tspan><tspan x="418" dy="17.25">미루지 않는 쪽으로</tspan><tspan x="418" dy="17.25">얼마나 기우는가</tspan></text></g><g ><g class="shape"><path d="M60 443h212v114H60z" class="stroke-B1 fill-B5 s1"/></g><text x="166" y="481.5" class="text-bold fill-N1 s0"><tspan x="166" dy="0">외향성 —</tspan><tspan x="166" dy="17.25">사람과 자극이 있는</tspan><tspan x="166" dy="17.25">쪽으로</tspan><tspan x="166" dy="17.25">얼마나 기우는가</tspan></text></g><g ><g class="shape"><path d="M312 443h212v114H312z" class="stroke-B1 fill-B5 s1"/></g><text x="418" y="481.5" class="text-bold fill-N1 s0"><tspan x="418" dy="0">우호성 —</tspan><tspan x="418" dy="17.25">남과 맞추고</tspan><tspan x="418" dy="17.25">믿는 쪽으로</tspan><tspan x="418" dy="17.25">얼마나 기우는가</tspan></text></g><g ><g class="shape"><path d="M60 597h212v114H60z" class="stroke-B1 fill-B5 s1"/></g><text x="166" y="635.5" class="text-bold fill-N1 s0"><tspan x="166" dy="0">신경증 성향 —</tspan><tspan x="166" dy="17.25">부정적인 정서를</tspan><tspan x="166" dy="17.25">얼마나 자주</tspan><tspan x="166" dy="17.25">세게 겪는가</tspan></text></g><g ><g class="shape"><path d="M60 987h257v146H60z" class="stroke-B1 fill-B5 s1"/></g><text x="188.5" y="1025.5" class="text-bold fill-N1 s0"><tspan x="188.5" dy="0">사람의 종류가</tspan><tspan x="188.5" dy="16.833">다섯이라는 뜻이 아니다.</tspan><tspan x="188.5" dy="16.833">각 축이 연속된</tspan><tspan x="188.5" dy="16.833">점수이고 사람은</tspan><tspan x="188.5" dy="16.833">다섯 점수의 묶음으로</tspan><tspan x="188.5" dy="16.833">적힌다</tspan></text></g><g ><g class="shape"><path d="M357 987h232v146H357z" class="stroke-B1 fill-B5 s1"/></g><text x="473" y="1033.5" class="text-bold fill-N1 s0"><tspan x="473" dy="0">무엇이 좋은 성격인지</tspan><tspan x="473" dy="17">말하지 않는다.</tspan><tspan x="473" dy="17">어느 쪽 끝이</tspan><tspan x="473" dy="17">유리한지는 그 사람이</tspan><tspan x="473" dy="17">놓인 자리가 정한다</tspan></text></g><g ><g class="shape"><path d="M60 1173h257v130H60z" class="stroke-B1 fill-B5 s1"/></g><text x="188.5" y="1211.5" class="text-bold fill-N1 s0"><tspan x="188.5" dy="0">왜 그런지</tspan><tspan x="188.5" dy="17">설명하지 않는다.</tspan><tspan x="188.5" dy="17">요인은 함께 움직이는</tspan><tspan x="188.5" dy="17">것들을 묶은 요약이지</tspan><tspan x="188.5" dy="17">원인이 아니다</tspan></text></g><g ><g class="shape"><path d="M357 1173h232v130H357z" class="stroke-B1 fill-B5 s1"/></g><text x="473" y="1211.5" class="text-bold fill-N1 s0"><tspan x="473" dy="0">한 상황에서의 행동을</tspan><tspan x="473" dy="17">잘 맞히지 않는다.</tspan><tspan x="473" dy="17">여러 상황 ·</tspan><tspan x="473" dy="17">여러 시점을 합쳐야</tspan><tspan x="473" dy="17">관계가 드러난다</tspan></text></g><g ><g class="shape"><path d="M769 289h252v114H769z" class="stroke-B1 fill-B5 s1"/></g><text x="895" y="327.5" class="text-bold fill-N1 s0"><tspan x="895" dy="0">요인이 몇 개인가.</tspan><tspan x="895" dy="17.25">정직-겸손을 따로 세운</tspan><tspan x="895" dy="17.25">여섯 요인 모형이</tspan><tspan x="895" dy="17.25">대안으로 제시되어 있다</tspan></text></g><g ><g class="shape"><path d="M769 443h252v178H769z" class="stroke-B1 fill-B5 s1"/></g><text x="895" y="481.5" class="text-bold fill-N1 s0"><tspan x="895" dy="0">이 다섯이</tspan><tspan x="895" dy="16.625">어디에서나 나오는가.</tspan><tspan x="895" dy="16.625">큰 산업사회 표본에서는</tspan><tspan x="895" dy="16.625">잘 재현되지만,</tspan><tspan x="895" dy="16.625">소규모 사회 표본에서</tspan><tspan x="895" dy="16.625">다섯 구조가</tspan><tspan x="895" dy="16.625">나오지 않았다는</tspan><tspan x="895" dy="16.625">보고가 있다</tspan></text></g><g ><g class="shape"><path d="M769 661h252v146H769z" class="stroke-B1 fill-B5 s1"/></g><text x="895" y="699.5" class="text-bold fill-N1 s0"><tspan x="895" dy="0">요인은 자기보고</tspan><tspan x="895" dy="16.833">문항들의 구조인가</tspan><tspan x="895" dy="16.833">사람의 구조인가.</tspan><tspan x="895" dy="16.833">자료가 문항에서</tspan><tspan x="895" dy="16.833">나왔다는 것을</tspan><tspan x="895" dy="16.833">잊으면 안 된다</tspan></text></g><marker id="mk-d2-2742880162-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2742880162-3488378134)" d="M325 171v54" class="connection stroke-B1 s1" mask="url(#d2-2742880162)"/><path fill="none" marker-end="url(#mk-d2-2742880162-3488378134)" d="M324.5 869v54" class="connection stroke-B1 s1" mask="url(#d2-2742880162)"/><path fill="none" marker-end="url(#mk-d2-2742880162-3488378134)" d="M651 548h54" class="connection stroke-B1 s1" mask="url(#d2-2742880162)"/><marker id="mk-d2-2742880162-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2742880162-2177206569)" d="M651 1145h54" class="connection stroke-B2 s4" mask="url(#d2-2742880162)"/><path fill="none" marker-end="url(#mk-d2-2742880162-2177206569)" d="M895 869v54" class="connection stroke-B2 s4" mask="url(#d2-2742880162)"/><mask id="d2-2742880162" width="1283" height="1565" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1283v1565H-101z"/></mask></svg>