<svg xmlns="http://www.w3.org/2000/svg" width="3409" height="1338" class="d2-1303249952 d2-svg" viewBox="-101 -85 3409 1338"><rect width="3409" height="1338" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1303249952 .fill-N1{fill:#0a0f25}.d2-1303249952 .fill-B4{fill:#e3e9fd}.d2-1303249952 .fill-B5{fill:#edf0fd}.d2-1303249952 .stroke-B1,.d2-1303249952 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="365" cy="694.5" class="shape stroke-B1" rx="365" ry="121.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="365" y="676" class="text-bold fill-N1 s0"><tspan x="365" dy="0">어휘 가설</tspan><tspan x="365" dy="17.25">사람들 사이의 중요한 차이는 말에 새겨져 있을 것이다.</tspan><tspan x="365" dy="17.25">그래서 사전에서 사람을 묘사하는 낱말을 모두 모아</tspan><tspan x="365" dy="17.25">서로 함께 움직이는 것끼리 묶는다</tspan></text></g><g ><g class="shape"><path d="M850 285h646v809H850z" class="stroke-B1 fill-B4 s1"/></g><text x="1173" y="272" class="fill-N1 s2">되풀이 나온 다섯 축</text></g><g ><g class="shape"><path d="M1649 56h635v568h-635z" class="stroke-B1 fill-B4 s1"/></g><text x="1966.5" y="43" class="fill-N1 s2">이 다섯이 말하지 않는 것</text></g><g ><g class="shape"><path d="M1636 710h660v442h-660z" class="stroke-B1 fill-B4 s1"/></g><text x="1966" y="697" class="fill-N1 s2">아직 다투는 자리</text></g><text x="2811.5" y="684" class="fill-N1 s0"><tspan x="2811.5" dy="0"> </tspan><tspan x="2811.5" dy="17.667">이 문서의 등급 — 다수설이다. 성격을 재는 표준 틀로 널리 쓰이고 여러 언어에서 되풀이 나왔다.</tspan><tspan x="2811.5" dy="17.667">다만 요인 수와 문화 보편성은 논쟁 중이므로 ‘사람의 성격은 다섯 가지다’ 라고 적으면 안 된다</tspan></text><g ><g class="shape"><path d="M913 315h521v66H913z" class="stroke-B1 fill-B5 s1"/></g><text x="1173.5" y="353.5" class="text-bold fill-N1 s0">개방성 — 새로운 것 · 생각 · 예술 쪽으로 얼마나 기우는가</text></g><g ><g class="shape"><path d="M880 441h586v66H880z" class="stroke-B1 fill-B5 s1"/></g><text x="1173" y="479.5" class="text-bold fill-N1 s0">성실성 — 계획하고 지키고 미루지 않는 쪽으로 얼마나 기우는가</text></g><g ><g class="shape"><path d="M922 661h502v66H922z" class="stroke-B1 fill-B5 s1"/></g><text x="1173" y="699.5" class="text-bold fill-N1 s0">외향성 — 사람과 자극이 있는 쪽으로 얼마나 기우는가</text></g><g ><g class="shape"><path d="M932 872h482v66H932z" class="stroke-B1 fill-B5 s1"/></g><text x="1173" y="910.5" class="text-bold fill-N1 s0">우호성 — 남과 맞추고 믿는 쪽으로 얼마나 기우는가</text></g><g ><g class="shape"><path d="M911 998h525v66H911z" class="stroke-B1 fill-B5 s1"/></g><text x="1173.5" y="1036.5" class="text-bold fill-N1 s0">신경증 성향 — 부정적인 정서를 얼마나 자주 세게 겪는가</text></g><g ><g class="shape"><path d="M1679 86h575v82h-575z" class="stroke-B1 fill-B5 s1"/></g><text x="1966.5" y="124.5" class="text-bold fill-N1 s0"><tspan x="1966.5" dy="0">사람의 종류가 다섯이라는 뜻이 아니다.</tspan><tspan x="1966.5" dy="18.5">각 축이 연속된 점수이고 사람은 다섯 점수의 묶음으로 적힌다</tspan></text></g><g ><g class="shape"><path d="M1709 228h514v82h-514z" class="stroke-B1 fill-B5 s1"/></g><text x="1966" y="266.5" class="text-bold fill-N1 s0"><tspan x="1966" dy="0">무엇이 좋은 성격인지 말하지 않는다.</tspan><tspan x="1966" dy="18.5">어느 쪽 끝이 유리한지는 그 사람이 놓인 자리가 정한다</tspan></text></g><g ><g class="shape"><path d="M1691 370h551v82h-551z" class="stroke-B1 fill-B5 s1"/></g><text x="1966.5" y="408.5" class="text-bold fill-N1 s0"><tspan x="1966.5" dy="0">왜 그런지 설명하지 않는다.</tspan><tspan x="1966.5" dy="18.5">요인은 함께 움직이는 것들을 묶은 요약이지 원인이 아니다</tspan></text></g><g ><g class="shape"><path d="M1739 512h455v82h-455z" class="stroke-B1 fill-B5 s1"/></g><text x="1966.5" y="550.5" class="text-bold fill-N1 s0"><tspan x="1966.5" dy="0">한 상황에서의 행동을 잘 맞히지 않는다.</tspan><tspan x="1966.5" dy="18.5">여러 상황 · 여러 시점을 합쳐야 관계가 드러난다</tspan></text></g><g ><g class="shape"><path d="M1666 740h600v82h-600z" class="stroke-B1 fill-B5 s1"/></g><text x="1966" y="778.5" class="text-bold fill-N1 s0"><tspan x="1966" dy="0">요인이 몇 개인가.</tspan><tspan x="1966" dy="18.5">정직-겸손을 따로 세운 여섯 요인 모형이 대안으로 제시되어 있다</tspan></text></g><g ><g class="shape"><path d="M1678 882h577v98h-577z" class="stroke-B1 fill-B5 s1"/></g><text x="1966.5" y="920.5" class="text-bold fill-N1 s0"><tspan x="1966.5" dy="0">이 다섯이 어디에서나 나오는가.</tspan><tspan x="1966.5" dy="17.667">큰 산업사회 표본에서는 잘 재현되지만, 소규모 사회 표본에서</tspan><tspan x="1966.5" dy="17.667">다섯 구조가 나오지 않았다는 보고가 있다</tspan></text></g><g ><g class="shape"><path d="M1711 1040h510v82h-510z" class="stroke-B1 fill-B5 s1"/></g><text x="1966" y="1078.5" class="text-bold fill-N1 s0"><tspan x="1966" dy="0">요인은 자기보고 문항들의 구조인가 사람의 구조인가.</tspan><tspan x="1966" dy="18.5">자료가 문항에서 나왔다는 것을 잊으면 안 된다</tspan></text></g><marker id="mk-d2-1303249952-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1303249952-3488378134)" d="M732 694h114" class="connection stroke-B1 s1" mask="url(#d2-1303249952)"/><path fill="none" marker-end="url(#mk-d2-1303249952-3488378134)" d="M1498 457h147" class="connection stroke-B1 s1" mask="url(#d2-1303249952)"/><path fill="none" marker-end="url(#mk-d2-1303249952-3488378134)" d="M1498 931h134" class="connection stroke-B1 s1" mask="url(#d2-1303249952)"/><marker id="mk-d2-1303249952-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1303249952-2177206569)" d="M2286 457c63.6 0 159.137 42.1 472.155 208.621" class="connection stroke-B2 s4" mask="url(#d2-1303249952)"/><path fill="none" marker-end="url(#mk-d2-1303249952-2177206569)" d="M2298 931c54 0 147-42 459.468-208.122" class="connection stroke-B2 s4" mask="url(#d2-1303249952)"/><mask id="d2-1303249952" width="3409" height="1338" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h3409v1338H-101z"/></mask></svg>