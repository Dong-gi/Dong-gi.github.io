<svg xmlns="http://www.w3.org/2000/svg" width="1069" height="2436" class="d2-879997503 d2-svg" viewBox="-91 -121 1069 2436"><rect width="1069" height="2436" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-879997503 .fill-N1{fill:#0a0f25}.d2-879997503 .fill-B4{fill:#e3e9fd}.d2-879997503 .fill-B5{fill:#edf0fd}.d2-879997503 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M10 20h867v688H10z" class="stroke-B1 fill-B4 s0"/></g><text x="443.5" y="7" class="fill-N1 s1">비교적 확인된 것</text></g><g ><g class="shape"><path d="M42 848h803v736H42z" class="stroke-B1 fill-B4 s0"/></g><text x="443.5" y="835" class="fill-N1 s1">크게 흔들린 것 — 이중언어의 일반적 인지 이점</text></g><g ><g class="shape"><path d="M43 1724h801v490H43z" class="stroke-B1 fill-B4 s0"/></g><text x="443.5" y="1711" class="fill-N1 s1">이 문서가 적는 방식</text></g><g ><g class="shape"><path d="M123 50h642v82H123z" class="stroke-B1 fill-B5 s0"/></g><text x="444" y="88.5" class="text-bold fill-N1 s2"><tspan x="444" dy="0">두 언어를 함께 배우는 것이 언어 발달을 해친다는 근거는 없다.</tspan><tspan x="444" dy="18.5">두 언어의 이정표는 대체로 한 언어를 배우는 아이와 같은 순서로 온다</tspan></text></g><g ><g class="shape"><path d="M140 232h607v82H140z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="270.5" class="text-bold fill-N1 s2"><tspan x="443.5" dy="0">한 언어의 어휘만 따로 세면 단일언어 아이보다 적게 나올 수 있다.</tspan><tspan x="443.5" dy="18.5">두 언어를 합쳐 세면 그 차이가 사라진다 — 세는 단위의 문제다</tspan></text></g><g ><g class="shape"><path d="M155 414h577v82H155z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="452.5" class="text-bold fill-N1 s2"><tspan x="443.5" dy="0">말하다가 언어를 바꾸는 것은 뒤섞임이 아니라 규칙을 따른다.</tspan><tspan x="443.5" dy="18.5">어디서 바꿀 수 있고 어디서 바꿀 수 없는지에 규칙성이 있다</tspan></text></g><g ><g class="shape"><path d="M40 596h807v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="634.5" class="text-bold fill-N1 s2"><tspan x="443.5" dy="0">쓰지 않는 쪽 언어가 완전히 꺼져 있지 않다.</tspan><tspan x="443.5" dy="18.5">한 언어로 말하는 동안에도 다른 언어가 함께 활성화된다는 결과가 여러 절차에서 나왔다</tspan></text></g><g ><g class="shape"><path d="M156 878h575v82H156z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="916.5" class="text-bold fill-N1 s2"><tspan x="443.5" dy="0">주장 — 두 언어를 늘 다루느라 주의를 통제하는 힘이 길러지고,</tspan><tspan x="443.5" dy="18.5">그 이점이 언어와 상관없는 과제에도 나타난다</tspan></text></g><g ><g class="shape"><path d="M74 1060h739v82H74z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="1098.5" class="text-bold fill-N1 s2"><tspan x="443.5" dy="0">무슨 일이 있었나 — 2000년대에 널리 퍼진 뒤, 표본이 큰 연구와 사전등록 연구에서</tspan><tspan x="443.5" dy="18.5">효과가 나오지 않는 경우가 이어졌다</tspan></text></g><g ><g class="shape"><path d="M114 1242h659v98H114z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="1280.5" class="text-bold fill-N1 s2"><tspan x="443.5" dy="0">출판 편향의 흔적도 보고되었다 —</tspan><tspan x="443.5" dy="17.667">학회에서 발표된 연구 가운데 이점을 지지한 쪽이 지지하지 않은 쪽보다</tspan><tspan x="443.5" dy="17.667">논문으로 실린 비율이 높았다는 분석이 있다</tspan></text></g><g ><g class="shape"><path d="M72 1440h743v114H72z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="1478.5" class="text-bold fill-N1 s2"><tspan x="443.5" dy="0">가장 강한 형태의 반론(이점을 지지하는 쪽) —</tspan><tspan x="443.5" dy="17.25">효과가 있다면 특정 조건에서만 나타날 것이고(두 언어를 늘 오가며 쓰는 환경 등),</tspan><tspan x="443.5" dy="17.25">‘집행기능’ 이라는 이름 아래 묶인 과제들이 실은 서로 다른 것을 재고 있어서</tspan><tspan x="443.5" dy="17.25">묶어 분석하면 효과가 씻겨 나간다는 것</tspan></text></g><g ><g class="shape"><path d="M133 1754h621v82H133z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="1792.5" class="text-bold fill-N1 s2"><tspan x="443.5" dy="0">‘이중언어에 일반적인 인지 이점이 있다’ 를 사실로 적지 않는다.</tspan><tspan x="443.5" dy="18.5">크게 흔들린 주장이므로 그 사실이 서술의 주어가 된다 — 6장의 규칙</tspan></text></g><g ><g class="shape"><path d="M131 1936h625v66H131z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="1974.5" class="text-bold fill-N1 s2">동시에 ‘이중언어가 해롭다’ 도 적지 않는다. 그쪽 역시 근거가 없다</text></g><g ><g class="shape"><path d="M73 2102h741v82H73z" class="stroke-B1 fill-B5 s0"/></g><text x="443.5" y="2140.5" class="text-bold fill-N1 s2"><tspan x="443.5" dy="0">확실히 말할 수 있는 것은 위의 칸이다. 그리고 두 언어를 쓸 줄 아는 것의 값어치는</tspan><tspan x="443.5" dy="18.5">인지 과제 점수와 별개로 이미 충분히 크다</tspan></text></g><marker id="mk-d2-879997503-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-879997503-3488378134)" d="M443.5 134v94" class="connection stroke-B1 s0" mask="url(#d2-879997503)"/><path fill="none" marker-end="url(#mk-d2-879997503-3488378134)" d="M443.5 316v94" class="connection stroke-B1 s0" mask="url(#d2-879997503)"/><path fill="none" marker-end="url(#mk-d2-879997503-3488378134)" d="M443.5 498v94" class="connection stroke-B1 s0" mask="url(#d2-879997503)"/><path fill="none" marker-end="url(#mk-d2-879997503-3488378134)" d="M443.5 962v94" class="connection stroke-B1 s0" mask="url(#d2-879997503)"/><path fill="none" marker-end="url(#mk-d2-879997503-3488378134)" d="M443.5 1144v94" class="connection stroke-B1 s0" mask="url(#d2-879997503)"/><path fill="none" marker-end="url(#mk-d2-879997503-3488378134)" d="M443.5 1342v94" class="connection stroke-B1 s0" mask="url(#d2-879997503)"/><marker id="mk-d2-879997503-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-879997503-2177206569)" d="M443.5 710v93" class="connection" mask="url(#d2-879997503)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><path fill="none" marker-end="url(#mk-d2-879997503-3488378134)" d="M443.5 1838v94" class="connection stroke-B1 s0" mask="url(#d2-879997503)"/><path fill="none" marker-end="url(#mk-d2-879997503-3488378134)" d="M443.5 2004v94" class="connection stroke-B1 s0" mask="url(#d2-879997503)"/><path fill="none" marker-end="url(#mk-d2-879997503-3488378134)" d="M443.5 1586v93" class="connection stroke-B1 s0" mask="url(#d2-879997503)"/><mask id="d2-879997503" width="1069" height="2436" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121H978v2436H-91z"/></mask></svg>