<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1576" class="d2-251675157 d2-svg" viewBox="-101 -101 1340 1576"><rect width="1340" height="1576" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-251675157 .text-bold{font-weight:700}.d2-251675157 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-251675157 .fill-N1{fill:#0a0f25}.d2-251675157 .fill-N2{fill:#676c7e}.d2-251675157 .fill-B4{fill:#e3e9fd}.d2-251675157 .fill-B5{fill:#edf0fd}.d2-251675157 .fill-B6{fill:#f7f8fe}.d2-251675157 .stroke-B1,.d2-251675157 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><path fill="transparent" stroke="transparent" d="M0 0h223v104H0z" class="shape s0"/><g ><g class="shape"><ellipse cx="606.5" cy="52" class="shape stroke-B1 fill-B6 s0" rx="323.5" ry="52"/></g><text x="606.5" y="41.5" class="text-bold fill-N1 s1"><tspan x="606.5" dy="0">바깥 세상</tspan><tspan x="606.5" dy="17.667">(우리가 직접</tspan><tspan x="606.5" dy="17.667">닿을 수 없는 것)</tspan></text></g><path fill="transparent" stroke="transparent" d="M990 0h148v104H990z" class="shape s0"/><text x="111.5" y="170" class="fill-N1 s1"><tspan x="111.5" dy="0">여기서 정보가 줄어든다.</tspan><tspan x="111.5" dy="16.833">3차원이 2차원으로 눌리고,</tspan><tspan x="111.5" dy="16.833">물체의 색과 조명의 색이</tspan><tspan x="111.5" dy="16.833">한 값으로 섞이고,</tspan><tspan x="111.5" dy="16.833">여러 소리가</tspan><tspan x="111.5" dy="16.833">하나의 파형으로 합쳐진다</tspan></text><g ><g class="shape"><path d="M283 154h647v114H283z" class="stroke-B1 fill-B6 s0"/></g><text x="606.5" y="192.5" class="text-bold fill-N1 s1"><tspan x="606.5" dy="0">감각 표면에 맺힌 것</tspan><tspan x="606.5" dy="17.25">망막의 2차원 상 ·</tspan><tspan x="606.5" dy="17.25">두 귀에 닿은 압력 변화 ·</tspan><tspan x="606.5" dy="17.25">피부에 눌린 자국</tspan></text></g><path fill="transparent" stroke="transparent" d="M990 154h148v114H990z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M0 318h223v306H0z" class="shape s0"/><g ><g class="shape"><path d="M283 318h647v306H283z" class="stroke-B1 fill-B4 s0"/></g><text x="606.5" y="351" class="fill-N1 s2"><tspan x="606.5" dy="0">같은 감각 입력을</tspan><tspan x="606.5" dy="32">낼 수 있는 바깥 세상</tspan></text></g><path fill="transparent" stroke="transparent" d="M990 318h148v306H990z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M0 674h223v305H0z" class="shape s0"/><g ><g class="shape"><path d="M283 674h647v305H283z" class="stroke-B1 fill-B4 s0"/></g><text x="606.5" y="707" class="fill-N1 s2">고르기를 정하는 전제</text></g><path fill="transparent" stroke="transparent" d="M990 674h148v305H990z" class="shape s0"/><g ><g class="shape"><path d="M0 1029h223v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="111.5" y="1075.5" class="text-bold fill-N1 s1"><tspan x="111.5" dy="0">상향 처리</tspan><tspan x="111.5" dy="17.667">감각 입력에서</tspan><tspan x="111.5" dy="17.667">올라오는 것</tspan></text></g><g ><g class="shape"><ellipse cx="606.5" cy="1086" class="shape stroke-B1 fill-B6 s0" rx="323.5" ry="57"/></g><text x="606.5" y="1083.5" class="text-bold fill-N1 s1"><tspan x="606.5" dy="0">지각 —</tspan><tspan x="606.5" dy="18.5">하나로 정해진 결과</tspan></text></g><g ><g class="shape"><path d="M990 1029h148v114H990z" class="stroke-B1 fill-B6 s0"/></g><text x="1064" y="1067.5" class="text-bold fill-N1 s1"><tspan x="1064" dy="0">하향 처리</tspan><tspan x="1064" dy="17.25">전제 · 맥락 ·</tspan><tspan x="1064" dy="17.25">아는 것에서</tspan><tspan x="1064" dy="17.25">내려오는 것</tspan></text></g><path fill="transparent" stroke="transparent" d="M0 1193h223v181H0z" class="shape s0"/><text x="498.5" y="1209" class="fill-N1 s1"><tspan x="498.5" dy="0"> </tspan><tspan x="498.5" dy="16.455">착시가 하는 일 — 전제가 틀리도록 짜 놓은 자극이다.</tspan><tspan x="498.5" dy="16.455"> </tspan><tspan x="498.5" dy="16.455">그래서 착시는 지각 체계의 고장이 아니라</tspan><tspan x="498.5" dy="16.455">이 그림이 맞다는 증거다.</tspan><tspan x="498.5" dy="16.455">전제 없이 고르는 체계라면</tspan><tspan x="498.5" dy="16.455">애초에 어긋날 자리가 없다.</tspan><tspan x="498.5" dy="16.455"> </tspan><tspan x="498.5" dy="16.455">그리고 착시는 알고 나서도 사라지지 않는다.</tspan><tspan x="498.5" dy="16.455">이 고르기가 우리가 믿는 것과</tspan><tspan x="498.5" dy="16.455">따로 돌아간다는 뜻이다</tspan></text><g ><g class="shape"><path d="M343 392h215v66H343z" class="stroke-B1 fill-B5 s0"/></g><text x="450.5" y="430.5" class="text-bold fill-N1 s1">가까이 있는 작은 것</text></g><g ><g class="shape"><path d="M598 392h174v66H598z" class="stroke-B1 fill-B5 s0"/></g><text x="685" y="430.5" class="text-bold fill-N1 s1">멀리 있는 큰 것</text></g><g ><g class="shape"><path d="M343 498h215v66H343z" class="stroke-B1 fill-B5 s0"/></g><text x="450.5" y="536.5" class="text-bold fill-N1 s1">기울어진 어떤 것</text></g><g ><g class="shape"><path d="M598 498h174v66H598z" class="stroke-B2 fill-B5 s3"/></g><text x="685" y="536.5" class="text-bold fill-N1 s1">…무한히 많다</text></g><g ><g class="shape"><path d="M313 720h168v98H313z" class="stroke-B1 fill-B5 s0"/></g><text x="397" y="766.5" class="text-bold fill-N1 s1"><tspan x="397" dy="0">빛은 대개</tspan><tspan x="397" dy="18.5">위에서 온다</tspan></text></g><g ><g class="shape"><path d="M511 720h188v98H511z" class="stroke-B1 fill-B5 s0"/></g><text x="605" y="758.5" class="text-bold fill-N1 s1"><tspan x="605" dy="0">물체는 대개</tspan><tspan x="605" dy="17.667">단단하고 모양이</tspan><tspan x="605" dy="17.667">변하지 않는다</tspan></text></g><g ><g class="shape"><path d="M729 720h171v98H729z" class="stroke-B1 fill-B5 s0"/></g><text x="814.5" y="766.5" class="text-bold fill-N1 s1"><tspan x="814.5" dy="0">가까운 것이</tspan><tspan x="814.5" dy="18.5">먼 것을 가린다</tspan></text></g><g ><g class="shape"><path d="M313 848h168v101H313z" class="stroke-B1 fill-B5 s0"/></g><text x="397" y="888" class="text-bold fill-N1 s1"><tspan x="397" dy="0">같은 결은</tspan><tspan x="397" dy="17.667">멀수록</tspan><tspan x="397" dy="17.667">촘촘해 보인다</tspan></text></g><text x="595.5" y="864" class="fill-N1 s1"><tspan x="595.5" dy="0">이 전제들은</tspan><tspan x="595.5" dy="16.833">배워서 아는 것도</tspan><tspan x="595.5" dy="16.833">있고 아닌 것도 있다.</tspan><tspan x="595.5" dy="16.833">어느 쪽인지는</tspan><tspan x="595.5" dy="16.833">사안마다 다르고</tspan><tspan x="595.5" dy="16.833">다 정해지지 않았다</tspan></text><marker id="mk-d2-251675157-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-251675157-3488378134)" d="M607 106v44" class="connection stroke-B1 s0" mask="url(#d2-251675157)"/><text x="607.5" y="135" class="text-italic fill-N2 s1">빛 · 소리 · 압력</text><marker id="mk-d2-251675157-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-251675157-2177206569)" d="M281.5 211h-55" class="connection stroke-B2 s3" mask="url(#d2-251675157)"/><path fill="none" marker-end="url(#mk-d2-251675157-3488378134)" d="M606.5 270v44" class="connection stroke-B1 s0" mask="url(#d2-251675157)"/><text x="606.5" y="299" class="text-italic fill-N2 s1">하나로 정해지지 않는다</text><path fill="none" marker-end="url(#mk-d2-251675157-3488378134)" d="M606.5 625.5v45" class="connection stroke-B1 s0" mask="url(#d2-251675157)"/><text x="607" y="655" class="text-italic fill-N2 s1">무엇으로 고르는가</text><path fill="none" marker-end="url(#mk-d2-251675157-3488378134)" d="m606.52 981 .44 44" class="connection stroke-B1 s0" mask="url(#d2-251675157)"/><path fill="none" marker-end="url(#mk-d2-251675157-2177206569)" d="M224.5 1086H279" class="connection stroke-B2 s3" mask="url(#d2-251675157)"/><path fill="none" marker-end="url(#mk-d2-251675157-2177206569)" d="M988.5 1086H934" class="connection stroke-B2 s3" mask="url(#d2-251675157)"/><path fill="none" marker-end="url(#mk-d2-251675157-2177206569)" d="M607 1145v44" class="connection stroke-B2 s3" mask="url(#d2-251675157)"/><mask id="d2-251675157" width="1340" height="1576" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1340v1576H-101z"/><path d="M547 119h121v21H547zM505 283h203v21H505zM526 639h162v21H526z"/></mask></svg>