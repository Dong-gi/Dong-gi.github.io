<svg xmlns="http://www.w3.org/2000/svg" width="1621" height="1938" class="d2-2544508512 d2-svg" viewBox="-101 -101 1621 1938"><rect width="1621" height="1938" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2544508512 .text-bold{font-weight:700}.d2-2544508512 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2544508512 .fill-N1{fill:#0a0f25}.d2-2544508512 .fill-N2{fill:#676c7e}.d2-2544508512 .fill-B4{fill:#e3e9fd}.d2-2544508512 .fill-B5{fill:#edf0fd}.d2-2544508512 .fill-B6{fill:#f7f8fe}.d2-2544508512 .stroke-B1,.d2-2544508512 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><path fill="transparent" stroke="transparent" d="M0 0h357v139H0z" class="shape s0"/><g ><g class="shape"><ellipse cx="708.5" cy="69.5" class="shape stroke-B1 fill-B6 s0" rx="291.5" ry="69.5"/></g><text x="708.5" y="67" class="text-bold fill-N1 s1"><tspan x="708.5" dy="0">바깥 세상</tspan><tspan x="708.5" dy="18.5">(우리가 직접 닿을 수 없는 것)</tspan></text></g><path fill="transparent" stroke="transparent" d="M1060 0h359v139h-359z" class="shape s0"/><text x="178.5" y="225" class="fill-N1 s1"><tspan x="178.5" dy="0">여기서 정보가 줄어든다.</tspan><tspan x="178.5" dy="17.25">3차원이 2차원으로 눌리고,</tspan><tspan x="178.5" dy="17.25">물체의 색과 조명의 색이 한 값으로 섞이고,</tspan><tspan x="178.5" dy="17.25">여러 소리가 하나의 파형으로 합쳐진다</tspan></text><g ><g class="shape"><path d="M417 209h583v114H417z" class="stroke-B1 fill-B6 s0"/></g><text x="708.5" y="247.5" class="text-bold fill-N1 s1"><tspan x="708.5" dy="0">감각 표면에 맺힌 것</tspan><tspan x="708.5" dy="17.25">망막의 2차원 상 ·</tspan><tspan x="708.5" dy="17.25">두 귀에 닿은 압력 변화 ·</tspan><tspan x="708.5" dy="17.25">피부에 눌린 자국</tspan></text></g><path fill="transparent" stroke="transparent" d="M1060 209h359v114h-359z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M0 393h357v292H0z" class="shape s0"/><g ><g class="shape"><path d="M417 393h583v292H417z" class="stroke-B1 fill-B4 s0"/></g><text x="708.5" y="426" class="fill-N1 s2">같은 감각 입력을 낼 수 있는 바깥 세상</text></g><path fill="transparent" stroke="transparent" d="M1060 393h359v292h-359z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M0 755h357v581H0z" class="shape s0"/><g ><g class="shape"><path d="M417 755h583v581H417z" class="stroke-B1 fill-B4 s0"/></g><text x="708.5" y="788" class="fill-N1 s2">고르기를 정하는 전제</text></g><path fill="transparent" stroke="transparent" d="M1060 755h359v581h-359z" class="shape s0"/><g ><g class="shape"><path d="M0 1406h357v127H0z" class="stroke-B1 fill-B6 s0"/></g><text x="178.5" y="1467" class="text-bold fill-N1 s1"><tspan x="178.5" dy="0">상향 처리</tspan><tspan x="178.5" dy="18.5">감각 입력에서 올라오는 것</tspan></text></g><g ><g class="shape"><ellipse cx="708.5" cy="1469.5" class="shape stroke-B1 fill-B6 s0" rx="291.5" ry="63.5"/></g><text x="708.5" y="1475" class="text-bold fill-N1 s1">지각 — 하나로 정해진 결과</text></g><g ><g class="shape"><path d="M1060 1406h359v127h-359z" class="stroke-B1 fill-B6 s0"/></g><text x="1239.5" y="1467" class="text-bold fill-N1 s1"><tspan x="1239.5" dy="0">하향 처리</tspan><tspan x="1239.5" dy="18.5">전제 · 맥락 · 아는 것에서 내려오는 것</tspan></text></g><path fill="transparent" stroke="transparent" d="M0 1603h357v133H0z" class="shape s0"/><text x="698" y="1619" class="fill-N1 s1"><tspan x="698" dy="0"> </tspan><tspan x="698" dy="16.625">착시가 하는 일 — 전제가 틀리도록 짜 놓은 자극이다.</tspan><tspan x="698" dy="16.625"> </tspan><tspan x="698" dy="16.625">그래서 착시는 지각 체계의 고장이 아니라 이 그림이 맞다는 증거다.</tspan><tspan x="698" dy="16.625">전제 없이 고르는 체계라면 애초에 어긋날 자리가 없다.</tspan><tspan x="698" dy="16.625"> </tspan><tspan x="698" dy="16.625">그리고 착시는 알고 나서도 사라지지 않는다. 이 고르기가</tspan><tspan x="698" dy="16.625">우리가 믿는 것과 따로 돌아간다는 뜻이다</tspan></text><g ><g class="shape"><path d="M494 453h215v66H494z" class="stroke-B1 fill-B5 s0"/></g><text x="601.5" y="491.5" class="text-bold fill-N1 s1">가까이 있는 작은 것</text></g><g ><g class="shape"><path d="M749 453h174v66H749z" class="stroke-B1 fill-B5 s0"/></g><text x="836" y="491.5" class="text-bold fill-N1 s1">멀리 있는 큰 것</text></g><g ><g class="shape"><path d="M494 559h215v66H494z" class="stroke-B1 fill-B5 s0"/></g><text x="601.5" y="597.5" class="text-bold fill-N1 s1">기울어진 어떤 것</text></g><g ><g class="shape"><path d="M749 559h174v66H749z" class="stroke-B2 fill-B5 s3"/></g><text x="836" y="597.5" class="text-bold fill-N1 s1">…무한히 많다</text></g><g ><g class="shape"><path d="M477 815h431v66H477z" class="stroke-B1 fill-B5 s0"/></g><text x="692.5" y="853.5" class="text-bold fill-N1 s1">빛은 대개 위에서 온다</text></g><g ><g class="shape"><path d="M477 921h431v66H477z" class="stroke-B1 fill-B5 s0"/></g><text x="692.5" y="959.5" class="text-bold fill-N1 s1">물체는 대개 단단하고 모양이 변하지 않는다</text></g><g ><g class="shape"><path d="M477 1027h431v66H477z" class="stroke-B1 fill-B5 s0"/></g><text x="692.5" y="1065.5" class="text-bold fill-N1 s1">가까운 것이 먼 것을 가린다</text></g><g ><g class="shape"><path d="M477 1133h431v66H477z" class="stroke-B1 fill-B5 s0"/></g><text x="692.5" y="1171.5" class="text-bold fill-N1 s1">같은 결은 멀수록 촘촘해 보인다</text></g><text x="692.5" y="1255" class="fill-N1 s1"><tspan x="692.5" dy="0">이 전제들은 배워서 아는 것도 있고 아닌 것도 있다.</tspan><tspan x="692.5" dy="18.5">어느 쪽인지는 사안마다 다르고 다 정해지지 않았다</tspan></text><marker id="mk-d2-2544508512-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-2544508512-3488378134)" d="M709 141v64" class="connection stroke-B1 s0" mask="url(#d2-2544508512)"/><text x="709.5" y="180" class="text-italic fill-N2 s1">빛 · 소리 · 압력</text><marker id="mk-d2-2544508512-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-2544508512-2177206569)" d="M415.5 266h-55" class="connection stroke-B2 s3" mask="url(#d2-2544508512)"/><path fill="none" marker-end="url(#mk-d2-2544508512-3488378134)" d="M708.5 325v64" class="connection stroke-B1 s0" mask="url(#d2-2544508512)"/><text x="708.5" y="364" class="text-italic fill-N2 s1">하나로 정해지지 않는다</text><path fill="none" marker-end="url(#mk-d2-2544508512-3488378134)" d="M708.5 686.5v65" class="connection stroke-B1 s0" mask="url(#d2-2544508512)"/><text x="709" y="726" class="text-italic fill-N2 s1">무엇으로 고르는가</text><path fill="none" marker-end="url(#mk-d2-2544508512-3488378134)" d="m708.514 1337.5.458 64.5" class="connection stroke-B1 s0" mask="url(#d2-2544508512)"/><path fill="none" marker-end="url(#mk-d2-2544508512-2177206569)" d="m358.5 1469.517 54.5.45" class="connection stroke-B2 s3" mask="url(#d2-2544508512)"/><path fill="none" marker-end="url(#mk-d2-2544508512-2177206569)" d="m1058.5 1469.517-54.5.45" class="connection stroke-B2 s3" mask="url(#d2-2544508512)"/><path fill="none" marker-end="url(#mk-d2-2544508512-2177206569)" d="M709 1535v64" class="connection stroke-B2 s3" mask="url(#d2-2544508512)"/><mask id="d2-2544508512" width="1621" height="1938" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1621v1938H-101z"/><path d="M649 164h121v21H649zM607 348h203v21H607zM628 710h162v21H628z"/></mask></svg>