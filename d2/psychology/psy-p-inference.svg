<svg xmlns="http://www.w3.org/2000/svg" width="3255" height="1594" class="d2-1681503527 d2-svg" viewBox="-101 -101 3255 1594"><rect width="3255" height="1594" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1681503527 .fill-N1{fill:#0a0f25}.d2-1681503527 .fill-N2{fill:#676c7e}.d2-1681503527 .fill-B4{fill:#e3e9fd}.d2-1681503527 .fill-B5{fill:#edf0fd}.d2-1681503527 .fill-B6{fill:#f7f8fe}.d2-1681503527 .stroke-B1,.d2-1681503527 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="780" cy="69.5" class="shape stroke-B1 fill-B6 s0" rx="208" ry="69.5"/></g><text x="780" y="67" class="text-bold fill-N1 s1"><tspan x="780" dy="0">바깥 세상</tspan><tspan x="780" dy="18.5">(우리가 직접 닿을 수 없는 것)</tspan></text></g><g ><g class="shape"><path d="M508 260h545v82H508z" class="stroke-B1 fill-B6 s0"/></g><text x="780.5" y="298.5" class="text-bold fill-N1 s1"><tspan x="780.5" dy="0">감각 표면에 맺힌 것</tspan><tspan x="780.5" dy="18.5">망막의 2차원 상 · 두 귀에 닿은 압력 변화 · 피부에 눌린 자국</tspan></text></g><text x="292" y="536" class="fill-N1 s1"><tspan x="292" dy="0">여기서 정보가 줄어든다.</tspan><tspan x="292" dy="17.667">3차원이 2차원으로 눌리고, 물체의 색과 조명의 색이 한 값으로 섞이고,</tspan><tspan x="292" dy="17.667">여러 소리가 하나의 파형으로 합쳐진다</tspan></text><g ><g class="shape"><path d="M634 483h979v126H634z" class="stroke-B1 fill-B4 s0"/></g><text x="1123.5" y="470" class="fill-N1 s2">같은 감각 입력을 낼 수 있는 바깥 세상</text></g><g ><g class="shape"><path d="M320 778h1988v126H320z" class="stroke-B1 fill-B4 s0"/></g><text x="1314" y="765" class="fill-N1 s2">고르기를 정하는 전제</text></g><g ><g class="shape"><ellipse cx="2496" cy="1095.5" class="shape stroke-B1 fill-B6 s0" rx="191" ry="63.5"/></g><text x="2496" y="1101" class="text-bold fill-N1 s1">지각 — 하나로 정해진 결과</text></g><g ><g class="shape"><path d="M2358 800h276v82h-276z" class="stroke-B1 fill-B6 s0"/></g><text x="2496" y="838.5" class="text-bold fill-N1 s1"><tspan x="2496" dy="0">상향 처리</tspan><tspan x="2496" dy="18.5">감각 입력에서 올라오는 것</tspan></text></g><g ><g class="shape"><path d="M2694 800h359v82h-359z" class="stroke-B1 fill-B6 s0"/></g><text x="2873.5" y="838.5" class="text-bold fill-N1 s1"><tspan x="2873.5" dy="0">하향 처리</tspan><tspan x="2873.5" dy="18.5">전제 · 맥락 · 아는 것에서 내려오는 것</tspan></text></g><text x="2496" y="1275" class="fill-N1 s1"><tspan x="2496" dy="0"> </tspan><tspan x="2496" dy="16.625">착시가 하는 일 — 전제가 틀리도록 짜 놓은 자극이다.</tspan><tspan x="2496" dy="16.625"> </tspan><tspan x="2496" dy="16.625">그래서 착시는 지각 체계의 고장이 아니라 이 그림이 맞다는 증거다.</tspan><tspan x="2496" dy="16.625">전제 없이 고르는 체계라면 애초에 어긋날 자리가 없다.</tspan><tspan x="2496" dy="16.625"> </tspan><tspan x="2496" dy="16.625">그리고 착시는 알고 나서도 사라지지 않는다. 이 고르기가</tspan><tspan x="2496" dy="16.625">우리가 믿는 것과 따로 돌아간다는 뜻이다</tspan></text><g ><g class="shape"><path d="M664 513h215v66H664z" class="stroke-B1 fill-B5 s0"/></g><text x="771.5" y="551.5" class="text-bold fill-N1 s1">가까이 있는 작은 것</text></g><g ><g class="shape"><path d="M939 513h174v66H939z" class="stroke-B1 fill-B5 s0"/></g><text x="1026" y="551.5" class="text-bold fill-N1 s1">멀리 있는 큰 것</text></g><g ><g class="shape"><path d="M1173 513h191v66h-191z" class="stroke-B1 fill-B5 s0"/></g><text x="1268.5" y="551.5" class="text-bold fill-N1 s1">기울어진 어떤 것</text></g><g ><g class="shape"><path d="M1424 513h159v66h-159z" class="stroke-B2 fill-B5 s3"/></g><text x="1503.5" y="551.5" class="text-bold fill-N1 s1">…무한히 많다</text></g><g ><g class="shape"><path d="M350 808h235v66H350z" class="stroke-B1 fill-B5 s0"/></g><text x="467.5" y="846.5" class="text-bold fill-N1 s1">빛은 대개 위에서 온다</text></g><g ><g class="shape"><path d="M645 808h424v66H645z" class="stroke-B1 fill-B5 s0"/></g><text x="857" y="846.5" class="text-bold fill-N1 s1">물체는 대개 단단하고 모양이 변하지 않는다</text></g><g ><g class="shape"><path d="M1129 808h279v66h-279z" class="stroke-B1 fill-B5 s0"/></g><text x="1268.5" y="846.5" class="text-bold fill-N1 s1">가까운 것이 먼 것을 가린다</text></g><g ><g class="shape"><path d="M1468 808h319v66h-319z" class="stroke-B1 fill-B5 s0"/></g><text x="1627.5" y="846.5" class="text-bold fill-N1 s1">같은 결은 멀수록 촘촘해 보인다</text></g><text x="2062.5" y="839" class="fill-N1 s1"><tspan x="2062.5" dy="0">이 전제들은 배워서 아는 것도 있고 아닌 것도 있다.</tspan><tspan x="2062.5" dy="18.5">어느 쪽인지는 사안마다 다르고 다 정해지지 않았다</tspan></text><marker id="mk-d2-1681503527-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-1681503527-3488378134)" d="M780.008 141c.192 46.4.242 70.7.242 115.5" class="connection stroke-B1 s0" mask="url(#d2-1681503527)"/><text x="780.5" y="205" class="text-italic fill-N2 s1">빛 · 소리 · 압력</text><marker id="mk-d2-1681503527-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-1681503527-2177206569)" d="M581.043 341.91C350.2 390.3 292 474.3 292 515.5" class="connection stroke-B2 s3" mask="url(#d2-1681503527)"/><path fill="none" marker-end="url(#mk-d2-1681503527-3488378134)" d="M979.457 341.91C1210.3 390.3 1268.5 410.5 1268.5 438.5" class="connection stroke-B1 s0" mask="url(#d2-1681503527)"/><text x="1139.5" y="381" class="text-italic fill-N2 s1">하나로 정해지지 않는다</text><path fill="none" marker-end="url(#mk-d2-1681503527-3488378134)" d="M1268.5 610.5v123" class="connection stroke-B1 s0" mask="url(#d2-1681503527)"/><text x="1269" y="679" class="text-italic fill-N2 s1">무엇으로 고르는가</text><path fill="none" marker-end="url(#mk-d2-1681503527-3488378134)" d="M1268.5 906c0 60.4 208.7 95.4 1039.517 172.63" class="connection stroke-B1 s0" mask="url(#d2-1681503527)"/><path fill="none" marker-end="url(#mk-d2-1681503527-2177206569)" d="M2496 884v144" class="connection stroke-B2 s3" mask="url(#d2-1681503527)"/><path fill="none" marker-end="url(#mk-d2-1681503527-2177206569)" d="M2873.5 884c0 38-47.3 112.2-232.669 167.85" class="connection stroke-B2 s3" mask="url(#d2-1681503527)"/><path fill="none" marker-end="url(#mk-d2-1681503527-2177206569)" d="M2496 1161v94" class="connection stroke-B2 s3" mask="url(#d2-1681503527)"/><mask id="d2-1681503527" width="3255" height="1594" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3255v1594H-101z"/><path d="M720 189h121v21H720zM1038 365h203v21h-203zM1188 663h162v21h-162z"/></mask></svg>