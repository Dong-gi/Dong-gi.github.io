<svg xmlns="http://www.w3.org/2000/svg" width="2146" height="1165" class="d2-2617690572 d2-svg" viewBox="-101 -101 2146 1165"><rect width="2146" height="1165" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2617690572 .fill-N1{fill:#0a0f25}.d2-2617690572 .fill-B6{fill:#f7f8fe}.d2-2617690572 .stroke-B1,.d2-2617690572 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="535" cy="65" class="shape stroke-B1 fill-B6 s0" rx="195" ry="65"/></g><text x="535" y="70.5" class="text-bold fill-N1 s1">어떤 심리학 주장을 만났다</text></g><g ><g class="shape"><path d="M444 230h181v66H444z" class="stroke-B1 fill-B6 s0"/></g><text x="534.5" y="268.5" class="text-bold fill-N1 s1">1. 재현되었는가</text></g><text x="302" y="419" class="fill-N1 s1"><tspan x="302" dy="0">원 연구 하나뿐인가, 다른 연구실이 독립적으로 되풀이했는가.</tspan><tspan x="302" dy="17.667">같은 사람들이 같은 실험실에서 여러 번 한 것은 독립적인 재현이 아니다.</tspan><tspan x="302" dy="17.667">답이 ‘원 연구뿐’ 이면 그 아래 세 물음의 답은 다 잠정적이다</tspan></text><g ><g class="shape"><path d="M664 396h206v66H664z" class="stroke-B1 fill-B6 s0"/></g><text x="767" y="434.5" class="text-bold fill-N1 s1">2. 표본이 무엇인가</text></g><text x="541.5" y="585" class="fill-N1 s1"><tspan x="541.5" dy="0">누가 참가했는가. 어느 나라, 몇 살, 어떤 경로로 모였는가.</tspan><tspan x="541.5" dy="17.667">WEIRD 표본 — 서양의 · 교육받은 · 산업화된 · 부유한 · 민주주의 국가 —</tspan><tspan x="541.5" dy="17.667">특히 그 나라의 대학생만이라면 결론의 범위가 거기까지다</tspan></text><g ><g class="shape"><path d="M879 562h229v66H879z" class="stroke-B1 fill-B6 s0"/></g><text x="993.5" y="600.5" class="text-bold fill-N1 s1">3. 효과가 얼마나 큰가</text></g><text x="756" y="759" class="fill-N1 s1"><tspan x="756" dy="0">‘유의하다’ 는 크기를 말하지 않는다. 효과크기와 구간을 찾아본다.</tspan><tspan x="756" dy="18.5">구간이 넓으면 그 연구는 크기에 대해 거의 아무 말도 하지 않은 것이다</tspan></text><g ><g class="shape"><path d="M1108 728h246v66h-246z" class="stroke-B1 fill-B6 s0"/></g><text x="1231" y="766.5" class="text-bold fill-N1 s1">4. 얼마나 일반화되는가</text></g><text x="875.5" y="918" class="fill-N1 s1"><tspan x="875.5" dy="0">실험실 과제에서 잰 것이 바깥의 어떤 행동에 대응하는가.</tspan><tspan x="875.5" dy="17.667">화면 앞에서 몇 밀리초 빨라진 것과 실제로 무엇을 하는 것 사이에</tspan><tspan x="875.5" dy="17.667">어떤 다리가 놓였는가. 다리를 놓지 않은 채 건너뛴 주장이 가장 흔하다</tspan></text><text x="1586" y="910" class="fill-N1 s1"><tspan x="1586" dy="0"> </tspan><tspan x="1586" dy="17.25">이 넷은 주장을 버리기 위한 것이 아니라 어디까지 믿을지를 정하기 위한 것이다.</tspan><tspan x="1586" dy="17.25">네 물음에 잘 답하는 주장은 그만큼 세게 쓰고, 못 답하는 주장은 그만큼 조심해서 쓴다.</tspan><tspan x="1586" dy="17.25">‘심리학은 다 엉터리’ 라는 결론은 이 넷을 쓰지 않은 결론이며, 그것도 틀린 결론이다</tspan></text><marker id="mk-d2-2617690572-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2617690572-2177206569)" d="M442.118 295.676C330.4 335.8 302 357.3 302 398.5" class="connection stroke-B2 s3" mask="url(#d2-2617690572)"/><path fill="none" marker-end="url(#mk-d2-2617690572-2177206569)" d="M675.123 462.69C568.2 502 541 523.3 541 564.5" class="connection stroke-B2 s3" mask="url(#d2-2617690572)"/><path fill="none" marker-end="url(#mk-d2-2617690572-2177206569)" d="M896.612 628.66C784.1 668 755.5 690.9 755.5 738.5" class="connection stroke-B2 s3" mask="url(#d2-2617690572)"/><path fill="none" marker-end="url(#mk-d2-2617690572-2177206569)" d="M1105.552 790.192C921.7 833.147 875.25 855.6 875.25 898" class="connection stroke-B2 s3" mask="url(#d2-2617690572)"/><marker id="mk-d2-2617690572-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2617690572-3488378134)" d="M534.98 132c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-2617690572)"/><path fill="none" marker-end="url(#mk-d2-2617690572-3488378134)" d="M626.882 295.676C738.6 335.8 767 356 767 392" class="connection stroke-B1 s0" mask="url(#d2-2617690572)"/><path fill="none" marker-end="url(#mk-d2-2617690572-3488378134)" d="M858.877 462.69C965.8 502 993 522 993 558" class="connection stroke-B1 s0" mask="url(#d2-2617690572)"/><path fill="none" marker-end="url(#mk-d2-2617690572-3488378134)" d="M1089.388 628.66C1201.9 668 1230.5 688 1230.5 724" class="connection stroke-B1 s0" mask="url(#d2-2617690572)"/><path fill="none" marker-end="url(#mk-d2-2617690572-3488378134)" d="M1355.698 790.453C1539.35 833.2 1585.75 854 1585.75 890" class="connection stroke-B1 s0" mask="url(#d2-2617690572)"/><mask id="d2-2617690572" width="2146" height="1165" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2146v1165H-101z"/></mask></svg>