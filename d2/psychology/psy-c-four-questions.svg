<svg xmlns="http://www.w3.org/2000/svg" width="1207" height="975" class="d2-1217086451 d2-svg" viewBox="-101 -101 1207 975"><rect width="1207" height="975" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1217086451 .fill-N1{fill:#0a0f25}.d2-1217086451 .fill-B6{fill:#f7f8fe}.d2-1217086451 .stroke-B1,.d2-1217086451 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="209" cy="65" class="shape stroke-B1 fill-B6 s0" rx="209" ry="65"/></g><text x="209" y="70.5" class="text-bold fill-N1 s1">어떤 심리학 주장을 만났다</text></g><path fill="transparent" stroke="transparent" d="M488 0h517v130H488z" class="shape s0"/><g ><g class="shape"><path d="M0 180h418v69H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209" y="220" class="text-bold fill-N1 s1">1. 재현되었는가</text></g><text x="746.5" y="196" class="fill-N1 s1"><tspan x="746.5" dy="0">원 연구 하나뿐인가, 다른 연구실이 독립적으로 되풀이했는가.</tspan><tspan x="746.5" dy="17.25">같은 사람들이 같은 실험실에서 여러 번 한 것은</tspan><tspan x="746.5" dy="17.25">독립적인 재현이 아니다.</tspan><tspan x="746.5" dy="17.25">답이 ‘원 연구뿐’ 이면 그 아래 세 물음의 답은 다 잠정적이다</tspan></text><g ><g class="shape"><path d="M0 299h418v69H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209" y="339" class="text-bold fill-N1 s1">2. 표본이 무엇인가</text></g><text x="733" y="315" class="fill-N1 s1"><tspan x="733" dy="0">누가 참가했는가. 어느 나라, 몇 살, 어떤 경로로 모였는가.</tspan><tspan x="733" dy="17.25">WEIRD 표본 — 서양의 · 교육받은 · 산업화된 ·</tspan><tspan x="733" dy="17.25">부유한 · 민주주의 국가 —</tspan><tspan x="733" dy="17.25">특히 그 나라의 대학생만이라면 결론의 범위가 거기까지다</tspan></text><g ><g class="shape"><path d="M0 418h418v69H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209" y="458" class="text-bold fill-N1 s1">3. 효과가 얼마나 큰가</text></g><text x="675.5" y="434" class="fill-N1 s1"><tspan x="675.5" dy="0">‘유의하다’ 는 크기를 말하지 않는다.</tspan><tspan x="675.5" dy="17.25">효과크기와 구간을 찾아본다.</tspan><tspan x="675.5" dy="17.25">구간이 넓으면 그 연구는</tspan><tspan x="675.5" dy="17.25">크기에 대해 거의 아무 말도 하지 않은 것이다</tspan></text><g ><g class="shape"><path d="M0 537h418v69H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209" y="577" class="text-bold fill-N1 s1">4. 얼마나 일반화되는가</text></g><text x="726.5" y="553" class="fill-N1 s1"><tspan x="726.5" dy="0">실험실 과제에서 잰 것이 바깥의 어떤 행동에 대응하는가.</tspan><tspan x="726.5" dy="17.25">화면 앞에서 몇 밀리초 빨라진 것과</tspan><tspan x="726.5" dy="17.25">실제로 무엇을 하는 것 사이에 어떤 다리가 놓였는가.</tspan><tspan x="726.5" dy="17.25">다리를 놓지 않은 채 건너뛴 주장이 가장 흔하다</tspan></text><text x="209" y="672" class="fill-N1 s1"><tspan x="209" dy="0"> </tspan><tspan x="209" dy="16.714">이 넷은 주장을 버리기 위한 것이 아니라</tspan><tspan x="209" dy="16.714">어디까지 믿을지를 정하기 위한 것이다.</tspan><tspan x="209" dy="16.714">네 물음에 잘 답하는 주장은 그만큼 세게 쓰고,</tspan><tspan x="209" dy="16.714">못 답하는 주장은 그만큼 조심해서 쓴다.</tspan><tspan x="209" dy="16.714">‘심리학은 다 엉터리’ 라는 결론은</tspan><tspan x="209" dy="16.714">이 넷을 쓰지 않은 결론이며, 그것도 틀린 결론이다</tspan></text><path fill="transparent" stroke="transparent" d="M488 656h517v117H488z" class="shape s0"/><marker id="mk-d2-1217086451-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1217086451-2177206569)" d="M419.5 214.5h65" class="connection stroke-B2 s3" mask="url(#d2-1217086451)"/><path fill="none" marker-end="url(#mk-d2-1217086451-2177206569)" d="M419.5 333.5h65" class="connection stroke-B2 s3" mask="url(#d2-1217086451)"/><path fill="none" marker-end="url(#mk-d2-1217086451-2177206569)" d="M419.5 452.5h65" class="connection stroke-B2 s3" mask="url(#d2-1217086451)"/><path fill="none" marker-end="url(#mk-d2-1217086451-2177206569)" d="M419.5 571.5h65" class="connection stroke-B2 s3" mask="url(#d2-1217086451)"/><marker id="mk-d2-1217086451-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1217086451-3488378134)" d="M209 132v44" class="connection stroke-B1 s0" mask="url(#d2-1217086451)"/><path fill="none" marker-end="url(#mk-d2-1217086451-3488378134)" d="M209 250.5v45" class="connection stroke-B1 s0" mask="url(#d2-1217086451)"/><path fill="none" marker-end="url(#mk-d2-1217086451-3488378134)" d="M209 369.5v45" class="connection stroke-B1 s0" mask="url(#d2-1217086451)"/><path fill="none" marker-end="url(#mk-d2-1217086451-3488378134)" d="M209 488.5v45" class="connection stroke-B1 s0" mask="url(#d2-1217086451)"/><path fill="none" marker-end="url(#mk-d2-1217086451-3488378134)" d="M209 607.5v45" class="connection stroke-B1 s0" mask="url(#d2-1217086451)"/><mask id="d2-1217086451" width="1207" height="975" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1207v975H-101z"/></mask></svg>