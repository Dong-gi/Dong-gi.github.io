<svg xmlns="http://www.w3.org/2000/svg" width="1029" height="1350" class="d2-2981316828 d2-svg" viewBox="-89 -89 1029 1350"><rect width="1029" height="1350" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2981316828 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2981316828 .fill-N1{fill:#0a0f25}.d2-2981316828 .fill-B5{fill:#edf0fd}.d2-2981316828 .fill-B6{fill:#f7f8fe}.d2-2981316828 .stroke-B1,.d2-2981316828 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="525.5" cy="87" class="shape stroke-B1 fill-B6 s0" rx="225.5" ry="75"/></g><text x="525.5" y="84.5" class="text-bold fill-N1 s1"><tspan x="525.5" dy="0">모집단</tspan><tspan x="525.5" dy="18.5">결론을 적용하고 싶은 사람 전체</tspan></text></g><g ><g class="shape"><path d="M378 232h296v82H378z" class="stroke-B1 fill-B6 s0"/></g><text x="526" y="270.5" class="text-bold fill-N1 s1"><tspan x="526" dy="0">1. 무선표집</tspan><tspan x="526" dy="18.5">누구를 부를지 우연이 정한다</tspan></text></g><g ><g class="shape"><path d="M218 411h296v82H218z" class="stroke-B1 fill-B6 s0"/></g><text x="366" y="449.5" class="text-bold fill-N1 s1"><tspan x="366" dy="0">표본</tspan><tspan x="366" dy="18.5">실제로 연구에 들어온 사람들</tspan></text></g><g ><g class="shape"><path d="M206 581h319v98H206z" class="stroke-B1 fill-B6 s0"/></g><text x="365.5" y="619.5" class="text-bold fill-N1 s1"><tspan x="365.5" dy="0">2. 무선배정</tspan><tspan x="365.5" dy="17.667">들어온 사람이 어느 조건에 갈지</tspan><tspan x="365.5" dy="17.667">우연이 정한다</tspan></text></g><g ><g class="shape"><path d="M12 759h376v166H12z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="200" y="792" class="fill-N1" style="text-anchor:middle;font-size:28px">두 집단</text></g><text x="686.5" y="410" class="fill-N1 s1"><tspan x="686.5" dy="0">무선표집이 지켜 주는 것 —</tspan><tspan x="686.5" dy="16.714">외적 타당도</tspan><tspan x="686.5" dy="16.714">표본에서 본 것을</tspan><tspan x="686.5" dy="16.714">모집단에 대해 말할 수 있다.</tspan><tspan x="686.5" dy="16.714">하지 않으면</tspan><tspan x="686.5" dy="16.714">‘이 사람들에게서는 이랬다’ 까지만</tspan><tspan x="686.5" dy="16.714">말할 수 있다</tspan></text><text x="532" y="775" class="fill-N1 s1"><tspan x="532" dy="0">무선배정이 지켜 주는 것 —</tspan><tspan x="532" dy="16.625">내적 타당도</tspan><tspan x="532" dy="16.625">두 집단이 처치 말고는</tspan><tspan x="532" dy="16.625">평균적으로 같아진다.</tspan><tspan x="532" dy="16.625">재지 못한 혼입변수까지</tspan><tspan x="532" dy="16.625">고르게 섞이는 것이 요점이다.</tspan><tspan x="532" dy="16.625">하지 않으면 차이의 원인을</tspan><tspan x="532" dy="16.625">처치라고 말할 수 없다</tspan></text><text x="199.5" y="1011" class="fill-N1 s1"><tspan x="199.5" dy="0"> </tspan><tspan x="199.5" dy="16.5">실제 연구는 대개 이렇다 —</tspan><tspan x="199.5" dy="16.5">무선표집은 하지 못하고 무선배정만 한다.</tspan><tspan x="199.5" dy="16.5">대학생 200명을 모아</tspan><tspan x="199.5" dy="16.5">동전을 던져 두 조건에 나눈다.</tspan><tspan x="199.5" dy="16.5">그러면 ‘이 처치가 이 사람들에게</tspan><tspan x="199.5" dy="16.5">효과가 있었다’ 는 말할 수 있고</tspan><tspan x="199.5" dy="16.5">‘사람 일반에게 효과가 있다’ 는</tspan><tspan x="199.5" dy="16.5">말할 수 없다.</tspan><tspan x="199.5" dy="16.5">6장의 네 물음 가운데 둘이 여기서 갈린다</tspan></text><g ><g class="shape"><path d="M62 809h128v66H62z" class="stroke-B1 fill-B5 s0"/></g><text x="126" y="847.5" class="text-bold fill-N1 s1">처치 집단</text></g><g ><g class="shape"><path d="M210 809h128v66H210z" class="stroke-B1 fill-B5 s0"/></g><text x="274" y="847.5" class="text-bold fill-N1 s1">통제 집단</text></g><marker id="mk-d2-2981316828-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2981316828-3488378134)" d="M526 164v64" class="connection stroke-B1 s0" mask="url(#d2-2981316828)"/><path fill="none" marker-end="url(#mk-d2-2981316828-3488378134)" d="M476.916 316v92" class="connection stroke-B1 s0" mask="url(#d2-2981316828)"/><path fill="none" marker-end="url(#mk-d2-2981316828-3488378134)" d="M366 495v82" class="connection stroke-B1 s0" mask="url(#d2-2981316828)"/><path fill="none" marker-end="url(#mk-d2-2981316828-3488378134)" d="M312.833 681v74" class="connection stroke-B1 s0" mask="url(#d2-2981316828)"/><marker id="mk-d2-2981316828-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2981316828-2177206569)" d="M575.583 316v74" class="connection stroke-B2 s3" mask="url(#d2-2981316828)"/><path fill="none" marker-end="url(#mk-d2-2981316828-2177206569)" d="M419.166 681v28s0 10 10 10H522s10 0 10 10v26" class="connection stroke-B2 s3" mask="url(#d2-2981316828)"/><path fill="none" marker-end="url(#mk-d2-2981316828-2177206569)" d="M200 927v64" class="connection stroke-B2 s3" mask="url(#d2-2981316828)"/><mask id="d2-2981316828" width="1029" height="1350" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H940v1350H-89z"/></mask></svg>