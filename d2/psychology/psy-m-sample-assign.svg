<svg xmlns="http://www.w3.org/2000/svg" width="1475" height="1352" class="d2-3825655171 d2-svg" viewBox="-101 -101 1475 1352"><rect width="1475" height="1352" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3825655171 .fill-N1{fill:#0a0f25}.d2-3825655171 .fill-B5{fill:#edf0fd}.d2-3825655171 .fill-B6{fill:#f7f8fe}.d2-3825655171 .stroke-B1,.d2-3825655171 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="781.5" cy="75" class="shape stroke-B1 fill-B6 s0" rx="225.5" ry="75"/></g><text x="781.5" y="72.5" class="text-bold fill-N1 s1"><tspan x="781.5" dy="0">모집단</tspan><tspan x="781.5" dy="18.5">결론을 적용하고 싶은 사람 전체</tspan></text></g><g ><g class="shape"><path d="M633 250h296v82H633z" class="stroke-B1 fill-B6 s0"/></g><text x="781" y="288.5" class="text-bold fill-N1 s1"><tspan x="781" dy="0">1. 무선표집</tspan><tspan x="781" dy="18.5">누구를 부를지 우연이 정한다</tspan></text></g><g ><g class="shape"><path d="M400 432h296v82H400z" class="stroke-B1 fill-B6 s0"/></g><text x="548" y="470.5" class="text-bold fill-N1 s1"><tspan x="548" dy="0">표본</tspan><tspan x="548" dy="18.5">실제로 연구에 들어온 사람들</tspan></text></g><g ><g class="shape"><path d="M325 614h447v82H325z" class="stroke-B1 fill-B6 s0"/></g><text x="548.5" y="652.5" class="text-bold fill-N1 s1"><tspan x="548.5" dy="0">2. 무선배정</tspan><tspan x="548.5" dy="18.5">들어온 사람이 어느 조건에 갈지 우연이 정한다</tspan></text></g><g ><g class="shape"><path d="M81 818h376v126H81z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="269" y="805" class="fill-N1" style="text-anchor:middle;font-size:28px">두 집단</text></g><text x="1014.5" y="463" class="fill-N1 s1"><tspan x="1014.5" dy="0">무선표집이 지켜 주는 것 — 외적 타당도</tspan><tspan x="1014.5" dy="17.667">표본에서 본 것을 모집단에 대해 말할 수 있다.</tspan><tspan x="1014.5" dy="17.667">하지 않으면 ‘이 사람들에게서는 이랬다’ 까지만 말할 수 있다</tspan></text><text x="734" y="862" class="fill-N1 s1"><tspan x="734" dy="0">무선배정이 지켜 주는 것 — 내적 타당도</tspan><tspan x="734" dy="17.25">두 집단이 처치 말고는 평균적으로 같아진다.</tspan><tspan x="734" dy="17.25">재지 못한 혼입변수까지 고르게 섞이는 것이 요점이다.</tspan><tspan x="734" dy="17.25">하지 않으면 차이의 원인을 처치라고 말할 수 없다</tspan></text><text x="362.5" y="1081" class="fill-N1 s1"><tspan x="362.5" dy="0"> </tspan><tspan x="362.5" dy="17">실제 연구는 대개 이렇다 — 무선표집은 하지 못하고 무선배정만 한다.</tspan><tspan x="362.5" dy="17">대학생 200명을 모아 동전을 던져 두 조건에 나눈다.</tspan><tspan x="362.5" dy="17">그러면 ‘이 처치가 이 사람들에게 효과가 있었다’ 는 말할 수 있고</tspan><tspan x="362.5" dy="17">‘사람 일반에게 효과가 있다’ 는 말할 수 없다. 6장의 네 물음 가운데 둘이 여기서 갈린다</tspan></text><g ><g class="shape"><path d="M111 848h128v66H111z" class="stroke-B1 fill-B5 s0"/></g><text x="175" y="886.5" class="text-bold fill-N1 s1">처치 집단</text></g><g ><g class="shape"><path d="M299 848h128v66H299z" class="stroke-B1 fill-B5 s0"/></g><text x="363" y="886.5" class="text-bold fill-N1 s1">통제 집단</text></g><marker id="mk-d2-3825655171-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3825655171-3488378134)" d="M781.01 152c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-3825655171)"/><path fill="none" marker-end="url(#mk-d2-3825655171-3488378134)" d="M674.137 332.728C573.6 372 548 392 548 428" class="connection stroke-B1 s0" mask="url(#d2-3825655171)"/><path fill="none" marker-end="url(#mk-d2-3825655171-3488378134)" d="M548 516v94" class="connection stroke-B1 s0" mask="url(#d2-3825655171)"/><path fill="none" marker-end="url(#mk-d2-3825655171-3488378134)" d="M462.704 696.88C382.9 736 362.5 760.4 362.5 814" class="connection stroke-B1 s0" mask="url(#d2-3825655171)"/><marker id="mk-d2-3825655171-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3825655171-2177206569)" d="M888.363 332.728C988.9 372 1014.5 394.9 1014.5 442.5" class="connection stroke-B2 s3" mask="url(#d2-3825655171)"/><path fill="none" marker-end="url(#mk-d2-3825655171-2177206569)" d="M633.296 696.88C713.1 736 733.5 806 733.5 842" class="connection stroke-B2 s3" mask="url(#d2-3825655171)"/><path fill="none" marker-end="url(#mk-d2-3825655171-2177206569)" d="M362.5 946v115" class="connection stroke-B2 s3" mask="url(#d2-3825655171)"/><mask id="d2-3825655171" width="1475" height="1352" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1475v1352H-101z"/></mask></svg>