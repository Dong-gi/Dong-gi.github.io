<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="1649" class="d2-1945814548 d2-svg" viewBox="-101 -101 1434 1649"><rect width="1434" height="1649" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1945814548 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1945814548 .fill-N1{fill:#0a0f25}.d2-1945814548 .fill-B4{fill:#e3e9fd}.d2-1945814548 .fill-B5{fill:#edf0fd}.d2-1945814548 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h1232v380H0z" class="stroke-B1 fill-B4 s0"/></g><text x="616" y="33" class="fill-N1 s1">되풀이된 것</text></g><g ><g class="shape"><path d="M0 440h1232v404H0z" class="stroke-B1 fill-B4 s0"/></g><text x="616" y="473" class="fill-N1 s1">다투어지는 것 — 참가자가 자기가 무엇을 하고 있다고 생각했는가</text></g><g ><g class="shape"><path d="M0 904h1232v414H0z" class="stroke-B1 fill-B4 s0"/></g><text x="616" y="937" class="fill-N1 s1">자료와 절차의 문제</text></g><text x="358" y="1394" class="fill-N1 s2"><tspan x="358" dy="0"> </tspan><tspan x="358" dy="17.25">이 문서가 적는 방식 — ‘사람은 권위에 복종한다’ 가 아니라</tspan><tspan x="358" dy="17.25">‘이 절차에서 다수가 끝까지 갔고, 그들이 자기가 무엇을 하고 있다고 여겼는지에 대해</tspan><tspan x="358" dy="17.25">여러 설명이 경쟁하고 있다’</tspan></text><g ><g class="shape"><path d="M40 46h700v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="390" y="84.5" class="text-bold fill-N1 s2">이 절차에 들어간 참가자 가운데 상당수가 실험자의 요구를 따라 계속했다</text></g><g ><g class="shape"><path d="M40 152h700v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="390" y="190.5" class="text-bold fill-N1 s2"><tspan x="390" dy="0">2009년에 안전을 위해 낮은 지점에서 멈추도록 고친 판본으로 되풀이했을 때,</tspan><tspan x="390" dy="18.5">계속한 사람의 비율이 원 연구와 비슷했다</tspan></text></g><g ><g class="shape"><path d="M40 274h700v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="390" y="312.5" class="text-bold fill-N1 s2">다른 나라에서 이루어진 되풀이에서도 비슷한 방향의 결과가 보고되었다</text></g><g ><g class="shape"><path d="M60 500h472v114H60z" class="stroke-B1 fill-B5 s0"/></g><text x="296" y="546.5" class="text-bold fill-N1 s2"><tspan x="296" dy="0">복종 해석</tspan><tspan x="296" dy="17.667">권위가 있는 자리에 있는 사람의 지시라서 따랐다.</tspan><tspan x="296" dy="17.667">오랫동안 표준으로 인용된 읽기다</tspan></text></g><g ><g class="shape"><path d="M572 500h600v114H572z" class="stroke-B1 fill-B5 s0"/></g><text x="872" y="538.5" class="text-bold fill-N1 s2"><tspan x="872" dy="0">믿지 않았다는 해석</tspan><tspan x="872" dy="17.25">상당수 참가자가 실제로 해를 입히고 있다고</tspan><tspan x="872" dy="17.25">믿지 않았다는 증거가 있다.</tspan><tspan x="872" dy="17.25">참가자의 사후 진술과 실험 기록에서 그런 자료가 나왔다</tspan></text></g><g ><g class="shape"><path d="M60 654h472v130H60z" class="stroke-B1 fill-B5 s0"/></g><text x="296" y="700.5" class="text-bold fill-N1 s2"><tspan x="296" dy="0">참여한 협력자 해석</tspan><tspan x="296" dy="17.25">참가자가 명령을 따른 것이 아니라</tspan><tspan x="296" dy="17.25">가치 있어 보이는 일에 협력했다는 읽기.</tspan><tspan x="296" dy="17.25">기록을 다시 분석한 연구들이 이 쪽을 밀었다</tspan></text></g><g ><g class="shape"><path d="M572 654h600v130H572z" class="stroke-B1 fill-B5 s0"/></g><text x="872" y="692.5" class="text-bold fill-N1 s2"><tspan x="872" dy="0">이 셋을 가르는 자료가 있다</tspan><tspan x="872" dy="17">실험자의 재촉은 네 단계였는데, 가장 명령에 가까운 마지막 재촉</tspan><tspan x="872" dy="17">(‘당신은 다른 선택이 없습니다’) 뒤에는</tspan><tspan x="872" dy="17">거의 언제나 중단이 뒤따랐다.</tspan><tspan x="872" dy="17">명령이 셀수록 덜 따랐다면 단순한 복종 해석은 어려워진다</tspan></text></g><g ><g class="shape"><path d="M60 964h832v66H60z" class="stroke-B1 fill-B5 s0"/></g><text x="476" y="1002.5" class="text-bold fill-N1 s2">조건마다 절차가 일정하지 않았고, 실험자가 대본을 벗어나 더 설득한 경우가 있었다</text></g><g ><g class="shape"><path d="M60 1070h832v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="476" y="1108.5" class="text-bold fill-N1 s2"><tspan x="476" dy="0">사후설명이 곧바로 이루어지지 않은 참가자들이 있었다.</tspan><tspan x="476" dy="18.5">이 연구가 4장의 연구 윤리 논의를 크게 밀어 올린 계기이기도 하다</tspan></text></g><g ><g class="shape"><path d="M60 1192h832v66H60z" class="stroke-B1 fill-B5 s0"/></g><text x="476" y="1230.5" class="text-bold fill-N1 s2">보고된 조건 말고도 여러 변형이 실시되었고, 어느 것을 대표로 인용하느냐가 인상을 바꾼다</text></g><marker id="mk-d2-1945814548-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1945814548-3488378134)" d="M390 114v34" class="connection stroke-B1 s0" mask="url(#d2-1945814548)"/><path fill="none" marker-end="url(#mk-d2-1945814548-3488378134)" d="M390 236v34" class="connection stroke-B1 s0" mask="url(#d2-1945814548)"/><path fill="none" marker-end="url(#mk-d2-1945814548-3488378134)" d="M616 382v54" class="connection stroke-B1 s0" mask="url(#d2-1945814548)"/><text x="616.5" y="416" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">그러면 이것은 무엇인가</text><marker id="mk-d2-1945814548-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1945814548-2177206569)" d="M616 846v54" class="connection" mask="url(#d2-1945814548)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><path fill="none" marker-end="url(#mk-d2-1945814548-3488378134)" d="M616 1319.5v55" class="connection stroke-B1 s0" mask="url(#d2-1945814548)"/><mask id="d2-1945814548" width="1434" height="1649" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1434v1649H-101z"/><path d="M515 400h203v21H515z"/></mask></svg>