<svg xmlns="http://www.w3.org/2000/svg" width="1158" height="1505" class="d2-3439546741 d2-svg" viewBox="-101 -101 1158 1505"><rect width="1158" height="1505" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3439546741 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3439546741 .fill-N1{fill:#0a0f25}.d2-3439546741 .fill-B4{fill:#e3e9fd}.d2-3439546741 .fill-B5{fill:#edf0fd}.d2-3439546741 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h956v246H0z" class="stroke-B1 fill-B4 s0"/></g><text x="478" y="33" class="fill-N1 s1">되풀이된 것</text></g><g ><g class="shape"><path d="M0 306h956v526H0z" class="stroke-B1 fill-B4 s0"/></g><text x="478" y="339" class="fill-N1 s1"><tspan x="478" dy="0">다투어지는 것 —</tspan><tspan x="478" dy="30.667">참가자가 자기가 무엇을</tspan><tspan x="478" dy="30.667">하고 있다고 생각했는가</tspan></text></g><g ><g class="shape"><path d="M0 892h956v282H0z" class="stroke-B1 fill-B4 s0"/></g><text x="478" y="925" class="fill-N1 s1">자료와 절차의 문제</text></g><text x="358" y="1250" class="fill-N1 s2"><tspan x="358" dy="0"> </tspan><tspan x="358" dy="17.25">이 문서가 적는 방식 — ‘사람은 권위에 복종한다’ 가 아니라</tspan><tspan x="358" dy="17.25">‘이 절차에서 다수가 끝까지 갔고, 그들이 자기가 무엇을 하고 있다고 여겼는지에 대해</tspan><tspan x="358" dy="17.25">여러 설명이 경쟁하고 있다’</tspan></text><g ><g class="shape"><path d="M50 50h252v146H50z" class="stroke-B1 fill-B5 s0"/></g><text x="176" y="104.5" class="text-bold fill-N1 s2"><tspan x="176" dy="0">이 절차에 들어간</tspan><tspan x="176" dy="17.25">참가자 가운데 상당수가</tspan><tspan x="176" dy="17.25">실험자의 요구를 따라</tspan><tspan x="176" dy="17.25">계속했다</tspan></text></g><g ><g class="shape"><path d="M352 50h252v146H352z" class="stroke-B1 fill-B5 s0"/></g><text x="478" y="88.5" class="text-bold fill-N1 s2"><tspan x="478" dy="0">2009년에 안전을 위해</tspan><tspan x="478" dy="16.833">낮은 지점에서 멈추도록</tspan><tspan x="478" dy="16.833">고친 판본으로</tspan><tspan x="478" dy="16.833">되풀이했을 때,</tspan><tspan x="478" dy="16.833">계속한 사람의 비율이</tspan><tspan x="478" dy="16.833">원 연구와 비슷했다</tspan></text></g><g ><g class="shape"><path d="M654 50h252v146H654z" class="stroke-B1 fill-B5 s0"/></g><text x="780" y="104.5" class="text-bold fill-N1 s2"><tspan x="780" dy="0">다른 나라에서 이루어진</tspan><tspan x="780" dy="17.25">되풀이에서도</tspan><tspan x="780" dy="17.25">비슷한 방향의 결과가</tspan><tspan x="780" dy="17.25">보고되었다</tspan></text></g><g ><g class="shape"><path d="M60 408h340v146H60z" class="stroke-B1 fill-B5 s0"/></g><text x="230" y="462.5" class="text-bold fill-N1 s2"><tspan x="230" dy="0">복종 해석</tspan><tspan x="230" dy="17.25">권위가 있는 자리에 있는 사람의</tspan><tspan x="230" dy="17.25">지시라서 따랐다.</tspan><tspan x="230" dy="17.25">오랫동안 표준으로 인용된 읽기다</tspan></text></g><g ><g class="shape"><path d="M440 408h360v146H440z" class="stroke-B1 fill-B5 s0"/></g><text x="620" y="446.5" class="text-bold fill-N1 s2"><tspan x="620" dy="0">믿지 않았다는 해석</tspan><tspan x="620" dy="16.833">상당수 참가자가 실제로</tspan><tspan x="620" dy="16.833">해를 입히고 있다고</tspan><tspan x="620" dy="16.833">믿지 않았다는 증거가 있다.</tspan><tspan x="620" dy="16.833">참가자의 사후 진술과 실험 기록에서</tspan><tspan x="620" dy="16.833">그런 자료가 나왔다</tspan></text></g><g ><g class="shape"><path d="M60 594h340v178H60z" class="stroke-B1 fill-B5 s0"/></g><text x="230" y="648.5" class="text-bold fill-N1 s2"><tspan x="230" dy="0">참여한 협력자 해석</tspan><tspan x="230" dy="16.833">참가자가 명령을 따른 것이 아니라</tspan><tspan x="230" dy="16.833">가치 있어 보이는 일에</tspan><tspan x="230" dy="16.833">협력했다는 읽기.</tspan><tspan x="230" dy="16.833">기록을 다시 분석한 연구들이</tspan><tspan x="230" dy="16.833">이 쪽을 밀었다</tspan></text></g><g ><g class="shape"><path d="M440 594h360v178H440z" class="stroke-B1 fill-B5 s0"/></g><text x="620" y="632.5" class="text-bold fill-N1 s2"><tspan x="620" dy="0">이 셋을 가르는 자료가 있다</tspan><tspan x="620" dy="16.625">실험자의 재촉은 네 단계였는데,</tspan><tspan x="620" dy="16.625">가장 명령에 가까운 마지막 재촉</tspan><tspan x="620" dy="16.625">(‘당신은 다른 선택이 없습니다’)</tspan><tspan x="620" dy="16.625">뒤에는 거의 언제나</tspan><tspan x="620" dy="16.625">중단이 뒤따랐다.</tspan><tspan x="620" dy="16.625">명령이 셀수록 덜 따랐다면</tspan><tspan x="620" dy="16.625">단순한 복종 해석은 어려워진다</tspan></text></g><g ><g class="shape"><path d="M60 952h255v162H60z" class="stroke-B1 fill-B5 s0"/></g><text x="187.5" y="1014.5" class="text-bold fill-N1 s2"><tspan x="187.5" dy="0">조건마다 절차가</tspan><tspan x="187.5" dy="17.25">일정하지 않았고,</tspan><tspan x="187.5" dy="17.25">실험자가 대본을 벗어나</tspan><tspan x="187.5" dy="17.25">더 설득한 경우가 있었다</tspan></text></g><g ><g class="shape"><path d="M355 952h214v162H355z" class="stroke-B1 fill-B5 s0"/></g><text x="462" y="990.5" class="text-bold fill-N1 s2"><tspan x="462" dy="0">사후설명이 곧바로</tspan><tspan x="462" dy="16.714">이루어지지 않은</tspan><tspan x="462" dy="16.714">참가자들이 있었다.</tspan><tspan x="462" dy="16.714">이 연구가 4장의</tspan><tspan x="462" dy="16.714">연구 윤리 논의를</tspan><tspan x="462" dy="16.714">크게 밀어 올린</tspan><tspan x="462" dy="16.714">계기이기도 하다</tspan></text></g><g ><g class="shape"><path d="M609 952h258v162H609z" class="stroke-B1 fill-B5 s0"/></g><text x="738" y="1006.5" class="text-bold fill-N1 s2"><tspan x="738" dy="0">보고된 조건 말고도</tspan><tspan x="738" dy="17">여러 변형이 실시되었고,</tspan><tspan x="738" dy="17">어느 것을 대표로</tspan><tspan x="738" dy="17">인용하느냐가</tspan><tspan x="738" dy="17">인상을 바꾼다</tspan></text></g><marker id="mk-d2-3439546741-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3439546741-3488378134)" d="M304 123h44" class="connection stroke-B1 s0" mask="url(#d2-3439546741)"/><path fill="none" marker-end="url(#mk-d2-3439546741-3488378134)" d="M606 123h44" class="connection stroke-B1 s0" mask="url(#d2-3439546741)"/><path fill="none" marker-end="url(#mk-d2-3439546741-3488378134)" d="M478 248v54" class="connection stroke-B1 s0" mask="url(#d2-3439546741)"/><text x="478.5" y="282" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">그러면 이것은 무엇인가</text><marker id="mk-d2-3439546741-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3439546741-2177206569)" d="M478 834v54" class="connection" mask="url(#d2-3439546741)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><path fill="none" marker-end="url(#mk-d2-3439546741-3488378134)" d="M478 1175.5v55" class="connection stroke-B1 s0" mask="url(#d2-3439546741)"/><mask id="d2-3439546741" width="1158" height="1505" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1158v1505H-101z"/><path d="M377 266h203v21H377z"/></mask></svg>