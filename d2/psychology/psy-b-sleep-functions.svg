<svg xmlns="http://www.w3.org/2000/svg" width="3726" height="1284" class="d2-1534326702 d2-svg" viewBox="-91 -101 3726 1284"><rect width="3726" height="1284" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1534326702 .fill-N1{fill:#0a0f25}.d2-1534326702 .fill-B4{fill:#e3e9fd}.d2-1534326702 .fill-B5{fill:#edf0fd}.d2-1534326702 .stroke-B1,.d2-1534326702 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="1747" cy="93.5" class="shape stroke-B1" rx="281" ry="93.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1747" y="99" class="text-bold fill-N1 s0">왜 자는가 — 아직 하나로 정해지지 않았다</text></g><g ><g class="shape"><path d="M10 315h693v498H10z" class="stroke-B1 fill-B4 s1"/></g><text x="356.5" y="302" class="fill-N1 s2">회복</text></g><g ><g class="shape"><path d="M743 315h613v498H743z" class="stroke-B1 fill-B4 s1"/></g><text x="1049.5" y="302" class="fill-N1 s2">에너지 절약 · 활동 시간 제한</text></g><g ><g class="shape"><path d="M1396 315h701v498h-701z" class="stroke-B1 fill-B4 s1"/></g><text x="1746.5" y="302" class="fill-N1 s2">기억의 정리</text></g><g ><g class="shape"><path d="M2137 307h652v498h-652z" class="stroke-B1 fill-B4 s1"/></g><text x="2463" y="294" class="fill-N1 s2">연결의 정리</text></g><g ><g class="shape"><path d="M2829 315h705v498h-705z" class="stroke-B1 fill-B4 s1"/></g><text x="3181.5" y="302" class="fill-N1 s2">노폐물의 제거</text></g><text x="1769" y="949" class="fill-N1 s0"><tspan x="1769" dy="0"> </tspan><tspan x="1769" dy="16.556">이 문서의 태도 — 어느 하나를 정답처럼 쓰지 않는다.</tspan><tspan x="1769" dy="16.556"> </tspan><tspan x="1769" dy="16.556">그리고 이 다섯은 서로 배타적이지 않다. 잠이 여러 일을 함께 할 수도 있고,</tspan><tspan x="1769" dy="16.556">단계마다 다른 일을 할 수도 있다. 지금 자료로 갈리지 않는다.</tspan><tspan x="1769" dy="16.556"> </tspan><tspan x="1769" dy="16.556">대신 튼튼한 것 하나는 적어 둘 수 있다 —</tspan><tspan x="1769" dy="16.556">‘충분히 자지 못하면 여러 종류의 수행이 나빠진다’ 는 것은 되풀이 확인되었다.</tspan><tspan x="1769" dy="16.556">그것은 ‘왜 자는가’ 에 대한 답이 아니라 ‘안 자면 어떻게 되는가’ 에 대한 답이다</tspan></text><g ><g class="shape"><path d="M156 345h401v66H156z" class="stroke-B1 fill-B5 s1"/></g><text x="356.5" y="383.5" class="text-bold fill-N1 s0">주장 — 깨어 있는 동안 쌓인 것을 되돌린다</text></g><g ><g class="shape"><path d="M40 527h633v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="356.5" y="565.5" class="text-bold fill-N1 s0">기대는 증거 — 오래 깨어 있으면 수행이 나빠지고 잠을 자면 돌아온다</text></g><g ><g class="shape"><path d="M105 701h504v82H105z" class="stroke-B1 fill-B5 s1"/></g><text x="357" y="739.5" class="text-bold fill-N1 s0"><tspan x="357" dy="0">약한 자리 — ‘무엇이 회복되는가’ 가 정해지지 않으면</tspan><tspan x="357" dy="18.5">거의 반증되지 않는 주장이 된다</tspan></text></g><g ><g class="shape"><path d="M779 345h542v66H779z" class="stroke-B1 fill-B5 s1"/></g><text x="1050" y="383.5" class="text-bold fill-N1 s0">주장 — 쓸모없거나 위험한 시간대에 활동을 줄이는 장치다</text></g><g ><g class="shape"><path d="M817 527h465v66H817z" class="stroke-B1 fill-B5 s1"/></g><text x="1049.5" y="565.5" class="text-bold fill-N1 s0">기대는 증거 — 종에 따른 수면 시간과 생태의 관계</text></g><g ><g class="shape"><path d="M773 701h553v82H773z" class="stroke-B1 fill-B5 s1"/></g><text x="1049.5" y="739.5" class="text-bold fill-N1 s0"><tspan x="1049.5" dy="0">약한 자리 — 종 사이의 비교는 상관 자료이고,</tspan><tspan x="1049.5" dy="18.5">잠이 왜 ‘의식을 잃는 형태’여야 하는지를 설명하지 않는다</tspan></text></g><g ><g class="shape"><path d="M1469 345h555v66h-555z" class="stroke-B1 fill-B5 s1"/></g><text x="1746.5" y="383.5" class="text-bold fill-N1 s0">주장 — 낮에 얻은 것을 자는 동안 다시 처리해 자리 잡게 한다</text></g><g ><g class="shape"><path d="M1488 519h517v82h-517z" class="stroke-B1 fill-B5 s1"/></g><text x="1746.5" y="557.5" class="text-bold fill-N1 s0"><tspan x="1746.5" dy="0">기대는 증거 — 학습 뒤 잠을 잔 집단과 아닌 집단의 비교,</tspan><tspan x="1746.5" dy="18.5">자는 동안의 신경 활동 패턴 연구</tspan></text></g><g ><g class="shape"><path d="M1426 701h641v82h-641z" class="stroke-B1 fill-B5 s1"/></g><text x="1746.5" y="739.5" class="text-bold fill-N1 s0"><tspan x="1746.5" dy="0">약한 자리 — 잠을 못 자게 하는 조작은 스트레스와 각성도 함께 바꾼다.</tspan><tspan x="1746.5" dy="18.5">4장의 혼입변수 문제가 이 계열의 상수다</tspan></text></g><g ><g class="shape"><path d="M2167 337h592v82h-592z" class="stroke-B1 fill-B5 s1"/></g><text x="2463" y="375.5" class="text-bold fill-N1 s0"><tspan x="2463" dy="0">주장 — 깨어 있는 동안 강해진 연결을 자는 동안 전체적으로 낮춰</tspan><tspan x="2463" dy="18.5">다음 날 다시 배울 여지를 만든다</tspan></text></g><g ><g class="shape"><path d="M2221 519h485v82h-485z" class="stroke-B1 fill-B5 s1"/></g><text x="2463.5" y="557.5" class="text-bold fill-N1 s0"><tspan x="2463.5" dy="0">기대는 증거 — 깨어 있는 시간과 잠자는 시간에 따른</tspan><tspan x="2463.5" dy="18.5">신경 지표의 변화</tspan></text></g><g ><g class="shape"><path d="M2176 709h574v66h-574z" class="stroke-B1 fill-B5 s1"/></g><text x="2463" y="747.5" class="text-bold fill-N1 s0">약한 자리 — 사람에게서 직접 재기 어렵고, 간접 지표에 기댄다</text></g><g ><g class="shape"><path d="M2864 345h636v66h-636z" class="stroke-B1 fill-B5 s1"/></g><text x="3182" y="383.5" class="text-bold fill-N1 s0">주장 — 자는 동안 뇌 안의 액체 흐름이 달라져 노폐물이 잘 빠져나간다</text></g><g ><g class="shape"><path d="M2971 527h421v66h-421z" class="stroke-B1 fill-B5 s1"/></g><text x="3181.5" y="565.5" class="text-bold fill-N1 s0">기대는 증거 — 동물에서 잰 흐름과 물질 농도</text></g><g ><g class="shape"><path d="M2859 701h645v82h-645z" class="stroke-B1 fill-B5 s1"/></g><text x="3181.5" y="739.5" class="text-bold fill-N1 s0"><tspan x="3181.5" dy="0">약한 자리 — 이 계열은 비교적 최근이고,</tspan><tspan x="3181.5" dy="18.5">뒤이어 반대 방향의 결과를 보고한 연구도 있다. ‘다투어지는 중’ 이다</tspan></text></g><marker id="mk-d2-1534326702-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M356.5 413v110" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M356.5 595v102" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M1049.5 413v110" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M1049.5 595v102" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M1746.5 413v102" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M1746.5 603v94" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M2463 421v94" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M2463 603v102" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M3181.5 413v110" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M3181.5 595v102" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M1477.01 121.206C581 213.8 356.5 244.4 356.5 270" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M1506.04 143.402C1141.2 218.2 1049.5 244.4 1049.5 270" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M1746.98 189c-.38 38-.48 55.4-.48 81" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M1989.961 142.392C2368 218 2463 242.8 2463 262" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-3488378134)" d="M2017.99 120.2C2948.4 213.6 3181.5 244.4 3181.5 270" class="connection stroke-B1 s1" mask="url(#d2-1534326702)"/><marker id="mk-d2-1534326702-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1534326702-2177206569)" d="M356.5 815c0 54 215.4 87 1073.015 162.649" class="connection stroke-B2 s4" mask="url(#d2-1534326702)"/><path fill="none" marker-end="url(#mk-d2-1534326702-2177206569)" d="M3181.5 815c0 54-215.4 87-1073.015 162.649" class="connection stroke-B2 s4" mask="url(#d2-1534326702)"/><mask id="d2-1534326702" width="3726" height="1284" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h3726v1284H-91z"/></mask></svg>