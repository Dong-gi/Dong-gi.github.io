<svg xmlns="http://www.w3.org/2000/svg" width="1803" height="1507" class="d2-40801804 d2-svg" viewBox="-101 -101 1803 1507"><rect width="1803" height="1507" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-40801804 .fill-N1{fill:#0a0f25}.d2-40801804 .fill-B4{fill:#e3e9fd}.d2-40801804 .fill-B5{fill:#edf0fd}.d2-40801804 .stroke-B1,.d2-40801804 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h482v444H0z" class="stroke-B1 fill-B4 s0"/></g><text x="241" y="33" class="fill-N1 s1">기억의 정리</text></g><g ><g class="shape"><ellipse cx="775.5" cy="222" class="shape stroke-B1" rx="253.5" ry="222" style="fill:#f7f8fe;stroke-width:2"/></g><text x="775.5" y="219.5" class="text-bold fill-N1 s2"><tspan x="775.5" dy="0">왜 자는가 —</tspan><tspan x="775.5" dy="18.5">아직 하나로 정해지지 않았다</tspan></text></g><g ><g class="shape"><path d="M1069 0h532v444h-532z" class="stroke-B1 fill-B4 s0"/></g><text x="1335" y="33" class="fill-N1 s1">에너지 절약 · 활동 시간 제한</text></g><g ><g class="shape"><path d="M0 554h482v444H0z" class="stroke-B1 fill-B4 s0"/></g><text x="241" y="587" class="fill-N1 s1">회복</text></g><g ><g class="shape"><path d="M522 554h507v444H522z" class="stroke-B1 fill-B4 s0"/></g><text x="775.5" y="587" class="fill-N1 s1">연결의 정리</text></g><g ><g class="shape"><path d="M1069 554h532v444h-532z" class="stroke-B1 fill-B4 s0"/></g><text x="1335" y="587" class="fill-N1 s1">노폐물의 제거</text></g><path fill="transparent" stroke="transparent" d="M0 1108h482v197H0z" class="shape s0"/><text x="775.5" y="1124" class="fill-N1 s2"><tspan x="775.5" dy="0"> </tspan><tspan x="775.5" dy="16.417">이 문서의 태도 — 어느 하나를 정답처럼 쓰지 않는다.</tspan><tspan x="775.5" dy="16.417"> </tspan><tspan x="775.5" dy="16.417">그리고 이 다섯은 서로 배타적이지 않다.</tspan><tspan x="775.5" dy="16.417">잠이 여러 일을 함께 할 수도 있고,</tspan><tspan x="775.5" dy="16.417">단계마다 다른 일을 할 수도 있다. 지금 자료로 갈리지 않는다.</tspan><tspan x="775.5" dy="16.417"> </tspan><tspan x="775.5" dy="16.417">대신 튼튼한 것 하나는 적어 둘 수 있다 —</tspan><tspan x="775.5" dy="16.417">‘충분히 자지 못하면 여러 종류의 수행이 나빠진다’ 는 것은</tspan><tspan x="775.5" dy="16.417">되풀이 확인되었다.</tspan><tspan x="775.5" dy="16.417">그것은 ‘왜 자는가’ 에 대한 답이 아니라</tspan><tspan x="775.5" dy="16.417">‘안 자면 어떻게 되는가’ 에 대한 답이다</tspan></text><g ><g class="shape"><path d="M40 46h393v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="236.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="236.5" dy="0">주장 — 낮에 얻은 것을 자는 동안</tspan><tspan x="236.5" dy="18.5">다시 처리해 자리 잡게 한다</tspan></text></g><g ><g class="shape"><path d="M40 168h393v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="236.5" y="206.5" class="text-bold fill-N1 s2"><tspan x="236.5" dy="0">기대는 증거 — 학습 뒤 잠을 잔 집단과</tspan><tspan x="236.5" dy="17.667">아닌 집단의 비교,</tspan><tspan x="236.5" dy="17.667">자는 동안의 신경 활동 패턴 연구</tspan></text></g><g ><g class="shape"><path d="M40 306h393v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="236.5" y="344.5" class="text-bold fill-N1 s2"><tspan x="236.5" dy="0">약한 자리 — 잠을 못 자게 하는 조작은</tspan><tspan x="236.5" dy="17.667">스트레스와 각성도 함께 바꾼다.</tspan><tspan x="236.5" dy="17.667">4장의 혼입변수 문제가 이 계열의 상수다</tspan></text></g><g ><g class="shape"><path d="M1109 46h427v82h-427z" class="stroke-B1 fill-B5 s0"/></g><text x="1322.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="1322.5" dy="0">주장 — 쓸모없거나 위험한 시간대에</tspan><tspan x="1322.5" dy="18.5">활동을 줄이는 장치다</tspan></text></g><g ><g class="shape"><path d="M1109 168h427v82h-427z" class="stroke-B1 fill-B5 s0"/></g><text x="1322.5" y="206.5" class="text-bold fill-N1 s2"><tspan x="1322.5" dy="0">기대는 증거 —</tspan><tspan x="1322.5" dy="18.5">종에 따른 수면 시간과 생태의 관계</tspan></text></g><g ><g class="shape"><path d="M1109 290h427v98h-427z" class="stroke-B1 fill-B5 s0"/></g><text x="1322.5" y="328.5" class="text-bold fill-N1 s2"><tspan x="1322.5" dy="0">약한 자리 — 종 사이의 비교는 상관 자료이고,</tspan><tspan x="1322.5" dy="17.667">잠이 왜 ‘의식을 잃는 형태’여야 하는지를</tspan><tspan x="1322.5" dy="17.667">설명하지 않는다</tspan></text></g><g ><g class="shape"><path d="M40 600h402v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="241" y="638.5" class="text-bold fill-N1 s2">주장 — 깨어 있는 동안 쌓인 것을 되돌린다</text></g><g ><g class="shape"><path d="M40 706h402v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="241" y="744.5" class="text-bold fill-N1 s2"><tspan x="241" dy="0">기대는 증거 — 오래 깨어 있으면</tspan><tspan x="241" dy="18.5">수행이 나빠지고 잠을 자면 돌아온다</tspan></text></g><g ><g class="shape"><path d="M40 828h402v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="241" y="866.5" class="text-bold fill-N1 s2"><tspan x="241" dy="0">약한 자리 —</tspan><tspan x="241" dy="17.667">‘무엇이 회복되는가’ 가 정해지지 않으면</tspan><tspan x="241" dy="17.667">거의 반증되지 않는 주장이 된다</tspan></text></g><g ><g class="shape"><path d="M562 600h404v98H562z" class="stroke-B1 fill-B5 s0"/></g><text x="764" y="638.5" class="text-bold fill-N1 s2"><tspan x="764" dy="0">주장 — 깨어 있는 동안 강해진 연결을</tspan><tspan x="764" dy="17.667">자는 동안 전체적으로 낮춰</tspan><tspan x="764" dy="17.667">다음 날 다시 배울 여지를 만든다</tspan></text></g><g ><g class="shape"><path d="M562 738h404v98H562z" class="stroke-B1 fill-B5 s0"/></g><text x="764" y="776.5" class="text-bold fill-N1 s2"><tspan x="764" dy="0">기대는 증거 —</tspan><tspan x="764" dy="17.667">깨어 있는 시간과 잠자는 시간에 따른</tspan><tspan x="764" dy="17.667">신경 지표의 변화</tspan></text></g><g ><g class="shape"><path d="M562 876h404v82H562z" class="stroke-B1 fill-B5 s0"/></g><text x="764" y="914.5" class="text-bold fill-N1 s2"><tspan x="764" dy="0">약한 자리 — 사람에게서 직접 재기 어렵고,</tspan><tspan x="764" dy="18.5">간접 지표에 기댄다</tspan></text></g><g ><g class="shape"><path d="M1109 600h452v82h-452z" class="stroke-B1 fill-B5 s0"/></g><text x="1335" y="638.5" class="text-bold fill-N1 s2"><tspan x="1335" dy="0">주장 — 자는 동안 뇌 안의 액체 흐름이 달라져</tspan><tspan x="1335" dy="18.5">노폐물이 잘 빠져나간다</tspan></text></g><g ><g class="shape"><path d="M1109 722h452v82h-452z" class="stroke-B1 fill-B5 s0"/></g><text x="1335" y="760.5" class="text-bold fill-N1 s2"><tspan x="1335" dy="0">기대는 증거 —</tspan><tspan x="1335" dy="18.5">동물에서 잰 흐름과 물질 농도</tspan></text></g><g ><g class="shape"><path d="M1109 844h452v98h-452z" class="stroke-B1 fill-B5 s0"/></g><text x="1335" y="882.5" class="text-bold fill-N1 s2"><tspan x="1335" dy="0">약한 자리 — 이 계열은 비교적 최근이고,</tspan><tspan x="1335" dy="17.667">뒤이어 반대 방향의 결과를 보고한 연구도 있다.</tspan><tspan x="1335" dy="17.667">‘다투어지는 중’ 이다</tspan></text></g><marker id="mk-d2-40801804-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M236.5 130v34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M236.5 268v34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M1322.5 130v34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M1322.5 252v34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M241 668v34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M241 790v34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M764 700v34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M764 838v34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M1335 684v34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M1335 806v34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M610.613 392.44 457.775 551.12" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M1031 222h34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M520 222h-34" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="M776 446v104" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-3488378134)" d="m945.418 389.41 162.745 161.77" class="connection stroke-B1 s0" mask="url(#d2-40801804)"/><marker id="mk-d2-40801804-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-40801804-2177206569)" d="m483.056 971.756 166.331 134.232" class="connection stroke-B2 s4" mask="url(#d2-40801804)"/><path fill="none" marker-end="url(#mk-d2-40801804-2177206569)" d="m1067.916 981.721-161.248 124.336" class="connection stroke-B2 s4" mask="url(#d2-40801804)"/><mask id="d2-40801804" width="1803" height="1507" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1803v1507H-101z"/></mask></svg>