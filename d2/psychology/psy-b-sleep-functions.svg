<svg xmlns="http://www.w3.org/2000/svg" width="1508" height="1663" class="d2-3074611473 d2-svg" viewBox="-101 -101 1508 1663"><rect width="1508" height="1663" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3074611473 .fill-N1{fill:#0a0f25}.d2-3074611473 .fill-B4{fill:#e3e9fd}.d2-3074611473 .fill-B5{fill:#edf0fd}.d2-3074611473 .stroke-B1,.d2-3074611473 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h403v504H0z" class="stroke-B1 fill-B4 s0"/></g><text x="201.5" y="33" class="fill-N1 s1">기억의 정리</text></g><g ><g class="shape"><ellipse cx="652" cy="252" class="shape stroke-B1" rx="209" ry="252" style="fill:#f7f8fe;stroke-width:2"/></g><text x="652" y="249.5" class="text-bold fill-N1 s2"><tspan x="652" dy="0">왜 자는가 —</tspan><tspan x="652" dy="18.5">아직 하나로 정해지지 않았다</tspan></text></g><g ><g class="shape"><path d="M901 0h405v504H901z" class="stroke-B1 fill-B4 s0"/></g><text x="1103.5" y="33" class="fill-N1 s1"><tspan x="1103.5" dy="0">에너지 절약 ·</tspan><tspan x="1103.5" dy="32">활동 시간 제한</tspan></text></g><g ><g class="shape"><path d="M0 614h403v492H0z" class="stroke-B1 fill-B4 s0"/></g><text x="201.5" y="647" class="fill-N1 s1">회복</text></g><g ><g class="shape"><path d="M443 614h418v492H443z" class="stroke-B1 fill-B4 s0"/></g><text x="652" y="647" class="fill-N1 s1">연결의 정리</text></g><g ><g class="shape"><path d="M901 614h405v492H901z" class="stroke-B1 fill-B4 s0"/></g><text x="1103.5" y="647" class="fill-N1 s1">노폐물의 제거</text></g><path fill="transparent" stroke="transparent" d="M0 1216h403v245H0z" class="shape s0"/><text x="610" y="1232" class="fill-N1 s2"><tspan x="610" dy="0"> </tspan><tspan x="610" dy="16.333">이 문서의 태도 —</tspan><tspan x="610" dy="16.333">어느 하나를 정답처럼 쓰지 않는다.</tspan><tspan x="610" dy="16.333"> </tspan><tspan x="610" dy="16.333">그리고 이 다섯은 서로 배타적이지 않다.</tspan><tspan x="610" dy="16.333">잠이 여러 일을 함께 할 수도 있고,</tspan><tspan x="610" dy="16.333">단계마다 다른 일을 할 수도 있다.</tspan><tspan x="610" dy="16.333">지금 자료로 갈리지 않는다.</tspan><tspan x="610" dy="16.333"> </tspan><tspan x="610" dy="16.333">대신 튼튼한 것 하나는 적어 둘 수 있다 —</tspan><tspan x="610" dy="16.333">‘충분히 자지 못하면</tspan><tspan x="610" dy="16.333">여러 종류의 수행이 나빠진다’ 는 것은</tspan><tspan x="610" dy="16.333">되풀이 확인되었다.</tspan><tspan x="610" dy="16.333">그것은 ‘왜 자는가’ 에 대한 답이 아니라</tspan><tspan x="610" dy="16.333">‘안 자면 어떻게 되는가’ 에 대한 답이다</tspan></text><g ><g class="shape"><path d="M40 46h323v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="201.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="201.5" dy="0">주장 — 낮에 얻은 것을 자는 동안</tspan><tspan x="201.5" dy="18.5">다시 처리해 자리 잡게 한다</tspan></text></g><g ><g class="shape"><path d="M40 168h323v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="201.5" y="206.5" class="text-bold fill-N1 s2"><tspan x="201.5" dy="0">기대는 증거 —</tspan><tspan x="201.5" dy="17.25">학습 뒤 잠을 잔 집단과</tspan><tspan x="201.5" dy="17.25">아닌 집단의 비교,</tspan><tspan x="201.5" dy="17.25">자는 동안의 신경 활동 패턴 연구</tspan></text></g><g ><g class="shape"><path d="M40 322h323v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="201.5" y="360.5" class="text-bold fill-N1 s2"><tspan x="201.5" dy="0">약한 자리 — 잠을 못 자게 하는</tspan><tspan x="201.5" dy="17.25">조작은 스트레스와 각성도</tspan><tspan x="201.5" dy="17.25">함께 바꾼다. 4장의 혼입변수</tspan><tspan x="201.5" dy="17.25">문제가 이 계열의 상수다</tspan></text></g><g ><g class="shape"><path d="M941 74h325v98H941z" class="stroke-B1 fill-B5 s0"/></g><text x="1103.5" y="112.5" class="text-bold fill-N1 s2"><tspan x="1103.5" dy="0">주장 — 쓸모없거나</tspan><tspan x="1103.5" dy="17.667">위험한 시간대에</tspan><tspan x="1103.5" dy="17.667">활동을 줄이는 장치다</tspan></text></g><g ><g class="shape"><path d="M941 212h325v98H941z" class="stroke-B1 fill-B5 s0"/></g><text x="1103.5" y="250.5" class="text-bold fill-N1 s2"><tspan x="1103.5" dy="0">기대는 증거 —</tspan><tspan x="1103.5" dy="17.667">종에 따른 수면 시간과</tspan><tspan x="1103.5" dy="17.667">생태의 관계</tspan></text></g><g ><g class="shape"><path d="M941 350h325v114H941z" class="stroke-B1 fill-B5 s0"/></g><text x="1103.5" y="388.5" class="text-bold fill-N1 s2"><tspan x="1103.5" dy="0">약한 자리 —</tspan><tspan x="1103.5" dy="17.25">종 사이의 비교는 상관 자료이고,</tspan><tspan x="1103.5" dy="17.25">잠이 왜 ‘의식을 잃는 형태’여야</tspan><tspan x="1103.5" dy="17.25">하는지를 설명하지 않는다</tspan></text></g><g ><g class="shape"><path d="M40 660h319v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="199.5" y="698.5" class="text-bold fill-N1 s2"><tspan x="199.5" dy="0">주장 — 깨어 있는 동안</tspan><tspan x="199.5" dy="18.5">쌓인 것을 되돌린다</tspan></text></g><g ><g class="shape"><path d="M40 782h319v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="199.5" y="820.5" class="text-bold fill-N1 s2"><tspan x="199.5" dy="0">기대는 증거 —</tspan><tspan x="199.5" dy="17.25">오래 깨어 있으면</tspan><tspan x="199.5" dy="17.25">수행이 나빠지고</tspan><tspan x="199.5" dy="17.25">잠을 자면 돌아온다</tspan></text></g><g ><g class="shape"><path d="M40 936h319v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="199.5" y="974.5" class="text-bold fill-N1 s2"><tspan x="199.5" dy="0">약한 자리 —</tspan><tspan x="199.5" dy="17.25">‘무엇이 회복되는가’ 가</tspan><tspan x="199.5" dy="17.25">정해지지 않으면</tspan><tspan x="199.5" dy="17.25">거의 반증되지 않는 주장이 된다</tspan></text></g><g ><g class="shape"><path d="M483 660h302v114H483z" class="stroke-B1 fill-B5 s0"/></g><text x="634" y="698.5" class="text-bold fill-N1 s2"><tspan x="634" dy="0">주장 — 깨어 있는 동안</tspan><tspan x="634" dy="17.25">강해진 연결을 자는 동안</tspan><tspan x="634" dy="17.25">전체적으로 낮춰 다음 날</tspan><tspan x="634" dy="17.25">다시 배울 여지를 만든다</tspan></text></g><g ><g class="shape"><path d="M483 814h302v114H483z" class="stroke-B1 fill-B5 s0"/></g><text x="634" y="852.5" class="text-bold fill-N1 s2"><tspan x="634" dy="0">기대는 증거 —</tspan><tspan x="634" dy="17.25">깨어 있는 시간과</tspan><tspan x="634" dy="17.25">잠자는 시간에 따른</tspan><tspan x="634" dy="17.25">신경 지표의 변화</tspan></text></g><g ><g class="shape"><path d="M483 968h302v98H483z" class="stroke-B1 fill-B5 s0"/></g><text x="634" y="1006.5" class="text-bold fill-N1 s2"><tspan x="634" dy="0">약한 자리 —</tspan><tspan x="634" dy="17.667">사람에게서 직접 재기 어렵고,</tspan><tspan x="634" dy="17.667">간접 지표에 기댄다</tspan></text></g><g ><g class="shape"><path d="M941 660h299v98H941z" class="stroke-B1 fill-B5 s0"/></g><text x="1090.5" y="698.5" class="text-bold fill-N1 s2"><tspan x="1090.5" dy="0">주장 — 자는 동안</tspan><tspan x="1090.5" dy="17.667">뇌 안의 액체 흐름이 달라져</tspan><tspan x="1090.5" dy="17.667">노폐물이 잘 빠져나간다</tspan></text></g><g ><g class="shape"><path d="M941 798h299v82H941z" class="stroke-B1 fill-B5 s0"/></g><text x="1090.5" y="836.5" class="text-bold fill-N1 s2"><tspan x="1090.5" dy="0">기대는 증거 —</tspan><tspan x="1090.5" dy="18.5">동물에서 잰 흐름과 물질 농도</tspan></text></g><g ><g class="shape"><path d="M941 920h299v130H941z" class="stroke-B1 fill-B5 s0"/></g><text x="1090.5" y="958.5" class="text-bold fill-N1 s2"><tspan x="1090.5" dy="0">약한 자리 —</tspan><tspan x="1090.5" dy="17">이 계열은 비교적 최근이고,</tspan><tspan x="1090.5" dy="17">뒤이어 반대 방향의 결과를</tspan><tspan x="1090.5" dy="17">보고한 연구도 있다.</tspan><tspan x="1090.5" dy="17">‘다투어지는 중’ 이다</tspan></text></g><marker id="mk-d2-3074611473-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M201.5 130v34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M201.5 284v34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M1103.5 174v34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M1103.5 312v34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M199.5 744v34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M199.5 898v34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M634 776v34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M634 930v34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M1090.5 760v34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M1090.5 882v34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="m511.809 441.607-125.427 169.18" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M863 252h34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M441 252h-34" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="M652 506v104" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-3488378134)" d="m793.187 440.61 125.44 170.17" class="connection stroke-B1 s0" mask="url(#d2-3074611473)"/><marker id="mk-d2-3074611473-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3074611473-2177206569)" d="m404.367 1075.96 128.899 137.62" class="connection stroke-B2 s4" mask="url(#d2-3074611473)"/><path fill="none" marker-end="url(#mk-d2-3074611473-2177206569)" d="m899.633 1075.96-128.899 137.62" class="connection stroke-B2 s4" mask="url(#d2-3074611473)"/><mask id="d2-3074611473" width="1508" height="1663" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1508v1663H-101z"/></mask></svg>