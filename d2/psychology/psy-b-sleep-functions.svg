<svg xmlns="http://www.w3.org/2000/svg" width="1185" height="1521" class="d2-2549515612 d2-svg" viewBox="-101 -101 1185 1521"><rect width="1185" height="1521" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2549515612 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2549515612 .fill-N1{fill:#0a0f25}.d2-2549515612 .fill-B4{fill:#e3e9fd}.d2-2549515612 .fill-B5{fill:#edf0fd}.d2-2549515612 .stroke-B1,.d2-2549515612 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h304v495H0z" class="stroke-B1 fill-B4 s0"/></g><text x="152" y="33" class="fill-N1 s1">기억의 정리</text></g><g ><g class="shape"><ellipse cx="501" cy="247.5" class="shape stroke-B1" rx="167" ry="247.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="501" y="237" class="text-bold fill-N1 s2"><tspan x="501" dy="0">왜 자는가 —</tspan><tspan x="501" dy="17.667">아직 하나로</tspan><tspan x="501" dy="17.667">정해지지 않았다</tspan></text></g><g ><g class="shape"><path d="M698 0h285v495H698z" class="stroke-B1 fill-B4 s0"/></g><text x="840.5" y="33" class="fill-N1 s1"><tspan x="840.5" dy="0">에너지 절약 ·</tspan><tspan x="840.5" dy="32">활동 시간 제한</tspan></text></g><g ><g class="shape"><path d="M0 545h304v479H0z" class="stroke-B1 fill-B4 s0"/></g><text x="152" y="578" class="fill-N1 s1">회복</text></g><g ><g class="shape"><path d="M334 545h334v479H334z" class="stroke-B1 fill-B4 s0"/></g><text x="501" y="578" class="fill-N1 s1">연결의 정리</text></g><g ><g class="shape"><path d="M698 545h285v479H698z" class="stroke-B1 fill-B4 s0"/></g><text x="840.5" y="578" class="fill-N1 s1">노폐물의 제거</text></g><path fill="transparent" stroke="transparent" d="M0 1074h304v245H0z" class="shape s0"/><text x="501" y="1090" class="fill-N1 s2"><tspan x="501" dy="0"> </tspan><tspan x="501" dy="16.333">이 문서의 태도 —</tspan><tspan x="501" dy="16.333">어느 하나를 정답처럼 쓰지 않는다.</tspan><tspan x="501" dy="16.333"> </tspan><tspan x="501" dy="16.333">그리고 이 다섯은 서로 배타적이지 않다.</tspan><tspan x="501" dy="16.333">잠이 여러 일을 함께 할 수도 있고,</tspan><tspan x="501" dy="16.333">단계마다 다른 일을 할 수도 있다.</tspan><tspan x="501" dy="16.333">지금 자료로 갈리지 않는다.</tspan><tspan x="501" dy="16.333"> </tspan><tspan x="501" dy="16.333">대신 튼튼한 것 하나는 적어 둘 수 있다 —</tspan><tspan x="501" dy="16.333">‘충분히 자지 못하면</tspan><tspan x="501" dy="16.333">여러 종류의 수행이 나빠진다’ 는 것은</tspan><tspan x="501" dy="16.333">되풀이 확인되었다.</tspan><tspan x="501" dy="16.333">그것은 ‘왜 자는가’ 에 대한 답이 아니라</tspan><tspan x="501" dy="16.333">‘안 자면 어떻게 되는가’ 에 대한 답이다</tspan></text><g ><g class="shape"><path d="M25 46h241v98H25z" class="stroke-B1 fill-B5 s0"/></g><text x="145.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="145.5" dy="0">주장 — 낮에 얻은 것을</tspan><tspan x="145.5" dy="17.667">자는 동안 다시 처리해</tspan><tspan x="145.5" dy="17.667">자리 잡게 한다</tspan></text></g><g ><g class="shape"><path d="M25 169h241v130H25z" class="stroke-B1 fill-B5 s0"/></g><text x="145.5" y="207.5" class="text-bold fill-N1 s2"><tspan x="145.5" dy="0">기대는 증거 —</tspan><tspan x="145.5" dy="17">학습 뒤 잠을 잔 집단과</tspan><tspan x="145.5" dy="17">아닌 집단의 비교,</tspan><tspan x="145.5" dy="17">자는 동안의</tspan><tspan x="145.5" dy="17">신경 활동 패턴 연구</tspan></text></g><g ><g class="shape"><path d="M25 324h241v146H25z" class="stroke-B1 fill-B5 s0"/></g><text x="145.5" y="362.5" class="text-bold fill-N1 s2"><tspan x="145.5" dy="0">약한 자리 —</tspan><tspan x="145.5" dy="16.833">잠을 못 자게 하는</tspan><tspan x="145.5" dy="16.833">조작은 스트레스와</tspan><tspan x="145.5" dy="16.833">각성도 함께 바꾼다.</tspan><tspan x="145.5" dy="16.833">4장의 혼입변수 문제가</tspan><tspan x="145.5" dy="16.833">이 계열의 상수다</tspan></text></g><g ><g class="shape"><path d="M723 74h235v98H723z" class="stroke-B1 fill-B5 s0"/></g><text x="840.5" y="112.5" class="text-bold fill-N1 s2"><tspan x="840.5" dy="0">주장 — 쓸모없거나</tspan><tspan x="840.5" dy="17.667">위험한 시간대에</tspan><tspan x="840.5" dy="17.667">활동을 줄이는 장치다</tspan></text></g><g ><g class="shape"><path d="M723 197h235v98H723z" class="stroke-B1 fill-B5 s0"/></g><text x="840.5" y="235.5" class="text-bold fill-N1 s2"><tspan x="840.5" dy="0">기대는 증거 —</tspan><tspan x="840.5" dy="17.667">종에 따른 수면 시간과</tspan><tspan x="840.5" dy="17.667">생태의 관계</tspan></text></g><g ><g class="shape"><path d="M723 320h235v146H723z" class="stroke-B1 fill-B5 s0"/></g><text x="840.5" y="358.5" class="text-bold fill-N1 s2"><tspan x="840.5" dy="0">약한 자리 —</tspan><tspan x="840.5" dy="16.833">종 사이의 비교는</tspan><tspan x="840.5" dy="16.833">상관 자료이고,</tspan><tspan x="840.5" dy="16.833">잠이 왜 ‘의식을 잃는</tspan><tspan x="840.5" dy="16.833">형태’여야 하는지를</tspan><tspan x="840.5" dy="16.833">설명하지 않는다</tspan></text></g><g ><g class="shape"><path d="M25 591h254v82H25z" class="stroke-B1 fill-B5 s0"/></g><text x="152" y="629.5" class="text-bold fill-N1 s2"><tspan x="152" dy="0">주장 — 깨어 있는 동안</tspan><tspan x="152" dy="18.5">쌓인 것을 되돌린다</tspan></text></g><g ><g class="shape"><path d="M25 698h254v114H25z" class="stroke-B1 fill-B5 s0"/></g><text x="152" y="736.5" class="text-bold fill-N1 s2"><tspan x="152" dy="0">기대는 증거 —</tspan><tspan x="152" dy="17.25">오래 깨어 있으면</tspan><tspan x="152" dy="17.25">수행이 나빠지고</tspan><tspan x="152" dy="17.25">잠을 자면 돌아온다</tspan></text></g><g ><g class="shape"><path d="M25 837h254v130H25z" class="stroke-B1 fill-B5 s0"/></g><text x="152" y="875.5" class="text-bold fill-N1 s2"><tspan x="152" dy="0">약한 자리 —</tspan><tspan x="152" dy="17">‘무엇이 회복되는가’ 가</tspan><tspan x="152" dy="17">정해지지 않으면</tspan><tspan x="152" dy="17">거의 반증되지 않는</tspan><tspan x="152" dy="17">주장이 된다</tspan></text></g><g ><g class="shape"><path d="M359 591h255v114H359z" class="stroke-B1 fill-B5 s0"/></g><text x="486.5" y="629.5" class="text-bold fill-N1 s2"><tspan x="486.5" dy="0">주장 — 깨어 있는 동안</tspan><tspan x="486.5" dy="17.25">강해진 연결을 자는 동안</tspan><tspan x="486.5" dy="17.25">전체적으로 낮춰 다음 날</tspan><tspan x="486.5" dy="17.25">다시 배울 여지를 만든다</tspan></text></g><g ><g class="shape"><path d="M359 730h255v114H359z" class="stroke-B1 fill-B5 s0"/></g><text x="486.5" y="768.5" class="text-bold fill-N1 s2"><tspan x="486.5" dy="0">기대는 증거 —</tspan><tspan x="486.5" dy="17.25">깨어 있는 시간과</tspan><tspan x="486.5" dy="17.25">잠자는 시간에 따른</tspan><tspan x="486.5" dy="17.25">신경 지표의 변화</tspan></text></g><g ><g class="shape"><path d="M359 869h255v114H359z" class="stroke-B1 fill-B5 s0"/></g><text x="486.5" y="907.5" class="text-bold fill-N1 s2"><tspan x="486.5" dy="0">약한 자리 —</tspan><tspan x="486.5" dy="17.25">사람에게서 직접</tspan><tspan x="486.5" dy="17.25">재기 어렵고,</tspan><tspan x="486.5" dy="17.25">간접 지표에 기댄다</tspan></text></g><g ><g class="shape"><path d="M723 591h234v114H723z" class="stroke-B1 fill-B5 s0"/></g><text x="840" y="629.5" class="text-bold fill-N1 s2"><tspan x="840" dy="0">주장 — 자는 동안</tspan><tspan x="840" dy="17.25">뇌 안의 액체 흐름이</tspan><tspan x="840" dy="17.25">달라져 노폐물이</tspan><tspan x="840" dy="17.25">잘 빠져나간다</tspan></text></g><g ><g class="shape"><path d="M723 730h234v98H723z" class="stroke-B1 fill-B5 s0"/></g><text x="840" y="768.5" class="text-bold fill-N1 s2"><tspan x="840" dy="0">기대는 증거 —</tspan><tspan x="840" dy="17.667">동물에서 잰 흐름과</tspan><tspan x="840" dy="17.667">물질 농도</tspan></text></g><g ><g class="shape"><path d="M723 853h234v146H723z" class="stroke-B1 fill-B5 s0"/></g><text x="840" y="891.5" class="text-bold fill-N1 s2"><tspan x="840" dy="0">약한 자리 —</tspan><tspan x="840" dy="16.833">이 계열은 비교적</tspan><tspan x="840" dy="16.833">최근이고, 뒤이어</tspan><tspan x="840" dy="16.833">반대 방향의 결과를</tspan><tspan x="840" dy="16.833">보고한 연구도 있다.</tspan><tspan x="840" dy="16.833">‘다투어지는 중’ 이다</tspan></text></g><marker id="mk-d2-2549515612-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M145.5 146v19" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M145.5 301v19" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M840.5 174v19" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M840.5 297v19" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M152 675v19" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M152 814v19" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M486.5 707v19" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M486.5 846v19" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M840 707v19" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M840 830v19" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="m383.912 426.678-77.737 119.965" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M670 248h24" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M332 248h-24" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="M501 497v44" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-3488378134)" d="m616.07 429.69 79.79 125.931" class="connection stroke-B1 s0" mask="url(#d2-2549515612)"/><marker id="mk-d2-2549515612-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2549515612-2177206569)" d="m305.284 965.033 89.147 106.4" class="connection stroke-B2 s4" mask="url(#d2-2549515612)"/><path fill="none" marker-end="url(#mk-d2-2549515612-2177206569)" d="m696.731 959.046-92.194 112.362" class="connection stroke-B2 s4" mask="url(#d2-2549515612)"/><mask id="d2-2549515612" width="1185" height="1521" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1185v1521H-101z"/></mask></svg>