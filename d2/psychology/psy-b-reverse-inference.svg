<svg xmlns="http://www.w3.org/2000/svg" width="1097" height="955" class="d2-2169868703 d2-svg" viewBox="-101 -101 1097 955"><rect width="1097" height="955" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2169868703 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2169868703 .fill-N1{fill:#0a0f25}.d2-2169868703 .fill-B5{fill:#edf0fd}.d2-2169868703 .fill-B6{fill:#f7f8fe}.d2-2169868703 .stroke-B1,.d2-2169868703 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h506v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="253" y="38.5" class="text-bold fill-N1 s1">연구가 실제로 세운 것</text></g><text x="711" y="16" class="fill-N1 s1"><tspan x="711" dy="0">그 과정을 일으키는 과제를 시키면</tspan><tspan x="711" dy="17.667">영역 A 가 자주 켜졌다.</tspan><tspan x="711" dy="17.667">조건을 바꿔 가며 여러 번 확인했다</tspan></text><g ><g class="shape"><path d="M0 126h506v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="253" y="164.5" class="text-bold fill-N1 s1">흔히 덧붙는 주장 — 역추론</text></g><text x="730.5" y="142" class="fill-N1 s1"><tspan x="730.5" dy="0">새 실험에서 영역 A 가 켜졌다.</tspan><tspan x="730.5" dy="18.5">그러므로 그 심리 과정이 일어난 것이다</tspan></text><g ><g class="shape"><path d="M0 252h506v292H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="253" y="285" class="fill-N1" style="text-anchor:middle;font-size:28px"><tspan x="253" dy="0">이 뒤집기가 성립하려면</tspan><tspan x="253" dy="32">무엇이 필요한가</tspan></text></g><text x="667" y="268" class="fill-N1 s1"><tspan x="667" dy="0"> </tspan><tspan x="667" dy="16.385"> </tspan><tspan x="667" dy="16.385"> </tspan><tspan x="667" dy="16.385"> </tspan><tspan x="667" dy="16.385">그런데 실제로는 —</tspan><tspan x="667" dy="16.385">넓게 쓰이는 영역일수록</tspan><tspan x="667" dy="16.385">여러 과제에서 켜진다.</tspan><tspan x="667" dy="16.385">어떤 영역들은</tspan><tspan x="667" dy="16.385">아주 많은 종류의</tspan><tspan x="667" dy="16.385">과제에서 켜지며,</tspan><tspan x="667" dy="16.385">바로 그런 영역이</tspan><tspan x="667" dy="16.385">논문에서</tspan><tspan x="667" dy="16.385">가장 자주 인용된다</tspan></text><text x="194" y="620" class="fill-N1 s1"><tspan x="194" dy="0"> </tspan><tspan x="194" dy="16.556">그러므로 정확한 보고는</tspan><tspan x="194" dy="16.556">‘영역 A 의 신호가 조건 사이에 달랐다’ 까지다.</tspan><tspan x="194" dy="16.556"> </tspan><tspan x="194" dy="16.556">역추론을 쓰려면 그 영역이</tspan><tspan x="194" dy="16.556">다른 과제에서 얼마나 켜지는지를</tspan><tspan x="194" dy="16.556">따로 대야 한다.</tspan><tspan x="194" dy="16.556">그 자료를 모아 둔 데이터베이스가</tspan><tspan x="194" dy="16.556">그래서 만들어졌다</tspan></text><text x="696.5" y="620" class="fill-N1 s1"><tspan x="696.5" dy="0">숫자로 보면 어떻게 되는가는</tspan><tspan x="696.5" dy="16.714">이 절의 그림(넓이 그림)에 있다.</tspan><tspan x="696.5" dy="16.714">그 과정에서 70% 켜지고</tspan><tspan x="696.5" dy="16.714">아닌 과제에서도 40% 켜지며</tspan><tspan x="696.5" dy="16.714">그 과정이 30% 라면,</tspan><tspan x="696.5" dy="16.714">켜졌다는 사실이 주는 확신은</tspan><tspan x="696.5" dy="16.714">절반에 못 미친다</tspan></text><g ><g class="shape"><path d="M40 326h190v178H40z" class="stroke-B1 fill-B5 s0"/></g><text x="135" y="380.5" class="text-bold fill-N1 s1"><tspan x="135" dy="0">영역 A 가</tspan><tspan x="135" dy="16.833">‘그 과정에서만’</tspan><tspan x="135" dy="16.833">켜져야 한다.</tspan><tspan x="135" dy="16.833">다른 과제에서도</tspan><tspan x="135" dy="16.833">켜진다면</tspan><tspan x="135" dy="16.833">뒤집기는 무효다</tspan></text></g><g ><g class="shape"><path d="M270 326h196v178H270z" class="stroke-B1 fill-B5 s0"/></g><text x="368" y="364.5" class="text-bold fill-N1 s1"><tspan x="368" dy="0">그리고 그 과정이</tspan><tspan x="368" dy="16.625">얼마나</tspan><tspan x="368" dy="16.625">흔한지(기저율)를</tspan><tspan x="368" dy="16.625">알아야 한다.</tspan><tspan x="368" dy="16.625">드문 과정이면</tspan><tspan x="368" dy="16.625">켜졌다는 사실이</tspan><tspan x="368" dy="16.625">알려 주는 것이</tspan><tspan x="368" dy="16.625">거의 없다</tspan></text></g><marker id="mk-d2-2169868703-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2169868703-2177206569)" d="M507.5 33h55" class="connection stroke-B2 s3" mask="url(#d2-2169868703)"/><path fill="none" marker-end="url(#mk-d2-2169868703-2177206569)" d="M507.5 159h55" class="connection stroke-B2 s3" mask="url(#d2-2169868703)"/><marker id="mk-d2-2169868703-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2169868703-3488378134)" d="M253 68v54" class="connection stroke-B1 s0" mask="url(#d2-2169868703)"/><text x="253" y="102" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">방향이 뒤집혔다</text><path fill="none" marker-end="url(#mk-d2-2169868703-3488378134)" d="M253 194v54" class="connection stroke-B1 s0" mask="url(#d2-2169868703)"/><path fill="none" marker-end="url(#mk-d2-2169868703-2177206569)" d="M507.5 398h55" class="connection stroke-B2 s3" mask="url(#d2-2169868703)"/><path fill="none" marker-end="url(#mk-d2-2169868703-2177206569)" d="M730.5 545.5v55" class="connection stroke-B2 s3" mask="url(#d2-2169868703)"/><path fill="none" marker-end="url(#mk-d2-2169868703-2177206569)" d="M564 678.5h-54" class="connection stroke-B2 s3" mask="url(#d2-2169868703)"/><mask id="d2-2169868703" width="1097" height="955" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H996v955H-101z"/><path d="M182 86h142v21H182z"/></mask></svg>