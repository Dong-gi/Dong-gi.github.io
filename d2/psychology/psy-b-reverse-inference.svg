<svg xmlns="http://www.w3.org/2000/svg" width="1663" height="1244" class="d2-2538548361 d2-svg" viewBox="-101 -101 1663 1244"><rect width="1663" height="1244" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2538548361 .fill-N1{fill:#0a0f25}.d2-2538548361 .fill-B5{fill:#edf0fd}.d2-2538548361 .fill-B6{fill:#f7f8fe}.d2-2538548361 .stroke-B1,.d2-2538548361 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M334 0h235v66H334z" class="stroke-B1 fill-B6 s0"/></g><text x="451.5" y="38.5" class="text-bold fill-N1 s1">연구가 실제로 세운 것</text></g><text x="236" y="218" class="fill-N1 s1"><tspan x="236" dy="0">그 과정을 일으키는 과제를 시키면 영역 A 가 자주 켜졌다.</tspan><tspan x="236" dy="18.5">조건을 바꿔 가며 여러 번 확인했다</tspan></text><g ><g class="shape"><path d="M532 187h270v66H532z" class="stroke-B1 fill-B6 s0"/></g><text x="667" y="225.5" class="text-bold fill-N1 s1">흔히 덧붙는 주장 — 역추론</text></g><text x="171.5" y="442" class="fill-N1 s1"><tspan x="171.5" dy="0">새 실험에서 영역 A 가 켜졌다.</tspan><tspan x="171.5" dy="18.5">그러므로 그 심리 과정이 일어난 것이다</tspan></text><g ><g class="shape"><path d="M386 373h1074v142H386z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="923" y="360" class="fill-N1" style="text-anchor:middle;font-size:28px">이 뒤집기가 성립하려면 무엇이 필요한가</text></g><text x="1163" y="651" class="fill-N1 s1"><tspan x="1163" dy="0">그런데 실제로는 —</tspan><tspan x="1163" dy="17.25">넓게 쓰이는 영역일수록 여러 과제에서 켜진다.</tspan><tspan x="1163" dy="17.25">어떤 영역들은 아주 많은 종류의 과제에서 켜지며,</tspan><tspan x="1163" dy="17.25">바로 그런 영역이 논문에서 가장 자주 인용된다</tspan></text><text x="1162.5" y="820" class="fill-N1 s1"><tspan x="1162.5" dy="0">숫자로 보면 어떻게 되는가는 이 절의 그림(넓이 그림)에 있다.</tspan><tspan x="1162.5" dy="17.667">그 과정에서 70% 켜지고 아닌 과제에서도 40% 켜지며 그 과정이 30% 라면,</tspan><tspan x="1162.5" dy="17.667">켜졌다는 사실이 주는 확신은 절반에 못 미친다</tspan></text><text x="1163" y="973" class="fill-N1 s1"><tspan x="1163" dy="0"> </tspan><tspan x="1163" dy="17">그러므로 정확한 보고는 ‘영역 A 의 신호가 조건 사이에 달랐다’ 까지다.</tspan><tspan x="1163" dy="17"> </tspan><tspan x="1163" dy="17">역추론을 쓰려면 그 영역이 다른 과제에서 얼마나 켜지는지를</tspan><tspan x="1163" dy="17">따로 대야 한다. 그 자료를 모아 둔 데이터베이스가 그래서 만들어졌다</tspan></text><g ><g class="shape"><path d="M416 403h420v82H416z" class="stroke-B1 fill-B5 s0"/></g><text x="626" y="441.5" class="text-bold fill-N1 s1"><tspan x="626" dy="0">영역 A 가 ‘그 과정에서만’ 켜져야 한다.</tspan><tspan x="626" dy="18.5">다른 과제에서도 켜진다면 뒤집기는 무효다</tspan></text></g><g ><g class="shape"><path d="M896 403h534v82H896z" class="stroke-B1 fill-B5 s0"/></g><text x="1163" y="441.5" class="text-bold fill-N1 s1"><tspan x="1163" dy="0">그리고 그 과정이 얼마나 흔한지(기저율)를 알아야 한다.</tspan><tspan x="1163" dy="18.5">드문 과정이면 켜졌다는 사실이 알려 주는 것이 거의 없다</tspan></text></g><marker id="mk-d2-2538548361-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2538548361-2177206569)" d="M373.169 66.304C263.8 114.3 236 141.5 236 197.5" class="connection stroke-B2 s3" mask="url(#d2-2538548361)"/><path fill="none" marker-end="url(#mk-d2-2538548361-2177206569)" d="M530.277 243.328C243.45 291 171.25 367.5 171.25 421.5" class="connection stroke-B2 s3" mask="url(#d2-2538548361)"/><marker id="mk-d2-2538548361-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2538548361-3488378134)" d="M529.831 66.304C639.2 114.3 667 138.7 667 183.5" class="connection stroke-B1 s0" mask="url(#d2-2538548361)"/><text x="623" y="113" style="fill:#676c7e;text-anchor:middle;font-size:16px">방향이 뒤집혔다</text><path fill="none" marker-end="url(#mk-d2-2538548361-3488378134)" d="M803.723 243.328C1090.55 291 1162.75 308.8 1162.75 328" class="connection stroke-B1 s0" mask="url(#d2-2538548361)"/><path fill="none" marker-end="url(#mk-d2-2538548361-2177206569)" d="M1162.75 517v114" class="connection stroke-B2 s3" mask="url(#d2-2538548361)"/><path fill="none" marker-end="url(#mk-d2-2538548361-2177206569)" d="M1162.75 706v94" class="connection stroke-B2 s3" mask="url(#d2-2538548361)"/><path fill="none" marker-end="url(#mk-d2-2538548361-2177206569)" d="M1162.75 859v94" class="connection stroke-B2 s3" mask="url(#d2-2538548361)"/><mask id="d2-2538548361" width="1663" height="1244" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1663v1244H-101z"/><path d="M552 97h142v21H552z"/></mask></svg>