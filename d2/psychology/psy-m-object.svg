<svg xmlns="http://www.w3.org/2000/svg" width="1553" height="733" class="d2-163838374 d2-svg" viewBox="-101 -101 1553 733"><rect width="1553" height="733" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-163838374 .fill-N1{fill:#0a0f25}.d2-163838374 .fill-N2{fill:#676c7e}.d2-163838374 .fill-B6{fill:#f7f8fe}.d2-163838374 .stroke-B1,.d2-163838374 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 214h457v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="228.5" y="252.5" class="text-bold fill-N1 s1"><tspan x="228.5" dy="0">직접 볼 수 있는 것</tspan><tspan x="228.5" dy="17.667">말한 문장 · 누른 단추 · 걸린 시간 · 눈이 머문 자리</tspan><tspan x="228.5" dy="17.667">심장박동 · 호르몬 농도 · 뇌 활동의 대리 지표</tspan></text></g><g ><g class="shape"><path d="M99 433h429v98H99z" class="stroke-B1 fill-B6 s0"/></g><text x="313.5" y="471.5" class="text-bold fill-N1 s1"><tspan x="313.5" dy="0">직접 볼 수 없는 것</tspan><tspan x="313.5" dy="17.667">기억 · 주의 · 의도 · 정서 · 태도 · 성격</tspan><tspan x="313.5" dy="17.667">‘속에서 일어나는 일’ 이라고 부르는 것 전부</tspan></text></g><g ><g class="shape"><path d="M197 0h601v114H197z" class="stroke-B1 fill-B6 s0"/></g><text x="497.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="497.5" dy="0">둘을 잇는 장치</tspan><tspan x="497.5" dy="17.25">조작적 정의 — 무엇을 세면 그것을 잰 것으로 칠지 미리 못 박는다.</tspan><tspan x="497.5" dy="17.25">측정 모형 — 여러 지표가 같은 것을 가리키는지 확인한다.</tspan><tspan x="497.5" dy="17.25">실험 설계 — 무엇이 그 값을 움직이는지 확인한다</tspan></text></g><text x="944" y="245" class="fill-N1 s1"><tspan x="944" dy="0"> </tspan><tspan x="944" dy="17.25">여기가 이 학문의 고비다.</tspan><tspan x="944" dy="17.25">물리학도 전자를 직접 보지 않지만, 심리학은 재는 대상이 재는 일을 알아채고 그 때문에 달라진다.</tspan><tspan x="944" dy="17.25">4장과 5장이 이 문제를 정면으로 다룬다</tspan></text><marker id="mk-d2-163838374-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-163838374-3488378134)" d="M194.634 313.16c-31.684 47.14-22.484 71.54 43.84 118.044" class="connection stroke-B1 s0" mask="url(#d2-163838374)"/><text x="172.5" y="390" class="text-italic fill-N2 s1">추론한다</text><path fill="none" marker-end="url(#mk-d2-163838374-3488378134)" d="M313.25 431.5c0-46.8-9.4-71.2-44.559-116.831" class="connection stroke-B1 s0" mask="url(#d2-163838374)"/><text x="306" y="372" class="text-italic fill-N2 s1">예측을 내놓는다</text><marker id="mk-d2-163838374-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-163838374-2177206569)" d="M351.643 114.743C253.5 154 228.5 174 228.5 210" class="connection stroke-B2 s3" mask="url(#d2-163838374)"/><path fill="none" marker-end="url(#mk-d2-163838374-2177206569)" d="M497 116v97.5c0 29.7-20.2 171.2-97.576 217.932" class="connection stroke-B2 s3" mask="url(#d2-163838374)"/><path fill="none" marker-end="url(#mk-d2-163838374-2177206569)" d="M736.945 114.465C902.2 154 944 176.9 944 224.5" class="connection stroke-B2 s3" mask="url(#d2-163838374)"/><mask id="d2-163838374" width="1553" height="733" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1553v733H-101z"/><path d="M132 374h81v21h-81zM235 356h142v21H235z"/></mask></svg>