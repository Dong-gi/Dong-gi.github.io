<svg xmlns="http://www.w3.org/2000/svg" width="913" height="845" class="d2-420397213 d2-svg" viewBox="-101 -101 913 845"><rect width="913" height="845" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-420397213 .text-bold{font-weight:700}.d2-420397213 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-420397213 .fill-N1{fill:#0a0f25}.d2-420397213 .fill-N2{fill:#676c7e}.d2-420397213 .fill-B6{fill:#f7f8fe}.d2-420397213 .stroke-B1,.d2-420397213 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 262h267v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="133.5" y="300.5" class="text-bold fill-N1 s1"><tspan x="133.5" dy="0">직접 볼 수 있는 것</tspan><tspan x="133.5" dy="17">말한 문장 · 누른 단추 ·</tspan><tspan x="133.5" dy="17">걸린 시간 · 눈이 머문 자리</tspan><tspan x="133.5" dy="17">심장박동 · 호르몬 농도 ·</tspan><tspan x="133.5" dy="17">뇌 활동의 대리 지표</tspan></text></g><g ><g class="shape"><path d="M58 513h298v130H58z" class="stroke-B1 fill-B6 s0"/></g><text x="207" y="551.5" class="text-bold fill-N1 s1"><tspan x="207" dy="0">직접 볼 수 없는 것</tspan><tspan x="207" dy="17">기억 · 주의 · 의도 ·</tspan><tspan x="207" dy="17">정서 · 태도 · 성격</tspan><tspan x="207" dy="17">‘속에서 일어나는 일’ 이라고</tspan><tspan x="207" dy="17">부르는 것 전부</tspan></text></g><g ><g class="shape"><path d="M158 0h371v162H158z" class="stroke-B1 fill-B6 s0"/></g><text x="343.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="343.5" dy="0">둘을 잇는 장치</tspan><tspan x="343.5" dy="16.714">조작적 정의 — 무엇을 세면</tspan><tspan x="343.5" dy="16.714">그것을 잰 것으로 칠지 미리 못 박는다.</tspan><tspan x="343.5" dy="16.714">측정 모형 — 여러 지표가</tspan><tspan x="343.5" dy="16.714">같은 것을 가리키는지 확인한다.</tspan><tspan x="343.5" dy="16.714">실험 설계 — 무엇이</tspan><tspan x="343.5" dy="16.714">그 값을 움직이는지 확인한다</tspan></text></g><text x="547.5" y="285" class="fill-N1 s1"><tspan x="547.5" dy="0"> </tspan><tspan x="547.5" dy="16.714">여기가 이 학문의 고비다.</tspan><tspan x="547.5" dy="16.714">물리학도 전자를 직접 보지 않지만,</tspan><tspan x="547.5" dy="16.714">심리학은 재는 대상이</tspan><tspan x="547.5" dy="16.714">재는 일을 알아채고</tspan><tspan x="547.5" dy="16.714">그 때문에 달라진다.</tspan><tspan x="547.5" dy="16.714">4장과 5장이 이 문제를 정면으로 다룬다</tspan></text><marker id="mk-d2-420397213-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-420397213-3488378134)" d="M94.733 393.222C66.95 440.3 73.75 464.7 126.734 510.872" class="connection stroke-B1 s0" mask="url(#d2-420397213)"/><text x="72.5" y="466" class="text-italic fill-N2 s1">추론한다</text><path fill="none" marker-end="url(#mk-d2-420397213-3488378134)" d="M207.25 511.5c0-46.8-7.2-71.2-33.967-116.555" class="connection stroke-B1 s0" mask="url(#d2-420397213)"/><text x="203" y="454" class="text-italic fill-N2 s1">예측을 내놓는다</text><marker id="mk-d2-420397213-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-420397213-2177206569)" d="M211.804 163.06C149.5 202 133.5 222 133.5 258" class="connection stroke-B2 s3" mask="url(#d2-420397213)"/><path fill="none" marker-end="url(#mk-d2-420397213-2177206569)" d="M343.5 164v105.5c0 34.5-13 195.2-62.083 241.263" class="connection stroke-B2 s3" mask="url(#d2-420397213)"/><path fill="none" marker-end="url(#mk-d2-420397213-2177206569)" d="M470.684 163.08C531.4 202 547 223.3 547 264.5" class="connection stroke-B2 s3" mask="url(#d2-420397213)"/><mask id="d2-420397213" width="913" height="845" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h913v845h-913z"/><path d="M32 450h81v21H32zM132 438h142v21H132z"/></mask></svg>