<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1081" class="d2-174388525 d2-svg" viewBox="-91 -101 1480 1081"><rect width="1480" height="1081" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-174388525 .fill-N1{fill:#0a0f25}.d2-174388525 .fill-B4{fill:#e3e9fd}.d2-174388525 .fill-B5{fill:#edf0fd}.d2-174388525 .stroke-B1,.d2-174388525 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="629.5" cy="51" class="shape stroke-B1" rx="153.5" ry="51" style="fill:#f7f8fe;stroke-width:2"/></g><text x="629.5" y="56.5" class="text-bold fill-N1 s0">‘의식이 있다’ 는 말</text></g><g ><g class="shape"><path d="M10 230h361v348H10z" class="stroke-B1 fill-B4 s1"/></g><text x="190.5" y="189" class="fill-N1 s2"><tspan x="190.5" dy="0">1. 수준 —</tspan><tspan x="190.5" dy="32">얼마나 깨어 있는가</tspan></text></g><g ><g class="shape"><path d="M411 222h437v356H411z" class="stroke-B1 fill-B4 s1"/></g><text x="629.5" y="181" class="fill-N1 s2"><tspan x="629.5" dy="0">2. 내용 —</tspan><tspan x="629.5" dy="32">무엇을 의식하고 있는가</tspan></text></g><g ><g class="shape"><path d="M888 222h400v356H888z" class="stroke-B1 fill-B4 s1"/></g><text x="1088" y="181" class="fill-N1 s2"><tspan x="1088" dy="0">3. 자기의식 —</tspan><tspan x="1088" dy="32">자기를 대상으로 삼는가</tspan></text></g><text x="410" y="714" class="fill-N1 s0"><tspan x="410" dy="0"> </tspan><tspan x="410" dy="16.455">섞으면 생기는 일 —</tspan><tspan x="410" dy="16.455">‘의식이 있다’ 는 말을 수준의 뜻으로 쓰다가</tspan><tspan x="410" dy="16.455">내용의 뜻으로 옮겨 가면,</tspan><tspan x="410" dy="16.455">서로 다른 두 물음이 하나로 보인다.</tspan><tspan x="410" dy="16.455"> </tspan><tspan x="410" dy="16.455">예를 들어 ‘잠든 사람에게 의식이 있는가’ 는</tspan><tspan x="410" dy="16.455">수준을 묻는 것 같지만,</tspan><tspan x="410" dy="16.455">REM 수면 중에 꿈을 꾸는 사람은</tspan><tspan x="410" dy="16.455">수준은 낮고 내용은 풍부하다.</tspan><tspan x="410" dy="16.455">두 갈래가 함께 움직이지 않는다는 것 자체가 자료다</tspan></text><text x="1088.5" y="762" class="fill-N1 s0"><tspan x="1088.5" dy="0"> </tspan><tspan x="1088.5" dy="17">이 문서가 다루지 않는 것 —</tspan><tspan x="1088.5" dy="17">‘의식이 무엇인가’ 라는 존재론의 물음.</tspan><tspan x="1088.5" dy="17">그것은 철학 문서의 몫이다.</tspan><tspan x="1088.5" dy="17">여기서 묻는 것은 ‘어떻게 재는가’ 다</tspan></text><g ><g class="shape"><path d="M47 260h287v82H47z" class="stroke-B1 fill-B5 s1"/></g><text x="190.5" y="298.5" class="text-bold fill-N1 s0"><tspan x="190.5" dy="0">깊은 잠 · 얕은 잠 ·</tspan><tspan x="190.5" dy="18.5">멍한 상태 · 또렷하게 깬 상태</tspan></text></g><g ><g class="shape"><path d="M40 450h301v98H40z" class="stroke-B1 fill-B5 s1"/></g><text x="190.5" y="488.5" class="text-bold fill-N1 s0"><tspan x="190.5" dy="0">재는 법 — 뇌파, 눈 움직임,</tspan><tspan x="190.5" dy="17.667">자극에 대한 반응, 행동 관찰.</tspan><tspan x="190.5" dy="17.667">‘바깥에서 잴 수 있는 쪽’이다</tspan></text></g><g ><g class="shape"><path d="M441 252h377v98H441z" class="stroke-B1 fill-B5 s1"/></g><text x="629.5" y="290.5" class="text-bold fill-N1 s0"><tspan x="629.5" dy="0">지금 눈앞의 이것은 의식되고</tspan><tspan x="629.5" dy="17.667">저것은 의식되지 않는다.</tspan><tspan x="629.5" dy="17.667">12장의 주의와 곧바로 이어지는 갈래다</tspan></text></g><g ><g class="shape"><path d="M446 450h368v98H446z" class="stroke-B1 fill-B5 s1"/></g><text x="630" y="488.5" class="text-bold fill-N1 s0"><tspan x="630" dy="0">재는 법 — 본인의 보고.</tspan><tspan x="630" dy="17.667">그리고 보고를 대신할 만한 간접 지표.</tspan><tspan x="630" dy="17.667">‘보고에 기댈 수밖에 없는 쪽’이다</tspan></text></g><g ><g class="shape"><path d="M936 252h305v98H936z" class="stroke-B1 fill-B5 s1"/></g><text x="1088.5" y="290.5" class="text-bold fill-N1 s0"><tspan x="1088.5" dy="0">지금 내가 무엇을 하고 있는지,</tspan><tspan x="1088.5" dy="17.667">어떤 상태인지를</tspan><tspan x="1088.5" dy="17.667">스스로 대상으로 삼는 일</tspan></text></g><g ><g class="shape"><path d="M918 450h340v98H918z" class="stroke-B1 fill-B5 s1"/></g><text x="1088" y="488.5" class="text-bold fill-N1 s0"><tspan x="1088" dy="0">재는 법 — 과제를 만들어 재지만,</tspan><tspan x="1088" dy="17.667">과제가 재는 것이 정말 이것인지가</tspan><tspan x="1088" dy="17.667">5장의 구성 타당도 문제로 남는다</tspan></text></g><marker id="mk-d2-174388525-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-174388525-3488378134)" d="M190.5 344v102" class="connection stroke-B1 s1" mask="url(#d2-174388525)"/><path fill="none" marker-end="url(#mk-d2-174388525-3488378134)" d="M629.5 352v94" class="connection stroke-B1 s1" mask="url(#d2-174388525)"/><path fill="none" marker-end="url(#mk-d2-174388525-3488378134)" d="M1088 352v94" class="connection stroke-B1 s1" mask="url(#d2-174388525)"/><path fill="none" marker-end="url(#mk-d2-174388525-3488378134)" d="m501.064 80.502-306.692 79.494" class="connection stroke-B1 s1" mask="url(#d2-174388525)"/><path fill="none" marker-end="url(#mk-d2-174388525-3488378134)" d="m629.98 104-.44 45" class="connection stroke-B1 s1" mask="url(#d2-174388525)"/><path fill="none" marker-end="url(#mk-d2-174388525-3488378134)" d="m758.952 79.436 325.144 72.691" class="connection stroke-B1 s1" mask="url(#d2-174388525)"/><marker id="mk-d2-174388525-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-174388525-2177206569)" d="M190.5 580c0 54 15.6 78 74.632 115.841" class="connection stroke-B2 s4" mask="url(#d2-174388525)"/><path fill="none" marker-end="url(#mk-d2-174388525-2177206569)" d="M629.5 580c0 54-15.6 78-74.632 115.841" class="connection stroke-B2 s4" mask="url(#d2-174388525)"/><path fill="none" marker-end="url(#mk-d2-174388525-2177206569)" d="M1088 580v162" class="connection stroke-B2 s4" mask="url(#d2-174388525)"/><mask id="d2-174388525" width="1480" height="1081" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1480V980H-91z"/></mask></svg>