<svg xmlns="http://www.w3.org/2000/svg" width="1121" height="1257" class="d2-3290039913 d2-svg" viewBox="-91 -101 1121 1257"><rect width="1121" height="1257" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.d2-3290039913 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3290039913 .fill-N1{fill:#0a0f25}.d2-3290039913 .fill-B4{fill:#e3e9fd}.d2-3290039913 .fill-B5{fill:#edf0fd}.d2-3290039913 .stroke-B1,.d2-3290039913 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="449.5" cy="51" class="shape stroke-B1" rx="153.5" ry="51" style="fill:#f7f8fe;stroke-width:2"/></g><text x="449.5" y="56.5" class="text-bold fill-N1 s0">‘의식이 있다’ 는 말</text></g><g ><g class="shape"><path d="M10 246h258v436H10z" class="stroke-B1 fill-B4 s1"/></g><text x="139" y="177" class="fill-N1 s2"><tspan x="139" dy="0">1. 수준 —</tspan><tspan x="139" dy="30.667">얼마나</tspan><tspan x="139" dy="30.667">깨어 있는가</tspan></text></g><g ><g class="shape"><path d="M308 222h283v468H308z" class="stroke-B1 fill-B4 s1"/></g><text x="449.5" y="153" class="fill-N1 s2"><tspan x="449.5" dy="0">2. 내용 —</tspan><tspan x="449.5" dy="30.667">무엇을 의식하고</tspan><tspan x="449.5" dy="30.667">있는가</tspan></text></g><g ><g class="shape"><path d="M631 230h298v452H631z" class="stroke-B1 fill-B4 s1"/></g><text x="780" y="161" class="fill-N1 s2"><tspan x="780" dy="0">3. 자기의식 —</tspan><tspan x="780" dy="30.667">자기를 대상으로</tspan><tspan x="780" dy="30.667">삼는가</tspan></text></g><text x="294" y="826" class="fill-N1 s0"><tspan x="294" dy="0"> </tspan><tspan x="294" dy="16.333">섞으면 생기는 일 —</tspan><tspan x="294" dy="16.333">‘의식이 있다’ 는 말을</tspan><tspan x="294" dy="16.333">수준의 뜻으로 쓰다가</tspan><tspan x="294" dy="16.333">내용의 뜻으로 옮겨 가면,</tspan><tspan x="294" dy="16.333">서로 다른 두 물음이</tspan><tspan x="294" dy="16.333">하나로 보인다.</tspan><tspan x="294" dy="16.333"> </tspan><tspan x="294" dy="16.333">예를 들어</tspan><tspan x="294" dy="16.333">‘잠든 사람에게 의식이 있는가’ 는</tspan><tspan x="294" dy="16.333">수준을 묻는 것 같지만,</tspan><tspan x="294" dy="16.333">REM 수면 중에 꿈을 꾸는 사람은</tspan><tspan x="294" dy="16.333">수준은 낮고 내용은 풍부하다.</tspan><tspan x="294" dy="16.333">두 갈래가 함께 움직이지 않는다는</tspan><tspan x="294" dy="16.333">것 자체가 자료다</tspan></text><text x="780" y="890" class="fill-N1 s0"><tspan x="780" dy="0"> </tspan><tspan x="780" dy="16.714">이 문서가 다루지 않는 것 —</tspan><tspan x="780" dy="16.714">‘의식이 무엇인가’ 라는</tspan><tspan x="780" dy="16.714">존재론의 물음.</tspan><tspan x="780" dy="16.714">그것은 철학 문서의 몫이다.</tspan><tspan x="780" dy="16.714">여기서 묻는 것은</tspan><tspan x="780" dy="16.714">‘어떻게 재는가’ 다</tspan></text><g ><g class="shape"><path d="M44 276h191v98H44z" class="stroke-B1 fill-B5 s1"/></g><text x="139.5" y="314.5" class="text-bold fill-N1 s0"><tspan x="139.5" dy="0">깊은 잠 · 얕은 잠 ·</tspan><tspan x="139.5" dy="17.667">멍한 상태 ·</tspan><tspan x="139.5" dy="17.667">또렷하게 깬 상태</tspan></text></g><g ><g class="shape"><path d="M40 506h198v146H40z" class="stroke-B1 fill-B5 s1"/></g><text x="139" y="544.5" class="text-bold fill-N1 s0"><tspan x="139" dy="0">재는 법 —</tspan><tspan x="139" dy="16.833">뇌파, 눈 움직임,</tspan><tspan x="139" dy="16.833">자극에 대한 반응,</tspan><tspan x="139" dy="16.833">행동 관찰.</tspan><tspan x="139" dy="16.833">‘바깥에서 잴 수</tspan><tspan x="139" dy="16.833">있는 쪽’이다</tspan></text></g><g ><g class="shape"><path d="M344 252h212v146H344z" class="stroke-B1 fill-B5 s1"/></g><text x="450" y="290.5" class="text-bold fill-N1 s0"><tspan x="450" dy="0">지금 눈앞의 이것은</tspan><tspan x="450" dy="16.833">의식되고 저것은</tspan><tspan x="450" dy="16.833">의식되지 않는다.</tspan><tspan x="450" dy="16.833">12장의 주의와</tspan><tspan x="450" dy="16.833">곧바로 이어지는</tspan><tspan x="450" dy="16.833">갈래다</tspan></text></g><g ><g class="shape"><path d="M338 498h223v162H338z" class="stroke-B1 fill-B5 s1"/></g><text x="449.5" y="536.5" class="text-bold fill-N1 s0"><tspan x="449.5" dy="0">재는 법 —</tspan><tspan x="449.5" dy="16.714">본인의 보고.</tspan><tspan x="449.5" dy="16.714">그리고 보고를</tspan><tspan x="449.5" dy="16.714">대신할 만한</tspan><tspan x="449.5" dy="16.714">간접 지표.</tspan><tspan x="449.5" dy="16.714">‘보고에 기댈 수밖에</tspan><tspan x="449.5" dy="16.714">없는 쪽’이다</tspan></text></g><g ><g class="shape"><path d="M671 260h218v130H671z" class="stroke-B1 fill-B5 s1"/></g><text x="780" y="298.5" class="text-bold fill-N1 s0"><tspan x="780" dy="0">지금 내가</tspan><tspan x="780" dy="17">무엇을 하고 있는지,</tspan><tspan x="780" dy="17">어떤 상태인지를</tspan><tspan x="780" dy="17">스스로 대상으로</tspan><tspan x="780" dy="17">삼는 일</tspan></text></g><g ><g class="shape"><path d="M661 506h238v146H661z" class="stroke-B1 fill-B5 s1"/></g><text x="780" y="544.5" class="text-bold fill-N1 s0"><tspan x="780" dy="0">재는 법 —</tspan><tspan x="780" dy="16.833">과제를 만들어 재지만,</tspan><tspan x="780" dy="16.833">과제가 재는 것이</tspan><tspan x="780" dy="16.833">정말 이것인지가</tspan><tspan x="780" dy="16.833">5장의 구성 타당도</tspan><tspan x="780" dy="16.833">문제로 남는다</tspan></text></g><marker id="mk-d2-3290039913-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3290039913-3488378134)" d="M139 376v126" class="connection stroke-B1 s1" mask="url(#d2-3290039913)"/><path fill="none" marker-end="url(#mk-d2-3290039913-3488378134)" d="M449.5 400v94" class="connection stroke-B1 s1" mask="url(#d2-3290039913)"/><path fill="none" marker-end="url(#mk-d2-3290039913-3488378134)" d="M780 392v110" class="connection stroke-B1 s1" mask="url(#d2-3290039913)"/><path fill="none" marker-end="url(#mk-d2-3290039913-3488378134)" d="m338.097 87.615-186.29 60.156" class="connection stroke-B1 s1" mask="url(#d2-3290039913)"/><path fill="none" marker-end="url(#mk-d2-3290039913-3488378134)" d="M450 104v17" class="connection stroke-B1 s1" mask="url(#d2-3290039913)"/><path fill="none" marker-end="url(#mk-d2-3290039913-3488378134)" d="m563.914 86.58 149.258 45.26" class="connection stroke-B1 s1" mask="url(#d2-3290039913)"/><marker id="mk-d2-3290039913-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3290039913-2177206569)" d="M139 684c0 60.4 9 86 42.324 123.027" class="connection stroke-B2 s4" mask="url(#d2-3290039913)"/><path fill="none" marker-end="url(#mk-d2-3290039913-2177206569)" d="M449.5 692c0 54-9 78-42.324 115.027" class="connection stroke-B2 s4" mask="url(#d2-3290039913)"/><path fill="none" marker-end="url(#mk-d2-3290039913-2177206569)" d="M780 684v186" class="connection stroke-B2 s4" mask="url(#d2-3290039913)"/><mask id="d2-3290039913" width="1121" height="1257" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1121v1257H-91z"/></mask></svg>