<svg xmlns="http://www.w3.org/2000/svg" width="2202" height="985" class="d2-2660422481 d2-svg" viewBox="-91 -101 2202 985"><rect width="2202" height="985" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2660422481 .fill-N1{fill:#0a0f25}.d2-2660422481 .fill-B4{fill:#e3e9fd}.d2-2660422481 .fill-B5{fill:#edf0fd}.d2-2660422481 .stroke-B1,.d2-2660422481 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="932.5" cy="51" class="shape stroke-B1" rx="153.5" ry="51" style="fill:#f7f8fe;stroke-width:2"/></g><text x="932.5" y="56.5" class="text-bold fill-N1 s0">‘의식이 있다’ 는 말</text></g><g ><g class="shape"><path d="M10 230h571v316H10z" class="stroke-B1 fill-B4 s1"/></g><text x="295.5" y="217" class="fill-N1 s2">1. 수준 — 얼마나 깨어 있는가</text></g><g ><g class="shape"><path d="M621 222h622v324H621z" class="stroke-B1 fill-B4 s1"/></g><text x="932" y="209" class="fill-N1 s2">2. 내용 — 무엇을 의식하고 있는가</text></g><g ><g class="shape"><path d="M1283 230h727v316h-727z" class="stroke-B1 fill-B4 s1"/></g><text x="1646.5" y="217" class="fill-N1 s2">3. 자기의식 — 자기를 대상으로 삼는가</text></g><text x="613.5" y="682" class="fill-N1 s0"><tspan x="613.5" dy="0"> </tspan><tspan x="613.5" dy="16.714">섞으면 생기는 일 — ‘의식이 있다’ 는 말을 수준의 뜻으로 쓰다가</tspan><tspan x="613.5" dy="16.714">내용의 뜻으로 옮겨 가면, 서로 다른 두 물음이 하나로 보인다.</tspan><tspan x="613.5" dy="16.714"> </tspan><tspan x="613.5" dy="16.714">예를 들어 ‘잠든 사람에게 의식이 있는가’ 는 수준을 묻는 것 같지만,</tspan><tspan x="613.5" dy="16.714">REM 수면 중에 꿈을 꾸는 사람은 수준은 낮고 내용은 풍부하다.</tspan><tspan x="613.5" dy="16.714">두 갈래가 함께 움직이지 않는다는 것 자체가 자료다</tspan></text><text x="1646.5" y="714" class="fill-N1 s0"><tspan x="1646.5" dy="0"> </tspan><tspan x="1646.5" dy="17.667">이 문서가 다루지 않는 것 — ‘의식이 무엇인가’ 라는 존재론의 물음.</tspan><tspan x="1646.5" dy="17.667">그것은 철학 문서의 몫이다. 여기서 묻는 것은 ‘어떻게 재는가’ 다</tspan></text><g ><g class="shape"><path d="M77 260h437v66H77z" class="stroke-B1 fill-B5 s1"/></g><text x="295.5" y="298.5" class="text-bold fill-N1 s0">깊은 잠 · 얕은 잠 · 멍한 상태 · 또렷하게 깬 상태</text></g><g ><g class="shape"><path d="M40 434h511v82H40z" class="stroke-B1 fill-B5 s1"/></g><text x="295.5" y="472.5" class="text-bold fill-N1 s0"><tspan x="295.5" dy="0">재는 법 — 뇌파, 눈 움직임, 자극에 대한 반응, 행동 관찰.</tspan><tspan x="295.5" dy="18.5">‘바깥에서 잴 수 있는 쪽’이다</tspan></text></g><g ><g class="shape"><path d="M676 252h513v82H676z" class="stroke-B1 fill-B5 s1"/></g><text x="932.5" y="290.5" class="text-bold fill-N1 s0"><tspan x="932.5" dy="0">지금 눈앞의 이것은 의식되고 저것은 의식되지 않는다.</tspan><tspan x="932.5" dy="18.5">12장의 주의와 곧바로 이어지는 갈래다</tspan></text></g><g ><g class="shape"><path d="M651 434h562v82H651z" class="stroke-B1 fill-B5 s1"/></g><text x="932" y="472.5" class="text-bold fill-N1 s0"><tspan x="932" dy="0">재는 법 — 본인의 보고. 그리고 보고를 대신할 만한 간접 지표.</tspan><tspan x="932" dy="18.5">‘보고에 기댈 수밖에 없는 쪽’이다</tspan></text></g><g ><g class="shape"><path d="M1313 260h667v66h-667z" class="stroke-B1 fill-B5 s1"/></g><text x="1646.5" y="298.5" class="text-bold fill-N1 s0">지금 내가 무엇을 하고 있는지, 어떤 상태인지를 스스로 대상으로 삼는 일</text></g><g ><g class="shape"><path d="M1338 434h617v82h-617z" class="stroke-B1 fill-B5 s1"/></g><text x="1646.5" y="472.5" class="text-bold fill-N1 s0"><tspan x="1646.5" dy="0">재는 법 — 과제를 만들어 재지만, 과제가 재는 것이 정말 이것인지가</tspan><tspan x="1646.5" dy="18.5">5장의 구성 타당도 문제로 남는다</tspan></text></g><marker id="mk-d2-2660422481-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2660422481-3488378134)" d="M295.5 328v102" class="connection stroke-B1 s1" mask="url(#d2-2660422481)"/><path fill="none" marker-end="url(#mk-d2-2660422481-3488378134)" d="M932 336v94" class="connection stroke-B1 s1" mask="url(#d2-2660422481)"/><path fill="none" marker-end="url(#mk-d2-2660422481-3488378134)" d="M1646.5 328v102" class="connection stroke-B1 s1" mask="url(#d2-2660422481)"/><path fill="none" marker-end="url(#mk-d2-2660422481-3488378134)" d="M792.025 73.313C395.2 136.2 295.5 159.4 295.5 185" class="connection stroke-B1 s1" mask="url(#d2-2660422481)"/><path fill="none" marker-end="url(#mk-d2-2660422481-3488378134)" d="M932 104v73" class="connection stroke-B1 s1" mask="url(#d2-2660422481)"/><path fill="none" marker-end="url(#mk-d2-2660422481-3488378134)" d="M1074.98 71.28C1531.8 135.8 1646.5 159.4 1646.5 185" class="connection stroke-B1 s1" mask="url(#d2-2660422481)"/><marker id="mk-d2-2660422481-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2660422481-2177206569)" d="M295.5 548c0 54 29.4 78 143.213 116.712" class="connection stroke-B2 s4" mask="url(#d2-2660422481)"/><path fill="none" marker-end="url(#mk-d2-2660422481-2177206569)" d="M932 548c0 54-29.4 78-143.213 116.712" class="connection stroke-B2 s4" mask="url(#d2-2660422481)"/><path fill="none" marker-end="url(#mk-d2-2660422481-2177206569)" d="M1646.5 548v146" class="connection stroke-B2 s4" mask="url(#d2-2660422481)"/><mask id="d2-2660422481" width="2202" height="985" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h2202v985H-91z"/></mask></svg>