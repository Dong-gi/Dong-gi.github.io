<svg xmlns="http://www.w3.org/2000/svg" width="907" height="1912" class="d2-2591600194 d2-svg" viewBox="-100 -121 907 1912"><rect width="907" height="1912" x="-100" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2591600194 .fill-N1{fill:#0a0f25}.d2-2591600194 .fill-N2{fill:#676c7e}.d2-2591600194 .fill-B4{fill:#e3e9fd}.d2-2591600194 .fill-B5{fill:#edf0fd}.d2-2591600194 .stroke-B1,.d2-2591600194 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><path d="M1 20h497v345H1z" class="stroke-B1 fill-B4 s0"/></g><text x="249.5" y="7" class="fill-N1 s1">조건형성 전</text></g><g ><g class="shape"><path d="M256 505h201v511H256z" class="stroke-B1 fill-B4 s0"/></g><text x="356.5" y="492" class="fill-N1 s1">조건형성 중 — 여러 번 되풀이한다</text></g><g ><g class="shape"><path d="M228 1156h258v345H228z" class="stroke-B1 fill-B4 s0"/></g><text x="357" y="1143" class="fill-N1 s1">조건형성 후</text></g><text x="356.5" y="1637" class="fill-N1 s2"><tspan x="356.5" dy="0"> </tspan><tspan x="356.5" dy="17.25">용어가 헷갈리는 자리 — ‘무조건’ 은 강하다는 뜻이 아니라 배우지 않았다는 뜻이고,</tspan><tspan x="356.5" dy="17.25">‘조건’ 은 약하다는 뜻이 아니라 배운 것이라는 뜻이다.</tspan><tspan x="356.5" dy="17.25">그리고 조건반응이 무조건반응과 똑같은 것도 아니다. 대개 더 작고, 다른 데가 있다</tspan></text><g ><g class="shape"><path d="M40 50h145v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="112.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="112.5" dy="0">무조건자극</tspan><tspan x="112.5" dy="18.5">먹이</tspan></text></g><g ><g class="shape"><path d="M40 253h145v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="112.5" y="291.5" class="text-bold fill-N1 s2"><tspan x="112.5" dy="0">무조건반응</tspan><tspan x="112.5" dy="18.5">침</tspan></text></g><g ><g class="shape"><path d="M295 50h124v82H295z" class="stroke-B1 fill-B5 s0"/></g><text x="357" y="88.5" class="text-bold fill-N1 s2"><tspan x="357" dy="0">중성자극</tspan><tspan x="357" dy="18.5">종소리</tspan></text></g><g ><g class="shape"><path d="M245 253h223v82H245z" class="stroke-B2 fill-B5 s3"/></g><text x="356.5" y="291.5" class="text-bold fill-N1 s2"><tspan x="356.5" dy="0">반응 없음</tspan><tspan x="356.5" dy="18.5">(귀를 기울이는 정도)</tspan></text></g><g ><g class="shape"><path d="M305 535h104v82H305z" class="stroke-B1 fill-B5 s0"/></g><text x="357" y="573.5" class="text-bold fill-N1 s2"><tspan x="357" dy="0">종소리</tspan><tspan x="357" dy="18.5">(먼저)</tspan></text></g><g ><g class="shape"><path d="M309 738h95v82h-95z" class="stroke-B1 fill-B5 s0"/></g><text x="356.5" y="776.5" class="text-bold fill-N1 s2"><tspan x="356.5" dy="0">먹이</tspan><tspan x="356.5" dy="18.5">(뒤에)</tspan></text></g><g ><g class="shape"><path d="M325 920h64v66h-64z" class="stroke-B1 fill-B5 s0"/></g><text x="357" y="958.5" class="text-bold fill-N1 s2">침</text></g><g ><g class="shape"><path d="M295 1186h124v82H295z" class="stroke-B1 fill-B5 s0"/></g><text x="357" y="1224.5" class="text-bold fill-N1 s2"><tspan x="357" dy="0">조건자극</tspan><tspan x="357" dy="18.5">종소리</tspan></text></g><g ><g class="shape"><path d="M295 1389h124v82H295z" class="stroke-B1 fill-B5 s0"/></g><text x="357" y="1427.5" class="text-bold fill-N1 s2"><tspan x="357" dy="0">조건반응</tspan><tspan x="357" dy="18.5">침</tspan></text></g><marker id="mk-d2-2591600194-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-2591600194-3488378134)" d="M112.5 133.5v116" class="connection stroke-B1 s0" mask="url(#d2-2591600194)"/><text x="113" y="198" class="text-italic fill-N2 s2">배운 적 없이 나온다</text><path fill="none" marker-end="url(#mk-d2-2591600194-3488378134)" d="M356.5 133.5v116" class="connection stroke-B1 s0" mask="url(#d2-2591600194)"/><p