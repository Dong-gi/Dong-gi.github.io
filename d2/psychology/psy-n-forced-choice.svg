<svg xmlns="http://www.w3.org/2000/svg" width="1627" height="1265" class="d2-3115250660 d2-svg" viewBox="-91 -101 1627 1265"><rect width="1627" height="1265" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3115250660 .fill-N1{fill:#0a0f25}.d2-3115250660 .fill-B4{fill:#e3e9fd}.d2-3115250660 .fill-B5{fill:#edf0fd}.d2-3115250660 .stroke-B1,.d2-3115250660 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="716" cy="41" class="shape stroke-B1" rx="123" ry="41" style="fill:#f7f8fe;stroke-width:2"/></g><text x="716" y="46.5" class="text-bold fill-N1 s0">같은 사진 한 장</text></g><g ><g class="shape"><path d="M10 202h680v664H10z" class="stroke-B1 fill-B4 s1"/></g><text x="350" y="189" class="fill-N1 s2">강제선택형</text></g><g ><g class="shape"><path d="M730 202h705v672H730z" class="stroke-B1 fill-B4 s1"/></g><text x="1082.5" y="189" class="fill-N1 s2">자유 응답형</text></g><text x="716.5" y="1010" class="fill-N1 s0"><tspan x="716.5" dy="0"> </tspan><tspan x="716.5" dy="17.25">읽어야 할 것 — 어느 쪽이 옳은 절차라는 결론이 아니다.</tspan><tspan x="716.5" dy="17.25">같은 자극에 대해 두 절차가 다른 답을 낸다면, 그 자료로 뒷받침되는 주장은</tspan><tspan x="716.5" dy="17.25">‘사람은 표정을 보편적으로 읽는다’ 가 아니라 ‘이 절차에서 이만큼 일치한다’ 까지다</tspan></text><g ><g class="shape"><path d="M40 232h620v82H40z" class="stroke-B1 fill-B5 s1"/></g><text x="350" y="270.5" class="text-bold fill-N1 s0"><tspan x="350" dy="0">사진을 보여 주고 낱말 여섯 개를 함께 준다.</tspan><tspan x="350" dy="18.5">‘기쁨 · 슬픔 · 분노 · 두려움 · 놀람 · 혐오’ 가운데 하나를 고르게 한다</tspan></text></g><g ><g class="shape"><path d="M64 414h572v66H64z" class="stroke-B1 fill-B5 s1"/></g><text x="350" y="452.5" class="text-bold fill-N1 s0">참가자가 하는 일 — 주어진 목록에서 가장 덜 어색한 것 고르기</text></g><g ><g class="shape"><path d="M138 580h424v66H138z" class="stroke-B1 fill-B5 s1"/></g><text x="350" y="618.5" class="text-bold fill-N1 s0">여러 나라의 표본에서 일치율이 높게 나온다</text></g><g ><g class="shape"><path d="M69 754h563v82H69z" class="stroke-B1 fill-B5 s1"/></g><text x="350.5" y="792.5" class="text-bold fill-N1 s0"><tspan x="350.5" dy="0">그런데 목록 자체가 답의 후보를 정해 주었다.</tspan><tspan x="350.5" dy="18.5">목록에 없는 답은 나올 수 없고, 소거법만으로도 맞힐 수 있다</tspan></text></g><g ><g class="shape"><path d="M868 232h430v82H868z" class="stroke-B1 fill-B5 s1"/></g><text x="1083" y="270.5" class="text-bold fill-N1 s0"><tspan x="1083" dy="0">사진을 보여 주고 낱말을 주지 않는다.</tspan><tspan x="1083" dy="18.5">이 사람이 어떤 상태인지 자기 말로 적게 한다</tspan></text></g><g ><g class="shape"><path d="M882 414h401v66H882z" class="stroke-B1 fill-B5 s1"/></g><text x="1082.5" y="452.5" class="text-bold fill-N1 s0">참가자가 하는 일 — 자기 말로 떠올려 적기</text></g><g ><g class="shape"><path d="M837 580h492v66H837z" class="stroke-B1 fill-B5 s1"/></g><text x="1083" y="618.5" class="text-bold fill-N1 s0">일치율이 크게 떨어지고, 문화에 따른 차이가 커진다</text></g><g ><g class="shape"><path d="M760 746h645v98H760z" class="stroke-B1 fill-B5 s1"/></g><text x="1082.5" y="784.5" class="text-bold fill-N1 s0"><tspan x="1082.5" dy="0">그런데 이 절차에도 문제가 있다.</tspan><tspan x="1082.5" dy="17.667">말이 다르면 다르게 적힌다. 낮은 일치율이 ‘다르게 느낀다’ 는 뜻인지</tspan><tspan x="1082.5" dy="17.667">‘다르게 부른다’ 는 뜻인지 이것만으로 갈리지 않는다</tspan></text></g><marker id="mk-d2-3115250660-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3115250660-3488378134)" d="M350 316v94" class="connection stroke-B1 s1" mask="url(#d2-3115250660)"/><path fill="none" marker-end="url(#mk-d2-3115250660-3488378134)" d="M350 482v94" class="connection stroke-B1 s1" mask="url(#d2-3115250660)"/><path fill="none" marker-end="url(#mk-d2-3115250660-3488378134)" d="M350 648v102" class="connection stroke-B1 s1" mask="url(#d2-3115250660)"/><path fill="none" marker-end="url(#mk-d2-3115250660-3488378134)" d="M1082.5 316v94" class="connection stroke-B1 s1" mask="url(#d2-3115250660)"/><path fill="none" marker-end="url(#mk-d2-3115250660-3488378134)" d="M1082.5 482v94" class="connection stroke-B1 s1" mask="url(#d2-3115250660)"/><path fill="none" marker-end="url(#mk-d2-3115250660-3488378134)" d="M1082.5 648v94" class="connection stroke-B1 s1" mask="url(#d2-3115250660)"/><path fill="none" marker-end="url(#mk-d2-3115250660-3488378134)" d="M616.058 66.478C403.6 118.8 350 137.8 350 157" class="connection stroke-B1 s1" mask="url(#d2-3115250660)"/><path fill="none" marker-end="url(#mk-d2-3115250660-3488378134)" d="M816.94 65.486C1029 118.6 1082.5 137.8 1082.5 157" class="connection stroke-B1 s1" mask="url(#d2-3115250660)"/><marker id="mk-d2-3115250660-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3115250660-2177206569)" d="M350 868c0 60.4 43.4 86 213.102 125.102" class="connection stroke-B2 s4" mask="url(#d2-3115250660)"/><path fill="none" marker-end="url(#mk-d2-3115250660-2177206569)" d="M1082.5 876c0 54-43.401 78-213.102 117.102" class="connection stroke-B2 s4" mask="url(#d2-3115250660)"/><mask id="d2-3115250660" width="1627" height="1265" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1627v1265H-91z"/></mask></svg>