<svg xmlns="http://www.w3.org/2000/svg" width="4098" height="628" class="d2-3163371386 d2-svg" viewBox="-101 -85 4098 628"><rect width="4098" height="628" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3163371386 .fill-N1{fill:#0a0f25}.d2-3163371386 .fill-B4{fill:#e3e9fd}.d2-3163371386 .fill-B5{fill:#edf0fd}.d2-3163371386 .stroke-B1,.d2-3163371386 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="123" cy="268" class="shape stroke-B1" rx="123" ry="41" style="fill:#f7f8fe;stroke-width:2"/></g><text x="123" y="273.5" class="text-bold fill-N1 s0">같은 사진 한 장</text></g><g ><g class="shape"><path d="M366 56h2648v142H366z" class="stroke-B1 fill-B4 s1"/></g><text x="1690" y="43" class="fill-N1 s2">강제선택형</text></g><g ><g class="shape"><path d="M461 284h2594v158H461z" class="stroke-B1 fill-B4 s1"/></g><text x="1758" y="271" class="fill-N1 s2">자유 응답형</text></g><text x="3535.5" y="250" class="fill-N1 s0"><tspan x="3535.5" dy="0"> </tspan><tspan x="3535.5" dy="17.25">읽어야 할 것 — 어느 쪽이 옳은 절차라는 결론이 아니다.</tspan><tspan x="3535.5" dy="17.25">같은 자극에 대해 두 절차가 다른 답을 낸다면, 그 자료로 뒷받침되는 주장은</tspan><tspan x="3535.5" dy="17.25">‘사람은 표정을 보편적으로 읽는다’ 가 아니라 ‘이 절차에서 이만큼 일치한다’ 까지다</tspan></text><g ><g class="shape"><path d="M396 86h620v82H396z" class="stroke-B1 fill-B5 s1"/></g><text x="706" y="124.5" class="text-bold fill-N1 s0"><tspan x="706" dy="0">사진을 보여 주고 낱말 여섯 개를 함께 준다.</tspan><tspan x="706" dy="18.5">‘기쁨 · 슬픔 · 분노 · 두려움 · 놀람 · 혐오’ 가운데 하나를 고르게 한다</tspan></text></g><g ><g class="shape"><path d="M1116 94h572v66h-572z" class="stroke-B1 fill-B5 s1"/></g><text x="1402" y="132.5" class="text-bold fill-N1 s0">참가자가 하는 일 — 주어진 목록에서 가장 덜 어색한 것 고르기</text></g><g ><g class="shape"><path d="M1822 94h424v66h-424z" class="stroke-B1 fill-B5 s1"/></g><text x="2034" y="132.5" class="text-bold fill-N1 s0">여러 나라의 표본에서 일치율이 높게 나온다</text></g><g ><g class="shape"><path d="M2421 86h563v82h-563z" class="stroke-B1 fill-B5 s1"/></g><text x="2702.5" y="124.5" class="text-bold fill-N1 s0"><tspan x="2702.5" dy="0">그런데 목록 자체가 답의 후보를 정해 주었다.</tspan><tspan x="2702.5" dy="18.5">목록에 없는 답은 나올 수 없고, 소거법만으로도 맞힐 수 있다</tspan></text></g><g ><g class="shape"><path d="M491 322h430v82H491z" class="stroke-B1 fill-B5 s1"/></g><text x="706" y="360.5" class="text-bold fill-N1 s0"><tspan x="706" dy="0">사진을 보여 주고 낱말을 주지 않는다.</tspan><tspan x="706" dy="18.5">이 사람이 어떤 상태인지 자기 말로 적게 한다</tspan></text></g><g ><g class="shape"><path d="M1202 330h401v66h-401z" class="stroke-B1 fill-B5 s1"/></g><text x="1402.5" y="368.5" class="text-bold fill-N1 s0">참가자가 하는 일 — 자기 말로 떠올려 적기</text></g><g ><g class="shape"><path d="M1788 330h492v66h-492z" class="stroke-B1 fill-B5 s1"/></g><text x="2034" y="368.5" class="text-bold fill-N1 s0">일치율이 크게 떨어지고, 문화에 따른 차이가 커진다</text></g><g ><g class="shape"><path d="M2380 314h645v98h-645z" class="stroke-B1 fill-B5 s1"/></g><text x="2702.5" y="352.5" class="text-bold fill-N1 s0"><tspan x="2702.5" dy="0">그런데 이 절차에도 문제가 있다.</tspan><tspan x="2702.5" dy="17.667">말이 다르면 다르게 적힌다. 낮은 일치율이 ‘다르게 느낀다’ 는 뜻인지</tspan><tspan x="2702.5" dy="17.667">‘다르게 부른다’ 는 뜻인지 이것만으로 갈리지 않는다</tspan></text></g><marker id="mk-d2-3163371386-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3163371386-3488378134)" d="M1018 127h94" class="connection stroke-B1 s1" mask="url(#d2-3163371386)"/><path fill="none" marker-end="url(#mk-d2-3163371386-3488378134)" d="M1690 127h128" class="connection stroke-B1 s1" mask="url(#d2-3163371386)"/><path fill="none" marker-end="url(#mk-d2-3163371386-3488378134)" d="M2248 127h169" class="connection stroke-B1 s1" mask="url(#d2-3163371386)"/><path fill="none" marker-end="url(#mk-d2-3163371386-3488378134)" d="M923 363h274.5" class="connection stroke-B1 s1" mask="url(#d2-3163371386)"/><path fill="none" marker-end="url(#mk-d2-3163371386-3488378134)" d="M1605.5 363H1784" class="connection stroke-B1 s1" mask="url(#d2-3163371386)"/><path fill="none" marker-end="url(#mk-d2-3163371386-3488378134)" d="M2282 363h94" class="connection stroke-B1 s1" mask="url(#d2-3163371386)"/><path fill="none" marker-end="url(#mk-d2-3163371386-3488378134)" d="M192.4 232.573C275 148.398 310 127 362 127" class="connection stroke-B1 s1" mask="url(#d2-3163371386)"/><path fill="none" marker-end="url(#mk-d2-3163371386-3488378134)" d="M188.752 303.964C274.2 351 329 363 457 363" class="connection stroke-B1 s1" mask="url(#d2-3163371386)"/><marker id="mk-d2-3163371386-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3163371386-2177206569)" d="M3016 127c86.8 0 161.284 21.3 366.719 104.99" class="connection stroke-B2 s4" mask="url(#d2-3163371386)"/><path fill="none" marker-end="url(#mk-d2-3163371386-2177206569)" d="M3057 363c54 0 119.8-12 323.103-59.097" class="connection stroke-B2 s4" mask="url(#d2-3163371386)"/><mask id="d2-3163371386" width="4098" height="628" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h4098v628H-101z"/></mask></svg>