<svg xmlns="http://www.w3.org/2000/svg" width="939" height="1207" class="d2-748051755 d2-svg" viewBox="-89 -89 939 1207"><rect width="939" height="1207" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-748051755 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-748051755 .fill-N1{fill:#0a0f25}.d2-748051755 .fill-B4{fill:#e3e9fd}.d2-748051755 .fill-B5{fill:#edf0fd}.d2-748051755 .stroke-B1,.d2-748051755 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="379" cy="53" class="shape stroke-B1" rx="123" ry="41" style="fill:#f7f8fe;stroke-width:2"/></g><text x="379" y="58.5" class="text-bold fill-N1 s0">같은 사진 한 장</text></g><g ><g class="shape"><path d="M12 174h356v662H12z" class="stroke-B1 fill-B4 s1"/></g><text x="190" y="207" class="fill-N1 s2">강제선택형</text></g><g ><g class="shape"><path d="M388 182h361v646H388z" class="stroke-B1 fill-B4 s1"/></g><text x="568.5" y="215" class="fill-N1 s2">자유 응답형</text></g><text x="379" y="932" class="fill-N1 s0"><tspan x="379" dy="0"> </tspan><tspan x="379" dy="16.833">읽어야 할 것 — 어느 쪽이 옳은 절차라는 결론이 아니다.</tspan><tspan x="379" dy="16.833">같은 자극에 대해 두 절차가 다른 답을 낸다면,</tspan><tspan x="379" dy="16.833">그 자료로 뒷받침되는 주장은</tspan><tspan x="379" dy="16.833">‘사람은 표정을 보편적으로 읽는다’ 가 아니라</tspan><tspan x="379" dy="16.833">‘이 절차에서 이만큼 일치한다’ 까지다</tspan></text><g ><g class="shape"><path d="M52 220h276v130H52z" class="stroke-B1 fill-B5 s1"/></g><text x="190" y="258.5" class="text-bold fill-N1 s0"><tspan x="190" dy="0">사진을 보여 주고</tspan><tspan x="190" dy="17">낱말 여섯 개를 함께 준다.</tspan><tspan x="190" dy="17">‘기쁨 · 슬픔 · 분노 ·</tspan><tspan x="190" dy="17">두려움 · 놀람 · 혐오’</tspan><tspan x="190" dy="17">가운데 하나를 고르게 한다</tspan></text></g><g ><g class="shape"><path d="M52 390h276v98H52z" class="stroke-B1 fill-B5 s1"/></g><text x="190" y="428.5" class="text-bold fill-N1 s0"><tspan x="190" dy="0">참가자가 하는 일 —</tspan><tspan x="190" dy="17.667">주어진 목록에서</tspan><tspan x="190" dy="17.667">가장 덜 어색한 것 고르기</tspan></text></g><g ><g class="shape"><path d="M52 528h276v82H52z" class="stroke-B1 fill-B5 s1"/></g><text x="190" y="566.5" class="text-bold fill-N1 s0"><tspan x="190" dy="0">여러 나라의 표본에서</tspan><tspan x="190" dy="18.5">일치율이 높게 나온다</tspan></text></g><g ><g class="shape"><path d="M52 650h276v146H52z" class="stroke-B1 fill-B5 s1"/></g><text x="190" y="688.5" class="text-bold fill-N1 s0"><tspan x="190" dy="0">그런데 목록 자체가</tspan><tspan x="190" dy="16.833">답의 후보를 정해 주었다.</tspan><tspan x="190" dy="16.833">목록에 없는 답은</tspan><tspan x="190" dy="16.833">나올 수 없고,</tspan><tspan x="190" dy="16.833">소거법만으로도</tspan><tspan x="190" dy="16.833">맞힐 수 있다</tspan></text></g><g ><g class="shape"><path d="M428 228h281v114H428z" class="stroke-B1 fill-B5 s1"/></g><text x="568.5" y="266.5" class="text-bold fill-N1 s0"><tspan x="568.5" dy="0">사진을 보여 주고</tspan><tspan x="568.5" dy="17.25">낱말을 주지 않는다.</tspan><tspan x="568.5" dy="17.25">이 사람이 어떤 상태인지</tspan><tspan x="568.5" dy="17.25">자기 말로 적게 한다</tspan></text></g><g ><g class="shape"><path d="M428 382h281v82H428z" class="stroke-B1 fill-B5 s1"/></g><text x="568.5" y="420.5" class="text-bold fill-N1 s0"><tspan x="568.5" dy="0">참가자가 하는 일 —</tspan><tspan x="568.5" dy="18.5">자기 말로 떠올려 적기</tspan></text></g><g ><g class="shape"><path d="M428 504h281v82H428z" class="stroke-B1 fill-B5 s1"/></g><text x="568.5" y="542.5" class="text-bold fill-N1 s0"><tspan x="568.5" dy="0">일치율이 크게 떨어지고,</tspan><tspan x="568.5" dy="18.5">문화에 따른 차이가 커진다</tspan></text></g><g ><g class="shape"><path d="M428 626h281v162H428z" class="stroke-B1 fill-B5 s1"/></g><text x="568.5" y="664.5" class="text-bold fill-N1 s0"><tspan x="568.5" dy="0">그런데 이 절차에도</tspan><tspan x="568.5" dy="16.714">문제가 있다.</tspan><tspan x="568.5" dy="16.714">말이 다르면 다르게 적힌다.</tspan><tspan x="568.5" dy="16.714">낮은 일치율이</tspan><tspan x="568.5" dy="16.714">‘다르게 느낀다’ 는 뜻인지</tspan><tspan x="568.5" dy="16.714">‘다르게 부른다’ 는 뜻인지</tspan><tspan x="568.5" dy="16.714">이것만으로 갈리지 않는다</tspan></text></g><marker id="mk-d2-748051755-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-748051755-3488378134)" d="M190 352v34" class="connection stroke-B1 s1" mask="url(#d2-748051755)"/><path fill="none" marker-end="url(#mk-d2-748051755-3488378134)" d="M190 490v34" class="connection stroke-B1 s1" mask="url(#d2-748051755)"/><path fill="none" marker-end="url(#mk-d2-748051755-3488378134)" d="M190 612v34" class="connection stroke-B1 s1" mask="url(#d2-748051755)"/><path fill="none" marker-end="url(#mk-d2-748051755-3488378134)" d="M568.5 344v34" class="connection stroke-B1 s1" mask="url(#d2-748051755)"/><path fill="none" marker-end="url(#mk-d2-748051755-3488378134)" d="M568.5 466v34" class="connection stroke-B1 s1" mask="url(#d2-748051755)"/><path fill="none" marker-end="url(#mk-d2-748051755-3488378134)" d="M568.5 588v34" class="connection stroke-B1 s1" mask="url(#d2-748051755)"/><path fill="none" marker-end="url(#mk-d2-748051755-3488378134)" d="m338.006 94 .232 76" class="connection stroke-B1 s1" mask="url(#d2-748051755)"/><path fill="none" marker-end="url(#mk-d2-748051755-3488378134)" d="m420.006 94 .233 84" class="connection stroke-B1 s1" mask="url(#d2-748051755)"/><marker id="mk-d2-748051755-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-748051755-2177206569)" d="M303.583 838v74" class="connection stroke-B2 s4" mask="url(#d2-748051755)"/><path fill="none" marker-end="url(#mk-d2-748051755-2177206569)" d="M454.916 830v82" class="connection stroke-B2 s4" mask="url(#d2-748051755)"/><mask id="d2-748051755" width="939" height="1207" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h939v1207H-89z"/></mask></svg>