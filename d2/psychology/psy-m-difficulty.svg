<svg xmlns="http://www.w3.org/2000/svg" width="2671" height="936" class="d2-872387827 d2-svg" viewBox="-101 -85 2671 936"><rect width="2671" height="936" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-872387827 .fill-N1{fill:#0a0f25}.d2-872387827 .fill-B5{fill:#edf0fd}.d2-872387827 .fill-B6{fill:#f7f8fe}.d2-872387827 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="150" cy="403" class="shape stroke-B1 fill-B6 s0" rx="150" ry="50"/></g><text x="150" y="408.5" class="text-bold fill-N1 s1">심리학이 재려는 것</text></g><g ><g class="shape"><path d="M412 78h427v82H412z" class="stroke-B1 fill-B6 s0"/></g><text x="625.5" y="116.5" class="text-bold fill-N1 s1"><tspan x="625.5" dy="0">1. 재려는 것을 직접 볼 수 없다</tspan><tspan x="625.5" dy="18.5">기억을 재는 것이 아니라 회상한 개수를 잰다</tspan></text></g><g ><g class="shape"><path d="M413 220h424v82H413z" class="stroke-B1 fill-B6 s0"/></g><text x="625" y="258.5" class="text-bold fill-N1 s1"><tspan x="625" dy="0">2. 대상이 재는 일을 알아챈다</tspan><tspan x="625" dy="18.5">관찰되고 있다는 것을 알면 행동이 달라진다</tspan></text></g><g ><g class="shape"><path d="M400 362h450v82H400z" class="stroke-B1 fill-B6 s0"/></g><text x="625" y="400.5" class="text-bold fill-N1 s1"><tspan x="625" dy="0">3. 사람마다 크게 다르다</tspan><tspan x="625" dy="18.5">집단 평균이 어느 개인도 서술하지 않을 수 있다</tspan></text></g><g ><g class="shape"><path d="M454 504h343v82H454z" class="stroke-B1 fill-B6 s0"/></g><text x="625.5" y="542.5" class="text-bold fill-N1 s1"><tspan x="625.5" dy="0">4. 원인이 여럿이고 서로 얽혀 있다</tspan><tspan x="625.5" dy="18.5">한 원인이 설명하는 몫이 대개 작다</tspan></text></g><g ><g class="shape"><path d="M427 646h397v82H427z" class="stroke-B1 fill-B6 s0"/></g><text x="625.5" y="684.5" class="text-bold fill-N1 s1"><tspan x="625.5" dy="0">5. 조사된 사람이 인류를 대표하지 않는다</tspan><tspan x="625.5" dy="18.5">대학생 표본에 크게 기울어 있다</tspan></text></g><g ><g class="shape"><path d="M970 56h475v694H970z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1207.5" y="43" class="fill-N1" style="text-anchor:middle;font-size:28px">그래서 방법이 본체가 된다</text></g><text x="2017" y="464" class="fill-N1 s1"><tspan x="2017" dy="0"> </tspan><tspan x="2017" dy="17.667">다섯 자리는 없앨 수 없다. 줄이고, 남은 것을 드러내 놓고 셈에 넣는 것이 이 학문의 방법이다.</tspan><tspan x="2017" dy="17.667">‘심리학은 과학이 아니다’ 라는 말과 ‘심리학의 결과는 다 믿을 만하다’ 는 말은 둘 다 이 그림을 안 본 말이다</tspan></text><g ><g class="shape"><path d="M1056 86h304v66h-304z" class="stroke-B1 fill-B5 s0"/></g><text x="1208" y="124.5" class="text-bold fill-N1 s1">조작적 정의와 측정 이론 4·5장</text></g><g ><g class="shape"><path d="M1048 228h320v66h-320z" class="stroke-B1 fill-B5 s0"/></g><text x="1208" y="266.5" class="text-bold fill-N1 s1">은폐 · 통제 집단 · 사전등록 4·6장</text></g><g ><g class="shape"><path d="M1044 441h328v66h-328z" class="stroke-B1 fill-B5 s0"/></g><text x="1208" y="479.5" class="text-bold fill-N1 s1">효과크기와 구간으로 말하기 5장</text></g><g ><g class="shape"><path d="M1000 654h415v66h-415z" class="stroke-B1 fill-B5 s0"/></g><text x="1207.5" y="692.5" class="text-bold fill-N1 s1">표본을 밝히고 여러 곳에서 되풀이하기 6장</text></g><marker id="mk-d2-872387827-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-872387827-3488378134)" d="M185.154 352.366C316.8 166 362.3 119 407.5 119" class="connection stroke-B1 s0" mask="url(#d2-872387827)"/><path fill="none" marker-end="url(#mk-d2-872387827-3488378134)" d="M214.632 356.844C322.6 280.4 362.6 261 409 261" class="connection stroke-B1 s0" mask="url(#d2-872387827)"/><path fill="none" marker-end="url(#mk-d2-872387827-3488378134)" d="M302 403h94" class="connection stroke-B1 s0" mask="url(#d2-872387827)"/><path fill="none" marker-end="url(#mk-d2-872387827-3488378134)" d="M214.632 449.156C322.