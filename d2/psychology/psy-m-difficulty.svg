<svg xmlns="http://www.w3.org/2000/svg" width="1383" height="1152" class="d2-929613358 d2-svg" viewBox="-101 -101 1383 1152"><rect width="1383" height="1152" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-929613358 .fill-N1{fill:#0a0f25}.d2-929613358 .fill-B5{fill:#edf0fd}.d2-929613358 .fill-B6{fill:#f7f8fe}.d2-929613358 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><path fill="transparent" stroke="transparent" d="M0 0h1181v837H0z" class="shape s0"/><text x="383" y="913" class="fill-N1 s1"><tspan x="383" dy="0">다섯 자리는 없앨 수 없다. 줄이고, 남은 것을 드러내 놓고 셈에 넣는 것이 이 학문의 방법이다.</tspan><tspan x="383" dy="17.667">‘심리학은 과학이 아니다’ 라는 말과 ‘심리학의 결과는 다 믿을 만하다’ 는 말은</tspan><tspan x="383" dy="17.667">둘 다 이 그림을 안 본 말이다</tspan></text><g ><g class="shape"><ellipse cx="118" cy="420" class="shape stroke-B1 fill-B5 s0" rx="88" ry="42"/></g><text x="118" y="417.5" class="text-bold fill-N1 s1"><tspan x="118" dy="0">심리학이</tspan><tspan x="118" dy="18.5">재려는 것</tspan></text></g><g ><g class="shape"><path d="M326 55h298v98H326z" class="stroke-B1 fill-B5 s0"/></g><text x="475" y="93.5" class="text-bold fill-N1 s1"><tspan x="475" dy="0">1. 재려는 것을 직접 볼 수 없다</tspan><tspan x="475" dy="17.667">기억을 재는 것이 아니라</tspan><tspan x="475" dy="17.667">회상한 개수를 잰다</tspan></text></g><g ><g class="shape"><path d="M328 213h293v98H328z" class="stroke-B1 fill-B5 s0"/></g><text x="474.5" y="251.5" class="text-bold fill-N1 s1"><tspan x="474.5" dy="0">2. 대상이 재는 일을 알아챈다</tspan><tspan x="474.5" dy="17.667">관찰되고 있다는 것을 알면</tspan><tspan x="474.5" dy="17.667">행동이 달라진다</tspan></text></g><g ><g class="shape"><path d="M347 371h255v98H347z" class="stroke-B1 fill-B5 s0"/></g><text x="474.5" y="409.5" class="text-bold fill-N1 s1"><tspan x="474.5" dy="0">3. 사람마다 크게 다르다</tspan><tspan x="474.5" dy="17.667">집단 평균이 어느 개인도</tspan><tspan x="474.5" dy="17.667">서술하지 않을 수 있다</tspan></text></g><g ><g class="shape"><path d="M306 529h337v98H306z" class="stroke-B1 fill-B5 s0"/></g><text x="474.5" y="567.5" class="text-bold fill-N1 s1"><tspan x="474.5" dy="0">4. 원인이 여럿이고 서로 얽혀 있다</tspan><tspan x="474.5" dy="17.667">한 원인이 설명하는 몫이</tspan><tspan x="474.5" dy="17.667">대개 작다</tspan></text></g><g ><g class="shape"><path d="M315 687h319v98H315z" class="stroke-B1 fill-B5 s0"/></g><text x="474.5" y="725.5" class="text-bold fill-N1 s1"><tspan x="474.5" dy="0">5. 조사된 사람이 인류를</tspan><tspan x="474.5" dy="17.667">대표하지 않는다</tspan><tspan x="474.5" dy="17.667">대학생 표본에 크게 기울어 있다</tspan></text></g><g ><g class="shape"><path d="M763 41h388v766H763z" class="stroke-B1 fill-B5 s0"/></g><text x="957" y="29" class="fill-N1" style="text-anchor:middle;font-size:24px">그래서 방법이 본체가 된다</text></g><g ><g class="shape"><path d="M805 71h304v66H805z" class="stroke-B1 fill-B6 s0"/></g><text x="957" y="109.5" class="text-bold fill-N1 s1">조작적 정의와 측정 이론 4·5장</text></g><g ><g class="shape"><path d="M797 229h320v66H797z" class="stroke-B1 fill-B6 s0"/></g><text x="957" y="267.5" class="text-bold fill-N1 s1">은폐 · 통제 집단 · 사전등록 4·6장</text></g><g ><g class="shape"><path d="M793 466h328v66H793z" class="stroke-B1 fill-B6 s0"/></g><text x="957" y="504.5" class="text-bold fill-N1 s1">효과크기와 구간으로 말하기 5장</text></g><g ><g class="shape"><path d="M814 695h287v82H814z" class="stroke-B1 fill-B6 s0"/></g><text x="957.5" y="733.5" class="text-bold fill-N1 s1"><tspan x="957.5" dy="0">표본을 밝히고</tspan><tspan x="957.5" dy="18.5">여러 곳에서 되풀이하기 6장</tspan></text></g><marker id="mk-d2-929613358-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-929613358-3488378134)" d="M136.8 377.167C232 159 269.9 104 321.5 104" class="connection stroke-B1 s0" mask="url(#d2-929613358)"/><path fill="none" marker-end="url(#mk-d2-