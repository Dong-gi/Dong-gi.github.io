<svg xmlns="http://www.w3.org/2000/svg" width="988" height="1343" class="d2-2636858530 d2-svg" viewBox="-101 -101 988 1343"><rect width="988" height="1343" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2636858530 .text-bold{font-weight:700}.d2-2636858530 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2636858530 .fill-N1{fill:#0a0f25}.d2-2636858530 .fill-N2{fill:#676c7e}.d2-2636858530 .fill-B4{fill:#e3e9fd}.d2-2636858530 .fill-B5{fill:#edf0fd}.d2-2636858530 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 112h336v510H0z" class="stroke-B1 fill-B4 s0"/></g><text x="168" y="145" class="fill-N1 s1">튼튼하게 남은 것</text></g><g ><g class="shape"><path d="M396 0h390v734H396z" class="stroke-B1 fill-B4 s0"/></g><text x="591" y="33" class="fill-N1 s1">무너진 큰 주장</text></g><g ><g class="shape"><path d="M157 855h445v286H157z" class="stroke-B1 fill-B4 s0"/></g><text x="379.5" y="888" class="fill-N1 s1">정확한 요약</text></g><g ><g class="shape"><path d="M30 158h276v130H30z" class="stroke-B1 fill-B5 s0"/></g><text x="168" y="196.5" class="text-bold fill-N1 s2"><tspan x="168" dy="0">조건형성의 기본 현상</tspan><tspan x="168" dy="17">획득 · 소거 · 자발적 회복 ·</tspan><tspan x="168" dy="17">일반화 · 변별.</tspan><tspan x="168" dy="17">여러 종, 여러 연구실에서</tspan><tspan x="168" dy="17">되풀이해 관찰된다</tspan></text></g><g ><g class="shape"><path d="M30 318h276v114H30z" class="stroke-B1 fill-B5 s0"/></g><text x="168" y="356.5" class="text-bold fill-N1 s2"><tspan x="168" dy="0">강화가 행동의 빈도를</tspan><tspan x="168" dy="17.25">바꾼다는 것</tspan><tspan x="168" dy="17.25">계획에 따라 반응의 모양이</tspan><tspan x="168" dy="17.25">달라진다는 것까지</tspan></text></g><g ><g class="shape"><path d="M30 462h276v130H30z" class="stroke-B1 fill-B5 s0"/></g><text x="168" y="500.5" class="text-bold fill-N1 s2"><tspan x="168" dy="0">응용에서의 성과</tspan><tspan x="168" dy="17">행동을 조금씩</tspan><tspan x="168" dy="17">다듬어 나가는 절차,</tspan><tspan x="168" dy="17">피하던 자극에 단계적으로</tspan><tspan x="168" dy="17">다시 노출하는 절차</tspan></text></g><g ><g class="shape"><path d="M426 46h330v114H426z" class="stroke-B1 fill-B5 s0"/></g><text x="591" y="84.5" class="text-bold fill-N1 s2"><tspan x="591" dy="0">‘어떤 자극이든</tspan><tspan x="591" dy="17.25">어떤 결과와도 똑같이 붙는다’</tspan><tspan x="591" dy="17.25">무너뜨린 것 —</tspan><tspan x="591" dy="17.25">맛 혐오 학습과 준비성</tspan></text></g><g ><g class="shape"><path d="M426 190h330v146H426z" class="stroke-B1 fill-B5 s0"/></g><text x="591" y="228.5" class="text-bold fill-N1 s2"><tspan x="591" dy="0">‘두 사건이 가까이 붙어 있으면</tspan><tspan x="591" dy="16.833">연합이 생긴다’</tspan><tspan x="591" dy="16.833">무너뜨린 것 — 짝지음을 고정하고</tspan><tspan x="591" dy="16.833">예측력만 바꾼 설계,</tspan><tspan x="591" dy="16.833">그리고 이미 예측되는 것에는</tspan><tspan x="591" dy="16.833">더 배우지 않는 현상</tspan></text></g><g ><g class="shape"><path d="M426 366h330v162H426z" class="stroke-B1 fill-B5 s0"/></g><text x="591" y="404.5" class="text-bold fill-N1 s2"><tspan x="591" dy="0">‘밖에서 보이는 것만으로</tspan><tspan x="591" dy="16.714">충분하다’</tspan><tspan x="591" dy="16.714">무너뜨린 것 — 강화 없이</tspan><tspan x="591" dy="16.714">돌아다닌 뒤 강화가 붙자</tspan><tspan x="591" dy="16.714">곧바로 드러난 학습,</tspan><tspan x="591" dy="16.714">그리고 남을 보는 것만으로</tspan><tspan x="591" dy="16.714">생긴 학습</tspan></text></g><g ><g class="shape"><path d="M426 558h330v146H426z" class="stroke-B1 fill-B5 s0"/></g><text x="591" y="596.5" class="text-bold fill-N1 s2"><tspan x="591" dy="0">‘같은 원리로 언어까지</tspan><tspan x="591" dy="16.833">설명된다’</tspan><tspan x="591" dy="16.833">무너뜨린 것 — 아이가</tspan><tspan x="591" dy="16.833">들어 본 적 없는 문장을</tspan><tspan x="591" dy="16.833">만들어 낸다는 지적.</tspan><tspan x="591" dy="16.833">11장이 이 논쟁을 다룬다</tspan></text></g><g ><g class="shape"><path d="M187 901h385v82H187z" class="stroke-B1 fill-B5 s0"/></g><text x="379.5" y="939.5" class="text-bold fill-N1 s2"><tspan x="379.5" dy="0">‘조건형성이 틀렸다’ 가 아니다.</tspan><tspan x="379.5" dy="18.5">‘조건형성이 전부는 아니다’ 다</tspan></text></g><g ><g class="shape"><path d="M187 1013h385v98H187z" class="stroke-B1 fill-B5 s0"/></g><text x="379.5" y="1051.5" class="text-bold fill-N1 s2"><tspan x="379.5" dy="0">이 분야가 무너진 것이 아니라</tspan><tspan x="379.5" dy="17.667">‘무엇이 무엇과 붙는가’ 를 정하는 것이</tspan><tspan x="379.5" dy="17.667">무엇인지가 다시 쓰였다</tspan></text></g><marker id="mk-d2-2636858530-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2636858530-3488378134)" d="M168 290v24" class="connection stroke-B1 s0" mask="url(#d2-2636858530)"/><path fill="none" marker-end="url(#mk-d2-2636858530-3488378134)" d="M168 434v24" class="connection stroke-B1 s0" mask="url(#d2-2636858530)"/><path fill="none" marker-end="url(#mk-d2-2636858530-3488378134)" d="M591 162v24" class="connection stroke-B1 s0" mask="url(#d2-2636858530)"/><path fill="none" marker-end="url(#mk-d2-2636858530-3488378134)" d="M591 338v24" class="connection stroke-B1 s0" mask="url(#d2-2636858530)"/><path fill="none" marker-end="url(#mk-d2-2636858530-3488378134)" d="M591 530v24" class="connection stroke-B1 s0" mask="url(#d2-2636858530)"/><path fill="none" marker-end="url(#mk-d2-2636858530-3488378134)" d="M379.5 985v24" class="connection stroke-B1 s0" mask="url(#d2-2636858530)"/><path fill="none" marker-end="url(#mk-d2-2636858530-3488378134)" d="M168 623.5c0 136.4 12.4 183.2 59.149 229.195" class="connection stroke-B1 s0" mask="url(#d2-2636858530)"/><text x="168" y="755" class="text-italic fill-N2 s2">이대로 쓴다</text><path fill="none" marker-end="url(#mk-d2-2636858530-3488378134)" d="M591 735.5c0 46.8-12.4 71.2-59.149 117.195" class="connection stroke-B1 s0" mask="url(#d2-2636858530)"/><text x="580.5" y="809" class="text-italic fill-N2 s2">이 주장은 버린다</text><mask id="d2-2636858530" width="988" height="1343" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h988v1343h-988z"/><path d="M116 739h104v21H116zM508 793h145v21H508z"/></mask></svg>