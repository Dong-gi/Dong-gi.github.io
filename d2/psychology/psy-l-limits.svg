<svg xmlns="http://www.w3.org/2000/svg" width="1407" height="1529" class="d2-3312733242 d2-svg" viewBox="-91 -121 1407 1529"><rect width="1407" height="1529" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3312733242 .fill-N1{fill:#0a0f25}.d2-3312733242 .fill-N2{fill:#676c7e}.d2-3312733242 .fill-B4{fill:#e3e9fd}.d2-3312733242 .fill-B5{fill:#edf0fd}.d2-3312733242 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M10 252h504v554H10z" class="stroke-B1 fill-B4 s0"/></g><text x="262" y="239" class="fill-N1 s1">튼튼하게 남은 것</text></g><g ><g class="shape"><path d="M554 20h661v786H554z" class="stroke-B1 fill-B4 s0"/></g><text x="884.5" y="7" class="fill-N1 s1">무너진 큰 주장</text></g><g ><g class="shape"><path d="M232 967h682v340H232z" class="stroke-B1 fill-B4 s0"/></g><text x="573" y="954" class="fill-N1 s1">정확한 요약</text></g><g ><g class="shape"><path d="M48 282h428v98H48z" class="stroke-B1 fill-B5 s0"/></g><text x="262" y="320.5" class="text-bold fill-N1 s2"><tspan x="262" dy="0">조건형성의 기본 현상</tspan><tspan x="262" dy="17.667">획득 · 소거 · 자발적 회복 · 일반화 · 변별.</tspan><tspan x="262" dy="17.667">여러 종, 여러 연구실에서 되풀이해 관찰된다</tspan></text></g><g ><g class="shape"><path d="M40 488h444v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="262" y="526.5" class="text-bold fill-N1 s2"><tspan x="262" dy="0">강화가 행동의 빈도를 바꾼다는 것</tspan><tspan x="262" dy="18.5">계획에 따라 반응의 모양이 달라진다는 것까지</tspan></text></g><g ><g class="shape"><path d="M40 678h444v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="262" y="716.5" class="text-bold fill-N1 s2"><tspan x="262" dy="0">응용에서의 성과</tspan><tspan x="262" dy="17.667">행동을 조금씩 다듬어 나가는 절차,</tspan><tspan x="262" dy="17.667">피하던 자극에 단계적으로 다시 노출하는 절차</tspan></text></g><g ><g class="shape"><path d="M662 50h446v82H662z" class="stroke-B1 fill-B5 s0"/></g><text x="885" y="88.5" class="text-bold fill-N1 s2"><tspan x="885" dy="0">‘어떤 자극이든 어떤 결과와도 똑같이 붙는다’</tspan><tspan x="885" dy="18.5">무너뜨린 것 — 맛 혐오 학습과 준비성</tspan></text></g><g ><g class="shape"><path d="M631 282h508v98H631z" class="stroke-B1 fill-B5 s0"/></g><text x="885" y="320.5" class="text-bold fill-N1 s2"><tspan x="885" dy="0">‘두 사건이 가까이 붙어 있으면 연합이 생긴다’</tspan><tspan x="885" dy="17.667">무너뜨린 것 — 짝지음을 고정하고 예측력만 바꾼 설계,</tspan><tspan x="885" dy="17.667">그리고 이미 예측되는 것에는 더 배우지 않는 현상</tspan></text></g><g ><g class="shape"><path d="M615 480h539v98H615z" class="stroke-B1 fill-B5 s0"/></g><text x="884.5" y="518.5" class="text-bold fill-N1 s2"><tspan x="884.5" dy="0">‘밖에서 보이는 것만으로 충분하다’</tspan><tspan x="884.5" dy="17.667">무너뜨린 것 — 강화 없이 돌아다닌 뒤 강화가 붙자</tspan><tspan x="884.5" dy="17.667">곧바로 드러난 학습, 그리고 남을 보는 것만으로 생긴 학습</tspan></text></g><g ><g class="shape"><path d="M584 678h601v98H584z" class="stroke-B1 fill-B5 s0"/></g><text x="884.5" y="716.5" class="text-bold fill-N1 s2"><tspan x="884.5" dy="0">‘같은 원리로 언어까지 설명된다’</tspan><tspan x="884.5" dy="17.667">무너뜨린 것 — 아이가 들어 본 적 없는 문장을 만들어 낸다는 지적.</tspan><tspan x="884.5" dy="17.667">11장이 이 논쟁을 다룬다</tspan></text></g><g ><g class="shape"><path d="M412 997h323v82H412z" class="stroke-B1 fill-B5 s0"/></g><text x="573.5" y="1035.5" class="text-bold fill-N1 s2"><tspan x="573.5" dy="0">‘조건형성이 틀렸다’ 가 아니다.</tspan><tspan x="573.5" dy="18.5">‘조건형성이 전부는 아니다’ 다</tspan></text></g><g ><g class="shape"><path d="M381 1179h385v98H381z" class="stroke-B1 fill-B5 s0"/></g><text x="573.5" y="1217.5" class="text-bold fill-N1 s2"><tspan x="573.5" dy="0">이 분야가 무너진 것이 아니라</tspan><tspan x="573.5" dy="17.667">‘무엇이 무엇과 붙는가’ 를 정하는 것이</tspan><tspan x="573.5" dy="17.667">무엇인지가 다시 쓰였다</tspan></text></g><marker id="mk-d2-3312733242-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3312733242-3488378134)" d="M262 382v102" class="connection stroke-B1 s0" mask="url(#d2-3312733242)"/><path fill="none" marker-end="url(#mk-d2-3312733242-3488378134)" d="M262 572v102" class="connection stroke-B1 s0" mask="url(#d2-3312733242)"/><path fill="none" marker-end="url(#mk-d2-3312733242-3488378134)" d="M884.5 134v144" class="connection stroke-B1 s0" mask="url(#d2-3312733242)"/><path fill="none" marker-end="url(#mk-d2-3312733242-3488378134)" d="M884.5 382v94" class="connection stroke-B1 s0" mask="url(#d2-3312733242)"/><path fill="none" marker-end="url(#mk-d2-3312733242-3488378134)" d="M884.5 580v94" class="connection stroke-B1 s0" mask="url(#d2-3312733242)"/><path fill="none" marker-end="url(#mk-d2-3312733242-3488378134)" d="M573.25 1081v94" class="connection stroke-B1 s0" mask="url(#d2-3312733242)"/><path fill="none" marker-end="url(#mk-d2-3312733242-3488378134)" d="M262 807.5v156" class="connection stroke-B1 s0" mask="url(#d2-3312733242)"/><text x="262" y="892" class="text-italic fill-N2 s2">이대로 쓴다</text><path fill="none" marker-end="url(#mk-d2-3312733242-3488378134)" d="M884.5 807.5v156" class="connection stroke-B1 s0" mask="url(#d2-3312733242)"/><text x="884.5" y="892" class="text-italic fill-N2 s2">이 주장은 버린다</text><mask id="d2-3312733242" width="1407" height="1529" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1407v1529H-91z"/><path d="M210 876h104v21H210zM812 876h145v21H812z"/></mask></svg>