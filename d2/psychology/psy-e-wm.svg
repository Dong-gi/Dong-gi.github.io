<svg xmlns="http://www.w3.org/2000/svg" width="1379" height="1813" class="d2-557702431 d2-svg" viewBox="-91 -121 1379 1813"><rect width="1379" height="1813" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-557702431 .fill-N1{fill:#0a0f25}.d2-557702431 .fill-B4{fill:#e3e9fd}.d2-557702431 .fill-B5{fill:#edf0fd}.d2-557702431 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M10 20h489v736H10z" class="stroke-B1 fill-B4 s0"/></g><text x="254.5" y="7" class="fill-N1 s1">단기기억</text></g><g ><g class="shape"><path d="M539 20h648v736H539z" class="stroke-B1 fill-B4 s0"/></g><text x="863" y="7" class="fill-N1 s1">작업기억</text></g><g ><g class="shape"><path d="M231 896h655v522H231z" class="stroke-B1 fill-B4 s0"/></g><text x="558.5" y="883" class="fill-N1 s1">용량에 대해 무엇을 말할 수 있나</text></g><text x="558.5" y="1554" class="fill-N1 s2"><tspan x="558.5" dy="0"> </tspan><tspan x="558.5" dy="17.667">이 문서의 규칙 — 두 말을 섞어 쓰지 않는다.</tspan><tspan x="558.5" dy="17.667">‘잠깐 담아 두는 일’ 을 말할 때는 단기기억, ‘담은 채로 다루는 일’ 을 말할 때는 작업기억</tspan></text><g ><g class="shape"><path d="M82 50h346v82H82z" class="stroke-B1 fill-B5 s0"/></g><text x="255" y="88.5" class="text-bold fill-N1 s2"><tspan x="255" dy="0">묻는 것</tspan><tspan x="255" dy="18.5">잠깐 동안 얼마나 담아 둘 수 있는가</tspan></text></g><g ><g class="shape"><path d="M83 232h344v98H83z" class="stroke-B1 fill-B5 s0"/></g><text x="255" y="270.5" class="text-bold fill-N1 s2"><tspan x="255" dy="0">그림</tspan><tspan x="255" dy="17.667">칸이 하나. 정보가 들어와 머물다가</tspan><tspan x="255" dy="17.667">되뇌면 다음 칸으로 넘어간다</tspan></text></g><g ><g class="shape"><path d="M40 430h429v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="254.5" y="468.5" class="text-bold fill-N1 s2"><tspan x="254.5" dy="0">재는 과제</tspan><tspan x="254.5" dy="17.667">들려준 숫자나 낱말을 그대로 되뇌어 말하기.</tspan><tspan x="254.5" dy="17.667">담기만 하면 되는 과제다</tspan></text></g><g ><g class="shape"><path d="M62 628h386v98H62z" class="stroke-B1 fill-B5 s0"/></g><text x="255" y="666.5" class="text-bold fill-N1 s2"><tspan x="255" dy="0">잘 설명하는 것</tspan><tspan x="255" dy="17.667">비슷한 소리끼리 헷갈리는 것,</tspan><tspan x="255" dy="17.667">긴 낱말이 짧은 낱말보다 적게 담기는 것</tspan></text></g><g ><g class="shape"><path d="M636 50h454v82H636z" class="stroke-B1 fill-B5 s0"/></g><text x="863" y="88.5" class="text-bold fill-N1 s2"><tspan x="863" dy="0">묻는 것</tspan><tspan x="863" dy="18.5">담아 둔 채로 그것을 가지고 무엇을 할 수 있는가</tspan></text></g><g ><g class="shape"><path d="M575 232h577v98H575z" class="stroke-B1 fill-B5 s0"/></g><text x="863.5" y="270.5" class="text-bold fill-N1 s2"><tspan x="863.5" dy="0">그림</tspan><tspan x="863.5" dy="17.667">칸이 여럿. 소리를 담는 자리, 눈으로 본 것과 자리를 담는 자리,</tspan><tspan x="863.5" dy="17.667">그리고 그 둘에 주의를 나눠 주고 방해를 막는 자리</tspan></text></g><g ><g class="shape"><path d="M660 430h406v98H660z" class="stroke-B1 fill-B5 s0"/></g><text x="863" y="468.5" class="text-bold fill-N1 s2"><tspan x="863" dy="0">재는 과제</tspan><tspan x="863" dy="17.667">계산을 하면서 낱말을 함께 기억하기처럼,</tspan><tspan x="863" dy="17.667">담기와 처리를 같이 시키는 과제</tspan></text></g><g ><g class="shape"><path d="M569 628h588v98H569z" class="stroke-B1 fill-B5 s0"/></g><text x="863" y="666.5" class="text-bold fill-N1 s2"><tspan x="863" dy="0">잘 설명하는 것</tspan><tspan x="863" dy="17.667">글을 읽고 이해하는 정도, 여러 단계를 거쳐야 하는 추론의 성적.</tspan><tspan x="863" dy="17.667">담기만 재는 과제보다 이런 것들과 더 강하게 이어진다</tspan></text></g><g ><g class="shape"><path d="M376 926h365v82H376z" class="stroke-B1 fill-B5 s0"/></g><text x="558.5" y="964.5" class="text-bold fill-N1 s2"><tspan x="558.5" dy="0">정설 — 담을 수 있는 양에 제한이 있다.</tspan><tspan x="558.5" dy="18.5">이것은 다투어지지 않는다</tspan></text></g><g ><g class="shape"><path d="M261 1108h595v98H261z" class="stroke-B1 fill-B5 s0"/></g><text x="558.5" y="1146.5" class="text-bold fill-N1 s2"><tspan x="558.5" dy="0">다투어지는 것 — 그 수가 얼마인가.</tspan><tspan x="558.5" dy="17.667">되뇌기와 덩이짓기를 허용하느냐 막느냐에 따라 값이 달라지고,</tspan><tspan x="558.5" dy="17.667">무엇을 한 덩어리로 세느냐에 따라 또 달라진다</tspan></text></g><g ><g class="shape"><path d="M270 1306h577v82H270z" class="stroke-B1 fill-B5 s0"/></g><text x="558.5" y="1344.5" class="text-bold fill-N1 s2"><tspan x="558.5" dy="0">그래서 이 문서는 하나의 수를 적지 않는다.</tspan><tspan x="558.5" dy="18.5">널리 인용되는 ‘일곱 언저리’ 도 확정된 값으로 다루지 않는다</tspan></text></g><marker id="mk-d2-557702431-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-557702431-3488378134)" d="M254.5 134v94" class="connection stroke-B1 s0" mask="url(#d2-557702431)"/><path fill="none" marker-end="url(#mk-d2-557702431-3488378134)" d="M254.5 332v94" class="connection stroke-B1 s0" mask="url(#d2-557702431)"/><path fill="none" marker-end="url(#mk-d2-557702431-3488378134)" d="M254.5 530v94" class="connection stroke-B1 s0" mask="url(#d2-557702431)"/><path fill="none" marker-end="url(#mk-d2-557702431-3488378134)" d="M863 134v94" class="connection stroke-B1 s0" mask="url(#d2-557702431)"/><path fill="none" marker-end="url(#mk-d2-557702431-3488378134)" d="M863 332v94" class="connection stroke-B1 s0" mask="url(#d2-557702431)"/><path fill="none" marker-end="url(#mk-d2-557702431-3488378134)" d="M863 530v94" class="connection stroke-B1 s0" mask="url(#d2-557702431)"/><path fill="none" marker-end="url(#mk-d2-557702431-3488378134)" d="M558.75 1010v94" class="connection stroke-B1 s0" mask="url(#d2-557702431)"/><path fill="none" marker-end="url(#mk-d2-557702431-3488378134)" d="M558.75 1208v94" class="connection stroke-B1 s0" mask="url(#d2-557702431)"/><path fill="none" marker-end="url(#mk-d2-557702431-3488378134)" d="M254.5 758v134" class="connection stroke-B1 s0" mask="url(#d2-557702431)"/><path fill="none" marker-end="url(#mk-d2-557702431-3488378134)" d="M863 758v134" class="connection stroke-B1 s0" mask="url(#d2-557702431)"/><marker id="mk-d2-557702431-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-557702431-2177206569)" d="M558.75 1420v114" class="connection" mask="url(#d2-557702431)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-557702431" width="1379" height="1813" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1379v1813H-91z"/></mask></svg>