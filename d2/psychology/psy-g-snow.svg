<svg xmlns="http://www.w3.org/2000/svg" width="1741" height="2008" class="d2-1992584666 d2-svg" viewBox="-91 -121 1741 2008"><rect width="1741" height="2008" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1992584666 .fill-N1{fill:#0a0f25}.d2-1992584666 .fill-B4{fill:#e3e9fd}.d2-1992584666 .fill-B5{fill:#edf0fd}.d2-1992584666 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M353 20h838v656H353z" class="stroke-B1 fill-B4 s0"/></g><text x="772" y="7" class="fill-N1 s1">이야기가 커진 과정</text></g><g ><g class="shape"><path d="M10 824h746v348H10z" class="stroke-B1 fill-B4 s0"/></g><text x="383" y="811" class="fill-N1 s1">첫째 잘못 — 세는 단위를 정하지 않았다</text></g><g ><g class="shape"><path d="M796 816h731v348H796z" class="stroke-B1 fill-B4 s0"/></g><text x="1161.5" y="803" class="fill-N1 s1">둘째 잘못 — 수가 맞았다 해도 결론이 나오지 않는다</text></g><g ><g class="shape"><path d="M360 1312h825v474H360z" class="stroke-B1 fill-B4 s0"/></g><text x="772.5" y="1299" class="fill-N1 s1">이 사례에서 가져갈 것</text></g><g ><g class="shape"><path d="M472 50h600v82H472z" class="stroke-B1 fill-B5 s0"/></g><text x="772" y="88.5" class="text-bold fill-N1 s2"><tspan x="772" dy="0">인류학자의 초기 기록에 눈을 가리키는 몇 개의 어근이 언급된다.</tspan><tspan x="772" dy="18.5">원래 맥락은 낱말이 유난히 많다는 주장이 아니었다</tspan></text></g><g ><g class="shape"><path d="M602 232h341v66H602z" class="stroke-B1 fill-B5 s0"/></g><text x="772.5" y="270.5" class="text-bold fill-N1 s2">인용되면서 ‘아주 많다’ 로 바뀐다</text></g><g ><g class="shape"><path d="M504 398h536v66H504z" class="stroke-B1 fill-B5 s0"/></g><text x="772" y="436.5" class="text-bold fill-N1 s2">다시 인용되면서 수가 붙는다. 옮겨질 때마다 수가 커진다</text></g><g ><g class="shape"><path d="M510 564h525v82H510z" class="stroke-B1 fill-B5 s0"/></g><text x="772.5" y="602.5" class="text-bold fill-N1 s2"><tspan x="772.5" dy="0">교과서와 대중 매체에 ‘상식’ 으로 자리 잡는다.</tspan><tspan x="772.5" dy="18.5">이 확산 과정을 추적한 언어학자의 글이 1991년에 나왔다</tspan></text></g><g ><g class="shape"><path d="M64 854h639v82H64z" class="stroke-B1 fill-B5 s0"/></g><text x="383.5" y="892.5" class="text-bold fill-N1 s2"><tspan x="383.5" dy="0">이 언어들은 어근에 여러 조각을 붙여 낱말을 만드는 유형이다.</tspan><tspan x="383.5" dy="18.5">그렇게 만들어진 꼴을 각각 하나의 낱말로 세면 수는 얼마든지 커진다</tspan></text></g><g ><g class="shape"><path d="M40 1044h686v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="383" y="1082.5" class="text-bold fill-N1 s2"><tspan x="383" dy="0">같은 방식으로 세면 한국어나 영어의 ‘눈 낱말’ 도 크게 늘어난다 —</tspan><tspan x="383" dy="17.667">함박눈, 진눈깨비, 싸락눈, 첫눈, 눈보라 …</tspan><tspan x="383" dy="17.667">어느 쪽 언어에서든 무엇을 한 낱말로 셀지를 먼저 정해야 수가 뜻을 갖는다</tspan></text></g><g ><g class="shape"><path d="M826 846h671v98H826z" class="stroke-B1 fill-B5 s0"/></g><text x="1161.5" y="884.5" class="text-bold fill-N1 s2"><tspan x="1161.5" dy="0">낱말이 많다는 것은 그 문화가 그것에 관심을 많이 쏟는다는 뜻일 수 있다.</tspan><tspan x="1161.5" dy="17.667">관심이 낱말을 만든 것이지 낱말이 지각을 만든 것이 아닐 수 있다.</tspan><tspan x="1161.5" dy="17.667">둘의 방향을 이 관찰만으로는 가릴 수 없다</tspan></text></g><g ><g class="shape"><path d="M850 1052h624v82H850z" class="stroke-B1 fill-B5 s0"/></g><text x="1162" y="1090.5" class="text-bold fill-N1 s2"><tspan x="1162" dy="0">그리고 이 이야기에는 지각이나 사고를 실제로 잰 자료가 아예 없다.</tspan><tspan x="1162" dy="18.5">낱말 수를 센 것과 무엇을 어떻게 구별하는지를 잰 것은 다른 자료다</tspan></text></g><g ><g class="shape"><path d="M454 1342h637v66H454z" class="stroke-B1 fill-B5 s0"/></g><text x="772.5" y="1380.5" class="text-bold fill-N1 s2">1. 세는 단위를 확인하라. 18장이 세운 읽기 규칙의 첫째와 같은 자리다</text></g><g ><g class="shape"><path d="M390 1508h765v66H390z" class="stroke-B1 fill-B5 s0"/></g><text x="772.5" y="1546.5" class="text-bold fill-N1 s2">2. 인상적인 사례는 옮겨지면서 커진다. 원 출처까지 거슬러 가는 것이 유일한 방어다</text></g><g ><g class="shape"><path d="M463 1674h619v82H463z" class="stroke-B1 fill-B5 s0"/></g><text x="772.5" y="1712.5" class="text-bold fill-N1 s2"><tspan x="772.5" dy="0">3. 워프 가설을 이 이야기로 지지하거나 반박할 수 없다.</tspan><tspan x="772.5" dy="18.5">약한 판본의 근거는 이 이야기가 아니라 앞 그림의 과제 연구들이다</tspan></text></g><marker id="mk-d2-1992584666-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M772.25 134v94" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M772.25 300v94" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M772.25 466v94" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M383 938v102" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M1161.5 946v102" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M383 678v101" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M1161.5 678v93" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M772.25 1410v94" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M772.25 1576v94" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M383 1174v134" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><path fill="none" marker-end="url(#mk-d2-1992584666-3488378134)" d="M1161.5 1166v142" class="connection stroke-B1 s0" mask="url(#d2-1992584666)"/><mask id="d2-1992584666" width="1741" height="2008" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1741v2008H-91z"/></mask></svg>