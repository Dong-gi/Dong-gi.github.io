<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="1558" class="d2-3305331795 d2-svg" viewBox="-101 -101 1030 1558"><rect width="1030" height="1558" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3305331795 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3305331795 .fill-N1{fill:#0a0f25}.d2-3305331795 .fill-B4{fill:#e3e9fd}.d2-3305331795 .fill-B5{fill:#edf0fd}.d2-3305331795 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h360v706H0z" class="stroke-B1 fill-B4 s0"/></g><text x="180" y="33" class="fill-N1 s1"><tspan x="180" dy="0">이야기가</tspan><tspan x="180" dy="32">커진 과정</tspan></text></g><g ><g class="shape"><path d="M410 0h418v706H410z" class="stroke-B1 fill-B4 s0"/></g><text x="619" y="33" class="fill-N1 s1"><tspan x="619" dy="0">첫째 잘못 —</tspan><tspan x="619" dy="32">세는 단위를 정하지 않았다</tspan></text></g><g ><g class="shape"><path d="M0 756h360v600H0z" class="stroke-B1 fill-B4 s0"/></g><text x="180" y="789" class="fill-N1 s1"><tspan x="180" dy="0">둘째 잘못 —</tspan><tspan x="180" dy="30.667">수가 맞았다 해도</tspan><tspan x="180" dy="30.667">결론이 나오지 않는다</tspan></text></g><g ><g class="shape"><path d="M410 756h418v600H410z" class="stroke-B1 fill-B4 s0"/></g><text x="619" y="789" class="fill-N1 s1"><tspan x="619" dy="0">이 사례에서</tspan><tspan x="619" dy="32">가져갈 것</tspan></text></g><g ><g class="shape"><path d="M40 74h280v146H40z" class="stroke-B1 fill-B5 s0"/></g><text x="180" y="112.5" class="text-bold fill-N1 s2"><tspan x="180" dy="0">인류학자의 초기 기록에</tspan><tspan x="180" dy="16.833">눈을 가리키는 몇 개의</tspan><tspan x="180" dy="16.833">어근이 언급된다.</tspan><tspan x="180" dy="16.833">원래 맥락은 낱말이</tspan><tspan x="180" dy="16.833">유난히 많다는</tspan><tspan x="180" dy="16.833">주장이 아니었다</tspan></text></g><g ><g class="shape"><path d="M40 260h280v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="180" y="298.5" class="text-bold fill-N1 s2"><tspan x="180" dy="0">인용되면서</tspan><tspan x="180" dy="18.5">‘아주 많다’ 로 바뀐다</tspan></text></g><g ><g class="shape"><path d="M40 382h280v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="180" y="420.5" class="text-bold fill-N1 s2"><tspan x="180" dy="0">다시 인용되면서</tspan><tspan x="180" dy="17.667">수가 붙는다. 옮겨질 때마다</tspan><tspan x="180" dy="17.667">수가 커진다</tspan></text></g><g ><g class="shape"><path d="M40 520h280v146H40z" class="stroke-B1 fill-B5 s0"/></g><text x="180" y="558.5" class="text-bold fill-N1 s2"><tspan x="180" dy="0">교과서와 대중 매체에</tspan><tspan x="180" dy="16.833">‘상식’ 으로 자리 잡는다.</tspan><tspan x="180" dy="16.833">이 확산 과정은</tspan><tspan x="180" dy="16.833">인류학자가 1986년에</tspan><tspan x="180" dy="16.833">추적했고 언어학자가</tspan><tspan x="180" dy="16.833">1989년에 널리 알렸다</tspan></text></g><g ><g class="shape"><path d="M485 74h268v146H485z" class="stroke-B1 fill-B5 s0"/></g><text x="619" y="112.5" class="text-bold fill-N1 s2"><tspan x="619" dy="0">이 언어들은 어근에</tspan><tspan x="619" dy="16.833">여러 조각을 붙여</tspan><tspan x="619" dy="16.833">낱말을 만드는 유형이다.</tspan><tspan x="619" dy="16.833">그렇게 만들어진 꼴을</tspan><tspan x="619" dy="16.833">각각 하나의 낱말로 세면</tspan><tspan x="619" dy="16.833">수는 얼마든지 커진다</tspan></text></g><g ><g class="shape"><path d="M485 260h268v210H485z" class="stroke-B1 fill-B5 s0"/></g><text x="619" y="298.5" class="text-bold fill-N1 s2"><tspan x="619" dy="0">같은 방식으로 세면</tspan><tspan x="619" dy="16.5">한국어나 영어의</tspan><tspan x="619" dy="16.5">‘눈 낱말’ 도</tspan><tspan x="619" dy="16.5">크게 늘어난다 —</tspan><tspan x="619" dy="16.5">함박눈, 진눈깨비, 싸락눈,</tspan><tspan x="619" dy="16.5">첫눈, 눈보라 …</tspan><tspan x="619" dy="16.5">어느 쪽 언어에서든</tspan><tspan x="619" dy="16.5">무엇을 한 낱말로 셀지를</tspan><tspan x="619" dy="16.5">먼저 정해야</tspan><tspan x="619" dy="16.5">수가 뜻을 갖는다</tspan></text></g><g ><g class="shape"><path d="M40 858h276v210H40z" class="stroke-B1 fill-B5 s0"/></g><text x="178" y="896.5" class="text-bold fill-N1 s2"><tspan x="178" dy="0">낱말이 많다는 것은</tspan><tspan x="178" dy="16.5">그 문화가 그것에</tspan><tspan x="178" dy="16.5">관심을 많이 쏟는다는</tspan><tspan x="178" dy="16.5">뜻일 수 있다.</tspan><tspan x="178" dy="16.5">관심이 낱말을 만든 것이지</tspan><tspan x="178" dy="16.5">낱말이 지각을 만든 것이</tspan><tspan x="178" dy="16.5">아닐 수 있다.</tspan><tspan x="178" dy="16.5">둘의 방향을</tspan><tspan x="178" dy="16.5">이 관찰만으로는</tspan><tspan x="178" dy="16.5">가릴 수 없다</tspan></text></g><g ><g class="shape"><path d="M40 1108h276v178H40z" class="stroke-B1 fill-B5 s0"/></g><text x="178" y="1146.5" class="text-bold fill-N1 s2"><tspan x="178" dy="0">그리고 이 이야기에는</tspan><tspan x="178" dy="16.625">지각이나 사고를</tspan><tspan x="178" dy="16.625">실제로 잰 자료가</tspan><tspan x="178" dy="16.625">아예 없다.</tspan><tspan x="178" dy="16.625">낱말 수를 센 것과</tspan><tspan x="178" dy="16.625">무엇을 어떻게</tspan><tspan x="178" dy="16.625">구별하는지를 잰 것은</tspan><tspan x="178" dy="16.625">다른 자료다</tspan></text></g><g ><g class="shape"><path d="M450 830h253v114H450z" class="stroke-B1 fill-B5 s0"/></g><text x="576.5" y="868.5" class="text-bold fill-N1 s2"><tspan x="576.5" dy="0">1. 세는 단위를 확인하라.</tspan><tspan x="576.5" dy="17.25">18장이 세운</tspan><tspan x="576.5" dy="17.25">읽기 규칙의 첫째와</tspan><tspan x="576.5" dy="17.25">같은 자리다</tspan></text></g><g ><g class="shape"><path d="M450 984h253v130H450z" class="stroke-B1 fill-B5 s0"/></g><text x="576.5" y="1022.5" class="text-bold fill-N1 s2"><tspan x="576.5" dy="0">2. 인상적인 사례는</tspan><tspan x="576.5" dy="17">옮겨지면서 커진다.</tspan><tspan x="576.5" dy="17">원 출처까지</tspan><tspan x="576.5" dy="17">거슬러 가는 것이</tspan><tspan x="576.5" dy="17">유일한 방어다</tspan></text></g><g ><g class="shape"><path d="M450 1154h253v162H450z" class="stroke-B1 fill-B5 s0"/></g><text x="576.5" y="1192.5" class="text-bold fill-N1 s2"><tspan x="576.5" dy="0">3. 워프 가설을</tspan><tspan x="576.5" dy="16.714">이 이야기로 지지하거나</tspan><tspan x="576.5" dy="16.714">반박할 수 없다.</tspan><tspan x="576.5" dy="16.714">약한 판본의 근거는</tspan><tspan x="576.5" dy="16.714">이 이야기가 아니라</tspan><tspan x="576.5" dy="16.714">앞 그림의</tspan><tspan x="576.5" dy="16.714">과제 연구들이다</tspan></text></g><marker id="mk-d2-3305331795-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M180 222v34" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M180 344v34" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M180 482v34" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M619 222v34" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M178 1070v34" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M362 353h44" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M180 708v44" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M576.5 946v34" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M576.5 1116v34" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M619 708v44" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><path fill="none" marker-end="url(#mk-d2-3305331795-3488378134)" d="M362 1056h44" class="connection stroke-B1 s0" mask="url(#d2-3305331795)"/><mask id="d2-3305331795" width="1030" height="1558" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H929v1558H-101z"/></mask></svg>