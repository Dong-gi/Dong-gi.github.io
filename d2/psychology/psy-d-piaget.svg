<svg xmlns="http://www.w3.org/2000/svg" width="4575" height="1434" class="d2-3873216727 d2-svg" viewBox="-42 -85 4575 1434"><rect width="4575" height="1434" x="-42" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3873216727 .fill-N1{fill:#0a0f25}.d2-3873216727 .fill-N2{fill:#676c7e}.d2-3873216727 .fill-B4{fill:#e3e9fd}.d2-3873216727 .fill-B5{fill:#edf0fd}.d2-3873216727 .stroke-B1,.d2-3873216727 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M59 309h2344v732H59z" class="stroke-B1 fill-B4 s0"/></g><text x="1231" y="296" class="fill-N1 s1">피아제가 세운 네 단계</text></g><g ><g class="shape"><path d="M2943 56h507v474h-507z" class="stroke-B1 fill-B4 s0"/></g><text x="3196.5" y="43" class="fill-N1 s1">검사에서 버틴 것</text></g><g ><g class="shape"><path d="M2837 616h719v632h-719z" class="stroke-B1 fill-B4 s0"/></g><text x="3196.5" y="603" class="fill-N1 s1">수정된 것</text></g><text x="4112.5" y="665" class="fill-N1 s2"><tspan x="4112.5" dy="0"> </tspan><tspan x="4112.5" dy="17.667">정확한 요약 — ‘순서는 대체로 버텼고 시기와 이산성은 수정되었다.’</tspan><tspan x="4112.5" dy="17.667">‘피아제가 틀렸다’ 도 ‘피아제가 맞았다’ 도 자료가 지지하는 문장이 아니다</tspan></text><g ><g class="shape"><path d="M89 626h450v98H89z" class="stroke-B1 fill-B5 s0"/></g><text x="314" y="664.5" class="text-bold fill-N1 s2"><tspan x="314" dy="0">감각운동기</tspan><tspan x="314" dy="17.667">감각과 운동으로 세계를 다룬다.</tspan><tspan x="314" dy="17.667">보이지 않는 것을 다루는 힘이 이 시기에 자란다</tspan></text></g><g ><g class="shape"><path d="M717 626h449v98H717z" class="stroke-B1 fill-B5 s0"/></g><text x="941.5" y="664.5" class="text-bold fill-N1 s2"><tspan x="941.5" dy="0">전조작기</tspan><tspan x="941.5" dy="17.667">말과 상징을 쓰지만 되돌려 생각하기가 어렵다.</tspan><tspan x="941.5" dy="17.667">겉모습이 바뀌면 양도 바뀐 것으로 여긴다</tspan></text></g><g ><g class="shape"><path d="M1344 626h469v98h-469z" class="stroke-B1 fill-B5 s0"/></g><text x="1578.5" y="664.5" class="text-bold fill-N1 s2"><tspan x="1578.5" dy="0">구체적 조작기</tspan><tspan x="1578.5" dy="17.667">눈앞의 구체적인 것에 대해 논리적으로 조작한다.</tspan><tspan x="1578.5" dy="17.667">모양이 바뀌어도 양이 그대로임을 안다</tspan></text></g><g ><g class="shape"><path d="M1991 626h382v98h-382z" class="stroke-B1 fill-B5 s0"/></g><text x="2182" y="664.5" class="text-bold fill-N1 s2"><tspan x="2182" dy="0">형식적 조작기</tspan><tspan x="2182" dy="17.667">가정과 가능성에 대해 조작한다.</tspan><tspan x="2182" dy="17.667">‘만약 그렇다면’ 을 체계적으로 다룬다</tspan></text></g><g ><g class="shape"><path d="M3017 86h360v98h-360z" class="stroke-B1 fill-B5 s0"/></g><text x="3197" y="124.5" class="text-bold fill-N1 s2"><tspan x="3197" dy="0">순서</tspan><tspan x="3197" dy="17.667">아이들이 이 능력들을 얻는 차례는</tspan><tspan x="3197" dy="17.667">여러 문화에서 대체로 같게 관찰된다</tspan></text></g><g ><g class="shape"><path d="M2985 244h424v98h-424z" class="stroke-B1 fill-B5 s0"/></g><text x="3197" y="282.5" class="text-bold fill-N1 s2"><tspan x="3197" dy="0">아이의 오류가 무작위가 아니라는 것</tspan><tspan x="3197" dy="17.667">같은 종류의 틀린 답이 되풀이해 나온다.</tspan><tspan x="3197" dy="17.667">그것이 아이의 사고에 구조가 있다는 증거다</tspan></text></g><g ><g class="shape"><path d="M2973 402h447v98h-447z" class="stroke-B1 fill-B5 s0"/></g><text x="3196.5" y="440.5" class="text-bold fill-N1 s2"><tspan x="3196.5" dy="0">방법</tspan><tspan x="3196.5" dy="17.667">아이에게 과제를 주고 왜 그렇게 답했는지 묻는</tspan><tspan x="3196.5" dy="17.667">임상적 면담 방식이 발달 연구에 남았다</tspan></text></g><g ><g class="shape"><path d="M2921 646h551v98h-551z" class="stroke-B1 fill-B5 s0"/></g><text x="3196.5" y="684.5" class="text-bold fill-N1 s2"><tspan x="3196.5" dy="0">시기</tspan><tspan x="3196.5" dy="17.667">피아제가 잡은 나이보다 이르게 통과하는 것이 많다.</tspan><tspan x="3196.5" dy="17.667">과제를 쉽게 바꾸거나 지표를 바꾸면 통과 연령이 내려간다</tspan></text></g><g ><g class="shape"><path d="M2899 804h595v98h-595z" class="stroke-B1 fill-B5 s0"/></g><text x="3196.5" y="842.5" class="text-bold fill-N1 s2"><tspan x="3196.5" dy="0">이산성</tspan><tspan x="3196.5" dy="17.667">한 단계에서 다음 단계로 한꺼번에 건너가지 않는다.</tspan><tspan x="3196.5" dy="17.667">같은 아이가 어떤 과제에서는 통과하고 다른 과제에서는 못 한다</tspan></text></g><g ><g class="shape"><path d="M2908 962h577v98h-577z" class="stroke-B1 fill-B5 s0"/></g><text x="3196.5" y="1000.5" class="text-bold fill-N1 s2"><tspan x="3196.5" dy="0">전면성</tspan><tspan x="3196.5" dy="17.667">단계가 모든 영역에 동시에 걸린다는 그림은 지지되지 않았다.</tspan><tspan x="3196.5" dy="17.667">영역마다 다른 속도로 간다</tspan></text></g><g ><g class="shape"><path d="M2867 1120h659v98h-659z" class="stroke-B1 fill-B5 s0"/></g><text x="3196.5" y="1158.5" class="text-bold fill-N1 s2"><tspan x="3196.5" dy="0">사회의 몫</tspan><tspan x="3196.5" dy="17.667">피아제는 아이가 혼자 세계를 다루며 배운다고 보았다.</tspan><tspan x="3196.5" dy="17.667">비고츠키 쪽은 어른과 또래의 도움이 발달의 자리 자체를 만든다고 본다</tspan></text></g><marker id="mk-d2-3873216727-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3873216727-3488378134)" d="M541 675h172" class="connection stroke-B1 s0" mask="url(#d2-3873216727)"/><path fill="none" marker-end="url(#mk-d2-3873216727-3488378134)" d="M1168 675h172" class="connection stroke-B1 s0" mask="url(#d2-3873216727)"/><path fill="none" marker-end="url(#mk-d2-3873216727-3488378134)" d="M1815 675h172" class="connection stroke-B1 s0" mask="url(#d2-3873216727)"/><path fill="none" marker-end="url(#mk-d2-3873216727-3488378134)" d="M2405 339h534" class="connection stroke-B1 s0" mask="url(#d2-3873216727)"/><text x="2673.5" y="345" class="text-italic fill-N2 s2">무엇이 남았나</text><path fill="none" marker-end="url(#mk-d2-3873216727-3488378134)" d="M2405 1011h428" class="connection stroke-B1 s0" mask="url(#d2-3873216727)"/><text x="2620" y="1017" class="text-italic fill-N2 s2">무엇이 바뀌었나</text><marker id="mk-d2-3873216727-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3873216727-2177206569)" d="M3452 339c201.2 0 327.256 61.9 625.192 306.959" class="connection stroke-B2 s4" mask="url(#d2-3873216727)"/><path fill="none" marker-end="url(#mk-d2-3873216727-2177206569)" d="M3558 1011c116.4 0 221.2-61.8 518.91-306.46" class="connection stroke-B2 s4" mask="url(#d2-3873216727)"/><mask id="d2-3873216727" width="4575" height="1434" x="-42" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-42-85h4575v1434H-42z"/><path d="M2612 329h123v21h-123zM2549 1001h142v21h-142z"/></mask></svg>