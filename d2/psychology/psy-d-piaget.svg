<svg xmlns="http://www.w3.org/2000/svg" width="1647" height="1402" class="d2-1511646350 d2-svg" viewBox="-101 -101 1647 1402"><rect width="1647" height="1402" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1511646350 .fill-N1{fill:#0a0f25}.d2-1511646350 .fill-N2{fill:#676c7e}.d2-1511646350 .fill-B4{fill:#e3e9fd}.d2-1511646350 .fill-B5{fill:#edf0fd}.d2-1511646350 .stroke-B1,.d2-1511646350 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h1445v230H0z" class="stroke-B1 fill-B4 s0"/></g><text x="722.5" y="33" class="fill-N1 s1">피아제가 세운 네 단계</text></g><g ><g class="shape"><path d="M109 452h567v494H109z" class="stroke-B1 fill-B4 s0"/></g><text x="392.5" y="485" class="fill-N1 s1">검사에서 버틴 것</text></g><g ><g class="shape"><path d="M736 351h633v696H736z" class="stroke-B1 fill-B4 s0"/></g><text x="1052.5" y="384" class="fill-N1 s1">수정된 것</text></g><text x="722.5" y="1163" class="fill-N1 s2"><tspan x="722.5" dy="0"> </tspan><tspan x="722.5" dy="17.667">정확한 요약 — ‘순서는 대체로 버텼고 시기와 이산성은 수정되었다.’</tspan><tspan x="722.5" dy="17.667">‘피아제가 틀렸다’ 도 ‘피아제가 맞았다’ 도 자료가 지지하는 문장이 아니다</tspan></text><g ><g class="shape"><path d="M50 50h321v130H50z" class="stroke-B1 fill-B5 s0"/></g><text x="210.5" y="96.5" class="text-bold fill-N1 s2"><tspan x="210.5" dy="0">감각운동기</tspan><tspan x="210.5" dy="17.25">감각과 운동으로 세계를 다룬다.</tspan><tspan x="210.5" dy="17.25">보이지 않는 것을 다루는 힘이</tspan><tspan x="210.5" dy="17.25">이 시기에 자란다</tspan></text></g><g ><g class="shape"><path d="M421 50h277v130H421z" class="stroke-B1 fill-B5 s0"/></g><text x="559.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="559.5" dy="0">전조작기</tspan><tspan x="559.5" dy="17">말과 상징을 쓰지만</tspan><tspan x="559.5" dy="17">되돌려 생각하기가 어렵다.</tspan><tspan x="559.5" dy="17">겉모습이 바뀌면</tspan><tspan x="559.5" dy="17">양도 바뀐 것으로 여긴다</tspan></text></g><g ><g class="shape"><path d="M748 50h276v130H748z" class="stroke-B1 fill-B5 s0"/></g><text x="886" y="88.5" class="text-bold fill-N1 s2"><tspan x="886" dy="0">구체적 조작기</tspan><tspan x="886" dy="17">눈앞의 구체적인 것에 대해</tspan><tspan x="886" dy="17">논리적으로 조작한다.</tspan><tspan x="886" dy="17">모양이 바뀌어도</tspan><tspan x="886" dy="17">양이 그대로임을 안다</tspan></text></g><g ><g class="shape"><path d="M1074 50h321v130h-321z" class="stroke-B1 fill-B5 s0"/></g><text x="1234.5" y="96.5" class="text-bold fill-N1 s2"><tspan x="1234.5" dy="0">형식적 조작기</tspan><tspan x="1234.5" dy="17.25">가정과 가능성에 대해 조작한다.</tspan><tspan x="1234.5" dy="17.25">‘만약 그렇다면’ 을</tspan><tspan x="1234.5" dy="17.25">체계적으로 다룬다</tspan></text></g><g ><g class="shape"><path d="M169 512h447v98H169z" class="stroke-B1 fill-B5 s0"/></g><text x="392.5" y="550.5" class="text-bold fill-N1 s2"><tspan x="392.5" dy="0">순서</tspan><tspan x="392.5" dy="17.667">아이들이 이 능력들을 얻는 차례는</tspan><tspan x="392.5" dy="17.667">여러 문화에서 대체로 같게 관찰된다</tspan></text></g><g ><g class="shape"><path d="M169 650h447v98H169z" class="stroke-B1 fill-B5 s0"/></g><text x="392.5" y="688.5" class="text-bold fill-N1 s2"><tspan x="392.5" dy="0">아이의 오류가 무작위가 아니라는 것</tspan><tspan x="392.5" dy="17.667">같은 종류의 틀린 답이 되풀이해 나온다.</tspan><tspan x="392.5" dy="17.667">그것이 아이의 사고에 구조가 있다는 증거다</tspan></text></g><g ><g class="shape"><path d="M169 788h447v98H169z" class="stroke-B1 fill-B5 s0"/></g><text x="392.5" y="826.5" class="text-bold fill-N1 s2"><tspan x="392.5" dy="0">방법</tspan><tspan x="392.5" dy="17.667">아이에게 과제를 주고 왜 그렇게 답했는지 묻는</tspan><tspan x="392.5" dy="17.667">임상적 면담 방식이 발달 연구에 남았다</tspan></text></g><g ><g class="shape"><path d="M796 411h513v114H796z" class="stroke-B1 fill-B5 s0"/></g><text x="1052.5" y="449.5" class="text-bold fill-N1 s2"><tspan x="1052.5" dy="0">시기</tspan><tspan x="1052.5" dy="17.25">피아제가 잡은 나이보다 이르게 통과하는 것이 많다.</tspan><tspan x="1052.5" dy="17.25">과제를 쉽게 바꾸거나 지표를 바꾸면</tspan><tspan x="1052.5" dy="17.25">통과 연령이 내려간다</tspan></text></g><g ><g class="shape"><path d="M796 565h513v114H796z" class="stroke-B1 fill-B5 s0"/></g><text x="1052.5" y="603.5" class="text-bold fill-N1 s2"><tspan x="1052.5" dy="0">이산성</tspan><tspan x="1052.5" dy="17.25">한 단계에서 다음 단계로 한꺼번에 건너가지 않는다.</tspan><tspan x="1052.5" dy="17.25">같은 아이가 어떤 과제에서는 통과하고</tspan><tspan x="1052.5" dy="17.25">다른 과제에서는 못 한다</tspan></text></g><g ><g class="shape"><path d="M796 719h513v114H796z" class="stroke-B1 fill-B5 s0"/></g><text x="1052.5" y="757.5" class="text-bold fill-N1 s2"><tspan x="1052.5" dy="0">전면성</tspan><tspan x="1052.5" dy="17.25">단계가 모든 영역에 동시에 걸린다는 그림은</tspan><tspan x="1052.5" dy="17.25">지지되지 않았다.</tspan><tspan x="1052.5" dy="17.25">영역마다 다른 속도로 간다</tspan></text></g><g ><g class="shape"><path d="M796 873h513v114H796z" class="stroke-B1 fill-B5 s0"/></g><text x="1052.5" y="911.5" class="text-bold fill-N1 s2"><tspan x="1052.5" dy="0">사회의 몫</tspan><tspan x="1052.5" dy="17.25">피아제는 아이가 혼자 세계를 다루며 배운다고 보았다.</tspan><tspan x="1052.5" dy="17.25">비고츠키 쪽은 어른과 또래의 도움이</tspan><tspan x="1052.5" dy="17.25">발달의 자리 자체를 만든다고 본다</tspan></text></g><marker id="mk-d2-1511646350-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1511646350-3488378134)" d="M372.5 115h45" class="connection stroke-B1 s0" mask="url(#d2-1511646350)"/><path fill="none" marker-end="url(#mk-d2-1511646350-3488378134)" d="M700 115h44" class="connection stroke-B1 s0" mask="url(#d2-1511646350)"/><path fill="none" marker-end="url(#mk-d2-1511646350-3488378134)" d="M1025.5 115h45" class="connection stroke-B1 s0" mask="url(#d2-1511646350)"/><path fill="none" marker-end="url(#mk-d2-1511646350-3488378134)" d="M504.737 230.444C415.3 278.3 392.5 322.9 392.5 448.5" class="connection stroke-B1 s0" mask="url(#d2-1511646350)"/><text x="397.5" y="318" class="text-italic fill-N2 s2">무엇이 남았나</text><path fill="none" marker-end="url(#mk-d2-1511646350-3488378134)" d="M940.263 230.444C1029.7 278.3 1052.5 302.7 1052.5 347.5" class="connection stroke-B1 s0" mask="url(#d2-1511646350)"/><text x="1020" y="279" class="text-italic fill-N2 s2">무엇이 바뀌었나</text><marker id="mk-d2-1511646350-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1511646350-2177206569)" d="M392.5 948c0 118.8 43.2 159 212.103 198.098" class="connection stroke-B2 s4" mask="url(#d2-1511646350)"/><path fill="none" marker-end="url(#mk-d2-1511646350-2177206569)" d="M1052.5 1049c0 38-43.2 58-212.103 97.098" class="connection stroke-B2 s4" mask="url(#d2-1511646350)"/><mask id="d2-1511646350" width="1647" height="1402" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1647v1402H-101z"/><path d="M336 302h123v21H336zM949 263h142v21H949z"/></mask></svg>