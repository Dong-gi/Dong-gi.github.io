<svg xmlns="http://www.w3.org/2000/svg" width="1351" height="1464" class="d2-3909194613 d2-svg" viewBox="-101 -101 1351 1464"><rect width="1351" height="1464" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3909194613 .text-bold{font-weight:700}.d2-3909194613 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3909194613 .fill-N1{fill:#0a0f25}.d2-3909194613 .fill-N2{fill:#676c7e}.d2-3909194613 .fill-B4{fill:#e3e9fd}.d2-3909194613 .fill-B5{fill:#edf0fd}.d2-3909194613 .stroke-B1,.d2-3909194613 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M213 0h703v426H213z" class="stroke-B1 fill-B4 s0"/></g><text x="564.5" y="33" class="fill-N1 s1">피아제가 세운 네 단계</text></g><g ><g class="shape"><path d="M0 571h525v482H0z" class="stroke-B1 fill-B4 s0"/></g><text x="262.5" y="604" class="fill-N1 s1">검사에서 버틴 것</text></g><g ><g class="shape"><path d="M585 547h564v530H585z" class="stroke-B1 fill-B4 s0"/></g><text x="867" y="580" class="fill-N1 s1">수정된 것</text></g><text x="565" y="1193" class="fill-N1 s2"><tspan x="565" dy="0"> </tspan><tspan x="565" dy="17">정확한 요약 —</tspan><tspan x="565" dy="17">‘순서는 대체로 버텼고 시기와 이산성은 수정되었다.’</tspan><tspan x="565" dy="17">‘피아제가 틀렸다’ 도 ‘피아제가 맞았다’ 도</tspan><tspan x="565" dy="17">자료가 지지하는 문장이 아니다</tspan></text><g ><g class="shape"><path d="M263 50h276v146H263z" class="stroke-B1 fill-B5 s0"/></g><text x="401" y="88.5" class="text-bold fill-N1 s2"><tspan x="401" dy="0">감각운동기</tspan><tspan x="401" dy="16.833">감각과 운동으로</tspan><tspan x="401" dy="16.833">세계를 다룬다.</tspan><tspan x="401" dy="16.833">보이지 않는 것을</tspan><tspan x="401" dy="16.833">다루는 힘이</tspan><tspan x="401" dy="16.833">이 시기에 자란다</tspan></text></g><g ><g class="shape"><path d="M589 50h277v146H589z" class="stroke-B1 fill-B5 s0"/></g><text x="727.5" y="96.5" class="text-bold fill-N1 s2"><tspan x="727.5" dy="0">전조작기</tspan><tspan x="727.5" dy="17">말과 상징을 쓰지만</tspan><tspan x="727.5" dy="17">되돌려 생각하기가 어렵다.</tspan><tspan x="727.5" dy="17">겉모습이 바뀌면</tspan><tspan x="727.5" dy="17">양도 바뀐 것으로 여긴다</tspan></text></g><g ><g class="shape"><path d="M263 246h276v130H263z" class="stroke-B1 fill-B5 s0"/></g><text x="401" y="284.5" class="text-bold fill-N1 s2"><tspan x="401" dy="0">구체적 조작기</tspan><tspan x="401" dy="17">눈앞의 구체적인 것에 대해</tspan><tspan x="401" dy="17">논리적으로 조작한다.</tspan><tspan x="401" dy="17">모양이 바뀌어도</tspan><tspan x="401" dy="17">양이 그대로임을 안다</tspan></text></g><g ><g class="shape"><path d="M589 246h277v130H589z" class="stroke-B1 fill-B5 s0"/></g><text x="727.5" y="284.5" class="text-bold fill-N1 s2"><tspan x="727.5" dy="0">형식적 조작기</tspan><tspan x="727.5" dy="17">가정과 가능성에 대해</tspan><tspan x="727.5" dy="17">조작한다.</tspan><tspan x="727.5" dy="17">‘만약 그렇다면’ 을</tspan><tspan x="727.5" dy="17">체계적으로 다룬다</tspan></text></g><g ><g class="shape"><path d="M40 617h212v194H40z" class="stroke-B1 fill-B5 s0"/></g><text x="146" y="671.5" class="text-bold fill-N1 s2"><tspan x="146" dy="0">순서</tspan><tspan x="146" dy="16.714">아이들이</tspan><tspan x="146" dy="16.714">이 능력들을</tspan><tspan x="146" dy="16.714">얻는 차례는</tspan><tspan x="146" dy="16.714">여러 문화에서</tspan><tspan x="146" dy="16.714">대체로 같게</tspan><tspan x="146" dy="16.714">관찰된다</tspan></text></g><g ><g class="shape"><path d="M292 617h193v194H292z" class="stroke-B1 fill-B5 s0"/></g><text x="388.5" y="655.5" class="text-bold fill-N1 s2"><tspan x="388.5" dy="0">아이의 오류가</tspan><tspan x="388.5" dy="16.556">무작위가</tspan><tspan x="388.5" dy="16.556">아니라는 것</tspan><tspan x="388.5" dy="16.556">같은 종류의</tspan><tspan x="388.5" dy="16.556">틀린 답이</tspan><tspan x="388.5" dy="16.556">되풀이해 나온다.</tspan><tspan x="388.5" dy="16.556">그것이 아이의</tspan><tspan x="388.5" dy="16.556">사고에 구조가</tspan><tspan x="388.5" dy="16.556">있다는 증거다</tspan></text></g><g ><g class="shape"><path d="M40 851h212v162H40z" class="stroke-B1 fill-B5 s0"/></g><text x="146" y="889.5" class="text-bold fill-N1 s2"><tspan x="146" dy="0">방법</tspan><tspan x="146" dy="16.714">아이에게</tspan><tspan x="146" dy="16.714">과제를 주고</tspan><tspan x="146" dy="16.714">왜 그렇게</tspan><tspan x="146" dy="16.714">답했는지 묻는</tspan><tspan x="146" dy="16.714">임상적 면담 방식이</tspan><tspan x="146" dy="16.714">발달 연구에 남았다</tspan></text></g><g ><g class="shape"><path d="M625 593h232v210H625z" class="stroke-B1 fill-B5 s0"/></g><text x="741" y="655.5" class="text-bold fill-N1 s2"><tspan x="741" dy="0">시기</tspan><tspan x="741" dy="16.714">피아제가 잡은</tspan><tspan x="741" dy="16.714">나이보다 이르게</tspan><tspan x="741" dy="16.714">통과하는 것이 많다.</tspan><tspan x="741" dy="16.714">과제를 쉽게 바꾸거나</tspan><tspan x="741" dy="16.714">지표를 바꾸면</tspan><tspan x="741" dy="16.714">통과 연령이 내려간다</tspan></text></g><g ><g class="shape"><path d="M897 593h212v210H897z" class="stroke-B1 fill-B5 s0"/></g><text x="1003" y="631.5" class="text-bold fill-N1 s2"><tspan x="1003" dy="0">이산성</tspan><tspan x="1003" dy="16.5">한 단계에서</tspan><tspan x="1003" dy="16.5">다음 단계로</tspan><tspan x="1003" dy="16.5">한꺼번에</tspan><tspan x="1003" dy="16.5">건너가지 않는다.</tspan><tspan x="1003" dy="16.5">같은 아이가</tspan><tspan x="1003" dy="16.5">어떤 과제에서는</tspan><tspan x="1003" dy="16.5">통과하고</tspan><tspan x="1003" dy="16.5">다른 과제에서는</tspan><tspan x="1003" dy="16.5">못 한다</tspan></text></g><g ><g class="shape"><path d="M625 843h232v194H625z" class="stroke-B1 fill-B5 s0"/></g><text x="741" y="897.5" class="text-bold fill-N1 s2"><tspan x="741" dy="0">전면성</tspan><tspan x="741" dy="16.714">단계가 모든 영역에</tspan><tspan x="741" dy="16.714">동시에 걸린다는</tspan><tspan x="741" dy="16.714">그림은</tspan><tspan x="741" dy="16.714">지지되지 않았다.</tspan><tspan x="741" dy="16.714">영역마다</tspan><tspan x="741" dy="16.714">다른 속도로 간다</tspan></text></g><g ><g class="shape"><path d="M897 843h212v194H897z" class="stroke-B1 fill-B5 s0"/></g><text x="1003" y="881.5" class="text-bold fill-N1 s2"><tspan x="1003" dy="0">사회의 몫</tspan><tspan x="1003" dy="16.556">피아제는 아이가</tspan><tspan x="1003" dy="16.556">혼자 세계를 다루며</tspan><tspan x="1003" dy="16.556">배운다고 보았다.</tspan><tspan x="1003" dy="16.556">비고츠키 쪽은</tspan><tspan x="1003" dy="16.556">어른과 또래의</tspan><tspan x="1003" dy="16.556">도움이 발달의</tspan><tspan x="1003" dy="16.556">자리 자체를</tspan><tspan x="1003" dy="16.556">만든다고 본다</tspan></text></g><marker id="mk-d2-3909194613-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3909194613-3488378134)" d="M540.5 123h45" class="connection stroke-B1 s0" mask="url(#d2-3909194613)"/><path fill="none" marker-end="url(#mk-d2-3909194613-3488378134)" d="m599.266 196.997-81.798 47.01" class="connection stroke-B1 s0" mask="url(#d2-3909194613)"/><path fill="none" marker-end="url(#mk-d2-3909194613-3488378134)" d="M540.5 311h45" class="connection stroke-B1 s0" mask="url(#d2-3909194613)"/><path fill="none" marker-end="url(#mk-d2-3909194613-3488378134)" d="M328.021 426.846C275.9 474.3 262.5 503.5 262.5 567.5" class="connection stroke-B1 s0" mask="url(#d2-3909194613)"/><text x="270.5" y="492" class="text-italic fill-N2 s2">무엇이 남았나</text><path fill="none" marker-end="url(#mk-d2-3909194613-3488378134)" d="M801.479 426.846C853.6 474.3 867 498.7 867 543.5" class="connection stroke-B1 s0" mask="url(#d2-3909194613)"/><text x="855" y="482" class="text-italic fill-N2 s2">무엇이 바뀌었나</text><marker id="mk-d2-3909194613-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3909194613-2177206569)" d="M262.5 1055c0 57.2 32.6 82 159.176 120.827" class="connection stroke-B2 s4" mask="url(#d2-3909194613)"/><path fill="none" marker-end="url(#mk-d2-3909194613-2177206569)" d="M867 1079c0 38-32.6 58-159.176 96.827" class="connection stroke-B2 s4" mask="url(#d2-3909194613)"/><mask id="d2-3909194613" width="1351" height="1464" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1351v1464H-101z"/><path d="M209 476h123v21H209zM784 466h142v21H784z"/></mask></svg>