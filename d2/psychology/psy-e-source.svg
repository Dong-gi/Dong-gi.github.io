<svg xmlns="http://www.w3.org/2000/svg" width="3010" height="1319" class="d2-3279932913 d2-svg" viewBox="-91 -121 3010 1319"><rect width="3010" height="1319" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3279932913 .fill-N1{fill:#0a0f25}.d2-3279932913 .fill-B4{fill:#e3e9fd}.d2-3279932913 .fill-B5{fill:#edf0fd}.d2-3279932913 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M1156 20h948v126h-948z" class="stroke-B1 fill-B4 s0"/></g><text x="1630" y="7" class="fill-N1 s1">같은 내용이 여러 경로로 들어온다</text></g><g ><g class="shape"><path d="M1455 266h478v114h-478z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1694" y="304.5" class="text-bold fill-N1 s2"><tspan x="1694" dy="0">남는 것</tspan><tspan x="1694" dy="17.25">내용은 비교적 잘 남는다.</tspan><tspan x="1694" dy="17.25">그런데 ‘이것이 어디서 왔는가’ 는 함께 남지 않고,</tspan><tspan x="1694" dy="17.25">필요할 때 그때그때 판단으로 채워진다</tspan></text></g><g ><g class="shape"><path d="M613 500h2122v126H613z" class="stroke-B1 fill-B4 s0"/></g><text x="1674" y="487" class="fill-N1 s1">출처를 정하는 판단이 기대는 것</text></g><g ><g class="shape"><path d="M10 766h2808v142H10z" class="stroke-B1 fill-B4 s0"/></g><text x="1414" y="753" class="fill-N1 s1">그래서 생기는 일</text></g><text x="1694" y="1044" class="fill-N1 s2"><tspan x="1694" dy="0"> </tspan><tspan x="1694" dy="17.25">요점 — 기억이 어긋나는 흔한 방식은 없던 것을 지어내는 것이 아니라,</tspan><tspan x="1694" dy="17.25">있던 내용에 잘못된 출처가 붙는 것이다.</tspan><tspan x="1694" dy="17.25">그래서 본인은 거짓말을 한다는 느낌 없이 틀린 진술을 할 수 있다</tspan></text><g ><g class="shape"><path d="M1186 50h131v66h-131z" class="stroke-B1 fill-B5 s0"/></g><text x="1251.5" y="88.5" class="text-bold fill-N1 s2">직접 본 것</text></g><g ><g class="shape"><path d="M1377 50h171v66h-171z" class="stroke-B1 fill-B5 s0"/></g><text x="1462.5" y="88.5" class="text-bold fill-N1 s2">남에게 들은 것</text></g><g ><g class="shape"><path d="M1608 50h171v66h-171z" class="stroke-B1 fill-B5 s0"/></g><text x="1693.5" y="88.5" class="text-bold fill-N1 s2">글에서 읽은 것</text></g><g ><g class="shape"><path d="M1839 50h235v66h-235z" class="stroke-B1 fill-B5 s0"/></g><text x="1956.5" y="88.5" class="text-bold fill-N1 s2">머릿속으로 그려 본 것</text></g><g ><g class="shape"><path d="M643 530h673v66H643z" class="stroke-B1 fill-B5 s0"/></g><text x="979.5" y="568.5" class="text-bold fill-N1 s2">얼마나 또렷한가 — 감각의 세부가 많으면 직접 겪은 것으로 판단하기 쉽다</text></g><g ><g class="shape"><path d="M1376 530h636v66h-636z" class="stroke-B1 fill-B5 s0"/></g><text x="1694" y="568.5" class="text-bold fill-N1 s2">얼마나 애쓴 흔적이 있나 — 스스로 만들어 낸 것에는 그 흔적이 남는다</text></g><g ><g class="shape"><path d="M2072 530h633v66h-633z" class="stroke-B1 fill-B5 s0"/></g><text x="2388.5" y="568.5" class="text-bold fill-N1 s2">앞뒤가 맞는가 — 다른 아는 것과 어울리면 겪은 것으로 판단하기 쉽다</text></g><g ><g class="shape"><path d="M40 804h616v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="348" y="842.5" class="text-bold fill-N1 s2">들은 것을 본 것으로 옮겨 적는다 — 이것이 오정보 효과의 한 경로다</text></g><g ><g class="shape"><path d="M716 804h619v66H716z" class="stroke-B1 fill-B5 s0"/></g><text x="1025.5" y="842.5" class="text-bold fill-N1 s2">그려 본 것을 겪은 것으로 옮겨 적는다 — 상상 팽창이 이 자리에 있다</text></g><g ><g class="shape"><path d="M1395 804h597v66h-597z" class="stroke-B1 fill-B5 s0"/></g><text x="1693.5" y="842.5" class="text-bold fill-N1 s2">누구에게 들었는지를 잘못 붙인다. 내용은 맞는데 사람이 틀린다</text></g><g ><g class="shape"><path d="M2052 796h736v82h-736z" class="stroke-B1 fill-B5 s0"/></g><text x="2420" y="834.5" class="text-bold fill-N1 s2"><tspan x="2420" dy="0">출처를 잊고 내용만 남으면, 처음에 ‘믿을 수 없다’ 는 표시와 함께 들어온 정보도</tspan><tspan x="2420" dy="18.5">뒤에는 그 표시 없이 떠오를 수 있다</tspan></text></g><marker id="mk-d2-3279932913-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3279932913-3488378134)" d="M1693.5 148v114" class="connection stroke-B1 s0" mask="url(#d2-3279932913)"/><path fill="none" marker-end="url(#mk-d2-3279932913-3488378134)" d="M1693.5 382v73" class="connection stroke-B1 s0" mask="url(#d2-3279932913)"/><path fill="none" marker-end="url(#mk-d2-3279932913-3488378134)" d="M1693.5 628v134" class="connection stroke-B1 s0" mask="url(#d2-3279932913)"/><marker id="mk-d2-3279932913-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3279932913-2177206569)" d="M1693.5 910v114" class="connection" mask="url(#d2-3279932913)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3279932913" width="3010" height="1319" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h3010v1319H-91z"/></mask></svg>