<svg xmlns="http://www.w3.org/2000/svg" width="1238" height="1709" class="d2-2871385814 d2-svg" viewBox="-91 -121 1238 1709"><rect width="1238" height="1709" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2871385814 .fill-N1{fill:#0a0f25}.d2-2871385814 .fill-B4{fill:#e3e9fd}.d2-2871385814 .fill-B5{fill:#edf0fd}.d2-2871385814 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M10 20h948v126H10z" class="stroke-B1 fill-B4 s0"/></g><text x="484" y="7" class="fill-N1 s1">같은 내용이 여러 경로로 들어온다</text></g><g ><g class="shape"><path d="M309 266h478v114H309z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="548" y="304.5" class="text-bold fill-N1 s2"><tspan x="548" dy="0">남는 것</tspan><tspan x="548" dy="17.25">내용은 비교적 잘 남는다.</tspan><tspan x="548" dy="17.25">그런데 ‘이것이 어디서 왔는가’ 는 함께 남지 않고,</tspan><tspan x="548" dy="17.25">필요할 때 그때그때 판단으로 채워진다</tspan></text></g><g ><g class="shape"><path d="M151 480h793v398H151z" class="stroke-B1 fill-B4 s0"/></g><text x="547.5" y="513" class="fill-N1 s1">출처를 정하는 판단이 기대는 것</text></g><g ><g class="shape"><path d="M49 978h997v340H49z" class="stroke-B1 fill-B4 s0"/></g><text x="547.5" y="1011" class="fill-N1 s1">그래서 생기는 일</text></g><text x="548" y="1434" class="fill-N1 s2"><tspan x="548" dy="0"> </tspan><tspan x="548" dy="17.25">요점 — 기억이 어긋나는 흔한 방식은 없던 것을 지어내는 것이 아니라,</tspan><tspan x="548" dy="17.25">있던 내용에 잘못된 출처가 붙는 것이다.</tspan><tspan x="548" dy="17.25">그래서 본인은 거짓말을 한다는 느낌 없이 틀린 진술을 할 수 있다</tspan></text><g ><g class="shape"><path d="M40 50h131v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="105.5" y="88.5" class="text-bold fill-N1 s2">직접 본 것</text></g><g ><g class="shape"><path d="M231 50h171v66H231z" class="stroke-B1 fill-B5 s0"/></g><text x="316.5" y="88.5" class="text-bold fill-N1 s2">남에게 들은 것</text></g><g ><g class="shape"><path d="M462 50h171v66H462z" class="stroke-B1 fill-B5 s0"/></g><text x="547.5" y="88.5" class="text-bold fill-N1 s2">글에서 읽은 것</text></g><g ><g class="shape"><path d="M693 50h235v66H693z" class="stroke-B1 fill-B5 s0"/></g><text x="810.5" y="88.5" class="text-bold fill-N1 s2">머릿속으로 그려 본 것</text></g><g ><g class="shape"><path d="M211 540h673v66H211z" class="stroke-B1 fill-B5 s0"/></g><text x="547.5" y="578.5" class="text-bold fill-N1 s2">얼마나 또렷한가 — 감각의 세부가 많으면 직접 겪은 것으로 판단하기 쉽다</text></g><g ><g class="shape"><path d="M211 646h673v66H211z" class="stroke-B1 fill-B5 s0"/></g><text x="547.5" y="684.5" class="text-bold fill-N1 s2">얼마나 애쓴 흔적이 있나 — 스스로 만들어 낸 것에는 그 흔적이 남는다</text></g><g ><g class="shape"><path d="M211 752h673v66H211z" class="stroke-B1 fill-B5 s0"/></g><text x="547.5" y="790.5" class="text-bold fill-N1 s2">앞뒤가 맞는가 — 다른 아는 것과 어울리면 겪은 것으로 판단하기 쉽다</text></g><g ><g class="shape"><path d="M109 1038h341v82H109z" class="stroke-B1 fill-B5 s0"/></g><text x="279.5" y="1076.5" class="text-bold fill-N1 s2"><tspan x="279.5" dy="0">들은 것을 본 것으로 옮겨 적는다</tspan><tspan x="279.5" dy="18.5">— 이것이 오정보 효과의 한 경로다</tspan></text></g><g ><g class="shape"><path d="M490 1038h496v82H490z" class="stroke-B1 fill-B5 s0"/></g><text x="738" y="1076.5" class="text-bold fill-N1 s2"><tspan x="738" dy="0">그려 본 것을 겪은 것으로 옮겨 적는다</tspan><tspan x="738" dy="18.5">— 상상 팽창이 이 자리에 있다</tspan></text></g><g ><g class="shape"><path d="M109 1160h341v98H109z" class="stroke-B1 fill-B5 s0"/></g><text x="279.5" y="1206.5" class="text-bold fill-N1 s2"><tspan x="279.5" dy="0">누구에게 들었는지를 잘못 붙인다.</tspan><tspan x="279.5" dy="18.5">내용은 맞는데 사람이 틀린다</tspan></text></g><g ><g class="shape"><path d="M490 1160h496v98H490z" class="stroke-B1 fill-B5 s0"/></g><text x="738" y="1198.5" class="text-bold fill-N1 s2"><tspan x="738" dy="0">출처를 잊고 내용만 남으면,</tspan><tspan x="738" dy="17.667">처음에 ‘믿을 수 없다’ 는 표시와 함께 들어온 정보도</tspan><tspan x="738" dy="17.667">뒤에는 그 표시 없이 떠오를 수 있다</tspan></text></g><marker id="mk-d2-2871385814-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2871385814-3488378134)" d="M547.5 148v114" class="connection stroke-B1 s0" mask="url(#d2-2871385814)"/><path fill="none" marker-end="url(#mk-d2-2871385814-3488378134)" d="M547.5 382v94" class="connection stroke-B1 s0" mask="url(#d2-2871385814)"/><path fill="none" marker-end="url(#mk-d2-2871385814-3488378134)" d="M547.5 880v94" class="connection stroke-B1 s0" mask="url(#d2-2871385814)"/><marker id="mk-d2-2871385814-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2871385814-2177206569)" d="M547.5 1320v94" class="connection" mask="url(#d2-2871385814)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-2871385814" width="1238" height="1709" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1238v1709H-91z"/></mask></svg>