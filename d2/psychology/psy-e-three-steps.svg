<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="970" class="d2-2444261353 d2-svg" viewBox="-101 -101 1350 970"><rect width="1350" height="970" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2444261353 .fill-N1{fill:#0a0f25}.d2-2444261353 .fill-B6{fill:#f7f8fe}.d2-2444261353 .stroke-B1,.d2-2444261353 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M533 0h366v82H533z" class="stroke-B1 fill-B6 s0"/></g><text x="716" y="38.5" class="text-bold fill-N1 s1"><tspan x="716" dy="0">부호화</tspan><tspan x="716" dy="18.5">들어온 것을 남길 수 있는 꼴로 바꾼다</tspan></text></g><g ><g class="shape"><path d="M310 182h363v82H310z" class="stroke-B1 fill-B6 s0"/></g><text x="491.5" y="220.5" class="text-bold fill-N1 s1"><tspan x="491.5" dy="0">저장</tspan><tspan x="491.5" dy="18.5">그 꼴을 시간이 흐르는 동안 유지한다</tspan></text></g><g ><g class="shape"><path d="M129 364h299v82H129z" class="stroke-B1 fill-B6 s0"/></g><text x="278.5" y="402.5" class="text-bold fill-N1 s1"><tspan x="278.5" dy="0">인출</tspan><tspan x="278.5" dy="18.5">필요할 때 그것을 다시 꺼낸다</tspan></text></g><text x="940.5" y="205" class="fill-N1 s1"><tspan x="940.5" dy="0">여기서 어긋나면</tspan><tspan x="940.5" dy="17.25">애초에 들어가지 않았다. 주의가 다른 데 있었거나</tspan><tspan x="940.5" dy="17.25">뜻을 처리하지 않고 겉만 지나갔다.</tspan><tspan x="940.5" dy="17.25">이때는 아무리 단서를 줘도 나오지 않는다</tspan></text><text x="705" y="395" class="fill-N1 s1"><tspan x="705" dy="0">여기서 어긋나면</tspan><tspan x="705" dy="17.667">있던 것이 흐려지거나 다른 것에 밀린다.</tspan><tspan x="705" dy="17.667">그 자리에 들어온 비슷한 자료가 원인인 경우가 많다</tspan></text><text x="278.5" y="562" class="fill-N1 s1"><tspan x="278.5" dy="0">여기서 어긋나면</tspan><tspan x="278.5" dy="17.667">있는데 못 꺼낸다. 단서가 맞으면 그대로 나온다.</tspan><tspan x="278.5" dy="17.667">혀끝에서 맴도는 상태가 이쪽이다</tspan></text><text x="278.5" y="715" class="fill-N1 s1"><tspan x="278.5" dy="0"> </tspan><tspan x="278.5" dy="17.25">실무에서 갈라 보는 법 — 단서를 주었을 때 나오면 인출의 문제이고,</tspan><tspan x="278.5" dy="17.25">단서를 줘도 나오지 않으면 앞의 두 걸음 가운데 하나다.</tspan><tspan x="278.5" dy="17.25">재인 검사와 회상 검사를 함께 쓰는 이유가 여기 있다</tspan></text><marker id="mk-d2-2444261353-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2444261353-3488378134)" d="M612.897 82.753C516.35 122 491.75 142 491.75 178" class="connection stroke-B1 s0" mask="url(#d2-2444261353)"/><path fill="none" marker-end="url(#mk-d2-2444261353-3488378134)" d="M393.66 264.786C301.9 304 278.5 324 278.5 360" class="connection stroke-B1 s0" mask="url(#d2-2444261353)"/><marker id="mk-d2-2444261353-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2444261353-2177206569)" d="M819.603 82.753C916.15 122 940.75 143.3 940.75 184.5" class="connection stroke-B2 s3" mask="url(#d2-2444261353)"/><path fill="none" marker-end="url(#mk-d2-2444261353-2177206569)" d="M589.84 264.786C681.6 304 705 326.9 705 374.5" class="connection stroke-B2 s3" mask="url(#d2-2444261353)"/><path fill="none" marker-end="url(#mk-d2-2444261353-2177206569)" d="M278.5 448v94" class="connection stroke-B2 s3" mask="url(#d2-2444261353)"/><path fill="none" marker-end="url(#mk-d2-2444261353-2177206569)" d="M278.5 601v94" class="connection stroke-B2 s3" mask="url(#d2-2444261353)"/><mask id="d2-2444261353" width="1350" height="970" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1350v970H-101z"/></mask></svg>