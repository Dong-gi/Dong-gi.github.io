<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="1286" class="d2-3450718752 d2-svg" viewBox="-101 -101 1184 1286"><rect width="1184" height="1286" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3450718752 .fill-N1{fill:#0a0f25}.d2-3450718752 .fill-B4{fill:#e3e9fd}.d2-3450718752 .fill-B5{fill:#edf0fd}.d2-3450718752 .stroke-B1,.d2-3450718752 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h982v479H0z" class="stroke-B1 fill-B4 s0"/></g><text x="491" y="33" class="fill-N1 s1">2011년에 겹친 세 가지</text></g><g ><g class="shape"><path d="M231 600h521v114H231z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="491.5" y="638.5" class="text-bold fill-N1 s2"><tspan x="491.5" dy="0">2015년 — 재현 프로젝트</tspan><tspan x="491.5" dy="17.25">Open Science Collaboration 이 학술지 세 곳의</tspan><tspan x="491.5" dy="17.25">2008년 논문에서 고른 연구 100편을</tspan><tspan x="491.5" dy="17.25">원저자와 연락하며 되풀이했다. 결과가 6장 본문에 있다</tspan></text></g><g ><g class="shape"><path d="M26 814h931v270H26z" class="stroke-B1 fill-B4 s0"/></g><text x="491.5" y="847" class="fill-N1 s1">그 뒤</text></g><g ><g class="shape"><path d="M60 46h453v130H60z" class="stroke-B1 fill-B5 s0"/></g><text x="286.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="286.5" dy="0">다릴 벰의 예지 논문</tspan><tspan x="286.5" dy="17">표준적인 절차를 그대로 따라 아홉 실험을 하고,</tspan><tspan x="286.5" dy="17">여덟에서 유의한 결과를 얻었다.</tspan><tspan x="286.5" dy="17">주장은 ‘앞으로 일어날 일이</tspan><tspan x="286.5" dy="17">지금의 반응에 영향을 준다’ 는 것이었다</tspan></text></g><text x="747.5" y="62" class="fill-N1 s2"><tspan x="747.5" dy="0">충격은 결론이 아니라 절차에 있었다.</tspan><tspan x="747.5" dy="17.25">그 분야가 인정하는 방법을 그대로 썼는데</tspan><tspan x="747.5" dy="17.25">아무도 믿지 않는 결론이 나왔다면,</tspan><tspan x="747.5" dy="17.25">그 방법으로 얻은 다른 결론들은 무엇인가</tspan></text><g ><g class="shape"><path d="M60 216h453v114H60z" class="stroke-B1 fill-B5 s0"/></g><text x="286.5" y="254.5" class="text-bold fill-N1 s2"><tspan x="286.5" dy="0">시먼스·넬슨·시몬손, ‘위양성 심리학’</tspan><tspan x="286.5" dy="17.25">연구자가 흔히 쓰는 재량 네 가지를 실제로 써서</tspan><tspan x="286.5" dy="17.25">‘노래를 들으면 나이가 어려진다’ 는</tspan><tspan x="286.5" dy="17.25">유의한 결과를 만들어 보였다</tspan></text></g><text x="728.5" y="232" class="fill-N1 s2"><tspan x="728.5" dy="0">논리적으로 불가능한 결론을</tspan><tspan x="728.5" dy="17.25">유의하게 만들 수 있다는 시연이다.</tspan><tspan x="728.5" dy="17.25">이 논문이 ‘연구자 자유도’ 라는 말을</tspan><tspan x="728.5" dy="17.25">널리 퍼뜨렸다</tspan></text><g ><g class="shape"><path d="M60 370h453v69H60z" class="stroke-B1 fill-B5 s0"/></g><text x="286.5" y="410" class="text-bold fill-N1 s2">한 연구자의 대규모 자료 조작이 드러났다</text></g><text x="739.5" y="386" class="fill-N1 s2"><tspan x="739.5" dy="0">이것은 부정이고, 부정은 규칙 위반이라</tspan><tspan x="739.5" dy="17.25">규칙을 세우면 된다.</tspan><tspan x="739.5" dy="17.25">앞의 둘은 규칙을 지켜도 생기는 문제다.</tspan><tspan x="739.5" dy="17.25">그래서 앞의 둘이 더 무거웠다</tspan></text><g ><g class="shape"><path d="M56 860h447v82H56z" class="stroke-B1 fill-B5 s0"/></g><text x="279.5" y="898.5" class="text-bold fill-N1 s2"><tspan x="279.5" dy="0">다중연구실 프로젝트 —</tspan><tspan x="279.5" dy="18.5">여러 나라의 연구실이 같은 절차로 동시에 잰다</tspan></text></g><g ><g class="shape"><path d="M533 860h394v82H533z" class="stroke-B1 fill-B5 s0"/></g><text x="730" y="898.5" class="text-bold fill-N1 s2"><tspan x="730" dy="0">사전등록과 등록보고서 —</tspan><tspan x="730" dy="18.5">자료를 보기 전에 계획을 묶어 둔다</tspan></text></g><g ><g class="shape"><path d="M56 972h447v82H56z" class="stroke-B1 fill-B5 s0"/></g><text x="279.5" y="1010.5" class="text-bold fill-N1 s2"><tspan x="279.5" dy="0">자료·재료·분석 코드 공개가</tspan><tspan x="279.5" dy="18.5">기본 요구가 된다</tspan></text></g><g ><g class="shape"><path d="M533 972h394v82H533z" class="stroke-B1 fill-B5 s0"/></g><text x="730" y="1010.5" class="text-bold fill-N1 s2"><tspan x="730" dy="0">같은 문제가 다른 분야에서도 확인된다 —</tspan><tspan x="730" dy="18.5">심리학만의 일이 아니었다</tspan></text></g><marker id="mk-d2-3450718752-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3450718752-2177206569)" d="M515.5 111h54" class="connection stroke-B2 s4" mask="url(#d2-3450718752)"/><path fill="none" marker-end="url(#mk-d2-3450718752-2177206569)" d="M515.5 273h54" class="connection stroke-B2 s4" mask="url(#d2-3450718752)"/><path fill="none" marker-end="url(#mk-d2-3450718752-2177206569)" d="M515.5 404.5h54" class="connection stroke-B2 s4" mask="url(#d2-3450718752)"/><marker id="mk-d2-3450718752-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3450718752-3488378134)" d="M491 480.5v116" class="connection stroke-B1 s0" mask="url(#d2-3450718752)"/><text x="491" y="545" style="fill:#676c7e;text-anchor:middle;font-size:16px">그러면 실제로 얼마나 되풀이되는지 세어 보자</text><path fill="none" marker-end="url(#mk-d2-3450718752-3488378134)" d="M491 716v94" class="connection stroke-B1 s0" mask="url(#d2-3450718752)"/><mask id="d2-3450718752" width="1184" height="1286" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1184v1286H-101z"/><path d="M298 529h386v21H298z"/></mask></svg>