<svg xmlns="http://www.w3.org/2000/svg" width="2728" height="1022" class="d2-1961581799 d2-svg" viewBox="-91 -121 2728 1022"><rect width="2728" height="1022" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1961581799 .fill-N1{fill:#0a0f25}.d2-1961581799 .fill-B4{fill:#e3e9fd}.d2-1961581799 .fill-B5{fill:#edf0fd}.d2-1961581799 .stroke-B1,.d2-1961581799 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M461 20h2075v295H461z" class="stroke-B1 fill-B4 s0"/></g><text x="1498.5" y="7" class="fill-N1 s1">2011년, 석 달 사이에 겹친 세 가지</text></g><g ><g class="shape"><path d="M1247 456h692v98h-692z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1593" y="494.5" class="text-bold fill-N1 s2"><tspan x="1593" dy="0">2015년 — 재현 프로젝트</tspan><tspan x="1593" dy="17.667">Open Science Collaboration 이 학술지 세 곳의 2008년 논문에서 고른 연구 100편을</tspan><tspan x="1593" dy="17.667">원저자와 연락하며 되풀이했다. 결과가 6장 본문에 있다</tspan></text></g><g ><g class="shape"><path d="M10 674h2515v126H10z" class="stroke-B1 fill-B4 s0"/></g><text x="1267.5" y="661" class="fill-N1 s1">그 뒤</text></g><g ><g class="shape"><path d="M491 50h733v98H491z" class="stroke-B1 fill-B5 s0"/></g><text x="857.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="857.5" dy="0">다릴 뱀의 예지 논문</tspan><tspan x="857.5" dy="17.667">표준적인 절차를 그대로 따라 아홉 실험을 하고, 여덟에서 유의한 결과를 얻었다.</tspan><tspan x="857.5" dy="17.667">주장은 ‘앞으로 일어날 일이 지금의 반응에 영향을 준다’ 는 것이었다</tspan></text></g><text x="858" y="264" class="fill-N1 s2"><tspan x="858" dy="0">충격은 결론이 아니라 절차에 있었다. 그 분야가 인정하는 방법을 그대로 썼는데</tspan><tspan x="858" dy="18.5">아무도 믿지 않는 결론이 나왔다면, 그 방법으로 얻은 다른 결론들은 무엇인가</tspan></text><g ><g class="shape"><path d="M1284 50h617v98h-617z" class="stroke-B1 fill-B5 s0"/></g><text x="1592.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="1592.5" dy="0">시먼스·넬슨·시몬손, ‘위양성 심리학’</tspan><tspan x="1592.5" dy="17.667">연구자가 흔히 쓰는 재량 네 가지를 실제로 써서</tspan><tspan x="1592.5" dy="17.667">‘노래를 들으면 나이가 어려진다’ 는 유의한 결과를 만들어 보였다</tspan></text></g><text x="1593" y="264" class="fill-N1 s2"><tspan x="1593" dy="0">논리적으로 불가능한 결론을 유의하게 만들 수 있다는 시연이다.</tspan><tspan x="1593" dy="18.5">이 논문이 ‘연구자 자유도’ 라는 말을 널리 퍼뜨렸다</tspan></text><g ><g class="shape"><path d="M2012 66h403v66h-403z" class="stroke-B1 fill-B5 s0"/></g><text x="2213.5" y="104.5" class="text-bold fill-N1 s2">한 연구자의 대규모 자료 조작이 드러났다</text></g><text x="2213.5" y="264" class="fill-N1 s2"><tspan x="2213.5" dy="0">이것은 부정이고, 부정은 규칙 위반이라 규칙을 세우면 된다.</tspan><tspan x="2213.5" dy="18.5">앞의 둘은 규칙을 지켜도 생기는 문제다. 그래서 앞의 둘이 더 무거웠다</tspan></text><g ><g class="shape"><path d="M40 704h650v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="365" y="742.5" class="text-bold fill-N1 s2">다중연구실 프로젝트 — 여러 나라의 연구실이 같은 절차로 동시에 잰다</text></g><g ><g class="shape"><path d="M750 704h566v66H750z" class="stroke-B1 fill-B5 s0"/></g><text x="1033" y="742.5" class="text-bold fill-N1 s2">사전등록과 등록보고서 — 자료를 보기 전에 계획을 묶어 둔다</text></g><g ><g class="shape"><path d="M1376 704h433v66h-433z" class="stroke-B1 fill-B5 s0"/></g><text x="1592.5" y="742.5" class="text-bold fill-N1 s2">자료·재료·분석 코드 공개가 기본 요구가 된다</text></g><g ><g class="shape"><path d="M1869 704h626v66h-626z" class="stroke-B1 fill-B5 s0"/></g><text x="2182" y="742.5" class="text-bold fill-N1 s2">같은 문제가 다른 분야에서도 확인된다 — 심리학만의 일이 아니었다</text></g><marker id="mk-d2-1961581799-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1961581799-2177206569)" d="M857.5 150v94" class="connection stroke-B2 s4" mask="url(#d2-1961581799)"/><path fill="none" marker-end="url(#mk-d2-1961581799-2177206569)" d="M1592.5 150v94" class="connection stroke-B2 s4" mask="url(#d2-1961581799)"/><path fill="none" marker-end="url(#mk-d2-1961581799-2177206569)" d="M2213 134v110" class="connection stroke-B2 s4" mask="url(#d2-1961581799)"/><marker id="mk-d2-1961581799-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1961581799-3488378134)" d="M1592.5 316.5v136" class="connection stroke-B1 s0" mask="url(#d2-1961581799)"/><text x="1593" y="391" style="fill:#676c7e;text-anchor:middle;font-size:16px">그러면 실제로 얼마나 되풀이되는지 세어 보자</text><path fill="none" marker-end="url(#mk-d2-1961581799-3488378134)" d="M1592.5 556v114" class="connection stroke-B1 s0" mask="url(#d2-1961581799)"/><mask id="d2-1961581799" width="2728" height="1022" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h2728V901H-91z"/><path d="M1400 375h386v21h-386z"/></mask></svg>