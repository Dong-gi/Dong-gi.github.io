<svg xmlns="http://www.w3.org/2000/svg" width="1526" height="1019" class="d2-3257788827 d2-svg" viewBox="-101 -101 1526 1019"><rect width="1526" height="1019" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3257788827 .fill-N1{fill:#0a0f25}.d2-3257788827 .fill-N2{fill:#676c7e}.d2-3257788827 .fill-B6{fill:#f7f8fe}.d2-3257788827 .stroke-B1,.d2-3257788827 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="664" cy="34.5" class="shape stroke-B1 fill-B6 s0" rx="104" ry="34.5"/></g><text x="664" y="40" class="text-bold fill-N1 s1">들어오는 것</text></g><g ><g class="shape"><path d="M366 169h597v146H366z" class="stroke-B1 fill-B6 s0"/></g><text x="664.5" y="207.5" class="text-bold fill-N1 s1"><tspan x="664.5" dy="0">감각기억</tspan><tspan x="664.5" dy="16.833">용량 — 크다. 눈앞의 것이 거의 그대로 들어온다</tspan><tspan x="664.5" dy="16.833">지속 — 아주 짧다. 시각 쪽은 1초 안쪽</tspan><tspan x="664.5" dy="16.833">담기는 꼴 — 감각 그대로</tspan><tspan x="664.5" dy="16.833">확인한 방법 — 전부 말하게 하지 않고 신호로 한 줄만 지목해</tspan><tspan x="664.5" dy="16.833">말하게 하면, 지목하기 전까지는 전체가 있었다는 것이 드러난다</tspan></text></g><g ><g class="shape"><path d="M254 436h446v130H254z" class="stroke-B1 fill-B6 s0"/></g><text x="477" y="474.5" class="text-bold fill-N1 s1"><tspan x="477" dy="0">단기 저장</tspan><tspan x="477" dy="17">용량 — 적다</tspan><tspan x="477" dy="17">지속 — 짧다. 되뇌지 않으면 사라진다</tspan><tspan x="477" dy="17">담기는 꼴 — 대개 소리로. 그래서 모양이 아니라</tspan><tspan x="477" dy="17">소리가 비슷한 항목끼리 헷갈린다</tspan></text></g><g ><g class="shape"><path d="M0 687h466v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="233" y="725.5" class="text-bold fill-N1 s1"><tspan x="233" dy="0">장기기억</tspan><tspan x="233" dy="17">용량 — 알려진 한계가 없다</tspan><tspan x="233" dy="17">지속 — 아주 길다</tspan><tspan x="233" dy="17">담기는 꼴 — 대개 뜻으로. 그래서 그대로가 아니라</tspan><tspan x="233" dy="17">뜻이 남고, 뜻이 같으면 헷갈린다</tspan></text></g><text x="852.5" y="499" class="fill-N1 s1"><tspan x="852.5" dy="0">주의를 받지 못한 것은</tspan><tspan x="852.5" dy="18.5">곧 사라진다</tspan></text><text x="586" y="750" class="fill-N1 s1"><tspan x="586" dy="0">되뇌지 않으면</tspan><tspan x="586" dy="18.5">밀려 나간다</tspan></text><text x="1015" y="734" class="fill-N1 s1"><tspan x="1015" dy="0"> </tspan><tspan x="1015" dy="17.25">이 그림은 1960년대에 세워진 ‘다중저장 모형’ 이고, 지금도 뼈대로 쓰인다.</tspan><tspan x="1015" dy="17.25">다만 가운데 칸을 ‘저장고’ 로만 보는 그림은 그 뒤에 바뀌었다.</tspan><tspan x="1015" dy="17.25">무엇이 바뀌었는지는 다음 그림에서 다룬다</tspan></text><marker id="mk-d2-3257788827-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3257788827-3488378134)" d="M664.01 71c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-3257788827)"/><path fill="none" marker-end="url(#mk-d2-3257788827-3488378134)" d="M559.875 315.666C493.5 363.3 476.5 387.7 476.5 432.5" class="connection stroke-B1 s0" mask="url(#d2-3257788827)"/><text x="495.5" y="367" class="text-italic fill-N2 s1">주의</text><marker id="mk-d2-3257788827-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3257788827-2177206569)" d="M768.625 315.666C835 363.3 852 396.9 852 478.5" class="connection stroke-B2 s3" mask="url(#d2-3257788827)"/><path fill="none" marker-end="url(#mk-d2-3257788827-3488378134)" d="M314.147 566.253C196 614.3 172.4 638.7 196.142 683.958" class="connection stroke-B1 s0" mask="url(#d2-3257788827)"/><text x="214.5" y="612" class="text-italic fill-N2 s1">되뇌기 · 뜻 붙이기</text><path fill="none" marker-end="url(#mk-d2-3257788827-3488378134)" d="M268.93 685.729C293.6 638.7 316.8 614.3 380.762 567.85" class="connection stroke-B1 s0" mask="url(#d2-3257788827)"/><text x="314.5" y="622" class="text-italic fill-N2 s1">인출</text><path fill="none" marker-end="url(#mk-d2-3257788827-2177206569)" d="M534.312 567.01C575.4 614.3 586 647.9 586 729.5" class="connection stroke-B2 s3" mask="url(#d2-3257788827)"/><path fill="none" marker-end="url(#mk-d2-3257788827-2177206569)" d="M702.447 553.426C952.1 611.794 1015 644.7 1015 713.5" class="connection stroke-B2 s3" mask="url(#d2-3257788827)"/><mask id="d2-3257788827" width="1526" height="1019" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1526V918H-101z"/><path d="M474 351h43v21h-43zM138 596h153v21H138zM293 606h43v21h-43z"/></mask></svg>