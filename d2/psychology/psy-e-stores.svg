<svg xmlns="http://www.w3.org/2000/svg" width="1034" height="1115" class="d2-77255646 d2-svg" viewBox="-101 -101 1034 1115"><rect width="1034" height="1115" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-77255646 .text-bold{font-weight:700}.d2-77255646 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-77255646 .fill-N1{fill:#0a0f25}.d2-77255646 .fill-N2{fill:#676c7e}.d2-77255646 .fill-B6{fill:#f7f8fe}.d2-77255646 .stroke-B1,.d2-77255646 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="530" cy="34.5" class="shape stroke-B1 fill-B6 s0" rx="104" ry="34.5"/></g><text x="530" y="40" class="text-bold fill-N1 s1">들어오는 것</text></g><g ><g class="shape"><path d="M352 169h357v194H352z" class="stroke-B1 fill-B6 s0"/></g><text x="530.5" y="207.5" class="text-bold fill-N1 s1"><tspan x="530.5" dy="0">감각기억</tspan><tspan x="530.5" dy="16.556">용량 — 크다.</tspan><tspan x="530.5" dy="16.556">눈앞의 것이 거의 그대로 들어온다</tspan><tspan x="530.5" dy="16.556">지속 — 아주 짧다. 시각 쪽은 1초 안쪽</tspan><tspan x="530.5" dy="16.556">담기는 꼴 — 감각 그대로</tspan><tspan x="530.5" dy="16.556">확인한 방법 — 전부 말하게 하지 않고</tspan><tspan x="530.5" dy="16.556">신호로 한 줄만 지목해 말하게 하면,</tspan><tspan x="530.5" dy="16.556">지목하기 전까지는 전체가 있었다는</tspan><tspan x="530.5" dy="16.556">것이 드러난다</tspan></text></g><g ><g class="shape"><path d="M202 484h336v162H202z" class="stroke-B1 fill-B6 s0"/></g><text x="370" y="522.5" class="text-bold fill-N1 s1"><tspan x="370" dy="0">단기 저장</tspan><tspan x="370" dy="16.714">용량 — 적다</tspan><tspan x="370" dy="16.714">지속 — 짧다.</tspan><tspan x="370" dy="16.714">되뇌지 않으면 사라진다</tspan><tspan x="370" dy="16.714">담기는 꼴 — 대개 소리로.</tspan><tspan x="370" dy="16.714">그래서 모양이 아니라</tspan><tspan x="370" dy="16.714">소리가 비슷한 항목끼리 헷갈린다</tspan></text></g><g ><g class="shape"><path d="M0 767h324v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="162" y="805.5" class="text-bold fill-N1 s1"><tspan x="162" dy="0">장기기억</tspan><tspan x="162" dy="16.833">용량 — 알려진 한계가 없다</tspan><tspan x="162" dy="16.833">지속 — 아주 길다</tspan><tspan x="162" dy="16.833">담기는 꼴 — 대개 뜻으로.</tspan><tspan x="162" dy="16.833">그래서 그대로가 아니라</tspan><tspan x="162" dy="16.833">뜻이 남고, 뜻이 같으면 헷갈린다</tspan></text></g><text x="690.5" y="563" class="fill-N1 s1"><tspan x="690.5" dy="0">주의를 받지 못한 것은</tspan><tspan x="690.5" dy="18.5">곧 사라진다</tspan></text><text x="444" y="838" class="fill-N1 s1"><tspan x="444" dy="0">되뇌지 않으면</tspan><tspan x="444" dy="18.5">밀려 나간다</tspan></text><text x="698" y="790" class="fill-N1 s1"><tspan x="698" dy="0"> </tspan><tspan x="698" dy="16.625">이 그림은 1960년대에 세워진</tspan><tspan x="698" dy="16.625">‘다중저장 모형’ 이고,</tspan><tspan x="698" dy="16.625">지금도 뼈대로 쓰인다.</tspan><tspan x="698" dy="16.625">다만 가운데 칸을 ‘저장고’ 로만</tspan><tspan x="698" dy="16.625">보는 그림은 그 뒤에 바뀌었다.</tspan><tspan x="698" dy="16.625">무엇이 바뀌었는지는</tspan><tspan x="698" dy="16.625">다음 그림에서 다룬다</tspan></text><marker id="mk-d2-77255646-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-77255646-3488378134)" d="M530.01 71c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-77255646)"/><path fill="none" marker-end="url(#mk-d2-77255646-3488378134)" d="M430.574 363.903C382.4 411.3 370 435.7 370 480.5" class="connection stroke-B1 s0" mask="url(#d2-77255646)"/><text x="380.5" y="420" class="text-italic fill-N2 s1">주의</text><marker id="mk-d2-77255646-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-77255646-2177206569)" d="M629.926 363.903C678.1 411.3 690.5 448.1 690.5 542.5" class="connection stroke-B2 s3" mask="url(#d2-77255646)"/><path fill="none" marker-end="url(#mk-d2-77255646-3488378134)" d="M211.223 646.418C118.6 694.3 101 718.7 123.235 763.911" class="connection stroke-B1 s0" mask="url(#d2-77255646)"/><text x="128.5" y="695" class="text-italic fill-N2 s1">되뇌기 · 뜻 붙이기</text><path fill="none" marker-end="url(#mk-d2-77255646-3488378134)" d="M199.883 765.705C223 718.7 241 694.3 286.195 648.352" class="connection stroke-B1 s0" mask="url(#d2-77255646)"/><text x="236.5" y="706" class="text-italic fill-N2 s1">인출</text><path fill="none" marker-end="url(#mk-d2-77255646-2177206569)" d="M412.93 647.271C437.6 694.3 444 729.5 444 817.5" class="connection stroke-B2 s3" mask="url(#d2-77255646)"/><path fill="none" marker-end="url(#mk-d2-77255646-2177206569)" d="M539.837 638.292C666 692.7 698 719.9 698 769.5" class="connection stroke-B2 s3" mask="url(#d2-77255646)"/><mask id="d2-77255646" width="1034" height="1115" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H933v1115H-101z"/><path d="M359 404h43v21h-43zM52 679h153v21H52zM215 690h43v21h-43z"/></mask></svg>