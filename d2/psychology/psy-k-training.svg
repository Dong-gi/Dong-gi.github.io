<svg xmlns="http://www.w3.org/2000/svg" width="1418" height="1475" class="d2-4050371162 d2-svg" viewBox="-101 -101 1418 1475"><rect width="1418" height="1475" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-4050371162 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4050371162 .fill-N1{fill:#0a0f25}.d2-4050371162 .fill-B4{fill:#e3e9fd}.d2-4050371162 .fill-B5{fill:#edf0fd}.d2-4050371162 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h564v426H0z" class="stroke-B1 fill-B4 s0"/></g><text x="282" y="33" class="fill-N1 s1"><tspan x="282" dy="0">훈련의 뼈대 —</tspan><tspan x="282" dy="30.667">나라마다 제도가 다르므로</tspan><tspan x="282" dy="30.667">이름이 아니라 구조를 본다</tspan></text></g><g ><g class="shape"><path d="M624 0h592v426H624z" class="stroke-B1 fill-B4 s0"/></g><text x="920" y="33" class="fill-N1 s1">가까운 직군의 구분</text></g><g ><g class="shape"><path d="M0 486h564v514H0z" class="stroke-B1 fill-B4 s0"/></g><text x="282" y="519" class="fill-N1 s1">근거기반 실무의 세 다리</text></g><g ><g class="shape"><path d="M624 486h592v514H624z" class="stroke-B1 fill-B4 s0"/></g><text x="920" y="519" class="fill-N1 s1">글로 옮겨지지 않는 부분</text></g><text x="124.5" y="1076" class="fill-N1 s2"><tspan x="124.5" dy="0"> </tspan><tspan x="124.5" dy="16.385">이 문서의 자리 —</tspan><tspan x="124.5" dy="16.385">뼈대와 직군 구분은</tspan><tspan x="124.5" dy="16.385">설명할 수 있고</tspan><tspan x="124.5" dy="16.385">‘글로 옮겨지지 않는 부분’ 은</tspan><tspan x="124.5" dy="16.385">설명할 수 없다.</tspan><tspan x="124.5" dy="16.385">설명할 수 없는 것을</tspan><tspan x="124.5" dy="16.385">설명한 척하면</tspan><tspan x="124.5" dy="16.385">읽은 사람이</tspan><tspan x="124.5" dy="16.385">할 수 있다고</tspan><tspan x="124.5" dy="16.385">착각하게 된다.</tspan><tspan x="124.5" dy="16.385">그래서 이 장은</tspan><tspan x="124.5" dy="16.385">개관에서 멈춘다</tspan></text><g ><g class="shape"><path d="M40 102h232v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="156" y="140.5" class="text-bold fill-N1 s2"><tspan x="156" dy="0">학위 과정 —</tspan><tspan x="156" dy="17.25">이론 · 연구방법 ·</tspan><tspan x="156" dy="17.25">심리측정 · 정신병리 ·</tspan><tspan x="156" dy="17.25">윤리</tspan></text></g><g ><g class="shape"><path d="M312 102h212v114H312z" class="stroke-B1 fill-B5 s0"/></g><text x="418" y="140.5" class="text-bold fill-N1 s2"><tspan x="418" dy="0">감독을 받는 실습 —</tspan><tspan x="418" dy="17.25">실제 사례를 맡고</tspan><tspan x="418" dy="17.25">그 기록을 놓고</tspan><tspan x="418" dy="17.25">지도를 받는다</tspan></text></g><g ><g class="shape"><path d="M40 256h232v130H40z" class="stroke-B1 fill-B5 s0"/></g><text x="156" y="294.5" class="text-bold fill-N1 s2"><tspan x="156" dy="0">수퍼비전 —</tspan><tspan x="156" dy="17">자기가 한 것을</tspan><tspan x="156" dy="17">남에게 보이고</tspan><tspan x="156" dy="17">되먹임을 받는 과정이</tspan><tspan x="156" dy="17">오래 이어진다</tspan></text></g><g ><g class="shape"><path d="M312 256h212v130H312z" class="stroke-B1 fill-B5 s0"/></g><text x="418" y="302.5" class="text-bold fill-N1 s2"><tspan x="418" dy="0">자격과 계속 교육 —</tspan><tspan x="418" dy="17.25">자격을 얻은 뒤에도</tspan><tspan x="418" dy="17.25">교육이 이어지고</tspan><tspan x="418" dy="17.25">윤리 규정을 따른다</tspan></text></g><g ><g class="shape"><path d="M664 46h235v146H664z" class="stroke-B1 fill-B5 s0"/></g><text x="781.5" y="92.5" class="text-bold fill-N1 s2"><tspan x="781.5" dy="0">정신의학 —</tspan><tspan x="781.5" dy="17">의학 훈련을 받는다.</tspan><tspan x="781.5" dy="17">약물 처방과</tspan><tspan x="781.5" dy="17">신체 질환의 감별이</tspan><tspan x="781.5" dy="17">여기에 든다</tspan></text></g><g ><g class="shape"><path d="M939 46h237v146H939z" class="stroke-B1 fill-B5 s0"/></g><text x="1057.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="1057.5" dy="0">임상심리 · 상담심리 —</tspan><tspan x="1057.5" dy="16.833">심리학 훈련을 받는다.</tspan><tspan x="1057.5" dy="16.833">평가와 심리적 개입이</tspan><tspan x="1057.5" dy="16.833">중심이고</tspan><tspan x="1057.5" dy="16.833">나라에 따라</tspan><tspan x="1057.5" dy="16.833">역할과 자격이 다르다</tspan></text></g><g ><g class="shape"><path d="M664 232h235v130H664z" class="stroke-B1 fill-B5 s0"/></g><text x="781.5" y="270.5" class="text-bold fill-N1 s2"><tspan x="781.5" dy="0">이 구분은</tspan><tspan x="781.5" dy="17">나라마다 다르므로,</tspan><tspan x="781.5" dy="17">한 나라의 이름을</tspan><tspan x="781.5" dy="17">다른 나라에</tspan><tspan x="781.5" dy="17">그대로 옮기면 안 된다</tspan></text></g><g ><g class="shape"><path d="M40 532h148v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="114" y="570.5" class="text-bold fill-N1 s2"><tspan x="114" dy="0">최선의</tspan><tspan x="114" dy="18.5">연구 근거</tspan></text></g><g ><g class="shape"><path d="M228 532h238v82H228z" class="stroke-B1 fill-B5 s0"/></g><text x="347" y="570.5" class="text-bold fill-N1 s2"><tspan x="347" dy="0">임상적</tspan><tspan x="347" dy="18.5">전문성</tspan></text></g><g ><g class="shape"><path d="M40 654h148v178H40z" class="stroke-B1 fill-B5 s0"/></g><text x="114" y="740.5" class="text-bold fill-N1 s2"><tspan x="114" dy="0">내담자의</tspan><tspan x="114" dy="18.5">가치와 선호</tspan></text></g><g ><g class="shape"><path d="M228 654h238v178H228z" class="stroke-B1 fill-B5 s0"/></g><text x="347" y="692.5" class="text-bold fill-N1 s2"><tspan x="347" dy="0">셋 가운데</tspan><tspan x="347" dy="16.625">하나만 쓰는 것이</tspan><tspan x="347" dy="16.625">잘못이다.</tspan><tspan x="347" dy="16.625">연구 근거만 보면</tspan><tspan x="347" dy="16.625">앞의 사람이 지워지고,</tspan><tspan x="347" dy="16.625">전문성만 믿으면</tspan><tspan x="347" dy="16.625">4장과 6장이 다룬</tspan><tspan x="347" dy="16.625">문제로 돌아간다</tspan></text></g><g ><g class="shape"><path d="M664 532h235v194H664z" class="stroke-B1 fill-B5 s0"/></g><text x="781.5" y="594.5" class="text-bold fill-N1 s2"><tspan x="781.5" dy="0">판단 —</tspan><tspan x="781.5" dy="16.833">지금 이 사람에게</tspan><tspan x="781.5" dy="16.833">무엇이 필요한가.</tspan><tspan x="781.5" dy="16.833">규칙이 아니라</tspan><tspan x="781.5" dy="16.833">사례를 여러 번 겪으며</tspan><tspan x="781.5" dy="16.833">자란다</tspan></text></g><g ><g class="shape"><path d="M939 532h226v194H939z" class="stroke-B1 fill-B5 s0"/></g><text x="1052" y="570.5" class="text-bold fill-N1 s2"><tspan x="1052" dy="0">자기 반응을 다루기 —</tspan><tspan x="1052" dy="16.556">자기 안에서</tspan><tspan x="1052" dy="16.556">일어나는 것을</tspan><tspan x="1052" dy="16.556">알아차리고</tspan><tspan x="1052" dy="16.556">그것이 개입에</tspan><tspan x="1052" dy="16.556">섞이지 않게 하는 일.</tspan><tspan x="1052" dy="16.556">이것은 남이</tspan><tspan x="1052" dy="16.556">봐 주지 않으면</tspan><tspan x="1052" dy="16.556">배울 수 없다</tspan></text></g><g ><g class="shape"><path d="M664 766h235v194H664z" class="stroke-B1 fill-B5 s0"/></g><text x="781.5" y="804.5" class="text-bold fill-N1 s2"><tspan x="781.5" dy="0">해를 알아보기 —</tspan><tspan x="781.5" dy="16.556">모든 개입이</tspan><tspan x="781.5" dy="16.556">무해한 것은 아니다.</tspan><tspan x="781.5" dy="16.556">어떤 절차가</tspan><tspan x="781.5" dy="16.556">어떤 사람에게</tspan><tspan x="781.5" dy="16.556">나쁜 결과를 냈다는</tspan><tspan x="781.5" dy="16.556">보고가 있고,</tspan><tspan x="781.5" dy="16.556">그것을 알아보는 것이</tspan><tspan x="781.5" dy="16.556">훈련의 일부다</tspan></text></g><g ><g class="shape"><path d="M939 766h226v194H939z" class="stroke-B1 fill-B5 s0"/></g><text x="1052" y="844.5" class="text-bold fill-N1 s2"><tspan x="1052" dy="0">한계를 알기 —</tspan><tspan x="1052" dy="17.25">자기가 다루면</tspan><tspan x="1052" dy="17.25">안 되는 것을</tspan><tspan x="1052" dy="17.25">알아보고 넘기는 일</tspan></text></g><marker id="mk-d2-4050371162-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4050371162-3488378134)" d="M274 159h34" class="connection stroke-B1 s0" mask="url(#d2-4050371162)"/><path fill="none" marker-end="url(#mk-d2-4050371162-3488378134)" d="m324.297 217.048-59.89 36.856" class="connection stroke-B1 s0" mask="url(#d2-4050371162)"/><path fill="none" marker-end="url(#mk-d2-4050371162-3488378134)" d="M274 321h34" class="connection stroke-B1 s0" mask="url(#d2-4050371162)"/><path fill="none" marker-end="url(#mk-d2-4050371162-3488378134)" d="m171.62 615.173 53.14 38.481" class="connection stroke-B1 s0" mask="url(#d2-4050371162)"/><path fill="none" marker-end="url(#mk-d2-4050371162-3488378134)" d="M347 616v34" class="connection stroke-B1 s0" mask="url(#d2-4050371162)"/><path fill="none" marker-end="url(#mk-d2-4050371162-3488378134)" d="M190 743h34" class="connection stroke-B1 s0" mask="url(#d2-4050371162)"/><path fill="none" marker-end="url(#mk-d2-4050371162-3488378134)" d="M566 213h54" class="connection stroke-B1 s0" mask="url(#d2-4050371162)"/><path fill="none" marker-end="url(#mk-d2-4050371162-3488378134)" d="M920 428v54" class="connection stroke-B1 s0" mask="url(#d2-4050371162)"/><text x="920.5" y="462" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">그리고 이 부분은</text><marker id="mk-d2-4050371162-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4050371162-2177206569)" d="M622 743h-54" class="connection" mask="url(#d2-4050371162)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><path fill="none" marker-end="url(#mk-d2-4050371162-3488378134)" d="M282 1001.5v55" class="connection stroke-B1 s0" mask="url(#d2-4050371162)"/><mask id="d2-4050371162" width="1418" height="1475" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1418v1475H-101z"/><path d="M848 446h145v21H848z"/></mask></svg>