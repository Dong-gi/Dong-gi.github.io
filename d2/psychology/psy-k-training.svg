<svg xmlns="http://www.w3.org/2000/svg" width="8325" height="912" class="d2-3800296555 d2-svg" viewBox="-40 -85 8325 912"><rect width="8325" height="912" x="-40" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3800296555 .fill-N1{fill:#0a0f25}.d2-3800296555 .fill-B4{fill:#e3e9fd}.d2-3800296555 .fill-B5{fill:#edf0fd}.d2-3800296555 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M61 440h3147v126H61z" class="stroke-B1 fill-B4 s0"/></g><text x="1634.5" y="427" class="fill-N1 s1">훈련의 뼈대 — 나라마다 제도가 다르므로 이름이 아니라 구조를 본다</text></g><g ><g class="shape"><path d="M3510 260h814v394h-814z" class="stroke-B1 fill-B4 s0"/></g><text x="3917" y="247" class="fill-N1 s1">가까운 직군의 구분</text></g><g ><g class="shape"><path d="M4767 56h939v552h-939z" class="stroke-B1 fill-B4 s0"/></g><text x="5236.5" y="43" class="fill-N1 s1">글로 옮겨지지 않는 부분</text></g><g ><g class="shape"><path d="M6008 348h1305v378H6008z" class="stroke-B1 fill-B4 s0"/></g><text x="6660.5" y="335" class="fill-N1 s1">근거기반 실무의 세 다리</text></g><text x="7869" y="519" class="fill-N1 s2"><tspan x="7869" dy="0"> </tspan><tspan x="7869" dy="17.25">이 문서의 자리 — 왼쪽 두 칸은 설명할 수 있고 오른쪽 칸은 설명할 수 없다.</tspan><tspan x="7869" dy="17.25">설명할 수 없는 것을 설명한 척하면 읽은 사람이 할 수 있다고 착각하게 된다.</tspan><tspan x="7869" dy="17.25">그래서 이 장은 개관에서 멈춘다</tspan></text><g ><g class="shape"><path d="M91 470h514v66H91z" class="stroke-B1 fill-B5 s0"/></g><text x="348" y="508.5" class="text-bold fill-N1 s2">학위 과정 — 이론 · 연구방법 · 심리측정 · 정신병리 · 윤리</text></g><g ><g class="shape"><path d="M786 470h616v66H786z" class="stroke-B1 fill-B5 s0"/></g><text x="1094" y="508.5" class="text-bold fill-N1 s2">감독을 받는 실습 — 실제 사례를 맡고 그 기록을 놓고 지도를 받는다</text></g><g ><g class="shape"><path d="M1583 470h717v66h-717z" class="stroke-B1 fill-B5 s0"/></g><text x="1941.5" y="508.5" class="text-bold fill-N1 s2">수퍼비전 — 자기가 한 것을 남에게 보이고 되먹임을 받는 과정이 오래 이어진다</text></g><g ><g class="shape"><path d="M2481 470h697v66h-697z" class="stroke-B1 fill-B5 s0"/></g><text x="2829.5" y="508.5" class="text-bold fill-N1 s2">자격과 계속 교육 — 자격을 얻은 뒤에도 교육이 이어지고 윤리 규정을 따른다</text></g><g ><g class="shape"><path d="M3566 290h702v66h-702z" class="stroke-B1 fill-B5 s0"/></g><text x="3917" y="328.5" class="text-bold fill-N1 s2">정신의학 — 의학 훈련을 받는다. 약물 처방과 신체 질환의 감별이 여기에 든다</text></g><g ><g class="shape"><path d="M3609 416h615v82h-615z" class="stroke-B1 fill-B5 s0"/></g><text x="3916.5" y="454.5" class="text-bold fill-N1 s2"><tspan x="3916.5" dy="0">임상심리 · 상담심리 — 심리학 훈련을 받는다.</tspan><tspan x="3916.5" dy="18.5">평가와 심리적 개입이 중심이고 나라에 따라 역할과 자격이 다르다</tspan></text></g><g ><g class="shape"><path d="M3540 558h754v66h-754z" class="stroke-B1 fill-B5 s0"/></g><text x="3917" y="596.5" class="text-bold fill-N1 s2">이 구분은 나라마다 다르므로, 한 나라의 이름을 다른 나라에 그대로 옮기면 안 된다</text></g><g ><g class="shape"><path d="M5023 86h427v82h-427z" class="stroke-B1 fill-B5 s0"/></g><text x="5236.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="5236.5" dy="0">판단 — 지금 이 사람에게 무엇이 필요한가.</tspan><tspan x="5236.5" dy="18.5">규칙이 아니라 사례를 여러 번 겪으며 자란다</tspan></text></g><g ><g class="shape"><path d="M4800 228h873v82h-873z" class="stroke-B1 fill-B5 s0"/></g><text x="5236.5" y="266.5" class="text-bold fill-N1 s2"><tspan x="5236.5" dy="0">자기 반응을 다루기 — 자기 안에서 일어나는 것을 알아차리고 그것이 개입에 섞이지 않게 하는 일.</tspan><tspan x="5236.5" dy="18.5">이것은 남이 봐 주지 않으면 배울 수 없다</tspan></text></g><g ><g class="shape"><path d="M4797 370h879v82h-879z" class="stroke-B1 fill-B5 s0"/></g><text x="5236.5" y="408.5" class="text-bold fill-N1 s2"><tspan x="5236.5" dy="0">해를 알아보기 — 모든 개입이 무해한 것은 아니다.</tspan><tspan x="5236.5" dy="18.5">어떤 절차가 어떤 사람에게 나쁜 결과를 냈다는 보고가 있고, 그것을 알아보는 것이 훈련의 일부다</tspan></text></g><g ><g class="shape"><path d="M4950 512h572v66h-572z" class="stroke-B1 fill-B5 s0"/></g><text x="5236" y="550.5" class="text-bold fill-N1 s2">한계를 알기 — 자기가 다루면 안 되는 것을 알아보고 넘기는 일</text></g><g ><g class="shape"><path d="M6058 378h191v66h-191z" class="stroke-B1 fill-B5 s0"/></g><text x="6153.5" y="416.5" class="text-bold fill-N1 s2">최선의 연구 근거</text></g><g ><g class="shape"><path d="M6070 504h168v66h-168z" class="stroke-B1 fill-B5 s0"/></g><text x="6154" y="542.5" class="text-bold fill-N1 s2">임상적 전문성</text></g><g ><g class="shape"><path d="M6038 630h232v66h-232z" class="stroke-B1 fill-B5 s0"/></g><text x="6154" y="668.5" class="text-bold fill-N1 s2">내담자의 가치와 선호</text></g><g ><g class="shape"><path d="M6451 496h832v82h-832z" class="stroke-B1 fill-B5 s0"/></g><text x="6867" y="534.5" class="text-bold fill-N1 s2"><tspan x="6867" dy="0">셋 가운데 하나만 쓰는 것이 잘못이다.</tspan><tspan x="6867" dy="18.5">연구 근거만 보면 앞의 사람이 지워지고, 전문성만 믿으면 4장과 6장이 다룬 문제로 돌아간다</tspan></text></g><marker id="mk-d2-3800296555-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3800296555-3488378134)" d="M607.5 503h174" class="connection stroke-B1 s0" mask="url(#d2-3800296555)"/><path fill="none" marker-end="url(#mk-d2-3800296555-3488378134)" d="M1404.5 503h174" class="connection stroke-B1 s0" mask="url(#d2-3800296555)"/><path fill="none" marker-end="url(#mk-d2-3800296555-3488378134)" d="M2302.5 503h174" class="connection stroke-B1 s0" mask="url(#d2-3800296555)"/><path fill="none" marker-end="url(#mk-d2-3800296555-3488378134)" d="M3209.5 503h297" class="connection stroke-B1 s0" mask="url(#d2-3800296555)"/><path fill="none" marker-end="url(#mk-d2-3800296555-3488378134)" d="M4326 457h437" class="connection stroke-B1 s0" mask="url(#d2-3800296555)"/><text x="4545.5" y="463" style="fill:#676c7e;text-anchor:middle;font-size:16px">그리고 이 부분은</text><path fill="none" marker-end="url(#mk-d2-3800296555-3488378134)" d="M6251 411c86.8 0 177.4 17 447.118 84.035" class="connection stroke-B1 s0" mask="url(#d2-3800296555)"/><path fill="none" marker-end="url(#mk-d2-3800296555-3488378134)" d="M6240.5 537h206" class="connection stroke-B1 s0" mask="url(#d2-3800296555)"/><path fill="none" marker-end="url(#mk-d2-3800296555-3488378134)" d="M6272.5 663c69.6 0 155.9-17 425.618-84.035" class="connection stroke-B1 s0" mask="url(#d2-3800296555)"/><marker id="mk-d2-3800296555-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3800296555-2177206569)" d="M5707.5 411h297" class="connection" mask="url(#d2-3800296555)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><path fill="none" marker-end="url(#mk-d2-3800296555-3488378134)" d="M7314.5 537h236" class="connection stroke-B1 s0" mask="url(#d2-3800296555)"/><mask id="d2-3800296555" width="8325" height="912" x="-40" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-40-85h8325v912H-40z"/><path d="M4473 447h145v21h-145z"/></mask></svg>