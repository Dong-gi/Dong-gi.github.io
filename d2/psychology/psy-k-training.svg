<svg xmlns="http://www.w3.org/2000/svg" width="1735" height="1573" class="d2-215282677 d2-svg" viewBox="-101 -101 1735 1573"><rect width="1735" height="1573" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-215282677 .fill-N1{fill:#0a0f25}.d2-215282677 .fill-B4{fill:#e3e9fd}.d2-215282677 .fill-B5{fill:#edf0fd}.d2-215282677 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h771v546H0z" class="stroke-B1 fill-B4 s0"/></g><text x="385.5" y="33" class="fill-N1 s1"><tspan x="385.5" dy="0">훈련의 뼈대 — 나라마다 제도가 다르므로</tspan><tspan x="385.5" dy="32">이름이 아니라 구조를 본다</tspan></text></g><g ><g class="shape"><path d="M841 0h692v546H841z" class="stroke-B1 fill-B4 s0"/></g><text x="1187" y="33" class="fill-N1 s1">가까운 직군의 구분</text></g><g ><g class="shape"><path d="M0 657h771v543H0z" class="stroke-B1 fill-B4 s0"/></g><text x="385.5" y="644" class="fill-N1 s1">근거기반 실무의 세 다리</text></g><g ><g class="shape"><path d="M841 616h692v584H841z" class="stroke-B1 fill-B4 s0"/></g><text x="1187" y="649" class="fill-N1 s1">글로 옮겨지지 않는 부분</text></g><text x="215.5" y="1286" class="fill-N1 s2"><tspan x="215.5" dy="0"> </tspan><tspan x="215.5" dy="16.833">이 문서의 자리 — 뼈대와 직군 구분은 설명할 수 있고</tspan><tspan x="215.5" dy="16.833">‘글로 옮겨지지 않는 부분’ 은 설명할 수 없다.</tspan><tspan x="215.5" dy="16.833">설명할 수 없는 것을 설명한 척하면</tspan><tspan x="215.5" dy="16.833">읽은 사람이 할 수 있다고 착각하게 된다.</tspan><tspan x="215.5" dy="16.833">그래서 이 장은 개관에서 멈춘다</tspan></text><g ><g class="shape"><path d="M56 74h514v66H56z" class="stroke-B1 fill-B5 s0"/></g><text x="313" y="112.5" class="text-bold fill-N1 s2">학위 과정 — 이론 · 연구방법 · 심리측정 · 정신병리 · 윤리</text></g><g ><g class="shape"><path d="M56 180h514v82H56z" class="stroke-B1 fill-B5 s0"/></g><text x="313" y="218.5" class="text-bold fill-N1 s2"><tspan x="313" dy="0">감독을 받는 실습 — 실제 사례를 맡고</tspan><tspan x="313" dy="18.5">그 기록을 놓고 지도를 받는다</tspan></text></g><g ><g class="shape"><path d="M56 302h514v82H56z" class="stroke-B1 fill-B5 s0"/></g><text x="313" y="340.5" class="text-bold fill-N1 s2"><tspan x="313" dy="0">수퍼비전 — 자기가 한 것을 남에게 보이고</tspan><tspan x="313" dy="18.5">되먹임을 받는 과정이 오래 이어진다</tspan></text></g><g ><g class="shape"><path d="M56 424h514v82H56z" class="stroke-B1 fill-B5 s0"/></g><text x="313" y="462.5" class="text-bold fill-N1 s2"><tspan x="313" dy="0">자격과 계속 교육 — 자격을 얻은 뒤에도</tspan><tspan x="313" dy="18.5">교육이 이어지고 윤리 규정을 따른다</tspan></text></g><g ><g class="shape"><path d="M901 60h494v82H901z" class="stroke-B1 fill-B5 s0"/></g><text x="1148" y="98.5" class="text-bold fill-N1 s2"><tspan x="1148" dy="0">정신의학 — 의학 훈련을 받는다.</tspan><tspan x="1148" dy="18.5">약물 처방과 신체 질환의 감별이 여기에 든다</tspan></text></g><g ><g class="shape"><path d="M901 182h494v98H901z" class="stroke-B1 fill-B5 s0"/></g><text x="1148" y="220.5" class="text-bold fill-N1 s2"><tspan x="1148" dy="0">임상심리 · 상담심리 — 심리학 훈련을 받는다.</tspan><tspan x="1148" dy="17.667">평가와 심리적 개입이 중심이고</tspan><tspan x="1148" dy="17.667">나라에 따라 역할과 자격이 다르다</tspan></text></g><g ><g class="shape"><path d="M901 320h494v82H901z" class="stroke-B1 fill-B5 s0"/></g><text x="1148" y="358.5" class="text-bold fill-N1 s2"><tspan x="1148" dy="0">이 구분은 나라마다 다르므로,</tspan><tspan x="1148" dy="18.5">한 나라의 이름을 다른 나라에 그대로 옮기면 안 된다</tspan></text></g><g ><g class="shape"><path d="M30 687h191v66H30z" class="stroke-B1 fill-B5 s0"/></g><text x="125.5" y="725.5" class="text-bold fill-N1 s2">최선의 연구 근거</text></g><g ><g class="shape"><path d="M281 687h168v66H281z" class="stroke-B1 fill-B5 s0"/></g><text x="365" y="725.5" class="text-bold fill-N1 s2">임상적 전문성</text></g><g ><g class="shape"><path d="M509 687h232v66H509z" class="stroke-B1 fill-B5 s0"/></g><text x="625" y="725.5" class="text-bold fill-N1 s2">내담자의 가치와 선호</text></g><g ><g class="shape"><path d="M123 853h484v98H123z" class="stroke-B1 fill-B5 s0"/></g><text x="365" y="891.5" class="text-bold fill-N1 s2"><tspan x="365" dy="0">셋 가운데 하나만 쓰는 것이 잘못이다.</tspan><tspan x="365" dy="17.667">연구 근거만 보면 앞의 사람이 지워지고,</tspan><tspan x="365" dy="17.667">전문성만 믿으면 4장과 6장이 다룬 문제로 돌아간다</tspan></text></g><g ><g class="shape"><path d="M901 676h572v82H901z" class="stroke-B1 fill-B5 s0"/></g><text x="1187" y="714.5" class="text-bold fill-N1 s2"><tspan x="1187" dy="0">판단 — 지금 이 사람에게 무엇이 필요한가.</tspan><tspan x="1187" dy="18.5">규칙이 아니라 사례를 여러 번 겪으며 자란다</tspan></text></g><g ><g class="shape"><path d="M901 798h572v98H901z" class="stroke-B1 fill-B5 s0"/></g><text x="1187" y="836.5" class="text-bold fill-N1 s2"><tspan x="1187" dy="0">자기 반응을 다루기 — 자기 안에서 일어나는 것을 알아차리고</tspan><tspan x="1187" dy="17.667">그것이 개입에 섞이지 않게 하는 일.</tspan><tspan x="1187" dy="17.667">이것은 남이 봐 주지 않으면 배울 수 없다</tspan></text></g><g ><g class="shape"><path d="M901 936h572v98H901z" class="stroke-B1 fill-B5 s0"/></g><text x="1187" y="974.5" class="text-bold fill-N1 s2"><tspan x="1187" dy="0">해를 알아보기 — 모든 개입이 무해한 것은 아니다.</tspan><tspan x="1187" dy="17.667">어떤 절차가 어떤 사람에게 나쁜 결과를 냈다는 보고가 있고,</tspan><tspan x="1187" dy="17.667">그것을 알아보는 것이 훈련의 일부다</tspan></text></g><g ><g class="shape"><path d="M901 1074h572v66H901z" class="stroke-B1 fill-B5 s0"/></g><text x="1187" y="1112.5" class="text-bold fill-N1 s2">한계를 알기 — 자기가 다루면 안 되는 것을 알아보고 넘기는 일</text></g><marker id="mk-d2-215282677-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-215282677-3488378134)" d="M313 142v34" class="connection stroke-B1 s0" mask="url(#d2-215282677)"/><path fill="none" marker-end="url(#mk-d2-215282677-3488378134)" d="M313 264v34" class="connection stroke-B1 s0" mask="url(#d2-215282677)"/><path fill="none" marker-end="url(#mk-d2-215282677-3488378134)" d="M313 386v34" class="connection stroke-B1 s0" mask="url(#d2-215282677)"/><path fill="none" marker-end="url(#mk-d2-215282677-3488378134)" d="M125.5 755c0 38 24.2 58 117.303 96.472" class="connection stroke-B1 s0" mask="url(#d2-215282677)"/><path fill="none" marker-end="url(#mk-d2-215282677-3488378134)" d="M365 755v94" class="connection stroke-B1 s0" mask="url(#d2-215282677)"/><path fill="none" marker-end="url(#mk-d2-215282677-3488378134)" d="M625 755c0 38-26.2 58-127.263 96.574" class="connection stroke-B1 s0" mask="url(#d2-215282677)"/><path fill="none" marker-end="url(#mk-d2-215282677-3488378134)" d="M773 273h64" class="connection stroke-B1 s0" mask="url(#d2-215282677)"/><path fill="none" marker-end="url(#mk-d2-215282677-3488378134)" d="M1187 548v64" class="connection stroke-B1 s0" mask="url(#d2-215282677)"/><text x="1187.5" y="587" style="fill:#676c7e;text-anchor:middle;font-size:16px">그리고 이 부분은</text><marker id="mk-d2-215282677-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-215282677-2177206569)" d="m839.5 916.556-65.002 1.831" class="connection" mask="url(#d2-215282677)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><path fill="none" marker-end="url(#mk-d2-215282677-3488378134)" d="M385.5 1201.5v65" class="connection stroke-B1 s0" mask="url(#d2-215282677)"/><mask id="d2-215282677" width="1735" height="1573" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1735v1573H-101z"/><path d="M1115 571h145v21h-145z"/></mask></svg>