<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1077" class="d2-516857866 d2-svg" viewBox="-101 -101 1080 1077"><rect width="1080" height="1077" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-516857866 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-516857866 .fill-N1{fill:#0a0f25}.d2-516857866 .fill-B5{fill:#edf0fd}.d2-516857866 .fill-B6{fill:#f7f8fe}.d2-516857866 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h375v224H0z" class="stroke-B1 fill-B6 s0"/></g><text x="187.5" y="117.5" class="text-bold fill-N1 s1">상황</text></g><path fill="transparent" stroke="transparent" d="M455 0h423v224H455z" class="shape s0"/><g ><g class="shape"><path d="M0 284h375v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="187.5" y="330.5" class="text-bold fill-N1 s1">주의</text></g><g ><g class="shape"><path d="M455 284h423v82H455z" class="stroke-B1 fill-B6 s0"/></g><text x="666.5" y="322.5" class="text-bold fill-N1 s1"><tspan x="666.5" dy="0">주의 옮기기</tspan><tspan x="666.5" dy="18.5">무엇을 볼지 바꾼다</tspan></text></g><g ><g class="shape"><path d="M0 426h375v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="187.5" y="464.5" class="text-bold fill-N1 s1"><tspan x="187.5" dy="0">뜻매김</tspan><tspan x="187.5" dy="18.5">그 상황을 무엇으로 보는가</tspan></text></g><g ><g class="shape"><path d="M455 426h423v82H455z" class="stroke-B1 fill-B6 s0"/></g><text x="666.5" y="464.5" class="text-bold fill-N1 s1"><tspan x="666.5" dy="0">달리 보기</tspan><tspan x="666.5" dy="18.5">그 상황이 무엇인지를 다시 뜻매김한다</tspan></text></g><g ><g class="shape"><path d="M0 568h375v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="187.5" y="606.5" class="text-bold fill-N1 s1"><tspan x="187.5" dy="0">반응</tspan><tspan x="187.5" dy="18.5">몸 · 표정 · 행동</tspan></text></g><g ><g class="shape"><path d="M455 568h423v82H455z" class="stroke-B1 fill-B6 s0"/></g><text x="666.5" y="606.5" class="text-bold fill-N1 s1"><tspan x="666.5" dy="0">반응 누르기</tspan><tspan x="666.5" dy="18.5">이미 일어난 반응을 겉으로 안 나오게 한다</tspan></text></g><text x="187.5" y="726" class="fill-N1 s1"><tspan x="187.5" dy="0"> </tspan><tspan x="187.5" dy="16.5">달리 보기와 반응 누르기를 견준 연구가 많다.</tspan><tspan x="187.5" dy="16.5">대체로 앞쪽이 더 나은 결과와 관련되고,</tspan><tspan x="187.5" dy="16.5">뒤쪽은 겉으로 드러나는 것은 줄이면서</tspan><tspan x="187.5" dy="16.5">몸의 각성은 줄이지 못한다는 보고가 있다.</tspan><tspan x="187.5" dy="16.5"> </tspan><tspan x="187.5" dy="16.5">다만 이 비교의 자료 상당수가</tspan><tspan x="187.5" dy="16.5">상관 연구이거나 실험실의 짧은 과제다.</tspan><tspan x="187.5" dy="16.5">그리고 맥락이 정한다 — 지금 이 자리에서</tspan><tspan x="187.5" dy="16.5">표정을 누르는 것이 맞는 상황이 있다</tspan></text><g ><g class="shape"><path d="M475 20h383v82H475z" class="stroke-B1 fill-B5 s0"/></g><text x="666.5" y="58.5" class="text-bold fill-N1 s1"><tspan x="666.5" dy="0">상황 고르기</tspan><tspan x="666.5" dy="18.5">그 상황에 들어갈지 말지를 미리 정한다</tspan></text></g><g ><g class="shape"><path d="M475 122h383v82H475z" class="stroke-B1 fill-B5 s0"/></g><text x="666.5" y="160.5" class="text-bold fill-N1 s1"><tspan x="666.5" dy="0">상황 바꾸기</tspan><tspan x="666.5" dy="18.5">들어가되 조건을 바꾼다</tspan></text></g><marker id="mk-d2-516857866-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-516857866-3488378134)" d="M187.5 226v54" class="connection stroke-B1 s0" mask="url(#d2-516857866)"/><path fill="none" marker-end="url(#mk-d2-516857866-3488378134)" d="M187.5 368v54" class="connection stroke-B1 s0" mask="url(#d2-516857866)"/><path fill="none" marker-end="url(#mk-d2-516857866-3488378134)" d="M187.5 510v54" class="connection stroke-B1 s0" mask="url(#d2-516857866)"/><path fill="none" marker-end="url(#mk-d2-516857866-3488378134)" d="m473.512 81.217-95.036 10.35" class="connection stroke-B1 s0" mask="url(#d2-516857866)"/><path fill="none" marker-end="url(#mk-d2-516857866-3488378134)" d="m473.512 142.783-95.036-10.35" class="connection stroke-B1 s0" mask="url(#d2-516857866)"/><path fill="none" marker-end="url(#mk-d2-516857866-3488378134)" d="M453.5 325h-75" class="connection stroke-B1 s0" mask="url(#d2-516857866)"/><path fill="none" marker-end="url(#mk-d2-516857866-3488378134)" d="M453.5 467h-75" class="connection stroke-B1 s0" mask="url(#d2-516857866)"/><path fill="none" marker-end="url(#mk-d2-516857866-3488378134)" d="M453.5 609h-75" class="connection stroke-B1 s0" mask="url(#d2-516857866)"/><marker id="mk-d2-516857866-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-516857866-2177206569)" d="M187.5 651.5v55" class="connection" mask="url(#d2-516857866)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-516857866" width="1080" height="1077" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H979V976H-101z"/></mask></svg>