<svg xmlns="http://www.w3.org/2000/svg" width="2965" height="631" class="d2-3459270755 d2-svg" viewBox="-101 -101 2965 631"><rect width="2965" height="631" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3459270755 .fill-N1{fill:#0a0f25}.d2-3459270755 .fill-B6{fill:#f7f8fe}.d2-3459270755 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><path d="M547 79h84v66h-84z" class="stroke-B1 fill-B6 s0"/></g><text x="589" y="117.5" class="text-bold fill-N1 s1">상황</text></g><g ><g class="shape"><path d="M943 146h84v66h-84z" class="stroke-B1 fill-B6 s0"/></g><text x="985" y="184.5" class="text-bold fill-N1 s1">주의</text></g><g ><g class="shape"><path d="M1341 205h276v82h-276z" class="stroke-B1 fill-B6 s0"/></g><text x="1479" y="243.5" class="text-bold fill-N1 s1"><tspan x="1479" dy="0">뜻매김</tspan><tspan x="1479" dy="18.5">그 상황을 무엇으로 보는가</tspan></text></g><g ><g class="shape"><path d="M1782 276h167v82h-167z" class="stroke-B1 fill-B6 s0"/></g><text x="1865.5" y="314.5" class="text-bold fill-N1 s1"><tspan x="1865.5" dy="0">반응</tspan><tspan x="1865.5" dy="18.5">몸 · 표정 · 행동</tspan></text></g><g ><g class="shape"><path d="M0 0h383v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="191.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="191.5" dy="0">상황 고르기</tspan><tspan x="191.5" dy="18.5">그 상황에 들어갈지 말지를 미리 정한다</tspan></text></g><g ><g class="shape"><path d="M66 142h252v82H66z" class="stroke-B1 fill-B6 s0"/></g><text x="192" y="180.5" class="text-bold fill-N1 s1"><tspan x="192" dy="0">상황 바꾸기</tspan><tspan x="192" dy="18.5">들어가되 조건을 바꾼다</tspan></text></g><g ><g class="shape"><path d="M483 205h212v82H483z" class="stroke-B1 fill-B6 s0"/></g><text x="589" y="243.5" class="text-bold fill-N1 s1"><tspan x="589" dy="0">주의 옮기기</tspan><tspan x="589" dy="18.5">무엇을 볼지 바꾼다</tspan></text></g><g ><g class="shape"><path d="M795 272h380v82H795z" class="stroke-B1 fill-B6 s0"/></g><text x="985" y="310.5" class="text-bold fill-N1 s1"><tspan x="985" dy="0">달리 보기</tspan><tspan x="985" dy="18.5">그 상황이 무엇인지를 다시 뜻매김한다</tspan></text></g><g ><g class="shape"><path d="M1275 347h407v82h-407z" class="stroke-B1 fill-B6 s0"/></g><text x="1478.5" y="385.5" class="text-bold fill-N1 s1"><tspan x="1478.5" dy="0">반응 누르기</tspan><tspan x="1478.5" dy="18.5">이미 일어난 반응을 겉으로 안 나오게 한다</tspan></text></g><text x="2406" y="283" class="fill-N1 s1"><tspan x="2406" dy="0"> </tspan><tspan x="2406" dy="16.833">달리 보기와 반응 누르기를 견준 연구가 많다. 대체로 앞쪽이 더 나은 결과와 관련되고,</tspan><tspan x="2406" dy="16.833">뒤쪽은 겉으로 드러나는 것은 줄이면서 몸의 각성은 줄이지 못한다는 보고가 있다.</tspan><tspan x="2406" dy="16.833"> </tspan><tspan x="2406" dy="16.833">다만 이 비교의 자료 상당수가 상관 연구이거나 실험실의 짧은 과제다.</tspan><tspan x="2406" dy="16.833">그리고 맥락이 정한다 — 지금 이 자리에서 표정을 누르는 것이 맞는 상황이 있다</tspan></text><marker id="mk-d2-3459270755-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3459270755-3488378134)" d="M633 112c89.2 0 151.6 11 306.146 53.93" class="connection stroke-B1 s0" mask="url(#d2-3459270755)"/><path fill="none" marker-end="url(#mk-d2-3459270755-3488378134)" d="M1029 179c156.4 0 219.1 6.105 307.633 29.504" class="connection stroke-B1 s0" mask="url(#d2-3459270755)"/><path fill="none" marker-end="url(#mk-d2-3459270755-3488378134)" d="M1619.5 246c89.6 0 123.7 6 164.974 28.111" class="connection stroke-B1 s0" mask="url(#d2-3459270755)"/><path fill="none" marker-end="url(#mk-d2-3459270755-3488378134)" d="M385 41c38 0 70.8 10.4 158.36 50.34" class="connection stroke-B1 s0" mask="url(#d2-3459270755)"/><path fill="none" marker-end="url(#mk-d2-3459270755-3488378134)" d="M320.5 183c89.6 0 135.3-10.4 222.86-50.34" class="connection stroke-B1 s0" mask="url(#d2-3459270755)"/><path fill="none" marker-end="url(#mk-d2-3459270755-3488378134)" d="M697 246c38 0 87.6-11 242.146-53.93" class="connection stroke-B1 s0" mask="url(#d2-3459270755)"/><path fill="none" marker-end="url(#mk-d2-3459270755-3488378134)" d="M1177 313c38 0 71.1-6.106 159.633-29.505" class="connection stroke-B1 s0" mask="url(#d2-3459270755)"/><path fill="none" marker-end="url(#mk-d2-3459270755-3488378134)" d="M1684 388c38 0 59.2-6 100.474-28.111" class="connection stroke-B1 s0" mask="url(#d2-3459270755)"/><marker id="mk-d2-3459270755-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3459270755-2177206569)" d="M1951 317h94" class="connection" mask="url(#d2-3459270755)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3459270755" width="2965" height="631" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2965v631H-101z"/></mask></svg>