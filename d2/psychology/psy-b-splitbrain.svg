<svg xmlns="http://www.w3.org/2000/svg" width="3842" height="902" class="d2-632081343 d2-svg" viewBox="-81 -85 3842 902"><rect width="3842" height="902" x="-81" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-632081343 .fill-N1{fill:#0a0f25}.d2-632081343 .fill-B4{fill:#e3e9fd}.d2-632081343 .fill-B5{fill:#edf0fd}.d2-632081343 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M20 335h1101v289H20z" class="stroke-B1 fill-B4 s0"/></g><text x="570.5" y="322" class="fill-N1 s1">절차</text></g><g ><g class="shape"><path d="M1261 193h752v252h-752z" class="stroke-B1 fill-B4 s0"/></g><text x="1637" y="180" class="fill-N1 s1">왼쪽 시야에 보이면</text></g><g ><g class="shape"><path d="M1272 531h625v126h-625z" class="stroke-B1 fill-B4 s0"/></g><text x="1584.5" y="518" class="fill-N1 s1">오른쪽 시야에 보이면</text></g><g ><g class="shape"><path d="M2153 319h668v397h-668z" class="stroke-B1 fill-B4 s0"/></g><text x="2487" y="306" class="fill-N1 s1">여기서 따라 나오는 것</text></g><g ><g class="shape"><path d="M2961 56h699v584h-699z" class="stroke-B1 fill-B4 s0"/></g><text x="3310.5" y="43" class="fill-N1 s1">여기서 반드시 붙일 단서</text></g><g ><g class="shape"><path d="M50 415h386v66H50z" class="stroke-B1 fill-B5 s0"/></g><text x="243" y="453.5" class="text-bold fill-N1 s2">두 반구를 잇는 큰 다발이 잘린 사람에게</text></g><g ><g class="shape"><path d="M536 407h555v82H536z" class="stroke-B1 fill-B5 s0"/></g><text x="813.5" y="445.5" class="text-bold fill-N1 s2"><tspan x="813.5" dy="0">한쪽 시야에만 아주 짧게 그림을 보인다.</tspan><tspan x="813.5" dy="18.5">눈을 움직이면 양쪽에 다 들어가므로 시간을 아주 짧게 준다</tspan></text></g><g ><g class="shape"><path d="M1291 286h212v66h-212z" class="stroke-B1 fill-B5 s0"/></g><text x="1397" y="324.5" class="text-bold fill-N1 s2">오른쪽 반구로 간다</text></g><g ><g class="shape"><path d="M1603 223h380v66h-380z" class="stroke-B1 fill-B5 s0"/></g><text x="1793" y="261.5" class="text-bold fill-N1 s2">말로는 무엇을 보았는지 답하지 못한다</text></g><g ><g class="shape"><path d="M1603 349h380v66h-380z" class="stroke-B1 fill-B5 s0"/></g><text x="1793" y="387.5" class="text-bold fill-N1 s2">그런데 왼손으로는 그 물건을 골라낸다</text></g><g ><g class="shape"><path d="M1302 561h191v66h-191z" class="stroke-B1 fill-B5 s0"/></g><text x="1397.5" y="599.5" class="text-bold fill-N1 s2">왼쪽 반구로 간다</text></g><g ><g class="shape"><path d="M1719 561h148v66h-148z" class="stroke-B1 fill-B5 s0"/></g><text x="1793" y="599.5" class="text-bold fill-N1 s2">말로 답한다</text></g><g ><g class="shape"><path d="M2183 349h608v66h-608z" class="stroke-B1 fill-B5 s0"/></g><text x="2487" y="387.5" class="text-bold fill-N1 s2">‘무엇을 보았는지 아는 것’ 과 ‘그것을 말하는 것’ 이 갈릴 수 있다</text></g><g ><g class="shape"><path d="M2274 478h427v66h-427z" class="stroke-B1 fill-B5 s0"/></g><text x="2487.5" y="516.5" class="text-bold fill-N1 s2">말하는 쪽은 반대편이 아는 것에 닿지 못한다</text></g><g ><g class="shape"><path d="M2212 604h551v82h-551z" class="stroke-B1 fill-B5 s0"/></g><text x="2487.5" y="642.5" class="text-bold fill-N1 s2"><tspan x="2487.5" dy="0">그런데도 이유를 물으면 그럴듯한 설명이 나온다.</tspan><tspan x="2487.5" dy="18.5">말하는 쪽이 자기가 모르는 행동에 대해 이야기를 지어낸다</tspan></text></g><g ><g class="shape"><path d="M3038 86h545v82h-545z" class="stroke-B1 fill-B5 s0"/></g><text x="3310.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="3310.5" dy="0">표본이 아주 작다. 이 절차를 받은 사람은 애초에 소수이고,</tspan><tspan x="3310.5" dy="18.5">자세히 검사된 사람은 그보다도 훨씬 적다</tspan></text></g><g ><g class="shape"><path d="M3053 228h516v82h-516z" class="stroke-B1 fill-B5 s0"/></g><text x="3311" y="266.5" class="text-bold fill-N1 s2"><tspan x="3311" dy="0">그리고 그들은 모두 오래 심한 발작을 겪은 사람들이다.</tspan><tspan x="3311" dy="18.5">수술 전부터 뇌가 이미 달랐을 수 있다</tspan></text></g><g ><g class="shape"><path d="M3065 370h491v98h-491z" class="stroke-B1 fill-B5 s0"/></g><text x="3310.5" y="408.5" class="text-bold fill-N1 s2"><tspan x="3310.5" dy="0">‘두 사람이 한 머리에 있다’ 는 읽기는 다투어진다.</tspan><tspan x="3310.5" dy="17.667">뒤의 연구 가운데는 한쪽 시야의 자극도 어느 정도는</tspan><tspan x="3310.5" dy="17.667">하나로 통합되어 보고된다고 보고한 것이 있다</tspan></text></g><g ><g class="shape"><path d="M2991 528h639v82h-639z" class="stroke-B1 fill-B5 s0"/></g><text x="3310.5" y="566.5" class="text-bold fill-N1 s2"><tspan x="3310.5" dy="0">이 연구에서 ‘좌뇌형 · 우뇌형 성격’ 은 따라 나오지 않는다.</tspan><tspan x="3310.5" dy="18.5">그것은 이 자료와 아무 관계가 없는 별개의 주장이며 지지되지 않는다</tspan></text></g><marker id="mk-d2-632081343-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-632081343-3488378134)" d="M438 448h94" class="connection stroke-B1 s0" mask="url(#d2-632081343)"/><path fill="none" marker-end="url(#mk-d2-632081343-3488378134)" d="M1480.853 285.249C1538.2 262 1563 256 1599 256" class="connection stroke-B1 s0" mask="url(#d2-632081343)"/><path fill="none" marker-end="url(#mk-d2-632081343-3488378134)" d="M1480.853 352.751C1538.2 376 1563 382 1599 382" class="connection stroke-B1 s0" mask="url(#d2-632081343)"/><path fill="none" marker-end="url(#mk-d2-632081343-3488378134)" d="M1495.5 594H1715" class="connection stroke-B1 s0" mask="url(#d2-632081343)"/><path fill="none" marker-end="url(#mk-d2-632081343-3488378134)" d="M1123 365h134" class="connection stroke-B1 s0" mask="url(#d2-632081343)"/><path fill="none" marker-end="url(#mk-d2-632081343-3488378134)" d="M1123 594h145" class="connection stroke-B1 s0" mask="url(#d2-632081343)"/><path fill="none" marker-end="url(#mk-d2-632081343-3488378134)" d="M2015 428h134" class="connection stroke-B1 s0" mask="url(#d2-632081343)"/><path fill="none" marker-end="url(#mk-d2-632081343-3488378134)" d="M1899 594h250" class="connection stroke-B1 s0" mask="url(#d2-632081343)"/><marker id="mk-d2-632081343-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-632081343-2177206569)" d="M2823 511h134" class="connection" mask="url(#d2-632081343)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-632081343" width="3842" height="902" x="-81" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-81-85h3842v902H-81z"/></mask></svg>