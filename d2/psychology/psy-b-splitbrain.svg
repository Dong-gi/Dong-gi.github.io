<svg xmlns="http://www.w3.org/2000/svg" width="1655" height="1822" class="d2-4186494589 d2-svg" viewBox="-91 -101 1655 1822"><rect width="1655" height="1822" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4186494589 .fill-N1{fill:#0a0f25}.d2-4186494589 .fill-B4{fill:#e3e9fd}.d2-4186494589 .fill-B5{fill:#edf0fd}.d2-4186494589 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M166 0h954v218H166z" class="stroke-B1 fill-B4 s0"/></g><text x="643" y="33" class="fill-N1 s1">절차</text></g><g ><g class="shape"><path d="M10 338h880v292H10z" class="stroke-B1 fill-B4 s0"/></g><text x="450" y="325" class="fill-N1 s1">왼쪽 시야에 보이면</text></g><g ><g class="shape"><path d="M930 338h251v292H930z" class="stroke-B1 fill-B4 s0"/></g><text x="1055.5" y="325" class="fill-N1 s1">오른쪽 시야에 보이면</text></g><g ><g class="shape"><path d="M499 750h728v414H499z" class="stroke-B1 fill-B4 s0"/></g><text x="863" y="783" class="fill-N1 s1">여기서 따라 나오는 것</text></g><g ><g class="shape"><path d="M263 1264h1200v356H263z" class="stroke-B1 fill-B4 s0"/></g><text x="863" y="1297" class="fill-N1 s1">여기서 반드시 붙일 단서</text></g><g ><g class="shape"><path d="M226 60h386v98H226z" class="stroke-B1 fill-B5 s0"/></g><text x="419" y="114.5" class="text-bold fill-N1 s2">두 반구를 잇는 큰 다발이 잘린 사람에게</text></g><g ><g class="shape"><path d="M672 60h388v98H672z" class="stroke-B1 fill-B5 s0"/></g><text x="866" y="98.5" class="text-bold fill-N1 s2"><tspan x="866" dy="0">한쪽 시야에만 아주 짧게 그림을 보인다.</tspan><tspan x="866" dy="17.667">눈을 움직이면 양쪽에 다 들어가므로</tspan><tspan x="866" dy="17.667">시간을 아주 짧게 준다</tspan></text></g><g ><g class="shape"><path d="M344 368h212v66H344z" class="stroke-B1 fill-B5 s0"/></g><text x="450" y="406.5" class="text-bold fill-N1 s2">오른쪽 반구로 간다</text></g><g ><g class="shape"><path d="M40 534h380v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="230" y="572.5" class="text-bold fill-N1 s2">말로는 무엇을 보았는지 답하지 못한다</text></g><g ><g class="shape"><path d="M480 534h380v66H480z" class="stroke-B1 fill-B5 s0"/></g><text x="670" y="572.5" class="text-bold fill-N1 s2">그런데 왼손으로는 그 물건을 골라낸다</text></g><g ><g class="shape"><path d="M960 368h191v66H960z" class="stroke-B1 fill-B5 s0"/></g><text x="1055.5" y="406.5" class="text-bold fill-N1 s2">왼쪽 반구로 간다</text></g><g ><g class="shape"><path d="M982 534h148v66H982z" class="stroke-B1 fill-B5 s0"/></g><text x="1056" y="572.5" class="text-bold fill-N1 s2">말로 답한다</text></g><g ><g class="shape"><path d="M559 810h608v66H559z" class="stroke-B1 fill-B5 s0"/></g><text x="863" y="848.5" class="text-bold fill-N1 s2">‘무엇을 보았는지 아는 것’ 과 ‘그것을 말하는 것’ 이 갈릴 수 있다</text></g><g ><g class="shape"><path d="M559 916h608v66H559z" class="stroke-B1 fill-B5 s0"/></g><text x="863" y="954.5" class="text-bold fill-N1 s2">말하는 쪽은 반대편이 아는 것에 닿지 못한다</text></g><g ><g class="shape"><path d="M559 1022h608v82H559z" class="stroke-B1 fill-B5 s0"/></g><text x="863" y="1060.5" class="text-bold fill-N1 s2"><tspan x="863" dy="0">그런데도 이유를 물으면 그럴듯한 설명이 나온다.</tspan><tspan x="863" dy="18.5">말하는 쪽이 자기가 모르는 행동에 대해 이야기를 지어낸다</tspan></text></g><g ><g class="shape"><path d="M323 1324h491v98H323z" class="stroke-B1 fill-B5 s0"/></g><text x="568.5" y="1362.5" class="text-bold fill-N1 s2"><tspan x="568.5" dy="0">표본이 아주 작다.</tspan><tspan x="568.5" dy="17.667">이 절차를 받은 사람은 애초에 소수이고,</tspan><tspan x="568.5" dy="17.667">자세히 검사된 사람은 그보다도 훨씬 적다</tspan></text></g><g ><g class="shape"><path d="M854 1324h549v98H854z" class="stroke-B1 fill-B5 s0"/></g><text x="1128.5" y="1362.5" class="text-bold fill-N1 s2"><tspan x="1128.5" dy="0">그리고 그들은 모두</tspan><tspan x="1128.5" dy="17.667">오래 심한 발작을 겪은 사람들이다.</tspan><tspan x="1128.5" dy="17.667">수술 전부터 뇌가 이미 달랐을 수 있다</tspan></text></g><g ><g class="shape"><path d="M323 1462h491v98H323z" class="stroke-B1 fill-B5 s0"/></g><text x="568.5" y="1500.5" class="text-bold fill-N1 s2"><tspan x="568.5" dy="0">‘두 사람이 한 머리에 있다’ 는 읽기는 다투어진다.</tspan><tspan x="568.5" dy="17.667">뒤의 연구 가운데는 한쪽 시야의 자극도 어느 정도는</tspan><tspan x="568.5" dy="17.667">하나로 통합되어 보고된다고 보고한 것이 있다</tspan></text></g><g ><g class="shape"><path d="M854 1462h549v98H854z" class="stroke-B1 fill-B5 s0"/></g><text x="1128.5" y="1500.5" class="text-bold fill-N1 s2"><tspan x="1128.5" dy="0">이 연구에서 ‘좌뇌형 · 우뇌형 성격’ 은 따라 나오지 않는다.</tspan><tspan x="1128.5" dy="17.667">그것은 이 자료와 아무 관계가 없는</tspan><tspan x="1128.5" dy="17.667">별개의 주장이며 지지되지 않는다</tspan></text></g><marker id="mk-d2-4186494589-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4186494589-3488378134)" d="M614 109h54" class="connection stroke-B1 s0" mask="url(#d2-4186494589)"/><path fill="none" marker-end="url(#mk-d2-4186494589-3488378134)" d="M361.128 434.704C256.6 474 230 494 230 530" class="connection stroke-B1 s0" mask="url(#d2-4186494589)"/><path fill="none" marker-end="url(#mk-d2-4186494589-3488378134)" d="M538.872 434.704C643.4 474 670 494 670 530" class="connection stroke-B1 s0" mask="url(#d2-4186494589)"/><path fill="none" marker-end="url(#mk-d2-4186494589-3488378134)" d="M1055.5 436v94" class="connection stroke-B1 s0" mask="url(#d2-4186494589)"/><path fill="none" marker-end="url(#mk-d2-4186494589-3488378134)" d="M509.453 219.268C462.2 258 450 273.8 450 293" class="connection stroke-B1 s0" mask="url(#d2-4186494589)"/><path fill="none" marker-end="url(#mk-d2-4186494589-3488378134)" d="M927.367 218.718C1029.5 258 1055.5 273.8 1055.5 293" class="connection stroke-B1 s0" mask="url(#d2-4186494589)"/><path fill="none" marker-end="url(#mk-d2-4186494589-3488378134)" d="M670 632c0 54 7.6 78 35.58 114.815" class="connection stroke-B1 s0" mask="url(#d2-4186494589)"/><path fill="none" marker-end="url(#mk-d2-4186494589-3488378134)" d="M1055.5 632c0 54-7.6 78-35.58 114.815" class="connection stroke-B1 s0" mask="url(#d2-4186494589)"/><marker id="mk-d2-4186494589-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4186494589-2177206569)" d="M862.75 1166v94" class="connection" mask="url(#d2-4186494589)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-4186494589" width="1655" height="1822" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1655v1822H-91z"/></mask></svg>