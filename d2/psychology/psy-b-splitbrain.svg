<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1522" class="d2-1492384450 d2-svg" viewBox="-89 -89 1242 1522"><rect width="1242" height="1522" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1492384450 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1492384450 .fill-N1{fill:#0a0f25}.d2-1492384450 .fill-B4{fill:#e3e9fd}.d2-1492384450 .fill-B5{fill:#edf0fd}.d2-1492384450 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M226 12h611v250H226z" class="stroke-B1 fill-B4 s0"/></g><text x="531.5" y="45" class="fill-N1 s1">절차</text></g><g ><g class="shape"><path d="M38 342h520v344H38z" class="stroke-B1 fill-B4 s0"/></g><text x="298" y="375" class="fill-N1 s1">왼쪽 시야에 보이면</text></g><g ><g class="shape"><path d="M578 363h375v302H578z" class="stroke-B1 fill-B4 s0"/></g><text x="765.5" y="396" class="fill-N1 s1">오른쪽 시야에 보이면</text></g><g ><g class="shape"><path d="M57 766h949v216H57z" class="stroke-B1 fill-B4 s0"/></g><text x="531.5" y="799" class="fill-N1 s1">여기서 따라 나오는 것</text></g><g ><g class="shape"><path d="M12 1052h1040v280H12z" class="stroke-B1 fill-B4 s0"/></g><text x="532" y="1085" class="fill-N1 s1">여기서 반드시 붙일 단서</text></g><g ><g class="shape"><path d="M286 72h171v130H286z" class="stroke-B1 fill-B5 s0"/></g><text x="371.5" y="126.5" class="text-bold fill-N1 s2"><tspan x="371.5" dy="0">두 반구를 잇는</tspan><tspan x="371.5" dy="17.667">큰 다발이</tspan><tspan x="371.5" dy="17.667">잘린 사람에게</tspan></text></g><g ><g class="shape"><path d="M517 72h260v130H517z" class="stroke-B1 fill-B5 s0"/></g><text x="647" y="110.5" class="text-bold fill-N1 s2"><tspan x="647" dy="0">한쪽 시야에만</tspan><tspan x="647" dy="17">아주 짧게 그림을 보인다.</tspan><tspan x="647" dy="17">눈을 움직이면</tspan><tspan x="647" dy="17">양쪽에 다 들어가므로</tspan><tspan x="647" dy="17">시간을 아주 짧게 준다</tspan></text></g><g ><g class="shape"><path d="M186 392h212v66H186z" class="stroke-B1 fill-B5 s0"/></g><text x="292" y="430.5" class="text-bold fill-N1 s2">오른쪽 반구로 간다</text></g><g ><g class="shape"><path d="M88 538h188v98H88z" class="stroke-B1 fill-B5 s0"/></g><text x="182" y="576.5" class="text-bold fill-N1 s2"><tspan x="182" dy="0">말로는</tspan><tspan x="182" dy="17.667">무엇을 보았는지</tspan><tspan x="182" dy="17.667">답하지 못한다</tspan></text></g><g ><g class="shape"><path d="M296 538h212v82H296z" class="stroke-B1 fill-B5 s0"/></g><text x="402" y="576.5" class="text-bold fill-N1 s2"><tspan x="402" dy="0">그런데 왼손으로는</tspan><tspan x="402" dy="18.5">그 물건을 골라낸다</tspan></text></g><g ><g class="shape"><path d="M670 413h191v66H670z" class="stroke-B1 fill-B5 s0"/></g><text x="765.5" y="451.5" class="text-bold fill-N1 s2">왼쪽 반구로 간다</text></g><g ><g class="shape"><path d="M691 549h148v66H691z" class="stroke-B1 fill-B5 s0"/></g><text x="765" y="587.5" class="text-bold fill-N1 s2">말로 답한다</text></g><g ><g class="shape"><path d="M97 812h301v130H97z" class="stroke-B1 fill-B5 s0"/></g><text x="247.5" y="866.5" class="text-bold fill-N1 s2"><tspan x="247.5" dy="0">‘무엇을 보았는지 아는 것’ 과</tspan><tspan x="247.5" dy="17.667">‘그것을 말하는 것’ 이</tspan><tspan x="247.5" dy="17.667">갈릴 수 있다</tspan></text></g><g ><g class="shape"><path d="M438 812h212v130H438z" class="stroke-B1 fill-B5 s0"/></g><text x="544" y="866.5" class="text-bold fill-N1 s2"><tspan x="544" dy="0">말하는 쪽은</tspan><tspan x="544" dy="17.667">반대편이 아는 것에</tspan><tspan x="544" dy="17.667">닿지 못한다</tspan></text></g><g ><g class="shape"><path d="M690 812h276v130H690z" class="stroke-B1 fill-B5 s0"/></g><text x="828" y="850.5" class="text-bold fill-N1 s2"><tspan x="828" dy="0">그런데도 이유를 물으면</tspan><tspan x="828" dy="17">그럴듯한 설명이 나온다.</tspan><tspan x="828" dy="17">말하는 쪽이</tspan><tspan x="828" dy="17">자기가 모르는 행동에 대해</tspan><tspan x="828" dy="17">이야기를 지어낸다</tspan></text></g><g ><g class="shape"><path d="M52 1098h197v194H52z" class="stroke-B1 fill-B5 s0"/></g><text x="150.5" y="1152.5" class="text-bold fill-N1 s2"><tspan x="150.5" dy="0">표본이 아주 작다.</tspan><tspan x="150.5" dy="16.714">이 절차를 받은</tspan><tspan x="150.5" dy="16.714">사람은 애초에</tspan><tspan x="150.5" dy="16.714">소수이고,</tspan><tspan x="150.5" dy="16.714">자세히 검사된</tspan><tspan x="150.5" dy="16.714">사람은 그보다도</tspan><tspan x="150.5" dy="16.714">훨씬 적다</tspan></text></g><g ><g class="shape"><path d="M289 1098h212v194H289z" class="stroke-B1 fill-B5 s0"/></g><text x="395" y="1160.5" class="text-bold fill-N1 s2"><tspan x="395" dy="0">그리고 그들은 모두</tspan><tspan x="395" dy="16.833">오래 심한 발작을</tspan><tspan x="395" dy="16.833">겪은 사람들이다.</tspan><tspan x="395" dy="16.833">수술 전부터</tspan><tspan x="395" dy="16.833">뇌가 이미</tspan><tspan x="395" dy="16.833">달랐을 수 있다</tspan></text></g><g ><g class="shape"><path d="M541 1098h214v194H541z" class="stroke-B1 fill-B5 s0"/></g><text x="648" y="1136.5" class="text-bold fill-N1 s2"><tspan x="648" dy="0">‘두 사람이</tspan><tspan x="648" dy="16.556">한 머리에 있다’ 는</tspan><tspan x="648" dy="16.556">읽기는 다투어진다.</tspan><tspan x="648" dy="16.556">뒤의 연구 가운데는</tspan><tspan x="648" dy="16.556">한쪽 시야의 자극도</tspan><tspan x="648" dy="16.556">어느 정도는</tspan><tspan x="648" dy="16.556">하나로 통합되어</tspan><tspan x="648" dy="16.556">보고된다고</tspan><tspan x="648" dy="16.556">보고한 것이 있다</tspan></text></g><g ><g class="shape"><path d="M795 1098h217v194H795z" class="stroke-B1 fill-B5 s0"/></g><text x="903.5" y="1144.5" class="text-bold fill-N1 s2"><tspan x="903.5" dy="0">이 연구에서</tspan><tspan x="903.5" dy="16.625">‘좌뇌형 · 우뇌형</tspan><tspan x="903.5" dy="16.625">성격’ 은</tspan><tspan x="903.5" dy="16.625">따라 나오지 않는다.</tspan><tspan x="903.5" dy="16.625">그것은 이 자료와</tspan><tspan x="903.5" dy="16.625">아무 관계가 없는</tspan><tspan x="903.5" dy="16.625">별개의 주장이며</tspan><tspan x="903.5" dy="16.625">지지되지 않는다</tspan></text></g><marker id="mk-d2-1492384450-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-widt