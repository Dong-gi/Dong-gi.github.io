<svg xmlns="http://www.w3.org/2000/svg" width="1121" height="1383" class="d2-847721553 d2-svg" viewBox="-91 -101 1121 1383"><rect width="1121" height="1383" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.d2-847721553 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-847721553 .fill-N1{fill:#0a0f25}.d2-847721553 .fill-B4{fill:#e3e9fd}.d2-847721553 .fill-B5{fill:#edf0fd}.d2-847721553 .stroke-B1,.d2-847721553 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="478" cy="34.5" class="shape stroke-B1" rx="104" ry="34.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="478" y="40" class="text-bold fill-N1 s0">곰을 만났다</text></g><g ><g class="shape"><path d="M10 197h292v771H10z" class="stroke-B1 fill-B4 s1"/></g><text x="156" y="184" class="fill-N1 s2">제임스-랑게</text></g><g ><g class="shape"><path d="M342 213h272v763H342z" class="stroke-B1 fill-B4 s1"/></g><text x="478" y="200" class="fill-N1 s2">캐넌-바드</text></g><g ><g class="shape"><path d="M654 189h275v787H654z" class="stroke-B1 fill-B4 s1"/></g><text x="791.5" y="176" class="fill-N1 s2">샥터-싱어 두 요인</text></g><text x="478.5" y="1112" class="fill-N1 s0"><tspan x="478.5" dy="0"> </tspan><tspan x="478.5" dy="17">지금의 자리 — 셋 가운데 하나를 고르는 문제로 다루지 않는다.</tspan><tspan x="478.5" dy="17">몸의 되먹임이 정서에 얼마나 기여하는가,</tspan><tspan x="478.5" dy="17">상황을 읽는 일이 어디에서 들어오는가는</tspan><tspan x="478.5" dy="17">각각 따로 재는 물음이 되었고, 두 물음 다 아직 열려 있다</tspan></text><g ><g class="shape"><path d="M40 227h232v98H40z" class="stroke-B1 fill-B5 s1"/></g><text x="156" y="265.5" class="text-bold fill-N1 s0"><tspan x="156" dy="0">몸이 먼저 반응한다</tspan><tspan x="156" dy="17.667">심장이 뛰고</tspan><tspan x="156" dy="17.667">다리에 힘이 들어간다</tspan></text></g><g ><g class="shape"><path d="M71 449h171v82H71z" class="stroke-B1 fill-B5 s1"/></g><text x="156.5" y="487.5" class="text-bold fill-N1 s0"><tspan x="156.5" dy="0">그 몸의 변화를</tspan><tspan x="156.5" dy="18.5">알아차린다</tspan></text></g><g ><g class="shape"><path d="M72 655h168v82H72z" class="stroke-B1 fill-B5 s1"/></g><text x="156" y="693.5" class="text-bold fill-N1 s0"><tspan x="156" dy="0">그 알아차림이</tspan><tspan x="156" dy="18.5">곧 무서움이다</tspan></text></g><text x="156" y="869" class="fill-N1 s0"><tspan x="156" dy="0">예측 — 몸의 반응이</tspan><tspan x="156" dy="17">정서마다 달라야 한다.</tspan><tspan x="156" dy="17">그리고 몸의 반응을</tspan><tspan x="156" dy="17">막으면 정서도</tspan><tspan x="156" dy="17">약해져야 한다</tspan></text><g ><g class="shape"><path d="M384 243h188v66H384z" class="stroke-B1 fill-B5 s1"/></g><text x="478" y="281.5" class="text-bold fill-N1 s0">자극이 들어온다</text></g><g ><g class="shape"><path d="M372 433h212v114H372z" class="stroke-B1 fill-B5 s1"/></g><text x="478" y="471.5" class="text-bold fill-N1 s0"><tspan x="478" dy="0">몸의 반응과 느낌이</tspan><tspan x="478" dy="17.25">각각 따로,</tspan><tspan x="478" dy="17.25">거의 동시에</tspan><tspan x="478" dy="17.25">일어난다</tspan></text></g><g ><g class="shape"><path d="M372 647h212v98H372z" class="stroke-B1 fill-B5 s1"/></g><text x="478" y="685.5" class="text-bold fill-N1 s0"><tspan x="478" dy="0">몸이 무섭게 만드는</tspan><tspan x="478" dy="17.667">것이 아니다.</tspan><tspan x="478" dy="17.667">둘은 나란히 간다</tspan></text></g><text x="478" y="861" class="fill-N1 s0"><tspan x="478" dy="0">예측 — 몸의 반응이</tspan><tspan x="478" dy="16.833">여러 정서에서</tspan><tspan x="478" dy="16.833">비슷해도 된다.</tspan><tspan x="478" dy="16.833">그리고 몸의 되먹임을</tspan><tspan x="478" dy="16.833">끊어도 정서가</tspan><tspan x="478" dy="16.833">남아야 한다</tspan></text><g ><g class="shape"><path d="M696 219h191v114H696z" class="stroke-B1 fill-B5 s1"/></g><text x="791.5" y="257.5" class="text-bold fill-N1 s0"><tspan x="791.5" dy="0">몸이 각성된다</tspan><tspan x="791.5" dy="17.25">다만 그 각성은</tspan><tspan x="791.5" dy="17.25">무슨 정서인지</tspan><tspan x="791.5" dy="17.25">말해 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M708 433h168v114H708z" class="stroke-B1 fill-B5 s1"/></g><text x="792" y="471.5" class="text-bold fill-N1 s0"><tspan x="792" dy="0">그 각성이</tspan><tspan x="792" dy="17.25">왜 생겼는지를</tspan><tspan x="792" dy="17.25">상황에서 찾아</tspan><tspan x="792" dy="17.25">이름을 붙인다</tspan></text></g><g ><g class="shape"><path d="M684 663h215v66H684z" class="stroke-B1 fill-B5 s1"/></g><text x="791.5" y="701.5" class="text-bold fill-N1 s0">각성 + 이름표 = 정서</text></g><text x="792" y="861" class="fill-N1 s0"><tspan x="792" dy="0">예측 — 각성의 원인을</tspan><tspan x="792" dy="16.833">모르게 만든 뒤</tspan><tspan x="792" dy="16.833">상황을 바꾸면</tspan><tspan x="792" dy="16.833">같은 각성이</tspan><tspan x="792" dy="16.833">다른 정서로</tspan><tspan x="792" dy="16.833">이름 붙어야 한다</tspan></text><marker id="mk-d2-847721553-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-847721553-3488378134)" d="M156 327v118" class="connection stroke-B1 s1" mask="url(#d2-847721553)"/><path fill="none" marker-end="url(#mk-d2-847721553-3488378134)" d="M156 533v118" class="connection stroke-B1 s1" mask="url(#d2-847721553)"/><marker id="mk-d2-847721553-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-847721553-2177206569)" d="M156 739v110" class="connection stroke-B2 s4" mask="url(#d2-847721553)"/><path fill="none" marker-end="url(#mk-d2-847721553-3488378134)" d="M478 311v118" class="connection stroke-B1 s1" mask="url(#d2-847721553)"/><path fill="none" marker-end="url(#mk-d2-847721553-3488378134)" d="M478 549v94" class="connection stroke-B1 s1" mask="url(#d2-847721553)"/><path fill="none" marker-end="url(#mk-d2-84772