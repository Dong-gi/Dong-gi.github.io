<svg xmlns="http://www.w3.org/2000/svg" width="1795" height="1223" class="d2-2811921996 d2-svg" viewBox="-91 -101 1795 1223"><rect width="1795" height="1223" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2811921996 .fill-N1{fill:#0a0f25}.d2-2811921996 .fill-B4{fill:#e3e9fd}.d2-2811921996 .fill-B5{fill:#edf0fd}.d2-2811921996 .stroke-B1,.d2-2811921996 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="757" cy="34.5" class="shape stroke-B1" rx="104" ry="34.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="757" y="40" class="text-bold fill-N1 s0">곰을 만났다</text></g><g ><g class="shape"><path d="M10 189h471v643H10z" class="stroke-B1 fill-B4 s1"/></g><text x="245.5" y="176" class="fill-N1 s2">제임스-랑게</text></g><g ><g class="shape"><path d="M521 197h471v635H521z" class="stroke-B1 fill-B4 s1"/></g><text x="756.5" y="184" class="fill-N1 s2">캐넌-바드</text></g><g ><g class="shape"><path d="M1032 189h571v643h-571z" class="stroke-B1 fill-B4 s1"/></g><text x="1317.5" y="176" class="fill-N1 s2">샥터-싱어 두 요인</text></g><text x="757" y="968" class="fill-N1 s0"><tspan x="757" dy="0"> </tspan><tspan x="757" dy="17.25">지금의 자리 — 셋 가운데 하나를 고르는 문제로 다루지 않는다.</tspan><tspan x="757" dy="17.25">몸의 되먹임이 정서에 얼마나 기여하는가, 상황을 읽는 일이 어디에서 들어오는가는</tspan><tspan x="757" dy="17.25">각각 따로 재는 물음이 되었고, 두 물음 다 아직 열려 있다</tspan></text><g ><g class="shape"><path d="M76 219h340v82H76z" class="stroke-B1 fill-B5 s1"/></g><text x="246" y="257.5" class="text-bold fill-N1 s0"><tspan x="246" dy="0">몸이 먼저 반응한다</tspan><tspan x="246" dy="18.5">심장이 뛰고 다리에 힘이 들어간다</tspan></text></g><g ><g class="shape"><path d="M108 409h276v66H108z" class="stroke-B1 fill-B5 s1"/></g><text x="246" y="447.5" class="text-bold fill-N1 s0">그 몸의 변화를 알아차린다</text></g><g ><g class="shape"><path d="M98 591h296v66H98z" class="stroke-B1 fill-B5 s1"/></g><text x="246" y="629.5" class="text-bold fill-N1 s0">그 알아차림이 곧 무서움이다</text></g><text x="245.5" y="781" class="fill-N1 s0"><tspan x="245.5" dy="0">예측 — 몸의 반응이 정서마다 달라야 한다.</tspan><tspan x="245.5" dy="18.5">그리고 몸의 반응을 막으면 정서도 약해져야 한다</tspan></text><g ><g class="shape"><path d="M663 227h188v66H663z" class="stroke-B1 fill-B5 s1"/></g><text x="757" y="265.5" class="text-bold fill-N1 s0">자극이 들어온다</text></g><g ><g class="shape"><path d="M604 401h305v82H604z" class="stroke-B1 fill-B5 s1"/></g><text x="756.5" y="439.5" class="text-bold fill-N1 s0"><tspan x="756.5" dy="0">몸의 반응과 느낌이 각각 따로,</tspan><tspan x="756.5" dy="18.5">거의 동시에 일어난다</tspan></text></g><g ><g class="shape"><path d="M595 583h324v82H595z" class="stroke-B1 fill-B5 s1"/></g><text x="757" y="621.5" class="text-bold fill-N1 s0"><tspan x="757" dy="0">몸이 무섭게 만드는 것이 아니다.</tspan><tspan x="757" dy="18.5">둘은 나란히 간다</tspan></text></g><text x="756.5" y="781" class="fill-N1 s0"><tspan x="756.5" dy="0">예측 — 몸의 반응이 여러 정서에서 비슷해도 된다.</tspan><tspan x="756.5" dy="18.5">그리고 몸의 되먹임을 끊어도 정서가 남아야 한다</tspan></text><g ><g class="shape"><path d="M1093 219h450v82h-450z" class="stroke-B1 fill-B5 s1"/></g><text x="1318" y="257.5" class="text-bold fill-N1 s0"><tspan x="1318" dy="0">몸이 각성된다</tspan><tspan x="1318" dy="18.5">다만 그 각성은 무슨 정서인지 말해 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M1062 409h511v66h-511z" class="stroke-B1 fill-B5 s1"/></g><text x="1317.5" y="447.5" class="text-bold fill-N1 s0">그 각성이 왜 생겼는지를 상황에서 찾아 이름을 붙인다</text></g><g ><g class="shape"><path d="M1210 591h215v66h-215z" class="stroke-B1 fill-B5 s1"/></g><text x="1317.5" y="629.5" class="text-bold fill-N1 s0">각성 + 이름표 = 정서</text></g><text x="1318" y="781" class="fill-N1 s0"><tspan x="1318" dy="0">예측 — 각성의 원인을 모르게 만든 뒤 상황을 바꾸면</tspan><tspan x="1318" dy="18.5">같은 각성이 다른 정서로 이름 붙어야 한다</tspan></text><marker id="mk-d2-2811921996-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2811921996-3488378134)" d="M245.5 303v102" class="connection stroke-B1 s1" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-3488378134)" d="M245.5 477v110" class="connection stroke-B1 s1" mask="url(#d2-2811921996)"/><marker id="mk-d2-2811921996-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2811921996-2177206569)" d="M245.5 659v102" class="connection stroke-B2 s4" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-3488378134)" d="M756.5 295v102" class="connection stroke-B1 s1" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-3488378134)" d="M756.5 485v94" class="connection stroke-B1 s1" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-2177206569)" d="M756.5 667v94" class="connection stroke-B2 s4" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-3488378134)" d="M1317.5 303v102" class="connection stroke-B1 s1" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-3488378134)" d="M1317.5 477v110" class="connection stroke-B1 s1" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-2177206569)" d="M1317.5 659v102" class="connection stroke-B2 s4" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-3488378134)" d="M662.027 50.325C329.2 105.2 245.5 124.8 245.5 144" class="connection stroke-B1 s1" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-3488378134)" d="M756.98 71c-.38 38-.48 55.4-.48 81" class="connection stroke-B1 s1" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-3488378134)" d="M853.978 49.297C1224.4 105 1317.5 124.8 1317.5 144" class="connection stroke-B1 s1" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-2177206569)" d="M245.5 834c0 54 60.4 78 298.054 117.347" class="connection stroke-B2 s4" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-2177206569)" d="M756.5 834v114" class="connection stroke-B2 s4" mask="url(#d2-2811921996)"/><path fill="none" marker-end="url(#mk-d2-2811921996-2177206569)" d="M1317.5 834c0 54-66.4 78-328.045 117.404" class="connection stroke-B2 s4" mask="url(#d2-2811921996)"/><mask id="d2-2811921996" width="1795" height="1223" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1795v1223H-91z"/></mask></svg>