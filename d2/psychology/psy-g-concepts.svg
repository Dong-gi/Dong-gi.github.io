<svg xmlns="http://www.w3.org/2000/svg" width="1261" height="1817" class="d2-2182173510 d2-svg" viewBox="-101 -100 1261 1817"><rect width="1261" height="1817" x="-101" y="-100" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2182173510 .fill-N1{fill:#0a0f25}.d2-2182173510 .fill-N2{fill:#676c7e}.d2-2182173510 .fill-B4{fill:#e3e9fd}.d2-2182173510 .fill-B5{fill:#edf0fd}.d2-2182173510 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 41h1059v316H0z" class="stroke-B1 fill-B4 s0"/></g><text x="529.5" y="28" class="fill-N1 s1">고전적 관점 — 개념은 정의다</text></g><g ><g class="shape"><path d="M0 508h1059v316H0z" class="stroke-B1 fill-B4 s0"/></g><text x="529.5" y="495" class="fill-N1 s1">원형 관점 — 개념은 평균 같은 것이다</text></g><g ><g class="shape"><path d="M0 975h1059v316H0z" class="stroke-B1 fill-B4 s0"/></g><text x="529.5" y="962" class="fill-N1 s1">사례 관점 — 개념은 겪은 것들의 모음이다</text></g><g ><g class="shape"><path d="M0 1442h1059v174H0z" class="stroke-B1 fill-B4 s0"/></g><text x="529.5" y="1429" class="fill-N1 s1">덧붙는 것 — 개념은 우리가 가진 이론에 얹혀 있다</text></g><g ><g class="shape"><path d="M30 134h369v114H30z" class="stroke-B1 fill-B5 s0"/></g><text x="214.5" y="172.5" class="text-bold fill-N1 s2"><tspan x="214.5" dy="0">주장 — 어떤 범주에 들어가려면</tspan><tspan x="214.5" dy="17.25">반드시 갖춰야 할 자질의 목록이 있고,</tspan><tspan x="214.5" dy="17.25">그것을 다 갖추면 들어가고</tspan><tspan x="214.5" dy="17.25">하나라도 빠지면 안 들어간다</tspan></text></g><g ><g class="shape"><path d="M542 71h431v82H542z" class="stroke-B1 fill-B5 s0"/></g><text x="757.5" y="109.5" class="text-bold fill-N1 s2"><tspan x="757.5" dy="0">잘 맞는 자리 — 수학과 법의 개념.</tspan><tspan x="757.5" dy="18.5">‘짝수’ 나 ‘성년’ 은 실제로 이렇게 정의된다</tspan></text></g><g ><g class="shape"><path d="M499 213h516v114H499z" class="stroke-B1 fill-B5 s0"/></g><text x="757" y="251.5" class="text-bold fill-N1 s2"><tspan x="757" dy="0">걸리는 자리 — 일상 개념의 정의를 실제로 적어 보면</tspan><tspan x="757" dy="17.25">반례가 계속 나온다. 그리고 정의만 따진다면</tspan><tspan x="757" dy="17.25">왜 어떤 사례는 빨리, 어떤 사례는 느리게 판단되는지가</tspan><tspan x="757" dy="17.25">설명되지 않는다</tspan></text></g><g ><g class="shape"><path d="M30 609h380v114H30z" class="stroke-B1 fill-B5 s0"/></g><text x="220" y="647.5" class="text-bold fill-N1 s2"><tspan x="220" dy="0">주장 — 범주마다 그 범주의</tspan><tspan x="220" dy="17.25">전형적인 모습이 있고,</tspan><tspan x="220" dy="17.25">어떤 것이 그 범주에 드는지는</tspan><tspan x="220" dy="17.25">그 모습과 얼마나 닮았는가로 정해진다</tspan></text></g><g ><g class="shape"><path d="M527 538h412v98H527z" class="stroke-B1 fill-B5 s0"/></g><text x="733" y="576.5" class="text-bold fill-N1 s2"><tspan x="733" dy="0">설명하는 것 — 전형성 차이, 판단 시간 차이,</tspan><tspan x="733" dy="17.667">먼저 떠오르는 사례,</tspan><tspan x="733" dy="17.667">그리고 경계가 흐릿하다는 사실</tspan></text></g><g ><g class="shape"><path d="M510 696h446v98H510z" class="stroke-B1 fill-B5 s0"/></g><text x="733" y="734.5" class="text-bold fill-N1 s2"><tspan x="733" dy="0">걸리는 자리 — 드문 사례에 대한 앎이 사라진다.</tspan><tspan x="733" dy="17.667">사람은 ‘펭귄은 새인데 특이한 새’ 라는 것을</tspan><tspan x="733" dy="17.667">알고 있다</tspan></text></g><g ><g class="shape"><path d="M30 1076h382v98H30z" class="stroke-B1 fill-B5 s0"/></g><text x="221" y="1114.5" class="text-bold fill-N1 s2"><tspan x="221" dy="0">주장 — 평균을 따로 만들어 두지 않는다.</tspan><tspan x="221" dy="17.667">겪은 개별 사례들을 기억해 두고,</tspan><tspan x="221" dy="17.667">새것이 오면 그것들과 견준다</tspan></text></g><g ><g class="shape"><path d="M530 1005h383v82H530z" class="stroke-B1 fill-B5 s0"/></g><text x="721.5" y="1043.5" class="text-bold fill-N1 s2"><tspan x="721.5" dy="0">설명하는 것 — 드문 사례에 대한 앎,</tspan><tspan x="721.5" dy="18.5">그리고 사람마다 범주가 조금씩 다른 것</tspan></text></g><g ><g class="shape"><path d="M512 1147h418v114H512z" class="stroke-B1 fill-B5 s0"/></g><text x="721" y="1185.5" class="text-bold fill-N1 s2"><tspan x="721" dy="0">걸리는 자리 — 사례를 다 저장한다는 그림이</tspan><tspan x="721" dy="17.25">어디까지 그럴듯한가.</tspan><tspan x="721" dy="17.25">그리고 무엇을 ‘닮았다’ 고 셀지는</tspan><tspan x="721" dy="17.25">여전히 정해 주어야 한다</tspan></text></g><g ><g class="shape"><path d="M30 1472h516v114H30z" class="stroke-B1 fill-B5 s0"/></g><text x="288" y="1510.5" class="text-bold fill-N1 s2"><tspan x="288" dy="0">닮음만으로는 부족하다.</tspan><tspan x="288" dy="17.25">무엇을 닮음으로 셀지가 이미 앎에 딸려 있기 때문이다.</tspan><tspan x="288" dy="17.25">같은 두 사물이 어떤 앎 아래서는 닮았고</tspan><tspan x="288" dy="17.25">다른 앎 아래서는 닮지 않았다</tspan></text></g><g ><g class="shape"><path d="M646 1472h383v114H646z" class="stroke-B1 fill-B5 s0"/></g><text x="837.5" y="1510.5" class="text-bold fill-N1 s2"><tspan x="837.5" dy="0">그래서 지금의 표준적인 그림은</tspan><tspan x="837.5" dy="17.25">하나를 고르는 것이 아니라,</tspan><tspan x="837.5" dy="17.25">어느 자리에서 어느 설명이 잘 듣는지를</tspan><tspan x="837.5" dy="17.25">나누는 쪽이다</tspan></text></g><marker id="mk-d2-2182173510-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2182173510-3488378134)" d="M385.894 133.359C436 116.4 467.5 112 537.5 112" class="connection stroke-B1 s0" mask="url(#d2-2182173510)"/><path fill="none" marker-end="url(#mk-d2-2182173510-3488378134)" d="M385.894 248.641C436 265.6 459 270 495 270" class="connection stroke-B1 s0" mask="url(#d2-2182173510)"/><path fill="none" marker-end="url(#mk-d2-2182173510-3488378134)" d="M394.9 608.376C446.6 591.4 473.4 587 523 587" class="connection stroke-B1 s0" mask="url(#d2-2182173510)"/><path fill="none" marker-end="url(#mk-d2-2182173510-3488378134)" d="M394.9 723.624C446.6 740.6 470 745 506 745" class="connection stroke-B1 s0" mask="url(#d2-2182173510)"/><path fill="none" marker-end="url(#mk-d2-2182173510-3488378134)" d="M371.901 1075.38C443.6 1052 475.5 1046 525.5 1046" class="connection stroke-B1 s0" mask="url(#d2-2182173510)"/><path fill="none" marker-end="url(#mk-d2-2182173510-3488378134)" d="M371.901 1174.62C443.6 1198 472 1204 508 1204" class="connection stroke-B1 s0" mask="url(#d2-2182173510)"/><path fill="none" marker-end="url(#mk-d2-2182173510-3488378134)" d="M548 1529h94" class="connection stroke-B1 s0" mask="url(#d2-2182173510)"/><path fill="none" marker-end="url(#mk-d2-2182173510-3488378134)" d="M529.5 359v104" class="connection stroke-B1 s0" mask="url(#d2-2182173510)"/><text x="529.5" y="418" class="text-italic fill-N2 s2">반례와 판단 시간이 밀어냈다</text><path fill="none" marker-end="url(#mk-d2-2182173510-3488378134)" d="M529.5 826v104" class="connection stroke-B1 s0" mask="url(#d2-2182173510)"/><text x="529.5" y="885" class="text-italic fill-N2 s2">드문 사례에 대한 앎이 밀어냈다</text><path fill="none" marker-end="url(#mk-d2-2182173510-3488378134)" d="M529.5 1293v104" class="connection stroke-B1 s0" mask="url(#d2-2182173510)"/><text x="529.5" y="1352" class="text-italic fill-N2 s2">닮음의 기준 자체를 물으면서</text><mask id="d2-2182173510" width="1261" height="1817" x="-101" y="-100" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-100h1261v1817H-101z"/><path d="M407 402h245v21H407zM396 869h267v21H396zM407 1336h245v21H407z"/></mask></svg>