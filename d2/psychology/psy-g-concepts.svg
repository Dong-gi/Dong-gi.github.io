<svg xmlns="http://www.w3.org/2000/svg" width="2497" height="2021" class="d2-1506445258 d2-svg" viewBox="-91 -121 2497 2021"><rect width="2497" height="2021" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1506445258 .fill-N1{fill:#0a0f25}.d2-1506445258 .fill-N2{fill:#676c7e}.d2-1506445258 .fill-B4{fill:#e3e9fd}.d2-1506445258 .fill-B5{fill:#edf0fd}.d2-1506445258 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M10 20h1708v324H10z" class="stroke-B1 fill-B4 s0"/></g><text x="864" y="7" class="fill-N1 s1">고전적 관점 — 개념은 정의다</text></g><g ><g class="shape"><path d="M620 505h1224v324H620z" class="stroke-B1 fill-B4 s0"/></g><text x="1232" y="492" class="fill-N1 s1">원형 관점 — 개념은 평균 같은 것이다</text></g><g ><g class="shape"><path d="M830 990h1416v324H830z" class="stroke-B1 fill-B4 s0"/></g><text x="1538" y="977" class="fill-N1 s1">사례 관점 — 개념은 겪은 것들의 모음이다</text></g><g ><g class="shape"><path d="M1515 1475h790v324h-790z" class="stroke-B1 fill-B4 s0"/></g><text x="1910" y="1462" class="fill-N1 s1">덧붙는 것 — 개념은 우리가 가진 이론에 얹혀 있다</text></g><g ><g class="shape"><path d="M504 50h639v82H504z" class="stroke-B1 fill-B5 s0"/></g><text x="823.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="823.5" dy="0">주장 — 어떤 범주에 들어가려면 반드시 갖춰야 할 자질의 목록이 있고,</tspan><tspan x="823.5" dy="18.5">그것을 다 갖추면 들어가고 하나라도 빠지면 안 들어간다</tspan></text></g><g ><g class="shape"><path d="M40 240h712v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="396" y="278.5" class="text-bold fill-N1 s2">잘 맞는 자리 — 수학과 법의 개념. ‘짝수’ 나 ‘성년’ 은 실제로 이렇게 정의된다</text></g><g ><g class="shape"><path d="M812 232h876v82H812z" class="stroke-B1 fill-B5 s0"/></g><text x="1250" y="270.5" class="text-bold fill-N1 s2"><tspan x="1250" dy="0">걸리는 자리 — 일상 개념의 정의를 실제로 적어 보면 반례가 계속 나온다.</tspan><tspan x="1250" dy="18.5">그리고 정의만 따진다면 왜 어떤 사례는 빨리, 어떤 사례는 느리게 판단되는지가 설명되지 않는다</tspan></text></g><g ><g class="shape"><path d="M931 535h639v82H931z" class="stroke-B1 fill-B5 s0"/></g><text x="1250.5" y="573.5" class="text-bold fill-N1 s2"><tspan x="1250.5" dy="0">주장 — 범주마다 그 범주의 전형적인 모습이 있고,</tspan><tspan x="1250.5" dy="18.5">어떤 것이 그 범주에 드는지는 그 모습과 얼마나 닮았는가로 정해진다</tspan></text></g><g ><g class="shape"><path d="M650 717h588v82H650z" class="stroke-B1 fill-B5 s0"/></g><text x="944" y="755.5" class="text-bold fill-N1 s2"><tspan x="944" dy="0">설명하는 것 — 전형성 차이, 판단 시간 차이, 먼저 떠오르는 사례,</tspan><tspan x="944" dy="18.5">그리고 경계가 흐릿하다는 사실</tspan></text></g><g ><g class="shape"><path d="M1298 717h516v82h-516z" class="stroke-B1 fill-B5 s0"/></g><text x="1556" y="755.5" class="text-bold fill-N1 s2"><tspan x="1556" dy="0">걸리는 자리 — 드문 사례에 대한 앎이 사라진다.</tspan><tspan x="1556" dy="18.5">사람은 ‘펭귄은 새인데 특이한 새’ 라는 것을 알고 있다</tspan></text></g><g ><g class="shape"><path d="M1266 1020h580v82h-580z" class="stroke-B1 fill-B5 s0"/></g><text x="1556" y="1058.5" class="text-bold fill-N1 s2"><tspan x="1556" dy="0">주장 — 평균을 따로 만들어 두지 않는다.</tspan><tspan x="1556" dy="18.5">겪은 개별 사례들을 기억해 두고, 새것이 오면 그것들과 견준다</tspan></text></g><g ><g class="shape"><path d="M860 1210h685v66H860z" class="stroke-B1 fill-B5 s0"/></g><text x="1202.5" y="1248.5" class="text-bold fill-N1 s2">설명하는 것 — 드문 사례에 대한 앎, 그리고 사람마다 범주가 조금씩 다른 것</text></g><g ><g class="shape"><path d="M1605 1202h611v82h-611z" class="stroke-B1 fill-B5 s0"/></g><text x="1910.5" y="1240.5" class="text-bold fill-N1 s2"><tspan x="1910.5" dy="0">걸리는 자리 — 사례를 다 저장한다는 그림이 어디까지 그럴듯한가.</tspan><tspan x="1910.5" dy="18.5">그리고 무엇을 ‘닮았다’ 고 셀지는 여전히 정해 주어야 한다</tspan></text></g><g ><g class="shape"><path d="M1545 1505h730v82h-730z" class="stroke-B1 fill-B5 s0"/></g><text x="1910" y="1543.5" class="text-bold fill-N1 s2"><tspan x="1910" dy="0">닮음만으로는 부족하다. 무엇을 닮음으로 셀지가 이미 앎에 딸려 있기 때문이다.</tspan><tspan x="1910" dy="18.5">같은 두 사물이 어떤 앎 아래서는 닮았고 다른 앎 아래서는 닮지 않았다</tspan></text></g><g ><g class="shape"><path d="M1631 1687h558v82h-558z" class="stroke-B1 fill-B5 s0"/></g><text x="1910" y="1725.5" class="text-bold fill-N1 s2"><tspan x="1910" dy="0">그래서 지금의 표준적인 그림은 하나를 고르는 것이 아니라,</tspan><tspan x="1910" dy="18.5">어느 자리에서 어느 설명이 잘 듣는지를 나누는 쪽이다</tspan></text></g><marker id="mk-d2-1506445258-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1506445258-3488378134)" d="M629.044 132.416C443 172 396 193.6 396 236" class="connection stroke-B1 s0" mask="url(#d2-1506445258)"/><path fill="none" marker-end="url(#mk-d2-1506445258-3488378134)" d="M1016.956 132.416C1203 172 1250 192 1250 228" class="connection stroke-B1 s0" mask="url(#d2-1506445258)"/><path fill="none" marker-end="url(#mk-d2-1506445258-3488378134)" d="M1110.083 617.57C977.6 657 944 677 944 713" class="connection stroke-B1 s0" mask="url(#d2-1506445258)"/><path fill="none" marker-end="url(#mk-d2-1506445258-3488378134)" d="M1389.917 617.57C1522.4 657 1556 677 1556 713" class="connection stroke-B1 s0" mask="url(#d2-1506445258)"/><path fill="none" marker-end="url(#mk-d2-1506445258-3488378134)" d="M1395.063 1102.497C1241 1142 1202 1163.6 1202 1206" class="connection stroke-B1 s0" mask="url(#d2-1506445258)"/><path fill="none" marker-end="url(#mk-d2-1506445258-3488378134)" d="M1716.937 1102.497C1871 1142 1910 1162 1910 1198" class="connection stroke-B1 s0" mask="url(#d2-1506445258)"/><path fill="none" marker-end="url(#mk-d2-1506445258-3488378134)" d="M1910 1589v94" class="connection stroke-B1 s0" mask="url(#d2-1506445258)"/><path fill="none" marker-end="url(#mk-d2-1506445258-3488378134)" d="M1250 345.5v115" class="connection stroke-B1 s0" mask="url(#d2-1506445258)"/><text x="1250.5" y="410" class="text-italic fill-N2 s2">반례와 판단 시간이 밀어냈다</text><path fill="none" marker-end="url(#mk-d2-1506445258-3488378134)" d="M1556 830.5v115" class="connection stroke-B1 s0" mask="url(#d2-1506445258)"/><text x="1556.5" y="895" class="text-italic fill-N2 s2">드문 사례에 대한 앎이 밀어냈다</text><path fill="none" marker-end="url(#mk-d2-1506445258-3488378134)" d="M1910 1315.5v115" class="connection stroke-B1 s0" mask="url(#d2-1506445258)"/><text x="1910.5" y="1380" class="text-italic fill-N2 s2">닮음의 기준 자체를 물으면서</text><mask id="d2-1506445258" width="2497" height="2021" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h2497v2021H-91z"/><path d="M1128 394h245v21h-245zM1423 879h267v21h-267zM1788 1364h245v21h-245z"/></mask></svg>