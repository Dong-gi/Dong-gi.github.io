<svg xmlns="http://www.w3.org/2000/svg" width="1237" height="1586" class="d2-3516484184 d2-svg" viewBox="-101 -101 1237 1586"><rect width="1237" height="1586" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3516484184 .fill-N1{fill:#0a0f25}.d2-3516484184 .fill-B4{fill:#e3e9fd}.d2-3516484184 .fill-B5{fill:#edf0fd}.d2-3516484184 .fill-B6{fill:#f7f8fe}.d2-3516484184 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{text-anchor:middle;font-size:24px}</style><g ><g class="shape"><ellipse cx="518" cy="67.5" class="shape stroke-B1 fill-B6 s0" rx="203" ry="67.5"/></g><text x="518" y="65" class="text-bold fill-N1 s1"><tspan x="518" dy="0">손에 있는 것</tspan><tspan x="518" dy="18.5">X 와 Y 가 함께 높고 함께 낮다</tspan></text></g><g ><g class="shape"><path d="M0 256h1035v688H0z" class="stroke-B1 fill-B4 s0"/></g><text x="517.5" y="289" class="fill-N1 s2">이 자료를 낼 수 있는 그림들</text></g><g ><g class="shape"><path d="M115 1044h805v340H115z" class="stroke-B1 fill-B4 s0"/></g><text x="517.5" y="1077" class="fill-N1 s2">무엇이 갈라 주는가</text></g><g ><g class="shape"><path d="M50 306h415v226H50z" class="stroke-B1 fill-B5 s0"/></g><text x="257.5" y="335" class="fill-N1 s3">1. X 가 Y 를 일으킨다</text></g><g ><g class="shape"><path d="M515 306h470v226H515z" class="stroke-B1 fill-B5 s0"/></g><text x="750" y="335" class="fill-N1 s3">2. Y 가 X 를 일으킨다 — 방향이 반대다</text></g><g ><g class="shape"><path d="M123 642h269v252H123z" class="stroke-B1 fill-B5 s0"/></g><text x="257.5" y="606" class="fill-N1 s3"><tspan x="257.5" dy="0">3. 제3의 변수 Z 가 둘 다 일으킨다</tspan><tspan x="257.5" dy="27.5">— 혼입변수</tspan></text></g><g ><g class="shape"><path d="M515 582h470v312H515z" class="stroke-B1 fill-B5 s0"/></g><text x="750" y="735.5" class="text-bold fill-N1 s1"><tspan x="750" dy="0">4. 우연이다 —</tspan><tspan x="750" dy="18.5">변수를 많이 뒤지면 관계는 저절로 나온다</tspan></text></g><g ><g class="shape"><path d="M175 1104h357v98H175z" class="stroke-B1 fill-B5 s0"/></g><text x="353.5" y="1142.5" class="text-bold fill-N1 s1"><tspan x="353.5" dy="0">X 를 무선배정으로 정한다</tspan><tspan x="353.5" dy="17.667">그러면 2 와 3 이 지워진다.</tspan><tspan x="353.5" dy="17.667">이것이 실험이 하는 일의 전부다</tspan></text></g><g ><g class="shape"><path d="M572 1104h288v98H572z" class="stroke-B1 fill-B5 s0"/></g><text x="716" y="1142.5" class="text-bold fill-N1 s1"><tspan x="716" dy="0">Z 를 재서 통제한다</tspan><tspan x="716" dy="17.667">3 을 그 Z 에 대해서만 지운다.</tspan><tspan x="716" dy="17.667">재지 않은 Z 는 남는다</tspan></text></g><g ><g class="shape"><path d="M175 1242h357v82H175z" class="stroke-B1 fill-B5 s0"/></g><text x="353.5" y="1280.5" class="text-bold fill-N1 s1"><tspan x="353.5" dy="0">시간 순서를 확인한다</tspan><tspan x="353.5" dy="18.5">2 를 약하게 만든다. 지우지는 못한다</tspan></text></g><g ><g class="shape"><path d="M572 1242h288v82H572z" class="stroke-B1 fill-B5 s0"/></g><text x="716" y="1280.5" class="text-bold fill-N1 s1"><tspan x="716" dy="0">다른 표본에서 되풀이한다</tspan><tspan x="716" dy="18.5">4 를 걸러 낸다</tspan></text></g><g ><g class="shape"><path d="M130 386h54v66h-54z" class="stroke-B1 fill-B6 s0"/></g><text x="157" y="424.5" class="text-bold fill-N1 s1">X</text></g><g ><g class="shape"><path d="M264 386h55v66h-55z" class="stroke-B1 fill-B6 s0"/></g><text x="291.5" y="424.5" class="text-bold fill-N1 s1">Y</text></g><g ><g class="shape"><path d="M655 386h55v66h-55z" class="stroke-B1 fill-B6 s0"/></g><text x="682.5" y="424.5" class="text-bold fill-N1 s1">Y</text></g><g ><g class="shape"><path d="M790 386h54v66h-54z" class="stroke-B1 fill-B6 s0"/></g><text x="817" y="424.5" class="text-bold fill-N1 s1">X</text></g><g ><g class="shape"><path d="M153 735h54v66h-54z" class="stroke-B1 fill-B6 s0"/></g><text x="180" y="773.5" class="text-bold fill-N1 s1">Z</text></g><g ><g class="shape"><path d="M308 672h54v66h-54z" class="stroke-B1 fill-B6 s0"/></g><text x="335" y="710.5" class="text-bold fill-N1 s1">X</text></g><g ><g class="shape"><path d="M307 798h55v66h-55z" class="stroke-B1 fill-B6 s0"/></g><text x="334.5" y="836.5" class="text-bold fill-N1 s1">Y</text></g><marker id="mk-d2-3516484184-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3516484184-3488378134)" d="M185.5 419h75" class="connection stroke-B1 s0" mask="url(#d2-3516484184)"/><path fill="none" marker-end="url(#mk-d2-3516484184-3488378134)" d="M712.5 419h74" class="connection stroke-B1 s0" mask="url(#d2-3516484184)"/><path fill="none" marker-end="url(#mk-d2-3516484184-3488378134)" d="M208.547 744.732C247 713.2 267.1 705 303.5 705" class="connection stroke-B1 s0" mask="url(#d2-3516484184)"/><path fill="none" marker-end="url(#mk-d2-3516484184-3488378134)" d="M208.547 791.268C247 822.8 267 831 303 831" class="connection stroke-B1 s0" mask="url(#d2-3516484184)"/><path fill="none" marker-end="url(#mk-d2-3516484184-3488378134)" d="M517.983 137c-.383 46.4-.483 70.7-.483 115.5" class="connection stroke-B1 s0" mask="url(#d2-3516484184)"/><text x="517.5" y="201" style="fill:#676c7e;text-anchor:middle;font-size:16px">네 그림이 모두 같은 산점도를 만든다</text><path fill="none" marker-end="url(#mk-d2-3516484184-3488378134)" d="M517.5 946v94" class="connection stroke-B1 s0" mask="url(#d2-3516484184)"/><mask id="d2-3516484184" width="1237" height="1586" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1237v1586H-101z"/><path d="M363 185h309v21H363z"/></mask></svg>