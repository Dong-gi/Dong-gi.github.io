<svg xmlns="http://www.w3.org/2000/svg" width="3212" height="1749" class="d2-286826896 d2-svg" viewBox="-101 -65 3212 1749"><rect width="3212" height="1749" x="-101" y="-65" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-286826896 .fill-N1{fill:#0a0f25}.d2-286826896 .fill-B4{fill:#e3e9fd}.d2-286826896 .fill-B5{fill:#edf0fd}.d2-286826896 .fill-B6{fill:#f7f8fe}.d2-286826896 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{text-anchor:middle;font-size:24px}</style><g ><g class="shape"><ellipse cx="203" cy="743.5" class="shape stroke-B1 fill-B6 s0" rx="203" ry="67.5"/></g><text x="203" y="741" class="text-bold fill-N1 s1"><tspan x="203" dy="0">손에 있는 것</tspan><tspan x="203" dy="18.5">X 와 Y 가 함께 높고 함께 낮다</tspan></text></g><g ><g class="shape"><path d="M1371 76h1425v853H1371z" class="stroke-B1 fill-B4 s0"/></g><text x="2083.5" y="63" class="fill-N1 s2">이 자료를 낼 수 있는 그림들</text></g><g ><g class="shape"><path d="M2325 1015h685v568h-685z" class="stroke-B1 fill-B4 s0"/></g><text x="2667.5" y="1002" class="fill-N1 s2">무엇이 갈라 주는가</text></g><g ><g class="shape"><path d="M1604 117h1162v126H1604z" class="stroke-B1 fill-B5 s0"/></g><text x="2185" y="105" class="fill-N1 s3">1. X 가 Y 를 일으킨다</text></g><g ><g class="shape"><path d="M1603 324h1163v126H1603z" class="stroke-B1 fill-B5 s0"/></g><text x="2184.5" y="312" class="fill-N1 s3">2. Y 가 X 를 일으킨다 — 방향이 반대다</text></g><g ><g class="shape"><path d="M1604 531h1162v252H1604z" class="stroke-B1 fill-B5 s0"/></g><text x="2185" y="519" class="fill-N1 s3">3. 제3의 변수 Z 가 둘 다 일으킨다 — 혼입변수</text></g><g ><g class="shape"><path d="M1401 833h519v66h-519z" class="stroke-B1 fill-B5 s0"/></g><text x="1660.5" y="871.5" class="text-bold fill-N1 s1">4. 우연이다 — 변수를 많이 뒤지면 관계는 저절로 나온다</text></g><g ><g class="shape"><path d="M2438 1045h542v82h-542z" class="stroke-B1 fill-B5 s0"/></g><text x="2709" y="1083.5" class="text-bold fill-N1 s1"><tspan x="2709" dy="0">X 를 무선배정으로 정한다</tspan><tspan x="2709" dy="18.5">그러면 2 와 3 이 지워진다. 이것이 실험이 하는 일의 전부다</tspan></text></g><g ><g class="shape"><path d="M2472 1187h474v82h-474z" class="stroke-B1 fill-B5 s0"/></g><text x="2709" y="1225.5" class="text-bold fill-N1 s1"><tspan x="2709" dy="0">Z 를 재서 통제한다</tspan><tspan x="2709" dy="18.5">3 을 그 Z 에 대해서만 지운다. 재지 않은 Z 는 남는다</tspan></text></g><g ><g class="shape"><path d="M2530 1329h357v82h-357z" class="stroke-B1 fill-B5 s0"/></g><text x="2708.5" y="1367.5" class="text-bold fill-N1 s1"><tspan x="2708.5" dy="0">시간 순서를 확인한다</tspan><tspan x="2708.5" dy="18.5">2 를 약하게 만든다. 지우지는 못한다</tspan></text></g><g ><g class="shape"><path d="M2573 1471h272v82h-272z" class="stroke-B1 fill-B5 s0"/></g><text x="2709" y="1509.5" class="text-bold fill-N1 s1"><tspan x="2709" dy="0">다른 표본에서 되풀이한다</tspan><tspan x="2709" dy="18.5">4 를 걸러 낸다</tspan></text></g><g ><g class="shape"><path d="M1634 147h54v66h-54z" class="stroke-B1 fill-B6 s0"/></g><text x="1661" y="185.5" class="text-bold fill-N1 s1">X</text></g><g ><g class="shape"><path d="M2681 147h55v66h-55z" class="stroke-B1 fill-B6 s0"/></g><text x="2708.5" y="185.5" class="text-bold fill-N1 s1">Y</text></g><g ><g class="shape"><path d="M1633 354h55v66h-55z" class="stroke-B1 fill-B6 s0"/></g><text x="1660.5" y="392.5" class="text-bold fill-N1 s1">Y</text></g><g ><g class="shape"><path d="M2682 354h54v66h-54z" class="stroke-B1 fill-B6 s0"/></g><text x="2709" y="392.5" class="text-bold fill-N1 s1">X</text></g><g ><g class="shape"><path d="M1634 624h54v66h-54z" class="stroke-B1 fill-B6 s0"/></g><text x="1661" y="662.5" class="text-bold fill-N1 s1">Z</text></g><g ><g class="shape"><path d="M2682 561h54v66h-54z" class="stroke-B1 fill-B6 s0"/></g><text x="2709" y="599.5" class="text-bold fill-N1 s1">X</text></g><g ><g class="shape"><path d="M2681 687h55v66h-55z" class="stroke-B1 fill-B6 s0"/></g><text x="2708.5" y="725.5" class="text-bold fill-N1 s1"