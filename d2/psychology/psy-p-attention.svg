<svg xmlns="http://www.w3.org/2000/svg" width="2623" height="1381" class="d2-2469483537 d2-svg" viewBox="-91 -101 2623 1381"><rect width="2623" height="1381" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2469483537 .fill-N1{fill:#0a0f25}.d2-2469483537 .fill-B5{fill:#edf0fd}.d2-2469483537 .fill-B6{fill:#f7f8fe}.d2-2469483537 .stroke-B1,.d2-2469483537 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="1334" cy="65.5" class="shape stroke-B1 fill-B6 s0" rx="197" ry="65.5"/></g><text x="1334" y="63" class="text-bold fill-N1 s1"><tspan x="1334" dy="0">감각 표면에 닿은 것</tspan><tspan x="1334" dy="18.5">지금 눈에 들어오는 모든 것</tspan></text></g><g ><g class="shape"><path d="M1222 231h223v66h-223z" class="stroke-B1 fill-B6 s0"/></g><text x="1333.5" y="269.5" class="text-bold fill-N1 s1">고르기 (선택적 주의)</text></g><g ><g class="shape"><path d="M10 417h1031v126H10z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="525.5" y="404" class="fill-N1" style="text-anchor:middle;font-size:28px">무엇이 고르기를 정하는가</text></g><g ><g class="shape"><path d="M1091 447h485v66h-485z" class="stroke-B1 fill-B6 s0"/></g><text x="1333.5" y="485.5" class="text-bold fill-N1 s1">골라진 것 — 자세히 표상되고 나중에 보고할 수 있다</text></g><g ><g class="shape"><path d="M1636 447h505v66h-505z" class="stroke-B1 fill-B6 s0"/></g><text x="1888.5" y="485.5" class="text-bold fill-N1 s1">골라지지 않은 것 — 아주 거칠게만 남거나 남지 않는다</text></g><g ><g class="shape"><path d="M1191 663h578v98h-578z" class="stroke-B1 fill-B6 s0"/></g><text x="1480" y="701.5" class="text-bold fill-N1 s1"><tspan x="1480" dy="0">부주의맹</tspan><tspan x="1480" dy="17.667">다른 것을 세고 있는 동안 화면 가운데를 지나간 뚜렷한 물체를</tspan><tspan x="1480" dy="17.667">상당수의 사람이 보고하지 못한다</tspan></text></g><g ><g class="shape"><path d="M1940 663h491v98h-491z" class="stroke-B1 fill-B6 s0"/></g><text x="2185.5" y="701.5" class="text-bold fill-N1 s1"><tspan x="2185.5" dy="0">변화맹</tspan><tspan x="2185.5" dy="17.667">장면이 잠깐 끊긴 사이에 큰 것이 바뀌어도</tspan><tspan x="2185.5" dy="17.667">바뀐 곳을 주의해 보고 있지 않으면 알아채지 못한다</tspan></text></g><text x="1888.5" y="877" class="fill-N1 s1"><tspan x="1888.5" dy="0"> </tspan><tspan x="1888.5" dy="16.556">여기서 넘어가면 안 되는 선 —</tspan><tspan x="1888.5" dy="16.556"> </tspan><tspan x="1888.5" dy="16.556">이 결과들은 ‘사람은 거의 아무것도 보지 못한다’ 를 뜻하지 않는다.</tspan><tspan x="1888.5" dy="16.556">보인 것은 ‘주의하지 않은 것의 변화를 알아채지 못한다’ 는 좁은 주장이다.</tspan><tspan x="1888.5" dy="16.556"> </tspan><tspan x="1888.5" dy="16.556">그리고 이 결과들 자체가 네 물음에 다르게 답한다 —</tspan><tspan x="1888.5" dy="16.556">효과는 여러 연구실에서 되풀이 나왔고 표본도 넓은 편이지만,</tspan><tspan x="1888.5" dy="16.556">실험실 과제 밖의 어떤 행동에 대응하는지는 과제마다 따로 보여야 한다</tspan></text><text x="1888.5" y="1126" class="fill-N1 s1"><tspan x="1888.5" dy="0"> </tspan><tspan x="1888.5" dy="17.25">덧붙일 것 하나 — 사람들은 자기가 그런 변화를 알아챌 것이라고</tspan><tspan x="1888.5" dy="17.25">실제보다 크게 예상한다. 이것에도 이름이 붙어 있다(변화맹 맹시).</tspan><tspan x="1888.5" dy="17.25">지각의 한계를 지각이 알려 주지 않는다는 뜻이다</tspan></text><g ><g class="shape"><path d="M40 447h215v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="147.5" y="485.5" class="text-bold fill-N1 s1">지금 하고 있는 과제</text></g><g ><g class="shape"><path d="M315 447h296v66H315z" class="stroke-B1 fill-B5 s0"/></g><text x="463" y="485.5" class="text-bold fill-N1 s1">갑자기 나타나거나 움직인 것</text></g><g ><g class="shape"><path d="M671 447h340v66H671z" class="stroke-B1 fill-B5 s0"/></g><text x="841" y="485.5" class="text-bold fill-N1 s1">자기 이름처럼 특별히 다뤄지는 것</text></g><marker id="mk-d2-2469483537-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2469483537-3488378134)" d="M1333.98 133c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-2469483537)"/><marker id="mk-d2-2469483537-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2469483537-2177206569)" d="M1220.009 275.189C614.8 332.6 463 352.8 463 372" class="connection stroke-B2 s3" mask="url(#d2-2469483537)"/><path fill="none" marker-end="url(#mk-d2-2469483537-3488378134)" d="M1333.5 299v144" class="connection stroke-B1 s0" mask="url(#d2-2469483537)"/><path fill="none" marker-end="url(#mk-d2-2469483537-3488378134)" d="M1446.478 281.294C1799.7 333.8 1888.5 407 1888.5 443" class="connection stroke-B1 s0" mask="url(#d2-2469483537)"/><path fill="none" marker-end="url(#mk-d2-2469483537-3488378134)" d="M1723.79 513.398C1528.95 553 1479.75 623 1479.75 659" class="connection stroke-B1 s0" mask="url(#d2-2469483537)"/><path fill="none" marker-end="url(#mk-d2-2469483537-3488378134)" d="M2008.676 513.538C2149.95 553 2185.75 623 2185.75 659" class="connection stroke-B1 s0" mask="url(#d2-2469483537)"/><path fill="none" marker-end="url(#mk-d2-2469483537-2177206569)" d="M1479.75 763c0 38 32.8 58 160.174 96.833" class="connection stroke-B2 s3" mask="url(#d2-2469483537)"/><path fill="none" marker-end="url(#mk-d2-2469483537-2177206569)" d="M2185.75 763c0 38-23.8 58-115.312 96.45" class="connection stroke-B2 s3" mask="url(#d2-2469483537)"/><path fill="none" marker-end="url(#mk-d2-2469483537-2177206569)" d="M1888.5 1012v94" class="connection stroke-B2 s3" mask="url(#d2-2469483537)"/><mask id="d2-2469483537" width="2623" height="1381" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h2623v1381H-91z"/></mask></svg>