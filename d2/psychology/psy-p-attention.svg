<svg xmlns="http://www.w3.org/2000/svg" width="1309" height="1571" class="d2-3095377929 d2-svg" viewBox="-101 -101 1309 1571"><rect width="1309" height="1571" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3095377929 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3095377929 .fill-N1{fill:#0a0f25}.d2-3095377929 .fill-B5{fill:#edf0fd}.d2-3095377929 .fill-B6{fill:#f7f8fe}.d2-3095377929 .stroke-B1,.d2-3095377929 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="642" cy="65.5" class="shape stroke-B1 fill-B6 s0" rx="197" ry="65.5"/></g><text x="642" y="63" class="text-bold fill-N1 s1"><tspan x="642" dy="0">감각 표면에 닿은 것</tspan><tspan x="642" dy="18.5">지금 눈에 들어오는 모든 것</tspan></text></g><g ><g class="shape"><path d="M531 231h223v66H531z" class="stroke-B1 fill-B6 s0"/></g><text x="642.5" y="269.5" class="text-bold fill-N1 s1">고르기 (선택적 주의)</text></g><g ><g class="shape"><path d="M0 397h412v292H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="206" y="430" class="fill-N1" style="text-anchor:middle;font-size:28px">무엇이 고르기를 정하는가</text></g><g ><g class="shape"><path d="M472 502h340v82H472z" class="stroke-B1 fill-B6 s0"/></g><text x="642" y="540.5" class="text-bold fill-N1 s1"><tspan x="642" dy="0">골라지지 않은 것 —</tspan><tspan x="642" dy="18.5">아주 거칠게만 남거나 남지 않는다</tspan></text></g><g ><g class="shape"><path d="M872 494h235v98H872z" class="stroke-B1 fill-B6 s0"/></g><text x="989.5" y="532.5" class="text-bold fill-N1 s1"><tspan x="989.5" dy="0">골라진 것 —</tspan><tspan x="989.5" dy="17.667">자세히 표상되고</tspan><tspan x="989.5" dy="17.667">나중에 보고할 수 있다</tspan></text></g><g ><g class="shape"><path d="M240 789h360v114H240z" class="stroke-B1 fill-B6 s0"/></g><text x="420" y="827.5" class="text-bold fill-N1 s1"><tspan x="420" dy="0">부주의맹</tspan><tspan x="420" dy="17.25">다른 것을 세고 있는 동안</tspan><tspan x="420" dy="17.25">화면 가운데를 지나간 뚜렷한 물체를</tspan><tspan x="420" dy="17.25">상당수의 사람이 보고하지 못한다</tspan></text></g><g ><g class="shape"><path d="M660 789h407v114H660z" class="stroke-B1 fill-B6 s0"/></g><text x="863.5" y="827.5" class="text-bold fill-N1 s1"><tspan x="863.5" dy="0">변화맹</tspan><tspan x="863.5" dy="17.25">장면이 잠깐 끊긴 사이에 큰 것이 바뀌어도</tspan><tspan x="863.5" dy="17.25">바뀐 곳을 주의해 보고 있지 않으면</tspan><tspan x="863.5" dy="17.25">알아채지 못한다</tspan></text></g><text x="642" y="1019" class="fill-N1 s1"><tspan x="642" dy="0"> </tspan><tspan x="642" dy="16.455">여기서 넘어가면 안 되는 선 —</tspan><tspan x="642" dy="16.455"> </tspan><tspan x="642" dy="16.455">이 결과들은 ‘사람은 거의 아무것도 보지 못한다’ 를</tspan><tspan x="642" dy="16.455">뜻하지 않는다. 보인 것은 ‘주의하지 않은 것의 변화를</tspan><tspan x="642" dy="16.455">알아채지 못한다’ 는 좁은 주장이다.</tspan><tspan x="642" dy="16.455"> </tspan><tspan x="642" dy="16.455">그리고 이 결과들 자체가 네 물음에 다르게 답한다 —</tspan><tspan x="642" dy="16.455">효과는 여러 연구실에서 되풀이 나왔고</tspan><tspan x="642" dy="16.455">표본도 넓은 편이지만, 실험실 과제 밖의</tspan><tspan x="642" dy="16.455">어떤 행동에 대응하는지는 과제마다 따로 보여야 한다</tspan></text><text x="642" y="1300" class="fill-N1 s1"><tspan x="642" dy="0"> </tspan><tspan x="642" dy="17">덧붙일 것 하나 — 사람들은 자기가</tspan><tspan x="642" dy="17">그런 변화를 알아챌 것이라고 실제보다 크게 예상한다.</tspan><tspan x="642" dy="17">이것에도 이름이 붙어 있다(변화맹 맹시).</tspan><tspan x="642" dy="17">지각의 한계를 지각이 알려 주지 않는다는 뜻이다</tspan></text><g ><g class="shape"><path d="M36 443h340v66H36z" class="stroke-B1 fill-B5 s0"/></g><text x="206" y="481.5" class="text-bold fill-N1 s1">지금 하고 있는 과제</text></g><g ><g class="shape"><path d="M36 525h340v66H36z" class="stroke-B1 fill-B5 s0"/></g><text x="206" y="563.5" class="text-bold fill-N1 s1">갑자기 나타나거나 움직인 것</text></g><g ><g class="shape"><path d="M36 607h340v66H36z" class="stroke-B1 fill-B5 s0"/></g><text x="206" y="645.5" class="text-bold fill-N1 s1">자기 이름처럼 특별히 다뤄지는 것</text></g><marker id="mk-d2-3095377929-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3095377929-3488378134)" d="M642 133v94" class="connection stroke-B1 s0" mask="url(#d2-3095377929)"/><marker id="mk-d2-3095377929-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3095377929-2177206569)" d="M528.535 285.599C270.9 334.645 206 357 206 393" class="connection stroke-B2 s3" mask="url(#d2-3095377929)"/><path fill="none" marker-end="url(#mk-d2-3095377929-3488378134)" d="M642 299v199" class="connection stroke-B1 s0" mask="url(#d2-3095377929)"/><path fill="none" marker-end="url(#mk-d2-3095377929-3488378134)" d="M756.445 291.098C942.5 335.726 989.5 376.4 989.5 490" class="connection stroke-B1 s0" mask="url(#d2-3095377929)"/><path fill="none" marker-end="url(#mk-d2-3095377929-3488378134)" d="M593.753 585.326C455.25 708 420.25 749 420.25 785" class="connection stroke-B1 s0" mask="url(#d2-3095377929)"/><path fill="none" marker-end="url(#mk-d2-3095377929-3488378134)" d="M690.247 585.326C828.75 708 863.75 749 863.75 785" class="connection stroke-B1 s0" mask="url(#d2-3095377929)"/><path fill="none" marker-end="url(#mk-d2-3095377929-2177206569)" d="M420.25 905c0 38 15.8 58 75.62 95.86" class="connection stroke-B2 s3" mask="url(#d2-3095377929)"/><path fill="none" marker-end="url(#mk-d2-3095377929-2177206569)" d="M863.75 905c0 38-15.8 58-75.62 95.86" class="connection stroke-B2 s3" mask="url(#d2-3095377929)"/><path fill="none" marker-end="url(#mk-d2-3095377929-2177206569)" d="M642 1186v94" class="connection stroke-B2 s3" mask="url(#d2-3095377929)"/><mask id="d2-3095377929" width="1309" height="1571" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1309v1571H-101z"/></mask></svg>