<svg xmlns="http://www.w3.org/2000/svg" width="1215" height="1336" class="d2-3941368971 d2-svg" viewBox="-101 -101 1215 1336"><rect width="1215" height="1336" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3941368971 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3941368971 .fill-N1{fill:#0a0f25}.d2-3941368971 .fill-B4{fill:#e3e9fd}.d2-3941368971 .fill-B5{fill:#edf0fd}.d2-3941368971 .fill-B6{fill:#f7f8fe}.d2-3941368971 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h494v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="247" y="38.5" class="text-bold fill-N1 s1"><tspan x="247" dy="0">출발점</tspan><tspan x="247" dy="16.833">목격자의 지목은 배심과 판사에게</tspan><tspan x="247" dy="16.833">매우 무겁게 받아들여지는데,</tspan><tspan x="247" dy="16.833">기억은 사건 뒤에 들어온 것에 따라 바뀐다.</tspan><tspan x="247" dy="16.833">지목 절차 자체가</tspan><tspan x="247" dy="16.833">그 ‘사건 뒤에 들어온 것’ 이 될 수 있다</tspan></text></g><g ><g class="shape"><path d="M0 206h494v928H0z" class="stroke-B1 fill-B4 s0"/></g><text x="247" y="239" class="fill-N1 s2">권고된 절차</text></g><g ><g class="shape"><path d="M554 206h459v928H554z" class="stroke-B1 fill-B4 s0"/></g><text x="783.5" y="239" class="fill-N1 s2">그런데 다 정해진 것은 아니다</text></g><g ><g class="shape"><path d="M40 252h414v146H40z" class="stroke-B1 fill-B5 s0"/></g><text x="247" y="290.5" class="text-bold fill-N1 s1"><tspan x="247" dy="0">1. 진행자가 누가 용의자인지</tspan><tspan x="247" dy="16.833">모르게 한다</tspan><tspan x="247" dy="16.833">대응하는 연구 — 실험자의 기대가</tspan><tspan x="247" dy="16.833">참가자의 반응에 새어 든다(6장).</tspan><tspan x="247" dy="16.833">말투나 시선 같은</tspan><tspan x="247" dy="16.833">아주 작은 신호로도 옮겨 간다</tspan></text></g><g ><g class="shape"><path d="M40 438h414v146H40z" class="stroke-B1 fill-B5 s0"/></g><text x="247" y="476.5" class="text-bold fill-N1 s1"><tspan x="247" dy="0">2. ‘범인이 이 안에 없을 수도 있다’ 고</tspan><tspan x="247" dy="16.833">미리 알린다</tspan><tspan x="247" dy="16.833">대응하는 연구 — 안내가 없으면</tspan><tspan x="247" dy="16.833">목격자는 여럿 가운데</tspan><tspan x="247" dy="16.833">가장 닮은 사람을 고르는</tspan><tspan x="247" dy="16.833">비교 과제로 받아들이기 쉽다</tspan></text></g><g ><g class="shape"><path d="M40 624h414v146H40z" class="stroke-B1 fill-B5 s0"/></g><text x="247" y="662.5" class="text-bold fill-N1 s1"><tspan x="247" dy="0">3. 함께 세우는 사람들을</tspan><tspan x="247" dy="16.833">목격자의 진술에 맞춰 고른다</tspan><tspan x="247" dy="16.833">대응하는 연구 — 용의자만 진술과 맞으면</tspan><tspan x="247" dy="16.833">나머지는 후보가 아니게 된다.</tspan><tspan x="247" dy="16.833">선택지가 하나뿐인 절차는</tspan><tspan x="247" dy="16.833">지목을 재는 절차가 아니다</tspan></text></g><g ><g class="shape"><path d="M40 810h414v146H40z" class="stroke-B1 fill-B5 s0"/></g><text x="247" y="848.5" class="text-bold fill-N1 s1"><tspan x="247" dy="0">4. 지목 직후에 목격자 자신의 말로</tspan><tspan x="247" dy="16.833">확신 정도를 적어 둔다</tspan><tspan x="247" dy="16.833">대응하는 연구 — 확신은</tspan><tspan x="247" dy="16.833">뒤에 들어오는 정보로 올라간다.</tspan><tspan x="247" dy="16.833">‘잘 골랐습니다’ 한마디가</tspan><tspan x="247" dy="16.833">확신을 크게 바꾼다는 보고가 있다</tspan></text></g><g ><g class="shape"><path d="M40 996h414v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="247" y="1034.5" class="text-bold fill-N1 s1"><tspan x="247" dy="0">5. 절차 전체를 녹화한다</tspan><tspan x="247" dy="17.667">대응하는 연구 — 무엇이 언제 말해졌는지가</tspan><tspan x="247" dy="17.667">뒤에 재구성되지 않도록 한다</tspan></text></g><g ><g class="shape"><path d="M613 256h341v178H613z" class="stroke-B1 fill-B5 s0"/></g><text x="783.5" y="294.5" class="text-bold fill-N1 s1"><tspan x="783.5" dy="0">한꺼번에 보이는가,</tspan><tspan x="783.5" dy="16.625">한 사람씩 보이는가.</tspan><tspan x="783.5" dy="16.625">한동안 한 사람씩 보이는 쪽이</tspan><tspan x="783.5" dy="16.625">낫다는 권고가 널리 퍼졌으나,</tspan><tspan x="783.5" dy="16.625">뒤에 다른 분석 방법으로 보면</tspan><tspan x="783.5" dy="16.625">결론이 뒤집힌다는 반론이 나왔다.</tspan><tspan x="783.5" dy="16.625">지금은 어느 쪽이 낫다고</tspan><tspan x="783.5" dy="16.625">확정되지 않았다</tspan></text></g><g ><g class="shape"><path d="M613 484h341v114H613z" class="stroke-B1 fill-B5 s0"/></g><text x="783.5" y="522.5" class="text-bold fill-N1 s1"><tspan x="783.5" dy="0">이 두 항목이 이 장에서</tspan><tspan x="783.5" dy="17.25">가장 조심해서 읽어야 할 자리다.</tspan><tspan x="783.5" dy="17.25">2015년 이전 개론서의 서술이</tspan><tspan x="783.5" dy="17.25">지금과 다르다</tspan></text></g><g ><g class="shape"><path d="M613 648h341v194H613z" class="stroke-B1 fill-B5 s0"/></g><text x="783.5" y="686.5" class="text-bold fill-N1 s1"><tspan x="783.5" dy="0">확신을 어떻게 볼 것인가.</tspan><tspan x="783.5" dy="16.556">한동안 ‘확신은 정확성을</tspan><tspan x="783.5" dy="16.556">예측하지 못한다’ 가</tspan><tspan x="783.5" dy="16.556">표준 서술이었다.</tspan><tspan x="783.5" dy="16.556">지금은 ‘오염되지 않은 절차에서,</tspan><tspan x="783.5" dy="16.556">첫 지목 시점에 잰’ 확신은</tspan><tspan x="783.5" dy="16.556">상당한 정보를 담는다는 쪽이</tspan><tspan x="783.5" dy="16.556">다수설이다.</tspan><tspan x="783.5" dy="16.556">조건이 붙는 것이 요점이다</tspan></text></g><marker id="mk-d2-3941368971-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3941368971-3488378134)" d="M247 400v34" class="connection stroke-B1 s0" mask="url(#d2-3941368971)"/><path fill="none" marker-end="url(#mk-d2-3941368971-3488378134)" d="M247 586v34" class="connection stroke-B1 s0" mask="url(#d2-3941368971)"/><path fill="none" marker-end="url(#mk-d2-3941368971-3488378134)" d="M247 772v34" class="connection stroke-B1 s0" mask="url(#d2-3941368971)"/><path fill="none" marker-end="url(#mk-d2-3941368971-3488378134)" d="M247 958v34" class="connection stroke-B1 s0" mask="url(#d2-3941368971)"/><path fill="none" marker-end="url(#mk-d2-3941368971-3488378134)" d="M247 148v54" class="connection stroke-B1 s0" mask="url(#d2-3941368971)"/><path fill="none" marker-end="url(#mk-d2-3941368971-3488378134)" d="M783.5 436v44" class="connection stroke-B1 s0" mask="url(#d2-3941368971)"/><path fill="none" marker-end="url(#mk-d2-3941368971-3488378134)" d="M783.5 646v-44" class="connection stroke-B1 s0" mask="url(#d2-3941368971)"/><marker id="mk-d2-3941368971-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3941368971-2177206569)" d="M495.5 670h55" class="connection" mask="url(#d2-3941368971)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3941368971" width="1215" height="1336" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1215v1336H-101z"/></mask></svg>