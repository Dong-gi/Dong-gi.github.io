<svg xmlns="http://www.w3.org/2000/svg" width="1621" height="1866" class="d2-3789386117 d2-svg" viewBox="-91 -101 1621 1866"><rect width="1621" height="1866" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3789386117 .fill-N1{fill:#0a0f25}.d2-3789386117 .fill-B4{fill:#e3e9fd}.d2-3789386117 .fill-B5{fill:#edf0fd}.d2-3789386117 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M101 0h595v114H101z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="398.5" y="38.5" class="text-bold fill-N1 s0"><tspan x="398.5" dy="0">출발점</tspan><tspan x="398.5" dy="17.25">목격자의 지목은 배심과 판사에게 매우 무겁게 받아들여지는데,</tspan><tspan x="398.5" dy="17.25">기억은 사건 뒤에 들어온 것에 따라 바뀐다.</tspan><tspan x="398.5" dy="17.25">지목 절차 자체가 그 ‘사건 뒤에 들어온 것’ 이 될 수 있다</tspan></text></g><g ><g class="shape"><path d="M10 234h777v934H10z" class="stroke-B1 fill-B4 s1"/></g><text x="398.5" y="221" class="fill-N1 s2">권고된 절차</text></g><g ><g class="shape"><path d="M69 1308h1360v356H69z" class="stroke-B1 fill-B4 s1"/></g><text x="749" y="1295" class="fill-N1 s2">그런데 다 정해진 것은 아니다</text></g><g ><g class="shape"><path d="M94 264h610v98H94z" class="stroke-B1 fill-B5 s1"/></g><text x="399" y="302.5" class="text-bold fill-N1 s0"><tspan x="399" dy="0">1. 진행자가 누가 용의자인지 모르게 한다</tspan><tspan x="399" dy="17.667">대응하는 연구 — 실험자의 기대가 참가자의 반응에 새어 든다(6장).</tspan><tspan x="399" dy="17.667">말투나 시선 같은 아주 작은 신호로도 옮겨 간다</tspan></text></g><g ><g class="shape"><path d="M40 462h717v98H40z" class="stroke-B1 fill-B5 s1"/></g><text x="398.5" y="500.5" class="text-bold fill-N1 s0"><tspan x="398.5" dy="0">2. ‘범인이 이 안에 없을 수도 있다’ 고 미리 알린다</tspan><tspan x="398.5" dy="17.667">대응하는 연구 — 안내가 없으면 목격자는 여럿 가운데 가장 닮은 사람을 고르는</tspan><tspan x="398.5" dy="17.667">비교 과제로 받아들이기 쉽다</tspan></text></g><g ><g class="shape"><path d="M71 660h655v98H71z" class="stroke-B1 fill-B5 s1"/></g><text x="398.5" y="698.5" class="text-bold fill-N1 s0"><tspan x="398.5" dy="0">3. 함께 세우는 사람들을 목격자의 진술에 맞춰 고른다</tspan><tspan x="398.5" dy="17.667">대응하는 연구 — 용의자만 진술과 맞으면 나머지는 후보가 아니게 된다.</tspan><tspan x="398.5" dy="17.667">선택지가 하나뿐인 절차는 지목을 재는 절차가 아니다</tspan></text></g><g ><g class="shape"><path d="M112 858h574v98H112z" class="stroke-B1 fill-B5 s1"/></g><text x="399" y="896.5" class="text-bold fill-N1 s0"><tspan x="399" dy="0">4. 지목 직후에 목격자 자신의 말로 확신 정도를 적어 둔다</tspan><tspan x="399" dy="17.667">대응하는 연구 — 확신은 뒤에 들어오는 정보로 올라간다.</tspan><tspan x="399" dy="17.667">‘잘 골랐습니다’ 한마디가 확신을 크게 바꾼다는 보고가 있다</tspan></text></g><g ><g class="shape"><path d="M64 1056h670v82H64z" class="stroke-B1 fill-B5 s1"/></g><text x="399" y="1094.5" class="text-bold fill-N1 s0"><tspan x="399" dy="0">5. 절차 전체를 녹화한다</tspan><tspan x="399" dy="18.5">대응하는 연구 — 무엇이 언제 말해졌는지가 뒤에 재구성되지 않도록 한다</tspan></text></g><g ><g class="shape"><path d="M99 1338h600v114H99z" class="stroke-B1 fill-B5 s1"/></g><text x="399" y="1376.5" class="text-bold fill-N1 s0"><tspan x="399" dy="0">한꺼번에 보이는가, 한 사람씩 보이는가.</tspan><tspan x="399" dy="17.25">한동안 한 사람씩 보이는 쪽이 낫다는 권고가 널리 퍼졌으나,</tspan><tspan x="399" dy="17.25">뒤에 다른 분석 방법으로 보면 결론이 뒤집힌다는 반론이 나왔다.</tspan><tspan x="399" dy="17.25">지금은 어느 쪽이 낫다고 확정되지 않았다</tspan></text></g><g ><g class="shape"><path d="M759 1338h640v114H759z" class="stroke-B1 fill-B5 s1"/></g><text x="1079" y="1376.5" class="text-bold fill-N1 s0"><tspan x="1079" dy="0">확신을 어떻게 볼 것인가.</tspan><tspan x="1079" dy="17.25">한동안 ‘확신은 정확성을 예측하지 못한다’ 가 표준 서술이었다.</tspan><tspan x="1079" dy="17.25">지금은 ‘오염되지 않은 절차에서, 첫 지목 시점에 잰’ 확신은</tspan><tspan x="1079" dy="17.25">상당한 정보를 담는다는 쪽이 다수설이다. 조건이 붙는 것이 요점이다</tspan></text></g><g ><g class="shape"><path d="M478 1552h522v82H478z" class="stroke-B1 fill-B5 s1"/></g><text x="739" y="1590.5" class="text-bold fill-N1 s0"><tspan x="739" dy="0">이 두 항목이 이 장에서 가장 조심해서 읽어야 할 자리다.</tspan><tspan x="739" dy="18.5">2015년 이전 개론서의 서술이 지금과 다르다</tspan></text></g><marker id="mk-d2-3789386117-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3789386117-3488378134)" d="M398.5 364v94" class="connection stroke-B1 s1" mask="url(#d2-3789386117)"/><path fill="none" marker-end="url(#mk-d2-3789386117-3488378134)" d="M398.5 562v94" class="connection stroke-B1 s1" mask="url(#d2-3789386117)"/><path fill="none" marker-end="url(#mk-d2-3789386117-3488378134)" d="M398.5 760v94" class="connection stroke-B1 s1" mask="url(#d2-3789386117)"/><path fill="none" marker-end="url(#mk-d2-3789386117-3488378134)" d="M398.5 958v94" class="connection stroke-B1 s1" mask="url(#d2-3789386117)"/><path fill="none" marker-end="url(#mk-d2-3789386117-3488378134)" d="M398.5 116v73" class="connection stroke-B1 s1" mask="url(#d2-3789386117)"/><path fill="none" marker-end="url(#mk-d2-3789386117-3488378134)" d="M398.5 1454c0 38 37.4 58 183.136 96.967" class="connection stroke-B1 s1" mask="url(#d2-3789386117)"/><path fill="none" marker-end="url(#mk-d2-3789386117-3488378134)" d="M1078.5 1454c0 38-37.401 58-183.136 96.967" class="connection stroke-B1 s1" mask="url(#d2-3789386117)"/><marker id="mk-d2-3789386117-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3789386117-2177206569)" d="M398.5 1170v134" class="connection" mask="url(#d2-3789386117)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3789386117" width="1621" height="1866" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1621v1866H-91z"/></mask></svg>