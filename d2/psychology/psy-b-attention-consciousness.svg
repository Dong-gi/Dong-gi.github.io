<svg xmlns="http://www.w3.org/2000/svg" width="1977" height="811" class="d2-4292804615 d2-svg" viewBox="-101 -101 1977 811"><rect width="1977" height="811" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4292804615 .fill-N1{fill:#0a0f25}.d2-4292804615 .fill-B6{fill:#f7f8fe}.d2-4292804615 .stroke-B1,.d2-4292804615 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="718" cy="65" class="shape stroke-B1 fill-B6 s0" rx="195" ry="65"/></g><text x="718" y="70.5" class="text-bold fill-N1 s1">주의를 준 것만 의식되는가</text></g><g ><g class="shape"><path d="M0 246h223v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="111.5" y="284.5" class="text-bold fill-N1 s1"><tspan x="111.5" dy="0">주의 O · 의식 O</tspan><tspan x="111.5" dy="17.667">지금 읽고 있는 이 줄.</tspan><tspan x="111.5" dy="17.667">다툼 없음</tspan></text></g><g ><g class="shape"><path d="M283 246h382v98H283z" class="stroke-B1 fill-B6 s0"/></g><text x="474" y="284.5" class="text-bold fill-N1 s1"><tspan x="474" dy="0">주의 X · 의식 X</tspan><tspan x="474" dy="17.667">12장의 부주의맹과 변화맹이 이 칸이다.</tspan><tspan x="474" dy="17.667">다툼 없음</tspan></text></g><g ><g class="shape"><path d="M725 238h473v114H725z" class="stroke-B1 fill-B6 s0"/></g><text x="961.5" y="276.5" class="text-bold fill-N1 s1"><tspan x="961.5" dy="0">주의 O · 의식 X</tspan><tspan x="961.5" dy="17.25">주의를 주었는데도 의식되지 않는 자극이 있는가.</tspan><tspan x="961.5" dy="17.25">아주 짧게 보이고 곧바로 가리면 보고되지 않는데,</tspan><tspan x="961.5" dy="17.25">그때 무엇까지 처리되는지가 다투어진다</tspan></text></g><g ><g class="shape"><path d="M1258 230h517v130h-517z" class="stroke-B1 fill-B6 s0"/></g><text x="1516.5" y="268.5" class="text-bold fill-N1 s1"><tspan x="1516.5" dy="0">주의 X · 의식 O</tspan><tspan x="1516.5" dy="17">주의를 주지 않은 주변에 대해 ‘대충 무엇이 있는지’ 를</tspan><tspan x="1516.5" dy="17">알고 있다는 느낌이 있는데, 그 느낌이 실제 표상인지</tspan><tspan x="1516.5" dy="17">아니면 필요할 때 주의를 옮기면 알 수 있다는 데서 오는</tspan><tspan x="1516.5" dy="17">착각인지가 다투어진다</tspan></text></g><text x="1239" y="476" class="fill-N1 s1"><tspan x="1239" dy="0"> </tspan><tspan x="1239" dy="16.556">이 논쟁이 어려운 이유는 ‘측정의 문제’ 다.</tspan><tspan x="1239" dy="16.556"> </tspan><tspan x="1239" dy="16.556">‘의식되지 않았다’ 를 무엇으로 판정하는가. 본인이 ‘못 봤다’ 고 답한 것으로?</tspan><tspan x="1239" dy="16.556">그렇다면 12장의 신호탐지이론이 곧바로 걸린다 — ‘못 봤다’ 는 답은</tspan><tspan x="1239" dy="16.556">민감도가 0 이어서일 수도 있고 준거가 엄격해서일 수도 있다.</tspan><tspan x="1239" dy="16.556"> </tspan><tspan x="1239" dy="16.556">그래서 이 분야는 강제선택 과제, 확신도 보고, 여러 문턱을 함께 쓰는 절차를</tspan><tspan x="1239" dy="16.556">동원한다. 그리고 어떤 절차를 쓰느냐에 따라 결론이 갈린다</tspan></text><marker id="mk-d2-4292804615-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-4292804615-3488378134)" d="M546.035 97.374C198.8 163.4 111.5 193.2 111.5 242" class="connection stroke-B1 s0" mask="url(#d2-4292804615)"/><path fill="none" marker-end="url(#mk-d2-4292804615-3488378134)" d="M603.192 118.856C500.2 167.6 474 193.2 474 242" class="connection stroke-B1 s0" mask="url(#d2-4292804615)"/><path fill="none" marker-end="url(#mk-d2-4292804615-3488378134)" d="M831.809 118.853C935.2 167.6 961.5 191.6 961.5 234" class="connection stroke-B1 s0" mask="url(#d2-4292804615)"/><path fill="none" marker-end="url(#mk-d2-4292804615-3488378134)" d="M898.98 91.284C1392.6 162.2 1516.5 190 1516.5 226" class="connection stroke-B1 s0" mask="url(#d2-4292804615)"/><marker id="mk-d2-4292804615-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-4292804615-2177206569)" d="M961.5 354c0 44.4 22.2 66 107.353 104.357" class="connection stroke-B2 s3" mask="url(#d2-4292804615)"/><path fill="none" marker-end="url(#mk-d2-4292804615-2177206569)" d="M1516.5 362c0 38-22.2 58-107.353 96.357" class="connection stroke-B2 s3" mask="url(#d2-4292804615)"/><mask id="d2-4292804615" width="1977" height="811" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1977v811H-101z"/></mask></svg>