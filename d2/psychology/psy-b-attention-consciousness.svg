<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1024" class="d2-3725130153 d2-svg" viewBox="-101 -101 1240 1024"><rect width="1240" height="1024" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3725130153 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3725130153 .fill-N1{fill:#0a0f25}.d2-3725130153 .fill-B5{fill:#edf0fd}.d2-3725130153 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="519" cy="65" class="shape stroke-B1" rx="195" ry="65" style="fill:#f7f8fe;stroke-width:2"/></g><text x="519" y="70.5" class="text-bold fill-N1 s0">주의를 준 것만 의식되는가</text></g><g ><g class="shape"><path d="M0 230h1038v322H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="519" y="263" class="fill-N1" style="text-anchor:middle;font-size:28px">네 칸 — 가로줄은 주의, 세로줄은 의식</text></g><text x="519" y="689" class="fill-N1 s0"><tspan x="519" dy="0"> </tspan><tspan x="519" dy="16.556">이 논쟁이 어려운 이유는 ‘측정의 문제’ 다.</tspan><tspan x="519" dy="16.556"> </tspan><tspan x="519" dy="16.556">‘의식되지 않았다’ 를 무엇으로 판정하는가. 본인이 ‘못 봤다’ 고 답한 것으로?</tspan><tspan x="519" dy="16.556">그렇다면 12장의 신호탐지이론이 곧바로 걸린다 — ‘못 봤다’ 는 답은</tspan><tspan x="519" dy="16.556">민감도가 0 이어서일 수도 있고 준거가 엄격해서일 수도 있다.</tspan><tspan x="519" dy="16.556"> </tspan><tspan x="519" dy="16.556">그래서 이 분야는 강제선택 과제, 확신도 보고, 여러 문턱을 함께 쓰는 절차를</tspan><tspan x="519" dy="16.556">동원한다. 그리고 어떤 절차를 쓰느냐에 따라 결론이 갈린다</tspan></text><g ><g class="shape"><path d="M16 276h517v114H16z" class="stroke-B1 fill-B5 s1"/></g><text x="274.5" y="322.5" class="text-bold fill-N1 s0"><tspan x="274.5" dy="0">주의 O · 의식 O</tspan><tspan x="274.5" dy="17.667">지금 읽고 있는 이 줄.</tspan><tspan x="274.5" dy="17.667">다툼 없음</tspan></text></g><g ><g class="shape"><path d="M549 276h473v114H549z" class="stroke-B1 fill-B5 s1"/></g><text x="785.5" y="314.5" class="text-bold fill-N1 s0"><tspan x="785.5" dy="0">주의 O · 의식 X</tspan><tspan x="785.5" dy="17.25">주의를 주었는데도 의식되지 않는 자극이 있는가.</tspan><tspan x="785.5" dy="17.25">아주 짧게 보이고 곧바로 가리면 보고되지 않는데,</tspan><tspan x="785.5" dy="17.25">그때 무엇까지 처리되는지가 다투어진다</tspan></text></g><g ><g class="shape"><path d="M16 406h517v130H16z" class="stroke-B1 fill-B5 s1"/></g><text x="274.5" y="444.5" class="text-bold fill-N1 s0"><tspan x="274.5" dy="0">주의 X · 의식 O</tspan><tspan x="274.5" dy="17">주의를 주지 않은 주변에 대해 ‘대충 무엇이 있는지’ 를</tspan><tspan x="274.5" dy="17">알고 있다는 느낌이 있는데, 그 느낌이 실제 표상인지</tspan><tspan x="274.5" dy="17">아니면 필요할 때 주의를 옮기면 알 수 있다는 데서 오는</tspan><tspan x="274.5" dy="17">착각인지가 다투어진다</tspan></text></g><g ><g class="shape"><path d="M549 406h473v130H549z" class="stroke-B1 fill-B5 s1"/></g><text x="785.5" y="460.5" class="text-bold fill-N1 s0"><tspan x="785.5" dy="0">주의 X · 의식 X</tspan><tspan x="785.5" dy="17.667">12장의 부주의맹과 변화맹이 이 칸이다.</tspan><tspan x="785.5" dy="17.667">다툼 없음</tspan></text></g><marker id="mk-d2-3725130153-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3725130153-3488378134)" d="M519 132v94" class="connection stroke-B1 s1" mask="url(#d2-3725130153)"/><marker id="mk-d2-3725130153-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3725130153-2177206569)" d="M519 553.5v116" class="connection" mask="url(#d2-3725130153)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><text x="519" y="618" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">다투어지는 두 칸(주의 O · 의식 X, 주의 X · 의식 O)에서</text><mask id="d2-3725130153" width="1240" height="1024" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1240V923H-101z"/><path d="M307 602h424v21H307z"/></mask></svg>