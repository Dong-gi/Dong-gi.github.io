<svg xmlns="http://www.w3.org/2000/svg" width="2290" height="1116" class="d2-2506683342 d2-svg" viewBox="-81 -85 2290 1116"><rect width="2290" height="1116" x="-81" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2506683342 .fill-N1{fill:#0a0f25}.d2-2506683342 .fill-B4{fill:#e3e9fd}.d2-2506683342 .fill-B5{fill:#edf0fd}.d2-2506683342 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M44 56h587v458H44z" class="stroke-B1 fill-B4 s0"/></g><text x="337.5" y="43" class="fill-N1 s1">응답자 쪽에서 오는 것</text></g><g ><g class="shape"><path d="M20 600h635v284H20z" class="stroke-B1 fill-B4 s0"/></g><text x="337.5" y="587" class="fill-N1 s1">상황과 연구자 쪽에서 오는 것</text></g><g ><g class="shape"><path d="M795 113h641v817H795z" class="stroke-B1 fill-B4 s0"/></g><text x="1115.5" y="100" class="fill-N1 s1">무엇으로 막는가</text></g><text x="1832" y="508" class="fill-N1 s2"><tspan x="1832" dy="0"> </tspan><tspan x="1832" dy="17.25">어느 것도 없애지 못하고 줄일 뿐이다. 그래서 자기보고로 잰 값과</tspan><tspan x="1832" dy="17.25">행동으로 잰 값이 어긋날 때, 어느 쪽이 틀렸다고 곧장 말할 수 없다.</tspan><tspan x="1832" dy="17.25">둘이 서로 다른 것을 재고 있을 가능성이 늘 있다</tspan></text><g ><g class="shape"><path d="M93 86h489v98H93z" class="stroke-B1 fill-B5 s0"/></g><text x="337.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="337.5" dy="0">사회적 바람직성</tspan><tspan x="337.5" dy="17.667">좋게 보이는 쪽으로 답한다.</tspan><tspan x="337.5" dy="17.667">투표했는지, 얼마나 운동하는지 같은 문항에서 크다</tspan></text></g><g ><g class="shape"><path d="M137 244h402v82H137z" class="stroke-B1 fill-B5 s0"/></g><text x="338" y="282.5" class="text-bold fill-N1 s2"><tspan x="338" dy="0">묵종 경향</tspan><tspan x="338" dy="18.5">내용과 상관없이 ‘그렇다’ 쪽으로 답한다</tspan></text></g><g ><g class="shape"><path d="M74 386h527v98H74z" class="stroke-B1 fill-B5 s0"/></g><text x="337.5" y="424.5" class="text-bold fill-N1 s2"><tspan x="337.5" dy="0">반응 양식</tspan><tspan x="337.5" dy="17.667">어떤 사람은 늘 양 끝을, 어떤 사람은 늘 가운데를 고른다.</tspan><tspan x="337.5" dy="17.667">집단끼리 이 양식이 다르면 비교가 깨진다</tspan></text></g><g ><g class="shape"><path d="M104 630h467v82H104z" class="stroke-B1 fill-B5 s0"/></g><text x="337.5" y="668.5" class="text-bold fill-N1 s2"><tspan x="337.5" dy="0">요구특성</tspan><tspan x="337.5" dy="18.5">연구가 무엇을 바라는지 눈치채고 거기 맞춰 준다</tspan></text></g><g ><g class="shape"><path d="M50 772h575v82H50z" class="stroke-B1 fill-B5 s0"/></g><text x="337.5" y="810.5" class="text-bold fill-N1 s2"><tspan x="337.5" dy="0">문항 표현과 순서</tspan><tspan x="337.5" dy="18.5">같은 것을 묻는데 낱말과 순서만 바꿔도 답의 분포가 달라진다</tspan></text></g><g ><g class="shape"><path d="M919 143h394v66H919z" class="stroke-B1 fill-B5 s0"/></g><text x="1116" y="181.5" class="text-bold fill-N1 s2">역채점 문항을 섞는다 — 묵종을 잡아낸다</text></g><g ><g class="shape"><path d="M875 269h482v66H875z" class="stroke-B1 fill-B5 s0"/></g><text x="1116" y="307.5" class="text-bold fill-N1 s2">익명 보장과 응답 방식 — 사회적 바람직성을 줄인다</text></g><g ><g class="shape"><path d="M866 493h499v66H866z" class="stroke-B1 fill-B5 s0"/></g><text x="1115.5" y="531.5" class="text-bold fill-N1 s2">가설을 감추고 조건을 은폐한다 — 요구특성을 줄인다</text></g><g ><g class="shape"><path d="M837 708h557v66H837z" class="stroke-B1 fill-B5 s0"/></g><text x="1115.5" y="746.5" class="text-bold fill-N1 s2">자기보고 말고 다른 지표를 함께 잰다 — 행동 기록, 타인 평정</text></g><g ><g class="shape"><path d="M825 834h581v66H825z" class="stroke-B1 fill-B5 s0"/></g><text x="1115.5" y="872.5" class="text-bold fill-N1 s2">문항과 채점 규칙을 자료 보기 전에 못 박는다 — 6장의 사전등록</text></g><marker id="mk-d2-2506683342-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2506683342-3488378134)" d="M633 285h158" class="connection stroke-B1 s0" mask="url(#d2-2506683342)"/><path fill="none" marker-end="url(#mk-d2-2506683342-3488378134)" d="M657 813h134" class="connection stroke-B1 s0" mask="url(#d2-2506683342)"/><marker id="mk-d2-2506683342-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2506683342-2177206569)" d="M1438 526h114" class="connection" mask="url(#d2-2506683342)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-2506683342" width="2290" height="1116" x="-81" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-81-85h2290v1116H-81z"/></mask></svg>