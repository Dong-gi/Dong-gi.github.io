<svg xmlns="http://www.w3.org/2000/svg" width="1238" height="1143" class="d2-4038673306 d2-svg" viewBox="-101 -101 1238 1143"><rect width="1238" height="1143" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4038673306 .fill-N1{fill:#0a0f25}.d2-4038673306 .fill-B5{fill:#edf0fd}.d2-4038673306 .fill-B6{fill:#f7f8fe}.d2-4038673306 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:24px}.s3{fill:#0d32b2}</style><path fill="transparent" stroke="transparent" d="M0 0h1036v828H0z" class="shape s0"/><text x="276" y="904" class="fill-N1 s1"><tspan x="276" dy="0">어느 것도 없애지 못하고 줄일 뿐이다. 그래서 자기보고로 잰 값과</tspan><tspan x="276" dy="17.667">행동으로 잰 값이 어긋날 때, 어느 쪽이 틀렸다고 곧장 말할 수 없다.</tspan><tspan x="276" dy="17.667">둘이 서로 다른 것을 재고 있을 가능성이 늘 있다</tspan></text><g ><g class="shape"><path d="M30 30h451v423H30z" class="stroke-B1 fill-B5 s0"/></g><text x="255.5" y="59" class="fill-N1 s2">응답자 쪽에서 오는 것</text></g><g ><g class="shape"><path d="M40 513h431v285H40z" class="stroke-B1 fill-B5 s0"/></g><text x="255.5" y="542" class="fill-N1 s2">상황과 연구자 쪽에서 오는 것</text></g><g ><g class="shape"><path d="M581 155h425v587H581z" class="stroke-B1 fill-B5 s0"/></g><text x="793.5" y="184" class="fill-N1 s2">무엇으로 막는가</text></g><g ><g class="shape"><path d="M54 71h403v114H54z" class="stroke-B1 fill-B6 s0"/></g><text x="255.5" y="109.5" class="text-bold fill-N1 s1"><tspan x="255.5" dy="0">사회적 바람직성</tspan><tspan x="255.5" dy="17.25">좋게 보이는 쪽으로 답한다.</tspan><tspan x="255.5" dy="17.25">투표했는지, 얼마나 운동하는지 같은</tspan><tspan x="255.5" dy="17.25">문항에서 크다</tspan></text></g><g ><g class="shape"><path d="M54 209h403v82H54z" class="stroke-B1 fill-B6 s0"/></g><text x="255.5" y="247.5" class="text-bold fill-N1 s1"><tspan x="255.5" dy="0">묵종 경향</tspan><tspan x="255.5" dy="18.5">내용과 상관없이 ‘그렇다’ 쪽으로 답한다</tspan></text></g><g ><g class="shape"><path d="M54 315h403v114H54z" class="stroke-B1 fill-B6 s0"/></g><text x="255.5" y="353.5" class="text-bold fill-N1 s1"><tspan x="255.5" dy="0">반응 양식</tspan><tspan x="255.5" dy="17.25">어떤 사람은 늘 양 끝을,</tspan><tspan x="255.5" dy="17.25">어떤 사람은 늘 가운데를 고른다.</tspan><tspan x="255.5" dy="17.25">집단끼리 이 양식이 다르면 비교가 깨진다</tspan></text></g><g ><g class="shape"><path d="M64 554h383v98H64z" class="stroke-B1 fill-B6 s0"/></g><text x="255.5" y="592.5" class="text-bold fill-N1 s1"><tspan x="255.5" dy="0">요구특성</tspan><tspan x="255.5" dy="17.667">연구가 무엇을 바라는지 눈치채고</tspan><tspan x="255.5" dy="17.667">거기 맞춰 준다</tspan></text></g><g ><g class="shape"><path d="M64 676h383v98H64z" class="stroke-B1 fill-B6 s0"/></g><text x="255.5" y="714.5" class="text-bold fill-N1 s1"><tspan x="255.5" dy="0">문항 표현과 순서</tspan><tspan x="255.5" dy="17.667">같은 것을 묻는데 낱말과 순서만 바꿔도</tspan><tspan x="255.5" dy="17.667">답의 분포가 달라진다</tspan></text></g><g ><g class="shape"><path d="M605 196h377v82H605z" class="stroke-B1 fill-B6 s0"/></g><text x="793.5" y="234.5" class="text-bold fill-N1 s1"><tspan x="793.5" dy="0">역채점 문항을 섞는다 —</tspan><tspan x="793.5" dy="18.5">묵종을 잡아낸다</tspan></text></g><g ><g class="shape"><path d="M605 302h377v82H605z" class="stroke-B1 fill-B6 s0"/></g><text x="793.5" y="340.5" class="text-bold fill-N1 s1"><tspan x="793.5" dy="0">익명 보장과 응답 방식 —</tspan><tspan x="793.5" dy="18.5">사회적 바람직성을 줄인다</tspan></text></g><g ><g class="shape"><path d="M605 408h377v82H605z" class="stroke-B1 fill-B6 s0"/></g><text x="793.5" y="446.5" class="text-bold fill-N1 s1"><tspan x="793.5" dy="0">가설을 감추고 조건을 은폐한다 —</tspan><tspan x="793.5" dy="18.5">요구특성을 줄인다</tspan></text></g><g ><g class="shape"><path d="M605 514h377v82H605z" class="stroke-B1 fill-B6 s0"/></g><text x="793.5" y="552.5" class="text-bold fill-N1 s1"><tspan x="793.5" dy="0">자기보고 말고 다른 지표를 함께 잰다 —</tspan><tspan x="793.5" dy="18.5">행동 기록, 타인 평정</tspan></text></g><g ><g class="shape"><path d="M605 620h377v98H605z" class="stroke-B1 fill-B6 s0"/></g><text x="793.5" y="658.5" class="text-bold fill-N1 s1"><tspan x="793.5" dy="0">문항과 채점 규칙을</tspan><tspan x="793.5" dy="17.667">자료 보기 전에 못 박는다 —</tspan><tspan x="793.5" dy="17.667">6장의 사전등록</tspan></text></g><marker id="mk-d2-4038673306-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4038673306-3488378134)" d="M483 241.5c38 0 58 7.8 94.846 36.54" class="connection stroke-B1 s0" mask="url(#d2-4038673306)"/><path fill="none" marker-end="url(#mk-d2-4038673306-3488378134)" d="M473 655.5c46 0 68-7.8 104.846-36.54" class="connection stroke-B1 s0" mask="url(#d2-4038673306)"/><marker id="mk-d2-4038673306-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4038673306-2177206569)" d="m618.99 743.226-82.97 141.821" class="connection" mask="url(#d2-4038673306)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-4038673306" width="1238" height="1143" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1238v1143H-101z"/></mask></svg>