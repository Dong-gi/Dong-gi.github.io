<svg xmlns="http://www.w3.org/2000/svg" width="1427" height="1606" class="d2-938364016 d2-svg" viewBox="-101 -101 1427 1606"><rect width="1427" height="1606" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-938364016 .fill-N1{fill:#0a0f25}.d2-938364016 .fill-B4{fill:#e3e9fd}.d2-938364016 .fill-B5{fill:#edf0fd}.d2-938364016 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="545.5" cy="75" class="shape stroke-B1" rx="225.5" ry="75" style="fill:#f7f8fe;stroke-width:2"/></g><text x="545.5" y="72.5" class="text-bold fill-N1 s0"><tspan x="545.5" dy="0">언어 상대성 —</tspan><tspan x="545.5" dy="18.5">쓰는 언어가 생각에 영향을 준다</tspan></text></g><g ><g class="shape"><path d="M0 359h509v460H0z" class="stroke-B1 fill-B4 s1"/></g><text x="254.5" y="392" class="fill-N1 s2">강한 판본 — 언어 결정론</text></g><g ><g class="shape"><path d="M613 250h535v678H613z" class="stroke-B1 fill-B4 s1"/></g><text x="880.5" y="283" class="fill-N1 s2">약한 판본</text></g><g ><g class="shape"><path d="M224 1048h1001v356H224z" class="stroke-B1 fill-B4 s1"/></g><text x="724.5" y="1035" class="fill-N1 s2">정확히 적으면</text></g><g ><g class="shape"><path d="M40 405h429v98H40z" class="stroke-B1 fill-B5 s1"/></g><text x="254.5" y="443.5" class="text-bold fill-N1 s0"><tspan x="254.5" dy="0">주장 — 언어가 사고를 결정한다.</tspan><tspan x="254.5" dy="17.667">언어에 구별이 없으면</tspan><tspan x="254.5" dy="17.667">그 구별을 생각할 수 없다</tspan></text></g><g ><g class="shape"><path d="M40 543h429v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="254.5" y="581.5" class="text-bold fill-N1 s0">판정 — 지지되지 않는다</text></g><g ><g class="shape"><path d="M40 649h429v130H40z" class="stroke-B1 fill-B5 s1"/></g><text x="254.5" y="687.5" class="text-bold fill-N1 s0"><tspan x="254.5" dy="0">왜 — 낱말이 없는 구별도 배울 수 있고,</tspan><tspan x="254.5" dy="17">필요하면 새 낱말을 만들거나 풀어서 말한다.</tspan><tspan x="254.5" dy="17">말을 배우기 전의 아기와</tspan><tspan x="254.5" dy="17">말이 없는 동물도 범주를 만든다.</tspan><tspan x="254.5" dy="17">번역이 어려울 수는 있어도 불가능하지 않다</tspan></text></g><g ><g class="shape"><path d="M653 296h455v98H653z" class="stroke-B1 fill-B5 s1"/></g><text x="880.5" y="334.5" class="text-bold fill-N1 s0"><tspan x="880.5" dy="0">주장 — 언어가 어떤 과제를</tspan><tspan x="880.5" dy="17.667">어떻게 푸는지에 영향을 준다.</tspan><tspan x="880.5" dy="17.667">언어가 준 구별이 그 과제에서 도구로 쓰인다</tspan></text></g><g ><g class="shape"><path d="M653 434h455v82H653z" class="stroke-B1 fill-B5 s1"/></g><text x="880.5" y="472.5" class="text-bold fill-N1 s0"><tspan x="880.5" dy="0">판정 — 일부 지지된다.</tspan><tspan x="880.5" dy="18.5">다만 효과는 대개 작고 조건이 붙는다</tspan></text></g><g ><g class="shape"><path d="M653 556h455v178H653z" class="stroke-B1 fill-B5 s1"/></g><text x="880.5" y="594.5" class="text-bold fill-N1 s0"><tspan x="880.5" dy="0">지지하는 결과 —</tspan><tspan x="880.5" dy="16.625">색을 두 이름으로 갈라 부르는 언어의 화자가</tspan><tspan x="880.5" dy="16.625">그 경계를 넘는 색 짝을</tspan><tspan x="880.5" dy="16.625">조금 더 빨리 가려낸다는 보고.</tspan><tspan x="880.5" dy="16.625">방향을 늘 동서남북으로 말하는 언어의 화자가</tspan><tspan x="880.5" dy="16.625">방향 과제를 다르게 푼다는 보고.</tspan><tspan x="880.5" dy="16.625">정확한 수 낱말이 없는 언어에서</tspan><tspan x="880.5" dy="16.625">큰 수의 정확한 대응 과제가 어려워진다는 보고</tspan></text></g><g ><g class="shape"><path d="M653 774h455v114H653z" class="stroke-B1 fill-B5 s1"/></g><text x="880.5" y="812.5" class="text-bold fill-N1 s0"><tspan x="880.5" dy="0">결정적인 단서 — 그런 이점은</tspan><tspan x="880.5" dy="17.25">말로 하는 일을 함께 시켜 막으면 대개 사라진다.</tspan><tspan x="880.5" dy="17.25">이것은 언어가 사고 자체를 바꾼 것이 아니라</tspan><tspan x="880.5" dy="17.25">‘과제를 푸는 도구로 쓰였다’ 는 쪽을 가리킨다</tspan></text></g><g ><g class="shape"><path d="M350 1078h391v98H350z" class="stroke-B1 fill-B5 s1"/></g><text x="545.5" y="1116.5" class="text-bold fill-N1 s0"><tspan x="545.5" dy="0">말할 수 있는 것 — ‘언어가 어떤 과제에서</tspan><tspan x="545.5" dy="17.667">무엇을 쓰기 쉽게 만든다.’</tspan><tspan x="545.5" dy="17.667">효과는 작고, 과제와 조건에 딸려 있다</tspan></text></g><g ><g class="shape"><path d="M801 1078h395v98H801z" class="stroke-B1 fill-B5 s1"/></g><text x="998.5" y="1116.5" class="text-bold fill-N1 s0"><tspan x="998.5" dy="0">말할 수 없는 것 — ‘그 언어를 쓰는 사람은</tspan><tspan x="998.5" dy="17.667">그렇게 생각할 수밖에 없다.’</tspan><tspan x="998.5" dy="17.667">이것은 자료가 지지하지 않는다</tspan></text></g><g ><g class="shape"><path d="M527 1276h490v98H527z" class="stroke-B1 fill-B5 s1"/></g><text x="772" y="1314.5" class="text-bold fill-N1 s0"><tspan x="772" dy="0">그리고 이 논쟁은 진행 중이다.</tspan><tspan x="772" dy="17.667">어느 결과가 어디까지 버티는지는 항목마다 다르고,</tspan><tspan x="772" dy="17.667">문법적 성처럼 결과가 갈리는 자리도 있다</tspan></text></g><marker id="mk-d2-938364016-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M254.5 505v34" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M254.5 611v34" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M880.5 396v34" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M880.5 518v34" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M880.5 736v34" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M405.165 134.794C285 186.8 254.5 231.8 254.5 355" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M697.874 131.7C843.8 186.2 880.75 210 880.75 246" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M545.5 1178c0 38 22.8 58 110.337 96.393" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M998.5 1178c0 38-22.8 58-110.337 96.393" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M254.5 821v223" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><path fill="none" marker-end="url(#mk-d2-938364016-3488378134)" d="M880.75 930v114" class="connection stroke-B1 s1" mask="url(#d2-938364016)"/><mask id="d2-938364016" width="1427" height="1606" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1427v1606H-101z"/></mask></svg>