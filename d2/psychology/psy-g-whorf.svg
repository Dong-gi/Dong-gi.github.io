<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1558" class="d2-1134336216 d2-svg" viewBox="-101 -101 1080 1558"><rect width="1080" height="1558" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1134336216 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1134336216 .fill-N1{fill:#0a0f25}.d2-1134336216 .fill-B4{fill:#e3e9fd}.d2-1134336216 .fill-B5{fill:#edf0fd}.d2-1134336216 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="439.5" cy="75" class="shape stroke-B1" rx="225.5" ry="75" style="fill:#f7f8fe;stroke-width:2"/></g><text x="439.5" y="72.5" class="text-bold fill-N1 s0"><tspan x="439.5" dy="0">언어 상대성 —</tspan><tspan x="439.5" dy="18.5">쓰는 언어가 생각에 영향을 준다</tspan></text></g><g ><g class="shape"><path d="M44 369h363v504H44z" class="stroke-B1 fill-B4 s1"/></g><text x="225.5" y="402" class="fill-N1 s2"><tspan x="225.5" dy="0">강한 판본 —</tspan><tspan x="225.5" dy="32">언어 결정론</tspan></text></g><g ><g class="shape"><path d="M467 250h372v742H467z" class="stroke-B1 fill-B4 s1"/></g><text x="653" y="283" class="fill-N1 s2">약한 판본</text></g><g ><g class="shape"><path d="M0 1092h878v264H0z" class="stroke-B1 fill-B4 s1"/></g><text x="439" y="1125" class="fill-N1 s2">정확히 적으면</text></g><g ><g class="shape"><path d="M68 443h315v98H68z" class="stroke-B1 fill-B5 s1"/></g><text x="225.5" y="481.5" class="text-bold fill-N1 s0"><tspan x="225.5" dy="0">주장 — 언어가 사고를 결정한다.</tspan><tspan x="225.5" dy="17.667">언어에 구별이 없으면</tspan><tspan x="225.5" dy="17.667">그 구별을 생각할 수 없다</tspan></text></g><g ><g class="shape"><path d="M68 565h315v66H68z" class="stroke-B1 fill-B5 s1"/></g><text x="225.5" y="603.5" class="text-bold fill-N1 s0">판정 — 지지되지 않는다</text></g><g ><g class="shape"><path d="M68 655h315v194H68z" class="stroke-B1 fill-B5 s1"/></g><text x="225.5" y="693.5" class="text-bold fill-N1 s0"><tspan x="225.5" dy="0">왜 — 낱말이 없는 구별도</tspan><tspan x="225.5" dy="16.556">배울 수 있고,</tspan><tspan x="225.5" dy="16.556">필요하면 새 낱말을 만들거나</tspan><tspan x="225.5" dy="16.556">풀어서 말한다.</tspan><tspan x="225.5" dy="16.556">말을 배우기 전의 아기와</tspan><tspan x="225.5" dy="16.556">말이 없는 동물도</tspan><tspan x="225.5" dy="16.556">범주를 만든다.</tspan><tspan x="225.5" dy="16.556">번역이 어려울 수는 있어도</tspan><tspan x="225.5" dy="16.556">불가능하지 않다</tspan></text></g><g ><g class="shape"><path d="M491 296h324v114H491z" class="stroke-B1 fill-B5 s1"/></g><text x="653" y="334.5" class="text-bold fill-N1 s0"><tspan x="653" dy="0">주장 — 언어가 어떤 과제를</tspan><tspan x="653" dy="17.25">어떻게 푸는지에 영향을 준다.</tspan><tspan x="653" dy="17.25">언어가 준 구별이</tspan><tspan x="653" dy="17.25">그 과제에서 도구로 쓰인다</tspan></text></g><g ><g class="shape"><path d="M491 434h324v98H491z" class="stroke-B1 fill-B5 s1"/></g><text x="653" y="472.5" class="text-bold fill-N1 s0"><tspan x="653" dy="0">판정 — 일부 지지된다.</tspan><tspan x="653" dy="17.667">다만 효과는 대개 작고</tspan><tspan x="653" dy="17.667">조건이 붙는다</tspan></text></g><g ><g class="shape"><path d="M491 556h324v226H491z" class="stroke-B1 fill-B5 s1"/></g><text x="653" y="594.5" class="text-bold fill-N1 s0"><tspan x="653" dy="0">지지하는 결과 —</tspan><tspan x="653" dy="16.455">색을 두 이름으로 갈라 부르는</tspan><tspan x="653" dy="16.455">언어의 화자가</tspan><tspan x="653" dy="16.455">그 경계를 넘는 색 짝을</tspan><tspan x="653" dy="16.455">조금 더 빨리 가려낸다는 보고.</tspan><tspan x="653" dy="16.455">방향을 늘 동서남북으로 말하는</tspan><tspan x="653" dy="16.455">언어의 화자가</tspan><tspan x="653" dy="16.455">방향 과제를 다르게 푼다는 보고.</tspan><tspan x="653" dy="16.455">정확한 수 낱말이 없는 언어에서</tspan><tspan x="653" dy="16.455">큰 수의 정확한 대응 과제가</tspan><tspan x="653" dy="16.455">어려워진다는 보고</tspan></text></g><g ><g class="shape"><path d="M491 806h324v162H491z" class="stroke-B1 fill-B5 s1"/></g><text x="653" y="844.5" class="text-bold fill-N1 s0"><tspan x="653" dy="0">결정적인 단서 — 그런 이점은</tspan><tspan x="653" dy="16.714">말로 하는 일을 함께 시켜 막으면</tspan><tspan x="653" dy="16.714">대개 사라진다.</tspan><tspan x="653" dy="16.714">이것은 언어가 사고 자체를</tspan><tspan x="653" dy="16.714">바꾼 것이 아니라</tspan><tspan x="653" dy="16.714">‘과제를 푸는 도구로 쓰였다’ 는</tspan><tspan x="653" dy="16.714">쪽을 가리킨다</tspan></text></g><g ><g class="shape"><path d="M40 1138h243v178H40z" class="stroke-B1 fill-B5 s1"/></g><text x="161.5" y="1184.5" class="text-bold fill-N1 s0"><tspan x="161.5" dy="0">말할 수 있는 것 —</tspan><tspan x="161.5" dy="16.714">‘언어가 어떤 과제에서</tspan><tspan x="161.5" dy="16.714">무엇을 쓰기 쉽게</tspan><tspan x="161.5" dy="16.714">만든다.’</tspan><tspan x="161.5" dy="16.714">효과는 작고,</tspan><tspan x="161.5" dy="16.714">과제와 조건에</tspan><tspan x="161.5" dy="16.714">딸려 있다</tspan></text></g><g ><g class="shape"><path d="M323 1138h229v178H323z" class="stroke-B1 fill-B5 s1"/></g><text x="437.5" y="1176.5" class="text-bold fill-N1 s0"><tspan x="437.5" dy="0">그리고 이 논쟁은</tspan><tspan x="437.5" dy="16.625">진행 중이다.</tspan><tspan x="437.5" dy="16.625">어느 결과가</tspan><tspan x="437.5" dy="16.625">어디까지 버티는지는</tspan><tspan x="437.5" dy="16.625">항목마다 다르고,</tspan><tspan x="437.5" dy="16.625">문법적 성처럼</tspan><tspan x="437.5" dy="16.625">결과가 갈리는</tspan><tspan x="437.5" dy="16.625">자리도 있다</tspan></text></g><g ><g class="shape"><path d="M592 1138h246v178H592z" class="stroke-B1 fill-B5 s1"/></g><text x="715" y="1192.5" class="text-bold fill-N1 s0"><tspan x="715" dy="0">말할 수 없는 것 —</tspan><tspan x="715" dy="16.833">‘그 언어를 쓰는 사람은</tspan><tspan x="715" dy="16.833">그렇게 생각할 수밖에</tspan><tspan x="715" dy="16.833">없다.’</tspan><tspan x="715" dy="16.833">이것은 자료가</tspan><tspan x="715" dy="16.833">지지하지 않는다</tspan></text></g><marker id="mk-d2-1134336216-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M225.5 543v18" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M225.5 633v18" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M653 412v18" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M653 534v18" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M653 784v18" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M326.273 141.009C245.8 188 225.25 233.8 225.25 365" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M551.727 141.009C632.2 188 652.75 210 652.75 246" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M284.5 1227h35" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M590.5 1227h-35" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M225.25 875c0 133.2 11.8 177 55.948 214.414" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><path fill="none" marker-end="url(#mk-d2-1134336216-3488378134)" d="M652.75 994c0 38-11.8 58-55.948 95.414" class="connection stroke-B1 s1" mask="url(#d2-1134336216)"/><mask id="d2-1134336216" width="1080" height="1558" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H979v1558H-101z"/></mask></svg>