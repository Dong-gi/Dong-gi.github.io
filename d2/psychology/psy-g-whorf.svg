<svg xmlns="http://www.w3.org/2000/svg" width="2102" height="1780" class="d2-123955753 d2-svg" viewBox="-91 -101 2102 1780"><rect width="2102" height="1780" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-123955753 .fill-N1{fill:#0a0f25}.d2-123955753 .fill-B4{fill:#e3e9fd}.d2-123955753 .fill-B5{fill:#edf0fd}.d2-123955753 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="864" cy="104" class="shape stroke-B1" rx="312" ry="104" style="fill:#f7f8fe;stroke-width:2"/></g><text x="864" y="109.5" class="text-bold fill-N1 s0">언어 상대성 — 쓰는 언어가 생각에 영향을 준다</text></g><g ><g class="shape"><path d="M10 560h813v554H10z" class="stroke-B1 fill-B4 s1"/></g><text x="416.5" y="547" class="fill-N1 s2">강한 판본 — 언어 결정론</text></g><g ><g class="shape"><path d="M863 328h896v778H863z" class="stroke-B1 fill-B4 s1"/></g><text x="1311" y="315" class="fill-N1 s2">약한 판본</text></g><g ><g class="shape"><path d="M386 1254h1524v324H386z" class="stroke-B1 fill-B4 s1"/></g><text x="1148" y="1241" class="fill-N1 s2">정확히 적으면</text></g><g ><g class="shape"><path d="M192 590h450v82H192z" class="stroke-B1 fill-B5 s1"/></g><text x="417" y="628.5" class="text-bold fill-N1 s0"><tspan x="417" dy="0">주장 — 언어가 사고를 결정한다.</tspan><tspan x="417" dy="18.5">언어에 구별이 없으면 그 구별을 생각할 수 없다</tspan></text></g><g ><g class="shape"><path d="M294 796h246v66H294z" class="stroke-B1 fill-B5 s1"/></g><text x="417" y="834.5" class="text-bold fill-N1 s0">판정 — 지지되지 않는다</text></g><g ><g class="shape"><path d="M40 986h753v98H40z" class="stroke-B1 fill-B5 s1"/></g><text x="416.5" y="1024.5" class="text-bold fill-N1 s0"><tspan x="416.5" dy="0">왜 — 낱말이 없는 구별도 배울 수 있고, 필요하면 새 낱말을 만들거나 풀어서 말한다.</tspan><tspan x="416.5" dy="17.667">말을 배우기 전의 아기와 말이 없는 동물도 범주를 만든다.</tspan><tspan x="416.5" dy="17.667">번역이 어려울 수는 있어도 불가능하지 않다</tspan></text></g><g ><g class="shape"><path d="M1046 358h530v82h-530z" class="stroke-B1 fill-B5 s1"/></g><text x="1311" y="396.5" class="text-bold fill-N1 s0"><tspan x="1311" dy="0">주장 — 언어가 어떤 과제를 어떻게 푸는지에 영향을 준다.</tspan><tspan x="1311" dy="18.5">언어가 준 구별이 그 과제에서 도구로 쓰인다</tspan></text></g><g ><g class="shape"><path d="M1034 598h554v66h-554z" class="stroke-B1 fill-B5 s1"/></g><text x="1311" y="636.5" class="text-bold fill-N1 s0">판정 — 일부 지지된다. 다만 효과는 대개 작고 조건이 붙는다</text></g><g ><g class="shape"><path d="M947 772h728v114H947z" class="stroke-B1 fill-B5 s1"/></g><text x="1311" y="810.5" class="text-bold fill-N1 s0"><tspan x="1311" dy="0">지지하는 결과 — 색을 두 이름으로 갈라 부르는 언어의 화자가</tspan><tspan x="1311" dy="17.25">그 경계를 넘는 색 짝을 조금 더 빨리 가려낸다는 보고.</tspan><tspan x="1311" dy="17.25">방향을 늘 동서남북으로 말하는 언어의 화자가 방향 과제를 다르게 푼다는 보고.</tspan><tspan x="1311" dy="17.25">정확한 수 낱말이 없는 언어에서 큰 수의 정확한 대응 과제가 어려워진다는 보고</tspan></text></g><g ><g class="shape"><path d="M893 994h836v82H893z" class="stroke-B1 fill-B5 s1"/></g><text x="1311" y="1032.5" class="text-bold fill-N1 s0"><tspan x="1311" dy="0">결정적인 단서 — 그런 이점은 말로 하는 일을 함께 시켜 막으면 대개 사라진다.</tspan><tspan x="1311" dy="18.5">이것은 언어가 사고 자체를 바꾼 것이 아니라 ‘과제를 푸는 도구로 쓰였다’ 는 쪽을 가리킨다</tspan></text></g><g ><g class="shape"><path d="M553 1284h622v82H553z" class="stroke-B1 fill-B5 s1"/></g><text x="864" y="1322.5" class="text-bold fill-N1 s0"><tspan x="864" dy="0">말할 수 있는 것 — ‘언어가 어떤 과제에서 무엇을 쓰기 쉽게 만든다.’</tspan><tspan x="864" dy="18.5">효과는 작고, 과제와 조건에 딸려 있다</tspan></text></g><g ><g class="shape"><path d="M1235 1284h646v82h-646z" class="stroke-B1 fill-B5 s1"/></g><text x="1558" y="1322.5" class="text-bold fill-N1 s0"><tspan x="1558" dy="0">말할 수 없는 것 — ‘그 언어를 쓰는 사람은 그렇게 생각할 수밖에 없다.’</tspan><tspan x="1558" dy="18.5">이것은 자료가 지지하지 않는다</tspan></text></g><g ><g class="shape"><path d="M834 1466h754v82H834z" class="stroke-B1 fill-B5 s1"/></g><text x="1211" y="1504.5" class="text-bold fill-N1 s0"><tspan x="1211" dy="0">그리고 이 논쟁은 진행 중이다. 어느 결과가 어디까지 버티는지는 항목마다 다르고,</tspan><tspan x="1211" dy="18.5">문법적 성처럼 결과가 갈리는 자리도 있다</tspan></text></g><marker id="mk-d2-123955753-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M416.5 674v118" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M416.5 864v118" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M1311 442v152" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M1311 666v102" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M1311 888v102" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M645.108 179.648C462.6 242.2 416.5 268 416.5 283v232" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M1082.892 179.65C1265 242.2 1311 263.8 1311 283" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M863.75 1368c0 38 38.2 58 187.13 96.987" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M1557.75 1368c0 38-38.2 58-187.13 96.987" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M416.5 1116v134" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><path fill="none" marker-end="url(#mk-d2-123955753-3488378134)" d="M1311 1108v142" class="connection stroke-B1 s1" mask="url(#d2-123955753)"/><mask id="d2-123955753" width="2102" height="1780" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h2102v1780H-91z"/></mask></svg>