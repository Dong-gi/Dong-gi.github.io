<svg xmlns="http://www.w3.org/2000/svg" width="4025" height="1016" class="d2-1312087652 d2-svg" viewBox="-81 -85 4025 1016"><rect width="4025" height="1016" x="-81" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1312087652 .fill-N1{fill:#0a0f25}.d2-1312087652 .fill-B4{fill:#e3e9fd}.d2-1312087652 .fill-B5{fill:#edf0fd}.d2-1312087652 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M20 464h1487v308H20z" class="stroke-B1 fill-B4 s0"/></g><text x="763.5" y="451" class="fill-N1 s1">역사 — 어디까지 갔었나</text></g><g ><g class="shape"><path d="M1647 284h675v284h-675z" class="stroke-B1 fill-B4 s0"/></g><text x="1984.5" y="271" class="fill-N1 s1">여기서 배울 것</text></g><g ><g class="shape"><path d="M2462 56h731v774h-731z" class="stroke-B1 fill-B4 s0"/></g><text x="2827.5" y="43" class="fill-N1 s1">지금 자주 일어나는 오용</text></g><text x="3578" y="433" class="fill-N1 s2"><tspan x="3578" dy="0"> </tspan><tspan x="3578" dy="17.25">검사를 쓰는 자리에서 물어야 할 것 —</tspan><tspan x="3578" dy="17.25">이 점수가 무엇과 관련 있다는 증거가 있는가 · 오차가 얼마인가 ·</tspan><tspan x="3578" dy="17.25">어느 집단에서 만들어졌는가 · 이 결정에 이 점수만 쓰는가</tspan></text><g ><g class="shape"><path d="M50 494h646v98H50z" class="stroke-B1 fill-B5 s0"/></g><text x="373" y="532.5" class="text-bold fill-N1 s2"><tspan x="373" dy="0">20세기 초, 지능 검사 점수가 이민을 제한하는 정책 논의에 인용되었다.</tspan><tspan x="373" dy="17.667">검사는 영어와 그 나라 생활에 대한 지식을 요구했고,</tspan><tspan x="373" dy="17.667">갓 도착한 사람들의 낮은 점수가 ‘타고난 능력’ 의 증거로 읽혔다</tspan></text></g><g ><g class="shape"><path d="M796 502h681v82H796z" class="stroke-B1 fill-B5 s0"/></g><text x="1136.5" y="540.5" class="text-bold fill-N1 s2"><tspan x="1136.5" dy="0">여러 주에 강제 불임 법이 있었고 1927년 미국 연방대법원이 이를 인정했다.</tspan><tspan x="1136.5" dy="18.5">검사 점수와 ‘정신 능력’ 판정이 그 판단에 쓰였다</tspan></text></g><g ><g class="shape"><path d="M807 644h659v98H807z" class="stroke-B1 fill-B5 s0"/></g><text x="1136.5" y="682.5" class="text-bold fill-N1 s2"><tspan x="1136.5" dy="0">검사를 만든 사람들 가운데 일부는 이런 쓰임에 반대했다.</tspan><tspan x="1136.5" dy="17.667">비네는 이 검사를 학교에서 도움이 필요한 아이를 찾는 도구로 만들었고</tspan><tspan x="1136.5" dy="17.667">타고난 능력의 등급으로 쓰는 것을 경계했다</tspan></text></g><g ><g class="shape"><path d="M1677 314h615v82h-615z" class="stroke-B1 fill-B5 s0"/></g><text x="1984.5" y="352.5" class="text-bold fill-N1 s2"><tspan x="1984.5" dy="0">타당도는 검사의 성질이 아니라 해석의 성질이다.</tspan><tspan x="1984.5" dy="18.5">같은 검사도 어떤 해석에는 타당하고 어떤 해석에는 타당하지 않다</tspan></text></g><g ><g class="shape"><path d="M1726 456h518v82h-518z" class="stroke-B1 fill-B5 s0"/></g><text x="1985" y="494.5" class="text-bold fill-N1 s2"><tspan x="1985" dy="0">그러므로 ‘이 검사가 좋은 검사인가’ 는 반쪽 물음이다.</tspan><tspan x="1985" dy="18.5">‘이 점수로 무엇을 하려 하는가’ 가 함께 와야 한다</tspan></text></g><g ><g class="shape"><path d="M2561 86h534v98h-534z" class="stroke-B1 fill-B5 s0"/></g><text x="2828" y="124.5" class="text-bold fill-N1 s2"><tspan x="2828" dy="0">준거 타당도 없이 거른다</tspan><tspan x="2828" dy="17.667">이 점수가 나중의 수행과 관련이 있는지 확인하지 않은 채</tspan><tspan x="2828" dy="17.667">채용이나 배치의 기준으로 쓴다</tspan></text></g><g ><g class="shape"><path d="M2492 244h671v98h-671z" class="stroke-B1 fill-B5 s0"/></g><text x="2827.5" y="282.5" class="text-bold fill-N1 s2"><tspan x="2827.5" dy="0">집단의 평균을 개인에게 붙인다</tspan><tspan x="2827.5" dy="17.667">두 집단의 평균이 다르다는 것에서 앞에 있는 이 사람에 대한 결론을 낸다.</tspan><tspan x="2827.5" dy="17.667">분포가 크게 겹치면 그 결론은 거의 언제나 틀린다</tspan></text></g><g ><g class="shape"><path d="M2580 402h496v98h-496z" class="stroke-B1 fill-B5 s0"/></g><text x="2828" y="440.5" class="text-bold fill-N1 s2"><tspan x="2828" dy="0">오차를 무시한 문턱</tspan><tspan x="2828" dy="17.667">한 점 차이로 자른다. 어떤 검사에도 오차가 있으므로</tspan><tspan x="2828" dy="17.667">문턱 근처의 판정은 다시 재면 뒤집힌다</tspan></text></g><g ><g class="shape"><path d="M2550 560h556v82h-556z" class="stroke-B1 fill-B5 s0"/></g><text x="2828" y="598.5" class="text-bold fill-N1 s2"><tspan x="2828" dy="0">연속된 점수를 유형으로 바꿔 쓴다</tspan><tspan x="2828" dy="18.5">사람에게 이름표가 붙고, 그 이름표가 배치와 기대를 정한다</tspan></text></g><g ><g class="shape"><path d="M2530 702h595v98h-595z" class="stroke-B1 fill-B5 s0"/></g><text x="2827.5" y="740.5" class="text-bold fill-N1 s2"><tspan x="2827.5" dy="0">문항이 요구하는 배경 지식</tspan><tspan x="2827.5" dy="17.667">특정 배경에서 자란 사람에게만 익숙한 것을 묻는 문항이 있으면</tspan><tspan x="2827.5" dy="17.667">그것이 재는 것에 섞인다</tspan></text></g><marker id="mk-d2-1312087652-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1312087652-3488378134)" d="M698 543h94" class="connection stroke-B1 s0" mask="url(#d2-1312087652)"/><path fill="none" marker-end="url(#mk-d2-1312087652-3488378134)" d="M1509 543h134" class="connection stroke-B1 s0" mask="url(#d2-1312087652)"/><path fill="none" marker-end="url(#mk-d2-1312087652-3488378134)" d="M2324 497h134" class="connection stroke-B1 s0" mask="url(#d2-1312087652)"/><marker id="mk-d2-1312087652-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1312087652-2177206569)" d="M3195 451h114" class="connection" mask="url(#d2-1312087652)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1312087652" width="4025" height="1016" x="-81" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-81-85h4025V931H-81z"/></mask></svg>