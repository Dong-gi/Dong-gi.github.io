<svg xmlns="http://www.w3.org/2000/svg" width="1247" height="1592" class="d2-3414343425 d2-svg" viewBox="-101 -101 1247 1592"><rect width="1247" height="1592" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3414343425 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3414343425 .fill-N1{fill:#0a0f25}.d2-3414343425 .fill-B4{fill:#e3e9fd}.d2-3414343425 .fill-B5{fill:#edf0fd}.d2-3414343425 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h403v620H0z" class="stroke-B1 fill-B4 s0"/></g><text x="201.5" y="33" class="fill-N1 s1">역사 — 어디까지 갔었나</text></g><g ><g class="shape"><path d="M473 0h572v620H473z" class="stroke-B1 fill-B4 s0"/></g><text x="759" y="33" class="fill-N1 s1">여기서 배울 것</text></g><text x="124" y="706" class="fill-N1 s2"><tspan x="124" dy="0"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192"> </tspan><tspan x="124" dy="16.192">검사를 쓰는 자리에서</tspan><tspan x="124" dy="16.192">물어야 할 것 —</tspan><tspan x="124" dy="16.192">이 점수가 무엇과 관련 있다는</tspan><tspan x="124" dy="16.192">증거가 있는가 ·</tspan><tspan x="124" dy="16.192">오차가 얼마인가 ·</tspan><tspan x="124" dy="16.192">어느 집단에서 만들어졌는가 ·</tspan><tspan x="124" dy="16.192">이 결정에 이 점수만 쓰는가</tspan></text><g ><g class="shape"><path d="M473 690h572v700H473z" class="stroke-B1 fill-B4 s0"/></g><text x="759" y="723" class="fill-N1 s1">지금 자주 일어나는 오용</text></g><g ><g class="shape"><path d="M40 46h323v162H40z" class="stroke-B1 fill-B5 s0"/></g><text x="201.5" y="84.5" class="text-bold fill-N1 s2"><tspan x="201.5" dy="0">20세기 초, 지능 검사 점수가</tspan><tspan x="201.5" dy="16.714">이민을 제한하는 정책 논의에</tspan><tspan x="201.5" dy="16.714">인용되었다. 검사는 영어와</tspan><tspan x="201.5" dy="16.714">그 나라 생활에 대한 지식을</tspan><tspan x="201.5" dy="16.714">요구했고, 갓 도착한 사람들의</tspan><tspan x="201.5" dy="16.714">낮은 점수가 ‘타고난 능력’ 의</tspan><tspan x="201.5" dy="16.714">증거로 읽혔다</tspan></text></g><g ><g class="shape"><path d="M40 248h323v130H40z" class="stroke-B1 fill-B5 s0"/></g><text x="201.5" y="286.5" class="text-bold fill-N1 s2"><tspan x="201.5" dy="0">여러 주에 강제 불임 법이 있었고</tspan><tspan x="201.5" dy="17">1927년 미국 연방대법원이</tspan><tspan x="201.5" dy="17">이를 인정했다. 검사 점수와</tspan><tspan x="201.5" dy="17">‘정신 능력’ 판정이</tspan><tspan x="201.5" dy="17">그 판단에 쓰였다</tspan></text></g><g ><g class="shape"><path d="M40 418h323v162H40z" class="stroke-B1 fill-B5 s0"/></g><text x="201.5" y="456.5" class="text-bold fill-N1 s2"><tspan x="201.5" dy="0">검사를 만든 사람들 가운데</tspan><tspan x="201.5" dy="16.714">일부는 이런 쓰임에 반대했다.</tspan><tspan x="201.5" dy="16.714">비네는 이 검사를 학교에서</tspan><tspan x="201.5" dy="16.714">도움이 필요한 아이를</tspan><tspan x="201.5" dy="16.714">찾는 도구로 만들었고</tspan><tspan x="201.5" dy="16.714">타고난 능력의 등급으로</tspan><tspan x="201.5" dy="16.714">쓰는 것을 경계했다</tspan></text></g><g ><g class="shape"><path d="M533 60h252v162H533z" class="stroke-B1 fill-B5 s0"/></g><text x="659" y="98.5" class="text-bold fill-N1 s2"><tspan x="659" dy="0">타당도는</tspan><tspan x="659" dy="16.714">검사의 성질이 아니라</tspan><tspan x="659" dy="16.714">해석의 성질이다.</tspan><tspan x="659" dy="16.714">같은 검사도</tspan><tspan x="659" dy="16.714">어떤 해석에는 타당하고</tspan><tspan x="659" dy="16.714">어떤 해석에는</tspan><tspan x="659" dy="16.714">타당하지 않다</tspan></text></g><g ><g class="shape"><path d="M533 262h252v162H533z" class="stroke-B1 fill-B5 s0"/></g><text x="659" y="300.5" class="text-bold fill-N1 s2"><tspan x="659" dy="0">그러므로</tspan><tspan x="659" dy="16.714">‘이 검사가</tspan><tspan x="659" dy="16.714">좋은 검사인가’ 는</tspan><tspan x="659" dy="16.714">반쪽 물음이다.</tspan><tspan x="659" dy="16.714">‘이 점수로</tspan><tspan x="659" dy="16.714">무엇을 하려 하는가’ 가</tspan><tspan x="659" dy="16.714">함께 와야 한다</tspan></text></g><g ><g class="shape"><path d="M513 736h220v210H513z" class="stroke-B1 fill-B5 s0"/></g><text x="623" y="790.5" class="text-bold fill-N1 s2"><tspan x="623" dy="0">준거 타당도 없이</tspan><tspan x="623" dy="16.625">거른다</tspan><tspan x="623" dy="16.625">이 점수가</tspan><tspan x="623" dy="16.625">나중의 수행과</tspan><tspan x="623" dy="16.625">관련이 있는지</tspan><tspan x="623" dy="16.625">확인하지 않은 채</tspan><tspan x="623" dy="16.625">채용이나 배치의</tspan><tspan x="623" dy="16.625">기준으로 쓴다</tspan></text></g><g ><g class="shape"><path d="M773 736h232v210H773z" class="stroke-B1 fill-B5 s0"/></g><text x="889" y="774.5" class="text-bold fill-N1 s2"><tspan x="889" dy="0">집단의 평균을</tspan><tspan x="889" dy="16.5">개인에게 붙인다</tspan><tspan x="889" dy="16.5">두 집단의 평균이</tspan><tspan x="889" dy="16.5">다르다는 것에서</tspan><tspan x="889" dy="16.5">앞에 있는</tspan><tspan x="889" dy="16.5">이 사람에 대한</tspan><tspan x="889" dy="16.5">결론을 낸다.</tspan><tspan x="889" dy="16.5">분포가 크게 겹치면</tspan><tspan x="889" dy="16.5">그 결론은</tspan><tspan x="889" dy="16.5">거의 언제나 틀린다</tspan></text></g><g ><g class="shape"><path d="M513 986h220v146H513z" class="stroke-B1 fill-B5 s0"/></g><text x="623" y="1024.5" class="text-bold fill-N1 s2"><tspan x="623" dy="0">오차를 무시한 문턱</tspan><tspan x="623" dy="16.833">한 점 차이로 자른다.</tspan><tspan x="623" dy="16.833">어떤 검사에도</tspan><tspan x="623" dy="16.833">오차가 있으므로</tspan><tspan x="623" dy="16.833">문턱 근처의 판정은</tspan><tspan x="623" dy="16.833">다시 재면 뒤집힌다</tspan></text></g><g ><g class="shape"><path d="M773 986h232v146H773z" class="stroke-B1 fill-B5 s0"/></g><text x="889" y="1024.5" class="text-bold fill-N1 s2"><tspan x="889" dy="0">연속된 점수를</tspan><tspan x="889" dy="16.833">유형으로 바꿔 쓴다</tspan><tspan x="889" dy="16.833">사람에게</tspan><tspan x="889" dy="16.833">이름표가 붙고,</tspan><tspan x="889" dy="16.833">그 이름표가</tspan><tspan x="889" dy="16.833">배치와 기대를 정한다</tspan></text></g><g ><g class="shape"><path d="M513 1172h220v178H513z" class="stroke-B1 fill-B5 s0"/></g><text x="623" y="1210.5" class="text-bold fill-N1 s2"><tspan x="623" dy="0">문항이 요구하는</tspan><tspan x="623" dy="16.625">배경 지식</tspan><tspan x="623" dy="16.625">특정 배경에서 자란</tspan><tspan x="623" dy="16.625">사람에게만</tspan><tspan x="623" dy="16.625">익숙한 것을 묻는</tspan><tspan x="623" dy="16.625">문항이 있으면</tspan><tspan x="623" dy="16.625">그것이 재는 것에</tspan><tspan x="623" dy="16.625">섞인다</tspan></text></g><marker id="mk-d2-3414343425-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3414343425-3488378134)" d="M201.5 210v34" class="connection stroke-B1 s0" mask="url(#d2-3414343425)"/><path fill="none" marker-end="url(#mk-d2-3414343425-3488378134)" d="M405 310h64" class="connection stroke-B1 s0" mask="url(#d2-3414343425)"/><path fill="none" marker-end="url(#mk-d2-3414343425-3488378134)" d="M759 622v64" class="connection stroke-B1 s0" mask="url(#d2-3414343425)"/><marker id="mk-d2-3414343425-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3414343425-2177206569)" d="M471.5 1040h-65" class="connection" mask="url(#d2-3414343425)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3414343425" width="1247" height="1592" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1247v1592H-101z"/></mask></svg>