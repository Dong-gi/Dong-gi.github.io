<svg xmlns="http://www.w3.org/2000/svg" width="1623" height="1600" class="d2-1315786763 d2-svg" viewBox="-101 -101 1623 1600"><rect width="1623" height="1600" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1315786763 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1315786763 .fill-N1{fill:#0a0f25}.d2-1315786763 .fill-B4{fill:#e3e9fd}.d2-1315786763 .fill-B5{fill:#edf0fd}.d2-1315786763 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 0h636v542H0z" class="stroke-B1 fill-B4 s0"/></g><text x="318" y="33" class="fill-N1 s1">역사 — 어디까지 갔었나</text></g><g ><g class="shape"><path d="M706 0h715v542H706z" class="stroke-B1 fill-B4 s0"/></g><text x="1063.5" y="33" class="fill-N1 s1">여기서 배울 것</text></g><text x="189" y="628" class="fill-N1 s2"><tspan x="189" dy="0"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208"> </tspan><tspan x="189" dy="16.208">검사를 쓰는 자리에서 물어야 할 것 —</tspan><tspan x="189" dy="16.208">이 점수가 무엇과 관련 있다는 증거가 있는가 ·</tspan><tspan x="189" dy="16.208">오차가 얼마인가 ·</tspan><tspan x="189" dy="16.208">어느 집단에서 만들어졌는가 ·</tspan><tspan x="189" dy="16.208">이 결정에 이 점수만 쓰는가</tspan></text><g ><g class="shape"><path d="M706 612h715v786H706z" class="stroke-B1 fill-B4 s0"/></g><text x="1063.5" y="645" class="fill-N1 s1">지금 자주 일어나는 오용</text></g><g ><g class="shape"><path d="M50 50h536v130H50z" class="stroke-B1 fill-B5 s0"/></g><text x="318" y="88.5" class="text-bold fill-N1 s2"><tspan x="318" dy="0">20세기 초, 지능 검사 점수가</tspan><tspan x="318" dy="17">이민을 제한하는 정책 논의에 인용되었다.</tspan><tspan x="318" dy="17">검사는 영어와 그 나라 생활에 대한 지식을 요구했고,</tspan><tspan x="318" dy="17">갓 도착한 사람들의 낮은 점수가</tspan><tspan x="318" dy="17">‘타고난 능력’ 의 증거로 읽혔다</tspan></text></g><g ><g class="shape"><path d="M50 230h536v98H50z" class="stroke-B1 fill-B5 s0"/></g><text x="318" y="268.5" class="text-bold fill-N1 s2"><tspan x="318" dy="0">여러 주에 강제 불임 법이 있었고</tspan><tspan x="318" dy="17.667">1927년 미국 연방대법원이 이를 인정했다.</tspan><tspan x="318" dy="17.667">검사 점수와 ‘정신 능력’ 판정이 그 판단에 쓰였다</tspan></text></g><g ><g class="shape"><path d="M50 378h536v114H50z" class="stroke-B1 fill-B5 s0"/></g><text x="318" y="416.5" class="text-bold fill-N1 s2"><tspan x="318" dy="0">검사를 만든 사람들 가운데 일부는 이런 쓰임에 반대했다.</tspan><tspan x="318" dy="17.25">비네는 이 검사를 학교에서</tspan><tspan x="318" dy="17.25">도움이 필요한 아이를 찾는 도구로 만들었고</tspan><tspan x="318" dy="17.25">타고난 능력의 등급으로 쓰는 것을 경계했다</tspan></text></g><g ><g class="shape"><path d="M766 60h518v98H766z" class="stroke-B1 fill-B5 s0"/></g><text x="1025" y="98.5" class="text-bold fill-N1 s2"><tspan x="1025" dy="0">타당도는 검사의 성질이 아니라 해석의 성질이다.</tspan><tspan x="1025" dy="17.667">같은 검사도 어떤 해석에는 타당하고</tspan><tspan x="1025" dy="17.667">어떤 해석에는 타당하지 않다</tspan></text></g><g ><g class="shape"><path d="M766 198h518v82H766z" class="stroke-B1 fill-B5 s0"/></g><text x="1025" y="236.5" class="text-bold fill-N1 s2"><tspan x="1025" dy="0">그러므로 ‘이 검사가 좋은 검사인가’ 는 반쪽 물음이다.</tspan><tspan x="1025" dy="18.5">‘이 점수로 무엇을 하려 하는가’ 가 함께 와야 한다</tspan></text></g><g ><g class="shape"><path d="M766 672h595v98H766z" class="stroke-B1 fill-B5 s0"/></g><text x="1063.5" y="710.5" class="text-bold fill-N1 s2"><tspan x="1063.5" dy="0">준거 타당도 없이 거른다</tspan><tspan x="1063.5" dy="17.667">이 점수가 나중의 수행과 관련이 있는지 확인하지 않은 채</tspan><tspan x="1063.5" dy="17.667">채용이나 배치의 기준으로 쓴다</tspan></text></g><g ><g class="shape"><path d="M766 810h595v114H766z" class="stroke-B1 fill-B5 s0"/></g><text x="1063.5" y="848.5" class="text-bold fill-N1 s2"><tspan x="1063.5" dy="0">집단의 평균을 개인에게 붙인다</tspan><tspan x="1063.5" dy="17.25">두 집단의 평균이 다르다는 것에서</tspan><tspan x="1063.5" dy="17.25">앞에 있는 이 사람에 대한 결론을 낸다.</tspan><tspan x="1063.5" dy="17.25">분포가 크게 겹치면 그 결론은 거의 언제나 틀린다</tspan></text></g><g ><g class="shape"><path d="M766 964h595v98H766z" class="stroke-B1 fill-B5 s0"/></g><text x="1063.5" y="1002.5" class="text-bold fill-N1 s2"><tspan x="1063.5" dy="0">오차를 무시한 문턱</tspan><tspan x="1063.5" dy="17.667">한 점 차이로 자른다. 어떤 검사에도 오차가 있으므로</tspan><tspan x="1063.5" dy="17.667">문턱 근처의 판정은 다시 재면 뒤집힌다</tspan></text></g><g ><g class="shape"><path d="M766 1102h595v98H766z" class="stroke-B1 fill-B5 s0"/></g><text x="1063.5" y="1140.5" class="text-bold fill-N1 s2"><tspan x="1063.5" dy="0">연속된 점수를 유형으로 바꿔 쓴다</tspan><tspan x="1063.5" dy="17.667">사람에게 이름표가 붙고,</tspan><tspan x="1063.5" dy="17.667">그 이름표가 배치와 기대를 정한다</tspan></text></g><g ><g class="shape"><path d="M766 1240h595v98H766z" class="stroke-B1 fill-B5 s0"/></g><text x="1063.5" y="1278.5" class="text-bold fill-N1 s2"><tspan x="1063.5" dy="0">문항이 요구하는 배경 지식</tspan><tspan x="1063.5" dy="17.667">특정 배경에서 자란 사람에게만 익숙한 것을 묻는 문항이 있으면</tspan><tspan x="1063.5" dy="17.667">그것이 재는 것에 섞인다</tspan></text></g><marker id="mk-d2-1315786763-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1315786763-3488378134)" d="M318 182v44" class="connection stroke-B1 s0" mask="url(#d2-1315786763)"/><path fill="none" marker-end="url(#mk-d2-1315786763-3488378134)" d="M637.5 271h65" class="connection stroke-B1 s0" mask="url(#d2-1315786763)"/><path fill="none" marker-end="url(#mk-d2-1315786763-3488378134)" d="M1063.5 544v64" class="connection stroke-B1 s0" mask="url(#d2-1315786763)"/><marker id="mk-d2-1315786763-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1315786763-2177206569)" d="M704 1005h-64" class="connection" mask="url(#d2-1315786763)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1315786763" width="1623" height="1600" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1623v1600H-101z"/></mask></svg>