<svg xmlns="http://www.w3.org/2000/svg" width="2899" height="776" class="d2-2257275913 d2-svg" viewBox="-81 -101 2899 776"><rect width="2899" height="776" x="-81" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2257275913 .fill-N1{fill:#0a0f25}.d2-2257275913 .fill-B4{fill:#e3e9fd}.d2-2257275913 .fill-B5{fill:#edf0fd}.d2-2257275913 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M20 133h824v354H20z" class="stroke-B1 fill-B4 s0"/></g><text x="432" y="120" class="fill-N1 s1">먼저 정할 것</text></g><g ><g class="shape"><path d="M986 0h900v234H986z" class="stroke-B1 fill-B4 s0"/></g><text x="1436" y="33" class="fill-N1 s1">행동이 늘었다 — 강화</text></g><g ><g class="shape"><path d="M964 340h944v234H964z" class="stroke-B1 fill-B4 s0"/></g><text x="1436" y="373" class="fill-N1 s1">행동이 줄었다 — 처벌</text></g><text x="2362.5" y="107" class="fill-N1 s2"><tspan x="2362.5" dy="0"> </tspan><tspan x="2362.5" dy="17.667">가장 흔한 잘못 — ‘부적 강화’ 를 처벌로 읽는 것.</tspan><tspan x="2362.5" dy="17.667">부적 강화는 행동을 늘린다. 없애 준 것이 그 사람에게 치우고 싶은 것이었기 때문이다</tspan></text><g ><g class="shape"><path d="M50 253h340v114H50z" class="stroke-B1 fill-B5 s0"/></g><text x="220" y="291.5" class="text-bold fill-N1 s2"><tspan x="220" dy="0">강화 · 처벌은 결과로 정한다</tspan><tspan x="220" dy="17.25">그 행동이 그 뒤에 늘었으면 강화,</tspan><tspan x="220" dy="17.25">줄었으면 처벌이다.</tspan><tspan x="220" dy="17.25">주는 사람의 의도로 정하지 않는다</tspan></text></g><g ><g class="shape"><path d="M490 253h324v114H490z" class="stroke-B1 fill-B5 s0"/></g><text x="652" y="291.5" class="text-bold fill-N1 s2"><tspan x="652" dy="0">정적 · 부적은 방향으로 정한다</tspan><tspan x="652" dy="17.25">무언가를 더한 것이면 정적,</tspan><tspan x="652" dy="17.25">있던 것을 없앤 것이면 부적이다.</tspan><tspan x="652" dy="17.25">좋다 · 나쁘다의 뜻이 아니다</tspan></text></g><g ><g class="shape"><path d="M1046 60h360v114h-360z" class="stroke-B1 fill-B5 s0"/></g><text x="1226" y="98.5" class="text-bold fill-N1 s2"><tspan x="1226" dy="0">정적 강화</tspan><tspan x="1226" dy="17.25">행동 뒤에 무언가를 더한다</tspan><tspan x="1226" dy="17.25">보기 — 문제를 풀자 칭찬이 따라왔고,</tspan><tspan x="1226" dy="17.25">그 뒤로 문제를 더 자주 푼다</tspan></text></g><g ><g class="shape"><path d="M1446 60h380v114h-380z" class="stroke-B1 fill-B5 s0"/></g><text x="1636" y="98.5" class="text-bold fill-N1 s2"><tspan x="1636" dy="0">부적 강화</tspan><tspan x="1636" dy="17.25">행동 뒤에 있던 것을 없앤다</tspan><tspan x="1636" dy="17.25">보기 — 안전띠를 매자 경고음이 그쳤고,</tspan><tspan x="1636" dy="17.25">그 뒤로 더 빨리 매게 되었다</tspan></text></g><g ><g class="shape"><path d="M1024 400h360v114h-360z" class="stroke-B1 fill-B5 s0"/></g><text x="1204" y="438.5" class="text-bold fill-N1 s2"><tspan x="1204" dy="0">정적 처벌</tspan><tspan x="1204" dy="17.25">행동 뒤에 무언가를 더한다</tspan><tspan x="1204" dy="17.25">보기 — 규칙을 어기자 벌점이 붙었고,</tspan><tspan x="1204" dy="17.25">그 뒤로 그 행동이 줄었다</tspan></text></g><g ><g class="shape"><path d="M1424 400h424v114h-424z" class="stroke-B1 fill-B5 s0"/></g><text x="1636" y="438.5" class="text-bold fill-N1 s2"><tspan x="1636" dy="0">부적 처벌</tspan><tspan x="1636" dy="17.25">행동 뒤에 있던 것을 없앤다</tspan><tspan x="1636" dy="17.25">보기 — 규칙을 어기자 쓰던 권한이 사라졌고,</tspan><tspan x="1636" dy="17.25">그 뒤로 그 행동이 줄었다</tspan></text></g><marker id="mk-d2-2257275913-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2257275913-3488378134)" d="M392 310h94" class="connection stroke-B1 s0" mask="url(#d2-2257275913)"/><path fill="none" marker-end="url(#mk-d2-2257275913-3488378134)" d="M846 163h136" class="connection stroke-B1 s0" mask="url(#d2-2257275913)"/><path fill="none" marker-end="url(#mk-d2-2257275913-3488378134)" d="M846 457h114" class="connection stroke-B1 s0" mask="url(#d2-2257275913)"/><marker id="mk-d2-2257275913-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2257275913-2177206569)" d="M1888 117h116" class="connection" mask="url(#d2-2257275913)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-2257275913" width="2899" height="776" x="-81" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-81-101h2899v776H-81z"/></mask></svg>