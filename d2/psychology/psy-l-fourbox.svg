<svg xmlns="http://www.w3.org/2000/svg" width="1205" height="916" class="d2-2207262612 d2-svg" viewBox="-101 -101 1205 916"><rect width="1205" height="916" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2207262612 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2207262612 .fill-N1{fill:#0a0f25}.d2-2207262612 .fill-B5{fill:#edf0fd}.d2-2207262612 .fill-B6{fill:#f7f8fe}.d2-2207262612 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:24px}.s3{fill:#0d32b2}</style><path fill="transparent" stroke="transparent" d="M0 0h357v100H0z" class="shape s0"/><text x="585.5" y="16" class="fill-N1 s1"><tspan x="585.5" dy="0">가장 흔한 잘못 — ‘부적 강화’ 를 처벌로 읽는 것.</tspan><tspan x="585.5" dy="17.25">부적 강화는 행동을 늘린다.</tspan><tspan x="585.5" dy="17.25">없애 준 것이 그 사람에게</tspan><tspan x="585.5" dy="17.25">치우고 싶은 것이었기 때문이다</tspan></text><g ><g class="shape"><path d="M0 140h357v574H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="178.5" y="173" class="fill-N1" style="text-anchor:middle;font-size:28px">먼저 정할 것</text></g><path fill="transparent" stroke="transparent" d="M387 140h616v574H387z" class="shape s0"/><g ><g class="shape"><path d="M60 200h237v162H60z" class="stroke-B1 fill-B5 s0"/></g><text x="178.5" y="238.5" class="text-bold fill-N1 s1"><tspan x="178.5" dy="0">강화 · 처벌은</tspan><tspan x="178.5" dy="16.714">결과로 정한다</tspan><tspan x="178.5" dy="16.714">그 행동이 그 뒤에</tspan><tspan x="178.5" dy="16.714">늘었으면 강화,</tspan><tspan x="178.5" dy="16.714">줄었으면 처벌이다.</tspan><tspan x="178.5" dy="16.714">주는 사람의 의도로</tspan><tspan x="178.5" dy="16.714">정하지 않는다</tspan></text></g><g ><g class="shape"><path d="M60 422h237v162H60z" class="stroke-B1 fill-B5 s0"/></g><text x="178.5" y="460.5" class="text-bold fill-N1 s1"><tspan x="178.5" dy="0">정적 · 부적은</tspan><tspan x="178.5" dy="16.714">방향으로 정한다</tspan><tspan x="178.5" dy="16.714">무언가를 더한 것이면</tspan><tspan x="178.5" dy="16.714">정적, 있던 것을</tspan><tspan x="178.5" dy="16.714">없앤 것이면 부적이다.</tspan><tspan x="178.5" dy="16.714">좋다 · 나쁘다의</tspan><tspan x="178.5" dy="16.714">뜻이 아니다</tspan></text></g><g ><g class="shape"><path d="M427 180h536v227H427z" class="stroke-B1 fill-B5 s0"/></g><text x="695" y="209" class="fill-N1 s2">행동이 늘었다 — 강화</text></g><g ><g class="shape"><path d="M427 447h536v227H427z" class="stroke-B1 fill-B5 s0"/></g><text x="695" y="476" class="fill-N1 s2">행동이 줄었다 — 처벌</text></g><g ><g class="shape"><path d="M451 221h206v162H451z" class="stroke-B1 fill-B6 s0"/></g><text x="554" y="259.5" class="text-bold fill-N1 s1"><tspan x="554" dy="0">정적 강화</tspan><tspan x="554" dy="16.714">행동 뒤에</tspan><tspan x="554" dy="16.714">무언가를 더한다</tspan><tspan x="554" dy="16.714">보기 — 문제를 풀자</tspan><tspan x="554" dy="16.714">칭찬이 따라왔고,</tspan><tspan x="554" dy="16.714">그 뒤로 문제를</tspan><tspan x="554" dy="16.714">더 자주 푼다</tspan></text></g><g ><g class="shape"><path d="M681 221h226v162H681z" class="stroke-B1 fill-B6 s0"/></g><text x="794" y="259.5" class="text-bold fill-N1 s1"><tspan x="794" dy="0">부적 강화</tspan><tspan x="794" dy="16.714">행동 뒤에</tspan><tspan x="794" dy="16.714">있던 것을 없앤다</tspan><tspan x="794" dy="16.714">보기 — 안전띠를 매자</tspan><tspan x="794" dy="16.714">경고음이 그쳤고,</tspan><tspan x="794" dy="16.714">그 뒤로 더 빨리</tspan><tspan x="794" dy="16.714">매게 되었다</tspan></text></g><g ><g class="shape"><path d="M451 488h226v162H451z" class="stroke-B1 fill-B6 s0"/></g><text x="564" y="526.5" class="text-bold fill-N1 s1"><tspan x="564" dy="0">정적 처벌</tspan><tspan x="564" dy="16.714">행동 뒤에</tspan><tspan x="564" dy="16.714">무언가를 더한다</tspan><tspan x="564" dy="16.714">보기 — 규칙을 어기자</tspan><tspan x="564" dy="16.714">벌점이 붙었고,</tspan><tspan x="564" dy="16.714">그 뒤로 그 행동이</tspan><tspan x="564" dy="16.714">줄었다</tspan></text></g><g ><g class="shape"><path d="M701 488h238v162H701z" class="stroke-B1 fill-B6 s0"/></g><text x="820" y="526.5" class="text-bold fill-N1 s1"><tspan x="820" dy="0">부적 처벌</tspan><tspan x="820" dy="16.714">행동 뒤에</tspan><tspan x="820" dy="16.714">있던 것을 없앤다</tspan><tspan x="820" dy="16.714">보기 — 규칙을 어기자</tspan><tspan x="820" dy="16.714">쓰던 권한이 사라졌고,</tspan><tspan x="820" dy="16.714">그 뒤로 그 행동이</tspan><tspan x="820" dy="16.714">줄었다</tspan></text></g><marker id="mk-d2-2207262612-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2207262612-3488378134)" d="M178.5 364v54" class="connection stroke-B1 s0" mask="url(#d2-2207262612)"/><path fill="none" marker-end="url(#mk-d2-2207262612-3488378134)" d="m358.937 380.002 64.189-16.506" class="connection stroke-B1 s0" mask="url(#d2-2207262612)"/><path fill="none" marker-end="url(#mk-d2-2207262612-3488378134)" d="m358.937 473.998 64.189 16.506" class="connection stroke-B1 s0" mask="url(#d2-2207262612)"/><marker id="mk-d2-2207262612-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2207262612-2177206569)" d="M695 178v-74" class="connection" mask="url(#d2-2207262612)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-2207262612" width="1205" height="916" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1205v916H-101z"/></mask></svg>