<svg xmlns="http://www.w3.org/2000/svg" width="1516" height="962" class="d2-1287771005 d2-svg" viewBox="-101 -101 1516 962"><rect width="1516" height="962" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1287771005 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1287771005 .fill-N1{fill:#0a0f25}.d2-1287771005 .fill-B5{fill:#edf0fd}.d2-1287771005 .fill-B6{fill:#f7f8fe}.d2-1287771005 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:24px}.s3{fill:#0d32b2}</style><path fill="transparent" stroke="transparent" d="M0 0h460v100H0z" class="shape s0"/><text x="864.5" y="16" class="fill-N1 s1"><tspan x="864.5" dy="0">가장 흔한 잘못 — ‘부적 강화’ 를 처벌로 읽는 것.</tspan><tspan x="864.5" dy="18.5">부적 강화는 행동을 늘린다. 없애 준 것이 그 사람에게 치우고 싶은 것이었기 때문이다</tspan></text><g ><g class="shape"><path d="M0 140h460v620H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="230" y="173" class="fill-N1" style="text-anchor:middle;font-size:28px">먼저 정할 것</text></g><path fill="transparent" stroke="transparent" d="M510 140h804v620H510z" class="shape s0"/><g ><g class="shape"><path d="M60 200h340v114H60z" class="stroke-B1 fill-B5 s0"/></g><text x="230" y="238.5" class="text-bold fill-N1 s1"><tspan x="230" dy="0">강화 · 처벌은 결과로 정한다</tspan><tspan x="230" dy="17.25">그 행동이 그 뒤에 늘었으면 강화,</tspan><tspan x="230" dy="17.25">줄었으면 처벌이다.</tspan><tspan x="230" dy="17.25">주는 사람의 의도로 정하지 않는다</tspan></text></g><g ><g class="shape"><path d="M60 374h340v114H60z" class="stroke-B1 fill-B5 s0"/></g><text x="230" y="412.5" class="text-bold fill-N1 s1"><tspan x="230" dy="0">정적 · 부적은 방향으로 정한다</tspan><tspan x="230" dy="17.25">무언가를 더한 것이면 정적,</tspan><tspan x="230" dy="17.25">있던 것을 없앤 것이면 부적이다.</tspan><tspan x="230" dy="17.25">좋다 · 나쁘다의 뜻이 아니다</tspan></text></g><g ><g class="shape"><path d="M550 180h724v250H550z" class="stroke-B1 fill-B5 s0"/></g><text x="912" y="209" class="fill-N1 s2">행동이 늘었다 — 강화</text></g><g ><g class="shape"><path d="M550 470h724v250H550z" class="stroke-B1 fill-B5 s0"/></g><text x="912" y="499" class="fill-N1 s2">행동이 줄었다 — 처벌</text></g><g ><g class="shape"><path d="M610 240h282v130H610z" class="stroke-B1 fill-B6 s0"/></g><text x="751" y="278.5" class="text-bold fill-N1 s1"><tspan x="751" dy="0">정적 강화</tspan><tspan x="751" dy="17">행동 뒤에 무언가를 더한다</tspan><tspan x="751" dy="17">보기 — 문제를 풀자</tspan><tspan x="751" dy="17">칭찬이 따라왔고,</tspan><tspan x="751" dy="17">그 뒤로 문제를 더 자주 푼다</tspan></text></g><g ><g class="shape"><path d="M932 240h282v130H932z" class="stroke-B1 fill-B6 s0"/></g><text x="1073" y="278.5" class="text-bold fill-N1 s1"><tspan x="1073" dy="0">부적 강화</tspan><tspan x="1073" dy="17">행동 뒤에 있던 것을 없앤다</tspan><tspan x="1073" dy="17">보기 — 안전띠를 매자</tspan><tspan x="1073" dy="17">경고음이 그쳤고,</tspan><tspan x="1073" dy="17">그 뒤로 더 빨리 매게 되었다</tspan></text></g><g ><g class="shape"><path d="M610 530h276v130H610z" class="stroke-B1 fill-B6 s0"/></g><text x="748" y="568.5" class="text-bold fill-N1 s1"><tspan x="748" dy="0">정적 처벌</tspan><tspan x="748" dy="17">행동 뒤에 무언가를 더한다</tspan><tspan x="748" dy="17">보기 — 규칙을 어기자</tspan><tspan x="748" dy="17">벌점이 붙었고,</tspan><tspan x="748" dy="17">그 뒤로 그 행동이 줄었다</tspan></text></g><g ><g class="shape"><path d="M926 530h279v130H926z" class="stroke-B1 fill-B6 s0"/></g><text x="1065.5" y="568.5" class="text-bold fill-N1 s1"><tspan x="1065.5" dy="0">부적 처벌</tspan><tspan x="1065.5" dy="17">행동 뒤에 있던 것을 없앤다</tspan><tspan x="1065.5" dy="17">보기 — 규칙을 어기자</tspan><tspan x="1065.5" dy="17">쓰던 권한이 사라졌고,</tspan><tspan x="1065.5" dy="17">그 뒤로 그 행동이 줄었다</tspan></text></g><marker id="mk-d2-1287771005-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1287771005-3488378134)" d="M230 316v54" class="connection stroke-B1 s0" mask="url(#d2-1287771005)"/><path fill="none" marker-end="url(#mk-d2-1287771005-3488378134)" d="m461.957 400.587 84.13-17.76" class="connection stroke-B1 s0" mask="url(#d2-1287771005)"/><path fill="none" marker-end="url(#mk-d2-1287771005-3488378134)" d="m461.957 499.413 84.13 17.76" class="connection stroke-B1 s0" mask="url(#d2-1287771005)"/><marker id="mk-d2-1287771005-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1287771005-2177206569)" d="M912 178v-74" class="connection" mask="url(#d2-1287771005)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1287771005" width="1516" height="962" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1516v962H-101z"/></mask></svg>