<svg xmlns="http://www.w3.org/2000/svg" width="2575" height="1459" class="d2-3392347793 d2-svg" viewBox="-91 -101 2575 1459"><rect width="2575" height="1459" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3392347793 .fill-N1{fill:#0a0f25}.d2-3392347793 .fill-B4{fill:#e3e9fd}.d2-3392347793 .fill-B5{fill:#edf0fd}.d2-3392347793 .stroke-B1,.d2-3392347793 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="1123" cy="171" class="shape stroke-B1" rx="513" ry="171" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1123" y="168.5" class="text-bold fill-N1 s0"><tspan x="1123" dy="0">원 주장 — 몸을 크게 벌린 자세를 잠깐 취하면</tspan><tspan x="1123" dy="18.5">호르몬 수준과 위험을 감수하는 행동이 달라지고, 스스로도 힘이 난다고 느낀다</tspan></text></g><g ><g class="shape"><path d="M386 462h681v324H386z" class="stroke-B1 fill-B4 s1"/></g><text x="726.5" y="449" class="fill-N1 s2">호르몬과 행동 쪽</text></g><g ><g class="shape"><path d="M1107 470h823v332h-823z" class="stroke-B1 fill-B4 s1"/></g><text x="1518.5" y="457" class="fill-N1 s2">주관적 보고 쪽</text></g><g ><g class="shape"><path d="M10 942h2373v142H10z" class="stroke-B1 fill-B4 s1"/></g><text x="1196.5" y="929" class="fill-N1 s2">사실관계를 정확히 적어 둘 것</text></g><text x="1123" y="1220" class="fill-N1 s0"><tspan x="1123" dy="0"> </tspan><tspan x="1123" dy="17.667">이 사례가 이 문서에 남기는 규칙 — 하나의 이름 아래 여러 주장이 있으면 갈라 적는다.</tspan><tspan x="1123" dy="17.667">‘파워 포즈는 효과가 없다’ 도 ‘파워 포즈는 효과가 있다’ 도 자료를 뭉갠 문장이다</tspan></text><g ><g class="shape"><path d="M471 492h511v82H471z" class="stroke-B1 fill-B5 s1"/></g><text x="726.5" y="530.5" class="text-bold fill-N1 s0"><tspan x="726.5" dy="0">2015년에 훨씬 큰 표본으로 이루어진 재현에서</tspan><tspan x="726.5" dy="18.5">호르몬 수준과 위험 감수 행동의 차이가 나오지 않았다</tspan></text></g><g ><g class="shape"><path d="M416 690h621v66H416z" class="stroke-B1 fill-B5 s1"/></g><text x="726.5" y="728.5" class="text-bold fill-N1 s0">이 문서의 판정 — 재현되지 않았다. 이 주장을 사실로 적으면 안 된다</text></g><g ><g class="shape"><path d="M1198 500h641v66h-641z" class="stroke-B1 fill-B5 s1"/></g><text x="1518.5" y="538.5" class="text-bold fill-N1 s0">같은 재현에서 ‘힘이 난다고 느낀다’ 는 자기보고 쪽은 되풀이 나왔다</text></g><g ><g class="shape"><path d="M1137 674h763v98h-763z" class="stroke-B1 fill-B5 s1"/></g><text x="1518.5" y="712.5" class="text-bold fill-N1 s0"><tspan x="1518.5" dy="0">이 문서의 판정 — 이 부분은 재현되었다.</tspan><tspan x="1518.5" dy="17.667">다만 그것이 무엇을 뜻하는지는 따로 물을 일이다 —</tspan><tspan x="1518.5" dy="17.667">자세를 취하라고 지시받은 사람이 그 지시를 알고 답한 것이므로 요구특성이 걸린다</tspan></text></g><g ><g class="shape"><path d="M40 980h603v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="341.5" y="1018.5" class="text-bold fill-N1 s0">원 논문이 철회된 것이 아니다. 철회와 재현 실패는 다른 사건이다</text></g><g ><g class="shape"><path d="M703 972h839v82H703z" class="stroke-B1 fill-B5 s1"/></g><text x="1122.5" y="1010.5" class="text-bold fill-N1 s0"><tspan x="1122.5" dy="0">원 논문의 제1저자가 2016년에 이 효과를 더는 믿지 않는다는 입장을 공개했다.</tspan><tspan x="1122.5" dy="18.5">저자가 스스로 그렇게 적은 사례는 드물고, 그 자체가 이 분야에서 일어난 변화의 한 장면이다</tspan></text></g><g ><g class="shape"><path d="M1602 980h751v66h-751z" class="stroke-B1 fill-B5 s1"/></g><text x="1977.5" y="1018.5" class="text-bold fill-N1 s0">다른 저자들은 여전히 이 효과를 지지한다. 이 사안은 저자들 사이에서도 갈려 있다</text></g><marker id="mk-d2-3392347793-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3392347793-3488378134)" d="M726.5 576v110" class="connection stroke-B1 s1" mask="url(#d2-3392347793)"/><path fill="none" marker-end="url(#mk-d2-3392347793-3488378134)" d="M1518.5 568v102" class="connection stroke-B1 s1" mask="url(#d2-3392347793)"/><path fill="none" marker-end="url(#mk-d2-3392347793-3488378134)" d="M858.25 318.97C753.2 377.2 726.5 397.8 726.5 417" class="connection stroke-B1 s1" mask="url(#d2-3392347793)"/><path fill="none" marker-end="url(#mk-d2-3392347793-3488378134)" d="M1386.75 318.97C1491.8 377.2 1518.5 399.4 1518.5 425" class="connection stroke-B1 s1" mask="url(#d2-3392347793)"/><marker id="mk-d2-3392347793-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3392347793-2177206569)" d="M726.5 788v150" class="connection stroke-B2 s4" mask="url(#d2-3392347793)"/><path fill="none" marker-end="url(#mk-d2-3392347793-2177206569)" d="M1518.5 804v134" class="connection stroke-B2 s4" mask="url(#d2-3392347793)"/><path fill="none" marker-end="url(#mk-d2-3392347793-3488378134)" d="M1122.5 1086v114" class="connection stroke-B1 s1" mask="url(#d2-3392347793)"/><mask id="d2-3392347793" width="2575" height="1459" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h2575v1459H-91z"/></mask></svg>