<svg xmlns="http://www.w3.org/2000/svg" width="1086" height="1576" class="d2-3976420073 d2-svg" viewBox="-91 -101 1086 1576"><rect width="1086" height="1576" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.d2-3976420073 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3976420073 .fill-N1{fill:#0a0f25}.d2-3976420073 .fill-B4{fill:#e3e9fd}.d2-3976420073 .fill-B5{fill:#edf0fd}.d2-3976420073 .stroke-B1,.d2-3976420073 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="440.5" cy="80.5" class="shape stroke-B1" rx="241.5" ry="80.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="440.5" y="62" class="text-bold fill-N1 s0"><tspan x="440.5" dy="0">원 주장 — 몸을 크게 벌린 자세를</tspan><tspan x="440.5" dy="17.25">잠깐 취하면 호르몬 수준과</tspan><tspan x="440.5" dy="17.25">위험을 감수하는 행동이 달라지고,</tspan><tspan x="440.5" dy="17.25">스스로도 힘이 난다고 느낀다</tspan></text></g><g ><g class="shape"><path d="M10 281h399v388H10z" class="stroke-B1 fill-B4 s1"/></g><text x="209.5" y="268" class="fill-N1 s2">호르몬과 행동 쪽</text></g><g ><g class="shape"><path d="M449 297h445v404H449z" class="stroke-B1 fill-B4 s1"/></g><text x="671.5" y="284" class="fill-N1 s2">주관적 보고 쪽</text></g><g ><g class="shape"><path d="M185 821h511v384H185z" class="stroke-B1 fill-B4 s1"/></g><text x="440.5" y="854" class="fill-N1 s2">사실관계를 정확히 적어 둘 것</text></g><text x="441" y="1321" class="fill-N1 s0"><tspan x="441" dy="0"> </tspan><tspan x="441" dy="17.25">이 사례가 이 문서에 남기는 규칙 —</tspan><tspan x="441" dy="17.25">하나의 이름 아래 여러 주장이 있으면 갈라 적는다.</tspan><tspan x="441" dy="17.25">‘파워 포즈는 효과가 없다’ 도 ‘파워 포즈는 효과가 있다’ 도 자료를 뭉갠 문장이다</tspan></text><g ><g class="shape"><path d="M50 311h319v114H50z" class="stroke-B1 fill-B5 s1"/></g><text x="209.5" y="349.5" class="text-bold fill-N1 s0"><tspan x="209.5" dy="0">2015년에 훨씬 큰 표본으로</tspan><tspan x="209.5" dy="17.25">이루어진 재현에서</tspan><tspan x="209.5" dy="17.25">호르몬 수준과 위험 감수 행동의</tspan><tspan x="209.5" dy="17.25">차이가 나오지 않았다</tspan></text></g><g ><g class="shape"><path d="M40 557h339v82H40z" class="stroke-B1 fill-B5 s1"/></g><text x="209.5" y="595.5" class="text-bold fill-N1 s0"><tspan x="209.5" dy="0">이 문서의 판정 — 재현되지 않았다.</tspan><tspan x="209.5" dy="18.5">이 주장을 사실로 적으면 안 된다</tspan></text></g><g ><g class="shape"><path d="M479 327h385v82H479z" class="stroke-B1 fill-B5 s1"/></g><text x="671.5" y="365.5" class="text-bold fill-N1 s0"><tspan x="671.5" dy="0">같은 재현에서 ‘힘이 난다고 느낀다’ 는</tspan><tspan x="671.5" dy="18.5">자기보고 쪽은 되풀이 나왔다</tspan></text></g><g ><g class="shape"><path d="M481 525h382v146H481z" class="stroke-B1 fill-B5 s1"/></g><text x="672" y="563.5" class="text-bold fill-N1 s0"><tspan x="672" dy="0">이 문서의 판정 — 이 부분은 재현되었다.</tspan><tspan x="672" dy="16.833">다만 그것이 무엇을 뜻하는지는</tspan><tspan x="672" dy="16.833">따로 물을 일이다 —</tspan><tspan x="672" dy="16.833">자세를 취하라고 지시받은 사람이</tspan><tspan x="672" dy="16.833">그 지시를 알고 답한 것이므로</tspan><tspan x="672" dy="16.833">요구특성이 걸린다</tspan></text></g><g ><g class="shape"><path d="M205 867h471v82H205z" class="stroke-B1 fill-B5 s1"/></g><text x="440.5" y="905.5" class="text-bold fill-N1 s0"><tspan x="440.5" dy="0">원 논문이 철회된 것이 아니다.</tspan><tspan x="440.5" dy="18.5">철회와 재현 실패는 다른 사건이다</tspan></text></g><g ><g class="shape"><path d="M205 969h471v114H205z" class="stroke-B1 fill-B5 s1"/></g><text x="440.5" y="1007.5" class="text-bold fill-N1 s0"><tspan x="440.5" dy="0">원 논문의 제1저자가 2016년에</tspan><tspan x="440.5" dy="17.25">이 효과를 더는 믿지 않는다는 입장을 공개했다.</tspan><tspan x="440.5" dy="17.25">저자가 스스로 그렇게 적은 사례는 드물고,</tspan><tspan x="440.5" dy="17.25">그 자체가 이 분야에서 일어난 변화의 한 장면이다</tspan></text></g><g ><g class="shape"><path d="M205 1103h471v82H205z" class="stroke-B1 fill-B5 s1"/></g><text x="440.5" y="1141.5" class="text-bold fill-N1 s0"><tspan x="440.5" dy="0">다른 저자들은 여전히 이 효과를 지지한다.</tspan><tspan x="440.5" dy="18.5">이 사안은 저자들 사이에서도 갈려 있다</tspan></text></g><marker id="mk-d2-3976420073-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3976420073-3488378134)" d="M209.5 427v126" class="connection stroke-B1 s1" mask="url(#d2-3976420073)"/><path fill="none" marker-end="url(#mk-d2-3976420073-3488378134)" d="M671.5 411v110" class="connection stroke-B1 s1" mask="url(#d2-3976420073)"/><path fill="none" marker-end="url(#mk-d2-3976420073-3488378134)" d="M316.257 150.98C231.2 198.8 209.5 216.8 209.5 236" class="connection stroke-B1 s1" mask="url(#d2-3976420073)"/><path fill="none" marker-end="url(#mk-d2-3976420073-3488378134)" d="M564.743 150.98C649.8 198.8 671.5 220 671.5 252" class="connection stroke-B1 s1" mask="url(#d2-3976420073)"/><marker id="mk-d2-3976420073-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3976420073-2177206569)" d="M209.5 671c0 79.6 9.6 110 45.23 147.114" class="connection stroke-B2 s4" mask="url(#d2-3976420073)"/><path fill="none" marker-end="url(#mk-d2-3976420073-2177206569)" d="M671.5 703c0 54-9.6 78-45.23 115.114" class="connection stroke-B2 s4" mask="url(#d2-3976420073)"/><path fill="none" marker-end="url(#mk-d2-3976420073-3488378134)" d="M440.5 1207v94" class="connection stroke-B1 s1" mask="url(#d2-3976420073)"/><mask id="d2-3976420073" width="1086" height="1576" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101H995v1576H-91z"/></mask></svg>