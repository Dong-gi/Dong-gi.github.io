<svg xmlns="http://www.w3.org/2000/svg" width="1117" height="868" class="d2-1533855543 d2-svg" viewBox="-101 -101 1117 868"><rect width="1117" height="868" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1533855543 .fill-N1{fill:#0a0f25}.d2-1533855543 .fill-N2{fill:#676c7e}.d2-1533855543 .fill-B6{fill:#f7f8fe}.d2-1533855543 .stroke-B1,.d2-1533855543 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h427v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="213.5" y="38.5" class="text-bold fill-N1 s1">무선배정 실험</text></g><text x="688" y="16" class="fill-N1 s1">가장 세다. 그러나 물을 수 있는 것이 가장 좁다</text><g ><g class="shape"><path d="M0 126h427v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="213.5" y="164.5" class="text-bold fill-N1 s1"><tspan x="213.5" dy="0">자연실험</tspan><tspan x="213.5" dy="17.667">제도 변경 · 추첨 · 정원 커트라인처럼</tspan><tspan x="213.5" dy="17.667">사람의 뜻과 무관하게 갈린 자리를 찾아 쓴다</tspan></text></g><text x="639" y="142" class="fill-N1 s1"><tspan x="639" dy="0">갈림이 정말로 우연에 가까웠다면</tspan><tspan x="639" dy="17.25">무선배정에 가까워진다.</tspan><tspan x="639" dy="17.25">그 가정 자체가 논증거리이며,</tspan><tspan x="639" dy="17.25">대개 그 논증이 논문의 본체다</tspan></text><g ><g class="shape"><path d="M0 284h427v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="213.5" y="322.5" class="text-bold fill-N1 s1"><tspan x="213.5" dy="0">짝짓기와 통제</tspan><tspan x="213.5" dy="17.667">나이 · 사전 점수 등이 비슷한 사람끼리</tspan><tspan x="213.5" dy="17.667">짝지어 견준다</tspan></text></g><text x="642" y="300" class="fill-N1 s1"><tspan x="642" dy="0">잰 변수에 대해서만 선택을 막는다.</tspan><tspan x="642" dy="18.5">재지 않은 변수는 그대로 남는다</tspan></text><g ><g class="shape"><path d="M0 442h427v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="213.5" y="480.5" class="text-bold fill-N1 s1"><tspan x="213.5" dy="0">비교 집단을 붙인다</tspan><tspan x="213.5" dy="18.5">처치를 안 받은 비슷한 집단을 함께 잰다</tspan></text></g><text x="706" y="458" class="fill-N1 s1"><tspan x="706" dy="0">성숙과 역사를 막는다.</tspan><tspan x="706" dy="18.5">두 집단이 처음부터 달랐을 가능성(선택)은 남는다</tspan></text><g ><g class="shape"><path d="M0 584h427v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="213.5" y="622.5" class="text-bold fill-N1 s1"><tspan x="213.5" dy="0">사전-사후 한 집단</tspan><tspan x="213.5" dy="18.5">처치 전에 재고 처치 뒤에 다시 잰다</tspan></text></g><text x="660" y="600" class="fill-N1 s1"><tspan x="660" dy="0">가장 약하다. 성숙 · 역사 · 검사 ·</tspan><tspan x="660" dy="18.5">평균으로의 회귀가 전부 그대로 남는다</tspan></text><marker id="mk-d2-1533855543-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1533855543-2177206569)" d="M429 625h64" class="connection stroke-B2 s3" mask="url(#d2-1533855543)"/><path fill="none" marker-end="url(#mk-d2-1533855543-2177206569)" d="M429 483h64" class="connection stroke-B2 s3" mask="url(#d2-1533855543)"/><path fill="none" marker-end="url(#mk-d2-1533855543-2177206569)" d="M429 333h64" class="connection stroke-B2 s3" mask="url(#d2-1533855543)"/><path fill="none" marker-end="url(#mk-d2-1533855543-2177206569)" d="M429 175h64" class="connection stroke-B2 s3" mask="url(#d2-1533855543)"/><path fill="none" marker-end="url(#mk-d2-1533855543-2177206569)" d="M429 33h64" class="connection stroke-B2 s3" mask="url(#d2-1533855543)"/><marker id="mk-d2-1533855543-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1533855543-3488378134)" d="M213.5 582v-54" class="connection stroke-B1 s0" mask="url(#d2-1533855543)"/><text x="213.5" y="560" class="text-italic fill-N2 s1">인과 주장이 세진다</text><path fill="none" marker-end="url(#mk-d2-1533855543-3488378134)" d="M213.5 440v-54" class="connection stroke-B1 s0" mask="url(#d2-1533855543)"/><text x="213.5" y="418" class="text-italic fill-N2 s1">인과 주장이 세진다</text><path fill="none" marker-end="url(#mk-d2-1533855543-3488378134)" d="M213.5 282v-54" class="connection stroke-B1 s0" mask="url(#d2-1533855543)"/><text x="213.5" y="260" class="text-italic fill-N2 s1">인과 주장이 세진다</text><path fill="none" marker-end="url(#mk-d2-1533855543-3488378134)" d="M213.5 124V70" class="connection stroke-B1 s0" mask="url(#d2-1533855543)"/><text x="213.5" y="102" class="text-italic fill-N2 s1">인과 주장이 세진다</text><mask id="d2-1533855543" width="1117" height="868" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1117v868H-101z"/><path d="M131 544h165v21H131zM131 402h165v21H131zM131 244h165v21H131zM131 86h165v21H131z"/></mask></svg>