<svg xmlns="http://www.w3.org/2000/svg" width="2011" height="1217" class="d2-739107971 d2-svg" viewBox="-101 -101 2011 1217"><rect width="2011" height="1217" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-739107971 .fill-N1{fill:#0a0f25}.d2-739107971 .fill-N2{fill:#676c7e}.d2-739107971 .fill-B6{fill:#f7f8fe}.d2-739107971 .stroke-B1,.d2-739107971 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M392 933h346v82H392z" class="stroke-B1 fill-B6 s0"/></g><text x="565" y="971.5" class="text-bold fill-N1 s1"><tspan x="565" dy="0">사전-사후 한 집단</tspan><tspan x="565" dy="18.5">처치 전에 재고 처치 뒤에 다시 잰다</tspan></text></g><text x="292" y="777" class="fill-N1 s1">가장 약하다. 성숙 · 역사 · 검사 · 평균으로의 회귀가 전부 그대로 남는다</text><g ><g class="shape"><path d="M644 730h386v82H644z" class="stroke-B1 fill-B6 s0"/></g><text x="837" y="768.5" class="text-bold fill-N1 s1"><tspan x="837" dy="0">비교 집단을 붙인다</tspan><tspan x="837" dy="18.5">처치를 안 받은 비슷한 집단을 함께 잰다</tspan></text></g><text x="530" y="574" class="fill-N1 s1">성숙과 역사를 막는다. 두 집단이 처음부터 달랐을 가능성(선택)은 남는다</text><g ><g class="shape"><path d="M894 527h499v82H894z" class="stroke-B1 fill-B6 s0"/></g><text x="1143.5" y="565.5" class="text-bold fill-N1 s1"><tspan x="1143.5" dy="0">짝짓기와 통제</tspan><tspan x="1143.5" dy="18.5">나이 · 사전 점수 등이 비슷한 사람끼리 짝지어 견준다</tspan></text></g><text x="867" y="363" class="fill-N1 s1">잰 변수에 대해서만 선택을 막는다. 재지 않은 변수는 그대로 남는다</text><g ><g class="shape"><path d="M1208 308h427v98h-427z" class="stroke-B1 fill-B6 s0"/></g><text x="1421.5" y="346.5" class="text-bold fill-N1 s1"><tspan x="1421.5" dy="0">자연실험</tspan><tspan x="1421.5" dy="17.667">제도 변경 · 추첨 · 정원 커트라인처럼</tspan><tspan x="1421.5" dy="17.667">사람의 뜻과 무관하게 갈린 자리를 찾아 쓴다</tspan></text></g><text x="1224" y="152" class="fill-N1 s1"><tspan x="1224" dy="0">갈림이 정말로 우연에 가까웠다면 무선배정에 가까워진다.</tspan><tspan x="1224" dy="18.5">그 가정 자체가 논증거리이며, 대개 그 논증이 논문의 본체다</tspan></text><g ><g class="shape"><path d="M1534 121h168v66h-168z" class="stroke-B1 fill-B6 s0"/></g><text x="1618" y="159.5" class="text-bold fill-N1 s1">무선배정 실험</text></g><text x="1618" y="16" class="fill-N1 s1">가장 세다. 그러나 물을 수 있는 것이 가장 좁다</text><marker id="mk-d2-739107971-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-739107971-2177206569)" d="M452.128 932.795C324.4 884.7 292 854.3 292 785.5" class="connection stroke-B2 s3" mask="url(#d2-739107971)"/><path fill="none" marker-end="url(#mk-d2-739107971-2177206569)" d="M711.353 729.868C566.85 681.7 530.25 651.3 530.25 582.5" class="connection stroke-B2 s3" mask="url(#d2-739107971)"/><path fill="none" marker-end="url(#mk-d2-739107971-2177206569)" d="M1029.624 526.806C899.5 478.7 866.5 446.7 866.5 371.5" class="connection stroke-B2 s3" mask="url(#d2-739107971)"/><path fill="none" marker-end="url(#mk-d2-739107971-2177206569)" d="M1331.255 307.523C1245.8 259.7 1224 232.5 1224 176.5" class="connection stroke-B2 s3" mask="url(#d2-739107971)"/><path fill="none" marker-end="url(#mk-d2-739107971-2177206569)" d="M1618 119V25" class="connection stroke-B2 s3" mask="url(#d2-739107971)"/><marker id="mk-d2-739107971-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-739107971-3488378134)" d="M676.872 932.795C804.6 884.7 837 860.3 837 815.5" class="connection stroke-B1 s0" mask="url(#d2-739107971)"/><text x="781.5" y="899" class="text-italic fill-N2 s1">인과 주장이 세진다</text><path fill="none" marker-end="url(#mk-d2-739107971-3488378134)" d="M962.647 729.868C1107.15 681.7 1143.75 657.3 1143.75 612.5" class="connection stroke-B1 s0" mask="url(#d2-739107971)"/><text x="1077.5" y="697" class="text-italic fill-N2 s1">인과 주장이 세진다</text><path fill="none" marker-end="url(#mk-d2-739107971-3488378134)" d="M1257.876 526.806C1388 478.7 1421 454.3 1421 409.5" class="connection stroke-B1 s0" mask="url(#d2-739107971)"/><text x="1364.5" y="493" class="text-italic fill-N2 s1">인과 주장이 세진다</text><path fill="none" marker-end="url(#mk-d2-739107971-3488378134)" d="M1510.745 307.523C1596.2 259.7 1618 235.3 1618 190.5" class="connection stroke-B1 s0" mask="url(#d2-739107971)"/><text x="1588.5" y="270" class="text-italic fill-N2 s1">인과 주장이 세진다</text><mask id="d2-739107971" width="2011" height="1217" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2011v1217H-101z"/><path d="M699 883h165v21H699zM995 681h165v21H995zM1282 477h165v21h-165zM1506 254h165v21h-165z"/></mask></svg>