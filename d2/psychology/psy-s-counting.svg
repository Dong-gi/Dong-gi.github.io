<svg xmlns="http://www.w3.org/2000/svg" width="1541" height="1243" class="d2-839711228 d2-svg" viewBox="-91 -101 1541 1243"><rect width="1541" height="1243" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-839711228 .fill-N1{fill:#0a0f25}.d2-839711228 .fill-B4{fill:#e3e9fd}.d2-839711228 .fill-B5{fill:#edf0fd}.d2-839711228 .stroke-B1,.d2-839711228 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="704.5" cy="121" class="shape stroke-B1" rx="363.5" ry="121" style="fill:#f7f8fe;stroke-width:2"/></g><text x="704.5" y="118.5" class="text-bold fill-N1 s0"><tspan x="704.5" dy="0">하나의 자료</tspan><tspan x="704.5" dy="18.5">참가자 여러 명이 여러 번의 임계 시행에서 각각 답했다</tspan></text></g><g ><g class="shape"><path d="M10 362h700v458H10z" class="stroke-B1 fill-B4 s1"/></g><text x="360" y="349" class="fill-N1 s2">시행을 센다</text></g><g ><g class="shape"><path d="M750 362h599v458H750z" class="stroke-B1 fill-B4 s1"/></g><text x="1049.5" y="349" class="fill-N1 s2">사람을 센다</text></g><text x="704.5" y="956" class="fill-N1 s0"><tspan x="704.5" dy="0"> </tspan><tspan x="704.5" dy="16.833">두 문장 다 참이고 같은 자료에서 나왔다. 무엇을 세었는지가 다를 뿐이다.</tspan><tspan x="704.5" dy="16.833">그러므로 어떤 결과를 읽을 때 ‘무엇을 단위로 세었는가’ 를 확인해야 한다.</tspan><tspan x="704.5" dy="16.833"> </tspan><tspan x="704.5" dy="16.833">덧붙여 — 애쉬 자신이 관심을 둔 것은 따라간 사람이 아니라 버틴 사람이었다.</tspan><tspan x="704.5" dy="16.833">실험은 ‘사람이 얼마나 잘 휘둘리는가’ 가 아니라 ‘무엇이 독립을 지키게 하는가’ 를 묻는 것이었다</tspan></text><g ><g class="shape"><path d="M102 392h517v66H102z" class="stroke-B1 fill-B5 s1"/></g><text x="360.5" y="430.5" class="text-bold fill-N1 s0">전체 임계 시행 가운데 동조한 답이 나온 것이 몇 번인가</text></g><g ><g class="shape"><path d="M40 558h640v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="360" y="596.5" class="text-bold fill-N1 s0">소수에 그친다. 대다수 시행에서는 참가자가 눈에 보이는 대로 답했다</text></g><g ><g class="shape"><path d="M66 724h588v66H66z" class="stroke-B1 fill-B5 s1"/></g><text x="360" y="762.5" class="text-bold fill-N1 s0">여기서 나오는 문장 — ‘사람은 대체로 다수에 휘둘리지 않는다’</text></g><g ><g class="shape"><path d="M857 392h386v66H857z" class="stroke-B1 fill-B5 s1"/></g><text x="1050" y="430.5" class="text-bold fill-N1 s0">적어도 한 번 동조한 참가자가 몇 명인가</text></g><g ><g class="shape"><path d="M780 558h539v66H780z" class="stroke-B1 fill-B5 s1"/></g><text x="1049.5" y="596.5" class="text-bold fill-N1 s0">다수다. 끝까지 한 번도 따라가지 않은 사람은 오히려 적다</text></g><g ><g class="shape"><path d="M820 724h460v66H820z" class="stroke-B1 fill-B5 s1"/></g><text x="1050" y="762.5" class="text-bold fill-N1 s0">여기서 나오는 문장 — ‘사람은 다수를 따라간다’</text></g><marker id="mk-d2-839711228-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-839711228-3488378134)" d="M360 460v94" class="connection stroke-B1 s1" mask="url(#d2-839711228)"/><path fill="none" marker-end="url(#mk-d2-839711228-3488378134)" d="M360 626v94" class="connection stroke-B1 s1" mask="url(#d2-839711228)"/><path fill="none" marker-end="url(#mk-d2-839711228-3488378134)" d="M1049.5 460v94" class="connection stroke-B1 s1" mask="url(#d2-839711228)"/><path fill="none" marker-end="url(#mk-d2-839711228-3488378134)" d="M1049.5 626v94" class="connection stroke-B1 s1" mask="url(#d2-839711228)"/><path fill="none" marker-end="url(#mk-d2-839711228-3488378134)" d="M500.206 222.884C388.4 278 360 297.8 360 317" class="connection stroke-B1 s1" mask="url(#d2-839711228)"/><path fill="none" marker-end="url(#mk-d2-839711228-3488378134)" d="M908.79 221.892C1021 277.8 1049.5 297.8 1049.5 317" class="connection stroke-B1 s1" mask="url(#d2-839711228)"/><marker id="mk-d2-839711228-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-839711228-2177206569)" d="M360 822c0 54 34.4 78 168.159 116.883" class="connection stroke-B2 s4" mask="url(#d2-839711228)"/><path fill="none" marker-end="url(#mk-d2-839711228-2177206569)" d="M1049.5 822c0 54-34.4 78-168.159 116.883" class="connection stroke-B2 s4" mask="url(#d2-839711228)"/><mask id="d2-839711228" width="1541" height="1243" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1541v1243H-91z"/></mask></svg>