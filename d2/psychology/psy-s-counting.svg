<svg xmlns="http://www.w3.org/2000/svg" width="954" height="1292" class="d2-3292128019 d2-svg" viewBox="-91 -101 954 1292"><rect width="954" height="1292" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.d2-3292128019 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3292128019 .fill-N1{fill:#0a0f25}.d2-3292128019 .fill-B4{fill:#e3e9fd}.d2-3292128019 .fill-B5{fill:#edf0fd}.d2-3292128019 .stroke-B1,.d2-3292128019 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="384.5" cy="65.5" class="shape stroke-B1" rx="196.5" ry="65.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="384.5" y="55" class="text-bold fill-N1 s0"><tspan x="384.5" dy="0">하나의 자료</tspan><tspan x="384.5" dy="17.667">참가자 여러 명이 여러 번의</tspan><tspan x="384.5" dy="17.667">임계 시행에서 각각 답했다</tspan></text></g><g ><g class="shape"><path d="M10 251h353v554H10z" class="stroke-B1 fill-B4 s1"/></g><text x="186.5" y="238" class="fill-N1 s2">시행을 센다</text></g><g ><g class="shape"><path d="M403 259h359v538H403z" class="stroke-B1 fill-B4 s1"/></g><text x="582.5" y="246" class="fill-N1 s2">사람을 센다</text></g><text x="385" y="941" class="fill-N1 s0"><tspan x="385" dy="0"> </tspan><tspan x="385" dy="16.5">두 문장 다 참이고 같은 자료에서 나왔다.</tspan><tspan x="385" dy="16.5">무엇을 세었는지가 다를 뿐이다.</tspan><tspan x="385" dy="16.5">그러므로 어떤 결과를 읽을 때</tspan><tspan x="385" dy="16.5">‘무엇을 단위로 세었는가’ 를 확인해야 한다.</tspan><tspan x="385" dy="16.5"> </tspan><tspan x="385" dy="16.5">덧붙여 — 애쉬 자신이 관심을 둔 것은</tspan><tspan x="385" dy="16.5">따라간 사람이 아니라 버틴 사람이었다.</tspan><tspan x="385" dy="16.5">실험은 ‘사람이 얼마나 잘 휘둘리는가’ 가 아니라</tspan><tspan x="385" dy="16.5">‘무엇이 독립을 지키게 하는가’ 를 묻는 것이었다</tspan></text><g ><g class="shape"><path d="M69 281h235v98H69z" class="stroke-B1 fill-B5 s1"/></g><text x="186.5" y="319.5" class="text-bold fill-N1 s0"><tspan x="186.5" dy="0">전체 임계 시행 가운데</tspan><tspan x="186.5" dy="17.667">동조한 답이 나온 것이</tspan><tspan x="186.5" dy="17.667">몇 번인가</tspan></text></g><g ><g class="shape"><path d="M40 479h293v98H40z" class="stroke-B1 fill-B5 s1"/></g><text x="186.5" y="517.5" class="text-bold fill-N1 s0"><tspan x="186.5" dy="0">소수에 그친다.</tspan><tspan x="186.5" dy="17.667">대다수 시행에서는 참가자가</tspan><tspan x="186.5" dy="17.667">눈에 보이는 대로 답했다</tspan></text></g><g ><g class="shape"><path d="M55 677h263v98H55z" class="stroke-B1 fill-B5 s1"/></g><text x="186.5" y="715.5" class="text-bold fill-N1 s0"><tspan x="186.5" dy="0">여기서 나오는 문장 —</tspan><tspan x="186.5" dy="17.667">‘사람은 대체로</tspan><tspan x="186.5" dy="17.667">다수에 휘둘리지 않는다’</tspan></text></g><g ><g class="shape"><path d="M475 289h215v82H475z" class="stroke-B1 fill-B5 s1"/></g><text x="582.5" y="327.5" class="text-bold fill-N1 s0"><tspan x="582.5" dy="0">적어도 한 번 동조한</tspan><tspan x="582.5" dy="18.5">참가자가 몇 명인가</tspan></text></g><g ><g class="shape"><path d="M433 479h299v98H433z" class="stroke-B1 fill-B5 s1"/></g><text x="582.5" y="517.5" class="text-bold fill-N1 s0"><tspan x="582.5" dy="0">다수다.</tspan><tspan x="582.5" dy="17.667">끝까지 한 번도 따라가지 않은</tspan><tspan x="582.5" dy="17.667">사람은 오히려 적다</tspan></text></g><g ><g class="shape"><path d="M446 685h274v82H446z" class="stroke-B1 fill-B5 s1"/></g><text x="583" y="723.5" class="text-bold fill-N1 s0"><tspan x="583" dy="0">여기서 나오는 문장 —</tspan><tspan x="583" dy="18.5">‘사람은 다수를 따라간다’</tspan></text></g><marker id="mk-d2-3292128019-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3292128019-3488378134)" d="M186.5 381v94" class="connection stroke-B1 s1" mask="url(#d2-3292128019)"/><path fill="none" marker-end="url(#mk-d2-3292128019-3488378134)" d="M186.5 579v94" class="connection stroke-B1 s1" mask="url(#d2-3292128019)"/><path fill="none" marker-end="url(#mk-d2-3292128019-3488378134)" d="M582.5 373v102" class="connection stroke-B1 s1" mask="url(#d2-3292128019)"/><path fill="none" marker-end="url(#mk-d2-3292128019-3488378134)" d="M582.5 579v102" class="connection stroke-B1 s1" mask="url(#d2-3292128019)"/><path fill="none" marker-end="url(#mk-d2-3292128019-3488378134)" d="M285.275 123.013C206.6 169.2 186.5 186.8 186.5 206" class="connection stroke-B1 s1" mask="url(#d2-3292128019)"/><path fill="none" marker-end="url(#mk-d2-3292128019-3488378134)" d="M483.725 123.013C562.4 169.2 582.5 188.4 582.5 214" class="connection stroke-B1 s1" mask="url(#d2-3292128019)"/><marker id="mk-d2-3292128019-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3292128019-2177206569)" d="M186.5 807c0 54 15 78 71.672 115.781" class="connection stroke-B2 s4" mask="url(#d2-3292128019)"/><path fill="none" marker-end="url(#mk-d2-3292128019-2177206569)" d="M582.5 799c0 60.4-15 86-71.672 123.781" class="connection stroke-B2 s4" mask="url(#d2-3292128019)"/><mask id="d2-3292128019" width="954" height="1292" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h954v1292H-91z"/></mask></svg>