<svg xmlns="http://www.w3.org/2000/svg" width="1432" height="1532" class="d2-4124432332 d2-svg" viewBox="-89 -89 1432 1532"><rect width="1432" height="1532" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-4124432332 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4124432332 .fill-N1{fill:#0a0f25}.d2-4124432332 .fill-B4{fill:#e3e9fd}.d2-4124432332 .fill-B5{fill:#edf0fd}.d2-4124432332 .stroke-B1,.d2-4124432332 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="158.5" cy="653" class="shape stroke-B1" rx="146.5" ry="60" style="fill:#f7f8fe;stroke-width:2"/></g><text x="158.5" y="642.5" class="text-bold fill-N1 s0"><tspan x="158.5" dy="0">물음 —</tspan><tspan x="158.5" dy="17.667">나이가 들면</tspan><tspan x="158.5" dy="17.667">무엇이 달라지는가</tspan></text></g><g ><g class="shape"><path d="M401 12h582v366H401z" class="stroke-B1 fill-B4 s1"/></g><text x="692" y="45" class="fill-N1 s2">횡단 설계</text></g><g ><g class="shape"><path d="M398 398h587v510H398z" class="stroke-B1 fill-B4 s1"/></g><text x="691.5" y="431" class="fill-N1 s2">종단 설계</text></g><g ><g class="shape"><path d="M385 928h614v414H385z" class="stroke-B1 fill-B4 s1"/></g><text x="692" y="961" class="fill-N1 s2">계열 설계</text></g><text x="1160.5" y="562" class="fill-N1 s0"><tspan x="1160.5" dy="0"> </tspan><tspan x="1160.5" dy="16.385">설계를 고르는 일은</tspan><tspan x="1160.5" dy="16.385">‘무엇을</tspan><tspan x="1160.5" dy="16.385">혼입으로</tspan><tspan x="1160.5" dy="16.385">받아들일지’ 를</tspan><tspan x="1160.5" dy="16.385">고르는 일이다.</tspan><tspan x="1160.5" dy="16.385">어느 설계에서</tspan><tspan x="1160.5" dy="16.385">나온 결과인지</tspan><tspan x="1160.5" dy="16.385">모르면</tspan><tspan x="1160.5" dy="16.385">그 결과가</tspan><tspan x="1160.5" dy="16.385">나이 이야기인지</tspan><tspan x="1160.5" dy="16.385">시대 이야기인지</tspan><tspan x="1160.5" dy="16.385">알 수 없다</tspan></text><g ><g class="shape"><path d="M431 58h257v114H431z" class="stroke-B1 fill-B5 s1"/></g><text x="559.5" y="96.5" class="text-bold fill-N1 s0"><tspan x="559.5" dy="0">한 시점에 나이가 다른</tspan><tspan x="559.5" dy="17.25">사람들을 한꺼번에 잰다.</tspan><tspan x="559.5" dy="17.25">20세 · 40세 · 60세 집단을</tspan><tspan x="559.5" dy="17.25">올해 같이 검사한다</tspan></text></g><g ><g class="shape"><path d="M718 58h235v114H718z" class="stroke-B1 fill-B5 s1"/></g><text x="835.5" y="112.5" class="text-bold fill-N1 s0"><tspan x="835.5" dy="0">싸고 빠르다.</tspan><tspan x="835.5" dy="18.5">한 번만 재면 된다</tspan></text></g><g ><g class="shape"><path d="M431 202h257v146H431z" class="stroke-B1 fill-B5 s1"/></g><text x="559.5" y="240.5" class="text-bold fill-N1 s0"><tspan x="559.5" dy="0">나이와 출생 연도가</tspan><tspan x="559.5" dy="16.833">붙어 다닌다.</tspan><tspan x="559.5" dy="16.833">60세와 20세는</tspan><tspan x="559.5" dy="16.833">나이만 다른 것이 아니라</tspan><tspan x="559.5" dy="16.833">다른 시대에</tspan><tspan x="559.5" dy="16.833">다른 교육을 받고 자랐다</tspan></text></g><g ><g class="shape"><path d="M718 202h235v146H718z" class="stroke-B1 fill-B5 s1"/></g><text x="835.5" y="272.5" class="text-bold fill-N1 s0"><tspan x="835.5" dy="0">이 혼입에 이름이 있다</tspan><tspan x="835.5" dy="18.5">— 동시대집단 효과</tspan></text></g><g ><g class="shape"><path d="M428 444h242v146H428z" class="stroke-B1 fill-B5 s1"/></g><text x="549" y="482.5" class="text-bold fill-N1 s0"><tspan x="549" dy="0">나이와 측정 연도가</tspan><tspan x="549" dy="16.833">붙어 다닌다.</tspan><tspan x="549" dy="16.833">그 사이에 세상이</tspan><tspan x="549" dy="16.833">달라진 몫과</tspan><tspan x="549" dy="16.833">나이가 든 몫을</tspan><tspan x="549" dy="16.833">가를 수 없다</tspan></text></g><g ><g class="shape"><path d="M700 444h255v146H700z" class="stroke-B1 fill-B5 s1"/></g><text x="827.5" y="490.5" class="text-bold fill-N1 s0"><tspan x="827.5" dy="0">개인 안의 변화를</tspan><tspan x="827.5" dy="17">볼 수 있다.</tspan><tspan x="827.5" dy="17">집단 평균이 그대로여도</tspan><tspan x="827.5" dy="17">사람마다 다르게</tspan><tspan x="827.5" dy="17">움직이는 것이 보인다</tspan></text></g><g ><g class="shape"><path d="M428 620h242v130H428z" class="stroke-B1 fill-B5 s1"/></g><text x="549" y="658.5" class="text-bold fill-N1 s0"><tspan x="549" dy="0">같은 사람을</tspan><tspan x="549" dy="17">여러 해에 걸쳐</tspan><tspan x="549" dy="17">되풀이해 잰다.</tspan><tspan x="549" dy="17">같은 사람의</tspan><tspan x="549" dy="17">20세 · 40세 · 60세를 본다</tspan></text></g><g ><g class="shape"><path d="M700 620h255v130H700z" class="stroke-B1 fill-B5 s1"/></g><text x="827.5" y="658.5" class="text-bold fill-N1 s0"><tspan x="827.5" dy="0">탈락 — 중간에 빠지는</tspan><tspan x="827.5" dy="17">사람이 무선이 아니다.</tspan><tspan x="827.5" dy="17">남은 사람만 보면</tspan><tspan x="827.5" dy="17">표본이 바뀐 것이지</tspan><tspan x="827.5" dy="17">사람이 변한 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M428 780h242v98H428z" class="stroke-B1 fill-B5 s1"/></g><text x="549" y="818.5" class="text-bold fill-N1 s0"><tspan x="549" dy="0">연습 — 같은 검사를</tspan><tspan x="549" dy="17.667">되풀이하면</tspan><tspan x="549" dy="17.667">그 검사에 익숙해진다</tspan></text></g><g ><g class="shape"><path d="M415 974h264v146H415z" class="stroke-B1 fill-B5 s1"/></g><text x="547" y="1028.5" class="text-bold fill-N1 s0"><tspan x="547" dy="0">여러 출생 연도의 집단을</tspan><tspan x="547" dy="17.25">각각 여러 해에 걸쳐 잰다.</tspan><tspan x="547" dy="17.25">횡단과 종단을</tspan><tspan x="547" dy="17.25">겹쳐 놓은 것이다</tspan></text></g><g ><g class="shape"><path d="M709 974h260v146H709z" class="stroke-B1 fill-B5 s1"/></g><text x="839" y="1012.5" class="text-bold fill-N1 s0"><tspan x="839" dy="0">같은 나이가</tspan><tspan x="839" dy="16.833">다른 출생 연도 ·</tspan><tspan x="839" dy="16.833">다른 측정 연도에 나온다.</tspan><tspan x="839" dy="16.833">그 칸들을 견주면</tspan><tspan x="839" dy="16.833">나이 몫과 시대 몫을</tspan><tspan x="839" dy="16.833">어느 정도 갈라낼 수 있다</tspan></text></g><g ><g class="shape"><path d="M415 1150h264v162H415z" class="stroke-B1 fill-B5 s1"/></g><text x="547" y="1188.5" class="text-bold fill-N1 s0"><tspan x="547" dy="0">비용과 시간이 가장 크다.</tspan><tspan x="547" dy="16.714">그리고 셋을 완전히</tspan><tspan x="547" dy="16.714">갈라내지는 못한다 —</tspan><tspan x="547" dy="16.714">나이 = 측정 연도</tspan><tspan x="547" dy="16.714">빼기 출생 연도라서</tspan><tspan x="547" dy="16.714">둘을 정하면</tspan><tspan x="547" dy="16.714">나머지 하나가 정해진다</tspan></text></g><marker id="mk-d2-4124432332-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="M689.5 115h25" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="M559.5 174v24" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="M689.5 275h25" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="m658.715 618.971 44.855-26.913" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="M549.5 618v-24" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="M672 685h25" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="M549.5 752v24" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="M681 1047h24" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="m721.304 1121.06-42.912 26.82" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="M287 623h48s10 0 10-10V205s0-10 10-10h42" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="M307 653h88" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-3488378134)" d="M287 683h48s10 0 10 10v432s0 10 10 10h26" class="connection stroke-B1 s1" mask="url(#d2-4124432332)"/><marker id="mk-d2-4124432332-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4124432332-2177206569)" d="M985 195h44s10 0 10 10v384.75s0 10 10 10h26" class="connection stroke-B2 s4" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-2177206569)" d="M987 653h88" class="connection stroke-B2 s4" mask="url(#d2-4124432332)"/><path fill="none" marker-end="url(#mk-d2-4124432332-2177206569)" d="M1001 1135h28s10 0 10-10V716.25s0-10 10-10h26" class="connection stroke-B2 s4" mask="url(#d2-4124432332)"/><mask id="d2-4124432332" width="1432" height="1532" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1432v1532H-89z"/></mask></svg>