<svg xmlns="http://www.w3.org/2000/svg" width="4298" height="1243" class="d2-3908579022 d2-svg" viewBox="-55 -101 4298 1243"><rect width="4298" height="1243" x="-55" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3908579022 .fill-N1{fill:#0a0f25}.d2-3908579022 .fill-B4{fill:#e3e9fd}.d2-3908579022 .fill-B5{fill:#edf0fd}.d2-3908579022 .stroke-B1,.d2-3908579022 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="2176.5" cy="88" class="shape stroke-B1" rx="264.5" ry="88" style="fill:#f7f8fe;stroke-width:2"/></g><text x="2176.5" y="93.5" class="text-bold fill-N1 s0">물음 — 나이가 들면 무엇이 달라지는가</text></g><g ><g class="shape"><path d="M46 296h815v564H46z" class="stroke-B1 fill-B4 s1"/></g><text x="453.5" y="283" class="fill-N1 s2">횡단 설계</text></g><g ><g class="shape"><path d="M915 536h2453v332H915z" class="stroke-B1 fill-B4 s1"/></g><text x="2141.5" y="523" class="fill-N1 s2">종단 설계</text></g><g ><g class="shape"><path d="M3408 296h734v572h-734z" class="stroke-B1 fill-B4 s1"/></g><text x="3775" y="283" class="fill-N1 s2">계열 설계</text></g><text x="2486.5" y="1004" class="fill-N1 s0"><tspan x="2486.5" dy="0"> </tspan><tspan x="2486.5" dy="17.667">설계를 고르는 일은 ‘무엇을 혼입으로 받아들일지’ 를 고르는 일이다.</tspan><tspan x="2486.5" dy="17.667">어느 설계에서 나온 결과인지 모르면 그 결과가 나이 이야기인지 시대 이야기인지 알 수 없다</tspan></text><g ><g class="shape"><path d="M205 326h452v82H205z" class="stroke-B1 fill-B5 s1"/></g><text x="431" y="364.5" class="text-bold fill-N1 s0"><tspan x="431" dy="0">한 시점에 나이가 다른 사람들을 한꺼번에 잰다.</tspan><tspan x="431" dy="18.5">20세 · 40세 · 60세 집단을 올해 같이 검사한다</tspan></text></g><g ><g class="shape"><path d="M76 574h307v66H76z" class="stroke-B1 fill-B5 s1"/></g><text x="229.5" y="612.5" class="text-bold fill-N1 s0">싸고 빠르다. 한 번만 재면 된다</text></g><g ><g class="shape"><path d="M443 558h378v98H443z" class="stroke-B1 fill-B5 s1"/></g><text x="632" y="596.5" class="text-bold fill-N1 s0"><tspan x="632" dy="0">나이와 출생 연도가 붙어 다닌다.</tspan><tspan x="632" dy="17.667">60세와 20세는 나이만 다른 것이 아니라</tspan><tspan x="632" dy="17.667">다른 시대에 다른 교육을 받고 자랐다</tspan></text></g><g ><g class="shape"><path d="M434 764h397v66H434z" class="stroke-B1 fill-B5 s1"/></g><text x="632.5" y="802.5" class="text-bold fill-N1 s0">이 혼입에 이름이 있다 — 동시대집단 효과</text></g><g ><g class="shape"><path d="M1971 566h412v82h-412z" class="stroke-B1 fill-B5 s1"/></g><text x="2177" y="604.5" class="text-bold fill-N1 s0"><tspan x="2177" dy="0">같은 사람을 여러 해에 걸쳐 되풀이해 잰다.</tspan><tspan x="2177" dy="18.5">같은 사람의 20세 · 40세 · 60세를 본다</tspan></text></g><g ><g class="shape"><path d="M945 756h592v82H945z" class="stroke-B1 fill-B5 s1"/></g><text x="1241" y="794.5" class="text-bold fill-N1 s0"><tspan x="1241" dy="0">개인 안의 변화를 볼 수 있다.</tspan><tspan x="1241" dy="18.5">집단 평균이 그대로여도 사람마다 다르게 움직이는 것이 보인다</tspan></text></g><g ><g class="shape"><path d="M1597 756h541v82h-541z" class="stroke-B1 fill-B5 s1"/></g><text x="1867.5" y="794.5" class="text-bold fill-N1 s0"><tspan x="1867.5" dy="0">나이와 측정 연도가 붙어 다닌다.</tspan><tspan x="1867.5" dy="18.5">그 사이에 세상이 달라진 몫과 나이가 든 몫을 가를 수 없다</tspan></text></g><g ><g class="shape"><path d="M2198 756h578v82h-578z" class="stroke-B1 fill-B5 s1"/></g><text x="2487" y="794.5" class="text-bold fill-N1 s0"><tspan x="2487" dy="0">탈락 — 중간에 빠지는 사람이 무선이 아니다.</tspan><tspan x="2487" dy="18.5">남은 사람만 보면 표본이 바뀐 것이지 사람이 변한 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M2836 764h502v66h-502z" class="stroke-B1 fill-B5 s1"/></g><text x="3087" y="802.5" class="text-bold fill-N1 s0">연습 — 같은 검사를 되풀이하면 그 검사에 익숙해진다</text></g><g ><g class="shape"><path d="M3535 326h479v82h-479z" class="stroke-B1 fill-B5 s1"/></g><text x="3774.5" y="364.5" class="text-bold fill-N1 s0"><tspan x="3774.5" dy="0">여러 출생 연도의 집단을 각각 여러 해에 걸쳐 잰다.</tspan><tspan x="3774.5" dy="18.5">횡단과 종단을 겹쳐 놓은 것이다</tspan></text></g><g ><g class="shape"><path d="M3482 566h585v82h-585z" class="stroke-B1 fill-B5 s1"/></g><text x="3774.5" y="604.5" class="text-bold fill-N1 s0"><tspan x="3774.5" dy="0">같은 나이가 다른 출생 연도 · 다른 측정 연도에 나온다.</tspan><tspan x="3774.5" dy="18.5">그 칸들을 견주면 나이 몫과 시대 몫을 어느 정도 갈라낼 수 있다</tspan></text></g><g ><g class="shape"><path d="M3438 756h674v82h-674z" class="stroke-B1 fill-B5 s1"/></g><text x="3775" y="794.5" class="text-bold fill-N1 s0"><tspan x="3775" dy="0">비용과 시간이 가장 크다. 그리고 셋을 완전히 갈라내지는 못한다 —</tspan><tspan x="3775" dy="18.5">나이 = 측정 연도 빼기 출생 연도라서 둘을 정하면 나머지 하나가 정해진다</tspan></text></g><marker id="mk-d2-3908579022-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M338.926 408.821C251.95 448 229.75 521.2 229.75 570" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M523.074 408.821C610.05 448 632.25 518 632.25 554" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M632.25 658v102" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M1968.761 628.992C1386.55 690.556 1240.5 716 1240.5 752" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M2046.095 648.61C1903.2 694.4 1867 716 1867 752" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M2307.405 648.61C2450.3 694.4 2486.5 716 2486.5 752" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M2384.488 629.217C2945.7 690.6 3086.5 717.6 3086.5 760" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M3774.5 410v152" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M3774.5 650v102" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M1917.006 108.158C728.6 202.4 431 231.8 431 251" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M2176.99 178c-.19 38-.24 58-.24 73v240" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-3488378134)" d="M2434.993 110.172C3506.2 202.8 3774.5 231.8 3774.5 251" class="connection stroke-B1 s1" mask="url(#d2-3908579022)"/><marker id="mk-d2-3908579022-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3908579022-2177206569)" d="M632.25 862c0 60.4 294.2 88.2 1467.003 136.834" class="connection stroke-B2 s4" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-2177206569)" d="M2486.5 870v114" class="connection stroke-B2 s4" mask="url(#d2-3908579022)"/><path fill="none" marker-end="url(#mk-d2-3908579022-2177206569)" d="M3774.5 870c0 54-181 78.8-901.007 121.762" class="connection stroke-B2 s4" mask="url(#d2-3908579022)"/><mask id="d2-3908579022" width="4298" height="1243" x="-55" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-55-101h4298v1243H-55z"/></mask></svg>