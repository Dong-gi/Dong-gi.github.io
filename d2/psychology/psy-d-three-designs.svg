<svg xmlns="http://www.w3.org/2000/svg" width="1912" height="1604" class="d2-2281874844 d2-svg" viewBox="-101 -101 1912 1604"><rect width="1912" height="1604" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2281874844 .fill-N1{fill:#0a0f25}.d2-2281874844 .fill-B4{fill:#e3e9fd}.d2-2281874844 .fill-B5{fill:#edf0fd}.d2-2281874844 .stroke-B1,.d2-2281874844 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="147" cy="701" class="shape stroke-B1" rx="147" ry="49" style="fill:#f7f8fe;stroke-width:2"/></g><text x="147" y="698.5" class="text-bold fill-N1 s0"><tspan x="147" dy="0">물음 — 나이가 들면</tspan><tspan x="147" dy="18.5">무엇이 달라지는가</tspan></text></g><g ><g class="shape"><path d="M475 0h748v378H475z" class="stroke-B1 fill-B4 s1"/></g><text x="849" y="33" class="fill-N1 s2">횡단 설계</text></g><g ><g class="shape"><path d="M455 438h789v526H455z" class="stroke-B1 fill-B4 s1"/></g><text x="849.5" y="471" class="fill-N1 s2">종단 설계</text></g><g ><g class="shape"><path d="M394 1024h910v378H394z" class="stroke-B1 fill-B4 s1"/></g><text x="849" y="1057" class="fill-N1 s2">계열 설계</text></g><text x="1557" y="659" class="fill-N1 s0"><tspan x="1557" dy="0"> </tspan><tspan x="1557" dy="16.714">설계를 고르는 일은</tspan><tspan x="1557" dy="16.714">‘무엇을 혼입으로 받아들일지’ 를</tspan><tspan x="1557" dy="16.714">고르는 일이다.</tspan><tspan x="1557" dy="16.714">어느 설계에서 나온 결과인지 모르면</tspan><tspan x="1557" dy="16.714">그 결과가 나이 이야기인지</tspan><tspan x="1557" dy="16.714">시대 이야기인지 알 수 없다</tspan></text><g ><g class="shape"><path d="M525 50h363v114H525z" class="stroke-B1 fill-B5 s1"/></g><text x="706.5" y="88.5" class="text-bold fill-N1 s0"><tspan x="706.5" dy="0">한 시점에 나이가 다른 사람들을</tspan><tspan x="706.5" dy="17.25">한꺼번에 잰다.</tspan><tspan x="706.5" dy="17.25">20세 · 40세 · 60세 집단을</tspan><tspan x="706.5" dy="17.25">올해 같이 검사한다</tspan></text></g><g ><g class="shape"><path d="M938 50h235v114H938z" class="stroke-B1 fill-B5 s1"/></g><text x="1055.5" y="104.5" class="text-bold fill-N1 s0"><tspan x="1055.5" dy="0">싸고 빠르다.</tspan><tspan x="1055.5" dy="18.5">한 번만 재면 된다</tspan></text></g><g ><g class="shape"><path d="M525 214h363v114H525z" class="stroke-B1 fill-B5 s1"/></g><text x="706.5" y="252.5" class="text-bold fill-N1 s0"><tspan x="706.5" dy="0">나이와 출생 연도가 붙어 다닌다.</tspan><tspan x="706.5" dy="17.25">60세와 20세는</tspan><tspan x="706.5" dy="17.25">나이만 다른 것이 아니라</tspan><tspan x="706.5" dy="17.25">다른 시대에 다른 교육을 받고 자랐다</tspan></text></g><g ><g class="shape"><path d="M938 214h235v114H938z" class="stroke-B1 fill-B5 s1"/></g><text x="1055.5" y="268.5" class="text-bold fill-N1 s0"><tspan x="1055.5" dy="0">이 혼입에 이름이 있다</tspan><tspan x="1055.5" dy="18.5">— 동시대집단 효과</tspan></text></g><g ><g class="shape"><path d="M505 488h349v114H505z" class="stroke-B1 fill-B5 s1"/></g><text x="679.5" y="534.5" class="text-bold fill-N1 s0"><tspan x="679.5" dy="0">나이와 측정 연도가 붙어 다닌다.</tspan><tspan x="679.5" dy="17.667">그 사이에 세상이 달라진 몫과</tspan><tspan x="679.5" dy="17.667">나이가 든 몫을 가를 수 없다</tspan></text></g><g ><g class="shape"><path d="M904 488h290v114H904z" class="stroke-B1 fill-B5 s1"/></g><text x="1049" y="526.5" class="text-bold fill-N1 s0"><tspan x="1049" dy="0">개인 안의 변화를 볼 수 있다.</tspan><tspan x="1049" dy="17.25">집단 평균이 그대로여도</tspan><tspan x="1049" dy="17.25">사람마다 다르게</tspan><tspan x="1049" dy="17.25">움직이는 것이 보인다</tspan></text></g><g ><g class="shape"><path d="M505 652h349v130H505z" class="stroke-B1 fill-B5 s1"/></g><text x="679.5" y="706.5" class="text-bold fill-N1 s0"><tspan x="679.5" dy="0">같은 사람을 여러 해에 걸쳐</tspan><tspan x="679.5" dy="17.667">되풀이해 잰다.</tspan><tspan x="679.5" dy="17.667">같은 사람의 20세 · 40세 · 60세를 본다</tspan></text></g><g ><g class="shape"><path d="M904 652h290v130H904z" class="stroke-B1 fill-B5 s1"/></g><text x="1049" y="690.5" class="text-bold fill-N1 s0"><tspan x="1049" dy="0">탈락 — 중간에 빠지는 사람이</tspan><tspan x="1049" dy="17">무선이 아니다.</tspan><tspan x="1049" dy="17">남은 사람만 보면</tspan><tspan x="1049" dy="17">표본이 바뀐 것이지</tspan><tspan x="1049" dy="17">사람이 변한 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M505 832h349v82H505z" class="stroke-B1 fill-B5 s1"/></g><text x="679.5" y="870.5" class="text-bold fill-N1 s0"><tspan x="679.5" dy="0">연습 — 같은 검사를 되풀이하면</tspan><tspan x="679.5" dy="18.5">그 검사에 익숙해진다</tspan></text></g><g ><g class="shape"><path d="M444 1074h394v114H444z" class="stroke-B1 fill-B5 s1"/></g><text x="641" y="1120.5" class="text-bold fill-N1 s0"><tspan x="641" dy="0">여러 출생 연도의 집단을</tspan><tspan x="641" dy="17.667">각각 여러 해에 걸쳐 잰다.</tspan><tspan x="641" dy="17.667">횡단과 종단을 겹쳐 놓은 것이다</tspan></text></g><g ><g class="shape"><path d="M888 1074h366v114H888z" class="stroke-B1 fill-B5 s1"/></g><text x="1071" y="1112.5" class="text-bold fill-N1 s0"><tspan x="1071" dy="0">같은 나이가 다른 출생 연도 ·</tspan><tspan x="1071" dy="17.25">다른 측정 연도에 나온다.</tspan><tspan x="1071" dy="17.25">그 칸들을 견주면 나이 몫과 시대 몫을</tspan><tspan x="1071" dy="17.25">어느 정도 갈라낼 수 있다</tspan></text></g><g ><g class="shape"><path d="M444 1238h394v114H444z" class="stroke-B1 fill-B5 s1"/></g><text x="641" y="1276.5" class="text-bold fill-N1 s0"><tspan x="641" dy="0">비용과 시간이 가장 크다.</tspan><tspan x="641" dy="17.25">그리고 셋을 완전히 갈라내지는 못한다 —</tspan><tspan x="641" dy="17.25">나이 = 측정 연도 빼기 출생 연도라서</tspan><tspan x="641" dy="17.25">둘을 정하면 나머지 하나가 정해진다</tspan></text></g><marker id="mk-d2-2281874844-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="M889.5 107h45" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="M706.5 166v44" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="M889.5 271h45" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="m820.812 651.153 101.564-47.46" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="M679.5 650v-44" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="M856 717h44" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="M679.5 784v44" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="M840 1131h44" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="m920.131 1188.713-125.394 47.86" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="M166.718 650.133C308.4 281.6 370.2 189 471 189" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="M296 701h154.5" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-3488378134)" d="M166.718 751.867C308.4 1120.4 354 1213 390 1213" class="connection stroke-B1 s1" mask="url(#d2-2281874844)"/><marker id="mk-d2-2281874844-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2281874844-2177206569)" d="M1225 189c102.8 0 164.961 90.7 307.33 449.782" class="connection stroke-B2 s4" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-2177206569)" d="M1246.5 701H1400" class="connection stroke-B2 s4" mask="url(#d2-2281874844)"/><path fill="none" marker-end="url(#mk-d2-2281874844-2177206569)" d="M1306 1213c38 0 84-90.6 226.523-449.283" class="connection stroke-B2 s4" mask="url(#d2-2281874844)"/><mask id="d2-2281874844" width="1912" height="1604" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1912v1604H-101z"/></mask></svg>