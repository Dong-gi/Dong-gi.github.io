<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1611" class="d2-499514171 d2-svg" viewBox="-101 -101 1420 1611"><rect width="1420" height="1611" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-499514171 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-499514171 .fill-N1{fill:#0a0f25}.d2-499514171 .fill-B4{fill:#e3e9fd}.d2-499514171 .fill-B5{fill:#edf0fd}.d2-499514171 .stroke-B1,.d2-499514171 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="298" cy="67" class="shape stroke-B1" rx="298" ry="67" style="fill:#f7f8fe;stroke-width:2"/></g><text x="298" y="64.5" class="text-bold fill-N1 s0"><tspan x="298" dy="0">‘이 영역이 이 일을 한다’ 고</tspan><tspan x="298" dy="18.5">말하려면 무엇이 필요한가</tspan></text></g><path fill="transparent" stroke="transparent" d="M686 0h532v134H686z" class="shape s1"/><g ><g class="shape"><path d="M0 224h596v476H0z" class="stroke-B1 fill-B4 s1"/></g><text x="298" y="257" class="fill-N1 s2">단일 해리 — 사례 하나</text></g><g ><g class="shape"><path fill="transparent" d="M686 224h532v476H686z" class="stroke-B2 s3"/></g><text x="952" y="435.5" class="text-bold fill-N1 s0"><tspan x="952" dy="0">그리고 함정이 하나 더 있다 —</tspan><tspan x="952" dy="17">과제 갑이 과제 을보다 ‘그냥 더 어렵다면’,</tspan><tspan x="952" dy="17">어느 영역이 손상되어도 갑이 먼저 무너진다.</tspan><tspan x="952" dy="17">그러면 ‘A 는 갑 전용’ 이 아니라</tspan><tspan x="952" dy="17">‘갑이 약한 고리’ 일 뿐이다</tspan></text></g><g ><g class="shape"><path d="M0 831h596v387H0z" class="stroke-B1 fill-B4 s1"/></g><text x="298" y="818" class="fill-N1 s2">이중 해리 — 엇갈리는 두 사례</text></g><g ><g class="shape"><path d="M686 790h532v428H686z" class="stroke-B1 fill-B4 s1"/></g><text x="952" y="823" class="fill-N1 s2">이중 해리로도 나오지 않는 것</text></g><path fill="transparent" stroke="transparent" d="M0 1308h596v101H0z" class="shape s1"/><text x="952" y="1324" class="fill-N1 s0"><tspan x="952" dy="0"> </tspan><tspan x="952" dy="16.833">정리 — 이중 해리는 ‘기능이 나뉘어 있다’ 는 주장을 지지하고,</tspan><tspan x="952" dy="16.833">‘어디에 있다’ 는 주장은 그보다 훨씬 약하게만 지지한다.</tspan><tspan x="952" dy="16.833"> </tspan><tspan x="952" dy="16.833">이 장에서 되풀이할 문장 — ‘필요하다’ 와 ‘거기서 일어난다’ 와</tspan><tspan x="952" dy="16.833">‘그것만 한다’ 는 서로 다른 세 주장이다</tspan></text><g ><g class="shape"><path d="M40 270h402v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="241" y="308.5" class="text-bold fill-N1 s0">영역 A 가 손상된 사람이 과제 갑을 못 한다</text></g><g ><g class="shape"><path d="M40 376h402v82H40z" class="stroke-B1 fill-B5 s1"/></g><text x="241" y="414.5" class="text-bold fill-N1 s0"><tspan x="241" dy="0">여기서 나오는 결론 —</tspan><tspan x="241" dy="18.5">A 는 갑에 ‘필요하다’. 그 이상은 아니다</tspan></text></g><g ><g class="shape"><path d="M40 498h402v162H40z" class="stroke-B1 fill-B5 s1"/></g><text x="241" y="536.5" class="text-bold fill-N1 s0"><tspan x="241" dy="0">나오지 않는 결론</tspan><tspan x="241" dy="16.714">· A 가 갑‘만’ 한다 —</tspan><tspan x="241" dy="16.714"> 다른 과제도 못 하는지 재지 않았다</tspan><tspan x="241" dy="16.714">· A 가 갑을 ‘하는 곳’ 이다 —</tspan><tspan x="241" dy="16.714"> 전선이 끊겨도 전구는 꺼진다</tspan><tspan x="241" dy="16.714">· 갑이 A 에서 일어난다 — 필요하다는 것과</tspan><tspan x="241" dy="16.714"> 거기서 일어난다는 것은 다르다</tspan></text></g><g ><g class="shape"><path d="M30 861h238v82H30z" class="stroke-B1 fill-B5 s1"/></g><text x="149" y="899.5" class="text-bold fill-N1 s0"><tspan x="149" dy="0">사례 1 — 영역 A 손상:</tspan><tspan x="149" dy="18.5">갑은 못 하고 을은 한다</tspan></text></g><g ><g class="shape"><path d="M328 861h238v82H328z" class="stroke-B1 fill-B5 s1"/></g><text x="447" y="899.5" class="text-bold fill-N1 s0"><tspan x="447" dy="0">사례 2 — 영역 B 손상:</tspan><tspan x="447" dy="18.5">을은 못 하고 갑은 한다</tspan></text></g><g ><g class="shape"><path d="M97 1043h403v98H97z" class="stroke-B1 fill-B5 s1"/></g><text x="298.5" y="1081.5" class="text-bold fill-N1 s0"><tspan x="298.5" dy="0">이제 따라 나오는 결론 —</tspan><tspan x="298.5" dy="17.667">갑과 을은 ‘서로 다른 것에 기대고 있다’.</tspan><tspan x="298.5" dy="17.667">난이도만으로는 이 엇갈림이 나올 수 없다</tspan></text></g><g ><g class="shape"><path d="M712 836h407v98H712z" class="stroke-B1 fill-B5 s1"/></g><text x="915.5" y="874.5" class="text-bold fill-N1 s0"><tspan x="915.5" dy="0">· ‘A 가 갑을 담당하는 부위’ 라는 결론.</tspan><tspan x="915.5" dy="17.667"> A 는 갑에 필요한 여러 부분 가운데</tspan><tspan x="915.5" dy="17.667"> 하나일 뿐일 수 있다</tspan></text></g><g ><g class="shape"><path d="M712 958h407v98H712z" class="stroke-B1 fill-B5 s1"/></g><text x="915.5" y="996.5" class="text-bold fill-N1 s0"><tspan x="915.5" dy="0">· 정상인 뇌에서 그 둘이</tspan><tspan x="915.5" dy="17.667"> 실제로 어떻게 나뉘어 일하는가.</tspan><tspan x="915.5" dy="17.667"> 손상된 뇌는 남은 부분이 다시 조직된 뇌다</tspan></text></g><g ><g class="shape"><path d="M712 1080h407v114H712z" class="stroke-B1 fill-B5 s1"/></g><text x="915.5" y="1118.5" class="text-bold fill-N1 s0"><tspan x="915.5" dy="0">· 손상의 경계가 해부학적 경계와</tspan><tspan x="915.5" dy="17.25"> 맞아떨어진다는 보장.</tspan><tspan x="915.5" dy="17.25"> 손상은 연구자가 고른 것이 아니라</tspan><tspan x="915.5" dy="17.25"> 우연히 정해진다</tspan></text></g><marker id="mk-d2-499514171-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-499514171-3488378134)" d="M241 338v34" class="connection stroke-B1 s1" mask="url(#d2-499514171)"/><path fill="none" marker-end="url(#mk-d2-499514171-3488378134)" d="M241 460v34" class="connection stroke-B1 s1" mask="url(#d2-499514171)"/><path fill="none" marker-end="url(#mk-d2-499514171-3488378134)" d="M298 136v84" class="connection stroke-B1 s1" mask="url(#d2-499514171)"/><marker id="mk-d2-499514171-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-499514171-2177206569)" d="M598 462h84" class="connection stroke-B2 s3" mask="url(#d2-499514171)"/><path fill="none" marker-end="url(#mk-d2-499514171-3488378134)" d="M149.25 945c0 38 15 58 71.672 95.781" class="connection stroke-B1 s1" mask="url(#d2-499514171)"/><path fill="none" marker-end="url(#mk-d2-499514171-3488378134)" d="M447.25 945c0 38-15 58-71.672 95.781" class="connection stroke-B1 s1" mask="url(#d2-499514171)"/><path fill="none" marker-end="url(#mk-d2-499514171-3488378134)" d="M684.487 691.808 526.025 828.883" class="connection stroke-B1 s1" mask="url(#d2-499514171)"/><text x="605" y="767" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">그래서 엇갈림이 필요하다</text><path fill="none" marker-end="url(#mk-d2-499514171-2177206569)" d="m597.999 1014.933 84.003-2.8" class="connection stroke-B2 s3" mask="url(#d2-499514171)"/><path fill="none" marker-end="url(#mk-d2-499514171-2177206569)" d="M952 1219.5v85" class="connection stroke-B2 s3" mask="url(#d2-499514171)"/><mask id="d2-499514171" width="1420" height="1611" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1420v1611H-101z"/><path d="M494 751h222v21H494z"/></mask></svg>