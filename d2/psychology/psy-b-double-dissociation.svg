<svg xmlns="http://www.w3.org/2000/svg" width="1043" height="1571" class="d2-3532369440 d2-svg" viewBox="-101 -101 1043 1571"><rect width="1043" height="1571" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3532369440 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3532369440 .fill-N1{fill:#0a0f25}.d2-3532369440 .fill-B4{fill:#e3e9fd}.d2-3532369440 .fill-B5{fill:#edf0fd}.d2-3532369440 .stroke-B1,.d2-3532369440 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="211" cy="67" class="shape stroke-B1" rx="211" ry="67" style="fill:#f7f8fe;stroke-width:2"/></g><text x="211" y="64.5" class="text-bold fill-N1 s0"><tspan x="211" dy="0">‘이 영역이 이 일을 한다’ 고</tspan><tspan x="211" dy="18.5">말하려면 무엇이 필요한가</tspan></text></g><path fill="transparent" stroke="transparent" d="M472 0h369v134H472z" class="shape s1"/><g ><g class="shape"><path d="M0 164h422v492H0z" class="stroke-B1 fill-B4 s1"/></g><text x="211" y="197" class="fill-N1 s2">단일 해리 — 사례 하나</text></g><g ><g class="shape"><path fill="transparent" d="M472 164h369v492H472z" class="stroke-B2 s3"/></g><text x="656.5" y="367.5" class="text-bold fill-N1 s0"><tspan x="656.5" dy="0">그리고 함정이 하나 더 있다 —</tspan><tspan x="656.5" dy="16.714">과제 갑이 과제 을보다</tspan><tspan x="656.5" dy="16.714">‘그냥 더 어렵다면’,</tspan><tspan x="656.5" dy="16.714">어느 영역이 손상되어도</tspan><tspan x="656.5" dy="16.714">갑이 먼저 무너진다.</tspan><tspan x="656.5" dy="16.714">그러면 ‘A 는 갑 전용’ 이 아니라</tspan><tspan x="656.5" dy="16.714">‘갑이 약한 고리’ 일 뿐이다</tspan></text></g><g ><g class="shape"><path d="M0 755h422v435H0z" class="stroke-B1 fill-B4 s1"/></g><text x="211" y="714" class="fill-N1 s2"><tspan x="211" dy="0">이중 해리 —</tspan><tspan x="211" dy="32">엇갈리는 두 사례</tspan></text></g><g ><g class="shape"><path d="M472 686h369v504H472z" class="stroke-B1 fill-B4 s1"/></g><text x="656.5" y="719" class="fill-N1 s2"><tspan x="656.5" dy="0">이중 해리로도</tspan><tspan x="656.5" dy="32">나오지 않는 것</tspan></text></g><path fill="transparent" stroke="transparent" d="M0 1220h422v149H0z" class="shape s1"/><text x="649.5" y="1236" class="fill-N1 s0"><tspan x="649.5" dy="0"> </tspan><tspan x="649.5" dy="16.556">정리 — 이중 해리는</tspan><tspan x="649.5" dy="16.556">‘기능이 나뉘어 있다’ 는 주장을 지지하고,</tspan><tspan x="649.5" dy="16.556">‘어디에 있다’ 는 주장은</tspan><tspan x="649.5" dy="16.556">그보다 훨씬 약하게만 지지한다.</tspan><tspan x="649.5" dy="16.556"> </tspan><tspan x="649.5" dy="16.556">이 장에서 되풀이할 문장 —</tspan><tspan x="649.5" dy="16.556">‘필요하다’ 와 ‘거기서 일어난다’ 와</tspan><tspan x="649.5" dy="16.556">‘그것만 한다’ 는 서로 다른 세 주장이다</tspan></text><g ><g class="shape"><path d="M24 210h316v82H24z" class="stroke-B1 fill-B5 s1"/></g><text x="182" y="248.5" class="text-bold fill-N1 s0"><tspan x="182" dy="0">영역 A 가 손상된 사람이</tspan><tspan x="182" dy="18.5">과제 갑을 못 한다</tspan></text></g><g ><g class="shape"><path d="M24 316h316v98H24z" class="stroke-B1 fill-B5 s1"/></g><text x="182" y="354.5" class="text-bold fill-N1 s0"><tspan x="182" dy="0">여기서 나오는 결론 —</tspan><tspan x="182" dy="17.667">A 는 갑에 ‘필요하다’.</tspan><tspan x="182" dy="17.667">그 이상은 아니다</tspan></text></g><g ><g class="shape"><path d="M24 438h316v194H24z" class="stroke-B1 fill-B5 s1"/></g><text x="182" y="476.5" class="text-bold fill-N1 s0"><tspan x="182" dy="0">나오지 않는 결론</tspan><tspan x="182" dy="16.556">· A 가 갑‘만’ 한다 —</tspan><tspan x="182" dy="16.556"> 다른 과제도 못 하는지</tspan><tspan x="182" dy="16.556"> 재지 않았다</tspan><tspan x="182" dy="16.556">· A 가 갑을 ‘하는 곳’ 이다 —</tspan><tspan x="182" dy="16.556"> 전선이 끊겨도 전구는 꺼진다</tspan><tspan x="182" dy="16.556">· 갑이 A 에서 일어난다 —</tspan><tspan x="182" dy="16.556"> 필요하다는 것과</tspan><tspan x="182" dy="16.556"> 거기서 일어난다는 것은 다르다</tspan></text></g><g ><g class="shape"><path d="M30 785h151v114H30z" class="stroke-B1 fill-B5 s1"/></g><text x="105.5" y="823.5" class="text-bold fill-N1 s0"><tspan x="105.5" dy="0">사례 1 —</tspan><tspan x="105.5" dy="17.25">영역 A 손상:</tspan><tspan x="105.5" dy="17.25">갑은 못 하고</tspan><tspan x="105.5" dy="17.25">을은 한다</tspan></text></g><g ><g class="shape"><path d="M241 785h151v114H241z" class="stroke-B1 fill-B5 s1"/></g><text x="316.5" y="823.5" class="text-bold fill-N1 s0"><tspan x="316.5" dy="0">사례 2 —</tspan><tspan x="316.5" dy="17.25">영역 B 손상:</tspan><tspan x="316.5" dy="17.25">을은 못 하고</tspan><tspan x="316.5" dy="17.25">갑은 한다</tspan></text></g><g ><g class="shape"><path d="M58 999h306v130H58z" class="stroke-B1 fill-B5 s1"/></g><text x="211" y="1037.5" class="text-bold fill-N1 s0"><tspan x="211" dy="0">이제 따라 나오는 결론 —</tspan><tspan x="211" dy="17">갑과 을은</tspan><tspan x="211" dy="17">‘서로 다른 것에 기대고 있다’.</tspan><tspan x="211" dy="17">난이도만으로는</tspan><tspan x="211" dy="17">이 엇갈림이 나올 수 없다</tspan></text></g><g ><g class="shape"><path d="M496 760h321v114H496z" class="stroke-B1 fill-B5 s1"/></g><text x="656.5" y="798.5" class="text-bold fill-N1 s0"><tspan x="656.5" dy="0">· ‘A 가 갑을 담당하는 부위’</tspan><tspan x="656.5" dy="17.25"> 라는 결론.</tspan><tspan x="656.5" dy="17.25"> A 는 갑에 필요한 여러 부분</tspan><tspan x="656.5" dy="17.25"> 가운데 하나일 뿐일 수 있다</tspan></text></g><g ><g class="shape"><path d="M496 898h321v114H496z" class="stroke-B1 fill-B5 s1"/></g><text x="656.5" y="936.5" class="text-bold fill-N1 s0"><tspan x="656.5" dy="0">· 정상인 뇌에서 그 둘이</tspan><tspan x="656.5" dy="17.25"> 실제로 어떻게 나뉘어 일하는가.</tspan><tspan x="656.5" dy="17.25"> 손상된 뇌는 남은 부분이</tspan><tspan x="656.5" dy="17.25"> 다시 조직된 뇌다</tspan></text></g><g ><g class="shape"><path d="M496 1036h321v130H496z" class="stroke-B1 fill-B5 s1"/></g><text x="656.5" y="1074.5" class="text-bold fill-N1 s0"><tspan x="656.5" dy="0">· 손상의 경계가</tspan><tspan x="656.5" dy="17"> 해부학적 경계와</tspan><tspan x="656.5" dy="17"> 맞아떨어진다는 보장.</tspan><tspan x="656.5" dy="17"> 손상은 연구자가 고른 것이</tspan><tspan x="656.5" dy="17"> 아니라 우연히 정해진다</tspan></text></g><marker id="mk-d2-3532369440-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-3532369440-3488378134)" d="M182 294v18" class="connection stroke-B1 s1" mask="url(#d2-3532369440)"/><path fill="none" marker-end="url(#mk-d2-3532369440-3488378134)" d="M182 416v18" class="connection stroke-B1 s1" mask="url(#d2-3532369440)"/><path fill="none" marker-end="url(#mk-d2-3532369440-3488378134)" d="M211 136v24" class="connection stroke-B1 s1" mask="url(#d2-3532369440)"/><marker id="mk-d2-3532369440-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-3532369440-2177206569)" d="M423.5 410h45" class="connection stroke-B2 s3" mask="url(#d2-3532369440)"/><path fill="none" marker-end="url(#mk-d2-3532369440-3488378134)" d="M105.25 901c0 38 9.199 58 43.292 95.056" class="connection stroke-B1 s1" mask="url(#d2-3532369440)"/><path fill="none" marker-end="url(#mk-d2-3532369440-3488378134)" d="M316.25 901c0 38-9.2 58-43.292 95.056" class="connection stroke-B1 s1" mask="url(#d2-3532369440)"/><path fill="none" marker-end="url(#mk-d2-3532369440-3488378134)" d="m470.756 644.066-85.267 107.302" class="connection stroke-B1 s1" mask="url(#d2-3532369440)"/><text x="428" y="704" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">그래서 엇갈림이 필요하다</text><path fill="none" marker-end="url(#mk-d2-3532369440-2177206569)" d="m423.494 955.844 45.018-3.531" class="connection stroke-B2 s3" mask="url(#d2-3532369440)"/><path fill="none" marker-end="url(#mk-d2-3532369440-2177206569)" d="M656.5 1191.5v25" class="connection stroke-B2 s3" mask="url(#d2-3532369440)"/><mask id="d2-3532369440" width="1043" height="1571" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H942v1571H-101z"/><path d="M317 688h222v21H317z"/></mask></svg>