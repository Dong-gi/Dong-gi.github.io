<svg xmlns="http://www.w3.org/2000/svg" width="1938" height="2180" class="d2-942498722 d2-svg" viewBox="-91 -101 1938 2180"><rect width="1938" height="2180" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-942498722 .fill-N1{fill:#0a0f25}.d2-942498722 .fill-B4{fill:#e3e9fd}.d2-942498722 .fill-B5{fill:#edf0fd}.d2-942498722 .stroke-B1,.d2-942498722 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="638" cy="121.5" class="shape stroke-B1" rx="365" ry="121.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="638" y="127" class="text-bold fill-N1 s0">‘이 영역이 이 일을 한다’ 고 말하려면 무엇이 필요한가</text></g><g ><g class="shape"><path d="M273 363h731v506H273z" class="stroke-B1 fill-B4 s1"/></g><text x="638.5" y="350" class="fill-N1 s2">단일 해리 — 사례 하나</text></g><text x="638" y="1005" class="fill-N1 s0"><tspan x="638" dy="0">그리고 함정이 하나 더 있다 —</tspan><tspan x="638" dy="17.667">과제 갑이 과제 을보다 ‘그냥 더 어렵다면’, 어느 영역이 손상되어도</tspan><tspan x="638" dy="17.667">갑이 먼저 무너진다. 그러면 ‘A 는 갑 전용’ 이 아니라 ‘갑이 약한 고리’ 일 뿐이다</tspan></text><g ><g class="shape"><path d="M402 1183h945v308H402z" class="stroke-B1 fill-B4 s1"/></g><text x="874.5" y="1170" class="fill-N1 s2">이중 해리 — 엇갈리는 두 사례</text></g><g ><g class="shape"><path d="M10 1631h1736v142H10z" class="stroke-B1 fill-B4 s1"/></g><text x="878" y="1618" class="fill-N1 s2">이중 해리로도 나오지 않는 것</text></g><text x="875" y="1909" class="fill-N1 s0"><tspan x="875" dy="0"> </tspan><tspan x="875" dy="17">정리 — 이중 해리는 ‘기능이 나뉘어 있다’ 는 주장을 지지하고,</tspan><tspan x="875" dy="17">‘어디에 있다’ 는 주장은 그보다 훨씬 약하게만 지지한다.</tspan><tspan x="875" dy="17"> </tspan><tspan x="875" dy="17">이 장에서 되풀이할 문장 — ‘필요하다’ 와 ‘거기서 일어난다’ 와 ‘그것만 한다’ 는 서로 다른 세 주장이다</tspan></text><g ><g class="shape"><path d="M437 393h402v66H437z" class="stroke-B1 fill-B5 s1"/></g><text x="638" y="431.5" class="text-bold fill-N1 s0">영역 A 가 손상된 사람이 과제 갑을 못 한다</text></g><g ><g class="shape"><path d="M354 559h568v66H354z" class="stroke-B1 fill-B5 s1"/></g><text x="638" y="597.5" class="text-bold fill-N1 s0">여기서 나오는 결론 — A 는 갑에 ‘필요하다’. 그 이상은 아니다</text></g><g ><g class="shape"><path d="M303 725h671v114H303z" class="stroke-B1 fill-B5 s1"/></g><text x="638.5" y="763.5" class="text-bold fill-N1 s0"><tspan x="638.5" dy="0">나오지 않는 결론</tspan><tspan x="638.5" dy="17.25">· A 가 갑‘만’ 한다 — 다른 과제도 못 하는지 재지 않았다</tspan><tspan x="638.5" dy="17.25">· A 가 갑을 ‘하는 곳’ 이다 — 전선이 끊겨도 전구는 꺼진다</tspan><tspan x="638.5" dy="17.25">· 갑이 A 에서 일어난다 — 필요하다는 것과 거기서 일어난다는 것은 다르다</tspan></text></g><g ><g class="shape"><path d="M432 1213h412v66H432z" class="stroke-B1 fill-B5 s1"/></g><text x="638" y="1251.5" class="text-bold fill-N1 s0">사례 1 — 영역 A 손상: 갑은 못 하고 을은 한다</text></g><g ><g class="shape"><path d="M904 1213h413v66H904z" class="stroke-B1 fill-B5 s1"/></g><text x="1110.5" y="1251.5" class="text-bold fill-N1 s0">사례 2 — 영역 B 손상: 을은 못 하고 갑은 한다</text></g><g ><g class="shape"><path d="M574 1379h602v82H574z" class="stroke-B1 fill-B5 s1"/></g><text x="875" y="1417.5" class="text-bold fill-N1 s0"><tspan x="875" dy="0">이제 따라 나오는 결론 — 갑과 을은 ‘서로 다른 것에 기대고 있다’.</tspan><tspan x="875" dy="18.5">난이도만으로는 이 엇갈림이 나올 수 없다</tspan></text></g><g ><g class="shape"><path d="M40 1661h512v82H40z" class="stroke-B1 fill-B5 s1"/></g><text x="296" y="1699.5" class="text-bold fill-N1 s0"><tspan x="296" dy="0">· ‘A 가 갑을 담당하는 부위’ 라는 결론.</tspan><tspan x="296" dy="18.5"> A 는 갑에 필요한 여러 부분 가운데 하나일 뿐일 수 있다</tspan></text></g><g ><g class="shape"><path d="M612 1661h525v82H612z" class="stroke-B1 fill-B5 s1"/></g><text x="874.5" y="1699.5" class="text-bold fill-N1 s0"><tspan x="874.5" dy="0">· 정상인 뇌에서 그 둘이 실제로 어떻게 나뉘어 일하는가.</tspan><tspan x="874.5" dy="18.5"> 손상된 뇌는 남은 부분이 다시 조직된 뇌다</tspan></text></g><g ><g class="shape"><path d="M1197 1661h519v82h-519z" class="stroke-B1 fill-B5 s1"/></g><text x="1456.5" y="1699.5" class="text-bold fill-N1 s0"><tspan x="1456.5" dy="0">· 손상의 경계가 해부학적 경계와 맞아떨어진다는 보장.</tspan><tspan x="1456.5" dy="18.5"> 손상은 연구자가 고른 것이 아니라 우연히 정해진다</tspan></text></g><marker id="mk-d2-942498722-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-942498722-3488378134)" d="M638.25 461v94" class="connection stroke-B1 s1" mask="url(#d2-942498722)"/><path fill="none" marker-end="url(#mk-d2-942498722-3488378134)" d="M638.25 627v94" class="connection stroke-B1 s1" mask="url(#d2-942498722)"/><path fill="none" marker-end="url(#mk-d2-942498722-3488378134)" d="M638.01 245c.19 38 .24 53.8.24 73" class="connection stroke-B1 s1" mask="url(#d2-942498722)"/><marker id="mk-d2-942498722-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-942498722-2177206569)" d="M638.25 871v114" class="connection stroke-B2 s4" mask="url(#d2-942498722)"/><path fill="none" marker-end="url(#mk-d2-942498722-3488378134)" d="M638.25 1281c0 38 26 58 126.267 96.564" class="connection stroke-B1 s1" mask="url(#d2-942498722)"/><path fill="none" marker-end="url(#mk-d2-942498722-3488378134)" d="M1110.75 1281c0 38-26 58-126.267 96.564" class="connection stroke-B1 s1" mask="url(#d2-942498722)"/><path fill="none" marker-end="url(#mk-d2-942498722-3488378134)" d="M638.25 1043.5v136" class="connection stroke-B1 s1" mask="url(#d2-942498722)"/><text x="638" y="1118" style="fill:#676c7e;text-anchor:middle;font-size:16px">그래서 엇갈림이 필요하다</text><path fill="none" marker-end="url(#mk-d2-942498722-2177206569)" d="M874.5 1493v93" class="connection stroke-B2 s4" mask="url(#d2-942498722)"/><path fill="none" marker-end="url(#mk-d2-942498722-2177206569)" d="M874.5 1775v114" class="connection stroke-B2 s4" mask="url(#d2-942498722)"/><mask id="d2-942498722" width="1938" height="2180" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1938v2180H-91z"/><path d="M527 1102h222v21H527z"/></mask></svg>