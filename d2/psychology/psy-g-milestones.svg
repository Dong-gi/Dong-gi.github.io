<svg xmlns="http://www.w3.org/2000/svg" width="988" height="2161" class="d2-3094758795 d2-svg" viewBox="-91 -121 988 2161"><rect width="988" height="2161" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3094758795 .fill-N1{fill:#0a0f25}.d2-3094758795 .fill-B4{fill:#e3e9fd}.d2-3094758795 .fill-B5{fill:#edf0fd}.d2-3094758795 .fill-B6{fill:#f7f8fe}.d2-3094758795 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M31 20h744v506H31z" class="stroke-B1 fill-B4 s0"/></g><text x="403" y="7" class="fill-N1 s1">말이 나오기 전</text></g><g ><g class="shape"><path d="M207 646h393v98H207z" class="stroke-B1 fill-B6 s0"/></g><text x="403.5" y="684.5" class="text-bold fill-N1 s2"><tspan x="403.5" dy="0">한 낱말 시기</tspan><tspan x="403.5" dy="17.667">낱말 하나로 문장 하나만큼의 일을 한다.</tspan><tspan x="403.5" dy="17.667">‘물’ 이 요청일 수도, 가리킴일 수도 있다</tspan></text></g><g ><g class="shape"><path d="M153 844h501v98H153z" class="stroke-B1 fill-B6 s0"/></g><text x="403.5" y="882.5" class="text-bold fill-N1 s2"><tspan x="403.5" dy="0">두 낱말 시기</tspan><tspan x="403.5" dy="17.667">낱말 둘을 붙이는데, 붙이는 순서에 이미 규칙이 있다.</tspan><tspan x="403.5" dy="17.667">조사와 어미 같은 문법 요소는 아직 거의 빠져 있다</tspan></text></g><g ><g class="shape"><path d="M10 1062h786v490H10z" class="stroke-B1 fill-B4 s0"/></g><text x="403" y="1049" class="fill-N1 s1">문법 요소가 들어온다</text></g><g ><g class="shape"><path d="M144 1672h519v98H144z" class="stroke-B1 fill-B6 s0"/></g><text x="403.5" y="1710.5" class="text-bold fill-N1 s2"><tspan x="403.5" dy="0">그 뒤로도 오래 이어진다</tspan><tspan x="403.5" dy="17.667">복잡한 문장 구조, 그리고 상황에 맞게 말을 고르는 힘은</tspan><tspan x="403.5" dy="17.667">학령기를 지나서도 계속 자란다</tspan></text></g><text x="403" y="1886" class="fill-N1 s2"><tspan x="403" dy="0"> </tspan><tspan x="403" dy="17.25">나이를 적지 않은 이유 — 순서는 여러 언어에서 비슷하게 관찰되지만</tspan><tspan x="403" dy="17.25">각 단계에 이르는 나이는 아이마다 크게 다르다.</tspan><tspan x="403" dy="17.25">평균 나이를 적어 놓으면 그 수가 기준처럼 읽히고, 그것은 이 자료가 말하는 바가 아니다</tspan></text><g ><g class="shape"><path d="M95 50h617v98H95z" class="stroke-B1 fill-B5 s0"/></g><text x="403.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="403.5" dy="0">말소리를 다른 소리와 다르게 다룬다.</tspan><tspan x="403.5" dy="17.667">처음에는 여러 언어의 소리 차이를 두루 가려내다가,</tspan><tspan x="403.5" dy="17.667">첫돌 무렵으로 가면서 ‘자기가 듣는 언어의 구별’에 맞춰 좁혀진다</tspan></text></g><g ><g class="shape"><path d="M61 248h684v66H61z" class="stroke-B1 fill-B5 s0"/></g><text x="403" y="286.5" class="text-bold fill-N1 s2">옹알이. 처음에는 소리를 굴리다가 점점 주변 언어의 소리 꼴에 가까워진다</text></g><g ><g class="shape"><path d="M102 414h603v82H102z" class="stroke-B1 fill-B5 s0"/></g><text x="403.5" y="452.5" class="text-bold fill-N1 s2"><tspan x="403.5" dy="0">말을 하기 전에 이미 여러 낱말을 알아듣는다.</tspan><tspan x="403.5" dy="18.5">알아듣는 것과 말하는 것은 늘 어긋나 있고, 알아듣는 쪽이 앞선다</tspan></text></g><g ><g class="shape"><path d="M191 1092h424v66H191z" class="stroke-B1 fill-B5 s0"/></g><text x="403" y="1130.5" class="text-bold fill-N1 s2">문장이 길어지고 문법 형태가 자리를 잡는다</text></g><g ><g class="shape"><path d="M104 1258h598v82H104z" class="stroke-B1 fill-B5 s0"/></g><text x="403" y="1296.5" class="text-bold fill-N1 s2"><tspan x="403" dy="0">규칙을 지나치게 적용하는 시기가 온다.</tspan><tspan x="403" dy="18.5">앞서 맞게 쓰던 불규칙한 꼴을 규칙대로 바꿔 말하는 일이 생긴다</tspan></text></g><g ><g class="shape"><path d="M40 1440h726v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="403" y="1478.5" class="text-bold fill-N1 s2"><tspan x="403" dy="0">이것이 중요한 이유 — 어른에게서 들어 본 적 없는 꼴을 만들어 낸다는 것이므로,</tspan><tspan x="403" dy="18.5">아이가 따라 하는 것이 아니라 규칙을 뽑아냈다는 증거가 된다</tspan></text></g><marker id="mk-d2-3094758795-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3094758795-3488378134)" d="M403 150v94" class="connection stroke-B1 s0" mask="url(#d2-3094758795)"/><path fill="none" marker-end="url(#mk-d2-3094758795-3488378134)" d="M403 316v94" class="connection stroke-B1 s0" mask="url(#d2-3094758795)"/><path fill="none" marker-end="url(#mk-d2-3094758795-3488378134)" d="M403 1160v94" class="connection stroke-B1 s0" mask="url(#d2-3094758795)"/><path fill="none" marker-end="url(#mk-d2-3094758795-3488378134)" d="M403 1342v94" class="connection stroke-B1 s0" mask="url(#d2-3094758795)"/><path fill="none" marker-end="url(#mk-d2-3094758795-3488378134)" d="M403 528v114" class="connection stroke-B1 s0" mask="url(#d2-3094758795)"/><path fill="none" marker-end="url(#mk-d2-3094758795-3488378134)" d="M403 746v94" class="connection stroke-B1 s0" mask="url(#d2-3094758795)"/><path fill="none" marker-end="url(#mk-d2-3094758795-3488378134)" d="M403 944v73" class="connection stroke-B1 s0" mask="url(#d2-3094758795)"/><path fill="none" marker-end="url(#mk-d2-3094758795-3488378134)" d="M403 1554v114" class="connection stroke-B1 s0" mask="url(#d2-3094758795)"/><marker id="mk-d2-3094758795-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3094758795-2177206569)" d="M403 1772v94" class="connection" mask="url(#d2-3094758795)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3094758795" width="988" height="2161" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h988v2161H-91z"/></mask></svg>