<svg xmlns="http://www.w3.org/2000/svg" width="1195" height="1158" class="d2-3776528061 d2-svg" viewBox="-89 -89 1195 1158"><rect width="1195" height="1158" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3776528061 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3776528061 .fill-N1{fill:#0a0f25}.d2-3776528061 .fill-B4{fill:#e3e9fd}.d2-3776528061 .fill-B5{fill:#edf0fd}.d2-3776528061 .stroke-B1,.d2-3776528061 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="501.5" cy="82.5" class="shape stroke-B1" rx="211.5" ry="70.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="501.5" y="88" class="text-bold fill-N1 s0">교과서에 함께 실려 있던 것들</text></g><g ><g class="shape"><path d="M12 233h295v554H12z" class="stroke-B1 fill-B4 s1"/></g><text x="159.5" y="266" class="fill-N1 s2"><tspan x="159.5" dy="0">검사에서</tspan><tspan x="159.5" dy="32">남은 것</tspan></text></g><g ><g class="shape"><path d="M327 330h349v360H327z" class="stroke-B1 fill-B4 s1"/></g><text x="501.5" y="363" class="fill-N1 s2"><tspan x="501.5" dy="0">검사에서</tspan><tspan x="501.5" dy="32">무너진 것</tspan></text></g><g ><g class="shape"><path d="M696 249h309v522H696z" class="stroke-B1 fill-B4 s1"/></g><text x="850.5" y="282" class="fill-N1 s2"><tspan x="850.5" dy="0">다투어지는</tspan><tspan x="850.5" dy="32">것</tspan></text></g><text x="501.5" y="883" class="fill-N1 s0"><tspan x="501.5" dy="0"> </tspan><tspan x="501.5" dy="16.833">읽을 때의 규칙 — ‘귀인 편향’ 처럼 큰 이름 아래</tspan><tspan x="501.5" dy="16.833">여러 결과가 묶여 있으면 이름 단위가 아니라</tspan><tspan x="501.5" dy="16.833">결과 단위로 재현 상태를 확인해야 한다.</tspan><tspan x="501.5" dy="16.833">하나가 무너졌다고 나머지가 무너지는 것도,</tspan><tspan x="501.5" dy="16.833">하나가 버텼다고 나머지가 버티는 것도 아니다</tspan></text><g ><g class="shape"><path d="M42 307h235v274H42z" class="stroke-B1 fill-B5 s1"/></g><text x="159.5" y="345.5" class="text-bold fill-N1 s0"><tspan x="159.5" dy="0">대응 편향</tspan><tspan x="159.5" dy="16.357">어떤 사람이</tspan><tspan x="159.5" dy="16.357">자기 뜻으로</tspan><tspan x="159.5" dy="16.357">그 글을 쓴 것이</tspan><tspan x="159.5" dy="16.357">아니라는 것을</tspan><tspan x="159.5" dy="16.357">알려 주어도,</tspan><tspan x="159.5" dy="16.357">읽는 사람은</tspan><tspan x="159.5" dy="16.357">그 글의 내용을</tspan><tspan x="159.5" dy="16.357">글쓴이의 생각으로</tspan><tspan x="159.5" dy="16.357">읽는 쪽으로 기운다.</tspan><tspan x="159.5" dy="16.357">이 절차는</tspan><tspan x="159.5" dy="16.357">여러 연구실이 함께 한</tspan><tspan x="159.5" dy="16.357">재현에 포함되어</tspan><tspan x="159.5" dy="16.357">되풀이되었다</tspan></text></g><g ><g class="shape"><path d="M42 611h235v146H42z" class="stroke-B1 fill-B5 s1"/></g><text x="159.5" y="649.5" class="text-bold fill-N1 s0"><tspan x="159.5" dy="0">자기고양 편향</tspan><tspan x="159.5" dy="16.833">잘된 일은 자기 쪽에,</tspan><tspan x="159.5" dy="16.833">안된 일은 바깥에</tspan><tspan x="159.5" dy="16.833">돌리는 기울기.</tspan><tspan x="159.5" dy="16.833">여러 자료에서</tspan><tspan x="159.5" dy="16.833">되풀이 관찰되었다</tspan></text></g><g ><g class="shape"><path d="M387 404h229v226H387z" class="stroke-B1 fill-B5 s1"/></g><text x="501.5" y="442.5" class="text-bold fill-N1 s0"><tspan x="501.5" dy="0">행위자-관찰자</tspan><tspan x="501.5" dy="16.455">비대칭</tspan><tspan x="501.5" dy="16.455">‘내 행동은 상황으로,</tspan><tspan x="501.5" dy="16.455">남의 행동은</tspan><tspan x="501.5" dy="16.455">성향으로</tspan><tspan x="501.5" dy="16.455">설명한다’ 는 명제.</tspan><tspan x="501.5" dy="16.455">오래 교과서에</tspan><tspan x="501.5" dy="16.455">실려 있었으나</tspan><tspan x="501.5" dy="16.455">메타분석에서</tspan><tspan x="501.5" dy="16.455">전체 효과가</tspan><tspan x="501.5" dy="16.455">거의 0 이었다</tspan></text></g><g ><g class="shape"><path d="M726 323h249v210H726z" class="stroke-B1 fill-B5 s1"/></g><text x="850.5" y="361.5" class="text-bold fill-N1 s0"><tspan x="850.5" dy="0">이 기울기를</tspan><tspan x="850.5" dy="16.5">‘기본적’ 이라</tspan><tspan x="850.5" dy="16.5">부를 수 있는가</tspan><tspan x="850.5" dy="16.5">상황 정보를</tspan><tspan x="850.5" dy="16.5">얼마나 쓰는지가</tspan><tspan x="850.5" dy="16.5">문화에 따라</tspan><tspan x="850.5" dy="16.5">다르다는 보고들이</tspan><tspan x="850.5" dy="16.5">있다.</tspan><tspan x="850.5" dy="16.5">그 차이의 크기와</tspan><tspan x="850.5" dy="16.5">조건은 논쟁 중이다</tspan></text></g><g ><g class="shape"><path d="M726 563h249v178H726z" class="stroke-B1 fill-B5 s1"/></g><text x="850.5" y="601.5" class="text-bold fill-N1 s0"><tspan x="850.5" dy="0">이것이 오류인가</tspan><tspan x="850.5" dy="16.625">사람들이</tspan><tspan x="850.5" dy="16.625">성향을 앞세우는 것이</tspan><tspan x="850.5" dy="16.625">잘못된 추론이라기보다</tspan><tspan x="850.5" dy="16.625">실제 세계에서</tspan><tspan x="850.5" dy="16.625">대체로 쓸 만한</tspan><tspan x="850.5" dy="16.625">어림법일 수 있다는</tspan><tspan x="850.5" dy="16.625">반론이 있다</tspan></text></g><marker id="mk-d2-3776528061-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3776528061-3488378134)" d="m395.99 146-.189 37s-.051 10-10.051 10H169.5s-10 0-10 10v26" class="connection stroke-B1 s1" mask="url(#d2-3776528061)"/><path fill="none" marker-end="url(#mk-d2-3776528061-3488378134)" d="m501.989 155-.966 171" class="connection stroke-B1 s1" mask="url(#d2-3776528061)"/><path fill="none" marker-end="url(#mk-d2-3776528061-3488378134)" d="m607.01 146 .189 37s.051 10 10.051 10H840.5s10 0 10 10v42" class="connection stroke-B1 s1" mask="url(#d2-3776528061)"/><marker id="mk-d2-3776528061-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3776528061-2177206569)" d="M159.5 789v28s0 10 10 10h223.75s10 0 10 10v26" class="connection stroke-B2 s4" mask="url(#d2-3776528061)"/><path fill="none" marker-end="url(#mk-d2-3776528061-2177206569)" d="M501.5 692v171" class="connection stroke-B2 s4" mask="url(#d2-3776528061)"/><path fill="none" marker-end="url(#mk-d2-3776528061-2177206569)" d="M850.5 773v44s0 10-10 10H609.75s-10 0-10 10v26" class="connection stroke-B2 s4" mask="url(#d2-3776528061)"/><mask id="d2-3776528061" width="1195" height="1158" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1195v1158H-89z"/></mask></svg>