<svg xmlns="http://www.w3.org/2000/svg" width="2334" height="1220" class="d2-2340204829 d2-svg" viewBox="-101 -85 2334 1220"><rect width="2334" height="1220" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2340204829 .fill-N1{fill:#0a0f25}.d2-2340204829 .fill-B4{fill:#e3e9fd}.d2-2340204829 .fill-B5{fill:#edf0fd}.d2-2340204829 .stroke-B1,.d2-2340204829 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="211.5" cy="553.5" class="shape stroke-B1" rx="211.5" ry="70.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="211.5" y="559" class="text-bold fill-N1 s0">교과서에 함께 실려 있던 것들</text></g><g ><g class="shape"><path d="M551 56h691v332H551z" class="stroke-B1 fill-B4 s1"/></g><text x="896.5" y="43" class="fill-N1 s2">검사에서 남은 것</text></g><g ><g class="shape"><path d="M543 474h707v158H543z" class="stroke-B1 fill-B4 s1"/></g><text x="896.5" y="461" class="fill-N1 s2">검사에서 무너진 것</text></g><g ><g class="shape"><path d="M557 718h680v316H557z" class="stroke-B1 fill-B4 s1"/></g><text x="897" y="705" class="fill-N1 s2">다투어지는 것</text></g><text x="1751" y="535" class="fill-N1 s0"><tspan x="1751" dy="0"> </tspan><tspan x="1751" dy="17.25">읽을 때의 규칙 — ‘귀인 편향’ 처럼 큰 이름 아래 여러 결과가 묶여 있으면</tspan><tspan x="1751" dy="17.25">이름 단위가 아니라 결과 단위로 재현 상태를 확인해야 한다.</tspan><tspan x="1751" dy="17.25">하나가 무너졌다고 나머지가 무너지는 것도, 하나가 버텼다고 나머지가 버티는 것도 아니다</tspan></text><g ><g class="shape"><path d="M581 86h631v114H581z" class="stroke-B1 fill-B5 s1"/></g><text x="896.5" y="124.5" class="text-bold fill-N1 s0"><tspan x="896.5" dy="0">대응 편향</tspan><tspan x="896.5" dy="17.25">어떤 사람이 자기 뜻으로 그 글을 쓴 것이 아니라는 것을 알려 주어도,</tspan><tspan x="896.5" dy="17.25">읽는 사람은 그 글의 내용을 글쓴이의 생각으로 읽는 쪽으로 기운다.</tspan><tspan x="896.5" dy="17.25">이 절차는 여러 연구실이 함께 한 재현에 포함되어 되풀이되었다</tspan></text></g><g ><g class="shape"><path d="M645 260h504v98H645z" class="stroke-B1 fill-B5 s1"/></g><text x="897" y="298.5" class="text-bold fill-N1 s0"><tspan x="897" dy="0">자기고양 편향</tspan><tspan x="897" dy="17.667">잘된 일은 자기 쪽에, 안된 일은 바깥에 돌리는 기울기.</tspan><tspan x="897" dy="17.667">여러 자료에서 되풀이 관찰되었다</tspan></text></g><g ><g class="shape"><path d="M573 504h647v98H573z" class="stroke-B1 fill-B5 s1"/></g><text x="896.5" y="542.5" class="text-bold fill-N1 s0"><tspan x="896.5" dy="0">행위자-관찰자 비대칭</tspan><tspan x="896.5" dy="17.667">‘내 행동은 상황으로, 남의 행동은 성향으로 설명한다’ 는 명제.</tspan><tspan x="896.5" dy="17.667">오래 교과서에 실려 있었으나 메타분석에서 전체 효과가 거의 0 이었다</tspan></text></g><g ><g class="shape"><path d="M587 748h620v98H587z" class="stroke-B1 fill-B5 s1"/></g><text x="897" y="786.5" class="text-bold fill-N1 s0"><tspan x="897" dy="0">이 기울기를 ‘기본적’ 이라 부를 수 있는가</tspan><tspan x="897" dy="17.667">상황 정보를 얼마나 쓰는지가 문화에 따라 다르다는 보고들이 있다.</tspan><tspan x="897" dy="17.667">그 차이의 크기와 조건은 논쟁 중이다</tspan></text></g><g ><g class="shape"><path d="M608 906h578v98H608z" class="stroke-B1 fill-B5 s1"/></g><text x="897" y="944.5" class="text-bold fill-N1 s0"><tspan x="897" dy="0">이것이 오류인가</tspan><tspan x="897" dy="17.667">사람들이 성향을 앞세우는 것이 잘못된 추론이라기보다</tspan><tspan x="897" dy="17.667">실제 세계에서 대체로 쓸 만한 어림법일 수 있다는 반론이 있다</tspan></text></g><marker id="mk-d2-2340204829-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2340204829-3488378134)" d="M299.394 487.566C438 345 488.6 309 547 309" class="connection stroke-B1 s1" mask="url(#d2-2340204829)"/><path fill="none" marker-end="url(#mk-d2-2340204829-3488378134)" d="M425 553h114" class="connection stroke-B1 s1" mask="url(#d2-2340204829)"/><path fill="none" marker-end="url(#mk-d2-2340204829-3488378134)" d="M263.07 623.69C430.8 888.4 489.8 955 553 955" class="connection stroke-B1 s1" mask="url(#d2-2340204829)"/><marker id="mk-d2-2340204829-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2340204829-2177206569)" d="M1244 309c60.4 0 147.18 41.9 428.454 207.47" class="connection stroke-B2 s4" mask="url(#d2-2340204829)"/><path fill="none" marker-end="url(#mk-d2-2340204829-2177206569)" d="M1252 553h114" class="connection stroke-B2 s4" mask="url(#d2-2340204829)"/><path fill="none" marker-end="url(#mk-d2-2340204829-2177206569)" d="M1239 955c64.4 0 158.8-73.4 467.09-364.255" class="connection stroke-B2 s4" mask="url(#d2-2340204829)"/><mask id="d2-2340204829" width="2334" height="1220" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h2334v1220H-101z"/></mask></svg>