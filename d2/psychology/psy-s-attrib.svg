<svg xmlns="http://www.w3.org/2000/svg" width="1563" height="1042" class="d2-44891080 d2-svg" viewBox="-101 -101 1563 1042"><rect width="1563" height="1042" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-44891080 .fill-N1{fill:#0a0f25}.d2-44891080 .fill-B4{fill:#e3e9fd}.d2-44891080 .fill-B5{fill:#edf0fd}.d2-44891080 .stroke-B1,.d2-44891080 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="668.5" cy="70.5" class="shape stroke-B1" rx="211.5" ry="70.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="668.5" y="76" class="text-bold fill-N1 s0">교과서에 함께 실려 있던 것들</text></g><g ><g class="shape"><path d="M0 241h400v398H0z" class="stroke-B1 fill-B4 s1"/></g><text x="200" y="274" class="fill-N1 s2">검사에서 남은 것</text></g><g ><g class="shape"><path d="M460 292h416v296H460z" class="stroke-B1 fill-B4 s1"/></g><text x="668" y="325" class="fill-N1 s2"><tspan x="668" dy="0">검사에서</tspan><tspan x="668" dy="32">무너진 것</tspan></text></g><g ><g class="shape"><path d="M936 257h425v366H936z" class="stroke-B1 fill-B4 s1"/></g><text x="1148.5" y="290" class="fill-N1 s2">다투어지는 것</text></g><text x="668.5" y="755" class="fill-N1 s0"><tspan x="668.5" dy="0"> </tspan><tspan x="668.5" dy="16.833">읽을 때의 규칙 — ‘귀인 편향’ 처럼 큰 이름 아래</tspan><tspan x="668.5" dy="16.833">여러 결과가 묶여 있으면 이름 단위가 아니라</tspan><tspan x="668.5" dy="16.833">결과 단위로 재현 상태를 확인해야 한다.</tspan><tspan x="668.5" dy="16.833">하나가 무너졌다고 나머지가 무너지는 것도,</tspan><tspan x="668.5" dy="16.833">하나가 버텼다고 나머지가 버티는 것도 아니다</tspan></text><g ><g class="shape"><path d="M30 287h340v178H30z" class="stroke-B1 fill-B5 s1"/></g><text x="200" y="325.5" class="text-bold fill-N1 s0"><tspan x="200" dy="0">대응 편향</tspan><tspan x="200" dy="16.625">어떤 사람이 자기 뜻으로</tspan><tspan x="200" dy="16.625">그 글을 쓴 것이 아니라는 것을</tspan><tspan x="200" dy="16.625">알려 주어도, 읽는 사람은</tspan><tspan x="200" dy="16.625">그 글의 내용을 글쓴이의 생각으로</tspan><tspan x="200" dy="16.625">읽는 쪽으로 기운다.</tspan><tspan x="200" dy="16.625">이 절차는 여러 연구실이 함께 한</tspan><tspan x="200" dy="16.625">재현에 포함되어 되풀이되었다</tspan></text></g><g ><g class="shape"><path d="M30 495h340v114H30z" class="stroke-B1 fill-B5 s1"/></g><text x="200" y="533.5" class="text-bold fill-N1 s0"><tspan x="200" dy="0">자기고양 편향</tspan><tspan x="200" dy="17.25">잘된 일은 자기 쪽에,</tspan><tspan x="200" dy="17.25">안된 일은 바깥에 돌리는 기울기.</tspan><tspan x="200" dy="17.25">여러 자료에서 되풀이 관찰되었다</tspan></text></g><g ><g class="shape"><path d="M520 366h296v162H520z" class="stroke-B1 fill-B5 s1"/></g><text x="668" y="404.5" class="text-bold fill-N1 s0"><tspan x="668" dy="0">행위자-관찰자 비대칭</tspan><tspan x="668" dy="16.714">‘내 행동은 상황으로,</tspan><tspan x="668" dy="16.714">남의 행동은 성향으로</tspan><tspan x="668" dy="16.714">설명한다’ 는 명제.</tspan><tspan x="668" dy="16.714">오래 교과서에 실려 있었으나</tspan><tspan x="668" dy="16.714">메타분석에서</tspan><tspan x="668" dy="16.714">전체 효과가 거의 0 이었다</tspan></text></g><g ><g class="shape"><path d="M966 303h365v130H966z" class="stroke-B1 fill-B5 s1"/></g><text x="1148.5" y="341.5" class="text-bold fill-N1 s0"><tspan x="1148.5" dy="0">이 기울기를 ‘기본적’ 이라</tspan><tspan x="1148.5" dy="17">부를 수 있는가</tspan><tspan x="1148.5" dy="17">상황 정보를 얼마나 쓰는지가</tspan><tspan x="1148.5" dy="17">문화에 따라 다르다는 보고들이 있다.</tspan><tspan x="1148.5" dy="17">그 차이의 크기와 조건은 논쟁 중이다</tspan></text></g><g ><g class="shape"><path d="M966 463h365v130H966z" class="stroke-B1 fill-B5 s1"/></g><text x="1148.5" y="501.5" class="text-bold fill-N1 s0"><tspan x="1148.5" dy="0">이것이 오류인가</tspan><tspan x="1148.5" dy="17">사람들이 성향을 앞세우는 것이</tspan><tspan x="1148.5" dy="17">잘못된 추론이라기보다</tspan><tspan x="1148.5" dy="17">실제 세계에서 대체로 쓸 만한</tspan><tspan x="1148.5" dy="17">어림법일 수 있다는 반론이 있다</tspan></text></g><marker id="mk-d2-44891080-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-44891080-3488378134)" d="M499.062 114.496C260.2 175.6 200 201 200 237" class="connection stroke-B1 s1" mask="url(#d2-44891080)"/><path fill="none" marker-end="url(#mk-d2-44891080-3488378134)" d="M668 143v145" class="connection stroke-B1 s1" mask="url(#d2-44891080)"/><path fill="none" marker-end="url(#mk-d2-44891080-3488378134)" d="M839.94 113.487C1086.4 175.4 1148.5 204.2 1148.5 253" class="connection stroke-B1 s1" mask="url(#d2-44891080)"/><marker id="mk-d2-44891080-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-44891080-2177206569)" d="M200 641c0 38 54.3 59.66 267.59 105.462" class="connection stroke-B2 s4" mask="url(#d2-44891080)"/><path fill="none" marker-end="url(#mk-d2-44891080-2177206569)" d="M668 590v145" class="connection stroke-B2 s4" mask="url(#d2-44891080)"/><path fill="none" marker-end="url(#mk-d2-44891080-2177206569)" d="M1148.5 625c0 50.8-56.8 75.8-280.084 122.186" class="connection stroke-B2 s4" mask="url(#d2-44891080)"/><mask id="d2-44891080" width="1563" height="1042" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1563V941H-101z"/></mask></svg>