<svg xmlns="http://www.w3.org/2000/svg" width="1035" height="1167" class="d2-3842907710 d2-svg" viewBox="-98 -100 1035 1167"><rect width="1035" height="1167" x="-98" y="-100" rx="0" style="fill:#fff"/><style>.d2-3842907710 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3842907710 .fill-N1{fill:#0a0f25}.d2-3842907710 .fill-B4{fill:#e3e9fd}.d2-3842907710 .fill-B5{fill:#edf0fd}.d2-3842907710 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M16 69h350v897H16z" class="stroke-B1 fill-B4 s0"/></g><text x="191" y="28" class="fill-N1 s1"><tspan x="191" dy="0">흔한 서술 순서 —</tspan><tspan x="191" dy="32">이 문서가 쓰지 않는 방식</tspan></text></g><g ><g class="shape"><path d="M472 41h364v752H472z" class="stroke-B1 fill-B4 s0"/></g><text x="654" y="28" class="fill-N1 s1">이 장의 순서</text></g><text x="629" y="849" class="fill-N1 s2"><tspan x="629" dy="0"> </tspan><tspan x="629" dy="16.625">그리고 반대쪽 잘못도 피해야 한다 —</tspan><tspan x="629" dy="16.625">‘사회심리학은 다 무너졌다’ 는 결론.</tspan><tspan x="629" dy="16.625">이 장에는 여러 연구실에서</tspan><tspan x="629" dy="16.625">되풀이 확인된 결과도 함께 들어 있고,</tspan><tspan x="629" dy="16.625">이 분야가 자기 문헌을</tspan><tspan x="629" dy="16.625">가장 많이 검사한 분야라는 것도</tspan><tspan x="629" dy="16.625">함께 적어야 한다</tspan></text><g ><g class="shape"><path d="M57 99h269v66H57z" class="stroke-B1 fill-B5 s0"/></g><text x="191.5" y="137.5" class="text-bold fill-N1 s2">1. 유명한 실험을 소개한다</text></g><g ><g class="shape"><path d="M46 265h290v66H46z" class="stroke-B1 fill-B5 s0"/></g><text x="191" y="303.5" class="text-bold fill-N1 s2">2. 결론을 인상적으로 적는다</text></g><g ><g class="shape"><path d="M73 431h237v98H73z" class="stroke-B1 fill-B5 s0"/></g><text x="191.5" y="469.5" class="text-bold fill-N1 s2"><tspan x="191.5" dy="0">3. 마지막에</tspan><tspan x="191.5" dy="17.667">‘다만 논란이 있다’ 를</tspan><tspan x="191.5" dy="17.667">덧붙인다</tspan></text></g><g ><g class="shape"><path d="M53 629h277v130H53z" class="stroke-B1 fill-B5 s0"/></g><text x="191.5" y="667.5" class="text-bold fill-N1 s2"><tspan x="191.5" dy="0">무엇이 문제인가 —</tspan><tspan x="191.5" dy="17">독자는 앞부분을 기억한다.</tspan><tspan x="191.5" dy="17">덧붙인 한 줄은</tspan><tspan x="191.5" dy="17">이미 만들어진 인상을</tspan><tspan x="191.5" dy="17">되돌리지 못한다</tspan></text></g><g ><g class="shape"><path d="M540 71h228v98H540z" class="stroke-B1 fill-B5 s0"/></g><text x="654" y="109.5" class="text-bold fill-N1 s2"><tspan x="654" dy="0">1. 그 결과가 검사에서</tspan><tspan x="654" dy="17.667">어떻게 되었는지를</tspan><tspan x="654" dy="17.667">먼저 적는다</tspan></text></g><g ><g class="shape"><path d="M538 269h232v82H538z" class="stroke-B1 fill-B5 s0"/></g><text x="654" y="307.5" class="text-bold fill-N1 s2"><tspan x="654" dy="0">2. 그 다음에 원 연구가</tspan><tspan x="654" dy="18.5">무엇을 했는지 적는다</tspan></text></g><g ><g class="shape"><path d="M528 451h252v82H528z" class="stroke-B1 fill-B5 s0"/></g><text x="654" y="489.5" class="text-bold fill-N1 s2"><tspan x="654" dy="0">3. 그리고 왜 그것이</tspan><tspan x="654" dy="18.5">널리 퍼졌는지를 묻는다</tspan></text></g><g ><g class="shape"><path d="M502 633h304v130H502z" class="stroke-B1 fill-B5 s0"/></g><text x="654" y="671.5" class="text-bold fill-N1 s2"><tspan x="654" dy="0">재현에 실패한 결과는</tspan><tspan x="654" dy="17">그 실패가 서술의 주어가 된다.</tspan><tspan x="654" dy="17">6장 끝에서 세운 규칙이고,</tspan><tspan x="654" dy="17">이 장이 그 규칙을</tspan><tspan x="654" dy="17">가장 많이 쓴다</tspan></text></g><marker id="mk-d2-3842907710-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3842907710-3488378134)" d="M191 167v94" class="connection stroke-B1 s0" mask="url(#d2-3842907710)"/><path fill="none" marker-end="url(#mk-d2-3842907710-3488378134)" d="M191 333v94" class="connection stroke-B1 s0" mask="url(#d2-3842907710)"/><path fill="none" marker-end="url(#mk-d2-3842907710-3488378134)" d="M191 531v94" class="connection stroke-B1 s0" mask="url(#d2-3842907710)"/><path fill="none" marker-end="url(#mk-d2-3842907710-3488378134)" d="M654 171v94" class="connection stroke-B1 s0" mask="url(#d2-3842907710)"/><path fill="none" marker-end="url(#mk-d2-3842907710-3488378134)" d="M654 353v94" class="connection stroke-B1 s0" mask="url(#d2-3842907710)"/><path fill="none" marker-end="url(#mk-d2-3842907710-3488378134)" d="M654 535v94" class="connection stroke-B1 s0" mask="url(#d2-3842907710)"/><path fill="none" marker-end="url(#mk-d2-3842907710-3488378134)" d="m367.955 479.576 100.136-21.728" class="connection stroke-B1 s0" mask="url(#d2-3842907710)"/><text x="419" y="474" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">바꾼다</text><marker id="mk-d2-3842907710-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3842907710-2177206569)" d="M654 794.5v35" class="connection" mask="url(#d2-3842907710)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3842907710" width="1035" height="1167" x="-98" y="-100" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-98-100H937v1167H-98z"/><path d="M388 458h62v21h-62z"/></mask></svg>