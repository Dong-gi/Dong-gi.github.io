<svg xmlns="http://www.w3.org/2000/svg" width="1493" height="991" class="d2-999758084 d2-svg" viewBox="-97 -100 1493 991"><rect width="1493" height="991" x="-97" y="-100" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-999758084 .fill-N1{fill:#0a0f25}.d2-999758084 .fill-B4{fill:#e3e9fd}.d2-999758084 .fill-B5{fill:#edf0fd}.d2-999758084 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M34 41h571v749H34z" class="stroke-B1 fill-B4 s0"/></g><text x="319.5" y="28" class="fill-N1 s1">흔한 서술 순서 — 이 문서가 쓰지 않는 방식</text></g><g ><g class="shape"><path d="M679 41h616v640H679z" class="stroke-B1 fill-B4 s0"/></g><text x="987" y="28" class="fill-N1 s1">이 장의 순서</text></g><text x="987" y="737" class="fill-N1 s2"><tspan x="987" dy="0"> </tspan><tspan x="987" dy="17.25">그리고 반대쪽 잘못도 피해야 한다 — ‘사회심리학은 다 무너졌다’ 는 결론.</tspan><tspan x="987" dy="17.25">이 장에는 여러 연구실에서 되풀이 확인된 결과도 함께 들어 있고,</tspan><tspan x="987" dy="17.25">이 분야가 자기 문헌을 가장 많이 검사한 분야라는 것도 함께 적어야 한다</tspan></text><g ><g class="shape"><path d="M185 71h269v66H185z" class="stroke-B1 fill-B5 s0"/></g><text x="319.5" y="109.5" class="text-bold fill-N1 s2">1. 유명한 실험을 소개한다</text></g><g ><g class="shape"><path d="M175 237h290v66H175z" class="stroke-B1 fill-B5 s0"/></g><text x="320" y="275.5" class="text-bold fill-N1 s2">2. 결론을 인상적으로 적는다</text></g><g ><g class="shape"><path d="M108 403h423v66H108z" class="stroke-B1 fill-B5 s0"/></g><text x="319.5" y="441.5" class="text-bold fill-N1 s2">3. 마지막에 ‘다만 논란이 있다’ 를 덧붙인다</text></g><g ><g class="shape"><path d="M64 569h511v82H64z" class="stroke-B1 fill-B5 s0"/></g><text x="319.5" y="607.5" class="text-bold fill-N1 s2"><tspan x="319.5" dy="0">무엇이 문제인가 — 독자는 앞부분을 기억한다.</tspan><tspan x="319.5" dy="18.5">덧붙인 한 줄은 이미 만들어진 인상을 되돌리지 못한다</tspan></text></g><g ><g class="shape"><path d="M735 71h504v66H735z" class="stroke-B1 fill-B5 s0"/></g><text x="987" y="109.5" class="text-bold fill-N1 s2">1. 그 결과가 검사에서 어떻게 되었는지를 먼저 적는다</text></g><g ><g class="shape"><path d="M775 237h424v66H775z" class="stroke-B1 fill-B5 s0"/></g><text x="987" y="275.5" class="text-bold fill-N1 s2">2. 그 다음에 원 연구가 무엇을 했는지 적는다</text></g><g ><g class="shape"><path d="M776 403h421v66H776z" class="stroke-B1 fill-B5 s0"/></g><text x="986.5" y="441.5" class="text-bold fill-N1 s2">3. 그리고 왜 그것이 널리 퍼졌는지를 묻는다</text></g><g ><g class="shape"><path d="M709 569h555v82H709z" class="stroke-B1 fill-B5 s0"/></g><text x="986.5" y="607.5" class="text-bold fill-N1 s2"><tspan x="986.5" dy="0">재현에 실패한 결과는 그 실패가 서술의 주어가 된다.</tspan><tspan x="986.5" dy="18.5">6장 끝에서 세운 규칙이고, 이 장이 그 규칙을 가장 많이 쓴다</tspan></text></g><marker id="mk-d2-999758084-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-999758084-3488378134)" d="M319.5 139v94" class="connection stroke-B1 s0" mask="url(#d2-999758084)"/><path fill="none" marker-end="url(#mk-d2-999758084-3488378134)" d="M319.5 305v94" class="connection stroke-B1 s0" mask="url(#d2-999758084)"/><path fill="none" marker-end="url(#mk-d2-999758084-3488378134)" d="M319.5 471v94" class="connection stroke-B1 s0" mask="url(#d2-999758084)"/><path fill="none" marker-end="url(#mk-d2-999758084-3488378134)" d="M986.5 139v94" class="connection stroke-B1 s0" mask="url(#d2-999758084)"/><path fill="none" marker-end="url(#mk-d2-999758084-3488378134)" d="M986.5 305v94" class="connection stroke-B1 s0" mask="url(#d2-999758084)"/><path fill="none" marker-end="url(#mk-d2-999758084-3488378134)" d="M986.5 471v94" class="connection stroke-B1 s0" mask="url(#d2-999758084)"/><path fill="none" marker-end="url(#mk-d2-999758084-3488378134)" d="m606.993 391.838 68.02-5.515" class="connection stroke-B1 s0" mask="url(#d2-999758084)"/><text x="642" y="395" style="fill:#676c7e;text-anchor:middle;font-size:16px">바꾼다</text><marker id="mk-d2-999758084-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-999758084-2177206569)" d="M987 682.5v35" class="connection" mask="url(#d2-999758084)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-999758084" width="1493" height="991" x="-97" y="-100" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-97-100h1493v991H-97z"/><path d="M611 379h62v21h-62z"/></mask></svg>