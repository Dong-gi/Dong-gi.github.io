<svg xmlns="http://www.w3.org/2000/svg" width="5253" height="384" class="d2-1281831554 d2-svg" viewBox="-81 -85 5253 384"><rect width="5253" height="384" x="-81" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1281831554 .fill-N1{fill:#0a0f25}.d2-1281831554 .fill-B4{fill:#e3e9fd}.d2-1281831554 .fill-B5{fill:#edf0fd}.d2-1281831554 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M20 56h1853v142H20z" class="stroke-B1 fill-B4 s0"/></g><text x="946.5" y="43" class="fill-N1 s1">흔한 서술 순서 — 이 문서가 쓰지 않는 방식</text></g><g ><g class="shape"><path d="M2071 56h2264v142H2071z" class="stroke-B1 fill-B4 s0"/></g><text x="3203" y="43" class="fill-N1 s1">이 장의 순서</text></g><text x="4763" y="109" class="fill-N1 s2"><tspan x="4763" dy="0"> </tspan><tspan x="4763" dy="17.25">그리고 반대쪽 잘못도 피해야 한다 — ‘사회심리학은 다 무너졌다’ 는 결론.</tspan><tspan x="4763" dy="17.25">이 장에는 여러 연구실에서 되풀이 확인된 결과도 함께 들어 있고,</tspan><tspan x="4763" dy="17.25">이 분야가 자기 문헌을 가장 많이 검사한 분야라는 것도 함께 적어야 한다</tspan></text><g ><g class="shape"><path d="M50 94h269v66H50z" class="stroke-B1 fill-B5 s0"/></g><text x="184.5" y="132.5" class="text-bold fill-N1 s2">1. 유명한 실험을 소개한다</text></g><g ><g class="shape"><path d="M419 94h290v66H419z" class="stroke-B1 fill-B5 s0"/></g><text x="564" y="132.5" class="text-bold fill-N1 s2">2. 결론을 인상적으로 적는다</text></g><g ><g class="shape"><path d="M809 94h423v66H809z" class="stroke-B1 fill-B5 s0"/></g><text x="1020.5" y="132.5" class="text-bold fill-N1 s2">3. 마지막에 ‘다만 논란이 있다’ 를 덧붙인다</text></g><g ><g class="shape"><path d="M1332 86h511v82h-511z" class="stroke-B1 fill-B5 s0"/></g><text x="1587.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="1587.5" dy="0">무엇이 문제인가 — 독자는 앞부분을 기억한다.</tspan><tspan x="1587.5" dy="18.5">덧붙인 한 줄은 이미 만들어진 인상을 되돌리지 못한다</tspan></text></g><g ><g class="shape"><path d="M2101 94h504v66h-504z" class="stroke-B1 fill-B5 s0"/></g><text x="2353" y="132.5" class="text-bold fill-N1 s2">1. 그 결과가 검사에서 어떻게 되었는지를 먼저 적는다</text></g><g ><g class="shape"><path d="M2705 94h424v66h-424z" class="stroke-B1 fill-B5 s0"/></g><text x="2917" y="132.5" class="text-bold fill-N1 s2">2. 그 다음에 원 연구가 무엇을 했는지 적는다</text></g><g ><g class="shape"><path d="M3229 94h421v66h-421z" class="stroke-B1 fill-B5 s0"/></g><text x="3439.5" y="132.5" class="text-bold fill-N1 s2">3. 그리고 왜 그것이 널리 퍼졌는지를 묻는다</text></g><g ><g class="shape"><path d="M3750 86h555v82h-555z" class="stroke-B1 fill-B5 s0"/></g><text x="4027.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="4027.5" dy="0">재현에 실패한 결과는 그 실패가 서술의 주어가 된다.</tspan><tspan x="4027.5" dy="18.5">6장 끝에서 세운 규칙이고, 이 장이 그 규칙을 가장 많이 쓴다</tspan></text></g><marker id="mk-d2-1281831554-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1281831554-3488378134)" d="M321 127h94" class="connection stroke-B1 s0" mask="url(#d2-1281831554)"/><path fill="none" marker-end="url(#mk-d2-1281831554-3488378134)" d="M711 127h94" class="connection stroke-B1 s0" mask="url(#d2-1281831554)"/><path fill="none" marker-end="url(#mk-d2-1281831554-3488378134)" d="M1234 127h94" class="connection stroke-B1 s0" mask="url(#d2-1281831554)"/><path fill="none" marker-end="url(#mk-d2-1281831554-3488378134)" d="M2607 127h94" class="connection stroke-B1 s0" mask="url(#d2-1281831554)"/><path fill="none" marker-end="url(#mk-d2-1281831554-3488378134)" d="M3131 127h94" class="connection stroke-B1 s0" mask="url(#d2-1281831554)"/><path fill="none" marker-end="url(#mk-d2-1281831554-3488378134)" d="M3652 127h94" class="connection stroke-B1 s0" mask="url(#d2-1281831554)"/><path fill="none" marker-end="url(#mk-d2-1281831554-3488378134)" d="M1875 127h192" class="connection stroke-B1 s0" mask="url(#d2-1281831554)"/><text x="1972" y="133" style="fill:#676c7e;text-anchor:middle;font-size:16px">바꾼다</text><marker id="mk-d2-1281831554-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1281831554-2177206569)" d="M4337 127h114" class="connection" mask="url(#d2-1281831554)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1281831554" width="5253" height="384" x="-81" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-81-85h5253v384H-81z"/><path d="M1941 117h62v21h-62z"/></mask></svg>