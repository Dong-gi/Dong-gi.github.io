<svg xmlns="http://www.w3.org/2000/svg" width="1628" height="1611" class="d2-2525825196 d2-svg" viewBox="-91 -101 1628 1611"><rect width="1628" height="1611" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2525825196 .fill-N1{fill:#0a0f25}.d2-2525825196 .fill-B4{fill:#e3e9fd}.d2-2525825196 .fill-B5{fill:#edf0fd}.d2-2525825196 .fill-B6{fill:#f7f8fe}.d2-2525825196 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="713" cy="91" class="shape stroke-B1 fill-B6 s0" rx="273" ry="91"/></g><text x="713" y="96.5" class="text-bold fill-N1 s1">이 영역과 이 심리 기능은 어떤 관계인가</text></g><g ><g class="shape"><path d="M10 302h673v720H10z" class="stroke-B1 fill-B4 s0"/></g><text x="346.5" y="289" class="fill-N1 s2">손상 연구</text></g><g ><g class="shape"><path d="M723 302h713v720H723z" class="stroke-B1 fill-B4 s0"/></g><text x="1079.5" y="289" class="fill-N1 s2">영상 연구</text></g><g ><g class="shape"><path d="M618 1142h191v66H618z" class="stroke-B1 fill-B6 s0"/></g><text x="713.5" y="1180.5" class="text-bold fill-N1 s1">둘이 만나는 자리</text></g><text x="713.5" y="1324" class="fill-N1 s1"><tspan x="713.5" dy="0">손상 연구가 ‘필요하다’ 를 대고 영상 연구가 ‘함께 움직인다’ 를 대고,</tspan><tspan x="713.5" dy="16.833">둘이 같은 자리를 가리킬 때 결론이 단단해진다.</tspan><tspan x="713.5" dy="16.833"> </tspan><tspan x="713.5" dy="16.833">여기에 세 번째 줄기를 더할 수 있다 — 그 부위의 활동을 일시적으로 바꾸고</tspan><tspan x="713.5" dy="16.833">수행이 달라지는지 보는 방법이다. 이쪽은 손상 연구와 달리 ‘무선배정’이 되므로</tspan><tspan x="713.5" dy="16.833">4장의 실험이 갖는 힘을 얻는다. 다만 닿을 수 있는 부위가 제한된다</tspan></text><g ><g class="shape"><path d="M40 332h613v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="346.5" y="370.5" class="text-bold fill-N1 s1">무엇을 하는가 — 어떤 부위가 손상된 사람이 무엇을 못 하는지 본다</text></g><g ><g class="shape"><path d="M122 498h449v66H122z" class="stroke-B1 fill-B5 s0"/></g><text x="346.5" y="536.5" class="text-bold fill-N1 s1">답할 수 있는 것 — 그 부위가 그 일에 ‘필요한가’</text></g><g ><g class="shape"><path d="M97 664h500v114H97z" class="stroke-B1 fill-B5 s0"/></g><text x="347" y="702.5" class="text-bold fill-N1 s1"><tspan x="347" dy="0">답할 수 없는 것</tspan><tspan x="347" dy="17.25">· 정상인 뇌에서 그 부위가 실제로 무슨 일을 하는가</tspan><tspan x="347" dy="17.25">· 그 부위가 그 일‘만’ 하는가</tspan><tspan x="347" dy="17.25">· 손상 뒤에 남은 부분이 다시 조직된 결과인지 아닌지</tspan></text></g><g ><g class="shape"><path d="M42 878h609v114H42z" class="stroke-B1 fill-B5 s0"/></g><text x="346.5" y="916.5" class="text-bold fill-N1 s1"><tspan x="346.5" dy="0">구조적 한계</tspan><tspan x="346.5" dy="17.25">· 표본이 우연히 정해진다. 연구자가 손상 부위를 고를 수 없다</tspan><tspan x="346.5" dy="17.25">· 손상이 해부학적 경계를 따르지 않는다. 대개 여러 부위에 걸친다</tspan><tspan x="346.5" dy="17.25">· 사례 수가 아주 적다. 한 사람인 경우도 많다</tspan></text></g><g ><g class="shape"><path d="M753 332h653v66H753z" class="stroke-B1 fill-B5 s0"/></g><text x="1079.5" y="370.5" class="text-bold fill-N1 s1">무엇을 하는가 — 과제를 하는 동안 어느 부위의 신호가 달라지는지 본다</text></g><g ><g class="shape"><path d="M758 498h644v66H758z" class="stroke-B1 fill-B5 s0"/></g><text x="1080" y="536.5" class="text-bold fill-N1 s1">답할 수 있는 것 — 그 과제를 할 때 그 부위의 신호가 ‘함께 달라지는가’</text></g><g ><g class="shape"><path d="M791 664h578v114H791z" class="stroke-B1 fill-B5 s0"/></g><text x="1080" y="702.5" class="text-bold fill-N1 s1"><tspan x="1080" dy="0">답할 수 없는 것</tspan><tspan x="1080" dy="17.25">· 그 부위가 그 일에 필요한가 — 켜졌다고 필요한 것이 아니다</tspan><tspan x="1080" dy="17.25">· 그 부위가 켜졌으니 그 심리 과정이 일어났는가 — 역추론 문제</tspan><tspan x="1080" dy="17.25">· 그 신호가 원인인가 결과인가</tspan></text></g><g ><g class="shape"><path d="M808 878h543v114H808z" class="stroke-B1 fill-B5 s0"/></g><text x="1079.5" y="916.5" class="text-bold fill-N1 s1"><tspan x="1079.5" dy="0">구조적 한계</tspan><tspan x="1079.5" dy="17.25">· 재는 것은 혈류에 딸린 신호이지 신경 활동 자체가 아니다</tspan><tspan x="1079.5" dy="17.25">· 칸이 아주 많아 보정하지 않으면 우연한 색이 남는다</tspan><tspan x="1079.5" dy="17.25">· 사람 사이의 상관을 보려면 표본이 아주 커야 한다</tspan></text></g><marker id="mk-d2-2525825196-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2525825196-3488378134)" d="M346.5 400v94" class="connection stroke-B1 s0" mask="url(#d2-2525825196)"/><path fill="none" marker-end="url(#mk-d2-2525825196-3488378134)" d="M346.5 566v94" class="connection stroke-B1 s0" mask="url(#d2-2525825196)"/><path fill="none" marker-end="url(#mk-d2-2525825196-3488378134)" d="M346.5 780v94" class="connection stroke-B1 s0" mask="url(#d2-2525825196)"/><path fill="none" marker-end="url(#mk-d2-2525825196-3488378134)" d="M1079.5 400v94" class="connection stroke-B1 s0" mask="url(#d2-2525825196)"/><path fill="none" marker-end="url(#mk-d2-2525825196-3488378134)" d="M1079.5 566v94" class="connection stroke-B1 s0" mask="url(#d2-2525825196)"/><path fill="none" marker-end="url(#mk-d2-2525825196-3488378134)" d="M1079.5 780v94" class="connection stroke-B1 s0" mask="url(#d2-2525825196)"/><path fill="none" marker-end="url(#mk-d2-2525825196-3488378134)" d="M532.133 160.717C384 217.6 346.5 237.8 346.5 257" class="connection stroke-B1 s0" mask="url(#d2-2525825196)"/><path fill="none" marker-end="url(#mk-d2-2525825196-3488378134)" d="M893.867 160.717C1042 217.6 1079.5 237.8 1079.5 257" class="connection stroke-B1 s0" mask="url(#d2-2525825196)"/><path fill="none" marker-end="url(#mk-d2-2525825196-3488378134)" d="M346.5 1024c0 54 54.2 80.274 267.099 128.488" class="connection stroke-B1 s0" mask="url(#d2-2525825196)"/><path fill="none" marker-end="url(#mk-d2-2525825196-3488378134)" d="M1079.5 1024c0 54-54.2 80.2-267.098 128.122" class="connection stroke-B1 s0" mask="url(#d2-2525825196)"/><marker id="mk-d2-2525825196-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2525825196-2177206569)" d="M713 1210v94" class="connection" mask="url(#d2-2525825196)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-2525825196" width="1628" height="1611" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1628v1611H-91z"/></mask></svg>