<svg xmlns="http://www.w3.org/2000/svg" width="1097" height="1495" class="d2-3496854867 d2-svg" viewBox="-89 -89 1097 1495"><rect width="1097" height="1495" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3496854867 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3496854867 .fill-N1{fill:#0a0f25}.d2-3496854867 .fill-B4{fill:#e3e9fd}.d2-3496854867 .fill-B5{fill:#edf0fd}.d2-3496854867 .fill-B6{fill:#f7f8fe}.d2-3496854867 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="475" cy="73" class="shape stroke-B1 fill-B6 s0" rx="183" ry="61"/></g><text x="475" y="70.5" class="text-bold fill-N1 s1"><tspan x="475" dy="0">이 영역과 이 심리 기능은</tspan><tspan x="475" dy="18.5">어떤 관계인가</tspan></text></g><g ><g class="shape"><path d="M12 238h468v710H12z" class="stroke-B1 fill-B4 s0"/></g><text x="246" y="271" class="fill-N1 s2">손상 연구</text></g><g ><g class="shape"><path d="M499 214h408v758H499z" class="stroke-B1 fill-B4 s0"/></g><text x="703" y="247" class="fill-N1 s2">영상 연구</text></g><g ><g class="shape"><path d="M379 1052h191v66H379z" class="stroke-B1 fill-B6 s0"/></g><text x="474.5" y="1090.5" class="text-bold fill-N1 s1">둘이 만나는 자리</text></g><text x="475" y="1204" class="fill-N1 s1"><tspan x="475" dy="0">손상 연구가 ‘필요하다’ 를 대고 영상 연구가 ‘함께 움직인다’ 를 대고,</tspan><tspan x="475" dy="16.714">둘이 같은 자리를 가리킬 때 결론이 단단해진다.</tspan><tspan x="475" dy="16.714"> </tspan><tspan x="475" dy="16.714">여기에 세 번째 줄기를 더할 수 있다 —</tspan><tspan x="475" dy="16.714">그 부위의 활동을 일시적으로 바꾸고 수행이 달라지는지 보는 방법이다.</tspan><tspan x="475" dy="16.714">이쪽은 손상 연구와 달리 ‘무선배정’이 되므로</tspan><tspan x="475" dy="16.714">4장의 실험이 갖는 힘을 얻는다. 다만 닿을 수 있는 부위가 제한된다</tspan></text><g ><g class="shape"><path d="M52 284h388v98H52z" class="stroke-B1 fill-B5 s0"/></g><text x="246" y="322.5" class="text-bold fill-N1 s1"><tspan x="246" dy="0">무엇을 하는가 —</tspan><tspan x="246" dy="17.667">어떤 부위가 손상된 사람이</tspan><tspan x="246" dy="17.667">무엇을 못 하는지 본다</tspan></text></g><g ><g class="shape"><path d="M52 422h388v98H52z" class="stroke-B1 fill-B5 s0"/></g><text x="246" y="460.5" class="text-bold fill-N1 s1"><tspan x="246" dy="0">답할 수 있는 것 —</tspan><tspan x="246" dy="17.667">그 부위가 그 일에</tspan><tspan x="246" dy="17.667">‘필요한가’</tspan></text></g><g ><g class="shape"><path d="M52 560h388v146H52z" class="stroke-B1 fill-B5 s0"/></g><text x="246" y="598.5" class="text-bold fill-N1 s1"><tspan x="246" dy="0">답할 수 없는 것</tspan><tspan x="246" dy="16.833">· 정상인 뇌에서 그 부위가</tspan><tspan x="246" dy="16.833">실제로 무슨 일을 하는가</tspan><tspan x="246" dy="16.833">· 그 부위가 그 일‘만’ 하는가</tspan><tspan x="246" dy="16.833">· 손상 뒤에 남은 부분이</tspan><tspan x="246" dy="16.833">다시 조직된 결과인지 아닌지</tspan></text></g><g ><g class="shape"><path d="M52 746h388v162H52z" class="stroke-B1 fill-B5 s0"/></g><text x="246" y="784.5" class="text-bold fill-N1 s1"><tspan x="246" dy="0">구조적 한계</tspan><tspan x="246" dy="16.714">· 표본이 우연히 정해진다.</tspan><tspan x="246" dy="16.714">연구자가 손상 부위를 고를 수 없다</tspan><tspan x="246" dy="16.714">· 손상이 해부학적 경계를</tspan><tspan x="246" dy="16.714">따르지 않는다. 대개 여러 부위에 걸친다</tspan><tspan x="246" dy="16.714">· 사례 수가 아주 적다.</tspan><tspan x="246" dy="16.714">한 사람인 경우도 많다</tspan></text></g><g ><g class="shape"><path d="M540 260h328v114H540z" class="stroke-B1 fill-B5 s0"/></g><text x="704" y="298.5" class="text-bold fill-N1 s1"><tspan x="704" dy="0">무엇을 하는가 —</tspan><tspan x="704" dy="17.25">과제를 하는 동안</tspan><tspan x="704" dy="17.25">어느 부위의 신호가</tspan><tspan x="704" dy="17.25">달라지는지 본다</tspan></text></g><g ><g class="shape"><path d="M540 414h328v114H540z" class="stroke-B1 fill-B5 s0"/></g><text x="704" y="452.5" class="text-bold fill-N1 s1"><tspan x="704" dy="0">답할 수 있는 것 —</tspan><tspan x="704" dy="17.25">그 과제를 할 때</tspan><tspan x="704" dy="17.25">그 부위의 신호가</tspan><tspan x="704" dy="17.25">‘함께 달라지는가’</tspan></text></g><g ><g class="shape"><path d="M540 568h328v162H540z" class="stroke-B1 fill-B5 s0"/></g><text x="704" y="606.5" class="text-bold fill-N1 s1"><tspan x="704" dy="0">답할 수 없는 것</tspan><tspan x="704" dy="16.714">· 그 부위가 그 일에 필요한가</tspan><tspan x="704" dy="16.714">— 켜졌다고 필요한 것이 아니다</tspan><tspan x="704" dy="16.714">· 그 부위가 켜졌으니</tspan><tspan x="704" dy="16.714">그 심리 과정이 일어났는가</tspan><tspan x="704" dy="16.714">— 역추론 문제</tspan><tspan x="704" dy="16.714">· 그 신호가 원인인가 결과인가</tspan></text></g><g ><g class="shape"><path d="M540 770h328v162H540z" class="stroke-B1 fill-B5 s0"/></g><text x="704" y="808.5" class="text-bold fill-N1 s1"><tspan x="704" dy="0">구조적 한계</tspan><tspan x="704" dy="16.714">· 재는 것은 혈류에 딸린 신호이지</tspan><tspan x="704" dy="16.714">신경 활동 자체가 아니다</tspan><tspan x="704" dy="16.714">· 칸이 아주 많아 보정하지 않으면</tspan><tspan x="704" dy="16.714">우연한 색이 남는다</tspan><tspan x="704" dy="16.714">· 사람 사이의 상관을 보려면</tspan><tspan x="704" dy="16.714">표본이 아주 커야 한다</tspan></text></g><marker id="mk-d2-3496854867-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3496854867-3488378134)" d="M246 384v34" class="connection stroke-B1 s0" mask="url(#d2-3496854867)"/><path fill="none" marker-end="url(#mk-d2-3496854867-3488378134)" d="M246 522v34" class="connection stroke-B1 s0" mask="url(#d2-3496854867)"/><path fill="none" marker-end="url(#mk-d2-3496854867-3488378134)" d="M246 708v34" class="connection stroke-B1 s0" mask="url(#d2-3496854867)"/><path fill="none" marker-end="url(#mk-d2-3496854867-3488378134)" d="M704 376v34" class="connection stroke-B1 s0" mask="url(#d2-3496854867)"/><path fill="none" marker-end="url(#mk-d2-3496854867-3488378134)" d="M704 530v34" class="connection stroke-B1 s0" mask="url(#d2-3496854867)"/><path fill="none" marker-end="url(#mk-d2-3496854867-3488378134)" d="M704 732v34" class="connection stroke-B1 s0" mask="url(#d2-3496854867)"/><path fill="none" marker-end="url(#mk-d2-3496854867-3488378134)" d="M414 133v101" class="connection stroke-B1 s0" mask="url(#d2-3496854867)"/><path fill="none" marker-end="url(#mk-d2-3496854867-3488378134)" d="M536 133v77" class="connection stroke-B1 s0" mask="url(#d2-3496854867)"/><path fill="none" marker-end="url(#mk-d2-3496854867-3488378134)" d="M443.166 950v98" class="connection stroke-B1 s0" mask="url(#d2-3496854867)"/><path fill="none" marker-end="url(#mk-d2-3496854867-3488378134)" d="M704 974v28s0 10-10 10H516.833s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3496854867)"/><marker id="mk-d2-3496854867-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3496854867-2177206569)" d="M475 1120v64" class="connection" mask="url(#d2-3496854867)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3496854867" width="1097" height="1495" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1097v1495H-89z"/></mask></svg>