<svg xmlns="http://www.w3.org/2000/svg" width="1175" height="1554" class="d2-4147752444 d2-svg" viewBox="-89 -89 1175 1554"><rect width="1175" height="1554" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-4147752444 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4147752444 .fill-N1{fill:#0a0f25}.d2-4147752444 .fill-B4{fill:#e3e9fd}.d2-4147752444 .fill-B5{fill:#edf0fd}.d2-4147752444 .stroke-B1,.d2-4147752444 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="432.5" cy="93" class="shape stroke-B1" rx="242.5" ry="81" style="fill:#f7f8fe;stroke-width:2"/></g><text x="432.5" y="82.5" class="text-bold fill-N1 s0"><tspan x="432.5" dy="0">물음 —</tspan><tspan x="432.5" dy="17.667">아이는 언제부터 남이</tspan><tspan x="432.5" dy="17.667">틀린 믿음을 가질 수 있음을 아는가</tspan></text></g><g ><g class="shape"><path d="M12 254h346v742H12z" class="stroke-B1 fill-B4 s1"/></g><text x="185" y="287" class="fill-N1 s2">말로 답하게 하는 과제</text></g><g ><g class="shape"><path d="M378 299h607v652H378z" class="stroke-B1 fill-B4 s1"/></g><text x="681.5" y="332" class="fill-N1 s2">응시 시간으로 재는 과제</text></g><text x="433" y="1092" class="fill-N1 s0"><tspan x="433" dy="0"> </tspan><tspan x="433" dy="16.714">지금 이 문서가 적을 수 있는 것 —</tspan><tspan x="433" dy="16.714">말로 답하는 과제의 결과는 되풀이되었고,</tspan><tspan x="433" dy="16.714">응시 시간 과제의 결과는</tspan><tspan x="433" dy="16.714">독립적인 재현에서 판정이 갈려 있다.</tspan><tspan x="433" dy="16.714">그러므로 ‘마음이론은 몇 살에 생긴다’ 는</tspan><tspan x="433" dy="16.714">문장을 하나로 적을 수 없다</tspan></text><text x="433" y="1279" class="fill-N1 s0"><tspan x="433" dy="0"> </tspan><tspan x="433" dy="16.833">그리고 이것은 발달만의 문제가 아니다.</tspan><tspan x="433" dy="16.833">지표를 바꾸면 답이 달라지는 자리에서는</tspan><tspan x="433" dy="16.833">‘몇 살부터인가’ 가 아니라</tspan><tspan x="433" dy="16.833">‘무엇을 재고 있는가’ 가</tspan><tspan x="433" dy="16.833">먼저 오는 물음이다</tspan></text><g ><g class="shape"><path d="M55 300h259v146H55z" class="stroke-B1 fill-B5 s1"/></g><text x="184.5" y="338.5" class="text-bold fill-N1 s0"><tspan x="184.5" dy="0">인형이 물건을</tspan><tspan x="184.5" dy="16.833">한 곳에 두고 나간 사이에</tspan><tspan x="184.5" dy="16.833">물건을 옮긴다.</tspan><tspan x="184.5" dy="16.833">돌아온 인형이</tspan><tspan x="184.5" dy="16.833">어디를 찾겠느냐고</tspan><tspan x="184.5" dy="16.833">아이에게 묻는다</tspan></text></g><g ><g class="shape"><path d="M55 486h259v98H55z" class="stroke-B1 fill-B5 s1"/></g><text x="184.5" y="524.5" class="text-bold fill-N1 s0"><tspan x="184.5" dy="0">지표 — 아이가</tspan><tspan x="184.5" dy="17.667">말이나 손가락으로</tspan><tspan x="184.5" dy="17.667">고른 자리</tspan></text></g><g ><g class="shape"><path d="M55 624h259v114H55z" class="stroke-B1 fill-B5 s1"/></g><text x="184.5" y="662.5" class="text-bold fill-N1 s0"><tspan x="184.5" dy="0">네 살 무렵을 지나며</tspan><tspan x="184.5" dy="17.25">통과율이 오르는 모양이</tspan><tspan x="184.5" dy="17.25">여러 나라의 표본에서</tspan><tspan x="184.5" dy="17.25">되풀이해 관찰되었다</tspan></text></g><g ><g class="shape"><path d="M55 778h259v178H55z" class="stroke-B1 fill-B5 s1"/></g><text x="184.5" y="816.5" class="text-bold fill-N1 s0"><tspan x="184.5" dy="0">말과 기억과</tspan><tspan x="184.5" dy="16.625">주의를 통제하는 힘이</tspan><tspan x="184.5" dy="16.625">함께 필요한 과제다.</tspan><tspan x="184.5" dy="16.625">못 통과한 것이</tspan><tspan x="184.5" dy="16.625">‘몰라서’ 인지</tspan><tspan x="184.5" dy="16.625">‘말로 못 해서’ 인지</tspan><tspan x="184.5" dy="16.625">이 과제만으로는</tspan><tspan x="184.5" dy="16.625">갈리지 않는다</tspan></text></g><g ><g class="shape"><path d="M418 345h252v146H418z" class="stroke-B1 fill-B5 s1"/></g><text x="544" y="407.5" class="text-bold fill-N1 s0"><tspan x="544" dy="0">같은 장면을</tspan><tspan x="544" dy="17.667">아기에게 보여 주고</tspan><tspan x="544" dy="17.667">말은 시키지 않는다</tspan></text></g><g ><g class="shape"><path d="M710 345h235v146H710z" class="stroke-B1 fill-B5 s1"/></g><text x="827.5" y="383.5" class="text-bold fill-N1 s0"><tspan x="827.5" dy="0">지표 — 인형이</tspan><tspan x="827.5" dy="16.833">‘틀린’ 자리를</tspan><tspan x="827.5" dy="16.833">찾을 때보다</tspan><tspan x="827.5" dy="16.833">‘맞는’ 자리를</tspan><tspan x="827.5" dy="16.833">찾을 때</tspan><tspan x="827.5" dy="16.833">더 오래 보는가</tspan></text></g><g ><g class="shape"><path d="M418 531h252v178H418z" class="stroke-B1 fill-B5 s1"/></g><text x="544" y="609.5" class="text-bold fill-N1 s0"><tspan x="544" dy="0">훨씬 어린 나이에서</tspan><tspan x="544" dy="17.667">차이가 나온다는 보고가</tspan><tspan x="544" dy="17.667">2000년대에 이어졌다</tspan></text></g><g ><g class="shape"><path d="M710 531h235v178H710z" class="stroke-B1 fill-B5 s1"/></g><text x="827.5" y="569.5" class="text-bold fill-N1 s0"><tspan x="827.5" dy="0">그런데 독립적인</tspan><tspan x="827.5" dy="16.625">재현에서 이 결과가</tspan><tspan x="827.5" dy="16.625">잘 나오지 않은 것들이</tspan><tspan x="827.5" dy="16.625">있다.</tspan><tspan x="827.5" dy="16.625">여러 연구실이</tspan><tspan x="827.5" dy="16.625">함께 검사하는</tspan><tspan x="827.5" dy="16.625">프로젝트도</tspan><tspan x="827.5" dy="16.625">이 물음을 다루었다</tspan></text></g><g ><g class="shape"><path d="M418 749h252v162H418z" class="stroke-B1 fill-B5 s1"/></g><text x="544" y="787.5" class="text-bold fill-N1 s0"><tspan x="544" dy="0">더 오래 보는 것이</tspan><tspan x="544" dy="16.714">‘남의 믿음을 안다’ 는</tspan><tspan x="544" dy="16.714">뜻인지도 다투어진다.</tspan><tspan x="544" dy="16.714">장면의 물리적</tspan><tspan x="544" dy="16.714">새로움만으로도</tspan><tspan x="544" dy="16.714">응시 시간이</tspan><tspan x="544" dy="16.714">달라질 수 있다</tspan></text></g><marker id="mk-d2-4147752444-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4147752444-3488378134)" d="M185 448v34" class="connection stroke-B1 s1" mask="url(#d2-4147752444)"/><path fill="none" marker-end="url(#mk-d2-4147752444-3488378134)" d="M185 586v34" class="connection stroke-B1 s1" mask="url(#d2-4147752444)"/><path fill="none" marker-end="url(#mk-d2-4147752444-3488378134)" d="M185 740v34" class="connection stroke-B1 s1" mask="url(#d2-4147752444)"/><path fill="none" marker-end="url(#mk-d2-4147752444-3488378134)" d="M671.5 418h35" class="connection stroke-B1 s1" mask="url(#d2-4147752444)"/><path fill="none" marker-end="url(#mk-d2-4147752444-3488378134)" d="m723.373 492.162-51.118 36.513" class="connection stroke-B1 s1" mask="url(#d2-4147752444)"/><path fill="none" marker-end="url(#mk-d2-4147752444-3488378134)" d="M671.5 620h35" class="connection stroke-B1 s1" mask="url(#d2-4147752444)"/><path fill="none" marker-end="url(#mk-d2-4147752444-3488378134)" d="m708.39 708.186-52.17 38.441" class="connection stroke-B1 s1" mask="url(#d2-4147752444)"/><path fill="none" marker-end="url(#mk-d2-4147752444-3488378134)" d="m352.018 171 .306 33s.092 10-9.908 10H195s-10 0-10 10v26" class="connection stroke-B1 s1" mask="url(#d2-4147752444)"/><path fill="none" marker-end="url(#mk-d2-4147752444-3488378134)" d="m514.001 171 .08 124" class="connection stroke-B1 s1" mask="url(#d2-4147752444)"/><marker id="mk-d2-4147752444-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4147752444-2177206569)" d="M185 998v28s0 10 10 10h169.916s10 0 10 10v26" class="connection stroke-B2 s4" mask="url(#d2-4147752444)"/><path fill="none" marker-end="url(#mk-d2-4147752444-2177206569)" d="M491.583 953v119" class="connection stroke-B2 s4" mask="url(#d2-4147752444)"/><path fill="none" marker-end="url(#mk-d2-4147752444-3488378134)" d="M433.25 1195v64" class="connection stroke-B1 s1" mask="url(#d2-4147752444)"/><mask id="d2-4147752444" width="1175" height="1554" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1175v1554H-89z"/></mask></svg>