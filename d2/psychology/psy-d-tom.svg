<svg xmlns="http://www.w3.org/2000/svg" width="1721" height="1831" class="d2-2803955400 d2-svg" viewBox="-91 -101 1721 1831"><rect width="1721" height="1831" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2803955400 .fill-N1{fill:#0a0f25}.d2-2803955400 .fill-B4{fill:#e3e9fd}.d2-2803955400 .fill-B5{fill:#edf0fd}.d2-2803955400 .stroke-B1,.d2-2803955400 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="806" cy="139.5" class="shape stroke-B1" rx="419" ry="139.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="806" y="145" class="text-bold fill-N1 s0">물음 — 아이는 언제부터 남이 틀린 믿음을 가질 수 있음을 아는가</text></g><g ><g class="shape"><path d="M10 615h813v672H10z" class="stroke-B1 fill-B4 s1"/></g><text x="416.5" y="602" class="fill-N1 s2">말로 답하게 하는 과제</text></g><g ><g class="shape"><path d="M863 399h666v888H863z" class="stroke-B1 fill-B4 s1"/></g><text x="1196" y="386" class="fill-N1 s2">응시 시간으로 재는 과제</text></g><text x="806" y="1423" class="fill-N1 s0"><tspan x="806" dy="0"> </tspan><tspan x="806" dy="17.25">지금 이 문서가 적을 수 있는 것 — 말로 답하는 과제의 결과는 되풀이되었고,</tspan><tspan x="806" dy="17.25">응시 시간 과제의 결과는 재현 검사가 진행 중이며 판정이 갈려 있다.</tspan><tspan x="806" dy="17.25">그러므로 ‘마음이론은 몇 살에 생긴다’ 는 문장을 하나로 적을 수 없다</tspan></text><text x="806" y="1592" class="fill-N1 s0"><tspan x="806" dy="0"> </tspan><tspan x="806" dy="17.667">그리고 이것은 발달만의 문제가 아니다. 지표를 바꾸면 답이 달라지는 자리에서는</tspan><tspan x="806" dy="17.667">‘몇 살부터인가’ 가 아니라 ‘무엇을 재고 있는가’ 가 먼저 오는 물음이다</tspan></text><g ><g class="shape"><path d="M157 645h519v82H157z" class="stroke-B1 fill-B5 s1"/></g><text x="416.5" y="683.5" class="text-bold fill-N1 s0"><tspan x="416.5" dy="0">인형이 물건을 한 곳에 두고 나간 사이에 물건을 옮긴다.</tspan><tspan x="416.5" dy="18.5">돌아온 인형이 어디를 찾겠느냐고 아이에게 묻는다</tspan></text></g><g ><g class="shape"><path d="M208 827h418v66H208z" class="stroke-B1 fill-B5 s1"/></g><text x="417" y="865.5" class="text-bold fill-N1 s0">지표 — 아이가 말이나 손가락으로 고른 자리</text></g><g ><g class="shape"><path d="M203 993h427v82H203z" class="stroke-B1 fill-B5 s1"/></g><text x="416.5" y="1031.5" class="text-bold fill-N1 s0"><tspan x="416.5" dy="0">네 살 무렵을 지나며 통과율이 오르는 모양이</tspan><tspan x="416.5" dy="18.5">여러 나라의 표본에서 되풀이해 관찰되었다</tspan></text></g><g ><g class="shape"><path d="M40 1175h753v82H40z" class="stroke-B1 fill-B5 s1"/></g><text x="416.5" y="1213.5" class="text-bold fill-N1 s0"><tspan x="416.5" dy="0">말과 기억과 집행 기능이 함께 필요한 과제다.</tspan><tspan x="416.5" dy="18.5">못 통과한 것이 ‘몰라서’ 인지 ‘말로 못 해서’ 인지 이 과제만으로는 갈리지 않는다</tspan></text></g><g ><g class="shape"><path d="M951 429h491v66H951z" class="stroke-B1 fill-B5 s1"/></g><text x="1196.5" y="467.5" class="text-bold fill-N1 s0">같은 장면을 아기에게 보여 주고 말은 시키지 않는다</text></g><g ><g class="shape"><path d="M997 645h399v82H997z" class="stroke-B1 fill-B5 s1"/></g><text x="1196.5" y="683.5" class="text-bold fill-N1 s0"><tspan x="1196.5" dy="0">지표 — 인형이 ‘틀린’ 자리를 찾을 때보다</tspan><tspan x="1196.5" dy="18.5">‘맞는’ 자리를 찾을 때 더 오래 보는가</tspan></text></g><g ><g class="shape"><path d="M893 827h606v66H893z" class="stroke-B1 fill-B5 s1"/></g><text x="1196" y="865.5" class="text-bold fill-N1 s0">훨씬 어린 나이에서 차이가 나온다는 보고가 2000년대에 이어졌다</text></g><g ><g class="shape"><path d="M895 993h603v82H895z" class="stroke-B1 fill-B5 s1"/></g><text x="1196.5" y="1031.5" class="text-bold fill-N1 s0"><tspan x="1196.5" dy="0">그런데 독립적인 재현에서 이 결과가 잘 나오지 않은 것들이 있다.</tspan><tspan x="1196.5" dy="18.5">여러 연구실이 함께 검사하는 프로젝트가 진행 중이다</tspan></text></g><g ><g class="shape"><path d="M904 1175h585v82H904z" class="stroke-B1 fill-B5 s1"/></g><text x="1196.5" y="1213.5" class="text-bold fill-N1 s0"><tspan x="1196.5" dy="0">더 오래 보는 것이 ‘남의 믿음을 안다’ 는 뜻인지도 다투어진다.</tspan><tspan x="1196.5" dy="18.5">장면의 물리적 새로움만으로도 응시 시간이 달라질 수 있다</tspan></text></g><marker id="mk-d2-2803955400-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2803955400-3488378134)" d="M416.5 729v94" class="connection stroke-B1 s1" mask="url(#d2-2803955400)"/><path fill="none" marker-end="url(#mk-d2-2803955400-3488378134)" d="M416.5 895v94" class="connection stroke-B1 s1" mask="url(#d2-2803955400)"/><path fill="none" marker-end="url(#mk-d2-2803955400-3488378134)" d="M416.5 1077v94" class="connection stroke-B1 s1" mask="url(#d2-2803955400)"/><path fill="none" marker-end="url(#mk-d2-2803955400-3488378134)" d="M1196 497v144" class="connection stroke-B1 s1" mask="url(#d2-2803955400)"/><path fill="none" marker-end="url(#mk-d2-2803955400-3488378134)" d="M1196 729v94" class="connection stroke-B1 s1" mask="url(#d2-2803955400)"/><path fill="none" marker-end="url(#mk-d2-2803955400-3488378134)" d="M1196 895v94" class="connection stroke-B1 s1" mask="url(#d2-2803955400)"/><path fill="none" marker-end="url(#mk-d2-2803955400-3488378134)" d="M1196 1077v94" class="connection stroke-B1 s1" mask="url(#d2-2803955400)"/><path fill="none" marker-end="url(#mk-d2-2803955400-3488378134)" d="M568.198 255.869C447.2 314.2 416.5 339 416.5 354v216" class="connection stroke-B1 s1" mask="url(#d2-2803955400)"/><path fill="none" marker-end="url(#mk-d2-2803955400-3488378134)" d="M1044.8 255.87C1165.4 314.2 1196 334.8 1196 354" class="connection stroke-B1 s1" mask="url(#d2-2803955400)"/><marker id="mk-d2-2803955400-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2803955400-2177206569)" d="M416.5 1289c0 54 46.2 78 227.09 117.154" class="connection stroke-B2 s4" mask="url(#d2-2803955400)"/><path fill="none" marker-end="url(#mk-d2-2803955400-2177206569)" d="M1196 1289c0 54-46.2 78-227.09 117.154" class="connection stroke-B2 s4" mask="url(#d2-2803955400)"/><path fill="none" marker-end="url(#mk-d2-2803955400-3488378134)" d="M806.25 1478v94" class="connection stroke-B1 s1" mask="url(#d2-2803955400)"/><mask id="d2-2803955400" width="1721" height="1831" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1721v1831H-91z"/></mask></svg>