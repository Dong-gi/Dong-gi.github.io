<svg xmlns="http://www.w3.org/2000/svg" width="2573" height="854" class="d2-2208549698 d2-svg" viewBox="-101 -101 2573 854"><rect width="2573" height="854" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2208549698 .fill-N1{fill:#0a0f25}.d2-2208549698 .fill-B6{fill:#f7f8fe}.d2-2208549698 .stroke-B1,.d2-2208549698 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="1116.5" cy="66" class="shape stroke-B1 fill-B6 s0" rx="197.5" ry="66"/></g><text x="1116.5" y="71.5" class="text-bold fill-N1 s1">왜 시험 전날 잠을 설쳤는가</text></g><g ><g class="shape"><path d="M0 232h447v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="223.5" y="270.5" class="text-bold fill-N1 s1"><tspan x="223.5" dy="0">생물 층위</tspan><tspan x="223.5" dy="18.5">각성 체계가 켜져 있고 스트레스 호르몬이 높다</tspan></text></g><g ><g class="shape"><path d="M507 232h595v82H507z" class="stroke-B1 fill-B6 s0"/></g><text x="804.5" y="270.5" class="text-bold fill-N1 s1"><tspan x="804.5" dy="0">개인 층위</tspan><tspan x="804.5" dy="18.5">결과를 통제할 수 없다고 여기고 실패 장면을 되풀이해 떠올린다</tspan></text></g><g ><g class="shape"><path d="M1162 232h534v82h-534z" class="stroke-B1 fill-B6 s0"/></g><text x="1429" y="270.5" class="text-bold fill-N1 s1"><tspan x="1429" dy="0">사회·문화 층위</tspan><tspan x="1429" dy="18.5">이 시험 하나가 진로를 정한다고 여겨지는 제도 안에 있다</tspan></text></g><g ><g class="shape"><path d="M1756 232h615v82h-615z" class="stroke-B1 fill-B6 s0"/></g><text x="2063.5" y="270.5" class="text-bold fill-N1 s1"><tspan x="2063.5" dy="0">발달 층위</tspan><tspan x="2063.5" dy="18.5">시험이라는 상황에 대해 지금까지 겪은 것이 반응을 만들어 놓았다</tspan></text></g><text x="826" y="430" class="fill-N1 s1"><tspan x="826" dy="0"> </tspan><tspan x="826" dy="17.25">넷 가운데 하나가 ‘진짜 원인’ 이고 나머지가 겉모습인 것이 아니다.</tspan><tspan x="826" dy="17.25">호르몬 이야기가 제도 이야기를 지우지 않고 그 반대도 아니다.</tspan><tspan x="826" dy="17.25">어떤 층위에서 물었는지를 밝히지 않으면 서로 다른 답이 다투는 것처럼 보인다</tspan></text><text x="826.5" y="599" class="fill-N1 s1"><tspan x="826.5" dy="0"> </tspan><tspan x="826.5" dy="17.25">‘결국 다 뇌의 일 아닌가’ 라는 물음은 이 문서가 답하지 않는다.</tspan><tspan x="826.5" dy="17.25">그것은 존재론의 물음이고 철학 문서 14장이 다룬다.</tspan><tspan x="826.5" dy="17.25">이 문서가 묻는 것은 ‘어느 층위에서 무엇을 잴 수 있는가’ 다</tspan></text><marker id="mk-d2-2208549698-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2208549698-3488378134)" d="M931.017 90.257C365.4 163.6 223.5 192 223.5 228" class="connection stroke-B1 s0" mask="url(#d2-2208549698)"/><path fill="none" marker-end="url(#mk-d2-2208549698-3488378134)" d="M983.125 115.696C840.6 168.6 804.5 192 804.5 228" class="connection stroke-B1 s0" mask="url(#d2-2208549698)"/><path fill="none" marker-end="url(#mk-d2-2208549698-3488378134)" d="M1249.876 115.694C1392.8 168.6 1429 192 1429 228" class="connection stroke-B1 s0" mask="url(#d2-2208549698)"/><path fill="none" marker-end="url(#mk-d2-2208549698-3488378134)" d="M1303.985 89.242C1911.2 163.4 2063.5 192 2063.5 228" class="connection stroke-B1 s0" mask="url(#d2-2208549698)"/><marker id="mk-d2-2208549698-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2208549698-2177206569)" d="M223.5 316c0 38 71.4 58 353.039 97.445" class="connection stroke-B2 s3" mask="url(#d2-2208549698)"/><path fill="none" marker-end="url(#mk-d2-2208549698-2177206569)" d="M1429 316c0 38-71.4 58-353.039 97.445" class="connection stroke-B2 s3" mask="url(#d2-2208549698)"/><path fill="none" marker-end="url(#mk-d2-2208549698-2177206569)" d="M826.25 485v94" class="connection stroke-B2 s3" mask="url(#d2-2208549698)"/><mask id="d2-2208549698" width="2573" height="854" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2573v854H-101z"/></mask></svg>