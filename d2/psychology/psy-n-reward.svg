<svg xmlns="http://www.w3.org/2000/svg" width="1334" height="1248" class="d2-4091685822 d2-svg" viewBox="-101 -101 1334 1248"><rect width="1334" height="1248" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4091685822 .fill-N1{fill:#0a0f25}.d2-4091685822 .fill-B4{fill:#e3e9fd}.d2-4091685822 .fill-B5{fill:#edf0fd}.d2-4091685822 .stroke-B1,.d2-4091685822 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="720" cy="50.5" class="shape stroke-B1" rx="151" ry="50.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="720" y="40" class="text-bold fill-N1 s0"><tspan x="720" dy="0">이미 그 일을 좋아서</tspan><tspan x="720" dy="17.667">하고 있는 사람에게</tspan><tspan x="720" dy="17.667">보상을 준다</tspan></text></g><g ><g class="shape"><path d="M0 515h670v346H0z" class="stroke-B1 fill-B4 s1"/></g><text x="335" y="548" class="fill-N1 s2">깎인다는 쪽으로 무게가 실린 조건</text></g><g ><g class="shape"><path d="M757 520h375v336H757z" class="stroke-B1 fill-B4 s1"/></g><text x="944.5" y="553" class="fill-N1 s2"><tspan x="944.5" dy="0">깎이지 않거나</tspan><tspan x="944.5" dy="32">오히려 늘어나는 조건</tspan></text></g><g ><g class="shape"><path d="M529 221h383v174H529z" class="stroke-B1 fill-B4 s1"/></g><text x="720.5" y="208" class="fill-N1 s2">종합마다 판정이 갈린 조건</text></g><text x="710.5" y="977" class="fill-N1 s0"><tspan x="710.5" dy="0"> </tspan><tspan x="710.5" dy="17">이 결과의 등급 — 메타분석마다 결론이 갈렸던 주제다.</tspan><tspan x="710.5" dy="17">효과가 없거나 아주 작다고 본 종합도 있었고,</tspan><tspan x="710.5" dy="17">위 조건에서는 뚜렷하다고 본 종합도 있었다.</tspan><tspan x="710.5" dy="17">그러므로 ‘보상은 언제나 동기를 해친다’ 는 문장은 자료보다 훨씬 세다</tspan></text><g ><g class="shape"><path d="M50 565h255v82H50z" class="stroke-B1 fill-B5 s1"/></g><text x="177.5" y="603.5" class="text-bold fill-N1 s0"><tspan x="177.5" dy="0">물질적인 보상이다 —</tspan><tspan x="177.5" dy="18.5">돈이나 물건</tspan></text></g><g ><g class="shape"><path d="M355 565h265v82H355z" class="stroke-B1 fill-B5 s1"/></g><text x="487.5" y="603.5" class="text-bold fill-N1 s0"><tspan x="487.5" dy="0">미리 알려 준다 —</tspan><tspan x="487.5" dy="18.5">‘이걸 하면 이만큼 준다’</tspan></text></g><g ><g class="shape"><path d="M50 697h255v114H50z" class="stroke-B1 fill-B5 s1"/></g><text x="177.5" y="735.5" class="text-bold fill-N1 s0"><tspan x="177.5" dy="0">일을 했다는 사실 자체에</tspan><tspan x="177.5" dy="17.25">딸려 나온다.</tspan><tspan x="177.5" dy="17.25">잘했는지와 무관하게</tspan><tspan x="177.5" dy="17.25">주어진다</tspan></text></g><g ><g class="shape"><path d="M355 697h265v114H355z" class="stroke-B1 fill-B5 s1"/></g><text x="487.5" y="751.5" class="text-bold fill-N1 s0"><tspan x="487.5" dy="0">그 뒤 보상을 거두었을 때,</tspan><tspan x="487.5" dy="18.5">보상 전보다 덜 하게 된다</tspan></text></g><g ><g class="shape"><path d="M773 594h343v66H773z" class="stroke-B1 fill-B5 s1"/></g><text x="944.5" y="632.5" class="text-bold fill-N1 s0">말로 하는 인정과 구체적인 되먹임</text></g><g ><g class="shape"><path d="M773 676h343v66H773z" class="stroke-B1 fill-B5 s1"/></g><text x="944.5" y="714.5" class="text-bold fill-N1 s0">예상하지 못한 채 나중에 받은 보상</text></g><g ><g class="shape"><path d="M773 758h343v82H773z" class="stroke-B1 fill-B5 s1"/></g><text x="944.5" y="796.5" class="text-bold fill-N1 s0"><tspan x="944.5" dy="0">애초에 하기 싫었던 일 —</tspan><tspan x="944.5" dy="18.5">깎일 내재 동기가 없다</tspan></text></g><g ><g class="shape"><path d="M559 251h323v114H559z" class="stroke-B1 fill-B5 s1"/></g><text x="720.5" y="289.5" class="text-bold fill-N1 s0"><tspan x="720.5" dy="0">잘한 수준에 따라 주는 물질 보상</tspan><tspan x="720.5" dy="17.25">깎는다고 본 종합도 있고,</tspan><tspan x="720.5" dy="17.25">깎는다는 결과를 찾지 못한</tspan><tspan x="720.5" dy="17.25">종합도 있다</tspan></text></g><marker id="mk-d2-4091685822-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4091685822-3488378134)" d="m265.306 647.86 99.583 47.42" class="connection stroke-B1 s1" mask="url(#d2-4091685822)"/><path fill="none" marker-end="url(#mk-d2-4091685822-3488378134)" d="M487.5 649v44" class="connection stroke-B1 s1" mask="url(#d2-4091685822)"/><path fill="none" marker-end="url(#mk-d2-4091685822-3488378134)" d="M306.5 754h44" class="connection stroke-B1 s1" mask="url(#d2-4091685822)"/><path fill="none" marker-end="url(#mk-d2-4091685822-3488378134)" d="M599.064 82.502C388.2 137.2 335 161 335 176v335" class="connection stroke-B1 s1" mask="url(#d2-4091685822)"/><path fill="none" marker-end="url(#mk-d2-4091685822-3488378134)" d="M720 103v73" class="connection stroke-B1 s1" mask="url(#d2-4091685822)"/><path fill="none" marker-end="url(#mk-d2-4091685822-3488378134)" d="M816.852 90.756C934.6 138.8 964.5 161 964.5 176v185.5c0 32.1-1 114.5-4.638 154.516" class="connection stroke-B1 s1" mask="url(#d2-4091685822)"/><marker id="mk-d2-4091685822-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4091685822-2177206569)" d="M335 863c0 38 40.6 58 199.116 97.043" class="connection stroke-B2 s4" mask="url(#d2-4091685822)"/><path fill="none" marker-end="url(#mk-d2-4091685822-2177206569)" d="M710 397v560" class="connection stroke-B2 s4" mask="url(#d2-4091685822)"/><path fill="none" marker-end="url(#mk-d2-4091685822-2177206569)" d="M944.5 858c0 42-25.4 63-123.278 101.535" class="connection stroke-B2 s4" mask="url(#d2-4091685822)"/><mask id="d2-4091685822" width="1334" height="1248" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1334v1248H-101z"/></mask></svg>