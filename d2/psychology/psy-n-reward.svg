<svg xmlns="http://www.w3.org/2000/svg" width="3470" height="1102" class="d2-528371870 d2-svg" viewBox="-91 -101 3470 1102"><rect width="3470" height="1102" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-528371870 .fill-N1{fill:#0a0f25}.d2-528371870 .fill-B4{fill:#e3e9fd}.d2-528371870 .fill-B5{fill:#edf0fd}.d2-528371870 .stroke-B1,.d2-528371870 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="1367.5" cy="116.5" class="shape stroke-B1" rx="349.5" ry="116.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1367.5" y="122" class="text-bold fill-N1 s0">이미 그 일을 좋아서 하고 있는 사람에게 보상을 준다</text></g><g ><g class="shape"><path d="M10 353h1281v358H10z" class="stroke-B1 fill-B4 s1"/></g><text x="650.5" y="340" class="fill-N1 s2">깎인다는 쪽으로 무게가 실린 조건</text></g><g ><g class="shape"><path d="M1331 585h1947v126H1331z" class="stroke-B1 fill-B4 s1"/></g><text x="2304.5" y="572" class="fill-N1 s2">깎이지 않거나 오히려 늘어나는 조건</text></g><text x="1543" y="847" class="fill-N1 s0"><tspan x="1543" dy="0"> </tspan><tspan x="1543" dy="17.25">이 결과의 등급 — 메타분석마다 결론이 갈렸던 주제다.</tspan><tspan x="1543" dy="17.25">효과가 없거나 아주 작다고 본 종합도 있었고, 위 조건에서는 뚜렷하다고 본 종합도 있었다.</tspan><tspan x="1543" dy="17.25">그러므로 ‘보상은 언제나 동기를 해친다’ 는 문장은 자료보다 훨씬 세다</tspan></text><g ><g class="shape"><path d="M40 391h330v66H40z" class="stroke-B1 fill-B5 s1"/></g><text x="205" y="429.5" class="text-bold fill-N1 s0">물질적인 보상이다 — 돈이나 물건</text></g><g ><g class="shape"><path d="M430 391h403v66H430z" class="stroke-B1 fill-B5 s1"/></g><text x="631.5" y="429.5" class="text-bold fill-N1 s0">미리 알려 준다 — ‘이걸 하면 이만큼 준다’</text></g><g ><g class="shape"><path d="M893 383h368v82H893z" class="stroke-B1 fill-B5 s1"/></g><text x="1077" y="421.5" class="text-bold fill-N1 s0"><tspan x="1077" dy="0">일을 했다는 사실 자체에 딸려 나온다.</tspan><tspan x="1077" dy="18.5">잘했는지와 무관하게 주어진다</tspan></text></g><g ><g class="shape"><path d="M391 615h482v66H391z" class="stroke-B1 fill-B5 s1"/></g><text x="632" y="653.5" class="text-bold fill-N1 s0">그 뒤 보상을 거두었을 때, 보상 전보다 덜 하게 된다</text></g><g ><g class="shape"><path d="M1361 615h340v66h-340z" class="stroke-B1 fill-B5 s1"/></g><text x="1531" y="653.5" class="text-bold fill-N1 s0">말로 하는 인정과 구체적인 되먹임</text></g><g ><g class="shape"><path d="M1761 615h343v66h-343z" class="stroke-B1 fill-B5 s1"/></g><text x="1932.5" y="653.5" class="text-bold fill-N1 s0">예상하지 못한 채 나중에 받은 보상</text></g><g ><g class="shape"><path d="M2164 615h580v66h-580z" class="stroke-B1 fill-B5 s1"/></g><text x="2454" y="653.5" class="text-bold fill-N1 s0">잘한 수준에 따라 주어져서 ‘잘했다’ 는 정보를 담고 있는 보상</text></g><g ><g class="shape"><path d="M2804 615h444v66h-444z" class="stroke-B1 fill-B5 s1"/></g><text x="3026" y="653.5" class="text-bold fill-N1 s0">애초에 하기 싫었던 일 — 깎일 내재 동기가 없다</text></g><marker id="mk-d2-528371870-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-528371870-3488378134)" d="M205 459c0 44.4 51.399 116 253.074 155.236" class="connection stroke-B1 s1" mask="url(#d2-528371870)"/><path fill="none" marker-end="url(#mk-d2-528371870-3488378134)" d="M631.5 459v152" class="connection stroke-B1 s1" mask="url(#d2-528371870)"/><path fill="none" marker-end="url(#mk-d2-528371870-3488378134)" d="M1077 467c0 38-53.6 108-264.068 147.266" class="connection stroke-B1 s1" mask="url(#d2-528371870)"/><path fill="none" marker-end="url(#mk-d2-528371870-3488378134)" d="M1045.02 163.282C373.4 259 205 297 205 349" class="connection stroke-B1 s1" mask="url(#d2-528371870)"/><path fill="none" marker-end="url(#mk-d2-528371870-3488378134)" d="M1686.977 165.303C2300.2 259.4 2454 293 2454 308v232" class="connection stroke-B1 s1" mask="url(#d2-528371870)"/><marker id="mk-d2-528371870-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-528371870-2177206569)" d="M631.5 713c0 54 107.8 78 535.017 117.63" class="connection stroke-B2 s4" mask="url(#d2-528371870)"/><path fill="none" marker-end="url(#mk-d2-528371870-2177206569)" d="M2454 713c0 54-107.8 78-535.017 117.63" class="connection stroke-B2 s4" mask="url(#d2-528371870)"/><mask id="d2-528371870" width="3470" height="1102" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h3470v1102H-91z"/></mask></svg>