<svg xmlns="http://www.w3.org/2000/svg" width="2476" height="1701" class="d2-3951789231 d2-svg" viewBox="-91 -101 2476 1701"><rect width="2476" height="1701" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3951789231 .fill-N1{fill:#0a0f25}.d2-3951789231 .fill-B4{fill:#e3e9fd}.d2-3951789231 .fill-B5{fill:#edf0fd}.d2-3951789231 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="1074.5" cy="132.5" class="shape stroke-B1" rx="397.5" ry="132.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1074.5" y="114" class="text-bold fill-N1 s0"><tspan x="1074.5" dy="0">관찰된 것</tspan><tspan x="1074.5" dy="17.25">지루한 일을 시킨 뒤 ‘재미있었다’ 고 말해 달라고 부탁한다.</tspan><tspan x="1074.5" dy="17.25">부탁의 대가로 큰 값을 받은 쪽보다 아주 적은 값을 받은 쪽이</tspan><tspan x="1074.5" dy="17.25">뒤에 그 일을 더 재미있었다고 평정한다</tspan></text></g><g ><g class="shape"><path d="M359 393h688v498H359z" class="stroke-B1 fill-B4 s1"/></g><text x="703" y="380" class="fill-N1 s2">인지부조화 설명</text></g><g ><g class="shape"><path d="M1087 385h719v506h-719z" class="stroke-B1 fill-B4 s1"/></g><text x="1446.5" y="372" class="fill-N1 s2">자기지각 설명</text></g><text x="1074.5" y="1027" class="text-bold fill-N1 s0"><tspan x="1074.5" dy="0"> </tspan><tspan x="1074.5" dy="17.667">문제 — 원 실험의 결과는 두 설명이 다 예측한다.</tspan><tspan x="1074.5" dy="17.667">그러므로 그 결과는 두 이론 가운데 어느 쪽도 지지하지 않는다</tspan></text><g ><g class="shape"><path d="M10 1184h2274v142H10z" class="stroke-B1 fill-B4 s1"/></g><text x="1147" y="1171" class="fill-N1 s2">그러면 어떻게 가르는가</text></g><text x="1075" y="1462" class="fill-N1 s0"><tspan x="1075" dy="0"> </tspan><tspan x="1075" dy="17.667">여기서 배울 것 — 어떤 실험이 ‘유명한 이론을 증명했다’ 고 소개될 때</tspan><tspan x="1075" dy="17.667">먼저 물어야 할 것은 ‘그 결과를 다른 이론도 예측하는가’ 이다</tspan></text><g ><g class="shape"><path d="M524 423h357v66H524z" class="stroke-B1 fill-B5 s1"/></g><text x="702.5" y="461.5" class="text-bold fill-N1 s0">생각과 행동이 어긋나면 불편해진다</text></g><g ><g class="shape"><path d="M431 597h543v82H431z" class="stroke-B1 fill-B5 s1"/></g><text x="702.5" y="635.5" class="text-bold fill-N1 s0"><tspan x="702.5" dy="0">적은 값을 받은 사람은 자기 행동을 값으로 설명할 수 없다.</tspan><tspan x="702.5" dy="18.5">그러면 남는 길은 생각 쪽을 바꾸는 것이다</tspan></text></g><g ><g class="shape"><path d="M389 779h628v82H389z" class="stroke-B1 fill-B5 s1"/></g><text x="703" y="817.5" class="text-bold fill-N1 s0"><tspan x="703" dy="0">예측 — 불편을 느끼는 상태가 실제로 있어야 하고,</tspan><tspan x="703" dy="18.5">그 불편을 다른 것으로 돌릴 수 있게 해 주면 태도 변화가 줄어야 한다</tspan></text></g><g ><g class="shape"><path d="M1213 415h467v82h-467z" class="stroke-B1 fill-B5 s1"/></g><text x="1446.5" y="453.5" class="text-bold fill-N1 s0"><tspan x="1446.5" dy="0">사람은 자기 태도를 안에서 읽어내는 것이 아니라</tspan><tspan x="1446.5" dy="18.5">자기 행동을 보고 밖에서 추론한다</tspan></text></g><g ><g class="shape"><path d="M1153 597h586v82h-586z" class="stroke-B1 fill-B5 s1"/></g><text x="1446" y="635.5" class="text-bold fill-N1 s0"><tspan x="1446" dy="0">‘큰 값도 안 받고 재미있었다고 말했네. 그럼 재미있었나 보다.’</tspan><tspan x="1446" dy="18.5">불편이라는 상태가 없어도 같은 결과가 나온다</tspan></text></g><g ><g class="shape"><path d="M1117 779h659v82h-659z" class="stroke-B1 fill-B5 s1"/></g><text x="1446.5" y="817.5" class="text-bold fill-N1 s0"><tspan x="1446.5" dy="0">예측 — 불편이 없어도 태도 변화가 나와야 하고,</tspan><tspan x="1446.5" dy="18.5">남의 행동을 보고 추론할 때와 같은 규칙이 자기에게도 적용되어야 한다</tspan></text></g><g ><g class="shape"><path d="M40 1214h665v82H40z" class="stroke-B1 fill-B5 s1"/></g><text x="372.5" y="1252.5" class="text-bold fill-N1 s0"><tspan x="372.5" dy="0">불편이라는 상태를 따로 잰다. 몸의 각성을 재거나,</tspan><tspan x="372.5" dy="18.5">각성의 원인을 다른 것으로 돌릴 수 있게 해 놓고 결과가 달라지는지 본다</tspan></text></g><g ><g class="shape"><path d="M765 1214h619v82H765z" class="stroke-B1 fill-B5 s1"/></g><text x="1074.5" y="1252.5" class="text-bold fill-N1 s0"><tspan x="1074.5" dy="0">행동이 원래 태도에서 얼마나 벗어났는지를 조건으로 넣는다.</tspan><tspan x="1074.5" dy="18.5">크게 벗어난 자리와 조금 벗어난 자리에서 두 설명의 예측이 갈린다</tspan></text></g><g ><g class="shape"><path d="M1444 1214h810v82h-810z" class="stroke-B1 fill-B5 s1"/></g><text x="1849" y="1252.5" class="text-bold fill-N1 s0"><tspan x="1849" dy="0">지금의 자리 — 두 설명이 서로 다른 조건에서 각각 맞는 쪽으로 정리되었다는 견해가 있고,</tspan><tspan x="1849" dy="18.5">아직 하나로 정해지지 않았다는 견해도 있다</tspan></text></g><marker id="mk-d2-3951789231-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3951789231-3488378134)" d="M702.75 491v102" class="connection stroke-B1 s1" mask="url(#d2-3951789231)"/><path fill="none" marker-end="url(#mk-d2-3951789231-3488378134)" d="M702.75 681v94" class="connection stroke-B1 s1" mask="url(#d2-3951789231)"/><path fill="none" marker-end="url(#mk-d2-3951789231-3488378134)" d="M1446.25 499v94" class="connection stroke-B1 s1" mask="url(#d2-3951789231)"/><path fill="none" marker-end="url(#mk-d2-3951789231-3488378134)" d="M1446.25 681v94" class="connection stroke-B1 s1" mask="url(#d2-3951789231)"/><path fill="none" marker-end="url(#mk-d2-3951789231-3488378134)" d="M849.206 242.884C732.4 300.4 702.75 322.4 702.75 348" class="connection stroke-B1 s1" mask="url(#d2-3951789231)"/><path fill="none" marker-end="url(#mk-d2-3951789231-3488378134)" d="M1299.794 242.884C1416.6 300.4 1446.25 320.8 1446.25 340" class="connection stroke-B1 s1" mask="url(#d2-3951789231)"/><path fill="none" marker-end="url(#mk-d2-3951789231-3488378134)" d="M702.75 893c0 54 48.6 78 239.082 117.194" class="connection stroke-B1 s1" mask="url(#d2-3951789231)"/><path fill="none" marker-end="url(#mk-d2-3951789231-3488378134)" d="M1446.25 893c0 54-48.6 78-239.082 117.194" class="connection stroke-B1 s1" mask="url(#d2-3951789231)"/><path fill="none" marker-end="url(#mk-d2-3951789231-3488378134)" d="M1074.5 1066v73" class="connection stroke-B1 s1" mask="url(#d2-3951789231)"/><path fill="none" marker-end="url(#mk-d2-3951789231-3488378134)" d="M1074.5 1328v114" class="connection stroke-B1 s1" mask="url(#d2-3951789231)"/><mask id="d2-3951789231" width="2476" height="1701" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h2476v1701H-91z"/></mask></svg>