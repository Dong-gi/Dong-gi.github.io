<svg xmlns="http://www.w3.org/2000/svg" width="1319" height="1816" class="d2-181641857 d2-svg" viewBox="-101 -101 1319 1816"><rect width="1319" height="1816" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-181641857 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-181641857 .fill-N1{fill:#0a0f25}.d2-181641857 .fill-B4{fill:#e3e9fd}.d2-181641857 .fill-B5{fill:#edf0fd}.d2-181641857 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="550.5" cy="91" class="shape stroke-B1" rx="272.5" ry="91" style="fill:#f7f8fe;stroke-width:2"/></g><text x="550.5" y="56.5" class="text-bold fill-N1 s0"><tspan x="550.5" dy="0">관찰된 것</tspan><tspan x="550.5" dy="16.833">지루한 일을 시킨 뒤</tspan><tspan x="550.5" dy="16.833">‘재미있었다’ 고 말해 달라고 부탁한다.</tspan><tspan x="550.5" dy="16.833">부탁의 대가로 큰 값을 받은 쪽보다</tspan><tspan x="550.5" dy="16.833">아주 적은 값을 받은 쪽이</tspan><tspan x="550.5" dy="16.833">뒤에 그 일을 더 재미있었다고 평정한다</tspan></text></g><g ><g class="shape"><path d="M0 298h513v478H0z" class="stroke-B1 fill-B4 s1"/></g><text x="256.5" y="331" class="fill-N1 s2">인지부조화 설명</text></g><g ><g class="shape"><path d="M573 282h544v510H573z" class="stroke-B1 fill-B4 s1"/></g><text x="845" y="315" class="fill-N1 s2">자기지각 설명</text></g><text x="550.5" y="908" class="text-bold fill-N1 s0"><tspan x="550.5" dy="0"> </tspan><tspan x="550.5" dy="17.667">문제 — 원 실험의 결과는 두 설명이 다 예측한다.</tspan><tspan x="550.5" dy="17.667">그러므로 그 결과는 두 이론 가운데 어느 쪽도 지지하지 않는다</tspan></text><g ><g class="shape"><path d="M292 1045h518v400H292z" class="stroke-B1 fill-B4 s1"/></g><text x="551" y="1078" class="fill-N1 s2">그러면 어떻게 가르는가</text></g><text x="551" y="1561" class="fill-N1 s0"><tspan x="551" dy="0"> </tspan><tspan x="551" dy="17.25">여기서 배울 것 —</tspan><tspan x="551" dy="17.25">어떤 실험이 ‘유명한 이론을 증명했다’ 고 소개될 때</tspan><tspan x="551" dy="17.25">먼저 물어야 할 것은 ‘그 결과를 다른 이론도 예측하는가’ 이다</tspan></text><g ><g class="shape"><path d="M50 348h413v66H50z" class="stroke-B1 fill-B5 s1"/></g><text x="256.5" y="386.5" class="text-bold fill-N1 s0">생각과 행동이 어긋나면 불편해진다</text></g><g ><g class="shape"><path d="M50 464h413v98H50z" class="stroke-B1 fill-B5 s1"/></g><text x="256.5" y="502.5" class="text-bold fill-N1 s0"><tspan x="256.5" dy="0">적은 값을 받은 사람은</tspan><tspan x="256.5" dy="17.667">자기 행동을 값으로 설명할 수 없다.</tspan><tspan x="256.5" dy="17.667">그러면 남는 길은 생각 쪽을 바꾸는 것이다</tspan></text></g><g ><g class="shape"><path d="M50 612h413v114H50z" class="stroke-B1 fill-B5 s1"/></g><text x="256.5" y="650.5" class="text-bold fill-N1 s0"><tspan x="256.5" dy="0">예측 — 불편을 느끼는 상태가</tspan><tspan x="256.5" dy="17.25">실제로 있어야 하고,</tspan><tspan x="256.5" dy="17.25">그 불편을 다른 것으로 돌릴 수 있게 해 주면</tspan><tspan x="256.5" dy="17.25">태도 변화가 줄어야 한다</tspan></text></g><g ><g class="shape"><path d="M623 332h444v98H623z" class="stroke-B1 fill-B5 s1"/></g><text x="845" y="370.5" class="text-bold fill-N1 s0"><tspan x="845" dy="0">사람은 자기 태도를</tspan><tspan x="845" dy="17.667">안에서 읽어내는 것이 아니라</tspan><tspan x="845" dy="17.667">자기 행동을 보고 밖에서 추론한다</tspan></text></g><g ><g class="shape"><path d="M623 480h444v98H623z" class="stroke-B1 fill-B5 s1"/></g><text x="845" y="518.5" class="text-bold fill-N1 s0"><tspan x="845" dy="0">‘큰 값도 안 받고 재미있었다고 말했네.</tspan><tspan x="845" dy="17.667">그럼 재미있었나 보다.’</tspan><tspan x="845" dy="17.667">불편이라는 상태가 없어도 같은 결과가 나온다</tspan></text></g><g ><g class="shape"><path d="M623 628h444v114H623z" class="stroke-B1 fill-B5 s1"/></g><text x="845" y="666.5" class="text-bold fill-N1 s0"><tspan x="845" dy="0">예측 — 불편이 없어도</tspan><tspan x="845" dy="17.25">태도 변화가 나와야 하고,</tspan><tspan x="845" dy="17.25">남의 행동을 보고 추론할 때와 같은 규칙이</tspan><tspan x="845" dy="17.25">자기에게도 적용되어야 한다</tspan></text></g><g ><g class="shape"><path d="M312 1091h478v98H312z" class="stroke-B1 fill-B5 s1"/></g><text x="551" y="1129.5" class="text-bold fill-N1 s0"><tspan x="551" dy="0">불편이라는 상태를 따로 잰다. 몸의 각성을 재거나,</tspan><tspan x="551" dy="17.667">각성의 원인을 다른 것으로 돌릴 수 있게 해 놓고</tspan><tspan x="551" dy="17.667">결과가 달라지는지 본다</tspan></text></g><g ><g class="shape"><path d="M312 1209h478v98H312z" class="stroke-B1 fill-B5 s1"/></g><text x="551" y="1247.5" class="text-bold fill-N1 s0"><tspan x="551" dy="0">행동이 원래 태도에서 얼마나 벗어났는지를</tspan><tspan x="551" dy="17.667">조건으로 넣는다. 크게 벗어난 자리와</tspan><tspan x="551" dy="17.667">조금 벗어난 자리에서 두 설명의 예측이 갈린다</tspan></text></g><g ><g class="shape"><path d="M312 1327h478v98H312z" class="stroke-B1 fill-B5 s1"/></g><text x="551" y="1365.5" class="text-bold fill-N1 s0"><tspan x="551" dy="0">지금의 자리 — 대표 절차의 핵심 예측이</tspan><tspan x="551" dy="17.667">2024년 대규모 재현에서 나오지 않았다.</tspan><tspan x="551" dy="17.667">남은 결과도 어느 설명이 맞는지는 견해가 갈린다</tspan></text></g><marker id="mk-d2-181641857-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-181641857-3488378134)" d="M256.5 416v44" class="connection stroke-B1 s1" mask="url(#d2-181641857)"/><path fill="none" marker-end="url(#mk-d2-181641857-3488378134)" d="M256.5 564v44" class="connection stroke-B1 s1" mask="url(#d2-181641857)"/><path fill="none" marker-end="url(#mk-d2-181641857-3488378134)" d="M845 432v44" class="connection stroke-B1 s1" mask="url(#d2-181641857)"/><path fill="none" marker-end="url(#mk-d2-181641857-3488378134)" d="M845 580v44" class="connection stroke-B1 s1" mask="url(#d2-181641857)"/><path fill="none" marker-end="url(#mk-d2-181641857-3488378134)" d="M393.195 166.86C284.2 218.8 256.5 245.2 256.5 294" class="connection stroke-B1 s1" mask="url(#d2-181641857)"/><path fill="none" marker-end="url(#mk-d2-181641857-3488378134)" d="M708.804 166.863C817.4 218.8 845 242 845 278" class="connection stroke-B1 s1" mask="url(#d2-181641857)"/><path fill="none" marker-end="url(#mk-d2-181641857-3488378134)" d="M256.5 778c0 50.8 38.4 74 188.13 112.992" class="connection stroke-B1 s1" mask="url(#d2-181641857)"/><path fill="none" marker-end="url(#mk-d2-181641857-3488378134)" d="M845 794c0 38-38.4 58-188.13 96.992" class="connection stroke-B1 s1" mask="url(#d2-181641857)"/><path fill="none" marker-end="url(#mk-d2-181641857-3488378134)" d="M550.75 947v94" class="connection stroke-B1 s1" mask="url(#d2-181641857)"/><path fill="none" marker-end="url(#mk-d2-181641857-3488378134)" d="M550.75 1447v94" class="connection stroke-B1 s1" mask="url(#d2-181641857)"/><mask id="d2-181641857" width="1319" height="1816" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1319v1816H-101z"/></mask></svg>