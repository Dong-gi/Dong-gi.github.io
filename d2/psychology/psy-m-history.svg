<svg xmlns="http://www.w3.org/2000/svg" width="1453" height="1434" class="d2-201714639 d2-svg" viewBox="-101 -101 1453 1434"><rect width="1453" height="1434" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-201714639 .fill-N1{fill:#0a0f25}.d2-201714639 .fill-N2{fill:#676c7e}.d2-201714639 .fill-B6{fill:#f7f8fe}.d2-201714639 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="525.5" cy="79" class="shape stroke-B1 fill-B6 s0" rx="237.5" ry="79"/></g><text x="525.5" y="68.5" class="text-bold fill-N1 s1"><tspan x="525.5" dy="0">철학과 생리학</tspan><tspan x="525.5" dy="17.667">마음에 대한 물음은 오래되었지만</tspan><tspan x="525.5" dy="17.667">재는 절차가 없었다</tspan></text></g><g ><g class="shape"><path d="M302 279h447v98H302z" class="stroke-B1 fill-B6 s0"/></g><text x="525.5" y="317.5" class="text-bold fill-N1 s1"><tspan x="525.5" dy="0">구성주의</tspan><tspan x="525.5" dy="17.667">분트(1832–1920) · 티치너(1867–1927)</tspan><tspan x="525.5" dy="17.667">훈련된 내성 보고로 의식 경험의 성분을 찾는다</tspan></text></g><g ><g class="shape"><path d="M526 498h426v98H526z" class="stroke-B1 fill-B6 s0"/></g><text x="739" y="536.5" class="text-bold fill-N1 s1"><tspan x="739" dy="0">기능주의</tspan><tspan x="739" dy="17.667">제임스(1842–1910)</tspan><tspan x="739" dy="17.667">성분이 아니라 ‘무엇에 쓰이는가’ 를 묻는다</tspan></text></g><g ><g class="shape"><path d="M277 696h496v98H277z" class="stroke-B1 fill-B6 s0"/></g><text x="525" y="734.5" class="text-bold fill-N1 s1"><tspan x="525" dy="0">행동주의</tspan><tspan x="525" dy="17.667">왓슨(1878–1958) · 스키너(1904–1990)</tspan><tspan x="525" dy="17.667">관찰 가능한 행동만 자료로 삼는다. 속은 묻지 않는다</tspan></text></g><g ><g class="shape"><path d="M206 915h639v98H206z" class="stroke-B1 fill-B6 s0"/></g><text x="525.5" y="953.5" class="text-bold fill-N1 s1"><tspan x="525.5" dy="0">인지혁명</tspan><tspan x="525.5" dy="17.667">밀러(1920–2012) · 나이서(1928–2012)</tspan><tspan x="525.5" dy="17.667">속의 처리 과정을 정보 처리 모형으로 세우고 반응 시간으로 검사한다</tspan></text></g><g ><g class="shape"><path d="M0 1134h395v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="197.5" y="1172.5" class="text-bold fill-N1 s1"><tspan x="197.5" dy="0">지금</tspan><tspan x="197.5" dy="17.667">인지신경과학 · 계산 모형 · 대규모 자료</tspan><tspan x="197.5" dy="17.667">그리고 6장의 재현 위기 이후의 방법 개혁</tspan></text></g><text x="853" y="1165" class="fill-N1 s1"><tspan x="853" dy="0"> </tspan><tspan x="853" dy="17.25">행동주의가 틀려서 버려진 것이 아니다. 조건형성 연구는 지금도 튼튼하고 7장이 그것을 다룬다.</tspan><tspan x="853" dy="17.25">바뀐 것은 ‘속을 묻지 않는다’ 는 금지였다.</tspan><tspan x="853" dy="17.25">인지혁명은 속을 묻되 검사 가능한 형태로 묻는 방법을 찾은 것이다</tspan></text><marker id="mk-d2-201714639-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-201714639-3488378134)" d="M525.008 160c.192 46.4.242 70.7.242 115.5" class="connection stroke-B1 s0" mask="url(#d2-201714639)"/><text x="525.5" y="224" class="text-italic fill-N2 s1">재는 절차를 만든다</text><path fill="none" marker-end="url(#mk-d2-201714639-3488378134)" d="M622.277 377.418C714.9 425.3 738.5 449.7 738.5 494.5" class="connection stroke-B1 s0" mask="url(#d2-201714639)"/><text x="704" y="425" class="text-italic fill-N2 s1">성분보다 기능을 묻자</text><path fill="none" marker-end="url(#mk-d2-201714639-3488378134)" d="M428.223 377.418C335.6 425.3 312 459.4 312 492.25S333.6 656 416.37 694.32" class="connection stroke-B1 s0" mask="url(#d2-201714639)"/><text x="313.5" y="538" class="text-italic fill-N2 s1">내성 보고는 사람마다 달라 검사할 수 없다</text><path fill="none" marker-end="url(#mk-d2-201714639-3488378134)" d="M738.5 598c0 38-21.6 58-104.37 96.32" class="connection stroke-B1 s0" mask="url(#d2-201714639)"/><path fill="none" marker-end="url(#mk-d2-201714639-3488378134)" d="M525.25 795.5v116" class="connection stroke-B1 s0" mask="url(#d2-201714639)"/><text x="525.5" y="860" class="text-italic fill-N2 s1">행동만으로는 언어와 기억을 설명하지 못한다</text><path fill="none" marker-end="url(#mk-d2-201714639-3488378134)" d="M376.605 1013.139C233.7 1061.3 197.5 1085.7 197.5 1130.5" class="connection stroke-B1 s0" mask="url(#d2-201714639)"/><text x="262" y="1057" class="text-italic fill-N2 s1">측정 수단이 늘어난다</text><marker id="mk-d2-201714639-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-201714639-2177206569)" d="M673.895 1013.139C816.8 1061.3 853 1088.5 853 1144.5" class="connection" mask="url(#d2-201714639)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-201714639" width="1453" height="1434" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1453v1434H-101z"/><path d="M443 208h165v21H443zM612 409h184v21H612zM138 522h351v21H138zM334 844h383v21H334zM170 1041h184v21H170z"/></mask></svg>