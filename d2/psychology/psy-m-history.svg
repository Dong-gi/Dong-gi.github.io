<svg xmlns="http://www.w3.org/2000/svg" width="995" height="1549" class="d2-3956133458 d2-svg" viewBox="-101 -101 995 1549"><rect width="995" height="1549" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3956133458 .text-bold{font-weight:700}.d2-3956133458 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3956133458 .fill-N1{fill:#0a0f25}.d2-3956133458 .fill-N2{fill:#676c7e}.d2-3956133458 .fill-B6{fill:#f7f8fe}.d2-3956133458 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="401.5" cy="79" class="shape stroke-B1 fill-B6 s0" rx="237.5" ry="79"/></g><text x="401.5" y="68.5" class="text-bold fill-N1 s1"><tspan x="401.5" dy="0">철학과 생리학</tspan><tspan x="401.5" dy="17.667">마음에 대한 물음은 오래되었지만</tspan><tspan x="401.5" dy="17.667">재는 절차가 없었다</tspan></text></g><g ><g class="shape"><path d="M220 279h363v114H220z" class="stroke-B1 fill-B6 s0"/></g><text x="401.5" y="317.5" class="text-bold fill-N1 s1"><tspan x="401.5" dy="0">분트의 실험실과 구성주의</tspan><tspan x="401.5" dy="17.25">분트(1832–1920) · 티치너(1867–1927)</tspan><tspan x="401.5" dy="17.25">훈련된 내성 보고로 의식 경험을 재고</tspan><tspan x="401.5" dy="17.25">그 성분을 찾는다</tspan></text></g><g ><g class="shape"><path d="M377 514h298v114H377z" class="stroke-B1 fill-B6 s0"/></g><text x="526" y="552.5" class="text-bold fill-N1 s1"><tspan x="526" dy="0">기능주의</tspan><tspan x="526" dy="17.25">제임스(1842–1910)</tspan><tspan x="526" dy="17.25">성분이 아니라</tspan><tspan x="526" dy="17.25">‘무엇에 쓰이는가’ 를 묻는다</tspan></text></g><g ><g class="shape"><path d="M229 728h345v114H229z" class="stroke-B1 fill-B6 s0"/></g><text x="401.5" y="766.5" class="text-bold fill-N1 s1"><tspan x="401.5" dy="0">행동주의</tspan><tspan x="401.5" dy="17.25">왓슨(1878–1958) · 스키너(1904–1990)</tspan><tspan x="401.5" dy="17.25">관찰 가능한 행동만 자료로 삼는다.</tspan><tspan x="401.5" dy="17.25">속은 묻지 않는다</tspan></text></g><g ><g class="shape"><path d="M220 995h363v114H220z" class="stroke-B1 fill-B6 s0"/></g><text x="401.5" y="1033.5" class="text-bold fill-N1 s1"><tspan x="401.5" dy="0">인지혁명</tspan><tspan x="401.5" dy="17.25">밀러(1920–2012) · 나이서(1928–2012)</tspan><tspan x="401.5" dy="17.25">속의 처리 과정을 정보 처리 모형으로</tspan><tspan x="401.5" dy="17.25">세우고 반응 시간으로 검사한다</tspan></text></g><g ><g class="shape"><path d="M0 1232h376v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="188" y="1270.5" class="text-bold fill-N1 s1"><tspan x="188" dy="0">지금</tspan><tspan x="188" dy="17.25">인지신경과학 · 계산 모형 · 대규모 자료</tspan><tspan x="188" dy="17.25">그리고 6장의 재현 위기 이후의</tspan><tspan x="188" dy="17.25">방법 개혁</tspan></text></g><text x="614.5" y="1246" class="fill-N1 s1"><tspan x="614.5" dy="0"> </tspan><tspan x="614.5" dy="16.714">행동주의가 틀려서 버려진 것이 아니다.</tspan><tspan x="614.5" dy="16.714">조건형성 연구는 지금도 튼튼하고</tspan><tspan x="614.5" dy="16.714">7장이 그것을 다룬다.</tspan><tspan x="614.5" dy="16.714">바뀐 것은 ‘속을 묻지 않는다’ 는 금지였다.</tspan><tspan x="614.5" dy="16.714">인지혁명은 속을 묻되 검사 가능한 형태로</tspan><tspan x="614.5" dy="16.714">묻는 방법을 찾은 것이다</tspan></text><marker id="mk-d2-3956133458-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3956133458-3488378134)" d="M401.008 160c.192 46.4.242 70.7.242 115.5" class="connection stroke-B1 s0" mask="url(#d2-3956133458)"/><text x="401.5" y="224" class="text-italic fill-N2 s1">재는 절차를 만든다</text><path fill="none" marker-end="url(#mk-d2-3956133458-3488378134)" d="M463.698 393.88C513.45 441.3 526.25 465.7 526.25 510.5" class="connection stroke-B1 s0" mask="url(#d2-3956133458)"/><text x="515" y="449" class="text-italic fill-N2 s1">성분보다 기능을 묻자</text><path fill="none" marker-end="url(#mk-d2-3956133458-3488378134)" d="M338.802 393.88C289.05 441.3 276.25 477 276.25 512.25s11.6 175.75 54.97 213.138" class="connection stroke-B1 s0" mask="url(#d2-3956133458)"/><text x="277" y="549" class="text-italic fill-N2 s1"><tspan x="277" dy="0">내성 보고는</tspan><tspan x="277" dy="17.667">사람마다 달라</tspan><tspan x="277" dy="17.667">검사할 수 없다</tspan></text><path fill="none" marker-end="url(#mk-d2-3956133458-3488378134)" d="M526.25 630c0 38-11.6 58-54.97 95.388" class="connection stroke-B1 s0" mask="url(#d2-3956133458)"/><path fill="none" marker-end="url(#mk-d2-3956133458-3488378134)" d="M401.25 843.5v148" class="connection stroke-B1 s0" mask="url(#d2-3956133458)"/><text x="401" y="908" class="text-italic fill-N2 s1"><tspan x="401" dy="0">행동만으로는</tspan><tspan x="401" dy="17.667">언어와 기억을</tspan><tspan x="401" dy="17.667">설명하지 못한다</tspan></text><path fill="none" marker-end="url(#mk-d2-3956133458-3488378134)" d="M296.25 1109.47C210 1157.3 188 1181.9 188 1227.5" class="connection stroke-B1 s0" mask="url(#d2-3956133458)"/><text x="218" y="1158" class="text-italic fill-N2 s1">측정 수단이 늘어난다</text><marker id="mk-d2-3956133458-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3956133458-2177206569)" d="M506.25 1109.47c86.25 47.83 108.25 72.23 108.25 117.03" class="connection" mask="url(#d2-3956133458)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3956133458" width="995" height="1549" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h995v1549h-995z"/><path d="M319 208h165v21H319zM423 433h184v21H423zM214 533h126v53H214zM330 892h142v53H330zM126 1142h184v21H126z"/></mask></svg>