<svg xmlns="http://www.w3.org/2000/svg" width="1636" height="2210" class="d2-2363688420 d2-svg" viewBox="-91 -101 1636 2210"><rect width="1636" height="2210" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2363688420 .fill-N1{fill:#0a0f25}.d2-2363688420 .fill-B4{fill:#e3e9fd}.d2-2363688420 .fill-B5{fill:#edf0fd}.d2-2363688420 .fill-B6{fill:#f7f8fe}.d2-2363688420 .stroke-B1,.d2-2363688420 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="840.5" cy="169" class="shape stroke-B1 fill-B6 s0" rx="506.5" ry="169"/></g><text x="840.5" y="166.5" class="text-bold fill-N1 s1"><tspan x="840.5" dy="0">검사할 주장</tspan><tspan x="840.5" dy="18.5">‘사람마다 잘 배우는 감각 양식이 있고, 그 양식에 맞춰 가르치면 더 잘 배운다’</tspan></text></g><g ><g class="shape"><path d="M512 458h656v554H512z" class="stroke-B1 fill-B4 s0"/></g><text x="840" y="445" class="fill-N1 s2">이 주장은 세 조각이다</text></g><g ><g class="shape"><path d="M10 1152h1328v142H10z" class="stroke-B1 fill-B4 s0"/></g><text x="674" y="1139" class="fill-N1 s2">3번을 검사하는 설계 — 교차 설계</text></g><g ><g class="shape"><path d="M215 1434h1229v340H215z" class="stroke-B1 fill-B4 s0"/></g><text x="829.5" y="1421" class="fill-N1 s2">지지되려면 무엇이 나와야 하나</text></g><g ><g class="shape"><path d="M880 1894h534v114H880z" class="stroke-B1 fill-B6 s0"/></g><text x="1147" y="1932.5" class="text-bold fill-N1 s1"><tspan x="1147" dy="0">실제로 나온 것</tspan><tspan x="1147" dy="17.25">이 교차 설계를 제대로 갖춘 연구 자체가 매우 적었고,</tspan><tspan x="1147" dy="17.25">갖춘 연구들에서 필요한 상호작용이 나오지 않았다.</tspan><tspan x="1147" dy="17.25">널리 믿기는 정도와 근거의 양이 크게 어긋나 있는 사례다</tspan></text></g><g ><g class="shape"><path d="M542 488h596v98H542z" class="stroke-B1 fill-B5 s0"/></g><text x="840" y="526.5" class="text-bold fill-N1 s1"><tspan x="840" dy="0">1. 사람마다 선호하는 방식이 있다</tspan><tspan x="840" dy="17.667">판정 — 그렇다. 물어보면 사람들은 자기 선호를 일관되게 답한다.</tspan><tspan x="840" dy="17.667">이 조각은 다투어지지 않는다</tspan></text></g><g ><g class="shape"><path d="M596 686h488v98H596z" class="stroke-B1 fill-B5 s0"/></g><text x="840" y="724.5" class="text-bold fill-N1 s1"><tspan x="840" dy="0">2. 그 선호가 안정된 유형으로 묶인다</tspan><tspan x="840" dy="17.667">판정 — 약하다. 검사마다 다른 유형 체계가 나오고,</tspan><tspan x="840" dy="17.667">측정의 신뢰도와 타당도가 확인되지 않은 것이 많다</tspan></text></g><g ><g class="shape"><path d="M630 884h421v98H630z" class="stroke-B1 fill-B5 s0"/></g><text x="840.5" y="922.5" class="text-bold fill-N1 s1"><tspan x="840.5" dy="0">3. 맞춰 가르치면 더 잘 배운다</tspan><tspan x="840.5" dy="17.667">판정 — 이것이 실제로 다투어지는 조각이고,</tspan><tspan x="840.5" dy="17.667">검증에서 지지되지 않았다</tspan></text></g><g ><g class="shape"><path d="M40 1182h272v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="176" y="1220.5" class="text-bold fill-N1 s1"><tspan x="176" dy="0">시각형이라 분류된 학습자</tspan><tspan x="176" dy="18.5">× 그림 위주 수업</tspan></text></g><g ><g class="shape"><path d="M372 1182h272v82H372z" class="stroke-B1 fill-B5 s0"/></g><text x="508" y="1220.5" class="text-bold fill-N1 s1"><tspan x="508" dy="0">시각형이라 분류된 학습자</tspan><tspan x="508" dy="18.5">× 말 위주 수업</tspan></text></g><g ><g class="shape"><path d="M704 1182h272v82H704z" class="stroke-B1 fill-B5 s0"/></g><text x="840" y="1220.5" class="text-bold fill-N1 s1"><tspan x="840" dy="0">청각형이라 분류된 학습자</tspan><tspan x="840" dy="18.5">× 그림 위주 수업</tspan></text></g><g ><g class="shape"><path d="M1036 1182h272v82h-272z" class="stroke-B1 fill-B5 s0"/></g><text x="1172" y="1220.5" class="text-bold fill-N1 s1"><tspan x="1172" dy="0">청각형이라 분류된 학습자</tspan><tspan x="1172" dy="18.5">× 말 위주 수업</tspan></text></g><g ><g class="shape"><path d="M535 1464h610v98H535z" class="stroke-B1 fill-B5 s0"/></g><text x="840" y="1502.5" class="text-bold fill-N1 s1"><tspan x="840" dy="0">필요한 것은 상호작용이다.</tspan><tspan x="840" dy="17.667">시각형은 그림 쪽에서, 청각형은 말 쪽에서 ‘각각’ 더 나아야 한다.</tspan><tspan x="840" dy="17.667">같은 시험으로, 같은 잣대로 재서</tspan></text></g><g ><g class="shape"><path d="M245 1662h575v82H245z" class="stroke-B1 fill-B5 s0"/></g><text x="532.5" y="1700.5" class="text-bold fill-N1 s1"><tspan x="532.5" dy="0">충분하지 않은 것 — 어느 한쪽 수업이 전체적으로 더 나은 것.</tspan><tspan x="532.5" dy="18.5">그것은 그 수업이 좋다는 뜻이지 맞춤이 통한다는 뜻이 아니다</tspan></text></g><g ><g class="shape"><path d="M880 1662h534v82H880z" class="stroke-B1 fill-B5 s0"/></g><text x="1147" y="1700.5" class="text-bold fill-N1 s1"><tspan x="1147" dy="0">충분하지 않은 것 — 학습자가 맞춘 수업을 더 좋아하는 것.</tspan><tspan x="1147" dy="18.5">선호와 성적은 다른 지표다</tspan></text></g><marker id="mk-d2-2363688420-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2363688420-3488378134)" d="M840 588v94" class="connection stroke-B1 s0" mask="url(#d2-2363688420)"/><path fill="none" marker-end="url(#mk-d2-2363688420-3488378134)" d="M840 786v94" class="connection stroke-B1 s0" mask="url(#d2-2363688420)"/><marker id="mk-d2-2363688420-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2363688420-2177206569)" d="M685.847 1562.614C563.75 1602 532.75 1622 532.75 1658" class="connection stroke-B2 s4" mask="url(#d2-2363688420)"/><path fill="none" marker-end="url(#mk-d2-2363688420-2177206569)" d="M994.153 1562.614C1116.25 1602 1147.25 1622 1147.25 1658" class="connection stroke-B2 s4" mask="url(#d2-2363688420)"/><path fill="none" marker-end="url(#mk-d2-2363688420-3488378134)" d="M840 340v73" class="connection stroke-B1 s0" mask="url(#d2-2363688420)"/><path fill="none" marker-end="url(#mk-d2-2363688420-3488378134)" d="M840 1014v93" class="connection stroke-B1 s0" mask="url(#d2-2363688420)"/><path fill="none" marker-end="url(#mk-d2-2363688420-3488378134)" d="M840 1296v93" class="connection stroke-B1 s0" mask="url(#d2-2363688420)"/><path fill="none" marker-end="url(#mk-d2-2363688420-3488378134)" d="M1147.25 1776v114" class="connection stroke-B1 s0" mask="url(#d2-2363688420)"/><mask id="d2-2363688420" width="1636" height="2210" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1636v2210H-91z"/></mask></svg>