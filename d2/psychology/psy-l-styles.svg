<svg xmlns="http://www.w3.org/2000/svg" width="1201" height="1553" class="d2-3373991109 d2-svg" viewBox="-101 -101 1201 1553"><rect width="1201" height="1553" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3373991109 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3373991109 .fill-N1{fill:#0a0f25}.d2-3373991109 .fill-B4{fill:#e3e9fd}.d2-3373991109 .fill-B5{fill:#edf0fd}.d2-3373991109 .fill-B6{fill:#f7f8fe}.d2-3373991109 .stroke-B1,.d2-3373991109 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:3}.s4{fill:#0d32b2}.s5{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="178.5" cy="75" class="shape stroke-B1 fill-B6 s0" rx="178.5" ry="75"/></g><text x="178.5" y="48.5" class="text-bold fill-N1 s1"><tspan x="178.5" dy="0">검사할 주장</tspan><tspan x="178.5" dy="17">‘사람마다 잘 배우는</tspan><tspan x="178.5" dy="17">감각 양식이 있고,</tspan><tspan x="178.5" dy="17">그 양식에 맞춰 가르치면</tspan><tspan x="178.5" dy="17">더 잘 배운다’</tspan></text></g><path fill="transparent" stroke="transparent" d="M407 0h592v150H407z" class="shape s0"/><g ><g class="shape"><path d="M0 194h357v620H0z" class="stroke-B1 fill-B4 s0"/></g><text x="178.5" y="227" class="fill-N1 s2">이 주장은 세 조각이다</text></g><g ><g class="shape"><path d="M407 194h592v620H407z" class="stroke-B1 fill-B4 s0"/></g><text x="703" y="227" class="fill-N1 s2"><tspan x="703" dy="0">3번을 검사하는 설계 —</tspan><tspan x="703" dy="32">교차 설계</tspan></text></g><g ><g class="shape"><path d="M0 858h357v493H0z" class="stroke-B1 fill-B6 s0"/></g><text x="178.5" y="1054" class="text-bold fill-N1 s1"><tspan x="178.5" dy="0">실제로 나온 것</tspan><tspan x="178.5" dy="16.625">이 교차 설계를 제대로 갖춘</tspan><tspan x="178.5" dy="16.625">연구 자체가 매우 적었고,</tspan><tspan x="178.5" dy="16.625">갖춘 연구들에서 필요한</tspan><tspan x="178.5" dy="16.625">상호작용이 나오지 않았다.</tspan><tspan x="178.5" dy="16.625">널리 믿기는 정도와</tspan><tspan x="178.5" dy="16.625">근거의 양이 크게</tspan><tspan x="178.5" dy="16.625">어긋나 있는 사례다</tspan></text></g><g ><g class="shape"><path d="M407 899h592v452H407z" class="stroke-B1 fill-B4 s0"/></g><text x="703" y="886" class="fill-N1 s2">지지되려면 무엇이 나와야 하나</text></g><g ><g class="shape"><path d="M47 240h252v178H47z" class="stroke-B1 fill-B5 s0"/></g><text x="173" y="278.5" class="text-bold fill-N1 s1"><tspan x="173" dy="0">1. 사람마다</tspan><tspan x="173" dy="16.625">선호하는 방식이 있다</tspan><tspan x="173" dy="16.625">판정 — 그렇다.</tspan><tspan x="173" dy="16.625">물어보면 사람들은</tspan><tspan x="173" dy="16.625">자기 선호를</tspan><tspan x="173" dy="16.625">일관되게 답한다.</tspan><tspan x="173" dy="16.625">이 조각은</tspan><tspan x="173" dy="16.625">다투어지지 않는다</tspan></text></g><g ><g class="shape"><path d="M47 442h252v178H47z" class="stroke-B1 fill-B5 s0"/></g><text x="173" y="480.5" class="text-bold fill-N1 s1"><tspan x="173" dy="0">2. 그 선호가</tspan><tspan x="173" dy="16.625">안정된 유형으로 묶인다</tspan><tspan x="173" dy="16.625">판정 — 약하다.</tspan><tspan x="173" dy="16.625">검사마다 다른</tspan><tspan x="173" dy="16.625">유형 체계가 나오고,</tspan><tspan x="173" dy="16.625">측정의 신뢰도와</tspan><tspan x="173" dy="16.625">타당도가 확인되지</tspan><tspan x="173" dy="16.625">않은 것이 많다</tspan></text></g><g ><g class="shape"><path d="M47 644h252v146H47z" class="stroke-B1 fill-B5 s0"/></g><text x="173" y="682.5" class="text-bold fill-N1 s1"><tspan x="173" dy="0">3. 맞춰 가르치면</tspan><tspan x="173" dy="16.833">더 잘 배운다</tspan><tspan x="173" dy="16.833">판정 — 이것이 실제로</tspan><tspan x="173" dy="16.833">다투어지는 조각이고,</tspan><tspan x="173" dy="16.833">검증에서</tspan><tspan x="173" dy="16.833">지지되지 않았다</tspan></text></g><g ><g class="shape"><path d="M423 268h184v114H423z" class="stroke-B1 fill-B5 s3"/></g><text x="515" y="306.5" class="text-bold fill-N1 s1"><tspan x="515" dy="0">시각형이라</tspan><tspan x="515" dy="17.25">분류된 학습자</tspan><tspan x="515" dy="17.25">× 그림 위주 수업</tspan><tspan x="515" dy="17.25">(맞춘 짝)</tspan></text></g><g ><g class="shape"><path d="M623 268h168v114H623z" class="stroke-B1 fill-B5 s0"/></g><text x="707" y="306.5" class="text-bold fill-N1 s1"><tspan x="707" dy="0">시각형이라</tspan><tspan x="707" dy="17.25">분류된 학습자</tspan><tspan x="707" dy="17.25">× 말 위주 수업</tspan><tspan x="707" dy="17.25">(어긋난 짝)</tspan></text></g><g ><g class="shape"><path d="M423 398h184v114H423z" class="stroke-B1 fill-B5 s0"/></g><text x="515" y="436.5" class="text-bold fill-N1 s1"><tspan x="515" dy="0">청각형이라</tspan><tspan x="515" dy="17.25">분류된 학습자</tspan><tspan x="515" dy="17.25">× 그림 위주 수업</tspan><tspan x="515" dy="17.25">(어긋난 짝)</tspan></text></g><g ><g class="shape"><path d="M623 398h168v114H623z" class="stroke-B1 fill-B5 s3"/></g><text x="707" y="436.5" class="text-bold fill-N1 s1"><tspan x="707" dy="0">청각형이라</tspan><tspan x="707" dy="17.25">분류된 학습자</tspan><tspan x="707" dy="17.25">× 말 위주 수업</tspan><tspan x="707" dy="17.25">(맞춘 짝)</tspan></text></g><g ><g class="shape"><path d="M543 929h324v130H543z" class="stroke-B1 fill-B5 s0"/></g><text x="705" y="967.5" class="text-bold fill-N1 s1"><tspan x="705" dy="0">필요한 것은 상호작용이다.</tspan><tspan x="705" dy="17">시각형은 그림 쪽에서,</tspan><tspan x="705" dy="17">청각형은 말 쪽에서</tspan><tspan x="705" dy="17">‘각각’ 더 나아야 한다.</tspan><tspan x="705" dy="17">같은 시험으로, 같은 잣대로 재서</tspan></text></g><g ><g class="shape"><path d="M437 1159h240v162H437z" class="stroke-B1 fill-B5 s0"/></g><text x="557" y="1197.5" class="text-bold fill-N1 s1"><tspan x="557" dy="0">충분하지 않은 것 —</tspan><tspan x="557" dy="16.714">어느 한쪽 수업이</tspan><tspan x="557" dy="16.714">전체적으로 더 나은 것.</tspan><tspan x="557" dy="16.714">그것은 그 수업이</tspan><tspan x="557" dy="16.714">좋다는 뜻이지</tspan><tspan x="557" dy="16.714">맞춤이 통한다는</tspan><tspan x="557" dy="16.714">뜻이 아니다</tspan></text></g><g ><g class="shape"><path d="M737 1175h232v130H737z" class="stroke-B1 fill-B5 s0"/></g><text x="853" y="1213.5" class="text-bold fill-N1 s1"><tspan x="853" dy="0">충분하지 않은 것 —</tspan><tspan x="853" dy="17">학습자가 맞춘 수업을</tspan><tspan x="853" dy="17">더 좋아하는 것.</tspan><tspan x="853" dy="17">선호와 성적은</tspan><tspan x="853" dy="17">다른 지표다</tspan></text></g><marker id="mk-d2-3373991109-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-3373991109-3488378134)" d="M173 420v18" class="connection stroke-B1 s0" mask="url(#d2-3373991109)"/><path fill="none" marker-end="url(#mk-d2-3373991109-3488378134)" d="M173 622v18" class="connection stroke-B1 s0" mask="url(#d2-3373991109)"/><marker id="mk-d2-3373991109-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-3373991109-2177206569)" d="M619.424 1060.231C569.8 1099 557 1119 557 1155" class="connection stroke-B2 s5" mask="url(#d2-3373991109)"/><path fill="none" marker-end="url(#mk-d2-3373991109-2177206569)" d="M790.576 1060.231C840.2 1099 853 1122.2 853 1171" class="connection stroke-B2 s5" mask="url(#d2-3373991109)"/><path fill="none" marker-end="url(#mk-d2-3373991109-3488378134)" d="M179 152v38" class="connection stroke-B1 s0" mask="url(#d2-3373991109)"/><path fill="none" marker-end="url(#mk-d2-3373991109-3488378134)" d="M359 504h44" class="connection stroke-B1 s0" mask="url(#d2-3373991109)"/><path fill="none" marker-end="url(#mk-d2-3373991109-3488378134)" d="M703 816v38" class="connection stroke-B1 s0" mask="url(#d2-3373991109)"/><path fill="none" marker-end="url(#mk-d2-3373991109-3488378134)" d="m405.502 1113.422-45.005-1.765" class="connection stroke-B1 s0" mask="url(#d2-3373991109)"/><mask id="d2-3373991109" width="1201" height="1553" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1201v1553H-101z"/></mask></svg>