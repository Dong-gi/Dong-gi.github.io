<svg xmlns="http://www.w3.org/2000/svg" width="1431" height="2302" class="d2-269012796 d2-svg" viewBox="-82 -101 1431 2302"><rect width="1431" height="2302" x="-82" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-269012796 .fill-N1{fill:#0a0f25}.d2-269012796 .fill-B4{fill:#e3e9fd}.d2-269012796 .fill-B5{fill:#edf0fd}.d2-269012796 .fill-B6{fill:#f7f8fe}.d2-269012796 .stroke-B1,.d2-269012796 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}.s3{stroke-width:3}.s4{fill:#0d32b2}.s5{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="643.5" cy="169" class="shape stroke-B1 fill-B6 s0" rx="506.5" ry="169"/></g><text x="643.5" y="166.5" class="text-bold fill-N1 s1"><tspan x="643.5" dy="0">검사할 주장</tspan><tspan x="643.5" dy="18.5">‘사람마다 잘 배우는 감각 양식이 있고, 그 양식에 맞춰 가르치면 더 잘 배운다’</tspan></text></g><g ><g class="shape"><path d="M316 458h656v554H316z" class="stroke-B1 fill-B4 s0"/></g><text x="644" y="445" class="fill-N1 s2">이 주장은 세 조각이다</text></g><g ><g class="shape"><path d="M348 1132h592v274H348z" class="stroke-B1 fill-B4 s0"/></g><text x="644" y="1165" class="fill-N1 s2">3번을 검사하는 설계 — 교차 설계</text></g><g ><g class="shape"><path d="M19 1526h1229v340H19z" class="stroke-B1 fill-B4 s0"/></g><text x="633.5" y="1513" class="fill-N1 s2">지지되려면 무엇이 나와야 하나</text></g><g ><g class="shape"><path d="M684 1986h534v114H684z" class="stroke-B1 fill-B6 s0"/></g><text x="951" y="2024.5" class="text-bold fill-N1 s1"><tspan x="951" dy="0">실제로 나온 것</tspan><tspan x="951" dy="17.25">이 교차 설계를 제대로 갖춘 연구 자체가 매우 적었고,</tspan><tspan x="951" dy="17.25">갖춘 연구들에서 필요한 상호작용이 나오지 않았다.</tspan><tspan x="951" dy="17.25">널리 믿기는 정도와 근거의 양이 크게 어긋나 있는 사례다</tspan></text></g><g ><g class="shape"><path d="M346 488h596v98H346z" class="stroke-B1 fill-B5 s0"/></g><text x="644" y="526.5" class="text-bold fill-N1 s1"><tspan x="644" dy="0">1. 사람마다 선호하는 방식이 있다</tspan><tspan x="644" dy="17.667">판정 — 그렇다. 물어보면 사람들은 자기 선호를 일관되게 답한다.</tspan><tspan x="644" dy="17.667">이 조각은 다투어지지 않는다</tspan></text></g><g ><g class="shape"><path d="M400 686h488v98H400z" class="stroke-B1 fill-B5 s0"/></g><text x="644" y="724.5" class="text-bold fill-N1 s1"><tspan x="644" dy="0">2. 그 선호가 안정된 유형으로 묶인다</tspan><tspan x="644" dy="17.667">판정 — 약하다. 검사마다 다른 유형 체계가 나오고,</tspan><tspan x="644" dy="17.667">측정의 신뢰도와 타당도가 확인되지 않은 것이 많다</tspan></text></g><g ><g class="shape"><path d="M433 884h421v98H433z" class="stroke-B1 fill-B5 s0"/></g><text x="643.5" y="922.5" class="text-bold fill-N1 s1"><tspan x="643.5" dy="0">3. 맞춰 가르치면 더 잘 배운다</tspan><tspan x="643.5" dy="17.667">판정 — 이것이 실제로 다투어지는 조각이고,</tspan><tspan x="643.5" dy="17.667">검증에서 지지되지 않았다</tspan></text></g><g ><g class="shape"><path d="M364 1178h272v98H364z" class="stroke-B1 fill-B5 s3"/></g><text x="500" y="1216.5" class="text-bold fill-N1 s1"><tspan x="500" dy="0">시각형이라 분류된 학습자</tspan><tspan x="500" dy="17.667">× 그림 위주 수업</tspan><tspan x="500" dy="17.667">(맞춘 짝)</tspan></text></g><g ><g class="shape"><path d="M652 1178h272v98H652z" class="stroke-B1 fill-B5 s0"/></g><text x="788" y="1216.5" class="text-bold fill-N1 s1"><tspan x="788" dy="0">시각형이라 분류된 학습자</tspan><tspan x="788" dy="17.667">× 말 위주 수업</tspan><tspan x="788" dy="17.667">(어긋난 짝)</tspan></text></g><g ><g class="shape"><path d="M364 1292h272v98H364z" class="stroke-B1 fill-B5 s0"/></g><text x="500" y="1330.5" class="text-bold fill-N1 s1"><tspan x="500" dy="0">청각형이라 분류된 학습자</tspan><tspan x="500" dy="17.667">× 그림 위주 수업</tspan><tspan x="500" dy="17.667">(어긋난 짝)</tspan></text></g><g ><g class="shape"><path d="M652 1292h272v98H652z" class="stroke-B1 fill-B5 s3"/></g><text x="788" y="1330.5" class="text-bold fill-N1 s1"><tspan x="788" dy="0">청각형이라 분류된 학습자</tspan><tspan x="788" dy="17.667">× 말 위주 수업</tspan><tspan x="788" dy="17.667">(맞춘 짝)</tspan></text></g><g ><g class="shape"><path d="M339 1556h610v98H339z" class="stroke-B1 fill-B5 s0"/></g><text x="644" y="1594.5" class="text-bold fill-N1 s1"><tspan x="644" dy="0">필요한 것은 상호작용이다.</tspan><tspan x="644" dy="17.667">시각형은 그림 쪽에서, 청각형은 말 쪽에서 ‘각각’ 더 나아야 한다.</tspan><tspan x="644" dy="17.667">같은 시험으로, 같은 잣대로 재서</tspan></text></g><g ><g class="shape"><path d="M49 1754h575v82H49z" class="stroke-B1 fill-B5 s0"/></g><text x="336.5" y="1792.5" class="text-bold fill-N1 s1"><tspan x="336.5" dy="0">충분하지 않은 것 — 어느 한쪽 수업이 전체적으로 더 나은 것.</tspan><tspan x="336.5" dy="18.5">그것은 그 수업이 좋다는 뜻이지 맞춤이 통한다는 뜻이 아니다</tspan></text></g><g ><g class="shape"><path d="M684 1754h534v82H684z" class="stroke-B1 fill-B5 s0"/></g><text x="951" y="1792.5" class="text-bold fill-N1 s1"><tspan x="951" dy="0">충분하지 않은 것 — 학습자가 맞춘 수업을 더 좋아하는 것.</tspan><tspan x="951" dy="18.5">선호와 성적은 다른 지표다</tspan></text></g><marker id="mk-d2-269012796-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-269012796-3488378134)" d="M643.5 588v94" class="connection stroke-B1 s0" mask="url(#d2-269012796)"/><path fill="none" marker-end="url(#mk-d2-269012796-3488378134)" d="M643.5 786v94" class="connection stroke-B1 s0" mask="url(#d2-269012796)"/><marker id="mk-d2-269012796-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-269012796-2177206569)" d="M489.347 1654.614C367.25 1694 336.25 1714 336.25 1750" class="connection stroke-B2 s5" mask="url(#d2-269012796)"/><path fill="none" marker-end="url(#mk-d2-269012796-2177206569)" d="M797.653 1654.614C919.75 1694 950.75 1714 950.75 1750" class="connection stroke-B2 s5" mask="url(#d2-269012796)"/><path fill="none" marker-end="url(#mk-d2-269012796-3488378134)" d="M643.98 340c-.38 38-.48 53.8-.48 73" class="connection stroke-B1 s0" mask="url(#d2-269012796)"/><path fill="none" marker-end="url(#mk-d2-269012796-3488378134)" d="M643.5 1014v114" class="connection stroke-B1 s0" mask="url(#d2-269012796)"/><path fill="none" marker-end="url(#mk-d2-269012796-3488378134)" d="M643.5 1408v73" class="connection stroke-B1 s0" mask="url(#d2-269012796)"/><path fill="none" marker-end="url(#mk-d2-269012796-3488378134)" d="M950.75 1868v114" class="connection stroke-B1 s0" mask="url(#d2-269012796)"/><mask id="d2-269012796" width="1431" height="2302" x="-82" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-82-101h1431v2302H-82z"/></mask></svg>