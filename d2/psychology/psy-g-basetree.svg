<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="2329" class="d2-2207882679 d2-svg" viewBox="-91 -121 1030 2329"><rect width="1030" height="2329" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2207882679 .fill-N1{fill:#0a0f25}.d2-2207882679 .fill-B4{fill:#e3e9fd}.d2-2207882679 .fill-B5{fill:#edf0fd}.d2-2207882679 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M170 20h509v624H170z" class="stroke-B1 fill-B4 s0"/></g><text x="424.5" y="7" class="fill-N1 s1">확률로 적은 문제</text></g><g ><g class="shape"><path d="M146 805h580v656H146z" class="stroke-B1 fill-B4 s0"/></g><text x="436" y="792" class="fill-N1 s1">빈도로 다시 적은 같은 문제</text></g><g ><g class="shape"><path d="M10 1601h828v506H10z" class="stroke-B1 fill-B4 s0"/></g><text x="424" y="1588" class="fill-N1 s1">무엇을 배우나</text></g><g ><g class="shape"><path d="M245 50h358v66H245z" class="stroke-B1 fill-B5 s0"/></g><text x="424" y="88.5" class="text-bold fill-N1 s2">유통되는 지폐 가운데 위조는 0.2% 다</text></g><g ><g class="shape"><path d="M267 216h315v66H267z" class="stroke-B1 fill-B5 s0"/></g><text x="424.5" y="254.5" class="text-bold fill-N1 s2">감별기는 위조를 100% 잡아낸다</text></g><g ><g class="shape"><path d="M200 382h449v66H200z" class="stroke-B1 fill-B5 s0"/></g><text x="424.5" y="420.5" class="text-bold fill-N1 s2">감별기는 진짜의 2% 에 대해서도 경보를 울린다</text></g><g ><g class="shape"><path d="M221 548h406v66H221z" class="stroke-B1 fill-B5 s0"/></g><text x="424" y="586.5" class="text-bold fill-N1 s2">물음 — 경보가 울린 지폐가 위조일 확률은?</text></g><g ><g class="shape"><path d="M276 835h297v66H276z" class="stroke-B1 fill-B5 s0"/></g><text x="424.5" y="873.5" class="text-bold fill-N1 s2">지폐 1,000장을 놓고 세어 본다</text></g><g ><g class="shape"><path d="M221 1001h116v66H221z" class="stroke-B1 fill-B5 s0"/></g><text x="279" y="1039.5" class="text-bold fill-N1 s2">위조 2장</text></g><g ><g class="shape"><path d="M503 1001h133v66H503z" class="stroke-B1 fill-B5 s0"/></g><text x="569.5" y="1039.5" class="text-bold fill-N1 s2">진짜 998장</text></g><g ><g class="shape"><path d="M176 1167h206v66H176z" class="stroke-B1 fill-B5 s0"/></g><text x="279" y="1205.5" class="text-bold fill-N1 s2">위조 2장 → 경보 2장</text></g><g ><g class="shape"><path d="M442 1167h254v66H442z" class="stroke-B1 fill-B5 s0"/></g><text x="569" y="1205.5" class="text-bold fill-N1 s2">진짜 998장 → 경보 약 20장</text></g><g ><g class="shape"><path d="M273 1333h302v98H273z" class="stroke-B1 fill-B5 s0"/></g><text x="424" y="1371.5" class="text-bold fill-N1 s2"><tspan x="424" dy="0">경보는 모두 22장.</tspan><tspan x="424" dy="17.667">그 가운데 위조는 2장.</tspan><tspan x="424" dy="17.667">2 나누기 22 — 열에 한 번쯤이다</tspan></text></g><g ><g class="shape"><path d="M40 1631h768v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="424" y="1669.5" class="text-bold fill-N1 s2"><tspan x="424" dy="0">기저율 무시란 — 검사의 성능만 보고 ‘찾는 것이 얼마나 드문가’ 를 빠뜨리는 것이다.</tspan><tspan x="424" dy="18.5">드문 것을 찾을 때는 경보의 대부분이 헛것이 된다</tspan></text></g><g ><g class="shape"><path d="M197 1813h454v82H197z" class="stroke-B1 fill-B5 s0"/></g><text x="424" y="1851.5" class="text-bold fill-N1 s2"><tspan x="424" dy="0">고치는 법 — 확률을 빈도로 바꿔 적는다.</tspan><tspan x="424" dy="18.5">어떤 수를 놓고 세어 보면 두 갈래가 눈에 보인다</tspan></text></g><g ><g class="shape"><path d="M82 1995h684v82H82z" class="stroke-B1 fill-B5 s0"/></g><text x="424" y="2033.5" class="text-bold fill-N1 s2"><tspan x="424" dy="0">이 방식이 실제로 정답률을 크게 올린다는 것이 여러 연구에서 보고되었다.</tspan><tspan x="424" dy="18.5">다만 오르는 정도는 문제와 표현에 따라 다르다</tspan></text></g><marker id="mk-d2-2207882679-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2207882679-3488378134)" d="M424 118v94" 