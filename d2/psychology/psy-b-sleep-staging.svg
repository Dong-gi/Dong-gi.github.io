<svg xmlns="http://www.w3.org/2000/svg" width="959" height="1509" class="d2-2787964253 d2-svg" viewBox="-91 -121 959 1509"><rect width="959" height="1509" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.d2-2787964253 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2787964253 .fill-N1{fill:#0a0f25}.d2-2787964253 .fill-B4{fill:#e3e9fd}.d2-2787964253 .fill-B5{fill:#edf0fd}.d2-2787964253 .stroke-B1,.d2-2787964253 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M10 20h757v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="388.5" y="7" class="fill-N1 s1">동시에 재는 세 가지</text></g><g ><g class="shape"><path d="M217 298h319v82H217z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="376.5" y="336.5" class="text-bold fill-N1 s2"><tspan x="376.5" dy="0">정해 둔 채점 규칙에 따라</tspan><tspan x="376.5" dy="18.5">짧은 구간마다 한 단계를 붙인다</tspan></text></g><g ><g class="shape"><path d="M10 480h734v462H10z" class="stroke-B1 fill-B4 s0"/></g><text x="377" y="513" class="fill-N1 s1">붙는 단계들</text></g><text x="211" y="1058" class="fill-N1 s2"><tspan x="211" dy="0"> </tspan><tspan x="211" dy="16.333">읽는 법 — 이 단계들은</tspan><tspan x="211" dy="16.333">‘재는 방법과 채점 규칙이</tspan><tspan x="211" dy="16.333">함께 정의한 것’ 이다.</tspan><tspan x="211" dy="16.333"> </tspan><tspan x="211" dy="16.333">예전 규칙은</tspan><tspan x="211" dy="16.333">깊은 잠을 두 단계로 나누었는데</tspan><tspan x="211" dy="16.333">지금 널리 쓰는 규칙은</tspan><tspan x="211" dy="16.333">하나로 합쳤다.</tspan><tspan x="211" dy="16.333">자연의 경계가 바뀐 것이 아니라</tspan><tspan x="211" dy="16.333">규칙이 바뀐 것이다.</tspan><tspan x="211" dy="16.333">4장과 5장의 조작적 정의 이야기가</tspan><tspan x="211" dy="16.333">여기에 그대로 걸린다 —</tspan><tspan x="211" dy="16.333">‘다른 규칙으로 채점한 값을</tspan><tspan x="211" dy="16.333">그대로 견주면 안 된다’</tspan></text><text x="542" y="1090" class="fill-N1 s2"><tspan x="542" dy="0"> </tspan><tspan x="542" dy="16.455">흔한 오해 하나 —</tspan><tspan x="542" dy="16.455">‘꿈은 REM 에서만 꾼다’.</tspan><tspan x="542" dy="16.455"> </tspan><tspan x="542" dy="16.455">REM 에서 깨우면 꿈 보고가</tspan><tspan x="542" dy="16.455">훨씬 자주 나오는 것은 맞다.</tspan><tspan x="542" dy="16.455">그러나 REM 이 아닌 구간에서</tspan><tspan x="542" dy="16.455">깨워도 보고가 나온다.</tspan><tspan x="542" dy="16.455">정확한 서술은</tspan><tspan x="542" dy="16.455">‘REM 에서 보고가 더 자주,</tspan><tspan x="542" dy="16.455">더 길고 생생하게 나온다’ 이다</tspan></text><g ><g class="shape"><path d="M40 50h191v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="135.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="135.5" dy="0">뇌파 —</tspan><tspan x="135.5" dy="17.667">머리 표면에서 잰</tspan><tspan x="135.5" dy="17.667">전기 활동의 파형</tspan></text></g><g ><g class="shape"><path d="M291 50h171v98H291z" class="stroke-B1 fill-B5 s0"/></g><text x="376.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="376.5" dy="0">눈 움직임 —</tspan><tspan x="376.5" dy="17.667">눈 둘레에서 잰</tspan><tspan x="376.5" dy="17.667">전기 변화</tspan></text></g><g ><g class="shape"><path d="M522 50h215v98H522z" class="stroke-B1 fill-B5 s0"/></g><text x="629.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="629.5" dy="0">근육 긴장 —</tspan><tspan x="629.5" dy="17.667">턱 아래 근육에서 잰</tspan><tspan x="629.5" dy="17.667">전기 활동</tspan></text></g><g ><g class="shape"><path d="M40 526h324v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="202" y="564.5" class="text-bold fill-N1 s2"><tspan x="202" dy="0">깸 — 빠르고 작은 파형.</tspan><tspan x="202" dy="17.667">눈을 감으면</tspan><tspan x="202" dy="17.667">규칙적인 파형이 나타난다</tspan></text></g><g ><g class="shape"><path d="M394 526h320v98H394z" class="stroke-B1 fill-B5 s0"/></g><text x="554" y="572.5" class="text-bold fill-N1 s2"><tspan x="554" dy="0">N1 — 얕은 잠으로 들어가는 구간.</tspan><tspan x="554" dy="18.5">눈이 천천히 굴러간다</tspan></text></g><g ><g class="shape"><path d="M40 654h324v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="202" y="692.5" class="text-bold fill-N1 s2"><tspan x="202" dy="0">N2 — 짧게 몰아치는 파형과</tspan><tspan x="202" dy="17.25">큰 파형 하나가 특징이다.</tspan><tspan x="202" dy="17.25">하룻밤에서</tspan><tspan x="202" dy="17.25">가장 긴 시간을 차지한다</tspan></text></g><g ><g class="shape"><path d="M394 654h320v114H394z" class="stroke-B1 fill-B5 s0"/></g><text x="554" y="692.5" class="text-bold fill-N1 s2"><tspan x="554" dy="0">N3 — 느리고 큰 파형이 많은 구간.</tspan><tspan x="554" dy="17.25">깊은 잠이라 부른다.</tspan><tspan x="554" dy="17.25">깨우기 어렵고</tspan><tspan x="554" dy="17.25">앞쪽 주기에 몰려 있다</tspan></text></g><g ><g class="shape"><path d="M40 798h324v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="202" y="836.5" class="text-bold fill-N1 s2"><tspan x="202" dy="0">REM — 뇌파는 깨어 있을 때와</tspan><tspan x="202" dy="17.25">비슷한데 눈이 빠르게 움직이고</tspan><tspan x="202" dy="17.25">턱 근육의 긴장이 거의 사라진다.</tspan><tspan x="202" dy="17.25">그래서 역설수면이라고도 한다</tspan></text></g><marker id="mk-d2-2787964253-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2787964253-3488378134)" d="M376.5 180v114" class="connection stroke-B1 s0" mask="url(#d2-2787964253)"/><path fill="none" marker-end="url(#mk-d2-2787964253-3488378134)" d="M376.5 382v94" class="connection stroke-B1 s0" mask="url(#d2-2787964253)"/><marker id="mk-d2-2787964253-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2787964253-2177206569)" d="M238.997 943.73C216.8 982 211 1002 211 1038" class="connection stroke-B2 s4" mask="url(#d2-2787964253)"/><path fill="none" marker-end="url(#mk-d2-2787964253-2177206569)" d="M514.003 943.73C536.2 982 542 1008.4 542 1070" class="connection stroke-B2 s4" mask="url(#d2-2787964253)"/><mask id="d2-2787964253" width="959" height="1509" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h959v1509H-91z"/></mask></svg>