<svg xmlns="http://www.w3.org/2000/svg" width="1547" height="1561" class="d2-1311401215 d2-svg" viewBox="-91 -121 1547 1561"><rect width="1547" height="1561" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.d2-1311401215 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1311401215 .fill-N1{fill:#0a0f25}.d2-1311401215 .fill-B4{fill:#e3e9fd}.d2-1311401215 .fill-B5{fill:#edf0fd}.d2-1311401215 .stroke-B1,.d2-1311401215 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M10 20h1345v126H10z" class="stroke-B1 fill-B4 s0"/></g><text x="682.5" y="7" class="fill-N1 s1">동시에 재는 세 가지</text></g><g ><g class="shape"><path d="M412 266h538v66H412z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="681" y="304.5" class="text-bold fill-N1 s2">정해 둔 채점 규칙에 따라 짧은 구간마다 한 단계를 붙인다</text></g><g ><g class="shape"><path d="M323 432h717v658H323z" class="stroke-B1 fill-B4 s0"/></g><text x="681.5" y="465" class="fill-N1 s1">붙는 단계들</text></g><text x="417" y="1206" class="fill-N1 s2"><tspan x="417" dy="0"> </tspan><tspan x="417" dy="16.556">읽는 법 — 이 단계들은 ‘재는 방법과</tspan><tspan x="417" dy="16.556">채점 규칙이 함께 정의한 것’ 이다.</tspan><tspan x="417" dy="16.556"> </tspan><tspan x="417" dy="16.556">예전 규칙은 깊은 잠을 두 단계로 나누었는데</tspan><tspan x="417" dy="16.556">지금 널리 쓰는 규칙은 하나로 합쳤다.</tspan><tspan x="417" dy="16.556">자연의 경계가 바뀐 것이 아니라 규칙이 바뀐 것이다.</tspan><tspan x="417" dy="16.556">4장과 5장의 조작적 정의 이야기가 여기에 그대로 걸린다 —</tspan><tspan x="417" dy="16.556">‘다른 규칙으로 채점한 값을 그대로 견주면 안 된다’</tspan></text><text x="945.5" y="1222" class="fill-N1 s2"><tspan x="945.5" dy="0"> </tspan><tspan x="945.5" dy="16.714">흔한 오해 하나 — ‘꿈은 REM 에서만 꾼다’.</tspan><tspan x="945.5" dy="16.714"> </tspan><tspan x="945.5" dy="16.714">REM 에서 깨우면 꿈 보고가 훨씬 자주 나오는 것은 맞다.</tspan><tspan x="945.5" dy="16.714">그러나 REM 이 아닌 구간에서 깨워도 보고가 나온다.</tspan><tspan x="945.5" dy="16.714">정확한 서술은 ‘REM 에서 보고가 더</tspan><tspan x="945.5" dy="16.714">자주, 더 길고 생생하게 나온다’ 이다</tspan></text><g ><g class="shape"><path d="M40 50h401v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="240.5" y="88.5" class="text-bold fill-N1 s2">뇌파 — 머리 표면에서 잰 전기 활동의 파형</text></g><g ><g class="shape"><path d="M501 50h360v66H501z" class="stroke-B1 fill-B5 s0"/></g><text x="681" y="88.5" class="text-bold fill-N1 s2">눈 움직임 — 눈 둘레에서 잰 전기 변화</text></g><g ><g class="shape"><path d="M921 50h404v66H921z" class="stroke-B1 fill-B5 s0"/></g><text x="1123" y="88.5" class="text-bold fill-N1 s2">근육 긴장 — 턱 아래 근육에서 잰 전기 활동</text></g><g ><g class="shape"><path d="M383 492h597v66H383z" class="stroke-B1 fill-B5 s0"/></g><text x="681.5" y="530.5" class="text-bold fill-N1 s2">깸 — 빠르고 작은 파형. 눈을 감으면 규칙적인 파형이 나타난다</text></g><g ><g class="shape"><path d="M383 598h597v66H383z" class="stroke-B1 fill-B5 s0"/></g><text x="681.5" y="636.5" class="text-bold fill-N1 s2">N1 — 얕은 잠으로 들어가는 구간. 눈이 천천히 굴러간다</text></g><g ><g class="shape"><path d="M383 704h597v82H383z" class="stroke-B1 fill-B5 s0"/></g><text x="681.5" y="742.5" class="text-bold fill-N1 s2"><tspan x="681.5" dy="0">N2 — 짧게 몰아치는 파형과 큰 파형 하나가 특징이다.</tspan><tspan x="681.5" dy="18.5">하룻밤에서 가장 긴 시간을 차지한다</tspan></text></g><g ><g class="shape"><path d="M383 826h597v82H383z" class="stroke-B1 fill-B5 s0"/></g><text x="681.5" y="864.5" class="text-bold fill-N1 s2"><tspan x="681.5" dy="0">N3 — 느리고 큰 파형이 많은 구간. 깊은 잠이라 부른다.</tspan><tspan x="681.5" dy="18.5">깨우기 어렵고 앞쪽 주기에 몰려 있다</tspan></text></g><g ><g class="shape"><path d="M383 948h597v82H383z" class="stroke-B1 fill-B5 s0"/></g><text x="681.5" y="986.5" class="text-bold fill-N1 s2"><tspan x="681.5" dy="0">REM — 뇌파는 깨어 있을 때와 비슷한데 눈이 빠르게 움직이고</tspan><tspan x="681.5" dy="18.5">턱 근육의 긴장이 거의 사라진다. 그래서 역설수면이라고도 한다</tspan></text></g><marker id="mk-d2-1311401215-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1311401215-3488378134)" d="M681 148v114" class="connection stroke-B1 s0" mask="url(#d2-1311401215)"/><path fill="none" marker-end="url(#mk-d2-1311401215-3488378134)" d="M681 334v94" class="connection stroke-B1 s0" mask="url(#d2-1311401215)"/><marker id="mk-d2-1311401215-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1311401215-2177206569)" d="M450.603 1091.638C423.75 1130 416.75 1150 416.75 1186" class="connection stroke-B2 s4" mask="url(#d2-1311401215)"/><path fill="none" marker-end="url(#mk-d2-1311401215-2177206569)" d="M911.397 1091.638C938.25 1130 945.25 1153.2 945.25 1202" class="connection stroke-B2 s4" mask="url(#d2-1311401215)"/><mask id="d2-1311401215" width="1547" height="1561" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1547v1561H-91z"/></mask></svg>