<svg xmlns="http://www.w3.org/2000/svg" width="3168" height="1053" class="d2-1833704805 d2-svg" viewBox="-91 -121 3168 1053"><rect width="3168" height="1053" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1833704805 .fill-N1{fill:#0a0f25}.d2-1833704805 .fill-B4{fill:#e3e9fd}.d2-1833704805 .fill-B5{fill:#edf0fd}.d2-1833704805 .stroke-B1,.d2-1833704805 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M817 20h1345v126H817z" class="stroke-B1 fill-B4 s0"/></g><text x="1489.5" y="7" class="fill-N1 s1">동시에 재는 세 가지</text></g><g ><g class="shape"><path d="M1219 266h538v66h-538z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="1488" y="304.5" class="text-bold fill-N1 s2">정해 둔 채점 규칙에 따라 짧은 구간마다 한 단계를 붙인다</text></g><g ><g class="shape"><path d="M10 452h2966v142H10z" class="stroke-B1 fill-B4 s0"/></g><text x="1493" y="439" class="fill-N1 s1">붙는 단계들</text></g><text x="763.5" y="730" class="fill-N1 s2"><tspan x="763.5" dy="0"> </tspan><tspan x="763.5" dy="16.714">읽는 법 — 이 단계들은 ‘재는 방법과 채점 규칙이 함께 정의한 것’ 이다.</tspan><tspan x="763.5" dy="16.714"> </tspan><tspan x="763.5" dy="16.714">예전 규칙은 깊은 잠을 두 단계로 나누었는데 지금 널리 쓰는 규칙은 하나로 합쳤다.</tspan><tspan x="763.5" dy="16.714">자연의 경계가 바뀐 것이 아니라 규칙이 바뀐 것이다.</tspan><tspan x="763.5" dy="16.714">4장과 5장의 조작적 정의 이야기가 여기에 그대로 걸린다 —</tspan><tspan x="763.5" dy="16.714">‘다른 규칙으로 채점한 값을 그대로 견주면 안 된다’</tspan></text><text x="2226.5" y="738" class="fill-N1 s2"><tspan x="2226.5" dy="0"> </tspan><tspan x="2226.5" dy="16.833">흔한 오해 하나 — ‘꿈은 REM 에서만 꾼다’.</tspan><tspan x="2226.5" dy="16.833"> </tspan><tspan x="2226.5" dy="16.833">REM 에서 깨우면 꿈 보고가 훨씬 자주 나오는 것은 맞다.</tspan><tspan x="2226.5" dy="16.833">그러나 REM 이 아닌 구간에서 깨워도 보고가 나온다.</tspan><tspan x="2226.5" dy="16.833">정확한 서술은 ‘REM 에서 보고가 더 자주, 더 길고 생생하게 나온다’ 이다</tspan></text><g ><g class="shape"><path d="M847 50h401v66H847z" class="stroke-B1 fill-B5 s0"/></g><text x="1047.5" y="88.5" class="text-bold fill-N1 s2">뇌파 — 머리 표면에서 잰 전기 활동의 파형</text></g><g ><g class="shape"><path d="M1308 50h360v66h-360z" class="stroke-B1 fill-B5 s0"/></g><text x="1488" y="88.5" class="text-bold fill-N1 s2">눈 움직임 — 눈 둘레에서 잰 전기 변화</text></g><g ><g class="shape"><path d="M1728 50h404v66h-404z" class="stroke-B1 fill-B5 s0"/></g><text x="1930" y="88.5" class="text-bold fill-N1 s2">근육 긴장 — 턱 아래 근육에서 잰 전기 활동</text></g><g ><g class="shape"><path d="M40 490h574v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="327" y="528.5" class="text-bold fill-N1 s2">깸 — 빠르고 작은 파형. 눈을 감으면 규칙적인 파형이 나타난다</text></g><g ><g class="shape"><path d="M674 490h509v66H674z" class="stroke-B1 fill-B5 s0"/></g><text x="928.5" y="528.5" class="text-bold fill-N1 s2">N1 — 얕은 잠으로 들어가는 구간. 눈이 천천히 굴러간다</text></g><g ><g class="shape"><path d="M1243 482h489v82h-489z" class="stroke-B1 fill-B5 s0"/></g><text x="1487.5" y="520.5" class="text-bold fill-N1 s2"><tspan x="1487.5" dy="0">N2 — 짧게 몰아치는 파형과 큰 파형 하나가 특징이다.</tspan><tspan x="1487.5" dy="18.5">하룻밤에서 가장 긴 시간을 차지한다</tspan></text></g><g ><g class="shape"><path d="M1792 482h497v82h-497z" class="stroke-B1 fill-B5 s0"/></g><text x="2040.5" y="520.5" class="text-bold fill-N1 s2"><tspan x="2040.5" dy="0">N3 — 느리고 큰 파형이 많은 구간. 깊은 잠이라 부른다.</tspan><tspan x="2040.5" dy="18.5">깨우기 어렵고 앞쪽 주기에 몰려 있다</tspan></text></g><g ><g class="shape"><path d="M2349 482h597v82h-597z" class="stroke-B1 fill-B5 s0"/></g><text x="2647.5" y="520.5" class="text-bold fill-N1 s2"><tspan x="2647.5" dy="0">REM — 뇌파는 깨어 있을 때와 비슷한데 눈이 빠르게 움직이고</tspan><tspan x="2647.5" dy="18.5">턱 근육의 긴장이 거의 사라진다. 그래서 역설수면이라고도 한다</tspan></text></g><marker id="mk-d2-1833704805-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1833704805-3488378134)" d="M1487.5 148v114" class="connection stroke-B1 s0" mask="url(#d2-1833704805)"/><path fill="none" marker-end="url(#mk-d2-1833704805-3488378134)" d="M1487.5 334v73" class="connection stroke-B1 s0" mask="url(#d2-1833704805)"/><marker id="mk-d2-1833704805-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1833704805-2177206569)" d="M763.75 596v114" class="connection stroke-B2 s4" mask="url(#d2-1833704805)"/><path fill="none" marker-end="url(#mk-d2-1833704805-2177206569)" d="M2226.75 596v122" class="connection stroke-B2 s4" mask="url(#d2-1833704805)"/><mask id="d2-1833704805" width="3168" height="1053" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h3168V932H-91z"/></mask></svg>