<svg xmlns="http://www.w3.org/2000/svg" width="843" height="1688" class="d2-1602096462 d2-svg" viewBox="-89 -89 843 1688"><rect width="843" height="1688" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1602096462 .text-bold{font-weight:700}.d2-1602096462 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1602096462 .fill-N1{fill:#0a0f25}.d2-1602096462 .fill-N2{fill:#676c7e}.d2-1602096462 .fill-B6{fill:#f7f8fe}.d2-1602096462 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="436.5" cy="63.5" class="shape stroke-B1 fill-B6 s0" rx="133.5" ry="51.5"/></g><text x="436.5" y="53" class="text-bold fill-N1 s1"><tspan x="436.5" dy="0">트리</tspan><tspan x="436.5" dy="17.667">순환이 없고</tspan><tspan x="436.5" dy="17.667">이어져 있는 구조</tspan></text></g><g ><g class="shape"><path d="M230 312h191v82H230z" class="stroke-B1 fill-B6 s0"/></g><text x="325.5" y="350.5" class="text-bold fill-N1 s1"><tspan x="325.5" dy="0">이진트리</tspan><tspan x="325.5" dy="18.5">자식이 많아야 둘</tspan></text></g><g ><g class="shape"><path d="M85 597h215v82H85z" class="stroke-B1 fill-B6 s0"/></g><text x="192.5" y="635.5" class="text-bold fill-N1 s1"><tspan x="192.5" dy="0">이진 탐색 트리</tspan><tspan x="192.5" dy="18.5">왼쪽 &lt; 자기 &lt; 오른쪽</tspan></text></g><g ><g class="shape"><path d="M411 587h171v98H411z" class="stroke-B1 fill-B6 s0"/></g><text x="496.5" y="625.5" class="text-bold fill-N1 s1"><tspan x="496.5" dy="0">힙</tspan><tspan x="496.5" dy="17.667">부모 ≥ 두 자식,</tspan><tspan x="496.5" dy="17.667">완전 이진트리</tspan></text></g><g ><g class="shape"><path d="M12 765h215v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="119.5" y="803.5" class="text-bold fill-N1 s1"><tspan x="119.5" dy="0">찾기 · 넣기 · 지우기</tspan><tspan x="119.5" dy="17.667">O(log n)</tspan><tspan x="119.5" dy="17.667">단 균형이 맞을 때만</tspan></text></g><g ><g class="shape"><path d="M157 933h218v98H157z" class="stroke-B1 fill-B6 s0"/></g><text x="266" y="971.5" class="text-bold fill-N1 s1"><tspan x="266" dy="0">정렬된 자료를</tspan><tspan x="266" dy="17.667">순서대로 넣으면</tspan><tspan x="266" dy="17.667">높이가 n 이 되어 O(n)</tspan></text></g><g ><g class="shape"><path d="M18 1295h182v98H18z" class="stroke-B1 fill-B6 s0"/></g><text x="109" y="1333.5" class="text-bold fill-N1 s1"><tspan x="109" dy="0">AVL 트리</tspan><tspan x="109" dy="17.667">좌우 높이 차 ≤ 1.</tspan><tspan x="109" dy="17.667">회전으로 유지</tspan></text></g><g ><g class="shape"><path d="M180 1111h173v114H180z" class="stroke-B1 fill-B6 s0"/></g><text x="266.5" y="1149.5" class="text-bold fill-N1 s1"><tspan x="266.5" dy="0">레드-블랙 트리</tspan><tspan x="266.5" dy="17.25">느슨한 균형.</tspan><tspan x="266.5" dy="17.25">회전이 적어</tspan><tspan x="266.5" dy="17.25">갱신이 싸다</tspan></text></g><g ><g class="shape"><path d="M373 1111h243v98H373z" class="stroke-B1 fill-B6 s0"/></g><text x="494.5" y="1149.5" class="text-bold fill-N1 s1"><tspan x="494.5" dy="0">B-트리</tspan><tspan x="494.5" dy="17.667">한 노드에 키를 여러 개.</tspan><tspan x="494.5" dy="17.667">디스크 접근을 줄인다</tspan></text></g><g ><g class="shape"><path d="M395 933h202v98H395z" class="stroke-B1 fill-B6 s0"/></g><text x="496" y="971.5" class="text-bold fill-N1 s1"><tspan x="496" dy="0">우선순위 큐</tspan><tspan x="496" dy="17.667">가장 큰(작은) 것만</tspan><tspan x="496" dy="17.667">빠르게 꺼낸다</tspan></text></g><g ><g class="shape"><path d="M441 302h212v98H441z" class="stroke-B1 fill-B6 s0"/></g><text x="547" y="340.5" class="text-bold fill-N1 s1"><tspan x="547" dy="0">트라이</tspan><tspan x="547" dy="17.667">간선에 글자.</tspan><tspan x="547" dy="17.667">접두어 질의가 공짜</tspan></text></g><text x="332.5" y="1429" class="fill-N1 s1"><tspan x="332.5" dy="0">무엇을 고르나:</tspan><tspan x="332.5" dy="17">순서가 필요 없으면 해시 테이블,</tspan><tspan x="332.5" dy="17">순서와 범위 질의가 필요하면 균형 이진 탐색 트리,</tspan><tspan x="332.5" dy="17">최댓값만 필요하면 힙,</tspan><tspan x="332.5" dy="17">접두어가 필요하면 트라이</tspan></text><marker id="mk-d2-1602096462-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1602096462-3488378134)" d="m326 94-.082 215" class="connection stroke-B1 s0" mask="url(#d2-1602096462)"/><text x="325.5" y="200" class="text-italic fill-N2 s1"><tspan x="325.5" dy="0">자식 수를</tspan><tspan x="325.5" dy="18.5">2로 제한</tspan></text><path fill="none" marker-end="url(#mk-d2-1602096462-3488378134)" d="M294.083 397v33s0 10-10 10H203s-10 0-10 10v144" class="connection stroke-B1 s0" mask="url(#d2-1602096462)"/><text x="193.5" y="443" class="text-italic fill-N2 s1"><tspan x="193.5" dy="0">좌우에</tspan><tspan x="193.5" dy="18.5">대소 관계를 준다</tspan></text><path fill="none" marker-end="url(#mk-d2-1602096462-3488378134)" d="M357.75 397v33s0 10 10 10H486.5s10 0 10 10v133" class="connection stroke-B1 s0" mask="url(#d2-1602096462)"/><text x="478.5" y="438" class="text-italic fill-N2 s1"><tspan x="478.5" dy="0">위아래에</tspan><tspan x="478.5" dy="18.5">대소 관계를 준다</tspan></text><path fill="none" marker-end="url(#mk-d2-1602096462-3488378134)" d="M119.5 682v79" class="connection stroke-B1 s0" mask="url(#d2-1602096462)"/><path fill="none" marker-end="url(#mk-d2-1602096462-3488378134)" d="M266.5 682v247" class="connection stroke-B1 s0" mask="url(#d2-1602096462)"/><text x="266.5" y="812" class="text-italic fill-N2 s1">최악</text><path fill="none" marker-end="url(#mk-d2-1602096462-3488378134)" d="M212 1033v28s0 10-10 10h-83s-10 0-10 10v210" class="connection stroke-B1 s0" mask="url(#d2-1602096462)"/><text x="109" y="1109" class="text-italic fill-N2 s1"><tspan x="109" dy="0">규칙을 더</tspan><tspan x="109" dy="18.5">붙여 막는다</tspan></text><path fill="none" marker-end="url(#mk-d2-1602096462-3488378134)" d="M266.5 1033v74" class="connection stroke-B1 s0" mask="url(#d2-1602096462)"/><path fill="none" marker-end="url(#mk-d2-1602096462-3488378134)" d="M321 1033v28s0 10 10 10h153.5s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-1602096462)"/><path fill="none" marker-end="url(#mk-d2-1602096462-3488378134)" d="M496.5 687v242" class="connection stroke-B1 s0" mask="url(#d2-1602096462)"/><text x="497" y="807" class="text-italic fill-N2 s1"><tspan x="497" dy="0">이것을 만들려고</tspan><tspan x="497" dy="18.5">힙이 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-1602096462-3488378134)" d="m547.004 94 .404 204" class="connection stroke-B1 s0" mask="url(#d2-1602096462)"/><text x="547" y="195" class="text-italic fill-N2 s1"><tspan x="547" dy="0">문자열을</tspan><tspan x="547" dy="18.5">키로 쓸 때</tspan></text><mask id="d2-1602096462" width="843" height="1688" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h843v1688H-89z"/><path d="M283 184h85v37h-85zM121 427h145v37H121zM406 422h145v37H406zM245 796h43v21h-43zM57 1093h104v37H57zM426 791h142v37H426zM503 179h88v37h-88z"/></mask></svg>