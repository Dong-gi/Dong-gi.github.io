<svg xmlns="http://www.w3.org/2000/svg" width="1597" height="1155" class="d2-2572317037 d2-svg" viewBox="-101 -101 1597 1155"><rect width="1597" height="1155" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2572317037 .fill-N1{fill:#0a0f25}.d2-2572317037 .fill-N2{fill:#676c7e}.d2-2572317037 .fill-B6{fill:#f7f8fe}.d2-2572317037 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="704.5" cy="70.5" class="shape stroke-B1 fill-B6 s0" rx="211.5" ry="70.5"/></g><text x="704.5" y="68" class="text-bold fill-N1 s1"><tspan x="704.5" dy="0">트리</tspan><tspan x="704.5" dy="18.5">순환이 없고 이어져 있는 구조</tspan></text></g><g ><g class="shape"><path d="M451 262h191v82H451z" class="stroke-B1 fill-B6 s0"/></g><text x="546.5" y="300.5" class="text-bold fill-N1 s1"><tspan x="546.5" dy="0">이진트리</tspan><tspan x="546.5" dy="18.5">자식이 많아야 둘</tspan></text></g><g ><g class="shape"><path d="M247 465h215v82H247z" class="stroke-B1 fill-B6 s0"/></g><text x="354.5" y="503.5" class="text-bold fill-N1 s1"><tspan x="354.5" dy="0">이진 탐색 트리</tspan><tspan x="354.5" dy="18.5">왼쪽 &lt; 자기 &lt; 오른쪽</tspan></text></g><g ><g class="shape"><path d="M765 465h298v82H765z" class="stroke-B1 fill-B6 s0"/></g><text x="914" y="503.5" class="text-bold fill-N1 s1"><tspan x="914" dy="0">힙</tspan><tspan x="914" dy="18.5">부모 ≥ 두 자식, 완전 이진트리</tspan></text></g><g ><g class="shape"><path d="M45 668h268v82H45z" class="stroke-B1 fill-B6 s0"/></g><text x="179" y="706.5" class="text-bold fill-N1 s1"><tspan x="179" dy="0">찾기 · 넣기 · 지우기 O(log n)</tspan><tspan x="179" dy="18.5">단 균형이 맞을 때만</tspan></text></g><g ><g class="shape"><path d="M373 668h316v82H373z" class="stroke-B1 fill-B6 s0"/></g><text x="531" y="706.5" class="text-bold fill-N1 s1"><tspan x="531" dy="0">정렬된 자료를 순서대로 넣으면</tspan><tspan x="531" dy="18.5">높이가 n 이 되어 O(n)</tspan></text></g><g ><g class="shape"><path d="M0 871h310v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="155" y="909.5" class="text-bold fill-N1 s1"><tspan x="155" dy="0">AVL 트리</tspan><tspan x="155" dy="18.5">좌우 높이 차 ≤ 1. 회전으로 유지</tspan></text></g><g ><g class="shape"><path d="M370 871h368v82H370z" class="stroke-B1 fill-B6 s0"/></g><text x="554" y="909.5" class="text-bold fill-N1 s1"><tspan x="554" dy="0">레드-블랙 트리</tspan><tspan x="554" dy="18.5">느슨한 균형. 회전이 적어 갱신이 싸다</tspan></text></g><g ><g class="shape"><path d="M798 871h435v82H798z" class="stroke-B1 fill-B6 s0"/></g><text x="1015.5" y="909.5" class="text-bold fill-N1 s1"><tspan x="1015.5" dy="0">B-트리</tspan><tspan x="1015.5" dy="18.5">한 노드에 키를 여러 개. 디스크 접근을 줄인다</tspan></text></g><g ><g class="shape"><path d="M749 668h330v82H749z" class="stroke-B1 fill-B6 s0"/></g><text x="914" y="706.5" class="text-bold fill-N1 s1"><tspan x="914" dy="0">우선순위 큐</tspan><tspan x="914" dy="18.5">가장 큰(작은) 것만 빠르게 꺼낸다</tspan></text></g><g ><g class="shape"><path d="M702 262h324v82H702z" class="stroke-B1 fill-B6 s0"/></g><text x="864" y="300.5" class="text-bold fill-N1 s1"><tspan x="864" dy="0">트라이</tspan><tspan x="864" dy="18.5">간선에 글자. 접두어 질의가 공짜</tspan></text></g><text x="1185.5" y="44" class="fill-N1 s1"><tspan x="1185.5" dy="0">무엇을 고르나:</tspan><tspan x="1185.5" dy="17">순서가 필요 없으면 해시 테이블,</tspan><tspan x="1185.5" dy="17">순서와 범위 질의가 필요하면 균형 이진 탐색 트리,</tspan><tspan x="1185.5" dy="17">최댓값만 필요하면 힙,</tspan><tspan x="1185.5" dy="17">접두어가 필요하면 트라이</tspan></text><marker id="mk-d2-2572317037-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2572317037-3488378134)" d="M623.46 137.277C561.8 188.4 546 213.7 546 258.5" class="connection stroke-B1 s0" mask="url(#d2-2572317037)"/><text x="563" y="193" class="text-italic fill-N2 s1">자식 수를 2로 제한</text><path fill="none" marker-end="url(#mk-d2-2572317037-3488378134)" d="M466.737 344.444C377.3 392.3 354.5 416.7 354.5 461.5" class="connection stroke-B1 s0" mask="url(#d2-2572317037)"/><text x="387" y="393" class="text-italic fill-N2 s1">좌우에 대소 관계를 준다</text><path fill="none" marker-end="url(#mk-d2-2572317037-3488378134)" d="M644.427 329.91C859.3 389.475 913.5 416.7 913.5 461.5" class="connection stroke-B1 s0" mask="url(#d2-2572317037)"/><text x="804" y="380" class="text-italic fill-N2 s1">위아래에 대소 관계를 준다</text><path fill="none" marker-end="url(#mk-d2-2572317037-3488378134)" d="M281.77 547.505C199.5 595.3 178.5 619.7 178.5 664.5" class="connection stroke-B1 s0" mask="url(#d2-2572317037)"/><path fill="none" marker-end="url(#mk-d2-2572317037-3488378134)" d="M427.23 547.505C509.5 595.3 530.5 619.7 530.5 664.5" class="connection stroke-B1 s0" mask="url(#d2-2572317037)"/><text x="502.5" y="597" class="text-italic fill-N2 s1">최악</text><path fill="none" marker-end="url(#mk-d2-2572317037-3488378134)" d="M377.07 750.026C199.8 798.3 155 822.7 155 867.5" class="connection stroke-B1 s0" mask="url(#d2-2572317037)"/><text x="241.5" y="793" class="text-italic fill-N2 s1">규칙을 더 붙여 막는다</text><path fill="none" marker-end="url(#mk-d2-2572317037-3488378134)" d="M540.447 751.45C551.2 798.3 554 822.7 554 867.5" class="connection stroke-B1 s0" mask="url(#d2-2572317037)"/><path fill="none" marker-end="url(#mk-d2-2572317037-3488378134)" d="M691.457 742.476C950.3 796.813 1015.5 822.7 1015.5 867.5" class="connection stroke-B1 s0" mask="url(#d2-2572317037)"/><path fill="none" marker-end="url(#mk-d2-2572317037-3488378134)" d="M913.5 548.5v116" class="connection stroke-B1 s0" mask="url(#d2-2572317037)"/><text x="914" y="613" class="text-italic fill-N2 s1">이것을 만들려고 힙이 있다</text><path fill="none" marker-end="url(#mk-d2-2572317037-3488378134)" d="M786.536 137.281C847.8 188.4 863.5 213.7 863.5 258.5" class="connection stroke-B1 s0" mask="url(#d2-2572317037)"/><text x="847" y="193" class="text-italic fill-N2 s1">문자열을 키로 쓸 때</text><mask id="d2-2572317037" width="1597" height="1155" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1597v1155H-101z"/><path d="M485 177h156v21H485zM284 377h206v21H284zM691 364h226v21H691zM481 581h43v21h-43zM148 777h187v21H148zM801 597h226v21H801zM763 177h168v21H763z"/></mask></svg>