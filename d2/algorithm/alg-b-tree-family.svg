<svg xmlns="http://www.w3.org/2000/svg" width="1611" height="1164" class="d2-668362652 d2-svg" viewBox="-101 -101 1611 1164"><rect width="1611" height="1164" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-668362652 .fill-N1{fill:#0a0f25}.d2-668362652 .fill-N2{fill:#676c7e}.d2-668362652 .fill-B6{fill:#f7f8fe}.d2-668362652 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="704.5" cy="75" class="shape stroke-B1 fill-B6 s0" rx="225.5" ry="75"/></g><text x="704.5" y="72.5" class="text-bold fill-N1 s1"><tspan x="704.5" dy="0">트리</tspan><tspan x="704.5" dy="18.5">순환이 없고 이어져 있는 그래프</tspan></text></g><g ><g class="shape"><path d="M451 271h191v82H451z" class="stroke-B1 fill-B6 s0"/></g><text x="546.5" y="309.5" class="text-bold fill-N1 s1"><tspan x="546.5" dy="0">이진트리</tspan><tspan x="546.5" dy="18.5">자식이 많아야 둘</tspan></text></g><g ><g class="shape"><path d="M247 474h215v82H247z" class="stroke-B1 fill-B6 s0"/></g><text x="354.5" y="512.5" class="text-bold fill-N1 s1"><tspan x="354.5" dy="0">이진 탐색 트리</tspan><tspan x="354.5" dy="18.5">왼쪽 &lt; 자기 &lt; 오른쪽</tspan></text></g><g ><g class="shape"><path d="M765 474h298v82H765z" class="stroke-B1 fill-B6 s0"/></g><text x="914" y="512.5" class="text-bold fill-N1 s1"><tspan x="914" dy="0">힙</tspan><tspan x="914" dy="18.5">부모 ≥ 두 자식, 완전 이진트리</tspan></text></g><g ><g class="shape"><path d="M45 677h268v82H45z" class="stroke-B1 fill-B6 s0"/></g><text x="179" y="715.5" class="text-bold fill-N1 s1"><tspan x="179" dy="0">찾기 · 넣기 · 지우기 O(log n)</tspan><tspan x="179" dy="18.5">단 균형이 맞을 때만</tspan></text></g><g ><g class="shape"><path d="M373 677h316v82H373z" class="stroke-B1 fill-B6 s0"/></g><text x="531" y="715.5" class="text-bold fill-N1 s1"><tspan x="531" dy="0">정렬된 자료를 순서대로 넣으면</tspan><tspan x="531" dy="18.5">높이가 n 이 되어 O(n)</tspan></text></g><g ><g class="shape"><path d="M0 880h310v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="155" y="918.5" class="text-bold fill-N1 s1"><tspan x="155" dy="0">AVL 트리</tspan><tspan x="155" dy="18.5">좌우 높이 차 ≤ 1. 회전으로 유지</tspan></text></g><g ><g class="shape"><path d="M370 880h368v82H370z" class="stroke-B1 fill-B6 s0"/></g><text x="554" y="918.5" class="text-bold fill-N1 s1"><tspan x="554" dy="0">레드-블랙 트리</tspan><tspan x="554" dy="18.5">느슨한 균형. 회전이 적어 갱신이 싸다</tspan></text></g><g ><g class="shape"><path d="M798 880h435v82H798z" class="stroke-B1 fill-B6 s0"/></g><text x="1015.5" y="918.5" class="text-bold fill-N1 s1"><tspan x="1015.5" dy="0">B-트리</tspan><tspan x="1015.5" dy="18.5">한 노드에 키를 여러 개. 디스크 접근을 줄인다</tspan></text></g><g ><g class="shape"><path d="M749 677h330v82H749z" class="stroke-B1 fill-B6 s0"/></g><text x="914" y="715.5" class="text-bold fill-N1 s1"><tspan x="914" dy="0">우선순위 큐</tspan><tspan x="914" dy="18.5">가장 큰(작은) 것만 빠르게 꺼낸다</tspan></text></g><g ><g class="shape"><path d="M702 271h324v82H702z" class="stroke-B1 fill-B6 s0"/></g><text x="864" y="309.5" class="text-bold fill-N1 s1"><tspan x="864" dy="0">트라이</tspan><tspan x="864" dy="18.5">간선에 글자. 접두어 질의가 공짜</tspan></text></g><text x="1199.5" y="49" class="fill-N1 s1"><tspan x="1199.5" dy="0">무엇을 고르나:</tspan><tspan x="1199.5" dy="17">순서가 필요 없으면 해시 테이블,</tspan><tspan x="1199.5" dy="17">순서와 범위 질의가 필요하면 균형 이진 탐색 트리,</tspan><tspan x="1199.5" dy="17">최댓값만 필요하면 힙,</tspan><tspan x="1199.5" dy="17">접두어가 필요하면 트라이</tspan></text><marker id="mk-d2-668362652-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-668362652-3488378134)" d="M620.485 146.306C561.2 197.4 546 222.7 546 267.5" class="connection stroke-B1 s0" mask="url(#d2-668362652)"/><text x="562" y="202" class="text-italic fill-N2 s1">자식 수를 2로 제한</text><path fill="none" marker-end="url(#mk-d2-668362652-3488378134)" d="M466.737 353.444C377.3 401.3 354.5 425.7 354.5 470.5" class="connection stroke-B1 s0" mask="url(#d2-668362652)"/><text x="387" y="402" class="text-italic fill-N2 s1">좌우에 대소 관계를 준다</text><path fill="none" marker-end="url(#mk-d2-668362652-3488378134)" d="M644.427 338.91C859.3 398.475 913.5 425.7 913.5 470.5" class="connection stroke-B1 s0" mask="url(#d2-668362652)"/><text x="804" y="389" class="text-italic fill-N2 s1">위아래에 대소 관계를 준다</text><path fill="none" marker-end="url(#mk-d2-668362652-3488378134)" d="M281.77 556.505C199.5 604.3 178.5 628.7 178.5 673.5" class="connection stroke-B1 s0" mask="url(#d2-668362652)"/><path fill="none" marker-end="url(#mk-d2-668362652-3488378134)" d="M427.23 556.505C509.5 604.3 530.5 628.7 530.5 673.5" class="connection stroke-B1 s0" mask="url(#d2-668362652)"/><text x="502.5" y="606" class="text-italic fill-N2 s1">최악</text><path fill="none" marker-end="url(#mk-d2-668362652-3488378134)" d="M377.07 759.026C199.8 807.3 155 831.7 155 876.5" class="connection stroke-B1 s0" mask="url(#d2-668362652)"/><text x="241.5" y="802" class="text-italic fill-N2 s1">규칙을 더 붙여 막는다</text><path fill="none" marker-end="url(#mk-d2-668362652-3488378134)" d="M540.447 760.45C551.2 807.3 554 831.7 554 876.5" class="connection stroke-B1 s0" mask="url(#d2-668362652)"/><path fill="none" marker-end="url(#mk-d2-668362652-3488378134)" d="M691.457 751.476C950.3 805.813 1015.5 831.7 1015.5 876.5" class="connection stroke-B1 s0" mask="url(#d2-668362652)"/><path fill="none" marker-end="url(#mk-d2-668362652-3488378134)" d="M913.5 557.5v116" class="connection stroke-B1 s0" mask="url(#d2-668362652)"/><text x="914" y="622" class="text-italic fill-N2 s1">이것을 만들려고 힙이 있다</text><path fill="none" marker-end="url(#mk-d2-668362652-3488378134)" d="M788.52 146.3c59.68 51.1 74.98 76.4 74.98 121.2" class="connection stroke-B1 s0" mask="url(#d2-668362652)"/><text x="847" y="202" class="text-italic fill-N2 s1">문자열을 키로 쓸 때</text><mask id