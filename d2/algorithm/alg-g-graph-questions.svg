<svg xmlns="http://www.w3.org/2000/svg" width="1959" height="1086" class="d2-3562117854 d2-svg" viewBox="-101 -101 1959 1086"><rect width="1959" height="1086" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3562117854 .fill-N1{fill:#0a0f25}.d2-3562117854 .fill-N2{fill:#676c7e}.d2-3562117854 .fill-B6{fill:#f7f8fe}.d2-3562117854 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="535" cy="59.5" class="shape stroke-B1 fill-B6 s0" rx="178" ry="59.5"/></g><text x="535" y="65" class="text-bold fill-N1 s1">그래프에 무엇을 묻는가</text></g><g ><g class="shape"><path d="M409 219h252v66H409z" class="stroke-B1 fill-B6 s0"/></g><text x="535" y="257.5" class="text-bold fill-N1 s1">간선에 가중치가 있는가</text></g><g ><g class="shape"><path d="M188 406h330v82H188z" class="stroke-B1 fill-B6 s0"/></g><text x="353" y="444.5" class="text-bold fill-N1 s1"><tspan x="353" dy="0">9장으로 — 다익스트라 · 벨만-포드</tspan><tspan x="353" dy="18.5">프림 · 크루스칼</tspan></text></g><g ><g class="shape"><path d="M763 406h280v82H763z" class="stroke-B1 fill-B6 s0"/></g><text x="903" y="444.5" class="text-bold fill-N1 s1"><tspan x="903" dy="0">가중치가 없다</tspan><tspan x="903" dy="18.5">= 모든 간선이 똑같이 1 걸음</tspan></text></g><g ><g class="shape"><path d="M51 588h232v82H51z" class="stroke-B1 fill-B6 s0"/></g><text x="167" y="626.5" class="text-bold fill-N1 s1"><tspan x="167" dy="0">여기서 저기로 닿는가</tspan><tspan x="167" dy="18.5">덩어리가 몇 개인가</tspan></text></g><g ><g class="shape"><path d="M426 596h215v66H426z" class="stroke-B1 fill-B6 s0"/></g><text x="533.5" y="634.5" class="text-bold fill-N1 s1">몇 걸음 만에 닿는가</text></g><g ><g class="shape"><path d="M777 596h252v66H777z" class="stroke-B1 fill-B6 s0"/></g><text x="903" y="634.5" class="text-bold fill-N1 s1">되돌아오는 길이 있는가</text></g><g ><g class="shape"><path d="M1097 596h336v66h-336z" class="stroke-B1 fill-B6 s0"/></g><text x="1265" y="634.5" class="text-bold fill-N1 s1">선후관계를 지키는 순서가 있는가</text></g><g ><g class="shape"><path d="M1493 596h259v66h-259z" class="stroke-B1 fill-B6 s0"/></g><text x="1622.5" y="634.5" class="text-bold fill-N1 s1">두 무리로 나눌 수 있는가</text></g><g ><g class="shape"><path d="M0 778h334v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="167" y="816.5" class="text-bold fill-N1 s1"><tspan x="167" dy="0">DFS 또는 BFS</tspan><tspan x="167" dy="17.667">방문 표시만 하면 된다</tspan><tspan x="167" dy="17.667">탐색을 시작한 횟수 = 연결 요소 수</tspan></text></g><g ><g class="shape"><path d="M394 778h279v98H394z" class="stroke-B1 fill-B6 s0"/></g><text x="533.5" y="816.5" class="text-bold fill-N1 s1"><tspan x="533.5" dy="0">BFS 여야 한다</tspan><tspan x="533.5" dy="17.667">큐가 거리 순서를 지키므로</tspan><tspan x="533.5" dy="17.667">큐에 넣을 때 거리를 적는다</tspan></text></g><g ><g class="shape"><path d="M733 778h340v98H733z" class="stroke-B1 fill-B6 s0"/></g><text x="903" y="816.5" class="text-bold fill-N1 s1"><tspan x="903" dy="0">DFS 여야 한다</tspan><tspan x="903" dy="17.667">뒤 간선을 만나면 순환</tspan><tspan x="903" dy="17.667">무방향이면 부모 간선을 빼고 센다</tspan></text></g><g ><g class="shape"><path d="M1133 770h264v114h-264z" class="stroke-B1 fill-B6 s0"/></g><text x="1265" y="808.5" class="text-bold fill-N1 s1"><tspan x="1265" dy="0">위상 정렬</tspan><tspan x="1265" dy="17.25">진입차수 0 부터 꺼내거나</tspan><tspan x="1265" dy="17.25">DFS 종료 순서를 뒤집는다</tspan><tspan x="1265" dy="17.25">DAG 에서만 된다</tspan></text></g><g ><g class="shape"><path d="M1489 778h268v98h-268z" class="stroke-B1 fill-B6 s0"/></g><text x="1623" y="816.5" class="text-bold fill-N1 s1"><tspan x="1623" dy="0">BFS 로 층을 매기고</tspan><tspan x="1623" dy="17.667">층의 홀짝으로 칠한다</tspan><tspan x="1623" dy="17.667">= 홀수 길이 순환이 없는가</tspan></text></g><text x="1021" y="49" class="fill-N1 s1"><tspan x="1021" dy="0">다섯 가지 모두 O(V + E) 다 — 인접 리스트를 쓸 때.</tspan><tspan x="1021" dy="17.667">인접 행렬을 쓰면 이웃을 훑는 것만으로 O(V²) 가 된다.</tspan><tspan x="1021" dy="17.667">표현을 잘못 고르면 알고리즘을 아무리 잘 짜도 소용이 없다</tspan></text><marker id="mk-d2-3562117854-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M535 121v94" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M468.723 285.418C376.1 333.3 352.5 357.7 352.5 402.5" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><text x="386.5" y="333" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M662.94 284.989C854.6 333.3 903 357.7 903 402.5" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><text x="807.5" y="327" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M761.015 464.246C286.2 523.2 167 548 167 584" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M761.559 481.481C579.5 526.6 533.5 549.6 533.5 592" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M903 490v102" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M1044.94 482.49C1220.6 526.8 1265 549.6 1265 592" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M1044.484 465.25C1506.5 523.4 1622.5 549.6 1622.5 592" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M167 672v102" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M533.5 664v110" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M903 664v110" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M1265 664v102" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><path fill="none" marker-end="url(#mk-d2-3562117854-3488378134)" d="M1622.5 664v110" class="connection stroke-B1 s0" mask="url(#d2-3562117854)"/><mask id="d2-3562117854" width="1959" height="1086" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1959V985H-101z"/><path d="M365 317h43v21h-43zM786 311h43v21h-43z"/></mask></svg>