<svg xmlns="http://www.w3.org/2000/svg" width="1341" height="1493" class="d2-3174962770 d2-svg" viewBox="-89 -89 1341 1493"><rect width="1341" height="1493" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3174962770 .fill-N1{fill:#0a0f25}.d2-3174962770 .fill-N2{fill:#676c7e}.d2-3174962770 .fill-B6{fill:#f7f8fe}.d2-3174962770 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="432" cy="71.5" class="shape stroke-B1 fill-B6 s0" rx="178" ry="59.5"/></g><text x="432" y="77" class="text-bold fill-N1 s1">그래프에 무엇을 묻는가</text></g><g ><g class="shape"><path d="M306 201h252v66H306z" class="stroke-B1 fill-B6 s0"/></g><text x="432" y="239.5" class="text-bold fill-N1 s1">간선에 가중치가 있는가</text></g><g ><g class="shape"><path d="M100 438h337v82H100z" class="stroke-B1 fill-B6 s0"/></g><text x="268.5" y="476.5" class="text-bold fill-N1 s1"><tspan x="268.5" dy="0">12장으로 — 다익스트라 · 벨만-포드</tspan><tspan x="268.5" dy="18.5">프림 · 크루스칼</tspan></text></g><g ><g class="shape"><path d="M457 438h280v82H457z" class="stroke-B1 fill-B6 s0"/></g><text x="597" y="476.5" class="text-bold fill-N1 s1"><tspan x="597" dy="0">가중치가 없다</tspan><tspan x="597" dy="18.5">= 모든 간선이 똑같이 1 걸음</tspan></text></g><g ><g class="shape"><path d="M63 650h232v82H63z" class="stroke-B1 fill-B6 s0"/></g><text x="179" y="688.5" class="text-bold fill-N1 s1"><tspan x="179" dy="0">여기서 저기로 닿는가</tspan><tspan x="179" dy="18.5">덩어리가 몇 개인가</tspan></text></g><g ><g class="shape"><path d="M819 658h215v66H819z" class="stroke-B1 fill-B6 s0"/></g><text x="926.5" y="696.5" class="text-bold fill-N1 s1">몇 걸음 만에 닿는가</text></g><g ><g class="shape"><path d="M471 658h252v66H471z" class="stroke-B1 fill-B6 s0"/></g><text x="597" y="696.5" class="text-bold fill-N1 s1">되돌아오는 길이 있는가</text></g><g ><g class="shape"><path d="M117 980h336v66H117z" class="stroke-B1 fill-B6 s0"/></g><text x="285" y="1018.5" class="text-bold fill-N1 s1">선후관계를 지키는 순서가 있는가</text></g><g ><g class="shape"><path d="M888 980h259v66H888z" class="stroke-B1 fill-B6 s0"/></g><text x="1017.5" y="1018.5" class="text-bold fill-N1 s1">두 무리로 나눌 수 있는가</text></g><g ><g class="shape"><path d="M12 802h334v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="179" y="840.5" class="text-bold fill-N1 s1"><tspan x="179" dy="0">DFS 또는 BFS</tspan><tspan x="179" dy="17.667">방문 표시만 하면 된다</tspan><tspan x="179" dy="17.667">탐색을 시작한 횟수 = 연결 요소 수</tspan></text></g><g ><g class="shape"><path d="M787 802h279v98H787z" class="stroke-B1 fill-B6 s0"/></g><text x="926.5" y="840.5" class="text-bold fill-N1 s1"><tspan x="926.5" dy="0">BFS 여야 한다</tspan><tspan x="926.5" dy="17.667">큐가 거리 순서를 지키므로</tspan><tspan x="926.5" dy="17.667">큐에 넣을 때 거리를 적는다</tspan></text></g><g ><g class="shape"><path d="M427 802h340v98H427z" class="stroke-B1 fill-B6 s0"/></g><text x="597" y="840.5" class="text-bold fill-N1 s1"><tspan x="597" dy="0">DFS 여야 한다</tspan><tspan x="597" dy="17.667">뒤 간선을 만나면 순환</tspan><tspan x="597" dy="17.667">무방향이면 부모 간선을 빼고 센다</tspan></text></g><g ><g class="shape"><path d="M153 1116h264v114H153z" class="stroke-B1 fill-B6 s0"/></g><text x="285" y="1154.5" class="text-bold fill-N1 s1"><tspan x="285" dy="0">위상 정렬</tspan><tspan x="285" dy="17.25">진입차수 0 부터 꺼내거나</tspan><tspan x="285" dy="17.25">DFS 종료 순서를 뒤집는다</tspan><tspan x="285" dy="17.25">DAG 에서만 된다</tspan></text></g><g ><g class="shape"><path d="M883 1116h268v98H883z" class="stroke-B1 fill-B6 s0"/></g><text x="1017" y="1154.5" class="text-bold fill-N1 s1"><tspan x="1017" dy="0">BFS 로 층을 매기고</tspan><tspan x="1017" dy="17.667">층의 홀짝으로 칠한다</tspan><tspan x="1017" dy="17.667">= 홀수 길이 순환이 없는가</tspan></text></g><text x="581" y="1266" class="fill-N1 s1"><tspan x="581" dy="0">다섯 가지 모두 O(V + E) 다 — 인접 리스트를 쓸 때.</tspan><tspan x="581" dy="17.667">인접 행렬을 쓰면 이웃을 훑는 것만으로 O(V²) 가 된다.</tspan><tspan x="581" dy="17.667">표현을 잘못 고르면 알고리즘을 아무리 잘 짜도 소용이 없다</tspan></text><marker id="mk-d2-3174962770-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M433 133v64" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M390.75 269v165" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><text x="390.5" y="358" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M474.75 269v28s0 10 10 10h103.166s10 0 10 10v117" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><text x="581.5" y="313" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M504.583 522v28s0 10-10 10H189s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M644.583 522v78s0 10 10 10H916.5s10 0 10 10v34" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M597 522v132" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M551.25 522v78s0 10-10 10H396s-10 0-10 10v356" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M691.25 522v28s0 10 10 10H1096s10 0 10 10v406" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M179 734v64" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M926.5 726v72" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M597 726v72" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M285.083 1048v64" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><path fill="none" marker-end="url(#mk-d2-3174962770-3488378134)" d="M1017.916 1048v64" class="connection stroke-B1 s0" mask="url(#d2-3174962770)"/><mask id="d2-3174962770" width="1341" height="1493" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1341v1493H-89z"/><path d="M369 342h43v21h-43zM560 297h43v21h-43z"/></mask></svg>