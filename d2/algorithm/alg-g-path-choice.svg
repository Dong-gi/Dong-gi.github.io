ath fill="none" marker-end="url(#mk-d2-2859211202-3488378134)" d="M1309.5 454v94" class="connection stroke-B1 s0" mask="url(#d2-2859211202)"/><path fill="none" marker-end="url(#mk-d2-2859211202-3488378134)" d="M1222.887 618.228C1099.95 666.3 1068.75 690.7 1068.75 735.5" class="connection stroke-B1 s0" mask="url(#d2-2859211202)"/><text x="1121.5" y="663" class="text-italic fill-N2 s1">밀집</text><path fill="none" marker-end="url(#mk-d2-2859211202-3488378134)" d="M1396.113 618.228C1519.05 666.3 1550.25 690.7 1550.25 735.5" class="connection stroke-B1 s0" mask="url(#d2-2859211202)"/><text x="1497.5" y="663" class="text-italic fill-N2 s1">희소 · 간선이 이미 정렬됨</text><mask id="d2-2859211202" width="2225" height="1616" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2225v1616H-101z"/><path d="M436 654h43v21h-43zM654 657h62v21h-62zM418 842h43v21h-43zM167 1041h43v21h-43zM458 1041h43v21h-43zM938 842h43v21h-43zM853 1040h114v21H853zM1169 1040h85v21h-85zM1071 1245h62v21h-62zM1360 1245h62v21h-62zM1100 647h43v21h-43zM1391 647h213v21h-213z"/></mask></svg>