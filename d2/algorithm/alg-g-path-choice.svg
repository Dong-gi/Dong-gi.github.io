<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="1921" class="d2-2333882498 d2-svg" viewBox="-89 -89 1376 1921"><rect width="1376" height="1921" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2333882498 .text-bold{font-weight:700}.d2-2333882498 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2333882498 .fill-N1{fill:#0a0f25}.d2-2333882498 .fill-N2{fill:#676c7e}.d2-2333882498 .fill-B6{fill:#f7f8fe}.d2-2333882498 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="684.5" cy="72" class="shape stroke-B1 fill-B6 s0" rx="180.5" ry="60"/></g><text x="684.5" y="77.5" class="text-bold fill-N1 s1">간선에 값이 붙은 그래프</text></g><g ><g class="shape"><path d="M591 202h188v66H591z" class="stroke-B1 fill-B6 s0"/></g><text x="685" y="240.5" class="text-bold fill-N1 s1">무엇을 구하는가</text></g><g ><g class="shape"><path d="M351 348h151v66H351z" class="stroke-B1 fill-B6 s0"/></g><text x="426.5" y="386.5" class="text-bold fill-N1 s1">가장 짧은 길</text></g><g ><g class="shape"><path d="M774 348h282v66H774z" class="stroke-B1 fill-B6 s0"/></g><text x="915" y="386.5" class="text-bold fill-N1 s1">모든 점을 잇는 가장 싼 방법</text></g><g ><g class="shape"><path d="M311 484h232v66H311z" class="stroke-B1 fill-B6 s0"/></g><text x="427" y="522.5" class="text-bold fill-N1 s1">가중치가 전부 같은가</text></g><g ><g class="shape"><path d="M219 737h193v82H219z" class="stroke-B1 fill-B6 s0"/></g><text x="315.5" y="775.5" class="text-bold fill-N1 s1"><tspan x="315.5" dy="0">너비 우선 탐색</tspan><tspan x="315.5" dy="18.5">O(V+E). 9장 그대로</tspan></text></g><g ><g class="shape"><path d="M432 758h212v66H432z" class="stroke-B1 fill-B6 s0"/></g><text x="538" y="796.5" class="text-bold fill-N1 s1">음수 간선이 있는가</text></g><g ><g class="shape"><path d="M165 1006h212v66H165z" class="stroke-B1 fill-B6 s0"/></g><text x="271" y="1044.5" class="text-bold fill-N1 s1">순환이 없는가 (DAG)</text></g><g ><g class="shape"><path d="M12 1243h255v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="139.5" y="1281.5" class="text-bold fill-N1 s1"><tspan x="139.5" dy="0">위상 정렬 후 완화</tspan><tspan x="139.5" dy="17.667">O(V+E).</tspan><tspan x="139.5" dy="17.667">음수도 최장 경로도 된다</tspan></text></g><g ><g class="shape"><path d="M287 1243h232v98H287z" class="stroke-B1 fill-B6 s0"/></g><text x="403" y="1281.5" class="text-bold fill-N1 s1"><tspan x="403" dy="0">벨만-포드</tspan><tspan x="403" dy="17.667">O(VE).</tspan><tspan x="403" dy="17.667">음수 순환도 잡아낸다</tspan></text></g><g ><g class="shape"><path d="M710 1006h191v66H710z" class="stroke-B1 fill-B6 s0"/></g><text x="805.5" y="1044.5" class="text-bold fill-N1 s1">몇 쌍이 필요한가</text></g><g ><g class="shape"><path d="M539 1243h279v98H539z" class="stroke-B1 fill-B6 s0"/></g><text x="678.5" y="1281.5" class="text-bold fill-N1 s1"><tspan x="678.5" dy="0">플로이드-워셜</tspan><tspan x="678.5" dy="17.667">Θ(V³).</tspan><tspan x="678.5" dy="17.667">정점이 수백 개 이하일 때만</tspan></text></g><g ><g class="shape"><path d="M838 1243h191v98H838z" class="stroke-B1 fill-B6 s0"/></g><text x="933.5" y="1281.5" class="text-bold fill-N1 s1"><tspan x="933.5" dy="0">목적지를 알고</tspan><tspan x="933.5" dy="17.667">남은 거리를</tspan><tspan x="933.5" dy="17.667">어림할 수 있는가</tspan></text></g><g ><g class="shape"><path d="M724 1512h209v98H724z" class="stroke-B1 fill-B6 s0"/></g><text x="828.5" y="1550.5" class="text-bold fill-N1 s1"><tspan x="828.5" dy="0">A*</tspan><tspan x="828.5" dy="17.667">어림값은 실제보다</tspan><tspan x="828.5" dy="17.667">크면 안 된다</tspan></text></g><g ><g class="shape"><path d="M953 1512h168v98H953z" class="stroke-B1 fill-B6 s0"/></g><text x="1037" y="1550.5" class="text-bold fill-N1 s1"><tspan x="1037" dy="0">다익스트라</tspan><tspan x="1037" dy="17.667">O(E log V).</tspan><tspan x="1037" dy="17.667">우선순위 큐로</tspan></text></g><g ><g class="shape"><path d="M811 484h209v66H811z" class="stroke-B1 fill-B6 s0"/></g><text x="915.5" y="522.5" class="text-bold fill-N1 s1">그래프가 밀집인가</text></g><g ><g class="shape"><path d="M664 737h232v98H664z" class="stroke-B1 fill-B6 s0"/></g><text x="780" y="775.5" class="text-bold fill-N1 s1"><tspan x="780" dy="0">프림</tspan><tspan x="780" dy="17.667">자름을 먼저 정하고</tspan><tspan x="780" dy="17.667">건너는 간선을 고른다</tspan></text></g><g ><g class="shape"><path d="M916 737h270v98H916z" class="stroke-B1 fill-B6 s0"/></g><text x="1051" y="775.5" class="text-bold fill-N1 s1"><tspan x="1051" dy="0">크루스칼</tspan><tspan x="1051" dy="17.667">싼 간선부터 고르고</tspan><tspan x="1051" dy="17.667">union-find 로 고리를 막는다</tspan></text></g><text x="599" y="1646" class="fill-N1 s1"><tspan x="599" dy="0">먼저 확인할 것:</tspan><tspan x="599" dy="16.833">음수 간선이 하나라도 있으면 다익스트라는 틀린 답을 낼 수 있다</tspan><tspan x="599" dy="16.833">— 오류를 내지 않고 조용히 틀린다.</tspan><tspan x="599" dy="16.833">음수 순환이 있으면 어떤 알고리즘도 답을 낼 수 없다. 탐지만 가능하다.</tspan><tspan x="599" dy="16.833">최소신장트리는 출발점에서의 최단경로를 보장하지 않는다</tspan><tspan x="599" dy="16.833">— 두 문제는 다른 것을 최적화한다</tspan></text><marker id="mk-d2-2333882498-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M685 134v64" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M654.083 270v28s0 10-10 10H437s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M716.75 270v28s0 10 10 10h179s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M427 416v64" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M388.333 552v181" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="388.5" y="649" class="text-italic fill-N2 s1">같다</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M465.666 552v202" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="466" y="660" class="text-italic fill-N2 s1">다르다</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M502.916 826v39s0 10-10 10H281.25s-10 0-10 10v117" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="347.5" y="881" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M235.916 1074v165" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="235.5" y="1163" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M306.583 1074v165" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="306.5" y="1163" class="text-italic fill-N2 s1">있다</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M573.583 826v39s0 10 10 10H796s10 0 10 10v117" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="729.5" y="881" class="text-italic fill-N2 s1">없다</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M774.166 1074v165" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="774" y="1163" class="text-italic fill-N2 s1">모든 쌍 · 밀집</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M837.833 1074v28s0 10 10 10H923.5s10 0 10 10v117" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="931.5" y="1118" class="text-italic fill-N2 s1">한 점에서</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M901.666 1343v165" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="902" y="1432" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M965.333 1343v28s0 10 10 10h52.417s10 0 10 10v117" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="1038" y="1396" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M915.75 416v64" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M880.916 552v28s0 10-10 10H790.25s-10 0-10 10v133" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="780.5" y="599" class="text-italic fill-N2 s1">밀집</text><path fill="none" marker-end="url(#mk-d2-2333882498-3488378134)" d="M950.583 552v181" class="connection stroke-B1 s0" mask="url(#d2-2333882498)"/><text x="950.5" y="641" class="text-italic fill-N2 s1"><tspan x="950.5" dy="0">희소 ·</tspan><tspan x="950.5" dy="18.5">간선이 이미 정렬됨</tspan></text><mask id="d2-2333882498" width="1376" height="1921" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1376v1921H-89z"/><path d="M367 633h43v21h-43zM435 644h62v21h-62zM326 865h43v21h-43zM214 1147h43v21h-43zM285 1147h43v21h-43zM708 865h43v21h-43zM717 1147h114v21H717zM889 1102h85v21h-85zM871 1416h62v21h-62zM1007 1380h62v21h-62zM759 583h43v21h-43zM868 625h165v37H868z"/></mask></svg>