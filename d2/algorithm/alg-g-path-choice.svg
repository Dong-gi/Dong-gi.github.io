<svg xmlns="http://www.w3.org/2000/svg" width="2225" height="1616" class="d2-2859211202 d2-svg" viewBox="-101 -101 2225 1616"><rect width="2225" height="1616" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2859211202 .fill-N1{fill:#0a0f25}.d2-2859211202 .fill-N2{fill:#676c7e}.d2-2859211202 .fill-B6{fill:#f7f8fe}.d2-2859211202 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="994.5" cy="60" class="shape stroke-B1 fill-B6 s0" rx="180.5" ry="60"/></g><text x="994.5" y="65.5" class="text-bold fill-N1 s1">간선에 값이 붙은 그래프</text></g><g ><g class="shape"><path d="M901 220h188v66H901z" class="stroke-B1 fill-B6 s0"/></g><text x="995" y="258.5" class="text-bold fill-N1 s1">무엇을 구하는가</text></g><g ><g class="shape"><path d="M495 386h151v66H495z" class="stroke-B1 fill-B6 s0"/></g><text x="570.5" y="424.5" class="text-bold fill-N1 s1">가장 짧은 길</text></g><g ><g class="shape"><path d="M1169 386h282v66h-282z" class="stroke-B1 fill-B6 s0"/></g><text x="1310" y="424.5" class="text-bold fill-N1 s1">모든 점을 잇는 가장 싼 방법</text></g><g ><g class="shape"><path d="M454 552h232v66H454z" class="stroke-B1 fill-B6 s0"/></g><text x="570" y="590.5" class="text-bold fill-N1 s1">가중치가 전부 같은가</text></g><g ><g class="shape"><path d="M342 739h193v82H342z" class="stroke-B1 fill-B6 s0"/></g><text x="438.5" y="777.5" class="text-bold fill-N1 s1"><tspan x="438.5" dy="0">너비 우선 탐색</tspan><tspan x="438.5" dy="18.5">O(V+E). 8장 그대로</tspan></text></g><g ><g class="shape"><path d="M595 747h212v66H595z" class="stroke-B1 fill-B6 s0"/></g><text x="701" y="785.5" class="text-bold fill-N1 s1">음수 간선이 있는가</text></g><g ><g class="shape"><path d="M228 942h212v66H228z" class="stroke-B1 fill-B6 s0"/></g><text x="334" y="980.5" class="text-bold fill-N1 s1">순환이 없는가 (DAG)</text></g><g ><g class="shape"><path d="M0 1129h312v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="156" y="1167.5" class="text-bold fill-N1 s1"><tspan x="156" dy="0">위상 정렬 후 완화</tspan><tspan x="156" dy="18.5">O(V+E). 음수도 최장 경로도 된다</tspan></text></g><g ><g class="shape"><path d="M372 1129h281v82H372z" class="stroke-B1 fill-B6 s0"/></g><text x="512.5" y="1167.5" class="text-bold fill-N1 s1"><tspan x="512.5" dy="0">벨만-포드</tspan><tspan x="512.5" dy="18.5">O(VE). 음수 순환도 잡아낸다</tspan></text></g><g ><g class="shape"><path d="M965 942h191v66H965z" class="stroke-B1 fill-B6 s0"/></g><text x="1060.5" y="980.5" class="text-bold fill-N1 s1">몇 쌍이 필요한가</text></g><g ><g class="shape"><path d="M713 1129h324v82H713z" class="stroke-B1 fill-B6 s0"/></g><text x="875" y="1167.5" class="text-bold fill-N1 s1"><tspan x="875" dy="0">플로이드-워셜</tspan><tspan x="875" dy="18.5">Θ(V³). 정점이 수백 개 이하일 때만</tspan></text></g><g ><g class="shape"><path d="M1097 1129h299v82h-299z" class="stroke-B1 fill-B6 s0"/></g><text x="1246.5" y="1167.5" class="text-bold fill-N1 s1"><tspan x="1246.5" dy="0">목적지를 알고</tspan><tspan x="1246.5" dy="18.5">남은 거리를 어림할 수 있는가</tspan></text></g><g ><g class="shape"><path d="M916 1332h319v82H916z" class="stroke-B1 fill-B6 s0"/></g><text x="1075.5" y="1370.5" class="text-bold fill-N1 s1"><tspan x="1075.5" dy="0">A*</tspan><tspan x="1075.5" dy="18.5">어림값은 실제보다 크면 안 된다</tspan></text></g><g ><g class="shape"><path d="M1295 1332h245v82h-245z" class="stroke-B1 fill-B6 s0"/></g><text x="1417.5" y="1370.5" class="text-bold fill-N1 s1"><tspan x="1417.5" dy="0">다익스트라</tspan><tspan x="1417.5" dy="18.5">O(E log V). 우선순위 큐로</tspan></text></g><g ><g class="shape"><path d="M1205 552h209v66h-209z" class="stroke-B1 fill-B6 s0"/></g><text x="1309.5" y="590.5" class="text-bold fill-N1 s1">그래프가 밀집인가</text></g><g ><g class="shape"><path d="M867 739h403v82H867z" class="stroke-B1 fill-B6 s0"/></g><text x="1068.5" y="777.5" class="text-bold fill-N1 s1"><tspan x="1068.5" dy="0">프림</tspan><tspan x="1068.5" dy="18.5">자름을 먼저 정하고 건너는 간선을 고른다</tspan></text></g><g ><g class="shape"><path d="M1330 739h440v82h-440z" class="stroke-B1 fill-B6 s0"/></g><text x="1550" y="777.5" class="text-bold fill-N1 s1"><tspan x="1550" dy="0">크루스칼</tspan><tspan x="1550" dy="18.5">싼 간선부터 고르고 union-find 로 고리를 막는다</tspan></text></g><text x="1629" y="42" class="fill-N1 s1"><tspan x="1629" dy="0">먼저 확인할 것:</tspan><tspan x="1629" dy="17.25">음수 간선이 하나라도 있으면 다익스트라는 틀린 답을 낸다 — 오류를 내지 않고 조용히 틀린다.</tspan><tspan x="1629" dy="17.25">음수 순환이 있으면 어떤 알고리즘도 답을 낼 수 없다. 탐지만 가능하다.</tspan><tspan x="1629" dy="17.25">최소신장트리는 출발점에서의 최단경로를 보장하지 않는다 — 두 문제는 다른 것을 최적화한다</tspan></text><marker id="mk-d2-2859211202-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2859211202-3488378134)" d="M994.98 122c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-2859211202)"/><path fill="none" marker-end="url(#mk-d2-2859211202-3488378134)" d="M898.537 271.763C636.1 323.075 570 346 570 382" class="connection stroke-B1 s0" mask="url(#d2-2859211202)"/><path fill="none" marker-end="url(#mk-d2-2859211202-3488378134)" d="M1091.433 278.28C1265.5 324.353 1309.5 346 1309.5 382" class="connection stroke-B1 s0" mask="url(#d2-2859211202)"/><path fill="none" marker-end="url(#mk-d2-2859211202-3488378134)" d="M570 454v94" class="connection stroke-B1 s0" mask="url(#d2-2859211202)"/><path fill="none" marker-end="url(#mk-d2-2859211202-3488378134)" d="M522.125 618.666C455.75 666.3 438.75 690.7 438.75 735.5" class="connection stroke-B1 s0" mask="url(#d2-2859211202)"/><text x="457.5" y="670" class="text-italic fill-N2 s1">같다</text><path fill="none" marker-end="url(#mk-d2-2859211202-3488378134)" d="M617.875 618.666C684.25 666.3 701.25 692.3 701.25 743.5" class="connection stroke-B1 s0" mask="url(#d2-2859211202)"/><text x="685" y="673" class="text-italic fill-N2 s1">다르다</text><path fill="none" m