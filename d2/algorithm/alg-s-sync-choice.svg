<svg xmlns="http://www.w3.org/2000/svg" width="1492" height="1570" class="d2-3057797236 d2-svg" viewBox="-89 -89 1492 1570"><rect width="1492" height="1570" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3057797236 .text-bold{font-weight:700}.d2-3057797236 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3057797236 .fill-N1{fill:#0a0f25}.d2-3057797236 .fill-N2{fill:#676c7e}.d2-3057797236 .fill-B6{fill:#f7f8fe}.d2-3057797236 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="437.5" cy="93" class="shape stroke-B1 fill-B6 s0" rx="242.5" ry="81"/></g><text x="437.5" y="98.5" class="text-bold fill-N1 s1">두 실행 흐름이 같은 것을 건드린다</text></g><g ><g class="shape"><path d="M12 345h499v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="261.5" y="383.5" class="text-bold fill-N1 s1"><tspan x="261.5" dy="0">가장 좋은 답 — 공유하지 않는다</tspan><tspan x="261.5" dy="17.667">각자의 사본을 갖거나 · 값을 바꾸지 않거나(불변) ·</tspan><tspan x="261.5" dy="17.667">한 흐름만 그 자료를 맡게 하거나(메시지로 주고받기)</tspan></text></g><g ><g class="shape"><path d="M531 366h168v66H531z" class="stroke-B1 fill-B6 s0"/></g><text x="615" y="404.5" class="text-bold fill-N1 s1">읽기만 하는가</text></g><g ><g class="shape"><path d="M349 614h363v82H349z" class="stroke-B1 fill-B6 s0"/></g><text x="530.5" y="652.5" class="text-bold fill-N1 s1"><tspan x="530.5" dy="0">아무것도 필요 없다</tspan><tspan x="530.5" dy="18.5">아무도 쓰지 않으면 경쟁 상태가 없다</tspan></text></g><g ><g class="shape"><path d="M732 627h209v66H732z" class="stroke-B1 fill-B6 s0"/></g><text x="836.5" y="665.5" class="text-bold fill-N1 s1">무엇을 기다리는가</text></g><g ><g class="shape"><path d="M60 999h321v98H60z" class="stroke-B1 fill-B6 s0"/></g><text x="220.5" y="1037.5" class="text-bold fill-N1 s1"><tspan x="220.5" dy="0">뮤텍스 — 자리 하나</tspan><tspan x="220.5" dy="17.667">‘지금은 내가 쓴다’ 를 표시한다</tspan><tspan x="220.5" dy="17.667">잠근 스레드만 풀 수 있다</tspan></text></g><g ><g class="shape"><path d="M865 983h235v130H865z" class="stroke-B1 fill-B6 s0"/></g><text x="982.5" y="1021.5" class="text-bold fill-N1 s1"><tspan x="982.5" dy="0">세마포어 — 자리 n 개</tspan><tspan x="982.5" dy="17">개수를 센다.</tspan><tspan x="982.5" dy="17">자원 풀과 신호 보내기</tspan><tspan x="982.5" dy="17">잠근 쪽과 푸는 쪽이</tspan><tspan x="982.5" dy="17">달라도 된다</tspan></text></g><g ><g class="shape"><path d="M401 983h291v130H401z" class="stroke-B1 fill-B6 s0"/></g><text x="546.5" y="1021.5" class="text-bold fill-N1 s1"><tspan x="546.5" dy="0">모니터 — 락과 조건 변수를</tspan><tspan x="546.5" dy="17">한 묶음으로</tspan><tspan x="546.5" dy="17">‘들어가서, 조건이 안 맞으면</tspan><tspan x="546.5" dy="17">락을 놓고 잔다’</tspan><tspan x="546.5" dy="17">생산자-소비자의 기본 모양</tspan></text></g><g ><g class="shape"><path d="M690 1193h276v98H690z" class="stroke-B1 fill-B6 s0"/></g><text x="828" y="1231.5" class="text-bold fill-N1 s1"><tspan x="828" dy="0">독자-작가 락</tspan><tspan x="828" dy="17.667">읽는 사람은 여럿이 동시에</tspan><tspan x="828" dy="17.667">쓰는 사람은 혼자서</tspan></text></g><g ><g class="shape"><path d="M986 1193h316v114H986z" class="stroke-B1 fill-B6 s0"/></g><text x="1144" y="1231.5" class="text-bold fill-N1 s1"><tspan x="1144" dy="0">원자적 연산 · CAS</tspan><tspan x="1144" dy="17.25">한 변수를 세는 정도라면</tspan><tspan x="1144" dy="17.25">락이 필요 없다</tspan><tspan x="1144" dy="17.25">경쟁이 심하면 오히려 느려진다</tspan></text></g><text x="383.5" y="1209" class="fill-N1 s1"><tspan x="383.5" dy="0">락을 둘 이상 잡게 되면 잠그는 순서를 하나로 정해 둔다.</tspan><tspan x="383.5" dy="18.5">그것 하나로 순환 대기가 사라지고, 그러면 교착이 생길 수 없다</tspan></text><text x="656.5" y="1343" class="fill-N1 s1"><tspan x="656.5" dy="0">임계 구역은 짧을수록 좋지만 너무 짧으면 틀린다.</tspan><tspan x="656.5" dy="17.667">‘검사와 그 결과에 따른 행동’ 은 반드시 한 임계 구역 안에 함께 있어야 한다</tspan><tspan x="656.5" dy="17.667">— 그러지 않으면 TOCTOU 다</tspan></text><marker id="mk-d2-3057797236-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="m261.995 150-.485 191" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><text x="262" y="252" class="text-italic fill-N2 s1">나눌 수 있는가</text><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="M615 150v212" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><text x="615.5" y="263" class="text-italic fill-N2 s1">나눌 수 없다</text><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="M587 434v176" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><text x="587" y="529" class="text-italic fill-N2 s1">쓰는 쪽이 아예 없다</text><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="M643 434v39s0 10 10 10h173.75s10 0 10 10v130" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><text x="786" y="489" class="text-italic fill-N2 s1">쓰는 쪽이 있다</text><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="M767.083 695v31s0 10-10 10H230.75s-10 0-10 10v249" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><text x="384" y="734" class="text-italic fill-N2 s1"><tspan x="384" dy="0">짧은 구간의</tspan><tspan x="384" dy="18.5">배타적 접근</tspan></text><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="M871.583 695v81s0 10 10 10h91.75s10 0 10 10v183" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><text x="979.5" y="792" class="text-italic fill-N2 s1">정해진 개수의 자원</text><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="M801.916 695v81s0 10-10 10H556.75s-10 0-10 10v183" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><text x="622.5" y="784" class="text-italic fill-N2 s1"><tspan x="622.5" dy="0">‘조건이 맞을 때까지’ 를</tspan><tspan x="622.5" dy="18.5">기다린다</tspan></text><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="M836.75 695v131s0 10-10 10H778s-10 0-10 10v343" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><text x="768" y="906" class="text-italic fill-N2 s1"><tspan x="768" dy="0">읽기가</tspan><tspan x="768" dy="18.5">압도적으로 많다</tspan></text><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="M906.416 695v31s0 10 10 10h277.417s10 0 10 10v443" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><text x="1203.5" y="792" class="text-italic fill-N2 s1"><tspan x="1203.5" dy="0">변수 하나를</tspan><tspan x="1203.5" dy="18.5">세거나 바꾼다</tspan></text><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="M296.583 1099v90" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><path fill="none" marker-end="url(#mk-d2-3057797236-3488378134)" d="M470.916 1115v74" class="connection stroke-B1 s0" mask="url(#d2-3057797236)"/><mask id="d2-3057797236" width="1492" height="1570" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1492v1570H-89z"/><path d="M199 236h126v21H199zM562 247h107v21H562zM503 513h168v21H503zM723 473h126v21H723zM332 718h104v37H332zM897 776h165v21H897zM519 768h207v37H519zM697 890h142v37H697zM1142 776h123v37h-123z"/></mask></svg>