<svg xmlns="http://www.w3.org/2000/svg" width="1213" height="1668" class="d2-337777178 d2-svg" viewBox="-89 -89 1213 1668"><rect width="1213" height="1668" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-337777178 .text-bold{font-weight:700}.d2-337777178 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-337777178 .fill-N1{fill:#0a0f25}.d2-337777178 .fill-N2{fill:#676c7e}.d2-337777178 .fill-B6{fill:#f7f8fe}.d2-337777178 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="342.5" cy="62" class="shape stroke-B1 fill-B6 s0" rx="149.5" ry="50"/></g><text x="342.5" y="59.5" class="text-bold fill-N1 s1"><tspan x="342.5" dy="0">두 실행 흐름이</tspan><tspan x="342.5" dy="18.5">같은 것을 건드린다</tspan></text></g><g ><g class="shape"><path d="M87 283h271v162H87z" class="stroke-B1 fill-B6 s0"/></g><text x="222.5" y="321.5" class="text-bold fill-N1 s1"><tspan x="222.5" dy="0">가장 좋은 답 —</tspan><tspan x="222.5" dy="16.714">공유하지 않는다</tspan><tspan x="222.5" dy="16.714">각자의 사본을 갖거나 ·</tspan><tspan x="222.5" dy="16.714">값을 바꾸지 않거나(불변) ·</tspan><tspan x="222.5" dy="16.714">한 흐름만 그 자료를</tspan><tspan x="222.5" dy="16.714">맡게 하거나</tspan><tspan x="222.5" dy="16.714">(메시지로 주고받기)</tspan></text></g><g ><g class="shape"><path d="M378 347h168v66H378z" class="stroke-B1 fill-B6 s0"/></g><text x="462" y="385.5" class="text-bold fill-N1 s1">읽기만 하는가</text></g><g ><g class="shape"><path d="M261 632h212v98H261z" class="stroke-B1 fill-B6 s0"/></g><text x="367" y="670.5" class="text-bold fill-N1 s1"><tspan x="367" dy="0">아무것도 필요 없다</tspan><tspan x="367" dy="17.667">아무도 쓰지 않으면</tspan><tspan x="367" dy="17.667">경쟁 상태가 없다</tspan></text></g><g ><g class="shape"><path d="M493 658h209v66H493z" class="stroke-B1 fill-B6 s0"/></g><text x="597.5" y="696.5" class="text-bold fill-N1 s1">무엇을 기다리는가</text></g><g ><g class="shape"><path d="M12 1033h237v130H12z" class="stroke-B1 fill-B6 s0"/></g><text x="130.5" y="1071.5" class="text-bold fill-N1 s1"><tspan x="130.5" dy="0">뮤텍스 — 자리 하나</tspan><tspan x="130.5" dy="17">‘지금은 내가 쓴다’ 를</tspan><tspan x="130.5" dy="17">표시한다</tspan><tspan x="130.5" dy="17">잠근 스레드만</tspan><tspan x="130.5" dy="17">풀 수 있다</tspan></text></g><g ><g class="shape"><path d="M643 1038h235v130H643z" class="stroke-B1 fill-B6 s0"/></g><text x="760.5" y="1076.5" class="text-bold fill-N1 s1"><tspan x="760.5" dy="0">세마포어 — 자리 n 개</tspan><tspan x="760.5" dy="17">개수를 센다.</tspan><tspan x="760.5" dy="17">자원 풀과 신호 보내기</tspan><tspan x="760.5" dy="17">잠근 쪽과 푸는 쪽이</tspan><tspan x="760.5" dy="17">달라도 된다</tspan></text></g><g ><g class="shape"><path d="M269 1017h255v162H269z" class="stroke-B1 fill-B6 s0"/></g><text x="396.5" y="1055.5" class="text-bold fill-N1 s1"><tspan x="396.5" dy="0">모니터 — 락과</tspan><tspan x="396.5" dy="16.714">조건 변수를 한 묶음으로</tspan><tspan x="396.5" dy="16.714">‘들어가서,</tspan><tspan x="396.5" dy="16.714">조건이 안 맞으면</tspan><tspan x="396.5" dy="16.714">락을 놓고 잔다’</tspan><tspan x="396.5" dy="16.714">생산자-소비자의</tspan><tspan x="396.5" dy="16.714">기본 모양</tspan></text></g><g ><g class="shape"><path d="M536 1259h212v114H536z" class="stroke-B1 fill-B6 s0"/></g><text x="642" y="1297.5" class="text-bold fill-N1 s1"><tspan x="642" dy="0">독자-작가 락</tspan><tspan x="642" dy="17.25">읽는 사람은</tspan><tspan x="642" dy="17.25">여럿이 동시에</tspan><tspan x="642" dy="17.25">쓰는 사람은 혼자서</tspan></text></g><g ><g class="shape"><path d="M768 1259h255v130H768z" class="stroke-B1 fill-B6 s0"/></g><text x="895.5" y="1297.5" class="text-bold fill-N1 s1"><tspan x="895.5" dy="0">원자적 연산 · CAS</tspan><tspan x="895.5" dy="17">한 변수를 세는 정도라면</tspan><tspan x="895.5" dy="17">락이 필요 없다</tspan><tspan x="895.5" dy="17">경쟁이 심하면</tspan><tspan x="895.5" dy="17">오히려 느려진다</tspan></text></g><text x="327.5" y="1275" class="fill-N1 s1"><tspan x="327.5" dy="0">락을 둘 이상 잡게 되면</tspan><tspan x="327.5" dy="17.25">잠그는 순서를 하나로 정해 둔다.</tspan><tspan x="327.5" dy="17.25">그것 하나로 순환 대기가 사라지고,</tspan><tspan x="327.5" dy="17.25">그러면 교착이 생길 수 없다</tspan></text><text x="517.5" y="1425" class="fill-N1 s1"><tspan x="517.5" dy="0">임계 구역은 짧을수록 좋지만 너무 짧으면 틀린다.</tspan><tspan x="517.5" dy="17.25">‘검사와 그 결과에 따른 행동’ 은</tspan><tspan x="517.5" dy="17.25">반드시 한 임계 구역 안에 함께 있어야 한다</tspan><tspan x="517.5" dy="17.25">— 그러지 않으면 TOCTOU 다</tspan></text><marker id="mk-d2-337777178-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="m223.003 94 .242 185" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><text x="223" y="193" class="text-italic fill-N2 s1">나눌 수 있는가</text><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="m462.998 94-.244 249" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><text x="462.5" y="225" class="text-italic fill-N2 s1">나눌 수 없다</text><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="M434.75 415v213" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><text x="434.5" y="520" class="text-italic fill-N2 s1"><tspan x="434.5" dy="0">쓰는 쪽이</tspan><tspan x="434.5" dy="18.5">아예 없다</tspan></text><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="M490.75 415v60s0 10 10 10h87.166s10 0 10 10v160" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><text x="595.5" y="483" class="text-italic fill-N2 s1"><tspan x="595.5" dy="0">쓰는 쪽이</tspan><tspan x="595.5" dy="18.5">있다</tspan></text><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="M528.25 727v33s0 10-10 10H140.5s-10 0-10 10v249" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><text x="220" y="768" class="text-italic fill-N2 s1"><tspan x="220" dy="0">짧은 구간의</tspan><tspan x="220" dy="18.5">배타적 접근</tspan></text><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="M632.75 727v83s0 10 10 10h108.083s10 0 10 10v204" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><text x="758.5" y="818" class="text-italic fill-N2 s1"><tspan x="758.5" dy="0">정해진 개수의</tspan><tspan x="758.5" dy="18.5">자원</tspan></text><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="M563.083 727v83s0 10-10 10H406.5s-10 0-10 10v183" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><text x="428.5" y="818" class="text-italic fill-N2 s1"><tspan x="428.5" dy="0">‘조건이 맞을 때까지’ 를</tspan><tspan x="428.5" dy="18.5">기다린다</tspan></text><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="M597.916 727v133.042c0 19.916-19.916 0-19.916 19.916V1255" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><text x="578" y="980" class="text-italic fill-N2 s1"><tspan x="578" dy="0">읽기가</tspan><tspan x="578" dy="18.5">압도적으로 많다</tspan></text><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="M667.583 727v33s0 10 10 10h262.75s10 0 10 10v475" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><text x="950.5" y="848" class="text-italic fill-N2 s1"><tspan x="950.5" dy="0">변수 하나를</tspan><tspan x="950.5" dy="18.5">세거나 바꾼다</tspan></text><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="M130.5 1165v44s0 10 10 10h129.083s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><path fill="none" marker-end="url(#mk-d2-337777178-3488378134)" d="M376.583 1181v74" class="connection stroke-B1 s0" mask="url(#d2-337777178)"/><mask id="d2-337777178" width="1213" height="1668" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1213v1668H-89z"/><path d="M160 177h126v21H160zM409 209h107v21H409zM392 504h85v37h-85zM553 467h85v37h-85zM168 752h104v37H168zM697 802h123v37H697zM325 802h207v37H325zM507 964h142v37H507zM889 832h123v37H889z"/></mask></svg>