<svg xmlns="http://www.w3.org/2000/svg" width="2207" height="1142" class="d2-3181341063 d2-svg" viewBox="-101 -101 2207 1142"><rect width="2207" height="1142" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3181341063 .fill-N1{fill:#0a0f25}.d2-3181341063 .fill-N2{fill:#676c7e}.d2-3181341063 .fill-B6{fill:#f7f8fe}.d2-3181341063 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="583.5" cy="81" class="shape stroke-B1 fill-B6 s0" rx="242.5" ry="81"/></g><text x="583.5" y="86.5" class="text-bold fill-N1 s1">두 실행 흐름이 같은 것을 건드린다</text></g><g ><g class="shape"><path d="M137 283h499v98H137z" class="stroke-B1 fill-B6 s0"/></g><text x="386.5" y="321.5" class="text-bold fill-N1 s1"><tspan x="386.5" dy="0">가장 좋은 답 — 공유하지 않는다</tspan><tspan x="386.5" dy="17.667">각자의 사본을 갖거나 · 값을 바꾸지 않거나(불변) ·</tspan><tspan x="386.5" dy="17.667">한 흐름만 그 자료를 맡게 하거나(메시지로 주고받기)</tspan></text></g><g ><g class="shape"><path d="M749 299h168v66H749z" class="stroke-B1 fill-B6 s0"/></g><text x="833" y="337.5" class="text-bold fill-N1 s1">읽기만 하는가</text></g><g ><g class="shape"><path d="M479 502h363v82H479z" class="stroke-B1 fill-B6 s0"/></g><text x="660.5" y="540.5" class="text-bold fill-N1 s1"><tspan x="660.5" dy="0">아무것도 필요 없다</tspan><tspan x="660.5" dy="18.5">아무도 쓰지 않으면 경쟁 상태가 없다</tspan></text></g><g ><g class="shape"><path d="M902 510h209v66H902z" class="stroke-B1 fill-B6 s0"/></g><text x="1006.5" y="548.5" class="text-bold fill-N1 s1">무엇을 기다리는가</text></g><g ><g class="shape"><path d="M0 705h321v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="160.5" y="743.5" class="text-bold fill-N1 s1"><tspan x="160.5" dy="0">뮤텍스 — 자리 하나</tspan><tspan x="160.5" dy="17.667">‘지금은 내가 쓴다’ 를 표시한다</tspan><tspan x="160.5" dy="17.667">잠근 스레드만 풀 수 있다</tspan></text></g><g ><g class="shape"><path d="M381 705h348v98H381z" class="stroke-B1 fill-B6 s0"/></g><text x="555" y="743.5" class="text-bold fill-N1 s1"><tspan x="555" dy="0">세마포어 — 자리 n 개</tspan><tspan x="555" dy="17.667">개수를 센다. 자원 풀과 신호 보내기</tspan><tspan x="555" dy="17.667">잠근 쪽과 푸는 쪽이 달라도 된다</tspan></text></g><g ><g class="shape"><path d="M789 705h434v98H789z" class="stroke-B1 fill-B6 s0"/></g><text x="1006" y="743.5" class="text-bold fill-N1 s1"><tspan x="1006" dy="0">모니터 — 락과 조건 변수를 한 묶음으로</tspan><tspan x="1006" dy="17.667">‘들어가서, 조건이 안 맞으면 락을 놓고 잔다’</tspan><tspan x="1006" dy="17.667">생산자-소비자의 기본 모양</tspan></text></g><g ><g class="shape"><path d="M1283 705h276v98h-276z" class="stroke-B1 fill-B6 s0"/></g><text x="1421" y="743.5" class="text-bold fill-N1 s1"><tspan x="1421" dy="0">독자-작가 락</tspan><tspan x="1421" dy="17.667">읽는 사람은 여럿이 동시에</tspan><tspan x="1421" dy="17.667">쓰는 사람은 혼자서</tspan></text></g><g ><g class="shape"><path d="M1619 705h386v98h-386z" class="stroke-B1 fill-B6 s0"/></g><text x="1812" y="743.5" class="text-bold fill-N1 s1"><tspan x="1812" dy="0">원자적 연산 · CAS</tspan><tspan x="1812" dy="17.667">한 변수를 세는 정도라면 락이 필요 없다</tspan><tspan x="1812" dy="17.667">경쟁이 심하면 오히려 느려진다</tspan></text></g><text x="588.5" y="919" class="fill-N1 s1"><tspan x="588.5" dy="0">락을 둘 이상 잡게 되면 잠그는 순서를 하나로 정해 둔다.</tspan><tspan x="588.5" dy="18.5">그것 하나로 순환 대기가 사라지고, 그러면 교착이 생길 수 없다</tspan></text><text x="1312.5" y="79" class="fill-N1 s1"><tspan x="1312.5" dy="0">임계 구역은 짧을수록 좋지만 너무 짧으면 틀린다.</tspan><tspan x="1312.5" dy="18.5">‘검사와 그 결과에 따른 행동’ 은 반드시 한 임계 구역 안에 함께 있어야 한다 — 그러지 않으면 TOCTOU 다</tspan></text><marker id="mk-d2-3181341063-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M478.387 155.182C405.2 208.8 386.5 234.7 386.5 279.5" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><text x="410" y="211" class="text-italic fill-N2 s1">나눌 수 있는가</text><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M708.74 151.987C807.8 208.2 833 237.9 833 295.5" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><text x="801.5" y="210" class="text-italic fill-N2 s1">나눌 수 없다</text><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M779.313 365.574C684.2 426.1 660 453.7 660 498.5" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><text x="697" y="424" class="text-italic fill-N2 s1">쓰는 쪽이 아예 없다</text><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M886.687 365.574C981.8 426.1 1006 455.3 1006 506.5" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><text x="973" y="426" class="text-italic fill-N2 s1">쓰는 쪽이 있다</text><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M899.514 555.782C308.7 626.708 160.5 656.7 160.5 701.5" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><text x="506" y="609" class="text-italic fill-N2 s1">짧은 구간의 배타적 접근</text><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M899.549 566.957C624.3 628.903 555 656.7 555 701.5" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><text x="702.5" y="617" class="text-italic fill-N2 s1">정해진 개수의 자원</text><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M1006 577.5v124" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><text x="1006.5" y="646" class="text-italic fill-N2 s1">‘조건이 맞을 때까지’ 를 기다린다</text><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M1113.442 569.035C1359.1 629.31 1421 656.7 1421 701.5" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><text x="1291.5" y="618" class="text-italic fill-N2 s1">읽기가 압도적으로 많다</text><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M1113.484 556.41C1671.9 626.83 1812 656.7 1812 701.5" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><text x="1487" y="609" class="text-italic fill-N2 s1">변수 하나를 세거나 바꾼다</text><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M160.5 805c0 38 62.4 58 308.05 97.367" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><path fill="none" marker-end="url(#mk-d2-3181341063-3488378134)" d="M1006 805c0 38-61 58-301.053 97.353" class="connection stroke-B1 s0" mask="url(#d2-3181341063)"/><mask id="d2-3181341063" width="2207" height="1142" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2207v1142H-101z"/><path d="M347 195h126v21H347zM748 194h107v21H748zM613 408h168v21H613zM910 410h126v21H910zM403 593h206v21H403zM620 601h165v21H620zM863 630h287v21H863zM1190 602h203v21h-203z"/><path d="M1374 593h226v21h-226z"/></mask></svg>