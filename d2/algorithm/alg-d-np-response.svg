<svg xmlns="http://www.w3.org/2000/svg" width="1723" height="1162" class="d2-3134988630 d2-svg" viewBox="-101 -101 1723 1162"><rect width="1723" height="1162" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3134988630 .fill-N1{fill:#0a0f25}.d2-3134988630 .fill-N2{fill:#676c7e}.d2-3134988630 .fill-B6{fill:#f7f8fe}.d2-3134988630 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="395" cy="71" class="shape stroke-B1 fill-B6 s0" rx="213" ry="71"/></g><text x="395" y="76.5" class="text-bold fill-N1 s1">이 문제가 NP-완전임을 알았다</text></g><g ><g class="shape"><path d="M215 242h360v82H215z" class="stroke-B1 fill-B6 s0"/></g><text x="395" y="280.5" class="text-bold fill-N1 s1"><tspan x="395" dy="0">정말 그 문제가 맞는가</tspan><tspan x="395" dy="18.5">입력에 특별한 구조가 있지는 않은가</tspan></text></g><g ><g class="shape"><path d="M0 445h394v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="197" y="483.5" class="text-bold fill-N1 s1"><tspan x="197" dy="0">특수한 경우는 다항 시간일 수 있다</tspan><tspan x="197" dy="17.667">이분 그래프의 정점 덮개 · 트리 위의 문제</tspan><tspan x="197" dy="17.667">2SAT · DAG 최장 경로 (9장)</tspan></text></g><g ><g class="shape"><path d="M454 461h276v66H454z" class="stroke-B1 fill-B6 s0"/></g><text x="592" y="499.5" class="text-bold fill-N1 s1">입력이 실제로 얼마나 큰가</text></g><g ><g class="shape"><path d="M309 664h260v98H309z" class="stroke-B1 fill-B6 s0"/></g><text x="439" y="702.5" class="text-bold fill-N1 s1"><tspan x="439" dy="0">그냥 다 훑는다</tspan><tspan x="439" dy="17.667">가지치기 · 분기 한정으로</tspan><tspan x="439" dy="17.667">실제 탐색량을 줄인다</tspan></text></g><g ><g class="shape"><path d="M629 680h232v66H629z" class="stroke-B1 fill-B6 s0"/></g><text x="745" y="718.5" class="text-bold fill-N1 s1">무엇을 포기할 것인가</text></g><g ><g class="shape"><path d="M68 862h399v98H68z" class="stroke-B1 fill-B6 s0"/></g><text x="267.5" y="900.5" class="text-bold fill-N1 s1"><tspan x="267.5" dy="0">① 정확함을 포기한다 — 근사 알고리즘</tspan><tspan x="267.5" dy="17.667">최적의 몇 배 안이라는 보장을 증명한다</tspan><tspan x="267.5" dy="17.667">정점 덮개 2-근사 · 삼각부등식 TSP 1.5-근사</tspan></text></g><g ><g class="shape"><path d="M527 862h437v98H527z" class="stroke-B1 fill-B6 s0"/></g><text x="745.5" y="900.5" class="text-bold fill-N1 s1"><tspan x="745.5" dy="0">② 보장을 포기한다 — 휴리스틱</tspan><tspan x="745.5" dy="17.667">대개 잘 되지만 보장은 없다</tspan><tspan x="745.5" dy="17.667">지역 탐색 · 담금질 · 유전 알고리즘 · SAT 해결기</tspan></text></g><g ><g class="shape"><path d="M1024 862h407v98h-407z" class="stroke-B1 fill-B6 s0"/></g><text x="1227.5" y="900.5" class="text-bold fill-N1 s1"><tspan x="1227.5" dy="0">③ 일반성을 포기한다 — 매개변수화</tspan><tspan x="1227.5" dy="17.667">어려움을 작은 값 k 에 몰아넣는다</tspan><tspan x="1227.5" dy="17.667">비용이 f(k) · n 꼴이면 k 가 작을 때 쓸 만하다</tspan></text></g><text x="860.5" y="53" class="fill-N1 s1"><tspan x="860.5" dy="0">무엇을 고르는가:</tspan><tspan x="860.5" dy="17.25">최악을 보장해야 하면 ①,</tspan><tspan x="860.5" dy="17.25">평균이 좋으면 되는 실무라면 ②,</tspan><tspan x="860.5" dy="17.25">어려움의 원인이 작은 값 하나에 몰려 있으면 ③</tspan></text><text x="1317" y="61" class="fill-N1 s1"><tspan x="1317" dy="0">근사가 늘 가능한 것은 아니다.</tspan><tspan x="1317" dy="17.667">일반 TSP 는 어떤 상수 배 안으로도 근사할 수 없다</tspan><tspan x="1317" dy="17.667">(할 수 있다면 P = NP 가 된다)</tspan></text><marker id="mk-d2-3134988630-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3134988630-3488378134)" d="M394.98 144c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-3134988630)"/><path fill="none" marker-end="url(#mk-d2-3134988630-3488378134)" d="M313.223 324.418C220.6 372.3 197 396.7 197 441.5" class="connection stroke-B1 s0" mask="url(#d2-3134988630)"/><text x="231" y="372" class="text-italic fill-N2 s1">구조가 있다</text><path fill="none" marker-end="url(#mk-d2-3134988630-3488378134)" d="M475.777 324.418C568.4 372.3 592 399.9 592 457.5" class="connection stroke-B1 s0" mask="url(#d2-3134988630)"/><text x="565" y="376" class="text-italic fill-N2 s1">일반적인 경우다</text><path fill="none" marker-end="url(#mk-d2-3134988630-3488378134)" d="M544.377 527.668C460.4 588.1 439 615.7 439 660.5" class="connection stroke-B1 s0" mask="url(#d2-3134988630)"/><text x="469" y="587" class="text-italic fill-N2 s1">작다 (수십 개)</text><path fill="none" marker-end="url(#mk-d2-3134988630-3488378134)" d="M639.623 527.668C723.6 588.1 745 618.9 745 676.5" class="connection stroke-B1 s0" mask="url(#d2-3134988630)"/><text x="721.5" y="592" class="text-italic fill-N2 s1">크다</text><path fill="none" marker-end="url(#mk-d2-3134988630-3488378134)" d="M627.042 737.406C339.4 797 267 822 267 858" class="connection stroke-B1 s0" mask="url(#d2-3134988630)"/><path fill="none" marker-end="url(#mk-d2-3134988630-3488378134)" d="M745 748v110" class="connection stroke-B1 s0" mask="url(#d2-3134988630)"/><path fill="none" marker-end="url(#mk-d2-3134988630-3488378134)" d="M862.96 737.401C1153.8 797 1227 822 1227 858" class="connection stroke-B1 s0" mask="url(#d2-3134988630)"/><mask id="d2-3134988630" width="1723" height="1162" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1723v1162H-101z"/><path d="M179 356h104v21H179zM494 360h142v21H494zM411 571h116v21H411zM700 576h43v21h-43z"/></mask></svg>