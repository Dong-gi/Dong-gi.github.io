<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="1650" class="d2-510923564 d2-svg" viewBox="-89 -89 1075 1650"><rect width="1075" height="1650" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-510923564 .text-bold{font-weight:700}.d2-510923564 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-510923564 .fill-N1{fill:#0a0f25}.d2-510923564 .fill-N2{fill:#676c7e}.d2-510923564 .fill-B6{fill:#f7f8fe}.d2-510923564 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="242" cy="62.5" class="shape stroke-B1 fill-B6 s0" rx="151" ry="50.5"/></g><text x="242" y="60" class="text-bold fill-N1 s1"><tspan x="242" dy="0">이 문제가</tspan><tspan x="242" dy="18.5">NP-완전임을 알았다</tspan></text></g><g ><g class="shape"><path d="M124 183h235v98H124z" class="stroke-B1 fill-B6 s0"/></g><text x="241.5" y="221.5" class="text-bold fill-N1 s1"><tspan x="241.5" dy="0">정말 그 문제가 맞는가</tspan><tspan x="241.5" dy="17.667">입력에 특별한 구조가</tspan><tspan x="241.5" dy="17.667">있지는 않은가</tspan></text></g><g ><g class="shape"><path d="M12 452h264v146H12z" class="stroke-B1 fill-B6 s0"/></g><text x="144" y="490.5" class="text-bold fill-N1 s1"><tspan x="144" dy="0">특수한 경우는</tspan><tspan x="144" dy="16.833">다항 시간일 수 있다</tspan><tspan x="144" dy="16.833">이분 그래프의 정점 덮개 ·</tspan><tspan x="144" dy="16.833">트리 위의 문제</tspan><tspan x="144" dy="16.833">2SAT · DAG 최장 경로</tspan><tspan x="144" dy="16.833">(12장)</tspan></text></g><g ><g class="shape"><path d="M296 505h276v66H296z" class="stroke-B1 fill-B6 s0"/></g><text x="434" y="543.5" class="text-bold fill-N1 s1">입력이 실제로 얼마나 큰가</text></g><g ><g class="shape"><path d="M218 769h260v98H218z" class="stroke-B1 fill-B6 s0"/></g><text x="348" y="807.5" class="text-bold fill-N1 s1"><tspan x="348" dy="0">그냥 다 훑는다</tspan><tspan x="348" dy="17.667">가지치기 · 분기 한정으로</tspan><tspan x="348" dy="17.667">실제 탐색량을 줄인다</tspan></text></g><g ><g class="shape"><path d="M498 793h232v66H498z" class="stroke-B1 fill-B6 s0"/></g><text x="614" y="831.5" class="text-bold fill-N1 s1">무엇을 포기할 것인가</text></g><g ><g class="shape"><path d="M145 997h246v146H145z" class="stroke-B1 fill-B6 s0"/></g><text x="268" y="1035.5" class="text-bold fill-N1 s1"><tspan x="268" dy="0">① 정확함을 포기한다 —</tspan><tspan x="268" dy="16.833">근사 알고리즘</tspan><tspan x="268" dy="16.833">최적의 몇 배 안이라는</tspan><tspan x="268" dy="16.833">보장을 증명한다</tspan><tspan x="268" dy="16.833">정점 덮개 2-근사 ·</tspan><tspan x="268" dy="16.833">삼각부등식 TSP 1.5-근사</tspan></text></g><g ><g class="shape"><path d="M411 997h217v162H411z" class="stroke-B1 fill-B6 s0"/></g><text x="519.5" y="1035.5" class="text-bold fill-N1 s1"><tspan x="519.5" dy="0">② 보장을 포기한다 —</tspan><tspan x="519.5" dy="16.714">휴리스틱</tspan><tspan x="519.5" dy="16.714">대개 잘 되지만</tspan><tspan x="519.5" dy="16.714">보장은 없다</tspan><tspan x="519.5" dy="16.714">지역 탐색 · 담금질 ·</tspan><tspan x="519.5" dy="16.714">유전 알고리즘 ·</tspan><tspan x="519.5" dy="16.714">SAT 해결기</tspan></text></g><g ><g class="shape"><path d="M648 997h237v146H648z" class="stroke-B1 fill-B6 s0"/></g><text x="766.5" y="1035.5" class="text-bold fill-N1 s1"><tspan x="766.5" dy="0">③ 일반성을 포기한다 —</tspan><tspan x="766.5" dy="16.833">매개변수화</tspan><tspan x="766.5" dy="16.833">어려움을 작은 값 k 에</tspan><tspan x="766.5" dy="16.833">몰아넣는다</tspan><tspan x="766.5" dy="16.833">비용이 f(k) · n 꼴이면</tspan><tspan x="766.5" dy="16.833">k 가 작을 때 쓸 만하다</tspan></text></g><g ><g class="shape"><path fill="transparent" d="M184 1179h528v282H184z" class="stroke-B1"/></g></g><text x="436.5" y="1255" class="fill-N1 s1"><tspan x="436.5" dy="0">무엇을 고르는가:</tspan><tspan x="436.5" dy="17.25">최악을 보장해야 하면 ①,</tspan><tspan x="436.5" dy="17.25">평균이 좋으면 되는 실무라면 ②,</tspan><tspan x="436.5" dy="17.25">어려움의 원인이 작은 값 하나에 몰려 있으면 ③</tspan></text><text x="448" y="1364" class="fill-N1 s1"><tspan x="448" dy="0">근사가 늘 가능한 것은 아니다.</tspan><tspan x="448" dy="17.667">일반 TSP 는 어떤 상수 배 안으로도 근사할 수 없다</tspan><tspan x="448" dy="17.667">(할 수 있다면 P = NP 가 된다)</tspan></text><marker id="mk-d2-510923564-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-510923564-3488378134)" d="M242 115v64" class="connection stroke-B1 s0" mask="url(#d2-510923564)"/><path fill="none" marker-end="url(#mk-d2-510923564-3488378134)" d="M144 283v165" class="connection stroke-B1 s0" mask="url(#d2-510923564)"/><text x="144" y="372" class="text-italic fill-N2 s1">구조가 있다</text><path fill="none" marker-end="url(#mk-d2-510923564-3488378134)" d="M281.416 283v28s0 10 10 10H424s10 0 10 10v170" class="connection stroke-B1 s0" mask="url(#d2-510923564)"/><text x="430" y="327" class="text-italic fill-N2 s1">일반적인 경우다</text><path fill="none" marker-end="url(#mk-d2-510923564-3488378134)" d="M348.75 573v192" class="connection stroke-B1 s0" mask="url(#d2-510923564)"/><text x="349" y="676" class="text-italic fill-N2 s1">작다 (수십 개)</text><path fill="none" marker-end="url(#mk-d2-510923564-3488378134)" d="M480 573v55s0 10 10 10h114.75s10 0 10 10v141" class="connection stroke-B1 s0" mask="url(#d2-510923564)"/><text x="591.5" y="644" class="text-italic fill-N2 s1">크다</text><path fill="none" marker-end="url(#mk-d2-510923564-3488378134)" d="M556.75 861v36s0 10-10 10h-268s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-510923564)"/><path fill="none" marker-end="url(#mk-d2-510923564-3488378134)" d="M614.75 861v86s0 10-10 10h-74.5s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-510923564)"/><path fill="none" marker-end="url(#mk-d2-510923564-3488378134)" d="M672.75 861v132" class="connection stroke-B1 s0" mask="url(#d2-510923564)"/><mask id="d2-510923564" width="1075" height="1650" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H986v1650H-89z"/><path d="M92 356h104v21H92zM359 311h142v21H359zM291 660h116v21H291zM570 628h43v21h-43z"/></mask></svg>