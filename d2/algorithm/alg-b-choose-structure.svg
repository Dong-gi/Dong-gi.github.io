<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="858" class="d2-506471989 d2-svg" viewBox="-101 -101 1792 858"><rect width="1792" height="858" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-506471989 .fill-N1{fill:#0a0f25}.d2-506471989 .fill-N2{fill:#676c7e}.d2-506471989 .fill-B6{fill:#f7f8fe}.d2-506471989 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="268" cy="396" class="shape stroke-B1 fill-B6 s0" rx="150" ry="50"/></g><text x="268" y="401.5" class="text-bold fill-N1 s1">무엇을 자주 하는가</text></g><g ><g class="shape"><path d="M716 50h212v82H716z" class="stroke-B1 fill-B6 s0"/></g><text x="822" y="88.5" class="text-bold fill-N1 s1"><tspan x="822" dy="0">번호로 아무 자리나</tspan><tspan x="822" dy="18.5">곧바로 읽는다</tspan></text></g><g ><g class="shape"><path d="M738 284h168v82H738z" class="stroke-B1 fill-B6 s0"/></g><text x="822" y="322.5" class="text-bold fill-N1 s1"><tspan x="822" dy="0">한쪽 끝에서만</tspan><tspan x="822" dy="18.5">넣고 뺀다</tspan></text></g><g ><g class="shape"><path d="M748 426h148v82H748z" class="stroke-B1 fill-B6 s0"/></g><text x="822" y="464.5" class="text-bold fill-N1 s1"><tspan x="822" dy="0">양쪽 끝에서</tspan><tspan x="822" dy="18.5">넣고 뺀다</tspan></text></g><g ><g class="shape"><path d="M738 568h168v82H738z" class="stroke-B1 fill-B6 s0"/></g><text x="822" y="606.5" class="text-bold fill-N1 s1"><tspan x="822" dy="0">가운데를 자주</tspan><tspan x="822" dy="18.5">끼우고 지운다</tspan></text></g><g ><g class="shape"><path d="M1273 0h294v82h-294z" class="stroke-B1 fill-B6 s0"/></g><text x="1420" y="38.5" class="text-bold fill-N1 s1"><tspan x="1420" dy="0">배열</tspan><tspan x="1420" dy="18.5">읽기 O(1), 캐시에 가장 친하다</tspan></text></g><g ><g class="shape"><path d="M1251 142h338v82h-338z" class="stroke-B1 fill-B6 s0"/></g><text x="1420" y="180.5" class="text-bold fill-N1 s1"><tspan x="1420" dy="0">동적 배열</tspan><tspan x="1420" dy="18.5">크기를 모를 때. 넣기 분할상환 O(1)</tspan></text></g><g ><g class="shape"><path d="M1250 284h340v82h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="1420" y="322.5" class="text-bold fill-N1 s1"><tspan x="1420" dy="0">스택 또는 큐</tspan><tspan x="1420" dy="18.5">쓰는 끝을 하나로 약속한 것뿐이다</tspan></text></g><g ><g class="shape"><path d="M1250 426h340v82h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="1420" y="464.5" class="text-bold fill-N1 s1"><tspan x="1420" dy="0">원형 버퍼 또는 덱</tspan><tspan x="1420" dy="18.5">두 표시를 나머지 연산으로 돌린다</tspan></text></g><g ><g class="shape"><path d="M1297 568h246v82h-246z" class="stroke-B1 fill-B6 s0"/></g><text x="1420" y="606.5" class="text-bold fill-N1 s1"><tspan x="1420" dy="0">이중 연결 리스트</tspan><tspan x="1420" dy="18.5">자리를 알고 있으면 O(1)</tspan></text></g><text x="267.5" y="522" class="fill-N1 s1"><tspan x="267.5" dy="0">가운데 삽입이 O(1) 이라는 말에 속기 쉽다.</tspan><tspan x="267.5" dy="17.667">그 자리를 찾아가는 데 O(n) 이 든다.</tspan><tspan x="267.5" dy="17.667">첨자로 찾아 지우는 일이 섞이면 배열이 대개 더 빠르다</tspan></text><text x="267.5" y="635" class="fill-N1 s1"><tspan x="267.5" dy="0">고민이 되면 동적 배열이 기본값이다.</tspan><tspan x="267.5" dy="18.5">대부분의 언어에서 기본 목록 자료형이 그것인 데는 이유가 있다</tspan></text><marker id="mk-d2-506471989-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-506471989-3488378134)" d="M323.523 347.704C564.8 142.399 643.7 90.75 712.5 90.75" class="connection stroke-B1 s0" mask="url(#d2-506471989)"/><path fill="none" marker-end="url(#mk-d2-506471989-3488378134)" d="M398.96 370.605C579.8 334.2 648.1 325 734.5 325" class="connection stroke-B1 s0" mask="url(#d2-506471989)"/><path fill="none" marker-end="url(#mk-d2-506471989-3488378134)" d="M398.96 421.395C579.8 457.8 650.1 467 744.5 467" class="connection stroke-B1 s0" mask="url(#d2-506471989)"/><path fill="none" marker-end="url(#mk-d2-506471989-3488378134)" d="M342.72 441.021C568.6 575.2 648.1 609 734.5 609" class="connection stroke-B1 s0" mask="url(#d2-506471989)"/><path fill="none" marker-end="url(#mk-d2-506471989-3488378134)" d="M929.966 70.634C1056.8 47 1125.8 41 1269 41" class="connection stroke-B1 s0" mask="url(#d2-506471989)"/><text x="1099.5" y="49" class="text-italic fill-N2 s1">크기를 미리 안다</text><path fill="none" marker-end="url(#mk-d2-506471989-3488378134)" d="M929.889 127.657C1056.8 171.8 1121.4 183 1247 183" class="connection stroke-B1 s0" mask="url(#d2-506471989)"/><text x="1085.5" y="182" class="text-italic fill-N2 s1">크기가 변한다</text><path fill="none" marker-end="url(#mk-d2-506471989-3488378134)" d="M908 325h338" class="connection stroke-B1 s0" mask="url(#d2-506471989)"/><path fill="none" marker-end="url(#mk-d2-506471989-3488378134)" d="M898 467h348" class="connection stroke-B1 s0" mask="url(#d2-506471989)"/><path fill="none" marker-end="url(#mk-d2-506471989-3488378134)" d="M908 609h385" class="connection stroke-B1 s0" mask="url(#d2-506471989)"/><mask id="d2-506471989" width="1792" height="858" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1792v858H-101z"/><path d="M1027 33h145v21h-145zM1024 166h123v21h-123z"/></mask></svg>