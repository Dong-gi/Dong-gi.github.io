<svg xmlns="http://www.w3.org/2000/svg" width="1155" height="1233" class="d2-2462310944 d2-svg" viewBox="-101 -101 1155 1233"><rect width="1155" height="1233" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2462310944 .text-bold{font-weight:700}.d2-2462310944 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2462310944 .fill-N1{fill:#0a0f25}.d2-2462310944 .fill-N2{fill:#676c7e}.d2-2462310944 .fill-B6{fill:#f7f8fe}.d2-2462310944 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="103" cy="444" class="shape stroke-B1 fill-B6 s0" rx="103" ry="40"/></g><text x="103" y="441.5" class="text-bold fill-N1 s1"><tspan x="103" dy="0">무엇을</tspan><tspan x="103" dy="18.5">자주 하는가</tspan></text></g><g ><g class="shape"><path d="M327 87h212v82H327z" class="stroke-B1 fill-B6 s0"/></g><text x="433" y="125.5" class="text-bold fill-N1 s1"><tspan x="433" dy="0">번호로 아무 자리나</tspan><tspan x="433" dy="18.5">곧바로 읽는다</tspan></text></g><g ><g class="shape"><path d="M349 324h168v82H349z" class="stroke-B1 fill-B6 s0"/></g><text x="433" y="362.5" class="text-bold fill-N1 s1"><tspan x="433" dy="0">한쪽 끝에서만</tspan><tspan x="433" dy="18.5">넣고 뺀다</tspan></text></g><g ><g class="shape"><path d="M359 482h148v82H359z" class="stroke-B1 fill-B6 s0"/></g><text x="433" y="520.5" class="text-bold fill-N1 s1"><tspan x="433" dy="0">양쪽 끝에서</tspan><tspan x="433" dy="18.5">넣고 뺀다</tspan></text></g><g ><g class="shape"><path d="M349 640h168v82H349z" class="stroke-B1 fill-B6 s0"/></g><text x="433" y="678.5" class="text-bold fill-N1 s1"><tspan x="433" dy="0">가운데를 자주</tspan><tspan x="433" dy="18.5">끼우고 지운다</tspan></text></g><g ><g class="shape"><path d="M741 0h212v98H741z" class="stroke-B1 fill-B6 s0"/></g><text x="847" y="38.5" class="text-bold fill-N1 s1"><tspan x="847" dy="0">배열</tspan><tspan x="847" dy="17.667">읽기 O(1),</tspan><tspan x="847" dy="17.667">캐시에 가장 친하다</tspan></text></g><g ><g class="shape"><path d="M746 158h202v98H746z" class="stroke-B1 fill-B6 s0"/></g><text x="847" y="196.5" class="text-bold fill-N1 s1"><tspan x="847" dy="0">동적 배열</tspan><tspan x="847" dy="17.667">크기를 모를 때.</tspan><tspan x="847" dy="17.667">넣기 분할상환 O(1)</tspan></text></g><g ><g class="shape"><path d="M752 316h191v98H752z" class="stroke-B1 fill-B6 s0"/></g><text x="847.5" y="354.5" class="text-bold fill-N1 s1"><tspan x="847.5" dy="0">스택 또는 큐</tspan><tspan x="847.5" dy="17.667">쓰는 끝을 하나로</tspan><tspan x="847.5" dy="17.667">약속한 것뿐이다</tspan></text></g><g ><g class="shape"><path d="M750 474h195v98H750z" class="stroke-B1 fill-B6 s0"/></g><text x="847.5" y="512.5" class="text-bold fill-N1 s1"><tspan x="847.5" dy="0">원형 버퍼 또는 덱</tspan><tspan x="847.5" dy="17.667">두 표시를 나머지</tspan><tspan x="847.5" dy="17.667">연산으로 돌린다</tspan></text></g><g ><g class="shape"><path d="M741 632h212v98H741z" class="stroke-B1 fill-B6 s0"/></g><text x="847" y="670.5" class="text-bold fill-N1 s1"><tspan x="847" dy="0">이중 연결 리스트</tspan><tspan x="847" dy="17.667">자리를 알고 있으면</tspan><tspan x="847" dy="17.667">O(1)</tspan></text></g><g ><g class="shape"><path fill="transparent" d="M244 750h465v282H244z" class="stroke-B1"/></g></g><text x="476.5" y="826" class="fill-N1 s1"><tspan x="476.5" dy="0">가운데 삽입이 O(1) 이라는 말에 속기 쉽다.</tspan><tspan x="476.5" dy="17.25">그 자리를 찾아가는 데 O(n) 이 든다.</tspan><tspan x="476.5" dy="17.25">첨자로 찾아 지우는 일이 섞이면</tspan><tspan x="476.5" dy="17.25">배열이 대개 더 빠르다</tspan></text><text x="467" y="935" class="fill-N1 s1"><tspan x="467" dy="0">고민이 되면 동적 배열이 기본값이다.</tspan><tspan x="467" dy="17.667">대부분의 언어에서 기본 목록 자료형이</tspan><tspan x="467" dy="17.667">그것인 데는 이유가 있다</tspan></text><marker id="mk-d2-2462310944-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2462310944-3488378134)" d="M123.92 403.224C237.8 183.4 278.7 128 323.5 128" class="connection stroke-B1 s0" mask="url(#d2-2462310944)"/><path fill="none" marker-end="url(#mk-d2-2462310944-3488378134)" d="M168.801 412.131C246.6 374.6 283.1 365 345.5 365" class="connection stroke-B1 s0" mask="url(#d2-2462310944)"/><path fill="none" marker-end="url(#mk-d2-2462310944-3488378134)" d="M168.801 475.869C246.6 513.4 285.1 523 355.5 523" class="connection stroke-B1 s0" mask="url(#d2-2462310944)"/><path fill="none" marker-end="url(#mk-d2-2462310944-3488378134)" d="M131.135 484.647C239.2 641.4 283.1 681 345.5 681" class="connection stroke-B1 s0" mask="url(#d2-2462310944)"/><path fill="none" marker-end="url(#mk-d2-2462310944-3488378134)" d="M540.866 87.28C619.8 56.8 660.2 49 737 49" class="connection stroke-B1 s0" mask="url(#d2-2462310944)"/><text x="637.5" y="51" class="text-italic fill-N2 s1"><tspan x="637.5" dy="0">크기를</tspan><tspan x="637.5" dy="18.5">미리 안다</tspan></text><path fill="none" marker-end="url(#mk-d2-2462310944-3488378134)" d="M540.866 168.72C619.8 199.2 661.2 207 742 207" class="connection stroke-B1 s0" mask="url(#d2-2462310944)"/><text x="640" y="200" class="text-italic fill-N2 s1"><tspan x="640" dy="0">크기가</tspan><tspan x="640" dy="18.5">변한다</tspan></text><path fill="none" marker-end="url(#mk-d2-2462310944-3488378134)" d="M519 365h228.5" class="connection stroke-B1 s0" mask="url(#d2-2462310944)"/><path fill="none" marker-end="url(#mk-d2-2462310944-3488378134)" d="M509 523h236.5" class="connection stroke-B1 s0" mask="url(#d2-2462310944)"/><path fill="none" marker-end="url(#mk-d2-2462310944-3488378134)" d="M519 681h218" class="connection stroke-B1 s0" mask="url(#d2-2462310944)"/><mask id="d2-2462310944" width="1155" height="1233" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1155v1233H-101z"/><path d="M595 35h85v37h-85zM609 184h62v37h-62z"/></mask></svg>