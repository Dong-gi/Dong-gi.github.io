<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="1671" class="d2-2049724666 d2-svg" viewBox="-101 -101 1410 1671"><rect width="1410" height="1671" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2049724666 .fill-N1{fill:#0a0f25}.d2-2049724666 .fill-N2{fill:#676c7e}.d2-2049724666 .fill-B6{fill:#f7f8fe}.d2-2049724666 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="315" cy="45" class="shape stroke-B1 fill-B6 s0" rx="135" ry="45"/></g><text x="315" y="50.5" class="text-bold fill-N1 s1">정렬할 것이 있다</text></g><g ><g class="shape"><path d="M188 190h255v66H188z" class="stroke-B1 fill-B6 s0"/></g><text x="315.5" y="228.5" class="text-bold fill-N1 s1">원소가 수십 개 이하인가</text></g><g ><g class="shape"><path d="M0 377h296v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="148" y="415.5" class="text-bold fill-N1 s1"><tspan x="148" dy="0">삽입 정렬</tspan><tspan x="148" dy="18.5">상수가 작고 제자리이며 안정</tspan></text></g><g ><g class="shape"><path d="M356 377h252v82H356z" class="stroke-B1 fill-B6 s0"/></g><text x="482" y="415.5" class="text-bold fill-N1 s1"><tspan x="482" dy="0">키가 정수이고</tspan><tspan x="482" dy="18.5">범위나 자릿수를 아는가</tspan></text></g><g ><g class="shape"><path d="M148 580h305v98H148z" class="stroke-B1 fill-B6 s0"/></g><text x="300.5" y="618.5" class="text-bold fill-N1 s1"><tspan x="300.5" dy="0">계수 · 기수 · 버킷 정렬</tspan><tspan x="300.5" dy="17.667">견주지 않으므로 n log n 벽 아래</tspan><tspan x="300.5" dy="17.667">대가: 보조 배열과 키 제약</tspan></text></g><g ><g class="shape"><path d="M513 588h302v82H513z" class="stroke-B1 fill-B6 s0"/></g><text x="664" y="626.5" class="text-bold fill-N1 s1"><tspan x="664" dy="0">비교 정렬이어야 한다</tspan><tspan x="664" dy="18.5">여기서부터는 n log n 이 벽이다</tspan></text></g><g ><g class="shape"><path d="M523 778h281v82H523z" class="stroke-B1 fill-B6 s0"/></g><text x="663.5" y="816.5" class="text-bold fill-N1 s1"><tspan x="663.5" dy="0">안정성이 필요한가</tspan><tspan x="663.5" dy="18.5">(두 단계 정렬 · 부수 키 보존)</tspan></text></g><g ><g class="shape"><path d="M399 981h230v66H399z" class="stroke-B1 fill-B6 s0"/></g><text x="514" y="1019.5" class="text-bold fill-N1 s1">n 칸을 더 쓸 수 있는가</text></g><g ><g class="shape"><path d="M305 1168h340v82H305z" class="stroke-B1 fill-B6 s0"/></g><text x="475" y="1206.5" class="text-bold fill-N1 s1"><tspan x="475" dy="0">병합 정렬 · 팀소트</tspan><tspan x="475" dy="18.5">외부 정렬과 연결 리스트에도 이것</tspan></text></g><g ><g class="shape"><path d="M705 1168h296v82H705z" class="stroke-B1 fill-B6 s0"/></g><text x="853" y="1206.5" class="text-bold fill-N1 s1"><tspan x="853" dy="0">최악 시간을 보장해야 하는가</tspan><tspan x="853" dy="18.5">(응답 상한 · 악의적 입력)</tspan></text></g><g ><g class="shape"><path d="M528 1371h280v98H528z" class="stroke-B1 fill-B6 s0"/></g><text x="668" y="1409.5" class="text-bold fill-N1 s1"><tspan x="668" dy="0">힙 정렬</tspan><tspan x="668" dy="17.667">제자리 + 최악 O(n log n)</tspan><tspan x="668" dy="17.667">대가: 캐시 지역성이 나쁘다</tspan></text></g><g ><g class="shape"><path d="M868 1379h340v82H868z" class="stroke-B1 fill-B6 s0"/></g><text x="1038" y="1417.5" class="text-bold fill-N1 s1"><tspan x="1038" dy="0">인트로소트 (퀵 + 삽입 + 힙)</tspan><tspan x="1038" dy="18.5">평균이 가장 빠르고 최악도 막는다</tspan></text></g><text x="668.5" y="27" class="fill-N1 s1"><tspan x="668.5" dy="0">정렬하기 전에 물을 것:</tspan><tspan x="668.5" dy="17.25">정말 전부 정렬해야 하는가.</tspan><tspan x="668.5" dy="17.25">k 번째 값 하나면 quickselect 로 O(n),</tspan><tspan x="668.5" dy="17.25">상위 k 개면 크기 k 짜리 힙으로 O(n log k)</tspan></text><marker id="mk-d2-2049724666-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2049724666-3488378134)" d="M315 92v94" class="connection stroke-B1 s0" mask="url(#d2-204