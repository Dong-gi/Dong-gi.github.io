<svg xmlns="http://www.w3.org/2000/svg" width="1156" height="1921" class="d2-1987568842 d2-svg" viewBox="-89 -89 1156 1921"><rect width="1156" height="1921" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1987568842 .text-bold{font-weight:700}.d2-1987568842 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1987568842 .fill-N1{fill:#0a0f25}.d2-1987568842 .fill-N2{fill:#676c7e}.d2-1987568842 .fill-B6{fill:#f7f8fe}.d2-1987568842 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="226" cy="57" class="shape stroke-B1 fill-B6 s0" rx="135" ry="45"/></g><text x="226" y="62.5" class="text-bold fill-N1 s1">정렬할 것이 있다</text></g><g ><g class="shape"><path d="M98 172h255v66H98z" class="stroke-B1 fill-B6 s0"/></g><text x="225.5" y="210.5" class="text-bold fill-N1 s1">원소가 수십 개 이하인가</text></g><g ><g class="shape"><path d="M12 409h188v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="106" y="447.5" class="text-bold fill-N1 s1"><tspan x="106" dy="0">삽입 정렬</tspan><tspan x="106" dy="17.667">상수가 작고</tspan><tspan x="106" dy="17.667">제자리이며 안정</tspan></text></g><g ><g class="shape"><path d="M220 419h252v82H220z" class="stroke-B1 fill-B6 s0"/></g><text x="346" y="457.5" class="text-bold fill-N1 s1"><tspan x="346" dy="0">키가 정수이고</tspan><tspan x="346" dy="18.5">범위나 자릿수를 아는가</tspan></text></g><g ><g class="shape"><path d="M87 694h231v130H87z" class="stroke-B1 fill-B6 s0"/></g><text x="202.5" y="732.5" class="text-bold fill-N1 s1"><tspan x="202.5" dy="0">계수 · 기수 · 버킷 정렬</tspan><tspan x="202.5" dy="17">견주지 않으므로</tspan><tspan x="202.5" dy="17">n log n 벽 아래</tspan><tspan x="202.5" dy="17">대가: 보조 배열과</tspan><tspan x="202.5" dy="17">키 제약</tspan></text></g><g ><g class="shape"><path d="M338 718h302v82H338z" class="stroke-B1 fill-B6 s0"/></g><text x="489" y="756.5" class="text-bold fill-N1 s1"><tspan x="489" dy="0">비교 정렬이어야 한다</tspan><tspan x="489" dy="18.5">여기서부터는 n log n 이 벽이다</tspan></text></g><g ><g class="shape"><path d="M348 894h281v82H348z" class="stroke-B1 fill-B6 s0"/></g><text x="488.5" y="932.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">안정성이 필요한가</tspan><tspan x="488.5" dy="18.5">(두 단계 정렬 · 부수 키 보존)</tspan></text></g><g ><g class="shape"><path d="M134 1157h230v66H134z" class="stroke-B1 fill-B6 s0"/></g><text x="249" y="1195.5" class="text-bold fill-N1 s1">n 칸을 더 쓸 수 있는가</text></g><g ><g class="shape"><path d="M34 1416h188v130H34z" class="stroke-B1 fill-B6 s0"/></g><text x="128" y="1454.5" class="text-bold fill-N1 s1"><tspan x="128" dy="0">병합 정렬 ·</tspan><tspan x="128" dy="17">팀소트</tspan><tspan x="128" dy="17">외부 정렬과</tspan><tspan x="128" dy="17">연결 리스트에도</tspan><tspan x="128" dy="17">이것</tspan></text></g><g ><g class="shape"><path d="M242 1416h255v226H242z" class="stroke-B1 fill-B6 s0"/></g><text x="369.5" y="1454.5" class="text-bold fill-N1 s1"><tspan x="369.5" dy="0">삽입 정렬 ·</tspan><tspan x="369.5" dy="16.455">위치 번호 붙이기</tspan><tspan x="369.5" dy="16.455">거의 정렬돼 있으면</tspan><tspan x="369.5" dy="16.455">삽입 정렬로 충분하다</tspan><tspan x="369.5" dy="16.455">아니면 키가 같을 때</tspan><tspan x="369.5" dy="16.455">원래 위치로 견주게 하면</tspan><tspan x="369.5" dy="16.455">힙 정렬 · 인트로소트도</tspan><tspan x="369.5" dy="16.455">안정이 된다</tspan><tspan x="369.5" dy="16.455">대가: 위치 번호 n 개</tspan><tspan x="369.5" dy="16.455">(원소 n 칸보다는</tspan><tspan x="369.5" dy="16.455">대개 작다)</tspan></text></g><g ><g class="shape"><path d="M595 1147h296v82H595z" class="stroke-B1 fill-B6 s0"/></g><text x="743" y="1185.5" class="text-bold fill-N1 s1"><tspan x="743" dy="0">최악 시간을 보장해야 하는가</tspan><tspan x="743" dy="18.5">(응답 상한 · 악의적 입력)</tspan></text></g><g ><g class="shape"><path d="M517 1416h217v130H517z" class="stroke-B1 fill-B6 s0"/></g><text x="625.5" y="1454.5" class="text-bold fill-N1 s1"><tspan x="625.5" dy="0">힙 정렬</tspan><tspan x="625.5" dy="17">제자리 +</tspan><tspan x="625.5" dy="17">최악 O(n log n)</tspan><tspan x="625.5" dy="17">대가: 캐시 지역성이</tspan><tspan x="625.5" dy="17">나쁘다</tspan></text></g><g ><g class="shape"><path d="M754 1416h212v114H754z" class="stroke-B1 fill-B6 s0"/></g><text x="860" y="1454.5" class="text-bold fill-N1 s1"><tspan x="860" dy="0">인트로소트</tspan><tspan x="860" dy="17.25">(퀵 + 삽입 + 힙)</tspan><tspan x="860" dy="17.25">평균이 가장 빠르고</tspan><tspan x="860" dy="17.25">최악도 막는다</tspan></text></g><text x="488.5" y="1678" class="fill-N1 s1"><tspan x="488.5" dy="0">정렬하기 전에 물을 것:</tspan><tspan x="488.5" dy="17.25">정말 전부 정렬해야 하는가.</tspan><tspan x="488.5" dy="17.25">k 번째 값 하나면 quickselect 로 O(n),</tspan><tspan x="488.5" dy="17.25">상위 k 개면 크기 k 짜리 힙으로 O(n log k)</tspan></text><marker id="mk-d2-1987568842-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M226 104v64" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M183.5 240v28s0 10-10 10H116s-10 0-10 10v117" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><text x="106" y="290" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M268.5 240v176" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><text x="269" y="335" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M304 504v33s0 10-10 10h-81.25s-10 0-10 10v133" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><text x="203" y="545" class="text-italic fill-N2 s1"><tspan x="203" dy="0">그렇다 ·</tspan><tspan x="203" dy="18.5">메모리도 넉넉하다</tspan></text><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M388 504v210" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><text x="388" y="616" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M489.25 802v88" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M442.416 978v28s0 10-10 10H259.5s-10 0-10 10v128" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><text x="294.5" y="1022" class="text-italic fill-N2 s1">필요하다</text><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M211.166 1226v33s0 10-10 10H138.75s-10 0-10 10v133" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><text x="129" y="1284" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M287.833 1226v186" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><text x="288" y="1326" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M536.083 978v28s0 10 10 10H733.5s10 0 10 10v117" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><text x="685.5" y="1022" class="text-italic fill-N2 s1">필요 없다</text><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M626.25 1231v181" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><text x="626" y="1320" class="text-italic fill-N2 s1"><tspan x="626" dy="0">그렇다 ·</tspan><tspan x="626" dy="18.5">메모리도 빠듯하다</tspan></text><path fill="none" marker-end="url(#mk-d2-1987568842-3488378134)" d="M860.75 1231v181" class="connection stroke-B1 s0" mask="url(#d2-1987568842)"/><text x="861" y="1320" class="text-italic fill-N2 s1"><tspan x="861" dy="0">평균 속도가</tspan><tspan x="861" dy="18.5">우선이다</tspan></text><mask id="d2-1987568842" width="1156" height="1921" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1156v1921H-89z"/><path d="M75 274h62v21H75zM238 319h62v21h-62zM122 529h162v37H122zM357 600h62v21h-62zM254 1006h81v21h-81zM98 1268h62v21H98zM257 1310h62v21h-62zM643 1006h85v21h-85zM545 1304h