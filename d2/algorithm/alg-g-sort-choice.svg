<svg xmlns="http://www.w3.org/2000/svg" width="1793" height="1516" class="d2-772799663 d2-svg" viewBox="-101 -101 1793 1516"><rect width="1793" height="1516" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-772799663 .text-bold{font-weight:700}.d2-772799663 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-772799663 .fill-N1{fill:#0a0f25}.d2-772799663 .fill-N2{fill:#676c7e}.d2-772799663 .fill-B6{fill:#f7f8fe}.d2-772799663 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="447" cy="45" class="shape stroke-B1 fill-B6 s0" rx="135" ry="45"/></g><text x="447" y="50.5" class="text-bold fill-N1 s1">정렬할 것이 있다</text></g><g ><g class="shape"><path d="M319 190h255v66H319z" class="stroke-B1 fill-B6 s0"/></g><text x="446.5" y="228.5" class="text-bold fill-N1 s1">원소가 수십 개 이하인가</text></g><g ><g class="shape"><path d="M132 377h296v82H132z" class="stroke-B1 fill-B6 s0"/></g><text x="280" y="415.5" class="text-bold fill-N1 s1"><tspan x="280" dy="0">삽입 정렬</tspan><tspan x="280" dy="18.5">상수가 작고 제자리이며 안정</tspan></text></g><g ><g class="shape"><path d="M488 377h252v82H488z" class="stroke-B1 fill-B6 s0"/></g><text x="614" y="415.5" class="text-bold fill-N1 s1"><tspan x="614" dy="0">키가 정수이고</tspan><tspan x="614" dy="18.5">범위나 자릿수를 아는가</tspan></text></g><g ><g class="shape"><path d="M280 580h305v98H280z" class="stroke-B1 fill-B6 s0"/></g><text x="432.5" y="618.5" class="text-bold fill-N1 s1"><tspan x="432.5" dy="0">계수 · 기수 · 버킷 정렬</tspan><tspan x="432.5" dy="17.667">견주지 않으므로 n log n 벽 아래</tspan><tspan x="432.5" dy="17.667">대가: 보조 배열과 키 제약</tspan></text></g><g ><g class="shape"><path d="M645 588h302v82H645z" class="stroke-B1 fill-B6 s0"/></g><text x="796" y="626.5" class="text-bold fill-N1 s1"><tspan x="796" dy="0">비교 정렬이어야 한다</tspan><tspan x="796" dy="18.5">여기서부터는 n log n 이 벽이다</tspan></text></g><g ><g class="shape"><path d="M655 778h281v82H655z" class="stroke-B1 fill-B6 s0"/></g><text x="795.5" y="816.5" class="text-bold fill-N1 s1"><tspan x="795.5" dy="0">안정성이 필요한가</tspan><tspan x="795.5" dy="18.5">(두 단계 정렬 · 부수 키 보존)</tspan></text></g><g ><g class="shape"><path d="M283 989h230v66H283z" class="stroke-B1 fill-B6 s0"/></g><text x="398" y="1027.5" class="text-bold fill-N1 s1">n 칸을 더 쓸 수 있는가</text></g><g ><g class="shape"><path d="M0 1208h340v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="170" y="1246.5" class="text-bold fill-N1 s1"><tspan x="170" dy="0">병합 정렬 · 팀소트</tspan><tspan x="170" dy="18.5">외부 정렬과 연결 리스트에도 이것</tspan></text></g><g ><g class="shape"><path d="M400 1184h451v130H400z" class="stroke-B1 fill-B6 s0"/></g><text x="625.5" y="1222.5" class="text-bold fill-N1 s1"><tspan x="625.5" dy="0">삽입 정렬 · 위치 번호 붙이기</tspan><tspan x="625.5" dy="17">거의 정렬돼 있으면 삽입 정렬로 충분하다</tspan><tspan x="625.5" dy="17">아니면 키가 같을 때 원래 위치로 견주게 하면</tspan><tspan x="625.5" dy="17">힙 정렬 · 인트로소트도 안정이 된다</tspan><tspan x="625.5" dy="17">대가: 위치 번호 n 개 (원소 n 칸보다는 대개 작다)</tspan></text></g><g ><g class="shape"><path d="M1088 981h296v82h-296z" class="stroke-B1 fill-B6 s0"/></g><text x="1236" y="1019.5" class="text-bold fill-N1 s1"><tspan x="1236" dy="0">최악 시간을 보장해야 하는가</tspan><tspan x="1236" dy="18.5">(응답 상한 · 악의적 입력)</tspan></text></g><g ><g class="shape"><path d="M911 1200h280v98H911z" class="stroke-B1 fill-B6 s0"/></g><text x="1051" y="1238.5" class="text-bold fill-N1 s1"><tspan x="1051" dy="0">힙 정렬</tspan><tspan x="1051" dy="17.667">제자리 + 최악 O(n log n)</tspan><tspan x="1051" dy="17.667">대가: 캐시 지역성이 나쁘다</tspan></text></g><g ><g class="shape"><path d="M1251 1208h340v82h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="1421" y="1246.5" class="text-bold fill-N1 s1"><tspan x="1421" dy="0">인트로소트 (퀵 + 삽입 + 힙)</tspan><tspan x="1421" dy="18.5">평균이 가장 빠르고 최악도 막는다</tspan></text></g><text x="800.5" y="27" class="fill-N1 s1"><tspan x="800.5" dy="0">정렬하기 전에 물을 것:</tspan><tspan x="800.5" dy="17.25">정말 전부 정렬해야 하는가.</tspan><tspan x="800.5" dy="17.25">k 번째 값 하나면 quickselect 로 O(n),</tspan><tspan x="800.5" dy="17.25">상위 k 개면 크기 k 짜리 힙으로 O(n log k)</tspan></text><marker id="mk-d2-772799663-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M446.99 92c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M386.009 256.484C301.35 304.3 279.75 328.7 279.75 373.5" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><text x="309" y="305" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M507.491 256.484C592.15 304.3 613.75 328.7 613.75 373.5" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><text x="584" y="305" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M538.259 459.484C453.6 507.3 432 531.7 432 576.5" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><text x="461" y="508" class="text-italic fill-N2 s1">그렇다 · 메모리도 넉넉하다</text><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M689.241 459.484C773.9 507.3 795.5 533.3 795.5 584.5" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><text x="769" y="510" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M795.5 672v102" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M652.813 854.997C449.15 907.3 397.75 934.3 397.75 985.5" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><text x="497.5" y="900" class="text-italic fill-N2 s1">필요하다</text><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M322.175 1055.318C200.8 1109.7 170 1140.5 170 1204.5" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><text x="211" y="1110" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M473.325 1055.318C594.7 1109.7 625.5 1135.7 625.5 1180.5" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><text x="574" y="1106" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M937.95 851.948C1176 906.7 1236 932.7 1236 977.5" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><text x="1111.5" y="897" class="text-italic fill-N2 s1">필요 없다</text><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M1159.25 1063.47C1073 1111.3 1051 1138.9 1051 1196.5" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><text x="1075" y="1116" class="text-italic fill-N2 s1">그렇다 · 메모리도 빠듯하다</text><path fill="none" marker-end="url(#mk-d2-772799663-3488378134)" d="M1312.75 1063.47C1399 1111.3 1421 1140.5 1421 1204.5" class="connection stroke-B1 s0" mask="url(#d2-772799663)"/><text x="1400" y="1118" class="text-italic fill-N2 s1">평균 속도가 우선이다</text><mask id="d2-772799663" width="1793" height="1516" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1793v1516H-101z"/><path d="M278 289h62v21h-62zM553 289h62v21h-62zM346 492h230v21H346zM738 494h62v21h-62zM457 884h81v21h-81zM180 1094h62v21h-62zM543 1090h62v21h-62zM1069 881h85v21h-85zM960 1100h230v21H960zM1308 1102h184v21h-184z"/></mask></svg>