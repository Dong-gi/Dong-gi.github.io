047.394c95.811 47.906 137.811 72.306 204.924 118.827" class="connection stroke-B1 s0" mask="url(#d2-2049724666)"/><text x="689" y="1107" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-2049724666-3488378134)" d="M776 1250.47c-86.25 47.83-108.25 72.23-108.25 117.03" class="connection stroke-B1 s0" mask="url(#d2-2049724666)"/><text x="698" y="1299" class="text-italic fill-N2 s1">그렇다 · 메모리도 빠듯하다</text><path fill="none" marker-end="url(#mk-d2-2049724666-3488378134)" d="M929.5 1250.47c86.25 47.83 108.25 73.83 108.25 125.03" class="connection stroke-B1 s0" mask="url(#d2-2049724666)"/><text x="1011" y="1301" class="text-italic fill-N2 s1">평균 속도가 우선이다</text><mask id="d2-2049724666" width="1410" height="1671" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1410v1671H-101z"/><path d="M146 289h62v21h-62zM422 289h62v21h-62zM215 492h230v21H215zM607 494h62v21h-62zM494 896h81v21h-81zM447 1095h62v21h-62zM835 968h85v21h-85zM658 1091h62v21h-62zM583 1283h230v21H583zM919 1285h184v21H919z"/></mask></svg>