<svg xmlns="http://www.w3.org/2000/svg" width="1721" height="1556" class="d2-3950093491 d2-svg" viewBox="-101 -101 1721 1556"><rect width="1721" height="1556" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3950093491 .fill-N1{fill:#0a0f25}.d2-3950093491 .fill-N2{fill:#676c7e}.d2-3950093491 .fill-B6{fill:#f7f8fe}.d2-3950093491 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="435" cy="101.5" class="shape stroke-B1 fill-B6 s0" rx="304" ry="101.5"/></g><text x="435" y="107" class="text-bold fill-N1 s1">매번 지금 가장 좋아 보이는 것을 고르고 싶다</text></g><g ><g class="shape"><path d="M177 303h516v66H177z" class="stroke-B1 fill-B6 s0"/></g><text x="435" y="341.5" class="text-bold fill-N1 s1">무엇이 ‘좋아 보이는가’ 를 한 문장으로 적을 수 있는가</text></g><g ><g class="shape"><path d="M287 469h296v82H287z" class="stroke-B1 fill-B6 s0"/></g><text x="435" y="507.5" class="text-bold fill-N1 s1"><tspan x="435" dy="0">작은 반례를 손으로 찾아본다</tspan><tspan x="435" dy="18.5">원소 서너 개짜리로 충분하다</tspan></text></g><g ><g class="shape"><path d="M2 672h419v82H2z" class="stroke-B1 fill-B6 s0"/></g><text x="211.5" y="710.5" class="text-bold fill-N1 s1"><tspan x="211.5" dy="0">반례가 나왔다</tspan><tspan x="211.5" dy="18.5">거스름돈 {1,4,6} 으로 8원 — 탐욕 3개, 최적 2개</tspan></text></g><g ><g class="shape"><path d="M0 870h610v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="305" y="908.5" class="text-bold fill-N1 s1"><tspan x="305" dy="0">기준을 바꿔 다시 시도한다</tspan><tspan x="305" dy="18.5">활동 선택: ‘짧은 것부터’ 는 틀리고 ‘일찍 끝나는 것부터’ 는 맞다</tspan></text></g><g ><g class="shape"><path d="M104 1173h403v98H104z" class="stroke-B1 fill-B6 s0"/></g><text x="305.5" y="1211.5" class="text-bold fill-N1 s1"><tspan x="305.5" dy="0">동적 계획법으로 넘어간다 (12장)</tspan><tspan x="305.5" dy="17.667">되돌아볼 수 없는 것이 탐욕의 한계이므로</tspan><tspan x="305.5" dy="17.667">모든 선택을 견주는 표를 세운다</tspan></text></g><g ><g class="shape"><path d="M858 680h212v66H858z" class="stroke-B1 fill-B6 s0"/></g><text x="964" y="718.5" class="text-bold fill-N1 s1">두 가지를 증명한다</text></g><g ><g class="shape"><path d="M793 854h343v114H793z" class="stroke-B1 fill-B6 s0"/></g><text x="964.5" y="892.5" class="text-bold fill-N1 s1"><tspan x="964.5" dy="0">탐욕 선택 성질</tspan><tspan x="964.5" dy="17.25">첫 선택을 탐욕대로 해도</tspan><tspan x="964.5" dy="17.25">어떤 최적해에 그 선택이 들어 있다</tspan><tspan x="964.5" dy="17.25">— 바꿔치기 논법으로 보인다</tspan></text></g><g ><g class="shape"><path d="M1196 862h323v98h-323z" class="stroke-B1 fill-B6 s0"/></g><text x="1357.5" y="900.5" class="text-bold fill-N1 s1"><tspan x="1357.5" dy="0">최적 부분구조</tspan><tspan x="1357.5" dy="17.667">첫 선택을 떼어 낸 나머지 문제의</tspan><tspan x="1357.5" dy="17.667">최적해가 전체 최적해의 일부다</tspan></text></g><g ><g class="shape"><ellipse cx="964.5" cy="1221.5" class="shape stroke-B1 fill-B6 s0" rx="397.5" ry="132.5"/></g><text x="964.5" y="1211" class="text-bold fill-N1 s1"><tspan x="964.5" dy="0">탐욕이 옳다</tspan><tspan x="964.5" dy="17.667">활동 선택 · 분할 가능 배낭 · 허프만</tspan><tspan x="964.5" dy="17.667">크루스칼 · 프림 (9장의 자르기 성질이 곧 탐욕 선택 성질이다)</tspan></text></g><text x="960.5" y="91" class="fill-N1 s1"><tspan x="960.5" dy="0">탐욕의 이점은 값이다.</tspan><tspan x="960.5" dy="17.667">표를 세우지 않으므로 공간이 O(1) 이고,</tspan><tspan x="960.5" dy="17.667">대개 정렬 한 번 값인 O(n log n) 에 끝난다</tspan></text><text x="1350.5" y="91" class="fill-N1 s1"><tspan x="1350.5" dy="0">‘돌려 보니 맞더라’ 는 증명이 아니다.</tspan><tspan x="1350.5" dy="17.667">반례는 대개 아주 작은 입력에 숨어 있고,</tspan><tspan x="1350.5" dy="17.667">큰 무작위 입력으로는 영영 안 나온다</tspan></text><marker id="mk-d2-3950093491-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M434.98 205c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M434.5 371v94" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M342.932 551.334C238.35 599.3 211.75 623.7 211.75 668.5" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><text x="253" y="598" class="text-italic fill-N2 s1">찾았다</text><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M211.75 756c0 38 11.6 61.2 55.36 110.995" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M305 953.5v215" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><text x="305" y="1068" class="text-italic fill-N2 s1">어떤 기준으로도 반례가 남는다</text><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M585.464 538.747C887.9 596.874 964 625.3 964 676.5" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><text x="803" y="586" class="text-italic fill-N2 s1">아무리 해도 반례가 없다</text><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M964 748v102" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M1071.95 738.448C1299.6 790.8 1357 815.6 1357 858" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M964 969.5V1085" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M1357 961.5c0 53.2-33.6 83.7-164.418 148.72" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><path fill="none" marker-end="url(#mk-d2-3950093491-3488378134)" d="M389.542 869.111C494.15 817.2 520.75 785.8 520.75 758.5s-10.2-159.2-48.434-204.931" class="connection stroke-B1 s0" mask="url(#d2-3950093491)"/><text x="520.5" y="746" class="text-italic fill-N2 s1">기준을 바꿨다</text><mask id="d2-3950093491" width="1721" height="1556" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1721v1556H-101z"/><path d="M222 582h62v21h-62zM173 1052h264v21H173zM700 570h206v21H700zM459 730h123v21H459z"/></mask></svg>