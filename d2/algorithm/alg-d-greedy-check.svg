<svg xmlns="http://www.w3.org/2000/svg" width="1063" height="1867" class="d2-2968804093 d2-svg" viewBox="-89 -89 1063 1867"><rect width="1063" height="1867" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2968804093 .text-bold{font-weight:700}.d2-2968804093 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2968804093 .fill-N1{fill:#0a0f25}.d2-2968804093 .fill-N2{fill:#676c7e}.d2-2968804093 .fill-B6{fill:#f7f8fe}.d2-2968804093 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="643" cy="67" class="shape stroke-B1 fill-B6 s0" rx="165" ry="55"/></g><text x="643" y="56.5" class="text-bold fill-N1 s1"><tspan x="643" dy="0">매번 지금</tspan><tspan x="643" dy="17.667">가장 좋아 보이는 것을</tspan><tspan x="643" dy="17.667">고르고 싶다</tspan></text></g><g ><g class="shape"><path d="M503 192h279v82H503z" class="stroke-B1 fill-B6 s0"/></g><text x="642.5" y="230.5" class="text-bold fill-N1 s1"><tspan x="642.5" dy="0">무엇이 ‘좋아 보이는가’ 를</tspan><tspan x="642.5" dy="18.5">한 문장으로 적을 수 있는가</tspan></text></g><g ><g class="shape"><path d="M495 344h296v82H495z" class="stroke-B1 fill-B6 s0"/></g><text x="643" y="382.5" class="text-bold fill-N1 s1"><tspan x="643" dy="0">작은 반례를 손으로 찾아본다</tspan><tspan x="643" dy="18.5">원소 서너 개짜리로 충분하다</tspan></text></g><g ><g class="shape"><path d="M511 613h263v98H511z" class="stroke-B1 fill-B6 s0"/></g><text x="642.5" y="651.5" class="text-bold fill-N1 s1"><tspan x="642.5" dy="0">반례가 나왔다</tspan><tspan x="642.5" dy="17.667">거스름돈 {1,4,6} 으로 8원 —</tspan><tspan x="642.5" dy="17.667">탐욕 3개, 최적 2개</tspan></text></g><g ><g class="shape"><path d="M590 796h276v130H590z" class="stroke-B1 fill-B6 s0"/></g><text x="728" y="834.5" class="text-bold fill-N1 s1"><tspan x="728" dy="0">기준을 바꿔 다시 시도한다</tspan><tspan x="728" dy="17">활동 선택:</tspan><tspan x="728" dy="17">‘짧은 것부터’ 는 틀리고</tspan><tspan x="728" dy="17">‘일찍 끝나는 것부터’ 는</tspan><tspan x="728" dy="17">맞다</tspan></text></g><g ><g class="shape"><path d="M592 1246h272v146H592z" class="stroke-B1 fill-B6 s0"/></g><text x="728" y="1284.5" class="text-bold fill-N1 s1"><tspan x="728" dy="0">동적 계획법으로 넘어간다</tspan><tspan x="728" dy="16.833">(11장)</tspan><tspan x="728" dy="16.833">되돌아볼 수 없는 것이</tspan><tspan x="728" dy="16.833">탐욕의 한계이므로</tspan><tspan x="728" dy="16.833">모든 선택을 견주는</tspan><tspan x="728" dy="16.833">표를 세운다</tspan></text></g><g ><g class="shape"><path d="M170 634h212v66H170z" class="stroke-B1 fill-B6 s0"/></g><text x="276" y="672.5" class="text-bold fill-N1 s1">두 가지를 증명한다</text></g><g ><g class="shape"><path d="M12 791h255v146H12z" class="stroke-B1 fill-B6 s0"/></g><text x="139.5" y="829.5" class="text-bold fill-N1 s1"><tspan x="139.5" dy="0">탐욕 선택 성질</tspan><tspan x="139.5" dy="16.833">첫 선택을 탐욕대로 해도</tspan><tspan x="139.5" dy="16.833">어떤 최적해에</tspan><tspan x="139.5" dy="16.833">그 선택이 들어 있다</tspan><tspan x="139.5" dy="16.833">— 바꿔치기 논법으로</tspan><tspan x="139.5" dy="16.833">보인다</tspan></text></g><g ><g class="shape"><path d="M287 807h252v114H287z" class="stroke-B1 fill-B6 s0"/></g><text x="413" y="845.5" class="text-bold fill-N1 s1"><tspan x="413" dy="0">최적 부분구조</tspan><tspan x="413" dy="17.25">첫 선택을 떼어 낸</tspan><tspan x="413" dy="17.25">나머지 문제의 최적해가</tspan><tspan x="413" dy="17.25">전체 최적해의 일부다</tspan></text></g><g ><g class="shape"><ellipse cx="276" cy="1096.5" class="shape stroke-B1 fill-B6 s0" rx="239" ry="79.5"/></g><text x="276" y="1070" class="text-bold fill-N1 s1"><tspan x="276" dy="0">탐욕이 옳다</tspan><tspan x="276" dy="17">활동 선택 · 분할 가능 배낭 · 허프만</tspan><tspan x="276" dy="17">크루스칼 · 프림</tspan><tspan x="276" dy="17">(12장의 자르기 성질이 곧</tspan><tspan x="276" dy="17">탐욕 선택 성질이다)</tspan></text></g><g ><g class="shape"><path fill="transparent" d="M191 1412h496v266H191z" class="stroke-B1"/></g></g><text x="439" y="1488" class="fill-N1 s1"><tspan x="439" dy="0">탐욕의 이점은 값이다.</tspan><tspan x="439" dy="17.667">표를 세우지 않으므로 공간이 거의 들지 않고,</tspan><tspan x="439" dy="17.667">대개 정렬 한 번 값인 O(n log n) 에 끝난다</tspan></text><text x="419.5" y="1581" class="fill-N1 s1"><tspan x="419.5" dy="0">‘돌려 보니 맞더라’ 는 증명이 아니다.</tspan><tspan x="419.5" dy="17.667">반례는 대개 아주 작은 입력에 숨어 있고,</tspan><tspan x="419.5" dy="17.667">큰 무작위 입력으로는 안 나올 수도 있다</tspan></text><marker id="mk-d2-2968804093-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="M643 124v64" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="M643.083 276v64" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="M643.083 428v181" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><text x="643" y="525" class="text-italic fill-N2 s1">찾았다</text><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="M682.833 713v79" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="M728.833 928v314" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><text x="729" y="1084" class="text-italic fill-N2 s1"><tspan x="729" dy="0">어떤 기준으로도</tspan><tspan x="729" dy="18.5">반례가 남는다</tspan></text><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="M569.083 428v28s0 10-10 10H286.25s-10 0-10 10v154" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><text x="359" y="464" class="text-italic fill-N2 s1"><tspan x="359" dy="0">아무리 해도</tspan><tspan x="359" dy="18.5">반례가 없다</tspan></text><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="M240.916 702v85" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="M311.583 702v101" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="m196.593 939 .387 79" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="m355.918 923 .079 95" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><path fill="none" marker-end="url(#mk-d2-2968804093-3488378134)" d="M814.583 794V476s0-10-10-10h-77.5s-10 0-10-10v-26" class="connection stroke-B1 s0" mask="url(#d2-2968804093)"/><text x="814.5" y="568" class="text-italic fill-N2 s1">기준을 바꿨다</text><mask id="d2-2968804093" width="1063" height="1867" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H974v1867H-89z"/><path d="M612 509h62v21h-62zM658 1068h142v37H658zM307 448h104v37H307zM753 552h123v21H753z"/></mask></svg>