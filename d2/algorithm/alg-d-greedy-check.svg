<svg xmlns="http://www.w3.org/2000/svg" width="1748" height="1560" class="d2-568899650 d2-svg" viewBox="-101 -101 1748 1560"><rect width="1748" height="1560" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-568899650 .fill-N1{fill:#0a0f25}.d2-568899650 .fill-N2{fill:#676c7e}.d2-568899650 .fill-B6{fill:#f7f8fe}.d2-568899650 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="409" cy="101.5" class="shape stroke-B1 fill-B6 s0" rx="304" ry="101.5"/></g><text x="409" y="107" class="text-bold fill-N1 s1">매번 지금 가장 좋아 보이는 것을 고르고 싶다</text></g><g ><g class="shape"><path d="M151 303h516v66H151z" class="stroke-B1 fill-B6 s0"/></g><text x="409" y="341.5" class="text-bold fill-N1 s1">무엇이 ‘좋아 보이는가’ 를 한 문장으로 적을 수 있는가</text></g><g ><g class="shape"><path d="M261 469h296v82H261z" class="stroke-B1 fill-B6 s0"/></g><text x="409" y="507.5" class="text-bold fill-N1 s1"><tspan x="409" dy="0">작은 반례를 손으로 찾아본다</tspan><tspan x="409" dy="18.5">원소 서너 개짜리로 충분하다</tspan></text></g><g ><g class="shape"><path d="M0 672h419v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209.5" y="710.5" class="text-bold fill-N1 s1"><tspan x="209.5" dy="0">반례가 나왔다</tspan><tspan x="209.5" dy="18.5">거스름돈 {1,4,6} 으로 8원 — 탐욕 3개, 최적 2개</tspan></text></g><g ><g class="shape"><path d="M14 870h610v82H14z" class="stroke-B1 fill-B6 s0"/></g><text x="319" y="908.5" class="text-bold fill-N1 s1"><tspan x="319" dy="0">기준을 바꿔 다시 시도한다</tspan><tspan x="319" dy="18.5">활동 선택: ‘짧은 것부터’ 는 틀리고 ‘일찍 끝나는 것부터’ 는 맞다</tspan></text></g><g ><g class="shape"><path d="M118 1175h403v98H118z" class="stroke-B1 fill-B6 s0"/></g><text x="319.5" y="1213.5" class="text-bold fill-N1 s1"><tspan x="319.5" dy="0">동적 계획법으로 넘어간다 (11장)</tspan><tspan x="319.5" dy="17.667">되돌아볼 수 없는 것이 탐욕의 한계이므로</tspan><tspan x="319.5" dy="17.667">모든 선택을 견주는 표를 세운다</tspan></text></g><g ><g class="shape"><path d="M879 680h212v66H879z" class="stroke-B1 fill-B6 s0"/></g><text x="985" y="718.5" class="text-bold fill-N1 s1">두 가지를 증명한다</text></g><g ><g class="shape"><path d="M794 854h343v114H794z" class="stroke-B1 fill-B6 s0"/></g><text x="965.5" y="892.5" class="text-bold fill-N1 s1"><tspan x="965.5" dy="0">탐욕 선택 성질</tspan><tspan x="965.5" dy="17.25">첫 선택을 탐욕대로 해도</tspan><tspan x="965.5" dy="17.25">어떤 최적해에 그 선택이 들어 있다</tspan><tspan x="965.5" dy="17.25">— 바꿔치기 논법으로 보인다</tspan></text></g><g ><g class="shape"><path d="M1197 862h323v98h-323z" class="stroke-B1 fill-B6 s0"/></g><text x="1358.5" y="900.5" class="text-bold fill-N1 s1"><tspan x="1358.5" dy="0">최적 부분구조</tspan><tspan x="1358.5" dy="17.667">첫 선택을 떼어 낸 나머지 문제의</tspan><tspan x="1358.5" dy="17.667">최적해가 전체 최적해의 일부다</tspan></text></g><g ><g class="shape"><ellipse cx="985" cy="1223.5" class="shape stroke-B1 fill-B6 s0" rx="404" ry="134.5"/></g><text x="985" y="1213" class="text-bold fill-N1 s1"><tspan x="985" dy="0">탐욕이 옳다</tspan><tspan x="985" dy="17.667">활동 선택 · 분할 가능 배낭 · 허프만</tspan><tspan x="985" dy="17.667">크루스칼 · 프림 (12장의 자르기 성질이 곧 탐욕 선택 성질이다)</tspan></text></g><text x="961" y="91" class="fill-N1 s1"><tspan x="961" dy="0">탐욕의 이점은 값이다.</tspan><tspan x="961" dy="17.667">표를 세우지 않으므로 공간이 거의 들지 않고,</tspan><tspan x="961" dy="17.667">대개 정렬 한 번 값인 O(n log n) 에 끝난다</tspan></text><text x="1377.5" y="91" class="fill-N1 s1"><tspan x="1377.5" dy="0">‘돌려 보니 맞더라’ 는 증명이 아니다.</tspan><tspan x="1377.5" dy="17.667">반례는 대개 아주 작은 입력에 숨어 있고,</tspan><tspan x="1377.5" dy="17.667">큰 무작위 입력으로는 안 나올 수도 있다</tspan></text><marker id="mk-d2-568899650-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M409 205v94" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M409 371v94" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M326.72 551.412C233.3 599.3 209.5 623.7 209.5 668.5" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><text x="244" y="599" class="text-italic fill-N2 s1">찾았다</text><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M209.5 756c0 38 13.6 61.2 65.13 111.214" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M319 953.5v217" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><text x="319" y="1069" class="text-italic fill-N2 s1">어떤 기준으로도 반례가 남는다</text><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M558.47 536.845C898.9 596.5 984.5 625.3 984.5 676.5" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><text x="799" y="585" class="text-italic fill-N2 s1">아무리 해도 반례가 없다</text><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M976.595 747.959C967.4 792.4 965 814 965 850" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M1093.443 739.3C1304.7 790.965 1358 815.6 1358 858" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M965 969.5c0 46.8 1.2 71.099 5.605 115.52" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M1358 961.5c0 53.2-30.8 83.3-150.465 146.629" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><path fill="none" marker-end="url(#mk-d2-568899650-3488378134)" d="M397.262 869.054C493.9 817.2 518.5 785.8 518.5 758.5s-12.8-159.2-61.105-205.24" class="connection stroke-B1 s0" mask="url(#d2-568899650)"/><text x="518.5" y="738" class="text-italic fill-N2 s1">기준을 바꿨다</text><mask id="d2-568899650" width="1748" height="1560" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1748v1560H-101z"/><path d="M213 583h62v21h-62zM187 1053h264v21H187zM696 569h206v21H696zM457 722h123v21H457z"/></mask></svg>