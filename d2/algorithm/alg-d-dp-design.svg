<svg xmlns="http://www.w3.org/2000/svg" width="781" height="2041" class="d2-897235037 d2-svg" viewBox="-101 -101 781 2041"><rect width="781" height="2041" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-897235037 .fill-N1{fill:#0a0f25}.d2-897235037 .fill-B6{fill:#f7f8fe}.d2-897235037 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="299" cy="73.5" class="shape stroke-B1 fill-B6 s0" rx="208" ry="73.5"/></g><text x="299" y="47" class="text-bold fill-N1 s1"><tspan x="299" dy="0">DP 인지 알아보는 신호</tspan><tspan x="299" dy="17">· 최대 · 최소 · 개수를 묻는다</tspan><tspan x="299" dy="17">· 순서대로 결정을 내린다</tspan><tspan x="299" dy="17">· 완전 탐색을 그려 보니</tspan><tspan x="299" dy="17">같은 부분문제가 자꾸 나온다</tspan></text></g><g ><g class="shape"><path d="M93 247h412v114H93z" class="stroke-B1 fill-B6 s0"/></g><text x="299" y="285.5" class="text-bold fill-N1 s1"><tspan x="299" dy="0">1. 상태를 정한다</tspan><tspan x="299" dy="17.25">‘dp[...] 는 무엇인가’ 를 한 문장으로 적는다</tspan><tspan x="299" dy="17.25">예: dp[i][w] = 앞의 i 개만 쓰고</tspan><tspan x="299" dy="17.25">용량이 w 일 때의 최대 가치</tspan></text></g><g ><g class="shape"><path d="M143 461h313v114H143z" class="stroke-B1 fill-B6 s0"/></g><text x="299.5" y="499.5" class="text-bold fill-N1 s1"><tspan x="299.5" dy="0">2. 전이를 적는다</tspan><tspan x="299.5" dy="17.25">마지막 결정이 무엇이었는지로</tspan><tspan x="299.5" dy="17.25">경우를 나눈다</tspan><tspan x="299.5" dy="17.25">예: i 번째를 넣었나 안 넣었나</tspan></text></g><g ><g class="shape"><path d="M119 675h361v82H119z" class="stroke-B1 fill-B6 s0"/></g><text x="299.5" y="713.5" class="text-bold fill-N1 s1"><tspan x="299.5" dy="0">3. 바닥값을 정한다</tspan><tspan x="299.5" dy="18.5">dp[0] 이나 빈 문자열 자리는 무엇인가</tspan></text></g><g ><g class="shape"><path d="M123 857h352v114H123z" class="stroke-B1 fill-B6 s0"/></g><text x="299" y="895.5" class="text-bold fill-N1 s1"><tspan x="299" dy="0">4. 채우는 순서를 정한다</tspan><tspan x="299" dy="17.25">전이가 가리키는 칸이</tspan><tspan x="299" dy="17.25">먼저 채워져 있어야 한다</tspan><tspan x="299" dy="17.25">= 부분문제 DAG 의 위상 순서 (9 · 12장)</tspan></text></g><g ><g class="shape"><path d="M153 1071h293v66H153z" class="stroke-B1 fill-B6 s0"/></g><text x="299.5" y="1109.5" class="text-bold fill-N1 s1">5. 하향식과 상향식 중 고른다</text></g><g ><g class="shape"><path d="M0 1237h279v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="139.5" y="1275.5" class="text-bold fill-N1 s1"><tspan x="139.5" dy="0">메모이제이션</tspan><tspan x="139.5" dy="17.667">실제로 쓰이는 칸이 적을 때</tspan><tspan x="139.5" dy="17.667">대가: 재귀 스택</tspan></text></g><g ><g class="shape"><path d="M339 1237h240v98H339z" class="stroke-B1 fill-B6 s0"/></g><text x="459" y="1275.5" class="text-bold fill-N1 s1"><tspan x="459" dy="0">표 채우기</tspan><tspan x="459" dy="17.667">칸을 거의 다 쓸 때</tspan><tspan x="459" dy="17.667">덤: 공간 줄이기가 쉽다</tspan></text></g><g ><g class="shape"><ellipse cx="299.5" cy="1522" class="shape stroke-B1 fill-B6 s0" rx="260.5" ry="87"/></g><text x="299.5" y="1511.5" class="text-bold fill-N1 s1"><tspan x="299.5" dy="0">6. 값을 센다</tspan><tspan x="299.5" dy="17.667">시간 = 상태 수 × 한 칸을 채우는 값</tspan><tspan x="299.5" dy="17.667">공간 = 상태 수 (줄일 수 있으면 줄인다)</tspan></text></g><path fill="transparent" stroke="transparent" d="M69 1629h441v210H69z" class="shape s0"/><text x="262.5" y="1669" class="fill-N1 s1"><tspan x="262.5" dy="0">상태가 너무 많아지면</tspan><tspan x="262.5" dy="17.25">· 필요 없는 축을 지운다</tspan><tspan x="262.5" dy="17.25">· 값의 범위를 좁힌다</tspan><tspan x="262.5" dy="17.25">· 그래도 크면 근사나 휴리스틱으로 (13장)</tspan></text><text x="289.5" y="1762" class="fill-N1 s1"><tspan x="289.5" dy="0">상태를 잘못 잡는 흔한 신호:</tspan><tspan x="289.5" dy="17.25">전이를 적으려는데 ‘그 전에 무엇을 했는지’ 를</tspan><tspan x="289.5" dy="17.25">또 알아야 한다.</tspan><tspan x="289.5" dy="17.25">그 정보를 상태에 넣어야 한다는 뜻이다</tspan></text><marker id="mk-d2-897235037-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-897235037-3488378134)" d="M299.01 149c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-897235037)"/><path fill="none" marker-end="url(#mk-d2-897235037-3488378134)" d="M299.25 363v94" class="connection stroke-B1 s0" mask="url(#d2-897235037)"/><path fill="none" marker-end="url(#mk-d2-897235037-3488378134)" d="M299.25 577v94" class="connection stroke-B1 s0" mask="url(#d2-897235037)"/><path fill="none" marker-end="url(#mk-d2-897235037-3488378134)" d="M299.25 759v94" class="connection stroke-B1 s0" mask="url(#d2-897235037)"/><path fill="none" marker-end="url(#mk-d2-897235037-3488378134)" d="M299.25 973v94" class="connection stroke-B1 s0" mask="url(#d2-897235037)"/><path fill="none" marker-end="url(#mk-d2-897235037-3488378134)" d="M233.726 1137.924C158.7 1177 139.5 1197 139.5 1233" class="connection stroke-B1 s0" mask="url(#d2-897235037)"/><path fill="none" marker-end="url(#mk-d2-897235037-3488378134)" d="M364.774 1137.924C439.8 1177 459 1197 459 1233" class="connection stroke-B1 s0" mask="url(#d2-897235037)"/><path fill="none" marker-end="url(#mk-d2-897235037-3488378134)" d="M139.5 1337c0 38 12.9 59.2 61.48 101.378" class="connection stroke-B1 s0" mask="url(#d2-897235037)"/><path fill="none" marker-end="url(#mk-d2-897235037-3488378134)" d="M459 1337c0 38-13 59.2-61.97 101.39" class="connection stroke-B1 s0" mask="url(#d2-897235037)"/><mask id="d2-897235037" width="781" height="2041" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h781v2041h-781z"/></mask></svg>