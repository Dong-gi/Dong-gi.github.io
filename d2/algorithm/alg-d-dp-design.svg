<svg xmlns="http://www.w3.org/2000/svg" width="1892" height="1852" class="d2-1459470604 d2-svg" viewBox="-101 -101 1892 1852"><rect width="1892" height="1852" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1459470604 .fill-N1{fill:#0a0f25}.d2-1459470604 .fill-B6{fill:#f7f8fe}.d2-1459470604 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="353.5" cy="118" class="shape stroke-B1 fill-B6 s0" rx="353.5" ry="118"/></g><text x="353.5" y="99.5" class="text-bold fill-N1 s1"><tspan x="353.5" dy="0">DP 인지 알아보는 신호</tspan><tspan x="353.5" dy="17.25">· 최대 · 최소 · 개수를 묻는다</tspan><tspan x="353.5" dy="17.25">· 순서대로 결정을 내린다</tspan><tspan x="353.5" dy="17.25">· 완전 탐색을 그려 보니 같은 부분문제가 자꾸 나온다</tspan></text></g><g ><g class="shape"><path d="M97 336h513v98H97z" class="stroke-B1 fill-B6 s0"/></g><text x="353.5" y="374.5" class="text-bold fill-N1 s1"><tspan x="353.5" dy="0">1. 상태를 정한다</tspan><tspan x="353.5" dy="17.667">‘dp[...] 는 무엇인가’ 를 한 문장으로 적는다</tspan><tspan x="353.5" dy="17.667">예: dp[i][w] = 앞의 i 개만 쓰고 용량이 w 일 때의 최대 가치</tspan></text></g><g ><g class="shape"><path d="M133 534h441v98H133z" class="stroke-B1 fill-B6 s0"/></g><text x="353.5" y="572.5" class="text-bold fill-N1 s1"><tspan x="353.5" dy="0">2. 전이를 적는다</tspan><tspan x="353.5" dy="17.667">마지막 결정이 무엇이었는지로 경우를 나눈다</tspan><tspan x="353.5" dy="17.667">예: i 번째를 넣었나 안 넣었나</tspan></text></g><g ><g class="shape"><path d="M173 732h361v82H173z" class="stroke-B1 fill-B6 s0"/></g><text x="353.5" y="770.5" class="text-bold fill-N1 s1"><tspan x="353.5" dy="0">3. 바닥값을 정한다</tspan><tspan x="353.5" dy="18.5">dp[0] 이나 빈 문자열 자리는 무엇인가</tspan></text></g><g ><g class="shape"><path d="M130 914h447v98H130z" class="stroke-B1 fill-B6 s0"/></g><text x="353.5" y="952.5" class="text-bold fill-N1 s1"><tspan x="353.5" dy="0">4. 채우는 순서를 정한다</tspan><tspan x="353.5" dy="17.667">전이가 가리키는 칸이 먼저 채워져 있어야 한다</tspan><tspan x="353.5" dy="17.667">= 부분문제 DAG 의 위상 순서 (8 · 9장)</tspan></text></g><g ><g class="shape"><path d="M207 1112h293v66H207z" class="stroke-B1 fill-B6 s0"/></g><text x="353.5" y="1150.5" class="text-bold fill-N1 s1">5. 하향식과 상향식 중 고른다</text></g><g ><g class="shape"><path d="M54 1278h279v98H54z" class="stroke-B1 fill-B6 s0"/></g><text x="193.5" y="1316.5" class="text-bold fill-N1 s1"><tspan x="193.5" dy="0">메모이제이션</tspan><tspan x="193.5" dy="17.667">실제로 쓰이는 칸이 적을 때</tspan><tspan x="193.5" dy="17.667">대가: 재귀 스택</tspan></text></g><g ><g class="shape"><path d="M393 1278h240v98H393z" class="stroke-B1 fill-B6 s0"/></g><text x="513" y="1316.5" class="text-bold fill-N1 s1"><tspan x="513" dy="0">표 채우기</tspan><tspan x="513" dy="17.667">칸을 거의 다 쓸 때</tspan><tspan x="513" dy="17.667">덤: 공간 줄이기가 쉽다</tspan></text></g><g ><g class="shape"><ellipse cx="353.5" cy="1563" class="shape stroke-B1 fill-B6 s0" rx="260.5" ry="87"/></g><text x="353.5" y="1552.5" class="text-bold fill-N1 s1"><tspan x="353.5" dy="0">6. 값을 센다</tspan><tspan x="353.5" dy="17.667">시간 = 상태 수 × 한 칸을 채우는 값</tspan><tspan x="353.5" dy="17.667">공간 = 상태 수 (줄일 수 있으면 줄인다)</tspan></text></g><text x="936.5" y="100" class="fill-N1 s1"><tspan x="936.5" dy="0">상태가 너무 많아지면</tspan><tspan x="936.5" dy="17.25">· 필요 없는 축을 지운다</tspan><tspan x="936.5" dy="17.25">· 값의 범위를 좁힌다</tspan><tspan x="936.5" dy="17.25">· 그래도 크면 근사나 휴리스틱으로 (13장)</tspan></text><text x="1428" y="108" class="fill-N1 s1"><tspan x="1428" dy="0">상태를 잘못 잡는 흔한 신호:</tspan><tspan x="1428" dy="17.667">전이를 적으려는데 ‘그 전에 무엇을 했는지’ 를 또 알아야 한다.</tspan><tspan x="1428" dy="17.667">그 정보를 상태에 넣어야 한다는 뜻이다</tspan></text><marker id="mk-d2-1459470604-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1459470604-3488378134)" d="M353.98 238c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-1459470604)"/><path fill="none" marker-end="url(#mk-d2-1459470604-3488378134)" d="M353.5 436v94" class="connection stroke-B1 s0" mask="url(#d2-1459470604)"/><path fill="none" marker-end="url(#mk-d2-1459470604-3488378134)" d="M353.5 634v94" class="connection stroke-B1 s0" mask="url(#d2-1459470604)"/><path fill="none" marker-end="url(#mk-d2-1459470604-3488378134)" d="M353.5 816v94" class="connection stroke-B1 s0" mask="url(#d2-1459470604)"/><path fill="none" marker-end="url(#mk-d2-1459470604-3488378134)" d="M353.5 1014v94" class="connection stroke-B1 s0" mask="url(#d2-1459470604)"/><path fill="none" marker-end="url(#mk-d2-1459470604-3488378134)" d="M287.976 1178.924C212.95 1218 193.75 1238 193.75 1274" class="connection stroke-B1 s0" mask="url(#d2-1459470604)"/><path fill="none" marker-end="url(#mk-d2-1459470604-3488378134)" d="M419.024 1178.924C494.05 1218 513.25 1238 513.25 1274" class="connection stroke-B1 s0" mask="url(#d2-1459470604)"/><path fill="none" marker-end="url(#mk-d2-1459470604-3488378134)" d="M193.75 1378c0 38 13.05 59.2 62.215 101.395" class="connection stroke-B1 s0" mask="url(#d2-1459470604)"/><path fill="none" marker-end="url(#mk-d2-1459470604-3488378134)" d="M513.25 1378c0 38-13.05 59.2-62.215 101.395" class="connection stroke-B1 s0" mask="url(#d2-1459470604)"/><mask id="d2-1459470604" width="1892" height="1852" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1892v1852H-101z"/></mask></svg>