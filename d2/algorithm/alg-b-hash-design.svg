<svg xmlns="http://www.w3.org/2000/svg" width="1449" height="1557" class="d2-2318709033 d2-svg" viewBox="-89 -89 1449 1557"><rect width="1449" height="1557" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2318709033 .fill-N1{fill:#0a0f25}.d2-2318709033 .fill-N2{fill:#676c7e}.d2-2318709033 .fill-B6{fill:#f7f8fe}.d2-2318709033 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="190" cy="54" class="shape stroke-B1 fill-B6 s0" rx="88" ry="42"/></g><text x="190" y="51.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">해시 함수</tspan><tspan x="190" dy="18.5">키 → 정수</tspan></text></g><g ><g class="shape"><path d="M12 166h357v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="190.5" y="204.5" class="text-bold fill-N1 s1"><tspan x="190.5" dy="0">균등성 · 결정성 · 빠름 · 눈사태 효과</tspan><tspan x="190.5" dy="18.5">보안이 필요하면 암호학적 성질까지</tspan></text></g><g ><g class="shape"><ellipse cx="551" cy="54" class="shape stroke-B1 fill-B6 s0" rx="88" ry="42"/></g><text x="551" y="51.5" class="text-bold fill-N1 s1"><tspan x="551" dy="0">버킷 배열</tspan><tspan x="551" dy="18.5">칸 수 m</tspan></text></g><g ><g class="shape"><path d="M389 166h324v82H389z" class="stroke-B1 fill-B6 s0"/></g><text x="551" y="204.5" class="text-bold fill-N1 s1"><tspan x="551" dy="0">충돌은 반드시 생긴다</tspan><tspan x="551" dy="18.5">비둘기집 원리, 그리고 생일 문제</tspan></text></g><g ><g class="shape"><path d="M166 328h232v82H166z" class="stroke-B1 fill-B6 s0"/></g><text x="282" y="366.5" class="text-bold fill-N1 s1"><tspan x="282" dy="0">체이닝</tspan><tspan x="282" dy="18.5">칸마다 목록을 매단다</tspan></text></g><g ><g class="shape"><path d="M751 328h259v82H751z" class="stroke-B1 fill-B6 s0"/></g><text x="880.5" y="366.5" class="text-bold fill-N1 s1"><tspan x="880.5" dy="0">개방 주소법</tspan><tspan x="880.5" dy="18.5">빈 칸을 찾아 옆으로 민다</tspan></text></g><g ><g class="shape"><path d="M544 609h235v82H544z" class="stroke-B1 fill-B6 s0"/></g><text x="661.5" y="647.5" class="text-bold fill-N1 s1"><tspan x="661.5" dy="0">선형 탐사 —</tspan><tspan x="661.5" dy="18.5">캐시에 좋고 일차 군집</tspan></text></g><g ><g class="shape"><path d="M600 791h279v82H600z" class="stroke-B1 fill-B6 s0"/></g><text x="739.5" y="829.5" class="text-bold fill-N1 s1"><tspan x="739.5" dy="0">이차 탐사 —</tspan><tspan x="739.5" dy="18.5">일차 군집은 없고 이차 군집</tspan></text></g><g ><g class="shape"><path d="M670 953h319v82H670z" class="stroke-B1 fill-B6 s0"/></g><text x="829.5" y="991.5" class="text-bold fill-N1 s1"><tspan x="829.5" dy="0">이중 해싱 —</tspan><tspan x="829.5" dy="18.5">군집이 거의 없고 계산이 비싸다</tspan></text></g><g ><g class="shape"><ellipse cx="343" cy="650.5" class="shape stroke-B1 fill-B6 s0" rx="181" ry="60.5"/></g><text x="343" y="656" class="text-bold fill-N1 s1">적재율 α = 원소 수 ÷ 칸 수</text></g><g ><g class="shape"><path d="M153 953h380v98H153z" class="stroke-B1 fill-B6 s0"/></g><text x="343" y="991.5" class="text-bold fill-N1 s1"><tspan x="343" dy="0">리해싱</tspan><tspan x="343" dy="17.667">α 가 문턱을 넘으면 칸을 두 배로 늘리고</tspan><tspan x="343" dy="17.667">전부 다시 넣는다</tspan></text></g><g ><g class="shape"><path d="M960 590h299v82H960z" class="stroke-B1 fill-B6 s0"/></g><text x="1109.5" y="628.5" class="text-bold fill-N1 s1"><tspan x="1109.5" dy="0">삭제는 묘비로</tspan><tspan x="1109.5" dy="18.5">빈 칸을 만들면 탐사가 끊긴다</tspan></text></g><g ><g class="shape"><path d="M173 1212h340v82H173z" class="stroke-B1 fill-B6 s0"/></g><text x="343" y="1250.5" class="text-bold fill-N1 s1"><tspan x="343" dy="0">칸이 한 기계에 안 들어가면</tspan><tspan x="343" dy="18.5">일관 해싱으로 여러 기계에 나눈다</tspan></text></g><text x="635.5" y="1330" class="fill-N1 s1"><tspan x="635.5" dy="0">평균 O(1) 은 공짜가 아니다.</tspan><tspan x="635.5" dy="17.667">좋은 해시 함수, 낮은 적재율,</tspan><tspan x="635.5" dy="17.667">그리고 최악에는 O(n) 을 각오하는 것이 값이다</tspan></text><marker id="mk-d2-2318709033-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="m190.971 98-.914 64" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="M551 98v64" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="M497 250v28s0 10-10 10H292.833s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="M605 250v28s0 10 10 10h255.583s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="M837.416 412v78s0 10-10 10h-155.75s-10 0-10 10v96" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="M880.583 412v128s0 10-10 10h-41.417s-10 0-10 10v227" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="M919.916 412v537" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="M343 713v236" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><text x="343" y="838" class="text-italic fill-N2 s1">α &gt; 0.75 등</text><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="m282.835 412 .161 177" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="M794.25 412v28s0 10-10 10H413.5s-10 0-9.965 10l.451 129" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="M966.916 412v28s0 10 10 10h123.5s10 0 10 10v126" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><path fill="none" marker-end="url(#mk-d2-2318709033-3488378134)" d="M343.166 1053v155" class="connection stroke-B1 s0" mask="url(#d2-2318709033)"/><text x="343.5" y="1137" class="text-italic fill-N2 s1">전부 다시 넣기가 너무 비쌀 때</text><mask id="d2-2318709033" width="1449" height="1557" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1449v1557H-89z"/><path d="M304 822h78v21h-78zM218 1121h251v21H218z"/></mask></svg>