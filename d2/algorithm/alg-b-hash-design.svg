<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1596" class="d2-1194438747 d2-svg" viewBox="-89 -89 1080 1596"><rect width="1080" height="1596" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1194438747 .text-bold{font-weight:700}.d2-1194438747 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1194438747 .fill-N1{fill:#0a0f25}.d2-1194438747 .fill-N2{fill:#676c7e}.d2-1194438747 .fill-B6{fill:#f7f8fe}.d2-1194438747 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="130" cy="54" class="shape stroke-B1 fill-B6 s0" rx="88" ry="42"/></g><text x="130" y="51.5" class="text-bold fill-N1 s1"><tspan x="130" dy="0">해시 함수</tspan><tspan x="130" dy="18.5">키 → 정수</tspan></text></g><g ><g class="shape"><path d="M12 166h236v114H12z" class="stroke-B1 fill-B6 s0"/></g><text x="130" y="204.5" class="text-bold fill-N1 s1"><tspan x="130" dy="0">균등성 · 결정성 · 빠름 ·</tspan><tspan x="130" dy="17.25">눈사태 효과</tspan><tspan x="130" dy="17.25">보안이 필요하면</tspan><tspan x="130" dy="17.25">암호학적 성질까지</tspan></text></g><g ><g class="shape"><ellipse cx="384" cy="54" class="shape stroke-B1 fill-B6 s0" rx="88" ry="42"/></g><text x="384" y="51.5" class="text-bold fill-N1 s1"><tspan x="384" dy="0">버킷 배열</tspan><tspan x="384" dy="18.5">칸 수 m</tspan></text></g><g ><g class="shape"><path d="M268 176h232v98H268z" class="stroke-B1 fill-B6 s0"/></g><text x="384" y="214.5" class="text-bold fill-N1 s1"><tspan x="384" dy="0">충돌은 반드시 생긴다</tspan><tspan x="384" dy="17.667">비둘기집 원리,</tspan><tspan x="384" dy="17.667">그리고 생일 문제</tspan></text></g><g ><g class="shape"><path d="M30 360h232v82H30z" class="stroke-B1 fill-B6 s0"/></g><text x="146" y="398.5" class="text-bold fill-N1 s1"><tspan x="146" dy="0">체이닝</tspan><tspan x="146" dy="18.5">칸마다 목록을 매단다</tspan></text></g><g ><g class="shape"><path d="M506 360h259v82H506z" class="stroke-B1 fill-B6 s0"/></g><text x="635.5" y="398.5" class="text-bold fill-N1 s1"><tspan x="635.5" dy="0">개방 주소법</tspan><tspan x="635.5" dy="18.5">빈 칸을 찾아 옆으로 민다</tspan></text></g><g ><g class="shape"><path d="M346 580h235v82H346z" class="stroke-B1 fill-B6 s0"/></g><text x="463.5" y="618.5" class="text-bold fill-N1 s1"><tspan x="463.5" dy="0">선형 탐사 —</tspan><tspan x="463.5" dy="18.5">캐시에 좋고 일차 군집</tspan></text></g><g ><g class="shape"><path d="M447 750h191v98H447z" class="stroke-B1 fill-B6 s0"/></g><text x="542.5" y="788.5" class="text-bold fill-N1 s1"><tspan x="542.5" dy="0">이차 탐사 —</tspan><tspan x="542.5" dy="17.667">일차 군집은 없고</tspan><tspan x="542.5" dy="17.667">이차 군집</tspan></text></g><g ><g class="shape"><path d="M515 928h191v98H515z" class="stroke-B1 fill-B6 s0"/></g><text x="610.5" y="966.5" class="text-bold fill-N1 s1"><tspan x="610.5" dy="0">이중 해싱 —</tspan><tspan x="610.5" dy="17.667">군집이 거의 없고</tspan><tspan x="610.5" dy="17.667">계산이 비싸다</tspan></text></g><g ><g class="shape"><ellipse cx="191" cy="619" class="shape stroke-B1 fill-B6 s0" rx="135" ry="45"/></g><text x="191" y="616.5" class="text-bold fill-N1 s1"><tspan x="191" dy="0">적재율</tspan><tspan x="191" dy="18.5">α = 원소 수 ÷ 칸 수</tspan></text></g><g ><g class="shape"><path d="M84 928h215v114H84z" class="stroke-B1 fill-B6 s0"/></g><text x="191.5" y="966.5" class="text-bold fill-N1 s1"><tspan x="191.5" dy="0">리해싱</tspan><tspan x="191.5" dy="17.25">α 가 문턱을 넘으면</tspan><tspan x="191.5" dy="17.25">칸을 두 배로 늘리고</tspan><tspan x="191.5" dy="17.25">전부 다시 넣는다</tspan></text></g><g ><g class="shape"><path d="M719 572h171v98H719z" class="stroke-B1 fill-B6 s0"/></g><text x="804.5" y="610.5" class="text-bold fill-N1 s1"><tspan x="804.5" dy="0">삭제는 묘비로</tspan><tspan x="804.5" dy="17.667">빈 칸을 만들면</tspan><tspan x="804.5" dy="17.667">탐사가 끊긴다</tspan></text></g><g ><g class="shape"><path d="M85 1219h212v114H85z" class="stroke-B1 fill-B6 s0"/></g><text x="191" y="1257.5" class="text-bold fill-N1 s1"><tspan x="191" dy="0">칸이 한 기계에</tspan><tspan x="191" dy="17.25">안 들어가면</tspan><tspan x="191" dy="17.25">일관 해싱으로</tspan><tspan x="191" dy="17.25">여러 기계에 나눈다</tspan></text></g><text x="450.5" y="1369" class="fill-N1 s1"><tspan x="450.5" dy="0">평균 O(1) 은 공짜가 아니다.</tspan><tspan x="450.5" dy="17.667">좋은 해시 함수, 낮은 적재율,</tspan><tspan x="450.5" dy="17.667">그리고 최악에는 O(n) 을 각오하는 것이 값이다</tspan></text><marker id="mk-d2-1194438747-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M130 98v64" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M384 98v75" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M345.333 277v33s0 10-10 10H156.5s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M422.666 277v33s0 10 10 10H626.25s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M593.083 444v78s0 10-10 10H474s-10 0-10 10v34" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M621.5 444v302" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M678.833 444v480" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="m191.992 667-.977 257" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><text x="192" y="802" class="text-italic fill-N2 s1">α &gt; 0.75 등</text><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M146.507 443.666 146.985 573" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M549.916 444v28s0 10-10 10H246.5s-10 0-9.947 10l.426 81" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M722.583 444v28s0 10 10 10h62.75s10 0 10 10v76" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><path fill="none" marker-end="url(#mk-d2-1194438747-3488378134)" d="M191.5 1044v171" class="connection stroke-B1 s0" mask="url(#d2-1194438747)"/><text x="191.5" y="1128" class="text-italic fill-N2 s1"><tspan x="191.5" dy="0">전부 다시 넣기가</tspan><tspan x="191.5" dy="18.5">너무 비쌀 때</tspan></text><mask id="d2-1194438747" width="1080" height="1596" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H991v1596H-89z"/><path d="M153 786h78v21h-78zM119 1112h145v37H119z"/></mask></svg>