<svg xmlns="http://www.w3.org/2000/svg" width="4488" height="843" class="d2-2538114633 d2-svg" viewBox="-101 -101 4488 843"><rect width="4488" height="843" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2538114633 .fill-N1{fill:#0a0f25}.d2-2538114633 .fill-N2{fill:#676c7e}.d2-2538114633 .fill-B6{fill:#f7f8fe}.d2-2538114633 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="311" cy="218" class="shape stroke-B1 fill-B6 s0" rx="88" ry="42"/></g><text x="311" y="215.5" class="text-bold fill-N1 s1"><tspan x="311" dy="0">해시 함수</tspan><tspan x="311" dy="18.5">키 → 정수</tspan></text></g><g ><g class="shape"><path d="M908 177h357v82H908z" class="stroke-B1 fill-B6 s0"/></g><text x="1086.5" y="215.5" class="text-bold fill-N1 s1"><tspan x="1086.5" dy="0">균등성 · 결정성 · 빠름 · 눈사태 효과</tspan><tspan x="1086.5" dy="18.5">보안이 필요하면 암호학적 성질까지</tspan></text></g><g ><g class="shape"><ellipse cx="311" cy="362" class="shape stroke-B1 fill-B6 s0" rx="88" ry="42"/></g><text x="311" y="359.5" class="text-bold fill-N1 s1"><tspan x="311" dy="0">버킷 배열</tspan><tspan x="311" dy="18.5">칸 수 m</tspan></text></g><g ><g class="shape"><path d="M925 321h324v82H925z" class="stroke-B1 fill-B6 s0"/></g><text x="1087" y="359.5" class="text-bold fill-N1 s1"><tspan x="1087" dy="0">충돌은 반드시 생긴다</tspan><tspan x="1087" dy="18.5">비둘기집 원리, 그리고 생일 문제</tspan></text></g><g ><g class="shape"><path d="M1566 489h232v82h-232z" class="stroke-B1 fill-B6 s0"/></g><text x="1682" y="527.5" class="text-bold fill-N1 s1"><tspan x="1682" dy="0">체이닝</tspan><tspan x="1682" dy="18.5">칸마다 목록을 매단다</tspan></text></g><g ><g class="shape"><path d="M1552 244h259v82h-259z" class="stroke-B1 fill-B6 s0"/></g><text x="1681.5" y="282.5" class="text-bold fill-N1 s1"><tspan x="1681.5" dy="0">개방 주소법</tspan><tspan x="1681.5" dy="18.5">빈 칸을 찾아 옆으로 민다</tspan></text></g><g ><g class="shape"><path d="M2140 0h337v66h-337z" class="stroke-B1 fill-B6 s0"/></g><text x="2308.5" y="38.5" class="text-bold fill-N1 s1">선형 탐사 — 캐시에 좋고 일차 군집</text></g><g ><g class="shape"><path d="M2119 126h380v66h-380z" class="stroke-B1 fill-B6 s0"/></g><text x="2309" y="164.5" class="text-bold fill-N1 s1">이차 탐사 — 일차 군집은 없고 이차 군집</text></g><g ><g class="shape"><path d="M2098 252h421v66h-421z" class="stroke-B1 fill-B6 s0"/></g><text x="2308.5" y="290.5" class="text-bold fill-N1 s1">이중 해싱 — 군집이 거의 없고 계산이 비싸다</text></g><g ><g class="shape"><ellipse cx="2309" cy="438.5" class="shape stroke-B1 fill-B6 s0" rx="181" ry="60.5"/></g><text x="2309" y="444" class="text-bold fill-N1 s1">적재율 α = 원소 수 ÷ 칸 수</text></g><g ><g class="shape"><path d="M2880 398h532v82h-532z" class="stroke-B1 fill-B6 s0"/></g><text x="3146" y="436.5" class="text-bold fill-N1 s1"><tspan x="3146" dy="0">리해싱</tspan><tspan x="3146" dy="18.5">α 가 문턱을 넘으면 칸을 두 배로 늘리고 전부 다시 넣는다</tspan></text></g><g ><g class="shape"><path d="M2159 559h299v82h-299z" class="stroke-B1 fill-B6 s0"/></g><text x="2308.5" y="597.5" class="text-bold fill-N1 s1"><tspan x="2308.5" dy="0">삭제는 묘비로</tspan><tspan x="2308.5" dy="18.5">빈 칸을 만들면 탐사가 끊긴다</tspan></text></g><g ><g class="shape"><path d="M3946 398h340v82h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="4116" y="436.5" class="text-bold fill-N1 s1"><tspan x="4116" dy="0">칸이 한 기계에 안 들어가면</tspan><tspan x="4116" dy="18.5">일관 해싱으로 여러 기계에 나눈다</tspan></text></g><text x="310.5" y="480" class="fill-N1 s1"><tspan x="310.5" dy="0">평균 O(1) 은 공짜가 아니다.</tspan><tspan x="310.5" dy="18.5">좋은 해시 함수, 낮은 적재율, 그리고 최악에는 O(n) 을 각오하는 것이 값이다</tspan></text><marker id="mk-d2-2538114633-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2538114633-3488378134)" d="M401 217.999c290.4-.199 