<svg xmlns="http://www.w3.org/2000/svg" width="946" height="2161" class="d2-4111347312 d2-svg" viewBox="-101 -101 946 2161"><rect width="946" height="2161" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-4111347312 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4111347312 .fill-N1{fill:#0a0f25}.d2-4111347312 .fill-B5{fill:#edf0fd}.d2-4111347312 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><path fill="transparent" stroke="transparent" d="M0 0h744v591H0z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M0 601h744v618H0z" class="shape s0"/><path fill="transparent" stroke="transparent" d="M0 1229h744v635H0z" class="shape s0"/><text x="242" y="1890" class="text-bold fill-N1 s1"><tspan x="242" dy="0">셋의 공통점: 어느 것도 혼자서는 완결되지 않는다.</tspan><tspan x="242" dy="17">TLS 로 채널을 지키고, 비밀번호는 느린 해시로 저장하고,</tspan><tspan x="242" dy="17">토큰은 만료를 짧게 둔다.</tspan><tspan x="242" dy="17">그리고 셋 다 표준 규격이 있다</tspan><tspan x="242" dy="17">— 직접 만들지 말고 규격 그대로 구현된 것을 쓴다</tspan></text><g ><g class="shape"><ellipse cx="332" cy="89.5" class="shape stroke-B1 fill-B5 s0" rx="178" ry="59.5"/></g><text x="332" y="87" class="text-bold fill-N1 s1"><tspan x="332" dy="0">비밀번호 하나가 새면</tspan><tspan x="332" dy="18.5">계정이 통째로 넘어간다</tspan></text></g><g ><g class="shape"><path d="M56 249h552v114H56z" class="stroke-B1 fill-B5 s0"/></g><text x="332" y="287.5" class="text-bold fill-N1 s1"><tspan x="332" dy="0">TOTP — 시간 기반 일회용 비밀번호</tspan><tspan x="332" dy="17.25">푸는 문제: 아는 것 하나에만 기대지 않게 한다</tspan><tspan x="332" dy="17.25">방법: 공유 비밀과 현재 시각을 HMAC 에 넣어 6자리를 만든다</tspan><tspan x="332" dy="17.25">메시지가 곧 시각이므로 30초가 지나면 값이 죽는다</tspan></text></g><g ><g class="shape"><path d="M30 463h604v98H30z" class="stroke-B1 fill-B5 s0"/></g><text x="332" y="501.5" class="text-bold fill-N1 s1"><tspan x="332" dy="0">약한 곳: 공유 비밀을 서버가 그대로 들고 있다.</tspan><tspan x="332" dy="17.667">시계가 어긋나면 실패하므로 앞뒤 한 칸을 허용한다.</tspan><tspan x="332" dy="17.667">피싱은 못 막는다 — 가짜 사이트에 6자리를 그대로 넣어 줄 수 있다</tspan></text></g><g ><g class="shape"><ellipse cx="372" cy="696" class="shape stroke-B1 fill-B5 s0" rx="195" ry="65"/></g><text x="372" y="693.5" class="text-bold fill-N1 s1"><tspan x="372" dy="0">비밀번호를 서버에 보내면</tspan><tspan x="372" dy="18.5">서버와 중간이 그것을 본다</tspan></text></g><g ><g class="shape"><path d="M30 861h684v114H30z" class="stroke-B1 fill-B5 s0"/></g><text x="372" y="899.5" class="text-bold fill-N1 s1"><tspan x="372" dy="0">SCRAM — 소금 친 도전-응답 인증</tspan><tspan x="372" dy="17.25">푸는 문제: 비밀번호를 평문으로 보내지 않는다</tspan><tspan x="372" dy="17.25">방법: 서버가 소금과 반복 횟수를 주면 클라이언트가 증거를 만들어 보낸다</tspan><tspan x="372" dy="17.25">서버는 비밀번호를 모르고도 그 증거를 확인할 수 있다</tspan></text></g><g ><g class="shape"><path d="M128 1075h488v114H128z" class="stroke-B1 fill-B5 s0"/></g><text x="372" y="1113.5" class="text-bold fill-N1 s1"><tspan x="372" dy="0">약한 곳: 서버 저장값이 새면 가짜 서버가 될 수 있고,</tspan><tspan x="372" dy="17.25">대화 하나를 엿들으면 로그인도 된다.</tspan><tspan x="372" dy="17.25">채널 자체는 지키지 못하므로 TLS 위에서 써야 한다.</tspan><tspan x="372" dy="17.25">반복 횟수가 곧 무차별 대입에 드는 값이다</tspan></text></g><g ><g class="shape"><ellipse cx="347" cy="1332.5" class="shape stroke-B1 fill-B5 s0" rx="221" ry="73.5"/></g><text x="347" y="1330" class="text-bold fill-N1 s1"><tspan x="347" dy="0">요청마다 로그인을 확인하려면</tspan><tspan x="347" dy="18.5">매번 저장소를 뒤져야 한다</tspan></text></g><g ><g class="shape"><path d="M30 1506h633v114H30z" class="stroke-B1 fill-B5 s0"/></g><text x="346.5" y="1544.5" class="text-bold fill-N1 s1"><tspan x="346.5" dy="0">JWT — JSON 웹 토큰</tspan><tspan x="346.5" dy="17.25">푸는 문제: 상태를 서버에 두지 않고 인증을 이어 간다</tspan><tspan x="346.5" dy="17.25">방법: 주장을 적고 서명해 준다. 받은 쪽은 서명만 확인하면 된다</tspan><tspan x="346.5" dy="17.25">서명은 무결성과 인증만 준다 — 안이 다 보이므로 비밀을 담지 않는다</tspan></text></g><g ><g class="shape"><path d="M92 1720h510v114H92z" class="stroke-B1 fill-B5 s0"/></g><text x="347" y="1758.5" class="text-bold fill-N1 s1"><tspan x="347" dy="0">약한 곳: 한 번 발급하면 만료까지 취소하기 어렵다.</tspan><tspan x="347" dy="17.25">알고리즘 자리를 ‘없음’ 으로 바꾸는 공격이 유명하다</tspan><tspan x="347" dy="17.25">— 서버가 쓸 알고리즘을 미리 정해 두어야 한다.</tspan><tspan x="347" dy="17.25">짧은 만료와 갱신 토큰을 함께 쓴다</tspan></text></g><marker id="mk-d2-4111347312-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4111347312-3488378134)" d="M332 151v94" class="connection stroke-B1 s0" mask="url(#d2-4111347312)"/><path fill="none" marker-end="url(#mk-d2-4111347312-3488378134)" d="M332 365v94" class="connection stroke-B1 s0" mask="url(#d2-4111347312)"/><path fill="none" marker-end="url(#mk-d2-4111347312-3488378134)" d="M372 763v94" class="connection stroke-B1 s0" mask="url(#d2-4111347312)"/><path fill="none" marker-end="url(#mk-d2-4111347312-3488378134)" d="M372 977v94" class="connection stroke-B1 s0" mask="url(#d2-4111347312)"/><path fill="none" marker-end="url(#mk-d2-4111347312-3488378134)" d="M346.98 1408c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-4111347312)"/><path fill="none" marker-end="url(#mk-d2-4111347312-3488378134)" d="M346.5 1622v94" class="connection stroke-B1 s0" mask="url(#d2-4111347312)"/><mask id="d2-4111347312" width="946" height="2161" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h946v2161h-946z"/></mask></svg>