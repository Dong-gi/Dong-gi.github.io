<svg xmlns="http://www.w3.org/2000/svg" width="2705" height="831" class="d2-1805133976 d2-svg" viewBox="-101 -101 2705 831"><rect width="2705" height="831" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1805133976 .fill-N1{fill:#0a0f25}.d2-1805133976 .fill-B6{fill:#f7f8fe}.d2-1805133976 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="352" cy="59.5" class="shape stroke-B1 fill-B6 s0" rx="178" ry="59.5"/></g><text x="352" y="57" class="text-bold fill-N1 s1"><tspan x="352" dy="0">비밀번호 하나가 새면</tspan><tspan x="352" dy="18.5">계정이 통째로 넘어간다</tspan></text></g><g ><g class="shape"><ellipse cx="352" cy="244" class="shape stroke-B1 fill-B6 s0" rx="195" ry="65"/></g><text x="352" y="241.5" class="text-bold fill-N1 s1"><tspan x="352" dy="0">비밀번호를 서버에 보내면</tspan><tspan x="352" dy="18.5">서버와 중간이 그것을 본다</tspan></text></g><g ><g class="shape"><ellipse cx="352" cy="442.5" class="shape stroke-B1 fill-B6 s0" rx="221" ry="73.5"/></g><text x="352" y="440" class="text-bold fill-N1 s1"><tspan x="352" dy="0">요청마다 로그인을 확인하려면</tspan><tspan x="352" dy="18.5">매번 저장소를 뒤져야 한다</tspan></text></g><g ><g class="shape"><path d="M869 3h552v114H869z" class="stroke-B1 fill-B6 s0"/></g><text x="1145" y="41.5" class="text-bold fill-N1 s1"><tspan x="1145" dy="0">TOTP — 시간 기반 일회용 비밀번호</tspan><tspan x="1145" dy="17.25">푸는 문제: 아는 것 하나에만 기대지 않게 한다</tspan><tspan x="1145" dy="17.25">방법: 공유 비밀과 현재 시각을 HMAC 에 넣어 6자리를 만든다</tspan><tspan x="1145" dy="17.25">메시지가 곧 시각이므로 30초가 지나면 값이 죽는다</tspan></text></g><g ><g class="shape"><path d="M803 187h684v114H803z" class="stroke-B1 fill-B6 s0"/></g><text x="1145" y="225.5" class="text-bold fill-N1 s1"><tspan x="1145" dy="0">SCRAM — 소금 친 도전-응답 인증</tspan><tspan x="1145" dy="17.25">푸는 문제: 비밀번호를 평문으로 보내지 않는다</tspan><tspan x="1145" dy="17.25">방법: 서버가 소금과 반복 횟수를 주면 클라이언트가 증거를 만들어 보낸다</tspan><tspan x="1145" dy="17.25">서버는 비밀번호를 모르고도 그 증거를 확인할 수 있다</tspan></text></g><g ><g class="shape"><path d="M851 386h588v114H851z" class="stroke-B1 fill-B6 s0"/></g><text x="1145" y="424.5" class="text-bold fill-N1 s1"><tspan x="1145" dy="0">JWT — JSON 웹 토큰</tspan><tspan x="1145" dy="17.25">푸는 문제: 상태를 서버에 두지 않고 인증을 이어 간다</tspan><tspan x="1145" dy="17.25">방법: 주장을 적고 서명해 준다. 받은 쪽은 서명만 확인하면 된다</tspan><tspan x="1145" dy="17.25">서명은 무결성만 준다 — 안이 다 보이므로 비밀을 담지 않는다</tspan></text></g><g ><g class="shape"><path d="M1743 11h604v98h-604z" class="stroke-B1 fill-B6 s0"/></g><text x="2045" y="49.5" class="text-bold fill-N1 s1"><tspan x="2045" dy="0">약한 곳: 공유 비밀을 서버가 그대로 들고 있다.</tspan><tspan x="2045" dy="17.667">시계가 어긋나면 실패하므로 앞뒤 한 칸을 허용한다.</tspan><tspan x="2045" dy="17.667">피싱은 못 막는다 — 가짜 사이트에 6자리를 그대로 넣어 줄 수 있다</tspan></text></g><g ><g class="shape"><path d="M1782 195h527v98h-527z" class="stroke-B1 fill-B6 s0"/></g><text x="2045.5" y="233.5" class="text-bold fill-N1 s1"><tspan x="2045.5" dy="0">약한 곳: 서버 저장값이 새면 그 값으로 로그인할 수 있다.</tspan><tspan x="2045.5" dy="17.667">채널 자체는 지키지 못하므로 TLS 위에서 써야 한다.</tspan><tspan x="2045.5" dy="17.667">반복 횟수가 곧 무차별 대입에 드는 값이다</tspan></text></g><g ><g class="shape"><path d="M1587 394h916v98h-916z" class="stroke-B1 fill-B6 s0"/></g><text x="2045" y="432.5" class="text-bold fill-N1 s1"><tspan x="2045" dy="0">약한 곳: 한 번 발급하면 만료까지 취소하기 어렵다.</tspan><tspan x="2045" dy="17.667">알고리즘 자리를 ‘없음’ 으로 바꾸는 공격이 유명하다 — 서버가 쓸 알고리즘을 미리 정해 두어야 한다.</tspan><tspan x="2045" dy="17.667">짧은 만료와 갱신 토큰을 함께 쓴다</tspan></text></g><text x="351.5" y="592" class="text-bold fill-N1 s1"><tspan x="351.5" dy="0">셋의 공통점: 어느 것도 혼자서는 완결되지 않는다.</tspan><tspan x="351.5" dy="17.667">TLS 로 채널을 지키고, 비밀번호는 느린 해시로 저장하고, 토큰은 만료를 짧게 둔다.</tspan><tspan x="351.5" dy="17.667">그리고 셋 다 표준 규격이 있다 — 직접 만들지 말고 규격 그대로 구현된 것을 쓴다</tspan></text><marker id="mk-d2-1805133976-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1805133976-3488378134)" d="M532 59.996c176.4-.396 244.2-.496 333-.496" class="connection stroke-B1 s0" mask="url(#d2-1805133976)"/><path fill="none" marker-end="url(#mk-d2-1805133976-3488378134)" d="M549 244h250" class="connection stroke-B1 s0" mask="url(#d2-1805133976)"/><path fill="none" marker-end="url(#mk-d2-1805133976-3488378134)" d="M575 442.994c142-.394 197.6-.494 272-.494" class="connection stroke-B1 s0" mask="url(#d2-1805133976)"/><path fill="none" marker-end="url(#mk-d2-1805133976-3488378134)" d="M1423 59.5h316" class="connection stroke-B1 s0" mask="url(#d2-1805133976)"/><path fill="none" marker-end="url(#mk-d2-1805133976-3488378134)" d="M1489 244h288.5" class="connection stroke-B1 s0" mask="url(#d2-1805133976)"/><path fill="none" marker-end="url(#mk-d2-1805133976-3488378134)" d="M1441 442.5h142" class="connection stroke-B1 s0" mask="url(#d2-1805133976)"/><mask id="d2-1805133976" width="2705" height="831" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2705v831H-101z"/></mask></svg>