<svg xmlns="http://www.w3.org/2000/svg" width="898" height="1857" class="d2-2593134687 d2-svg" viewBox="-206 -101 898 1857"><rect width="898" height="1857" x="-206" y="-101" rx="0" style="fill:#fff"/><style>.d2-2593134687 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2593134687 .fill-N1{fill:#0a0f25}.d2-2593134687 .fill-B6{fill:#f7f8fe}.d2-2593134687 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="203.5" cy="67" class="shape stroke-B1 fill-B6 s0" rx="201.5" ry="67"/></g><text x="203.5" y="56.5" class="text-bold fill-N1 s1"><tspan x="203.5" dy="0">1. 입력 크기 n 을 정한다</tspan><tspan x="203.5" dy="17.667">원소 개수인가, 비트 수인가,</tspan><tspan x="203.5" dy="17.667">정점 수인가</tspan></text></g><g ><g class="shape"><path d="M0 234h406v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="203" y="272.5" class="text-bold fill-N1 s1"><tspan x="203" dy="0">2. 기본 연산을 고른다</tspan><tspan x="203" dy="18.5">비교 · 대입 · 산술 중 가장 자주 일어나는 것</tspan></text></g><g ><g class="shape"><path d="M81 416h245v82H81z" class="stroke-B1 fill-B6 s0"/></g><text x="203.5" y="454.5" class="text-bold fill-N1 s1"><tspan x="203.5" dy="0">3. n 에 대한 식으로 센다</tspan><tspan x="203.5" dy="18.5">T(n) = 3n² + 5n + 7</tspan></text></g><g ><g class="shape"><path d="M57 983h293v82H57z" class="stroke-B1 fill-B6 s0"/></g><text x="203.5" y="1021.5" class="text-bold fill-N1 s1"><tspan x="203.5" dy="0">4. 어느 경우를 재는지 밝힌다</tspan><tspan x="203.5" dy="18.5">최선 · 평균 · 최악</tspan></text></g><g ><g class="shape"><path d="M35 1165h337v82H35z" class="stroke-B1 fill-B6 s0"/></g><text x="203.5" y="1203.5" class="text-bold fill-N1 s1"><tspan x="203.5" dy="0">5. 상수배와 낮은 차수 항을 버린다</tspan><tspan x="203.5" dy="18.5">3n² + 5n + 7 → n²</tspan></text></g><g ><g class="shape"><ellipse cx="203.5" cy="1389" class="shape stroke-B1 fill-B6 s0" rx="126.5" ry="42"/></g><text x="203.5" y="1394.5" class="text-bold fill-N1 s1">O(n²) · Ω(n²) · Θ(n²)</text></g><g ><g class="shape"><path d="M136 619h349v98H136z" class="stroke-B1 fill-B6 s0"/></g><text x="310.5" y="657.5" class="text-bold fill-N1 s1"><tspan x="310.5" dy="0">3번에서 함수가 자기를 다시 부르면</tspan><tspan x="310.5" dy="17.667">식이 아니라 재귀식이 나온다</tspan><tspan x="310.5" dy="17.667">T(n) = 2T(n/2) + n</tspan></text></g><g ><g class="shape"><path d="M139 817h343v66H139z" class="stroke-B1 fill-B6 s0"/></g><text x="310.5" y="855.5" class="text-bold fill-N1 s1">재귀 트리 또는 마스터 정리로 푼다</text></g><g ><g class="shape"><path fill="transparent" d="M-106 1451h698v205h-698z" class="stroke-B1"/></g></g><text x="87.5" y="1527" class="fill-N1 s1"><tspan x="87.5" dy="0">왜 버려도 되는가:</tspan><tspan x="87.5" dy="17">기계가 두 배 빨라지면</tspan><tspan x="87.5" dy="17">상수배가 바뀐다.</tspan><tspan x="87.5" dy="17">기계를 바꿔도 변하지 않는 것만</tspan><tspan x="87.5" dy="17">남기려는 것이다</tspan></text><text x="395.5" y="1527" class="fill-N1 s1"><tspan x="395.5" dy="0">버린 상수가 사라진 것은 아니다.</tspan><tspan x="395.5" dy="17">같은 O(n) 이라도</tspan><tspan x="395.5" dy="17">배열 훑기와 리스트 훑기는</tspan><tspan x="395.5" dy="17">실제로 몇 배씩 차이 난다</tspan><tspan x="395.5" dy="17">— 4장에서 본다</tspan></text><marker id="mk-d2-2593134687-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2593134687-3488378134)" d="M203 136v94" class="connection stroke-B1 s0" mask="url(#d2-2593134687)"/><path fill="none" marker-end="url(#mk-d2-2593134687-3488378134)" d="M203 318v94" class="connection stroke-B1 s0" mask="url(#d2-2593134687)"/><path fill="none" marker-end="url(#mk-d2-2593134687-3488378134)" d="M158.302 498.88C108.55 546.3 95.75 580.4 95.75 613.25V808.5c0 24.9 11.8 134.5 55.948 171.914" class="connection stroke-B1 s0" mask="url(#d2-2593134687)"/><path fill="none" marker-end="url(#mk-d2-2593134687-3488378134)" d="M203 1067v94" class="connection stroke-B1 s0" mask="url(#d2-2593134687)"/><path fill="none" marker-end="url(#mk-d2-2593134687-3488378134)" d="M203 1249v94" class="connection stroke-B1 s0" mask="url(#d2-2593134687)"/><path fill="none" marker-end="url(#mk-d2-2593134687-3488378134)" d="M247.698 498.88C297.45 546.3 310.25 570.7 310.25 615.5" class="connection stroke-B1 s0" mask="url(#d2-2593134687)"/><text x="299" y="554" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">재귀 알고리즘이면</text><path fill="none" marker-end="url(#mk-d2-2593134687-3488378134)" d="M310.25 719v94" class="connection stroke-B1 s0" mask="url(#d2-2593134687)"/><path fill="none" marker-end="url(#mk-d2-2593134687-3488378134)" d="M310.25 885c0 38-11.8 58-55.948 95.414" class="connection stroke-B1 s0" mask="url(#d2-2593134687)"/><mask id="d2-2593134687" width="898" height="1857" x="-206" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-206-101h898v1857h-898z"/><path d="M218 538h162v21H218z"/></mask></svg>