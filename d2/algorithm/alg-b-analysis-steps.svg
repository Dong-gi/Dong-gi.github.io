<svg xmlns="http://www.w3.org/2000/svg" width="1651" height="1684" class="d2-5303725 d2-svg" viewBox="-101 -101 1651 1684"><rect width="1651" height="1684" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-5303725 .fill-N1{fill:#0a0f25}.d2-5303725 .fill-B6{fill:#f7f8fe}.d2-5303725 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="278" cy="92.5" class="shape stroke-B1 fill-B6 s0" rx="278" ry="92.5"/></g><text x="278" y="90" class="text-bold fill-N1 s1"><tspan x="278" dy="0">1. 입력 크기 n 을 정한다</tspan><tspan x="278" dy="18.5">원소 개수인가, 비트 수인가, 정점 수인가</tspan></text></g><g ><g class="shape"><path d="M75 285h406v82H75z" class="stroke-B1 fill-B6 s0"/></g><text x="278" y="323.5" class="text-bold fill-N1 s1"><tspan x="278" dy="0">2. 기본 연산을 고른다</tspan><tspan x="278" dy="18.5">비교 · 대입 · 산술 중 가장 자주 일어나는 것</tspan></text></g><g ><g class="shape"><path d="M156 467h245v82H156z" class="stroke-B1 fill-B6 s0"/></g><text x="278.5" y="505.5" class="text-bold fill-N1 s1"><tspan x="278.5" dy="0">3. n 에 대한 식으로 센다</tspan><tspan x="278.5" dy="18.5">T(n) = 3n² + 5n + 7</tspan></text></g><g ><g class="shape"><path d="M132 1034h293v82H132z" class="stroke-B1 fill-B6 s0"/></g><text x="278.5" y="1072.5" class="text-bold fill-N1 s1"><tspan x="278.5" dy="0">4. 어느 경우를 재는지 밝힌다</tspan><tspan x="278.5" dy="18.5">최선 · 평균 · 최악</tspan></text></g><g ><g class="shape"><path d="M110 1216h337v82H110z" class="stroke-B1 fill-B6 s0"/></g><text x="278.5" y="1254.5" class="text-bold fill-N1 s1"><tspan x="278.5" dy="0">5. 상수배와 낮은 차수 항을 버린다</tspan><tspan x="278.5" dy="18.5">3n² + 5n + 7 → n²</tspan></text></g><g ><g class="shape"><ellipse cx="278.5" cy="1440" class="shape stroke-B1 fill-B6 s0" rx="126.5" ry="42"/></g><text x="278.5" y="1445.5" class="text-bold fill-N1 s1">O(n²) · Ω(n²) · Θ(n²)</text></g><g ><g class="shape"><path d="M211 670h349v98H211z" class="stroke-B1 fill-B6 s0"/></g><text x="385.5" y="708.5" class="text-bold fill-N1 s1"><tspan x="385.5" dy="0">3번에서 함수가 자기를 다시 부르면</tspan><tspan x="385.5" dy="17.667">식이 아니라 재귀식이 나온다</tspan><tspan x="385.5" dy="17.667">T(n) = 2T(n/2) + n</tspan></text></g><g ><g class="shape"><path d="M214 868h343v66H214z" class="stroke-B1 fill-B6 s0"/></g><text x="385.5" y="906.5" class="text-bold fill-N1 s1">재귀 트리 또는 마스터 정리로 푼다</text></g><text x="821.5" y="82" class="fill-N1 s1"><tspan x="821.5" dy="0">왜 버려도 되는가:</tspan><tspan x="821.5" dy="17.667">기계가 두 배 빨라지면 상수배가 바뀐다.</tspan><tspan x="821.5" dy="17.667">기계를 바꿔도 변하지 않는 것만 남기려는 것이다</tspan></text><text x="1268" y="82" class="fill-N1 s1"><tspan x="1268" dy="0">버린 상수가 사라진 것은 아니다.</tspan><tspan x="1268" dy="17.667">같은 O(n) 이라도 배열 훑기와 리스트 훑기는</tspan><tspan x="1268" dy="17.667">실제로 몇 배씩 차이 난다 — 4장에서 본다</tspan></text><marker id="mk-d2-5303725-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-5303725-3488378134)" d="M278 187v94" class="connection stroke-B1 s0" mask="url(#d2-5303725)"/><path fill="none" marker-end="url(#mk-d2-5303725-3488378134)" d="M278 369v94" class="connection stroke-B1 s0" mask="url(#d2-5303725)"/><path fill="none" marker-end="url(#mk-d2-5303725-3488378134)" d="M233.302 549.88C183.55 597.3 170.75 631.4 170.75 664.25V859.5c0 24.9 11.8 134.5 55.948 171.914" class="connection stroke-B1 s0" mask="url(#d2-5303725)"/><path fill="none" marker-end="url(#mk-d2-5303725-3488378134)" d="M278 1118v94" class="connection stroke-B1 s0" mask="url(#d2-5303725)"/><path fill="none" marker-end="url(#mk-d2-5303725-3488378134)" d="M278 1300v94" class="connection stroke-B1 s0" mask="url(#d2-5303725)"/><path fill="none" marker-end="url(#mk-d2-5303725-3488378134)" d="M322.698 549.88C372.45 597.3 385.25 621.7 385.25 666.5" class="connection stroke-B1 s0" mask="url(#d2-5303725)"/><text x="374" y="605" style="fill:#676c7e;text-anchor:middle;font-size:16px">재귀 알고리즘이면</text><path fill="none" marker-end="url(#mk-d2-5303725-3488378134)" d="M385.25 770v94" class="connection stroke-B1 s0" mask="url(#d2-5303725)"/><path fill="none" marker-end="url(#mk-d2-5303725-3488378134)" d="M385.25 936c0 38-11.8 58-55.948 95.414" class="connection stroke-B1 s0" mask="url(#d2-5303725)"/><mask id="d2-5303725" width="1651" height="1684" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1651v1684H-101z"/><path d="M293 589h162v21H293z"/></mask></svg>