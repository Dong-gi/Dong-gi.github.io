<svg xmlns="http://www.w3.org/2000/svg" width="3875" height="784" class="d2-2310438589 d2-svg" viewBox="-101 -101 3875 784"><rect width="3875" height="784" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2310438589 .fill-N1{fill:#0a0f25}.d2-2310438589 .fill-N2{fill:#676c7e}.d2-2310438589 .fill-B6{fill:#f7f8fe}.d2-2310438589 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="1260" cy="90.5" class="shape stroke-B1 fill-B6 s0" rx="271" ry="90.5"/></g><text x="1260" y="88" class="text-bold fill-N1 s1"><tspan x="1260" dy="0">정확한 답을 담기에는 자료가 너무 크다</tspan><tspan x="1260" dy="18.5">무엇을 묻고 있는가</tspan></text></g><g ><g class="shape"><path d="M46 281h232v66H46z" class="stroke-B1 fill-B6 s0"/></g><text x="162" y="319.5" class="text-bold fill-N1 s1">이것이 집합에 있는가</text></g><g ><g class="shape"><path d="M900 281h259v66H900z" class="stroke-B1 fill-B6 s0"/></g><text x="1029.5" y="319.5" class="text-bold fill-N1 s1">서로 다른 것이 몇 개인가</text></g><g ><g class="shape"><path d="M1373 281h235v66h-235z" class="stroke-B1 fill-B6 s0"/></g><text x="1490.5" y="319.5" class="text-bold fill-N1 s1">이것이 몇 번 나왔는가</text></g><g ><g class="shape"><path d="M2079 281h255v66h-255z" class="stroke-B1 fill-B6 s0"/></g><text x="2206.5" y="319.5" class="text-bold fill-N1 s1">이 근처에 무엇이 있는가</text></g><g ><g class="shape"><path d="M0 468h323v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="161.5" y="506.5" class="text-bold fill-N1 s1"><tspan x="161.5" dy="0">블룸 필터</tspan><tspan x="161.5" dy="17.25">비트 배열 하나와 해시 k 개</tspan><tspan x="161.5" dy="17.25">원소당 약 10비트로 오류 1%</tspan><tspan x="161.5" dy="17.25">포기: 삭제 · 원소 목록 · 거짓 양성</tspan></text></g><g ><g class="shape"><path d="M383 468h379v114H383z" class="stroke-B1 fill-B6 s0"/></g><text x="572.5" y="506.5" class="text-bold fill-N1 s1"><tspan x="572.5" dy="0">쿠쿠 필터</tspan><tspan x="572.5" dy="17.25">지문을 실제로 저장한다</tspan><tspan x="572.5" dy="17.25">포기: 구현 복잡도 · 가득 차면 삽입 실패</tspan><tspan x="572.5" dy="17.25">얻는 것: 삭제 · 개수 세기</tspan></text></g><g ><g class="shape"><path d="M822 468h415v114H822z" class="stroke-B1 fill-B6 s0"/></g><text x="1029.5" y="506.5" class="text-bold fill-N1 s1"><tspan x="1029.5" dy="0">HyperLogLog</tspan><tspan x="1029.5" dy="17.25">선행 0 의 최댓값을 버킷마다 모아 조화평균</tspan><tspan x="1029.5" dy="17.25">12 KB 로 오차 0.81%</tspan><tspan x="1029.5" dy="17.25">포기: 삭제 · 정확한 값. 얻는 것: 합집합</tspan></text></g><g ><g class="shape"><path d="M1297 468h386v114h-386z" class="stroke-B1 fill-B6 s0"/></g><text x="1490" y="506.5" class="text-bold fill-N1 s1"><tspan x="1490" dy="0">Count-Min Sketch</tspan><tspan x="1490" dy="17.25">행마다 다른 해시로 세고 읽을 때 최솟값</tspan><tspan x="1490" dy="17.25">포기: 정확한 값(과대 추정만)</tspan><tspan x="1490" dy="17.25">치우친 자료일수록 잘 맞는다</tspan></text></g><g ><g class="shape"><path d="M1743 476h380v98h-380z" class="stroke-B1 fill-B6 s0"/></g><text x="1933" y="514.5" class="text-bold fill-N1 s1"><tspan x="1933" dy="0">균등 격자</tspan><tspan x="1933" dy="17.667">자리 계산이 나눗셈 한 번</tspan><tspan x="1933" dy="17.667">자료가 몰리면 칸마다 부담이 들쭉날쭉</tspan></text></g><g ><g class="shape"><path d="M2183 484h471v82h-471z" class="stroke-B1 fill-B6 s0"/></g><text x="2418.5" y="522.5" class="text-bold fill-N1 s1"><tspan x="2418.5" dy="0">지오해시 — Z-곡선</tspan><tspan x="2418.5" dy="18.5">접두어가 곧 격자 주소라 문자열 비교로 범위 질의</tspan></text></g><g ><g class="shape"><path d="M2714 484h408v82h-408z" class="stroke-B1 fill-B6 s0"/></g><text x="2918" y="522.5" class="text-bold fill-N1 s1"><tspan x="2918" dy="0">쿼드트리</tspan><tspan x="2918" dy="18.5">붐비는 칸만 쪼갠다. 칸마다 부담이 고르다</tspan></text></g><g ><g class="shape"><path d="M3182 484h491v82h-491z" class="stroke-B1 fill-B6 s0"/></g><text x="3427.5" y="522.5" class="text-bold fill-N1 s1"><tspan x="3427.5" dy="0">구글 S2 — 힐베르트 곡선</tspan><tspan x="3427.5" dy="18.5">이웃이 끊기지 않아 반경 질의에 조각이 덜 쪼개진다</tspan></text></g><text x="1924.5" y="80" class="fill-N1 s1"><tspan x="1924.5" dy="0">네 확률적 구조의 공통점:</tspan><tspan x="1924.5" dy="17.667">크기를 미리 정하고 그만큼만 쓴다. 예상보다 많이 넣으면 오류율이 함께 오른다.</tspan><tspan x="1924.5" dy="17.667">그리고 어느 것도 원소 자체를 되돌려 주지 않는다</tspan></text><text x="2692.5" y="80" class="fill-N1 s1"><tspan x="2692.5" dy="0">실무에서 가장 흔한 쓰임은 ‘앞단 거르개’ 다.</tspan><tspan x="2692.5" dy="17.667">블룸 필터가 없다고 하면 디스크를 읽지 않고 끝내고, 있다고 할 때만 진짜를 확인한다.</tspan><tspan x="2692.5" dy="17.667">거짓 양성은 한 번 더 확인하는 값으로 끝나지만, 거짓 음성이었다면 자료를 잃었을 것이다</tspan></text><marker id="mk-d2-2310438589-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M1005.016 123.253C330.6 209.4 161.5 241 161.5 277" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M1128.29 171.038C1049.6 218.8 1029.5 241 1029.5 277" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M1391.707 171.042C1470 218.8 1490 241 1490 277" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M1508.979 128.291C2066.8 210.4 2206.75 241 2206.75 277" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M161.5 348.5v116" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><text x="162" y="413" class="text-italic fill-N2 s1">지울 일이 없다</text><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M280.45 340.834C513.7 394.077 572.5 419.7 572.5 464.5" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><text x="451" y="385" class="text-italic fill-N2 s1">지워야 한다</text><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M1029.5 348.5v116" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M1490 348.5v116" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M2108.11 347.152C1968.4 395.3 1933 421.3 1933 472.5" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><text x="1992" y="393" class="text-italic fill-N2 s1">자료가 고르게 퍼져 있다</text><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M2283.327 347.314C2391.1 395.3 2418.5 422.9 2418.5 480.5" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><text x="2382" y="397" class="text-italic fill-N2 s1">1차원 색인에 얹어야 한다</text><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M2336.233 331.02C2801.25 392.153 2918 422.9 2918 480.5" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><text x="2658.5" y="379" class="text-italic fill-N2 s1">자료가 몰려 있다</text><path fill="none" marker-end="url(#mk-d2-2310438589-3488378134)" d="M2336.244 323.918C3208.85 390.753 3427.5 422.9 3427.5 480.5" class="connection stroke-B1 s0" mask="url(#d2-2310438589)"/><text x="2912" y="374" class="text-italic fill-N2 s1">반경 · 지오펜스가 중요하다</text><mask id="d2-2310438589" width="3875" height="784" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3875v784H-101z"/><path d="M99 397h126v21H99zM399 369h104v21H399zM1889 377h206v21h-206zM2275 381h214v21h-214zM2586 363h145v21h-145zM2797 358h230v21h-230z"/></mask></svg>