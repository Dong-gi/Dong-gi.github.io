<svg xmlns="http://www.w3.org/2000/svg" width="1633" height="1796" class="d2-2349414523 d2-svg" viewBox="-101 -101 1633 1796"><rect width="1633" height="1796" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2349414523 .fill-N1{fill:#0a0f25}.d2-2349414523 .fill-N2{fill:#676c7e}.d2-2349414523 .fill-B6{fill:#f7f8fe}.d2-2349414523 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="163" cy="536.5" class="shape stroke-B1 fill-B6 s0" rx="163" ry="54.5"/></g><text x="163" y="526" class="text-bold fill-N1 s1"><tspan x="163" dy="0">정확한 답을 담기에는</tspan><tspan x="163" dy="17.667">자료가 너무 크다</tspan><tspan x="163" dy="17.667">무엇을 묻고 있는가</tspan></text></g><g ><g class="shape"><path d="M525 115h232v66H525z" class="stroke-B1 fill-B6 s0"/></g><text x="641" y="153.5" class="text-bold fill-N1 s1">이것이 집합에 있는가</text></g><g ><g class="shape"><path d="M511 404h259v66H511z" class="stroke-B1 fill-B6 s0"/></g><text x="640.5" y="442.5" class="text-bold fill-N1 s1">서로 다른 것이 몇 개인가</text></g><g ><g class="shape"><path d="M523 602h235v66H523z" class="stroke-B1 fill-B6 s0"/></g><text x="640.5" y="640.5" class="text-bold fill-N1 s1">이것이 몇 번 나왔는가</text></g><g ><g class="shape"><path d="M513 1029h255v66H513z" class="stroke-B1 fill-B6 s0"/></g><text x="640.5" y="1067.5" class="text-bold fill-N1 s1">이 근처에 무엇이 있는가</text></g><g ><g class="shape"><path d="M1104 0h323v114h-323z" class="stroke-B1 fill-B6 s0"/></g><text x="1265.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1265.5" dy="0">블룸 필터</tspan><tspan x="1265.5" dy="17.25">비트 배열 하나와 해시 k 개</tspan><tspan x="1265.5" dy="17.25">원소당 약 10비트로 오류 1%</tspan><tspan x="1265.5" dy="17.25">포기: 삭제 · 원소 목록 · 거짓 양성</tspan></text></g><g ><g class="shape"><path d="M1140 174h252v130h-252z" class="stroke-B1 fill-B6 s0"/></g><text x="1266" y="212.5" class="text-bold fill-N1 s1"><tspan x="1266" dy="0">쿠쿠 필터</tspan><tspan x="1266" dy="17">지문을 실제로 저장한다</tspan><tspan x="1266" dy="17">포기: 구현 복잡도 ·</tspan><tspan x="1266" dy="17">가득 차면 삽입 실패</tspan><tspan x="1266" dy="17">얻는 것: 삭제 · 개수 세기</tspan></text></g><g ><g class="shape"><path d="M1100 364h331v146h-331z" class="stroke-B1 fill-B6 s0"/></g><text x="1265.5" y="402.5" class="text-bold fill-N1 s1"><tspan x="1265.5" dy="0">HyperLogLog</tspan><tspan x="1265.5" dy="16.833">선행 0 의 최댓값을 버킷마다 모아</tspan><tspan x="1265.5" dy="16.833">조화평균</tspan><tspan x="1265.5" dy="16.833">12 KB 로 오차 0.81%</tspan><tspan x="1265.5" dy="16.833">포기: 삭제 · 정확한 값.</tspan><tspan x="1265.5" dy="16.833">얻는 것: 합집합</tspan></text></g><g ><g class="shape"><path d="M1118 570h296v130h-296z" class="stroke-B1 fill-B6 s0"/></g><text x="1266" y="608.5" class="text-bold fill-N1 s1"><tspan x="1266" dy="0">Count-Min Sketch</tspan><tspan x="1266" dy="17">행마다 다른 해시로 세고</tspan><tspan x="1266" dy="17">읽을 때 최솟값</tspan><tspan x="1266" dy="17">포기: 정확한 값(과대 추정만)</tspan><tspan x="1266" dy="17">치우친 자료일수록 잘 맞는다</tspan></text></g><g ><g class="shape"><path d="M1136 760h259v114h-259z" class="stroke-B1 fill-B6 s0"/></g><text x="1265.5" y="798.5" class="text-bold fill-N1 s1"><tspan x="1265.5" dy="0">균등 격자</tspan><tspan x="1265.5" dy="17.25">자리 계산이 나눗셈 두 번</tspan><tspan x="1265.5" dy="17.25">자료가 몰리면</tspan><tspan x="1265.5" dy="17.25">칸마다 부담이 들쭉날쭉</tspan></text></g><g ><g class="shape"><path d="M1138 934h255v98h-255z" class="stroke-B1 fill-B6 s0"/></g><text x="1265.5" y="972.5" class="text-bold fill-N1 s1"><tspan x="1265.5" dy="0">지오해시 — Z-곡선</tspan><tspan x="1265.5" dy="17.667">접두어가 곧 격자 주소라</tspan><tspan x="1265.5" dy="17.667">문자열 비교로 범위 질의</tspan></text></g><g ><g class="shape"><path d="M1150 1092h232v98h-232z" class="stroke-B1 fill-B6 s0"/></g><text x="1266" y="1130.5" class="text-bold fill-N1 s1"><tspan x="1266" dy="0">쿼드트리</tspan><tspan x="1266" dy="17.667">붐비는 칸만 쪼갠다.</tspan><tspan x="1266" dy="17.667">칸마다 부담이 고르다</tspan></text></g><g ><g class="shape"><path d="M1106 1250h319v98h-319z" class="stroke-B1 fill-B6 s0"/></g><text x="1265.5" y="1288.5" class="text-bold fill-N1 s1"><tspan x="1265.5" dy="0">구글 S2 — 힐베르트 곡선</tspan><tspan x="1265.5" dy="17.667">이웃이 끊기지 않아</tspan><tspan x="1265.5" dy="17.667">반경 질의에 조각이 덜 쪼개진다</tspan></text></g><path fill="transparent" stroke="transparent" d="M438 1368h555v226H438z" class="shape s0"/><text x="715.5" y="1408" class="fill-N1 s1"><tspan x="715.5" dy="0">네 확률적 구조의 공통점:</tspan><tspan x="715.5" dy="17.25">크기를 미리 정하고 그만큼만 쓴다.</tspan><tspan x="715.5" dy="17.25">HyperLogLog 말고는 예상보다 많이 넣으면 오차가 함께 커진다.</tspan><tspan x="715.5" dy="17.25">그리고 어느 것도 원소 자체를 되돌려 주지 않는다</tspan></text><text x="681" y="1501" class="fill-N1 s1"><tspan x="681" dy="0">실무에서 가장 흔한 쓰임은 ‘앞단 거르개’ 다.</tspan><tspan x="681" dy="17">블룸 필터가 없다고 하면 디스크를 읽지 않고 끝내고,</tspan><tspan x="681" dy="17">있다고 할 때만 진짜를 확인한다.</tspan><tspan x="681" dy="17">거짓 양성은 한 번 더 확인하는 값으로 끝나지만,</tspan><tspan x="681" dy="17">거짓 음성이었다면 자료를 잃었을 것이다</tspan></text><marker id="mk-d2-2349414523-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M199.1 481.33C374.4 215 439.7 148 520.5 148" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M270.865 494.277C388.6 448.6 437.1 437 507.5 437" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M270.869 578.713C388.6 623.6 439.5 635 519.5 635" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M189.875 591.799C372.6 967.6 437.5 1062 509.5 1062" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M748.911 114.41C897.4 68.6 968.8 57 1100 57" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><text x="922" y="70" class="text-italic fill-N2 s1">지울 일이 없다</text><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M748.911 181.59C897.4 227.4 975.9 239 1135.5 239" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><text x="940" y="239" class="text-italic fill-N2 s1">지워야 한다</text><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M772 437h324" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M760 635h353.5" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M681.538 1027.721C884 859.4 975.2 817 1132 817" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><text x="882.5" y="858" class="text-italic fill-N2 s1"><tspan x="882.5" dy="0">자료가 고르게</tspan><tspan x="882.5" dy="18.5">퍼져 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M765.931 1028.48C900.8 992.2 975.6 983 1134 983" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><text x="948" y="984" class="text-italic fill-N2 s1"><tspan x="948" dy="0">1차원 색인에</tspan><tspan x="948" dy="18.5">얹어야 한다</tspan></text><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M765.931 1095.52C900.8 1131.8 977.9 1141 1145.5 1141" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><text x="954.5" y="1144" class="text-italic fill-N2 s1">자료가 몰려 있다</text><path fill="none" marker-end="url(#mk-d2-2349414523-3488378134)" d="M683.557 1096.255C884.4 1258.2 969.2 1299 1102 1299" class="connection stroke-B1 s0" mask="url(#d2-2349414523)"/><text x="873.5" y="1247" class="text-italic fill-N2 s1"><tspan x="873.5" dy="0">반경 · 지오펜스가</tspan><tspan x="873.5" dy="18.5">중요하다</tspan></text><mask id="d2-2349414523" width="1633" height="1796" x="-101" y=