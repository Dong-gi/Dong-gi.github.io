<svg xmlns="http://www.w3.org/2000/svg" width="1233" height="2132" class="d2-1328975525 d2-svg" viewBox="-101 -101 1233 2132"><rect width="1233" height="2132" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1328975525 .text-bold{font-weight:700}.d2-1328975525 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1328975525 .fill-N1{fill:#0a0f25}.d2-1328975525 .fill-N2{fill:#676c7e}.d2-1328975525 .fill-B6{fill:#f7f8fe}.d2-1328975525 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="131.5" cy="668.5" class="shape stroke-B1 fill-B6 s0" rx="131.5" ry="78.5"/></g><text x="131.5" y="642" class="text-bold fill-N1 s1"><tspan x="131.5" dy="0">정확한 답을</tspan><tspan x="131.5" dy="17">담기에는</tspan><tspan x="131.5" dy="17">자료가 너무 크다</tspan><tspan x="131.5" dy="17">무엇을</tspan><tspan x="131.5" dy="17">묻고 있는가</tspan></text></g><g ><g class="shape"><path d="M405 163h168v82H405z" class="stroke-B1 fill-B6 s0"/></g><text x="489" y="201.5" class="text-bold fill-N1 s1"><tspan x="489" dy="0">이것이</tspan><tspan x="489" dy="18.5">집합에 있는가</tspan></text></g><g ><g class="shape"><path d="M403 508h171v82H403z" class="stroke-B1 fill-B6 s0"/></g><text x="488.5" y="546.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">서로 다른 것이</tspan><tspan x="488.5" dy="18.5">몇 개인가</tspan></text></g><g ><g class="shape"><path d="M403 746h171v82H403z" class="stroke-B1 fill-B6 s0"/></g><text x="488.5" y="784.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">이것이</tspan><tspan x="488.5" dy="18.5">몇 번 나왔는가</tspan></text></g><g ><g class="shape"><path d="M405 1257h168v82H405z" class="stroke-B1 fill-B6 s0"/></g><text x="489" y="1295.5" class="text-bold fill-N1 s1"><tspan x="489" dy="0">이 근처에</tspan><tspan x="489" dy="18.5">무엇이 있는가</tspan></text></g><g ><g class="shape"><path d="M819 0h208v178H819z" class="stroke-B1 fill-B6 s0"/></g><text x="923" y="38.5" class="text-bold fill-N1 s1"><tspan x="923" dy="0">블룸 필터</tspan><tspan x="923" dy="16.625">비트 배열 하나와</tspan><tspan x="923" dy="16.625">해시 k 개</tspan><tspan x="923" dy="16.625">원소당 약 10비트로</tspan><tspan x="923" dy="16.625">오류 1%</tspan><tspan x="923" dy="16.625">포기: 삭제 ·</tspan><tspan x="923" dy="16.625">원소 목록 ·</tspan><tspan x="923" dy="16.625">거짓 양성</tspan></text></g><g ><g class="shape"><path d="M815 238h215v162H815z" class="stroke-B1 fill-B6 s0"/></g><text x="922.5" y="276.5" class="text-bold fill-N1 s1"><tspan x="922.5" dy="0">쿠쿠 필터</tspan><tspan x="922.5" dy="16.714">지문을 실제로</tspan><tspan x="922.5" dy="16.714">저장한다</tspan><tspan x="922.5" dy="16.714">포기: 구현 복잡도 ·</tspan><tspan x="922.5" dy="16.714">가득 차면 삽입 실패</tspan><tspan x="922.5" dy="16.714">얻는 것: 삭제 ·</tspan><tspan x="922.5" dy="16.714">개수 세기</tspan></text></g><g ><g class="shape"><path d="M821 460h203v178H821z" class="stroke-B1 fill-B6 s0"/></g><text x="922.5" y="498.5" class="text-bold fill-N1 s1"><tspan x="922.5" dy="0">HyperLogLog</tspan><tspan x="922.5" dy="16.625">선행 0 의 최댓값을</tspan><tspan x="922.5" dy="16.625">버킷마다 모아</tspan><tspan x="922.5" dy="16.625">조화평균</tspan><tspan x="922.5" dy="16.625">12 KB 로 오차 0.81%</tspan><tspan x="922.5" dy="16.625">포기: 삭제 ·</tspan><tspan x="922.5" dy="16.625">정확한 값.</tspan><tspan x="922.5" dy="16.625">얻는 것: 합집합</tspan></text></g><g ><g class="shape"><path d="M817 698h212v178H817z" class="stroke-B1 fill-B6 s0"/></g><text x="923" y="736.5" class="text-bold fill-N1 s1"><tspan x="923" dy="0">Count-Min Sketch</tspan><tspan x="923" dy="16.625">행마다 다른 해시로</tspan><tspan x="923" dy="16.625">세고</tspan><tspan x="923" dy="16.625">읽을 때 최솟값</tspan><tspan x="923" dy="16.625">포기: 정확한 값</tspan><tspan x="923" dy="16.625">(과대 추정만)</tspan><tspan x="923" dy="16.625">치우친 자료일수록</tspan><tspan x="923" dy="16.625">잘 맞는다</tspan></text></g><g ><g class="shape"><path d="M839 936h168v146H839z" class="stroke-B1 fill-B6 s0"/></g><text x="923" y="974.5" class="text-bold fill-N1 s1"><tspan x="923" dy="0">균등 격자</tspan><tspan x="923" dy="16.833">자리 계산이</tspan><tspan x="923" dy="16.833">나눗셈 두 번</tspan><tspan x="923" dy="16.833">자료가 몰리면</tspan><tspan x="923" dy="16.833">칸마다 부담이</tspan><tspan x="923" dy="16.833">들쭉날쭉</tspan></text></g><g ><g class="shape"><path d="M825 1142h196v130H825z" class="stroke-B1 fill-B6 s0"/></g><text x="923" y="1180.5" class="text-bold fill-N1 s1"><tspan x="923" dy="0">지오해시 — Z-곡선</tspan><tspan x="923" dy="17">접두어가 곧</tspan><tspan x="923" dy="17">격자 주소라</tspan><tspan x="923" dy="17">문자열 비교로</tspan><tspan x="923" dy="17">범위 질의</tspan></text></g><g ><g class="shape"><path d="M814 1332h217v114H814z" class="stroke-B1 fill-B6 s0"/></g><text x="922.5" y="1370.5" class="text-bold fill-N1 s1"><tspan x="922.5" dy="0">쿼드트리</tspan><tspan x="922.5" dy="17.25">붐비는 칸만 쪼갠다.</tspan><tspan x="922.5" dy="17.25">칸마다 부담이</tspan><tspan x="922.5" dy="17.25">고르다</tspan></text></g><g ><g class="shape"><path d="M817 1506h212v130H817z" class="stroke-B1 fill-B6 s0"/></g><text x="923" y="1544.5" class="text-bold fill-N1 s1"><tspan x="923" dy="0">구글 S2 —</tspan><tspan x="923" dy="17">힐베르트 곡선</tspan><tspan x="923" dy="17">이웃이 끊기지 않아</tspan><tspan x="923" dy="17">반경 질의에 조각이</tspan><tspan x="923" dy="17">덜 쪼개진다</tspan></text></g><path fill="transparent" stroke="transparent" d="M292 1656h447v274H292z" class="shape s0"/><text x="492" y="1696" class="fill-N1 s1"><tspan x="492" dy="0">네 확률적 구조의 공통점:</tspan><tspan x="492" dy="16.833">크기를 미리 정하고 그만큼만 쓴다.</tspan><tspan x="492" dy="16.833">HyperLogLog 말고는</tspan><tspan x="492" dy="16.833">예상보다 많이 넣으면 오차가 함께 커진다.</tspan><tspan x="492" dy="16.833">그리고 어느 것도</tspan><tspan x="492" dy="16.833">원소 자체를 되돌려 주지 않는다</tspan></text><text x="515.5" y="1821" class="fill-N1 s1"><tspan x="515.5" dy="0">실무에서 가장 흔한 쓰임은 ‘앞단 거르개’ 다.</tspan><tspan x="515.5" dy="16.833">블룸 필터가 없다고 하면</tspan><tspan x="515.5" dy="16.833">디스크를 읽지 않고 끝내고,</tspan><tspan x="515.5" dy="16.833">있다고 할 때만 진짜를 확인한다.</tspan><tspan x="515.5" dy="16.833">거짓 양성은 한 번 더 확인하는 값으로 끝나지만,</tspan><tspan x="515.5" dy="16.833">거짓 음성이었다면 자료를 잃었을 것이다</tspan></text><marker id="mk-d2-1328975525-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M164.799 590.166C299.2 281.6 347.3 204 400.5 204" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M225.725 611.987C311.2 561.8 347 549 399 549" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M226.728 725.008C311.4 774.4 347 787 399 787" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M156.61 747.904C297.6 1187.6 347.3 1298 400.5 1298" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M563.745 162.022C667.6 103.8 718.9 89 814.5 89" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><text x="682.5" y="97" class="text-italic fill-N2 s1"><tspan x="682.5" dy="0">지울 일이</tspan><tspan x="682.5" dy="18.5">없다</tspan></text><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M563.745 245.978C667.6 304.2 718.2 319 811 319" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><text x="681" y="306" class="text-italic fill-N2 s1"><tspan x="681" dy="0">지워야</tspan><tspan x="681" dy="18.5">한다</tspan></text><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M576 549h241" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M576 787h236.5" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M519.157 1255.369C658.8 1058.6 722.9 1009 834.5 1009" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><text x="645.5" y="1067" class="text-italic fill-N2 s1"><tspan x="645.5" dy="0">자료가</tspan><tspan x="645.5" dy="17.667">고르게</tspan><tspan x="645.5" dy="17.667">퍼져 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M575.326 1259.987C669.9 1217.76 720.1 1207 820.5 1207" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><text x="694" y="1202" class="text-italic fill-N2 s1"><tspan x="694" dy="0">1차원</tspan><tspan x="694" dy="17.667">색인에</tspan><tspan x="694" dy="17.667">얹어야 한다</tspan></text><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M575.326 1336.012C669.9 1378.24 718 1389 810 1389" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><text x="689.5" y="1380" class="text-italic fill-N2 s1"><tspan x="689.5" dy="0">자료가</tspan><tspan x="689.5" dy="18.5">몰려 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-1328975525-3488378134)" d="M520.204 1340.597C659 1524.6 718.5 1571 812.5 1571" class="connection stroke-B1 s0" mask="url(#d2-1328975525)"/><text x="641.5" y="1491" class="text-italic fill-N2 s1"><tspan x="641.5" dy="0">반경 ·</tspan><tspan x="641.5" dy="17.667">지오펜스가</tspan><tspan x="641.5" dy="17.667">중요하다</tspan></text><mask id="d2-1328975525" width="1233" height="2132" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1233v2132H-101z"/><path d="M640 81h85v37h-85zM650 290h62v37h-62zM603 1051h85v53h-85zM642 1186h104v53H642zM647 1364h85v37h-85zM591 1475h101v53H591z"/></mask></svg>