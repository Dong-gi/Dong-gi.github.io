<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="2170" class="d2-127829480 d2-svg" viewBox="-89 -89 1184 2170"><rect width="1184" height="2170" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-127829480 .text-bold{font-weight:700}.d2-127829480 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-127829480 .fill-N1{fill:#0a0f25}.d2-127829480 .fill-N2{fill:#676c7e}.d2-127829480 .fill-B6{fill:#f7f8fe}.d2-127829480 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><text x="712.5" y="28" class="text-bold fill-N1 s0"><tspan x="712.5" dy="0">쿡-레빈 정리</tspan><tspan x="712.5" dy="17.25">모든 NP 문제를 SAT 으로</tspan><tspan x="712.5" dy="17.25">다항 시간에 바꿀 수 있다</tspan><tspan x="712.5" dy="17.25">— 맨바닥에서 처음 증명한 것</tspan></text><g ><g class="shape"><path d="M587 151h252v98H587z" class="stroke-B1 fill-B6 s1"/></g><text x="713" y="189.5" class="text-bold fill-N1 s0"><tspan x="713" dy="0">SAT</tspan><tspan x="713" dy="17.667">논리식을 참으로 만드는</tspan><tspan x="713" dy="17.667">변수값이 있는가</tspan></text></g><g ><g class="shape"><path d="M619 410h188v98H619z" class="stroke-B1 fill-B6 s1"/></g><text x="713" y="448.5" class="text-bold fill-N1 s0"><tspan x="713" dy="0">3SAT</tspan><tspan x="713" dy="17.667">절마다 리터럴이</tspan><tspan x="713" dy="17.667">정확히 셋인 SAT</tspan></text></g><g ><g class="shape"><path d="M215 748h203v98H215z" class="stroke-B1 fill-B6 s1"/></g><text x="316.5" y="786.5" class="text-bold fill-N1 s0"><tspan x="316.5" dy="0">클리크</tspan><tspan x="316.5" dy="17.667">서로 전부 이어진</tspan><tspan x="316.5" dy="17.667">정점 k 개가 있는가</tspan></text></g><g ><g class="shape"><path d="M126 1060h183v114H126z" class="stroke-B1 fill-B6 s1"/></g><text x="217.5" y="1098.5" class="text-bold fill-N1 s0"><tspan x="217.5" dy="0">정점 덮개</tspan><tspan x="217.5" dy="17.25">모든 간선에</tspan><tspan x="217.5" dy="17.25">닿는 정점 k 개가</tspan><tspan x="217.5" dy="17.25">있는가</tspan></text></g><g ><g class="shape"><path d="M329 1060h171v114H329z" class="stroke-B1 fill-B6 s1"/></g><text x="414.5" y="1098.5" class="text-bold fill-N1 s0"><tspan x="414.5" dy="0">독립 집합</tspan><tspan x="414.5" dy="17.25">서로 안 이어진</tspan><tspan x="414.5" dy="17.25">정점 k 개가</tspan><tspan x="414.5" dy="17.25">있는가</tspan></text></g><g ><g class="shape"><path d="M12 1361h191v114H12z" class="stroke-B1 fill-B6 s1"/></g><text x="107.5" y="1399.5" class="text-bold fill-N1 s0"><tspan x="107.5" dy="0">집합 덮개</tspan><tspan x="107.5" dy="17.25">원소를 전부 덮는</tspan><tspan x="107.5" dy="17.25">부분집합 k 개가</tspan><tspan x="107.5" dy="17.25">있는가</tspan></text></g><g ><g class="shape"><path d="M223 1361h212v114H223z" class="stroke-B1 fill-B6 s1"/></g><text x="329" y="1399.5" class="text-bold fill-N1 s0"><tspan x="329" dy="0">해밀턴 경로 · 순환</tspan><tspan x="329" dy="17.25">모든 정점을</tspan><tspan x="329" dy="17.25">정확히 한 번씩</tspan><tspan x="329" dy="17.25">지나는 길이 있는가</tspan></text></g><g ><g class="shape"><path d="M195 1652h267v98H195z" class="stroke-B1 fill-B6 s1"/></g><text x="328.5" y="1690.5" class="text-bold fill-N1 s0"><tspan x="328.5" dy="0">외판원 문제 (TSP)</tspan><tspan x="328.5" dy="17.667">길이 k 이하로 모든 도시를</tspan><tspan x="328.5" dy="17.667">도는 순회가 있는가</tspan></text></g><g ><g class="shape"><path d="M622 737h181v114H622z" class="stroke-B1 fill-B6 s1"/></g><text x="712.5" y="775.5" class="text-bold fill-N1 s0"><tspan x="712.5" dy="0">부분집합 합</tspan><tspan x="712.5" dy="17.25">합이 정확히 t 인</tspan><tspan x="712.5" dy="17.25">부분집합이</tspan><tspan x="712.5" dy="17.25">있는가</tspan></text></g><g ><g class="shape"><path d="M520 1060h186v98H520z" class="stroke-B1 fill-B6 s1"/></g><text x="613" y="1098.5" class="text-bold fill-N1 s0"><tspan x="613" dy="0">0-1 배낭 (판정형)</tspan><tspan x="613" dy="17.667">가치가 v 이상인</tspan><tspan x="613" dy="17.667">담기가 있는가</tspan></text></g><g ><g class="shape"><path d="M726 1060h171v114H726z" class="stroke-B1 fill-B6 s1"/></g><text x="811.5" y="1098.5" class="text-bold fill-N1 s0"><tspan x="811.5" dy="0">분할 문제</tspan><tspan x="811.5" dy="17.25">합이 같은</tspan><tspan x="811.5" dy="17.25">두 덩어리로</tspan><tspan x="811.5" dy="17.25">나눌 수 있는가</tspan></text></g><g ><g class="shape"><path d="M823 727h171v130H823z" class="stroke-B1 fill-B6 s1"/></g><text x="908.5" y="765.5" class="text-bold fill-N1 s0"><tspan x="908.5" dy="0">그래프 3-색칠</tspan><tspan x="908.5" dy="17">이웃끼리</tspan><tspan x="908.5" dy="17">다른 색으로</tspan><tspan x="908.5" dy="17">세 가지 안에</tspan><tspan x="908.5" dy="17">칠할 수 있는가</tspan></text></g><path fill="transparent" stroke="transparent" d="M263 1770h479v210H263z" class="shape s1"/><text x="453" y="1810" class="fill-N1 s0"><tspan x="453" dy="0">읽는 법:</tspan><tspan x="453" dy="17">위에 있는 것이 아래로 환원된다</tspan><tspan x="453" dy="17">= 아래가 위만큼 어렵다.</tspan><tspan x="453" dy="17">이 지도의 모든 문제는 NP 안에 있으므로</tspan><tspan x="453" dy="17">전부 NP-완전이다</tspan></text><text x="502.5" y="1919" class="fill-N1 s0"><tspan x="502.5" dy="0">화살표를 거꾸로 그리면 아무것도 증명하지 못한다.</tspan><tspan x="502.5" dy="17.667">새 문제가 어렵다고 말하려면</tspan><tspan x="502.5" dy="17.667">‘이미 어려운 것’ 을 새 문제로 보내야 한다</tspan></text><marker id="mk-d2-127829480-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M713 83v64" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M713 251v155" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="713.5" y="335" class="text-italic fill-N2 s0">절을 셋씩 쪼갠다</text><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M666 510v28s0 10-10 10H326.75s-10 0-10 10v186" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="411.5" y="530" class="text-italic fill-N2 s0"><tspan x="411.5" dy="0">절마다</tspan><tspan x="411.5" dy="17.25">점 셋을 찍고</tspan><tspan x="411.5" dy="17.25">모순이 아닌</tspan><tspan x="411.5" dy="17.25">것끼리 잇는다</tspan></text><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M282.916 848v208" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="282.5" y="943" class="text-italic fill-N2 s0"><tspan x="282.5" dy="0">간선을</tspan><tspan x="282.5" dy="17.667">뒤집는다</tspan><tspan x="282.5" dy="17.667">(k ↔ n − k)</tspan></text><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M350.583 848v208" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="350.5" y="951" class="text-italic fill-N2 s0"><tspan x="350.5" dy="0">간선을</tspan><tspan x="350.5" dy="18.5">뒤집는다</tspan></text><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M187.75 1176v28s0 10-10 10H117.5s-10 0-10 10v133" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="107.5" y="1225" class="text-italic fill-N2 s0"><tspan x="107.5" dy="0">정점을</tspan><tspan x="107.5" dy="18.5">집합으로 본다</tspan></text><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M248.75 1176v181" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="248.5" y="1265" class="text-italic fill-N2 s0"><tspan x="248.5" dy="0">간선마다</tspan><tspan x="248.5" dy="18.5">가젯을 붙인다</tspan></text><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M329 1477v171" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="329" y="1561" class="text-italic fill-N2 s0"><tspan x="329" dy="0">있는 간선은 1,</tspan><tspan x="329" dy="18.5">없는 간선은 2 로 놓는다</tspan></text><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M713 509.666v224" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="713" y="620" class="text-italic fill-N2 s0"><tspan x="713" dy="0">변수와 절을</tspan><tspan x="713" dy="18.5">자릿수로 옮긴다</tspan></text><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M682.833 854v202" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="682.5" y="954" class="text-italic fill-N2 s0"><tspan x="682.5" dy="0">무게 = 가치로</tspan><tspan x="682.5" dy="18.5">놓는다</tspan></text><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M743.166 854v33s0 10 10 10h49.084s10 0 10 10v149" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="812.5" y="919" class="text-italic fill-N2 s0"><tspan x="812.5" dy="0">합을 맞추는</tspan><tspan x="812.5" dy="18.5">원소 하나를 더한다</tspan></text><path fill="none" marker-end="url(#mk-d2-127829480-3488378134)" d="M760 510v28s0 10 10 10h129s10 0 10 10v165" class="connection stroke-B1 s1" mask="url(#d2-127829480)"/><text x="904" y="546" class="text-italic fill-N2 s0"><tspan x="904" dy="0">변수마다</tspan><tspan x="904" dy="18.5">삼각형 가젯</tspan></text><mask id="d2-127829480" width="1184" height="2170" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1184v2170H-89z"/><path d="M641 319h145v21H641zM350 514h123v69H350zM242 927h81v53h-81z"/><path d="M310 935h81v37h-81zM46 1209h123v37H46zM187 1249h123v37H187zM230 1545h198v37H230zM642 604h142v37H642zM625 938h115v37H625z"/><path d="M730 903h165v37H730zM852 530h104v37H852z"/></mask></svg>