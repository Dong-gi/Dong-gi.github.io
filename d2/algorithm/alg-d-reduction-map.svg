<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="1994" class="d2-1841339165 d2-svg" viewBox="-89 -89 1424 1994"><rect width="1424" height="1994" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1841339165 .text-bold{font-weight:700}.d2-1841339165 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1841339165 .fill-N1{fill:#0a0f25}.d2-1841339165 .fill-N2{fill:#676c7e}.d2-1841339165 .fill-B6{fill:#f7f8fe}.d2-1841339165 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><text x="827" y="28" class="text-bold fill-N1 s0"><tspan x="827" dy="0">쿡-레빈 정리</tspan><tspan x="827" dy="17.667">모든 NP 문제를 SAT 으로 다항 시간에 바꿀 수 있다</tspan><tspan x="827" dy="17.667">— 맨바닥에서 처음 증명한 것</tspan></text><g ><g class="shape"><path d="M701 135h252v98H701z" class="stroke-B1 fill-B6 s1"/></g><text x="827" y="173.5" class="text-bold fill-N1 s0"><tspan x="827" dy="0">SAT</tspan><tspan x="827" dy="17.667">논리식을 참으로 만드는</tspan><tspan x="827" dy="17.667">변수값이 있는가</tspan></text></g><g ><g class="shape"><path d="M664 394h327v82H664z" class="stroke-B1 fill-B6 s1"/></g><text x="827.5" y="432.5" class="text-bold fill-N1 s0"><tspan x="827.5" dy="0">3SAT</tspan><tspan x="827.5" dy="18.5">절마다 리터럴이 정확히 셋인 SAT</tspan></text></g><g ><g class="shape"><path d="M284 663h203v98H284z" class="stroke-B1 fill-B6 s1"/></g><text x="385.5" y="701.5" class="text-bold fill-N1 s0"><tspan x="385.5" dy="0">클리크</tspan><tspan x="385.5" dy="17.667">서로 전부 이어진</tspan><tspan x="385.5" dy="17.667">정점 k 개가 있는가</tspan></text></g><g ><g class="shape"><path d="M173 964h203v98H173z" class="stroke-B1 fill-B6 s1"/></g><text x="274.5" y="1002.5" class="text-bold fill-N1 s0"><tspan x="274.5" dy="0">정점 덮개</tspan><tspan x="274.5" dy="17.667">모든 간선에 닿는</tspan><tspan x="274.5" dy="17.667">정점 k 개가 있는가</tspan></text></g><g ><g class="shape"><path d="M396 964h203v98H396z" class="stroke-B1 fill-B6 s1"/></g><text x="497.5" y="1002.5" class="text-bold fill-N1 s0"><tspan x="497.5" dy="0">독립 집합</tspan><tspan x="497.5" dy="17.667">서로 안 이어진</tspan><tspan x="497.5" dy="17.667">정점 k 개가 있는가</tspan></text></g><g ><g class="shape"><path d="M12 1249h244v98H12z" class="stroke-B1 fill-B6 s1"/></g><text x="134" y="1287.5" class="text-bold fill-N1 s0"><tspan x="134" dy="0">집합 덮개</tspan><tspan x="134" dy="17.667">원소를 전부 덮는</tspan><tspan x="134" dy="17.667">부분집합 k 개가 있는가</tspan></text></g><g ><g class="shape"><path d="M276 1249h279v98H276z" class="stroke-B1 fill-B6 s1"/></g><text x="415.5" y="1287.5" class="text-bold fill-N1 s0"><tspan x="415.5" dy="0">해밀턴 경로 · 순환</tspan><tspan x="415.5" dy="17.667">모든 정점을 정확히 한 번씩</tspan><tspan x="415.5" dy="17.667">지나는 길이 있는가</tspan></text></g><g ><g class="shape"><path d="M282 1524h267v98H282z" class="stroke-B1 fill-B6 s1"/></g><text x="415.5" y="1562.5" class="text-bold fill-N1 s0"><tspan x="415.5" dy="0">외판원 문제 (TSP)</tspan><tspan x="415.5" dy="17.667">길이 k 이하로 모든 도시를</tspan><tspan x="415.5" dy="17.667">도는 순회가 있는가</tspan></text></g><g ><g class="shape"><path d="M723 663h209v98H723z" class="stroke-B1 fill-B6 s1"/></g><text x="827.5" y="701.5" class="text-bold fill-N1 s0"><tspan x="827.5" dy="0">부분집합 합</tspan><tspan x="827.5" dy="17.667">합이 정확히 t 인</tspan><tspan x="827.5" dy="17.667">부분집합이 있는가</tspan></text></g><g ><g class="shape"><path d="M619 964h186v98H619z" class="stroke-B1 fill-B6 s1"/></g><text x="712" y="1002.5" class="text-bold fill-N1 s0"><tspan x="712" dy="0">0-1 배낭 (판정형)</tspan><tspan x="712" dy="17.667">가치가 v 이상인</tspan><tspan x="712" dy="17.667">담기가 있는가</tspan></text></g><g ><g class="shape"><path d="M825 964h235v98H825z" class="stroke-B1 fill-B6 s1"/></g><text x="942.5" y="1002.5" class="text-bold fill-N1 s0"><tspan x="942.5" dy="0">분할 문제</tspan><tspan x="942.5" dy="17.667">합이 같은 두 덩어리로</tspan><tspan x="942.5" dy="17.667">나눌 수 있는가</tspan></text></g><g ><g class="shape"><path d="M952 663h282v98H952z" class="stroke-B1 fill-B6 s1"/></g><text x="1093" y="701.5" class="text-bold fill-N1 s0"><tspan x="1093" dy="0">그래프 3-색칠</tspan><tspan x="1093" dy="17.667">이웃끼리 다른 색으로</tspan><tspan x="1093" dy="17.667">세 가지 안에 칠할 수 있는가</tspan></text></g><path fill="transparent" stroke="transparent" d="M296 1642h653v162H296z" class="shape s1"/><text x="560.5" y="1682" class="fill-N1 s0"><tspan x="560.5" dy="0">읽는 법:</tspan><tspan x="560.5" dy="17.667">위에 있는 것이 아래로 환원된다 = 아래가 위만큼 어렵다.</tspan><tspan x="560.5" dy="17.667">이 지도의 모든 문제는 NP 안에 있으므로 전부 NP-완전이다</tspan></text><text x="622.5" y="1759" class="fill-N1 s0"><tspan x="622.5" dy="0">화살표를 거꾸로 그리면 아무것도 증명하지 못한다.</tspan><tspan x="622.5" dy="18.5">새 문제가 어렵다고 말하려면 ‘이미 어려운 것’ 을 새 문제로 보내야 한다</tspan></text><marker id="mk-d2-1841339165-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M827.5 67v64" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M827.5 235v155" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="827.5" y="319" class="text-italic fill-N2 s0">절을 셋씩 쪼갠다</text><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M745.75 478v28s0 10-10 10h-339.5s-10 0-10 10v133" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="513" y="514" class="text-italic fill-N2 s0"><tspan x="513" dy="0">절마다 점 셋을 찍고</tspan><tspan x="513" dy="18.5">모순이 아닌 것끼리 잇는다</tspan></text><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M352.416 763v197" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="352.5" y="852" class="text-italic fill-N2 s0"><tspan x="352.5" dy="0">간선을</tspan><tspan x="352.5" dy="17.667">뒤집는다</tspan><tspan x="352.5" dy="17.667">(k ↔ n − k)</tspan></text><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M420.083 763v197" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="420.5" y="860" class="text-italic fill-N2 s0"><tspan x="420.5" dy="0">간선을</tspan><tspan x="420.5" dy="18.5">뒤집는다</tspan></text><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M240.916 1064v28s0 10-10 10H144s-10 0-10 10v133" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="134.5" y="1100" class="text-italic fill-N2 s0"><tspan x="134.5" dy="0">정점을</tspan><tspan x="134.5" dy="18.5">집합으로 본다</tspan></text><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M308.583 1064v181" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="308.5" y="1153" class="text-italic fill-N2 s0"><tspan x="308.5" dy="0">간선마다</tspan><tspan x="308.5" dy="18.5">가젯을 붙인다</tspan></text><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M415.5 1349v171" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="416" y="1433" class="text-italic fill-N2 s0"><tspan x="416" dy="0">있는 간선은 1,</tspan><tspan x="416" dy="18.5">없는 간선은 2 로 놓는다</tspan></text><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M827.5 478v181" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="828" y="567" class="text-italic fill-N2 s0"><tspan x="828" dy="0">변수와 절을</tspan><tspan x="828" dy="18.5">자릿수로 옮긴다</tspan></text><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M792.666 763v28s0 10-10 10H722.25s-10 0-10 10v149" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="712" y="828" class="text-italic fill-N2 s0">무게 = 가치로 놓는다</text><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M862.333 763v197" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="862.5" y="860" class="text-italic fill-N2 s0"><tspan x="862.5" dy="0">합을 맞추는</tspan><tspan x="862.5" dy="18.5">원소 하나를 더한다</tspan></text><path fill="none" marker-end="url(#mk-d2-1841339165-3488378134)" d="M909.25 478v28s0 10 10 10H1083s10 0 10 10v133" class="connection stroke-B1 s1" mask="url(#d2-1841339165)"/><text x="1055" y="514" class="text-italic fill-N2 s0"><tspan x="1055" dy="0">변수마다</tspan><tspan x="1055" dy="18.5">삼각형 가젯</tspan></text><mask id="d2-1841339165" width="1424" height="1994" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1424v1994H-89z"/><path d="M755 303h145v21H755zM400 498h226v37H400zM312 836h81v53h-81z"/><path d="M380 844h81v37h-81zM73 1084h123v37H73zM247 1137h123v37H247zM317 1417h198v37H317zM757 551h142v37H757zM624 812h176v21H624zM780 844h165v37H780zM1003 498h104v37h-104z"/></mask></svg>