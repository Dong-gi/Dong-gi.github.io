<svg xmlns="http://www.w3.org/2000/svg" width="2719" height="1516" class="d2-4103886581 d2-svg" viewBox="-101 -101 2719 1516"><rect width="2719" height="1516" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4103886581 .fill-N1{fill:#0a0f25}.d2-4103886581 .fill-N2{fill:#676c7e}.d2-4103886581 .fill-B6{fill:#f7f8fe}.d2-4103886581 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><text x="1102" y="16" class="text-bold fill-N1 s0"><tspan x="1102" dy="0">쿡-레빈 정리</tspan><tspan x="1102" dy="17.667">모든 NP 문제를 SAT 으로 다항 시간에 바꿀 수 있다</tspan><tspan x="1102" dy="17.667">— 유일하게 맨바닥에서 증명한 것</tspan></text><g ><g class="shape"><path d="M976 153h252v98H976z" class="stroke-B1 fill-B6 s1"/></g><text x="1102" y="191.5" class="text-bold fill-N1 s0"><tspan x="1102" dy="0">SAT</tspan><tspan x="1102" dy="17.667">논리식을 참으로 만드는</tspan><tspan x="1102" dy="17.667">변수값이 있는가</tspan></text></g><g ><g class="shape"><path d="M938 372h327v82H938z" class="stroke-B1 fill-B6 s1"/></g><text x="1101.5" y="410.5" class="text-bold fill-N1 s0"><tspan x="1101.5" dy="0">3SAT</tspan><tspan x="1101.5" dy="18.5">절마다 리터럴이 정확히 셋인 SAT</tspan></text></g><g ><g class="shape"><path d="M464 591h355v82H464z" class="stroke-B1 fill-B6 s1"/></g><text x="641.5" y="629.5" class="text-bold fill-N1 s0"><tspan x="641.5" dy="0">클리크</tspan><tspan x="641.5" dy="18.5">서로 전부 이어진 정점 k 개가 있는가</tspan></text></g><g ><g class="shape"><path d="M261 810h355v82H261z" class="stroke-B1 fill-B6 s1"/></g><text x="438.5" y="848.5" class="text-bold fill-N1 s0"><tspan x="438.5" dy="0">정점 덮개</tspan><tspan x="438.5" dy="18.5">모든 간선에 닿는 정점 k 개가 있는가</tspan></text></g><g ><g class="shape"><path d="M676 810h334v82H676z" class="stroke-B1 fill-B6 s1"/></g><text x="843" y="848.5" class="text-bold fill-N1 s0"><tspan x="843" dy="0">독립 집합</tspan><tspan x="843" dy="18.5">서로 안 이어진 정점 k 개가 있는가</tspan></text></g><g ><g class="shape"><path d="M0 1013h395v82H0z" class="stroke-B1 fill-B6 s1"/></g><text x="197.5" y="1051.5" class="text-bold fill-N1 s0"><tspan x="197.5" dy="0">집합 덮개</tspan><tspan x="197.5" dy="18.5">원소를 전부 덮는 부분집합 k 개가 있는가</tspan></text></g><g ><g class="shape"><path d="M455 1013h450v82H455z" class="stroke-B1 fill-B6 s1"/></g><text x="680" y="1051.5" class="text-bold fill-N1 s0"><tspan x="680" dy="0">해밀턴 경로 · 순환</tspan><tspan x="680" dy="18.5">모든 정점을 정확히 한 번씩 지나는 길이 있는가</tspan></text></g><g ><g class="shape"><path d="M461 1232h439v82H461z" class="stroke-B1 fill-B6 s1"/></g><text x="680.5" y="1270.5" class="text-bold fill-N1 s0"><tspan x="680.5" dy="0">외판원 문제 (TSP)</tspan><tspan x="680.5" dy="18.5">길이 k 이하로 모든 도시를 도는 순회가 있는가</tspan></text></g><g ><g class="shape"><path d="M1248 591h349v82h-349z" class="stroke-B1 fill-B6 s1"/></g><text x="1422.5" y="629.5" class="text-bold fill-N1 s0"><tspan x="1422.5" dy="0">부분집합 합</tspan><tspan x="1422.5" dy="18.5">합이 정확히 t 인 부분집합이 있는가</tspan></text></g><g ><g class="shape"><path d="M1070 810h307v82h-307z" class="stroke-B1 fill-B6 s1"/></g><text x="1223.5" y="848.5" class="text-bold fill-N1 s0"><tspan x="1223.5" dy="0">0-1 배낭 (판정형)</tspan><tspan x="1223.5" dy="18.5">가치가 v 이상인 담기가 있는가</tspan></text></g><g ><g class="shape"><path d="M1437 810h366v82h-366z" class="stroke-B1 fill-B6 s1"/></g><text x="1620" y="848.5" class="text-bold fill-N1 s0"><tspan x="1620" dy="0">분할 문제</tspan><tspan x="1620" dy="18.5">합이 같은 두 덩어리로 나눌 수 있는가</tspan></text></g><g ><g class="shape"><path d="M1657 591h474v82h-474z" class="stroke-B1 fill-B6 s1"/></g><text x="1894" y="629.5" class="text-bold fill-N1 s0"><tspan x="1894" dy="0">그래프 3-색칠</tspan><tspan x="1894" dy="18.5">이웃끼리 다른 색으로 세 가지 안에 칠할 수 있는가</tspan></text></g><text x="1611.5" y="16" class="fill-N1 s0"><tspan x="1611.5" dy="0">읽는 법:</tspan><tspan x="1611.5" dy="17.667">위에 있는 것이 아래로 환원된다 = 아래가 위만큼 어렵다.</tspan><tspan x="1611.5" dy="17.667">이 지도의 모든 문제는 NP 안에 있으므로 전부 NP-완전이다</tspan></text><text x="2214.5" y="24" class="fill-N1 s0"><tspan x="2214.5" dy="0">화살표를 거꾸로 그리면 아무것도 증명하지 못한다.</tspan><tspan x="2214.5" dy="18.5">새 문제가 어렵다고 말하려면 ‘이미 어려운 것’ 을 새 문제로 보내야 한다</tspan></text><marker id="mk-d2-4103886581-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M1101.5 55v94" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M1101.5 252.5v116" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="1101.5" y="317" class="text-italic fill-N2 s0">절을 셋씩 쪼갠다</text><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M936.055 451.965C700.4 508.3 641 536.3 641 587.5" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="760" y="491" class="text-italic fill-N2 s0"><tspan x="760" dy="0">절마다 점 셋을 찍고</tspan><tspan x="760" dy="18.5">모순이 아닌 것끼리 잇는다</tspan></text><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M563.993 673.455C464.15 727.7 438.75 755.3 438.75 806.5" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="474" y="720" class="text-italic fill-N2 s0"><tspan x="474" dy="0">간선을 뒤집는다</tspan><tspan x="474" dy="18.5">(k ↔ n − k)</tspan></text><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M718.007 673.455C817.85 727.7 843.25 755.3 843.25 806.5" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="808" y="728" class="text-italic fill-N2 s0">간선을 뒤집는다</text><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M339.658 892.28C226.3 940.3 197.5 964.7 197.5 1009.5" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="244" y="938" class="text-italic fill-N2 s0">정점을 집합으로 본다</text><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M537.842 892.28C651.2 940.3 680 964.7 680 1009.5" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="633.5" y="938" class="text-italic fill-N2 s0">정점마다 가젯을 붙인다</text><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M680 1096.5v132" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="680" y="1161" class="text-italic fill-N2 s0"><tspan x="680" dy="0">있는 간선은 1,</tspan><tspan x="680" dy="18.5">없는 간선은 2 로 놓는다</tspan></text><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M1223.89 454.152C1382 508.7 1422 536.3 1422 587.5" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="1351.5" y="504" class="text-italic fill-N2 s0">변수와 절을 자릿수로 옮긴다</text><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M1346.002 673.472C1248.55 727.7 1223.75 755.3 1223.75 806.5" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="1258" y="728" class="text-italic fill-N2 s0">무게 = 가치로 놓는다</text><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M1497.998 673.472C1595.45 727.7 1620.25 755.3 1620.25 806.5" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="1586.5" y="728" class="text-italic fill-N2 s0">목표를 총합의 절반으로</text><path fill="none" marker-end="url(#mk-d2-4103886581-3488378134)" d="M1266.481 435.774C1767.7 505.1 1893.5 536.3 1893.5 587.5" class="connection stroke-B1 s1" mask="url(#d2-4103886581)"/><text x="1608" y="488" class="text-italic fill-N2 s0">변수마다 삼각형 가젯</text><mask id="d2-4103886581" width="2719" height="1516" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2719v1516H-101z"/><path d="M1029 301h145v21h-145zM647 475h226v37H647zM403 704h142v37H403zM737 712h142v21H737zM152 922h184v21H152zM532 922h203v21H532zM581 1145h198v37H581zM1229 488h245v21h-245zM1170 712h176v21h-176zM1485 712h203v21h-203zM1516 472h184v21h-184z"/></mask></svg>