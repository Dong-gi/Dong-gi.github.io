<svg xmlns="http://www.w3.org/2000/svg" width="5032" height="900" class="d2-4112128046 d2-svg" viewBox="-101 -101 5032 900"><rect width="5032" height="900" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4112128046 .fill-N1{fill:#0a0f25}.d2-4112128046 .fill-B6{fill:#f7f8fe}.d2-4112128046 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="334.5" cy="341" class="shape stroke-B1 fill-B6 s0" rx="147.5" ry="49"/></g><text x="334.5" y="346.5" class="text-bold fill-N1 s1">무엇을 지키려는가</text></g><g ><g class="shape"><path d="M971 608h151v82H971z" class="stroke-B1 fill-B6 s0"/></g><text x="1046.5" y="646.5" class="text-bold fill-N1 s1"><tspan x="1046.5" dy="0">기밀성</tspan><tspan x="1046.5" dy="18.5">남이 못 읽게</tspan></text></g><g ><g class="shape"><path d="M2817 0h171v82h-171z" class="stroke-B1 fill-B6 s0"/></g><text x="2902.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="2902.5" dy="0">무결성</tspan><tspan x="2902.5" dy="18.5">몰래 못 고치게</tspan></text></g><g ><g class="shape"><path d="M2808 142h188v82h-188z" class="stroke-B1 fill-B6 s0"/></g><text x="2902" y="180.5" class="text-bold fill-N1 s1"><tspan x="2902" dy="0">인증</tspan><tspan x="2902" dy="18.5">상대가 누구인지</tspan></text></g><g ><g class="shape"><path d="M2795 458h215v82h-215z" class="stroke-B1 fill-B6 s0"/></g><text x="2902.5" y="496.5" class="text-bold fill-N1 s1"><tspan x="2902.5" dy="0">부인 방지</tspan><tspan x="2902.5" dy="18.5">나중에 발뺌 못 하게</tspan></text></g><g ><g class="shape"><path d="M1425 600h368v98h-368z" class="stroke-B1 fill-B6 s0"/></g><text x="1609" y="638.5" class="text-bold fill-N1 s1"><tspan x="1609" dy="0">대칭키 암호</tspan><tspan x="1609" dy="17.667">AES 같은 블록 암호 + 운용 모드</tspan><tspan x="1609" dy="17.667">빠르다. 열쇠를 미리 나눠 가져야 한다</tspan></text></g><g ><g class="shape"><path d="M2096 616h299v66h-299z" class="stroke-B1 fill-B6 s0"/></g><text x="2245.5" y="654.5" class="text-bold fill-N1 s1">그 열쇠를 어떻게 나눠 갖는가</text></g><g ><g class="shape"><path d="M2698 600h408v98h-408z" class="stroke-B1 fill-B6 s0"/></g><text x="2902" y="638.5" class="text-bold fill-N1 s1"><tspan x="2902" dy="0">공개키 암호 · 키 합의</tspan><tspan x="2902" dy="17.667">RSA · 디피-헬만 · 타원곡선</tspan><tspan x="2902" dy="17.667">느리다. 그래서 대칭키를 나누는 데만 쓴다</tspan></text></g><g ><g class="shape"><path d="M3681 63h386v98h-386z" class="stroke-B1 fill-B6 s0"/></g><text x="3874" y="101.5" class="text-bold fill-N1 s1"><tspan x="3874" dy="0">MAC (HMAC)</tspan><tspan x="3874" dy="17.667">키를 섞은 해시</tspan><tspan x="3874" dy="17.667">보내는 쪽과 받는 쪽이 같은 키를 갖는다</tspan></text></g><g ><g class="shape"><path d="M3672 440h403v98h-403z" class="stroke-B1 fill-B6 s0"/></g><text x="3873.5" y="478.5" class="text-bold fill-N1 s1"><tspan x="3873.5" dy="0">전자 서명</tspan><tspan x="3873.5" dy="17.667">비밀키로 만들고 공개키로 확인한다</tspan><tspan x="3873.5" dy="17.667">만든 사람이 하나뿐이므로 발뺌할 수 없다</tspan></text></g><g ><g class="shape"><path d="M4378 351h452v98h-452z" class="stroke-B1 fill-B6 s0"/></g><text x="4604" y="389.5" class="text-bold fill-N1 s1"><tspan x="4604" dy="0">인증서와 인증기관</tspan><tspan x="4604" dy="17.667">‘이 공개키가 이 이름의 것이다’ 를 서명해 준다</tspan><tspan x="4604" dy="17.667">중간자 공격을 막는 마지막 조각</tspan></text></g><g ><g class="shape"><path d="M2708 284h389v114h-389z" class="stroke-B1 fill-B6 s0"/></g><text x="2902.5" y="322.5" class="text-bold fill-N1 s1"><tspan x="2902.5" dy="0">암호학적 해시</tspan><tspan x="2902.5" dy="17.25">SHA-2 · SHA-3</tspan><tspan x="2902.5" dy="17.25">역상 · 제2역상 · 충돌 저항</tspan><tspan x="2902.5" dy="17.25">5장의 자료구조용 해시와 목적이 다르다</tspan></text></g><text x="334" y="466" class="text-bold fill-N1 s1"><tspan x="334" dy="0">직접 구현하지 마라.</tspan><tspan x="334" dy="17.25">원리를 아는 것과 안전하게 구현하는 것은 다른 일이다.</tspan><tspan x="334" dy="17.25">실행 시간과 전력 소모까지 열쇠를 흘리고, 난수 하나가 나빠도 전부 무너진다.</tspan><tspan x="334" dy="17.25">검증된 라이브러리를 쓰고, 정한 규격 그대로 쓴다</tspan></text><marker id="mk-d2-4112128046-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M404.687 385.074C736.2 596 849.9 649 967.5 649" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M405.7 296.948C736.4 92.399 864.9 41 933 41h1879.5" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M441.901 306.379C743.6 207.8 864.9 183 933 183h1871.5" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M441.901 375.621C743.6 474.2 864.9 499 933 499h1857.5" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M1123.5 649h298" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M1794.5 649h298" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M2396.5 649h298" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M2990.5 41c318.4 0 456.8 8.543 686.042 42.137" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M2998 183c312.4 0 449.3-8.544 678.542-42.138" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><text x="3339.5" y="187" style="fill:#676c7e;text-anchor:middle;font-size:16px">상대가 그 키를 가졌다는 뜻에서</text><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M2950.509 82.813C3301 387.9 3445.6 467.3 3668.005 478.303" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M3012.5 499c300.8 0 433.1-1.2 655.5-5.915" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M3108 649c224.4 0 348.2-22.2 613.202-109.745" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M2995.827 224.814C3310 364.8 3485.9 400 3631.25 400h743.25" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M4076.5 489c119.6 0 184-8 316.106-39.084" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M3099.5 341c231.2 0 365.7-36 666.883-178.291" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><path fill="none" marker-end="url(#mk-d2-4112128046-3488378134)" d="M2988.658 399.118C3308.6 614.8 3459.6 642.8 3738.25 539.392" class="connection stroke-B1 s0" mask="url(#d2-4112128046)"/><mask id="d2-4112128046" width="5032" height="900" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h5032v900H-101z"/><path d="M3206 171h267v21h-267z"/></mask></svg>