<svg xmlns="http://www.w3.org/2000/svg" width="1219" height="1763" class="d2-4105936226 d2-svg" viewBox="-89 -89 1219 1763"><rect width="1219" height="1763" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-4105936226 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4105936226 .fill-N1{fill:#0a0f25}.d2-4105936226 .fill-B6{fill:#f7f8fe}.d2-4105936226 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="492.5" cy="61" class="shape stroke-B1 fill-B6 s0" rx="147.5" ry="49"/></g><text x="492.5" y="66.5" class="text-bold fill-N1 s1">무엇을 지키려는가</text></g><g ><g class="shape"><path d="M48 240h151v82H48z" class="stroke-B1 fill-B6 s0"/></g><text x="123.5" y="278.5" class="text-bold fill-N1 s1"><tspan x="123.5" dy="0">기밀성</tspan><tspan x="123.5" dy="18.5">남이 못 읽게</tspan></text></g><g ><g class="shape"><path d="M620 796h171v82H620z" class="stroke-B1 fill-B6 s0"/></g><text x="705.5" y="834.5" class="text-bold fill-N1 s1"><tspan x="705.5" dy="0">무결성</tspan><tspan x="705.5" dy="18.5">몰래 못 고치게</tspan></text></g><g ><g class="shape"><path d="M841 592h188v82H841z" class="stroke-B1 fill-B6 s0"/></g><text x="935" y="630.5" class="text-bold fill-N1 s1"><tspan x="935" dy="0">인증</tspan><tspan x="935" dy="18.5">상대가 누구인지</tspan></text></g><g ><g class="shape"><path d="M252 408h151v98H252z" class="stroke-B1 fill-B6 s0"/></g><text x="327.5" y="446.5" class="text-bold fill-N1 s1"><tspan x="327.5" dy="0">부인 방지</tspan><tspan x="327.5" dy="17.667">나중에</tspan><tspan x="327.5" dy="17.667">발뺌 못 하게</tspan></text></g><g ><g class="shape"><path d="M15 392h217v130H15z" class="stroke-B1 fill-B6 s0"/></g><text x="123.5" y="430.5" class="text-bold fill-N1 s1"><tspan x="123.5" dy="0">대칭키 암호</tspan><tspan x="123.5" dy="17">AES 같은 블록 암호 +</tspan><tspan x="123.5" dy="17">운용 모드</tspan><tspan x="123.5" dy="17">빠르다. 열쇠를 미리</tspan><tspan x="123.5" dy="17">나눠 가져야 한다</tspan></text></g><g ><g class="shape"><path d="M17 592h212v82H17z" class="stroke-B1 fill-B6 s0"/></g><text x="123" y="630.5" class="text-bold fill-N1 s1"><tspan x="123" dy="0">그 열쇠를</tspan><tspan x="123" dy="18.5">어떻게 나눠 갖는가</tspan></text></g><g ><g class="shape"><path d="M12 754h223v146H12z" class="stroke-B1 fill-B6 s0"/></g><text x="123.5" y="792.5" class="text-bold fill-N1 s1"><tspan x="123.5" dy="0">공개키 암호 · 키 합의</tspan><tspan x="123.5" dy="16.833">RSA · 디피-헬만 ·</tspan><tspan x="123.5" dy="16.833">타원곡선</tspan><tspan x="123.5" dy="16.833">느리다. 그래서</tspan><tspan x="123.5" dy="16.833">메시지가 아니라</tspan><tspan x="123.5" dy="16.833">열쇠와 서명에 쓴다</tspan></text></g><g ><g class="shape"><path d="M617 1080h235v114H617z" class="stroke-B1 fill-B6 s0"/></g><text x="734.5" y="1118.5" class="text-bold fill-N1 s1"><tspan x="734.5" dy="0">MAC (HMAC)</tspan><tspan x="734.5" dy="17.25">키를 섞은 해시</tspan><tspan x="734.5" dy="17.25">보내는 쪽과 받는 쪽이</tspan><tspan x="734.5" dy="17.25">같은 키를 갖는다</tspan></text></g><g ><g class="shape"><path d="M250 1080h272v130H250z" class="stroke-B1 fill-B6 s0"/></g><text x="386" y="1118.5" class="text-bold fill-N1 s1"><tspan x="386" dy="0">전자 서명</tspan><tspan x="386" dy="17">비밀키로 만들고</tspan><tspan x="386" dy="17">공개키로 확인한다</tspan><tspan x="386" dy="17">만든 사람이 하나뿐이므로</tspan><tspan x="386" dy="17">발뺌할 수 없다</tspan></text></g><g ><g class="shape"><path d="M559 1290h226v146H559z" class="stroke-B1 fill-B6 s0"/></g><text x="672" y="1328.5" class="text-bold fill-N1 s1"><tspan x="672" dy="0">인증서와 인증기관</tspan><tspan x="672" dy="16.833">‘이 공개키가</tspan><tspan x="672" dy="16.833">이 이름의 것이다’ 를</tspan><tspan x="672" dy="16.833">서명해 준다</tspan><tspan x="672" dy="16.833">중간자 공격을 막는</tspan><tspan x="672" dy="16.833">마지막 조각</tspan></text></g><g ><g class="shape"><path d="M368 754h232v146H368z" class="stroke-B1 fill-B6 s0"/></g><text x="484" y="792.5" class="text-bold fill-N1 s1"><tspan x="484" dy="0">암호학적 해시</tspan><tspan x="484" dy="16.833">SHA-2 · SHA-3</tspan><tspan x="484" dy="16.833">역상 · 제2역상 ·</tspan><tspan x="484" dy="16.833">충돌 저항</tspan><tspan x="484" dy="16.833">5장의 자료구조용</tspan><tspan x="484" dy="16.833">해시와 목적이 다르다</tspan></text></g><text x="520" y="1472" class="text-bold fill-N1 s1"><tspan x="520" dy="0">직접 구현하지 마라.</tspan><tspan x="520" dy="16.714">원리를 아는 것과</tspan><tspan x="520" dy="16.714">안전하게 구현하는 것은 다른 일이다.</tspan><tspan x="520" dy="16.714">실행 시간과 전력 소모까지 열쇠를 흘리고,</tspan><tspan x="520" dy="16.714">난수 하나가 나빠도 전부 무너진다.</tspan><tspan x="520" dy="16.714">검증된 라이브러리를 쓰고,</tspan><tspan x="520" dy="16.714">정한 규격 그대로 쓴다</tspan></text><marker id="mk-d2-4105936226-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="m404.017 102 .323 38s.085 10-9.915 10H133.5s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="m522.01 111 .367 79s.047 10 10.047 10H696s10 0 10 10v583" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="m581.017 102 .323 38s.085 10 10.085 10H925.5s10 0 10 10v428" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="m463.01 111 .368 79s.047 10-9.953 10H337.5s-10 0-10 10v194" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M123.5 324v64" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M123.5 524v64" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M123.5 676v74" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M734.5 881v195" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M880.5 676v254s0 10-10 10h-67.25s-10 0-10 10v126" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><text x="881" y="918" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px"><tspan x="881" dy="0">상대가 그 키를</tspan><tspan x="881" dy="18.5">가졌다는 뜻에서</tspan></text><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M677.5 881v99s0 10-10 10H478.266s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M327.5 508v568" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M123.5 902v78s0 10 10 10h161.566s10 0 10 10v76" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M990.5 676v564s0 10-10 10H720.266s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M386.666 1212v28s0 10 10 10h228.267s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M523.166 902v128s0 10 10 10H665.75s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><path fill="none" marker-end="url(#mk-d2-4105936226-3488378134)" d="M413.866 902v174" class="connection stroke-B1 s0" mask="url(#d2-4105936226)"/><mask id="d2-4105936226" width="1219" height="1763" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1219v1763H-89z"/><path d="M810 902h142v37H810z"/></mask></svg>