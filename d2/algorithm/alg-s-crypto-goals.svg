<svg xmlns="http://www.w3.org/2000/svg" width="1466" height="1651" class="d2-1758471621 d2-svg" viewBox="-89 -89 1466 1651"><rect width="1466" height="1651" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1758471621 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1758471621 .fill-N1{fill:#0a0f25}.d2-1758471621 .fill-B6{fill:#f7f8fe}.d2-1758471621 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="654.5" cy="61" class="shape stroke-B1 fill-B6 s0" rx="147.5" ry="49"/></g><text x="654.5" y="66.5" class="text-bold fill-N1 s1">무엇을 지키려는가</text></g><g ><g class="shape"><path d="M97 240h151v82H97z" class="stroke-B1 fill-B6 s0"/></g><text x="172.5" y="278.5" class="text-bold fill-N1 s1"><tspan x="172.5" dy="0">기밀성</tspan><tspan x="172.5" dy="18.5">남이 못 읽게</tspan></text></g><g ><g class="shape"><path d="M774 770h171v82H774z" class="stroke-B1 fill-B6 s0"/></g><text x="859.5" y="808.5" class="text-bold fill-N1 s1"><tspan x="859.5" dy="0">무결성</tspan><tspan x="859.5" dy="18.5">몰래 못 고치게</tspan></text></g><g ><g class="shape"><path d="M1088 576h188v82h-188z" class="stroke-B1 fill-B6 s0"/></g><text x="1182" y="614.5" class="text-bold fill-N1 s1"><tspan x="1182" dy="0">인증</tspan><tspan x="1182" dy="18.5">상대가 누구인지</tspan></text></g><g ><g class="shape"><path d="M343 408h215v82H343z" class="stroke-B1 fill-B6 s0"/></g><text x="450.5" y="446.5" class="text-bold fill-N1 s1"><tspan x="450.5" dy="0">부인 방지</tspan><tspan x="450.5" dy="18.5">나중에 발뺌 못 하게</tspan></text></g><g ><g class="shape"><path d="M21 392h302v114H21z" class="stroke-B1 fill-B6 s0"/></g><text x="172" y="430.5" class="text-bold fill-N1 s1"><tspan x="172" dy="0">대칭키 암호</tspan><tspan x="172" dy="17.25">AES 같은 블록 암호 + 운용 모드</tspan><tspan x="172" dy="17.25">빠르다. 열쇠를 미리</tspan><tspan x="172" dy="17.25">나눠 가져야 한다</tspan></text></g><g ><g class="shape"><path d="M23 584h299v66H23z" class="stroke-B1 fill-B6 s0"/></g><text x="172.5" y="622.5" class="text-bold fill-N1 s1">그 열쇠를 어떻게 나눠 갖는가</text></g><g ><g class="shape"><path d="M12 746h321v114H12z" class="stroke-B1 fill-B6 s0"/></g><text x="172.5" y="784.5" class="text-bold fill-N1 s1"><tspan x="172.5" dy="0">공개키 암호 · 키 합의</tspan><tspan x="172.5" dy="17.25">RSA · 디피-헬만 · 타원곡선</tspan><tspan x="172.5" dy="17.25">느리다. 그래서 메시지가 아니라</tspan><tspan x="172.5" dy="17.25">열쇠와 서명에 쓴다</tspan></text></g><g ><g class="shape"><path d="M770 1048h235v114H770z" class="stroke-B1 fill-B6 s0"/></g><text x="887.5" y="1086.5" class="text-bold fill-N1 s1"><tspan x="887.5" dy="0">MAC (HMAC)</tspan><tspan x="887.5" dy="17.25">키를 섞은 해시</tspan><tspan x="887.5" dy="17.25">보내는 쪽과 받는 쪽이</tspan><tspan x="887.5" dy="17.25">같은 키를 갖는다</tspan></text></g><g ><g class="shape"><path d="M379 1048h272v130H379z" class="stroke-B1 fill-B6 s0"/></g><text x="515" y="1086.5" class="text-bold fill-N1 s1"><tspan x="515" dy="0">전자 서명</tspan><tspan x="515" dy="17">비밀키로 만들고</tspan><tspan x="515" dy="17">공개키로 확인한다</tspan><tspan x="515" dy="17">만든 사람이 하나뿐이므로</tspan><tspan x="515" dy="17">발뺌할 수 없다</tspan></text></g><g ><g class="shape"><path d="M701 1258h345v114H701z" class="stroke-B1 fill-B6 s0"/></g><text x="873.5" y="1296.5" class="text-bold fill-N1 s1"><tspan x="873.5" dy="0">인증서와 인증기관</tspan><tspan x="873.5" dy="17.25">‘이 공개키가 이 이름의 것이다’ 를</tspan><tspan x="873.5" dy="17.25">서명해 준다</tspan><tspan x="873.5" dy="17.25">중간자 공격을 막는 마지막 조각</tspan></text></g><g ><g class="shape"><path d="M492 738h262v130H492z" class="stroke-B1 fill-B6 s0"/></g><text x="623" y="776.5" class="text-bold fill-N1 s1"><tspan x="623" dy="0">암호학적 해시</tspan><tspan x="623" dy="17">SHA-2 · SHA-3</tspan><tspan x="623" dy="17">역상 · 제2역상 · 충돌 저항</tspan><tspan x="623" dy="17">5장의 자료구조용 해시와</tspan><tspan x="623" dy="17">목적이 다르다</tspan></text></g><text x="644" y="1408" class="text-bold fill-N1 s1"><tspan x="644" dy="0">직접 구현하지 마라.</tspan><tspan x="644" dy="17.25">원리를 아는 것과 안전하게 구현하는 것은 다른 일이다.</tspan><tspan x="644" dy="17.25">실행 시간과 전력 소모까지 열쇠를 흘리고, 난수 하나가 나빠도 전부 무너진다.</tspan><tspan x="644" dy="17.25">검증된 라이브러리를 쓰고, 정한 규격 그대로 쓴다</tspan></text><marker id="mk-d2-1758471621-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="m566.99 102-.19 38s-.05 10-10.05 10H182.5s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="m684.995 111-.218 79s-.027 10 9.973 10H849.5s10 0 10 10v556" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="m743.99 102-.19 38s-.05 10 9.95 10h419s10 0 10 10v412" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="m625.995 111-.218 79s-.027 10-10.027 10H461s-10 0-10 10v194" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M172.5 324v64" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M172.5 508v72" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M172.5 652v90" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M888 854v190" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M1151.416 660v238s0 10-10 10H956.75s-10 0-10 10v126" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><text x="1104.5" y="914" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">상대가 그 키를 가졌다는 뜻에서</text><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M831 854v94s0 10-10 10H606.766s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M451 492v406s0 10 10 10h16.966s10 0 10 10v126" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M172.5 862v86s0 10 10 10h241.066s10 0 10 10v76" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M1214.083 660v28s0 10 10 10H1259s10 0 10 10v500s0 10-10 10H941.099s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M515.166 1180v28s0 10 10 10h280.933s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M666.666 870v128s0 10 10 10H819.25s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><path fill="none" marker-end="url(#mk-d2-1758471621-3488378134)" d="M542.366 870v174" class="connection stroke-B1 s0" mask="url(#d2-1758471621)"/><mask id="d2-1758471621" width="1466" height="1651" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1466v1651H-89z"/><path d="M971 898h267v21H971z"/></mask></svg>