<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="1599" class="d2-214481934 d2-svg" viewBox="-101 -101 1810 1599"><rect width="1810" height="1599" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-214481934 .fill-N1{fill:#0a0f25}.d2-214481934 .fill-N2{fill:#676c7e}.d2-214481934 .fill-B6{fill:#f7f8fe}.d2-214481934 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="369.5" cy="60" class="shape stroke-B1 fill-B6 s0" rx="180.5" ry="60"/></g><text x="369.5" y="65.5" class="text-bold fill-N1 s1">문제를 어떻게 풀 것인가</text></g><g ><g class="shape"><path d="M230 220h279v82H230z" class="stroke-B1 fill-B6 s0"/></g><text x="369.5" y="258.5" class="text-bold fill-N1 s1"><tspan x="369.5" dy="0">같은 모양의 더 작은 문제로</tspan><tspan x="369.5" dy="18.5">쪼갤 수 있는가</tspan></text></g><g ><g class="shape"><path d="M0 423h335v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="167.5" y="461.5" class="text-bold fill-N1 s1"><tspan x="167.5" dy="0">쪼갤 수 없다</tspan><tspan x="167.5" dy="18.5">반복문 · 자료구조 · 탐욕 쪽을 본다</tspan></text></g><g ><g class="shape"><path d="M395 423h354v82H395z" class="stroke-B1 fill-B6 s0"/></g><text x="572" y="461.5" class="text-bold fill-N1 s1"><tspan x="572" dy="0">쪼갠 조각들이 서로 겹치는가</tspan><tspan x="572" dy="18.5">(같은 부분문제를 두 번 이상 푸는가)</tspan></text></g><g ><g class="shape"><path d="M237 626h302v98H237z" class="stroke-B1 fill-B6 s0"/></g><text x="388" y="664.5" class="text-bold fill-N1 s1"><tspan x="388" dy="0">동적 계획법 (12장)</tspan><tspan x="388" dy="17.667">답을 표에 적어 두고 다시 쓴다</tspan><tspan x="388" dy="17.667">피보나치 · 배낭 · 편집 거리</tspan></text></g><g ><g class="shape"><path d="M599 634h316v82H599z" class="stroke-B1 fill-B6 s0"/></g><text x="757" y="672.5" class="text-bold fill-N1 s1"><tspan x="757" dy="0">합치는 값 f(n) 이</tspan><tspan x="757" dy="18.5">잎에서 나는 비용보다 무거운가</tspan></text></g><g ><g class="shape"><path d="M303 853h461v82H303z" class="stroke-B1 fill-B6 s0"/></g><text x="533.5" y="891.5" class="text-bold fill-N1 s1"><tspan x="533.5" dy="0">나눠도 Θ(f(n)) 그대로다</tspan><tspan x="533.5" dy="18.5">마스터 정리 셋째 경우 — 나누는 수고가 헛일이다</tspan></text></g><g ><g class="shape"><path d="M824 845h312v98H824z" class="stroke-B1 fill-B6 s0"/></g><text x="980" y="883.5" class="text-bold fill-N1 s1"><tspan x="980" dy="0">분할정복이 이긴다</tspan><tspan x="980" dy="17.667">이진 탐색 · 병합정렬 · 카라추바</tspan><tspan x="980" dy="17.667">최근접 점 쌍 · 빠른 거듭제곱</tspan></text></g><g ><g class="shape"><path d="M820 1043h319v98H820z" class="stroke-B1 fill-B6 s0"/></g><text x="979.5" y="1081.5" class="text-bold fill-N1 s1"><tspan x="979.5" dy="0">바닥 문턱을 정한다</tspan><tspan x="979.5" dy="17.667">조각이 수십 개 아래로 작아지면</tspan><tspan x="979.5" dy="17.667">단순한 방법으로 갈아탄다</tspan></text></g><g ><g class="shape"><ellipse cx="980" cy="1319" class="shape stroke-B1 fill-B6 s0" rx="234" ry="78"/></g><text x="980" y="1316.5" class="text-bold fill-N1 s1"><tspan x="980" dy="0">재귀식 T(n) = aT(n/b) + f(n) 을 세우고</tspan><tspan x="980" dy="18.5">3장의 마스터 정리로 답을 읽는다</tspan></text></g><text x="906" y="50" class="fill-N1 s1"><tspan x="906" dy="0">세 단계를 말로 먼저 적어라.</tspan><tspan x="906" dy="17.667">무엇을 기준으로 나누는가 · 조각을 어떻게 푸는가 · 답을 어떻게 잇는가.</tspan><tspan x="906" dy="17.667">어려운 곳은 대개 셋째 단계다</tspan></text><text x="1435" y="50" class="fill-N1 s1"><tspan x="1435" dy="0">재귀는 공짜가 아니다.</tspan><tspan x="1435" dy="17.667">호출마다 스택이 쌓이고 캐시가 끊긴다 —</tspan><tspan x="1435" dy="17.667">같은 Θ 라도 반복문 쪽이 빠른 일이 흔하다</tspan></text><marker id="mk-d2-214481934-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-214481934-3488378134)" d="M369.99 122c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-214481934)"/><path fill="none" marker-end="url(#mk-d2-214481934-3488378134)" d="M286.714 302.4C191.7 350.3 167.5 374.7 167.5 419.5" class="connection stroke-B1 s0" mask="url(#d2-214481934)"/><text x="203" y="350" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-214481934-3488378134)" d="M452.786 302.4C547.8 350.3 572 374.7 572 419.5" class="connection stroke-B1 s0" mask="url(#d2-214481934)"/><text x="537" y="350" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-214481934-3488378134)" d="M495.75 505.47C409.5 553.3 387.5 577.7 387.5 622.5" class="connection stroke-B1 s0" mask="url(#d2-214481934)"/><text x="418" y="554" class="text-italic fill-N2 s1">겹친다</text><path fill="none" marker-end="url(#mk-d2-214481934-3488378134)" d="M648.25 505.47C734.5 553.3 756.5 579.3 756.5 630.5" class="connection stroke-B1 s0" mask="url(#d2-214481934)"/><text x="729.5" y="556" class="text-italic fill-N2 s1">겹치지 않는다</text><path fill="none" marker-end="url(#mk-d2-214481934-3488378134)" d="M671.456 716.384C561.25 770.7 533.25 798.3 533.25 849.5" class="connection stroke-B1 s0" mask="url(#d2-214481934)"/><text x="575" y="769" class="text-italic fill-N2 s1">무겁다</text><path fill="none" marker-end="url(#mk-d2-214481934-3488378134)" d="M841.544 716.384C951.75 770.7 979.75 796.7 979.75 841.5" class="connection stroke-B1 s0" mask="url(#d2-214481934)"/><text x="935" y="768" class="text-italic fill-N2 s1">가볍거나 비슷하다</text><path fill="none" marker-end="url(#mk-d2-214481934-3488378134)" d="M979.75 945v94" class="connection stroke-B1 s0" mask="url(#d2-214481934)"/><path fill="none" marker-end="url(#mk-d2-214481934-3488378134)" d="M979.75 1143c0 38 .05 58 .23 94" class="connection stroke-B1 s0" mask="url(#d2-214481934)"/><mask id="d2-214481934" width="1810" height="1599" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1810v1599H-101z"/><path d="M172 334h62v21h-62zM506 334h62v21h-62zM387 538h62v21h-62zM668 540h123v21H668zM544 753h62v21h-62zM854 752h162v21H854z"/></mask></svg>