<svg xmlns="http://www.w3.org/2000/svg" width="4457" height="569" class="d2-1210062815 d2-svg" viewBox="-101 -101 4457 569"><rect width="4457" height="569" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1210062815 .fill-N1{fill:#0a0f25}.d2-1210062815 .fill-N2{fill:#676c7e}.d2-1210062815 .fill-B6{fill:#f7f8fe}.d2-1210062815 .stroke-B1,.d2-1210062815 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 170h214v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="107" y="208.5" class="text-bold fill-N1 s1">전류 I [A] 와 시간 t [s]</text></g><g ><g class="shape"><circle cx="887.5" cy="203.5" r="92.5" class="shape stroke-B1 fill-B6 s0"/></g><text x="887.5" y="209" class="text-bold fill-N1 s1">전하량 Q [C]</text></g><g ><g class="shape"><circle cx="1598.5" cy="203.5" r="96.5" class="shape stroke-B1 fill-B6 s0"/></g><text x="1598.5" y="209" class="text-bold fill-N1 s1">전자의 몰수</text></g><g ><g class="shape"><circle cx="2481.5" cy="96.5" r="96.5" class="shape stroke-B1 fill-B6 s0"/></g><text x="2481.5" y="102" class="text-bold fill-N1 s1">물질의 몰수</text></g><g ><g class="shape"><path d="M3122 56h225v82h-225z" class="stroke-B1 fill-B6 s0"/></g><text x="3234.5" y="94.5" class="text-bold fill-N1 s1"><tspan x="3234.5" dy="0">구하려는 양</tspan><tspan x="3234.5" dy="18.5">질량 [g] · 기체 부피 [L]</tspan></text></g><g ><g class="shape"><path d="M2301 253h360v114h-360z" class="stroke-B2 fill-B6 s2"/></g><text x="2481" y="291.5" class="text-bold fill-N1 s1"><tspan x="2481" dy="0">이온의 전하가 크면 같은 전하량으로</tspan><tspan x="2481" dy="17.25">얻는 금속이 적다.</tspan><tspan x="2481" dy="17.25">Ag+ 는 1몰당 전자 1몰,</tspan><tspan x="2481" dy="17.25">Cu2+ 는 1몰당 전자 2몰이 든다</tspan></text></g><g ><g class="shape"><path d="M3808 48h447v98h-447z" class="stroke-B2 fill-B6 s2"/></g><text x="4031.5" y="86.5" class="text-bold fill-N1 s1"><tspan x="4031.5" dy="0">실제 셀에서는 물이 함께 반응할 수 있다.</tspan><tspan x="4031.5" dy="17.667">표준 전위만으로 생성물을 정하면 틀릴 수 있고</tspan><tspan x="4031.5" dy="17.667">과전압까지 봐야 한다</tspan></text></g><marker id="mk-d2-1210062815-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1210062815-3488378134)" d="M215.5 203.25c230.8 0 347.1-.05 575.5-.247" class="connection stroke-B1 s0" mask="url(#d2-1210062815)"/><text x="504" y="201" class="text-italic fill-N2 s1"><tspan x="504" dy="0">Q = I t</tspan><tspan x="504" dy="18.5">1 A 는 1초에 1 C 을 나르는 전류다</tspan></text><path fill="none" marker-end="url(#mk-d2-1210062815-3488378134)" d="M982 203.002c206.8.198 311.2.198 516 .002" class="connection stroke-B1 s0" mask="url(#d2-1210062815)"/><text x="1241.5" y="193" class="text-italic fill-N2 s1"><tspan x="1241.5" dy="0">패러데이 상수로 나눈다</tspan><tspan x="1241.5" dy="17.667">F = 96485 C/mol</tspan><tspan x="1241.5" dy="17.667">전자 1몰이 나르는 전하</tspan></text><path fill="none" marker-end="url(#mk-d2-1210062815-3488378134)" d="M1693.933 177.485C1936.8 112.8 2075.4 96.6 2381 96.995" class="connection stroke-B1 s0" mask="url(#d2-1210062815)"/><text x="2034.5" y="99" class="text-italic fill-N2 s1"><tspan x="2034.5" dy="0">반쪽반응이 정한 전자 수로 나눈다</tspan><tspan x="2034.5" dy="18.5">여기가 유일하게 화학인 곳</tspan></text><path fill="none" marker-end="url(#mk-d2-1210062815-3488378134)" d="M2580 96.997c248.8-.397 357.7-.497 538.5-.497" class="connection stroke-B1 s0" mask="url(#d2-1210062815)"/><text x="2850" y="94" class="text-italic fill-N2 s1"><tspan x="2850" dy="0">몰질량을 곱한다</tspan><tspan x="2850" dy="18.5">또는 PV = nRT</tspan></text><path fill="none" marker-end="url(#mk-d2-1210062815-3488378134)" d="M1693.932 228.518C1936.8 293.6 2058.6 310 2297 310" class="connection stroke-B1 s0" mask="url(#d2-1210062815)"/><text x="1992.5" y="307" class="text-italic fill-N2 s1">전하가 다르면</text><path fill="none" marker-end="url(#mk-d2-1210062815-3488378134)" d="M3348.5 96.5h456" class="connection stroke-B1 s0" mask="url(#d2-1210062815)"/><text x="3578" y="102" class="text-italic fill-N2 s1">실험과 어긋나면</text><mask id="d2-1210062815" width="4457" height="569" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h4457v569H-101z"/><path d="M373 185h262v37H373zM1140 177h203v53h-203zM1891 83h287v37h-287zM2779 78h142v37h-142zM1931 291h123v21h-123zM3507 86h142v21h-142z"/></mask></svg>