<svg xmlns="http://www.w3.org/2000/svg" width="942" height="1704" class="d2-1718899614 d2-svg" viewBox="-101 -101 942 1704"><rect width="942" height="1704" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1718899614 .fill-N1{fill:#0a0f25}.d2-1718899614 .fill-N2{fill:#676c7e}.d2-1718899614 .fill-B6{fill:#f7f8fe}.d2-1718899614 .stroke-B1,.d2-1718899614 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M285 0h214v66H285z" class="stroke-B1 fill-B6 s0"/></g><text x="392" y="38.5" class="text-bold fill-N1 s1">전류 I [A] 와 시간 t [s]</text></g><g ><g class="shape"><circle cx="391.5" cy="295.5" r="92.5" class="shape stroke-B1 fill-B6 s0"/></g><text x="391.5" y="301" class="text-bold fill-N1 s1">전하량 Q [C]</text></g><g ><g class="shape"><circle cx="391.5" cy="637.5" r="96.5" class="shape stroke-B1 fill-B6 s0"/></g><text x="391.5" y="643" class="text-bold fill-N1 s1">전자의 몰수</text></g><g ><g class="shape"><circle cx="223.5" cy="967.5" r="96.5" class="shape stroke-B1 fill-B6 s0"/></g><text x="223.5" y="973" class="text-bold fill-N1 s1">물질의 몰수</text></g><g ><g class="shape"><path d="M111 1201h225v82H111z" class="stroke-B1 fill-B6 s0"/></g><text x="223.5" y="1239.5" class="text-bold fill-N1 s1"><tspan x="223.5" dy="0">구하려는 양</tspan><tspan x="223.5" dy="18.5">질량 [g] · 기체 부피 [L]</tspan></text></g><g ><g class="shape"><path d="M380 911h360v114H380z" class="stroke-B2 fill-B6 s2"/></g><text x="560" y="949.5" class="text-bold fill-N1 s1"><tspan x="560" dy="0">이온의 전하가 크면 같은 전하량으로</tspan><tspan x="560" dy="17.25">얻는 금속이 적다.</tspan><tspan x="560" dy="17.25">Ag+ 는 1몰당 전자 1몰,</tspan><tspan x="560" dy="17.25">Cu2+ 는 1몰당 전자 2몰이 든다</tspan></text></g><g ><g class="shape"><path d="M0 1404h447v98H0z" class="stroke-B2 fill-B6 s2"/></g><text x="223.5" y="1442.5" class="text-bold fill-N1 s1"><tspan x="223.5" dy="0">실제 셀에서는 물이 함께 반응할 수 있다.</tspan><tspan x="223.5" dy="17.667">표준 전위만으로 생성물을 정하면 틀릴 수 있고</tspan><tspan x="223.5" dy="17.667">과전압까지 봐야 한다</tspan></text></g><marker id="mk-d2-1718899614-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1718899614-3488378134)" d="M391.75 67.5c0 53.2.05 80.7.235 131.5" class="connection stroke-B1 s0" mask="url(#d2-1718899614)"/><text x="392" y="132" class="text-italic fill-N2 s1"><tspan x="392" dy="0">Q = I t</tspan><tspan x="392" dy="18.5">1 A 는 1초에 1 C 을 나르는 전류다</tspan></text><path fill="none" marker-end="url(#mk-d2-1718899614-3488378134)" d="M391.993 390c-.193 59.2-.193 89.8-.006 147" class="connection stroke-B1 s0" mask="url(#d2-1718899614)"/><text x="391.5" y="454" class="text-italic fill-N2 s1"><tspan x="391.5" dy="0">패러데이 상수로 나눈다</tspan><tspan x="391.5" dy="17.667">F = 96485 C/mol</tspan><tspan x="391.5" dy="17.667">전자 1몰이 나르는 전하</tspan></text><path fill="none" marker-end="url(#mk-d2-1718899614-3488378134)" d="M321.564 707.392C243.4 783.2 223.6 816.2 223.971 867" class="connection stroke-B1 s0" mask="url(#d2-1718899614)"/><text x="249.5" y="775" class="text-italic fill-N2 s1"><tspan x="249.5" dy="0">반쪽반응이 정한 전자 수로 나눈다</tspan><tspan x="249.5" dy="18.5">여기가 유일하게 화학인 곳</tspan></text><path fill="none" marker-end="url(#mk-d2-1718899614-3488378134)" d="M223.985 1066c-.385 52.8-.485 80.3-.485 131.5" class="connection stroke-B1 s0" mask="url(#d2-1718899614)"/><text x="224" y="1130" class="text-italic fill-N2 s1"><tspan x="224" dy="0">몰질량을 곱한다</tspan><tspan x="224" dy="18.5">또는 PV = nRT</tspan></text><path fill="none" marker-end="url(#mk-d2-1718899614-3488378134)" d="M462.425 706.403C540.2 783 560 824.1 560 906.5" class="connection stroke-B1 s0" mask="url(#d2-1718899614)"/><text x="544.5" y="798" class="text-italic fill-N2 s1">전하가 다르면</text><path fill="none" marker-end="url(#mk-d2-1718899614-3488378134)" d="M223.5 1284.5v116" class="connection stroke-B1 s0" mask="url(#d2-1718899614)"/><text x="224" y="1349" class="text-italic fill-N2 s1">실험과 어긋나면</text><mask id="d2-1718899614" width="942" height="1704" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h942v1704h-942z"/><path d="M261 116h262v37H261zM290 438h203v53H290zM106 759h287v37H106zM153 1114h142v37H153zM483 782h123v21H483zM153 1333h142v21H153z"/></mask></svg>