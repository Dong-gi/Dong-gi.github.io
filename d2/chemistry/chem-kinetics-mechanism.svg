<svg xmlns="http://www.w3.org/2000/svg" width="1018" height="1698" class="d2-2461617273 d2-svg" viewBox="-101 -101 1018 1698"><rect width="1018" height="1698" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2461617273 .text-bold{font-weight:700}.d2-2461617273 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2461617273 .fill-N1{fill:#0a0f25}.d2-2461617273 .fill-N2{fill:#676c7e}.d2-2461617273 .fill-B5{fill:#edf0fd}.d2-2461617273 .fill-B6{fill:#f7f8fe}.d2-2461617273 .stroke-B1,.d2-2461617273 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M255 0h351v98H255z" class="stroke-B1 fill-B6 s0"/></g><text x="430.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="430.5" dy="0">전체 반응식</tspan><tspan x="430.5" dy="17.667">2 NO2 + F2 -&gt; 2 NO2F</tspan><tspan x="430.5" dy="17.667">(계수는 속도식과 아무 관계가 없다)</tspan></text></g><g ><g class="shape"><path d="M315 235h232v98H315z" class="stroke-B1 fill-B6 s0"/></g><text x="431" y="273.5" class="text-bold fill-N1 s1"><tspan x="431" dy="0">실험으로 얻은 속도식</tspan><tspan x="431" dy="17.667">v = k [NO2][F2]</tspan><tspan x="431" dy="17.667">초기 속도법으로 잰다</tspan></text></g><g ><g class="shape"><path d="M39 474h617v142H39z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="347.5" y="461" class="fill-N1" style="text-anchor:middle;font-size:28px">메커니즘 후보 — 단계로 쪼갠다</text></g><g ><g class="shape"><path d="M95 765h281v82H95z" class="stroke-B1 fill-B6 s0"/></g><text x="235.5" y="803.5" class="text-bold fill-N1 s1"><tspan x="235.5" dy="0">검사 1 — 단계를 모두 더하면</tspan><tspan x="235.5" dy="18.5">전체 반응식이 되는가</tspan></text></g><g ><g class="shape"><path d="M76 976h319v82H76z" class="stroke-B1 fill-B6 s0"/></g><text x="235.5" y="1014.5" class="text-bold fill-N1 s1"><tspan x="235.5" dy="0">검사 2 — 가장 느린 단계의</tspan><tspan x="235.5" dy="18.5">분자 수가 실험 속도식과 맞는가</tspan></text></g><g ><g class="shape"><path d="M0 1179h471v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="235.5" y="1217.5" class="text-bold fill-N1 s1"><tspan x="235.5" dy="0">둘 다 통과하면 받아들일 수 있는 메커니즘이다.</tspan><tspan x="235.5" dy="17.667">다만 증명된 것은 아니다.</tspan><tspan x="235.5" dy="17.667">같은 속도식을 주는 다른 메커니즘이 있을 수 있다</tspan></text></g><g ><g class="shape"><path d="M436 757h380v98H436z" class="stroke-B2 fill-B6 s2"/></g><text x="626" y="795.5" class="text-bold fill-N1 s1"><tspan x="626" dy="0">중간체 F 는 반응식 양변 어디에도 없다.</tspan><tspan x="626" dy="17.667">생겼다가 곧 사라지므로</tspan><tspan x="626" dy="17.667">속도식에도 나타나서는 안 된다</tspan></text></g><g ><g class="shape"><path d="M19 1398h434v98H19z" class="stroke-B2 fill-B6 s2"/></g><text x="236" y="1436.5" class="text-bold fill-N1 s1"><tspan x="236" dy="0">촉매는 반대다.</tspan><tspan x="236" dy="17.667">1단계에 들어갔다가 마지막에 되돌아 나온다.</tspan><tspan x="236" dy="17.667">속도식에는 나타날 수 있다</tspan></text></g><g ><g class="shape"><path d="M69 504h188v82H69z" class="stroke-B1 fill-B5 s0"/></g><text x="163" y="542.5" class="text-bold fill-N1 s1"><tspan x="163" dy="0">1단계 (느리다)</tspan><tspan x="163" dy="18.5">NO2 + F2 -&gt; NO2F + F</tspan></text></g><g ><g class="shape"><path d="M346 504h169v82H346z" class="stroke-B1 fill-B5 s0"/></g><text x="430.5" y="542.5" class="text-bold fill-N1 s1"><tspan x="430.5" dy="0">2단계 (빠르다)</tspan><tspan x="430.5" dy="18.5">NO2 + F -&gt; NO2F</tspan></text></g><marker id="mk-d2-2461617273-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2461617273-3488378134)" d="M430.75 99.5v132" class="connection stroke-B1 s0" mask="url(#d2-2461617273)"/><text x="430.5" y="164" class="text-italic fill-N2 s1"><tspan x="430.5" dy="0">속도식은 반응식에서</tspan><tspan x="430.5" dy="18.5">읽어낼 수 없다</tspan></text><path fill="none" marker-end="url(#mk-d2-2461617273-3488378134)" d="M430.75 334.5v95" class="connection stroke-B1 s0" mask="url(#d2-2461617273)"/><text x="431" y="389" class="text-italic fill-N2 s1">설명할 메커니즘을 세운다</text><path fill="none" marker-end="url(#mk-d2-2461617273-3488378134)" d="M235.5 617.5v144" class="connection stroke-B1 s0" mask="url(#d2-2461617273)"/><path fill="none" marker-end="url(#mk-d2-2461617273-3488378134)" d="M235.5 848.5v124" class="connection stroke-B1 s0" mask="url(#d2-2461617273)"/><text x="235.5" y="917" class="text-italic fill-N2 s1">통과</text><path fill="none" marker-end="url(#mk-d2-2461617273-3488378134)" d="M235.5 1059.5v116" class="connection stroke-B1 s0" mask="url(#d2-2461617273)"/><text x="235.5" y="1124" class="text-italic fill-N2 s1">통과</text><path fill="none" marker-end="url(#mk-d2-2461617273-3488378134)" d="M626 617.5v136" class="connection stroke-B1 s0" mask="url(#d2-2461617273)"/><text x="626.5" y="692" class="text-italic fill-N2 s1">F 는 무엇인가</text><path fill="none" marker-end="url(#mk-d2-2461617273-3488378134)" d="M235.5 1278.5v116" class="connection stroke-B1 s0" mask="url(#d2-2461617273)"/><text x="236" y="1343" class="text-italic fill-N2 s1">중간체와 촉매의 차이</text><mask id="d2-2461617273" width="1018" height="1698" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H917v1698H-101z"/><path d="M340 148h181v37H340zM320 373h222v21H320zM214 901h43v21h-43zM214 1108h43v21h-43zM569 676h115v21H569zM144 1327h184v21H144z"/></mask></svg>