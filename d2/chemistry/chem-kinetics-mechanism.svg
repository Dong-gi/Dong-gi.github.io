<svg xmlns="http://www.w3.org/2000/svg" width="5147" height="579" class="d2-2753002347 d2-svg" viewBox="-101 -85 5147 579"><rect width="5147" height="579" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2753002347 .fill-N1{fill:#0a0f25}.d2-2753002347 .fill-N2{fill:#676c7e}.d2-2753002347 .fill-B5{fill:#edf0fd}.d2-2753002347 .fill-B6{fill:#f7f8fe}.d2-2753002347 .stroke-B1,.d2-2753002347 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 220h351v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="175.5" y="258.5" class="text-bold fill-N1 s1"><tspan x="175.5" dy="0">전체 반응식</tspan><tspan x="175.5" dy="17.667">2 NO2 + F2 -&gt; 2 NO2F</tspan><tspan x="175.5" dy="17.667">(계수는 속도식과 아무 관계가 없다)</tspan></text></g><g ><g class="shape"><path d="M786 220h232v98H786z" class="stroke-B1 fill-B6 s0"/></g><text x="902" y="258.5" class="text-bold fill-N1 s1"><tspan x="902" dy="0">실험으로 얻은 속도식</tspan><tspan x="902" dy="17.667">v = k [NO2][F2]</tspan><tspan x="902" dy="17.667">초기 속도법으로 잰다</tspan></text></g><g ><g class="shape"><path d="M1593 56h248v318h-248z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1717" y="43" class="fill-N1" style="text-anchor:middle;font-size:28px">메커니즘 후보 — 단계로 쪼갠다</text></g><g ><g class="shape"><path d="M2359 137h281v82h-281z" class="stroke-B1 fill-B6 s0"/></g><text x="2499.5" y="175.5" class="text-bold fill-N1 s1"><tspan x="2499.5" dy="0">검사 1 — 단계를 모두 더하면</tspan><tspan x="2499.5" dy="18.5">전체 반응식이 되는가</tspan></text></g><g ><g class="shape"><path d="M2986 137h319v82h-319z" class="stroke-B1 fill-B6 s0"/></g><text x="3145.5" y="175.5" class="text-bold fill-N1 s1"><tspan x="3145.5" dy="0">검사 2 — 가장 느린 단계의</tspan><tspan x="3145.5" dy="18.5">분자 수가 실험 속도식과 맞는가</tspan></text></g><g ><g class="shape"><path d="M3602 129h471v98h-471z" class="stroke-B1 fill-B6 s0"/></g><text x="3837.5" y="167.5" class="text-bold fill-N1 s1"><tspan x="3837.5" dy="0">둘 다 통과하면 받아들일 수 있는 메커니즘이다.</tspan><tspan x="3837.5" dy="17.667">다만 증명된 것은 아니다.</tspan><tspan x="3837.5" dy="17.667">같은 속도식을 주는 다른 메커니즘이 있을 수 있다</tspan></text></g><g ><g class="shape"><path d="M2309 295h380v98h-380z" class="stroke-B2 fill-B6 s2"/></g><text x="2499" y="333.5" class="text-bold fill-N1 s1"><tspan x="2499" dy="0">중간체 F 는 반응식 양변 어디에도 없다.</tspan><tspan x="2499" dy="17.667">생겼다가 곧 사라지므로</tspan><tspan x="2499" dy="17.667">속도식에도 나타나서는 안 된다</tspan></text></g><g ><g class="shape"><path d="M4511 129h434v98h-434z" class="stroke-B2 fill-B6 s2"/></g><text x="4728" y="167.5" class="text-bold fill-N1 s1"><tspan x="4728" dy="0">촉매는 반대다.</tspan><tspan x="4728" dy="17.667">1단계에 들어갔다가 마지막에 되돌아 나온다.</tspan><tspan x="4728" dy="17.667">속도식에는 나타날 수 있다</tspan></text></g><g ><g class="shape"><path d="M1623 86h188v82h-188z" class="stroke-B1 fill-B5 s0"/></g><text x="1717" y="124.5" class="text-bold fill-N1 s1"><tspan x="1717" dy="0">1단계 (느리다)</tspan><tspan x="1717" dy="18.5">NO2 + F2 -&gt; NO2F + F</tspan></text></g><g ><g class="shape"><path d="M1633 228h169v82h-169z" class="stroke-B1 fill-B5 s0"/></g><text x="1717.5" y="266.5" class="text-bold fill-N1 s1"><tspan x="1717.5" dy="0">2단계 (빠르다)</tspan><tspan x="1717.5" dy="18.5">NO2 + F -&gt; NO2F</tspan></text></g><marker id="mk-d2-2753002347-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2753002347-3488378134)" d="M352.5 269h430" class="connection stroke-B1 s0" mask="url(#d2-2753002347)"/><text x="568.5" y="267" class="text-italic fill-N2 s1"><tspan x="568.5" dy="0">속도식은 반응식에서</tspan><tspan x="568.5" dy="18.5">읽어낼 수 없다</tspan></text><path fill="none" marker-end="url(#mk-d2-2753002347-3488378134)" d="M1020 269h569" class="connection stroke-B1 s0" mask="url(#d2-2753002347)"/><text x="1306" y="275" class="text-italic fill-N2 s1">설명할 메커니즘을 세운다</text><path fill="none" marker-end="url(#mk-d2-2753002347-3488378134)" d="M1842.5 177.5h512" class="connection stroke-B1 s0" mask="url(#d2-2753002347)"/><path fill="none" marker-end="url(#mk-d2-2753002347-3488378134)" d="M2642.5 177.5h340" class="connection stroke-B1 s0" mask="url(#d2-2753002347)"/><text x="2813.5" y="183" class="text-italic fill-N2 s1">통과</text><path fill="none" marker-end="url(#mk-d2-2753002347-3488378134)" d="M3306.5 177.5h292" class="connection stroke-B1 s0" mask="url(#d2-2753002347)"/><text x="3453.5" y="183" class="text-italic fill-N2 s1">통과</text><path fill="none" marker-end="url(#mk-d2-2753002347-3488378134)" d="M1842.5 344h463" class="connection stroke-B1 s0" mask="url(#d2-2753002347)"/><text x="2075.5" y="350" class="text-italic fill-N2 s1">F 는 무엇인가</text><path fill="none" marker-end="url(#mk-d2-2753002347-3488378134)" d="M4075 177.5h432" class="connection stroke-B1 s0" mask="url(#d2-2753002347)"/><text x="4292" y="183" class="text-italic fill-N2 s1">중간체와 촉매의 차이</text><mask id="d2-2753002347" width="5147" height="579" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h5147v579H-101z"/><path d="M478 251h181v37H478zM1195 259h222v21h-222zM2792 167h43v21h-43zM3432 167h43v21h-43zM2018 334h115v21h-115zM4200 167h184v21h-184z"/></mask></svg>