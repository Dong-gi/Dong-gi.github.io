<svg xmlns="http://www.w3.org/2000/svg" width="1277" height="1461" class="d2-516586662 d2-svg" viewBox="-89 -89 1277 1461"><rect width="1277" height="1461" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-516586662 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-516586662 .fill-N1{fill:#0a0f25}.d2-516586662 .fill-B5{fill:#edf0fd}.d2-516586662 .fill-B6{fill:#f7f8fe}.d2-516586662 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M398 12h283v114H398z" class="stroke-B1 fill-B6 s0"/></g><text x="539.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="539.5" dy="0">중심 원자 둘레의</tspan><tspan x="539.5" dy="17.25">전자쌍을 센다</tspan><tspan x="539.5" dy="17.25">(결합 하나 = 1, 이중결합도 1,</tspan><tspan x="539.5" dy="17.25">비공유 전자쌍도 1)</tspan></text></g><g ><g class="shape"><path d="M12 256h175v66H12z" class="stroke-B1 fill-B6 s0"/></g><text x="99.5" y="294.5" class="text-bold fill-N1 s1">2쌍 → 직선 배치</text></g><g ><g class="shape"><path d="M207 256h215v66H207z" class="stroke-B1 fill-B6 s0"/></g><text x="314.5" y="294.5" class="text-bold fill-N1 s1">3쌍 → 평면삼각 배치</text></g><g ><g class="shape"><path d="M442 256h195v66H442z" class="stroke-B1 fill-B6 s0"/></g><text x="539.5" y="294.5" class="text-bold fill-N1 s1">4쌍 → 사면체 배치</text></g><g ><g class="shape"><path d="M657 256h215v66H657z" class="stroke-B1 fill-B6 s0"/></g><text x="764.5" y="294.5" class="text-bold fill-N1 s1">5쌍 → 삼각쌍뿔 배치</text></g><g ><g class="shape"><path d="M892 256h195v66H892z" class="stroke-B1 fill-B6 s0"/></g><text x="989.5" y="294.5" class="text-bold fill-N1 s1">6쌍 → 팔면체 배치</text></g><g ><g class="shape"><path d="M87 402h680v610H87z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="427" y="435" class="fill-N1" style="text-anchor:middle;font-size:28px">비공유 전자쌍 자리를 지우고 이름을 붙인다</text></g><g ><g class="shape"><path d="M148 1173h557v98H148z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="426.5" y="1211.5" class="text-bold fill-N1 s1"><tspan x="426.5" dy="0">미는 세기의 순서</tspan><tspan x="426.5" dy="17.667">비공유-비공유 &gt; 비공유-결합 &gt; 결합-결합</tspan><tspan x="426.5" dy="17.667">비공유 전자쌍이 하나 늘 때마다 결합각이 2~3도씩 좁아진다</tspan></text></g><g ><g class="shape"><path d="M215 462h424v66H215z" class="stroke-B1 fill-B5 s0"/></g><text x="427" y="500.5" class="text-bold fill-N1 s1">3쌍 · 비공유 전자쌍 0 → 평면삼각형 (BF3)</text></g><g ><g class="shape"><path d="M215 568h424v66H215z" class="stroke-B1 fill-B5 s0"/></g><text x="427" y="606.5" class="text-bold fill-N1 s1">3쌍 · 비공유 전자쌍 1 → 굽은형 약 119도 (SO2)</text></g><g ><g class="shape"><path d="M215 674h424v66H215z" class="stroke-B1 fill-B5 s0"/></g><text x="427" y="712.5" class="text-bold fill-N1 s1">4쌍 · 비공유 전자쌍 0 → 정사면체 109.5도 (CH4)</text></g><g ><g class="shape"><path d="M215 780h424v66H215z" class="stroke-B1 fill-B5 s0"/></g><text x="427" y="818.5" class="text-bold fill-N1 s1">4쌍 · 비공유 전자쌍 1 → 삼각뿔형 107도 (NH3)</text></g><g ><g class="shape"><path d="M215 886h424v66H215z" class="stroke-B1 fill-B5 s0"/></g><text x="427" y="924.5" class="text-bold fill-N1 s1">4쌍 · 비공유 전자쌍 2 → 굽은형 104.5도 (H2O)</text></g><marker id="mk-d2-516586662-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-516586662-3488378134)" d="M446 128v28s0 10-10 10H109.5s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-516586662)"/><path fill="none" marker-end="url(#mk-d2-516586662-3488378134)" d="M493.166 128v78s0 10-10 10H324.5s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-516586662)"/><path fill="none" marker-end="url(#mk-d2-516586662-3488378134)" d="M539.5 128v124" class="connection stroke-B1 s0" mask="url(#d2-516586662)"/><path fill="none" 