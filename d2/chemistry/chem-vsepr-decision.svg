<svg xmlns="http://www.w3.org/2000/svg" width="2654" height="905" class="d2-924231591 d2-svg" viewBox="-101 -85 2654 905"><rect width="2654" height="905" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-924231591 .fill-N1{fill:#0a0f25}.d2-924231591 .fill-B5{fill:#edf0fd}.d2-924231591 .fill-B6{fill:#f7f8fe}.d2-924231591 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 377h283v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="141.5" y="415.5" class="text-bold fill-N1 s1"><tspan x="141.5" dy="0">중심 원자 둘레의</tspan><tspan x="141.5" dy="17.25">전자쌍을 센다</tspan><tspan x="141.5" dy="17.25">(결합 하나 = 1, 이중결합도 1,</tspan><tspan x="141.5" dy="17.25">홀전자쌍도 1)</tspan></text></g><g ><g class="shape"><path d="M523 149h175v66H523z" class="stroke-B1 fill-B6 s0"/></g><text x="610.5" y="187.5" class="text-bold fill-N1 s1">2쌍 → 직선 배치</text></g><g ><g class="shape"><path d="M503 275h215v66H503z" class="stroke-B1 fill-B6 s0"/></g><text x="610.5" y="313.5" class="text-bold fill-N1 s1">3쌍 → 평면삼각 배치</text></g><g ><g class="shape"><path d="M513 401h195v66H513z" class="stroke-B1 fill-B6 s0"/></g><text x="610.5" y="439.5" class="text-bold fill-N1 s1">4쌍 → 사면체 배치</text></g><g ><g class="shape"><path d="M503 527h215v66H503z" class="stroke-B1 fill-B6 s0"/></g><text x="610.5" y="565.5" class="text-bold fill-N1 s1">5쌍 → 삼각쌍뿔 배치</text></g><g ><g class="shape"><path d="M513 653h195v66H513z" class="stroke-B1 fill-B6 s0"/></g><text x="610.5" y="691.5" class="text-bold fill-N1 s1">6쌍 → 팔면체 배치</text></g><g ><g class="shape"><path d="M1018 56h441v630h-441z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1238.5" y="43" class="fill-N1" style="text-anchor:middle;font-size:28px">홀전자쌍 자리를 지우고 이름을 붙인다</text></g><g ><g class="shape"><path d="M1939 322h513v98h-513z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="2195.5" y="360.5" class="text-bold fill-N1 s1"><tspan x="2195.5" dy="0">미는 세기의 순서</tspan><tspan x="2195.5" dy="17.667">홀전자쌍-홀전자쌍 &gt; 홀전자쌍-결합 &gt; 결합-결합</tspan><tspan x="2195.5" dy="17.667">홀전자쌍이 하나 늘 때마다 결합각이 2~3도씩 좁아진다</tspan></text></g><g ><g class="shape"><path d="M1070 86h337v66h-337z" class="stroke-B1 fill-B5 s0"/></g><text x="1238.5" y="124.5" class="text-bold fill-N1 s1">3쌍 · 홀전자쌍 0 → 평면삼각형 (BF3)</text></g><g ><g class="shape"><path d="M1054 212h370v66h-370z" class="stroke-B1 fill-B5 s0"/></g><text x="1239" y="250.5" class="text-bold fill-N1 s1">3쌍 · 홀전자쌍 1 → 굽은형 약 119도 (SO2)</text></g><g ><g class="shape"><path d="M1048 338h381v66h-381z" class="stroke-B1 fill-B5 s0"/></g><text x="1238.5" y="376.5" class="text-bold fill-N1 s1">4쌍 · 홀전자쌍 0 → 정사면체 109.5도 (CH4)</text></g><g ><g class="shape"><path d="M1054 464h369v66h-369z" class="stroke-B1 fill-B5 s0"/></g><text x="1238.5" y="502.5" class="text-bold fill-N1 s1">4쌍 · 홀전자쌍 1 → 삼각뿔형 107도 (NH3)</text></g><g ><g class="shape"><path d="M1058 590h362v66h-362z" class="stroke-B1 fill-B5 s0"/></g><text x="1239" y="628.5" class="text-bold fill-N1 s1">4쌍 · 홀전자쌍 2 → 굽은형 104.5도 (H2O)</text></g><marker id="mk-d2-924231591-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-924231591-3488378134)" d="M199.414 375.586C354 221 419 182 519 182" class="connection stroke-B1 s0" mask="url(#d2-924231591)"/><path fill="none" marker-end="url(#mk-d2-924231591-3488378134)" d="M256.789 376.106C365.4 321.8 415 308 499 308" class="connection stroke-B1 s0" mask="url(#d2-924231591)"/><path fill="none" marker-end="url(#mk-d2-924231591-3488378134)" d="M285 434h224" class="connection stroke-B1 s0" mask="url(#d2-924231591)"/><path fill="none" marker-end="url(#mk-d2-924231591-34883781