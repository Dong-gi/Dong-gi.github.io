<svg xmlns="http://www.w3.org/2000/svg" width="1306" height="1131" class="d2-4205902522 d2-svg" viewBox="-89 -89 1306 1131"><rect width="1306" height="1131" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-4205902522 .text-bold{font-weight:700}.d2-4205902522 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4205902522 .fill-N1{fill:#0a0f25}.d2-4205902522 .fill-N2{fill:#676c7e}.d2-4205902522 .fill-B6{fill:#f7f8fe}.d2-4205902522 .stroke-B1,.d2-4205902522 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M322 12h331v82H322z" class="stroke-B1 fill-B6 s0"/></g><text x="487.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="487.5" dy="0">물질</tspan><tspan x="487.5" dy="18.5">(질량이 있고 자리를 차지하는 것)</tspan></text></g><g ><g class="shape"><path d="M42 275h361v98H42z" class="stroke-B1 fill-B6 s0"/></g><text x="222.5" y="313.5" class="text-bold fill-N1 s1"><tspan x="222.5" dy="0">순물질</tspan><tspan x="222.5" dy="17.667">조성이 어디서나 같고 정해져 있다</tspan><tspan x="222.5" dy="17.667">녹는점·끓는점이 하나로 딱 정해진다</tspan></text></g><g ><g class="shape"><path d="M640 265h338v114H640z" class="stroke-B1 fill-B6 s0"/></g><text x="809" y="303.5" class="text-bold fill-N1 s1"><tspan x="809" dy="0">혼합물</tspan><tspan x="809" dy="17.25">두 가지 이상이 섞여 있다</tspan><tspan x="809" dy="17.25">섞인 비율이 달라질 수 있다</tspan><tspan x="809" dy="17.25">녹는점·끓는점이 구간으로 나온다</tspan></text></g><g ><g class="shape"><path d="M12 643h189v114H12z" class="stroke-B1 fill-B6 s0"/></g><text x="106.5" y="681.5" class="text-bold fill-N1 s1"><tspan x="106.5" dy="0">원소</tspan><tspan x="106.5" dy="17.25">화학적 방법으로</tspan><tspan x="106.5" dy="17.25">더 쪼갤 수 없다</tspan><tspan x="106.5" dy="17.25">수소, 산소, 철, 금</tspan></text></g><g ><g class="shape"><path d="M221 643h235v146H221z" class="stroke-B1 fill-B6 s0"/></g><text x="338.5" y="681.5" class="text-bold fill-N1 s1"><tspan x="338.5" dy="0">화합물</tspan><tspan x="338.5" dy="16.833">두 원소 이상이</tspan><tspan x="338.5" dy="16.833">정해진 비로 결합</tspan><tspan x="338.5" dy="16.833">쪼개면 성질이</tspan><tspan x="338.5" dy="16.833">전혀 다른 것이 나온다</tspan><tspan x="338.5" dy="16.833">물, 소금, 설탕</tspan></text></g><g ><g class="shape"><path d="M476 643h203v114H476z" class="stroke-B1 fill-B6 s0"/></g><text x="577.5" y="681.5" class="text-bold fill-N1 s1"><tspan x="577.5" dy="0">균일 혼합물 (용액)</tspan><tspan x="577.5" dy="17.25">어디를 떠도</tspan><tspan x="577.5" dy="17.25">조성이 같다</tspan><tspan x="577.5" dy="17.25">소금물, 공기, 놋쇠</tspan></text></g><g ><g class="shape"><path d="M699 643h221v114H699z" class="stroke-B1 fill-B6 s0"/></g><text x="809.5" y="681.5" class="text-bold fill-N1 s1"><tspan x="809.5" dy="0">불균일 혼합물</tspan><tspan x="809.5" dy="17.25">뜨는 자리에 따라</tspan><tspan x="809.5" dy="17.25">조성이 다르다</tspan><tspan x="809.5" dy="17.25">흙탕물, 우유, 화강암</tspan></text></g><g ><g class="shape"><path d="M859 459h257v114H859z" class="stroke-B2 fill-B6 s2"/></g><text x="987.5" y="497.5" class="text-bold fill-N1 s1"><tspan x="987.5" dy="0">혼합물은</tspan><tspan x="987.5" dy="17.25">물리적 방법으로 나눈다</tspan><tspan x="987.5" dy="17.25">거르기 · 증류 ·</tspan><tspan x="987.5" dy="17.25">크로마토그래피 · 재결정</tspan></text></g><g ><g class="shape"><path d="M170 859h336v82H170z" class="stroke-B2 fill-B6 s2"/></g><text x="338" y="897.5" class="text-bold fill-N1 s1"><tspan x="338" dy="0">화합물은 화학 반응으로만 나눈다</tspan><tspan x="338" dy="18.5">전기분해 · 가열분해</tspan></text></g><marker id="mk-d2-4205902522-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4205902522-3488378134)" d="M432.916 96v28s0 10-10 10H232.5s-10 0-10 10v128" class="connection stroke-B1 s0" mask="url(#d2-4205902522)"/><text x="277" y="140" class="text-italic fill-N2 s1">성분이 한 가지인가?</text><path fill="none" marker-end="url(#mk-d2-4205902522-3488378134)" d="M543.25 96v28s0 10 10 10H799.5s10 0 10 10v117" class="connection stroke-B1 s0" mask="url(#d2-4205902522)"/><text x="722" y="140" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-4205902522-3488378134)" d="M106.5 376v263" class="connection stroke-B1 s0" mask="url(#d2-4205902522)"/><text x="107" y="514" class="text-italic fill-N2 s1">더 쪼개지는가?</text><path fill="none" marker-end="url(#mk-d2-4205902522-3488378134)" d="M338.5 376v263" class="connection stroke-B1 s0" mask="url(#d2-4205902522)"/><text x="339" y="514" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-4205902522-3488378134)" d="M725 381v28s0 10-10 10H587.5s-10 0-10 10v210" class="connection stroke-B1 s0" mask="url(#d2-4205902522)"/><text x="578" y="443" class="text-italic fill-N2 s1">고루 섞였는가?</text><path fill="none" marker-end="url(#mk-d2-4205902522-3488378134)" d="M809.5 381v258" class="connection stroke-B1 s0" mask="url(#d2-4205902522)"/><text x="810" y="517" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-4205902522-3488378134)" d="M894 381v74" class="connection stroke-B1 s0" mask="url(#d2-4205902522)"/><path fill="none" marker-end="url(#mk-d2-4205902522-3488378134)" d="M338.5 791v64" class="connection stroke-B1 s0" mask="url(#d2-4205902522)"/><mask id="d2-4205902522" width="1306" height="1131" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1306v1131H-89z"/><path d="M191 124h172v21H191zM691 124h62v21h-62zM42 498h130v21H42zM327 498h24v21h-24zM513 427h130v21H513zM779 501h62v21h-62z"/></mask></svg>