<svg xmlns="http://www.w3.org/2000/svg" width="2083" height="936" class="d2-3677192553 d2-svg" viewBox="-101 -101 2083 936"><rect width="2083" height="936" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3677192553 .fill-N1{fill:#0a0f25}.d2-3677192553 .fill-N2{fill:#676c7e}.d2-3677192553 .fill-B6{fill:#f7f8fe}.d2-3677192553 .stroke-B1,.d2-3677192553 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M556 0h331v82H556z" class="stroke-B1 fill-B6 s0"/></g><text x="721.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="721.5" dy="0">물질</tspan><tspan x="721.5" dy="18.5">(질량이 있고 자리를 차지하는 것)</tspan></text></g><g ><g class="shape"><path d="M183 211h361v98H183z" class="stroke-B1 fill-B6 s0"/></g><text x="363.5" y="249.5" class="text-bold fill-N1 s1"><tspan x="363.5" dy="0">순물질</tspan><tspan x="363.5" dy="17.667">조성이 어디서나 같고 정해져 있다</tspan><tspan x="363.5" dy="17.667">녹는점·끓는점이 하나로 딱 정해진다</tspan></text></g><g ><g class="shape"><path d="M1112 203h338v114h-338z" class="stroke-B1 fill-B6 s0"/></g><text x="1281" y="241.5" class="text-bold fill-N1 s1"><tspan x="1281" dy="0">혼합물</tspan><tspan x="1281" dy="17.25">두 가지 이상이 섞여 있다</tspan><tspan x="1281" dy="17.25">섞인 비율이 달라질 수 있다</tspan><tspan x="1281" dy="17.25">녹는점·끓는점이 구간으로 나온다</tspan></text></g><g ><g class="shape"><path d="M0 446h323v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="161.5" y="484.5" class="text-bold fill-N1 s1"><tspan x="161.5" dy="0">원소</tspan><tspan x="161.5" dy="17.667">화학적 방법으로 더 쪼갤 수 없다</tspan><tspan x="161.5" dy="17.667">수소, 산소, 철, 금</tspan></text></g><g ><g class="shape"><path d="M383 438h363v114H383z" class="stroke-B1 fill-B6 s0"/></g><text x="564.5" y="476.5" class="text-bold fill-N1 s1"><tspan x="564.5" dy="0">화합물</tspan><tspan x="564.5" dy="17.25">두 원소 이상이 정해진 비로 결합</tspan><tspan x="564.5" dy="17.25">쪼개면 성질이 전혀 다른 것이 나온다</tspan><tspan x="564.5" dy="17.25">물, 소금, 설탕</tspan></text></g><g ><g class="shape"><path d="M806 446h255v98H806z" class="stroke-B1 fill-B6 s0"/></g><text x="933.5" y="484.5" class="text-bold fill-N1 s1"><tspan x="933.5" dy="0">균일 혼합물 (용액)</tspan><tspan x="933.5" dy="17.667">어디를 떠도 조성이 같다</tspan><tspan x="933.5" dy="17.667">소금물, 공기, 놋쇠</tspan></text></g><g ><g class="shape"><path d="M1121 446h319v98h-319z" class="stroke-B1 fill-B6 s0"/></g><text x="1280.5" y="484.5" class="text-bold fill-N1 s1"><tspan x="1280.5" dy="0">불균일 혼합물</tspan><tspan x="1280.5" dy="17.667">뜨는 자리에 따라 조성이 다르다</tspan><tspan x="1280.5" dy="17.667">흙탕물, 우유, 화강암</tspan></text></g><g ><g class="shape"><path d="M1500 454h381v82h-381z" class="stroke-B2 fill-B6 s2"/></g><text x="1690.5" y="492.5" class="text-bold fill-N1 s1"><tspan x="1690.5" dy="0">혼합물은 물리적 방법으로 나눈다</tspan><tspan x="1690.5" dy="18.5">거르기 · 증류 · 크로마토그래피 · 재결정</tspan></text></g><g ><g class="shape"><path d="M397 652h336v82H397z" class="stroke-B2 fill-B6 s2"/></g><text x="565" y="690.5" class="text-bold fill-N1 s1"><tspan x="565" dy="0">화합물은 화학 반응으로만 나눈다</tspan><tspan x="565" dy="18.5">전기분해 · 가열분해</tspan></text></g><marker id="mk-d2-3677192553-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3677192553-3488378134)" d="M574.077 82.05C405.6 130.3 363 156.3 363 207.5" class="connection stroke-B1 s0" mask="url(#d2-3677192553)"/><text x="440" y="126" class="text-italic fill-N2 s1">성분이 한 가지인가?</text><path fill="none" marker-end="url(#mk-d2-3677192553-3488378134)" d="M888.468 71.855C1201.7 128.3 1280.5 154.7 1280.5 199.5" class="connection stroke-B1 s0" mask="url(#d2-3677192553)"/><text x="1109" y="117" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-3677192553-3488378134)" d="M276.777 309.516C184.9 363.7 161.5 391.3 161.5 442.5" class="connection stroke-B1 s0" mask="url(#d2-3677192553)"/><text x="192" y="365" class="text-italic fill-N2 s1">더 쪼개지는가?</text><path fill="none" marker-end="url(#mk-d2-3677192553-3488378134)" d="M449.223 309.516C541.1 363.7 564.5 389.7 564.5 434.5" class="connection stroke-B1 s0" mask="url(#d2-3677192553)"/><text x="530" y="363" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-3677192553-3488378134)" d="M1110.607 317.145C969.3 365.3 933.5 391.3 933.5 442.5" class="connection stroke-B1 s0" mask="url(#d2-3677192553)"/><text x="994" y="362" class="text-italic fill-N2 s1">고루 섞였는가?</text><path fill="none" marker-end="url(#mk-d2-3677192553-3488378134)" d="M1280.5 318.5v124" class="connection stroke-B1 s0" mask="url(#d2-3677192553)"/><text x="1281" y="387" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-3677192553-3488378134)" d="M1452.422 308.985C1642.5 363.686 1690.5 392.9 1690.5 450.5" class="connection stroke-B1 s0" mask="url(#d2-3677192553)"/><path fill="none" marker-end="url(#mk-d2-3677192553-3488378134)" d="M564.5 554v94" class="connection stroke-B1 s0" mask="url(#d2-3677192553)"/><mask id="d2-3677192553" width="2083" height="936" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2083v936H-101z"/><path d="M354 110h172v21H354zM1078 101h62v21h-62zM127 349h130v21H127zM518 347h24v21h-24zM929 346h130v21H929zM1250 371h62v21h-62z"/></mask></svg>