<svg xmlns="http://www.w3.org/2000/svg" width="3558" height="688" class="d2-1894181618 d2-svg" viewBox="-101 -101 3558 688"><rect width="3558" height="688" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1894181618 .fill-N1{fill:#0a0f25}.d2-1894181618 .fill-N2{fill:#676c7e}.d2-1894181618 .fill-B6{fill:#f7f8fe}.d2-1894181618 .stroke-B1,.d2-1894181618 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 252h232v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="116" y="290.5" class="text-bold fill-N1 s1"><tspan x="116" dy="0">주어진 물질의 양</tspan><tspan x="116" dy="18.5">질량 [g] · 부피 [L] · 개수</tspan></text></g><g ><g class="shape"><circle cx="797" cy="293" r="142" class="shape stroke-B1 fill-B6 s0"/></g><text x="797" y="298.5" class="text-bold fill-N1 s1">주어진 물질의 몰수</text></g><g ><g class="shape"><circle cx="1657" cy="156" r="156" class="shape stroke-B1 fill-B6 s0"/></g><text x="1657" y="161.5" class="text-bold fill-N1 s1">구하려는 물질의 몰수</text></g><g ><g class="shape"><path d="M2313 115h232v82h-232z" class="stroke-B1 fill-B6 s0"/></g><text x="2429" y="153.5" class="text-bold fill-N1 s1"><tspan x="2429" dy="0">구하려는 물질의 양</tspan><tspan x="2429" dy="18.5">질량 [g] · 부피 [L] · 개수</tspan></text></g><g ><g class="shape"><path d="M1423 372h467v114h-467z" class="stroke-B2 fill-B6 s2"/></g><text x="1656.5" y="410.5" class="text-bold fill-N1 s1"><tspan x="1656.5" dy="0">반응물이 둘 이상 주어졌다면</tspan><tspan x="1656.5" dy="17.25">먼저 한계 반응물을 찾는다</tspan><tspan x="1656.5" dy="17.25">반응물마다 위 길을 끝까지 가 보고</tspan><tspan x="1656.5" dy="17.25">생성물이 가장 적게 나오는 쪽이 한계 반응물이다</tspan></text></g><g ><g class="shape"><path d="M2926 107h430v98h-430z" class="stroke-B2 fill-B6 s2"/></g><text x="3141" y="145.5" class="text-bold fill-N1 s1"><tspan x="3141" dy="0">실제로 얻은 양과 견주려면</tspan><tspan x="3141" dy="17.667">수득률 = 실제 얻은 양 ÷ 계산으로 나온 양 × 100</tspan><tspan x="3141" dy="17.667">계산값을 넘을 수는 없다</tspan></text></g><marker id="mk-d2-1894181618-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1894181618-3488378134)" d="M233.5 292.5c167.6 0 252.3.1 417.5.49" class="connection stroke-B1 s0" mask="url(#d2-1894181618)"/><text x="443.5" y="282" class="text-italic fill-N2 s1"><tspan x="443.5" dy="0">몰질량으로 나눈다</tspan><tspan x="443.5" dy="17.667">또는 PV = nRT</tspan><tspan x="443.5" dy="17.667">또는 농도를 곱한다</tspan></text><path fill="none" marker-end="url(#mk-d2-1894181618-3488378134)" d="M932.884 244.33C1131 173.8 1245 156 1497 156" class="connection stroke-B1 s0" mask="url(#d2-1894181618)"/><text x="1210" y="159" class="text-italic fill-N2 s1"><tspan x="1210" dy="0">반응식의 계수비</tspan><tspan x="1210" dy="18.5">여기가 유일하게 화학인 곳</tspan></text><path fill="none" marker-end="url(#mk-d2-1894181618-3488378134)" d="M1815 156h494.5" class="connection stroke-B1 s0" mask="url(#d2-1894181618)"/><text x="2063.5" y="146" class="text-italic fill-N2 s1"><tspan x="2063.5" dy="0">몰질량을 곱한다</tspan><tspan x="2063.5" dy="17.667">또는 PV = nRT</tspan><tspan x="2063.5" dy="17.667">또는 농도로 나눈다</tspan></text><path fill="none" marker-end="url(#mk-d2-1894181618-3488378134)" d="M932.884 340.67C1131 411.2 1229.4 429 1419 429" class="connection stroke-B1 s0" mask="url(#d2-1894181618)"/><text x="1171" y="424" class="text-italic fill-N2 s1">반응물이 여럿이면</text><path fill="none" marker-end="url(#mk-d2-1894181618-3488378134)" d="M2546.5 156h376" class="connection stroke-B1 s0" mask="url(#d2-1894181618)"/><text x="2735.5" y="162" class="text-italic fill-N2 s1">실험값과 비교</text><mask id="d2-1894181618" width="3558" height="688" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3