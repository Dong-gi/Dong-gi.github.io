<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1624" class="d2-1100136877 d2-svg" viewBox="-101 -101 1100 1624"><rect width="1100" height="1624" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1100136877 .fill-N1{fill:#0a0f25}.d2-1100136877 .fill-N2{fill:#676c7e}.d2-1100136877 .fill-B1{fill:#0d32b2}.d2-1100136877 .fill-B6{fill:#f7f8fe}.d2-1100136877 .stroke-B1,.d2-1100136877 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M324 0h232v82H324z" class="stroke-B1 fill-B6 s0"/></g><text x="440" y="38.5" class="text-bold fill-N1 s1"><tspan x="440" dy="0">주어진 물질의 양</tspan><tspan x="440" dy="18.5">질량 [g] · 부피 [L] · 개수</tspan></text></g><g ><g class="shape"><circle cx="440" cy="377" r="142" class="shape stroke-B1 fill-B6 s0"/></g><text x="440" y="382.5" class="text-bold fill-N1 s1">주어진 물질의 몰수</text></g><g ><g class="shape"><circle cx="215" cy="812" r="156" class="shape stroke-B1 fill-B6 s0"/></g><text x="215" y="817.5" class="text-bold fill-N1 s1">구하려는 물질의 몰수</text></g><g ><g class="shape"><path d="M99 1121h232v82H99z" class="stroke-B1 fill-B6 s0"/></g><text x="215" y="1159.5" class="text-bold fill-N1 s1"><tspan x="215" dy="0">구하려는 물질의 양</tspan><tspan x="215" dy="18.5">질량 [g] · 부피 [L] · 개수</tspan></text></g><g ><g class="shape"><path d="M431 755h467v114H431z" class="stroke-B2 fill-B6 s2"/></g><text x="664.5" y="793.5" class="text-bold fill-N1 s1"><tspan x="664.5" dy="0">반응물이 둘 이상 주어졌다면</tspan><tspan x="664.5" dy="17.25">먼저 한계 반응물을 찾는다</tspan><tspan x="664.5" dy="17.25">반응물마다 위 길을 끝까지 가 보고</tspan><tspan x="664.5" dy="17.25">생성물이 가장 적게 나오는 쪽이 한계 반응물이다</tspan></text></g><g ><g class="shape"><path d="M0 1324h430v98H0z" class="stroke-B2 fill-B6 s2"/></g><text x="215" y="1362.5" class="text-bold fill-N1 s1"><tspan x="215" dy="0">실제로 얻은 양과 견주려면</tspan><tspan x="215" dy="17.667">수득률 = 실제 얻은 양 ÷ 계산으로 나온 양 × 100</tspan><tspan x="215" dy="17.667">계산값을 넘을 수는 없다</tspan></text></g><marker id="mk-d2-1100136877-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection fill-B1"/></marker><path fill="none" marker-end="url(#mk-d2-1100136877-3488378134)" d="M439.75 83.5c0 59.6.05 90.3.237 147.5" class="connection stroke-B1 s0" mask="url(#d2-1100136877)"/><text x="439.5" y="148" class="text-italic fill-N2 s1"><tspan x="439.5" dy="0">몰질량으로 나눈다</tspan><tspan x="439.5" dy="17.667">또는 PV = nRT</tspan><tspan x="439.5" dy="17.667">또는 농도를 곱한다</tspan></text><marker id="mk-d2-1100136877-3519660172" markerHeight="20" markerUnits="userSpaceOnUse" markerWidth="16" orient="auto" refX="10" refY="10" viewBox="0 0 16 20"><path stroke-width="4" d="m0 0 16 10L0 20z" class="connection fill-B1"/></marker><path fill="none" marker-end="url(#mk-d2-1100136877-3519660172)" d="M333.812 476.052C239.2 564.8 215 601.2 215 649" class="connection stroke-B1" mask="url(#d2-1100136877)" style="stroke-width:4"/><text x="252" y="551" class="text-italic fill-N2 s1"><tspan x="252" dy="0">여기가 유일하게 화학인 곳</tspan><tspan x="252" dy="18.5">반응식의 계수비</tspan></text><path fill="none" marker-end="url(#mk-d2-1100136877-3488378134)" d="M215 970v147.5" class="connection stroke-B1 s0" mask="url(#d2-1100136877)"/><text x="215.5" y="1034" class="text-italic fill-N2 s1"><tspan x="215.5" dy="0">몰질량을 곱한다</tspan><tspan x="215.5" dy="17.667">또는 PV = nRT</tspan><tspan x="215.5" dy="17.667">또는 농도로 나눈다</tspan></text><path fill="none" marker-end="url(#mk-d2-1100136877-3488378134)" d="M544.468 476.359C640.2 565 664.5 621.1 664.5 751.5" class="connection stroke-B1 s0" mask="url(#d2-1100136877)"/><text x="653" y="599" class="text-italic fill-N2 s1">반응물이 여럿이면</text><path fill="none" marker-end="url(#mk-d2-1100136877-3488378134)" d="M215 1204.5v116" class="connection stroke-B1 s0" mask="url(#d2-1100136877)"/><text x="215.5" y="1269" class="text-italic fill-N2 s1">실험값과 비교</text><mask id="d2-1100136877" width="1100" height="1624" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H999v1624H-101z"/><path d="M357 132h165v53H357zM139 535h226v37H139zM133 1018h165v53H133zM572 583h162v21H572zM154 1253h123v21H154z"/></mask></svg>