<svg xmlns="http://www.w3.org/2000/svg" width="2862" height="994" class="d2-74833378 d2-svg" viewBox="-101 -85 2862 994"><rect width="2862" height="994" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-74833378 .fill-N1{fill:#0a0f25}.d2-74833378 .fill-N2{fill:#676c7e}.d2-74833378 .fill-N4{fill:#cfd2dd}.d2-74833378 .fill-B5{fill:#edf0fd}.d2-74833378 .fill-B6{fill:#f7f8fe}.d2-74833378 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 477h235v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="117.5" y="515.5" class="text-bold fill-N1 s1">분자식은 같은 두 물질</text></g><g ><g class="shape"><path d="M710 556h-5l-259-45c-3 0-3-1 0-2l259-45h10l259 45c3 0 3 1 0 2l-259 45z" class="stroke-B1 fill-N4 s0"/></g><text x="710" y="515.5" class="text-bold fill-N1 s1">원자가 이어진 순서가 같은가</text></g><g ><g class="shape"><path d="M1429 56h379v474h-379z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1618.5" y="43" class="fill-N1" style="text-anchor:middle;font-size:28px">구조 이성질체 (다르다)</text></g><g ><g class="shape"><path d="M1618 722h-3l-154-45c-2 0-2-1 0-2l154-45h6l154 45c2 0 2 1 0 2l-154 45z" class="stroke-B1 fill-N4 s0"/></g><text x="1618" y="681.5" class="text-bold fill-N1 s1">거울상 관계인가</text></g><g ><g class="shape"><path d="M2217 710h376v98h-376z" class="stroke-B1 fill-B6 s0"/></g><text x="2405" y="748.5" class="text-bold fill-N1 s1"><tspan x="2405" dy="0">부분 입체 이성질체</tspan><tspan x="2405" dy="17.667">시스 - 트랜스가 대표적이다</tspan><tspan x="2405" dy="17.667">녹는점 · 끓는점 · 쌍극자가 서로 다르다</tspan></text></g><g ><g class="shape"><path d="M2257 536h296v114h-296z" class="stroke-B1 fill-B6 s0"/></g><text x="2405" y="574.5" class="text-bold fill-N1 s1"><tspan x="2405" dy="0">거울상 이성질체</tspan><tspan x="2405" dy="17.25">보통의 물리 성질은 같다</tspan><tspan x="2405" dy="17.25">편광을 돌리는 방향과</tspan><tspan x="2405" dy="17.25">생체 분자와의 결합이 다르다</tspan></text></g><g ><g class="shape"><path d="M2149 236h511v114h-511z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="2404.5" y="274.5" class="text-bold fill-N1 s1"><tspan x="2404.5" dy="0">구조 이성질체는 대개 아예 다른 물질처럼 행동하고,</tspan><tspan x="2404.5" dy="17.25">입체 이성질체는 성질이 가까워 갈라내기 어렵다.</tspan><tspan x="2404.5" dy="17.25">분자식만 같고 성질이 크게 다른 경우가 흔하다는 것이</tspan><tspan x="2404.5" dy="17.25">유기화학이 커지는 이유다</tspan></text></g><g ><g class="shape"><path d="M1470 86h296v98h-296z" class="stroke-B1 fill-B5 s0"/></g><text x="1618" y="124.5" class="text-bold fill-N1 s1"><tspan x="1618" dy="0">사슬 이성질체</tspan><tspan x="1618" dy="17.667">골격이 곧은가 가지가 있는가</tspan><tspan x="1618" dy="17.667">뷰테인 / 2-메틸프로페인</tspan></text></g><g ><g class="shape"><path d="M1459 244h319v98h-319z" class="stroke-B1 fill-B5 s0"/></g><text x="1618.5" y="282.5" class="text-bold fill-N1 s1"><tspan x="1618.5" dy="0">위치 이성질체</tspan><tspan x="1618.5" dy="17.667">작용기가 몇 번 탄소에 붙었는가</tspan><tspan x="1618.5" dy="17.667">1-프로판올 / 2-프로판올</tspan></text></g><g ><g class="shape"><path d="M1500 402h237v98h-237z" class="stroke-B1 fill-B5 s0"/></g><text x="1618.5" y="440.5" class="text-bold fill-N1 s1"><tspan x="1618.5" dy="0">작용기 이성질체</tspan><tspan x="1618.5" dy="17.667">작용기 자체가 다르다</tspan><tspan x="1618.5" dy="17.667">에탄올 / 다이메틸에터</tspan></text></g><marker id="mk-d2-74833378-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-74833378-3488378134)" d="M236.5 509.5c82 0 124.1.1 204.5.481" class="connection stroke-B1 s0" mask="url(#d2-74833378)"/><path fill="none" marker-end="url(#mk-d2-74833378-3488378134)" d="M782.805 475.14C1088.2 329.6 1217.8 293 1425 293" class="connection stroke-B1 s0" mask="url(#d2-74833378)"/><text x="1091" y="334" class="text-italic fill-N2 s1">다르다</text><path fill="none" marker-end="url(#mk-d2-74833378-3488378134)" d="M797.88 542.683C1091.2 649.2 1375.2 676 1456 676" class="connection stroke-B1 s0" mask="url(#d2-74833378)"/><text x="1119.5" y="657" class="text-italic fill-N2 s1">같다 (입체 이성질체)</text><path fill="none" marker-end="url(#mk-d2-74833378-3488378134)" d="M1696.907 651.398C1844.6 604.8 2063.7 593 2252.5 593" class="connection stroke-B1 s0" mask="url(#d2-74833378)"/><text x="1972" y="603" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-74833378-3488378134)" d="M1696.907 700.602C1844.6 747.2 2055.7 759 2212.5 759" class="connection stroke-B1 s0" mask="url(#d2-74833378)"/><text x="1952" y="759" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-74833378-3488378134)" d="M1809.5 293h336" class="connection stroke-B1 s0" mask="url(#d2-74833378)"/><mask id="d2-74833378" width="2862" height="994" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h2862v994H-101z"/><path d="M1060 318h62v21h-62zM1033 641h173v21h-173zM1941 587h62v21h-62zM1921 743h62v21h-62z"/></mask></svg>