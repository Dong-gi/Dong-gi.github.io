<svg xmlns="http://www.w3.org/2000/svg" width="1326" height="1473" class="d2-2742570340 d2-svg" viewBox="-89 -89 1326 1473"><rect width="1326" height="1473" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2742570340 .text-bold{font-weight:700}.d2-2742570340 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2742570340 .fill-N1{fill:#0a0f25}.d2-2742570340 .fill-N2{fill:#676c7e}.d2-2742570340 .fill-N4{fill:#cfd2dd}.d2-2742570340 .fill-B5{fill:#edf0fd}.d2-2742570340 .fill-B6{fill:#f7f8fe}.d2-2742570340 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M453 12h235v66H453z" class="stroke-B1 fill-B6 s0"/></g><text x="570.5" y="50.5" class="text-bold fill-N1 s1">분자식은 같은 두 물질</text></g><g ><g class="shape"><path d="M571 240h-5l-259-45c-3 0-3-1 0-2l259-45h10l259 45c3 0 3 1 0 2l-259 45z" class="stroke-B1 fill-N4 s0"/></g><text x="571" y="199.5" class="text-bold fill-N1 s1">원자가 이어진 순서가 같은가</text></g><g ><g class="shape"><path d="M48 411h439v494H48z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="267.5" y="444" class="fill-N1" style="text-anchor:middle;font-size:28px">구조 이성질체 (다르다)</text></g><g ><g class="shape"><path d="M770 771h-3l-154-45c-2 0-2-1 0-2l154-45h6l154 45c2 0 2 1 0 2l-154 45z" class="stroke-B1 fill-N4 s0"/></g><text x="770" y="730.5" class="text-bold fill-N1 s1">거울상 관계인가</text></g><g ><g class="shape"><path d="M760 1169h376v98H760z" class="stroke-B1 fill-B6 s0"/></g><text x="948" y="1207.5" class="text-bold fill-N1 s1"><tspan x="948" dy="0">부분 입체 이성질체</tspan><tspan x="948" dy="17.667">시스 - 트랜스가 대표적이다</tspan><tspan x="948" dy="17.667">녹는점 · 끓는점 · 쌍극자가 서로 다르다</tspan></text></g><g ><g class="shape"><path d="M444 1169h296v114H444z" class="stroke-B1 fill-B6 s0"/></g><text x="592" y="1207.5" class="text-bold fill-N1 s1"><tspan x="592" dy="0">거울상 이성질체</tspan><tspan x="592" dy="17.25">보통의 물리 성질은 같다</tspan><tspan x="592" dy="17.25">편광을 돌리는 방향과</tspan><tspan x="592" dy="17.25">생체 분자와의 결합이 다르다</tspan></text></g><g ><g class="shape"><path d="M12 985h511v114H12z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="267.5" y="1023.5" class="text-bold fill-N1 s1"><tspan x="267.5" dy="0">구조 이성질체는 대개 아예 다른 물질처럼 행동하고,</tspan><tspan x="267.5" dy="17.25">입체 이성질체는 성질이 가까워 갈라내기 어렵다.</tspan><tspan x="267.5" dy="17.25">분자식만 같고 성질이 크게 다른 경우가 흔하다는 것이</tspan><tspan x="267.5" dy="17.25">유기화학이 커지는 이유다</tspan></text></g><g ><g class="shape"><path d="M108 471h319v98H108z" class="stroke-B1 fill-B5 s0"/></g><text x="267.5" y="509.5" class="text-bold fill-N1 s1"><tspan x="267.5" dy="0">사슬 이성질체</tspan><tspan x="267.5" dy="17.667">골격이 곧은가 가지가 있는가</tspan><tspan x="267.5" dy="17.667">뷰테인 / 2-메틸프로페인</tspan></text></g><g ><g class="shape"><path d="M108 609h319v98H108z" class="stroke-B1 fill-B5 s0"/></g><text x="267.5" y="647.5" class="text-bold fill-N1 s1"><tspan x="267.5" dy="0">위치 이성질체</tspan><tspan x="267.5" dy="17.667">작용기가 몇 번 탄소에 붙었는가</tspan><tspan x="267.5" dy="17.667">1-프로판올 / 2-프로판올</tspan></text></g><g ><g class="shape"><path d="M108 747h319v98H108z" class="stroke-B1 fill-B5 s0"/></g><text x="267.5" y="785.5" class="text-bold fill-N1 s1"><tspan x="267.5" dy="0">작용기 이성질체</tspan><tspan x="267.5" dy="17.667">작용기 자체가 다르다</tspan><tspan x="267.5" dy="17.667">에탄올 / 다이메틸에터</tspan></text></g><marker id="mk-d2-2742570340-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2742570340-3488378134)" d="m571.404 80-.38 64" class="connection stroke-B1 s0" mask="url(#d2-2742570340)"/><path fill="none" marker-end="url(#mk-d2-2742570340-3488378134)" d="m482.99 228-.194 42s-.046 10-10.046 10H277.5s-10 0-10 10v117" class="connection stroke-B1 s0" mask="url(#d2-2742570340)"/><text x="337" y="286" class="text-italic fill-N2 s1">다르다</text><path fill="none" marker-end="url(#mk-d2-2742570340-3488378134)" d="M770 208v467" class="connection stroke-B1 s0" mask="url(#d2-2742570340)"/><text x="770.5" y="448" class="text-italic fill-N2 s1">같다 (입체 이성질체)</text><path fill="none" marker-end="url(#mk-d2-2742570340-3488378134)" d="m717.002 759 .493 406" class="connection stroke-B1 s0" mask="url(#d2-2742570340)"/><text x="717" y="969" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-2742570340-3488378134)" d="m823 758-.165 407" class="connection stroke-B1 s0" mask="url(#d2-2742570340)"/><text x="823" y="968" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-2742570340-3488378134)" d="M267.5 907v74" class="connection stroke-B1 s0" mask="url(#d2-2742570340)"/><mask id="d2-2742570340" width="1326" height="1473" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1326v1473H-89z"/><path d="M306 270h62v21h-62zM684 432h173v21H684zM686 953h62v21h-62zM792 952h62v21h-62z"/></mask></svg>