<svg xmlns="http://www.w3.org/2000/svg" width="848" height="1288" class="d2-1080258220 d2-svg" viewBox="-101 -101 848 1288"><rect width="848" height="1288" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1080258220 .fill-N1{fill:#0a0f25}.d2-1080258220 .fill-N2{fill:#676c7e}.d2-1080258220 .fill-B6{fill:#f7f8fe}.d2-1080258220 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M135 0h467v130H135z" class="stroke-B1 fill-B6 s0"/></g><text x="368.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="368.5" dy="0">분산력 (런던 힘)</tspan><tspan x="368.5" dy="17">전자가 순간적으로 한쪽에 몰려 생긴 일시적 쏠림</tspan><tspan x="368.5" dy="17">모든 분자에 예외 없이 있다</tspan><tspan x="368.5" dy="17">전자가 많고 길쭉할수록 세다</tspan><tspan x="368.5" dy="17">대략 1~10 kJ/mol</tspan></text></g><g ><g class="shape"><path d="M0 251h464v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="232" y="289.5" class="text-bold fill-N1 s1"><tspan x="232" dy="0">쌍극자-쌍극자 힘</tspan><tspan x="232" dy="17.25">영구적인 쏠림을 가진 극성 분자끼리 끌어당긴다</tspan><tspan x="232" dy="17.25">분산력 위에 얹힌다</tspan><tspan x="232" dy="17.25">대략 5~25 kJ/mol</tspan></text></g><g ><g class="shape"><path d="M8 486h449v114H8z" class="stroke-B1 fill-B6 s0"/></g><text x="232.5" y="524.5" class="text-bold fill-N1 s1"><tspan x="232.5" dy="0">수소결합</tspan><tspan x="232.5" dy="17.25">N·O·F 에 붙은 수소와 이웃의 N·O·F 홀전자쌍 사이</tspan><tspan x="232.5" dy="17.25">특별히 센 쌍극자 힘이다</tspan><tspan x="232.5" dy="17.25">대략 10~40 kJ/mol</tspan></text></g><g ><g class="shape"><path d="M80 729h235v114H80z" class="stroke-B1 fill-B6 s0"/></g><text x="197.5" y="767.5" class="text-bold fill-N1 s1"><tspan x="197.5" dy="0">이온-쌍극자 힘</tspan><tspan x="197.5" dy="17.25">이온과 극성 분자 사이</tspan><tspan x="197.5" dy="17.25">소금이 물에 녹는 이유</tspan><tspan x="197.5" dy="17.25">대략 40~600 kJ/mol</tspan></text></g><g ><g class="shape"><path d="M16 972h362v114H16z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="197" y="1010.5" class="text-bold fill-N1 s1"><tspan x="197" dy="0">참고 — 화학 결합</tspan><tspan x="197" dy="17.25">공유결합 150~1000 kJ/mol</tspan><tspan x="197" dy="17.25">이온결합(격자에너지) 600~4000 kJ/mol</tspan><tspan x="197" dy="17.25">분자간 힘보다 열 배에서 백 배 세다</tspan></text></g><g ><g class="shape"><path d="M394 721h252v130H394z" class="stroke-B1 fill-B6 s0"/></g><text x="520" y="759.5" class="text-bold fill-N1 s1"><tspan x="520" dy="0">분자간 힘이 세면</tspan><tspan x="520" dy="17">끓는점·녹는점이 높다</tspan><tspan x="520" dy="17">증발열이 크다</tspan><tspan x="520" dy="17">증기압이 낮다</tspan><tspan x="520" dy="17">점성과 표면장력이 크다</tspan></text></g><marker id="mk-d2-1080258220-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1080258220-3488378134)" d="M296.531 130.857C245.2 178.3 232 202.7 232 247.5" class="connection stroke-B1 s0" mask="url(#d2-1080258220)"/><text x="244" y="186" class="text-italic fill-N2 s1">극성이면 더해진다</text><path fill="none" marker-end="url(#mk-d2-1080258220-3488378134)" d="M232 366.5v116" class="connection stroke-B1 s0" mask="url(#d2-1080258220)"/><text x="232.5" y="431" class="text-italic fill-N2 s1">N·O·F 에 붙은 H 가 있으면 더해진다</text><path fill="none" marker-end="url(#mk-d2-1080258220-3488378134)" d="M214.434 601.418C200.6 648.3 197 674.3 197 725.5" class="connection stroke-B1 s0" mask="url(#d2-1080258220)"/><text x="199" y="669" class="text-italic fill-N2 s1">이온이 끼면</text><path fill="none" marker-end="url(#mk-d2-1080258220-3488378134)" d="M197 844.5v124" class="connection stroke-B1 s0" mask="url(#d2-1080258220)"/><text x="197" y="913" class="text-italic fill-N2 s1">자릿수 비교</text><path fill="none" marker-end="url(#mk-d2-1080258220-3488378134)" d="M453.325 130.732C514.15 178.3 529.75 214 529.75 249.25v235c0 35.25-1 188.45-4.673 233.263" class="connection stroke-B1 s0" mask="url(#d2-1080258220)"/><path fill="none" marker-end="url(#mk-d2-1080258220-3488378134)" d="M307.325 600.732C368.15 648.3 396.75 672.7 445.833 718.762" class="connection stroke-B1 s0" mask="url(#d2-1080258220)"/><mask id="d2-1080258220" width="848" height="1288" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h848v1288h-848z"/><path d="M163 170h162v21H163zM92 415h281v21H92zM147 653h104v21H147zM145 897h104v21H145z"/></mask></svg>