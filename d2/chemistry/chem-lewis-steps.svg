<svg xmlns="http://www.w3.org/2000/svg" width="991" height="1509" class="d2-2737741781 d2-svg" viewBox="-101 -101 991 1509"><rect width="991" height="1509" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2737741781 .fill-N1{fill:#0a0f25}.d2-2737741781 .fill-N2{fill:#676c7e}.d2-2737741781 .fill-B6{fill:#f7f8fe}.d2-2737741781 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M151 0h441v98H151z" class="stroke-B1 fill-B6 s0"/></g><text x="371.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="371.5" dy="0">1. 원자가전자를 모두 센다</tspan><tspan x="371.5" dy="17.667">족 번호에서 읽는다 (14족 = 4개, 16족 = 6개)</tspan><tspan x="371.5" dy="17.667">음이온이면 전하만큼 더하고 양이온이면 뺀다</tspan></text></g><g ><g class="shape"><path d="M150 198h444v114H150z" class="stroke-B1 fill-B6 s0"/></g><text x="372" y="236.5" class="text-bold fill-N1 s1"><tspan x="372" dy="0">2. 뼈대를 잡는다</tspan><tspan x="372" dy="17.25">전기음성도가 가장 작은 원자를 가운데에</tspan><tspan x="372" dy="17.25">수소는 언제나 바깥 (결합을 하나만 만든다)</tspan><tspan x="372" dy="17.25">중심 원자와 바깥 원자를 단일결합으로 잇는다</tspan></text></g><g ><g class="shape"><path d="M166 412h411v98H166z" class="stroke-B1 fill-B6 s0"/></g><text x="371.5" y="450.5" class="text-bold fill-N1 s1"><tspan x="371.5" dy="0">3. 남은 전자를 바깥 원자부터 채운다</tspan><tspan x="371.5" dy="17.667">바깥 원자가 각각 8개(수소는 2개)가 되도록</tspan><tspan x="371.5" dy="17.667">홀전자쌍으로 붙인다</tspan></text></g><g ><g class="shape"><path d="M193 610h357v66H193z" class="stroke-B1 fill-B6 s0"/></g><text x="371.5" y="648.5" class="text-bold fill-N1 s1">4. 그래도 남으면 중심 원자에 올린다</text></g><g ><g class="shape"><path d="M97 776h550v98H97z" class="stroke-B1 fill-B6 s0"/></g><text x="372" y="814.5" class="text-bold fill-N1 s1"><tspan x="372" dy="0">5. 중심 원자가 8개에 모자라면</tspan><tspan x="372" dy="17.667">바깥 원자의 홀전자쌍을 끌어와 이중·삼중결합으로 만든다</tspan><tspan x="372" dy="17.667">전자 총수는 그대로다 — 자리만 옮긴다</tspan></text></g><g ><g class="shape"><path d="M160 974h423v98H160z" class="stroke-B1 fill-B6 s0"/></g><text x="371.5" y="1012.5" class="text-bold fill-N1 s1"><tspan x="371.5" dy="0">6. 형식전하를 계산해 검산한다</tspan><tspan x="371.5" dy="17.667">형식전하 = 원자가전자 − 홀전자 수 − 결합 수</tspan><tspan x="371.5" dy="17.667">0에 가까울수록 좋은 구조다</tspan></text></g><g ><g class="shape"><path d="M0 1201h319v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="159.5" y="1239.5" class="text-bold fill-N1 s1"><tspan x="159.5" dy="0">같은 값의 구조가 여럿이면 공명</tspan><tspan x="159.5" dy="17.667">모두 적고 양쪽 화살표로 잇는다</tspan><tspan x="159.5" dy="17.667">실제 모습은 그 평균이다</tspan></text></g><g ><g class="shape"><path d="M379 1193h410v114H379z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="584" y="1231.5" class="text-bold fill-N1 s1"><tspan x="584" dy="0">옥텟을 벗어나는 세 경우</tspan><tspan x="584" dy="17.25">· 전자가 모자란 것: BF3 (붕소가 6개)</tspan><tspan x="584" dy="17.25">· 홀수 개: NO (짝이 없는 전자 하나)</tspan><tspan x="584" dy="17.25">· 8개를 넘는 것: PCl5, SF6 (3주기 아래에서만)</tspan></text></g><marker id="mk-d2-2737741781-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2737741781-3488378134)" d="M371.75 100v94" class="connection stroke-B1 s0" mask="url(#d2-2737741781)"/><path fill="none" marker-end="url(#mk-d2-2737741781-3488378134)" d="M371.75 314v94" class="connection stroke-B1 s0" mask="url(#d2-2737741781)"/><path fill="none" marker-end="url(#mk-d2-2737741781-3488378134)" d="M371.75 512v94" class="connection stroke-B1 s0" mask="url(#d2-2737741781)"/><path fill="none" marker-end="url(#mk-d2-2737741781-3488378134)" d="M371.75 678v94" class="connection stroke-B1 s0" mask="url(#d2-2737741781)"/><path fill="none" marker-end="url(#mk-d2-2737741781-3488378134)" d="M371.75 876v94" class="connection stroke-B1 s0" mask="url(#d2-2737741781)"/><path fill="none" marker-end="url(#mk-d2-2737741781-3488378134)" d="M274.727 1072.425C182.899 1120.3 159.5 1146.3 159.5 1197.5" class="connection stroke-B1 s0" mask="url(#d2-2737741781)"/><text x="189.5" y="1122" class="text-italic fill-N2 s1">같은 점수의 구조가 여럿이면</text><path fill="none" marker-end="url(#mk-d2-2737741781-3488378134)" d="M468.773 1072.425C560.6 1120.3 584 1144.7 584 1189.5" class="connection stroke-B1 s0" mask="url(#d2-2737741781)"/><text x="550.5" y="1120" class="text-italic fill-N2 s1">옥텟이 안 맞으면</text><mask id="d2-2737741781" width="991" height="1509" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h991v1509h-991z"/><path d="M67 1106h245v21H67zM478 1104h145v21H478z"/></mask></svg>