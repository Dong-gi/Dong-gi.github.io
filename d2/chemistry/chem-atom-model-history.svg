<svg xmlns="http://www.w3.org/2000/svg" width="1231" height="1288" class="d2-2953629108 d2-svg" viewBox="-101 -101 1231 1288"><rect width="1231" height="1288" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2953629108 .fill-N1{fill:#0a0f25}.d2-2953629108 .fill-N2{fill:#676c7e}.d2-2953629108 .fill-B6{fill:#f7f8fe}.d2-2953629108 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M37 0h302v98H37z" class="stroke-B1 fill-B6 s0"/></g><text x="188" y="38.5" class="text-bold fill-N1 s1"><tspan x="188" dy="0">돌턴 (1803)</tspan><tspan x="188" dy="17.667">원자는 더 쪼갤 수 없는 알갱이</tspan><tspan x="188" dy="17.667">같은 원소의 원자는 모두 같다</tspan></text></g><g ><g class="shape"><path d="M6 251h363v98H6z" class="stroke-B1 fill-B6 s0"/></g><text x="187.5" y="289.5" class="text-bold fill-N1 s1"><tspan x="187.5" dy="0">톰슨 (1897)</tspan><tspan x="187.5" dy="17.667">양전하 덩어리 속에 전자가 박혀 있다</tspan><tspan x="187.5" dy="17.667">건포도 빵 모형</tspan></text></g><g ><g class="shape"><path d="M16 502h343v98H16z" class="stroke-B1 fill-B6 s0"/></g><text x="187.5" y="540.5" class="text-bold fill-N1 s1"><tspan x="187.5" dy="0">러더퍼드 (1911)</tspan><tspan x="187.5" dy="17.667">아주 작고 무거운 핵이 가운데 있고</tspan><tspan x="187.5" dy="17.667">그 둘레는 거의 비어 있다</tspan></text></g><g ><g class="shape"><path d="M6 753h363v98H6z" class="stroke-B1 fill-B6 s0"/></g><text x="187.5" y="791.5" class="text-bold fill-N1 s1"><tspan x="187.5" dy="0">보어 (1913)</tspan><tspan x="187.5" dy="17.667">전자는 정해진 에너지 궤도에만 있다</tspan><tspan x="187.5" dy="17.667">궤도를 옮길 때 빛을 내거나 흡수한다</tspan></text></g><g ><g class="shape"><path d="M0 988h375v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="187.5" y="1026.5" class="text-bold fill-N1 s1"><tspan x="187.5" dy="0">양자역학 모형 (1926~)</tspan><tspan x="187.5" dy="17.667">전자의 자리는 확률로만 말할 수 있다</tspan><tspan x="187.5" dy="17.667">오비탈 = 전자를 발견할 확률이 큰 영역</tspan></text></g><g ><g class="shape"><path d="M399 0h630v98H399z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="714" y="38.5" class="text-bold fill-N1 s1"><tspan x="714" dy="0">지금도 살아 있는 것</tspan><tspan x="714" dy="17.667">돌턴의 &apos;정해진 개수비로 결합한다&apos;는 8장 화학량론에서 그대로 쓴다</tspan><tspan x="714" dy="17.667">보어의 에너지 준위 그림은 스펙트럼을 읽을 때 그대로 쓴다</tspan></text></g><marker id="mk-d2-2953629108-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2953629108-3488378134)" d="M187.5 99.5v148" class="connection stroke-B1 s0" mask="url(#d2-2953629108)"/><text x="188" y="164" class="text-italic fill-N2 s1"><tspan x="188" dy="0">음극선 실험 —</tspan><tspan x="188" dy="17.667">원자에서 전자가 튀어나온다</tspan><tspan x="188" dy="17.667">원자는 쪼갤 수 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-2953629108-3488378134)" d="M187.5 350.5v148" class="connection stroke-B1 s0" mask="url(#d2-2953629108)"/><text x="188" y="415" class="text-italic fill-N2 s1"><tspan x="188" dy="0">알파 입자 산란 —</tspan><tspan x="188" dy="17.667">드물게 크게 되튄다</tspan><tspan x="188" dy="17.667">양전하가 한 점에 뭉쳐 있어야 한다</tspan></text><path fill="none" marker-end="url(#mk-d2-2953629108-3488378134)" d="M187.5 601.5v148" class="connection stroke-B1 s0" mask="url(#d2-2953629108)"/><text x="187.5" y="666" class="text-italic fill-N2 s1"><tspan x="187.5" dy="0">선스펙트럼 —</tspan><tspan x="187.5" dy="17.667">에너지가 띄엄띄엄하다</tspan><tspan x="187.5" dy="17.667">또 고전 이론대로면 전자가 핵으로 떨어진다</tspan></text><path fill="none" marker-end="url(#mk-d2-2953629108-3488378134)" d="M187.5 852.5v132" class="connection stroke-B1 s0" mask="url(#d2-2953629108)"/><text x="187.5" y="917" class="text-italic fill-N2 s1"><tspan x="187.5" dy="0">수소 말고는 맞지 않는다</tspan><tspan x="187.5" dy="18.5">전자도 파동의 성질을 보인다</tspan></text><mask id="d2-2953629108" width="1231" height="1288" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1231v1288H-101z"/><path d="M67 148h242v53H67zM43 399h290v53H43zM4 650h367v53H4zM65 901h245v37H65z"/></mask></svg>