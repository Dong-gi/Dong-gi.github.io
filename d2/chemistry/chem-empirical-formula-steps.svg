<svg xmlns="http://www.w3.org/2000/svg" width="742" height="1472" class="d2-4149402327 d2-svg" viewBox="-101 -101 742 1472"><rect width="742" height="1472" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4149402327 .fill-N1{fill:#0a0f25}.d2-4149402327 .fill-B6{fill:#f7f8fe}.d2-4149402327 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M9 0h523v98H9z" class="stroke-B1 fill-B6 s0"/></g><text x="270.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="270.5" dy="0">1. 시료 100 g 이 있다고 놓는다</tspan><tspan x="270.5" dy="17.667">질량 백분율이 그대로 그램 수가 된다</tspan><tspan x="270.5" dy="17.667">(백분율이 아니라 실제 질량이 주어졌으면 그 값을 쓴다)</tspan></text></g><g ><g class="shape"><path d="M38 198h465v98H38z" class="stroke-B1 fill-B6 s0"/></g><text x="270.5" y="236.5" class="text-bold fill-N1 s1"><tspan x="270.5" dy="0">2. 각 원소의 질량을 그 원소의 몰질량으로 나눈다</tspan><tspan x="270.5" dy="17.667">→ 원소마다 몇 몰인지가 나온다</tspan><tspan x="270.5" dy="17.667">여기가 질량비에서 개수비로 넘어가는 자리다</tspan></text></g><g ><g class="shape"><path d="M58 396h424v82H58z" class="stroke-B1 fill-B6 s0"/></g><text x="270" y="434.5" class="text-bold fill-N1 s1"><tspan x="270" dy="0">3. 나온 몰수를 가장 작은 값으로 모두 나눈다</tspan><tspan x="270" dy="18.5">→ 가장 작은 원소가 1이 되는 비가 나온다</tspan></text></g><g ><g class="shape"><path d="M57 578h426v98H57z" class="stroke-B1 fill-B6 s0"/></g><text x="270" y="616.5" class="text-bold fill-N1 s1"><tspan x="270" dy="0">4. 아직 정수가 아니면 작은 정수를 곱한다</tspan><tspan x="270" dy="17.667">1.5 → 2배, 1.33 → 3배, 1.25 → 4배</tspan><tspan x="270" dy="17.667">0.05 정도의 어긋남은 반올림한다 (실험 오차)</tspan></text></g><g ><g class="shape"><path d="M57 776h427v82H57z" class="stroke-B1 fill-B6 s0"/></g><text x="270.5" y="814.5" class="text-bold fill-N1 s1"><tspan x="270.5" dy="0">5. 이것이 실험식이다</tspan><tspan x="270.5" dy="18.5">원자의 개수비를 가장 간단한 정수로 적은 식</tspan></text></g><g ><g class="shape"><path d="M40 958h461v98H40z" class="stroke-B1 fill-B6 s0"/></g><text x="270.5" y="996.5" class="text-bold fill-N1 s1"><tspan x="270.5" dy="0">6. 분자식을 구하려면 분자량이 하나 더 필요하다</tspan><tspan x="270.5" dy="17.667">n = 분자량 ÷ 실험식량</tspan><tspan x="270.5" dy="17.667">분자식 = (실험식)을 n 배 한 것</tspan></text></g><g ><g class="shape"><path d="M0 1156h540v114H0z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="270" y="1194.5" class="text-bold fill-N1 s1"><tspan x="270" dy="0">실험식만으로는 분자를 정할 수 없다</tspan><tspan x="270" dy="17.25">CH2O 는 폼알데하이드(CH2O)이기도 하고</tspan><tspan x="270" dy="17.25">아세트산(C2H4O2)이기도 하고 포도당(C6H12O6)이기도 하다</tspan><tspan x="270" dy="17.25">분자량을 알아야 갈린다</tspan></text></g><marker id="mk-d2-4149402327-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4149402327-3488378134)" d="M270 100v94" class="connection stroke-B1 s0" mask="url(#d2-4149402327)"/><path fill="none" marker-end="url(#mk-d2-4149402327-3488378134)" d="M270 298v94" class="connection stroke-B1 s0" mask="url(#d2-4149402327)"/><path fill="none" marker-end="url(#mk-d2-4149402327-3488378134)" d="M270 480v94" class="connection stroke-B1 s0" mask="url(#d2-4149402327)"/><path fill="none" marker-end="url(#mk-d2-4149402327-3488378134)" d="M270 678v94" class="connection stroke-B1 s0" mask="url(#d2-4149402327)"/><path fill="none" marker-end="url(#mk-d2-4149402327-3488378134)" d="M270 860v94" class="connection stroke-B1 s0" mask="url(#d2-4149402327)"/><path fill="none" marker-end="url(#mk-d2-4149402327-3488378134)" d="M270 1058v94" class="connection stroke-B1 s0" mask="url(#d2-4149402327)"/><mask id="d2-4149402327" width="742" height="1472" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h742v1472h-742z"/></mask></svg>