<svg xmlns="http://www.w3.org/2000/svg" width="1151" height="1696" class="d2-2444384480 d2-svg" viewBox="-89 -89 1151 1696"><rect width="1151" height="1696" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2444384480 .text-bold{font-weight:700}.d2-2444384480 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2444384480 .fill-N1{fill:#0a0f25}.d2-2444384480 .fill-N2{fill:#676c7e}.d2-2444384480 .fill-B4{fill:#e3e9fd}.d2-2444384480 .fill-B5{fill:#edf0fd}.d2-2444384480 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M170 837c-1 0-2 0-3-1L13 761q-3-1.5 0-3l154-76q3-1.5 6 0l154 76q3 1.5 0 3l-154 75c-1 1-2 1-3 1Z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="170" y="748.5" class="text-bold fill-N1 s0"><tspan x="170" dy="0">변화가 일어났다</tspan><tspan x="170" dy="17.667">새로운 물질이</tspan><tspan x="170" dy="17.667">생겼는가?</tspan></text></g><g ><g class="shape"><path d="M578 12h334v466H578z" class="stroke-B1 fill-B4 s1"/></g><text x="745" y="45" class="fill-N1 s2"><tspan x="745" dy="0">물리적 변화</tspan><tspan x="745" dy="30">분자는 그대로이고</tspan><tspan x="745" dy="30">배치만 바뀐다</tspan><tspan x="745" dy="30">되돌리기 쉽다</tspan></text></g><g ><g class="shape"><path d="M578 498h339v522H578z" class="stroke-B1 fill-B4 s1"/></g><text x="747.5" y="531" class="fill-N1 s2"><tspan x="747.5" dy="0">화학적 변화</tspan><tspan x="747.5" dy="29.333">(화학 반응)</tspan><tspan x="747.5" dy="29.333">원자의 짝이 바뀌어</tspan><tspan x="747.5" dy="29.333">다른 물질이 된다</tspan><tspan x="747.5" dy="29.333">되돌리려면 또 다른</tspan><tspan x="747.5" dy="29.333">반응이 필요하다</tspan></text></g><g ><g class="shape"><path d="M578 1040h383v466H578z" class="fill-B4" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="769.5" y="1073" class="fill-N1 s2">헷갈리는 것들</text></g><g ><g class="shape"><path d="M644 142h201v82H644z" class="stroke-B1 fill-B5 s1"/></g><text x="744.5" y="180.5" class="text-bold fill-N1 s0"><tspan x="744.5" dy="0">얼음이 녹는다</tspan><tspan x="744.5" dy="18.5">H2O 분자는 그대로</tspan></text></g><g ><g class="shape"><path d="M639 244h212v98H639z" class="stroke-B1 fill-B5 s1"/></g><text x="745" y="282.5" class="text-bold fill-N1 s0"><tspan x="745" dy="0">설탕이 물에 녹는다</tspan><tspan x="745" dy="17.667">증발시키면</tspan><tspan x="745" dy="17.667">설탕이 돌아온다</tspan></text></g><g ><g class="shape"><path d="M649 362h191v66H649z" class="stroke-B1 fill-B5 s1"/></g><text x="744.5" y="400.5" class="text-bold fill-N1 s0">철을 두드려 편다</text></g><g ><g class="shape"><path d="M649 684h197v82H649z" class="stroke-B1 fill-B5 s1"/></g><text x="747.5" y="722.5" class="text-bold fill-N1 s0"><tspan x="747.5" dy="0">철이 녹슨다</tspan><tspan x="747.5" dy="18.5">철 + 산소 → 산화철</tspan></text></g><g ><g class="shape"><path d="M643 786h209v98H643z" class="stroke-B1 fill-B5 s1"/></g><text x="747.5" y="824.5" class="text-bold fill-N1 s0"><tspan x="747.5" dy="0">나무가 탄다</tspan><tspan x="747.5" dy="17.667">이산화탄소와 물이</tspan><tspan x="747.5" dy="17.667">새로 생긴다</tspan></text></g><g ><g class="shape"><path d="M653 904h188v66H653z" class="stroke-B1 fill-B5 s1"/></g><text x="747" y="942.5" class="text-bold fill-N1 s0">음식이 소화된다</text></g><g ><g class="shape"><path d="M643 1090h252v114H643z" class="stroke-B1 fill-B5 s1"/></g><text x="769" y="1128.5" class="text-bold fill-N1 s0"><tspan x="769" dy="0">달걀을 삶는다 →</tspan><tspan x="769" dy="17.25">화학적 변화</tspan><tspan x="769" dy="17.25">단백질의 구조가 바뀌어</tspan><tspan x="769" dy="17.25">되돌아오지 않는다</tspan></text></g><g ><g class="shape"><path d="M628 1224h283v114H628z" class="stroke-B1 fill-B5 s1"/></g><text x="769.5" y="1262.5" class="text-bold fill-N1 s0"><tspan x="769.5" dy="0">드라이아이스가 사라진다 →</tspan><tspan x="769.5" dy="17.25">물리적 변화</tspan><tspan x="769.5" dy="17.25">고체가 기체가 된 것뿐,</tspan><tspan x="769.5" dy="17.25">여전히 이산화탄소</tspan></text></g><g ><g class="shape"><path d="M665 1358h209v98H665z" class="stroke-B1 fill-B5 s1"/></g><text x="769.5" y="1396.5" class="text-bold fill-N1 s0"><tspan x="769.5" dy="0">전구가 빛난다 →</tspan><tspan x="769.5" dy="17.667">물리적 변화</tspan><tspan x="769.5" dy="17.667">텅스텐은 그대로다</tspan></text></g><marker id="mk-d2-2444384480-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2444384480-3488378134)" d="M252 720h106s10 0 10-10V255s0-10 10-10h196" class="connection stroke-B1 s1" mask="url(#d2-2444384480)"/><text x="368" y="442" class="text-italic fill-N2 s0">아니오</text><path fill="none" marker-end="url(#mk-d2-2444384480-3488378134)" d="M330 759h244" class="connection stroke-B1 s1" mask="url(#d2-2444384480)"/><text x="453" y="765" class="text-italic fill-N2 s0">예</text><path fill="none" marker-end="url(#mk-d2-2444384480-3488378134)" d="M253 798h105s10 0 10 10v455s0 10 10 10h196" class="connection stroke-B1 s1" mask="url(#d2-2444384480)"/><text x="368" y="1088" class="text-italic fill-N2 s0">판정해 보기</text><mask id="d2-2444384480" width="1151" height="1696" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1151v1696H-89z"/><path d="M337 426h62v21h-62zM441 749h24v21h-24zM316 1072h104v21H316z"/></mask></svg>