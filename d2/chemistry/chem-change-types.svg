<svg xmlns="http://www.w3.org/2000/svg" width="1462" height="1772" class="d2-1121146836 d2-svg" viewBox="-101 -85 1462 1772"><rect width="1462" height="1772" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1121146836 .fill-N1{fill:#0a0f25}.d2-1121146836 .fill-N2{fill:#676c7e}.d2-1121146836 .fill-B4{fill:#e3e9fd}.d2-1121146836 .fill-B5{fill:#edf0fd}.d2-1121146836 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M230 939h-4L2 878c-2-1-2-2 0-2l224-61c2-1 6-1 8 0l224 60c2 1 2 2 0 2l-224 62z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="230" y="874.5" class="text-bold fill-N1 s0"><tspan x="230" dy="0">변화가 일어났다</tspan><tspan x="230" dy="18.5">새로운 물질이 생겼는가?</tspan></text></g><g ><g class="shape"><path d="M804 112h353v410H804z" class="stroke-B1 fill-B4 s1"/></g><text x="980.5" y="43" class="fill-N1 s2"><tspan x="980.5" dy="0">물리적 변화</tspan><tspan x="980.5" dy="30.667">분자는 그대로이고 배치만 바뀐다</tspan><tspan x="980.5" dy="30.667">되돌리기 쉽다</tspan></text></g><g ><g class="shape"><path d="M792 664h376v410H792z" class="stroke-B1 fill-B4 s1"/></g><text x="980" y="595" class="fill-N1 s2"><tspan x="980" dy="0">화학적 변화 (화학 반응)</tspan><tspan x="980" dy="30.667">원자의 짝이 바뀌어 다른 물질이 된다</tspan><tspan x="980" dy="30.667">되돌리려면 또 다른 반응이 필요하다</tspan></text></g><g ><g class="shape"><path d="M740 1160h480v426H740z" class="fill-B4" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="980" y="1147" class="fill-N1 s2">헷갈리는 것들</text></g><g ><g class="shape"><path d="M880 142h201v82H880z" class="stroke-B1 fill-B5 s1"/></g><text x="980.5" y="180.5" class="text-bold fill-N1 s0"><tspan x="980.5" dy="0">얼음이 녹는다</tspan><tspan x="980.5" dy="18.5">H2O 분자는 그대로</tspan></text></g><g ><g class="shape"><path d="M834 284h293v82H834z" class="stroke-B1 fill-B5 s1"/></g><text x="980.5" y="322.5" class="text-bold fill-N1 s0"><tspan x="980.5" dy="0">설탕이 물에 녹는다</tspan><tspan x="980.5" dy="18.5">증발시키면 설탕이 돌아온다</tspan></text></g><g ><g class="shape"><path d="M885 426h191v66H885z" class="stroke-B1 fill-B5 s1"/></g><text x="980.5" y="464.5" class="text-bold fill-N1 s0">철을 두드려 편다</text></g><g ><g class="shape"><path d="M882 694h197v82H882z" class="stroke-B1 fill-B5 s1"/></g><text x="980.5" y="732.5" class="text-bold fill-N1 s0"><tspan x="980.5" dy="0">철이 녹슨다</tspan><tspan x="980.5" dy="18.5">철 + 산소 → 산화철</tspan></text></g><g ><g class="shape"><path d="M822 836h316v82H822z" class="stroke-B1 fill-B5 s1"/></g><text x="980" y="874.5" class="text-bold fill-N1 s0"><tspan x="980" dy="0">나무가 탄다</tspan><tspan x="980" dy="18.5">이산화탄소와 물이 새로 생긴다</tspan></text></g><g ><g class="shape"><path d="M886 978h188v66H886z" class="stroke-B1 fill-B5 s1"/></g><text x="980" y="1016.5" class="text-bold fill-N1 s0">음식이 소화된다</text></g><g ><g class="shape"><path d="M770 1190h420v82H770z" class="stroke-B1 fill-B5 s1"/></g><text x="980" y="1228.5" class="text-bold fill-N1 s0"><tspan x="980" dy="0">달걀을 삶는다 → 화학적 변화</tspan><tspan x="980" dy="18.5">단백질의 구조가 바뀌어 되돌아오지 않는다</tspan></text></g><g ><g class="shape"><path d="M776 1332h408v82H776z" class="stroke-B1 fill-B5 s1"/></g><text x="980" y="1370.5" class="text-bold fill-N1 s0"><tspan x="980" dy="0">드라이아이스가 사라진다 → 물리적 변화</tspan><tspan x="980" dy="18.5">고체가 기체가 된 것뿐, 여전히 이산화탄소</tspan></text></g><g ><g class="shape"><path d="M835 1474h290v82H835z" class="stroke-B1 fill-B5 s1"/></g><text x="980" y="1512.5" class="text-bold fill-N1 s0"><tspan x="980" dy="0">전구가 빛난다 → 물리적 변화</tspan><tspan x="980" dy="18.5">텅스텐은 그대로다</tspan></text></g><marker id="mk-d2-1121146836-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1121146836-3488378134)" d="M273.049 823.297C518.4 425 624.8 325 800 325" class="connection stroke-B1 s1" mask="url(#d2-1121146836)"/><text x="480" y="492" class="text-italic fill-N2 s0">아니오</text><path fill="none" marker-end="url(#mk-d2-1121146836-3488378134)" d="M460 877h328" class="connection stroke-B1 s1" mask="url(#d2-1121146836)"/><text x="625" y="883" class="text-italic fill-N2 s0">예</text><path fill="none" marker-end="url(#mk-d2-1121146836-3488378134)" d="M272.142 930.642C518.2 1284.2 612 1373 736 1373" class="connection stroke-B1 s1" mask="url(#d2-1121146836)"/><text x="468" y="1218" class="text-italic fill-N2 s0">판정해 보기</text><mask id="d2-1121146836" width="1462" height="1772" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h1462v1772H-101z"/><path d="M449 476h62v21h-62zM613 867h24v21h-24zM416 1202h104v21H416z"/></mask></svg>