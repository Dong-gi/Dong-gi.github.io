<svg xmlns="http://www.w3.org/2000/svg" width="1331" height="1443" class="d2-3708480273 d2-svg" viewBox="-89 -89 1331 1443"><rect width="1331" height="1443" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3708480273 .text-bold{font-weight:700}.d2-3708480273 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3708480273 .fill-N1{fill:#0a0f25}.d2-3708480273 .fill-N2{fill:#676c7e}.d2-3708480273 .fill-B6{fill:#f7f8fe}.d2-3708480273 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="382" cy="58.5" class="shape stroke-B1 fill-B6 s0" rx="139" ry="46.5"/></g><text x="382" y="64" class="text-bold fill-N1 s1">lim 을 구해야 한다</text></g><g ><g class="shape"><path d="M264 175h235v66H264z" class="stroke-B1 fill-B6 s0"/></g><text x="381.5" y="213.5" class="text-bold fill-N1 s1">먼저 그냥 대입해 본다</text></g><g ><g class="shape"><ellipse cx="239.5" cy="484" class="shape stroke-B1 fill-B6 s0" rx="216.5" ry="72"/></g><text x="239.5" y="473.5" class="text-bold fill-N1 s1"><tspan x="239.5" dy="0">값이 나왔다</tspan><tspan x="239.5" dy="17.667">→ 그 값이 극한이다</tspan><tspan x="239.5" dy="17.667">(연속인 함수는 여기서 끝난다)</tspan></text></g><g ><g class="shape"><path d="M476 450h200v98H476z" class="stroke-B1 fill-B6 s0"/></g><text x="576" y="488.5" class="text-bold fill-N1 s1"><tspan x="576" dy="0">0/0 또는 ∞/∞</tspan><tspan x="576" dy="17.667">= 부정형</tspan><tspan x="576" dy="17.667">식을 고쳐야 한다</tspan></text></g><g ><g class="shape"><path d="M12 827h311v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="167.5" y="865.5" class="text-bold fill-N1 s1"><tspan x="167.5" dy="0">인수분해하고 약분</tspan><tspan x="167.5" dy="18.5">분모가 0 이 되는 인수를 없앤다</tspan></text></g><g ><g class="shape"><path d="M717 827h297v82H717z" class="stroke-B1 fill-B6 s0"/></g><text x="865.5" y="865.5" class="text-bold fill-N1 s1"><tspan x="865.5" dy="0">근호가 있으면 유리화</tspan><tspan x="865.5" dy="18.5">켤레식을 분모·분자에 곱한다</tspan></text></g><g ><g class="shape"><path d="M404 827h293v82H404z" class="stroke-B1 fill-B6 s0"/></g><text x="550.5" y="865.5" class="text-bold fill-N1 s1"><tspan x="550.5" dy="0">x → ∞ 인 유리식이면</tspan><tspan x="550.5" dy="18.5">분모의 최고차항으로 나눈다</tspan></text></g><g ><g class="shape"><path d="M153 989h276v82H153z" class="stroke-B1 fill-B6 s0"/></g><text x="291" y="1027.5" class="text-bold fill-N1 s1"><tspan x="291" dy="0">sin x / x 나 (1 + 1/n)ⁿ 꼴이면</tspan><tspan x="291" dy="18.5">외워 둔 극한으로 되돌린다</tspan></text></g><g ><g class="shape"><path d="M801 989h340v82H801z" class="stroke-B1 fill-B6 s0"/></g><text x="971" y="1027.5" class="text-bold fill-N1 s1"><tspan x="971" dy="0">값을 직접 못 구하겠으면</tspan><tspan x="971" dy="18.5">위아래에서 죄는 두 함수를 찾는다</tspan></text></g><path fill="transparent" stroke="transparent" d="M326 1091h500v162H326z" class="shape s0"/><text x="535" y="1131" class="fill-N1 s1"><tspan x="535" dy="0">부정형이라는 말은 ‘값이 없다’ 가 아니라</tspan><tspan x="535" dy="17.667">‘이 꼴만 보고는 정할 수 없다’ 는 뜻이다.</tspan><tspan x="535" dy="17.667">같은 0/0 이라도 답은 0 일 수도, ∞ 일 수도 있다</tspan></text><text x="576" y="1208" class="fill-N1 s1"><tspan x="576" dy="0">대입해서 (0 이 아닌 수)/0 이 나왔다면 부정형이 아니다.</tspan><tspan x="576" dy="18.5">그때는 발산이고, 좌우 부호를 따로 살펴야 한다</tspan></text><marker id="mk-d2-3708480273-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3708480273-3488378134)" d="M382 107v64" class="connection stroke-B1 s0" mask="url(#d2-3708480273)"/><path fill="none" marker-end="url(#mk-d2-3708480273-3488378134)" d="m343.082 243-.08 174" class="connection stroke-B1 s0" mask="url(#d2-3708480273)"/><text x="343.5" y="337" class="text-italic fill-N2 s1">값이 정해진다</text><path fill="none" marker-end="url(#mk-d2-3708480273-3488378134)" d="M421.416 243v28s0 10 10 10h134.75s10 0 10 10v155" class="connection stroke-B1 s0" mask="url(#d2-3708480273)"/><text x="563" y="287" class="text-italic fill-N2 s1">0/0 · ∞/∞ · ∞ − ∞</text><path fill="none" marker-end="url(#mk-d2-3708480273-3488378134)" d="M509.5 550v36s0 10-10 10h-322s-10 0-10 10v217" class="connection stroke-B1 s0" mask="url(#d2-3708480273)"/><text x="247.5" y="602" class="text-italic fill-N2 s1">분모·분자가 다항식</text><path fill="none" marker-end="url(#mk-d2-3708480273-3488378134)" d="M609.5 550v86s0 10 10 10h236s10 0 10 10v167" class="connection stroke-B1 s0" mask="url(#d2-3708480273)"/><text x="779.5" y="652" class="text-italic fill-N2 s1">근호가 들어 있다</text><path fill="none" marker-end="url(#mk-d2-3708480273-3488378134)" d="M576.166 550v273" class="connection stroke-B1 s0" mask="url(#d2-3708480273)"/><text x="576.5" y="693" class="text-italic fill-N2 s1">x 가 무한대로 간다</text><path fill="none" marker-end="url(#mk-d2-3708480273-3488378134)" d="M542.833 550v86s0 10-10 10H373s-10 0-10 10v329" class="connection stroke-B1 s0" mask="url(#d2-3708480273)"/><text x="363" y="684" class="text-italic fill-N2 s1">삼각함수·지수·로그</text><path fill="none" marker-end="url(#mk-d2-3708480273-3488378134)" d="M642.833 550v36s0 10 10 10H1044s10 0 10 10v379" class="connection stroke-B1 s0" mask="url(#d2-3708480273)"/><text x="1021" y="602" class="text-italic fill-N2 s1">위 넷이 막혔다</text><mask id="d2-3708480273" width="1331" height="1443" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1331v1443H-89z"/><path d="M282 321h123v21H282zM509 271h108v21H509zM165 586h165v21H165zM707 636h145v21H707zM498 677h157v21H498zM280 668h166v21H280zM958 586h126v21H958z"/></mask></svg>