<svg xmlns="http://www.w3.org/2000/svg" width="2549" height="852" class="d2-4189745203 d2-svg" viewBox="-101 -101 2549 852"><rect width="2549" height="852" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4189745203 .fill-N1{fill:#0a0f25}.d2-4189745203 .fill-N2{fill:#676c7e}.d2-4189745203 .fill-B6{fill:#f7f8fe}.d2-4189745203 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="226" cy="183.5" class="shape stroke-B1 fill-B6 s0" rx="139" ry="46.5"/></g><text x="226" y="189" class="text-bold fill-N1 s1">lim 을 구해야 한다</text></g><g ><g class="shape"><path d="M654 150h235v66H654z" class="stroke-B1 fill-B6 s0"/></g><text x="771.5" y="188.5" class="text-bold fill-N1 s1">먼저 그냥 대입해 본다</text></g><g ><g class="shape"><ellipse cx="1426.5" cy="93" class="shape stroke-B1 fill-B6 s0" rx="216.5" ry="72"/></g><text x="1426.5" y="82.5" class="text-bold fill-N1 s1"><tspan x="1426.5" dy="0">값이 나왔다</tspan><tspan x="1426.5" dy="17.667">→ 그 값이 극한이다</tspan><tspan x="1426.5" dy="17.667">(연속인 함수는 여기서 끝난다)</tspan></text></g><g ><g class="shape"><path d="M1331 276h191v98h-191z" class="stroke-B1 fill-B6 s0"/></g><text x="1426.5" y="314.5" class="text-bold fill-N1 s1"><tspan x="1426.5" dy="0">0/0 또는 ∞/∞</tspan><tspan x="1426.5" dy="17.667">= 부정형</tspan><tspan x="1426.5" dy="17.667">식을 고쳐야 한다</tspan></text></g><g ><g class="shape"><path d="M2022 0h311v82h-311z" class="stroke-B1 fill-B6 s0"/></g><text x="2177.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="2177.5" dy="0">인수분해하고 약분</tspan><tspan x="2177.5" dy="18.5">분모가 0 이 되는 인수를 없앤다</tspan></text></g><g ><g class="shape"><path d="M2029 142h297v82h-297z" class="stroke-B1 fill-B6 s0"/></g><text x="2177.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="2177.5" dy="0">근호가 있으면 유리화</tspan><tspan x="2177.5" dy="18.5">켤레식을 분모·분자에 곱한다</tspan></text></g><g ><g class="shape"><path d="M2031 284h293v82h-293z" class="stroke-B1 fill-B6 s0"/></g><text x="2177.5" y="322.5" class="text-bold fill-N1 s1"><tspan x="2177.5" dy="0">x → ∞ 인 유리식이면</tspan><tspan x="2177.5" dy="18.5">분모의 최고차항으로 나눈다</tspan></text></g><g ><g class="shape"><path d="M2039 426h276v82h-276z" class="stroke-B1 fill-B6 s0"/></g><text x="2177" y="464.5" class="text-bold fill-N1 s1"><tspan x="2177" dy="0">sin x / x 나 (1 + 1/n)ⁿ 꼴이면</tspan><tspan x="2177" dy="18.5">외워 둔 극한으로 되돌린다</tspan></text></g><g ><g class="shape"><path d="M2007 568h340v82h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="2177" y="606.5" class="text-bold fill-N1 s1"><tspan x="2177" dy="0">값을 직접 못 구하겠으면</tspan><tspan x="2177" dy="18.5">위아래에서 죄는 두 함수를 찾는다</tspan></text></g><text x="226" y="306" class="fill-N1 s1"><tspan x="226" dy="0">부정형이라는 말은 ‘값이 없다’ 가 아니라</tspan><tspan x="226" dy="17.667">‘이 꼴만 보고는 정할 수 없다’ 는 뜻이다.</tspan><tspan x="226" dy="17.667">같은 0/0 이라도 답은 0 일 수도, ∞ 일 수도 있다</tspan></text><text x="226" y="419" class="fill-N1 s1"><tspan x="226" dy="0">대입해서 (0 이 아닌 수)/0 이 나왔다면 부정형이 아니다.</tspan><tspan x="226" dy="18.5">그때는 발산이고, 좌우 부호를 따로 살펴야 한다</tspan></text><marker id="mk-d2-4189745203-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4189745203-3488378134)" d="M367 183h283" class="connection stroke-B1 s0" mask="url(#d2-4189745203)"/><path fill="none" marker-end="url(#mk-d2-4189745203-3488378134)" d="M874.4 149.877C1014.1 104.1 1081.6 92.6 1206 92.987" class="connection stroke-B1 s0" mask="url(#d2-4189745203)"/><text x="1037.5" y="106" class="text-italic fill-N2 s1">값이 정해진다</text><path fill="none" marker-end="url(#mk-d2-4189745203-3488378134)" d="M838.28 216.911C1006.9 303.2 1105.9 325 1327.5 325" class="connection stroke-B1 s0" mask="url(#d2-4189745203)"/><text x="1073" y="323" class="text-italic fill-N2 s1">0/0 · ∞/∞ · ∞ − ∞</text><path fill="none" marker-end="url(#mk-d2-4189745203-3488378134)" d="M1496.63 274.84C1759 88 1864.3 41 2017.5 41" class="connection stroke-B1 s0" mask="url(#d2-4189745203)"/><text x="1737.5" y="108" class="text-italic fill-N2 s1">분모·분자가 다항식</text><path fill="none" marker-end="url(#mk-d2-4189745203-3488378134)" d="M1523.884 290.329C1764.4 204.6 1865.7 183 2024.5 183" class="connection stroke-B1 s0" mask="url(#d2-4189745203)"/><text x="1768.5" y="209" class="text-italic fill-N2 s1">근호가 들어 있다</text><path fill="none" marker-end="url(#mk-d2-4189745203-3488378134)" d="M1524 325h502.5" class="connection stroke-B1 s0" mask="url(#d2-4189745203)"/><text x="1776.5" y="331" class="text-italic fill-N2 s1">x 가 무한대로 간다</text><path fill="none" marker-end="url(#mk-d2-4189745203-3488378134)" d="M1523.884 359.671C1764.4 445.4 1867.8 467 2035 467" class="connection stroke-B1 s0" mask="url(#d2-4189745203)"/><text x="1774" y="453" class="text-italic fill-N2 s1">삼각함수·지수·로그</text><path fill="none" marker-end="url(#mk-d2-4189745203-3488378134)" d="M1496.63 375.16C1759 562 1861.4 609 2003 609" class="connection stroke-B1 s0" mask="url(#d2-4189745203)"/><text x="1732" y="548" class="text-italic fill-N2 s1">위 넷이 막혔다</text><mask id="d2-4189745203" width="2549" height="852" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2549v852H-101z"/><path d="M976 90h123v21H976zM1019 307h108v21h-108zM1655 92h165v21h-165zM1696 193h145v21h-145zM1698 315h157v21h-157zM1691 437h166v21h-166zM1669 532h126v21h-126z"/></mask></svg>