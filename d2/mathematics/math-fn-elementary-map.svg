<svg xmlns="http://www.w3.org/2000/svg" width="1087" height="669" class="d2-3403951600 d2-svg" viewBox="-101 -101 1087 669"><rect width="1087" height="669" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3403951600 .text-bold{font-weight:700}.d2-3403951600 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3403951600 .fill-N1{fill:#0a0f25}.d2-3403951600 .fill-N2{fill:#676c7e}.d2-3403951600 .fill-B6{fill:#f7f8fe}.d2-3403951600 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M19 0h209v98H19z" class="stroke-B1 fill-B6 s0"/></g><text x="123.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="123.5" dy="0">다항함수</tspan><tspan x="123.5" dy="17.667">y = aₙxⁿ + … + a₁x + a₀</tspan><tspan x="123.5" dy="17.667">끊긴 곳이 없다</tspan></text></g><g ><g class="shape"><path d="M0 251h247v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="123.5" y="289.5" class="text-bold fill-N1 s1"><tspan x="123.5" dy="0">유리함수</tspan><tspan x="123.5" dy="17.667">다항식 나누기 다항식</tspan><tspan x="123.5" dy="17.667">분모가 0 인 곳에 점근선</tspan></text></g><g ><g class="shape"><path d="M298 0h255v98H298z" class="stroke-B1 fill-B6 s0"/></g><text x="425.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="425.5" dy="0">지수함수</tspan><tspan x="425.5" dy="17.667">y = aˣ (a &gt; 0, a ≠ 1)</tspan><tspan x="425.5" dy="17.667">같은 비율로 늘거나 준다</tspan></text></g><g ><g class="shape"><path d="M307 251h237v98H307z" class="stroke-B1 fill-B6 s0"/></g><text x="425.5" y="289.5" class="text-bold fill-N1 s1"><tspan x="425.5" dy="0">로그함수</tspan><tspan x="425.5" dy="17.667">y = logₐ x</tspan><tspan x="425.5" dy="17.667">‘몇 번 곱했나’를 센다</tspan></text></g><g ><g class="shape"><path d="M613 0h272v98H613z" class="stroke-B1 fill-B6 s0"/></g><text x="749" y="38.5" class="text-bold fill-N1 s1"><tspan x="749" dy="0">삼각함수</tspan><tspan x="749" dy="17.667">sin, cos, tan</tspan><tspan x="749" dy="17.667">되풀이되는 것을 나타낸다</tspan></text></g><g ><g class="shape"><path d="M633 251h232v98H633z" class="stroke-B1 fill-B6 s0"/></g><text x="749" y="289.5" class="text-bold fill-N1 s1"><tspan x="749" dy="0">역삼각함수</tspan><tspan x="749" dy="17.667">arcsin, arccos, arctan</tspan><tspan x="749" dy="17.667">비에서 각을 되찾는다</tspan></text></g><g ><g class="shape"><path d="M259 369h366v98H259z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="442" y="407.5" class="text-bold fill-N1 s1"><tspan x="442" dy="0">어디서 다시 만나나</tspan><tspan x="442" dy="17.667">지수·로그 : 반감기, pH, 데시벨, 개체수</tspan><tspan x="442" dy="17.667">삼각 : 파동, 진동, 회전, 교류</tspan></text></g><marker id="mk-d2-3403951600-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3403951600-3488378134)" d="M123.5 99.5v148" class="connection stroke-B1 s0" mask="url(#d2-3403951600)"/><text x="123.5" y="172" class="text-italic fill-N2 s1"><tspan x="123.5" dy="0">나눗셈을</tspan><tspan x="123.5" dy="18.5">허용한다</tspan></text><path fill="none" marker-end="url(#mk-d2-3403951600-3488378134)" d="M388.06 99.107c-44.41 59.993-44.41 90.793-1.19 149.178" class="connection stroke-B1 s0" mask="url(#d2-3403951600)"/><text x="344" y="164" class="text-italic fill-N2 s1"><tspan x="344" dy="0">y = x 에 대해</tspan><tspan x="344" dy="17.667">뒤집는다</tspan><tspan x="344" dy="17.667">(역함수)</tspan></text><path fill="none" marker-end="url(#mk-d2-3403951600-3488378134)" d="M462.926 249.883c43.624-59.983 43.624-90.783 1.177-149.148" class="connection stroke-B1 s0" mask="url(#d2-3403951600)"/><text x="506.5" y="172" class="text-italic fill-N2 s1"><tspan x="506.5" dy="0">다시</tspan><tspan x="506.5" dy="18.5">뒤집는다</tspan></text><path fill="none" marker-end="url(#mk-d2-3403951600-3488378134)" d="M749 99.5v148" class="connection stroke-B1 s0" mask="url(#d2-3403951600)"/><text x="749.5" y="164" class="text-italic fill-N2 s1"><tspan x="749.5" dy="0">구간을 잘라</tspan><tspan x="749.5" dy="17.667">일대일로 만든 뒤</tspan><tspan x="749.5" dy="17.667">뒤집는다</tspan></text><mask id="d2-3403951600" width="1087" height="669" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H986v669H-101z"/><path d="M83 156h81v37H83zM295 148h98v53h-98zM466 156h81v37h-81zM677 148h145v53H677z"/></mask></svg>