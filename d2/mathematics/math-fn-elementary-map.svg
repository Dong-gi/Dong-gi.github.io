<svg xmlns="http://www.w3.org/2000/svg" width="1503" height="774" class="d2-3748798446 d2-svg" viewBox="-101 -101 1503 774"><rect width="1503" height="774" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3748798446 .fill-N1{fill:#0a0f25}.d2-3748798446 .fill-N2{fill:#676c7e}.d2-3748798446 .fill-B6{fill:#f7f8fe}.d2-3748798446 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M79 0h209v98H79z" class="stroke-B1 fill-B6 s0"/></g><text x="183.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="183.5" dy="0">다항함수</tspan><tspan x="183.5" dy="17.667">y = aₙxⁿ + … + a₁x + a₀</tspan><tspan x="183.5" dy="17.667">끊긴 곳이 없다</tspan></text></g><g ><g class="shape"><path d="M1054 0h247v98h-247z" class="stroke-B1 fill-B6 s0"/></g><text x="1177.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1177.5" dy="0">유리함수</tspan><tspan x="1177.5" dy="17.667">다항식 나누기 다항식</tspan><tspan x="1177.5" dy="17.667">분모가 0 인 곳에 점근선</tspan></text></g><g ><g class="shape"><path d="M56 158h255v98H56z" class="stroke-B1 fill-B6 s0"/></g><text x="183.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="183.5" dy="0">지수함수</tspan><tspan x="183.5" dy="17.667">y = aˣ (a &gt; 0, a ≠ 1)</tspan><tspan x="183.5" dy="17.667">같은 비율로 늘거나 준다</tspan></text></g><g ><g class="shape"><path d="M1059 158h237v98h-237z" class="stroke-B1 fill-B6 s0"/></g><text x="1177.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="1177.5" dy="0">로그함수</tspan><tspan x="1177.5" dy="17.667">y = logₐ x</tspan><tspan x="1177.5" dy="17.667">‘몇 번 곱했나’를 센다</tspan></text></g><g ><g class="shape"><path d="M47 316h272v98H47z" class="stroke-B1 fill-B6 s0"/></g><text x="183" y="354.5" class="text-bold fill-N1 s1"><tspan x="183" dy="0">삼각함수</tspan><tspan x="183" dy="17.667">sin, cos, tan</tspan><tspan x="183" dy="17.667">되풀이되는 것을 나타낸다</tspan></text></g><g ><g class="shape"><path d="M1062 316h232v98h-232z" class="stroke-B1 fill-B6 s0"/></g><text x="1178" y="354.5" class="text-bold fill-N1 s1"><tspan x="1178" dy="0">역삼각함수</tspan><tspan x="1178" dy="17.667">arcsin, arccos, arctan</tspan><tspan x="1178" dy="17.667">비에서 각을 되찾는다</tspan></text></g><g ><g class="shape"><path d="M0 474h366v98H0z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="183" y="512.5" class="text-bold fill-N1 s1"><tspan x="183" dy="0">어디서 다시 만나나</tspan><tspan x="183" dy="17.667">지수·로그 : 반감기, pH, 데시벨, 개체수</tspan><tspan x="183" dy="17.667">삼각 : 파동, 진동, 회전, 교류</tspan></text></g><marker id="mk-d2-3748798446-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3748798446-3488378134)" d="M290.5 49H1050" class="connection stroke-B1 s0" mask="url(#d2-3748798446)"/><text x="671" y="55" class="text-italic fill-N2 s1">나눗셈을 허용한다</text><path fill="none" marker-end="url(#mk-d2-3748798446-3488378134)" d="M313.49 193.854c316.81-32.243 466.31-32.354 741.536-.81" class="connection stroke-B1 s0" mask="url(#d2-3748798446)"/><text x="685.5" y="167" class="text-italic fill-N2 s1">y = x 에 대해 뒤집는다 (역함수)</text><path fill="none" marker-end="url(#mk-d2-3748798446-3488378134)" d="M1057.013 220.728C779.8 252.5 630.2 252.3 314.979 219.908" class="connection stroke-B1 s0" mask="url(#d2-3748798446)"/><text x="685.5" y="258" class="text-italic fill-N2 s1">다시 뒤집는다</text><path fill="none" marker-end="url(#mk-d2-3748798446-3488378134)" d="M321 365h736.5" class="connection stroke-B1 s0" mask="url(#d2-3748798446)"/><text x="690" y="371" class="text-italic fill-N2 s1">구간을 잘라 일대일로 만든 뒤 뒤집는다</text><mask id="d2-3748798446" width="1503" height="774" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1503v774H-101z"/><path d="M590 