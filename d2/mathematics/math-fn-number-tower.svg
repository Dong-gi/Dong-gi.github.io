<svg xmlns="http://www.w3.org/2000/svg" width="552" height="1454" class="d2-2912992383 d2-svg" viewBox="-100 -101 552 1454"><rect width="552" height="1454" x="-100" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2912992383 .fill-N1{fill:#0a0f25}.d2-2912992383 .fill-N2{fill:#676c7e}.d2-2912992383 .fill-B6{fill:#f7f8fe}.d2-2912992383 .stroke-B1,.d2-2912992383 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M101 0h151v98H101z" class="stroke-B1 fill-B6 s0"/></g><text x="176.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="176.5" dy="0">ℕ 자연수</tspan><tspan x="176.5" dy="17.667">1, 2, 3, …</tspan><tspan x="176.5" dy="17.667">세는 데 쓴다</tspan></text></g><g ><g class="shape"><path d="M70 235h212v98H70z" class="stroke-B1 fill-B6 s0"/></g><text x="176" y="273.5" class="text-bold fill-N1 s1"><tspan x="176" dy="0">ℤ 정수</tspan><tspan x="176" dy="17.667">…, −2, −1, 0, 1, 2, …</tspan><tspan x="176" dy="17.667">뺄셈이 언제나 된다</tspan></text></g><g ><g class="shape"><path d="M10 470h332v98H10z" class="stroke-B1 fill-B6 s0"/></g><text x="176" y="508.5" class="text-bold fill-N1 s1"><tspan x="176" dy="0">ℚ 유리수</tspan><tspan x="176" dy="17.667">두 정수의 비 p/q (q ≠ 0)</tspan><tspan x="176" dy="17.667">0 아닌 수로 나누기가 언제나 된다</tspan></text></g><g ><g class="shape"><path d="M38 705h276v98H38z" class="stroke-B1 fill-B6 s0"/></g><text x="176" y="743.5" class="text-bold fill-N1 s1"><tspan x="176" dy="0">ℝ 실수</tspan><tspan x="176" dy="17.667">수직선을 빈틈없이 채운 수</tspan><tspan x="176" dy="17.667">유리수 + 무리수</tspan></text></g><g ><g class="shape"><path d="M18 940h316v98H18z" class="stroke-B1 fill-B6 s0"/></g><text x="176" y="978.5" class="text-bold fill-N1 s1"><tspan x="176" dy="0">ℂ 복소수</tspan><tspan x="176" dy="17.667">a + bi (i² = −1)</tspan><tspan x="176" dy="17.667">모든 다항방정식이 근을 갖는다</tspan></text></g><g ><g class="shape"><path d="M12 1138h328v114H12z" class="stroke-B2 fill-B6 s2"/></g><text x="176" y="1176.5" class="text-bold fill-N1 s1"><tspan x="176" dy="0">넓힐 때마다 잃는 것도 있다</tspan><tspan x="176" dy="17.25">ℕ → ℤ : ‘가장 작은 수’가 사라진다</tspan><tspan x="176" dy="17.25">ℚ → ℝ : 낱낱이 셀 수 없게 된다</tspan><tspan x="176" dy="17.25">ℝ → ℂ : 대소 관계가 사라진다</tspan></text></g><marker id="mk-d2-2912992383-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2912992383-3488378134)" d="M176 99.5v132" class="connection stroke-B1 s0" mask="url(#d2-2912992383)"/><text x="176" y="164" class="text-italic fill-N2 s1"><tspan x="176" dy="0">x + 3 = 1</tspan><tspan x="176" dy="18.5">자연수 안에는 답이 없다</tspan></text><path fill="none" marker-end="url(#mk-d2-2912992383-3488378134)" d="M176 334.5v132" class="connection stroke-B1 s0" mask="url(#d2-2912992383)"/><text x="176.5" y="399" class="text-italic fill-N2 s1"><tspan x="176.5" dy="0">3x = 2</tspan><tspan x="176.5" dy="18.5">정수 안에는 답이 없다</tspan></text><path fill="none" marker-end="url(#mk-d2-2912992383-3488378134)" d="M176 569.5v132" class="connection stroke-B1 s0" mask="url(#d2-2912992383)"/><text x="176" y="634" class="text-italic fill-N2 s1"><tspan x="176" dy="0">x² = 2</tspan><tspan x="176" dy="18.5">유리수 안에는 답이 없다 (귀류법으로 증명)</tspan></text><path fill="none" marker-end="url(#mk-d2-2912992383-3488378134)" d="M176 804.5v132" class="connection stroke-B1 s0" mask="url(#d2-2912992383)"/><text x="176.5" y="869" class="text-italic fill-N2 s1"><tspan x="176.5" dy="0">x² = −1</tspan><tspan x="176.5" dy="18.5">실수 안에는 답이 없다</tspan></text><g style="opacity:.6"><marker id="mk-d2-2912992383-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width=