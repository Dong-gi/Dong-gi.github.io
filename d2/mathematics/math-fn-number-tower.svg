<svg xmlns="http://www.w3.org/2000/svg" width="626" height="1454" class="d2-340495179 d2-svg" viewBox="-101 -101 626 1454"><rect width="626" height="1454" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-340495179 .text-bold{font-weight:700}.d2-340495179 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-340495179 .fill-N1{fill:#0a0f25}.d2-340495179 .fill-N2{fill:#676c7e}.d2-340495179 .fill-B6{fill:#f7f8fe}.d2-340495179 .stroke-B1,.d2-340495179 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M137 0h151v98H137z" class="stroke-B1 fill-B6 s0"/></g><text x="212.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="212.5" dy="0">ℕ 자연수</tspan><tspan x="212.5" dy="17.667">1, 2, 3, …</tspan><tspan x="212.5" dy="17.667">세는 데 쓴다</tspan></text></g><g ><g class="shape"><path d="M106 235h212v98H106z" class="stroke-B1 fill-B6 s0"/></g><text x="212" y="273.5" class="text-bold fill-N1 s1"><tspan x="212" dy="0">ℤ 정수</tspan><tspan x="212" dy="17.667">…, −2, −1, 0, 1, 2, …</tspan><tspan x="212" dy="17.667">뺄셈이 언제나 된다</tspan></text></g><g ><g class="shape"><path d="M46 470h332v98H46z" class="stroke-B1 fill-B6 s0"/></g><text x="212" y="508.5" class="text-bold fill-N1 s1"><tspan x="212" dy="0">ℚ 유리수</tspan><tspan x="212" dy="17.667">두 정수의 비 p/q (q ≠ 0)</tspan><tspan x="212" dy="17.667">0 아닌 수로 나누기가 언제나 된다</tspan></text></g><g ><g class="shape"><path d="M74 705h276v98H74z" class="stroke-B1 fill-B6 s0"/></g><text x="212" y="743.5" class="text-bold fill-N1 s1"><tspan x="212" dy="0">ℝ 실수</tspan><tspan x="212" dy="17.667">수직선을 빈틈없이 채운 수</tspan><tspan x="212" dy="17.667">유리수 + 무리수</tspan></text></g><g ><g class="shape"><path d="M0 940h424v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="212" y="978.5" class="text-bold fill-N1 s1"><tspan x="212" dy="0">ℂ 복소수</tspan><tspan x="212" dy="17.667">a + bi (i² = −1)</tspan><tspan x="212" dy="17.667">상수가 아닌 다항방정식은 모두 근을 갖는다</tspan></text></g><g ><g class="shape"><path d="M48 1138h328v114H48z" class="stroke-B2 fill-B6 s2"/></g><text x="212" y="1176.5" class="text-bold fill-N1 s1"><tspan x="212" dy="0">넓힐 때마다 잃는 것도 있다</tspan><tspan x="212" dy="17.25">ℕ → ℤ : ‘가장 작은 수’가 사라진다</tspan><tspan x="212" dy="17.25">ℚ → ℝ : 낱낱이 셀 수 없게 된다</tspan><tspan x="212" dy="17.25">ℝ → ℂ : 대소 관계가 사라진다</tspan></text></g><marker id="mk-d2-340495179-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-340495179-3488378134)" d="M212 99.5v132" class="connection stroke-B1 s0" mask="url(#d2-340495179)"/><text x="212" y="164" class="text-italic fill-N2 s1"><tspan x="212" dy="0">x + 3 = 1</tspan><tspan x="212" dy="18.5">자연수 안에는 답이 없다</tspan></text><path fill="none" marker-end="url(#mk-d2-340495179-3488378134)" d="M212 334.5v132" class="connection stroke-B1 s0" mask="url(#d2-340495179)"/><text x="212.5" y="399" class="text-italic fill-N2 s1"><tspan x="212.5" dy="0">3x = 2</tspan><tspan x="212.5" dy="18.5">정수 안에는 답이 없다</tspan></text><path fill="none" marker-end="url(#mk-d2-340495179-3488378134)" d="M212 569.5v132" class="connection stroke-B1 s0" mask="url(#d2-340495179)"/><text x="212" y="634" class="text-italic fill-N2 s1"><tspan x="212" dy="0">x² = 2</tspan><tspan x="212" dy="18.5">유리수 안에는 답이 없다 (귀류법으로 증명)</tspan></text><path fill="none" marker-end="url(#mk-d2-340495179-3488378134)" d="M212 804.5v132" class="connection stroke-B1 s0" mask="url(#d2-340495179)"/><text x="212.5" y="869" class="text-italic fill-N2 s1"><tspan x="212.5" dy="0">x² = −1</tspan><tspan x="212.5" dy="18.5">실수 안에는 답이 없다</tspan></text><g style="opacity:.6"><marker id="mk-d2-340495179-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-340495179-2177206569)" d="M212 1040v94" class="connection stroke-B2 s2" mask="url(#d2-340495179)"/></g><mask id="d2-340495179" width="626" height="1454" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h626v1454h-626z"/><path d="M109 148h206v37H109zM119 383h187v37H119zM34 618h356v37H34zM119 853h187v37H119z"/></mask></svg>