<svg xmlns="http://www.w3.org/2000/svg" width="1277" height="774" class="d2-1434873437 d2-svg" viewBox="-101 -101 1277 774"><rect width="1277" height="774" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1434873437 .fill-N1{fill:#0a0f25}.d2-1434873437 .fill-N2{fill:#676c7e}.d2-1434873437 .fill-B6{fill:#f7f8fe}.d2-1434873437 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="140" cy="286" class="shape stroke-B1 fill-B6 s0" rx="106" ry="40"/></g><text x="140" y="283.5" class="text-bold fill-N1 s1"><tspan x="140" dy="0">p 이면 q 임을</tspan><tspan x="140" dy="18.5">보이려 한다</tspan></text></g><g ><g class="shape"><path d="M848 0h227v98H848z" class="stroke-B1 fill-B6 s0"/></g><text x="961.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="961.5" dy="0">직접증명</tspan><tspan x="961.5" dy="17.667">p 를 가정하고</tspan><tspan x="961.5" dy="17.667">식을 밀어 q 까지 간다</tspan></text></g><g ><g class="shape"><path d="M877 158h170v98H877z" class="stroke-B1 fill-B6 s0"/></g><text x="962" y="196.5" class="text-bold fill-N1 s1"><tspan x="962" dy="0">대우증명</tspan><tspan x="962" dy="17.667">¬q 를 가정하고</tspan><tspan x="962" dy="17.667">¬p 를 끌어낸다</tspan></text></g><g ><g class="shape"><path d="M858 316h208v98H858z" class="stroke-B1 fill-B6 s0"/></g><text x="962" y="354.5" class="text-bold fill-N1 s1"><tspan x="962" dy="0">귀류법</tspan><tspan x="962" dy="17.667">p 이고 ¬q 라 해 놓고</tspan><tspan x="962" dy="17.667">모순을 찾아낸다</tspan></text></g><g ><g class="shape"><path d="M851 474h221v98H851z" class="stroke-B1 fill-B6 s0"/></g><text x="961.5" y="512.5" class="text-bold fill-N1 s1"><tspan x="961.5" dy="0">수학적 귀납법</tspan><tspan x="961.5" dy="17.667">① n=1 에서 참</tspan><tspan x="961.5" dy="17.667">② n=k 이면 n=k+1 도 참</tspan></text></g><text x="140" y="402" class="fill-N1 s1"><tspan x="140" dy="0">대우증명과 귀류법은 형제다.</tspan><tspan x="140" dy="17.667">대우증명은 ¬q 하나만 가정하고,</tspan><tspan x="140" dy="17.667">귀류법은 p 와 ¬q 를 함께 가정한다</tspan></text><marker id="mk-d2-1434873437-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1434873437-3488378134)" d="M201.745 252.022C491.2 89.8 620.8 49 844 49" class="connection stroke-B1 s0" mask="url(#d2-1434873437)"/><text x="505" y="91" class="text-italic fill-N2 s1">p 에서 곧바로 손댈 것이 있다</text><path fill="none" marker-end="url(#mk-d2-1434873437-3488378134)" d="M236.966 267.635C498.2 219.2 626.5 207 872.5 207" class="connection stroke-B1 s0" mask="url(#d2-1434873437)"/><text x="553.5" y="219" class="text-italic fill-N2 s1">q 의 부정이 다루기 더 쉽다</text><path fill="none" marker-end="url(#mk-d2-1434873437-3488378134)" d="M236.966 304.365C498.2 352.8 622.7 365 853.5 365" class="connection stroke-B1 s0" mask="url(#d2-1434873437)"/><text x="544" y="363" class="text-italic fill-N2 s1">‘그런 것은 없다’를 보여야 한다</text><path fill="none" marker-end="url(#mk-d2-1434873437-3488378134)" d="M201.745 319.978C491.2 482.2 621.4 523 847 523" class="connection stroke-B1 s0" mask="url(#d2-1434873437)"/><text x="506.5" y="493" class="text-italic fill-N2 s1">자연수 n 에 대한 명제다</text><mask id="d2-1434873437" width="1277" height="774" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1277v774H-101z"/><path d="M384 75h242v21H384zM443 203h221v21H443zM410 347h268v21H410zM407 477h199v21H407z"/></mask></svg>