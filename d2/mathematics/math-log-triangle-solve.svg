<svg xmlns="http://www.w3.org/2000/svg" width="3207" height="897" class="d2-2305238458 d2-svg" viewBox="22 -85 3207 897"><rect width="3207" height="897" x="22" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2305238458 .fill-N1{fill:#0a0f25}.d2-2305238458 .fill-N2{fill:#676c7e}.d2-2305238458 .fill-B4{fill:#e3e9fd}.d2-2305238458 .fill-B5{fill:#edf0fd}.d2-2305238458 .stroke-B1,.d2-2305238458 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M264 56h278v568H264z" class="stroke-B1 fill-B4 s0"/></g><text x="403" y="43" class="fill-N1 s1">무엇이 주어졌는가</text></g><g ><g class="shape"><path d="M1289 127h937v426h-937z" class="stroke-B1 fill-B4 s0"/></g><text x="1757.5" y="114" class="fill-N1 s1">무엇으로 푸는가</text></g><g ><g class="shape"><path d="M2744 152h333v416h-333z" class="stroke-B1 fill-B4 s0"/></g><text x="2910.5" y="139" class="fill-N1 s1">삼각형이 하나로 정해지는가</text></g><text x="402.5" y="690" class="fill-N1 s2"><tspan x="402.5" dy="0">코사인법칙은 변만으로 각을 얻고, 사인법칙은 각에서 변을 얻는다.</tspan><tspan x="402.5" dy="18.5">어느 쪽이 부족한지를 보면 고를 법칙이 정해진다</tspan></text><g ><g class="shape"><path d="M359 86h87v82h-87z" class="stroke-B1 fill-B5 s0"/></g><text x="402.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="402.5" dy="0">세 변</tspan><tspan x="402.5" dy="18.5">(SSS)</tspan></text></g><g ><g class="shape"><path d="M305 228h195v82H305z" class="stroke-B1 fill-B5 s0"/></g><text x="402.5" y="266.5" class="text-bold fill-N1 s2"><tspan x="402.5" dy="0">두 변과 그 사잇각</tspan><tspan x="402.5" dy="18.5">(SAS)</tspan></text></g><g ><g class="shape"><path d="M326 370h154v82H326z" class="stroke-B1 fill-B5 s0"/></g><text x="403" y="408.5" class="text-bold fill-N1 s2"><tspan x="403" dy="0">한 변과 두 각</tspan><tspan x="403" dy="18.5">(ASA)</tspan></text></g><g ><g class="shape"><path d="M294 512h218v82H294z" class="stroke-B2 fill-B5 s3"/></g><text x="403" y="550.5" class="text-bold fill-N1 s2"><tspan x="403" dy="0">두 변과 끼지 않은 각</tspan><tspan x="403" dy="18.5">(SSA)</tspan></text></g><g ><g class="shape"><path d="M1348 157h201v82h-201z" class="stroke-B1 fill-B5 s0"/></g><text x="1448.5" y="195.5" class="text-bold fill-N1 s2"><tspan x="1448.5" dy="0">코사인법칙</tspan><tspan x="1448.5" dy="18.5">a² = b² + c² − 2bc cos A</tspan></text></g><g ><g class="shape"><path d="M1988 441h208v82h-208z" class="stroke-B1 fill-B5 s0"/></g><text x="2092" y="479.5" class="text-bold fill-N1 s2"><tspan x="2092" dy="0">사인법칙</tspan><tspan x="2092" dy="18.5">a ÷ sin A = b ÷ sin B = 2R</tspan></text></g><g ><g class="shape"><path d="M1319 370h259v82h-259z" class="stroke-B1 fill-B5 s0"/></g><text x="1448.5" y="408.5" class="text-bold fill-N1 s2"><tspan x="1448.5" dy="0">내각의 합 180°</tspan><tspan x="1448.5" dy="18.5">남은 한 각을 먼저 구한다</tspan></text></g><g ><g class="shape"><path d="M2817 182h188v66h-188z" class="stroke-B1 fill-B5 s0"/></g><text x="2911" y="220.5" class="text-bold fill-N1 s2">하나로 정해진다</text></g><g ><g class="shape"><path d="M2774 456h273v82h-273z" class="stroke-B2 fill-B5 s3"/></g><text x="2910.5" y="494.5" class="text-bold fill-N1 s2"><tspan x="2910.5" dy="0">두 개가 나올 수 있다</tspan><tspan x="2910.5" dy="18.5">— 답을 둘 다 검토해야 한다</tspan></text></g><marker id="mk-d2-2305238458-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2305238458-3488378134)" d="M448 127h454.75c58.65 0 323.65 8.6 441.401 41.911" class="connection stroke-B1 s0" mask="url(#d2-2305238458)"/><text x="899" y="133" class="text-italic fill-N2 s2">각을 구한다</text><path fill="none" marker-end="url(#mk-d2-2305238458-3488378134)" d="M502 269h400.75c58.65 0 323.65-8.601 441.401-41.911" class="connection stroke-B1 s0" mask="url(#d2-2305238458)"/><text x="926.5" y="275" class="text-italic fill-N2 s2">남은 변을 구한다</text><path fill="none" marker-end="url(#mk-d2-2305238458-3488378134)" d="M482.5 411H1315" class="connection stroke-B1 s0" mask="url(#d2-2305238458)"/><text x="899.5" y="417" class="text-italic fill-N2 s2">세 각을 모두 안다</text><path fill="none" marker-end="url(#mk-d2-2305238458-3488378134)" d="M1580 411c162 0 244 9.4 404.101 46.106" class="connection stroke-B1 s0" mask="url(#d2-2305238458)"/><text x="1785" y="421" class="text-italic fill-N2 s2">남은 두 변을 구한다</text><path fill="none" marker-end="url(#mk-d2-2305238458-3488378134)" d="M514.5 553h807.75c75.75 0 501.75-9.4 661.851-46.106" class="connection stroke-B1 s0" mask="url(#d2-2305238458)"/><text x="1252" y="559" class="text-italic fill-N2 s2">sin 값이 같은 각이 둘이다</text><path fill="none" marker-end="url(#mk-d2-2305238458-3488378134)" d="M1551 198h851c49.8 0 282.1 2.104 410.508 10.27" class="connection stroke-B1 s0" mask="url(#d2-2305238458)"/><path fill="none" marker-end="url(#mk-d2-2305238458-3488378134)" d="M2167.748 440.529C2288.4 373.5 2352.2 356.5 2402 356.5s288.4-21.8 442.5-107.063" class="connection stroke-B1 s0" mask="url(#d2-2305238458)"/><path fill="none" marker-end="url(#mk-d2-2305238458-3488378134)" d="M2197.996 489.38c96.404 6.27 154.204 7.87 204.004 7.87h368" class="connection stroke-B1 s0" mask="url(#d2-2305238458)"/><text x="2485" y="503" class="text-italic fill-N2 s2">SSA 에서만</text><mask id="d2-2305238458" width="3207" height="897" x="22" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M22-85h3207v897H22z"/><path d="M847 117h104v21H847zM854 259h145v21H854zM825 401h149v21H825zM1701 405h168v21h-168zM1147 543h210v21h-210zM2440 487h90v21h-90z"/></mask></svg>