<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1250" class="d2-1163617673 d2-svg" viewBox="-84 -121 1150 1250"><rect width="1150" height="1250" x="-84" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1163617673 .fill-N1{fill:#0a0f25}.d2-1163617673 .fill-N2{fill:#676c7e}.d2-1163617673 .fill-B4{fill:#e3e9fd}.d2-1163617673 .fill-B5{fill:#edf0fd}.d2-1163617673 .stroke-B1,.d2-1163617673 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M17 20h948v142H17z" class="stroke-B1 fill-B4 s0"/></g><text x="491" y="7" class="fill-N1 s1">무엇이 주어졌는가</text></g><g ><g class="shape"><path d="M60 323h764v345H60z" class="stroke-B1 fill-B4 s0"/></g><text x="442" y="310" class="fill-N1 s1">무엇으로 푸는가</text></g><g ><g class="shape"><path d="M114 829h774v142H114z" class="stroke-B1 fill-B4 s0"/></g><text x="501" y="816" class="fill-N1 s1">삼각형이 하나로 정해지는가</text></g><text x="490.5" y="1007" class="fill-N1 s2"><tspan x="490.5" dy="0">코사인법칙은 변만으로 각을 얻고, 사인법칙은 각에서 변을 얻는다.</tspan><tspan x="490.5" dy="18.5">어느 쪽이 부족한지를 보면 고를 법칙이 정해진다</tspan></text><g ><g class="shape"><path d="M47 50h87v82H47z" class="stroke-B1 fill-B5 s0"/></g><text x="90.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="90.5" dy="0">세 변</tspan><tspan x="90.5" dy="18.5">(SSS)</tspan></text></g><g ><g class="shape"><path d="M194 50h195v82H194z" class="stroke-B1 fill-B5 s0"/></g><text x="291.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="291.5" dy="0">두 변과 그 사잇각</tspan><tspan x="291.5" dy="18.5">(SAS)</tspan></text></g><g ><g class="shape"><path d="M477 50h154v82H477z" class="stroke-B1 fill-B5 s0"/></g><text x="554" y="88.5" class="text-bold fill-N1 s2"><tspan x="554" dy="0">한 변과 두 각</tspan><tspan x="554" dy="18.5">(ASA)</tspan></text></g><g ><g class="shape"><path d="M717 50h218v82H717z" class="stroke-B2 fill-B5 s3"/></g><text x="826" y="88.5" class="text-bold fill-N1 s2"><tspan x="826" dy="0">두 변과 끼지 않은 각</tspan><tspan x="826" dy="18.5">(SSA)</tspan></text></g><g ><g class="shape"><path d="M90 353h201v82H90z" class="stroke-B1 fill-B5 s0"/></g><text x="190.5" y="391.5" class="text-bold fill-N1 s2"><tspan x="190.5" dy="0">코사인법칙</tspan><tspan x="190.5" dy="18.5">a² = b² + c² − 2bc cos A</tspan></text></g><g ><g class="shape"><path d="M586 556h208v82H586z" class="stroke-B1 fill-B5 s0"/></g><text x="690" y="594.5" class="text-bold fill-N1 s2"><tspan x="690" dy="0">사인법칙</tspan><tspan x="690" dy="18.5">a ÷ sin A = b ÷ sin B = 2R</tspan></text></g><g ><g class="shape"><path d="M424 353h259v82H424z" class="stroke-B1 fill-B5 s0"/></g><text x="553.5" y="391.5" class="text-bold fill-N1 s2"><tspan x="553.5" dy="0">내각의 합 180°</tspan><tspan x="553.5" dy="18.5">남은 한 각을 먼저 구한다</tspan></text></g><g ><g class="shape"><path d="M144 867h188v66H144z" class="stroke-B1 fill-B5 s0"/></g><text x="238" y="905.5" class="text-bold fill-N1 s2">하나로 정해진다</text></g><g ><g class="shape"><path d="M585 859h273v82H585z" class="stroke-B2 fill-B5 s3"/></g><text x="721.5" y="897.5" class="text-bold fill-N1 s2"><tspan x="721.5" dy="0">두 개가 나올 수 있다</tspan><tspan x="721.5" dy="18.5">— 답을 둘 다 검토해야 한다</tspan></text></g><marker id="mk-d2-1163617673-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1163617673-3488378134)" d="M90.25 134v78.25c0 18.15 11 100.75 52.04 138.06" class="connection stroke-B1 s0" mask="url(#d2-1163617673)"/><text x="93" y="258" class="text-italic fill-N2 s2">각을 구한다</text><path fill="none" marker-end="url(#mk-d2-1163617673-3488378134)" d="M291.25 134v78.25c0 18.15-11 100.75-52.04 138.06" class="connection stroke-B1 s0" mask="url(#d2-1163617673)"/><text x="288.5" y="258" class="text-italic fill-N2 s2">남은 변을 구한다</text><path fill="none" marker-end="url(#mk-d2-1163617673-3488378134)" d="M553.5 134v215" class="connection stroke-B1 s0" mask="url(#d2-1163617673)"/><text x="553.5" y="248" class="text-italic fill-N2 s2">세 각을 모두 안다</text><path fill="none" marker-end="url(#mk-d2-1163617673-3488378134)" d="M553.5 436.5c0 46.8 16 71.2 76.82 117.575" class="connection stroke-B1 s0" mask="url(#d2-1163617673)"/><text x="570" y="514" class="text-italic fill-N2 s2">남은 두 변을 구한다</text><path fill="none" marker-end="url(#mk-d2-1163617673-3488378134)" d="M826 134v214.5c0 27.3-16 159.2-76.82 205.575" class="connection stroke-B1 s0" mask="url(#d2-1163617673)"/><text x="826" y="366" class="text-italic fill-N2 s2">sin 값이 같은 각이 둘이다</text><path fill="none" marker-end="url(#mk-d2-1163617673-3488378134)" d="M190.75 436.5v281.75c0 18.15 6 102.35 28.162 145.197" class="connection stroke-B1 s0" mask="url(#d2-1163617673)"/><path fill="none" marker-end="url(#mk-d2-1163617673-3488378134)" d="M583.886 638.125C481.55 677.88 455.5 700.1 455.5 718.25S427.7 820.6 320.192 865.46" class="connection stroke-B1 s0" mask="url(#d2-1163617673)"/><path fill="none" marker-end="url(#mk-d2-1163617673-3488378134)" d="M704.894 639.894C717.85 678 721.25 700.1 721.25 718.25V855" class="connection stroke-B1 s0" mask="url(#d2-1163617673)"/><text x="721" y="753" class="text-italic fill-N2 s2">SSA 에서만</text><mask id="d2-1163617673" width="1150" height="1250" x="-84" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-84-121h1150v1250H-84z"/><path d="M41 242h104v21H41zM216 242h145v21H216zM479 232h149v21H479zM486 498h168v21H486zM721 350h210v21H721zM676 737h90v21h-90z"/></mask></svg>