<svg xmlns="http://www.w3.org/2000/svg" width="1521" height="932" class="d2-1295350672 d2-svg" viewBox="-101 -101 1521 932"><rect width="1521" height="932" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1295350672 .fill-N1{fill:#0a0f25}.d2-1295350672 .fill-N2{fill:#676c7e}.d2-1295350672 .fill-B6{fill:#f7f8fe}.d2-1295350672 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="206" cy="365" class="shape stroke-B1 fill-B6 s0" rx="103" ry="40"/></g><text x="206" y="362.5" class="text-bold fill-N1 s1"><tspan x="206" dy="0">∫ f(x) dx 를</tspan><tspan x="206" dy="18.5">구해야 한다</tspan></text></g><g ><g class="shape"><path d="M1080 0h182v98h-182z" class="stroke-B1 fill-B6 s0"/></g><text x="1171" y="38.5" class="text-bold fill-N1 s1"><tspan x="1171" dy="0">기본 적분표에</tspan><tspan x="1171" dy="17.667">그대로 있다</tspan><tspan x="1171" dy="17.667">→ 표에서 읽는다</tspan></text></g><g ><g class="shape"><path d="M1090 158h163v98h-163z" class="stroke-B1 fill-B6 s0"/></g><text x="1171.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="1171.5" dy="0">치환적분</tspan><tspan x="1171.5" dy="17.667">u = g(x) 로 놓고</tspan><tspan x="1171.5" dy="17.667">du = g′(x) dx</tspan></text></g><g ><g class="shape"><path d="M1023 316h296v98h-296z" class="stroke-B1 fill-B6 s0"/></g><text x="1171" y="354.5" class="text-bold fill-N1 s1"><tspan x="1171" dy="0">부분적분</tspan><tspan x="1171" dy="17.667">∫ u dv = uv − ∫ v du</tspan><tspan x="1171" dy="17.667">(미분하면 단순해지는 쪽을 u)</tspan></text></g><g ><g class="shape"><path d="M1045 474h252v98h-252z" class="stroke-B1 fill-B6 s0"/></g><text x="1171" y="512.5" class="text-bold fill-N1 s1"><tspan x="1171" dy="0">부분분수</tspan><tspan x="1171" dy="17.667">분모를 인수분해해</tspan><tspan x="1171" dy="17.667">간단한 분수들의 합으로</tspan></text></g><g ><g class="shape"><path d="M1087 632h168v98h-168z" class="stroke-B1 fill-B6 s0"/></g><text x="1171" y="670.5" class="text-bold fill-N1 s1"><tspan x="1171" dy="0">수치적분</tspan><tspan x="1171" dy="17.667">사다리꼴 공식</tspan><tspan x="1171" dy="17.667">심프슨 공식</tspan></text></g><text x="205.5" y="481" class="fill-N1 s1"><tspan x="205.5" dy="0">치환은 합성함수 미분법을 거꾸로 돌린 것이고</tspan><tspan x="205.5" dy="17.667">부분적분은 곱의 미분법을 거꾸로 돌린 것이다.</tspan><tspan x="205.5" dy="17.667">적분 기술은 새 규칙이 아니라 미분법의 뒷면이다</tspan></text><text x="206" y="594" class="fill-N1 s1"><tspan x="206" dy="0">e^(−x²) 처럼 원시함수를 초등함수로</tspan><tspan x="206" dy="17.667">적을 수 없는 함수가 있다.</tspan><tspan x="206" dy="17.667">계산이 막힌 것이 아니라 원래 없는 것이다</tspan></text><marker id="mk-d2-1295350672-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1295350672-3488378134)" d="M261.702 329.95C625.6 105.399 789.6 49 1076 49" class="connection stroke-B1 s0" mask="url(#d2-1295350672)"/><text x="641.5" y="105" class="text-italic fill-N2 s1">다항식·지수·로그·삼각의 표준형</text><path fill="none" marker-end="url(#mk-d2-1295350672-3488378134)" d="M287.911 339.41C630.8 233.6 791.5 207 1085.5 207" class="connection stroke-B1 s0" mask="url(#d2-1295350672)"/><text x="680" y="231" class="text-italic fill-N2 s1">안쪽 함수와 그 도함수가 함께 있다</text><path fill="none" marker-end="url(#mk-d2-1295350672-3488378134)" d="M311 365h708" class="connection stroke-B1 s0" mask="url(#d2-1295350672)"/><text x="666" y="371" class="text-italic fill-N2 s1">성격이 다른 두 함수의 곱이다</text><path fill="none" marker-end="url(#mk-d2-1295350672-3488378134)" d="M287.911 390.59C630.8 496.4 782.6 523 1041 523" class="connection stroke-B1 s0" mask="url(#d2-1295350672)"/><text x="658" y="507" class="text-italic fill-N2 s1">분자·분모가 모두 다항식이다</text><path fill="none" marker-end="url(#mk-d2-1295350672-3488378134)" d="M261.702 400.05C625.6 624.6 791 681 1083 681" class="connection stroke-B1 s0" mask="url(#d2-1295350672)"/><text x="645" y="637" class="text-italic fill-N2 s1">위 넷이 모두 막혔다</text><mask id="d2-1295350672" width="1521" height="932" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1521v932H-101z"/><path d="M507 89h269v21H507zM535 215h290v21H535zM542 355h248v21H542zM535 491h246v21H535zM561 621h168v21H561z"/></mask></svg>