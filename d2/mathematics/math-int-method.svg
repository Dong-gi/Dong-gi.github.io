<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="1140" class="d2-3480818615 d2-svg" viewBox="-108 -101 1123 1140"><rect width="1123" height="1140" x="-108" y="-101" rx="0" style="fill:#fff"/><style>.d2-3480818615 .text-bold{font-weight:700}.d2-3480818615 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3480818615 .fill-N1{fill:#0a0f25}.d2-3480818615 .fill-N2{fill:#676c7e}.d2-3480818615 .fill-B6{fill:#f7f8fe}.d2-3480818615 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="103" cy="373" class="shape stroke-B1 fill-B6 s0" rx="103" ry="40"/></g><text x="103" y="370.5" class="text-bold fill-N1 s1"><tspan x="103" dy="0">∫ f(x) dx 를</tspan><tspan x="103" dy="18.5">구해야 한다</tspan></text></g><g ><g class="shape"><path d="M689 0h182v98H689z" class="stroke-B1 fill-B6 s0"/></g><text x="780" y="38.5" class="text-bold fill-N1 s1"><tspan x="780" dy="0">기본 적분표에</tspan><tspan x="780" dy="17.667">그대로 있다</tspan><tspan x="780" dy="17.667">→ 표에서 읽는다</tspan></text></g><g ><g class="shape"><path d="M699 158h163v98H699z" class="stroke-B1 fill-B6 s0"/></g><text x="780.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="780.5" dy="0">치환적분</tspan><tspan x="780.5" dy="17.667">u = g(x) 로 놓고</tspan><tspan x="780.5" dy="17.667">du = g′(x) dx</tspan></text></g><g ><g class="shape"><path d="M663 316h234v114H663z" class="stroke-B1 fill-B6 s0"/></g><text x="780" y="354.5" class="text-bold fill-N1 s1"><tspan x="780" dy="0">부분적분</tspan><tspan x="780" dy="17.25">∫ u dv = uv − ∫ v du</tspan><tspan x="780" dy="17.25">(미분하면 단순해지는</tspan><tspan x="780" dy="17.25">쪽을 u)</tspan></text></g><g ><g class="shape"><path d="M654 490h252v98H654z" class="stroke-B1 fill-B6 s0"/></g><text x="780" y="528.5" class="text-bold fill-N1 s1"><tspan x="780" dy="0">부분분수</tspan><tspan x="780" dy="17.667">분모를 인수분해해</tspan><tspan x="780" dy="17.667">간단한 분수들의 합으로</tspan></text></g><g ><g class="shape"><path d="M696 648h168v98H696z" class="stroke-B1 fill-B6 s0"/></g><text x="780" y="686.5" class="text-bold fill-N1 s1"><tspan x="780" dy="0">수치적분</tspan><tspan x="780" dy="17.667">사다리꼴 공식</tspan><tspan x="780" dy="17.667">심프슨 공식</tspan></text></g><g ><g class="shape"><path fill="transparent" d="M-8 766h923v173H-8z" class="stroke-B1"/></g></g><text x="256.5" y="842" class="fill-N1 s1"><tspan x="256.5" dy="0">치환은 합성함수 미분법을 거꾸로 돌린 것이고</tspan><tspan x="256.5" dy="17.667">부분적분은 곱의 미분법을 거꾸로 돌린 것이다.</tspan><tspan x="256.5" dy="17.667">적분 기술은 새 규칙이 아니라 미분법의 뒷면이다</tspan></text><text x="678" y="842" class="fill-N1 s1"><tspan x="678" dy="0">e^(−x²) 처럼 원시함수를 초등함수로</tspan><tspan x="678" dy="17.667">적을 수 없는 함수가 있다.</tspan><tspan x="678" dy="17.667">계산이 막힌 것이 아니라 원래 없는 것이다</tspan></text><marker id="mk-d2-3480818615-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3480818615-3488378134)" d="M141.422 334.593C372 106.4 481.8 49 685 49" class="connection stroke-B1 s0" mask="url(#d2-3480818615)"/><text x="374" y="103" class="text-italic fill-N2 s1"><tspan x="374" dy="0">다항식·지수·로그·삼각의</tspan><tspan x="374" dy="18.5">표준형</tspan></text><path fill="none" marker-end="url(#mk-d2-3480818615-3488378134)" d="M167.783 340.095C377.2 233.8 483.7 207 694.5 207" class="connection stroke-B1 s0" mask="url(#d2-3480818615)"/><text x="420" y="221" class="text-italic fill-N2 s1"><tspan x="420" dy="0">안쪽 함수와 그 도함수가</tspan><tspan x="420" dy="18.5">함께 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-3480818615-3488378134)" d="M208 373h451" class="connection stroke-B1 s0" mask="url(#d2-3480818615)"/><text x="434.5" y="371" class="text-italic fill-N2 s1"><tspan x="434.5" dy="0">성격이 다른</tspan><tspan x="434.5" dy="18.5">두 함수의 곱이다</tspan></text><path fill="none" marker-end="url(#mk-d2-3480818615-3488378134)" d="M167.783 405.905C377.2 512.2 474.8 539 650 539" class="connection stroke-B1 s0" mask="url(#d2-3480818615)"/><text x="398" y="515" class="text-italic fill-N2 s1"><tspan x="398" dy="0">분자·분모가 모두</tspan><tspan x="398" dy="18.5">다항식이다</tspan></text><path fill="none" marker-end="url(#mk-d2-3480818615-3488378134)" d="M141.422 411.407C372 639.6 483.2 697 692 697" class="connection stroke-B1 s0" mask="url(#d2-3480818615)"/><text x="377" y="640" class="text-italic fill-N2 s1"><tspan x="377" dy="0">위 넷이</tspan><tspan x="377" dy="18.5">모두 막혔다</tspan></text><mask id="d2-3480818615" width="1123" height="1140" x="-108" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-108-101h1123v1140H-108z"/><path d="M270 87h208v37H270zM317 205h206v37H317zM362 355h145v37H362zM325 499h146v37H325zM325 624h104v37H325z"/></mask></svg>