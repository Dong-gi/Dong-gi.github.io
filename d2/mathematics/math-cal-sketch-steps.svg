<svg xmlns="http://www.w3.org/2000/svg" width="1352" height="1371" class="d2-1025672089 d2-svg" viewBox="-101 -101 1352 1371"><rect width="1352" height="1371" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1025672089 .fill-N1{fill:#0a0f25}.d2-1025672089 .fill-B6{fill:#f7f8fe}.d2-1025672089 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M107 0h323v98H107z" class="stroke-B1 fill-B6 s0"/></g><text x="268.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="268.5" dy="0">1. 정의역</tspan><tspan x="268.5" dy="17.667">분모가 0 이 되는 곳,</tspan><tspan x="268.5" dy="17.667">근호 안이 음수가 되는 곳을 뺀다</tspan></text></g><g ><g class="shape"><path d="M143 198h251v98H143z" class="stroke-B1 fill-B6 s0"/></g><text x="268.5" y="236.5" class="text-bold fill-N1 s1"><tspan x="268.5" dy="0">2. 대칭과 절편</tspan><tspan x="268.5" dy="17.667">우함수·기함수인가</tspan><tspan x="268.5" dy="17.667">x절편·y절편은 어디인가</tspan></text></g><g ><g class="shape"><path d="M139 396h260v98H139z" class="stroke-B1 fill-B6 s0"/></g><text x="269" y="434.5" class="text-bold fill-N1 s1"><tspan x="269" dy="0">3. f′ 의 부호</tspan><tspan x="269" dy="17.667">양수면 증가, 음수면 감소</tspan><tspan x="269" dy="17.667">f′ = 0 인 곳이 극값 후보</tspan></text></g><g ><g class="shape"><path d="M75 594h388v98H75z" class="stroke-B1 fill-B6 s0"/></g><text x="269" y="632.5" class="text-bold fill-N1 s1"><tspan x="269" dy="0">4. f″ 의 부호</tspan><tspan x="269" dy="17.667">양수면 아래로 볼록</tspan><tspan x="269" dy="17.667">음수면 위로 볼록, 부호가 바뀌면 변곡점</tspan></text></g><g ><g class="shape"><path d="M108 792h322v98H108z" class="stroke-B1 fill-B6 s0"/></g><text x="269" y="830.5" class="text-bold fill-N1 s1"><tspan x="269" dy="0">5. 점근선</tspan><tspan x="269" dy="17.667">분모가 0 인 곳에 수직점근선</tspan><tspan x="269" dy="17.667">x → ±∞ 에서의 극한이 수평점근선</tspan></text></g><g ><g class="shape"><ellipse cx="268.5" cy="1079.5" class="shape stroke-B1 fill-B6 s0" rx="268.5" ry="89.5"/></g><text x="268.5" y="1069" class="text-bold fill-N1 s1"><tspan x="268.5" dy="0">6. 표를 그림으로 옮긴다</tspan><tspan x="268.5" dy="17.667">구간마다 오르내림과 굽는 방향이</tspan><tspan x="268.5" dy="17.667">정해져 있으므로 이을 길은 하나뿐이다</tspan></text></g><text x="633.5" y="47" class="fill-N1 s1"><tspan x="633.5" dy="0">미분이 하는 일은 3번과 4번뿐이다.</tspan><tspan x="633.5" dy="18.5">1·2·5번은 7장까지의 도구로 한다</tspan></text><text x="993.5" y="47" class="fill-N1 s1"><tspan x="993.5" dy="0">다 그린 뒤에는 특징적인 점 두세 개를</tspan><tspan x="993.5" dy="18.5">원래 식에 넣어 값을 맞춰 본다</tspan></text><marker id="mk-d2-1025672089-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1025672089-3488378134)" d="M268.5 100v94" class="connection stroke-B1 s0" mask="url(#d2-1025672089)"/><path fill="none" marker-end="url(#mk-d2-1025672089-3488378134)" d="M268.5 298v94" class="connection stroke-B1 s0" mask="url(#d2-1025672089)"/><path fill="none" marker-end="url(#mk-d2-1025672089-3488378134)" d="M268.5 496v94" class="connection stroke-B1 s0" mask="url(#d2-1025672089)"/><path fill="none" marker-end="url(#mk-d2-1025672089-3488378134)" d="M268.5 694v94" class="connection stroke-B1 s0" mask="url(#d2-1025672089)"/><path fill="none" marker-end="url(#mk-d2-1025672089-3488378134)" d="M268.5 892c0 38 .1 58 .46 94" class="connection stroke-B1 s0" mask="url(#d2-1025672089)"/><mask id="d2-1025672089" width="1352" height="1371" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1352v1371H-101z"/></mask></svg>