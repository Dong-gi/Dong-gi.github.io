<svg xmlns="http://www.w3.org/2000/svg" width="1159" height="1605" class="d2-2775593027 d2-svg" viewBox="-91 -101 1159 1605"><rect width="1159" height="1605" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.d2-2775593027 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2775593027 .fill-N1{fill:#0a0f25}.d2-2775593027 .fill-B6{fill:#f7f8fe}.d2-2775593027 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="463" cy="63" class="shape stroke-B1 fill-B6 s0" rx="189" ry="63"/></g><text x="463" y="68.5" class="text-bold fill-N1 s1">1차 쪽에 교류 전압을 건다</text></g><g ><g class="shape"><path d="M273 226h380v82H273z" class="stroke-B1 fill-B6 s0"/></g><text x="463" y="264.5" class="text-bold fill-N1 s1"><tspan x="463" dy="0">1차 코일 — 감은 수 N1</tspan><tspan x="463" dy="18.5">전류가 끊임없이 커졌다 작아졌다 한다</tspan></text></g><g ><g class="shape"><path d="M488 479h427v98H488z" class="stroke-B1 fill-B6 s0"/></g><text x="701.5" y="517.5" class="text-bold fill-N1 s1"><tspan x="701.5" dy="0">철심</tspan><tspan x="701.5" dy="17.667">자기다발을 가두어 밖으로 새지 않게 한다</tspan><tspan x="701.5" dy="17.667">두 코일이 같은 다발을 공유하게 만드는 부품</tspan></text></g><g ><g class="shape"><path d="M532 727h340v82H532z" class="stroke-B1 fill-B6 s0"/></g><text x="702" y="765.5" class="text-bold fill-N1 s1"><tspan x="702" dy="0">2차 코일 — 감은 수 N2</tspan><tspan x="702" dy="18.5">같은 다발이 같은 빠르기로 변한다</tspan></text></g><g ><g class="shape"><path d="M466 909h471v98H466z" class="stroke-B1 fill-B6 s0"/></g><text x="701.5" y="947.5" class="text-bold fill-N1 s1"><tspan x="701.5" dy="0">한 번 감은 것마다 같은 크기의 기전력이 생기므로</tspan><tspan x="701.5" dy="17.667">전압의 비 = 감은 수의 비</tspan><tspan x="701.5" dy="17.667">V2 / V1 = N2 / N1</tspan></text></g><g ><g class="shape"><path d="M478 1107h447v98H478z" class="stroke-B1 fill-B6 s0"/></g><text x="701.5" y="1145.5" class="text-bold fill-N1 s1"><tspan x="701.5" dy="0">손실이 없다면 들어간 전력과 나온 전력이 같다</tspan><tspan x="701.5" dy="17.667">V1 곱하기 I1 = V2 곱하기 I2</tspan><tspan x="701.5" dy="17.667">전압을 올린 만큼 전류는 내려간다</tspan></text></g><g ><g class="shape"><path d="M10 457h428v142H10z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="224" y="444" class="fill-N1" style="text-anchor:middle;font-size:28px">직류에는 쓸 수 없다</text></g><g ><g class="shape"><path d="M436 1305h531v98H436z" class="stroke-B1 fill-B6 s0"/></g><text x="701.5" y="1343.5" class="text-bold fill-N1 s1"><tspan x="701.5" dy="0">송전선에서 전압을 높여 보내는 까닭</tspan><tspan x="701.5" dy="17.667">같은 전력을 나르면서 전류를 줄이면</tspan><tspan x="701.5" dy="17.667">저항에서 열로 잃는 몫이 전류의 제곱에 비례해 줄어든다</tspan></text></g><g ><g class="shape"><path d="M40 487h368v82H40z" class="stroke-B1" style="fill:#edf0fd;stroke-width:2"/></g><text x="224" y="525.5" class="text-bold fill-N1 s1"><tspan x="224" dy="0">다발이 변하지 않으면 기전력이 0이다</tspan><tspan x="224" dy="18.5">변압기가 교류에만 쓰이는 이유</tspan></text></g><marker id="mk-d2-2775593027-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2775593027-3488378134)" d="M462.99 128c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-2775593027)"/><path fill="none" marker-end="url(#mk-d2-2775593027-3488378134)" d="M561.338 308.29C673.1 356.3 701.5 439 701.5 475" class="connection stroke-B1 s0" mask="url(#d2-2775593027)"/><path fill="none" marker-end="url(#mk-d2-2775593027-3488378134)" d="M701.5 579v144" class="connection stroke-B1 s0" mask="url(#d2-2775593027)"/><path fill="none" marker-end="url(#mk-d2-2775593027-3488378134)" d="M701.5 811v94" class="connection stroke-B1 s0" mask="url(#d2-2775593027)"/><path fill="none" marker-end="url(#mk-d2-2775593027-3488378134)" d="M701.5 1009v94" class="connection stroke-B1 s0" mask="url(#d2-2775593027)"/><path fill="none" marker-end="url(#mk-d2-2775593027-3488378134)" d="M701.5 1207v94" class="connection stroke-B1 s0" mask="url(#d2-2775593027)"/><path fill="none" marker-end="url(#mk-d2-2775593027-3488378134)" d="M364.162 308.29C252.4 356.3 224 378.1 224 412.5" class="connection stroke-B1 s0" mask="url(#d2-2775593027)"/><text x="275" y="352" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">전압이 일정하면</text><mask id="d2-2775593027" width="1159" height="1605" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1159v1605H-91z"/><path d="M204 336h142v21H204z"/></mask></svg>