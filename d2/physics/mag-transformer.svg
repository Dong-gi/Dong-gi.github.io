<svg xmlns="http://www.w3.org/2000/svg" width="4560" height="542" class="d2-1688087467 d2-svg" viewBox="-101 -95 4560 542"><rect width="4560" height="542" x="-101" y="-95" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1688087467 .fill-N1{fill:#0a0f25}.d2-1688087467 .fill-B6{fill:#f7f8fe}.d2-1688087467 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="189" cy="212" class="shape stroke-B1 fill-B6 s0" rx="189" ry="63"/></g><text x="189" y="217.5" class="text-bold fill-N1 s1">1차 쪽에 교류 전압을 건다</text></g><g ><g class="shape"><path d="M556 171h380v82H556z" class="stroke-B1 fill-B6 s0"/></g><text x="746" y="209.5" class="text-bold fill-N1 s1"><tspan x="746" dy="0">1차 코일 — 감은 수 N1</tspan><tspan x="746" dy="18.5">전류가 끊임없이 커졌다 작아졌다 한다</tspan></text></g><g ><g class="shape"><path d="M1341 248h427v98h-427z" class="stroke-B1 fill-B6 s0"/></g><text x="1554.5" y="286.5" class="text-bold fill-N1 s1"><tspan x="1554.5" dy="0">철심</tspan><tspan x="1554.5" dy="17.667">자기다발을 가두어 밖으로 새지 않게 한다</tspan><tspan x="1554.5" dy="17.667">두 코일이 같은 다발을 공유하게 만드는 부품</tspan></text></g><g ><g class="shape"><path d="M2035 256h340v82h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="2205" y="294.5" class="text-bold fill-N1 s1"><tspan x="2205" dy="0">2차 코일 — 감은 수 N2</tspan><tspan x="2205" dy="18.5">같은 다발이 같은 빠르기로 변한다</tspan></text></g><g ><g class="shape"><path d="M2553 248h471v98h-471z" class="stroke-B1 fill-B6 s0"/></g><text x="2788.5" y="286.5" class="text-bold fill-N1 s1"><tspan x="2788.5" dy="0">한 번 감은 것마다 같은 크기의 기전력이 생기므로</tspan><tspan x="2788.5" dy="17.667">전압의 비 = 감은 수의 비</tspan><tspan x="2788.5" dy="17.667">V2 / V1 = N2 / N1</tspan></text></g><g ><g class="shape"><path d="M3202 248h447v98h-447z" class="stroke-B1 fill-B6 s0"/></g><text x="3425.5" y="286.5" class="text-bold fill-N1 s1"><tspan x="3425.5" dy="0">손실이 없다면 들어간 전력과 나온 전력이 같다</tspan><tspan x="3425.5" dy="17.667">V1 곱하기 I1 = V2 곱하기 I2</tspan><tspan x="3425.5" dy="17.667">전압을 올린 만큼 전류는 내려간다</tspan></text></g><g ><g class="shape"><path d="m1403 46-151 81 151 81h303l151-81-151-81Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="1554.5" y="33" class="fill-N1" style="text-anchor:middle;font-size:28px">직류에는 쓸 수 없다</text></g><g ><g class="shape"><path d="M3827 248h531v98h-531z" class="stroke-B1 fill-B6 s0"/></g><text x="4092.5" y="286.5" class="text-bold fill-N1 s1"><tspan x="4092.5" dy="0">송전선에서 전압을 높여 보내는 까닭</tspan><tspan x="4092.5" dy="17.667">같은 전력을 나르면서 전류를 줄이면</tspan><tspan x="4092.5" dy="17.667">저항에서 열로 잃는 몫이 전류의 제곱에 비례해 줄어든다</tspan></text></g><g ><g class="shape"><path d="M1371 86h368v82h-368z" class="stroke-B1" style="fill:#edf0fd;stroke-width:2"/></g><text x="1555" y="124.5" class="text-bold fill-N1 s1"><tspan x="1555" dy="0">다발이 변하지 않으면 기전력이 0이다</tspan><tspan x="1555" dy="18.5">변압기가 교류에만 쓰이는 이유</tspan></text></g><marker id="mk-d2-1688087467-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1688087467-3488378134)" d="M380 212h172" class="connection stroke-B1 s0" mask="url(#d2-1688087467)"/><path fill="none" marker-end="url(#mk-d2-1688087467-3488378134)" d="M915.943 253.475C1058 288.2 1269.8 297 1337 297" class="connection stroke-B1 s0" mask="url(#d2-1688087467)"/><path fill="none" marker-end="url(#mk-d2-1688087467-3488378134)" d="M1770 297h261" class="connection stroke-B1 s0" mask="url(#d2-1688087467)"/><path fill="none" marker-end="url(#mk-d2-1688087467-3488378134)" d="M2377 297h172" class="connection stroke-B1 s0" mask="url(#d2-1688087467)"/><path fill="none" marker-end="url(#mk-d2-1688087467-3488378134)" d="M3026 297h172" class="connection stroke-B1 s0" mask="url(#d2-1688087467)"/><path fill="none" marker-end="url(#mk-d2-1688087467-3488378134)" d="M3651 297h172" class="connection stroke-B1 s0" mask="url(#d2-1688087467)"/><path fill="none" marker-end="url(#mk-d2-1688087467-3488378134)" d="M915.943 170.525C1058 135.8 1125.6 127 1248 127" class="connection stroke-B1 s0" mask="url(#d2-1688087467)"/><text x="1081" y="138" style="fill:#676c7e;text-anchor:middle;font-size:16px">전압이 일정하면</text><mask id="d2-1688087467" width="4560" height="542" x="-101" y="-95" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-95h4560v542H-101z"/><path d="M1010 122h142v21h-142z"/></mask></svg>