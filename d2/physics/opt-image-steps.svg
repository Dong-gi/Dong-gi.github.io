<svg xmlns="http://www.w3.org/2000/svg" width="1627" height="1594" class="d2-2451377160 d2-svg" viewBox="-101 -101 1627 1594"><rect width="1627" height="1594" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2451377160 .fill-N1{fill:#0a0f25}.d2-2451377160 .fill-N4{fill:#cfd2dd}.d2-2451377160 .fill-B6{fill:#f7f8fe}.d2-2451377160 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M833 92h-4L640 47c-2 0-2-1 0-2L829 0h7l190 45c2 0 2 1 0 2L837 92z" class="stroke-B1 fill-N4 s0"/></g><text x="833" y="51.5" class="text-bold fill-N1 s1">1. 거울인가 렌즈인가</text></g><g ><g class="shape"><path d="M582 192h183v98H582z" class="stroke-B1 fill-B6 s0"/></g><text x="673.5" y="230.5" class="text-bold fill-N1 s1"><tspan x="673.5" dy="0">거울</tspan><tspan x="673.5" dy="17.667">오목이면 f = +R/2</tspan><tspan x="673.5" dy="17.667">볼록이면 f = −R/2</tspan></text></g><g ><g class="shape"><path d="M825 192h333v98H825z" class="stroke-B1 fill-B6 s0"/></g><text x="991.5" y="230.5" class="text-bold fill-N1 s1"><tspan x="991.5" dy="0">렌즈</tspan><tspan x="991.5" dy="17.667">볼록(가운데가 두껍다)이면 f 양수</tspan><tspan x="991.5" dy="17.667">오목(가운데가 얇다)이면 f 음수</tspan></text></g><g ><g class="shape"><path d="M689 390h288v82H689z" class="stroke-B1 fill-B6 s0"/></g><text x="833" y="428.5" class="text-bold fill-N1 s1"><tspan x="833" dy="0">2. 물체 거리 p 를 넣는다</tspan><tspan x="833" dy="18.5">앞에 놓인 실물체이면 p 양수</tspan></text></g><g ><g class="shape"><path d="M581 572h504v82H581z" class="stroke-B1 fill-B6 s0"/></g><text x="833" y="610.5" class="text-bold fill-N1 s1"><tspan x="833" dy="0">3. 1/p + 1/q = 1/f 를 q 에 대해 푼다</tspan><tspan x="833" dy="18.5">1/q = 1/f − 1/p 로 먼저 역수를 구하고 마지막에 뒤집는다</tspan></text></g><g ><g class="shape"><path d="M670 754h325v66H670z" class="stroke-B1 fill-B6 s0"/></g><text x="832.5" y="792.5" class="text-bold fill-N1 s1">4. 배율 m = −q/p, 상의 크기 h′ = m h</text></g><g ><g class="shape"><path d="M833 1012h-4l-213-45c-2 0-2-1 0-2l213-45h8l213 45c2 0 2 1 0 2l-213 45z" class="stroke-B1 fill-N4 s0"/></g><text x="833" y="971.5" class="text-bold fill-N1 s1">5. 부호로 성질을 읽는다</text></g><g ><g class="shape"><path d="M0 1112h365v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="182.5" y="1150.5" class="text-bold fill-N1 s1"><tspan x="182.5" dy="0">q 양수 → 실상</tspan><tspan x="182.5" dy="17.667">빛이 실제로 모인다. 스크린에 맺힌다</tspan><tspan x="182.5" dy="17.667">거울이면 거울 앞, 렌즈이면 렌즈 뒤</tspan></text></g><g ><g class="shape"><path d="M425 1112h428v98H425z" class="stroke-B1 fill-B6 s0"/></g><text x="639" y="1150.5" class="text-bold fill-N1 s1"><tspan x="639" dy="0">q 음수 → 허상</tspan><tspan x="639" dy="17.667">연장선이 만나는 자리. 스크린에는 안 맺힌다</tspan><tspan x="639" dy="17.667">거울이면 거울 뒤, 렌즈이면 물체 쪽</tspan></text></g><g ><g class="shape"><path d="M913 1128h226v66H913z" class="stroke-B1 fill-B6 s0"/></g><text x="1026" y="1166.5" class="text-bold fill-N1 s1">m 음수 → 거꾸로 선 상</text></g><g ><g class="shape"><path d="M1199 1128h226v66h-226z" class="stroke-B1 fill-B6 s0"/></g><text x="1312" y="1166.5" class="text-bold fill-N1 s1">m 양수 → 똑바로 선 상</text></g><g ><g class="shape"><path d="M631 1310h403v82H631z" class="stroke-B1 fill-B6 s0"/></g><text x="832.5" y="1348.5" class="text-bold fill-N1 s1"><tspan x="832.5" dy="0">6. 광선 세 개로 작도해 답과 맞는지 본다</tspan><tspan x="832.5" dy="18.5">작도와 계산이 어긋나면 부호를 다시 본다</tspan></text></g><marker id="mk-d2-2451377160-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M775.284 81.028C694.2 129.6 673.5 152 673.5 188" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M889.716 81.028C970.8 129.6 991.5 152 991.5 188" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M673.5 292c0 38 17.4 58 83.532 96.007" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M991.5 292c0 38-17.4 58-83.532 96.007" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M832.5 474v94" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M832.5 656v94" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M832.5 822c0 38 .1 58 .46 94" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M700.022 985.293C286.4 1046.6 182.5 1072 182.5 1108" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M765.206 999.883C664.6 1049.4 639 1072 639 1108" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M900.792 999.889C1000.6 1049.4 1026 1075.2 1026 1124" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M948.961 989.392C1239 1047.4 1312 1075.2 1312 1124" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M182.5 1212c0 38 89.8 60.6 445.039 110.444" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M639 1212c0 38 21.2 58 102.382 96.294" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M1026 1196c0 50.8-21.2 74-102.382 112.294" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><path fill="none" marker-end="url(#mk-d2-2451377160-3488378134)" d="M1312 1196c0 50.8-55.6 74.6-274.07 116.25" class="connection stroke-B1 s0" mask="url(#d2-2451377160)"/><mask id="d2-2451377160" width="1627" height="1594" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1627v1594H-101z"/></mask></svg>