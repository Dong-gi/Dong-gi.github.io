<svg xmlns="http://www.w3.org/2000/svg" width="1018" height="1636" class="d2-3061806340 d2-svg" viewBox="-89 -89 1018 1636"><rect width="1018" height="1636" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3061806340 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3061806340 .fill-N1{fill:#0a0f25}.d2-3061806340 .fill-N4{fill:#cfd2dd}.d2-3061806340 .fill-B6{fill:#f7f8fe}.d2-3061806340 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M474 104h-4L281 59c-2 0-2-1 0-2l189-45h7l190 45c2 0 2 1 0 2l-189 45z" class="stroke-B1 fill-N4 s0"/></g><text x="474" y="63.5" class="text-bold fill-N1 s1">1. 거울인가 렌즈인가</text></g><g ><g class="shape"><path d="M257 200h183v98H257z" class="stroke-B1 fill-B6 s0"/></g><text x="348.5" y="238.5" class="text-bold fill-N1 s1"><tspan x="348.5" dy="0">거울</tspan><tspan x="348.5" dy="17.667">오목이면 f = +R/2</tspan><tspan x="348.5" dy="17.667">볼록이면 f = −R/2</tspan></text></g><g ><g class="shape"><path d="M460 184h280v130H460z" class="stroke-B1 fill-B6 s0"/></g><text x="600" y="222.5" class="text-bold fill-N1 s1"><tspan x="600" dy="0">렌즈</tspan><tspan x="600" dy="17">볼록(가운데가 두껍다)이면</tspan><tspan x="600" dy="17">f 양수</tspan><tspan x="600" dy="17">오목(가운데가 얇다)이면</tspan><tspan x="600" dy="17">f 음수</tspan></text></g><g ><g class="shape"><path d="M330 394h288v82H330z" class="stroke-B1 fill-B6 s0"/></g><text x="474" y="432.5" class="text-bold fill-N1 s1"><tspan x="474" dy="0">2. 물체 거리 p 를 넣는다</tspan><tspan x="474" dy="18.5">앞에 놓인 실물체이면 p 양수</tspan></text></g><g ><g class="shape"><path d="M306 546h336v98H306z" class="stroke-B1 fill-B6 s0"/></g><text x="474" y="584.5" class="text-bold fill-N1 s1"><tspan x="474" dy="0">3. 1/p + 1/q = 1/f 를 q 에 대해 푼다</tspan><tspan x="474" dy="17.667">1/q = 1/f − 1/p 로 먼저 역수를 구하고</tspan><tspan x="474" dy="17.667">마지막에 뒤집는다</tspan></text></g><g ><g class="shape"><path d="M312 714h325v66H312z" class="stroke-B1 fill-B6 s0"/></g><text x="474.5" y="752.5" class="text-bold fill-N1 s1">4. 배율 m = −q/p, 상의 크기 h′ = m h</text></g><g ><g class="shape"><path d="M474 942h-4l-213-45c-2 0-2-1 0-2l213-45h8l213 45c2 0 2 1 0 2l-213 45z" class="stroke-B1 fill-N4 s0"/></g><text x="474" y="901.5" class="text-bold fill-N1 s1">5. 부호로 성질을 읽는다</text></g><g ><g class="shape"><path d="M12 1072h217v130H12z" class="stroke-B1 fill-B6 s0"/></g><text x="120.5" y="1110.5" class="text-bold fill-N1 s1"><tspan x="120.5" dy="0">q 양수 → 실상</tspan><tspan x="120.5" dy="17">빛이 실제로 모인다.</tspan><tspan x="120.5" dy="17">스크린에 맺힌다</tspan><tspan x="120.5" dy="17">거울이면 거울 앞,</tspan><tspan x="120.5" dy="17">렌즈이면 렌즈 뒤</tspan></text></g><g ><g class="shape"><path d="M249 1072h237v130H249z" class="stroke-B1 fill-B6 s0"/></g><text x="367.5" y="1110.5" class="text-bold fill-N1 s1"><tspan x="367.5" dy="0">q 음수 → 허상</tspan><tspan x="367.5" dy="17">연장선이 만나는 자리.</tspan><tspan x="367.5" dy="17">스크린에는 안 맺힌다</tspan><tspan x="367.5" dy="17">거울이면 거울 뒤,</tspan><tspan x="367.5" dy="17">렌즈이면 물체 쪽</tspan></text></g><g ><g class="shape"><path d="M506 1096h151v82H506z" class="stroke-B1 fill-B6 s0"/></g><text x="581.5" y="1134.5" class="text-bold fill-N1 s1"><tspan x="581.5" dy="0">m 음수 →</tspan><tspan x="581.5" dy="18.5">거꾸로 선 상</tspan></text></g><g ><g class="shape"><path d="M677 1096h151v82H677z" class="stroke-B1 fill-B6 s0"/></g><text x="752.5" y="1134.5" class="text-bold fill-N1 s1"><tspan x="752.5" dy="0">m 양수 →</tspan><tspan x="752.5" dy="18.5">똑바로 선 상</tspan></text></g><g ><g class="shape"><path d="M342 1332h252v114H342z" class="stroke-B1 fill-B6 s0"/></g><text x="468" y="1370.5" class="text-bold fill-N1 s1"><tspan x="468" dy="0">6. 광선 세 개로 작도해</tspan><tspan x="468" dy="17.25">답과 맞는지 본다</tspan><tspan x="468" dy="17.25">작도와 계산이 어긋나면</tspan><tspan x="468" dy="17.25">부호를 다시 본다</tspan></text></g><marker id="mk-d2-3061806340-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="m348.996 77-.238 119" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="m600.005 77 .236 103" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="M348.75 300v90" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="M522.5 316v74" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="M474.5 478v64" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="M474.5 646v64" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="m474.514 782 .457 64" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="m343.003 917 .082 55s.015 10-9.985 10H130.5s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="m367.007 922 .48 146" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="m581.006 922 .483 170" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="m605.997 917-.082 55s-.015 10 9.985 10h126.6s10 0 10 10v100" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="M120.5 1204v78s0 10 10 10h252.349s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="M443.25 1204v124" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="M581.5 1180v52s0 10-10 10h-67.85s-10 0-10 10v76" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><path fill="none" marker-end="url(#mk-d2-3061806340-3488378134)" d="M752.5 1180v102s0 10-10 10H554.05s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3061806340)"/><mask id="d2-3061806340" width="1018" height="1636" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H929v1636H-89z"/></mask></svg>