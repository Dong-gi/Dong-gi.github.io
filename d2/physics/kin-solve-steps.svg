<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="1260" class="d2-2465800702 d2-svg" viewBox="-101 -121 1590 1260"><rect width="1590" height="1260" x="-101" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2465800702 .fill-N1{fill:#0a0f25}.d2-2465800702 .fill-B6{fill:#f7f8fe}.d2-2465800702 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M440 20h492v126H440z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="686" y="7" class="fill-N1" style="text-anchor:middle;font-size:28px">1. 다섯 개의 양을 적는다</text></g><g ><g class="shape"><path d="M449 266h473v66H449z" class="stroke-B1 fill-B6 s0"/></g><text x="685.5" y="304.5" class="text-bold fill-N1 s1">2. 아는 것에 값을 적고, 묻는 것에 물음표를 적는다</text></g><g ><g class="shape"><path d="M686 524h-8l-411-45c-4 0-4-1 0-2l411-45h15l411 45c4 0 4 1 0 2l-410 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="686" y="483.5" class="text-bold fill-N1 s1">3. 나머지 하나(모르고 묻지도 않는 양)를 찾는다</text></g><g ><g class="shape"><path d="M0 624h252v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="126" y="662.5" class="text-bold fill-N1 s1"><tspan x="126" dy="0">빠진 것이 시간이면</tspan><tspan x="126" dy="18.5">나중속도의 제곱 관계식</tspan></text></g><g ><g class="shape"><path d="M312 624h382v82H312z" class="stroke-B1 fill-B6 s0"/></g><text x="503" y="662.5" class="text-bold fill-N1 s1"><tspan x="503" dy="0">빠진 것이 나중속도면</tspan><tspan x="503" dy="18.5">변위 = 처음속도×시간 + ½×가속도×시간²</tspan></text></g><g ><g class="shape"><path d="M754 624h229v82H754z" class="stroke-B1 fill-B6 s0"/></g><text x="868.5" y="662.5" class="text-bold fill-N1 s1"><tspan x="868.5" dy="0">빠진 것이 가속도면</tspan><tspan x="868.5" dy="18.5">변위 = 평균속도×시간</tspan></text></g><g ><g class="shape"><path d="M1043 624h345v82h-345z" class="stroke-B1 fill-B6 s0"/></g><text x="1215.5" y="662.5" class="text-bold fill-N1 s1"><tspan x="1215.5" dy="0">빠진 것이 변위면</tspan><tspan x="1215.5" dy="18.5">나중속도 = 처음속도 + 가속도×시간</tspan></text></g><g ><g class="shape"><path d="M477 806h418v66H477z" class="stroke-B1 fill-B6 s0"/></g><text x="686" y="844.5" class="text-bold fill-N1 s1">4. 단위를 붙여 대입하고 유효숫자를 맞춘다</text></g><g ><g class="shape"><path d="M504 972h363v66H504z" class="stroke-B1 fill-B6 s0"/></g><text x="685.5" y="1010.5" class="text-bold fill-N1 s1">5. 부호·크기·단위가 말이 되는지 본다</text></g><g ><g class="shape"><path d="M470 50h432v66H470z" class="stroke-B1" style="fill:#edf0fd;stroke-width:2"/></g><text x="686" y="88.5" class="text-bold fill-N1 s1">처음속도 · 나중속도 · 가속도 · 걸린시간 · 변위</text></g><marker id="mk-d2-2465800702-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2465800702-3488378134)" d="M685.75 148v114" class="connection stroke-B1 s0" mask="url(#d2-2465800702)"/><path fill="none" marker-end="url(#mk-d2-2465800702-3488378134)" d="M685.75 334c0 38 .05 58 .23 94" class="connection stroke-B1 s0" mask="url(#d2-2465800702)"/><path fill="none" marker-end="url(#mk-d2-2465800702-3488378134)" d="M517.028 507.336C204.6 560.6 126 584 126 620" class="connection stroke-B1 s0" mask="url(#d2-2465800702)"/><path fill="none" marker-end="url(#mk-d2-2465800702-3488378134)" d="M610.228 517.927C524.8 562.6 503 584 503 620" class="connection stroke-B1 s0" mask="url(#d2-2465800702)"/><path fill="none" marker-end="url(#mk-d2-2465800702-3488378134)" d="M761.77 517.93C846.8 562.6 868.5 584 868.5 620" class="connection stroke-B1 s0" mask="url(#d2-2465800702)"/><path fill="none" marker-end="url(#mk-d2-2465800702-3488378134)" d="M848.968 507.358C1141.8 560.6 1215.5 584 1215.5 620" class="connection stroke-B1 s0" mask="url(#d2-2465800702)"/><path fill="none" marker-end="url(#mk-d2-2465800702-34883781