<svg xmlns="http://www.w3.org/2000/svg" width="1109" height="1354" class="d2-832052364 d2-svg" viewBox="-89 -89 1109 1354"><rect width="1109" height="1354" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-832052364 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-832052364 .fill-N1{fill:#0a0f25}.d2-832052364 .fill-B6{fill:#f7f8fe}.d2-832052364 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M272 12h407v182H272z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="475.5" y="45" class="fill-N1" style="text-anchor:middle;font-size:28px">1. 다섯 개의 양을 적는다</text></g><g ><g class="shape"><path d="M337 264h276v82H337z" class="stroke-B1 fill-B6 s0"/></g><text x="475" y="302.5" class="text-bold fill-N1 s1"><tspan x="475" dy="0">2. 아는 것에 값을 적고,</tspan><tspan x="475" dy="18.5">묻는 것에 물음표를 적는다</tspan></text></g><g ><g class="shape"><path d="M475 572c-2 0-3 0-4-1l-230-75q-3-1.5 0-3l230-76c2-1 6-1 9 0l230 76q3 1.5 0 3l-231 75c-1 1-2 1-4 1Z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="475" y="483.5" class="text-bold fill-N1 s1"><tspan x="475" dy="0">3. 나머지 하나</tspan><tspan x="475" dy="17.667">(모르고 묻지도 않는 양)를</tspan><tspan x="475" dy="17.667">찾는다</tspan></text></g><g ><g class="shape"><path d="M12 710h212v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="118" y="748.5" class="text-bold fill-N1 s1"><tspan x="118" dy="0">빠진 것이 시간이면</tspan><tspan x="118" dy="17.667">나중속도의</tspan><tspan x="118" dy="17.667">제곱 관계식</tspan></text></g><g ><g class="shape"><path d="M244 710h232v98H244z" class="stroke-B1 fill-B6 s0"/></g><text x="360" y="748.5" class="text-bold fill-N1 s1"><tspan x="360" dy="0">빠진 것이 나중속도면</tspan><tspan x="360" dy="17.667">변위 = 처음속도×시간</tspan><tspan x="360" dy="17.667">+ ½×가속도×시간²</tspan></text></g><g ><g class="shape"><path d="M496 710h212v98H496z" class="stroke-B1 fill-B6 s0"/></g><text x="602" y="748.5" class="text-bold fill-N1 s1"><tspan x="602" dy="0">빠진 것이 가속도면</tspan><tspan x="602" dy="17.667">변위 =</tspan><tspan x="602" dy="17.667">평균속도×시간</tspan></text></g><g ><g class="shape"><path d="M728 702h191v114H728z" class="stroke-B1 fill-B6 s0"/></g><text x="823.5" y="740.5" class="text-bold fill-N1 s1"><tspan x="823.5" dy="0">빠진 것이 변위면</tspan><tspan x="823.5" dy="17.25">나중속도 =</tspan><tspan x="823.5" dy="17.25">처음속도 +</tspan><tspan x="823.5" dy="17.25">가속도×시간</tspan></text></g><g ><g class="shape"><path d="M356 946h249v82H356z" class="stroke-B1 fill-B6 s0"/></g><text x="480.5" y="984.5" class="text-bold fill-N1 s1"><tspan x="480.5" dy="0">4. 단위를 붙여 대입하고</tspan><tspan x="480.5" dy="18.5">유효숫자를 맞춘다</tspan></text></g><g ><g class="shape"><path d="M299 1098h363v66H299z" class="stroke-B1 fill-B6 s0"/></g><text x="480.5" y="1136.5" class="text-bold fill-N1 s1">5. 부호·크기·단위가 말이 되는지 본다</text></g><g ><g class="shape"><path d="M327 62h297v82H327z" class="stroke-B1" style="fill:#edf0fd;stroke-width:2"/></g><text x="475.5" y="100.5" class="text-bold fill-N1 s1"><tspan x="475.5" dy="0">처음속도 · 나중속도 · 가속도 ·</tspan><tspan x="475.5" dy="18.5">걸린시간 · 변위</tspan></text></g><marker id="mk-d2-832052364-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-832052364-3488378134)" d="M475.75 196v64" class="connection stroke-B1 s0" mask="url(#d2-832052364)"/><path fill="none" marker-end="url(#mk-d2-832052364-3488378134)" d="m475.757 348 .229 64" class="connection stroke-B1 s0" mask="url(#d2-832052364)"/><path fill="none" marker-end="url(#mk-d2-832052364-3488378134)" d="m334.003 528 .13 74s.017 10-9.983 10H128s-10 0-10 10v84" class="connection stroke-B1 s0" mask="url(#d2-832052364)"/><path fill="none" marker-end="url(#mk-d2-832052364-3488378134)" d=