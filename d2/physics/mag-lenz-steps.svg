<svg xmlns="http://www.w3.org/2000/svg" width="1336" height="1750" class="d2-2728924873 d2-svg" viewBox="-101 -101 1336 1750"><rect width="1336" height="1750" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2728924873 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2728924873 .fill-N1{fill:#0a0f25}.d2-2728924873 .fill-B5{fill:#edf0fd}.d2-2728924873 .fill-B6{fill:#f7f8fe}.d2-2728924873 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M270 0h430v82H270z" class="stroke-B1 fill-B6 s0"/></g><text x="485" y="38.5" class="text-bold fill-N1 s1"><tspan x="485" dy="0">1. 고리가 어느 면을 두르고 있는지 정하고</tspan><tspan x="485" dy="18.5">그 면의 앞뒤 중 한쪽을 기준 방향으로 삼는다</tspan></text></g><g ><g class="shape"><path d="M241 182h488v82H241z" class="stroke-B1 fill-B6 s0"/></g><text x="485" y="220.5" class="text-bold fill-N1 s1"><tspan x="485" dy="0">2. 지금 그 면을 뚫는 자기다발의 방향과 크기를 본다</tspan><tspan x="485" dy="18.5">(면을 뚫고 지나가는 자기력선의 수)</tspan></text></g><g ><g class="shape"><path d="M485 456h-6l-334-45c-4 0-4-1 0-2l334-45h12l334 45c4 0 4 1 0 2l-334 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="485" y="415.5" class="text-bold fill-N1 s1">3. 그 다발이 늘고 있는가, 줄고 있는가?</text></g><g ><g class="shape"><path d="M96 556h148v66H96z" class="stroke-B1 fill-B6 s0"/></g><text x="170" y="594.5" class="text-bold fill-N1 s1">늘어나는 중</text></g><g ><g class="shape"><path d="M411 556h148v66H411z" class="stroke-B1 fill-B6 s0"/></g><text x="485" y="594.5" class="text-bold fill-N1 s1">줄어드는 중</text></g><g ><g class="shape"><path d="M819 556h168v66H819z" class="stroke-B1 fill-B6 s0"/></g><text x="903" y="594.5" class="text-bold fill-N1 s1">변하지 않는다</text></g><g ><g class="shape"><path d="M42 722h255v98H42z" class="stroke-B1 fill-B6 s0"/></g><text x="169.5" y="760.5" class="text-bold fill-N1 s1"><tspan x="169.5" dy="0">유도 전류는 고리 안에</tspan><tspan x="169.5" dy="17.667">원래 다발과 반대 방향의</tspan><tspan x="169.5" dy="17.667">자기장을 만든다</tspan></text></g><g ><g class="shape"><path d="M357 722h255v98H357z" class="stroke-B1 fill-B6 s0"/></g><text x="484.5" y="760.5" class="text-bold fill-N1 s1"><tspan x="484.5" dy="0">유도 전류는 고리 안에</tspan><tspan x="484.5" dy="17.667">원래 다발과 같은 방향의</tspan><tspan x="484.5" dy="17.667">자기장을 만든다</tspan></text></g><g ><g class="shape"><path d="m788 725-116 46 116 47h231l115-47-115-46Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="903" y="769" class="text-bold fill-N1 s1"><tspan x="903" dy="0">유도 전류가 흐르지 않는다</tspan><tspan x="903" dy="18.5">(자기장이 세든 약하든 상관없다)</tspan></text></g><g ><g class="shape"><path d="M94 920h467v82H94z" class="stroke-B1 fill-B6 s0"/></g><text x="327.5" y="958.5" class="text-bold fill-N1 s1"><tspan x="327.5" dy="0">4. 오른손 엄지를 그 자기장 방향으로 세우고</tspan><tspan x="327.5" dy="18.5">네 손가락을 감으면 그것이 전류가 도는 방향이다</tspan></text></g><g ><g class="shape"><path d="M0 1102h654v446H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="327" y="1135" class="fill-N1" style="text-anchor:middle;font-size:28px">검산 — 에너지 보존</text></g><g ><g class="shape"><path d="M60 1162h534v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="327" y="1200.5" class="text-bold fill-N1 s1"><tspan x="327" dy="0">유도 전류가 받는 자기력은</tspan><tspan x="327" dy="18.5">언제나 변화를 일으킨 운동을 막는 쪽이다</tspan></text></g><g ><g class="shape"><path d="M60 1284h534v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="327" y="1322.5" class="text-bold fill-N1 s1"><tspan x="327" dy="0">막는 힘을 이기고 계속 움직이려면 밖에서 일을 해야 한다</tspan><tspan x="327" dy="18.5">그 일이 곧 회로에서 나오는 전기 에너지다</tspan></text></g><g ><g class="shape"><path d="M60 1406h534v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="327" y="1444.5" class="text-bold fill-N1 s1"><tspan x="327" dy="0">방향이 반대라면 변화가 스스로 커져</tspan><tspan x="327" dy="18.5">에너지가 공짜로 생긴다 — 그래서 불가능하다</tspan></text></g><marker id="mk-d2-2728924873-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M484.5 84v94" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M484.5 266c0 38 .1 58 .46 94" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M376.088 442.587C211.2 493.2 169.5 516 169.5 552" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M169.5 624v94" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M484.98 458c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M484.5 624v94" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M614.95 440.444C845 492.8 903 516 903 552" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M903 624v97" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M169.5 822c0 38 17.4 58 83.532 96.007" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M484.5 822c0 38-17.4 58-83.532 96.007" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><path fill="none" marker-end="url(#mk-d2-2728924873-3488378134)" d="M327 1004v94" class="connection stroke-B1 s0" mask="url(#d2-2728924873)"/><mask id="d2-2728924873" width="1336" height="1750" x="-101" y="-101" maskUnits="userSpaceO