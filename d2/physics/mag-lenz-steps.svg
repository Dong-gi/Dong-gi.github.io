<svg xmlns="http://www.w3.org/2000/svg" width="1917" height="1461" class="d2-1189767714 d2-svg" viewBox="-91 -101 1917 1461"><rect width="1917" height="1461" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1189767714 .fill-N1{fill:#0a0f25}.d2-1189767714 .fill-B5{fill:#edf0fd}.d2-1189767714 .fill-B6{fill:#f7f8fe}.d2-1189767714 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M787 0h430v82H787z" class="stroke-B1 fill-B6 s0"/></g><text x="1002" y="38.5" class="text-bold fill-N1 s1"><tspan x="1002" dy="0">1. 고리가 어느 면을 두르고 있는지 정하고</tspan><tspan x="1002" dy="18.5">그 면의 앞뒤 중 한쪽을 기준 방향으로 삼는다</tspan></text></g><g ><g class="shape"><path d="M758 182h488v82H758z" class="stroke-B1 fill-B6 s0"/></g><text x="1002" y="220.5" class="text-bold fill-N1 s1"><tspan x="1002" dy="0">2. 지금 그 면을 뚫는 자기다발의 방향과 크기를 본다</tspan><tspan x="1002" dy="18.5">(면을 뚫고 지나가는 자기력선의 수)</tspan></text></g><g ><g class="shape"><path d="M1002 456h-6l-334-45c-4 0-4-1 0-2l334-45h12l334 45c4 0 4 1 0 2l-334 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="1002" y="415.5" class="text-bold fill-N1 s1">3. 그 다발이 늘고 있는가, 줄고 있는가?</text></g><g ><g class="shape"><path d="M465 556h148v66H465z" class="stroke-B1 fill-B6 s0"/></g><text x="539" y="594.5" class="text-bold fill-N1 s1">늘어나는 중</text></g><g ><g class="shape"><path d="M928 556h148v66H928z" class="stroke-B1 fill-B6 s0"/></g><text x="1002" y="594.5" class="text-bold fill-N1 s1">줄어드는 중</text></g><g ><g class="shape"><path d="M1410 556h168v66h-168z" class="stroke-B1 fill-B6 s0"/></g><text x="1494" y="594.5" class="text-bold fill-N1 s1">변하지 않는다</text></g><g ><g class="shape"><path d="M337 728h403v82H337z" class="stroke-B1 fill-B6 s0"/></g><text x="538.5" y="766.5" class="text-bold fill-N1 s1"><tspan x="538.5" dy="0">유도 전류는 고리 안에</tspan><tspan x="538.5" dy="18.5">원래 다발과 반대 방향의 자기장을 만든다</tspan></text></g><g ><g class="shape"><path d="M800 728h403v82H800z" class="stroke-B1 fill-B6 s0"/></g><text x="1001.5" y="766.5" class="text-bold fill-N1 s1"><tspan x="1001.5" dy="0">유도 전류는 고리 안에</tspan><tspan x="1001.5" dy="18.5">원래 다발과 같은 방향의 자기장을 만든다</tspan></text></g><g ><g class="shape"><path d="m1379 722-116 46 116 47h231l115-47-115-46Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="1494" y="766" class="text-bold fill-N1 s1"><tspan x="1494" dy="0">유도 전류가 흐르지 않는다</tspan><tspan x="1494" dy="18.5">(자기장이 세든 약하든 상관없다)</tspan></text></g><g ><g class="shape"><path d="M537 915h467v82H537z" class="stroke-B1 fill-B6 s0"/></g><text x="770.5" y="953.5" class="text-bold fill-N1 s1"><tspan x="770.5" dy="0">4. 오른손 엄지를 그 자기장 방향으로 세우고</tspan><tspan x="770.5" dy="18.5">네 손가락을 감으면 그것이 전류가 도는 방향이다</tspan></text></g><g ><g class="shape"><path d="M10 1117h1552v142H10z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="786" y="1104" class="fill-N1" style="text-anchor:middle;font-size:28px">검산 — 에너지 보존</text></g><g ><g class="shape"><path d="M40 1147h403v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="241.5" y="1185.5" class="text-bold fill-N1 s1"><tspan x="241.5" dy="0">유도 전류가 받는 자기력은</tspan><tspan x="241.5" dy="18.5">언제나 변화를 일으킨 운동을 막는 쪽이다</tspan></text></g><g ><g class="shape"><path d="M503 1147h534v82H503z" class="stroke-B1 fill-B5 s0"/></g><text x="770" y="1185.5" class="text-bold fill-N1 s1"><tspan x="770" dy="0">막는 힘을 이기고 계속 움직이려면 밖에서 일을 해야 한다</tspan><tspan x="770" dy="18.5">그 일이 곧 회로에서 나오는 전기 에너지다</tspan></text></g><g ><g class="shape"><path d="M1097 1147h435v82h-435z" class="stroke-B1 fill-B5 s0"/></g><text x="1314.5" y="1185.5" class="text-bold fill-N1 s1"><tspan x="1314.5" dy="0">방향이 반대라면 변화가 스스로 커져</tspan><tspan x="1314.5" dy="18.5">에너지가 공짜로 생긴다 — 그래서 불가능하다</tspan></text></g><marker id="mk-d2-1189767714-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M1001.5 84v94" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M1001.5 266c0 38 .1 58 .46 94" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M863.042 438.408C603.8 492.4 538.5 516 538.5 552" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M538.5 624v99.5" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M1001.98 458c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M1001.5 624v99.5" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M1144.963 438.38C1423.8 492.4 1494 516 1494 552" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M1494 624v94" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M538.5 812.5c0 41.6 25.4 62.5 123.278 101.035" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M1001.5 812.5c0 41.6-25.4 62.5-123.278 101.035" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><path fill="none" marker-end="url(#mk-d2-1189767714-3488378134)" d="M770 999v73" class="connection stroke-B1 s0" mask="url(#d2-1189767714)"/><mask id="d2-1189767714" width="1917" height="1461" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1917v