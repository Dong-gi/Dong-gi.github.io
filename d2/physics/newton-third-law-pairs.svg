<svg xmlns="http://www.w3.org/2000/svg" width="1091" height="886" class="d2-32407996 d2-svg" viewBox="-89 -89 1091 886"><rect width="1091" height="886" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-32407996 .text-bold{font-weight:700}.d2-32407996 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-32407996 .fill-N1{fill:#0a0f25}.d2-32407996 .fill-N2{fill:#676c7e}.d2-32407996 .fill-B4{fill:#e3e9fd}.d2-32407996 .fill-B5{fill:#edf0fd}.d2-32407996 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M12 12h889v295H12z" class="stroke-B1 fill-B4 s0"/></g><text x="456.5" y="45" class="fill-N1 s1">작용·반작용 — 서로 다른 두 물체</text></g><g ><g class="shape"><path d="M126 326h660v370H126z" class="stroke-B1 fill-B4 s0"/></g><text x="456" y="359" class="fill-N1 s1">힘의 평형 — 한 물체에 걸린 힘들</text></g><g ><g class="shape"><path d="M367 72h64v66h-64z" class="stroke-B1 fill-B5 s0"/></g><text x="399" y="110.5" class="text-bold fill-N1 s2">손</text></g><g ><g class="shape"><path d="M767 72h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="809" y="110.5" class="text-bold fill-N1 s2">상자</text></g><g ><g class="shape"><path d="M62 158h369v98H62z" class="stroke-B1 fill-B5 s0"/></g><text x="246.5" y="196.5" class="text-bold fill-N1 s2"><tspan x="246.5" dy="0">두 힘은 서로 다른 물체에 걸린다.</tspan><tspan x="246.5" dy="17.667">같은 자유물체도에 함께 그릴 수 없고,</tspan><tspan x="246.5" dy="17.667">상쇄되지도 않는다.</tspan></text></g><g ><g class="shape"><path d="M585 412h151v80H585z" class="stroke-B1 fill-B5 s0"/></g><text x="660.5" y="457.5" class="text-bold fill-N1 s2">책상 위의 책</text></g><g ><g class="shape"><path d="M258 376h247v66H258z" class="stroke-B1 fill-B5 s0"/></g><text x="381.5" y="414.5" class="text-bold fill-N1 s2">지구가 당기는 힘 (아래)</text></g><g ><g class="shape"><path d="M258 462h247v66H258z" class="stroke-B1 fill-B5 s0"/></g><text x="381.5" y="500.5" class="text-bold fill-N1 s2">책상이 떠받치는 힘 (위)</text></g><g ><g class="shape"><path d="M176 548h329v98H176z" class="stroke-B1 fill-B5 s0"/></g><text x="340.5" y="586.5" class="text-bold fill-N1 s2"><tspan x="340.5" dy="0">둘 다 책에 걸린다.</tspan><tspan x="340.5" dy="17.667">합이 0 이라 책이 가만히 있다.</tspan><tspan x="340.5" dy="17.667">이 둘은 작용·반작용 쌍이 아니다.</tspan></text></g><marker id="mk-d2-32407996-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-32407996-3488378134)" d="M433 94.5h31.25c13.5 0 0-13.5 13.5-13.5h242.5c13.5 0 0 13.5 13.5 13.5H763" class="connection stroke-B1 s0" mask="url(#d2-32407996)"/><text x="599" y="79" class="text-italic fill-N2 s2"><tspan x="599" dy="0">손이 상자를</tspan><tspan x="599" dy="18.5">미는 힘</tspan></text><path fill="none" marker-end="url(#mk-d2-32407996-3488378134)" d="M765 116.5h-31.25c-13.5 0 0 13.5-13.5 13.5h-242.5c-13.5 0 0-13.5-13.5-13.5H435" class="connection stroke-B1 s0" mask="url(#d2-32407996)"/><text x="599" y="128" class="text-italic fill-N2 s2"><tspan x="599" dy="0">상자가 손을 미는 힘</tspan><tspan x="599" dy="18.5">(크기 같음, 방향 반대)</tspan></text><path fill="none" marker-end="url(#mk-d2-32407996-3488378134)" d="M507.5 409.5h28s10 0 10 10v9.666s0 10 10 10h26" class="connection stroke-B1 s0" mask="url(#d2-32407996)"/><path fill="none" marker-end="url(#mk-d2-32407996-3488378134)" d="M507.5 495.5h28s10 0 10-10v-9.667s0-10 10-10h26" class="connection stroke-B1 s0" mask="url(#d2-32407996)"/><mask id="d2-32407996" width="1091" height="886" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1091v886H-89z"/><path d="M547 63h104v37H547zM509 112h180v37H509z"/></mask></svg>