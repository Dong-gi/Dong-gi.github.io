<svg xmlns="http://www.w3.org/2000/svg" width="1776" height="932" class="d2-180328964 d2-svg" viewBox="61 -76 1776 932"><rect width="1776" height="932" x="61" y="-76" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-180328964 .fill-N1{fill:#0a0f25}.d2-180328964 .fill-N2{fill:#676c7e}.d2-180328964 .fill-B4{fill:#e3e9fd}.d2-180328964 .fill-B5{fill:#edf0fd}.d2-180328964 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M253 65h1483v273H253z" class="stroke-B1 fill-B4 s0"/></g><text x="994.5" y="52" class="fill-N1 s1">작용·반작용 — 서로 다른 두 물체</text></g><g ><g class="shape"><path d="M162 424h1531v331H162z" class="stroke-B1 fill-B4 s0"/></g><text x="927.5" y="411" class="fill-N1 s1">힘의 평형 — 한 물체에 걸린 힘들</text></g><g ><g class="shape"><path d="M283 100h64v66h-64z" class="stroke-B1 fill-B5 s0"/></g><text x="315" y="138.5" class="text-bold fill-N1 s2">손</text></g><g ><g class="shape"><path d="M1393 100h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="1435" y="138.5" class="text-bold fill-N1 s2">상자</text></g><g ><g class="shape"><path d="M1165 226h541v82h-541z" class="stroke-B1 fill-B5 s0"/></g><text x="1435.5" y="264.5" class="text-bold fill-N1 s2"><tspan x="1435.5" dy="0">두 힘은 서로 다른 물체에 걸린다.</tspan><tspan x="1435.5" dy="18.5">같은 자유물체도에 함께 그릴 수 없고, 상쇄되지도 않는다.</tspan></text></g><g ><g class="shape"><path d="M1360 517h151v66h-151z" class="stroke-B1 fill-B5 s0"/></g><text x="1435.5" y="555.5" class="text-bold fill-N1 s2">책상 위의 책</text></g><g ><g class="shape"><path d="M192 454h247v66H192z" class="stroke-B1 fill-B5 s0"/></g><text x="315.5" y="492.5" class="text-bold fill-N1 s2">지구가 당기는 힘 (아래)</text></g><g ><g class="shape"><path d="M192 588h247v66H192z" class="stroke-B1 fill-B5 s0"/></g><text x="315.5" y="626.5" class="text-bold fill-N1 s2">책상이 떠받치는 힘 (위)</text></g><g ><g class="shape"><path d="M1208 643h455v82h-455z" class="stroke-B1 fill-B5 s0"/></g><text x="1435.5" y="681.5" class="text-bold fill-N1 s2"><tspan x="1435.5" dy="0">둘 다 책에 걸린다. 합이 0 이라 책이 가만히 있다.</tspan><tspan x="1435.5" dy="18.5">이 둘은 작용·반작용 쌍이 아니다.</tspan></text></g><marker id="mk-d2-180328964-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-180328964-3488378134)" d="M348.496 130.627C710.5 108.35 919.9 108.35 1389.504 130.561" class="connection stroke-B1 s0" mask="url(#d2-180328964)"/><text x="870" y="114" class="text-italic fill-N2 s2">손이 상자를 미는 힘</text><path fill="none" marker-end="url(#mk-d2-180328964-3488378134)" d="M1391.518 139.771C919.9 204.3 710.5 204.1 350.437 139.21" class="connection stroke-B1 s0" mask="url(#d2-180328964)"/><text x="869.5" y="210" class="text-italic fill-N2 s2">상자가 손을 미는 힘 (크기 같음, 방향 반대)</text><path fill="none" marker-end="url(#mk-d2-180328964-3488378134)" d="M441.5 487.25c287.6 0 471.6 11.098 914.02 55.095" class="connection stroke-B1 s0" mask="url(#d2-180328964)"/><path fill="none" marker-end="url(#mk-d2-180328964-3488378134)" d="M441.5 621.25c287.6 0 471.6-12.508 914.025-62.093" class="connection stroke-B1 s0" mask="url(#d2-180328964)"/><mask id="d2-180328964" width="1776" height="932" x="61" y="-76" maskUnits="userSpaceOnUse"><path fill="#fff" d="M61-76h1776v932H61z"/><path d="M786 98h168v21H786zM696 194h347v21H696z"/></mask></svg>