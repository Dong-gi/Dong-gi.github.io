<svg xmlns="http://www.w3.org/2000/svg" width="1179" height="1277" class="d2-2679316568 d2-svg" viewBox="-91 -121 1179 1277"><rect width="1179" height="1277" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2679316568 .fill-N1{fill:#0a0f25}.d2-2679316568 .fill-N2{fill:#676c7e}.d2-2679316568 .fill-B4{fill:#e3e9fd}.d2-2679316568 .fill-B5{fill:#edf0fd}.d2-2679316568 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M172 20h703v377H172z" class="stroke-B1 fill-B4 s0"/></g><text x="523.5" y="7" class="fill-N1 s1">전하가 공간에 만들어 두는 것 — 놓아 보기 전에 이미 있다</text></g><g ><g class="shape"><path d="M10 581h512v142H10z" class="stroke-B1 fill-B4 s0"/></g><text x="266" y="568" class="fill-N1 s1">그 자리에 전하 q 를 놓으면 비로소</text></g><g ><g class="shape"><path d="M552 558h435v440H552z" class="stroke-B1 fill-B4 s0"/></g><text x="769.5" y="545" class="fill-N1 s1">전하가 도선을 따라 흐르면</text></g><text x="498" y="1034" class="fill-N1 s2"><tspan x="498" dy="0">6장의 힘과 위치에너지가 그대로 되풀이된다.</tspan><tspan x="498" dy="18.5">달라진 것은 질량 자리에 전하가 들어갔다는 점뿐이다</tspan></text><g ><g class="shape"><path d="M202 50h206v98H202z" class="stroke-B1 fill-B5 s0"/></g><text x="305" y="88.5" class="text-bold fill-N1 s2"><tspan x="305" dy="0">전기장 E</tspan><tspan x="305" dy="17.667">[N/C = V/m]</tspan><tspan x="305" dy="17.667">벡터 — 방향이 있다</tspan></text></g><g ><g class="shape"><path d="M533 269h226v98H533z" class="stroke-B1 fill-B5 s0"/></g><text x="646" y="307.5" class="text-bold fill-N1 s2"><tspan x="646" dy="0">전위 V</tspan><tspan x="646" dy="17.667">[V = J/C]</tspan><tspan x="646" dy="17.667">스칼라 — 부호만 있다</tspan></text></g><g ><g class="shape"><path d="M40 611h152v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="116" y="649.5" class="text-bold fill-N1 s2"><tspan x="116" dy="0">전기력 F = q E</tspan><tspan x="116" dy="18.5">[N]</tspan></text></g><g ><g class="shape"><path d="M252 611h240v82H252z" class="stroke-B1 fill-B5 s0"/></g><text x="372" y="649.5" class="text-bold fill-N1 s2"><tspan x="372" dy="0">전기 위치에너지 U = q V</tspan><tspan x="372" dy="18.5">[J]</tspan></text></g><g ><g class="shape"><circle cx="806.5" cy="651.5" r="63.5" class="shape stroke-B1 fill-B5 s0"/></g><text x="806.5" y="649" class="text-bold fill-N1 s2"><tspan x="806.5" dy="0">전류 I</tspan><tspan x="806.5" dy="18.5">[A = C/s]</tspan></text></g><g ><g class="shape"><path d="M624 886h138v82H624z" class="stroke-B1 fill-B5 s0"/></g><text x="693" y="924.5" class="text-bold fill-N1 s2"><tspan x="693" dy="0">저항 R = V / I</tspan><tspan x="693" dy="18.5">[Ω = V/A]</tspan></text></g><g ><g class="shape"><path d="M828 886h129v82H828z" class="stroke-B1 fill-B5 s0"/></g><text x="892.5" y="924.5" class="text-bold fill-N1 s2"><tspan x="892.5" dy="0">전력 P = V I</tspan><tspan x="892.5" dy="18.5">[W = J/s]</tspan></text></g><marker id="mk-d2-2679316568-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2679316568-3488378134)" d="M302.184 149.499c-1.534 46.801 44.566 73.738 226.753 131.479" class="connection stroke-B1 s0" mask="url(#d2-2679316568)"/><text x="391.5" y="243" class="text-italic fill-N2 s2">균일한 장이면 V = E d</text><path fill="none" marker-end="url(#mk-d2-2679316568-3488378134)" d="M716.881 268.343C784.05 220.7 722.65 191.1 412.155 122.365" class="connection stroke-B1 s0" mask="url(#d2-2679316568)"/><text x="639.5" y="178" class="text-italic fill-N2 s2">짧은 거리에 전위가 많이 떨어질수록 E 가 세다</text><path fill="none" marker-end="url(#mk-d2-2679316568-3488378134)" d="M759.59 697.42C706.2 751.2 692.5 837.7 692.5 882.5" class="connection stroke-B1 s0" mask="url(#d2-2679316568)"/><text x="701.5" y="786" class="text-italic fill-N2 s2">같은 전압에 얼마나 흐르는가</text><path fill="none" marker-end="url(#mk-d2-2679316568-3488378134)" d="M846.204 703.597C883 752.4 892.5 837.7 892.5 882.5" class="connection stroke-B1 s0" mask="url(#d2-2679316568)"/><text x="886.5" y="793" class="text-italic fill-N2 s2">전압을 곱하면</text><path fill="none" marker-end="url(#mk-d2-2679316568-3488378134)" d="M218.275 148.512C136.8 196.3 116 230.4 116 263.25V606.5" class="connection stroke-B1 s0" mask="url(#d2-2679316568)"/><text x="116" y="358" class="text-italic fill-N2 s2">q 를 곱한다</text><path fill="none" marker-end="url(#mk-d2-2679316568-3488378134)" d="M530.87 359.545C404.15 405.373 372 429.1 372 447.25V606.5" class="connection stroke-B1 s0" mask="url(#d2-2679316568)"/><text x="372" y="437" class="text-italic fill-N2 s2">q 를 곱한다</text><path fill="none" marker-end="url(#mk-d2-2679316568-3488378134)" d="M726.702 368.05C789.8 407 806 429.1 806 447.25V584" class="connection stroke-B1 s0" mask="url(#d2-2679316568)"/><text x="806" y="462" class="text-italic fill-N2 s2">전위차가 전하를 민다</text><mask id="d2-2679316568" width="1179" height="1277" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1179v1277H-91z"/><path d="M307 227h169v21H307zM449 162h381v21H449zM579 770h245v21H579zM825 777h123v21H825zM68 342h96v21H68zM324 421h96v21h-96zM714 446h184v21H714z"/></mask></svg>