<svg xmlns="http://www.w3.org/2000/svg" width="3960" height="907" class="d2-2512944305 d2-svg" viewBox="108 -85 3960 907"><rect width="3960" height="907" x="108" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2512944305 .fill-N1{fill:#0a0f25}.d2-2512944305 .fill-N2{fill:#676c7e}.d2-2512944305 .fill-B4{fill:#e3e9fd}.d2-2512944305 .fill-B5{fill:#edf0fd}.d2-2512944305 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M301 144h1408v459H301z" class="stroke-B1 fill-B4 s0"/></g><text x="1005" y="131" class="fill-N1 s1">전하가 공간에 만들어 두는 것 — 놓아 보기 전에 이미 있다</text></g><g ><g class="shape"><path d="M2663 56h300v284h-300z" class="stroke-B1 fill-B4 s0"/></g><text x="2813" y="43" class="fill-N1 s1">그 자리에 전하 q 를 놓으면 비로소</text></g><g ><g class="shape"><path d="M2719 437h1248v284H2719z" class="stroke-B1 fill-B4 s0"/></g><text x="3343" y="424" class="fill-N1 s1">전하가 도선을 따라 흐르면</text></g><text x="434" y="648" class="fill-N1 s2"><tspan x="434" dy="0">6장의 힘과 위치에너지가 그대로 되풀이된다.</tspan><tspan x="434" dy="18.5">달라진 것은 질량 자리에 전하가 들어갔다는 점뿐이다</tspan></text><g ><g class="shape"><path d="M331 174h206v98H331z" class="stroke-B1 fill-B5 s0"/></g><text x="434" y="212.5" class="text-bold fill-N1 s2"><tspan x="434" dy="0">전기장 E</tspan><tspan x="434" dy="17.667">[N/C = V/m]</tspan><tspan x="434" dy="17.667">벡터 — 방향이 있다</tspan></text></g><g ><g class="shape"><path d="M1453 432h226v98h-226z" class="stroke-B1 fill-B5 s0"/></g><text x="1566" y="470.5" class="text-bold fill-N1 s2"><tspan x="1566" dy="0">전위 V</tspan><tspan x="1566" dy="17.667">[V = J/C]</tspan><tspan x="1566" dy="17.667">스칼라 — 부호만 있다</tspan></text></g><g ><g class="shape"><path d="M2737 86h152v82h-152z" class="stroke-B1 fill-B5 s0"/></g><text x="2813" y="124.5" class="text-bold fill-N1 s2"><tspan x="2813" dy="0">전기력 F = q E</tspan><tspan x="2813" dy="18.5">[N]</tspan></text></g><g ><g class="shape"><path d="M2693 228h240v82h-240z" class="stroke-B1 fill-B5 s0"/></g><text x="2813" y="266.5" class="text-bold fill-N1 s2"><tspan x="2813" dy="0">전기 위치에너지 U = q V</tspan><tspan x="2813" dy="18.5">[J]</tspan></text></g><g ><g class="shape"><circle cx="2812.5" cy="583.5" r="63.5" class="shape stroke-B1 fill-B5 s0"/></g><text x="2812.5" y="581" class="text-bold fill-N1 s2"><tspan x="2812.5" dy="0">전류 I</tspan><tspan x="2812.5" dy="18.5">[A = C/s]</tspan></text></g><g ><g class="shape"><path d="M3799 467h138v82h-138z" class="stroke-B1 fill-B5 s0"/></g><text x="3868" y="505.5" class="text-bold fill-N1 s2"><tspan x="3868" dy="0">저항 R = V / I</tspan><tspan x="3868" dy="18.5">[Ω = V/A]</tspan></text></g><g ><g class="shape"><path d="M3804 609h129v82h-129z" class="stroke-B1 fill-B5 s0"/></g><text x="3868.5" y="647.5" class="text-bold fill-N1 s2"><tspan x="3868.5" dy="0">전력 P = V I</tspan><tspan x="3868.5" dy="18.5">[W = J/s]</tspan></text></g><marker id="mk-d2-2512944305-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2512944305-3488378134)" d="M539.5 222.5c412.4 0 595.4 42.283 909.47 209.536" class="connection stroke-B1 s0" mask="url(#d2-2512944305)"/><text x="1016.5" y="243" class="text-italic fill-N2 s2">균일한 장이면 V = E d</text><path fill="none" marker-end="url(#mk-d2-2512944305-3488378134)" d="M1450.532 501.74C1134.9 558.675 951.3 512.798 537.964 274" class="connection stroke-B1 s0" mask="url(#d2-2512944305)"/><text x="966.5" y="522" class="text-italic fill-N2 s2">짧은 거리에 전위가 많이 떨어질수록 E 가 세다</text><path fill="none" marker-end="url(#mk-d2-2512944305-3488378134)" d="M2875.949 569.55C3087.6 520.6 3535.8 508.25 3795 508.25" class="connection stroke-B1 s0" mask="url(#d2-2512944305)"/><text x="3333.5" y="519" class="text-italic fill-N2 s2">같은 전압에 얼마나 흐르는가</text><path fill="none" marker-end="url(#mk-d2-2512944305-3488378134)" d="M2876.96 596.4c210.84 43 659.74 53.85 922.54 53.85" class="connection stroke-B1 s0" mask="url(#d2-2512944305)"/><text x="3337.5" y="651" class="text-italic fill-N2 s2">전압을 곱하면</text><path fill="none" marker-end="url(#mk-d2-2512944305-3488378134)" d="M539.477 206.38C951.9 142.938 1157.5 127 1310.5 127h1422" class="connection stroke-B1 s0" mask="url(#d2-2512944305)"/><text x="1634" y="133" class="text-italic fill-N2 s2">q 를 곱한다</text><path fill="none" marker-end="url(#mk-d2-2512944305-3488378134)" d="M1661.625 430.833C1841.6 301.6 1946.7 269 2036.25 269h652.25" class="connection stroke-B1 s0" mask="url(#d2-2512944305)"/><text x="2153" y="275" class="text-italic fill-N2 s2">q 를 곱한다</text><path fill="none" marker-end="url(#mk-d2-2512944305-3488378134)" d="M1680.906 517.855C1845.4 570.05 1946.7 583.25 2036.25 583.25s500.75-.05 708.75-.246" class="connection stroke-B1 s0" mask="url(#d2-2512944305)"/><text x="2209" y="589" class="text-italic fill-N2 s2">전위차가 전하를 민다</text><mask id="d2-2512944305" width="3960" height="907" x="108" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M108-85h3960v907H108z"/><path d="M932 227h169v21H932zM776 506h381v21H776zM3211 503h245v21h-245zM3276 635h123v21h-123zM1586 117h96v21h-96zM2105 259h96v21h-96zM2117 573h184v21h-184z"/></mask></svg>