<svg xmlns="http://www.w3.org/2000/svg" width="1496" height="1038" class="d2-3975958646 d2-svg" viewBox="-101 -101 1496 1038"><rect width="1496" height="1038" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3975958646 .fill-N1{fill:#0a0f25}.d2-3975958646 .fill-B6{fill:#f7f8fe}.d2-3975958646 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M448 0h438v82H448z" class="stroke-B1 fill-B6 s0"/></g><text x="667" y="38.5" class="text-bold fill-N1 s1"><tspan x="667" dy="0">1. 회전축을 먼저 정한다</tspan><tspan x="667" dy="18.5">(미지수가 많이 걸린 점을 고르면 계산이 준다)</tspan></text></g><g ><g class="shape"><path d="M483 182h368v82H483z" class="stroke-B1 fill-B6 s0"/></g><text x="667" y="220.5" class="text-bold fill-N1 s1"><tspan x="667" dy="0">2. 그 축에 대한 관성모멘트 I 를 구한다</tspan><tspan x="667" dy="18.5">(표 → 필요하면 평행축 정리)</tspan></text></g><g ><g class="shape"><path d="M667 456h-3l-160-45c-2 0-2-1 0-2l160-45h6l160 45c2 0 2 1 0 2l-160 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="667" y="415.5" class="text-bold fill-N1 s1">3. 무엇을 묻는가?</text></g><g ><g class="shape"><path d="M9 564h279v66H9z" class="stroke-B1 fill-B6 s0"/></g><text x="148.5" y="602.5" class="text-bold fill-N1 s1">각가속도·장력·힘을 묻는다</text></g><g ><g class="shape"><path d="M349 564h279v66H349z" class="stroke-B1 fill-B6 s0"/></g><text x="488.5" y="602.5" class="text-bold fill-N1 s1">속력·높이·회전수를 묻는다</text></g><g ><g class="shape"><path d="M741 556h209v82H741z" class="stroke-B1 fill-B6 s0"/></g><text x="845.5" y="594.5" class="text-bold fill-N1 s1"><tspan x="845.5" dy="0">붙거나 떨어지거나</tspan><tspan x="845.5" dy="18.5">팔을 당긴다</tspan></text></g><g ><g class="shape"><path d="M1089 564h188v66h-188z" class="stroke-B1 fill-B6 s0"/></g><text x="1183" y="602.5" class="text-bold fill-N1 s1">움직이지 않는다</text></g><g ><g class="shape"><path d="M0 738h297v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="148.5" y="776.5" class="text-bold fill-N1 s1"><tspan x="148.5" dy="0">회전 운동방정식</tspan><tspan x="148.5" dy="17.667">토크의 합 = I × 각가속도</tspan><tspan x="148.5" dy="17.667">(줄로 이어지면 a = R α 로 연결)</tspan></text></g><g ><g class="shape"><path d="M357 746h263v82H357z" class="stroke-B1 fill-B6 s0"/></g><text x="488.5" y="784.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">에너지 보존</tspan><tspan x="488.5" dy="18.5">½ M v² + ½ I ω² + 위치에너지</tspan></text></g><g ><g class="shape"><path d="M680 738h331v98H680z" class="stroke-B1 fill-B6 s0"/></g><text x="845.5" y="776.5" class="text-bold fill-N1 s1"><tspan x="845.5" dy="0">각운동량 보존</tspan><tspan x="845.5" dy="17.667">I ω 의 합이 변하지 않는다</tspan><tspan x="845.5" dy="17.667">(에너지는 보존되지 않을 수 있다)</tspan></text></g><g ><g class="shape"><path d="M1071 746h223v82h-223z" class="stroke-B1 fill-B6 s0"/></g><text x="1182.5" y="784.5" class="text-bold fill-N1 s1"><tspan x="1182.5" dy="0">정지 평형</tspan><tspan x="1182.5" dy="18.5">힘의 합 0, 토크의 합 0</tspan></text></g><marker id="mk-d2-3975958646-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3975958646-3488378134)" d="M667 84v94" class="connection stroke-B1 s0" mask="url(#d2-3975958646)"/><path fill="none" marker-end="url(#mk-d2-3975958646-3488378134)" d="M667 266v94" class="connection stroke-B1 s0" mask="url(#d2-3975958646)"/><path fill="none" marker-end="url(#mk-d2-3975958646-3488378134)" d="M564.034 428.367C232 490.4 148.5 517.6 148.5 560" class="connection stroke-B1 s0" mask="url(#d2-3975958646)"/><path fill="none" marker-end="url(#mk-d2-3975958646-3488378134)" d="M148.5 632v102" class="connection stroke-B1 s0" mask="url(#d2-3975958646)"/><path fill="none" marker-end="url(#mk-d2-3975958646-3488378134)" d="M608.236 441.943C51