<svg xmlns="http://www.w3.org/2000/svg" width="1089" height="1026" class="d2-4042859416 d2-svg" viewBox="-89 -89 1089 1026"><rect width="1089" height="1026" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-4042859416 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4042859416 .fill-N1{fill:#0a0f25}.d2-4042859416 .fill-B6{fill:#f7f8fe}.d2-4042859416 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M329 12h282v98H329z" class="stroke-B1 fill-B6 s0"/></g><text x="470" y="50.5" class="text-bold fill-N1 s1"><tspan x="470" dy="0">1. 회전축을 먼저 정한다</tspan><tspan x="470" dy="17.667">(돌고 있으면 그 회전축,</tspan><tspan x="470" dy="17.667">평형이면 미지수가 몰린 점)</tspan></text></g><g ><g class="shape"><path d="M286 180h368v82H286z" class="stroke-B1 fill-B6 s0"/></g><text x="470" y="218.5" class="text-bold fill-N1 s1"><tspan x="470" dy="0">2. 그 축에 대한 관성모멘트 I 를 구한다</tspan><tspan x="470" dy="18.5">(표 → 필요하면 평행축 정리)</tspan></text></g><g ><g class="shape"><path d="M470 424h-3l-160-45c-2 0-2-1 0-2l160-45h6l160 45c2 0 2 1 0 2l-160 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="470" y="383.5" class="text-bold fill-N1 s1">3. 무엇을 묻는가?</text></g><g ><g class="shape"><path d="M12 554h215v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="119.5" y="592.5" class="text-bold fill-N1 s1"><tspan x="119.5" dy="0">각가속도·장력·힘을</tspan><tspan x="119.5" dy="18.5">묻는다</tspan></text></g><g ><g class="shape"><path d="M247 554h215v82H247z" class="stroke-B1 fill-B6 s0"/></g><text x="354.5" y="592.5" class="text-bold fill-N1 s1"><tspan x="354.5" dy="0">속력·높이·회전수를</tspan><tspan x="354.5" dy="18.5">묻는다</tspan></text></g><g ><g class="shape"><path d="M482 554h209v82H482z" class="stroke-B1 fill-B6 s0"/></g><text x="586.5" y="592.5" class="text-bold fill-N1 s1"><tspan x="586.5" dy="0">붙거나 떨어지거나</tspan><tspan x="586.5" dy="18.5">팔을 당긴다</tspan></text></g><g ><g class="shape"><path d="M711 562h188v66H711z" class="stroke-B1 fill-B6 s0"/></g><text x="805" y="600.5" class="text-bold fill-N1 s1">움직이지 않는다</text></g><g ><g class="shape"><path d="M25 706h188v130H25z" class="stroke-B1 fill-B6 s0"/></g><text x="119" y="744.5" class="text-bold fill-N1 s1"><tspan x="119" dy="0">회전 운동방정식</tspan><tspan x="119" dy="17">토크의 합 =</tspan><tspan x="119" dy="17">I × 각가속도</tspan><tspan x="119" dy="17">(줄로 이어지면</tspan><tspan x="119" dy="17">a = R α 로 연결)</tspan></text></g><g ><g class="shape"><path d="M276 706h157v98H276z" class="stroke-B1 fill-B6 s0"/></g><text x="354.5" y="744.5" class="text-bold fill-N1 s1"><tspan x="354.5" dy="0">에너지 보존</tspan><tspan x="354.5" dy="17.667">½ M v² + ½ I ω²</tspan><tspan x="354.5" dy="17.667">+ 위치에너지</tspan></text></g><g ><g class="shape"><path d="M479 706h214v130H479z" class="stroke-B1 fill-B6 s0"/></g><text x="586" y="744.5" class="text-bold fill-N1 s1"><tspan x="586" dy="0">각운동량 보존</tspan><tspan x="586" dy="17">I ω 의 합이</tspan><tspan x="586" dy="17">변하지 않는다</tspan><tspan x="586" dy="17">(에너지는 보존되지</tspan><tspan x="586" dy="17">않을 수 있다)</tspan></text></g><g ><g class="shape"><path d="M735 706h140v98H735z" class="stroke-B1 fill-B6 s0"/></g><text x="805" y="744.5" class="text-bold fill-N1 s1"><tspan x="805" dy="0">정지 평형</tspan><tspan x="805" dy="17.667">힘의 합 0,</tspan><tspan x="805" dy="17.667">토크의 합 0</tspan></text></g><marker id="mk-d2-4042859416-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4042859416-3488378134)" d="M470.5 112v64" class="connection stroke-B1 s0" mask="url(#d2-4042859416)"/><path fill="none" marker-end="url(#mk-d2-4042859416-3488378134)" d="m470.514 264 .457 64" class="connection stroke-B1 s0" mask="url(#d2-4042859416)"/><path fill="none" marker-end="ur