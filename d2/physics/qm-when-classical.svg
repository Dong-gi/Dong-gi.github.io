<svg xmlns="http://www.w3.org/2000/svg" width="990" height="1403" class="d2-3313632271 d2-svg" viewBox="-89 -89 990 1403"><rect width="990" height="1403" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3313632271 .text-bold{font-weight:700}.d2-3313632271 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3313632271 .fill-N1{fill:#0a0f25}.d2-3313632271 .fill-N2{fill:#676c7e}.d2-3313632271 .fill-N4{fill:#cfd2dd}.d2-3313632271 .fill-B6{fill:#f7f8fe}.d2-3313632271 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M318 12h168v66H318z" class="stroke-B1 fill-B6 s0"/></g><text x="402" y="50.5" class="text-bold fill-N1 s1">다루려는 대상</text></g><g ><g class="shape"><path d="M402 272h-4l-204-61c-2-1-2-2 0-2l204-61c2-1 5-1 8 0l205 60c2 1 2 2 0 2l-205 62z" class="stroke-B1 fill-N4 s0"/></g><text x="402" y="207.5" class="text-bold fill-N1 s1"><tspan x="402" dy="0">속력 v 가 광속 c 에 견줘</tspan><tspan x="402" dy="18.5">얼마나 큰가</tspan></text></g><g ><g class="shape"><path d="M152 352h251v82H152z" class="stroke-B1 fill-B6 s0"/></g><text x="277.5" y="390.5" class="text-bold fill-N1 s1"><tspan x="277.5" dy="0">v / c 가 0.1 보다 훨씬 작다</tspan><tspan x="277.5" dy="18.5">(γ 가 1.005 이내)</tspan></text></g><g ><g class="shape"><path d="M423 360h208v66H423z" class="stroke-B1 fill-B6 s0"/></g><text x="527" y="398.5" class="text-bold fill-N1 s1">v / c 가 0.1 을 넘는다</text></g><g ><g class="shape"><path d="M402 670c-1 0-2 0-3-1l-184-75q-3-1.5 0-3l184-76c2-1 5-1 7 0l183 76q3 1.5 0 3l-184 75c-1 1-2 1-3 1Z" class="stroke-B1 fill-N4 s0"/></g><text x="402" y="581.5" class="text-bold fill-N1 s1"><tspan x="402" dy="0">드브로이 파장 h/p 가</tspan><tspan x="402" dy="17.667">계의 크기에 견줘</tspan><tspan x="402" dy="17.667">얼마나 큰가</tspan></text></g><g ><g class="shape"><path d="M84 750h212v146H84z" class="stroke-B1 fill-B6 s0"/></g><text x="190" y="788.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">파장이 계의 크기와</tspan><tspan x="190" dy="16.833">같은 자리 수이거나</tspan><tspan x="190" dy="16.833">더 크다</tspan><tspan x="190" dy="16.833">원자 속 전자,</tspan><tspan x="190" dy="16.833">저온의 원자,</tspan><tspan x="190" dy="16.833">결정 속 전자</tspan></text></g><g ><g class="shape"><path d="M489 782h232v98H489z" class="stroke-B1 fill-B6 s0"/></g><text x="605" y="820.5" class="text-bold fill-N1 s1"><tspan x="605" dy="0">파장이 계의 크기보다</tspan><tspan x="605" dy="17.667">터무니없이 작다</tspan><tspan x="605" dy="17.667">야구공, 자동차, 행성</tspan></text></g><g ><g class="shape"><path d="M391 1067h215v114H391z" class="stroke-B1 fill-B6 s0"/></g><text x="498.5" y="1105.5" class="text-bold fill-N1 s1"><tspan x="498.5" dy="0">뉴턴 역학으로</tspan><tspan x="498.5" dy="17.25">충분하다</tspan><tspan x="498.5" dy="17.25">4장에서 13장까지의</tspan><tspan x="498.5" dy="17.25">도구</tspan></text></g><g ><g class="shape"><path d="M626 1067h174v146H626z" class="stroke-B1 fill-B6 s0"/></g><text x="713" y="1105.5" class="text-bold fill-N1 s1"><tspan x="713" dy="0">특수상대성이</tspan><tspan x="713" dy="16.833">필요하다</tspan><tspan x="713" dy="16.833">γ = 1/√(1 − v²/c²)</tspan><tspan x="713" dy="16.833">를 붙인다</tspan><tspan x="713" dy="16.833">가속기의 전자,</tspan><tspan x="713" dy="16.833">우주선의 뮤온</tspan></text></g><g ><g class="shape"><path d="M12 1067h168v146H12z" class="stroke-B1 fill-B6 s0"/></g><text x="96" y="1105.5" class="text-bold fill-N1 s1"><tspan x="96" dy="0">양자역학이</tspan><tspan x="96" dy="16.833">필요하다</tspan><tspan x="96" dy="16.833">E = hf, λ = h/p,</tspan><tspan x="96" dy="16.833">불확정성 원리</tspan><tspan x="96" dy="16.833">원자·분자·</tspan><tspan x="96" dy="16.833">고체·반도체</tspan></text></g><g ><g class="shape"><path d="M200 1067h171v146H200z" class="stroke-B1 fill-B6 s0"/></g><text x="285.5" y="1105.5" class="text-bold fill-N1 s1"><tspan x="285.5" dy="0">둘 다 필요하다</tspan><tspan x="285.5" dy="16.833">상대론적</tspan><tspan x="285.5" dy="16.833">양자역학</tspan><tspan x="285.5" dy="16.833">무거운 원자의</tspan><tspan x="285.5" dy="16.833">안쪽 전자,</tspan><tspan x="285.5" dy="16.833">고에너지 충돌</tspan></text></g><marker id="mk-d2-3313632271-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3313632271-3488378134)" d="m402.838 80 .152 63" class="connection stroke-B1 s0" mask="url(#d2-3313632271)"/><path fill="none" marker-end="url(#mk-d2-3313632271-3488378134)" d="m278.001 238 .08 110" class="connection stroke-B1 s0" mask="url(#d2-3313632271)"/><path fill="none" marker-end="url(#mk-d2-3313632271-3488378134)" d="m527.993 238-.397 118" class="connection stroke-B1 s0" mask="url(#d2-3313632271)"/><path fill="none" marker-end="url(#mk-d2-3313632271-3488378134)" d="m340.163 436-.157 99" class="connection stroke-B1 s0" mask="url(#d2-3313632271)"/><path fill="none" marker-end="url(#mk-d2-3313632271-3488378134)" d="m465.491 428-.473 108" class="connection stroke-B1 s0" mask="url(#d2-3313632271)"/><path fill="none" marker-end="url(#mk-d2-3313632271-3488378134)" d="m340.005 647 .135 53s.026 10-9.974 10H200.75s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3313632271)"/><path fill="none" marker-end="url(#mk-d2-3313632271-3488378134)" d="m465.015 647 .408 53s.077 10 10.077 10h120.25s10 0 10 10v58" class="connection stroke-B1 s0" mask="url(#d2-3313632271)"/><path fill="none" marker-end="url(#mk-d2-3313632271-3488378134)" d="M567.083 882v181" class="connection stroke-B1 s0" mask="url(#d2-3313632271)"/><text x="567.5" y="979" class="text-italic fill-N2 s1">느릴 때</text><path fill="none" marker-end="url(#mk-d2-3313632271-3488378134)" d="M644.416 882v44s0 10 10 10H703s10 0 10 10v117" class="connection stroke-B1 s0" mask="url(#d2-3313632271)"/><text x="713.5" y="945" class="text-italic fill-N2 s1">빠를 때</text><path fill="none" marker-end="url(#mk-d2-3313632271-3488378134)" d="M96 898