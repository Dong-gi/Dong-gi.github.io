<svg xmlns="http://www.w3.org/2000/svg" width="1601" height="1235" class="d2-668139391 d2-svg" viewBox="-101 -101 1601 1235"><rect width="1601" height="1235" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-668139391 .fill-N1{fill:#0a0f25}.d2-668139391 .fill-N2{fill:#676c7e}.d2-668139391 .fill-N4{fill:#cfd2dd}.d2-668139391 .fill-B6{fill:#f7f8fe}.d2-668139391 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M608 0h168v66H608z" class="stroke-B1 fill-B6 s0"/></g><text x="692" y="38.5" class="text-bold fill-N1 s1">다루려는 대상</text></g><g ><g class="shape"><path d="M692 258h-6l-310-45c-3 0-3-1 0-2l310-45h12l310 45c3 0 3 1 0 2l-310 45z" class="stroke-B1 fill-N4 s0"/></g><text x="692" y="217.5" class="text-bold fill-N1 s1">속력 v 가 광속 c 에 견줘 얼마나 큰가</text></g><g ><g class="shape"><path d="M422 358h251v82H422z" class="stroke-B1 fill-B6 s0"/></g><text x="547.5" y="396.5" class="text-bold fill-N1 s1"><tspan x="547.5" dy="0">v / c 가 0.1 보다 훨씬 작다</tspan><tspan x="547.5" dy="18.5">(γ 가 1.005 이내)</tspan></text></g><g ><g class="shape"><path d="M733 366h208v66H733z" class="stroke-B1 fill-B6 s0"/></g><text x="837" y="404.5" class="text-bold fill-N1 s1">v / c 가 0.1 을 넘는다</text></g><g ><g class="shape"><path d="M692 632h-8l-436-45c-5 0-5-1 0-2l436-45h16l435 45c5 0 5 1 0 2l-435 45z" class="stroke-B1 fill-N4 s0"/></g><text x="692" y="591.5" class="text-bold fill-N1 s1">드브로이 파장 h/p 가 계의 크기에 견줘 얼마나 큰가</text></g><g ><g class="shape"><path d="M106 732h450v82H106z" class="stroke-B1 fill-B6 s0"/></g><text x="331" y="770.5" class="text-bold fill-N1 s1"><tspan x="331" dy="0">파장이 계의 크기와 같은 자리 수이거나 더 크다</tspan><tspan x="331" dy="18.5">원자 속 전자, 저온의 원자, 결정 속 전자</tspan></text></g><g ><g class="shape"><path d="M889 732h380v82H889z" class="stroke-B1 fill-B6 s0"/></g><text x="1079" y="770.5" class="text-bold fill-N1 s1"><tspan x="1079" dy="0">파장이 계의 크기보다 터무니없이 작다</tspan><tspan x="1079" dy="18.5">야구공, 자동차, 행성</tspan></text></g><g ><g class="shape"><path d="M780 943h258v82H780z" class="stroke-B1 fill-B6 s0"/></g><text x="909" y="981.5" class="text-bold fill-N1 s1"><tspan x="909" dy="0">뉴턴 역학으로 충분하다</tspan><tspan x="909" dy="18.5">4장에서 13장까지의 도구</tspan></text></g><g ><g class="shape"><path d="M1098 935h301v98h-301z" class="stroke-B1 fill-B6 s0"/></g><text x="1248.5" y="973.5" class="text-bold fill-N1 s1"><tspan x="1248.5" dy="0">특수상대성이 필요하다</tspan><tspan x="1248.5" dy="17.667">γ = 1/√(1 − v²/c²) 를 붙인다</tspan><tspan x="1248.5" dy="17.667">가속기의 전자, 우주선의 뮤온</tspan></text></g><g ><g class="shape"><path d="M0 935h272v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="136" y="973.5" class="text-bold fill-N1 s1"><tspan x="136" dy="0">양자역학이 필요하다</tspan><tspan x="136" dy="17.667">E = hf, λ = h/p, 불확정성 원리</tspan><tspan x="136" dy="17.667">원자·분자·고체·반도체</tspan></text></g><g ><g class="shape"><path d="M332 935h388v98H332z" class="stroke-B1 fill-B6 s0"/></g><text x="526" y="973.5" class="text-bold fill-N1 s1"><tspan x="526" dy="0">둘 다 필요하다</tspan><tspan x="526" dy="17.667">상대론적 양자역학</tspan><tspan x="526" dy="17.667">무거운 원자의 안쪽 전자, 고에너지 충돌</tspan></text></g><marker id="mk-d2-668139391-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-668139391-3488378134)" d="M692.25 68c0 38-.05 58-.23 94" class="connection stroke-B1 s0" mask="url(#d2-668139391)"/><path fill="none" marker-end="url(#mk-d2-668139391-3488378134)" d="M632.339 251.114C564.8 296.4 547.5 318 547.5 354" class="connection stroke-B1 s0" mask="url(#d2-668139391)"/><path fill="none" marker-end="url(#mk-d2-668139391-3488378134)" d="M752.658 251.118C819.8 296.4 837 319.6 837 362" class="connection stroke-B1 s0" mask="url(#d2-668139391)