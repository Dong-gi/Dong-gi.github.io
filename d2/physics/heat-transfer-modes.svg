<svg xmlns="http://www.w3.org/2000/svg" width="1179" height="1612" class="d2-2469747262 d2-svg" viewBox="-88 -89 1179 1612"><rect width="1179" height="1612" x="-88" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2469747262 .fill-N1{fill:#0a0f25}.d2-2469747262 .fill-N2{fill:#676c7e}.d2-2469747262 .fill-B5{fill:#edf0fd}.d2-2469747262 .fill-B6{fill:#f7f8fe}.d2-2469747262 .stroke-B1,.d2-2469747262 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:8,7.892511}</style><g ><g class="shape"><circle cx="539" cy="331" r="170" class="shape stroke-B1 fill-B6 s0"/></g><text x="539" y="328.5" class="text-bold fill-N1 s1"><tspan x="539" dy="0">뜨거운 쪽</tspan><tspan x="539" dy="18.5">분자가 심하게 흔들린다</tspan></text></g><g ><g class="shape"><path d="M77 627h913v319H77z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="225" y="614" class="fill-N1" style="text-anchor:middle;font-size:28px">열이 가는 세 가지 길</text></g><g ><g class="shape"><circle cx="591" cy="1223" r="142" class="shape stroke-B1 fill-B6 s0"/></g><text x="591" y="1220.5" class="text-bold fill-N1 s1"><tspan x="591" dy="0">찬 쪽</tspan><tspan x="591" dy="18.5">분자가 덜 흔들린다</tspan></text></g><g ><g class="shape"><path d="m234 12-71 34 71 35h142l71-35-71-34Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="305" y="52" class="text-bold fill-N1 s1">사이가 진공이라면</text></g><text x="531" y="1401" class="fill-N1 s1"><tspan x="531" dy="0">보온병이 이중벽 사이를 진공으로 만들고</tspan><tspan x="531" dy="18.5">안쪽을 거울처럼 도금하는 이유가 이 그림에 다 있다</tspan></text><g ><g class="shape"><path d="M127 786h245v130H127z" class="stroke-B1 fill-B5 s0"/></g><text x="249.5" y="824.5" class="text-bold fill-N1 s1"><tspan x="249.5" dy="0">전도</tspan><tspan x="249.5" dy="17">맞닿은 분자끼리</tspan><tspan x="249.5" dy="17">흔들림을 넘겨준다</tspan><tspan x="249.5" dy="17">물질은 제자리에 있다</tspan><tspan x="249.5" dy="17">금속 숟가락, 벽, 창유리</tspan></text></g><g ><g class="shape"><path d="M392 786h252v130H392z" class="stroke-B1 fill-B5 s0"/></g><text x="518" y="824.5" class="text-bold fill-N1 s1"><tspan x="518" dy="0">대류</tspan><tspan x="518" dy="17">데워져 가벼워진 유체가</tspan><tspan x="518" dy="17">통째로 올라간다</tspan><tspan x="518" dy="17">물질이 실려 간다</tspan><tspan x="518" dy="17">끓는 물, 바람, 온수 난방</tspan></text></g><g ><g class="shape"><path d="M664 791h276v114H664z" class="stroke-B1 fill-B5 s0"/></g><text x="802" y="829.5" class="text-bold fill-N1 s1"><tspan x="802" dy="0">복사</tspan><tspan x="802" dy="17.25">전자기파로 곧장 나간다</tspan><tspan x="802" dy="17.25">중간에 물질이 없어도 된다</tspan><tspan x="802" dy="17.25">햇빛, 난로 앞의 따뜻함</tspan></text></g><marker id="mk-d2-2469747262-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2469747262-3488378134)" d="m388.997 412-.398 254s-.016 10-10.016 10H300.75s-10 0-10 10v97" class="connection stroke-B1 s0" mask="url(#d2-2469747262)"/><path fill="none" marker-end="url(#mk-d2-2469747262-3488378134)" d="M249.916 918v113s0 10 10 10h250.667s10 0 10.07 10l.319 45" class="connection stroke-B1 s0" mask="url(#d2-2469747262)"/><path fill="none" marker-end="url(#mk-d2-2469747262-3488378134)" d="m560.003 502 .407 281" class="connection stroke-B1 s0" mask="url(#d2-2469747262)"/><path fill="none" marker-end="url(#mk-d2-2469747262-3488378134)" d="m591.588 918 .402 159" class="connection stroke-B1 s0" mask="url(#d2-2469747262)"/><path fill="none" marker-end="url(#mk-d2-2469747262-3488378134)" d="M624 480v51s0 10 10 10h112.416s10 0 10 10v237" class="connection stroke-B1 s0" mask="url(#d2-2469747262)"/><path fill="none" marker-end="url(#mk-d2-2469747262-3488378134)" d="M802.416 908v73s0 10-10 10H672.583s-10 0-9.962 10l.364 95" class="connection stroke-B1 s0" mask