<svg xmlns="http://www.w3.org/2000/svg" width="2392" height="885" class="d2-1409149449 d2-svg" viewBox="-101 -85 2392 885"><rect width="2392" height="885" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1409149449 .fill-N1{fill:#0a0f25}.d2-1409149449 .fill-N2{fill:#676c7e}.d2-1409149449 .fill-B5{fill:#edf0fd}.d2-1409149449 .fill-B6{fill:#f7f8fe}.d2-1409149449 .stroke-B1,.d2-1409149449 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:8,7.892511}</style><g ><g class="shape"><circle cx="217" cy="253" r="170" class="shape stroke-B1 fill-B6 s0"/></g><text x="217" y="250.5" class="text-bold fill-N1 s1"><tspan x="217" dy="0">뜨거운 쪽</tspan><tspan x="217" dy="18.5">분자가 심하게 흔들린다</tspan></text></g><g ><g class="shape"><path d="M1059 56h460v643h-460z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1289" y="43" class="fill-N1" style="text-anchor:middle;font-size:28px">열이 가는 세 가지 길</text></g><g ><g class="shape"><circle cx="2048" cy="378" r="142" class="shape stroke-B1 fill-B6 s0"/></g><text x="2048" y="375.5" class="text-bold fill-N1 s1"><tspan x="2048" dy="0">찬 쪽</tspan><tspan x="2048" dy="18.5">분자가 덜 흔들린다</tspan></text></g><g ><g class="shape"><path d="m146 483-71 34 71 35h142l71-35-71-34Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="217" y="523" class="text-bold fill-N1 s1">사이가 진공이라면</text></g><text x="217" y="628" class="fill-N1 s1"><tspan x="217" dy="0">보온병이 이중벽 사이를 진공으로 만들고</tspan><tspan x="217" dy="18.5">안쪽을 거울처럼 도금하는 이유가 이 그림에 다 있다</tspan></text><g ><g class="shape"><path d="M1111 86h357v114h-357z" class="stroke-B1 fill-B5 s0"/></g><text x="1289.5" y="124.5" class="text-bold fill-N1 s1"><tspan x="1289.5" dy="0">전도</tspan><tspan x="1289.5" dy="17.25">맞닿은 분자끼리 흔들림을 넘겨준다</tspan><tspan x="1289.5" dy="17.25">물질은 제자리에 있다</tspan><tspan x="1289.5" dy="17.25">금속 숟가락, 벽, 창유리</tspan></text></g><g ><g class="shape"><path d="M1089 321h400v114h-400z" class="stroke-B1 fill-B5 s0"/></g><text x="1289" y="359.5" class="text-bold fill-N1 s1"><tspan x="1289" dy="0">대류</tspan><tspan x="1289" dy="17.25">데워져 가벼워진 유체가 통째로 올라간다</tspan><tspan x="1289" dy="17.25">물질이 실려 간다</tspan><tspan x="1289" dy="17.25">끓는 물, 바람, 온수 난방</tspan></text></g><g ><g class="shape"><path d="M1151 555h276v114h-276z" class="stroke-B1 fill-B5 s0"/></g><text x="1289" y="593.5" class="text-bold fill-N1 s1"><tspan x="1289" dy="0">복사</tspan><tspan x="1289" dy="17.25">전자기파로 곧장 나간다</tspan><tspan x="1289" dy="17.25">중간에 물질이 없어도 된다</tspan><tspan x="1289" dy="17.25">햇빛, 난로 앞의 따뜻함</tspan></text></g><marker id="mk-d2-1409149449-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1409149449-3488378134)" d="M382.928 207.47C629.8 139.6 982.1 124.44 1106.508 131.964" class="connection stroke-B1 s0" mask="url(#d2-1409149449)"/><path fill="none" marker-end="url(#mk-d2-1409149449-3488378134)" d="M1470.5 143c125.6 0 330.9 28.8 465.433 141.432" class="connection stroke-B1 s0" mask="url(#d2-1409149449)"/><path fill="none" marker-end="url(#mk-d2-1409149449-3488378134)" d="M389 253.002c242 .198 597.696 13.698 740.726 66.121" class="connection stroke-B1 s0" mask="url(#d2-1409149449)"/><path fill="none" marker-end="url(#mk-d2-1409149449-3488378134)" d="M1491 377.5c109.2 0 303.8.1 411 .486" class="connection stroke-B1 s0" mask="url(#d2-1409149449)"/><path fill="none" marker-end="url(#mk-d2-1409149449-3488378134)" d="M362.7 344.054C625.8 507.2 990.2 555.85 1147.07 585.507" class="connection stroke-B1 s0" mask="url(#d2-1409149449)"/><path fill="none" marker-end="url(#mk-d2-1409149449-3488378134)" d="M1429 612c158.8 0 372.4-28.6 506.924-140.443" class="connection stroke-B1 s