<svg xmlns="http://www.w3.org/2000/svg" width="1297" height="1175" class="d2-2846244523 d2-svg" viewBox="-91 -121 1297 1175"><rect width="1297" height="1175" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2846244523 .fill-N1{fill:#0a0f25}.d2-2846244523 .fill-N2{fill:#676c7e}.d2-2846244523 .fill-B4{fill:#e3e9fd}.d2-2846244523 .fill-B5{fill:#edf0fd}.d2-2846244523 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M10 20h1095v174H10z" class="stroke-B1 fill-B4 s0"/></g><text x="557.5" y="7" class="fill-N1 s1">장이 시작하고 끝나는 곳</text></g><g ><g class="shape"><path d="M605 355h460v409H605z" class="stroke-B1 fill-B4 s0"/></g><text x="835" y="342" class="fill-N1 s1">장을 만들어 내는 것</text></g><g ><g class="shape"><path d="m714 884-121 34 121 35h243l121-35-121-34Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="835.5" y="924" class="text-bold fill-N1 s2">두 식이 서로를 가리키면 파가 된다</text></g><g ><g class="shape"><path d="M40 50h495v114H40z" class="stroke-B1 fill-B5 s0"/></g><text x="287.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="287.5" dy="0">가우스 법칙 (전기)</tspan><tspan x="287.5" dy="17.25">닫힌 면을 뚫고 나가는 전기력선의 총량은</tspan><tspan x="287.5" dy="17.25">그 안에 든 전하가 정한다</tspan><tspan x="287.5" dy="17.25">→ 전기력선은 양전하에서 시작해 음전하에서 끝난다</tspan></text></g><g ><g class="shape"><path d="M595 58h480v98H595z" class="stroke-B1 fill-B5 s0"/></g><text x="835" y="96.5" class="text-bold fill-N1 s2"><tspan x="835" dy="0">가우스 법칙 (자기)</tspan><tspan x="835" dy="17.667">닫힌 면을 뚫고 나가는 자기력선의 총량은 언제나 0</tspan><tspan x="835" dy="17.667">→ 들어간 만큼 나온다. 자기 홀극이 없다는 말이다</tspan></text></g><g ><g class="shape"><path d="M655 385h360v114H655z" class="stroke-B1 fill-B5 s0"/></g><text x="835" y="423.5" class="text-bold fill-N1 s2"><tspan x="835" dy="0">패러데이 법칙</tspan><tspan x="835" dy="17.25">닫힌 고리를 뚫는 자기다발이 변하면</tspan><tspan x="835" dy="17.25">그 고리를 따라 전기장이 생긴다</tspan><tspan x="835" dy="17.25">→ 변하는 자기장이 전기장을 만든다</tspan></text></g><g ><g class="shape"><path d="M665 620h340v114H665z" class="stroke-B1 fill-B5 s0"/></g><text x="835" y="658.5" class="text-bold fill-N1 s2"><tspan x="835" dy="0">앙페르-맥스웰 법칙</tspan><tspan x="835" dy="17.25">닫힌 고리를 감싼 전류와,</tspan><tspan x="835" dy="17.25">그 고리를 뚫는 전기다발의 변화가</tspan><tspan x="835" dy="17.25">고리를 따라 자기장을 만든다</tspan></text></g><marker id="mk-d2-2846244523-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2846244523-3488378134)" d="M780.635 499.961C736.4 547.3 736.4 571.7 779.269 617.577" class="connection stroke-B1 s0" mask="url(#d2-2846244523)"/><text x="736" y="565" class="text-italic fill-N2 s2">생긴 전기장이 변하면</text><path fill="none" marker-end="url(#mk-d2-2846244523-3488378134)" d="M889.365 619.039C933.6 571.7 933.6 547.3 890.731 501.423" class="connection stroke-B1 s0" mask="url(#d2-2846244523)"/><text x="934" y="565" class="text-italic fill-N2 s2">생긴 자기장이 변하면</text><path fill="none" marker-end="url(#mk-d2-2846244523-3488378134)" d="M835 766v114" class="connection stroke-B1 s0" mask="url(#d2-2846244523)"/><path fill="none" marker-end="url(#mk-d2-2846244523-3488378134)" d="M835 195.5v115" class="connection stroke-B1 s0" mask="url(#d2-2846244523)"/><text x="835" y="260" class="text-italic fill-N2 s2">여기까지는 각각 11장과 12장에서 이미 보았다</text><mask id="d2-2846244523" width="1297" height="1175" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1297v1175H-91z"/><path d="M644 549h184v21H644zM842 549h184v21H842zM646 244h378v21H646z"/></mask></svg>