<svg xmlns="http://www.w3.org/2000/svg" width="1112" height="2168" class="d2-3389764491 d2-svg" viewBox="-89 -89 1112 2168"><rect width="1112" height="2168" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3389764491 .fill-N1{fill:#0a0f25}.d2-3389764491 .fill-N2{fill:#676c7e}.d2-3389764491 .fill-N4{fill:#cfd2dd}.d2-3389764491 .fill-B5{fill:#edf0fd}.d2-3389764491 .fill-B6{fill:#f7f8fe}.d2-3389764491 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="522" cy="99" class="shape stroke-B1 fill-B6 s0" rx="261" ry="87"/></g><text x="522" y="104.5" class="text-bold fill-N1 s1">두 지점의 압력·속력·높이를 잇고 싶다</text></g><g ><g class="shape"><path d="M522 380h-4l-199-61c-2-1-2-2 0-2l199-61c2-1 5-1 7 0l200 60c2 1 2 2 0 2l-199 62z" class="stroke-B1 fill-N4 s0"/></g><text x="522" y="315.5" class="text-bold fill-N1 s1"><tspan x="522" dy="0">두 지점이</tspan><tspan x="522" dy="18.5">같은 유선 위에 있는가</tspan></text></g><g ><g class="shape"><path d="M411 675h-3l-178-61c-2-1-2-2 0-2l178-61c2-1 5-1 7 0l177 60c2 1 2 2 0 2l-178 62z" class="stroke-B1 fill-N4 s0"/></g><text x="411" y="610.5" class="text-bold fill-N1 s1"><tspan x="411" dy="0">흐름이 시간에 따라</tspan><tspan x="411" dy="18.5">변하지 않는가</tspan></text></g><g ><g class="shape"><path d="M321 970h-4l-216-61c-2-1-2-2 0-2l216-61c2-1 6-1 8 0l216 60c2 1 2 2 0 2l-216 62z" class="stroke-B1 fill-N4 s0"/></g><text x="321" y="905.5" class="text-bold fill-N1 s1"><tspan x="321" dy="0">점성으로 잃는 에너지를</tspan><tspan x="321" dy="18.5">무시할 만한가</tspan></text></g><g ><g class="shape"><path d="M207 1265h-3l-175-61c-2-1-2-2 0-2l175-61c2-1 5-1 7 0l174 60c2 1 2 2 0 2l-175 62z" class="stroke-B1 fill-N4 s0"/></g><text x="207" y="1200.5" class="text-bold fill-N1 s1"><tspan x="207" dy="0">밀도가 일정하다고</tspan><tspan x="207" dy="18.5">볼 수 있는가</tspan></text></g><g ><g class="shape"><path d="M12 1486h272v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="148" y="1524.5" class="text-bold fill-N1 s1"><tspan x="148" dy="0">압력과 운동에너지 밀도와</tspan><tspan x="148" dy="17.667">위치에너지 밀도의 합이</tspan><tspan x="148" dy="17.667">두 지점에서 같다</tspan></text></g><g ><g class="shape"><path d="m449 1491-90 34 90 35h179l90-35-90-34Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="538.5" y="1531" class="text-bold fill-N1 s1">베르누이 식을 쓸 수 없다</text></g><g ><g class="shape"><path d="M156 1654h766v324H156z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="539" y="1687" class="fill-N1" style="text-anchor:middle;font-size:28px">쓸 수 없는 대표적인 경우</text></g><g ><g class="shape"><path d="M216 1714h316v82H216z" class="stroke-B1 fill-B5 s0"/></g><text x="374" y="1752.5" class="text-bold fill-N1 s1"><tspan x="374" dy="0">긴 배관 —</tspan><tspan x="374" dy="18.5">점성으로 압력이 계속 떨어진다</tspan></text></g><g ><g class="shape"><path d="M216 1836h316v82H216z" class="stroke-B1 fill-B5 s0"/></g><text x="374" y="1874.5" class="text-bold fill-N1 s1"><tspan x="374" dy="0">난류·소용돌이 —</tspan><tspan x="374" dy="18.5">유선을 그릴 수 없다</tspan></text></g><g ><g class="shape"><path d="M572 1714h290v82H572z" class="stroke-B1 fill-B5 s0"/></g><text x="717" y="1752.5" class="text-bold fill-N1 s1"><tspan x="717" dy="0">펌프나 날개가 끼어든 구간 —</tspan><tspan x="717" dy="18.5">밖에서 일이 들어온다</tspan></text></g><g ><g class="shape"><path d="M572 1836h290v82H572z" class="stroke-B1 fill-B5 s0"/></g><text x="717" y="1874.5" class="text-bold fill-N1 s1"><tspan x="717" dy="0">빠르게 흐르는 기체 —</tspan><tspan x="717" dy="18.5">밀도가 변한다</tspan></text></g><marker id="mk-d2-3389764491-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3389764491-3488378134)" d="M522 188v63" class="connection stroke-B1 s0" mask="url(#d2-338