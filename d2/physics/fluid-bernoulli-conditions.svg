<svg xmlns="http://www.w3.org/2000/svg" width="2034" height="1643" class="d2-2466634850 d2-svg" viewBox="-91 -101 2034 1643"><rect width="2034" height="1643" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2466634850 .fill-N1{fill:#0a0f25}.d2-2466634850 .fill-N2{fill:#676c7e}.d2-2466634850 .fill-N4{fill:#cfd2dd}.d2-2466634850 .fill-B5{fill:#edf0fd}.d2-2466634850 .fill-B6{fill:#f7f8fe}.d2-2466634850 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="878" cy="87" class="shape stroke-B1 fill-B6 s0" rx="261" ry="87"/></g><text x="878" y="92.5" class="text-bold fill-N1 s1">두 지점의 압력·속력·높이를 잇고 싶다</text></g><g ><g class="shape"><path d="M878 366h-5l-286-45c-3 0-3-1 0-2l286-45h11l285 45c3 0 3 1 0 2l-286 45z" class="stroke-B1 fill-N4 s0"/></g><text x="878" y="325.5" class="text-bold fill-N1 s1">두 지점이 같은 유선 위에 있는가</text></g><g ><g class="shape"><path d="M703 579h-6l-302-45c-3 0-3-1 0-2l302-45h11l302 45c3 0 3 1 0 2l-301 45z" class="stroke-B1 fill-N4 s0"/></g><text x="703" y="538.5" class="text-bold fill-N1 s1">흐름이 시간에 따라 변하지 않는가</text></g><g ><g class="shape"><path d="M600 792h-6l-341-45c-4 0-4-1 0-2l341-45h13l341 45c4 0 4 1 0 2l-342 45z" class="stroke-B1 fill-N4 s0"/></g><text x="600" y="751.5" class="text-bold fill-N1 s1">점성으로 잃는 에너지를 무시할 만한가</text></g><g ><g class="shape"><path d="M504 1005h-5l-282-45c-3 0-3-1 0-2l282-45h11l281 45c3 0 3 1 0 2l-282 45z" class="stroke-B1 fill-N4 s0"/></g><text x="504" y="964.5" class="text-bold fill-N1 s1">밀도가 일정하다고 볼 수 있는가</text></g><g ><g class="shape"><path d="M157 1128h636v66H157z" class="stroke-B1 fill-B6 s0"/></g><text x="475" y="1166.5" class="text-bold fill-N1 s1">압력과 운동에너지 밀도와 위치에너지 밀도의 합이 두 지점에서 같다</text></g><g ><g class="shape"><path d="m1068 1126-90 34 90 35h179l90-35-90-34Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="1157.5" y="1166" class="text-bold fill-N1 s1">베르누이 식을 쓸 수 없다</text></g><g ><g class="shape"><path d="M10 1315h1832v126H10z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="926" y="1302" class="fill-N1" style="text-anchor:middle;font-size:28px">쓸 수 없는 대표적인 경우</text></g><g ><g class="shape"><path d="M40 1345h397v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="238.5" y="1383.5" class="text-bold fill-N1 s1">긴 배관 — 점성으로 압력이 계속 떨어진다</text></g><g ><g class="shape"><path d="M497 1345h359v66H497z" class="stroke-B1 fill-B5 s0"/></g><text x="676.5" y="1383.5" class="text-bold fill-N1 s1">난류·소용돌이 — 유선을 그릴 수 없다</text></g><g ><g class="shape"><path d="M916 1345h482v66H916z" class="stroke-B1 fill-B5 s0"/></g><text x="1157" y="1383.5" class="text-bold fill-N1 s1">펌프나 날개가 끼어든 구간 — 밖에서 일이 들어온다</text></g><g ><g class="shape"><path d="M1458 1345h354v66h-354z" class="stroke-B1 fill-B5 s0"/></g><text x="1635" y="1383.5" class="text-bold fill-N1 s1">빠르게 흐르는 기체 — 밀도가 변한다</text></g><marker id="mk-d2-2466634850-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2466634850-3488378134)" d="M878.01 176c.19 38 .19 58 .01 94" class="connection stroke-B1 s0" mask="url(#d2-2466634850)"/><path fill="none" marker-end="url(#mk-d2-2466634850-3488378134)" d="M814.297 358.05C725.8 412.6 703.2 438.6 703.017 483" class="connection stroke-B1 s0" mask="url(#d2-2466634850)"/><text x="736" y="412" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-2466634850-3488378134)" d="M661.608 575.436C612.2 626.4 599.6 651.6 599.967 696" class="connection stroke-B1 s0" mask="url(#d2-2466634850)"/><text x="611" y="634" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-2466634850-3488378134)" d="M560.666 789.49C515.799 839.6 504.2 