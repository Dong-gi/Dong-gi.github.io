<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1432" class="d2-783083621 d2-svg" viewBox="-91 -121 1400 1432"><rect width="1400" height="1432" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-783083621 .fill-N1{fill:#0a0f25}.d2-783083621 .fill-B4{fill:#e3e9fd}.d2-783083621 .fill-B5{fill:#edf0fd}.d2-783083621 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M589 20h487v126H589z" class="stroke-B1 fill-B4 s0"/></g><text x="832.5" y="7" class="fill-N1 s1">1. 물체를 하나 고른다</text></g><g ><g class="shape"><path d="M10 286h1138v126H10z" class="stroke-B1 fill-B4 s0"/></g><text x="579" y="273" class="fill-N1 s1">2. 그 물체가 받는 힘만 화살표로 그린다</text></g><g ><g class="shape"><path d="M518 552h630v126H518z" class="stroke-B1 fill-B4 s0"/></g><text x="833" y="539" class="fill-N1 s1">3. 축을 고른다</text></g><g ><g class="shape"><path d="M631 818h403v126H631z" class="stroke-B1 fill-B4 s0"/></g><text x="832.5" y="805" class="fill-N1 s1">4. 축마다 힘의 합 = 질량 × 가속도</text></g><g ><g class="shape"><path d="M457 1084h751v126H457z" class="stroke-B1 fill-B4 s0"/></g><text x="832.5" y="1071" class="fill-N1 s1">5. 미지수만큼 식을 모아 연립한다</text></g><g ><g class="shape"><path d="M619 50h427v66H619z" class="stroke-B1 fill-B5 s0"/></g><text x="832.5" y="88.5" class="text-bold fill-N1 s2">여러 물체가 얽혀 있으면 하나씩 따로 그린다</text></g><g ><g class="shape"><path d="M40 316h447v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="263.5" y="354.5" class="text-bold fill-N1 s2">받는 힘: 무게 · 수직항력 · 마찰력 · 장력 · 미는 힘</text></g><g ><g class="shape"><path d="M547 316h571v66H547z" class="stroke-B1 fill-B5 s0"/></g><text x="832.5" y="354.5" class="text-bold fill-N1 s2">그리지 않는 것: 그 물체가 남에게 주는 힘, 구심력 같은 이름표</text></g><g ><g class="shape"><path d="M548 582h570v66H548z" class="stroke-B1 fill-B5 s0"/></g><text x="833" y="620.5" class="text-bold fill-N1 s2">가속도 방향에 축 하나를 맞추면 다른 축의 가속도가 0 이 된다</text></g><g ><g class="shape"><path d="M661 848h343v66H661z" class="stroke-B1 fill-B5 s0"/></g><text x="832.5" y="886.5" class="text-bold fill-N1 s2">가속도가 0 인 축에서는 힘의 합도 0</text></g><g ><g class="shape"><path d="M487 1114h691v66H487z" class="stroke-B1 fill-B5 s0"/></g><text x="832.5" y="1152.5" class="text-bold fill-N1 s2">물체가 둘이면 식도 둘, 줄로 이어져 있으면 가속도가 같다는 조건이 하나 더</text></g><marker id="mk-d2-783083621-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-783083621-3488378134)" d="M832.5 148v93" class="connection stroke-B1 s0" mask="url(#d2-783083621)"/><path fill="none" marker-end="url(#mk-d2-783083621-3488378134)" d="M832.5 414v93" class="connection stroke-B1 s0" mask="url(#d2-783083621)"/><path fill="none" marker-end="url(#mk-d2-783083621-3488378134)" d="M832.5 680v93" class="connection stroke-B1 s0" mask="url(#d2-783083621)"/><path fill="none" marker-end="url(#mk-d2-783083621-3488378134)" d="M832.5 946v93" class="connection stroke-B1 s0" mask="url(#d2-783083621)"/><mask id="d2-783083621" width="1400" height="1432" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1400v1432H-91z"/></mask></svg>