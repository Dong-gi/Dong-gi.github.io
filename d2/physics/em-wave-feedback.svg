<svg xmlns="http://www.w3.org/2000/svg" width="1288" height="1652" class="d2-3581634003 d2-svg" viewBox="-101 -101 1288 1652"><rect width="1288" height="1652" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3581634003 .text-bold{font-weight:700}.d2-3581634003 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3581634003 .fill-N1{fill:#0a0f25}.d2-3581634003 .fill-N2{fill:#676c7e}.d2-3581634003 .fill-B5{fill:#edf0fd}.d2-3581634003 .fill-B6{fill:#f7f8fe}.d2-3581634003 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="621" cy="82.5" class="shape stroke-B1 fill-B6 s0" rx="248" ry="82.5"/></g><text x="621" y="80" class="text-bold fill-N1 s1"><tspan x="621" dy="0">전하를 흔든다</tspan><tspan x="621" dy="18.5">(안테나 속 전자를 오르내리게 한다)</tspan></text></g><g ><g class="shape"><path d="M527 265h188v66H527z" class="stroke-B1 fill-B6 s0"/></g><text x="621" y="303.5" class="text-bold fill-N1 s1">전기장이 변한다</text></g><g ><g class="shape"><path d="M326 431h360v82H326z" class="stroke-B1 fill-B6 s0"/></g><text x="506" y="469.5" class="text-bold fill-N1 s1"><tspan x="506" dy="0">그 변화가 옆자리에 자기장을 만든다</tspan><tspan x="506" dy="18.5">(앙페르-맥스웰 법칙의 둘째 항)</tspan></text></g><g ><g class="shape"><path d="M561 692h380v66H561z" class="stroke-B1 fill-B6 s0"/></g><text x="751" y="730.5" class="text-bold fill-N1 s1">만들어진 자기장도 시간에 따라 변한다</text></g><g ><g class="shape"><path d="M665 916h403v82H665z" class="stroke-B1 fill-B6 s0"/></g><text x="866.5" y="954.5" class="text-bold fill-N1 s1"><tspan x="866.5" dy="0">그 변화가 다시 옆자리에 전기장을 만든다</tspan><tspan x="866.5" dy="18.5">(패러데이 법칙)</tspan></text></g><g ><g class="shape"><path d="M646 1098h440v352H646z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="866" y="1131" class="fill-N1 s2">고리가 닫혔다</text></g><g ><g class="shape"><path d="M130 634 0 725l130 91h261l130-91-130-91Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="260.5" y="621" class="fill-N1 s2">변위전류 항이 없었다면</text></g><g ><g class="shape"><path d="M666 1144h400v82H666z" class="stroke-B1 fill-B5 s0"/></g><text x="866" y="1182.5" class="text-bold fill-N1 s1"><tspan x="866" dy="0">옆자리에서 같은 일이 되풀이되며</tspan><tspan x="866" dy="18.5">장의 무늬가 스스로 앞으로 나아간다</tspan></text></g><g ><g class="shape"><path d="M666 1246h400v82H666z" class="stroke-B1 fill-B5 s0"/></g><text x="866" y="1284.5" class="text-bold fill-N1 s1"><tspan x="866" dy="0">흔들릴 물질이 필요 없다</tspan><tspan x="866" dy="18.5">서로가 서로의 원천이기 때문이다</tspan></text></g><g ><g class="shape"><path d="M666 1348h400v82H666z" class="stroke-B1 fill-B5 s0"/></g><text x="866" y="1386.5" class="text-bold fill-N1 s1"><tspan x="866" dy="0">나아가는 속력은 두 상수만으로 정해진다</tspan><tspan x="866" dy="18.5">c = 1 / (엡실론 영 곱하기 뮤 영)의 제곱근</tspan></text></g><g ><g class="shape"><path d="M40 684h441v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="260.5" y="722.5" class="text-bold fill-N1 s1"><tspan x="260.5" dy="0">변하는 전기장이 자기장을 만들지 못한다</tspan><tspan x="260.5" dy="18.5">고리가 끊어지고 전자기파는 존재하지 않는다</tspan></text></g><marker id="mk-d2-3581634003-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3581634003-3488378134)" d="M620.99 167c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-3581634003)"/><path fill="none" marker-end="url(#mk-d2-3581634003-3488378134)" d="M573.13 332.174C519.55 371 505.75 391 505.75 427" class="connection stroke-B1 s0" mask="url(#d2-3581634003)"/><path fill="none" marker-end="url(#mk-d2-3581634003-3488378134)" d="M606.845 513.271C721.8 561.3 751 645.6 751 688" class="connection stroke-B1 s0" mask="url(#d2-3581634003)"/><path fill="none" marker-end="url(#mk-d2-35816340