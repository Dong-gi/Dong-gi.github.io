<svg xmlns="http://www.w3.org/2000/svg" width="4445" height="777" class="d2-301726576 d2-svg" viewBox="-101 -95 4445 777"><rect width="4445" height="777" x="-101" y="-95" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-301726576 .fill-N1{fill:#0a0f25}.d2-301726576 .fill-N2{fill:#676c7e}.d2-301726576 .fill-B5{fill:#edf0fd}.d2-301726576 .fill-B6{fill:#f7f8fe}.d2-301726576 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="248" cy="290.5" class="shape stroke-B1 fill-B6 s0" rx="248" ry="82.5"/></g><text x="248" y="288" class="text-bold fill-N1 s1"><tspan x="248" dy="0">전하를 흔든다</tspan><tspan x="248" dy="18.5">(안테나 속 전자를 오르내리게 한다)</tspan></text></g><g ><g class="shape"><path d="M758 258h188v66H758z" class="stroke-B1 fill-B6 s0"/></g><text x="852" y="296.5" class="text-bold fill-N1 s1">전기장이 변한다</text></g><g ><g class="shape"><path d="M1208 209h360v82h-360z" class="stroke-B1 fill-B6 s0"/></g><text x="1388" y="247.5" class="text-bold fill-N1 s1"><tspan x="1388" dy="0">그 변화가 옆자리에 자기장을 만든다</tspan><tspan x="1388" dy="18.5">(앙페르-맥스웰 법칙의 둘째 항)</tspan></text></g><g ><g class="shape"><path d="M2214 294h380v66h-380z" class="stroke-B1 fill-B6 s0"/></g><text x="2404" y="332.5" class="text-bold fill-N1 s1">만들어진 자기장도 시간에 따라 변한다</text></g><g ><g class="shape"><path d="M3017 327h403v82h-403z" class="stroke-B1 fill-B6 s0"/></g><text x="3218.5" y="365.5" class="text-bold fill-N1 s1"><tspan x="3218.5" dy="0">그 변화가 다시 옆자리에 전기장을 만든다</tspan><tspan x="3218.5" dy="18.5">(패러데이 법칙)</tspan></text></g><g ><g class="shape"><path d="M3783 155h460v426h-460z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="4013" y="142" class="fill-N1 s2">고리가 닫혔다</text></g><g ><g class="shape"><path d="m2228 46-176 81 176 81h351l176-81-176-81Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="2403.5" y="33" class="fill-N1 s2">변위전류 항이 없었다면</text></g><g ><g class="shape"><path d="M3833 185h360v82h-360z" class="stroke-B1 fill-B5 s0"/></g><text x="4013" y="223.5" class="text-bold fill-N1 s1"><tspan x="4013" dy="0">옆자리에서 같은 일이 되풀이되며</tspan><tspan x="4013" dy="18.5">장의 무늬가 스스로 앞으로 나아간다</tspan></text></g><g ><g class="shape"><path d="M3845 327h336v82h-336z" class="stroke-B1 fill-B5 s0"/></g><text x="4013" y="365.5" class="text-bold fill-N1 s1"><tspan x="4013" dy="0">흔들릴 물질이 필요 없다</tspan><tspan x="4013" dy="18.5">서로가 서로의 원천이기 때문이다</tspan></text></g><g ><g class="shape"><path d="M3813 469h400v82h-400z" class="stroke-B1 fill-B5 s0"/></g><text x="4013" y="507.5" class="text-bold fill-N1 s1"><tspan x="4013" dy="0">나아가는 속력은 두 상수만으로 정해진다</tspan><tspan x="4013" dy="18.5">c = 1 / (엡실론 영 곱하기 뮤 영)의 제곱근</tspan></text></g><g ><g class="shape"><path d="M2183 86h441v82h-441z" class="stroke-B1 fill-B5 s0"/></g><text x="2403.5" y="124.5" class="text-bold fill-N1 s1"><tspan x="2403.5" dy="0">변하는 전기장이 자기장을 만들지 못한다</tspan><tspan x="2403.5" dy="18.5">고리가 끊어지고 전자기파는 존재하지 않는다</tspan></text></g><marker id="mk-d2-301726576-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-301726576-3488378134)" d="M498 290.992c102.8-.392 155.2-.492 256-.492" class="connection stroke-B1 s0" mask="url(#d2-301726576)"/><path fill="none" marker-end="url(#mk-d2-301726576-3488378134)" d="M947.967 273.64C1050.8 254.8 1103.2 250 1204 250" class="connection stroke-B1 s0" mask="url(#d2-301726576)"/><path fill="none" marker-end="url(#mk-d2-301726576-3488378134)" d="M1569.968 283.358C1761.6 318.2 2084.3 327 2209.5 327" class="connection stroke-B1 s0" mask="url(#d2-301726576)"/><path fill="none" marker-end="url(#mk-d2-301726576-3488378134)" d="M2596.5 327c126.4 0 315.7 3.2 416.53 15.515" class="connection stroke-B1 s0" mask="url(#d2-301726576)"/><path fill="none" marker-end="url(#mk-d2-301726576-3488378134)" d="M3015.011 390.213C2912.2 401.2 2859.8 404 2820.5 404H1599c-126.6 0-553.8-16-677.427-78.202" class="connection stroke-B1 s0" mask="url(#d2-301726576)"/><text x="1960" y="410" class="text-italic fill-N2 s1">되먹임</text><path fill="none" marker-end="url(#mk-d2-301726576-3488378134)" d="M3422 367.5h357" class="connection stroke-B1 s0" mask="url(#d2-301726576)"/><path fill="none" marker-end="url(#mk-d2-301726576-3488378134)" d="M1569.968 216.642C1761.6 181.8 1878.4 173 2148 173" class="connection stroke-B1 s0" mask="url(#d2-301726576)"/><text x="1858" y="180" class="text-italic fill-N2 s1">이 화살표가 맥스웰의 보탬</text><mask id="d2-301726576" width="4445" height="777" x="-101" y="-95" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-95h4445v777H-101z"/><path d="M1929 394h62v21h-62zM1745 164h226v21h-226z"/></mask></svg>