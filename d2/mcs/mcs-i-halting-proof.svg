<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="1620" class="d2-2807376777 d2-svg" viewBox="-89 -89 1210 1620"><rect width="1210" height="1620" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2807376777 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2807376777 .fill-N1{fill:#0a0f25}.d2-2807376777 .fill-B6{fill:#f7f8fe}.d2-2807376777 .stroke-B1,.d2-2807376777 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M109 12h794v98H109z" class="stroke-B1 fill-B6 s0"/></g><text x="506" y="50.5" class="text-bold fill-N1 s1"><tspan x="506" dy="0">프로그램은 문자열로 적힌다</tspan><tspan x="506" dy="17.667">문자열 s 를 프로그램으로 읽은 것을 P(s) 라 하고,</tspan><tspan x="506" dy="17.667">프로그램으로 읽을 수 없는 s 에 대해서는 아무것도 인식하지 않는 프로그램으로 정한다</tspan></text></g><g ><g class="shape"><path d="M208 180h596v82H208z" class="stroke-B1 fill-B6 s0"/></g><text x="506" y="218.5" class="text-bold fill-N1 s1"><tspan x="506" dy="0">lang(P) ::= { s : 프로그램 P 를 s 에 돌리면 멈춘다 }</tspan><tspan x="506" dy="18.5">어떤 프로그램 P 에 대해 L = lang(P) 이면 L 을 인식 가능하다고 한다</tspan></text></g><g ><g class="shape"><path d="M285 332h442v82H285z" class="stroke-B1 fill-B6 s0"/></g><text x="506" y="370.5" class="text-bold fill-N1 s1"><tspan x="506" dy="0">안멈춤 ::= { s : P(s) 를 s 에 돌리면 멈추지 않는다 }</tspan><tspan x="506" dy="18.5">= { s : s ∉ lang(P(s)) }</tspan></text></g><g ><g class="shape"><path d="M236 484h541v82H236z" class="stroke-B1 fill-B6 s0"/></g><text x="506.5" y="522.5" class="text-bold fill-N1 s1"><tspan x="506.5" dy="0">모순을 노려, 어떤 프로그램이 안멈춤 을 인식한다고 하자.</tspan><tspan x="506.5" dy="18.5">그 프로그램의 코드를 s₀ 라 하면 안멈춤 = lang(P(s₀)) 다</tspan></text></g><g ><g class="shape"><path d="M307 636h398v98H307z" class="stroke-B1 fill-B6 s0"/></g><text x="506" y="674.5" class="text-bold fill-N1 s1"><tspan x="506" dy="0">정의에 s = s₀ 를 넣는다</tspan><tspan x="506" dy="17.667">s₀ ∈ 안멈춤 ↔ s₀ ∉ lang(P(s₀)) = s₀ ∉ 안멈춤</tspan><tspan x="506" dy="17.667">모순이다</tspan></text></g><g ><g class="shape"><ellipse cx="506.5" cy="909.5" class="shape stroke-B1 fill-B6 s0" rx="316.5" ry="105.5"/></g><text x="506.5" y="915" class="text-bold fill-N1 s1">안멈춤 은 어떤 프로그램으로도 인식할 수 없다</text></g><g ><g class="shape"><path d="M12 1095h321v114H12z" class="stroke-B1 fill-B6 s0"/></g><text x="172.5" y="1133.5" class="text-bold fill-N1 s1"><tspan x="172.5" dy="0">그냥 돌려 보면 되지 않는가?</tspan><tspan x="172.5" dy="17.25">멈추는 것은 그렇게 알 수 있다.</tspan><tspan x="172.5" dy="17.25">어려운 것은 ‘멈추지 않는다’ 를</tspan><tspan x="172.5" dy="17.25">유한한 시간에 판정하는 일이다</tspan></text></g><g ><g class="shape"><path d="M353 1095h307v162H353z" class="stroke-B1 fill-B6 s0"/></g><text x="506.5" y="1133.5" class="text-bold fill-N1 s1"><tspan x="506.5" dy="0">다른 언어로 쓰면 되지 않는가?</tspan><tspan x="506.5" dy="16.714">한 언어의 해석기를</tspan><tspan x="506.5" dy="16.714">다른 언어로 쓸 수 있으므로</tspan><tspan x="506.5" dy="16.714">C++ 로 자바의 안멈춤 을</tspan><tspan x="506.5" dy="16.714">인식할 수 있다면</tspan><tspan x="506.5" dy="16.714">자바로도 할 수 있다.</tspan><tspan x="506.5" dy="16.714">그래서 언어를 바꿔도 안 된다</tspan></text></g><g ><g class="shape"><path d="M680 1095h340v146H680z" class="stroke-B1 fill-B6 s0"/></g><text x="850" y="1133.5" class="text-bold fill-N1 s1"><tspan x="850" dy="0">실전에서는 되지 않는가?</tspan><tspan x="850" dy="16.833">임의의 프로그램에 대해</tspan><tspan x="850" dy="16.833">완벽하게는 안 된다.</tspan><tspan x="850" dy="16.833">그래서 어떤 타입 검사기도</tspan><tspan x="850" dy="16.833">문제없는 프로그램을 어쩔 수 없이</tspan><tspan x="850" dy="16.833">몇 개는 거절한다</tspan></text></g><path fill="transparent" stroke="transparent" d="M113 1277h806v153H113z" class="shape s0"/><text x="516" y="1343" class="fill-N1 s1"><tspan x="516" dy="0">이 증명은 칸토어 정리의 증명과 같은 논증이다.</tspan><tspan x="516" dy="17.667">칸토어 쪽에서 ‘a 가 g(a) 에 들어 있는가’ 를 뒤집었고,</tspan><tspan x="516" dy="17.667">여기서는 ‘s 가 lang(P(s)) 에 들어 있는가’ 를 뒤집었다. 대각선 하나가 두 정리를 낳는다</tspan></text><marker id="mk-d2-2807376777-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2807376777-3488378134)" d="M506.5 112v64" class="connection stroke-B1 s0" mask="url(#d2-2807376777)"/><path fill="none" marker-end="url(#mk-d2-2807376777-3488378134)" d="M506.5 264v64" class="connection stroke-B1 s0" mask="url(#d2-2807376777)"/><path fill="none" marker-end="url(#mk-d2-2807376777-3488378134)" d="M506.5 416v64" class="connection stroke-B1 s0" mask="url(#d2-2807376777)"/><path fill="none" marker-end="url(#mk-d2-2807376777-3488378134)" d="M506.5 568v64" class="connection stroke-B1 s0" mask="url(#d2-2807376777)"/><path fill="none" marker-end="url(#mk-d2-2807376777-3488378134)" d="m506.514 736 .457 64" class="connection stroke-B1 s0" mask="url(#d2-2807376777)"/><marker id="mk-d2-2807376777-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2807376777-2177206569)" d="m348.01 1003 .194 42s.046 10-9.954 10H182.5s-10 0-10 10v26" class="connection stroke-B2 s3" mask="url(#d2-2807376777)"/><path fill="none" marker-end="url(#mk-d2-2807376777-2177206569)" d="m506.975 1017-.925 74" class="connection stroke-B2 s3" mask="url(#d2-2807376777)"/><path fill="none" marker-end="url(#mk-d2-2807376777-2177206569)" d="m664.99 1003-.194 42s-.046 10 9.954 10H840s10 0 10 10v26" class="connection stroke-B2 s3" mask="url(#d2-2807376777)"/><mask id="d2-2807376777" width="1210" height="1620" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1210v1620H-89z"/></mask></svg>