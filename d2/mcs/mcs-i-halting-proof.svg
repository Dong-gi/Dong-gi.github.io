<svg xmlns="http://www.w3.org/2000/svg" width="1846" height="1569" class="d2-1487284569 d2-svg" viewBox="-101 -101 1846 1569"><rect width="1846" height="1569" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1487284569 .fill-N1{fill:#0a0f25}.d2-1487284569 .fill-B6{fill:#f7f8fe}.d2-1487284569 .stroke-B1,.d2-1487284569 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M84 0h794v98H84z" class="stroke-B1 fill-B6 s0"/></g><text x="481" y="38.5" class="text-bold fill-N1 s1"><tspan x="481" dy="0">프로그램은 문자열로 적힌다</tspan><tspan x="481" dy="17.667">문자열 s 를 프로그램으로 읽은 것을 P(s) 라 하고,</tspan><tspan x="481" dy="17.667">프로그램으로 읽을 수 없는 s 에 대해서는 아무것도 인식하지 않는 프로그램으로 정한다</tspan></text></g><g ><g class="shape"><path d="M183 198h596v82H183z" class="stroke-B1 fill-B6 s0"/></g><text x="481" y="236.5" class="text-bold fill-N1 s1"><tspan x="481" dy="0">lang(P) ::= { s : 프로그램 P 를 s 에 돌리면 멈춘다 }</tspan><tspan x="481" dy="18.5">어떤 프로그램 P 에 대해 L = lang(P) 이면 L 을 인식 가능하다고 한다</tspan></text></g><g ><g class="shape"><path d="M260 380h442v82H260z" class="stroke-B1 fill-B6 s0"/></g><text x="481" y="418.5" class="text-bold fill-N1 s1"><tspan x="481" dy="0">안멈춤 ::= { s : P(s) 를 s 에 돌리면 멈추지 않는다 }</tspan><tspan x="481" dy="18.5">= { s : s ∉ lang(P(s)) }</tspan></text></g><g ><g class="shape"><path d="M211 562h541v82H211z" class="stroke-B1 fill-B6 s0"/></g><text x="481.5" y="600.5" class="text-bold fill-N1 s1"><tspan x="481.5" dy="0">모순을 노려, 어떤 프로그램이 안멈춤 을 인식한다고 하자.</tspan><tspan x="481.5" dy="18.5">그 프로그램의 코드를 s₀ 라 하면 안멈춤 = lang(P(s₀)) 다</tspan></text></g><g ><g class="shape"><path d="M282 744h398v98H282z" class="stroke-B1 fill-B6 s0"/></g><text x="481" y="782.5" class="text-bold fill-N1 s1"><tspan x="481" dy="0">정의에 s = s₀ 를 넣는다</tspan><tspan x="481" dy="17.667">s₀ ∈ 안멈춤 ↔ s₀ ∉ lang(P(s₀)) = s₀ ∉ 안멈춤</tspan><tspan x="481" dy="17.667">모순이다</tspan></text></g><g ><g class="shape"><ellipse cx="481.5" cy="1047.5" class="shape stroke-B1 fill-B6 s0" rx="316.5" ry="105.5"/></g><text x="481.5" y="1053" class="text-bold fill-N1 s1">안멈춤 은 어떤 프로그램으로도 인식할 수 없다</text></g><g ><g class="shape"><path d="M0 1253h321v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="160.5" y="1291.5" class="text-bold fill-N1 s1"><tspan x="160.5" dy="0">그냥 돌려 보면 되지 않는가?</tspan><tspan x="160.5" dy="17.25">멈추는 것은 그렇게 알 수 있다.</tspan><tspan x="160.5" dy="17.25">어려운 것은 ‘멈추지 않는다’ 를</tspan><tspan x="160.5" dy="17.25">유한한 시간에 판정하는 일이다</tspan></text></g><g ><g class="shape"><path d="M381 1253h479v114H381z" class="stroke-B1 fill-B6 s0"/></g><text x="620.5" y="1291.5" class="text-bold fill-N1 s1"><tspan x="620.5" dy="0">다른 언어로 쓰면 되지 않는가?</tspan><tspan x="620.5" dy="17.25">한 언어의 해석기를 다른 언어로 쓸 수 있으므로</tspan><tspan x="620.5" dy="17.25">C++ 로 자바의 안멈춤 을 인식할 수 있다면</tspan><tspan x="620.5" dy="17.25">자바로도 할 수 있다. 그래서 언어를 바꿔도 안 된다</tspan></text></g><g ><g class="shape"><path d="M920 1253h464v114H920z" class="stroke-B1 fill-B6 s0"/></g><text x="1152" y="1291.5" class="text-bold fill-N1 s1"><tspan x="1152" dy="0">실전에서는 되지 않는가?</tspan><tspan x="1152" dy="17.25">임의의 프로그램에 대해 완벽하게는 안 된다.</tspan><tspan x="1152" dy="17.25">그래서 어떤 타입 검사기도 문제없는 프로그램을</tspan><tspan x="1152" dy="17.25">어쩔 수 없이 몇 개는 거절한다</tspan></text></g><text x="1291" y="39" class="fill-N1 s1"><tspan x="1291" dy="0">이 증명은 칸토어 정리의 증명과 같은 논증이다.</tspan><tspan x="1291" dy="17.667">칸토어 쪽에서 ‘a 가 g(a) 에 들어 있는가’ 를 뒤집었고,</tspan><tspan x="1291" dy="17.667">여기서는 ‘s 가 lang(P(s)) 에 들어 있는가’ 를 뒤집었다. 대각선 하나가 두 정리를 낳는다</tspan></text><marker id="mk-d2-1487284569-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1487284569-3488378134)" d="M481.25 100v94" class="connection stroke-B1 s0" mask="url(#d2-1487284569)"/><path fill="none" marker-end="url(#mk-d2-1487284569-3488378134)" d="M481.25 282v94" class="connection stroke-B1 s0" mask="url(#d2-1487284569)"/><path fill="none" marker-end="url(#mk-d2-1487284569-3488378134)" d="M481.25 464v94" class="connection stroke-B1 s0" mask="url(#d2-1487284569)"/><path fill="none" marker-end="url(#mk-d2-1487284569-3488378134)" d="M481.25 646v94" class="connection stroke-B1 s0" mask="url(#d2-1487284569)"/><path fill="none" marker-end="url(#mk-d2-1487284569-3488378134)" d="M481.25 844c0 38-.05 58-.23 94" class="connection stroke-B1 s0" mask="url(#d2-1487284569)"/><marker id="mk-d2-1487284569-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1487284569-2177206569)" d="M300.202 1134.877C188.8 1189.2 160.5 1213 160.5 1249" class="connection stroke-B2 s3" mask="url(#d2-1487284569)"/><path fill="none" marker-end="url(#mk-d2-1487284569-2177206569)" d="M573.336 1150.488C610.8 1192.2 620.5 1213 620.5 1249" class="connection stroke-B2 s3" mask="url(#d2-1487284569)"/><path fill="none" marker-end="url(#mk-d2-1487284569-2177206569)" d="M742.949 1108.45C1069.8 1184 1152 1213 1152 1249" class="connection stroke-B2 s3" mask="url(#d2-1487284569)"/><mask id="d2-1487284569" width="1846" height="1569" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1846v1569H-101z"/></mask></svg>