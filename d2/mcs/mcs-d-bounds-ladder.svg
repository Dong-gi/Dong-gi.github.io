<svg xmlns="http://www.w3.org/2000/svg" width="5122" height="1012" class="d2-2015959677 d2-svg" viewBox="-5 -85 5122 1012"><rect width="5122" height="1012" x="-5" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2015959677 .fill-N1{fill:#0a0f25}.d2-2015959677 .fill-N2{fill:#676c7e}.d2-2015959677 .fill-B4{fill:#e3e9fd}.d2-2015959677 .fill-B5{fill:#edf0fd}.d2-2015959677 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M96 645h1598v181H96z" class="stroke-B1 fill-B4 s0"/></g><text x="895" y="632" class="text-bold fill-N1 s1">확률변수 R 에 대해 아는 것</text></g><g ><g class="shape"><path d="M716 118h1813v402H716z" class="stroke-B1 fill-B4 s0"/></g><text x="1622.5" y="105" class="text-bold fill-N1 s1">그래서 쓸 수 있는 한계</text></g><g ><g class="shape"><path d="M3326 56h223v378h-223z" class="stroke-B1 fill-B4 s0"/></g><text x="3437.5" y="43" class="text-bold fill-N1 s1">떨어지는 속도</text></g><text x="3437.5" y="500" class="fill-N1 s2"><tspan x="3437.5" dy="0">세 한계가 모두 마르코프 하나에서 나온다. 요령은 R 에 함수를 씌우고 그 함수에 마르코프를 쓰는 것이다.</tspan><tspan x="3437.5" dy="17.667">제곱을 씌우면 체비쇼프가 되고 지수를 씌우면 체르노프가 된다. 지수를 씌울 수 있는 것은 곱의 기댓값을</tspan><tspan x="3437.5" dy="17.667">쪼갤 수 있을 때뿐이고, 그래서 체르노프만 상호 독립을 요구한다.</tspan></text><text x="4633" y="369" class="fill-N1 s2"><tspan x="4633" dy="0">마르코프와 체르노프는 위쪽 꼬리만 잡는다(체르노프는 n − R 에 다시 써서 아래쪽도 잡는다).</tspan><tspan x="4633" dy="18.5">체비쇼프는 절댓값이므로 양쪽을 함께 잡는다. 어느 쪽을 묻는지 확인하고 골라야 한다.</tspan></text><g ><g class="shape"><path d="M126 675h183v82H126z" class="stroke-B1 fill-B5 s0"/></g><text x="217.5" y="713.5" class="text-bold fill-N1 s2"><tspan x="217.5" dy="0">① 기댓값 Ex[R] 과</tspan><tspan x="217.5" dy="18.5">R ≥ 0</tspan></text></g><g ><g class="shape"><path d="M769 690h142v82H769z" class="stroke-B1 fill-B5 s0"/></g><text x="840" y="728.5" class="text-bold fill-N1 s2"><tspan x="840" dy="0">② 위에 더해</tspan><tspan x="840" dy="18.5">분산 Var[R]</tspan></text></g><g ><g class="shape"><path d="M1396 698h268v98h-268z" class="stroke-B1 fill-B5 s0"/></g><text x="1530" y="736.5" class="text-bold fill-N1 s2"><tspan x="1530" dy="0">③ 위에 더해</tspan><tspan x="1530" dy="17.667">R = T₁ + ⋯ + Tₙ 이고</tspan><tspan x="1530" dy="17.667">각 Tᵢ ∈ [0,1] 이며 상호 독립</tspan></text></g><g ><g class="shape"><path d="M746 148h188v98H746z" class="stroke-B1 fill-B5 s0"/></g><text x="840" y="186.5" class="text-bold fill-N1 s2"><tspan x="840" dy="0">마르코프</tspan><tspan x="840" dy="17.667">Pr[R ≥ x] ≤ Ex[R]/x</tspan><tspan x="840" dy="17.667">Pr[R ≥ c·Ex[R]] ≤ 1/c</tspan></text></g><g ><g class="shape"><path d="M1417 211h226v98h-226z" class="stroke-B1 fill-B5 s0"/></g><text x="1530" y="249.5" class="text-bold fill-N1 s2"><tspan x="1530" dy="0">체비쇼프</tspan><tspan x="1530" dy="17.667">Pr[|R − μ| ≥ x] ≤ Var[R]/x²</tspan><tspan x="1530" dy="17.667">Pr[|R − μ| ≥ cσ] ≤ 1/c²</tspan></text></g><g ><g class="shape"><path d="M2222 392h277v98h-277z" class="stroke-B1 fill-B5 s0"/></g><text x="2360.5" y="430.5" class="text-bold fill-N1 s2"><tspan x="2360.5" dy="0">체르노프</tspan><tspan x="2360.5" dy="17.667">Pr[R ≥ c·Ex[R]] ≤ e^(−β(c)·Ex[R])</tspan><tspan x="2360.5" dy="17.667">β(c) = c ln c − c + 1</tspan></text></g><g ><g class="shape"><path d="M3366 86h143v66h-143z" class="stroke-B1 fill-B5 s0"/></g><text x="3437.5" y="124.5" class="text-bold fill-N1 s2">1/c — 다항식</text></g><g ><g class="shape"><path d="M3363 212h149v66h-149z" class="stroke-B1 fill-B5 s0"/></g><text x="3437.5" y="250.5" class="text-bold fill-N1 s2">1/c² — 다항식</text></g><g ><g class="shape"><path d="M3356 338h163v66h-163z" class="stroke-B1 fill-B5 s0"/></g><text x="3437.5" y="376.5" class="text-bold fill-N1 s2">e^(−βμ) — 지수</text></g><marker id="mk-d2-2015959677-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M311.496 721.76c122.004 7.567 338.804 9.49 454.004 9.49" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><text x="539.5" y="736" class="text-italic fill-N2 s2">더 안다</text><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M912.998 734.594C1114.2 744.1 1211.2 746.5 1392 746.5" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><text x="1153.5" y="751" class="text-italic fill-N2 s2">더 안다</text><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M935.963 215.632C1118.8 251.25 1215.4 260.25 1413 260.25" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><text x="1173.5" y="262" class="text-italic fill-N2 s2">|R − μ|² 에 마르코프를 쓴다</text><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M1644.443 287.726c115.657 28.324 404.256 49.842 573.26 105.859" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><text x="1934.5" y="335" class="text-italic fill-N2 s2">cᴿ 에 마르코프를 쓴다</text><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M311.48 702.967C433.5 685.85 659.492 594.45 813.824 249.901" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M912.989 723.539c201.211-21.389 315.85-104.289 568.667-411.202" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M1665.5 746.5c98.8 0 383.199-244.5 552.075-277.728" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M935.944 174.529C1118.8 130.199 1238 119 1347.5 119h2014" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M1644.496 253.878C1760.1 246.8 1832.7 245 1897.5 245h1461" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M2501.433 403.642C2599.1 377.631 2649.1 371 2686.75 371h664.75" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M2501.433 477.857C2599.1 503.868 2649.1 510.5 2686.75 510.5h309.75" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><path fill="none" marker-end="url(#mk-d2-2015959677-3488378134)" d="M3521.5 371h725" class="connection stroke-B1 s0" mask="url(#d2-2015959677)"/><mask id="d2-2015959677" width="5122" height="1012" x="-5" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-5-85h5122V927H-5z"/><path d="M507 720h65v21h-65zM1121 735h65v21h-65zM1066 246h215v21h-215zM1842 319h185v21h-185z"/></mask></svg>