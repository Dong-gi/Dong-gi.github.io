<svg xmlns="http://www.w3.org/2000/svg" width="1352" height="1081" class="d2-1678484215 d2-svg" viewBox="-101 -101 1352 1081"><rect width="1352" height="1081" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1678484215 .fill-N1{fill:#0a0f25}.d2-1678484215 .fill-N2{fill:#676c7e}.d2-1678484215 .fill-B5{fill:#edf0fd}.d2-1678484215 .fill-B6{fill:#f7f8fe}.d2-1678484215 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:24px}</style><path fill="transparent" stroke="transparent" d="M0 0h1150v694H0z" class="shape s0"/><text x="314" y="810" class="fill-N1 s1"><tspan x="314" dy="0">세 한계가 모두 마르코프 하나에서 나온다.</tspan><tspan x="314" dy="17">요령은 R 에 함수를 씌우고 그 함수에 마르코프를 쓰는 것이다.</tspan><tspan x="314" dy="17">제곱을 씌우면 체비쇼프가 되고 지수를 씌우면 체르노프가 된다.</tspan><tspan x="314" dy="17">지수를 씌울 수 있는 것은 곱의 기댓값을 쪼갤 수 있을 때뿐이고,</tspan><tspan x="314" dy="17">그래서 체르노프만 상호 독립을 요구한다.</tspan></text><text x="836" y="818" class="fill-N1 s1"><tspan x="836" dy="0">마르코프와 체르노프는 위쪽 꼬리만 잡는다</tspan><tspan x="836" dy="17.25">(체르노프는 밑을 1/c 로 바꿔 아래쪽도 잡는다).</tspan><tspan x="836" dy="17.25">체비쇼프는 절댓값이므로 양쪽을 함께 잡는다.</tspan><tspan x="836" dy="17.25">어느 쪽을 묻는지 확인하고 골라야 한다.</tspan></text><g ><g class="shape"><path d="M60 60h350v574H60z" class="stroke-B1 fill-B5 s0"/></g><text x="235" y="89" class="text-bold fill-N1 s2">확률변수 R 에 대해 아는 것</text></g><g ><g class="shape"><path d="M470 60h337v574H470z" class="stroke-B1 fill-B5 s0"/></g><text x="638.5" y="89" class="text-bold fill-N1 s2">그래서 쓸 수 있는 한계</text></g><g ><g class="shape"><path d="M867 60h223v574H867z" class="stroke-B1 fill-B5 s0"/></g><text x="978.5" y="89" class="text-bold fill-N1 s2">떨어지는 속도</text></g><g ><g class="shape"><path d="M101 130h268v82H101z" class="stroke-B1 fill-B6 s0"/></g><text x="235" y="168.5" class="text-bold fill-N1 s1"><tspan x="235" dy="0">① 기댓값 Ex[R] 과</tspan><tspan x="235" dy="18.5">R ≥ 0</tspan></text></g><g ><g class="shape"><path d="M101 282h268v82H101z" class="stroke-B1 fill-B6 s0"/></g><text x="235" y="320.5" class="text-bold fill-N1 s1"><tspan x="235" dy="0">② 위에 더해</tspan><tspan x="235" dy="18.5">분산 Var[R]</tspan></text></g><g ><g class="shape"><path d="M101 434h268v98H101z" class="stroke-B1 fill-B6 s0"/></g><text x="235" y="472.5" class="text-bold fill-N1 s1"><tspan x="235" dy="0">③ 위에 더해</tspan><tspan x="235" dy="17.667">R = T₁ + ⋯ + Tₙ 이고</tspan><tspan x="235" dy="17.667">각 Tᵢ ∈ [0,1] 이며 상호 독립</tspan></text></g><g ><g class="shape"><path d="M500 130h277v98H500z" class="stroke-B1 fill-B6 s0"/></g><text x="638.5" y="168.5" class="text-bold fill-N1 s1"><tspan x="638.5" dy="0">마르코프</tspan><tspan x="638.5" dy="17.667">Pr[R ≥ x] ≤ Ex[R]/x</tspan><tspan x="638.5" dy="17.667">Pr[R ≥ c·Ex[R]] ≤ 1/c</tspan></text></g><g ><g class="shape"><path d="M500 298h277v98H500z" class="stroke-B1 fill-B6 s0"/></g><text x="638.5" y="336.5" class="text-bold fill-N1 s1"><tspan x="638.5" dy="0">체비쇼프</tspan><tspan x="638.5" dy="17.667">Pr[|R − μ| ≥ x] ≤ Var[R]/x²</tspan><tspan x="638.5" dy="17.667">Pr[|R − μ| ≥ cσ] ≤ 1/c²</tspan></text></g><g ><g class="shape"><path d="M500 466h277v98H500z" class="stroke-B1 fill-B6 s0"/></g><text x="638.5" y="504.5" class="text-bold fill-N1 s1"><tspan x="638.5" dy="0">체르노프</tspan><tspan x="638.5" dy="17.667">Pr[R ≥ c·Ex[R]] ≤ e^(−β(c)·Ex[R])</tspan><tspan x="638.5" dy="17.667">β(c) = c ln c − c + 1</tspan></text></g><g ><g class="shape"><path d="M897 130h163v66H897z" class="stroke-B1 fill-B6 s0"/></g><text x="978.5" y="168.5" class="text-bold fill-N1 s1">1/c — 다항식</text></g><g ><g class="shape"><path d="M897 266h163v66H897z" class="stroke-B1 fill-B6 s0"/></g><text x="978.5" y="304.5" class="text-bold fill-N1 s1">1/c² — 다항식</text></g><g ><g class="shape"><path d="M897 402h163v66H897z" class="stroke-B1 fill-B6 s0"/></g><text x="978.5" y="440.5" class="text-bold fill-N1 s1">e^(−βμ) — 지수</text></g><marker id="mk-d2-1678484215-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="M235 214v64" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><text x="235.5" y="253" class="text-italic fill-N2 s1">더 안다</text><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="M235 366v64" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><text x="235.5" y="405" class="text-italic fill-N2 s1">더 안다</text><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="M638.5 230v64" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><text x="638.5" y="269" class="text-italic fill-N2 s1">|R − μ|² 에 마르코프를 쓴다</text><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="M638.5 398v64" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><text x="638.5" y="437" class="text-italic fill-N2 s1">cᴿ 에 마르코프를 쓴다</text><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="m370.5 174.03 126 1.91" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="m370.496 331.121 126.011 7.637" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="m370.494 494.151 126.017 9.547" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="m778.498 171.917 115.005-4.752" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="m778.48 326.722 115.059-16.165" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="m778.449 481.55 115.154-26.648" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="M587.583 564.911 359.835 791.678" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><path fill="none" marker-end="url(#mk-d2-1678484215-3488378134)" d="M966.33 469.385 849.34 798.73" class="connection stroke-B1 s0" mask="url(#d2-1678484215)"/><mask id="d2-1678484215" width="1352" height="1081" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1352V980H-101z"/><path d="M203 237h65v21h-65zM203 389h65v21h-65zM531 253h215v21H531zM546 421h185v21H546z"/></mask></svg>