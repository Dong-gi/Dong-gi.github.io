<svg xmlns="http://www.w3.org/2000/svg" width="1505" height="692" class="d2-3422533589 d2-svg" viewBox="-101 -101 1505 692"><rect width="1505" height="692" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3422533589 .fill-N1{fill:#0a0f25}.d2-3422533589 .fill-B6{fill:#f7f8fe}.d2-3422533589 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M333 0h165v98H333z" class="stroke-B1 fill-B6 s0"/></g><text x="415.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="415.5" dy="0">보통 귀납법</tspan><tspan x="415.5" dy="17.667">가정: P(n) 하나</tspan><tspan x="415.5" dy="17.667">목표: P(n+1)</tspan></text></g><g ><g class="shape"><path d="M286 166h258v98H286z" class="stroke-B1 fill-B6 s0"/></g><text x="415" y="204.5" class="text-bold fill-N1 s1"><tspan x="415" dy="0">강한 귀납법</tspan><tspan x="415" dy="17.667">가정: P(0), P(1), …, P(n) 전부</tspan><tspan x="415" dy="17.667">목표: P(n+1)</tspan></text></g><g ><g class="shape"><path d="M930 0h373v98H930z" class="stroke-B1 fill-B6 s0"/></g><text x="1116.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1116.5" dy="0">고를 자리</tspan><tspan x="1116.5" dy="17.667">n+1 의 값이 n 의 값에서 바로 나오는 것</tspan><tspan x="1116.5" dy="17.667">합의 공식, 등비급수, 회로의 게이트 수</tspan></text></g><g ><g class="shape"><path d="M942 158h349v114H942z" class="stroke-B1 fill-B6 s0"/></g><text x="1116.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="1116.5" dy="0">고를 자리</tspan><tspan x="1116.5" dy="17.25">n+1 에서 어디로 내려갈지 모르는 것</tspan><tspan x="1116.5" dy="17.25">n+1 = k·m 으로 쪼개기, n−2 를 쓰기,</tspan><tspan x="1116.5" dy="17.25">상자를 a 와 b 로 나누기</tspan></text></g><text x="415" y="340" class="fill-N1 s1"><tspan x="415" dy="0">강한 귀납법이 정말 더 센가: 아니다.</tspan><tspan x="415" dy="17.667">강한 귀납법 증명의 가설 P(n) 을 Q(n) ::= ∀k ≤ n. P(k) 로 바꿔 적으면</tspan><tspan x="415" dy="17.667">그대로 보통 귀납법 증명이 된다. 기계적인 치환이다</tspan></text><text x="415" y="453" class="fill-N1 s1"><tspan x="415" dy="0">그런데도 둘을 구별해 쓰는 이유는 독자를 위해서다.</tspan><tspan x="415" dy="17.667">‘강한 귀납법으로 증명한다’ 는 한마디가 ‘n+1 의 논증이 n 하나에서 나오지 않는다’ 는 신호를 준다.</tspan><tspan x="415" dy="17.667">증명의 첫 줄에 어느 쪽인지 밝혀라</tspan></text><marker id="mk-d2-3422533589-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3422533589-3488378134)" d="M500 49h426" class="connection stroke-B1 s0" mask="url(#d2-3422533589)"/><path fill="none" marker-end="url(#mk-d2-3422533589-3488378134)" d="M546 215h392" class="connection stroke-B1 s0" mask="url(#d2-3422533589)"/><mask id="d2-3422533589" width="1505" height="692" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1505v692H-101z"/></mask></svg>