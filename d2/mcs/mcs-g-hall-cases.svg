<svg xmlns="http://www.w3.org/2000/svg" width="1474" height="1592" class="d2-693062254 d2-svg" viewBox="-279 -101 1474 1592"><rect width="1474" height="1592" x="-279" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-693062254 .fill-N1{fill:#0a0f25}.d2-693062254 .fill-N2{fill:#676c7e}.d2-693062254 .fill-B4{fill:#e3e9fd}.d2-693062254 .fill-B5{fill:#edf0fd}.d2-693062254 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M250 0h494v82H250z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="497" y="38.5" class="text-bold fill-N1 s0"><tspan x="497" dy="0">지원자 m+1 명. 어떤 부분집합 S 를 골라도 |N(S)| ≥ |S| 다</tspan><tspan x="497" dy="18.5">(병목이 하나도 없다)</tspan></text></g><g ><g class="shape"><path d="M497 306h-7l-360-61c-4-1-4-2 0-2l360-61c4-1 10-1 13 0l360 60c4 1 4 2 0 2l-359 62z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="497" y="241.5" class="text-bold fill-N1 s0"><tspan x="497" dy="0">크기 m 이하인 공집합 아닌 부분집합 중에</tspan><tspan x="497" dy="18.5">원소 수와 이웃 수가 똑같은 것이 있는가</tspan></text></g><g ><g class="shape"><path d="M10 679h480v538H10z" class="stroke-B1 fill-B4 s1"/></g><text x="250" y="666" class="text-bold fill-N1 s2">경우 1 — 없다. 모든 부분집합이 자기보다 큰 이웃을 갖는다</text></g><g ><g class="shape"><path d="M530 447h426v770H530z" class="stroke-B1 fill-B4 s1"/></g><text x="743" y="434" class="text-bold fill-N1 s2">경우 2 — 있다. 크기 k ≤ m 인 X 와 |N(X)| = k 인 Y = N(X)</text></g><text x="497" y="1353" class="text-bold fill-N1 s0"><tspan x="497" dy="0">두 경우 모두 m+1 명의 매칭을 얻었다.</tspan><tspan x="497" dy="17.667">경우 2 에서 크기가 k 와 m+1−k 인 두 문제로 쪼개지므로</tspan><tspan x="497" dy="17.667">보통 귀납법이 아니라 강한 귀납법이 필요하다</tspan></text><g ><g class="shape"><path d="M87 709h326v98H87z" class="stroke-B1 fill-B5 s1"/></g><text x="250" y="747.5" class="text-bold fill-N1 s0"><tspan x="250" dy="0">지원자 아무나 한 명과</tspan><tspan x="250" dy="17.667">그가 할 수 있는 일 하나를 짝지어</tspan><tspan x="250" dy="17.667">둘을 함께 빼낸다</tspan></text></g><g ><g class="shape"><path d="M40 907h420v114H40z" class="stroke-B1 fill-B5 s1"/></g><text x="250" y="945.5" class="text-bold fill-N1 s0"><tspan x="250" dy="0">남은 지원자 m 명에 대해</tspan><tspan x="250" dy="17.25">어떤 부분집합의 이웃도 하나만 줄어드는데</tspan><tspan x="250" dy="17.25">원래 여유가 하나 이상 있었으므로</tspan><tspan x="250" dy="17.25">병목이 새로 생기지 않는다</tspan></text></g><g ><g class="shape"><path d="M94 1121h313v66H94z" class="stroke-B1 fill-B5 s1"/></g><text x="250.5" y="1159.5" class="text-bold fill-N1 s0">귀납 가정으로 m 명을 짝지운다</text></g><g ><g class="shape"><path d="M582 477h323v82H582z" class="stroke-B1 fill-B5 s1"/></g><text x="743.5" y="515.5" class="text-bold fill-N1 s0"><tspan x="743.5" dy="0">X 안에서도 병목이 없으므로</tspan><tspan x="743.5" dy="18.5">귀납 가정으로 X 를 Y 에 짝지운다</tspan></text></g><g ><g class="shape"><path d="M577 717h332v82H577z" class="stroke-B1 fill-B5 s1"/></g><text x="743" y="755.5" class="text-bold fill-N1 s0"><tspan x="743" dy="0">남은 문제는 지원자 X 밖 사람들을</tspan><tspan x="743" dy="18.5">일자리 Y 밖 것들에 짝짓는 것</tspan></text></g><g ><g class="shape"><path d="M560 915h366v98H560z" class="stroke-B1 fill-B5 s1"/></g><text x="743" y="953.5" class="text-bold fill-N1 s0"><tspan x="743" dy="0">여기에도 병목이 없다 —</tspan><tspan x="743" dy="17.667">X 밖의 M&apos; 이 Y 밖에서 부족했다면</tspan><tspan x="743" dy="17.667">M&apos; ∪ X 가 원래 그래프에서 병목이 된다</tspan></text></g><g ><g class="shape"><path d="M575 1121h336v66H575z" class="stroke-B1 fill-B5 s1"/></g><text x="743" y="1159.5" class="text-bold fill-N1 s0">귀납 가정으로 나머지를 짝지운다</text></g><marker id="mk-d2-693062254-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-693062254-3488378134)" d="M496.5 84c0 38 .1 57.8.46 93" class="connection stroke-B1 s1" mask="url(#d2-693062254)"/><path fill="none" marker-end="url(#mk-d2-693062254-3488378134)" d="M250 809v94" class="connection stroke-B1 s1" mask="url(#d2-693062254)"/><path fill="none" marker-end="url(#mk-d2-693062254-3488378134)" d="M250 1023v94" class="connection stroke-B1 s1" mask="url(#d2-693062254)"/><path fill="none" marker-end="url(#mk-d2-693062254-3488378134)" d="M743 561v152" class="connection stroke-B1 s1" mask="url(#d2-693062254)"/><path fill="none" marker-end="url(#mk-d2-693062254-3488378134)" d="M743 801v110" class="connection stroke-B1 s1" mask="url(#d2-693062254)"/><path fill="none" marker-end="url(#mk-d2-693062254-3488378134)" d="M743 1015v102" class="connection stroke-B1 s1" mask="url(#d2-693062254)"/><path fill="none" marker-end="url(#mk-d2-693062254-3488378134)" d="M399.211 291.894C280.2 351.4 250 378.6 250 396.75V705" class="connection stroke-B1 s1" mask="url(#d2-693062254)"/><text x="250" y="461" class="text-italic fill-N2 s0">여유가 있다</text><path fill="none" marker-end="url(#mk-d2-693062254-3488378134)" d="M593.789 291.894C712.8 351.4 743 437 743 473" class="connection stroke-B1 s1" mask="url(#d2-693062254)"/><text x="711" y="356" class="text-italic fill-N2 s0">꽉 찬 덩어리가 있다</text><path fill="none" marker-end="url(#mk-d2-693062254-3488378134)" d="M250 1189c0 38 32.2 108 157.18 146.814" class="connection stroke-B1 s1" mask="url(#d2-693062254)"/><path fill="none" marker-end="url(#mk-d2-693062254-3488378134)" d="M743 1189c0 38-32.2 108-157.18 146.814" class="connection stroke-B1 s1" mask="url(#d2-693062254)"/><mask id="d2-693062254" width="1474" height="1592" x="-279" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-279-101h1474v1592H-279z"/><path d="M198 445h104v21H198zM627 340h168v21H627z"/></mask></svg>