<svg xmlns="http://www.w3.org/2000/svg" width="1131" height="1557" class="d2-2657895880 d2-svg" viewBox="-89 -89 1131 1557"><rect width="1131" height="1557" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2657895880 .text-bold{font-weight:700}.d2-2657895880 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2657895880 .fill-N1{fill:#0a0f25}.d2-2657895880 .fill-N2{fill:#676c7e}.d2-2657895880 .fill-B4{fill:#e3e9fd}.d2-2657895880 .fill-B5{fill:#edf0fd}.d2-2657895880 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M110 12h368v98H110z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="294" y="50.5" class="text-bold fill-N1 s0"><tspan x="294" dy="0">지원자 m+1 명.</tspan><tspan x="294" dy="17.667">어떤 부분집합 S 를 골라도 |N(S)| ≥ |S| 다</tspan><tspan x="294" dy="17.667">(병목이 하나도 없다)</tspan></text></g><g ><g class="shape"><path d="M294 368c-2 0-3 0-4-1L50 276c-3-1-3-2 0-3l240-92c3-1 6-1 9 0l240 92c3 1 3 2 0 3l-241 91c-1 1-2 1-4 1Z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="294" y="255.5" class="text-bold fill-N1 s0"><tspan x="294" dy="0">크기 m 이하인</tspan><tspan x="294" dy="17.25">공집합 아닌 부분집합 중에</tspan><tspan x="294" dy="17.25">원소 수와 이웃 수가</tspan><tspan x="294" dy="17.25">똑같은 것이 있는가</tspan></text></g><g ><g class="shape"><path d="M12 593h443v586H12z" class="stroke-B1 fill-B4 s1"/></g><text x="233.5" y="626" class="text-bold fill-N1 s2"><tspan x="233.5" dy="0">경우 1 — 없다.</tspan><tspan x="233.5" dy="30.667">모든 부분집합이</tspan><tspan x="233.5" dy="30.667">자기보다 큰 이웃을 갖는다</tspan></text></g><g ><g class="shape"><path d="M475 539h466v690H475z" class="stroke-B1 fill-B4 s1"/></g><text x="708" y="572" class="text-bold fill-N1 s2"><tspan x="708" dy="0">경우 2 — 있다.</tspan><tspan x="708" dy="30.667">크기 k ≤ m 인 X 와</tspan><tspan x="708" dy="30.667">|N(X)| = k 인 Y = N(X)</tspan></text></g><text x="470" y="1330" class="text-bold fill-N1 s0"><tspan x="470" dy="0">두 경우 모두 m+1 명의 매칭을 얻었다.</tspan><tspan x="470" dy="17.667">경우 2 에서 크기가 k 와 m+1−k 인 두 문제로 쪼개지므로</tspan><tspan x="470" dy="17.667">보통 귀납법이 아니라 강한 귀납법이 필요하다</tspan></text><g ><g class="shape"><path d="M70 695h326v98H70z" class="stroke-B1 fill-B5 s1"/></g><text x="233" y="733.5" class="text-bold fill-N1 s0"><tspan x="233" dy="0">지원자 아무나 한 명과</tspan><tspan x="233" dy="17.667">그가 할 수 있는 일 하나를 짝지어</tspan><tspan x="233" dy="17.667">둘을 함께 빼낸다</tspan></text></g><g ><g class="shape"><path d="M63 863h340v130H63z" class="stroke-B1 fill-B5 s1"/></g><text x="233" y="901.5" class="text-bold fill-N1 s0"><tspan x="233" dy="0">남은 지원자 m 명에 대해</tspan><tspan x="233" dy="17">어떤 부분집합의 이웃도</tspan><tspan x="233" dy="17">하나만 줄어드는데</tspan><tspan x="233" dy="17">원래 여유가 하나 이상 있었으므로</tspan><tspan x="233" dy="17">병목이 새로 생기지 않는다</tspan></text></g><g ><g class="shape"><path d="M77 1063h313v66H77z" class="stroke-B1 fill-B5 s1"/></g><text x="233.5" y="1101.5" class="text-bold fill-N1 s0">귀납 가정으로 m 명을 짝지운다</text></g><g ><g class="shape"><path d="M546 641h323v82H546z" class="stroke-B1 fill-B5 s1"/></g><text x="707.5" y="679.5" class="text-bold fill-N1 s0"><tspan x="707.5" dy="0">X 안에서도 병목이 없으므로</tspan><tspan x="707.5" dy="18.5">귀납 가정으로 X 를 Y 에 짝지운다</tspan></text></g><g ><g class="shape"><path d="M542 793h332v82H542z" class="stroke-B1 fill-B5 s1"/></g><text x="708" y="831.5" class="text-bold fill-N1 s0"><tspan x="708" dy="0">남은 문제는 지원자 X 밖 사람들을</tspan><tspan x="708" dy="18.5">일자리 Y 밖 것들에 짝짓는 것</tspan></text></g><g ><g class="shape"><path d="M525 945h366v98H525z" class="stroke-B1 fill-B5 s1"/></g><text x="708" y="983.5" class="text-bold fill-N1 s0"><tspan x="708" dy="0">여기에도 병목이 없다 —</tspan><tspan x="708" dy="17.667">X 밖의 M&apos; 이 Y 밖에서 부족했다면</tspan><tspan x="708" dy="17.667">M&apos; ∪ X 가 원래 그래프에서 병목이 된다</tspan></text></g><g ><g class="shape"><path d="M540 1113h336v66H540z" class="stroke-B1 fill-B5 s1"/></g><text x="708" y="1151.5" class="text-bold fill-N1 s0">귀납 가정으로 나머지를 짝지운다</text></g><marker id="mk-d2-2657895880-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2657895880-3488378134)" d="m294.243 112-.229 64" class="connection stroke-B1 s1" mask="url(#d2-2657895880)"/><path fill="none" marker-end="url(#mk-d2-2657895880-3488378134)" d="M233.5 795.5v64" class="connection stroke-B1 s1" mask="url(#d2-2657895880)"/><path fill="none" marker-end="url(#mk-d2-2657895880-3488378134)" d="M233.5 995.5v64" class="connection stroke-B1 s1" mask="url(#d2-2657895880)"/><path fill="none" marker-end="url(#mk-d2-2657895880-3488378134)" d="M708 725v64" class="connection stroke-B1 s1" mask="url(#d2-2657895880)"/><path fill="none" marker-end="url(#mk-d2-2657895880-3488378134)" d="M708 877v64" class="connection stroke-B1 s1" mask="url(#d2-2657895880)"/><path fill="none" marker-end="url(#mk-d2-2657895880-3488378134)" d="M708 1045v64" class="connection stroke-B1 s1" mask="url(#d2-2657895880)"/><path fill="none" marker-end="url(#mk-d2-2657895880-3488378134)" d="m63.003 283 .49 307" class="connection stroke-B1 s1" mask="url(#d2-2657895880)"/><text x="63" y="443" class="text-italic fill-N2 s0">여유가 있다</text><path fill="none" marker-end="url(#mk-d2-2657895880-3488378134)" d="M525 283v252" class="connection stroke-B1 s1" mask="url(#d2-2657895880)"/><text x="525" y="416" class="text-italic fill-N2 s0">꽉 찬 덩어리가 있다</text><path fill="none" marker-end="url(#mk-d2-2657895880-3488378134)" d="M233.5 1131v133s0 10 10 10h140.25s10 0 10 10v26" class="connection stroke-B1 s1" mask="url(#d2-2657895880)"/><path fill="none" marker-end="url(#mk-d2-2657895880-3488378134)" d="M708 1181v83s0 10-10 10H557.75s-10 0-10 10v26" class="connection stroke-B1 s1" mask="url(#d2-2657895880)"/><mask id="