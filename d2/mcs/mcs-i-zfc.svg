<svg xmlns="http://www.w3.org/2000/svg" width="2451" height="995" class="d2-3759768354 d2-svg" viewBox="-101 -101 2451 995"><rect width="2451" height="995" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3759768354 .fill-N1{fill:#0a0f25}.d2-3759768354 .fill-B6{fill:#f7f8fe}.d2-3759768354 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M278 0h489v114H278z" class="stroke-B1 fill-B6 s0"/></g><text x="522.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="522.5" dy="0">집합론의 언어</tspan><tspan x="522.5" dy="17.25">쓸 수 있는 기호는 x ∈ y 하나와 논리 기호(5장)뿐이다.</tspan><tspan x="522.5" dy="17.25">등호도 부분집합도 정의로 줄인다 —</tspan><tspan x="522.5" dy="17.25">x = y ::= ∀z. (z ∈ x ↔ z ∈ y), x ⊆ y ::= ∀z. (z ∈ x → z ∈ y)</tspan></text></g><g ><g class="shape"><path d="M66 214h448v146H66z" class="stroke-B1 fill-B6 s0"/></g><text x="290" y="252.5" class="text-bold fill-N1 s1"><tspan x="290" dy="0">집합을 만드는 공리</tspan><tspan x="290" dy="16.833">· 짝: 두 집합 x, y 로 {x, y} 를 만든다</tspan><tspan x="290" dy="16.833">· 합집합: 집합들의 모임 z 의 합집합도 집합이다</tspan><tspan x="290" dy="16.833">· 무한: 무한집합이 존재한다</tspan><tspan x="290" dy="16.833">· 멱집합: pow(x) 도 집합이다</tspan><tspan x="290" dy="16.833">· 치환: 함수의 상도 집합이다</tspan></text></g><g ><g class="shape"><path d="M0 481h580v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="290" y="519.5" class="text-bold fill-N1 s1"><tspan x="290" dy="0">힘을 제한하는 공리</tspan><tspan x="290" dy="17.25">· 부분집합: 이미 있는 집합 x 에서 성질로 잘라낸 것만 집합이다</tspan><tspan x="290" dy="17.25"> (아무 성질이나 모으는 것은 허용하지 않는다)</tspan><tspan x="290" dy="17.25">· 기초: 원소 관계를 따라 무한히 내려갈 수 없다</tspan></text></g><g ><g class="shape"><path d="M46 695h488v98H46z" class="stroke-B1 fill-B6 s0"/></g><text x="290" y="733.5" class="text-bold fill-N1 s1"><tspan x="290" dy="0">선택 공리</tspan><tspan x="290" dy="17.667">공집합이 아닌 서로 겹치지 않는 집합들의 모임에서</tspan><tspan x="290" dy="17.667">각각 하나씩 뽑아 모은 것도 집합이다</tspan></text></g><g ><g class="shape"><path d="M574 246h360v82H574z" class="stroke-B1 fill-B6 s0"/></g><text x="754" y="284.5" class="text-bold fill-N1 s1"><tspan x="754" dy="0">외연 공리</tspan><tspan x="754" dy="18.5">같은 집합에 속하는 집합끼리는 같다</tspan></text></g><text x="1203.5" y="39" class="fill-N1 s1"><tspan x="1203.5" dy="0">러셀의 역설을 어떻게 막는가(6장에서 문제를 보았다).</tspan><tspan x="1203.5" dy="17.25">부분집합 공리 때문에 { S : S ∉ S } 를 만드는 것 자체가 허용되지 않고 —</tspan><tspan x="1203.5" dy="17.25">어디에서 잘라낼지 먼저 말해야 한다 — 기초 공리 때문에 모든 집합 S 에서 S ∉ S 다.</tspan><tspan x="1203.5" dy="17.25">그래서 그 모임은 ‘모든 집합의 모임’ 이 되는데, 그것이 집합이면 다시 기초 공리를 어긴다</tspan></text><text x="1944.5" y="39" class="fill-N1 s1"><tspan x="1944.5" dy="0">이것으로 끝인가: 아니다.</tspan><tspan x="1944.5" dy="17.25">· 연속체 가설(ℕ 과 pow(ℕ) 사이의 크기가 있는가)은 ZFC 로 결정되지 않는다</tspan><tspan x="1944.5" dy="17.25">· 괴델: 무모순인 체계는 자기 자신의 무모순성을 증명할 수 없다</tspan><tspan x="1944.5" dy="17.25">· 선택 공리는 바나흐 · 타르스키 정리처럼 직관을 거스르는 결과를 낳는다</tspan></text><marker id="mk-d2-3759768354-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3759768354-3488378134)" d="M647.815 114.84C732.4 154 754 180.4 754 242" class="connection stroke-B1 s0" mask="url(#d2-3759768354)"/><path fill="none" marker-end="url(#mk-d2-3759768354-3488378134)" d="M396.185 114.84C311.6 154 290 174 290 210" class="connection stroke-B1 s0" mask="url(#d2-3759768354)"/><path fill="none" marker-end="url(#mk-d2-3759768354-3488378134)" d="M290 361.5v116" class="connection stroke-B1 s0" mask="url(#d2-3759768354)"/><text x="290.5" y="426" style="fill:#676c7e;text-anchor:middle;font-size:16px">제한이 없으면 러셀의 역설이 산다</text><path fill="none" marker-end="url(#mk-d2-3759768354-3488378134)" d="M290 597v94" class="connection stroke-B1 s0" mask="url(#d2-3759768354)"/><mask id="d2-3759768354" width="2451" height="995" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2451v995H-101z"/><path d="M147 410h287v21H147z"/></mask></svg>