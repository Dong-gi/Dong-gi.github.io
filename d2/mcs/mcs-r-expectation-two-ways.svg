<svg xmlns="http://www.w3.org/2000/svg" width="4291" height="834" class="d2-2462300556 d2-svg" viewBox="-101 -85 4291 834"><rect width="4291" height="834" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2462300556 .fill-N1{fill:#0a0f25}.d2-2462300556 .fill-N2{fill:#676c7e}.d2-2462300556 .fill-B4{fill:#e3e9fd}.d2-2462300556 .fill-B5{fill:#edf0fd}.d2-2462300556 .fill-B6{fill:#f7f8fe}.d2-2462300556 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M222 354h316v98H222z" class="stroke-B1 fill-B6 s0"/></g><text x="380" y="392.5" class="text-bold fill-N1 s1"><tspan x="380" dy="0">정의 — 결과마다 더한다</tspan><tspan x="380" dy="17.667">Ex[R] ::= Σ R(ω) · Pr[ω] (ω ∈ S)</tspan><tspan x="380" dy="17.667">표본공간의 잎을 하나씩 훑는다</tspan></text></g><g ><g class="shape"><path d="M2022 406h323v98h-323z" class="stroke-B1 fill-B6 s0"/></g><text x="2183.5" y="444.5" class="text-bold fill-N1 s1"><tspan x="2183.5" dy="0">정리 — 값마다 더한다</tspan><tspan x="2183.5" dy="17.667">Ex[R] = Σ x · Pr[R = x] (x ∈ range(R))</tspan><tspan x="2183.5" dy="17.667">같은 값을 주는 잎을 먼저 묶는다</tspan></text></g><g ><g class="shape"><path d="M2026 56h315v300h-315z" class="stroke-B1 fill-B4 s0"/></g><text x="2183.5" y="43" class="fill-N1 s2">결과별 정의가 편한 곳</text></g><g ><g class="shape"><path d="M3680 184h353v316h-353z" class="stroke-B1 fill-B4 s0"/></g><text x="3856.5" y="171" class="fill-N1 s2">값별 정의가 편한 곳</text></g><g ><g class="shape"><path d="M3625 550h464v98h-464z" class="stroke-B1 fill-B6 s0"/></g><text x="3857" y="588.5" class="text-bold fill-N1 s1"><tspan x="3857" dy="0">조건부 기댓값</tspan><tspan x="3857" dy="17.667">Ex[R | A] ::= Σ r · Pr[R = r | A]</tspan><tspan x="3857" dy="17.667">전기댓값 정리: Ex[R] = Σ Ex[R | Aᵢ]Pr[Aᵢ] (Aᵢ 가 분할)</tspan></text></g><text x="379.5" y="528" class="fill-N1 s1"><tspan x="379.5" dy="0">두 정의 모두 항의 순서를 바꿔 쓴다. 음이 아닌 실수의 가산 합은 순서를 바꿔도 같은 값에</tspan><tspan x="379.5" dy="17.25">수렴하거나 언제나 발산하므로 이것이 허용된다. 값이 음수도 되는 변수에서는 절대수렴을</tspan><tspan x="379.5" dy="17.25">확인해야 하고, 확인하지 않으면 21장 마지막의 배팅 두 배 역설이 생긴다.</tspan><tspan x="379.5" dy="17.25">기댓값이 무한한 변수도 있다 — Pr[T = n] ∝ 1/n² 이면 Ex[T] 가 발산하고 Ex[√T] 는 유한하다.</tspan></text><g ><g class="shape"><path d="M2056 86h255v98h-255z" class="stroke-B1 fill-B5 s0"/></g><text x="2183.5" y="124.5" class="text-bold fill-N1 s1"><tspan x="2183.5" dy="0">선형성의 증명</tspan><tspan x="2183.5" dy="17.667">Σ (R₁(ω)+R₂(ω))Pr[ω] 를</tspan><tspan x="2183.5" dy="17.667">두 합으로 가르면 끝난다</tspan></text></g><g ><g class="shape"><path d="M2111 244h145v82h-145z" class="stroke-B1 fill-B5 s0"/></g><text x="2183.5" y="282.5" class="text-bold fill-N1 s1"><tspan x="2183.5" dy="0">지시변수</tspan><tspan x="2183.5" dy="18.5">Ex[I_A] = Pr[A]</tspan></text></g><g ><g class="shape"><path d="M3710 214h293v98h-293z" class="stroke-B1 fill-B5 s0"/></g><text x="3856.5" y="252.5" class="text-bold fill-N1 s1"><tspan x="3856.5" dy="0">분포만 알 때</tspan><tspan x="3856.5" dy="17.667">표본공간이 무엇인지 몰라도</tspan><tspan x="3856.5" dy="17.667">pmf 만 있으면 계산된다</tspan></text></g><g ><g class="shape"><path d="M3717 372h279v98h-279z" class="stroke-B1 fill-B5 s0"/></g><text x="3856.5" y="410.5" class="text-bold fill-N1 s1"><tspan x="3856.5" dy="0">주사위</tspan><tspan x="3856.5" dy="17.667">Σ i·(1/6) = 7/2</tspan><tspan x="3856.5" dy="17.667">실제로 나올 수 없는 값이다</tspan></text></g><marker id="mk-d2-2462300556-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2462300556-3488378134)" d="M540.5 406.384c575.2 11.285 1272.6 18.375 1477.013 35.086" class="connection stroke-B1 s0" mask="url(#d2-2462300556)"/><text x="1280.5" y="425" class="text-italic fill-N2 s1">값이 x 인 사건들이 S 의 분할이므로 항을 모아 x 를 묶어낸다</text><path fill="none" marker-end="url(#mk-d2-2462300556-3488378134)" d="M2019.52 478.63c-206.42 29.838-903.92 18.97-1477.552-54.124" class="connection stroke-B1 s0" mask="url(#d2-2462300556)"/><text x="1278.5" y="506" class="text-italic fill-N2 s1">같은 값</text><path fill="none" marker-end="url(#mk-d2-2462300556-3488378134)" d="M540.482 381.763C1115.7 304.406 1413.2 285 2022 285" class="connection stroke-B1 s0" mask="url(#d2-2462300556)"/><path fill="none" marker-end="url(#mk-d2-2462300556-3488378134)" d="M2347.493 441.632C2553.1 424.76 3123.7 420.5 3676.5 420.5" class="connection stroke-B1 s0" mask="url(#d2-2462300556)"/><path fill="none" marker-end="url(#mk-d2-2462300556-3488378134)" d="M2328.893 504.147C2549.4 579.5 2680.9 598.5 2794.75 598.5h825.75" class="connection stroke-B1 s0" mask="url(#d2-2462300556)"/><text x="2969" y="604" class="text-italic fill-N2 s1">확률을 조건부확률로 바꾼다</text><mask id="d2-2462300556" width="4291" height="834" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h4291v834H-101z"/><path d="M1038 409h485v21h-485zM1246 490h65v21h-65zM2848 588h242v21h-242z"/></mask></svg>