<svg xmlns="http://www.w3.org/2000/svg" width="1172" height="1195" class="d2-15966181 d2-svg" viewBox="-97 -101 1172 1195"><rect width="1172" height="1195" x="-97" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-15966181 .fill-N1{fill:#0a0f25}.d2-15966181 .fill-N2{fill:#676c7e}.d2-15966181 .fill-B4{fill:#e3e9fd}.d2-15966181 .fill-B5{fill:#edf0fd}.d2-15966181 .fill-B6{fill:#f7f8fe}.d2-15966181 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M415 0h316v98H415z" class="stroke-B1 fill-B6 s0"/></g><text x="573" y="38.5" class="text-bold fill-N1 s1"><tspan x="573" dy="0">정의 — 결과마다 더한다</tspan><tspan x="573" dy="17.667">Ex[R] ::= Σ R(ω) · Pr[ω] (ω ∈ S)</tspan><tspan x="573" dy="17.667">표본공간의 잎을 하나씩 훑는다</tspan></text></g><g ><g class="shape"><path d="M245 307h323v98H245z" class="stroke-B1 fill-B6 s0"/></g><text x="406.5" y="345.5" class="text-bold fill-N1 s1"><tspan x="406.5" dy="0">정리 — 값마다 더한다</tspan><tspan x="406.5" dy="17.667">Ex[R] = Σ x · Pr[R = x] (x ∈ range(R))</tspan><tspan x="406.5" dy="17.667">같은 값을 주는 잎을 먼저 묶는다</tspan></text></g><g ><g class="shape"><path d="M628 219h346v274H628z" class="stroke-B1 fill-B4 s0"/></g><text x="801" y="252" class="fill-N1 s2">결과별 정의가 편한 곳</text></g><g ><g class="shape"><path d="M4 614h341v290H4z" class="stroke-B1 fill-B4 s0"/></g><text x="174.5" y="647" class="fill-N1 s2">값별 정의가 편한 곳</text></g><g ><g class="shape"><path d="M405 710h464v98H405z" class="stroke-B1 fill-B6 s0"/></g><text x="637" y="748.5" class="text-bold fill-N1 s1"><tspan x="637" dy="0">조건부 기댓값</tspan><tspan x="637" dy="17.667">Ex[R | A] ::= Σ r · Pr[R = r | A]</tspan><tspan x="637" dy="17.667">전기댓값 정리: Ex[R] = Σ Ex[R | Aᵢ]Pr[Aᵢ] (Aᵢ 가 분할)</tspan></text></g><text x="488.5" y="940" class="fill-N1 s1"><tspan x="488.5" dy="0">두 정의 모두 항의 순서를 바꿔 쓴다. 음이 아닌 실수의 가산 합은 순서를 바꿔도 같은 값에</tspan><tspan x="488.5" dy="17.25">수렴하거나 언제나 발산하므로 이것이 허용된다. 값이 음수도 되는 변수에서는 절대수렴을</tspan><tspan x="488.5" dy="17.25">확인해야 하고, 확인하지 않으면 21장 마지막의 배팅 두 배 역설이 생긴다.</tspan><tspan x="488.5" dy="17.25">기댓값이 무한한 변수도 있다 — Pr[T = n] ∝ 1/n² 이면 Ex[T] 가 발산하고 Ex[√T] 는 유한하다.</tspan></text><g ><g class="shape"><path d="M673 265h255v98H673z" class="stroke-B1 fill-B5 s0"/></g><text x="800.5" y="303.5" class="text-bold fill-N1 s1"><tspan x="800.5" dy="0">선형성의 증명</tspan><tspan x="800.5" dy="17.667">Σ (R₁(ω)+R₂(ω))Pr[ω] 를</tspan><tspan x="800.5" dy="17.667">두 합으로 가르면 끝난다</tspan></text></g><g ><g class="shape"><path d="M673 387h255v82H673z" class="stroke-B1 fill-B5 s0"/></g><text x="800.5" y="425.5" class="text-bold fill-N1 s1"><tspan x="800.5" dy="0">지시변수</tspan><tspan x="800.5" dy="18.5">Ex[I_A] = Pr[A]</tspan></text></g><g ><g class="shape"><path d="M28 660h293v98H28z" class="stroke-B1 fill-B5 s0"/></g><text x="174.5" y="698.5" class="text-bold fill-N1 s1"><tspan x="174.5" dy="0">분포만 알 때</tspan><tspan x="174.5" dy="17.667">표본공간이 무엇인지 몰라도</tspan><tspan x="174.5" dy="17.667">pmf 만 있으면 계산된다</tspan></text></g><g ><g class="shape"><path d="M28 782h293v98H28z" class="stroke-B1 fill-B5 s0"/></g><text x="174.5" y="820.5" class="text-bold fill-N1 s1"><tspan x="174.5" dy="0">주사위</tspan><tspan x="174.5" dy="17.667">Σ i·(1/6) = 7/2</tspan><tspan x="174.5" dy="17.667">실제로 나올 수 없는 값이다</tspan></text></g><marker id="mk-d2-15966181-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-15966181-3488378134)" d="M426.608 98.148C286.1 146.3 273.9 188.3 365.03 304.354" class="connection stroke-B1 s0" mask="url(#d2-15966181)"/><text x="279.5" y="173" class="text-italic fill-N2 s1">값이 x 인 사건들이 S 의 분할이므로 항을 모아 x 를 묶어낸다</text><path fill="none" marker-end="url(#mk-d2-15966181-3488378134)" d="M448.291 305.973C547.8 188.3 573 146.3 573 101.5" class="connection stroke-B1 s0" mask="url(#d2-15966181)"/><text x="528.5" y="216" class="text-italic fill-N2 s1">같은 값</text><path fill="none" marker-end="url(#mk-d2-15966181-3488378134)" d="M676.3 98.371C775.3 146.3 800.5 170.7 800.5 215.5" class="connection stroke-B1 s0" mask="url(#d2-15966181)"/><path fill="none" marker-end="url(#mk-d2-15966181-3488378134)" d="M347.23 405.8C209.55 523.7 174.75 565.7 174.75 610.5" class="connection stroke-B1 s0" mask="url(#d2-15966181)"/><path fill="none" marker-end="url(#mk-d2-15966181-3488378134)" d="M464.77 405.8c137.68 117.9 172.48 179.1 172.48 300.7" class="connection stroke-B1 s0" mask="url(#d2-15966181)"/><text x="606" y="535" class="text-italic fill-N2 s1">확률을 조건부확률로 바꾼다</text><mask id="d2-15966181" width="1172" height="1195" x="-97" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-97-101h1172v1195H-97z"/><path d="M37 157h485v21H37zM496 200h65v21h-65zM485 519h242v21H485z"/></mask></svg>