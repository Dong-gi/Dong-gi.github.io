<svg xmlns="http://www.w3.org/2000/svg" width="1177" height="1763" class="d2-1820042139 d2-svg" viewBox="-91 -101 1177 1763"><rect width="1177" height="1763" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1820042139 .fill-N1{fill:#0a0f25}.d2-1820042139 .fill-N2{fill:#676c7e}.d2-1820042139 .fill-B4{fill:#e3e9fd}.d2-1820042139 .fill-B5{fill:#edf0fd}.d2-1820042139 .fill-B6{fill:#f7f8fe}.d2-1820042139 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><path d="M236 0h490v82H236z" class="stroke-B1 fill-B6 s0"/></g><text x="481" y="38.5" class="text-bold fill-N1 s1"><tspan x="481" dy="0">모든 평면 그래프에는 차수 5 이하인 정점이 있다</tspan><tspan x="481" dy="18.5">(간선 수 상한 e ≤ 3v − 6 과 악수 보조정리에서 나온다)</tspan></text></g><g ><g class="shape"><path d="M346 182h270v66H346z" class="stroke-B1 fill-B6 s0"/></g><text x="481" y="220.5" class="text-bold fill-N1 s1">그런 정점 g 를 하나 고른다</text></g><g ><g class="shape"><path d="M481 440h-4l-197-45c-2 0-2-1 0-2l197-45h7l198 45c2 0 2 1 0 2l-197 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="481" y="399.5" class="text-bold fill-N1 s1">deg(g) 가 5 보다 작은가</text></g><g ><g class="shape"><path d="M10 1048h434v332H10z" class="stroke-B1 fill-B4 s0"/></g><text x="227" y="1035" class="text-bold fill-N1 s2">경우 1 — deg(g) ≤ 4</text></g><g ><g class="shape"><path d="M484 581h501v807H484z" class="stroke-B1 fill-B4 s0"/></g><text x="734.5" y="568" class="text-bold fill-N1 s2">경우 2 — deg(g) = 5</text></g><text x="481" y="1524" class="text-bold fill-N1 s1"><tspan x="481" dy="0">두 경우 모두 5색 칠하기를 얻었다.</tspan><tspan x="481" dy="17.667">4색으로 줄이는 것은 훨씬 어렵고, 1970년대에</tspan><tspan x="481" dy="17.667">컴퓨터로 경우를 잔뜩 검사해서야 증명되었다</tspan></text><g ><g class="shape"><path d="M40 1078h374v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="227" y="1116.5" class="text-bold fill-N1 s1"><tspan x="227" dy="0">g 를 지운다. 부분그래프도 평면이므로</tspan><tspan x="227" dy="18.5">귀납 가정으로 5색 칠한다</tspan></text></g><g ><g class="shape"><path d="M43 1268h369v82H43z" class="stroke-B1 fill-B5 s0"/></g><text x="227.5" y="1306.5" class="text-bold fill-N1 s1"><tspan x="227.5" dy="0">g 를 되붙인다. 이웃이 4 개 이하이므로</tspan><tspan x="227.5" dy="18.5">쓰이지 않은 색이 반드시 남는다</tspan></text></g><g ><g class="shape"><path d="M527 611h416v98H527z" class="stroke-B1 fill-B5 s0"/></g><text x="735" y="649.5" class="text-bold fill-N1 s1"><tspan x="735" dy="0">이웃 다섯이 서로 모두 인접하다면</tspan><tspan x="735" dy="17.667">그 다섯이 K₅ 를 이루어 평면이 아니게 된다.</tspan><tspan x="735" dy="17.667">그러므로 인접하지 않은 이웃 n₁, n₂ 가 있다</tspan></text></g><g ><g class="shape"><path d="M514 830h441v98H514z" class="stroke-B1 fill-B5 s0"/></g><text x="734.5" y="868.5" class="text-bold fill-N1 s1"><tspan x="734.5" dy="0">g 와 n₁ 을 합치고, 그 결과를 다시 n₂ 와 합친다.</tspan><tspan x="734.5" dy="17.667">인접한 정점끼리 합치므로 평면성이 유지되고</tspan><tspan x="734.5" dy="17.667">정점이 하나 줄어든다</tspan></text></g><g ><g class="shape"><path d="M528 1078h413v82H528z" class="stroke-B1 fill-B5 s0"/></g><text x="734.5" y="1116.5" class="text-bold fill-N1 s1"><tspan x="734.5" dy="0">귀납 가정으로 5색 칠한다.</tspan><tspan x="734.5" dy="18.5">합쳐진 정점의 색을 n₁ 과 n₂ 에 똑같이 준다</tspan></text></g><g ><g class="shape"><path d="M559 1260h352v98H559z" class="stroke-B1 fill-B5 s0"/></g><text x="735" y="1298.5" class="text-bold fill-N1 s1"><tspan x="735" dy="0">n₁ 과 n₂ 가 같은 색이므로</tspan><tspan x="735" dy="17.667">g 의 이웃 다섯이 색을 4 가지만 쓴다.</tspan><tspan x="735" dy="17.667">남은 색 하나를 g 에 준다</tspan></text></g><marker id="mk-d2-1820042139-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1820042139-3488378134)" d="M480.75 84v94" class="connection stroke-B1 s0" mask="url(#d2-1820042139)"/><path fill="none" marker-end="url(#mk-d2-1820042139-3488378134)" d="M480.75 250c0 38 .05 58 .23 94" class="connection stroke-B1 s0" mask="url(#d2-1820042139)"/><path fill="none" marker-end="url(#mk-d2-1820042139-3488378134)" d="M227 1162v102" class="connection stroke-B1 s0" mask="url(#d2-1820042139)"/><path fill="none" marker-end="url(#mk-d2-1820042139-3488378134)" d="M734.5 710.5v116" class="connection stroke-B1 s0" mask="url(#d2-1820042139)"/><path fill="none" marker-end="url(#mk-d2-1820042139-3488378134)" d="M734.5 930v144" class="connection stroke-B1 s0" mask="url(#d2-1820042139)"/><path fill="none" marker-end="url(#mk-d2-1820042139-3488378134)" d="M734.5 1162v94" class="connection stroke-B1 s0" mask="url(#d2-1820042139)"/><path fill="none" marker-end="url(#mk-d2-1820042139-3488378134)" d="M405.16 424.782C263 485.2 227 512.6 227 530.75V1074" class="connection stroke-B1 s0" mask="url(#d2-1820042139)"/><text x="227" y="700" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-1820042139-3488378134)" d="M555.841 424.78C698.4 485.2 734.5 571 734.5 607" class="connection stroke-B1 s0" mask="url(#d2-1820042139)"/><text x="687" y="486" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1820042139-3488378134)" d="M227 1352c0 44.4 33.2 116 162.17 154.846" class="connection stroke-B1 s0" mask="url(#d2-1820042139)"/><path fill="none" marker-end="url(#mk-d2-1820042139-3488378134)" d="M734.5 1360c0 38-33.2 108-162.17 146.846" class="connection stroke-B1 s0" mask="url(#d2-1820042139)"/><mask id="d2-1820042139" width="1177" height="1763" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h1177v1763H-91z"/><path d="M215 684h24v21h-24zM656 470h62v21h-62z"/></mask></svg>