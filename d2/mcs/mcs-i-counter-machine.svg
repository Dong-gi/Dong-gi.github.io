<svg xmlns="http://www.w3.org/2000/svg" width="1218" height="639" class="d2-3321505962 d2-svg" viewBox="-89 -75 1218 639"><rect width="1218" height="639" x="-89" y="-75" rx="0" style="fill:#fff"/><style>.d2-3321505962 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3321505962 .fill-N1{fill:#0a0f25}.d2-3321505962 .fill-B6{fill:#f7f8fe}.d2-3321505962 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><text x="52.5" y="142" class="fill-N1 s0">시작 상태</text><g ><g class="shape"><circle cx="201.5" cy="136.5" r="38.5" class="shape stroke-B1 fill-B6 s1"/></g><text x="201.5" y="142" class="text-bold fill-N1 s0">0</text></g><g ><g class="shape"><circle cx="348.5" cy="136.5" r="38.5" class="shape stroke-B1 fill-B6 s1"/></g><text x="348.5" y="142" class="text-bold fill-N1 s0">1</text></g><g ><g class="shape"><circle cx="495.5" cy="136.5" r="38.5" class="shape stroke-B1 fill-B6 s1"/></g><text x="495.5" y="142" class="text-bold fill-N1 s0">2</text></g><text x="608.5" y="142" class="fill-N1 s0">…</text><g ><g class="shape"><circle cx="721.5" cy="136.5" r="38.5" class="shape stroke-B1 fill-B6 s1"/></g><text x="721.5" y="142" class="text-bold fill-N1 s0">99</text></g><g ><g class="shape"><circle cx="929.5" cy="136.5" r="51.5" class="shape stroke-B1 fill-B6 s1"/></g><text x="929.5" y="142" class="text-bold fill-N1 s0">넘침</text></g><path fill="transparent" stroke="transparent" d="M120 208h752v255H120z" class="shape s1"/><text x="344.5" y="248" class="fill-N1 s0"><tspan x="344.5" dy="0">상태 = {0, 1, …, 99, 넘침}</tspan><tspan x="344.5" dy="17.667">시작 상태 = 0</tspan><tspan x="344.5" dy="17.667">전이 = { n → n+1 | 0 ≤ n &lt; 99 } ∪ { 99 → 넘침, 넘침 → 넘침 }</tspan></text><text x="496" y="325" class="fill-N1 s0"><tspan x="496" dy="0">이 기계는 결정적이다 — 상태마다 나가는 화살표가 하나 이하다.</tspan><tspan x="496" dy="17.667">한 상태에서 여러 곳으로 갈 수 있으면 비결정적이라 하고, 물통 기계가 그렇다.</tspan><tspan x="496" dy="17.667">비결정적 기계에서는 ‘실행’ 이 여러 가지이고, 도달 가능한 상태도 그만큼 많아진다</tspan></text><text x="470" y="402" class="fill-N1 s0"><tspan x="470" dy="0">상태 기계는 결국 한 집합 위의 이항관계다(6장). 새로운 것은 이름뿐이다 —</tspan><tspan x="470" dy="17.667">집합의 원소를 상태, 관계를 전이 관계, 관계의 그래프를 상태 그래프라 부르고,</tspan><tspan x="470" dy="17.667">시작 상태 하나를 따로 지정한다</tspan></text><marker id="mk-d2-3321505962-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3321505962-3488378134)" d="m95 136.514 64 .457" class="connection stroke-B1 s1" mask="url(#d2-3321505962)"/><path fill="none" marker-end="url(#mk-d2-3321505962-3488378134)" d="m242 136.971 64-.914" class="connection stroke-B1 s1" mask="url(#d2-3321505962)"/><path fill="none" marker-end="url(#mk-d2-3321505962-3488378134)" d="m389 136.971 64-.914" class="connection stroke-B1 s1" mask="url(#d2-3321505962)"/><path fill="none" marker-end="url(#mk-d2-3321505962-3488378134)" d="m536 136.971 64-.914" class="connection stroke-B1 s1" mask="url(#d2-3321505962)"/><path fill="none" marker-end="url(#mk-d2-3321505962-3488378134)" d="m615 136.514 64 .457" class="connection stroke-B1 s1" mask="url(#d2-3321505962)"/><path fill="none" marker-end="url(#mk-d2-3321505962-3488378134)" d="m762 136.983 112-.95" class="connection stroke-B1 s1" mask="url(#d2-3321505962)"/><path fill="none" marker-end="url(#mk-d2-3321505962-3488378134)" d="m912.013 86 .257-41s.063-10 10.063-10h14.333s10 0 10.063 10l.246 39" class="connection stroke-B1 s1" mask="url(#d2-3321505962)"/><text x="929.5" y="41" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">자기 자신으로 돌아온다</text><mask id="d2-3321505962" width="1218" height="639" x="-89" y="-75" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-75h1218v639H-89z"/><path d="M828 25h203v21H828z"/></mask></svg>