<svg xmlns="http://www.w3.org/2000/svg" width="2851" height="603" class="d2-3519515804 d2-svg" viewBox="-101 -101 2851 603"><rect width="2851" height="603" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3519515804 .fill-N1{fill:#0a0f25}.d2-3519515804 .fill-B6{fill:#f7f8fe}.d2-3519515804 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><text x="352.5" y="57" class="fill-N1 s0">시작 상태</text><g ><g class="shape"><circle cx="981.5" cy="51.5" r="38.5" class="shape stroke-B1 fill-B6 s1"/></g><text x="981.5" y="57" class="text-bold fill-N1 s0">0</text></g><g ><g class="shape"><circle cx="1297.5" cy="51.5" r="38.5" class="shape stroke-B1 fill-B6 s1"/></g><text x="1297.5" y="57" class="text-bold fill-N1 s0">1</text></g><g ><g class="shape"><circle cx="1613.5" cy="51.5" r="38.5" class="shape stroke-B1 fill-B6 s1"/></g><text x="1613.5" y="57" class="text-bold fill-N1 s0">2</text></g><text x="1895.5" y="57" class="fill-N1 s0">…</text><g ><g class="shape"><circle cx="2177.5" cy="51.5" r="38.5" class="shape stroke-B1 fill-B6 s1"/></g><text x="2177.5" y="57" class="text-bold fill-N1 s0">99</text></g><g ><g class="shape"><circle cx="2554.5" cy="51.5" r="51.5" class="shape stroke-B1 fill-B6 s1"/></g><text x="2554.5" y="57" class="text-bold fill-N1 s0">넘침</text></g><text x="352.5" y="138" class="fill-N1 s0"><tspan x="352.5" dy="0">상태 = {0, 1, …, 99, 넘침}</tspan><tspan x="352.5" dy="17.667">시작 상태 = 0</tspan><tspan x="352.5" dy="17.667">전이 = { n → n+1 | 0 ≤ n &lt; 99 } ∪ { 99 → 넘침, 넘침 → 넘침 }</tspan></text><text x="352" y="251" class="fill-N1 s0"><tspan x="352" dy="0">이 기계는 결정적이다 — 상태마다 나가는 화살표가 하나 이하다.</tspan><tspan x="352" dy="17.667">한 상태에서 여러 곳으로 갈 수 있으면 비결정적이라 하고, 물통 기계가 그렇다.</tspan><tspan x="352" dy="17.667">비결정적 기계에서는 ‘실행’ 이 여러 가지이고, 도달 가능한 상태도 그만큼 많아진다</tspan></text><text x="352" y="364" class="fill-N1 s0"><tspan x="352" dy="0">상태 기계는 결국 한 집합 위의 이항관계다(6장). 새로운 것은 이름뿐이다 —</tspan><tspan x="352" dy="17.667">집합의 원소를 상태, 관계를 전이 관계, 관계의 그래프를 상태 그래프라 부르고,</tspan><tspan x="352" dy="17.667">시작 상태 하나를 따로 지정한다</tspan></text><marker id="mk-d2-3519515804-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3519515804-3488378134)" d="M395.5 51.5c342 0 451.9.1 543.5.483" class="connection stroke-B1 s1" mask="url(#d2-3519515804)"/><path fill="none" marker-end="url(#mk-d2-3519515804-3488378134)" d="M1022 51.992c93.6-.392 141.4-.392 233-.009" class="connection stroke-B1 s1" mask="url(#d2-3519515804)"/><path fill="none" marker-end="url(#mk-d2-3519515804-3488378134)" d="M1338 51.992c93.6-.392 141.4-.392 233-.009" class="connection stroke-B1 s1" mask="url(#d2-3519515804)"/><path fill="none" marker-end="url(#mk-d2-3519515804-3488378134)" d="M1654 51.992c93.6-.392 141.5-.492 233.5-.492" class="connection stroke-B1 s1" mask="url(#d2-3519515804)"/><path fill="none" marker-end="url(#mk-d2-3519515804-3488378134)" d="M1901.5 51.5c94 0 141.9.1 233.5.483" class="connection stroke-B1 s1" mask="url(#d2-3519515804)"/><path fill="none" marker-end="url(#mk-d2-3519515804-3488378134)" d="M2218 51.992c93.6-.392 151-.392 281-.004" class="connection stroke-B1 s1" mask="url(#d2-3519515804)"/><path fill="none" marker-end="url(#mk-d2-3519515804-3488378134)" d="M2526.002 96.733C2507.8 128.333 2503 138.35 2503 140.875s10.3 5.891 25.75 8.416 36.05 2.525 51.5 0 20.95-20.958 3.747-50.825" class="connection stroke-B1 s1" mask="url(#d2-3519515804)"/><text x="2550.5" y="157" style="fill:#676c7e;text-anchor:middle;font-size:16px">자기 자신으로 돌아온다</text><mask id="d2-3519515804" width="2851" height="603" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2851v603H-101z"/><path d="M2449 141h203v21h-203z"/></mask></svg>