<svg xmlns="http://www.w3.org/2000/svg" width="1282" height="1468" class="d2-1194820114 d2-svg" viewBox="-51 -85 1282 1468"><rect width="1282" height="1468" x="-51" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1194820114 .fill-N1{fill:#0a0f25}.d2-1194820114 .fill-B4{fill:#e3e9fd}.d2-1194820114 .fill-B5{fill:#edf0fd}.d2-1194820114 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M211 56h312v994H211z" class="stroke-B1 fill-B4 s0"/></g><text x="367" y="43" class="text-bold fill-N1 s1">수열에서 하는 일</text></g><g ><g class="shape"><path d="M854 64h197v978H854z" class="stroke-B1 fill-B4 s0"/></g><text x="952.5" y="51" class="text-bold fill-N1 s1">생성함수에서 하는 계산</text></g><text x="367" y="1116" class="fill-N1 s2"><tspan x="367" dy="0">외울 것은 두 줄뿐이다.</tspan><tspan x="367" dy="17.667">1/(1 − x) 의 계수는 모두 1 이고, 1/(1 − x)ᵏ 의 xⁿ 계수는 C(n + k − 1, n) 이다.</tspan><tspan x="367" dy="17.667">나머지는 이 표를 타고 내려가면 나온다</tspan></text><text x="367" y="1229" class="fill-N1 s2"><tspan x="367" dy="0">왜 이동이 가장 값나가는가: fₙ = fₙ₋₁ + fₙ₋₂ 라는 점화식은</tspan><tspan x="367" dy="17.25">‘수열이 자기 자신을 한 칸 · 두 칸 민 것의 합과 같다’ 는 말이다.</tspan><tspan x="367" dy="17.25">표에 따라 F = xF + x²F + (초기항 보정) 이 되고, 이것은 F 에 대한 일차방정식이다.</tspan><tspan x="367" dy="17.25">무한히 많은 등식이 방정식 하나로 접힌다</tspan></text><g ><g class="shape"><path d="M283 86h168v82H283z" class="stroke-B1 fill-B5 s0"/></g><text x="367" y="124.5" class="text-bold fill-N1 s2"><tspan x="367" dy="0">항마다 더한다</tspan><tspan x="367" dy="18.5">⟨fₙ + gₙ⟩</tspan></text></g><g ><g class="shape"><path d="M266 228h202v82H266z" class="stroke-B1 fill-B5 s0"/></g><text x="367" y="266.5" class="text-bold fill-N1 s2"><tspan x="367" dy="0">항마다 c 를 곱한다</tspan><tspan x="367" dy="18.5">⟨c·fₙ⟩</tspan></text></g><g ><g class="shape"><path d="M241 370h252v82H241z" class="stroke-B1 fill-B5 s0"/></g><text x="367" y="408.5" class="text-bold fill-N1 s2"><tspan x="367" dy="0">합성곱</tspan><tspan x="367" dy="18.5">⟨f₀gₙ + f₁gₙ₋₁ + ⋯ + fₙg₀⟩</tspan></text></g><g ><g class="shape"><path d="M250 512h235v82H250z" class="stroke-B1 fill-B5 s0"/></g><text x="367.5" y="550.5" class="text-bold fill-N1 s2"><tspan x="367.5" dy="0">오른쪽으로 한 칸 밀기</tspan><tspan x="367.5" dy="18.5">⟨0, f₀, f₁, …⟩</tspan></text></g><g ><g class="shape"><path d="M270 654h195v82H270z" class="stroke-B1 fill-B5 s0"/></g><text x="367.5" y="692.5" class="text-bold fill-N1 s2"><tspan x="367.5" dy="0">앞의 한 항 버리기</tspan><tspan x="367.5" dy="18.5">⟨f₁, f₂, f₃, …⟩</tspan></text></g><g ><g class="shape"><path d="M282 796h171v82H282z" class="stroke-B1 fill-B5 s0"/></g><text x="367.5" y="834.5" class="text-bold fill-N1 s2"><tspan x="367.5" dy="0">부분합</tspan><tspan x="367.5" dy="18.5">⟨f₀ + f₁ + ⋯ + fₙ⟩</tspan></text></g><g ><g class="shape"><path d="M275 938h184v82H275z" class="stroke-B1 fill-B5 s0"/></g><text x="367" y="976.5" class="text-bold fill-N1 s2"><tspan x="367" dy="0">항에 n 을 곱한다</tspan><tspan x="367" dy="18.5">⟨n·fₙ⟩</tspan></text></g><g ><g class="shape"><path d="M895 94h116v66H895z" class="stroke-B1 fill-B5 s0"/></g><text x="953" y="132.5" class="text-bold fill-N1 s2">F(x) + G(x)</text></g><g ><g class="shape"><path d="M910 236h85v66h-85z" class="stroke-B1 fill-B5 s0"/></g><text x="952.5" y="274.5" class="text-bold fill-N1 s2">c·F(x)</text></g><g ><g class="shape"><path d="M900 378h106v66H900z" class="stroke-B1 fill-B5 s0"/></g><text x="953" y="416.5" class="text-bold fill-N1 s2">F(x)·G(x)</text></g><g ><g class="shape"><path d="M910 520h86v66h-86z" class="stroke-B1 fill-B5 s0"/></g><text x="953" y="558.5" class="text-bold fill-N1 s2">x·F(x)</text></g><g ><g class="shape"><path d="M884 662h137v66H884z" class="stroke-B1 fill-B5 s0"/></g><text x="952.5" y="700.5" class="text-bold fill-N1 s2">(F(x) − f₀) / x</text></g><g ><g class="shape"><path d="M888 804h129v66H888z" class="stroke-B1 fill-B5 s0"/></g><text x="952.5" y="842.5" class="text-bold fill-N1 s2">F(x) / (1 − x)</text></g><g ><g class="shape"><path d="M904 946h97v66h-97z" class="stroke-B1 fill-B5 s0"/></g><text x="952.5" y="984.5" class="text-bold fill-N1 s2">x·F′(x)</text></g><marker id="mk-d2-1194820114-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1194820114-3488378134)" d="M453 127h437.5" class="connection stroke-B1 s0" mask="url(#d2-1194820114)"/><path fill="none" marker-end="url(#mk-d2-1194820114-3488378134)" d="M470 269h436" class="connection stroke-B1 s0" mask="url(#d2-1194820114)"/><path fill="none" marker-end="url(#mk-d2-1194820114-3488378134)" d="M495 411h400.5" class="connection stroke-B1 s0" mask="url(#d2-1194820114)"/><path fill="none" marker-end="url(#mk-d2-1194820114-3488378134)" d="M487 553h418.5" class="connection stroke-B1 s0" mask="url(#d2-1194820114)"/><path fill="none" marker-end="url(#mk-d2-1194820114-3488378134)" d="M467.5 695H880" class="connection stroke-B1 s0" mask="url(#d2-1194820114)"/><path fill="none" marker-end="url(#mk-d2-1194820114-3488378134)" d="M455.5 837H884" class="connection stroke-B1 s0" mask="url(#d2-1194820114)"/><path fill="none" marker-end="url(#mk-d2-1194820114-3488378134)" d="M461 979h439" class="connection stroke-B1 s0" mask="url(#d2-1194820114)"/><mask id="d2-1194820114" width="1282" height="1468" x="-51" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-51-85h1282v1468H-51z"/></mask></svg>