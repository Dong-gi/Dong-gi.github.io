<svg xmlns="http://www.w3.org/2000/svg" width="1953" height="906" class="d2-2086512969 d2-svg" viewBox="-91 -121 1953 906"><rect width="1953" height="906" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2086512969 .fill-N1{fill:#0a0f25}.d2-2086512969 .fill-N2{fill:#676c7e}.d2-2086512969 .fill-B4{fill:#e3e9fd}.d2-2086512969 .fill-B5{fill:#edf0fd}.d2-2086512969 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M10 20h621v664H10z" class="stroke-B1 fill-B4 s0"/></g><text x="320.5" y="7" class="text-bold fill-N1 s1">정의가 필요한 것은 셋뿐이다</text></g><g ><g class="shape"><path d="M719 289h789v126H719z" class="stroke-B1 fill-B4 s0"/></g><text x="1113.5" y="276" class="text-bold fill-N1 s1">나머지 셋은 뒤집거나 겹친 것이다</text></g><text x="927" y="81" class="fill-N1 s2"><tspan x="927" dy="0">역은 성립하지 않는다</tspan><tspan x="927" dy="17.25">· 2x = O(x) 이지만 2x ∼ x 도 아니고 2x = o(x) 도 아니다</tspan><tspan x="927" dy="17.25">· x = Θ(x) 이지만 x ∼ 2x 는 거짓이다</tspan><tspan x="927" dy="17.25">· f = o(g) 이면 g = O(f) 는 거짓이다</tspan></text><text x="1473" y="73" class="fill-N1 s2"><tspan x="1473" dy="0">관계로 보면 성질이 갈린다.</tspan><tspan x="1473" dy="17">∼ 와 Θ 는 동치관계다(반사·대칭·추이).</tspan><tspan x="1473" dy="17">o 와 ω 는 강한 부분순서다(반사적이지 않다).</tspan><tspan x="1473" dy="17">O 는 반사적·추이적이지만 반대칭이 아니라 부분순서가 되지 못한다.</tspan><tspan x="1473" dy="17">그리고 어느 것도 전순서가 아니다 — x 와 x·sin²x + 1 은 서로 견줄 수 없다</tspan></text><g ><g class="shape"><path d="M105 50h246v98H105z" class="stroke-B1 fill-B5 s0"/></g><text x="228" y="88.5" class="text-bold fill-N1 s2"><tspan x="228" dy="0">f = o(g)</tspan><tspan x="228" dy="17.667">lim f/g = 0</tspan><tspan x="228" dy="17.667">‘g 보다 확실히 느리다’</tspan></text></g><g ><g class="shape"><path d="M40 556h338v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="209" y="594.5" class="text-bold fill-N1 s2"><tspan x="209" dy="0">f = O(g)</tspan><tspan x="209" dy="17.667">어떤 c, x₀ 가 있어 x ≥ x₀ 에서 |f| ≤ c·g</tspan><tspan x="209" dy="17.667">‘g 보다 크게 빠르지는 않다’</tspan></text></g><g ><g class="shape"><path d="M411 50h190v98H411z" class="stroke-B1 fill-B5 s0"/></g><text x="506" y="88.5" class="text-bold fill-N1 s2"><tspan x="506" dy="0">f ∼ g</tspan><tspan x="506" dy="17.667">lim f/g = 1</tspan><tspan x="506" dy="17.667">‘앞머리가 같다’</tspan></text></g><g ><g class="shape"><path d="M749 319h171v66H749z" class="stroke-B1 fill-B5 s0"/></g><text x="834.5" y="357.5" class="text-bold fill-N1 s2">f = Ω(g) ::= g = O(f)</text></g><g ><g class="shape"><path d="M980 319h169v66H980z" class="stroke-B1 fill-B5 s0"/></g><text x="1064.5" y="357.5" class="text-bold fill-N1 s2">f = ω(g) ::= g = o(f)</text></g><g ><g class="shape"><path d="M1209 319h269v66h-269z" class="stroke-B1 fill-B5 s0"/></g><text x="1343.5" y="357.5" class="text-bold fill-N1 s2">f = Θ(g) ::= f = O(g) 이고 g = O(f)</text></g><marker id="mk-d2-2086512969-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2086512969-3488378134)" d="M174.292 148.869C123.75 196.3 110.75 220.6 110.75 238.75V393.5c0 24.9 10.8 114.2 51.349 160.005" class="connection stroke-B1 s0" mask="url(#d2-2086512969)"/><text x="110.5" y="353" class="text-italic fill-N2 s2">함의한다</text><path fill="none" marker-end="url(#mk-d2-2086512969-3488378134)" d="M411.483 148.437C321.25 196.3 298.25 220.6 298.25 238.75V393.5c0 24.9-9.8 114.2-46.495 159.882" class="connection stroke-B1 s0" mask="url(#d2-2086512969)"/><text x="298.5" y="332" class="text-italic fill-N2 s2">함의한다</text><path fill="none" marker-end="url(#mk-d2-2086512969-3488378134)" d="M545.487 149.072C582.65 196.3 715.65 282.6 1205.274 336.562" class="connection stroke-B1 s0" mask="url(#d2-2086512969)"/><text x="852.5" y="303" class="text-italic fill-N2 s2">함의한다</text><path fill="none" marker-end="url(#mk-d2-2086512969-3488378134)" d="M1343.5 387c0 38-929.2 120.7-1026.4 167.757" class="connection stroke-B1 s0" mask="url(#d2-2086512969)"/><text x="843" y="475" class="text-italic fill-N2 s2">정의상</text><path fill="none" marker-end="url(#mk-d2-2086512969-3488378134)" d="M301.4 148.63c69.55 47.67 205.55 134.97 674.38 192.88" class="connection stroke-B1 s0" mask="url(#d2-2086512969)"/><text x="620.5" y="303" class="text-italic fill-N2 s2">방향만 뒤집은 것</text><mask id="d2-2086512969" width="1953" height="906" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h1953v906H-91z"/><path d="M70 337h81v21H70zM258 316h81v21h-81zM812 287h81v21h-81zM812 459h62v21h-62zM548 287h145v21H548z"/></mask></svg>