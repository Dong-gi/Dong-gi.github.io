<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="1362" class="d2-3274365057 d2-svg" viewBox="-88 -89 1062 1362"><rect width="1062" height="1362" x="-88" y="-89" rx="0" style="fill:#fff"/><style>.d2-3274365057 .text-bold{font-weight:700}.d2-3274365057 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3274365057 .fill-N1{fill:#0a0f25}.d2-3274365057 .fill-N2{fill:#676c7e}.d2-3274365057 .fill-B4{fill:#e3e9fd}.d2-3274365057 .fill-B5{fill:#edf0fd}.d2-3274365057 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M127 57h641v477H127z" class="stroke-B1 fill-B4 s0"/></g><text x="447.5" y="521" class="text-bold fill-N1 s1">정의가 필요한 것은 셋뿐이다</text></g><g ><g class="shape"><path d="M124 715h749v166H124z" class="stroke-B1 fill-B4 s0"/></g><text x="614" y="868" class="text-bold fill-N1 s1">나머지 셋은 뒤집거나 겹친 것이다</text></g><path fill="transparent" stroke="transparent" d="M142 946h630v226H142z" class="shape s0"/><g ><g class="shape"><path d="M260 386h338v98H260z" class="stroke-B1 fill-B5 s0"/></g><text x="429" y="424.5" class="text-bold fill-N1 s2"><tspan x="429" dy="0">f = O(g)</tspan><tspan x="429" dy="17.667">어떤 c, x₀ 가 있어 x ≥ x₀ 에서 |f| ≤ c·g</tspan><tspan x="429" dy="17.667">‘g 보다 크게 빠르지는 않다’</tspan></text></g><g ><g class="shape"><path d="M177 107h190v98H177z" class="stroke-B1 fill-B5 s0"/></g><text x="272" y="145.5" class="text-bold fill-N1 s2"><tspan x="272" dy="0">f ∼ g</tspan><tspan x="272" dy="17.667">lim f/g = 1</tspan><tspan x="272" dy="17.667">‘앞머리가 같다’</tspan></text></g><g ><g class="shape"><path d="M472 107h246v98H472z" class="stroke-B1 fill-B5 s0"/></g><text x="595" y="145.5" class="text-bold fill-N1 s2"><tspan x="595" dy="0">f = o(g)</tspan><tspan x="595" dy="17.667">lim f/g = 0</tspan><tspan x="595" dy="17.667">‘g 보다 확실히 느리다’</tspan></text></g><g ><g class="shape"><path d="M174 765h269v66H174z" class="stroke-B1 fill-B5 s0"/></g><text x="308.5" y="803.5" class="text-bold fill-N1 s2">f = Θ(g) ::= f = O(g) 이고 g = O(f)</text></g><g ><g class="shape"><path d="M463 765h169v66H463z" class="stroke-B1 fill-B5 s0"/></g><text x="547.5" y="803.5" class="text-bold fill-N1 s2">f = ω(g) ::= g = o(f)</text></g><g ><g class="shape"><path d="M652 765h171v66H652z" class="stroke-B1 fill-B5 s0"/></g><text x="737.5" y="803.5" class="text-bold fill-N1 s2">f = Ω(g) ::= g = O(f)</text></g><text x="364" y="986" class="fill-N1 s2"><tspan x="364" dy="0">역은 성립하지 않는다</tspan><tspan x="364" dy="17.25">· 2x = O(x) 이지만 2x ∼ x 도 아니고 2x = o(x) 도 아니다</tspan><tspan x="364" dy="17.25">· x = Θ(2x) 이지만 x ∼ 2x 는 거짓이다</tspan><tspan x="364" dy="17.25">· f = o(g) 이면 g = O(f) 는 거짓이다</tspan></text><text x="457" y="1079" class="fill-N1 s2"><tspan x="457" dy="0">관계로 보면 성질이 갈린다.</tspan><tspan x="457" dy="17">∼ 와 Θ 는 동치관계다(반사·대칭·추이).</tspan><tspan x="457" dy="17">o 와 ω 는 강한 부분순서다(반사적이지 않다).</tspan><tspan x="457" dy="17">O 는 반사적·추이적이지만 반대칭이 아니라 부분순서가 되지 못한다.</tspan><tspan x="457" dy="17">그리고 어느 것도 전순서가 아니다 — x 와 x²·sin²x + 1 은 서로 견줄 수 없다</tspan></text><marker id="mk-d2-3274365057-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3274365057-3488378134)" d="M513.583 207v175" class="connection stroke-B1 s0" mask="url(#d2-3274365057)"/><text x="513.5" y="301" class="text-italic fill-N2 s2">함의한다</text><path fill="none" marker-end="url(#mk-d2-3274365057-3488378134)" d="M312.166 207v175" class="connection stroke-B1 s0" mask="url(#d2-3274365057)"/><text x="312.5" y="301" class="text-italic fill-N2 s2">함의한다</text><path fill="none" marker-end="url(#mk-d2-3274365057-3488378134)" d="M219.083 207v554" class="connection stroke-B1 s0" mask="url(#d2-3274365057)"/><text x="219.5" y="491" class="text-italic fill-N2 s2">함의한다</text><path fill="none" marker-end="url(#mk-d2-3274365057-3488378134)" d="M309.083 833v83s0 10-10 10H51s-10 0-10-10V22s0-10 10-10h368.083s10 0 10 10v360" class="connection stroke-B1 s0" mask="url(#d2-3274365057)"/><text x="41" y="275" class="text-italic fill-N2 s2">정의상</text><path fill="none" marker-end="url(#mk-d2-3274365057-3488378134)" d="M638.083 207v362s0 10-10 10h-70s-10 0-10 10v172" class="connection stroke-B1 s0" mask="url(#d2-3274365057)"/><text x="638.5" y="536" class="text-italic fill-N2 s2">방향만 뒤집은 것</text><mask id="d2-3274365057" width="1062" height="1362" x="-88" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-88-89H974v1362H-88z"/><path d="M473 285h81v21h-81zM272 285h81v21h-81zM179 475h81v21h-81zM10 259h62v21H10zM566 520h145v21H566z"/></mask></svg>