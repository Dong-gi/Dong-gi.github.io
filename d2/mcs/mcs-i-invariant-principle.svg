<svg xmlns="http://www.w3.org/2000/svg" width="2588" height="814" class="d2-3953941042 d2-svg" viewBox="-101 -101 2588 814"><rect width="2588" height="814" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3953941042 .fill-N1{fill:#0a0f25}.d2-3953941042 .fill-N2{fill:#676c7e}.d2-3953941042 .fill-B6{fill:#f7f8fe}.d2-3953941042 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M239 0h282v66H239z" class="stroke-B1 fill-B6 s0"/></g><text x="380" y="38.5" class="text-bold fill-N1 s1">① 시작 상태에서 P 가 참이다</text></g><g ><g class="shape"><path d="M188 126h384v98H188z" class="stroke-B1 fill-B6 s0"/></g><text x="380" y="164.5" class="text-bold fill-N1 s1"><tspan x="380" dy="0">② P 가 보존된다</tspan><tspan x="380" dy="17.667">P(q) 이고 q → r 이면 P(r) 이다</tspan><tspan x="380" dy="17.667">(도달 가능하지 않은 q 에서도 요구된다)</tspan></text></g><g ><g class="shape"><ellipse cx="1400" cy="104.5" class="shape stroke-B1 fill-B6 s0" rx="266" ry="88.5"/></g><text x="1400" y="110" class="text-bold fill-N1 s1">도달 가능한 모든 상태에서 P 가 참이다</text></g><g ><g class="shape"><path d="M2174 63h212v82h-212z" class="stroke-B1 fill-B6 s0"/></g><text x="2280" y="101.5" class="text-bold fill-N1 s1"><tspan x="2280" dy="0">부분 정당성</tspan><tspan x="2280" dy="18.5">멈췄다면 답이 옳다</tspan></text></g><g ><g class="shape"><path d="M1284 304h232v82h-232z" class="stroke-B1 fill-B6 s0"/></g><text x="1400" y="342.5" class="text-bold fill-N1 s1"><tspan x="1400" dy="0">종료성</tspan><tspan x="1400" dy="18.5">언젠가 반드시 멈춘다</tspan></text></g><g ><g class="shape"><path d="M244 304h272v82H244z" class="stroke-B1 fill-B6 s0"/></g><text x="380" y="342.5" class="text-bold fill-N1 s1"><tspan x="380" dy="0">측도 f : 상태 → ℕ</tspan><tspan x="380" dy="18.5">걸음마다 반드시 줄어든다</tspan></text></g><text x="380" y="462" class="fill-N1 s1"><tspan x="380" dy="0">①과 ②는 그대로 귀납법이다. 걸음 수 n 에 대한 귀납 가설을</tspan><tspan x="380" dy="17.667">P(n) ::= ‘n 걸음에 닿을 수 있는 상태는 모두 성질 P 를 갖는다’ 로 두면</tspan><tspan x="380" dy="17.667">①이 기저 단계, ②가 귀납 단계다. 불변량 원리는 귀납법을 상태 기계에 맞게 다시 적은 것이다</tspan></text><text x="380.5" y="575" class="fill-N1 s1"><tspan x="380.5" dy="0">②를 도달 가능한 상태에서만 확인하면 안 된다. 그러면 ‘도달 가능한 상태에서 참’ 을</tspan><tspan x="380.5" dy="17.667">증명하려고 ‘도달 가능한 상태’ 를 이미 아는 셈이 되어 순환이다.</tspan><tspan x="380.5" dy="17.667">반대로 불변량의 부정은 불변량이 아니다 — 거짓인 상태에서 참인 상태로 갈 수 있다</tspan></text><marker id="mk-d2-3953941042-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3953941042-3488378134)" d="M523 33c338.8 0 466.6 6.6 633.047 32.388" class="connection stroke-B1 s0" mask="url(#d2-3953941042)"/><path fill="none" marker-end="url(#mk-d2-3953941042-3488378134)" d="M574 175c298 0 415.4-6.6 581.048-32.385" class="connection stroke-B1 s0" mask="url(#d2-3953941042)"/><path fill="none" marker-end="url(#mk-d2-3953941042-3488378134)" d="M1668 104h502" class="connection stroke-B1 s0" mask="url(#d2-3953941042)"/><text x="1920" y="110" class="text-italic fill-N2 s1">멈추는 상태에 P 를 대입한다</text><path fill="none" marker-end="url(#mk-d2-3953941042-3488378134)" d="M518 344.75h762" class="connection stroke-B1 s0" mask="url(#d2-3953941042)"/><text x="900" y="350" class="text-italic fill-N2 s1">정렬성 원리</text><mask id="d2-3953941042" width="2588" height="814" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2588v814H-101z"/><path d="M1801 94h238v21h-238zM848 334h104v21H848z"/></mask></svg>