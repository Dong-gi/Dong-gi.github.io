<svg xmlns="http://www.w3.org/2000/svg" width="1287" height="999" class="d2-2849544217 d2-svg" viewBox="-101 -101 1287 999"><rect width="1287" height="999" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2849544217 .fill-N1{fill:#0a0f25}.d2-2849544217 .fill-N2{fill:#676c7e}.d2-2849544217 .fill-B6{fill:#f7f8fe}.d2-2849544217 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 16h282v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="141" y="54.5" class="text-bold fill-N1 s1">① 시작 상태에서 P 가 참이다</text></g><g ><g class="shape"><path d="M342 0h384v98H342z" class="stroke-B1 fill-B6 s0"/></g><text x="534" y="38.5" class="text-bold fill-N1 s1"><tspan x="534" dy="0">② P 가 보존된다</tspan><tspan x="534" dy="17.667">P(q) 이고 q → r 이면 P(r) 이다</tspan><tspan x="534" dy="17.667">(도달 가능하지 않은 q 에서도 요구된다)</tspan></text></g><g ><g class="shape"><ellipse cx="338" cy="307.5" class="shape stroke-B1 fill-B6 s0" rx="266" ry="88.5"/></g><text x="338" y="313" class="text-bold fill-N1 s1">도달 가능한 모든 상태에서 P 가 참이다</text></g><g ><g class="shape"><path d="M232 517h212v82H232z" class="stroke-B1 fill-B6 s0"/></g><text x="338" y="555.5" class="text-bold fill-N1 s1"><tspan x="338" dy="0">부분 정당성</tspan><tspan x="338" dy="18.5">멈췄다면 답이 옳다</tspan></text></g><g ><g class="shape"><path d="M833 267h232v82H833z" class="stroke-B1 fill-B6 s0"/></g><text x="949" y="305.5" class="text-bold fill-N1 s1"><tspan x="949" dy="0">종료성</tspan><tspan x="949" dy="18.5">언젠가 반드시 멈춘다</tspan></text></g><g ><g class="shape"><path d="M813 8h272v82H813z" class="stroke-B1 fill-B6 s0"/></g><text x="949" y="46.5" class="text-bold fill-N1 s1"><tspan x="949" dy="0">측도 f : 상태 → ℕ</tspan><tspan x="949" dy="18.5">걸음마다 반드시 줄어든다</tspan></text></g><path fill="transparent" stroke="transparent" d="M138 619h808v178H138z" class="shape s0"/><text x="542" y="659" class="fill-N1 s1"><tspan x="542" dy="0">①과 ②는 그대로 귀납법이다. 걸음 수 n 에 대한 귀납 가설을</tspan><tspan x="542" dy="17.667">P(n) ::= ‘n 걸음에 닿을 수 있는 상태는 모두 성질 P 를 갖는다’ 로 두면</tspan><tspan x="542" dy="17.667">①이 기저 단계, ②가 귀납 단계다. 불변량 원리는 귀납법을 상태 기계에 맞게 다시 적은 것이다</tspan></text><text x="512.5" y="736" class="fill-N1 s1"><tspan x="512.5" dy="0">②를 도달 가능한 상태에서만 확인하면 안 된다. 그러면 ‘도달 가능한 상태에서 참’ 을</tspan><tspan x="512.5" dy="17.667">증명하려고 ‘도달 가능한 상태’ 를 이미 아는 셈이 되어 순환이다.</tspan><tspan x="512.5" dy="17.667">반대로 불변량의 부정은 불변량이 아니다 — 거짓인 상태에서 참인 상태로 갈 수 있다</tspan></text><marker id="mk-d2-2849544217-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2849544217-3488378134)" d="M141 83.5c0 59.6 17.6 88.7 84.844 141.043" class="connection stroke-B1 s0" mask="url(#d2-2849544217)"/><path fill="none" marker-end="url(#mk-d2-2849544217-3488378134)" d="M534 99.5c0 46.8-17.6 72.7-84.844 125.043" class="connection stroke-B1 s0" mask="url(#d2-2849544217)"/><path fill="none" marker-end="url(#mk-d2-2849544217-3488378134)" d="M337.983 398c-.383 46.4-.483 70.7-.483 115.5" class="connection stroke-B1 s0" mask="url(#d2-2849544217)"/><text x="338" y="462" class="text-italic fill-N2 s1">멈추는 상태에 P 를 대입한다</text><path fill="none" marker-end="url(#mk-d2-2849544217-3488378134)" d="M949 91.5v171" class="connection stroke-B1 s0" mask="url(#d2-2849544217)"/><text x="949" y="184" class="text-italic fill-N2 s1">정렬성 원리</text><mask id="d2-2849544217" width="1287" height="999" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1287v999H-101z"/><path d="M219 446h238v21H219zM897 168h104v21H897z"/></mask></svg>