<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1107" class="d2-5787486 d2-svg" viewBox="-89 -89 1420 1107"><rect width="1420" height="1107" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-5787486 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-5787486 .fill-N1{fill:#0a0f25}.d2-5787486 .fill-B4{fill:#e3e9fd}.d2-5787486 .fill-B5{fill:#edf0fd}.d2-5787486 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M12 308h1184v214H12z" class="stroke-B1 fill-B4 s0"/></g><text x="604" y="341" class="text-bold fill-N1 s1">무엇을 재는가</text></g><g ><g class="shape"><path d="M678 12h255v114H678z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="805.5" y="50.5" class="text-bold fill-N1 s2"><tspan x="805.5" dy="0">이분폭</tspan><tspan x="805.5" dy="17.25">입력 절반과 출력 절반을</tspan><tspan x="805.5" dy="17.25">떼어내려면 끊어야 하는</tspan><tspan x="805.5" dy="17.25">최소 선 수</tspan></text></g><g ><g class="shape"><path d="M19 612h1211v182H19z" class="stroke-B1 fill-B4 s0"/></g><text x="624.5" y="781" class="text-bold fill-N1 s1">맞바꿈이 일어나는 곳</text></g><text x="454" y="880" class="text-bold fill-N1 s2"><tspan x="454" dy="0">그래서 표 하나로 견주어야 한다.</tspan><tspan x="454" dy="17.667">다섯 칸을 모두 좋게 만든 것이 베네시망이고,</tspan><tspan x="454" dy="17.667">그 값은 스위치 수 2N log N 이다</tspan></text><g ><g class="shape"><path d="M62 358h255v114H62z" class="stroke-B1 fill-B5 s0"/></g><text x="189.5" y="396.5" class="text-bold fill-N1 s2"><tspan x="189.5" dy="0">지름</tspan><tspan x="189.5" dy="17.25">입력에서 출력까지</tspan><tspan x="189.5" dy="17.25">가장 먼 최단경로의 길이</tspan><tspan x="189.5" dy="17.25">= 최악의 지연</tspan></text></g><g ><g class="shape"><path d="M337 358h299v114H337z" class="stroke-B1 fill-B5 s0"/></g><text x="486.5" y="396.5" class="text-bold fill-N1 s2"><tspan x="486.5" dy="0">스위치 크기</tspan><tspan x="486.5" dy="17.25">한 스위치에 붙는</tspan><tspan x="486.5" dy="17.25">들어오는 선과 나가는 선의 수</tspan><tspan x="486.5" dy="17.25">= 부품 하나의 값</tspan></text></g><g ><g class="shape"><path d="M656 358h299v114H656z" class="stroke-B1 fill-B5 s0"/></g><text x="805.5" y="396.5" class="text-bold fill-N1 s2"><tspan x="805.5" dy="0">혼잡도</tspan><tspan x="805.5" dy="17.25">가장 나쁜 순열에 대해</tspan><tspan x="805.5" dy="17.25">가장 좋은 라우팅을 골랐을 때</tspan><tspan x="805.5" dy="17.25">한 스위치에 몰리는 경로 수</tspan></text></g><g ><g class="shape"><path d="M975 358h171v114H975z" class="stroke-B1 fill-B5 s0"/></g><text x="1060.5" y="396.5" class="text-bold fill-N1 s2"><tspan x="1060.5" dy="0">스위치 수</tspan><tspan x="1060.5" dy="17.25">망 전체가 쓰는</tspan><tspan x="1060.5" dy="17.25">스위치의 개수</tspan><tspan x="1060.5" dy="17.25">= 전체 값</tspan></text></g><g ><g class="shape"><path d="M69 662h360v82H69z" class="stroke-B1 fill-B5 s0"/></g><text x="249" y="700.5" class="text-bold fill-N1 s2"><tspan x="249" dy="0">지름을 줄이려고 스위치를 크게 하면</tspan><tspan x="249" dy="18.5">문제를 스위치 속에 숨긴 것이 된다</tspan></text></g><g ><g class="shape"><path d="M449 662h369v82H449z" class="stroke-B1 fill-B5 s0"/></g><text x="633.5" y="700.5" class="text-bold fill-N1 s2"><tspan x="633.5" dy="0">혼잡도를 1 로 낮추려면 이분폭이</tspan><tspan x="633.5" dy="18.5">N/2 이상이어야 하고, 배선이 늘어난다</tspan></text></g><g ><g class="shape"><path d="M838 662h342v82H838z" class="stroke-B1 fill-B5 s0"/></g><text x="1009" y="700.5" class="text-bold fill-N1 s2"><tspan x="1009" dy="0">스위치를 아끼면 허리가 얇아지고,</tspan><tspan x="1009" dy="18.5">허리가 얇으면 혼잡도가 커진다</tspan></text></g><marker id="mk-d2-5787486-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-5787486-3488378134)" d="M805.5 128v226" class="connection stroke-B1 s0" mask="url(#d2-5787486)"/><text x="805.5" y="240" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px"><tspan x="805.5" dy="0">혼잡도 ≥ (N/2) / 이분폭</tspan><tspan x="805.5" dy="18.5">(비둘기집 원리)</tspan></text><path fill="none" marker-end="url(#mk-d2-5787486-3488378134)" d="M486.5 474v83s0 10-10 10h-157s-10 0-10 10v81" class="connection stroke-B1 s0" mask="url(#d2-5787486)"/><path fill="none" marker-end="url(#mk-d2-5787486-3488378134)" d="M805.5 474v83s0 10-10 10H644s-10 0-10 10v81" class="connection stroke-B1 s0" mask="url(#d2-5787486)"/><path fill="none" marker-end="url(#mk-d2-5787486-3488378134)" d="M1009.5 474v184" class="connection stroke-B1 s0" mask="url(#d2-5787486)"/><path fill="none" marker-end="url(#mk-d2-5787486-3488378134)" d="M189.5 474v184" class="connection stroke-B1 s0" mask="url(#d2-5787486)"/><path fill="none" marker-end="url(#mk-d2-5787486-3488378134)" d="M454 796v64" class="connection stroke-B1 s0" mask="url(#d2-5787486)"/><mask id="d2-5787486" width="1420" height="1107" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1420v1107H-89z"/><path d="M715 224h181v37H715z"/></mask></svg>