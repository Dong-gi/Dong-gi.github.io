<svg xmlns="http://www.w3.org/2000/svg" width="2775" height="938" class="d2-2935371107 d2-svg" viewBox="-101 -85 2775 938"><rect width="2775" height="938" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2935371107 .fill-N1{fill:#0a0f25}.d2-2935371107 .fill-B4{fill:#e3e9fd}.d2-2935371107 .fill-B5{fill:#edf0fd}.d2-2935371107 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M728 56h359v696H728z" class="stroke-B1 fill-B4 s0"/></g><text x="907.5" y="43" class="text-bold fill-N1 s1">무엇을 재는가</text></g><g ><g class="shape"><path d="M0 434h255v114H0z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="127.5" y="472.5" class="text-bold fill-N1 s2"><tspan x="127.5" dy="0">이분폭</tspan><tspan x="127.5" dy="17.25">입력 절반과 출력 절반을</tspan><tspan x="127.5" dy="17.25">떼어내려면 끊어야 하는</tspan><tspan x="127.5" dy="17.25">최소 간선 수</tspan></text></g><g ><g class="shape"><path d="M1461 159h429v577h-429z" class="stroke-B1 fill-B4 s0"/></g><text x="1675.5" y="146" class="text-bold fill-N1 s1">맞바꿈이 일어나는 곳</text></g><text x="2379" y="481" class="text-bold fill-N1 s2"><tspan x="2379" dy="0">그래서 표 하나로 견주어야 한다.</tspan><tspan x="2379" dy="17.667">다섯 칸을 모두 좋게 만든 것이 베네시망이고,</tspan><tspan x="2379" dy="17.667">그 값은 스위치 수 2N log N 이다</tspan></text><g ><g class="shape"><path d="M780 260h255v114H780z" class="stroke-B1 fill-B5 s0"/></g><text x="907.5" y="298.5" class="text-bold fill-N1 s2"><tspan x="907.5" dy="0">지름</tspan><tspan x="907.5" dy="17.25">입력에서 출력까지</tspan><tspan x="907.5" dy="17.25">가장 먼 최단경로의 길이</tspan><tspan x="907.5" dy="17.25">= 최악의 지연</tspan></text></g><g ><g class="shape"><path d="M758 86h299v114H758z" class="stroke-B1 fill-B5 s0"/></g><text x="907.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="907.5" dy="0">스위치 크기</tspan><tspan x="907.5" dy="17.25">한 스위치에 붙는</tspan><tspan x="907.5" dy="17.25">들어오는 선과 나가는 선의 수</tspan><tspan x="907.5" dy="17.25">= 부품 하나의 값</tspan></text></g><g ><g class="shape"><path d="M822 608h171v114H822z" class="stroke-B1 fill-B5 s0"/></g><text x="907.5" y="646.5" class="text-bold fill-N1 s2"><tspan x="907.5" dy="0">스위치 수</tspan><tspan x="907.5" dy="17.25">망 전체가 쓰는</tspan><tspan x="907.5" dy="17.25">스위치의 개수</tspan><tspan x="907.5" dy="17.25">= 전체 값</tspan></text></g><g ><g class="shape"><path d="M758 434h299v114H758z" class="stroke-B1 fill-B5 s0"/></g><text x="907.5" y="472.5" class="text-bold fill-N1 s2"><tspan x="907.5" dy="0">혼잡도</tspan><tspan x="907.5" dy="17.25">가장 나쁜 순열에 대해</tspan><tspan x="907.5" dy="17.25">가장 좋은 라우팅을 골랐을 때</tspan><tspan x="907.5" dy="17.25">한 스위치에 몰리는 경로 수</tspan></text></g><g ><g class="shape"><path d="M1495 189h360v82h-360z" class="stroke-B1 fill-B5 s0"/></g><text x="1675" y="227.5" class="text-bold fill-N1 s2"><tspan x="1675" dy="0">지름을 줄이려고 스위치를 크게 하면</tspan><tspan x="1675" dy="18.5">문제를 스위치 속에 숨긴 것이 된다</tspan></text></g><g ><g class="shape"><path d="M1491 450h369v82h-369z" class="stroke-B1 fill-B5 s0"/></g><text x="1675.5" y="488.5" class="text-bold fill-N1 s2"><tspan x="1675.5" dy="0">혼잡도를 1 로 낮추려면 이분폭이</tspan><tspan x="1675.5" dy="18.5">N/2 이상이어야 하고, 배선이 늘어난다</tspan></text></g><g ><g class="shape"><path d="M1504 624h342v82h-342z" class="stroke-B1 fill-B5 s0"/></g><text x="1675" y="662.5" class="text-bold fill-N1 s2"><tspan x="1675" dy="0">스위치를 아끼면 허리가 얇아지고,</tspan><tspan x="1675" dy="18.5">허리가 얇으면 혼잡도가 커진다</tspan></text></g><marker id="mk-d2-2935371107-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2935371107-3488378134)" d="M257 491h496.5" class="connection stroke-B1 s0" mask="url(#d2-2935371107)"/><text x="506.5" y="489" style="fill:#676c7e;text-anchor:middle;font-size:16px"><tspan x="506.5" dy="0">혼잡도 ≥ (N/2) / 이분폭</tspan><tspan x="506.5" dy="18.5">(비둘기집 원리)</tspan></text><path fill="none" marker-end="url(#mk-d2-2935371107-3488378134)" d="M1059.5 143h159.75c32.55 0 193.75 9.2 313.915 44.862" class="connection stroke-B1 s0" mask="url(#d2-2935371107)"/><path fill="none" marker-end="url(#mk-d2-2935371107-3488378134)" d="M1059.5 491h427" class="connection stroke-B1 s0" mask="url(#d2-2935371107)"/><path fill="none" marker-end="url(#mk-d2-2935371107-3488378134)" d="M995.5 665H1500" class="connection stroke-B1 s0" mask="url(#d2-2935371107)"/><path fill="none" marker-end="url(#mk-d2-2935371107-3488378134)" d="M1037.5 317h181.75c32.55 0 193.75-9.2 313.915-44.862" class="connection stroke-B1 s0" mask="url(#d2-2935371107)"/><path fill="none" marker-end="url(#mk-d2-2935371107-3488378134)" d="M1891.5 491h290" class="connection stroke-B1 s0" mask="url(#d2-2935371107)"/><mask id="d2-2935371107" width="2775" height="938" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h2775v938H-101z"/><path d="M416 473h181v37H416z"/></mask></svg>