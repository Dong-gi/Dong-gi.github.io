<svg xmlns="http://www.w3.org/2000/svg" width="1171" height="1171" class="d2-4096394673 d2-svg" viewBox="-89 -89 1171 1171"><rect width="1171" height="1171" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-4096394673 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4096394673 .fill-N1{fill:#0a0f25}.d2-4096394673 .fill-B4{fill:#e3e9fd}.d2-4096394673 .fill-B5{fill:#edf0fd}.d2-4096394673 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M12 308h969v246H12z" class="stroke-B1 fill-B4 s0"/></g><text x="496.5" y="341" class="text-bold fill-N1 s1">무엇을 재는가</text></g><g ><g class="shape"><path d="M495 12h255v114H495z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="622.5" y="50.5" class="text-bold fill-N1 s2"><tspan x="622.5" dy="0">이분폭</tspan><tspan x="622.5" dy="17.25">입력 절반과 출력 절반을</tspan><tspan x="622.5" dy="17.25">떼어내려면 끊어야 하는</tspan><tspan x="622.5" dy="17.25">최소 선 수</tspan></text></g><g ><g class="shape"><path d="M88 644h852v214H88z" class="stroke-B1 fill-B4 s0"/></g><text x="514" y="845" class="text-bold fill-N1 s1">맞바꿈이 일어나는 곳</text></g><text x="417" y="944" class="text-bold fill-N1 s2"><tspan x="417" dy="0">그래서 표 하나로 견주어야 한다.</tspan><tspan x="417" dy="17.667">다섯 칸을 모두 좋게 만든 것이 베네시망이고,</tspan><tspan x="417" dy="17.667">그 값은 스위치 수 2N log N 이다</tspan></text><g ><g class="shape"><path d="M62 374h212v130H62z" class="stroke-B1 fill-B5 s0"/></g><text x="168" y="412.5" class="text-bold fill-N1 s2"><tspan x="168" dy="0">지름</tspan><tspan x="168" dy="17">입력에서 출력까지</tspan><tspan x="168" dy="17">가장 먼 최단경로의</tspan><tspan x="168" dy="17">길이</tspan><tspan x="168" dy="17">= 최악의 지연</tspan></text></g><g ><g class="shape"><path d="M294 374h191v130H294z" class="stroke-B1 fill-B5 s0"/></g><text x="389.5" y="412.5" class="text-bold fill-N1 s2"><tspan x="389.5" dy="0">스위치 크기</tspan><tspan x="389.5" dy="17">한 스위치에 붙는</tspan><tspan x="389.5" dy="17">들어오는 선과</tspan><tspan x="389.5" dy="17">나가는 선의 수</tspan><tspan x="389.5" dy="17">= 부품 하나의 값</tspan></text></g><g ><g class="shape"><path d="M505 358h235v146H505z" class="stroke-B1 fill-B5 s0"/></g><text x="622.5" y="396.5" class="text-bold fill-N1 s2"><tspan x="622.5" dy="0">혼잡도</tspan><tspan x="622.5" dy="16.833">가장 나쁜 순열에 대해</tspan><tspan x="622.5" dy="16.833">가장 좋은 라우팅을</tspan><tspan x="622.5" dy="16.833">골랐을 때</tspan><tspan x="622.5" dy="16.833">한 스위치에 몰리는</tspan><tspan x="622.5" dy="16.833">경로 수</tspan></text></g><g ><g class="shape"><path d="M760 390h171v114H760z" class="stroke-B1 fill-B5 s0"/></g><text x="845.5" y="428.5" class="text-bold fill-N1 s2"><tspan x="845.5" dy="0">스위치 수</tspan><tspan x="845.5" dy="17.25">망 전체가 쓰는</tspan><tspan x="845.5" dy="17.25">스위치의 개수</tspan><tspan x="845.5" dy="17.25">= 전체 값</tspan></text></g><g ><g class="shape"><path d="M138 694h212v114H138z" class="stroke-B1 fill-B5 s0"/></g><text x="244" y="732.5" class="text-bold fill-N1 s2"><tspan x="244" dy="0">지름을 줄이려고</tspan><tspan x="244" dy="17.25">스위치를 크게 하면</tspan><tspan x="244" dy="17.25">문제를 스위치 속에</tspan><tspan x="244" dy="17.25">숨긴 것이 된다</tspan></text></g><g ><g class="shape"><path d="M370 694h306v98H370z" class="stroke-B1 fill-B5 s0"/></g><text x="523" y="732.5" class="text-bold fill-N1 s2"><tspan x="523" dy="0">혼잡도를 1 로 낮추려면</tspan><tspan x="523" dy="17.667">이분폭이 N/2 이상이어야 하고,</tspan><tspan x="523" dy="17.667">배선이 늘어난다</tspan></text></g><g ><g class="shape"><path d="M696 694h194v114H696z" class="stroke-B1 fill-B5 s0"/></g><text x="793" y="732.5" class="text-bold fill-N1 s2"><tspan x="793" dy="0">스위치를 아끼면</tspan><tspan x="793" dy="17.25">허리가 얇아지고,</tspan><tspan x="793" dy="17.25">허리가 얇으면</tspan><tspan x="793" dy="17.25">혼잡도가 커진다</tspan></text></g><marker id="mk-d2-4096394673-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4096394673-3488378134)" d="M622.5 128v226" class="connection stroke-B1 s0" mask="url(#d2-4096394673)"/><text x="622.5" y="240" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px"><tspan x="622.5" dy="0">혼잡도 ≥ (N/2) / 이분폭</tspan><tspan x="622.5" dy="18.5">(비둘기집 원리)</tspan></text><path fill="none" marker-end="url(#mk-d2-4096394673-3488378134)" d="M389.5 506v83s0 10-10 10h-90s-10 0-10 10v81" class="connection stroke-B1 s0" mask="url(#d2-4096394673)"/><path fill="none" marker-end="url(#mk-d2-4096394673-3488378134)" d="M622.5 506v184" class="connection stroke-B1 s0" mask="url(#d2-4096394673)"/><path fill="none" marker-end="url(#mk-d2-4096394673-3488378134)" d="M793.166 506v184" class="connection stroke-B1 s0" mask="url(#d2-4096394673)"/><path fill="none" marker-end="url(#mk-d2-4096394673-3488378134)" d="M208.833 506v184" class="connection stroke-B1 s0" mask="url(#d2-4096394673)"/><path fill="none" marker-end="url(#mk-d2-4096394673-3488378134)" d="M417.166 860v64" class="connection stroke-B1 s0" mask="url(#d2-4096394673)"/><mask id="d2-4096394673" width="1171" height="1171" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1171v1171H-89z"/><path d="M532 224h181v37H532z"/></mask></svg>