<svg xmlns="http://www.w3.org/2000/svg" width="1143" height="795" class="d2-1124421112 d2-svg" viewBox="-95 -101 1143 795"><rect width="1143" height="795" x="-95" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1124421112 .fill-N1{fill:#0a0f25}.d2-1124421112 .fill-N2{fill:#676c7e}.d2-1124421112 .fill-B6{fill:#f7f8fe}.d2-1124421112 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><path d="M359 0h262v82H359z" class="stroke-B1 fill-B6 s0"/></g><text x="490" y="38.5" class="text-bold fill-N1 s1"><tspan x="490" dy="0">보통 귀납법</tspan><tspan x="490" dy="18.5">P(0) 그리고 ∀n. P(n) → P(n+1)</tspan></text></g><g ><g class="shape"><path d="M503 203h327v82H503z" class="stroke-B1 fill-B6 s0"/></g><text x="666.5" y="241.5" class="text-bold fill-N1 s1"><tspan x="666.5" dy="0">강한 귀납법</tspan><tspan x="666.5" dy="18.5">P(0) 그리고 ∀n. (∀k ≤ n. P(k)) → P(n+1)</tspan></text></g><g ><g class="shape"><path d="M6 422h482v82H6z" class="stroke-B1 fill-B6 s0"/></g><text x="247" y="460.5" class="text-bold fill-N1 s1"><tspan x="247" dy="0">정렬성 원리</tspan><tspan x="247" dy="18.5">공집합이 아닌 ℕ 의 부분집합에는 최소 원소가 있다</tspan></text></g><text x="762.5" y="461" class="fill-N1 s1"><tspan x="762.5" dy="0">보통 귀납법은 강한 귀납법의 특수한 경우다</tspan><tspan x="762.5" dy="18.5">(P(n) 만 쓰고 나머지 가정을 버리면 된다)</tspan></text><text x="476" y="540" class="fill-N1 s1"><tspan x="476" dy="0">그러면 어느 것으로 쓰는가.</tspan><tspan x="476" dy="17.25">· 귀납법은 귀류법을 쓰지 않아 읽기 쉽고, 증명이 곧 재귀 절차가 된다</tspan><tspan x="476" dy="17.25">· WOP 는 짧아지는 일이 많고, 걸음의 크기가 정해지지 않은 문제에 잘 맞는다</tspan><tspan x="476" dy="17.25">· 정렬집합으로 넓히면 WOP 만 살아남는다 — 8장의 종료성 증명이 그 자리다</tspan></text><marker id="mk-d2-1124421112-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1124421112-3488378134)" d="M562.483 82.498C645.55 130.3 666.75 154.7 666.75 199.5" class="connection stroke-B1 s0" mask="url(#d2-1124421112)"/><text x="638" y="132" class="text-italic fill-N2 s1">가설을 ∀k ≤ n. P(k) 로 바꿔 적는다</text><path fill="none" marker-end="url(#mk-d2-1124421112-3488378134)" d="M574.179 285.327C454.4 339.7 402 367.3 317.389 420.374" class="connection stroke-B1 s0" mask="url(#d2-1124421112)"/><text x="441.5" y="344" class="text-italic fill-N2 s1"><tspan x="441.5" dy="0">최소 원소가 없다고 하면</tspan><tspan x="441.5" dy="18.5">모든 원소가 밖에 있음을 귀납으로 얻는다</tspan></text><path fill="none" marker-end="url(#mk-d2-1124421112-3488378134)" d="M209.688 420.99C163 367.3 151 331.6 151 298.75s41.5-168.694 203.669-217.321" class="connection stroke-B1 s0" mask="url(#d2-1124421112)"/><text x="171" y="197" class="text-italic fill-N2 s1"><tspan x="171" dy="0">반례 집합의 최소 원소 c 를 잡으면</tspan><tspan x="171" dy="18.5">P(c−1) 은 참이라 P(c) 도 참이 되어 모순</tspan></text><marker id="mk-d2-1124421112-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1124421112-2177206569)" d="M703.812 286.01C750.5 339.7 762.5 371.7 762.5 440.5" class="connection" mask="url(#d2-1124421112)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-1124421112" width="1143" height="795" x="-95" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-95-101h1143v795H-95z"/><path d="M505 116h266v21H505zM268 328h347v37H268zM18 181h306v37H18z"/></mask></svg>