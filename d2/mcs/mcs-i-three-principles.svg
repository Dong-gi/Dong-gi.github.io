<svg xmlns="http://www.w3.org/2000/svg" width="3010" height="473" class="d2-118927264 d2-svg" viewBox="-101 -101 3010 473"><rect width="3010" height="473" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-118927264 .fill-N1{fill:#0a0f25}.d2-118927264 .fill-N2{fill:#676c7e}.d2-118927264 .fill-B6{fill:#f7f8fe}.d2-118927264 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><path d="M183 60h262v82H183z" class="stroke-B1 fill-B6 s0"/></g><text x="314" y="98.5" class="text-bold fill-N1 s1"><tspan x="314" dy="0">보통 귀납법</tspan><tspan x="314" dy="18.5">P(0) 그리고 ∀n. P(n) → P(n+1)</tspan></text></g><g ><g class="shape"><path d="M1273 110h327v82h-327z" class="stroke-B1 fill-B6 s0"/></g><text x="1436.5" y="148.5" class="text-bold fill-N1 s1"><tspan x="1436.5" dy="0">강한 귀납법</tspan><tspan x="1436.5" dy="18.5">P(0) 그리고 ∀n. (∀k ≤ n. P(k)) → P(n+1)</tspan></text></g><g ><g class="shape"><path d="M2326 0h482v82h-482z" class="stroke-B1 fill-B6 s0"/></g><text x="2567" y="38.5" class="text-bold fill-N1 s1"><tspan x="2567" dy="0">정렬성 원리</tspan><tspan x="2567" dy="18.5">공집합이 아닌 ℕ 의 부분집합에는 최소 원소가 있다</tspan></text></g><text x="2567.5" y="167" class="fill-N1 s1"><tspan x="2567.5" dy="0">보통 귀납법은 강한 귀납법의 특수한 경우다</tspan><tspan x="2567.5" dy="18.5">(P(n) 만 쓰고 나머지 가정을 버리면 된다)</tspan></text><text x="314" y="218" class="fill-N1 s1"><tspan x="314" dy="0">그러면 어느 것으로 쓰는가.</tspan><tspan x="314" dy="17.25">· 귀납법은 귀류법을 쓰지 않아 읽기 쉽고, 증명이 곧 재귀 절차가 된다</tspan><tspan x="314" dy="17.25">· WOP 는 짧아지는 일이 많고, 걸음의 크기가 정해지지 않은 문제에 잘 맞는다</tspan><tspan x="314" dy="17.25">· 정렬집합으로 넓히면 WOP 만 살아남는다 — 8장의 종료성 증명이 그 자리다</tspan></text><marker id="mk-d2-118927264-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-118927264-3488378134)" d="M446.494 110.658C849.3 142.5 1015.1 150.5 1269.5 150.5" class="connection stroke-B1 s0" mask="url(#d2-118927264)"/><text x="858" y="148" class="text-italic fill-N2 s1">가설을 ∀k ≤ n. P(k) 로 바꿔 적는다</text><path fill="none" marker-end="url(#mk-d2-118927264-3488378134)" d="M1601.987 131.526C1890.4 98.949 2035.6 84.75 2322.014 61.079" class="connection stroke-B1 s0" mask="url(#d2-118927264)"/><text x="1962.5" y="89" class="text-italic fill-N2 s1"><tspan x="1962.5" dy="0">최소 원소가 없다고 하면</tspan><tspan x="1962.5" dy="18.5">모든 원소가 밖에 있음을 귀납으로 얻는다</tspan></text><path fill="none" marker-end="url(#mk-d2-118927264-3488378134)" d="M2324.001 33.684C2035.6 24.15 1857.7 21.75 1699.75 21.75S849.3 34.35 448.47 84.256" class="connection stroke-B1 s0" mask="url(#d2-118927264)"/><text x="1384" y="22" class="text-italic fill-N2 s1"><tspan x="1384" dy="0">반례 집합의 최소 원소 c 를 잡으면</tspan><tspan x="1384" dy="18.5">P(c−1) 은 참이라 P(c) 도 참이 되어 모순</tspan></text><marker id="mk-d2-118927264-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-118927264-2177206569)" d="M1601.999 156.822C1890.4 167.15 2046.9 169.75 2378.5 169.75" class="connection" mask="url(#d2-118927264)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-118927264" width="3010" height="473" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3010v473H-101z"/><path d="M725 132h266v21H725zM1789 73h347v37h-347zM1231 6h306v37h-306z"/></mask></svg>