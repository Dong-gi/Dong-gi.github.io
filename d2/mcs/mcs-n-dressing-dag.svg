<svg xmlns="http://www.w3.org/2000/svg" width="933" height="1376" class="d2-3691300275 d2-svg" viewBox="-95 -149 933 1376"><rect width="933" height="1376" x="-95" y="-149" rx="0" style="fill:#fff"/><style>.d2-3691300275 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3691300275 .fill-N1{fill:#0a0f25}.d2-3691300275 .fill-B4{fill:#e3e9fd}.d2-3691300275 .fill-B5{fill:#edf0fd}.d2-3691300275 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M10 20h727v126H10z" class="stroke-B1 fill-B4 s0"/></g><text x="172" y="-21" class="text-bold fill-N1 s1"><tspan x="172" dy="0">1단계 — 깊이 0</tspan><tspan x="172" dy="32">먼저 할 일이 없는 것들</tspan></text></g><g ><g class="shape"><path d="M194 286h385v126H194z" class="stroke-B1 fill-B4 s0"/></g><text x="291.5" y="273" class="text-bold fill-N1 s1">2단계 — 깊이 1</text></g><g ><g class="shape"><path d="M21 552h512v126H21z" class="stroke-B1 fill-B4 s0"/></g><text x="118.5" y="539" class="text-bold fill-N1 s1">3단계 — 깊이 2</text></g><g ><g class="shape"><path d="M261 818h144v126H261z" class="stroke-B1 fill-B4 s0"/></g><text x="358.5" y="805" class="text-bold fill-N1 s1">4단계 — 깊이 3</text></g><path fill="transparent" stroke="transparent" d="M58 964h626v162H58z" class="shape s0"/><g ><g class="shape"><path d="M204 50h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="246" y="88.5" class="text-bold fill-N1 s2">속옷</text></g><g ><g class="shape"><path d="M439 50h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="481" y="88.5" class="text-bold fill-N1 s2">셔츠</text></g><g ><g class="shape"><path d="M40 50h104v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="92" y="88.5" class="text-bold fill-N1 s2">왼양말</text></g><g ><g class="shape"><path d="M583 50h124v66H583z" class="stroke-B1 fill-B5 s0"/></g><text x="645" y="88.5" class="text-bold fill-N1 s2">오른양말</text></g><g ><g class="shape"><path d="M224 316h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="266" y="354.5" class="text-bold fill-N1 s2">바지</text></g><g ><g class="shape"><path d="M445 316h104v66H445z" class="stroke-B1 fill-B5 s0"/></g><text x="497" y="354.5" class="text-bold fill-N1 s2">넥타이</text></g><g ><g class="shape"><path d="M51 582h84v66H51z" class="stroke-B1 fill-B5 s0"/></g><text x="93" y="620.5" class="text-bold fill-N1 s2">벨트</text></g><g ><g class="shape"><path d="M195 582h104v66H195z" class="stroke-B1 fill-B5 s0"/></g><text x="247" y="620.5" class="text-bold fill-N1 s2">왼구두</text></g><g ><g class="shape"><path d="M379 582h124v66H379z" class="stroke-B1 fill-B5 s0"/></g><text x="441" y="620.5" class="text-bold fill-N1 s2">오른구두</text></g><g ><g class="shape"><path d="M291 848h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="333" y="886.5" class="text-bold fill-N1 s2">재킷</text></g><text x="348.5" y="1004" class="fill-N1 s2"><tspan x="348.5" dy="0">굵게 적은 셔츠 · 바지 · 벨트 · 재킷 이 임계 경로다.</tspan><tspan x="348.5" dy="17.667">넷이 서로 견줄 수 있으므로 어떤 두 개도 같은 단계에 둘 수 없고,</tspan><tspan x="348.5" dy="17.667">따라서 프로세서를 무한히 많이 주어도 4 단계가 최소다</tspan></text><text x="371" y="1081" class="fill-N1 s2"><tspan x="371" dy="0">상자 하나가 반사슬이다 — 상자 안의 어떤 두 작업 사이에도 길이 없다.</tspan><tspan x="371" dy="18.5">상자 수가 곧 최대 사슬의 크기이고, 그것이 최소 병렬 시간이다</tspan></text><marker id="mk-d2-3691300275-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3691300275-3488378134)" d="M246 118v73c0 15 2.4 85 11.067 121.11" class="connection stroke-B1 s0" mask="url(#d2-3691300275)"/><path fill="none" marker-end="url(#mk-d2-3691300275-3488378134)" d="M448.646 117.472C413.2 156 404 176 404 191s-19.2 86.6-92.576 130.932" class="connection stroke-B1 s0" mask="url(#d2-3691300275)"/><path fill="non