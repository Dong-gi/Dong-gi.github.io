<svg xmlns="http://www.w3.org/2000/svg" width="1751" height="1041" class="d2-4272682274 d2-svg" viewBox="-51 -85 1751 1041"><rect width="1751" height="1041" x="-51" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4272682274 .fill-N1{fill:#0a0f25}.d2-4272682274 .fill-B4{fill:#e3e9fd}.d2-4272682274 .fill-B5{fill:#edf0fd}.d2-4272682274 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M247 84h184v571H247z" class="stroke-B1 fill-B4 s0"/></g><text x="339" y="43" class="text-bold fill-N1 s1"><tspan x="339" dy="0">1단계 — 깊이 0</tspan><tspan x="339" dy="32">먼저 할 일이 없는 것들</tspan></text></g><g ><g class="shape"><path d="M798 230h164v315H798z" class="stroke-B1 fill-B4 s0"/></g><text x="880" y="217" class="text-bold fill-N1 s1">2단계 — 깊이 1</text></g><g ><g class="shape"><path d="M1102 137h184v408h-184z" class="stroke-B1 fill-B4 s0"/></g><text x="1194" y="124" class="text-bold fill-N1 s1">3단계 — 깊이 2</text></g><g ><g class="shape"><path d="M1426 283h144v126h-144z" class="stroke-B1 fill-B4 s0"/></g><text x="1498" y="270" class="text-bold fill-N1 s1">4단계 — 깊이 3</text></g><text x="339.5" y="721" class="fill-N1 s2"><tspan x="339.5" dy="0">굵게 적은 셔츠 · 바지 · 벨트 · 재킷 이 임계 경로다.</tspan><tspan x="339.5" dy="17.667">넷이 서로 견줄 수 있으므로 어떤 두 개도 같은 단계에 둘 수 없고,</tspan><tspan x="339.5" dy="17.667">따라서 프로세서를 무한히 많이 주어도 4 단계가 최소다</tspan></text><text x="339" y="834" class="fill-N1 s2"><tspan x="339" dy="0">상자 하나가 반사슬이다 — 상자 안의 어떤 두 작업 사이에도 길이 없다.</tspan><tspan x="339" dy="18.5">상자 수가 곧 최대 사슬의 크기이고, 그것이 최소 병렬 시간이다</tspan></text><g ><g class="shape"><path d="M297 240h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="339" y="278.5" class="text-bold fill-N1 s2">속옷</text></g><g ><g class="shape"><path d="M297 433h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="339" y="471.5" class="text-bold fill-N1 s2">셔츠</text></g><g ><g class="shape"><path d="M287 114h104v66H287z" class="stroke-B1 fill-B5 s0"/></g><text x="339" y="152.5" class="text-bold fill-N1 s2">왼양말</text></g><g ><g class="shape"><path d="M277 559h124v66H277z" class="stroke-B1 fill-B5 s0"/></g><text x="339" y="597.5" class="text-bold fill-N1 s2">오른양말</text></g><g ><g class="shape"><path d="M838 260h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="880" y="298.5" class="text-bold fill-N1 s2">바지</text></g><g ><g class="shape"><path d="M828 449h104v66H828z" class="stroke-B1 fill-B5 s0"/></g><text x="880" y="487.5" class="text-bold fill-N1 s2">넥타이</text></g><g ><g class="shape"><path d="M1152 167h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="1194" y="205.5" class="text-bold fill-N1 s2">벨트</text></g><g ><g class="shape"><path d="M1142 293h104v66h-104z" class="stroke-B1 fill-B5 s0"/></g><text x="1194" y="331.5" class="text-bold fill-N1 s2">왼구두</text></g><g ><g class="shape"><path d="M1132 449h124v66h-124z" class="stroke-B1 fill-B5 s0"/></g><text x="1194" y="487.5" class="text-bold fill-N1 s2">오른구두</text></g><g ><g class="shape"><path d="M1456 313h84v66h-84z" class="stroke-B1 fill-B5 s0"/></g><text x="1498" y="351.5" class="text-bold fill-N1 s2">재킷</text></g><marker id="mk-d2-4272682274-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4272682274-3488378134)" d="M383 273h320c15 0 87 2.4 131.078 11.216" class="connection stroke-B1 s0" mask="url(#d2-4272682274)"/><path fill="none" marker-end="url(#mk-d2-4272682274-3488378134)" d="M382.967 457.136C618.6 413.5 688 402.5 703 402.5s89.2-15.4 143.288-74.06" class="connection stroke-B1 s0" mask="url(#d2-4272682274)"/><path fill="none" marker-end="url(#mk-d2-4272682274-3488378134)" d="M382.998 468.094C618.6 479.2 688 482 703 482h