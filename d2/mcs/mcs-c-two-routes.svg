<svg xmlns="http://www.w3.org/2000/svg" width="2740" height="1509" class="d2-1128317972 d2-svg" viewBox="-91 -101 2740 1509"><rect width="2740" height="1509" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1128317972 .fill-N1{fill:#0a0f25}.d2-1128317972 .fill-B4{fill:#e3e9fd}.d2-1128317972 .fill-B5{fill:#edf0fd}.d2-1128317972 .fill-B6{fill:#f7f8fe}.d2-1128317972 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="557.5" cy="72.5" class="shape stroke-B1 fill-B6 s0" rx="217.5" ry="72.5"/></g><text x="557.5" y="70" class="text-bold fill-N1 s1"><tspan x="557.5" dy="0">선형 점화식</tspan><tspan x="557.5" dy="18.5">f(n) = c₁f(n−1) + ⋯ + c_d f(n−d) + h(n)</tspan></text></g><g ><g class="shape"><path d="M10 265h510v856H10z" class="stroke-B1 fill-B4 s0"/></g><text x="265" y="252" class="text-bold fill-N1 s2">이 장의 길 — 생성함수</text></g><g ><g class="shape"><path d="M560 481h579v640H560z" class="stroke-B1 fill-B4 s0"/></g><text x="849.5" y="468" class="text-bold fill-N1 s2">24장의 길 — 특성근</text></g><g ><g class="shape"><path d="M418 1241h279v66H418z" class="stroke-B1 fill-B6 s0"/></g><text x="557.5" y="1279.5" class="text-bold fill-N1 s1">두 길은 같은 다항식을 본다</text></g><text x="1267" y="62" class="fill-N1 s1"><tspan x="1267" dy="0">q(x) = 1 − c₁x − ⋯ − c_d xᵈ 의 뿌리 r 과 특성다항식의 뿌리 α 는 서로 역수다(α = 1/r).</tspan><tspan x="1267" dy="17.667">그래서 부분분수의 1/(1 − αx) 에서 나오는 αⁿ 이 곧 특성근의 거듭제곱이다.</tspan><tspan x="1267" dy="17.667">중복근이 있으면 두 길 모두 nᵏαⁿ 꼴의 항이 나온다 — 생성함수 쪽에서는 1/(1 − αx)ᵏ 의 계수가 그 모양이다</tspan></text><text x="2153.5" y="62" class="fill-N1 s1"><tspan x="2153.5" dy="0">어느 쪽이 편한가: 비동차항 h(n) 이 있으면 생성함수 쪽이 편하다.</tspan><tspan x="2153.5" dy="17.667">h 의 생성함수를 방정식에 그냥 더하면 되고 특별한 요령이 필요하지 않다(하노이 탑이 그 예다).</tspan><tspan x="2153.5" dy="17.667">반대로 뿌리만 알면 되는 상황 — 자라는 속도만 궁금할 때 — 은 특성근 쪽이 빠르다</tspan></text><g ><g class="shape"><path d="M147 295h237v66H147z" class="stroke-B1 fill-B5 s0"/></g><text x="265.5" y="333.5" class="text-bold fill-N1 s1">① 수열을 F(x) 로 접는다</text></g><g ><g class="shape"><path d="M40 511h450v66H40z" class="stroke-B1 fill-B5 s0"/></g><text x="265" y="549.5" class="text-bold fill-N1 s1">② 이동 규칙으로 F 에 대한 일차방정식을 만든다</text></g><g ><g class="shape"><path d="M115 677h300v82H115z" class="stroke-B1 fill-B5 s0"/></g><text x="265" y="715.5" class="text-bold fill-N1 s1"><tspan x="265" dy="0">③ 풀면 F(x) = p(x) / q(x) 가 나온다</tspan><tspan x="265" dy="18.5">q(x) = 1 − c₁x − ⋯ − c_d xᵈ</tspan></text></g><g ><g class="shape"><path d="M63 859h404v66H63z" class="stroke-B1 fill-B5 s0"/></g><text x="265" y="897.5" class="text-bold fill-N1 s1">④ 부분분수로 1/(1 − αx) 꼴의 합으로 쪼갠다</text></g><g ><g class="shape"><path d="M109 1025h313v66H109z" class="stroke-B1 fill-B5 s0"/></g><text x="265.5" y="1063.5" class="text-bold fill-N1 s1">⑤ 각 조각의 계수를 읽어 더한다</text></g><g ><g class="shape"><path d="M736 511h228v66H736z" class="stroke-B1 fill-B5 s0"/></g><text x="850" y="549.5" class="text-bold fill-N1 s1">① f(n) = xⁿ 을 넣어 본다</text></g><g ><g class="shape"><path d="M590 685h519v66H590z" class="stroke-B1 fill-B5 s0"/></g><text x="849.5" y="723.5" class="text-bold fill-N1 s1">② 특성다항식 xᵈ − c₁x^(d−1) − ⋯ − c_d = 0 의 뿌리를 구한다</text></g><g ><g class="shape"><path d="M664 859h371v66H664z" class="stroke-B1 fill-B5 s0"/></g><text x="849.5" y="897.5" class="text-bold fill-N1 s1">③ 뿌리마다 항을 만들어 선형결합한다</text></g><g ><g class="shape"><path d="M695 1025h310v66H695z" class="stroke-B1 fill-B5 s0"/></g><text x="850" y="1063.5" class="text-bold fill-N1 s1">④ 초기 조건으로 계수를 정한다</text></g><marker id="mk-d2-1128317972-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M265 363v144" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M265 579v94" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M265 761v94" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M265 927v94" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M849.5 579v102" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M849.5 753v102" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M849.5 927v94" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M420.156 129.775C296.4 181.8 265 255 265 291" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M694.843 129.777C818.2 181.8 849.5 205 849.5 220v287" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M265 1093c0 38 35.2 108 172.152 146.907" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><path fill="none" marker-end="url(#mk-d2-1128317972-3488378134)" d="M849.5 1093c0 38-35.2 108-172.152 146.907" class="connection stroke-B1 s0" mask="url(#d2-1128317972)"/><mask id="d2-1128317972" width="2740" height="1509" x="-91" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-101h2740v1509H-91z"/></mask></svg>