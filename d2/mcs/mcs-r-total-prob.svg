<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1179" class="d2-1260735863 d2-svg" viewBox="-101 -101 1680 1179"><rect width="1680" height="1179" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1260735863 .fill-N1{fill:#0a0f25}.d2-1260735863 .fill-N2{fill:#676c7e}.d2-1260735863 .fill-B6{fill:#f7f8fe}.d2-1260735863 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M110 2h427v82H110z" class="stroke-B1 fill-B6 s0"/></g><text x="323.5" y="40.5" class="text-bold fill-N1 s1"><tspan x="323.5" dy="0">표본공간을 조건으로 쪼갠다</tspan><tspan x="323.5" dy="18.5">E₁, E₂, ⋯, Eₙ 이 쌍마다 서로소이고 합집합이 S</tspan></text></g><g ><g class="shape"><path d="M112 206h424v98H112z" class="stroke-B1 fill-B6 s0"/></g><text x="324" y="244.5" class="text-bold fill-N1 s1"><tspan x="324" dy="0">곱셈 규칙</tspan><tspan x="324" dy="17.667">Pr[A ∩ Eᵢ] = Pr[Eᵢ] · Pr[A | Eᵢ]</tspan><tspan x="324" dy="17.667">나무에서 간선 확률을 곱하는 일이 이것이다</tspan></text></g><g ><g class="shape"><path d="M0 425h313v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="156.5" y="463.5" class="text-bold fill-N1 s1"><tspan x="156.5" dy="0">전확률 정리</tspan><tspan x="156.5" dy="17.667">Pr[A] = Σ Pr[A | Eᵢ] · Pr[Eᵢ]</tspan><tspan x="156.5" dy="17.667">경우마다 계산해 가중평균한다</tspan></text></g><g ><g class="shape"><path d="M164 644h319v98H164z" class="stroke-B1 fill-B6 s0"/></g><text x="323.5" y="682.5" class="text-bold fill-N1 s1"><tspan x="323.5" dy="0">베이즈 규칙</tspan><tspan x="323.5" dy="17.667">Pr[E₁ | A] = Pr[A | E₁]Pr[E₁] / Pr[A]</tspan><tspan x="323.5" dy="17.667">분모에 전확률 정리를 넣어 쓴다</tspan></text></g><g ><g class="shape"><path d="M152 863h343v114H152z" class="stroke-B1 fill-B6 s0"/></g><text x="323.5" y="901.5" class="text-bold fill-N1 s1"><tspan x="323.5" dy="0">오즈 꼴</tspan><tspan x="323.5" dy="17.25">Odds(H | E) = 베이즈 인자 × Odds(H)</tspan><tspan x="323.5" dy="17.25">베이즈 인자 = Pr[E | H] / Pr[E | ¬H]</tspan><tspan x="323.5" dy="17.25">증거가 오즈를 몇 배 하는지만 본다</tspan></text></g><text x="1037.5" y="16" class="fill-N1 s1"><tspan x="1037.5" dy="0">가장 흔한 세 실수.</tspan><tspan x="1037.5" dy="17">① 조건 막대의 앞과 뒤를 바꿔 쓴다 — Pr[양성 | 병] 과 Pr[병 | 양성] 은 전혀 다른 수다.</tspan><tspan x="1037.5" dy="17">② 조건 쪽에서 포함배제를 한다 — Pr[A | B ∪ C] = Pr[A|B] + Pr[A|C] − Pr[A|B∩C] 는 거짓이다.</tspan><tspan x="1037.5" dy="17"> 막대 왼쪽에서 하는 계산만 규칙이 그대로 살아남는다.</tspan><tspan x="1037.5" dy="17">③ 가중치를 잊는다 — 조건마다 확률이 다르면 비율을 그냥 더하거나 견줄 수 없다. 심슨의 역설이 이것이다.</tspan></text><marker id="mk-d2-1260735863-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1260735863-3488378134)" d="M323.5 86.5v116" class="connection stroke-B1 s0" mask="url(#d2-1260735863)"/><text x="324" y="151" class="text-italic fill-N2 s1">조건부확률의 정의를 옮겨 쓴다</text><path fill="none" marker-end="url(#mk-d2-1260735863-3488378134)" d="M246.833 304.605C174.9 352.3 156.5 376.7 156.5 421.5" class="connection stroke-B1 s0" mask="url(#d2-1260735863)"/><text x="178.5" y="355" class="text-italic fill-N2 s1">서로소이므로 합의 규칙</text><path fill="none" marker-end="url(#mk-d2-1260735863-3488378134)" d="M156.5 524.5c0 46.8 18.2 71.2 87.677 117.773" class="connection stroke-B1 s0" mask="url(#d2-1260735863)"/><text x="178.5" y="604" class="text-italic fill-N2 s1">분모를 채운다</text><path fill="none" marker-end="url(#mk-d2-1260735863-3488378134)" d="M400.167 304.605C472.1 352.3 490.5 386.4 490.5 419.25s-18.2 176.45-87.677 223.023" class="connection stroke-B1 s0" mask="url(#d2-1260735863)"/><text x="488.5" y="477" class="text-italic fill-N2 s1">두 방향으로 쓴 Pr[A ∩ E₁] 을 견준다</text><path fill="none" marker-end="url(#mk-d2-1260735863-3488378134)" d="M323.5 743.5v116" class="connection stroke-B1 s0" mask="url(#d2-1260735863)"/><text x="324" y="808" class="text-italic fill-N2 s1">확률을 오즈로 바꿔 쓴 것</text><mask id="d2-1260735863" width="1680" height="1179" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1680v1179H-101z"/><path d="M192 135h264v21H192zM77 339h203v21H77zM117 588h123v21H117zM349 461h279v21H349zM219 792h210v21H219z"/></mask></svg>