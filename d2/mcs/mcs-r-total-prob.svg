<svg xmlns="http://www.w3.org/2000/svg" width="827" height="1345" class="d2-1475908772 d2-svg" viewBox="-101 -101 827 1345"><rect width="827" height="1345" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1475908772 .text-bold{font-weight:700}.d2-1475908772 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1475908772 .fill-N1{fill:#0a0f25}.d2-1475908772 .fill-N2{fill:#676c7e}.d2-1475908772 .fill-B6{fill:#f7f8fe}.d2-1475908772 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M159 0h330v98H159z" class="stroke-B1 fill-B6 s0"/></g><text x="324" y="38.5" class="text-bold fill-N1 s1"><tspan x="324" dy="0">표본공간을 조건으로 쪼갠다</tspan><tspan x="324" dy="17.667">E₁, E₂, ⋯, Eₙ 이 쌍마다 서로소이고</tspan><tspan x="324" dy="17.667">합집합이 S</tspan></text></g><g ><g class="shape"><path d="M112 219h424v98H112z" class="stroke-B1 fill-B6 s0"/></g><text x="324" y="257.5" class="text-bold fill-N1 s1"><tspan x="324" dy="0">곱셈 규칙</tspan><tspan x="324" dy="17.667">Pr[A ∩ Eᵢ] = Pr[Eᵢ] · Pr[A | Eᵢ]</tspan><tspan x="324" dy="17.667">나무에서 간선 확률을 곱하는 일이 이것이다</tspan></text></g><g ><g class="shape"><path d="M0 438h313v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="156.5" y="476.5" class="text-bold fill-N1 s1"><tspan x="156.5" dy="0">전확률 정리</tspan><tspan x="156.5" dy="17.667">Pr[A] = Σ Pr[A | Eᵢ] · Pr[Eᵢ]</tspan><tspan x="156.5" dy="17.667">경우마다 계산해 가중평균한다</tspan></text></g><g ><g class="shape"><path d="M164 657h319v98H164z" class="stroke-B1 fill-B6 s0"/></g><text x="323.5" y="695.5" class="text-bold fill-N1 s1"><tspan x="323.5" dy="0">베이즈 규칙</tspan><tspan x="323.5" dy="17.667">Pr[E₁ | A] = Pr[A | E₁]Pr[E₁] / Pr[A]</tspan><tspan x="323.5" dy="17.667">분모에 전확률 정리를 넣어 쓴다</tspan></text></g><g ><g class="shape"><path d="M152 876h343v114H152z" class="stroke-B1 fill-B6 s0"/></g><text x="323.5" y="914.5" class="text-bold fill-N1 s1"><tspan x="323.5" dy="0">오즈 꼴</tspan><tspan x="323.5" dy="17.25">Odds(H | E) = 베이즈 인자 × Odds(H)</tspan><tspan x="323.5" dy="17.25">베이즈 인자 = Pr[E | H] / Pr[E | S − H]</tspan><tspan x="323.5" dy="17.25">증거가 오즈를 몇 배 하는지만 본다</tspan></text></g><text x="267.5" y="1026" class="fill-N1 s1"><tspan x="267.5" dy="0">가장 흔한 세 실수.</tspan><tspan x="267.5" dy="16.625">① 조건 막대의 앞과 뒤를 바꿔 쓴다 —</tspan><tspan x="267.5" dy="16.625"> Pr[양성 | 병] 과 Pr[병 | 양성] 은 전혀 다른 수다.</tspan><tspan x="267.5" dy="16.625">② 조건 쪽에서 포함배제를 한다 —</tspan><tspan x="267.5" dy="16.625"> Pr[A | B ∪ C] = Pr[A|B] + Pr[A|C] − Pr[A|B∩C] 는 거짓이다.</tspan><tspan x="267.5" dy="16.625"> 막대 왼쪽에서 하는 계산만 규칙이 그대로 살아남는다.</tspan><tspan x="267.5" dy="16.625">③ 가중치를 잊는다 — 조건마다 확률이 다르면</tspan><tspan x="267.5" dy="16.625"> 비율을 그냥 더하거나 견줄 수 없다. 심슨의 역설이 이것이다.</tspan></text><marker id="mk-d2-1475908772-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1475908772-3488378134)" d="M323.5 99.5v116" class="connection stroke-B1 s0" mask="url(#d2-1475908772)"/><text x="324" y="164" class="text-italic fill-N2 s1">조건부확률의 정의를 옮겨 쓴다</text><path fill="none" marker-end="url(#mk-d2-1475908772-3488378134)" d="M246.833 317.605C174.9 365.3 156.5 389.7 156.5 434.5" class="connection stroke-B1 s0" mask="url(#d2-1475908772)"/><text x="178.5" y="368" class="text-italic fill-N2 s1">서로소이므로 합의 규칙</text><path fill="none" marker-end="url(#mk-d2-1475908772-3488378134)" d="M156.5 537.5c0 46.8 18.2 71.2 87.677 117.773" class="connection stroke-B1 s0" mask="url(#d2-1475908772)"/><text x="178.5" y="617" class="text-italic fill-N2 s1">분모를 채운다</text><path fill="none" marker-end="url(#mk-d2-1475908772-3488378134)" d="M400.167 317.605C472.1 365.3 490.5 399.4 490.5 432.25s-18.2 176.45-87.677 223.023" class="connection stroke-B1 s0" mask="url(#d2-1475908772)"/><text x="488.5" y="490" class="text-italic fill-N2 s1">두 방향으로 쓴 Pr[A ∩ E₁] 을 견준다</text><path fill="none" marker-end="url(#mk-d2-1475908772-3488378134)" d="M323.5 756.5v116" class="connection stroke-B1 s0" mask="url(#d2-1475908772)"/><text x="324" y="821" class="text-italic fill-N2 s1">확률을 오즈로 바꿔 쓴 것</text><mask id="d2-1475908772" width="827" height="1345" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h827v1345h-827z"/><path d="M192 148h264v21H192zM77 352h203v21H77zM117 601h123v21H117zM349 474h279v21H349zM219 805h210v21H219z"/></mask></svg>