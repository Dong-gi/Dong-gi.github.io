<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="2399" class="d2-274206234 d2-svg" viewBox="-91 -121 2100 2399"><rect width="2100" height="2399" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-274206234 .fill-N1{fill:#0a0f25}.d2-274206234 .fill-N2{fill:#676c7e}.d2-274206234 .fill-B4{fill:#e3e9fd}.d2-274206234 .fill-B5{fill:#edf0fd}.d2-274206234 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M457 20h474v1234H457z" class="stroke-B1 fill-B4 s0"/></g><text x="694" y="7" class="text-bold fill-N1 s1">추정 절차 — 계산</text></g><g ><g class="shape"><path d="M10 1415h621v762H10z" class="stroke-B1 fill-B4 s0"/></g><text x="320.5" y="1402" class="text-bold fill-N1 s1">결과를 말로 옮기기</text></g><text x="1047.5" y="1484" class="fill-N1 s2"><tspan x="1047.5" dy="0">모집단 크기가 식에 없다. 유권자가 만 명이든 10억 명이든 3125명을 물으면 된다.</tspan><tspan x="1047.5" dy="17.667">직관은 이렇다 — 국을 간 볼 때 한 숟갈이면 되고, 냄비가 크다고 두 숟갈이 필요하지 않다.</tspan><tspan x="1047.5" dy="17.667">잘 섞여 있기만 하면 한 숟갈에 담긴 정보는 냄비 크기와 무관하다.</tspan></text><text x="1569.5" y="1189" class="fill-N1 s2"><tspan x="1569.5" dy="0">n → ∞ 이면 Pr[|Sₙ/n − p| ≥ x] → 0 이다. 이것이 큰 수의 법칙(약한 형태)이고,</tspan><tspan x="1569.5" dy="18.5">위 사슬은 그 정량적 형태다 — ‘얼마나 큰 n 이면 얼마나 믿을 만한가’ 까지 답한다.</tspan></text><g ><g class="shape"><path d="M487 50h414v98H487z" class="stroke-B1 fill-B5 s0"/></g><text x="694" y="88.5" class="text-bold fill-N1 s2"><tspan x="694" dy="0">알아내려는 값 p</tspan><tspan x="694" dy="17.667">유권자 가운데 갑을 지지하는 비율.</tspan><tspan x="694" dy="17.667">고정된 미지의 실수다 — 확률변수가 아니다</tspan></text></g><g ><g class="shape"><path d="M543 248h302v82H543z" class="stroke-B1 fill-B5 s0"/></g><text x="694" y="286.5" class="text-bold fill-N1 s2"><tspan x="694" dy="0">무작위로 한 명을 뽑아 묻는다</tspan><tspan x="694" dy="18.5">Kᵢ = 1 (지지) 또는 0. Pr[Kᵢ = 1] = p</tspan></text></g><g ><g class="shape"><path d="M548 430h293v82H548z" class="stroke-B1 fill-B5 s0"/></g><text x="694.5" y="468.5" class="text-bold fill-N1 s2"><tspan x="694.5" dy="0">n 번 되풀이해 더한다</tspan><tspan x="694.5" dy="18.5">Sₙ = K₁ + ⋯ + Kₙ, 추정값은 Sₙ/n</tspan></text></g><g ><g class="shape"><path d="M548 612h292v66H548z" class="stroke-B1 fill-B5 s0"/></g><text x="694" y="650.5" class="text-bold fill-N1 s2">Ex[Sₙ/n] = p — 치우치지 않았다</text></g><g ><g class="shape"><path d="M523 778h342v98H523z" class="stroke-B1 fill-B5 s0"/></g><text x="694" y="816.5" class="text-bold fill-N1 s2"><tspan x="694" dy="0">Var[Sₙ/n] = pq/n ≤ 1/4n</tspan><tspan x="694" dy="17.667">쌍마다 독립이면 분산이 더해지고,</tspan><tspan x="694" dy="17.667">1/n² 을 곱하므로 1/n 로 줄어든다</tspan></text></g><g ><g class="shape"><path d="M574 976h240v82H574z" class="stroke-B1 fill-B5 s0"/></g><text x="694" y="1014.5" class="text-bold fill-N1 s2"><tspan x="694" dy="0">체비쇼프</tspan><tspan x="694" dy="18.5">Pr[|Sₙ/n − p| ≥ x] ≤ 1/(4nx²)</tspan></text></g><g ><g class="shape"><path d="M513 1158h343v66H513z" class="stroke-B1 fill-B5 s0"/></g><text x="684.5" y="1196.5" class="text-bold fill-N1 s2">x = 0.04, 오른쪽이 1/20 이하 → n ≥ 3125</text></g><g ><g class="shape"><path d="M101 1445h439v98H101z" class="stroke-B1 fill-B5 s0"/></g><text x="320.5" y="1483.5" class="text-bold fill-N1 s2"><tspan x="320.5" dy="0">틀린 말</tspan><tspan x="320.5" dy="17.667">‘확률 0.95 로 p 가 0.40 ± 0.04 안에 있다’</tspan><tspan x="320.5" dy="17.667">p 는 확률변수가 아니므로 이 문장은 뜻이 없다</tspan></text></g><g ><g class="shape"><path d="M55 1664h531v82H55z" class="stroke-B1 fill-B5 s0"/></g><text x="320.5" y="1702.5" class="text-bold fill-N1 s2"><tspan x="320.5" dy="0">맞는 말 ①</tspan><tspan x="320.5" dy="18.5">‘이 절차가 p 에서 0.04 안쪽의 값을 내놓을 확률이 0.95 다’</tspan></text></g><g ><g class="shape"><path d="M40 1867h561v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="320.5" y="1905.5" class="text-bold fill-N1 s2"><tspan x="320.5" dy="0">맞는 말 ②</tspan><tspan x="320.5" dy="18.5">‘p 가 0.40 ± 0.04 안에 있거나, 확률 1/20 의 드문 일이 일어났다’</tspan></text></g><g ><g class="shape"><path d="M159 2049h323v98H159z" class="stroke-B1 fill-B5 s0"/></g><text x="320.5" y="2087.5" class="text-bold fill-N1 s2"><tspan x="320.5" dy="0">관례적 표현</tspan><tspan x="320.5" dy="17.667">‘신뢰수준 95%에서 0.40 ± 0.04 다’</tspan><tspan x="320.5" dy="17.667">위 두 문장의 줄임말로만 쓴다</tspan></text></g><marker id="mk-d2-274206234-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M694 150v94" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M694 332v94" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M694 514v94" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M694 680v94" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M694 878v94" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M688.801 1059.99C685 1098 684 1118 684 1154" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M320.5 1544.5v116" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><text x="321" y="1609" class="text-italic fill-N2 s2">확률을 절차에 붙인다</text><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M320.5 1747.5v116" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><text x="321" y="1812" class="text-italic fill-N2 s2">같은 뜻을 뒤집어 적은 것</text><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M320.5 1951v94" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M537.55 1224.445C364.3 1264 320.5 1286.1 320.5 1304.25V1441" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><text x="352" y="1276" class="text-italic fill-N2 s2">여기서 말을 조심해야 한다</text><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M830.45 1224.445C1003.7 1264 1047.5 1286.1 1047.5 1304.25v159.25" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><path fill="none" marker-end="url(#mk-d2-274206234-3488378134)" d="M815.44 1047.485c193.26 48.315 321.635 73.415 635.99 124.375" class="connection stroke-B1 s0" mask="url(#d2-274206234)"/><mask id="d2-274206234" width="2100" height="2399" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h2100v2399H-91z"/><path d="M229 1593h184v21H229zM216 1796h210v21H216zM239 1260h226v21H239z"/></mask></svg>