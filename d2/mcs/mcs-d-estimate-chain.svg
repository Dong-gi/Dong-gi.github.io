<svg xmlns="http://www.w3.org/2000/svg" width="2141" height="2399" class="d2-1658298500 d2-svg" viewBox="-91 -121 2141 2399"><rect width="2141" height="2399" x="-91" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1658298500 .fill-N1{fill:#0a0f25}.d2-1658298500 .fill-N2{fill:#676c7e}.d2-1658298500 .fill-B4{fill:#e3e9fd}.d2-1658298500 .fill-B5{fill:#edf0fd}.d2-1658298500 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M488 20h474v1234H488z" class="stroke-B1 fill-B4 s0"/></g><text x="725" y="7" class="text-bold fill-N1 s1">추정 절차 — 계산</text></g><g ><g class="shape"><path d="M10 1415h662v762H10z" class="stroke-B1 fill-B4 s0"/></g><text x="341" y="1402" class="text-bold fill-N1 s1">결과를 말로 옮기기</text></g><text x="1088.5" y="1484" class="fill-N1 s2"><tspan x="1088.5" dy="0">모집단 크기가 식에 없다. 유권자가 만 명이든 10억 명이든 3125명을 물으면 된다.</tspan><tspan x="1088.5" dy="17.667">직관은 이렇다 — 국을 간 볼 때 한 숟갈이면 되고, 냄비가 크다고 두 숟갈이 필요하지 않다.</tspan><tspan x="1088.5" dy="17.667">잘 섞여 있기만 하면 한 숟갈에 담긴 정보는 냄비 크기와 무관하다.</tspan></text><text x="1610.5" y="1189" class="fill-N1 s2"><tspan x="1610.5" dy="0">n → ∞ 이면 Pr[|Sₙ/n − p| ≥ x] → 0 이다. 이것이 큰 수의 법칙(약한 형태)이고,</tspan><tspan x="1610.5" dy="18.5">위 사슬은 그 정량적 형태다 — ‘얼마나 큰 n 이면 얼마나 믿을 만한가’ 까지 답한다.</tspan></text><g ><g class="shape"><path d="M518 50h414v98H518z" class="stroke-B1 fill-B5 s0"/></g><text x="725" y="88.5" class="text-bold fill-N1 s2"><tspan x="725" dy="0">알아내려는 값 p</tspan><tspan x="725" dy="17.667">유권자 가운데 갑을 지지하는 비율.</tspan><tspan x="725" dy="17.667">고정된 미지의 실수다 — 확률변수가 아니다</tspan></text></g><g ><g class="shape"><path d="M574 248h302v82H574z" class="stroke-B1 fill-B5 s0"/></g><text x="725" y="286.5" class="text-bold fill-N1 s2"><tspan x="725" dy="0">무작위로 한 명을 뽑아 묻는다</tspan><tspan x="725" dy="18.5">Kᵢ = 1 (지지) 또는 0. Pr[Kᵢ = 1] = p</tspan></text></g><g ><g class="shape"><path d="M578 430h293v82H578z" class="stroke-B1 fill-B5 s0"/></g><text x="724.5" y="468.5" class="text-bold fill-N1 s2"><tspan x="724.5" dy="0">n 번 되풀이해 더한다</tspan><tspan x="724.5" dy="18.5">Sₙ = K₁ + ⋯ + Kₙ, 추정값은 Sₙ/n</tspan></text></g><g ><g class="shape"><path d="M579 612h292v66H579z" class="stroke-B1 fill-B5 s0"/></g><text x="725" y="650.5" class="text-bold fill-N1 s2">Ex[Sₙ/n] = p — 치우치지 않았다</text></g><g ><g class="shape"><path d="M554 778h342v98H554z" class="stroke-B1 fill-B5 s0"/></g><text x="725" y="816.5" class="text-bold fill-N1 s2"><tspan x="725" dy="0">Var[Sₙ/n] = pq/n ≤ 1/4n</tspan><tspan x="725" dy="17.667">쌍마다 독립이면 분산이 더해지고,</tspan><tspan x="725" dy="17.667">1/n² 을 곱하므로 1/n 로 줄어든다</tspan></text></g><g ><g class="shape"><path d="M605 976h240v82H605z" class="stroke-B1 fill-B5 s0"/></g><text x="725" y="1014.5" class="text-bold fill-N1 s2"><tspan x="725" dy="0">체비쇼프</tspan><tspan x="725" dy="18.5">Pr[|Sₙ/n − p| ≥ x] ≤ 1/(4nx²)</tspan></text></g><g ><g class="shape"><path d="M543 1158h343v66H543z" class="stroke-B1 fill-B5 s0"/></g><text x="714.5" y="1196.5" class="text-bold fill-N1 s2">x = 0.04, 오른쪽이 1/20 이하 → n ≥ 3125</text></g><g ><g class="shape"><path d="M122 1445h439v98H122z" class="stroke-B1 fill-B5 s0"/></g><text x="341.5" y="1483.5" class="text-bold fill-N1 s2"><tspan x="341.5" dy="0">틀린 말</tspan><tspan x="341.5" dy="17.667">‘확률 0.95 로 p 가 0.40 ± 0.04 안에 있다’</tspan><tspan x="341.5" dy="17.667">p 는 확률변수가 아니므로 이 문장은 뜻이 없다</tspan></text></g><g ><g class="shape"><path d="M45 1664h592v82H45z" class="stroke-B1 fill-B5 s0"/></g><text x="341" y="1702.5" class="text-bold fill-N1 s2"><tspan x="341" dy="0">맞는 말 ①</tspan><tspan x="341" dy="18.5">‘이 절차가 p 에서 0.04 안쪽의 값을 내놓을 확률이 0.95 이상이다’</tspan></text></g><g ><g class="shape"><path d="M40 1867h602v82H40z" class="stroke-B1 fill-B5 s0"/></g><text x="341" y="1905.5" class="text-bold fill-N1 s2"><tspan x="341" dy="0">맞는 말 ②</tspan><tspan x="341" dy="18.5">‘p 가 0.40 ± 0.04 안에 있거나, 확률 1/20 이하의 드문 일이 일어났다’</tspan></text></g><g ><g class="shape"><path d="M180 2049h323v98H180z" class="stroke-B1 fill-B5 s0"/></g><text x="341.5" y="2087.5" class="text-bold fill-N1 s2"><tspan x="341.5" dy="0">관례적 표현</tspan><tspan x="341.5" dy="17.667">‘신뢰수준 95%에서 0.40 ± 0.04 다’</tspan><tspan x="341.5" dy="17.667">위 두 문장의 줄임말로만 쓴다</tspan></text></g><marker id="mk-d2-1658298500-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M724.75 150v94" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M724.75 332v94" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M724.75 514v94" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M724.75 680v94" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M724.75 878v94" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M719.551 1059.99C715.75 1098 714.75 1118 714.75 1154" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M341 1544.5v116" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><text x="341" y="1609" class="text-italic fill-N2 s2">확률을 절차에 붙인다</text><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M341 1747.5v116" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><text x="341" y="1812" class="text-italic fill-N2 s2">같은 뜻을 뒤집어 적은 것</text><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M341 1951v94" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M564.048 1224.434C386 1264 341 1286.1 341 1304.25V1441" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><text x="375" y="1275" class="text-italic fill-N2 s2">여기서 말을 조심해야 한다</text><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M865.452 1224.434C1043.5 1264 1088.5 1286.1 1088.5 1304.25v159.25" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><path fill="none" marker-end="url(#mk-d2-1658298500-3488378134)" d="M846.443 1046.474c201.257 49.126 331.632 74.426 645.988 125.386" class="connection stroke-B1 s0" mask="url(#d2-1658298500)"/><mask id="d2-1658298500" width="2141" height="2399" x="-91" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-121h2141v2399H-91z"/><path d="M249 1593h184v21H249zM236 1796h210v21H236zM262 1259h226v21H262z"/></mask></svg>