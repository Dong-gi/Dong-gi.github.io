<svg xmlns="http://www.w3.org/2000/svg" width="1342" height="2419" class="d2-3802613847 d2-svg" viewBox="-89 -89 1342 2419"><rect width="1342" height="2419" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3802613847 .fill-N1{fill:#0a0f25}.d2-3802613847 .fill-N2{fill:#676c7e}.d2-3802613847 .fill-B4{fill:#e3e9fd}.d2-3802613847 .fill-B5{fill:#edf0fd}.d2-3802613847 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M267 12h585v1104H267z" class="stroke-B1 fill-B4 s0"/></g><text x="559.5" y="45" class="text-bold fill-N1 s1">추정 절차 — 계산</text></g><g ><g class="shape"><path d="M223 1377h702v852H223z" class="stroke-B1 fill-B4 s0"/></g><text x="372" y="1410" class="text-bold fill-N1 s1">결과를 말로 옮기기</text></g><text x="929" y="1217" class="fill-N1 s2"><tspan x="929" dy="0">모집단 크기가 식에 없다.</tspan><tspan x="929" dy="16.833">유권자가 만 명이든 10억 명이든 3125명을 물으면 된다.</tspan><tspan x="929" dy="16.833">직관은 이렇다 — 국을 간 볼 때 한 숟갈이면 되고,</tspan><tspan x="929" dy="16.833">냄비가 크다고 두 숟갈이 필요하지 않다.</tspan><tspan x="929" dy="16.833">잘 섞여 있기만 하면 한 숟갈에 담긴 정보는</tspan><tspan x="929" dy="16.833">냄비 크기와 무관하다.</tspan></text><text x="227.5" y="1217" class="fill-N1 s2"><tspan x="227.5" dy="0">n → ∞ 이면 Pr[|Sₙ/n − p| ≥ x] → 0 이다.</tspan><tspan x="227.5" dy="17.25">이것이 큰 수의 법칙(약한 형태)이고,</tspan><tspan x="227.5" dy="17.25">위 사슬은 그 정량적 형태다 —</tspan><tspan x="227.5" dy="17.25">‘얼마나 큰 n 이면 얼마나 믿을 만한가’ 까지 답한다.</tspan></text><g ><g class="shape"><path d="M317 62h414v98H317z" class="stroke-B1 fill-B5 s0"/></g><text x="524" y="100.5" class="text-bold fill-N1 s2"><tspan x="524" dy="0">알아내려는 값 p</tspan><tspan x="524" dy="17.667">유권자 가운데 갑을 지지하는 비율.</tspan><tspan x="524" dy="17.667">고정된 미지의 실수다 — 확률변수가 아니다</tspan></text></g><g ><g class="shape"><path d="M373 230h302v82H373z" class="stroke-B1 fill-B5 s0"/></g><text x="524" y="268.5" class="text-bold fill-N1 s2"><tspan x="524" dy="0">무작위로 한 명을 뽑아 묻는다</tspan><tspan x="524" dy="18.5">Kᵢ = 1 (지지) 또는 0. Pr[Kᵢ = 1] = p</tspan></text></g><g ><g class="shape"><path d="M378 382h293v82H378z" class="stroke-B1 fill-B5 s0"/></g><text x="524.5" y="420.5" class="text-bold fill-N1 s2"><tspan x="524.5" dy="0">n 번 되풀이해 더한다</tspan><tspan x="524.5" dy="18.5">Sₙ = K₁ + ⋯ + Kₙ, 추정값은 Sₙ/n</tspan></text></g><g ><g class="shape"><path d="M378 534h292v66H378z" class="stroke-B1 fill-B5 s0"/></g><text x="524" y="572.5" class="text-bold fill-N1 s2">Ex[Sₙ/n] = p — 치우치지 않았다</text></g><g ><g class="shape"><path d="M353 670h342v98H353z" class="stroke-B1 fill-B5 s0"/></g><text x="524" y="708.5" class="text-bold fill-N1 s2"><tspan x="524" dy="0">Var[Sₙ/n] = pq/n ≤ 1/4n</tspan><tspan x="524" dy="17.667">쌍마다 독립이면 분산이 더해지고,</tspan><tspan x="524" dy="17.667">1/n² 을 곱하므로 1/n 로 줄어든다</tspan></text></g><g ><g class="shape"><path d="M404 838h240v82H404z" class="stroke-B1 fill-B5 s0"/></g><text x="524" y="876.5" class="text-bold fill-N1 s2"><tspan x="524" dy="0">체비쇼프</tspan><tspan x="524" dy="18.5">Pr[|Sₙ/n − p| ≥ x] ≤ 1/(4nx²)</tspan></text></g><g ><g class="shape"><path d="M459 1000h343v66H459z" class="stroke-B1 fill-B5 s0"/></g><text x="630.5" y="1038.5" class="text-bold fill-N1 s2">x = 0.04, 오른쪽이 1/20 이하 → n ≥ 3125</text></g><g ><g class="shape"><path d="M354 1427h439v98H354z" class="stroke-B1 fill-B5 s0"/></g><text x="573.5" y="1465.5" class="text-bold fill-N1 s2"><tspan x="573.5" dy="0">틀린 말</tspan><tspan x="573.5" dy="17.667">‘확률 0.95 로 p 가 0.40 ± 0.04 안에 있다’</tspan><tspan x="573.5" dy="17.667">p 는 확률변수가 아니므로 이 문장은 뜻이 없다</tspan></text></g><g ><g class="shape"><path d="M278 1686h592v82H278z" class="stroke-B1 fill-B5 s0"/></g><text x="574" y="1724.5" class="text-bold fill-N1 s2"><tspan x="574" dy="0">맞는 말 ①</tspan><tspan x="574" dy="18.5">‘이 절차가 p 에서 0.04 안쪽의 값을 내놓을 확률이 0.95 이상이다’</tspan></text></g><g ><g class="shape"><path d="M273 1929h602v82H273z" class="stroke-B1 fill-B5 s0"/></g><text x="574" y="1967.5" class="text-bold fill-N1 s2"><tspan x="574" dy="0">맞는 말 ②</tspan><tspan x="574" dy="18.5">‘p 가 0.40 ± 0.04 안에 있거나, 확률 1/20 이하의 드문 일이 일어났다’</tspan></text></g><g ><g class="shape"><path d="M412 2081h323v98H412z" class="stroke-B1 fill-B5 s0"/></g><text x="573.5" y="2119.5" class="text-bold fill-N1 s2"><tspan x="573.5" dy="0">관례적 표현</tspan><tspan x="573.5" dy="17.667">‘신뢰수준 95%에서 0.40 ± 0.04 다’</tspan><tspan x="573.5" dy="17.667">위 두 문장의 줄임말로만 쓴다</tspan></text></g><marker id="mk-d2-3802613847-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M524.916 162v64" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M524.916 314v64" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M524.916 466v64" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M524.916 602v64" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M524.916 770v64" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M631.166 922v74" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M574 1527v155" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><text x="574" y="1611" class="text-italic fill-N2 s2">확률을 절차에 붙인다</text><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M574 1770v155" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><text x="574" y="1854" class="text-italic fill-N2 s2">같은 뜻을 뒤집어 적은 것</text><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M574 2013v64" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M574 1068v355" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><text x="574" y="1252" class="text-italic fill-N2 s2">여기서 말을 조심해야 한다</text><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M688.333 1068v83s0 10 10 10H919s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><path fill="none" marker-end="url(#mk-d2-3802613847-3488378134)" d="M418.666 922v275" class="connection stroke-B1 s0" mask="url(#d2-3802613847)"/><mask id="d2-3802613847" width="1342" height="2419" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1342v2419H-89z"/><path d="M482 1595h184v21H482zM469 1838h210v21H469zM461 1236h226v21H461z"/></mask></svg>