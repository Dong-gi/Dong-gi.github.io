<svg xmlns="http://www.w3.org/2000/svg" width="2427" height="636" class="d2-3542258456 d2-svg" viewBox="-101 -101 2427 636"><rect width="2427" height="636" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3542258456 .fill-N1{fill:#0a0f25}.d2-3542258456 .fill-N2{fill:#676c7e}.d2-3542258456 .fill-B6{fill:#f7f8fe}.d2-3542258456 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M199 110h433v98H199z" class="stroke-B1 fill-B6 s0"/></g><text x="415.5" y="148.5" class="text-bold fill-N1 s1"><tspan x="415.5" dy="0">자료형의 정의</tspan><tspan x="415.5" dy="17.667">· 기저: 이것들은 R 에 속한다</tspan><tspan x="415.5" dy="17.667">· 구성자: R 의 원소에서 새 원소를 만드는 방법</tspan></text></g><g ><g class="shape"><path d="M1230 15h343v114h-343z" class="stroke-B1 fill-B6 s0"/></g><text x="1401.5" y="53.5" class="text-bold fill-N1 s1"><tspan x="1401.5" dy="0">구조적 귀납법</tspan><tspan x="1401.5" dy="17.25">· 기저마다 P 가 참임을 보인다</tspan><tspan x="1401.5" dy="17.25">· 구성자마다, 재료가 P 를 만족하면</tspan><tspan x="1401.5" dy="17.25"> 결과도 P 를 만족함을 보인다</tspan></text></g><g ><g class="shape"><path d="M1238 189h327v114h-327z" class="stroke-B1 fill-B6 s0"/></g><text x="1401.5" y="227.5" class="text-bold fill-N1 s1"><tspan x="1401.5" dy="0">재귀 함수의 정의</tspan><tspan x="1401.5" dy="17.25">· 기저에서의 값을 정한다</tspan><tspan x="1401.5" dy="17.25">· 구성자마다, 재료에서의 값으로</tspan><tspan x="1401.5" dy="17.25"> 결과에서의 값을 정한다</tspan></text></g><g ><g class="shape"><ellipse cx="2009" cy="72" class="shape stroke-B1 fill-B6 s0" rx="216" ry="72"/></g><text x="2009" y="77.5" class="text-bold fill-N1 s1">R 의 모든 원소가 P 를 만족한다</text></g><text x="415" y="284" class="fill-N1 s1"><tspan x="415" dy="0">ℕ 도 재귀적 자료형이다 — 기저는 0, 구성자는 n ↦ n+1.</tspan><tspan x="415" dy="17.667">그 위의 구조적 귀납법이 곧 7장의 보통 귀납법이다.</tspan><tspan x="415" dy="17.667">문자열의 구조적 귀납법은 길이에 대한 귀납법과 같고, 나무에서는 그런 대응이 늘 있는 것은 아니다</tspan></text><text x="415.5" y="397" class="fill-N1 s1"><tspan x="415.5" dy="0">함수를 정의하려면 정의가 모호하지 않아야 한다.</tspan><tspan x="415.5" dy="17.667">같은 원소를 두 길로 만들 수 있으면 그 원소에서 함수값이 두 개 나올 수 있다.</tspan><tspan x="415.5" dy="17.667">집합에 대한 귀납법은 모호한 정의로도 되지만, 함수 정의는 안 된다</tspan></text><marker id="mk-d2-3542258456-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3542258456-3488378134)" d="M633.98 127.721C950.4 83.2 1070 72 1226 72" class="connection stroke-B1 s0" mask="url(#d2-3542258456)"/><text x="930" y="92" class="text-italic fill-N2 s1">같은 갈래를 따라간다</text><path fill="none" marker-end="url(#mk-d2-3542258456-3488378134)" d="M633.98 190.279C950.4 234.8 1071.6 246 1234 246" class="connection stroke-B1 s0" mask="url(#d2-3542258456)"/><text x="934" y="238" class="text-italic fill-N2 s1">같은 갈래를 따라간다</text><path fill="none" marker-end="url(#mk-d2-3542258456-3488378134)" d="M1575 72h214" class="connection stroke-B1 s0" mask="url(#d2-3542258456)"/><mask id="d2-3542258456" width="2427" height="636" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2427v636H-101z"/><path d="M838 76h184v21H838zM842 222h184v21H842z"/></mask></svg>