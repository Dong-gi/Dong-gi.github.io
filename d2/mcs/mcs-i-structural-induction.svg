<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="977" class="d2-2492532022 d2-svg" viewBox="-152 -101 1080 977"><rect width="1080" height="977" x="-152" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2492532022 .fill-N1{fill:#0a0f25}.d2-2492532022 .fill-N2{fill:#676c7e}.d2-2492532022 .fill-B6{fill:#f7f8fe}.d2-2492532022 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M197 0h433v98H197z" class="stroke-B1 fill-B6 s0"/></g><text x="413.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="413.5" dy="0">자료형의 정의</tspan><tspan x="413.5" dy="17.667">· 기저: 이것들은 R 에 속한다</tspan><tspan x="413.5" dy="17.667">· 구성자: R 의 원소에서 새 원소를 만드는 방법</tspan></text></g><g ><g class="shape"><path d="M45 219h343v114H45z" class="stroke-B1 fill-B6 s0"/></g><text x="216.5" y="257.5" class="text-bold fill-N1 s1"><tspan x="216.5" dy="0">구조적 귀납법</tspan><tspan x="216.5" dy="17.25">· 기저마다 P 가 참임을 보인다</tspan><tspan x="216.5" dy="17.25">· 구성자마다, 재료가 P 를 만족하면</tspan><tspan x="216.5" dy="17.25"> 결과도 P 를 만족함을 보인다</tspan></text></g><g ><g class="shape"><path d="M448 219h327v114H448z" class="stroke-B1 fill-B6 s0"/></g><text x="611.5" y="257.5" class="text-bold fill-N1 s1"><tspan x="611.5" dy="0">재귀 함수의 정의</tspan><tspan x="611.5" dy="17.25">· 기저에서의 값을 정한다</tspan><tspan x="611.5" dy="17.25">· 구성자마다, 재료에서의 값으로</tspan><tspan x="611.5" dy="17.25"> 결과에서의 값을 정한다</tspan></text></g><g ><g class="shape"><ellipse cx="216" cy="505" class="shape stroke-B1 fill-B6 s0" rx="216" ry="72"/></g><text x="216" y="510.5" class="text-bold fill-N1 s1">R 의 모든 원소가 P 를 만족한다</text></g><path fill="transparent" stroke="transparent" d="M-51 597h878v178H-51z" class="shape s0"/><text x="388" y="637" class="fill-N1 s1"><tspan x="388" dy="0">ℕ 도 재귀적 자료형이다 — 기저는 0, 구성자는 n ↦ n+1.</tspan><tspan x="388" dy="17.667">그 위의 구조적 귀납법이 곧 7장의 보통 귀납법이다.</tspan><tspan x="388" dy="17.667">문자열의 구조적 귀납법은 길이에 대한 귀납법과 같고, 나무에서는 그런 대응이 늘 있는 것은 아니다</tspan></text><text x="291.5" y="714" class="fill-N1 s1"><tspan x="291.5" dy="0">함수를 정의하려면 정의가 모호하지 않아야 한다.</tspan><tspan x="291.5" dy="17.667">같은 원소를 두 길로 만들 수 있으면 그 원소에서 함수값이 두 개 나올 수 있다.</tspan><tspan x="291.5" dy="17.667">집합에 대한 귀납법은 모호한 정의로도 되지만, 함수 정의는 안 된다</tspan></text><marker id="mk-d2-2492532022-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2492532022-3488378134)" d="M323.255 98.477C237.8 146.3 216 170.7 216 215.5" class="connection stroke-B1 s0" mask="url(#d2-2492532022)"/><text x="246" y="147" class="text-italic fill-N2 s1">같은 갈래를 따라간다</text><path fill="none" marker-end="url(#mk-d2-2492532022-3488378134)" d="M503.745 98.477C589.2 146.3 611 170.7 611 215.5" class="connection stroke-B1 s0" mask="url(#d2-2492532022)"/><text x="581" y="147" class="text-italic fill-N2 s1">같은 갈래를 따라간다</text><path fill="none" marker-end="url(#mk-d2-2492532022-3488378134)" d="M216 335v94" class="connection stroke-B1 s0" mask="url(#d2-2492532022)"/><mask id="d2-2492532022" width="1080" height="977" x="-152" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-152-101H928v977H-152z"/><path d="M154 131h184v21H154zM489 131h184v21H489z"/></mask></svg>