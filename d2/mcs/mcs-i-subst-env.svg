<svg xmlns="http://www.w3.org/2000/svg" width="2051" height="617" class="d2-3199725599 d2-svg" viewBox="-101 -101 2051 617"><rect width="2051" height="617" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3199725599 .fill-N1{fill:#0a0f25}.d2-3199725599 .fill-B6{fill:#f7f8fe}.d2-3199725599 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="384" cy="128.5" class="shape stroke-B1 fill-B6 s0" rx="230" ry="76.5"/></g><text x="384" y="126" class="text-bold fill-N1 s1"><tspan x="384" dy="0">eval(subst(f, e), n) 을 계산하려 한다</tspan><tspan x="384" dy="18.5">예: f = 3x, e = x(x−1), n = 2</tspan></text></g><g ><g class="shape"><path d="M883 0h366v98H883z" class="stroke-B1 fill-B6 s0"/></g><text x="1066" y="38.5" class="text-bold fill-N1 s1"><tspan x="1066" dy="0">대입 모형</tspan><tspan x="1066" dy="17.667">① 먼저 e 안의 x 를 f 로 바꾼다 → 3x(3x−1)</tspan><tspan x="1066" dy="17.667">② 그 식을 n 에서 계산한다 → 6 · 5 = 30</tspan></text></g><g ><g class="shape"><path d="M867 158h397v98H867z" class="stroke-B1 fill-B6 s0"/></g><text x="1065.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="1065.5" dy="0">환경 모형</tspan><tspan x="1065.5" dy="17.667">① 먼저 f 를 n 에서 계산한다 → 3 · 2 = 6</tspan><tspan x="1065.5" dy="17.667">② 그 값을 x 로 삼아 e 를 계산한다 → 6 · 5 = 30</tspan></text></g><g ><g class="shape"><ellipse cx="1606.5" cy="128" class="shape stroke-B1 fill-B6 s0" rx="242.5" ry="81"/></g><text x="1606.5" y="125.5" class="text-bold fill-N1 s1"><tspan x="1606.5" dy="0">eval(subst(f, e), n) = eval(e, eval(f, n))</tspan><tspan x="1606.5" dy="18.5">두 길이 언제나 같은 값에 도착한다</tspan></text></g><text x="383.5" y="281" class="fill-N1 s1"><tspan x="383.5" dy="0">값은 같은데 일의 양은 다르다. 대입 모형에서는 3x 가 두 번 나타나므로 3 · 2 를 두 번 계산한다.</tspan><tspan x="383.5" dy="18.5">환경 모형은 한 번만 계산한다. 그래서 실제 언어는 대개 환경 모형을 쓴다</tspan></text><text x="383.5" y="378" class="fill-N1 s1"><tspan x="383.5" dy="0">증명은 e 에 대한 구조적 귀납법이다 — n 이나 f 가 아니라 e 다.</tspan><tspan x="383.5" dy="17.667">귀납 변수가 무엇인지 밝히는 일이 이 증명에서 특히 중요하다.</tspan><tspan x="383.5" dy="17.667">기저 두 개(변수 x, 숫자 k)와 구성자 세 개(합, 곱, 부호)를 각각 확인하면 끝난다</tspan></text><marker id="mk-d2-3199725599-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3199725599-3488378134)" d="M586.968 90.644C770.6 57.4 830.1 49 878.5 49" class="connection stroke-B1 s0" mask="url(#d2-3199725599)"/><path fill="none" marker-end="url(#mk-d2-3199725599-3488378134)" d="M587.968 165.358C770.8 198.6 827 207 863 207" class="connection stroke-B1 s0" mask="url(#d2-3199725599)"/><path fill="none" marker-end="url(#mk-d2-3199725599-3488378134)" d="M1251.5 49c49.6 0 82.9 5.8 160.652 27.906" class="connection stroke-B1 s0" mask="url(#d2-3199725599)"/><path fill="none" marker-end="url(#mk-d2-3199725599-3488378134)" d="M1266 207c38 0 68.4-5.8 146.152-27.906" class="connection stroke-B1 s0" mask="url(#d2-3199725599)"/><mask id="d2-3199725599" width="2051" height="617" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2051v617H-101z"/></mask></svg>