<svg xmlns="http://www.w3.org/2000/svg" width="2259" height="1326" class="d2-3851736006 d2-svg" viewBox="-101 -101 2259 1326"><rect width="2259" height="1326" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3851736006 .fill-N1{fill:#0a0f25}.d2-3851736006 .fill-B6{fill:#f7f8fe}.d2-3851736006 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="297" cy="99" class="shape stroke-B1 fill-B6 s0" rx="297" ry="99"/></g><text x="297" y="104.5" class="text-bold fill-N1 s1">모든 n ∈ ℕ 에 대해 P(n) 이 참임을 보이려 한다</text></g><g ><g class="shape"><path d="M116 298h363v82H116z" class="stroke-B1 fill-B6 s0"/></g><text x="297.5" y="336.5" class="text-bold fill-N1 s1"><tspan x="297.5" dy="0">① 귀납법을 쓴다고 밝힌다</tspan><tspan x="297.5" dy="18.5">독자가 증명의 뼈대를 미리 알게 된다</tspan></text></g><g ><g class="shape"><path d="M30 480h534v98H30z" class="stroke-B1 fill-B6 s0"/></g><text x="297" y="518.5" class="text-bold fill-N1 s1"><tspan x="297" dy="0">② 귀납 가설 P(n) 을 명시한다</tspan><tspan x="297" dy="17.667">증명하려는 명제에서 그대로 떼어 오는 것이 보통이지만,</tspan><tspan x="297" dy="17.667">막히면 더 센 명제로 바꾼다</tspan></text></g><g ><g class="shape"><path d="M58 678h479v82H58z" class="stroke-B1 fill-B6 s0"/></g><text x="297.5" y="716.5" class="text-bold fill-N1 s1"><tspan x="297.5" dy="0">③ 기저 단계 — P(0) 을 증명한다</tspan><tspan x="297.5" dy="18.5">한 걸음이 두 칸이면 P(0), P(1) 두 개를 확인해야 한다</tspan></text></g><g ><g class="shape"><path d="M30 860h535v82H30z" class="stroke-B1 fill-B6 s0"/></g><text x="297.5" y="898.5" class="text-bold fill-N1 s1"><tspan x="297.5" dy="0">④ 귀납 단계 — 모든 n 에 대해 P(n) → P(n+1) 을 증명한다</tspan><tspan x="297.5" dy="18.5">여기만 문제마다 다르다. P(n) 을 가정하고 P(n+1) 을 얻는다</tspan></text></g><g ><g class="shape"><path d="M96 1042h402v82H96z" class="stroke-B1 fill-B6 s0"/></g><text x="297" y="1080.5" class="text-bold fill-N1 s1"><tspan x="297" dy="0">⑤ 귀납법에 의해 모든 n 에서 P(n) 이 참이다</tspan><tspan x="297" dy="18.5">너무 표준적이라 생략하는 일이 많다</tspan></text></g><text x="990" y="89" class="fill-N1 s1"><tspan x="990" dy="0">가장 자주 나는 잘못은 ② 를 적지 않는 것이다.</tspan><tspan x="990" dy="17.667">무엇을 n 으로 삼았는지, 변수가 여럿이면 어느 것으로 귀납하는지 밝히지 않으면</tspan><tspan x="990" dy="17.667">④ 에서 무엇을 가정했는지 스스로도 헷갈린다</tspan></text><text x="1721.5" y="89" class="fill-N1 s1"><tspan x="1721.5" dy="0">두 번째로 자주 나는 잘못은 ④ 의 논증이 작은 n 에서 통하지 않는 것이다.</tspan><tspan x="1721.5" dy="17.667">‘나머지 것들’ 이나 ‘가운데’ 같은 말을 쓰면 n 이 작을 때 그런 것이 없을 수 있다.</tspan><tspan x="1721.5" dy="17.667">말 색깔 가짜 증명이 정확히 이 자리에서 무너진다</tspan></text><marker id="mk-d2-3851736006-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3851736006-3488378134)" d="M297 200v94" class="connection stroke-B1 s0" mask="url(#d2-3851736006)"/><path fill="none" marker-end="url(#mk-d2-3851736006-3488378134)" d="M297 382v94" class="connection stroke-B1 s0" mask="url(#d2-3851736006)"/><path fill="none" marker-end="url(#mk-d2-3851736006-3488378134)" d="M297 580v94" class="connection stroke-B1 s0" mask="url(#d2-3851736006)"/><path fill="none" marker-end="url(#mk-d2-3851736006-3488378134)" d="M297 762v94" class="connection stroke-B1 s0" mask="url(#d2-3851736006)"/><path fill="none" marker-end="url(#mk-d2-3851736006-3488378134)" d="M297 944v94" class="connection stroke-B1 s0" mask="url(#d2-3851736006)"/><mask id="d2-3851736006" width="2259" height="1326" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2259v1326H-101z"/></mask></svg>