<svg xmlns="http://www.w3.org/2000/svg" width="1267" height="1083" class="d2-2822272751 d2-svg" viewBox="-101 -101 1267 1083"><rect width="1267" height="1083" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2822272751 .fill-N1{fill:#0a0f25}.d2-2822272751 .fill-B6{fill:#f7f8fe}.d2-2822272751 .stroke-B1,.d2-2822272751 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2;stroke-dasharray:6,5.919384}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2}</style><g ><g class="shape"><path d="M132 8h299v66H132z" class="stroke-B2 fill-B6 s0"/></g><text x="281.5" y="46.5" class="text-bold fill-N1 s1">아무 말 없이 계산을 시작한다</text></g><g ><g class="shape"><path d="M691 0h345v82H691z" class="stroke-B1 fill-B6 s2"/></g><text x="863.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="863.5" dy="0">계획을 먼저 밝힌다</tspan><tspan x="863.5" dy="18.5">‘경우를 나눈다’, ‘모순을 이끈다’</tspan></text></g><g ><g class="shape"><path d="M113 150h336v66H113z" class="stroke-B2 fill-B6 s0"/></g><text x="281" y="188.5" class="text-bold fill-N1 s1">생각난 순서대로 조각을 흩뿌린다</text></g><g ><g class="shape"><path d="M713 142h302v82H713z" class="stroke-B1 fill-B6 s2"/></g><text x="864" y="180.5" class="text-bold fill-N1 s1"><tspan x="864" dy="0">한 줄기로 흐르게 쓴다</tspan><tspan x="864" dy="18.5">앞 줄이 뒤 줄의 근거가 되도록</tspan></text></g><g ><g class="shape"><path d="M133 292h296v66H133z" class="stroke-B2 fill-B6 s0"/></g><text x="281" y="330.5" class="text-bold fill-N1 s1">기호와 식만 길게 늘어놓는다</text></g><g ><g class="shape"><path d="M682 284h363v82H682z" class="stroke-B1 fill-B6 s2"/></g><text x="863.5" y="322.5" class="text-bold fill-N1 s1"><tspan x="863.5" dy="0">글로 쓴다</tspan><tspan x="863.5" dy="18.5">식이 섞인 짧은 글이지 계산이 아니다</tspan></text></g><g ><g class="shape"><path d="M142 434h279v66H142z" class="stroke-B2 fill-B6 s0"/></g><text x="281.5" y="472.5" class="text-bold fill-N1 s1">긴 증명을 한 덩어리로 둔다</text></g><g ><g class="shape"><path d="M671 426h386v82H671z" class="stroke-B1 fill-B6 s2"/></g><text x="864" y="464.5" class="text-bold fill-N1 s1"><tspan x="864" dy="0">보조정리로 잘라낸다</tspan><tspan x="864" dy="18.5">같은 논증을 두 번 쓰면 일반 보조정리로</tspan></text></g><g ><g class="shape"><path d="M109 576h345v66H109z" class="stroke-B2 fill-B6 s0"/></g><text x="281.5" y="614.5" class="text-bold fill-N1 s1">‘자명하다’, ‘명백히’ 로 넘어간다</text></g><g ><g class="shape"><path d="M662 568h403v82H662z" class="stroke-B1 fill-B6 s2"/></g><text x="863.5" y="606.5" class="text-bold fill-N1 s1"><tspan x="863.5" dy="0">정말 자명한 것만 자명하다고 쓴다</tspan><tspan x="863.5" dy="18.5">내게 자명한 것이 읽는 사람에게는 아니다</tspan></text></g><g ><g class="shape"><path d="M111 718h340v66H111z" class="stroke-B2 fill-B6 s0"/></g><text x="281" y="756.5" class="text-bold fill-N1 s1">결론은 독자가 알아서 내라고 둔다</text></g><g ><g class="shape"><path d="M672 710h383v82H672z" class="stroke-B1 fill-B6 s2"/></g><text x="863.5" y="748.5" class="text-bold fill-N1 s1"><tspan x="863.5" dy="0">끝맺는다</tspan><tspan x="863.5" dy="18.5">원래 주장이 왜 따라오는지 직접 적는다</tspan></text></g><text x="281" y="860" class="fill-N1 s1"><tspan x="281" dy="0">왼쪽 줄에 하나라도 걸리면 그 자리가 증명이 무너지기 쉬운 자리다.</tspan><tspan x="281" dy="18.5">남의 증명에서 ‘자명하다’ 를 만나면 그 문장을 가장 먼저 의심하라</tspan></text><marker id="mk-d2-2822272751-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2822272751-3488378134)" d="M433.5 41H687" class="connection stroke-B1 s2" mask="url(#d2-2822272751)"/><path fill="none" marker-end="url(#mk-d2-2822272751-3488378134)" d="M451 183h257.5" class="connection stroke-B1 s2" mask="url(#d2-2822272751)"/><path fill="none" marker-end="url(#mk-d2-2822272751-3488378134)" d="M431 325h247" class="connection stroke-B1 s2" mask="url(#d2-2822272751)"/><path fill="none" marker-end="url(#mk-d2-2822272751-3488378134)" d="M423.5 467h243" class="connection stroke-B1 s2" mask="url(#d2-2822272751)"/><path fill="none" marker-end="url(#mk-d2-2822272751-3488378134)" d="M456.5 609H658" class="connection stroke-B1 s2" mask="url(#d2-2822272751)"/><path fill="none" marker-end="url(#mk-d2-2822272751-3488378134)" d="M453 751h215" class="connection stroke-B1 s2" mask="url(#d2-2822272751)"/><mask id="d2-2822272751" width="1267" height="1083" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1267V982H-101z"/></mask></svg>