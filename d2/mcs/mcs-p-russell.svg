<svg xmlns="http://www.w3.org/2000/svg" width="2458" height="1246" class="d2-1149237277 d2-svg" viewBox="-101 -101 2458 1246"><rect width="2458" height="1246" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1149237277 .fill-N1{fill:#0a0f25}.d2-1149237277 .fill-N2{fill:#676c7e}.d2-1149237277 .fill-B6{fill:#f7f8fe}.d2-1149237277 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M157 0h531v82H157z" class="stroke-B1 fill-B6 s0"/></g><text x="422.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="422.5" dy="0">소박한 규칙</tspan><tspan x="422.5" dy="18.5">어떤 조건이든 그 조건을 만족하는 것을 모으면 집합이다</tspan></text></g><g ><g class="shape"><path d="M239 182h366v82H239z" class="stroke-B1 fill-B6 s0"/></g><text x="422" y="220.5" class="text-bold fill-N1 s1"><tspan x="422" dy="0">S ::= { x | x ∉ x }</tspan><tspan x="422" dy="18.5">자기 자신을 원소로 갖지 않는 것 전부</tspan></text></g><g ><g class="shape"><path d="M422 456h-2l-90-45c-1 0-1-1 0-2l90-45h3l91 45c1 0 1 1 0 2l-90 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="422" y="415.5" class="text-bold fill-N1 s1">S ∈ S 인가</text></g><g ><g class="shape"><path d="M0 577h407v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="203.5" y="615.5" class="text-bold fill-N1 s1"><tspan x="203.5" dy="0">S ∈ S 라 하자</tspan><tspan x="203.5" dy="18.5">그러면 S 는 S 의 조건을 만족해야 하니 S ∉ S</tspan></text></g><g ><g class="shape"><path d="M467 577h348v82H467z" class="stroke-B1 fill-B6 s0"/></g><text x="641" y="615.5" class="text-bold fill-N1 s1"><tspan x="641" dy="0">S ∉ S 라 하자</tspan><tspan x="641" dy="18.5">그러면 S 는 조건을 만족하므로 S ∈ S</tspan></text></g><g ><g class="shape"><path d="M306 759h232v66H306z" class="stroke-B1 fill-B6" style="stroke-width:3"/></g><text x="422" y="797.5" class="text-bold fill-N1 s1">어느 쪽이든 모순이다</text></g><g ><g class="shape"><path d="M136 946h572v98H136z" class="stroke-B1 fill-B6 s0"/></g><text x="422" y="984.5" class="text-bold fill-N1 s1"><tspan x="422" dy="0">고친 규칙(ZFC 의 분리 공리)</tspan><tspan x="422" dy="17.667">이미 있는 집합에서 조건으로 부분을 잘라내는 것만 허용한다</tspan><tspan x="422" dy="17.667">{ x ∈ A | P(x) } 는 되지만 { x | P(x) } 는 안 된다</tspan></text></g><text x="1066.5" y="39" class="fill-N1 s1"><tspan x="1066.5" dy="0">그러면 위의 S 는 애초에 만들어지지 않는다.</tspan><tspan x="1066.5" dy="18.5">무엇을 담을지 정하기 전에 어디에서 잘라낼지를 먼저 말해야 하기 때문이다</tspan></text><text x="1850.5" y="31" class="fill-N1 s1"><tspan x="1850.5" dy="0">이 문서는 대체로 소박한 뜻의 집합을 쓴다.</tspan><tspan x="1850.5" dy="17.667">다만 ‘모든 집합의 집합’ 처럼 크기에 제한이 없는 모임을 만들면 위험하다는 것은 기억할 만하다.</tspan><tspan x="1850.5" dy="17.667">집합의 논리를 제대로 다루는 것은 10장이다</tspan></text><marker id="mk-d2-1149237277-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1149237277-3488378134)" d="M422.25 84v94" class="connection stroke-B1 s0" mask="url(#d2-1149237277)"/><path fill="none" marker-end="url(#mk-d2-1149237277-3488378134)" d="M422.25 266c0 38-.05 58-.23 94" class="connection stroke-B1 s0" mask="url(#d2-1149237277)"/><path fill="none" marker-end="url(#mk-d2-1149237277-3488378134)" d="M373.202 433.875C237.799 499.8 203.5 528.7 203.5 573.5" class="connection stroke-B1 s0" mask="url(#d2-1149237277)"/><text x="264" y="492" class="text-italic fill-N2 s1">그렇다</text><path fill="none" marker-end="url(#mk-d2-1149237277-3488378134)" d="M471.797 433.878C606.8 499.8 641 528.7 641 573.5" class="connection stroke-B1 s0" mask="url(#d2-1149237277)"/><text x="580" y="492" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-1149237277-3488378134)" d="M203.5 661c0 38 26.4 58 127.792 96.406" class="connection stroke-B1 s0" mask="url(#d2-1149237277)"/><path fill="none" marker-end="url(#mk-d2-1149237277-3488378134)" d="M641 661c0 38-26.4 58-127.792 96.406" class="connection stroke-B1 s0" mask="url(#d2-1149237277)"/><path fill="none" marker-end="url(#mk-d2-1149237277-3488378134)" d="M422.25 827v115.5" class="connection stroke-B1 s0" mask="url(#d2-1149237277)"/><text x="422.5" y="891" class="text-italic fill-N2 s1">규칙을 좁힌다</text><mask id="d2-1149237277" width="2458" height="1246" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2458v1246H-101z"/><path d="M233 476h62v21h-62zM549 476h62v21h-62zM361 875h123v21H361z"/></mask></svg>