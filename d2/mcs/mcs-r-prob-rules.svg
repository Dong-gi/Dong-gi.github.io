<svg xmlns="http://www.w3.org/2000/svg" width="1311" height="1952" class="d2-2185912064 d2-svg" viewBox="-101 -121 1311 1952"><rect width="1311" height="1952" x="-101" y="-121" rx="0" style="fill:#fff"/><style>.d2-2185912064 .text-bold{font-weight:700}.d2-2185912064 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2185912064 .fill-N1{fill:#0a0f25}.d2-2185912064 .fill-N2{fill:#676c7e}.d2-2185912064 .fill-B5{fill:#edf0fd}.d2-2185912064 .fill-B6{fill:#f7f8fe}.d2-2185912064 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M370 20h569v538H370z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="654.5" y="7" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">확률 공간의 정의</text></g><g ><g class="shape"><path d="M65 723h325v98H65z" class="stroke-B1 fill-B6 s0"/></g><text x="227.5" y="761.5" class="text-bold fill-N1 s1"><tspan x="227.5" dy="0">합의 규칙</tspan><tspan x="227.5" dy="17.667">쌍마다 서로소인 E₀, E₁, ⋯ 에 대해</tspan><tspan x="227.5" dy="17.667">Pr[∪ Eₙ] = Σ Pr[Eₙ]</tspan></text></g><g ><g class="shape"><path d="M0 950h183v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="91.5" y="988.5" class="text-bold fill-N1 s1"><tspan x="91.5" dy="0">여사건 규칙</tspan><tspan x="91.5" dy="18.5">Pr[S − A] = 1 − Pr[A]</tspan></text></g><g ><g class="shape"><path d="M243 950h239v82H243z" class="stroke-B1 fill-B6 s0"/></g><text x="362.5" y="988.5" class="text-bold fill-N1 s1"><tspan x="362.5" dy="0">차의 규칙</tspan><tspan x="362.5" dy="18.5">Pr[B − A] = Pr[B] − Pr[A ∩ B]</tspan></text></g><g ><g class="shape"><path d="M218 1153h290v82H218z" class="stroke-B1 fill-B6 s0"/></g><text x="363" y="1191.5" class="text-bold fill-N1 s1"><tspan x="363" dy="0">포함배제</tspan><tspan x="363" dy="18.5">Pr[A ∪ B] = Pr[A] + Pr[B] − Pr[A ∩ B]</tspan></text></g><g ><g class="shape"><path d="M257 1356h212v82H257z" class="stroke-B1 fill-B6 s0"/></g><text x="363" y="1394.5" class="text-bold fill-N1 s1"><tspan x="363" dy="0">불의 부등식</tspan><tspan x="363" dy="18.5">Pr[A ∪ B] ≤ Pr[A] + Pr[B]</tspan></text></g><g ><g class="shape"><path d="M450 731h219v82H450z" class="stroke-B1 fill-B6 s0"/></g><text x="559.5" y="769.5" class="text-bold fill-N1 s1"><tspan x="559.5" dy="0">단조성</tspan><tspan x="559.5" dy="18.5">A ⊆ B 이면 Pr[A] ≤ Pr[B]</tspan></text></g><g ><g class="shape"><path d="M237 1559h252v98H237z" class="stroke-B1 fill-B6 s0"/></g><text x="363" y="1597.5" class="text-bold fill-N1 s1"><tspan x="363" dy="0">합집합 한계(union bound)</tspan><tspan x="363" dy="17.667">Pr[∪ Eₙ] ≤ Σ Pr[Eₙ]</tspan><tspan x="363" dy="17.667">서로소가 아니어도 된다</tspan></text></g><g ><g class="shape"><path d="M729 715h380v114H729z" class="stroke-B1 fill-B6 s0"/></g><text x="919" y="753.5" class="text-bold fill-N1 s1"><tspan x="919" dy="0">균등 확률공간</tspan><tspan x="919" dy="17.25">유한하고 모든 Pr[ω] 가 같으면</tspan><tspan x="919" dy="17.25">Pr[E] = |E| / |S|</tspan><tspan x="919" dy="17.25">17장의 셈의 규칙이 그대로 확률이 된다</tspan></text></g><text x="554.5" y="1693" class="fill-N1 s1"><tspan x="554.5" dy="0">합집합 한계가 특히 쓸모 있다. 우주선의 결정적 부품 n 개 가운데 i 번째가 고장 날 사건을 Eᵢ 라 하면</tspan><tspan x="554.5" dy="17.667">어느 하나라도 고장 날 확률이 Σ Pr[Eᵢ] 이하다. 부품끼리 어떻게 얽혀 있는지 몰라도 상한을 얻는다.</tspan><tspan x="554.5" dy="17.667">한편 하한은 max Pr[Eᵢ] 다 — 단조성에서 나온다. 22장의 편차 한계도 이 두 줄과 같은 종류의 도구다.</tspan></text><g ><g class="shape"><path d="M400 50h318v98H400z" class="stroke-B1 fill-B5 s0"/></g><text x="559" y="88.5" class="text-bold fill-N1 s1"><tspan x="559" dy="0">가산 표본공간 S</tspan><tspan x="559" dy="17.667">비어 있지 않은 가산집합.</tspan><tspan x="559" dy="17.667">원소 ω 가 결과, 부분집합이 사건</tspan></text></g><g ><g class="shape"><path d="M463 248h192v98H463z" class="stroke-B1 fill-B5 s0"/></g><text x="559" y="286.5" class="text-bold fill-N1 s1"><tspan x="559" dy="0">확률함수 Pr : S → ℝ</tspan><tspan x="559" dy="17.667">① Pr[ω] ≥ 0</tspan><tspan x="559" dy="17.667">② Σ Pr[ω] = 1</tspan></text></g><g ><g class="shape"><path d="M454 446h211v82H454z" class="stroke-B1 fill-B5 s0"/></g><text x="559.5" y="484.5" class="text-bold fill-N1 s1"><tspan x="559.5" dy="0">사건의 확률</tspan><tspan x="559.5" dy="18.5">Pr[E] ::= Σ Pr[ω] (ω ∈ E)</tspan></text></g><marker id="mk-d2-2185912064-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2185912064-3488378134)" d="M559 150v94" class="connection stroke-B1 s0" mask="url(#d2-2185912064)"/><path fill="none" marker-end="url(#mk-d2-2185912064-3488378134)" d="M559 348v94" class="connection stroke-B1 s0" mask="url(#d2-2185912064)"/><path fill="none" marker-end="url(#mk-d2-2185912064-3488378134)" d="M451.571 516.446C272.3 565.583 227 661.9 227 719.5" class="connection stroke-B1 s0" mask="url(#d2-2185912064)"/><text x="281.5" y="560" class="text-italic fill-N2 s1"><tspan x="281.5" dy="0">정의를 두 번 쓰고</tspan><tspan x="281.5" dy="18.5">항을 모은다</tspan></text><path fill="none" marker-end="url(#mk-d2-2185912064-3488378134)" d="M168.994 821.816C107.3 875.7 91.5 901.7 91.5 946.5" class="connection stroke-B1 s0" mask="url(#d2-2185912064)"/><text x="109" y="880" class="text-italic fill-N2 s1">S = A ∪ (S−A) 로 쪼갠다</text><path fill="none" marker-end="url(#mk-d2-2185912064-3488378134)" d="M285.006 821.816C346.7 875.7 362.5 901.7 362.5 946.5" class="connection stroke-B1 s0" mask="url(#d2-2185912064)"/><text x="344.5" y="880" class="text-italic fill-N2 s1">B = (B−A) ∪ (A∩B)</text><path fill="none" marker-end="url(#mk-d2-2185912064-3488378134)" d="M362.5 1033.5v116" class="connection stroke-B1 s0" mask="url(#d2-2185912064)"/><text x="363" y="1098" class="text-italic fill-N2 s1">A ∪ B = A ∪ (B−A)</text><path fill="none" marker-end="url(#mk-d2-2185912064-3488378134)" d="M362.5 1236.5v116" class="connection stroke-B1 s0" mask="url(#d2-2185912064)"/><text x="362.5" y="1301" class="text-italic fill-N2 s1">확률은 음이 아니다</text><path fill="none" marker-end="url(#mk-d2-2185912064-3488378134)" d="M559 530v197.5" class="connection stroke-B1 s0" mask="url(#d2-2185912064)"/><text x="559" y="635" class="text-italic fill-N2 s1">결과의 확률이 음이 아니다</text><path fill="none" marker-end="url(#mk-d2-2185912064-3488378134)" d="M362.5 1439.5v116" class="connection stroke-B1 s0" mask="url(#d2-2185912064)"/><text x="363" y="1504" class="text-italic fill-N2 s1">항이 무한히 많아도 같다</text><path fill="none" marker-end="url(#mk-d2-2185912064-3488378134)" d="M918.5 559.5v152" class="connection stroke-B1 s0" mask="url(#d2-2185912064)"/><text x="918.5" y="642" class="text-italic fill-N2 s1">값이 모두 같은 특별한 경우</text><mask id="d2-2185912064" width="1311" height="1952" x="-101" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-121h1311v1952H-101z"/><path d="M207 544h149v37H207zM24 864h170v21H24zM286 864h117v21H286zM306 1082h114v21H306zM280 1285h165v21H280zM446 619h226v21H446zM260 1488h206v21H260zM804 626h229v21H804z"/></mask></svg>