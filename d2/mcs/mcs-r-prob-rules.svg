<svg xmlns="http://www.w3.org/2000/svg" width="1357" height="1973" class="d2-3947064668 d2-svg" viewBox="-101 -121 1357 1973"><rect width="1357" height="1973" x="-101" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3947064668 .fill-N1{fill:#0a0f25}.d2-3947064668 .fill-N2{fill:#676c7e}.d2-3947064668 .fill-B5{fill:#edf0fd}.d2-3947064668 .fill-B6{fill:#f7f8fe}.d2-3947064668 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M258 20h390v575H258z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="453" y="7" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">확률 공간의 정의</text></g><g ><g class="shape"><path d="M65 752h325v98H65z" class="stroke-B1 fill-B6 s0"/></g><text x="227.5" y="790.5" class="text-bold fill-N1 s1"><tspan x="227.5" dy="0">합의 규칙</tspan><tspan x="227.5" dy="17.667">쌍마다 서로소인 E₀, E₁, ⋯ 에 대해</tspan><tspan x="227.5" dy="17.667">Pr[∪ Eₙ] = Σ Pr[Eₙ]</tspan></text></g><g ><g class="shape"><path d="M0 971h183v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="91.5" y="1009.5" class="text-bold fill-N1 s1"><tspan x="91.5" dy="0">여사건 규칙</tspan><tspan x="91.5" dy="18.5">Pr[S − A] = 1 − Pr[A]</tspan></text></g><g ><g class="shape"><path d="M243 971h239v82H243z" class="stroke-B1 fill-B6 s0"/></g><text x="362.5" y="1009.5" class="text-bold fill-N1 s1"><tspan x="362.5" dy="0">차의 규칙</tspan><tspan x="362.5" dy="18.5">Pr[B − A] = Pr[B] − Pr[A ∩ B]</tspan></text></g><g ><g class="shape"><path d="M218 1174h290v82H218z" class="stroke-B1 fill-B6 s0"/></g><text x="363" y="1212.5" class="text-bold fill-N1 s1"><tspan x="363" dy="0">포함배제</tspan><tspan x="363" dy="18.5">Pr[A ∪ B] = Pr[A] + Pr[B] − Pr[A ∩ B]</tspan></text></g><g ><g class="shape"><path d="M257 1377h212v82H257z" class="stroke-B1 fill-B6 s0"/></g><text x="363" y="1415.5" class="text-bold fill-N1 s1"><tspan x="363" dy="0">불의 부등식</tspan><tspan x="363" dy="18.5">Pr[A ∪ B] ≤ Pr[A] + Pr[B]</tspan></text></g><g ><g class="shape"><path d="M450 760h219v82H450z" class="stroke-B1 fill-B6 s0"/></g><text x="559.5" y="798.5" class="text-bold fill-N1 s1"><tspan x="559.5" dy="0">단조성</tspan><tspan x="559.5" dy="18.5">A ⊆ B 이면 Pr[A] ≤ Pr[B]</tspan></text></g><g ><g class="shape"><path d="M237 1580h252v98H237z" class="stroke-B1 fill-B6 s0"/></g><text x="363" y="1618.5" class="text-bold fill-N1 s1"><tspan x="363" dy="0">합집합 한계(union bound)</tspan><tspan x="363" dy="17.667">Pr[∪ Eₙ] ≤ Σ Pr[Eₙ]</tspan><tspan x="363" dy="17.667">서로소가 아니어도 된다</tspan></text></g><g ><g class="shape"><path d="M775 467h380v114H775z" class="stroke-B1 fill-B6 s0"/></g><text x="965" y="505.5" class="text-bold fill-N1 s1"><tspan x="965" dy="0">균등 확률공간</tspan><tspan x="965" dy="17.25">유한하고 모든 Pr[ω] 가 같으면</tspan><tspan x="965" dy="17.25">Pr[E] = |E| / |S|</tspan><tspan x="965" dy="17.25">17장의 셈의 규칙이 그대로 확률이 된다</tspan></text></g><text x="577.5" y="1714" class="fill-N1 s1"><tspan x="577.5" dy="0">합집합 한계가 특히 쓸모 있다. 우주선의 결정적 부품 n 개 가운데 i 번째가 고장 날 사건을 Eᵢ 라 하면</tspan><tspan x="577.5" dy="17.667">어느 하나라도 고장 날 확률이 Σ Pr[Eᵢ] 이하다. 부품끼리 어떻게 얽혀 있는지 몰라도 상한을 얻는다.</tspan><tspan x="577.5" dy="17.667">한편 하한은 max Pr[Eᵢ] 다 — 단조성에서 나온다. 22장의 편차 한계도 이 두 줄과 같은 종류의 도구다.</tspan></text><g ><g class="shape"><path d="M300 50h318v98H300z" class="stroke-B1 fill-B5 s0"/></g><text x="459" y="88.5" class="text-bold fill-N1 s1"><tspan x="459" dy="0">가산 표본공간 S</tspan><tspan x="459" dy="17.667">비어 있지 않은 가산집합.</tspan><tspan x="459" dy="17.667">원소 ω 가 결과, 부분집합이 사건</tspan></text></g><g ><g class="shape"><path d="M363 248h192v98H363z" class="stroke-B1 fill-B5 s0"/></g><text x="459" y="286.5" class="text-bold fill-N1 s1"><tspan x="459" dy="0">확률함수 Pr : S → ℝ</tspan><tspan x="459" dy="17.667">① Pr[ω] ≥ 0</tspan><tspan x="459" dy="17.667">② Σ Pr[ω] = 1</tspan></text></g><g ><g class="shape"><path d="M288 483h211v82H288z" class="stroke-B1 fill-B5 s0"/></g><text x="393.5" y="521.5" class="text-bold fill-N1 s1"><tspan x="393.5" dy="0">사건의 확률</tspan><tspan x="393.5" dy="18.5">Pr[E] ::= Σ Pr[ω] (ω ∈ E)</tspan></text></g><marker id="mk-d2-3947064668-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3947064668-3488378134)" d="M459.25 150v94" class="connection stroke-B1 s0" mask="url(#d2-3947064668)"/><path fill="none" marker-end="url(#mk-d2-3947064668-3488378134)" d="M428.963 347.21C400.4 394.3 393 421.9 393 479.5" class="connection stroke-B1 s0" mask="url(#d2-3947064668)"/><path fill="none" marker-end="url(#mk-d2-3947064668-3488378134)" d="M327.32 566.086C247.4 617.8 227 703.7 227 748.5" class="connection stroke-B1 s0" mask="url(#d2-3947064668)"/><text x="242.5" y="643" class="text-italic fill-N2 s1">정의를 두 번 쓰고 항을 모은다</text><path fill="none" marker-end="url(#mk-d2-3947064668-3488378134)" d="M164.948 850.762C106.5 898.3 91.5 922.7 91.5 967.5" class="connection stroke-B1 s0" mask="url(#d2-3947064668)"/><text x="106" y="904" class="text-italic fill-N2 s1">S = A ∪ (S−A) 로 쪼갠다</text><path fill="none" marker-end="url(#mk-d2-3947064668-3488378134)" d="M289.052 850.762C347.5 898.3 362.5 922.7 362.5 967.5" class="connection stroke-B1 s0" mask="url(#d2-3947064668)"/><text x="347.5" y="904" class="text-italic fill-N2 s1">B = (B−A) ∪ (A∩B)</text><path fill="none" marker-end="url(#mk-d2-3947064668-3488378134)" d="M362.5 1054.5v116" class="connection stroke-B1 s0" mask="url(#d2-3947064668)"/><text x="363" y="1119" class="text-italic fill-N2 s1">A ∪ B = A ∪ (B−A)</text><path fill="none" marker-end="url(#mk-d2-3947064668-3488378134)" d="M362.5 1257.5v116" class="connection stroke-B1 s0" mask="url(#d2-3947064668)"/><text x="362.5" y="1322" class="text-italic fill-N2 s1">확률은 음이 아니다</text><path fill="none" marker-end="url(#mk-d2-3947064668-3488378134)" d="M458.68 566.087C538.6 617.8 559 705.3 559 756.5" class="connection stroke-B1 s0" mask="url(#d2-3947064668)"/><text x="544" y="647" class="text-italic fill-N2 s1">결과의 확률이 음이 아니다</text><path fill="none" marker-end="url(#mk-d2-3947064668-3488378134)" d="M362.5 1460.5v116" class="connection stroke-B1 s0" mask="url(#d2-3947064668)"/><text x="363" y="1525" class="text-italic fill-N2 s1">항이 무한히 많아도 같다</text><path fill="none" marker-end="url(#mk-d2-3947064668-3488378134)" d="M509.414 346.914C556.8 394.3 610.15 418.717 770.915 466.45" class="connection stroke-B1 s0" mask="url(#d2-3947064668)"/><text x="631.5" y="430" class="text-italic fill-N2 s1">값이 모두 같은 특별한 경우</text><mask id="d2-3947064668" width="1357" height="1973" x="-101" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-121h1357v1973H-101z"/><path d="M117 627h251v21H117zM21 888h170v21H21zM289 888h117v21H289zM306 1103h114v21H306zM280 1306h165v21H280zM431 631h226v21H431zM260 1509h206v21H260zM517 414h229v21H517z"/></mask></svg>