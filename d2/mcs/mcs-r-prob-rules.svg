<svg xmlns="http://www.w3.org/2000/svg" width="6154" height="734" class="d2-668105585 d2-svg" viewBox="43 -101 6154 734"><rect width="6154" height="734" x="43" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-668105585 .fill-N1{fill:#0a0f25}.d2-668105585 .fill-N2{fill:#676c7e}.d2-668105585 .fill-B5{fill:#edf0fd}.d2-668105585 .fill-B6{fill:#f7f8fe}.d2-668105585 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M364 162h1915v165H364z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1321.5" y="149" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">확률 공간의 정의</text></g><g ><g class="shape"><path d="M3011 109h325v98h-325z" class="stroke-B1 fill-B6 s0"/></g><text x="3173.5" y="147.5" class="text-bold fill-N1 s1"><tspan x="3173.5" dy="0">합의 규칙</tspan><tspan x="3173.5" dy="17.667">쌍마다 서로소인 E₀, E₁, ⋯ 에 대해</tspan><tspan x="3173.5" dy="17.667">Pr[∪ Eₙ] = Σ Pr[Eₙ]</tspan></text></g><g ><g class="shape"><path d="M3806 0h165v82h-165z" class="stroke-B1 fill-B6 s0"/></g><text x="3888.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="3888.5" dy="0">여사건 규칙</tspan><tspan x="3888.5" dy="18.5">Pr[¬A] = 1 − Pr[A]</tspan></text></g><g ><g class="shape"><path d="M3769 188h239v82h-239z" class="stroke-B1 fill-B6 s0"/></g><text x="3888.5" y="226.5" class="text-bold fill-N1 s1"><tspan x="3888.5" dy="0">차의 규칙</tspan><tspan x="3888.5" dy="18.5">Pr[B − A] = Pr[B] − Pr[A ∩ B]</tspan></text></g><g ><g class="shape"><path d="M4405 188h290v82h-290z" class="stroke-B1 fill-B6 s0"/></g><text x="4550" y="226.5" class="text-bold fill-N1 s1"><tspan x="4550" dy="0">포함배제</tspan><tspan x="4550" dy="18.5">Pr[A ∪ B] = Pr[A] + Pr[B] − Pr[A ∩ B]</tspan></text></g><g ><g class="shape"><path d="M5143 188h212v82h-212z" class="stroke-B1 fill-B6 s0"/></g><text x="5249" y="226.5" class="text-bold fill-N1 s1"><tspan x="5249" dy="0">불의 부등식</tspan><tspan x="5249" dy="18.5">Pr[A ∪ B] ≤ Pr[A] + Pr[B]</tspan></text></g><g ><g class="shape"><path d="M3064 267h219v82h-219z" class="stroke-B1 fill-B6 s0"/></g><text x="3173.5" y="305.5" class="text-bold fill-N1 s1"><tspan x="3173.5" dy="0">단조성</tspan><tspan x="3173.5" dy="18.5">A ⊆ B 이면 Pr[A] ≤ Pr[B]</tspan></text></g><g ><g class="shape"><path d="M5844 180h252v98h-252z" class="stroke-B1 fill-B6 s0"/></g><text x="5970" y="218.5" class="text-bold fill-N1 s1"><tspan x="5970" dy="0">합집합 한계(union bound)</tspan><tspan x="5970" dy="17.667">Pr[∪ Eₙ] ≤ Σ Pr[Eₙ]</tspan><tspan x="5970" dy="17.667">서로소가 아니어도 된다</tspan></text></g><g ><g class="shape"><path d="M1954 418h380v114h-380z" class="stroke-B1 fill-B6 s0"/></g><text x="2144" y="456.5" class="text-bold fill-N1 s1"><tspan x="2144" dy="0">균등 확률공간</tspan><tspan x="2144" dy="17.25">유한하고 모든 Pr[ω] 가 같으면</tspan><tspan x="2144" dy="17.25">Pr[E] = |E| / |S|</tspan><tspan x="2144" dy="17.25">17장의 셈의 규칙이 그대로 확률이 된다</tspan></text></g><text x="553.5" y="434" class="fill-N1 s1"><tspan x="553.5" dy="0">합집합 한계가 특히 쓸모 있다. 우주선의 결정적 부품 n 개 가운데 i 번째가 고장 날 사건을 Eᵢ 라 하면</tspan><tspan x="553.5" dy="17.667">어느 하나라도 고장 날 확률이 Σ Pr[Eᵢ] 이하다. 부품끼리 어떻게 얽혀 있는지 몰라도 상한을 얻는다.</tspan><tspan x="553.5" dy="17.667">한편 하한은 max Pr[Eᵢ] 다 — 단조성에서 나온다. 22장의 편차 한계도 이 두 줄과 같은 종류의 도구다.</tspan></text><g ><g class="shape"><path d="M394 199h318v98H394z" class="stroke-B1 fill-B5 s0"/></g><text x="553" y="237.5" class="text-bold fill-N1 s1"><tspan x="553" dy="0">가산 표본공간 S</tspan><tspan x="553" dy="17.667">비어 있지 않은 가산집합.</tspan><tspan x="553" dy="17.667">원소 ω 가 결과, 부분집합이 사건</tspan></text></g><g ><g class="shape"><path d="M1250 199h192v98h-192z" class="stroke-B1 fill-B5 s0"/></g><text x="1346" y="237.5" class="text-bold fill-N1 s1"><tspan x="1346" dy="0">확률함수 Pr : S → ℝ</tspan><tspan x="1346" dy="17.667">① Pr[ω] ≥ 0</tspan><tspan x="1346" dy="17.667">② Σ Pr[ω] = 1</tspan></text></g><g ><g class="shape"><path d="M2038 192h211v82h-211z" class="stroke-B1 fill-B5 s0"/></g><text x="2143.5" y="230.5" class="text-bold fill-N1 s1"><tspan x="2143.5" dy="0">사건의 확률</tspan><tspan x="2143.5" dy="18.5">Pr[E] ::= Σ Pr[ω] (ω ∈ E)</tspan></text></g><marker id="mk-d2-668105585-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-668105585-3488378134)" d="M714 248.25h531.5" class="connection stroke-B1 s0" mask="url(#d2-668105585)"/><path fill="none" marker-end="url(#mk-d2-668105585-3488378134)" d="M1444.498 244.003C1646.5 235.218 1765.7 233 2034.5 233" class="connection stroke-B1 s0" mask="url(#d2-668105585)"/><path fill="none" marker-end="url(#mk-d2-668105585-3488378134)" d="M2250.952 208.563C2431.4 168.2 2797.4 158 3007 158" class="connection stroke-B1 s0" mask="url(#d2-668105585)"/><text x="2627.5" y="168" class="text-italic fill-N2 s1">정의를 두 번 쓰고 항을 모은다</text><path fill="none" marker-end="url(#mk-d2-668105585-3488378134)" d="M3337.356 127.256C3509.1 58.399 3603.3 41 3802.5 41" class="connection stroke-B1 s0" mask="url(#d2-668105585)"/><text x="3564" y="54" class="text-italic fill-N2 s1">S = A ∪ ¬A 로 쪼갠다</text><path fill="none" marker-end="url(#mk-d2-668105585-3488378134)" d="M3337.465 188.371C3509.1 220.8 3595.9 229 3765.5 229" class="connection stroke-B1 s0" mask="url(#d2-668105585)"/><text x="3550.5" y="230" class="text-italic fill-N2 s1">B = (B−A) ∪ (A∩B)</text><path fill="none" marker-end="url(#mk-d2-668105585-3488378134)" d="M4009.5 229h392" class="connection stroke-B1 s0" mask="url(#d2-668105585)"/><text x="4207" y="235" class="text-italic fill-N2 s1">A ∪ B = A ∪ (B−A)</text><path fill="none" marker-end="url(#mk-d2-668105585-3488378134)" d="M4697 229h442" class="connection stroke-B1 s0" mask="url(#d2-668105585)"/><text x="4919.5" y="235" class="text-italic fill-N2 s1">확률은 음이 아니다</text><path fill="none" marker-end="url(#mk-d2-668105585-3488378134)" d="M2250.952 257.437C2431.4 297.8 2808 308 3060 308" class="connection stroke-B1 s0" mask="url(#d2-668105585)"/><text x="2654" y="309" class="text-italic fill-N2 s1">결과의 확률이 음이 아니다</text><path fill="none" marker-end="url(#mk-d2-668105585-3488378134)" d="M5356.5 229h484" class="connection stroke-B1 s0" mask="url(#d2-668105585)"/><text x="5600" y="235" class="text-italic fill-N2 s1">항이 무한히 많아도 같다</text><path fill="none" marker-end="url(#mk-d2-668105585-3488378134)" d="M1444.462 267.662c202.038 40.192 309.8 70.288 533.082 148.762" class="connection stroke-B1 s0" mask="url(#d2-668105585)"/><text x="1716.5" y="333" class="text-italic fill-N2 s1">값이 모두 같은 특별한 경우</text><mask id="d2-668105585" width="6154" height="734" x="43" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M43-101h6154v734H43z"/><path d="M2502 152h251v21h-251zM3489 38h150v21h-150zM3492 214h117v21h-117zM4150 219h114v21h-114zM4837 219h165v21h-165zM2541 293h226v21h-226zM5497 219h206v21h-206zM1602 317h229v21h-229z"/></mask></svg>