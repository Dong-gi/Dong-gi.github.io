<svg xmlns="http://www.w3.org/2000/svg" width="1910" height="674" class="d2-384006237 d2-svg" viewBox="-101 -101 1910 674"><rect width="1910" height="674" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-384006237 .fill-N1{fill:#0a0f25}.d2-384006237 .fill-N2{fill:#676c7e}.d2-384006237 .fill-B6{fill:#f7f8fe}.d2-384006237 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M56 0h152v66H56z" class="stroke-B1 fill-B6 s0"/></g><text x="132" y="38.5" class="text-bold fill-N1 s1">¬ ∀x ∃y. P(x, y)</text></g><g ><g class="shape"><path d="M0 187h264v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="132" y="225.5" class="text-bold fill-N1 s1"><tspan x="132" dy="0">∃x ¬ ∃y. P(x, y)</tspan><tspan x="132" dy="18.5">∀ 를 지나며 ∃ 로 바뀌었다</tspan></text></g><g ><g class="shape"><path d="M0 390h264v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="132" y="428.5" class="text-bold fill-N1 s1"><tspan x="132" dy="0">∃x ∀y. ¬P(x, y)</tspan><tspan x="132" dy="18.5">∃ 를 지나며 ∀ 로 바뀌었다</tspan></text></g><text x="449" y="23" class="fill-N1 s1"><tspan x="449" dy="0">말로 읽으면</tspan><tspan x="449" dy="17.667">원식: ‘모든 x 마다 그런 y 가 있다’ 가 아니다</tspan><tspan x="449" dy="17.667">결과: ‘어떤 x 에 대해서는 어떤 y 도 안 된다’</tspan></text><text x="932.5" y="23" class="fill-N1 s1"><tspan x="932.5" dy="0">왜 그런가 — 드모르간 법칙을 무한히 늘린 것이다.</tspan><tspan x="932.5" dy="17.667">∀x. P(x) 는 P(d₀) ∧ P(d₁) ∧ … 이고 ∃x. P(x) 는 P(d₀) ∨ P(d₁) ∨ … 이다.</tspan><tspan x="932.5" dy="17.667">¬(A ∧ B) ≡ ¬A ∨ ¬B 를 무한 개에 적용하면 위의 규칙이 나온다</tspan></text><text x="1471.5" y="23" class="fill-N1 s1"><tspan x="1471.5" dy="0">이 규칙이 반례의 근거다.</tspan><tspan x="1471.5" dy="17.667">전칭명제 ∀x. P(x) 를 부정하면 ∃x. ¬P(x) 이므로,</tspan><tspan x="1471.5" dy="17.667">반례 하나를 내놓는 것으로 전칭명제를 무너뜨릴 수 있다</tspan></text><marker id="mk-d2-384006237-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-384006237-3488378134)" d="M132 67.5v116" class="connection stroke-B1 s0" mask="url(#d2-384006237)"/><text x="132.5" y="132" class="text-italic fill-N2 s1">¬ 를 ∀ 안으로</text><path fill="none" marker-end="url(#mk-d2-384006237-3488378134)" d="M132 270.5v116" class="connection stroke-B1 s0" mask="url(#d2-384006237)"/><text x="132.5" y="335" class="text-italic fill-N2 s1">¬ 를 ∃ 안으로</text><mask id="d2-384006237" width="1910" height="674" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1910v674H-101z"/><path d="M78 116h109v21H78zM78 319h109v21H78z"/></mask></svg>