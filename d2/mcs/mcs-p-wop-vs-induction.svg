<svg xmlns="http://www.w3.org/2000/svg" width="1819" height="666" class="d2-2496053116 d2-svg" viewBox="-101 -101 1819 666"><rect width="1819" height="666" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2496053116 .fill-N1{fill:#0a0f25}.d2-2496053116 .fill-B6{fill:#f7f8fe}.d2-2496053116 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="338" cy="128.5" class="shape stroke-B1 fill-B6 s0" rx="328" ry="109.5"/></g><text x="338" y="118" class="text-bold fill-N1 s1"><tspan x="338" dy="0">둘은 같은 힘을 갖는다</tspan><tspan x="338" dy="17.667">한쪽으로 증명되는 것은 다른 쪽으로도 증명된다</tspan><tspan x="338" dy="17.667">(7장에서 서로를 유도한다)</tspan></text></g><g ><g class="shape"><path d="M812 0h238v98H812z" class="stroke-B1 fill-B6 s0"/></g><text x="931" y="38.5" class="text-bold fill-N1 s1"><tspan x="931" dy="0">수학적 귀납법</tspan><tspan x="931" dy="17.667">① P(0) 을 보인다</tspan><tspan x="931" dy="17.667">② P(k) → P(k+1) 을 보인다</tspan></text></g><g ><g class="shape"><path d="M776 158h310v98H776z" class="stroke-B1 fill-B6 s0"/></g><text x="931" y="196.5" class="text-bold fill-N1 s1"><tspan x="931" dy="0">정렬성 원리</tspan><tspan x="931" dy="17.667">① 반례가 있다고 가정한다</tspan><tspan x="931" dy="17.667">② 최소 반례에서 모순을 얻는다</tspan></text></g><g ><g class="shape"><path d="M1186 8h431v82h-431z" class="stroke-B1 fill-B6 s0"/></g><text x="1401.5" y="46.5" class="text-bold fill-N1 s1"><tspan x="1401.5" dy="0">잘 맞는 자리</tspan><tspan x="1401.5" dy="18.5">합의 공식처럼 n 에서 n+1 로 가는 길이 뻔한 것</tspan></text></g><g ><g class="shape"><path d="M1231 158h341v98h-341z" class="stroke-B1 fill-B6 s0"/></g><text x="1401.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="1401.5" dy="0">잘 맞는 자리</tspan><tspan x="1401.5" dy="17.667">한 걸음이 한 칸이 아닌 것</tspan><tspan x="1401.5" dy="17.667">(c − 3 을 쓰거나 c 를 둘로 쪼개는 것)</tspan></text></g><text x="338.5" y="314" class="fill-N1 s1"><tspan x="338.5" dy="0">번역하는 법: 귀납 증명의 ‘P(k) 를 가정한다’ 는</tspan><tspan x="338.5" dy="17.667">WOP 증명의 ‘c 보다 작은 곳에서는 참이다’ 와 같은 정보다.</tspan><tspan x="338.5" dy="17.667">귀납법의 ①은 WOP 증명에서 ‘c &gt; 0 이다’ 를 확보하는 자리에 대응한다</tspan></text><text x="338" y="427" class="fill-N1 s1"><tspan x="338" dy="0">WOP 쪽이 더 멀리 간다.</tspan><tspan x="338" dy="17.667">ℕ 이 아닌 정렬집합(예: 하계가 있는 정수 집합, 유한집합)에서도 같은 논증이 돌고,</tspan><tspan x="338" dy="17.667">그래서 ‘계산이 끝난다’ 는 증명에 쓰인다</tspan></text><marker id="mk-d2-2496053116-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2496053116-3488378134)" d="M618.96 70.604C704.2 53.4 743.2 49 808 49" class="connection stroke-B1 s0" mask="url(#d2-2496053116)"/><path fill="none" marker-end="url(#mk-d2-2496053116-3488378134)" d="M619.96 185.4C704.4 202.6 736 207 772 207" class="connection stroke-B1 s0" mask="url(#d2-2496053116)"/><path fill="none" marker-end="url(#mk-d2-2496053116-3488378134)" d="M1052 49h130" class="connection stroke-B1 s0" mask="url(#d2-2496053116)"/><path fill="none" marker-end="url(#mk-d2-2496053116-3488378134)" d="M1088 207h139" class="connection stroke-B1 s0" mask="url(#d2-2496053116)"/><mask id="d2-2496053116" width="1819" height="666" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1819v666H-101z"/></mask></svg>