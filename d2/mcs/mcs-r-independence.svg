<svg xmlns="http://www.w3.org/2000/svg" width="1769" height="1234" class="d2-2568812974 d2-svg" viewBox="-101 -101 1769 1234"><rect width="1769" height="1234" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2568812974 .fill-N1{fill:#0a0f25}.d2-2568812974 .fill-N2{fill:#676c7e}.d2-2568812974 .fill-B6{fill:#f7f8fe}.d2-2568812974 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="432.5" cy="56.5" class="shape stroke-B1 fill-B6 s0" rx="169.5" ry="56.5"/></g><text x="432.5" y="62" class="text-bold fill-N1 s1">이 사건들이 독립인가?</text></g><g ><g class="shape"><path d="M0 242h385v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="192.5" y="280.5" class="text-bold fill-N1 s1"><tspan x="192.5" dy="0">사건이 둘일 때</tspan><tspan x="192.5" dy="17.667">Pr[A | B] = Pr[A] ⟺ Pr[A ∩ B] = Pr[A]Pr[B]</tspan><tspan x="192.5" dy="17.667">등식 하나만 확인한다. 좌우가 대칭이다</tspan></text></g><g ><g class="shape"><path d="M445 234h454v114H445z" class="stroke-B1 fill-B6 s0"/></g><text x="672" y="272.5" class="text-bold fill-N1 s1"><tspan x="672" dy="0">사건이 n 개일 때 — 상호 독립(mutually independent)</tspan><tspan x="672" dy="17.25">크기 2 이상인 모든 부분집합 T 에 대해</tspan><tspan x="672" dy="17.25">Pr[∩ Eᵢ (i ∈ T)] = Π Pr[Eᵢ] (i ∈ T)</tspan><tspan x="672" dy="17.25">확인할 등식이 2ⁿ − n − 1 개다</tspan></text></g><g ><g class="shape"><path d="M516 469h313v98H516z" class="stroke-B1 fill-B6 s0"/></g><text x="672.5" y="507.5" class="text-bold fill-N1 s1"><tspan x="672.5" dy="0">k-겹 독립(k-way independent)</tspan><tspan x="672.5" dy="17.667">크기 k 인 부분집합만 확인한다.</tspan><tspan x="672.5" dy="17.667">k = 2 이면 쌍마다 독립(pairwise)</tspan></text></g><g ><g class="shape"><path d="M423 688h499v130H423z" class="stroke-B1 fill-B6 s0"/></g><text x="672.5" y="726.5" class="text-bold fill-N1 s1"><tspan x="672.5" dy="0">쌍마다 독립 ≠ 상호 독립</tspan><tspan x="672.5" dy="17">공정한 동전 셋에서</tspan><tspan x="672.5" dy="17">A₁ = ‘1·2 가 같다’, A₂ = ‘2·3 이 같다’, A₃ = ‘3·1 이 같다’</tspan><tspan x="672.5" dy="17">쌍마다는 1/4 = (1/2)(1/2) 로 맞지만</tspan><tspan x="672.5" dy="17">셋을 함께 보면 1/4 ≠ 1/8 이다</tspan></text></g><g ><g class="shape"><path d="M434 918h477v114H434z" class="stroke-B1 fill-B6 s0"/></g><text x="672.5" y="956.5" class="text-bold fill-N1 s1"><tspan x="672.5" dy="0">무엇이 달라지나</tspan><tspan x="672.5" dy="17.25">상호 독립을 가정하면 다섯 표지의 곱이 1/170000000</tspan><tspan x="672.5" dy="17.25">쌍마다 독립만 가정하면 1/17000 까지밖에 못 간다</tspan><tspan x="672.5" dy="17.25">아무 가정도 없으면 1/170 이다</tspan></text></g><text x="1114.5" y="30" class="fill-N1 s1"><tspan x="1114.5" dy="0">두 가지 주의.</tspan><tspan x="1114.5" dy="17">① 서로소인 사건은 독립이 아니다 — 오히려 정반대다. A 가 일어났음을 알면 B 가 일어나지 않았음을 알게 된다.</tspan><tspan x="1114.5" dy="17"> (확률이 0 인 사건만 예외이고, 그 사건은 정의상 모든 사건과 독립이다.)</tspan><tspan x="1114.5" dy="17">② 독립은 가정이다. 관측으로 확인하지 않은 독립을 곱셈에 쓰면 확률을 몇 자리씩 과소평가한다.</tspan><tspan x="1114.5" dy="17"> 시간별 강우확률 10% 를 열두 번 곱해 ‘비 안 올 확률 0.28’ 을 얻는 계산이 그 예다.</tspan></text><marker id="mk-d2-2568812974-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2568812974-3488378134)" d="M334.205 103.882C221.2 159.4 192.5 187.3 192.5 238.5" class="connection stroke-B1 s0" mask="url(#d2-2568812974)"/><text x="235.5" y="158" class="text-italic fill-N2 s1">n = 2</text><path fill="none" marker-end="url(#mk-d2-2568812974-3488378134)" d="M530.794 103.884C643.4 159.4 672 185.7 672 230.5" class="connection stroke-B1 s0" mask="url(#d2-2568812974)"/><text x="625.5" y="156" class="text-italic fill-N2 s1">n ≥ 3</text><path fill="none" marker-end="url(#mk-d2-2568812974-3488378134)" d="M672 349.5v116" class="connection stroke-B1 s0" mask="url(#d2-2568812974)"/><text x="672.5" y="414" class="text-italic fill-N2 s1">더 약한 조건</text><path fill="none" marker-end="url(#mk-d2-2568812974-3488378134)" d="M672 568.5v116" class="connection stroke-B1 s0" mask="url(#d2-2568812974)"/><text x="672.5" y="633" class="text-italic fill-N2 s1">여기서 갈린다</text><path fill="none" marker-end="url(#mk-d2-2568812974-3488378134)" d="M672 820v94" class="connection stroke-B1 s0" mask="url(#d2-2568812974)"/><mask id="d2-2568812974" width="1769" height="1234" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1769v1234H-101z"/><path d="M218 142h35v21h-35zM607 140h37v21h-37zM619 398h107v21H619zM611 617h123v21H611z"/></mask></svg>