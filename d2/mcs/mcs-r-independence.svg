<svg xmlns="http://www.w3.org/2000/svg" width="1013" height="1451" class="d2-2767124913 d2-svg" viewBox="-101 -101 1013 1451"><rect width="1013" height="1451" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2767124913 .text-bold{font-weight:700}.d2-2767124913 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2767124913 .fill-N1{fill:#0a0f25}.d2-2767124913 .fill-N2{fill:#676c7e}.d2-2767124913 .fill-B6{fill:#f7f8fe}.d2-2767124913 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="410.5" cy="56.5" class="shape stroke-B1 fill-B6 s0" rx="169.5" ry="56.5"/></g><text x="410.5" y="62" class="text-bold fill-N1 s1">이 사건들이 독립인가?</text></g><g ><g class="shape"><path d="M0 250h385v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="192.5" y="288.5" class="text-bold fill-N1 s1"><tspan x="192.5" dy="0">사건이 둘일 때</tspan><tspan x="192.5" dy="17.667">Pr[A | B] = Pr[A] ⟺ Pr[A ∩ B] = Pr[A]Pr[B]</tspan><tspan x="192.5" dy="17.667">등식 하나만 확인한다. 좌우가 대칭이다</tspan></text></g><g ><g class="shape"><path d="M445 234h366v130H445z" class="stroke-B1 fill-B6 s0"/></g><text x="628" y="272.5" class="text-bold fill-N1 s1"><tspan x="628" dy="0">사건이 n 개일 때 —</tspan><tspan x="628" dy="17">상호 독립(mutually independent)</tspan><tspan x="628" dy="17">크기 2 이상인 모든 부분집합 T 에 대해</tspan><tspan x="628" dy="17">Pr[∩ Eᵢ (i ∈ T)] = Π Pr[Eᵢ] (i ∈ T)</tspan><tspan x="628" dy="17">확인할 등식이 2ⁿ − n − 1 개다</tspan></text></g><g ><g class="shape"><path d="M472 485h313v98H472z" class="stroke-B1 fill-B6 s0"/></g><text x="628.5" y="523.5" class="text-bold fill-N1 s1"><tspan x="628.5" dy="0">k-겹 독립(k-way independent)</tspan><tspan x="628.5" dy="17.667">크기 k 인 부분집합만 확인한다.</tspan><tspan x="628.5" dy="17.667">k = 2 이면 쌍마다 독립(pairwise)</tspan></text></g><g ><g class="shape"><path d="M453 704h351v146H453z" class="stroke-B1 fill-B6 s0"/></g><text x="628.5" y="742.5" class="text-bold fill-N1 s1"><tspan x="628.5" dy="0">쌍마다 독립 ≠ 상호 독립</tspan><tspan x="628.5" dy="16.833">공정한 동전 셋에서</tspan><tspan x="628.5" dy="16.833">A₁ = ‘1·2 가 같다’, A₂ = ‘2·3 이 같다’,</tspan><tspan x="628.5" dy="16.833">A₃ = ‘3·1 이 같다’</tspan><tspan x="628.5" dy="16.833">쌍마다는 1/4 = (1/2)(1/2) 로 맞지만</tspan><tspan x="628.5" dy="16.833">셋을 함께 보면 1/4 ≠ 1/8 이다</tspan></text></g><g ><g class="shape"><path d="M479 950h298v146H479z" class="stroke-B1 fill-B6 s0"/></g><text x="628" y="988.5" class="text-bold fill-N1 s1"><tspan x="628" dy="0">무엇이 달라지나</tspan><tspan x="628" dy="16.833">상호 독립을 가정하면</tspan><tspan x="628" dy="16.833">다섯 표지의 곱이 1/170000000</tspan><tspan x="628" dy="16.833">쌍마다 독립만 가정하면</tspan><tspan x="628" dy="16.833">1/17000 까지밖에 못 간다</tspan><tspan x="628" dy="16.833">아무 가정도 없으면 1/170 이다</tspan></text></g><text x="405.5" y="1132" class="fill-N1 s1"><tspan x="405.5" dy="0">두 가지 주의.</tspan><tspan x="405.5" dy="16.625">① 서로소인 사건은 독립이 아니다 — 오히려 정반대다.</tspan><tspan x="405.5" dy="16.625"> A 가 일어났음을 알면 B 가 일어나지 않았음을 알게 된다.</tspan><tspan x="405.5" dy="16.625"> (확률이 0 인 사건만 예외이고, 그 사건은 정의상 모든 사건과 독립이다.)</tspan><tspan x="405.5" dy="16.625">② 독립은 가정이다. 관측으로 확인하지 않은 독립을 곱셈에 쓰면</tspan><tspan x="405.5" dy="16.625"> 확률을 몇 자리씩 과소평가한다.</tspan><tspan x="405.5" dy="16.625"> 시간별 강우확률 10% 를 열두 번 곱해</tspan><tspan x="405.5" dy="16.625"> ‘비 안 올 확률 0.28’ 을 얻는 계산이 그 예다.</tspan></text><marker id="mk-d2-2767124913-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2767124913-3488378134)" d="M319.24 104.951C218.2 159.6 192.5 188.9 192.5 246.5" class="connection stroke-B1 s0" mask="url(#d2-2767124913)"/><text x="225.5" y="161" class="text-italic fill-N2 s1">n = 2</text><path fill="none" marker-end="url(#mk-d2-2767124913-3488378134)" d="M501.758 104.954C602.4 159.6 628 185.7 628 230.5" class="connection stroke-B1 s0" mask="url(#d2-2767124913)"/><text x="588.5" y="158" class="text-italic fill-N2 s1">n ≥ 3</text><path fill="none" marker-end="url(#mk-d2-2767124913-3488378134)" d="M628 365.5v116" class="connection stroke-B1 s0" mask="url(#d2-2767124913)"/><text x="628.5" y="430" class="text-italic fill-N2 s1">더 약한 조건</text><path fill="none" marker-end="url(#mk-d2-2767124913-3488378134)" d="M628 584.5v116" class="connection stroke-B1 s0" mask="url(#d2-2767124913)"/><text x="628.5" y="649" class="text-italic fill-N2 s1">여기서 갈린다</text><path fill="none" marker-end="url(#mk-d2-2767124913-3488378134)" d="M628 852v94" class="connection stroke-B1 s0" mask="url(#d2-2767124913)"/><mask id="d2-2767124913" width="1013" height="1451" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H912v1451H-101z"/><path d="M208 145h35v21h-35zM570 142h37v21h-37zM575 414h107v21H575zM567 633h123v21H567z"/></mask></svg>