<svg xmlns="http://www.w3.org/2000/svg" width="1293" height="1520" class="d2-1835756737 d2-svg" viewBox="-81 -101 1293 1520"><rect width="1293" height="1520" x="-81" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1835756737 .fill-N1{fill:#0a0f25}.d2-1835756737 .fill-N2{fill:#676c7e}.d2-1835756737 .fill-B5{fill:#edf0fd}.d2-1835756737 .fill-B6{fill:#f7f8fe}.d2-1835756737 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="643.5" cy="50" class="shape stroke-B1 fill-B6 s0" rx="149.5" ry="50"/></g><text x="643.5" y="47.5" class="text-bold fill-N1 s1"><tspan x="643.5" dy="0">세려는 집합 T</tspan><tspan x="643.5" dy="18.5">곧바로 세기 어렵다</tspan></text></g><g ><g class="shape"><path d="M345 200h596v66H345z" class="stroke-B1 fill-B6 s0"/></g><text x="643" y="238.5" class="text-bold fill-N1 s1">이미 셀 수 있는 것(대개 수열)의 집합 S 로 보내는 사상 f 를 만든다</text></g><g ><g class="shape"><path d="M643 458h-3l-150-45c-2 0-2-1 0-2l150-45h6l150 45c2 0 2 1 0 2l-150 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="643" y="417.5" class="text-bold fill-N1 s1">f 는 몇 대 1 인가?</text></g><g ><g class="shape"><path d="M338 579h162v98H338z" class="stroke-B1 fill-B6 s0"/></g><text x="419" y="617.5" class="text-bold fill-N1 s1"><tspan x="419" dy="0">1 대 1 (전단사)</tspan><tspan x="419" dy="17.667">전단사 규칙</tspan><tspan x="419" dy="17.667">|T| = |S|</tspan></text></g><g ><g class="shape"><path d="M648 579h148v98H648z" class="stroke-B1 fill-B6 s0"/></g><text x="722" y="617.5" class="text-bold fill-N1 s1"><tspan x="722" dy="0">k 대 1</tspan><tspan x="722" dy="17.667">나눗셈 규칙</tspan><tspan x="722" dy="17.667">|T| = |S| / k</tspan></text></g><g ><g class="shape"><path d="M856 579h255v98H856z" class="stroke-B1 fill-B6 s0"/></g><text x="983.5" y="617.5" class="text-bold fill-N1 s1"><tspan x="983.5" dy="0">일정하지 않다</tspan><tspan x="983.5" dy="17.667">경우를 갈라 다시 세거나</tspan><tspan x="983.5" dy="17.667">다른 사상을 찾는다</tspan></text></g><g ><g class="shape"><path d="M20 797h860v372H20z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="450" y="1156" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">S 를 세는 도구</text></g><path fill="transparent" stroke="transparent" d="M197 1189h736v129H197z" class="shape s0"/><g ><g class="shape"><path d="M50 827h319v98H50z" class="stroke-B1 fill-B5 s0"/></g><text x="209.5" y="865.5" class="text-bold fill-N1 s1"><tspan x="209.5" dy="0">곱의 규칙</tspan><tspan x="209.5" dy="17.667">칸마다 고르는 수가 정해져 있다</tspan><tspan x="209.5" dy="17.667">|P₁ × ⋯ × Pₙ| = |P₁|⋯|Pₙ|</tspan></text></g><g ><g class="shape"><path d="M463 827h340v98H463z" class="stroke-B1 fill-B5 s0"/></g><text x="633" y="865.5" class="text-bold fill-N1 s1"><tspan x="633" dy="0">일반화된 곱의 규칙</tspan><tspan x="633" dy="17.667">앞의 선택이 뒤의 가짓수를 바꿔도</tspan><tspan x="633" dy="17.667">가짓수 자체가 일정하면 곱한다</tspan></text></g><g ><g class="shape"><path d="M112 1033h360v82H112z" class="stroke-B1 fill-B5 s0"/></g><text x="292" y="1071.5" class="text-bold fill-N1 s1"><tspan x="292" dy="0">합의 규칙</tspan><tspan x="292" dy="18.5">겹치지 않는 경우로 갈랐다면 더한다</tspan></text></g><g ><g class="shape"><path d="M554 1025h296v98H554z" class="stroke-B1 fill-B5 s0"/></g><text x="702" y="1063.5" class="text-bold fill-N1 s1"><tspan x="702" dy="0">포함배제</tspan><tspan x="702" dy="17.667">겹치면 겹친 만큼을 빼고</tspan><tspan x="702" dy="17.667">지나치게 뺀 만큼을 되돌린다</tspan></text></g><text x="565" y="1235" class="fill-N1 s1"><tspan x="565" dy="0">가장 흔한 실수: k 대 1 인 사상을 전단사로 착각하는 것.</tspan><tspan x="565" dy="17.25">두 쌍 포커 손이 그 예다 — 첫 쌍과 둘째 쌍을 구별할 근거가 없어 사상이 2 대 1 이다.</tspan><tspan x="565" dy="17.25">막는 법 둘: ① 사상마다 ‘한 원소로 화살표가 몇 개 오는가’ 를 세어 적는다</tspan><tspan x="565" dy="17.25">② 같은 문제를 다른 길로 한 번 더 풀어 두 답을 맞춰 본다</tspan></text><marker id="mk-d2-1835756737-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1835756737-3488378134)" d="M643.01 102c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-1835756737)"/><path fill="none" marker-end="url(#mk-d2-1835756737-3488378134)" d="M643.25 268c0 38-.05 58-.23 94" class="connection stroke-B1 s0" mask="url(#d2-1835756737)"/><path fill="none" marker-end="url(#mk-d2-1835756737-3488378134)" d="M580.199 440.869C451.799 502.8 419.25 530.7 419.25 575.5" class="connection stroke-B1 s0" mask="url(#d2-1835756737)"/><text x="476" y="497" class="text-italic fill-N2 s1">각 원소로 화살표가 하나</text><path fill="none" marker-end="url(#mk-d2-1835756737-3488378134)" d="M673.171 451.621C711.6 504.8 721.5 530.7 721.5 575.5" class="connection stroke-B1 s0" mask="url(#d2-1835756737)"/><text x="713" y="514" class="text-italic fill-N2 s1">각 원소로 화살표가 k 개</text><path fill="none" marker-end="url(#mk-d2-1835756737-3488378134)" d="M722.908 436.6C930.6 502 983 530.7 983 575.5" class="connection stroke-B1 s0" mask="url(#d2-1835756737)"/><text x="877.5" y="491" class="text-italic fill-N2 s1">개수가 원소마다 다르다</text><path fill="none" marker-end="url(#mk-d2-1835756737-3488378134)" d="M335.945 666.86C235.35 714.8 209.75 787 209.75 823" class="connection stroke-B1 s0" mask="url(#d2-1835756737)"/><path fill="none" marker-end="url(#mk-d2-1835756737-3488378134)" d="M472.705 678.372C513.65 717 535.25 787 576.29 824.31" class="connection stroke-B1 s0" mask="url(#d2-1835756737)"/><path fill="none" marker-end="url(#mk-d2-1835756737-3488378134)" d="M682 678.562C651.25 717 642.25 787 638.649 823.02" class="connection stroke-B1 s0" mask="url(#d2-1835756737)"/><path fill="none" marker-end="url(#mk-d2-1835756737-3488378134)" d="M414.051 678.99C410.25 717 409.25 737 409.25 752v74.5c0 29.7-13.8 160.1-65.938 203.926" class="connection stroke-B1 s0" mask="url(#d2-1835756737)"/><path fill="none" marker-end="url(#mk-d2-1835756737-3488378134)" d="M502.198 647.367C774.65 710.982 843.25 737 843.25 752v74.5c0 29.7-14.4 158.5-68.715 196.218" class="connection stroke-B1 s0" mask="url(#d2-1835756737)"/><mask id="d2-1835756737" width="1293" height="1520" x="-81" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-81-101h1293v1520H-81z"/><path d="M373 481h206v21H373zM614 498h198v21H614zM776 475h203v21H776z"/></mask></svg>