<svg xmlns="http://www.w3.org/2000/svg" width="1981" height="1157" class="d2-3743344514 d2-svg" viewBox="-91 -101 1981 1157"><rect width="1981" height="1157" x="-91" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3743344514 .fill-N1{fill:#0a0f25}.d2-3743344514 .fill-N2{fill:#676c7e}.d2-3743344514 .fill-B5{fill:#edf0fd}.d2-3743344514 .fill-B6{fill:#f7f8fe}.d2-3743344514 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="903.5" cy="50" class="shape stroke-B1 fill-B6 s0" rx="149.5" ry="50"/></g><text x="903.5" y="47.5" class="text-bold fill-N1 s1"><tspan x="903.5" dy="0">세려는 집합 T</tspan><tspan x="903.5" dy="18.5">곧바로 세기 어렵다</tspan></text></g><g ><g class="shape"><path d="M605 200h596v66H605z" class="stroke-B1 fill-B6 s0"/></g><text x="903" y="238.5" class="text-bold fill-N1 s1">이미 셀 수 있는 것(대개 수열)의 집합 S 로 보내는 사상 f 를 만든다</text></g><g ><g class="shape"><path d="M903 458h-3l-150-45c-2 0-2-1 0-2l150-45h6l150 45c2 0 2 1 0 2l-150 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="903" y="417.5" class="text-bold fill-N1 s1">f 는 몇 대 1 인가?</text></g><g ><g class="shape"><path d="M702 579h162v98H702z" class="stroke-B1 fill-B6 s0"/></g><text x="783" y="617.5" class="text-bold fill-N1 s1"><tspan x="783" dy="0">1 대 1 (전단사)</tspan><tspan x="783" dy="17.667">전단사 규칙</tspan><tspan x="783" dy="17.667">|T| = |S|</tspan></text></g><g ><g class="shape"><path d="M36 579h148v98H36z" class="stroke-B1 fill-B6 s0"/></g><text x="110" y="617.5" class="text-bold fill-N1 s1"><tspan x="110" dy="0">k 대 1</tspan><tspan x="110" dy="17.667">나눗셈 규칙</tspan><tspan x="110" dy="17.667">|T| = |S| / k</tspan></text></g><g ><g class="shape"><path d="M924 579h255v98H924z" class="stroke-B1 fill-B6 s0"/></g><text x="1051.5" y="617.5" class="text-bold fill-N1 s1"><tspan x="1051.5" dy="0">일정하지 않다</tspan><tspan x="1051.5" dy="17.667">경우를 갈라 다시 세거나</tspan><tspan x="1051.5" dy="17.667">다른 사상을 찾는다</tspan></text></g><g ><g class="shape"><path d="M10 797h1555v158H10z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="787.5" y="784" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">S 를 세는 도구</text></g><text x="1451" y="32" class="fill-N1 s1"><tspan x="1451" dy="0">가장 흔한 실수: k 대 1 인 사상을 전단사로 착각하는 것.</tspan><tspan x="1451" dy="17.25">두 쌍 포커 손이 그 예다 — 첫 쌍과 둘째 쌍을 구별할 근거가 없어 사상이 2 대 1 이다.</tspan><tspan x="1451" dy="17.25">막는 법 둘: ① 사상마다 ‘한 원소로 화살표가 몇 개 오는가’ 를 세어 적는다</tspan><tspan x="1451" dy="17.25">② 같은 문제를 다른 길로 한 번 더 풀어 두 답을 맞춰 본다</tspan></text><g ><g class="shape"><path d="M40 827h319v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="199.5" y="865.5" class="text-bold fill-N1 s1"><tspan x="199.5" dy="0">곱의 규칙</tspan><tspan x="199.5" dy="17.667">칸마다 고르는 수가 정해져 있다</tspan><tspan x="199.5" dy="17.667">|P₁ × ⋯ × Pₙ| = |P₁|⋯|Pₙ|</tspan></text></g><g ><g class="shape"><path d="M419 827h340v98H419z" class="stroke-B1 fill-B5 s0"/></g><text x="589" y="865.5" class="text-bold fill-N1 s1"><tspan x="589" dy="0">일반화된 곱의 규칙</tspan><tspan x="589" dy="17.667">앞의 선택이 뒤의 가짓수를 바꿔도</tspan><tspan x="589" dy="17.667">가짓수 자체가 일정하면 곱한다</tspan></text></g><g ><g class="shape"><path d="M819 835h360v82H819z" class="stroke-B1 fill-B5 s0"/></g><text x="999" y="873.5" class="text-bold fill-N1 s1"><tspan x="999" dy="0">합의 규칙</tspan><tspan x="999" dy="18.5">겹치지 않는 경우로 갈랐다면 더한다</tspan></text></g><g ><g class="shape"><path d="M1239 827h296v98h-296z" class="stroke-B1 fill-B5 s0"/></g><text x="1387" y="865.5" class="text-bold fill-N1 s1"><tspan x="1387" dy="0">포함배제</tspan><tspan x="1387" dy="17.667">겹치면 겹친 만큼을 빼고</tspan><tspan x="1387" dy="17.667">지나치게 뺀 만큼을 되돌린다</tspan></text></g><marker id="mk-d2-3743344514-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3743344514-3488378134)" d="M903 102v94" class="connection stroke-B1 s0" mask="url(#d2-3743344514)"/><path fill="none" marker-end="url(#mk-d2-3743344514-3488378134)" d="M903 268v94" class="connection stroke-B1 s0" mask="url(#d2-3743344514)"/><path fill="none" marker-end="url(#mk-d2-3743344514-3488378134)" d="M861.509 448.333C799 504.2 783 530.7 783 575.5" class="connection stroke-B1 s0" mask="url(#d2-3743344514)"/><text x="801" y="508" class="text-italic fill-N2 s1">각 원소로 화살표가 하나</text><path fill="none" marker-end="url(#mk-d2-3743344514-3488378134)" d="M792.018 426.268C246.6 500 109.75 530.7 109.75 575.5" class="connection stroke-B1 s0" mask="url(#d2-3743344514)"/><text x="427" y="481" class="text-italic fill-N2 s1">각 원소로 화살표가 k 개</text><path fill="none" marker-end="url(#mk-d2-3743344514-3488378134)" d="M951.62 446.173C1031.2 503.8 1051.5 530.7 1051.5 575.5" class="connection stroke-B1 s0" mask="url(#d2-3743344514)"/><text x="1024.5" y="504" class="text-italic fill-N2 s1">개수가 원소마다 다르다</text><path fill="none" marker-end="url(#mk-d2-3743344514-3488378134)" d="M700.528 642.333C300.099 710 199.5 787 199.5 823" class="connection stroke-B1 s0" mask="url(#d2-3743344514)"/><path fill="none" marker-end="url(#mk-d2-3743344514-3488378134)" d="M739.696 678.516C706.6 717 687 787 645.96 824.31" class="connection stroke-B1 s0" mask="url(#d2-3743344514)"/><path fill="none" marker-end="url(#mk-d2-3743344514-3488378134)" d="M186.146 653.638C360.25 712.2 422.85 787 493.726 825.106" class="connection stroke-B1 s0" mask="url(#d2-3743344514)"/><path fill="none" marker-end="url(#mk-d2-3743344514-3488378134)" d="M865.817 665.835C972 714.6 999 788.6 999 831" class="connection stroke-B1 s0" mask="url(#d2-3743344514)"/><path fill="none" marker-end="url(#mk-d2-3743344514-3488378134)" d="M865.973 641.325C1282.4 709.8 1387 787 1387 823" class="connection stroke-B1 s0" mask="url(#d2-3743344514)"/><mask id="d2-3