<svg xmlns="http://www.w3.org/2000/svg" width="1101" height="1920" class="d2-2857051866 d2-svg" viewBox="-101 -121 1101 1920"><rect width="1101" height="1920" x="-101" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2857051866 .fill-N1{fill:#0a0f25}.d2-2857051866 .fill-B4{fill:#e3e9fd}.d2-2857051866 .fill-B5{fill:#edf0fd}.d2-2857051866 .fill-B6{fill:#f7f8fe}.d2-2857051866 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M246 20h490v656H246z" class="stroke-B1 fill-B4 s0"/></g><text x="491" y="7" class="text-bold fill-N1 s1">열쇠 만들기 — 받는 사람이 혼자 한다</text></g><g ><g class="shape"><path d="M95 796h266v66H95z" class="stroke-B1 fill-B6 s0"/></g><text x="228" y="834.5" class="text-bold fill-N1 s2">공개키 (n, e) — 널리 뿌린다</text></g><g ><g class="shape"><path d="M519 1012h380v66H519z" class="stroke-B1 fill-B6 s0"/></g><text x="709" y="1050.5" class="text-bold fill-N1 s2">비밀키 d — 혼자만 갖는다. p, q 는 지운다</text></g><g ><g class="shape"><path d="M33 982h431v313H33z" class="stroke-B1 fill-B4 s0"/></g><text x="248.5" y="969" class="text-bold fill-N1 s1">쓰기 — 두 줄이 전부다</text></g><g ><g class="shape"><path d="M0 1415h557v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="278.5" y="1453.5" class="text-bold fill-N1 s2"><tspan x="278.5" dy="0">왜 되돌아오는가</tspan><tspan x="278.5" dy="17">ed ≡ 1 (mod φ(n)) 이므로 어떤 정수 k 에 대해 ed = 1 + kφ(n) 이다.</tspan><tspan x="278.5" dy="17">C 의 d 제곱은 M 의 ed 제곱이고, ed = 1 + kφ(n) 이므로</tspan><tspan x="278.5" dy="17">M × (M 의 φ(n) 제곱) 의 k 제곱 이다.</tspan><tspan x="278.5" dy="17">오일러 정리가 M 의 φ(n) 제곱 = 1 (mod n) 을 주므로 M 만 남는다</tspan></text></g><text x="279" y="1661" class="fill-N1 s2"><tspan x="279" dy="0">안전성이 기대는 것</tspan><tspan x="279" dy="17.667">n 만 알고는 p 와 q 를 되찾기 어렵다는 것 — 되찾으면 φ(n) 이 나오고</tspan><tspan x="279" dy="17.667">φ(n) 을 알면 d 가 나온다. 이것은 추측이고 증명된 적이 없다</tspan></text><g ><g class="shape"><path d="M313 50h356v82H313z" class="stroke-B1 fill-B5 s0"/></g><text x="491" y="88.5" class="text-bold fill-N1 s2"><tspan x="491" dy="0">1. 큰 소수 둘 p, q 를 고른다</tspan><tspan x="491" dy="18.5">(실무에서는 각각 300 자리를 넘는다)</tspan></text></g><g ><g class="shape"><path d="M320 232h343v66H320z" class="stroke-B1 fill-B5 s0"/></g><text x="491.5" y="270.5" class="text-bold fill-N1 s2">2. n = pq 와 φ(n) = (p−1)(q−1) 을 구한다</text></g><g ><g class="shape"><path d="M342 398h299v66H342z" class="stroke-B1 fill-B5 s0"/></g><text x="491.5" y="436.5" class="text-bold fill-N1 s2">3. φ(n) 과 서로소인 e 를 고른다</text></g><g ><g class="shape"><path d="M276 564h430v82H276z" class="stroke-B1 fill-B5 s0"/></g><text x="491" y="602.5" class="text-bold fill-N1 s2"><tspan x="491" dy="0">4. ed ≡ 1 (mod φ(n)) 인 d 를 분쇄기로 구한다</tspan><tspan x="491" dy="18.5">e 는 φ(n) 과 서로소이므로 역원이 반드시 있다</tspan></text></g><g ><g class="shape"><path d="M63 1012h330v66H63z" class="stroke-B1 fill-B5 s0"/></g><text x="228" y="1050.5" class="text-bold fill-N1 s2">보내는 사람: C = M 의 e 제곱 (mod n)</text></g><g ><g class="shape"><path d="M124 1199h310v66H124z" class="stroke-B1 fill-B5 s0"/></g><text x="279" y="1237.5" class="text-bold fill-N1 s2">받는 사람: M = C 의 d 제곱 (mod n)</text></g><marker id="mk-d2-2857051866-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2857051866-3488378134)" d="M491 134v94" class="connection stroke-B1 s0" mask="url(#d2-2857051866)"/><path fill="none" marker-end="url(#mk-d2-2857051866-3488378134)" d="M491 300v94" class="connection stroke-B1 s0" mask="url(#d2-2857051866)"/><path fill="none" marker-end="url(#mk-d2-2857051866-3488378134)" d="M491 466v94" class="connection stroke-B1 s0" mask="url(#d2-2857051866)"/><path fill="none" marker-end="url(#mk-d2-2857051866-3488378134)" d="M370.61 646.652C256.5 686 227.5 756 227.5 792" class="connection stroke-B1 s0" mask="url(#d2-2857051866)"/><path fill="none" marker-end="url(#mk-d2-2857051866-3488378134)" d="M590.346 646.77C684.5 686 708.5 706 708.5 721v287" class="connection stroke-B1 s0" mask="url(#d2-2857051866)"/><path fill="none" marker-end="url(#mk-d2-2857051866-3488378134)" d="M227.5 1079.5c0 46.8 6.6 71.2 31.097 116.482" class="connection stroke-B1 s0" mask="url(#d2-2857051866)"/><text x="232" y="1147" style="fill:#676c7e;text-anchor:middle;font-size:16px">둘 다 빠른 거듭제곱</text><path fill="none" marker-end="url(#mk-d2-2857051866-3488378134)" d="M227.5 864v144" class="connection stroke-B1 s0" mask="url(#d2-2857051866)"/><path fill="none" marker-end="url(#mk-d2-2857051866-3488378134)" d="M587.074 1078.039C414.6 1126.3 359 1150.7 313.805 1196.649" class="connection stroke-B1 s0" mask="url(#d2-2857051866)"/><path fill="none" marker-end="url(#mk-d2-2857051866-3488378134)" d="M278.5 1267v144" class="connection stroke-B1 s0" mask="url(#d2-2857051866)"/><path fill="none" marker-end="url(#mk-d2-2857051866-3488378134)" d="M278.5 1547v94" class="connection stroke-B1 s0" mask="url(#d2-2857051866)"/><mask id="d2-2857051866" width="1101" height="1920" x="-101" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-121h1101v1920H-101z"/><path d="M148 1131h168v21H148z"/></mask></svg>