<svg xmlns="http://www.w3.org/2000/svg" width="2153" height="1487" class="d2-1117863558 d2-svg" viewBox="-101 -101 2153 1487"><rect width="2153" height="1487" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1117863558 .fill-N1{fill:#0a0f25}.d2-1117863558 .fill-B6{fill:#f7f8fe}.d2-1117863558 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="410" cy="58.5" class="shape stroke-B1 fill-B6 s0" rx="175" ry="58.5"/></g><text x="410" y="56" class="text-bold fill-N1 s1"><tspan x="410" dy="0">‘⋯ 일 확률은 얼마인가’</tspan><tspan x="410" dy="18.5">말로 적힌 문제</tspan></text></g><g ><g class="shape"><path d="M152 217h516v98H152z" class="stroke-B1 fill-B6 s0"/></g><text x="410" y="255.5" class="text-bold fill-N1 s1"><tspan x="410" dy="0">1단계 앞의 준비 — 가정을 밝힌다</tspan><tspan x="410" dy="17.667">말로 적힌 문제에는 빈틈이 있다.</tspan><tspan x="410" dy="17.667">무엇이 균등한가, 누가 무엇을 알고 있는가를 못 박는다</tspan></text></g><g ><g class="shape"><path d="M200 415h420v114H200z" class="stroke-B1 fill-B6 s0"/></g><text x="410" y="453.5" class="text-bold fill-N1 s1"><tspan x="410" dy="0">1단계 표본공간을 찾는다</tspan><tspan x="410" dy="17.25">무작위로 정해지는 양을 순서대로 나열하고</tspan><tspan x="410" dy="17.25">나무를 그린다. 잎이 결과(outcome)이고</tspan><tspan x="410" dy="17.25">잎 전체가 표본공간 S 다</tspan></text></g><g ><g class="shape"><path d="M240 629h340v98H240z" class="stroke-B1 fill-B6 s0"/></g><text x="410" y="667.5" class="text-bold fill-N1 s1"><tspan x="410" dy="0">2단계 관심 있는 사건을 정한다</tspan><tspan x="410" dy="17.667">사건(event)은 결과의 집합이다.</tspan><tspan x="410" dy="17.667">조건을 만족하는 잎에 표시를 한다</tspan></text></g><g ><g class="shape"><path d="M195 827h429v98H195z" class="stroke-B1 fill-B6 s0"/></g><text x="409.5" y="865.5" class="text-bold fill-N1 s1"><tspan x="409.5" dy="0">3단계 결과의 확률을 매긴다</tspan><tspan x="409.5" dy="17.667">(a) 간선마다 확률을 적는다 — 갈림마다 합이 1</tspan><tspan x="409.5" dy="17.667">(b) 뿌리에서 잎까지의 간선 확률을 곱한다</tspan></text></g><g ><g class="shape"><path d="M0 1046h343v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="171.5" y="1084.5" class="text-bold fill-N1 s1"><tspan x="171.5" dy="0">4단계 사건의 확률을 더한다</tspan><tspan x="171.5" dy="18.5">사건에 든 잎의 확률을 모두 더한다</tspan></text></g><g ><g class="shape"><ellipse cx="410" cy="1256.5" class="shape stroke-B1 fill-B6 s0" rx="77" ry="28.5"/></g><text x="410" y="1262" class="text-bold fill-N1 s1">Pr[사건]</text></g><g ><g class="shape"><path d="M403 1046h490v82H403z" class="stroke-B1 fill-B6 s0"/></g><text x="648" y="1084.5" class="text-bold fill-N1 s1"><tspan x="648" dy="0">지름길 — 결과가 모두 같은 확률이면(균등 확률공간)</tspan><tspan x="648" dy="18.5">Pr[E] = |E| / |S| 이므로 17장의 셈의 규칙으로 끝난다</tspan></text></g><text x="1298" y="40" class="fill-N1 s1"><tspan x="1298" dy="0">두 가지 함정.</tspan><tspan x="1298" dy="17.25">① 잎의 개수만 세고 확률이 같은지 확인하지 않는 것 — 몬티 홀에서 잎 12 개 가운데 6 개가 ‘바꾸면 승’ 인데 답은 1/2 이 아니다.</tspan><tspan x="1298" dy="17.25">② 가정을 밝히지 않는 것 — 사회자가 반드시 염소 문을 연다는 가정을 빼면 바꾸는 것이 이롭지 않은 해석도 가능하다.</tspan><tspan x="1298" dy="17.25">간선 확률을 매길 때 물어야 할 말은 하나다 — ‘이 갈림의 부모에 도달했다고 할 때’ 이 가지로 갈 확률은 얼마인가. 20장에서 이것이 조건부확률임을 확인한다.</tspan></text><marker id="mk-d2-1117863558-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1117863558-3488378134)" d="M409.99 119c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-1117863558)"/><path fill="none" marker-end="url(#mk-d2-1117863558-3488378134)" d="M409.75 317v94" class="connection stroke-B1 s0" mask="url(#d2-1117863558)"/><path fill="none" marker-end="url(#mk-d2-1117863558-3488378134)" d="M409.75 531v94" class="connection stroke-B1 s0" mask="url(#d2-1117863558)"/><path fill="none" marker-end="url(#mk-d2-1117863558-3488378134)" d="M409.75 729v94" class="connection stroke-B1 s0" mask="url(#d2-1117863558)"/><path fill="none" marker-end="url(#mk-d2-1117863558-3488378134)" d="M301.684 925.339C197.9 973.3 171.5 997.7 171.5 1042.5" class="connection stroke-B1 s0" mask="url(#d2-1117863558)"/><path fill="none" marker-end="url(#mk-d2-1117863558-3488378134)" d="M171.5 1130c0 38 36.1 60 176.704 106.738" class="connection stroke-B1 s0" mask="url(#d2-1117863558)"/><path fill="none" marker-end="url(#mk-d2-1117863558-3488378134)" d="M517.816 925.339C621.6 973.3 648 997.7 648 1042.5" class="connection stroke-B1 s0" mask="url(#d2-1117863558)"/><text x="607.5" y="972" style="fill:#676c7e;text-anchor:middle;font-size:16px">확률이 모두 같은가</text><path fill="none" marker-end="url(#mk-d2-1117863558-3488378134)" d="M648 1130c0 38-36.2 59.8-177.197 105.76" class="connection stroke-B1 s0" mask="url(#d2-1117863558)"/><mask id="d2-1117863558" width="2153" height="1487" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2153v1487H-101z"/><path d="M525 956h165v21H525z"/></mask></svg>