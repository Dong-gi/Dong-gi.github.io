<svg xmlns="http://www.w3.org/2000/svg" width="1537" height="998" class="d2-3912372005 d2-svg" viewBox="-105 -101 1537 998"><rect width="1537" height="998" x="-105" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3912372005 .fill-N1{fill:#0a0f25}.d2-3912372005 .fill-B4{fill:#e3e9fd}.d2-3912372005 .fill-B5{fill:#edf0fd}.d2-3912372005 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="660" cy="34.5" class="shape stroke-B1" rx="104" ry="34.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="660" y="40" class="text-bold fill-N1 s0">점화식 하나</text></g><g ><g class="shape"><path d="M0 169h625v410H0z" class="stroke-B1 fill-B4 s1"/></g><text x="136.5" y="128" class="text-bold fill-N1 s2"><tspan x="136.5" dy="0">패턴을 찾는 두 길 —</tspan><tspan x="136.5" dy="32">방향이 반대다</tspan></text></g><g ><g class="shape"><path d="M685 177h646v394H685z" class="stroke-B1 fill-B4 s1"/></g><text x="1124" y="164" class="text-bold fill-N1 s2">통찰이 필요 없는 두 조리법</text></g><text x="313" y="695" class="fill-N1 s0"><tspan x="313" dy="0">상한만 증명하려는 함정</tspan><tspan x="313" dy="16.714">Tₙ = 2Tₙ₋₁ + 1 의 답은 2ⁿ − 1 인데</tspan><tspan x="313" dy="16.714">‘Tₙ ≤ 2ⁿ’ 을 귀납법으로 증명하려 하면 실패한다.</tspan><tspan x="313" dy="16.714">2(2ⁿ⁻¹) + 1 = 2ⁿ + 1 이 되어 2ⁿ 을 넘기 때문이다.</tspan><tspan x="313" dy="16.714">더 센 명제(등식)를 증명해야 통과한다 —</tspan><tspan x="313" dy="16.714">귀납법에서 가정이 셀수록 증명이 쉬워지는</tspan><tspan x="313" dy="16.714">그 현상이다(7장).</tspan></text><text x="1008.5" y="695" class="fill-N1 s0"><tspan x="1008.5" dy="0">어느 길을 고르나</tspan><tspan x="1008.5" dy="16.714">① 답이 단순할 것 같으면 추측·검증이 가장 빠르다.</tspan><tspan x="1008.5" dy="16.714">② 아니면 대입·정리로 모양을 먼저 본다.</tspan><tspan x="1008.5" dy="16.714">③ 정확한 닫힌 형태가 필요하면</tspan><tspan x="1008.5" dy="16.714">특성근이나 생성함수를 쓴다.</tspan><tspan x="1008.5" dy="16.714">④ 규모(Θ)만 필요하고 부분문제가 n/b 꼴이면</tspan><tspan x="1008.5" dy="16.714">마스터 정리로 한 줄에 끝난다.</tspan></text><g ><g class="shape"><path d="M30 219h283v130H30z" class="stroke-B1 fill-B5 s1"/></g><text x="171.5" y="265.5" class="text-bold fill-N1 s0"><tspan x="171.5" dy="0">추측하고 검증하기</tspan><tspan x="171.5" dy="17.25">앞에서부터 T₁, T₂, T₃, ⋯ 를</tspan><tspan x="171.5" dy="17.25">계산해 수의 패턴을 찾고</tspan><tspan x="171.5" dy="17.25">귀납법으로 증명한다</tspan></text></g><g ><g class="shape"><path d="M343 219h252v130H343z" class="stroke-B1 fill-B5 s1"/></g><text x="469" y="257.5" class="text-bold fill-N1 s0"><tspan x="469" dy="0">대입하고 정리하기</tspan><tspan x="469" dy="17">뒤에서부터 Tₙ 을</tspan><tspan x="469" dy="17">Tₙ₋₁, Tₙ₋₂, ⋯ 로 펼쳐</tspan><tspan x="469" dy="17">식의 패턴을 찾고</tspan><tspan x="469" dy="17">알려진 항에 닿는다</tspan></text></g><g ><g class="shape"><path d="M30 399h283v130H30z" class="stroke-B1 fill-B5 s1"/></g><text x="171.5" y="437.5" class="text-bold fill-N1 s0"><tspan x="171.5" dy="0">약점</tspan><tspan x="171.5" dy="17">답이 복잡하면 못 맞힌다.</tspan><tspan x="171.5" dy="17">병합정렬의 0, 1, 5, 17, 49 로는</tspan><tspan x="171.5" dy="17">n log n − n + 1 을</tspan><tspan x="171.5" dy="17">떠올릴 수 없다</tspan></text></g><g ><g class="shape"><path d="M343 399h252v130H343z" class="stroke-B1 fill-B5 s1"/></g><text x="469" y="437.5" class="text-bold fill-N1 s0"><tspan x="469" dy="0">약점</tspan><tspan x="469" dy="17">너무 많이 정리하면</tspan><tspan x="469" dy="17">패턴이 숨는다.</tspan><tspan x="469" dy="17">적당히만 정리하는 것이</tspan><tspan x="469" dy="17">요령이다</tspan></text></g><g ><g class="shape"><path d="M715 227h279v130H715z" class="stroke-B1 fill-B5 s1"/></g><text x="854.5" y="265.5" class="text-bold fill-N1 s0"><tspan x="854.5" dy="0">선형 점화식 — 특성근</tspan><tspan x="854.5" dy="17">f(n) = a₁f(n−1) + ⋯</tspan><tspan x="854.5" dy="17">+ a_d f(n−d) + g(n)</tspan><tspan x="854.5" dy="17">부분문제가 가산적으로</tspan><tspan x="854.5" dy="17">작아질 때</tspan></text></g><g ><g class="shape"><path d="M1024 227h277v130h-277z" class="stroke-B1 fill-B5 s1"/></g><text x="1162.5" y="265.5" class="text-bold fill-N1 s0"><tspan x="1162.5" dy="0">분할정복 점화식 —</tspan><tspan x="1162.5" dy="17">아크라·바지와 마스터 정리</tspan><tspan x="1162.5" dy="17">T(n) = Σ aᵢ T(bᵢ n) + g(n)</tspan><tspan x="1162.5" dy="17">부분문제가 배수적으로</tspan><tspan x="1162.5" dy="17">작아질 때</tspan></text></g><g ><g class="shape"><path d="M715 407h279v114H715z" class="stroke-B1 fill-B5 s1"/></g><text x="854.5" y="445.5" class="text-bold fill-N1 s0"><tspan x="854.5" dy="0">생성함수 (18장)</tspan><tspan x="854.5" dy="17.25">같은 선형 점화식을</tspan><tspan x="854.5" dy="17.25">F(x) = p(x)/q(x) 로 바꿔 푼다.</tspan><tspan x="854.5" dy="17.25">특성근 길과 같은 답을 준다</tspan></text></g><marker id="mk-d2-3912372005-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3912372005-3488378134)" d="M171.5 351v44" class="connection stroke-B1 s1" mask="url(#d2-3912372005)"/><path fill="none" marker-end="url(#mk-d2-3912372005-3488378134)" d="M469 351v44" class="connection stroke-B1 s1" mask="url(#d2-3912372005)"/><path fill="none" marker-end="url(#mk-d2-3912372005-3488378134)" d="M854.5 359v44" class="connection stroke-B1 s1" mask="url(#d2-3912372005)"/><text x="855" y="388" style="fill:#676c7e;text-anchor:middle;font-size:16px">같은 답을 주는 다른 길</text><path fill="none" marker-end="url(#mk-d2-3912372005-3488378134)" d="M601.22 63.91 301.56 217.18" class="connection stroke-B1 s1" mask="url(#d2-3912372005)"/><path fill="none" marker-end="url(#mk-d2-3912372005-3488378134)" d="M633.782 69.586 521.437 215.828" class="connection stroke-B1 s1" mask="url(#d2-3912372005)"/><path fill="none" marker-end="url(#mk-d2-3912372005-3488378134)" d="M687.205 69.596 803.59 223.807" class="connection stroke-B1 s1" mask="url(#d2-3912372005)"/><path fill="none" marker-end="url(#mk-d2-3912372005-3488378134)" d="m718.779 63.914 313.664 161.257" class="connection stroke-B1 s1" mask="url(#d2-3912372005)"/><path fill="none" marker-end="url(#mk-d2-3912372005-3488378134)" d="m205.918 530.277 75.246 145.67" class="connection stroke-B1 s1" mask="url(#d2-3912372005)"/><path fill="none" marker-end="url(#mk-d2-3912372005-3488378134)" d="M1139.845 358.39 1029.81 675.72" class="connection stroke-B1 s1" mask="url(#d2-3912372005)"/><mask id="d2-3912372005" width="1537" height="998" x="-105" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-105-101h1537v998H-105z"/><path d="M760 372h190v21H760z"/></mask></svg>