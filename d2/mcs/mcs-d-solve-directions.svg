<svg xmlns="http://www.w3.org/2000/svg" width="3261" height="1121" class="d2-2387005565 d2-svg" viewBox="-101 -85 3261 1121"><rect width="3261" height="1121" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2387005565 .fill-N1{fill:#0a0f25}.d2-2387005565 .fill-B4{fill:#e3e9fd}.d2-2387005565 .fill-B5{fill:#edf0fd}.d2-2387005565 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="104" cy="480.5" class="shape stroke-B1" rx="104" ry="34.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="104" y="486" class="text-bold fill-N1 s0">점화식 하나</text></g><g ><g class="shape"><path d="M547 56h1364v332H547z" class="stroke-B1 fill-B4 s1"/></g><text x="1229" y="43" class="text-bold fill-N1 s2">패턴을 찾는 두 길 — 방향이 반대다</text></g><g ><g class="shape"><path d="M517 619h1439v316H517z" class="stroke-B1 fill-B4 s1"/></g><text x="1236.5" y="606" class="text-bold fill-N1 s2">통찰이 필요 없는 두 조리법</text></g><text x="2708" y="125" class="fill-N1 s0"><tspan x="2708" dy="0">상한만 증명하려는 함정</tspan><tspan x="2708" dy="17.25">Tₙ = 2Tₙ₋₁ + 1 의 답은 2ⁿ − 1 인데 ‘Tₙ ≤ 2ⁿ’ 을 귀납법으로 증명하려 하면 실패한다.</tspan><tspan x="2708" dy="17.25">2(2ⁿ⁻¹) + 1 = 2ⁿ + 1 이 되어 2ⁿ 을 넘기 때문이다. 더 센 명제(등식)를 증명해야 통과한다 —</tspan><tspan x="2708" dy="17.25">귀납법에서 가정이 셀수록 증명이 쉬워지는 그 현상이다(7장).</tspan></text><text x="1708.5" y="454" class="fill-N1 s0"><tspan x="1708.5" dy="0">어느 길을 고르나</tspan><tspan x="1708.5" dy="17">① 답이 단순할 것 같으면 추측·검증이 가장 빠르다.</tspan><tspan x="1708.5" dy="17">② 아니면 대입·정리로 모양을 먼저 본다.</tspan><tspan x="1708.5" dy="17">③ 정확한 닫힌 형태가 필요하면 특성근이나 생성함수를 쓴다.</tspan><tspan x="1708.5" dy="17">④ 규모(Θ)만 필요하고 부분문제가 n/b 꼴이면 마스터 정리로 한 줄에 끝난다.</tspan></text><g ><g class="shape"><path d="M577 94h380v98H577z" class="stroke-B1 fill-B5 s1"/></g><text x="767" y="132.5" class="text-bold fill-N1 s0"><tspan x="767" dy="0">추측하고 검증하기</tspan><tspan x="767" dy="17.667">앞에서부터 T₁, T₂, T₃, ⋯ 를 계산해</tspan><tspan x="767" dy="17.667">수의 패턴을 찾고 귀납법으로 증명한다</tspan></text></g><g ><g class="shape"><path d="M581 260h373v98H581z" class="stroke-B1 fill-B5 s1"/></g><text x="767.5" y="298.5" class="text-bold fill-N1 s0"><tspan x="767.5" dy="0">대입하고 정리하기</tspan><tspan x="767.5" dy="17.667">뒤에서부터 Tₙ 을 Tₙ₋₁, Tₙ₋₂, ⋯ 로 펼쳐</tspan><tspan x="767.5" dy="17.667">식의 패턴을 찾고 알려진 항에 닿는다</tspan></text></g><g ><g class="shape"><path d="M1561 86h295v114h-295z" class="stroke-B1 fill-B5 s1"/></g><text x="1708.5" y="124.5" class="text-bold fill-N1 s0"><tspan x="1708.5" dy="0">약점</tspan><tspan x="1708.5" dy="17.25">답이 복잡하면 못 맞힌다.</tspan><tspan x="1708.5" dy="17.25">병합정렬의 0, 1, 5, 17, 49 로는</tspan><tspan x="1708.5" dy="17.25">n log n − n + 1 을 떠올릴 수 없다</tspan></text></g><g ><g class="shape"><path d="M1536 260h345v98h-345z" class="stroke-B1 fill-B5 s1"/></g><text x="1708.5" y="298.5" class="text-bold fill-N1 s0"><tspan x="1708.5" dy="0">약점</tspan><tspan x="1708.5" dy="17.667">너무 많이 정리하면 패턴이 숨는다.</tspan><tspan x="1708.5" dy="17.667">적당히만 정리하는 것이 요령이다</tspan></text></g><g ><g class="shape"><path d="M599 807h336v98H599z" class="stroke-B1 fill-B5 s1"/></g><text x="767" y="845.5" class="text-bold fill-N1 s0"><tspan x="767" dy="0">선형 점화식 — 특성근</tspan><tspan x="767" dy="17.667">f(n) = a₁f(n−1) + ⋯ + a_d f(n−d) + g(n)</tspan><tspan x="767" dy="17.667">부분문제가 가산적으로 작아질 때</tspan></text></g><g ><g class="shape"><path d="M547 649h440v98H547z" class="stroke-B1 fill-B5 s1"/></g><text x="767" y="687.5" class="text-bold fill-N1 s0"><tspan x="767" dy="0">분할정복 점화식 — 아크라·바지와 마스터 정리</tspan><tspan x="767" dy="17.667">T(n) = Σ aᵢ T(bᵢ n) + g(n)</tspan><tspan x="767" dy="17.667">부분문제가 배수적으로 작아질 때</tspan></text></g><g ><g class="shape"><path d="M1491 807h435v98h-435z" class="stroke-B1 fill-B5 s1"/></g><text x="1708.5" y="845.5" class="text-bold fill-N1 s0"><tspan x="1708.5" dy="0">생성함수 (18장)</tspan><tspan x="1708.5" dy="17.667">같은 선형 점화식을 F(x) = p(x)/q(x) 로 바꿔 푼다.</tspan><tspan x="1708.5" dy="17.667">특성근 길과 같은 답을 준다</tspan></text></g><marker id="mk-d2-2387005565-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2387005565-3488378134)" d="M959 143h598" class="connection stroke-B1 s1" mask="url(#d2-2387005565)"/><path fill="none" marker-end="url(#mk-d2-2387005565-3488378134)" d="M956 309h576" class="connection stroke-B1 s1" mask="url(#d2-2387005565)"/><path fill="none" marker-end="url(#mk-d2-2387005565-3488378134)" d="M937 856h550" class="connection stroke-B1 s1" mask="url(#d2-2387005565)"/><text x="1213" y="862" style="fill:#676c7e;text-anchor:middle;font-size:16px">같은 답을 주는 다른 길</text><path fill="none" marker-end="url(#mk-d2-2387005565-3488378134)" d="M127.08 445.317C282 203.799 462.6 143 573 143" class="connection stroke-B1 s1" mask="url(#d2-2387005565)"/><path fill="none" marker-end="url(#mk-d2-2387005565-3488378134)" d="M146.565 447.755C285.8 337 463.3 309 576.5 309" class="connection stroke-B1 s1" mask="url(#d2-2387005565)"/><path fill="none" marker-end="url(#mk-d2-2387005565-3488378134)" d="M127.987 515.74C282.2 787.6 467 856 595 856" class="connection stroke-B1 s1" mask="url(#d2-2387005565)"/><path fill="none" marker-end="url(#mk-d2-2387005565-3488378134)" d="M146.375 513.453C285.8 660.8 456.6 698 543 698" class="connection stroke-B1 s1" mask="url(#d2-2387005565)"/><path fill="none" marker-end="url(#mk-d2-2387005565-3488378134)" d="M1858 143h495" class="connection stroke-B1 s1" mask="url(#d2-2387005565)"/><path fill="none" marker-end="url(#mk-d2-2387005565-3488378134)" d="M989 698c162.8 0 281.6-35 588.354-173.355" class="connection stroke-B1 s1" mask="url(#d2-2387005565)"/><mask id="d2-2387005565" width="3261" height="1121" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h3261v1121H-101z"/><path d="M1118 846h190v21h-190z"/></mask></svg>