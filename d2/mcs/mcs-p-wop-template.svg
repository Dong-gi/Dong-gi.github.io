<svg xmlns="http://www.w3.org/2000/svg" width="664" height="1343" class="d2-3003426542 d2-svg" viewBox="-127 -101 664 1343"><rect width="664" height="1343" x="-127" y="-101" rx="0" style="fill:#fff"/><style>.d2-3003426542 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3003426542 .fill-N1{fill:#0a0f25}.d2-3003426542 .fill-B6{fill:#f7f8fe}.d2-3003426542 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="204.5" cy="63" class="shape stroke-B1 fill-B6 s0" rx="189.5" ry="63"/></g><text x="204.5" y="60.5" class="text-bold fill-N1 s1"><tspan x="204.5" dy="0">모든 n ∈ ℕ 에 대해</tspan><tspan x="204.5" dy="18.5">P(n) 이 참임을 보이려 한다</tspan></text></g><g ><g class="shape"><path d="M82 226h246v82H82z" class="stroke-B1 fill-B6 s0"/></g><text x="205" y="264.5" class="text-bold fill-N1 s1"><tspan x="205" dy="0">① 반례 집합을 정의한다</tspan><tspan x="205" dy="18.5">C ::= { n ∈ ℕ | ¬P(n) }</tspan></text></g><g ><g class="shape"><path d="M40 408h330v82H40z" class="stroke-B1 fill-B6 s0"/></g><text x="205" y="446.5" class="text-bold fill-N1 s1"><tspan x="205" dy="0">② 모순을 노리고</tspan><tspan x="205" dy="18.5">C 가 공집합이 아니라고 가정한다</tspan></text></g><g ><g class="shape"><path d="M37 590h336v98H37z" class="stroke-B1 fill-B6 s0"/></g><text x="205" y="628.5" class="text-bold fill-N1 s1"><tspan x="205" dy="0">③ WOP 로 C 의 최소 원소 c 를 잡는다</tspan><tspan x="205" dy="17.667">이때 c 보다 작은 n 에서는</tspan><tspan x="205" dy="17.667">P(n) 이 참이라는 정보를 얻는다</tspan></text></g><g ><g class="shape"><path d="M0 788h409v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="204.5" y="826.5" class="text-bold fill-N1 s1"><tspan x="204.5" dy="0">④ 모순을 만든다 — 여기만 문제마다 다르다</tspan><tspan x="204.5" dy="17.667">· P(c) 가 실제로 참임을 보이거나</tspan><tspan x="204.5" dy="17.667">· c 보다 작은 C 의 원소를 만들어 내거나</tspan></text></g><g ><g class="shape"><path d="M19 986h371v66H19z" class="stroke-B1 fill-B6 s0"/></g><text x="204.5" y="1024.5" class="text-bold fill-N1 s1">⑤ 따라서 C 는 공집합이고, 반례는 없다</text></g><text x="205" y="1088" class="fill-N1 s1"><tspan x="205" dy="0">③ 에서 c &gt; 0 을 확보해야 c − 1 이나 c − 3 을 쓸 수 있다.</tspan><tspan x="205" dy="17.25">그래서 작은 값 몇 개(P(0), P(1) …)를 미리 확인해 두는 일이</tspan><tspan x="205" dy="17.25">증명의 일부다.</tspan><tspan x="205" dy="17.25">이 확인을 빼면 ④ 에서 정의역 밖으로 나간다</tspan></text><marker id="mk-d2-3003426542-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3003426542-3488378134)" d="M204.98 128c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-3003426542)"/><path fill="none" marker-end="url(#mk-d2-3003426542-3488378134)" d="M204.5 310v94" class="connection stroke-B1 s0" mask="url(#d2-3003426542)"/><path fill="none" marker-end="url(#mk-d2-3003426542-3488378134)" d="M204.5 492v94" class="connection stroke-B1 s0" mask="url(#d2-3003426542)"/><path fill="none" marker-end="url(#mk-d2-3003426542-3488378134)" d="M204.5 690v94" class="connection stroke-B1 s0" mask="url(#d2-3003426542)"/><path fill="none" marker-end="url(#mk-d2-3003426542-3488378134)" d="M204.5 888v94" class="connection stroke-B1 s0" mask="url(#d2-3003426542)"/><mask id="d2-3003426542" width="664" height="1343" x="-127" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-127-101h664v1343h-664z"/></mask></svg>