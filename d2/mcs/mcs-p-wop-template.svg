<svg xmlns="http://www.w3.org/2000/svg" width="1446" height="1294" class="d2-1128736713 d2-svg" viewBox="-101 -101 1446 1294"><rect width="1446" height="1294" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1128736713 .fill-N1{fill:#0a0f25}.d2-1128736713 .fill-B6{fill:#f7f8fe}.d2-1128736713 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="297" cy="99" class="shape stroke-B1 fill-B6 s0" rx="297" ry="99"/></g><text x="297" y="104.5" class="text-bold fill-N1 s1">모든 n ∈ ℕ 에 대해 P(n) 이 참임을 보이려 한다</text></g><g ><g class="shape"><path d="M174 298h246v82H174z" class="stroke-B1 fill-B6 s0"/></g><text x="297" y="336.5" class="text-bold fill-N1 s1"><tspan x="297" dy="0">① 반례 집합을 정의한다</tspan><tspan x="297" dy="18.5">C ::= { n ∈ ℕ | ¬P(n) }</tspan></text></g><g ><g class="shape"><path d="M62 480h471v66H62z" class="stroke-B1 fill-B6 s0"/></g><text x="297.5" y="518.5" class="text-bold fill-N1 s1">② 모순을 노리고 C 가 공집합이 아니라고 가정한다</text></g><g ><g class="shape"><path d="M34 646h526v82H34z" class="stroke-B1 fill-B6 s0"/></g><text x="297" y="684.5" class="text-bold fill-N1 s1"><tspan x="297" dy="0">③ WOP 로 C 의 최소 원소 c 를 잡는다</tspan><tspan x="297" dy="18.5">이때 c 보다 작은 n 에서는 P(n) 이 참이라는 정보를 얻는다</tspan></text></g><g ><g class="shape"><path d="M93 828h409v98H93z" class="stroke-B1 fill-B6 s0"/></g><text x="297.5" y="866.5" class="text-bold fill-N1 s1"><tspan x="297.5" dy="0">④ 모순을 만든다 — 여기만 문제마다 다르다</tspan><tspan x="297.5" dy="17.667">· P(c) 가 실제로 참임을 보이거나</tspan><tspan x="297.5" dy="17.667">· c 보다 작은 C 의 원소를 만들어 내거나</tspan></text></g><g ><g class="shape"><path d="M112 1026h371v66H112z" class="stroke-B1 fill-B6 s0"/></g><text x="297.5" y="1064.5" class="text-bold fill-N1 s1">⑤ 따라서 C 는 공집합이고, 반례는 없다</text></g><text x="949" y="89" class="fill-N1 s1"><tspan x="949" dy="0">③ 에서 c &gt; 0 을 확보해야 c − 1 이나 c − 3 을 쓸 수 있다.</tspan><tspan x="949" dy="17.667">그래서 작은 값 몇 개(P(0), P(1) …)를 미리 확인해 두는 일이 증명의 일부다.</tspan><tspan x="949" dy="17.667">이 확인을 빼면 ④ 에서 정의역 밖으로 나간다</tspan></text><marker id="mk-d2-1128736713-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1128736713-3488378134)" d="M297 200v94" class="connection stroke-B1 s0" mask="url(#d2-1128736713)"/><path fill="none" marker-end="url(#mk-d2-1128736713-3488378134)" d="M297 382v94" class="connection stroke-B1 s0" mask="url(#d2-1128736713)"/><path fill="none" marker-end="url(#mk-d2-1128736713-3488378134)" d="M297 548v94" class="connection stroke-B1 s0" mask="url(#d2-1128736713)"/><path fill="none" marker-end="url(#mk-d2-1128736713-3488378134)" d="M297 730v94" class="connection stroke-B1 s0" mask="url(#d2-1128736713)"/><path fill="none" marker-end="url(#mk-d2-1128736713-3488378134)" d="M297 928v94" class="connection stroke-B1 s0" mask="url(#d2-1128736713)"/><mask id="d2-1128736713" width="1446" height="1294" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1446v1294H-101z"/></mask></svg>