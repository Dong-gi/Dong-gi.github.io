<svg xmlns="http://www.w3.org/2000/svg" width="4449" height="620" class="d2-2604054725 d2-svg" viewBox="-101 -101 4449 620"><rect width="4449" height="620" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2604054725 .fill-N1{fill:#0a0f25}.d2-2604054725 .fill-N2{fill:#676c7e}.d2-2604054725 .fill-B6{fill:#f7f8fe}.d2-2604054725 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M2054 94h316v98h-316z" class="stroke-B1 fill-B6 s0"/></g><text x="2212" y="132.5" class="text-bold fill-N1 s1"><tspan x="2212" dy="0">SAT</tspan><tspan x="2212" dy="17.667">주어진 논리식을 참으로 만드는</tspan><tspan x="2212" dy="17.667">변수 배정이 있는가</tspan></text></g><g ><g class="shape"><path d="M1237 102h235v82h-235z" class="stroke-B1 fill-B6 s0"/></g><text x="1354.5" y="140.5" class="text-bold fill-N1 s1"><tspan x="1354.5" dy="0">타당성 판정</tspan><tspan x="1354.5" dy="18.5">이 식이 언제나 참인가</tspan></text></g><g ><g class="shape"><path d="M206 0h255v82H206z" class="stroke-B1 fill-B6 s0"/></g><text x="333.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="333.5" dy="0">동치 판정</tspan><tspan x="333.5" dy="18.5">두 식의 진리표가 같은가</tspan></text></g><g ><g class="shape"><path d="M210 142h247v82H210z" class="stroke-B1 fill-B6 s0"/></g><text x="333.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="333.5" dy="0">식 간단히 하기</tspan><tspan x="333.5" dy="18.5">이 식이 T 로 줄어드는가</tspan></text></g><g ><g class="shape"><path d="M2976 0h311v82h-311z" class="stroke-B1 fill-B6 s0"/></g><text x="3131.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="3131.5" dy="0">회로 SAT</tspan><tspan x="3131.5" dy="18.5">출력이 1 이 되는 입력이 있는가</tspan></text></g><g ><g class="shape"><path d="M2994 142h276v98h-276z" class="stroke-B1 fill-B6 s0"/></g><text x="3132" y="180.5" class="text-bold fill-N1 s1"><tspan x="3132" dy="0">진리표로 푸는 방법</tspan><tspan x="3132" dy="17.667">변수 n 개면 2ⁿ 줄</tspan><tspan x="3132" dy="17.667">n = 30 이면 10억 줄이 넘는다</tspan></text></g><g ><g class="shape"><path d="M3873 150h374v82h-374z" class="stroke-B1 fill-B6 s0"/></g><text x="4060" y="188.5" class="text-bold fill-N1 s1"><tspan x="4060" dy="0">다항 시간에 푸는 방법이 있는가</tspan><tspan x="4060" dy="18.5">— 아무도 모른다. 이것이 P 대 NP 문제다</tspan></text></g><text x="333.5" y="300" class="fill-N1 s1"><tspan x="333.5" dy="0">실전에서는 SAT 해결기(SAT solver)가 변수 수백만 개짜리 식도 곧잘 푼다.</tspan><tspan x="333.5" dy="18.5">다만 어떤 식이 잘 풀릴지 예측하기 어렵고, 만족 불가능한 식에서는 훨씬 약하다</tspan></text><text x="334" y="397" class="fill-N1 s1"><tspan x="334" dy="0">SAT 를 빠르게 푸는 방법이 나오면 일정 계획·자원 배분·회로 검증이 함께 풀린다.</tspan><tspan x="334" dy="18.5">동시에 오늘날의 암호가 무너져 온라인 거래와 비밀 통신이 성립하지 않게 된다</tspan></text><marker id="mk-d2-2604054725-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2604054725-3488378134)" d="M1474 142.5h576" class="connection stroke-B1 s0" mask="url(#d2-2604054725)"/><text x="1763.5" y="148" class="text-italic fill-N2 s1">¬F 가 만족가능한지 물으면 된다</text><path fill="none" marker-end="url(#mk-d2-2604054725-3488378134)" d="M463 41c390.8 0 546 14.4 770.122 71.02" class="connection stroke-B1 s0" mask="url(#d2-2604054725)"/><text x="852.5" y="47" class="text-italic fill-N2 s1">(F ↔ G) 가 타당한지 물으면 된다</text><path fill="none" marker-end="url(#mk-d2-2604054725-3488378134)" d="M459 183c394 0 550-5.8 774.02-28.595" class="connection stroke-B1 s0" mask="url(#d2-2604054725)"/><path fill="none" marker-end="url(#mk-d2-2604054725-3488378134)" d="M2974.03 68.345c-240.43 42.055-361.63 55.455-600.034 66.47" class="connection stroke-B1 s0" mask="url(#d2-2604054725)"/><text x="2674.5" y="122" class="text-italic fill-N2 s1">배선마다 변수, 게이트마다 제약식</text><path fill="none" marker-end="url(#mk-d2-2604054725-3488378134)" d="M2371.953 107.568C2612.4 54.4 2733.6 41 2972 41" class="connection stroke-B1 s0" mask="url(#d2-2604054725)"/><text x="2670" y="54" class="text-italic fill-N2 s1">연산마다 게이트 하나</text><path fill="none" marker-end="url(#mk-d2-2604054725-3488378134)" d="M2371.989 159.21C2612.399 184.6 2737.1 191 2989.5 191" class="connection stroke-B1 s0" mask="url(#d2-2604054725)"/><text x="2681.5" y="194" class="text-italic fill-N2 s1">가장 단순한 방법</text><path fill="none" marker-end="url(#mk-d2-2604054725-3488378134)" d="M3272.5 191H3869" class="connection stroke-B1 s0" mask="url(#d2-2604054725)"/><text x="3571.5" y="197" class="text-italic fill-N2 s1">지수를 다항으로 줄일 수 있을까</text><mask id="d2-2604054725" width="4449" height="620" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h4449v620H-101z"/><path d="M1632 132h263v21h-263zM727 31h251v21H727zM2531 106h287v21h-287zM2578 38h184v21h-184zM2609 178h145v21h-145zM3438 181h267v21h-267z"/></mask></svg>