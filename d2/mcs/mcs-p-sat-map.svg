<svg xmlns="http://www.w3.org/2000/svg" width="1011" height="1294" class="d2-2191359355 d2-svg" viewBox="-54 -101 1011 1294"><rect width="1011" height="1294" x="-54" y="-101" rx="0" style="fill:#fff"/><style>.d2-2191359355 .text-bold{font-weight:700}.d2-2191359355 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2191359355 .fill-N1{fill:#0a0f25}.d2-2191359355 .fill-N2{fill:#676c7e}.d2-2191359355 .fill-B6{fill:#f7f8fe}.d2-2191359355 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M214 406h316v98H214z" class="stroke-B1 fill-B6 s0"/></g><text x="372" y="444.5" class="text-bold fill-N1 s1"><tspan x="372" dy="0">SAT</tspan><tspan x="372" dy="17.667">주어진 논리식을 참으로 만드는</tspan><tspan x="372" dy="17.667">변수 배정이 있는가</tspan></text></g><g ><g class="shape"><path d="M254 203h235v82H254z" class="stroke-B1 fill-B6 s0"/></g><text x="371.5" y="241.5" class="text-bold fill-N1 s1"><tspan x="371.5" dy="0">타당성 판정</tspan><tspan x="371.5" dy="18.5">이 식이 언제나 참인가</tspan></text></g><g ><g class="shape"><path d="M130 0h255v82H130z" class="stroke-B1 fill-B6 s0"/></g><text x="257.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="257.5" dy="0">동치 판정</tspan><tspan x="257.5" dy="18.5">두 식의 진리표가 같은가</tspan></text></g><g ><g class="shape"><path d="M445 0h247v82H445z" class="stroke-B1 fill-B6 s0"/></g><text x="568.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="568.5" dy="0">식 간단히 하기</tspan><tspan x="568.5" dy="18.5">이 식이 T 로 줄어드는가</tspan></text></g><g ><g class="shape"><path d="M80 633h311v82H80z" class="stroke-B1 fill-B6 s0"/></g><text x="235.5" y="671.5" class="text-bold fill-N1 s1"><tspan x="235.5" dy="0">회로 SAT</tspan><tspan x="235.5" dy="18.5">출력이 1 이 되는 입력이 있는가</tspan></text></g><g ><g class="shape"><path d="M531 625h276v98H531z" class="stroke-B1 fill-B6 s0"/></g><text x="669" y="663.5" class="text-bold fill-N1 s1"><tspan x="669" dy="0">진리표로 푸는 방법</tspan><tspan x="669" dy="17.667">변수 n 개면 2ⁿ 줄</tspan><tspan x="669" dy="17.667">n = 30 이면 10억 줄이 넘는다</tspan></text></g><g ><g class="shape"><path d="M482 844h374v82H482z" class="stroke-B1 fill-B6 s0"/></g><text x="669" y="882.5" class="text-bold fill-N1 s1"><tspan x="669" dy="0">다항 시간에 푸는 방법이 있는가</tspan><tspan x="669" dy="18.5">— 아무도 모른다. 이것이 P 대 NP 문제다</tspan></text></g><path fill="transparent" stroke="transparent" d="M110 946h715v146H110z" class="shape s0"/><text x="467.5" y="986" class="fill-N1 s1"><tspan x="467.5" dy="0">실전에서는 SAT 해결기(SAT solver)가 변수 수백만 개짜리 식도 곧잘 푼다.</tspan><tspan x="467.5" dy="18.5">다만 어떤 식이 잘 풀릴지 예측하기 어렵고, 만족 불가능한 식에서는 훨씬 약하다</tspan></text><text x="465" y="1047" class="fill-N1 s1"><tspan x="465" dy="0">SAT 를 빠르게 푸는 방법이 나오면 일정 계획·자원 배분·회로 검증이 함께 풀린다.</tspan><tspan x="465" dy="18.5">동시에 오늘날의 암호가 무너져 온라인 거래와 비밀 통신이 성립하지 않게 된다</tspan></text><marker id="mk-d2-2191359355-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2191359355-3488378134)" d="M371.5 286.5v116" class="connection stroke-B1 s0" mask="url(#d2-2191359355)"/><text x="371.5" y="351" class="text-italic fill-N2 s1">¬F 가 만족가능한지 물으면 된다</text><path fill="none" marker-end="url(#mk-d2-2191359355-3488378134)" d="M257 83.5c0 46.8 13.4 71.2 64.042 117.307" class="connection stroke-B1 s0" mask="url(#d2-2191359355)"/><text x="269.5" y="158" class="text-italic fill-N2 s1">(F ↔ G) 가 타당한지 물으면 된다</text><path fill="none" marker-end="url(#mk-d2-2191359355-3488378134)" d="M568 83.5c0 46.8-23.2 71.2-112.46 118.138" class="connection stroke-B1 s0" mask="url(#d2-2191359355)"/><path fill="none" marker-end="url(#mk-d2-2191359355-3488378134)" d="M288.053 632.24C354.5 578.3 371.5 552.3 371.5 507.5" class="connection stroke-B1 s0" mask="url(#d2-2191359355)"/><text x="351.5" y="586" class="text-italic fill-N2 s1">배선마다 변수, 게이트마다 제약식</text><path fill="none" marker-end="url(#mk-d2-2191359355-3488378134)" d="M248.147 504.253C130 552.3 116.8 578.3 180.91 630.961" class="connection stroke-B1 s0" mask="url(#d2-2191359355)"/><text x="136" y="555" class="text-italic fill-N2 s1">연산마다 게이트 하나</text><path fill="none" marker-end="url(#mk-d2-2191359355-3488378134)" d="M506.126 504.194C636.25 552.3 669.25 576.7 669.25 621.5" class="connection stroke-B1 s0" mask="url(#d2-2191359355)"/><text x="612.5" y="549" class="text-italic fill-N2 s1">가장 단순한 방법</text><path fill="none" marker-end="url(#mk-d2-2191359355-3488378134)" d="M669.25 724.5v116" class="connection stroke-B1 s0" mask="url(#d2-2191359355)"/><text x="669.5" y="789" class="text-italic fill-N2 s1">지수를 다항으로 줄일 수 있을까</text><mask id="d2-2191359355" width="1011" height="1294" x="-54" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-54-101H957v1294H-54z"/><path d="M240 335h263v21H240zM144 142h251v21H144zM208 570h287v21H208zM44 539h184v21H44zM540 533h145v21H540zM536 773h267v21H536z"/></mask></svg>