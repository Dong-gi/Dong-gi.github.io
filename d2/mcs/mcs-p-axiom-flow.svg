<svg xmlns="http://www.w3.org/2000/svg" width="898" height="1348" class="d2-3371105471 d2-svg" viewBox="-126 -101 898 1348"><rect width="898" height="1348" x="-126" y="-101" rx="0" style="fill:#fff"/><style>.d2-3371105471 .text-bold{font-weight:700}.d2-3371105471 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3371105471 .fill-N1{fill:#0a0f25}.d2-3371105471 .fill-N2{fill:#676c7e}.d2-3371105471 .fill-B6{fill:#f7f8fe}.d2-3371105471 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h575v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="287.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="287.5" dy="0">공리(axiom)</tspan><tspan x="287.5" dy="17.667">증명하지 않고 참으로 받아들이는 명제</tspan><tspan x="287.5" dy="17.667">이 문서는 고등학교 수학의 익숙한 사실 전부를 공리로 삼는다</tspan></text></g><g ><g class="shape"><path d="M106 219h363v98H106z" class="stroke-B1 fill-B6 s0"/></g><text x="287.5" y="257.5" class="text-bold fill-N1 s1"><tspan x="287.5" dy="0">추론 규칙(inference rule)</tspan><tspan x="287.5" dy="17.667">참인 것에서 참인 것을 뽑아내는 절차</tspan><tspan x="287.5" dy="17.667">P 와 (P → Q) 가 참이면 Q 도 참</tspan></text></g><g ><g class="shape"><path d="M160 620h255v82H160z" class="stroke-B1 fill-B6 s0"/></g><text x="287.5" y="658.5" class="text-bold fill-N1 s1"><tspan x="287.5" dy="0">정리(theorem)</tspan><tspan x="287.5" dy="18.5">증명을 붙인 중요한 명제</tspan></text></g><g ><g class="shape"><path d="M95 417h386v82H95z" class="stroke-B1 fill-B6 s0"/></g><text x="288" y="455.5" class="text-bold fill-N1 s1"><tspan x="288" dy="0">보조정리(lemma)</tspan><tspan x="288" dy="18.5">뒤의 증명에 쓰려고 미리 세워 두는 명제</tspan></text></g><g ><g class="shape"><path d="M118 802h340v82H118z" class="stroke-B1 fill-B6 s0"/></g><text x="288" y="840.5" class="text-bold fill-N1 s1"><tspan x="288" dy="0">계(corollary)</tspan><tspan x="288" dy="18.5">정리에서 몇 걸음이면 나오는 명제</tspan></text></g><path fill="transparent" stroke="transparent" d="M-25 904h652v242H-25z" class="shape s0"/><text x="239" y="960" class="fill-N1 s1"><tspan x="239" dy="0">추론 규칙은 건전(sound)해야 한다.</tspan><tspan x="239" dy="17.25">위쪽 명제들을 참으로 만드는 어떤 배정도</tspan><tspan x="239" dy="17.25">아래쪽 명제를 참으로 만들어야 한다는 뜻이다.</tspan><tspan x="239" dy="17.25">건전하지 않은 규칙을 하나만 섞으면 거짓도 증명된다</tspan></text><text x="300" y="1069" class="fill-N1 s1"><tspan x="300" dy="0">ZFC 공리 아홉 개에서 출발하면 2 + 2 = 4 조차</tspan><tspan x="300" dy="17.667">2만 단계가 넘는다. 그래서 실용적으로는 익숙한 사실을 공리로 삼고,</tspan><tspan x="300" dy="17.667">무엇을 가정했는지 그때그때 밝히는 쪽을 택한다</tspan></text><marker id="mk-d2-3371105471-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3371105471-3488378134)" d="M287.5 99.5v116" class="connection stroke-B1 s0" mask="url(#d2-3371105471)"/><text x="287.5" y="164" class="text-italic fill-N2 s1">재료를 넣는다</text><path fill="none" marker-end="url(#mk-d2-3371105471-3488378134)" d="M287.5 319v94" class="connection stroke-B1 s0" mask="url(#d2-3371105471)"/><path fill="none" marker-end="url(#mk-d2-3371105471-3488378134)" d="M170.658 317.78C78.1 357 54.5 385.2 54.5 412.5s27.6 159.2 134.341 206.383" class="connection stroke-B1 s0" mask="url(#d2-3371105471)"/><path fill="none" marker-end="url(#mk-d2-3371105471-3488378134)" d="M287.5 500.5v116" class="connection stroke-B1 s0" mask="url(#d2-3371105471)"/><text x="288" y="565" class="text-italic fill-N2 s1">부품으로 쓰인다</text><path fill="none" marker-end="url(#mk-d2-3371105471-3488378134)" d="M287.5 704v94" class="connection stroke-B1 s0" mask="url(#d2-3371105471)"/><path fill="none" marker-end="url(#mk-d2-3371105471-3488378134)" d="M415.901 619.88C563.6 571.7 601 539.2 601 508.75S569.4 357 446.814 318.207" class="connection stroke-B1 s0" mask="url(#d2-3371105471)"/><text x="601.5" y="489" class="text-italic fill-N2 s1">다시 재료가 된다</text><mask id="d2-3371105471" width="898" height="1348" x="-126" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-126-101h898v1348h-898z"/><path d="M226 148h123v21H226zM217 549h142v21H217zM529 473h145v21H529z"/></mask></svg>