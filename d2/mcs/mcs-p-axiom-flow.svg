<svg xmlns="http://www.w3.org/2000/svg" width="3102" height="542" class="d2-2350649816 d2-svg" viewBox="-101 -101 3102 542"><rect width="3102" height="542" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2350649816 .fill-N1{fill:#0a0f25}.d2-2350649816 .fill-N2{fill:#676c7e}.d2-2350649816 .fill-B6{fill:#f7f8fe}.d2-2350649816 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h575v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="287.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="287.5" dy="0">공리(axiom)</tspan><tspan x="287.5" dy="17.667">증명하지 않고 참으로 받아들이는 명제</tspan><tspan x="287.5" dy="17.667">이 문서는 고등학교 수학의 익숙한 사실 전부를 공리로 삼는다</tspan></text></g><g ><g class="shape"><path d="M875 0h363v98H875z" class="stroke-B1 fill-B6 s0"/></g><text x="1056.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1056.5" dy="0">추론 규칙(inference rule)</tspan><tspan x="1056.5" dy="17.667">참인 것에서 참인 것을 뽑아내는 절차</tspan><tspan x="1056.5" dy="17.667">P 와 (P → Q) 가 참이면 Q 도 참</tspan></text></g><g ><g class="shape"><path d="M2124 49h255v82h-255z" class="stroke-B1 fill-B6 s0"/></g><text x="2251.5" y="87.5" class="text-bold fill-N1 s1"><tspan x="2251.5" dy="0">정리(theorem)</tspan><tspan x="2251.5" dy="18.5">증명을 붙인 중요한 명제</tspan></text></g><g ><g class="shape"><path d="M1419 49h386v82h-386z" class="stroke-B1 fill-B6 s0"/></g><text x="1612" y="87.5" class="text-bold fill-N1 s1"><tspan x="1612" dy="0">보조정리(lemma)</tspan><tspan x="1612" dy="18.5">뒤의 증명에 쓰려고 미리 세워 두는 명제</tspan></text></g><g ><g class="shape"><path d="M2560 49h340v82h-340z" class="stroke-B1 fill-B6 s0"/></g><text x="2730" y="87.5" class="text-bold fill-N1 s1"><tspan x="2730" dy="0">계(corollary)</tspan><tspan x="2730" dy="18.5">정리에서 몇 걸음이면 나오는 명제</tspan></text></g><text x="288" y="174" class="fill-N1 s1"><tspan x="288" dy="0">추론 규칙은 건전(sound)해야 한다.</tspan><tspan x="288" dy="17.25">위쪽 명제들을 참으로 만드는 어떤 배정도</tspan><tspan x="288" dy="17.25">아래쪽 명제를 참으로 만들어야 한다는 뜻이다.</tspan><tspan x="288" dy="17.25">건전하지 않은 규칙을 하나만 섞으면 거짓도 증명된다</tspan></text><text x="288" y="303" class="fill-N1 s1"><tspan x="288" dy="0">ZFC 공리 아홉 개에서 출발하면 2 + 2 = 4 조차</tspan><tspan x="288" dy="17.667">2만 단계가 넘는다. 그래서 실용적으로는 익숙한 사실을 공리로 삼고,</tspan><tspan x="288" dy="17.667">무엇을 가정했는지 그때그때 밝히는 쪽을 택한다</tspan></text><marker id="mk-d2-2350649816-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2350649816-3488378134)" d="M577 49h294" class="connection stroke-B1 s0" mask="url(#d2-2350649816)"/><text x="725.5" y="55" class="text-italic fill-N2 s1">재료를 넣는다</text><path fill="none" marker-end="url(#mk-d2-2350649816-3488378134)" d="M1239.48 76.783C1310.3 86.9 1346.7 89.5 1415.5 89.5" class="connection stroke-B1 s0" mask="url(#d2-2350649816)"/><path fill="none" marker-end="url(#mk-d2-2350649816-3488378134)" d="M1239.48 21.217C1310.3 11.1 1385.2 8.5 1470.25 8.5s526.25 9 650.4 43.917" class="connection stroke-B1 s0" mask="url(#d2-2350649816)"/><path fill="none" marker-end="url(#mk-d2-2350649816-3488378134)" d="M1806.5 89.5h314" class="connection stroke-B1 s0" mask="url(#d2-2350649816)"/><text x="1965" y="95" class="text-italic fill-N2 s1">부품으로 쓰인다</text><path fill="none" marker-end="url(#mk-d2-2350649816-3488378134)" d="M2380.5 89.5h176" class="connection stroke-B1 s0" mask="url(#d2-2350649816)"/><path fill="none" marker-end="url(#mk-d2-2350649816-3488378134)" d="M2132.68 132.16C1998.513 179.1 1894 191 1788.25 191s-495.35-18.6-634.205-91.148" class="connection stroke-B1 s0" mask="url(#d2-2350649816)"/><text x="1637.5" y="194" class="text-italic fill-N2 s1">다시 재료가 된다</text><mask id="d2-2350649816" width="3102" height="542" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3102v542H-101z"/><path d="M664 39h123v21H664zM1894 79h142v21h-142zM1565 178h145v21h-145z"/></mask></svg>