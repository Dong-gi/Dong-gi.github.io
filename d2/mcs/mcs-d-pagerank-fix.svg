<svg xmlns="http://www.w3.org/2000/svg" width="1118" height="2617" class="d2-3845654728 d2-svg" viewBox="-63 -121 1118 2617"><rect width="1118" height="2617" x="-63" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3845654728 .fill-N1{fill:#0a0f25}.d2-3845654728 .fill-N2{fill:#676c7e}.d2-3845654728 .fill-B4{fill:#e3e9fd}.d2-3845654728 .fill-B5{fill:#edf0fd}.d2-3845654728 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M203 20h587v308H203z" class="stroke-B1 fill-B4 s0"/></g><text x="496.5" y="7" class="text-bold fill-N1 s1">첫 시도 — 낱말만 센다</text></g><g ><g class="shape"><path d="M104 489h790v340H104z" class="stroke-B1 fill-B4 s0"/></g><text x="499" y="476" class="text-bold fill-N1 s1">둘째 시도 — 진입 차수를 센다</text></g><g ><g class="shape"><path d="M53 990h900v356H53z" class="stroke-B1 fill-B4 s0"/></g><text x="503" y="977" class="text-bold fill-N1 s1">셋째 시도 — 무작위 행보</text></g><g ><g class="shape"><path d="M61 1486h848v538H61z" class="stroke-B1 fill-B4 s0"/></g><text x="485" y="1473" class="text-bold fill-N1 s1">남은 두 문제 — 수학이 요구하는 것</text></g><g ><g class="shape"><path d="M286 2144h421v98H286z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="496.5" y="2182.5" class="text-bold fill-N1 s2"><tspan x="496.5" dy="0">페이지랭크의 정의 — 정상분포</tspan><tspan x="496.5" dy="17.667">Rank(x) = Σ Rank(y)/outdeg(y) (y → x 인 간선마다)</tspan><tspan x="496.5" dy="17.667">Σ Rank(x) = 1</tspan></text></g><text x="496" y="2358" class="fill-N1 s2"><tspan x="496" dy="0">정점이 n 개면 미지수 n 개에 방정식 n + 1 개다. 마지막 줄이 없으면 모두 0 도 답이 되므로 반드시 넣는다.</tspan><tspan x="496" dy="17.667">실제로는 방정식을 풀지 않고 균등분포에서 시작해 행보를 되풀이한다 — 강하게 연결되어 있으므로 수렴한다.</tspan><tspan x="496" dy="17.667">선형대수의 말로는 Rank 가 전이행렬의 고윳값 1 에 대한 고유벡터다.</tspan></text><g ><g class="shape"><path d="M337 50h319v66H337z" class="stroke-B1 fill-B5 s0"/></g><text x="496.5" y="88.5" class="text-bold fill-N1 s2">검색어가 문서에 몇 번 나오는가</text></g><g ><g class="shape"><path d="M233 216h527v82H233z" class="stroke-B1 fill-B5 s0"/></g><text x="496.5" y="254.5" class="text-bold fill-N1 s2"><tspan x="496.5" dy="0">무너지는 방식</tspan><tspan x="496.5" dy="18.5">첫 화면에 ‘수학 수학 ⋯ 수학’ 을 200번 적으면 1등이 된다</tspan></text></g><g ><g class="shape"><path d="M347 519h299v82H347z" class="stroke-B1 fill-B5 s0"/></g><text x="496.5" y="557.5" class="text-bold fill-N1 s2"><tspan x="496.5" dy="0">Rank(x) ::= indeg(x)</tspan><tspan x="496.5" dy="18.5">나를 가리키는 링크가 곧 표다</tspan></text></g><g ><g class="shape"><path d="M134 701h330v98H134z" class="stroke-B1 fill-B5 s0"/></g><text x="299" y="739.5" class="text-bold fill-N1 s2"><tspan x="299" dy="0">무너지는 방식 ①</tspan><tspan x="299" dy="17.667">허수아비 페이지 1000개를 만들어</tspan><tspan x="299" dy="17.667">내 페이지를 가리키게 한다</tspan></text></g><g ><g class="shape"><path d="M524 701h340v98H524z" class="stroke-B1 fill-B5 s0"/></g><text x="694" y="739.5" class="text-bold fill-N1 s2"><tspan x="694" dy="0">무너지는 방식 ②</tspan><tspan x="694" dy="17.667">한 페이지가 링크를 잔뜩 뿌려</tspan><tspan x="694" dy="17.667">여러 페이지를 한꺼번에 밀어 준다</tspan></text></g><g ><g class="shape"><path d="M347 1020h298v82H347z" class="stroke-B1 fill-B5 s0"/></g><text x="496" y="1058.5" class="text-bold fill-N1 s2"><tspan x="496" dy="0">페이지 x 에서 나가는 링크를</tspan><tspan x="496" dy="18.5">각각 1/outdeg(x) 확률로 따른다</tspan></text></g><g ><g class="shape"><path d="M83 1202h377v114H83z" class="stroke-B1 fill-B5 s0"/></g><text x="271.5" y="1240.5" class="text-bold fill-N1 s2"><tspan x="271.5" dy="0">①이 막힌다</tspan><tspan x="271.5" dy="17.25">허수아비를 아무도 가리키지 않으므로</tspan><tspan x="271.5" dy="17.25">허수아비에 머물 확률이 거의 0 이고,</tspan><tspan x="271.5" dy="17.25">0 을 나눠 주어도 0 이다</tspan></text></g><g ><g class="shape"><path d="M520 1210h403v98H520z" class="stroke-B1 fill-B5 s0"/></g><text x="721.5" y="1248.5" class="text-bold fill-N1 s2"><tspan x="721.5" dy="0">②가 막힌다</tspan><tspan x="721.5" dy="17.667">한 표의 무게가 1/outdeg 로 쪼개진다.</tspan><tspan x="721.5" dy="17.667">링크를 많이 뿌리면 한 표씩이 가벼워진다</tspan></text></g><g ><g class="shape"><path d="M91 1524h360v66H91z" class="stroke-B1 fill-B5 s0"/></g><text x="271" y="1562.5" class="text-bold fill-N1 s2">나가는 링크가 없는 페이지에 갇힌다</text></g><g ><g class="shape"><path d="M563 1516h316v82H563z" class="stroke-B1 fill-B5 s0"/></g><text x="721" y="1554.5" class="text-bold fill-N1 s2"><tspan x="721" dy="0">정상분포가 여럿이거나</tspan><tspan x="721" dy="18.5">출발점에 따라 수렴하지 않는다</tspan></text></g><g ><g class="shape"><path d="M217 1698h558v114H217z" class="stroke-B1 fill-B5 s0"/></g><text x="496" y="1736.5" class="text-bold fill-N1 s2"><tspan x="496" dy="0">슈퍼 정점을 더한다</tspan><tspan x="496" dy="17.25">모든 페이지에서 슈퍼 정점으로 가는 간선을 놓고(확률 0.15),</tspan><tspan x="496" dy="17.25">슈퍼 정점에서 모든 페이지로 균등하게 나간다.</tspan><tspan x="496" dy="17.25">원래 링크 n 개는 각각 0.85/n 이 된다</tspan></text></g><g ><g class="shape"><path d="M214 1912h564v82H214z" class="stroke-B1 fill-B5 s0"/></g><text x="496" y="1950.5" class="text-bold fill-N1 s2"><tspan x="496" dy="0">그래프가 강하게 연결된다</tspan><tspan x="496" dy="18.5">→ 정상분포가 유일하고, 어디서 출발해도 그것에 가까워진다</tspan></text></g><marker id="mk-d2-3845654728-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M496 118v94" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M405.682 601.834C320.3 641 298.5 661 298.5 697" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M586.318 601.834C671.7 641 693.5 661 693.5 697" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M393.145 1102.748C295.8 1142 271 1162 271 1198" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M598.855 1102.748C696.2 1142 721 1163.6 721 1206" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M496 300v215" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><text x="496" y="414" class="text-italic fill-N2 s2">링크를 보자</text><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M298.5 801v78.25c0 18.15 21.8 100.75 105.364 139.082" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><text x="309.5" y="943" class="text-italic fill-N2 s2">표에 무게를 주자</text><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M693.5 801v78.25c0 18.15-21.8 100.75-105.364 139.082" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M271 1592c0 44.4 21 66 101.389 104.28" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M721 1600c0 38-21 58-101.389 96.28" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M496 1814v94" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M271 1318v202" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M721 1310v202" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M496 1996v144" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><path fill="none" marker-end="url(#mk-d2-3845654728-3488378134)" d="M496 2244v94" class="connection stroke-B1 s0" mask="url(#d2-3845654728)"/><mask id="d2-3845654728" width="1118" height="2617" x="-63" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-63-121h1118v2617H-63z"/><path d="M444 398h104v21H444zM237 927h145v21H237z"/></mask></svg>