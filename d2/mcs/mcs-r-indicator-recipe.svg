<svg xmlns="http://www.w3.org/2000/svg" width="2209" height="1434" class="d2-3254665092 d2-svg" viewBox="-101 -101 2209 1434"><rect width="2209" height="1434" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3254665092 .fill-N1{fill:#0a0f25}.d2-3254665092 .fill-B5{fill:#edf0fd}.d2-3254665092 .fill-B6{fill:#f7f8fe}.d2-3254665092 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="466" cy="78.5" class="shape stroke-B1 fill-B6 s0" rx="235" ry="78.5"/></g><text x="466" y="84" class="text-bold fill-N1 s1">‘⋯ 의 개수의 기댓값은 얼마인가’</text></g><g ><g class="shape"><path d="M0 278h404v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="202" y="316.5" class="text-bold fill-N1 s1"><tspan x="202" dy="0">곧바로 하는 길 — 분포를 구해서 Σ x·Pr[R = x]</tspan><tspan x="202" dy="17.667">대개 여기서 막힌다. 모자 문제에서는</tspan><tspan x="202" dy="17.667">Pr[G = k] 를 아는 것 자체가 어렵다</tspan></text></g><g ><g class="shape"><path d="M552 278h530v98H552z" class="stroke-B1 fill-B6 s0"/></g><text x="817" y="316.5" class="text-bold fill-N1 s1"><tspan x="817" dy="0">1단계 사건으로 쪼갠다</tspan><tspan x="817" dy="17.667">세려는 것 하나하나에 사건 Aᵢ 를 붙인다</tspan><tspan x="817" dy="17.667">(i 번째 사람이 제 모자를 받는다, i·j 자리가 뒤집혀 있다, ⋯)</tspan></text></g><g ><g class="shape"><path d="M666 476h302v98H666z" class="stroke-B1 fill-B6 s0"/></g><text x="817" y="514.5" class="text-bold fill-N1 s1"><tspan x="817" dy="0">2단계 지시확률변수로 바꾼다</tspan><tspan x="817" dy="17.667">Iᵢ = 1 (Aᵢ 가 일어남), 0 (아님)</tspan><tspan x="817" dy="17.667">R = I₁ + I₂ + ⋯ + Iₙ</tspan></text></g><g ><g class="shape"><path d="M617 674h400v98H617z" class="stroke-B1 fill-B6 s0"/></g><text x="817" y="712.5" class="text-bold fill-N1 s1"><tspan x="817" dy="0">3단계 확률 하나만 구한다</tspan><tspan x="817" dy="17.667">Ex[Iᵢ] = Pr[Aᵢ]</tspan><tspan x="817" dy="17.667">지시변수의 기댓값은 그 사건의 확률이다</tspan></text></g><g ><g class="shape"><path d="M637 872h360v98H637z" class="stroke-B1 fill-B6 s0"/></g><text x="817" y="910.5" class="text-bold fill-N1 s1"><tspan x="817" dy="0">4단계 선형성으로 더한다</tspan><tspan x="817" dy="17.667">Ex[R] = Σ Pr[Aᵢ]</tspan><tspan x="817" dy="17.667">독립을 쓰지 않았다는 것이 요점이다</tspan></text></g><g ><g class="shape"><path d="M125 1090h1882v142H125z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1066" y="1077" class="fill-N1" style="text-anchor:middle;font-size:28px">이 요령으로 풀리는 것들</text></g><text x="1134" y="60" class="fill-N1 s1"><tspan x="1134" dy="0">쓸 수 있는 곳과 없는 곳.</tspan><tspan x="1134" dy="17.25">곱에는 쓸 수 없다 — Ex[R·S] = Ex[R]·Ex[S] 는 독립일 때만 참이고, Ex[R²] ≠ (Ex[R])² 가 보통이다.</tspan><tspan x="1134" dy="17.25">항이 무한히 많으면 Σ Ex[|Rᵢ|] 가 수렴해야 한다. 이 조건이 깨지는 예가 배팅 두 배 전략이다.</tspan><tspan x="1134" dy="17.25">분산은 선형이 아니다 — 22장에서 독립일 때만 더해진다는 것을 본다.</tspan></text><g ><g class="shape"><path d="M155 1120h196v82H155z" class="stroke-B1 fill-B5 s0"/></g><text x="253" y="1158.5" class="text-bold fill-N1 s1"><tspan x="253" dy="0">모자 되돌려주기</tspan><tspan x="253" dy="18.5">Pr[Aᵢ] = 1/n, n 항 → 1</tspan></text></g><g ><g class="shape"><path d="M411 1120h252v82H411z" class="stroke-B1 fill-B5 s0"/></g><text x="537" y="1158.5" class="text-bold fill-N1 s1"><tspan x="537" dy="0">무작위 순열의 뒤집힘</tspan><tspan x="537" dy="18.5">Pr = 1/2, C(n,2) 항 → n(n−1)/4</tspan></text></g><g ><g class="shape"><path d="M723 1120h188v82H723z" class="stroke-B1 fill-B5 s0"/></g><text x="817" y="1158.5" class="text-bold fill-N1 s1"><tspan x="817" dy="0">이항분포의 평균</tspan><tspan x="817" dy="18.5">Pr = p, n 항 → pn</tspan></text></g><g ><g class="shape"><path d="M971 1120h383v82H971z" class="stroke-B1 fill-B5 s0"/></g><text x="1162.5" y="1158.5" class="text-bold fill-N1 s1"><tspan x="1162.5" dy="0">최댓값 갱신 횟수</tspan><tspan x="1162.5" dy="18.5">Pr[i 번째가 앞의 것들보다 크다] = 1/i → Hₙ</tspan></text></g><g ><g class="shape"><path d="M1414 1120h563v82h-563z" class="stroke-B1 fill-B5 s0"/></g><text x="1695.5" y="1158.5" class="text-bold fill-N1 s1"><tspan x="1695.5" dy="0">쿠폰 수집가</tspan><tspan x="1695.5" dy="18.5">(합이 지시변수가 아니라 기하변수다 — 선형성만 같다) → n·Hₙ</tspan></text></g><marker id="mk-d2-3254665092-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3254665092-3488378134)" d="M337.232 145.935C229.4 203 202 229.7 202 274.5" class="connection stroke-B1 s0" mask="url(#d2-3254665092)"/><text x="245.5" y="200" style="fill:#676c7e;text-anchor:middle;font-size:16px">막다른 길이 잦다</text><path fill="none" marker-end="url(#mk-d2-3254665092-3488378134)" d="M619.857 138.744C776.8 201.6 816.5 229.7 816.5 274.5" class="connection stroke-B1 s0" mask="url(#d2-3254665092)"/><path fill="none" marker-end="url(#mk-d2-3254665092-3488378134)" d="M816.5 378v94" class="connection stroke-B1 s0" mask="url(#d2-3254665092)"/><path fill="none" marker-end="url(#mk-d2-3254665092-3488378134)" d="M816.5 576v94" class="connection stroke-B1 s0" mask="url(#d2-3254665092)"/><path fill="none" marker-end="url(#mk-d2-3254665092-3488378134)" d="M816.5 774v94" class="connection stroke-B1 s0" mask="url(#d2-3254665092)"/><path fill="none" marker-end="url(#mk-d2-3254665092-3488378134)" d="M816.5 972v114" class="connection stroke-B1 s0" mask="url(#d2-3254665092)"/><mask id="d2-3254665092" width="2209" height="1434" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2209v1434H-101z"/><path d="M173 184h145v21H173z"/></mask></svg>