<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="1624" class="d2-3715537997 d2-svg" viewBox="-89 -89 1330 1624"><rect width="1330" height="1624" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3715537997 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3715537997 .fill-N1{fill:#0a0f25}.d2-3715537997 .fill-B5{fill:#edf0fd}.d2-3715537997 .fill-B6{fill:#f7f8fe}.d2-3715537997 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="400" cy="90.5" class="shape stroke-B1 fill-B6 s0" rx="235" ry="78.5"/></g><text x="400" y="96" class="text-bold fill-N1 s1">‘⋯ 의 개수의 기댓값은 얼마인가’</text></g><g ><g class="shape"><path d="M12 417h404v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="214" y="455.5" class="text-bold fill-N1 s1"><tspan x="214" dy="0">곧바로 하는 길 — 분포를 구해서 Σ x·Pr[R = x]</tspan><tspan x="214" dy="17.667">대개 여기서 막힌다. 모자 문제에서는</tspan><tspan x="214" dy="17.667">Pr[G = k] 를 아는 것 자체가 어렵다</tspan></text></g><g ><g class="shape"><path d="M322 249h530v98H322z" class="stroke-B1 fill-B6 s0"/></g><text x="587" y="287.5" class="text-bold fill-N1 s1"><tspan x="587" dy="0">1단계 사건으로 쪼갠다</tspan><tspan x="587" dy="17.667">세려는 것 하나하나에 사건 Aᵢ 를 붙인다</tspan><tspan x="587" dy="17.667">(i 번째 사람이 제 모자를 받는다, i·j 자리가 뒤집혀 있다, ⋯)</tspan></text></g><g ><g class="shape"><path d="M436 417h302v98H436z" class="stroke-B1 fill-B6 s0"/></g><text x="587" y="455.5" class="text-bold fill-N1 s1"><tspan x="587" dy="0">2단계 지시확률변수로 바꾼다</tspan><tspan x="587" dy="17.667">Iᵢ = 1 (Aᵢ 가 일어남), 0 (아님)</tspan><tspan x="587" dy="17.667">R = I₁ + I₂ + ⋯ + Iₙ</tspan></text></g><g ><g class="shape"><path d="M387 585h400v98H387z" class="stroke-B1 fill-B6 s0"/></g><text x="587" y="623.5" class="text-bold fill-N1 s1"><tspan x="587" dy="0">3단계 확률 하나만 구한다</tspan><tspan x="587" dy="17.667">Ex[Iᵢ] = Pr[Aᵢ]</tspan><tspan x="587" dy="17.667">지시변수의 기댓값은 그 사건의 확률이다</tspan></text></g><g ><g class="shape"><path d="M407 753h360v98H407z" class="stroke-B1 fill-B6 s0"/></g><text x="587" y="791.5" class="text-bold fill-N1 s1"><tspan x="587" dy="0">4단계 선형성으로 더한다</tspan><tspan x="587" dy="17.667">Ex[R] = Σ Pr[Aᵢ]</tspan><tspan x="587" dy="17.667">독립을 쓰지 않았다는 것이 요점이다</tspan></text></g><g ><g class="shape"><path d="M34 921h1106v324H34z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="587" y="954" class="fill-N1" style="text-anchor:middle;font-size:28px">이 요령으로 풀리는 것들</text></g><path fill="transparent" stroke="transparent" d="M109 1265h933v169H109z" class="shape s0"/><g ><g class="shape"><path d="M94 981h302v82H94z" class="stroke-B1 fill-B5 s0"/></g><text x="245" y="1019.5" class="text-bold fill-N1 s1"><tspan x="245" dy="0">모자 되돌려주기</tspan><tspan x="245" dy="18.5">Pr[Aᵢ] = 1/n, n 항 → 1</tspan></text></g><g ><g class="shape"><path d="M436 981h302v82H436z" class="stroke-B1 fill-B5 s0"/></g><text x="587" y="1019.5" class="text-bold fill-N1 s1"><tspan x="587" dy="0">무작위 순열의 뒤집힘</tspan><tspan x="587" dy="18.5">Pr = 1/2, C(n,2) 항 → n(n−1)/4</tspan></text></g><g ><g class="shape"><path d="M778 981h302v82H778z" class="stroke-B1 fill-B5 s0"/></g><text x="929" y="1019.5" class="text-bold fill-N1 s1"><tspan x="929" dy="0">이항분포의 평균</tspan><tspan x="929" dy="18.5">Pr = p, n 항 → pn</tspan></text></g><g ><g class="shape"><path d="M94 1103h383v82H94z" class="stroke-B1 fill-B5 s0"/></g><text x="285.5" y="1141.5" class="text-bold fill-N1 s1"><tspan x="285.5" dy="0">최댓값 갱신 횟수</tspan><tspan x="285.5" dy="18.5">Pr[i 번째가 앞의 것들보다 크다] = 1/i → Hₙ</tspan></text></g><g ><g class="shape"><path d="M517 1103h563v82H517z" class="stroke-B1 fill-B5 s0"/></g><text x="798.5" y="1141.5" class="text-bold fill-N1 s1"><tspan x="798.5" dy="0">쿠폰 수집가</tspan><tspan x="798.5" dy="18.5">(합이 지시변수가 아니라 기하변수다 — 선형성만 같다) → n·Hₙ</tspan></text></g><text x="575.5" y="1331" class="fill-N1 s1"><tspan x="575.5" dy="0">쓸 수 있는 곳과 없는 곳.</tspan><tspan x="575.5" dy="17.25">곱에는 쓸 수 없다 — Ex[R·S] = Ex[R]·Ex[S] 는 독립이면 참이지만 늘 참은 아니고, Ex[R²] ≠ (Ex[R])² 가 보통이다.</tspan><tspan x="575.5" dy="17.25">항이 무한히 많으면 Σ Ex[|Rᵢ|] 가 수렴해야 한다. 이 조건이 깨지는 예가 배팅 두 배 전략이다.</tspan><tspan x="575.5" dy="17.25">분산은 선형이 아니다 — 22장에서 쌍마다 독립이면 더해진다는 것을 본다.</tspan></text><marker id="mk-d2-3715537997-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3715537997-3488378134)" d="M214 140v273" class="connection stroke-B1 s0" mask="url(#d2-3715537997)"/><text x="214.5" y="283" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">막다른 길이 잦다</text><path fill="none" marker-end="url(#mk-d2-3715537997-3488378134)" d="M587 140v105" class="connection stroke-B1 s0" mask="url(#d2-3715537997)"/><path fill="none" marker-end="url(#mk-d2-3715537997-3488378134)" d="M587 349v64" class="connection stroke-B1 s0" mask="url(#d2-3715537997)"/><path fill="none" marker-end="url(#mk-d2-3715537997-3488378134)" d="M587 517v64" class="connection stroke-B1 s0" mask="url(#d2-3715537997)"/><path fill="none" marker-end="url(#mk-d2-3715537997-3488378134)" d="M587 685v64" class="connection stroke-B1 s0" mask="url(#d2-3715537997)"/><path fill="none" marker-end="url(#mk-d2-3715537997-3488378134)" d="M587 853v64" class="connection stroke-B1 s0" mask="url(#d2-3715537997)"/><mask id="d2-3715537997" width="1330" height="1624" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1330v1624H-89z"/><path d="M142 267h145v21H142z"/></mask></svg>