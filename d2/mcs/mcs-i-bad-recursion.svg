<svg xmlns="http://www.w3.org/2000/svg" width="2316" height="1391" class="d2-3933539644 d2-svg" viewBox="-101 -101 2316 1391"><rect width="2316" height="1391" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3933539644 .fill-N1{fill:#0a0f25}.d2-3933539644 .fill-B6{fill:#f7f8fe}.d2-3933539644 .stroke-B1,.d2-3933539644 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="283" cy="94.5" class="shape stroke-B1 fill-B6 s0" rx="283" ry="94.5"/></g><text x="283" y="92" class="text-bold fill-N1 s1"><tspan x="283" dy="0">아래 넷은 ℕ 위의 함수를 정의하지 못한다</tspan><tspan x="283" dy="18.5">점선은 순서가 아니라 목록이라는 표시다</tspan></text></g><g ><g class="shape"><path d="M145 289h276v130H145z" class="stroke-B1 fill-B6 s0"/></g><text x="283" y="327.5" class="text-bold fill-N1 s1"><tspan x="283" dy="0">① 기저가 없다</tspan><tspan x="283" dy="17">f(n) ::= 2 + f(n−1)</tspan><tspan x="283" dy="17">→ 상수를 더한 함수도</tspan><tspan x="283" dy="17">모두 이 식을 만족한다.</tspan><tspan x="283" dy="17">만족하는 함수가 여러 개다</tspan></text></g><g ><g class="shape"><path d="M141 519h284v162H141z" class="stroke-B1 fill-B6 s0"/></g><text x="283" y="557.5" class="text-bold fill-N1 s1"><tspan x="283" dy="0">② 큰 쪽을 참조한다</tspan><tspan x="283" dy="16.714">f(0) ::= 0, 그 밖에는</tspan><tspan x="283" dy="16.714">f(n) ::= f(n+1)</tspan><tspan x="283" dy="16.714">→ 0 에서 0 이고 나머지에서</tspan><tspan x="283" dy="16.714">아무 상수인 함수가 다 만족.</tspan><tspan x="283" dy="16.714">돌리면 f(1) 이 f(2), f(3), …</tspan><tspan x="283" dy="16.714">을 끝없이 부른다</tspan></text></g><g ><g class="shape"><path d="M162 781h242v146H162z" class="stroke-B1 fill-B6 s0"/></g><text x="283" y="819.5" class="text-bold fill-N1 s1"><tspan x="283" dy="0">③ 규칙끼리 어긋난다</tspan><tspan x="283" dy="16.833">2 의 배수면 0,</tspan><tspan x="283" dy="16.833">3 의 배수면 1,</tspan><tspan x="283" dy="16.833">그 밖에는 2</tspan><tspan x="283" dy="16.833">→ f(6) 이 0 이면서 1 이다.</tspan><tspan x="283" dy="16.833">만족하는 함수가 없다</tspan></text></g><g ><g class="shape"><path d="M144 1027h278v162H144z" class="stroke-B1 fill-B6 s0"/></g><text x="283" y="1065.5" class="text-bold fill-N1 s1"><tspan x="283" dy="0">④ 끝나는지 모른다</tspan><tspan x="283" dy="16.714">n ≤ 1 이면 1, 짝수면 f(n/2),</tspan><tspan x="283" dy="16.714">홀수면 f(3n+1)</tspan><tspan x="283" dy="16.714">→ 상수함수 1 이 만족하는데</tspan><tspan x="283" dy="16.714">다른 함수도 만족하는지</tspan><tspan x="283" dy="16.714">알려져 있지 않다.</tspan><tspan x="283" dy="16.714">콜라츠 추측이다</tspan></text></g><text x="892" y="84" class="fill-N1 s1"><tspan x="892" dy="0">네 경우 모두 ℕ 의 재귀적 정의(0 과 n ↦ n+1)를 따라가지 않았다.</tspan><tspan x="892" dy="17.667">따라가려면 f(0) 을 직접 주고 f(n+1) 을 f(n) 으로 적어야 하며,</tspan><tspan x="892" dy="17.667">그러면 값이 하나로 정해지는 것이 구조적 귀납법으로 증명된다</tspan></text><text x="1666" y="84" class="fill-N1 s1"><tspan x="1666" dy="0">큰 쪽을 참조해도 정의가 되는 경우가 있다 — 아커만 함수가 그렇다.</tspan><tspan x="1666" dy="17.667">A(m, n) 을 A(m−1, A(m, n−1)) 로 적어 둘째 인자가 훨씬 커지는데도 값이 하나로 정해진다.</tspan><tspan x="1666" dy="17.667">다만 그것을 증명하는 데 재주가 필요하다. 큰 쪽 참조는 무조건 틀린 것이 아니라 무조건 의심스러운 것이다</tspan></text><marker id="mk-d2-3933539644-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3933539644-2177206569)" d="M283 191v94" class="connection stroke-B2 s2" mask="url(#d2-3933539644)"/><path fill="none" marker-end="url(#mk-d2-3933539644-2177206569)" d="M283 421v94" class="connection stroke-B2 s2" mask="url(#d2-3933539644)"/><path fill="none" marker-end="url(#mk-d2-3933539644-2177206569)" d="M283 683v94" class="connection stroke-B2 s2" mask="url(#d2-3933539644)"/><path fill="none" marker-end="url(#mk-d2-3933539644-2177206569)" d="M283 929v94" class="connection stroke-B2 s2" mask="url(#d2-3933539644)"/><mask id="d2-3933539644" width="2316" height="1391" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2316v1391H-101z"/></mask></svg>