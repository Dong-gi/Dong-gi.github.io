<svg xmlns="http://www.w3.org/2000/svg" width="1083" height="1945" class="d2-2419643777 d2-svg" viewBox="-101 -101 1083 1945"><rect width="1083" height="1945" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2419643777 .text-bold{font-weight:700}.d2-2419643777 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2419643777 .fill-N1{fill:#0a0f25}.d2-2419643777 .fill-N2{fill:#676c7e}.d2-2419643777 .fill-B6{fill:#f7f8fe}.d2-2419643777 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="469.5" cy="90" class="shape stroke-B1 fill-B6 s0" rx="270.5" ry="90"/></g><text x="469.5" y="79.5" class="text-bold fill-N1 s1"><tspan x="469.5" dy="0">정렬성 원리 (4장)</tspan><tspan x="469.5" dy="17.667">음이 아닌 정수의 공집합 아닌 집합에는</tspan><tspan x="469.5" dy="17.667">최소 원소가 있다</tspan></text></g><g ><g class="shape"><path d="M41 280h242v98H41z" class="stroke-B1 fill-B6 s0"/></g><text x="162" y="318.5" class="text-bold fill-N1 s1"><tspan x="162" dy="0">나눗셈 정리</tspan><tspan x="162" dy="17.667">n = qd + r 이고 0 ≤ r &lt; |d| 인</tspan><tspan x="162" dy="17.667">q, r 가 딱 하나 있다</tspan></text></g><g ><g class="shape"><path d="M18 484h289v114H18z" class="stroke-B1 fill-B6 s0"/></g><text x="162.5" y="522.5" class="text-bold fill-N1 s1"><tspan x="162.5" dy="0">gcd(a, b) = gcd(b, rem(a, b))</tspan><tspan x="162.5" dy="17.25">a 가 b 와 r 의 선형결합이고</tspan><tspan x="162.5" dy="17.25">r 가 a 와 b 의 선형결합이므로</tspan><tspan x="162.5" dy="17.25">두 쌍의 공약수 전체가 같다</tspan></text></g><g ><g class="shape"><ellipse cx="527" cy="541" class="shape stroke-B1 fill-B6 s0" rx="160" ry="63"/></g><text x="527" y="522.5" class="text-bold fill-N1 s1"><tspan x="527" dy="0">상태 기계와</tspan><tspan x="527" dy="17.25">불변량 원리 (8장)</tspan><tspan x="527" dy="17.25">gcd(x, y) = gcd(a, b) 가</tspan><tspan x="527" dy="17.25">보존되는 불변량이다</tspan></text></g><g ><g class="shape"><path d="M0 704h324v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="162" y="742.5" class="text-bold fill-N1 s1"><tspan x="162" dy="0">유클리드 알고리즘이 gcd 를 낸다</tspan><tspan x="162" dy="17">y 가 0 이 되면 x 가 답이다</tspan><tspan x="162" dy="17">(부분 정당성)</tspan><tspan x="162" dy="17">x 가 두 걸음마다</tspan><tspan x="162" dy="17">절반 이하로 줄어든다 (종료성)</tspan></text></g><g ><g class="shape"><path d="M417 720h260v98H417z" class="stroke-B1 fill-B6 s0"/></g><text x="547" y="758.5" class="text-bold fill-N1 s1"><tspan x="547" dy="0">분쇄기 — 확장 유클리드</tspan><tspan x="547" dy="17.667">gcd(a, b) = sa + tb 인</tspan><tspan x="547" dy="17.667">정수 s, t 를 실제로 찾는다</tspan></text></g><g ><g class="shape"><path d="M407 934h280v114H407z" class="stroke-B1 fill-B6 s0"/></g><text x="547" y="972.5" class="text-bold fill-N1 s1"><tspan x="547" dy="0">gcd(a, b) 는</tspan><tspan x="547" dy="17.25">a 와 b 의 정수 선형결합이다</tspan><tspan x="547" dy="17.25">따라서 선형결합 전체</tspan><tspan x="547" dy="17.25">= gcd 의 배수 전체</tspan></text></g><g ><g class="shape"><path d="M393 1148h307v98H393z" class="stroke-B1 fill-B6 s0"/></g><text x="546.5" y="1186.5" class="text-bold fill-N1 s1"><tspan x="546.5" dy="0">p 가 소수이고 p | ab 이면</tspan><tspan x="546.5" dy="17.667">p | a 또는 p | b</tspan><tspan x="546.5" dy="17.667">(증명에 위의 선형결합만 쓴다)</tspan></text></g><g ><g class="shape"><path d="M493 1346h336v114H493z" class="stroke-B1 fill-B6 s0"/></g><text x="661" y="1384.5" class="text-bold fill-N1 s1"><tspan x="661" dy="0">산술의 기본정리</tspan><tspan x="661" dy="17.25">1 보다 큰 모든 정수는</tspan><tspan x="661" dy="17.25">약하게 감소하는 소수열의 곱으로</tspan><tspan x="661" dy="17.25">딱 한 가지로 쓰인다</tspan></text></g><g ><g class="shape"><path d="M442 1597h439v146H442z" class="stroke-B1 fill-B6 s0"/></g><text x="661.5" y="1635.5" class="text-bold fill-N1 s1"><tspan x="661.5" dy="0">순환 논증 — 절대 이렇게 하지 마라</tspan><tspan x="661.5" dy="16.833">‘ab 의 소인수는 a 의 소인수와</tspan><tspan x="661.5" dy="16.833">b 의 소인수를 합친 것이다’ 라고 하면</tspan><tspan x="661.5" dy="16.833">p | ab ⇒ p | a 또는 p | b 가 한 줄로 나온다.</tspan><tspan x="661.5" dy="16.833">그런데 그 한 줄은 유일 분해를 이미 쓴 것이고,</tspan><tspan x="661.5" dy="16.833">유일 분해의 증명이 이 보조정리를 쓴다</tspan></text></g><marker id="mk-d2-2419643777-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2419643777-3488378134)" d="M308.178 163.825C191.6 216.6 162 240 162 276" class="connection stroke-B1 s0" mask="url(#d2-2419643777)"/><path fill="none" marker-end="url(#mk-d2-2419643777-3488378134)" d="M162 380v100" class="connection stroke-B1 s0" mask="url(#d2-2419643777)"/><path fill="none" marker-end="url(#mk-d2-2419643777-3488378134)" d="M79.112 599.147C16.75 642.8 14.75 664 67.495 701.675" class="connection stroke-B1 s0" mask="url(#d2-2419643777)"/><path fill="none" marker-end="url(#mk-d2-2419643777-3488378134)" d="M444.354 596.136C377.6 642.2 343.3 664 277.958 701.99" class="connection stroke-B1 s0" mask="url(#d2-2419643777)"/><path fill="none" marker-end="url(#mk-d2-2419643777-3488378134)" d="M309.418 584.032C498.7 639.893 546.5 667.2 546.5 716" class="connection stroke-B1 s0" mask="url(#d2-2419643777)"/><path fill="none" marker-end="url(#mk-d2-2419643777-3488378134)" d="M546.5 820v110" class="connection stroke-B1 s0" mask="url(#d2-2419643777)"/><path fill="none" marker-end="url(#mk-d2-2419643777-3488378134)" d="M546.5 1050v94" class="connection stroke-B1 s0" mask="url(#d2-2419643777)"/><path fill="none" marker-end="url(#mk-d2-2419643777-3488378134)" d="M546.5 1248c0 38 10.8 58 51.065 95.282" class="connection stroke-B1 s0" mask="url(#d2-2419643777)"/><path fill="none" marker-end="url(#mk-d2-2419643777-3488378134)" d="M629.822 163.825C746.4 216.6 776 249.8 776 279.5v868c0 29.7-10.8 158.5-51.065 195.782" class="connection stroke-B1 s0" mask="url(#d2-2419643777)"/><text x="776.5" y="718" class="text-italic fill-N2 s1"><tspan x="776.5" dy="0">가장 작은</tspan><tspan x="776.5" dy="18.5">반례를 잡는다</tspan></text><marker id="mk-d2-2419643777-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2419643777-2177206569)" d="M661.25 1461.5v132" class="connection" mask="url(#d2-2419643777)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:8,7.892511"/><text x="661.5" y="1526" class="text-italic fill-N2 s1"><tspan x="661.5" dy="0">이 화살표를 그으면</tspan><tspan x="661.5" dy="18.5">증명이 무너진다</tspan></text><mask id="d2-2419643777" width="1083" height="1945" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H982v1945H-101z"/><path d="M715 702h123v37H715zM579 1510h165v37H579z"/></mask></svg>