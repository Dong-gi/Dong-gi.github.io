<svg xmlns="http://www.w3.org/2000/svg" width="1566" height="1917" class="d2-646929927 d2-svg" viewBox="-101 -101 1566 1917"><rect width="1566" height="1917" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-646929927 .fill-N1{fill:#0a0f25}.d2-646929927 .fill-N2{fill:#676c7e}.d2-646929927 .fill-B6{fill:#f7f8fe}.d2-646929927 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="741.5" cy="126" class="shape stroke-B1 fill-B6 s0" rx="377.5" ry="126"/></g><text x="741.5" y="123.5" class="text-bold fill-N1 s1"><tspan x="741.5" dy="0">정렬성 원리 (4장)</tspan><tspan x="741.5" dy="18.5">음이 아닌 정수의 공집합 아닌 집합에는 최소 원소가 있다</tspan></text></g><g ><g class="shape"><path d="M58 352h403v82H58z" class="stroke-B1 fill-B6 s0"/></g><text x="259.5" y="390.5" class="text-bold fill-N1 s1"><tspan x="259.5" dy="0">나눗셈 정리</tspan><tspan x="259.5" dy="18.5">n = qd + r 이고 0 ≤ r &lt; |d| 인 q, r 가 딱 하나 있다</tspan></text></g><g ><g class="shape"><path d="M0 578h519v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="259.5" y="616.5" class="text-bold fill-N1 s1"><tspan x="259.5" dy="0">gcd(a, b) = gcd(b, rem(a, b))</tspan><tspan x="259.5" dy="17.667">a 가 b 와 r 의 선형결합이고 r 가 a 와 b 의 선형결합이므로</tspan><tspan x="259.5" dy="17.667">두 쌍의 공약수 전체가 같다</tspan></text></g><g ><g class="shape"><ellipse cx="857.5" cy="627" class="shape stroke-B1 fill-B6 s0" rx="278.5" ry="93"/></g><text x="857.5" y="624.5" class="text-bold fill-N1 s1"><tspan x="857.5" dy="0">상태 기계와 불변량 원리 (8장)</tspan><tspan x="857.5" dy="18.5">gcd(x, y) = gcd(a, b) 가 보존되는 불변량이다</tspan></text></g><g ><g class="shape"><path d="M34 820h451v98H34z" class="stroke-B1 fill-B6 s0"/></g><text x="259.5" y="858.5" class="text-bold fill-N1 s1"><tspan x="259.5" dy="0">유클리드 알고리즘이 gcd 를 낸다</tspan><tspan x="259.5" dy="17.667">y 가 0 이 되면 x 가 답이다 (부분 정당성)</tspan><tspan x="259.5" dy="17.667">x 가 두 걸음마다 절반 이하로 줄어든다 (종료성)</tspan></text></g><g ><g class="shape"><path d="M673 828h410v82H673z" class="stroke-B1 fill-B6 s0"/></g><text x="878" y="866.5" class="text-bold fill-N1 s1"><tspan x="878" dy="0">분쇄기 — 확장 유클리드</tspan><tspan x="878" dy="18.5">gcd(a, b) = sa + tb 인 정수 s, t 를 실제로 찾는다</tspan></text></g><g ><g class="shape"><path d="M686 1018h383v82H686z" class="stroke-B1 fill-B6 s0"/></g><text x="877.5" y="1056.5" class="text-bold fill-N1 s1"><tspan x="877.5" dy="0">gcd(a, b) 는 a 와 b 의 정수 선형결합이다</tspan><tspan x="877.5" dy="18.5">따라서 선형결합 전체 = gcd 의 배수 전체</tspan></text></g><g ><g class="shape"><path d="M701 1200h353v82H701z" class="stroke-B1 fill-B6 s0"/></g><text x="877.5" y="1238.5" class="text-bold fill-N1 s1"><tspan x="877.5" dy="0">p 가 소수이고 p | ab 이면 p | a 또는 p | b</tspan><tspan x="877.5" dy="18.5">(증명에 위의 선형결합만 쓴다)</tspan></text></g><g ><g class="shape"><path d="M789 1382h523v98H789z" class="stroke-B1 fill-B6 s0"/></g><text x="1050.5" y="1420.5" class="text-bold fill-N1 s1"><tspan x="1050.5" dy="0">산술의 기본정리</tspan><tspan x="1050.5" dy="17.667">1 보다 큰 모든 정수는 약하게 감소하는 소수열의 곱으로</tspan><tspan x="1050.5" dy="17.667">딱 한 가지로 쓰인다</tspan></text></g><g ><g class="shape"><path d="M737 1601h627v114H737z" class="stroke-B1 fill-B6 s0"/></g><text x="1050.5" y="1639.5" class="text-bold fill-N1 s1"><tspan x="1050.5" dy="0">순환 논증 — 절대 이렇게 하지 마라</tspan><tspan x="1050.5" dy="17.25">‘ab 의 소인수는 a 의 소인수와 b 의 소인수를 합친 것이다’ 라고 하면</tspan><tspan x="1050.5" dy="17.25">p | ab ⇒ p | a 또는 p | b 가 한 줄로 나온다. 그런데 그 한 줄은</tspan><tspan x="1050.5" dy="17.25">유일 분해를 이미 쓴 것이고, 유일 분해의 증명이 이 보조정리를 쓴다</tspan></text></g><marker id="mk-d2-646929927-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-646929927-3488378134)" d="M485.121 219.685C305 285.4 259.5 312 259.5 348" class="connection stroke-B1 s0" mask="url(#d2-646929927)"/><path fill="none" marker-end="url(#mk-d2-646929927-3488378134)" d="M259.5 436v138" class="connection stroke-B1 s0" mask="url(#d2-646929927)"/><path fill="none" marker-end="url(#mk-d2-646929927-3488378134)" d="M178.299 677.052C58.399 751.2 51.4 780 141.322 818.428" class="connection stroke-B1 s0" mask="url(#d2-646929927)"/><path fill="none" marker-end="url(#mk-d2-646929927-3488378134)" d="M721.297 709.048C642.4 757.6 585.65 780 443.109 818.946" class="connection stroke-B1 s0" mask="url(#d2-646929927)"/><path fill="none" marker-end="url(#mk-d2-646929927-3488378134)" d="M473.448 676.451C796.3 751.2 877.5 781.6 877.5 824" class="connection stroke-B1 s0" mask="url(#d2-646929927)"/><path fill="none" marker-end="url(#mk-d2-646929927-3488378134)" d="M877.5 912v102" class="connection stroke-B1 s0" mask="url(#d2-646929927)"/><path fill="none" marker-end="url(#mk-d2-646929927-3488378134)" d="M877.5 1102v94" class="connection stroke-B1 s0" mask="url(#d2-646929927)"/><path fill="none" marker-end="url(#mk-d2-646929927-3488378134)" d="M877.5 1284c0 38 17.4 58 83.532 96.007" class="connection stroke-B1 s0" mask="url(#d2-646929927)"/><path fill="none" marker-end="url(#mk-d2-646929927-3488378134)" d="M997.879 219.685C1178 285.4 1223.5 320.2 1223.5 347.5v848c0 27.3-17.4 146.5-83.532 184.507" class="connection stroke-B1 s0" mask="url(#d2-646929927)"/><text x="1224" y="752" class="text-italic fill-N2 s1">가장 작은 반례를 잡는다</text><marker id="mk-d2-646929927-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-646929927-2177206569)" d="M1050.5 1481.5v116" class="connection" mask="url(#d2-646929927)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:8,7.892511"/><text x="1051" y="1546" class="text-italic fill-N2 s1">이 화살표를 그으면 증명이 무너진다</text><mask id="d2-646929927" width="1566" height="1917" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1566v1917H-101z"/><path d="M1121 736h206v21h-206zM898 1530h306v21H898z"/></mask></svg>