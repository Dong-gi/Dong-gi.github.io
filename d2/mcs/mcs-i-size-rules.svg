<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="697" class="d2-2730276626 d2-svg" viewBox="-101 -101 1424 697"><rect width="1424" height="697" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2730276626 .fill-N1{fill:#0a0f25}.d2-2730276626 .fill-B6{fill:#f7f8fe}.d2-2730276626 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="376.5" cy="168" class="shape stroke-B1 fill-B6 s0" rx="303.5" ry="101"/></g><text x="376.5" y="157.5" class="text-bold fill-N1 s1"><tspan x="376.5" dy="0">무한집합에서는 |A| 를 세지 않는다</tspan><tspan x="376.5" dy="17.667">surj · inj · bij 자체를 크기 비교의 정의로 삼는다</tspan><tspan x="376.5" dy="17.667">A strict B ::= NOT(A surj B)</tspan></text></g><g ><g class="shape"><path d="M889 0h297v114H889z" class="stroke-B1 fill-B6 s0"/></g><text x="1037.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1037.5" dy="0">6장에서 그대로 가져오는 것</tspan><tspan x="1037.5" dy="17.25">· A surj B ↔ B inj A</tspan><tspan x="1037.5" dy="17.25">· surj 와 inj 와 bij 는 추이적이다</tspan><tspan x="1037.5" dy="17.25">· A bij B ↔ B bij A</tspan></text></g><g ><g class="shape"><path d="M854 174h367v114H854z" class="stroke-B1 fill-B6 s0"/></g><text x="1037.5" y="212.5" class="text-bold fill-N1 s1"><tspan x="1037.5" dy="0">무한에서 따로 증명해야 하는 것</tspan><tspan x="1037.5" dy="17.25">· 슈뢰더 · 베른슈타인:</tspan><tspan x="1037.5" dy="17.25"> A surj B 이고 B surj A 이면 A bij B</tspan><tspan x="1037.5" dy="17.25">· 임의의 A, B 에 대해 A surj B 또는 B surj A</tspan></text></g><g ><g class="shape"><path d="M853 348h369v114H853z" class="stroke-B1 fill-B6 s0"/></g><text x="1037.5" y="386.5" class="text-bold fill-N1 s1"><tspan x="1037.5" dy="0">무한에서 깨지는 것</tspan><tspan x="1037.5" dy="17.25">· b ∉ A 이면 A 와 A ∪ {b} 는 크기가 다르다</tspan><tspan x="1037.5" dy="17.25"> → 무한집합에서는 오히려 같다</tspan><tspan x="1037.5" dy="17.25">· ‘진부분집합은 더 작다’ → 거짓</tspan></text></g><text x="376.5" y="345" class="fill-N1 s1"><tspan x="376.5" dy="0">왼쪽 세 줄이 그대로 넘어오는 이유: 6장의 증명이 화살표를 돌리고 합성하는 논증뿐이었고</tspan><tspan x="376.5" dy="17.667">‘개수’ 라는 말이 한 번도 나오지 않았다. 그래서 유한 가정이 필요하지 않다.</tspan><tspan x="376.5" dy="17.667">담당 A 가 그 증명들을 그렇게 써 둔 까닭이 이것이다</tspan></text><text x="376.5" y="458" class="fill-N1 s1"><tspan x="376.5" dy="0">가운데 두 줄의 증명에는 서수 이론이나 선택 공리가 필요하다.</tspan><tspan x="376.5" dy="17.667">이 문서에서는 결과만 쓰고 증명은 하지 않는다. 대신 이 둘로부터 나오는 것 —</tspan><tspan x="376.5" dy="17.667">A strict B 이고 B strict C 이면 A strict C — 은 예제에서 직접 유도한다</tspan></text><marker id="mk-d2-2730276626-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2730276626-3488378134)" d="M617.935 105.493C765.6 66.8 820.2 57 885 57" class="connection stroke-B1 s0" mask="url(#d2-2730276626)"/><path fill="none" marker-end="url(#mk-d2-2730276626-3488378134)" d="M655.979 209.292C773.2 226.6 813.2 231 850 231" class="connection stroke-B1 s0" mask="url(#d2-2730276626)"/><path fill="none" marker-end="url(#mk-d2-2730276626-3488378134)" d="M534.748 255.971C749 375 813 405 849 405" class="connection stroke-B1 s0" mask="url(#d2-2730276626)"/><mask id="d2-2730276626" width="1424" height="697" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1424v697H-101z"/></mask></svg>