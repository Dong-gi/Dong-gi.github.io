<svg xmlns="http://www.w3.org/2000/svg" width="1278" height="1102" class="d2-3206969365 d2-svg" viewBox="-101 -101 1278 1102"><rect width="1278" height="1102" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3206969365 .text-bold{font-weight:700}.d2-3206969365 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3206969365 .fill-N1{fill:#0a0f25}.d2-3206969365 .fill-N2{fill:#676c7e}.d2-3206969365 .fill-B6{fill:#f7f8fe}.d2-3206969365 .stroke-B1,.d2-3206969365 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h363v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="181.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="181.5" dy="0">측도</tspan><tspan x="181.5" dy="17.667">목록에 남은 이름의 총 개수</tspan><tspan x="181.5" dy="17.667">하루에 적어도 하나 줄고 늘지 않는다</tspan></text></g><g ><g class="shape"><path d="M423 0h396v98H423z" class="stroke-B1 fill-B6 s0"/></g><text x="621" y="38.5" class="text-bold fill-N1 s1"><tspan x="621" dy="0">불변량 P</tspan><tspan x="621" dy="17.667">여자 w 가 남자 m 의 목록에서 지워졌다면</tspan><tspan x="621" dy="17.667">w 는 m 보다 좋은 구혼자를 갖고 있다</tspan></text></g><g ><g class="shape"><path d="M767 401h309v98H767z" class="stroke-B1 fill-B6 s0"/></g><text x="921.5" y="439.5" class="text-bold fill-N1 s1"><tspan x="921.5" dy="0">불변량 Q</tspan><tspan x="921.5" dy="17.667">w 가 m 의 목록에서 지워졌다면</tspan><tspan x="921.5" dy="17.667">w 는 m 에게 가망 없는 상대다</tspan></text></g><g ><g class="shape"><path d="M76 219h212v82H76z" class="stroke-B1 fill-B6 s0"/></g><text x="182" y="257.5" class="text-bold fill-N1 s1"><tspan x="182" dy="0">결혼하는 날이 온다</tspan><tspan x="182" dy="18.5">n² 일 안에</tspan></text></g><g ><g class="shape"><path d="M589 219h259v82H589z" class="stroke-B1 fill-B6 s0"/></g><text x="718.5" y="257.5" class="text-bold fill-N1 s1"><tspan x="718.5" dy="0">모두 결혼한다</tspan><tspan x="718.5" dy="18.5">짝 없이 남는 사람이 없다</tspan></text></g><g ><g class="shape"><path d="M536 409h171v82H536z" class="stroke-B1 fill-B6 s0"/></g><text x="621.5" y="447.5" class="text-bold fill-N1 s1"><tspan x="621.5" dy="0">안정하다</tspan><tspan x="621.5" dy="18.5">불량 짝이 없다</tspan></text></g><g ><g class="shape"><path d="M590 620h363v82H590z" class="stroke-B1 fill-B6 s0"/></g><text x="771.5" y="658.5" class="text-bold fill-N1 s1"><tspan x="771.5" dy="0">남자는 가망 있는 최선의 짝을 얻는다</tspan><tspan x="771.5" dy="18.5">여자는 가망 있는 최악의 짝을 얻는다</tspan></text></g><path fill="transparent" stroke="transparent" d="M123 722h829v178H123z" class="shape s0"/><text x="537.5" y="762" class="fill-N1 s1"><tspan x="537.5" dy="0">가망 있는 짝(feasible spouse): 어떤 안정한 짝짓기에서 그 사람과 결혼하는 상대.</tspan><tspan x="537.5" dy="17.667">안정한 짝짓기가 적어도 하나 있다는 것(구혼 의식의 결과)을 먼저 알아야 이 말이 뜻을 갖는다.</tspan><tspan x="537.5" dy="17.667">그래서 증명 순서를 바꿀 수 없다</tspan></text><text x="504.5" y="839" class="fill-N1 s1"><tspan x="504.5" dy="0">직관과 반대되는 결론: 매일 고르고 거절하는 쪽은 여자인데도 유리한 쪽은 남자다.</tspan><tspan x="504.5" dy="17.667">남자가 세레나데하는 상대는 나빠지기만 하고 여자의 최선 구혼자는 좋아지기만 하니</tspan><tspan x="504.5" dy="17.667">여자가 유리해 보이지만, 여자가 고르는 것은 ‘온 사람 중에서’ 일 뿐이다</tspan></text><marker id="mk-d2-3206969365-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3206969365-3488378134)" d="M181.5 99.5v116" class="connection stroke-B1 s0" mask="url(#d2-3206969365)"/><text x="182" y="164" class="text-italic fill-N2 s1">정렬성 원리</text><path fill="none" marker-end="url(#mk-d2-3206969365-3488378134)" d="M665.326 98.998C707.2 146.3 718 170.7 718 215.5" class="connection stroke-B1 s0" mask="url(#d2-3206969365)"/><text x="709" y="157" class="text-italic fill-N2 s1">짝 없는 남자의 목록은 비었다</text><path fill="none" marker-end="url(#mk-d2-3206969365-3488378134)" d="M558.957 98.772C501.3 146.3 486.5 178.8 486.5 209.25s15.8 153.35 75.776 197.383" class="connection stroke-B1 s0" mask="url(#d2-3206969365)"/><text x="488.5" y="260" class="text-italic fill-N2 s1">경우 1</text><marker id="mk-d2-3206969365-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3206969365-2177206569)" d="M621 492.5c0 53.2 17.6 79.2 84.713 125.721" class="connection stroke-B2 s3" mask="url(#d2-3206969365)"/><path fill="none" marker-end="url(#mk-d2-3206969365-3488378134)" d="M921 500.5c0 46.8-17.6 71.2-84.713 117.721" class="connection stroke-B1 s0" mask="url(#d2-3206969365)"/><text x="900.5" y="579" class="text-italic fill-N2 s1">지워진 여자는 모두 가망 없었다</text><path fill="none" marker-end="url(#mk-d2-3206969365-2177206569)" d="M718 303c0 38-11.4 59.6-54.196 103.147" class="connection stroke-B2 s3" mask="url(#d2-3206969365)"/><mask id="d2-3206969365" width="1278" height="1102" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1278v1102H-101z"/><path d="M130 148h104v21H130zM585 141h248v21H585zM462 244h53v21h-53zM767 563h267v21H767z"/></mask></svg>