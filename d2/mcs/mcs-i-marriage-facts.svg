<svg xmlns="http://www.w3.org/2000/svg" width="3330" height="697" class="d2-420429036 d2-svg" viewBox="-101 -101 3330 697"><rect width="3330" height="697" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-420429036 .fill-N1{fill:#0a0f25}.d2-420429036 .fill-N2{fill:#676c7e}.d2-420429036 .fill-B6{fill:#f7f8fe}.d2-420429036 .stroke-B1,.d2-420429036 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M209 0h363v98H209z" class="stroke-B1 fill-B6 s0"/></g><text x="390.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="390.5" dy="0">측도</tspan><tspan x="390.5" dy="17.667">목록에 남은 이름의 총 개수</tspan><tspan x="390.5" dy="17.667">하루에 적어도 하나 줄고 늘지 않는다</tspan></text></g><g ><g class="shape"><path d="M193 171h396v98H193z" class="stroke-B1 fill-B6 s0"/></g><text x="391" y="209.5" class="text-bold fill-N1 s1"><tspan x="391" dy="0">불변량 P</tspan><tspan x="391" dy="17.667">여자 w 가 남자 m 의 목록에서 지워졌다면</tspan><tspan x="391" dy="17.667">w 는 m 보다 좋은 구혼자를 갖고 있다</tspan></text></g><g ><g class="shape"><path d="M1890 321h309v98h-309z" class="stroke-B1 fill-B6 s0"/></g><text x="2044.5" y="359.5" class="text-bold fill-N1 s1"><tspan x="2044.5" dy="0">불변량 Q</tspan><tspan x="2044.5" dy="17.667">w 가 m 의 목록에서 지워졌다면</tspan><tspan x="2044.5" dy="17.667">w 는 m 에게 가망 없는 상대다</tspan></text></g><g ><g class="shape"><path d="M1352 8h212v82h-212z" class="stroke-B1 fill-B6 s0"/></g><text x="1458" y="46.5" class="text-bold fill-N1 s1"><tspan x="1458" dy="0">결혼하는 날이 온다</tspan><tspan x="1458" dy="18.5">n² 일 안에</tspan></text></g><g ><g class="shape"><path d="M1328 224h259v82h-259z" class="stroke-B1 fill-B6 s0"/></g><text x="1457.5" y="262.5" class="text-bold fill-N1 s1"><tspan x="1457.5" dy="0">모두 결혼한다</tspan><tspan x="1457.5" dy="18.5">짝 없이 남는 사람이 없다</tspan></text></g><g ><g class="shape"><path d="M1959 179h171v82h-171z" class="stroke-B1 fill-B6 s0"/></g><text x="2044.5" y="217.5" class="text-bold fill-N1 s1"><tspan x="2044.5" dy="0">안정하다</tspan><tspan x="2044.5" dy="18.5">불량 짝이 없다</tspan></text></g><g ><g class="shape"><path d="M2765 254h363v82h-363z" class="stroke-B1 fill-B6 s0"/></g><text x="2946.5" y="292.5" class="text-bold fill-N1 s1"><tspan x="2946.5" dy="0">남자는 가망 있는 최선의 짝을 얻는다</tspan><tspan x="2946.5" dy="18.5">여자는 가망 있는 최악의 짝을 얻는다</tspan></text></g><text x="390.5" y="345" class="fill-N1 s1"><tspan x="390.5" dy="0">가망 있는 짝(feasible spouse): 어떤 안정한 짝짓기에서 그 사람과 결혼하는 상대.</tspan><tspan x="390.5" dy="17.667">안정한 짝짓기가 적어도 하나 있다는 것(구혼 의식의 결과)을 먼저 알아야 이 말이 뜻을 갖는다.</tspan><tspan x="390.5" dy="17.667">그래서 증명 순서를 바꿀 수 없다</tspan></text><text x="390.5" y="458" class="fill-N1 s1"><tspan x="390.5" dy="0">직관과 반대되는 결론: 매일 고르고 거절하는 쪽은 여자인데도 유리한 쪽은 남자다.</tspan><tspan x="390.5" dy="17.667">남자가 세레나데하는 상대는 나빠지기만 하고 여자의 최선 구혼자는 좋아지기만 하니</tspan><tspan x="390.5" dy="17.667">여자가 유리해 보이지만, 여자가 고르는 것은 ‘온 사람 중에서’ 일 뿐이다</tspan></text><marker id="mk-d2-420429036-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-420429036-3488378134)" d="M573.5 49h774" class="connection stroke-B1 s0" mask="url(#d2-420429036)"/><text x="962" y="55" class="text-italic fill-N2 s1">정렬성 원리</text><path fill="none" marker-end="url(#mk-d2-420429036-3488378134)" d="M591.495 233.28C961.5 258.828 1109.3 265.25 1324.5 265.25" class="connection stroke-B1 s0" mask="url(#d2-420429036)"/><text x="959" y="264" class="text-italic fill-N2 s1">짝 없는 남자의 목록은 비었다</text><path fill="none" marker-end="url(#mk-d2-420429036-3488378134)" d="M591.495 205.72C961.5 180.17 1135.1 173.75 1256 173.75s526.7 6.6 699.544 32.41" class="connection stroke-B1 s0" mask="url(#d2-420429036)"/><text x="1275.5" y="179" class="text-italic fill-N2 s1">경우 1</text><marker id="mk-d2-420429036-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-420429036-2177206569)" d="M2132 219.5c279.6 0 406.6 9.2 629.052 45.358" class="connection stroke-B2 s3" mask="url(#d2-420429036)"/><path fill="none" marker-end="url(#mk-d2-420429036-3488378134)" d="M2201 369.5c224.4 0 337.6-9.2 560.052-45.358" class="connection stroke-B1 s0" mask="url(#d2-420429036)"/><text x="2483.5" y="370" class="text-italic fill-N2 s1">지워진 여자는 모두 가망 없었다</text><path fill="none" marker-end="url(#mk-d2-420429036-2177206569)" d="M1588.5 265.25c119.6 0 194.2-6.601 367.044-32.41" class="connection stroke-B2 s3" mask="url(#d2-420429036)"/><mask id="d2-420429036" width="3330" height="697" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3330v697H-101z"/><path d="M910 39h104v21H910zM835 248h248v21H835zM1249 163h53v21h-53zM2350 354h267v21h-267z"/></mask></svg>