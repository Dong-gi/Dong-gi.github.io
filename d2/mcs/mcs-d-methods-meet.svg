<svg xmlns="http://www.w3.org/2000/svg" width="1132" height="1878" class="d2-4018056961 d2-svg" viewBox="-101 -101 1132 1878"><rect width="1132" height="1878" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4018056961 .fill-N1{fill:#0a0f25}.d2-4018056961 .fill-B4{fill:#e3e9fd}.d2-4018056961 .fill-B5{fill:#edf0fd}.d2-4018056961 .fill-B6{fill:#f7f8fe}.d2-4018056961 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:28px}</style><g ><g class="shape"><ellipse cx="455.5" cy="71.5" class="shape stroke-B1 fill-B6 s0" rx="214.5" ry="71.5"/></g><text x="455.5" y="77" class="text-bold fill-N1 s1">f(0) = 0, f(1) = 1, f(n) = f(n−1) + f(n−2)</text></g><g ><g class="shape"><path d="M34 263h376v720H34z" class="stroke-B1 fill-B4 s0"/></g><text x="222" y="250" class="text-bold fill-N1 s2">24장의 길 — 특성근</text></g><g ><g class="shape"><path d="M450 271h480v704H450z" class="stroke-B1 fill-B4 s0"/></g><text x="690" y="258" class="text-bold fill-N1 s2">18장의 길 — 생성함수</text></g><g ><g class="shape"><path d="M303 1103h306v82H303z" class="stroke-B1 fill-B6 s0"/></g><text x="456" y="1141.5" class="text-bold fill-N1 s1"><tspan x="456" dy="0">두 길의 답이 같다</tspan><tspan x="456" dy="18.5">f(n) = (α₁ⁿ − α₂ⁿ)/√5 — 비네 공식</tspan></text></g><text x="456" y="1301" class="fill-N1 s1"><tspan x="456" dy="0">왜 같은가: 두 다항식은 계수를 거꾸로 쓴 것이고 뿌리가 서로 역수다.</tspan><tspan x="456" dy="17">특성다항식은 x² − x − 1 이고 생성함수의 분모는 q(x) = 1 − x − x² 다.</tspan><tspan x="456" dy="17">q(x) = 0 에 x = 1/α 를 넣으면 (1 − 1/α − 1/α²) = 0 이고 양변에 α² 을 곱하면 α² − α − 1 = 0 이 된다.</tspan><tspan x="456" dy="17">곧 q 의 뿌리 r 와 특성근 α 는 α = 1/r 의 관계다. 부분분수 조각 c/(1 − αx) 의 계수가 c·αⁿ 이므로</tspan><tspan x="456" dy="17">생성함수 길에서 나오는 항이 곧 특성근의 거듭제곱이다 — 두 길은 같은 수를 다른 이름으로 부른다.</tspan></text><text x="456" y="1486" class="fill-N1 s1"><tspan x="456" dy="0">중복근에서도 두 길이 맞아떨어진다. 특성근 α 의 중복도가 k 이면 특성근 길은 αⁿ, nαⁿ, ⋯, n^(k−1)αⁿ 을 낳는다.</tspan><tspan x="456" dy="17.667">생성함수 길에서는 분모에 (1 − αx)^k 가 생기고 그 계수가 C(n+k−1, n)·αⁿ 이라 n 의 (k−1)차 다항식이 붙는다.</tspan><tspan x="456" dy="17.667">‘왜 n 이 곱해지는가’ 라는 물음의 답이 그쪽에 있다.</tspan></text><text x="455.5" y="1639" class="fill-N1 s1"><tspan x="455.5" dy="0">어느 쪽이 편한가: 비동차항 g(n) 이 있으면 생성함수 쪽이 편하다 — g 의 생성함수를 방정식에 그냥 더하면 된다.</tspan><tspan x="455.5" dy="17.667">반대로 자라는 속도만 알고 싶으면 특성근 쪽이 빠르다 — 가장 큰 뿌리 하나만 구하면 끝난다.</tspan><tspan x="455.5" dy="17.667">손으로 답을 끝까지 적어야 할 때는 특성근 쪽이 계산이 짧은 편이다.</tspan></text><g ><g class="shape"><path d="M64 293h316v82H64z" class="stroke-B1 fill-B5 s0"/></g><text x="222" y="331.5" class="text-bold fill-N1 s1"><tspan x="222" dy="0">f(n) = xⁿ 을 넣는다</tspan><tspan x="222" dy="18.5">xⁿ = xⁿ⁻¹ + xⁿ⁻² 를 xⁿ⁻² 로 나누면</tspan></text></g><g ><g class="shape"><path d="M73 483h298v82H73z" class="stroke-B1 fill-B5 s0"/></g><text x="222" y="521.5" class="text-bold fill-N1 s1"><tspan x="222" dy="0">특성방정식 x² = x + 1</tspan><tspan x="222" dy="18.5">뿌리 α₁ = (1+√5)/2, α₂ = (1−√5)/2</tspan></text></g><g ><g class="shape"><path d="M96 681h252v66H96z" class="stroke-B1 fill-B5 s0"/></g><text x="222" y="719.5" class="text-bold fill-N1 s1">일반해 f(n) = s·α₁ⁿ + t·α₂ⁿ</text></g><g ><g class="shape"><path d="M112 855h220v98H112z" class="stroke-B1 fill-B5 s0"/></g><text x="222" y="893.5" class="text-bold fill-N1 s1"><tspan x="222" dy="0">f(0) = 0 → s + t = 0</tspan><tspan x="222" dy="17.667">f(1) = 1 → sα₁ + tα₂ = 1</tspan><tspan x="222" dy="17.667">풀면 s = 1/√5, t = −1/√5</tspan></text></g><g ><g class="shape"><path d="M539 301h301v66H539z" class="stroke-B1 fill-B5 s0"/></g><text x="689.5" y="339.5" class="text-bold fill-N1 s1">F(x) = f₀ + f₁x + f₂x² + ⋯ 로 접는다</text></g><g ><g class="shape"><path d="M572 475h235v98H572z" class="stroke-B1 fill-B5 s0"/></g><text x="689.5" y="513.5" class="text-bold fill-N1 s1"><tspan x="689.5" dy="0">F(x)(1 − x − x²) = x 이므로</tspan><tspan x="689.5" dy="17.667">F(x) = x / (1 − x − x²)</tspan><tspan x="689.5" dy="17.667">분모 q(x) = 1 − x − x²</tspan></text></g><g ><g class="shape"><path d="M544 673h291v82H544z" class="stroke-B1 fill-B5 s0"/></g><text x="689.5" y="711.5" class="text-bold fill-N1 s1"><tspan x="689.5" dy="0">q(x) = (1 − α₁x)(1 − α₂x)</tspan><tspan x="689.5" dy="18.5">같은 α₁, α₂ 가 여기서 나온다</tspan></text></g><g ><g class="shape"><path d="M480 863h420v82H480z" class="stroke-B1 fill-B5 s0"/></g><text x="690" y="901.5" class="text-bold fill-N1 s1"><tspan x="690" dy="0">부분분수로 c₁/(1−α₁x) + c₂/(1−α₂x) 로 쪼개고</tspan><tspan x="690" dy="18.5">c₁ = 1/√5, c₂ = −1/√5 를 얻는다</tspan></text></g><marker id="mk-d2-4018056961-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M221.5 377v102" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M221.5 567v110" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M221.5 749v102" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M689.5 369v102" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M689.5 575v94" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M689.5 757v102" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M337.225 132.922C245 180.8 221.5 253 221.5 289" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M573.775 132.922C666 180.8 689.5 254.6 689.5 297" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M221.5 955c0 38 25.8 108 125.27 146.554" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M689.5 947c0 44.4-25.8 116-125.27 154.554" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M455.5 1187v94" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M455.5 1372v94" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><path fill="none" marker-end="url(#mk-d2-4018056961-3488378134)" d="M455.5 1525v94" class="connection stroke-B1 s0" mask="url(#d2-4018056961)"/><mask id="d2-4018056961" width="1132" height="1878" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1132v1878H-101z"/></mask></svg>