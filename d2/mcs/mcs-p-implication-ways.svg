<svg xmlns="http://www.w3.org/2000/svg" width="1063" height="1034" class="d2-3194677674 d2-svg" viewBox="-89 -89 1063 1034"><rect width="1063" height="1034" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3194677674 .text-bold{font-weight:700}.d2-3194677674 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3194677674 .fill-N1{fill:#0a0f25}.d2-3194677674 .fill-N2{fill:#676c7e}.d2-3194677674 .fill-B6{fill:#f7f8fe}.d2-3194677674 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="115" cy="179" class="shape stroke-B1 fill-B6 s0" rx="103" ry="60"/></g><text x="115" y="176.5" class="text-bold fill-N1 s1"><tspan x="115" dy="0">P → Q 를</tspan><tspan x="115" dy="18.5">보여야 한다</tspan></text></g><g ><g class="shape"><ellipse cx="115" cy="502" class="shape stroke-B1 fill-B6 s0" rx="103" ry="40"/></g><text x="115" y="499.5" class="text-bold fill-N1 s1"><tspan x="115" dy="0">P ↔ Q 를</tspan><tspan x="115" dy="18.5">보여야 한다</tspan></text></g><g ><g class="shape"><path d="M571 12h249v98H571z" class="stroke-B1 fill-B6 s0"/></g><text x="695.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="695.5" dy="0">직접증명</tspan><tspan x="695.5" dy="17.667">‘P 라고 가정하자.’</tspan><tspan x="695.5" dy="17.667">그다음 Q 까지 밀고 간다</tspan></text></g><g ><g class="shape"><path d="M571 130h278v98H571z" class="stroke-B1 fill-B6 s0"/></g><text x="710" y="168.5" class="text-bold fill-N1 s1"><tspan x="710" dy="0">대우증명</tspan><tspan x="710" dy="17.667">‘대우를 증명한다: ¬Q → ¬P.’</tspan><tspan x="710" dy="17.667">그다음 직접증명과 같다</tspan></text></g><g ><g class="shape"><path d="M571 248h272v114H571z" class="stroke-B1 fill-B6 s0"/></g><text x="707" y="286.5" class="text-bold fill-N1 s1"><tspan x="707" dy="0">귀류법</tspan><tspan x="707" dy="17.25">‘모순을 이끌어 낸다.</tspan><tspan x="707" dy="17.25">P 이고 ¬Q 라 하자.’</tspan><tspan x="707" dy="17.25">어딘가에서 모순을 찾는다</tspan></text></g><g ><g class="shape"><path d="M571 382h302v114H571z" class="stroke-B1 fill-B6 s0"/></g><text x="722" y="420.5" class="text-bold fill-N1 s1"><tspan x="722" dy="0">양방향</tspan><tspan x="722" dy="17.25">‘먼저 P → Q 를,</tspan><tspan x="722" dy="17.25">다음에 Q → P 를 보인다.’</tspan><tspan x="722" dy="17.25">각각은 위의 세 방법 중 하나로</tspan></text></g><g ><g class="shape"><path d="M571 516h213v98H571z" class="stroke-B1 fill-B6 s0"/></g><text x="677.5" y="554.5" class="text-bold fill-N1 s1"><tspan x="677.5" dy="0">동치 사슬</tspan><tspan x="677.5" dy="17.667">‘iff 사슬을 만든다.’</tspan><tspan x="677.5" dy="17.667">P ↔ R₁ ↔ R₂ ↔ … ↔ Q</tspan></text></g><path fill="transparent" stroke="transparent" d="M203 634h479v210H203z" class="shape s0"/><text x="369.5" y="674" class="fill-N1 s1"><tspan x="369.5" dy="0">대우증명과 귀류법은 형제다.</tspan><tspan x="369.5" dy="17.25">대우증명은 ¬Q 하나만 가정하고,</tspan><tspan x="369.5" dy="17.25">귀류법은 P 와 ¬Q 를 함께 가정한다.</tspan><tspan x="369.5" dy="17.25">¬(P → Q) ≡ P ∧ ¬Q 가 그 근거다</tspan></text><text x="442.5" y="767" class="fill-N1 s1"><tspan x="442.5" dy="0">어느 길을 가든 밑작업(scratchwork)이 먼저다.</tspan><tspan x="442.5" dy="17.25">종이 한 장에 막 계산해 보고,</tspan><tspan x="442.5" dy="17.25">왜 참인지 알아낸 다음에 증명을 쓴다.</tspan><tspan x="442.5" dy="17.25">밑작업을 그대로 제출하면 읽는 사람이 길을 잃는다</tspan></text><marker id="mk-d2-3194677674-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3194677674-3488378134)" d="M206 149h42s10 0 10-10V71s0-10 10-10h299" class="connection stroke-B1 s0" mask="url(#d2-3194677674)"/><text x="343.5" y="59" class="text-italic fill-N2 s1"><tspan x="343.5" dy="0">P 를 식으로</tspan><tspan x="343.5" dy="18.5">적을 수 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-3194677674-3488378134)" d="M220 179h347" class="connection stroke-B1 s0" mask="url(#d2-3194677674)"/><text x="395" y="177" class="text-italic fill-N2 s1"><tspan x="395" dy="0">¬Q 가 P 보다</tspan><tspan x="395" dy="18.5">다루기 쉽다</tspan></text><path fill="none" marker-end="url(#mk-d2-3194677674-3488378134)" d="M206 209h42s10 0 10 10v76s0 10 10 10h299" class="connection stroke-B1 s0" mask="url(#d2-3194677674)"/><text x="339.5" y="303" class="text-italic fill-N2 s1"><tspan x="339.5" dy="0">결론이</tspan><tspan x="339.5" dy="18.5">‘그런 것은 없다’ 꼴이다</tspan></text><path fill="none" marker-end="url(#mk-d2-3194677674-3488378134)" d="m214 488.985 34-.246s10-.073 10-10.073V449s0-10 10-10h299" class="connection stroke-B1 s0" mask="url(#d2-3194677674)"/><text x="366.5" y="437" class="text-italic fill-N2 s1"><tspan x="366.5" dy="0">두 방향의</tspan><tspan x="366.5" dy="18.5">사정이 다르다</tspan></text><path fill="none" marker-end="url(#mk-d2-3194677674-3488378134)" d="m214 515.014 34 .247s10 .072 10 10.072V555s0 10 10 10h299" class="connection stroke-B1 s0" mask="url(#d2-3194677674)"/><text x="367" y="563" class="text-italic fill-N2 s1"><tspan x="367" dy="0">모든 단계를</tspan><tspan x="367" dy="18.5">동치로 이을 수 있다</tspan></text><mask id="d2-3194677674" width="1063" height="1034" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H974V945H-89z"/><path d="M290 43h107v37H290zM343 161h104v37H343zM236 287h207v37H236zM305 421h123v37H305zM283 547h168v37H283z"/></mask></svg>