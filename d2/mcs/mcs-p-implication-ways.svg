<svg xmlns="http://www.w3.org/2000/svg" width="1722" height="1080" class="d2-3007013039 d2-svg" viewBox="-101 -101 1722 1080"><rect width="1722" height="1080" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3007013039 .fill-N1{fill:#0a0f25}.d2-3007013039 .fill-N2{fill:#676c7e}.d2-3007013039 .fill-B6{fill:#f7f8fe}.d2-3007013039 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="278" cy="207" class="shape stroke-B1 fill-B6 s0" rx="150" ry="50"/></g><text x="278" y="212.5" class="text-bold fill-N1 s1">P → Q 를 보여야 한다</text></g><g ><g class="shape"><ellipse cx="278" cy="602" class="shape stroke-B1 fill-B6 s0" rx="150" ry="50"/></g><text x="278" y="607.5" class="text-bold fill-N1 s1">P ↔ Q 를 보여야 한다</text></g><g ><g class="shape"><path d="M1201 0h249v98h-249z" class="stroke-B1 fill-B6 s0"/></g><text x="1325.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1325.5" dy="0">직접증명</tspan><tspan x="1325.5" dy="17.667">‘P 라고 가정하자.’</tspan><tspan x="1325.5" dy="17.667">그다음 Q 까지 밀고 간다</tspan></text></g><g ><g class="shape"><path d="M1186 158h278v98h-278z" class="stroke-B1 fill-B6 s0"/></g><text x="1325" y="196.5" class="text-bold fill-N1 s1"><tspan x="1325" dy="0">대우증명</tspan><tspan x="1325" dy="17.667">‘대우를 증명한다: ¬Q → ¬P.’</tspan><tspan x="1325" dy="17.667">그다음 직접증명과 같다</tspan></text></g><g ><g class="shape"><path d="M1130 316h390v98h-390z" class="stroke-B1 fill-B6 s0"/></g><text x="1325" y="354.5" class="text-bold fill-N1 s1"><tspan x="1325" dy="0">귀류법</tspan><tspan x="1325" dy="17.667">‘모순을 이끌어 낸다. P 이고 ¬Q 라 하자.’</tspan><tspan x="1325" dy="17.667">어딘가에서 모순을 찾는다</tspan></text></g><g ><g class="shape"><path d="M1139 474h373v98h-373z" class="stroke-B1 fill-B6 s0"/></g><text x="1325.5" y="512.5" class="text-bold fill-N1 s1"><tspan x="1325.5" dy="0">양방향</tspan><tspan x="1325.5" dy="17.667">‘먼저 P → Q 를, 다음에 Q → P 를 보인다.’</tspan><tspan x="1325.5" dy="17.667">각각은 위의 세 방법 중 하나로</tspan></text></g><g ><g class="shape"><path d="M1219 632h213v98h-213z" class="stroke-B1 fill-B6 s0"/></g><text x="1325.5" y="670.5" class="text-bold fill-N1 s1"><tspan x="1325.5" dy="0">동치 사슬</tspan><tspan x="1325.5" dy="17.667">‘iff 사슬을 만든다.’</tspan><tspan x="1325.5" dy="17.667">P ↔ R₁ ↔ R₂ ↔ … ↔ Q</tspan></text></g><text x="278" y="728" class="fill-N1 s1"><tspan x="278" dy="0">대우증명과 귀류법은 형제다.</tspan><tspan x="278" dy="17.667">대우증명은 ¬Q 하나만 가정하고, 귀류법은 P 와 ¬Q 를 함께 가정한다.</tspan><tspan x="278" dy="17.667">¬(P → Q) ≡ P ∧ ¬Q 가 그 근거다</tspan></text><text x="278" y="841" class="fill-N1 s1"><tspan x="278" dy="0">어느 길을 가든 밑작업(scratchwork)이 먼저다.</tspan><tspan x="278" dy="17.667">종이 한 장에 막 계산해 보고, 왜 참인지 알아낸 다음에 증명을 쓴다.</tspan><tspan x="278" dy="17.667">밑작업을 그대로 제출하면 읽는 사람이 길을 잃는다</tspan></text><marker id="mk-d2-3007013039-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3007013039-3488378134)" d="M394.926 174.46C753 74.2 914.5 49 1196.5 49" class="connection stroke-B1 s0" mask="url(#d2-3007013039)"/><text x="790" y="74" class="text-italic fill-N2 s1">P 를 식으로 적을 수 있다</text><path fill="none" marker-end="url(#mk-d2-3007013039-3488378134)" d="M430 207h752" class="connection stroke-B1 s0" mask="url(#d2-3007013039)"/><text x="807.5" y="213" class="text-italic fill-N2 s1">¬Q 가 P 보다 다루기 쉽다</text><path fill="none" marker-end="url(#mk-d2-3007013039-3488378134)" d="M394.926 239.54C753 339.8 900.4 365 1126 365" class="connection stroke-B1 s0" mask="url(#d2-3007013039)"/><text x="756" y="346" class="text-italic fill-N2 s1">결론이 ‘그런 것은 없다’ 꼴이다</text><path fill="none" marker-end="url(#mk-d2-3007013039-3488378134)" d="M417.98 582.722C757.6 535 902.1 523 1134.5 523" class="connection stroke-B1 s0" mask="url(#d2-3007013039)"/><text x="776" y="539" class="text-italic fill-N2 s1">두 방향의 사정이 다르다</text><path fill="none" marker-end="url(#mk-d2-3007013039-3488378134)" d="M417.98 621.278C757.6 669 918.1 681 1214.5 681" class="connection stroke-B1 s0" mask="url(#d2-3007013039)"/><text x="815.5" y="679" class="text-italic fill-N2 s1">모든 단계를 동치로 이을 수 있다</text><mask id="d2-3007013039" width="1722" height="1080" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1722V979H-101z"/><path d="M689 58h202v21H689zM707 197h201v21H707zM622 330h268v21H622zM673 523h206v21H673zM680 663h271v21H680z"/></mask></svg>