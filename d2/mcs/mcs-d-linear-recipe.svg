<svg xmlns="http://www.w3.org/2000/svg" width="1384" height="1321" class="d2-91413759 d2-svg" viewBox="-101 -101 1384 1321"><rect width="1384" height="1321" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-91413759 .fill-N1{fill:#0a0f25}.d2-91413759 .fill-B5{fill:#edf0fd}.d2-91413759 .fill-B6{fill:#f7f8fe}.d2-91413759 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:24px}</style><path fill="transparent" stroke="transparent" d="M0 0h1182v909H0z" class="shape s0"/><text x="590.5" y="1082" class="fill-N1 s1"><tspan x="590.5" dy="0">왜 동차해를 더해도 되는가: 동차 선형 점화식의 해는 선형결합에 닫혀 있다.</tspan><tspan x="590.5" dy="17.667">s·f(n) + t·h(n) 을 점화식에 넣고 항을 모으면 다시 같은 점화식이 나온다(장 본문에서 증명한다).</tspan><tspan x="590.5" dy="17.667">그래서 특수해 하나에 동차해를 더한 것이 여전히 해이고, 경계조건을 맞출 자유가 상수만큼 생긴다.</tspan></text><text x="591.5" y="1025" class="fill-N1 s1"><tspan x="591.5" dy="0">답을 읽는 법: 2·2ⁿ − n − 2 는 2ⁿ − 1 의 약 두 배다. 한 번의 추가 작업을 1 에서 n 으로 늘렸는데</tspan><tspan x="591.5" dy="18.5">답은 두 배밖에 늘지 않았다 — 이 점화식에서는 부분문제의 크기와 개수가 지배하고 추가 작업은 상수배만 바꾼다.</tspan></text><g ><g class="shape"><path d="M80 60h459v789H80z" class="stroke-B1 fill-B5 s0"/></g><text x="309.5" y="89" class="text-bold fill-N1 s2">다섯 걸음</text></g><g ><g class="shape"><path d="M619 60h483v789H619z" class="stroke-B1 fill-B5 s0"/></g><text x="860.5" y="89" class="text-bold fill-N1 s2"><tspan x="860.5" dy="0">하노이 변형 —</tspan><tspan x="860.5" dy="27.5">원판 옮기기에 크기만큼 시간이 든다</tspan></text></g><g ><g class="shape"><path d="M110 110h399v98H110z" class="stroke-B1 fill-B6 s0"/></g><text x="309.5" y="148.5" class="text-bold fill-N1 s1"><tspan x="309.5" dy="0">① 비동차항 g(n) 을 0 으로 놓고</tspan><tspan x="309.5" dy="17.667">특성방정식의 뿌리를 구한다</tspan><tspan x="309.5" dy="17.667">xᵈ = a₁xᵈ⁻¹ + ⋯ + a_d</tspan></text></g><g ><g class="shape"><path d="M110 258h399v114H110z" class="stroke-B1 fill-B6 s0"/></g><text x="309.5" y="296.5" class="text-bold fill-N1 s1"><tspan x="309.5" dy="0">② 동차해를 적는다</tspan><tspan x="309.5" dy="17.25">겹치지 않는 뿌리 r 은 c·rⁿ 을,</tspan><tspan x="309.5" dy="17.25">중복도 k 인 뿌리는</tspan><tspan x="309.5" dy="17.25">d₁rⁿ, d₂n rⁿ, ⋯, d_k n^(k−1) rⁿ 을 낳는다</tspan></text></g><g ><g class="shape"><path d="M110 422h399v114H110z" class="stroke-B1 fill-B6 s0"/></g><text x="309.5" y="460.5" class="text-bold fill-N1 s1"><tspan x="309.5" dy="0">③ 특수해 하나를 찾는다</tspan><tspan x="309.5" dy="17.25">경계조건은 무시한다.</tspan><tspan x="309.5" dy="17.25">g 가 다항식이면 같은 차수의 다항식부터,</tspan><tspan x="309.5" dy="17.25">g 가 지수 cⁿ 이면 a·cⁿ 부터 시도한다</tspan></text></g><g ><g class="shape"><path d="M110 586h399v66H110z" class="stroke-B1 fill-B6 s0"/></g><text x="309.5" y="624.5" class="text-bold fill-N1 s1">④ 일반해 = 동차해 + 특수해</text></g><g ><g class="shape"><path d="M110 702h399v82H110z" class="stroke-B1 fill-B6 s0"/></g><text x="309.5" y="740.5" class="text-bold fill-N1 s1"><tspan x="309.5" dy="0">⑤ 경계조건을 넣어 상수를 정한다</tspan><tspan x="309.5" dy="18.5">조건 하나가 일차방정식 하나를 준다</tspan></text></g><g ><g class="shape"><path d="M681 125h359v98H681z" class="stroke-B1 fill-B6 s0"/></g><text x="860.5" y="179.5" class="text-bold fill-N1 s1">f(n) = 2f(n−1) 로 놓으면 x = 2</text></g><g ><g class="shape"><path d="M681 273h359v114H681z" class="stroke-B1 fill-B6 s0"/></g><text x="860.5" y="335.5" class="text-bold fill-N1 s1">동차해 f(n) = c·2ⁿ</text></g><g ><g class="shape"><path d="M681 437h359v114H681z" class="stroke-B1 fill-B6 s0"/></g><text x="860.5" y="475.5" class="text-bold fill-N1 s1"><tspan x="860.5" dy="0">g(n) = n 이므로 f(n) = an + b 로 시도한다.</tspan><tspan x="860.5" dy="17.25">an + b = 2(a(n−1) + b) + n 을 정리하면</tspan><tspan x="860.5" dy="17.25">0 = (a + 1)n + (b − 2a) 이므로 a = −1, b = −2.</tspan><tspan x="860.5" dy="17.25">특수해는 f(n) = −n − 2</tspan></text></g><g ><g class="shape"><path d="M681 601h359v66H681z" class="stroke-B1 fill-B6 s0"/></g><text x="860.5" y="639.5" class="text-bold fill-N1 s1">일반해 f(n) = c·2ⁿ − n − 2</text></g><g ><g class="shape"><path d="M681 717h359v82H681z" class="stroke-B1 fill-B6 s0"/></g><text x="860.5" y="755.5" class="text-bold fill-N1 s1"><tspan x="860.5" dy="0">f(1) = 1 이므로 2c − 3 = 1, c = 2.</tspan><tspan x="860.5" dy="18.5">답은 f(n) = 2·2ⁿ − n − 2</tspan></text></g><marker id="mk-d2-91413759-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="M309.5 210v44" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="M309.5 374v44" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="M309.5 538v44" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="M309.5 654v44" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="M860.5 225v44" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="M860.5 389v44" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="M860.5 553v44" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="M860.5 669v44" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="m510.5 164.058 167.002 4.826" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="m510.5 320.058 167.002 4.826" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="m510.5 484.058 167.002 4.826" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="m510.5 624.058 167.002 4.826" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="m510.5 748.058 167.002 4.826" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><path fill="none" marker-end="url(#mk-d2-91413759-3488378134)" d="m818.09 799.918-205.768 206.747" class="connection stroke-B1 s0" mask="url(#d2-91413759)"/><mask id="d2-91413759" width="1384" height="1321" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1384v1321H-101z"/></mask></svg>