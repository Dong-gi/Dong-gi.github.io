<svg xmlns="http://www.w3.org/2000/svg" width="3968" height="771" class="d2-671615227 d2-svg" viewBox="-81 -85 3968 771"><rect width="3968" height="771" x="-81" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-671615227 .fill-N1{fill:#0a0f25}.d2-671615227 .fill-B4{fill:#e3e9fd}.d2-671615227 .fill-B5{fill:#edf0fd}.d2-671615227 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M20 322h2282v190H20z" class="stroke-B1 fill-B4 s0"/></g><text x="1161" y="309" class="text-bold fill-N1 s1">다섯 걸음</text></g><g ><g class="shape"><path d="M513 56h2208v174H513z" class="stroke-B1 fill-B4 s0"/></g><text x="1617" y="43" class="text-bold fill-N1 s1">하노이 변형 — 원판 옮기기에 크기만큼 시간이 든다</text></g><text x="1902.5" y="548" class="fill-N1 s2"><tspan x="1902.5" dy="0">왜 동차해를 더해도 되는가: 동차 선형 점화식의 해는 선형결합에 닫혀 있다.</tspan><tspan x="1902.5" dy="17.667">s·f(n) + t·h(n) 을 점화식에 넣고 항을 모으면 다시 같은 점화식이 나온다(장 본문에서 증명한다).</tspan><tspan x="1902.5" dy="17.667">그래서 특수해 하나에 동차해를 더한 것이 여전히 해이고, 경계조건을 맞출 자유가 상수만큼 생긴다.</tspan></text><text x="3313.5" y="151" class="fill-N1 s2"><tspan x="3313.5" dy="0">답을 읽는 법: 2·2ⁿ − n − 2 는 2ⁿ − 1 의 약 두 배다. 한 번의 추가 작업을 1 에서 n 으로 늘렸는데</tspan><tspan x="3313.5" dy="18.5">답은 두 배밖에 늘지 않았다 — 이 점화식에서는 부분문제의 크기와 개수가 지배하고 추가 작업은 상수배만 바꾼다.</tspan></text><g ><g class="shape"><path d="M50 352h293v98H50z" class="stroke-B1 fill-B5 s0"/></g><text x="196.5" y="390.5" class="text-bold fill-N1 s2"><tspan x="196.5" dy="0">① 비동차항 g(n) 을 0 으로 놓고</tspan><tspan x="196.5" dy="17.667">특성방정식의 뿌리를 구한다</tspan><tspan x="196.5" dy="17.667">xᵈ = a₁xᵈ⁻¹ + ⋯ + a_d</tspan></text></g><g ><g class="shape"><path d="M493 354h361v114H493z" class="stroke-B1 fill-B5 s0"/></g><text x="673.5" y="392.5" class="text-bold fill-N1 s2"><tspan x="673.5" dy="0">② 동차해를 적는다</tspan><tspan x="673.5" dy="17.25">겹치지 않는 뿌리 r 은 c·rⁿ 을,</tspan><tspan x="673.5" dy="17.25">중복도 k 인 뿌리는</tspan><tspan x="673.5" dy="17.25">d₁rⁿ, d₂n rⁿ, ⋯, d_k n^(k−1) rⁿ 을 낳는다</tspan></text></g><g ><g class="shape"><path d="M954 364h399v114H954z" class="stroke-B1 fill-B5 s0"/></g><text x="1153.5" y="402.5" class="text-bold fill-N1 s2"><tspan x="1153.5" dy="0">③ 특수해 하나를 찾는다</tspan><tspan x="1153.5" dy="17.25">경계조건은 무시한다.</tspan><tspan x="1153.5" dy="17.25">g 가 다항식이면 같은 차수의 다항식부터,</tspan><tspan x="1153.5" dy="17.25">g 가 지수 cⁿ 이면 a·cⁿ 부터 시도한다</tspan></text></g><g ><g class="shape"><path d="M1498 398h270v66h-270z" class="stroke-B1 fill-B5 s0"/></g><text x="1633" y="436.5" class="text-bold fill-N1 s2">④ 일반해 = 동차해 + 특수해</text></g><g ><g class="shape"><path d="M1912 400h360v82h-360z" class="stroke-B1 fill-B5 s0"/></g><text x="2092" y="438.5" class="text-bold fill-N1 s2"><tspan x="2092" dy="0">⑤ 경계조건을 넣어 상수를 정한다</tspan><tspan x="2092" dy="18.5">조건 하나가 일차방정식 하나를 준다</tspan></text></g><g ><g class="shape"><path d="M543 110h261v66H543z" class="stroke-B1 fill-B5 s0"/></g><text x="673.5" y="148.5" class="text-bold fill-N1 s2">f(n) = 2f(n−1) 로 놓으면 x = 2</text></g><g ><g class="shape"><path d="M1064 110h180v66h-180z" class="stroke-B1 fill-B5 s0"/></g><text x="1154" y="148.5" class="text-bold fill-N1 s2">동차해 f(n) = c·2ⁿ</text></g><g ><g class="shape"><path d="M1453 86h359v114h-359z" class="stroke-B1 fill-B5 s0"/></g><text x="1632.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="1632.5" dy="0">g(n) = n 이므로 f(n) = an + b 로 시도한다.</tspan><tspan x="1632.5" dy="17.25">an + b = 2(a(n−1) + b) + n 을 정리하면</tspan><tspan x="1632.5" dy="17.25">0 = (a + 1)n + (b − 2a) 이므로 a = −1, b = −2.</tspan><tspan x="1632.5" dy="17.25">특수해는 f(n) = −n − 2</tspan></text></g><g ><g class="shape"><path d="M1976 110h233v66h-233z" class="stroke-B1 fill-B5 s0"/></g><text x="2092.5" y="148.5" class="text-bold fill-N1 s2">일반해 f(n) = c·2ⁿ − n − 2</text></g><g ><g class="shape"><path d="M2422 112h269v82h-269z" class="stroke-B1 fill-B5 s0"/></g><text x="2556.5" y="150.5" class="text-bold fill-N1 s2"><tspan x="2556.5" dy="0">f(1) = 1 이므로 2c − 3 = 1, c = 2.</tspan><tspan x="2556.5" dy="18.5">답은 f(n) = 2·2ⁿ − n − 2</tspan></text></g><marker id="mk-d2-671615227-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M344.996 408.12C383 410.4 453 411 489 411" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M855.998 419.08C894 420.6 914 421 950 421" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M1354.998 429.08C1393 430.6 1421.9 431 1493.5 431" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M1770.498 436.97C1843.3 440.176 1872 441 1908 441" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M806 143h253.5" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M1246.5 143H1449" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M1814 143h157.5" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M2211.5 143c88 0 170.5.6 206.507 2.76" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M344.961 372.108C383 364.5 480.4 325.1 627.171 178.328" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M855.975 380.184C894 374.1 944.8 333.1 1105.123 178.279" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M1354.975 390.184C1393 384.1 1435.4 345.9 1562.349 202.495" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M1770.472 408.018c72.828-12.348 130.128-58.918 281.87-229.53" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M2274 441c38 0 108-251.5 144.078-258.716" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><path fill="none" marker-end="url(#mk-d2-671615227-3488378134)" d="M2693 153h144" class="connection stroke-B1 s0" mask="url(#d2-671615227)"/><mask id="d2-671615227" width="3968" height="771" x="-81" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-81-85h3968v771H-81z"/></mask></svg>