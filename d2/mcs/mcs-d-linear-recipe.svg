<svg xmlns="http://www.w3.org/2000/svg" width="4396" height="819" class="d2-2590162402 d2-svg" viewBox="-81 -85 4396 819"><rect width="4396" height="819" x="-81" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2590162402 .fill-N1{fill:#0a0f25}.d2-2590162402 .fill-B4{fill:#e3e9fd}.d2-2590162402 .fill-B5{fill:#edf0fd}.d2-2590162402 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M20 433h2518v200H20z" class="stroke-B1 fill-B4 s0"/></g><text x="1279" y="420" class="text-bold fill-N1 s1">다섯 걸음</text></g><g ><g class="shape"><path d="M513 56h2679v174H513z" class="stroke-B1 fill-B4 s0"/></g><text x="1852.5" y="43" class="text-bold fill-N1 s1">하노이 변형 — 원판 옮기기에 크기만큼 시간이 든다</text></g><text x="2327.5" y="296" class="fill-N1 s2"><tspan x="2327.5" dy="0">왜 동차해를 더해도 되는가: 동차 선형 점화식의 해는 선형결합에 닫혀 있다.</tspan><tspan x="2327.5" dy="17.667">s·f(n) + t·h(n) 을 점화식에 넣고 항을 모으면 다시 같은 점화식이 나온다(장 본문에서 증명한다).</tspan><tspan x="2327.5" dy="17.667">그래서 특수해 하나에 동차해를 더한 것이 여전히 해이고, 경계조건을 맞출 자유가 상수만큼 생긴다.</tspan></text><text x="3763" y="149" class="fill-N1 s2"><tspan x="3763" dy="0">답을 읽는 법: 2·2ⁿ − n − 2 는 2ⁿ − 1 의 약 두 배다. 한 번의 추가 작업을 1 에서 n 으로 늘렸는데</tspan><tspan x="3763" dy="18.5">답은 두 배밖에 늘지 않았다 — 부분문제의 크기와 개수가 지배하고 추가 작업은 상수배만 바꾼다는 감각이다.</tspan></text><g ><g class="shape"><path d="M50 463h293v98H50z" class="stroke-B1 fill-B5 s0"/></g><text x="196.5" y="501.5" class="text-bold fill-N1 s2"><tspan x="196.5" dy="0">① 비동차항 g(n) 을 0 으로 놓고</tspan><tspan x="196.5" dy="17.667">특성방정식의 뿌리를 구한다</tspan><tspan x="196.5" dy="17.667">xᵈ = a₁xᵈ⁻¹ + ⋯ + a_d</tspan></text></g><g ><g class="shape"><path d="M493 467h361v114H493z" class="stroke-B1 fill-B5 s0"/></g><text x="673.5" y="505.5" class="text-bold fill-N1 s2"><tspan x="673.5" dy="0">② 동차해를 적는다</tspan><tspan x="673.5" dy="17.25">겹치지 않는 뿌리 r 은 c·rⁿ 을,</tspan><tspan x="673.5" dy="17.25">중복도 k 인 뿌리는</tspan><tspan x="673.5" dy="17.25">d₁rⁿ, d₂n rⁿ, ⋯, d_k n^(k−1) rⁿ 을 낳는다</tspan></text></g><g ><g class="shape"><path d="M954 477h399v114H954z" class="stroke-B1 fill-B5 s0"/></g><text x="1153.5" y="515.5" class="text-bold fill-N1 s2"><tspan x="1153.5" dy="0">③ 특수해 하나를 찾는다</tspan><tspan x="1153.5" dy="17.25">경계조건은 무시한다.</tspan><tspan x="1153.5" dy="17.25">g 가 다항식이면 같은 차수의 다항식부터,</tspan><tspan x="1153.5" dy="17.25">g 가 지수 cⁿ 이면 a·cⁿ 부터 시도한다</tspan></text></g><g ><g class="shape"><path d="M1498 511h270v66h-270z" class="stroke-B1 fill-B5 s0"/></g><text x="1633" y="549.5" class="text-bold fill-N1 s2">④ 일반해 = 동차해 + 특수해</text></g><g ><g class="shape"><path d="M2148 521h360v82h-360z" class="stroke-B1 fill-B5 s0"/></g><text x="2328" y="559.5" class="text-bold fill-N1 s2"><tspan x="2328" dy="0">⑤ 경계조건을 넣어 상수를 정한다</tspan><tspan x="2328" dy="18.5">조건 하나가 일차방정식 하나를 준다</tspan></text></g><g ><g class="shape"><path d="M543 110h261v66H543z" class="stroke-B1 fill-B5 s0"/></g><text x="673.5" y="148.5" class="text-bold fill-N1 s2">f(n) = 2f(n−1) 로 놓으면 x = 2</text></g><g ><g class="shape"><path d="M1064 110h180v66h-180z" class="stroke-B1 fill-B5 s0"/></g><text x="1154" y="148.5" class="text-bold fill-N1 s2">동차해 f(n) = c·2ⁿ</text></g><g ><g class="shape"><path d="M1453 86h359v114h-359z" class="stroke-B1 fill-B5 s0"/></g><text x="1632.5" y="124.5" class="text-bold fill-N1 s2"><tspan x="1632.5" dy="0">g(n) = n 이므로 f(n) = an + b 로 시도한다.</tspan><tspan x="1632.5" dy="17.25">an + b = 2(a(n−1) + b) + n 을 정리하면</tspan><tspan x="1632.5" dy="17.25">0 = (a + 1)n + (b − 2a) 이므로 a = −1, b = −2.</tspan><tspan x="1632.5" dy="17.25">특수해는 f(n) = −n − 2</tspan></text></g><g ><g class="shape"><path d="M2211 110h233v66h-233z" class="stroke-B1 fill-B5 s0"/></g><text x="2327.5" y="148.5" class="text-bold fill-N1 s2">일반해 f(n) = c·2ⁿ − n − 2</text></g><g ><g class="shape"><path d="M2893 110h269v82h-269z" class="stroke-B1 fill-B5 s0"/></g><text x="3027.5" y="148.5" class="text-bold fill-N1 s2"><tspan x="3027.5" dy="0">f(1) = 1 이므로 2c − 3 = 1, c = 2.</tspan><tspan x="3027.5" dy="18.5">답은 f(n) = 2·2ⁿ − n − 2</tspan></text></g><marker id="mk-d2-2590162402-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M344.996 521.12C383 523.4 453 524 489 524" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M855.998 532.08C894 533.6 914 534 950 534" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M1354.998 542.08C1393 543.6 1421.9 544 1493.5 544" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M1770.494 554.746C1843.3 560.517 1919.1 562 2143.5 562" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M806 143h253.5" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M1246.5 143H1449" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M1814 143h393" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M2446 143c277.2 0 407 .4 443.003 1.84" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M344.968 484.146C383 477.3 483.8 415.5 644.751 178.808" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M855.975 493.184C894 487.1 948.4 423.5 1123.67 178.752" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M1354.975 503.184C1393 497.1 1440.4 436.3 1587.864 202.882" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M1770.456 515.052c72.844-15.558 174.344-83.552 502.38-337.106" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M2510.5 562c225.6 0 342.5-372.7 378.593-380.64" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M1770.5 542.805c72.8-.641 171.5-42.605 487.955-207.953" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><path fill="none" marker-end="url(#mk-d2-2590162402-3488378134)" d="M3164 151h144" class="connection stroke-B1 s0" mask="url(#d2-2590162402)"/><mask id="d2-2590162402" width="4396" height="819" x="-81" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-81-85h4396v819H-81z"/></mask></svg>