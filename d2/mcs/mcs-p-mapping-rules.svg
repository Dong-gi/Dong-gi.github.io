<svg xmlns="http://www.w3.org/2000/svg" width="1368" height="1001" class="d2-3240999896 d2-svg" viewBox="-89 -89 1368 1001"><rect width="1368" height="1001" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3240999896 .fill-N1{fill:#0a0f25}.d2-3240999896 .fill-N2{fill:#676c7e}.d2-3240999896 .fill-B6{fill:#f7f8fe}.d2-3240999896 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M12 12h330v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="177" y="50.5" class="text-bold fill-N1 s1"><tspan x="177" dy="0">A surj B</tspan><tspan x="177" dy="18.5">A 에서 B 로 가는 전사 함수가 있다</tspan></text></g><g ><g class="shape"><path d="M362 12h370v82H362z" class="stroke-B1 fill-B6 s0"/></g><text x="547" y="50.5" class="text-bold fill-N1 s1"><tspan x="547" dy="0">A inj B</tspan><tspan x="547" dy="18.5">A 에서 B 로 가는 단사인 전관계가 있다</tspan></text></g><g ><g class="shape"><path d="M763 12h283v82H763z" class="stroke-B1 fill-B6 s0"/></g><text x="904.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="904.5" dy="0">A bij B</tspan><tspan x="904.5" dy="18.5">A 와 B 사이에 전단사가 있다</tspan></text></g><g ><g class="shape"><path d="M128 275h97v66h-97z" class="stroke-B1 fill-B6 s0"/></g><text x="176.5" y="313.5" class="text-bold fill-N1 s1">|A| ≥ |B|</text></g><g ><g class="shape"><path d="M498 275h97v66h-97z" class="stroke-B1 fill-B6 s0"/></g><text x="546.5" y="313.5" class="text-bold fill-N1 s1">|A| ≤ |B|</text></g><g ><g class="shape"><path d="M857 275h94v66h-94z" class="stroke-B1 fill-B6 s0"/></g><text x="904" y="313.5" class="text-bold fill-N1 s1">|A| = |B|</text></g><g ><g class="shape"><path d="M630 411h548v82H630z" class="stroke-B1 fill-B6 s0"/></g><text x="904" y="449.5" class="text-bold fill-N1 s1"><tspan x="904" dy="0">부분집합 세기</tspan><tspan x="904" dy="18.5">pow(A) 와 길이 |A| 인 비트열 사이에 전단사가 있으므로 2ⁿ 개</tspan></text></g><g ><g class="shape"><path d="M304 563h486v82H304z" class="stroke-B1 fill-B6 s0"/></g><text x="547" y="601.5" class="text-bold fill-N1 s1"><tspan x="547" dy="0">비둘기집 원리</tspan><tspan x="547" dy="18.5">|A| &gt; |B| 이면 A 에서 B 로 가는 전함수는 단사가 아니다</tspan></text></g><path fill="transparent" stroke="transparent" d="M184 665h822v146H184z" class="shape s0"/><text x="595" y="705" class="fill-N1 s1"><tspan x="595" dy="0">A surj B 와 B inj A 는 같은 말이다.</tspan><tspan x="595" dy="18.5">관계의 화살표를 모두 거꾸로 돌리면 [≤1 out] 이 [≤1 in] 이 되고 [≥1 in] 이 [≥1 out] 이 되기 때문이다</tspan></text><text x="525" y="766" class="fill-N1 s1"><tspan x="525" dy="0">여기까지는 유한집합 이야기다. 무한집합에서는 |A| 를 세는 방법이 없으므로</tspan><tspan x="525" dy="18.5">surj·inj·bij 자체를 크기 비교의 정의로 삼는다. 그것이 10장의 출발점이다</tspan></text><marker id="mk-d2-3240999896-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3240999896-3488378134)" d="M102.25 96v129s0 10 10 10h38.583s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3240999896)"/><text x="102.5" y="219" class="text-italic fill-N2 s1">화살표를 센다</text><path fill="none" marker-end="url(#mk-d2-3240999896-3488378134)" d="M472.25 96v129s0 10 10 10h38.583s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3240999896)"/><text x="472.5" y="219" class="text-italic fill-N2 s1">화살표를 센다</text><path fill="none" marker-end="url(#mk-d2-3240999896-3488378134)" d="M844.5 96v129s0 10 10 10h24.333s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3240999896)"/><path fill="none" marker-end="url(#mk-d2-3240999896-3488378134)" d="M193.166 273v-28s0-10 10-10h38.584s10 0 10-10V98" class="connection stroke-B1 s0" mask="url(#d2-3240999896)"/><text x="252" y="219" class="text-italic fill-N2 s1">거꾸로도 성립한다</text><path fill="none" marker-end="url(#mk-d2-3240999896-3488378134)" d="M563.166 273