<svg xmlns="http://www.w3.org/2000/svg" width="2294" height="762" class="d2-3884702340 d2-svg" viewBox="-101 -91 2294 762"><rect width="2294" height="762" x="-101" y="-91" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3884702340 .fill-N1{fill:#0a0f25}.d2-3884702340 .fill-N2{fill:#676c7e}.d2-3884702340 .fill-B6{fill:#f7f8fe}.d2-3884702340 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M222 10h330v82H222z" class="stroke-B1 fill-B6 s0"/></g><text x="387" y="48.5" class="text-bold fill-N1 s1"><tspan x="387" dy="0">A surj B</tspan><tspan x="387" dy="18.5">A 에서 B 로 가는 전사 함수가 있다</tspan></text></g><g ><g class="shape"><path d="M202 152h370v82H202z" class="stroke-B1 fill-B6 s0"/></g><text x="387" y="190.5" class="text-bold fill-N1 s1"><tspan x="387" dy="0">A inj B</tspan><tspan x="387" dy="18.5">A 에서 B 로 가는 단사인 전관계가 있다</tspan></text></g><g ><g class="shape"><path d="M246 294h283v82H246z" class="stroke-B1 fill-B6 s0"/></g><text x="387.5" y="332.5" class="text-bold fill-N1 s1"><tspan x="387.5" dy="0">A bij B</tspan><tspan x="387.5" dy="18.5">A 와 B 사이에 전단사가 있다</tspan></text></g><g ><g class="shape"><path d="M1130 18h97v66h-97z" class="stroke-B1 fill-B6 s0"/></g><text x="1178.5" y="56.5" class="text-bold fill-N1 s1">|A| ≥ |B|</text></g><g ><g class="shape"><path d="M1130 160h97v66h-97z" class="stroke-B1 fill-B6 s0"/></g><text x="1178.5" y="198.5" class="text-bold fill-N1 s1">|A| ≤ |B|</text></g><g ><g class="shape"><path d="M1132 302h94v66h-94z" class="stroke-B1 fill-B6 s0"/></g><text x="1179" y="340.5" class="text-bold fill-N1 s1">|A| = |B|</text></g><g ><g class="shape"><path d="M1544 294h548v82h-548z" class="stroke-B1 fill-B6 s0"/></g><text x="1818" y="332.5" class="text-bold fill-N1 s1"><tspan x="1818" dy="0">부분집합 세기</tspan><tspan x="1818" dy="18.5">pow(A) 와 길이 |A| 인 비트열 사이에 전단사가 있으므로 2ⁿ 개</tspan></text></g><g ><g class="shape"><path d="M1575 152h486v82h-486z" class="stroke-B1 fill-B6 s0"/></g><text x="1818" y="190.5" class="text-bold fill-N1 s1"><tspan x="1818" dy="0">비둘기집 원리</tspan><tspan x="1818" dy="18.5">|A| &gt; |B| 이면 A 에서 B 로 가는 전함수는 단사가 아니다</tspan></text></g><text x="387" y="452" class="fill-N1 s1"><tspan x="387" dy="0">A surj B 와 B inj A 는 같은 말이다.</tspan><tspan x="387" dy="18.5">관계의 화살표를 모두 거꾸로 돌리면 [≤1 out] 이 [≤1 in] 이 되고 [≥1 in] 이 [≥1 out] 이 되기 때문이다</tspan></text><text x="387" y="549" class="fill-N1 s1"><tspan x="387" dy="0">여기까지는 유한집합 이야기다. 무한집합에서는 |A| 를 세는 방법이 없으므로</tspan><tspan x="387" dy="18.5">surj·inj·bij 자체를 크기 비교의 정의로 삼는다. 그것이 10장의 출발점이다</tspan></text><marker id="mk-d2-3884702340-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3884702340-3488378134)" d="M553.997 42.39C872 24.9 987.6 25.3 1126.036 43.966" class="connection stroke-B1 s0" mask="url(#d2-3884702340)"/><text x="841.5" y="32" class="text-italic fill-N2 s1">화살표를 센다</text><path fill="none" marker-end="url(#mk-d2-3884702340-3488378134)" d="M573.995 179.358C876 157.9 987.6 158.9 1126.063 183.792" class="connection stroke-B1 s0" mask="url(#d2-3884702340)"/><text x="851.5" y="165" class="text-italic fill-N2 s1">화살표를 센다</text><path fill="none" marker-end="url(#mk-d2-3884702340-3488378134)" d="M531.492 322.11c336.008-30.252 456.408-29.817 596.105 1.484" class="connection stroke-B1 s0" mask="url(#d2-3884702340)"/><path fill="none" marker-end="url(#mk-d2-3884702340-3488378134)" d="M1128.032 59.854C987.6 85.1 872 85.7 555.99 62.789" class="connection stroke-B1 s0" mask="url(#d2-3884702340)"/><text x="842" y="89" class="text-italic fill-N2 s1">거꾸로도 성립한다</text><path fill="none" marker-end="url(#mk-d2-3884702340-3488378134)" d="M1128.049 204.189C987.6 235.75 876 236.95 575.984 210.106" class="connection stroke-B1 s0" mask="url(#d2-3884702340)"/><text x="852" y="240" class="text-italic fill-N2 s1">거꾸로도 성립한다</text><path fill="none" marker-end="url(#mk-d2-3884702340-3488378134)" d="M1129.508 339.38c-141.608 12.66-262.108 12.87-596.51 1.012" class="connection stroke-B1 s0" mask="url(#d2-3884702340)"/><text x="830" y="356" class="text-italic fill-N2 s1">거꾸로도 성립한다</text><path fill="none" marker-end="url(#mk-d2-3884702340-3488378134)" d="M1228.5 335h312" class="connection stroke-B1 s0" mask="url(#d2-3884702340)"/><path fill="none" marker-end="url(#mk-d2-3884702340-3488378134)" d="M1228.5 193h343" class="connection stroke-B1 s0" mask="url(#d2-3884702340)"/><text x="1401.5" y="199" class="text-italic fill-N2 s1">대우를 취한다</text><mask id="d2-3884702340" width="2294" height="762" x="-101" y="-91" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-91h2294v762H-101z"/><path d="M780 16h123v21H780zM790 149h123v21H790zM761 73h162v21H761zM771 224h162v21H771zM749 340h162v21H749zM1340 183h123v21h-123z"/></mask></svg>