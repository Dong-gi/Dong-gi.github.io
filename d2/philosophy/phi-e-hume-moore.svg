<svg xmlns="http://www.w3.org/2000/svg" width="1246" height="895" class="d2-1984453825 d2-svg" viewBox="-89 -89 1246 895"><rect width="1246" height="895" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1984453825 .fill-N1{fill:#0a0f25}.d2-1984453825 .fill-N2{fill:#676c7e}.d2-1984453825 .fill-B6{fill:#f7f8fe}.d2-1984453825 .stroke-B1,.d2-1984453825 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M142 12h319v114H142z" class="stroke-B1 fill-B6 s0"/></g><text x="301.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="301.5" dy="0">흄의 논점 — 추론의 형식</tspan><tspan x="301.5" dy="17.25">전제가 모두 ‘…이다’ 뿐인데</tspan><tspan x="301.5" dy="17.25">결론에 ‘…해야 한다’ 가 나오면,</tspan><tspan x="301.5" dy="17.25">그 건너감을 따로 설명해야 한다</tspan></text></g><g ><g class="shape"><path d="M12 206h340v146H12z" class="stroke-B1 fill-B6 s0"/></g><text x="182" y="244.5" class="text-bold fill-N1 s1"><tspan x="182" dy="0">겨누는 것 — 논증의 짜임</tspan><tspan x="182" dy="16.833">서술 전제만으로</tspan><tspan x="182" dy="16.833">규범 결론이 연역되지 않는다는</tspan><tspan x="182" dy="16.833">주장이다.</tspan><tspan x="182" dy="16.833">어떤 자연적 성질이 좋음인가 하는</tspan><tspan x="182" dy="16.833">물음은 건드리지 않는다</tspan></text></g><g ><g class="shape"><path d="M262 422h319v194H262z" class="stroke-B2 fill-B6 s2"/></g><text x="421.5" y="460.5" class="text-bold fill-N1 s1"><tspan x="421.5" dy="0">반론 두 갈래</tspan><tspan x="421.5" dy="16.556">① 논리적 잔꾀 —</tspan><tspan x="421.5" dy="16.556">서술 전제에서 선언 도입만으로</tspan><tspan x="421.5" dy="16.556">규범 문장을 만들어 낼 수 있다</tspan><tspan x="421.5" dy="16.556">② 제도적 사실 —</tspan><tspan x="421.5" dy="16.556">약속을 했다는 사실에서</tspan><tspan x="421.5" dy="16.556">지켜야 한다가 따라 나온다는</tspan><tspan x="421.5" dy="16.556">설의 논증</tspan><tspan x="421.5" dy="16.556">어느 쪽도 논쟁을 끝내지 못했다</tspan></text></g><g ><g class="shape"><path d="M566 12h374v114H566z" class="stroke-B1 fill-B6 s0"/></g><text x="753" y="50.5" class="text-bold fill-N1 s1"><tspan x="753" dy="0">무어의 논점 — 개념 분석의 실패</tspan><tspan x="753" dy="17.25">좋음을 어떤 자연적 성질로 정의해도</tspan><tspan x="753" dy="17.25">‘그것은 그 성질을 갖는다.</tspan><tspan x="753" dy="17.25">그런데 좋은가’ 라는 물음이 열려 있다</tspan></text></g><g ><g class="shape"><path d="M493 206h301v130H493z" class="stroke-B1 fill-B6 s0"/></g><text x="643.5" y="244.5" class="text-bold fill-N1 s1"><tspan x="643.5" dy="0">겨누는 것 — 정의</tspan><tspan x="643.5" dy="17">좋음이 자연적 성질과</tspan><tspan x="643.5" dy="17">같은 것이 아니라는 주장이다.</tspan><tspan x="643.5" dy="17">추론의 형식에 대해서는</tspan><tspan x="643.5" dy="17">아무 말도 하지 않는다</tspan></text></g><g ><g class="shape"><path d="M671 422h385v210H671z" class="stroke-B2 fill-B6 s2"/></g><text x="863.5" y="460.5" class="text-bold fill-N1 s1"><tspan x="863.5" dy="0">오늘의 표준 평가 —</tspan><tspan x="863.5" dy="16.5">결정적이지 않다</tspan><tspan x="863.5" dy="16.5">① 분석의 역설 —</tspan><tspan x="863.5" dy="16.5">옳은 분석이 말하는 사람에게</tspan><tspan x="863.5" dy="16.5">곧바로 보여야 한다는 보장이 없다</tspan><tspan x="863.5" dy="16.5">② 후험적 필연 —</tspan><tspan x="863.5" dy="16.5">참인 동일성인데도</tspan><tspan x="863.5" dy="16.5">물음이 열려 보일 수 있다 (11장)</tspan><tspan x="863.5" dy="16.5">그렇다고 자연주의가 이긴 것은 아니다.</tspan><tspan x="863.5" dy="16.5">물음이 왜 열려 보이는지는 남는다</tspan></text></g><text x="534" y="668" class="fill-N1 s1"><tspan x="534" dy="0">자연주의적 오류라는 이름은 무어의 것이고 사실-당위 간극은 흄의 것이다.</tspan><tspan x="534" dy="17.667">두 말을 바꿔 쓰면 논쟁이 헛돈다.</tspan><tspan x="534" dy="17.667">흄의 논점을 인정하면서 자연주의적 실재론자일 수 있다</tspan></text><marker id="mk-d2-1984453825-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1984453825-3488378134)" d="M182 128v74" class="connection stroke-B1 s0" mask="url(#d2-1984453825)"/><path fill="none" marker-end="url(#mk-d2-1984453825-3488378134)" d="M422 128v290" class="connection stroke-B1 s0" mask="url(#d2-1984453825)"/><text x="422" y="280" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-1984453825-3488378134)" d="M643.5 128v74" class="connection stroke-B1 s0" mask="url(#d2-1984453825)"/><path fill="none" marker-end="url(#mk-d2-1984453825-3488378134)" d="M864 128v290" class="connection stroke-B1 s0" mask="url(#d2-1984453825)"/><text x="864" y="280" class="text-italic fill-N2 s1">여기를 친다</text><mask id="d2-1984453825" width="1246" height="895" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1246v895H-89z"/><path d="M370 264h104v21H370zM812 264h104v21H812z"/></mask></svg>