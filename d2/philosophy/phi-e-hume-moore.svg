<svg xmlns="http://www.w3.org/2000/svg" width="1922" height="812" class="d2-336419342 d2-svg" viewBox="-101 -101 1922 812"><rect width="1922" height="812" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-336419342 .fill-N1{fill:#0a0f25}.d2-336419342 .fill-N2{fill:#676c7e}.d2-336419342 .fill-B6{fill:#f7f8fe}.d2-336419342 .stroke-B1,.d2-336419342 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M92 83h566v98H92z" class="stroke-B1 fill-B6 s0"/></g><text x="375" y="121.5" class="text-bold fill-N1 s1"><tspan x="375" dy="0">흄의 논점 — 추론의 형식</tspan><tspan x="375" dy="17.667">전제가 모두 ‘…이다’ 뿐인데 결론에 ‘…해야 한다’ 가 나오면,</tspan><tspan x="375" dy="17.667">그 건너감을 따로 설명해야 한다</tspan></text></g><g ><g class="shape"><path d="M1078 0h553v98h-553z" class="stroke-B1 fill-B6 s0"/></g><text x="1354.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1354.5" dy="0">겨누는 것 — 논증의 짜임</tspan><tspan x="1354.5" dy="17.667">서술 전제만으로 규범 결론이 연역되지 않는다는 주장이다.</tspan><tspan x="1354.5" dy="17.667">어떤 자연적 성질이 좋음인가 하는 물음은 건드리지 않는다</tspan></text></g><g ><g class="shape"><path d="M989 158h731v114H989z" class="stroke-B2 fill-B6 s2"/></g><text x="1354.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="1354.5" dy="0">반론 두 갈래</tspan><tspan x="1354.5" dy="17.25">① 논리적 잔꾀 — 서술 전제에서 선언 도입만으로 규범 문장을 만들어 낼 수 있다</tspan><tspan x="1354.5" dy="17.25">② 제도적 사실 — 약속을 했다는 사실에서 지켜야 한다가 따라 나온다는 설의 논증</tspan><tspan x="1354.5" dy="17.25">어느 쪽도 논쟁을 끝내지 못했다</tspan></text></g><g ><g class="shape"><path d="M72 415h605v98H72z" class="stroke-B1 fill-B6 s0"/></g><text x="374.5" y="453.5" class="text-bold fill-N1 s1"><tspan x="374.5" dy="0">무어의 논점 — 개념 분석의 실패</tspan><tspan x="374.5" dy="17.667">좋음을 어떤 자연적 성질로 정의해도</tspan><tspan x="374.5" dy="17.667">‘그것은 그 성질을 갖는다. 그런데 좋은가’ 라는 물음이 열려 있다</tspan></text></g><g ><g class="shape"><path d="M1108 332h493v98h-493z" class="stroke-B1 fill-B6 s0"/></g><text x="1354.5" y="370.5" class="text-bold fill-N1 s1"><tspan x="1354.5" dy="0">겨누는 것 — 정의</tspan><tspan x="1354.5" dy="17.667">좋음이 자연적 성질과 같은 것이 아니라는 주장이다.</tspan><tspan x="1354.5" dy="17.667">추론의 형식에 대해서는 아무 말도 하지 않는다</tspan></text></g><g ><g class="shape"><path d="M989 490h731v114H989z" class="stroke-B2 fill-B6 s2"/></g><text x="1354.5" y="528.5" class="text-bold fill-N1 s1"><tspan x="1354.5" dy="0">오늘의 표준 평가 — 결정적이지 않다</tspan><tspan x="1354.5" dy="17.25">① 분석의 역설 — 옳은 분석이 말하는 사람에게 곧바로 보여야 한다는 보장이 없다</tspan><tspan x="1354.5" dy="17.25">② 후험적 필연 — 참인 동일성인데도 물음이 열려 보일 수 있다 (11장)</tspan><tspan x="1354.5" dy="17.25">그렇다고 자연주의가 이긴 것은 아니다. 물음이 왜 열려 보이는지는 남는다</tspan></text></g><text x="374.5" y="589" class="fill-N1 s1"><tspan x="374.5" dy="0">자연주의적 오류라는 이름은 무어의 것이고 사실-당위 간극은 흄의 것이다.</tspan><tspan x="374.5" dy="18.5">두 말을 바꿔 쓰면 논쟁이 헛돈다. 흄의 논점을 인정하면서 자연주의적 실재론자일 수 있다</tspan></text><marker id="mk-d2-336419342-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-336419342-3488378134)" d="M660.472 84.166C826.9 56.1 910.8 49 1074 49" class="connection stroke-B1 s0" mask="url(#d2-336419342)"/><path fill="none" marker-end="url(#mk-d2-336419342-3488378134)" d="M660.472 179.833C826.9 207.9 893 215 985 215" class="connection stroke-B1 s0" mask="url(#d2-336419342)"/><text x="823" y="213" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-336419342-3488378134)" d="M667.973 414.67C828.4 387.8 916.8 381 1104 381" class="connection stroke-B1 s0" mask="url(#d2-336419342)"/><path fill="none" marker-end="url(#mk-d2-336419342-3488378134)" d="M667.973 513.33C828.4 540.2 893 547 985 547" class="connection stroke-B1 s0" mask="url(#d2-336419342)"/><text x="827" y="545" class="text-italic fill-N2 s1">여기를 친다</text><mask id="d2-336419342" width="1922" height="812" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1922v812H-101z"/><path d="M771 197h104v21H771zM775 529h104v21H775z"/></mask></svg>