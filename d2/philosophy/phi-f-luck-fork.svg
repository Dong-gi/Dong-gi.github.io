<svg xmlns="http://www.w3.org/2000/svg" width="1085" height="1297" class="d2-613656745 d2-svg" viewBox="-101 -101 1085 1297"><rect width="1085" height="1297" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-613656745 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-613656745 .fill-N1{fill:#0a0f25}.d2-613656745 .fill-B6{fill:#f7f8fe}.d2-613656745 .stroke-B1,.d2-613656745 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="431" cy="51.5" class="shape stroke-B1 fill-B6 s0" rx="154" ry="51.5"/></g><text x="431" y="57" class="text-bold fill-N1 s1">지금 내가 한 이 행위</text></g><g ><g class="shape"><path d="M24 203h343v66H24z" class="stroke-B1 fill-B6 s0"/></g><text x="195.5" y="241.5" class="text-bold fill-N1 s1">선행 사건들이 이 행위를 못 박았다</text></g><g ><g class="shape"><path d="M474 203h386v66H474z" class="stroke-B1 fill-B6 s0"/></g><text x="667" y="241.5" class="text-bold fill-N1 s1">선행 사건들이 이 행위를 못 박지 않았다</text></g><g ><g class="shape"><path d="M0 377h391v82H0z" class="stroke-B2 fill-B6 s2"/></g><text x="195.5" y="415.5" class="text-bold fill-N1 s1"><tspan x="195.5" dy="0">그 선행 사건들은 내가 정한 것이 아니다.</tspan><tspan x="195.5" dy="18.5">결과 논증이 여기를 파고든다</tspan></text></g><g ><g class="shape"><path d="M451 369h432v98H451z" class="stroke-B2 fill-B6 s2"/></g><text x="667" y="407.5" class="text-bold fill-N1 s1"><tspan x="667" dy="0">같은 조건에서 다른 일이 일어날 수 있었다.</tspan><tspan x="667" dy="17.667">그러면 어느 쪽이 일어날지를 정한 것이 없다.</tspan><tspan x="667" dy="17.667">무작위는 통제가 아니다</tspan></text></g><g ><g class="shape"><ellipse cx="431" cy="638" class="shape stroke-B1 fill-B6 s0" rx="213" ry="71"/></g><text x="431" y="627.5" class="text-bold fill-N1 s1"><tspan x="431" dy="0">어느 쪽이든 이 행위가 내 통제</tspan><tspan x="431" dy="17.667">아래 있었다고 말하기 어렵다</tspan><tspan x="431" dy="17.667">이것이 운 논증이다</tspan></text></g><text x="431.5" y="825" class="fill-N1 s1"><tspan x="431.5" dy="0">자유지상론의 응답 — 오른쪽 갈래에</tspan><tspan x="431.5" dy="16.714">사건이 아닌 것을 하나 더 넣는다.</tspan><tspan x="431.5" dy="16.714">행위자 인과.</tspan><tspan x="431.5" dy="16.714">갈림을 정한 것은 앞선 사건이 아니라 행위자 자신이라는 것이다.</tspan><tspan x="431.5" dy="16.714">반론 — 그 말이 무엇을 뜻하는지가 분명하지 않다.</tspan><tspan x="431.5" dy="16.714">반론에 대한 답 — 인과를 사건 사이의 관계로만</tspan><tspan x="431.5" dy="16.714">보는 것이 오히려 특별한 가정이다</tspan></text><text x="431.5" y="1042" class="fill-N1 s1"><tspan x="431.5" dy="0">양자역학을 근거로 들지 않는 이유가 이 그림에 있다.</tspan><tspan x="431.5" dy="17.25">미시 세계가 비결정적이라 해도 그것은 오른쪽 갈래를 지지할 뿐이고,</tspan><tspan x="431.5" dy="17.25">오른쪽 갈래는 그 자체로 자유를 주지 않는다.</tspan><tspan x="431.5" dy="17.25">물리학은 첫째 물음에 관계하지 둘째 물음에 관계하지 않는다</tspan></text><marker id="mk-d2-613656745-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-613656745-3488378134)" d="M335.163 92.792C223.8 140.8 195.5 163 195.5 199" class="connection stroke-B1 s0" mask="url(#d2-613656745)"/><path fill="none" marker-end="url(#mk-d2-613656745-3488378134)" d="M527.836 92.794C638.8 140.8 667 163 667 199" class="connection stroke-B1 s0" mask="url(#d2-613656745)"/><path fill="none" marker-end="url(#mk-d2-613656745-3488378134)" d="M195.5 271v102" class="connection stroke-B1 s0" mask="url(#d2-613656745)"/><path fill="none" marker-end="url(#mk-d2-613656745-3488378134)" d="M667 271v94" class="connection stroke-B1 s0" mask="url(#d2-613656745)"/><path fill="none" marker-end="url(#mk-d2-613656745-3488378134)" d="M195.5 461c0 44.4 23.9 68.2 115.937 115.181" class="connection stroke-B1 s0" mask="url(#d2-613656745)"/><path fill="none" marker-end="url(#mk-d2-613656745-3488378134)" d="M667 469c0 38-23.8 60.4-115.453 108.152" class="connection stroke-B1 s0" mask="url(#d2-613656745)"/><mask id="d2-613656745" width="1085" height="1297" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H984v1297H-101z"/></mask></svg>