<svg xmlns="http://www.w3.org/2000/svg" width="3001" height="627" class="d2-772487663 d2-svg" viewBox="-101 -101 3001 627"><rect width="3001" height="627" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-772487663 .fill-N1{fill:#0a0f25}.d2-772487663 .fill-B6{fill:#f7f8fe}.d2-772487663 .stroke-B1,.d2-772487663 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="446" cy="131.5" class="shape stroke-B1 fill-B6 s0" rx="154" ry="51.5"/></g><text x="446" y="137" class="text-bold fill-N1 s1">지금 내가 한 이 행위</text></g><g ><g class="shape"><path d="M1014 24h343v66h-343z" class="stroke-B1 fill-B6 s0"/></g><text x="1185.5" y="62.5" class="text-bold fill-N1 s1">선행 사건들이 이 행위를 못 박았다</text></g><g ><g class="shape"><path d="M992 174h386v66H992z" class="stroke-B1 fill-B6 s0"/></g><text x="1185" y="212.5" class="text-bold fill-N1 s1">선행 사건들이 이 행위를 못 박지 않았다</text></g><g ><g class="shape"><path d="M1499 16h391v82h-391z" class="stroke-B2 fill-B6 s2"/></g><text x="1694.5" y="54.5" class="text-bold fill-N1 s1"><tspan x="1694.5" dy="0">그 선행 사건들은 내가 정한 것이 아니다.</tspan><tspan x="1694.5" dy="18.5">결과 논증이 여기를 파고든다</tspan></text></g><g ><g class="shape"><path d="M1478 158h432v98h-432z" class="stroke-B2 fill-B6 s2"/></g><text x="1694" y="196.5" class="text-bold fill-N1 s1"><tspan x="1694" dy="0">같은 조건에서 다른 일이 일어날 수 있었다.</tspan><tspan x="1694" dy="17.667">그러면 어느 쪽이 일어날지를 정한 것이 없다.</tspan><tspan x="1694" dy="17.667">무작위는 통제가 아니다</tspan></text></g><g ><g class="shape"><ellipse cx="2404.5" cy="131.5" class="shape stroke-B1 fill-B6 s0" rx="394.5" ry="131.5"/></g><text x="2404.5" y="129" class="text-bold fill-N1 s1"><tspan x="2404.5" dy="0">어느 쪽이든 이 행위가 내 통제 아래 있었다고 말하기 어렵다</tspan><tspan x="2404.5" dy="18.5">이것이 운 논증이다</tspan></text></g><text x="446.5" y="259" class="fill-N1 s1"><tspan x="446.5" dy="0">자유지상론의 응답 — 오른쪽 갈래에 사건이 아닌 것을 하나 더 넣는다.</tspan><tspan x="446.5" dy="17.25">행위자 인과. 갈림을 정한 것은 앞선 사건이 아니라 행위자 자신이라는 것이다.</tspan><tspan x="446.5" dy="17.25">반론 — 그 말이 무엇을 뜻하는지가 분명하지 않다. 반론에 대한 답 — 인과를 사건 사이의 관계로만</tspan><tspan x="446.5" dy="17.25">보는 것이 오히려 특별한 가정이다</tspan></text><text x="446" y="388" class="fill-N1 s1"><tspan x="446" dy="0">양자역학을 근거로 들지 않는 이유가 이 그림에 있다.</tspan><tspan x="446" dy="17.667">미시 세계가 비결정적이라 해도 그것은 오른쪽 갈래를 지지할 뿐이고,</tspan><tspan x="446" dy="17.667">오른쪽 갈래는 그 자체로 자유를 주지 않는다. 물리학은 첫째 물음에 관계하지 둘째 물음에 관계하지 않는다</tspan></text><marker id="mk-d2-772487663-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-772487663-3488378134)" d="M588.977 110.697C871 67.4 956.3 56.5 1009.5 56.5" class="connection stroke-B1 s0" mask="url(#d2-772487663)"/><path fill="none" marker-end="url(#mk-d2-772487663-3488378134)" d="M588.977 152.303C871 195.6 952 206.5 988 206.5" class="connection stroke-B1 s0" mask="url(#d2-772487663)"/><path fill="none" marker-end="url(#mk-d2-772487663-3488378134)" d="M1359.5 56.5h135" class="connection stroke-B1 s0" mask="url(#d2-772487663)"/><path fill="none" marker-end="url(#mk-d2-772487663-3488378134)" d="M1380 206.5h94" class="connection stroke-B1 s0" mask="url(#d2-772487663)"/><path fill="none" marker-end="url(#mk-d2-772487663-3488378134)" d="M1892.5 56.5c53.6 0 86.3 2.9 157.547 13.89" class="connection stroke-B1 s0" mask="url(#d2-772487663)"/><path fill="none" marker-end="url(#mk-d2-772487663-3488378134)" d="M1912 206.5c38 0 66.8-2.9 138.047-13.89" class="connection stroke-B1 s0" mask="url(#d2-772487663)"/><mask id="d2-772487663" width="3001" height="627" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3001v627H-101z"/></mask></svg>