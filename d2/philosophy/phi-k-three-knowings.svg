<svg xmlns="http://www.w3.org/2000/svg" width="1634" height="716" class="d2-3665905875 d2-svg" viewBox="-101 -101 1634 716"><rect width="1634" height="716" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3665905875 .fill-N1{fill:#0a0f25}.d2-3665905875 .fill-N2{fill:#676c7e}.d2-3665905875 .fill-B6{fill:#f7f8fe}.d2-3665905875 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="539" cy="60.5" class="shape stroke-B1 fill-B6 s0" rx="182" ry="60.5"/></g><text x="539" y="66" class="text-bold fill-N1 s1">‘안다’ 라고 말하는 자리</text></g><g ><g class="shape"><path d="M0 242h235v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="117.5" y="280.5" class="text-bold fill-N1 s1"><tspan x="117.5" dy="0">능력적 앎</tspan><tspan x="117.5" dy="17.667">자전거 타는 법을 안다</tspan><tspan x="117.5" dy="17.667">헤엄칠 줄 안다</tspan></text></g><g ><g class="shape"><path d="M295 242h171v98H295z" class="stroke-B1 fill-B6 s0"/></g><text x="380.5" y="280.5" class="text-bold fill-N1 s1"><tspan x="380.5" dy="0">친숙에 의한 앎</tspan><tspan x="380.5" dy="17.667">그 사람을 안다</tspan><tspan x="380.5" dy="17.667">서울을 안다</tspan></text></g><g ><g class="shape"><path d="M526 242h342v98H526z" class="stroke-B1 fill-B6 s0"/></g><text x="697" y="280.5" class="text-bold fill-N1 s1"><tspan x="697" dy="0">명제적 앎</tspan><tspan x="697" dy="17.667">물이 100 ℃ 에서 끓는다는 것을 안다</tspan><tspan x="697" dy="17.667">문이 잠겼다는 것을 안다</tspan></text></g><text x="1180" y="289" class="fill-N1 s1"><tspan x="1180" dy="0">가르는 시험 — ‘…라는 것을 안다’ 로 바꿔 쓸 수 있는가.</tspan><tspan x="1180" dy="18.5">‘자전거를 탈 줄 안다는 것을 안다’ 는 다른 말이 되어 버린다</tspan></text><text x="697.5" y="477" class="fill-N1 s1"><tspan x="697.5" dy="0">명제적 앎의 대상만 참이거나 거짓이다.</tspan><tspan x="697.5" dy="17.667">참·거짓이 있어야 ‘참인 것을 아는가’ 를 물을 수 있고,</tspan><tspan x="697.5" dy="17.667">‘그렇게 믿을 근거가 있는가’ 도 물을 수 있다</tspan></text><text x="1029" y="58" class="fill-N1 s1"><tspan x="1029" dy="0">다른 둘이 명제적 앎으로 환원되는가는 따로 다투는 문제다.</tspan><tspan x="1029" dy="18.5">이 문서는 그 물음에 답하지 않고 명제적 앎만 다룬다</tspan></text><marker id="mk-d2-3665905875-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3665905875-3488378134)" d="M399.078 100.553C174.2 165.2 117.5 193.7 117.5 238.5" class="connection stroke-B1 s0" mask="url(#d2-3665905875)"/><text x="233.5" y="154" class="text-italic fill-N2 s1">무엇을 할 줄 안다</text><path fill="none" marker-end="url(#mk-d2-3665905875-3488378134)" d="M464.412 117.216C397.6 168.4 380.5 193.7 380.5 238.5" class="connection stroke-B1 s0" mask="url(#d2-3665905875)"/><text x="400.5" y="172" class="text-italic fill-N2 s1">무엇과 겪어 보아 안다</text><path fill="none" marker-end="url(#mk-d2-3665905875-3488378134)" d="M613.584 117.22C680 168.4 697 193.7 697 238.5" class="connection stroke-B1 s0" mask="url(#d2-3665905875)"/><text x="677.5" y="172" class="text-italic fill-N2 s1">무엇이 그러하다는 것을 안다</text><path fill="none" marker-end="url(#mk-d2-3665905875-3488378134)" d="M699.965 90.373C1083.6 163.2 1180 199.7 1180 268.5" class="connection stroke-B1 s0" mask="url(#d2-3665905875)"/><text x="977" y="149" class="text-italic fill-N2 s1">구별하는 법</text><path fill="none" marker-end="url(#mk-d2-3665905875-3488378134)" d="M697 341.5v116" class="connection stroke-B1 s0" mask="url(#d2-3665905875)"/><text x="697" y="406" class="text-italic fill-N2 s1">이 문서가 다루는 것</text><mask id="d2-3665905875" width="1634" height="716" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1634v716H-101z"/><path d="M159 138h149v21H159z"/><path d="M307 156h187v21H307zM555 156h245v21H555zM925 133h104v21H925zM613 390h168v21H613z"/></mask></svg>