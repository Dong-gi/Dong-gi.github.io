<svg xmlns="http://www.w3.org/2000/svg" width="1175" height="853" class="d2-1435802966 d2-svg" viewBox="-100 -101 1175 853"><rect width="1175" height="853" x="-100" y="-101" rx="0" style="fill:#fff"/><style>.d2-1435802966 .text-bold{font-weight:700}.d2-1435802966 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1435802966 .fill-N1{fill:#0a0f25}.d2-1435802966 .fill-N2{fill:#676c7e}.d2-1435802966 .fill-B6{fill:#f7f8fe}.d2-1435802966 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="357" cy="60.5" class="shape stroke-B1 fill-B6 s0" rx="182" ry="60.5"/></g><text x="357" y="66" class="text-bold fill-N1 s1">‘안다’ 라고 말하는 자리</text></g><g ><g class="shape"><path d="M371 266h235v98H371z" class="stroke-B1 fill-B6 s0"/></g><text x="488.5" y="304.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">능력적 앎</tspan><tspan x="488.5" dy="17.667">자전거 타는 법을 안다</tspan><tspan x="488.5" dy="17.667">헤엄칠 줄 안다</tspan></text></g><g ><g class="shape"><path d="M140 266h171v98H140z" class="stroke-B1 fill-B6 s0"/></g><text x="225.5" y="304.5" class="text-bold fill-N1 s1"><tspan x="225.5" dy="0">친숙에 의한 앎</tspan><tspan x="225.5" dy="17.667">그 사람을 안다</tspan><tspan x="225.5" dy="17.667">서울을 안다</tspan></text></g><g ><g class="shape"><path d="M697 258h255v114H697z" class="stroke-B1 fill-B6 s0"/></g><text x="824.5" y="296.5" class="text-bold fill-N1 s1"><tspan x="824.5" dy="0">명제적 앎</tspan><tspan x="824.5" dy="17.25">물이 100 ℃ 에서</tspan><tspan x="824.5" dy="17.25">끓는다는 것을 안다</tspan><tspan x="824.5" dy="17.25">문이 잠겼다는 것을 안다</tspan></text></g><text x="269" y="525" class="fill-N1 s1"><tspan x="269" dy="0">가르는 시험 — ‘…라는 것을 안다’ 로</tspan><tspan x="269" dy="17.25">바꿔 쓸 수 있는가.</tspan><tspan x="269" dy="17.25">‘자전거를 탈 줄 안다는 것을 안다’ 는</tspan><tspan x="269" dy="17.25">다른 말이 되어 버린다</tspan></text><text x="824.5" y="509" class="fill-N1 s1"><tspan x="824.5" dy="0">명제적 앎의 대상만</tspan><tspan x="824.5" dy="16.833">참이거나 거짓이다.</tspan><tspan x="824.5" dy="16.833">참·거짓이 있어야</tspan><tspan x="824.5" dy="16.833">‘참인 것을 아는가’ 를 물을 수 있고,</tspan><tspan x="824.5" dy="16.833">‘그렇게 믿을 근거가 있는가’ 도</tspan><tspan x="824.5" dy="16.833">물을 수 있다</tspan></text><text x="512" y="630" class="fill-N1 s1"><tspan x="512" dy="0">다른 둘이 명제적 앎으로 환원되는가는 따로 다투는 문제다.</tspan><tspan x="512" dy="18.5">이 문서는 그 물음에 답하지 않고 명제적 앎만 다룬다</tspan></text><marker id="mk-d2-1435802966-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1435802966-3488378134)" d="M417.424 119.404C474 175.2 488.5 204.9 488.5 262.5" class="connection stroke-B1 s0" mask="url(#d2-1435802966)"/><text x="477" y="179" class="text-italic fill-N2 s1"><tspan x="477" dy="0">무엇을</tspan><tspan x="477" dy="18.5">할 줄 안다</tspan></text><path fill="none" marker-end="url(#mk-d2-1435802966-3488378134)" d="M296.576 119.404C240 175.2 225.5 204.9 225.5 262.5" class="connection stroke-B1 s0" mask="url(#d2-1435802966)"/><text x="237" y="179" class="text-italic fill-N2 s1"><tspan x="237" dy="0">무엇과</tspan><tspan x="237" dy="18.5">겪어 보아 안다</tspan></text><path fill="none" marker-end="url(#mk-d2-1435802966-3488378134)" d="M499.927 99.535C759 171.4 824.25 203.3 824.25 254.5" class="connection stroke-B1 s0" mask="url(#d2-1435802966)"/><text x="690" y="150" class="text-italic fill-N2 s1"><tspan x="690" dy="0">무엇이 그러하다는</tspan><tspan x="690" dy="18.5">것을 안다</tspan></text><path fill="none" marker-end="url(#mk-d2-1435802966-3488378134)" d="M241.158 108.778C88.6 173.2 50 214.6 50 252.25S80 447.9 196.441 507.673" class="connection stroke-B1 s0" mask="url(#d2-1435802966)"/><text x="50" y="294" class="text-italic fill-N2 s1">구별하는 법</text><path fill="none" marker-end="url(#mk-d2-1435802966-3488378134)" d="M824.25 373.5v116" class="connection stroke-B1 s0" mask="url(#d2-1435802966)"/><text x="824" y="438" class="text-italic fill-N2 s1">이 문서가 다루는 것</text><mask id="d2-1435802966" width="1175" height="853" x="-100" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-100-101h1175v853H-100z"/><path d="M433 163h88v37h-88zM174 163h126v37H174zM609 134h162v37H609zM-2 278h104v21H-2zM740 422h168v21H740z"/></mask></svg>