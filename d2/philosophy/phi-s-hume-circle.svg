<svg xmlns="http://www.w3.org/2000/svg" width="1556" height="674" class="d2-287484835 d2-svg" viewBox="-101 -101 1556 674"><rect width="1556" height="674" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-287484835 .fill-N1{fill:#0a0f25}.d2-287484835 .fill-N2{fill:#676c7e}.d2-287484835 .fill-B6{fill:#f7f8fe}.d2-287484835 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M290 0h255v66H290z" class="stroke-B1 fill-B6 s0"/></g><text x="417.5" y="38.5" class="text-bold fill-N1 s1">귀납 추론을 믿어도 된다</text></g><g ><g class="shape"><path d="M0 187h372v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="186" y="225.5" class="text-bold fill-N1 s1"><tspan x="186" dy="0">자연은 제일적이다</tspan><tspan x="186" dy="17.667">= 관찰하지 않은 부분도 관찰한 부분과</tspan><tspan x="186" dy="17.667">같은 규칙을 따른다</tspan></text></g><g ><g class="shape"><path d="M261 406h313v66H261z" class="stroke-B1 fill-B6 s0"/></g><text x="417.5" y="444.5" class="text-bold fill-N1 s1">지금까지 자연은 제일적이었다</text></g><text x="979.5" y="31" class="text-bold fill-N1 s1"><tspan x="979.5" dy="0">숨은 전제를 드러내면 부당함은 사라진다. 그러나 그 전제 자체가 귀납으로만 지지된다.</tspan><tspan x="979.5" dy="18.5">논증을 타당하게 만든 값으로 순환을 얻은 것이다</tspan></text><marker id="mk-d2-287484835-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-287484835-3488378134)" d="M334.147 66.253C216 114.3 186 138.7 186 183.5" class="connection stroke-B1 s0" mask="url(#d2-287484835)"/><text x="235" y="112" class="text-italic fill-N2 s1">이것을 전제로 넣어야 논증이 타당해진다</text><path fill="none" marker-end="url(#mk-d2-287484835-3488378134)" d="M186 286.5c0 46.8 29.8 71.2 145.298 118.485" class="connection stroke-B1 s0" mask="url(#d2-287484835)"/><text x="234.5" y="371" class="text-italic fill-N2 s1">그런데 이 전제는 어떻게 아는가</text><path fill="none" marker-end="url(#mk-d2-287484835-3488378134)" d="M501.353 405.747C619.5 357.7 649.5 323.6 649.5 290.75c0-32.851-29.8-176.45-145.298-223.735" class="connection stroke-B1 s0" mask="url(#d2-287484835)"/><text x="645.5" y="246" class="text-italic fill-N2 s1">관찰한 것에서 관찰하지 않은 것으로 넘어갔다 — 귀납이다</text><mask id="d2-287484835" width="1556" height="674" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1556v674H-101z"/><path d="M63 96h344v21H63zM101 355h267v21H101zM406 230h479v21H406z"/></mask></svg>