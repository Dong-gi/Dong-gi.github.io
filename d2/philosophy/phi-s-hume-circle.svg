<svg xmlns="http://www.w3.org/2000/svg" width="672" height="795" class="d2-4043139785 d2-svg" viewBox="-109 -101 672 795"><rect width="672" height="795" x="-109" y="-101" rx="0" style="fill:#fff"/><style>.d2-4043139785 .text-bold{font-weight:700}.d2-4043139785 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4043139785 .fill-N1{fill:#0a0f25}.d2-4043139785 .fill-N2{fill:#676c7e}.d2-4043139785 .fill-B6{fill:#f7f8fe}.d2-4043139785 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M121 0h255v66H121z" class="stroke-B1 fill-B6 s0"/></g><text x="248.5" y="38.5" class="text-bold fill-N1 s1">귀납 추론을 믿어도 된다</text></g><g ><g class="shape"><path d="M0 203h245v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="122.5" y="241.5" class="text-bold fill-N1 s1"><tspan x="122.5" dy="0">자연은 제일적이다</tspan><tspan x="122.5" dy="17.25">= 관찰하지 않은 부분도</tspan><tspan x="122.5" dy="17.25">관찰한 부분과</tspan><tspan x="122.5" dy="17.25">같은 규칙을 따른다</tspan></text></g><g ><g class="shape"><path d="M92 454h313v66H92z" class="stroke-B1 fill-B6 s0"/></g><text x="248.5" y="492.5" class="text-bold fill-N1 s1">지금까지 자연은 제일적이었다</text></g><text x="203" y="556" class="text-bold fill-N1 s1"><tspan x="203" dy="0">숨은 전제를 드러내면 부당함은 사라진다.</tspan><tspan x="203" dy="17.667">그러나 그 전제 자체가 귀납으로만 지지된다.</tspan><tspan x="203" dy="17.667">논증을 타당하게 만든 값으로 순환을 얻은 것이다</tspan></text><marker id="mk-d2-4043139785-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4043139785-3488378134)" d="M205.947 66.76C139.5 120.7 122.5 148.3 122.5 199.5" class="connection stroke-B1 s0" mask="url(#d2-4043139785)"/><text x="139" y="118" class="text-italic fill-N2 s1"><tspan x="139" dy="0">이것을 전제로 넣어야</tspan><tspan x="139" dy="18.5">논증이 타당해진다</tspan></text><path fill="none" marker-end="url(#mk-d2-4043139785-3488378134)" d="M122.5 318.5c0 53.2 16.8 80.8 80.91 133.461" class="connection stroke-B1 s0" mask="url(#d2-4043139785)"/><text x="139.5" y="397" class="text-italic fill-N2 s1"><tspan x="139.5" dy="0">그런데 이 전제는</tspan><tspan x="139.5" dy="18.5">어떻게 아는가</tspan></text><path fill="none" marker-end="url(#mk-d2-4043139785-3488378134)" d="M291.553 453.24C358 399.3 375 360.4 375 322.75S358.2 120.7 294.09 68.039" class="connection stroke-B1 s0" mask="url(#d2-4043139785)"/><text x="373" y="251" class="text-italic fill-N2 s1"><tspan x="373" dy="0">관찰한 것에서</tspan><tspan x="373" dy="17.667">관찰하지 않은 것으로</tspan><tspan x="373" dy="17.667">넘어갔다 — 귀납이다</tspan></text><mask id="d2-4043139785" width="672" height="795" x="-109" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-109-101h672v795h-672z"/><path d="M47 102h184v37H47zM67 381h145v37H67zM281 235h184v53H281z"/></mask></svg>