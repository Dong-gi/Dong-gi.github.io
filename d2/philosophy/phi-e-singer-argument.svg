<svg xmlns="http://www.w3.org/2000/svg" width="1639" height="1139" class="d2-1982335511 d2-svg" viewBox="-101 -101 1639 1139"><rect width="1639" height="1139" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1982335511 .fill-N1{fill:#0a0f25}.d2-1982335511 .fill-N2{fill:#676c7e}.d2-1982335511 .fill-B6{fill:#f7f8fe}.d2-1982335511 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M70 0h244v82H70z" class="stroke-B1 fill-B6 s0"/></g><text x="192" y="38.5" class="text-bold fill-N1 s1"><tspan x="192" dy="0">(P1) 굶주림과 그로 인한</tspan><tspan x="192" dy="18.5">죽음은 나쁘다</tspan></text></g><g ><g class="shape"><path d="M43 174h299v98H43z" class="stroke-B1 fill-B6 s0"/></g><text x="192.5" y="212.5" class="text-bold fill-N1 s1"><tspan x="192.5" dy="0">(P2) 비슷하게 중요한 것을</tspan><tspan x="192.5" dy="17.667">희생하지 않고 나쁜 일을 막을</tspan><tspan x="192.5" dy="17.667">수 있다면 그렇게 해야 한다</tspan></text></g><g ><g class="shape"><path d="M34 376h316v114H34z" class="stroke-B1 fill-B6 s0"/></g><text x="192" y="414.5" class="text-bold fill-N1 s1"><tspan x="192" dy="0">(P3) 눈앞의 연못에 빠진 아이를</tspan><tspan x="192" dy="17.25">건지는 것과 멀리 있는 사람을</tspan><tspan x="192" dy="17.25">돕는 것 사이에</tspan><tspan x="192" dy="17.25">도덕적으로 중요한 차이가 없다</tspan></text></g><g ><g class="shape"><path d="M66 558h252v130H66z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="192" y="596.5" class="text-bold fill-N1 s1"><tspan x="192" dy="0">(P4) 우리는 실제로 그런</tspan><tspan x="192" dy="17">방식으로 도울 수 있다</tspan><tspan x="192" dy="17">— 글에 없음.</tspan><tspan x="192" dy="17">경험적 전제이므로 논증</tspan><tspan x="192" dy="17">밖에서 따져야 한다</tspan></text></g><g ><g class="shape"><path d="M648 32h296v98H648z" class="stroke-B1 fill-B6 s0"/></g><text x="796" y="70.5" class="text-bold fill-N1 s1"><tspan x="796" dy="0">(C) 그러므로 비슷하게 중요한</tspan><tspan x="796" dy="17.667">것을 희생하지 않고 도울 수</tspan><tspan x="796" dy="17.667">있는 만큼 도와야 한다</tspan></text></g><g ><g class="shape"><path d="M624 347h343v130H624z" class="stroke-B1 fill-B6 s0"/></g><text x="795.5" y="385.5" class="text-bold fill-N1 s1"><tspan x="795.5" dy="0">(P2)를 친다 — 요구 과잉</tspan><tspan x="795.5" dy="17">이 전제를 받아들이면 내 삶 전체가</tspan><tspan x="795.5" dy="17">남의 필요에 종속된다.</tspan><tspan x="795.5" dy="17">도덕은 자기 삶을 살</tspan><tspan x="795.5" dy="17">여지를 남겨야 한다</tspan></text></g><g ><g class="shape"><path d="M635 601h321v130H635z" class="stroke-B1 fill-B6 s0"/></g><text x="795.5" y="639.5" class="text-bold fill-N1 s1"><tspan x="795.5" dy="0">(P3)을 친다 — 거리 ·</tspan><tspan x="795.5" dy="17">관계 · 다른 사람들</tspan><tspan x="795.5" dy="17">가까움이 특별한 의무를 낳는다.</tspan><tspan x="795.5" dy="17">나와 관계 있는 사람이 먼저다.</tspan><tspan x="795.5" dy="17">남들도 안 돕는데 왜 나만인가</tspan></text></g><g ><g class="shape"><path d="M626 791h340v146H626z" class="stroke-B1 fill-B6 s0"/></g><text x="796" y="829.5" class="text-bold fill-N1 s1"><tspan x="796" dy="0">(P4)를 친다 — 원조가</tspan><tspan x="796" dy="16.833">정말 그 일을 하는가</tspan><tspan x="796" dy="16.833">이것은 사실 주장에 대한 반론이지</tspan><tspan x="796" dy="16.833">도덕 논증에 대한 반론이 아니다.</tspan><tspan x="796" dy="16.833">이 문서는 여기에 수치를</tspan><tspan x="796" dy="16.833">적지 않는다</tspan></text></g><g ><g class="shape"><path d="M1113 569h319v194h-319z" class="stroke-B1 fill-B6 s0"/></g><text x="1272.5" y="607.5" class="text-bold fill-N1 s1"><tspan x="1272.5" dy="0">(P3) 쪽 응답 — 거리 자체는</tspan><tspan x="1272.5" dy="16.556">도덕적으로 중요하지 않다.</tspan><tspan x="1272.5" dy="16.556">옆 나라 아이와 옆 마을 아이를</tspan><tspan x="1272.5" dy="16.556">다르게 대할 이유를 거리에서</tspan><tspan x="1272.5" dy="16.556">찾기 어렵다.</tspan><tspan x="1272.5" dy="16.556">다른 사람이 있다는 것도 면제가</tspan><tspan x="1272.5" dy="16.556">되지 않는다 — 연못가에 다른</tspan><tspan x="1272.5" dy="16.556">어른이 서 있어도</tspan><tspan x="1272.5" dy="16.556">아이가 빠져 죽게 두면 안 된다</tspan></text></g><g ><g class="shape"><path d="M1107 315h330v194h-330z" class="stroke-B1 fill-B6 s0"/></g><text x="1272" y="353.5" class="text-bold fill-N1 s1"><tspan x="1272" dy="0">(P2) 쪽 응답 세 갈래 — ①</tspan><tspan x="1272" dy="16.556">요구가 크다는 것 자체는 반론이</tspan><tspan x="1272" dy="16.556">아니다.</tspan><tspan x="1272" dy="16.556">② 약한 판본으로 물러선다 —</tspan><tspan x="1272" dy="16.556">‘도덕적으로 중요한 무엇도</tspan><tspan x="1272" dy="16.556">희생하지 않고’ 라면 요구가 훨씬</tspan><tspan x="1272" dy="16.556">작아진다.</tspan><tspan x="1272" dy="16.556">③ 문턱을 둔다 — 일정한 몫까지가</tspan><tspan x="1272" dy="16.556">의무이고 그 위는 초과 의무다</tspan></text></g><text x="192" y="764" class="fill-N1 s1"><tspan x="192" dy="0">미결. 요구 과잉이 이 논증을 무너뜨리는지,</tspan><tspan x="192" dy="16.714">아니면 우리 판단 쪽을 고쳐야 하는지가</tspan><tspan x="192" dy="16.714">아직 결판나지 않았다.</tspan><tspan x="192" dy="16.714">다만 어느 응답을 잡아도 우리가 지금</tspan><tspan x="192" dy="16.714">하는 것보다는 많이 요구한다.</tspan><tspan x="192" dy="16.714">분배가 어떻게 되어야 하는가,</tspan><tspan x="192" dy="16.714">국가가 무엇을 해야 하는가는 20장의 물음이다</tspan></text><marker id="mk-d2-1982335511-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1982335511-3488378134)" d="M316 41c150 0 216.7 3.938 327.537 19.147" class="connection stroke-B1 s0" mask="url(#d2-1982335511)"/><path fill="none" marker-end="url(#mk-d2-1982335511-3488378134)" d="M344.409 175.923C471.7 136.104 532.7 121.569 643.547 104.457" class="connection stroke-B1 s0" mask="url(#d2-1982335511)"/><path fill="none" marker-end="url(#mk-d2-1982335511-3488378134)" d="M276.65 374.87C458.2 250.398 541.6 201.2 688.385 131.711" class="connection stroke-B1 s0" mask="url(#d2-1982335511)"/><path fill="none" marker-end="url(#mk-d2-1982335511-3488378134)" d="M260.435 556.606C455 367.6 550.4 282 732.905 132.534" class="connection stroke-B1 s0" mask="url(#d2-1982335511)"/><path fill="none" marker-end="url(#mk-d2-1982335511-3488378134)" d="M274.71 273.287C457.8 384.25 528 412.25 620 412.25" class="connection stroke-B1 s0" mask="url(#d2-1982335511)"/><text x="439" y="378" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-1982335511-3488378134)" d="M269.603 491.446C456.8 631.05 530.2 666.25 631 666.25" class="connection stroke-B1 s0" mask="url(#d2-1982335511)"/><text x="437" y="622" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-1982335511-3488378134)" d="M277.583 689.472C458.4 829.05 528.3 864.25 621.5 864.25" class="connection stroke-B1 s0" mask="url(#d2-1982335511)"/><text x="437" y="818" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-1982335511-3488378134)" d="M958 666.25h150.5" class="connection stroke-B1 s0" mask="url(#d2-1982335511)"/><path fill="none" marker-end="url(#mk-d2-1982335511-3488378134)" d="M969 412.25h134" class="connection stroke-B1 s0" mask="url(#d2-1982335511)"/><mask id="d2-1982335511" width="1639" height="1139" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1639v1139H-101z"/><path d="M387 362h104v21H387zM385 606h104v21H385zM385 802h104v21H385z"/></mask></svg>