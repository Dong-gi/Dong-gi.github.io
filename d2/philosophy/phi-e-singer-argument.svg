<svg xmlns="http://www.w3.org/2000/svg" width="3827" height="717" class="d2-208050391 d2-svg" viewBox="-101 -101 3827 717"><rect width="3827" height="717" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-208050391 .fill-N1{fill:#0a0f25}.d2-208050391 .fill-N2{fill:#676c7e}.d2-208050391 .fill-B6{fill:#f7f8fe}.d2-208050391 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M139 8h372v66H139z" class="stroke-B1 fill-B6 s0"/></g><text x="325" y="46.5" class="text-bold fill-N1 s1">(P1) 굶주림과 그로 인한 죽음은 나쁘다</text></g><g ><g class="shape"><path d="M624 8h762v66H624z" class="stroke-B1 fill-B6 s0"/></g><text x="1005" y="46.5" class="text-bold fill-N1 s1">(P2) 비슷하게 중요한 것을 희생하지 않고 나쁜 일을 막을 수 있다면 그렇게 해야 한다</text></g><g ><g class="shape"><path d="M1487 0h698v82h-698z" class="stroke-B1 fill-B6 s0"/></g><text x="1836" y="38.5" class="text-bold fill-N1 s1"><tspan x="1836" dy="0">(P3) 눈앞의 연못에 빠진 아이를 건지는 것과 멀리 있는 사람을 돕는 것 사이에</tspan><tspan x="1836" dy="18.5">도덕적으로 중요한 차이가 없다</tspan></text></g><g ><g class="shape"><path d="M2245 0h530v82h-530z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="2510" y="38.5" class="text-bold fill-N1 s1"><tspan x="2510" dy="0">(P4) 우리는 실제로 그런 방식으로 도울 수 있다</tspan><tspan x="2510" dy="18.5">— 글에 없음. 경험적 전제이므로 논증 밖에서 따져야 한다</tspan></text></g><g ><g class="shape"><path d="M0 219h729v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="364.5" y="257.5" class="text-bold fill-N1 s1">(C) 그러므로 비슷하게 중요한 것을 희생하지 않고 도울 수 있는 만큼 도와야 한다</text></g><g ><g class="shape"><path d="M1502 203h540v98h-540z" class="stroke-B1 fill-B6 s0"/></g><text x="1772" y="241.5" class="text-bold fill-N1 s1"><tspan x="1772" dy="0">(P2)를 친다 — 요구 과잉</tspan><tspan x="1772" dy="17.667">이 전제를 받아들이면 내 삶 전체가 남의 필요에 종속된다.</tspan><tspan x="1772" dy="17.667">도덕은 자기 삶을 살 여지를 남겨야 한다</tspan></text></g><g ><g class="shape"><path d="M2351 203h585v98h-585z" class="stroke-B1 fill-B6 s0"/></g><text x="2643.5" y="241.5" class="text-bold fill-N1 s1"><tspan x="2643.5" dy="0">(P3)을 친다 — 거리 · 관계 · 다른 사람들</tspan><tspan x="2643.5" dy="17.667">가까움이 특별한 의무를 낳는다. 나와 관계 있는 사람이 먼저다.</tspan><tspan x="2643.5" dy="17.667">남들도 안 돕는데 왜 나만인가</tspan></text></g><g ><g class="shape"><path d="M3001 203h624v98h-624z" class="stroke-B1 fill-B6 s0"/></g><text x="3313" y="241.5" class="text-bold fill-N1 s1"><tspan x="3313" dy="0">(P4)를 친다 — 원조가 정말 그 일을 하는가</tspan><tspan x="3313" dy="17.667">이것은 사실 주장에 대한 반론이지 도덕 논증에 대한 반론이 아니다.</tspan><tspan x="3313" dy="17.667">이 문서는 여기에 수치를 적지 않는다</tspan></text></g><g ><g class="shape"><path d="M2284 401h720v114h-720z" class="stroke-B1 fill-B6 s0"/></g><text x="2644" y="439.5" class="text-bold fill-N1 s1"><tspan x="2644" dy="0">(P3) 쪽 응답 — 거리 자체는 도덕적으로 중요하지 않다.</tspan><tspan x="2644" dy="17.25">옆 나라 아이와 옆 마을 아이를 다르게 대할 이유를 거리에서 찾기 어렵다.</tspan><tspan x="2644" dy="17.25">다른 사람이 있다는 것도 면제가 되지 않는다 — 연못가에 다른 어른이 서 있어도</tspan><tspan x="2644" dy="17.25">아이가 빠져 죽게 두면 안 된다</tspan></text></g><g ><g class="shape"><path d="M1321 409h903v98h-903z" class="stroke-B1 fill-B6 s0"/></g><text x="1772.5" y="447.5" class="text-bold fill-N1 s1"><tspan x="1772.5" dy="0">(P2) 쪽 응답 세 갈래 — ① 요구가 크다는 것 자체는 반론이 아니다.</tspan><tspan x="1772.5" dy="17.667">② 약한 판본으로 물러선다 — ‘도덕적으로 중요한 무엇도 희생하지 않고’ 라면 요구가 훨씬 작아진다.</tspan><tspan x="1772.5" dy="17.667">③ 문턱을 둔다 — 일정한 몫까지가 의무이고 그 위는 초과 의무다</tspan></text></g><text x="3211" y="31" class="fill-N1 s1"><tspan x="3211" dy="0">미결. 요구 과잉이 이 논증을 무너뜨리는지, 아니면 우리 판단 쪽을 고쳐야 하는지가</tspan><tspan x="3211" dy="17.667">아직 결판나지 않았다. 다만 어느 응답을 잡아도 우리가 지금 하는 것보다는 많이 요구한다.</tspan><tspan x="3211" dy="17.667">분배가 어떻게 되어야 하는가, 국가가 무엇을 해야 하는가는 20장의 물음이다</tspan></text><marker id="mk-d2-208050391-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-208050391-3488378134)" d="M324.5 75.5c0 53.199 5.6 82.4 26.633 140.24" class="connection stroke-B1 s0" mask="url(#d2-208050391)"/><path fill="none" marker-end="url(#mk-d2-208050391-3488378134)" d="M887.077 74.05C696.2 128.7 608.6 157.9 454.726 218.044" class="connection stroke-B1 s0" mask="url(#d2-208050391)"/><path fill="none" marker-end="url(#mk-d2-208050391-3488378134)" d="M1518.017 81.759C1146.4 130.3 957.4 157.9 578.949 218.864" class="connection stroke-B1 s0" mask="url(#d2-208050391)"/><path fill="none" marker-end="url(#mk-d2-208050391-3488378134)" d="M2243.008 65.681C1569 127.1 1256.4 157.9 685.978 219.073" class="connection stroke-B1 s0" mask="url(#d2-208050391)"/><path fill="none" marker-end="url(#mk-d2-208050391-3488378134)" d="M1256.232 73.764C1668.65 128.7 1772.25 154.7 1772.25 199.5" class="connection stroke-B1 s0" mask="url(#d2-208050391)"/><text x="1539" y="117" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-208050391-3488378134)" d="M2164.734 81.752C2547.55 130.3 2643.75 154.7 2643.75 199.5" class="connection stroke-B1 s0" mask="url(#d2-208050391)"/><text x="2429" y="121" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-208050391-3488378134)" d="M2776.984 74.75C3205.4 128.9 3313 154.7 3313 199.5" class="connection stroke-B1 s0" mask="url(#d2-208050391)"/><text x="3069" y="117" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-208050391-3488378134)" d="M2643.75 303v94" class="connection stroke-B1 s0" mask="url(#d2-208050391)"/><path fill="none" marker-end="url(#mk-d2-208050391-3488378134)" d="M1772.25 303v102" class="connection stroke-B1 s0" mask="url(#d2-208050391)"/><mask id="d2-208050391" width="3827" height="717" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3827v717H-101z"/><path d="M1487 101h104v21h-104zM2377 105h104v21h-104zM3017 101h104v21h-104z"/></mask></svg>