<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="1520" class="d2-3223738052 d2-svg" viewBox="-101 -101 1152 1520"><rect width="1152" height="1520" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3223738052 .text-bold{font-weight:700}.d2-3223738052 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3223738052 .fill-N1{fill:#0a0f25}.d2-3223738052 .fill-N2{fill:#676c7e}.d2-3223738052 .fill-B6{fill:#f7f8fe}.d2-3223738052 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M22 0h168v98H22z" class="stroke-B1 fill-B6 s0"/></g><text x="106" y="38.5" class="text-bold fill-N1 s1"><tspan x="106" dy="0">(P1) 굶주림과</tspan><tspan x="106" dy="17.667">그로 인한</tspan><tspan x="106" dy="17.667">죽음은 나쁘다</tspan></text></g><g ><g class="shape"><path d="M11 190h191v146H11z" class="stroke-B1 fill-B6 s0"/></g><text x="106.5" y="228.5" class="text-bold fill-N1 s1"><tspan x="106.5" dy="0">(P2) 비슷하게</tspan><tspan x="106.5" dy="16.833">중요한 것을</tspan><tspan x="106.5" dy="16.833">희생하지 않고</tspan><tspan x="106.5" dy="16.833">나쁜 일을 막을</tspan><tspan x="106.5" dy="16.833">수 있다면</tspan><tspan x="106.5" dy="16.833">그렇게 해야 한다</tspan></text></g><g ><g class="shape"><path d="M0 456h212v162H0z" class="stroke-B1 fill-B6 s0"/></g><text x="106" y="494.5" class="text-bold fill-N1 s1"><tspan x="106" dy="0">(P3) 눈앞의 연못에</tspan><tspan x="106" dy="16.714">빠진 아이를</tspan><tspan x="106" dy="16.714">건지는 것과</tspan><tspan x="106" dy="16.714">멀리 있는 사람을</tspan><tspan x="106" dy="16.714">돕는 것 사이에</tspan><tspan x="106" dy="16.714">도덕적으로</tspan><tspan x="106" dy="16.714">중요한 차이가 없다</tspan></text></g><g ><g class="shape"><path d="M2 686h209v178H2z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="106.5" y="724.5" class="text-bold fill-N1 s1"><tspan x="106.5" dy="0">(P4) 우리는</tspan><tspan x="106.5" dy="16.625">실제로 그런</tspan><tspan x="106.5" dy="16.625">방식으로</tspan><tspan x="106.5" dy="16.625">도울 수 있다</tspan><tspan x="106.5" dy="16.625">— 글에 없음.</tspan><tspan x="106.5" dy="16.625">경험적 전제이므로</tspan><tspan x="106.5" dy="16.625">논증 밖에서</tspan><tspan x="106.5" dy="16.625">따져야 한다</tspan></text></g><g ><g class="shape"><path d="M383 24h212v130H383z" class="stroke-B1 fill-B6 s0"/></g><text x="489" y="62.5" class="text-bold fill-N1 s1"><tspan x="489" dy="0">(C) 그러므로</tspan><tspan x="489" dy="17">비슷하게 중요한</tspan><tspan x="489" dy="17">것을 희생하지 않고</tspan><tspan x="489" dy="17">도울 수 있는 만큼</tspan><tspan x="489" dy="17">도와야 한다</tspan></text></g><g ><g class="shape"><path d="M370 423h237v162H370z" class="stroke-B1 fill-B6 s0"/></g><text x="488.5" y="461.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">(P2)를 친다 —</tspan><tspan x="488.5" dy="16.714">요구 과잉</tspan><tspan x="488.5" dy="16.714">이 전제를 받아들이면</tspan><tspan x="488.5" dy="16.714">내 삶 전체가</tspan><tspan x="488.5" dy="16.714">남의 필요에 종속된다.</tspan><tspan x="488.5" dy="16.714">도덕은 자기 삶을 살</tspan><tspan x="488.5" dy="16.714">여지를 남겨야 한다</tspan></text></g><g ><g class="shape"><path d="M387 749h203v178H387z" class="stroke-B1 fill-B6 s0"/></g><text x="488.5" y="787.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">(P3)을 친다 — 거리 ·</tspan><tspan x="488.5" dy="16.625">관계 · 다른 사람들</tspan><tspan x="488.5" dy="16.625">가까움이 특별한</tspan><tspan x="488.5" dy="16.625">의무를 낳는다.</tspan><tspan x="488.5" dy="16.625">나와 관계 있는</tspan><tspan x="488.5" dy="16.625">사람이 먼저다.</tspan><tspan x="488.5" dy="16.625">남들도 안 돕는데</tspan><tspan x="488.5" dy="16.625">왜 나만인가</tspan></text></g><g ><g class="shape"><path d="M383 987h212v194H383z" class="stroke-B1 fill-B6 s0"/></g><text x="489" y="1025.5" class="text-bold fill-N1 s1"><tspan x="489" dy="0">(P4)를 친다 —</tspan><tspan x="489" dy="16.556">원조가 정말</tspan><tspan x="489" dy="16.556">그 일을 하는가</tspan><tspan x="489" dy="16.556">이것은 사실 주장에</tspan><tspan x="489" dy="16.556">대한 반론이지</tspan><tspan x="489" dy="16.556">도덕 논증에 대한</tspan><tspan x="489" dy="16.556">반론이 아니다.</tspan><tspan x="489" dy="16.556">이 문서는 여기에</tspan><tspan x="489" dy="16.556">수치를 적지 않는다</tspan></text></g><g ><g class="shape"><path d="M710 693h237v290H710z" class="stroke-B1 fill-B6 s0"/></g><text x="828.5" y="731.5" class="text-bold fill-N1 s1"><tspan x="828.5" dy="0">(P3) 쪽 응답 —</tspan><tspan x="828.5" dy="16.333">거리 자체는</tspan><tspan x="828.5" dy="16.333">도덕적으로</tspan><tspan x="828.5" dy="16.333">중요하지 않다.</tspan><tspan x="828.5" dy="16.333">옆 나라 아이와</tspan><tspan x="828.5" dy="16.333">옆 마을 아이를</tspan><tspan x="828.5" dy="16.333">다르게 대할 이유를</tspan><tspan x="828.5" dy="16.333">거리에서 찾기 어렵다.</tspan><tspan x="828.5" dy="16.333">다른 사람이 있다는</tspan><tspan x="828.5" dy="16.333">것도 면제가</tspan><tspan x="828.5" dy="16.333">되지 않는다 —</tspan><tspan x="828.5" dy="16.333">연못가에 다른</tspan><tspan x="828.5" dy="16.333">어른이 서 있어도</tspan><tspan x="828.5" dy="16.333">아이가 빠져 죽게</tspan><tspan x="828.5" dy="16.333">두면 안 된다</tspan></text></g><g ><g class="shape"><path d="M707 375h243v258H707z" class="stroke-B1 fill-B6 s0"/></g><text x="828.5" y="413.5" class="text-bold fill-N1 s1"><tspan x="828.5" dy="0">(P2) 쪽 응답 세 갈래 —</tspan><tspan x="828.5" dy="16.385">① 요구가 크다는 것</tspan><tspan x="828.5" dy="16.385">자체는 반론이 아니다.</tspan><tspan x="828.5" dy="16.385">② 약한 판본으로</tspan><tspan x="828.5" dy="16.385">물러선다 —</tspan><tspan x="828.5" dy="16.385">‘도덕적으로 중요한</tspan><tspan x="828.5" dy="16.385">무엇도 희생하지 않고’</tspan><tspan x="828.5" dy="16.385">라면 요구가 훨씬</tspan><tspan x="828.5" dy="16.385">작아진다.</tspan><tspan x="828.5" dy="16.385">③ 문턱을 둔다 —</tspan><tspan x="828.5" dy="16.385">일정한 몫까지가</tspan><tspan x="828.5" dy="16.385">의무이고 그 위는</tspan><tspan x="828.5" dy="16.385">초과 의무다</tspan></text></g><text x="475" y="1217" class="fill-N1 s1"><tspan x="475" dy="0">미결. 요구 과잉이 이 논증을 무너뜨리는지,</tspan><tspan x="475" dy="16.714">아니면 우리 판단 쪽을 고쳐야 하는지가</tspan><tspan x="475" dy="16.714">아직 결판나지 않았다.</tspan><tspan x="475" dy="16.714">다만 어느 응답을 잡아도 우리가 지금</tspan><tspan x="475" dy="16.714">하는 것보다는 많이 요구한다.</tspan><tspan x="475" dy="16.714">분배가 어떻게 되어야 하는가,</tspan><tspan x="475" dy="16.714">국가가 무엇을 해야 하는가는 20장의 물음이다</tspan></text><marker id="mk-d2-3223738052-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3223738052-3488378134)" d="M192 49c78.8 0 117.3 3.706 186.58 17.737" class="connection stroke-B1 s0" mask="url(#d2-3223738052)"/><path fill="none" marker-end="url(#mk-d2-3223738052-3488378134)" d="M204.202 203.616c69.098-42.683 105.098-59.269 174.476-80.697" class="connection stroke-B1 s0" mask="url(#d2-3223738052)"/><path fill="none" marker-end="url(#mk-d2-3223738052-3488378134)" d="M162.133 454.352C265 304.8 316 244.4 413.033 156.682" class="connection stroke-B1 s0" mask="url(#d2-3223738052)"/><path fill="none" marker-end="url(#mk-d2-3223738052-3488378134)" d="M149.87 684.2C262.6 450.798 322 344.4 443.817 157.351" class="connection stroke-B1 s0" mask="url(#d2-3223738052)"/><path fill="none" marker-end="url(#mk-d2-3223738052-3488378134)" d="M163.218 337.836C265.2 470.65 306.8 504.25 366 504.25" class="connection stroke-B1 s0" mask="url(#d2-3223738052)"/><text x="249" y="447" class="text-italic fill-N2 s1"><tspan x="249" dy="0">여기를</tspan><tspan x="249" dy="18.5">친다</tspan></text><path fill="none" marker-end="url(#mk-d2-3223738052-3488378134)" d="M157.046 619.955C264 794.25 310.2 838.25 383 838.25" class="connection stroke-B1 s0" mask="url(#d2-3223738052)"/><text x="247" y="764" class="text-italic fill-N2 s1"><tspan x="247" dy="0">여기를</tspan><tspan x="247" dy="18.5">친다</tspan></text><path fill="none" marker-end="url(#mk-d2-3223738052-3488378134)" d="M160.029 865.965C264.6 1040.25 309.3 1084.25 378.5 1084.25" class="connection stroke-B1 s0" mask="url(#d2-3223738052)"/><text x="247" y="1008" class="text-italic fill-N2 s1"><tspan x="247" dy="0">여기를</tspan><tspan x="247" dy="18.5">친다</tspan></text><path fill="none" marker-end="url(#mk-d2-3223738052-3488378134)" d="M592 838.25h114" class="connection stroke-B1 s0" mask="url(#d2-3223738052)"/><path fill="none" marker-end="url(#mk-d2-3223738052-3488378134)" d="M609 504.25h94" class="connection stroke-B1 s0" mask="url(#d2-3223738052)"/><mask id="d2-3223738052" width="1152" height="1520" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1152v1520H-101z"/><path d="M218 431h62v37h-62zM216 748h62v37h-62zM216 992h62v37h-62z"/></mask></svg>