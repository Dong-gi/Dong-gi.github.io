<svg xmlns="http://www.w3.org/2000/svg" width="2049" height="697" class="d2-3228912666 d2-svg" viewBox="-101 -101 2049 697"><rect width="2049" height="697" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3228912666 .fill-N1{fill:#0a0f25}.d2-3228912666 .fill-B6{fill:#f7f8fe}.d2-3228912666 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M286 0h203v66H286z" class="stroke-B1 fill-B6 s0"/></g><text x="387.5" y="38.5" class="text-bold fill-N1 s1">검사하려는 가설 H</text></g><g ><g class="shape"><path d="M160 126h456v98H160z" class="stroke-B1 fill-B6 s0"/></g><text x="388" y="164.5" class="text-bold fill-N1 s1"><tspan x="388" dy="0">보조 가정들</tspan><tspan x="388" dy="17.667">계기가 제대로 잰다 / 시료가 오염되지 않았다 /</tspan><tspan x="388" dy="17.667">배경 이론이 옳다 / 다른 원인이 끼어들지 않았다</tspan></text></g><g ><g class="shape"><path d="M250 284h276v82H250z" class="stroke-B1 fill-B6 s0"/></g><text x="388" y="322.5" class="text-bold fill-N1 s1"><tspan x="388" dy="0">초기 조건</tspan><tspan x="388" dy="18.5">실제로 이 값에서 시작했다</tspan></text></g><g ><g class="shape"><path d="M875 142h143v66H875z" class="stroke-B1 fill-B6 s0"/></g><text x="946.5" y="180.5" class="text-bold fill-N1 s1">관찰 예측 O</text></g><g ><g class="shape"><path d="M1118 142h249v66h-249z" class="stroke-B1 fill-B6 s0"/></g><text x="1242.5" y="180.5" class="text-bold fill-N1 s1">관찰해 보니 O 가 아니다</text></g><g ><g class="shape"><path d="M1467 118h380v114h-380z" class="stroke-B1 fill-B6 s0"/></g><text x="1657" y="156.5" class="text-bold fill-N1 s1"><tspan x="1657" dy="0">논리가 말해 주는 것은</tspan><tspan x="1657" dy="17.25">‘H 와 보조 가정과 초기 조건이</tspan><tspan x="1657" dy="17.25">모두 참일 수는 없다’ 뿐이다.</tspan><tspan x="1657" dy="17.25">무엇을 버릴지는 논리가 정하지 않는다</tspan></text></g><text x="387.5" y="442" class="fill-N1 s1"><tspan x="387.5" dy="0">천왕성의 궤도가 예측과 어긋났을 때 천문학자들은 뉴턴 역학이 아니라 보조 가정을 고쳤다 —</tspan><tspan x="387.5" dy="17.25">아직 보지 못한 행성이 있다고 놓았고, 해왕성이 그 자리에 있었다.</tspan><tspan x="387.5" dy="17.25">같은 수를 수성의 궤도에 썼을 때는 그런 행성이 없었고, 이번에는 역학 쪽이 바뀌었다.</tspan><tspan x="387.5" dy="17.25">같은 모양의 대응이 한 번은 맞고 한 번은 틀렸다는 것이 이 논제의 무게다</tspan></text><marker id="mk-d2-3228912666-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3228912666-3488378134)" d="M491 33c266.8 0 352.6 21.8 424.404 105.957" class="connection stroke-B1 s0" mask="url(#d2-3228912666)"/><path fill="none" marker-end="url(#mk-d2-3228912666-3488378134)" d="M618.5 175H871" class="connection stroke-B1 s0" mask="url(#d2-3228912666)"/><path fill="none" marker-end="url(#mk-d2-3228912666-3488378134)" d="M528.5 325c236.8 0 315.5-23.4 388.979-113.895" class="connection stroke-B1 s0" mask="url(#d2-3228912666)"/><path fill="none" marker-end="url(#mk-d2-3228912666-3488378134)" d="M1020 175h94" class="connection stroke-B1 s0" mask="url(#d2-3228912666)"/><path fill="none" marker-end="url(#mk-d2-3228912666-3488378134)" d="M1369 175h94" class="connection stroke-B1 s0" mask="url(#d2-3228912666)"/><mask id="d2-3228912666" width="2049" height="697" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2049v697H-101z"/></mask></svg>