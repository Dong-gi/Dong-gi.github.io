<svg xmlns="http://www.w3.org/2000/svg" width="1393" height="689" class="d2-1468053714 d2-svg" viewBox="-101 -101 1393 689"><rect width="1393" height="689" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1468053714 .fill-N1{fill:#0a0f25}.d2-1468053714 .fill-B6{fill:#f7f8fe}.d2-1468053714 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M47 0h203v66H47z" class="stroke-B1 fill-B6 s0"/></g><text x="148.5" y="38.5" class="text-bold fill-N1 s1">검사하려는 가설 H</text></g><g ><g class="shape"><path d="M0 126h296v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="148" y="164.5" class="text-bold fill-N1 s1"><tspan x="148" dy="0">보조 가정들</tspan><tspan x="148" dy="17">계기가 제대로 잰다 /</tspan><tspan x="148" dy="17">시료가 오염되지 않았다 /</tspan><tspan x="148" dy="17">배경 이론이 옳다 /</tspan><tspan x="148" dy="17">다른 원인이 끼어들지 않았다</tspan></text></g><g ><g class="shape"><path d="M10 316h276v82H10z" class="stroke-B1 fill-B6 s0"/></g><text x="148" y="354.5" class="text-bold fill-N1 s1"><tspan x="148" dy="0">초기 조건</tspan><tspan x="148" dy="18.5">실제로 이 값에서 시작했다</tspan></text></g><g ><g class="shape"><path d="M396 158h143v66H396z" class="stroke-B1 fill-B6 s0"/></g><text x="467.5" y="196.5" class="text-bold fill-N1 s1">관찰 예측 O</text></g><g ><g class="shape"><path d="M639 150h148v82H639z" class="stroke-B1 fill-B6 s0"/></g><text x="713" y="188.5" class="text-bold fill-N1 s1"><tspan x="713" dy="0">관찰해 보니</tspan><tspan x="713" dy="18.5">O 가 아니다</tspan></text></g><g ><g class="shape"><path d="M887 126h304v130H887z" class="stroke-B1 fill-B6 s0"/></g><text x="1039" y="164.5" class="text-bold fill-N1 s1"><tspan x="1039" dy="0">논리가 말해 주는 것은</tspan><tspan x="1039" dy="17">‘H 와 보조 가정과 초기 조건이</tspan><tspan x="1039" dy="17">모두 참일 수는 없다’ 뿐이다.</tspan><tspan x="1039" dy="17">무엇을 버릴지는</tspan><tspan x="1039" dy="17">논리가 정하지 않는다</tspan></text></g><text x="595.5" y="434" class="fill-N1 s1"><tspan x="595.5" dy="0">천왕성의 궤도가 예측과 어긋났을 때 천문학자들은 뉴턴 역학이 아니라 보조 가정을 고쳤다 —</tspan><tspan x="595.5" dy="17.25">아직 보지 못한 행성이 있다고 놓았고, 해왕성이 그 자리에 있었다.</tspan><tspan x="595.5" dy="17.25">같은 수를 수성의 궤도에 썼을 때는 그런 행성이 없었고, 이번에는 역학 쪽이 바뀌었다.</tspan><tspan x="595.5" dy="17.25">같은 모양의 대응이 한 번은 맞고 한 번은 틀렸다는 것이 이 논제의 무게다</tspan></text><marker id="mk-d2-1468053714-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1468053714-3488378134)" d="M252.5 33c74.4 0 112.7 25 187.064 121.828" class="connection stroke-B1 s0" mask="url(#d2-1468053714)"/><path fill="none" marker-end="url(#mk-d2-1468053714-3488378134)" d="M298 191h94" class="connection stroke-B1 s0" mask="url(#d2-1468053714)"/><path fill="none" marker-end="url(#mk-d2-1468053714-3488378134)" d="M288 357c46 0 77.4-26.6 152.643-129.768" class="connection stroke-B1 s0" mask="url(#d2-1468053714)"/><path fill="none" marker-end="url(#mk-d2-1468053714-3488378134)" d="M541 191h94" class="connection stroke-B1 s0" mask="url(#d2-1468053714)"/><path fill="none" marker-end="url(#mk-d2-1468053714-3488378134)" d="M789 191h94" class="connection stroke-B1 s0" mask="url(#d2-1468053714)"/><mask id="d2-1468053714" width="1393" height="689" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1393v689H-101z"/></mask></svg>