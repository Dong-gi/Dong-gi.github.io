<svg xmlns="http://www.w3.org/2000/svg" width="3156" height="684" class="d2-2926433437 d2-svg" viewBox="-101 -101 3156 684"><rect width="3156" height="684" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2926433437 .fill-N1{fill:#0a0f25}.d2-2926433437 .fill-N2{fill:#676c7e}.d2-2926433437 .fill-B6{fill:#f7f8fe}.d2-2926433437 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M267 0h290v98H267z" class="stroke-B1 fill-B6 s0"/></g><text x="412" y="38.5" class="text-bold fill-N1 s1"><tspan x="412" dy="0">물음 ① 기계에 마음이 있는가</tspan><tspan x="412" dy="17.667">경험을 갖는가. 이해하는가.</tspan><tspan x="412" dy="17.667">15장이 다루는 물음이다</tspan></text></g><g ><g class="shape"><path d="M225 158h374v98H225z" class="stroke-B1 fill-B6 s0"/></g><text x="412" y="196.5" class="text-bold fill-N1 s1"><tspan x="412" dy="0">물음 ② 기계의 행동에 누가 책임지는가</tspan><tspan x="412" dy="17.667">설계 · 배치 · 사용 가운데 어디인가.</tspan><tspan x="412" dy="17.667">이 절의 앞부분이 다룬 물음이다</tspan></text></g><g ><g class="shape"><path d="M1429 158h514v98h-514z" class="stroke-B1 fill-B6 s0"/></g><text x="1686" y="196.5" class="text-bold fill-N1 s1"><tspan x="1686" dy="0">물음 ③ 책임의 주체가 되려면 무엇이 필요한가</tspan><tspan x="1686" dy="17.667">의식이 필요한가. 이유에 반응하는 능력으로 충분한가.</tspan><tspan x="1686" dy="17.667">①과 ②를 잇는 물음이면서 둘 중 어느 것도 아니다</tspan></text></g><g ><g class="shape"><path d="M2266 0h688v98h-688z" class="stroke-B1 fill-B6 s0"/></g><text x="2610" y="38.5" class="text-bold fill-N1 s1"><tspan x="2610" dy="0">갈래 A — 의식이 필요하다</tspan><tspan x="2610" dy="17.667">반응적 태도의 대상이 되려면 그 태도를 받는 쪽에서 무언가를 겪어야 한다.</tspan><tspan x="2610" dy="17.667">원망도 용서도 겪는 상대가 없으면 헛돈다</tspan></text></g><g ><g class="shape"><path d="M2292 158h637v98h-637z" class="stroke-B1 fill-B6 s0"/></g><text x="2610.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="2610.5" dy="0">갈래 B — 이유 반응성으로 충분하다</tspan><tspan x="2610.5" dy="17.667">12장의 이유 반응성을 조건으로 잡으면 의식은 따로 요구되지 않는다.</tspan><tspan x="2610.5" dy="17.667">이유를 알아보고 그에 맞게 행동을 바꾸면 된다</tspan></text></g><g ><g class="shape"><path d="M2311 316h598v98h-598z" class="stroke-B1 fill-B6 s0"/></g><text x="2610" y="354.5" class="text-bold fill-N1 s1"><tspan x="2610" dy="0">갈래 C — 법인이 이미 그렇게 하고 있다</tspan><tspan x="2610" dy="17.667">회사는 의식 없이 책임을 진다.</tspan><tspan x="2610" dy="17.667">다만 법적 책임과 도덕적 책임이 같은 것인지가 다시 물음이 된다</tspan></text></g><text x="411.5" y="332" class="fill-N1 s1"><tspan x="411.5" dy="0">미결이다. 지금 정해진 답이 있는 것처럼 쓰면 안 된다.</tspan><tspan x="411.5" dy="18.5">이 절이 할 수 있는 일은 세 물음을 갈라 놓고, 각 갈래가 무엇을 얻고 무엇을 내놓는지 적는 것까지다</tspan></text><text x="411.5" y="429" class="fill-N1 s1"><tspan x="411.5" dy="0">세 이론이 이 자리에서 하는 말도 서로 다르다.</tspan><tspan x="411.5" dy="17.25">결과주의 — 누구에게 물으면 앞으로 해가 줄어드는가로 귀속을 정한다.</tspan><tspan x="411.5" dy="17.25">의무론 — 누가 실제로 그 해를 저질렀고 누구의 권리가 침해되었는가를 먼저 본다.</tspan><tspan x="411.5" dy="17.25">덕 윤리 — 이런 것을 만들고 내놓는 사람에게 어떤 성품이 요구되는가를 묻는다</tspan></text><marker id="mk-d2-2926433437-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2926433437-3488378134)" d="M559.5 49c452.8 0 643.7 21.8 948.65 107.913" class="connection stroke-B1 s0" mask="url(#d2-2926433437)"/><text x="1041" y="58" class="text-italic fill-N2 s1">필요하다면 여기로 이어진다</text><path fill="none" marker-end="url(#mk-d2-2926433437-3488378134)" d="M601.5 207H1425" class="connection stroke-B1 s0" mask="url(#d2-2926433437)"/><text x="1014.5" y="213" class="text-italic fill-N2 s1">귀속의 한계를 물으면 여기로 온다</text><path fill="none" marker-end="url(#mk-d2-2926433437-3488378134)" d="M1817.371 157.294C2046.7 70.8 2136.9 49 2262.5 49" class="connection stroke-B1 s0" mask="url(#d2-2926433437)"/><path fill="none" marker-end="url(#mk-d2-2926433437-3488378134)" d="M1944.5 207h343" class="connection stroke-B1 s0" mask="url(#d2-2926433437)"/><path fill="none" marker-end="url(#mk-d2-2926433437-3488378134)" d="M1817.371 256.706C2046.7 343.2 2145.9 365 2307.5 365" class="connection stroke-B1 s0" mask="url(#d2-2926433437)"/><mask id="d2-2926433437" width="3156" height="684" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3156v684H-101z"/><path d="M920 42h242v21H920zM871 197h287v21H871z"/></mask></svg>