<svg xmlns="http://www.w3.org/2000/svg" width="1369" height="1199" class="d2-171513329 d2-svg" viewBox="-101 -101 1369 1199"><rect width="1369" height="1199" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-171513329 .fill-N1{fill:#0a0f25}.d2-171513329 .fill-N2{fill:#676c7e}.d2-171513329 .fill-B6{fill:#f7f8fe}.d2-171513329 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M234 16h290v98H234z" class="stroke-B1 fill-B6 s0"/></g><text x="379" y="54.5" class="text-bold fill-N1 s1"><tspan x="379" dy="0">물음 ① 기계에 마음이 있는가</tspan><tspan x="379" dy="17.667">경험을 갖는가. 이해하는가.</tspan><tspan x="379" dy="17.667">15장이 다루는 물음이다</tspan></text></g><g ><g class="shape"><path d="M584 0h319v130H584z" class="stroke-B1 fill-B6 s0"/></g><text x="743.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="743.5" dy="0">물음 ② 기계의 행동에</tspan><tspan x="743.5" dy="17">누가 책임지는가</tspan><tspan x="743.5" dy="17">설계 · 배치 · 사용</tspan><tspan x="743.5" dy="17">가운데 어디인가.</tspan><tspan x="743.5" dy="17">이 절의 앞부분이 다룬 물음이다</tspan></text></g><g ><g class="shape"><path d="M381 251h362v146H381z" class="stroke-B1 fill-B6 s0"/></g><text x="562" y="289.5" class="text-bold fill-N1 s1"><tspan x="562" dy="0">물음 ③ 책임의 주체가 되려면</tspan><tspan x="562" dy="16.833">무엇이 필요한가</tspan><tspan x="562" dy="16.833">의식이 필요한가.</tspan><tspan x="562" dy="16.833">이유에 반응하는 능력으로 충분한가.</tspan><tspan x="562" dy="16.833">①과 ②를 잇는 물음이면서</tspan><tspan x="562" dy="16.833">둘 중 어느 것도 아니다</tspan></text></g><g ><g class="shape"><path d="M0 497h319v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="159.5" y="535.5" class="text-bold fill-N1 s1"><tspan x="159.5" dy="0">갈래 A — 의식이 필요하다</tspan><tspan x="159.5" dy="16.833">반응적 태도의 대상이 되려면</tspan><tspan x="159.5" dy="16.833">그 태도를 받는 쪽에서 무언가를</tspan><tspan x="159.5" dy="16.833">겪어야 한다.</tspan><tspan x="159.5" dy="16.833">원망도 용서도 겪는 상대가</tspan><tspan x="159.5" dy="16.833">없으면 헛돈다</tspan></text></g><g ><g class="shape"><path d="M379 505h365v130H379z" class="stroke-B1 fill-B6 s0"/></g><text x="561.5" y="543.5" class="text-bold fill-N1 s1"><tspan x="561.5" dy="0">갈래 B — 이유 반응성으로 충분하다</tspan><tspan x="561.5" dy="17">12장의 이유 반응성을 조건으로</tspan><tspan x="561.5" dy="17">잡으면 의식은 따로 요구되지 않는다.</tspan><tspan x="561.5" dy="17">이유를 알아보고 그에 맞게</tspan><tspan x="561.5" dy="17">행동을 바꾸면 된다</tspan></text></g><g ><g class="shape"><path d="M804 505h363v130H804z" class="stroke-B1 fill-B6 s0"/></g><text x="985.5" y="543.5" class="text-bold fill-N1 s1"><tspan x="985.5" dy="0">갈래 C — 법인이 이미</tspan><tspan x="985.5" dy="17">그렇게 하고 있다</tspan><tspan x="985.5" dy="17">회사는 의식 없이 책임을 진다.</tspan><tspan x="985.5" dy="17">다만 법적 책임과 도덕적 책임이 같은</tspan><tspan x="985.5" dy="17">것인지가 다시 물음이 된다</tspan></text></g><text x="562" y="759" class="fill-N1 s1"><tspan x="562" dy="0">미결이다. 지금 정해진 답이 있는 것처럼 쓰면 안 된다.</tspan><tspan x="562" dy="17.667">이 절이 할 수 있는 일은 세 물음을 갈라 놓고,</tspan><tspan x="562" dy="17.667">각 갈래가 무엇을 얻고 무엇을 내놓는지 적는 것까지다</tspan></text><text x="561.5" y="912" class="fill-N1 s1"><tspan x="561.5" dy="0">세 이론이 이 자리에서 하는 말도 서로 다르다.</tspan><tspan x="561.5" dy="16.833">결과주의 — 누구에게 물으면 앞으로 해가 줄어드는가로 귀속을 정한다.</tspan><tspan x="561.5" dy="16.833">의무론 — 누가 실제로 그 해를 저질렀고 누구의</tspan><tspan x="561.5" dy="16.833">권리가 침해되었는가를 먼저 본다.</tspan><tspan x="561.5" dy="16.833">덕 윤리 — 이런 것을 만들고 내놓는 사람에게</tspan><tspan x="561.5" dy="16.833">어떤 성품이 요구되는가를 묻는다</tspan></text><marker id="mk-d2-171513329-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-171513329-3488378134)" d="M379.25 115.5c0 59.6 16.4 87.2 78.79 133.613" class="connection stroke-B1 s0" mask="url(#d2-171513329)"/><text x="393" y="203" class="text-italic fill-N2 s1">필요하다면 여기로 이어진다</text><path fill="none" marker-end="url(#mk-d2-171513329-3488378134)" d="M743.75 131.5c0 46.8-16.4 71.2-78.79 117.613" class="connection stroke-B1 s0" mask="url(#d2-171513329)"/><text x="725.5" y="209" class="text-italic fill-N2 s1">귀속의 한계를 물으면 여기로 온다</text><path fill="none" marker-end="url(#mk-d2-171513329-3488378134)" d="M378.588 379.965C203.7 433.476 159.5 457 159.5 493" class="connection stroke-B1 s0" mask="url(#d2-171513329)"/><path fill="none" marker-end="url(#mk-d2-171513329-3488378134)" d="M561.5 399v102" class="connection stroke-B1 s0" mask="url(#d2-171513329)"/><path fill="none" marker-end="url(#mk-d2-171513329-3488378134)" d="M745.42 377.066C937.1 432.901 985.5 458.6 985.5 501" class="connection stroke-B1 s0" mask="url(#d2-171513329)"/><mask id="d2-171513329" width="1369" height="1199" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1369v1199H-101z"/><path d="M272 187h242v21H272zM582 193h287v21H582z"/></mask></svg>