<svg xmlns="http://www.w3.org/2000/svg" width="1478" height="2679" class="d2-435375672 d2-svg" viewBox="-89 -89 1478 2679"><rect width="1478" height="2679" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-435375672 .text-bold{font-weight:700}.d2-435375672 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-435375672 .fill-N1{fill:#0a0f25}.d2-435375672 .fill-N2{fill:#676c7e}.d2-435375672 .fill-B5{fill:#edf0fd}.d2-435375672 .fill-B6{fill:#f7f8fe}.d2-435375672 .stroke-B1,.d2-435375672 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M420 52h594v706H420z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="717" y="85" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">방 안의 배치</text></g><g ><g class="shape"><ellipse cx="865.5" cy="893.5" class="shape stroke-B1 fill-B6 s0" rx="146.5" ry="50.5"/></g><text x="865.5" y="883" class="text-bold fill-N1 s1"><tspan x="865.5" dy="0">바깥에서 보면</tspan><tspan x="865.5" dy="17.667">방은 중국어로</tspan><tspan x="865.5" dy="17.667">유창하게 대화한다</tspan></text></g><g ><g class="shape"><ellipse cx="711" cy="1172" class="shape stroke-B1 fill-B6" rx="211" ry="148" style="stroke-width:4"/></g><text x="711" y="1097.5" class="text-bold fill-N1 s1"><tspan x="711" dy="0">설의 논증 — 이 그림의 가운데</tspan><tspan x="711" dy="16.455">(P1) 프로그램은 형식적이다.</tspan><tspan x="711" dy="16.455">기호를 모양으로만 다룬다.</tspan><tspan x="711" dy="16.455">(P2) 마음에는 내용이 있다.</tspan><tspan x="711" dy="16.455">마음 상태는 무언가에 관한다.</tspan><tspan x="711" dy="16.455">(P3) 모양을 다루는 것만으로는</tspan><tspan x="711" dy="16.455">내용이 생기지 않는다.</tspan><tspan x="711" dy="16.455">방 안의 사람이 그것을 보인다.</tspan><tspan x="711" dy="16.455">(C) 그러므로 프로그램을</tspan><tspan x="711" dy="16.455">돌리는 것만으로는</tspan><tspan x="711" dy="16.455">마음이 생기지 않는다</tspan></text></g><text x="314" y="1466" class="fill-N1 s1"><tspan x="314" dy="0">겨냥하는 것과 겨냥하지 않는 것</tspan><tspan x="314" dy="16.417">겨냥하는 것 — ‘알맞게 프로그램된</tspan><tspan x="314" dy="16.417">컴퓨터는 문자 그대로 마음을 갖는다’.</tspan><tspan x="314" dy="16.417">설은 이것을 강한 인공지능이라 불렀다.</tspan><tspan x="314" dy="16.417">다르게 적으면 계산이 이해에 충분한가이고,</tspan><tspan x="314" dy="16.417">그의 답은 아니라는 것이다.</tspan><tspan x="314" dy="16.417">겨냥하지 않는 것 —</tspan><tspan x="314" dy="16.417">기계가 생각할 수 있는가.</tspan><tspan x="314" dy="16.417">설은 이 물음에 그렇다고 답한다.</tspan><tspan x="314" dy="16.417">뇌는 하나의 기계이고 생각하기 때문이다.</tspan><tspan x="314" dy="16.417">이 두 물음을 섞으면</tspan><tspan x="314" dy="16.417">논쟁 전체가 헛돈다</tspan></text><g ><g class="shape"><path d="M427 1727h235v130H427z" class="stroke-B1 fill-B6 s0"/></g><text x="544.5" y="1765.5" class="text-bold fill-N1 s1"><tspan x="544.5" dy="0">체계 응답</tspan><tspan x="544.5" dy="17">이해하는 것은</tspan><tspan x="544.5" dy="17">방 안의 사람이 아니라</tspan><tspan x="544.5" dy="17">사람 · 규칙집 · 종이를</tspan><tspan x="544.5" dy="17">합친 체계 전체다</tspan></text></g><g ><g class="shape"><path d="M742 1733h272v114H742z" class="stroke-B1 fill-B6 s0"/></g><text x="878" y="1771.5" class="text-bold fill-N1 s1"><tspan x="878" dy="0">로봇 응답</tspan><tspan x="878" dy="17.25">방을 로봇에 넣어</tspan><tspan x="878" dy="17.25">감각기와 팔다리를 붙이면</tspan><tspan x="878" dy="17.25">기호가 세상에 이어진다</tspan></text></g><g ><g class="shape"><path d="M1036 1717h252v146h-252z" class="stroke-B1 fill-B6 s0"/></g><text x="1162" y="1755.5" class="text-bold fill-N1 s1"><tspan x="1162" dy="0">뇌 시뮬레이터 응답</tspan><tspan x="1162" dy="16.833">중국어 화자의 뇌에서</tspan><tspan x="1162" dy="16.833">일어나는 일을</tspan><tspan x="1162" dy="16.833">뉴런 하나하나까지</tspan><tspan x="1162" dy="16.833">흉내 내는 프로그램이면</tspan><tspan x="1162" dy="16.833">어떤가</tspan></text></g><text x="126" y="1959" class="fill-N1 s1"><tspan x="126" dy="0">체계 응답이 가리키는 곳</tspan><tspan x="126" dy="17">방 안의 사람 하나가 아니라</tspan><tspan x="126" dy="17">방 전체다.</tspan><tspan x="126" dy="17">사람은 그 체계의</tspan><tspan x="126" dy="17">한 부품일 뿐이라는 것이다</tspan></text><g ><g class="shape"><path d="M458 1943h252v130H458z" class="stroke-B2 fill-B6 s2"/></g><text x="584" y="1981.5" class="text-bold fill-N1 s1"><tspan x="584" dy="0">설의 재반박</tspan><tspan x="584" dy="17">규칙집을 다 외우고</tspan><tspan x="584" dy="17">밖으로 나오면</tspan><tspan x="584" dy="17">체계가 곧 그 사람인데,</tspan><tspan x="584" dy="17">그래도 이해하지 못한다</tspan></text></g><g ><g class="shape"><path d="M730 1943h296v130H730z" class="stroke-B2 fill-B6 s2"/></g><text x="878" y="1981.5" class="text-bold fill-N1 s1"><tspan x="878" dy="0">설의 재반박</tspan><tspan x="878" dy="17">로봇의 카메라에서 오는 것도</tspan><tspan x="878" dy="17">결국 기호일 뿐이라</tspan><tspan x="878" dy="17">방 안 사람에게는</tspan><tspan x="878" dy="17">달라지는 것이 없다</tspan></text></g><g ><g class="shape"><path d="M1046 1943h232v130h-232z" class="stroke-B2 fill-B6 s2"/></g><text x="1162" y="1981.5" class="text-bold fill-N1 s1"><tspan x="1162" dy="0">설의 재반박</tspan><tspan x="1162" dy="17">수도관과 밸브로</tspan><tspan x="1162" dy="17">같은 구조를 만들어도</tspan><tspan x="1162" dy="17">물이 흐를 뿐</tspan><tspan x="1162" dy="17">이해는 없다</tspan></text></g><text x="583.5" y="2159" class="fill-N1 s1"><tspan x="583.5" dy="0">되받음</tspan><tspan x="583.5" dy="16.625">외운 규칙을 돌리는</tspan><tspan x="583.5" dy="16.625">그 사람 안에</tspan><tspan x="583.5" dy="16.625">별개의 체계가</tspan><tspan x="583.5" dy="16.625">구현된 것이고,</tspan><tspan x="583.5" dy="16.625">그 체계에 대해</tspan><tspan x="583.5" dy="16.625">사람의 보고는</tspan><tspan x="583.5" dy="16.625">권위를 갖지 않는다</tspan></text><text x="877.5" y="2159" class="fill-N1 s1"><tspan x="877.5" dy="0">되받음</tspan><tspan x="877.5" dy="16.625">이어짐이 문제라는 것을</tspan><tspan x="877.5" dy="16.625">설도 인정한 셈이므로,</tspan><tspan x="877.5" dy="16.625">남은 물음은</tspan><tspan x="877.5" dy="16.625">어떤 이어짐이</tspan><tspan x="877.5" dy="16.625">원초적 지향성을 낳는가이다.</tspan><tspan x="877.5" dy="16.625">그것이 앞 절의</tspan><tspan x="877.5" dy="16.625">자연화 계획이다</tspan></text><text x="1161.5" y="2167" class="fill-N1 s1"><tspan x="1161.5" dy="0">되받음</tspan><tspan x="1161.5" dy="16.714">뉴런과 수도관을</tspan><tspan x="1161.5" dy="16.714">나누는 기준을 대야 하는데,</tspan><tspan x="1161.5" dy="16.714">그 기준을</tspan><tspan x="1161.5" dy="16.714">물리적 재료로 적으면</tspan><tspan x="1161.5" dy="16.714">14장의 유형 동일론으로</tspan><tspan x="1161.5" dy="16.714">되돌아간다</tspan></text><text x="868.5" y="2372" class="fill-N1 s1"><tspan x="868.5" dy="0">어느 화살표도 끝나 있지 않다</tspan><tspan x="868.5" dy="16.625">방법론적 비판도 있다 — 이 사고실험은 방을 느리고 작게 그려 놓는다.</tspan><tspan x="868.5" dy="16.625">종이 한 장, 사람 하나, 규칙집 한 권.</tspan><tspan x="868.5" dy="16.625">그 그림에서 ‘이해가 없다’ 는 판단이 쉽게 나오는 것이</tspan><tspan x="868.5" dy="16.625">규모의 낯섦 때문이라면,</tspan><tspan x="868.5" dy="16.625">14장의 중국 인민 논증에 대한 응답이 여기에도 그대로 온다.</tspan><tspan x="868.5" dy="16.625">설의 논증이 결정적이라고 보는 쪽과</tspan><tspan x="868.5" dy="16.625">체계 응답이 이미 답했다고 보는 쪽이 모두 살아 있다</tspan></text><g ><g class="shape"><path d="M470 286h255v82H470z" class="stroke-B1 fill-B5 s0"/></g><text x="597.5" y="324.5" class="text-bold fill-N1 s1"><tspan x="597.5" dy="0">들어오는 것</tspan><tspan x="597.5" dy="18.5">중국어 문장이 적힌 종이</tspan></text></g><g ><g class="shape"><path d="M571 448h281v98H571z" class="stroke-B1 fill-B5 s0"/></g><text x="711.5" y="486.5" class="text-bold fill-N1 s1"><tspan x="711.5" dy="0">방 안의 사람</tspan><tspan x="711.5" dy="17.667">중국어를 한 마디도 모른다.</tspan><tspan x="711.5" dy="17.667">기호의 모양만 본다</tspan></text></g><g ><g class="shape"><path d="M687 102h276v114H687z" class="stroke-B1 fill-B5 s0"/></g><text x="825" y="140.5" class="text-bold fill-N1 s1"><tspan x="825" dy="0">규칙집</tspan><tspan x="825" dy="17.25">들어온 기호의 모양만 보고</tspan><tspan x="825" dy="17.25">어떤 기호를 내보낼지</tspan><tspan x="825" dy="17.25">적혀 있다</tspan></text></g><g ><g class="shape"><path d="M668 626h255v82H668z" class="stroke-B1 fill-B5 s0"/></g><text x="795.5" y="664.5" class="text-bold fill-N1 s1"><tspan x="795.5" dy="0">나가는 것</tspan><tspan x="795.5" dy="18.5">중국어 문장이 적힌 종이</tspan></text></g><marker id="mk-d2-435375672-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M664.75 370v74" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M825.583 218v226" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><text x="825.5" y="338" class="text-italic fill-N2 s1">모양만 보고 고른다</text><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M795.833 548v74" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="m866.082 710-.08 129" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M627.333 548v245s0 10-10 10h-50.25s-10 0-10.003 10l-.078 253" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><text x="586.5" y="809" class="text-italic fill-N2 s1">그런데 이 사람은 이해하지 못한다</text><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M782 937v90" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><marker id="mk-d2-435375672-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-435375672-2177206569)" d="m585 1293-.015 57s-.002 10-10.002 10H324s-10 0-10 10v76" class="connection stroke-B2 s2" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="m669.012 1320 .33 80s.041 10-9.959 10H555s-10 0-10 10v304" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><text x="545" y="1466" class="text-italic fill-N2 s1">응답 ①</text><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="m753.998 1320-.213 409" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><text x="754" y="1531" class="text-italic fill-N2 s1">응답 ②</text><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="m838.008 1293 .149 57s.026 10 10.026 10h303.983s10 0 10 10v343" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><text x="1144" y="1366" class="text-italic fill-N2 s1">응답 ③</text><path fill="none" marker-end="url(#mk-d2-435375672-2177206569)" d="M505.833 1860v33s0 10-10 10H174s-10 0-10 10v26" class="connection stroke-B2 s2" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-2177206569)" d="M88 1941V22s0-10 10-10h446.166s10 0 10 10v26" class="connection stroke-B2 s2" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M584.166 1860v79" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M878.166 1849v90" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M1162.166 1865v74" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M584.166 2075v64" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M878.166 2075v64" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-3488378134)" d="M1162.166 2075v72" class="connection stroke-B1 s0" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-2177206569)" d="M584.166 2278v28s0 10 10 10H715.55s10 0 10 10v26" class="connection stroke-B2 s2" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-2177206569)" d="M869.3 2278v74" class="connection stroke-B2 s2" mask="url(#d2-435375672)"/><path fill="none" marker-end="url(#mk-d2-435375672-2177206569)" d="M1162.166 2270v36s0 10-10 10H1023.05s-10 0-10 10v26" class="connection stroke-B2 s2" mask="url(#d2-435375672)"/><mask id="d2-435375672" width="1478" height="2679" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1478v2679H-89z"/><path d="M743 322h165v21H743zM443 793h287v21H443zM517 1450h56v21h-56zM726 1515h56v21h-56zM1116 1350h56v21h-56z"/></mask></svg>