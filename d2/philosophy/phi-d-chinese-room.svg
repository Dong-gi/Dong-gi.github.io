<svg xmlns="http://www.w3.org/2000/svg" width="2998" height="2332" class="d2-468233802 d2-svg" viewBox="-101 -121 2998 2332"><rect width="2998" height="2332" x="-101" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-468233802 .fill-N1{fill:#0a0f25}.d2-468233802 .fill-N2{fill:#676c7e}.d2-468233802 .fill-B5{fill:#edf0fd}.d2-468233802 .fill-B6{fill:#f7f8fe}.d2-468233802 .stroke-B1,.d2-468233802 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M39 20h1770v559H39z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="924" y="7" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">방 안의 배치</text></g><g ><g class="shape"><ellipse cx="1619.5" cy="799" class="shape stroke-B1 fill-B6 s0" rx="237.5" ry="79"/></g><text x="1619.5" y="796.5" class="text-bold fill-N1 s1"><tspan x="1619.5" dy="0">바깥에서 보면</tspan><tspan x="1619.5" dy="18.5">방은 중국어로 유창하게 대화한다</tspan></text></g><g ><g class="shape"><ellipse cx="1566" cy="1158.5" class="shape stroke-B1 fill-B6" rx="541" ry="180.5" style="stroke-width:4"/></g><text x="1566" y="1132" class="text-bold fill-N1 s1"><tspan x="1566" dy="0">설의 논증 — 이 그림의 가운데</tspan><tspan x="1566" dy="17">(P1) 프로그램은 형식적이다. 기호를 모양으로만 다룬다.</tspan><tspan x="1566" dy="17">(P2) 마음에는 내용이 있다. 마음 상태는 무언가에 관한다.</tspan><tspan x="1566" dy="17">(P3) 모양을 다루는 것만으로는 내용이 생기지 않는다. 방 안의 사람이 그것을 보인다.</tspan><tspan x="1566" dy="17">(C) 그러므로 프로그램을 돌리는 것만으로는 마음이 생기지 않는다</tspan></text></g><text x="2297" y="1483" class="fill-N1 s1"><tspan x="2297" dy="0">겨냥하는 것과 겨냥하지 않는 것</tspan><tspan x="2297" dy="17">겨냥하는 것 — ‘알맞게 프로그램된 컴퓨터는 문자 그대로 마음을 갖는다’.</tspan><tspan x="2297" dy="17">설은 이것을 강한 인공지능이라 불렀다. 다르게 적으면 계산이 이해에 충분한가이고, 그의 답은 아니라는 것이다.</tspan><tspan x="2297" dy="17">겨냥하지 않는 것 — 기계가 생각할 수 있는가. 설은 이 물음에 그렇다고 답한다. 뇌는 하나의 기계이고 생각하기 때문이다.</tspan><tspan x="2297" dy="17">이 두 물음을 섞으면 논쟁 전체가 헛돈다</tspan></text><g ><g class="shape"><path d="M1359 1460h379v98h-379z" class="stroke-B1 fill-B6 s0"/></g><text x="1548.5" y="1498.5" class="text-bold fill-N1 s1"><tspan x="1548.5" dy="0">체계 응답</tspan><tspan x="1548.5" dy="17.667">이해하는 것은 방 안의 사람이 아니라</tspan><tspan x="1548.5" dy="17.667">사람 · 규칙집 · 종이를 합친 체계 전체다</tspan></text></g><g ><g class="shape"><path d="M866 1460h424v98H866z" class="stroke-B1 fill-B6 s0"/></g><text x="1078" y="1498.5" class="text-bold fill-N1 s1"><tspan x="1078" dy="0">로봇 응답</tspan><tspan x="1078" dy="17.667">방을 로봇에 넣어 감각기와 팔다리를 붙이면</tspan><tspan x="1078" dy="17.667">기호가 세상에 이어진다</tspan></text></g><g ><g class="shape"><path d="M322 1460h484v98H322z" class="stroke-B1 fill-B6 s0"/></g><text x="564" y="1498.5" class="text-bold fill-N1 s1"><tspan x="564" dy="0">뇌 시뮬레이터 응답</tspan><tspan x="564" dy="17.667">중국어 화자의 뇌에서 일어나는 일을</tspan><tspan x="564" dy="17.667">뉴런 하나하나까지 흉내 내는 프로그램이면 어떤가</tspan></text></g><text x="1168" y="1697" class="fill-N1 s1"><tspan x="1168" dy="0">체계 응답이 가리키는 곳</tspan><tspan x="1168" dy="17.667">방 안의 사람 하나가 아니라 방 전체다.</tspan><tspan x="1168" dy="17.667">사람은 그 체계의 한 부품일 뿐이라는 것이다</tspan></text><g ><g class="shape"><path d="M1805 1658h452v98h-452z" class="stroke-B2 fill-B6 s2"/></g><text x="2031" y="1696.5" class="text-bold fill-N1 s1"><tspan x="2031" dy="0">설의 재반박</tspan><tspan x="2031" dy="17.667">규칙집을 다 외우고 밖으로 나오면</tspan><tspan x="2031" dy="17.667">체계가 곧 그 사람인데, 그래도 이해하지 못한다</tspan></text></g><g ><g class="shape"><path d="M455 1658h467v98H455z" class="stroke-B2 fill-B6 s2"/></g><text x="688.5" y="1696.5" class="text-bold fill-N1 s1"><tspan x="688.5" dy="0">설의 재반박</tspan><tspan x="688.5" dy="17.667">로봇의 카메라에서 오는 것도 결국 기호일 뿐이라</tspan><tspan x="688.5" dy="17.667">방 안 사람에게는 달라지는 것이 없다</tspan></text></g><g ><g class="shape"><path d="M0 1658h380v98H0z" class="stroke-B2 fill-B6 s2"/></g><text x="190" y="1696.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">설의 재반박</tspan><tspan x="190" dy="17.667">수도관과 밸브로 같은 구조를 만들어도</tspan><tspan x="190" dy="17.667">물이 흐를 뿐 이해는 없다</tspan></text></g><text x="2030.5" y="1880" class="fill-N1 s1"><tspan x="2030.5" dy="0">되받음</tspan><tspan x="2030.5" dy="17.667">외운 규칙을 돌리는 그 사람 안에 별개의 체계가 구현된 것이고,</tspan><tspan x="2030.5" dy="17.667">그 체계에 대해 사람의 보고는 권위를 갖지 않는다</tspan></text><text x="688.5" y="1872" class="fill-N1 s1"><tspan x="688.5" dy="0">되받음</tspan><tspan x="688.5" dy="17.25">이어짐이 문제라는 것을 설도 인정한 셈이므로,</tspan><tspan x="688.5" dy="17.25">남은 물음은 어떤 이어짐이 원초적 지향성을 낳는가이다.</tspan><tspan x="688.5" dy="17.25">그것이 앞 절의 자연화 계획이다</tspan></text><text x="190.5" y="1872" class="fill-N1 s1"><tspan x="190.5" dy="0">되받음</tspan><tspan x="190.5" dy="17.25">뉴런과 수도관을 나누는 기준을 대야 하는데,</tspan><tspan x="190.5" dy="17.25">그 기준을 물리적 재료로 적으면</tspan><tspan x="190.5" dy="17.25">14장의 유형 동일론으로 되돌아간다</tspan></text><text x="660.5" y="2041" class="fill-N1 s1"><tspan x="660.5" dy="0">어느 화살표도 끝나 있지 않다</tspan><tspan x="660.5" dy="17">방법론적 비판도 있다 — 이 사고실험은 방을 느리고 작게 그려 놓는다.</tspan><tspan x="660.5" dy="17">종이 한 장, 사람 하나, 규칙집 한 권. 그 그림에서 ‘이해가 없다’ 는 판단이 쉽게 나오는 것이</tspan><tspan x="660.5" dy="17">규모의 낯섦 때문이라면, 14장의 중국 인민 논증에 대한 응답이 여기에도 그대로 온다.</tspan><tspan x="660.5" dy="17">설의 논증이 결정적이라고 보는 쪽과 체계 응답이 이미 답했다고 보는 쪽이 모두 살아 있다</tspan></text><g ><g class="shape"><path d="M69 58h255v82H69z" class="stroke-B1 fill-B5 s0"/></g><text x="196.5" y="96.5" class="text-bold fill-N1 s1"><tspan x="196.5" dy="0">들어오는 것</tspan><tspan x="196.5" dy="18.5">중국어 문장이 적힌 종이</tspan></text></g><g ><g class="shape"><path d="M1426 269h281v98h-281z" class="stroke-B1 fill-B5 s0"/></g><text x="1566.5" y="307.5" class="text-bold fill-N1 s1"><tspan x="1566.5" dy="0">방 안의 사람</tspan><tspan x="1566.5" dy="17.667">중국어를 한 마디도 모른다.</tspan><tspan x="1566.5" dy="17.667">기호의 모양만 본다</tspan></text></g><g ><g class="shape"><path d="M1460 50h319v98h-319z" class="stroke-B1 fill-B5 s0"/></g><text x="1619.5" y="88.5" class="text-bold fill-N1 s1"><tspan x="1619.5" dy="0">규칙집</tspan><tspan x="1619.5" dy="17.667">들어온 기호의 모양만 보고</tspan><tspan x="1619.5" dy="17.667">어떤 기호를 내보낼지 적혀 있다</tspan></text></g><g ><g class="shape"><path d="M1492 467h255v82h-255z" class="stroke-B1 fill-B5 s0"/></g><text x="1619.5" y="505.5" class="text-bold fill-N1 s1"><tspan x="1619.5" dy="0">나가는 것</tspan><tspan x="1619.5" dy="18.5">중국어 문장이 적힌 종이</tspan></text></g><marker id="mk-d2-468233802-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M306.87 140.209C450.6 194.7 674.75 227.548 1421.77 303.34" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M1619 149.5c0 46.8-5.8 71.2-27.283 116.387" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><text x="1615.5" y="217" class="text-italic fill-N2 s1">모양만 보고 고른다</text><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M1592.95 368.76C1613.6 407 1619 427 1619 463" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M1619 551v165" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M1423.759 331.28C688.349 399.818 504 435.2 504 462.5v266.75c0 41.85 121.8 225.15 604.113 329.69" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><text x="504.5" y="504" class="text-italic fill-N2 s1">그런데 이 사람은 이해하지 못한다</text><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M1619 880c0 38-2.2 58.2-9.946 94.112" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><marker id="mk-d2-468233802-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-468233802-2177206569)" d="M1953.848 1285.942C2228 1376.6 2297.25 1412.9 2297.25 1462.5" class="connection stroke-B2 s2" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M1552.79 1341.993c-3.19 45.407-4.04 69.707-4.04 114.507" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><text x="1549" y="1405" class="text-italic fill-N2 s1">응답 ①</text><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M1260.312 1309.331C1115.2 1381.2 1078.25 1411.7 1078.25 1456.5" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><text x="1146" y="1372" class="text-italic fill-N2 s1">응답 ②</text><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M1124.083 1264.702C676.8 1372.4 564.25 1411.7 564.25 1456.5" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><text x="820" y="1343" class="text-italic fill-N2 s1">응답 ③</text><path fill="none" marker-end="url(#mk-d2-468233802-2177206569)" d="M1553.949 1559.99c3.801 38.01-52.394 62.51-277.295 119.527" class="connection stroke-B2 s2" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-2177206569)" d="M979.759 1688.81C302.549 1624.2 132.75 1588.2 132.75 1558.5v-976" class="connection stroke-B2 s2" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M1433.163 1558.792c-90.963 39.208-17.013 62.72 367.625 116.22" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M1078.25 1560c0 38-39.401 58-193.123 97.016" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M564.25 1560c0 38-37.8 58-185.133 96.977" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M2030.75 1758v102" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M688.75 1758v94" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-3488378134)" d="M190 1758v94" class="connection stroke-B1 s0" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-2177206569)" d="M2030.75 1919c0 44.4-199 69.4-991.009 122.731" class="connection stroke-B2 s2" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-2177206569)" d="M688.75 1927c0 38-3 58-13.85 94.169" class="connection stroke-B2 s2" mask="url(#d2-468233802)"/><path fill="none" marker-end="url(#mk-d2-468233802-2177206569)" d="M190 1927c0 38 50.8 58 250.075 97.227" class="connection stroke-B2 s2" mask="url(#d2-468233802)"/><mask id="d2-468233802" width="2998" height="2332" x="-101" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-121h2998v2332H-101z"/><path d="M1533 201h165v21h-165zM361 488h287v21H361zM1521 1389h56v21h-56zM1118 1356h56v21h-56zM792 1327h56v21h-56z"/></mask></svg>