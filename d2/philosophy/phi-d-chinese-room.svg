<svg xmlns="http://www.w3.org/2000/svg" width="1185" height="2999" class="d2-748609724 d2-svg" viewBox="-89 -89 1185 2999"><rect width="1185" height="2999" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-748609724 .text-bold{font-weight:700}.d2-748609724 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-748609724 .fill-N1{fill:#0a0f25}.d2-748609724 .fill-N2{fill:#676c7e}.d2-748609724 .fill-B5{fill:#edf0fd}.d2-748609724 .fill-B6{fill:#f7f8fe}.d2-748609724 .stroke-B1,.d2-748609724 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M239 52h594v706H239z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="536" y="85" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">방 안의 배치</text></g><g ><g class="shape"><ellipse cx="648.5" cy="893.5" class="shape stroke-B1 fill-B6 s0" rx="146.5" ry="50.5"/></g><text x="648.5" y="883" class="text-bold fill-N1 s1"><tspan x="648.5" dy="0">바깥에서 보면</tspan><tspan x="648.5" dy="17.667">방은 중국어로</tspan><tspan x="648.5" dy="17.667">유창하게 대화한다</tspan></text></g><g ><g class="shape"><ellipse cx="530" cy="1172" class="shape stroke-B1 fill-B6" rx="211" ry="148" style="stroke-width:4"/></g><text x="530" y="1097.5" class="text-bold fill-N1 s1"><tspan x="530" dy="0">설의 논증 — 이 그림의 가운데</tspan><tspan x="530" dy="16.455">(P1) 프로그램은 형식적이다.</tspan><tspan x="530" dy="16.455">기호를 모양으로만 다룬다.</tspan><tspan x="530" dy="16.455">(P2) 마음에는 내용이 있다.</tspan><tspan x="530" dy="16.455">마음 상태는 무언가에 관한다.</tspan><tspan x="530" dy="16.455">(P3) 모양을 다루는 것만으로는</tspan><tspan x="530" dy="16.455">내용이 생기지 않는다.</tspan><tspan x="530" dy="16.455">방 안의 사람이 그것을 보인다.</tspan><tspan x="530" dy="16.455">(C) 그러므로 프로그램을</tspan><tspan x="530" dy="16.455">돌리는 것만으로는</tspan><tspan x="530" dy="16.455">마음이 생기지 않는다</tspan></text></g><text x="230" y="1466" class="fill-N1 s1"><tspan x="230" dy="0">겨냥하는 것과</tspan><tspan x="230" dy="16.263">겨냥하지 않는 것</tspan><tspan x="230" dy="16.263">겨냥하는 것 —</tspan><tspan x="230" dy="16.263">‘알맞게 프로그램된</tspan><tspan x="230" dy="16.263">컴퓨터는 문자 그대로</tspan><tspan x="230" dy="16.263">마음을 갖는다’.</tspan><tspan x="230" dy="16.263">설은 이것을</tspan><tspan x="230" dy="16.263">강한 인공지능이라 불렀다.</tspan><tspan x="230" dy="16.263">다르게 적으면</tspan><tspan x="230" dy="16.263">계산이 이해에 충분한가이고,</tspan><tspan x="230" dy="16.263">그의 답은 아니라는 것이다.</tspan><tspan x="230" dy="16.263">겨냥하지 않는 것 —</tspan><tspan x="230" dy="16.263">기계가 생각할 수 있는가.</tspan><tspan x="230" dy="16.263">설은 이 물음에</tspan><tspan x="230" dy="16.263">그렇다고 답한다.</tspan><tspan x="230" dy="16.263">뇌는 하나의 기계이고</tspan><tspan x="230" dy="16.263">생각하기 때문이다.</tspan><tspan x="230" dy="16.263">이 두 물음을 섞으면</tspan><tspan x="230" dy="16.263">논쟁 전체가 헛돈다</tspan></text><g ><g class="shape"><path d="M303 1850h191v162H303z" class="stroke-B1 fill-B6 s0"/></g><text x="398.5" y="1888.5" class="text-bold fill-N1 s1"><tspan x="398.5" dy="0">체계 응답</tspan><tspan x="398.5" dy="16.714">이해하는 것은</tspan><tspan x="398.5" dy="16.714">방 안의 사람이</tspan><tspan x="398.5" dy="16.714">아니라</tspan><tspan x="398.5" dy="16.714">사람 · 규칙집 ·</tspan><tspan x="398.5" dy="16.714">종이를</tspan><tspan x="398.5" dy="16.714">합친 체계 전체다</tspan></text></g><g ><g class="shape"><path d="M557 1853h209v146H557z" class="stroke-B1 fill-B6 s0"/></g><text x="661.5" y="1891.5" class="text-bold fill-N1 s1"><tspan x="661.5" dy="0">로봇 응답</tspan><tspan x="661.5" dy="16.833">방을 로봇에 넣어</tspan><tspan x="661.5" dy="16.833">감각기와 팔다리를</tspan><tspan x="661.5" dy="16.833">붙이면</tspan><tspan x="661.5" dy="16.833">기호가 세상에</tspan><tspan x="661.5" dy="16.833">이어진다</tspan></text></g><g ><g class="shape"><path d="M786 1829h209v194H786z" class="stroke-B1 fill-B6 s0"/></g><text x="890.5" y="1867.5" class="text-bold fill-N1 s1"><tspan x="890.5" dy="0">뇌 시뮬레이터</tspan><tspan x="890.5" dy="16.556">응답</tspan><tspan x="890.5" dy="16.556">중국어 화자의</tspan><tspan x="890.5" dy="16.556">뇌에서</tspan><tspan x="890.5" dy="16.556">일어나는 일을</tspan><tspan x="890.5" dy="16.556">뉴런 하나하나까지</tspan><tspan x="890.5" dy="16.556">흉내 내는</tspan><tspan x="890.5" dy="16.556">프로그램이면</tspan><tspan x="890.5" dy="16.556">어떤가</tspan></text></g><text x="93.5" y="2119" class="fill-N1 s1"><tspan x="93.5" dy="0">체계 응답이</tspan><tspan x="93.5" dy="16.625">가리키는 곳</tspan><tspan x="93.5" dy="16.625">방 안의 사람</tspan><tspan x="93.5" dy="16.625">하나가 아니라</tspan><tspan x="93.5" dy="16.625">방 전체다.</tspan><tspan x="93.5" dy="16.625">사람은 그 체계의</tspan><tspan x="93.5" dy="16.625">한 부품일 뿐이라는</tspan><tspan x="93.5" dy="16.625">것이다</tspan></text><g ><g class="shape"><path d="M325 2111h212v162H325z" class="stroke-B2 fill-B6 s2"/></g><text x="431" y="2149.5" class="text-bold fill-N1 s1"><tspan x="431" dy="0">설의 재반박</tspan><tspan x="431" dy="16.714">규칙집을 다 외우고</tspan><tspan x="431" dy="16.714">밖으로 나오면</tspan><tspan x="431" dy="16.714">체계가 곧</tspan><tspan x="431" dy="16.714">그 사람인데,</tspan><tspan x="431" dy="16.714">그래도</tspan><tspan x="431" dy="16.714">이해하지 못한다</tspan></text></g><g ><g class="shape"><path d="M557 2103h209v178H557z" class="stroke-B2 fill-B6 s2"/></g><text x="661.5" y="2141.5" class="text-bold fill-N1 s1"><tspan x="661.5" dy="0">설의 재반박</tspan><tspan x="661.5" dy="16.625">로봇의 카메라에서</tspan><tspan x="661.5" dy="16.625">오는 것도</tspan><tspan x="661.5" dy="16.625">결국 기호일</tspan><tspan x="661.5" dy="16.625">뿐이라</tspan><tspan x="661.5" dy="16.625">방 안 사람에게는</tspan><tspan x="661.5" dy="16.625">달라지는 것이</tspan><tspan x="661.5" dy="16.625">없다</tspan></text></g><g ><g class="shape"><path d="M796 2119h188v146H796z" class="stroke-B2 fill-B6 s2"/></g><text x="890" y="2157.5" class="text-bold fill-N1 s1"><tspan x="890" dy="0">설의 재반박</tspan><tspan x="890" dy="16.833">수도관과 밸브로</tspan><tspan x="890" dy="16.833">같은 구조를</tspan><tspan x="890" dy="16.833">만들어도</tspan><tspan x="890" dy="16.833">물이 흐를 뿐</tspan><tspan x="890" dy="16.833">이해는 없다</tspan></text></g><text x="430.5" y="2375" class="fill-N1 s1"><tspan x="430.5" dy="0">되받음</tspan><tspan x="430.5" dy="16.5">외운 규칙을</tspan><tspan x="430.5" dy="16.5">돌리는</tspan><tspan x="430.5" dy="16.5">그 사람 안에</tspan><tspan x="430.5" dy="16.5">별개의 체계가</tspan><tspan x="430.5" dy="16.5">구현된 것이고,</tspan><tspan x="430.5" dy="16.5">그 체계에 대해</tspan><tspan x="430.5" dy="16.5">사람의 보고는</tspan><tspan x="430.5" dy="16.5">권위를 갖지</tspan><tspan x="430.5" dy="16.5">않는다</tspan></text><text x="661.5" y="2367" class="fill-N1 s1"><tspan x="661.5" dy="0">되받음</tspan><tspan x="661.5" dy="16.455">이어짐이 문제라는</tspan><tspan x="661.5" dy="16.455">것을</tspan><tspan x="661.5" dy="16.455">설도 인정한</tspan><tspan x="661.5" dy="16.455">셈이므로,</tspan><tspan x="661.5" dy="16.455">남은 물음은</tspan><tspan x="661.5" dy="16.455">어떤 이어짐이</tspan><tspan x="661.5" dy="16.455">원초적 지향성을</tspan><tspan x="661.5" dy="16.455">낳는가이다.</tspan><tspan x="661.5" dy="16.455">그것이 앞 절의</tspan><tspan x="661.5" dy="16.455">자연화 계획이다</tspan></text><text x="890" y="2375" class="fill-N1 s1"><tspan x="890" dy="0">되받음</tspan><tspan x="890" dy="16.5">뉴런과 수도관을</tspan><tspan x="890" dy="16.5">나누는 기준을</tspan><tspan x="890" dy="16.5">대야 하는데,</tspan><tspan x="890" dy="16.5">그 기준을</tspan><tspan x="890" dy="16.5">물리적 재료로</tspan><tspan x="890" dy="16.5">적으면</tspan><tspan x="890" dy="16.5">14장의</tspan><tspan x="890" dy="16.5">유형 동일론으로</tspan><tspan x="890" dy="16.5">되돌아간다</tspan></text><text x="646.5" y="2628" class="fill-N1 s1"><tspan x="646.5" dy="0">어느 화살표도 끝나 있지 않다</tspan><tspan x="646.5" dy="16.417">방법론적 비판도 있다 —</tspan><tspan x="646.5" dy="16.417">이 사고실험은 방을 느리고 작게 그려 놓는다.</tspan><tspan x="646.5" dy="16.417">종이 한 장, 사람 하나, 규칙집 한 권.</tspan><tspan x="646.5" dy="16.417">그 그림에서 ‘이해가 없다’ 는 판단이</tspan><tspan x="646.5" dy="16.417">쉽게 나오는 것이</tspan><tspan x="646.5" dy="16.417">규모의 낯섦 때문이라면,</tspan><tspan x="646.5" dy="16.417">14장의 중국 인민 논증에 대한 응답이</tspan><tspan x="646.5" dy="16.417">여기에도 그대로 온다.</tspan><tspan x="646.5" dy="16.417">설의 논증이 결정적이라고 보는 쪽과</tspan><tspan x="646.5" dy="16.417">체계 응답이 이미 답했다고 보는 쪽이</tspan><tspan x="646.5" dy="16.417">모두 살아 있다</tspan></text><g ><g class="shape"><path d="M289 286h255v82H289z" class="stroke-B1 fill-B5 s0"/></g><text x="416.5" y="324.5" class="text-bold fill-N1 s1"><tspan x="416.5" dy="0">들어오는 것</tspan><tspan x="416.5" dy="18.5">중국어 문장이 적힌 종이</tspan></text></g><g ><g class="shape"><path d="M390 448h281v98H390z" class="stroke-B1 fill-B5 s0"/></g><text x="530.5" y="486.5" class="text-bold fill-N1 s1"><tspan x="530.5" dy="0">방 안의 사람</tspan><tspan x="530.5" dy="17.667">중국어를 한 마디도 모른다.</tspan><tspan x="530.5" dy="17.667">기호의 모양만 본다</tspan></text></g><g ><g class="shape"><path d="M506 102h276v114H506z" class="stroke-B1 fill-B5 s0"/></g><text x="644" y="140.5" class="text-bold fill-N1 s1"><tspan x="644" dy="0">규칙집</tspan><tspan x="644" dy="17.25">들어온 기호의 모양만 보고</tspan><tspan x="644" dy="17.25">어떤 기호를 내보낼지</tspan><tspan x="644" dy="17.25">적혀 있다</tspan></text></g><g ><g class="shape"><path d="M487 626h255v82H487z" class="stroke-B1 fill-B5 s0"/></g><text x="614.5" y="664.5" class="text-bold fill-N1 s1"><tspan x="614.5" dy="0">나가는 것</tspan><tspan x="614.5" dy="18.5">중국어 문장이 적힌 종이</tspan></text></g><marker id="mk-d2-748609724-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M483.666 370v74" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M644.5 218v226" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><text x="644.5" y="338" class="text-italic fill-N2 s1">모양만 보고 고른다</text><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M614.75 548v74" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="m649.507 710 .478 129" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M446.25 548v245s0 10-10 10h-14.751s-10 0-9.98 10l.47 232" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><text x="433.5" y="801" class="text-italic fill-N2 s1"><tspan x="433.5" dy="0">그런데 이 사람은</tspan><tspan x="433.5" dy="18.5">이해하지 못한다</tspan></text><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M601 943v84" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><marker id="mk-d2-748609724-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-748609724-2177206569)" d="m403.996 1293-.082 57s-.014 10-10.014 10H240.333s-10 0-10 10v76" class="connection stroke-B2 s2" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="m488.01 1320 .258 80s.032 10-9.968 10h-68.967s-10 0-10 10v426" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><text x="399" y="1545" class="text-italic fill-N2 s1">응답 ①</text><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="m572.998 1320-.296 529" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><text x="573" y="1591" class="text-italic fill-N2 s1">응답 ②</text><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="m657.004 1293 .082 57s.014 10 10.014 10h213.566s10 0 10 10v455" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><text x="891" y="1448" class="text-italic fill-N2 s1">응답 ③</text><path fill="none" marker-end="url(#mk-d2-748609724-2177206569)" d="M367.5 2014v39s0 10-10 10H130.666s-10 0-10 10v26" class="connection stroke-B2 s2" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-2177206569)" d="M66.333 2101V22s0-10 10-10h286.75s10 0 10 10v26" class="connection stroke-B2 s2" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M431.166 2014v93" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M661.666 2001v98" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M890.666 2025v90" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M431.166 2275v80" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M661.666 2283v64" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-3488378134)" d="M890.666 2267v88" class="connection stroke-B1 s0" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-2177206569)" d="M431.166 2526v36s0 10 10 10h101.75s10 0 10 10v26" class="connection stroke-B2 s2" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-2177206569)" d="M646.666 2534v74" class="connection stroke-B2 s2" mask="url(#d2-748609724)"/><path fill="none" marker-end="url(#mk-d2-748609724-2177206569)" d="M890.666 2526v36s0 10-10 10h-130.25s-10 0-10 10v26" class="connection stroke-B2 s2" mask="url(#d2-748609724)"/><mask id="d2-748609724" width="1185" height="2999" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1185v2999H-89z"/><path d="M562 322h165v21H562zM361 785h145v37H361zM371 1529h56v21h-56zM545 1575h56v21h-56zM863 1432h56v21h-56z"/></mask></svg>