<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1253" class="d2-3529416611 d2-svg" viewBox="-101 -101 1140 1253"><rect width="1140" height="1253" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3529416611 .fill-N1{fill:#0a0f25}.d2-3529416611 .fill-N2{fill:#676c7e}.d2-3529416611 .fill-B6{fill:#f7f8fe}.d2-3529416611 .stroke-B1,.d2-3529416611 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h366v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="183" y="46.5" class="text-bold fill-N1 s1"><tspan x="183" dy="0">① 명시적 동의</tspan><tspan x="183" dy="17.667">말이나 서명으로 실제로 동의했다</tspan><tspan x="183" dy="17.667">귀화 선서, 공직 취임 선서</tspan></text></g><g ><g class="shape"><path d="M466 0h472v114H466z" class="stroke-B2 fill-B6 s2"/></g><text x="702" y="38.5" class="text-bold fill-N1 s1"><tspan x="702" dy="0">걸리는 자리 — 사실 문제</tspan><tspan x="702" dy="17.25">이 나라에서 동의를 말이나 서명으로</tspan><tspan x="702" dy="17.25">표한 사람이 인구 중 몇이나 되는가.</tspan><tspan x="702" dy="17.25">그러면 나머지에게는 권위가 없는가</tspan></text></g><g ><g class="shape"><path d="M0 204h366v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="183" y="242.5" class="text-bold fill-N1 s1"><tspan x="183" dy="0">② 묵시적 동의 — 로크</tspan><tspan x="183" dy="17.25">떠나지 않고 머무르며</tspan><tspan x="183" dy="17.25">도로를 쓰고 재산을 누린다면</tspan><tspan x="183" dy="17.25">그 자체가 동의로 읽힌다</tspan></text></g><g ><g class="shape"><path d="M466 204h472v114H466z" class="stroke-B2 fill-B6 s2"/></g><text x="702" y="242.5" class="text-bold fill-N1 s1"><tspan x="702" dy="0">걸리는 자리 — 흄</tspan><tspan x="702" dy="17.25">떠날 수 없는 사람의 머무름은 동의가 아니다.</tspan><tspan x="702" dy="17.25">잠든 채 배에 실려 온 사람에게 뛰어내리든지</tspan><tspan x="702" dy="17.25">선장을 따르든지 고르라는 것과 같다</tspan></text></g><g ><g class="shape"><path d="M0 408h366v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="183" y="454.5" class="text-bold fill-N1 s1"><tspan x="183" dy="0">③ 가설적 동의</tspan><tspan x="183" dy="17.667">실제로 동의하지 않았어도,</tspan><tspan x="183" dy="17.667">합리적이라면 동의했을 것이다</tspan></text></g><g ><g class="shape"><path d="M466 408h472v114H466z" class="stroke-B2 fill-B6 s2"/></g><text x="702" y="446.5" class="text-bold fill-N1 s1"><tspan x="702" dy="0">걸리는 자리 — 가설적 계약은 계약이 아니다</tspan><tspan x="702" dy="17.25">내가 동의했을 것이라는 사실은 나를 묶지 못한다.</tspan><tspan x="702" dy="17.25">묶는 힘이 있다면 그것은 동의가 아니라</tspan><tspan x="702" dy="17.25">동의했을 이유 쪽에서 온다</tspan></text></g><g ><g class="shape"><path d="M0 612h366v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="183" y="650.5" class="text-bold fill-N1 s1"><tspan x="183" dy="0">④ 동의를 아예 쓰지 않는 길</tspan><tspan x="183" dy="17.25">정의로운 제도를 지지할 자연적 의무,</tspan><tspan x="183" dy="17.25">또는 이익을 받았으면 몫을 지라는</tspan><tspan x="183" dy="17.25">공정한 몫의 원리</tspan></text></g><g ><g class="shape"><path d="M466 612h472v114H466z" class="stroke-B2 fill-B6 s2"/></g><text x="702" y="650.5" class="text-bold fill-N1 s1"><tspan x="702" dy="0">걸리는 자리 — 받은 적 없는 이익</tspan><tspan x="702" dy="17.25">요청하지도 않은 이익을 받았다고 해서</tspan><tspan x="702" dy="17.25">값을 물릴 수 있는가. 이 길은 동의를 버린 만큼</tspan><tspan x="702" dy="17.25">국가만 특별히 대접할 이유도 함께 잃는다</tspan></text></g><g ><g class="shape"><path d="M466 816h472v130H466z" class="stroke-B1 fill-B6 s0"/></g><text x="702" y="854.5" class="text-bold fill-N1 s1"><tspan x="702" dy="0">철학적 무정부주의</tspan><tspan x="702" dy="17">네 길이 다 막힌다면 남는 결론이 이것이다.</tspan><tspan x="702" dy="17">국가에 복종할 일반적 도덕적 의무는 없다.</tspan><tspan x="702" dy="17">국가를 없애자는 주장이 아니라, 복종의 의무가</tspan><tspan x="702" dy="17">따로 있지는 않다는 주장이다</tspan></text></g><text x="469" y="982" class="fill-N1 s1"><tspan x="469" dy="0">③에서 ④로 넘어가는 자리가 이 장의 갈림길이다.</tspan><tspan x="469" dy="17">계약을 실제 사건이 아니라 사고실험으로 다시 읽으면</tspan><tspan x="469" dy="17">③은 ‘공정한 조건에 놓인 사람이 고를 원칙은 무엇인가’ 라는 다른 물음이 되고,</tspan><tspan x="469" dy="17">그 물음이 20장 뒷부분 전체를 끌고 간다.</tspan><tspan x="469" dy="17">반대로 ④를 택하면 정당화는 동의가 아니라 제도의 정의로움 자체에 걸리게 된다</tspan></text><marker id="mk-d2-3529416611-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3529416611-3488378134)" d="M183 116v84" class="connection stroke-B1 s0" mask="url(#d2-3529416611)"/><text x="183.5" y="165" class="text-italic fill-N2 s1">해당자가 거의 없다</text><path fill="none" marker-end="url(#mk-d2-3529416611-3488378134)" d="M183 320v84" class="connection stroke-B1 s0" mask="url(#d2-3529416611)"/><text x="183.5" y="369" class="text-italic fill-N2 s1">동의라고 부르기 어렵다</text><path fill="none" marker-end="url(#mk-d2-3529416611-3488378134)" d="M183 524v84" class="connection stroke-B1 s0" mask="url(#d2-3529416611)"/><text x="183.5" y="573" class="text-italic fill-N2 s1">동의가 하는 일이 없다</text><path fill="none" marker-end="url(#mk-d2-3529416611-3488378134)" d="M368 57h94" class="connection stroke-B1 s0" mask="url(#d2-3529416611)"/><path fill="none" marker-end="url(#mk-d2-3529416611-3488378134)" d="M368 261h94" class="connection stroke-B1 s0" mask="url(#d2-3529416611)"/><path fill="none" marker-end="url(#mk-d2-3529416611-3488378134)" d="M368 465h94" class="connection stroke-B1 s0" mask="url(#d2-3529416611)"/><path fill="none" marker-end="url(#mk-d2-3529416611-3488378134)" d="M368 669h94" class="connection stroke-B1 s0" mask="url(#d2-3529416611)"/><path fill="none" marker-end="url(#mk-d2-3529416611-3488378134)" d="M702 728v84" class="connection stroke-B1 s0" mask="url(#d2-3529416611)"/><text x="702.5" y="777" class="text-italic fill-N2 s1">여기까지 오면</text><mask id="d2-3529416611" width="1140" height="1253" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1140v1253H-101z"/><path d="M101 149h165v21H101zM82 353h203v21H82zM90 557h187v21H90zM641 761h123v21H641z"/></mask></svg>