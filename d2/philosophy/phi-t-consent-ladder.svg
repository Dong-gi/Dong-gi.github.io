<svg xmlns="http://www.w3.org/2000/svg" width="2508" height="1454" class="d2-497514202 d2-svg" viewBox="-101 -101 2508 1454"><rect width="2508" height="1454" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-497514202 .fill-N1{fill:#0a0f25}.d2-497514202 .fill-N2{fill:#676c7e}.d2-497514202 .fill-B6{fill:#f7f8fe}.d2-497514202 .stroke-B1,.d2-497514202 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M915 0h336v98H915z" class="stroke-B1 fill-B6 s0"/></g><text x="1083" y="38.5" class="text-bold fill-N1 s1"><tspan x="1083" dy="0">① 명시적 동의</tspan><tspan x="1083" dy="17.667">말이나 서명으로 실제로 동의했다</tspan><tspan x="1083" dy="17.667">귀화 선서, 공직 취임 선서</tspan></text></g><g ><g class="shape"><path d="M548 219h488v98H548z" class="stroke-B1 fill-B6 s0"/></g><text x="792" y="257.5" class="text-bold fill-N1 s1"><tspan x="792" dy="0">② 묵시적 동의 — 로크</tspan><tspan x="792" dy="17.667">떠나지 않고 머무르며 도로를 쓰고 재산을 누린다면</tspan><tspan x="792" dy="17.667">그 자체가 동의로 읽힌다</tspan></text></g><g ><g class="shape"><path d="M241 454h550v82H241z" class="stroke-B1 fill-B6 s0"/></g><text x="516" y="492.5" class="text-bold fill-N1 s1"><tspan x="516" dy="0">③ 가설적 동의</tspan><tspan x="516" dy="18.5">실제로 동의하지 않았어도, 합리적이라면 동의했을 것이다</tspan></text></g><g ><g class="shape"><path d="M0 681h491v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="245.5" y="719.5" class="text-bold fill-N1 s1"><tspan x="245.5" dy="0">④ 동의를 아예 쓰지 않는 길</tspan><tspan x="245.5" dy="17.667">정의로운 제도를 지지할 자연적 의무,</tspan><tspan x="245.5" dy="17.667">또는 이익을 받았으면 몫을 지라는 공정한 몫의 원리</tspan></text></g><g ><g class="shape"><path d="M1096 219h556v98h-556z" class="stroke-B2 fill-B6 s2"/></g><text x="1374" y="257.5" class="text-bold fill-N1 s1"><tspan x="1374" dy="0">걸리는 자리 — 사실 문제</tspan><tspan x="1374" dy="17.667">이 나라에서 동의를 말이나 서명으로 표한 사람이</tspan><tspan x="1374" dy="17.667">인구 중 몇이나 되는가. 그러면 나머지에게는 권위가 없는가</tspan></text></g><g ><g class="shape"><path d="M851 438h432v114H851z" class="stroke-B2 fill-B6 s2"/></g><text x="1067" y="476.5" class="text-bold fill-N1 s1"><tspan x="1067" dy="0">걸리는 자리 — 흄</tspan><tspan x="1067" dy="17.25">떠날 수 없는 사람의 머무름은 동의가 아니다.</tspan><tspan x="1067" dy="17.25">잠든 채 배에 실려 온 사람에게 뛰어내리든지</tspan><tspan x="1067" dy="17.25">선장을 따르든지 고르라는 것과 같다</tspan></text></g><g ><g class="shape"><path d="M551 673h472v114H551z" class="stroke-B2 fill-B6 s2"/></g><text x="787" y="711.5" class="text-bold fill-N1 s1"><tspan x="787" dy="0">걸리는 자리 — 가설적 계약은 계약이 아니다</tspan><tspan x="787" dy="17.25">내가 동의했을 것이라는 사실은 나를 묶지 못한다.</tspan><tspan x="787" dy="17.25">묶는 힘이 있다면 그것은 동의가 아니라</tspan><tspan x="787" dy="17.25">동의했을 이유 쪽에서 온다</tspan></text></g><g ><g class="shape"><path d="M27 887h438v114H27z" class="stroke-B2 fill-B6 s2"/></g><text x="246" y="925.5" class="text-bold fill-N1 s1"><tspan x="246" dy="0">걸리는 자리 — 받은 적 없는 이익</tspan><tspan x="246" dy="17.25">요청하지도 않은 이익을 받았다고 해서</tspan><tspan x="246" dy="17.25">값을 물릴 수 있는가. 이 길은 동의를 버린 만큼</tspan><tspan x="246" dy="17.25">국가만 특별히 대접할 이유도 함께 잃는다</tspan></text></g><g ><g class="shape"><path d="M21 1122h449v130H21z" class="stroke-B1 fill-B6 s0"/></g><text x="245.5" y="1160.5" class="text-bold fill-N1 s1"><tspan x="245.5" dy="0">철학적 무정부주의</tspan><tspan x="245.5" dy="17">네 길이 다 막힌다면 남는 결론이 이것이다.</tspan><tspan x="245.5" dy="17">국가에 복종할 일반적 도덕적 의무는 없다.</tspan><tspan x="245.5" dy="17">국가를 없애자는 주장이 아니라, 복종의 의무가</tspan><tspan x="245.5" dy="17">따로 있지는 않다는 주장이다</tspan></text></g><text x="1808.5" y="39" class="fill-N1 s1"><tspan x="1808.5" dy="0">③에서 ④로 넘어가는 자리가 이 장의 갈림길이다. 계약을 실제 사건이 아니라 사고실험으로 다시 읽으면</tspan><tspan x="1808.5" dy="17.667">③은 ‘공정한 조건에 놓인 사람이 고를 원칙은 무엇인가’ 라는 다른 물음이 되고, 그 물음이 20장 뒷부분 전체를 끌고 간다.</tspan><tspan x="1808.5" dy="17.667">반대로 ④를 택하면 정당화는 동의가 아니라 제도의 정의로움 자체에 걸리게 된다</tspan></text><marker id="mk-d2-497514202-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-497514202-3488378134)" d="M950.88 98.209C823.95 146.3 791.75 170.7 791.75 215.5" class="connection stroke-B1 s0" mask="url(#d2-497514202)"/><text x="846.5" y="143" class="text-italic fill-N2 s1">해당자가 거의 없다</text><path fill="none" marker-end="url(#mk-d2-497514202-3488378134)" d="M666.394 317.245C546.65 365.3 516.25 392.9 516.25 450.5" class="connection stroke-B1 s0" mask="url(#d2-497514202)"/><text x="559.5" y="366" class="text-italic fill-N2 s1">동의라고 부르기 어렵다</text><path fill="none" marker-end="url(#mk-d2-497514202-3488378134)" d="M419.668 536.302C280.7 597.1 245.5 626.3 245.5 677.5" class="connection stroke-B1 s0" mask="url(#d2-497514202)"/><text x="304.5" y="592" class="text-italic fill-N2 s1">동의가 하는 일이 없다</text><path fill="none" marker-end="url(#mk-d2-497514202-3488378134)" d="M1214.62 98.209C1341.55 146.3 1373.75 170.7 1373.75 215.5" class="connection stroke-B1 s0" mask="url(#d2-497514202)"/><path fill="none" marker-end="url(#mk-d2-497514202-3488378134)" d="M917.106 317.245C1036.85 365.3 1067.25 389.7 1067.25 434.5" class="connection stroke-B1 s0" mask="url(#d2-497514202)"/><path fill="none" marker-end="url(#mk-d2-497514202-3488378134)" d="M612.832 536.302C751.8 597.1 787 624.7 787 669.5" class="connection stroke-B1 s0" mask="url(#d2-497514202)"/><path fill="none" marker-end="url(#mk-d2-497514202-3488378134)" d="M245.5 781v102" class="connection stroke-B1 s0" mask="url(#d2-497514202)"/><path fill="none" marker-end="url(#mk-d2-497514202-3488378134)" d="M245.5 1002.5v116" class="connection stroke-B1 s0" mask="url(#d2-497514202)"/><text x="245.5" y="1067" class="text-italic fill-N2 s1">여기까지 오면</text><mask id="d2-497514202" width="2508" height="1454" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2508v1454H-101z"/><path d="M764 127h165v21H764zM458 350h203v21H458zM211 576h187v21H211zM184 1051h123v21H184z"/></mask></svg>