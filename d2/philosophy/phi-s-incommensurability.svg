<svg xmlns="http://www.w3.org/2000/svg" width="1649" height="962" class="d2-2403018600 d2-svg" viewBox="-101 -101 1649 962"><rect width="1649" height="962" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2403018600 .fill-N1{fill:#0a0f25}.d2-2403018600 .fill-B6{fill:#f7f8fe}.d2-2403018600 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="296.5" cy="352" class="shape stroke-B1 fill-B6 s0" rx="296.5" ry="99"/></g><text x="296.5" y="349.5" class="text-bold fill-N1 s1"><tspan x="296.5" dy="0">공약불가능하다</tspan><tspan x="296.5" dy="18.5">= 두 패러다임을 함께 재는 공통 척도가 없다</tspan></text></g><g ><g class="shape"><path d="M722 0h697v66H722z" class="stroke-B1 fill-B6 s0"/></g><text x="1070.5" y="38.5" class="text-bold fill-N1 s1">방법론적 — 무엇을 좋은 문제로 치고 무엇을 풀린 것으로 칠지가 함께 바뀐다</text></g><g ><g class="shape"><path d="M755 126h630v66H755z" class="stroke-B1 fill-B6 s0"/></g><text x="1070" y="164.5" class="text-bold fill-N1 s1">의미론적 — 같은 낱말이 두 패러다임에서 같은 것을 가리키지 않는다</text></g><g ><g class="shape"><path d="M745 252h650v66H745z" class="stroke-B1 fill-B6 s0"/></g><text x="1070" y="290.5" class="text-bold fill-N1 s1">관찰의 이론 적재성 — 무엇이 자료로 보이는지가 이론에 따라 달라진다</text></g><g ><g class="shape"><path d="M795 378h551v82H795z" class="stroke-B1 fill-B6 s0"/></g><text x="1070.5" y="416.5" class="text-bold fill-N1 s1"><tspan x="1070.5" dy="0">‘비교할 수 없다’ 는 뜻이 아니다.</tspan><tspan x="1070.5" dy="18.5">쿤은 비교가 가능하되 규칙 하나로 결판나지 않는다고 했다</tspan></text></g><g ><g class="shape"><path d="M767 520h606v82H767z" class="stroke-B1 fill-B6 s0"/></g><text x="1070" y="558.5" class="text-bold fill-N1 s1"><tspan x="1070" dy="0">‘번역할 수 없다’ 는 뜻이 아니다.</tspan><tspan x="1070" dy="18.5">어렵고 손실이 있을 뿐, 다른 패러다임의 말을 배울 수 있다고 했다</tspan></text></g><g ><g class="shape"><path d="M693 662h754v98H693z" class="stroke-B1 fill-B6 s0"/></g><text x="1070" y="700.5" class="text-bold fill-N1 s1"><tspan x="1070" dy="0">‘아무 이론이나 똑같이 좋다’ 는 뜻이 아니다.</tspan><tspan x="1070" dy="17.667">쿤은 정확성·일관성·넓이·단순성·다산성을 이론 선택의 공통된 값으로 꼽았다.</tspan><tspan x="1070" dy="17.667">다만 그 값들은 서로 충돌하고, 무게를 다르게 줄 수 있어서 알고리즘이 되지 않는다</tspan></text></g><marker id="mk-d2-2403018600-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2403018600-3488378134)" d="M399.47 257.644C594 78.199 658.7 33 717.5 33" class="connection stroke-B1 s0" mask="url(#d2-2403018600)"/><path fill="none" marker-end="url(#mk-d2-2403018600-3488378134)" d="M450.747 266.027C604.2 180.6 665.4 159 751 159" class="connection stroke-B1 s0" mask="url(#d2-2403018600)"/><path fill="none" marker-end="url(#mk-d2-2403018600-3488378134)" d="M555.96 302.604C625.2 288.6 663.4 285 741 285" class="connection stroke-B1 s0" mask="url(#d2-2403018600)"/><path fill="none" marker-end="url(#mk-d2-2403018600-3488378134)" d="M555.96 401.396C625.2 415.4 673.3 419 790.5 419" class="connection stroke-B1 s0" mask="url(#d2-2403018600)"/><path fill="none" marker-end="url(#mk-d2-2403018600-3488378134)" d="M441.714 440.03C602.4 536.6 667.8 561 763 561" class="connection stroke-B1 s0" mask="url(#d2-2403018600)"/><path fill="none" marker-end="url(#mk-d2-2403018600-3488378134)" d="M388.39 447.438C591.8 658 653 711 689 711" class="connection stroke-B1 s0" mask="url(#d2-2403018600)"/><mask id="d2-2403018600" width="1649" height="962" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1649v962H-101z"/></mask></svg>