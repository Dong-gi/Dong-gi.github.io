<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1186" class="d2-3694006426 d2-svg" viewBox="-101 -101 1040 1186"><rect width="1040" height="1186" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3694006426 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3694006426 .fill-N1{fill:#0a0f25}.d2-3694006426 .fill-B6{fill:#f7f8fe}.d2-3694006426 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="189" cy="444" class="shape stroke-B1 fill-B6 s0" rx="189" ry="63"/></g><text x="189" y="433.5" class="text-bold fill-N1 s1"><tspan x="189" dy="0">공약불가능하다</tspan><tspan x="189" dy="17.667">= 두 패러다임을 함께 재는</tspan><tspan x="189" dy="17.667">공통 척도가 없다</tspan></text></g><g ><g class="shape"><path d="M499 0h319v98H499z" class="stroke-B1 fill-B6 s0"/></g><text x="658.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="658.5" dy="0">방법론적 — 무엇을 좋은 문제로</tspan><tspan x="658.5" dy="17.667">치고 무엇을 풀린 것으로 칠지가</tspan><tspan x="658.5" dy="17.667">함께 바뀐다</tspan></text></g><g ><g class="shape"><path d="M520 158h276v98H520z" class="stroke-B1 fill-B6 s0"/></g><text x="658" y="196.5" class="text-bold fill-N1 s1"><tspan x="658" dy="0">의미론적 — 같은 낱말이</tspan><tspan x="658" dy="17.667">두 패러다임에서 같은 것을</tspan><tspan x="658" dy="17.667">가리키지 않는다</tspan></text></g><g ><g class="shape"><path d="M522 316h272v98H522z" class="stroke-B1 fill-B6 s0"/></g><text x="658" y="354.5" class="text-bold fill-N1 s1"><tspan x="658" dy="0">관찰의 이론 적재성 —</tspan><tspan x="658" dy="17.667">무엇이 자료로 보이는지가</tspan><tspan x="658" dy="17.667">이론에 따라 달라진다</tspan></text></g><g ><g class="shape"><path d="M478 474h360v98H478z" class="stroke-B1 fill-B6 s0"/></g><text x="658" y="512.5" class="text-bold fill-N1 s1"><tspan x="658" dy="0">‘비교할 수 없다’ 는 뜻이 아니다.</tspan><tspan x="658" dy="17.667">쿤은 비교가 가능하되</tspan><tspan x="658" dy="17.667">규칙 하나로 결판나지 않는다고 했다</tspan></text></g><g ><g class="shape"><path d="M494 632h329v114H494z" class="stroke-B1 fill-B6 s0"/></g><text x="658.5" y="670.5" class="text-bold fill-N1 s1"><tspan x="658.5" dy="0">‘번역할 수 없다’ 는 뜻이 아니다.</tspan><tspan x="658.5" dy="17.25">어렵고 손실이 있을 뿐,</tspan><tspan x="658.5" dy="17.25">다른 패러다임의 말을</tspan><tspan x="658.5" dy="17.25">배울 수 있다고 했다</tspan></text></g><g ><g class="shape"><path d="M498 806h321v178H498z" class="stroke-B1 fill-B6 s0"/></g><text x="658.5" y="844.5" class="text-bold fill-N1 s1"><tspan x="658.5" dy="0">‘아무 이론이나 똑같이 좋다’ 는</tspan><tspan x="658.5" dy="16.625">뜻이 아니다.</tspan><tspan x="658.5" dy="16.625">쿤은 정확성·일관성·넓이·</tspan><tspan x="658.5" dy="16.625">단순성·다산성을 이론 선택의</tspan><tspan x="658.5" dy="16.625">공통된 값으로 꼽았다.</tspan><tspan x="658.5" dy="16.625">다만 그 값들은 서로 충돌하고,</tspan><tspan x="658.5" dy="16.625">무게를 다르게 줄 수 있어서</tspan><tspan x="658.5" dy="16.625">알고리즘이 되지 않는다</tspan></text></g><marker id="mk-d2-3694006426-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3694006426-3488378134)" d="M227.037 380.29C387.6 115.599 442.1 49 494.5 49" class="connection stroke-B1 s0" mask="url(#d2-3694006426)"/><path fill="none" marker-end="url(#mk-d2-3694006426-3488378134)" d="M251.418 382.59C392.4 242.4 446.4 207 516 207" class="connection stroke-B1 s0" mask="url(#d2-3694006426)"/><path fill="none" marker-end="url(#mk-d2-3694006426-3488378134)" d="M326.894 399.357C407.4 372 446.8 365 518 365" class="connection stroke-B1 s0" mask="url(#d2-3694006426)"/><path fill="none" marker-end="url(#mk-d2-3694006426-3488378134)" d="M326.894 488.643C407.4 516 438 523 474 523" class="connection stroke-B1 s0" mask="url(#d2-3694006426)"/><path fill="none" marker-end="url(#mk-d2-3694006426-3488378134)" d="M248.399 505.43C391.8 652 441.1 689 489.5 689" class="connection stroke-B1 s0" mask="url(#d2-3694006426)"/><path fill="none" marker-end="url(#mk-d2-3694006426-3488378134)" d="M222.936 507.767C386.8 817.2 441.9 895 493.5 895" class="connection stroke-B1 s0" mask="url(#d2-3694006426)"/><mask id="d2-3694006426" width="1040" height="1186" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H939v1186H-101z"/></mask></svg>