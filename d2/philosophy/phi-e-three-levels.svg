<svg xmlns="http://www.w3.org/2000/svg" width="1569" height="754" class="d2-806941003 d2-svg" viewBox="-101 -101 1569 754"><rect width="1569" height="754" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-806941003 .fill-N1{fill:#0a0f25}.d2-806941003 .fill-N2{fill:#676c7e}.d2-806941003 .fill-B6{fill:#f7f8fe}.d2-806941003 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M261 454h559v98H261z" class="stroke-B1 fill-B6 s0"/></g><text x="540.5" y="492.5" class="text-bold fill-N1 s1"><tspan x="540.5" dy="0">응용윤리 — 이 경우에 무엇을 해야 하는가</tspan><tspan x="540.5" dy="17.667">전차를 돌려야 하는가. 멀리 있는 사람을 도울 의무가 있는가</tspan><tspan x="540.5" dy="17.667">19장</tspan></text></g><g ><g class="shape"><path d="M321 235h438v98H321z" class="stroke-B1 fill-B6 s0"/></g><text x="540" y="273.5" class="text-bold fill-N1 s1"><tspan x="540" dy="0">규범윤리 — 무엇이 옳은 행위를 옳게 만드는가</tspan><tspan x="540" dy="17.667">결과인가. 규칙인가. 성품인가</tspan><tspan x="540" dy="17.667">18장</tspan></text></g><g ><g class="shape"><path d="M0 0h518v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="259" y="38.5" class="text-bold fill-N1 s1"><tspan x="259" dy="0">메타윤리 — 그 말들은 도대체 무슨 일을 하는 말인가</tspan><tspan x="259" dy="17.25">‘옳다’ 는 사실을 적는 말인가 태도를 드러내는 말인가.</tspan><tspan x="259" dy="17.25">그 말을 참으로 만들 것이 세상에 있는가</tspan><tspan x="259" dy="17.25">17장</tspan></text></g><text x="821" y="47" class="fill-N1 s1"><tspan x="821" dy="0">화살표는 한 방향만이 아니다.</tspan><tspan x="821" dy="17.667">19장의 사례가 18장의 이론을 되치고, 18장에서 나온 판단이</tspan><tspan x="821" dy="17.667">17장의 물음을 다시 세운다</tspan></text><text x="1123.5" y="493" class="fill-N1 s1"><tspan x="1123.5" dy="0">세 층은 물음이 다른 것이지 어려움의 순서가 아니다.</tspan><tspan x="1123.5" dy="17.667">메타윤리가 정해져야 규범윤리를 할 수 있는 것도 아니다 —</tspan><tspan x="1123.5" dy="17.667">17장 마지막 절이 그 이유를 적는다</tspan></text><marker id="mk-d2-806941003-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-806941003-3488378134)" d="M540 452.5v-116" class="connection stroke-B1 s0" mask="url(#d2-806941003)"/><text x="540.5" y="399" class="text-italic fill-N2 s1">이 사례를 어떤 원리로 판정하나</text><path fill="none" marker-end="url(#mk-d2-806941003-3488378134)" d="M412.139 234.768C290 186.7 259 162.3 259 117.5" class="connection stroke-B1 s0" mask="url(#d2-806941003)"/><text x="310.5" y="200" class="text-italic fill-N2 s1">그 원리가 참인지 아닌지 물을 수는 있나</text><path fill="none" marker-end="url(#mk-d2-806941003-3488378134)" d="M667.861 234.768C790 186.7 821 156.3 821 87.5" class="connection stroke-B1 s0" mask="url(#d2-806941003)"/><text x="782" y="195" class="text-italic fill-N2 s1">사례가 이론을 고친다</text><mask id="d2-806941003" width="1569" height="754" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1569v754H-101z"/><path d="M407 383h267v21H407zM145 184h331v21H145zM690 179h184v21H690z"/></mask></svg>