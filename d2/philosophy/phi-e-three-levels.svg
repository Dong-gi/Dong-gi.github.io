<svg xmlns="http://www.w3.org/2000/svg" width="951" height="923" class="d2-1724501134 d2-svg" viewBox="-101 -101 951 923"><rect width="951" height="923" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1724501134 .text-bold{font-weight:700}.d2-1724501134 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1724501134 .fill-N1{fill:#0a0f25}.d2-1724501134 .fill-N2{fill:#676c7e}.d2-1724501134 .fill-B6{fill:#f7f8fe}.d2-1724501134 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M197 534h397v114H197z" class="stroke-B1 fill-B6 s0"/></g><text x="395.5" y="572.5" class="text-bold fill-N1 s1"><tspan x="395.5" dy="0">응용윤리 — 이 경우에 무엇을 해야 하는가</tspan><tspan x="395.5" dy="17.25">전차를 돌려야 하는가.</tspan><tspan x="395.5" dy="17.25">멀리 있는 사람을 도울 의무가 있는가</tspan><tspan x="395.5" dy="17.25">19장</tspan></text></g><g ><g class="shape"><path d="M240 283h310v114H240z" class="stroke-B1 fill-B6 s0"/></g><text x="395" y="321.5" class="text-bold fill-N1 s1"><tspan x="395" dy="0">규범윤리 — 무엇이 옳은 행위를</tspan><tspan x="395" dy="17.25">옳게 만드는가</tspan><tspan x="395" dy="17.25">결과인가. 규칙인가. 성품인가</tspan><tspan x="395" dy="17.25">18장</tspan></text></g><g ><g class="shape"><path d="M0 0h386v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="193" y="38.5" class="text-bold fill-N1 s1"><tspan x="193" dy="0">메타윤리 — 그 말들은 도대체</tspan><tspan x="193" dy="16.833">무슨 일을 하는 말인가</tspan><tspan x="193" dy="16.833">‘옳다’ 는 사실을 적는 말인가</tspan><tspan x="193" dy="16.833">태도를 드러내는 말인가.</tspan><tspan x="193" dy="16.833">그 말을 참으로 만들 것이 세상에 있는가</tspan><tspan x="193" dy="16.833">17장</tspan></text></g><text x="597.5" y="55" class="fill-N1 s1"><tspan x="597.5" dy="0">화살표는 한 방향만이 아니다.</tspan><tspan x="597.5" dy="17.25">19장의 사례가 18장의 이론을 되치고,</tspan><tspan x="597.5" dy="17.25">18장에서 나온 판단이</tspan><tspan x="597.5" dy="17.25">17장의 물음을 다시 세운다</tspan></text><text x="374.5" y="684" class="fill-N1 s1"><tspan x="374.5" dy="0">세 층은 물음이 다른 것이지 어려움의 순서가 아니다.</tspan><tspan x="374.5" dy="17.667">메타윤리가 정해져야 규범윤리를 할 수 있는 것도 아니다 —</tspan><tspan x="374.5" dy="17.667">17장 마지막 절이 그 이유를 적는다</tspan></text><marker id="mk-d2-1724501134-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1724501134-3488378134)" d="M395.25 532.5v-132" class="connection stroke-B1 s0" mask="url(#d2-1724501134)"/><text x="395" y="463" class="text-italic fill-N2 s1"><tspan x="395" dy="0">이 사례를 어떤</tspan><tspan x="395" dy="18.5">원리로 판정하나</tspan></text><path fill="none" marker-end="url(#mk-d2-1724501134-3488378134)" d="M301.306 282.437C215 228.3 193 200.7 193 149.5" class="connection stroke-B1 s0" mask="url(#d2-1724501134)"/><text x="221" y="229" class="text-italic fill-N2 s1"><tspan x="221" dy="0">그 원리가 참인지 아닌지</tspan><tspan x="221" dy="18.5">물을 수는 있나</tspan></text><path fill="none" marker-end="url(#mk-d2-1724501134-3488378134)" d="M489.194 282.437C575.5 228.3 597.5 193.1 597.5 111.5" class="connection stroke-B1 s0" mask="url(#d2-1724501134)"/><text x="582" y="224" class="text-italic fill-N2 s1">사례가 이론을 고친다</text><mask id="d2-1724501134" width="951" height="923" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h951v923h-951z"/><path d="M324 447h142v37H324zM118 213h206v37H118zM490 208h184v21H490z"/></mask></svg>