<svg xmlns="http://www.w3.org/2000/svg" width="1292" height="1475" class="d2-3460430129 d2-svg" viewBox="-101 -101 1292 1475"><rect width="1292" height="1475" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3460430129 .fill-N1{fill:#0a0f25}.d2-3460430129 .fill-N2{fill:#676c7e}.d2-3460430129 .fill-B6{fill:#f7f8fe}.d2-3460430129 .stroke-B1,.d2-3460430129 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="565" cy="50.5" class="shape stroke-B1 fill-B6 s0" rx="152" ry="50.5"/></g><text x="565" y="56" class="text-bold fill-N1 s1">채워 넣을 후보 문장</text></g><g ><g class="shape"><path d="M419 201h293v98H419z" class="stroke-B1 fill-B6 s0"/></g><text x="565.5" y="239.5" class="text-bold fill-N1 s1"><tspan x="565.5" dy="0">관문 1 — 이것을 넣으면</tspan><tspan x="565.5" dy="17.667">전제에서 결론으로 건너뛰는</tspan><tspan x="565.5" dy="17.667">자리가 메워지는가</tspan></text></g><g ><g class="shape"><path d="M639 420h258v82H639z" class="stroke-B1 fill-B6 s0"/></g><text x="768" y="458.5" class="text-bold fill-N1 s1"><tspan x="768" dy="0">관문 2 — 글쓴이가 이것을</tspan><tspan x="768" dy="18.5">실제로 받아들일 만한가</tspan></text></g><g ><g class="shape"><path d="M417 623h336v114H417z" class="stroke-B2 fill-B6 s2"/></g><text x="585" y="661.5" class="text-bold fill-N1 s1"><tspan x="585" dy="0">떠안기기</tspan><tspan x="585" dy="17.25">논증은 메워졌지만 글쓴이는</tspan><tspan x="585" dy="17.25">그런 말을 한 적이 없다.</tspan><tspan x="585" dy="17.25">이대로 공격하면 허수아비가 된다</tspan></text></g><g ><g class="shape"><path d="M0 631h357v98H0z" class="stroke-B2 fill-B6 s2"/></g><text x="178.5" y="669.5" class="text-bold fill-N1 s1"><tspan x="178.5" dy="0">빈 보탬</tspan><tspan x="178.5" dy="17.667">글쓴이가 동의할 문장이기는 하지만</tspan><tspan x="178.5" dy="17.667">논증의 벌어진 자리는 그대로다</tspan></text></g><g ><g class="shape"><path d="M298 837h168v66H298z" class="stroke-B2 fill-B6 s2"/></g><text x="382" y="875.5" class="text-bold fill-N1 s1">후보에서 뺀다</text></g><g ><g class="shape"><path d="M813 631h277v98H813z" class="stroke-B1 fill-B6 s0"/></g><text x="951.5" y="669.5" class="text-bold fill-N1 s1"><tspan x="951.5" dy="0">숨은 전제로 채택한다</tspan><tspan x="951.5" dy="17.667">번호를 붙이되 ‘글에 없음’</tspan><tspan x="951.5" dy="17.667">이라고 표시한다</tspan></text></g><text x="381.5" y="1019" class="fill-N1 s1"><tspan x="381.5" dy="0">관문을 지나는 후보가 여럿이면 가장 약한 것을 고른다.</tspan><tspan x="381.5" dy="17">‘모든 거짓말은 나쁘다’ 와 ‘이런 상황의 거짓말은 나쁘다’</tspan><tspan x="381.5" dy="17">가 둘 다 자리를 메운다면 뒤의 것을 쓴다.</tspan><tspan x="381.5" dy="17">강한 전제를 골라 놓고 그 전제를 공격하는 것은</tspan><tspan x="381.5" dy="17">상대의 논증을 대신 약하게 만드는 일이다</tspan></text><text x="381.5" y="1204" class="fill-N1 s1"><tspan x="381.5" dy="0">숨은 전제를 찾는 것이 왜 남는 일인가.</tspan><tspan x="381.5" dy="17">논쟁이 풀리지 않을 때 어긋난 자리가</tspan><tspan x="381.5" dy="17">대개 여기이기 때문이다.</tspan><tspan x="381.5" dy="17">서로 다른 숨은 전제를 깔고 있으면 겉으로 오간</tspan><tspan x="381.5" dy="17">문장은 아무리 따져도 결론이 나지 않는다</tspan></text><marker id="mk-d2-3460430129-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3460430129-3488378134)" d="M565 103v94" class="connection stroke-B1 s0" mask="url(#d2-3460430129)"/><path fill="none" marker-end="url(#mk-d2-3460430129-3488378134)" d="M416.576 292.05C226.5 345.901 178.5 379.8 178.5 410.25V627.5" class="connection stroke-B1 s0" mask="url(#d2-3460430129)"/><text x="181" y="383" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-3460430129-3488378134)" d="M658.006 299.457C745.85 347.3 768.25 371.7 768.25 416.5" class="connection stroke-B1 s0" mask="url(#d2-3460430129)"/><text x="737" y="348" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-3460430129-3488378134)" d="M692.255 502.477C606.8 550.3 585 574.7 585 619.5" class="connection stroke-B1 s0" mask="url(#d2-3460430129)"/><text x="615" y="551" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-3460430129-3488378134)" d="M844.245 502.477C929.7 550.3 951.5 576.3 951.5 627.5" class="connection stroke-B1 s0" mask="url(#d2-3460430129)"/><text x="925" y="553" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-3460430129-3488378134)" d="M178.5 731c0 44.4 24.4 66 118.299 104.483" class="connection stroke-B1 s0" mask="url(#d2-3460430129)"/><path fill="none" marker-end="url(#mk-d2-3460430129-3488378134)" d="M585 739c0 38-24.4 58-118.299 96.483" class="connection stroke-B1 s0" mask="url(#d2-3460430129)"/><mask id="d2-3460430129" width="1292" height="1475" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1292v1475H-101z"/><path d="M150 367h62v21h-62zM725 332h24v21h-24zM584 535h62v21h-62zM913 537h24v21h-24z"/></mask></svg>