<svg xmlns="http://www.w3.org/2000/svg" width="3021" height="666" class="d2-3004079303 d2-svg" viewBox="-101 -101 3021 666"><rect width="3021" height="666" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3004079303 .fill-N1{fill:#0a0f25}.d2-3004079303 .fill-N2{fill:#676c7e}.d2-3004079303 .fill-B6{fill:#f7f8fe}.d2-3004079303 .stroke-B1,.d2-3004079303 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="479" cy="203.5" class="shape stroke-B1 fill-B6 s0" rx="152" ry="50.5"/></g><text x="479" y="209" class="text-bold fill-N1 s1">채워 넣을 후보 문장</text></g><g ><g class="shape"><path d="M1058 162h461v82h-461z" class="stroke-B1 fill-B6 s0"/></g><text x="1288.5" y="200.5" class="text-bold fill-N1 s1"><tspan x="1288.5" dy="0">관문 1 — 이것을 넣으면</tspan><tspan x="1288.5" dy="18.5">전제에서 결론으로 건너뛰는 자리가 메워지는가</tspan></text></g><g ><g class="shape"><path d="M1639 241h258v82h-258z" class="stroke-B1 fill-B6 s0"/></g><text x="1768" y="279.5" class="text-bold fill-N1 s1"><tspan x="1768" dy="0">관문 2 — 글쓴이가 이것을</tspan><tspan x="1768" dy="18.5">실제로 받아들일 만한가</tspan></text></g><g ><g class="shape"><path d="M2055 158h496v98h-496z" class="stroke-B2 fill-B6 s2"/></g><text x="2303" y="196.5" class="text-bold fill-N1 s1"><tspan x="2303" dy="0">떠안기기</tspan><tspan x="2303" dy="17.667">논증은 메워졌지만 글쓴이는 그런 말을 한 적이 없다.</tspan><tspan x="2303" dy="17.667">이대로 공격하면 허수아비가 된다</tspan></text></g><g ><g class="shape"><path d="M2125 0h357v98h-357z" class="stroke-B2 fill-B6 s2"/></g><text x="2303.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="2303.5" dy="0">빈 보탬</tspan><tspan x="2303.5" dy="17.667">글쓴이가 동의할 문장이기는 하지만</tspan><tspan x="2303.5" dy="17.667">논증의 벌어진 자리는 그대로다</tspan></text></g><g ><g class="shape"><path d="M2651 95h168v66h-168z" class="stroke-B2 fill-B6 s2"/></g><text x="2735" y="133.5" class="text-bold fill-N1 s1">후보에서 뺀다</text></g><g ><g class="shape"><path d="M2090 316h426v82h-426z" class="stroke-B1 fill-B6 s0"/></g><text x="2303" y="354.5" class="text-bold fill-N1 s1"><tspan x="2303" dy="0">숨은 전제로 채택한다</tspan><tspan x="2303" dy="18.5">번호를 붙이되 ‘글에 없음’ 이라고 표시한다</tspan></text></g><text x="479.5" y="330" class="fill-N1 s1"><tspan x="479.5" dy="0">관문을 지나는 후보가 여럿이면 가장 약한 것을 고른다.</tspan><tspan x="479.5" dy="17.667">‘모든 거짓말은 나쁘다’ 와 ‘이런 상황의 거짓말은 나쁘다’ 가 둘 다 자리를 메운다면 뒤의 것을 쓴다.</tspan><tspan x="479.5" dy="17.667">강한 전제를 골라 놓고 그 전제를 공격하는 것은 상대의 논증을 대신 약하게 만드는 일이다</tspan></text><text x="479" y="443" class="fill-N1 s1"><tspan x="479" dy="0">숨은 전제를 찾는 것이 왜 남는 일인가. 논쟁이 풀리지 않을 때 어긋난 자리가</tspan><tspan x="479" dy="18.5">대개 여기이기 때문이다. 서로 다른 숨은 전제를 깔고 있으면 겉으로 오간 문장은 아무리 따져도 결론이 나지 않는다</tspan></text><marker id="mk-d2-3004079303-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3004079303-3488378134)" d="M633 203h421" class="connection stroke-B1 s0" mask="url(#d2-3004079303)"/><path fill="none" marker-end="url(#mk-d2-3004079303-3488378134)" d="M1367.767 161.063C1536.4 71.6 1616.8 49 1673.5 49h447" class="connection stroke-B1 s0" mask="url(#d2-3004079303)"/><text x="1732" y="55" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-3004079303-3488378134)" d="M1440.93 244.524C1551 274.4 1591 282 1635 282" class="connection stroke-B1 s0" mask="url(#d2-3004079303)"/><text x="1538" y="276" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-3004079303-3488378134)" d="M1883.88 240.32C1957.2 213.8 1991.8 207 2051 207" class="connection stroke-B1 s0" mask="url(#d2-3004079303)"/><text x="1966" y="218" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-3004079303-3488378134)" d="M1883.88 323.68C1957.2 350.2 1998.8 357 2086 357" class="connection stroke-B1 s0" mask="url(#d2-3004079303)"/><text x="1984" y="360" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-3004079303-3488378134)" d="M2484 49c93.2 0 132.6 9.2 191.555 43.968" class="connection stroke-B1 s0" mask="url(#d2-3004079303)"/><path fill="none" marker-end="url(#mk-d2-3004079303-3488378134)" d="M2553 207c38 0 63.6-9.2 122.555-43.968" class="connection stroke-B1 s0" mask="url(#d2-3004079303)"/><mask id="d2-3004079303" width="3021" height="666" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3021v666H-101z"/><path d="M1701 39h62v21h-62zM1526 260h24v21h-24zM1935 202h62v21h-62zM1972 344h24v21h-24z"/></mask></svg>