<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="1111" class="d2-3717002466 d2-svg" viewBox="-101 -101 1328 1111"><rect width="1328" height="1111" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3717002466 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3717002466 .fill-N1{fill:#0a0f25}.d2-3717002466 .fill-B6{fill:#f7f8fe}.d2-3717002466 .stroke-B1,.d2-3717002466 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M318 0h488v98H318z" class="stroke-B1 fill-B6 s0"/></g><text x="562" y="38.5" class="text-bold fill-N1 s1"><tspan x="562" dy="0">책임의 두 조건 — 통제 조건은 12장에서 온다</tspan><tspan x="562" dy="17.667">통제 조건 — 그 일이 그의 통제 아래 있었을 것</tspan><tspan x="562" dy="17.667">인식 조건 — 무엇을 하는지 알았거나 알 수 있었을 것</tspan></text></g><g ><g class="shape"><path d="M68 198h296v146H68z" class="stroke-B1 fill-B6 s0"/></g><text x="216" y="236.5" class="text-bold fill-N1 s1"><tspan x="216" dy="0">설계하고 만든 쪽</tspan><tspan x="216" dy="16.833">통제 조건 —</tspan><tspan x="216" dy="16.833">만들 때는 통제했다</tspan><tspan x="216" dy="16.833">인식 조건 —</tspan><tspan x="216" dy="16.833">학습으로 행동이 바뀌면</tspan><tspan x="216" dy="16.833">개별 출력을 예견하지 못한다</tspan></text></g><g ><g class="shape"><path d="M424 198h276v146H424z" class="stroke-B1 fill-B6 s0"/></g><text x="562" y="236.5" class="text-bold fill-N1 s1"><tspan x="562" dy="0">배치한 조직</tspan><tspan x="562" dy="16.833">통제 조건 —</tspan><tspan x="562" dy="16.833">쓸지 말지는 정했다</tspan><tspan x="562" dy="16.833">인식 조건 —</tspan><tspan x="562" dy="16.833">내부에서 무슨 일이</tspan><tspan x="562" dy="16.833">일어나는지 다 알지 못한다</tspan></text></g><g ><g class="shape"><path d="M760 198h296v146H760z" class="stroke-B1 fill-B6 s0"/></g><text x="908" y="236.5" class="text-bold fill-N1 s1"><tspan x="908" dy="0">쓰는 사람</tspan><tspan x="908" dy="16.833">통제 조건 —</tspan><tspan x="908" dy="16.833">개별 결정을 통제하지 못한다</tspan><tspan x="908" dy="16.833">인식 조건 —</tspan><tspan x="908" dy="16.833">왜 그런 출력이 나왔는지</tspan><tspan x="908" dy="16.833">모른다</tspan></text></g><g ><g class="shape"><path d="M307 444h510v98H307z" class="stroke-B1 fill-B6 s0"/></g><text x="562" y="482.5" class="text-bold fill-N1 s1"><tspan x="562" dy="0">주장 — 어느 쪽에서도 두 조건이 함께 채워지지 않는다.</tspan><tspan x="562" dy="17.667">그래서 해가 일어났는데</tspan><tspan x="562" dy="17.667">책임질 사람이 없는 자리가 생긴다</tspan></text></g><g ><g class="shape"><path d="M0 658h316v162H0z" class="stroke-B2 fill-B6 s2"/></g><text x="158" y="696.5" class="text-bold fill-N1 s1"><tspan x="158" dy="0">반론 A —</tspan><tspan x="158" dy="16.714">공백이 아니라 분산이다</tspan><tspan x="158" dy="16.714">조건이 부분적으로 채워진</tspan><tspan x="158" dy="16.714">사람이 여럿 있는 것이지</tspan><tspan x="158" dy="16.714">아무도 없는 것이 아니다.</tspan><tspan x="158" dy="16.714">부분적 책임을 어떻게 나눌지가</tspan><tspan x="158" dy="16.714">물음이 된다</tspan></text></g><g ><g class="shape"><path d="M376 642h371v194H376z" class="stroke-B2 fill-B6 s2"/></g><text x="561.5" y="680.5" class="text-bold fill-N1 s1"><tspan x="561.5" dy="0">반론 B —</tspan><tspan x="561.5" dy="16.556">예견 불가능성은 면책이 아니다</tspan><tspan x="561.5" dy="16.556">예견할 수 없는 것을 세상에</tspan><tspan x="561.5" dy="16.556">내놓기로 한 결정 자체가</tspan><tspan x="561.5" dy="16.556">평가 대상이다.</tspan><tspan x="561.5" dy="16.556">12장의 결과 운이 여기서 되살아난다 —</tspan><tspan x="561.5" dy="16.556">같은 결정을 했는데</tspan><tspan x="561.5" dy="16.556">한쪽만 사고가 났을 때</tspan><tspan x="561.5" dy="16.556">두 사람을 다르게 평가해도 되는가</tspan></text></g><g ><g class="shape"><path d="M807 642h319v194H807z" class="stroke-B2 fill-B6 s2"/></g><text x="966.5" y="680.5" class="text-bold fill-N1 s1"><tspan x="966.5" dy="0">반론 C —</tspan><tspan x="966.5" dy="16.556">새로운 문제가 아니다</tspan><tspan x="966.5" dy="16.556">조직과 관료제와 시장도</tspan><tspan x="966.5" dy="16.556">같은 구조를 만든다.</tspan><tspan x="966.5" dy="16.556">아무도 전체를 보지 못하는 채로</tspan><tspan x="966.5" dy="16.556">해가 일어나는 일은</tspan><tspan x="966.5" dy="16.556">전부터 있었다.</tspan><tspan x="966.5" dy="16.556">다만 정도가 다르다는</tspan><tspan x="966.5" dy="16.556">재반론이 붙는다</tspan></text></g><text x="562.5" y="872" class="fill-N1 s1"><tspan x="562.5" dy="0">스트로슨의 틀에서 보면 공백의 정서적 핵심이 드러난다.</tspan><tspan x="562.5" dy="17.667">우리는 기계에 분개할 수 없다. 분개할 대상이 없다는 느낌이 남는데,</tspan><tspan x="562.5" dy="17.667">그 느낌이 무엇의 증거인지가 다음 물음이다</tspan></text><marker id="mk-d2-3717002466-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3717002466-3488378134)" d="M388.328 98.552C251.049 138 216.25 158 216.25 194" class="connection stroke-B1 s0" mask="url(#d2-3717002466)"/><path fill="none" marker-end="url(#mk-d2-3717002466-3488378134)" d="M562.25 100v94" class="connection stroke-B1 s0" mask="url(#d2-3717002466)"/><path fill="none" marker-end="url(#mk-d2-3717002466-3488378134)" d="M735.173 98.55C873.25 138 908.25 158 908.25 194" class="connection stroke-B1 s0" mask="url(#d2-3717002466)"/><path fill="none" marker-end="url(#mk-d2-3717002466-3488378134)" d="M216.25 346c0 38 34.8 58 170.156 96.895" class="connection stroke-B1 s0" mask="url(#d2-3717002466)"/><path fill="none" marker-end="url(#mk-d2-3717002466-3488378134)" d="M562.25 346v94" class="connection stroke-B1 s0" mask="url(#d2-3717002466)"/><path fill="none" marker-end="url(#mk-d2-3717002466-3488378134)" d="M908.25 346c0 38-35 58-171.154 96.901" class="connection stroke-B1 s0" mask="url(#d2-3717002466)"/><path fill="none" marker-end="url(#mk-d2-3717002466-3488378134)" d="M360.057 542.476C198.8 582 158 605.2 158 654" class="connection stroke-B1 s0" mask="url(#d2-3717002466)"/><path fill="none" marker-end="url(#mk-d2-3717002466-3488378134)" d="M561.5 544v94" class="connection stroke-B1 s0" mask="url(#d2-3717002466)"/><path fill="none" marker-end="url(#mk-d2-3717002466-3488378134)" d="M763.443 542.474C925.5 582 966.5 602 966.5 638" class="connection stroke-B1 s0" mask="url(#d2-3717002466)"/><mask id="d2-3717002466" width="1328" height="1111" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1328v1111H-101z"/></mask></svg>