<svg xmlns="http://www.w3.org/2000/svg" width="2395" height="894" class="d2-193220597 d2-svg" viewBox="-101 -101 2395 894"><rect width="2395" height="894" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-193220597 .fill-N1{fill:#0a0f25}.d2-193220597 .fill-B6{fill:#f7f8fe}.d2-193220597 .stroke-B1,.d2-193220597 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M972 0h488v98H972z" class="stroke-B1 fill-B6 s0"/></g><text x="1216" y="38.5" class="text-bold fill-N1 s1"><tspan x="1216" dy="0">12장에서 온 두 조건</tspan><tspan x="1216" dy="17.667">통제 조건 — 그 일이 그의 통제 아래 있었을 것</tspan><tspan x="1216" dy="17.667">인식 조건 — 무엇을 하는지 알았거나 알 수 있었을 것</tspan></text></g><g ><g class="shape"><path d="M0 198h609v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="304.5" y="236.5" class="text-bold fill-N1 s1"><tspan x="304.5" dy="0">설계하고 만든 쪽</tspan><tspan x="304.5" dy="17.667">통제 조건 — 만들 때는 통제했다</tspan><tspan x="304.5" dy="17.667">인식 조건 — 학습으로 행동이 바뀌면 개별 출력을 예견하지 못한다</tspan></text></g><g ><g class="shape"><path d="M669 198h549v98H669z" class="stroke-B1 fill-B6 s0"/></g><text x="943.5" y="236.5" class="text-bold fill-N1 s1"><tspan x="943.5" dy="0">배치한 조직</tspan><tspan x="943.5" dy="17.667">통제 조건 — 쓸지 말지는 정했다</tspan><tspan x="943.5" dy="17.667">인식 조건 — 내부에서 무슨 일이 일어나는지 다 알지 못한다</tspan></text></g><g ><g class="shape"><path d="M1278 198h421v98h-421z" class="stroke-B1 fill-B6 s0"/></g><text x="1488.5" y="236.5" class="text-bold fill-N1 s1"><tspan x="1488.5" dy="0">쓰는 사람</tspan><tspan x="1488.5" dy="17.667">통제 조건 — 개별 결정을 통제하지 못한다</tspan><tspan x="1488.5" dy="17.667">인식 조건 — 왜 그런 출력이 나왔는지 모른다</tspan></text></g><g ><g class="shape"><path d="M696 396h551v82H696z" class="stroke-B1 fill-B6 s0"/></g><text x="971.5" y="434.5" class="text-bold fill-N1 s1"><tspan x="971.5" dy="0">주장 — 어느 쪽에서도 두 조건이 함께 채워지지 않는다.</tspan><tspan x="971.5" dy="18.5">그래서 해가 일어났는데 책임질 사람이 없는 자리가 생긴다</tspan></text></g><g ><g class="shape"><path d="M178 586h644v98H178z" class="stroke-B2 fill-B6 s2"/></g><text x="500" y="624.5" class="text-bold fill-N1 s1"><tspan x="500" dy="0">반론 A — 공백이 아니라 분산이다</tspan><tspan x="500" dy="17.667">조건이 부분적으로 채워진 사람이 여럿 있는 것이지</tspan><tspan x="500" dy="17.667">아무도 없는 것이 아니다. 부분적 책임을 어떻게 나눌지가 물음이 된다</tspan></text></g><g ><g class="shape"><path d="M882 578h627v114H882z" class="stroke-B2 fill-B6 s2"/></g><text x="1195.5" y="616.5" class="text-bold fill-N1 s1"><tspan x="1195.5" dy="0">반론 B — 예견 불가능성은 면책이 아니다</tspan><tspan x="1195.5" dy="17.25">예견할 수 없는 것을 세상에 내놓기로 한 결정 자체가 평가 대상이다.</tspan><tspan x="1195.5" dy="17.25">12장의 결과 운이 여기서 되살아난다 — 같은 결정을 했는데</tspan><tspan x="1195.5" dy="17.25">한쪽만 사고가 났을 때 두 사람을 다르게 평가해도 되는가</tspan></text></g><g ><g class="shape"><path d="M1569 578h624v114h-624z" class="stroke-B2 fill-B6 s2"/></g><text x="1881" y="616.5" class="text-bold fill-N1 s1"><tspan x="1881" dy="0">반론 C — 새로운 문제가 아니다</tspan><tspan x="1881" dy="17.25">조직과 관료제와 시장도 같은 구조를 만든다.</tspan><tspan x="1881" dy="17.25">아무도 전체를 보지 못하는 채로 해가 일어나는 일은 전부터 있었다.</tspan><tspan x="1881" dy="17.25">다만 정도가 다르다는 재반론이 붙는다</tspan></text></g><text x="1803.5" y="39" class="fill-N1 s1"><tspan x="1803.5" dy="0">스트로슨의 틀에서 보면 공백의 정서적 핵심이 드러난다.</tspan><tspan x="1803.5" dy="17.667">우리는 기계에 분개할 수 없다. 분개할 대상이 없다는 느낌이 남는데,</tspan><tspan x="1803.5" dy="17.667">그 느낌이 무엇의 증거인지가 다음 물음이다</tspan></text><marker id="mk-d2-193220597-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-193220597-3488378134)" d="M970.512 76.214C438.1 133.6 304.5 158 304.5 194" class="connection stroke-B1 s0" mask="url(#d2-193220597)"/><path fill="none" marker-end="url(#mk-d2-193220597-3488378134)" d="M1079.62 98.681C971.1 138 943.5 158 943.5 194" class="connection stroke-B1 s0" mask="url(#d2-193220597)"/><path fill="none" marker-end="url(#mk-d2-193220597-3488378134)" d="M1352.38 98.681C1460.9 138 1488.5 158 1488.5 194" class="connection stroke-B1 s0" mask="url(#d2-193220597)"/><path fill="none" marker-end="url(#mk-d2-193220597-3488378134)" d="M304.5 298c0 38 78.4 58.6 388.036 100.464" class="connection stroke-B1 s0" mask="url(#d2-193220597)"/><path fill="none" marker-end="url(#mk-d2-193220597-3488378134)" d="M943.5 298c0 38 3.2 58 14.78 94.19" class="connection stroke-B1 s0" mask="url(#d2-193220597)"/><path fill="none" marker-end="url(#mk-d2-193220597-3488378134)" d="M1488.5 298c0 38-56.8 58-280.06 97.306" class="connection stroke-B1 s0" mask="url(#d2-193220597)"/><path fill="none" marker-end="url(#mk-d2-193220597-3488378134)" d="M756.786 478.38C551.55 518 499.75 539.6 499.75 582" class="connection stroke-B1 s0" mask="url(#d2-193220597)"/><path fill="none" marker-end="url(#mk-d2-193220597-3488378134)" d="M1074.103 478.753C1170.65 518 1195.25 538 1195.25 574" class="connection stroke-B1 s0" mask="url(#d2-193220597)"/><path fill="none" marker-end="url(#mk-d2-193220597-3488378134)" d="M1249.24 464.78C1754.05 515.315 1880.75 538 1880.75 574" class="connection stroke-B1 s0" mask="url(#d2-193220597)"/><mask id="d2-193220597" width="2395" height="894" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2395v894H-101z"/></mask></svg>