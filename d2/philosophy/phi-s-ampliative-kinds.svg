<svg xmlns="http://www.w3.org/2000/svg" width="1225" height="705" class="d2-4189430192 d2-svg" viewBox="-101 -101 1225 705"><rect width="1225" height="705" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-4189430192 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4189430192 .fill-N1{fill:#0a0f25}.d2-4189430192 .fill-B6{fill:#f7f8fe}.d2-4189430192 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="116.5" cy="215" class="shape stroke-B1 fill-B6 s0" rx="116.5" ry="53"/></g><text x="116.5" y="204.5" class="text-bold fill-N1 s1"><tspan x="116.5" dy="0">관찰한 것을</tspan><tspan x="116.5" dy="17.667">넘어서는 추론</tspan><tspan x="116.5" dy="17.667">= 확장적 추론</tspan></text></g><g ><g class="shape"><path d="M334 0h284v98H334z" class="stroke-B1 fill-B6 s0"/></g><text x="476" y="38.5" class="text-bold fill-N1 s1"><tspan x="476" dy="0">열거적 귀납</tspan><tspan x="476" dy="17.667">지금까지 본 A 는 모두 B 였다</tspan><tspan x="476" dy="17.667">→ 다음 A 도 B 일 것이다</tspan></text></g><g ><g class="shape"><path d="M333 158h286v114H333z" class="stroke-B1 fill-B6 s0"/></g><text x="476" y="196.5" class="text-bold fill-N1 s1"><tspan x="476" dy="0">유비 논증</tspan><tspan x="476" dy="17.25">A 와 B 가 여러 점에서 닮았다</tspan><tspan x="476" dy="17.25">→ 남은 한 점에서도</tspan><tspan x="476" dy="17.25">닮았을 것이다</tspan></text></g><g ><g class="shape"><path d="M350 332h252v114H350z" class="stroke-B1 fill-B6 s0"/></g><text x="476" y="370.5" class="text-bold fill-N1 s1"><tspan x="476" dy="0">최선의 설명으로의 추론</tspan><tspan x="476" dy="17.25">H 가 관찰한 것을</tspan><tspan x="476" dy="17.25">가장 잘 설명한다</tspan><tspan x="476" dy="17.25">→ H 가 참일 것이다</tspan></text></g><g ><g class="shape"><path d="M719 150h304v130H719z" class="stroke-B1 fill-B6 s0"/></g><text x="871" y="188.5" class="text-bold fill-N1 s1"><tspan x="871" dy="0">셋 다 결론이 전제를 넘어선다.</tspan><tspan x="871" dy="17">그래서 전제가 모두 참인데</tspan><tspan x="871" dy="17">결론이 거짓인 상황이 늘 있다.</tspan><tspan x="871" dy="17">연역의 타당·부당 잣대로 재면</tspan><tspan x="871" dy="17">셋 다 ‘부당’ 하나로만 나온다</tspan></text></g><text x="511.5" y="482" class="fill-N1 s1"><tspan x="511.5" dy="0">논리학 문서 3장이 여기서 선을 그었다 — ‘이 문서는 연역만 다룬다’.</tspan><tspan x="511.5" dy="18.5">이 장은 그 선의 반대편이다</tspan></text><marker id="mk-d2-4189430192-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4189430192-3488378134)" d="M166.414 165.586C259.4 72.6 293.2 49 330 49" class="connection stroke-B1 s0" mask="url(#d2-4189430192)"/><path fill="none" marker-end="url(#mk-d2-4189430192-3488378134)" d="M235 215h94" class="connection stroke-B1 s0" mask="url(#d2-4189430192)"/><path fill="none" marker-end="url(#mk-d2-4189430192-3488378134)" d="M164.385 265.443C259 364 296.4 389 346 389" class="connection stroke-B1 s0" mask="url(#d2-4189430192)"/><path fill="none" marker-end="url(#mk-d2-4189430192-3488378134)" d="M620 49c38.8 0 73.6 20.2 168.909 98.462" class="connection stroke-B1 s0" mask="url(#d2-4189430192)"/><path fill="none" marker-end="url(#mk-d2-4189430192-3488378134)" d="M621 215h94" class="connection stroke-B1 s0" mask="url(#d2-4189430192)"/><path fill="none" marker-end="url(#mk-d2-4189430192-3488378134)" d="M604 389c51.6 0 90.4-21.8 188.965-106.395" class="connection stroke-B1 s0" mask="url(#d2-4189430192)"/><mask id="d2-4189430192" width="1225" height="705" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1225v705H-101z"/></mask></svg>