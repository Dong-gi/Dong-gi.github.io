<svg xmlns="http://www.w3.org/2000/svg" width="1864" height="616" class="d2-1962105984 d2-svg" viewBox="-101 -101 1864 616"><rect width="1864" height="616" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1962105984 .fill-N1{fill:#0a0f25}.d2-1962105984 .fill-B6{fill:#f7f8fe}.d2-1962105984 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="283" cy="207" class="shape stroke-B1 fill-B6 s0" rx="195" ry="65"/></g><text x="283" y="204.5" class="text-bold fill-N1 s1"><tspan x="283" dy="0">관찰한 것을 넘어서는 추론</tspan><tspan x="283" dy="18.5">= 확장적 추론</tspan></text></g><g ><g class="shape"><path d="M691 0h284v98H691z" class="stroke-B1 fill-B6 s0"/></g><text x="833" y="38.5" class="text-bold fill-N1 s1"><tspan x="833" dy="0">열거적 귀납</tspan><tspan x="833" dy="17.667">지금까지 본 A 는 모두 B 였다</tspan><tspan x="833" dy="17.667">→ 다음 A 도 B 일 것이다</tspan></text></g><g ><g class="shape"><path d="M666 158h334v98H666z" class="stroke-B1 fill-B6 s0"/></g><text x="833" y="196.5" class="text-bold fill-N1 s1"><tspan x="833" dy="0">유비 논증</tspan><tspan x="833" dy="17.667">A 와 B 가 여러 점에서 닮았다</tspan><tspan x="833" dy="17.667">→ 남은 한 점에서도 닮았을 것이다</tspan></text></g><g ><g class="shape"><path d="M665 316h336v98H665z" class="stroke-B1 fill-B6 s0"/></g><text x="833" y="354.5" class="text-bold fill-N1 s1"><tspan x="833" dy="0">최선의 설명으로의 추론</tspan><tspan x="833" dy="17.667">H 가 관찰한 것을 가장 잘 설명한다</tspan><tspan x="833" dy="17.667">→ H 가 참일 것이다</tspan></text></g><g ><g class="shape"><path d="M1101 86h561v98h-561z" class="stroke-B1 fill-B6 s0"/></g><text x="1381.5" y="124.5" class="text-bold fill-N1 s1"><tspan x="1381.5" dy="0">셋 다 결론이 전제를 넘어선다.</tspan><tspan x="1381.5" dy="17.667">그래서 전제가 모두 참인데 결론이 거짓인 상황이 늘 있다.</tspan><tspan x="1381.5" dy="17.667">연역의 타당·부당 잣대로 재면 셋 다 ‘부당’ 하나로만 나온다</tspan></text></g><text x="282.5" y="348" class="fill-N1 s1"><tspan x="282.5" dy="0">논리학 문서 3장이 여기서 선을 그었다 — ‘이 문서는 연역만 다룬다’.</tspan><tspan x="282.5" dy="18.5">이 장은 그 선의 반대편이다</tspan></text><marker id="mk-d2-1962105984-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1962105984-3488378134)" d="M395.806 153.142C570.8 70 630.2 49 687 49" class="connection stroke-B1 s0" mask="url(#d2-1962105984)"/><path fill="none" marker-end="url(#mk-d2-1962105984-3488378134)" d="M480 207h182" class="connection stroke-B1 s0" mask="url(#d2-1962105984)"/><path fill="none" marker-end="url(#mk-d2-1962105984-3488378134)" d="M395.806 260.858C570.8 344 625 365 661 365" class="connection stroke-B1 s0" mask="url(#d2-1962105984)"/><path fill="none" marker-end="url(#mk-d2-1962105984-3488378134)" d="M977 49c58.8 0 102.4 7.4 212.13 35.991" class="connection stroke-B1 s0" mask="url(#d2-1962105984)"/><path fill="none" marker-end="url(#mk-d2-1962105984-3488378134)" d="M1002 207c38.8 0 69.958-4.55 149.883-21.901" class="connection stroke-B1 s0" mask="url(#d2-1962105984)"/><path fill="none" marker-end="url(#mk-d2-1962105984-3488378134)" d="M1003 365c38 0 100.002-36.15 304.728-178.467" class="connection stroke-B1 s0" mask="url(#d2-1962105984)"/><mask id="d2-1962105984" width="1864" height="616" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1864v616H-101z"/></mask></svg>