<svg xmlns="http://www.w3.org/2000/svg" width="2655" height="1496" class="d2-549976671 d2-svg" viewBox="-101 -101 2655 1496"><rect width="2655" height="1496" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-549976671 .fill-N1{fill:#0a0f25}.d2-549976671 .fill-N2{fill:#676c7e}.d2-549976671 .fill-B6{fill:#f7f8fe}.d2-549976671 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="459" cy="131.5" class="shape stroke-B1 fill-B6 s0" rx="394" ry="131.5"/></g><text x="459" y="121" class="text-bold fill-N1 s1"><tspan x="459" dy="0">무대</tspan><tspan x="459" dy="17.667">존스는 투표를 하려 한다. 블랙은 존스가 A 를 찍기를 바란다.</tspan><tspan x="459" dy="17.667">블랙은 존스의 머리에 장치를 심어 두고 지켜본다</tspan></text></g><g ><g class="shape"><path d="M459 487h-6l-344-61c-4-1-4-2 0-2l344-61c4-1 9-1 13 0l344 60c4 1 4 2 0 2l-345 62z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="459" y="422.5" class="text-bold fill-N1 s1"><tspan x="459" dy="0">존스가 마음을 정하는 순간</tspan><tspan x="459" dy="18.5">블랙은 그 징후를 읽고 개입할지 정한다</tspan></text></g><g ><g class="shape"><path d="M78 608h316v98H78z" class="stroke-B1 fill-B6 s0"/></g><text x="236" y="646.5" class="text-bold fill-N1 s1"><tspan x="236" dy="0">실제로 일어난 일</tspan><tspan x="236" dy="17.667">존스가 스스로 A 를 찍기로 한다.</tspan><tspan x="236" dy="17.667">블랙은 아무것도 하지 않는다</tspan></text></g><g ><g class="shape"><path d="M473 608h419v98H473z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="682.5" y="646.5" class="text-bold fill-N1 s1"><tspan x="682.5" dy="0">일어나지 않은 일</tspan><tspan x="682.5" dy="17.667">존스가 B 쪽으로 기울었다면</tspan><tspan x="682.5" dy="17.667">블랙이 장치를 켜 A 를 찍게 만들었을 것이다</tspan></text></g><g ><g class="shape"><path d="M25 806h422v82H25z" class="stroke-B1 fill-B6 s0"/></g><text x="236" y="844.5" class="text-bold fill-N1 s1"><tspan x="236" dy="0">존스는 A 를 찍은 데 대해 책임이 있어 보인다</tspan><tspan x="236" dy="18.5">그가 한 일은 개입 없는 자기 결정이었다</tspan></text></g><g ><g class="shape"><path d="M507 806h352v82H507z" class="stroke-B1 fill-B6 s0"/></g><text x="683" y="844.5" class="text-bold fill-N1 s1"><tspan x="683" dy="0">그런데 존스는 달리 할 수 없었다</tspan><tspan x="683" dy="18.5">어느 쪽으로 기울었든 결과는 A 였다</tspan></text></g><g ><g class="shape"><ellipse cx="459" cy="1141" class="shape stroke-B1 fill-B6 s0" rx="459" ry="153"/></g><text x="459" y="1130.5" class="text-bold fill-N1 s1"><tspan x="459" dy="0">겨냥하는 것 — 대안 가능성 원리</tspan><tspan x="459" dy="17.667">‘책임이 있으려면 달리 할 수 있었어야 한다’ 는 원리가 반례를 맞는다.</tspan><tspan x="459" dy="17.667">결정론이 참이라는 결론은 여기서 나오지 않는다</tspan></text></g><text x="1331.5" y="121" class="fill-N1 s1"><tspan x="1331.5" dy="0">사례가 성공했는지도 다툼거리다 — 딜레마 반론.</tspan><tspan x="1331.5" dy="17.667">블랙이 읽은 징후가 존스의 선택을 이미 못 박는 것이라면, 사례는 결정론을 몰래 깔고 들어간 것이다.</tspan><tspan x="1331.5" dy="17.667">못 박지 않는 것이라면, 블랙은 제때 개입할 수 없으므로 대안이 정말로 사라진 것이 아니다</tspan></text><text x="2131.5" y="121" class="fill-N1 s1"><tspan x="2131.5" dy="0">또 하나의 응답 — 번쩍임.</tspan><tspan x="2131.5" dy="17.667">존스에게 남은 대안이 아주 작게라도 있다(B 쪽으로 기울어 개입을 부르는 일).</tspan><tspan x="2131.5" dy="17.667">프랭크퍼트 쪽 답 — 그 남은 대안은 책임을 떠받칠 만큼의 것이 못 된다</tspan></text><marker id="mk-d2-549976671-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-549976671-3488378134)" d="M459 265v93" class="connection stroke-B1 s0" mask="url(#d2-549976671)"/><path fill="none" marker-end="url(#mk-d2-549976671-3488378134)" d="M369.253 472.973C262.6 532.4 235.5 559.7 235.5 604.5" class="connection stroke-B1 s0" mask="url(#d2-549976671)"/><text x="279" y="529" class="text-italic fill-N2 s1">A 쪽 징후</text><path fill="none" marker-end="url(#mk-d2-549976671-3488378134)" d="M548.747 472.973C655.4 532.4 682.5 559.7 682.5 604.5" class="connection stroke-B1 s0" mask="url(#d2-549976671)"/><text x="639" y="529" class="text-italic fill-N2 s1">B 쪽 징후</text><path fill="none" marker-end="url(#mk-d2-549976671-3488378134)" d="M235.5 708v94" class="connection stroke-B1 s0" mask="url(#d2-549976671)"/><path fill="none" marker-end="url(#mk-d2-549976671-3488378134)" d="M682.5 708v94" class="connection stroke-B1 s0" mask="url(#d2-549976671)"/><path fill="none" marker-end="url(#mk-d2-549976671-3488378134)" d="M235.5 890c0 38 13.1 59.8 62.528 104.323" class="connection stroke-B1 s0" mask="url(#d2-549976671)"/><path fill="none" marker-end="url(#mk-d2-549976671-3488378134)" d="M682.5 890c0 38-13.1 59.8-62.528 104.323" class="connection stroke-B1 s0" mask="url(#d2-549976671)"/><mask id="d2-549976671" width="2655" height="1496" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2655v1496H-101z"/><path d="M240 513h78v21h-78zM600 513h78v21h-78z"/></mask></svg>