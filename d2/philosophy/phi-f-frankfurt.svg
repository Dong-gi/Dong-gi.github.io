<svg xmlns="http://www.w3.org/2000/svg" width="870" height="1615" class="d2-3119815725 d2-svg" viewBox="-101 -101 870 1615"><rect width="870" height="1615" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3119815725 .fill-N1{fill:#0a0f25}.d2-3119815725 .fill-N2{fill:#676c7e}.d2-3119815725 .fill-B6{fill:#f7f8fe}.d2-3119815725 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="338" cy="110" class="shape stroke-B1 fill-B6 s0" rx="330" ry="110"/></g><text x="338" y="91.5" class="text-bold fill-N1 s1"><tspan x="338" dy="0">무대</tspan><tspan x="338" dy="17.25">존스는 투표를 하려 한다.</tspan><tspan x="338" dy="17.25">블랙은 존스가 A 를 찍기를 바란다.</tspan><tspan x="338" dy="17.25">블랙은 존스의 머리에 장치를 심어 두고 지켜본다</tspan></text></g><g ><g class="shape"><path d="M338 476c-2 0-3 0-4-1L94 400c-3-1-3-2 0-3l240-76c3-1 6-1 9 0l240 76c3 1 3 2 0 3l-241 75c-1 1-2 1-4 1Z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="338" y="387.5" class="text-bold fill-N1 s1"><tspan x="338" dy="0">존스가 마음을 정하는 순간</tspan><tspan x="338" dy="17.667">블랙은 그 징후를 읽고</tspan><tspan x="338" dy="17.667">개입할지 정한다</tspan></text></g><g ><g class="shape"><path d="M0 605h316v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="158" y="643.5" class="text-bold fill-N1 s1"><tspan x="158" dy="0">실제로 일어난 일</tspan><tspan x="158" dy="17.667">존스가 스스로 A 를 찍기로 한다.</tspan><tspan x="158" dy="17.667">블랙은 아무것도 하지 않는다</tspan></text></g><g ><g class="shape"><path d="M376 597h285v114H376z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="518.5" y="635.5" class="text-bold fill-N1 s1"><tspan x="518.5" dy="0">일어나지 않은 일</tspan><tspan x="518.5" dy="17.25">존스가 B 쪽으로 기울었다면</tspan><tspan x="518.5" dy="17.25">블랙이 장치를 켜</tspan><tspan x="518.5" dy="17.25">A 를 찍게 만들었을 것이다</tspan></text></g><g ><g class="shape"><path d="M20 811h276v114H20z" class="stroke-B1 fill-B6 s0"/></g><text x="158" y="849.5" class="text-bold fill-N1 s1"><tspan x="158" dy="0">존스는 A 를 찍은 데 대해</tspan><tspan x="158" dy="17.25">책임이 있어 보인다</tspan><tspan x="158" dy="17.25">그가 한 일은</tspan><tspan x="158" dy="17.25">개입 없는 자기 결정이었다</tspan></text></g><g ><g class="shape"><path d="M403 811h232v114H403z" class="stroke-B1 fill-B6 s0"/></g><text x="519" y="849.5" class="text-bold fill-N1 s1"><tspan x="519" dy="0">그런데 존스는</tspan><tspan x="519" dy="17.25">달리 할 수 없었다</tspan><tspan x="519" dy="17.25">어느 쪽으로 기울었든</tspan><tspan x="519" dy="17.25">결과는 A 였다</tspan></text></g><g ><g class="shape"><ellipse cx="338" cy="1134.5" class="shape stroke-B1 fill-B6 s0" rx="328" ry="109.5"/></g><text x="338" y="1116" class="text-bold fill-N1 s1"><tspan x="338" dy="0">겨냥하는 것 — 대안 가능성 원리</tspan><tspan x="338" dy="17.25">‘책임이 있으려면 달리 할 수 있었어야 한다’ 는</tspan><tspan x="338" dy="17.25">원리가 반례를 맞는다.</tspan><tspan x="338" dy="17.25">결정론이 참이라는 결론은 여기서 나오지 않는다</tspan></text></g><text x="333.5" y="1280" class="fill-N1 s1"><tspan x="333.5" dy="0">사례가 성공했는지도 다툼거리다 — 딜레마 반론.</tspan><tspan x="333.5" dy="16.556">블랙이 읽은 징후가 존스의 선택을 이미 못 박는 것이라면,</tspan><tspan x="333.5" dy="16.556">사례는 결정론을 몰래 깔고 들어간 것이다.</tspan><tspan x="333.5" dy="16.556">못 박지 않는 것이라면, 블랙은 제때 개입할 수 없으므로</tspan><tspan x="333.5" dy="16.556">대안이 정말로 사라진 것이 아니다.</tspan><tspan x="333.5" dy="16.556"> </tspan><tspan x="333.5" dy="16.556">또 하나의 응답 — 번쩍임.</tspan><tspan x="333.5" dy="16.556">존스에게 남은 대안이 아주 작게라도 있다(B 쪽으로 기울어 개입을 부르는 일).</tspan><tspan x="333.5" dy="16.556">프랭크퍼트 쪽 답 — 그 남은 대안은 책임을 떠받칠 만큼의 것이 못 된다</tspan></text><marker id="mk-d2-3119815725-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3119815725-3488378134)" d="M338.01 222c.19 38 .19 58 .01 94" class="connection stroke-B1 s0" mask="url(#d2-3119815725)"/><path fill="none" marker-end="url(#mk-d2-3119815725-3488378134)" d="M263.416 455.221C179.4 520 158 550.3 158 601.5" class="connection stroke-B1 s0" mask="url(#d2-3119815725)"/><text x="186" y="521" class="text-italic fill-N2 s1">A 쪽 징후</text><path fill="none" marker-end="url(#mk-d2-3119815725-3488378134)" d="M412.587 455.218C497 520 518.5 548.7 518.5 593.5" class="connection stroke-B1 s0" mask="url(#d2-3119815725)"/><text x="488" y="518" class="text-italic fill-N2 s1">B 쪽 징후</text><path fill="none" marker-end="url(#mk-d2-3119815725-3488378134)" d="M158 705v102" class="connection stroke-B1 s0" mask="url(#d2-3119815725)"/><path fill="none" marker-end="url(#mk-d2-3119815725-3488378134)" d="M518.5 713v94" class="connection stroke-B1 s0" mask="url(#d2-3119815725)"/><path fill="none" marker-end="url(#mk-d2-3119815725-3488378134)" d="M158 927c0 38 13 59.4 61.993 102.363" class="connection stroke-B1 s0" mask="url(#d2-3119815725)"/><path fill="none" marker-end="url(#mk-d2-3119815725-3488378134)" d="M518.5 927c0 38-12.9 59.4-61.503 102.351" class="connection stroke-B1 s0" mask="url(#d2-3119815725)"/><mask id="d2-3119815725" width="870" height="1615" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h870v1615h-870z"/><path d="M147 505h78v21h-78zM449 502h78v21h-78z"/></mask></svg>