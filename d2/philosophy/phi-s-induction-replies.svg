<svg xmlns="http://www.w3.org/2000/svg" width="1418" height="1068" class="d2-1021164556 d2-svg" viewBox="-101 -101 1418 1068"><rect width="1418" height="1068" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1021164556 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1021164556 .fill-N1{fill:#0a0f25}.d2-1021164556 .fill-B6{fill:#f7f8fe}.d2-1021164556 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="165" cy="453" class="shape stroke-B1 fill-B6 s0" rx="165" ry="55"/></g><text x="165" y="442.5" class="text-bold fill-N1 s1"><tspan x="165" dy="0">흄의 문제</tspan><tspan x="165" dy="17.667">귀납을 정당화하는</tspan><tspan x="165" dy="17.667">순환 없는 논증이 없다</tspan></text></g><g ><g class="shape"><path d="M440 0h326v130H440z" class="stroke-B1 fill-B6 s0"/></g><text x="603" y="38.5" class="text-bold fill-N1 s1"><tspan x="603" dy="0">물음을 해소한다 (스트로슨)</tspan><tspan x="603" dy="17">‘합리적’ 이라는 말이 이미</tspan><tspan x="603" dy="17">‘귀납의 기준에 맞는’ 을 뜻한다.</tspan><tspan x="603" dy="17">귀납이 합리적이냐는 물음은</tspan><tspan x="603" dy="17">물음이 아니다</tspan></text></g><g ><g class="shape"><path d="M908 16h276v98H908z" class="stroke-B1 fill-B6 s0"/></g><text x="1046" y="54.5" class="text-bold fill-N1 s1"><tspan x="1046" dy="0">반론 — 그 기준을</tspan><tspan x="1046" dy="17.667">왜 써야 하는가라는 물음은</tspan><tspan x="1046" dy="17.667">그대로 남는다</tspan></text></g><g ><g class="shape"><path d="M430 190h345v146H430z" class="stroke-B1 fill-B6 s0"/></g><text x="602.5" y="228.5" class="text-bold fill-N1 s1"><tspan x="602.5" dy="0">실용적으로 옹호한다 (라이헨바흐)</tspan><tspan x="602.5" dy="16.833">자연에 규칙성이 있다면</tspan><tspan x="602.5" dy="16.833">귀납은 결국 그것을 찾아낸다.</tspan><tspan x="602.5" dy="16.833">없다면 어떤 방법도 못 찾는다.</tspan><tspan x="602.5" dy="16.833">그러니 귀납을 쓰는 것이</tspan><tspan x="602.5" dy="16.833">손해가 아니다</tspan></text></g><g ><g class="shape"><path d="M886 206h319v114H886z" class="stroke-B1 fill-B6 s0"/></g><text x="1045.5" y="244.5" class="text-bold fill-N1 s1"><tspan x="1045.5" dy="0">반론 — 같은 논증이</tspan><tspan x="1045.5" dy="17.25">무수한 다른 규칙에도</tspan><tspan x="1045.5" dy="17.25">그대로 적용된다.</tspan><tspan x="1045.5" dy="17.25">귀납만 고를 근거가 되지 못한다</tspan></text></g><g ><g class="shape"><path d="M433 396h340v114H433z" class="stroke-B1 fill-B6 s0"/></g><text x="603" y="434.5" class="text-bold fill-N1 s1"><tspan x="603" dy="0">규칙 순환은 다르다고 본다</tspan><tspan x="603" dy="17.25">결론을 전제로 쓴 것이 아니라</tspan><tspan x="603" dy="17.25">규칙을 그 규칙으로 지지한 것이니</tspan><tspan x="603" dy="17.25">나쁘지 않다</tspan></text></g><g ><g class="shape"><path d="M906 404h279v98H906z" class="stroke-B1 fill-B6 s0"/></g><text x="1045.5" y="442.5" class="text-bold fill-N1 s1"><tspan x="1045.5" dy="0">반론 — 같은 방식으로</tspan><tspan x="1045.5" dy="17.667">아무 규칙이나</tspan><tspan x="1045.5" dy="17.667">자기 자신을 지지할 수 있다</tspan></text></g><g ><g class="shape"><path d="M433 570h340v130H433z" class="stroke-B1 fill-B6 s0"/></g><text x="603" y="608.5" class="text-bold fill-N1 s1"><tspan x="603" dy="0">외재주의로 돌린다 (6장의 신빙론)</tspan><tspan x="603" dy="17">귀납이 실제로 믿을 만한 과정이면</tspan><tspan x="603" dy="17">그것으로 정당화된다.</tspan><tspan x="603" dy="17">우리가 그것을 증명해 보일</tspan><tspan x="603" dy="17">필요는 없다</tspan></text></g><g ><g class="shape"><path d="M875 586h341v98H875z" class="stroke-B1 fill-B6 s0"/></g><text x="1045.5" y="624.5" class="text-bold fill-N1 s1"><tspan x="1045.5" dy="0">반론 — 흄이 물은 것이</tspan><tspan x="1045.5" dy="17.667">바로 ‘실제로 믿을 만한가’ 였다면</tspan><tspan x="1045.5" dy="17.667">이 답은 물음을 되풀이한다</tspan></text></g><g ><g class="shape"><path d="M447 760h311v98H447z" class="stroke-B1 fill-B6 s0"/></g><text x="602.5" y="798.5" class="text-bold fill-N1 s1"><tspan x="602.5" dy="0">귀납이 필요 없다고 본다 (포퍼)</tspan><tspan x="602.5" dy="17.667">과학은 추측하고 반증할 뿐</tspan><tspan x="602.5" dy="17.667">귀납하지 않는다</tspan></text></g><g ><g class="shape"><path d="M888 752h316v114H888z" class="stroke-B1 fill-B6 s0"/></g><text x="1046" y="790.5" class="text-bold fill-N1 s1"><tspan x="1046" dy="0">반론 — 반증을 견딘 이론을</tspan><tspan x="1046" dy="17.25">앞으로도 쓰겠다는 판단 자체가</tspan><tspan x="1046" dy="17.25">귀납이다.</tspan><tspan x="1046" dy="17.25">9장에서 다시 본다</tspan></text></g><marker id="mk-d2-1021164556-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1021164556-3488378134)" d="M195.97 397.25C343 131.8 391.9 65 435.5 65" class="connection stroke-B1 s0" mask="url(#d2-1021164556)"/><path fill="none" marker-end="url(#mk-d2-1021164556-3488378134)" d="M224.497 400.674C348.6 290.8 390 263 426 263" class="connection stroke-B1 s0" mask="url(#d2-1021164556)"/><path fill="none" marker-end="url(#mk-d2-1021164556-3488378134)" d="M332 453h96.5" class="connection stroke-B1 s0" mask="url(#d2-1021164556)"/><path fill="none" marker-end="url(#mk-d2-1021164556-3488378134)" d="M226.528 505.291C349 608.8 390.5 635 428.5 635" class="connection stroke-B1 s0" mask="url(#d2-1021164556)"/><path fill="none" marker-end="url(#mk-d2-1021164556-3488378134)" d="M198.036 508.71C343.4 748.6 393.4 809 443 809" class="connection stroke-B1 s0" mask="url(#d2-1021164556)"/><path fill="none" marker-end="url(#mk-d2-1021164556-3488378134)" d="M768.5 65h135" class="connection stroke-B1 s0" mask="url(#d2-1021164556)"/><path fill="none" marker-end="url(#mk-d2-1021164556-3488378134)" d="M777 263h105" class="connection stroke-B1 s0" mask="url(#d2-1021164556)"/><path fill="none" marker-end="url(#mk-d2-1021164556-3488378134)" d="M775.5 453H902" class="connection stroke-B1 s0" mask="url(#d2-1021164556)"/><path fill="none" marker-end="url(#mk-d2-1021164556-3488378134)" d="M775.5 635H871" class="connection stroke-B1 s0" mask="url(#d2-1021164556)"/><path fill="none" marker-end="url(#mk-d2-1021164556-3488378134)" d="M760 809h123.5" class="connection stroke-B1 s0" mask="url(#d2-1021164556)"/><mask id="d2-1021164556" width="1418" height="1068" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1418V967H-101z"/></mask></svg>