<svg xmlns="http://www.w3.org/2000/svg" width="2301" height="932" class="d2-2599704900 d2-svg" viewBox="-101 -101 2301 932"><rect width="2301" height="932" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2599704900 .fill-N1{fill:#0a0f25}.d2-2599704900 .fill-B6{fill:#f7f8fe}.d2-2599704900 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="285" cy="381" class="shape stroke-B1 fill-B6 s0" rx="285" ry="95"/></g><text x="285" y="378.5" class="text-bold fill-N1 s1"><tspan x="285" dy="0">흄의 문제</tspan><tspan x="285" dy="18.5">귀납을 정당화하는 순환 없는 논증이 없다</tspan></text></g><g ><g class="shape"><path d="M670 0h563v98H670z" class="stroke-B1 fill-B6 s0"/></g><text x="951.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="951.5" dy="0">물음을 해소한다 (스트로슨)</tspan><tspan x="951.5" dy="17.667">‘합리적’ 이라는 말이 이미 ‘귀납의 기준에 맞는’ 을 뜻한다.</tspan><tspan x="951.5" dy="17.667">귀납이 합리적이냐는 물음은 물음이 아니다</tspan></text></g><g ><g class="shape"><path d="M1442 16h549v66h-549z" class="stroke-B1 fill-B6 s0"/></g><text x="1716.5" y="54.5" class="text-bold fill-N1 s1">반론 — 그 기준을 왜 써야 하는가라는 물음은 그대로 남는다</text></g><g ><g class="shape"><path d="M695 158h513v114H695z" class="stroke-B1 fill-B6 s0"/></g><text x="951.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="951.5" dy="0">실용적으로 옹호한다 (라이헨바흐)</tspan><tspan x="951.5" dy="17.25">자연에 규칙성이 있다면 귀납은 결국 그것을 찾아낸다.</tspan><tspan x="951.5" dy="17.25">없다면 어떤 방법도 못 찾는다.</tspan><tspan x="951.5" dy="17.25">그러니 귀납을 쓰는 것이 손해가 아니다</tspan></text></g><g ><g class="shape"><path d="M1441 174h551v82h-551z" class="stroke-B1 fill-B6 s0"/></g><text x="1716.5" y="212.5" class="text-bold fill-N1 s1"><tspan x="1716.5" dy="0">반론 — 같은 논증이 무수한 다른 규칙에도 그대로 적용된다.</tspan><tspan x="1716.5" dy="18.5">귀납만 고를 근거가 되지 못한다</tspan></text></g><g ><g class="shape"><path d="M728 332h447v98H728z" class="stroke-B1 fill-B6 s0"/></g><text x="951.5" y="370.5" class="text-bold fill-N1 s1"><tspan x="951.5" dy="0">규칙 순환은 다르다고 본다</tspan><tspan x="951.5" dy="17.667">결론을 전제로 쓴 것이 아니라</tspan><tspan x="951.5" dy="17.667">규칙을 그 규칙으로 지지한 것이니 나쁘지 않다</tspan></text></g><g ><g class="shape"><path d="M1420 348h592v66h-592z" class="stroke-B1 fill-B6 s0"/></g><text x="1716" y="386.5" class="text-bold fill-N1 s1">반론 — 같은 방식으로 아무 규칙이나 자기 자신을 지지할 수 있다</text></g><g ><g class="shape"><path d="M685 490h533v98H685z" class="stroke-B1 fill-B6 s0"/></g><text x="951.5" y="528.5" class="text-bold fill-N1 s1"><tspan x="951.5" dy="0">외재주의로 돌린다 (6장의 신빙론)</tspan><tspan x="951.5" dy="17.667">귀납이 실제로 믿을 만한 과정이면 그것으로 정당화된다.</tspan><tspan x="951.5" dy="17.667">우리가 그것을 증명해 보일 필요는 없다</tspan></text></g><g ><g class="shape"><path d="M1333 506h766v66h-766z" class="stroke-B1 fill-B6 s0"/></g><text x="1716" y="544.5" class="text-bold fill-N1 s1">반론 — 흄이 물은 것이 바로 ‘실제로 믿을 만한가’ 였다면 이 답은 물음을 되풀이한다</text></g><g ><g class="shape"><path d="M740 648h424v82H740z" class="stroke-B1 fill-B6 s0"/></g><text x="952" y="686.5" class="text-bold fill-N1 s1"><tspan x="952" dy="0">귀납이 필요 없다고 본다 (포퍼)</tspan><tspan x="952" dy="18.5">과학은 추측하고 반증할 뿐 귀납하지 않는다</tspan></text></g><g ><g class="shape"><path d="M1399 648h635v82h-635z" class="stroke-B1 fill-B6 s0"/></g><text x="1716.5" y="686.5" class="text-bold fill-N1 s1"><tspan x="1716.5" dy="0">반론 — 반증을 견딘 이론을 앞으로도 쓰겠다는 판단 자체가 귀납이다.</tspan><tspan x="1716.5" dy="18.5">9장에서 다시 본다</tspan></text></g><marker id="mk-d2-2599704900-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2599704900-3488378134)" d="M377.42 289.592C571.2 97.399 630 49 666 49" class="connection stroke-B1 s0" mask="url(#d2-2599704900)"/><path fill="none" marker-end="url(#mk-d2-2599704900-3488378134)" d="M445.793 301.114C584.8 232.399 635 215 691 215" class="connection stroke-B1 s0" mask="url(#d2-2599704900)"/><path fill="none" marker-end="url(#mk-d2-2599704900-3488378134)" d="M572 381h152" class="connection stroke-B1 s0" mask="url(#d2-2599704900)"/><path fill="none" marker-end="url(#mk-d2-2599704900-3488378134)" d="M450.812 459.848C585.8 523 633 539 681 539" class="connection stroke-B1 s0" mask="url(#d2-2599704900)"/><path fill="none" marker-end="url(#mk-d2-2599704900-3488378134)" d="M383.472 471.354C572.4 645.2 643.9 689 735.5 689" class="connection stroke-B1 s0" mask="url(#d2-2599704900)"/><path fill="none" marker-end="url(#mk-d2-2599704900-3488378134)" d="M1235 49h202.5" class="connection stroke-B1 s0" mask="url(#d2-2599704900)"/><path fill="none" marker-end="url(#mk-d2-2599704900-3488378134)" d="M1210 215h226.5" class="connection stroke-B1 s0" mask="url(#d2-2599704900)"/><path fill="none" marker-end="url(#mk-d2-2599704900-3488378134)" d="M1177 381h239" class="connection stroke-B1 s0" mask="url(#d2-2599704900)"/><path fill="none" marker-end="url(#mk-d2-2599704900-3488378134)" d="M1220 539h109" class="connection stroke-B1 s0" mask="url(#d2-2599704900)"/><path fill="none" marker-end="url(#mk-d2-2599704900-3488378134)" d="M1166 689h228.5" class="connection stroke-B1 s0" mask="url(#d2-2599704900)"/><mask id="d2-2599704900" width="2301" height="932" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2301v932H-101z"/></mask></svg>