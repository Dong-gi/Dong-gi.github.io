<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1196" class="d2-2255925870 d2-svg" viewBox="-89 -89 1060 1196"><rect width="1060" height="1196" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2255925870 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2255925870 .fill-N1{fill:#0a0f25}.d2-2255925870 .fill-B6{fill:#f7f8fe}.d2-2255925870 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="110.5" cy="569" class="shape stroke-B1 fill-B6 s0" rx="98.5" ry="100"/></g><text x="110.5" y="542.5" class="text-bold fill-N1 s1"><tspan x="110.5" dy="0">흄의 문제</tspan><tspan x="110.5" dy="17">귀납을</tspan><tspan x="110.5" dy="17">정당화하는</tspan><tspan x="110.5" dy="17">순환 없는</tspan><tspan x="110.5" dy="17">논증이 없다</tspan></text></g><g ><g class="shape"><path d="M342 12h229v194H342z" class="stroke-B1 fill-B6 s0"/></g><text x="456.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="456.5" dy="0">물음을 해소한다</tspan><tspan x="456.5" dy="16.556">(스트로슨)</tspan><tspan x="456.5" dy="16.556">‘합리적’ 이라는</tspan><tspan x="456.5" dy="16.556">말이 이미</tspan><tspan x="456.5" dy="16.556">‘귀납의 기준에</tspan><tspan x="456.5" dy="16.556">맞는’ 을 뜻한다.</tspan><tspan x="456.5" dy="16.556">귀납이 합리적이냐는</tspan><tspan x="456.5" dy="16.556">물음은</tspan><tspan x="456.5" dy="16.556">물음이 아니다</tspan></text></g><g ><g class="shape"><path d="M644 52h212v114H644z" class="stroke-B1 fill-B6 s0"/></g><text x="750" y="90.5" class="text-bold fill-N1 s1"><tspan x="750" dy="0">반론 — 그 기준을</tspan><tspan x="750" dy="17.25">왜 써야 하는가라는</tspan><tspan x="750" dy="17.25">물음은</tspan><tspan x="750" dy="17.25">그대로 남는다</tspan></text></g><g ><g class="shape"><path d="M350 226h212v242H350z" class="stroke-B1 fill-B6 s0"/></g><text x="456" y="264.5" class="text-bold fill-N1 s1"><tspan x="456" dy="0">실용적으로</tspan><tspan x="456" dy="16.417">옹호한다</tspan><tspan x="456" dy="16.417">(라이헨바흐)</tspan><tspan x="456" dy="16.417">자연에 규칙성이</tspan><tspan x="456" dy="16.417">있다면</tspan><tspan x="456" dy="16.417">귀납은 결국</tspan><tspan x="456" dy="16.417">그것을 찾아낸다.</tspan><tspan x="456" dy="16.417">없다면 어떤 방법도</tspan><tspan x="456" dy="16.417">못 찾는다.</tspan><tspan x="456" dy="16.417">그러니 귀납을</tspan><tspan x="456" dy="16.417">쓰는 것이</tspan><tspan x="456" dy="16.417">손해가 아니다</tspan></text></g><g ><g class="shape"><path d="M644 274h212v146H644z" class="stroke-B1 fill-B6 s0"/></g><text x="750" y="312.5" class="text-bold fill-N1 s1"><tspan x="750" dy="0">반론 — 같은 논증이</tspan><tspan x="750" dy="16.833">무수한 다른</tspan><tspan x="750" dy="16.833">규칙에도</tspan><tspan x="750" dy="16.833">그대로 적용된다.</tspan><tspan x="750" dy="16.833">귀납만 고를</tspan><tspan x="750" dy="16.833">근거가 되지 못한다</tspan></text></g><g ><g class="shape"><path d="M339 488h235v162H339z" class="stroke-B1 fill-B6 s0"/></g><text x="456.5" y="526.5" class="text-bold fill-N1 s1"><tspan x="456.5" dy="0">규칙 순환은</tspan><tspan x="456.5" dy="16.714">다르다고 본다</tspan><tspan x="456.5" dy="16.714">결론을 전제로 쓴 것이</tspan><tspan x="456.5" dy="16.714">아니라</tspan><tspan x="456.5" dy="16.714">규칙을 그 규칙으로</tspan><tspan x="456.5" dy="16.714">지지한 것이니</tspan><tspan x="456.5" dy="16.714">나쁘지 않다</tspan></text></g><g ><g class="shape"><path d="M644 512h226v114H644z" class="stroke-B1 fill-B6 s0"/></g><text x="757" y="550.5" class="text-bold fill-N1 s1"><tspan x="757" dy="0">반론 — 같은 방식으로</tspan><tspan x="757" dy="17.25">아무 규칙이나</tspan><tspan x="757" dy="17.25">자기 자신을</tspan><tspan x="757" dy="17.25">지지할 수 있다</tspan></text></g><g ><g class="shape"><path d="M339 670h234v178H339z" class="stroke-B1 fill-B6 s0"/></g><text x="456" y="708.5" class="text-bold fill-N1 s1"><tspan x="456" dy="0">외재주의로 돌린다</tspan><tspan x="456" dy="16.625">(6장의 신빙론)</tspan><tspan x="456" dy="16.625">귀납이 실제로</tspan><tspan x="456" dy="16.625">믿을 만한 과정이면</tspan><tspan x="456" dy="16.625">그것으로 정당화된다.</tspan><tspan x="456" dy="16.625">우리가 그것을</tspan><tspan x="456" dy="16.625">증명해 보일</tspan><tspan x="456" dy="16.625">필요는 없다</tspan></text></g><g ><g class="shape"><path d="M644 686h223v146H644z" class="stroke-B1 fill-B6 s0"/></g><text x="755.5" y="724.5" class="text-bold fill-N1 s1"><tspan x="755.5" dy="0">반론 — 흄이</tspan><tspan x="755.5" dy="16.833">물은 것이</tspan><tspan x="755.5" dy="16.833">바로 ‘실제로</tspan><tspan x="755.5" dy="16.833">믿을 만한가’ 였다면</tspan><tspan x="755.5" dy="16.833">이 답은 물음을</tspan><tspan x="755.5" dy="16.833">되풀이한다</tspan></text></g><g ><g class="shape"><path d="M350 868h212v130H350z" class="stroke-B1 fill-B6 s0"/></g><text x="456" y="906.5" class="text-bold fill-N1 s1"><tspan x="456" dy="0">귀납이 필요 없다고</tspan><tspan x="456" dy="17">본다 (포퍼)</tspan><tspan x="456" dy="17">과학은 추측하고</tspan><tspan x="456" dy="17">반증할 뿐</tspan><tspan x="456" dy="17">귀납하지 않는다</tspan></text></g><g ><g class="shape"><path d="M644 860h209v146H644z" class="stroke-B1 fill-B6 s0"/></g><text x="748.5" y="898.5" class="text-bold fill-N1 s1"><tspan x="748.5" dy="0">반론 — 반증을 견딘</tspan><tspan x="748.5" dy="16.833">이론을</tspan><tspan x="748.5" dy="16.833">앞으로도 쓰겠다는</tspan><tspan x="748.5" dy="16.833">판단 자체가</tspan><tspan x="748.5" dy="16.833">귀납이다.</tspan><tspan x="748.5" dy="16.833">9장에서 다시 본다</tspan></text></g><marker id="mk-d2-2255925870-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2255925870-3488378134)" d="m186 502.01 53 .272s10 .051 10-9.949V119s0-10 10-10h79" class="connection stroke-B1 s0" mask="url(#d2-2255925870)"/><path fill="none" marker-end="url(#mk-d2-2255925870-3488378134)" d="m205 535.993 84-.292s10-.035 10-10.035V357s0-10 10-10h38" class="connection stroke-B1 s0" mask="url(#d2-2255925870)"/><path fill="none" marker-end="url(#mk-d2-2255925870-3488378134)" d="M211 569h124" class="connection stroke-B1 s0" mask="url(#d2-2255925870)"/><path fill="none" marker-end="url(#mk-d2-2255925870-3488378134)" d="m205 602.007 84 .291s10 .035 10 10.035V749s0 10 10 10h27" class="connection stroke-B1 s0" mask="url(#d2-2255925870)"/><path fill="none" marker-end="url(#mk-d2-2255925870-3488378134)" d="m186 635.99 53-.273s10-.051 10 9.949V923s0 10 10 10h88" class="connection stroke-B1 s0" mask="url(#d2-2255925870)"/><path fill="none" marker-end="url(#mk-d2-2255925870-3488378134)" d="M573 109h67" class="connection stroke-B1 s0" mask="url(#d2-2255925870)"/><path fill="none" marker-end="url(#mk-d2-2255925870-3488378134)" d="M564 347h76" class="connection stroke-B1 s0" mask="url(#d2-2255925870)"/><path fill="none" marker-end="url(#mk-d2-2255925870-3488378134)" d="M576 569h64" class="connection stroke-B1 s0" mask="url(#d2-2255925870)"/><path fill="none" marker-end="url(#mk-d2-2255925870-3488378134)" d="M575 759h65" class="connection stroke-B1 s0" mask="url(#d2-2255925870)"/><path fill="none" marker-end="url(#mk-d2-2255925870-3488378134)" d="M564 933h76" class="connection stroke-B1 s0" mask="url(#d2-2255925870)"/><mask id="d2-2255925870" width="1060" height="1196" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H971v1196H-89z"/></mask></svg>