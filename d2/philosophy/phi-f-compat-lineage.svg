<svg xmlns="http://www.w3.org/2000/svg" width="1149" height="917" class="d2-3678893623 d2-svg" viewBox="-101 -101 1149 917"><rect width="1149" height="917" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3678893623 .text-bold{font-weight:700}.d2-3678893623 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3678893623 .fill-N1{fill:#0a0f25}.d2-3678893623 .fill-N2{fill:#676c7e}.d2-3678893623 .fill-B6{fill:#f7f8fe}.d2-3678893623 .stroke-B1,.d2-3678893623 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h419v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209.5" y="46.5" class="text-bold fill-N1 s1"><tspan x="209.5" dy="0">고전적 양립가능론 — 홉스·흄</tspan><tspan x="209.5" dy="17.667">자유는 하고자 하는 대로 할 수 있음이다.</tspan><tspan x="209.5" dy="17.667">자유의 반대는 결정이 아니라 강제다</tspan></text></g><g ><g class="shape"><path d="M539 0h408v114H539z" class="stroke-B2 fill-B6 s2"/></g><text x="743" y="38.5" class="text-bold fill-N1 s1"><tspan x="743" dy="0">반례 — 강박과 중독</tspan><tspan x="743" dy="17.25">손발이 묶이지 않았는데도</tspan><tspan x="743" dy="17.25">자유로워 보이지 않는 사람이 있다.</tspan><tspan x="743" dy="17.25">방해가 밖이 아니라 안에 있는 경우다</tspan></text></g><g ><g class="shape"><path d="M0 224h419v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209.5" y="262.5" class="text-bold fill-N1 s1"><tspan x="209.5" dy="0">계층 이론 — 프랭크퍼트</tspan><tspan x="209.5" dy="17.25">하고 싶은 것(일차 욕구)과,</tspan><tspan x="209.5" dy="17.25">그 욕구를 갖고 싶은가(이차 욕구)를 나눈다.</tspan><tspan x="209.5" dy="17.25">둘이 맞으면 그 의지는 내 것이다</tspan></text></g><g ><g class="shape"><path d="M539 224h408v114H539z" class="stroke-B2 fill-B6 s2"/></g><text x="743" y="262.5" class="text-bold fill-N1 s1"><tspan x="743" dy="0">반례 — 조작</tspan><tspan x="743" dy="17.25">이차 욕구까지 누가 심어 놓았다면 어떤가.</tspan><tspan x="743" dy="17.25">층을 하나 더 얹어도</tspan><tspan x="743" dy="17.25">같은 물음이 다시 올라온다</tspan></text></g><g ><g class="shape"><path d="M0 448h419v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209.5" y="486.5" class="text-bold fill-N1 s1"><tspan x="209.5" dy="0">이유 반응성 — 피셔·라비자</tspan><tspan x="209.5" dy="17">그 행위를 낳은 절차가</tspan><tspan x="209.5" dy="17">이유를 알아듣는가를 본다.</tspan><tspan x="209.5" dy="17">다른 이유가 주어졌으면</tspan><tspan x="209.5" dy="17">다르게 움직였을 절차인가</tspan></text></g><g ><g class="shape"><path d="M539 448h408v130H539z" class="stroke-B2 fill-B6 s2"/></g><text x="743" y="486.5" class="text-bold fill-N1 s1"><tspan x="743" dy="0">반례 — 역사</tspan><tspan x="743" dy="17">이유를 잘 알아듣게끔 세뇌된 사람도</tspan><tspan x="743" dy="17">조건을 채운다.</tspan><tspan x="743" dy="17">그래서 절차가 어떻게 생겨났는지까지</tspan><tspan x="743" dy="17">조건에 넣게 된다</tspan></text></g><text x="473.5" y="614" class="fill-N1 s1"><tspan x="473.5" dy="0">이 계보를 조작 논증이라 부르는 반론 하나가 통째로 겨눈다.</tspan><tspan x="473.5" dy="16.714">세뇌된 사람과 보통 사람 사이에 양립가능론이 댈 수 있는 차이가 없고,</tspan><tspan x="473.5" dy="16.714">세뇌된 사람이 자유롭지 않다면 보통 사람도 자유롭지 않다는 논증이다</tspan><tspan x="473.5" dy="16.714"> </tspan><tspan x="473.5" dy="16.714">양립가능론의 응답 — 차이는 있다. 조작된 사람의 절차는 그 사람의 이력에서</tspan><tspan x="473.5" dy="16.714">자라난 것이 아니라 밖에서 통째로 끼워 넣어진 것이다.</tspan><tspan x="473.5" dy="16.714">그 차이가 조건으로 적힐 만큼 또렷한가가 지금 다투는 자리다</tspan></text><marker id="mk-d2-3678893623-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3678893623-3488378134)" d="M421 57h114" class="connection stroke-B1 s0" mask="url(#d2-3678893623)"/><path fill="none" marker-end="url(#mk-d2-3678893623-3488378134)" d="M605.656 114.774 349.188 222.452" class="connection stroke-B1 s0" mask="url(#d2-3678893623)"/><text x="477" y="175" class="text-italic fill-N2 s1">안쪽으로 옮긴다</text><path fill="none" marker-end="url(#mk-d2-3678893623-3488378134)" d="M421 281h114" class="connection stroke-B1 s0" mask="url(#d2-3678893623)"/><path fill="none" marker-end="url(#mk-d2-3678893623-3488378134)" d="M609.666 338.797 362.168 446.405" class="connection stroke-B1 s0" mask="url(#d2-3678893623)"/><text x="485.5" y="399" class="text-italic fill-N2 s1">절차로 옮긴다</text><path fill="none" marker-end="url(#mk-d2-3678893623-3488378134)" d="M421 513h114" class="connection stroke-B1 s0" mask="url(#d2-3678893623)"/><mask id="d2-3678893623" width="1149" height="917" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1149v917H-101z"/><path d="M406 159h142v21H406zM424 383h123v21H424z"/></mask></svg>