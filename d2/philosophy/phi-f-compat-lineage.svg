<svg xmlns="http://www.w3.org/2000/svg" width="2072" height="1332" class="d2-3469700411 d2-svg" viewBox="-101 -101 2072 1332"><rect width="2072" height="1332" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3469700411 .fill-N1{fill:#0a0f25}.d2-3469700411 .fill-N2{fill:#676c7e}.d2-3469700411 .fill-B6{fill:#f7f8fe}.d2-3469700411 .stroke-B1,.d2-3469700411 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M130 0h391v98H130z" class="stroke-B1 fill-B6 s0"/></g><text x="325.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="325.5" dy="0">고전적 양립가능론 — 홉스·흄</tspan><tspan x="325.5" dy="17.667">자유는 하고자 하는 대로 할 수 있음이다.</tspan><tspan x="325.5" dy="17.667">자유의 반대는 결정이 아니라 강제다</tspan></text></g><g ><g class="shape"><path d="M37 198h577v98H37z" class="stroke-B2 fill-B6 s2"/></g><text x="325.5" y="236.5" class="text-bold fill-N1 s1"><tspan x="325.5" dy="0">반례 — 강박과 중독</tspan><tspan x="325.5" dy="17.667">손발이 묶이지 않았는데도 자유로워 보이지 않는 사람이 있다.</tspan><tspan x="325.5" dy="17.667">방해가 밖이 아니라 안에 있는 경우다</tspan></text></g><g ><g class="shape"><path d="M0 417h650v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="325" y="455.5" class="text-bold fill-N1 s1"><tspan x="325" dy="0">계층 이론 — 프랭크퍼트</tspan><tspan x="325" dy="17.667">하고 싶은 것(일차 욕구)과, 그 욕구를 갖고 싶은가(이차 욕구)를 나눈다.</tspan><tspan x="325" dy="17.667">둘이 맞으면 그 의지는 내 것이다</tspan></text></g><g ><g class="shape"><path d="M100 615h450v98H100z" class="stroke-B2 fill-B6 s2"/></g><text x="325" y="653.5" class="text-bold fill-N1 s1"><tspan x="325" dy="0">반례 — 조작</tspan><tspan x="325" dy="17.667">이차 욕구까지 누가 심어 놓았다면 어떤가.</tspan><tspan x="325" dy="17.667">층을 하나 더 얹어도 같은 물음이 다시 올라온다</tspan></text></g><g ><g class="shape"><path d="M83 834h484v98H83z" class="stroke-B1 fill-B6 s0"/></g><text x="325" y="872.5" class="text-bold fill-N1 s1"><tspan x="325" dy="0">이유 반응성 — 피셔·라비자</tspan><tspan x="325" dy="17.667">그 행위를 낳은 절차가 이유를 알아듣는가를 본다.</tspan><tspan x="325" dy="17.667">다른 이유가 주어졌으면 다르게 움직였을 절차인가</tspan></text></g><g ><g class="shape"><path d="M61 1032h528v98H61z" class="stroke-B2 fill-B6 s2"/></g><text x="325" y="1070.5" class="text-bold fill-N1 s1"><tspan x="325" dy="0">반례 — 역사</tspan><tspan x="325" dy="17.667">이유를 잘 알아듣게끔 세뇌된 사람도 조건을 채운다.</tspan><tspan x="325" dy="17.667">그래서 절차가 어떻게 생겨났는지까지 조건에 넣게 된다</tspan></text></g><text x="878" y="39" class="fill-N1 s1"><tspan x="878" dy="0">이 계보를 조작 논증이라 부르는 반론 하나가 통째로 겨눈다.</tspan><tspan x="878" dy="17.667">세뇌된 사람과 보통 사람 사이에 양립가능론이 댈 수 있는 차이가 없고,</tspan><tspan x="878" dy="17.667">세뇌된 사람이 자유롭지 않다면 보통 사람도 자유롭지 않다는 논증이다</tspan></text><text x="1552.5" y="39" class="fill-N1 s1"><tspan x="1552.5" dy="0">양립가능론의 응답 — 차이는 있다. 조작된 사람의 절차는 그 사람의 이력에서</tspan><tspan x="1552.5" dy="17.667">자라난 것이 아니라 밖에서 통째로 끼워 넣어진 것이다.</tspan><tspan x="1552.5" dy="17.667">그 차이가 조건으로 적힐 만큼 또렷한가가 지금 다투는 자리다</tspan></text><marker id="mk-d2-3469700411-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3469700411-3488378134)" d="M325 100v94" class="connection stroke-B1 s0" mask="url(#d2-3469700411)"/><path fill="none" marker-end="url(#mk-d2-3469700411-3488378134)" d="M325 297.5v116" class="connection stroke-B1 s0" mask="url(#d2-3469700411)"/><text x="325" y="362" class="text-italic fill-N2 s1">안쪽으로 옮긴다</text><path fill="none" marker-end="url(#mk-d2-3469700411-3488378134)" d="M325 517v94" class="connection stroke-B1 s0" mask="url(#d2-3469700411)"/><path fill="none" marker-end="url(#mk-d2-3469700411-3488378134)" d="M325 714.5v116" class="connection stroke-B1 s0" mask="url(#d2-3469700411)"/><text x="325.5" y="779" class="text-italic fill-N2 s1">절차로 옮긴다</text><path fill="none" marker-end="url(#mk-d2-3469700411-3488378134)" d="M325 934v94" class="connection stroke-B1 s0" mask="url(#d2-3469700411)"/><mask id="d2-3469700411" width="2072" height="1332" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2072v1332H-101z"/><path d="M254 346h142v21H254zM264 763h123v21H264z"/></mask></svg>