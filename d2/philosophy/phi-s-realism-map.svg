<svg xmlns="http://www.w3.org/2000/svg" width="1458" height="1126" class="d2-4214169625 d2-svg" viewBox="-101 -101 1458 1126"><rect width="1458" height="1126" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4214169625 .fill-N1{fill:#0a0f25}.d2-4214169625 .fill-N2{fill:#676c7e}.d2-4214169625 .fill-B5{fill:#edf0fd}.d2-4214169625 .fill-B6{fill:#f7f8fe}.d2-4214169625 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="639" cy="111" class="shape stroke-B1 fill-B6 s0" rx="333" ry="111"/></g><text x="639" y="108.5" class="text-bold fill-N1 s1"><tspan x="639" dy="0">성공한 이론이 관찰 불가능한 것에 대해 하는 말을</tspan><tspan x="639" dy="18.5">참이라고 믿어야 하는가</tspan></text></g><g ><g class="shape"><path d="M15 388h246v130H15z" class="stroke-B1 fill-B6 s0"/></g><text x="138" y="426.5" class="text-bold fill-N1 s1"><tspan x="138" dy="0">과학적 실재론 — 다수설</tspan><tspan x="138" dy="17">믿어야 한다.</tspan><tspan x="138" dy="17">전자는 실제로 있고</tspan><tspan x="138" dy="17">전자에 대한 이론은</tspan><tspan x="138" dy="17">참에 가깝다</tspan></text></g><g ><g class="shape"><path d="M0 705h276v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="138" y="743.5" class="text-bold fill-N1 s1"><tspan x="138" dy="0">기적 불가 논증</tspan><tspan x="138" dy="17.25">이론이 거짓인데</tspan><tspan x="138" dy="17.25">예측이 그토록 잘 맞는다면</tspan><tspan x="138" dy="17.25">그것은 기적일 것이다</tspan></text></g><g ><g class="shape"><path d="M311 342h616v222H311z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="619" y="329" class="fill-N1" style="text-anchor:middle;font-size:28px">반실재론 쪽</text></g><g ><g class="shape"><path d="M645 705h296v114H645z" class="stroke-B1 fill-B6 s0"/></g><text x="793" y="743.5" class="text-bold fill-N1 s1"><tspan x="793" dy="0">비관적 귀납 (라우든)</tspan><tspan x="793" dy="17.25">예측에 성공했으나</tspan><tspan x="793" dy="17.25">뒤에 거짓으로 판명된 이론이</tspan><tspan x="793" dy="17.25">과거에 줄줄이 있었다</tspan></text></g><g ><g class="shape"><path d="M977 396h279v114H977z" class="stroke-B1 fill-B6 s0"/></g><text x="1116.5" y="434.5" class="text-bold fill-N1 s1"><tspan x="1116.5" dy="0">구조 실재론</tspan><tspan x="1116.5" dy="17.25">이론이 옮겨 나르는 것은</tspan><tspan x="1116.5" dy="17.25">대상이 아니라 구조다.</tspan><tspan x="1116.5" dy="17.25">두 논증을 다 받으려는 시도</tspan></text></g><text x="628" y="855" class="text-bold fill-N1 s1"><tspan x="628" dy="0">둘 다 결정적이지 않다.</tspan><tspan x="628" dy="17">기적 불가 논증은 성공한 이론만 뒤에서 골라낸 것 아니냐는 반론과,</tspan><tspan x="628" dy="17">최선의 설명으로의 추론을 이미 전제한다는 반론을 받는다.</tspan><tspan x="628" dy="17">비관적 귀납은 목록이 대표적이냐는 반론과,</tspan><tspan x="628" dy="17">그 자체가 귀납이라는 반론을 받는다</tspan></text><g ><g class="shape"><path d="M341 372h287v162H341z" class="stroke-B1 fill-B5 s0"/></g><text x="484.5" y="410.5" class="text-bold fill-N1 s1"><tspan x="484.5" dy="0">구성적 경험주의 (반 프라센)</tspan><tspan x="484.5" dy="16.714">— 주요 소수설</tspan><tspan x="484.5" dy="16.714">이론은 경험적으로</tspan><tspan x="484.5" dy="16.714">적합하기만 하면 된다.</tspan><tspan x="484.5" dy="16.714">관찰 불가능한 부분은</tspan><tspan x="484.5" dy="16.714">받아들이되</tspan><tspan x="484.5" dy="16.714">참이라고 믿지는 않는다</tspan></text></g><g ><g class="shape"><path d="M688 380h209v146H688z" class="stroke-B1 fill-B5 s0"/></g><text x="792.5" y="418.5" class="text-bold fill-N1 s1"><tspan x="792.5" dy="0">도구주의</tspan><tspan x="792.5" dy="16.833">이론은 참·거짓을</tspan><tspan x="792.5" dy="16.833">물을 것이 아니라</tspan><tspan x="792.5" dy="16.833">계산 도구다.</tspan><tspan x="792.5" dy="16.833">구성적 경험주의와</tspan><tspan x="792.5" dy="16.833">여기서 갈린다</tspan></text></g><marker id="mk-d2-4214169625-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4214169625-3488378134)" d="M397.096 188.613C190.2 255.2 138 335.2 138 384" class="connection stroke-B1 s0" mask="url(#d2-4214169625)"/><path fill="none" marker-end="url(#mk-d2-4214169625-3488378134)" d="M536.605 218.434C495.2 261 484.5 332 484.5 368" class="connection stroke-B1 s0" mask="url(#d2-4214169625)"/><path fill="none" marker-end="url(#mk-d2-4214169625-3488378134)" d="M874.895 190.638C1067.8 255.6 1116.5 336.8 1116.5 392" class="connection stroke-B1 s0" mask="url(#d2-4214169625)"/><path fill="none" marker-end="url(#mk-d2-4214169625-3488378134)" d="M741.381 218.447C782 261 792.5 333.6 792.5 376" class="connection stroke-B1 s0" mask="url(#d2-4214169625)"/><path fill="none" marker-end="url(#mk-d2-4214169625-3488378134)" d="M138 520v181.5" class="connection stroke-B1 s0" mask="url(#d2-4214169625)"/><text x="138.5" y="617" class="text-italic fill-N2 s1">대표 논증</text><path fill="none" marker-end="url(#mk-d2-4214169625-3488378134)" d="M792.5 565.5v136" class="connection stroke-B1 s0" mask="url(#d2-4214169625)"/><text x="792.5" y="640" class="text-italic fill-N2 s1">대표 논증</text><mask id="d2-4214169625" width="1458" height="1126" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1458v1126H-101z"/><path d="M96 601h85v21H96zM750 624h85v21h-85z"/></mask></svg>