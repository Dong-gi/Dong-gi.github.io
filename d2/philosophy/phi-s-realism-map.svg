<svg xmlns="http://www.w3.org/2000/svg" width="2237" height="774" class="d2-3428644490 d2-svg" viewBox="-101 -101 2237 774"><rect width="2237" height="774" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3428644490 .fill-N1{fill:#0a0f25}.d2-3428644490 .fill-N2{fill:#676c7e}.d2-3428644490 .fill-B6{fill:#f7f8fe}.d2-3428644490 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="350" cy="286" class="shape stroke-B1 fill-B6 s0" rx="333" ry="111"/></g><text x="350" y="283.5" class="text-bold fill-N1 s1"><tspan x="350" dy="0">성공한 이론이 관찰 불가능한 것에 대해 하는 말을</tspan><tspan x="350" dy="18.5">참이라고 믿어야 하는가</tspan></text></g><g ><g class="shape"><path d="M933 0h324v98H933z" class="stroke-B1 fill-B6 s0"/></g><text x="1095" y="38.5" class="text-bold fill-N1 s1"><tspan x="1095" dy="0">과학적 실재론 — 다수설</tspan><tspan x="1095" dy="17.667">믿어야 한다. 전자는 실제로 있고</tspan><tspan x="1095" dy="17.667">전자에 대한 이론은 참에 가깝다</tspan></text></g><g ><g class="shape"><path d="M1591 0h424v98h-424z" class="stroke-B1 fill-B6 s0"/></g><text x="1803" y="38.5" class="text-bold fill-N1 s1"><tspan x="1803" dy="0">기적 불가 논증</tspan><tspan x="1803" dy="17.667">이론이 거짓인데 예측이 그토록 잘 맞는다면</tspan><tspan x="1803" dy="17.667">그것은 기적일 것이다</tspan></text></g><g ><g class="shape"><path d="M821 158h548v98H821z" class="stroke-B1 fill-B6 s0"/></g><text x="1095" y="196.5" class="text-bold fill-N1 s1"><tspan x="1095" dy="0">구성적 경험주의 (반 프라센) — 주요 소수설</tspan><tspan x="1095" dy="17.667">이론은 경험적으로 적합하기만 하면 된다.</tspan><tspan x="1095" dy="17.667">관찰 불가능한 부분은 받아들이되 참이라고 믿지는 않는다</tspan></text></g><g ><g class="shape"><path d="M1571 158h464v98h-464z" class="stroke-B1 fill-B6 s0"/></g><text x="1803" y="196.5" class="text-bold fill-N1 s1"><tspan x="1803" dy="0">비관적 귀납</tspan><tspan x="1803" dy="17.667">예측에 성공했으나 뒤에 거짓으로 판명된 이론이</tspan><tspan x="1803" dy="17.667">과거에 줄줄이 있었다</tspan></text></g><g ><g class="shape"><path d="M869 316h452v98H869z" class="stroke-B1 fill-B6 s0"/></g><text x="1095" y="354.5" class="text-bold fill-N1 s1"><tspan x="1095" dy="0">구조 실재론</tspan><tspan x="1095" dy="17.667">이론이 옮겨 나르는 것은 대상이 아니라 구조다.</tspan><tspan x="1095" dy="17.667">두 논증을 다 받으려는 시도</tspan></text></g><g ><g class="shape"><path d="M867 474h457v98H867z" class="stroke-B1 fill-B6 s0"/></g><text x="1095.5" y="512.5" class="text-bold fill-N1 s1"><tspan x="1095.5" dy="0">도구주의</tspan><tspan x="1095.5" dy="17.667">이론은 참·거짓을 물을 것이 아니라 계산 도구다.</tspan><tspan x="1095.5" dy="17.667">구성적 경험주의와 여기서 갈린다</tspan></text></g><text x="350" y="473" class="text-bold fill-N1 s1"><tspan x="350" dy="0">둘 다 결정적이지 않다.</tspan><tspan x="350" dy="17.25">기적 불가 논증은 성공한 이론만 뒤에서 골라낸 것 아니냐는 반론과,</tspan><tspan x="350" dy="17.25">최선의 설명으로의 추론을 이미 전제한다는 반론을 받는다.</tspan><tspan x="350" dy="17.25">비관적 귀납은 목록이 대표적이냐는 반론과, 그 자체가 귀납이라는 반론을 받는다</tspan></text><marker id="mk-d2-3428644490-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3428644490-3488378134)" d="M518.73 188.998C711.8 77.199 795.1 49 929.5 49" class="connection stroke-B1 s0" mask="url(#d2-3428644490)"/><path fill="none" marker-end="url(#mk-d2-3428644490-3488378134)" d="M639.966 229.63C736 211.6 772.7 207 817.5 207" class="connection stroke-B1 s0" mask="url(#d2-3428644490)"/><path fill="none" marker-end="url(#mk-d2-3428644490-3488378134)" d="M639.966 342.37C736 360.4 782.3 365 865.5 365" class="connection stroke-B1 s0" mask="url(#d2-3428644490)"/><path fill="none" marker-end="url(#mk-d2-3428644490-3488378134)" d="M518.73 383.002C711.8 494.8 781.7 523 862.5 523" class="connection stroke-B1 s0" mask="url(#d2-3428644490)"/><path fill="none" marker-end="url(#mk-d2-3428644490-3488378134)" d="M1259 49h328" class="connection stroke-B1 s0" mask="url(#d2-3428644490)"/><text x="1424.5" y="55" class="text-italic fill-N2 s1">지지 논증</text><path fill="none" marker-end="url(#mk-d2-3428644490-3488378134)" d="M1371 207h196" class="connection stroke-B1 s0" mask="url(#d2-3428644490)"/><text x="1470.5" y="213" class="text-italic fill-N2 s1">지지 논증</text><mask id="d2-3428644490" width="2237" height="774" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2237v774H-101z"/><path d="M1382 39h85v21h-85zM1428 197h85v21h-85z"/></mask></svg>