<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="1285" class="d2-2291556454 d2-svg" viewBox="-89 -89 1088 1285"><rect width="1088" height="1285" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2291556454 .text-bold{font-weight:700}.d2-2291556454 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2291556454 .fill-N1{fill:#0a0f25}.d2-2291556454 .fill-N2{fill:#676c7e}.d2-2291556454 .fill-B5{fill:#edf0fd}.d2-2291556454 .fill-B6{fill:#f7f8fe}.d2-2291556454 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="527.5" cy="93" class="shape stroke-B1 fill-B6 s0" rx="242.5" ry="81"/></g><text x="527.5" y="82.5" class="text-bold fill-N1 s1"><tspan x="527.5" dy="0">성공한 이론이</tspan><tspan x="527.5" dy="17.667">관찰 불가능한 것에 대해 하는 말을</tspan><tspan x="527.5" dy="17.667">참이라고 믿어야 하는가</tspan></text></g><g ><g class="shape"><path d="M22 412h212v146H22z" class="stroke-B1 fill-B6 s0"/></g><text x="128" y="450.5" class="text-bold fill-N1 s1"><tspan x="128" dy="0">과학적 실재론 —</tspan><tspan x="128" dy="16.833">다수설</tspan><tspan x="128" dy="16.833">믿어야 한다.</tspan><tspan x="128" dy="16.833">전자는 실제로 있고</tspan><tspan x="128" dy="16.833">전자에 대한 이론은</tspan><tspan x="128" dy="16.833">참에 가깝다</tspan></text></g><g ><g class="shape"><path d="M12 828h232v130H12z" class="stroke-B1 fill-B6 s0"/></g><text x="128" y="866.5" class="text-bold fill-N1 s1"><tspan x="128" dy="0">기적 불가 논증</tspan><tspan x="128" dy="17">이론이 거짓인데</tspan><tspan x="128" dy="17">예측이 그토록</tspan><tspan x="128" dy="17">잘 맞는다면</tspan><tspan x="128" dy="17">그것은 기적일 것이다</tspan></text></g><g ><g class="shape"><path d="M254 309h456v358H254z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="482" y="342" class="fill-N1" style="text-anchor:middle;font-size:28px">반실재론 쪽</text></g><g ><g class="shape"><path d="M282 828h232v130H282z" class="stroke-B1 fill-B6 s0"/></g><text x="398" y="866.5" class="text-bold fill-N1 s1"><tspan x="398" dy="0">비관적 귀납 (라우든)</tspan><tspan x="398" dy="17">예측에 성공했으나</tspan><tspan x="398" dy="17">뒤에 거짓으로</tspan><tspan x="398" dy="17">판명된 이론이</tspan><tspan x="398" dy="17">과거에 줄줄이 있었다</tspan></text></g><g ><g class="shape"><path d="M730 309h168v162H730z" class="stroke-B1 fill-B6 s0"/></g><text x="814" y="347.5" class="text-bold fill-N1 s1"><tspan x="814" dy="0">구조 실재론</tspan><tspan x="814" dy="16.714">이론이 옮겨</tspan><tspan x="814" dy="16.714">나르는 것은</tspan><tspan x="814" dy="16.714">대상이 아니라</tspan><tspan x="814" dy="16.714">구조다.</tspan><tspan x="814" dy="16.714">두 논증을 다</tspan><tspan x="814" dy="16.714">받으려는 시도</tspan></text></g><text x="455" y="994" class="text-bold fill-N1 s1"><tspan x="455" dy="0">둘 다 결정적이지 않다.</tspan><tspan x="455" dy="16.714">기적 불가 논증은</tspan><tspan x="455" dy="16.714">성공한 이론만 뒤에서 골라낸 것 아니냐는 반론과,</tspan><tspan x="455" dy="16.714">최선의 설명으로의 추론을</tspan><tspan x="455" dy="16.714">이미 전제한다는 반론을 받는다.</tspan><tspan x="455" dy="16.714">비관적 귀납은 목록이 대표적이냐는 반론과,</tspan><tspan x="455" dy="16.714">그 자체가 귀납이라는 반론을 받는다</tspan></text><g ><g class="shape"><path d="M304 359h168v258H304z" class="stroke-B1 fill-B5 s0"/></g><text x="388" y="397.5" class="text-bold fill-N1 s1"><tspan x="388" dy="0">구성적</tspan><tspan x="388" dy="16.385">경험주의</tspan><tspan x="388" dy="16.385">(반 프라센)</tspan><tspan x="388" dy="16.385">— 주요 소수설</tspan><tspan x="388" dy="16.385">이론은</tspan><tspan x="388" dy="16.385">경험적으로</tspan><tspan x="388" dy="16.385">적합하기만</tspan><tspan x="388" dy="16.385">하면 된다.</tspan><tspan x="388" dy="16.385">관찰 불가능한</tspan><tspan x="388" dy="16.385">부분은</tspan><tspan x="388" dy="16.385">받아들이되</tspan><tspan x="388" dy="16.385">참이라고</tspan><tspan x="388" dy="16.385">믿지는 않는다</tspan></text></g><g ><g class="shape"><path d="M492 359h168v194H492z" class="stroke-B1 fill-B5 s0"/></g><text x="576" y="397.5" class="text-bold fill-N1 s1"><tspan x="576" dy="0">도구주의</tspan><tspan x="576" dy="16.556">이론은</tspan><tspan x="576" dy="16.556">참·거짓을</tspan><tspan x="576" dy="16.556">물을 것이</tspan><tspan x="576" dy="16.556">아니라</tspan><tspan x="576" dy="16.556">계산 도구다.</tspan><tspan x="576" dy="16.556">구성적</tspan><tspan x="576" dy="16.556">경험주의와</tspan><tspan x="576" dy="16.556">여기서 갈린다</tspan></text></g><marker id="mk-d2-2291556454-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2291556454-3488378134)" d="M382 160v44s0 10-10 10H138s-10 0-10 10v185" class="connection stroke-B1 s0" mask="url(#d2-2291556454)"/><path fill="none" marker-end="url(#mk-d2-2291556454-3488378134)" d="M479 174v80s0 10-10 10h-71s-10 0-10 10v81" class="connection stroke-B1 s0" mask="url(#d2-2291556454)"/><path fill="none" marker-end="url(#mk-d2-2291556454-3488378134)" d="M673 160v44s0 10 10 10h121s10 0 10 10v81" class="connection stroke-B1 s0" mask="url(#d2-2291556454)"/><path fill="none" marker-end="url(#mk-d2-2291556454-3488378134)" d="M576 174v181" class="connection stroke-B1 s0" mask="url(#d2-2291556454)"/><path fill="none" marker-end="url(#mk-d2-2291556454-3488378134)" d="M128 560v264" class="connection stroke-B1 s0" mask="url(#d2-2291556454)"/><text x="128.5" y="699" class="text-italic fill-N2 s1">대표 논증</text><path fill="none" marker-end="url(#mk-d2-2291556454-3488378134)" d="M398 669v155" class="connection stroke-B1 s0" mask="url(#d2-2291556454)"/><text x="398.5" y="753" class="text-italic fill-N2 s1">대표 논증</text><mask id="d2-2291556454" width="1088" height="1285" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H999v1285H-89z"/><path d="M86 683h85v21H86zM356 737h85v21h-85z"/></mask></svg>