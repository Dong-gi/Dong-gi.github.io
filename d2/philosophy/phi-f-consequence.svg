<svg xmlns="http://www.w3.org/2000/svg" width="1431" height="1180" class="d2-180066214 d2-svg" viewBox="-101 -101 1431 1180"><rect width="1431" height="1180" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-180066214 .fill-N1{fill:#0a0f25}.d2-180066214 .fill-N2{fill:#676c7e}.d2-180066214 .fill-B6{fill:#f7f8fe}.d2-180066214 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 235h232v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="116" y="273.5" class="text-bold fill-N1 s1"><tspan x="116" dy="0">전제 1</tspan><tspan x="116" dy="16.833">먼 과거에</tspan><tspan x="116" dy="16.833">무슨 일이 있었는지는</tspan><tspan x="116" dy="16.833">지금 우리가</tspan><tspan x="116" dy="16.833">어떻게 할 수 있는</tspan><tspan x="116" dy="16.833">것이 아니다</tspan></text></g><g ><g class="shape"><path d="M292 235h195v146H292z" class="stroke-B1 fill-B6 s0"/></g><text x="389.5" y="273.5" class="text-bold fill-N1 s1"><tspan x="389.5" dy="0">전제 2</tspan><tspan x="389.5" dy="16.833">자연법칙이</tspan><tspan x="389.5" dy="16.833">무엇인지도</tspan><tspan x="389.5" dy="16.833">지금 우리가</tspan><tspan x="389.5" dy="16.833">어떻게 할 수 있는</tspan><tspan x="389.5" dy="16.833">것이 아니다</tspan></text></g><g ><g class="shape"><path d="M547 235h191v146H547z" class="stroke-B1 fill-B6 s0"/></g><text x="642.5" y="273.5" class="text-bold fill-N1 s1"><tspan x="642.5" dy="0">전제 3</tspan><tspan x="642.5" dy="16.833">결정론이 참이면</tspan><tspan x="642.5" dy="16.833">지금 내 행위는</tspan><tspan x="642.5" dy="16.833">먼 과거의 사실과</tspan><tspan x="642.5" dy="16.833">자연법칙에서</tspan><tspan x="642.5" dy="16.833">따라 나온다</tspan></text></g><g ><g class="shape"><path d="M883 251h259v114H883z" class="stroke-B1 fill-B6 s0"/></g><text x="1012.5" y="289.5" class="text-bold fill-N1 s1"><tspan x="1012.5" dy="0">전제 4 — 전이 원리</tspan><tspan x="1012.5" dy="17.25">어떻게 할 수 없는 것에서</tspan><tspan x="1012.5" dy="17.25">따라 나오는 것도</tspan><tspan x="1012.5" dy="17.25">어떻게 할 수 없다</tspan></text></g><g ><g class="shape"><ellipse cx="516" cy="578" class="shape stroke-B1 fill-B6 s0" rx="228" ry="76"/></g><text x="516" y="567.5" class="text-bold fill-N1 s1"><tspan x="516" dy="0">결론</tspan><tspan x="516" dy="17.667">결정론이 참이면 지금 내 행위도</tspan><tspan x="516" dy="17.667">우리가 어떻게 할 수 없는 것이다</tspan></text></g><g ><g class="shape"><path d="M83 775h328v114H83z" class="stroke-B1 fill-B6 s0"/></g><text x="247" y="813.5" class="text-bold fill-N1 s1"><tspan x="247" dy="0">자유지상론</tspan><tspan x="247" dy="17.25">결론을 받아들인다.</tspan><tspan x="247" dy="17.25">그런데 우리는 어떻게 할 수 있다.</tspan><tspan x="247" dy="17.25">그러므로 결정론이 거짓이다</tspan></text></g><g ><g class="shape"><path d="M471 775h272v114H471z" class="stroke-B1 fill-B6 s0"/></g><text x="607" y="813.5" class="text-bold fill-N1 s1"><tspan x="607" dy="0">강한 결정론</tspan><tspan x="607" dy="17.25">결론을 받아들이고</tspan><tspan x="607" dy="17.25">결정론도 받아들인다.</tspan><tspan x="607" dy="17.25">그러므로 자유의지는 없다</tspan></text></g><g ><g class="shape"><path d="M843 0h340v114H843z" class="stroke-B1 fill-B6 s0"/></g><text x="1013" y="38.5" class="text-bold fill-N1 s1"><tspan x="1013" dy="0">양립가능론</tspan><tspan x="1013" dy="17.25">전제 4 를 끊는다.</tspan><tspan x="1013" dy="17.25">또는 ‘어떻게 할 수 없다’ 가</tspan><tspan x="1013" dy="17.25">두 자리에서 같은 뜻인지를 묻는다</tspan></text></g><text x="614.5" y="925" class="fill-N1 s1"><tspan x="614.5" dy="0">논증 자체는 타당하게 짜여 있다. 그래서 다투는 곳은 전제뿐이다.</tspan><tspan x="614.5" dy="17.25">전제 1·2 를 부정하는 사람은 거의 없다.</tspan><tspan x="614.5" dy="17.25">전제 3 은 결정론의 뜻이 그렇다는 말이라 부정할 것이 없다.</tspan><tspan x="614.5" dy="17.25">남는 것이 전제 4 이고, 실제 논쟁의 대부분이 여기 모여 있다</tspan></text><text x="1062" y="536" class="fill-N1 s1"><tspan x="1062" dy="0">전이 원리는 그럴듯해 보이지만</tspan><tspan x="1062" dy="16.714">형식으로 적어 놓으면</tspan><tspan x="1062" dy="16.714">반례가 나온다는 지적이 있다.</tspan><tspan x="1062" dy="16.714">‘어떻게 할 수 없다’ 두 개를</tspan><tspan x="1062" dy="16.714">하나로 묶는 단계가 특히 의심받는다.</tspan><tspan x="1062" dy="16.714">반 인와겐 자신이 뒤에 원리를 손보았고,</tspan><tspan x="1062" dy="16.714">그 고침이 성공했는지도 다툼거리다</tspan></text><marker id="mk-d2-180066214-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-180066214-3488378134)" d="M116 382.5c0 46.8 47.8 75.5 235.219 140.195" class="connection stroke-B1 s0" mask="url(#d2-180066214)"/><path fill="none" marker-end="url(#mk-d2-180066214-3488378134)" d="M389.5 382.5c0 46.8 11.7 71.7 55.79 119.558" class="connection stroke-B1 s0" mask="url(#d2-180066214)"/><path fill="none" marker-end="url(#mk-d2-180066214-3488378134)" d="M642.5 382.5c0 46.8-11.7 71.7-55.79 119.558" class="connection stroke-B1 s0" mask="url(#d2-180066214)"/><path fill="none" marker-end="url(#mk-d2-180066214-3488378134)" d="M918.297 365.549C820 426.1 765.2 456.4 649.577 514.211" class="connection stroke-B1 s0" mask="url(#d2-180066214)"/><path fill="none" marker-end="url(#mk-d2-180066214-3488378134)" d="M388.221 641.914C275.6 699.8 247 726.7 247 771.5" class="connection stroke-B1 s0" mask="url(#d2-180066214)"/><text x="293.5" y="696" class="text-italic fill-N2 s1">그 다음</text><path fill="none" marker-end="url(#mk-d2-180066214-3488378134)" d="M567.097 653.672C598.8 702 607 726.7 607 771.5" class="connection stroke-B1 s0" mask="url(#d2-180066214)"/><text x="601.5" y="715" class="text-italic fill-N2 s1">그 다음</text><path fill="none" marker-end="url(#mk-d2-180066214-3488378134)" d="M1012.5 115.5v132" class="connection stroke-B1 s0" mask="url(#d2-180066214)"/><text x="1012.5" y="188" class="text-italic fill-N2 s1">여기를 끊는다</text><path fill="none" marker-end="url(#mk-d2-180066214-3488378134)" d="M1034.683 366.38C1056.4 426.1 1062 457.1 1062 515.5" class="connection stroke-B1 s0" mask="url(#d2-180066214)"/><text x="1059" y="446" class="text-italic fill-N2 s1">여기가 약점이라면</text><mask id="d2-180066214" width="1431" height="1180" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1431v1180H-101z"/><path d="M261 680h65v21h-65zM569 699h65v21h-65zM951 172h123v21H951zM978 430h162v21H978z"/></mask></svg>