<svg xmlns="http://www.w3.org/2000/svg" width="2850" height="1011" class="d2-4172272745 d2-svg" viewBox="-101 -101 2850 1011"><rect width="2850" height="1011" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4172272745 .fill-N1{fill:#0a0f25}.d2-4172272745 .fill-N2{fill:#676c7e}.d2-4172272745 .fill-B6{fill:#f7f8fe}.d2-4172272745 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 219h410v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="205" y="257.5" class="text-bold fill-N1 s1"><tspan x="205" dy="0">전제 1</tspan><tspan x="205" dy="17.667">먼 과거에 무슨 일이 있었는지는</tspan><tspan x="205" dy="17.667">지금 우리가 어떻게 할 수 있는 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M470 219h410v98H470z" class="stroke-B1 fill-B6 s0"/></g><text x="675" y="257.5" class="text-bold fill-N1 s1"><tspan x="675" dy="0">전제 2</tspan><tspan x="675" dy="17.667">자연법칙이 무엇인지도</tspan><tspan x="675" dy="17.667">지금 우리가 어떻게 할 수 있는 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M940 219h424v98H940z" class="stroke-B1 fill-B6 s0"/></g><text x="1152" y="257.5" class="text-bold fill-N1 s1"><tspan x="1152" dy="0">전제 3</tspan><tspan x="1152" dy="17.667">결정론이 참이면 지금 내 행위는</tspan><tspan x="1152" dy="17.667">먼 과거의 사실과 자연법칙에서 따라 나온다</tspan></text></g><g ><g class="shape"><path d="M1505 219h410v98h-410z" class="stroke-B1 fill-B6 s0"/></g><text x="1710" y="257.5" class="text-bold fill-N1 s1"><tspan x="1710" dy="0">전제 4 — 전이 원리</tspan><tspan x="1710" dy="17.667">어떻게 할 수 없는 것에서 따라 나오는 것도</tspan><tspan x="1710" dy="17.667">어떻게 할 수 없다</tspan></text></g><g ><g class="shape"><ellipse cx="914" cy="514" class="shape stroke-B1 fill-B6 s0" rx="228" ry="76"/></g><text x="914" y="503.5" class="text-bold fill-N1 s1"><tspan x="914" dy="0">결론</tspan><tspan x="914" dy="17.667">결정론이 참이면 지금 내 행위도</tspan><tspan x="914" dy="17.667">우리가 어떻게 할 수 없는 것이다</tspan></text></g><g ><g class="shape"><path d="M358 711h452v98H358z" class="stroke-B1 fill-B6 s0"/></g><text x="584" y="749.5" class="text-bold fill-N1 s1"><tspan x="584" dy="0">자유지상론</tspan><tspan x="584" dy="17.667">결론을 받아들인다. 그런데 우리는</tspan><tspan x="584" dy="17.667">어떻게 할 수 있다. 그러므로 결정론이 거짓이다</tspan></text></g><g ><g class="shape"><path d="M870 711h402v98H870z" class="stroke-B1 fill-B6 s0"/></g><text x="1071" y="749.5" class="text-bold fill-N1 s1"><tspan x="1071" dy="0">강한 결정론</tspan><tspan x="1071" dy="17.667">결론을 받아들이고 결정론도 받아들인다.</tspan><tspan x="1071" dy="17.667">그러므로 자유의지는 없다</tspan></text></g><g ><g class="shape"><path d="M1495 0h431v98h-431z" class="stroke-B1 fill-B6 s0"/></g><text x="1710.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1710.5" dy="0">양립가능론</tspan><tspan x="1710.5" dy="17.667">전제 4 를 끊는다. 또는 ‘어떻게 할 수 없다’ 가</tspan><tspan x="1710.5" dy="17.667">두 자리에서 같은 뜻인지를 묻는다</tspan></text></g><text x="2317" y="39" class="fill-N1 s1"><tspan x="2317" dy="0">논증 자체는 타당하게 짜여 있다. 그래서 다투는 곳은 전제뿐이다.</tspan><tspan x="2317" dy="17.667">전제 1·2 를 부정하는 사람은 거의 없다. 전제 3 은 결정론의 뜻이 그렇다는 말이라</tspan><tspan x="2317" dy="17.667">부정할 것이 없다. 남는 것이 전제 4 이고, 실제 논쟁의 대부분이 여기 모여 있다</tspan></text><text x="1760" y="504" class="fill-N1 s1"><tspan x="1760" dy="0">전이 원리는 그럴듯해 보이지만 형식으로 적어 놓으면 반례가 나온다는 지적이 있다.</tspan><tspan x="1760" dy="17.667">‘어떻게 할 수 없다’ 두 개를 하나로 묶는 단계가 특히 의심받는다.</tspan><tspan x="1760" dy="17.667">반 인와겐 자신이 뒤에 원리를 손보았고, 그 고침이 성공했는지도 다툼거리다</tspan></text><marker id="mk-d2-4172272745-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4172272745-3488378134)" d="M205 318.5c0 46.8 102.2 78.7 507.072 156.743" class="connection stroke-B1 s0" mask="url(#d2-4172272745)"/><path fill="none" marker-end="url(#mk-d2-4172272745-3488378134)" d="M675 318.5c0 46.8 24.6 73.3 119.542 128.49" class="connection stroke-B1 s0" mask="url(#d2-4172272745)"/><path fill="none" marker-end="url(#mk-d2-4172272745-3488378134)" d="M1152 318.5c0 46.8-24.4 73.3-118.549 128.477" class="connection stroke-B1 s0" mask="url(#d2-4172272745)"/><path fill="none" marker-end="url(#mk-d2-4172272745-3488378134)" d="M1569.616 317.172C1434.7 365.3 1337.8 395 1090.853 463.925" class="connection stroke-B1 s0" mask="url(#d2-4172272745)"/><path fill="none" marker-end="url(#mk-d2-4172272745-3488378134)" d="M768.154 573.77C621.2 635 584 662.7 584 707.5" class="connection stroke-B1 s0" mask="url(#d2-4172272745)"/><text x="651.5" y="628" class="text-italic fill-N2 s1">그 다음</text><path fill="none" marker-end="url(#mk-d2-4172272745-3488378134)" d="M997.506 586.316C1056 637.4 1071 662.7 1071 707.5" class="connection stroke-B1 s0" mask="url(#d2-4172272745)"/><text x="1055.5" y="642" class="text-italic fill-N2 s1">그 다음</text><path fill="none" marker-end="url(#mk-d2-4172272745-3488378134)" d="M1710 99.5v116" class="connection stroke-B1 s0" mask="url(#d2-4172272745)"/><text x="1710.5" y="164" class="text-italic fill-N2 s1">여기를 끊는다</text><path fill="none" marker-end="url(#mk-d2-4172272745-3488378134)" d="M1733.31 318.329C1754.1 365.3 1759.5 399.5 1759.5 483.5" class="connection stroke-B1 s0" mask="url(#d2-4172272745)"/><text x="1760" y="405" class="text-italic fill-N2 s1">여기가 약점이라면</text><mask id="d2-4172272745" width="2850" height="1011" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2850V910H-101z"/><path d="M619 612h65v21h-65zM1023 626h65v21h-65zM1649 148h123v21h-123zM1679 389h162v21h-162z"/></mask></svg>