<svg xmlns="http://www.w3.org/2000/svg" width="1119" height="1569" class="d2-893620491 d2-svg" viewBox="-89 -89 1119 1569"><rect width="1119" height="1569" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-893620491 .text-bold{font-weight:700}.d2-893620491 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-893620491 .fill-N1{fill:#0a0f25}.d2-893620491 .fill-N2{fill:#676c7e}.d2-893620491 .fill-B6{fill:#f7f8fe}.d2-893620491 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M12 303h232v146H12z" class="stroke-B1 fill-B6 s0"/></g><text x="128" y="341.5" class="text-bold fill-N1 s1"><tspan x="128" dy="0">전제 1</tspan><tspan x="128" dy="16.833">먼 과거에</tspan><tspan x="128" dy="16.833">무슨 일이 있었는지는</tspan><tspan x="128" dy="16.833">지금 우리가</tspan><tspan x="128" dy="16.833">어떻게 할 수 있는</tspan><tspan x="128" dy="16.833">것이 아니다</tspan></text></g><g ><g class="shape"><path d="M264 303h195v146H264z" class="stroke-B1 fill-B6 s0"/></g><text x="361.5" y="341.5" class="text-bold fill-N1 s1"><tspan x="361.5" dy="0">전제 2</tspan><tspan x="361.5" dy="16.833">자연법칙이</tspan><tspan x="361.5" dy="16.833">무엇인지도</tspan><tspan x="361.5" dy="16.833">지금 우리가</tspan><tspan x="361.5" dy="16.833">어떻게 할 수 있는</tspan><tspan x="361.5" dy="16.833">것이 아니다</tspan></text></g><g ><g class="shape"><path d="M479 303h191v146H479z" class="stroke-B1 fill-B6 s0"/></g><text x="574.5" y="341.5" class="text-bold fill-N1 s1"><tspan x="574.5" dy="0">전제 3</tspan><tspan x="574.5" dy="16.833">결정론이 참이면</tspan><tspan x="574.5" dy="16.833">지금 내 행위는</tspan><tspan x="574.5" dy="16.833">먼 과거의 사실과</tspan><tspan x="574.5" dy="16.833">자연법칙에서</tspan><tspan x="574.5" dy="16.833">따라 나온다</tspan></text></g><g ><g class="shape"><path d="M690 303h195v146H690z" class="stroke-B1 fill-B6 s0"/></g><text x="787.5" y="341.5" class="text-bold fill-N1 s1"><tspan x="787.5" dy="0">전제 4 —</tspan><tspan x="787.5" dy="16.833">전이 원리</tspan><tspan x="787.5" dy="16.833">어떻게 할 수</tspan><tspan x="787.5" dy="16.833">없는 것에서</tspan><tspan x="787.5" dy="16.833">따라 나오는 것도</tspan><tspan x="787.5" dy="16.833">어떻게 할 수 없다</tspan></text></g><g ><g class="shape"><ellipse cx="468" cy="656" class="shape stroke-B1 fill-B6 s0" rx="149" ry="77"/></g><text x="468" y="629.5" class="text-bold fill-N1 s1"><tspan x="468" dy="0">결론</tspan><tspan x="468" dy="17">결정론이 참이면</tspan><tspan x="468" dy="17">지금 내 행위도</tspan><tspan x="468" dy="17">우리가 어떻게 할 수</tspan><tspan x="468" dy="17">없는 것이다</tspan></text></g><g ><g class="shape"><path d="M224 1096h214v146H224z" class="stroke-B1 fill-B6 s0"/></g><text x="331" y="1134.5" class="text-bold fill-N1 s1"><tspan x="331" dy="0">자유지상론</tspan><tspan x="331" dy="16.833">결론을 받아들인다.</tspan><tspan x="331" dy="16.833">그런데 우리는</tspan><tspan x="331" dy="16.833">어떻게 할 수 있다.</tspan><tspan x="331" dy="16.833">그러므로</tspan><tspan x="331" dy="16.833">결정론이 거짓이다</tspan></text></g><g ><g class="shape"><path d="M458 1096h272v114H458z" class="stroke-B1 fill-B6 s0"/></g><text x="594" y="1134.5" class="text-bold fill-N1 s1"><tspan x="594" dy="0">강한 결정론</tspan><tspan x="594" dy="17.25">결론을 받아들이고</tspan><tspan x="594" dy="17.25">결정론도 받아들인다.</tspan><tspan x="594" dy="17.25">그러므로 자유의지는 없다</tspan></text></g><g ><g class="shape"><path d="M645 12h284v130H645z" class="stroke-B1 fill-B6 s0"/></g><text x="787" y="50.5" class="text-bold fill-N1 s1"><tspan x="787" dy="0">양립가능론</tspan><tspan x="787" dy="17">전제 4 를 끊는다.</tspan><tspan x="787" dy="17">또는 ‘어떻게 할 수 없다’ 가</tspan><tspan x="787" dy="17">두 자리에서</tspan><tspan x="787" dy="17">같은 뜻인지를 묻는다</tspan></text></g><text x="470" y="1278" class="fill-N1 s1"><tspan x="470" dy="0">논증 자체는 타당하게 짜여 있다.</tspan><tspan x="470" dy="16.714">그래서 다투는 곳은 전제뿐이다.</tspan><tspan x="470" dy="16.714">전제 1·2 를 부정하는 사람은 거의 없다.</tspan><tspan x="470" dy="16.714">전제 3 은 결정론의 뜻이 그렇다는 말이라</tspan><tspan x="470" dy="16.714">부정할 것이 없다.</tspan><tspan x="470" dy="16.714">남는 것이 전제 4 이고,</tspan><tspan x="470" dy="16.714">실제 논쟁의 대부분이 여기 모여 있다</tspan></text><text x="820" y="829" class="fill-N1 s1"><tspan x="820" dy="0">전이 원리는</tspan><tspan x="820" dy="16.385">그럴듯해 보이지만</tspan><tspan x="820" dy="16.385">형식으로 적어 놓으면</tspan><tspan x="820" dy="16.385">반례가 나온다는</tspan><tspan x="820" dy="16.385">지적이 있다.</tspan><tspan x="820" dy="16.385">‘어떻게 할 수 없다’</tspan><tspan x="820" dy="16.385">두 개를</tspan><tspan x="820" dy="16.385">하나로 묶는 단계가</tspan><tspan x="820" dy="16.385">특히 의심받는다.</tspan><tspan x="820" dy="16.385">반 인와겐 자신이</tspan><tspan x="820" dy="16.385">뒤에 원리를 손보았고,</tspan><tspan x="820" dy="16.385">그 고침이 성공했는지도</tspan><tspan x="820" dy="16.385">다툼거리다</tspan></text><marker id="mk-d2-893620491-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-893620491-3488378134)" d="M128 451v78s0 10 10 10h230.6s10 0 10.073 10l.298 41" class="connection stroke-B1 s0" mask="url(#d2-893620491)"/><path fill="none" marker-end="url(#mk-d2-893620491-3488378134)" d="m438.197 451-.19 126" class="connection stroke-B1 s0" mask="url(#d2-893620491)"/><path fill="none" marker-end="url(#mk-d2-893620491-3488378134)" d="M574.5 451v28s0 10-10 10h-56.7s-10 0-9.978 10l.17 78" class="connection stroke-B1 s0" mask="url(#d2-893620491)"/><path fill="none" marker-end="url(#mk-d2-893620491-3488378134)" d="M755 451v78s0 10-10 10H567.4s-10 0-10.073 10l-.298 41" class="connection stroke-B1 s0" mask="url(#d2-893620491)"/><path fill="none" marker-end="url(#mk-d2-893620491-3488378134)" d="m331.002 689 .36 403" class="connection stroke-B1 s0" mask="url(#d2-893620491)"/><text x="331.5" y="897" class="text-italic fill-N2 s1">그 다음</text><path fill="none" marker-end="url(#mk-d2-893620491-3488378134)" d="m594.002 699 .36 393" class="connection stroke-B1 s0" mask="url(#d2-893620491)"/><text x="594.5" y="902" class="text-italic fill-N2 s1">그 다음</text><path fill="none" marker-end="url(#mk-d2-893620491-3488378134)" d="M787.5 144v155" class="connection stroke-B1 s0" mask="url(#d2-893620491)"/><text x="787.5" y="228" class="text-italic fill-N2 s1">여기를 끊는다</text><path fill="none" marker-end="url(#mk-d2-893620491-3488378134)" d="M820 451v358" class="connection stroke-B1 s0" mask="url(#d2-893620491)"/><text x="820.5" y="629" class="text-italic fill-N2 s1"><tspan x="820.5" dy="0">여기가</tspan><tspan x="820.5" dy="18.5">약점이라면</tspan></text><mask id="d2-893620491" width="1119" height="1569" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1119v1569H-89z"/><path d="M299 881h65v21h-65zM562 886h65v21h-65zM726 212h123v21H726zM770 613h101v37H770z"/></mask></svg>