<svg xmlns="http://www.w3.org/2000/svg" width="1157" height="1363" class="d2-3516604335 d2-svg" viewBox="-101 -101 1157 1363"><rect width="1157" height="1363" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3516604335 .fill-N1{fill:#0a0f25}.d2-3516604335 .fill-N2{fill:#676c7e}.d2-3516604335 .fill-B6{fill:#f7f8fe}.d2-3516604335 .stroke-B1,.d2-3516604335 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h418v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209" y="38.5" class="text-bold fill-N1 s1"><tspan x="209" dy="0">① 행위 자체가 나쁘지 않을 것</tspan><tspan x="209" dy="18.5">진통제를 놓는 일 자체는 나쁘지 않다</tspan></text></g><g ><g class="shape"><path d="M0 152h418v162H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209" y="230.5" class="text-bold fill-N1 s1"><tspan x="209" dy="0">② 나쁜 결과를 의도하지 않을 것</tspan><tspan x="209" dy="18.5">예견은 하되 노리지는 않는다</tspan></text></g><g ><g class="shape"><path d="M548 152h407v162H548z" class="stroke-B2 fill-B6 s2"/></g><text x="751.5" y="190.5" class="text-bold fill-N1 s1"><tspan x="751.5" dy="0">반론 B — 의도가 행위의 허용성을 정하는가</tspan><tspan x="751.5" dy="16.714">같은 일을 같은 방식으로 하는 두 사람이</tspan><tspan x="751.5" dy="16.714">마음속 의도만 다를 때,</tspan><tspan x="751.5" dy="16.714">한 사람만 허용된다고 말해야 한다.</tspan><tspan x="751.5" dy="16.714">의도는 행위자를 평가할 뿐</tspan><tspan x="751.5" dy="16.714">행위를 평가하지 않는다는 것이</tspan><tspan x="751.5" dy="16.714">톰슨의 지적이다</tspan></text></g><g ><g class="shape"><path d="M0 384h418v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209" y="446.5" class="text-bold fill-N1 s1"><tspan x="209" dy="0">③ 좋은 결과가</tspan><tspan x="209" dy="17.667">나쁜 결과를 거쳐 나오지 않을 것</tspan><tspan x="209" dy="17.667">나쁜 결과가 수단이면 안 된다</tspan></text></g><g ><g class="shape"><path d="M548 384h407v146H548z" class="stroke-B2 fill-B6 s2"/></g><text x="751.5" y="422.5" class="text-bold fill-N1 s1"><tspan x="751.5" dy="0">반론 A — 근접성 문제</tspan><tspan x="751.5" dy="16.833">무엇을 의도했는지는 다시 적을 수 있다.</tspan><tspan x="751.5" dy="16.833">‘그의 죽음’ 이 아니라</tspan><tspan x="751.5" dy="16.833">‘그의 몸이 전차를 막는 것’ 을</tspan><tspan x="751.5" dy="16.833">의도했다고 적으면 ③을 통과해 버린다.</tspan><tspan x="751.5" dy="16.833">기술을 바꿔 답이 바뀌면 원리가 아니다</tspan></text></g><g ><g class="shape"><path d="M0 600h418v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209" y="638.5" class="text-bold fill-N1 s1"><tspan x="209" dy="0">④ 비례할 것</tspan><tspan x="209" dy="17.667">좋은 결과가 나쁜 결과를</tspan><tspan x="209" dy="17.667">감당할 만큼 클 것</tspan></text></g><g ><g class="shape"><ellipse cx="209" cy="828" class="shape stroke-B1 fill-B6 s0" rx="209" ry="60"/></g><text x="209" y="825.5" class="text-bold fill-N1 s1"><tspan x="209" dy="0">네 조건을 모두 통과하면</tspan><tspan x="209" dy="18.5">허용된다</tspan></text></g><g ><g class="shape"><path d="M0 958h418v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209" y="996.5" class="text-bold fill-N1 s1"><tspan x="209" dy="0">표준 보기 — 통증을 없애려고 약을 늘리는데</tspan><tspan x="209" dy="16.833">그것이 죽음을 앞당길 것을 예견한다.</tspan><tspan x="209" dy="16.833">의도한 것은 통증의 제거이고</tspan><tspan x="209" dy="16.833">죽음은 예견된 부작용이다.</tspan><tspan x="209" dy="16.833">죽음을 수단으로 쓰지 않았으므로</tspan><tspan x="209" dy="16.833">③도 통과한다</tspan></text></g><text x="477" y="1140" class="fill-N1 s1"><tspan x="477" dy="0">이 원리는 의무론이 결과의 무게를 아주 무시하지는 않으면서</tspan><tspan x="477" dy="18.5">제약을 지키려는 장치다. 19장에서 트롤리 변형들이 이 장치를 시험한다</tspan></text><marker id="mk-d2-3516604335-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3516604335-3488378134)" d="M209 84v64" class="connection stroke-B1 s0" mask="url(#d2-3516604335)"/><path fill="none" marker-end="url(#mk-d2-3516604335-3488378134)" d="M209 316v64" class="connection stroke-B1 s0" mask="url(#d2-3516604335)"/><path fill="none" marker-end="url(#mk-d2-3516604335-3488378134)" d="M209 532v64" class="connection stroke-B1 s0" mask="url(#d2-3516604335)"/><path fill="none" marker-end="url(#mk-d2-3516604335-3488378134)" d="M209 700v64" class="connection stroke-B1 s0" mask="url(#d2-3516604335)"/><path fill="none" marker-end="url(#mk-d2-3516604335-3488378134)" d="M209 890v64" class="connection stroke-B1 s0" mask="url(#d2-3516604335)"/><path fill="none" marker-end="url(#mk-d2-3516604335-3488378134)" d="M419.5 457h125" class="connection stroke-B1 s0" mask="url(#d2-3516604335)"/><text x="483" y="463" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-3516604335-3488378134)" d="M419.5 233h125" class="connection stroke-B1 s0" mask="url(#d2-3516604335)"/><text x="483" y="239" class="text-italic fill-N2 s1">여기를 친다</text><mask id="d2-3516604335" width="1157" height="1363" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1157v1363H-101z"/><path d="M431 447h104v21H431zM431 223h104v21H431z"/></mask></svg>