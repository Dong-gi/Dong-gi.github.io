<svg xmlns="http://www.w3.org/2000/svg" width="2024" height="1394" class="d2-1930431547 d2-svg" viewBox="-101 -101 2024 1394"><rect width="2024" height="1394" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1930431547 .fill-N1{fill:#0a0f25}.d2-1930431547 .fill-N2{fill:#676c7e}.d2-1930431547 .fill-B6{fill:#f7f8fe}.d2-1930431547 .stroke-B1,.d2-1930431547 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M805 0h363v82H805z" class="stroke-B1 fill-B6 s0"/></g><text x="986.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="986.5" dy="0">① 행위 자체가 나쁘지 않을 것</tspan><tspan x="986.5" dy="18.5">진통제를 놓는 일 자체는 나쁘지 않다</tspan></text></g><g ><g class="shape"><path d="M830 182h313v82H830z" class="stroke-B1 fill-B6 s0"/></g><text x="986.5" y="220.5" class="text-bold fill-N1 s1"><tspan x="986.5" dy="0">② 나쁜 결과를 의도하지 않을 것</tspan><tspan x="986.5" dy="18.5">예견은 하되 노리지는 않는다</tspan></text></g><g ><g class="shape"><path d="M449 401h444v82H449z" class="stroke-B1 fill-B6 s0"/></g><text x="671" y="439.5" class="text-bold fill-N1 s1"><tspan x="671" dy="0">③ 좋은 결과가 나쁜 결과를 거쳐 나오지 않을 것</tspan><tspan x="671" dy="18.5">나쁜 결과가 수단이면 안 된다</tspan></text></g><g ><g class="shape"><path d="M166 636h410v82H166z" class="stroke-B1 fill-B6 s0"/></g><text x="371" y="674.5" class="text-bold fill-N1 s1"><tspan x="371" dy="0">④ 비례할 것</tspan><tspan x="371" dy="18.5">좋은 결과가 나쁜 결과를 감당할 만큼 클 것</tspan></text></g><g ><g class="shape"><ellipse cx="371.5" cy="914" class="shape stroke-B1 fill-B6 s0" rx="240.5" ry="80"/></g><text x="371.5" y="919.5" class="text-bold fill-N1 s1">네 조건을 모두 통과하면 허용된다</text></g><g ><g class="shape"><path d="M0 1094h742v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="371" y="1132.5" class="text-bold fill-N1 s1"><tspan x="371" dy="0">표준 보기 — 통증을 없애려고 약을 늘리는데 그것이 죽음을 앞당길 것을 예견한다.</tspan><tspan x="371" dy="17.667">의도한 것은 통증의 제거이고 죽음은 예견된 부작용이다.</tspan><tspan x="371" dy="17.667">죽음을 수단으로 쓰지 않았으므로 ③도 통과한다</tspan></text></g><g ><g class="shape"><path d="M636 620h669v114H636z" class="stroke-B2 fill-B6 s2"/></g><text x="970.5" y="658.5" class="text-bold fill-N1 s1"><tspan x="970.5" dy="0">반론 A — 폐쇄 문제</tspan><tspan x="970.5" dy="17.25">무엇을 의도했는지는 다시 적을 수 있다.</tspan><tspan x="970.5" dy="17.25">‘그의 죽음’ 이 아니라 ‘그의 몸이 전차를 막는 것’ 을 의도했다고 적으면</tspan><tspan x="970.5" dy="17.25">③을 통과해 버린다. 기술을 바꿔 답이 바뀌면 원리가 아니다</tspan></text></g><g ><g class="shape"><path d="M953 385h700v114H953z" class="stroke-B2 fill-B6 s2"/></g><text x="1303" y="423.5" class="text-bold fill-N1 s1"><tspan x="1303" dy="0">반론 B — 의도가 행위의 허용성을 정하는가</tspan><tspan x="1303" dy="17.25">같은 일을 같은 방식으로 하는 두 사람이 마음속 의도만 다를 때,</tspan><tspan x="1303" dy="17.25">한 사람만 허용된다고 말해야 한다.</tspan><tspan x="1303" dy="17.25">의도는 행위자를 평가할 뿐 행위를 평가하지 않는다는 것이 톰슨의 지적이다</tspan></text></g><text x="1525" y="39" class="fill-N1 s1"><tspan x="1525" dy="0">이 원리는 의무론이 결과의 무게를 아주 무시하지는 않으면서</tspan><tspan x="1525" dy="18.5">제약을 지키려는 장치다. 19장에서 트롤리 변형들이 이 장치를 시험한다</tspan></text><marker id="mk-d2-1930431547-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1930431547-3488378134)" d="M986.75 84v94" class="connection stroke-B1 s0" mask="url(#d2-1930431547)"/><path fill="none" marker-end="url(#mk-d2-1930431547-3488378134)" d="M856.848 264.117C708.35 312.3 670.75 339.9 670.75 397.5" class="connection stroke-B1 s0" mask="url(#d2-1930431547)"/><path fill="none" marker-end="url(#mk-d2-1930431547-3488378134)" d="M564.14 483.235C410 544.1 371 574.9 371 632.5" class="connection stroke-B1 s0" mask="url(#d2-1930431547)"/><path fill="none" marker-end="url(#mk-d2-1930431547-3488378134)" d="M371 720v110" class="connection stroke-B1 s0" mask="url(#d2-1930431547)"/><path fill="none" marker-end="url(#mk-d2-1930431547-3488378134)" d="M371 996v94" class="connection stroke-B1 s0" mask="url(#d2-1930431547)"/><path fill="none" marker-end="url(#mk-d2-1930431547-3488378134)" d="M777.36 483.235C931.5 544.1 970.5 571.7 970.5 616.5" class="connection stroke-B1 s0" mask="url(#d2-1930431547)"/><text x="898" y="537" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-1930431547-3488378134)" d="M1116.652 264.117C1265.15 312.3 1302.75 336.7 1302.75 381.5" class="connection stroke-B1 s0" mask="url(#d2-1930431547)"/><text x="1234" y="308" class="text-italic fill-N2 s1">여기를 친다</text><mask id="d2-1930431547" width="2024" height="1394" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2024v1394H-101z"/><path d="M846 521h104v21H846zM1182 292h104v21h-104z"/></mask></svg>