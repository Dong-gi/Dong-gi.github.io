<svg xmlns="http://www.w3.org/2000/svg" width="1035" height="2330" class="d2-3538158735 d2-svg" viewBox="-89 -89 1035 2330"><rect width="1035" height="2330" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3538158735 .text-bold{font-weight:700}.d2-3538158735 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3538158735 .fill-N1{fill:#0a0f25}.d2-3538158735 .fill-N2{fill:#676c7e}.d2-3538158735 .fill-B6{fill:#f7f8fe}.d2-3538158735 .stroke-B1,.d2-3538158735 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="554.5" cy="97" class="shape stroke-B1 fill-B6 s0" rx="234.5" ry="85"/></g><text x="554.5" y="62.5" class="text-bold fill-N1 s1"><tspan x="554.5" dy="0">지향성 — 무언가에 관함</tspan><tspan x="554.5" dy="16.833">브렌타노가 오늘의 뜻으로</tspan><tspan x="554.5" dy="16.833">되살린 말이다.</tspan><tspan x="554.5" dy="16.833">물리주의에 부담이 되는 성질 둘 —</tspan><tspan x="554.5" dy="16.833">없는 것에 관할 수 있고,</tspan><tspan x="554.5" dy="16.833">관점 아래에서 관한다</tspan></text></g><g ><g class="shape"><path d="M220 377h299v130H220z" class="stroke-B1 fill-B6 s0"/></g><text x="369.5" y="415.5" class="text-bold fill-N1 s1"><tspan x="369.5" dy="0">원초적 지향성</tspan><tspan x="369.5" dy="17">남이 그렇게 읽어 주어서</tspan><tspan x="369.5" dy="17">관하는 것이 아니다.</tspan><tspan x="369.5" dy="17">보기 — 비가 온다는 나의 믿음,</tspan><tspan x="369.5" dy="17">물 한 잔에 대한 나의 욕구</tspan></text></g><g ><g class="shape"><path d="M558 353h278v178H558z" class="stroke-B1 fill-B6 s0"/></g><text x="697" y="391.5" class="text-bold fill-N1 s1"><tspan x="697" dy="0">파생적 지향성</tspan><tspan x="697" dy="16.625">그 자체로는</tspan><tspan x="697" dy="16.625">잉크 자국이고 눈금이다.</tspan><tspan x="697" dy="16.625">우리가 그렇게 읽기 때문에</tspan><tspan x="697" dy="16.625">관한다.</tspan><tspan x="697" dy="16.625">보기 — 책에 적힌 ‘고양이’,</tspan><tspan x="697" dy="16.625">지도의 선,</tspan><tspan x="697" dy="16.625">온도계의 눈금, 표지판</tspan></text></g><text x="550.5" y="627" class="fill-N1 s1"><tspan x="550.5" dy="0">가르는 요령 —</tspan><tspan x="550.5" dy="17">해석자를 지우면</tspan><tspan x="550.5" dy="17">관함이 사라지는가.</tspan><tspan x="550.5" dy="17">사라지면 파생적이고</tspan><tspan x="550.5" dy="17">남으면 원초적이다</tspan></text><text x="752.5" y="627" class="fill-N1 s1"><tspan x="752.5" dy="0">왜 이 구별이 필요한가</tspan><tspan x="752.5" dy="16.357">파생적 지향성만</tspan><tspan x="752.5" dy="16.357">갖는 것에</tspan><tspan x="752.5" dy="16.357">마음을 돌리면</tspan><tspan x="752.5" dy="16.357">순환이 된다.</tspan><tspan x="752.5" dy="16.357">종이가 관하는 것은</tspan><tspan x="752.5" dy="16.357">우리가 관하기</tspan><tspan x="752.5" dy="16.357">때문이므로</tspan><tspan x="752.5" dy="16.357">종이의 관함으로</tspan><tspan x="752.5" dy="16.357">우리의 관함을</tspan><tspan x="752.5" dy="16.357">설명할 수 없다.</tspan><tspan x="752.5" dy="16.357">이 구별이</tspan><tspan x="752.5" dy="16.357">중국어 방 논증에서</tspan><tspan x="752.5" dy="16.357">곧바로 쓰인다</tspan></text><g ><g class="shape"><ellipse cx="370" cy="988.5" class="shape stroke-B1 fill-B6 s0" rx="129" ry="78.5"/></g><text x="370" y="962" class="text-bold fill-N1 s1"><tspan x="370" dy="0">자연화 계획</tspan><tspan x="370" dy="17">물리주의자는</tspan><tspan x="370" dy="17">원초적 지향성을</tspan><tspan x="370" dy="17">자연적인 것으로</tspan><tspan x="370" dy="17">설명해야 한다</tspan></text></g><g ><g class="shape"><path d="M12 1155h316v226H12z" class="stroke-B1 fill-B6 s0"/></g><text x="170" y="1193.5" class="text-bold fill-N1 s1"><tspan x="170" dy="0">① 정보와 인과</tspan><tspan x="170" dy="16.455">연기는 불에 대한</tspan><tspan x="170" dy="16.455">정보를 나른다 —</tspan><tspan x="170" dy="16.455">불이 없으면</tspan><tspan x="170" dy="16.455">연기가 나지 않기 때문이다.</tspan><tspan x="170" dy="16.455">마음의 상태가</tspan><tspan x="170" dy="16.455">무언가에 관한다는 것은,</tspan><tspan x="170" dy="16.455">그 상태가 그것에 대한</tspan><tspan x="170" dy="16.455">정보를 나르도록</tspan><tspan x="170" dy="16.455">알맞게 이어져 있다는 것이다.</tspan><tspan x="170" dy="16.455">드레츠키가 이 착상을 다듬었다</tspan></text></g><g ><g class="shape"><path d="M348 1147h299v242H348z" class="stroke-B1 fill-B6 s0"/></g><text x="497.5" y="1185.5" class="text-bold fill-N1 s1"><tspan x="497.5" dy="0">② 기능과 목적</tspan><tspan x="497.5" dy="16.417">개구리의 어떤 신경 상태는</tspan><tspan x="497.5" dy="16.417">지나가는 작은 검은 점에</tspan><tspan x="497.5" dy="16.417">반응한다.</tspan><tspan x="497.5" dy="16.417">그 상태가 파리에 관한 것이라</tspan><tspan x="497.5" dy="16.417">말할 수 있는 이유는</tspan><tspan x="497.5" dy="16.417">그 장치가 파리를 잡는</tspan><tspan x="497.5" dy="16.417">일을 하도록</tspan><tspan x="497.5" dy="16.417">자연선택이 다듬어</tspan><tspan x="497.5" dy="16.417">놓았기 때문이다.</tspan><tspan x="497.5" dy="16.417">밀리컨이 이 방향을</tspan><tspan x="497.5" dy="16.417">목적론적 의미론으로 세웠다</tspan></text></g><g ><g class="shape"><ellipse cx="338.5" cy="1751.5" class="shape stroke-B1 fill-B6 s0" rx="223.5" ry="159.5"/></g><text x="338.5" y="1669" class="text-bold fill-N1 s1"><tspan x="338.5" dy="0">시험대 — 오표상 문제</tspan><tspan x="338.5" dy="16.417">지향적 상태는</tspan><tspan x="338.5" dy="16.417">틀릴 수 있어야 한다.</tspan><tspan x="338.5" dy="16.417">참일 수도 거짓일 수도 없는 것은</tspan><tspan x="338.5" dy="16.417">믿음이 아니다.</tspan><tspan x="338.5" dy="16.417">개구리가 던져진 작은 돌에</tspan><tspan x="338.5" dy="16.417">혀를 뻗었다면</tspan><tspan x="338.5" dy="16.417">그 상태는 파리에 관한 것이면서</tspan><tspan x="338.5" dy="16.417">틀린 것인가,</tspan><tspan x="338.5" dy="16.417">아니면 애초에</tspan><tspan x="338.5" dy="16.417">‘파리 또는 작은 검은 점’ 에</tspan><tspan x="338.5" dy="16.417">관한 것이라 틀리지 않은 것인가</tspan></text></g><text x="146.5" y="2007" class="fill-N1 s1"><tspan x="146.5" dy="0">내용을 정보로만 정하면</tspan><tspan x="146.5" dy="16.625">내용이 넓게 잡히고,</tspan><tspan x="146.5" dy="16.625">그러면 개구리는</tspan><tspan x="146.5" dy="16.625">틀린 적이 없게 된다.</tspan><tspan x="146.5" dy="16.625">오표상이 원리적으로</tspan><tspan x="146.5" dy="16.625">일어나지 않으면</tspan><tspan x="146.5" dy="16.625">관함의 핵심 성질 하나가</tspan><tspan x="146.5" dy="16.625">사라진다</tspan></text><text x="391" y="2007" class="fill-N1 s1"><tspan x="391" dy="0">그 ‘원래’ 를 자연적 사실로</tspan><tspan x="391" dy="16.556">정확히 적는 것이 부담이다.</tspan><tspan x="391" dy="16.556">자연선택의 역사로 적는 것이</tspan><tspan x="391" dy="16.556">표준 시도인데,</tspan><tspan x="391" dy="16.556">그러면 같은 물리 구조를</tspan><tspan x="391" dy="16.556">가졌지만</tspan><tspan x="391" dy="16.556">역사가 없는 존재의</tspan><tspan x="391" dy="16.556">내용이 정해지지 않는다는</tspan><tspan x="391" dy="16.556">문제가 따라온다</tspan></text><text x="622.5" y="2007" class="fill-N1 s1"><tspan x="622.5" dy="0">이 문제는 열려 있다.</tspan><tspan x="622.5" dy="17">지향성을 자연화하는</tspan><tspan x="622.5" dy="17">어떤 안도</tspan><tspan x="622.5" dy="17">아직 널리</tspan><tspan x="622.5" dy="17">받아들여지지 않았다</tspan></text><marker id="mk-d2-3538158735-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3538158735-3488378134)" d="m370.003 152 .324 221" class="connection stroke-B1 s0" mask="url(#d2-3538158735)"/><text x="370" y="269" class="text-italic fill-N2 s1">어디서 얻는가 ①</text><path fill="none" marker-end="url(#mk-d2-3538158735-3488378134)" d="m697.995 166-.484 183" class="connection stroke-B1 s0" mask="url(#d2-3538158735)"/><text x="698" y="264" class="text-italic fill-N2 s1">어디서 얻는가 ②</text><marker id="mk-d2-3538158735-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3538158735-2177206569)" d="M651.166 533v28s0 10-10 10h-80.583s-10 0-10 10v26" class="connection stroke-B2 s3" mask="url(#d2-3538158735)"/><path fill="none" marker-end="url(#mk-d2-3538158735-2177206569)" d="M752.583 533v74" class="connection stroke-B2 s3" mask="url(#d2-3538158735)"/><path fill="none" marker-end="url(#mk-d2-3538158735-3488378134)" d="m370.331 509-.328 397" class="connection stroke-B1 s0" mask="url(#d2-3538158735)"/><text x="370" y="714" class="text-italic fill-N2 s1">설명해야 할 것</text><path fill="none" marker-end="url(#mk-d2-3538158735-3488378134)" d="m327.015 1065 .242 32s.076 10-9.924 10H180s-10 0-10 10v34" class="connection stroke-B1 s0" mask="url(#d2-3538158735)"/><path fill="none" marker-end="url(#mk-d2-3538158735-3488378134)" d="m413.008 1065 .31 78" class="connection stroke-B1 s0" mask="url(#d2-3538158735)"/><path fill="none" marker-end="url(#mk-d2-3538158735-3488378134)" d="m264.33 1383-.324 214" class="connection stroke-B1 s0" mask="url(#d2-3538158735)"/><text x="264" y="1489" class="text-italic fill-N2 s1"><tspan x="264" dy="0">틀림을</tspan><tspan x="264" dy="18.5">담기 어렵다</tspan></text><path fill="none" marker-end="url(#mk-d2-3538158735-3488378134)" d="m413.33 1391-.324 206" class="connection stroke-B1 s0" mask="url(#d2-3538158735)"/><text x="413" y="1485" class="text-italic fill-N2 s1"><tspan x="413" dy="0">‘원래 하도록</tspan><tspan x="413" dy="17.667">되어 있던 일’ 로</tspan><tspan x="413" dy="17.667">담으려 한다</tspan></text><path fill="none" marker-end="url(#mk-d2-3538158735-2177206569)" d="m146.994 1835-.481 152" class="connection stroke-B2 s3" mask="url(#d2-3538158735)"/><path fill="none" marker-end="url(#mk-d2-3538158735-2177206569)" d="M391 1909v78" class="connection stroke-B2 s3" mask="url(#d2-3538158735)"/><path fill="none" marker-end="url(#mk-d2-3538158735-2177206569)" d="m450.986 1892-.335 49s-.068 10 9.932 10H612.5s10 0 10 10v26" class="connection stroke-B2 s3" mask="url(#d2-3538158735)"/><mask id="d2-3538158735" width="1035" height="2330" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H946v2330H-89z"/><path d="M302 253h136v21H302zM630 248h136v21H630zM307 698h126v21H307zM212 1473h104v37H212zM343 1469h140v53H343z"/></mask></svg>