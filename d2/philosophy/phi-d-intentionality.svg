<svg xmlns="http://www.w3.org/2000/svg" width="2389" height="2074" class="d2-1496867234 d2-svg" viewBox="-101 -101 2389 2074"><rect width="2389" height="2074" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1496867234 .fill-N1{fill:#0a0f25}.d2-1496867234 .fill-N2{fill:#676c7e}.d2-1496867234 .fill-B6{fill:#f7f8fe}.d2-1496867234 .stroke-B1,.d2-1496867234 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="564" cy="171.5" class="shape stroke-B1 fill-B6 s0" rx="515" ry="171.5"/></g><text x="564" y="161" class="text-bold fill-N1 s1"><tspan x="564" dy="0">지향성 — 무언가에 관함</tspan><tspan x="564" dy="17.667">브렌타노가 오늘의 뜻으로 되살린 말이다.</tspan><tspan x="564" dy="17.667">물리주의에 부담이 되는 성질 둘 — 없는 것에 관할 수 있고, 관점 아래에서 관한다</tspan></text></g><g ><g class="shape"><path d="M1229 472h519v98h-519z" class="stroke-B1 fill-B6 s0"/></g><text x="1488.5" y="510.5" class="text-bold fill-N1 s1"><tspan x="1488.5" dy="0">원초적 지향성</tspan><tspan x="1488.5" dy="17.667">남이 그렇게 읽어 주어서 관하는 것이 아니다.</tspan><tspan x="1488.5" dy="17.667">보기 — 비가 온다는 나의 믿음, 물 한 잔에 대한 나의 욕구</tspan></text></g><g ><g class="shape"><path d="M0 464h565v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="282.5" y="502.5" class="text-bold fill-N1 s1"><tspan x="282.5" dy="0">파생적 지향성</tspan><tspan x="282.5" dy="17.25">그 자체로는 잉크 자국이고 눈금이다.</tspan><tspan x="282.5" dy="17.25">우리가 그렇게 읽기 때문에 관한다.</tspan><tspan x="282.5" dy="17.25">보기 — 책에 적힌 ‘고양이’, 지도의 선, 온도계의 눈금, 표지판</tspan></text></g><text x="282.5" y="836" class="fill-N1 s1"><tspan x="282.5" dy="0">가르는 요령 — 해석자를 지우면 관함이 사라지는가.</tspan><tspan x="282.5" dy="18.5">사라지면 파생적이고 남으면 원초적이다</tspan></text><text x="783.5" y="812" class="fill-N1 s1"><tspan x="783.5" dy="0">왜 이 구별이 필요한가</tspan><tspan x="783.5" dy="17">파생적 지향성만 갖는 것에 마음을 돌리면 순환이 된다.</tspan><tspan x="783.5" dy="17">종이가 관하는 것은 우리가 관하기 때문이므로</tspan><tspan x="783.5" dy="17">종이의 관함으로 우리의 관함을 설명할 수 없다.</tspan><tspan x="783.5" dy="17">이 구별이 중국어 방 논증에서 곧바로 쓰인다</tspan></text><g ><g class="shape"><ellipse cx="1488.5" cy="838" class="shape stroke-B1 fill-B6 s0" rx="416.5" ry="139"/></g><text x="1488.5" y="835.5" class="text-bold fill-N1 s1"><tspan x="1488.5" dy="0">자연화 계획</tspan><tspan x="1488.5" dy="18.5">물리주의자는 원초적 지향성을 자연적인 것으로 설명해야 한다</tspan></text></g><g ><g class="shape"><path d="M781 1077h682v130H781z" class="stroke-B1 fill-B6 s0"/></g><text x="1122" y="1115.5" class="text-bold fill-N1 s1"><tspan x="1122" dy="0">① 정보와 인과</tspan><tspan x="1122" dy="17">연기는 불에 대한 정보를 나른다 — 불이 없으면 연기가 나지 않기 때문이다.</tspan><tspan x="1122" dy="17">마음의 상태가 무언가에 관한다는 것은,</tspan><tspan x="1122" dy="17">그 상태가 그것에 대한 정보를 나르도록 알맞게 이어져 있다는 것이다.</tspan><tspan x="1122" dy="17">드레츠키가 이 착상을 다듬었다</tspan></text></g><g ><g class="shape"><path d="M1523 1077h664v130h-664z" class="stroke-B1 fill-B6 s0"/></g><text x="1855" y="1115.5" class="text-bold fill-N1 s1"><tspan x="1855" dy="0">② 기능과 목적</tspan><tspan x="1855" dy="17">개구리의 어떤 신경 상태는 지나가는 작은 검은 점에 반응한다.</tspan><tspan x="1855" dy="17">그 상태가 파리에 관한 것이라 말할 수 있는 이유는</tspan><tspan x="1855" dy="17">그 장치가 파리를 잡는 일을 하도록 자연선택이 다듬어 놓았기 때문이다.</tspan><tspan x="1855" dy="17">밀리컨이 이 방향을 목적론적 의미론으로 세웠다</tspan></text></g><g ><g class="shape"><ellipse cx="1489" cy="1515.5" class="shape stroke-B1 fill-B6 s0" rx="563" ry="187.5"/></g><text x="1489" y="1497" class="text-bold fill-N1 s1"><tspan x="1489" dy="0">시험대 — 오표상 문제</tspan><tspan x="1489" dy="17.25">지향적 상태는 틀릴 수 있어야 한다. 참일 수도 거짓일 수도 없는 것은 믿음이 아니다.</tspan><tspan x="1489" dy="17.25">개구리가 던져진 작은 돌에 혀를 뻗었다면 그 상태는 파리에 관한 것이면서 틀린 것인가,</tspan><tspan x="1489" dy="17.25">아니면 애초에 ‘파리 또는 작은 검은 점’ 에 관한 것이라 틀리지 않은 것인가</tspan></text></g><text x="689.5" y="1819" class="fill-N1 s1"><tspan x="689.5" dy="0">내용을 정보로만 정하면 내용이 넓게 잡히고,</tspan><tspan x="689.5" dy="17.25">그러면 개구리는 틀린 적이 없게 된다.</tspan><tspan x="689.5" dy="17.25">오표상이 원리적으로 일어나지 않으면</tspan><tspan x="689.5" dy="17.25">관함의 핵심 성질 하나가 사라진다</tspan></text><text x="1166.5" y="1819" class="fill-N1 s1"><tspan x="1166.5" dy="0">그 ‘원래’ 를 자연적 사실로 정확히 적는 것이 부담이다.</tspan><tspan x="1166.5" dy="17.25">자연선택의 역사로 적는 것이 표준 시도인데,</tspan><tspan x="1166.5" dy="17.25">그러면 같은 물리 구조를 가졌지만 역사가 없는 존재의</tspan><tspan x="1166.5" dy="17.25">내용이 정해지지 않는다는 문제가 따라온다</tspan></text><text x="1810" y="1843" class="fill-N1 s1">이 문제는 열려 있다. 지향성을 자연화하는 어떤 안도 아직 널리 받아들여지지 않았다</text><marker id="mk-d2-1496867234-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1496867234-3488378134)" d="M976.94 275.486C1385.8 377.8 1488.5 417.3 1488.5 468.5" class="connection stroke-B1 s0" mask="url(#d2-1496867234)"/><text x="1261" y="352" class="text-italic fill-N2 s1">어디서 얻는가 ①</text><path fill="none" marker-end="url(#mk-d2-1496867234-3488378134)" d="M368.469 331.286C300 388.8 282.5 415.7 282.5 460.5" class="connection stroke-B1 s0" mask="url(#d2-1496867234)"/><text x="304" y="391" class="text-italic fill-N2 s1">어디서 얻는가 ②</text><marker id="mk-d2-1496867234-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1496867234-2177206569)" d="M282.5 579.5v236" class="connection stroke-B2 s3" mask="url(#d2-1496867234)"/><path fill="none" marker-end="url(#mk-d2-1496867234-2177206569)" d="M527.446 577.96C731.9 626.3 783.5 669.9 783.5 791.5" class="connection stroke-B2 s3" mask="url(#d2-1496867234)"/><path fill="none" marker-end="url(#mk-d2-1496867234-3488378134)" d="M1488.5 571.5c0 53.2.1 79.1.467 123.5" class="connection stroke-B1 s0" mask="url(#d2-1496867234)"/><text x="1489" y="640" class="text-italic fill-N2 s1">설명해야 할 것</text><path fill="none" marker-end="url(#mk-d2-1496867234-3488378134)" d="M1260.221 955.915C1150 1012.6 1122 1037 1122 1073" class="connection stroke-B1 s0" mask="url(#d2-1496867234)"/><path fill="none" marker-end="url(#mk-d2-1496867234-3488378134)" d="M1716.779 955.915C1827 1012.6 1855 1037 1855 1073" class="connection stroke-B1 s0" mask="url(#d2-1496867234)"/><path fill="none" marker-end="url(#mk-d2-1496867234-3488378134)" d="M1122 1208.5c0 46.8 23.2 75.1 112.714 137.22" class="connection stroke-B1 s0" mask="url(#d2-1496867234)"/><text x="1156.5" y="1297" class="text-italic fill-N2 s1">틀림을 담기 어렵다</text><path fill="none" marker-end="url(#mk-d2-1496867234-3488378134)" d="M1855 1208.5c0 46.8-23.2 75.1-112.714 137.22" class="connection stroke-B1 s0" mask="url(#d2-1496867234)"/><text x="1820.5" y="1297" class="text-italic fill-N2 s1">‘원래 하도록 되어 있던 일’ 로 담으려 한다</text><path fill="none" marker-end="url(#mk-d2-1496867234-2177206569)" d="M1067.083 1640.571C765.6 1730.4 689.75 1763 689.75 1799" class="connection stroke-B2 s3" mask="url(#d2-1496867234)"/><path fill="none" marker-end="url(#mk-d2-1496867234-2177206569)" d="M1255.394 1687.192C1184.8 1739.6 1166.75 1763 1166.75 1799" class="connection stroke-B2 s3" mask="url(#d2-1496867234)"/><path fill="none" marker-end="url(#mk-d2-1496867234-2177206569)" d="M1721.614 1688.18c70.586 51.62 88.636 79.62 88.636 134.82" class="connection stroke-B2 s3" mask="url(#d2-1496867234)"/><mask id="d2-1496867234" width="2389" height="2074" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2389v2074H-101z"/><path d="M1193 336h136v21h-136zM236 375h136v21H236zM1426 624h126v21h-126zM1074 1281h165v21h-165zM1643 1281h355v21h-355z"/></mask></svg>