<svg xmlns="http://www.w3.org/2000/svg" width="1478" height="1806" class="d2-1238581405 d2-svg" viewBox="-101 -101 1478 1806"><rect width="1478" height="1806" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1238581405 .fill-N1{fill:#0a0f25}.d2-1238581405 .fill-N2{fill:#676c7e}.d2-1238581405 .fill-B6{fill:#f7f8fe}.d2-1238581405 .stroke-B1,.d2-1238581405 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="367.5" cy="102.5" class="shape stroke-B1 fill-B6 s0" rx="307.5" ry="102.5"/></g><text x="367.5" y="84" class="text-bold fill-N1 s1"><tspan x="367.5" dy="0">지향성 — 무언가에 관함</tspan><tspan x="367.5" dy="17.25">브렌타노가 오늘의 뜻으로 되살린 말이다.</tspan><tspan x="367.5" dy="17.25">물리주의에 부담이 되는 성질 둘 —</tspan><tspan x="367.5" dy="17.25">없는 것에 관할 수 있고, 관점 아래에서 관한다</tspan></text></g><g ><g class="shape"><path d="M719 326h299v130H719z" class="stroke-B1 fill-B6 s0"/></g><text x="868.5" y="364.5" class="text-bold fill-N1 s1"><tspan x="868.5" dy="0">원초적 지향성</tspan><tspan x="868.5" dy="17">남이 그렇게 읽어 주어서</tspan><tspan x="868.5" dy="17">관하는 것이 아니다.</tspan><tspan x="868.5" dy="17">보기 — 비가 온다는 나의 믿음,</tspan><tspan x="868.5" dy="17">물 한 잔에 대한 나의 욕구</tspan></text></g><g ><g class="shape"><path d="M0 326h370v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="185" y="364.5" class="text-bold fill-N1 s1"><tspan x="185" dy="0">파생적 지향성</tspan><tspan x="185" dy="17">그 자체로는 잉크 자국이고 눈금이다.</tspan><tspan x="185" dy="17">우리가 그렇게 읽기 때문에 관한다.</tspan><tspan x="185" dy="17">보기 — 책에 적힌 ‘고양이’, 지도의 선,</tspan><tspan x="185" dy="17">온도계의 눈금, 표지판</tspan></text></g><text x="185.5" y="625" class="fill-N1 s1"><tspan x="185.5" dy="0">가르는 요령 —</tspan><tspan x="185.5" dy="17">해석자를 지우면</tspan><tspan x="185.5" dy="17">관함이 사라지는가.</tspan><tspan x="185.5" dy="17">사라지면 파생적이고</tspan><tspan x="185.5" dy="17">남으면 원초적이다</tspan></text><text x="460.5" y="593" class="fill-N1 s1"><tspan x="460.5" dy="0">왜 이 구별이 필요한가</tspan><tspan x="460.5" dy="16.556">파생적 지향성만 갖는 것에</tspan><tspan x="460.5" dy="16.556">마음을 돌리면 순환이 된다.</tspan><tspan x="460.5" dy="16.556">종이가 관하는 것은</tspan><tspan x="460.5" dy="16.556">우리가 관하기 때문이므로</tspan><tspan x="460.5" dy="16.556">종이의 관함으로</tspan><tspan x="460.5" dy="16.556">우리의 관함을 설명할 수 없다.</tspan><tspan x="460.5" dy="16.556">이 구별이 중국어 방 논증에서</tspan><tspan x="460.5" dy="16.556">곧바로 쓰인다</tspan></text><g ><g class="shape"><ellipse cx="869" cy="651.5" class="shape stroke-B1 fill-B6 s0" rx="223" ry="74.5"/></g><text x="869" y="641" class="text-bold fill-N1 s1"><tspan x="869" dy="0">자연화 계획</tspan><tspan x="869" dy="17.667">물리주의자는 원초적 지향성을</tspan><tspan x="869" dy="17.667">자연적인 것으로 설명해야 한다</tspan></text></g><g ><g class="shape"><path d="M466 842h388v162H466z" class="stroke-B1 fill-B6 s0"/></g><text x="660" y="880.5" class="text-bold fill-N1 s1"><tspan x="660" dy="0">① 정보와 인과</tspan><tspan x="660" dy="16.714">연기는 불에 대한 정보를 나른다 —</tspan><tspan x="660" dy="16.714">불이 없으면 연기가 나지 않기 때문이다.</tspan><tspan x="660" dy="16.714">마음의 상태가 무언가에 관한다는 것은,</tspan><tspan x="660" dy="16.714">그 상태가 그것에 대한 정보를 나르도록</tspan><tspan x="660" dy="16.714">알맞게 이어져 있다는 것이다.</tspan><tspan x="660" dy="16.714">드레츠키가 이 착상을 다듬었다</tspan></text></g><g ><g class="shape"><path d="M914 826h362v194H914z" class="stroke-B1 fill-B6 s0"/></g><text x="1095" y="864.5" class="text-bold fill-N1 s1"><tspan x="1095" dy="0">② 기능과 목적</tspan><tspan x="1095" dy="16.556">개구리의 어떤 신경 상태는</tspan><tspan x="1095" dy="16.556">지나가는 작은 검은 점에 반응한다.</tspan><tspan x="1095" dy="16.556">그 상태가 파리에 관한 것이라</tspan><tspan x="1095" dy="16.556">말할 수 있는 이유는</tspan><tspan x="1095" dy="16.556">그 장치가 파리를 잡는 일을 하도록</tspan><tspan x="1095" dy="16.556">자연선택이 다듬어 놓았기 때문이다.</tspan><tspan x="1095" dy="16.556">밀리컨이 이 방향을</tspan><tspan x="1095" dy="16.556">목적론적 의미론으로 세웠다</tspan></text></g><g ><g class="shape"><ellipse cx="869" cy="1264" class="shape stroke-B1 fill-B6 s0" rx="321" ry="107"/></g><text x="869" y="1221.5" class="text-bold fill-N1 s1"><tspan x="869" dy="0">시험대 — 오표상 문제</tspan><tspan x="869" dy="16.714">지향적 상태는 틀릴 수 있어야 한다.</tspan><tspan x="869" dy="16.714">참일 수도 거짓일 수도 없는 것은 믿음이 아니다.</tspan><tspan x="869" dy="16.714">개구리가 던져진 작은 돌에 혀를 뻗었다면</tspan><tspan x="869" dy="16.714">그 상태는 파리에 관한 것이면서 틀린 것인가,</tspan><tspan x="869" dy="16.714">아니면 애초에 ‘파리 또는 작은 검은 점’ 에</tspan><tspan x="869" dy="16.714">관한 것이라 틀리지 않은 것인가</tspan></text></g><text x="344.5" y="1511" class="fill-N1 s1"><tspan x="344.5" dy="0">내용을 정보로만 정하면</tspan><tspan x="344.5" dy="17">내용이 넓게 잡히고,</tspan><tspan x="344.5" dy="17">그러면 개구리는 틀린 적이 없게 된다.</tspan><tspan x="344.5" dy="17">오표상이 원리적으로 일어나지 않으면</tspan><tspan x="344.5" dy="17">관함의 핵심 성질 하나가 사라진다</tspan></text><text x="709.5" y="1487" class="fill-N1 s1"><tspan x="709.5" dy="0">그 ‘원래’ 를 자연적 사실로</tspan><tspan x="709.5" dy="16.625">정확히 적는 것이 부담이다.</tspan><tspan x="709.5" dy="16.625">자연선택의 역사로 적는 것이</tspan><tspan x="709.5" dy="16.625">표준 시도인데,</tspan><tspan x="709.5" dy="16.625">그러면 같은 물리 구조를 가졌지만</tspan><tspan x="709.5" dy="16.625">역사가 없는 존재의</tspan><tspan x="709.5" dy="16.625">내용이 정해지지 않는다는</tspan><tspan x="709.5" dy="16.625">문제가 따라온다</tspan></text><text x="1045" y="1527" class="fill-N1 s1"><tspan x="1045" dy="0">이 문제는 열려 있다.</tspan><tspan x="1045" dy="17.667">지향성을 자연화하는 어떤 안도</tspan><tspan x="1045" dy="17.667">아직 널리 받아들여지지 않았다</tspan></text><marker id="mk-d2-1238581405-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1238581405-3488378134)" d="M588.902 174.618C812.2 247.2 868.5 277.7 868.5 322.5" class="connection stroke-B1 s0" mask="url(#d2-1238581405)"/><text x="753" y="234" class="text-italic fill-N2 s1">어디서 얻는가 ①</text><path fill="none" marker-end="url(#mk-d2-1238581405-3488378134)" d="M258.513 199.338C200 252 185 277.7 185 322.5" class="connection stroke-B1 s0" mask="url(#d2-1238581405)"/><text x="201" y="257" class="text-italic fill-N2 s1">어디서 얻는가 ②</text><marker id="mk-d2-1238581405-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1238581405-2177206569)" d="M185 457.5v148" class="connection stroke-B2 s3" mask="url(#d2-1238581405)"/><path fill="none" marker-end="url(#mk-d2-1238581405-2177206569)" d="M328.818 456.334C433.4 504.3 460 528.7 460 573.5" class="connection stroke-B2 s3" mask="url(#d2-1238581405)"/><path fill="none" marker-end="url(#mk-d2-1238581405-3488378134)" d="M868.5 457.5c0 46.8.1 71.1.467 115.5" class="connection stroke-B1 s0" mask="url(#d2-1238581405)"/><text x="869" y="522" class="text-italic fill-N2 s1">설명해야 할 것</text><path fill="none" marker-end="url(#mk-d2-1238581405-3488378134)" d="M758.283 717.025C679.6 764 659.5 789.2 659.5 838" class="connection stroke-B1 s0" mask="url(#d2-1238581405)"/><path fill="none" marker-end="url(#mk-d2-1238581405-3488378134)" d="M985.75 715.967C1072.4 763.8 1094.5 786 1094.5 822" class="connection stroke-B1 s0" mask="url(#d2-1238581405)"/><path fill="none" marker-end="url(#mk-d2-1238581405-3488378134)" d="M659.5 1005.5c0 66 17.9 98.3 86.46 156.901" class="connection stroke-B1 s0" mask="url(#d2-1238581405)"/><text x="674.5" y="1105" class="text-italic fill-N2 s1">틀림을 담기 어렵다</text><path fill="none" marker-end="url(#mk-d2-1238581405-3488378134)" d="M1094.5 1021.5c0 53.2-19.5 82.5-94.369 142.011" class="connection stroke-B1 s0" mask="url(#d2-1238581405)"/><text x="1071" y="1104" class="text-italic fill-N2 s1"><tspan x="1071" dy="0">‘원래 하도록 되어 있던 일’ 로</tspan><tspan x="1071" dy="18.5">담으려 한다</tspan></text><path fill="none" marker-end="url(#mk-d2-1238581405-2177206569)" d="M628.085 1335.576C401.4 1403.8 344.25 1435.8 344.25 1491" class="connection stroke-B2 s3" mask="url(#d2-1238581405)"/><path fill="none" marker-end="url(#mk-d2-1238581405-2177206569)" d="M764.576 1366.405C720.6 1409.8 709.25 1431 709.25 1467" class="connection stroke-B2 s3" mask="url(#d2-1238581405)"/><path fill="none" marker-end="url(#mk-d2-1238581405-2177206569)" d="M982.49 1365.333C1032 1409.6 1044.75 1439 1044.75 1507" class="connection stroke-B2 s3" mask="url(#d2-1238581405)"/><mask id="d2-1238581405" width="1478" height="1806" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1478v1806H-101z"/><path d="M685 218h136v21H685zM133 241h136v21H133zM806 506h126v21H806zM592 1089h165v21H592zM945 1088h252v37H945z"/></mask></svg>