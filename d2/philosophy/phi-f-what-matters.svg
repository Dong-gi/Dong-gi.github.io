<svg xmlns="http://www.w3.org/2000/svg" width="3995" height="674" class="d2-1627237966 d2-svg" viewBox="-101 -101 3995 674"><rect width="3995" height="674" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1627237966 .fill-N1{fill:#0a0f25}.d2-1627237966 .fill-B6{fill:#f7f8fe}.d2-1627237966 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="351" cy="144.5" class="shape stroke-B1 fill-B6 s0" rx="304" ry="101.5"/></g><text x="351" y="142" class="text-bold fill-N1 s1"><tspan x="351" dy="0">분열 사례</tspan><tspan x="351" dy="18.5">어느 답도 대가를 치르지 않고는 고를 수 없다</tspan></text></g><g ><g class="shape"><path d="M864 103h324v82H864z" class="stroke-B1 fill-B6 s0"/></g><text x="1026" y="141.5" class="text-bold fill-N1 s1"><tspan x="1026" dy="0">‘둘 중 누가 나인가’ 라는 물음이</tspan><tspan x="1026" dy="18.5">답을 가지고 있기는 한가</tspan></text></g><g ><g class="shape"><path d="M1350 87h493v114h-493z" class="stroke-B1 fill-B6 s0"/></g><text x="1596.5" y="125.5" class="text-bold fill-N1 s1"><tspan x="1596.5" dy="0">환원 견해</tspan><tspan x="1596.5" dy="17.25">사람이 시간을 지나 존속한다는 것은</tspan><tspan x="1596.5" dy="17.25">몸과 뇌가 이어지고 심리가 이어진다는 것이 전부다.</tspan><tspan x="1596.5" dy="17.25">그 밑에 더 깊은 사실은 없다</tspan></text></g><g ><g class="shape"><path d="M2005 95h391v98h-391z" class="stroke-B1 fill-B6 s0"/></g><text x="2200.5" y="133.5" class="text-bold fill-N1 s1"><tspan x="2200.5" dy="0">그렇다면 사실을 다 알고도 남는 물음은</tspan><tspan x="2200.5" dy="17.667">빈 물음이다. 답이 숨어 있는 것이 아니라</tspan><tspan x="2200.5" dy="17.667">물을 것이 없는 것이다</tspan></text></g><g ><g class="shape"><path d="M2680 95h385v98h-385z" class="stroke-B1 fill-B6 s0"/></g><text x="2872.5" y="133.5" class="text-bold fill-N1 s1"><tspan x="2872.5" dy="0">중요한 것은 동일성이 아니라 관계 R</tspan><tspan x="2872.5" dy="17.667">심리적 연결성과 연속성, 그리고 그것이</tspan><tspan x="2872.5" dy="17.667">올바른 방식으로 생겨났다는 것</tspan></text></g><g ><g class="shape"><path d="M3308 0h404v114h-404z" class="stroke-B1 fill-B6 s0"/></g><text x="3510" y="38.5" class="text-bold fill-N1 s1"><tspan x="3510" dy="0">받아들이는 쪽</tspan><tspan x="3510" dy="17.25">분열은 죽음이 아니다. 관계 R 이 두 갈래로</tspan><tspan x="3510" dy="17.25">이어지는 것은 끊기는 것보다 낫다.</tspan><tspan x="3510" dy="17.25">동일성에 걸어 두었던 무게를 옮기면 된다</tspan></text></g><g ><g class="shape"><path d="M3227 174h566v114h-566z" class="stroke-B1 fill-B6 s0"/></g><text x="3510" y="212.5" class="text-bold fill-N1 s1"><tspan x="3510" dy="0">거부하는 쪽</tspan><tspan x="3510" dy="17.25">환원 견해가 틀렸다. 사람은 몸과 심리의 사실로</tspan><tspan x="3510" dy="17.25">환원되지 않는 무언가다 — 단순 견해.</tspan><tspan x="3510" dy="17.25">또는 사람은 하나의 동물이므로 물음에 답이 있다 — 동물주의</tspan></text></g><text x="351" y="322" class="fill-N1 s1"><tspan x="351" dy="0">여기가 미결이다. 파핏의 결론은 널리 읽히고 널리 논박된다.</tspan><tspan x="351" dy="17.667">받아들이는 쪽과 거부하는 쪽 모두 살아 있는 견해이고,</tspan><tspan x="351" dy="17.667">이 문서는 둘 중 하나를 고르지 않는다</tspan></text><text x="351" y="435" class="fill-N1 s1"><tspan x="351" dy="0">거부하는 쪽에도 이유가 있다.</tspan><tspan x="351" dy="17.667">‘사람은 몸과 심리의 사실로 환원되지 않는다’ 고 말하는 근거는 이렇다 —</tspan><tspan x="351" dy="17.667">분열 사례에서 우리가 느끼는 당혹 자체가 무언가 빠졌다는 신호일 수 있다는 것이다</tspan></text><marker id="mk-d2-1627237966-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1627237966-3488378134)" d="M657 144h203" class="connection stroke-B1 s0" mask="url(#d2-1627237966)"/><path fill="none" marker-end="url(#mk-d2-1627237966-3488378134)" d="M1190 144h156" class="connection stroke-B1 s0" mask="url(#d2-1627237966)"/><path fill="none" marker-end="url(#mk-d2-1627237966-3488378134)" d="M1845 144h156" class="connection stroke-B1 s0" mask="url(#d2-1627237966)"/><path fill="none" marker-end="url(#mk-d2-1627237966-3488378134)" d="M2398 144h278" class="connection stroke-B1 s0" mask="url(#d2-1627237966)"/><text x="2538" y="150" style="fill:#676c7e;text-anchor:middle;font-size:16px">그러면 남는 것</text><path fill="none" marker-end="url(#mk-d2-1627237966-3488378134)" d="M3028.905 94.392C3122.2 64.599 3178.4 57 3304 57" class="connection stroke-B1 s0" mask="url(#d2-1627237966)"/><path fill="none" marker-end="url(#mk-d2-1627237966-3488378134)" d="M3028.905 193.608C3122.2 223.4 3162.2 231 3223 231" class="connection stroke-B1 s0" mask="url(#d2-1627237966)"/><mask id="d2-1627237966" width="3995" height="674" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3995v674H-101z"/><path d="M2475 134h126v21h-126z"/></mask></svg>