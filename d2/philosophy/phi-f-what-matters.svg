<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="1665" class="d2-3306893791 d2-svg" viewBox="-101 -101 1062 1665"><rect width="1062" height="1665" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3306893791 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3306893791 .fill-N1{fill:#0a0f25}.d2-3306893791 .fill-B6{fill:#f7f8fe}.d2-3306893791 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="428" cy="101.5" class="shape stroke-B1 fill-B6 s0" rx="304" ry="101.5"/></g><text x="428" y="99" class="text-bold fill-N1 s1"><tspan x="428" dy="0">분열 사례</tspan><tspan x="428" dy="18.5">어느 답도 대가를 치르지 않고는 고를 수 없다</tspan></text></g><g ><g class="shape"><path d="M266 303h324v82H266z" class="stroke-B1 fill-B6 s0"/></g><text x="428" y="341.5" class="text-bold fill-N1 s1"><tspan x="428" dy="0">‘둘 중 누가 나인가’ 라는 물음이</tspan><tspan x="428" dy="18.5">답을 가지고 있기는 한가</tspan></text></g><g ><g class="shape"><path d="M248 485h360v130H248z" class="stroke-B1 fill-B6 s0"/></g><text x="428" y="523.5" class="text-bold fill-N1 s1"><tspan x="428" dy="0">환원 견해</tspan><tspan x="428" dy="17">사람이 시간을 지나 존속한다는 것은</tspan><tspan x="428" dy="17">몸과 뇌가 이어지고 심리가</tspan><tspan x="428" dy="17">이어진다는 것이 전부다.</tspan><tspan x="428" dy="17">그 밑에 더 깊은 사실은 없다</tspan></text></g><g ><g class="shape"><path d="M233 715h391v98H233z" class="stroke-B1 fill-B6 s0"/></g><text x="428.5" y="753.5" class="text-bold fill-N1 s1"><tspan x="428.5" dy="0">그렇다면 사실을 다 알고도 남는 물음은</tspan><tspan x="428.5" dy="17.667">빈 물음이다. 답이 숨어 있는 것이 아니라</tspan><tspan x="428.5" dy="17.667">물을 것이 없는 것이다</tspan></text></g><g ><g class="shape"><path d="M236 934h385v98H236z" class="stroke-B1 fill-B6 s0"/></g><text x="428.5" y="972.5" class="text-bold fill-N1 s1"><tspan x="428.5" dy="0">중요한 것은 동일성이 아니라 관계 R</tspan><tspan x="428.5" dy="17.667">심리적 연결성과 연속성, 그리고 그것이</tspan><tspan x="428.5" dy="17.667">올바른 방식으로 생겨났다는 것</tspan></text></g><g ><g class="shape"><path d="M0 1148h404v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="202" y="1186.5" class="text-bold fill-N1 s1"><tspan x="202" dy="0">받아들이는 쪽</tspan><tspan x="202" dy="17.25">분열은 죽음이 아니다. 관계 R 이 두 갈래로</tspan><tspan x="202" dy="17.25">이어지는 것은 끊기는 것보다 낫다.</tspan><tspan x="202" dy="17.25">동일성에 걸어 두었던 무게를 옮기면 된다</tspan></text></g><g ><g class="shape"><path d="M464 1132h380v146H464z" class="stroke-B1 fill-B6 s0"/></g><text x="654" y="1170.5" class="text-bold fill-N1 s1"><tspan x="654" dy="0">거부하는 쪽</tspan><tspan x="654" dy="16.833">환원 견해가 틀렸다.</tspan><tspan x="654" dy="16.833">사람은 몸과 심리의 사실로</tspan><tspan x="654" dy="16.833">환원되지 않는 무언가다 — 단순 견해.</tspan><tspan x="654" dy="16.833">또는 사람은 하나의 동물이므로 물음에</tspan><tspan x="654" dy="16.833">답이 있다 — 동물주의</tspan></text></g><text x="202" y="1394" class="fill-N1 s1"><tspan x="202" dy="0">여기가 미결이다.</tspan><tspan x="202" dy="17">파핏의 결론은 널리 읽히고 널리 논박된다.</tspan><tspan x="202" dy="17">받아들이는 쪽과 거부하는 쪽</tspan><tspan x="202" dy="17">모두 살아 있는 견해이고,</tspan><tspan x="202" dy="17">이 문서는 둘 중 하나를 고르지 않는다</tspan></text><text x="654.5" y="1394" class="fill-N1 s1"><tspan x="654.5" dy="0">거부하는 쪽에도 이유가 있다.</tspan><tspan x="654.5" dy="17">‘사람은 몸과 심리의 사실로 환원되지 않는다’</tspan><tspan x="654.5" dy="17">고 말하는 근거는 이렇다 —</tspan><tspan x="654.5" dy="17">분열 사례에서 우리가 느끼는 당혹 자체가 무언가</tspan><tspan x="654.5" dy="17">빠졌다는 신호일 수 있다는 것이다</tspan></text><marker id="mk-d2-3306893791-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3306893791-3488378134)" d="M428 205v94" class="connection stroke-B1 s0" mask="url(#d2-3306893791)"/><path fill="none" marker-end="url(#mk-d2-3306893791-3488378134)" d="M428 387v94" class="connection stroke-B1 s0" mask="url(#d2-3306893791)"/><path fill="none" marker-end="url(#mk-d2-3306893791-3488378134)" d="M428 617v94" class="connection stroke-B1 s0" mask="url(#d2-3306893791)"/><path fill="none" marker-end="url(#mk-d2-3306893791-3488378134)" d="M428 814.5v116" class="connection stroke-B1 s0" mask="url(#d2-3306893791)"/><text x="428" y="879" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">그러면 남는 것</text><path fill="none" marker-end="url(#mk-d2-3306893791-3488378134)" d="M314.168 1032.803C224.8 1072 202 1095.2 202 1144" class="connection stroke-B1 s0" mask="url(#d2-3306893791)"/><path fill="none" marker-end="url(#mk-d2-3306893791-3488378134)" d="M541.832 1032.803C631.2 1072 654 1092 654 1128" class="connection stroke-B1 s0" mask="url(#d2-3306893791)"/><mask id="d2-3306893791" width="1062" height="1665" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H961v1665H-101z"/><path d="M365 863h126v21H365z"/></mask></svg>