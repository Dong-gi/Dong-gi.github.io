<svg xmlns="http://www.w3.org/2000/svg" width="1229" height="1243" class="d2-3687938411 d2-svg" viewBox="-89 -89 1229 1243"><rect width="1229" height="1243" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3687938411 .fill-N1{fill:#0a0f25}.d2-3687938411 .fill-N2{fill:#676c7e}.d2-3687938411 .fill-B5{fill:#edf0fd}.d2-3687938411 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M286 12h753v750H286z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="662.5" y="45" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px"><tspan x="662.5" dy="0">한 번의 발화 — ‘저기 개가 있다’</tspan><tspan x="662.5" dy="32">세 층이 겹쳐 있다. 하나를 고르는 갈래가 아니다</tspan></text></g><text x="159.5" y="863" class="fill-N1 s0"><tspan x="159.5" dy="0">가운데 층은 말하는 사람의 의도와</tspan><tspan x="159.5" dy="16.625">그 자리의 관례가 함께 정한다.</tspan><tspan x="159.5" dy="16.625">적정 조건이 걸리는 곳도 여기다 —</tspan><tspan x="159.5" dy="16.625">그런 절차가 있어야 하고,</tspan><tspan x="159.5" dy="16.625">자격 있는 사람이, 알맞은 자리에서,</tspan><tspan x="159.5" dy="16.625">절차를 제대로 밟아야 한다.</tspan><tspan x="159.5" dy="16.625">어긋나면 거짓이 아니라</tspan><tspan x="159.5" dy="16.625">어그러진 것이다</tspan></text><text x="879.5" y="863" class="fill-N1 s0"><tspan x="879.5" dy="0">셋째 층은 듣는 사람 쪽에서 일어난다.</tspan><tspan x="879.5" dy="17.25">말하는 사람이 정할 수 없다.</tspan><tspan x="879.5" dy="17.25">그래서 ‘내가 너를 설득한다’ 는</tspan><tspan x="879.5" dy="17.25">수행문이 되지 않는다</tspan></text><text x="515" y="863" class="fill-N1 s0"><tspan x="515" dy="0">같은 발화행위가 자리에 따라</tspan><tspan x="515" dy="16.714">다른 발화수반력을 가질 수 있다.</tspan><tspan x="515" dy="16.714">‘여기 춥다’ 는 온도에 대한 진술일 수도 있고</tspan><tspan x="515" dy="16.714">창문을 닫아 달라는 요청일 수도 있다.</tspan><tspan x="515" dy="16.714">한 종류의 꼴로 다른 종류의 일을 하는 것을</tspan><tspan x="515" dy="16.714">간접 화행이라 한다 —</tspan><tspan x="515" dy="16.714">‘소금 좀 건네주실 수 있나요’</tspan></text><text x="525" y="1016" class="fill-N1 s0"><tspan x="525" dy="0">층을 갈라 두면 보이는 것 — ‘저를 모욕하셨습니다’ 는 둘째 층에 대한 주장이고</tspan><tspan x="525" dy="17.667">‘제가 상처를 받았습니다’ 는 셋째 층에 대한 주장이다. 뒤엣것은 상대가 부인할 수 없다.</tspan><tspan x="525" dy="17.667">다툼이 엉키는 것은 대개 두 층을 섞어 말하기 때문이다</tspan></text><g ><g class="shape"><path d="M352 86h474v98H352z" class="stroke-B1 fill-B5 s1"/></g><text x="589" y="124.5" class="text-bold fill-N1 s0"><tspan x="589" dy="0">발화행위 — 어떤 뜻과 지시를 지닌 소리를 내는 것</tspan><tspan x="589" dy="17.667">‘개’ 가 개를 가리키고 ‘저기’ 가 저쪽을 가리키는</tspan><tspan x="589" dy="17.667">한국어 문장을 발음했다</tspan></text></g><g ><g class="shape"><path d="M388 345h403v114H388z" class="stroke-B1 fill-B5 s1"/></g><text x="589.5" y="383.5" class="text-bold fill-N1 s0"><tspan x="589.5" dy="0">발화수반행위 — 그 말을 함으로써 하는 것</tspan><tspan x="589.5" dy="17.25">경고했다. 또는 알렸다.</tspan><tspan x="589.5" dy="17.25">또는 개를 좋아하는 사람에게 권했다.</tspan><tspan x="589.5" dy="17.25">이 층이 지니는 것을 발화수반력이라 한다</tspan></text></g><g ><g class="shape"><path d="M556 630h418v82H556z" class="fill-B5" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="765" y="668.5" class="text-bold fill-N1 s0"><tspan x="765" dy="0">발화효과행위 — 그 말을 함으로써 일으킨 것</tspan><tspan x="765" dy="18.5">상대가 겁을 먹었다. 또는 걸음을 멈췄다</tspan></text></g><marker id="mk-d2-3687938411-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3687938411-3488378134)" d="M589.625 186v155" class="connection stroke-B1 s1" mask="url(#d2-3687938411)"/><text x="590" y="270" class="text-italic fill-N2 s0">그 말을 함으로써 한 것</text><path fill="none" marker-end="url(#mk-d2-3687938411-3488378134)" d="M765 461v165" class="connection stroke-B1 s1" mask="url(#d2-3687938411)"/><text x="765.5" y="550" class="text-italic fill-N2 s0">그 말이 일으킨 것</text><path fill="none" marker-end="url(#mk-d2-3687938411-3488378134)" d="M459.125 461v336s0 10-10 10H169.5s-10 0-10 10v26" class="connection stroke-B1 s1" mask="url(#d2-3687938411)"/><path fill="none" marker-end="url(#mk-d2-3687938411-3488378134)" d="M879.5 714v129" class="connection stroke-B1 s1" mask="url(#d2-3687938411)"/><path fill="none" marker-end="url(#mk-d2-3687938411-3488378134)" d="M515 461v382" class="connection stroke-B1 s1" mask="url(#d2-3687938411)"/><mask id="d2-3687938411" width="1229" height="1243" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1229v1243H-89z"/><path d="M495 254h190v21H495zM691 534h149v21H691z"/></mask></svg>