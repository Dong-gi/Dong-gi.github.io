<svg xmlns="http://www.w3.org/2000/svg" width="2588" height="991" class="d2-3039822981 d2-svg" viewBox="-101 -149 2588 991"><rect width="2588" height="991" x="-101" y="-149" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3039822981 .fill-N1{fill:#0a0f25}.d2-3039822981 .fill-N2{fill:#676c7e}.d2-3039822981 .fill-B5{fill:#edf0fd}.d2-3039822981 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M15 20h746v564H15z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="388" y="-21" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px"><tspan x="388" dy="0">한 번의 발화 — ‘저기 개가 있다’</tspan><tspan x="388" dy="32">세 층이 겹쳐 있다. 하나를 고르는 갈래가 아니다</tspan></text></g><text x="1174" y="503" class="fill-N1 s0"><tspan x="1174" dy="0">가운데 층은 말하는 사람의 의도와 그 자리의 관례가 함께 정한다.</tspan><tspan x="1174" dy="17.667">적정 조건이 걸리는 곳도 여기다 — 그런 절차가 있어야 하고, 자격 있는 사람이,</tspan><tspan x="1174" dy="17.667">알맞은 자리에서, 절차를 제대로 밟아야 한다. 어긋나면 거짓이 아니라 어그러진 것이다</tspan></text><text x="274.5" y="720" class="fill-N1 s0"><tspan x="274.5" dy="0">셋째 층은 듣는 사람 쪽에서 일어난다. 말하는 사람이 정할 수 없다.</tspan><tspan x="274.5" dy="18.5">그래서 ‘내가 너를 설득한다’ 는 수행문이 되지 않는다</tspan></text><text x="1991.5" y="503" class="fill-N1 s0"><tspan x="1991.5" dy="0">같은 발화행위가 자리에 따라 다른 발화수반력을 가질 수 있다.</tspan><tspan x="1991.5" dy="17.667">‘여기 춥다’ 는 온도에 대한 진술일 수도 있고 창문을 닫아 달라는 요청일 수도 있다.</tspan><tspan x="1991.5" dy="17.667">한 종류의 꼴로 다른 종류의 일을 하는 것을 간접 화행이라 한다 — ‘소금 좀 건네주실 수 있나요’</tspan></text><text x="1178" y="81" class="fill-N1 s0"><tspan x="1178" dy="0">층을 갈라 두면 보이는 것 — ‘저를 모욕하셨습니다’ 는 둘째 층에 대한 주장이고</tspan><tspan x="1178" dy="17.667">‘제가 상처를 받았습니다’ 는 셋째 층에 대한 주장이다. 뒤엣것은 상대가 부인할 수 없다.</tspan><tspan x="1178" dy="17.667">다툼이 엉키는 것은 대개 두 층을 섞어 말하기 때문이다</tspan></text><g ><g class="shape"><path d="M45 50h686v82H45z" class="stroke-B1 fill-B5 s1"/></g><text x="388" y="88.5" class="text-bold fill-N1 s0"><tspan x="388" dy="0">발화행위 — 어떤 뜻과 지시를 지닌 소리를 내는 것</tspan><tspan x="388" dy="18.5">‘개’ 가 개를 가리키고 ‘저기’ 가 저쪽을 가리키는 한국어 문장을 발음했다</tspan></text></g><g ><g class="shape"><path d="M105 253h566v98H105z" class="stroke-B1 fill-B5 s1"/></g><text x="388" y="291.5" class="text-bold fill-N1 s0"><tspan x="388" dy="0">발화수반행위 — 그 말을 함으로써 하는 것</tspan><tspan x="388" dy="17.667">경고했다. 또는 알렸다. 또는 개를 좋아하는 사람에게 권했다.</tspan><tspan x="388" dy="17.667">이 층이 지니는 것을 발화수반력이라 한다</tspan></text></g><g ><g class="shape"><path d="M66 472h418v82H66z" class="fill-B5" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="275" y="510.5" class="text-bold fill-N1 s0"><tspan x="275" dy="0">발화효과행위 — 그 말을 함으로써 일으킨 것</tspan><tspan x="275" dy="18.5">상대가 겁을 먹었다. 또는 걸음을 멈췄다</tspan></text></g><marker id="mk-d2-3039822981-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3039822981-3488378134)" d="M387.75 133.5v116" class="connection stroke-B1 s1" mask="url(#d2-3039822981)"/><text x="388" y="198" class="text-italic fill-N2 s0">그 말을 함으로써 한 것</text><path fill="none" marker-end="url(#mk-d2-3039822981-3488378134)" d="M336.063 351.891C287.1 399.3 274.5 423.7 274.5 468.5" class="connection stroke-B1 s1" mask="url(#d2-3039822981)"/><text x="285.5" y="408" class="text-italic fill-N2 s0">그 말이 일으킨 것</text><path fill="none" marker-end="url(#mk-d2-3039822981-3488378134)" d="M387.75 352.5c0 46.8 116.157 74 576.821 133.488" class="connection stroke-B1 s1" mask="url(#d2-3039822981)"/><path fill="none" marker-end="url(#mk-d2-3039822981-3488378134)" d="M274.5 556v144" class="connection stroke-B1 s1" mask="url(#d2-3039822981)"/><path fill="none" marker-end="url(#mk-d2-3039822981-3488378134)" d="M474.983 351.498C558.05 399.3 787.92 426.5 1618.61 486.213" class="connection stroke-B1 s1" mask="url(#d2-3039822981)"/><mask id="d2-3039822981" width="2588" height="991" x="-101" y="-149" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-149h2588v991H-101z"/><path d="M293 182h190v21H293zM211 392h149v21H211z"/></mask></svg>