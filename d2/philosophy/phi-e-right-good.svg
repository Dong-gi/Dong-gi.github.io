<svg xmlns="http://www.w3.org/2000/svg" width="1306" height="1066" class="d2-1643611356 d2-svg" viewBox="-101 -101 1306 1066"><rect width="1306" height="1066" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1643611356 .fill-N1{fill:#0a0f25}.d2-1643611356 .fill-B6{fill:#f7f8fe}.d2-1643611356 .stroke-B1,.d2-1643611356 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="560" cy="141.5" class="shape stroke-B1 fill-B6 s0" rx="425" ry="141.5"/></g><text x="560" y="139" class="text-bold fill-N1 s1"><tspan x="560" dy="0">규범윤리의 세 물음</tspan><tspan x="560" dy="18.5">① 어떤 행위가 옳은가 ② 무엇이 좋은가 ③ 어떤 사람이어야 하는가</tspan></text></g><g ><g class="shape"><path d="M6 383h324v130H6z" class="stroke-B1 fill-B6 s0"/></g><text x="168" y="421.5" class="text-bold fill-N1 s1"><tspan x="168" dy="0">결과주의 — ②가 먼저다</tspan><tspan x="168" dy="17">먼저 무엇이 좋은지를 정하고,</tspan><tspan x="168" dy="17">옳은 행위를</tspan><tspan x="168" dy="17">‘좋음을 가장 많이 낳는 행위’ 로</tspan><tspan x="168" dy="17">정의한다</tspan></text></g><g ><g class="shape"><path d="M390 391h341v114H390z" class="stroke-B1 fill-B6 s0"/></g><text x="560.5" y="429.5" class="text-bold fill-N1 s1"><tspan x="560.5" dy="0">의무론 — ①이 먼저다</tspan><tspan x="560.5" dy="17.25">옳음은 좋음으로 환원되지 않는다.</tspan><tspan x="560.5" dy="17.25">결과가 더 좋아도</tspan><tspan x="560.5" dy="17.25">해서는 안 되는 일이 있다</tspan></text></g><g ><g class="shape"><path d="M791 383h313v130H791z" class="stroke-B1 fill-B6 s0"/></g><text x="947.5" y="421.5" class="text-bold fill-N1 s1"><tspan x="947.5" dy="0">덕 윤리 — ③이 먼저다</tspan><tspan x="947.5" dy="17">먼저 어떤 성품이</tspan><tspan x="947.5" dy="17">좋은 성품인지를 말하고,</tspan><tspan x="947.5" dy="17">옳은 행위를 ‘유덕한 사람이</tspan><tspan x="947.5" dy="17">그 상황에서 할 행위’ 로 잡는다</tspan></text></g><g ><g class="shape"><path d="M0 621h335v146H0z" class="stroke-B2 fill-B6 s2"/></g><text x="167.5" y="659.5" class="text-bold fill-N1 s1"><tspan x="167.5" dy="0">그래서 무엇을 설명하나 — 공평성.</tspan><tspan x="167.5" dy="16.833">누구의 고통도</tspan><tspan x="167.5" dy="16.833">원래부터 더 가볍지 않다.</tspan><tspan x="167.5" dy="16.833">대가 — 어떤 개인에게</tspan><tspan x="167.5" dy="16.833">아무리 큰 부담을 지워도</tspan><tspan x="167.5" dy="16.833">총합이 늘면 정당해진다</tspan></text></g><g ><g class="shape"><path d="M396 613h329v162H396z" class="stroke-B2 fill-B6 s2"/></g><text x="560.5" y="651.5" class="text-bold fill-N1 s1"><tspan x="560.5" dy="0">그래서 무엇을 설명하나 —</tspan><tspan x="560.5" dy="16.714">사람에게 값을 매길 수 없다는 것,</tspan><tspan x="560.5" dy="16.714">그리고 넘지 말아야 할</tspan><tspan x="560.5" dy="16.714">선이 있다는 것.</tspan><tspan x="560.5" dy="16.714">대가 — 더 나쁜 결과를 알면서</tspan><tspan x="560.5" dy="16.714">택해야 하는 경우가 생긴다.</tspan><tspan x="560.5" dy="16.714">왜 그래야 하는지를 대야 한다</tspan></text></g><g ><g class="shape"><path d="M795 613h304v162H795z" class="stroke-B2 fill-B6 s2"/></g><text x="947" y="651.5" class="text-bold fill-N1 s1"><tspan x="947" dy="0">그래서 무엇을 설명하나 —</tspan><tspan x="947" dy="16.714">동기와 성품이 평가에</tspan><tspan x="947" dy="16.714">들어간다는 것,</tspan><tspan x="947" dy="16.714">그리고 규칙이 닿지 않는 판단.</tspan><tspan x="947" dy="16.714">대가 — 지금 무엇을 하라는</tspan><tspan x="947" dy="16.714">지침을 주지 않는다는</tspan><tspan x="947" dy="16.714">반론을 받는다</tspan></text></g><text x="552" y="811" class="fill-N1 s1"><tspan x="552" dy="0">셋 다 살아 있다. 이 문서는 하나를 고르지 않는다.</tspan><tspan x="552" dy="17.25">고르지 않는 것과 판단을 미루는 것은 다르다 —</tspan><tspan x="552" dy="17.25">각 이론이 무엇을 설명하려고 나왔고 무엇을 대가로 치르는지는 적을 수 있고,</tspan><tspan x="552" dy="17.25">그 이상은 아직 아무도 확립하지 못했다</tspan></text><marker id="mk-d2-1643611356-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1643611356-3488378134)" d="M318.205 258.883C198 318 167.5 343 167.5 379" class="connection stroke-B1 s0" mask="url(#d2-1643611356)"/><path fill="none" marker-end="url(#mk-d2-1643611356-3488378134)" d="M560 285v102" class="connection stroke-B1 s0" mask="url(#d2-1643611356)"/><path fill="none" marker-end="url(#mk-d2-1643611356-3488378134)" d="M798.794 259.885C917 318.2 947 343 947 379" class="connection stroke-B1 s0" mask="url(#d2-1643611356)"/><path fill="none" marker-end="url(#mk-d2-1643611356-3488378134)" d="M167.5 515v102" class="connection stroke-B1 s0" mask="url(#d2-1643611356)"/><path fill="none" marker-end="url(#mk-d2-1643611356-3488378134)" d="M560 507v102" class="connection stroke-B1 s0" mask="url(#d2-1643611356)"/><path fill="none" marker-end="url(#mk-d2-1643611356-3488378134)" d="M947 515v94" class="connection stroke-B1 s0" mask="url(#d2-1643611356)"/><mask id="d2-1643611356" width="1306" height="1066" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1306V965H-101z"/></mask></svg>