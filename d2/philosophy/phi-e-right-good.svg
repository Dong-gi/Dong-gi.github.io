<svg xmlns="http://www.w3.org/2000/svg" width="2696" height="664" class="d2-292299316 d2-svg" viewBox="-101 -101 2696 664"><rect width="2696" height="664" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-292299316 .fill-N1{fill:#0a0f25}.d2-292299316 .fill-B6{fill:#f7f8fe}.d2-292299316 .stroke-B1,.d2-292299316 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="425" cy="207.5" class="shape stroke-B1 fill-B6 s0" rx="425" ry="141.5"/></g><text x="425" y="205" class="text-bold fill-N1 s1"><tspan x="425" dy="0">규범윤리의 세 물음</tspan><tspan x="425" dy="18.5">① 어떤 행위가 옳은가 ② 무엇이 좋은가 ③ 어떤 사람이어야 하는가</tspan></text></g><g ><g class="shape"><path d="M972 0h516v98H972z" class="stroke-B1 fill-B6 s0"/></g><text x="1230" y="38.5" class="text-bold fill-N1 s1"><tspan x="1230" dy="0">결과주의 — ②가 먼저다</tspan><tspan x="1230" dy="17.667">먼저 무엇이 좋은지를 정하고,</tspan><tspan x="1230" dy="17.667">옳은 행위를 ‘좋음을 가장 많이 낳는 행위’ 로 정의한다</tspan></text></g><g ><g class="shape"><path d="M1025 158h410v98h-410z" class="stroke-B1 fill-B6 s0"/></g><text x="1230" y="196.5" class="text-bold fill-N1 s1"><tspan x="1230" dy="0">의무론 — ①이 먼저다</tspan><tspan x="1230" dy="17.667">옳음은 좋음으로 환원되지 않는다.</tspan><tspan x="1230" dy="17.667">결과가 더 좋아도 해서는 안 되는 일이 있다</tspan></text></g><g ><g class="shape"><path d="M950 316h560v98H950z" class="stroke-B1 fill-B6 s0"/></g><text x="1230" y="354.5" class="text-bold fill-N1 s1"><tspan x="1230" dy="0">덕 윤리 — ③이 먼저다</tspan><tspan x="1230" dy="17.667">먼저 어떤 성품이 좋은 성품인지를 말하고,</tspan><tspan x="1230" dy="17.667">옳은 행위를 ‘유덕한 사람이 그 상황에서 할 행위’ 로 잡는다</tspan></text></g><g ><g class="shape"><path d="M1711 8h683v82h-683z" class="stroke-B2 fill-B6 s2"/></g><text x="2052.5" y="46.5" class="text-bold fill-N1 s1"><tspan x="2052.5" dy="0">그래서 무엇을 설명하나 — 공평성. 누구의 고통도 원래부터 더 가볍지 않다.</tspan><tspan x="2052.5" dy="18.5">대가 — 어떤 개인에게 아무리 큰 부담을 지워도 총합이 늘면 정당해진다</tspan></text></g><g ><g class="shape"><path d="M1610 166h884v82h-884z" class="stroke-B2 fill-B6 s2"/></g><text x="2052" y="204.5" class="text-bold fill-N1 s1"><tspan x="2052" dy="0">그래서 무엇을 설명하나 — 사람에게 값을 매길 수 없다는 것, 그리고 넘지 말아야 할 선이 있다는 것.</tspan><tspan x="2052" dy="18.5">대가 — 더 나쁜 결과를 알면서 택해야 하는 경우가 생긴다. 왜 그래야 하는지를 대야 한다</tspan></text></g><g ><g class="shape"><path d="M1625 324h855v82h-855z" class="stroke-B2 fill-B6 s2"/></g><text x="2052.5" y="362.5" class="text-bold fill-N1 s1"><tspan x="2052.5" dy="0">그래서 무엇을 설명하나 — 동기와 성품이 평가에 들어간다는 것, 그리고 규칙이 닿지 않는 판단.</tspan><tspan x="2052.5" dy="18.5">대가 — 지금 무엇을 하라는 지침을 주지 않는다는 반론을 받는다</tspan></text></g><text x="425" y="425" class="fill-N1 s1"><tspan x="425" dy="0">셋 다 살아 있다. 이 문서는 하나를 고르지 않는다.</tspan><tspan x="425" dy="17.667">고르지 않는 것과 판단을 미루는 것은 다르다 — 각 이론이 무엇을 설명하려고 나왔고</tspan><tspan x="425" dy="17.667">무엇을 대가로 치르는지는 적을 수 있고, 그 이상은 아직 아무도 확립하지 못했다</tspan></text><marker id="mk-d2-292299316-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-292299316-3488378134)" d="M726.898 106.37C865 60.6 914.4 49 968 49" class="connection stroke-B1 s0" mask="url(#d2-292299316)"/><path fill="none" marker-end="url(#mk-d2-292299316-3488378134)" d="M852 207h169" class="connection stroke-B1 s0" mask="url(#d2-292299316)"/><path fill="none" marker-end="url(#mk-d2-292299316-3488378134)" d="M729.895 307.64C865.6 353.4 910 365 946 365" class="connection stroke-B1 s0" mask="url(#d2-292299316)"/><path fill="none" marker-end="url(#mk-d2-292299316-3488378134)" d="M1490 49h216.5" class="connection stroke-B1 s0" mask="url(#d2-292299316)"/><path fill="none" marker-end="url(#mk-d2-292299316-3488378134)" d="M1437 207h169" class="connection stroke-B1 s0" mask="url(#d2-292299316)"/><path fill="none" marker-end="url(#mk-d2-292299316-3488378134)" d="M1512 365h108.5" class="connection stroke-B1 s0" mask="url(#d2-292299316)"/><mask id="d2-292299316" width="2696" height="664" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2696v664H-101z"/></mask></svg>