<svg xmlns="http://www.w3.org/2000/svg" width="1975" height="1101" class="d2-3169695200 d2-svg" viewBox="-101 -101 1975 1101"><rect width="1975" height="1101" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3169695200 .fill-N1{fill:#0a0f25}.d2-3169695200 .fill-N2{fill:#676c7e}.d2-3169695200 .fill-B6{fill:#f7f8fe}.d2-3169695200 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><path d="M591 0h563v82H591z" class="stroke-B1 fill-B6 s0"/></g><text x="872.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="872.5" dy="0">받아들인 이론 한 벌</tspan><tspan x="872.5" dy="18.5">‘소수는 무한히 많다’, ‘이 병의 원인이 되는 유전자가 있다’</tspan></text></g><g ><g class="shape"><path d="M673 203h399v82H673z" class="stroke-B1 fill-B6 s0"/></g><text x="872.5" y="241.5" class="text-bold fill-N1 s1"><tspan x="872.5" dy="0">한정사가 드러나게 다시 적는다</tspan><tspan x="872.5" dy="18.5">∃x (x 는 소수이고 …), ∃x (x 는 유전자이고 …)</tspan></text></g><g ><g class="shape"><path d="M484 406h325v82H484z" class="stroke-B1 fill-B6 s0"/></g><text x="646.5" y="444.5" class="text-bold fill-N1 s1"><tspan x="646.5" dy="0">그 ∃x 가 값으로 훑어야 하는 것들</tspan><tspan x="646.5" dy="18.5">= 이 이론의 존재론적 개입</tspan></text></g><g ><g class="shape"><path d="M647 680h-7l-363-45c-4 0-4-1 0-2l363-45h14l363 45c4 0 4 1 0 2l-363 45z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="647" y="639.5" class="text-bold fill-N1 s1">개입이 마음에 들지 않으면 길은 둘뿐이다</text></g><g ><g class="shape"><path d="M0 801h363v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="181.5" y="839.5" class="text-bold fill-N1 s1"><tspan x="181.5" dy="0">다시 쓴다</tspan><tspan x="181.5" dy="17.667">같은 일을 하면서 그것을 말하지 않는</tspan><tspan x="181.5" dy="17.667">문장으로 바꿀 수 있는가</tspan></text></g><g ><g class="shape"><path d="M423 801h447v98H423z" class="stroke-B1 fill-B6 s0"/></g><text x="646.5" y="839.5" class="text-bold fill-N1 s1"><tspan x="646.5" dy="0">인정한다</tspan><tspan x="646.5" dy="17.667">그런 것이 있다고 받아들이고,</tspan><tspan x="646.5" dy="17.667">그 대가로 이론이 무엇을 해 주는지를 내세운다</tspan></text></g><text x="1099" y="445" class="fill-N1 s1"><tspan x="1099" dy="0">여기 쓰인 ∃x 는 논리학 문서 9장이 세우는 기호다.</tspan><tspan x="1099" dy="18.5">이 그림은 그 기호를 빌려 쓸 뿐 술어논리를 하지 않는다</tspan></text><text x="1351.5" y="840" class="fill-N1 s1"><tspan x="1351.5" dy="0">‘있다’ 를 여러 뜻으로 나눠 두는 길은 이 기준이 미리 막아 둔 길이다.</tspan><tspan x="1351.5" dy="17.667">콰인은 존재를 한 뜻으로 못 박고, 무엇이 있느냐는 물음만 이론에 맡긴다.</tspan><tspan x="1351.5" dy="17.667">그래서 이 기준은 무엇이 있는지를 말해 주지 않는다 — 무엇을 있다고 말하고 있는지를 말해 줄 뿐이다</tspan></text><marker id="mk-d2-3169695200-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3169695200-3488378134)" d="M872.75 83.5v116" class="connection stroke-B1 s0" mask="url(#d2-3169695200)"/><text x="872.5" y="148" class="text-italic fill-N2 s1">논리적 형태를 드러낸다</text><path fill="none" marker-end="url(#mk-d2-3169695200-3488378134)" d="M779.677 285.324C673.5 333.3 646.5 357.7 646.5 402.5" class="connection stroke-B1 s0" mask="url(#d2-3169695200)"/><text x="688.5" y="332" class="text-italic fill-N2 s1">변항이 무엇을 값으로 가져야 참이 되는가</text><path fill="none" marker-end="url(#mk-d2-3169695200-3488378134)" d="M646.5 490c0 38 .1 58 .46 94" class="connection stroke-B1 s0" mask="url(#d2-3169695200)"/><path fill="none" marker-end="url(#mk-d2-3169695200-3488378134)" d="M510.052 664.451C247.599 725.2 181.5 752.7 181.5 797.5" class="connection stroke-B1 s0" mask="url(#d2-3169695200)"/><text x="321" y="714" class="text-italic fill-N2 s1">바꿀 수 있다면</text><path fill="none" marker-end="url(#mk-d2-3169695200-3488378134)" d="M646.983 682c-.383 46.4-.483 70.7-.483 115.5" class="connection stroke-B1 s0" mask="url(#d2-3169695200)"/><text x="647" y="746" class="text-italic fill-N2 s1">바꿀 수 없다면</text><marker id="mk-d2-3169695200-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3169695200-2177206569)" d="M965.823 285.324C1072 333.3 1099 362.1 1099 424.5" class="connection" mask="url(#d2-3169695200)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3169695200" width="1975" height="1101" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1975v1101H-101z"/><path d="M771 132h203v21H771zM515 316h347v21H515zM258 698h126v21H258zM584 730h126v21H584z"/></mask></svg>