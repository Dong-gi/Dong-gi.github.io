<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1286" class="d2-3072721633 d2-svg" viewBox="-101 -101 1000 1286"><rect width="1000" height="1286" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3072721633 .fill-N1{fill:#0a0f25}.d2-3072721633 .fill-N2{fill:#676c7e}.d2-3072721633 .fill-B6{fill:#f7f8fe}.d2-3072721633 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><path d="M295 0h365v98H295z" class="stroke-B1 fill-B6 s0"/></g><text x="477.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="477.5" dy="0">받아들인 이론 한 벌</tspan><tspan x="477.5" dy="17.667">‘소수는 무한히 많다’,</tspan><tspan x="477.5" dy="17.667">‘이 병의 원인이 되는 유전자가 있다’</tspan></text></g><g ><g class="shape"><path d="M320 219h316v98H320z" class="stroke-B1 fill-B6 s0"/></g><text x="478" y="257.5" class="text-bold fill-N1 s1"><tspan x="478" dy="0">한정사가 드러나게 다시 적는다</tspan><tspan x="478" dy="17.667">∃x (x 는 소수이고 …),</tspan><tspan x="478" dy="17.667">∃x (x 는 유전자이고 …)</tspan></text></g><g ><g class="shape"><path d="M134 454h325v82H134z" class="stroke-B1 fill-B6 s0"/></g><text x="296.5" y="492.5" class="text-bold fill-N1 s1"><tspan x="296.5" dy="0">그 ∃x 가 값으로 훑어야 하는 것들</tspan><tspan x="296.5" dy="18.5">= 이 이론의 존재론적 개입</tspan></text></g><g ><g class="shape"><path d="M297 760h-4L53 699c-3-1-3-2 0-2l240-61c3-1 6-1 9 0l240 60c3 1 3 2 0 2l-241 62z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="297" y="695.5" class="text-bold fill-N1 s1"><tspan x="297" dy="0">개입이 마음에 들지 않으면</tspan><tspan x="297" dy="18.5">길은 둘뿐이다</tspan></text></g><g ><g class="shape"><path d="M0 881h255v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="127.5" y="919.5" class="text-bold fill-N1 s1"><tspan x="127.5" dy="0">다시 쓴다</tspan><tspan x="127.5" dy="17.25">같은 일을 하면서</tspan><tspan x="127.5" dy="17.25">그것을 말하지 않는</tspan><tspan x="127.5" dy="17.25">문장으로 바꿀 수 있는가</tspan></text></g><g ><g class="shape"><path d="M315 881h302v114H315z" class="stroke-B1 fill-B6 s0"/></g><text x="466" y="919.5" class="text-bold fill-N1 s1"><tspan x="466" dy="0">인정한다</tspan><tspan x="466" dy="17.25">그런 것이 있다고 받아들이고,</tspan><tspan x="466" dy="17.25">그 대가로 이론이 무엇을</tspan><tspan x="466" dy="17.25">해 주는지를 내세운다</tspan></text></g><text x="658.5" y="477" class="fill-N1 s1"><tspan x="658.5" dy="0">여기 쓰인 ∃x 는</tspan><tspan x="658.5" dy="17.25">논리학 문서 9장이 세우는 기호다.</tspan><tspan x="658.5" dy="17.25">이 그림은 그 기호를 빌려 쓸 뿐</tspan><tspan x="658.5" dy="17.25">술어논리를 하지 않는다</tspan></text><text x="399" y="1031" class="fill-N1 s1"><tspan x="399" dy="0">‘있다’ 를 여러 뜻으로 나눠 두는 길은 이 기준이 미리 막아 둔 길이다.</tspan><tspan x="399" dy="17.25">콰인은 존재를 한 뜻으로 못 박고, 무엇이 있느냐는 물음만 이론에 맡긴다.</tspan><tspan x="399" dy="17.25">그래서 이 기준은 무엇이 있는지를 말해 주지 않는다 —</tspan><tspan x="399" dy="17.25">무엇을 있다고 말하고 있는지를 말해 줄 뿐이다</tspan></text><marker id="mk-d2-3072721633-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3072721633-3488378134)" d="M477.75 99.5v116" class="connection stroke-B1 s0" mask="url(#d2-3072721633)"/><text x="477.5" y="164" class="text-italic fill-N2 s1">논리적 형태를 드러낸다</text><path fill="none" marker-end="url(#mk-d2-3072721633-3488378134)" d="M401.074 317.591C317.95 371.7 296.75 399.3 296.75 450.5" class="connection stroke-B1 s0" mask="url(#d2-3072721633)"/><text x="322.5" y="366" class="text-italic fill-N2 s1"><tspan x="322.5" dy="0">변항이 무엇을 값으로 가져야</tspan><tspan x="322.5" dy="18.5">참이 되는가</tspan></text><path fill="none" marker-end="url(#mk-d2-3072721633-3488378134)" d="M296.75 538c0 38 .05 57.8.23 93" class="connection stroke-B1 s0" mask="url(#d2-3072721633)"/><path fill="none" marker-end="url(#mk-d2-3072721633-3488378134)" d="M230.379 746.171C148.399 805.4 127.5 832.7 127.5 877.5" class="connection stroke-B1 s0" mask="url(#d2-3072721633)"/><text x="156" y="805" class="text-italic fill-N2 s1">바꿀 수 있다면</text><path fill="none" marker-end="url(#mk-d2-3072721633-3488378134)" d="M362.616 745.178C445 805.2 466 832.7 466 877.5" class="connection stroke-B1 s0" mask="url(#d2-3072721633)"/><text x="437" y="805" class="text-italic fill-N2 s1">바꿀 수 없다면</text><marker id="mk-d2-3072721633-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3072721633-2177206569)" d="M554.426 317.591C637.55 371.7 658.75 400.5 658.75 456.5" class="connection" mask="url(#d2-3072721633)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3072721633" width="1000" height="1286" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H899v1286H-101z"/><path d="M376 148h203v21H376zM200 350h245v37H200zM93 789h126v21H93zM374 789h126v21H374z"/></mask></svg>