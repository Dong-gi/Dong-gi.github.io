<svg xmlns="http://www.w3.org/2000/svg" width="1082" height="1511" class="d2-4012692144 d2-svg" viewBox="-101 -101 1082 1511"><rect width="1082" height="1511" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4012692144 .fill-N1{fill:#0a0f25}.d2-4012692144 .fill-N2{fill:#676c7e}.d2-4012692144 .fill-B6{fill:#f7f8fe}.d2-4012692144 .stroke-B1,.d2-4012692144 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="190" cy="50" class="shape stroke-B1 fill-B6 s0" rx="190" ry="50"/></g><text x="190" y="47.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">재구성을 마친 논증</tspan><tspan x="190" dy="18.5">(P1) … (Pn) / (C)</tspan></text></g><g ><g class="shape"><path d="M0 170h380v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="190" y="208.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">① 결론과 전제를 제대로 짚었는가</tspan><tspan x="190" dy="17.667">글쓴이가 이 재구성에</tspan><tspan x="190" dy="17.667">동의하겠는가</tspan></text></g><g ><g class="shape"><path d="M520 170h360v98H520z" class="stroke-B2 fill-B6 s2"/></g><text x="700" y="216.5" class="text-bold fill-N1 s1"><tspan x="700" dy="0">판정 — 이것은 상대의 논증이 아니다</tspan><tspan x="700" dy="18.5">다시 읽고 재구성부터 고친다</tspan></text></g><g ><g class="shape"><path d="M0 338h380v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="190" y="376.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">② 전제 하나하나가</tspan><tspan x="190" dy="17.25">결론과 관련이 있는가</tspan><tspan x="190" dy="17.25">빼도 결론을 받아들일 이유가 그대로면</tspan><tspan x="190" dy="17.25">그 전제는 일을 하지 않고 있다</tspan></text></g><g ><g class="shape"><path d="M0 522h380v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="190" y="560.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">③ 전제가 결론을</tspan><tspan x="190" dy="17.25">얼마나 뒷받침하는가</tspan><tspan x="190" dy="17.25">연역으로 읽으면 타당한가.</tspan><tspan x="190" dy="17.25">귀납으로 읽으면 얼마나 강한가</tspan></text></g><g ><g class="shape"><path d="M520 522h360v114H520z" class="stroke-B2 fill-B6 s2"/></g><text x="700" y="568.5" class="text-bold fill-N1 s1"><tspan x="700" dy="0">판정 — 전제가 다 참이어도</tspan><tspan x="700" dy="17.667">결론이 따라 나오지 않는다</tspan><tspan x="700" dy="17.667">반례를 하나 내놓아야 판정이 선다</tspan></text></g><g ><g class="shape"><path d="M0 706h380v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="190" y="744.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">④ 전제 하나하나를</tspan><tspan x="190" dy="17.25">받아들일 이유가 있는가</tspan><tspan x="190" dy="17.25">여기서부터는 논리가 아니라</tspan><tspan x="190" dy="17.25">그 분야의 지식이 답한다</tspan></text></g><g ><g class="shape"><path d="M520 706h360v114H520z" class="stroke-B2 fill-B6 s2"/></g><text x="700" y="744.5" class="text-bold fill-N1 s1"><tspan x="700" dy="0">판정 — 짜임은 성하고</tspan><tspan x="700" dy="17.25">전제 하나가 의심스럽다</tspan><tspan x="700" dy="17.25">어느 전제인지 지목하고</tspan><tspan x="700" dy="17.25">왜 의심스러운지 대야 한다</tspan></text></g><g ><g class="shape"><path d="M0 890h380v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="190" y="928.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">⑤ 아직 결론을 믿지 않는 사람에게</tspan><tspan x="190" dy="17">이유가 되는가</tspan><tspan x="190" dy="17">전제를 받아들이려면</tspan><tspan x="190" dy="17">이미 결론을 받아들여야 하는 것은</tspan><tspan x="190" dy="17">아닌가</tspan></text></g><g ><g class="shape"><path d="M520 890h360v130H520z" class="stroke-B2 fill-B6 s2"/></g><text x="700" y="944.5" class="text-bold fill-N1 s1"><tspan x="700" dy="0">판정 — 타당하지만</tspan><tspan x="700" dy="17.667">이유가 되지 못한다</tspan><tspan x="700" dy="17.667">선결문제 요구가 이 자리에서 걸린다</tspan></text></g><g ><g class="shape"><path d="M0 1090h380v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="190" y="1128.5" class="text-bold fill-N1 s1"><tspan x="190" dy="0">판정 — 이 논증은 결론을 뒷받침한다</tspan><tspan x="190" dy="17.667">반대하려면 전제 가운데 하나를</tspan><tspan x="190" dy="17.667">새로 공격해야 한다</tspan></text></g><text x="440" y="1224" class="fill-N1 s1"><tspan x="440" dy="0">다섯 판정 가운데 어느 것도 ‘상대의 결론은 거짓이다’ 가 아니다.</tspan><tspan x="440" dy="16.833">논증이 나쁘다는 것과 결론이 거짓이라는 것은 다른 주장이고,</tspan><tspan x="440" dy="16.833">앞을 보였다고 뒤가 따라 나오지 않는다.</tspan><tspan x="440" dy="16.833"> </tspan><tspan x="440" dy="16.833">순서를 지키면 시간을 아낀다. ③에서 걸리는 논증은 ④를 따질 필요가 없고,</tspan><tspan x="440" dy="16.833">①에서 걸리는 논증은 나머지 넷을 따져 봐야 헛일이다</tspan></text><marker id="mk-d2-4012692144-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4012692144-3488378134)" d="M190 102v64" class="connection stroke-B1 s0" mask="url(#d2-4012692144)"/><path fill="none" marker-end="url(#mk-d2-4012692144-3488378134)" d="M382 219h134" class="connection stroke-B1 s0" mask="url(#d2-4012692144)"/><text x="450" y="225" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-4012692144-3488378134)" d="M190 270v64" class="connection stroke-B1 s0" mask="url(#d2-4012692144)"/><text x="190" y="309" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-4012692144-3488378134)" d="M190 454v64" class="connection stroke-B1 s0" mask="url(#d2-4012692144)"/><path fill="none" marker-end="url(#mk-d2-4012692144-3488378134)" d="M382 579h134" class="connection stroke-B1 s0" mask="url(#d2-4012692144)"/><text x="450.5" y="585" class="text-italic fill-N2 s1">부족하다</text><path fill="none" marker-end="url(#mk-d2-4012692144-3488378134)" d="M190 638v64" class="connection stroke-B1 s0" mask="url(#d2-4012692144)"/><text x="190.5" y="677" class="text-italic fill-N2 s1">충분하다</text><path fill="none" marker-end="url(#mk-d2-4012692144-3488378134)" d="M382 763h134" class="connection stroke-B1 s0" mask="url(#d2-4012692144)"/><text x="450" y="769" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-4012692144-3488378134)" d="M190 822v64" class="connection stroke-B1 s0" mask="url(#d2-4012692144)"/><text x="190" y="861" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-4012692144-3488378134)" d="M382 955h134" class="connection stroke-B1 s0" mask="url(#d2-4012692144)"/><text x="450" y="961" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-4012692144-3488378134)" d="M190 1022v64" class="connection stroke-B1 s0" mask="url(#d2-4012692144)"/><text x="190" y="1061" class="text-italic fill-N2 s1">예</text><mask id="d2-4012692144" width="1082" height="1511" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H981v1511H-101z"/><path d="M419 209h62v21h-62zM178 293h24v21h-24zM410 569h81v21h-81zM150 661h81v21h-81zM419 753h62v21h-62zM178 845h24v21h-24zM419 945h62v21h-62zM178 1045h24v21h-24z"/></mask></svg>