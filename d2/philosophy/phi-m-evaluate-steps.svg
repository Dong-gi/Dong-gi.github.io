<svg xmlns="http://www.w3.org/2000/svg" width="2919" height="1478" class="d2-238856155 d2-svg" viewBox="-101 -101 2919 1478"><rect width="2919" height="1478" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-238856155 .fill-N1{fill:#0a0f25}.d2-238856155 .fill-N2{fill:#676c7e}.d2-238856155 .fill-B6{fill:#f7f8fe}.d2-238856155 .stroke-B1,.d2-238856155 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="1294.5" cy="50" class="shape stroke-B1 fill-B6 s0" rx="149.5" ry="50"/></g><text x="1294.5" y="47.5" class="text-bold fill-N1 s1"><tspan x="1294.5" dy="0">재구성을 마친 논증</tspan><tspan x="1294.5" dy="18.5">(P1) … (Pn) / (C)</tspan></text></g><g ><g class="shape"><path d="M1116 200h357v82h-357z" class="stroke-B1 fill-B6 s0"/></g><text x="1294.5" y="238.5" class="text-bold fill-N1 s1"><tspan x="1294.5" dy="0">① 결론과 전제를 제대로 짚었는가</tspan><tspan x="1294.5" dy="18.5">글쓴이가 이 재구성에 동의하겠는가</tspan></text></g><g ><g class="shape"><path d="M695 403h642v82H695z" class="stroke-B1 fill-B6 s0"/></g><text x="1016" y="441.5" class="text-bold fill-N1 s1"><tspan x="1016" dy="0">② 전제 하나하나가 결론과 관련이 있는가</tspan><tspan x="1016" dy="18.5">빼도 결론을 받아들일 이유가 그대로면 그 전제는 일을 하지 않고 있다</tspan></text></g><g ><g class="shape"><path d="M739 585h553v82H739z" class="stroke-B1 fill-B6 s0"/></g><text x="1015.5" y="623.5" class="text-bold fill-N1 s1"><tspan x="1015.5" dy="0">③ 전제가 결론을 얼마나 뒷받침하는가</tspan><tspan x="1015.5" dy="18.5">연역으로 읽으면 타당한가. 귀납으로 읽으면 얼마나 강한가</tspan></text></g><g ><g class="shape"><path d="M479 788h508v82H479z" class="stroke-B1 fill-B6 s0"/></g><text x="733" y="826.5" class="text-bold fill-N1 s1"><tspan x="733" dy="0">④ 전제 하나하나를 받아들일 이유가 있는가</tspan><tspan x="733" dy="18.5">여기서부터는 논리가 아니라 그 분야의 지식이 답한다</tspan></text></g><g ><g class="shape"><path d="M137 991h592v82H137z" class="stroke-B1 fill-B6 s0"/></g><text x="433" y="1029.5" class="text-bold fill-N1 s1"><tspan x="433" dy="0">⑤ 아직 결론을 믿지 않는 사람에게 이유가 되는가</tspan><tspan x="433" dy="18.5">전제를 받아들이려면 이미 결론을 받아들여야 하는 것은 아닌가</tspan></text></g><g ><g class="shape"><path d="M1397 403h354v82h-354z" class="stroke-B2 fill-B6 s2"/></g><text x="1574" y="441.5" class="text-bold fill-N1 s1"><tspan x="1574" dy="0">판정 — 이것은 상대의 논증이 아니다</tspan><tspan x="1574" dy="18.5">다시 읽고 재구성부터 고친다</tspan></text></g><g ><g class="shape"><path d="M1047 788h505v82h-505z" class="stroke-B2 fill-B6 s2"/></g><text x="1299.5" y="826.5" class="text-bold fill-N1 s1"><tspan x="1299.5" dy="0">판정 — 전제가 다 참이어도 결론이 따라 나오지 않는다</tspan><tspan x="1299.5" dy="18.5">반례를 하나 내놓아야 판정이 선다</tspan></text></g><g ><g class="shape"><path d="M789 991h488v82H789z" class="stroke-B2 fill-B6 s2"/></g><text x="1033" y="1029.5" class="text-bold fill-N1 s1"><tspan x="1033" dy="0">판정 — 짜임은 성하고 전제 하나가 의심스럽다</tspan><tspan x="1033" dy="18.5">어느 전제인지 지목하고 왜 의심스러운지 대야 한다</tspan></text></g><g ><g class="shape"><path d="M0 1194h374v82H0z" class="stroke-B2 fill-B6 s2"/></g><text x="187" y="1232.5" class="text-bold fill-N1 s1"><tspan x="187" dy="0">판정 — 타당하지만 이유가 되지 못한다</tspan><tspan x="187" dy="18.5">선결문제 요구가 이 자리에서 걸린다</tspan></text></g><g ><g class="shape"><path d="M434 1194h488v82H434z" class="stroke-B1 fill-B6 s0"/></g><text x="678" y="1232.5" class="text-bold fill-N1 s1"><tspan x="678" dy="0">판정 — 이 논증은 결론을 뒷받침한다</tspan><tspan x="678" dy="18.5">반대하려면 전제 가운데 하나를 새로 공격해야 한다</tspan></text></g><text x="1775.5" y="40" class="fill-N1 s1"><tspan x="1775.5" dy="0">다섯 판정 가운데 어느 것도 ‘상대의 결론은 거짓이다’ 가 아니다.</tspan><tspan x="1775.5" dy="17.667">논증이 나쁘다는 것과 결론이 거짓이라는 것은 다른 주장이고,</tspan><tspan x="1775.5" dy="17.667">앞을 보였다고 뒤가 따라 나오지 않는다</tspan></text><text x="2412" y="48" class="fill-N1 s1"><tspan x="2412" dy="0">순서를 지키면 시간을 아낀다. ③에서 걸리는 논증은 ④를 따질 필요가 없고,</tspan><tspan x="2412" dy="18.5">①에서 걸리는 논증은 나머지 넷을 따져 봐야 헛일이다</tspan></text><marker id="mk-d2-238856155-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-238856155-3488378134)" d="M1294.99 102c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-238856155)"/><path fill="none" marker-end="url(#mk-d2-238856155-3488378134)" d="M1409.627 282.19C1540.55 330.3 1573.75 354.7 1573.75 399.5" class="connection stroke-B1 s0" mask="url(#d2-238856155)"/><text x="1516" y="327" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-238856155-3488378134)" d="M1179.873 282.19C1048.95 330.3 1015.75 354.7 1015.75 399.5" class="connection stroke-B1 s0" mask="url(#d2-238856155)"/><text x="1073" y="327" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-238856155-3488378134)" d="M1015.75 487v94" class="connection stroke-B1 s0" mask="url(#d2-238856155)"/><path fill="none" marker-end="url(#mk-d2-238856155-3488378134)" d="M1131.881 667.179C1265.2 715.3 1299 739.7 1299 784.5" class="connection stroke-B1 s0" mask="url(#d2-238856155)"/><text x="1240.5" y="712" class="text-italic fill-N2 s1">부족하다</text><path fill="none" marker-end="url(#mk-d2-238856155-3488378134)" d="M899.619 667.179C766.3 715.3 732.5 739.7 732.5 784.5" class="connection stroke-B1 s0" mask="url(#d2-238856155)"/><text x="791.5" y="712" class="text-italic fill-N2 s1">충분하다</text><path fill="none" marker-end="url(#mk-d2-238856155-3488378134)" d="M855.393 870.145C996.7 918.3 1032.5 942.7 1032.5 987.5" class="connection stroke-B1 s0" mask="url(#d2-238856155)"/><text x="969" y="914" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-238856155-3488378134)" d="M609.607 870.145C468.299 918.3 432.5 942.7 432.5 987.5" class="connection stroke-B1 s0" mask="url(#d2-238856155)"/><text x="496" y="914" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-238856155-3488378134)" d="M331.155 1073.271C216.2 1121.3 187 1145.7 187 1190.5" class="connection stroke-B1 s0" mask="url(#d2-238856155)"/><text x="235" y="1119" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-238856155-3488378134)" d="M533.845 1073.271C648.8 1121.3 678 1145.7 678 1190.5" class="connection stroke-B1 s0" mask="url(#d2-238856155)"/><text x="630" y="1119" class="text-italic fill-N2 s1">예</text><mask id="d2-238856155" width="2919" height="1478" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2919v1478H-101z"/><path d="M1485 311h62v21h-62zM1061 311h24v21h-24zM1200 696h81v21h-81zM751 696h81v21h-81zM938 898h62v21h-62zM484 898h24v21h-24zM204 1103h62v21h-62zM618 1103h24v21h-24z"/></mask></svg>