<svg xmlns="http://www.w3.org/2000/svg" width="1169" height="1399" class="d2-3753049415 d2-svg" viewBox="-148 -101 1169 1399"><rect width="1169" height="1399" x="-148" y="-101" rx="0" style="fill:#fff"/><style>.d2-3753049415 .text-bold{font-weight:700}.d2-3753049415 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3753049415 .fill-N1{fill:#0a0f25}.d2-3753049415 .fill-N2{fill:#676c7e}.d2-3753049415 .fill-B5{fill:#edf0fd}.d2-3753049415 .fill-B6{fill:#f7f8fe}.d2-3753049415 .stroke-B1,.d2-3753049415 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M132 0h290v98H132z" class="stroke-B1 fill-B6 s0"/></g><text x="277" y="38.5" class="text-bold fill-N1 s1"><tspan x="277" dy="0">입력</tspan><tspan x="277" dy="17.667">조직 손상, 뜨거운 것에 닿음,</tspan><tspan x="277" dy="17.667">몸 어딘가가 눌림</tspan></text></g><g ><g class="shape"><path d="M159 219h235v82H159z" class="stroke-B1 fill-B6" style="stroke-width:4"/></g><text x="276.5" y="257.5" class="text-bold fill-N1 s1"><tspan x="276.5" dy="0">고통</tspan><tspan x="276.5" dy="18.5">이 자리를 차지하는 것</tspan></text></g><g ><g class="shape"><path d="M412 596h191v114H412z" class="stroke-B1 fill-B6 s0"/></g><text x="507.5" y="634.5" class="text-bold fill-N1 s1"><tspan x="507.5" dy="0">출력</tspan><tspan x="507.5" dy="17.25">회피 행동, 신음,</tspan><tspan x="507.5" dy="17.25">‘아프다’ 는 말,</tspan><tspan x="507.5" dy="17.25">다친 곳을 감싸기</tspan></text></g><g ><g class="shape"><path d="M0 438h352v430H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="176" y="471" class="fill-N1" style="text-anchor:middle;font-size:28px">다른 마음 상태들</text></g><text x="234" y="984" class="fill-N1 s1"><tspan x="234" dy="0">정의하는 방식</tspan><tspan x="234" dy="16.357">마음 상태 하나를</tspan><tspan x="234" dy="16.357">따로 정의하지 않는다.</tspan><tspan x="234" dy="16.357">이론 전체를 하나의</tspan><tspan x="234" dy="16.357">긴 문장으로 적고,</tspan><tspan x="234" dy="16.357">마음 상태 이름들을</tspan><tspan x="234" dy="16.357">변항으로 바꾼 뒤</tspan><tspan x="234" dy="16.357">‘이 관계망의 그 자리를</tspan><tspan x="234" dy="16.357">차지하는 것’ 으로</tspan><tspan x="234" dy="16.357">각각을 정의한다.</tspan><tspan x="234" dy="16.357">물리학이 질량과 힘을</tspan><tspan x="234" dy="16.357">법칙들의 묶음 안에서</tspan><tspan x="234" dy="16.357">함께 정의하는 것과</tspan><tspan x="234" dy="16.357">같은 방식이다</tspan></text><g ><g class="shape"><path d="M663 492h257v322H663z" class="stroke-B2 fill-B6 s2"/></g><text x="791.5" y="530.5" class="text-bold fill-N1 s1"><tspan x="791.5" dy="0">실현 — 이 그림이</tspan><tspan x="791.5" dy="16.294">정하지 않는 것</tspan><tspan x="791.5" dy="16.294">이 자리를 무엇이</tspan><tspan x="791.5" dy="16.294">채우는가는</tspan><tspan x="791.5" dy="16.294">정해져 있지 않다.</tspan><tspan x="791.5" dy="16.294">사람의 어떤</tspan><tspan x="791.5" dy="16.294">신경 상태여도 되고,</tspan><tspan x="791.5" dy="16.294">문어의 다른</tspan><tspan x="791.5" dy="16.294">상태여도 되고,</tspan><tspan x="791.5" dy="16.294">신경계가 아닌 것으로</tspan><tspan x="791.5" dy="16.294">이루어진 상태여도 된다.</tspan><tspan x="791.5" dy="16.294">어떤 물리 상태가</tspan><tspan x="791.5" dy="16.294">이 역할을 실제로</tspan><tspan x="791.5" dy="16.294">맡고 있을 때</tspan><tspan x="791.5" dy="16.294">그 물리 상태가</tspan><tspan x="791.5" dy="16.294">이 마음 상태를</tspan><tspan x="791.5" dy="16.294">실현한다고 말한다</tspan></text></g><text x="792" y="992" class="fill-N1 s1"><tspan x="792" dy="0">비유의 한계</tspan><tspan x="792" dy="16.385">같은 프로그램이</tspan><tspan x="792" dy="16.385">다른 기계에서 돌</tspan><tspan x="792" dy="16.385">수 있다는 비유가</tspan><tspan x="792" dy="16.385">자주 쓰인다.</tspan><tspan x="792" dy="16.385">다수 실현을 잡아내는</tspan><tspan x="792" dy="16.385">데는 좋지만</tspan><tspan x="792" dy="16.385">오도할 수 있다 —</tspan><tspan x="792" dy="16.385">역할로 정의된다는 것과</tspan><tspan x="792" dy="16.385">계산으로 정의된다는</tspan><tspan x="792" dy="16.385">것은 다른 주장이고,</tspan><tspan x="792" dy="16.385">뒤엣것은 기능주의의</tspan><tspan x="792" dy="16.385">한 갈래일 뿐이다</tspan></text><g ><g class="shape"><path d="M60 498h232v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="176" y="536.5" class="text-bold fill-N1 s1"><tspan x="176" dy="0">이 상태를 벗어나고</tspan><tspan x="176" dy="18.5">싶다는 욕구</tspan></text></g><g ><g class="shape"><path d="M60 620h232v66H60z" class="stroke-B1 fill-B5 s0"/></g><text x="176" y="658.5" class="text-bold fill-N1 s1">그쪽으로 쏠리는 주의</text></g><g ><g class="shape"><path d="M60 726h232v82H60z" class="stroke-B1 fill-B5 s0"/></g><text x="176" y="764.5" class="text-bold fill-N1 s1"><tspan x="176" dy="0">몸 어딘가가</tspan><tspan x="176" dy="18.5">상했다는 믿음</tspan></text></g><marker id="mk-d2-3753049415-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3753049415-3488378134)" d="M276.75 99.5v115" class="connection stroke-B1 s0" mask="url(#d2-3753049415)"/><text x="276.5" y="164" class="text-italic fill-N2 s1">이 입력에서 생긴다</text><path fill="none" marker-end="url(#mk-d2-3753049415-3488378134)" d="M366.205 301.796C478.7 355.7 507.5 414.9 507.5 592.5" class="connection stroke-B1 s0" mask="url(#d2-3753049415)"/><text x="504.5" y="407" class="text-italic fill-N2 s1"><tspan x="504.5" dy="0">이 출력을</tspan><tspan x="504.5" dy="18.5">내놓는다</tspan></text><path fill="none" marker-end="url(#mk-d2-3753049415-3488378134)" d="M208.709 302.094C123.25 355.7 104.85 383.3 118.24 434.63" class="connection stroke-B1 s0" mask="url(#d2-3753049415)"/><text x="129" y="350" class="text-italic fill-N2 s1"><tspan x="129" dy="0">이 상태들을</tspan><tspan x="129" dy="18.5">낳는다</tspan></text><path fill="none" marker-end="url(#mk-d2-3753049415-3488378134)" d="M253.407 436.611C271.95 383.3 276.75 355.7 276.75 305.5" class="connection stroke-B1 s0" mask="url(#d2-3753049415)"/><text x="274.5" y="369" class="text-italic fill-N2 s1"><tspan x="274.5" dy="0">이 상태들에서</tspan><tspan x="274.5" dy="18.5">되받는다</tspan></text><marker id="mk-d2-3753049415-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3753049415-2177206569)" d="M156.41 300.465C-5.55 355.5-46.75 426.2-46.75 511.25s36.5 428.155 179.05 511.753" class="connection stroke-B2 s2" mask="url(#d2-3753049415)"/><path fill="none" marker-end="url(#mk-d2-3753049415-3488378134)" d="M397.184 285.62C712.05 352.598 791.5 394.1 791.5 488.5" class="connection stroke-B1 s0" mask="url(#d2-3753049415)"/><text x="645.5" y="336" class="text-italic fill-N2 s1"><tspan x="645.5" dy="0">이 자리를</tspan><tspan x="645.5" dy="18.5">채우는 것</tspan></text><path fill="none" marker-end="url(#mk-d2-3753049415-2177206569)" d="M791.5 816v156" class="connection stroke-B2 s2" mask="url(#d2-3753049415)"/><mask id="d2-3753049415" width="1169" height="1399" x="-148" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-148-101h1169v1399H-148z"/><path d="M194 148h165v21H194zM462 391h85v37h-85zM77 334h104v37H77zM213 353h123v37H213zM603 320h85v37h-85z"/></mask></svg>