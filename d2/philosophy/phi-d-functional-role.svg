<svg xmlns="http://www.w3.org/2000/svg" width="3414" height="1099" class="d2-3731332104 d2-svg" viewBox="-101 -101 3414 1099"><rect width="3414" height="1099" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3731332104 .fill-N1{fill:#0a0f25}.d2-3731332104 .fill-N2{fill:#676c7e}.d2-3731332104 .fill-B5{fill:#edf0fd}.d2-3731332104 .fill-B6{fill:#f7f8fe}.d2-3731332104 .stroke-B1,.d2-3731332104 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M0 424h290v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="145" y="462.5" class="text-bold fill-N1 s1"><tspan x="145" dy="0">입력</tspan><tspan x="145" dy="17.667">조직 손상, 뜨거운 것에 닿음,</tspan><tspan x="145" dy="17.667">몸 어딘가가 눌림</tspan></text></g><g ><g class="shape"><path d="M690 432h235v82H690z" class="stroke-B1 fill-B6" style="stroke-width:4"/></g><text x="807.5" y="470.5" class="text-bold fill-N1 s1"><tspan x="807.5" dy="0">고통</tspan><tspan x="807.5" dy="18.5">이 자리를 차지하는 것</tspan></text></g><g ><g class="shape"><path d="M1730 0h320v98h-320z" class="stroke-B1 fill-B6 s0"/></g><text x="1890" y="38.5" class="text-bold fill-N1 s1"><tspan x="1890" dy="0">출력</tspan><tspan x="1890" dy="17.667">회피 행동, 신음, ‘아프다’ 는 말,</tspan><tspan x="1890" dy="17.667">다친 곳을 감싸기</tspan></text></g><g ><g class="shape"><path d="M1701 194h379v378h-379z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1890.5" y="181" class="fill-N1" style="text-anchor:middle;font-size:28px">다른 마음 상태들</text></g><text x="1890.5" y="638" class="fill-N1 s1"><tspan x="1890.5" dy="0">정의하는 방식</tspan><tspan x="1890.5" dy="17.25">마음 상태 하나를 따로 정의하지 않는다. 이론 전체를 하나의 긴 문장으로 적고,</tspan><tspan x="1890.5" dy="17.25">마음 상태 이름들을 변항으로 바꾼 뒤 ‘이 관계망의 그 자리를 차지하는 것’ 으로 각각을 정의한다.</tspan><tspan x="1890.5" dy="17.25">물리학이 질량과 힘을 법칙들의 묶음 안에서 함께 정의하는 것과 같은 방식이다</tspan></text><g ><g class="shape"><path d="M1607 751h566v146h-566z" class="stroke-B2 fill-B6 s2"/></g><text x="1890" y="789.5" class="text-bold fill-N1 s1"><tspan x="1890" dy="0">실현 — 이 그림이 정하지 않는 것</tspan><tspan x="1890" dy="16.833">이 자리를 무엇이 채우는가는 정해져 있지 않다.</tspan><tspan x="1890" dy="16.833">사람의 어떤 신경 상태여도 되고, 문어의 다른 상태여도 되고,</tspan><tspan x="1890" dy="16.833">신경계가 아닌 것으로 이루어진 상태여도 된다.</tspan><tspan x="1890" dy="16.833">어떤 물리 상태가 이 역할을 실제로 맡고 있을 때</tspan><tspan x="1890" dy="16.833">그 물리 상태가 이 마음 상태를 실현한다고 말한다</tspan></text></g><text x="2934" y="798" class="fill-N1 s1"><tspan x="2934" dy="0">비유의 한계</tspan><tspan x="2934" dy="17">같은 프로그램이 다른 기계에서 돌 수 있다는 비유가 자주 쓰인다.</tspan><tspan x="2934" dy="17">다수 실현을 잡아내는 데는 좋지만 오도할 수 있다 —</tspan><tspan x="2934" dy="17">역할로 정의된다는 것과 계산으로 정의된다는 것은 다른 주장이고,</tspan><tspan x="2934" dy="17">뒤엣것은 기능주의의 한 갈래일 뿐이다</tspan></text><g ><g class="shape"><path d="M1731 224h319v66h-319z" class="stroke-B1 fill-B5 s0"/></g><text x="1890.5" y="262.5" class="text-bold fill-N1 s1">이 상태를 벗어나고 싶다는 욕구</text></g><g ><g class="shape"><path d="M1774 350h232v66h-232z" class="stroke-B1 fill-B5 s0"/></g><text x="1890" y="388.5" class="text-bold fill-N1 s1">그쪽으로 쏠리는 주의</text></g><g ><g class="shape"><path d="M1752 476h276v66h-276z" class="stroke-B1 fill-B5 s0"/></g><text x="1890" y="514.5" class="text-bold fill-N1 s1">몸 어딘가가 상했다는 믿음</text></g><marker id="mk-d2-3731332104-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3731332104-3488378134)" d="M292 472.5h393" class="connection stroke-B1 s0" mask="url(#d2-3731332104)"/><text x="490.5" y="478" class="text-italic fill-N2 s1">이 입력에서 생긴다</text><path fill="none" marker-end="url(#mk-d2-3731332104-3488378134)" d="M845.898 429.14C1084.01 125.5 1436.4 49 1726 49" class="connection stroke-B1 s0" mask="url(#d2-3731332104)"/><text x="1213.5" y="103" class="text-italic fill-N2 s1">이 출력을 내놓는다</text><path fill="none" marker-end="url(#mk-d2-3731332104-3488378134)" d="M891.817 430.154C1093.027 329.1 1255.4 303.5 1697 303.5" class="connection stroke-B1 s0" mask="url(#d2-3731332104)"/><text x="1281.5" y="309" class="text-italic fill-N2 s1">이 상태들을 낳는다</text><path fill="none" marker-end="url(#mk-d2-3731332104-3488378134)" d="M1699 472.5H930" class="connection stroke-B1 s0" mask="url(#d2-3731332104)"/><text x="1313.5" y="478" class="text-italic fill-N2 s1">이 상태들에서 되받는다</text><marker id="mk-d2-3731332104-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-3731332104-2177206569)" d="M886.114 515.936C1091.896 628.1 1386.9 656.5 1478.5 656.5" class="connection stroke-B2 s2" mask="url(#d2-3731332104)"/><path fill="none" marker-end="url(#mk-d2-3731332104-3488378134)" d="M848.828 516.664C1084.55 762.1 1411.8 824 1603 824" class="connection stroke-B1 s0" mask="url(#d2-3731332104)"/><text x="1175" y="785" class="text-italic fill-N2 s1">이 자리를 채우는 것</text><path fill="none" marker-end="url(#mk-d2-3731332104-2177206569)" d="M2175 824h477.5" class="connection stroke-B2 s2" mask="url(#d2-3731332104)"/><mask id="d2-3731332104" width="3414" height="1099" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3414V998H-101z"/><path d="M408 462h165v21H408zM1131 87h165v21h-165zM1199 293h165v21h-165zM1212 462h203v21h-203zM1091 769h168v21h-168z"/></mask></svg>