<svg xmlns="http://www.w3.org/2000/svg" width="1586" height="1239" class="d2-2962740905 d2-svg" viewBox="-177 -101 1586 1239"><rect width="1586" height="1239" x="-177" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2962740905 .fill-N1{fill:#0a0f25}.d2-2962740905 .fill-N2{fill:#676c7e}.d2-2962740905 .fill-B5{fill:#edf0fd}.d2-2962740905 .fill-B6{fill:#f7f8fe}.d2-2962740905 .stroke-B1,.d2-2962740905 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><path d="M189 0h290v98H189z" class="stroke-B1 fill-B6 s0"/></g><text x="334" y="38.5" class="text-bold fill-N1 s1"><tspan x="334" dy="0">입력</tspan><tspan x="334" dy="17.667">조직 손상, 뜨거운 것에 닿음,</tspan><tspan x="334" dy="17.667">몸 어딘가가 눌림</tspan></text></g><g ><g class="shape"><path d="M217 219h235v82H217z" class="stroke-B1 fill-B6" style="stroke-width:4"/></g><text x="334.5" y="257.5" class="text-bold fill-N1 s1"><tspan x="334.5" dy="0">고통</tspan><tspan x="334.5" dy="18.5">이 자리를 차지하는 것</tspan></text></g><g ><g class="shape"><path d="M499 572h320v98H499z" class="stroke-B1 fill-B6 s0"/></g><text x="659" y="610.5" class="text-bold fill-N1 s1"><tspan x="659" dy="0">출력</tspan><tspan x="659" dy="17.667">회피 행동, 신음, ‘아프다’ 는 말,</tspan><tspan x="659" dy="17.667">다친 곳을 감싸기</tspan></text></g><g ><g class="shape"><path d="M0 422h439v398H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="219.5" y="455" class="fill-N1" style="text-anchor:middle;font-size:28px">다른 마음 상태들</text></g><text x="309.5" y="936" class="fill-N1 s1"><tspan x="309.5" dy="0">정의하는 방식</tspan><tspan x="309.5" dy="16.714">마음 상태 하나를 따로 정의하지 않는다.</tspan><tspan x="309.5" dy="16.714">이론 전체를 하나의 긴 문장으로 적고,</tspan><tspan x="309.5" dy="16.714">마음 상태 이름들을 변항으로 바꾼 뒤 ‘이 관계망의</tspan><tspan x="309.5" dy="16.714">그 자리를 차지하는 것’ 으로 각각을 정의한다.</tspan><tspan x="309.5" dy="16.714">물리학이 질량과 힘을 법칙들의 묶음 안에서</tspan><tspan x="309.5" dy="16.714">함께 정의하는 것과 같은 방식이다</tspan></text><g ><g class="shape"><path d="M931 508h325v226H931z" class="stroke-B2 fill-B6 s2"/></g><text x="1093.5" y="546.5" class="text-bold fill-N1 s1"><tspan x="1093.5" dy="0">실현 — 이 그림이 정하지 않는 것</tspan><tspan x="1093.5" dy="16.455">이 자리를 무엇이 채우는가는</tspan><tspan x="1093.5" dy="16.455">정해져 있지 않다.</tspan><tspan x="1093.5" dy="16.455">사람의 어떤 신경 상태여도 되고,</tspan><tspan x="1093.5" dy="16.455">문어의 다른 상태여도 되고,</tspan><tspan x="1093.5" dy="16.455">신경계가 아닌 것으로 이루어진</tspan><tspan x="1093.5" dy="16.455">상태여도 된다.</tspan><tspan x="1093.5" dy="16.455">어떤 물리 상태가 이 역할을</tspan><tspan x="1093.5" dy="16.455">실제로 맡고 있을 때</tspan><tspan x="1093.5" dy="16.455">그 물리 상태가 이 마음 상태를</tspan><tspan x="1093.5" dy="16.455">실현한다고 말한다</tspan></text></g><text x="1094" y="936" class="fill-N1 s1"><tspan x="1094" dy="0">비유의 한계</tspan><tspan x="1094" dy="16.714">같은 프로그램이 다른 기계에서 돌</tspan><tspan x="1094" dy="16.714">수 있다는 비유가 자주 쓰인다.</tspan><tspan x="1094" dy="16.714">다수 실현을 잡아내는 데는 좋지만 오도할 수 있다 —</tspan><tspan x="1094" dy="16.714">역할로 정의된다는 것과 계산으로 정의된다는</tspan><tspan x="1094" dy="16.714">것은 다른 주장이고,</tspan><tspan x="1094" dy="16.714">뒤엣것은 기능주의의 한 갈래일 뿐이다</tspan></text><g ><g class="shape"><path d="M60 482h319v66H60z" class="stroke-B1 fill-B5 s0"/></g><text x="219.5" y="520.5" class="text-bold fill-N1 s1">이 상태를 벗어나고 싶다는 욕구</text></g><g ><g class="shape"><path d="M60 588h319v66H60z" class="stroke-B1 fill-B5 s0"/></g><text x="219.5" y="626.5" class="text-bold fill-N1 s1">그쪽으로 쏠리는 주의</text></g><g ><g class="shape"><path d="M60 694h319v66H60z" class="stroke-B1 fill-B5 s0"/></g><text x="219.5" y="732.5" class="text-bold fill-N1 s1">몸 어딘가가 상했다는 믿음</text></g><marker id="mk-d2-2962740905-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2962740905-3488378134)" d="M334.25 99.5v115" class="connection stroke-B1 s0" mask="url(#d2-2962740905)"/><text x="334.5" y="164" class="text-italic fill-N2 s1">이 입력에서 생긴다</text><path fill="none" marker-end="url(#mk-d2-2962740905-3488378134)" d="M454.862 297.399C617.6 348.5 659 403.7 659 568.5" class="connection stroke-B1 s0" mask="url(#d2-2962740905)"/><text x="636.5" y="380" class="text-italic fill-N2 s1">이 출력을 내놓는다</text><path fill="none" marker-end="url(#mk-d2-2962740905-3488378134)" d="M240.77 301.743C136.3 349.3 114.7 373.7 133.932 418.82" class="connection stroke-B1 s0" mask="url(#d2-2962740905)"/><text x="150.5" y="348" class="text-italic fill-N2 s1">이 상태들을 낳는다</text><path fill="none" marker-end="url(#mk-d2-2962740905-3488378134)" d="M308.06 420.671C328.85 373.7 334.25 349.3 334.25 305.5" class="connection stroke-B1 s0" mask="url(#d2-2962740905)"/><text x="331.5" y="369" class="text-italic fill-N2 s1">이 상태들에서 되받는다</text><marker id="mk-d2-2962740905-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2962740905-2177206569)" d="M213.838 289.827C-17.05 347.021-75.5 413.4-75.5 491.25S-40.1 880 97.65 918.913" class="connection stroke-B2 s2" mask="url(#d2-2962740905)"/><path fill="none" marker-end="url(#mk-d2-2962740905-3488378134)" d="M454.473 275.898C965.1 344.3 1093.5 390.9 1093.5 504.5" class="connection stroke-B1 s0" mask="url(#d2-2962740905)"/><text x="834" y="332" class="text-italic fill-N2 s1">이 자리를 채우는 것</text><path fill="none" marker-end="url(#mk-d2-2962740905-2177206569)" d="M1093.5 736v180" class="connection stroke-B2 s2" mask="url(#d2-2962740905)"/><mask id="d2-2962740905" width="1586" height="1239" x="-177" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-177-101h1586v1239H-177z"/><path d="M252 148h165v21H252zM554 364h165v21H554zM68 332h165v21H68zM230 353h203v21H230zM750 316h168v21H750z"/></mask></svg>