<svg xmlns="http://www.w3.org/2000/svg" width="1686" height="1135" class="d2-37262171 d2-svg" viewBox="-101 -101 1686 1135"><rect width="1686" height="1135" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-37262171 .fill-N1{fill:#0a0f25}.d2-37262171 .fill-N2{fill:#676c7e}.d2-37262171 .fill-B6{fill:#f7f8fe}.d2-37262171 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M364 0h524v82H364z" class="stroke-B1 fill-B6 s0"/></g><text x="626" y="38.5" class="text-bold fill-N1 s1"><tspan x="626" dy="0">1. 정당화는 튼튼한데 사실은 거짓인 믿음을 하나 만든다</tspan><tspan x="626" dy="18.5">예 — 동료의 인사 담당자 말과 눈으로 센 동전</tspan></text></g><g ><g class="shape"><path d="M351 182h549v82H351z" class="stroke-B1 fill-B6 s0"/></g><text x="625.5" y="220.5" class="text-bold fill-N1 s1"><tspan x="625.5" dy="0">2. 그 거짓 믿음에서 타당한 추론으로 다른 명제를 끌어낸다</tspan><tspan x="625.5" dy="18.5">타당하므로 정당화가 그대로 옮겨 간다</tspan></text></g><g ><g class="shape"><path d="M359 364h534v82H359z" class="stroke-B1 fill-B6 s0"/></g><text x="626" y="402.5" class="text-bold fill-N1 s1"><tspan x="626" dy="0">3. 끌어낸 명제가 우연히 참이 되도록 세계를 맞춘다</tspan><tspan x="626" dy="18.5">참이 되는 경로는 믿는 사람이 모르는 다른 경로여야 한다</tspan></text></g><g ><g class="shape"><ellipse cx="626" cy="668.5" class="shape stroke-B1 fill-B6 s0" rx="367" ry="122.5"/></g><text x="626" y="674" class="text-bold fill-N1 s1">4. 정당화된 참인 믿음이 완성된다 — 그런데 앎이 아니다</text></g><text x="178.5" y="928" class="fill-N1 s1">1 을 빼면 — 근거가 참이므로 그냥 앎이 된다</text><text x="625.5" y="928" class="fill-N1 s1">3 을 빼면 — 결론도 거짓이므로 그냥 틀린 믿음이다</text><text x="1189" y="928" class="fill-N1 s1">3 에서 참이 되는 경로가 내 근거와 이어져 있으면 — 다시 그냥 앎이 된다</text><text x="1208" y="39" class="fill-N1 s1"><tspan x="1208" dy="0">조리법의 핵심은 ‘정당화가 거짓을 통과할 수 있다’ 는 것이다.</tspan><tspan x="1208" dy="18.5">정당화가 진리를 보증하지 않기 때문에 이 틈이 생긴다</tspan></text><marker id="mk-d2-37262171-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-37262171-3488378134)" d="M625.5 84v94" class="connection stroke-B1 s0" mask="url(#d2-37262171)"/><path fill="none" marker-end="url(#mk-d2-37262171-3488378134)" d="M625.5 266v94" class="connection stroke-B1 s0" mask="url(#d2-37262171)"/><path fill="none" marker-end="url(#mk-d2-37262171-3488378134)" d="M625.5 448c0 38 .1 58 .46 94" class="connection stroke-B1 s0" mask="url(#d2-37262171)"/><path fill="none" marker-end="url(#mk-d2-37262171-3488378134)" d="M391.151 763.763C221.4 833.8 178.5 863.7 178.5 908.5" class="connection stroke-B1 s0" mask="url(#d2-37262171)"/><text x="260.5" y="823" class="text-italic fill-N2 s1">확인</text><path fill="none" marker-end="url(#mk-d2-37262171-3488378134)" d="M625.983 793c-.383 46.4-.483 70.7-.483 115.5" class="connection stroke-B1 s0" mask="url(#d2-37262171)"/><text x="625.5" y="857" class="text-italic fill-N2 s1">확인</text><path fill="none" marker-end="url(#mk-d2-37262171-3488378134)" d="M891.901 754.62C1129.2 832 1189 863.7 1189 908.5" class="connection stroke-B1 s0" mask="url(#d2-37262171)"/><text x="1064.5" y="817" class="text-italic fill-N2 s1">확인</text><mask id="d2-37262171" width="1686" height="1135" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1686v1135H-101z"/><path d="M239 807h43v21h-43zM604 841h43v21h-43zM1043 801h43v21h-43z"/></mask></svg>