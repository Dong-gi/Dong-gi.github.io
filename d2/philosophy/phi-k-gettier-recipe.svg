<svg xmlns="http://www.w3.org/2000/svg" width="844" height="1216" class="d2-3916451669 d2-svg" viewBox="-101 -101 844 1216"><rect width="844" height="1216" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3916451669 .text-bold{font-weight:700}.d2-3916451669 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3916451669 .fill-N1{fill:#0a0f25}.d2-3916451669 .fill-N2{fill:#676c7e}.d2-3916451669 .fill-B6{fill:#f7f8fe}.d2-3916451669 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M112 0h340v114H112z" class="stroke-B1 fill-B6 s0"/></g><text x="282" y="38.5" class="text-bold fill-N1 s1"><tspan x="282" dy="0">1. 정당화는 튼튼한데</tspan><tspan x="282" dy="17.25">사실은 거짓인 믿음을 하나 만든다</tspan><tspan x="282" dy="17.25">예 — 동료의 인사 담당자 말과</tspan><tspan x="282" dy="17.25">눈으로 센 동전</tspan></text></g><g ><g class="shape"><path d="M92 214h380v98H92z" class="stroke-B1 fill-B6 s0"/></g><text x="282" y="252.5" class="text-bold fill-N1 s1"><tspan x="282" dy="0">2. 그 거짓 믿음에서 타당한 추론으로</tspan><tspan x="282" dy="17.667">다른 명제를 끌어낸다</tspan><tspan x="282" dy="17.667">타당하므로 정당화가 그대로 옮겨 간다</tspan></text></g><g ><g class="shape"><path d="M100 412h363v114H100z" class="stroke-B1 fill-B6 s0"/></g><text x="281.5" y="450.5" class="text-bold fill-N1 s1"><tspan x="281.5" dy="0">3. 끌어낸 명제가 우연히 참이 되도록</tspan><tspan x="281.5" dy="17.25">세계를 맞춘다</tspan><tspan x="281.5" dy="17.25">참이 되는 경로는 믿는 사람이 모르는</tspan><tspan x="281.5" dy="17.25">다른 경로여야 한다</tspan></text></g><g ><g class="shape"><ellipse cx="282" cy="704.5" class="shape stroke-B1 fill-B6 s0" rx="236" ry="78.5"/></g><text x="282" y="702" class="text-bold fill-N1 s1"><tspan x="282" dy="0">4. 정당화된 참인 믿음이 완성된다</tspan><tspan x="282" dy="18.5">— 그런데 앎이 아니다</tspan></text></g><text x="70" y="920" class="fill-N1 s1"><tspan x="70" dy="0">1 을 빼면 —</tspan><tspan x="70" dy="17.667">근거가 참이므로</tspan><tspan x="70" dy="17.667">그냥 앎이 된다</tspan></text><text x="281.5" y="920" class="fill-N1 s1"><tspan x="281.5" dy="0">3 을 빼면 —</tspan><tspan x="281.5" dy="17.667">결론도 거짓이므로</tspan><tspan x="281.5" dy="17.667">그냥 틀린 믿음이다</tspan></text><text x="532.5" y="920" class="fill-N1 s1"><tspan x="532.5" dy="0">3 에서 참이 되는 경로가</tspan><tspan x="532.5" dy="17.667">내 근거와 이어져 있으면 —</tspan><tspan x="532.5" dy="17.667">다시 그냥 앎이 된다</tspan></text><text x="321" y="993" class="fill-N1 s1"><tspan x="321" dy="0">조리법의 핵심은 ‘정당화가 거짓을 통과할 수 있다’ 는 것이다.</tspan><tspan x="321" dy="18.5">정당화가 진리를 보증하지 않기 때문에 이 틈이 생긴다</tspan></text><marker id="mk-d2-3916451669-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3916451669-3488378134)" d="M281.5 116v94" class="connection stroke-B1 s0" mask="url(#d2-3916451669)"/><path fill="none" marker-end="url(#mk-d2-3916451669-3488378134)" d="M281.5 314v94" class="connection stroke-B1 s0" mask="url(#d2-3916451669)"/><path fill="none" marker-end="url(#mk-d2-3916451669-3488378134)" d="M281.5 528c0 38 .1 58 .46 94" class="connection stroke-B1 s0" mask="url(#d2-3916451669)"/><path fill="none" marker-end="url(#mk-d2-3916451669-3488378134)" d="M172.337 775.111C90.8 829.6 70 855.7 70 900.5" class="connection stroke-B1 s0" mask="url(#d2-3916451669)"/><text x="98.5" y="830" class="text-italic fill-N2 s1">확인</text><path fill="none" marker-end="url(#mk-d2-3916451669-3488378134)" d="M281.983 785c-.383 46.4-.483 70.7-.483 115.5" class="connection stroke-B1 s0" mask="url(#d2-3916451669)"/><text x="281.5" y="849" class="text-italic fill-N2 s1">확인</text><path fill="none" marker-end="url(#mk-d2-3916451669-3488378134)" d="M405.748 772.972C506.8 829.2 532.5 855.7 532.5 900.5" class="connection stroke-B1 s0" mask="url(#d2-3916451669)"/><text x="492.5" y="827" class="text-italic fill-N2 s1">확인</text><mask id="d2-3916451669" width="844" height="1216" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h844v1216h-844z"/><path d="M77 814h43v21H77zM260 833h43v21h-43zM471 811h43v21h-43z"/></mask></svg>