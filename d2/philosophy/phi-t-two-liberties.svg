<svg xmlns="http://www.w3.org/2000/svg" width="1491" height="1333" class="d2-3715222774 d2-svg" viewBox="-89 -89 1491 1333"><rect width="1491" height="1333" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3715222774 .fill-N1{fill:#0a0f25}.d2-3715222774 .fill-B6{fill:#f7f8fe}.d2-3715222774 .stroke-B1,.d2-3715222774 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M844 234h357v114H844z" class="stroke-B1 fill-B6 s0"/></g><text x="1022.5" y="272.5" class="text-bold fill-N1 s1"><tspan x="1022.5" dy="0">소극적 자유</tspan><tspan x="1022.5" dy="17.25">물음: 나에게 남겨진,</tspan><tspan x="1022.5" dy="17.25">간섭받지 않는 영역은 어디까지인가</tspan><tspan x="1022.5" dy="17.25">답의 형태: 문이 몇 개나 열려 있는가</tspan></text></g><g ><g class="shape"><path d="M246 246h304v98H246z" class="stroke-B1 fill-B6 s0"/></g><text x="398" y="284.5" class="text-bold fill-N1 s1"><tspan x="398" dy="0">적극적 자유</tspan><tspan x="398" dy="17.667">물음: 누가 나를 지배하는가</tspan><tspan x="398" dy="17.667">답의 형태: 내가 나의 주인인가</tspan></text></g><g ><g class="shape"><ellipse cx="751" cy="83" class="shape stroke-B1 fill-B6 s0" rx="213" ry="71"/></g><text x="751" y="72.5" class="text-bold fill-N1 s1"><tspan x="751" dy="0">자유에 대한 두 물음</tspan><tspan x="751" dy="17.667">같은 말이 서로 다른 두 가지를</tspan><tspan x="751" dy="17.667">묻는 데 쓰인다</tspan></text></g><g ><g class="shape"><path d="M1025 428h276v130h-276z" class="stroke-B1 fill-B6 s0"/></g><text x="1163" y="466.5" class="text-bold fill-N1 s1"><tspan x="1163" dy="0">정상적인 쓰임</tspan><tspan x="1163" dy="17">법이 금지하지 않는 것,</tspan><tspan x="1163" dy="17">남이 막지 않는 것.</tspan><tspan x="1163" dy="17">노예를 자유롭게 하는 것은</tspan><tspan x="1163" dy="17">사슬을 푸는 일이다</tspan></text></g><g ><g class="shape"><path d="M12 428h292v130H12z" class="stroke-B1 fill-B6 s0"/></g><text x="158" y="466.5" class="text-bold fill-N1 s1"><tspan x="158" dy="0">정상적인 쓰임</tspan><tspan x="158" dy="17">중독 · 무지 · 세뇌에서 벗어나</tspan><tspan x="158" dy="17">자기 이유로 사는 것.</tspan><tspan x="158" dy="17">민주 시민으로서</tspan><tspan x="158" dy="17">스스로 다스리는 것</tspan></text></g><g ><g class="shape"><path d="M175 644h446v162H175z" class="stroke-B1 fill-B6 s0"/></g><text x="398" y="682.5" class="text-bold fill-N1 s1"><tspan x="398" dy="0">미끄러지는 갈래 — 여기가 벌린이 경계한 곳</tspan><tspan x="398" dy="16.714">① 자아를 둘로 쪼갠다: 지금 원하는 낮은 자아와</tspan><tspan x="398" dy="16.714"> 진짜로 원해야 할 높은 자아</tspan><tspan x="398" dy="16.714">② 진짜 자아가 원하는 것을</tspan><tspan x="398" dy="16.714"> 그 사람의 참된 뜻이라 부른다</tspan><tspan x="398" dy="16.714">③ 그러면 그가 거부하는 일을 강제하는 것이</tspan><tspan x="398" dy="16.714"> 그를 자유롭게 하는 일이 된다</tspan></text></g><g ><g class="shape"><path d="M198 876h400v114H198z" class="stroke-B2 fill-B6 s2"/></g><text x="398" y="914.5" class="text-bold fill-N1 s1"><tspan x="398" dy="0">루소의 문구가 그 자리다</tspan><tspan x="398" dy="17.25">‘자유롭도록 강제된다’.</tspan><tspan x="398" dy="17.25">벌린은 이 논법이 억압을</tspan><tspan x="398" dy="17.25">자유의 이름으로 부르게 만든다고 보았다</tspan></text></g><text x="656.5" y="1058" class="fill-N1 s1"><tspan x="656.5" dy="0">흔한 오독 — 세 가지</tspan><tspan x="656.5" dy="16.833">㉠ 벌린이 적극적 자유를 부정했다 → 아니다. 두 개념 다 진짜 인간적 가치라고 적었다</tspan><tspan x="656.5" dy="16.833">㉡ 소극적 자유만 옹호하면 시장 자유방임이 따라 나온다 → 아니다.</tspan><tspan x="656.5" dy="16.833"> 벌린 자신이 굶주린 사람에게 열린 문은 값이 거의 없다고 적었다</tspan><tspan x="656.5" dy="16.833">㉢ 자유가 최고의 가치다 → 아니다. 벌린은 가치가 여럿이고 서로 충돌한다고 보았다.</tspan><tspan x="656.5" dy="16.833"> 자유를 늘리려고 평등이나 안전을 내주어야 할 때가 있다는 것이 그의 논지다</tspan></text><g ><g class="shape"><path d="M637 428h368v146H637z" class="stroke-B1 fill-B6 s0"/></g><text x="821" y="466.5" class="text-bold fill-N1 s1"><tspan x="821" dy="0">매캘럼의 되받기</tspan><tspan x="821" dy="16.833">자유는 언제나 세 자리를 채운 관계다.</tspan><tspan x="821" dy="16.833">행위자 x 가 제약 y 로부터</tspan><tspan x="821" dy="16.833">자유로워 z 를 한다.</tspan><tspan x="821" dy="16.833">두 ‘개념’ 이 아니라</tspan><tspan x="821" dy="16.833">같은 도식의 다른 채우기일 뿐이다</tspan></text></g><g ><g class="shape"><path d="M641 652h361v146H641z" class="stroke-B2 fill-B6 s2"/></g><text x="821.5" y="690.5" class="text-bold fill-N1 s1"><tspan x="821.5" dy="0">그래도 남는 실질 차이</tspan><tspan x="821.5" dy="16.833">무엇을 제약 y 로 셀 것인가.</tspan><tspan x="821.5" dy="16.833">남의 방해만 세는가,</tspan><tspan x="821.5" dy="16.833">가난 · 무지 · 내면의 강박까지 세는가.</tspan><tspan x="821.5" dy="16.833">이 물음은 도식으로 정리해도</tspan><tspan x="821.5" dy="16.833">그대로 남는다</tspan></text></g><g ><g class="shape"><path d="M661 876h321v146H661z" class="stroke-B2 fill-B6 s2"/></g><text x="821.5" y="914.5" class="text-bold fill-N1 s1"><tspan x="821.5" dy="0">셋째 후보 — 비지배로서의 자유</tspan><tspan x="821.5" dy="16.833">페팃이 되살린 공화주의의 개념.</tspan><tspan x="821.5" dy="16.833">간섭이 없어도 남의 자의적 뜻에</tspan><tspan x="821.5" dy="16.833">매여 있으면 자유롭지 않다.</tspan><tspan x="821.5" dy="16.833">친절한 주인 밑의 노예는</tspan><tspan x="821.5" dy="16.833">간섭받지 않지만 자유롭지 않다</tspan></text></g><marker id="mk-d2-3715222774-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3715222774-3488378134)" d="M822 152v32s0 10 10 10h181.166s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3715222774)"/><path fill="none" marker-end="url(#mk-d2-3715222774-3488378134)" d="M680 152v32s0 10-10 10H408s-10 0-10 10v38" class="connection stroke-B1 s0" mask="url(#d2-3715222774)"/><path fill="none" marker-end="url(#mk-d2-3715222774-3488378134)" d="M1163.5 350v74" class="connection stroke-B1 s0" mask="url(#d2-3715222774)"/><path fill="none" marker-end="url(#mk-d2-3715222774-3488378134)" d="M322 346v32s0 10-10 10H168s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3715222774)"/><path fill="none" marker-end="url(#mk-d2-3715222774-3488378134)" d="M398 346v294" class="connection stroke-B1 s0" mask="url(#d2-3715222774)"/><text x="398" y="500" style="fill:#676c7e;text-anchor:middle;font-size:16px">이 길로 갈 수 있다</text><path fill="none" marker-end="url(#mk-d2-3715222774-3488378134)" d="M398 808v64" class="connection stroke-B1 s0" mask="url(#d2-3715222774)"/><path fill="none" marker-end="url(#mk-d2-3715222774-3488378134)" d="M882.833 350v74" class="connection stroke-B1 s0" mask="url(#d2-3715222774)"/><path fill="none" marker-end="url(#mk-d2-3715222774-3488378134)" d="M474 346v32s0 10 10 10h266.166s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3715222774)"/><path fill="none" marker-end="url(#mk-d2-3715222774-3488378134)" d="M821.5 576v72" class="connection stroke-B1 s0" mask="url(#d2-3715222774)"/><path fill="none" marker-end="url(#mk-d2-3715222774-3488378134)" d="M821.5 800v72" class="connection stroke-B1 s0" mask="url(#d2-3715222774)"/><mask id="d2-3715222774" width="1491" height="1333" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1491v1333H-89z"/><path d="M322 484h152v21H322z"/></mask></svg>