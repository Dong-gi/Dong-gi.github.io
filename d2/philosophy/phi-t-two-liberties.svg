<svg xmlns="http://www.w3.org/2000/svg" width="1189" height="1605" class="d2-1744629379 d2-svg" viewBox="-89 -89 1189 1605"><rect width="1189" height="1605" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1744629379 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1744629379 .fill-N1{fill:#0a0f25}.d2-1744629379 .fill-B6{fill:#f7f8fe}.d2-1744629379 .stroke-B1,.d2-1744629379 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M649 234h232v162H649z" class="stroke-B1 fill-B6 s0"/></g><text x="765" y="272.5" class="text-bold fill-N1 s1"><tspan x="765" dy="0">소극적 자유</tspan><tspan x="765" dy="16.714">물음: 나에게 남겨진,</tspan><tspan x="765" dy="16.714">간섭받지 않는 영역은</tspan><tspan x="765" dy="16.714">어디까지인가</tspan><tspan x="765" dy="16.714">답의 형태:</tspan><tspan x="765" dy="16.714">문이 몇 개나</tspan><tspan x="765" dy="16.714">열려 있는가</tspan></text></g><g ><g class="shape"><path d="M162 270h280v114H162z" class="stroke-B1 fill-B6 s0"/></g><text x="302" y="308.5" class="text-bold fill-N1 s1"><tspan x="302" dy="0">적극적 자유</tspan><tspan x="302" dy="17.25">물음: 누가 나를 지배하는가</tspan><tspan x="302" dy="17.25">답의 형태:</tspan><tspan x="302" dy="17.25">내가 나의 주인인가</tspan></text></g><g ><g class="shape"><ellipse cx="570" cy="83" class="shape stroke-B1 fill-B6 s0" rx="213" ry="71"/></g><text x="570" y="72.5" class="text-bold fill-N1 s1"><tspan x="570" dy="0">자유에 대한 두 물음</tspan><tspan x="570" dy="17.667">같은 말이 서로 다른 두 가지를</tspan><tspan x="570" dy="17.667">묻는 데 쓰인다</tspan></text></g><g ><g class="shape"><path d="M758 476h241v146H758z" class="stroke-B1 fill-B6 s0"/></g><text x="878.5" y="514.5" class="text-bold fill-N1 s1"><tspan x="878.5" dy="0">정상적인 쓰임</tspan><tspan x="878.5" dy="16.833">법이 금지하지 않는 것,</tspan><tspan x="878.5" dy="16.833">남이 막지 않는 것.</tspan><tspan x="878.5" dy="16.833">노예를 자유롭게</tspan><tspan x="878.5" dy="16.833">하는 것은</tspan><tspan x="878.5" dy="16.833">사슬을 푸는 일이다</tspan></text></g><g ><g class="shape"><path d="M12 476h228v146H12z" class="stroke-B1 fill-B6 s0"/></g><text x="126" y="514.5" class="text-bold fill-N1 s1"><tspan x="126" dy="0">정상적인 쓰임</tspan><tspan x="126" dy="16.833">중독 · 무지 · 세뇌에서</tspan><tspan x="126" dy="16.833">벗어나</tspan><tspan x="126" dy="16.833">자기 이유로 사는 것.</tspan><tspan x="126" dy="16.833">민주 시민으로서</tspan><tspan x="126" dy="16.833">스스로 다스리는 것</tspan></text></g><g ><g class="shape"><path d="M152 724h299v210H152z" class="stroke-B1 fill-B6 s0"/></g><text x="301.5" y="762.5" class="text-bold fill-N1 s1"><tspan x="301.5" dy="0">미끄러지는 갈래 —</tspan><tspan x="301.5" dy="16.5">여기가 벌린이 경계한 곳</tspan><tspan x="301.5" dy="16.5">① 자아를 둘로 쪼갠다:</tspan><tspan x="301.5" dy="16.5"> 지금 원하는 낮은 자아와</tspan><tspan x="301.5" dy="16.5"> 진짜로 원해야 할 높은 자아</tspan><tspan x="301.5" dy="16.5">② 진짜 자아가 원하는 것을</tspan><tspan x="301.5" dy="16.5"> 그 사람의 참된 뜻이라 부른다</tspan><tspan x="301.5" dy="16.5">③ 그러면 그가 거부하는 일을</tspan><tspan x="301.5" dy="16.5"> 강제하는 것이</tspan><tspan x="301.5" dy="16.5"> 그를 자유롭게 하는 일이 된다</tspan></text></g><g ><g class="shape"><path d="M174 1004h256v130H174z" class="stroke-B2 fill-B6 s2"/></g><text x="302" y="1042.5" class="text-bold fill-N1 s1"><tspan x="302" dy="0">루소의 문구가 그 자리다</tspan><tspan x="302" dy="17">‘자유롭도록 강제된다’.</tspan><tspan x="302" dy="17">벌린은 이 논법이 억압을</tspan><tspan x="302" dy="17">자유의 이름으로</tspan><tspan x="302" dy="17">부르게 만든다고 보았다</tspan></text></g><text x="505.5" y="1250" class="fill-N1 s1"><tspan x="505.5" dy="0">흔한 오독 — 세 가지</tspan><tspan x="505.5" dy="16.455">㉠ 벌린이 적극적 자유를 부정했다 → 아니다.</tspan><tspan x="505.5" dy="16.455"> 두 개념 다 진짜 인간적 가치라고 적었다</tspan><tspan x="505.5" dy="16.455">㉡ 소극적 자유만 옹호하면</tspan><tspan x="505.5" dy="16.455"> 시장 자유방임이 따라 나온다 → 아니다.</tspan><tspan x="505.5" dy="16.455"> 벌린 자신이 굶주린 사람에게 열린 문은</tspan><tspan x="505.5" dy="16.455"> 값이 거의 없다고 적었다</tspan><tspan x="505.5" dy="16.455">㉢ 자유가 최고의 가치다 → 아니다.</tspan><tspan x="505.5" dy="16.455"> 벌린은 가치가 여럿이고 서로 충돌한다고 보았다.</tspan><tspan x="505.5" dy="16.455"> 자유를 늘리려고 평등이나 안전을 내주어야 할</tspan><tspan x="505.5" dy="16.455"> 때가 있다는 것이 그의 논지다</tspan></text><g ><g class="shape"><path d="M480 476h258v178H480z" class="stroke-B1 fill-B6 s0"/></g><text x="609" y="514.5" class="text-bold fill-N1 s1"><tspan x="609" dy="0">매캘럼의 되받기</tspan><tspan x="609" dy="16.625">자유는 언제나</tspan><tspan x="609" dy="16.625">세 자리를 채운 관계다.</tspan><tspan x="609" dy="16.625">행위자 x 가 제약 y 로부터</tspan><tspan x="609" dy="16.625">자유로워 z 를 한다.</tspan><tspan x="609" dy="16.625">두 ‘개념’ 이 아니라</tspan><tspan x="609" dy="16.625">같은 도식의</tspan><tspan x="609" dy="16.625">다른 채우기일 뿐이다</tspan></text></g><g ><g class="shape"><path d="M471 748h275v162H471z" class="stroke-B2 fill-B6 s2"/></g><text x="608.5" y="786.5" class="text-bold fill-N1 s1"><tspan x="608.5" dy="0">그래도 남는 실질 차이</tspan><tspan x="608.5" dy="16.714">무엇을 제약 y 로 셀 것인가.</tspan><tspan x="608.5" dy="16.714">남의 방해만 세는가,</tspan><tspan x="608.5" dy="16.714">가난 · 무지 ·</tspan><tspan x="608.5" dy="16.714">내면의 강박까지 세는가.</tspan><tspan x="608.5" dy="16.714">이 물음은 도식으로</tspan><tspan x="608.5" dy="16.714">정리해도 그대로 남는다</tspan></text></g><g ><g class="shape"><path d="M468 1004h281v210H468z" class="stroke-B2 fill-B6 s2"/></g><text x="608.5" y="1042.5" class="text-bold fill-N1 s1"><tspan x="608.5" dy="0">셋째 후보 —</tspan><tspan x="608.5" dy="16.5">비지배로서의 자유</tspan><tspan x="608.5" dy="16.5">페팃이 되살린</tspan><tspan x="608.5" dy="16.5">공화주의의 개념.</tspan><tspan x="608.5" dy="16.5">간섭이 없어도</tspan><tspan x="608.5" dy="16.5">남의 자의적 뜻에</tspan><tspan x="608.5" dy="16.5">매여 있으면 자유롭지 않다.</tspan><tspan x="608.5" dy="16.5">친절한 주인 밑의 노예는</tspan><tspan x="608.5" dy="16.5">간섭받지 않지만</tspan><tspan x="608.5" dy="16.5">자유롭지 않다</tspan></text></g><marker id="mk-d2-1744629379-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1744629379-3488378134)" d="m765.004 114 .238 116" class="connection stroke-B1 s0" mask="url(#d2-1744629379)"/><path fill="none" marker-end="url(#mk-d2-1744629379-3488378134)" d="m499.996 152-.06 32s-.02 10-10.02 10H312s-10 0-10 10v62" class="connection stroke-B1 s0" mask="url(#d2-1744629379)"/><path fill="none" marker-end="url(#mk-d2-1744629379-3488378134)" d="M803.916 398v74" class="connection stroke-B1 s0" mask="url(#d2-1744629379)"/><path fill="none" marker-end="url(#mk-d2-1744629379-3488378134)" d="M232 386v40s0 10-10 10h-86s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-1744629379)"/><path fill="none" marker-end="url(#mk-d2-1744629379-3488378134)" d="M302 386v334" class="connection stroke-B1 s0" mask="url(#d2-1744629379)"/><text x="302" y="552" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px"><tspan x="302" dy="0">이 길로</tspan><tspan x="302" dy="18.5">갈 수 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-1744629379-3488378134)" d="M302 936v64" class="connection stroke-B1 s0" mask="url(#d2-1744629379)"/><path fill="none" marker-end="url(#mk-d2-1744629379-3488378134)" d="M726.583 398v28s0 10-10 10H662s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-1744629379)"/><path fill="none" marker-end="url(#mk-d2-1744629379-3488378134)" d="M372 386v40s0 10 10 10h174s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-1744629379)"/><path fill="none" marker-end="url(#mk-d2-1744629379-3488378134)" d="M609 656v88" class="connection stroke-B1 s0" mask="url(#d2-1744629379)"/><path fill="none" marker-end="url(#mk-d2-1744629379-3488378134)" d="M609 912v88" class="connection stroke-B1 s0" mask="url(#d2-1744629379)"/><mask id="d2-1744629379" width="1189" height="1605" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1189v1605H-89z"/><path d="M258 536h88v37h-88z"/></mask></svg>