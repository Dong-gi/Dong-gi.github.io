<svg xmlns="http://www.w3.org/2000/svg" width="2435" height="1299" class="d2-2769052793 d2-svg" viewBox="-101 -101 2435 1299"><rect width="2435" height="1299" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2769052793 .fill-N1{fill:#0a0f25}.d2-2769052793 .fill-B6{fill:#f7f8fe}.d2-2769052793 .stroke-B1,.d2-2769052793 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 304h538v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="269" y="342.5" class="text-bold fill-N1 s1"><tspan x="269" dy="0">소극적 자유</tspan><tspan x="269" dy="17.667">물음: 나에게 남겨진, 간섭받지 않는 영역은 어디까지인가</tspan><tspan x="269" dy="17.667">답의 형태: 문이 몇 개나 열려 있는가</tspan></text></g><g ><g class="shape"><path d="M1134 304h304v98h-304z" class="stroke-B1 fill-B6 s0"/></g><text x="1286" y="342.5" class="text-bold fill-N1 s1"><tspan x="1286" dy="0">적극적 자유</tspan><tspan x="1286" dy="17.667">물음: 누가 나를 지배하는가</tspan><tspan x="1286" dy="17.667">답의 형태: 내가 나의 주인인가</tspan></text></g><g ><g class="shape"><ellipse cx="777.5" cy="102" class="shape stroke-B1 fill-B6 s0" rx="306.5" ry="102"/></g><text x="777.5" y="99.5" class="text-bold fill-N1 s1"><tspan x="777.5" dy="0">자유에 대한 두 물음</tspan><tspan x="777.5" dy="18.5">같은 말이 서로 다른 두 가지를 묻는 데 쓰인다</tspan></text></g><g ><g class="shape"><path d="M15 547h447v98H15z" class="stroke-B1 fill-B6 s0"/></g><text x="238.5" y="585.5" class="text-bold fill-N1 s1"><tspan x="238.5" dy="0">정상적인 쓰임</tspan><tspan x="238.5" dy="17.667">법이 금지하지 않는 것, 남이 막지 않는 것.</tspan><tspan x="238.5" dy="17.667">노예를 자유롭게 하는 것은 사슬을 푸는 일이다</tspan></text></g><g ><g class="shape"><path d="M522 547h471v98H522z" class="stroke-B1 fill-B6 s0"/></g><text x="757.5" y="585.5" class="text-bold fill-N1 s1"><tspan x="757.5" dy="0">정상적인 쓰임</tspan><tspan x="757.5" dy="17.667">중독 · 무지 · 세뇌에서 벗어나 자기 이유로 사는 것.</tspan><tspan x="757.5" dy="17.667">민주 시민으로서 스스로 다스리는 것</tspan></text></g><g ><g class="shape"><path d="M1053 523h528v146h-528z" class="stroke-B1 fill-B6 s0"/></g><text x="1317" y="561.5" class="text-bold fill-N1 s1"><tspan x="1317" dy="0">미끄러지는 갈래 — 여기가 벌린이 경계한 곳</tspan><tspan x="1317" dy="16.833">① 자아를 둘로 쪼갠다: 지금 원하는 낮은 자아와</tspan><tspan x="1317" dy="16.833"> 진짜로 원해야 할 높은 자아</tspan><tspan x="1317" dy="16.833">② 진짜 자아가 원하는 것을 그 사람의 참된 뜻이라 부른다</tspan><tspan x="1317" dy="16.833">③ 그러면 그가 거부하는 일을 강제하는 것이</tspan><tspan x="1317" dy="16.833"> 그를 자유롭게 하는 일이 된다</tspan></text></g><g ><g class="shape"><path d="M1009 777h615v98h-615z" class="stroke-B2 fill-B6 s2"/></g><text x="1316.5" y="815.5" class="text-bold fill-N1 s1"><tspan x="1316.5" dy="0">루소의 문구가 그 자리다</tspan><tspan x="1316.5" dy="17.667">‘자유롭도록 강제된다’.</tspan><tspan x="1316.5" dy="17.667">벌린은 이 논법이 억압을 자유의 이름으로 부르게 만든다고 보았다</tspan></text></g><text x="1495.5" y="68" class="fill-N1 s1"><tspan x="1495.5" dy="0">흔한 오독 — 세 가지</tspan><tspan x="1495.5" dy="16.833">㉠ 벌린이 적극적 자유를 부정했다 → 아니다. 두 개념 다 진짜 인간적 가치라고 적었다</tspan><tspan x="1495.5" dy="16.833">㉡ 소극적 자유만 옹호하면 시장 자유방임이 따라 나온다 → 아니다.</tspan><tspan x="1495.5" dy="16.833"> 벌린 자신이 굶주린 사람에게 열린 문은 값이 거의 없다고 적었다</tspan><tspan x="1495.5" dy="16.833">㉢ 자유가 최고의 가치다 → 아니다. 벌린은 가치가 여럿이고 서로 충돌한다고 보았다.</tspan><tspan x="1495.5" dy="16.833"> 자유를 늘리려고 평등이나 안전을 내주어야 할 때가 있다는 것이 그의 논지다</tspan></text><g ><g class="shape"><path d="M1695 539h516v114h-516z" class="stroke-B1 fill-B6 s0"/></g><text x="1953" y="577.5" class="text-bold fill-N1 s1"><tspan x="1953" dy="0">매캘럼의 되받기</tspan><tspan x="1953" dy="17.25">자유는 언제나 세 자리를 채운 관계다.</tspan><tspan x="1953" dy="17.25">행위자 x 가 제약 y 로부터 자유로워 z 를 한다.</tspan><tspan x="1953" dy="17.25">두 ‘개념’ 이 아니라 같은 도식의 다른 채우기일 뿐이다</tspan></text></g><g ><g class="shape"><path d="M1684 769h537v114h-537z" class="stroke-B2 fill-B6 s2"/></g><text x="1952.5" y="807.5" class="text-bold fill-N1 s1"><tspan x="1952.5" dy="0">그래도 남는 실질 차이</tspan><tspan x="1952.5" dy="17.25">무엇을 제약 y 로 셀 것인가.</tspan><tspan x="1952.5" dy="17.25">남의 방해만 세는가, 가난 · 무지 · 내면의 강박까지 세는가.</tspan><tspan x="1952.5" dy="17.25">이 물음은 도식으로 정리해도 그대로 남는다</tspan></text></g><g ><g class="shape"><path d="M1673 983h560v114h-560z" class="stroke-B2 fill-B6 s2"/></g><text x="1953" y="1021.5" class="text-bold fill-N1 s1"><tspan x="1953" dy="0">셋째 후보 — 비지배로서의 자유</tspan><tspan x="1953" dy="17.25">페팃이 되살린 공화주의의 개념.</tspan><tspan x="1953" dy="17.25">간섭이 없어도 남의 자의적 뜻에 매여 있으면 자유롭지 않다.</tspan><tspan x="1953" dy="17.25">친절한 주인 밑의 노예는 간섭받지 않지만 자유롭지 않다</tspan></text></g><marker id="mk-d2-2769052793-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2769052793-3488378134)" d="M547.084 170.575C325 237.2 269 264 269 300" class="connection stroke-B1 s0" mask="url(#d2-2769052793)"/><path fill="none" marker-end="url(#mk-d2-2769052793-3488378134)" d="M1006.918 171.567C1229.4 237.4 1285.5 264 1285.5 300" class="connection stroke-B1 s0" mask="url(#d2-2769052793)"/><path fill="none" marker-end="url(#mk-d2-2769052793-3488378134)" d="M254.463 403.427C241.4 450.3 238 479.5 238 543.5" class="connection stroke-B1 s0" mask="url(#d2-2769052793)"/><path fill="none" marker-end="url(#mk-d2-2769052793-3488378134)" d="M1131.542 384.898C832.3 446.898 757 479.5 757 543.5" class="connection stroke-B1 s0" mask="url(#d2-2769052793)"/><path fill="none" marker-end="url(#mk-d2-2769052793-3488378134)" d="M1300.037 403.427C1313.1 450.3 1316.5 474.7 1316.5 519.5" class="connection stroke-B1 s0" mask="url(#d2-2769052793)"/><text x="1315" y="467" style="fill:#676c7e;text-anchor:middle;font-size:16px">이 길로 갈 수 있다</text><path fill="none" marker-end="url(#mk-d2-2769052793-3488378134)" d="M1316.5 671v102" class="connection stroke-B1 s0" mask="url(#d2-2769052793)"/><path fill="none" marker-end="url(#mk-d2-2769052793-3488378134)" d="M539.494 373.655C1452.7 444.7 1712.3 477.9 1831.922 537.711" class="connection stroke-B1 s0" mask="url(#d2-2769052793)"/><path fill="none" marker-end="url(#mk-d2-2769052793-3488378134)" d="M1440.474 377.904C1857.7 445.516 1961.3 477.9 1956.811 535.512" class="connection stroke-B1 s0" mask="url(#d2-2769052793)"/><path fill="none" marker-end="url(#mk-d2-2769052793-3488378134)" d="M1952.5 655v110" class="connection stroke-B1 s0" mask="url(#d2-2769052793)"/><path fill="none" marker-end="url(#mk-d2-2769052793-3488378134)" d="M1952.5 885v94" class="connection stroke-B1 s0" mask="url(#d2-2769052793)"/><mask id="d2-2769052793" width="2435" height="1299" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2435v1299H-101z"/><path d="M1239 451h152v21h-152z"/></mask></svg>