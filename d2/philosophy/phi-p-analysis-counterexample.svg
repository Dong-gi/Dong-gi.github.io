<svg xmlns="http://www.w3.org/2000/svg" width="1115" height="1317" class="d2-2067539541 d2-svg" viewBox="-89 -89 1115 1317"><rect width="1115" height="1317" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2067539541 .text-bold{font-weight:700}.d2-2067539541 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2067539541 .fill-N1{fill:#0a0f25}.d2-2067539541 .fill-N2{fill:#676c7e}.d2-2067539541 .fill-B4{fill:#e3e9fd}.d2-2067539541 .fill-B5{fill:#edf0fd}.d2-2067539541 .stroke-B1,.d2-2067539541 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="444" cy="92.5" class="shape stroke-B1" rx="242" ry="80.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="444" y="90" class="text-bold fill-N1 s0"><tspan x="444" dy="0">3장의 분석 고리</tspan><tspan x="444" dy="18.5">분석안 → 반례 → 수선 → 다시 분석안</tspan></text></g><g ><g class="shape"><path d="M12 352h419v570H12z" class="stroke-B1 fill-B4 s1"/></g><text x="221.5" y="385" class="text-bold fill-N1 s2">5장 — ‘안다’ 를 분석한다</text></g><g ><g class="shape"><path d="M451 344h432v586H451z" class="stroke-B1 fill-B4 s1"/></g><text x="667" y="377" class="text-bold fill-N1 s2">11장 — ‘원인’ 을 분석한다</text></g><text x="287" y="1026" class="fill-N1 s0"><tspan x="287" dy="0">두 갈래의 칸이 하나하나 대응한다.</tspan><tspan x="287" dy="17.25">다른 것은 반례가 오는 방향뿐이다 —</tspan><tspan x="287" dy="17.25">게티어 사례는 조건을 다 갖추고도 아닌 경우고,</tspan><tspan x="287" dy="17.25">선점은 맞는데 조건을 못 갖춘 경우다</tspan></text><text x="739" y="1026" class="fill-N1 s0"><tspan x="739" dy="0">3장이 적어 둔 세 번째 길 —</tspan><tspan x="739" dy="16.714">분석 자체를 포기하는 길 — 도</tspan><tspan x="739" dy="16.714">여기서 실제로 쓰인다.</tspan><tspan x="739" dy="16.714">인과를 더 단순한 것으로 분석되지 않는</tspan><tspan x="739" dy="16.714">원초적 개념으로 두는 입장이 그것이다.</tspan><tspan x="739" dy="16.714">값은 설명력이다.</tspan><tspan x="739" dy="16.714">인과가 무엇인지를 더는 말해 주지 않게 된다</tspan></text><g ><g class="shape"><path d="M160 402h212v82H160z" class="stroke-B1 fill-B5 s1"/></g><text x="266" y="440.5" class="text-bold fill-N1 s0"><tspan x="266" dy="0">분석안</tspan><tspan x="266" dy="18.5">정당화된 참인 믿음</tspan></text></g><g ><g class="shape"><path d="M70 564h235v114H70z" class="stroke-B1 fill-B5 s1"/></g><text x="187.5" y="602.5" class="text-bold fill-N1 s0"><tspan x="187.5" dy="0">반례</tspan><tspan x="187.5" dy="17.25">게티어 사례 —</tspan><tspan x="187.5" dy="17.25">조건 셋을 다 갖췄는데</tspan><tspan x="187.5" dy="17.25">안다고 하기 어렵다</tspan></text></g><g ><g class="shape"><path d="M167 758h198v114H167z" class="stroke-B1 fill-B5 s1"/></g><text x="266" y="796.5" class="text-bold fill-N1 s0"><tspan x="266" dy="0">수선</tspan><tspan x="266" dy="17.25">무효화 요인 없음,</tspan><tspan x="266" dy="17.25">인과 조건,</tspan><tspan x="266" dy="17.25">신빙성 조건 …</tspan></text></g><g ><g class="shape"><path d="M595 394h204v98H595z" class="stroke-B1 fill-B5 s1"/></g><text x="697" y="432.5" class="text-bold fill-N1 s0"><tspan x="697" dy="0">분석안</tspan><tspan x="697" dy="17.667">c 가 없었다면</tspan><tspan x="697" dy="17.667">e 도 없었을 것이다</tspan></text></g><g ><g class="shape"><path d="M516 572h215v114H516z" class="stroke-B1 fill-B5 s1"/></g><text x="623.5" y="610.5" class="text-bold fill-N1 s0"><tspan x="623.5" dy="0">반례</tspan><tspan x="623.5" dy="17.25">선점과 과잉결정 —</tspan><tspan x="623.5" dy="17.25">원인인데</tspan><tspan x="623.5" dy="17.25">그 조건을 못 갖춘다</tspan></text></g><g ><g class="shape"><path d="M576 766h241v114H576z" class="stroke-B1 fill-B5 s1"/></g><text x="696.5" y="804.5" class="text-bold fill-N1 s0"><tspan x="696.5" dy="0">수선</tspan><tspan x="696.5" dy="17.25">의존의 사슬,</tspan><tspan x="696.5" dy="17.25">사건을 더 잘게 나누기,</tspan><tspan x="696.5" dy="17.25">개입으로 다시 적기 …</tspan></text></g><marker id="mk-d2-2067539541-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2067539541-3488378134)" d="M188 486v74" class="connection stroke-B1 s1" mask="url(#d2-2067539541)"/><path fill="none" marker-end="url(#mk-d2-2067539541-3488378134)" d="M233.5 680v74" class="connection stroke-B1 s1" mask="url(#d2-2067539541)"/><path fill="none" marker-end="url(#mk-d2-2067539541-3488378134)" d="M345 756V488" class="connection stroke-B1 s1" mask="url(#d2-2067539541)"/><text x="345.5" y="627" class="text-italic fill-N2 s0">다시</text><path fill="none" marker-end="url(#mk-d2-2067539541-3488378134)" d="M623.75 494v74" class="connection stroke-B1 s1" mask="url(#d2-2067539541)"/><path fill="none" marker-end="url(#mk-d2-2067539541-3488378134)" d="M657.083 688v74" class="connection stroke-B1 s1" mask="url(#d2-2067539541)"/><path fill="none" marker-end="url(#mk-d2-2067539541-3488378134)" d="M770.75 764V496" class="connection stroke-B1 s1" mask="url(#d2-2067539541)"/><text x="770.5" y="635" class="text-italic fill-N2 s0">다시</text><path fill="none" marker-end="url(#mk-d2-2067539541-3488378134)" d="m221.996 126-.487 222" class="connection stroke-B1 s1" mask="url(#d2-2067539541)"/><text x="222" y="244" class="text-italic fill-N2 s0">한 번</text><path fill="none" marker-end="url(#mk-d2-2067539541-3488378134)" d="M667 126v214" class="connection stroke-B1 s1" mask="url(#d2-2067539541)"/><text x="667.5" y="240" class="text-italic fill-N2 s0">또 한 번</text><marker id="mk-d2-2067539541-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2067539541-2177206569)" d="M221.5 924v82" class="connection stroke-B2 s4" mask="url(#d2-2067539541)"/><path fill="none" marker-end="url(#mk-d2-2067539541-2177206569)" d="M595 932v28s0 10-10 10H363.5s-10 0-10 10v26" class="connection stroke-B2 s4" mask="url(#d2-2067539541)"/><path fill="none" marker-end="url(#mk-d2-2067539541-2177206569)" d="M739 932v74" class="connection stroke-B2 s4" mask="url(#d2-2067539541)"/><mask id="d2-2067539541" width="1115" height="1317" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1115v1317H-89z"/><path d="M324 611h43v21h-43zM749 619h43v21h-43zM199 228h46v21h-46zM633 224h69v21h-69z"/></mask></svg>