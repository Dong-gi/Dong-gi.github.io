<svg xmlns="http://www.w3.org/2000/svg" width="2507" height="999" class="d2-2911425105 d2-svg" viewBox="-101 -85 2507 999"><rect width="2507" height="999" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2911425105 .fill-N1{fill:#0a0f25}.d2-2911425105 .fill-N2{fill:#676c7e}.d2-2911425105 .fill-B4{fill:#e3e9fd}.d2-2911425105 .fill-B5{fill:#edf0fd}.d2-2911425105 .stroke-B1,.d2-2911425105 .stroke-B2{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}.s2{text-anchor:middle;font-size:28px}.s3{fill:#0d32b2}.s4{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="242" cy="438.5" class="shape stroke-B1" rx="242" ry="80.5" style="fill:#f7f8fe;stroke-width:2"/></g><text x="242" y="436" class="text-bold fill-N1 s0"><tspan x="242" dy="0">3장의 분석 고리</tspan><tspan x="242" dy="18.5">분석안 → 반례 → 수선 → 다시 분석안</tspan></text></g><g ><g class="shape"><path d="M732 56h1393v219H732z" class="stroke-B1 fill-B4 s1"/></g><text x="1428.5" y="43" class="text-bold fill-N1 s2">5장 — ‘안다’ 를 분석한다</text></g><g ><g class="shape"><path d="M677 585h1480v228H677z" class="stroke-B1 fill-B4 s1"/></g><text x="1417" y="572" class="text-bold fill-N1 s2">11장 — ‘원인’ 을 분석한다</text></g><text x="1950.5" y="355" class="fill-N1 s0"><tspan x="1950.5" dy="0">두 줄의 칸이 하나하나 대응한다. 다른 것은 반례가 오는 방향뿐이다 —</tspan><tspan x="1950.5" dy="18.5">게티어 사례는 조건을 다 갖추고도 아닌 경우고, 선점은 맞는데 조건을 못 갖춘 경우다</tspan></text><text x="1950.5" y="452" class="fill-N1 s0"><tspan x="1950.5" dy="0">3장이 적어 둔 세 번째 길 — 분석 자체를 포기하는 길 — 도 여기서 실제로 쓰인다.</tspan><tspan x="1950.5" dy="17.667">인과를 더 단순한 것으로 분석되지 않는 원초적 개념으로 두는 입장이 그것이다.</tspan><tspan x="1950.5" dy="17.667">값은 설명력이다. 인과가 무엇인지를 더는 말해 주지 않게 된다</tspan></text><g ><g class="shape"><path d="M762 144h212v82H762z" class="stroke-B1 fill-B5 s1"/></g><text x="868" y="182.5" class="text-bold fill-N1 s0"><tspan x="868" dy="0">분석안</tspan><tspan x="868" dy="18.5">정당화된 참인 믿음</tspan></text></g><g ><g class="shape"><path d="M1134 86h357v98h-357z" class="stroke-B1 fill-B5 s1"/></g><text x="1312.5" y="124.5" class="text-bold fill-N1 s0"><tspan x="1312.5" dy="0">반례</tspan><tspan x="1312.5" dy="17.667">게티어 사례 — 조건 셋을 다 갖췄는데</tspan><tspan x="1312.5" dy="17.667">안다고 하기 어렵다</tspan></text></g><g ><g class="shape"><path d="M1805 136h290v98h-290z" class="stroke-B1 fill-B5 s1"/></g><text x="1950" y="174.5" class="text-bold fill-N1 s0"><tspan x="1950" dy="0">수선</tspan><tspan x="1950" dy="17.667">무효화 요인 없음, 인과 조건,</tspan><tspan x="1950" dy="17.667">신빙성 조건 …</tspan></text></g><g ><g class="shape"><path d="M707 673h322v82H707z" class="stroke-B1 fill-B5 s1"/></g><text x="868" y="711.5" class="text-bold fill-N1 s0"><tspan x="868" dy="0">분석안</tspan><tspan x="868" dy="18.5">c 가 없었다면 e 도 없었을 것이다</tspan></text></g><g ><g class="shape"><path d="M1169 615h287v98h-287z" class="stroke-B1 fill-B5 s1"/></g><text x="1312.5" y="653.5" class="text-bold fill-N1 s0"><tspan x="1312.5" dy="0">반례</tspan><tspan x="1312.5" dy="17.667">선점과 과잉결정 — 원인인데</tspan><tspan x="1312.5" dy="17.667">그 조건을 못 갖춘다</tspan></text></g><g ><g class="shape"><path d="M1773 685h354v98h-354z" class="stroke-B1 fill-B5 s1"/></g><text x="1950" y="723.5" class="text-bold fill-N1 s0"><tspan x="1950" dy="0">수선</tspan><tspan x="1950" dy="17.667">의존의 사슬, 사건을 더 잘게 나누기,</tspan><tspan x="1950" dy="17.667">개입으로 다시 적기 …</tspan></text></g><marker id="mk-d2-2911425105-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2911425105-3488378134)" d="M976.447 159.591C1059.7 140.01 1091.5 135 1129.5 135" class="connection stroke-B1 s1" mask="url(#d2-2911425105)"/><path fill="none" marker-end="url(#mk-d2-2911425105-3488378134)" d="M1493.5 135c39.2 0 101.9 6.4 307.53 31.515" class="connection stroke-B1 s1" mask="url(#d2-2911425105)"/><path fill="none" marker-end="url(#mk-d2-2911425105-3488378134)" d="M1803.015 202.742C1595.4 228.1 1496.8 234.5 1427.5 234.5s-367.9-5-449.605-24.09" class="connection stroke-B1 s1" mask="url(#d2-2911425105)"/><text x="1389.5" y="240" class="text-italic fill-N2 s0">다시</text><path fill="none" marker-end="url(#mk-d2-2911425105-3488378134)" d="M1031.446 675.77C1070.7 666.447 1098.5 664 1164.5 664" class="connection stroke-B1 s1" mask="url(#d2-2911425105)"/><path fill="none" marker-end="url(#mk-d2-2911425105-3488378134)" d="M1458.482 683.21c67.218 8.979 130.518 15.69 310.536 32.91" class="connection stroke-B1 s1" mask="url(#d2-2911425105)"/><path fill="none" marker-end="url(#mk-d2-2911425105-3488378134)" d="M1771.005 746.647C1589 760.1 1496.8 763.5 1427.5 763.5s-356.9-2.4-394.602-11.1" class="connection stroke-B1 s1" mask="url(#d2-2911425105)"/><text x="1400.5" y="769" class="text-italic fill-N2 s0">다시</text><path fill="none" marker-end="url(#mk-d2-2911425105-3488378134)" d="M338.58 363.773C522.6 220.799 601.6 184.75 728 184.75" class="connection stroke-B1 s1" mask="url(#d2-2911425105)"/><text x="516" y="232" class="text-italic fill-N2 s0">한 번</text><path fill="none" marker-end="url(#mk-d2-2911425105-3488378134)" d="M349.474 512.352C524.8 673.2 590.6 713.75 673 713.75" class="connection stroke-B1 s1" mask="url(#d2-2911425105)"/><text x="496.5" y="653" class="text-italic fill-N2 s0">또 한 번</text><marker id="mk-d2-2911425105-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2911425105-2177206569)" d="m1720.852 276.255 151.444 61.735" class="connection stroke-B2 s4" mask="url(#d2-2911425105)"/><path fill="none" marker-end="url(#mk-d2-2911425105-2177206569)" d="m1628.617 583.323 282.15-205.468" class="connection stroke-B2 s4" mask="url(#d2-2911425105)"/><path fill="none" marker-end="url(#mk-d2-2911425105-2177206569)" d="m1777.476 583.65 100.572-91.95" class="connection stroke-B2 s4" mask="url(#d2-2911425105)"/><mask id="d2-2911425105" width="2507" height="999" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h2507v999H-101z"/><path d="M1368 224h43v21h-43zM1379 753h43v21h-43zM493 216h46v21h-46zM462 637h69v21h-69z"/></mask></svg>