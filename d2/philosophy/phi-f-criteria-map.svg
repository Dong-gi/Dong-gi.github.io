<svg xmlns="http://www.w3.org/2000/svg" width="3056" height="774" class="d2-3271091783 d2-svg" viewBox="-101 -101 3056 774"><rect width="3056" height="774" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3271091783 .fill-N1{fill:#0a0f25}.d2-3271091783 .fill-N2{fill:#676c7e}.d2-3271091783 .fill-B6{fill:#f7f8fe}.d2-3271091783 .stroke-B1,.d2-3271091783 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="351" cy="286.5" class="shape stroke-B1 fill-B6 s0" rx="211" ry="70.5"/></g><text x="351" y="276" class="text-bold fill-N1 s1"><tspan x="351" dy="0">지금의 내가 과거의 그 사람과</tspan><tspan x="351" dy="17.667">같은 사람이라는 것은</tspan><tspan x="351" dy="17.667">무엇이 성립한다는 말인가</tspan></text></g><g ><g class="shape"><path d="M922 87h340v82H922z" class="stroke-B1 fill-B6 s0"/></g><text x="1092" y="125.5" class="text-bold fill-N1 s1"><tspan x="1092" dy="0">신체 기준</tspan><tspan x="1092" dy="18.5">같은 몸이 이어지면 같은 사람이다</tspan></text></g><g ><g class="shape"><path d="M1689 0h366v98h-366z" class="stroke-B1 fill-B6 s0"/></g><text x="1872" y="38.5" class="text-bold fill-N1 s1"><tspan x="1872" dy="0">동물주의</tspan><tspan x="1872" dy="17.667">사람은 하나의 동물이고,</tspan><tspan x="1872" dy="17.667">동물이 살아 있는 동안 그 사람이 있다</tspan></text></g><g ><g class="shape"><path d="M933 395h319v98H933z" class="stroke-B1 fill-B6 s0"/></g><text x="1092.5" y="433.5" class="text-bold fill-N1 s1"><tspan x="1092.5" dy="0">기억 기준 — 로크</tspan><tspan x="1092.5" dy="17.667">과거의 그 일을 안에서 기억하면</tspan><tspan x="1092.5" dy="17.667">그 사람이 나다</tspan></text></g><g ><g class="shape"><path d="M1711 316h322v98h-322z" class="stroke-B1 fill-B6 s0"/></g><text x="1872" y="354.5" class="text-bold fill-N1 s1"><tspan x="1872" dy="0">심리 연속성 기준</tspan><tspan x="1872" dy="17.667">기억·의도·성격이 겹치는 사슬로</tspan><tspan x="1872" dy="17.667">이어지면 같은 사람이다</tspan></text></g><g ><g class="shape"><path d="M1662 158h420v98h-420z" class="stroke-B2 fill-B6 s2"/></g><text x="1872" y="196.5" class="text-bold fill-N1 s1"><tspan x="1872" dy="0">왕자와 구두장이</tspan><tspan x="1872" dy="17.667">기억이 통째로 옮겨 가면</tspan><tspan x="1872" dy="17.667">우리는 사람이 따라갔다고 말하고 싶어진다</tspan></text></g><g ><g class="shape"><path d="M2399 0h455v98h-455z" class="stroke-B2 fill-B6 s2"/></g><text x="2626.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="2626.5" dy="0">생각하는 동물 논증</tspan><tspan x="2626.5" dy="17.667">내 의자에는 사람도 앉아 있고 동물도 앉아 있다.</tspan><tspan x="2626.5" dy="17.667">둘이 다른 것이라면 생각하는 것이 둘인가</tspan></text></g><g ><g class="shape"><path d="M1722 474h301v98h-301z" class="stroke-B2 fill-B6 s2"/></g><text x="1872.5" y="512.5" class="text-bold fill-N1 s1"><tspan x="1872.5" dy="0">순환 반론 — 버틀러</tspan><tspan x="1872.5" dy="17.667">‘내가 겪은 일을 기억한다’ 가</tspan><tspan x="1872.5" dy="17.667">이미 동일성을 쓰고 있다</tspan></text></g><g ><g class="shape"><path d="M2412 316h429v98h-429z" class="stroke-B2 fill-B6 s2"/></g><text x="2626.5" y="354.5" class="text-bold fill-N1 s1"><tspan x="2626.5" dy="0">분열</tspan><tspan x="2626.5" dy="17.667">같은 관계가 두 사람에게 한꺼번에 성립한다.</tspan><tspan x="2626.5" dy="17.667">동일성은 하나에 하나만 성립한다</tspan></text></g><text x="351" y="433" class="fill-N1 s1"><tspan x="351" dy="0">오른쪽 위의 생각하는 동물 논증은 동물주의가 심리 쪽 기준을 되받아치는 논증이다.</tspan><tspan x="351" dy="17.667">분열 사례가 심리 연속성 기준 하나를 흔든다면, 이 논증은 심리 쪽 전체를 흔든다.</tspan><tspan x="351" dy="17.667">소수설이라고 해서 약한 것이 아니다</tspan></text><marker id="mk-d2-3271091783-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3271091783-3488378134)" d="M499.891 235.35C749.2 149.6 834 128 918 128" class="connection stroke-B1 s0" mask="url(#d2-3271091783)"/><path fill="none" marker-end="url(#mk-d2-3271091783-3488378134)" d="M499.893 337.645C749.2 422.6 836.1 444 928.5 444" class="connection stroke-B1 s0" mask="url(#d2-3271091783)"/><path fill="none" marker-end="url(#mk-d2-3271091783-3488378134)" d="M1263.955 91.58C1422 57.6 1507.4 49 1685 49" class="connection stroke-B1 s0" mask="url(#d2-3271091783)"/><text x="1473.5" y="58" class="text-italic fill-N2 s1">다듬으면</text><path fill="none" marker-end="url(#mk-d2-3271091783-3488378134)" d="M1254.456 409.524C1420.1 373.988 1511.8 365 1707 365" class="connection stroke-B1 s0" mask="url(#d2-3271091783)"/><text x="1480" y="374" class="text-italic fill-N2 s1">순환과 연쇄를 고치면</text><path fill="none" marker-end="url(#mk-d2-3271091783-3488378134)" d="M1263.955 164.42C1422 198.4 1502 207 1658 207" class="connection stroke-B1 s0" mask="url(#d2-3271091783)"/><text x="1460" y="208" class="text-italic fill-N2 s1">흔든다</text><path fill="none" marker-end="url(#mk-d2-3271091783-3488378134)" d="M2056.5 49h339" class="connection stroke-B1 s0" mask="url(#d2-3271091783)"/><text x="2227.5" y="55" class="text-italic fill-N2 s1">되받아친다</text><path fill="none" marker-end="url(#mk-d2-3271091783-3488378134)" d="M1254.456 478.475C1420.1 514.01 1513.9 523 1717.5 523" class="connection stroke-B1 s0" mask="url(#d2-3271091783)"/><text x="1485" y="526" class="text-italic fill-N2 s1">흔든다</text><path fill="none" marker-end="url(#mk-d2-3271091783-3488378134)" d="M2034.5 365h374" class="connection stroke-B1 s0" mask="url(#d2-3271091783)"/><text x="2223" y="371" class="text-italic fill-N2 s1">흔든다</text><mask id="d2-3271091783" width="3056" height="774" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3056v774H-101z"/><path d="M1433 42h81v21h-81zM1388 358h184v21h-184zM1429 192h62v21h-62zM2177 39h101v21h-101zM1454 510h62v21h-62zM2192 355h62v21h-62z"/></mask></svg>