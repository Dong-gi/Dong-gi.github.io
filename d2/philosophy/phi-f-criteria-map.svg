<svg xmlns="http://www.w3.org/2000/svg" width="1705" height="1196" class="d2-2316882174 d2-svg" viewBox="-101 -101 1705 1196"><rect width="1705" height="1196" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2316882174 .text-bold{font-weight:700}.d2-2316882174 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2316882174 .fill-N1{fill:#0a0f25}.d2-2316882174 .fill-N2{fill:#676c7e}.d2-2316882174 .fill-B6{fill:#f7f8fe}.d2-2316882174 .stroke-B1,.d2-2316882174 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="826" cy="70.5" class="shape stroke-B1 fill-B6 s0" rx="211" ry="70.5"/></g><text x="826" y="60" class="text-bold fill-N1 s1"><tspan x="826" dy="0">지금의 내가 과거의 그 사람과</tspan><tspan x="826" dy="17.667">같은 사람이라는 것은</tspan><tspan x="826" dy="17.667">무엇이 성립한다는 말인가</tspan></text></g><g ><g class="shape"><path d="M292 249h340v82H292z" class="stroke-B1 fill-B6 s0"/></g><text x="462" y="287.5" class="text-bold fill-N1 s1"><tspan x="462" dy="0">신체 기준</tspan><tspan x="462" dy="18.5">같은 몸이 이어지면 같은 사람이다</tspan></text></g><g ><g class="shape"><path d="M170 460h258v114H170z" class="stroke-B1 fill-B6 s0"/></g><text x="299" y="498.5" class="text-bold fill-N1 s1"><tspan x="299" dy="0">동물주의</tspan><tspan x="299" dy="17.25">사람은 하나의 동물이고,</tspan><tspan x="299" dy="17.25">동물이 살아 있는 동안</tspan><tspan x="299" dy="17.25">그 사람이 있다</tspan></text></g><g ><g class="shape"><path d="M1007 241h319v98h-319z" class="stroke-B1 fill-B6 s0"/></g><text x="1166.5" y="279.5" class="text-bold fill-N1 s1"><tspan x="1166.5" dy="0">기억 기준 — 로크</tspan><tspan x="1166.5" dy="17.667">과거의 그 일을 안에서 기억하면</tspan><tspan x="1166.5" dy="17.667">그 사람이 나다</tspan></text></g><g ><g class="shape"><path d="M820 468h322v98H820z" class="stroke-B1 fill-B6 s0"/></g><text x="981" y="506.5" class="text-bold fill-N1 s1"><tspan x="981" dy="0">심리 연속성 기준</tspan><tspan x="981" dy="17.667">기억·의도·성격이 겹치는 사슬로</tspan><tspan x="981" dy="17.667">이어지면 같은 사람이다</tspan></text></g><g ><g class="shape"><path d="M488 460h272v114H488z" class="stroke-B2 fill-B6 s2"/></g><text x="624" y="498.5" class="text-bold fill-N1 s1"><tspan x="624" dy="0">왕자와 구두장이</tspan><tspan x="624" dy="17.25">기억이 통째로 옮겨 가면</tspan><tspan x="624" dy="17.25">우리는 사람이 따라갔다고</tspan><tspan x="624" dy="17.25">말하고 싶어진다</tspan></text></g><g ><g class="shape"><path d="M150 695h299v130H150z" class="stroke-B2 fill-B6 s2"/></g><text x="299.5" y="733.5" class="text-bold fill-N1 s1"><tspan x="299.5" dy="0">생각하는 동물 논증</tspan><tspan x="299.5" dy="17">내 의자에는 사람도 앉아 있고</tspan><tspan x="299.5" dy="17">동물도 앉아 있다.</tspan><tspan x="299.5" dy="17">둘이 다른 것이라면 생각하는</tspan><tspan x="299.5" dy="17">것이 둘인가</tspan></text></g><g ><g class="shape"><path d="M1202 468h301v98h-301z" class="stroke-B2 fill-B6 s2"/></g><text x="1352.5" y="506.5" class="text-bold fill-N1 s1"><tspan x="1352.5" dy="0">순환 반론 — 버틀러</tspan><tspan x="1352.5" dy="17.667">‘내가 겪은 일을 기억한다’ 가</tspan><tspan x="1352.5" dy="17.667">이미 동일성을 쓰고 있다</tspan></text></g><g ><g class="shape"><path d="M813 703h336v114H813z" class="stroke-B2 fill-B6 s2"/></g><text x="981" y="741.5" class="text-bold fill-N1 s1"><tspan x="981" dy="0">분열</tspan><tspan x="981" dy="17.25">같은 관계가 두 사람에게</tspan><tspan x="981" dy="17.25">한꺼번에 성립한다.</tspan><tspan x="981" dy="17.25">동일성은 하나에 하나만 성립한다</tspan></text></g><text x="299" y="941" class="fill-N1 s1"><tspan x="299" dy="0">생각하는 동물 논증은 동물주의가 심리 쪽 기준을 되받아치는 논증이다.</tspan><tspan x="299" dy="17.25">분열 사례가 심리 연속성 기준 하나를 흔든다면,</tspan><tspan x="299" dy="17.25">이 논증은 심리 쪽 전체를 흔든다.</tspan><tspan x="299" dy="17.25">소수설이라고 해서 약한 것이 아니다</tspan></text><marker id="mk-d2-2316882174-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2316882174-3488378134)" d="M674.101 120.628C504.4 176.8 461.5 202.6 461.5 245" class="connection stroke-B1 s0" mask="url(#d2-2316882174)"/><path fill="none" marker-end="url(#mk-d2-2316882174-3488378134)" d="M972.886 122.665C1127.6 177.2 1166.75 201 1166.75 237" class="connection stroke-B1 s0" mask="url(#d2-2316882174)"/><path fill="none" marker-end="url(#mk-d2-2316882174-3488378134)" d="M399.343 331.62C319.4 385.7 299 411.7 299 456.5" class="connection stroke-B1 s0" mask="url(#d2-2316882174)"/><text x="326.5" y="387" class="text-italic fill-N2 s1">다듬으면</text><path fill="none" marker-end="url(#mk-d2-2316882174-3488378134)" d="M1082.28 339.52C1001.6 387.3 981 413.3 981 464.5" class="connection stroke-B1 s0" mask="url(#d2-2316882174)"/><text x="1005" y="391" class="text-italic fill-N2 s1">순환과 연쇄를 고치면</text><path fill="none" marker-end="url(#mk-d2-2316882174-3488378134)" d="M523.657 331.62C603.6 385.7 624 411.7 624 456.5" class="connection stroke-B1 s0" mask="url(#d2-2316882174)"/><text x="597" y="387" class="text-italic fill-N2 s1">흔든다</text><path fill="none" marker-end="url(#mk-d2-2316882174-3488378134)" d="M299 575.5v116" class="connection stroke-B1 s0" mask="url(#d2-2316882174)"/><text x="299.5" y="640" class="text-italic fill-N2 s1">되받아친다</text><path fill="none" marker-end="url(#mk-d2-2316882174-3488378134)" d="M1251.22 339.52c80.68 47.78 101.28 73.78 101.28 124.98" class="connection stroke-B1 s0" mask="url(#d2-2316882174)"/><text x="1329" y="391" class="text-italic fill-N2 s1">흔든다</text><path fill="none" marker-end="url(#mk-d2-2316882174-3488378134)" d="M981 567.5v132" class="connection stroke-B1 s0" mask="url(#d2-2316882174)"/><text x="981" y="640" class="text-italic fill-N2 s1">흔든다</text><mask id="d2-2316882174" width="1705" height="1196" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1705v1196H-101z"/><path d="M286 371h81v21h-81zM913 375h184v21H913zM566 371h62v21h-62zM249 624h101v21H249zM1298 375h62v21h-62zM950 624h62v21h-62z"/></mask></svg>