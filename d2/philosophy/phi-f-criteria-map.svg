<svg xmlns="http://www.w3.org/2000/svg" width="1166" height="1348" class="d2-3396326794 d2-svg" viewBox="-89 -89 1166 1348"><rect width="1166" height="1348" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3396326794 .text-bold{font-weight:700}.d2-3396326794 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3396326794 .fill-N1{fill:#0a0f25}.d2-3396326794 .fill-N2{fill:#676c7e}.d2-3396326794 .fill-B6{fill:#f7f8fe}.d2-3396326794 .stroke-B1,.d2-3396326794 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="543" cy="82.5" class="shape stroke-B1 fill-B6 s0" rx="211" ry="70.5"/></g><text x="543" y="72" class="text-bold fill-N1 s1"><tspan x="543" dy="0">지금의 내가 과거의 그 사람과</tspan><tspan x="543" dy="17.667">같은 사람이라는 것은</tspan><tspan x="543" dy="17.667">무엇이 성립한다는 말인가</tspan></text></g><g ><g class="shape"><path d="M219 243h212v98H219z" class="stroke-B1 fill-B6 s0"/></g><text x="325" y="281.5" class="text-bold fill-N1 s1"><tspan x="325" dy="0">신체 기준</tspan><tspan x="325" dy="17.667">같은 몸이 이어지면</tspan><tspan x="325" dy="17.667">같은 사람이다</tspan></text></g><g ><g class="shape"><path d="M92 542h235v130H92z" class="stroke-B1 fill-B6 s0"/></g><text x="209.5" y="580.5" class="text-bold fill-N1 s1"><tspan x="209.5" dy="0">동물주의</tspan><tspan x="209.5" dy="17">사람은 하나의</tspan><tspan x="209.5" dy="17">동물이고,</tspan><tspan x="209.5" dy="17">동물이 살아 있는 동안</tspan><tspan x="209.5" dy="17">그 사람이 있다</tspan></text></g><g ><g class="shape"><path d="M669 233h188v114H669z" class="stroke-B1 fill-B6 s0"/></g><text x="763" y="271.5" class="text-bold fill-N1 s1"><tspan x="763" dy="0">기억 기준 — 로크</tspan><tspan x="763" dy="17.25">과거의 그 일을</tspan><tspan x="763" dy="17.25">안에서 기억하면</tspan><tspan x="763" dy="17.25">그 사람이 나다</tspan></text></g><g ><g class="shape"><path d="M555 542h195v130H555z" class="stroke-B1 fill-B6 s0"/></g><text x="652.5" y="580.5" class="text-bold fill-N1 s1"><tspan x="652.5" dy="0">심리 연속성 기준</tspan><tspan x="652.5" dy="17">기억·의도·성격이</tspan><tspan x="652.5" dy="17">겹치는 사슬로</tspan><tspan x="652.5" dy="17">이어지면</tspan><tspan x="652.5" dy="17">같은 사람이다</tspan></text></g><g ><g class="shape"><path d="M347 534h188v146H347z" class="stroke-B2 fill-B6 s2"/></g><text x="441" y="572.5" class="text-bold fill-N1 s1"><tspan x="441" dy="0">왕자와 구두장이</tspan><tspan x="441" dy="16.833">기억이 통째로</tspan><tspan x="441" dy="16.833">옮겨 가면</tspan><tspan x="441" dy="16.833">우리는 사람이</tspan><tspan x="441" dy="16.833">따라갔다고</tspan><tspan x="441" dy="16.833">말하고 싶어진다</tspan></text></g><g ><g class="shape"><path d="M104 841h212v162H104z" class="stroke-B2 fill-B6 s2"/></g><text x="210" y="879.5" class="text-bold fill-N1 s1"><tspan x="210" dy="0">생각하는 동물 논증</tspan><tspan x="210" dy="16.714">내 의자에는</tspan><tspan x="210" dy="16.714">사람도 앉아 있고</tspan><tspan x="210" dy="16.714">동물도 앉아 있다.</tspan><tspan x="210" dy="16.714">둘이 다른 것이라면</tspan><tspan x="210" dy="16.714">생각하는</tspan><tspan x="210" dy="16.714">것이 둘인가</tspan></text></g><g ><g class="shape"><path d="M770 534h206v130H770z" class="stroke-B2 fill-B6 s2"/></g><text x="873" y="572.5" class="text-bold fill-N1 s1"><tspan x="873" dy="0">순환 반론 — 버틀러</tspan><tspan x="873" dy="17">‘내가 겪은 일을</tspan><tspan x="873" dy="17">기억한다’ 가</tspan><tspan x="873" dy="17">이미 동일성을</tspan><tspan x="873" dy="17">쓰고 있다</tspan></text></g><g ><g class="shape"><path d="M546 841h214v146H546z" class="stroke-B2 fill-B6 s2"/></g><text x="653" y="879.5" class="text-bold fill-N1 s1"><tspan x="653" dy="0">분열</tspan><tspan x="653" dy="16.833">같은 관계가</tspan><tspan x="653" dy="16.833">두 사람에게</tspan><tspan x="653" dy="16.833">한꺼번에 성립한다.</tspan><tspan x="653" dy="16.833">동일성은 하나에</tspan><tspan x="653" dy="16.833">하나만 성립한다</tspan></text></g><text x="210" y="1089" class="fill-N1 s1"><tspan x="210" dy="0">생각하는 동물 논증은 동물주의가</tspan><tspan x="210" dy="17">심리 쪽 기준을 되받아치는 논증이다.</tspan><tspan x="210" dy="17">분열 사례가 심리 연속성 기준 하나를 흔든다면,</tspan><tspan x="210" dy="17">이 논증은 심리 쪽 전체를 흔든다.</tspan><tspan x="210" dy="17">소수설이라고 해서 약한 것이 아니다</tspan></text><marker id="mk-d2-3396326794-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3396326794-3488378134)" d="m473.019 151 .302 32s.095 10-9.905 10H335.75s-10 0-10 10v37" class="connection stroke-B1 s0" mask="url(#d2-3396326794)"/><path fill="none" marker-end="url(#mk-d2-3396326794-3488378134)" d="m614.004 151 .06 32s.019 10 10.019 10H753.25s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3396326794)"/><path fill="none" marker-end="url(#mk-d2-3396326794-3488378134)" d="M290.416 344v194" class="connection stroke-B1 s0" mask="url(#d2-3396326794)"/><text x="290.5" y="448" class="text-italic fill-N2 s1">다듬으면</text><path fill="none" marker-end="url(#mk-d2-3396326794-3488378134)" d="M731.916 349v28s0 10-10 10H663s-10 0-10 10v141" class="connection stroke-B1 s0" mask="url(#d2-3396326794)"/><text x="653.5" y="403" class="text-italic fill-N2 s1"><tspan x="653.5" dy="0">순환과 연쇄를</tspan><tspan x="653.5" dy="18.5">고치면</tspan></text><path fill="none" marker-end="url(#mk-d2-3396326794-3488378134)" d="M361.083 344v33s0 10 10 10H431.5s10 0 10 10v133" class="connection stroke-B1 s0" mask="url(#d2-3396326794)"/><text x="442" y="403" class="text-italic fill-N2 s1">흔든다</text><path fill="none" marker-end="url(#mk-d2-3396326794-3488378134)" d="M210 674v163" class="connection stroke-B1 s0" mask="url(#d2-3396326794)"/><text x="210.5" y="762" class="text-italic fill-N2 s1">되받아친다</text><path fill="none" marker-end="url(#mk-d2-3396326794-3488378134)" d="M794.583 349v181" class="connection stroke-B1 s0" mask="url(#d2-3396326794)"/><text x="795" y="446" class="text-italic fill-N2 s1">흔든다</text><path fill="none" marker-end="url(#mk-d2-3396326794-3488378134)" d="M653 674v163" class="connection stroke-B1 s0" mask="url(#d2-3396326794)"/><text x="653" y="762" class="text-italic fill-N2 s1">흔든다</text><mask id="d2-3396326794" width="1166" height="1348" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1166v1348H-89z"/><path d="M250 432h81v21h-81zM592 387h123v37H592zM411 387h62v21h-62zM160 746h101v21H160zM764 430h62v21h-62zM622 746h62v21h-62z"/></mask></svg>