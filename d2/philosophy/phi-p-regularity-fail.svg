<svg xmlns="http://www.w3.org/2000/svg" width="1447" height="825" class="d2-2887135941 d2-svg" viewBox="-89 -89 1447 825"><rect width="1447" height="825" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2887135941 .fill-N1{fill:#0a0f25}.d2-2887135941 .fill-B6{fill:#f7f8fe}.d2-2887135941 .stroke-B1,.d2-2887135941 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M12 400h261v146H12z" class="stroke-B1 fill-B6 s0"/></g><text x="142.5" y="438.5" class="text-bold fill-N1 s1"><tspan x="142.5" dy="0">규칙성 이론</tspan><tspan x="142.5" dy="16.833">C 가 E 를 일으킨다 =</tspan><tspan x="142.5" dy="16.833">C 가 E 보다 먼저 일어나고</tspan><tspan x="142.5" dy="16.833">둘이 붙어 있으며,</tspan><tspan x="142.5" dy="16.833">C 유형 뒤에는</tspan><tspan x="142.5" dy="16.833">늘 E 유형이 온다</tspan></text></g><g ><g class="shape"><path d="M406 147h188v82H406z" class="stroke-B1 fill-B6 s0"/></g><text x="500" y="185.5" class="text-bold fill-N1 s1"><tspan x="500" dy="0">규칙성은 있는데</tspan><tspan x="500" dy="18.5">인과가 아니다</tspan></text></g><g ><g class="shape"><path d="M403 432h168v82H403z" class="stroke-B1 fill-B6 s0"/></g><text x="487" y="470.5" class="text-bold fill-N1 s1"><tspan x="487" dy="0">인과인데</tspan><tspan x="487" dy="18.5">규칙성이 없다</tspan></text></g><g ><g class="shape"><path d="M701 12h232v162H701z" class="stroke-B1 fill-B6 s0"/></g><text x="817" y="50.5" class="text-bold fill-N1 s1"><tspan x="817" dy="0">우연한 규칙성</tspan><tspan x="817" dy="16.714">이 공장 사이렌이</tspan><tspan x="817" dy="16.714">울린 뒤에는 늘</tspan><tspan x="817" dy="16.714">옆 마을 사람들이</tspan><tspan x="817" dy="16.714">일손을 놓는다.</tspan><tspan x="817" dy="16.714">사이렌이 그들을</tspan><tspan x="817" dy="16.714">퇴근시킨 것은 아니다</tspan></text></g><g ><g class="shape"><path d="M702 194h235v178H702z" class="stroke-B1 fill-B6 s0"/></g><text x="819.5" y="232.5" class="text-bold fill-N1 s1"><tspan x="819.5" dy="0">공통 원인</tspan><tspan x="819.5" dy="16.625">기압계 바늘이</tspan><tspan x="819.5" dy="16.625">떨어진 뒤에는</tspan><tspan x="819.5" dy="16.625">늘 폭풍이 온다.</tspan><tspan x="819.5" dy="16.625">바늘이 폭풍을</tspan><tspan x="819.5" dy="16.625">일으키지는 않는다.</tspan><tspan x="819.5" dy="16.625">둘 다 기압이 떨어져서</tspan><tspan x="819.5" dy="16.625">일어난 일이다</tspan></text></g><g ><g class="shape"><path d="M701 392h238v162H701z" class="stroke-B1 fill-B6 s0"/></g><text x="820" y="430.5" class="text-bold fill-N1 s1"><tspan x="820" dy="0">단칭 인과</tspan><tspan x="820" dy="16.714">딱 한 번 일어난 일에도</tspan><tspan x="820" dy="16.714">원인이 있다.</tspan><tspan x="820" dy="16.714">같은 일이 되풀이된</tspan><tspan x="820" dy="16.714">적이 없으면</tspan><tspan x="820" dy="16.714">‘늘 그랬다’ 라고 말할</tspan><tspan x="820" dy="16.714">규칙성 자체가 없다</tspan></text></g><text x="487" y="550" class="fill-N1 s1"><tspan x="487" dy="0">덤으로 하나 더 — 방향 문제.</tspan><tspan x="487" dy="16.833">‘늘 함께 일어난다’ 는 대칭인데</tspan><tspan x="487" dy="16.833">인과는 대칭이 아니다.</tspan><tspan x="487" dy="16.833">시간 순서를 붙여 막으려 하면,</tspan><tspan x="487" dy="16.833">이번에는 인과로 시간 방향을</tspan><tspan x="487" dy="16.833">설명하는 길이 막힌다</tspan></text><text x="1133" y="240" class="fill-N1 s1"><tspan x="1133" dy="0">다음 절이 세우는</tspan><tspan x="1133" dy="16.714">반사실 분석은</tspan><tspan x="1133" dy="16.714">위 둘을 잘 막는다.</tspan><tspan x="1133" dy="16.714">기압계가 없었더라도</tspan><tspan x="1133" dy="16.714">폭풍은 왔을 것이기 때문이다.</tspan><tspan x="1133" dy="16.714">그 대신 다른 자리에서</tspan><tspan x="1133" dy="16.714">무너진다</tspan></text><marker id="mk-d2-2887135941-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2887135941-3488378134)" d="M275 436.5h28s10 0 10-10V198s0-10 10-10h79" class="connection stroke-B1 s0" mask="url(#d2-2887135941)"/><path fill="none" marker-end="url(#mk-d2-2887135941-3488378134)" d="M275 473h124" class="connection stroke-B1 s0" mask="url(#d2-2887135941)"/><path fill="none" marker-end="url(#mk-d2-2887135941-3488378134)" d="M596 174.333h55s10 0 10-10V103s0-10 10-10h26" class="connection stroke-B1 s0" mask="url(#d2-2887135941)"/><path fill="none" marker-end="url(#mk-d2-2887135941-3488378134)" d="M596 201.666h55s10 0 10 10V273s0 10 10 10h28" class="connection stroke-B1 s0" mask="url(#d2-2887135941)"/><path fill="none" marker-end="url(#mk-d2-2887135941-3488378134)" d="M573 473h124" class="connection stroke-B1 s0" mask="url(#d2-2887135941)"/><marker id="mk-d2-2887135941-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2887135941-2177206569)" d="M275 509.5h28s10 0 10 10v55s0 10 10 10h26" class="connection stroke-B2 s3" mask="url(#d2-2887135941)"/><path fill="none" marker-end="url(#mk-d2-2887135941-2177206569)" d="M939 283h66" class="connection stroke-B2 s3" mask="url(#d2-2887135941)"/><mask id="d2-2887135941" width="1447" height="825" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1447v825H-89z"/></mask></svg>