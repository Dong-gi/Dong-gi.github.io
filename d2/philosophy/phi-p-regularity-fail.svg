<svg xmlns="http://www.w3.org/2000/svg" width="2469" height="753" class="d2-2363130414 d2-svg" viewBox="-101 -101 2469 753"><rect width="2469" height="753" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2363130414 .fill-N1{fill:#0a0f25}.d2-2363130414 .fill-B6{fill:#f7f8fe}.d2-2363130414 .stroke-B1,.d2-2363130414 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 348h418v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="209" y="386.5" class="text-bold fill-N1 s1"><tspan x="209" dy="0">규칙성 이론</tspan><tspan x="209" dy="17.25">C 가 E 를 일으킨다 =</tspan><tspan x="209" dy="17.25">C 가 E 보다 먼저 일어나고 둘이 붙어 있으며,</tspan><tspan x="209" dy="17.25">C 유형 뒤에는 늘 E 유형이 온다</tspan></text></g><g ><g class="shape"><path d="M703 111h316v66H703z" class="stroke-B1 fill-B6 s0"/></g><text x="861" y="149.5" class="text-bold fill-N1 s1">규칙성은 있는데 인과가 아니다</text></g><g ><g class="shape"><path d="M735 372h252v66H735z" class="stroke-B1 fill-B6 s0"/></g><text x="861" y="410.5" class="text-bold fill-N1 s1">인과인데 규칙성이 없다</text></g><g ><g class="shape"><path d="M1330 0h380v114h-380z" class="stroke-B1 fill-B6 s0"/></g><text x="1520" y="38.5" class="text-bold fill-N1 s1"><tspan x="1520" dy="0">우연한 규칙성</tspan><tspan x="1520" dy="17.25">이 공장 사이렌이 울린 뒤에는 늘</tspan><tspan x="1520" dy="17.25">옆 마을 사람들이 일손을 놓는다.</tspan><tspan x="1520" dy="17.25">사이렌이 그들을 퇴근시킨 것은 아니다</tspan></text></g><g ><g class="shape"><path d="M1304 174h432v114h-432z" class="stroke-B1 fill-B6 s0"/></g><text x="1520" y="212.5" class="text-bold fill-N1 s1"><tspan x="1520" dy="0">공통 원인</tspan><tspan x="1520" dy="17.25">기압계 바늘이 떨어진 뒤에는 늘 폭풍이 온다.</tspan><tspan x="1520" dy="17.25">바늘이 폭풍을 일으키지는 않는다.</tspan><tspan x="1520" dy="17.25">둘 다 기압이 떨어져서 일어난 일이다</tspan></text></g><g ><g class="shape"><path d="M1316 348h409v114h-409z" class="stroke-B1 fill-B6 s0"/></g><text x="1520.5" y="386.5" class="text-bold fill-N1 s1"><tspan x="1520.5" dy="0">단칭 인과</tspan><tspan x="1520.5" dy="17.25">딱 한 번 일어난 일에도 원인이 있다.</tspan><tspan x="1520.5" dy="17.25">같은 일이 되풀이된 적이 없으면</tspan><tspan x="1520.5" dy="17.25">‘늘 그랬다’ 라고 말할 규칙성 자체가 없다</tspan></text></g><text x="861" y="514" class="fill-N1 s1"><tspan x="861" dy="0">덤으로 하나 더 — 방향 문제.</tspan><tspan x="861" dy="17.667">‘늘 함께 일어난다’ 는 대칭인데 인과는 대칭이 아니다.</tspan><tspan x="861" dy="17.667">시간 순서를 붙여 막으려 하면, 이번에는 인과로 시간 방향을 설명하는 길이 막힌다</tspan></text><text x="2051.5" y="221" class="fill-N1 s1"><tspan x="2051.5" dy="0">다음 절이 세우는 반사실 분석은 위 둘을 잘 막는다.</tspan><tspan x="2051.5" dy="17.667">기압계가 없었더라도 폭풍은 왔을 것이기 때문이다.</tspan><tspan x="2051.5" dy="17.667">그 대신 다른 자리에서 무너진다</tspan></text><marker id="mk-d2-2363130414-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2363130414-3488378134)" d="M267.407 346.579C427.6 184.799 515 144 699 144" class="connection stroke-B1 s0" mask="url(#d2-2363130414)"/><path fill="none" marker-end="url(#mk-d2-2363130414-3488378134)" d="M420 405h311" class="connection stroke-B1 s0" mask="url(#d2-2363130414)"/><path fill="none" marker-end="url(#mk-d2-2363130414-3488378134)" d="M1011.953 110.568C1205.2 67.8 1269.2 57 1326 57" class="connection stroke-B1 s0" mask="url(#d2-2363130414)"/><path fill="none" marker-end="url(#mk-d2-2363130414-3488378134)" d="M1011.953 177.432C1205.2 220.2 1264 231 1300 231" class="connection stroke-B1 s0" mask="url(#d2-2363130414)"/><path fill="none" marker-end="url(#mk-d2-2363130414-3488378134)" d="M989 405h322.5" class="connection stroke-B1 s0" mask="url(#d2-2363130414)"/><marker id="mk-d2-2363130414-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2363130414-2177206569)" d="M334.812 462.346C441 511.9 478 524.5 514 524.5" class="connection stroke-B2 s3" mask="url(#d2-2363130414)"/><path fill="none" marker-end="url(#mk-d2-2363130414-2177206569)" d="M1738 231h94" class="connection stroke-B2 s3" mask="url(#d2-2363130414)"/><mask id="d2-2363130414" width="2469" height="753" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2469v753H-101z"/></mask></svg>