<svg xmlns="http://www.w3.org/2000/svg" width="1194" height="937" class="d2-2492958063 d2-svg" viewBox="-89 -89 1194 937"><rect width="1194" height="937" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-2492958063 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2492958063 .fill-N1{fill:#0a0f25}.d2-2492958063 .fill-B6{fill:#f7f8fe}.d2-2492958063 .stroke-B1,.d2-2492958063 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M12 432h198v178H12z" class="stroke-B1 fill-B6 s0"/></g><text x="111" y="470.5" class="text-bold fill-N1 s1"><tspan x="111" dy="0">규칙성 이론</tspan><tspan x="111" dy="16.625">C 가 E 를</tspan><tspan x="111" dy="16.625">일으킨다 =</tspan><tspan x="111" dy="16.625">C 가 E 보다</tspan><tspan x="111" dy="16.625">먼저 일어나고</tspan><tspan x="111" dy="16.625">둘이 붙어 있으며,</tspan><tspan x="111" dy="16.625">C 유형 뒤에는</tspan><tspan x="111" dy="16.625">늘 E 유형이 온다</tspan></text></g><g ><g class="shape"><path d="M302 154h168v98H302z" class="stroke-B1 fill-B6 s0"/></g><text x="386" y="192.5" class="text-bold fill-N1 s1"><tspan x="386" dy="0">규칙성은</tspan><tspan x="386" dy="17.667">있는데</tspan><tspan x="386" dy="17.667">인과가 아니다</tspan></text></g><g ><g class="shape"><path d="M299 480h168v82H299z" class="stroke-B1 fill-B6 s0"/></g><text x="383" y="518.5" class="text-bold fill-N1 s1"><tspan x="383" dy="0">인과인데</tspan><tspan x="383" dy="18.5">규칙성이 없다</tspan></text></g><g ><g class="shape"><path d="M557 12h191v178H557z" class="stroke-B1 fill-B6 s0"/></g><text x="652.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="652.5" dy="0">우연한 규칙성</tspan><tspan x="652.5" dy="16.625">이 공장 사이렌이</tspan><tspan x="652.5" dy="16.625">울린 뒤에는 늘</tspan><tspan x="652.5" dy="16.625">옆 마을 사람들이</tspan><tspan x="652.5" dy="16.625">일손을 놓는다.</tspan><tspan x="652.5" dy="16.625">사이렌이 그들을</tspan><tspan x="652.5" dy="16.625">퇴근시킨 것은</tspan><tspan x="652.5" dy="16.625">아니다</tspan></text></g><g ><g class="shape"><path d="M557 210h214v194H557z" class="stroke-B1 fill-B6 s0"/></g><text x="664" y="248.5" class="text-bold fill-N1 s1"><tspan x="664" dy="0">공통 원인</tspan><tspan x="664" dy="16.556">기압계 바늘이</tspan><tspan x="664" dy="16.556">떨어진 뒤에는</tspan><tspan x="664" dy="16.556">늘 폭풍이 온다.</tspan><tspan x="664" dy="16.556">바늘이 폭풍을</tspan><tspan x="664" dy="16.556">일으키지는 않는다.</tspan><tspan x="664" dy="16.556">둘 다 기압이</tspan><tspan x="664" dy="16.556">떨어져서</tspan><tspan x="664" dy="16.556">일어난 일이다</tspan></text></g><g ><g class="shape"><path d="M557 424h212v194H557z" class="stroke-B1 fill-B6 s0"/></g><text x="663" y="462.5" class="text-bold fill-N1 s1"><tspan x="663" dy="0">단칭 인과</tspan><tspan x="663" dy="16.556">딱 한 번</tspan><tspan x="663" dy="16.556">일어난 일에도</tspan><tspan x="663" dy="16.556">원인이 있다.</tspan><tspan x="663" dy="16.556">같은 일이 되풀이된</tspan><tspan x="663" dy="16.556">적이 없으면</tspan><tspan x="663" dy="16.556">‘늘 그랬다’ 라고</tspan><tspan x="663" dy="16.556">말할</tspan><tspan x="663" dy="16.556">규칙성 자체가 없다</tspan></text></g><text x="383.5" y="598" class="fill-N1 s1"><tspan x="383.5" dy="0">덤으로 하나 더 —</tspan><tspan x="383.5" dy="16.5">방향 문제.</tspan><tspan x="383.5" dy="16.5">‘늘 함께 일어난다’ 는</tspan><tspan x="383.5" dy="16.5">대칭인데</tspan><tspan x="383.5" dy="16.5">인과는 대칭이 아니다.</tspan><tspan x="383.5" dy="16.5">시간 순서를 붙여</tspan><tspan x="383.5" dy="16.5">막으려 하면,</tspan><tspan x="383.5" dy="16.5">이번에는 인과로</tspan><tspan x="383.5" dy="16.5">시간 방향을</tspan><tspan x="383.5" dy="16.5">설명하는 길이 막힌다</tspan></text><text x="922.5" y="240" class="fill-N1 s1"><tspan x="922.5" dy="0">다음 절이 세우는</tspan><tspan x="922.5" dy="16.5">반사실 분석은</tspan><tspan x="922.5" dy="16.5">위 둘을 잘 막는다.</tspan><tspan x="922.5" dy="16.5">기압계가</tspan><tspan x="922.5" dy="16.5">없었더라도</tspan><tspan x="922.5" dy="16.5">폭풍은 왔을 것이기</tspan><tspan x="922.5" dy="16.5">때문이다.</tspan><tspan x="922.5" dy="16.5">그 대신</tspan><tspan x="922.5" dy="16.5">다른 자리에서</tspan><tspan x="922.5" dy="16.5">무너진다</tspan></text><marker id="mk-d2-2492958063-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2492958063-3488378134)" d="M212 476.5h28s10 0 10-10V213.999s0-10 10-10h39" class="connection stroke-B1 s0" mask="url(#d2-2492958063)"/><path fill="none" marker-end="url(#mk-d2-2492958063-3488378134)" d="M211.5 521h84" class="connection stroke-B1 s0" mask="url(#d2-2492958063)"/><path fill="none" marker-end="url(#mk-d2-2492958063-3488378134)" d="M473 187.666h34s10 0 10-10V111s0-10 10-10h26" class="connection stroke-B1 s0" mask="url(#d2-2492958063)"/><path fill="none" marker-end="url(#mk-d2-2492958063-3488378134)" d="M473 220.333h34s10 0 10 10V297s0 10 10 10h26" class="connection stroke-B1 s0" mask="url(#d2-2492958063)"/><path fill="none" marker-end="url(#mk-d2-2492958063-3488378134)" d="M469 521h84" class="connection stroke-B1 s0" mask="url(#d2-2492958063)"/><marker id="mk-d2-2492958063-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-2492958063-2177206569)" d="M212 565.5h28s10 0 10 10v79s0 10 10 10h26" class="connection stroke-B2 s3" mask="url(#d2-2492958063)"/><path fill="none" marker-end="url(#mk-d2-2492958063-2177206569)" d="M773 307h64" class="connection stroke-B2 s3" mask="url(#d2-2492958063)"/><mask id="d2-2492958063" width="1194" height="937" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1194v937H-89z"/></mask></svg>