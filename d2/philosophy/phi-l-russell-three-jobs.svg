<svg xmlns="http://www.w3.org/2000/svg" width="3116" height="727" class="d2-2150517812 d2-svg" viewBox="-101 -101 3116 727"><rect width="3116" height="727" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2150517812 .fill-N1{fill:#0a0f25}.d2-2150517812 .fill-N2{fill:#676c7e}.d2-2150517812 .fill-B6{fill:#f7f8fe}.d2-2150517812 .stroke-B1,.d2-2150517812 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="271" cy="192.5" class="shape stroke-B1 fill-B6 s0" rx="271" ry="90.5"/></g><text x="271" y="190" class="text-bold fill-N1 s1"><tspan x="271" dy="0">‘현재 프랑스의 왕은 대머리다’</tspan><tspan x="271" dy="18.5">겉모습은 주어와 술어로 된 한 문장이다</tspan></text></g><g ><g class="shape"><path d="M904 0h299v82H904z" class="stroke-B1 fill-B6 s0"/></g><text x="1053.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1053.5" dy="0">존재</tspan><tspan x="1053.5" dy="18.5">현재 프랑스의 왕인 것이 있다</tspan></text></g><g ><g class="shape"><path d="M938 142h232v82H938z" class="stroke-B1 fill-B6 s0"/></g><text x="1054" y="180.5" class="text-bold fill-N1 s1"><tspan x="1054" dy="0">유일성</tspan><tspan x="1054" dy="18.5">그런 것은 하나뿐이다</tspan></text></g><g ><g class="shape"><path d="M960 284h188v82H960z" class="stroke-B1 fill-B6 s0"/></g><text x="1054" y="322.5" class="text-bold fill-N1 s1"><tspan x="1054" dy="0">주장</tspan><tspan x="1054" dy="18.5">그것은 대머리다</tspan></text></g><g ><g class="shape"><path d="M1465 150h475v114h-475z" class="stroke-B1 fill-B6 s0"/></g><text x="1702.5" y="188.5" class="text-bold fill-N1 s1"><tspan x="1702.5" dy="0">셋의 논리곱 하나</tspan><tspan x="1702.5" dy="17.25">하나라도 거짓이면 문장 전체가 거짓이다.</tspan><tspan x="1702.5" dy="17.25">왕이 없으므로 첫 조각에서 막히고</tspan><tspan x="1702.5" dy="17.25">문장은 거짓이 된다. 참도 거짓도 아닌 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M2460 23h419v130h-419z" class="stroke-B1 fill-B6 s0"/></g><text x="2669.5" y="61.5" class="text-bold fill-N1 s1"><tspan x="2669.5" dy="0">하나. 존재론적 부담을 없앤다</tspan><tspan x="2669.5" dy="17">확정 기술이 이름이 아니므로</tspan><tspan x="2669.5" dy="17">가리킬 대상이 있어야 할 이유가 없다.</tspan><tspan x="2669.5" dy="17">콰인의 기준을 걸어도 이 문장은</tspan><tspan x="2669.5" dy="17">왕에 개입하지 않는다 — 10 장의 ‘다시 쓰기’</tspan></text></g><g ><g class="shape"><path d="M2424 213h490v130h-490z" class="stroke-B1 fill-B6 s0"/></g><text x="2669" y="251.5" class="text-bold fill-N1 s1"><tspan x="2669" dy="0">둘. 부정이 두 갈래로 갈리는 까닭을 설명한다</tspan><tspan x="2669" dy="17">넓은 읽기 — 존재 주장까지 부정한다. 왕이 없으면 참</tspan><tspan x="2669" dy="17">좁은 읽기 — 존재 주장은 남긴다. 왕이 없으면 거짓</tspan><tspan x="2669" dy="17">한 문장이 두 값을 갖는 것이 아니라</tspan><tspan x="2669" dy="17">부정의 범위가 애매했던 것이다</tspan></text></g><g ><g class="shape"><path d="M2445 403h449v114h-449z" class="stroke-B2 fill-B6 s2"/></g><text x="2669.5" y="441.5" class="text-bold fill-N1 s1"><tspan x="2669.5" dy="0">셋. 이름으로 확장한다</tspan><tspan x="2669.5" dy="17.25">일상의 고유명도 위장된 확정 기술이라고 본다.</tspan><tspan x="2669.5" dy="17.25">‘아리스토텔레스’ 는 ‘알렉산더를 가르친</tspan><tspan x="2669.5" dy="17.25">그 사람’ 의 줄임이라는 식이다</tspan></text></g><text x="271" y="359" class="fill-N1 s1"><tspan x="271" dy="0">3 절 — 크립키의 세 논증이 셋째 화살표를 끊는다.</tspan><tspan x="271" dy="17.25">끊기는 것은 그것뿐이고 앞의 두 가지 일은 그대로 남는다.</tspan><tspan x="271" dy="17.25">확정 기술이 한정사 뭉치라는 분석과</tspan><tspan x="271" dy="17.25">이름이 확정 기술이라는 주장은 다른 주장이다</tspan></text><text x="271.5" y="488" class="fill-N1 s1"><tspan x="271.5" dy="0">세 조각을 술어논리로 적는 일은 논리학 문서 12 장이 한다.</tspan><tspan x="271.5" dy="17.667">이 문서가 하는 일은 왜 그 분석인가,</tspan><tspan x="271.5" dy="17.667">그것이 무엇을 해결하는가, 무엇이 반론인가다</tspan></text><marker id="mk-d2-2150517812-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2150517812-3488378134)" d="M463.897 127.368C670.8 58.399 759.2 41 900 41" class="connection stroke-B1 s0" mask="url(#d2-2150517812)"/><text x="678" y="62" class="text-italic fill-N2 s1">다시 적으면</text><path fill="none" marker-end="url(#mk-d2-2150517812-3488378134)" d="M544 186.956C686.8 183.8 765.9 183 933.5 183" class="connection stroke-B1 s0" mask="url(#d2-2150517812)"/><text x="740" y="189" class="text-italic fill-N2 s1">다시 적으면</text><path fill="none" marker-end="url(#mk-d2-2150517812-3488378134)" d="M476.919 252.565C673.4 310.4 770.3 325 955.5 325" class="connection stroke-B1 s0" mask="url(#d2-2150517812)"/><text x="713" y="322" class="text-italic fill-N2 s1">다시 적으면</text><path fill="none" marker-end="url(#mk-d2-2150517812-3488378134)" d="M1205 41c102.8 0 177.4 21.8 367.353 107.357" class="connection stroke-B1 s0" mask="url(#d2-2150517812)"/><path fill="none" marker-end="url(#mk-d2-2150517812-3488378134)" d="M1172.5 183c128.8 0 187.7 1.8 288.51 8.726" class="connection stroke-B1 s0" mask="url(#d2-2150517812)"/><path fill="none" marker-end="url(#mk-d2-2150517812-3488378134)" d="M1150.5 325c146.4 0 221.5-12.2 369.691-59.777" class="connection stroke-B1 s0" mask="url(#d2-2150517812)"/><path fill="none" marker-end="url(#mk-d2-2150517812-3488378134)" d="M1933.941 149.519C2132 100.4 2237.5 88 2455.5 88" class="connection stroke-B1 s0" mask="url(#d2-2150517812)"/><path fill="none" marker-end="url(#mk-d2-2150517812-3488378134)" d="M1941.978 242.294C2133.6 270.8 2230.4 278 2420 278" class="connection stroke-B1 s0" mask="url(#d2-2150517812)"/><marker id="mk-d2-2150517812-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2150517812-2177206569)" d="M1812.768 264.934C2107.8 420.8 2234.5 460 2440.5 460" class="connection stroke-B2 s2" mask="url(#d2-2150517812)"/><text x="2111" y="427" class="text-italic fill-N2 s1">이 화살표만 뒤에서 끊긴다</text><mask id="d2-2150517812" width="3116" height="727" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3116v727H-101z"/><path d="M626 46h104v21H626zM688 173h104v21H688zM661 306h104v21H661zM1998 411h226v21h-226z"/></mask></svg>