<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1300" class="d2-493115028 d2-svg" viewBox="-101 -101 1500 1300"><rect width="1500" height="1300" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-493115028 .text-bold{font-weight:700}.d2-493115028 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-493115028 .fill-N1{fill:#0a0f25}.d2-493115028 .fill-N2{fill:#676c7e}.d2-493115028 .fill-B6{fill:#f7f8fe}.d2-493115028 .stroke-B1,.d2-493115028 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="691" cy="90.5" class="shape stroke-B1 fill-B6 s0" rx="271" ry="90.5"/></g><text x="691" y="88" class="text-bold fill-N1 s1"><tspan x="691" dy="0">‘현재 프랑스의 왕은 대머리다’</tspan><tspan x="691" dy="18.5">겉모습은 주어와 술어로 된 한 문장이다</tspan></text></g><g ><g class="shape"><path d="M216 302h299v82H216z" class="stroke-B1 fill-B6 s0"/></g><text x="365.5" y="340.5" class="text-bold fill-N1 s1"><tspan x="365.5" dy="0">존재</tspan><tspan x="365.5" dy="18.5">현재 프랑스의 왕인 것이 있다</tspan></text></g><g ><g class="shape"><path d="M575 302h232v82H575z" class="stroke-B1 fill-B6 s0"/></g><text x="691" y="340.5" class="text-bold fill-N1 s1"><tspan x="691" dy="0">유일성</tspan><tspan x="691" dy="18.5">그런 것은 하나뿐이다</tspan></text></g><g ><g class="shape"><path d="M867 302h188v82H867z" class="stroke-B1 fill-B6 s0"/></g><text x="961" y="340.5" class="text-bold fill-N1 s1"><tspan x="961" dy="0">주장</tspan><tspan x="961" dy="18.5">그것은 대머리다</tspan></text></g><g ><g class="shape"><path d="M493 484h340v146H493z" class="stroke-B1 fill-B6 s0"/></g><text x="663" y="522.5" class="text-bold fill-N1 s1"><tspan x="663" dy="0">셋의 논리곱 하나</tspan><tspan x="663" dy="16.833">하나라도 거짓이면 문장</tspan><tspan x="663" dy="16.833">전체가 거짓이다.</tspan><tspan x="663" dy="16.833">왕이 없으므로 첫 조각에서 막히고</tspan><tspan x="663" dy="16.833">문장은 거짓이 된다.</tspan><tspan x="663" dy="16.833">참도 거짓도 아닌 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M56 767h368v146H56z" class="stroke-B1 fill-B6 s0"/></g><text x="240" y="805.5" class="text-bold fill-N1 s1"><tspan x="240" dy="0">하나. 존재론적 부담을 없앤다</tspan><tspan x="240" dy="16.833">확정 기술이 이름이 아니므로</tspan><tspan x="240" dy="16.833">가리킬 대상이 있어야 할 이유가 없다.</tspan><tspan x="240" dy="16.833">콰인의 기준을 걸어도 이 문장은</tspan><tspan x="240" dy="16.833">왕에 개입하지 않는다 —</tspan><tspan x="240" dy="16.833">10 장의 ‘다시 쓰기’</tspan></text></g><g ><g class="shape"><path d="M484 751h359v178H484z" class="stroke-B1 fill-B6 s0"/></g><text x="663.5" y="789.5" class="text-bold fill-N1 s1"><tspan x="663.5" dy="0">둘. 부정이 두 갈래로 갈리는</tspan><tspan x="663.5" dy="16.625">까닭을 설명한다</tspan><tspan x="663.5" dy="16.625">넓은 읽기 — 존재 주장까지 부정한다.</tspan><tspan x="663.5" dy="16.625">왕이 없으면 참</tspan><tspan x="663.5" dy="16.625">좁은 읽기 — 존재 주장은 남긴다.</tspan><tspan x="663.5" dy="16.625">왕이 없으면 거짓</tspan><tspan x="663.5" dy="16.625">한 문장이 두 값을 갖는 것이 아니라</tspan><tspan x="663.5" dy="16.625">부정의 범위가 애매했던 것이다</tspan></text></g><g ><g class="shape"><path d="M903 767h310v146H903z" class="stroke-B2 fill-B6 s2"/></g><text x="1058" y="805.5" class="text-bold fill-N1 s1"><tspan x="1058" dy="0">셋. 이름으로 확장한다</tspan><tspan x="1058" dy="16.833">일상의 고유명도 위장된 확정</tspan><tspan x="1058" dy="16.833">기술이라고 본다.</tspan><tspan x="1058" dy="16.833">‘아리스토텔레스’ 는</tspan><tspan x="1058" dy="16.833">‘알렉산더를 가르친</tspan><tspan x="1058" dy="16.833">그 사람’ 의 줄임이라는 식이다</tspan></text></g><text x="1058" y="1045" class="fill-N1 s1"><tspan x="1058" dy="0">3 절 — 크립키의 세 논증이 셋째 화살표를 끊는다.</tspan><tspan x="1058" dy="17.25">끊기는 것은 그것뿐이고 앞의 두 가지 일은 그대로 남는다.</tspan><tspan x="1058" dy="17.25">확정 기술이 한정사 뭉치라는 분석과</tspan><tspan x="1058" dy="17.25">이름이 확정 기술이라는 주장은 다른 주장이다</tspan></text><text x="239.5" y="1053" class="fill-N1 s1"><tspan x="239.5" dy="0">세 조각을 술어논리로 적는 일은 논리학 문서 12 장이 한다.</tspan><tspan x="239.5" dy="17.667">이 문서가 하는 일은 왜 그 분석인가,</tspan><tspan x="239.5" dy="17.667">그것이 무엇을 해결하는가, 무엇이 반론인가다</tspan></text><marker id="mk-d2-493115028-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-493115028-3488378134)" d="M529.188 164.847C398.4 226 365.25 253.7 365.25 298.5" class="connection stroke-B1 s0" mask="url(#d2-493115028)"/><text x="423" y="220" class="text-italic fill-N2 s1">다시 적으면</text><path fill="none" marker-end="url(#mk-d2-493115028-3488378134)" d="M690.992 183c-.192 46.4-.242 70.7-.242 115.5" class="connection stroke-B1 s0" mask="url(#d2-493115028)"/><text x="691" y="247" class="text-italic fill-N2 s1">다시 적으면</text><path fill="none" marker-end="url(#mk-d2-493115028-3488378134)" d="M832.74 168.986C934.8 226.8 960.75 253.7 960.75 298.5" class="connection stroke-B1 s0" mask="url(#d2-493115028)"/><text x="920" y="224" class="text-italic fill-N2 s1">다시 적으면</text><path fill="none" marker-end="url(#mk-d2-493115028-3488378134)" d="M365.25 386c0 38 25.6 58.6 124.304 99.47" class="connection stroke-B1 s0" mask="url(#d2-493115028)"/><path fill="none" marker-end="url(#mk-d2-493115028-3488378134)" d="M690.75 386c0 38-2.2 58-10.14 94.093" class="connection stroke-B1 s0" mask="url(#d2-493115028)"/><path fill="none" marker-end="url(#mk-d2-493115028-3488378134)" d="M960.75 386c0 38-25.6 58.6-124.304 99.47" class="connection stroke-B1 s0" mask="url(#d2-493115028)"/><path fill="none" marker-end="url(#mk-d2-493115028-3488378134)" d="M491.592 611.1C290.3 674.5 239.5 705.9 239.5 763.5" class="connection stroke-B1 s0" mask="url(#d2-493115028)"/><path fill="none" marker-end="url(#mk-d2-493115028-3488378134)" d="M663 631.5v116" class="connection stroke-B1 s0" mask="url(#d2-493115028)"/><marker id="mk-d2-493115028-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-493115028-2177206569)" d="M834.395 615.14C1012.5 675.3 1057.5 705.9 1057.5 763.5" class="connection stroke-B2 s2" mask="url(#d2-493115028)"/><text x="977" y="669" class="text-italic fill-N2 s1">이 화살표만 뒤에서 끊긴다</text><mask id="d2-493115028" width="1500" height="1300" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1500v1300H-101z"/><path d="M371 204h104v21H371zM639 231h104v21H639zM868 208h104v21H868zM864 653h226v21H864z"/></mask></svg>