<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="1429" class="d2-1948066634 d2-svg" viewBox="-101 -101 1084 1429"><rect width="1084" height="1429" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1948066634 .text-bold{font-weight:700}.d2-1948066634 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1948066634 .fill-N1{fill:#0a0f25}.d2-1948066634 .fill-N2{fill:#676c7e}.d2-1948066634 .fill-B6{fill:#f7f8fe}.d2-1948066634 .stroke-B1,.d2-1948066634 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="475.5" cy="75" class="shape stroke-B1 fill-B6 s0" rx="224.5" ry="75"/></g><text x="475.5" y="64.5" class="text-bold fill-N1 s1"><tspan x="475.5" dy="0">‘현재 프랑스의 왕은 대머리다’</tspan><tspan x="475.5" dy="17.667">겉모습은 주어와 술어로 된</tspan><tspan x="475.5" dy="17.667">한 문장이다</tspan></text></g><g ><g class="shape"><path d="M0 271h299v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="149.5" y="309.5" class="text-bold fill-N1 s1"><tspan x="149.5" dy="0">존재</tspan><tspan x="149.5" dy="18.5">현재 프랑스의 왕인 것이 있다</tspan></text></g><g ><g class="shape"><path d="M359 271h232v82H359z" class="stroke-B1 fill-B6 s0"/></g><text x="475" y="309.5" class="text-bold fill-N1 s1"><tspan x="475" dy="0">유일성</tspan><tspan x="475" dy="18.5">그런 것은 하나뿐이다</tspan></text></g><g ><g class="shape"><path d="M651 271h188v82H651z" class="stroke-B1 fill-B6 s0"/></g><text x="745" y="309.5" class="text-bold fill-N1 s1"><tspan x="745" dy="0">주장</tspan><tspan x="745" dy="18.5">그것은 대머리다</tspan></text></g><g ><g class="shape"><path d="M284 453h340v146H284z" class="stroke-B1 fill-B6 s0"/></g><text x="454" y="491.5" class="text-bold fill-N1 s1"><tspan x="454" dy="0">셋의 논리곱 하나</tspan><tspan x="454" dy="16.833">하나라도 거짓이면 문장</tspan><tspan x="454" dy="16.833">전체가 거짓이다.</tspan><tspan x="454" dy="16.833">왕이 없으므로 첫 조각에서 막히고</tspan><tspan x="454" dy="16.833">문장은 거짓이 된다.</tspan><tspan x="454" dy="16.833">참도 거짓도 아닌 것이 아니다</tspan></text></g><g ><g class="shape"><path d="M22 752h246v210H22z" class="stroke-B1 fill-B6 s0"/></g><text x="145" y="790.5" class="text-bold fill-N1 s1"><tspan x="145" dy="0">하나. 존재론적 부담을</tspan><tspan x="145" dy="16.5">없앤다</tspan><tspan x="145" dy="16.5">확정 기술이 이름이</tspan><tspan x="145" dy="16.5">아니므로</tspan><tspan x="145" dy="16.5">가리킬 대상이</tspan><tspan x="145" dy="16.5">있어야 할 이유가 없다.</tspan><tspan x="145" dy="16.5">콰인의 기준을 걸어도</tspan><tspan x="145" dy="16.5">이 문장은</tspan><tspan x="145" dy="16.5">왕에 개입하지 않는다 —</tspan><tspan x="145" dy="16.5">10 장의 ‘다시 쓰기’</tspan></text></g><g ><g class="shape"><path d="M328 736h257v242H328z" class="stroke-B1 fill-B6 s0"/></g><text x="456.5" y="774.5" class="text-bold fill-N1 s1"><tspan x="456.5" dy="0">둘. 부정이 두 갈래로</tspan><tspan x="456.5" dy="16.417">갈리는 까닭을 설명한다</tspan><tspan x="456.5" dy="16.417">넓은 읽기 —</tspan><tspan x="456.5" dy="16.417">존재 주장까지 부정한다.</tspan><tspan x="456.5" dy="16.417">왕이 없으면 참</tspan><tspan x="456.5" dy="16.417">좁은 읽기 —</tspan><tspan x="456.5" dy="16.417">존재 주장은 남긴다.</tspan><tspan x="456.5" dy="16.417">왕이 없으면 거짓</tspan><tspan x="456.5" dy="16.417">한 문장이 두 값을</tspan><tspan x="456.5" dy="16.417">갖는 것이 아니라</tspan><tspan x="456.5" dy="16.417">부정의 범위가</tspan><tspan x="456.5" dy="16.417">애매했던 것이다</tspan></text></g><g ><g class="shape"><path d="M645 768h237v178H645z" class="stroke-B2 fill-B6 s2"/></g><text x="763.5" y="806.5" class="text-bold fill-N1 s1"><tspan x="763.5" dy="0">셋. 이름으로 확장한다</tspan><tspan x="763.5" dy="16.625">일상의 고유명도</tspan><tspan x="763.5" dy="16.625">위장된 확정</tspan><tspan x="763.5" dy="16.625">기술이라고 본다.</tspan><tspan x="763.5" dy="16.625">‘아리스토텔레스’ 는</tspan><tspan x="763.5" dy="16.625">‘알렉산더를 가르친</tspan><tspan x="763.5" dy="16.625">그 사람’ 의</tspan><tspan x="763.5" dy="16.625">줄임이라는 식이다</tspan></text></g><text x="763.5" y="1094" class="fill-N1 s1"><tspan x="763.5" dy="0">3 절 — 크립키의 세 논증이</tspan><tspan x="763.5" dy="16.556">셋째 화살표를 끊는다.</tspan><tspan x="763.5" dy="16.556">끊기는 것은 그것뿐이고</tspan><tspan x="763.5" dy="16.556">앞의 두 가지 일은</tspan><tspan x="763.5" dy="16.556">그대로 남는다.</tspan><tspan x="763.5" dy="16.556">확정 기술이 한정사</tspan><tspan x="763.5" dy="16.556">뭉치라는 분석과</tspan><tspan x="763.5" dy="16.556">이름이 확정 기술이라는</tspan><tspan x="763.5" dy="16.556">주장은 다른 주장이다</tspan></text><text x="145.5" y="1118" class="fill-N1 s1"><tspan x="145.5" dy="0">세 조각을 술어논리로 적는 일은</tspan><tspan x="145.5" dy="16.833">논리학 문서 12 장이 한다.</tspan><tspan x="145.5" dy="16.833">이 문서가 하는 일은</tspan><tspan x="145.5" dy="16.833">왜 그 분석인가,</tspan><tspan x="145.5" dy="16.833">그것이 무엇을 해결하는가,</tspan><tspan x="145.5" dy="16.833">무엇이 반론인가다</tspan></text><marker id="mk-d2-1948066634-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1948066634-3488378134)" d="M332.156 133.775C186.4 195 149.5 222.7 149.5 267.5" class="connection stroke-B1 s0" mask="url(#d2-1948066634)"/><text x="216" y="188" class="text-italic fill-N2 s1">다시 적으면</text><path fill="none" marker-end="url(#mk-d2-1948066634-3488378134)" d="M475 152v115.5" class="connection stroke-B1 s0" mask="url(#d2-1948066634)"/><text x="475" y="216" class="text-italic fill-N2 s1">다시 적으면</text><path fill="none" marker-end="url(#mk-d2-1948066634-3488378134)" d="M601.784 137.904C716 195.8 745 222.7 745 267.5" class="connection stroke-B1 s0" mask="url(#d2-1948066634)"/><text x="697" y="192" class="text-italic fill-N2 s1">다시 적으면</text><path fill="none" marker-end="url(#mk-d2-1948066634-3488378134)" d="M149.5 355c0 38 27 58.8 131.286 100.514" class="connection stroke-B1 s0" mask="url(#d2-1948066634)"/><path fill="none" marker-end="url(#mk-d2-1948066634-3488378134)" d="M475 355c0 38-1.6 58-7.368 94.05" class="connection stroke-B1 s0" mask="url(#d2-1948066634)"/><path fill="none" marker-end="url(#mk-d2-1948066634-3488378134)" d="M745 355c0 38-24.15 58.216-117.066 97.524" class="connection stroke-B1 s0" mask="url(#d2-1948066634)"/><path fill="none" marker-end="url(#mk-d2-1948066634-3488378134)" d="M293.183 599.336C175 653.7 145 684.5 145 748.5" class="connection stroke-B1 s0" mask="url(#d2-1948066634)"/><path fill="none" marker-end="url(#mk-d2-1948066634-3488378134)" d="M455.529 600.5c.771 53.2.971 80.8.971 132" class="connection stroke-B1 s0" mask="url(#d2-1948066634)"/><marker id="mk-d2-1948066634-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-1948066634-2177206569)" d="M615.317 599.336C733.5 653.7 763.5 687.7 763.5 764.5" class="connection stroke-B2 s2" mask="url(#d2-1948066634)"/><text x="730.5" y="650" class="text-italic fill-N2 s1"><tspan x="730.5" dy="0">이 화살표만</tspan><tspan x="730.5" dy="18.5">뒤에서 끊긴다</tspan></text><mask id="d2-1948066634" width="1084" height="1429" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H983v1429H-101z"/><path d="M164 172h104v21H164zM423 200h104v21H423zM645 176h104v21H645zM669 634h123v37H669z"/></mask></svg>