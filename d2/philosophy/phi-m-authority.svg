<svg xmlns="http://www.w3.org/2000/svg" width="1063" height="1294" class="d2-1405577322 d2-svg" viewBox="-101 -101 1063 1294"><rect width="1063" height="1294" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1405577322 .text-bold{font-weight:700}.d2-1405577322 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1405577322 .fill-N1{fill:#0a0f25}.d2-1405577322 .fill-N2{fill:#676c7e}.d2-1405577322 .fill-B6{fill:#f7f8fe}.d2-1405577322 .stroke-B1,.d2-1405577322 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="197" cy="65.5" class="shape stroke-B1 fill-B6 s0" rx="197" ry="65.5"/></g><text x="197" y="63" class="text-bold fill-N1 s1"><tspan x="197" dy="0">‘전문가 A 가 그렇다고 했다</tspan><tspan x="197" dy="18.5">그러므로 그렇다’</tspan></text></g><g ><g class="shape"><path d="M0 201h394v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="197" y="247.5" class="text-bold fill-N1 s1">A 가 실제로 전문가인가</text></g><g ><g class="shape"><path d="M484 201h377v82H484z" class="stroke-B2 fill-B6 s2"/></g><text x="672.5" y="239.5" class="text-bold fill-N1 s1"><tspan x="672.5" dy="0">전문성 없는 권위</tspan><tspan x="672.5" dy="18.5">이름값을 근거로 쓴 것이다</tspan></text></g><g ><g class="shape"><path d="M0 353h394v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="197" y="399.5" class="text-bold fill-N1 s1"><tspan x="197" dy="0">A 가 지금 자기 분야 안에서</tspan><tspan x="197" dy="18.5">말하고 있는가</tspan></text></g><g ><g class="shape"><path d="M484 353h377v98H484z" class="stroke-B2 fill-B6 s2"/></g><text x="672.5" y="391.5" class="text-bold fill-N1 s1"><tspan x="672.5" dy="0">월경한 권위</tspan><tspan x="672.5" dy="17.667">한 분야의 성취가 다른 분야의</tspan><tspan x="672.5" dy="17.667">발언권을 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M0 521h394v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="197" y="567.5" class="text-bold fill-N1 s1"><tspan x="197" dy="0">그 분야 전문가들 사이에</tspan><tspan x="197" dy="18.5">대체로 합의가 있는가</tspan></text></g><g ><g class="shape"><path d="M484 521h377v98H484z" class="stroke-B2 fill-B6 s2"/></g><text x="672.5" y="559.5" class="text-bold fill-N1 s1"><tspan x="672.5" dy="0">합의 없는 분야에서 한 사람만 인용</tspan><tspan x="672.5" dy="17.667">반대편에도 같은 급의 전문가가 있다.</tspan><tspan x="672.5" dy="17.667">철학의 많은 물음이 여기 해당한다</tspan></text></g><g ><g class="shape"><path d="M0 689h394v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="197" y="735.5" class="text-bold fill-N1 s1"><tspan x="197" dy="0">A 가 이 결론으로</tspan><tspan x="197" dy="18.5">이익을 보지 않는가</tspan></text></g><g ><g class="shape"><path d="M484 689h377v98H484z" class="stroke-B2 fill-B6 s2"/></g><text x="672.5" y="727.5" class="text-bold fill-N1 s1"><tspan x="672.5" dy="0">이해가 걸린 권위</tspan><tspan x="672.5" dy="17.667">결론이 거짓이라는 뜻은 아니다.</tspan><tspan x="672.5" dy="17.667">증거로서의 무게가 줄어든다는 뜻이다</tspan></text></g><g ><g class="shape"><path d="M0 857h394v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="197" y="895.5" class="text-bold fill-N1 s1"><tspan x="197" dy="0">정당한 권위 호소</tspan><tspan x="197" dy="17">결론을 보증하지는 않지만</tspan><tspan x="197" dy="17">믿을 좋은 이유가 된다.</tspan><tspan x="197" dy="17">우리가 아는 것의 대부분이</tspan><tspan x="197" dy="17">이런 경로로 들어온다</tspan></text></g><text x="671.5" y="873" class="fill-N1 s1"><tspan x="671.5" dy="0">네 관문을 다 지나도 결론은 보증되지 않는다.</tspan><tspan x="671.5" dy="17.25">전문가도 틀린다.</tspan><tspan x="671.5" dy="17.25">권위 호소는 연역이 아니라 귀납이고,</tspan><tspan x="671.5" dy="17.25">새 증거가 오면 무너질 수 있다</tspan></text><text x="430.5" y="1023" class="fill-N1 s1"><tspan x="430.5" dy="0">세 번째 관문이 이 문서와 곧바로 이어진다.</tspan><tspan x="430.5" dy="17">철학의 많은 물음에서는 전문가들 사이에 합의가 없다.</tspan><tspan x="430.5" dy="17">그래서 이 문서는 ‘어느 철학자가 그렇게</tspan><tspan x="430.5" dy="17">말했다’ 를 근거로 쓰지 않고,</tspan><tspan x="430.5" dy="17">3장의 세 등급으로 무게를 표시하고 논증 자체를 보여 준다</tspan></text><marker id="mk-d2-1405577322-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1405577322-3488378134)" d="M197 133v64" class="connection stroke-B1 s0" mask="url(#d2-1405577322)"/><path fill="none" marker-end="url(#mk-d2-1405577322-3488378134)" d="M395.5 242h85" class="connection stroke-B1 s0" mask="url(#d2-1405577322)"/><text x="439" y="248" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1405577322-3488378134)" d="M197 285v64" class="connection stroke-B1 s0" mask="url(#d2-1405577322)"/><text x="197" y="324" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-1405577322-3488378134)" d="M395.5 402h85" class="connection stroke-B1 s0" mask="url(#d2-1405577322)"/><text x="439" y="408" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1405577322-3488378134)" d="M197 453v64" class="connection stroke-B1 s0" mask="url(#d2-1405577322)"/><text x="197" y="492" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-1405577322-3488378134)" d="M395.5 570h85" class="connection stroke-B1 s0" mask="url(#d2-1405577322)"/><text x="439" y="576" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1405577322-3488378134)" d="M197 621v64" class="connection stroke-B1 s0" mask="url(#d2-1405577322)"/><text x="197" y="660" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-1405577322-3488378134)" d="M395.5 738h85" class="connection stroke-B1 s0" mask="url(#d2-1405577322)"/><text x="439" y="744" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1405577322-3488378134)" d="M197 789v64" class="connection stroke-B1 s0" mask="url(#d2-1405577322)"/><text x="197" y="828" class="text-italic fill-N2 s1">예</text><mask id="d2-1405577322" width="1063" height="1294" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H962v1294H-101z"/><path d="M408 232h62v21h-62zM185 308h24v21h-24zM408 392h62v21h-62zM185 476h24v21h-24zM408 560h62v21h-62zM185 644h24v21h-24zM408 728h62v21h-62zM185 812h24v21h-24z"/></mask></svg>