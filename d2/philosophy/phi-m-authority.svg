<svg xmlns="http://www.w3.org/2000/svg" width="1453" height="1745" class="d2-3100066744 d2-svg" viewBox="-101 -101 1453 1745"><rect width="1453" height="1745" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3100066744 .fill-N1{fill:#0a0f25}.d2-3100066744 .fill-N2{fill:#676c7e}.d2-3100066744 .fill-B6{fill:#f7f8fe}.d2-3100066744 .stroke-B1,.d2-3100066744 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="946" cy="65.5" class="shape stroke-B1 fill-B6 s0" rx="197" ry="65.5"/></g><text x="946" y="63" class="text-bold fill-N1 s1"><tspan x="946" dy="0">‘전문가 A 가 그렇다고 했다</tspan><tspan x="946" dy="18.5">그러므로 그렇다’</tspan></text></g><g ><g class="shape"><path d="M823 231h246v66H823z" class="stroke-B1 fill-B6 s0"/></g><text x="946" y="269.5" class="text-bold fill-N1 s1">A 가 실제로 전문가인가</text></g><g ><g class="shape"><path d="M642 418h273v82H642z" class="stroke-B1 fill-B6 s0"/></g><text x="778.5" y="456.5" class="text-bold fill-N1 s1"><tspan x="778.5" dy="0">A 가 지금 자기 분야 안에서</tspan><tspan x="778.5" dy="18.5">말하고 있는가</tspan></text></g><g ><g class="shape"><path d="M483 629h255v82H483z" class="stroke-B1 fill-B6 s0"/></g><text x="610.5" y="667.5" class="text-bold fill-N1 s1"><tspan x="610.5" dy="0">그 분야 전문가들 사이에</tspan><tspan x="610.5" dy="18.5">대체로 합의가 있는가</tspan></text></g><g ><g class="shape"><path d="M330 848h212v82H330z" class="stroke-B1 fill-B6 s0"/></g><text x="436" y="886.5" class="text-bold fill-N1 s1"><tspan x="436" dy="0">A 가 이 결론으로</tspan><tspan x="436" dy="18.5">이익을 보지 않는가</tspan></text></g><g ><g class="shape"><path d="M105 1059h276v130H105z" class="stroke-B1 fill-B6 s0"/></g><text x="243" y="1097.5" class="text-bold fill-N1 s1"><tspan x="243" dy="0">정당한 권위 호소</tspan><tspan x="243" dy="17">결론을 보증하지는 않지만</tspan><tspan x="243" dy="17">믿을 좋은 이유가 된다.</tspan><tspan x="243" dy="17">우리가 아는 것의 대부분이</tspan><tspan x="243" dy="17">이런 경로로 들어온다</tspan></text></g><g ><g class="shape"><path d="M975 418h276v82H975z" class="stroke-B2 fill-B6 s2"/></g><text x="1113" y="456.5" class="text-bold fill-N1 s1"><tspan x="1113" dy="0">전문성 없는 권위</tspan><tspan x="1113" dy="18.5">이름값을 근거로 쓴 것이다</tspan></text></g><g ><g class="shape"><path d="M798 621h299v98H798z" class="stroke-B2 fill-B6 s2"/></g><text x="947.5" y="659.5" class="text-bold fill-N1 s1"><tspan x="947.5" dy="0">월경한 권위</tspan><tspan x="947.5" dy="17.667">한 분야의 성취가 다른 분야의</tspan><tspan x="947.5" dy="17.667">발언권을 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M602 840h365v98H602z" class="stroke-B2 fill-B6 s2"/></g><text x="784.5" y="878.5" class="text-bold fill-N1 s1"><tspan x="784.5" dy="0">합의 없는 분야에서 한 사람만 인용</tspan><tspan x="784.5" dy="17.667">반대편에도 같은 급의 전문가가 있다.</tspan><tspan x="784.5" dy="17.667">철학의 많은 물음이 여기 해당한다</tspan></text></g><g ><g class="shape"><path d="M441 1075h377v98H441z" class="stroke-B2 fill-B6 s2"/></g><text x="629.5" y="1113.5" class="text-bold fill-N1 s1"><tspan x="629.5" dy="0">이해가 걸린 권위</tspan><tspan x="629.5" dy="17.667">결론이 거짓이라는 뜻은 아니다.</tspan><tspan x="629.5" dy="17.667">증거로서의 무게가 줄어든다는 뜻이다</tspan></text></g><text x="242.5" y="1474" class="fill-N1 s1"><tspan x="242.5" dy="0">세 번째 관문이 이 문서와 곧바로 이어진다.</tspan><tspan x="242.5" dy="17">철학의 많은 물음에서는 전문가들 사이에 합의가 없다.</tspan><tspan x="242.5" dy="17">그래서 이 문서는 ‘어느 철학자가 그렇게</tspan><tspan x="242.5" dy="17">말했다’ 를 근거로 쓰지 않고,</tspan><tspan x="242.5" dy="17">3장의 세 등급으로 무게를 표시하고 논증 자체를 보여 준다</tspan></text><text x="242.5" y="1305" class="fill-N1 s1"><tspan x="242.5" dy="0">네 관문을 다 지나도 결론은 보증되지 않는다.</tspan><tspan x="242.5" dy="17.25">전문가도 틀린다.</tspan><tspan x="242.5" dy="17.25">권위 호소는 연역이 아니라 귀납이고,</tspan><tspan x="242.5" dy="17.25">새 증거가 오면 무너질 수 있다</tspan></text><marker id="mk-d2-3100066744-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" 