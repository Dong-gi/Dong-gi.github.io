<svg xmlns="http://www.w3.org/2000/svg" width="3598" height="823" class="d2-1807852747 d2-svg" viewBox="-101 -101 3598 823"><rect width="3598" height="823" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1807852747 .fill-N1{fill:#0a0f25}.d2-1807852747 .fill-N2{fill:#676c7e}.d2-1807852747 .fill-B6{fill:#f7f8fe}.d2-1807852747 .stroke-B1,.d2-1807852747 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="407" cy="345.5" class="shape stroke-B1 fill-B6 s0" rx="197" ry="65.5"/></g><text x="407" y="343" class="text-bold fill-N1 s1"><tspan x="407" dy="0">‘전문가 A 가 그렇다고 했다</tspan><tspan x="407" dy="18.5">그러므로 그렇다’</tspan></text></g><g ><g class="shape"><path d="M914 312h246v66H914z" class="stroke-B1 fill-B6 s0"/></g><text x="1037" y="350.5" class="text-bold fill-N1 s1">A 가 실제로 전문가인가</text></g><g ><g class="shape"><path d="M1320 233h273v82h-273z" class="stroke-B1 fill-B6 s0"/></g><text x="1456.5" y="271.5" class="text-bold fill-N1 s1"><tspan x="1456.5" dy="0">A 가 지금 자기 분야 안에서</tspan><tspan x="1456.5" dy="18.5">말하고 있는가</tspan></text></g><g ><g class="shape"><path d="M1870 162h255v82h-255z" class="stroke-B1 fill-B6 s0"/></g><text x="1997.5" y="200.5" class="text-bold fill-N1 s1"><tspan x="1997.5" dy="0">그 분야 전문가들 사이에</tspan><tspan x="1997.5" dy="18.5">대체로 합의가 있는가</tspan></text></g><g ><g class="shape"><path d="M2478 87h212v82h-212z" class="stroke-B1 fill-B6 s0"/></g><text x="2584" y="125.5" class="text-bold fill-N1 s1"><tspan x="2584" dy="0">A 가 이 결론으로</tspan><tspan x="2584" dy="18.5">이익을 보지 않는가</tspan></text></g><g ><g class="shape"><path d="M2924 158h472v98h-472z" class="stroke-B1 fill-B6 s0"/></g><text x="3160" y="196.5" class="text-bold fill-N1 s1"><tspan x="3160" dy="0">정당한 권위 호소</tspan><tspan x="3160" dy="17.667">결론을 보증하지는 않지만 믿을 좋은 이유가 된다.</tspan><tspan x="3160" dy="17.667">우리가 아는 것의 대부분이 이런 경로로 들어온다</tspan></text></g><g ><g class="shape"><path d="M1318 375h276v82h-276z" class="stroke-B2 fill-B6 s2"/></g><text x="1456" y="413.5" class="text-bold fill-N1 s1"><tspan x="1456" dy="0">전문성 없는 권위</tspan><tspan x="1456" dy="18.5">이름값을 근거로 쓴 것이다</tspan></text></g><g ><g class="shape"><path d="M1752 304h491v82h-491z" class="stroke-B2 fill-B6 s2"/></g><text x="1997.5" y="342.5" class="text-bold fill-N1 s1"><tspan x="1997.5" dy="0">월경한 권위</tspan><tspan x="1997.5" dy="18.5">한 분야의 성취가 다른 분야의 발언권을 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M2401 229h365v98h-365z" class="stroke-B2 fill-B6 s2"/></g><text x="2583.5" y="267.5" class="text-bold fill-N1 s1"><tspan x="2583.5" dy="0">합의 없는 분야에서 한 사람만 인용</tspan><tspan x="2583.5" dy="17.667">반대편에도 같은 급의 전문가가 있다.</tspan><tspan x="2583.5" dy="17.667">철학의 많은 물음이 여기 해당한다</tspan></text></g><g ><g class="shape"><path d="M2972 0h377v98h-377z" class="stroke-B2 fill-B6 s2"/></g><text x="3160.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="3160.5" dy="0">이해가 걸린 권위</tspan><tspan x="3160.5" dy="17.667">결론이 거짓이라는 뜻은 아니다.</tspan><tspan x="3160.5" dy="17.667">증거로서의 무게가 줄어든다는 뜻이다</tspan></text></g><text x="407" y="487" class="fill-N1 s1"><tspan x="407" dy="0">세 번째 관문이 이 문서와 곧바로 이어진다. 철학의 많은 물음에서는 전문가들 사이에 합의가 없다.</tspan><tspan x="407" dy="17.667">그래서 이 문서는 ‘어느 철학자가 그렇게 말했다’ 를 근거로 쓰지 않고,</tspan><tspan x="407" dy="17.667">3장의 세 등급으로 무게를 표시하고 논증 자체를 보여 준다</tspan></text><text x="407.5" y="600" class="fill-N1 s1"><tspan x="407.5" dy="0">네 관문을 다 지나도 결론은 보증되지 않는다. 전문가도 틀린다.</tspan><tspan x="407.5" dy="18.5">권위 호소는 연역이 아니라 귀납이고, 새 증거가 오면 무너질 수 있다</tspan></text><marker id="mk-d2-1807852747-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1807852747-3488378134)" d="M606 345h304" class="connection stroke-B1 s0" mask="url(#d2-1807852747)"/><path fill="none" marker-end="url(#mk-d2-1807852747-3488378134)" d="M1132.887 378.664C1217.4 408.4 1254.8 416 1314 416" class="connection stroke-B1 s0" mask="url(#d2-1807852747)"/><text x="1222" y="415" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1807852747-3488378134)" d="M1132.887 311.336C1217.4 281.6 1255.1 274 1315.5 274" class="connection stroke-B1 s0" mask="url(#d2-1807852747)"/><text x="1223" y="286" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-1807852747-3488378134)" d="M1582.901 315.62C1654.6 339 1688.8 345 1748 345" class="connection stroke-B1 s0" mask="url(#d2-1807852747)"/><text x="1665" y="346" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1807852747-3488378134)" d="M1582.901 232.38C1654.6 209 1712.4 203 1866 203" class="connection stroke-B1 s0" mask="url(#d2-1807852747)"/><text x="1723" y="209" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-1807852747-3488378134)" d="M2126.948 232.455C2282.6 268.8 2337.8 278 2397 278" class="connection stroke-B1 s0" mask="url(#d2-1807852747)"/><text x="2262" y="269" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1807852747-3488378134)" d="M2126.948 173.545C2282.6 137.2 2353.1 128 2473.5 128" class="connection stroke-B1 s0" mask="url(#d2-1807852747)"/><text x="2299" y="141" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-1807852747-3488378134)" d="M2692.414 95.395C2814.1 58.395 2870.3 49 2967.5 49" class="connection stroke-B1 s0" mask="url(#d2-1807852747)"/><text x="2828" y="62" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-1807852747-3488378134)" d="M2692.414 160.604C2814.1 197.604 2860.8 207 2920 207" class="connection stroke-B1 s0" mask="url(#d2-1807852747)"/><text x="2805" y="200" class="text-italic fill-N2 s1">예</text><mask id="d2-1807852747" width="3598" height="823" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3598v823H-101z"/><path d="M1191 399h62v21h-62zM1211 270h24v21h-24zM1634 330h62v21h-62zM1711 193h24v21h-24zM2231 253h62v21h-62zM2287 125h24v21h-24zM2797 46h62v21h-62zM2793 184h24v21h-24z"/></mask></svg>