<svg xmlns="http://www.w3.org/2000/svg" width="2333" height="1844" class="d2-2425367786 d2-svg" viewBox="-101 -101 2333 1844"><rect width="2333" height="1844" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2425367786 .fill-N1{fill:#0a0f25}.d2-2425367786 .fill-B6{fill:#f7f8fe}.d2-2425367786 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="499.5" cy="35.5" class="shape stroke-B1 fill-B6 s0" rx="106.5" ry="35.5"/></g><text x="499.5" y="41" class="text-bold fill-N1 s1">산문 한 문단</text></g><g ><g class="shape"><path d="M204 171h591v98H204z" class="stroke-B1 fill-B6 s0"/></g><text x="499.5" y="209.5" class="text-bold fill-N1 s1"><tspan x="499.5" dy="0">① 결론을 찾는다</tspan><tspan x="499.5" dy="17.667">이 글이 나를 무엇에 설득하려 하는가.</tspan><tspan x="499.5" dy="17.667">‘따라서’, ‘그러므로’ 뒤를 먼저 보되, 표시가 없는 글이 더 많다</tspan></text></g><g ><g class="shape"><path d="M0 369h639v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="319.5" y="407.5" class="text-bold fill-N1 s1"><tspan x="319.5" dy="0">② 결론과 무관한 문장을 걷어낸다</tspan><tspan x="319.5" dy="17.667">배경 설명, 같은 말의 반복, 예시, 감정을 싣는 표현.</tspan><tspan x="319.5" dy="17.667">걷어낸 것은 지우지 말고 따로 적어 둔다 — 나중에 다시 필요할 수 있다</tspan></text></g><g ><g class="shape"><path d="M124 567h391v98H124z" class="stroke-B1 fill-B6 s0"/></g><text x="319.5" y="605.5" class="text-bold fill-N1 s1"><tspan x="319.5" dy="0">③ 남은 문장을 주장 하나씩으로 쪼갠다</tspan><tspan x="319.5" dy="17.667">한 문장에 두 주장이 들어 있으면 나눈다.</tspan><tspan x="319.5" dy="17.667">‘A 이고 B 이므로’ 는 전제 두 개다</tspan></text></g><g ><g class="shape"><path d="M135 765h370v82H135z" class="stroke-B1 fill-B6 s0"/></g><text x="320" y="803.5" class="text-bold fill-N1 s1"><tspan x="320" dy="0">④ 번호를 붙여 줄 세운다</tspan><tspan x="320" dy="18.5">(P1) (P2) … 전제, 그 아래 가로선, (C) 결론</tspan></text></g><g ><g class="shape"><path d="M41 947h558v98H41z" class="stroke-B1 fill-B6 s0"/></g><text x="320" y="985.5" class="text-bold fill-N1 s1"><tspan x="320" dy="0">⑤ 중간 결론을 표시한다</tspan><tspan x="320" dy="17.667">어떤 문장이 다른 전제에서 나오고 또 다른 것의 전제가 되면</tspan><tspan x="320" dy="17.667">논증이 하나가 아니라 여럿이다</tspan></text></g><g ><g class="shape"><path d="M53 1145h533v98H53z" class="stroke-B1 fill-B6 s0"/></g><text x="319.5" y="1183.5" class="text-bold fill-N1 s1"><tspan x="319.5" dy="0">⑥ 빠진 고리를 채운다</tspan><tspan x="319.5" dy="17.667">전제에서 결론으로 건너뛰는 자리에 숨은 전제를 적는다.</tspan><tspan x="319.5" dy="17.667">채워 넣은 것은 반드시 표시한다</tspan></text></g><g ><g class="shape"><path d="M237 1343h524v98H237z" class="stroke-B1 fill-B6 s0"/></g><text x="499" y="1381.5" class="text-bold fill-N1 s1"><tspan x="499" dy="0">⑦ 다시 읽고 자비의 원리로 점검한다</tspan><tspan x="499" dy="17.667">글쓴이가 이 재구성을 보고 ‘내 말이 맞다’ 고 할 것인가.</tspan><tspan x="499" dy="17.667">아니라면 더 강한 읽기가 남아 있다</tspan></text></g><g ><g class="shape"><ellipse cx="499.5" cy="1591.5" class="shape stroke-B1 fill-B6 s0" rx="151.5" ry="50.5"/></g><text x="499.5" y="1589" class="text-bold fill-N1 s1"><tspan x="499.5" dy="0">번호 붙은 논증</tspan><tspan x="499.5" dy="18.5">이제 평가할 수 있다</tspan></text></g><text x="1036.5" y="33" class="fill-N1 s1"><tspan x="1036.5" dy="0">②에서 가장 많이 실수한다. 수사와 전제를 가르는 기준은 ‘없애면 논증이 약해지는가’ 다.</tspan><tspan x="1036.5" dy="18.5">없애도 결론을 받아들일 이유가 그대로면 그것은 전제가 아니다</tspan></text><text x="1799" y="25" class="fill-N1 s1"><tspan x="1799" dy="0">재구성은 글쓴이의 말을 바꾸는 일이다. 그러므로 무엇을 바꿨는지 남겨야 한다.</tspan><tspan x="1799" dy="17.667">걷어낸 문장, 채워 넣은 전제, 나눠 놓은 문장 — 셋 다 표시하면</tspan><tspan x="1799" dy="17.667">상대가 ‘그건 내 말이 아니다’ 라고 할 때 어디를 고칠지 바로 찾을 수 있다</tspan></text><marker id="mk-d2-2425367786-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2425367786-3488378134)" d="M499.01 73c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-2425367786)"/><path fill="none" marker-end="url(#mk-d2-2425367786-3488378134)" d="M408.747 269.963C337.7 309 319.5 329 319.5 365" class="connection stroke-B1 s0" mask="url(#d2-2425367786)"/><path fill="none" marker-end="url(#mk-d2-2425367786-3488378134)" d="M319.5 469v94" class="connection stroke-B1 s0" mask="url(#d2-2425367786)"/><path fill="none" marker-end="url(#mk-d2-2425367786-3488378134)" d="M319.5 667v94" class="connection stroke-B1 s0" mask="url(#d2-2425367786)"/><path fill="none" marker-end="url(#mk-d2-2425367786-3488378134)" d="M319.5 849v94" class="connection stroke-B1 s0" mask="url(#d2-2425367786)"/><path fill="none" marker-end="url(#mk-d2-2425367786-3488378134)" d="M319.5 1047v94" class="connection stroke-B1 s0" mask="url(#d2-2425367786)"/><path fill="none" marker-end="url(#mk-d2-2425367786-3488378134)" d="M319.5 1245c0 38 18.2 58 87.494 96.074" class="connection stroke-B1 s0" mask="url(#d2-2425367786)"/><path fill="none" marker-end="url(#mk-d2-2425367786-3488378134)" d="M499.25 1443c0 38-.05 58-.23 94" class="connection stroke-B1 s0" mask="url(#d2-2425367786)"/><path fill="none" marker-end="url(#mk-d2-2425367786-3488378134)" d="M589.753 1342.037C660.8 1303 679 1273.2 679 1243.5v-776c0-29.7-18.2-158.5-87.494-196.574" class="connection stroke-B1 s0" mask="url(#d2-2425367786)"/><text x="679.5" y="813" style="fill:#676c7e;text-anchor:middle;font-size:16px">읽기가 바뀌면 결론부터 다시</text><mask id="d2-2425367786" width="2333" height="1844" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2333v1844H-101z"/><path d="M557 797h245v21H557z"/></mask></svg>