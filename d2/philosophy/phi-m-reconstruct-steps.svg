<svg xmlns="http://www.w3.org/2000/svg" width="866" height="2061" class="d2-1652301619 d2-svg" viewBox="-150 -101 866 2061"><rect width="866" height="2061" x="-150" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1652301619 .fill-N1{fill:#0a0f25}.d2-1652301619 .fill-B6{fill:#f7f8fe}.d2-1652301619 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="378.5" cy="35.5" class="shape stroke-B1 fill-B6 s0" rx="106.5" ry="35.5"/></g><text x="378.5" y="41" class="text-bold fill-N1 s1">산문 한 문단</text></g><g ><g class="shape"><path d="M192 171h374v114H192z" class="stroke-B1 fill-B6 s0"/></g><text x="379" y="209.5" class="text-bold fill-N1 s1"><tspan x="379" dy="0">① 결론을 찾는다</tspan><tspan x="379" dy="17.25">이 글이 나를 무엇에 설득하려 하는가.</tspan><tspan x="379" dy="17.25">‘따라서’, ‘그러므로’ 뒤를 먼저 보되,</tspan><tspan x="379" dy="17.25">표시가 없는 글이 더 많다</tspan></text></g><g ><g class="shape"><path d="M0 385h473v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="236.5" y="423.5" class="text-bold fill-N1 s1"><tspan x="236.5" dy="0">② 결론과 무관한 문장을 걷어낸다</tspan><tspan x="236.5" dy="17.25">배경 설명, 같은 말의 반복, 예시, 감정을 싣는 표현.</tspan><tspan x="236.5" dy="17.25">걷어낸 것은 지우지 말고 따로 적어 둔다 —</tspan><tspan x="236.5" dy="17.25">나중에 다시 필요할 수 있다</tspan></text></g><g ><g class="shape"><path d="M41 599h391v98H41z" class="stroke-B1 fill-B6 s0"/></g><text x="236.5" y="637.5" class="text-bold fill-N1 s1"><tspan x="236.5" dy="0">③ 남은 문장을 주장 하나씩으로 쪼갠다</tspan><tspan x="236.5" dy="17.667">한 문장에 두 주장이 들어 있으면 나눈다.</tspan><tspan x="236.5" dy="17.667">‘A 이고 B 이므로’ 는 전제 두 개다</tspan></text></g><g ><g class="shape"><path d="M52 797h370v82H52z" class="stroke-B1 fill-B6 s0"/></g><text x="237" y="835.5" class="text-bold fill-N1 s1"><tspan x="237" dy="0">④ 번호를 붙여 줄 세운다</tspan><tspan x="237" dy="18.5">(P1) (P2) … 전제, 그 아래 가로선, (C) 결론</tspan></text></g><g ><g class="shape"><path d="M67 979h340v114H67z" class="stroke-B1 fill-B6 s0"/></g><text x="237" y="1017.5" class="text-bold fill-N1 s1"><tspan x="237" dy="0">⑤ 중간 결론을 표시한다</tspan><tspan x="237" dy="17.25">어떤 문장이 다른 전제에서 나오고</tspan><tspan x="237" dy="17.25">또 다른 것의 전제가 되면</tspan><tspan x="237" dy="17.25">논증이 하나가 아니라 여럿이다</tspan></text></g><g ><g class="shape"><path d="M58 1193h357v114H58z" class="stroke-B1 fill-B6 s0"/></g><text x="236.5" y="1231.5" class="text-bold fill-N1 s1"><tspan x="236.5" dy="0">⑥ 빠진 고리를 채운다</tspan><tspan x="236.5" dy="17.25">전제에서 결론으로 건너뛰는 자리에</tspan><tspan x="236.5" dy="17.25">숨은 전제를 적는다.</tspan><tspan x="236.5" dy="17.25">채워 넣은 것은 반드시 표시한다</tspan></text></g><g ><g class="shape"><path d="M202 1407h354v114H202z" class="stroke-B1 fill-B6 s0"/></g><text x="379" y="1445.5" class="text-bold fill-N1 s1"><tspan x="379" dy="0">⑦ 다시 읽고 자비의 원리로 점검한다</tspan><tspan x="379" dy="17.25">글쓴이가 이 재구성을 보고</tspan><tspan x="379" dy="17.25">‘내 말이 맞다’ 고 할 것인가.</tspan><tspan x="379" dy="17.25">아니라면 더 강한 읽기가 남아 있다</tspan></text></g><g ><g class="shape"><ellipse cx="378.5" cy="1671.5" class="shape stroke-B1 fill-B6 s0" rx="151.5" ry="50.5"/></g><text x="378.5" y="1669" class="text-bold fill-N1 s1"><tspan x="378.5" dy="0">번호 붙은 논증</tspan><tspan x="378.5" dy="18.5">이제 평가할 수 있다</tspan></text></g><text x="283" y="1758" class="fill-N1 s1"><tspan x="283" dy="0">②에서 가장 많이 실수한다.</tspan><tspan x="283" dy="16.714">수사와 전제를 가르는 기준은 ‘없애면 논증이 약해지는가’ 다.</tspan><tspan x="283" dy="16.714">없애도 결론을 받아들일 이유가 그대로면 그것은 전제가 아니다</tspan><tspan x="283" dy="16.714"> </tspan><tspan x="283" dy="16.714">재구성은 글쓴이의 말을 바꾸는 일이다. 그러므로 무엇을 바꿨는지 남겨야 한다.</tspan><tspan x="283" dy="16.714">걷어낸 문장, 채워 넣은 전제, 나눠 놓은 문장 — 셋 다 표시하면</tspan><tspan x="283" dy="16.714">상대가 ‘그건 내 말이 아니다’ 라고 할 때 어디를 고칠지 바로 찾을 수 있다</tspan></text><marker id="mk-d2-1652301619-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1652301619-3488378134)" d="M378.99 73c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-1652301619)"/><path fill="none" marker-end="url(#mk-d2-1652301619-3488378134)" d="M300.906 286.208C249.7 325 236.5 345 236.5 381" class="connection stroke-B1 s0" mask="url(#d2-1652301619)"/><path fill="none" marker-end="url(#mk-d2-1652301619-3488378134)" d="M236.5 501v94" class="connection stroke-B1 s0" mask="url(#d2-1652301619)"/><path fill="none" marker-end="url(#mk-d2-1652301619-3488378134)" d="M236.5 699v94" class="connection stroke-B1 s0" mask="url(#d2-1652301619)"/><path fill="none" marker-end="url(#mk-d2-1652301619-3488378134)" d="M236.5 881v94" class="connection stroke-B1 s0" mask="url(#d2-1652301619)"/><path fill="none" marker-end="url(#mk-d2-1652301619-3488378134)" d="M236.5 1095v94" class="connection stroke-B1 s0" mask="url(#d2-1652301619)"/><path fill="none" marker-end="url(#mk-d2-1652301619-3488378134)" d="M236.5 1309c0 38 13.2 58 62.812 95.585" class="connection stroke-B1 s0" mask="url(#d2-1652301619)"/><path fill="none" marker-end="url(#mk-d2-1652301619-3488378134)" d="M378.75 1523c0 38 .05 58 .23 94" class="connection stroke-B1 s0" mask="url(#d2-1652301619)"/><path fill="none" marker-end="url(#mk-d2-1652301619-3488378134)" d="M456.594 1405.792C507.8 1367 521 1335.6 521 1303.5v-808c0-32.1-13.2-170.5-62.812-208.085" class="connection stroke-B1 s0" mask="url(#d2-1652301619)"/><text x="521.5" y="845" style="fill:#676c7e;text-anchor:middle;font-size:16px"><tspan x="521.5" dy="0">읽기가 바뀌면</tspan><tspan x="521.5" dy="18.5">결론부터 다시</tspan></text><mask id="d2-1652301619" width="866" height="2061" x="-150" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-150-101h866v2061h-866z"/><path d="M460 829h123v37H460z"/></mask></svg>