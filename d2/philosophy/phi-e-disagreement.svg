<svg xmlns="http://www.w3.org/2000/svg" width="2882" height="701" class="d2-2391696421 d2-svg" viewBox="-101 -101 2882 701"><rect width="2882" height="701" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2391696421 .fill-N1{fill:#0a0f25}.d2-2391696421 .fill-N2{fill:#676c7e}.d2-2391696421 .fill-B6{fill:#f7f8fe}.d2-2391696421 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M0 0h412v66H0z" class="stroke-B1 fill-B6 s0"/></g><text x="206" y="38.5" class="text-bold fill-N1 s1">(P1) 도덕에는 깊고 오래가는 불일치가 있다</text></g><g ><g class="shape"><path d="M472 0h671v66H472z" class="stroke-B1 fill-B6 s0"/></g><text x="807.5" y="38.5" class="text-bold fill-N1 s1">(P2) 그 불일치는 사실에 대한 무지나 오류나 비합리로 다 설명되지 않는다</text></g><g ><g class="shape"><path d="M1203 0h775v66h-775z" class="stroke-B1 fill-B6 s0"/></g><text x="1590.5" y="38.5" class="text-bold fill-N1 s1">(P3) 객관적 사실이 있는 영역이라면 이런 불일치가 이렇게까지 남아 있지 않을 것이다</text></g><g ><g class="shape"><path d="M48 211h363v66H48z" class="stroke-B1 fill-B6 s0"/></g><text x="229.5" y="249.5" class="text-bold fill-N1 s1">(C) 그러므로 객관적 도덕 사실은 없다</text></g><g ><g class="shape"><path d="M901 187h666v114H901z" class="stroke-B1 fill-B6 s0"/></g><text x="1234" y="225.5" class="text-bold fill-N1 s1"><tspan x="1234" dy="0">(P2)를 끊는다</tspan><tspan x="1234" dy="17.25">불일치의 상당 부분이 도덕 아닌 사실에 대한 불일치에서 온다.</tspan><tspan x="1234" dy="17.25">무엇이 실제로 일어나는지, 누가 무엇을 겪는지가 갈리면 판정도 갈린다.</tspan><tspan x="1234" dy="17.25">이해관계와 이념이 판단을 굽히는 것도 설명이 된다</tspan></text></g><g ><g class="shape"><path d="M1656 187h666v114h-666z" class="stroke-B1 fill-B6 s0"/></g><text x="1989" y="225.5" class="text-bold fill-N1 s1"><tspan x="1989" dy="0">(P3)을 끊는다</tspan><tspan x="1989" dy="17.25">오래가는 불일치는 다른 곳에도 있다. 수학의 기초와 형이상학이 그렇다.</tspan><tspan x="1989" dy="17.25">그런데 거기서 반실재론을 끌어내는 사람은 드물다.</tspan><tspan x="1989" dy="17.25">또 도덕에는 실제로 수렴한 자리도 있다</tspan></text></g><g ><g class="shape"><path d="M1327 401h598v98h-598z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="1626" y="439.5" class="text-bold fill-N1 s1"><tspan x="1626" dy="0">반실재론 쪽의 재반론</tspan><tspan x="1626" dy="17.667">그 설명들을 다 걷어내도 남는 불일치가 있고, 그것이 문제다.</tspan><tspan x="1626" dy="17.667">그리고 수렴은 도덕적 수렴이 아니라 힘과 제도의 수렴일 수 있다</tspan></text></g><text x="2359" y="23" class="fill-N1 s1"><tspan x="2359" dy="0">판정 — 미결. 이 논증은 반실재론 쪽의 가장 강한 무기이지만 결정적이지 않고,</tspan><tspan x="2359" dy="17.667">실재론 쪽의 응답도 불일치를 다 해소하지 못한다.</tspan><tspan x="2359" dy="17.667">같은 사실이 오류 이론의 상대성 논증에도 쓰인다</tspan></text><marker id="mk-d2-2391696421-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2391696421-3488378134)" d="M206 67.5c0 46.8 3.4 76 16.216 140.078" class="connection stroke-B1 s0" mask="url(#d2-2391696421)"/><path fill="none" marker-end="url(#mk-d2-2391696421-3488378134)" d="M702.848 66.117C554.35 114.3 475.55 143.5 314.448 209.974" class="connection stroke-B1 s0" mask="url(#d2-2391696421)"/><path fill="none" marker-end="url(#mk-d2-2391696421-3488378134)" d="M1351.27 65.778C1005.25 114.3 816.85 143.9 415.191 212.823" class="connection stroke-B1 s0" mask="url(#d2-2391696421)"/><path fill="none" marker-end="url(#mk-d2-2391696421-3488378134)" d="M959.953 65.932C1178.8 114.3 1234 138.7 1234 183.5" class="connection stroke-B1 s0" mask="url(#d2-2391696421)"/><text x="1122" y="107" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-2391696421-3488378134)" d="M1732.446 65.96C1936.9 114.3 1988.5 138.7 1988.5 183.5" class="connection stroke-B1 s0" mask="url(#d2-2391696421)"/><text x="1885" y="108" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-2391696421-3488378134)" d="M1234 303c0 38 39.6 58 194.122 97.02" class="connection stroke-B1 s0" mask="url(#d2-2391696421)"/><path fill="none" marker-end="url(#mk-d2-2391696421-3488378134)" d="M1988.5 303c0 38-36.6 58-179.141 96.946" class="connection stroke-B1 s0" mask="url(#d2-2391696421)"/><mask id="d2-2391696421" width="2882" height="701" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2882v701H-101z"/><path d="M1070 91h104v21h-104zM1833 92h104v21h-104z"/></mask></svg>