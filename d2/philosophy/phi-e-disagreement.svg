<svg xmlns="http://www.w3.org/2000/svg" width="1116" height="993" class="d2-4238256737 d2-svg" viewBox="-89 -89 1116 993"><rect width="1116" height="993" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4238256737 .fill-N1{fill:#0a0f25}.d2-4238256737 .fill-N2{fill:#676c7e}.d2-4238256737 .fill-B6{fill:#f7f8fe}.d2-4238256737 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M374 28h168v98H374z" class="stroke-B1 fill-B6 s0"/></g><text x="458" y="66.5" class="text-bold fill-N1 s1"><tspan x="458" dy="0">(P1) 도덕에는</tspan><tspan x="458" dy="17.667">깊고 오래가는</tspan><tspan x="458" dy="17.667">불일치가 있다</tspan></text></g><g ><g class="shape"><path d="M135 12h212v114H135z" class="stroke-B1 fill-B6 s0"/></g><text x="241" y="50.5" class="text-bold fill-N1 s1"><tspan x="241" dy="0">(P2) 그 불일치는</tspan><tspan x="241" dy="17.25">사실에 대한 무지나</tspan><tspan x="241" dy="17.25">오류나 비합리로</tspan><tspan x="241" dy="17.25">다 설명되지 않는다</tspan></text></g><g ><g class="shape"><path d="M562 12h272v114H562z" class="stroke-B1 fill-B6 s0"/></g><text x="698" y="50.5" class="text-bold fill-N1 s1"><tspan x="698" dy="0">(P3) 객관적 사실이 있는</tspan><tspan x="698" dy="17.25">영역이라면 이런 불일치가</tspan><tspan x="698" dy="17.25">이렇게까지 남아 있지</tspan><tspan x="698" dy="17.25">않을 것이다</tspan></text></g><g ><g class="shape"><path d="M277 206h363v66H277z" class="stroke-B1 fill-B6 s0"/></g><text x="458.5" y="244.5" class="text-bold fill-N1 s1">(C) 그러므로 객관적 도덕 사실은 없다</text></g><g ><g class="shape"><path d="M12 342h388v178H12z" class="stroke-B1 fill-B6 s0"/></g><text x="206" y="380.5" class="text-bold fill-N1 s1"><tspan x="206" dy="0">(P2)를 끊는다</tspan><tspan x="206" dy="16.625">불일치의 상당 부분이</tspan><tspan x="206" dy="16.625">도덕 아닌 사실에 대한 불일치에서 온다.</tspan><tspan x="206" dy="16.625">무엇이 실제로 일어나는지,</tspan><tspan x="206" dy="16.625">누가 무엇을 겪는지가 갈리면</tspan><tspan x="206" dy="16.625">판정도 갈린다.</tspan><tspan x="206" dy="16.625">이해관계와 이념이 판단을 굽히는 것도</tspan><tspan x="206" dy="16.625">설명이 된다</tspan></text></g><g ><g class="shape"><path d="M561 350h365v162H561z" class="stroke-B1 fill-B6 s0"/></g><text x="743.5" y="388.5" class="text-bold fill-N1 s1"><tspan x="743.5" dy="0">(P3)을 끊는다</tspan><tspan x="743.5" dy="16.714">오래가는 불일치는 다른 곳에도 있다.</tspan><tspan x="743.5" dy="16.714">수학의 기초와 형이상학이 그렇다.</tspan><tspan x="743.5" dy="16.714">그런데 거기서 반실재론을</tspan><tspan x="743.5" dy="16.714">끌어내는 사람은 드물다.</tspan><tspan x="743.5" dy="16.714">또 도덕에는 실제로</tspan><tspan x="743.5" dy="16.714">수렴한 자리도 있다</tspan></text></g><g ><g class="shape"><path d="M258 600h433v130H258z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="474.5" y="638.5" class="text-bold fill-N1 s1"><tspan x="474.5" dy="0">반실재론 쪽의 재반론</tspan><tspan x="474.5" dy="17">그 설명들을 다 걷어내도 남는 불일치가 있고,</tspan><tspan x="474.5" dy="17">그것이 문제다.</tspan><tspan x="474.5" dy="17">그리고 수렴은 도덕적 수렴이 아니라</tspan><tspan x="474.5" dy="17">힘과 제도의 수렴일 수 있다</tspan></text></g><text x="469" y="766" class="fill-N1 s1"><tspan x="469" dy="0">판정 — 미결. 이 논증은 반실재론 쪽의 가장 강한 무기이지만 결정적이지 않고,</tspan><tspan x="469" dy="17.667">실재론 쪽의 응답도 불일치를 다 해소하지 못한다.</tspan><tspan x="469" dy="17.667">같은 사실이 오류 이론의 상대성 논증에도 쓰인다</tspan></text><marker id="mk-d2-4238256737-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4238256737-3488378134)" d="M458.5 128v74" class="connection stroke-B1 s0" mask="url(#d2-4238256737)"/><path fill="none" marker-end="url(#mk-d2-4238256737-3488378134)" d="M276.666 128v28s0 10 10 10h71.084s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4238256737)"/><path fill="none" marker-end="url(#mk-d2-4238256737-3488378134)" d="M653.166 128v28s0 10-10 10H559.25s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4238256737)"/><path fill="none" marker-end="url(#mk-d2-4238256737-3488378134)" d="M206 128v210" class="connection stroke-B1 s0" mask="url(#d2-4238256737)"/><text x="206" y="240" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-4238256737-3488378134)" d="M743.833 128v218" class="connection stroke-B1 s0" mask="url(#d2-4238256737)"/><text x="744" y="244" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-4238256737-3488378134)" d="M206 522v28s0 10 10 10h176.75s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4238256737)"/><path fill="none" marker-end="url(#mk-d2-4238256737-3488378134)" d="M743.833 514v36s0 10-10 10h-176.75s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4238256737)"/><mask id="d2-4238256737" width="1116" height="993" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1116v993H-89z"/><path d="M154 224h104v21H154zM692 228h104v21H692z"/></mask></svg>