<svg xmlns="http://www.w3.org/2000/svg" width="1114" height="1404" class="d2-3898891451 d2-svg" viewBox="-101 -101 1114 1404"><rect width="1114" height="1404" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3898891451 .text-bold{font-weight:700}.d2-3898891451 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3898891451 .fill-N1{fill:#0a0f25}.d2-3898891451 .fill-N2{fill:#676c7e}.d2-3898891451 .fill-B6{fill:#f7f8fe}.d2-3898891451 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="462" cy="69.5" class="shape stroke-B1 fill-B6 s0" rx="209" ry="69.5"/></g><text x="462" y="59" class="text-bold fill-N1 s1"><tspan x="462" dy="0">동물원 우리 앞.</tspan><tspan x="462" dy="17.667">줄무늬 짐승이 서 있고</tspan><tspan x="462" dy="17.667">팻말에 얼룩말이라 적혀 있다</tspan></text></g><g ><g class="shape"><path d="M156 247h272v66H156z" class="stroke-B1 fill-B6 s0"/></g><text x="292" y="285.5" class="text-bold fill-N1 s1">저것이 얼룩말임을 아는가</text></g><g ><g class="shape"><path d="M488 239h276v82H488z" class="stroke-B1 fill-B6 s0"/></g><text x="626" y="277.5" class="text-bold fill-N1 s1"><tspan x="626" dy="0">저것이 얼룩말로 정교하게</tspan><tspan x="626" dy="18.5">칠한 노새가 아님을 아는가</tspan></text></g><g ><g class="shape"><path d="M166 450h252v98H166z" class="stroke-B1 fill-B6 s0"/></g><text x="292" y="488.5" class="text-bold fill-N1 s1"><tspan x="292" dy="0">안다</tspan><tspan x="292" dy="17.667">동물원이고 팻말이 있고</tspan><tspan x="292" dy="17.667">생김새가 얼룩말이다</tspan></text></g><g ><g class="shape"><path d="M509 442h235v114H509z" class="stroke-B1 fill-B6 s0"/></g><text x="626.5" y="480.5" class="text-bold fill-N1 s1"><tspan x="626.5" dy="0">모른다</tspan><tspan x="626.5" dy="17.25">칠한 노새와 얼룩말은</tspan><tspan x="626.5" dy="17.25">내가 서 있는 자리에서</tspan><tspan x="626.5" dy="17.25">똑같아 보인다</tspan></text></g><g ><g class="shape"><ellipse cx="462" cy="729.5" class="shape stroke-B1 fill-B6 s0" rx="208" ry="73.5"/></g><text x="462" y="703" class="text-bold fill-N1 s1"><tspan x="462" dy="0">그런데 얼룩말이라면</tspan><tspan x="462" dy="17">칠한 노새가 아니다.</tspan><tspan x="462" dy="17">폐쇄 원리대로라면</tspan><tspan x="462" dy="17">앞을 알 때 뒤도 알아야 한다 —</tspan><tspan x="462" dy="17">두 대답이 함께 참일 수 없다</tspan></text></g><g ><g class="shape"><path d="M0 903h272v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="136" y="941.5" class="text-bold fill-N1 s1"><tspan x="136" dy="0">드레츠키 —</tspan><tspan x="136" dy="16.833">폐쇄 원리를 버린다.</tspan><tspan x="136" dy="16.833">앎이 요구하는 것은</tspan><tspan x="136" dy="16.833">관련된 대안의 배제뿐이고</tspan><tspan x="136" dy="16.833">칠한 노새는 이 자리에서</tspan><tspan x="136" dy="16.833">관련된 대안이 아니다</tspan></text></g><g ><g class="shape"><path d="M332 903h260v146H332z" class="stroke-B1 fill-B6 s0"/></g><text x="462" y="941.5" class="text-bold fill-N1 s1"><tspan x="462" dy="0">맥락주의 — 두 물음이</tspan><tspan x="462" dy="16.833">서로 다른 맥락을 만든다.</tspan><tspan x="462" dy="16.833">둘째 물음을 던지는 순간</tspan><tspan x="462" dy="16.833">기준이 올라가고,</tspan><tspan x="462" dy="16.833">그 올라간 맥락에서는</tspan><tspan x="462" dy="16.833">첫째 대답도 거짓이 된다</tspan></text></g><g ><g class="shape"><path d="M652 919h260v114H652z" class="stroke-B1 fill-B6 s0"/></g><text x="782" y="957.5" class="text-bold fill-N1 s1"><tspan x="782" dy="0">회의주의 —</tspan><tspan x="782" dy="17.25">첫째 대답이 그냥 틀렸다.</tspan><tspan x="782" dy="17.25">우리는 저것이</tspan><tspan x="782" dy="17.25">얼룩말임을 알지 못한다</tspan></text></g><text x="299.5" y="1165" class="fill-N1 s1"><tspan x="299.5" dy="0">어느 길을 가든 남는 물음 —</tspan><tspan x="299.5" dy="17.667">무엇이 관련된 대안인지를 무엇이 정하는가.</tspan><tspan x="299.5" dy="17.667">이 물음에 합의된 답은 없다</tspan></text><marker id="mk-d2-3898891451-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M371.364 133.151C308.2 177.6 292 200.6 292 243" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M549.625 134.166C610.4 177.8 626 199 626 235" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M292 314.5v132" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><text x="292" y="387" class="text-italic fill-N2 s1">자연스러운 대답</text><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M626 322.5v116" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><text x="626" y="387" class="text-italic fill-N2 s1">자연스러운 대답</text><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M292 550c0 44.4 15.8 67.4 75.756 110.66" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M626 558c0 38-15 59.4-71.815 102.58" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M318.13 783.711C172.8 839 136 863 136 899" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M462 805v94" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M603.867 784.716C746 839.2 782 866.2 782 915" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M136 1051c0 38 21.4 58 103.376 96.307" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><path fill="none" marker-end="url(#mk-d2-3898891451-3488378134)" d="M462 1051c0 38-21.4 58-103.376 96.307" class="connection stroke-B1 s0" mask="url(#d2-3898891451)"/><mask id="d2-3898891451" width="1114" height="1404" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d=