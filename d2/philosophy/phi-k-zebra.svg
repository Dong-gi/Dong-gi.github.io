<svg xmlns="http://www.w3.org/2000/svg" width="1596" height="1521" class="d2-3879198425 d2-svg" viewBox="-101 -101 1596 1521"><rect width="1596" height="1521" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3879198425 .fill-N1{fill:#0a0f25}.d2-3879198425 .fill-N2{fill:#676c7e}.d2-3879198425 .fill-B6{fill:#f7f8fe}.d2-3879198425 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="730.5" cy="148" class="shape stroke-B1 fill-B6 s0" rx="443.5" ry="148"/></g><text x="730.5" y="153.5" class="text-bold fill-N1 s1">동물원 우리 앞. 줄무늬 짐승이 서 있고 팻말에 얼룩말이라 적혀 있다</text></g><g ><g class="shape"><path d="M299 396h272v66H299z" class="stroke-B1 fill-B6 s0"/></g><text x="435" y="434.5" class="text-bold fill-N1 s1">저것이 얼룩말임을 아는가</text></g><g ><g class="shape"><path d="M739 396h508v66H739z" class="stroke-B1 fill-B6 s0"/></g><text x="993" y="434.5" class="text-bold fill-N1 s1">저것이 얼룩말로 정교하게 칠한 노새가 아님을 아는가</text></g><g ><g class="shape"><path d="M214 583h441v82H214z" class="stroke-B1 fill-B6 s0"/></g><text x="434.5" y="621.5" class="text-bold fill-N1 s1"><tspan x="434.5" dy="0">안다</tspan><tspan x="434.5" dy="18.5">동물원이고 팻말이 있고 생김새가 얼룩말이다</tspan></text></g><g ><g class="shape"><path d="M715 583h555v82H715z" class="stroke-B1 fill-B6 s0"/></g><text x="992.5" y="621.5" class="text-bold fill-N1 s1"><tspan x="992.5" dy="0">모른다</tspan><tspan x="992.5" dy="18.5">칠한 노새와 얼룩말은 내가 서 있는 자리에서 똑같아 보인다</tspan></text></g><g ><g class="shape"><ellipse cx="731" cy="874.5" class="shape stroke-B1 fill-B6 s0" rx="329" ry="109.5"/></g><text x="731" y="864" class="text-bold fill-N1 s1"><tspan x="731" dy="0">그런데 얼룩말이라면 칠한 노새가 아니다.</tspan><tspan x="731" dy="17.667">폐쇄 원리대로라면 앞을 알 때 뒤도 알아야 한다 —</tspan><tspan x="731" dy="17.667">두 대답이 함께 참일 수 없다</tspan></text></g><g ><g class="shape"><path d="M0 1084h447v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="223.5" y="1122.5" class="text-bold fill-N1 s1"><tspan x="223.5" dy="0">드레츠키 — 폐쇄 원리를 버린다.</tspan><tspan x="223.5" dy="17.667">앎이 요구하는 것은 관련된 대안의 배제뿐이고</tspan><tspan x="223.5" dy="17.667">칠한 노새는 이 자리에서 관련된 대안이 아니다</tspan></text></g><g ><g class="shape"><path d="M507 1084h447v98H507z" class="stroke-B1 fill-B6 s0"/></g><text x="730.5" y="1122.5" class="text-bold fill-N1 s1"><tspan x="730.5" dy="0">맥락주의 — 두 물음이 서로 다른 맥락을 만든다.</tspan><tspan x="730.5" dy="17.667">둘째 물음을 던지는 순간 기준이 올라가고,</tspan><tspan x="730.5" dy="17.667">그 올라간 맥락에서는 첫째 대답도 거짓이 된다</tspan></text></g><g ><g class="shape"><path d="M1014 1092h380v82h-380z" class="stroke-B1 fill-B6 s0"/></g><text x="1204" y="1130.5" class="text-bold fill-N1 s1"><tspan x="1204" dy="0">회의주의 — 첫째 대답이 그냥 틀렸다.</tspan><tspan x="1204" dy="18.5">우리는 저것이 얼룩말임을 알지 못한다</tspan></text></g><text x="477" y="1298" class="fill-N1 s1"><tspan x="477" dy="0">어느 길을 가든 남는 물음 — 무엇이 관련된 대안인지를</tspan><tspan x="477" dy="18.5">무엇이 정하는가. 이 물음에 합의된 답은 없다</tspan></text><marker id="mk-d2-3879198425-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M531.332 282.104C454.4 333 434.75 356 434.75 392" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M911.591 284.212C976.2 333.4 992.75 356 992.75 392" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M434.75 463.5v116" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><text x="435" y="528" class="text-italic fill-N2 s1">자연스러운 대답</text><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M992.75 463.5v116" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><text x="993" y="528" class="text-italic fill-N2 s1">자연스러운 대답</text><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M434.75 667c0 38 24.65 61.2 119.724 112.112" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M992.75 667c0 38-20.75 60.6-100.331 108.924" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M490.091 950.597C277.2 1017.2 223.5 1044 223.5 1080" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M730.98 986c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M963.894 952.642C1155.6 1017.6 1204 1045.599 1204 1088" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M223.5 1184c0 38 37 58 181.139 96.956" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><path fill="none" marker-end="url(#mk-d2-3879198425-3488378134)" d="M730.5 1184c0 38-37 58-181.139 96.956" class="connection stroke-B1 s0" mask="url(#d2-3879198425)"/><mask id="d2-3879198425" width="1596" height="1521" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1596v1521H-101z"/><path d="M364 512h142v21H364zM922 512h142v21H922z"/></mask></svg>