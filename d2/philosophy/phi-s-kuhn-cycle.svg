<svg xmlns="http://www.w3.org/2000/svg" width="1296" height="1112" class="d2-3270784992 d2-svg" viewBox="-101 -101 1296 1112"><rect width="1296" height="1112" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3270784992 .fill-N1{fill:#0a0f25}.d2-3270784992 .fill-N2{fill:#676c7e}.d2-3270784992 .fill-B6{fill:#f7f8fe}.d2-3270784992 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M151 0h400v82H151z" class="stroke-B1 fill-B6 s0"/></g><text x="351" y="38.5" class="text-bold fill-N1 s1"><tspan x="351" dy="0">전과학</tspan><tspan x="351" dy="18.5">학파들이 무엇을 사실로 칠지부터 다툰다</tspan></text></g><g ><g class="shape"><path d="M168 203h365v98H168z" class="stroke-B1 fill-B6 s0"/></g><text x="350.5" y="241.5" class="text-bold fill-N1 s1"><tspan x="350.5" dy="0">정상과학</tspan><tspan x="350.5" dy="17.667">하나의 패러다임 안에서 퍼즐을 푼다.</tspan><tspan x="350.5" dy="17.667">패러다임 자체는 검사 대상이 아니다</tspan></text></g><g ><g class="shape"><path d="M0 422h403v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="201.5" y="460.5" class="text-bold fill-N1 s1"><tspan x="201.5" dy="0">변칙 사례</tspan><tspan x="201.5" dy="18.5">패러다임이 예상한 대로 풀리지 않는 문제</tspan></text></g><g ><g class="shape"><path d="M64 625h276v82H64z" class="stroke-B1 fill-B6 s0"/></g><text x="202" y="663.5" class="text-bold fill-N1 s1"><tspan x="202" dy="0">위기</tspan><tspan x="202" dy="18.5">기초를 다시 묻기 시작한다</tspan></text></g><g ><g class="shape"><path d="M246 828h209v82H246z" class="stroke-B1 fill-B6 s0"/></g><text x="350.5" y="866.5" class="text-bold fill-N1 s1"><tspan x="350.5" dy="0">과학혁명</tspan><tspan x="350.5" dy="18.5">패러다임이 바뀐다</tspan></text></g><text x="852.5" y="31" class="text-bold fill-N1 s1"><tspan x="852.5" dy="0">포퍼라면 변칙 하나가 이론을 반증한다고 말할 자리에서</tspan><tspan x="852.5" dy="17.667">쿤은 그런 일이 실제로 일어나지 않는다고 말한다.</tspan><tspan x="852.5" dy="17.667">대안 없이 패러다임을 버리는 일은 없다는 것이다</tspan></text><marker id="mk-d2-3270784992-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3270784992-3488378134)" d="M350.75 83.5v116" class="connection stroke-B1 s0" mask="url(#d2-3270784992)"/><text x="351" y="148" class="text-italic fill-N2 s1">패러다임 하나가 자리를 잡으면</text><path fill="none" marker-end="url(#mk-d2-3270784992-3488378134)" d="M281.895 301.694C217.9 349.3 201.5 373.7 201.5 418.5" class="connection stroke-B1 s0" mask="url(#d2-3270784992)"/><text x="219.5" y="354" class="text-italic fill-N2 s1">변칙은 늘 있다. 처음에는 풀 퍼즐로 다룬다</text><path fill="none" marker-end="url(#mk-d2-3270784992-3488378134)" d="M201.5 505.5v116" class="connection stroke-B1 s0" mask="url(#d2-3270784992)"/><text x="202" y="570" class="text-italic fill-N2 s1">쌓이고, 끈질기고, 중요한 것일 때만</text><path fill="none" marker-end="url(#mk-d2-3270784992-3488378134)" d="M201.5 708.5c0 46.8 17.6 71.2 84.713 117.721" class="connection stroke-B1 s0" mask="url(#d2-3270784992)"/><text x="221.5" y="787" class="text-italic fill-N2 s1">쓸 만한 대안 패러다임이 나와 있을 때만</text><path fill="none" marker-end="url(#mk-d2-3270784992-3488378134)" d="M412.65 827.37C482.2 779.7 500 747.2 500 716.75v-203c0-30.45-16.2-164.45-77.805-210.844" class="connection stroke-B1 s0" mask="url(#d2-3270784992)"/><text x="500.5" y="574" class="text-italic fill-N2 s1">새 패러다임 아래 다시 퍼즐 풀기</text><mask id="d2-3270784992" width="1296" height="1112" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1296v1112H-101z"/><path d="M219 132h264v21H219zM42 338h355v21H42zM55 554h294v21H55zM56 771h331v21H56zM365 558h271v21H365z"/></mask></svg>