<svg xmlns="http://www.w3.org/2000/svg" width="1038" height="1121" class="d2-811785378 d2-svg" viewBox="-101 -101 1038 1121"><rect width="1038" height="1121" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-811785378 .text-bold{font-weight:700}.d2-811785378 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-811785378 .fill-N1{fill:#0a0f25}.d2-811785378 .fill-N2{fill:#676c7e}.d2-811785378 .fill-B6{fill:#f7f8fe}.d2-811785378 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M103 8h252v98H103z" class="stroke-B1 fill-B6 s0"/></g><text x="229" y="46.5" class="text-bold fill-N1 s1"><tspan x="229" dy="0">(P1) 거짓말은 나쁘다</tspan><tspan x="229" dy="17.667">여기서는 거짓말에 대한</tspan><tspan x="229" dy="17.667">반감이 표현된다</tspan></text></g><g ><g class="shape"><path d="M415 0h380v114H415z" class="stroke-B1 fill-B6 s0"/></g><text x="605" y="38.5" class="text-bold fill-N1 s1"><tspan x="605" dy="0">(P2) 거짓말이 나쁘다면,</tspan><tspan x="605" dy="17.25">동생에게 거짓말을 시키는 것도 나쁘다</tspan><tspan x="605" dy="17.25">여기서는 아무것도 표현되지 않는다.</tspan><tspan x="605" dy="17.25">앞부분은 주장되고 있지 않다</tspan></text></g><g ><g class="shape"><path d="M269 235h296v82H269z" class="stroke-B1 fill-B6 s0"/></g><text x="417" y="273.5" class="text-bold fill-N1 s1"><tspan x="417" dy="0">(C) 그러므로 동생에게</tspan><tspan x="417" dy="18.5">거짓말을 시키는 것도 나쁘다</tspan></text></g><g ><g class="shape"><path d="M158 438h518v146H158z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="417" y="476.5" class="text-bold fill-N1 s1"><tspan x="417" dy="0">문제 — 이 추론이 타당하려면</tspan><tspan x="417" dy="16.833">‘거짓말은 나쁘다’ 가 두 자리에서 같은 뜻이어야 한다.</tspan><tspan x="417" dy="16.833">그런데 비인지주의에 따르면</tspan><tspan x="417" dy="16.833">첫째 자리에서는 태도가 표현되고</tspan><tspan x="417" dy="16.833">둘째 자리에서는 표현되지 않는다.</tspan><tspan x="417" dy="16.833">뜻이 달라지면 이 추론은 애매어의 오류가 되어 버린다</tspan></text></g><g ><g class="shape"><path d="M0 684h385v162H0z" class="stroke-B1 fill-B6 s0"/></g><text x="192.5" y="722.5" class="text-bold fill-N1 s1"><tspan x="192.5" dy="0">응답 A — 준실재론</tspan><tspan x="192.5" dy="16.714">논리적 일관성을</tspan><tspan x="192.5" dy="16.714">태도들 사이의 일관성으로 다시 잡는다.</tspan><tspan x="192.5" dy="16.714">첫째 전제의 태도를 갖고</tspan><tspan x="192.5" dy="16.714">둘째 전제의 태도를 가지면서</tspan><tspan x="192.5" dy="16.714">결론의 태도를 갖지 않는 것은</tspan><tspan x="192.5" dy="16.714">태도의 앞뒤가 맞지 않는 일이다</tspan></text></g><g ><g class="shape"><path d="M445 692h391v146H445z" class="stroke-B1 fill-B6 s0"/></g><text x="640.5" y="730.5" class="text-bold fill-N1 s1"><tspan x="640.5" dy="0">응답 B — 규범 표현주의</tspan><tspan x="640.5" dy="16.833">도덕 문장이 표현하는 것을</tspan><tspan x="640.5" dy="16.833">태도가 아니라</tspan><tspan x="640.5" dy="16.833">‘어떤 규범 체계를 받아들임’ 으로 잡고,</tspan><tspan x="640.5" dy="16.833">논리를 그 받아들임에 대한</tspan><tspan x="640.5" dy="16.833">제약으로 다시 세운다</tspan></text></g><text x="418" y="882" class="fill-N1 s1"><tspan x="418" dy="0">평가 — 어느 응답도 논쟁을 끝내지 못했다. 반론은 이렇게 온다.</tspan><tspan x="418" dy="17.667">태도의 앞뒤가 맞지 않는 것과 문장이 서로 모순되는 것은 다른 일이고,</tspan><tspan x="418" dy="17.667">비인지주의는 뒤엣것을 앞엣것으로 갈아 끼우면서 무언가를 잃는다는 것이다</tspan></text><marker id="mk-d2-811785378-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-811785378-3488378134)" d="M228.5 107.5c0 53.2 22.2 79.2 107.494 126.074" class="connection stroke-B1 s0" mask="url(#d2-811785378)"/><text x="255.5" y="195" class="text-italic fill-N2 s1">전건 긍정</text><path fill="none" marker-end="url(#mk-d2-811785378-3488378134)" d="M604.5 115.5c0 46.8-22.2 71.2-107.494 118.074" class="connection stroke-B1 s0" mask="url(#d2-811785378)"/><path fill="none" marker-end="url(#mk-d2-811785378-3488378134)" d="M416.5 318.5v116" class="connection stroke-B1 s0" mask="url(#d2-811785378)"/><text x="417" y="383" class="text-italic fill-N2 s1">여기가 무너진다</text><path fill="none" marker-end="url(#mk-d2-811785378-3488378134)" d="M281.747 584.963C210.7 624 192.5 644 192.5 680" class="connection stroke-B1 s0" mask="url(#d2-811785378)"/><path fill="none" marker-end="url(#mk-d2-811785378-3488378134)" d="M551.253 584.963C622.3 624 640.5 645.6 640.5 688" class="connection stroke-B1 s0" mask="url(#d2-811785378)"/><mask id="d2-811785378" width="1038" height="1121" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H937v1121H-101z"/><path d="M213 179h85v21h-85zM346 367h142v21H346z"/></mask></svg>