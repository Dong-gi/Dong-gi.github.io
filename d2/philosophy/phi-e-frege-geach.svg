<svg xmlns="http://www.w3.org/2000/svg" width="2085" height="904" class="d2-1374639076 d2-svg" viewBox="-101 -101 2085 904"><rect width="2085" height="904" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1374639076 .fill-N1{fill:#0a0f25}.d2-1374639076 .fill-N2{fill:#676c7e}.d2-1374639076 .fill-B6{fill:#f7f8fe}.d2-1374639076 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M96 0h400v82H96z" class="stroke-B1 fill-B6 s0"/></g><text x="296" y="38.5" class="text-bold fill-N1 s1"><tspan x="296" dy="0">(P1) 거짓말은 나쁘다</tspan><tspan x="296" dy="18.5">여기서는 거짓말에 대한 반감이 표현된다</tspan></text></g><g ><g class="shape"><path d="M556 0h617v82H556z" class="stroke-B1 fill-B6 s0"/></g><text x="864.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="864.5" dy="0">(P2) 거짓말이 나쁘다면, 동생에게 거짓말을 시키는 것도 나쁘다</tspan><tspan x="864.5" dy="18.5">여기서는 아무것도 표현되지 않는다. 앞부분은 주장되고 있지 않다</tspan></text></g><g ><g class="shape"><path d="M336 203h488v66H336z" class="stroke-B1 fill-B6 s0"/></g><text x="580" y="241.5" class="text-bold fill-N1 s1">(C) 그러므로 동생에게 거짓말을 시키는 것도 나쁘다</text></g><g ><g class="shape"><path d="M135 390h890v98H135z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="580" y="428.5" class="text-bold fill-N1 s1"><tspan x="580" dy="0">문제 — 이 추론이 타당하려면 ‘거짓말은 나쁘다’ 가 두 자리에서 같은 뜻이어야 한다.</tspan><tspan x="580" dy="17.667">그런데 비인지주의에 따르면 첫째 자리에서는 태도가 표현되고 둘째 자리에서는 표현되지 않는다.</tspan><tspan x="580" dy="17.667">뜻이 달라지면 이 추론은 애매어의 오류가 되어 버린다</tspan></text></g><g ><g class="shape"><path d="M0 588h578v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="289" y="626.5" class="text-bold fill-N1 s1"><tspan x="289" dy="0">응답 A — 준실재론</tspan><tspan x="289" dy="17.25">논리적 일관성을 태도들 사이의 일관성으로 다시 잡는다.</tspan><tspan x="289" dy="17.25">첫째 전제의 태도를 갖고 둘째 전제의 태도를 가지면서</tspan><tspan x="289" dy="17.25">결론의 태도를 갖지 않는 것은 태도의 앞뒤가 맞지 않는 일이다</tspan></text></g><g ><g class="shape"><path d="M638 588h467v114H638z" class="stroke-B1 fill-B6 s0"/></g><text x="871.5" y="626.5" class="text-bold fill-N1 s1"><tspan x="871.5" dy="0">응답 B — 규범 표현주의</tspan><tspan x="871.5" dy="17.25">도덕 문장이 표현하는 것을 태도가 아니라</tspan><tspan x="871.5" dy="17.25">‘어떤 규범 체계를 받아들임’ 으로 잡고,</tspan><tspan x="871.5" dy="17.25">논리를 그 받아들임에 대한 제약으로 다시 세운다</tspan></text></g><text x="1558" y="31" class="fill-N1 s1"><tspan x="1558" dy="0">평가 — 어느 응답도 논쟁을 끝내지 못했다. 반론은 이렇게 온다.</tspan><tspan x="1558" dy="17.667">태도의 앞뒤가 맞지 않는 것과 문장이 서로 모순되는 것은 다른 일이고,</tspan><tspan x="1558" dy="17.667">비인지주의는 뒤엣것을 앞엣것으로 갈아 끼우면서 무언가를 잃는다는 것이다</tspan></text><marker id="mk-d2-1374639076-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1374639076-3488378134)" d="M296 83.5c0 46.8 36.4 71.2 178.207 118.729" class="connection stroke-B1 s0" mask="url(#d2-1374639076)"/><text x="361.5" y="170" class="text-italic fill-N2 s1">전건 긍정</text><path fill="none" marker-end="url(#mk-d2-1374639076-3488378134)" d="M864.5 83.5c0 46.8-36.4 71.2-178.207 118.729" class="connection stroke-B1 s0" mask="url(#d2-1374639076)"/><path fill="none" marker-end="url(#mk-d2-1374639076-3488378134)" d="M580.25 270.5v116" class="connection stroke-B1 s0" mask="url(#d2-1374639076)"/><text x="580" y="335" class="text-italic fill-N2 s1">여기가 무너진다</text><path fill="none" marker-end="url(#mk-d2-1374639076-3488378134)" d="M434.107 488.644C318.4 528 289 548 289 584" class="connection stroke-B1 s0" mask="url(#d2-1374639076)"/><path fill="none" marker-end="url(#mk-d2-1374639076-3488378134)" d="M726.393 488.644C842.1 528 871.5 548 871.5 584" class="connection stroke-B1 s0" mask="url(#d2-1374639076)"/><mask id="d2-1374639076" width="2085" height="904" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2085v904H-101z"/><path d="M319 154h85v21h-85zM509 319h142v21H509z"/></mask></svg>