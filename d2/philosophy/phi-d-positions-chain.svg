<svg xmlns="http://www.w3.org/2000/svg" width="2730" height="708" class="d2-2923961552 d2-svg" viewBox="-101 -101 2730 708"><rect width="2730" height="708" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2923961552 .fill-N1{fill:#0a0f25}.d2-2923961552 .fill-N2{fill:#676c7e}.d2-2923961552 .fill-B6{fill:#f7f8fe}.d2-2923961552 .stroke-B1,.d2-2923961552 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 281h197v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="98.5" y="319.5" class="text-bold fill-N1 s1"><tspan x="98.5" dy="0">① 이원론</tspan><tspan x="98.5" dy="17">마음과 몸은</tspan><tspan x="98.5" dy="17">서로 다른 종류다.</tspan><tspan x="98.5" dy="17">실체가 둘이거나</tspan><tspan x="98.5" dy="17">속성이 둘이다</tspan></text></g><g ><g class="shape"><path d="M575 186h212v130H575z" class="stroke-B1 fill-B6 s0"/></g><text x="681" y="224.5" class="text-bold fill-N1 s1"><tspan x="681" dy="0">② 논리적 행동주의</tspan><tspan x="681" dy="17">마음에 대한 문장은</tspan><tspan x="681" dy="17">행동과 행동 성향에</tspan><tspan x="681" dy="17">대한 문장으로</tspan><tspan x="681" dy="17">남김없이 옮겨진다</tspan></text></g><g ><g class="shape"><path d="M1142 194h212v114h-212z" class="stroke-B1 fill-B6 s0"/></g><text x="1248" y="232.5" class="text-bold fill-N1 s1"><tspan x="1248" dy="0">③ 유형 동일론</tspan><tspan x="1248" dy="17.25">마음 상태의 유형이</tspan><tspan x="1248" dy="17.25">곧 어떤 물리</tspan><tspan x="1248" dy="17.25">상태의 유형이다</tspan></text></g><g ><g class="shape"><path d="M1731 91h231v130h-231z" class="stroke-B1 fill-B6 s0"/></g><text x="1846.5" y="129.5" class="text-bold fill-N1 s1"><tspan x="1846.5" dy="0">④ 기능주의</tspan><tspan x="1846.5" dy="17">마음 상태는 그것이</tspan><tspan x="1846.5" dy="17">하는 일로 정해진다.</tspan><tspan x="1846.5" dy="17">입력 · 다른 마음 상태 ·</tspan><tspan x="1846.5" dy="17">출력과 맺는 관계다</tspan></text></g><g ><g class="shape"><path d="M2316 0h212v130h-212z" class="stroke-B1 fill-B6 s0"/></g><text x="2422" y="38.5" class="text-bold fill-N1 s1"><tspan x="2422" dy="0">15장 — 감각질과</tspan><tspan x="2422" dy="17">어려운 문제</tspan><tspan x="2422" dy="17">역할을 다 채우고도</tspan><tspan x="2422" dy="17">겪어지는 것이</tspan><tspan x="2422" dy="17">빠진 듯하다</tspan></text></g><g ><g class="shape"><path d="M2318 190h209v114h-209z" class="stroke-B1 fill-B6 s0"/></g><text x="2422.5" y="228.5" class="text-bold fill-N1 s1"><tspan x="2422.5" dy="0">15장 — 지향성</tspan><tspan x="2422.5" dy="17.25">내 안의 상태가</tspan><tspan x="2422.5" dy="17.25">어떻게 저 바깥의</tspan><tspan x="2422.5" dy="17.25">무언가에 관하는가</tspan></text></g><g ><g class="shape"><path d="M565 376h232v130H565z" class="stroke-B2 fill-B6 s2"/></g><text x="681" y="414.5" class="text-bold fill-N1 s1"><tspan x="681" dy="0">속성 이원론</tspan><tspan x="681" dy="17">실체는 하나,</tspan><tspan x="681" dy="17">속성이 둘.</tspan><tspan x="681" dy="17">접촉 문제는 사라지고</tspan><tspan x="681" dy="17">정신적 인과는 남는다</tspan></text></g><g ><g class="shape"><path d="M1719 281h255v130h-255z" class="stroke-B2 fill-B6 s2"/></g><text x="1846.5" y="319.5" class="text-bold fill-N1 s1"><tspan x="1846.5" dy="0">사례 동일론</tspan><tspan x="1846.5" dy="17">낱낱의 마음 사건이</tspan><tspan x="1846.5" dy="17">낱낱의 물리 사건이다.</tspan><tspan x="1846.5" dy="17">다수 실현에 다치지 않고</tspan><tspan x="1846.5" dy="17">잃는 것은 일반성이다</tspan></text></g><marker id="mk-d2-2923961552-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2923961552-3488378134)" d="M198.895 312.361C344.2 263.4 419.8 251 571 251" class="connection stroke-B1 s0" mask="url(#d2-2923961552)"/><text x="382" y="239" class="text-italic fill-N2 s1"><tspan x="382" dy="0">비물리적인 것을</tspan><tspan x="382" dy="17.25">하나 더 들여놓았다.</tspan><tspan x="382" dy="17.25">넓이 없는 것이</tspan><tspan x="382" dy="17.25">어떻게 팔을 드는가</tspan></text><path fill="none" marker-end="url(#mk-d2-2923961552-3488378134)" d="M788.5 251h350" class="connection stroke-B1 s0" mask="url(#d2-2923961552)"/><text x="964.5" y="233" class="text-italic fill-N2 s1"><tspan x="964.5" dy="0">옮겨 쓰기가</tspan><tspan x="964.5" dy="17.25">끝나지 않는다.</tspan><tspan x="964.5" dy="17.25">성향 없는 아픔도</tspan><tspan x="964.5" dy="17.25">생각될 수 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-2923961552-3488378134)" d="M1355.4 215.377C1499.9 168 1575.5 156 1727.5 156" class="connection stroke-B1 s0" mask="url(#d2-2923961552)"/><text x="1538.5" y="143" class="text-italic fill-N2 s1"><tspan x="1538.5" dy="0">다수 실현 —</tspan><tspan x="1538.5" dy="17.25">같은 마음 유형이</tspan><tspan x="1538.5" dy="17.25">여러 물리 유형으로</tspan><tspan x="1538.5" dy="17.25">실현된다</tspan></text><path fill="none" marker-end="url(#mk-d2-2923961552-3488378134)" d="M1963.912 120.415C2108.4 76.199 2179.2 65 2312 65" class="connection stroke-B1 s0" mask="url(#d2-2923961552)"/><text x="2136" y="61" class="text-italic fill-N2 s1"><tspan x="2136" dy="0">역할은 채웠는데</tspan><tspan x="2136" dy="17.667">겪어지는 것이</tspan><tspan x="2136" dy="17.667">남는다</tspan></text><path fill="none" marker-end="url(#mk-d2-2923961552-3488378134)" d="M1963.912 191.585C2108.4 235.8 2179.5 247 2313.5 247" class="connection stroke-B1 s0" mask="url(#d2-2923961552)"/><text x="2136.5" y="238" class="text-italic fill-N2 s1"><tspan x="2136.5" dy="0">관함은</tspan><tspan x="2136.5" dy="18.5">어디서 오는가</tspan></text><path fill="none" marker-end="url(#mk-d2-2923961552-3488378134)" d="M198.895 379.639C344.2 428.6 417.8 441 561 441" class="connection stroke-B1 s0" mask="url(#d2-2923961552)"/><text x="377" y="440" class="text-italic fill-N2 s1">물러설 자리</text><path fill="none" marker-end="url(#mk-d2-2923961552-3488378134)" d="M1355.4 286.623C1499.9 334 1573.1 346 1715.5 346" class="connection stroke-B1 s0" mask="url(#d2-2923961552)"/><text x="1532.5" y="337" class="text-italic fill-N2 s1"><tspan x="1532.5" dy="0">이 줄은</tspan><tspan x="1532.5" dy="18.5">끊기지 않는다</tspan></text><mask id="d2-2923961552" width="2730" height="708" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2730v708H-101z"/><path d="M298 223h168v69H298zM892 217h145v69H892zM1456 127h165v69h-165zM2065 45h142v53h-142zM2075 222h123v37h-123zM325 424h104v21H325zM1471 321h123v37h-123z"/></mask></svg>