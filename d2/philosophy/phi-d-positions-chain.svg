<svg xmlns="http://www.w3.org/2000/svg" width="993" height="1532" class="d2-3704482492 d2-svg" viewBox="-101 -101 993 1532"><rect width="993" height="1532" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3704482492 .fill-N1{fill:#0a0f25}.d2-3704482492 .fill-N2{fill:#676c7e}.d2-3704482492 .fill-B6{fill:#f7f8fe}.d2-3704482492 .stroke-B1,.d2-3704482492 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M435 0h197v130H435z" class="stroke-B1 fill-B6 s0"/></g><text x="533.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="533.5" dy="0">① 이원론</tspan><tspan x="533.5" dy="17">마음과 몸은</tspan><tspan x="533.5" dy="17">서로 다른 종류다.</tspan><tspan x="533.5" dy="17">실체가 둘이거나</tspan><tspan x="533.5" dy="17">속성이 둘이다</tspan></text></g><g ><g class="shape"><path d="M287 308h212v130H287z" class="stroke-B1 fill-B6 s0"/></g><text x="393" y="346.5" class="text-bold fill-N1 s1"><tspan x="393" dy="0">② 논리적 행동주의</tspan><tspan x="393" dy="17">마음에 대한 문장은</tspan><tspan x="393" dy="17">행동과 행동 성향에</tspan><tspan x="393" dy="17">대한 문장으로</tspan><tspan x="393" dy="17">남김없이 옮겨진다</tspan></text></g><g ><g class="shape"><path d="M287 616h212v114H287z" class="stroke-B1 fill-B6 s0"/></g><text x="393" y="654.5" class="text-bold fill-N1 s1"><tspan x="393" dy="0">③ 유형 동일론</tspan><tspan x="393" dy="17.25">마음 상태의 유형이</tspan><tspan x="393" dy="17.25">곧 어떤 물리</tspan><tspan x="393" dy="17.25">상태의 유형이다</tspan></text></g><g ><g class="shape"><path d="M126 908h231v130H126z" class="stroke-B1 fill-B6 s0"/></g><text x="241.5" y="946.5" class="text-bold fill-N1 s1"><tspan x="241.5" dy="0">④ 기능주의</tspan><tspan x="241.5" dy="17">마음 상태는 그것이</tspan><tspan x="241.5" dy="17">하는 일로 정해진다.</tspan><tspan x="241.5" dy="17">입력 · 다른 마음 상태 ·</tspan><tspan x="241.5" dy="17">출력과 맺는 관계다</tspan></text></g><g ><g class="shape"><path d="M0 1200h212v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="106" y="1238.5" class="text-bold fill-N1 s1"><tspan x="106" dy="0">15장 — 감각질과</tspan><tspan x="106" dy="17">어려운 문제</tspan><tspan x="106" dy="17">역할을 다 채우고도</tspan><tspan x="106" dy="17">겪어지는 것이</tspan><tspan x="106" dy="17">빠진 듯하다</tspan></text></g><g ><g class="shape"><path d="M272 1208h209v114H272z" class="stroke-B1 fill-B6 s0"/></g><text x="376.5" y="1246.5" class="text-bold fill-N1 s1"><tspan x="376.5" dy="0">15장 — 지향성</tspan><tspan x="376.5" dy="17.25">내 안의 상태가</tspan><tspan x="376.5" dy="17.25">어떻게 저 바깥의</tspan><tspan x="376.5" dy="17.25">무언가에 관하는가</tspan></text></g><g ><g class="shape"><path d="M559 308h232v130H559z" class="stroke-B2 fill-B6 s2"/></g><text x="675" y="346.5" class="text-bold fill-N1 s1"><tspan x="675" dy="0">속성 이원론</tspan><tspan x="675" dy="17">실체는 하나,</tspan><tspan x="675" dy="17">속성이 둘.</tspan><tspan x="675" dy="17">접촉 문제는 사라지고</tspan><tspan x="675" dy="17">정신적 인과는 남는다</tspan></text></g><g ><g class="shape"><path d="M417 908h255v130H417z" class="stroke-B2 fill-B6 s2"/></g><text x="544.5" y="946.5" class="text-bold fill-N1 s1"><tspan x="544.5" dy="0">사례 동일론</tspan><tspan x="544.5" dy="17">낱낱의 마음 사건이</tspan><tspan x="544.5" dy="17">낱낱의 물리 사건이다.</tspan><tspan x="544.5" dy="17">다수 실현에 다치지 않고</tspan><tspan x="544.5" dy="17">잃는 것은 일반성이다</tspan></text></g><marker id="mk-d2-3704482492-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3704482492-3488378134)" d="M472.404 131.48C408.95 201.2 392.75 236.8 392.75 304" class="connection stroke-B1 s0" mask="url(#d2-3704482492)"/><text x="406" y="189" class="text-italic fill-N2 s1"><tspan x="406" dy="0">비물리적인 것을</tspan><tspan x="406" dy="17.25">하나 더 들여놓았다.</tspan><tspan x="406" dy="17.25">넓이 없는 것이</tspan><tspan x="406" dy="17.25">어떻게 팔을 드는가</tspan></text><path fill="none" marker-end="url(#mk-d2-3704482492-3488378134)" d="M392.75 440v172" class="connection stroke-B1 s0" mask="url(#d2-3704482492)"/><text x="392.5" y="509" class="text-italic fill-N2 s1"><tspan x="392.5" dy="0">옮겨 쓰기가</tspan><tspan x="392.5" dy="17.25">끝나지 않는다.</tspan><tspan x="392.5" dy="17.25">성향 없는 아픔도</tspan><tspan x="392.5" dy="17.25">생각될 수 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-3704482492-3488378134)" d="M331.813 731.39C259.649 801.2 241.25 836.8 241.25 904" class="connection stroke-B1 s0" mask="url(#d2-3704482492)"/><text x="257.5" y="787" class="text-italic fill-N2 s1"><tspan x="257.5" dy="0">다수 실현 —</tspan><tspan x="257.5" dy="17.25">같은 마음 유형이</tspan><tspan x="257.5" dy="17.25">여러 물리 유형으로</tspan><tspan x="257.5" dy="17.25">실현된다</tspan></text><path fill="none" marker-end="url(#mk-d2-3704482492-3488378134)" d="M179.641 1039.468C121 1102.8 106 1135.2 106 1196" class="connection stroke-B1 s0" mask="url(#d2-3704482492)"/><text x="118" y="1098" class="text-italic fill-N2 s1"><tspan x="118" dy="0">역할은 채웠는데</tspan><tspan x="118" dy="17.667">겪어지는 것이</tspan><tspan x="118" dy="17.667">남는다</tspan></text><path fill="none" marker-end="url(#mk-d2-3704482492-3488378134)" d="M302.859 1039.468C361.5 1102.8 376.5 1136.8 376.5 1204" class="connection stroke-B1 s0" mask="url(#d2-3704482492)"/><text x="365.5" y="1109" class="text-italic fill-N2 s1"><tspan x="365.5" dy="0">관함은</tspan><tspan x="365.5" dy="18.5">어디서 오는가</tspan></text><path fill="none" marker-end="url(#mk-d2-3704482492-3488378134)" d="M595.096 131.48C658.55 201.2 674.75 236.8 674.75 304" class="connection stroke-B1 s0" mask="url(#d2-3704482492)"/><text x="661" y="213" class="text-italic fill-N2 s1">물러설 자리</text><path fill="none" marker-end="url(#mk-d2-3704482492-3488378134)" d="M453.687 731.39C525.85 801.2 544.25 836.8 544.25 904" class="connection stroke-B1 s0" mask="url(#d2-3704482492)"/><text x="527.5" y="803" class="text-italic fill-N2 s1"><tspan x="527.5" dy="0">이 줄은</tspan><tspan x="527.5" dy="18.5">끊기지 않는다</tspan></text><mask id="d2-3704482492" width="993" height="1532" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h993v1532h-993z"/><path d="M322 173h168v69H322zM320 493h145v69H320zM175 771h165v69H175zM47 1082h142v53H47zM304 1093h123v37H304zM609 197h104v21H609zM466 787h123v37H466z"/></mask></svg>