<svg xmlns="http://www.w3.org/2000/svg" width="1435" height="1086" class="d2-3312101754 d2-svg" viewBox="-89 -89 1435 1086"><rect width="1435" height="1086" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3312101754 .fill-N1{fill:#0a0f25}.d2-3312101754 .fill-B6{fill:#f7f8fe}.d2-3312101754 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><text x="630" y="28" class="fill-N1 s0"><tspan x="630" dy="0">논리학 문서 18장 — 세계는 이름 붙은 점이고,</tspan><tspan x="630" dy="17.667">점 사이의 접근관계가 어떤 공리를 참으로 만드는지를</tspan><tspan x="630" dy="17.667">정리로 세운다. 점이 무엇인지는 묻지 않는다</tspan></text><g ><g class="shape"><ellipse cx="630.5" cy="282.5" class="shape stroke-B1 fill-B6 s1" rx="169.5" ry="56.5"/></g><text x="630.5" y="280" class="text-bold fill-N1 s0"><tspan x="630.5" dy="0">그 점들은 정말 있는가.</tspan><tspan x="630.5" dy="18.5">있다면 무엇인가</tspan></text></g><g ><g class="shape"><path d="M172 419h345v178H172z" class="stroke-B1 fill-B6 s1"/></g><text x="344.5" y="457.5" class="text-bold fill-N1 s0"><tspan x="344.5" dy="0">양상 실재론 (데이비드 루이스)</tspan><tspan x="344.5" dy="16.625">다른 가능세계는</tspan><tspan x="344.5" dy="16.625">이 세계와 똑같은 뜻으로 있다.</tspan><tspan x="344.5" dy="16.625">덜 실재하는 것이 아니라,</tspan><tspan x="344.5" dy="16.625">우리와 시공간으로도</tspan><tspan x="344.5" dy="16.625">인과로도 이어져 있지 않을 뿐이다.</tspan><tspan x="344.5" dy="16.625">‘현실’ 은 ‘여기’ 처럼</tspan><tspan x="344.5" dy="16.625">말하는 자리를 가리키는 말이다</tspan></text></g><g ><g class="shape"><path d="M772 429h345v162H772z" class="stroke-B1 fill-B6 s1"/></g><text x="944.5" y="467.5" class="text-bold fill-N1 s0"><tspan x="944.5" dy="0">대리주의</tspan><tspan x="944.5" dy="16.714">가능세계는 이 세계 안의 무언가다.</tspan><tspan x="944.5" dy="16.714">최대로 일관된 명제들의 집합,</tspan><tspan x="944.5" dy="16.714">또는 세계 전체를 하나로 적은</tspan><tspan x="944.5" dy="16.714">추상적 대상 같은 것.</tspan><tspan x="944.5" dy="16.714">세계는 있지만</tspan><tspan x="944.5" dy="16.714">우리 세계 하나만 구체적이다</tspan></text></g><g ><g class="shape"><path d="M12 677h324v146H12z" class="stroke-B1 fill-B6 s1"/></g><text x="174" y="715.5" class="text-bold fill-N1 s0"><tspan x="174" dy="0">사는 것 —</tspan><tspan x="174" dy="16.833">양상을 양상 아닌 말로 환원한다.</tspan><tspan x="174" dy="16.833">‘가능하다’ 가</tspan><tspan x="174" dy="16.833">‘그런 세계가 있다’ 가 되어,</tspan><tspan x="174" dy="16.833">필연과 가능이 더 이상</tspan><tspan x="174" dy="16.833">원초적 개념이 아니게 된다</tspan></text></g><g ><g class="shape"><path d="M356 677h319v130H356z" class="stroke-B1 fill-B6 s1"/></g><text x="515.5" y="715.5" class="text-bold fill-N1 s0"><tspan x="515.5" dy="0">치르는 값 —</tspan><tspan x="515.5" dy="17">목록이 엄청나게 늘어난다.</tspan><tspan x="515.5" dy="17">그리고 우리와 아무 인과 관계도</tspan><tspan x="515.5" dy="17">없는 것들을 어떻게 아느냐는</tspan><tspan x="515.5" dy="17">물음이 남는다</tspan></text></g><g ><g class="shape"><path d="M695 677h215v114H695z" class="stroke-B1 fill-B6 s1"/></g><text x="802.5" y="715.5" class="text-bold fill-N1 s0"><tspan x="802.5" dy="0">사는 것 —</tspan><tspan x="802.5" dy="17.25">목록이 절약된다.</tspan><tspan x="802.5" dy="17.25">추상적 대상 말고</tspan><tspan x="802.5" dy="17.25">새로 들일 것이 없다</tspan></text></g><g ><g class="shape"><path d="M930 677h315v146H930z" class="stroke-B1 fill-B6 s1"/></g><text x="1087.5" y="715.5" class="text-bold fill-N1 s0"><tspan x="1087.5" dy="0">치르는 값 —</tspan><tspan x="1087.5" dy="16.833">환원이 되지 않는다.</tspan><tspan x="1087.5" dy="16.833">어느 명제 집합이</tspan><tspan x="1087.5" dy="16.833">‘일관된’ 집합인지를 정하려면</tspan><tspan x="1087.5" dy="16.833">결국 가능이라는 양상 개념을</tspan><tspan x="1087.5" dy="16.833">다시 써야 한다</tspan></text></g><text x="628" y="859" class="fill-N1 s0"><tspan x="628" dy="0">고르는 기준이 같다는 데 주목하라 —</tspan><tspan x="628" dy="17.667">목록의 절약과 설명의 힘을 맞바꾸는 것이다.</tspan><tspan x="628" dy="17.667">10장에서 보편자를 두고 다투던 그 저울이 여기서 다시 나온다</tspan></text><marker id="mk-d2-3312101754-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3312101754-3488378134)" d="m630.753 67 .24 155" class="connection stroke-B1 s1" mask="url(#d2-3312101754)"/><text x="631" y="151" style="fill:#676c7e;text-anchor:middle;font-size:16px">여기서 갈라진다</text><path fill="none" marker-end="url(#mk-d2-3312101754-3488378134)" d="m574.012 338 .18 31s.058 10-9.942 10h-209.5s-10 0-10 10v26" class="connection stroke-B1 s1" mask="url(#d2-3312101754)"/><path fill="none" marker-end="url(#mk-d2-3312101754-3488378134)" d="m687.012 338 .18 31s.058 10 10.058 10H935s10 0 10 10v37" class="connection stroke-B1 s1" mask="url(#d2-3312101754)"/><path fill="none" marker-end="url(#mk-d2-3312101754-3488378134)" d="M287.25 599v74" class="connection stroke-B1 s1" mask="url(#d2-3312101754)"/><path fill="none" marker-end="url(#mk-d2-3312101754-3488378134)" d="M402.25 599v74" class="connection stroke-B1 s1" mask="url(#d2-3312101754)"/><path fill="none" marker-end="url(#mk-d2-3312101754-3488378134)" d="M802.5 594v79" class="connection stroke-B1 s1" mask="url(#d2-3312101754)"/><path fill="none" marker-end="url(#mk-d2-3312101754-3488378134)" d="M1087.5 594v79" class="connection stroke-B1 s1" mask="url(#d2-3312101754)"/><mask id="d2-3312101754" width="1435" height="1086" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1435V997H-89z"/><path d="M560 135h142v21H560z"/></mask></svg>