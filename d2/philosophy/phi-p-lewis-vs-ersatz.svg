<svg xmlns="http://www.w3.org/2000/svg" width="2112" height="1108" class="d2-3087795917 d2-svg" viewBox="-101 -101 2112 1108"><rect width="2112" height="1108" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3087795917 .fill-N1{fill:#0a0f25}.d2-3087795917 .fill-B6{fill:#f7f8fe}.d2-3087795917 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><text x="956.5" y="16" class="fill-N1 s0"><tspan x="956.5" dy="0">논리학 문서 18장 — 세계는 이름 붙은 점이고, 점 사이의 접근관계가</tspan><tspan x="956.5" dy="18.5">어떤 공리를 참으로 만드는지를 정리로 세운다. 점이 무엇인지는 묻지 않는다</tspan></text><g ><g class="shape"><ellipse cx="956.5" cy="249.5" class="shape stroke-B1 fill-B6 s1" rx="274.5" ry="91.5"/></g><text x="956.5" y="255" class="text-bold fill-N1 s0">그 점들은 정말 있는가. 있다면 무엇인가</text></g><g ><g class="shape"><path d="M233 441h515v130H233z" class="stroke-B1 fill-B6 s1"/></g><text x="490.5" y="479.5" class="text-bold fill-N1 s0"><tspan x="490.5" dy="0">양상 실재론 (데이비드 루이스)</tspan><tspan x="490.5" dy="17">다른 가능세계는 이 세계와 똑같은 뜻으로 있다.</tspan><tspan x="490.5" dy="17">덜 실재하는 것이 아니라, 우리와 시공간으로도</tspan><tspan x="490.5" dy="17">인과로도 이어져 있지 않을 뿐이다.</tspan><tspan x="490.5" dy="17">‘현실’ 은 ‘여기’ 처럼 말하는 자리를 가리키는 말이다</tspan></text></g><g ><g class="shape"><path d="M1213 441h452v130h-452z" class="stroke-B1 fill-B6 s1"/></g><text x="1439" y="479.5" class="text-bold fill-N1 s0"><tspan x="1439" dy="0">대리주의</tspan><tspan x="1439" dy="17">가능세계는 이 세계 안의 무언가다.</tspan><tspan x="1439" dy="17">최대로 일관된 명제들의 집합, 또는 세계 전체를</tspan><tspan x="1439" dy="17">하나로 적은 추상적 대상 같은 것.</tspan><tspan x="1439" dy="17">세계는 있지만 우리 세계 하나만 구체적이다</tspan></text></g><g ><g class="shape"><path d="M0 671h471v98H0z" class="stroke-B1 fill-B6 s1"/></g><text x="235.5" y="709.5" class="text-bold fill-N1 s0"><tspan x="235.5" dy="0">사는 것 — 양상을 양상 아닌 말로 환원한다.</tspan><tspan x="235.5" dy="17.667">‘가능하다’ 가 ‘그런 세계가 있다’ 가 되어,</tspan><tspan x="235.5" dy="17.667">필연과 가능이 더 이상 원초적 개념이 아니게 된다</tspan></text></g><g ><g class="shape"><path d="M531 671h427v98H531z" class="stroke-B1 fill-B6 s1"/></g><text x="744.5" y="709.5" class="text-bold fill-N1 s0"><tspan x="744.5" dy="0">치르는 값 — 목록이 엄청나게 늘어난다.</tspan><tspan x="744.5" dy="17.667">그리고 우리와 아무 인과 관계도 없는 것들을</tspan><tspan x="744.5" dy="17.667">어떻게 아느냐는 물음이 남는다</tspan></text></g><g ><g class="shape"><path d="M1018 679h366v82h-366z" class="stroke-B1 fill-B6 s1"/></g><text x="1201" y="717.5" class="text-bold fill-N1 s0"><tspan x="1201" dy="0">사는 것 — 목록이 절약된다.</tspan><tspan x="1201" dy="18.5">추상적 대상 말고 새로 들일 것이 없다</tspan></text></g><g ><g class="shape"><path d="M1444 671h466v98h-466z" class="stroke-B1 fill-B6 s1"/></g><text x="1677" y="709.5" class="text-bold fill-N1 s0"><tspan x="1677" dy="0">치르는 값 — 환원이 되지 않는다.</tspan><tspan x="1677" dy="17.667">어느 명제 집합이 ‘일관된’ 집합인지를 정하려면</tspan><tspan x="1677" dy="17.667">결국 가능이라는 양상 개념을 다시 써야 한다</tspan></text></g><text x="1210.5" y="885" class="fill-N1 s0"><tspan x="1210.5" dy="0">고르는 기준이 같다는 데 주목하라 — 목록의 절약과 설명의 힘을 맞바꾸는 것이다.</tspan><tspan x="1210.5" dy="18.5">10장에서 보편자를 두고 다투던 그 저울이 여기서 다시 나온다</tspan></text><marker id="mk-d2-3087795917-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3087795917-3488378134)" d="M956.25 38.5c0 46.8-.05 71.1-.233 115.5" class="connection stroke-B1 s1" mask="url(#d2-3087795917)"/><text x="956" y="103" style="fill:#676c7e;text-anchor:middle;font-size:16px">여기서 갈라진다</text><path fill="none" marker-end="url(#mk-d2-3087795917-3488378134)" d="M751.087 311.582C542.6 375 490 401 490 437" class="connection stroke-B1 s1" mask="url(#d2-3087795917)"/><path fill="none" marker-end="url(#mk-d2-3087795917-3488378134)" d="M1164.92 310.563C1383.8 374.8 1439 401 1439 437" class="connection stroke-B1 s1" mask="url(#d2-3087795917)"/><path fill="none" marker-end="url(#mk-d2-3087795917-3488378134)" d="M344.676 571.821C257.7 611 235.5 631 235.5 667" class="connection stroke-B1 s1" mask="url(#d2-3087795917)"/><path fill="none" marker-end="url(#mk-d2-3087795917-3488378134)" d="M635.324 571.821C722.3 611 744.5 631 744.5 667" class="connection stroke-B1 s1" mask="url(#d2-3087795917)"/><path fill="none" marker-end="url(#mk-d2-3087795917-3488378134)" d="M1302.2 571.873C1221.6 611 1201 632.6 1201 675" class="connection stroke-B1 s1" mask="url(#d2-3087795917)"/><path fill="none" marker-end="url(#mk-d2-3087795917-3488378134)" d="M1575.8 571.873C1656.4 611 1677 631 1677 667" class="connection stroke-B1 s1" mask="url(#d2-3087795917)"/><mask id="d2-3087795917" width="2112" height="1108" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2112v1108H-101z"/><path d="M885 87h142v21H885z"/></mask></svg>