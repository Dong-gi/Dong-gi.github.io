<svg xmlns="http://www.w3.org/2000/svg" width="1002" height="1376" class="d2-701295733 d2-svg" viewBox="-89 -89 1002 1376"><rect width="1002" height="1376" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-701295733 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-701295733 .fill-N1{fill:#0a0f25}.d2-701295733 .fill-B6{fill:#f7f8fe}.d2-701295733 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><text x="457" y="28" class="fill-N1 s0"><tspan x="457" dy="0">논리학 문서 18장 —</tspan><tspan x="457" dy="16.833">세계는 이름 붙은 점이고,</tspan><tspan x="457" dy="16.833">점 사이의 접근관계가</tspan><tspan x="457" dy="16.833">어떤 공리를 참으로 만드는지를</tspan><tspan x="457" dy="16.833">정리로 세운다.</tspan><tspan x="457" dy="16.833">점이 무엇인지는 묻지 않는다</tspan></text><g ><g class="shape"><ellipse cx="457.5" cy="330.5" class="shape stroke-B1 fill-B6 s1" rx="169.5" ry="56.5"/></g><text x="457.5" y="328" class="text-bold fill-N1 s0"><tspan x="457.5" dy="0">그 점들은 정말 있는가.</tspan><tspan x="457.5" dy="18.5">있다면 무엇인가</tspan></text></g><g ><g class="shape"><path d="M102 467h345v178H102z" class="stroke-B1 fill-B6 s1"/></g><text x="274.5" y="505.5" class="text-bold fill-N1 s0"><tspan x="274.5" dy="0">양상 실재론 (데이비드 루이스)</tspan><tspan x="274.5" dy="16.625">다른 가능세계는</tspan><tspan x="274.5" dy="16.625">이 세계와 똑같은 뜻으로 있다.</tspan><tspan x="274.5" dy="16.625">덜 실재하는 것이 아니라,</tspan><tspan x="274.5" dy="16.625">우리와 시공간으로도</tspan><tspan x="274.5" dy="16.625">인과로도 이어져 있지 않을 뿐이다.</tspan><tspan x="274.5" dy="16.625">‘현실’ 은 ‘여기’ 처럼</tspan><tspan x="274.5" dy="16.625">말하는 자리를 가리키는 말이다</tspan></text></g><g ><g class="shape"><path d="M467 477h345v162H467z" class="stroke-B1 fill-B6 s1"/></g><text x="639.5" y="515.5" class="text-bold fill-N1 s0"><tspan x="639.5" dy="0">대리주의</tspan><tspan x="639.5" dy="16.714">가능세계는 이 세계 안의 무언가다.</tspan><tspan x="639.5" dy="16.714">최대로 일관된 명제들의 집합,</tspan><tspan x="639.5" dy="16.714">또는 세계 전체를 하나로 적은</tspan><tspan x="639.5" dy="16.714">추상적 대상 같은 것.</tspan><tspan x="639.5" dy="16.714">세계는 있지만</tspan><tspan x="639.5" dy="16.714">우리 세계 하나만 구체적이다</tspan></text></g><g ><g class="shape"><path d="M12 725h324v146H12z" class="stroke-B1 fill-B6 s1"/></g><text x="174" y="763.5" class="text-bold fill-N1 s0"><tspan x="174" dy="0">사는 것 —</tspan><tspan x="174" dy="16.833">양상을 양상 아닌 말로 환원한다.</tspan><tspan x="174" dy="16.833">‘가능하다’ 가</tspan><tspan x="174" dy="16.833">‘그런 세계가 있다’ 가 되어,</tspan><tspan x="174" dy="16.833">필연과 가능이 더 이상</tspan><tspan x="174" dy="16.833">원초적 개념이 아니게 된다</tspan></text></g><g ><g class="shape"><path d="M115 951h319v130H115z" class="stroke-B1 fill-B6 s1"/></g><text x="274.5" y="989.5" class="text-bold fill-N1 s0"><tspan x="274.5" dy="0">치르는 값 —</tspan><tspan x="274.5" dy="17">목록이 엄청나게 늘어난다.</tspan><tspan x="274.5" dy="17">그리고 우리와 아무 인과 관계도</tspan><tspan x="274.5" dy="17">없는 것들을 어떻게 아느냐는</tspan><tspan x="274.5" dy="17">물음이 남는다</tspan></text></g><g ><g class="shape"><path d="M458 741h215v114H458z" class="stroke-B1 fill-B6 s1"/></g><text x="565.5" y="779.5" class="text-bold fill-N1 s0"><tspan x="565.5" dy="0">사는 것 —</tspan><tspan x="565.5" dy="17.25">목록이 절약된다.</tspan><tspan x="565.5" dy="17.25">추상적 대상 말고</tspan><tspan x="565.5" dy="17.25">새로 들일 것이 없다</tspan></text></g><g ><g class="shape"><path d="M482 951h315v146H482z" class="stroke-B1 fill-B6 s1"/></g><text x="639.5" y="989.5" class="text-bold fill-N1 s0"><tspan x="639.5" dy="0">치르는 값 —</tspan><tspan x="639.5" dy="16.833">환원이 되지 않는다.</tspan><tspan x="639.5" dy="16.833">어느 명제 집합이</tspan><tspan x="639.5" dy="16.833">‘일관된’ 집합인지를 정하려면</tspan><tspan x="639.5" dy="16.833">결국 가능이라는 양상 개념을</tspan><tspan x="639.5" dy="16.833">다시 써야 한다</tspan></text></g><text x="412" y="1133" class="fill-N1 s0"><tspan x="412" dy="0">고르는 기준이 같다는 데 주목하라 —</tspan><tspan x="412" dy="17.25">목록의 절약과 설명의 힘을 맞바꾸는 것이다.</tspan><tspan x="412" dy="17.25">10장에서 보편자를 두고 다투던 그 저울이</tspan><tspan x="412" dy="17.25">여기서 다시 나온다</tspan></text><marker id="mk-d2-701295733-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-701295733-3488378134)" d="m457.506 115 .482 155" class="connection stroke-B1 s1" mask="url(#d2-701295733)"/><text x="458" y="199" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">여기서 갈라진다</text><path fill="none" marker-end="url(#mk-d2-701295733-3488378134)" d="M401 386v77" class="connection stroke-B1 s1" mask="url(#d2-701295733)"/><path fill="none" marker-end="url(#mk-d2-701295733-3488378134)" d="M514 386v88" class="connection stroke-B1 s1" mask="url(#d2-701295733)"/><path fill="none" marker-end="url(#mk-d2-701295733-3488378134)" d="M174 647v74" class="connection stroke-B1 s1" mask="url(#d2-701295733)"/><path fill="none" marker-end="url(#mk-d2-701295733-3488378134)" d="M376 647v300" class="connection stroke-B1 s1" mask="url(#d2-701295733)"/><path fill="none" marker-end="url(#mk-d2-701295733-3488378134)" d="M566.25 642v95" class="connection stroke-B1 s1" mask="url(#d2-701295733)"/><path fill="none" marker-end="url(#mk-d2-701295733-3488378134)" d="M713.75 642v305" class="connection stroke-B1 s1" mask="url(#d2-701295733)"/><mask id="d2-701295733" width="1002" height="1376" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H913v1376H-89z"/><path d="M387 183h142v21H387z"/></mask></svg>