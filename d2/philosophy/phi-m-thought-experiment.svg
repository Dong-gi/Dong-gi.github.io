<svg xmlns="http://www.w3.org/2000/svg" width="2057" height="1289" class="d2-3286729920 d2-svg" viewBox="-101 -101 2057 1289"><rect width="2057" height="1289" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3286729920 .fill-N1{fill:#0a0f25}.d2-3286729920 .fill-N2{fill:#676c7e}.d2-3286729920 .fill-B6{fill:#f7f8fe}.d2-3286729920 .stroke-B1,.d2-3286729920 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M635 0h496v82H635z" class="stroke-B1 fill-B6 s0"/></g><text x="883" y="38.5" class="text-bold fill-N1 s1"><tspan x="883" dy="0">① 상황을 설정한다</tspan><tspan x="883" dy="18.5">실제로 일어날 필요는 없다. 앞뒤가 맞기만 하면 된다</tspan></text></g><g ><g class="shape"><path d="M310 211h546v82H310z" class="stroke-B1 fill-B6 s0"/></g><text x="583" y="249.5" class="text-bold fill-N1 s1"><tspan x="583" dy="0">② 그 상황에 대해 묻는다</tspan><tspan x="583" dy="18.5">‘이 경우 그는 아는 것인가’, ‘이 경우 그렇게 해도 되는가’</tspan></text></g><g ><g class="shape"><path d="M270 401h625v82H270z" class="stroke-B1 fill-B6 s0"/></g><text x="582.5" y="439.5" class="text-bold fill-N1 s1"><tspan x="582.5" dy="0">③ 읽는 사람에게서 판단이 나온다</tspan><tspan x="582.5" dy="18.5">이것이 직관이다. 논증도 관찰도 아니고, 그냥 그렇게 보이는 것이다</tspan></text></g><g ><g class="shape"><path d="M22 612h519v82H22z" class="stroke-B1 fill-B6 s0"/></g><text x="281.5" y="650.5" class="text-bold fill-N1 s1"><tspan x="281.5" dy="0">④ 그 판단을 전제로 삼는다</tspan><tspan x="281.5" dy="18.5">‘이 경우 그는 알지 못한다’ 를 참으로 놓고 논증을 짠다</tspan></text></g><g ><g class="shape"><path d="M5 802h553v82H5z" class="stroke-B1 fill-B6 s0"/></g><text x="281.5" y="840.5" class="text-bold fill-N1 s1"><tspan x="281.5" dy="0">⑤ 일반 주장을 지지하거나 무너뜨린다</tspan><tspan x="281.5" dy="18.5">예를 들어 ‘정당화된 참인 믿음이면 앎이다’ 를 무너뜨린다</tspan></text></g><g ><g class="shape"><path d="M916 203h536v98H916z" class="stroke-B2 fill-B6 s2"/></g><text x="1184" y="241.5" class="text-bold fill-N1 s1"><tspan x="1184" dy="0">반론 A — 그 상황은 불가능하다</tspan><tspan x="1184" dy="17.667">설정에 숨은 모순이 있거나, 우리가 상상했다고 여긴 것을</tspan><tspan x="1184" dy="17.667">사실은 상상하지 못한 것이다</tspan></text></g><g ><g class="shape"><path d="M601 604h565v98H601z" class="stroke-B2 fill-B6 s2"/></g><text x="883.5" y="642.5" class="text-bold fill-N1 s1"><tspan x="883.5" dy="0">반론 B — 판단이 갈린다</tspan><tspan x="883.5" dy="17.667">다른 사람은 다르게 본다. 물음을 다르게 꾸미면 답이 바뀐다.</tspan><tspan x="883.5" dy="17.667">그러면 그 판단을 전제로 쓸 수 없다</tspan></text></g><g ><g class="shape"><path d="M0 1005h563v82H0z" class="stroke-B2 fill-B6 s2"/></g><text x="281.5" y="1043.5" class="text-bold fill-N1 s1"><tspan x="281.5" dy="0">반론 C — 판단이 그 결론을 지지하지 않는다</tspan><tspan x="281.5" dy="18.5">판단은 인정하되, 그 판단이 나온 이유가 다른 데 있다고 본다</tspan></text></g><text x="1523" y="31" class="fill-N1 s1"><tspan x="1523" dy="0">사고실험을 소개할 때 줄거리만 옮기면 ③부터가 사라진다.</tspan><tspan x="1523" dy="17.667">무엇을 묻는지, 어떤 판단이 나오는지, 그 판단이 무엇을 지지하는지까지 적어야</tspan><tspan x="1523" dy="17.667">사고실험이 논증 안에서 제 일을 한다</tspan></text><marker id="mk-d2-3286729920-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3286729920-3488378134)" d="M759.607 82.145C618.3 130.3 582.5 156.3 582.5 207.5" class="connection stroke-B1 s0" mask="url(#d2-3286729920)"/><path fill="none" marker-end="url(#mk-d2-3286729920-3488378134)" d="M582.5 295v102" class="connection stroke-B1 s0" mask="url(#d2-3286729920)"/><path fill="none" marker-end="url(#mk-d2-3286729920-3488378134)" d="M458.607 483.145C317.299 531.3 281.5 557.3 281.5 608.5" class="connection stroke-B1 s0" mask="url(#d2-3286729920)"/><path fill="none" marker-end="url(#mk-d2-3286729920-3488378134)" d="M281.5 696v102" class="connection stroke-B1 s0" mask="url(#d2-3286729920)"/><path fill="none" marker-end="url(#mk-d2-3286729920-3488378134)" d="M1006.393 82.145C1147.7 130.3 1183.5 154.7 1183.5 199.5" class="connection stroke-B1 s0" mask="url(#d2-3286729920)"/><text x="1120" y="126" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-3286729920-3488378134)" d="M706.393 483.145C847.7 531.3 883.5 555.7 883.5 600.5" class="connection stroke-B1 s0" mask="url(#d2-3286729920)"/><text x="820" y="527" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-3286729920-3488378134)" d="M281.5 885.5v116" class="connection stroke-B1 s0" mask="url(#d2-3286729920)"/><text x="282" y="950" class="text-italic fill-N2 s1">여기를 친다</text><mask id="d2-3286729920" width="2057" height="1289" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2057v1289H-101z"/><path d="M1068 110h104v21h-104zM768 511h104v21H768zM230 934h104v21H230z"/></mask></svg>