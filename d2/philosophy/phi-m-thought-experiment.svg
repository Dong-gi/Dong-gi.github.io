<svg xmlns="http://www.w3.org/2000/svg" width="1049" height="1093" class="d2-1518477434 d2-svg" viewBox="-101 -101 1049 1093"><rect width="1049" height="1093" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1518477434 .fill-N1{fill:#0a0f25}.d2-1518477434 .fill-N2{fill:#676c7e}.d2-1518477434 .fill-B6{fill:#f7f8fe}.d2-1518477434 .stroke-B1,.d2-1518477434 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M0 0h371v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="185.5" y="46.5" class="text-bold fill-N1 s1"><tspan x="185.5" dy="0">① 상황을 설정한다</tspan><tspan x="185.5" dy="17.667">실제로 일어날 필요는 없다.</tspan><tspan x="185.5" dy="17.667">앞뒤가 맞기만 하면 된다</tspan></text></g><g ><g class="shape"><path d="M501 0h346v114H501z" class="stroke-B2 fill-B6 s2"/></g><text x="674" y="38.5" class="text-bold fill-N1 s1"><tspan x="674" dy="0">반론 A — 그 상황은 불가능하다</tspan><tspan x="674" dy="17.25">설정에 숨은 모순이 있거나,</tspan><tspan x="674" dy="17.25">우리가 상상했다고 여긴 것을</tspan><tspan x="674" dy="17.25">사실은 상상하지 못한 것이다</tspan></text></g><g ><g class="shape"><path d="M0 184h371v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="185.5" y="222.5" class="text-bold fill-N1 s1"><tspan x="185.5" dy="0">② 그 상황에 대해 묻는다</tspan><tspan x="185.5" dy="17.667">‘이 경우 그는 아는 것인가’,</tspan><tspan x="185.5" dy="17.667">‘이 경우 그렇게 해도 되는가’</tspan></text></g><g ><g class="shape"><path d="M0 352h371v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="185.5" y="390.5" class="text-bold fill-N1 s1"><tspan x="185.5" dy="0">③ 읽는 사람에게서 판단이 나온다</tspan><tspan x="185.5" dy="17.25">이것이 직관이다.</tspan><tspan x="185.5" dy="17.25">논증도 관찰도 아니고,</tspan><tspan x="185.5" dy="17.25">그냥 그렇게 보이는 것이다</tspan></text></g><g ><g class="shape"><path d="M501 352h346v114H501z" class="stroke-B2 fill-B6 s2"/></g><text x="674" y="390.5" class="text-bold fill-N1 s1"><tspan x="674" dy="0">반론 B — 판단이 갈린다</tspan><tspan x="674" dy="17.25">다른 사람은 다르게 본다.</tspan><tspan x="674" dy="17.25">물음을 다르게 꾸미면 답이 바뀐다.</tspan><tspan x="674" dy="17.25">그러면 그 판단을 전제로 쓸 수 없다</tspan></text></g><g ><g class="shape"><path d="M0 536h371v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="185.5" y="574.5" class="text-bold fill-N1 s1"><tspan x="185.5" dy="0">④ 그 판단을 전제로 삼는다</tspan><tspan x="185.5" dy="17.667">‘이 경우 그는 알지 못한다’ 를</tspan><tspan x="185.5" dy="17.667">참으로 놓고 논증을 짠다</tspan></text></g><g ><g class="shape"><path d="M0 704h371v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="185.5" y="750.5" class="text-bold fill-N1 s1"><tspan x="185.5" dy="0">⑤ 일반 주장을 지지하거나 무너뜨린다</tspan><tspan x="185.5" dy="17.667">예를 들어 ‘정당화된 참인 믿음이면</tspan><tspan x="185.5" dy="17.667">앎이다’ 를 무너뜨린다</tspan></text></g><g ><g class="shape"><path d="M501 704h346v114H501z" class="stroke-B2 fill-B6 s2"/></g><text x="674" y="742.5" class="text-bold fill-N1 s1"><tspan x="674" dy="0">반론 C — 판단이 그 결론을</tspan><tspan x="674" dy="17.25">지지하지 않는다</tspan><tspan x="674" dy="17.25">판단은 인정하되, 그 판단이 나온</tspan><tspan x="674" dy="17.25">이유가 다른 데 있다고 본다</tspan></text></g><text x="423" y="854" class="fill-N1 s1"><tspan x="423" dy="0">사고실험을 소개할 때 줄거리만 옮기면 ③부터가 사라진다.</tspan><tspan x="423" dy="17.667">무엇을 묻는지, 어떤 판단이 나오는지, 그 판단이 무엇을 지지하는지까지 적어야</tspan><tspan x="423" dy="17.667">사고실험이 논증 안에서 제 일을 한다</tspan></text><marker id="mk-d2-1518477434-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1518477434-3488378134)" d="M185.5 116v64" class="connection stroke-B1 s0" mask="url(#d2-1518477434)"/><path fill="none" marker-end="url(#mk-d2-1518477434-3488378134)" d="M185.5 284v64" class="connection stroke-B1 s0" mask="url(#d2-1518477434)"/><path fill="none" marker-end="url(#mk-d2-1518477434-3488378134)" d="M185.5 468v64" class="connection stroke-B1 s0" mask="url(#d2-1518477434)"/><path fill="none" marker-end="url(#mk-d2-1518477434-3488378134)" d="M185.5 636v64" class="connection stroke-B1 s0" mask="url(#d2-1518477434)"/><path fill="none" marker-end="url(#mk-d2-1518477434-3488378134)" d="M373 57h124" class="connection stroke-B1 s0" mask="url(#d2-1518477434)"/><text x="436" y="63" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-1518477434-3488378134)" d="M373 409h124" class="connection stroke-B1 s0" mask="url(#d2-1518477434)"/><text x="436" y="415" class="text-italic fill-N2 s1">여기를 친다</text><path fill="none" marker-end="url(#mk-d2-1518477434-3488378134)" d="M373 761h124" class="connection stroke-B1 s0" mask="url(#d2-1518477434)"/><text x="436" y="767" class="text-italic fill-N2 s1">여기를 친다</text><mask id="d2-1518477434" width="1049" height="1093" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H948V992H-101z"/><path d="M384 47h104v21H384zM384 399h104v21H384zM384 751h104v21H384z"/></mask></svg>