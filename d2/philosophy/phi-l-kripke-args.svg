<svg xmlns="http://www.w3.org/2000/svg" width="1487" height="1537" class="d2-495156241 d2-svg" viewBox="-101 -101 1487 1537"><rect width="1487" height="1537" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-495156241 .text-bold{font-weight:700}.d2-495156241 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-495156241 .fill-N1{fill:#0a0f25}.d2-495156241 .fill-N2{fill:#676c7e}.d2-495156241 .fill-B6{fill:#f7f8fe}.d2-495156241 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="653.5" cy="108" class="shape stroke-B1 fill-B6 s0" rx="283.5" ry="108"/></g><text x="653.5" y="57.5" class="text-bold fill-N1 s1"><tspan x="653.5" dy="0">무너뜨릴 상대 — 고유명에</tspan><tspan x="653.5" dy="16.625">대한 기술 이론</tspan><tspan x="653.5" dy="16.625">이름 N 에 화자가 결부시키는</tspan><tspan x="653.5" dy="16.625">기술이 있고,</tspan><tspan x="653.5" dy="16.625">N 이 가리키는 것은 그 기술을</tspan><tspan x="653.5" dy="16.625">유일하게 만족하는 것이다.</tspan><tspan x="653.5" dy="16.625">기술 다발 판본 — 결부된 기술 가운데</tspan><tspan x="653.5" dy="16.625">충분히 많은 것을 만족하는 것이 지시체다</tspan></text></g><g ><g class="shape"><path d="M0 377h402v162H0z" class="stroke-B1 fill-B6 s0"/></g><text x="201" y="415.5" class="text-bold fill-N1 s1"><tspan x="201" dy="0">양상 논증</tspan><tspan x="201" dy="16.714">뜻이 같다면 ‘아리스토텔레스는</tspan><tspan x="201" dy="16.714">알렉산더를</tspan><tspan x="201" dy="16.714">가르쳤다’ 가 필연적 참이어야 한다.</tspan><tspan x="201" dy="16.714">그가 정치에 뛰어들어 알렉산더를 만나지</tspan><tspan x="201" dy="16.714">못한 세계에서도 그는 아리스토텔레스다.</tspan><tspan x="201" dy="16.714">쓰는 축 — 11 장의 필연 · 우연</tspan></text></g><g ><g class="shape"><path d="M462 393h383v130H462z" class="stroke-B1 fill-B6 s0"/></g><text x="653.5" y="431.5" class="text-bold fill-N1 s1"><tspan x="653.5" dy="0">인식 논증</tspan><tspan x="653.5" dy="17">뜻이 같다면 그 문장을 총각이 미혼임을</tspan><tspan x="653.5" dy="17">알듯 경험 없이 알 수 있어야 한다.</tspan><tspan x="653.5" dy="17">그것은 역사가들이 알아낸 것이다.</tspan><tspan x="653.5" dy="17">쓰는 축 — 11 장의 선험 · 후험</tspan></text></g><g ><g class="shape"><path d="M905 337h380v242H905z" class="stroke-B1 fill-B6 s0"/></g><text x="1095" y="375.5" class="text-bold fill-N1 s1"><tspan x="1095" dy="0">의미론 논증</tspan><tspan x="1095" dy="16.417">대부분의 사람이 ‘괴델’</tspan><tspan x="1095" dy="16.417">에 결부시키는 기술은</tspan><tspan x="1095" dy="16.417">‘산술의 불완전성을 증명한</tspan><tspan x="1095" dy="16.417">사람’ 하나다.</tspan><tspan x="1095" dy="16.417">실은 슈미트가 증명했고 괴델이 원고를</tspan><tspan x="1095" dy="16.417">가로챘다고 하자. 기술 이론대로라면</tspan><tspan x="1095" dy="16.417">우리가 가리키는 것은 슈미트다.</tspan><tspan x="1095" dy="16.417">그렇지 않다 — 우리는 여전히</tspan><tspan x="1095" dy="16.417">괴델을 가리키고</tspan><tspan x="1095" dy="16.417">다만 그에 대해 틀린 것을</tspan><tspan x="1095" dy="16.417">믿고 있을 뿐이다</tspan></text></g><g ><g class="shape"><path d="M246 700h363v82H246z" class="stroke-B1 fill-B6 s0"/></g><text x="427.5" y="738.5" class="text-bold fill-N1 s1"><tspan x="427.5" dy="0">무너지는 것 — 주장 A</tspan><tspan x="427.5" dy="18.5">이름의 뜻은 결부된 기술의 뜻과 같다</tspan></text></g><g ><g class="shape"><path d="M905 700h380v82H905z" class="stroke-B1 fill-B6 s0"/></g><text x="1095" y="738.5" class="text-bold fill-N1 s1"><tspan x="1095" dy="0">무너지는 것 — 주장 B</tspan><tspan x="1095" dy="18.5">결부된 기술이 이름의 지시체를 정한다</tspan></text></g><g ><g class="shape"><ellipse cx="648" cy="992" class="shape stroke-B1 fill-B6 s0" rx="235" ry="110"/></g><text x="648" y="941.5" class="text-bold fill-N1 s1"><tspan x="648" dy="0">셋의 무게가 다르다</tspan><tspan x="648" dy="16.625">앞의 둘은 이름과 기술의 뜻이</tspan><tspan x="648" dy="16.625">같지 않음을 보이고</tspan><tspan x="648" dy="16.625">셋째는 기술이 지시체를 정하지도</tspan><tspan x="648" dy="16.625">못함을 보인다.</tspan><tspan x="648" dy="16.625">그래서 셋째가 가장 세다 —</tspan><tspan x="648" dy="16.625">앞의 둘을 막는</tspan><tspan x="648" dy="16.625">수선책이 있어도 셋째는 남는다</tspan></text></g><text x="429.5" y="1242" class="fill-N1 s1"><tspan x="429.5" dy="0">양상 논증과 인식 논증이 한 논증이 아닌 까닭 —</tspan><tspan x="429.5" dy="17">11 장이 필연과 선험을 두 축으로</tspan><tspan x="429.5" dy="17">갈라 놓았기 때문이다.</tspan><tspan x="429.5" dy="17">두 축이 하나였다면 같은 논증을</tspan><tspan x="429.5" dy="17">두 번 적은 것에 지나지 않았을 것이다</tspan></text><text x="867" y="1218" class="fill-N1 s1"><tspan x="867" dy="0">수선책 하나 — 고정화된 기술.</tspan><tspan x="867" dy="16.625">‘실제로 알렉산더를 가르친 사람’ 은</tspan><tspan x="867" dy="16.625">확정 기술이면서 고정지시어다.</tspan><tspan x="867" dy="16.625">양상 논증은 막는다.</tspan><tspan x="867" dy="16.625">인식 논증은 못 막는다 — 그 기술이 참인지는</tspan><tspan x="867" dy="16.625">여전히 경험으로 알아내야 한다.</tspan><tspan x="867" dy="16.625">의미론 논증도 못 막는다 — 가진 기술이</tspan><tspan x="867" dy="16.625">통째로 틀린 경우가 그대로 남는다</tspan></text><marker id="mk-d2-495156241-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-495156241-3488378134)" d="M449.127 183.7C251 257.8 201 296.7 201 373.5" class="connection stroke-B1 s0" mask="url(#d2-495156241)"/><text x="283.5" y="251" class="text-italic fill-N2 s1">세 방향에서 친다</text><path fill="none" marker-end="url(#mk-d2-495156241-3488378134)" d="M653.983 218c-.383 46.4-.483 81.9-.483 171.5" class="connection stroke-B1 s0" mask="url(#d2-495156241)"/><text x="653.5" y="310" class="text-italic fill-N2 s1">세 방향에서 친다</text><path fill="none" marker-end="url(#mk-d2-495156241-3488378134)" d="M855.867 184.717C1046.8 258 1095 288.7 1095 333.5" class="connection stroke-B1 s0" mask="url(#d2-495156241)"/><text x="999.5" y="245" class="text-italic fill-N2 s1">세 방향에서 친다</text><path fill="none" marker-end="url(#mk-d2-495156241-3488378134)" d="M201 540.5c0 78.8 26.8 111.2 130.36 158.343" class="connection stroke-B1 s0" mask="url(#d2-495156241)"/><text x="226" y="655" class="text-italic fill-N2 s1">겨눈다</text><path fill="none" marker-end="url(#mk-d2-495156241-3488378134)" d="M653.5 524.5c0 91.6-26.8 127.2-130.36 174.343" class="connection stroke-B1 s0" mask="url(#d2-495156241)"/><text x="633" y="649" class="text-italic fill-N2 s1">겨눈다</text><path fill="none" marker-end="url(#mk-d2-495156241-3488378134)" d="M1095 580.5v116" class="connection stroke-B1 s0" mask="url(#d2-495156241)"/><text x="1095" y="645" class="text-italic fill-N2 s1">겨눈다</text><path fill="none" marker-end="url(#mk-d2-495156241-3488378134)" d="M427.25 784c0 38 18.75 61.6 90.512 113.651" class="connection stroke-B1 s0" mask="url(#d2-495156241)"/><path fill="none" marker-end="url(#mk-d2-495156241-3488378134)" d="M1095 784c0 38-52 66.6-256.234 139.653" class="connection stroke-B1 s0" mask="url(#d2-495156241)"/><mask id="d2-495156241" width="1487" height="1537" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1487v1537H-101z"/><path d="M211 235h145v21H211zM581 294h145v21H581zM927 229h145v21H927zM195 639h62v21h-62zM602 633h62v21h-62zM1064 629h62v21h-62z"/></mask></svg>