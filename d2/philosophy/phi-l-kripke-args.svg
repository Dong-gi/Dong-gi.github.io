<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="1801" class="d2-1614827595 d2-svg" viewBox="-101 -101 1070 1801"><rect width="1070" height="1801" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1614827595 .text-bold{font-weight:700}.d2-1614827595 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1614827595 .fill-N1{fill:#0a0f25}.d2-1614827595 .fill-N2{fill:#676c7e}.d2-1614827595 .fill-B6{fill:#f7f8fe}.d2-1614827595 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="431.5" cy="136" class="shape stroke-B1 fill-B6 s0" rx="202.5" ry="136"/></g><text x="431.5" y="69.5" class="text-bold fill-N1 s1"><tspan x="431.5" dy="0">무너뜨릴 상대 — 고유명에</tspan><tspan x="431.5" dy="16.5">대한 기술 이론</tspan><tspan x="431.5" dy="16.5">이름 N 에 화자가 결부시키는</tspan><tspan x="431.5" dy="16.5">기술이 있고,</tspan><tspan x="431.5" dy="16.5">N 이 가리키는 것은 그 기술을</tspan><tspan x="431.5" dy="16.5">유일하게 만족하는 것이다.</tspan><tspan x="431.5" dy="16.5">기술 다발 판본 —</tspan><tspan x="431.5" dy="16.5">결부된 기술 가운데</tspan><tspan x="431.5" dy="16.5">충분히 많은 것을 만족하는</tspan><tspan x="431.5" dy="16.5">것이 지시체다</tspan></text></g><g ><g class="shape"><path d="M0 449h254v242H0z" class="stroke-B1 fill-B6 s0"/></g><text x="127" y="487.5" class="text-bold fill-N1 s1"><tspan x="127" dy="0">양상 논증</tspan><tspan x="127" dy="16.417">뜻이 같다면</tspan><tspan x="127" dy="16.417">‘아리스토텔레스는</tspan><tspan x="127" dy="16.417">알렉산더를</tspan><tspan x="127" dy="16.417">가르쳤다’ 가</tspan><tspan x="127" dy="16.417">필연적 참이어야 한다.</tspan><tspan x="127" dy="16.417">그가 정치에 뛰어들어</tspan><tspan x="127" dy="16.417">알렉산더를 만나지</tspan><tspan x="127" dy="16.417">못한 세계에서도</tspan><tspan x="127" dy="16.417">그는 아리스토텔레스다.</tspan><tspan x="127" dy="16.417">쓰는 축 —</tspan><tspan x="127" dy="16.417">11 장의 필연 · 우연</tspan></text></g><g ><g class="shape"><path d="M314 473h235v194H314z" class="stroke-B1 fill-B6 s0"/></g><text x="431.5" y="511.5" class="text-bold fill-N1 s1"><tspan x="431.5" dy="0">인식 논증</tspan><tspan x="431.5" dy="16.556">뜻이 같다면 그 문장을</tspan><tspan x="431.5" dy="16.556">총각이 미혼임을</tspan><tspan x="431.5" dy="16.556">알듯 경험 없이</tspan><tspan x="431.5" dy="16.556">알 수 있어야 한다.</tspan><tspan x="431.5" dy="16.556">그것은 역사가들이</tspan><tspan x="431.5" dy="16.556">알아낸 것이다.</tspan><tspan x="431.5" dy="16.556">쓰는 축 —</tspan><tspan x="431.5" dy="16.556">11 장의 선험 · 후험</tspan></text></g><g ><g class="shape"><path d="M614 409h254v322H614z" class="stroke-B1 fill-B6 s0"/></g><text x="741" y="447.5" class="text-bold fill-N1 s1"><tspan x="741" dy="0">의미론 논증</tspan><tspan x="741" dy="16.294">대부분의 사람이 ‘괴델’</tspan><tspan x="741" dy="16.294">에 결부시키는 기술은</tspan><tspan x="741" dy="16.294">‘산술의 불완전성을</tspan><tspan x="741" dy="16.294">증명한 사람’ 하나다.</tspan><tspan x="741" dy="16.294">실은 슈미트가 증명했고</tspan><tspan x="741" dy="16.294">괴델이 원고를</tspan><tspan x="741" dy="16.294">가로챘다고 하자.</tspan><tspan x="741" dy="16.294">기술 이론대로라면</tspan><tspan x="741" dy="16.294">우리가 가리키는 것은</tspan><tspan x="741" dy="16.294">슈미트다.</tspan><tspan x="741" dy="16.294">그렇지 않다 —</tspan><tspan x="741" dy="16.294">우리는 여전히</tspan><tspan x="741" dy="16.294">괴델을 가리키고</tspan><tspan x="741" dy="16.294">다만 그에 대해</tspan><tspan x="741" dy="16.294">틀린 것을</tspan><tspan x="741" dy="16.294">믿고 있을 뿐이다</tspan></text></g><g ><g class="shape"><path d="M152 852h255v98H152z" class="stroke-B1 fill-B6 s0"/></g><text x="279.5" y="890.5" class="text-bold fill-N1 s1"><tspan x="279.5" dy="0">무너지는 것 — 주장 A</tspan><tspan x="279.5" dy="17.667">이름의 뜻은</tspan><tspan x="279.5" dy="17.667">결부된 기술의 뜻과 같다</tspan></text></g><g ><g class="shape"><path d="M615 852h252v98H615z" class="stroke-B1 fill-B6 s0"/></g><text x="741" y="890.5" class="text-bold fill-N1 s1"><tspan x="741" dy="0">무너지는 것 — 주장 B</tspan><tspan x="741" dy="17.667">결부된 기술이</tspan><tspan x="741" dy="17.667">이름의 지시체를 정한다</tspan></text></g><g ><g class="shape"><ellipse cx="436" cy="1160" class="shape stroke-B1 fill-B6 s0" rx="235" ry="110"/></g><text x="436" y="1109.5" class="text-bold fill-N1 s1"><tspan x="436" dy="0">셋의 무게가 다르다</tspan><tspan x="436" dy="16.625">앞의 둘은 이름과 기술의 뜻이</tspan><tspan x="436" dy="16.625">같지 않음을 보이고</tspan><tspan x="436" dy="16.625">셋째는 기술이 지시체를 정하지도</tspan><tspan x="436" dy="16.625">못함을 보인다.</tspan><tspan x="436" dy="16.625">그래서 셋째가 가장 세다 —</tspan><tspan x="436" dy="16.625">앞의 둘을 막는</tspan><tspan x="436" dy="16.625">수선책이 있어도 셋째는 남는다</tspan></text></g><text x="294.5" y="1426" class="fill-N1 s1"><tspan x="294.5" dy="0">양상 논증과 인식 논증이</tspan><tspan x="294.5" dy="16.556">한 논증이 아닌 까닭 —</tspan><tspan x="294.5" dy="16.556">11 장이 필연과 선험을</tspan><tspan x="294.5" dy="16.556">두 축으로</tspan><tspan x="294.5" dy="16.556">갈라 놓았기 때문이다.</tspan><tspan x="294.5" dy="16.556">두 축이 하나였다면</tspan><tspan x="294.5" dy="16.556">같은 논증을</tspan><tspan x="294.5" dy="16.556">두 번 적은 것에</tspan><tspan x="294.5" dy="16.556">지나지 않았을 것이다</tspan></text><text x="578" y="1386" class="fill-N1 s1"><tspan x="578" dy="0">수선책 하나 — 고정화된 기술.</tspan><tspan x="578" dy="16.357">‘실제로 알렉산더를</tspan><tspan x="578" dy="16.357">가르친 사람’ 은</tspan><tspan x="578" dy="16.357">확정 기술이면서</tspan><tspan x="578" dy="16.357">고정지시어다.</tspan><tspan x="578" dy="16.357">양상 논증은 막는다.</tspan><tspan x="578" dy="16.357">인식 논증은 못 막는다 —</tspan><tspan x="578" dy="16.357">그 기술이 참인지는</tspan><tspan x="578" dy="16.357">여전히 경험으로</tspan><tspan x="578" dy="16.357">알아내야 한다.</tspan><tspan x="578" dy="16.357">의미론 논증도 못 막는다 —</tspan><tspan x="578" dy="16.357">가진 기술이</tspan><tspan x="578" dy="16.357">통째로 틀린 경우가</tspan><tspan x="578" dy="16.357">그대로 남는다</tspan></text><marker id="mk-d2-1614827595-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1614827595-3488378134)" d="M286.341 233.118C159.2 318.8 127 362.3 127 445.5" class="connection stroke-B1 s0" mask="url(#d2-1614827595)"/><text x="165" y="312" class="text-italic fill-N2 s1"><tspan x="165" dy="0">세 방향에서</tspan><tspan x="165" dy="18.5">친다</tspan></text><path fill="none" marker-end="url(#mk-d2-1614827595-3488378134)" d="M431.985 274c-.385 52.8-.485 93.1-.485 195.5" class="connection stroke-B1 s0" mask="url(#d2-1614827595)"/><text x="432" y="370" class="text-italic fill-N2 s1"><tspan x="432" dy="0">세 방향에서</tspan><tspan x="432" dy="18.5">친다</tspan></text><path fill="none" marker-end="url(#mk-d2-1614827595-3488378134)" d="M576.673 233.097C707.4 318.8 740.5 354.3 740.5 405.5" class="connection stroke-B1 s0" mask="url(#d2-1614827595)"/><text x="685" y="301" class="text-italic fill-N2 s1"><tspan x="685" dy="0">세 방향에서</tspan><tspan x="685" dy="18.5">친다</tspan></text><path fill="none" marker-end="url(#mk-d2-1614827595-3488378134)" d="M127 692.5c0 78.8 16.6 111.2 79.777 157.631" class="connection stroke-B1 s0" mask="url(#d2-1614827595)"/><text x="136" y="794" class="text-italic fill-N2 s1">겨눈다</text><path fill="none" marker-end="url(#mk-d2-1614827595-3488378134)" d="M431.5 668.5c0 98-16.6 135.2-79.777 181.631" class="connection stroke-B1 s0" mask="url(#d2-1614827595)"/><text x="427" y="783" class="text-italic fill-N2 s1">겨눈다</text><path fill="none" marker-end="url(#mk-d2-1614827595-3488378134)" d="M740.5 732.5v116" class="connection stroke-B1 s0" mask="url(#d2-1614827595)"/><text x="741" y="797" class="text-italic fill-N2 s1">겨눈다</text><path fill="none" marker-end="url(#mk-d2-1614827595-3488378134)" d="M279.25 952c0 38 11.75 60 55.952 105.142" class="connection stroke-B1 s0" mask="url(#d2-1614827595)"/><path fill="none" marker-end="url(#mk-d2-1614827595-3488378134)" d="M740.5 952c0 38-29.7 63.6-144.959 124.14" class="connection stroke-B1 s0" mask="url(#d2-1614827595)"/><mask id="d2-1614827595" width="1070" height="1801" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H969v1801H-101z"/><path d="M113 296h104v37H113zM380 354h104v37H380zM633 285h104v37H633zM105 778h62v21h-62zM396 767h62v21h-62zM710 781h62v21h-62z"/></mask></svg>