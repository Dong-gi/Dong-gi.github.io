<svg xmlns="http://www.w3.org/2000/svg" width="3003" height="822" class="d2-2289856226 d2-svg" viewBox="-101 -101 3003 822"><rect width="3003" height="822" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2289856226 .fill-N1{fill:#0a0f25}.d2-2289856226 .fill-N2{fill:#676c7e}.d2-2289856226 .fill-B6{fill:#f7f8fe}.d2-2289856226 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="284" cy="203.5" class="shape stroke-B1 fill-B6 s0" rx="284" ry="94.5"/></g><text x="284" y="169" class="text-bold fill-N1 s1"><tspan x="284" dy="0">무너뜨릴 상대 — 고유명에 대한 기술 이론</tspan><tspan x="284" dy="16.833">이름 N 에 화자가 결부시키는 기술이 있고,</tspan><tspan x="284" dy="16.833">N 이 가리키는 것은 그 기술을</tspan><tspan x="284" dy="16.833">유일하게 만족하는 것이다.</tspan><tspan x="284" dy="16.833">기술 다발 판본 — 결부된 기술 가운데</tspan><tspan x="284" dy="16.833">충분히 많은 것을 만족하는 것이 지시체다</tspan></text></g><g ><g class="shape"><path d="M899 0h428v146H899z" class="stroke-B1 fill-B6 s0"/></g><text x="1113" y="38.5" class="text-bold fill-N1 s1"><tspan x="1113" dy="0">양상 논증</tspan><tspan x="1113" dy="16.833">뜻이 같다면 ‘아리스토텔레스는 알렉산더를</tspan><tspan x="1113" dy="16.833">가르쳤다’ 가 필연적 참이어야 한다.</tspan><tspan x="1113" dy="16.833">그가 정치에 뛰어들어 알렉산더를 만나지</tspan><tspan x="1113" dy="16.833">못한 세계에서도 그는 아리스토텔레스다.</tspan><tspan x="1113" dy="16.833">쓰는 축 — 11 장의 필연 · 우연</tspan></text></g><g ><g class="shape"><path d="M922 206h383v130H922z" class="stroke-B1 fill-B6 s0"/></g><text x="1113.5" y="244.5" class="text-bold fill-N1 s1"><tspan x="1113.5" dy="0">인식 논증</tspan><tspan x="1113.5" dy="17">뜻이 같다면 그 문장을 총각이 미혼임을</tspan><tspan x="1113.5" dy="17">알듯 경험 없이 알 수 있어야 한다.</tspan><tspan x="1113.5" dy="17">그것은 역사가들이 알아낸 것이다.</tspan><tspan x="1113.5" dy="17">쓰는 축 — 11 장의 선험 · 후험</tspan></text></g><g ><g class="shape"><path d="M890 396h446v178H890z" class="stroke-B1 fill-B6 s0"/></g><text x="1113" y="434.5" class="text-bold fill-N1 s1"><tspan x="1113" dy="0">의미론 논증</tspan><tspan x="1113" dy="16.625">대부분의 사람이 ‘괴델’ 에 결부시키는 기술은</tspan><tspan x="1113" dy="16.625">‘산술의 불완전성을 증명한 사람’ 하나다.</tspan><tspan x="1113" dy="16.625">실은 슈미트가 증명했고 괴델이 원고를</tspan><tspan x="1113" dy="16.625">가로챘다고 하자. 기술 이론대로라면</tspan><tspan x="1113" dy="16.625">우리가 가리키는 것은 슈미트다.</tspan><tspan x="1113" dy="16.625">그렇지 않다 — 우리는 여전히 괴델을 가리키고</tspan><tspan x="1113" dy="16.625">다만 그에 대해 틀린 것을 믿고 있을 뿐이다</tspan></text></g><g ><g class="shape"><path d="M1584 100h363v82h-363z" class="stroke-B1 fill-B6 s0"/></g><text x="1765.5" y="138.5" class="text-bold fill-N1 s1"><tspan x="1765.5" dy="0">무너지는 것 — 주장 A</tspan><tspan x="1765.5" dy="18.5">이름의 뜻은 결부된 기술의 뜻과 같다</tspan></text></g><g ><g class="shape"><path d="M1575 444h380v82h-380z" class="stroke-B1 fill-B6 s0"/></g><text x="1765" y="482.5" class="text-bold fill-N1 s1"><tspan x="1765" dy="0">무너지는 것 — 주장 B</tspan><tspan x="1765" dy="18.5">결부된 기술이 이름의 지시체를 정한다</tspan></text></g><g ><g class="shape"><ellipse cx="2468.5" cy="172" class="shape stroke-B1 fill-B6 s0" rx="332.5" ry="111"/></g><text x="2468.5" y="145.5" class="text-bold fill-N1 s1"><tspan x="2468.5" dy="0">셋의 무게가 다르다</tspan><tspan x="2468.5" dy="17">앞의 둘은 이름과 기술의 뜻이 같지 않음을 보이고</tspan><tspan x="2468.5" dy="17">셋째는 기술이 지시체를 정하지도 못함을 보인다.</tspan><tspan x="2468.5" dy="17">그래서 셋째가 가장 세다 — 앞의 둘을 막는</tspan><tspan x="2468.5" dy="17">수선책이 있어도 셋째는 남는다</tspan></text></g><text x="284" y="374" class="fill-N1 s1"><tspan x="284" dy="0">위의 둘이 한 논증이 아닌 까닭 —</tspan><tspan x="284" dy="17.25">11 장이 필연과 선험을 두 축으로 갈라 놓았기 때문이다.</tspan><tspan x="284" dy="17.25">두 축이 하나였다면 같은 논증을</tspan><tspan x="284" dy="17.25">두 번 적은 것에 지나지 않았을 것이다</tspan></text><text x="284" y="503" class="fill-N1 s1"><tspan x="284" dy="0">수선책 하나 — 고정화된 기술.</tspan><tspan x="284" dy="16.625">‘실제로 알렉산더를 가르친 사람’ 은</tspan><tspan x="284" dy="16.625">확정 기술이면서 고정지시어다.</tspan><tspan x="284" dy="16.625">양상 논증은 막는다.</tspan><tspan x="284" dy="16.625">인식 논증은 못 막는다 — 그 기술이 참인지는</tspan><tspan x="284" dy="16.625">여전히 경험으로 알아내야 한다.</tspan><tspan x="284" dy="16.625">의미론 논증도 못 막는다 — 가진 기술이</tspan><tspan x="284" dy="16.625">통째로 틀린 경우가 그대로 남는다</tspan></text><marker id="mk-d2-2289856226-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2289856226-3488378134)" d="M498.92 140.437C682.6 86.6 763 73 895 73" class="connection stroke-B1 s0" mask="url(#d2-2289856226)"/><text x="694.5" y="90" class="text-italic fill-N2 s1">세 방향에서 친다</text><path fill="none" marker-end="url(#mk-d2-2289856226-3488378134)" d="M544.976 242.308C691.8 265.2 767.5 271 917.5 271" class="connection stroke-B1 s0" mask="url(#d2-2289856226)"/><text x="731.5" y="274" class="text-italic fill-N2 s1">세 방향에서 친다</text><path fill="none" marker-end="url(#mk-d2-2289856226-3488378134)" d="M417.69 288.07C666.4 445.4 761.2 485 886 485" class="connection stroke-B1 s0" mask="url(#d2-2289856226)"/><text x="639.5" y="434" class="text-italic fill-N2 s1">세 방향에서 친다</text><path fill="none" marker-end="url(#mk-d2-2289856226-3488378134)" d="M1328.5 73c101.2 0 152.6 5.624 251.093 27.264" class="connection stroke-B1 s0" mask="url(#d2-2289856226)"/><text x="1456" y="81" class="text-italic fill-N2 s1">겨눈다</text><path fill="none" marker-end="url(#mk-d2-2289856226-3488378134)" d="M1307.5 271c118 0 190.4-17.8 356.312-87.452" class="connection stroke-B1 s0" mask="url(#d2-2289856226)"/><text x="1493" y="260" class="text-italic fill-N2 s1">겨눈다</text><path fill="none" marker-end="url(#mk-d2-2289856226-3488378134)" d="M1337.5 485h234" class="connection stroke-B1 s0" mask="url(#d2-2289856226)"/><text x="1456" y="491" class="text-italic fill-N2 s1">겨눈다</text><path fill="none" marker-end="url(#mk-d2-2289856226-3488378134)" d="M1949.5 141c76.4 0 115.699 1.6 190.513 7.676" class="connection stroke-B1 s0" mask="url(#d2-2289856226)"/><path fill="none" marker-end="url(#mk-d2-2289856226-3488378134)" d="M1956.5 485c70.8 0 146.3-42.4 372.285-209.62" class="connection stroke-B1 s0" mask="url(#d2-2289856226)"/><mask id="d2-2289856226" width="3003" height="822" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3003v822H-101z"/><path d="M622 74h145v21H622zM659 258h145v21H659zM567 418h145v21H567zM1425 65h62v21h-62zM1462 244h62v21h-62zM1425 475h62v21h-62z"/></mask></svg>