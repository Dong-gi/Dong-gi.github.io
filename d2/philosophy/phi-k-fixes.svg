<svg xmlns="http://www.w3.org/2000/svg" width="1243" height="1218" class="d2-4218204571 d2-svg" viewBox="-101 -101 1243 1218"><rect width="1243" height="1218" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-4218204571 .text-bold{font-weight:700}.d2-4218204571 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4218204571 .fill-N1{fill:#0a0f25}.d2-4218204571 .fill-N2{fill:#676c7e}.d2-4218204571 .fill-B6{fill:#f7f8fe}.d2-4218204571 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="88" cy="512" class="shape stroke-B1 fill-B6 s0" rx="88" ry="42"/></g><text x="88" y="509.5" class="text-bold fill-N1 s1"><tspan x="88" dy="0">정당화된</tspan><tspan x="88" dy="18.5">참인 믿음</tspan></text></g><g ><g class="shape"><path d="M315 471h104v82H315z" class="stroke-B1 fill-B6 s0"/></g><text x="367" y="509.5" class="text-bold fill-N1 s1"><tspan x="367" dy="0">게티어</tspan><tspan x="367" dy="18.5">사례</tspan></text></g><g ><g class="shape"><path d="M526 0h188v114H526z" class="stroke-B1 fill-B6 s0"/></g><text x="620" y="38.5" class="text-bold fill-N1 s1"><tspan x="620" dy="0">무오류 조건</tspan><tspan x="620" dy="17.25">정당화가 거짓을</tspan><tspan x="620" dy="17.25">통과할 수</tspan><tspan x="620" dy="17.25">없어야 한다</tspan></text></g><g ><g class="shape"><path d="M536 174h168v130H536z" class="stroke-B1 fill-B6 s0"/></g><text x="620" y="212.5" class="text-bold fill-N1 s1"><tspan x="620" dy="0">거짓 전제</tspan><tspan x="620" dy="17">없음 조건</tspan><tspan x="620" dy="17">앎에 이르는</tspan><tspan x="620" dy="17">추론에 거짓이</tspan><tspan x="620" dy="17">끼면 안 된다</tspan></text></g><g ><g class="shape"><path d="M536 364h168v114H536z" class="stroke-B1 fill-B6 s0"/></g><text x="620" y="402.5" class="text-bold fill-N1 s1"><tspan x="620" dy="0">인과 조건</tspan><tspan x="620" dy="17.25">사실과 믿음이</tspan><tspan x="620" dy="17.25">인과로</tspan><tspan x="620" dy="17.25">이어져야 한다</tspan></text></g><g ><g class="shape"><path d="M524 538h191v130H524z" class="stroke-B1 fill-B6 s0"/></g><text x="619.5" y="576.5" class="text-bold fill-N1 s1"><tspan x="619.5" dy="0">무효화 요인</tspan><tspan x="619.5" dy="17">없음 조건</tspan><tspan x="619.5" dy="17">알았다면</tspan><tspan x="619.5" dy="17">믿음을 거뒀을</tspan><tspan x="619.5" dy="17">참이 없어야 한다</tspan></text></g><g ><g class="shape"><path d="M519 728h201v114H519z" class="stroke-B1 fill-B6 s0"/></g><text x="619.5" y="766.5" class="text-bold fill-N1 s1"><tspan x="619.5" dy="0">민감성</tspan><tspan x="619.5" dy="17.25">P 가 거짓이었다면</tspan><tspan x="619.5" dy="17.25">믿지 않았을</tspan><tspan x="619.5" dy="17.25">것이다</tspan></text></g><g ><g class="shape"><path d="M526 902h188v114H526z" class="stroke-B1 fill-B6 s0"/></g><text x="620" y="940.5" class="text-bold fill-N1 s1"><tspan x="620" dy="0">안전성</tspan><tspan x="620" dy="17.25">비슷한 경우에</tspan><tspan x="620" dy="17.25">믿었다면</tspan><tspan x="620" dy="17.25">참이었을 것이다</tspan></text></g><text x="960" y="39" class="fill-N1 s1"><tspan x="960" dy="0">아는 것이</tspan><tspan x="960" dy="17.25">거의 남지 않는다.</tspan><tspan x="960" dy="17.25">7 장의 회의주의로</tspan><tspan x="960" dy="17.25">곧장 간다</tspan></text><text x="959.5" y="237" class="fill-N1 s1"><tspan x="959.5" dy="0">가짜 헛간 들판에는</tspan><tspan x="959.5" dy="18.5">거짓 전제가 없다</tspan></text><text x="959.5" y="395" class="fill-N1 s1"><tspan x="959.5" dy="0">수학적 참은 인과로</tspan><tspan x="959.5" dy="17">이어지지 않는다.</tspan><tspan x="959.5" dy="17">헛간 사례에는</tspan><tspan x="959.5" dy="17">인과가 있는데도</tspan><tspan x="959.5" dy="17">앎이 아니다</tspan></text><text x="959.5" y="569" class="fill-N1 s1"><tspan x="959.5" dy="0">오도하는 참까지</tspan><tspan x="959.5" dy="16.833">무효화 요인으로</tspan><tspan x="959.5" dy="16.833">세면 앎이 거의</tspan><tspan x="959.5" dy="16.833">사라지고,</tspan><tspan x="959.5" dy="16.833">안 세자니</tspan><tspan x="959.5" dy="16.833">가르는 규칙이 없다</tspan></text><text x="959.5" y="767" class="fill-N1 s1"><tspan x="959.5" dy="0">폐쇄 원리를 잃는다</tspan><tspan x="959.5" dy="17.25">(7 장).</tspan><tspan x="959.5" dy="17.25">아는 것의 귀결을</tspan><tspan x="959.5" dy="17.25">모를 수 있게 된다</tspan></text><text x="960" y="925" class="fill-N1 s1"><tspan x="960" dy="0">필연적 참은</tspan><tspan x="960" dy="16.833">무엇을 믿어도</tspan><tspan x="960" dy="16.833">안전해진다.</tspan><tspan x="960" dy="16.833">안전의 반경을</tspan><tspan x="960" dy="16.833">정하는 규칙이</tspan><tspan x="960" dy="16.833">따로 없다</tspan></text><marker id="mk-d2-4218204571-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4218204571-3488378134)" d="M178 512h133.5" class="connection stroke-B1 s0" mask="url(#d2-4218204571)"/><text x="245.5" y="518" class="text-italic fill-N2 s1">반례</text><path fill="none" marker-end="url(#mk-d2-4218204571-3488378134)" d="M376.438 469.049C450.4 139.799 480.3 57 521.5 57" class="connection stroke-B1 s0" mask="url(#d2-4218204571)"/><path fill="none" marker-end="url(#mk-d2-4218204571-3488378134)" d="M382.702 469.127C451.6 285.4 482.3 239 531.5 239" class="connection stroke-B1 s0" mask="url(#d2-4218204571)"/><path fill="none" marker-end="url(#mk-d2-4218204571-3488378134)" d="M414.492 469.668C457.8 431 482.3 421 531.5 421" class="connection stroke-B1 s0" mask="url(#d2-4218204571)"/><path fill="none" marker-end="url(#mk-d2-4218204571-3488378134)" d="M414.492 554.332C457.8 593 480 603 520 603" class="connection stroke-B1 s0" mask="url(#d2-4218204571)"/><path fill="none" marker-end="url(#mk-d2-4218204571-3488378134)" d="M382.702 554.873C451.6 738.6 479 785 515 785" class="connection stroke-B1 s0" mask="url(#d2-4218204571)"/><path fill="none" marker-end="url(#mk-d2-4218204571-3488378134)" d="M376.447 554.95C450.4 877.8 480.3 959 521.5 959" class="connection stroke-B1 s0" mask="url(#d2-4218204571)"/><path fill="none" marker-end="url(#mk-d2-4218204571-3488378134)