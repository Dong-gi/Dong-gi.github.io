<svg xmlns="http://www.w3.org/2000/svg" width="1519" height="1106" class="d2-1694760696 d2-svg" viewBox="-101 -101 1519 1106"><rect width="1519" height="1106" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1694760696 .text-bold{font-weight:700}.d2-1694760696 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1694760696 .fill-N1{fill:#0a0f25}.d2-1694760696 .fill-N2{fill:#676c7e}.d2-1694760696 .fill-B6{fill:#f7f8fe}.d2-1694760696 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="88" cy="448" class="shape stroke-B1 fill-B6 s0" rx="88" ry="42"/></g><text x="88" y="445.5" class="text-bold fill-N1 s1"><tspan x="88" dy="0">정당화된</tspan><tspan x="88" dy="18.5">참인 믿음</tspan></text></g><g ><g class="shape"><path d="M355 415h148v66H355z" class="stroke-B1 fill-B6 s0"/></g><text x="429" y="453.5" class="text-bold fill-N1 s1">게티어 사례</text></g><g ><g class="shape"><path d="M652 0h235v98H652z" class="stroke-B1 fill-B6 s0"/></g><text x="769.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="769.5" dy="0">무오류 조건</tspan><tspan x="769.5" dy="17.667">정당화가 거짓을</tspan><tspan x="769.5" dy="17.667">통과할 수 없어야 한다</tspan></text></g><g ><g class="shape"><path d="M662 158h215v98H662z" class="stroke-B1 fill-B6 s0"/></g><text x="769.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="769.5" dy="0">거짓 전제 없음 조건</tspan><tspan x="769.5" dy="17.667">앎에 이르는 추론에</tspan><tspan x="769.5" dy="17.667">거짓이 끼면 안 된다</tspan></text></g><g ><g class="shape"><path d="M653 316h232v98H653z" class="stroke-B1 fill-B6 s0"/></g><text x="769" y="354.5" class="text-bold fill-N1 s1"><tspan x="769" dy="0">인과 조건</tspan><tspan x="769" dy="17.667">사실과 믿음이</tspan><tspan x="769" dy="17.667">인과로 이어져야 한다</tspan></text></g><g ><g class="shape"><path d="M643 474h252v114H643z" class="stroke-B1 fill-B6 s0"/></g><text x="769" y="512.5" class="text-bold fill-N1 s1"><tspan x="769" dy="0">무효화 요인</tspan><tspan x="769" dy="17.25">없음 조건</tspan><tspan x="769" dy="17.25">알았다면 믿음을 거뒀을</tspan><tspan x="769" dy="17.25">참이 없어야 한다</tspan></text></g><g ><g class="shape"><path d="M663 648h212v98H663z" class="stroke-B1 fill-B6 s0"/></g><text x="769" y="686.5" class="text-bold fill-N1 s1"><tspan x="769" dy="0">민감성</tspan><tspan x="769" dy="17.667">P 가 거짓이었다면</tspan><tspan x="769" dy="17.667">믿지 않았을 것이다</tspan></text></g><g ><g class="shape"><path d="M643 806h252v98H643z" class="stroke-B1 fill-B6 s0"/></g><text x="769" y="844.5" class="text-bold fill-N1 s1"><tspan x="769" dy="0">안전성</tspan><tspan x="769" dy="17.667">비슷한 경우에 믿었다면</tspan><tspan x="769" dy="17.667">참이었을 것이다</tspan></text></g><text x="1226" y="31" class="fill-N1 s1"><tspan x="1226" dy="0">아는 것이</tspan><tspan x="1226" dy="17.25">거의 남지 않는다.</tspan><tspan x="1226" dy="17.25">7 장의 회의주의로</tspan><tspan x="1226" dy="17.25">곧장 간다</tspan></text><text x="1226.5" y="205" class="fill-N1 s1"><tspan x="1226.5" dy="0">가짜 헛간 들판에는</tspan><tspan x="1226.5" dy="18.5">거짓 전제가 없다</tspan></text><text x="1226.5" y="339" class="fill-N1 s1"><tspan x="1226.5" dy="0">수학적 참은 인과로</tspan><tspan x="1226.5" dy="17">이어지지 않는다.</tspan><tspan x="1226.5" dy="17">헛간 사례에는</tspan><tspan x="1226.5" dy="17">인과가 있는데도</tspan><tspan x="1226.5" dy="17">앎이 아니다</tspan></text><text x="1226" y="505" class="fill-N1 s1"><tspan x="1226" dy="0">오도하는 참까지</tspan><tspan x="1226" dy="17">무효화 요인으로 세면</tspan><tspan x="1226" dy="17">앎이 거의 사라지고,</tspan><tspan x="1226" dy="17">안 세자니</tspan><tspan x="1226" dy="17">가르는 규칙이 없다</tspan></text><text x="1226.5" y="679" class="fill-N1 s1"><tspan x="1226.5" dy="0">폐쇄 원리를 잃는다</tspan><tspan x="1226.5" dy="17.25">(7 장).</tspan><tspan x="1226.5" dy="17.25">아는 것의 귀결을</tspan><tspan x="1226.5" dy="17.25">모를 수 있게 된다</tspan></text><text x="1226" y="829" class="fill-N1 s1"><tspan x="1226" dy="0">필연적 참은</tspan><tspan x="1226" dy="17">무엇을 믿어도</tspan><tspan x="1226" dy="17">안전해진다.</tspan><tspan x="1226" dy="17">안전의 반경을 정하는</tspan><tspan x="1226" dy="17">규칙이 따로 없다</tspan></text><marker id="mk-d2-1694760696-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1694760696-3488378134)" d="M178 448h173.5" class="connection stroke-B1 s0" mask="url(#d2-1694760696)"/><text x="265.5" y="454" class="text-italic fill-N2 s1">반례</text><path fill="none" marker-end="url(#mk-d2-1694760696-3488378134)" d="M441.679 413.119C546.6 122.199 588.7 49 647.5 49" class="connection stroke-B1 s0" mask="url(#d2-1694760696)"/><path fill="none" marker-end="url(#mk-d2-1694760696-3488378134)" d="M450.024 413.282C548.2 248.6 590.7 207 657.5 207" class="connection stroke-B1 s0" mask="url(#d2-1694760696)"/><path fill="none" marker-end="url(#mk-d2-1694760696-3488378134)" d="M487.734 414.003C555.6 375 589 365 649 365" class="connection stroke-B1 s0" mask="url(#d2-1694760696)"/><path fill="none" marker-end="url(#mk-d2-1694760696-3488378134)" d="M487.734 481.997C555.6 521 587 531 639 531" class="connection stroke-B1 s0" mask="url(#d2-1694760696)"/><path fill="none" marker-end="url(#mk-d2-1694760696-3488378134)" d="M449.002 482.731C548 653.8 591 697 659 697" class="connection stroke-B1 s0" mask="url(#d2-1694760696)"/><path fill="none" marker-end="url(#mk-d2-1694760696-3488378134)" d="M441.666 482.886C546.6 780.2 587 855 639 855" class="connection stroke-B1 s0" mask="url(#d2-1694760696)"/><path fill="none" marker-end="url(#mk-d2-1694760696-3488378134)" d="M889.5 49H1146" class="connection stroke-B1 s0" mask="url(#d2-1694760696)"/><text x="1019" y="55" class="text-italic fill-N2 s1">걸리는 자리</text><path fill="none" marker-end="url(#mk-d2-1694760696-3488378134)" d="M879.5 207h261" class="connection stroke-B1 s0" mask="url(#d2-1694760696)"/><text x="1011" y="213" class="text-italic fill-N2 s1">걸리는 자리</text><pat