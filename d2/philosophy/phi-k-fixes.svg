<svg xmlns="http://www.w3.org/2000/svg" width="2030" height="994" class="d2-2039635304 d2-svg" viewBox="-101 -101 2030 994"><rect width="2030" height="994" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2039635304 .fill-N1{fill:#0a0f25}.d2-2039635304 .fill-N2{fill:#676c7e}.d2-2039635304 .fill-B6{fill:#f7f8fe}.d2-2039635304 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="150" cy="396" class="shape stroke-B1 fill-B6 s0" rx="150" ry="50"/></g><text x="150" y="401.5" class="text-bold fill-N1 s1">정당화된 참인 믿음</text></g><g ><g class="shape"><path d="M479 363h148v66H479z" class="stroke-B1 fill-B6 s0"/></g><text x="553" y="401.5" class="text-bold fill-N1 s1">게티어 사례</text></g><g ><g class="shape"><path d="M777 0h383v82H777z" class="stroke-B1 fill-B6 s0"/></g><text x="968.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="968.5" dy="0">무오류 조건</tspan><tspan x="968.5" dy="18.5">정당화가 거짓을 통과할 수 없어야 한다</tspan></text></g><g ><g class="shape"><path d="M776 142h386v82H776z" class="stroke-B1 fill-B6 s0"/></g><text x="969" y="180.5" class="text-bold fill-N1 s1"><tspan x="969" dy="0">거짓 전제 없음 조건</tspan><tspan x="969" dy="18.5">앎에 이르는 추론에 거짓이 끼면 안 된다</tspan></text></g><g ><g class="shape"><path d="M811 284h316v82H811z" class="stroke-B1 fill-B6 s0"/></g><text x="969" y="322.5" class="text-bold fill-N1 s1"><tspan x="969" dy="0">인과 조건</tspan><tspan x="969" dy="18.5">사실이 믿음의 원인이어야 한다</tspan></text></g><g ><g class="shape"><path d="M767 426h403v82H767z" class="stroke-B1 fill-B6 s0"/></g><text x="968.5" y="464.5" class="text-bold fill-N1 s1"><tspan x="968.5" dy="0">무효화 요인 없음 조건</tspan><tspan x="968.5" dy="18.5">알았다면 믿음을 거뒀을 참이 없어야 한다</tspan></text></g><g ><g class="shape"><path d="M782 568h373v82H782z" class="stroke-B1 fill-B6 s0"/></g><text x="968.5" y="606.5" class="text-bold fill-N1 s1"><tspan x="968.5" dy="0">민감성</tspan><tspan x="968.5" dy="18.5">P 가 거짓이었다면 믿지 않았을 것이다</tspan></text></g><g ><g class="shape"><path d="M769 710h400v82H769z" class="stroke-B1 fill-B6 s0"/></g><text x="969" y="748.5" class="text-bold fill-N1 s1"><tspan x="969" dy="0">안전성</tspan><tspan x="969" dy="18.5">비슷한 경우에 믿었다면 참이었을 것이다</tspan></text></g><text x="1619.5" y="39" class="fill-N1 s1"><tspan x="1619.5" dy="0">아는 것이 거의 남지 않는다.</tspan><tspan x="1619.5" dy="18.5">7 장의 회의주의로 곧장 간다</tspan></text><text x="1619" y="189" class="fill-N1 s1">가짜 헛간 들판에는 거짓 전제가 없다</text><text x="1619.5" y="323" class="fill-N1 s1"><tspan x="1619.5" dy="0">수학·미래·일반 명제에는 인과가 없다.</tspan><tspan x="1619.5" dy="18.5">헛간 사례에는 인과가 있는데도 앎이 아니다</tspan></text><text x="1619" y="465" class="fill-N1 s1"><tspan x="1619" dy="0">오도하는 참까지 무효화 요인으로 세면</tspan><tspan x="1619" dy="18.5">앎이 거의 사라지고, 안 세자니 가르는 규칙이 없다</tspan></text><text x="1619.5" y="607" class="fill-N1 s1"><tspan x="1619.5" dy="0">폐쇄 원리를 잃는다(7 장).</tspan><tspan x="1619.5" dy="18.5">아는 것의 귀결을 모를 수 있게 된다</tspan></text><text x="1619" y="749" class="fill-N1 s1"><tspan x="1619" dy="0">필연적 참은 무엇을 믿어도 안전해진다.</tspan><tspan x="1619" dy="18.5">안전의 반경을 정하는 규칙이 따로 없다</tspan></text><marker id="mk-d2-2039635304-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2039635304-3488378134)" d="M302 396h173.5" class="connection stroke-B1 s0" mask="url(#d2-2039635304)"/><text x="389.5" y="402" class="text-italic fill-N2 s1">반례</text><path fill="none" marker-end="url(#mk-d2-2039635304-3488378134)" d="M566.754 361.147C670.8 105.4 713 41 773 41" class="connection stroke-B1 s0" mask="url(#d2-2039635304)"/><path fill="none" marker-end="url(#mk-d2-2039635304-3488378134)" d="M576.122 361.344C672.6 219 712.7 183 771.5 183" class="connection stroke-B1 s0" mask="url(#d2-2039635304)"/><path