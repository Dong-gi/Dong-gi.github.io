<svg xmlns="http://www.w3.org/2000/svg" width="3478" height="1015" class="d2-4079000613 d2-svg" viewBox="-101 -101 3478 1015"><rect width="3478" height="1015" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4079000613 .fill-N1{fill:#0a0f25}.d2-4079000613 .fill-N2{fill:#676c7e}.d2-4079000613 .fill-B6{fill:#f7f8fe}.d2-4079000613 .stroke-B1,.d2-4079000613 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="275" cy="286" class="shape stroke-B1 fill-B6 s0" rx="228" ry="76"/></g><text x="275" y="275.5" class="text-bold fill-N1 s1"><tspan x="275" dy="0">‘현재 프랑스의 왕은 대머리다’</tspan><tspan x="275" dy="17.667">그리고 프랑스에 왕이 없다.</tspan><tspan x="275" dy="17.667">두 사람 다 여기까지는 같이 본다</tspan></text></g><g ><g class="shape"><path d="M1105 348h-5l-267-61c-3-1-3-2 0-2l267-61c3-1 7-1 10 0l267 60c3 1 3 2 0 2l-267 62z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="1105" y="283.5" class="text-bold fill-N1 s1"><tspan x="1105" dy="0">존재 주장 ‘그런 왕이 있다’ 를</tspan><tspan x="1105" dy="18.5">어디에 두는가</tspan></text></g><g ><g class="shape"><path d="M1901 67h424v114h-424z" class="stroke-B1 fill-B6 s0"/></g><text x="2113" y="105.5" class="text-bold fill-N1 s1"><tspan x="2113" dy="0">러셀 — 문장 안에 넣는다</tspan><tspan x="2113" dy="17.25">존재 주장은 그 문장이 하는 주장의 일부다.</tspan><tspan x="2113" dy="17.25">확정 기술은 이름이 아니라 한정사 뭉치다.</tspan><tspan x="2113" dy="17.25">첫 조각이 거짓이므로 문장 전체가 거짓이다</tspan></text></g><g ><g class="shape"><path d="M1913 379h400v146h-400z" class="stroke-B1 fill-B6 s0"/></g><text x="2113" y="417.5" class="text-bold fill-N1 s1"><tspan x="2113" dy="0">스트로슨 — 문장 밖에 둔다</tspan><tspan x="2113" dy="16.833">존재는 주장되는 것이 아니라 전제된다.</tspan><tspan x="2113" dy="16.833">지시는 표현이 하는 일이 아니라</tspan><tspan x="2113" dy="16.833">사람이 표현을 써서 하는 일이다.</tspan><tspan x="2113" dy="16.833">전제가 어긋났으므로 참거짓을 묻는 것이</tspan><tspan x="2113" dy="16.833">부적절하다 — 진리값 공백</tspan></text></g><g ><g class="shape"><path d="M2770 0h462v82h-462z" class="stroke-B2 fill-B6 s2"/></g><text x="3001" y="38.5" class="text-bold fill-N1 s1"><tspan x="3001" dy="0">‘…대머리가 아니다’ 는 범위 애매성으로 갈린다.</tspan><tspan x="3001" dy="18.5">넓은 읽기는 참이고 좁은 읽기는 거짓이다</tspan></text></g><g ><g class="shape"><path d="M2761 332h480v82h-480z" class="stroke-B2 fill-B6 s2"/></g><text x="3001" y="370.5" class="text-bold fill-N1 s1"><tspan x="3001" dy="0">‘…대머리가 아니다’ 도 같은 전제를 지고 있으므로</tspan><tspan x="3001" dy="18.5">역시 값이 매겨지지 않는다</tspan></text></g><g ><g class="shape"><path d="M2743 142h516v130h-516z" class="stroke-B1 fill-B6 s0"/></g><text x="3001" y="180.5" class="text-bold fill-N1 s1"><tspan x="3001" dy="0">치르는 값 — 값이 둘뿐이라는 전제를 지킨다.</tspan><tspan x="3001" dy="17">대신 우리가 저 문장을 듣고 ‘거짓이다’ 라고</tspan><tspan x="3001" dy="17">말하지 않고 판정을 물리는 까닭을 따로 설명해야 한다.</tspan><tspan x="3001" dy="17">러셀 쪽 응답 — 그것은 문장의 뜻이 아니라</tspan><tspan x="3001" dy="17">대화에 관한 사실이다</tspan></text></g><g ><g class="shape"><path d="M2725 474h551v114h-551z" class="stroke-B1 fill-B6 s0"/></g><text x="3000.5" y="512.5" class="text-bold fill-N1 s1"><tspan x="3000.5" dy="0">치르는 값 — 우리가 실제로 보이는 반응을 그대로 설명한다.</tspan><tspan x="3000.5" dy="17.25">대신 값이 둘뿐이라는 전제를 버려야 하고</tspan><tspan x="3000.5" dy="17.25">부정 · 논리곱 · 타당성의 정의를 다시 짜야 한다.</tspan><tspan x="3000.5" dy="17.25">러셀 쪽 응답 — 얻는 것에 비해 대가가 크다</tspan></text></g><text x="275" y="438" class="fill-N1 s1"><tspan x="275" dy="0">낱말 주의 — 스트로슨의 ‘전제’(presupposition)는</tspan><tspan x="275" dy="17.25">어떤 말을 하려면 미리 성립해 있어야 하는 것이다.</tspan><tspan x="275" dy="17.25">4 장의 ‘논증의 전제’ 와 같은 한국어를 쓰지만</tspan><tspan x="275" dy="17.25">겹치지 않는다</tspan></text><text x="275" y="567" class="fill-N1 s1"><tspan x="275" dy="0">6 절로 미룬 물음 — 스트로슨이 전제라 부른 것이</tspan><tspan x="275" dy="16.625">사실은 함축일 수 있다. ‘현재 프랑스의 왕은 대머리가 아니다.</tspan><tspan x="275" dy="16.625">프랑스에 왕이 없으니까’ 는 어색하지만 모순은 아니다. 취소된다.</tspan><tspan x="275" dy="16.625">그렇다면 존재 주장은 문장의 뜻에 들어 있는 것이 아니라</tspan><tspan x="275" dy="16.625">대화에서 딸려 나온 것이고, 러셀의 분석은 그대로 두고</tspan><tspan x="275" dy="16.625">우리의 반응만 화용론으로 설명하면 된다.</tspan><tspan x="275" dy="16.625">반대편의 답 — 언어학이 다루는 전제는 부정 · 물음 · 조건문</tspan><tspan x="275" dy="16.625">아래에서 살아남는다. 그 행동은 함축과 다르다</tspan></text><text x="275.5" y="760" class="fill-N1 s1"><tspan x="275.5" dy="0">이 문서는 어느 쪽도 고르지 않는다.</tspan><tspan x="275.5" dy="17.25">확정 기술의 분석에서는 러셀이 여전히 출발점이지만</tspan><tspan x="275.5" dy="17.25">스트로슨의 진단도 살아 있고,</tspan><tspan x="275.5" dy="17.25">전제라는 개념은 언어학에 자리를 잡았다</tspan></text><marker id="mk-d2-4079000613-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4079000613-3488378134)" d="M505 286h322" class="connection stroke-B1 s0" mask="url(#d2-4079000613)"/><path fill="none" marker-end="url(#mk-d2-4079000613-3488378134)" d="M1226.914 249.419C1557 149.2 1692.2 124 1897 124" class="connection stroke-B1 s0" mask="url(#d2-4079000613)"/><text x="1556.5" y="155" class="text-italic fill-N2 s1">주장의 일부다</text><path fill="none" marker-end="url(#mk-d2-4079000613-3488378134)" d="M1223.91 322.594C1556.4 426 1694.6 452 1909 452" class="connection stroke-B1 s0" mask="url(#d2-4079000613)"/><text x="1560.5" y="432" class="text-italic fill-N2 s1">말을 시작하기 위한 조건이다</text><path fill="none" marker-end="url(#mk-d2-4079000613-3488378134)" d="M2326.961 80.608C2485 49 2573.9 41 2765.5 41" class="connection stroke-B1 s0" mask="url(#d2-4079000613)"/><text x="2545.5" y="49" class="text-italic fill-N2 s1">부정을 읽으면</text><path fill="none" marker-end="url(#mk-d2-4079000613-3488378134)" d="M2314.964 413.62C2482.6 381.2 2572.1 373 2756.5 373" class="connection stroke-B1 s0" mask="url(#d2-4079000613)"/><text x="2535.5" y="382" class="text-italic fill-N2 s1">부정을 읽으면</text><path fill="none" marker-end="url(#mk-d2-4079000613-3488378134)" d="M2326.961 167.392C2485 199 2568.5 207 2738.5 207" class="connection stroke-B1 s0" mask="url(#d2-4079000613)"/><path fill="none" marker-end="url(#mk-d2-4079000613-3488378134)" d="M2314.964 490.38C2482.6 522.799 2565 531 2721 531" class="connection stroke-B1 s0" mask="url(#d2-4079000613)"/><mask id="d2-4079000613" width="3478" height="1015" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h3478V914H-101z"/><path d="M1495 139h123v21h-123zM1438 416h245v21h-245zM2484 33h123v21h-123zM2474 366h123v21h-123z"/></mask></svg>