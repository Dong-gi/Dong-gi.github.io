<svg xmlns="http://www.w3.org/2000/svg" width="868" height="2157" class="d2-3128695606 d2-svg" viewBox="-101 -101 868 2157"><rect width="868" height="2157" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3128695606 .text-bold{font-weight:700}.d2-3128695606 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3128695606 .fill-N1{fill:#0a0f25}.d2-3128695606 .fill-N2{fill:#676c7e}.d2-3128695606 .fill-B6{fill:#f7f8fe}.d2-3128695606 .stroke-B1,.d2-3128695606 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="295" cy="74.5" class="shape stroke-B1 fill-B6 s0" rx="224" ry="74.5"/></g><text x="295" y="56" class="text-bold fill-N1 s1"><tspan x="295" dy="0">‘현재 프랑스의 왕은 대머리다’</tspan><tspan x="295" dy="17.25">그리고 프랑스에 왕이 없다.</tspan><tspan x="295" dy="17.25">두 사람 다 여기까지는</tspan><tspan x="295" dy="17.25">같이 본다</tspan></text></g><g ><g class="shape"><path d="M295 405c-1 0-2 0-3-1l-183-75q-3-1.5 0-3l183-76c2-1 5-1 7 0l182 76q3 1.5 0 3l-183 75c-1 1-2 1-3 1Z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="295" y="316.5" class="text-bold fill-N1 s1"><tspan x="295" dy="0">존재 주장</tspan><tspan x="295" dy="17.667">‘그런 왕이 있다’ 를</tspan><tspan x="295" dy="17.667">어디에 두는가</tspan></text></g><g ><g class="shape"><path d="M8 566h249v162H8z" class="stroke-B1 fill-B6 s0"/></g><text x="132.5" y="604.5" class="text-bold fill-N1 s1"><tspan x="132.5" dy="0">러셀 — 문장 안에 넣는다</tspan><tspan x="132.5" dy="16.714">존재 주장은 그 문장이</tspan><tspan x="132.5" dy="16.714">하는 주장의 일부다.</tspan><tspan x="132.5" dy="16.714">확정 기술은 이름이</tspan><tspan x="132.5" dy="16.714">아니라 한정사 뭉치다.</tspan><tspan x="132.5" dy="16.714">첫 조각이 거짓이므로</tspan><tspan x="132.5" dy="16.714">문장 전체가 거짓이다</tspan></text></g><g ><g class="shape"><path d="M322 542h270v210H322z" class="stroke-B1 fill-B6 s0"/></g><text x="457" y="580.5" class="text-bold fill-N1 s1"><tspan x="457" dy="0">스트로슨 — 문장 밖에 둔다</tspan><tspan x="457" dy="16.5">존재는 주장되는 것이</tspan><tspan x="457" dy="16.5">아니라 전제된다.</tspan><tspan x="457" dy="16.5">지시는 표현이 하는</tspan><tspan x="457" dy="16.5">일이 아니라 사람이</tspan><tspan x="457" dy="16.5">표현을 써서 하는 일이다.</tspan><tspan x="457" dy="16.5">전제가 어긋났으므로</tspan><tspan x="457" dy="16.5">참거짓을 묻는 것이</tspan><tspan x="457" dy="16.5">부적절하다 —</tspan><tspan x="457" dy="16.5">진리값 공백</tspan></text></g><g ><g class="shape"><path d="M91 873h245v146H91z" class="stroke-B2 fill-B6 s2"/></g><text x="213.5" y="911.5" class="text-bold fill-N1 s1"><tspan x="213.5" dy="0">‘…대머리가 아니다’ 는</tspan><tspan x="213.5" dy="16.833">범위 애매성으로</tspan><tspan x="213.5" dy="16.833">갈린다.</tspan><tspan x="213.5" dy="16.833">넓은 읽기는 참이고</tspan><tspan x="213.5" dy="16.833">좁은 읽기는</tspan><tspan x="213.5" dy="16.833">거짓이다</tspan></text></g><g ><g class="shape"><path d="M416 881h245v130H416z" class="stroke-B2 fill-B6 s2"/></g><text x="538.5" y="919.5" class="text-bold fill-N1 s1"><tspan x="538.5" dy="0">‘…대머리가 아니다’ 도</tspan><tspan x="538.5" dy="17">같은 전제를</tspan><tspan x="538.5" dy="17">지고 있으므로</tspan><tspan x="538.5" dy="17">역시 값이</tspan><tspan x="538.5" dy="17">매겨지지 않는다</tspan></text></g><g ><g class="shape"><path d="M16 1119h232v258H16z" class="stroke-B1 fill-B6 s0"/></g><text x="132" y="1157.5" class="text-bold fill-N1 s1"><tspan x="132" dy="0">치르는 값 —</tspan><tspan x="132" dy="16.385">값이 둘뿐이라는</tspan><tspan x="132" dy="16.385">전제를 지킨다.</tspan><tspan x="132" dy="16.385">대신 우리가</tspan><tspan x="132" dy="16.385">저 문장을 듣고</tspan><tspan x="132" dy="16.385">‘거짓이다’ 라고</tspan><tspan x="132" dy="16.385">말하지 않고</tspan><tspan x="132" dy="16.385">판정을 물리는 까닭을</tspan><tspan x="132" dy="16.385">따로 설명해야 한다.</tspan><tspan x="132" dy="16.385">러셀 쪽 응답 —</tspan><tspan x="132" dy="16.385">그것은 문장의 뜻이</tspan><tspan x="132" dy="16.385">아니라 대화에</tspan><tspan x="132" dy="16.385">관한 사실이다</tspan></text></g><g ><g class="shape"><path d="M341 1127h232v242H341z" class="stroke-B1 fill-B6 s0"/></g><text x="457" y="1165.5" class="text-bold fill-N1 s1"><tspan x="457" dy="0">치르는 값 —</tspan><tspan x="457" dy="16.417">우리가 실제로 보이는</tspan><tspan x="457" dy="16.417">반응을 그대로</tspan><tspan x="457" dy="16.417">설명한다.</tspan><tspan x="457" dy="16.417">대신 값이 둘뿐이라는</tspan><tspan x="457" dy="16.417">전제를 버려야 하고</tspan><tspan x="457" dy="16.417">부정 · 논리곱 ·</tspan><tspan x="457" dy="16.417">타당성의 정의를</tspan><tspan x="457" dy="16.417">다시 짜야 한다.</tspan><tspan x="457" dy="16.417">러셀 쪽 응답 —</tspan><tspan x="457" dy="16.417">얻는 것에 비해</tspan><tspan x="457" dy="16.417">대가가 크다</tspan></text></g><text x="457" y="1902" class="fill-N1 s1"><tspan x="457" dy="0">낱말 주의 — 스트로슨의 ‘전제’(presupposition)는</tspan><tspan x="457" dy="17.25">어떤 말을 하려면 미리 성립해 있어야 하는 것이다.</tspan><tspan x="457" dy="17.25">4 장의 ‘논증의 전제’ 와 같은 한국어를 쓰지만</tspan><tspan x="457" dy="17.25">겹치지 않는다</tspan></text><text x="132" y="1493" class="fill-N1 s1"><tspan x="132" dy="0">6 절로 미룬 물음 — 스트로슨이</tspan><tspan x="132" dy="16.263">전제라 부른 것이</tspan><tspan x="132" dy="16.263">사실은 함축일 수 있다.</tspan><tspan x="132" dy="16.263">‘현재 프랑스의 왕은</tspan><tspan x="132" dy="16.263">대머리가 아니다.</tspan><tspan x="132" dy="16.263">프랑스에 왕이 없으니까’ 는</tspan><tspan x="132" dy="16.263">어색하지만 모순은 아니다.</tspan><tspan x="132" dy="16.263">취소된다.</tspan><tspan x="132" dy="16.263">그렇다면 부정문의 존재 주장은</tspan><tspan x="132" dy="16.263">그 뜻에 들어 있는 것이 아니라</tspan><tspan x="132" dy="16.263">대화에서 딸려 나온 것이고,</tspan><tspan x="132" dy="16.263">러셀의 분석은 그대로 두고</tspan><tspan x="132" dy="16.263">우리의 반응만 화용론으로</tspan><tspan x="132" dy="16.263">설명하면 된다.</tspan><tspan x="132" dy="16.263">반대편의 답 — 언어학이</tspan><tspan x="132" dy="16.263">다루는 전제는</tspan><tspan x="132" dy="16.263">부정 · 물음 · 조건문</tspan><tspan x="132" dy="16.263">아래에서 살아남는다.</tspan><tspan x="132" dy="16.263">그 행동은 함축과 다르다</tspan></text><text x="457.5" y="1589" class="fill-N1 s1"><tspan x="457.5" dy="0">이 문서는 어느 쪽도</tspan><tspan x="457.5" dy="16.714">고르지 않는다.</tspan><tspan x="457.5" dy="16.714">확정 기술의 분석에서는</tspan><tspan x="457.5" dy="16.714">러셀이 여전히 출발점이지만</tspan><tspan x="457.5" dy="16.714">스트로슨의 진단도 살아 있고,</tspan><tspan x="457.5" dy="16.714">전제라는 개념은</tspan><tspan x="457.5" dy="16.714">언어학에 자리를 잡았다</tspan></text><marker id="mk-d2-3128695606-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3128695606-3488378134)" d="M294.98 151c-.38 38-.38 58-.02 94" class="connection stroke-B1 s0" mask="url(#d2-3128695606)"/><path fill="none" marker-end="url(#mk-d2-3128695606-3488378134)" d="M233.52 381.344C152.6 454.8 132 492.1 132 562.5" class="connection stroke-B1 s0" mask="url(#d2-3128695606)"/><text x="151.5" y="463" class="text-italic fill-N2 s1">주장의 일부다</text><path fill="none" marker-end="url(#mk-d2-3128695606-3488378134)" d="M356.482 382.344C436.6 455 457 487.3 457 538.5" class="connection stroke-B1 s0" mask="url(#d2-3128695606)"/><text x="430.5" y="447" class="text-italic fill-N2 s1"><tspan x="430.5" dy="0">말을 시작하기 위한</tspan><tspan x="430.5" dy="18.5">조건이다</tspan></text><path fill="none" marker-end="url(#mk-d2-3128695606-3488378134)" d="M173.119 729.301C205.05 795.5 213.25 824.7 213.25 869.5" class="connection stroke-B1 s0" mask="url(#d2-3128695606)"/><text x="205.5" y="803" class="text-italic fill-N2 s1">부정을 읽으면</text><path fill="none" marker-end="url(#mk-d2-3128695606-3488378134)" d="M509.133 753.295C532.25 800.3 538.25 826.3 538.25 877.5" class="connection stroke-B1 s0" mask="url(#d2-3128695606)"/><text x="535.5" y="819" class="text-italic fill-N2 s1">부정을 읽으면</text><path fill="none" marker-end="url(#mk-d2-3128695606-3488378134)" d="M90.881 729.301C58.95 795.5 50.75 839.2 50.75 879.25s4.6 199.75 21.328 236.116" class="connection stroke-B1 s0" mask="url(#d2-3128695606)"/><path fill="none" marker-end="url(#mk-d2-3128695606-3488378134)" d="M404.867 753.295C381.75 800.3 375.75 839.2 375.75 879.25s5.2 201.35 24.364 244.1" class="connection stroke-B1 s0" mask="url(#d2-3128695606)"/><mask id="d2-3128695606" width="868" height="2157" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h868v2157h-868z"/><path d="M90 447h123v21H90zM348 431h165v37H348zM144 787h123v21H144zM474 803h123v21H474z"/></mask></svg>