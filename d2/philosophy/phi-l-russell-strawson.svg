<svg xmlns="http://www.w3.org/2000/svg" width="1691" height="1642" class="d2-750149015 d2-svg" viewBox="-101 -101 1691 1642"><rect width="1691" height="1642" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-750149015 .fill-N1{fill:#0a0f25}.d2-750149015 .fill-N2{fill:#676c7e}.d2-750149015 .fill-B6{fill:#f7f8fe}.d2-750149015 .stroke-B1,.d2-750149015 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="705" cy="76" class="shape stroke-B1 fill-B6 s0" rx="228" ry="76"/></g><text x="705" y="65.5" class="text-bold fill-N1 s1"><tspan x="705" dy="0">‘현재 프랑스의 왕은 대머리다’</tspan><tspan x="705" dy="17.667">그리고 프랑스에 왕이 없다.</tspan><tspan x="705" dy="17.667">두 사람 다 여기까지는 같이 본다</tspan></text></g><g ><g class="shape"><path d="M705 376h-5l-267-61c-3-1-3-2 0-2l267-61c3-1 7-1 10 0l267 60c3 1 3 2 0 2l-267 62z" class="stroke-B1" style="fill:#cfd2dd;stroke-width:2"/></g><text x="705" y="311.5" class="text-bold fill-N1 s1"><tspan x="705" dy="0">존재 주장 ‘그런 왕이 있다’ 를</tspan><tspan x="705" dy="18.5">어디에 두는가</tspan></text></g><g ><g class="shape"><path d="M194 505h276v162H194z" class="stroke-B1 fill-B6 s0"/></g><text x="332" y="543.5" class="text-bold fill-N1 s1"><tspan x="332" dy="0">러셀 — 문장 안에 넣는다</tspan><tspan x="332" dy="16.714">존재 주장은 그 문장이</tspan><tspan x="332" dy="16.714">하는 주장의 일부다.</tspan><tspan x="332" dy="16.714">확정 기술은 이름이 아니라</tspan><tspan x="332" dy="16.714">한정사 뭉치다.</tspan><tspan x="332" dy="16.714">첫 조각이 거짓이므로 문장</tspan><tspan x="332" dy="16.714">전체가 거짓이다</tspan></text></g><g ><g class="shape"><path d="M917 497h324v178H917z" class="stroke-B1 fill-B6 s0"/></g><text x="1079" y="535.5" class="text-bold fill-N1 s1"><tspan x="1079" dy="0">스트로슨 — 문장 밖에 둔다</tspan><tspan x="1079" dy="16.625">존재는 주장되는 것이</tspan><tspan x="1079" dy="16.625">아니라 전제된다.</tspan><tspan x="1079" dy="16.625">지시는 표현이 하는 일이 아니라</tspan><tspan x="1079" dy="16.625">사람이 표현을 써서 하는 일이다.</tspan><tspan x="1079" dy="16.625">전제가 어긋났으므로 참거짓을</tspan><tspan x="1079" dy="16.625">묻는 것이</tspan><tspan x="1079" dy="16.625">부적절하다 — 진리값 공백</tspan></text></g><g ><g class="shape"><path d="M0 836h289v114H0z" class="stroke-B2 fill-B6 s2"/></g><text x="144.5" y="874.5" class="text-bold fill-N1 s1"><tspan x="144.5" dy="0">‘…대머리가 아니다’ 는 범위</tspan><tspan x="144.5" dy="17.25">애매성으로 갈린다.</tspan><tspan x="144.5" dy="17.25">넓은 읽기는 참이고 좁은</tspan><tspan x="144.5" dy="17.25">읽기는 거짓이다</tspan></text></g><g ><g class="shape"><path d="M749 844h289v98H749z" class="stroke-B2 fill-B6 s2"/></g><text x="893.5" y="882.5" class="text-bold fill-N1 s1"><tspan x="893.5" dy="0">‘…대머리가 아니다’ 도 같은</tspan><tspan x="893.5" dy="17.667">전제를 지고 있으므로</tspan><tspan x="893.5" dy="17.667">역시 값이 매겨지지 않는다</tspan></text></g><g ><g class="shape"><path d="M349 796h340v194H349z" class="stroke-B1 fill-B6 s0"/></g><text x="519" y="834.5" class="text-bold fill-N1 s1"><tspan x="519" dy="0">치르는 값 — 값이 둘뿐이라는</tspan><tspan x="519" dy="16.556">전제를 지킨다.</tspan><tspan x="519" dy="16.556">대신 우리가 저 문장을 듣고</tspan><tspan x="519" dy="16.556">‘거짓이다’ 라고</tspan><tspan x="519" dy="16.556">말하지 않고 판정을 물리는 까닭을</tspan><tspan x="519" dy="16.556">따로 설명해야 한다.</tspan><tspan x="519" dy="16.556">러셀 쪽 응답 — 그것은</tspan><tspan x="519" dy="16.556">문장의 뜻이 아니라</tspan><tspan x="519" dy="16.556">대화에 관한 사실이다</tspan></text></g><g ><g class="shape"><path d="M1098 804h334v178h-334z" class="stroke-B1 fill-B6 s0"/></g><text x="1265" y="842.5" class="text-bold fill-N1 s1"><tspan x="1265" dy="0">치르는 값 — 우리가 실제로 보이는</tspan><tspan x="1265" dy="16.625">반응을 그대로 설명한다.</tspan><tspan x="1265" dy="16.625">대신 값이 둘뿐이라는</tspan><tspan x="1265" dy="16.625">전제를 버려야 하고</tspan><tspan x="1265" dy="16.625">부정 · 논리곱 · 타당성의</tspan><tspan x="1265" dy="16.625">정의를 다시 짜야 한다.</tspan><tspan x="1265" dy="16.625">러셀 쪽 응답 — 얻는 것에</tspan><tspan x="1265" dy="16.625">비해 대가가 크다</tspan></text></g><text x="1265" y="1387" class="fill-N1 s1"><tspan x="1265" dy="0">낱말 주의 — 스트로슨의 ‘전제’(presupposition)는</tspan><tspan x="1265" dy="17.25">어떤 말을 하려면 미리 성립해 있어야 하는 것이다.</tspan><tspan x="1265" dy="17.25">4 장의 ‘논증의 전제’ 와 같은 한국어를 쓰지만</tspan><tspan x="1265" dy="17.25">겹치지 않는다</tspan></text><text x="519.5" y="1106" class="fill-N1 s1"><tspan x="519.5" dy="0">6 절로 미룬 물음 — 스트로슨이 전제라 부른 것이</tspan><tspan x="519.5" dy="16.455">사실은 함축일 수 있다.</tspan><tspan x="519.5" dy="16.455">‘현재 프랑스의 왕은 대머리가 아니다.</tspan><tspan x="519.5" dy="16.455">프랑스에 왕이 없으니까’ 는 어색하지만 모순은 아니다.</tspan><tspan x="519.5" dy="16.455">취소된다.</tspan><tspan x="519.5" dy="16.455">그렇다면 부정문의 존재 주장은 그 뜻에 들어 있는 것이 아니라</tspan><tspan x="519.5" dy="16.455">대화에서 딸려 나온 것이고, 러셀의 분석은 그대로 두고</tspan><tspan x="519.5" dy="16.455">우리의 반응만 화용론으로 설명하면 된다.</tspan><tspan x="519.5" dy="16.455">반대편의 답 — 언어학이 다루는 전제는</tspan><tspan x="519.5" dy="16.455">부정 · 물음 · 조건문</tspan><tspan x="519.5" dy="16.455">아래에서 살아남는다. 그 행동은 함축과 다르다</tspan></text><text x="1265.5" y="1162" class="fill-N1 s1"><tspan x="1265.5" dy="0">이 문서는 어느 쪽도 고르지 않는다.</tspan><tspan x="1265.5" dy="17.25">확정 기술의 분석에서는 러셀이 여전히 출발점이지만</tspan><tspan x="1265.5" dy="17.25">스트로슨의 진단도 살아 있고,</tspan><tspan x="1265.5" dy="17.25">전제라는 개념은 언어학에 자리를 잡았다</tspan></text><marker id="mk-d2-750149015-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-750149015-3488378134)" d="M704.99 154c-.19 38-.19 57.8-.01 93" class="connection stroke-B1 s0" mask="url(#d2-750149015)"/><path fill="none" marker-end="url(#mk-d2-750149015-3488378134)" d="M588.101 351.629C383.4 419.4 331.75 450.3 331.75 501.5" class="connection stroke-B1 s0" mask="url(#d2-750149015)"/><text x="431.5" y="409" class="text-italic fill-N2 s1">주장의 일부다</text><path fill="none" marker-end="url(#mk-d2-750149015-3488378134)" d="M820.9 351.624C1027.2 419.4 1079.25 448.7 1079.25 493.5" class="connection stroke-B1 s0" mask="url(#d2-750149015)"/><text x="974.5" y="408" class="text-italic fill-N2 s1">말을 시작하기 위한 조건이다</text><path fill="none" marker-end="url(#mk-d2-750149015-3488378134)" d="M228.94 667.752C161.7 721.7 144.5 755.7 144.5 832.5" class="connection stroke-B1 s0" mask="url(#d2-750149015)"/><text x="154.5" y="741" class="text-italic fill-N2 s1">부정을 읽으면</text><path fill="none" marker-end="url(#mk-d2-750149015-3488378134)" d="M966.948 675.762C908.5 723.3 893.5 757.3 893.5 840.5" class="connection stroke-B1 s0" mask="url(#d2-750149015)"/><text x="899.5" y="750" class="text-italic fill-N2 s1">부정을 읽으면</text><path fill="none" marker-end="url(#mk-d2-750149015-3488378134)" d="M434.56 667.752C501.8 721.7 519 747.7 519 792.5" class="connection stroke-B1 s0" mask="url(#d2-750149015)"/><path fill="none" marker-end="url(#mk-d2-750149015-3488378134)" d="M1191.552 675.762C1250 723.3 1265 749.3 1265 800.5" class="connection stroke-B1 s0" mask="url(#d2-750149015)"/><mask id="d2-750149015" width="1691" height="1642" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1691v1642H-101z"/><path d="M370 393h123v21H370zM852 392h245v21H852zM93 725h123v21H93zM838 734h123v21H838z"/></mask></svg>