<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1724" class="d2-1024263866 d2-svg" viewBox="-101 -101 880 1724"><rect width="880" height="1724" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1024263866 .text-bold{font-weight:700}.d2-1024263866 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1024263866 .fill-N1{fill:#0a0f25}.d2-1024263866 .fill-N2{fill:#676c7e}.d2-1024263866 .fill-B5{fill:#edf0fd}.d2-1024263866 .fill-B6{fill:#f7f8fe}.d2-1024263866 .stroke-B1,.d2-1024263866 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="329.5" cy="110" class="shape stroke-B1 fill-B6 s0" rx="329.5" ry="110"/></g><text x="329.5" y="67.5" class="text-bold fill-N1 s1"><tspan x="329.5" dy="0">옮겨 쓰기의 목표와 첫 시도</tspan><tspan x="329.5" dy="16.714">‘그는 목이 마르다’ 를</tspan><tspan x="329.5" dy="16.714">마음 상태를 가리키는 말이 하나도 없는 문장으로</tspan><tspan x="329.5" dy="16.714">남김없이 바꾸어 적는다.</tspan><tspan x="329.5" dy="16.714">첫 시도 — ‘물이 있으면 그가 마실 것이다’.</tspan><tspan x="329.5" dy="16.714">그런데 독이 들었다고 믿으면 마시지 않고,</tspan><tspan x="329.5" dy="16.714">예의를 지켜야 한다고 여기면 참는다</tspan></text></g><g ><g class="shape"><path d="M59 361h604v580H59z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="361" y="348" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">고리가 닫힌다</text></g><g ><g class="shape"><ellipse cx="324" cy="1151" class="shape stroke-B1 fill-B6 s0" rx="270" ry="90"/></g><text x="324" y="1124.5" class="text-bold fill-N1 s1"><tspan x="324" dy="0">그러므로 번역이 끝나지 않는다</tspan><tspan x="324" dy="17">어떤 마음 상태도 혼자서는</tspan><tspan x="324" dy="17">행동을 정하지 않는다.</tspan><tspan x="324" dy="17">마음 상태를 뺀 어휘만으로 옮겨 쓰려는</tspan><tspan x="324" dy="17">계획이 여기서 막힌다</tspan></text></g><text x="165" y="1357" class="fill-N1 s1"><tspan x="165" dy="0"> </tspan><tspan x="165" dy="16.455">기능주의가 이 고리를 어떻게 다루는가</tspan><tspan x="165" dy="16.455">행동주의는 마음 상태를</tspan><tspan x="165" dy="16.455">다른 마음 상태로 설명하면</tspan><tspan x="165" dy="16.455">순환이라 여겨 그것을 금지했고,</tspan><tspan x="165" dy="16.455">그 금지 때문에 번역이 끝나지 않았다.</tspan><tspan x="165" dy="16.455">기능주의는 금지를 푼다 —</tspan><tspan x="165" dy="16.455">마음 상태들을 하나씩 정의하지 않고</tspan><tspan x="165" dy="16.455">관계망 안에서 한꺼번에 정의한다.</tspan><tspan x="165" dy="16.455">그러면 이 고리는 결함이 아니라</tspan><tspan x="165" dy="16.455">정의의 방식이 된다</tspan></text><text x="533" y="1357" class="fill-N1 s1"><tspan x="533" dy="0"> </tspan><tspan x="533" dy="16.455">행동주의가 걸린 자리는</tspan><tspan x="533" dy="16.455">이 순환만이 아니다</tspan><tspan x="533" dy="16.455">둘째 — 슈퍼 스파르타인.</tspan><tspan x="533" dy="16.455">마음 상태는 있는데</tspan><tspan x="533" dy="16.455">행동 성향이 하나도 없는 경우가</tspan><tspan x="533" dy="16.455">생각될 수 있다.</tspan><tspan x="533" dy="16.455">셋째 — 안에서 아는 방식이</tspan><tspan x="533" dy="16.455">통째로 빠진다.</tspan><tspan x="533" dy="16.455">나는 내 행동을 미리 살펴보고 나서</tspan><tspan x="533" dy="16.455">아프다고 판단하지 않는다</tspan></text><g ><g class="shape"><path d="M256 391h148v82H256z" class="stroke-B1 fill-B5 s0"/></g><text x="330" y="429.5" class="text-bold fill-N1 s1"><tspan x="330" dy="0">욕구</tspan><tspan x="330" dy="18.5">목이 마르다</tspan></text></g><g ><g class="shape"><path d="M228 829h191v82H228z" class="stroke-B1 fill-B5 s0"/></g><text x="323.5" y="867.5" class="text-bold fill-N1 s1"><tspan x="323.5" dy="0">믿음</tspan><tspan x="323.5" dy="18.5">이 액체가 물이다</tspan></text></g><g ><g class="shape"><path d="M115 610h104v82H115z" class="stroke-B1 fill-B5 s0"/></g><text x="167" y="648.5" class="text-bold fill-N1 s1"><tspan x="167" dy="0">행동</tspan><tspan x="167" dy="18.5">마신다</tspan></text></g><marker id="mk-d2-1024263866-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1024263866-3488378134)" d="M266.843 473.62C186.9 527.7 166.5 555.3 166.5 606.5" class="connection stroke-B1 s0" mask="url(#d2-1024263866)"/><text x="190.5" y="523" class="text-italic fill-N2 s1"><tspan x="190.5" dy="0">이것만으로는</tspan><tspan x="190.5" dy="18.5">행동이 정해지지 않는다</tspan></text><path fill="none" marker-end="url(#mk-d2-1024263866-3488378134)" d="M166.5 693.5c0 53.2 19.4 80.8 93.74 133.681" class="connection stroke-B1 s0" mask="url(#d2-1024263866)"/><text x="188" y="774" class="text-italic fill-N2 s1"><tspan x="188" dy="0">조건을 채우려면</tspan><tspan x="188" dy="18.5">믿음을 끌어와야 한다</tspan></text><path fill="none" marker-end="url(#mk-d2-1024263866-3488378134)" d="M403.267 828.562C505.5 774.3 531.5 738.6 531.5 705.75S505.9 527.7 407.021 474.398" class="connection stroke-B1 s0" mask="url(#d2-1024263866)"/><text x="528" y="653" class="text-italic fill-N2 s1"><tspan x="528" dy="0">그 믿음을 옮기려면</tspan><tspan x="528" dy="18.5">또 다른 욕구가 필요하다</tspan></text><path fill="none" marker-end="url(#mk-d2-1024263866-3488378134)" d="M329.5 474.5v121.75c0 32.85-.8 178.05-3.769 229.257" class="connection stroke-B1 s0" mask="url(#d2-1024263866)"/><text x="329" y="649" class="text-italic fill-N2 s1"><tspan x="329" dy="0">그리고 그 역도</tspan><tspan x="329" dy="18.5">마찬가지다</tspan></text><path fill="none" marker-end="url(#mk-d2-1024263866-3488378134)" d="M329.983 222c-.383 46.4-.483 66.5-.483 94.5" class="connection stroke-B1 s0" mask="url(#d2-1024263866)"/><text x="330" y="276" class="text-italic fill-N2 s1">조건을 채우려고 하면</text><path fill="none" marker-end="url(#mk-d2-1024263866-3488378134)" d="M323.75 943c0 54 .05 78 .23 114" class="connection stroke-B1 s0" mask="url(#d2-1024263866)"/><marker id="mk-d2-1024263866-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1024263866-2177206569)" d="M227.495 1236.317C177.8 1279.8 165 1301 165 1337" class="connection stroke-B2 s3" mask="url(#d2-1024263866)"/><path fill="none" marker-end="url(#mk-d2-1024263866-2177206569)" d="M445.667 1233.105C515.2 1279.2 533 1301 533 1337" class="connection stroke-B2 s3" mask="url(#d2-1024263866)"/><mask id="d2-1024263866" width="880" height="1724" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h880v1724h-880z"/><path d="M89 507h203v37H89zM96 758h184v37H96zM425 637h206v37H425zM266 633h126v37H266zM238 260h184v21H238z"/></mask></svg>