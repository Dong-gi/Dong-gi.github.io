<svg xmlns="http://www.w3.org/2000/svg" width="2149" height="1882" class="d2-1071732957 d2-svg" viewBox="-101 -101 2149 1882"><rect width="2149" height="1882" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1071732957 .fill-N1{fill:#0a0f25}.d2-1071732957 .fill-N2{fill:#676c7e}.d2-1071732957 .fill-B5{fill:#edf0fd}.d2-1071732957 .fill-B6{fill:#f7f8fe}.d2-1071732957 .stroke-B1,.d2-1071732957 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="951" cy="207.5" class="shape stroke-B1 fill-B6 s0" rx="623" ry="207.5"/></g><text x="951" y="189" class="text-bold fill-N1 s1"><tspan x="951" dy="0">옮겨 쓰기의 목표와 첫 시도</tspan><tspan x="951" dy="17.25">‘그는 목이 마르다’ 를 마음 상태를 가리키는 말이 하나도 없는 문장으로 남김없이 바꾸어 적는다.</tspan><tspan x="951" dy="17.25">첫 시도 — ‘물이 있으면 그가 마실 것이다’.</tspan><tspan x="951" dy="17.25">그런데 독이 들었다고 믿으면 마시지 않고, 예의를 지켜야 한다고 여기면 참는다</tspan></text></g><g ><g class="shape"><path d="M584 556h914v548H584z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="1041" y="543" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">고리가 닫힌다</text></g><g ><g class="shape"><ellipse cx="951.5" cy="1359.5" class="shape stroke-B1 fill-B6 s0" rx="406.5" ry="135.5"/></g><text x="951.5" y="1349" class="text-bold fill-N1 s1"><tspan x="951.5" dy="0">그러므로 번역이 끝나지 않는다</tspan><tspan x="951.5" dy="17.667">어떤 마음 상태도 혼자서는 행동을 정하지 않는다.</tspan><tspan x="951.5" dy="17.667">마음 상태를 뺀 어휘만으로 옮겨 쓰려는 계획이 여기서 막힌다</tspan></text></g><text x="510" y="1611" class="fill-N1 s1"><tspan x="510" dy="0"> </tspan><tspan x="510" dy="17">기능주의가 이 고리를 어떻게 다루는가</tspan><tspan x="510" dy="17">행동주의는 마음 상태를 다른 마음 상태로 설명하면 순환이라 여겨 그것을 금지했고, 그 금지 때문에 번역이 끝나지 않았다.</tspan><tspan x="510" dy="17">기능주의는 금지를 푼다 — 마음 상태들을 하나씩 정의하지 않고 관계망 안에서 한꺼번에 정의한다.</tspan><tspan x="510" dy="17">그러면 이 고리는 결함이 아니라 정의의 방식이 된다</tspan></text><text x="1513.5" y="1619" class="fill-N1 s1"><tspan x="1513.5" dy="0"> </tspan><tspan x="1513.5" dy="17.25">행동주의가 걸린 자리는 이 순환만이 아니다</tspan><tspan x="1513.5" dy="17.25">둘째 — 슈퍼 스파르타인. 마음 상태는 있는데 행동 성향이 하나도 없는 경우가 생각될 수 있다.</tspan><tspan x="1513.5" dy="17.25">셋째 — 안에서 아는 방식이 통째로 빠진다. 나는 내 행동을 미리 살펴보고 나서 아프다고 판단하지 않는다</tspan></text><g ><g class="shape"><path d="M877 586h148v82H877z" class="stroke-B1 fill-B5 s0"/></g><text x="951" y="624.5" class="text-bold fill-N1 s1"><tspan x="951" dy="0">욕구</tspan><tspan x="951" dy="18.5">목이 마르다</tspan></text></g><g ><g class="shape"><path d="M856 992h191v82H856z" class="stroke-B1 fill-B5 s0"/></g><text x="951.5" y="1030.5" class="text-bold fill-N1 s1"><tspan x="951.5" dy="0">믿음</tspan><tspan x="951.5" dy="18.5">이 액체가 물이다</tspan></text></g><g ><g class="shape"><path d="M686 789h104v82H686z" class="stroke-B1 fill-B5 s0"/></g><text x="738" y="827.5" class="text-bold fill-N1 s1"><tspan x="738" dy="0">행동</tspan><tspan x="738" dy="18.5">마신다</tspan></text></g><marker id="mk-d2-1071732957-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1071732957-3488378134)" d="M875.443 663.358C766.05 715.3 738.25 740.7 738.25 785.5" class="connection stroke-B1 s0" mask="url(#d2-1071732957)"/><text x="783" y="713" class="text-italic fill-N2 s1">이것만으로는 행동이 정해지지 않는다</text><path fill="none" marker-end="url(#mk-d2-1071732957-3488378134)" d="M738.25 872.5c0 46.8 25.2 71.2 122.4 118.257" class="connection stroke-B1 s0" mask="url(#d2-1071732957)"/><text x="776.5" y="955" class="text-italic fill-N2 s1">조건을 채우려면 믿음을 끌어와야 한다</text><path fill="none" marker-end="url(#mk-d2-1071732957-3488378134)" d="M1049.164 1002.92c188.486-57.02 236.086-91.72 236.086-122.17s-52-168.053-256.173-230.099" class="connection stroke-B1 s0" mask="url(#d2-1071732957)"/><text x="1277" y="834" class="text-italic fill-N2 s1">그 믿음을 옮기려면 또 다른 욕구가 필요하다</text><path fill="none" marker-end="url(#mk-d2-1071732957-3488378134)" d="M951.25 669.5v319" class="connection stroke-B1 s0" mask="url(#d2-1071732957)"/><text x="951" y="836" class="text-italic fill-N2 s1">그리고 그 역도 마찬가지다</text><path fill="none" marker-end="url(#mk-d2-1071732957-3488378134)" d="M951.008 417c.192 46.4.242 66.5.242 94.5" class="connection stroke-B1 s0" mask="url(#d2-1071732957)"/><text x="951" y="471" class="text-italic fill-N2 s1">조건을 채우려고 하면</text><path fill="none" marker-end="url(#mk-d2-1071732957-3488378134)" d="M951.25 1106c0 54-.05 78-.23 114" class="connection stroke-B1 s0" mask="url(#d2-1071732957)"/><marker id="mk-d2-1071732957-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1071732957-2177206569)" d="M697.155 1466.771C547.8 1529.2 510 1555 510 1591" class="connection stroke-B2 s3" mask="url(#d2-1071732957)"/><path fill="none" marker-end="url(#mk-d2-1071732957-2177206569)" d="M1240.9 1455.623C1458.6 1527 1513.5 1556.6 1513.5 1599" class="connection stroke-B2 s3" mask="url(#d2-1071732957)"/><mask id="d2-1071732957" width="2149" height="1882" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2149v1882H-101z"/><path d="M622 697h322v21H622zM614 939h325v21H614zM1092 818h370v21h-370zM838 820h226v21H838zM859 455h184v21H859z"/></mask></svg>