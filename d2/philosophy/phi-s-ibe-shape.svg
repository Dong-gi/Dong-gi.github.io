<svg xmlns="http://www.w3.org/2000/svg" width="1305" height="980" class="d2-3470699718 d2-svg" viewBox="-101 -101 1305 980"><rect width="1305" height="980" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3470699718 .fill-N1{fill:#0a0f25}.d2-3470699718 .fill-B6{fill:#f7f8fe}.d2-3470699718 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M429 0h224v66H429z" class="stroke-B1 fill-B6 s0"/></g><text x="541" y="38.5" class="text-bold fill-N1 s1">설명이 필요한 사실 E</text></g><g ><g class="shape"><path d="M411 166h261v66H411z" class="stroke-B1 fill-B6 s0"/></g><text x="541.5" y="204.5" class="text-bold fill-N1 s1">후보 설명들 — H₁, H₂, H₃ …</text></g><g ><g class="shape"><path d="M323 332h436v98H323z" class="stroke-B1 fill-B6 s0"/></g><text x="541" y="370.5" class="text-bold fill-N1 s1"><tspan x="541" dy="0">무엇이 더 나은 설명인가</tspan><tspan x="541" dy="17.667">더 단순한가 / 이미 아는 것과 어울리는가 /</tspan><tspan x="541" dy="17.667">더 많은 것을 설명하는가 / 새 예측을 내놓는가</tspan></text></g><g ><g class="shape"><path d="M351 530h380v66H351z" class="stroke-B1 fill-B6 s0"/></g><text x="541" y="568.5" class="text-bold fill-N1 s1">가장 나은 설명이 참이라고 결론짓는다</text></g><g ><g class="shape"><path d="M0 696h501v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="250.5" y="734.5" class="text-bold fill-N1 s1"><tspan x="250.5" dy="0">약점 하나 — 후보 목록이 빠짐없는지 알 길이 없다.</tspan><tspan x="250.5" dy="18.5">‘최선의 설명’ 은 실은 ‘내가 떠올린 것 중 최선’ 이다</tspan></text></g><g ><g class="shape"><path d="M561 696h542v82H561z" class="stroke-B1 fill-B6 s0"/></g><text x="832" y="734.5" class="text-bold fill-N1 s1"><tspan x="832" dy="0">약점 둘 — 단순함이나 어울림이 참과 어떻게 이어지는지가</tspan><tspan x="832" dy="18.5">따로 논증되어야 한다. 그 논증이 아직 없다</tspan></text></g><marker id="mk-d2-3470699718-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" 