<svg xmlns="http://www.w3.org/2000/svg" width="1243" height="1438" class="d2-1441329029 d2-svg" viewBox="-101 -101 1243 1438"><rect width="1243" height="1438" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1441329029 .fill-N1{fill:#0a0f25}.d2-1441329029 .fill-B6{fill:#f7f8fe}.d2-1441329029 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="550.5" cy="106" class="shape stroke-B1 fill-B6 s0" rx="317.5" ry="106"/></g><text x="550.5" y="103.5" class="text-bold fill-N1 s1"><tspan x="550.5" dy="0">기초 믿음을 정당화하는 것은 경험이라고 하자.</tspan><tspan x="550.5" dy="18.5">그 경험은 어떤 것인가</tspan></text></g><g ><g class="shape"><path d="M46 312h460v66H46z" class="stroke-B1 fill-B6 s0"/></g><text x="276" y="350.5" class="text-bold fill-N1 s1">경험이 이미 ‘…이다’ 라는 내용을 가진 것이라면</text></g><g ><g class="shape"><path d="M625 312h403v66H625z" class="stroke-B1 fill-B6 s0"/></g><text x="826.5" y="350.5" class="text-bold fill-N1 s1">경험이 아무 내용 없는 날것의 겪음이라면</text></g><g ><g class="shape"><path d="M0 478h551v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="275.5" y="516.5" class="text-bold fill-N1 s1"><tspan x="275.5" dy="0">그 내용도 참일 수도 거짓일 수도 있다.</tspan><tspan x="275.5" dy="18.5">그러면 그것 역시 정당화가 필요하고 후퇴가 다시 시작된다</tspan></text></g><g ><g class="shape"><path d="M611 478h430v82H611z" class="stroke-B1 fill-B6 s0"/></g><text x="826" y="516.5" class="text-bold fill-N1 s1"><tspan x="826" dy="0">내용이 없으면 믿음의 근거가 될 수 없다.</tspan><tspan x="826" dy="18.5">무엇을 믿게 해 주는지 말할 수 없기 때문이다</tspan></text></g><g ><g class="shape"><ellipse cx="550.5" cy="792.5" class="shape stroke-B1 fill-B6 s0" rx="397.5" ry="132.5"/></g><text x="550.5" y="790" class="text-bold fill-N1 s1"><tspan x="550.5" dy="0">어느 쪽이든 ‘근거 없이 정당화되는 믿음’ 이 나오지 않는다.</tspan><tspan x="550.5" dy="18.5">셀라스는 이 자리를 ‘주어진 것의 신화’ 라 불렀다</tspan></text></g><text x="550.5" y="1062" class="fill-N1 s1"><tspan x="550.5" dy="0">온건한 토대론의 대응 — 기초 믿음이 확실할 필요는 없다.</tspan><tspan x="550.5" dy="17.667">경험이 얼마간의 근거를 주고 그 근거는 새 증거로 무너질 수 있다.</tspan><tspan x="550.5" dy="17.667">그러면 후퇴는 멈추되 기초가 무오류일 필요는 없어진다</tspan></text><text x="551" y="1215" class="fill-N1 s1"><tspan x="551" dy="0">그러면 다시 묻는다 — ‘얼마간의 근거를 준다’ 는 것 자체는</tspan><tspan x="551" dy="18.5">무엇으로 정당화되는가. 이 주고받음은 아직 끝나지 않았다</tspan></text><marker id="mk-d2-1441329029-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1441329029-3488378134)" d="M387.264 197.994C298.2 249 275.5 272 275.5 308" class="connection stroke-B1 s0" mask="url(#d2-1441329029)"/><path fill="none" marker-end="url(#mk-d2-1441329029-3488378134)" d="M713.737 197.99C803.2 249 826 272 826 308" class="connection stroke-B1 s0" mask="url(#d2-1441329029)"/><path fill="none" marker-end="url(#mk-d2-1441329029-3488378134)" d="M275.5 380v94" class="connection stroke-B1 s0" mask="url(#d2-1441329029)"/><path fill="none" marker-end="url(#mk-d2-1441329029-3488378134)" d="M826 380v94" class="connection stroke-B1 s0" mask="url(#d2-1441329029)"/><path fill="none" marker-end="url(#mk-d2-1441329029-3488378134)" d="M275.5 562c0 38 19.3 60.8 93.166 109.79" class="connection stroke-B1 s0" mask="url(#d2-1441329029)"/><path fill="none" marker-end="url(#mk-d2-1441329029-3488378134)" d="M826 562c0 38-19.2 60.8-92.672 109.781" class="connection stroke-B1 s0" mask="url(#d2-1441329029)"/><path fill="none" marker-end="url(#mk-d2-1441329029-3488378134)" d="M550.992 927c-.192 46.4-.242 70.7-.242 115.5" class="connection stroke-B1 s0" mask="url(#d2-1441329029)"/><text x="551" y="991" style="fill:#676c7e;text-anchor:middle;font-size:16px">그래도 남는 길</text><path fill="none" marker-end="url(#mk-d2-1441329029-3488378134)" d="M550.75 1101v94" class="connection stroke-B1 s0" mask="url(#d2-1441329029)"/><mask id="d2-1441329029" width="1243" height="1438" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1243v1438H-101z"/><path d="M488 975h126v21H488z"/></mask></svg>