<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="1651" class="d2-2972538502 d2-svg" viewBox="-141 -101 1096 1651"><rect width="1096" height="1651" x="-141" y="-101" rx="0" style="fill:#fff"/><style>.d2-2972538502 .text-bold{font-weight:700}.d2-2972538502 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2972538502 .fill-N1{fill:#0a0f25}.d2-2972538502 .fill-N2{fill:#676c7e}.d2-2972538502 .fill-B5{fill:#edf0fd}.d2-2972538502 .fill-B6{fill:#f7f8fe}.d2-2972538502 .stroke-B1,.d2-2972538502 .stroke-B2{stroke:#0d32b2}.s0{fill:#e3e9fd;stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><path d="M472 207H162v-3c0-35 34-67 88-82-30-13-48-33-48-55 0-37 52-67 115-67s114 30 114 67c0 22-17 42-47 55 54 15 88 47 88 82v3Z" class="stroke-B1 s0"/></g><text x="317" y="228" class="text-bold fill-N1 s1"><tspan x="317" dy="0">심문자</tspan><tspan x="317" dy="18.5">어느 쪽이 기계인지 가려내야 한다</tspan></text></g><g ><g class="shape"><path d="M131 348h532v170H131z" class="stroke-B1 s0"/></g><text x="397" y="477" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px"><tspan x="397" dy="0">가림막 — 글자만 지나간다</tspan><tspan x="397" dy="32">몸도 목소리도 얼굴도 지워져 있다</tspan></text></g><g ><g class="shape"><ellipse cx="328" cy="698" class="shape stroke-B1 fill-B6 s2" rx="240" ry="80"/></g><text x="328" y="679.5" class="text-bold fill-N1 s1"><tspan x="328" dy="0">판정</tspan><tspan x="328" dy="17.25">심문자가 어느 쪽이 기계인지 믿을</tspan><tspan x="328" dy="17.25">만하게 가려내지 못하면</tspan><tspan x="328" dy="17.25">그때 기계가 검사를 통과한 것이다</tspan></text></g><text x="185" y="1268" class="fill-N1 s1"><tspan x="185" dy="0">튜링이 실제로 한 일</tspan><tspan x="185" dy="16.417">그는 ‘기계가 생각할 수 있는가’ 에</tspan><tspan x="185" dy="16.417">답하지 않았다.</tspan><tspan x="185" dy="16.417">그 물음을 다른 물음으로</tspan><tspan x="185" dy="16.417">바꾸자고 제안했다.</tspan><tspan x="185" dy="16.417">원래 물음은 ‘생각한다’ 와 ‘기계’ 의</tspan><tspan x="185" dy="16.417">뜻을 어떻게 정하느냐에 따라</tspan><tspan x="185" dy="16.417">답이 달라지는,</tspan><tspan x="185" dy="16.417">결판낼 수 없는 물음이라고</tspan><tspan x="185" dy="16.417">보았기 때문이다.</tspan><tspan x="185" dy="16.417">바꾼 물음이 흉내 놀이다 —</tspan><tspan x="185" dy="16.417">글자만으로 가려낼 수 있는가</tspan></text><g ><g class="shape"><path d="M616 902h238v226H616z" class="stroke-B2 fill-B6 s3"/></g><text x="735" y="940.5" class="text-bold fill-N1 s1"><tspan x="735" dy="0">반론 ① 행동만 잰다</tspan><tspan x="735" dy="16.455">14장에서</tspan><tspan x="735" dy="16.455">논리적 행동주의가</tspan><tspan x="735" dy="16.455">걸린 자리가</tspan><tspan x="735" dy="16.455">그대로 온다.</tspan><tspan x="735" dy="16.455">완벽한 배우가</tspan><tspan x="735" dy="16.455">아픈 사람의</tspan><tspan x="735" dy="16.455">행동을 다 할 수 있다면</tspan><tspan x="735" dy="16.455">완벽한 흉내꾼도</tspan><tspan x="735" dy="16.455">생각하는 자의</tspan><tspan x="735" dy="16.455">대화를 다 할 수 있다</tspan></text></g><g ><g class="shape"><path d="M0 878h260v274H0z" class="stroke-B2 fill-B6 s3"/></g><text x="130" y="916.5" class="text-bold fill-N1 s1"><tspan x="130" dy="0">반론 ②</tspan><tspan x="130" dy="16.357">사람 흉내를 요구한다</tspan><tspan x="130" dy="16.357">통과하려면</tspan><tspan x="130" dy="16.357">사람처럼 굴어야 한다.</tspan><tspan x="130" dy="16.357">그래서 정말로</tspan><tspan x="130" dy="16.357">생각하지만</tspan><tspan x="130" dy="16.357">사람과 다르게</tspan><tspan x="130" dy="16.357">생각하는 기계는</tspan><tspan x="130" dy="16.357">떨어지고,</tspan><tspan x="130" dy="16.357">생각하지 않지만</tspan><tspan x="130" dy="16.357">사람 말투를 잘</tspan><tspan x="130" dy="16.357">흉내 내는 기계는 붙는다.</tspan><tspan x="130" dy="16.357">재는 것과 재려던 것이</tspan><tspan x="130" dy="16.357">어긋나 있다</tspan></text></g><g ><g class="shape"><path d="M320 918h232v194H320z" class="stroke-B2 fill-B6 s3"/></g><text x="436" y="956.5" class="text-bold fill-N1 s1"><tspan x="436" dy="0">반론 ③ 충분조건이지</tspan><tspan x="436" dy="16.556">필요조건이 아니다</tspan><tspan x="436" dy="16.556">튜링 자신이</tspan><tspan x="436" dy="16.556">검사 통과를 생각의</tspan><tspan x="436" dy="16.556">정의로 삼지 않았다.</tspan><tspan x="436" dy="16.556">통과하면 생각한다고</tspan><tspan x="436" dy="16.556">볼 좋은</tspan><tspan x="436" dy="16.556">이유가 생긴다는 것이</tspan><tspan x="436" dy="16.556">그가 말한 전부다</tspan></text></g><text x="735" y="1308" class="fill-N1 s1"><tspan x="735" dy="0">그래도 남는 힘</tspan><tspan x="735" dy="16.714">우리가 다른 사람에게</tspan><tspan x="735" dy="16.714">마음이 있다고 여기는</tspan><tspan x="735" dy="16.714">근거도 결국 행동과 말이다.</tspan><tspan x="735" dy="16.714">기계에게만 더 엄한 것을</tspan><tspan x="735" dy="16.714">요구한다면</tspan><tspan x="735" dy="16.714">그 이유를 대야 한다</tspan></text><g ><g class="shape"><path d="M161 378h154v66H161z" class="stroke-B1 fill-B5 s2"/></g><text x="238" y="416.5" class="text-bold fill-N1 s1">상대 A — 사람</text></g><g ><g class="shape"><path d="M478 378h155v66H478z" class="stroke-B1 fill-B5 s2"/></g><text x="555.5" y="416.5" class="text-bold fill-N1 s1">상대 B — 기계</text></g><marker id="mk-d2-2972538502-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-2972538502-3488378134)" d="M194.212 250.03C182.7 263.7 186.5 338 212.206 374.723" class="connection stroke-B1 s2" mask="url(#d2-2972538502)"/><text x="185.5" y="321" class="text-italic fill-N2 s1">글로만 묻는다</text><path fill="none" marker-end="url(#mk-d2-2972538502-3488378134)" d="M470.992 243.832C491.9 262.5 504.5 338 530.206 374.723" class="connection stroke-B1 s2" mask="url(#d2-2972538502)"/><text x="499.5" y="315" class="text-italic fill-N2 s1">글로만 묻는다</text><path fill="none" marker-end="url(#mk-d2-2972538502-3488378134)" d="M279.047 376.732C326.3 338 338.1 263.7 336.919 252.478" class="connection stroke-B1 s2" mask="url(#d2-2972538502)"/><text x="328.5" y="330" class="text-italic fill-N2 s1">글로만 답한다</text><path fill="none" marker-end="url(#mk-d2-2972538502-3488378134)" d="M597.047 376.732C644.3 338 618 248.8 467.598 175.748" class="connection stroke-B1 s2" mask="url(#d2-2972538502)"/><text x="611.5" y="251" class="text-italic fill-N2 s1">글로만 답한다</text><path fill="none" marker-end="url(#mk-d2-2972538502-3488378134)" d="M160.287 198.032C68.399 253.4 45 279.6 45 297.75V464.5c0 32.1 28.4 116.5 138.363 166.835" class="connection stroke-B1 s2" mask="url(#d2-2972538502)"/><marker id="mk-d2-2972538502-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-2972538502-2177206569)" d="M162.114 756.666C.799 813.6-40 865.4-40 921.5s15.201 290.5 72.658 328.302" class="connection stroke-B2 s3" mask="url(#d2-2972538502)"/><path fill="none" marker-end="url(#mk-d2-2972538502-3488378134)" d="M502.905 753.61C688.2 813 735 842.8 735 898" class="connection stroke-B1 s2" mask="url(#d2-2972538502)"/><path fill="none" marker-end="url(#mk-d2-2972538502-3488378134)" d="M217.333 770.105C147.8 816.2 130 838 130 874" class="connection stroke-B1 s2" mask="url(#d2-2972538502)"/><path fill="none" marker-end="url(#mk-d2-2972538502-3488378134)" d="M394.26 776.553C427.4 817.4 436 846 436 914" class="connection stroke-B1 s2" mask="url(#d2-2972538502)"/><path fill="none" marker-end="url(#mk-d2-2972538502-2177206569)" d="M735 1130v158" class="connection stroke-B2 s3" mask="url(#d2-2972538502)"/><mask id="d2-2972538502" width="1096" height="1651" x="-141" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-141-101H955v1651H-141z"/><path d="M124 305h123v21H124zM438 299h123v21H438zM267 314h123v21H267zM550 235h123v21H550z"/></mask></svg>