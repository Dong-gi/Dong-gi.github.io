<svg xmlns="http://www.w3.org/2000/svg" width="3443" height="1184" class="d2-2468726921 d2-svg" viewBox="-101 -71 3443 1184"><rect width="3443" height="1184" x="-101" y="-71" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2468726921 .fill-N1{fill:#0a0f25}.d2-2468726921 .fill-N2{fill:#676c7e}.d2-2468726921 .fill-B5{fill:#edf0fd}.d2-2468726921 .fill-B6{fill:#f7f8fe}.d2-2468726921 .stroke-B1,.d2-2468726921 .stroke-B2{stroke:#0d32b2}.s0{fill:#e3e9fd;stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><path d="M310 358H0v-3c0-35 34-67 88-82-30-13-48-33-48-55 0-37 52-67 115-67s114 30 114 67c0 22-17 42-47 55 54 15 88 47 88 82v3Z" class="stroke-B1 s0"/></g><text x="155" y="379" class="text-bold fill-N1 s1"><tspan x="155" dy="0">심문자</tspan><tspan x="155" dy="18.5">어느 쪽이 기계인지 가려내야 한다</tspan></text></g><g ><g class="shape"><path d="M950 98h215v252H950z" class="stroke-B1 s0"/></g><text x="1057.5" y="57" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px"><tspan x="1057.5" dy="0">가림막 — 글자만 지나간다</tspan><tspan x="1057.5" dy="32">몸도 목소리도 얼굴도 지워져 있다</tspan></text></g><g ><g class="shape"><ellipse cx="1057.5" cy="682" class="shape stroke-B1 fill-B6 s2" rx="389.5" ry="130"/></g><text x="1057.5" y="671.5" class="text-bold fill-N1 s1"><tspan x="1057.5" dy="0">판정</tspan><tspan x="1057.5" dy="17.667">심문자가 어느 쪽이 기계인지 믿을 만하게 가려내지 못하면</tspan><tspan x="1057.5" dy="17.667">그때 기계가 검사를 통과한 것이다</tspan></text></g><text x="2083" y="405" class="fill-N1 s1"><tspan x="2083" dy="0">튜링이 실제로 한 일</tspan><tspan x="2083" dy="17">그는 ‘기계가 생각할 수 있는가’ 에 답하지 않았다. 그 물음을 다른 물음으로 바꾸자고 제안했다.</tspan><tspan x="2083" dy="17">원래 물음은 ‘생각한다’ 와 ‘기계’ 의 뜻을 어떻게 정하느냐에 따라 답이 달라지는,</tspan><tspan x="2083" dy="17">결판낼 수 없는 물음이라고 보았기 때문이다.</tspan><tspan x="2083" dy="17">바꾼 물음이 흉내 놀이다 — 글자만으로 가려낼 수 있는가</tspan></text><g ><g class="shape"><path d="M1828 534h510v114h-510z" class="stroke-B2 fill-B6 s3"/></g><text x="2083" y="572.5" class="text-bold fill-N1 s1"><tspan x="2083" dy="0">반론 ① 행동만 잰다</tspan><tspan x="2083" dy="17.25">14장에서 논리적 행동주의가 걸린 자리가 그대로 온다.</tspan><tspan x="2083" dy="17.25">완벽한 배우가 아픈 사람의 행동을 다 할 수 있다면</tspan><tspan x="2083" dy="17.25">완벽한 흉내꾼도 생각하는 자의 대화를 다 할 수 있다</tspan></text></g><g ><g class="shape"><path d="M1797 708h573v130h-573z" class="stroke-B2 fill-B6 s3"/></g><text x="2083.5" y="746.5" class="text-bold fill-N1 s1"><tspan x="2083.5" dy="0">반론 ② 사람 흉내를 요구한다</tspan><tspan x="2083.5" dy="17">통과하려면 사람처럼 굴어야 한다. 그래서 정말로 생각하지만</tspan><tspan x="2083.5" dy="17">사람과 다르게 생각하는 기계는 떨어지고,</tspan><tspan x="2083.5" dy="17">생각하지 않지만 사람 말투를 잘 흉내 내는 기계는 붙는다.</tspan><tspan x="2083.5" dy="17">재는 것과 재려던 것이 어긋나 있다</tspan></text></g><g ><g class="shape"><path d="M1835 898h496v114h-496z" class="stroke-B2 fill-B6 s3"/></g><text x="2083" y="936.5" class="text-bold fill-N1 s1"><tspan x="2083" dy="0">반론 ③ 충분조건이지 필요조건이 아니다</tspan><tspan x="2083" dy="17.25">튜링 자신이 검사 통과를 생각의 정의로 삼지 않았다.</tspan><tspan x="2083" dy="17.25">통과하면 생각한다고 볼 좋은 이유가 생긴다는 것이</tspan><tspan x="2083" dy="17.25">그가 말한 전부다</tspan></text></g><text x="2940.5" y="580" class="fill-N1 s1"><tspan x="2940.5" dy="0">그래도 남는 힘</tspan><tspan x="2940.5" dy="17.667">우리가 다른 사람에게 마음이 있다고 여기는 근거도 결국 행동과 말이다.</tspan><tspan x="2940.5" dy="17.667">기계에게만 더 엄한 것을 요구한다면 그 이유를 대야 한다</tspan></text><g ><g class="shape"><path d="M980 128h154v66H980z" class="stroke-B1 fill-B5 s2"/></g><text x="1057" y="166.5" class="text-bold fill-N1 s1">상대 A — 사람</text></g><g ><g class="shape"><path d="M980 254h155v66H980z" class="stroke-B1 fill-B5 s2"/></g><text x="1057.5" y="292.5" class="text-bold fill-N1 s1">상대 B — 기계</text></g><marker id="mk-d2-2468726921-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-2468726921-3488378134)" d="M269.842 206.221C412.8 145.8 666.4 135.5 976.008 155.245" class="connection stroke-B1 s2" mask="url(#d2-2468726921)"/><text x="618.5" y="143" class="text-italic fill-N2 s1">글로만 묻는다</text><path fill="none" marker-end="url(#mk-d2-2468726921-3488378134)" d="M253 254.995c156.4-.395 413.3 4.93 722.51 26.357" class="connection stroke-B1 s2" mask="url(#d2-2468726921)"/><text x="615.5" y="264" class="text-italic fill-N2 s1">글로만 묻는다</text><path fill="none" marker-end="url(#mk-d2-2468726921-3488378134)" d="M978.005 166.637C666.4 188.1 412.6 201.2 270.913 231.172" class="connection stroke-B1 s2" mask="url(#d2-2468726921)"/><text x="622.5" y="196" class="text-italic fill-N2 s1">글로만 답한다</text><path fill="none" marker-end="url(#mk-d2-2468726921-3488378134)" d="M977.504 292.169C666.3 312.407 405 308 232.91 270.844" class="connection stroke-B1 s2" mask="url(#d2-2468726921)"/><text x="602.5" y="317" class="text-italic fill-N2 s1">글로만 답한다</text><path fill="none" marker-end="url(#mk-d2-2468726921-3488378134)" d="M200.223 359.583C399 616.8 604 681.6 664 681.975" class="connection stroke-B1 s2" mask="url(#d2-2468726921)"/><marker id="mk-d2-2468726921-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-2468726921-2177206569)" d="M1264.763 571.055C1473.4 459.2 1621.5 431 1681.5 431" class="connection stroke-B2 s3" mask="url(#d2-2468726921)"/><path fill="none" marker-end="url(#mk-d2-2468726921-3488378134)" d="M1395.964 615.62C1499.6 595.6 1650.1 590.5 1824.5 590.5" class="connection stroke-B1 s2" mask="url(#d2-2468726921)"/><path fill="none" marker-end="url(#mk-d2-2468726921-3488378134)" d="M1396.963 747.382C1499.8 767.4 1643.7 772.5 1792.5 772.5" class="connection stroke-B1 s2" mask="url(#d2-2468726921)"/><path fill="none" marker-end="url(#mk-d2-2468726921-3488378134)" d="M1252.73 796.003C1471 922.6 1651.5 954.5 1831.5 954.5" class="connection stroke-B1 s2" mask="url(#d2-2468726921)"/><path fill="none" marker-end="url(#mk-d2-2468726921-2177206569)" d="M2339.5 590.5h297" class="connection stroke-B2 s3" mask="url(#d2-2468726921)"/><mask id="d2-2468726921" width="3443" height="1184" x="-101" y="-71" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-71h3443v1184H-101z"/><path d="M557 127h123v21H557zM554 248h123v21H554zM561 180h123v21H561zM541 301h123v21H541z"/></mask></svg>