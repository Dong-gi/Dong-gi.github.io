<svg xmlns="http://www.w3.org/2000/svg" width="1555" height="1459" class="d2-1486969594 d2-svg" viewBox="-141 -101 1555 1459"><rect width="1555" height="1459" x="-141" y="-101" rx="0" style="fill:#fff"/><style>.d2-1486969594 .text-bold{font-weight:700}.d2-1486969594 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1486969594 .fill-N1{fill:#0a0f25}.d2-1486969594 .fill-N2{fill:#676c7e}.d2-1486969594 .fill-B5{fill:#edf0fd}.d2-1486969594 .fill-B6{fill:#f7f8fe}.d2-1486969594 .stroke-B1,.d2-1486969594 .stroke-B2{stroke:#0d32b2}.s0{fill:#e3e9fd;stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}.s4{fill:#0d32b2}</style><g ><g class="shape"><path d="M576 207H266v-3c0-35 34-67 88-82-30-13-48-33-48-55 0-37 52-67 115-67s114 30 114 67c0 22-17 42-47 55 54 15 88 47 88 82v3Z" class="stroke-B1 s0"/></g><text x="421" y="228" class="text-bold fill-N1 s1"><tspan x="421" dy="0">심문자</tspan><tspan x="421" dy="18.5">어느 쪽이 기계인지 가려내야 한다</tspan></text></g><g ><g class="shape"><path d="M235 348h532v170H235z" class="stroke-B1 s0"/></g><text x="501" y="477" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px"><tspan x="501" dy="0">가림막 — 글자만 지나간다</tspan><tspan x="501" dy="32">몸도 목소리도 얼굴도 지워져 있다</tspan></text></g><g ><g class="shape"><ellipse cx="432" cy="698" class="shape stroke-B1 fill-B6 s2" rx="240" ry="80"/></g><text x="432" y="679.5" class="text-bold fill-N1 s1"><tspan x="432" dy="0">판정</tspan><tspan x="432" dy="17.25">심문자가 어느 쪽이 기계인지 믿을</tspan><tspan x="432" dy="17.25">만하게 가려내지 못하면</tspan><tspan x="432" dy="17.25">그때 기계가 검사를 통과한 것이다</tspan></text></g><text x="252.5" y="1156" class="fill-N1 s1"><tspan x="252.5" dy="0">튜링이 실제로 한 일</tspan><tspan x="252.5" dy="16.714">그는 ‘기계가 생각할 수 있는가’ 에 답하지 않았다.</tspan><tspan x="252.5" dy="16.714">그 물음을 다른 물음으로 바꾸자고 제안했다.</tspan><tspan x="252.5" dy="16.714">원래 물음은 ‘생각한다’ 와 ‘기계’ 의 뜻을</tspan><tspan x="252.5" dy="16.714">어떻게 정하느냐에 따라 답이 달라지는,</tspan><tspan x="252.5" dy="16.714">결판낼 수 없는 물음이라고 보았기 때문이다.</tspan><tspan x="252.5" dy="16.714">바꾼 물음이 흉내 놀이다 — 글자만으로 가려낼 수 있는가</tspan></text><g ><g class="shape"><path d="M917 878h316v162H917z" class="stroke-B2 fill-B6 s3"/></g><text x="1075" y="916.5" class="text-bold fill-N1 s1"><tspan x="1075" dy="0">반론 ① 행동만 잰다</tspan><tspan x="1075" dy="16.714">14장에서 논리적 행동주의가</tspan><tspan x="1075" dy="16.714">걸린 자리가 그대로 온다.</tspan><tspan x="1075" dy="16.714">완벽한 배우가 아픈 사람의</tspan><tspan x="1075" dy="16.714">행동을 다 할 수 있다면</tspan><tspan x="1075" dy="16.714">완벽한 흉내꾼도 생각하는 자의</tspan><tspan x="1075" dy="16.714">대화를 다 할 수 있다</tspan></text></g><g ><g class="shape"><path d="M0 878h406v162H0z" class="stroke-B2 fill-B6 s3"/></g><text x="203" y="916.5" class="text-bold fill-N1 s1"><tspan x="203" dy="0">반론 ② 사람 흉내를 요구한다</tspan><tspan x="203" dy="16.714">통과하려면 사람처럼 굴어야 한다.</tspan><tspan x="203" dy="16.714">그래서 정말로 생각하지만</tspan><tspan x="203" dy="16.714">사람과 다르게 생각하는 기계는 떨어지고,</tspan><tspan x="203" dy="16.714">생각하지 않지만 사람 말투를 잘</tspan><tspan x="203" dy="16.714">흉내 내는 기계는 붙는다.</tspan><tspan x="203" dy="16.714">재는 것과 재려던 것이 어긋나 있다</tspan></text></g><g ><g class="shape"><path d="M466 886h391v146H466z" class="stroke-B2 fill-B6 s3"/></g><text x="661.5" y="924.5" class="text-bold fill-N1 s1"><tspan x="661.5" dy="0">반론 ③ 충분조건이지 필요조건이 아니다</tspan><tspan x="661.5" dy="16.833">튜링 자신이 검사 통과를 생각의</tspan><tspan x="661.5" dy="16.833">정의로 삼지 않았다.</tspan><tspan x="661.5" dy="16.833">통과하면 생각한다고 볼 좋은</tspan><tspan x="661.5" dy="16.833">이유가 생긴다는 것이</tspan><tspan x="661.5" dy="16.833">그가 말한 전부다</tspan></text></g><text x="1075" y="1180" class="fill-N1 s1"><tspan x="1075" dy="0">그래도 남는 힘</tspan><tspan x="1075" dy="17.25">우리가 다른 사람에게 마음이 있다고 여기는</tspan><tspan x="1075" dy="17.25">근거도 결국 행동과 말이다.</tspan><tspan x="1075" dy="17.25">기계에게만 더 엄한 것을 요구한다면 그 이유를 대야 한다</tspan></text><g ><g class="shape"><path d="M265 378h154v66H265z" class="stroke-B1 fill-B5 s2"/></g><text x="342" y="416.5" class="text-bold fill-N1 s1">상대 A — 사람</text></g><g ><g class="shape"><path d="M582 378h155v66H582z" class="stroke-B1 fill-B5 s2"/></g><text x="659.5" y="416.5" class="text-bold fill-N1 s1">상대 B — 기계</text></g><marker id="mk-d2-1486969594-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-1486969594-3488378134)" d="M278.875 249.952C265.85 263.7 271.85 338 307.48 375.114" class="connection stroke-B1 s2" mask="url(#d2-1486969594)"/><text x="270.5" y="324" class="text-italic fill-N2 s1">글로만 묻는다</text><path fill="none" marker-end="url(#mk-d2-1486969594-3488378134)" d="M563.625 249.952C576.65 263.7 589.85 338 625.48 375.114" class="connection stroke-B1 s2" mask="url(#d2-1486969594)"/><text x="586.5" y="323" class="text-italic fill-N2 s1">글로만 묻는다</text><path fill="none" marker-end="url(#mk-d2-1486969594-3488378134)" d="M374.635 376.557C411.65 338 421.25 263.7 421.25 252.5" class="connection stroke-B1 s2" mask="url(#d2-1486969594)"/><text x="413.5" y="326" class="text-italic fill-N2 s1">글로만 답한다</text><path fill="none" marker-end="url(#mk-d2-1486969594-3488378134)" d="M692.635 376.557C729.65 338 705.6 250.2 574.557 182.83" class="connection stroke-B1 s2" mask="url(#d2-1486969594)"/><text x="703.5" y="255" class="text-italic fill-N2 s1">글로만 답한다</text><path fill="none" marker-end="url(#mk-d2-1486969594-3488378134)" d="M264.287 198.032C172.399 253.4 149 279.6 149 297.75V464.5c0 32.1 28.4 116.5 138.363 166.835" class="connection stroke-B1 s2" mask="url(#d2-1486969594)"/><marker id="mk-d2-1486969594-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s4"/></marker><path fill="none" marker-end="url(#mk-d2-1486969594-2177206569)" d="M245.072 749.53C17.399 812.2-40 854.2-40 893.5s27 206.5 131.249 245.11" class="connection stroke-B2 s3" mask="url(#d2-1486969594)"/><path fill="none" marker-end="url(#mk-d2-1486969594-3488378134)" d="M638.96 739.398C987.6 810.2 1075.25 838 1075.25 874" class="connection stroke-B1 s2" mask="url(#d2-1486969594)"/><path fill="none" marker-end="url(#mk-d2-1486969594-3488378134)" d="M308.263 767.99C224.399 815.8 203 838 203 874" class="connection stroke-B1 s2" mask="url(#d2-1486969594)"/><path fill="none" marker-end="url(#mk-d2-1486969594-3488378134)" d="M555.74 767.987C640 815.8 661.5 839.6 661.5 882" class="connection stroke-B1 s2" mask="url(#d2-1486969594)"/><path fill="none" marker-end="url(#mk-d2-1486969594-2177206569)" d="M1075.25 1042v118" class="connection stroke-B2 s3" mask="url(#d2-1486969594)"/><mask id="d2-1486969594" width="1555" height="1459" x="-141" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-141-101h1555v1459H-141z"/><path d="M209 308h123v21H209zM525 307h123v21H525zM352 310h123v21H352zM642 239h123v21H642z"/></mask></svg>