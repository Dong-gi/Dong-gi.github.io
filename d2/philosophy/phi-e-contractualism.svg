<svg xmlns="http://www.w3.org/2000/svg" width="1289" height="1159" class="d2-37575520 d2-svg" viewBox="-101 -101 1289 1159"><rect width="1289" height="1159" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-37575520 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-37575520 .fill-N1{fill:#0a0f25}.d2-37575520 .fill-B6{fill:#f7f8fe}.d2-37575520 .stroke-B1,.d2-37575520 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M393 0h319v130H393z" class="stroke-B1 fill-B6 s0"/></g><text x="552.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="552.5" dy="0">스캔런의 시험</tspan><tspan x="552.5" dy="17">어떤 행위가 그른 것은,</tspan><tspan x="552.5" dy="17">그 행위를 허용하는 원칙을</tspan><tspan x="552.5" dy="17">누구도 합당하게 거부할 수 없는</tspan><tspan x="552.5" dy="17">원칙 집합이 금지할 때다</tspan></text></g><g ><g class="shape"><path d="M320 230h465v146H320z" class="stroke-B1 fill-B6 s0"/></g><text x="552.5" y="268.5" class="text-bold fill-N1 s1"><tspan x="552.5" dy="0">쓰는 법</tspan><tspan x="552.5" dy="16.833">① 문제의 행위를 허용하는 원칙을 적는다</tspan><tspan x="552.5" dy="16.833">② 그 원칙 아래에서 누가 어떤 부담을 지는지 본다</tspan><tspan x="552.5" dy="16.833">③ 그 사람이 그 원칙을</tspan><tspan x="552.5" dy="16.833"> 합당하게 거부할 수 있는지 묻는다</tspan><tspan x="552.5" dy="16.833">④ 거부할 수 있으면 그 행위는 그르다</tspan></text></g><g ><g class="shape"><path d="M355 476h395v146H355z" class="stroke-B1 fill-B6 s0"/></g><text x="552.5" y="514.5" class="text-bold fill-N1 s1"><tspan x="552.5" dy="0">결과주의와 갈리는 자리</tspan><tspan x="552.5" dy="16.833">불만을 개인 단위로 센다.</tspan><tspan x="552.5" dy="16.833">여러 사람의 작은 불만을 더해서</tspan><tspan x="552.5" dy="16.833">한 사람의 큰 불만을 이기게 만들 수 없다.</tspan><tspan x="552.5" dy="16.833">총합이 아니라</tspan><tspan x="552.5" dy="16.833">가장 무거운 개인의 불만끼리 견준다</tspan></text></g><g ><g class="shape"><path d="M0 730h340v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="170" y="768.5" class="text-bold fill-N1 s1"><tspan x="170" dy="0">무엇을 설명하려고 나왔나</tspan><tspan x="170" dy="16.833">도덕의 요구가 왜 나를</tspan><tspan x="170" dy="16.833">구속하는지를 설명한다.</tspan><tspan x="170" dy="16.833">남에게 정당화할 수 없는 방식으로</tspan><tspan x="170" dy="16.833">대하지 않는다는 것,</tspan><tspan x="170" dy="16.833">그 관계 자체가 이유가 된다</tspan></text></g><g ><g class="shape"><path d="M400 730h304v146H400z" class="stroke-B2 fill-B6 s2"/></g><text x="552" y="768.5" class="text-bold fill-N1 s1"><tspan x="552" dy="0">대가 ①</tspan><tspan x="552" dy="16.833">‘합당하게’ 라는 말이</tspan><tspan x="552" dy="16.833">이미 도덕적 판단을 담고 있다.</tspan><tspan x="552" dy="16.833">그러면 도덕을 도덕으로</tspan><tspan x="552" dy="16.833">설명한 셈이 된다는</tspan><tspan x="552" dy="16.833">순환 우려가 있다</tspan></text></g><g ><g class="shape"><path d="M764 722h323v162H764z" class="stroke-B2 fill-B6 s2"/></g><text x="925.5" y="760.5" class="text-bold fill-N1 s1"><tspan x="925.5" dy="0">대가 ②</tspan><tspan x="925.5" dy="16.714">합당한 거부를 할 수 없는 존재를</tspan><tspan x="925.5" dy="16.714">어떻게 다루는가.</tspan><tspan x="925.5" dy="16.714">동물과 아직 태어나지 않은</tspan><tspan x="925.5" dy="16.714">세대가 그렇다.</tspan><tspan x="925.5" dy="16.714">19장의 동물 절이</tspan><tspan x="925.5" dy="16.714">이 자리로 돌아온다</tspan></text></g><text x="543.5" y="920" class="fill-N1 s1"><tspan x="543.5" dy="0">여기서 다루는 것은 개인 행위의 옳고 그름이다.</tspan><tspan x="543.5" dy="17.667">사회계약으로 국가의 정당성을 세우는 논의, 원초적 입장과 무지의 베일,</tspan><tspan x="543.5" dy="17.667">분배 정의는 20장의 일이다. 이 절은 그 문 앞에서 멈춘다</tspan></text><marker id="mk-d2-37575520-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-37575520-3488378134)" d="M552 132v94" class="connection stroke-B1 s0" mask="url(#d2-37575520)"/><path fill="none" marker-end="url(#mk-d2-37575520-3488378134)" d="M552 378v94" class="connection stroke-B1 s0" mask="url(#d2-37575520)"/><path fill="none" marker-end="url(#mk-d2-37575520-3488378134)" d="M352.596 613.205C206.9 660.118 170 683.6 170 726" class="connection stroke-B1 s0" mask="url(#d2-37575520)"/><path fill="none" marker-end="url(#mk-d2-37575520-3488378134)" d="M552 624v102" class="connection stroke-B1 s0" mask="url(#d2-37575520)"/><path fill="none" marker-end="url(#mk-d2-37575520-3488378134)" d="M752.399 614.669C890.5 660.408 925.5 682 925.5 718" class="connection stroke-B1 s0" mask="url(#d2-37575520)"/><mask id="d2-37575520" width="1289" height="1159" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1289v1159H-101z"/></mask></svg>