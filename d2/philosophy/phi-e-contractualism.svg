<svg xmlns="http://www.w3.org/2000/svg" width="1975" height="958" class="d2-3597134093 d2-svg" viewBox="-101 -101 1975 958"><rect width="1975" height="958" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3597134093 .fill-N1{fill:#0a0f25}.d2-3597134093 .fill-B6{fill:#f7f8fe}.d2-3597134093 .stroke-B1,.d2-3597134093 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M576 0h534v98H576z" class="stroke-B1 fill-B6 s0"/></g><text x="843" y="38.5" class="text-bold fill-N1 s1"><tspan x="843" dy="0">스캔런의 시험</tspan><tspan x="843" dy="17.667">어떤 행위가 그른 것은, 그 행위를 허용하는 원칙을</tspan><tspan x="843" dy="17.667">누구도 합당하게 거부할 수 없는 원칙 집합이 금지할 때다</tspan></text></g><g ><g class="shape"><path d="M579 198h528v130H579z" class="stroke-B1 fill-B6 s0"/></g><text x="843" y="236.5" class="text-bold fill-N1 s1"><tspan x="843" dy="0">쓰는 법</tspan><tspan x="843" dy="17">① 문제의 행위를 허용하는 원칙을 적는다</tspan><tspan x="843" dy="17">② 그 원칙 아래에서 누가 어떤 부담을 지는지 본다</tspan><tspan x="843" dy="17">③ 그 사람이 그 원칙을 합당하게 거부할 수 있는지 묻는다</tspan><tspan x="843" dy="17">④ 거부할 수 있으면 그 행위는 그르다</tspan></text></g><g ><g class="shape"><path d="M574 428h539v114H574z" class="stroke-B1 fill-B6 s0"/></g><text x="843.5" y="466.5" class="text-bold fill-N1 s1"><tspan x="843.5" dy="0">결과주의와 갈리는 자리</tspan><tspan x="843.5" dy="17.25">불만을 개인 단위로 센다. 여러 사람의 작은 불만을 더해서</tspan><tspan x="843.5" dy="17.25">한 사람의 큰 불만을 이기게 만들 수 없다.</tspan><tspan x="843.5" dy="17.25">총합이 아니라 가장 무거운 개인의 불만끼리 견준다</tspan></text></g><g ><g class="shape"><path d="M0 642h517v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="258.5" y="680.5" class="text-bold fill-N1 s1"><tspan x="258.5" dy="0">무엇을 설명하려고 나왔나</tspan><tspan x="258.5" dy="17.25">도덕의 요구가 왜 나를 구속하는지를 설명한다.</tspan><tspan x="258.5" dy="17.25">남에게 정당화할 수 없는 방식으로 대하지 않는다는 것,</tspan><tspan x="258.5" dy="17.25">그 관계 자체가 이유가 된다</tspan></text></g><g ><g class="shape"><path d="M577 650h575v98H577z" class="stroke-B2 fill-B6 s2"/></g><text x="864.5" y="688.5" class="text-bold fill-N1 s1"><tspan x="864.5" dy="0">대가 ①</tspan><tspan x="864.5" dy="17.667">‘합당하게’ 라는 말이 이미 도덕적 판단을 담고 있다.</tspan><tspan x="864.5" dy="17.667">그러면 도덕을 도덕으로 설명한 셈이 된다는 순환 우려가 있다</tspan></text></g><g ><g class="shape"><path d="M1212 642h476v114h-476z" class="stroke-B2 fill-B6 s2"/></g><text x="1450" y="680.5" class="text-bold fill-N1 s1"><tspan x="1450" dy="0">대가 ②</tspan><tspan x="1450" dy="17.25">합당한 거부를 할 수 없는 존재를 어떻게 다루는가.</tspan><tspan x="1450" dy="17.25">동물과 아직 태어나지 않은 세대가 그렇다.</tspan><tspan x="1450" dy="17.25">19장의 동물 절이 이 자리로 돌아온다</tspan></text></g><text x="1471.5" y="39" class="fill-N1 s1"><tspan x="1471.5" dy="0">여기서 다루는 것은 개인 행위의 옳고 그름이다.</tspan><tspan x="1471.5" dy="17.667">사회계약으로 국가의 정당성을 세우는 논의, 원초적 입장과 무지의 베일,</tspan><tspan x="1471.5" dy="17.667">분배 정의는 20장의 일이다. 이 절은 그 문 앞에서 멈춘다</tspan></text><marker id="mk-d2-3597134093-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3597134093-3488378134)" d="M843 100v94" class="connection stroke-B1 s0" mask="url(#d2-3597134093)"/><path fill="none" marker-end="url(#mk-d2-3597134093-3488378134)" d="M843 330v94" class="connection stroke-B1 s0" mask="url(#d2-3597134093)"/><path fill="none" marker-end="url(#mk-d2-3597134093-3488378134)" d="M571.533 534.695C321.5 580.467 258.5 602 258.5 638" class="connection stroke-B1 s0" mask="url(#d2-3597134093)"/><path fill="none" marker-end="url(#mk-d2-3597134093-3488378134)" d="M854.892 543.961C862.5 582 864.5 603.6 864.5 646" class="connection stroke-B1 s0" mask="url(#d2-3597134093)"/><path fill="none" marker-end="url(#mk-d2-3597134093-3488378134)" d="M1115.47 532.854C1382.7 580.101 1450 602 1450 638" class="connection stroke-B1 s0" mask="url(#d2-3597134093)"/><mask id="d2-3597134093" width="1975" height="958" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1975v958H-101z"/></mask></svg>