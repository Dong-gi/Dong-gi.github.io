<svg xmlns="http://www.w3.org/2000/svg" width="1228" height="1873" class="d2-4013289411 d2-svg" viewBox="-101 -101 1228 1873"><rect width="1228" height="1873" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4013289411 .fill-N1{fill:#0a0f25}.d2-4013289411 .fill-N2{fill:#676c7e}.d2-4013289411 .fill-B6{fill:#f7f8fe}.d2-4013289411 .stroke-B1,.d2-4013289411 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="660.5" cy="122" class="shape stroke-B1 fill-B6 s0" rx="365.5" ry="122"/></g><text x="660.5" y="79.5" class="text-bold fill-N1 s1"><tspan x="660.5" dy="0">철학적 좀비란 무엇인가</tspan><tspan x="660.5" dy="16.714">나와 물리적으로 낱낱까지 똑같으면서</tspan><tspan x="660.5" dy="16.714">아무것도 겪지 않는 존재.</tspan><tspan x="660.5" dy="16.714">같은 뇌, 같은 신경 발화, 같은 행동, 같은 말.</tspan><tspan x="660.5" dy="16.714">아프면 ‘아프다’ 고 말하고 감각질에 대해 강의도 한다.</tspan><tspan x="660.5" dy="16.714">그런데 안쪽이 캄캄하다.</tspan><tspan x="660.5" dy="16.714">영화의 좀비가 아니다 — 겉으로는 아무 차이도 없다</tspan></text></g><g ><g class="shape"><path d="M524 344h273v98H524z" class="stroke-B1 fill-B6 s0"/></g><text x="660.5" y="382.5" class="text-bold fill-N1 s1"><tspan x="660.5" dy="0">걸음 1 (P1) — 생각할 수 있다</tspan><tspan x="660.5" dy="17.667">좀비 세계가 모순 없이</tspan><tspan x="660.5" dy="17.667">정합적으로 그려진다</tspan></text></g><g ><g class="shape"><path d="M310 621h319v114H310z" class="stroke-B1 fill-B6" style="stroke-width:4"/></g><text x="469.5" y="659.5" class="text-bold fill-N1 s1"><tspan x="469.5" dy="0">걸음 2 (P2) — 여기가 다투어진다</tspan><tspan x="469.5" dy="17.25">생각할 수 있는 것은</tspan><tspan x="469.5" dy="17.25">형이상학적으로 가능하다.</tspan><tspan x="469.5" dy="17.25">즉 그런 가능세계가 실제로 있다</tspan></text></g><g ><g class="shape"><path d="M33 953h380v114H33z" class="stroke-B1 fill-B6 s0"/></g><text x="223" y="991.5" class="text-bold fill-N1 s1"><tspan x="223" dy="0">걸음 3 (P3) — 다툴 것이 적다</tspan><tspan x="223" dy="17.25">물리적 사실이 우리 세계와 똑같은데</tspan><tspan x="223" dy="17.25">의식의 사실이 다른 세계가 있다면,</tspan><tspan x="223" dy="17.25">의식은 물리적인 것에 수반하지 않는다</tspan></text></g><g ><g class="shape"><ellipse cx="223" cy="1341.5" class="shape stroke-B1 fill-B6 s0" rx="221" ry="73.5"/></g><text x="223" y="1331" class="text-bold fill-N1 s1"><tspan x="223" dy="0">결론</tspan><tspan x="223" dy="17.667">14장이 적은 형태의 물리주의는</tspan><tspan x="223" dy="17.667">거짓이다</tspan></text></g><g ><g class="shape"><path d="M557 913h319v194H557z" class="stroke-B2 fill-B6 s2"/></g><text x="716.5" y="951.5" class="text-bold fill-N1 s1"><tspan x="716.5" dy="0">11장이 이 걸음을 막는 사례를</tspan><tspan x="716.5" dy="16.556">이미 다루었다</tspan><tspan x="716.5" dy="16.556">물이 H₂O 가 아닌 상황을</tspan><tspan x="716.5" dy="16.556">생각할 수 있다고 여겼던 사람은</tspan><tspan x="716.5" dy="16.556">실은 물처럼 보이는 다른 것이</tspan><tspan x="716.5" dy="16.556">있는 상황을 생각한 것이었다.</tspan><tspan x="716.5" dy="16.556">겉모습과 실체를 갈라 놓자</tspan><tspan x="716.5" dy="16.556">상상 가능성이 가능성으로</tspan><tspan x="716.5" dy="16.556">건너가지 못했다</tspan></text></g><g ><g class="shape"><path d="M504 1228h426v226H504z" class="stroke-B2 fill-B6 s2"/></g><text x="717" y="1266.5" class="text-bold fill-N1 s1"><tspan x="717" dy="0">차머스의 대응 —</tspan><tspan x="717" dy="16.455">의식에는 그 갈라 놓기가 되지 않는다</tspan><tspan x="717" dy="16.455">물의 경우 우리는 물을 겉모습으로</tspan><tspan x="717" dy="16.455">붙잡고 있었으므로 재서술의 여지가 있었다.</tspan><tspan x="717" dy="16.455">의식의 경우에는 겪어짐 자체가</tspan><tspan x="717" dy="16.455">우리가 붙잡는 것이므로</tspan><tspan x="717" dy="16.455">‘겪어지는 것처럼 보이지만</tspan><tspan x="717" dy="16.455">겪어지지 않는 것’ 이라는 재서술이 없다.</tspan><tspan x="717" dy="16.455">이 논지를 정밀하게 세우는 장치가</tspan><tspan x="717" dy="16.455">2차원 의미론인데</tspan><tspan x="717" dy="16.455">이 문서는 거기로 들어가지 않는다</tspan></text></g><text x="852" y="579" class="fill-N1 s1"><tspan x="852" dy="0">물리주의 쪽 반박 둘</tspan><tspan x="852" dy="16.357">① (P1) 을 겨눈다 —</tspan><tspan x="852" dy="16.357">좀비를 정합적으로 그렸다고 여기는 것</tspan><tspan x="852" dy="16.357">자체가 착각일 수 있다.</tspan><tspan x="852" dy="16.357">물리적 세부를 실제로는 하나도</tspan><tspan x="852" dy="16.357">채우지 않은 채</tspan><tspan x="852" dy="16.357">‘나와 물리적으로 똑같은데’ 라는</tspan><tspan x="852" dy="16.357">문구만 붙였을 뿐이다.</tspan><tspan x="852" dy="16.357">② (P2) 를 겨눈다 —</tspan><tspan x="852" dy="16.357">상상 가능성은 우리 개념의 성질이고</tspan><tspan x="852" dy="16.357">가능성은 세계의 성질이다.</tspan><tspan x="852" dy="16.357">크립키 이후 우리는 그 다리가</tspan><tspan x="852" dy="16.357">언제나 놓이지는 않는다는 것을</tspan><tspan x="852" dy="16.357">알고 있다</tspan></text><text x="222.5" y="1570" class="fill-N1 s1"><tspan x="222.5" dy="0">논증이 성공하면 되돌아오는 것</tspan><tspan x="222.5" dy="16.714">의식이 수반하지 않는데 인과적 폐쇄를 지키려면</tspan><tspan x="222.5" dy="16.714">의식은 물리적 결과를 낳지 못한다 — 부수현상론이다.</tspan><tspan x="222.5" dy="16.714">그러면 나의 좀비 쌍둥이도</tspan><tspan x="222.5" dy="16.714">지금 나와 똑같이 감각질에 대해 말하고 있다.</tspan><tspan x="222.5" dy="16.714">내가 감각질에 대해 말하는 원인이</tspan><tspan x="222.5" dy="16.714">감각질이 아니게 된다</tspan></text><marker id="mk-d2-4013289411-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4013289411-3488378134)" d="M660.99 246c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-4013289411)"/><path fill="none" marker-end="url(#mk-d2-4013289411-3488378134)" d="M573.767 442.498C490.7 490.3 469.5 526.1 469.5 615.5" class="connection stroke-B1 s0" mask="url(#d2-4013289411)"/><text x="480.5" y="512" class="text-italic fill-N2 s1">여기를 건넌다</text><path fill="none" marker-end="url(#mk-d2-4013289411-3488378134)" d="M385.598 737.231C255.61 829.1 222.5 872.7 222.5 949.5" class="connection stroke-B1 s0" mask="url(#d2-4013289411)"/><path fill="none" marker-end="url(#mk-d2-4013289411-3488378134)" d="M222.5 1068.5c0 78.8.1 119.1.48 195.5" class="connection stroke-B1 s0" mask="url(#d2-4013289411)"/><path fill="none" marker-end="url(#mk-d2-4013289411-3488378134)" d="M553.4 737.231C683.39 829.1 716.5 864.7 716.5 909.5" class="connection stroke-B1 s0" mask="url(#d2-4013289411)"/><text x="657" y="816" class="text-italic fill-N2 s1">물리주의 쪽</text><path fill="none" marker-end="url(#mk-d2-4013289411-3488378134)" d="M716.5 1108.5v116" class="connection stroke-B1 s0" mask="url(#d2-4013289411)"/><text x="717" y="1173" class="text-italic fill-N2 s1">되받음</text><marker id="mk-d2-4013289411-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-4013289411-2177206569)" d="M747.733 442.498C830.8 490.3 852 514.7 852 559.5" class="connection stroke-B2 s2" mask="url(#d2-4013289411)"/><path fill="none" marker-end="url(#mk-d2-4013289411-2177206569)" d="M222.989 1417c-.389 69.2-.489 97-.489 133" class="connection stroke-B2 s2" mask="url(#d2-4013289411)"/><mask id="d2-4013289411" width="1228" height="1873" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1228v1873H-101z"/><path d="M419 496h123v21H419zM605 800h104v21H605zM686 1157h62v21h-62z"/></mask></svg>