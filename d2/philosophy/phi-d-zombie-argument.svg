<svg xmlns="http://www.w3.org/2000/svg" width="2154" height="1661" class="d2-2585048334 d2-svg" viewBox="-101 -101 2154 1661"><rect width="2154" height="1661" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2585048334 .fill-N1{fill:#0a0f25}.d2-2585048334 .fill-N2{fill:#676c7e}.d2-2585048334 .fill-B6{fill:#f7f8fe}.d2-2585048334 .stroke-B1,.d2-2585048334 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}.s3{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="1157.5" cy="173" class="shape stroke-B1 fill-B6 s0" rx="519.5" ry="173"/></g><text x="1157.5" y="146.5" class="text-bold fill-N1 s1"><tspan x="1157.5" dy="0">철학적 좀비란 무엇인가</tspan><tspan x="1157.5" dy="17">나와 물리적으로 낱낱까지 똑같으면서 아무것도 겪지 않는 존재.</tspan><tspan x="1157.5" dy="17">같은 뇌, 같은 신경 발화, 같은 행동, 같은 말.</tspan><tspan x="1157.5" dy="17">아프면 ‘아프다’ 고 말하고 감각질에 대해 강의도 한다. 그런데 안쪽이 캄캄하다.</tspan><tspan x="1157.5" dy="17">영화의 좀비가 아니다 — 겉으로는 아무 차이도 없다</tspan></text></g><g ><g class="shape"><path d="M946 446h424v82H946z" class="stroke-B1 fill-B6 s0"/></g><text x="1158" y="484.5" class="text-bold fill-N1 s1"><tspan x="1158" dy="0">걸음 1 (P1) — 생각할 수 있다</tspan><tspan x="1158" dy="18.5">좀비 세계가 모순 없이 정합적으로 그려진다</tspan></text></g><g ><g class="shape"><path d="M573 649h449v98H573z" class="stroke-B1 fill-B6" style="stroke-width:4"/></g><text x="797.5" y="687.5" class="text-bold fill-N1 s1"><tspan x="797.5" dy="0">걸음 2 (P2) — 여기가 다투어진다</tspan><tspan x="797.5" dy="17.667">생각할 수 있는 것은 형이상학적으로 가능하다.</tspan><tspan x="797.5" dy="17.667">즉 그런 가능세계가 실제로 있다</tspan></text></g><g ><g class="shape"><path d="M96 876h665v98H96z" class="stroke-B1 fill-B6 s0"/></g><text x="428.5" y="914.5" class="text-bold fill-N1 s1"><tspan x="428.5" dy="0">걸음 3 (P3) — 다툴 것이 적다</tspan><tspan x="428.5" dy="17.667">물리적 사실이 우리 세계와 똑같은데 의식의 사실이 다른 세계가 있다면,</tspan><tspan x="428.5" dy="17.667">의식은 물리적인 것에 수반하지 않는다</tspan></text></g><g ><g class="shape"><ellipse cx="429" cy="1196.5" class="shape stroke-B1 fill-B6 s0" rx="281" ry="93.5"/></g><text x="429" y="1194" class="text-bold fill-N1 s1"><tspan x="429" dy="0">결론</tspan><tspan x="429" dy="18.5">14장이 적은 형태의 물리주의는 거짓이다</tspan></text></g><g ><g class="shape"><path d="M839 868h656v114H839z" class="stroke-B2 fill-B6 s2"/></g><text x="1167" y="906.5" class="text-bold fill-N1 s1"><tspan x="1167" dy="0">11장이 이 걸음을 막는 사례를 이미 다루었다</tspan><tspan x="1167" dy="17.25">물이 H₂O 가 아닌 상황을 생각할 수 있다고 여겼던 사람은</tspan><tspan x="1167" dy="17.25">실은 물처럼 보이는 다른 것이 있는 상황을 생각한 것이었다.</tspan><tspan x="1167" dy="17.25">겉모습과 실체를 갈라 놓자 상상 가능성이 가능성으로 건너가지 못했다</tspan></text></g><g ><g class="shape"><path d="M770 1132h795v130H770z" class="stroke-B2 fill-B6 s2"/></g><text x="1167.5" y="1170.5" class="text-bold fill-N1 s1"><tspan x="1167.5" dy="0">차머스의 대응 — 의식에는 그 갈라 놓기가 되지 않는다</tspan><tspan x="1167.5" dy="17">물의 경우 우리는 물을 겉모습으로 붙잡고 있었으므로 재서술의 여지가 있었다.</tspan><tspan x="1167.5" dy="17">의식의 경우에는 겪어짐 자체가 우리가 붙잡는 것이므로</tspan><tspan x="1167.5" dy="17">‘겪어지는 것처럼 보이지만 겪어지지 않는 것’ 이라는 재서술이 없다.</tspan><tspan x="1167.5" dy="17">이 논지를 정밀하게 세우는 장치가 2차원 의미론인데 이 문서는 거기로 들어가지 않는다</tspan></text></g><text x="1517" y="672" class="fill-N1 s1"><tspan x="1517" dy="0">물리주의 쪽 반박 둘</tspan><tspan x="1517" dy="17">① (P1) 을 겨눈다 — 좀비를 정합적으로 그렸다고 여기는 것 자체가 착각일 수 있다.</tspan><tspan x="1517" dy="17">물리적 세부를 실제로는 하나도 채우지 않은 채 ‘나와 물리적으로 똑같은데’ 라는 문구만 붙였을 뿐이다.</tspan><tspan x="1517" dy="17">② (P2) 를 겨눈다 — 상상 가능성은 우리 개념의 성질이고 가능성은 세계의 성질이다.</tspan><tspan x="1517" dy="17">크립키 이후 우리는 그 다리가 언제나 놓이지는 않는다는 것을 알고 있다</tspan></text><text x="428.5" y="1406" class="fill-N1 s1"><tspan x="428.5" dy="0">논증이 성공하면 되돌아오는 것</tspan><tspan x="428.5" dy="17.25">의식이 수반하지 않는데 인과적 폐쇄를 지키려면 의식은 물리적 결과를 낳지 못한다 — 부수현상론이다.</tspan><tspan x="428.5" dy="17.25">그러면 나의 좀비 쌍둥이도 지금 나와 똑같이 감각질에 대해 말하고 있다.</tspan><tspan x="428.5" dy="17.25">내가 감각질에 대해 말하는 원인이 감각질이 아니게 된다</tspan></text><marker id="mk-d2-2585048334-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2585048334-3488378134)" d="M1157.98 348c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-2585048334)"/><path fill="none" marker-end="url(#mk-d2-2585048334-3488378134)" d="M1009.827 528.048C840.55 576.3 797.75 600.7 797.75 644.5" class="connection stroke-B1 s0" mask="url(#d2-2585048334)"/><text x="878.5" y="571" class="text-italic fill-N2 s1">여기를 건넌다</text><path fill="none" marker-end="url(#mk-d2-2585048334-3488378134)" d="M629.626 747.36C469.299 795.3 428.5 821.3 428.5 872.5" class="connection stroke-B1 s0" mask="url(#d2-2585048334)"/><path fill="none" marker-end="url(#mk-d2-2585048334-3488378134)" d="M428.5 975.5c0 53.2.1 79.1.467 123.5" class="connection stroke-B1 s0" mask="url(#d2-2585048334)"/><path fill="none" marker-end="url(#mk-d2-2585048334-3488378134)" d="M965.874 747.36C1126.2 795.3 1167 819.7 1167 864.5" class="connection stroke-B1 s0" mask="url(#d2-2585048334)"/><text x="1091" y="790" class="text-italic fill-N2 s1">물리주의 쪽</text><path fill="none" marker-end="url(#mk-d2-2585048334-3488378134)" d="M1167 983.5v144" class="connection stroke-B1 s0" mask="url(#d2-2585048334)"/><text x="1167" y="1062" class="text-italic fill-N2 s1">되받음</text><marker id="mk-d2-2585048334-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s3"/></marker><path fill="none" marker-end="url(#mk-d2-2585048334-2177206569)" d="M1305.173 528.048C1474.45 576.3 1517.25 601.9 1517.25 651.5" class="connection stroke-B2 s2" mask="url(#d2-2585048334)"/><path fill="none" marker-end="url(#mk-d2-2585048334-2177206569)" d="M428.98 1292c-.38 38-.48 58-.48 94" class="connection stroke-B2 s2" mask="url(#d2-2585048334)"/><mask id="d2-2585048334" width="2154" height="1661" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2154v1661H-101z"/><path d="M817 555h123v21H817zM1039 774h104v21h-104zM1136 1046h62v21h-62z"/></mask></svg>