<svg xmlns="http://www.w3.org/2000/svg" width="1929" height="1315" class="d2-932938665 d2-svg" viewBox="-101 -101 1929 1315"><rect width="1929" height="1315" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-932938665 .fill-N1{fill:#0a0f25}.d2-932938665 .fill-N2{fill:#676c7e}.d2-932938665 .fill-B6{fill:#f7f8fe}.d2-932938665 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="1012" cy="77.5" class="shape stroke-B1 fill-B6 s0" rx="233" ry="77.5"/></g><text x="1012" y="83" class="text-bold fill-N1 s1">믿음 P 는 무엇으로 정당화되는가</text></g><g ><g class="shape"><path d="M877 255h270v66H877z" class="stroke-B1 fill-B6 s0"/></g><text x="1012" y="293.5" class="text-bold fill-N1 s1">다른 믿음 Q 로 정당화된다</text></g><g ><g class="shape"><ellipse cx="834.5" cy="524.5" class="shape stroke-B1 fill-B6 s0" rx="247.5" ry="82.5"/></g><text x="834.5" y="530" class="text-bold fill-N1 s1">그러면 Q 는 무엇으로 정당화되는가</text></g><g ><g class="shape"><path d="M98 707h188v66H98z" class="stroke-B1 fill-B6 s0"/></g><text x="192" y="745.5" class="text-bold fill-N1 s1">끝없이 이어진다</text></g><g ><g class="shape"><path d="M531 707h188v66H531z" class="stroke-B1 fill-B6 s0"/></g><text x="625" y="745.5" class="text-bold fill-N1 s1">어디선가 멈춘다</text></g><g ><g class="shape"><path d="M897 707h296v66H897z" class="stroke-B1 fill-B6 s0"/></g><text x="1045" y="745.5" class="text-bold fill-N1 s1">앞에 나온 믿음으로 돌아온다</text></g><g ><g class="shape"><path d="M1357 707h296v66h-296z" class="stroke-B1 fill-B6 s0"/></g><text x="1505" y="745.5" class="text-bold fill-N1 s1">정당화된 믿음이 애초에 없다</text></g><g ><g class="shape"><path d="M0 881h383v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="191.5" y="919.5" class="text-bold fill-N1 s1"><tspan x="191.5" dy="0">무한주의</tspan><tspan x="191.5" dy="18.5">무한한 사슬도 정당화할 수 있다고 본다</tspan></text></g><g ><g class="shape"><path d="M443 873h363v98H443z" class="stroke-B1 fill-B6 s0"/></g><text x="624.5" y="911.5" class="text-bold fill-N1 s1"><tspan x="624.5" dy="0">토대론</tspan><tspan x="624.5" dy="17.667">멈추는 자리의 믿음은 다른 믿음 없이</tspan><tspan x="624.5" dy="17.667">정당화된다고 본다</tspan></text></g><g ><g class="shape"><path d="M866 873h357v98H866z" class="stroke-B1 fill-B6 s0"/></g><text x="1044.5" y="911.5" class="text-bold fill-N1 s1"><tspan x="1044.5" dy="0">정합론</tspan><tspan x="1044.5" dy="17.667">정당화는 사슬이 아니라 그물이므로</tspan><tspan x="1044.5" dy="17.667">돌아오는 것이 흠이 아니라고 본다</tspan></text></g><g ><g class="shape"><path d="M1283 881h444v82h-444z" class="stroke-B1 fill-B6 s0"/></g><text x="1505" y="919.5" class="text-bold fill-N1 s1"><tspan x="1505" dy="0">회의주의</tspan><tspan x="1505" dy="18.5">그러니 우리는 아무것도 정당하게 믿지 못한다</tspan></text></g><text x="192" y="1108" class="fill-N1 s1">유한한 마음이 무한한 근거를 가질 수 있는가</text><text x="625" y="1108" class="fill-N1 s1">근거 없이 정당화되는 믿음이란 무엇인가</text><text x="1044.5" y="1108" class="fill-N1 s1">잘 짜인 이야기와 어떻게 가르는가</text><text x="1505" y="1108" class="fill-N1 s1">이 결론을 주장하는 것 자체가 정당화된 믿음 아닌가</text><text x="1400" y="514" class="fill-N1 s1"><tspan x="1400" dy="0">신빙론은 멈추는 자리를 믿음 밖에 둔다.</tspan><tspan x="1400" dy="17.667">‘정당화는 다른 믿음에서 온다’ 는 전제를 거부해서</tspan><tspan x="1400" dy="17.667">다른 믿음을 거치지 않는 과정이 만든 믿음에서 후퇴가 멈춘다</tspan></text><marker id="mk-d2-932938665-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-932938665-3488378134)" d="M1012.01 157c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-932938665)"/><path fill="none" marker-end="url(#mk-d2-932938665-3488378134)" d="M924.886 321.224C801.15 369.3 775.2 393.8 795.38 439.343" class="connection stroke-B1 s0" mask="url(#d2-932938665)"/><path fill="none" marker-end="url(#mk-d2-932938665-3488378134)" d=