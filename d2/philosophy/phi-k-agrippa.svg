<svg xmlns="http://www.w3.org/2000/svg" width="1373" height="1347" class="d2-2818957655 d2-svg" viewBox="-101 -101 1373 1347"><rect width="1373" height="1347" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2818957655 .fill-N1{fill:#0a0f25}.d2-2818957655 .fill-N2{fill:#676c7e}.d2-2818957655 .fill-B6{fill:#f7f8fe}.d2-2818957655 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="678" cy="77.5" class="shape stroke-B1 fill-B6 s0" rx="233" ry="77.5"/></g><text x="678" y="83" class="text-bold fill-N1 s1">믿음 P 는 무엇으로 정당화되는가</text></g><g ><g class="shape"><path d="M543 255h270v66H543z" class="stroke-B1 fill-B6 s0"/></g><text x="678" y="293.5" class="text-bold fill-N1 s1">다른 믿음 Q 로 정당화된다</text></g><g ><g class="shape"><ellipse cx="582" cy="500.5" class="shape stroke-B1 fill-B6 s0" rx="176" ry="58.5"/></g><text x="582" y="498" class="text-bold fill-N1 s1"><tspan x="582" dy="0">그러면 Q 는</tspan><tspan x="582" dy="18.5">무엇으로 정당화되는가</tspan></text></g><g ><g class="shape"><path d="M34 667h188v66H34z" class="stroke-B1 fill-B6 s0"/></g><text x="128" y="705.5" class="text-bold fill-N1 s1">끝없이 이어진다</text></g><g ><g class="shape"><path d="M337 667h188v66H337z" class="stroke-B1 fill-B6 s0"/></g><text x="431" y="705.5" class="text-bold fill-N1 s1">어디선가 멈춘다</text></g><g ><g class="shape"><path d="M627 659h212v82H627z" class="stroke-B1 fill-B6 s0"/></g><text x="733" y="697.5" class="text-bold fill-N1 s1"><tspan x="733" dy="0">앞에 나온 믿음으로</tspan><tspan x="733" dy="18.5">돌아온다</tspan></text></g><g ><g class="shape"><path d="M951 659h188v82H951z" class="stroke-B1 fill-B6 s0"/></g><text x="1045" y="697.5" class="text-bold fill-N1 s1"><tspan x="1045" dy="0">정당화된 믿음이</tspan><tspan x="1045" dy="18.5">애초에 없다</tspan></text></g><g ><g class="shape"><path d="M0 857h255v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="127.5" y="895.5" class="text-bold fill-N1 s1"><tspan x="127.5" dy="0">무한주의</tspan><tspan x="127.5" dy="17.667">무한한 사슬도</tspan><tspan x="127.5" dy="17.667">정당화할 수 있다고 본다</tspan></text></g><g ><g class="shape"><path d="M315 849h232v114H315z" class="stroke-B1 fill-B6 s0"/></g><text x="431" y="887.5" class="text-bold fill-N1 s1"><tspan x="431" dy="0">토대론</tspan><tspan x="431" dy="17.25">멈추는 자리의 믿음은</tspan><tspan x="431" dy="17.25">다른 믿음 없이</tspan><tspan x="431" dy="17.25">정당화된다고 본다</tspan></text></g><g ><g class="shape"><path d="M607 841h252v130H607z" class="stroke-B1 fill-B6 s0"/></g><text x="733" y="879.5" class="text-bold fill-N1 s1"><tspan x="733" dy="0">정합론</tspan><tspan x="733" dy="17">정당화는 사슬이 아니라</tspan><tspan x="733" dy="17">그물이므로</tspan><tspan x="733" dy="17">돌아오는 것이</tspan><tspan x="733" dy="17">흠이 아니라고 본다</tspan></text></g><g ><g class="shape"><path d="M919 857h252v98H919z" class="stroke-B1 fill-B6 s0"/></g><text x="1045" y="895.5" class="text-bold fill-N1 s1"><tspan x="1045" dy="0">회의주의</tspan><tspan x="1045" dy="17.667">그러니 우리는 아무것도</tspan><tspan x="1045" dy="17.667">정당하게 믿지 못한다</tspan></text></g><text x="127.5" y="1108" class="fill-N1 s1"><tspan x="127.5" dy="0">유한한 마음이</tspan><tspan x="127.5" dy="17.667">무한한 근거를</tspan><tspan x="127.5" dy="17.667">가질 수 있는가</tspan></text><text x="431.5" y="1108" class="fill-N1 s1"><tspan x="431.5" dy="0">근거 없이</tspan><tspan x="431.5" dy="17.667">정당화되는 믿음이란</tspan><tspan x="431.5" dy="17.667">무엇인가</tspan></text><text x="733.5" y="1116" class="fill-N1 s1"><tspan x="733.5" dy="0">잘 짜인 이야기와</tspan><tspan x="733.5" dy="18.5">어떻게 가르는가</tspan></text><text x="1045.5" y="1108" class="fill-N1 s1"><tspan x="1045.5" dy="0">이 결론을 주장하는 것</tspan><tspan x="1045.5" dy="17.667">자체가 정당화된</tspan><tspan x="1045.5" dy="17.667">믿음 아닌가</tspan></text><text x="984.5" y="474" class="fill-N1 s1"><tspan x="984.5" dy="0">신빙론은 멈추는 자리를 믿음 밖에 둔다.</tspan><tspan x="984.5" dy="17">‘정당화는 다른 믿음에서 온다’ 는</tspan><tspan x="984.5" dy="17">전제를 거부해서</tspan><tspan x="984.5" dy="17">다른 믿음을 거치지 않는 과정이 만든</tspan><tspan x="984.5" dy="17">믿음에서 후퇴가 멈춘다</tspan></text><marker id="mk-d2-2818957655-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2818957655-3488378134)" d="M678.01 157c.19 38 .24 58 .24 94" class="connection stroke-B1 s0" mask="url(#d2-2818957655)"/><path fill="none" marker-end="url(#mk-d2-2818957655-3488378134)" d="M619.525 321.512C538.05 369.3 523.799 393.8 548.12 439.469" class="connection stroke-B1 s0" mask="url(#d2-2818957655)"/><path fill="none" marker-end="url(#mk-d2-2818957655-3488378134)" d="M629.253 442.441C668.2 394 678.25 369.3 678.25 324.5" class="connection stroke-B1 s0" mask="url(#d2-2818957655)"/><text x="670.5" y="394" class="text-italic fill-N2 s1">같은 물음이 되돌아온다</text><path fill="none" marker-end="url(#mk-d2-2818957655-3488378134)" d="M438.054 535.46C190 594.2 127.5 620.6 127.5 663" class="connection stroke-B1 s0" mask="url(#d2-2818957655)"/><path fill="none" marker-end="url(#mk-d2-2818957655-3488378134)" d="M506.373 555.162C446.4 598 431 620.6 431 663" class="connection stroke-B1 s0" mask="url(#d2-2818957655)"/><path fill="none" marker-end="url(#mk-d2-2818957655-3488378134)" d="M657.627 555.162C717.6 598 733 619 733 655" class="connection stroke-B1 s0" mask="url(#d2-2818957655)"/><path fill="none" marker-end="url(#mk-d2-2818957655-3488378134)" d="M726.947 534.456C981 594 1045 619 1045 655" class="connection stroke-B1 s0" mask="url(#d2-2818957655)"/><path fill="none" marker-end="url(#mk-d2-2818957655-3488378134)" d="M127.5 735v118" class="connection stroke-B1 s0" mask="url(#d2-2818957655)"/><path fill="none" marker-end="url(#mk-d2-2818957655-3488378134)" d="M431 735v110" class="connection stroke-B1 s0" mask="url(#d2-2818957655)"/><path fill="none" marker-end="url(#mk-d2-2818957655-348837