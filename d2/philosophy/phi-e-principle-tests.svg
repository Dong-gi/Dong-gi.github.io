<svg xmlns="http://www.w3.org/2000/svg" width="1417" height="1047" class="d2-818538322 d2-svg" viewBox="-89 -89 1417 1047"><rect width="1417" height="1047" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-818538322 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-818538322 .fill-N1{fill:#0a0f25}.d2-818538322 .fill-B6{fill:#f7f8fe}.d2-818538322 .stroke-B1,.d2-818538322 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="675" cy="96" class="shape stroke-B1 fill-B6 s0" rx="252" ry="84"/></g><text x="675" y="85.5" class="text-bold fill-N1 s1"><tspan x="675" dy="0">자료 — 갈림길은 대체로 허용된다고,</tspan><tspan x="675" dy="17.667">육교는 대체로 안 된다고 판단한다.</tspan><tspan x="675" dy="17.667">죽는 사람과 사는 사람의 수는 같다</tspan></text></g><g ><g class="shape"><path d="M52 318h252v114H52z" class="stroke-B1 fill-B6 s0"/></g><text x="178" y="356.5" class="text-bold fill-N1 s1"><tspan x="178" dy="0">후보 A — 이중효과</tspan><tspan x="178" dy="17.25">갈림길에서 그의 죽음은</tspan><tspan x="178" dy="17.25">예견될 뿐이고</tspan><tspan x="178" dy="17.25">육교에서는 의도된다</tspan></text></g><g ><g class="shape"><path d="M365 310h296v130H365z" class="stroke-B1 fill-B6 s0"/></g><text x="513" y="348.5" class="text-bold fill-N1 s1"><tspan x="513" dy="0">후보 B — 수단으로 씀</tspan><tspan x="513" dy="17">육교에서는 그의 몸이 있어야</tspan><tspan x="513" dy="17">계획이 성립한다.</tspan><tspan x="513" dy="17">갈림길에서는 그가 없어도</tspan><tspan x="513" dy="17">계획이 성립한다</tspan></text></g><g ><g class="shape"><path d="M689 310h296v130H689z" class="stroke-B1 fill-B6 s0"/></g><text x="837" y="348.5" class="text-bold fill-N1 s1"><tspan x="837" dy="0">후보 C —</tspan><tspan x="837" dy="17">위협의 방향 전환</tspan><tspan x="837" dy="17">갈림길에서는 이미 있는</tspan><tspan x="837" dy="17">위협을 돌릴 뿐이고</tspan><tspan x="837" dy="17">육교에서는 새 위협을 만든다</tspan></text></g><g ><g class="shape"><path d="M1005 310h222v114h-222z" class="stroke-B2 fill-B6 s2"/></g><text x="1116" y="348.5" class="text-bold fill-N1 s1"><tspan x="1116" dy="0">후보 D — 함과 그냥 둠</tspan><tspan x="1116" dy="17.25">곧바로 탈락한다.</tspan><tspan x="1116" dy="17.25">갈림길에서도</tspan><tspan x="1116" dy="17.25">나는 무언가를 한다</tspan></text></g><g ><g class="shape"><path d="M12 510h333v210H12z" class="stroke-B2 fill-B6 s2"/></g><text x="178.5" y="548.5" class="text-bold fill-N1 s1"><tspan x="178.5" dy="0">고리 궤도 —</tspan><tspan x="178.5" dy="16.5">옆 선로가 돌아서</tspan><tspan x="178.5" dy="16.5">본선으로 이어지고,</tspan><tspan x="178.5" dy="16.5">그 한 사람의 몸이 전차를 멈춘다.</tspan><tspan x="178.5" dy="16.5">죽음이 수단이 된다.</tspan><tspan x="178.5" dy="16.5">이중효과는 금지라고 예측하는데</tspan><tspan x="178.5" dy="16.5">판단은 대체로 허용 쪽이다.</tspan><tspan x="178.5" dy="16.5">근접성 문제도 여기서 온다 —</tspan><tspan x="178.5" dy="16.5">의도한 것을 다시 적으면</tspan><tspan x="178.5" dy="16.5">답이 바뀐다</tspan></text></g><g ><g class="shape"><path d="M365 510h296v146H365z" class="stroke-B2 fill-B6 s2"/></g><text x="513" y="548.5" class="text-bold fill-N1 s1"><tspan x="513" dy="0">같은 고리 궤도가</tspan><tspan x="513" dy="16.833">여기도 걸린다.</tspan><tspan x="513" dy="16.833">반대쪽 반례도 있다 —</tspan><tspan x="513" dy="16.833">그를 수단으로 쓰지 않는데도</tspan><tspan x="513" dy="16.833">안 된다고 판단하는 경우를</tspan><tspan x="513" dy="16.833">만들 수 있다</tspan></text></g><g ><g class="shape"><path d="M681 510h313v210H681z" class="stroke-B2 fill-B6 s2"/></g><text x="837.5" y="548.5" class="text-bold fill-N1 s1"><tspan x="837.5" dy="0">방향 전환이라는 사실만으로는</tspan><tspan x="837.5" dy="16.5">허용이 나오지 않는다.</tspan><tspan x="837.5" dy="16.5">양쪽 사람 수가 같으면</tspan><tspan x="837.5" dy="16.5">돌려도 된다고 하지 않는다.</tspan><tspan x="837.5" dy="16.5">그리고 왜 방향 전환이</tspan><tspan x="837.5" dy="16.5">도덕적으로 중요한지가</tspan><tspan x="837.5" dy="16.5">설명되지 않는다.</tspan><tspan x="837.5" dy="16.5">톰슨은 나중에 갈림길에서도</tspan><tspan x="837.5" dy="16.5">돌리면 안 된다는 쪽으로</tspan><tspan x="837.5" dy="16.5">생각을 바꾸었다</tspan></text></g><text x="619.5" y="756" class="fill-N1 s1"><tspan x="619.5" dy="0">여기서 3장의 반성적 평형이 실제로 돈다.</tspan><tspan x="619.5" dy="16.714">판단에서 원리를 뽑고, 새 변형으로 원리를 시험하고, 어긋나면 원리를 고치거나</tspan><tspan x="619.5" dy="16.714">판단을 의심한다. 어느 쪽도 고정점이 아니다</tspan><tspan x="619.5" dy="16.714"> </tspan><tspan x="619.5" dy="16.714">결과주의는 세 사례를 모두 같게 본다. 그래서 판단의 차이를 원리로 설명하는 대신</tspan><tspan x="619.5" dy="16.714">편향으로 설명한다 — 손으로 미는 장면이 정서적 반응을 불러 판단을 굽힌다는 것이다.</tspan><tspan x="619.5" dy="16.714">반론은 이렇다. 그 설명이 맞다 해도, 그것만으로 그 판단이 틀렸다는 결론은 나오지 않는다</tspan></text><marker id="mk-d2-818538322-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-818538322-3488378134)" d="m524.002 165 .038 45s.009 10-9.991 10H188.5s-10 0-10 10v84" class="connection stroke-B1 s0" mask="url(#d2-818538322)"/><path fill="none" marker-end="url(#mk-d2-818538322-3488378134)" d="m624.998 180-.143 126" class="connection stroke-B1 s0" mask="url(#d2-818538322)"/><path fill="none" marker-end="url(#mk-d2-818538322-3488378134)" d="m725.995 180-.334 126" class="connection stroke-B1 s0" mask="url(#d2-818538322)"/><path fill="none" marker-end="url(#mk-d2-818538322-3488378134)" d="m826.016 165 .355 45s.079 10 10.079 10h270.05s10 0 10 10v76" class="connection stroke-B1 s0" mask="url(#d2-818538322)"/><path fill="none" marker-end="url(#mk-d2-818538322-3488378134)" d="M178.5 434v72" class="connection stroke-B1 s0" mask="url(#d2-818538322)"/><path fill="none" marker-end="url(#mk-d2-818538322-3488378134)" d="M513 442v64" class="connection stroke-B1 s0" mask="url(#d2-818538322)"/><path fill="none" marker-end="url(#mk-d2-818538322-3488378134)" d="M837.5 442v64" class="connection stroke-B1 s0" mask="url(#d2-818538322)"/><mask id="d2-818538322" width="1417" height="1047" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1417V958H-89z"/></mask></svg>