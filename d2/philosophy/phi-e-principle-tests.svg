<svg xmlns="http://www.w3.org/2000/svg" width="2481" height="890" class="d2-3150838019 d2-svg" viewBox="-101 -101 2481 890"><rect width="2481" height="890" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3150838019 .fill-N1{fill:#0a0f25}.d2-3150838019 .fill-B6{fill:#f7f8fe}.d2-3150838019 .stroke-B1,.d2-3150838019 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="467" cy="306.5" class="shape stroke-B1 fill-B6 s0" rx="467" ry="155.5"/></g><text x="467" y="304" class="text-bold fill-N1 s1"><tspan x="467" dy="0">자료 — 갈림길은 대체로 허용된다고, 육교는 대체로 안 된다고 판단한다.</tspan><tspan x="467" dy="18.5">죽는 사람과 사는 사람의 수는 같다</tspan></text></g><g ><g class="shape"><path d="M1089 8h380v98h-380z" class="stroke-B1 fill-B6 s0"/></g><text x="1279" y="46.5" class="text-bold fill-N1 s1"><tspan x="1279" dy="0">후보 A — 이중효과</tspan><tspan x="1279" dy="17.667">갈림길에서 그의 죽음은 예견될 뿐이고</tspan><tspan x="1279" dy="17.667">육교에서는 의도된다</tspan></text></g><g ><g class="shape"><path d="M1054 174h449v98h-449z" class="stroke-B1 fill-B6 s0"/></g><text x="1278.5" y="212.5" class="text-bold fill-N1 s1"><tspan x="1278.5" dy="0">후보 B — 수단으로 씀</tspan><tspan x="1278.5" dy="17.667">육교에서는 그의 몸이 있어야 계획이 성립한다.</tspan><tspan x="1278.5" dy="17.667">갈림길에서는 그가 없어도 계획이 성립한다</tspan></text></g><g ><g class="shape"><path d="M1067 340h424v98h-424z" class="stroke-B1 fill-B6 s0"/></g><text x="1279" y="378.5" class="text-bold fill-N1 s1"><tspan x="1279" dy="0">후보 C — 위협의 방향 전환</tspan><tspan x="1279" dy="17.667">갈림길에서는 이미 있는 위협을 돌릴 뿐이고</tspan><tspan x="1279" dy="17.667">육교에서는 새 위협을 만든다</tspan></text></g><g ><g class="shape"><path d="M1034 498h489v82h-489z" class="stroke-B2 fill-B6 s2"/></g><text x="1278.5" y="536.5" class="text-bold fill-N1 s1"><tspan x="1278.5" dy="0">후보 D — 함과 그냥 둠</tspan><tspan x="1278.5" dy="18.5">곧바로 탈락한다. 갈림길에서도 나는 무언가를 한다</tspan></text></g><g ><g class="shape"><path d="M1655 0h592v114h-592z" class="stroke-B2 fill-B6 s2"/></g><text x="1951" y="38.5" class="text-bold fill-N1 s1"><tspan x="1951" dy="0">고리 궤도 — 옆 선로가 돌아서 본선으로 이어지고,</tspan><tspan x="1951" dy="17.25">그 한 사람의 몸이 전차를 멈춘다. 죽음이 수단이 된다.</tspan><tspan x="1951" dy="17.25">이중효과는 금지라고 예측하는데 판단은 대체로 허용 쪽이다.</tspan><tspan x="1951" dy="17.25">폐쇄 문제도 여기서 온다 — 의도한 것을 다시 적으면 답이 바뀐다</tspan></text></g><g ><g class="shape"><path d="M1710 174h482v98h-482z" class="stroke-B2 fill-B6 s2"/></g><text x="1951" y="212.5" class="text-bold fill-N1 s1"><tspan x="1951" dy="0">같은 고리 궤도가 여기도 걸린다.</tspan><tspan x="1951" dy="17.667">반대쪽 반례도 있다 — 그를 수단으로 쓰지 않는데도</tspan><tspan x="1951" dy="17.667">안 된다고 판단하는 경우를 만들 수 있다</tspan></text></g><g ><g class="shape"><path d="M1623 332h656v114h-656z" class="stroke-B2 fill-B6 s2"/></g><text x="1951" y="370.5" class="text-bold fill-N1 s1"><tspan x="1951" dy="0">방향 전환이라는 사실만으로는 허용이 나오지 않는다.</tspan><tspan x="1951" dy="17.25">양쪽 사람 수가 같으면 돌려도 된다고 하지 않는다.</tspan><tspan x="1951" dy="17.25">그리고 왜 방향 전환이 도덕적으로 중요한지가 설명되지 않는다.</tspan><tspan x="1951" dy="17.25">톰슨은 나중에 갈림길에서도 돌리면 안 된다는 쪽으로 생각을 바꾸었다</tspan></text></g><text x="467" y="538" class="fill-N1 s1"><tspan x="467" dy="0">여기서 3장의 반성적 평형이 실제로 돈다.</tspan><tspan x="467" dy="17.667">판단에서 원리를 뽑고, 새 변형으로 원리를 시험하고, 어긋나면 원리를 고치거나</tspan><tspan x="467" dy="17.667">판단을 의심한다. 어느 쪽도 고정점이 아니다</tspan></text><text x="467.5" y="651" class="fill-N1 s1"><tspan x="467.5" dy="0">결과주의는 세 사례를 모두 같게 본다. 그래서 판단의 차이를 원리로 설명하는 대신</tspan><tspan x="467.5" dy="17.667">편향으로 설명한다 — 손으로 미는 장면이 정서적 반응을 불러 판단을 굽힌다는 것이다.</tspan><tspan x="467.5" dy="17.667">반론은 이렇다. 그 설명이 맞다 해도, 그것만으로 그 판단이 틀렸다는 결론은 나오지 않는다</tspan></text><marker id="mk-d2-3150838019-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3150838019-3488378134)" d="M733.803 177.134C933.6 81.2 1004.9 57 1084.5 57" class="connection stroke-B1 s0" mask="url(#d2-3150838019)"/><path fill="none" marker-end="url(#mk-d2-3150838019-3488378134)" d="M888.973 238.675C964.6 226.2 998 223 1050 223" class="connection stroke-B1 s0" mask="url(#d2-3150838019)"/><path fill="none" marker-end="url(#mk-d2-3150838019-3488378134)" d="M889.976 374.309C964.8 386 1000.5 389 1062.5 389" class="connection stroke-B1 s0" mask="url(#d2-3150838019)"/><path fill="none" marker-end="url(#mk-d2-3150838019-3488378134)" d="M745.827 432.814C936 517.6 994 539 1030 539" class="connection stroke-B1 s0" mask="url(#d2-3150838019)"/><path fill="none" marker-end="url(#mk-d2-3150838019-3488378134)" d="M1471.5 57H1651" class="connection stroke-B1 s0" mask="url(#d2-3150838019)"/><path fill="none" marker-end="url(#mk-d2-3150838019-3488378134)" d="M1505 223h201" class="connection stroke-B1 s0" mask="url(#d2-3150838019)"/><path fill="none" marker-end="url(#mk-d2-3150838019-3488378134)" d="M1493.5 389H1619" class="connection stroke-B1 s0" mask="url(#d2-3150838019)"/><mask id="d2-3150838019" width="2481" height="890" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2481v890H-101z"/></mask></svg>