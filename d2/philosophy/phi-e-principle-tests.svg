<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1326" class="d2-4109494834 d2-svg" viewBox="-89 -89 1120 1326"><rect width="1120" height="1326" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-4109494834 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4109494834 .fill-N1{fill:#0a0f25}.d2-4109494834 .fill-B6{fill:#f7f8fe}.d2-4109494834 .stroke-B1,.d2-4109494834 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="488.5" cy="99.5" class="shape stroke-B1 fill-B6 s0" rx="177.5" ry="87.5"/></g><text x="488.5" y="65" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">자료 — 갈림길은</tspan><tspan x="488.5" dy="16.833">대체로 허용된다고,</tspan><tspan x="488.5" dy="16.833">육교는 대체로</tspan><tspan x="488.5" dy="16.833">안 된다고 판단한다.</tspan><tspan x="488.5" dy="16.833">죽는 사람과 사는 사람의</tspan><tspan x="488.5" dy="16.833">수는 같다</tspan></text></g><g ><g class="shape"><path d="M29 333h195v146H29z" class="stroke-B1 fill-B6 s0"/></g><text x="126.5" y="371.5" class="text-bold fill-N1 s1"><tspan x="126.5" dy="0">후보 A — 이중효과</tspan><tspan x="126.5" dy="16.833">갈림길에서</tspan><tspan x="126.5" dy="16.833">그의 죽음은</tspan><tspan x="126.5" dy="16.833">예견될 뿐이고</tspan><tspan x="126.5" dy="16.833">육교에서는</tspan><tspan x="126.5" dy="16.833">의도된다</tspan></text></g><g ><g class="shape"><path d="M270 317h193v178H270z" class="stroke-B1 fill-B6 s0"/></g><text x="366.5" y="355.5" class="text-bold fill-N1 s1"><tspan x="366.5" dy="0">후보 B —</tspan><tspan x="366.5" dy="16.625">수단으로 씀</tspan><tspan x="366.5" dy="16.625">육교에서는</tspan><tspan x="366.5" dy="16.625">그의 몸이 있어야</tspan><tspan x="366.5" dy="16.625">계획이 성립한다.</tspan><tspan x="366.5" dy="16.625">갈림길에서는</tspan><tspan x="366.5" dy="16.625">그가 없어도</tspan><tspan x="366.5" dy="16.625">계획이 성립한다</tspan></text></g><g ><g class="shape"><path d="M505 325h212v162H505z" class="stroke-B1 fill-B6 s0"/></g><text x="611" y="363.5" class="text-bold fill-N1 s1"><tspan x="611" dy="0">후보 C —</tspan><tspan x="611" dy="16.714">위협의 방향 전환</tspan><tspan x="611" dy="16.714">갈림길에서는</tspan><tspan x="611" dy="16.714">이미 있는</tspan><tspan x="611" dy="16.714">위협을 돌릴 뿐이고</tspan><tspan x="611" dy="16.714">육교에서는</tspan><tspan x="611" dy="16.714">새 위협을 만든다</tspan></text></g><g ><g class="shape"><path d="M737 317h193v146H737z" class="stroke-B2 fill-B6 s2"/></g><text x="833.5" y="355.5" class="text-bold fill-N1 s1"><tspan x="833.5" dy="0">후보 D —</tspan><tspan x="833.5" dy="16.833">함과 그냥 둠</tspan><tspan x="833.5" dy="16.833">곧바로 탈락한다.</tspan><tspan x="833.5" dy="16.833">갈림길에서도</tspan><tspan x="833.5" dy="16.833">나는 무언가를</tspan><tspan x="833.5" dy="16.833">한다</tspan></text></g><g ><g class="shape"><path d="M12 565h229v290H12z" class="stroke-B2 fill-B6 s2"/></g><text x="126.5" y="603.5" class="text-bold fill-N1 s1"><tspan x="126.5" dy="0">고리 궤도 —</tspan><tspan x="126.5" dy="16.333">옆 선로가 돌아서</tspan><tspan x="126.5" dy="16.333">본선으로 이어지고,</tspan><tspan x="126.5" dy="16.333">그 한 사람의 몸이</tspan><tspan x="126.5" dy="16.333">전차를 멈춘다.</tspan><tspan x="126.5" dy="16.333">죽음이 수단이 된다.</tspan><tspan x="126.5" dy="16.333">이중효과는</tspan><tspan x="126.5" dy="16.333">금지라고 예측하는데</tspan><tspan x="126.5" dy="16.333">판단은 대체로</tspan><tspan x="126.5" dy="16.333">허용 쪽이다.</tspan><tspan x="126.5" dy="16.333">근접성 문제도</tspan><tspan x="126.5" dy="16.333">여기서 온다 —</tspan><tspan x="126.5" dy="16.333">의도한 것을</tspan><tspan x="126.5" dy="16.333">다시 적으면</tspan><tspan x="126.5" dy="16.333">답이 바뀐다</tspan></text></g><g ><g class="shape"><path d="M261 565h212v194H261z" class="stroke-B2 fill-B6 s2"/></g><text x="367" y="603.5" class="text-bold fill-N1 s1"><tspan x="367" dy="0">같은 고리 궤도가</tspan><tspan x="367" dy="16.556">여기도 걸린다.</tspan><tspan x="367" dy="16.556">반대쪽 반례도</tspan><tspan x="367" dy="16.556">있다 —</tspan><tspan x="367" dy="16.556">그를 수단으로</tspan><tspan x="367" dy="16.556">쓰지 않는데도</tspan><tspan x="367" dy="16.556">안 된다고 판단하는</tspan><tspan x="367" dy="16.556">경우를</tspan><tspan x="367" dy="16.556">만들 수 있다</tspan></text></g><g ><g class="shape"><path d="M493 565h237v322H493z" class="stroke-B2 fill-B6 s2"/></g><text x="611.5" y="603.5" class="text-bold fill-N1 s1"><tspan x="611.5" dy="0">방향 전환이라는</tspan><tspan x="611.5" dy="16.294">사실만으로는</tspan><tspan x="611.5" dy="16.294">허용이 나오지 않는다.</tspan><tspan x="611.5" dy="16.294">양쪽 사람 수가</tspan><tspan x="611.5" dy="16.294">같으면</tspan><tspan x="611.5" dy="16.294">돌려도 된다고</tspan><tspan x="611.5" dy="16.294">하지 않는다.</tspan><tspan x="611.5" dy="16.294">그리고 왜</tspan><tspan x="611.5" dy="16.294">방향 전환이</tspan><tspan x="611.5" dy="16.294">도덕적으로</tspan><tspan x="611.5" dy="16.294">중요한지가</tspan><tspan x="611.5" dy="16.294">설명되지 않는다.</tspan><tspan x="611.5" dy="16.294">톰슨은 나중에</tspan><tspan x="611.5" dy="16.294">갈림길에서도</tspan><tspan x="611.5" dy="16.294">돌리면 안 된다는</tspan><tspan x="611.5" dy="16.294">쪽으로</tspan><tspan x="611.5" dy="16.294">생각을 바꾸었다</tspan></text></g><text x="470.5" y="923" class="fill-N1 s1"><tspan x="470.5" dy="0">여기서 3장의 반성적 평형이 실제로 돈다.</tspan><tspan x="470.5" dy="16.357">판단에서 원리를 뽑고,</tspan><tspan x="470.5" dy="16.357">새 변형으로 원리를 시험하고,</tspan><tspan x="470.5" dy="16.357">어긋나면 원리를 고치거나</tspan><tspan x="470.5" dy="16.357">판단을 의심한다. 어느 쪽도 고정점이 아니다</tspan><tspan x="470.5" dy="16.357"> </tspan><tspan x="470.5" dy="16.357">결과주의는 세 사례를 모두 같게 본다.</tspan><tspan x="470.5" dy="16.357">그래서 판단의 차이를 원리로 설명하는 대신</tspan><tspan x="470.5" dy="16.357">편향으로 설명한다 —</tspan><tspan x="470.5" dy="16.357">손으로 미는 장면이 정서적 반응을 불러</tspan><tspan x="470.5" dy="16.357">판단을 굽힌다는 것이다.</tspan><tspan x="470.5" dy="16.357">반론은 이렇다. 그 설명이 맞다 해도,</tspan><tspan x="470.5" dy="16.357">그것만으로 그 판단이 틀렸다는</tspan><tspan x="470.5" dy="16.357">결론은 나오지 않는다</tspan></text><marker id="mk-d2-4109494834-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4109494834-3488378134)" d="m382.991 172-.197 45s-.044 10-10.044 10H136.5s-10 0-10 10v92" class="connection stroke-B1 s0" mask="url(#d2-4109494834)"/><path fill="none" marker-end="url(#mk-d2-4109494834-3488378134)" d="m453.995 187-.218 80s-.027 10-10.027 10H377s-10 0-10 10v26" class="connection stroke-B1 s0" mask="url(#d2-4109494834)"/><path fill="none" marker-end="url(#mk-d2-4109494834-3488378134)" d="m524.996 187-.239 134" class="connection stroke-B1 s0" mask="url(#d2-4109494834)"/><path fill="none" marker-end="url(#mk-d2-4109494834-3488378134)" d="m595.991 172-.197 45s-.044 10 9.956 10H824s10 0 10 10v76" class="connection stroke-B1 s0" mask="url(#d2-4109494834)"/><path fill="none" marker-end="url(#mk-d2-4109494834-3488378134)" d="M126.5 481v80" class="connection stroke-B1 s0" mask="url(#d2-4109494834)"/><path fill="none" marker-end="url(#mk-d2-4109494834-3488378134)" d="M367 497v64" class="connection stroke-B1 s0" mask="url(#d2-4109494834)"/><path fill="none" marker-end="url(#mk-d2-4109494834-3488378134)" d="M611.5 489v72" class="connection stroke-B1 s0" mask="url(#d2-4109494834)"/><mask id="d2-4109494834" width="1120" height="1326" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1120v1326H-89z"/></mask></svg>