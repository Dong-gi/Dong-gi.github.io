<svg xmlns="http://www.w3.org/2000/svg" width="1386" height="2541" class="d2-787010809 d2-svg" viewBox="-101 -101 1386 2541"><rect width="1386" height="2541" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-787010809 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-787010809 .fill-N1{fill:#0a0f25}.d2-787010809 .fill-B6{fill:#f7f8fe}.d2-787010809 .stroke-B1,.d2-787010809 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="331.5" cy="89.5" class="shape stroke-B1 fill-B6 s0" rx="268.5" ry="89.5"/></g><text x="331.5" y="79" class="text-bold fill-N1 s1"><tspan x="331.5" dy="0">물음 하나 — 무엇의 평등인가</tspan><tspan x="331.5" dy="17.667">평등을 말하려면</tspan><tspan x="331.5" dy="17.667">무엇의 눈금으로 잴지부터 정해야 한다</tspan></text></g><g ><g class="shape"><path d="M0 279h296v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="148" y="317.5" class="text-bold fill-N1 s1"><tspan x="148" dy="0">후생의 평등</tspan><tspan x="148" dy="16.833">각자가 얼마나</tspan><tspan x="148" dy="16.833">만족하는가로 잰다.</tspan><tspan x="148" dy="16.833">값비싼 취향을 가진 사람에게</tspan><tspan x="148" dy="16.833">더 주어야 한다는</tspan><tspan x="148" dy="16.833">결과가 나온다</tspan></text></g><g ><g class="shape"><path d="M356 287h276v130H356z" class="stroke-B1 fill-B6 s0"/></g><text x="494" y="325.5" class="text-bold fill-N1 s1"><tspan x="494" dy="0">자원의 평등 — 드워킨</tspan><tspan x="494" dy="17">각자가 무엇을 쥐고</tspan><tspan x="494" dy="17">출발하는가로 잰다.</tspan><tspan x="494" dy="17">남의 몫을 부러워하지 않는</tspan><tspan x="494" dy="17">상태를 기준으로 삼는다</tspan></text></g><g ><g class="shape"><path d="M692 279h319v146H692z" class="stroke-B1 fill-B6 s0"/></g><text x="851.5" y="317.5" class="text-bold fill-N1 s1"><tspan x="851.5" dy="0">역량의 평등 — 센</tspan><tspan x="851.5" dy="16.833">무엇을 가졌는가가 아니라</tspan><tspan x="851.5" dy="16.833">그것으로 무엇을 할 수 있는가로</tspan><tspan x="851.5" dy="16.833">잰다.</tspan><tspan x="851.5" dy="16.833">같은 곡식이라도</tspan><tspan x="851.5" dy="16.833">병든 사람에게는 다른 값이다</tspan></text></g><g ><g class="shape"><ellipse cx="509.5" cy="608.5" class="shape stroke-B1 fill-B6 s0" rx="250.5" ry="83.5"/></g><text x="509.5" y="614" class="text-bold fill-N1 s1">물음 둘 — 어떤 불평등이 부정의한가</text></g><g ><g class="shape"><path d="M310 792h400v130H310z" class="stroke-B1 fill-B6 s0"/></g><text x="510" y="830.5" class="text-bold fill-N1 s1"><tspan x="510" dy="0">운 평등주의</tspan><tspan x="510" dy="17">선택에서 온 불평등은 정당할 수 있고,</tspan><tspan x="510" dy="17">선택하지 않은 사정에서 온 불평등은</tspan><tspan x="510" dy="17">부정의하다.</tspan><tspan x="510" dy="17">12장의 도덕적 운을 분배에 적용한 것이다</tspan></text></g><g ><g class="shape"><path d="M75 1046h302v146H75z" class="stroke-B2 fill-B6 s2"/></g><text x="226" y="1084.5" class="text-bold fill-N1 s1"><tspan x="226" dy="0">반론 A — 가혹함</tspan><tspan x="226" dy="16.833">자기 선택으로 망가진 사람은</tspan><tspan x="226" dy="16.833">도울 이유가 없다는</tspan><tspan x="226" dy="16.833">결론이 나온다.</tspan><tspan x="226" dy="16.833">보험 없이 몰다 사고 난 사람을</tspan><tspan x="226" dy="16.833">길에 두는 것이 정의인가</tspan></text></g><g ><g class="shape"><path d="M810 1046h296v146H810z" class="stroke-B2 fill-B6 s2"/></g><text x="958" y="1084.5" class="text-bold fill-N1 s1"><tspan x="958" dy="0">반론 B — 모욕적인 판정</tspan><tspan x="958" dy="16.833">누가 무능력하고</tspan><tspan x="958" dy="16.833">누가 자기 잘못인지를</tspan><tspan x="958" dy="16.833">국가가 가려야 한다.</tspan><tspan x="958" dy="16.833">그 심사 자체가</tspan><tspan x="958" dy="16.833">평등한 시민 대접과 충돌한다</tspan></text></g><g ><g class="shape"><path d="M457 1022h293v194H457z" class="stroke-B2 fill-B6 s2"/></g><text x="603.5" y="1060.5" class="text-bold fill-N1 s1"><tspan x="603.5" dy="0">반론 C —</tspan><tspan x="603.5" dy="16.556">선택의 칸이 비어 있다</tspan><tspan x="603.5" dy="16.556">선택은 성격에서 나오고</tspan><tspan x="603.5" dy="16.556">성격은 선택한 것이 아니다.</tspan><tspan x="603.5" dy="16.556">통제 조건을 끝까지 밀면</tspan><tspan x="603.5" dy="16.556">‘선택에서 온 것’ 이</tspan><tspan x="603.5" dy="16.556">거의 남지 않는다.</tspan><tspan x="603.5" dy="16.556">12장이 도덕적 운에서 만난</tspan><tspan x="603.5" dy="16.556">어려움이 그대로 되풀이된다</tspan></text></g><g ><g class="shape"><path d="M732 1337h452v146H732z" class="stroke-B1 fill-B6 s0"/></g><text x="958" y="1375.5" class="text-bold fill-N1 s1"><tspan x="958" dy="0">관계적 평등 — 앤더슨</tspan><tspan x="958" dy="16.833">평등의 요점은 몫을 고르게 하는 것이 아니라</tspan><tspan x="958" dy="16.833">서로가 서로를 지배하지 않는</tspan><tspan x="958" dy="16.833">관계를 세우는 것이다.</tspan><tspan x="958" dy="16.833">물어야 할 것은 ‘누가 얼마나 갖는가’ 가 아니라</tspan><tspan x="958" dy="16.833">‘누가 누구 앞에 굽실거려야 하는가’ 다</tspan></text></g><g ><g class="shape"><ellipse cx="782.5" cy="1662.5" class="shape stroke-B1 fill-B6 s0" rx="238.5" ry="79.5"/></g><text x="782.5" y="1668" class="text-bold fill-N1 s1">물음 셋 — 평등 자체가 좋은 것인가</text></g><g ><g class="shape"><path d="M599 1842h368v146H599z" class="stroke-B2 fill-B6 s2"/></g><text x="783" y="1880.5" class="text-bold fill-N1 s1"><tspan x="783" dy="0">수평화 반론 — 파핏</tspan><tspan x="783" dy="16.833">평등 자체가 좋다면,</tspan><tspan x="783" dy="16.833">잘 사는 쪽을 끌어내려</tspan><tspan x="783" dy="16.833">아무도 나아지지 않는데도</tspan><tspan x="783" dy="16.833">어떤 면에서 더 나아졌다고 해야 한다.</tspan><tspan x="783" dy="16.833">그 결론을 받아들일 수 있는가</tspan></text></g><g ><g class="shape"><path d="M396 2088h284v162H396z" class="stroke-B1 fill-B6 s0"/></g><text x="538" y="2126.5" class="text-bold fill-N1 s1"><tspan x="538" dy="0">우선주의 — 파핏</tspan><tspan x="538" dy="16.714">중요한 것은 격차가 아니라</tspan><tspan x="538" dy="16.714">절대적 수준이다.</tspan><tspan x="538" dy="16.714">못한 처지에 있는 사람의</tspan><tspan x="538" dy="16.714">같은 크기 이익이 더 무겁다.</tspan><tspan x="538" dy="16.714">끌어내리기는 아무에게도</tspan><tspan x="538" dy="16.714">좋지 않으므로 좋을 수 없다</tspan></text></g><g ><g class="shape"><path d="M740 2088h281v162H740z" class="stroke-B1 fill-B6 s0"/></g><text x="880.5" y="2126.5" class="text-bold fill-N1 s1"><tspan x="880.5" dy="0">충분주의 — 프랭크퍼트</tspan><tspan x="880.5" dy="16.714">중요한 것은</tspan><tspan x="880.5" dy="16.714">모두가 충분히 갖는 것이다.</tspan><tspan x="880.5" dy="16.714">그 선을 넘은 뒤의 격차는</tspan><tspan x="880.5" dy="16.714">그 자체로 문제가 아니다.</tspan><tspan x="880.5" dy="16.714">12장의 프랭크퍼트 사례와</tspan><tspan x="880.5" dy="16.714">같은 사람이다</tspan></text></g><text x="592" y="2286" class="fill-N1 s1"><tspan x="592" dy="0">이 지도의 어느 갈래도 지워지지 않았다.</tspan><tspan x="592" dy="17.25">운 평등주의는 ‘왜 어떤 불평등은 참을 만하고 어떤 것은 아닌가’ 를 설명하는 힘이 크고,</tspan><tspan x="592" dy="17.25">관계적 평등은 평등 요구가 원래 무엇에 대한 항의였는지를 설명하는 힘이 크다.</tspan><tspan x="592" dy="17.25">둘을 합치려는 시도도 여럿 있다. 이 문서는 어느 쪽도 고르지 않는다</tspan></text><marker id="mk-d2-787010809-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M222.41 172.213C163.2 217.4 148 239 148 275" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M430.515 174.305C481 217.8 494 240.6 494 283" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M542.93 145.522C789.4 212.2 851.5 239 851.5 275" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M494 419c0 44.4 1.2 66 5.523 102.028" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M851.5 427c0 38-35.9 62-175.773 116.547" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M509.99 694c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M347.645 922.748C250.3 962 225.5 986.8 225.5 1042" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M711.437 908.5C907.9 959.2 957.5 986.8 957.5 1042" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M563.268 923.547C594.8 962 603 982 603 1018" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M957.5 1193.5v140" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><text x="958" y="1270" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">여기서 갈라진다</text><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M456.232 923.547C424.7 962 416.5 1001.4 416.5 1045.5v297.75c0 40.05 40.5 204.15 198.731 260.41" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M957.5 1485c0 38-15.5 59.4-74.278 102.63" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M782.98 1744c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M635.711 1988.894C557.5 2028 537.5 2048 537.5 2084" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><path fill="none" marker-end="url(#mk-d2-787010809-3488378134)" d="M841.25 1989.562C872 2028 880 2048 880 2084" class="connection stroke-B1 s0" mask="url(#d2-787010809)"/><mask id="d2-787010809" width="1386" height="2541" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1386v2541H-101z"/><path d="M887 1254h142v21H887z"/></mask></svg>