<svg xmlns="http://www.w3.org/2000/svg" width="2586" height="2282" class="d2-394027791 d2-svg" viewBox="-101 -101 2586 2282"><rect width="2586" height="2282" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-394027791 .fill-N1{fill:#0a0f25}.d2-394027791 .fill-B6{fill:#f7f8fe}.d2-394027791 .stroke-B1,.d2-394027791 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="879.5" cy="124.5" class="shape stroke-B1 fill-B6 s0" rx="373.5" ry="124.5"/></g><text x="879.5" y="122" class="text-bold fill-N1 s1"><tspan x="879.5" dy="0">물음 하나 — 무엇의 평등인가</tspan><tspan x="879.5" dy="18.5">평등을 말하려면 무엇의 눈금으로 잴지부터 정해야 한다</tspan></text></g><g ><g class="shape"><path d="M0 349h575v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="287.5" y="387.5" class="text-bold fill-N1 s1"><tspan x="287.5" dy="0">후생의 평등</tspan><tspan x="287.5" dy="17.667">각자가 얼마나 만족하는가로 잰다.</tspan><tspan x="287.5" dy="17.667">값비싼 취향을 가진 사람에게 더 주어야 한다는 결과가 나온다</tspan></text></g><g ><g class="shape"><path d="M635 349h488v98H635z" class="stroke-B1 fill-B6 s0"/></g><text x="879" y="387.5" class="text-bold fill-N1 s1"><tspan x="879" dy="0">자원의 평등 — 드워킨</tspan><tspan x="879" dy="17.667">각자가 무엇을 쥐고 출발하는가로 잰다.</tspan><tspan x="879" dy="17.667">남의 몫을 부러워하지 않는 상태를 기준으로 삼는다</tspan></text></g><g ><g class="shape"><path d="M1183 349h600v98h-600z" class="stroke-B1 fill-B6 s0"/></g><text x="1483" y="387.5" class="text-bold fill-N1 s1"><tspan x="1483" dy="0">역량의 평등 — 센</tspan><tspan x="1483" dy="17.667">무엇을 가졌는가가 아니라 그것으로 무엇을 할 수 있는가로 잰다.</tspan><tspan x="1483" dy="17.667">같은 곡식이라도 병든 사람에게는 다른 값이다</tspan></text></g><g ><g class="shape"><ellipse cx="1012.5" cy="630.5" class="shape stroke-B1 fill-B6 s0" rx="250.5" ry="83.5"/></g><text x="1012.5" y="636" class="text-bold fill-N1 s1">물음 둘 — 어떤 불평등이 부정의한가</text></g><g ><g class="shape"><path d="M778 814h469v114H778z" class="stroke-B1 fill-B6 s0"/></g><text x="1012.5" y="852.5" class="text-bold fill-N1 s1"><tspan x="1012.5" dy="0">운 평등주의</tspan><tspan x="1012.5" dy="17.25">선택에서 온 불평등은 정당할 수 있고,</tspan><tspan x="1012.5" dy="17.25">선택하지 않은 사정에서 온 불평등은 부정의하다.</tspan><tspan x="1012.5" dy="17.25">12장의 도덕적 운을 분배에 적용한 것이다</tspan></text></g><g ><g class="shape"><path d="M374 1036h600v98H374z" class="stroke-B2 fill-B6 s2"/></g><text x="674" y="1074.5" class="text-bold fill-N1 s1"><tspan x="674" dy="0">반론 A — 가혹함</tspan><tspan x="674" dy="17.667">자기 선택으로 망가진 사람은 도울 이유가 없다는 결론이 나온다.</tspan><tspan x="674" dy="17.667">보험 없이 몰다 사고 난 사람을 길에 두는 것이 정의인가</tspan></text></g><g ><g class="shape"><path d="M1702 1036h557v98h-557z" class="stroke-B2 fill-B6 s2"/></g><text x="1980.5" y="1074.5" class="text-bold fill-N1 s1"><tspan x="1980.5" dy="0">반론 B — 모욕적인 판정</tspan><tspan x="1980.5" dy="17.667">누가 무능력하고 누가 자기 잘못인지를 국가가 가려야 한다.</tspan><tspan x="1980.5" dy="17.667">그 심사 자체가 평등한 시민 대접과 충돌한다</tspan></text></g><g ><g class="shape"><path d="M1054 1028h588v114h-588z" class="stroke-B2 fill-B6 s2"/></g><text x="1348" y="1066.5" class="text-bold fill-N1 s1"><tspan x="1348" dy="0">반론 C — 선택의 칸이 비어 있다</tspan><tspan x="1348" dy="17.25">선택은 성격에서 나오고 성격은 선택한 것이 아니다.</tspan><tspan x="1348" dy="17.25">통제 조건을 끝까지 밀면 ‘선택에서 온 것’ 이 거의 남지 않는다.</tspan><tspan x="1348" dy="17.25">12장이 도덕적 운에서 만난 어려움이 그대로 되풀이된다</tspan></text></g><g ><g class="shape"><path d="M1734 1263h493v130h-493z" class="stroke-B1 fill-B6 s0"/></g><text x="1980.5" y="1301.5" class="text-bold fill-N1 s1"><tspan x="1980.5" dy="0">관계적 평등 — 앤더슨</tspan><tspan x="1980.5" dy="17">평등의 요점은 몫을 고르게 하는 것이 아니라</tspan><tspan x="1980.5" dy="17">서로가 서로를 지배하지 않는 관계를 세우는 것이다.</tspan><tspan x="1980.5" dy="17">물어야 할 것은 ‘누가 얼마나 갖는가’ 가 아니라</tspan><tspan x="1980.5" dy="17">‘누가 누구 앞에 굽실거려야 하는가’ 다</tspan></text></g><g ><g class="shape"><ellipse cx="1182.5" cy="1572.5" class="shape stroke-B1 fill-B6 s0" rx="238.5" ry="79.5"/></g><text x="1182.5" y="1578" class="text-bold fill-N1 s1">물음 셋 — 평등 자체가 좋은 것인가</text></g><g ><g class="shape"><path d="M883 1752h600v114H883z" class="stroke-B2 fill-B6 s2"/></g><text x="1183" y="1790.5" class="text-bold fill-N1 s1"><tspan x="1183" dy="0">수평화 반론 — 파핏</tspan><tspan x="1183" dy="17.25">평등 자체가 좋다면, 잘 사는 쪽을 끌어내려</tspan><tspan x="1183" dy="17.25">아무도 나아지지 않는데도 어떤 면에서 더 나아졌다고 해야 한다.</tspan><tspan x="1183" dy="17.25">그 결론을 받아들일 수 있는가</tspan></text></g><g ><g class="shape"><path d="M929 1966h508v114H929z" class="stroke-B1 fill-B6 s0"/></g><text x="1183" y="2004.5" class="text-bold fill-N1 s1"><tspan x="1183" dy="0">우선주의 — 파핏</tspan><tspan x="1183" dy="17.25">중요한 것은 격차가 아니라 절대적 수준이다.</tspan><tspan x="1183" dy="17.25">못한 처지에 있는 사람의 같은 크기 이익이 더 무겁다.</tspan><tspan x="1183" dy="17.25">끌어내리기는 아무에게도 좋지 않으므로 좋을 수 없다</tspan></text></g><g ><g class="shape"><path d="M1497 1966h479v114h-479z" class="stroke-B1 fill-B6 s0"/></g><text x="1736.5" y="2004.5" class="text-bold fill-N1 s1"><tspan x="1736.5" dy="0">충분주의 — 프랭크퍼트</tspan><tspan x="1736.5" dy="17.25">중요한 것은 모두가 충분히 갖는 것이다.</tspan><tspan x="1736.5" dy="17.25">그 선을 넘은 뒤의 격차는 그 자체로 문제가 아니다.</tspan><tspan x="1736.5" dy="17.25">12장의 프랭크퍼트 사례와 같은 사람이다</tspan></text></g><text x="1848.5" y="114" class="fill-N1 s1"><tspan x="1848.5" dy="0">이 지도의 어느 갈래도 지워지지 않았다. 운 평등주의는 ‘왜 어떤 불평등은 참을 만하고 어떤 것은 아닌가’ 를 설명하는 힘이 크고,</tspan><tspan x="1848.5" dy="17.667">관계적 평등은 평등 요구가 원래 무엇에 대한 항의였는지를 설명하는 힘이 크다.</tspan><tspan x="1848.5" dy="17.667">둘을 합치려는 시도도 여럿 있다. 이 문서는 어느 쪽도 고르지 않는다</tspan></text><marker id="mk-d2-394027791-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M598.081 207.565C350 280.6 287.5 309 287.5 345" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M879 251v94" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1163.921 206.557C1418.8 280.4 1483 309 1483 345" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M879 449c0 38 10.8 58.8 51.172 99.172" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1483 449c0 38-56 63.799-276.15 125.914" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1012.99 716c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M830.093 928.603C705.6 968 674 989.6 674 1032" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1249.238 897.147C1833.85 961.785 1980.5 989.6 1980.5 1032" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1192.906 928.607C1316.6 968 1348 988 1348 1024" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1980.5 1135.5v124" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><text x="1981" y="1204" style="fill:#676c7e;text-anchor:middle;font-size:16px">여기서 갈라진다</text><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1013.04 930c.76 38 .96 69.4.96 101.5v233.75c0 37.65 14.8 189.15 70.831 232.31" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1980.5 1395c0 38-116.7 67-579.552 142.357" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1182.99 1654c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1182.75 1868v94" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><path fill="none" marker-end="url(#mk-d2-394027791-3488378134)" d="M1479.214 1866.38C1684.45 1906 1736.25 1926 1736.25 1962" class="connection stroke-B1 s0" mask="url(#d2-394027791)"/><mask id="d2-394027791" width="2586" height="2282" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2586v2282H-101z"/><path d="M1910 1188h142v21h-142z"/></mask></svg>