<svg xmlns="http://www.w3.org/2000/svg" width="1205" height="2743" class="d2-365960048 d2-svg" viewBox="-89 -89 1205 2743"><rect width="1205" height="2743" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-365960048 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-365960048 .fill-N1{fill:#0a0f25}.d2-365960048 .fill-B4{fill:#e3e9fd}.d2-365960048 .fill-B5{fill:#edf0fd}.d2-365960048 .stroke-B1,.d2-365960048 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M204 12h772v214H204z" class="stroke-B1 fill-B4 s0"/></g><text x="590" y="45" class="text-bold fill-N1 s1">고대 그리스 — 기원전 6~4세기</text></g><g ><g class="shape"><path d="M232 296h716v198H232z" class="stroke-B1 fill-B4 s0"/></g><text x="590" y="329" class="fill-N1 s1">헬레니즘·로마 — 기원전 4세기 ~ 기원후 3세기</text></g><g ><g class="shape"><path d="M287 564h606v214H287z" class="stroke-B1 fill-B4 s0"/></g><text x="590" y="597" class="fill-N1 s1">중세 — 5~15세기</text></g><g ><g class="shape"><path d="M254 848h672v262H254z" class="stroke-B1 fill-B4 s0"/></g><text x="590" y="881" class="fill-N1 s1">근대 — 17~18세기. 두 흐름이 갈린다</text></g><g ><g class="shape"><path d="M381 1180h418v230H381z" class="stroke-B1 fill-B4 s0"/></g><text x="590" y="1213" class="fill-N1 s1">칸트 — 18세기 말</text></g><g ><g class="shape"><path d="M179 1480h823v234H179z" class="stroke-B1 fill-B4 s0"/></g><text x="590.5" y="1513" class="fill-N1 s1">19세기</text></g><g ><g class="shape"><path d="M12 1794h646v540H12z" class="stroke-B1 fill-B4 s0"/></g><text x="335" y="1827" class="text-bold fill-N1 s1"><tspan x="335" dy="0">20세기 — 분석철학.</tspan><tspan x="335" dy="32">이 문서 본문의 대부분이 여기 있다</tspan></text></g><g ><g class="shape"><path d="M678 1913h337v302H678z" class="stroke-B1 fill-B4 s0"/></g><text x="846.5" y="1946" class="fill-N1 s1"><tspan x="846.5" dy="0">20세기 —</tspan><tspan x="846.5" dy="32">현상학과 그 이후</tspan></text></g><text x="334.5" y="2420" class="fill-N1 s2"><tspan x="334.5" dy="0">이 지도는 서양 철학만 담고 있다.</tspan><tspan x="334.5" dy="16.556">이 문서가 다루는 논쟁과 어휘가</tspan><tspan x="334.5" dy="16.556">그 전통에서 나왔기 때문이고,</tspan><tspan x="334.5" dy="16.556">그 전통이 더 낫기 때문이 아니다.</tspan><tspan x="334.5" dy="16.556">동아시아 철학(유가·도가·불교)과</tspan><tspan x="334.5" dy="16.556">인도 철학은 앎·자아·인과·규범에 대해</tspan><tspan x="334.5" dy="16.556">독자적인 논의를 오래 쌓아 왔다.</tspan><tspan x="334.5" dy="16.556">이 문서는 그것을 다루지 않는다.</tspan><tspan x="334.5" dy="16.556">21장이 갈 길을 안내한다</tspan></text><text x="846.5" y="2420" class="fill-N1 s2"><tspan x="846.5" dy="0">외우라고 있는 그림이 아니다.</tspan><tspan x="846.5" dy="17">뒤에서 낯선 이름이 나오면</tspan><tspan x="846.5" dy="17">여기로 돌아와 자리를 확인하면 된다.</tspan><tspan x="846.5" dy="17">선은 영향 관계가 아니라 시간 순서다.</tspan><tspan x="846.5" dy="17">실제 계보는 이보다 훨씬 얽혀 있다</tspan></text><g ><g class="shape"><path d="M254 62h235v114H254z" class="stroke-B1 fill-B5 s0"/></g><text x="371.5" y="100.5" class="text-bold fill-N1 s2"><tspan x="371.5" dy="0">소크라테스</tspan><tspan x="371.5" dy="17.25">‘X 란 무엇인가’ 라고</tspan><tspan x="371.5" dy="17.25">묻는 방식</tspan><tspan x="371.5" dy="17.25">(3장 개념 분석의 원형)</tspan></text></g><g ><g class="shape"><path d="M509 62h168v114H509z" class="stroke-B1 fill-B5 s0"/></g><text x="593" y="100.5" class="text-bold fill-N1 s2"><tspan x="593" dy="0">플라톤</tspan><tspan x="593" dy="17.25">형상 — 보편자</tspan><tspan x="593" dy="17.25">실재론의 뿌리</tspan><tspan x="593" dy="17.25">(10장)</tspan></text></g><g ><g class="shape"><path d="M697 62h229v114H697z" class="stroke-B1 fill-B5 s0"/></g><text x="811.5" y="100.5" class="text-bold fill-N1 s2"><tspan x="811.5" dy="0">아리스토텔레스</tspan><tspan x="811.5" dy="17.25">논리학과 형이상학의</tspan><tspan x="811.5" dy="17.25">어휘, 덕</tspan><tspan x="811.5" dy="17.25">(18장)</tspan></text></g><g ><g class="shape"><path d="M334 346h232v98H334z" class="stroke-B1 fill-B5 s0"/></g><text x="450" y="384.5" class="text-bold fill-N1 s2"><tspan x="450" dy="0">퓌론과 회의주의 전통</tspan><tspan x="450" dy="17.667">판단을 미루는 기술</tspan><tspan x="450" dy="17.667">(7장의 먼 조상)</tspan></text></g><g ><g class="shape"><path d="M586 346h260v98H586z" class="stroke-B1 fill-B5 s0"/></g><text x="716" y="384.5" class="text-bold fill-N1 s2"><tspan x="716" dy="0">스토아 학파 · 에피쿠로스</tspan><tspan x="716" dy="17.667">어떻게 살 것인가에</tspan><tspan x="716" dy="17.667">답을 건 학파들</tspan></text></g><g ><g class="shape"><path d="M337 622h277v98H337z" class="stroke-B1 fill-B5 s0"/></g><text x="475.5" y="660.5" class="text-bold fill-N1 s2"><tspan x="475.5" dy="0">아우구스티누스 · 아퀴나스</tspan><tspan x="475.5" dy="17.667">신학 안에서 다듬은</tspan><tspan x="475.5" dy="17.667">형이상학과 윤리</tspan></text></g><g ><g class="shape"><path d="M634 614h209v114H634z" class="stroke-B1 fill-B5 s0"/></g><text x="738.5" y="652.5" class="text-bold fill-N1 s2"><tspan x="738.5" dy="0">보편자 논쟁</tspan><tspan x="738.5" dy="17.25">실재론과 유명론이</tspan><tspan x="738.5" dy="17.25">여기서 갈린다</tspan><tspan x="738.5" dy="17.25">(10장)</tspan></text></g><g ><g class="shape"><path d="M304 898h276v162H304z" class="stroke-B1 fill-B5 s0"/></g><text x="442" y="936.5" class="text-bold fill-N1 s2"><tspan x="442" dy="0">대륙 합리론</tspan><tspan x="442" dy="16.714">데카르트 · 스피노자 ·</tspan><tspan x="442" dy="16.714">라이프니츠</tspan><tspan x="442" dy="16.714">지식의 뿌리를 이성에 둔다</tspan><tspan x="442" dy="16.714">(7장 꿈 논증,</tspan><tspan x="442" dy="16.714">11장 가능세계,</tspan><tspan x="442" dy="16.714">14장 실체 이원론)</tspan></text></g><g ><g class="shape"><path d="M600 914h276v130H600z" class="stroke-B1 fill-B5 s0"/></g><text x="738" y="952.5" class="text-bold fill-N1 s2"><tspan x="738" dy="0">영국 경험론</tspan><tspan x="738" dy="17">로크 · 버클리 · 흄</tspan><tspan x="738" dy="17">지식의 뿌리를 경험에 둔다</tspan><tspan x="738" dy="17">(8장 귀납, 11장 인과,</tspan><tspan x="738" dy="17">13장 기억 기준)</tspan></text></g><g ><g class="shape"><path d="M431 1230h318v130H431z" class="stroke-B1 fill-B5 s0"/></g><text x="590" y="1268.5" class="text-bold fill-N1 s2"><tspan x="590" dy="0">이마누엘 칸트</tspan><tspan x="590" dy="17">두 흐름을 한데 놓으려 한 시도.</tspan><tspan x="590" dy="17">선험적/후험적 구분과 의무론이</tspan><tspan x="590" dy="17">이 문서에 남았다</tspan><tspan x="590" dy="17">(11장, 18장)</tspan></text></g><g ><g class="shape"><path d="M239 1540h188v114H239z" class="stroke-B1 fill-B5 s0"/></g><text x="333" y="1578.5" class="text-bold fill-N1 s2"><tspan x="333" dy="0">벤담 · 밀</tspan><tspan x="333" dy="17.25">공리주의를</tspan><tspan x="333" dy="17.25">이론으로 세운다</tspan><tspan x="333" dy="17.25">(18·19장)</tspan></text></g><g ><g class="shape"><path d="M467 1540h200v114H467z" class="stroke-B1 fill-B5 s0"/></g><text x="567" y="1578.5" class="text-bold fill-N1 s2"><tspan x="567" dy="0">프레게</tspan><tspan x="567" dy="17.25">현대 논리학과</tspan><tspan x="567" dy="17.25">언어철학의 출발</tspan><tspan x="567" dy="17.25">(16장 뜻과 지시체)</tspan></text></g><g ><g class="shape"><path d="M707 1540h235v114H707z" class="stroke-B2 fill-B5 s3"/></g><text x="824.5" y="1586.5" class="text-bold fill-N1 s2"><tspan x="824.5" dy="0">헤겔 · 마르크스 · 니체</tspan><tspan x="824.5" dy="17.667">이 문서가 다루지 않는</tspan><tspan x="824.5" dy="17.667">큰 흐름</tspan></text></g><g ><g class="shape"><path d="M72 1868h239v183H72z" class="stroke-B1 fill-B5 s0"/></g><text x="191.5" y="1933" class="text-bold fill-N1 s2"><tspan x="191.5" dy="0">러셀 · 비트겐슈타인 ·</tspan><tspan x="191.5" dy="17">카르납</tspan><tspan x="191.5" dy="17">언어와 논리를 통해</tspan><tspan x="191.5" dy="17">문제를 다시 세운다</tspan><tspan x="191.5" dy="17">(16장)</tspan></text></g><g ><g class="shape"><path d="M72 2091h239v183H72z" class="stroke-B1 fill-B5 s0"/></g><text x="191.5" y="2172" class="text-bold fill-N1 s2"><tspan x="191.5" dy="0">인식론 · 과학철학</tspan><tspan x="191.5" dy="17.667">게티어 · 굿맨 · 포퍼 · 쿤</tspan><tspan x="191.5" dy="17.667">(5·8·9장)</tspan></text></g><g ><g class="shape"><path d="M351 1868h247v114H351z" class="stroke-B1 fill-B5 s0"/></g><text x="474.5" y="1906.5" class="text-bold fill-N1 s2"><tspan x="474.5" dy="0">형이상학 · 언어</tspan><tspan x="474.5" dy="17.25">콰인 · 크립키 ·</tspan><tspan x="474.5" dy="17.25">퍼트넘 · 그라이스</tspan><tspan x="474.5" dy="17.25">(10·11·16장)</tspan></text></g><g ><g class="shape"><path d="M351 2022h247v98H351z" class="stroke-B1 fill-B5 s0"/></g><text x="474.5" y="2060.5" class="text-bold fill-N1 s2"><tspan x="474.5" dy="0">심리철학 · 인격</tspan><tspan x="474.5" dy="17.667">설 · 파핏 · 차머스</tspan><tspan x="474.5" dy="17.667">(13·14·15장)</tspan></text></g><g ><g class="shape"><path d="M351 2160h247v114H351z" class="stroke-B1 fill-B5 s0"/></g><text x="474.5" y="2198.5" class="text-bold fill-N1 s2"><tspan x="474.5" dy="0">윤리 · 정치</tspan><tspan x="474.5" dy="17.25">앤스컴 · 풋 · 톰슨 · 싱어 ·</tspan><tspan x="474.5" dy="17.25">롤스 · 노직 · 벌린</tspan><tspan x="474.5" dy="17.25">(18·19·20장)</tspan></text></g><g ><g class="shape"><path d="M728 1987h237v178H728z" class="stroke-B2 fill-B5 s3"/></g><text x="846.5" y="2025.5" class="text-bold fill-N1 s2"><tspan x="846.5" dy="0">후설 · 하이데거 ·</tspan><tspan x="846.5" dy="16.625">메를로퐁티 · 사르트르</tspan><tspan x="846.5" dy="16.625">의식에 나타나는</tspan><tspan x="846.5" dy="16.625">그대로를 기술하는</tspan><tspan x="846.5" dy="16.625">데서 시작한다.</tspan><tspan x="846.5" dy="16.625">이 문서는 이 흐름을</tspan><tspan x="846.5" dy="16.625">본격적으로</tspan><tspan x="846.5" dy="16.625">다루지 않는다</tspan></text></g><marker id="mk-d2-365960048-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-365960048-3488378134)" d="M590.75 228v64" class="connection stroke-B1 s0" mask="url(#d2-365960048)"/><path fill="none" marker-end="url(#mk-d2-365960048-3488378134)" d="M590.75 496v64" class="connection stroke-B1 s0" mask="url(#d2-365960048)"/><path fill="none" marker-end="url(#mk-d2-365960048-3488378134)" d="M590.75 780v64" class="connection stroke-B1 s0" mask="url(#d2-365960048)"/><path fill="none" marker-end="url(#mk-d2-365960048-3488378134)" d="M590.75 1112v64" class="connection stroke-B1 s0" mask="url(#d2-365960048)"/><path fill="none" marker-end="url(#mk-d2-365960048-3488378134)" d="M590.75 1412v64" class="connection stroke-B1 s0" mask="url(#d2-365960048)"/><path fill="none" marker-end="url(#mk-d2-365960048-3488378134)" d="M335 1716v74" class="connection stroke-B1 s0" mask="url(#d2-365960048)"/><path fill="none" marker-end="url(#mk-d2-365960048-3488378134)" d="M846.5 1716v193" class="connection stroke-B1 s0" mask="url(#d2-365960048)"/><mask id="d2-365960048" width="1205" height="2743" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1205v2743H-89z"/></mask></svg>