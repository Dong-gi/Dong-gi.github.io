<svg xmlns="http://www.w3.org/2000/svg" width="3011" height="2245" class="d2-709829509 d2-svg" viewBox="-91 -95 3011 2245"><rect width="3011" height="2245" x="-91" y="-95" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-709829509 .fill-N1{fill:#0a0f25}.d2-709829509 .fill-B4{fill:#e3e9fd}.d2-709829509 .fill-B5{fill:#edf0fd}.d2-709829509 .stroke-B1,.d2-709829509 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M997 46h1084v158H997z" class="stroke-B1 fill-B4 s0"/></g><text x="1539" y="33" class="text-bold fill-N1 s1">고대 그리스 — 기원전 6~4세기</text></g><g ><g class="shape"><path d="M1051 369h695v158h-695z" class="stroke-B1 fill-B4 s0"/></g><text x="1398.5" y="356" class="fill-N1 s1">헬레니즘·로마 — 기원전 4세기 ~ 기원후 3세기</text></g><g ><g class="shape"><path d="M927 667h816v158H927z" class="stroke-B1 fill-B4 s0"/></g><text x="1335" y="654" class="fill-N1 s1">중세 — 5~15세기</text></g><g ><g class="shape"><path d="M847 965h902v174H847z" class="stroke-B1 fill-B4 s0"/></g><text x="1298" y="952" class="fill-N1 s1">근대 — 17~18세기. 두 흐름이 갈린다</text></g><g ><g class="shape"><path d="M1280 1279h530v174h-530z" class="stroke-B1 fill-B4 s0"/></g><text x="1545" y="1266" class="fill-N1 s1">칸트 — 18세기 말</text></g><g ><g class="shape"><path d="M657 1593h1771v158H657z" class="stroke-B1 fill-B4 s0"/></g><text x="1542.5" y="1580" class="fill-N1 s1">19세기</text></g><g ><g class="shape"><path d="M10 1891h1823v158H10z" class="stroke-B1 fill-B4 s0"/></g><text x="921.5" y="1878" class="text-bold fill-N1 s1">20세기 — 분석철학. 이 문서 본문의 대부분이 여기 있다</text></g><g ><g class="shape"><path d="M1873 1891h549v158h-549z" class="stroke-B1 fill-B4 s0"/></g><text x="2147.5" y="1878" class="fill-N1 s1">20세기 — 현상학과 그 이후</text></g><text x="2288.5" y="66" class="fill-N1 s2"><tspan x="2288.5" dy="0">이 지도는 서양 철학만 담고 있다.</tspan><tspan x="2288.5" dy="16.556">이 문서가 다루는 논쟁과 어휘가</tspan><tspan x="2288.5" dy="16.556">그 전통에서 나왔기 때문이고,</tspan><tspan x="2288.5" dy="16.556">그 전통이 더 낫기 때문이 아니다.</tspan><tspan x="2288.5" dy="16.556">동아시아 철학(유가·도가·불교)과</tspan><tspan x="2288.5" dy="16.556">인도 철학은 앎·자아·인과·규범에 대해</tspan><tspan x="2288.5" dy="16.556">독자적인 논의를 오래 쌓아 왔다.</tspan><tspan x="2288.5" dy="16.556">이 문서는 그것을 다루지 않는다.</tspan><tspan x="2288.5" dy="16.556">21장이 갈 길을 안내한다</tspan></text><text x="2662.5" y="98" class="fill-N1 s2"><tspan x="2662.5" dy="0">외우라고 있는 그림이 아니다.</tspan><tspan x="2662.5" dy="17">뒤에서 낯선 이름이 나오면</tspan><tspan x="2662.5" dy="17">여기로 돌아와 자리를 확인하면 된다.</tspan><tspan x="2662.5" dy="17">선은 영향 관계가 아니라 시간 순서다.</tspan><tspan x="2662.5" dy="17">실제 계보는 이보다 훨씬 얽혀 있다</tspan></text><g ><g class="shape"><path d="M1027 76h313v98h-313z" class="stroke-B1 fill-B5 s0"/></g><text x="1183.5" y="114.5" class="text-bold fill-N1 s2"><tspan x="1183.5" dy="0">소크라테스</tspan><tspan x="1183.5" dy="17.667">‘X 란 무엇인가’ 라고 묻는 방식</tspan><tspan x="1183.5" dy="17.667">(3장 개념 분석의 원형)</tspan></text></g><g ><g class="shape"><path d="M1400 76h290v98h-290z" class="stroke-B1 fill-B5 s0"/></g><text x="1545" y="114.5" class="text-bold fill-N1 s2"><tspan x="1545" dy="0">플라톤</tspan><tspan x="1545" dy="17.667">형상 — 보편자 실재론의 뿌리</tspan><tspan x="1545" dy="17.667">(10장)</tspan></text></g><g ><g class="shape"><path d="M1750 76h301v98h-301z" class="stroke-B1 fill-B5 s0"/></g><text x="1900.5" y="114.5" class="text-bold fill-N1 s2"><tspan x="1900.5" dy="0">아리스토텔레스</tspan><tspan x="1900.5" dy="17.667">논리학과 형이상학의 어휘, 덕</tspan><tspan x="1900.5" dy="17.667">(18장)</tspan></text></g><g ><g class="shape"><path d="M1081 399h232v98h-232z" class="stroke-B1 fill-B5 s0"/></g><text x="1197" y="437.5" class="text-bold fill-N1 s2"><tspan x="1197" dy="0">퓌론과 회의주의 전통</tspan><tspan x="1197" dy="17.667">판단을 미루는 기술</tspan><tspan x="1197" dy="17.667">(7장의 먼 조상)</tspan></text></g><g ><g class="shape"><path d="M1373 407h343v82h-343z" class="stroke-B1 fill-B5 s0"/></g><text x="1544.5" y="445.5" class="text-bold fill-N1 s2"><tspan x="1544.5" dy="0">스토아 학파 · 에피쿠로스</tspan><tspan x="1544.5" dy="18.5">어떻게 살 것인가에 답을 건 학파들</tspan></text></g><g ><g class="shape"><path d="M957 705h360v82H957z" class="stroke-B1 fill-B5 s0"/></g><text x="1137" y="743.5" class="text-bold fill-N1 s2"><tspan x="1137" dy="0">아우구스티누스 · 아퀴나스</tspan><tspan x="1137" dy="18.5">신학 안에서 다듬은 형이상학과 윤리</tspan></text></g><g ><g class="shape"><path d="M1377 697h336v98h-336z" class="stroke-B1 fill-B5 s0"/></g><text x="1545" y="735.5" class="text-bold fill-N1 s2"><tspan x="1545" dy="0">보편자 논쟁</tspan><tspan x="1545" dy="17.667">실재론과 유명론이 여기서 갈린다</tspan><tspan x="1545" dy="17.667">(10장)</tspan></text></g><g ><g class="shape"><path d="M877 995h433v114H877z" class="stroke-B1 fill-B5 s0"/></g><text x="1093.5" y="1033.5" class="text-bold fill-N1 s2"><tspan x="1093.5" dy="0">대륙 합리론</tspan><tspan x="1093.5" dy="17.25">데카르트 · 스피노자 · 라이프니츠</tspan><tspan x="1093.5" dy="17.25">지식의 뿌리를 이성에 둔다</tspan><tspan x="1093.5" dy="17.25">(7장 꿈 논증, 11장 가능세계, 14장 실체 이원론)</tspan></text></g><g ><g class="shape"><path d="M1370 995h349v114h-349z" class="stroke-B1 fill-B5 s0"/></g><text x="1544.5" y="1033.5" class="text-bold fill-N1 s2"><tspan x="1544.5" dy="0">영국 경험론</tspan><tspan x="1544.5" dy="17.25">로크 · 버클리 · 흄</tspan><tspan x="1544.5" dy="17.25">지식의 뿌리를 경험에 둔다</tspan><tspan x="1544.5" dy="17.25">(8장 귀납, 11장 인과, 13장 기억 기준)</tspan></text></g><g ><g class="shape"><path d="M1310 1309h470v114h-470z" class="stroke-B1 fill-B5 s0"/></g><text x="1545" y="1347.5" class="text-bold fill-N1 s2"><tspan x="1545" dy="0">이마누엘 칸트</tspan><tspan x="1545" dy="17.25">두 흐름을 한데 놓으려 한 시도.</tspan><tspan x="1545" dy="17.25">선험적/후험적 구분과 의무론이 이 문서에 남았다</tspan><tspan x="1545" dy="17.25">(11장, 18장)</tspan></text></g><g ><g class="shape"><path d="M687 1623h293v98H687z" class="stroke-B1 fill-B5 s0"/></g><text x="833.5" y="1661.5" class="text-bold fill-N1 s2"><tspan x="833.5" dy="0">벤담 · 밀</tspan><tspan x="833.5" dy="17.667">공리주의를 이론으로 세운다</tspan><tspan x="833.5" dy="17.667">(18·19장)</tspan></text></g><g ><g class="shape"><path d="M1387 1623h316v98h-316z" class="stroke-B1 fill-B5 s0"/></g><text x="1545" y="1661.5" class="text-bold fill-N1 s2"><tspan x="1545" dy="0">프레게</tspan><tspan x="1545" dy="17.667">현대 논리학과 언어철학의 출발</tspan><tspan x="1545" dy="17.667">(16장 뜻과 지시체)</tspan></text></g><g ><g class="shape"><path d="M2096 1631h302v82h-302z" class="stroke-B2 fill-B5 s3"/></g><text x="2247" y="1669.5" class="text-bold fill-N1 s2"><tspan x="2247" dy="0">헤겔 · 마르크스 · 니체</tspan><tspan x="2247" dy="18.5">이 문서가 다루지 않는 큰 흐름</tspan></text></g><g ><g class="shape"><path d="M40 1921h383v98H40z" class="stroke-B1 fill-B5 s0"/></g><text x="231.5" y="1959.5" class="text-bold fill-N1 s2"><tspan x="231.5" dy="0">러셀 · 비트겐슈타인 · 카르납</tspan><tspan x="231.5" dy="17.667">언어와 논리를 통해 문제를 다시 세운다</tspan><tspan x="231.5" dy="17.667">(16장)</tspan></text></g><g ><g class="shape"><path d="M483 1921h239v98H483z" class="stroke-B1 fill-B5 s0"/></g><text x="602.5" y="1959.5" class="text-bold fill-N1 s2"><tspan x="602.5" dy="0">인식론 · 과학철학</tspan><tspan x="602.5" dy="17.667">게티어 · 굿맨 · 포퍼 · 쿤</tspan><tspan x="602.5" dy="17.667">(5·8·9장)</tspan></text></g><g ><g class="shape"><path d="M782 1921h320v98H782z" class="stroke-B1 fill-B5 s0"/></g><text x="942" y="1959.5" class="text-bold fill-N1 s2"><tspan x="942" dy="0">형이상학 · 언어</tspan><tspan x="942" dy="17.667">콰인 · 크립키 · 퍼트넘 · 그라이스</tspan><tspan x="942" dy="17.667">(10·11·16장)</tspan></text></g><g ><g class="shape"><path d="M1162 1921h187v98h-187z" class="stroke-B1 fill-B5 s0"/></g><text x="1255.5" y="1959.5" class="text-bold fill-N1 s2"><tspan x="1255.5" dy="0">심리철학 · 인격</tspan><tspan x="1255.5" dy="17.667">설 · 파핏 · 차머스</tspan><tspan x="1255.5" dy="17.667">(13·14·15장)</tspan></text></g><g ><g class="shape"><path d="M1409 1921h394v98h-394z" class="stroke-B1 fill-B5 s0"/></g><text x="1606" y="1959.5" class="text-bold fill-N1 s2"><tspan x="1606" dy="0">윤리 · 정치</tspan><tspan x="1606" dy="17.667">앤스컴 · 풋 · 톰슨 · 싱어 · 롤스 · 노직 · 벌린</tspan><tspan x="1606" dy="17.667">(18·19·20장)</tspan></text></g><g ><g class="shape"><path d="M1903 1921h489v98h-489z" class="stroke-B2 fill-B5 s3"/></g><text x="2147.5" y="1959.5" class="text-bold fill-N1 s2"><tspan x="2147.5" dy="0">후설 · 하이데거 · 메를로퐁티 · 사르트르</tspan><tspan x="2147.5" dy="17.667">의식에 나타나는 그대로를 기술하는 데서 시작한다.</tspan><tspan x="2147.5" dy="17.667">이 문서는 이 흐름을 본격적으로 다루지 않는다</tspan></text></g><marker id="mk-d2-709829509-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-709829509-3488378134)" d="M1544.75 206v118" class="connection stroke-B1 s0" mask="url(#d2-709829509)"/><path fill="none" marker-end="url(#mk-d2-709829509-3488378134)" d="M1544.75 529v134" class="connection stroke-B1 s0" mask="url(#d2-709829509)"/><path fill="none" marker-end="url(#mk-d2-709829509-3488378134)" d="M1544.75 827v93" class="connection stroke-B1 s0" mask="url(#d2-709829509)"/><path fill="none" marker-end="url(#mk-d2-709829509-3488378134)" d="M1544.75 1141v93" class="connection stroke-B1 s0" mask="url(#d2-709829509)"/><path fill="none" marker-end="url(#mk-d2-709829509-3488378134)" d="M1544.75 1455v93" class="connection stroke-B1 s0" mask="url(#d2-709829509)"/><path fill="none" marker-end="url(#mk-d2-709829509-3488378134)" d="M942 1753v93" class="connection stroke-B1 s0" mask="url(#d2-709829509)"/><path fill="none" marker-end="url(#mk-d2-709829509-3488378134)" d="M2147.5 1753v93" class="connection stroke-B1 s0" mask="url(#d2-709829509)"/><mask id="d2-709829509" width="3011" height="2245" x="-91" y="-95" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-91-95h3011v2245H-91z"/></mask></svg>