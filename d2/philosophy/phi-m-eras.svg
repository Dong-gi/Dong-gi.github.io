<svg xmlns="http://www.w3.org/2000/svg" width="1502" height="2937" class="d2-1873768083 d2-svg" viewBox="-101 -121 1502 2937"><rect width="1502" height="2937" x="-101" y="-121" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1873768083 .fill-N1{fill:#0a0f25}.d2-1873768083 .fill-B4{fill:#e3e9fd}.d2-1873768083 .fill-B5{fill:#edf0fd}.d2-1873768083 .stroke-B1,.d2-1873768083 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M194 20h1084v158H194z" class="stroke-B1 fill-B4 s0"/></g><text x="736" y="7" class="text-bold fill-N1 s1">고대 그리스 — 기원전 6~4세기</text></g><g ><g class="shape"><path d="M249 318h695v158H249z" class="stroke-B1 fill-B4 s0"/></g><text x="596.5" y="305" class="fill-N1 s1">헬레니즘·로마 — 기원전 4세기 ~ 기원후 3세기</text></g><g ><g class="shape"><path d="M124 616h816v158H124z" class="stroke-B1 fill-B4 s0"/></g><text x="532" y="603" class="fill-N1 s1">중세 — 5~15세기</text></g><g ><g class="shape"><path d="M149 914h798v190H149z" class="stroke-B1 fill-B4 s0"/></g><text x="548" y="901" class="fill-N1 s1">근대 — 17~18세기. 두 흐름이 갈린다</text></g><g ><g class="shape"><path d="M553 1244h378v190H553z" class="stroke-B1 fill-B4 s0"/></g><text x="742" y="1231" class="fill-N1 s1">칸트 — 18세기 말</text></g><g ><g class="shape"><path d="M187 1554h1111v218H187z" class="stroke-B1 fill-B4 s0"/></g><text x="742.5" y="1587" class="fill-N1 s1">19세기</text></g><g ><g class="shape"><path d="M0 1922h809v494H0z" class="stroke-B1 fill-B4 s0"/></g><text x="404.5" y="1955" class="text-bold fill-N1 s1">20세기 — 분석철학. 이 문서 본문의 대부분이 여기 있다</text></g><g ><g class="shape"><path d="M859 2074h441v190H859z" class="stroke-B1 fill-B4 s0"/></g><text x="1079.5" y="2061" class="fill-N1 s1">20세기 — 현상학과 그 이후</text></g><text x="404.5" y="2582" class="fill-N1 s2"><tspan x="404.5" dy="0">이 지도는 서양 철학만 담고 있다.</tspan><tspan x="404.5" dy="16.556">이 문서가 다루는 논쟁과 어휘가</tspan><tspan x="404.5" dy="16.556">그 전통에서 나왔기 때문이고,</tspan><tspan x="404.5" dy="16.556">그 전통이 더 낫기 때문이 아니다.</tspan><tspan x="404.5" dy="16.556">동아시아 철학(유가·도가·불교)과</tspan><tspan x="404.5" dy="16.556">인도 철학은 앎·자아·인과·규범에 대해</tspan><tspan x="404.5" dy="16.556">독자적인 논의를 오래 쌓아 왔다.</tspan><tspan x="404.5" dy="16.556">이 문서는 그것을 다루지 않는다.</tspan><tspan x="404.5" dy="16.556">21장이 갈 길을 안내한다</tspan></text><text x="1079.5" y="2614" class="fill-N1 s2"><tspan x="1079.5" dy="0">외우라고 있는 그림이 아니다.</tspan><tspan x="1079.5" dy="17">뒤에서 낯선 이름이 나오면</tspan><tspan x="1079.5" dy="17">여기로 돌아와 자리를 확인하면 된다.</tspan><tspan x="1079.5" dy="17">선은 영향 관계가 아니라 시간 순서다.</tspan><tspan x="1079.5" dy="17">실제 계보는 이보다 훨씬 얽혀 있다</tspan></text><g ><g class="shape"><path d="M224 50h313v98H224z" class="stroke-B1 fill-B5 s0"/></g><text x="380.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="380.5" dy="0">소크라테스</tspan><tspan x="380.5" dy="17.667">‘X 란 무엇인가’ 라고 묻는 방식</tspan><tspan x="380.5" dy="17.667">(3장 개념 분석의 원형)</tspan></text></g><g ><g class="shape"><path d="M597 50h290v98H597z" class="stroke-B1 fill-B5 s0"/></g><text x="742" y="88.5" class="text-bold fill-N1 s2"><tspan x="742" dy="0">플라톤</tspan><tspan x="742" dy="17.667">형상 — 보편자 실재론의 뿌리</tspan><tspan x="742" dy="17.667">(10장)</tspan></text></g><g ><g class="shape"><path d="M947 50h301v98H947z" class="stroke-B1 fill-B5 s0"/></g><text x="1097.5" y="88.5" class="text-bold fill-N1 s2"><tspan x="1097.5" dy="0">아리스토텔레스</tspan><tspan x="1097.5" dy="17.667">논리학과 형이상학의 어휘, 덕</tspan><tspan x="1097.5" dy="17.667">(18장)</tspan></text></g><g ><g class="shape"><path d="M279 348h232v98H279z" class="stroke-B1 fill-B5 s0"/></g><text x="395" y="386.5" class="text-bold fill-N1 s2"><tspan x="395" dy="0">퓌론과 회의주의 전통</tspan><tspan x="395" dy="17.667">판단을 미루는 기술</tspan><tspan x="395" dy="17.667">(7장의 먼 조상)</tspan></text></g><g ><g class="shape"><path d="M571 356h343v82H571z" class="stroke-B1 fill-B5 s0"/></g><text x="742.5" y="394.5" class="text-bold fill-N1 s2"><tspan x="742.5" dy="0">스토아 학파 · 에피쿠로스</tspan><tspan x="742.5" dy="18.5">어떻게 살 것인가에 답을 건 학파들</tspan></text></g><g ><g class="shape"><path d="M154 654h360v82H154z" class="stroke-B1 fill-B5 s0"/></g><text x="334" y="692.5" class="text-bold fill-N1 s2"><tspan x="334" dy="0">아우구스티누스 · 아퀴나스</tspan><tspan x="334" dy="18.5">신학 안에서 다듬은 형이상학과 윤리</tspan></text></g><g ><g class="shape"><path d="M574 646h336v98H574z" class="stroke-B1 fill-B5 s0"/></g><text x="742" y="684.5" class="text-bold fill-N1 s2"><tspan x="742" dy="0">보편자 논쟁</tspan><tspan x="742" dy="17.667">실재론과 유명론이 여기서 갈린다</tspan><tspan x="742" dy="17.667">(10장)</tspan></text></g><g ><g class="shape"><path d="M179 944h329v130H179z" class="stroke-B1 fill-B5 s0"/></g><text x="343.5" y="982.5" class="text-bold fill-N1 s2"><tspan x="343.5" dy="0">대륙 합리론</tspan><tspan x="343.5" dy="17">데카르트 · 스피노자 · 라이프니츠</tspan><tspan x="343.5" dy="17">지식의 뿌리를 이성에 둔다</tspan><tspan x="343.5" dy="17">(7장 꿈 논증, 11장 가능세계,</tspan><tspan x="343.5" dy="17">14장 실체 이원론)</tspan></text></g><g ><g class="shape"><path d="M568 952h349v114H568z" class="stroke-B1 fill-B5 s0"/></g><text x="742.5" y="990.5" class="text-bold fill-N1 s2"><tspan x="742.5" dy="0">영국 경험론</tspan><tspan x="742.5" dy="17.25">로크 · 버클리 · 흄</tspan><tspan x="742.5" dy="17.25">지식의 뿌리를 경험에 둔다</tspan><tspan x="742.5" dy="17.25">(8장 귀납, 11장 인과, 13장 기억 기준)</tspan></text></g><g ><g class="shape"><path d="M583 1274h318v130H583z" class="stroke-B1 fill-B5 s0"/></g><text x="742" y="1312.5" class="text-bold fill-N1 s2"><tspan x="742" dy="0">이마누엘 칸트</tspan><tspan x="742" dy="17">두 흐름을 한데 놓으려 한 시도.</tspan><tspan x="742" dy="17">선험적/후험적 구분과 의무론이</tspan><tspan x="742" dy="17">이 문서에 남았다</tspan><tspan x="742" dy="17">(11장, 18장)</tspan></text></g><g ><g class="shape"><path d="M247 1614h293v98H247z" class="stroke-B1 fill-B5 s0"/></g><text x="393.5" y="1652.5" class="text-bold fill-N1 s2"><tspan x="393.5" dy="0">벤담 · 밀</tspan><tspan x="393.5" dy="17.667">공리주의를 이론으로 세운다</tspan><tspan x="393.5" dy="17.667">(18·19장)</tspan></text></g><g ><g class="shape"><path d="M580 1614h316v98H580z" class="stroke-B1 fill-B5 s0"/></g><text x="738" y="1652.5" class="text-bold fill-N1 s2"><tspan x="738" dy="0">프레게</tspan><tspan x="738" dy="17.667">현대 논리학과 언어철학의 출발</tspan><tspan x="738" dy="17.667">(16장 뜻과 지시체)</tspan></text></g><g ><g class="shape"><path d="M936 1614h302v98H936z" class="stroke-B2 fill-B5 s3"/></g><text x="1087" y="1660.5" class="text-bold fill-N1 s2"><tspan x="1087" dy="0">헤겔 · 마르크스 · 니체</tspan><tspan x="1087" dy="18.5">이 문서가 다루지 않는 큰 흐름</tspan></text></g><g ><g class="shape"><path d="M69 1982h383v98H69z" class="stroke-B1 fill-B5 s0"/></g><text x="260.5" y="2020.5" class="text-bold fill-N1 s2"><tspan x="260.5" dy="0">러셀 · 비트겐슈타인 · 카르납</tspan><tspan x="260.5" dy="17.667">언어와 논리를 통해 문제를 다시 세운다</tspan><tspan x="260.5" dy="17.667">(16장)</tspan></text></g><g ><g class="shape"><path d="M69 2120h383v98H69z" class="stroke-B1 fill-B5 s0"/></g><text x="260.5" y="2158.5" class="text-bold fill-N1 s2"><tspan x="260.5" dy="0">인식론 · 과학철학</tspan><tspan x="260.5" dy="17.667">게티어 · 굿맨 · 포퍼 · 쿤</tspan><tspan x="260.5" dy="17.667">(5·8·9장)</tspan></text></g><g ><g class="shape"><path d="M69 2258h383v98H69z" class="stroke-B1 fill-B5 s0"/></g><text x="260.5" y="2296.5" class="text-bold fill-N1 s2"><tspan x="260.5" dy="0">형이상학 · 언어</tspan><tspan x="260.5" dy="17.667">콰인 · 크립키 · 퍼트넘 · 그라이스</tspan><tspan x="260.5" dy="17.667">(10·11·16장)</tspan></text></g><g ><g class="shape"><path d="M492 1982h247v167H492z" class="stroke-B1 fill-B5 s0"/></g><text x="615.5" y="2055" class="text-bold fill-N1 s2"><tspan x="615.5" dy="0">심리철학 · 인격</tspan><tspan x="615.5" dy="17.667">설 · 파핏 · 차머스</tspan><tspan x="615.5" dy="17.667">(13·14·15장)</tspan></text></g><g ><g class="shape"><path d="M492 2189h247v167H492z" class="stroke-B1 fill-B5 s0"/></g><text x="615.5" y="2254" class="text-bold fill-N1 s2"><tspan x="615.5" dy="0">윤리 · 정치</tspan><tspan x="615.5" dy="17.25">앤스컴 · 풋 · 톰슨 · 싱어 ·</tspan><tspan x="615.5" dy="17.25">롤스 · 노직 · 벌린</tspan><tspan x="615.5" dy="17.25">(18·19·20장)</tspan></text></g><g ><g class="shape"><path d="M889 2104h381v130H889z" class="stroke-B2 fill-B5 s3"/></g><text x="1079.5" y="2142.5" class="text-bold fill-N1 s2"><tspan x="1079.5" dy="0">후설 · 하이데거 · 메를로퐁티 · 사르트르</tspan><tspan x="1079.5" dy="17">의식에 나타나는 그대로를 기술하는</tspan><tspan x="1079.5" dy="17">데서 시작한다.</tspan><tspan x="1079.5" dy="17">이 문서는 이 흐름을 본격적으로</tspan><tspan x="1079.5" dy="17">다루지 않는다</tspan></text></g><marker id="mk-d2-1873768083-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1873768083-3488378134)" d="M742 180v93" class="connection stroke-B1 s0" mask="url(#d2-1873768083)"/><path fill="none" marker-end="url(#mk-d2-1873768083-3488378134)" d="M742 478v134" class="connection stroke-B1 s0" mask="url(#d2-1873768083)"/><path fill="none" marker-end="url(#mk-d2-1873768083-3488378134)" d="M742 776v93" class="connection stroke-B1 s0" mask="url(#d2-1873768083)"/><path fill="none" marker-end="url(#mk-d2-1873768083-3488378134)" d="M742 1106v93" class="connection stroke-B1 s0" mask="url(#d2-1873768083)"/><path fill="none" marker-end="url(#mk-d2-1873768083-3488378134)" d="M742 1436v114" class="connection stroke-B1 s0" mask="url(#d2-1873768083)"/><path fill="none" marker-end="url(#mk-d2-1873768083-3488378134)" d="M508.691 1772.853C425.7 1812 404.5 1882 404.5 1918" class="connection stroke-B1 s0" mask="url(#d2-1873768083)"/><path fill="none" marker-end="url(#mk-d2-1873768083-3488378134)" d="M975.309 1772.853C1058.3 1812 1079.5 1864.2 1079.5 2029" class="connection stroke-B1 s0" mask="url(#d2-1873768083)"/><mask id="d2-1873768083" width="1502" height="2937" x="-101" y="-121" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-121h1502v2937H-101z"/></mask></svg>