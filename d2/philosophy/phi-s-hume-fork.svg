<svg xmlns="http://www.w3.org/2000/svg" width="1246" height="930" class="d2-1751895154 d2-svg" viewBox="-101 -101 1246 930"><rect width="1246" height="930" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1751895154 .fill-N1{fill:#0a0f25}.d2-1751895154 .fill-N2{fill:#676c7e}.d2-1751895154 .fill-B6{fill:#f7f8fe}.d2-1751895154 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="568.5" cy="79" class="shape stroke-B1 fill-B6 s0" rx="237.5" ry="79"/></g><text x="568.5" y="76.5" class="text-bold fill-N1 s1"><tspan x="568.5" dy="0">귀납을 정당화하는 논증이 있다면</tspan><tspan x="568.5" dy="18.5">그 논증은 어느 종류인가</tspan></text></g><g ><g class="shape"><path d="M209 258h168v66H209z" class="stroke-B1 fill-B6 s0"/></g><text x="293" y="296.5" class="text-bold fill-N1 s1">연역 논증이다</text></g><g ><g class="shape"><path d="M761 258h168v66H761z" class="stroke-B1 fill-B6 s0"/></g><text x="845" y="296.5" class="text-bold fill-N1 s1">귀납 논증이다</text></g><g ><g class="shape"><path d="M0 445h585v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="292.5" y="483.5" class="text-bold fill-N1 s1"><tspan x="292.5" dy="0">전제가 참이면 결론이 반드시 참이어야 한다.</tspan><tspan x="292.5" dy="17.25">그런데 ‘지금까지 그랬다’ 가 참이면서</tspan><tspan x="292.5" dy="17.25">‘앞으로도 그렇다’ 가 거짓인 상황을 모순 없이 상상할 수 있다.</tspan><tspan x="292.5" dy="17.25">반례가 있으니 부당하다</tspan></text></g><g ><g class="shape"><path d="M645 445h399v114H645z" class="stroke-B1 fill-B6 s0"/></g><text x="844.5" y="483.5" class="text-bold fill-N1 s1"><tspan x="844.5" dy="0">‘귀납은 지금까지 잘 통했다.</tspan><tspan x="844.5" dy="17.25">그러므로 앞으로도 통할 것이다’ 가 된다.</tspan><tspan x="844.5" dy="17.25">그런데 이 논증 자체가 귀납이다.</tspan><tspan x="844.5" dy="17.25">보이려던 것을 이미 쓴 셈이다</tspan></text></g><g ><g class="shape"><path d="m425 659-144 34 144 35h287l144-35-144-34Z" class="stroke-B1" style="fill:#dee1eb;stroke-width:2"/></g><text x="568.5" y="699" class="text-bold fill-N1 s1">귀납을 정당화하는 순환 없는 논증은 없다</text></g><marker id="mk-d2-1751895154-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1751895154-3488378134)" d="M429.19 143.85C320.2 195 292.5 218 292.5 254" class="connection stroke-B1 s0" mask="url(#d2-1751895154)"/><path fill="none" marker-end="url(#mk-d2-1751895154-3488378134)" d="M707.81 143.85C816.8 195 844.5 218 844.5 254" class="connection stroke-B1 s0" mask="url(#d2-1751895154)"/><path fill="none" marker-end="url(#mk-d2-1751895154-3488378134)" d="M292.5 325.5v116" class="connection stroke-B1 s0" mask="url(#d2-1751895154)"/><text x="293" y="390" class="text-italic fill-N2 s1">그러면</text><path fill="none" marker-end="url(#mk-d2-1751895154-3488378134)" d="M844.5 325.5v116" class="connection stroke-B1 s0" mask="url(#d2-1751895154)"/><text x="845" y="390" class="text-italic fill-N2 s1">그러면</text><path fill="none" marker-end="url(#mk-d2-1751895154-3488378134)" d="M292.5 561c0 38 32.5 58 158.677 96.824" class="connection stroke-B1 s0" mask="url(#d2-1751895154)"/><path fill="none" marker-end="url(#mk-d2-1751895154-3488378134)" d="M844.5 561c0 38-32.5 58-158.677 96.824" class="connection stroke-B1 s0" mask="url(#d2-1751895154)"/><mask id="d2-1751895154" width="1246" height="930" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1246v930H-101z"/><path d="M262 374h62v21h-62zM814 374h62v21h-62z"/></mask></svg>