<svg xmlns="http://www.w3.org/2000/svg" width="1399" height="1766" class="d2-2965115850 d2-svg" viewBox="-101 -101 1399 1766"><rect width="1399" height="1766" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2965115850 .text-bold{font-weight:700}.d2-2965115850 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2965115850 .fill-N1{fill:#0a0f25}.d2-2965115850 .fill-N2{fill:#676c7e}.d2-2965115850 .fill-B6{fill:#f7f8fe}.d2-2965115850 .stroke-B1,.d2-2965115850 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="613.5" cy="85.5" class="shape stroke-B1 fill-B6 s0" rx="256.5" ry="85.5"/></g><text x="613.5" y="75" class="text-bold fill-N1 s1"><tspan x="613.5" dy="0">왜 국가에 복종해야 하는가</tspan><tspan x="613.5" dy="17.667">총을 든 사람에게 지갑을 내주는 것과</tspan><tspan x="613.5" dy="17.667">세금을 내는 것은 어떻게 다른가</tspan></text></g><g ><g class="shape"><path d="M468 292h290v146H468z" class="stroke-B1 fill-B6 s0"/></g><text x="613" y="330.5" class="text-bold fill-N1 s1"><tspan x="613" dy="0">사회계약이라는 장치</tspan><tspan x="613" dy="16.833">① 국가가 없는 상태를 그린다</tspan><tspan x="613" dy="16.833">② 거기 있는 사람들이 무엇에</tspan><tspan x="613" dy="16.833">동의할지 묻는다</tspan><tspan x="613" dy="16.833">③ 동의했을 것에서 국가의</tspan><tspan x="613" dy="16.833">권한을 끌어낸다</tspan></text></g><g ><g class="shape"><path d="M0 538h359v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="179.5" y="576.5" class="text-bold fill-N1 s1"><tspan x="179.5" dy="0">홉스</tspan><tspan x="179.5" dy="17.25">자연 상태 = 만인의 만인에 대한 투쟁.</tspan><tspan x="179.5" dy="17.25">심판도 집행자도 없어 서로를</tspan><tspan x="179.5" dy="17.25">먼저 치는 것이 합리적이다</tspan></text></g><g ><g class="shape"><path d="M419 538h388v114H419z" class="stroke-B1 fill-B6 s0"/></g><text x="613" y="576.5" class="text-bold fill-N1 s1"><tspan x="613" dy="0">로크</tspan><tspan x="613" dy="17.25">자연 상태에 이미 자연법과 권리가 있다.</tspan><tspan x="613" dy="17.25">없는 것은 확립된 법 · 공평한</tspan><tspan x="613" dy="17.25">재판관 · 집행력 셋뿐이다</tspan></text></g><g ><g class="shape"><path d="M867 538h324v114H867z" class="stroke-B1 fill-B6 s0"/></g><text x="1029" y="576.5" class="text-bold fill-N1 s1"><tspan x="1029" dy="0">루소</tspan><tspan x="1029" dy="17.25">자연 상태 자체는 나쁘지 않았다.</tspan><tspan x="1029" dy="17.25">사람을 묶은 것은 사회가</tspan><tspan x="1029" dy="17.25">만든 의존과 비교다</tspan></text></g><g ><g class="shape"><path d="M1 768h357v114H1z" class="stroke-B2 fill-B6 s2"/></g><text x="179.5" y="806.5" class="text-bold fill-N1 s1"><tspan x="179.5" dy="0">정당화되는 것 — 거스를 수 없는 주권</tspan><tspan x="179.5" dy="17.25">각자 자기를 지킬 권리만 남기고</tspan><tspan x="179.5" dy="17.25">판단할 권리를 통째로 넘긴다.</tspan><tspan x="179.5" dy="17.25">저항권은 없다</tspan></text></g><g ><g class="shape"><path d="M445 776h336v98H445z" class="stroke-B2 fill-B6 s2"/></g><text x="613" y="814.5" class="text-bold fill-N1 s1"><tspan x="613" dy="0">정당화되는 것 — 제한된 정부</tspan><tspan x="613" dy="17.667">권력은 신탁이다. 신탁을 어기면</tspan><tspan x="613" dy="17.667">인민에게 저항할 권리가 돌아온다</tspan></text></g><g ><g class="shape"><path d="M861 752h336v146H861z" class="stroke-B2 fill-B6 s2"/></g><text x="1029" y="790.5" class="text-bold fill-N1 s1"><tspan x="1029" dy="0">정당화되는 것 — 일반의지에</tspan><tspan x="1029" dy="16.833">따르는 공화국</tspan><tspan x="1029" dy="16.833">각자가 전부를 내놓고 시민으로서</tspan><tspan x="1029" dy="16.833">자신에게 복종한다.</tspan><tspan x="1029" dy="16.833">일반의지는 전체의 의지가 아니라</tspan><tspan x="1029" dy="16.833">공동의 이익을 향한 의지다</tspan></text></g><g ><g class="shape"><path d="M429 998h369v114H429z" class="stroke-B1 fill-B6 s0"/></g><text x="613.5" y="1036.5" class="text-bold fill-N1 s1"><tspan x="613.5" dy="0">그런데 아무도 계약한 적이 없다</tspan><tspan x="613.5" dy="17.25">명시적 동의를 한 사람은 사실상 없고,</tspan><tspan x="613.5" dy="17.25">묵시적 동의는 떠날 수 없는</tspan><tspan x="613.5" dy="17.25">사람에게서도 읽어낸다</tspan></text></g><g ><g class="shape"><path d="M440 1233h347v146H440z" class="stroke-B1 fill-B6 s0"/></g><text x="613.5" y="1271.5" class="text-bold fill-N1 s1"><tspan x="613.5" dy="0">계약이 가설적 장치로 바뀐다</tspan><tspan x="613.5" dy="16.833">‘실제로 동의했다’ 가 아니라</tspan><tspan x="613.5" dy="16.833">‘공정하게 놓인 사람이라면 동의할</tspan><tspan x="613.5" dy="16.833">원칙은 무엇인가’ 로</tspan><tspan x="613.5" dy="16.833">물음이 옮겨 간다.</tspan><tspan x="613.5" dy="16.833">롤스의 원초적 입장이 그 자리다</tspan></text></g><text x="613.5" y="1495" class="fill-N1 s1"><tspan x="613.5" dy="0">세 사람의 결론이 갈리는 이유는 논증의 짜임이</tspan><tspan x="613.5" dy="17">아니라 자연 상태를 그린 방식에 있다.</tspan><tspan x="613.5" dy="17">무엇이 없어서 문제인지가 정해지면 무엇을 세워야 하는지도 거의 정해진다.</tspan><tspan x="613.5" dy="17">그래서 자연 상태의 서술은 사실 보고가 아니라 ‘국가가</tspan><tspan x="613.5" dy="17">하는 일이 무엇인가’ 에 대한 주장이다</tspan></text><marker id="mk-d2-2965115850-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M613 173v115.5" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><text x="613" y="237" class="text-italic fill-N2 s1">표준 답의 뼈대</text><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M466.576 406.546C237.299 471.6 179.5 498 179.5 534" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M613 440v94" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M759.918 408.566C974.8 472 1029 498 1029 534" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M179.5 654v110" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M613 654v118" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M1029 654v94" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M179.5 884c0 50.8 49.8 76.292 245.117 124.501" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M613 876v118" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M1029 900c0 38-46.2 59.8-227.124 106.01" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><path fill="none" marker-end="url(#mk-d2-2965115850-3488378134)" d="M613 1113.5v116" class="connection stroke-B1 s0" mask="url(#d2-2965115850)"/><text x="613.5" y="1178" class="text-italic fill-N2 s1">물음을 바꾼다</text><mask id="d2-2965115850" width="1399" height="1766" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1399v1766H-101z"/><path d="M550 221h126v21H550zM552 1162h123v21H552z"/></mask></svg>