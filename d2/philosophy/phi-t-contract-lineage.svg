<svg xmlns="http://www.w3.org/2000/svg" width="4600" height="616" class="d2-891227219 d2-svg" viewBox="-101 -101 4600 616"><rect width="4600" height="616" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-891227219 .fill-N1{fill:#0a0f25}.d2-891227219 .fill-N2{fill:#676c7e}.d2-891227219 .fill-B6{fill:#f7f8fe}.d2-891227219 .stroke-B1,.d2-891227219 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="394.5" cy="207.5" class="shape stroke-B1 fill-B6 s0" rx="256.5" ry="85.5"/></g><text x="394.5" y="197" class="text-bold fill-N1 s1"><tspan x="394.5" dy="0">왜 국가에 복종해야 하는가</tspan><tspan x="394.5" dy="17.667">총을 든 사람에게 지갑을 내주는 것과</tspan><tspan x="394.5" dy="17.667">세금을 내는 것은 어떻게 다른가</tspan></text></g><g ><g class="shape"><path d="M1072 150h438v114h-438z" class="stroke-B1 fill-B6 s0"/></g><text x="1291" y="188.5" class="text-bold fill-N1 s1"><tspan x="1291" dy="0">사회계약이라는 장치</tspan><tspan x="1291" dy="17.25">① 국가가 없는 상태를 그린다</tspan><tspan x="1291" dy="17.25">② 거기 있는 사람들이 무엇에 동의할지 묻는다</tspan><tspan x="1291" dy="17.25">③ 동의했을 것에서 국가의 권한을 끌어낸다</tspan></text></g><g ><g class="shape"><path d="M1672 0h531v98h-531z" class="stroke-B1 fill-B6 s0"/></g><text x="1937.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1937.5" dy="0">홉스</tspan><tspan x="1937.5" dy="17.667">자연 상태 = 만인의 만인에 대한 투쟁.</tspan><tspan x="1937.5" dy="17.667">심판도 집행자도 없어 서로를 먼저 치는 것이 합리적이다</tspan></text></g><g ><g class="shape"><path d="M1684 158h507v98h-507z" class="stroke-B1 fill-B6 s0"/></g><text x="1937.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="1937.5" dy="0">로크</tspan><tspan x="1937.5" dy="17.667">자연 상태에 이미 자연법과 권리가 있다.</tspan><tspan x="1937.5" dy="17.667">없는 것은 확립된 법 · 공평한 재판관 · 집행력 셋뿐이다</tspan></text></g><g ><g class="shape"><path d="M1724 316h427v98h-427z" class="stroke-B1 fill-B6 s0"/></g><text x="1937.5" y="354.5" class="text-bold fill-N1 s1"><tspan x="1937.5" dy="0">루소</tspan><tspan x="1937.5" dy="17.667">자연 상태 자체는 나쁘지 않았다.</tspan><tspan x="1937.5" dy="17.667">사람을 묶은 것은 사회가 만든 의존과 비교다</tspan></text></g><g ><g class="shape"><path d="M2437 0h428v98h-428z" class="stroke-B2 fill-B6 s2"/></g><text x="2651" y="38.5" class="text-bold fill-N1 s1"><tspan x="2651" dy="0">정당화되는 것 — 거스를 수 없는 주권</tspan><tspan x="2651" dy="17.667">각자 자기를 지킬 권리만 남기고</tspan><tspan x="2651" dy="17.667">판단할 권리를 통째로 넘긴다. 저항권은 없다</tspan></text></g><g ><g class="shape"><path d="M2483 158h336v98h-336z" class="stroke-B2 fill-B6 s2"/></g><text x="2651" y="196.5" class="text-bold fill-N1 s1"><tspan x="2651" dy="0">정당화되는 것 — 제한된 정부</tspan><tspan x="2651" dy="17.667">권력은 신탁이다. 신탁을 어기면</tspan><tspan x="2651" dy="17.667">인민에게 저항할 권리가 돌아온다</tspan></text></g><g ><g class="shape"><path d="M2365 316h572v98h-572z" class="stroke-B2 fill-B6 s2"/></g><text x="2651" y="354.5" class="text-bold fill-N1 s1"><tspan x="2651" dy="0">정당화되는 것 — 일반의지에 따르는 공화국</tspan><tspan x="2651" dy="17.667">각자가 전부를 내놓고 시민으로서 자신에게 복종한다.</tspan><tspan x="2651" dy="17.667">일반의지는 전체의 의지가 아니라 공동의 이익을 향한 의지다</tspan></text></g><g ><g class="shape"><path d="M3099 79h488v98h-488z" class="stroke-B1 fill-B6 s0"/></g><text x="3343" y="117.5" class="text-bold fill-N1 s1"><tspan x="3343" dy="0">그런데 아무도 계약한 적이 없다</tspan><tspan x="3343" dy="17.667">명시적 동의를 한 사람은 사실상 없고,</tspan><tspan x="3343" dy="17.667">묵시적 동의는 떠날 수 없는 사람에게서도 읽어낸다</tspan></text></g><g ><g class="shape"><path d="M3868 71h530v114h-530z" class="stroke-B1 fill-B6 s0"/></g><text x="4133" y="109.5" class="text-bold fill-N1 s1"><tspan x="4133" dy="0">계약이 가설적 장치로 바뀐다</tspan><tspan x="4133" dy="17.25">‘실제로 동의했다’ 가 아니라</tspan><tspan x="4133" dy="17.25">‘공정하게 놓인 사람이라면 동의할 원칙은 무엇인가’ 로</tspan><tspan x="4133" dy="17.25">물음이 옮겨 간다. 롤스의 원초적 입장이 그 자리다</tspan></text></g><text x="394" y="369" class="fill-N1 s1"><tspan x="394" dy="0">세 사람의 결론이 갈리는 이유는 논증의 짜임이 아니라 자연 상태를 그린 방식에 있다.</tspan><tspan x="394" dy="17.667">무엇이 없어서 문제인지가 정해지면 무엇을 세워야 하는지도 거의 정해진다.</tspan><tspan x="394" dy="17.667">그래서 자연 상태의 서술은 사실 보고가 아니라 ‘국가가 하는 일이 무엇인가’ 에 대한 주장이다</tspan></text><marker id="mk-d2-891227219-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M653 207h415" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><text x="862" y="213" class="text-italic fill-N2 s1">표준 답의 뼈대</text><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M1400.77 149.069C1552.6 69.199 1607.2 49 1668 49" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M1512 207h168" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M1400.77 264.931C1552.6 344.8 1617.6 365 1720 365" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M2205 49h228" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M2193 207h286" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M2153 365h208" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M2867 49c120.4 0 175.6 6 270.114 29.052" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M2821 207c157.2 0 221.6-6 316.114-29.052" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M2939 365c62.8 0 130.6-37.6 333.767-185.644" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><path fill="none" marker-end="url(#mk-d2-891227219-3488378134)" d="M3588.5 128h276" class="connection stroke-B1 s0" mask="url(#d2-891227219)"/><text x="3727.5" y="134" class="text-italic fill-N2 s1">물음을 바꾼다</text><mask id="d2-891227219" width="4600" height="616" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h4600v616H-101z"/><path d="M799 197h126v21H799zM3666 118h123v21h-123z"/></mask></svg>