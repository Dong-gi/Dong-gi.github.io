<svg xmlns="http://www.w3.org/2000/svg" width="2189" height="792" class="d2-1305935551 d2-svg" viewBox="-101 -101 2189 792"><rect width="2189" height="792" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1305935551 .fill-N1{fill:#0a0f25}.d2-1305935551 .fill-B6{fill:#f7f8fe}.d2-1305935551 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="361.5" cy="288" class="shape stroke-B1 fill-B6 s0" rx="227.5" ry="76"/></g><text x="361.5" y="277.5" class="text-bold fill-N1 s1"><tspan x="361.5" dy="0">이 장이 세운 것</tspan><tspan x="361.5" dy="17.667">인격 동일성의 기준은 미결이고,</tspan><tspan x="361.5" dy="17.667">심리 연속성은 정도의 문제다</tspan></text></g><g ><g class="shape"><path d="M1000 164h491v98h-491z" class="stroke-B1 fill-B6 s0"/></g><text x="1245.5" y="202.5" class="text-bold fill-N1 s1"><tspan x="1245.5" dy="0">처벌과 응보</tspan><tspan x="1245.5" dy="17.667">오래전 범죄를 저지른 사람과 지금의 그 사람 사이에</tspan><tspan x="1245.5" dy="17.667">심리 연결이 거의 남지 않았다면 무엇이 달라지는가</tspan></text></g><g ><g class="shape"><path d="M980 0h531v98H980z" class="stroke-B1 fill-B6 s0"/></g><text x="1245.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1245.5" dy="0">미래의 나에 대한 배려</tspan><tspan x="1245.5" dy="17.667">왜 남의 고통보다 내일의 내 고통을 더 걱정하는가.</tspan><tspan x="1245.5" dy="17.667">연속성이 정도의 문제라면 그 근거도 정도의 문제가 된다</tspan></text></g><g ><g class="shape"><path d="M956 332h578v82H956z" class="stroke-B1 fill-B6 s0"/></g><text x="1245" y="370.5" class="text-bold fill-N1 s1"><tspan x="1245" dy="0">약속과 책무</tspan><tspan x="1245" dy="18.5">어제의 내가 한 약속을 오늘의 내가 지고 있는 이유는 무엇인가</tspan></text></g><text x="361" y="440" class="fill-N1 s1"><tspan x="361" dy="0">주의 — 여기서 나오는 것은 결론이 아니라 물음이다.</tspan><tspan x="361" dy="17.667">연속성이 약하다는 사실에서 ‘처벌하지 말라’ 는 결론이 곧바로 나오지 않는다.</tspan><tspan x="361" dy="17.667">사실에서 당위로 건너가는 데는 따로 논증이 필요하고, 그 논증을 다루는 것이 17장이다</tspan></text><g ><g class="shape"><path d="M1030 474h430v98h-430z" class="stroke-B1 fill-B6 s0"/></g><text x="1245" y="512.5" class="text-bold fill-N1 s1"><tspan x="1245" dy="0">12장</tspan><tspan x="1245" dy="17.667">반응적 태도는 사람을 향한다.</tspan><tspan x="1245" dy="17.667">그 사람이 계속 그 사람인가를 이 장이 묻는다</tspan></text></g><g ><g class="shape"><path d="M1671 10h316v98h-316z" class="stroke-B1 fill-B6 s0"/></g><text x="1829" y="48.5" class="text-bold fill-N1 s1"><tspan x="1829" dy="0">18장</tspan><tspan x="1829" dy="17.667">무엇을 해야 하는가 — 세 이론.</tspan><tspan x="1829" dy="17.667">처벌과 배려를 이론으로 받는다</tspan></text></g><g ><g class="shape"><path d="M1702 182h255v82h-255z" class="stroke-B1 fill-B6 s0"/></g><text x="1829.5" y="220.5" class="text-bold fill-N1 s1"><tspan x="1829.5" dy="0">19장</tspan><tspan x="1829.5" dy="18.5">이론을 사례에 대어 보기</tspan></text></g><g ><g class="shape"><path d="M1671 324h316v98h-316z" class="stroke-B1 fill-B6 s0"/></g><text x="1829" y="362.5" class="text-bold fill-N1 s1"><tspan x="1829" dy="0">20장</tspan><tspan x="1829" dy="17.667">정의와 국가.</tspan><tspan x="1829" dy="17.667">분배를 누구들 사이에서 하는가</tspan></text></g><text x="361.5" y="553" class="fill-N1 s1"><tspan x="361.5" dy="0">이 장은 윤리 이론의 이름을 정의하지 않는다.</tspan><tspan x="361.5" dy="17.667">무엇이 옳은 처벌인지, 남의 고통을 얼마나 무겁게 볼 것인지는</tspan><tspan x="361.5" dy="17.667">17·18장의 몫이고, 이 장은 그 물음이 인격 동일성에 걸려 있다는 것까지만 보인다</tspan></text><marker id="mk-d2-1305935551-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1305935551-3488378134)" d="M568.977 254.695C784.6 221.4 871.1 213 995.5 213" class="connection stroke-B1 s0" mask="url(#d2-1305935551)"/><path fill="none" marker-end="url(#mk-d2-1305935551-3488378134)" d="M489.788 224.104C768.8 84.199 867.1 49 975.5 49" class="connection stroke-B1 s0" mask="url(#d2-1305935551)"/><path fill="none" marker-end="url(#mk-d2-1305935551-3488378134)" d="M563.97 324.348C783.6 363.2 862.4 373 952 373" class="connection stroke-B1 s0" mask="url(#d2-1305935551)"/><path fill="none" marker-end="url(#mk-d2-1305935551-3488378134)" d="M1480.457 163.59C1577.7 143.2 1619.7 132 1684.723 109.317" class="connection stroke-B1 s0" mask="url(#d2-1305935551)"/><path fill="none" marker-end="url(#mk-d2-1305935551-3488378134)" d="M1513.5 49c70.8 0 102.8.6 154.004 2.826" class="connection stroke-B1 s0" mask="url(#d2-1305935551)"/><path fill="none" marker-end="url(#mk-d2-1305935551-3488378134)" d="M1535.5 373h132" class="connection stroke-B1 s0" mask="url(#d2-1305935551)"/><path fill="none" marker-end="url(#mk-d2-1305935551-3488378134)" d="M1493.5 219.923c86.8 2.45 128.8 3.077 204 3.077" class="connection stroke-B1 s0" mask="url(#d2-1305935551)"/><path fill="none" marker-end="url(#mk-d2-1305935551-3488378134)" d="M490.795 351.882C769 488.6 877.2 523 1026 523" class="connection stroke-B1 s0" mask="url(#d2-1305935551)"/><text x="748.5" y="484" style="fill:#676c7e;text-anchor:middle;font-size:16px">이어받는다</text><mask id="d2-1305935551" width="2189" height="792" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2189v792H-101z"/><path d="M698 468h101v21H698z"/></mask></svg>