<svg xmlns="http://www.w3.org/2000/svg" width="1475" height="1007" class="d2-3815354803 d2-svg" viewBox="-101 -101 1475 1007"><rect width="1475" height="1007" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3815354803 .fill-N1{fill:#0a0f25}.d2-3815354803 .fill-B6{fill:#f7f8fe}.d2-3815354803 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="161.5" cy="346" class="shape stroke-B1 fill-B6 s0" rx="161.5" ry="76"/></g><text x="161.5" y="319.5" class="text-bold fill-N1 s1"><tspan x="161.5" dy="0">이 장이 세운 것</tspan><tspan x="161.5" dy="17">인격 동일성의 기준은</tspan><tspan x="161.5" dy="17">미결이고,</tspan><tspan x="161.5" dy="17">심리 연속성은</tspan><tspan x="161.5" dy="17">정도의 문제다</tspan></text></g><g ><g class="shape"><path d="M560 190h319v130H560z" class="stroke-B1 fill-B6 s0"/></g><text x="719.5" y="228.5" class="text-bold fill-N1 s1"><tspan x="719.5" dy="0">처벌과 응보</tspan><tspan x="719.5" dy="17">오래전 범죄를 저지른 사람과</tspan><tspan x="719.5" dy="17">지금의 그 사람 사이에</tspan><tspan x="719.5" dy="17">심리 연결이 거의 남지 않았다면</tspan><tspan x="719.5" dy="17">무엇이 달라지는가</tspan></text></g><g ><g class="shape"><path d="M557 0h324v130H557z" class="stroke-B1 fill-B6 s0"/></g><text x="719" y="38.5" class="text-bold fill-N1 s1"><tspan x="719" dy="0">미래의 나에 대한 배려</tspan><tspan x="719" dy="17">왜 남의 고통보다</tspan><tspan x="719" dy="17">내일의 내 고통을 더 걱정하는가.</tspan><tspan x="719" dy="17">연속성이 정도의 문제라면</tspan><tspan x="719" dy="17">그 근거도 정도의 문제가 된다</tspan></text></g><g ><g class="shape"><path d="M570 380h299v114H570z" class="stroke-B1 fill-B6 s0"/></g><text x="719.5" y="418.5" class="text-bold fill-N1 s1"><tspan x="719.5" dy="0">약속과 책무</tspan><tspan x="719.5" dy="17.25">어제의 내가 한 약속을</tspan><tspan x="719.5" dy="17.25">오늘의 내가 지고 있는 이유는</tspan><tspan x="719.5" dy="17.25">무엇인가</tspan></text></g><text x="636" y="704" class="fill-N1 s1"><tspan x="636" dy="0">주의 — 여기서 나오는 것은 결론이 아니라 물음이다.</tspan><tspan x="636" dy="16.714">연속성이 약하다는 사실에서 ‘처벌하지 말라’ 는 결론이 곧바로 나오지 않는다.</tspan><tspan x="636" dy="16.714">사실에서 당위로 건너가는 데는 따로 논증이 필요하고, 그 논증을 다루는 것이 17장이다</tspan><tspan x="636" dy="16.714"> </tspan><tspan x="636" dy="16.714">이 장은 윤리 이론의 이름을 정의하지 않는다.</tspan><tspan x="636" dy="16.714">무엇이 옳은 처벌인지, 남의 고통을 얼마나 무겁게 볼 것인지는</tspan><tspan x="636" dy="16.714">17·18장의 몫이고, 이 장은 그 물음이 인격 동일성에 걸려 있다는 것까지만 보인다</tspan></text><g ><g class="shape"><path d="M569 554h301v114H569z" class="stroke-B1 fill-B6 s0"/></g><text x="719.5" y="592.5" class="text-bold fill-N1 s1"><tspan x="719.5" dy="0">12장</tspan><tspan x="719.5" dy="17.25">반응적 태도는 사람을 향한다.</tspan><tspan x="719.5" dy="17.25">그 사람이 계속 그 사람인가를</tspan><tspan x="719.5" dy="17.25">이 장이 묻는다</tspan></text></g><g ><g class="shape"><path d="M1033 10h226v130h-226z" class="stroke-B1 fill-B6 s0"/></g><text x="1146" y="48.5" class="text-bold fill-N1 s1"><tspan x="1146" dy="0">18장</tspan><tspan x="1146" dy="17">무엇을 해야 하는가 —</tspan><tspan x="1146" dy="17">세 이론.</tspan><tspan x="1146" dy="17">처벌과 배려를</tspan><tspan x="1146" dy="17">이론으로 받는다</tspan></text></g><g ><g class="shape"><path d="M1018 226h255v82h-255z" class="stroke-B1 fill-B6 s0"/></g><text x="1145.5" y="264.5" class="text-bold fill-N1 s1"><tspan x="1145.5" dy="0">19장</tspan><tspan x="1145.5" dy="18.5">이론을 사례에 대어 보기</tspan></text></g><g ><g class="shape"><path d="M1020 380h252v114h-252z" class="stroke-B1 fill-B6 s0"/></g><text x="1146" y="418.5" class="text-bold fill-N1 s1"><tspan x="1146" dy="0">20장</tspan><tspan x="1146" dy="17.25">정의와 국가.</tspan><tspan x="1146" dy="17.25">분배를 누구들 사이에서</tspan><tspan x="1146" dy="17.25">하는가</tspan></text></g><marker id="mk-d2-3815354803-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3815354803-3488378134)" d="M295.904 301.387C410.8 264.4 463.9 255 555.5 255" class="connection stroke-B1 s0" mask="url(#d2-3815354803)"/><path fill="none" marker-end="url(#mk-d2-3815354803-3488378134)" d="M231.407 275.58C398 107.398 463.4 65 553 65" class="connection stroke-B1 s0" mask="url(#d2-3815354803)"/><path fill="none" marker-end="url(#mk-d2-3815354803-3488378134)" d="M295.904 390.613C410.8 427.6 465.9 437 565.5 437" class="connection stroke-B1 s0" mask="url(#d2-3815354803)"/><path fill="none" marker-end="url(#mk-d2-3815354803-3488378134)" d="M881.373 195.481c54.127-20.245 84.727-33.527 147.528-63.966" class="connection stroke-B1 s0" mask="url(#d2-3815354803)"/><path fill="none" marker-end="url(#mk-d2-3815354803-3488378134)" d="M882.5 65c53.2 0 83.6.846 146.005 4.03" class="connection stroke-B1 s0" mask="url(#d2-3815354803)"/><path fill="none" marker-end="url(#mk-d2-3815354803-3488378134)" d="M871.5 437h144" class="connection stroke-B1 s0" mask="url(#d2-3815354803)"/><path fill="none" marker-end="url(#mk-d2-3815354803-3488378134)" d="M881.497 263.408C935.5 266.26 963.3 267 1014.5 267" class="connection stroke-B1 s0" mask="url(#d2-3815354803)"/><path fill="none" marker-end="url(#mk-d2-3815354803-3488378134)" d="M234.449 415.379C398.6 571.6 465.7 611 564.5 611" class="connection stroke-B1 s0" mask="url(#d2-3815354803)"/><text x="381.5" y="561" style="fill:#676c7e;text-anchor:middle;font-size:16px">이어받는다</text><mask id="d2-3815354803" width="1475" height="1007" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1475V906H-101z"/><path d="M331 545h101v21H331z"/></mask></svg>