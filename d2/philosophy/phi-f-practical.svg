<svg xmlns="http://www.w3.org/2000/svg" width="1049" height="1105" class="d2-3197657628 d2-svg" viewBox="-89 -89 1049 1105"><rect width="1049" height="1105" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3197657628 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3197657628 .fill-N1{fill:#0a0f25}.d2-3197657628 .fill-B6{fill:#f7f8fe}.d2-3197657628 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="471.5" cy="88" class="shape stroke-B1 fill-B6 s0" rx="161.5" ry="76"/></g><text x="471.5" y="61.5" class="text-bold fill-N1 s1"><tspan x="471.5" dy="0">이 장이 세운 것</tspan><tspan x="471.5" dy="17">인격 동일성의 기준은</tspan><tspan x="471.5" dy="17">미결이고,</tspan><tspan x="471.5" dy="17">심리 연속성은</tspan><tspan x="471.5" dy="17">정도의 문제다</tspan></text></g><g ><g class="shape"><path d="M26 304h209v178H26z" class="stroke-B1 fill-B6 s0"/></g><text x="130.5" y="342.5" class="text-bold fill-N1 s1"><tspan x="130.5" dy="0">처벌과 응보</tspan><tspan x="130.5" dy="16.625">오래전 범죄를</tspan><tspan x="130.5" dy="16.625">저지른 사람과</tspan><tspan x="130.5" dy="16.625">지금의 그 사람</tspan><tspan x="130.5" dy="16.625">사이에</tspan><tspan x="130.5" dy="16.625">심리 연결이 거의</tspan><tspan x="130.5" dy="16.625">남지 않았다면</tspan><tspan x="130.5" dy="16.625">무엇이 달라지는가</tspan></text></g><g ><g class="shape"><path d="M255 294h212v194H255z" class="stroke-B1 fill-B6 s0"/></g><text x="361" y="332.5" class="text-bold fill-N1 s1"><tspan x="361" dy="0">미래의 나에 대한</tspan><tspan x="361" dy="16.556">배려</tspan><tspan x="361" dy="16.556">왜 남의 고통보다</tspan><tspan x="361" dy="16.556">내일의 내 고통을</tspan><tspan x="361" dy="16.556">더 걱정하는가.</tspan><tspan x="361" dy="16.556">연속성이</tspan><tspan x="361" dy="16.556">정도의 문제라면</tspan><tspan x="361" dy="16.556">그 근거도</tspan><tspan x="361" dy="16.556">정도의 문제가 된다</tspan></text></g><g ><g class="shape"><path d="M487 318h191v146H487z" class="stroke-B1 fill-B6 s0"/></g><text x="582.5" y="356.5" class="text-bold fill-N1 s1"><tspan x="582.5" dy="0">약속과 책무</tspan><tspan x="582.5" dy="16.833">어제의 내가 한</tspan><tspan x="582.5" dy="16.833">약속을</tspan><tspan x="582.5" dy="16.833">오늘의 내가</tspan><tspan x="582.5" dy="16.833">지고 있는 이유는</tspan><tspan x="582.5" dy="16.833">무엇인가</tspan></text></g><text x="435.5" y="750" class="fill-N1 s1"><tspan x="435.5" dy="0">주의 — 여기서 나오는 것은 결론이 아니라 물음이다.</tspan><tspan x="435.5" dy="16.455">연속성이 약하다는 사실에서</tspan><tspan x="435.5" dy="16.455">‘처벌하지 말라’ 는 결론이 곧바로 나오지 않는다.</tspan><tspan x="435.5" dy="16.455">사실에서 당위로 건너가는 데는 따로 논증이 필요하고,</tspan><tspan x="435.5" dy="16.455">그 논증을 다루는 것이 17장이다</tspan><tspan x="435.5" dy="16.455"> </tspan><tspan x="435.5" dy="16.455">이 장은 윤리 이론의 이름을 정의하지 않는다.</tspan><tspan x="435.5" dy="16.455">무엇이 옳은 처벌인지,</tspan><tspan x="435.5" dy="16.455">남의 고통을 얼마나 무겁게 볼 것인지는</tspan><tspan x="435.5" dy="16.455">17·18장의 몫이고, 이 장은 그 물음이</tspan><tspan x="435.5" dy="16.455">인격 동일성에 걸려 있다는 것까지만 보인다</tspan></text><g ><g class="shape"><path d="M686 568h173v146H686z" class="stroke-B1 fill-B6 s0"/></g><text x="772.5" y="606.5" class="text-bold fill-N1 s1"><tspan x="772.5" dy="0">12장</tspan><tspan x="772.5" dy="16.833">반응적 태도는</tspan><tspan x="772.5" dy="16.833">사람을 향한다.</tspan><tspan x="772.5" dy="16.833">그 사람이 계속</tspan><tspan x="772.5" dy="16.833">그 사람인가를</tspan><tspan x="772.5" dy="16.833">이 장이 묻는다</tspan></text></g><g ><g class="shape"><path d="M236 568h188v146H236z" class="stroke-B1 fill-B6 s0"/></g><text x="330" y="606.5" class="text-bold fill-N1 s1"><tspan x="330" dy="0">18장</tspan><tspan x="330" dy="16.833">무엇을 해야</tspan><tspan x="330" dy="16.833">하는가 —</tspan><tspan x="330" dy="16.833">세 이론.</tspan><tspan x="330" dy="16.833">처벌과 배려를</tspan><tspan x="330" dy="16.833">이론으로 받는다</tspan></text></g><g ><g class="shape"><path d="M12 568h168v98H12z" class="stroke-B1 fill-B6 s0"/></g><text x="96" y="606.5" class="text-bold fill-N1 s1"><tspan x="96" dy="0">19장</tspan><tspan x="96" dy="17.667">이론을 사례에</tspan><tspan x="96" dy="17.667">대어 보기</tspan></text></g><g ><g class="shape"><path d="M498 568h168v130H498z" class="stroke-B1 fill-B6 s0"/></g><text x="582" y="606.5" class="text-bold fill-N1 s1"><tspan x="582" dy="0">20장</tspan><tspan x="582" dy="17">정의와 국가.</tspan><tspan x="582" dy="17">분배를 누구들</tspan><tspan x="582" dy="17">사이에서</tspan><tspan x="582" dy="17">하는가</tspan></text></g><marker id="mk-d2-3197657628-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3197657628-3488378134)" d="m375.007 151 .143 43s.033 10-9.967 10h-224.35s-10 0-10 10v87" class="connection stroke-B1 s0" mask="url(#d2-3197657628)"/><path fill="none" marker-end="url(#mk-d2-3197657628-3488378134)" d="m439.997 164-.207 126" class="connection stroke-B1 s0" mask="url(#d2-3197657628)"/><path fill="none" marker-end="url(#mk-d2-3197657628-3488378134)" d="m504.008 164 .333 80s.042 10 10.042 10h58.45s10 0 10 10v50" class="connection stroke-B1 s0" mask="url(#d2-3197657628)"/><path fill="none" marker-end="url(#mk-d2-3197657628-3488378134)" d="M165.666 485v33s0 10 10 10h113s10 0 10 10v26" class="connection stroke-B1 s0" mask="url(#d2-3197657628)"/><path fill="none" marker-end="url(#mk-d2-3197657628-3488378134)" d="M361.333 490v74" class="connection stroke-B1 s0" mask="url(#d2-3197657628)"/><path fill="none" marker-end="url(#mk-d2-3197657628-3488378134)" d="M582.833 466v98" class="connection stroke-B1 s0" mask="url(#d2-3197657628)"/><path fill="none" marker-end="url(#mk-d2-3197657628-3488378134)" d="M96 485v79" class="connection stroke-B1 s0" mask="url(#d2-3197657628)"/><path fill="none" marker-end="url(#mk-d2-3197657628-3488378134)" d="m569 151-.014 43s-.003 10 9.997 10h184.35s10 0 10 10v350" class="connection stroke-B1 s0" mask="url(#d2-3197657628)"/><text x="773.5" y="262" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">이어받는다</text><mask id="d2-3197657628" width="1049" height="1105" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89H960v1105H-89z"/><path d="M723 246h101v21H723z"/></mask></svg>