<svg xmlns="http://www.w3.org/2000/svg" width="4021" height="974" class="d2-2396014247 d2-svg" viewBox="-101 -85 4021 974"><rect width="4021" height="974" x="-101" y="-85" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2396014247 .fill-N1{fill:#0a0f25}.d2-2396014247 .fill-N2{fill:#676c7e}.d2-2396014247 .fill-B5{fill:#edf0fd}.d2-2396014247 .fill-B6{fill:#f7f8fe}.d2-2396014247 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M103 400h340v98H103z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:8,7.892511"/></g><text x="273" y="438.5" class="text-bold fill-N1 s0"><tspan x="273" dy="0">소박한 기술 이론 · 기술 다발</tspan><tspan x="273" dy="17.667">이름의 뜻은 결부된 기술의 뜻이고</tspan><tspan x="273" dy="17.667">그 기술이 지시체를 정한다</tspan></text></g><g ><g class="shape"><ellipse cx="1007" cy="448.5" class="shape stroke-B1 fill-B6 s1" rx="146" ry="48.5"/></g><text x="1007" y="446" class="text-bold fill-N1 s0"><tspan x="1007" dy="0">크립키의 세 논증</tspan><tspan x="1007" dy="18.5">양상 · 인식 · 의미론</tspan></text></g><g ><g class="shape"><path d="M1458 174h466v114h-466z" class="stroke-B1 fill-B6 s1"/></g><text x="1691" y="212.5" class="text-bold fill-N1 s0"><tspan x="1691" dy="0">갈래 1. 직접지시 — 다수설</tspan><tspan x="1691" dy="17.25">이름이 문장에 보태는 것은 대상 자체다.</tspan><tspan x="1691" dy="17.25">이름은 고정지시어이고, 지시체는 기술이 아니라</tspan><tspan x="1691" dy="17.25">화자가 놓인 인과 · 역사적 관계가 정한다</tspan></text></g><g ><g class="shape"><path d="M1416 449h550v130h-550z" class="stroke-B1 fill-B6 s1"/></g><text x="1691" y="487.5" class="text-bold fill-N1 s0"><tspan x="1691" dy="0">갈래 2. 개량된 기술 이론 — 소수설</tspan><tspan x="1691" dy="17">고정화된 기술 — ‘실제로 알렉산더를 가르친 사람’ 은</tspan><tspan x="1691" dy="17">확정 기술이면서 고정지시어다. 양상 논증이 막힌다.</tspan><tspan x="1691" dy="17">사슬을 기술 안에 넣기 — ‘내가 이 이름을 물려받은</tspan><tspan x="1691" dy="17">바로 그 사람’ 도 하나의 기술이다. 의미론 논증까지 막힌다</tspan></text></g><g ><g class="shape"><path d="M1412 639h557v114h-557z" class="stroke-B1 fill-B6 s1"/></g><text x="1690.5" y="677.5" class="text-bold fill-N1 s0"><tspan x="1690.5" dy="0">갈래 3. 이차원 의미론 — 소수설</tspan><tspan x="1690.5" dy="17.25">표현에 두 종류의 뜻을 준다. 하나로는 후험적 필연을,</tspan><tspan x="1690.5" dy="17.25">다른 하나로는 우리가 그 표현을 이해하는 방식을 설명한다.</tspan><tspan x="1690.5" dy="17.25">크립키의 사례를 부정하지 않고 오히려 설명하려는 시도다</tspan></text></g><g ><g class="shape"><path d="M2230 56h1589v190H2230z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="3024.5" y="43" class="fill-N1" style="text-anchor:middle;font-size:28px">인과 · 역사적 그림 — 다수설이 지시체를 설명하는 방식</text></g><text x="2442" y="312" class="fill-N1 s0"><tspan x="2442" dy="0">남은 빚 — 프레게의 세 수수께끼가 다시 열린다.</tspan><tspan x="2442" dy="16.833">특히 대체 실패가 그렇다. 이름이 보태는 것이</tspan><tspan x="2442" dy="16.833">대상뿐이라면 믿음 문맥에서 값이 갈리는 일을</tspan><tspan x="2442" dy="16.833">설명할 길이 없다. 크립키는 대체를 쓰지 않고도</tspan><tspan x="2442" dy="16.833">같은 수수께끼가 생긴다는 것을 보였지만,</tspan><tspan x="2442" dy="16.833">문제가 더 넓다는 것을 보인 것이 푼 것은 아니다</tspan></text><text x="2441.5" y="488" class="fill-N1 s0"><tspan x="2441.5" dy="0">남은 빚 — 크립키는 사슬을 기술 안에 넣는 수를</tspan><tspan x="2441.5" dy="17">예상하고 순환이라고 답했다.</tspan><tspan x="2441.5" dy="17">순환인지에 대해서는 다툼이 있다.</tspan><tspan x="2441.5" dy="17">고정화된 기술 쪽은 인식 논증과 의미론 논증을</tspan><tspan x="2441.5" dy="17">그대로 안고 간다</tspan></text><text x="2441.5" y="686" class="fill-N1 s0"><tspan x="2441.5" dy="0">남은 빚 — 두 종류의 뜻이 각각 무슨 일을 하는지,</tspan><tspan x="2441.5" dy="17.667">둘째 뜻이 결국 기술로 되돌아가는 것은 아닌지가</tspan><tspan x="2441.5" dy="17.667">다투어진다</tspan></text><text x="272.5" y="574" class="fill-N1 s0"><tspan x="272.5" dy="0">이론이 아니라 그림이라고 크립키 자신이 불렀다.</tspan><tspan x="272.5" dy="16.714">필요충분조건을 준 것이 아니기 때문이다.</tspan><tspan x="272.5" dy="16.714">‘마다가스카르’ 는 본래 아프리카 본토의 어느 지역을</tspan><tspan x="272.5" dy="16.714">가리키던 말인데 전달 과정의 착오로 섬을 가리키게 되었고,</tspan><tspan x="272.5" dy="16.714">지금 이 이름이 가리키는 것은 섬이지 사슬 끝의 그 지역이 아니다.</tspan><tspan x="272.5" dy="16.714">사슬을 어떻게 하나로 셀 것인지, ‘이어받으려는 의도’ 를 적을 때</tspan><tspan x="272.5" dy="16.714">기술이 몰래 들어오지는 않는지도 열린 물음이다</tspan></text><text x="272.5" y="751" class="fill-N1 s0"><tspan x="272.5" dy="0">러셀의 확정 기술 분석은 이 다툼에서 살아남는다.</tspan><tspan x="272.5" dy="17.667">크립키가 무너뜨린 것은 이름이 기술이라는 주장이지</tspan><tspan x="272.5" dy="17.667">기술이 한정사 뭉치라는 분석이 아니다</tspan></text><g ><g class="shape"><path d="M2260 110h363v82h-363z" class="stroke-B1 fill-B5 s1"/></g><text x="2441.5" y="148.5" class="text-bold fill-N1 s0"><tspan x="2441.5" dy="0">최초의 명명</tspan><tspan x="2441.5" dy="18.5">어떤 대상에 이름을 처음 붙이는 자리</tspan></text></g><g ><g class="shape"><path d="M2825 102h336v98h-336z" class="stroke-B1 fill-B5 s1"/></g><text x="2993" y="140.5" class="text-bold fill-N1 s0"><tspan x="2993" dy="0">전달의 사슬</tspan><tspan x="2993" dy="17.667">앞 사람이 가리키던 것을 그대로</tspan><tspan x="2993" dy="17.667">가리키려는 의도로 물려받아 쓴다</tspan></text></g><g ><g class="shape"><path d="M3339 86h450v130h-450z" class="stroke-B1 fill-B5 s1"/></g><text x="3564" y="124.5" class="text-bold fill-N1 s0"><tspan x="3564" dy="0">지금의 사용</tspan><tspan x="3564" dy="17">‘괴델’ 에 대해 아무것도 모르는 사람도</tspan><tspan x="3564" dy="17">그 이름으로 괴델을 가리킨다.</tspan><tspan x="3564" dy="17">그를 붙들고 있는 것은 그가 아는 기술이 아니라</tspan><tspan x="3564" dy="17">그가 이어받은 사슬이다</tspan></text></g><marker id="mk-d2-2396014247-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2396014247-3488378134)" d="M445.5 448.75c205.6 0 289.1.05 411.5.244" class="connection stroke-B1 s1" mask="url(#d2-2396014247)"/><text x="652" y="454" class="text-italic fill-N2 s0">여기서 무너진다</text><path fill="none" marker-end="url(#mk-d2-2396014247-3488378134)" d="M1064.57 402.76C1238.6 265.4 1317.5 230.75 1453.5 230.75" class="connection stroke-B1 s1" mask="url(#d2-2396014247)"/><text x="1239.5" y="270" class="text-italic fill-N2 s0">살아 있다</text><path fill="none" marker-end="url(#mk-d2-2396014247-3488378134)" d="M1127.946 477.46C1251.2 506.6 1309.1 514 1411.5 514" class="connection stroke-B1 s1" mask="url(#d2-2396014247)"/><text x="1269.5" y="514" class="text-italic fill-N2 s0">살아 있다</text><path fill="none" marker-end="url(#mk-d2-2396014247-3488378134)" d="M1058.49 495.334C1237.4 655.6 1308.5 696 1408.5 696" class="connection stroke-B1 s1" mask="url(#d2-2396014247)"/><text x="1216.5" y="642" class="text-italic fill-N2 s0">살아 있다</text><path fill="none" marker-end="url(#mk-d2-2396014247-3488378134)" d="M2625 151h196" class="connection stroke-B1 s1" mask="url(#d2-2396014247)"/><path fill="none" marker-end="url(#mk-d2-2396014247-3488378134)" d="M3163 151h172" class="connection stroke-B1 s1" mask="url(#d2-2396014247)"/><path fill="none" marker-end="url(#mk-d2-2396014247-3488378134)" d="M1926.454 179.76C2031.3 156.837 2092.4 151 2226 151" class="connection stroke-B1 s1" mask="url(#d2-2396014247)"/><path fill="none" marker-end="url(#mk-d2-2396014247-3488378134)" d="M1874.905 288.108C2021 334.7 2166.1 346.5 2238.5 346.5" class="connection stroke-B1 s1" mask="url(#d2-2396014247)"/><path fill="none" marker-end="url(#mk-d2-2396014247-3488378134)" d="M1968.5 514H2242" class="connection stroke-B1 s1" mask="url(#d2-2396014247)"/><path fill="none" marker-end="url(#mk-d2-2396014247-3488378134)" d="M1971 696h261" class="connection stroke-B1 s1" mask="url(#d2-2396014247)"/><mask id="d2-2396014247" width="4021" height="974" x="-101" y="-85" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-85h4021v974H-101z"/><path d="M581 438h142v21H581zM1197 254h85v21h-85zM1227 498h85v21h-85zM1174 626h85v21h-85z"/></mask></svg>