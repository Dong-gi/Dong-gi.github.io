<svg xmlns="http://www.w3.org/2000/svg" width="1461" height="2172" class="d2-374128630 d2-svg" viewBox="-84 -101 1461 2172"><rect width="1461" height="2172" x="-84" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-374128630 .fill-N1{fill:#0a0f25}.d2-374128630 .fill-N2{fill:#676c7e}.d2-374128630 .fill-B5{fill:#edf0fd}.d2-374128630 .fill-B6{fill:#f7f8fe}.d2-374128630 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M554 0h340v98H554z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:8,7.892511"/></g><text x="724" y="38.5" class="text-bold fill-N1 s0"><tspan x="724" dy="0">소박한 기술 이론 · 기술 다발</tspan><tspan x="724" dy="17.667">이름의 뜻은 결부된 기술의 뜻이고</tspan><tspan x="724" dy="17.667">그 기술이 지시체를 정한다</tspan></text></g><g ><g class="shape"><ellipse cx="724" cy="267.5" class="shape stroke-B1 fill-B6 s1" rx="146" ry="48.5"/></g><text x="724" y="265" class="text-bold fill-N1 s0"><tspan x="724" dy="0">크립키의 세 논증</tspan><tspan x="724" dy="18.5">양상 · 인식 · 의미론</tspan></text></g><g ><g class="shape"><path d="M107 453h263v162H107z" class="stroke-B1 fill-B6 s1"/></g><text x="238.5" y="491.5" class="text-bold fill-N1 s0"><tspan x="238.5" dy="0">갈래 1. 직접지시 — 다수설</tspan><tspan x="238.5" dy="16.714">이름이 문장에 보태는</tspan><tspan x="238.5" dy="16.714">것은 대상 자체다.</tspan><tspan x="238.5" dy="16.714">이름은 고정지시어이고,</tspan><tspan x="238.5" dy="16.714">지시체는 기술이 아니라</tspan><tspan x="238.5" dy="16.714">화자가 놓인 인과 · 역사적</tspan><tspan x="238.5" dy="16.714">관계가 정한다</tspan></text></g><g ><g class="shape"><path d="M555 437h339v194H555z" class="stroke-B1 fill-B6 s1"/></g><text x="724.5" y="475.5" class="text-bold fill-N1 s0"><tspan x="724.5" dy="0">갈래 2. 개량된 기술 이론 — 소수설</tspan><tspan x="724.5" dy="16.556">고정화된 기술 — ‘실제로</tspan><tspan x="724.5" dy="16.556">알렉산더를 가르친 사람’ 은</tspan><tspan x="724.5" dy="16.556">확정 기술이면서 고정지시어다.</tspan><tspan x="724.5" dy="16.556">양상 논증이 막힌다.</tspan><tspan x="724.5" dy="16.556">사슬을 기술 안에 넣기 — ‘내가</tspan><tspan x="724.5" dy="16.556">이 이름을 물려받은</tspan><tspan x="724.5" dy="16.556">바로 그 사람’ 도 하나의 기술이다.</tspan><tspan x="724.5" dy="16.556">의미론 논증까지 막힌다</tspan></text></g><g ><g class="shape"><path d="M954 453h319v162H954z" class="stroke-B1 fill-B6 s1"/></g><text x="1113.5" y="491.5" class="text-bold fill-N1 s0"><tspan x="1113.5" dy="0">갈래 3. 2차원 의미론 — 소수설</tspan><tspan x="1113.5" dy="16.714">표현에 두 종류의 뜻을 준다.</tspan><tspan x="1113.5" dy="16.714">하나로는 후험적 필연을,</tspan><tspan x="1113.5" dy="16.714">다른 하나로는 우리가 그 표현을</tspan><tspan x="1113.5" dy="16.714">이해하는 방식을 설명한다.</tspan><tspan x="1113.5" dy="16.714">크립키의 사례를 부정하지 않고</tspan><tspan x="1113.5" dy="16.714">오히려 설명하려는 시도다</tspan></text></g><g ><g class="shape"><path d="M27 1034h423v603H27z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="238.5" y="993" class="fill-N1" style="text-anchor:middle;font-size:28px"><tspan x="238.5" dy="0">인과 · 역사적 그림 — 다수설이</tspan><tspan x="238.5" dy="32">지시체를 설명하는 방식</tspan></text></g><text x="346" y="747" class="fill-N1 s0"><tspan x="346" dy="0">남은 빚 — 프레게의 세 수수께끼가</tspan><tspan x="346" dy="16.455">다시 열린다.</tspan><tspan x="346" dy="16.455">특히 대체 실패가 그렇다.</tspan><tspan x="346" dy="16.455">이름이 보태는 것이</tspan><tspan x="346" dy="16.455">대상뿐이라면 믿음 문맥에서</tspan><tspan x="346" dy="16.455">값이 갈리는 일을</tspan><tspan x="346" dy="16.455">설명할 길이 없다.</tspan><tspan x="346" dy="16.455">크립키는 대체를 쓰지 않고도</tspan><tspan x="346" dy="16.455">같은 수수께끼가 생긴다는 것을 보였지만,</tspan><tspan x="346" dy="16.455">문제가 더 넓다는 것을 보인</tspan><tspan x="346" dy="16.455">것이 푼 것은 아니다</tspan></text><text x="724.5" y="779" class="fill-N1 s0"><tspan x="724.5" dy="0">남은 빚 — 크립키는 사슬을</tspan><tspan x="724.5" dy="16.714">기술 안에 넣는 수를</tspan><tspan x="724.5" dy="16.714">예상하고 순환이라고 답했다.</tspan><tspan x="724.5" dy="16.714">순환인지에 대해서는 다툼이 있다.</tspan><tspan x="724.5" dy="16.714">고정화된 기술 쪽은 인식</tspan><tspan x="724.5" dy="16.714">논증과 의미론 논증을</tspan><tspan x="724.5" dy="16.714">그대로 안고 간다</tspan></text><text x="1113.5" y="795" class="fill-N1 s0"><tspan x="1113.5" dy="0">남은 빚 — 두 종류의 뜻이</tspan><tspan x="1113.5" dy="17">각각 무슨 일을 하는지,</tspan><tspan x="1113.5" dy="17">둘째 뜻이 결국 기술로 되돌아가는</tspan><tspan x="1113.5" dy="17">것은 아닌지가</tspan><tspan x="1113.5" dy="17">다투어진다</tspan></text><text x="238.5" y="1773" class="fill-N1 s0"><tspan x="238.5" dy="0">이론이 아니라 그림이라고</tspan><tspan x="238.5" dy="16.385">크립키 자신이 불렀다.</tspan><tspan x="238.5" dy="16.385">필요충분조건을 준 것이 아니기 때문이다.</tspan><tspan x="238.5" dy="16.385">‘마다가스카르’ 는 본래 아프리카</tspan><tspan x="238.5" dy="16.385">본토의 어느 지역을</tspan><tspan x="238.5" dy="16.385">가리키던 말인데 전달 과정의 착오로</tspan><tspan x="238.5" dy="16.385">섬을 가리키게 되었고,</tspan><tspan x="238.5" dy="16.385">지금 이 이름이 가리키는 것은 섬이지</tspan><tspan x="238.5" dy="16.385">사슬 끝의 그 지역이 아니다.</tspan><tspan x="238.5" dy="16.385">사슬을 어떻게 하나로 셀 것인지,</tspan><tspan x="238.5" dy="16.385">‘이어받으려는 의도’ 를 적을 때</tspan><tspan x="238.5" dy="16.385">기술이 몰래 들어오지는 않는지도</tspan><tspan x="238.5" dy="16.385">열린 물음이다</tspan></text><text x="1113" y="1078" class="fill-N1 s0"><tspan x="1113" dy="0">러셀의 확정 기술 분석은 이</tspan><tspan x="1113" dy="17">다툼에서 살아남는다.</tspan><tspan x="1113" dy="17">크립키가 무너뜨린 것은 이름이</tspan><tspan x="1113" dy="17">기술이라는 주장이지</tspan><tspan x="1113" dy="17">기술이 한정사 뭉치라는 분석이 아니다</tspan></text><g ><g class="shape"><path d="M57 1064h363v82H57z" class="stroke-B1 fill-B5 s1"/></g><text x="238.5" y="1102.5" class="text-bold fill-N1 s0"><tspan x="238.5" dy="0">최초의 명명</tspan><tspan x="238.5" dy="18.5">어떤 대상에 이름을 처음 붙이는 자리</tspan></text></g><g ><g class="shape"><path d="M70 1247h336v98H70z" class="stroke-B1 fill-B5 s1"/></g><text x="238" y="1285.5" class="text-bold fill-N1 s0"><tspan x="238" dy="0">전달의 사슬</tspan><tspan x="238" dy="17.667">앞 사람이 가리키던 것을 그대로</tspan><tspan x="238" dy="17.667">가리키려는 의도로 물려받아 쓴다</tspan></text></g><g ><g class="shape"><path d="M88 1445h301v162H88z" class="stroke-B1 fill-B5 s1"/></g><text x="238.5" y="1483.5" class="text-bold fill-N1 s0"><tspan x="238.5" dy="0">지금의 사용</tspan><tspan x="238.5" dy="16.714">‘괴델’ 에 대해 아무것도</tspan><tspan x="238.5" dy="16.714">모르는 사람도</tspan><tspan x="238.5" dy="16.714">그 이름으로 괴델을 가리킨다.</tspan><tspan x="238.5" dy="16.714">그를 붙들고 있는 것은 그가</tspan><tspan x="238.5" dy="16.714">아는 기술이 아니라</tspan><tspan x="238.5" dy="16.714">그가 이어받은 사슬이다</tspan></text></g><marker id="mk-d2-374128630-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-374128630-3488378134)" d="M724.25 99.5c0 46.8-.05 71.1-.233 115.5" class="connection stroke-B1 s1" mask="url(#d2-374128630)"/><text x="724" y="164" class="text-italic fill-N2 s0">여기서 무너진다</text><path fill="none" marker-end="url(#mk-d2-374128630-3488378134)" d="M601.048 295.436C311.2 360.2 238.25 391.9 238.25 449.5" class="connection stroke-B1 s1" mask="url(#d2-374128630)"/><text x="388.5" y="348" class="text-italic fill-N2 s0">살아 있다</text><path fill="none" marker-end="url(#mk-d2-374128630-3488378134)" d="M724.008 318c.192 46.4.242 70.7.242 115.5" class="connection stroke-B1 s1" mask="url(#d2-374128630)"/><text x="724.5" y="382" class="text-italic fill-N2 s0">살아 있다</text><path fill="none" marker-end="url(#mk-d2-374128630-3488378134)" d="M837.926 299.538C1057.8 361 1113.25 391.9 1113.25 449.5" class="connection stroke-B1 s1" mask="url(#d2-374128630)"/><text x="1007.5" y="352" class="text-italic fill-N2 s0">살아 있다</text><path fill="none" marker-end="url(#mk-d2-374128630-3488378134)" d="M238.25 1148v95" class="connection stroke-B1 s1" mask="url(#d2-374128630)"/><path fill="none" marker-end="url(#mk-d2-374128630-3488378134)" d="M238.25 1347v94" class="connection stroke-B1 s1" mask="url(#d2-374128630)"/><path fill="none" marker-end="url(#mk-d2-374128630-3488378134)" d="M177.574 616.617C140.35 667.8 130.75 850.2 130.75 961" class="connection stroke-B1 s1" mask="url(#d2-374128630)"/><path fill="none" marker-end="url(#mk-d2-374128630-3488378134)" d="M298.926 616.617C336.15 667.8 345.75 691 345.75 727" class="connection stroke-B1 s1" mask="url(#d2-374128630)"/><path fill="none" marker-end="url(#mk-d2-374128630-3488378134)" d="M724.25 633v126" class="connection stroke-B1 s1" mask="url(#d2-374128630)"/><path fill="none" marker-end="url(#mk-d2-374128630-3488378134)" d="M1113.25 617v158" class="connection stroke-B1 s1" mask="url(#d2-374128630)"/><mask id="d2-374128630" width="1461" height="2172" x="-84" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-84-101h1461v2172H-84z"/><path d="M653 148h142v21H653zM346 332h85v21h-85zM682 366h85v21h-85zM965 336h85v21h-85z"/></mask></svg>