<svg xmlns="http://www.w3.org/2000/svg" width="1132" height="2377" class="d2-3412385916 d2-svg" viewBox="-89 -89 1132 2377"><rect width="1132" height="2377" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-3412385916 .text-bold{font-weight:700}.d2-3412385916 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3412385916 .fill-N1{fill:#0a0f25}.d2-3412385916 .fill-N2{fill:#676c7e}.d2-3412385916 .fill-B5{fill:#edf0fd}.d2-3412385916 .fill-B6{fill:#f7f8fe}.d2-3412385916 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M371 12h340v98H371z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:8,7.892511"/></g><text x="541" y="50.5" class="text-bold fill-N1 s0"><tspan x="541" dy="0">소박한 기술 이론 · 기술 다발</tspan><tspan x="541" dy="17.667">이름의 뜻은 결부된 기술의 뜻이고</tspan><tspan x="541" dy="17.667">그 기술이 지시체를 정한다</tspan></text></g><g ><g class="shape"><ellipse cx="541" cy="319.5" class="shape stroke-B1 fill-B6 s1" rx="146" ry="48.5"/></g><text x="541" y="317" class="text-bold fill-N1 s0"><tspan x="541" dy="0">크립키의 세 논증</tspan><tspan x="541" dy="18.5">양상 · 인식 · 의미론</tspan></text></g><g ><g class="shape"><path d="M129 613h255v194H129z" class="stroke-B1 fill-B6 s1"/></g><text x="256.5" y="651.5" class="text-bold fill-N1 s0"><tspan x="256.5" dy="0">갈래 1. 직접지시 —</tspan><tspan x="256.5" dy="16.556">다수설</tspan><tspan x="256.5" dy="16.556">이름이 문장에 보태는</tspan><tspan x="256.5" dy="16.556">것은 대상 자체다.</tspan><tspan x="256.5" dy="16.556">이름은 고정지시어이고,</tspan><tspan x="256.5" dy="16.556">지시체는 기술이 아니라</tspan><tspan x="256.5" dy="16.556">화자가 놓인</tspan><tspan x="256.5" dy="16.556">인과 · 역사적</tspan><tspan x="256.5" dy="16.556">관계가 정한다</tspan></text></g><g ><g class="shape"><path d="M413 539h217v306H413z" class="stroke-B1 fill-B6 s1"/></g><text x="521.5" y="577.5" class="text-bold fill-N1 s0"><tspan x="521.5" dy="0">갈래 2. 개량된</tspan><tspan x="521.5" dy="16.313">기술 이론 — 소수설</tspan><tspan x="521.5" dy="16.313">고정화된 기술 —</tspan><tspan x="521.5" dy="16.313">‘실제로</tspan><tspan x="521.5" dy="16.313">알렉산더를</tspan><tspan x="521.5" dy="16.313">가르친 사람’ 은</tspan><tspan x="521.5" dy="16.313">확정 기술이면서</tspan><tspan x="521.5" dy="16.313">고정지시어다.</tspan><tspan x="521.5" dy="16.313">양상 논증이 막힌다.</tspan><tspan x="521.5" dy="16.313">사슬을 기술 안에</tspan><tspan x="521.5" dy="16.313">넣기 — ‘내가</tspan><tspan x="521.5" dy="16.313">이 이름을 물려받은</tspan><tspan x="521.5" dy="16.313">바로 그 사람’ 도</tspan><tspan x="521.5" dy="16.313">하나의 기술이다.</tspan><tspan x="521.5" dy="16.313">의미론 논증까지</tspan><tspan x="521.5" dy="16.313">막힌다</tspan></text></g><g ><g class="shape"><path d="M650 563h258v258H650z" class="stroke-B1 fill-B6 s1"/></g><text x="779" y="601.5" class="text-bold fill-N1 s0"><tspan x="779" dy="0">갈래 3. 2차원 의미론 —</tspan><tspan x="779" dy="16.385">소수설</tspan><tspan x="779" dy="16.385">표현에 두 종류의</tspan><tspan x="779" dy="16.385">뜻을 준다.</tspan><tspan x="779" dy="16.385">하나로는 후험적 필연을,</tspan><tspan x="779" dy="16.385">다른 하나로는</tspan><tspan x="779" dy="16.385">우리가 그 표현을</tspan><tspan x="779" dy="16.385">이해하는 방식을</tspan><tspan x="779" dy="16.385">설명한다.</tspan><tspan x="779" dy="16.385">크립키의 사례를</tspan><tspan x="779" dy="16.385">부정하지 않고</tspan><tspan x="779" dy="16.385">오히려 설명하려는</tspan><tspan x="779" dy="16.385">시도다</tspan></text></g><g ><g class="shape"><path d="M12 1298h489v606H12z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="256.5" y="1331" class="fill-N1" style="text-anchor:middle;font-size:28px"><tspan x="256.5" dy="0">인과 · 역사적 그림 — 다수설이</tspan><tspan x="256.5" dy="32">지시체를 설명하는 방식</tspan></text></g><text x="318" y="941" class="fill-N1 s0"><tspan x="318" dy="0">남은 빚 — 프레게의</tspan><tspan x="318" dy="16.278">세 수수께끼가</tspan><tspan x="318" dy="16.278">다시 열린다.</tspan><tspan x="318" dy="16.278">특히 대체 실패가</tspan><tspan x="318" dy="16.278">그렇다.</tspan><tspan x="318" dy="16.278">이름이 보태는 것이</tspan><tspan x="318" dy="16.278">대상뿐이라면</tspan><tspan x="318" dy="16.278">믿음 문맥에서</tspan><tspan x="318" dy="16.278">값이 갈리는 일을</tspan><tspan x="318" dy="16.278">설명할 길이 없다.</tspan><tspan x="318" dy="16.278">크립키는 대체를</tspan><tspan x="318" dy="16.278">쓰지 않고도</tspan><tspan x="318" dy="16.278">같은 수수께끼가</tspan><tspan x="318" dy="16.278">생긴다는 것을</tspan><tspan x="318" dy="16.278">보였지만,</tspan><tspan x="318" dy="16.278">문제가 더 넓다는</tspan><tspan x="318" dy="16.278">것을 보인</tspan><tspan x="318" dy="16.278">것이 푼 것은 아니다</tspan></text><text x="521.5" y="941" class="fill-N1 s0"><tspan x="521.5" dy="0">남은 빚 — 크립키는</tspan><tspan x="521.5" dy="16.455">사슬을</tspan><tspan x="521.5" dy="16.455">기술 안에 넣는 수를</tspan><tspan x="521.5" dy="16.455">예상하고</tspan><tspan x="521.5" dy="16.455">순환이라고 답했다.</tspan><tspan x="521.5" dy="16.455">순환인지에 대해서는</tspan><tspan x="521.5" dy="16.455">다툼이 있다.</tspan><tspan x="521.5" dy="16.455">고정화된 기술 쪽은</tspan><tspan x="521.5" dy="16.455">인식 논증과</tspan><tspan x="521.5" dy="16.455">의미론 논증을</tspan><tspan x="521.5" dy="16.455">그대로 안고 간다</tspan></text><text x="778.5" y="1021" class="fill-N1 s0"><tspan x="778.5" dy="0">남은 빚 —</tspan><tspan x="778.5" dy="16.625">두 종류의 뜻이</tspan><tspan x="778.5" dy="16.625">각각 무슨 일을</tspan><tspan x="778.5" dy="16.625">하는지,</tspan><tspan x="778.5" dy="16.625">둘째 뜻이 결국</tspan><tspan x="778.5" dy="16.625">기술로 되돌아가는</tspan><tspan x="778.5" dy="16.625">것은 아닌지가</tspan><tspan x="778.5" dy="16.625">다투어진다</tspan></text><text x="256.5" y="1990" class="fill-N1 s0"><tspan x="256.5" dy="0">이론이 아니라 그림이라고</tspan><tspan x="256.5" dy="16.385">크립키 자신이 불렀다.</tspan><tspan x="256.5" dy="16.385">필요충분조건을 준 것이 아니기 때문이다.</tspan><tspan x="256.5" dy="16.385">‘마다가스카르’ 는 본래 아프리카</tspan><tspan x="256.5" dy="16.385">본토의 어느 지역을</tspan><tspan x="256.5" dy="16.385">가리키던 말인데 전달 과정의 착오로</tspan><tspan x="256.5" dy="16.385">섬을 가리키게 되었고,</tspan><tspan x="256.5" dy="16.385">지금 이 이름이 가리키는 것은 섬이지</tspan><tspan x="256.5" dy="16.385">사슬 끝의 그 지역이 아니다.</tspan><tspan x="256.5" dy="16.385">사슬을 어떻게 하나로 셀 것인지,</tspan><tspan x="256.5" dy="16.385">‘이어받으려는 의도’ 를 적을 때</tspan><tspan x="256.5" dy="16.385">기술이 몰래 들어오지는 않는지도</tspan><tspan x="256.5" dy="16.385">열린 물음이다</tspan></text><text x="779" y="1314" class="fill-N1 s0"><tspan x="779" dy="0">러셀의 확정 기술 분석은 이</tspan><tspan x="779" dy="17">다툼에서 살아남는다.</tspan><tspan x="779" dy="17">크립키가 무너뜨린 것은 이름이</tspan><tspan x="779" dy="17">기술이라는 주장이지</tspan><tspan x="779" dy="17">기술이 한정사 뭉치라는 분석이 아니다</tspan></text><g ><g class="shape"><path d="M75 1372h363v82H75z" class="stroke-B1 fill-B5 s1"/></g><text x="256.5" y="1410.5" class="text-bold fill-N1 s0"><tspan x="256.5" dy="0">최초의 명명</tspan><tspan x="256.5" dy="18.5">어떤 대상에 이름을 처음 붙이는 자리</tspan></text></g><g ><g class="shape"><path d="M88 1524h336v98H88z" class="stroke-B1 fill-B5 s1"/></g><text x="256" y="1562.5" class="text-bold fill-N1 s0"><tspan x="256" dy="0">전달의 사슬</tspan><tspan x="256" dy="17.667">앞 사람이 가리키던 것을 그대로</tspan><tspan x="256" dy="17.667">가리키려는 의도로 물려받아 쓴다</tspan></text></g><g ><g class="shape"><path d="M106 1692h301v162H106z" class="stroke-B1 fill-B5 s1"/></g><text x="256.5" y="1730.5" class="text-bold fill-N1 s0"><tspan x="256.5" dy="0">지금의 사용</tspan><tspan x="256.5" dy="16.714">‘괴델’ 에 대해 아무것도</tspan><tspan x="256.5" dy="16.714">모르는 사람도</tspan><tspan x="256.5" dy="16.714">그 이름으로 괴델을 가리킨다.</tspan><tspan x="256.5" dy="16.714">그를 붙들고 있는 것은 그가</tspan><tspan x="256.5" dy="16.714">아는 기술이 아니라</tspan><tspan x="256.5" dy="16.714">그가 이어받은 사슬이다</tspan></text></g><marker id="mk-d2-3412385916-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3412385916-3488378134)" d="M541 112v155" class="connection stroke-B1 s1" mask="url(#d2-3412385916)"/><text x="541" y="196" class="text-italic fill-N2 s0">여기서 무너진다</text><path fill="none" marker-end="url(#mk-d2-3412385916-3488378134)" d="M468 364v34s0 10-10 10H266.5s-10 0-10 10v192" class="connection stroke-B1 s1" mask="url(#d2-3412385916)"/><text x="282.5" y="414" class="text-italic fill-N2 s0">살아 있다</text><path fill="none" marker-end="url(#mk-d2-3412385916-3488378134)" d="m521.994 370-.482 165" class="connection stroke-B1 s1" mask="url(#d2-3412385916)"/><text x="521.5" y="459" class="text-italic fill-N2 s0">살아 있다</text><path fill="none" marker-end="url(#mk-d2-3412385916-3488378134)" d="M614 364v34s0 10 10 10h145s10 0 10 10v141" class="connection stroke-B1 s1" mask="url(#d2-3412385916)"/><text x="751.5" y="414" class="text-italic fill-N2 s0">살아 있다</text><path fill="none" marker-end="url(#mk-d2-3412385916-3488378134)" d="M256.5 1456v64" class="connection stroke-B1 s1" mask="url(#d2-3412385916)"/><path fill="none" marker-end="url(#mk-d2-3412385916-3488378134)" d="M256.5 1624v64" class="connection stroke-B1 s1" mask="url(#d2-3412385916)"/><path fill="none" marker-end="url(#mk-d2-3412385916-3488378134)" d="M194.5 810v484" class="connection stroke-B1 s1" mask="url(#d2-3412385916)"/><path fill="none" marker-end="url(#mk-d2-3412385916-3488378134)" d="M318.5 810v111" class="connection stroke-B1 s1" mask="url(#d2-3412385916)"/><path fill="none" marker-end="url(#mk-d2-3412385916-3488378134)" d="M521.5 847v74" class="connection stroke-B1 s1" mask="url(#d2-3412385916)"/><path fill="none" marker-end="url(#mk-d2-3412385916-3488378134)" d="M779 823v178" class="connection stroke-B1 s1" mask="url(#d2-3412385916)"/><mask id="d2-3412385916" width="1132" height="2377" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1132v2377H-89z"/><path d="M470 180h142v21H470zM240 398h85v21h-85zM479 443h85v21h-85zM709 398h85v21h-85z"/></mask></svg>