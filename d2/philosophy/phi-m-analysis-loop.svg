<svg xmlns="http://www.w3.org/2000/svg" width="1423" height="1142" class="d2-1771098372 d2-svg" viewBox="-101 -101 1423 1142"><rect width="1423" height="1142" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1771098372 .fill-N1{fill:#0a0f25}.d2-1771098372 .fill-N2{fill:#676c7e}.d2-1771098372 .fill-B6{fill:#f7f8fe}.d2-1771098372 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="680" cy="78" class="shape stroke-B1 fill-B6 s0" rx="234" ry="78"/></g><text x="680" y="75.5" class="text-bold fill-N1 s1"><tspan x="680" dy="0">분석하려는 개념</tspan><tspan x="680" dy="18.5">‘안다’, ‘같은 사람이다’, ‘옳다’</tspan></text></g><g ><g class="shape"><path d="M511 256h337v98H511z" class="stroke-B1 fill-B6 s0"/></g><text x="679.5" y="294.5" class="text-bold fill-N1 s1"><tspan x="679.5" dy="0">분석안을 내놓는다</tspan><tspan x="679.5" dy="17.667">‘X 이다’ 는</tspan><tspan x="679.5" dy="17.667">‘조건 C 를 모두 만족한다’ 와 같다</tspan></text></g><g ><g class="shape"><path d="M522 454h315v98H522z" class="stroke-B1 fill-B6 s0"/></g><text x="679.5" y="492.5" class="text-bold fill-N1 s1"><tspan x="679.5" dy="0">반례를 찾는다</tspan><tspan x="679.5" dy="17.667">조건은 갖췄는데 X 가 아닌 경우</tspan><tspan x="679.5" dy="17.667">또는 X 인데 조건을 못 갖춘 경우</tspan></text></g><g ><g class="shape"><path d="M315 673h203v98H315z" class="stroke-B1 fill-B6 s0"/></g><text x="416.5" y="711.5" class="text-bold fill-N1 s1"><tspan x="416.5" dy="0">① 분석안을 고친다</tspan><tspan x="416.5" dy="17.667">조건을 더하거나</tspan><tspan x="416.5" dy="17.667">빼거나 바꾼다</tspan></text></g><g ><g class="shape"><path d="M948 673h273v98H948z" class="stroke-B1 fill-B6 s0"/></g><text x="1084.5" y="711.5" class="text-bold fill-N1 s1"><tspan x="1084.5" dy="0">② 반례를 물리친다</tspan><tspan x="1084.5" dy="17.667">‘그 경우는 사실 X 다’ 라고</tspan><tspan x="1084.5" dy="17.667">판단을 고친다</tspan></text></g><g ><g class="shape"><path d="M0 673h255v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="127.5" y="711.5" class="text-bold fill-N1 s1"><tspan x="127.5" dy="0">③ 분석 자체를 포기한다</tspan><tspan x="127.5" dy="17.667">이 개념은 조건 목록으로</tspan><tspan x="127.5" dy="17.667">잡히지 않는다고 본다</tspan></text></g><g ><g class="shape"><path d="M592 681h296v82H592z" class="stroke-B1 fill-B6 s0"/></g><text x="740" y="719.5" class="text-bold fill-N1 s1"><tspan x="740" dy="0">당분간 반례가 나오지 않는다</tspan><tspan x="740" dy="18.5">→ 잠정적으로 채택한다</tspan></text></g><text x="610" y="807" class="fill-N1 s1"><tspan x="610" dy="0">②는 정당한 수가 될 수도 있고 회피가 될 수도 있다.</tspan><tspan x="610" dy="16.556">반례를 물리치려면 분석안을 지키고 싶다는 것 말고 다른 이유를 대야 한다.</tspan><tspan x="610" dy="16.556">그 이유가 없으면 어떤 분석안도 무너지지 않게 되고,</tspan><tspan x="610" dy="16.556">그러면 분석이 아무 말도 하지 않게 된다.</tspan><tspan x="610" dy="16.556"> </tspan><tspan x="610" dy="16.556">‘잠정적으로 채택’ 이 이 고리가 낼 수 있는 최선이다.</tspan><tspan x="610" dy="16.556">반례가 없음을 증명할 방법은 없다.</tspan><tspan x="610" dy="16.556">실제 철학사에서 오래 버틴 분석안은 드물다 —</tspan><tspan x="610" dy="16.556">5장의 정당화된 참인 믿음이 그 대표적인 사례다</tspan></text><marker id="mk-d2-1771098372-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1771098372-3488378134)" d="M679.99 158c-.19 38-.24 58-.24 94" class="connection stroke-B1 s0" mask="url(#d2-1771098372)"/><path fill="none" marker-end="url(#mk-d2-1771098372-3488378134)" d="M679.75 356v94" class="connection stroke-B1 s0" mask="url(#d2-1771098372)"/><path fill="none" marker-end="url(#mk-d2-1771098372-3488378134)" d="M520.538 534.887C206.5 596.9 127.5 624.7 127.5 669.5" class="connection stroke-B1 s0" mask="url(#d2-1771098372)"/><text x="299.5" y="584" class="text-italic fill-N2 s1">고쳐도 계속 나온다</text><path fill="none" marker-end="url(#mk-d2-1771098372-3488378134)" d="M609.369 552.657C542.2 600.3 513 624.7 467.805 670.648" class="connection stroke-B1 s0" mask="url(#d2-1771098372)"/><text x="534" y="613" class="text-italic fill-N2 s1">반례가 있다</text><path fill="none" marker-end="url(#mk-d2-1771098372-3488378134)" d="M839.19 542.724c223.66 55.724 276.26 81.976 262.25 126.957" class="connection stroke-B1 s0" mask="url(#d2-1771098372)"/><text x="1003" y="589" class="text-italic fill-N2 s1">반례가 있다</text><path fill="none" marker-end="url(#mk-d2-1771098372-3488378134)" d="M372.953 671.978C332.65 624.7 322.25 590.6 322.25 557.75s37.8-164.15 185.143-204.689" class="connection stroke-B1 s0" mask="url(#d2-1771098372)"/><text x="339.5" y="469" class="text-italic fill-N2 s1">다시</text><path fill="none" marker-end="url(#mk-d2-1771098372-3488378134)" d="M1054.505 671.765C1027.5 624.7 1020.5 590.6 1020.5 557.75s-34.45-163.759-168.409-202.679" class="connection stroke-B1 s0" mask="url(#d2-1771098372)"/><text x="1004.5" y="471" class="text-italic fill-N2 s1">다시</text><path fill="none" marker-end="url(#mk-d2-1771098372-3488378134)" d="M707.702 553.26C733.15 600.3 739.75 626.3 739.75 677.5" class="connection stroke-B1 s0" mask="url(#d2-1771098372)"/><text x="736" y="619" class="text-italic fill-N2 s1">찾지 못했다</text><mask id="d2-1771098372" width="1423" height="1142" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1423v1142H-101z"/><path d="M217 568h165v21H217zM482 597h104v21H482zM951 573h104v21H951zM318 453h43v21h-43zM983 455h43v21h-43zM684 603h104v21H684z"/></mask></svg>