<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="1318" class="d2-1879720053 d2-svg" viewBox="-101 -101 1128 1318"><rect width="1128" height="1318" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1879720053 .text-bold{font-weight:700}.d2-1879720053 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1879720053 .fill-N1{fill:#0a0f25}.d2-1879720053 .fill-N2{fill:#676c7e}.d2-1879720053 .fill-B6{fill:#f7f8fe}.d2-1879720053 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="545" cy="78" class="shape stroke-B1 fill-B6 s0" rx="234" ry="78"/></g><text x="545" y="75.5" class="text-bold fill-N1 s1"><tspan x="545" dy="0">분석하려는 개념</tspan><tspan x="545" dy="18.5">‘안다’, ‘같은 사람이다’, ‘옳다’</tspan></text></g><g ><g class="shape"><path d="M376 256h337v98H376z" class="stroke-B1 fill-B6 s0"/></g><text x="544.5" y="294.5" class="text-bold fill-N1 s1"><tspan x="544.5" dy="0">분석안을 내놓는다</tspan><tspan x="544.5" dy="17.667">‘X 이다’ 는</tspan><tspan x="544.5" dy="17.667">‘조건 C 를 모두 만족한다’ 와 같다</tspan></text></g><g ><g class="shape"><path d="M437 454h215v130H437z" class="stroke-B1 fill-B6 s0"/></g><text x="544.5" y="492.5" class="text-bold fill-N1 s1"><tspan x="544.5" dy="0">반례를 찾는다</tspan><tspan x="544.5" dy="17">조건은 갖췄는데</tspan><tspan x="544.5" dy="17">X 가 아닌 경우</tspan><tspan x="544.5" dy="17">또는 X 인데</tspan><tspan x="544.5" dy="17">조건을 못 갖춘 경우</tspan></text></g><g ><g class="shape"><path d="M248 737h188v114H248z" class="stroke-B1 fill-B6 s0"/></g><text x="342" y="775.5" class="text-bold fill-N1 s1"><tspan x="342" dy="0">① 분석안을</tspan><tspan x="342" dy="17.25">고친다</tspan><tspan x="342" dy="17.25">조건을 더하거나</tspan><tspan x="342" dy="17.25">빼거나 바꾼다</tspan></text></g><g ><g class="shape"><path d="M752 729h174v130H752z" class="stroke-B1 fill-B6 s0"/></g><text x="839" y="767.5" class="text-bold fill-N1 s1"><tspan x="839" dy="0">② 반례를</tspan><tspan x="839" dy="17">물리친다</tspan><tspan x="839" dy="17">‘그 경우는</tspan><tspan x="839" dy="17">사실 X 다’ 라고</tspan><tspan x="839" dy="17">판단을 고친다</tspan></text></g><g ><g class="shape"><path d="M0 721h188v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="94" y="759.5" class="text-bold fill-N1 s1"><tspan x="94" dy="0">③ 분석 자체를</tspan><tspan x="94" dy="16.833">포기한다</tspan><tspan x="94" dy="16.833">이 개념은</tspan><tspan x="94" dy="16.833">조건 목록으로</tspan><tspan x="94" dy="16.833">잡히지 않는다고</tspan><tspan x="94" dy="16.833">본다</tspan></text></g><g ><g class="shape"><path d="M521 737h168v114H521z" class="stroke-B1 fill-B6 s0"/></g><text x="605" y="775.5" class="text-bold fill-N1 s1"><tspan x="605" dy="0">당분간 반례가</tspan><tspan x="605" dy="17.25">나오지 않는다</tspan><tspan x="605" dy="17.25">→ 잠정적으로</tspan><tspan x="605" dy="17.25">채택한다</tspan></text></g><text x="463" y="903" class="fill-N1 s1"><tspan x="463" dy="0">②는 정당한 수가 될 수도 있고</tspan><tspan x="463" dy="16.357">회피가 될 수도 있다.</tspan><tspan x="463" dy="16.357">반례를 물리치려면 분석안을 지키고 싶다는 것</tspan><tspan x="463" dy="16.357">말고 다른 이유를 대야 한다.</tspan><tspan x="463" dy="16.357">그 이유가 없으면</tspan><tspan x="463" dy="16.357">어떤 분석안도 무너지지 않게 되고,</tspan><tspan x="463" dy="16.357">그러면 분석이 아무 말도 하지 않게 된다.</tspan><tspan x="463" dy="16.357"> </tspan><tspan x="463" dy="16.357">‘잠정적으로 채택’ 이</tspan><tspan x="463" dy="16.357">이 고리가 낼 수 있는 최선이다.</tspan><tspan x="463" dy="16.357">반례가 없음을 증명할 방법은 없다.</tspan><tspan x="463" dy="16.357">실제 철학사에서 오래 버틴 분석안은 드물다 —</tspan><tspan x="463" dy="16.357">5장의 정당화된 참인 믿음이</tspan><tspan x="463" dy="16.357">그 대표적인 사례다</tspan></text><marker id="mk-d2-1879720053-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1879720053-3488378134)" d="M544.98 158c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-1879720053)"/><path fill="none" marker-end="url(#mk-d2-1879720053-3488378134)" d="M544.5 356v94" class="connection stroke-B1 s0" mask="url(#d2-1879720053)"/><path fill="none" marker-end="url(#mk-d2-1879720053-3488378134)" d="M435.083 551.07C162.599 632.1 94 666.3 94 717.5" class="connection stroke-B1 s0" mask="url(#d2-1879720053)"/><text x="237" y="608" class="text-italic fill-N2 s1"><tspan x="237" dy="0">고쳐도</tspan><tspan x="237" dy="18.5">계속 나온다</tspan></text><path fill="none" marker-end="url(#mk-d2-1879720053-3488378134)" d="M485.175 584.998C437.7 638.7 415.5 669.5 377.528 734.052" class="connection stroke-B1 s0" mask="url(#d2-1879720053)"/><text x="425" y="662" class="text-italic fill-N2 s1">반례가 있다</text><path fill="none" marker-end="url(#mk-d2-1879720053-3488378134)" d="M653.353 563.251C829.1 634.5 869.7 667.9 855.458 725.616" class="connection stroke-B1 s0" mask="url(#d2-1879720053)"/><text x="794" y="626" class="text-italic fill-N2 s1">반례가 있다</text><path fill="none" marker-end="url(#mk-d2-1879720053-3488378134)" d="M304.942 735.803C263.6 669.5 253 625.8 253 585.75S282.4 394 396.213 355.288" class="connection stroke-B1 s0" mask="url(#d2-1879720053)"/><text x="259.5" y="515" class="text-italic fill-N2 s1">다시</text><path fill="none" marker-end="url(#mk-d2-1879720053-3488378134)" d="M822.02 727.558C807.3 667.9 803.5 625.8 803.5 585.75S777.3 394 676.237 355.426" class="connection stroke-B1 s0" mask="url(#d2-1879720053)"/><text x="796.5" y="512" class="text-italic fill-N2 s1">다시</text><path fill="none" marker-end="url(#mk-d2-1879720053-3488378134)" d="M574.32 585.324C598.3 638.7 604.5 669.5 604.5 733.5" class="connection stroke-B1 s0" mask="url(#d2-1879720053)"/><text x="602" y="663" class="text-italic fill-N2 s1">찾지 못했다</text><mask id="d2-1879720053" width="1128" height="1318" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1128v1318H-101z"/><path d="M185 592h104v37H185zM373 646h104v21H373zM742 610h104v21H742zM238 499h43v21h-43zM775 496h43v21h-43zM550 647h104v21H550z"/></mask></svg>