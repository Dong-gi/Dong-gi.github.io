<svg xmlns="http://www.w3.org/2000/svg" width="2952" height="734" class="d2-1276476467 d2-svg" viewBox="-101 -101 2952 734"><rect width="2952" height="734" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1276476467 .fill-N1{fill:#0a0f25}.d2-1276476467 .fill-N2{fill:#676c7e}.d2-1276476467 .fill-B6{fill:#f7f8fe}.d2-1276476467 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="393" cy="244" class="shape stroke-B1 fill-B6 s0" rx="234" ry="78"/></g><text x="393" y="241.5" class="text-bold fill-N1 s1"><tspan x="393" dy="0">분석하려는 개념</tspan><tspan x="393" dy="18.5">‘안다’, ‘같은 사람이다’, ‘옳다’</tspan></text></g><g ><g class="shape"><path d="M987 203h438v82H987z" class="stroke-B1 fill-B6 s0"/></g><text x="1206" y="241.5" class="text-bold fill-N1 s1"><tspan x="1206" dy="0">분석안을 내놓는다</tspan><tspan x="1206" dy="18.5">‘X 이다’ 는 ‘조건 C 를 모두 만족한다’ 와 같다</tspan></text></g><g ><g class="shape"><path d="M1626 342h315v98h-315z" class="stroke-B1 fill-B6 s0"/></g><text x="1783.5" y="380.5" class="text-bold fill-N1 s1"><tspan x="1783.5" dy="0">반례를 찾는다</tspan><tspan x="1783.5" dy="17.667">조건은 갖췄는데 X 가 아닌 경우</tspan><tspan x="1783.5" dy="17.667">또는 X 인데 조건을 못 갖춘 경우</tspan></text></g><g ><g class="shape"><path d="M2369 0h316v82h-316z" class="stroke-B1 fill-B6 s0"/></g><text x="2527" y="38.5" class="text-bold fill-N1 s1"><tspan x="2527" dy="0">① 분석안을 고친다</tspan><tspan x="2527" dy="18.5">조건을 더하거나 빼거나 바꾼다</tspan></text></g><g ><g class="shape"><path d="M2326 284h401v82h-401z" class="stroke-B1 fill-B6 s0"/></g><text x="2526.5" y="322.5" class="text-bold fill-N1 s1"><tspan x="2526.5" dy="0">② 반례를 물리친다</tspan><tspan x="2526.5" dy="18.5">‘그 경우는 사실 X 다’ 라고 판단을 고친다</tspan></text></g><g ><g class="shape"><path d="M2303 142h447v82h-447z" class="stroke-B1 fill-B6 s0"/></g><text x="2526.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="2526.5" dy="0">③ 분석 자체를 포기한다</tspan><tspan x="2526.5" dy="18.5">이 개념은 조건 목록으로 잡히지 않는다고 본다</tspan></text></g><g ><g class="shape"><path d="M2379 426h296v82h-296z" class="stroke-B1 fill-B6 s0"/></g><text x="2527" y="464.5" class="text-bold fill-N1 s1"><tspan x="2527" dy="0">당분간 반례가 나오지 않는다</tspan><tspan x="2527" dy="18.5">→ 잠정적으로 채택한다</tspan></text></g><text x="393.5" y="398" class="fill-N1 s1"><tspan x="393.5" dy="0">②는 정당한 수가 될 수도 있고 회피가 될 수도 있다. 반례를 물리치려면</tspan><tspan x="393.5" dy="17.667">분석안을 지키고 싶다는 것 말고 다른 이유를 대야 한다.</tspan><tspan x="393.5" dy="17.667">그 이유가 없으면 어떤 분석안도 무너지지 않게 되고, 그러면 분석이 아무 말도 하지 않게 된다</tspan></text><text x="393" y="511" class="fill-N1 s1"><tspan x="393" dy="0">‘잠정적으로 채택’ 이 이 고리가 낼 수 있는 최선이다. 반례가 없음을 증명할 방법은 없다.</tspan><tspan x="393" dy="18.5">실제 철학사에서 오래 버틴 분석안은 드물다 — 5장의 정당화된 참인 믿음이 그 대표적인 사례다</tspan></text><marker id="mk-d2-1276476467-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1276476467-3488378134)" d="M629 244h354.5" class="connection stroke-B1 s0" mask="url(#d2-1276476467)"/><path fill="none" marker-end="url(#mk-d2-1276476467-3488378134)" d="M1297.316 285.587C1479.5 369.55 1545.7 390.75 1622.5 390.75" class="connection stroke-B1 s0" mask="url(#d2-1276476467)"/><path fill="none" marker-end="url(#mk-d2-1276476467-3488378134)" d="M1843.435 340.465C2065.98 153.75 2171.3 98.736 2364.552 67.324" class="connection stroke-B1 s0" mask="url(#d2-1276476467)"/><text x="2078" y="153" class="text-italic fill-N2 s1">반례가 있다</text><path fill="none" marker-end="url(#mk-d2-1276476467-3488378134)" d="M1943 390.75c142.8 0 219.8-6.6 379.051-32.361" class="connection stroke-B1 s0" mask="url(#d2-1276476467)"/><text x="2135" y="392" class="text-italic fill-N2 s1">반례가 있다</text><path fill="none" marker-end="url(#mk-d2-1276476467-3488378134)" d="M1865.043 340.704C2070.267 214.75 2158.2 183 2299 183" class="connection stroke-B1 s0" mask="url(#d2-1276476467)"/><text x="2068.5" y="221" class="text-italic fill-N2 s1">고쳐도 계속 나온다</text><path fill="none" marker-end="url(#mk-d2-1276476467-3488378134)" d="M2366.5 41h-413.75c-101.55 0-478.25 32.4-678.874 159.855" class="connection stroke-B1 s0" mask="url(#d2-1276476467)"/><text x="1800.5" y="51" class="text-italic fill-N2 s1">다시</text><path fill="none" marker-end="url(#mk-d2-1276476467-3488378134)" d="M2324.01 304.305C2162.8 288.5 2054.3 284.5 1952.75 284.5s-447.45-2.6-524.283-12.49" class="connection stroke-B1 s0" mask="url(#d2-1276476467)"/><text x="1875.5" y="290" class="text-italic fill-N2 s1">다시</text><path fill="none" marker-end="url(#mk-d2-1276476467-3488378134)" d="M1942.95 426.442C2085.8 458.8 2173.3 467 2374.5 467" class="connection stroke-B1 s0" mask="url(#d2-1276476467)"/><text x="2158" y="471" class="text-italic fill-N2 s1">찾지 못했다</text><mask id="d2-1276476467" width="2952" height="734" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2952v734H-101z"/><path d="M2026 137h104v21h-104zM2083 376h104v21h-104zM1986 205h165v21h-165zM1779 35h43v21h-43zM1854 274h43v21h-43zM2106 455h104v21h-104z"/></mask></svg>