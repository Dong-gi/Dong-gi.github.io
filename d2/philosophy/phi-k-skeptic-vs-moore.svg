<svg xmlns="http://www.w3.org/2000/svg" width="1699" height="1229" class="d2-1139592482 d2-svg" viewBox="-101 -101 1699 1229"><rect width="1699" height="1229" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1139592482 .fill-N1{fill:#0a0f25}.d2-1139592482 .fill-N2{fill:#676c7e}.d2-1139592482 .fill-B6{fill:#f7f8fe}.d2-1139592482 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M570 0h302v98H570z" class="stroke-B1 fill-B6 s0"/></g><text x="721" y="38.5" class="text-bold fill-N1 s1"><tspan x="721" dy="0">두 논증이 함께 쓰는 전제</tspan><tspan x="721" dy="17.667">내가 손이 있음을 안다면</tspan><tspan x="721" dy="17.667">내가 통 속의 뇌가 아님도 안다</tspan></text></g><g ><g class="shape"><path d="M234 219h462v146H234z" class="stroke-B1 fill-B6 s0"/></g><text x="465" y="257.5" class="text-bold fill-N1 s1"><tspan x="465" dy="0">회의주의 논증</tspan><tspan x="465" dy="16.833"> </tspan><tspan x="465" dy="16.833">(P1) 나는 내가 통 속의 뇌가 아님을 알지 못한다</tspan><tspan x="465" dy="16.833">(P2) 손이 있음을 안다면 통 속의 뇌가 아님도 안다</tspan><tspan x="465" dy="16.833">———————————</tspan><tspan x="465" dy="16.833">(C) 그러므로 나는 손이 있음을 알지 못한다</tspan></text></g><g ><g class="shape"><path d="M756 219h462v146H756z" class="stroke-B1 fill-B6 s0"/></g><text x="987" y="257.5" class="text-bold fill-N1 s1"><tspan x="987" dy="0">무어의 뒤집기</tspan><tspan x="987" dy="16.833"> </tspan><tspan x="987" dy="16.833">(P1*) 나는 내가 손이 있음을 안다</tspan><tspan x="987" dy="16.833">(P2) 손이 있음을 안다면 통 속의 뇌가 아님도 안다</tspan><tspan x="987" dy="16.833">———————————</tspan><tspan x="987" dy="16.833">(C*) 그러므로 나는 통 속의 뇌가 아님을 안다</tspan></text></g><text x="721" y="481" class="fill-N1 s1"><tspan x="721" dy="0">형식은 둘 다 타당하다.</tspan><tspan x="721" dy="17.667">왼쪽은 뒤를 부정해 앞을 부정하고(후건 부정),</tspan><tspan x="721" dy="17.667">오른쪽은 앞을 긍정해 뒤를 긍정한다(전건 긍정)</tspan></text><g ><g class="shape"><ellipse cx="721" cy="735.5" class="shape stroke-B1 fill-B6 s0" rx="352" ry="117.5"/></g><text x="721" y="725" class="text-bold fill-N1 s1"><tspan x="721" dy="0">그러니 다툼은 형식이 아니라 출발점에 있다.</tspan><tspan x="721" dy="17.667">‘통 속의 뇌가 아님을 모른다’ 와 ‘손이 있음을 안다’</tspan><tspan x="721" dy="17.667">가운데 어느 쪽이 더 확실한가</tspan></text></g><text x="208.5" y="990" class="fill-N1 s1"><tspan x="208.5" dy="0">무어의 대답 — 내 손이 여기 있다는 것보다</tspan><tspan x="208.5" dy="17.667">회의주의 전제가 더 확실하다고 볼 이유가 없다.</tspan><tspan x="208.5" dy="17.667">덜 확실한 것으로 더 확실한 것을 뒤집을 수는 없다</tspan></text><text x="720.5" y="998" class="fill-N1 s1"><tspan x="720.5" dy="0">회의주의자의 되받음 — 그것은 논점을 미리 가정한 것이다.</tspan><tspan x="720.5" dy="18.5">‘안다’ 를 물어 놓고 안다고 답하는 셈이다</tspan></text><text x="1260.5" y="990" class="fill-N1 s1"><tspan x="1260.5" dy="0">이 모양은 회의주의에만 있는 것이 아니다.</tspan><tspan x="1260.5" dy="17.667">타당한 논증이 마음에 안 드는 결론을 내놓으면</tspan><tspan x="1260.5" dy="17.667">전제 하나를 버리거나 결론을 받아들이거나 둘 중 하나다</tspan></text><marker id="mk-d2-1139592482-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1139592482-3488378134)" d="M603.664 98.294C492.7 146.3 464.5 170.7 464.5 215.5" class="connection stroke-B1 s0" mask="url(#d2-1139592482)"/><text x="509.5" y="144" class="text-italic fill-N2 s1">(P1) 을 보태면</text><path fill="none" marker-end="url(#mk-d2-1139592482-3488378134)" d="M841.347 98.267C957.1 146.3 986.5 170.7 986.5 215.5" class="connection stroke-B1 s0" mask="url(#d2-1139592482)"/><text x="938.5" y="144" class="text-italic fill-N2 s1">(P1*) 을 보태면</text><path fill="none" marker-end="url(#mk-d2-1139592482-3488378134)" d="M464.5 367c0 38 33.4 58 163.168 96.853" class="connection stroke-B1 s0" mask="url(#d2-1139592482)"/><path fill="none" marker-end="url(#mk-d2-1139592482-3488378134)" d="M986.5 367c0 38-34.8 58-170.156 96.895" class="connection stroke-B1 s0" mask="url(#d2-1139592482)"/><path fill="none" marker-end="url(#mk-d2-1139592482-3488378134)" d="M720.5 520c0 38 .1 58 .46 94" class="connection stroke-B1 s0" mask="url(#d2-1139592482)"/><path fill="none" marker-end="url(#mk-d2-1139592482-3488378134)" d="M474.112 820.66C262 894.8 208.5 925.7 208.5 970.5" class="connection stroke-B1 s0" mask="url(#d2-1139592482)"/><path fill="none" marker-end="url(#mk-d2-1139592482-3488378134)" d="M720.983 855c-.383 46.4-.483 72.3-.483 123.5" class="connection stroke-B1 s0" mask="url(#d2-1139592482)"/><path fill="none" marker-end="url(#mk-d2-1139592482-3488378134)" d="M973.899 818.629C1202.8 894.4 1260.5 925.7 1260.5 970.5" class="connection stroke-B1 s0" mask="url(#d2-1139592482)"/><text x="1141.5" y="880" class="text-italic fill-N2 s1">일반적인 구조</text><mask id="d2-1139592482" width="1699" height="1229" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1699v1229H-101z"/><path d="M453 128h113v21H453zM879 128h119v21H879zM1080 864h123v21h-123z"/></mask></svg>