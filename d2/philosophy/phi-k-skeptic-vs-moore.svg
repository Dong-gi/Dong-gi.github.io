<svg xmlns="http://www.w3.org/2000/svg" width="1027" height="1308" class="d2-2479915614 d2-svg" viewBox="-101 -101 1027 1308"><rect width="1027" height="1308" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2479915614 .text-bold{font-weight:700}.d2-2479915614 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2479915614 .fill-N1{fill:#0a0f25}.d2-2479915614 .fill-N2{fill:#676c7e}.d2-2479915614 .fill-B6{fill:#f7f8fe}.d2-2479915614 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M270 0h302v98H270z" class="stroke-B1 fill-B6 s0"/></g><text x="421" y="38.5" class="text-bold fill-N1 s1"><tspan x="421" dy="0">두 논증이 함께 쓰는 전제</tspan><tspan x="421" dy="17.667">내가 손이 있음을 안다면</tspan><tspan x="421" dy="17.667">내가 통 속의 뇌가 아님도 안다</tspan></text></g><g ><g class="shape"><path d="M104 219h271v194H104z" class="stroke-B1 fill-B6 s0"/></g><text x="239.5" y="257.5" class="text-bold fill-N1 s1"><tspan x="239.5" dy="0">회의주의 논증</tspan><tspan x="239.5" dy="16.556"> </tspan><tspan x="239.5" dy="16.556">(P1) 나는 내가 통 속의 뇌가</tspan><tspan x="239.5" dy="16.556">아님을 알지 못한다</tspan><tspan x="239.5" dy="16.556">(P2) 손이 있음을 안다면</tspan><tspan x="239.5" dy="16.556">통 속의 뇌가 아님도 안다</tspan><tspan x="239.5" dy="16.556">———————————</tspan><tspan x="239.5" dy="16.556">(C) 그러므로 나는</tspan><tspan x="239.5" dy="16.556">손이 있음을 알지 못한다</tspan></text></g><g ><g class="shape"><path d="M435 227h318v178H435z" class="stroke-B1 fill-B6 s0"/></g><text x="594" y="265.5" class="text-bold fill-N1 s1"><tspan x="594" dy="0">무어의 뒤집기</tspan><tspan x="594" dy="16.625"> </tspan><tspan x="594" dy="16.625">(P1*) 나는 내가 손이 있음을 안다</tspan><tspan x="594" dy="16.625">(P2) 손이 있음을 안다면</tspan><tspan x="594" dy="16.625">통 속의 뇌가 아님도 안다</tspan><tspan x="594" dy="16.625">———————————</tspan><tspan x="594" dy="16.625">(C*) 그러므로 나는</tspan><tspan x="594" dy="16.625">통 속의 뇌가 아님을 안다</tspan></text></g><text x="421" y="529" class="fill-N1 s1"><tspan x="421" dy="0">형식은 둘 다 타당하다.</tspan><tspan x="421" dy="17.667">왼쪽은 뒤를 부정해 앞을 부정하고(후건 부정),</tspan><tspan x="421" dy="17.667">오른쪽은 앞을 긍정해 뒤를 긍정한다(전건 긍정)</tspan></text><g ><g class="shape"><ellipse cx="421" cy="767" class="shape stroke-B1 fill-B6 s0" rx="303" ry="101"/></g><text x="421" y="748.5" class="text-bold fill-N1 s1"><tspan x="421" dy="0">그러니 다툼은 형식이 아니라 출발점에 있다.</tspan><tspan x="421" dy="17.25">‘통 속의 뇌가 아님을 모른다’ 와</tspan><tspan x="421" dy="17.25">‘손이 있음을 안다’</tspan><tspan x="421" dy="17.25">가운데 어느 쪽이 더 확실한가</tspan></text></g><text x="132" y="1005" class="fill-N1 s1"><tspan x="132" dy="0">무어의 대답 — 내 손이</tspan><tspan x="132" dy="16.714">여기 있다는 것보다</tspan><tspan x="132" dy="16.714">회의주의 전제가 더 확실하다고</tspan><tspan x="132" dy="16.714">볼 이유가 없다.</tspan><tspan x="132" dy="16.714">덜 확실한 것으로</tspan><tspan x="132" dy="16.714">더 확실한 것을</tspan><tspan x="132" dy="16.714">뒤집을 수는 없다</tspan></text><text x="420.5" y="1021" class="fill-N1 s1"><tspan x="420.5" dy="0">회의주의자의 되받음 —</tspan><tspan x="420.5" dy="17">그것은 논점을</tspan><tspan x="420.5" dy="17">미리 가정한 것이다.</tspan><tspan x="420.5" dy="17">‘안다’ 를 물어 놓고</tspan><tspan x="420.5" dy="17">안다고 답하는 셈이다</tspan></text><text x="701" y="1005" class="fill-N1 s1"><tspan x="701" dy="0">이 모양은 회의주의에만</tspan><tspan x="701" dy="16.714">있는 것이 아니다.</tspan><tspan x="701" dy="16.714">타당한 논증이 마음에 안 드는</tspan><tspan x="701" dy="16.714">결론을 내놓으면</tspan><tspan x="701" dy="16.714">전제 하나를 버리거나</tspan><tspan x="701" dy="16.714">결론을 받아들이거나</tspan><tspan x="701" dy="16.714">둘 중 하나다</tspan></text><marker id="mk-d2-2479915614-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2479915614-3488378134)" d="M337.543 98.542C259.25 146.3 239.25 170.7 239.25 215.5" class="connection stroke-B1 s0" mask="url(#d2-2479915614)"/><text x="264.5" y="148" class="text-italic fill-N2 s1">(P1) 을 보태면</text><path fill="none" marker-end="url(#mk-d2-2479915614-3488378134)" d="M499.438 98.573C574.55 146.3 593.75 172.3 593.75 223.5" class="connection stroke-B1 s0" mask="url(#d2-2479915614)"/><text x="573.5" y="151" class="text-italic fill-N2 s1">(P1*) 을 보태면</text><path fill="none" marker-end="url(#mk-d2-2479915614-3488378134)" d="M239.25 415c0 38 23.6 58 114.317 96.44" class="connection stroke-B1 s0" mask="url(#d2-2479915614)"/><path fill="none" marker-end="url(#mk-d2-2479915614-3488378134)" d="M593.75 407c0 44.4-22.6 66-109.342 104.381" class="connection stroke-B1 s0" mask="url(#d2-2479915614)"/><path fill="none" marker-end="url(#mk-d2-2479915614-3488378134)" d="M420.5 568c0 38 .1 58 .46 94" class="connection stroke-B1 s0" mask="url(#d2-2479915614)"/><path fill="none" marker-end="url(#mk-d2-2479915614-3488378134)" d="M263.255 854.977C158.6 913.6 132 940.7 132 985.5" class="connection stroke-B1 s0" mask="url(#d2-2479915614)"/><path fill="none" marker-end="url(#mk-d2-2479915614-3488378134)" d="M420.983 870c-.383 46.4-.483 73.9-.483 131.5" class="connection stroke-B1 s0" mask="url(#d2-2479915614)"/><path fill="none" marker-end="url(#mk-d2-2479915614-3488378134)" d="M574.729 855.006C675.4 913.6 701 940.7 701 985.5" class="connection stroke-B1 s0" mask="url(#d2-2479915614)"/><text x="661.5" y="911" class="text-italic fill-N2 s1">일반적인 구조</text><mask id="d2-2479915614" width="1027" height="1308" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H926v1308H-101z"/><path d="M208 132h113v21H208zM514 135h119v21H514zM600 895h123v21H600z"/></mask></svg>