<svg xmlns="http://www.w3.org/2000/svg" width="2156" height="872" class="d2-1306483835 d2-svg" viewBox="-101 -101 2156 872"><rect width="2156" height="872" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1306483835 .fill-N1{fill:#0a0f25}.d2-1306483835 .fill-N2{fill:#676c7e}.d2-1306483835 .fill-B6{fill:#f7f8fe}.d2-1306483835 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M14 163h272v114H14z" class="stroke-B1 fill-B6 s0"/></g><text x="150" y="201.5" class="text-bold fill-N1 s1"><tspan x="150" dy="0">마음 사건 — 아픔</tspan><tspan x="150" dy="17.25">비환원적 물리주의는</tspan><tspan x="150" dy="17.25">이 속성이 물리 속성으로</tspan><tspan x="150" dy="17.25">환원되지 않는다고 말한다</tspan></text></g><g ><g class="shape"><path d="M0 337h299v162H0z" class="stroke-B1 fill-B6 s0"/></g><text x="149.5" y="375.5" class="text-bold fill-N1 s1"><tspan x="149.5" dy="0">물리 사건 —</tspan><tspan x="149.5" dy="16.714">그 아픔을 실현하는 신경 상태</tspan><tspan x="149.5" dy="16.714">위 칸의 마음 속성이</tspan><tspan x="149.5" dy="16.714">수반하는 기초이고,</tspan><tspan x="149.5" dy="16.714">인과적 폐쇄에 따라</tspan><tspan x="149.5" dy="16.714">이것만으로 결과를 낳기에</tspan><tspan x="149.5" dy="16.714">충분하다</tspan></text></g><g ><g class="shape"><ellipse cx="746.5" cy="319" class="shape stroke-B1 fill-B6 s0" rx="113.5" ry="39"/></g><text x="746.5" y="316.5" class="text-bold fill-N1 s1"><tspan x="746.5" dy="0">물리적 결과 —</tspan><tspan x="746.5" dy="18.5">신음</tspan></text></g><g ><g class="shape"><ellipse cx="1250.5" cy="319" class="shape stroke-B1 fill-B6 s0" rx="203.5" ry="124"/></g><text x="1250.5" y="260.5" class="text-bold fill-N1 s1"><tspan x="1250.5" dy="0">그러면 위쪽 화살표가</tspan><tspan x="1250.5" dy="16.556">설 자리가 있는가</tspan><tspan x="1250.5" dy="16.556">(P3) 환원되지 않는다면</tspan><tspan x="1250.5" dy="16.556">두 원인은 서로 다른 둘이다.</tspan><tspan x="1250.5" dy="16.556">(P4) 한 결과에 충분한 원인이</tspan><tspan x="1250.5" dy="16.556">둘 있는 것은 과잉결정이고,</tspan><tspan x="1250.5" dy="16.556">과잉결정은 특별한 경우이지</tspan><tspan x="1250.5" dy="16.556">일상이 아니다.</tspan><tspan x="1250.5" dy="16.556">(C) 그러므로 (P1) 이 위태롭다</tspan></text></g><g ><g class="shape"><path d="M1669 0h257v162h-257z" class="stroke-B1 fill-B6 s0"/></g><text x="1797.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1797.5" dy="0">선택지 ① (P3) 을 끊는다</tspan><tspan x="1797.5" dy="16.714">환원을 받아들이고</tspan><tspan x="1797.5" dy="16.714">환원적 물리주의로 간다.</tspan><tspan x="1797.5" dy="16.714">값 — 다수 실현을</tspan><tspan x="1797.5" dy="16.714">처리해야 한다.</tspan><tspan x="1797.5" dy="16.714">종 상대적 환원이</tspan><tspan x="1797.5" dy="16.714">표준 대응이다</tspan></text></g><g ><g class="shape"><path d="M1641 222h313v194h-313z" class="stroke-B1 fill-B6 s0"/></g><text x="1797.5" y="260.5" class="text-bold fill-N1 s1"><tspan x="1797.5" dy="0">선택지 ② (P4) 를 끊는다</tspan><tspan x="1797.5" dy="16.556">이런 종류의 겹침은</tspan><tspan x="1797.5" dy="16.556">경쟁이 아니라고 논증한다.</tspan><tspan x="1797.5" dy="16.556">조각상의 모양이 유리창을</tspan><tspan x="1797.5" dy="16.556">깨는 것과 그 청동 덩어리가</tspan><tspan x="1797.5" dy="16.556">유리창을 깨는 것이</tspan><tspan x="1797.5" dy="16.556">두 개의 인과가 아니듯이.</tspan><tspan x="1797.5" dy="16.556">값 — 오늘 가장 활발한 길이되</tspan><tspan x="1797.5" dy="16.556">성공했는지는 정해지지 않았다</tspan></text></g><g ><g class="shape"><path d="M1660 476h276v194h-276z" class="stroke-B1 fill-B6 s0"/></g><text x="1798" y="514.5" class="text-bold fill-N1 s1"><tspan x="1798" dy="0">선택지 ③ (P1) 을 포기한다</tspan><tspan x="1798" dy="16.556">마음은 물리적 결과를</tspan><tspan x="1798" dy="16.556">낳지 않는다.</tspan><tspan x="1798" dy="16.556">부수현상론으로 간다.</tspan><tspan x="1798" dy="16.556">값 — 이원론이 걸렸던</tspan><tspan x="1798" dy="16.556">자리로 되돌아간다.</tspan><tspan x="1798" dy="16.556">물리주의자에게도 정신적</tspan><tspan x="1798" dy="16.556">인과 문제가 그대로 있다는</tspan><tspan x="1798" dy="16.556">것이 이 논증의 요점이다</tspan></text></g><marker id="mk-d2-1306483835-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1306483835-3488378134)" d="M288.5 220c141.6 0 217.7 14.2 374.728 69.668" class="connection stroke-B1 s0" mask="url(#d2-1306483835)"/><text x="481" y="219" class="text-italic fill-N2 s1"><tspan x="481" dy="0">위쪽 화살표</tspan><tspan x="481" dy="17.667">(P1) 아픔이</tspan><tspan x="481" dy="17.667">신음을 일으킨다</tspan></text><path fill="none" marker-end="url(#mk-d2-1306483835-3488378134)" d="M301 418c131.6 0 205.2-14.2 362.228-69.668" class="connection stroke-B1 s0" mask="url(#d2-1306483835)"/><text x="487.5" y="397" class="text-italic fill-N2 s1"><tspan x="487.5" dy="0">아래쪽 화살표</tspan><tspan x="487.5" dy="17.667">(P2) 충분한 물리적</tspan><tspan x="487.5" dy="17.667">원인이 이미 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-1306483835-3488378134)" d="M862 319h181" class="connection stroke-B1 s0" mask="url(#d2-1306483835)"/><path fill="none" marker-end="url(#mk-d2-1306483835-3488378134)" d="M1375.56 218.75C1512.8 108.8 1571.9 81 1665.5 81" class="connection stroke-B1 s0" mask="url(#d2-1306483835)"/><path fill="none" marker-end="url(#mk-d2-1306483835-3488378134)" d="M1456 319h181.5" class="connection stroke-B1 s0" mask="url(#d2-1306483835)"/><path fill="none" marker-end="url(#mk-d2-1306483835-3488378134)" d="M1370.519 421.302C1511.8 542.4 1569.9 573 1655.5 573" class="connection stroke-B1 s0" mask="url(#d2-1306483835)"/><mask id="d2-1306483835" width="2156" height="872" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2156v872H-101z"/><path d="M410 203h142v53H410zM412 381h151v53H412z"/></mask></svg>