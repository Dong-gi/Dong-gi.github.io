<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="1221" class="d2-3227167287 d2-svg" viewBox="-101 -101 1168 1221"><rect width="1168" height="1221" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3227167287 .text-bold{font-weight:700}.d2-3227167287 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3227167287 .fill-N1{fill:#0a0f25}.d2-3227167287 .fill-N2{fill:#676c7e}.d2-3227167287 .fill-B6{fill:#f7f8fe}.d2-3227167287 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M165 24h272v114H165z" class="stroke-B1 fill-B6 s0"/></g><text x="301" y="62.5" class="text-bold fill-N1 s1"><tspan x="301" dy="0">마음 사건 — 아픔</tspan><tspan x="301" dy="17.25">비환원적 물리주의는</tspan><tspan x="301" dy="17.25">이 속성이 물리 속성으로</tspan><tspan x="301" dy="17.25">환원되지 않는다고 말한다</tspan></text></g><g ><g class="shape"><path d="M497 0h299v162H497z" class="stroke-B1 fill-B6 s0"/></g><text x="646.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="646.5" dy="0">물리 사건 —</tspan><tspan x="646.5" dy="16.714">그 아픔을 실현하는 신경 상태</tspan><tspan x="646.5" dy="16.714">마음 사건 칸의 마음 속성이</tspan><tspan x="646.5" dy="16.714">수반하는 기초이고,</tspan><tspan x="646.5" dy="16.714">인과적 폐쇄에 따라</tspan><tspan x="646.5" dy="16.714">이것만으로 결과를 낳기에</tspan><tspan x="646.5" dy="16.714">충분하다</tspan></text></g><g ><g class="shape"><ellipse cx="473.5" cy="338" class="shape stroke-B1 fill-B6 s0" rx="113.5" ry="39"/></g><text x="473.5" y="335.5" class="text-bold fill-N1 s1"><tspan x="473.5" dy="0">물리적 결과 —</tspan><tspan x="473.5" dy="18.5">신음</tspan></text></g><g ><g class="shape"><ellipse cx="473.5" cy="601" class="shape stroke-B1 fill-B6 s0" rx="203.5" ry="124"/></g><text x="473.5" y="542.5" class="text-bold fill-N1 s1"><tspan x="473.5" dy="0">그러면 (P1) 화살표가</tspan><tspan x="473.5" dy="16.556">설 자리가 있는가</tspan><tspan x="473.5" dy="16.556">(P3) 환원되지 않는다면</tspan><tspan x="473.5" dy="16.556">두 원인은 서로 다른 둘이다.</tspan><tspan x="473.5" dy="16.556">(P4) 한 결과에 충분한 원인이</tspan><tspan x="473.5" dy="16.556">둘 있는 것은 과잉결정이고,</tspan><tspan x="473.5" dy="16.556">과잉결정은 특별한 경우이지</tspan><tspan x="473.5" dy="16.556">일상이 아니다.</tspan><tspan x="473.5" dy="16.556">(C) 그러므로 (P1) 이 위태롭다</tspan></text></g><g ><g class="shape"><path d="M0 841h257v162H0z" class="stroke-B1 fill-B6 s0"/></g><text x="128.5" y="879.5" class="text-bold fill-N1 s1"><tspan x="128.5" dy="0">선택지 ① (P3) 을 끊는다</tspan><tspan x="128.5" dy="16.714">환원을 받아들이고</tspan><tspan x="128.5" dy="16.714">환원적 물리주의로 간다.</tspan><tspan x="128.5" dy="16.714">값 — 다수 실현을</tspan><tspan x="128.5" dy="16.714">처리해야 한다.</tspan><tspan x="128.5" dy="16.714">종 상대적 환원이</tspan><tspan x="128.5" dy="16.714">표준 대응이다</tspan></text></g><g ><g class="shape"><path d="M317 825h313v194H317z" class="stroke-B1 fill-B6 s0"/></g><text x="473.5" y="863.5" class="text-bold fill-N1 s1"><tspan x="473.5" dy="0">선택지 ② (P4) 를 끊는다</tspan><tspan x="473.5" dy="16.556">이런 종류의 겹침은</tspan><tspan x="473.5" dy="16.556">경쟁이 아니라고 논증한다.</tspan><tspan x="473.5" dy="16.556">조각상이 유리창을</tspan><tspan x="473.5" dy="16.556">깨는 것과 그 청동 덩어리가</tspan><tspan x="473.5" dy="16.556">유리창을 깨는 것이</tspan><tspan x="473.5" dy="16.556">두 개의 인과가 아니듯이.</tspan><tspan x="473.5" dy="16.556">값 — 오늘 가장 활발한 길이되</tspan><tspan x="473.5" dy="16.556">성공했는지는 정해지지 않았다</tspan></text></g><g ><g class="shape"><path d="M690 825h276v194H690z" class="stroke-B1 fill-B6 s0"/></g><text x="828" y="863.5" class="text-bold fill-N1 s1"><tspan x="828" dy="0">선택지 ③ (P1) 을 포기한다</tspan><tspan x="828" dy="16.556">마음은 물리적 결과를</tspan><tspan x="828" dy="16.556">낳지 않는다.</tspan><tspan x="828" dy="16.556">부수현상론으로 간다.</tspan><tspan x="828" dy="16.556">값 — 이원론이 걸렸던</tspan><tspan x="828" dy="16.556">자리로 되돌아간다.</tspan><tspan x="828" dy="16.556">물리주의자에게도 정신적</tspan><tspan x="828" dy="16.556">인과 문제가 그대로 있다는</tspan><tspan x="828" dy="16.556">것이 이 논증의 요점이다</tspan></text></g><marker id="mk-d2-3227167287-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3227167287-3488378134)" d="M301 139.5c0 72.4 23.2 105.7 112.621 162.36" class="connection stroke-B1 s0" mask="url(#d2-3227167287)"/><text x="323" y="241" class="text-italic fill-N2 s1"><tspan x="323" dy="0">(P1) 아픔이</tspan><tspan x="323" dy="18.5">신음을 일으킨다</tspan></text><path fill="none" marker-end="url(#mk-d2-3227167287-3488378134)" d="M646.5 163.5c0 53.2-23.3 81.7-113.117 138.366" class="connection stroke-B1 s0" mask="url(#d2-3227167287)"/><text x="615.5" y="248" class="text-italic fill-N2 s1"><tspan x="615.5" dy="0">(P2) 충분한 물리적</tspan><tspan x="615.5" dy="18.5">원인이 이미 있다</tspan></text><path fill="none" marker-end="url(#mk-d2-3227167287-3488378134)" d="M473.98 379c-.38 38-.38 58-.02 94" class="connection stroke-B1 s0" mask="url(#d2-3227167287)"/><path fill="none" marker-end="url(#mk-d2-3227167287-3488378134)" d="M315.21 681.893C166.2 756.2 128.5 788.2 128.5 837" class="connection stroke-B1 s0" mask="url(#d2-3227167287)"/><path fill="none" marker-end="url(#mk-d2-3227167287-3488378134)" d="M473.98 727c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-3227167287)"/><path fill="none" marker-end="url(#mk-d2-3227167287-3488378134)" d="M633.796 679.88C788.8 755.8 828 785 828 821" class="connection stroke-B1 s0" mask="url(#d2-3227167287)"/><mask id="d2-3227167287" width="1168" height="1221" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1168v1221H-101z"/><path d="M252 225h142v37H252zM540 232h151v37H540z"/></mask></svg>