<svg xmlns="http://www.w3.org/2000/svg" width="983" height="1087" class="d2-2781846973 d2-svg" viewBox="-101 -101 983 1087"><rect width="983" height="1087" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2781846973 .fill-N1{fill:#0a0f25}.d2-2781846973 .fill-N2{fill:#676c7e}.d2-2781846973 .fill-B6{fill:#f7f8fe}.d2-2781846973 .stroke-B1,.d2-2781846973 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="171.5" cy="30" class="shape stroke-B1 fill-B6 s0" rx="171.5" ry="30"/></g><text x="171.5" y="35.5" class="text-bold fill-N1 s1">물음 하나</text></g><g ><g class="shape"><path d="M0 130h343v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="171.5" y="176.5" class="text-bold fill-N1 s1"><tspan x="171.5" dy="0">관찰·측정·실험을 하면</tspan><tspan x="171.5" dy="18.5">어느 쪽인지 정해지는가</tspan></text></g><g ><g class="shape"><path d="M483 130h298v98H483z" class="stroke-B2 fill-B6 s2"/></g><text x="632" y="168.5" class="text-bold fill-N1 s1"><tspan x="632" dy="0">경험적 물음</tspan><tspan x="632" dy="17.667">물이 몇 도에서 끓는가</tspan><tspan x="632" dy="17.667">→ 과학이 답한다</tspan></text></g><g ><g class="shape"><path d="M0 298h343v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="171.5" y="344.5" class="text-bold fill-N1 s1"><tspan x="171.5" dy="0">계산이나 증명으로</tspan><tspan x="171.5" dy="18.5">결판나는가</tspan></text></g><g ><g class="shape"><path d="M483 298h298v98H483z" class="stroke-B2 fill-B6 s2"/></g><text x="632" y="336.5" class="text-bold fill-N1 s1"><tspan x="632" dy="0">형식적 물음</tspan><tspan x="632" dy="17.667">소수가 무한히 많은가</tspan><tspan x="632" dy="17.667">→ 수학·논리가 답한다</tspan></text></g><g ><g class="shape"><path d="M0 466h343v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="171.5" y="512.5" class="text-bold fill-N1 s1"><tspan x="171.5" dy="0">낱말의 뜻을 정하기로 약속하면</tspan><tspan x="171.5" dy="18.5">물음 자체가 사라지는가</tspan></text></g><g ><g class="shape"><path d="M483 466h298v98H483z" class="stroke-B2 fill-B6 s2"/></g><text x="632" y="504.5" class="text-bold fill-N1 s1"><tspan x="632" dy="0">말의 문제</tspan><tspan x="632" dy="17.667">‘야채’ 에 버섯이 들어가는가</tspan><tspan x="632" dy="17.667">→ 정의를 정하면 끝난다</tspan></text></g><g ><g class="shape"><path d="M0 634h343v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="171.5" y="672.5" class="text-bold fill-N1 s1"><tspan x="171.5" dy="0">철학적 물음</tspan><tspan x="171.5" dy="17.25">안다는 것은 무엇인가 /</tspan><tspan x="171.5" dy="17.25">무엇을 해야 하는가</tspan><tspan x="171.5" dy="17.25">왜 그 관찰이 그 이론을 지지하는가</tspan></text></g><text x="390" y="784" class="fill-N1 s1"><tspan x="390" dy="0">이 갈래는 고정되어 있지 않다. 물리학·심리학·언어학은 모두 철학에서 갈라져 나갔다.</tspan><tspan x="390" dy="16.714">어떤 물음에 대해 재는 방법이 생기면 그 물음은 경험적 물음 쪽으로 옮겨 간다.</tspan><tspan x="390" dy="16.714">철학에 남는 것은 ‘아직 재는 방법이 없는 것’ 과 ‘무엇을 재야 하는지를 정하는 일’ 이다</tspan><tspan x="390" dy="16.714"> </tspan><tspan x="390" dy="16.714">실제 물음은 대개 섞여 있다. ‘사형은 범죄를 줄이는가’ 는 경험적 물음이고</tspan><tspan x="390" dy="16.714">‘범죄를 줄인다면 사형이 정당한가’ 는 철학적 물음이다.</tspan><tspan x="390" dy="16.714">둘을 갈라 놓지 않으면 서로 다른 물음에 대고 서로 다른 증거를 내밀게 된다</tspan></text><marker id="mk-d2-2781846973-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2781846973-3488378134)" d="M172 62v64" class="connection stroke-B1 s0" mask="url(#d2-2781846973)"/><path fill="none" marker-end="url(#mk-d2-2781846973-3488378134)" d="M345 179h134" class="connection stroke-B1 s0" mask="url(#d2-2781846973)"/><text x="413" y="185" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-2781846973-3488378134)" d="M171.5 230v64" class="connection stroke-B1 s0" mask="url(#d2-2781846973)"/><text x="172" y="269" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-2781846973-3488378134)" d="M345 347h134" class="connection stroke-B1 s0" mask="url(#d2-2781846973)"/><text x="413" y="353" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-2781846973-3488378134)" d="M171.5 398v64" class="connection stroke-B1 s0" mask="url(#d2-2781846973)"/><text x="172" y="437" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-2781846973-3488378134)" d="M345 515h134" class="connection stroke-B1 s0" mask="url(#d2-2781846973)"/><text x="413" y="521" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-2781846973-3488378134)" d="M171.5 566v64" class="connection stroke-B1 s0" mask="url(#d2-2781846973)"/><text x="172" y="605" class="text-italic fill-N2 s1">아니오</text><mask id="d2-2781846973" width="983" height="1087" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h983V986h-983z"/><path d="M401 169h24v21h-24zM141 253h62v21h-62zM401 337h24v21h-24zM141 421h62v21h-62zM401 505h24v21h-24zM141 589h62v21h-62z"/></mask></svg>