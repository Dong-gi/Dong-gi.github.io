<svg xmlns="http://www.w3.org/2000/svg" width="2725" height="736" class="d2-145590817 d2-svg" viewBox="-101 -101 2725 736"><rect width="2725" height="736" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-145590817 .fill-N1{fill:#0a0f25}.d2-145590817 .fill-N2{fill:#676c7e}.d2-145590817 .fill-B6{fill:#f7f8fe}.d2-145590817 .stroke-B1,.d2-145590817 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="367.5" cy="278" class="shape stroke-B1 fill-B6 s0" rx="89.5" ry="30"/></g><text x="367.5" y="283.5" class="text-bold fill-N1 s1">물음 하나</text></g><g ><g class="shape"><path d="M834 237h252v82H834z" class="stroke-B1 fill-B6 s0"/></g><text x="960" y="275.5" class="text-bold fill-N1 s1"><tspan x="960" dy="0">관찰·측정·실험을 하면</tspan><tspan x="960" dy="18.5">어느 쪽인지 정해지는가</tspan></text></g><g ><g class="shape"><path d="M1257 162h209v82h-209z" class="stroke-B1 fill-B6 s0"/></g><text x="1361.5" y="200.5" class="text-bold fill-N1 s1"><tspan x="1361.5" dy="0">계산이나 증명으로</tspan><tspan x="1361.5" dy="18.5">결판나는가</tspan></text></g><g ><g class="shape"><path d="M1637 87h316v82h-316z" class="stroke-B1 fill-B6 s0"/></g><text x="1795" y="125.5" class="text-bold fill-N1 s1"><tspan x="1795" dy="0">낱말의 뜻을 정하기로 약속하면</tspan><tspan x="1795" dy="18.5">물음 자체가 사라지는가</tspan></text></g><g ><g class="shape"><path d="M1244 304h235v98h-235z" class="stroke-B2 fill-B6 s2"/></g><text x="1361.5" y="342.5" class="text-bold fill-N1 s1"><tspan x="1361.5" dy="0">경험적 물음</tspan><tspan x="1361.5" dy="17.667">물이 몇 도에서 끓는가</tspan><tspan x="1361.5" dy="17.667">→ 과학이 답한다</tspan></text></g><g ><g class="shape"><path d="M1679 229h232v98h-232z" class="stroke-B2 fill-B6 s2"/></g><text x="1795" y="267.5" class="text-bold fill-N1 s1"><tspan x="1795" dy="0">형식적 물음</tspan><tspan x="1795" dy="17.667">소수가 무한히 많은가</tspan><tspan x="1795" dy="17.667">→ 수학·논리가 답한다</tspan></text></g><g ><g class="shape"><path d="M2168 0h298v98h-298z" class="stroke-B2 fill-B6 s2"/></g><text x="2317" y="38.5" class="text-bold fill-N1 s1"><tspan x="2317" dy="0">말의 문제</tspan><tspan x="2317" dy="17.667">‘야채’ 에 버섯이 들어가는가</tspan><tspan x="2317" dy="17.667">→ 정의를 정하면 끝난다</tspan></text></g><g ><g class="shape"><path d="M2111 158h412v98h-412z" class="stroke-B1 fill-B6 s0"/></g><text x="2317" y="196.5" class="text-bold fill-N1 s1"><tspan x="2317" dy="0">철학적 물음</tspan><tspan x="2317" dy="17.667">안다는 것은 무엇인가 / 무엇을 해야 하는가</tspan><tspan x="2317" dy="17.667">왜 그 관찰이 그 이론을 지지하는가</tspan></text></g><text x="367" y="384" class="fill-N1 s1"><tspan x="367" dy="0">이 갈래는 고정되어 있지 않다. 물리학·심리학·언어학은 모두 철학에서 갈라져 나갔다.</tspan><tspan x="367" dy="17.667">어떤 물음에 대해 재는 방법이 생기면 그 물음은 경험적 물음 쪽으로 옮겨 간다.</tspan><tspan x="367" dy="17.667">철학에 남는 것은 ‘아직 재는 방법이 없는 것’ 과 ‘무엇을 재야 하는지를 정하는 일’ 이다</tspan></text><text x="367.5" y="497" class="fill-N1 s1"><tspan x="367.5" dy="0">실제 물음은 대개 섞여 있다. ‘사형은 범죄를 줄이는가’ 는 경험적 물음이고</tspan><tspan x="367.5" dy="17.667">‘범죄를 줄인다면 사형이 정당한가’ 는 철학적 물음이다.</tspan><tspan x="367.5" dy="17.667">둘을 갈라 놓지 않으면 서로 다른 물음에 대고 서로 다른 증거를 내밀게 된다</tspan></text><marker id="mk-d2-145590817-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-145590817-3488378134)" d="M459 278h371" class="connection stroke-B1 s0" mask="url(#d2-145590817)"/><path fill="none" marker-end="url(#mk-d2-145590817-3488378134)" d="M1073.878 319.687C1146.4 346.2 1180.8 353 1240 353" class="connection stroke-B1 s0" mask="url(#d2-145590817)"/><text x="1156" y="354" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-145590817-3488378134)" d="M1073.878 236.313C1146.4 209.8 1183.4 203 1253 203" class="connection stroke-B1 s0" mask="url(#d2-145590817)"/><text x="1162" y="212" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-145590817-3488378134)" d="M1467.87 243.711C1539.6 271 1582.2 278 1675 278" class="connection stroke-B1 s0" mask="url(#d2-145590817)"/><text x="1570" y="281" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-145590817-3488378134)" d="M1467.87 162.289C1539.6 135 1573.8 128 1633 128" class="connection stroke-B1 s0" mask="url(#d2-145590817)"/><text x="1549" y="139" class="text-italic fill-N2 s1">아니오</text><path fill="none" marker-end="url(#mk-d2-145590817-3488378134)" d="M1919.897 86.368C2009.2 56.599 2059.2 49 2164 49" class="connection stroke-B1 s0" mask="url(#d2-145590817)"/><text x="2040" y="57" class="text-italic fill-N2 s1">예</text><path fill="none" marker-end="url(#mk-d2-145590817-3488378134)" d="M1919.897 169.632C2009.2 199.4 2047.8 207 2107 207" class="connection stroke-B1 s0" mask="url(#d2-145590817)"/><text x="2012" y="206" class="text-italic fill-N2 s1">아니오</text><mask id="d2-145590817" width="2725" height="736" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2725v736H-101z"/><path d="M1144 338h24v21h-24zM1131 196h62v21h-62zM1558 265h24v21h-24zM1518 123h62v21h-62zM2028 41h24v21h-24zM1981 190h62v21h-62z"/></mask></svg>