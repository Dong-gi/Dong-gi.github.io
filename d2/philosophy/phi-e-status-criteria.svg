<svg xmlns="http://www.w3.org/2000/svg" width="1521" height="1037" class="d2-2374224437 d2-svg" viewBox="-89 -89 1521 1037"><rect width="1521" height="1037" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2374224437 .fill-N1{fill:#0a0f25}.d2-2374224437 .fill-B6{fill:#f7f8fe}.d2-2374224437 .stroke-B1,.d2-2374224437 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="625.5" cy="91" class="shape stroke-B1 fill-B6 s0" rx="237.5" ry="79"/></g><text x="625.5" y="88.5" class="text-bold fill-N1 s1"><tspan x="625.5" dy="0">무엇이 어떤 존재를</tspan><tspan x="625.5" dy="18.5">도덕적 고려의 대상으로 만드는가</tspan></text></g><g ><g class="shape"><path d="M34 316h191v98H34z" class="stroke-B1 fill-B6 s0"/></g><text x="129.5" y="354.5" class="text-bold fill-N1 s1"><tspan x="129.5" dy="0">기준 ①</tspan><tspan x="129.5" dy="17.667">이성 · 언어 ·</tspan><tspan x="129.5" dy="17.667">도덕적 행위 능력</tspan></text></g><g ><g class="shape"><path d="M318 316h243v98H318z" class="stroke-B1 fill-B6 s0"/></g><text x="439.5" y="354.5" class="text-bold fill-N1 s1"><tspan x="439.5" dy="0">기준 ② 쾌고 감수 능력 —</tspan><tspan x="439.5" dy="17.667">고통과 즐거움을</tspan><tspan x="439.5" dy="17.667">겪을 수 있음</tspan></text></g><g ><g class="shape"><path d="M663 300h299v130H663z" class="stroke-B1 fill-B6 s0"/></g><text x="812.5" y="338.5" class="text-bold fill-N1 s1"><tspan x="812.5" dy="0">기준 ③ 삶의 주체 —</tspan><tspan x="812.5" dy="17">믿음과 욕구와</tspan><tspan x="812.5" dy="17">미래에 대한 관심을 갖고</tspan><tspan x="812.5" dy="17">자기 삶이 자기에게</tspan><tspan x="812.5" dy="17">잘되거나 잘못될 수 있는 존재</tspan></text></g><g ><g class="shape"><path d="M1076 316h191v98h-191z" class="stroke-B1 fill-B6 s0"/></g><text x="1171.5" y="354.5" class="text-bold fill-N1 s1"><tspan x="1171.5" dy="0">기준 ④</tspan><tspan x="1171.5" dy="17.667">종의 구성원임,</tspan><tspan x="1171.5" dy="17.667">또는 관계와 소속</tspan></text></g><g ><g class="shape"><path d="M12 500h235v178H12z" class="stroke-B2 fill-B6 s2"/></g><text x="129.5" y="538.5" class="text-bold fill-N1 s1"><tspan x="129.5" dy="0">가장자리 사례 논증에</tspan><tspan x="129.5" dy="16.625">걸린다.</tspan><tspan x="129.5" dy="16.625">이 능력을 갖추지 못한</tspan><tspan x="129.5" dy="16.625">사람들이 있는데</tspan><tspan x="129.5" dy="16.625">우리는 그들을</tspan><tspan x="129.5" dy="16.625">밖에 두지 않는다.</tspan><tspan x="129.5" dy="16.625">그러면 이 능력이</tspan><tspan x="129.5" dy="16.625">지위의 근거일 수 없다</tspan></text></g><g ><g class="shape"><path d="M267 500h346v210H267z" class="stroke-B2 fill-B6 s2"/></g><text x="440" y="538.5" class="text-bold fill-N1 s1"><tspan x="440" dy="0">벤담이 물음을 이렇게 옮겼다 —</tspan><tspan x="440" dy="16.5">그들이 따져 볼 수 있는가도,</tspan><tspan x="440" dy="16.5">말할 수 있는가도 아니고</tspan><tspan x="440" dy="16.5">괴로워할 수 있는가다.</tspan><tspan x="440" dy="16.5">싱어의 이익 평등 고려는</tspan><tspan x="440" dy="16.5">여기서 나온다.</tspan><tspan x="440" dy="16.5">부담 — 어디까지가</tspan><tspan x="440" dy="16.5">쾌고 감수 능력인지 경계가 흐리고,</tspan><tspan x="440" dy="16.5">지위를 정도의 문제로 만들면</tspan><tspan x="440" dy="16.5">다시 선을 그어야 한다</tspan></text></g><g ><g class="shape"><path d="M633 500h359v210H633z" class="stroke-B2 fill-B6 s2"/></g><text x="812.5" y="538.5" class="text-bold fill-N1 s1"><tspan x="812.5" dy="0">리건의 길이다.</tspan><tspan x="812.5" dy="16.5">지위를 총합으로 상쇄할 수 없는</tspan><tspan x="812.5" dy="16.5">내재적 가치로 잡는다.</tspan><tspan x="812.5" dy="16.5">싱어와 결론은 자주 겹치지만</tspan><tspan x="812.5" dy="16.5">이유가 다르고, 갈리는 자리도 있다 —</tspan><tspan x="812.5" dy="16.5">총합으로도 정당화되지 않는 것을</tspan><tspan x="812.5" dy="16.5">리건은 금지하고</tspan><tspan x="812.5" dy="16.5">싱어는 경우에 따라 허용한다.</tspan><tspan x="812.5" dy="16.5">부담 — 이 조건에 미치지 못하는</tspan><tspan x="812.5" dy="16.5">동물을 어떻게 하는가</tspan></text></g><g ><g class="shape"><path d="M1012 500h319v210h-319z" class="stroke-B2 fill-B6 s2"/></g><text x="1171.5" y="538.5" class="text-bold fill-N1 s1"><tspan x="1171.5" dy="0">가장자리 사례 논증을</tspan><tspan x="1171.5" dy="16.5">정면으로 받는다.</tspan><tspan x="1171.5" dy="16.5">관계와 소속이 실제로</tspan><tspan x="1171.5" dy="16.5">의무를 낳는다는 것은</tspan><tspan x="1171.5" dy="16.5">다른 데서도 인정된다.</tspan><tspan x="1171.5" dy="16.5">부담 — 왜 하필 종이</tspan><tspan x="1171.5" dy="16.5">그런 관계인지를 대야 한다.</tspan><tspan x="1171.5" dy="16.5">같은 논법이 다른 집단 경계에도</tspan><tspan x="1171.5" dy="16.5">쓰일 수 있다는 것이</tspan><tspan x="1171.5" dy="16.5">이 자리의 위험이다</tspan></text></g><text x="671.5" y="746" class="fill-N1 s1"><tspan x="671.5" dy="0">지위를 묻지 않는 길도 있다. 덕 윤리는 잔인함이라는 악덕에서 시작한다 —</tspan><tspan x="671.5" dy="16.714">동물을 함부로 대하는 사람에게 무엇이 잘못되었는가를 묻는다.</tspan><tspan x="671.5" dy="16.714">반론 — 그러면 동물 자신을 위한 이유가 아니라 우리 자신에 관한 이유가 된다.</tspan><tspan x="671.5" dy="16.714">계약주의는 합당한 거부를 할 수 없는 존재를 다루기 어려워 다른 근거를 찾아야 한다</tspan><tspan x="671.5" dy="16.714"> </tspan><tspan x="671.5" dy="16.714">폭넓게 받아들여지는 것 — 어떤 형태로든 동물의 이익이 도덕적으로 고려되어야 한다.</tspan><tspan x="671.5" dy="16.714">갈리는 것 — 무엇이 근거이고 어디까지이며 어떤 무게인가. 이 자리는 미결이다</tspan></text><marker id="mk-d2-2374224437-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2374224437-3488378134)" d="m483.991 156-.196 44s-.045 10-10.045 10H139.5s-10 0-10 10v92" class="connection stroke-B1 s0" mask="url(#d2-2374224437)"/><path fill="none" marker-end="url(#mk-d2-2374224437-3488378134)" d="m578.995 170-.218 80s-.027 10-10.027 10H450s-10 0-10 10v42" class="connection stroke-B1 s0" mask="url(#d2-2374224437)"/><path fill="none" marker-end="url(#mk-d2-2374224437-3488378134)" d="m673.996 170-.238 126" class="connection stroke-B1 s0" mask="url(#d2-2374224437)"/><path fill="none" marker-end="url(#mk-d2-2374224437-3488378134)" d="m768.991 156-.196 44s-.045 10 9.955 10h382.75s10 0 10 10v92" class="connection stroke-B1 s0" mask="url(#d2-2374224437)"/><path fill="none" marker-end="url(#mk-d2-2374224437-3488378134)" d="M129.5 416v80" class="connection stroke-B1 s0" mask="url(#d2-2374224437)"/><path fill="none" marker-end="url(#mk-d2-2374224437-3488378134)" d="M440 416v80" class="connection stroke-B1 s0" mask="url(#d2-2374224437)"/><path fill="none" marker-end="url(#mk-d2-2374224437-3488378134)" d="M812.5 432v64" class="connection stroke-B1 s0" mask="url(#d2-2374224437)"/><path fill="none" marker-end="url(#mk-d2-2374224437-3488378134)" d="M1171.5 416v80" class="connection stroke-B1 s0" mask="url(#d2-2374224437)"/><mask id="d2-2374224437" width="1521" height="1037" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1521V948H-89z"/></mask></svg>