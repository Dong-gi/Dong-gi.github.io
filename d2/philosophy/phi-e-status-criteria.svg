<svg xmlns="http://www.w3.org/2000/svg" width="2433" height="850" class="d2-2441743194 d2-svg" viewBox="-101 -101 2433 850"><rect width="2433" height="850" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2441743194 .fill-N1{fill:#0a0f25}.d2-2441743194 .fill-B6{fill:#f7f8fe}.d2-2441743194 .stroke-B1,.d2-2441743194 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="359.5" cy="302" class="shape stroke-B1 fill-B6 s0" rx="359.5" ry="120"/></g><text x="359.5" y="307.5" class="text-bold fill-N1 s1">무엇이 어떤 존재를 도덕적 고려의 대상으로 만드는가</text></g><g ><g class="shape"><path d="M914 16h353v66H914z" class="stroke-B1 fill-B6 s0"/></g><text x="1090.5" y="54.5" class="text-bold fill-N1 s1">기준 ① 이성 · 언어 · 도덕적 행위 능력</text></g><g ><g class="shape"><path d="M840 182h502v66H840z" class="stroke-B1 fill-B6 s0"/></g><text x="1091" y="220.5" class="text-bold fill-N1 s1">기준 ② 쾌고 감수 능력 — 고통과 즐거움을 겪을 수 있음</text></g><g ><g class="shape"><path d="M819 348h543v82H819z" class="stroke-B1 fill-B6 s0"/></g><text x="1090.5" y="386.5" class="text-bold fill-N1 s1"><tspan x="1090.5" dy="0">기준 ③ 삶의 주체 — 믿음과 욕구와 미래에 대한 관심을 갖고</tspan><tspan x="1090.5" dy="18.5">자기 삶이 자기에게 잘되거나 잘못될 수 있는 존재</tspan></text></g><g ><g class="shape"><path d="M900 530h382v66H900z" class="stroke-B1 fill-B6 s0"/></g><text x="1091" y="568.5" class="text-bold fill-N1 s1">기준 ④ 종의 구성원임, 또는 관계와 소속</text></g><g ><g class="shape"><path d="M1513 0h667v98h-667z" class="stroke-B2 fill-B6 s2"/></g><text x="1846.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1846.5" dy="0">가장자리 사례 논증에 걸린다.</tspan><tspan x="1846.5" dy="17.667">이 능력을 갖추지 못한 사람들이 있는데 우리는 그들을 밖에 두지 않는다.</tspan><tspan x="1846.5" dy="17.667">그러면 이 능력이 지위의 근거일 수 없다</tspan></text></g><g ><g class="shape"><path d="M1462 158h769v114h-769z" class="stroke-B2 fill-B6 s2"/></g><text x="1846.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="1846.5" dy="0">벤담이 물음을 이렇게 옮겼다 — 그들이 따져 볼 수 있는가도, 말할 수 있는가도 아니고</tspan><tspan x="1846.5" dy="17.25">괴로워할 수 있는가다. 싱어의 이익 평등 고려는 여기서 나온다.</tspan><tspan x="1846.5" dy="17.25">부담 — 어디까지가 쾌고 감수 능력인지 경계가 흐리고,</tspan><tspan x="1846.5" dy="17.25">지위를 정도의 문제로 만들면 다시 선을 그어야 한다</tspan></text></g><g ><g class="shape"><path d="M1474 332h745v114h-745z" class="stroke-B2 fill-B6 s2"/></g><text x="1846.5" y="370.5" class="text-bold fill-N1 s1"><tspan x="1846.5" dy="0">리건의 길이다. 지위를 총합으로 상쇄할 수 없는 내재적 가치로 잡는다.</tspan><tspan x="1846.5" dy="17.25">싱어와 결론은 자주 겹치지만 이유가 다르고, 갈리는 자리도 있다 —</tspan><tspan x="1846.5" dy="17.25">총합으로도 정당화되지 않는 것을 리건은 금지하고 싱어는 경우에 따라 허용한다.</tspan><tspan x="1846.5" dy="17.25">부담 — 이 조건에 미치지 못하는 동물을 어떻게 하는가</tspan></text></g><g ><g class="shape"><path d="M1514 506h665v114h-665z" class="stroke-B2 fill-B6 s2"/></g><text x="1846.5" y="544.5" class="text-bold fill-N1 s1"><tspan x="1846.5" dy="0">가장자리 사례 논증을 정면으로 받는다.</tspan><tspan x="1846.5" dy="17.25">관계와 소속이 실제로 의무를 낳는다는 것은 다른 데서도 인정된다.</tspan><tspan x="1846.5" dy="17.25">부담 — 왜 하필 종이 그런 관계인지를 대야 한다.</tspan><tspan x="1846.5" dy="17.25">같은 논법이 다른 집단 경계에도 쓰일 수 있다는 것이 이 자리의 위험이다</tspan></text></g><text x="359.5" y="498" class="fill-N1 s1"><tspan x="359.5" dy="0">지위를 묻지 않는 길도 있다. 덕 윤리는 잔인함이라는 악덕에서 시작한다 —</tspan><tspan x="359.5" dy="17.25">동물을 함부로 대하는 사람에게 무엇이 잘못되었는가를 묻는다.</tspan><tspan x="359.5" dy="17.25">반론 — 그러면 동물 자신을 위한 이유가 아니라 우리 자신에 관한 이유가 된다.</tspan><tspan x="359.5" dy="17.25">계약주의는 합당한 거부를 할 수 없는 존재를 다루기 어려워 다른 근거를 찾아야 한다</tspan></text><text x="359.5" y="627" class="fill-N1 s1"><tspan x="359.5" dy="0">폭넓게 받아들여지는 것 — 어떤 형태로든 동물의 이익이 도덕적으로 고려되어야 한다.</tspan><tspan x="359.5" dy="18.5">갈리는 것 — 무엇이 근거이고 어디까지이며 어떤 무게인가. 이 자리는 미결이다</tspan></text><marker id="mk-d2-2441743194-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2441743194-3488378134)" d="M532.702 194.949C721.4 78.399 798 49 910 49" class="connection stroke-B1 s0" mask="url(#d2-2441743194)"/><path fill="none" marker-end="url(#mk-d2-2441743194-3488378134)" d="M665.954 237.572C748 219.6 783.1 215 835.5 215" class="connection stroke-B1 s0" mask="url(#d2-2441743194)"/><path fill="none" marker-end="url(#mk-d2-2441743194-3488378134)" d="M665.954 366.428C748 384.4 779 389 815 389" class="connection stroke-B1 s0" mask="url(#d2-2441743194)"/><path fill="none" marker-end="url(#mk-d2-2441743194-3488378134)" d="M527.686 409.076C720.4 532 795.1 563 895.5 563" class="connection stroke-B1 s0" mask="url(#d2-2441743194)"/><path fill="none" marker-end="url(#mk-d2-2441743194-3488378134)" d="M1269 49h240" class="connection stroke-B1 s0" mask="url(#d2-2441743194)"/><path fill="none" marker-end="url(#mk-d2-2441743194-3488378134)" d="M1344.5 215H1458" class="connection stroke-B1 s0" mask="url(#d2-2441743194)"/><path fill="none" marker-end="url(#mk-d2-2441743194-3488378134)" d="M1364 389h106" class="connection stroke-B1 s0" mask="url(#d2-2441743194)"/><path fill="none" marker-end="url(#mk-d2-2441743194-3488378134)" d="M1284.5 563H1510" class="connection stroke-B1 s0" mask="url(#d2-2441743194)"/><mask id="d2-2441743194" width="2433" height="850" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2433v850H-101z"/></mask></svg>