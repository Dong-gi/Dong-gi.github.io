<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1261" class="d2-110813549 d2-svg" viewBox="-89 -89 1220 1261"><rect width="1220" height="1261" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-110813549 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-110813549 .fill-N1{fill:#0a0f25}.d2-110813549 .fill-B6{fill:#f7f8fe}.d2-110813549 .stroke-B1,.d2-110813549 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="516.5" cy="91" class="shape stroke-B1 fill-B6 s0" rx="237.5" ry="79"/></g><text x="516.5" y="88.5" class="text-bold fill-N1 s1"><tspan x="516.5" dy="0">무엇이 어떤 존재를</tspan><tspan x="516.5" dy="18.5">도덕적 고려의 대상으로 만드는가</tspan></text></g><g ><g class="shape"><path d="M34 332h191v98H34z" class="stroke-B1 fill-B6 s0"/></g><text x="129.5" y="370.5" class="text-bold fill-N1 s1"><tspan x="129.5" dy="0">기준 ①</tspan><tspan x="129.5" dy="17.667">이성 · 언어 ·</tspan><tspan x="129.5" dy="17.667">도덕적 행위 능력</tspan></text></g><g ><g class="shape"><path d="M291 324h188v114H291z" class="stroke-B1 fill-B6 s0"/></g><text x="385" y="362.5" class="text-bold fill-N1 s1"><tspan x="385" dy="0">기준 ②</tspan><tspan x="385" dy="17.25">쾌고 감수 능력 —</tspan><tspan x="385" dy="17.25">고통과 즐거움을</tspan><tspan x="385" dy="17.25">겪을 수 있음</tspan></text></g><g ><g class="shape"><path d="M542 300h212v162H542z" class="stroke-B1 fill-B6 s0"/></g><text x="648" y="338.5" class="text-bold fill-N1 s1"><tspan x="648" dy="0">기준 ③ 삶의 주체 —</tspan><tspan x="648" dy="16.714">믿음과 욕구와</tspan><tspan x="648" dy="16.714">미래에 대한</tspan><tspan x="648" dy="16.714">관심을 갖고</tspan><tspan x="648" dy="16.714">자기 삶이 자기에게</tspan><tspan x="648" dy="16.714">잘되거나 잘못될 수</tspan><tspan x="648" dy="16.714">있는 존재</tspan></text></g><g ><g class="shape"><path d="M816 332h191v98H816z" class="stroke-B1 fill-B6 s0"/></g><text x="911.5" y="370.5" class="text-bold fill-N1 s1"><tspan x="911.5" dy="0">기준 ④</tspan><tspan x="911.5" dy="17.667">종의 구성원임,</tspan><tspan x="911.5" dy="17.667">또는 관계와 소속</tspan></text></g><g ><g class="shape"><path d="M12 532h235v178H12z" class="stroke-B2 fill-B6 s2"/></g><text x="129.5" y="570.5" class="text-bold fill-N1 s1"><tspan x="129.5" dy="0">가장자리 사례 논증에</tspan><tspan x="129.5" dy="16.625">걸린다.</tspan><tspan x="129.5" dy="16.625">이 능력을 갖추지 못한</tspan><tspan x="129.5" dy="16.625">사람들이 있는데</tspan><tspan x="129.5" dy="16.625">우리는 그들을</tspan><tspan x="129.5" dy="16.625">밖에 두지 않는다.</tspan><tspan x="129.5" dy="16.625">그러면 이 능력이</tspan><tspan x="129.5" dy="16.625">지위의 근거일 수 없다</tspan></text></g><g ><g class="shape"><path d="M267 532h237v290H267z" class="stroke-B2 fill-B6 s2"/></g><text x="385.5" y="570.5" class="text-bold fill-N1 s1"><tspan x="385.5" dy="0">벤담이 물음을</tspan><tspan x="385.5" dy="16.333">이렇게 옮겼다 —</tspan><tspan x="385.5" dy="16.333">그들이 따져 볼 수</tspan><tspan x="385.5" dy="16.333">있는가도,</tspan><tspan x="385.5" dy="16.333">말할 수 있는가도</tspan><tspan x="385.5" dy="16.333">아니고</tspan><tspan x="385.5" dy="16.333">괴로워할 수 있는가다.</tspan><tspan x="385.5" dy="16.333">싱어의 이익 평등</tspan><tspan x="385.5" dy="16.333">고려는 여기서 나온다.</tspan><tspan x="385.5" dy="16.333">부담 — 어디까지가</tspan><tspan x="385.5" dy="16.333">쾌고 감수 능력인지</tspan><tspan x="385.5" dy="16.333">경계가 흐리고,</tspan><tspan x="385.5" dy="16.333">지위를 정도의 문제로</tspan><tspan x="385.5" dy="16.333">만들면 다시 선을</tspan><tspan x="385.5" dy="16.333">그어야 한다</tspan></text></g><g ><g class="shape"><path d="M524 532h249v306H524z" class="stroke-B2 fill-B6 s2"/></g><text x="648.5" y="570.5" class="text-bold fill-N1 s1"><tspan x="648.5" dy="0">리건의 길이다.</tspan><tspan x="648.5" dy="16.313">지위를 총합으로</tspan><tspan x="648.5" dy="16.313">상쇄할 수 없는</tspan><tspan x="648.5" dy="16.313">내재적 가치로 잡는다.</tspan><tspan x="648.5" dy="16.313">싱어와 결론은</tspan><tspan x="648.5" dy="16.313">자주 겹치지만</tspan><tspan x="648.5" dy="16.313">이유가 다르고,</tspan><tspan x="648.5" dy="16.313">갈리는 자리도 있다 —</tspan><tspan x="648.5" dy="16.313">총합으로도 정당화되지</tspan><tspan x="648.5" dy="16.313">않는 것을</tspan><tspan x="648.5" dy="16.313">리건은 금지하고</tspan><tspan x="648.5" dy="16.313">싱어는 경우에 따라</tspan><tspan x="648.5" dy="16.313">허용한다.</tspan><tspan x="648.5" dy="16.313">부담 — 이 조건에</tspan><tspan x="648.5" dy="16.313">미치지 못하는</tspan><tspan x="648.5" dy="16.313">동물을 어떻게 하는가</tspan></text></g><g ><g class="shape"><path d="M793 532h237v242H793z" class="stroke-B2 fill-B6 s2"/></g><text x="911.5" y="570.5" class="text-bold fill-N1 s1"><tspan x="911.5" dy="0">가장자리 사례 논증을</tspan><tspan x="911.5" dy="16.417">정면으로 받는다.</tspan><tspan x="911.5" dy="16.417">관계와 소속이 실제로</tspan><tspan x="911.5" dy="16.417">의무를 낳는다는 것은</tspan><tspan x="911.5" dy="16.417">다른 데서도 인정된다.</tspan><tspan x="911.5" dy="16.417">부담 — 왜 하필 종이</tspan><tspan x="911.5" dy="16.417">그런 관계인지를</tspan><tspan x="911.5" dy="16.417">대야 한다.</tspan><tspan x="911.5" dy="16.417">같은 논법이</tspan><tspan x="911.5" dy="16.417">다른 집단 경계에도</tspan><tspan x="911.5" dy="16.417">쓰일 수 있다는 것이</tspan><tspan x="911.5" dy="16.417">이 자리의 위험이다</tspan></text></g><text x="520.5" y="874" class="fill-N1 s1"><tspan x="520.5" dy="0">지위를 묻지 않는 길도 있다.</tspan><tspan x="520.5" dy="16.385">덕 윤리는 잔인함이라는 악덕에서 시작한다 —</tspan><tspan x="520.5" dy="16.385">동물을 함부로 대하는 사람에게</tspan><tspan x="520.5" dy="16.385">무엇이 잘못되었는가를 묻는다.</tspan><tspan x="520.5" dy="16.385">반론 — 그러면 동물 자신을 위한 이유가 아니라</tspan><tspan x="520.5" dy="16.385">우리 자신에 관한 이유가 된다.</tspan><tspan x="520.5" dy="16.385">계약주의는 합당한 거부를 할 수 없는 존재를</tspan><tspan x="520.5" dy="16.385">다루기 어려워 다른 근거를 찾아야 한다</tspan><tspan x="520.5" dy="16.385"> </tspan><tspan x="520.5" dy="16.385">폭넓게 받아들여지는 것 — 어떤 형태로든</tspan><tspan x="520.5" dy="16.385">동물의 이익이 도덕적으로 고려되어야 한다.</tspan><tspan x="520.5" dy="16.385">갈리는 것 — 무엇이 근거이고 어디까지이며</tspan><tspan x="520.5" dy="16.385">어떤 무게인가. 이 자리는 미결이다</tspan></text><marker id="mk-d2-110813549-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-110813549-3488378134)" d="m374.982 156-.393 44s-.089 10-10.089 10h-225s-10 0-10 10v108" class="connection stroke-B1 s0" mask="url(#d2-110813549)"/><path fill="none" marker-end="url(#mk-d2-110813549-3488378134)" d="m469.99 170-.436 80s-.054 10-10.054 10h-64s-10 0-10 10v50" class="connection stroke-B1 s0" mask="url(#d2-110813549)"/><path fill="none" marker-end="url(#mk-d2-110813549-3488378134)" d="m564.992 170-.477 126" class="connection stroke-B1 s0" mask="url(#d2-110813549)"/><path fill="none" marker-end="url(#mk-d2-110813549-3488378134)" d="m659.982 156-.393 44s-.089 10 9.911 10h232s10 0 10 10v108" class="connection stroke-B1 s0" mask="url(#d2-110813549)"/><path fill="none" marker-end="url(#mk-d2-110813549-3488378134)" d="M129.5 432v96" class="connection stroke-B1 s0" mask="url(#d2-110813549)"/><path fill="none" marker-end="url(#mk-d2-110813549-3488378134)" d="M385.5 440v88" class="connection stroke-B1 s0" mask="url(#d2-110813549)"/><path fill="none" marker-end="url(#mk-d2-110813549-3488378134)" d="M648.5 464v64" class="connection stroke-B1 s0" mask="url(#d2-110813549)"/><path fill="none" marker-end="url(#mk-d2-110813549-3488378134)" d="M911.5 432v96" class="connection stroke-B1 s0" mask="url(#d2-110813549)"/><mask id="d2-110813549" width="1220" height="1261" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1220v1261H-89z"/></mask></svg>