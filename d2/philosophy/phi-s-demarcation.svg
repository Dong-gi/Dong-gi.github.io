<svg xmlns="http://www.w3.org/2000/svg" width="1173" height="990" class="d2-2474189588 d2-svg" viewBox="-101 -101 1173 990"><rect width="1173" height="990" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2474189588 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2474189588 .fill-N1{fill:#0a0f25}.d2-2474189588 .fill-B6{fill:#f7f8fe}.d2-2474189588 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="131" cy="374.5" class="shape stroke-B1 fill-B6 s0" rx="131" ry="51.5"/></g><text x="131" y="364" class="text-bold fill-N1 s1"><tspan x="131" dy="0">무엇이 과학이고</tspan><tspan x="131" dy="17.667">무엇이 과학이</tspan><tspan x="131" dy="17.667">아닌가</tspan></text></g><g ><g class="shape"><path d="M403 0h171v130H403z" class="stroke-B1 fill-B6 s0"/></g><text x="488.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">후보 1 —</tspan><tspan x="488.5" dy="17">검증 가능성</tspan><tspan x="488.5" dy="17">관찰로 참임을</tspan><tspan x="488.5" dy="17">보일 수 있어야</tspan><tspan x="488.5" dy="17">과학이다</tspan></text></g><g ><g class="shape"><path d="M714 0h257v130H714z" class="stroke-B1 fill-B6 s0"/></g><text x="842.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="842.5" dy="0">문제 — 전칭 명제는</tspan><tspan x="842.5" dy="17">유한한 관찰로</tspan><tspan x="842.5" dy="17">참임이 보여지지 않는다.</tspan><tspan x="842.5" dy="17">그러면 자연법칙이 전부</tspan><tspan x="842.5" dy="17">과학 바깥으로 밀려난다</tspan></text></g><g ><g class="shape"><path d="M372 198h232v130H372z" class="stroke-B1 fill-B6 s0"/></g><text x="488" y="236.5" class="text-bold fill-N1 s1"><tspan x="488" dy="0">후보 2 —</tspan><tspan x="488" dy="17">반증 가능성 (포퍼)</tspan><tspan x="488" dy="17">거짓으로 만들 관찰을</tspan><tspan x="488" dy="17">미리 말할 수 있어야</tspan><tspan x="488" dy="17">과학이다</tspan></text></g><g ><g class="shape"><path d="M715 190h255v146H715z" class="stroke-B1 fill-B6 s0"/></g><text x="842.5" y="228.5" class="text-bold fill-N1 s1"><tspan x="842.5" dy="0">문제 — 실제 검사는</tspan><tspan x="842.5" dy="16.833">가설 하나가 아니라</tspan><tspan x="842.5" dy="16.833">묶음을 검사한다.</tspan><tspan x="842.5" dy="16.833">예측이 빗나가도</tspan><tspan x="842.5" dy="16.833">묶음의 어디가 틀렸는지</tspan><tspan x="842.5" dy="16.833">논리가 정해 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M362 388h252v194H362z" class="stroke-B1 fill-B6 s0"/></g><text x="488" y="426.5" class="text-bold fill-N1 s1"><tspan x="488" dy="0">후보 3 —</tspan><tspan x="488" dy="16.556">연구 프로그램의 진행성</tspan><tspan x="488" dy="16.556">(라카토슈)</tspan><tspan x="488" dy="16.556">새 예측을 내놓고</tspan><tspan x="488" dy="16.556">그중 일부가 맞으면</tspan><tspan x="488" dy="16.556">진행적이고,</tspan><tspan x="488" dy="16.556">실패를 뒤늦게</tspan><tspan x="488" dy="16.556">땜질만 하면</tspan><tspan x="488" dy="16.556">퇴행적이다</tspan></text></g><g ><g class="shape"><path d="M724 412h237v146H724z" class="stroke-B1 fill-B6 s0"/></g><text x="842.5" y="450.5" class="text-bold fill-N1 s1"><tspan x="842.5" dy="0">문제 — 진행인지</tspan><tspan x="842.5" dy="16.833">퇴행인지는</tspan><tspan x="842.5" dy="16.833">시간이 지나야 갈린다.</tspan><tspan x="842.5" dy="16.833">지금 이것이</tspan><tspan x="842.5" dy="16.833">과학이냐는 물음에</tspan><tspan x="842.5" dy="16.833">답하지 못한다</tspan></text></g><g ><g class="shape"><path d="M370 642h237v146H370z" class="stroke-B1 fill-B6 s0"/></g><text x="488.5" y="680.5" class="text-bold fill-N1 s1"><tspan x="488.5" dy="0">후보 4 —</tspan><tspan x="488.5" dy="16.833">하나의 기준은 없다</tspan><tspan x="488.5" dy="16.833">‘과학’ 은 방법 하나로</tspan><tspan x="488.5" dy="16.833">묶이는 것이 아니다.</tspan><tspan x="488.5" dy="16.833">주장은 하나하나 따로</tspan><tspan x="488.5" dy="16.833">평가하면 된다</tspan></text></g><g ><g class="shape"><path d="M747 650h191v130H747z" class="stroke-B1 fill-B6 s0"/></g><text x="842.5" y="688.5" class="text-bold fill-N1 s1"><tspan x="842.5" dy="0">문제 — 그러면</tspan><tspan x="842.5" dy="17">교육과 정책에서</tspan><tspan x="842.5" dy="17">무엇을 과학으로</tspan><tspan x="842.5" dy="17">다룰지에</tspan><tspan x="842.5" dy="17">답을 주지 못한다</tspan></text></g><marker id="mk-d2-2474189588-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2474189588-3488378134)" d="M161.012 322.275C281.6 116.8 330.1 65 398.5 65" class="connection stroke-B1 s0" mask="url(#d2-2474189588)"/><path fill="none" marker-end="url(#mk-d2-2474189588-3488378134)" d="M576.5 65H710" class="connection stroke-B1 s0" mask="url(#d2-2474189588)"/><path fill="none" marker-end="url(#mk-d2-2474189588-3488378134)" d="M202.705 329.955C289.8 276.6 324 263 368 263" class="connection stroke-B1 s0" mask="url(#d2-2474189588)"/><path fill="none" marker-end="url(#mk-d2-2474189588-3488378134)" d="M606 263h105" class="connection stroke-B1 s0" mask="url(#d2-2474189588)"/><path fill="none" marker-end="url(#mk-d2-2474189588-3488378134)" d="M203.708 419.04C290 471.6 322 485 358 485" class="connection stroke-B1 s0" mask="url(#d2-2474189588)"/><path fill="none" marker-end="url(#mk-d2-2474189588-3488378134)" d="M616 485h104" class="connection stroke-B1 s0" mask="url(#d2-2474189588)"/><path fill="none" marker-end="url(#mk-d2-2474189588-3488378134)" d="M158.938 426.766C281.2 657 323.5 715 365.5 715" class="connection stroke-B1 s0" mask="url(#d2-2474189588)"/><path fill="none" marker-end="url(#mk-d2-2474189588-3488378134)" d="M609.5 715H743" class="connection stroke-B1 s0" mask="url(#d2-2474189588)"/><mask id="d2-2474189588" width="1173" height="990" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1173v990H-101z"/></mask></svg>