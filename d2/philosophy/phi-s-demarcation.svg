<svg xmlns="http://www.w3.org/2000/svg" width="1451" height="878" class="d2-3316694117 d2-svg" viewBox="-101 -101 1451 878"><rect width="1451" height="878" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3316694117 .fill-N1{fill:#0a0f25}.d2-3316694117 .fill-B6{fill:#f7f8fe}.d2-3316694117 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="163.5" cy="322.5" class="shape stroke-B1 fill-B6 s0" rx="163.5" ry="54.5"/></g><text x="163.5" y="320" class="text-bold fill-N1 s1"><tspan x="163.5" dy="0">무엇이 과학이고</tspan><tspan x="163.5" dy="18.5">무엇이 과학이 아닌가</tspan></text></g><g ><g class="shape"><path d="M439 8h299v98H439z" class="stroke-B1 fill-B6 s0"/></g><text x="588.5" y="46.5" class="text-bold fill-N1 s1"><tspan x="588.5" dy="0">후보 1 — 검증 가능성</tspan><tspan x="588.5" dy="17.667">관찰로 참임을 보일 수 있어야</tspan><tspan x="588.5" dy="17.667">과학이다</tspan></text></g><g ><g class="shape"><path d="M857 0h385v114H857z" class="stroke-B1 fill-B6 s0"/></g><text x="1049.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1049.5" dy="0">문제 — 전칭 명제는</tspan><tspan x="1049.5" dy="17.25">유한한 관찰로 참임이 보여지지 않는다.</tspan><tspan x="1049.5" dy="17.25">그러면 자연법칙이 전부</tspan><tspan x="1049.5" dy="17.25">과학 바깥으로 밀려난다</tspan></text></g><g ><g class="shape"><path d="M439 182h299v98H439z" class="stroke-B1 fill-B6 s0"/></g><text x="588.5" y="220.5" class="text-bold fill-N1 s1"><tspan x="588.5" dy="0">후보 2 — 반증 가능성 (포퍼)</tspan><tspan x="588.5" dy="17.667">거짓으로 만들 관찰을</tspan><tspan x="588.5" dy="17.667">미리 말할 수 있어야 과학이다</tspan></text></g><g ><g class="shape"><path d="M849 174h400v114H849z" class="stroke-B1 fill-B6 s0"/></g><text x="1049" y="212.5" class="text-bold fill-N1 s1"><tspan x="1049" dy="0">문제 — 실제 검사는 가설 하나가 아니라</tspan><tspan x="1049" dy="17.25">묶음을 검사한다.</tspan><tspan x="1049" dy="17.25">예측이 빗나가도 묶음의 어디가 틀렸는지</tspan><tspan x="1049" dy="17.25">논리가 정해 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M427 340h322v146H427z" class="stroke-B1 fill-B6 s0"/></g><text x="588" y="378.5" class="text-bold fill-N1 s1"><tspan x="588" dy="0">후보 3 — 연구 프로그램의 진행성</tspan><tspan x="588" dy="16.833">(라카토슈)</tspan><tspan x="588" dy="16.833">새 예측을 내놓고</tspan><tspan x="588" dy="16.833">그중 일부가 맞으면 진행적이고,</tspan><tspan x="588" dy="16.833">실패를 뒤늦게 땜질만 하면</tspan><tspan x="588" dy="16.833">퇴행적이다</tspan></text></g><g ><g class="shape"><path d="M891 356h316v114H891z" class="stroke-B1 fill-B6 s0"/></g><text x="1049" y="394.5" class="text-bold fill-N1 s1"><tspan x="1049" dy="0">문제 — 진행인지 퇴행인지는</tspan><tspan x="1049" dy="17.25">시간이 지나야 갈린다.</tspan><tspan x="1049" dy="17.25">지금 이것이 과학이냐는 물음에</tspan><tspan x="1049" dy="17.25">답하지 못한다</tspan></text></g><g ><g class="shape"><path d="M448 546h281v130H448z" class="stroke-B1 fill-B6 s0"/></g><text x="588.5" y="584.5" class="text-bold fill-N1 s1"><tspan x="588.5" dy="0">후보 4 — 하나의 기준은 없다</tspan><tspan x="588.5" dy="17">‘과학’ 은 방법 하나로</tspan><tspan x="588.5" dy="17">묶이는 것이 아니다.</tspan><tspan x="588.5" dy="17">주장은 하나하나 따로</tspan><tspan x="588.5" dy="17">평가하면 된다</tspan></text></g><g ><g class="shape"><path d="M894 562h310v98H894z" class="stroke-B1 fill-B6 s0"/></g><text x="1049" y="600.5" class="text-bold fill-N1 s1"><tspan x="1049" dy="0">문제 — 그러면 교육과 정책에서</tspan><tspan x="1049" dy="17.667">무엇을 과학으로 다룰지에</tspan><tspan x="1049" dy="17.667">답을 주지 못한다</tspan></text></g><marker id="mk-d2-3316694117-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3316694117-3488378134)" d="M207.252 268.44C342.8 99.6 389.3 57 434.5 57" class="connection stroke-B1 s0" mask="url(#d2-3316694117)"/><path fill="none" marker-end="url(#mk-d2-3316694117-3488378134)" d="M740.5 57h112" class="connection stroke-B1 s0" mask="url(#d2-3316694117)"/><path fill="none" marker-end="url(#mk-d2-3316694117-3488378134)" d="M264.843 278.224C354.2 240.6 389.3 231 434.5 231" class="connection stroke-B1 s0" mask="url(#d2-3316694117)"/><path fill="none" marker-end="url(#mk-d2-3316694117-3488378134)" d="M740.5 231H845" class="connection stroke-B1 s0" mask="url(#d2-3316694117)"/><path fill="none" marker-end="url(#mk-d2-3316694117-3488378134)" d="M265.847 366.768C354.4 403.6 387 413 423 413" class="connection stroke-B1 s0" mask="url(#d2-3316694117)"/><path fill="none" marker-end="url(#mk-d2-3316694117-3488378134)" d="M751 413h136" class="connection stroke-B1 s0" mask="url(#d2-3316694117)"/><path fill="none" marker-end="url(#mk-d2-3316694117-3488378134)" d="M203.191 376.607C342 563.8 391.1 611 443.5 611" class="connection stroke-B1 s0" mask="url(#d2-3316694117)"/><path fill="none" marker-end="url(#mk-d2-3316694117-3488378134)" d="M731.5 611H890" class="connection stroke-B1 s0" mask="url(#d2-3316694117)"/><mask id="d2-3316694117" width="1451" height="878" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1451v878H-101z"/></mask></svg>