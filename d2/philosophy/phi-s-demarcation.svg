<svg xmlns="http://www.w3.org/2000/svg" width="2125" height="742" class="d2-1994989919 d2-svg" viewBox="-101 -101 2125 742"><rect width="2125" height="742" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1994989919 .fill-N1{fill:#0a0f25}.d2-1994989919 .fill-B6{fill:#f7f8fe}.d2-1994989919 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="269" cy="258.5" class="shape stroke-B1 fill-B6 s0" rx="269" ry="89.5"/></g><text x="269" y="264" class="text-bold fill-N1 s1">무엇이 과학이고 무엇이 과학이 아닌가</text></g><g ><g class="shape"><path d="M692 0h383v82H692z" class="stroke-B1 fill-B6 s0"/></g><text x="883.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="883.5" dy="0">후보 1 — 검증 가능성</tspan><tspan x="883.5" dy="18.5">관찰로 참임을 보일 수 있어야 과학이다</tspan></text></g><g ><g class="shape"><path d="M1301 0h551v82h-551z" class="stroke-B1 fill-B6 s0"/></g><text x="1576.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1576.5" dy="0">문제 — 전칭 명제는 유한한 관찰로 참임이 보여지지 않는다.</tspan><tspan x="1576.5" dy="18.5">그러면 자연법칙이 전부 과학 바깥으로 밀려난다</tspan></text></g><g ><g class="shape"><path d="M638 142h491v82H638z" class="stroke-B1 fill-B6 s0"/></g><text x="883.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="883.5" dy="0">후보 2 — 반증 가능성 (포퍼)</tspan><tspan x="883.5" dy="18.5">거짓으로 만들 관찰을 미리 말할 수 있어야 과학이다</tspan></text></g><g ><g class="shape"><path d="M1269 142h615v82h-615z" class="stroke-B1 fill-B6 s0"/></g><text x="1576.5" y="180.5" class="text-bold fill-N1 s1"><tspan x="1576.5" dy="0">문제 — 실제 검사는 가설 하나가 아니라 묶음을 검사한다.</tspan><tspan x="1576.5" dy="18.5">예측이 빗나가도 묶음의 어디가 틀렸는지 논리가 정해 주지 않는다</tspan></text></g><g ><g class="shape"><path d="M647 284h473v98H647z" class="stroke-B1 fill-B6 s0"/></g><text x="883.5" y="322.5" class="text-bold fill-N1 s1"><tspan x="883.5" dy="0">후보 3 — 연구 프로그램의 진행성 (라카토슈)</tspan><tspan x="883.5" dy="17.667">새 예측을 내놓고 그중 일부가 맞으면 진행적이고,</tspan><tspan x="883.5" dy="17.667">실패를 뒤늦게 땜질만 하면 퇴행적이다</tspan></text></g><g ><g class="shape"><path d="M1335 292h483v82h-483z" class="stroke-B1 fill-B6 s0"/></g><text x="1576.5" y="330.5" class="text-bold fill-N1 s1"><tspan x="1576.5" dy="0">문제 — 진행인지 퇴행인지는 시간이 지나야 갈린다.</tspan><tspan x="1576.5" dy="18.5">지금 이것이 과학이냐는 물음에 답하지 못한다</tspan></text></g><g ><g class="shape"><path d="M677 442h414v98H677z" class="stroke-B1 fill-B6 s0"/></g><text x="884" y="480.5" class="text-bold fill-N1 s1"><tspan x="884" dy="0">후보 4 — 하나의 기준은 없다</tspan><tspan x="884" dy="17.667">‘과학’ 은 방법 하나로 묶이는 것이 아니다.</tspan><tspan x="884" dy="17.667">주장은 하나하나 따로 평가하면 된다</tspan></text></g><g ><g class="shape"><path d="M1229 458h694v66h-694z" class="stroke-B1 fill-B6 s0"/></g><text x="1576" y="496.5" class="text-bold fill-N1 s1">문제 — 그러면 교육과 정책에서 무엇을 과학으로 다룰지에 답을 주지 못한다</text></g><marker id="mk-d2-1994989919-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1994989919-3488378134)" d="M388.653 176.874C547.8 68.399 608.8 41 688 41" class="connection stroke-B1 s0" mask="url(#d2-1994989919)"/><path fill="none" marker-end="url(#mk-d2-1994989919-3488378134)" d="M1077 41h219.5" class="connection stroke-B1 s0" mask="url(#d2-1994989919)"/><path fill="none" marker-end="url(#mk-d2-1994989919-3488378134)" d="M490.944 206.529C568.2 187.8 598 183 634 183" class="connection stroke-B1 s0" mask="url(#d2-1994989919)"/><path fill="none" marker-end="url(#mk-d2-1994989919-3488378134)" d="M1131 183h133.5" class="connection stroke-B1 s0" mask="url(#d2-1994989919)"/><path fill="none" marker-end="url(#mk-d2-1994989919-3488378134)" d="M491.943 309.476C568.4 328.2 599.8 333 643 333" class="connection stroke-B1 s0" mask="url(#d2-1994989919)"/><path fill="none" marker-end="url(#mk-d2-1994989919-3488378134)" d="M1122 333h208.5" class="connection stroke-B1 s0" mask="url(#d2-1994989919)"/><path fill="none" marker-end="url(#mk-d2-1994989919-3488378134)" d="M382.616 341.179C546.6 460.8 605.7 491 672.5 491" class="connection stroke-B1 s0" mask="url(#d2-1994989919)"/><path fill="none" marker-end="url(#mk-d2-1994989919-3488378134)" d="M1093.5 491H1225" class="connection stroke-B1 s0" mask="url(#d2-1994989919)"/><mask id="d2-1994989919" width="2125" height="742" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2125v742H-101z"/></mask></svg>