<svg xmlns="http://www.w3.org/2000/svg" width="5825" height="883" class="d2-3023421021 d2-svg" viewBox="-101 -101 5825 883"><rect width="5825" height="883" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3023421021 .fill-N1{fill:#0a0f25}.d2-3023421021 .fill-N2{fill:#676c7e}.d2-3023421021 .fill-B6{fill:#f7f8fe}.d2-3023421021 .stroke-B1,.d2-3023421021 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="497" cy="172.5" class="shape stroke-B1 fill-B6 s0" rx="178" ry="59.5"/></g><text x="497" y="170" class="text-bold fill-N1 s1"><tspan x="497" dy="0">이 분배가 정의로운지를</tspan><tspan x="497" dy="18.5">무엇을 보고 판정하는가</tspan></text></g><g ><g class="shape"><path d="M5065 0h479v114h-479z" class="stroke-B1 fill-B6 s0"/></g><text x="5304.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="5304.5" dy="0">결과 상태 · 정형 원리</tspan><tspan x="5304.5" dy="17.25">지금 이 순간의 분배 모양을 본다.</tspan><tspan x="5304.5" dy="17.25">‘각자에게 필요에 따라’, ‘각자에게 기여에 따라’,</tspan><tspan x="5304.5" dy="17.25">‘가장 불리한 처지에 가장 큰 이익이 되게’</tspan></text></g><g ><g class="shape"><path d="M1272 251h452v98h-452z" class="stroke-B1 fill-B6 s0"/></g><text x="1498" y="289.5" class="text-bold fill-N1 s1"><tspan x="1498" dy="0">역사적 원리 — 노직</tspan><tspan x="1498" dy="17.667">지금의 모양이 아니라 여기까지 온 경로를 본다.</tspan><tspan x="1498" dy="17.667">같은 모양이라도 경로가 다르면 판정이 다르다</tspan></text></g><g ><g class="shape"><path d="M2124 113h302v98h-302z" class="stroke-B1 fill-B6 s0"/></g><text x="2275" y="151.5" class="text-bold fill-N1 s1"><tspan x="2275" dy="0">① 취득에서의 정의</tspan><tspan x="2275" dy="17.667">임자 없던 것을 처음 갖는 일이</tspan><tspan x="2275" dy="17.667">어떻게 정당해지는가</tspan></text></g><g ><g class="shape"><path d="M2002 413h545v98h-545z" class="stroke-B1 fill-B6 s0"/></g><text x="2274.5" y="451.5" class="text-bold fill-N1 s1"><tspan x="2274.5" dy="0">② 이전에서의 정의</tspan><tspan x="2274.5" dy="17.667">정당한 보유자에게서 자발적으로 넘겨받은 것은 정당하다</tspan><tspan x="2274.5" dy="17.667">증여 · 교환 · 유증</tspan></text></g><g ><g class="shape"><path d="M2060 271h429v82h-429z" class="stroke-B1 fill-B6 s0"/></g><text x="2274.5" y="309.5" class="text-bold fill-N1 s1"><tspan x="2274.5" dy="0">③ 교정의 원리</tspan><tspan x="2274.5" dy="18.5">①과 ②가 어겨졌을 때 무엇을 되돌려야 하는가</tspan></text></g><g ><g class="shape"><ellipse cx="3205.5" cy="426" class="shape stroke-B1 fill-B6 s0" rx="380.5" ry="127"/></g><text x="3205.5" y="415.5" class="text-bold fill-N1 s1"><tspan x="3205.5" dy="0">판정 규칙</tspan><tspan x="3205.5" dy="17.667">①과 ②를 밟아 지금에 이르렀다면 지금의 분배는 정의롭다.</tspan><tspan x="3205.5" dy="17.667">그 분배가 어떤 모양이든 상관없다</tspan></text></g><g ><g class="shape"><path d="M4025 361h444v130h-444z" class="stroke-B1 fill-B6 s0"/></g><text x="4247" y="399.5" class="text-bold fill-N1 s1"><tspan x="4247" dy="0">윌트 체임벌린 논증</tspan><tspan x="4247" dy="17">정형 원리가 정의롭다고 판정한 D1 에서</tspan><tspan x="4247" dy="17">자발적 이전만 거쳐 D2 로 갔다.</tspan><tspan x="4247" dy="17">그러면 정형 원리는 자기가 인정한 출발점에서</tspan><tspan x="4247" dy="17">나온 결과를 부정의하다고 말하게 된다</tspan></text></g><g ><g class="shape"><path d="M2954 97h504v130h-504z" class="stroke-B2 fill-B6 s2"/></g><text x="3206" y="135.5" class="text-bold fill-N1 s1"><tspan x="3206" dy="0">반론 A — 최초 취득</tspan><tspan x="3206" dy="17">이론 전체가 ①에 걸려 있는데 ①이 가장 덜 채워져 있다.</tspan><tspan x="3206" dy="17">로크의 단서를 어떻게 재는지도 정해지지 않았다.</tspan><tspan x="3206" dy="17">실제 역사의 취득이 대부분 정당하지 않았다면</tspan><tspan x="3206" dy="17">③이 요구하는 교정의 규모는 매우 커진다</tspan></text></g><g ><g class="shape"><path d="M5046 361h516v130h-516z" class="stroke-B2 fill-B6 s2"/></g><text x="5304" y="399.5" class="text-bold fill-N1 s1"><tspan x="5304" dy="0">반론 B — 무엇을 자유의 침해로 셀 것인가</tspan><tspan x="5304" dy="17">재산권 자체가 남을 막는 강제를 포함한다.</tspan><tspan x="5304" dy="17">그러므로 ‘재분배는 자유를 침해한다’ 와</tspan><tspan x="5304" dy="17">‘재산권은 자유를 침해한다’ 는 같은 종류의 문장이고,</tspan><tspan x="5304" dy="17">어느 쪽이 더 무거운지는 논증이 더 필요하다</tspan></text></g><g ><g class="shape"><path d="M4985 551h638v130h-638z" class="stroke-B2 fill-B6 s2"/></g><text x="5304" y="589.5" class="text-bold fill-N1 s1"><tspan x="5304" dy="0">반론 C — 되풀이와 배경</tspan><tspan x="5304" dy="17">한 번의 이전은 무해해도 같은 이전이 되풀이되면</tspan><tspan x="5304" dy="17">다음 세대의 출발선이 달라진다.</tspan><tspan x="5304" dy="17">그래서 롤스는 판정 대상을 낱개 거래가 아니라</tspan><tspan x="5304" dy="17">기본 구조로 잡는다 — D1 을 한 시점의 분배로 읽는 것 자체를 거부한다</tspan></text></g><text x="497" y="308" class="fill-N1 s1"><tspan x="497" dy="0">이 그림에서 확인할 것 하나. 자격 이론은 부자 편을 드는 이론이 아니라 경로만 보는 이론이다.</tspan><tspan x="497" dy="17.667">③ 교정의 원리를 진지하게 적용하면 과거의 강탈 때문에 대규모 이전이 요구될 수 있고, 노직 자신이 그 가능성을 적었다.</tspan><tspan x="497" dy="17.667">어떤 이론이 어떤 정책을 낳는지는 이론만으로 정해지지 않고 그 사회의 역사적 사실이 함께 있어야 정해진다</tspan></text><marker id="mk-d2-3023421021-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M654.968 143.643C1037 74.4 1206 57 1315.5 57h3745" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M651.96 203.394C1036.4 280.6 1160.8 300 1268 300" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M1629.87 250.292C1816 179.8 1915.1 162 2119.5 162" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M1609.829 349.81C1812 439.4 1890.8 462 1998 462" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M1725.999 307.072C1835.2 311 1902.4 312 2056 312" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M2424.899 211.628c208.5 68.972 303.901 96.772 471.214 137.428" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M2549 462c109.2 0 166.4-2.2 280.011-10.702" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M3588 426h433.5" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><text x="3805.5" y="432" class="text-italic fill-N2 s1">정형 원리를 겨눈다</text><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M4412.858 360.76C4663.8 260.7 4805.2 211.1 5114.182 114.69" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><text x="4761" y="232" class="text-italic fill-N2 s1">자유는 정형을 흐트러뜨린다</text><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M2428.5 162h521" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M4471 426h571" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><path fill="none" marker-end="url(#mk-d2-3023421021-3488378134)" d="M4412.86 491.736C4663.8 591 4778.6 616 4981 616" class="connection stroke-B1 s0" mask="url(#d2-3023421021)"/><mask id="d2-3023421021" width="5825" height="883" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h5825v883H-101z"/><path d="M3723 416h165v21h-165zM4640 216h242v21h-242z"/></mask></svg>