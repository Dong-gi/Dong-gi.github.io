<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="2136" class="d2-2722603507 d2-svg" viewBox="-101 -101 1424 2136"><rect width="1424" height="2136" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-2722603507 .text-bold{font-weight:700}.d2-2722603507 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2722603507 .fill-N1{fill:#0a0f25}.d2-2722603507 .fill-N2{fill:#676c7e}.d2-2722603507 .fill-B6{fill:#f7f8fe}.d2-2722603507 .stroke-B1,.d2-2722603507 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="308" cy="59.5" class="shape stroke-B1 fill-B6 s0" rx="178" ry="59.5"/></g><text x="308" y="57" class="text-bold fill-N1 s1"><tspan x="308" dy="0">이 분배가 정의로운지를</tspan><tspan x="308" dy="18.5">무엇을 보고 판정하는가</tspan></text></g><g ><g class="shape"><path d="M0 1269h260v162H0z" class="stroke-B1 fill-B6 s0"/></g><text x="130" y="1307.5" class="text-bold fill-N1 s1"><tspan x="130" dy="0">결과 상태 · 정형 원리</tspan><tspan x="130" dy="16.714">지금 이 순간의</tspan><tspan x="130" dy="16.714">분배 모양을 본다.</tspan><tspan x="130" dy="16.714">‘각자에게 필요에 따라’,</tspan><tspan x="130" dy="16.714">‘각자에게 기여에 따라’,</tspan><tspan x="130" dy="16.714">‘가장 불리한 처지에</tspan><tspan x="130" dy="16.714">가장 큰 이익이 되게’</tspan></text></g><g ><g class="shape"><path d="M417 219h316v130H417z" class="stroke-B1 fill-B6 s0"/></g><text x="575" y="257.5" class="text-bold fill-N1 s1"><tspan x="575" dy="0">역사적 원리 — 노직</tspan><tspan x="575" dy="17">지금의 모양이 아니라</tspan><tspan x="575" dy="17">여기까지 온 경로를 본다.</tspan><tspan x="575" dy="17">같은 모양이라도 경로가 다르면</tspan><tspan x="575" dy="17">판정이 다르다</tspan></text></g><g ><g class="shape"><path d="M177 457h302v98H177z" class="stroke-B1 fill-B6 s0"/></g><text x="328" y="495.5" class="text-bold fill-N1 s1"><tspan x="328" dy="0">① 취득에서의 정의</tspan><tspan x="328" dy="17.667">임자 없던 것을 처음 갖는 일이</tspan><tspan x="328" dy="17.667">어떻게 정당해지는가</tspan></text></g><g ><g class="shape"><path d="M851 449h333v114H851z" class="stroke-B1 fill-B6 s0"/></g><text x="1017.5" y="487.5" class="text-bold fill-N1 s1"><tspan x="1017.5" dy="0">② 이전에서의 정의</tspan><tspan x="1017.5" dy="17.25">정당한 보유자에게서 자발적으로</tspan><tspan x="1017.5" dy="17.25">넘겨받은 것은 정당하다</tspan><tspan x="1017.5" dy="17.25">증여 · 교환 · 유증</tspan></text></g><g ><g class="shape"><path d="M539 457h252v98H539z" class="stroke-B1 fill-B6 s0"/></g><text x="665" y="495.5" class="text-bold fill-N1 s1"><tspan x="665" dy="0">③ 교정의 원리</tspan><tspan x="665" dy="17.667">①과 ②가 어겨졌을 때</tspan><tspan x="665" dy="17.667">무엇을 되돌려야 하는가</tspan></text></g><g ><g class="shape"><ellipse cx="782" cy="760.5" class="shape stroke-B1 fill-B6 s0" rx="179" ry="87.5"/></g><text x="782" y="726" class="text-bold fill-N1 s1"><tspan x="782" dy="0">판정 규칙</tspan><tspan x="782" dy="16.833">①과 ②를 밟아</tspan><tspan x="782" dy="16.833">지금에 이르렀다면</tspan><tspan x="782" dy="16.833">지금의 분배는 정의롭다.</tspan><tspan x="782" dy="16.833">그 분배가 어떤 모양이든</tspan><tspan x="782" dy="16.833">상관없다</tspan></text></g><g ><g class="shape"><path d="M591 978h382v146H591z" class="stroke-B1 fill-B6 s0"/></g><text x="782" y="1016.5" class="text-bold fill-N1 s1"><tspan x="782" dy="0">윌트 체임벌린 논증</tspan><tspan x="782" dy="16.833">정형 원리가 정의롭다고 판정한 D1 에서</tspan><tspan x="782" dy="16.833">자발적 이전만 거쳐 D2 로 갔다.</tspan><tspan x="782" dy="16.833">그러면 정형 원리는</tspan><tspan x="782" dy="16.833">자기가 인정한 출발점에서 나온 결과를</tspan><tspan x="782" dy="16.833">부정의하다고 말하게 된다</tspan></text></g><g ><g class="shape"><path d="M170 663h316v194H170z" class="stroke-B2 fill-B6 s2"/></g><text x="328" y="701.5" class="text-bold fill-N1 s1"><tspan x="328" dy="0">반론 A — 최초 취득</tspan><tspan x="328" dy="16.556">이론 전체가 ①에 걸려 있는데</tspan><tspan x="328" dy="16.556">①이 가장 덜 채워져 있다.</tspan><tspan x="328" dy="16.556">로크의 단서를 어떻게 재는지도</tspan><tspan x="328" dy="16.556">정해지지 않았다.</tspan><tspan x="328" dy="16.556">실제 역사의 취득이</tspan><tspan x="328" dy="16.556">대부분 정당하지 않았다면</tspan><tspan x="328" dy="16.556">③이 요구하는 교정의 규모는</tspan><tspan x="328" dy="16.556">매우 커진다</tspan></text></g><g ><g class="shape"><path d="M878 1245h319v210H878z" class="stroke-B2 fill-B6 s2"/></g><text x="1037.5" y="1283.5" class="text-bold fill-N1 s1"><tspan x="1037.5" dy="0">반론 B —</tspan><tspan x="1037.5" dy="16.5">무엇을 자유의 침해로 셀 것인가</tspan><tspan x="1037.5" dy="16.5">재산권 자체가</tspan><tspan x="1037.5" dy="16.5">남을 막는 강제를 포함한다.</tspan><tspan x="1037.5" dy="16.5">그러므로</tspan><tspan x="1037.5" dy="16.5">‘재분배는 자유를 침해한다’ 와</tspan><tspan x="1037.5" dy="16.5">‘재산권은 자유를 침해한다’ 는</tspan><tspan x="1037.5" dy="16.5">같은 종류의 문장이고,</tspan><tspan x="1037.5" dy="16.5">어느 쪽이 더 무거운지는</tspan><tspan x="1037.5" dy="16.5">논증이 더 필요하다</tspan></text></g><g ><g class="shape"><path d="M752 1555h397v178H752z" class="stroke-B2 fill-B6 s2"/></g><text x="950.5" y="1593.5" class="text-bold fill-N1 s1"><tspan x="950.5" dy="0">반론 C — 되풀이와 배경</tspan><tspan x="950.5" dy="16.625">한 번의 이전은 무해해도</tspan><tspan x="950.5" dy="16.625">같은 이전이 되풀이되면</tspan><tspan x="950.5" dy="16.625">다음 세대의 출발선이 달라진다.</tspan><tspan x="950.5" dy="16.625">그래서 롤스는 판정 대상을</tspan><tspan x="950.5" dy="16.625">낱개 거래가 아니라 기본 구조로 잡는다 —</tspan><tspan x="950.5" dy="16.625">D1 을 한 시점의 분배로</tspan><tspan x="950.5" dy="16.625">읽는 것 자체를 거부한다</tspan></text></g><text x="951" y="1849" class="fill-N1 s1"><tspan x="951" dy="0">이 그림에서 확인할 것 하나.</tspan><tspan x="951" dy="16.833">자격 이론은 부자 편을 드는 이론이 아니라 경로만 보는 이론이다.</tspan><tspan x="951" dy="16.833">③ 교정의 원리를 진지하게 적용하면 과거의 강탈 때문에</tspan><tspan x="951" dy="16.833">대규모 이전이 요구될 수 있고, 노직 자신이 그 가능성을 적었다.</tspan><tspan x="951" dy="16.833">어떤 이론이 어떤 정책을 낳는지는 이론만으로 정해지지 않고</tspan><tspan x="951" dy="16.833">그 사회의 역사적 사실이 함께 있어야 정해진다</tspan></text><marker id="mk-d2-2722603507-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M221.295 113.045C148.6 157.6 130 192 130 226.5v1039" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M422.852 106.756C544.4 156.4 575.25 179 575.25 215" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M434.185 349.84C349.6 389 328 410.6 328 453" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M735.186 325.588C960.65 384.217 1017.5 409 1017.5 445" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M627.23 350.577C657.2 389 665 410.6 665 453" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M425.28 555.913C513.9 601.4 563 629 665.575 690.933" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M1017.5 565c0 38-25.1 63.6-122.103 123.889" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M781.986 850c-.386 53.6-.486 79.7-.486 124.5" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><text x="781.5" y="919" class="text-italic fill-N2 s1">정형 원리를 겨눈다</text><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M588.629 1123.735c-128.529 48.47-194.729 79.365-325.63 151.828" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><text x="421" y="1196" class="text-italic fill-N2 s1">자유는 정형을 흐트러뜨린다</text><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M328 557v102" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M923.27 1124.43c91.03 47.87 114.23 72.27 114.23 117.07" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><path fill="none" marker-end="url(#mk-d2-2722603507-3488378134)" d="M781.5 1125.5v141.75c0 49.65 12.2 247.75 57.906 285.214" class="connection stroke-B1 s0" mask="url(#d2-2722603507)"/><mask id="d2-2722603507" width="1424" height="2136" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1424v2136H-101z"/><path d="M699 903h165v21H699zM300 1180h242v21H300z"/></mask></svg>