<svg xmlns="http://www.w3.org/2000/svg" width="1163" height="2584" class="d2-938433352 d2-svg" viewBox="-101 -101 1163 2584"><rect width="1163" height="2584" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-938433352 .text-bold{font-weight:700}.d2-938433352 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-938433352 .fill-N1{fill:#0a0f25}.d2-938433352 .fill-N2{fill:#676c7e}.d2-938433352 .fill-B6{fill:#f7f8fe}.d2-938433352 .stroke-B1,.d2-938433352 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="264" cy="59.5" class="shape stroke-B1 fill-B6 s0" rx="178" ry="59.5"/></g><text x="264" y="57" class="text-bold fill-N1 s1"><tspan x="264" dy="0">이 분배가 정의로운지를</tspan><tspan x="264" dy="18.5">무엇을 보고 판정하는가</tspan></text></g><g ><g class="shape"><path d="M0 1509h260v162H0z" class="stroke-B1 fill-B6 s0"/></g><text x="130" y="1547.5" class="text-bold fill-N1 s1"><tspan x="130" dy="0">결과 상태 · 정형 원리</tspan><tspan x="130" dy="16.714">지금 이 순간의</tspan><tspan x="130" dy="16.714">분배 모양을 본다.</tspan><tspan x="130" dy="16.714">‘각자에게 필요에 따라’,</tspan><tspan x="130" dy="16.714">‘각자에게 기여에 따라’,</tspan><tspan x="130" dy="16.714">‘가장 불리한 처지에</tspan><tspan x="130" dy="16.714">가장 큰 이익이 되게’</tspan></text></g><g ><g class="shape"><path d="M345 219h260v146H345z" class="stroke-B1 fill-B6 s0"/></g><text x="475" y="257.5" class="text-bold fill-N1 s1"><tspan x="475" dy="0">역사적 원리 — 노직</tspan><tspan x="475" dy="16.833">지금의 모양이 아니라</tspan><tspan x="475" dy="16.833">여기까지 온 경로를 본다.</tspan><tspan x="475" dy="16.833">같은 모양이라도</tspan><tspan x="475" dy="16.833">경로가 다르면</tspan><tspan x="475" dy="16.833">판정이 다르다</tspan></text></g><g ><g class="shape"><path d="M176 481h229v114H176z" class="stroke-B1 fill-B6 s0"/></g><text x="290.5" y="519.5" class="text-bold fill-N1 s1"><tspan x="290.5" dy="0">① 취득에서의 정의</tspan><tspan x="290.5" dy="17.25">임자 없던 것을</tspan><tspan x="290.5" dy="17.25">처음 갖는 일이</tspan><tspan x="290.5" dy="17.25">어떻게 정당해지는가</tspan></text></g><g ><g class="shape"><path d="M713 465h229v146H713z" class="stroke-B1 fill-B6 s0"/></g><text x="827.5" y="503.5" class="text-bold fill-N1 s1"><tspan x="827.5" dy="0">② 이전에서의 정의</tspan><tspan x="827.5" dy="16.833">정당한 보유자에게서</tspan><tspan x="827.5" dy="16.833">자발적으로</tspan><tspan x="827.5" dy="16.833">넘겨받은 것은</tspan><tspan x="827.5" dy="16.833">정당하다</tspan><tspan x="827.5" dy="16.833">증여 · 교환 · 유증</tspan></text></g><g ><g class="shape"><path d="M465 473h188v130H465z" class="stroke-B1 fill-B6 s0"/></g><text x="559" y="511.5" class="text-bold fill-N1 s1"><tspan x="559" dy="0">③ 교정의 원리</tspan><tspan x="559" dy="17">①과 ②가</tspan><tspan x="559" dy="17">어겨졌을 때</tspan><tspan x="559" dy="17">무엇을</tspan><tspan x="559" dy="17">되돌려야 하는가</tspan></text></g><g ><g class="shape"><ellipse cx="655" cy="848.5" class="shape stroke-B1 fill-B6 s0" rx="179" ry="87.5"/></g><text x="655" y="814" class="text-bold fill-N1 s1"><tspan x="655" dy="0">판정 규칙</tspan><tspan x="655" dy="16.833">①과 ②를 밟아</tspan><tspan x="655" dy="16.833">지금에 이르렀다면</tspan><tspan x="655" dy="16.833">지금의 분배는 정의롭다.</tspan><tspan x="655" dy="16.833">그 분배가 어떤 모양이든</tspan><tspan x="655" dy="16.833">상관없다</tspan></text></g><g ><g class="shape"><path d="M518 1122h274v194H518z" class="stroke-B1 fill-B6 s0"/></g><text x="655" y="1160.5" class="text-bold fill-N1 s1"><tspan x="655" dy="0">윌트 체임벌린 논증</tspan><tspan x="655" dy="16.556">정형 원리가</tspan><tspan x="655" dy="16.556">정의롭다고 판정한 D1 에서</tspan><tspan x="655" dy="16.556">자발적 이전만 거쳐</tspan><tspan x="655" dy="16.556">D2 로 갔다.</tspan><tspan x="655" dy="16.556">그러면 정형 원리는</tspan><tspan x="655" dy="16.556">자기가 인정한 출발점에서</tspan><tspan x="655" dy="16.556">나온 결과를</tspan><tspan x="655" dy="16.556">부정의하다고 말하게 된다</tspan></text></g><g ><g class="shape"><path d="M174 711h212v274H174z" class="stroke-B2 fill-B6 s2"/></g><text x="280" y="749.5" class="text-bold fill-N1 s1"><tspan x="280" dy="0">반론 A — 최초 취득</tspan><tspan x="280" dy="16.357">이론 전체가</tspan><tspan x="280" dy="16.357">①에 걸려 있는데</tspan><tspan x="280" dy="16.357">①이 가장</tspan><tspan x="280" dy="16.357">덜 채워져 있다.</tspan><tspan x="280" dy="16.357">로크의 단서를</tspan><tspan x="280" dy="16.357">어떻게 재는지도</tspan><tspan x="280" dy="16.357">정해지지 않았다.</tspan><tspan x="280" dy="16.357">실제 역사의 취득이</tspan><tspan x="280" dy="16.357">대부분 정당하지</tspan><tspan x="280" dy="16.357">않았다면</tspan><tspan x="280" dy="16.357">③이 요구하는</tspan><tspan x="280" dy="16.357">교정의 규모는</tspan><tspan x="280" dy="16.357">매우 커진다</tspan></text></g><g ><g class="shape"><path d="M706 1453h255v274H706z" class="stroke-B2 fill-B6 s2"/></g><text x="833.5" y="1491.5" class="text-bold fill-N1 s1"><tspan x="833.5" dy="0">반론 B —</tspan><tspan x="833.5" dy="16.357">무엇을 자유의 침해로</tspan><tspan x="833.5" dy="16.357">셀 것인가</tspan><tspan x="833.5" dy="16.357">재산권 자체가</tspan><tspan x="833.5" dy="16.357">남을 막는 강제를</tspan><tspan x="833.5" dy="16.357">포함한다.</tspan><tspan x="833.5" dy="16.357">그러므로</tspan><tspan x="833.5" dy="16.357">‘재분배는 자유를</tspan><tspan x="833.5" dy="16.357">침해한다’ 와</tspan><tspan x="833.5" dy="16.357">‘재산권은 자유를</tspan><tspan x="833.5" dy="16.357">침해한다’ 는</tspan><tspan x="833.5" dy="16.357">같은 종류의 문장이고,</tspan><tspan x="833.5" dy="16.357">어느 쪽이 더 무거운지는</tspan><tspan x="833.5" dy="16.357">논증이 더 필요하다</tspan></text></g><g ><g class="shape"><path d="M653 1827h252v274H653z" class="stroke-B2 fill-B6 s2"/></g><text x="779" y="1865.5" class="text-bold fill-N1 s1"><tspan x="779" dy="0">반론 C — 되풀이와 배경</tspan><tspan x="779" dy="16.357">한 번의 이전은</tspan><tspan x="779" dy="16.357">무해해도</tspan><tspan x="779" dy="16.357">같은 이전이 되풀이되면</tspan><tspan x="779" dy="16.357">다음 세대의 출발선이</tspan><tspan x="779" dy="16.357">달라진다.</tspan><tspan x="779" dy="16.357">그래서 롤스는</tspan><tspan x="779" dy="16.357">판정 대상을</tspan><tspan x="779" dy="16.357">낱개 거래가 아니라</tspan><tspan x="779" dy="16.357">기본 구조로 잡는다 —</tspan><tspan x="779" dy="16.357">D1 을 한 시점의</tspan><tspan x="779" dy="16.357">분배로</tspan><tspan x="779" dy="16.357">읽는 것 자체를</tspan><tspan x="779" dy="16.357">거부한다</tspan></text></g><text x="779" y="2217" class="fill-N1 s1"><tspan x="779" dy="0">이 그림에서 확인할 것 하나.</tspan><tspan x="779" dy="16.455">자격 이론은 부자 편을 드는 이론이 아니라</tspan><tspan x="779" dy="16.455">경로만 보는 이론이다.</tspan><tspan x="779" dy="16.455">③ 교정의 원리를 진지하게 적용하면</tspan><tspan x="779" dy="16.455">과거의 강탈 때문에</tspan><tspan x="779" dy="16.455">대규모 이전이 요구될 수 있고,</tspan><tspan x="779" dy="16.455">노직 자신이 그 가능성을 적었다.</tspan><tspan x="779" dy="16.455">어떤 이론이 어떤 정책을 낳는지는</tspan><tspan x="779" dy="16.455">이론만으로 정해지지 않고</tspan><tspan x="779" dy="16.455">그 사회의 역사적 사실이</tspan><tspan x="779" dy="16.455">함께 있어야 정해진다</tspan></text><marker id="mk-d2-938433352-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M194.452 116.266C143.2 158.2 130 193.6 130 230.5v1275" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M361.78 110.913C452 157.2 475 179 475 215" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M363.586 366.11C305.25 405 290.25 428.2 290.25 477" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M607.137 337.663C782.85 399.4 827.25 425 827.25 461" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M525.875 366.654C551.95 405 558.75 426.6 558.75 469" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M371.381 596.157C444.15 647.8 485.2 682.8 572.131 767.213" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M827.25 613c0 38-19.85 69.6-96.543 153.055" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M655.004 938c.196 92 .246 129.3.246 180.5" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><text x="655" y="1027" class="text-italic fill-N2 s1"><tspan x="655" dy="0">정형 원리를</tspan><tspan x="655" dy="18.5">겨눈다</tspan></text><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M516.036 1302.53C407.35 1367.9 349.75 1409.5 232.823 1506.94" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><text x="367.5" y="1394" class="text-italic fill-N2 s1"><tspan x="367.5" dy="0">자유는 정형을</tspan><tspan x="367.5" dy="18.5">흐트러뜨린다</tspan></text><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M285.099 596.994C281.25 647.8 280.25 671 280.25 707" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M760.463 1316.864C818.2 1370.7 833 1398.3 833 1449.5" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><path fill="none" marker-end="url(#mk-d2-938433352-3488378134)" d="M650.413 1317.498C648.1 1370.7 647.5 1425.6 647.5 1487.25s7 299.75 32.706 336.473" class="connection stroke-B1 s0" mask="url(#d2-938433352)"/><mask id="d2-938433352" width="1163" height="2584" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1163v2584H-101z"/><path d="M603 1011h104v37H603zM306 1378h123v37H306z"/></mask></svg>