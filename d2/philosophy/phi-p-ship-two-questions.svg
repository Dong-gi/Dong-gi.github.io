<svg xmlns="http://www.w3.org/2000/svg" width="1111" height="1325" class="d2-3198245985 d2-svg" viewBox="-101 -101 1111 1325"><rect width="1111" height="1325" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3198245985 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3198245985 .fill-N1{fill:#0a0f25}.d2-3198245985 .fill-B6{fill:#f7f8fe}.d2-3198245985 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="405.5" cy="39.5" class="shape stroke-B1 fill-B6 s0" rx="118.5" ry="39.5"/></g><text x="405.5" y="45" class="text-bold fill-N1 s1">테세우스의 배</text></g><g ><g class="shape"><path d="M78 179h336v114H78z" class="stroke-B1 fill-B6 s0"/></g><text x="246" y="217.5" class="text-bold fill-N1 s1"><tspan x="246" dy="0">물음 하나 —</tspan><tspan x="246" dy="17.25">시간을 통한 동일성</tspan><tspan x="246" dy="17.25">어제의 그것과 오늘의 이것을</tspan><tspan x="246" dy="17.25">하나라고 부르는 근거는 무엇인가</tspan></text></g><g ><g class="shape"><path d="M474 179h280v114H474z" class="stroke-B1 fill-B6 s0"/></g><text x="614" y="217.5" class="text-bold fill-N1 s1"><tspan x="614" dy="0">물음 둘 —</tspan><tspan x="614" dy="17.25">구성이 곧 동일성인가</tspan><tspan x="614" dy="17.25">널빤지들의 모임과 배는</tspan><tspan x="614" dy="17.25">같은 하나인가, 다른 둘인가</tspan></text></g><g ><g class="shape"><path d="M199 393h412v114H199z" class="stroke-B1 fill-B6 s0"/></g><text x="405" y="431.5" class="text-bold fill-N1 s1"><tspan x="405" dy="0">밀어붙이는 원리 — 라이프니츠 법칙</tspan><tspan x="405" dy="17.25">같은 것이라면 참인 것이 모두 같아야 한다.</tspan><tspan x="405" dy="17.25">뒤집으면, 참인 것이 하나라도 다르면</tspan><tspan x="405" dy="17.25">같은 것이 아니다</tspan></text></g><text x="405" y="623" class="fill-N1 s1"><tspan x="405" dy="0">배 A 와 배 B 는 놓인 자리가 다르다.</tspan><tspan x="405" dy="17">그러니 A 와 B 는 다르다.</tspan><tspan x="405" dy="17">그런데 둘 다 그 배라면 A 는 그 배이고</tspan><tspan x="405" dy="17">B 도 그 배이므로 A 와 B 는 같아야 한다.</tspan><tspan x="405" dy="17">같으면서 다를 수는 없다</tspan></text><g ><g class="shape"><path d="M0 816h197v130H0z" class="stroke-B1 fill-B6 s0"/></g><text x="98.5" y="854.5" class="text-bold fill-N1 s1"><tspan x="98.5" dy="0">하나만 그 배다</tspan><tspan x="98.5" dy="17">기준을 하나 골라</tspan><tspan x="98.5" dy="17">다른 쪽을 버린다.</tspan><tspan x="98.5" dy="17">포기하는 것 —</tspan><tspan x="98.5" dy="17">버린 쪽의 직관</tspan></text></g><g ><g class="shape"><path d="M257 792h296v178H257z" class="stroke-B1 fill-B6 s0"/></g><text x="405" y="830.5" class="text-bold fill-N1 s1"><tspan x="405" dy="0">시간적 부분으로 읽는다</tspan><tspan x="405" dy="16.625">(4차원주의)</tspan><tspan x="405" dy="16.625">배는 시점마다의 부분들로</tspan><tspan x="405" dy="16.625">이루어진 하나의 전체이고,</tspan><tspan x="405" dy="16.625">두 계보는 앞부분을 공유하는</tspan><tspan x="405" dy="16.625">서로 다른 전체다.</tspan><tspan x="405" dy="16.625">포기하는 것 — 사물이</tspan><tspan x="405" dy="16.625">매 순간 통째로 있다는 생각</tspan></text></g><g ><g class="shape"><path d="M613 816h296v130H613z" class="stroke-B1 fill-B6 s0"/></g><text x="761" y="854.5" class="text-bold fill-N1 s1"><tspan x="761" dy="0">그 배 같은 것은 없다</tspan><tspan x="761" dy="17">널빤지들이 이렇게 저렇게</tspan><tspan x="761" dy="17">놓여 있을 뿐이다.</tspan><tspan x="761" dy="17">포기하는 것 —</tspan><tspan x="761" dy="17">배가 하나의 대상이라는 생각</tspan></text></g><text x="405.5" y="1086" class="fill-N1 s1"><tspan x="405.5" dy="0">13장이 이 물음을 사람에 대해 되풀이한다.</tspan><tspan x="405.5" dy="17.667">거기서는 널빤지 대신 몸과 기억이 놓이고,</tspan><tspan x="405.5" dy="17.667">‘어느 쪽도 버릴 수 없다’ 는 압박이 훨씬 세진다</tspan></text><marker id="mk-d2-3198245985-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3198245985-3488378134)" d="M343.258 73.983C265.6 117.8 245.75 139 245.75 175" class="connection stroke-B1 s0" mask="url(#d2-3198245985)"/><path fill="none" marker-end="url(#mk-d2-3198245985-3488378134)" d="M479.84 71.786C586.6 117.4 613.75 139 613.75 175" class="connection stroke-B1 s0" mask="url(#d2-3198245985)"/><path fill="none" marker-end="url(#mk-d2-3198245985-3488378134)" d="M245.75 295c0 38 14.8 58 70.686 95.76" class="connection stroke-B1 s0" mask="url(#d2-3198245985)"/><path fill="none" marker-end="url(#mk-d2-3198245985-3488378134)" d="M613.75 295c0 38-19.6 58-94.437 96.182" class="connection stroke-B1 s0" mask="url(#d2-3198245985)"/><path fill="none" marker-end="url(#mk-d2-3198245985-3488378134)" d="M405 509v94" class="connection stroke-B1 s0" mask="url(#d2-3198245985)"/><path fill="none" marker-end="url(#mk-d2-3198245985-3488378134)" d="M262.585 692.577C131.7 732 98.5 756.8 98.5 812" class="connection stroke-B1 s0" mask="url(#d2-3198245985)"/><path fill="none" marker-end="url(#mk-d2-3198245985-3488378134)" d="M405 694v94" class="connection stroke-B1 s0" mask="url(#d2-3198245985)"/><path fill="none" marker-end="url(#mk-d2-3198245985-3488378134)" d="M563.935 690.506C721.2 731.6 761 756.8 761 812" class="connection stroke-B1 s0" mask="url(#d2-3198245985)"/><marker id="mk-d2-3198245985-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3198245985-2177206569)" d="M405 972v94" class="connection" mask="url(#d2-3198245985)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3198245985" width="1111" height="1325" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1111v1325H-101z"/></mask></svg>