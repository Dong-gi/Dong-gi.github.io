<svg xmlns="http://www.w3.org/2000/svg" width="1610" height="1165" class="d2-3412021244 d2-svg" viewBox="-101 -101 1610 1165"><rect width="1610" height="1165" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3412021244 .fill-N1{fill:#0a0f25}.d2-3412021244 .fill-B6{fill:#f7f8fe}.d2-3412021244 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}</style><g ><g class="shape"><ellipse cx="663.5" cy="39.5" class="shape stroke-B1 fill-B6 s0" rx="118.5" ry="39.5"/></g><text x="663.5" y="45" class="text-bold fill-N1 s1">테세우스의 배</text></g><g ><g class="shape"><path d="M87 179h592v82H87z" class="stroke-B1 fill-B6 s0"/></g><text x="383" y="217.5" class="text-bold fill-N1 s1"><tspan x="383" dy="0">물음 하나 — 시간을 통한 동일성</tspan><tspan x="383" dy="18.5">어제의 그것과 오늘의 이것을 하나라고 부르는 근거는 무엇인가</tspan></text></g><g ><g class="shape"><path d="M739 179h492v82H739z" class="stroke-B1 fill-B6 s0"/></g><text x="985" y="217.5" class="text-bold fill-N1 s1"><tspan x="985" dy="0">물음 둘 — 구성이 곧 동일성인가</tspan><tspan x="985" dy="18.5">널빤지들의 모임과 배는 같은 하나인가, 다른 둘인가</tspan></text></g><g ><g class="shape"><path d="M406 361h516v98H406z" class="stroke-B1 fill-B6 s0"/></g><text x="664" y="399.5" class="text-bold fill-N1 s1"><tspan x="664" dy="0">밀어붙이는 원리 — 라이프니츠 법칙</tspan><tspan x="664" dy="17.667">같은 것이라면 참인 것이 모두 같아야 한다.</tspan><tspan x="664" dy="17.667">뒤집으면, 참인 것이 하나라도 다르면 같은 것이 아니다</tspan></text></g><text x="663.5" y="575" class="fill-N1 s1"><tspan x="663.5" dy="0">배 A 와 배 B 는 놓인 자리가 다르다. 그러니 A 와 B 는 다르다.</tspan><tspan x="663.5" dy="17.667">그런데 둘 다 그 배라면 A 는 그 배이고 B 도 그 배이므로 A 와 B 는 같아야 한다.</tspan><tspan x="663.5" dy="17.667">같으면서 다를 수는 없다</tspan></text><g ><g class="shape"><path d="M0 720h348v98H0z" class="stroke-B1 fill-B6 s0"/></g><text x="174" y="758.5" class="text-bold fill-N1 s1"><tspan x="174" dy="0">하나만 그 배다</tspan><tspan x="174" dy="17.667">기준을 하나 골라 다른 쪽을 버린다.</tspan><tspan x="174" dy="17.667">포기하는 것 — 버린 쪽의 직관</tspan></text></g><g ><g class="shape"><path d="M408 712h511v114H408z" class="stroke-B1 fill-B6 s0"/></g><text x="663.5" y="750.5" class="text-bold fill-N1 s1"><tspan x="663.5" dy="0">시간적 부분으로 읽는다 (4차원주의)</tspan><tspan x="663.5" dy="17.25">배는 시점마다의 부분들로 이루어진 하나의 전체이고,</tspan><tspan x="663.5" dy="17.25">두 계보는 앞부분을 공유하는 서로 다른 전체다.</tspan><tspan x="663.5" dy="17.25">포기하는 것 — 사물이 매 순간 통째로 있다는 생각</tspan></text></g><g ><g class="shape"><path d="M979 720h429v98H979z" class="stroke-B1 fill-B6 s0"/></g><text x="1193.5" y="758.5" class="text-bold fill-N1 s1"><tspan x="1193.5" dy="0">그 배 같은 것은 없다</tspan><tspan x="1193.5" dy="17.667">널빤지들이 이렇게 저렇게 놓여 있을 뿐이다.</tspan><tspan x="1193.5" dy="17.667">포기하는 것 — 배가 하나의 대상이라는 생각</tspan></text></g><text x="663.5" y="942" class="fill-N1 s1"><tspan x="663.5" dy="0">13장이 이 물음을 사람에 대해 되풀이한다. 거기서는 널빤지 대신 몸과 기억이 놓이고,</tspan><tspan x="663.5" dy="18.5">‘어느 쪽도 버릴 수 없다’ 는 압박이 훨씬 세진다</tspan></text><marker id="mk-d2-3412021244-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3412021244-3488378134)" d="M575.095 67.608C421.6 116.6 382.75 139 382.75 175" class="connection stroke-B1 s0" mask="url(#d2-3412021244)"/><path fill="none" marker-end="url(#mk-d2-3412021244-3488378134)" d="M754.928 65.532C938.4 116.2 984.75 139 984.75 175" class="connection stroke-B1 s0" mask="url(#d2-3412021244)"/><path fill="none" marker-end="url(#mk-d2-3412021244-3488378134)" d="M382.75 263c0 38 28.4 58 138.227 96.671" class="connection stroke-B1 s0" mask="url(#d2-3412021244)"/><path fill="none" marker-end="url(#mk-d2-3412021244-3488378134)" d="M984.75 263c0 38-32.4 58-158.178 96.82" class="connection stroke-B1 s0" mask="url(#d2-3412021244)"/><path fill="none" marker-end="url(#mk-d2-3412021244-3488378134)" d="M663.5 461v94" class="connection stroke-B1 s0" mask="url(#d2-3412021244)"/><path fill="none" marker-end="url(#mk-d2-3412021244-3488378134)" d="M492.024 612.309C238 652 174 673.6 174 716" class="connection stroke-B1 s0" mask="url(#d2-3412021244)"/><path fill="none" marker-end="url(#mk-d2-3412021244-3488378134)" d="M663.5 614v94" class="connection stroke-B1 s0" mask="url(#d2-3412021244)"/><path fill="none" marker-end="url(#mk-d2-3412021244-3488378134)" d="M849.48 612.286C1124.3 652 1193.5 673.6 1193.5 716" class="connection stroke-B1 s0" mask="url(#d2-3412021244)"/><marker id="mk-d2-3412021244-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3412021244-2177206569)" d="M663.5 828v94" class="connection" mask="url(#d2-3412021244)" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/><mask id="d2-3412021244" width="1610" height="1165" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1610v1165H-101z"/></mask></svg>