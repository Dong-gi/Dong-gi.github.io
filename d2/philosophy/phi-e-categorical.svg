<svg xmlns="http://www.w3.org/2000/svg" width="2705" height="883" class="d2-620489663 d2-svg" viewBox="-101 -101 2705 883"><rect width="2705" height="883" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-620489663 .fill-N1{fill:#0a0f25}.d2-620489663 .fill-B6{fill:#f7f8fe}.d2-620489663 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M562 8h472v98H562z" class="stroke-B1 fill-B6 s0"/></g><text x="798" y="46.5" class="text-bold fill-N1 s1"><tspan x="798" dy="0">① 준칙을 적는다</tspan><tspan x="798" dy="17.667">‘나는 곤란할 때 갚을 뜻 없이 갚겠다고 약속한다’</tspan><tspan x="798" dy="17.667">행위 · 상황 · 목적이 다 들어가야 한다</tspan></text></g><g ><g class="shape"><path d="M569 214h458v66H569z" class="stroke-B1 fill-B6 s0"/></g><text x="798" y="252.5" class="text-bold fill-N1 s1">② 그 준칙이 모두가 따르는 법칙이라고 상상한다</text></g><g ><g class="shape"><path d="M665 380h266v66H665z" class="stroke-B1 fill-B6 s0"/></g><text x="798" y="418.5" class="text-bold fill-N1 s1">③ 무엇이 무너지는지 본다</text></g><g ><g class="shape"><path d="M0 567h513v114H0z" class="stroke-B1 fill-B6 s0"/></g><text x="256.5" y="605.5" class="text-bold fill-N1 s1"><tspan x="256.5" dy="0">개념에서의 모순</tspan><tspan x="256.5" dy="17.25">모두가 그렇게 하면 약속이라는 것이 성립하지 않는다.</tspan><tspan x="256.5" dy="17.25">그러면 준칙 자체를 생각할 수 없게 된다.</tspan><tspan x="256.5" dy="17.25">완전한 의무 — 예외를 두지 않는다</tspan></text></g><g ><g class="shape"><path d="M573 567h461v114H573z" class="stroke-B1 fill-B6 s0"/></g><text x="803.5" y="605.5" class="text-bold fill-N1 s1"><tspan x="803.5" dy="0">의욕에서의 모순</tspan><tspan x="803.5" dy="17.25">모두가 남을 돕지 않는 세상은 상상할 수 있다.</tspan><tspan x="803.5" dy="17.25">다만 내가 그런 세상을 의욕할 수는 없다.</tspan><tspan x="803.5" dy="17.25">불완전한 의무 — 언제 어떻게 할지는 내게 남는다</tspan></text></g><g ><g class="shape"><path d="M1094 583h272v82h-272z" class="stroke-B1 fill-B6 s0"/></g><text x="1230" y="621.5" class="text-bold fill-N1 s1"><tspan x="1230" dy="0">아무것도 무너지지 않는다</tspan><tspan x="1230" dy="18.5">그 준칙은 허용된다</tspan></text></g><g ><g class="shape"><path d="M1094 0h706v114h-706z" class="stroke-B1 fill-B6 s0"/></g><text x="1447" y="38.5" class="text-bold fill-N1 s1"><tspan x="1447" dy="0">두 번째 정식 — 인간성의 정식</tspan><tspan x="1447" dy="17.25">너 자신과 다른 사람 안의 인간성을 언제나 목적으로도 대하고</tspan><tspan x="1447" dy="17.25">결코 수단으로만 대하지 마라.</tspan><tspan x="1447" dy="17.25">‘수단으로만’ 이 중요하다. 사람을 수단으로 쓰는 것 자체는 금지되지 않는다</tspan></text></g><g ><g class="shape"><path d="M1426 567h645v114h-645z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="1748.5" y="605.5" class="text-bold fill-N1 s1"><tspan x="1748.5" dy="0">약점 — 준칙을 어떻게 적느냐로 결과가 바뀐다.</tspan><tspan x="1748.5" dy="17.25">같은 행위를 좁게 적으면 통과하고 넓게 적으면 걸린다.</tspan><tspan x="1748.5" dy="17.25">칸트 쪽의 응답은 준칙에 진짜 목적을 정직하게 적어야 한다는 것인데,</tspan><tspan x="1748.5" dy="17.25">무엇이 진짜 목적인지를 다시 판단해야 한다</tspan></text></g><text x="2181.5" y="47" class="fill-N1 s1"><tspan x="2181.5" dy="0">또 하나 — 완전한 의무끼리 부딪히는 경우를 어떻게 하는가.</tspan><tspan x="2181.5" dy="17.667">거짓말하지 말라와 무고한 사람을 넘기지 말라가 한 자리에서 부딪힐 수 있다.</tspan><tspan x="2181.5" dy="17.667">로스의 조건부 의무는 이 문제를 정면으로 받으려는 다른 길이다</tspan></text><marker id="mk-d2-620489663-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-620489663-3488378134)" d="M797.5 108v102" class="connection stroke-B1 s0" mask="url(#d2-620489663)"/><path fill="none" marker-end="url(#mk-d2-620489663-3488378134)" d="M797.5 282v94" class="connection stroke-B1 s0" mask="url(#d2-620489663)"/><path fill="none" marker-end="url(#mk-d2-620489663-3488378134)" d="M662.53 436.327C338.098 492.397 256.5 518.7 256.5 563.5" class="connection stroke-B1 s0" mask="url(#d2-620489663)"/><path fill="none" marker-end="url(#mk-d2-620489663-3488378134)" d="M799.63 447.496C802.7 494.3 803.5 518.7 803.5 563.5" class="connection stroke-B1 s0" mask="url(#d2-620489663)"/><path fill="none" marker-end="url(#mk-d2-620489663-3488378134)" d="M933.455 442.176C1170.3 493.55 1230 521.9 1230 579.5" class="connection stroke-B1 s0" mask="url(#d2-620489663)"/><path fill="none" marker-end="url(#mk-d2-620489663-3488378134)" d="M933.49 426.272C1585.1 490.415 1748.5 518.7 1748.5 563.5" class="connection stroke-B1 s0" mask="url(#d2-620489663)"/><text x="1365.5" y="474" style="fill:#676c7e;text-anchor:middle;font-size:16px">여기가 새어 나간다</text><mask id="d2-620489663" width="2705" height="883" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2705v883H-101z"/><path d="M1283 458h165v21h-165z"/></mask></svg>