<svg xmlns="http://www.w3.org/2000/svg" width="1285" height="1330" class="d2-2912812402 d2-svg" viewBox="-101 -101 1285 1330"><rect width="1285" height="1330" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2912812402 .fill-N1{fill:#0a0f25}.d2-2912812402 .fill-B6{fill:#f7f8fe}.d2-2912812402 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M301 0h472v98H301z" class="stroke-B1 fill-B6 s0"/></g><text x="537" y="38.5" class="text-bold fill-N1 s1"><tspan x="537" dy="0">① 준칙을 적는다</tspan><tspan x="537" dy="17.667">‘나는 곤란할 때 갚을 뜻 없이 갚겠다고 약속한다’</tspan><tspan x="537" dy="17.667">행위 · 상황 · 목적이 다 들어가야 한다</tspan></text></g><g ><g class="shape"><path d="M402 198h270v82H402z" class="stroke-B1 fill-B6 s0"/></g><text x="537" y="236.5" class="text-bold fill-N1 s1"><tspan x="537" dy="0">② 그 준칙이 모두가 따르는</tspan><tspan x="537" dy="18.5">법칙이라고 상상한다</tspan></text></g><g ><g class="shape"><path d="M404 380h266v66H404z" class="stroke-B1 fill-B6 s0"/></g><text x="537" y="418.5" class="text-bold fill-N1 s1">③ 무엇이 무너지는지 본다</text></g><g ><g class="shape"><path d="M0 599h220v178H0z" class="stroke-B1 fill-B6 s0"/></g><text x="110" y="637.5" class="text-bold fill-N1 s1"><tspan x="110" dy="0">개념에서의 모순</tspan><tspan x="110" dy="16.625">모두가 그렇게 하면</tspan><tspan x="110" dy="16.625">약속이라는 것이</tspan><tspan x="110" dy="16.625">성립하지 않는다.</tspan><tspan x="110" dy="16.625">그러면 준칙 자체를</tspan><tspan x="110" dy="16.625">생각할 수 없게 된다.</tspan><tspan x="110" dy="16.625">완전한 의무 —</tspan><tspan x="110" dy="16.625">예외를 두지 않는다</tspan></text></g><g ><g class="shape"><path d="M280 599h240v178H280z" class="stroke-B1 fill-B6 s0"/></g><text x="400" y="637.5" class="text-bold fill-N1 s1"><tspan x="400" dy="0">의욕에서의 모순</tspan><tspan x="400" dy="16.625">모두가 남을 돕지 않는</tspan><tspan x="400" dy="16.625">세상은 상상할 수 있다.</tspan><tspan x="400" dy="16.625">다만 내가 그런 세상을</tspan><tspan x="400" dy="16.625">의욕할 수는 없다.</tspan><tspan x="400" dy="16.625">불완전한 의무 —</tspan><tspan x="400" dy="16.625">언제 어떻게 할지는</tspan><tspan x="400" dy="16.625">내게 남는다</tspan></text></g><g ><g class="shape"><path d="M580 631h188v114H580z" class="stroke-B1 fill-B6 s0"/></g><text x="674" y="669.5" class="text-bold fill-N1 s1"><tspan x="674" dy="0">아무것도</tspan><tspan x="674" dy="17.25">무너지지 않는다</tspan><tspan x="674" dy="17.25">그 준칙은</tspan><tspan x="674" dy="17.25">허용된다</tspan></text></g><g ><g class="shape"><path d="M167 909h467v146H167z" class="stroke-B1 fill-B6 s0"/></g><text x="400.5" y="947.5" class="text-bold fill-N1 s1"><tspan x="400.5" dy="0">두 번째 정식 — 인간성의 정식</tspan><tspan x="400.5" dy="16.833">너 자신과 다른 사람 안의 인간성을</tspan><tspan x="400.5" dy="16.833">언제나 목적으로도 대하고</tspan><tspan x="400.5" dy="16.833">결코 수단으로만 대하지 마라.</tspan><tspan x="400.5" dy="16.833">‘수단으로만’ 이 중요하다.</tspan><tspan x="400.5" dy="16.833">사람을 수단으로 쓰는 것 자체는 금지되지 않는다</tspan></text></g><g ><g class="shape"><path d="M828 567h255v242H828z" class="fill-B6" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:6,5.919384"/></g><text x="955.5" y="605.5" class="text-bold fill-N1 s1"><tspan x="955.5" dy="0">약점 — 준칙을</tspan><tspan x="955.5" dy="16.417">어떻게 적느냐로</tspan><tspan x="955.5" dy="16.417">결과가 바뀐다.</tspan><tspan x="955.5" dy="16.417">같은 행위를 좁게 적으면</tspan><tspan x="955.5" dy="16.417">통과하고</tspan><tspan x="955.5" dy="16.417">넓게 적으면 걸린다.</tspan><tspan x="955.5" dy="16.417">칸트 쪽의 응답은</tspan><tspan x="955.5" dy="16.417">준칙에 진짜 목적을</tspan><tspan x="955.5" dy="16.417">정직하게 적어야</tspan><tspan x="955.5" dy="16.417">한다는 것인데,</tspan><tspan x="955.5" dy="16.417">무엇이 진짜 목적인지를</tspan><tspan x="955.5" dy="16.417">다시 판단해야 한다</tspan></text></g><text x="541.5" y="1091" class="fill-N1 s1"><tspan x="541.5" dy="0">또 하나 — 완전한 의무끼리 부딪히는 경우를 어떻게 하는가.</tspan><tspan x="541.5" dy="17.667">거짓말하지 말라와 무고한 사람을 넘기지 말라가 한 자리에서 부딪힐 수 있다.</tspan><tspan x="541.5" dy="17.667">로스의 조건부 의무는 이 문제를 정면으로 받으려는 다른 길이다</tspan></text><marker id="mk-d2-2912812402-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2912812402-3488378134)" d="M537 100v94" class="connection stroke-B1 s0" mask="url(#d2-2912812402)"/><path fill="none" marker-end="url(#mk-d2-2912812402-3488378134)" d="M537 282v94" class="connection stroke-B1 s0" mask="url(#d2-2912812402)"/><path fill="none" marker-end="url(#mk-d2-2912812402-3488378134)" d="M402.046 442.925C168.799 493.7 110 525.1 110 595.5" class="connection stroke-B1 s0" mask="url(#d2-2912812402)"/><path fill="none" marker-end="url(#mk-d2-2912812402-3488378134)" d="M487.35 446.63C417.8 494.3 400 525.1 400 595.5" class="connection stroke-B1 s0" mask="url(#d2-2912812402)"/><path fill="none" marker-end="url(#mk-d2-2912812402-3488378134)" d="M586.65 446.63C656.2 494.3 674 531.5 674 627.5" class="connection stroke-B1 s0" mask="url(#d2-2912812402)"/><path fill="none" marker-end="url(#mk-d2-2912812402-3488378134)" d="M671.452 442.937C898.3 493.7 955.5 518.7 955.5 563.5" class="connection stroke-B1 s0" mask="url(#d2-2912812402)"/><text x="838.5" y="486" style="fill:#676c7e;text-anchor:middle;font-size:16px">여기가 새어 나간다</text><mask id="d2-2912812402" width="1285" height="1330" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1285v1330H-101z"/><path d="M756 470h165v21H756z"/></mask></svg>