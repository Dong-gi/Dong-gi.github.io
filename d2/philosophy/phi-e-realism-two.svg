<svg xmlns="http://www.w3.org/2000/svg" width="1486" height="948" class="d2-2242486621 d2-svg" viewBox="-89 -89 1486 948"><rect width="1486" height="948" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2242486621 .fill-N1{fill:#0a0f25}.d2-2242486621 .fill-N2{fill:#676c7e}.d2-2242486621 .fill-B6{fill:#f7f8fe}.d2-2242486621 .stroke-B1,.d2-2242486621 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M467 12h377v114H467z" class="stroke-B1 fill-B6 s0"/></g><text x="655.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="655.5" dy="0">도덕 실재론</tspan><tspan x="655.5" dy="17.25">① 도덕 문장은 참·거짓을 가질 수 있다</tspan><tspan x="655.5" dy="17.25">② 그중 참인 것이 실제로 있다</tspan><tspan x="655.5" dy="17.25">③ 그 참은 우리 태도에 의존하지 않는다</tspan></text></g><g ><g class="shape"><path d="M125 313h366v130H125z" class="stroke-B1 fill-B6 s0"/></g><text x="308" y="351.5" class="text-bold fill-N1 s1"><tspan x="308" dy="0">자연주의적 실재론</tspan><tspan x="308" dy="17">도덕 속성은 자연적 속성이다.</tspan><tspan x="308" dy="17">다만 짧은 정의로 갈아 끼울 수 있다는</tspan><tspan x="308" dy="17">뜻은 아니다 — 건강이나 종처럼,</tspan><tspan x="308" dy="17">자연적이면서 정의되지 않을 수 있다</tspan></text></g><g ><g class="shape"><path d="M855 313h237v130H855z" class="stroke-B1 fill-B6 s0"/></g><text x="973.5" y="351.5" class="text-bold fill-N1 s1"><tspan x="973.5" dy="0">비자연주의적 실재론</tspan><tspan x="973.5" dy="17">도덕 속성은 있지만</tspan><tspan x="973.5" dy="17">자연적 속성이 아니다.</tspan><tspan x="973.5" dy="17">무어가 이 길을 냈고</tspan><tspan x="973.5" dy="17">지금도 지지자가 있다</tspan></text></g><g ><g class="shape"><path d="M12 523h276v162H12z" class="stroke-B1 fill-B6 s0"/></g><text x="150" y="561.5" class="text-bold fill-N1 s1"><tspan x="150" dy="0">무엇을 설명하려고 나왔나</tspan><tspan x="150" dy="16.714">도덕 사실이 어떻게</tspan><tspan x="150" dy="16.714">세상 안에 자리 잡는지,</tspan><tspan x="150" dy="16.714">어떻게 알려지는지를</tspan><tspan x="150" dy="16.714">다른 과학과 같은 방식으로</tspan><tspan x="150" dy="16.714">설명한다.</tspan><tspan x="150" dy="16.714">수반도 저절로 설명된다</tspan></text></g><g ><g class="shape"><path d="M308 523h319v162H308z" class="stroke-B2 fill-B6 s2"/></g><text x="467.5" y="561.5" class="text-bold fill-N1 s1"><tspan x="467.5" dy="0">대가</tspan><tspan x="467.5" dy="16.714">열린 물음이 왜 열려 보이는지를</tspan><tspan x="467.5" dy="16.714">따로 설명해야 한다.</tspan><tspan x="467.5" dy="16.714">그리고 도덕 사실이</tspan><tspan x="467.5" dy="16.714">무엇을 설명하는 데</tspan><tspan x="467.5" dy="16.714">정말 필요한지를 보여야 한다 —</tspan><tspan x="467.5" dy="16.714">하먼이 이 자리를 파고들었다</tspan></text></g><g ><g class="shape"><path d="M647 523h319v146H647z" class="stroke-B1 fill-B6 s0"/></g><text x="806.5" y="561.5" class="text-bold fill-N1 s1"><tspan x="806.5" dy="0">무엇을 설명하려고 나왔나</tspan><tspan x="806.5" dy="16.833">규범성이 자연 사실로</tspan><tspan x="806.5" dy="16.833">다 잡히지 않는다는 느낌을</tspan><tspan x="806.5" dy="16.833">그대로 살린다.</tspan><tspan x="806.5" dy="16.833">열린 물음이 왜 열려 보이는지도</tspan><tspan x="806.5" dy="16.833">곧바로 설명된다</tspan></text></g><g ><g class="shape"><path d="M986 523h310v162H986z" class="stroke-B2 fill-B6 s2"/></g><text x="1141" y="561.5" class="text-bold fill-N1 s1"><tspan x="1141" dy="0">대가</tspan><tspan x="1141" dy="16.714">자연적이지 않은 사실을</tspan><tspan x="1141" dy="16.714">우리가 어떻게 아는가.</tspan><tspan x="1141" dy="16.714">그리고 수반을 설명해야 한다 —</tspan><tspan x="1141" dy="16.714">다른 종류의 속성이</tspan><tspan x="1141" dy="16.714">왜 자연적 속성에</tspan><tspan x="1141" dy="16.714">그렇게 딱 붙어 다니는가</tspan></text></g><text x="654" y="721" class="fill-N1 s1"><tspan x="654" dy="0">이 그림에서 어느 갈래가 이겼다고 읽으면 안 된다.</tspan><tspan x="654" dy="17.667">도덕 실재론과 반실재론의 다툼은 미결이고,</tspan><tspan x="654" dy="17.667">실재론 안의 두 갈래도 미결이다</tspan></text><marker id="mk-d2-2242486621-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2242486621-3488378134)" d="M593.416 128v28s0 10-10 10H318.75s-10 0-10 10v133" class="connection stroke-B1 s0" mask="url(#d2-2242486621)"/><text x="398" y="164" class="text-italic fill-N2 s1"><tspan x="398" dy="0">도덕 속성이 자연적 속성인가 —</tspan><tspan x="398" dy="18.5">그렇다</tspan></text><path fill="none" marker-end="url(#mk-d2-2242486621-3488378134)" d="M719.083 128v28s0 10 10 10H963.75s10 0 10 10v133" class="connection stroke-B1 s0" mask="url(#d2-2242486621)"/><text x="900" y="172" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-2242486621-3488378134)" d="M150 445v74" class="connection stroke-B1 s0" mask="url(#d2-2242486621)"/><path fill="none" marker-end="url(#mk-d2-2242486621-3488378134)" d="M467.5 445v74" class="connection stroke-B1 s0" mask="url(#d2-2242486621)"/><path fill="none" marker-end="url(#mk-d2-2242486621-3488378134)" d="M934.25 445v74" class="connection stroke-B1 s0" mask="url(#d2-2242486621)"/><path fill="none" marker-end="url(#mk-d2-2242486621-3488378134)" d="M1013.25 445v74" class="connection stroke-B1 s0" mask="url(#d2-2242486621)"/><mask id="d2-2242486621" width="1486" height="948" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h1486v948H-89z"/><path d="M269 148h258v37H269zM869 156h62v21h-62z"/></mask></svg>