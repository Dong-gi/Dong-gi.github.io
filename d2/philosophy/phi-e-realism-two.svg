<svg xmlns="http://www.w3.org/2000/svg" width="973" height="1238" class="d2-1581570651 d2-svg" viewBox="-89 -89 973 1238"><rect width="973" height="1238" x="-89" y="-89" rx="0" style="fill:#fff"/><style>.d2-1581570651 .text-bold{font-weight:700}.d2-1581570651 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1581570651 .fill-N1{fill:#0a0f25}.d2-1581570651 .fill-N2{fill:#676c7e}.d2-1581570651 .fill-B6{fill:#f7f8fe}.d2-1581570651 .stroke-B1,.d2-1581570651 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M257 12h377v114H257z" class="stroke-B1 fill-B6 s0"/></g><text x="445.5" y="50.5" class="text-bold fill-N1 s1"><tspan x="445.5" dy="0">도덕 실재론</tspan><tspan x="445.5" dy="17.25">① 도덕 문장은 참·거짓을 가질 수 있다</tspan><tspan x="445.5" dy="17.25">② 그중 참인 것이 실제로 있다</tspan><tspan x="445.5" dy="17.25">③ 그 참은 우리 태도에 의존하지 않는다</tspan></text></g><g ><g class="shape"><path d="M81 329h316v162H81z" class="stroke-B1 fill-B6 s0"/></g><text x="239" y="367.5" class="text-bold fill-N1 s1"><tspan x="239" dy="0">자연주의적 실재론</tspan><tspan x="239" dy="16.714">도덕 속성은 자연적 속성이다.</tspan><tspan x="239" dy="16.714">다만 짧은 정의로</tspan><tspan x="239" dy="16.714">갈아 끼울 수 있다는</tspan><tspan x="239" dy="16.714">뜻은 아니다 — 건강이나 종처럼,</tspan><tspan x="239" dy="16.714">자연적이면서</tspan><tspan x="239" dy="16.714">정의되지 않을 수 있다</tspan></text></g><g ><g class="shape"><path d="M509 350h237v130H509z" class="stroke-B1 fill-B6 s0"/></g><text x="627.5" y="388.5" class="text-bold fill-N1 s1"><tspan x="627.5" dy="0">비자연주의적 실재론</tspan><tspan x="627.5" dy="17">도덕 속성은 있지만</tspan><tspan x="627.5" dy="17">자연적 속성이 아니다.</tspan><tspan x="627.5" dy="17">무어가 이 길을 냈고</tspan><tspan x="627.5" dy="17">지금도 지지자가 있다</tspan></text></g><g ><g class="shape"><path d="M12 571h276v162H12z" class="stroke-B1 fill-B6 s0"/></g><text x="150" y="609.5" class="text-bold fill-N1 s1"><tspan x="150" dy="0">무엇을 설명하려고 나왔나</tspan><tspan x="150" dy="16.714">도덕 사실이 어떻게</tspan><tspan x="150" dy="16.714">세상 안에 자리 잡는지,</tspan><tspan x="150" dy="16.714">어떻게 알려지는지를</tspan><tspan x="150" dy="16.714">다른 과학과 같은 방식으로</tspan><tspan x="150" dy="16.714">설명한다.</tspan><tspan x="150" dy="16.714">수반도 저절로 설명된다</tspan></text></g><g ><g class="shape"><path d="M79 813h319v162H79z" class="stroke-B2 fill-B6 s2"/></g><text x="238.5" y="851.5" class="text-bold fill-N1 s1"><tspan x="238.5" dy="0">대가</tspan><tspan x="238.5" dy="16.714">열린 물음이 왜 열려 보이는지를</tspan><tspan x="238.5" dy="16.714">따로 설명해야 한다.</tspan><tspan x="238.5" dy="16.714">그리고 도덕 사실이</tspan><tspan x="238.5" dy="16.714">무엇을 설명하는 데</tspan><tspan x="238.5" dy="16.714">정말 필요한지를 보여야 한다 —</tspan><tspan x="238.5" dy="16.714">하먼이 이 자리를 파고들었다</tspan></text></g><g ><g class="shape"><path d="M369 579h319v146H369z" class="stroke-B1 fill-B6 s0"/></g><text x="528.5" y="617.5" class="text-bold fill-N1 s1"><tspan x="528.5" dy="0">무엇을 설명하려고 나왔나</tspan><tspan x="528.5" dy="16.833">규범성이 자연 사실로</tspan><tspan x="528.5" dy="16.833">다 잡히지 않는다는 느낌을</tspan><tspan x="528.5" dy="16.833">그대로 살린다.</tspan><tspan x="528.5" dy="16.833">열린 물음이 왜 열려 보이는지도</tspan><tspan x="528.5" dy="16.833">곧바로 설명된다</tspan></text></g><g ><g class="shape"><path d="M473 813h310v162H473z" class="stroke-B2 fill-B6 s2"/></g><text x="628" y="851.5" class="text-bold fill-N1 s1"><tspan x="628" dy="0">대가</tspan><tspan x="628" dy="16.714">자연적이지 않은 사실을</tspan><tspan x="628" dy="16.714">우리가 어떻게 아는가.</tspan><tspan x="628" dy="16.714">그리고 수반을 설명해야 한다 —</tspan><tspan x="628" dy="16.714">다른 종류의 속성이</tspan><tspan x="628" dy="16.714">왜 자연적 속성에</tspan><tspan x="628" dy="16.714">그렇게 딱 붙어 다니는가</tspan></text></g><text x="397" y="1011" class="fill-N1 s1"><tspan x="397" dy="0">이 그림에서 어느 갈래가 이겼다고 읽으면 안 된다.</tspan><tspan x="397" dy="17.667">도덕 실재론과 반실재론의 다툼은 미결이고,</tspan><tspan x="397" dy="17.667">실재론 안의 두 갈래도 미결이다</tspan></text><marker id="mk-d2-1581570651-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1581570651-3488378134)" d="M382.75 128v197" class="connection stroke-B1 s0" mask="url(#d2-1581570651)"/><text x="383" y="217" class="text-italic fill-N2 s1"><tspan x="383" dy="0">도덕 속성이</tspan><tspan x="383" dy="17.667">자연적 속성인가 —</tspan><tspan x="383" dy="17.667">그렇다</tspan></text><path fill="none" marker-end="url(#mk-d2-1581570651-3488378134)" d="M508.416 128v28s0 10 10 10h99.834s10 0 10 10v170" class="connection stroke-B1 s0" mask="url(#d2-1581570651)"/><text x="628" y="184" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-1581570651-3488378134)" d="M150 493v74" class="connection stroke-B1 s0" mask="url(#d2-1581570651)"/><path fill="none" marker-end="url(#mk-d2-1581570651-3488378134)" d="M328 493v316" class="connection stroke-B1 s0" mask="url(#d2-1581570651)"/><path fill="none" marker-end="url(#mk-d2-1581570651-3488378134)" d="M528.5 482v93" class="connection stroke-B1 s0" mask="url(#d2-1581570651)"/><path fill="none" marker-end="url(#mk-d2-1581570651-3488378134)" d="M728 482v327" class="connection stroke-B1 s0" mask="url(#d2-1581570651)"/><mask id="d2-1581570651" width="973" height="1238" x="-89" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-89h973v1238H-89z"/><path d="M305 201h156v53H305zM597 168h62v21h-62z"/></mask></svg>