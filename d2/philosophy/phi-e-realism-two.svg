<svg xmlns="http://www.w3.org/2000/svg" width="2981" height="822" class="d2-2315515869 d2-svg" viewBox="-101 -101 2981 822"><rect width="2981" height="822" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2315515869 .fill-N1{fill:#0a0f25}.d2-2315515869 .fill-N2{fill:#676c7e}.d2-2315515869 .fill-B6{fill:#f7f8fe}.d2-2315515869 .stroke-B1,.d2-2315515869 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><path d="M132 253h377v114H132z" class="stroke-B1 fill-B6 s0"/></g><text x="320.5" y="291.5" class="text-bold fill-N1 s1"><tspan x="320.5" dy="0">도덕 실재론</tspan><tspan x="320.5" dy="17.25">① 도덕 문장은 참·거짓을 가질 수 있다</tspan><tspan x="320.5" dy="17.25">② 그중 참인 것이 실제로 있다</tspan><tspan x="320.5" dy="17.25">③ 그 참은 우리 태도에 의존하지 않는다</tspan></text></g><g ><g class="shape"><path d="M1311 87h513v114h-513z" class="stroke-B1 fill-B6 s0"/></g><text x="1567.5" y="125.5" class="text-bold fill-N1 s1"><tspan x="1567.5" dy="0">자연주의적 실재론</tspan><tspan x="1567.5" dy="17.25">도덕 속성은 자연적 속성이다.</tspan><tspan x="1567.5" dy="17.25">다만 짧은 정의로 갈아 끼울 수 있다는 뜻은 아니다 —</tspan><tspan x="1567.5" dy="17.25">건강이나 종처럼, 자연적이면서 정의되지 않을 수 있다</tspan></text></g><g ><g class="shape"><path d="M1364 431h408v98h-408z" class="stroke-B1 fill-B6 s0"/></g><text x="1568" y="469.5" class="text-bold fill-N1 s1"><tspan x="1568" dy="0">비자연주의적 실재론</tspan><tspan x="1568" dy="17.667">도덕 속성은 있지만 자연적 속성이 아니다.</tspan><tspan x="1568" dy="17.667">무어가 이 길을 냈고 지금도 지지자가 있다</tspan></text></g><g ><g class="shape"><path d="M2203 0h553v114h-553z" class="stroke-B1 fill-B6 s0"/></g><text x="2479.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="2479.5" dy="0">무엇을 설명하려고 나왔나</tspan><tspan x="2479.5" dy="17.25">도덕 사실이 어떻게 세상 안에 자리 잡는지,</tspan><tspan x="2479.5" dy="17.25">어떻게 알려지는지를 다른 과학과 같은 방식으로 설명한다.</tspan><tspan x="2479.5" dy="17.25">수반도 저절로 설명된다</tspan></text></g><g ><g class="shape"><path d="M2214 174h531v114h-531z" class="stroke-B2 fill-B6 s2"/></g><text x="2479.5" y="212.5" class="text-bold fill-N1 s1"><tspan x="2479.5" dy="0">대가</tspan><tspan x="2479.5" dy="17.25">열린 물음이 왜 열려 보이는지를 따로 설명해야 한다.</tspan><tspan x="2479.5" dy="17.25">그리고 도덕 사실이 무엇을 설명하는 데 정말 필요한지를</tspan><tspan x="2479.5" dy="17.25">보여야 한다 — 하먼이 이 자리를 파고들었다</tspan></text></g><g ><g class="shape"><path d="M2179 348h600v98h-600z" class="stroke-B1 fill-B6 s0"/></g><text x="2479" y="386.5" class="text-bold fill-N1 s1"><tspan x="2479" dy="0">무엇을 설명하려고 나왔나</tspan><tspan x="2479" dy="17.667">규범성이 자연 사실로 다 잡히지 않는다는 느낌을 그대로 살린다.</tspan><tspan x="2479" dy="17.667">열린 물음이 왜 열려 보이는지도 곧바로 설명된다</tspan></text></g><g ><g class="shape"><path d="M2238 506h482v114h-482z" class="stroke-B2 fill-B6 s2"/></g><text x="2479" y="544.5" class="text-bold fill-N1 s1"><tspan x="2479" dy="0">대가</tspan><tspan x="2479" dy="17.25">자연적이지 않은 사실을 우리가 어떻게 아는가.</tspan><tspan x="2479" dy="17.25">그리고 수반을 설명해야 한다 — 다른 종류의 속성이</tspan><tspan x="2479" dy="17.25">왜 자연적 속성에 그렇게 딱 붙어 다니는가</tspan></text></g><text x="320.5" y="443" class="fill-N1 s1"><tspan x="320.5" dy="0">이 그림에서 어느 갈래가 이겼다고 읽으면 안 된다.</tspan><tspan x="320.5" dy="18.5">도덕 실재론과 반실재론의 다툼은 미결이고, 실재론 안의 두 갈래도 미결이다</tspan></text><marker id="mk-d2-2315515869-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2315515869-3488378134)" d="M510.94 261.51C882.6 167.6 1043 144 1307 144" class="connection stroke-B1 s0" mask="url(#d2-2315515869)"/><text x="904.5" y="170" class="text-italic fill-N2 s1">도덕 속성이 자연적 속성인가 — 그렇다</text><path fill="none" marker-end="url(#mk-d2-2315515869-3488378134)" d="M510.936 359.502C882.6 455.8 1053.5 480 1359.5 480" class="connection stroke-B1 s0" mask="url(#d2-2315515869)"/><text x="930" y="468" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-2315515869-3488378134)" d="M1825.46 92.604C1965.9 64.2 2041.7 57 2198.5 57" class="connection stroke-B1 s0" mask="url(#d2-2315515869)"/><path fill="none" marker-end="url(#mk-d2-2315515869-3488378134)" d="M1825.46 195.396C1965.9 223.8 2043.9 231 2209.5 231" class="connection stroke-B1 s0" mask="url(#d2-2315515869)"/><path fill="none" marker-end="url(#mk-d2-2315515869-3488378134)" d="M1774.464 440.609C1955.7 405.797 2037.1 397 2175.5 397" class="connection stroke-B1 s0" mask="url(#d2-2315515869)"/><path fill="none" marker-end="url(#mk-d2-2315515869-3488378134)" d="M1774.464 519.39C1955.7 554.202 2048.9 563 2234.5 563" class="connection stroke-B1 s0" mask="url(#d2-2315515869)"/><mask id="d2-2315515869" width="2981" height="822" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2981v822H-101z"/><path d="M745 154h319v21H745zM899 452h62v21h-62z"/></mask></svg>