<svg xmlns="http://www.w3.org/2000/svg" width="1549" height="1013" class="d2-338319030 d2-svg" viewBox="-101 -101 1549 1013"><rect width="1549" height="1013" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-338319030 .fill-N1{fill:#0a0f25}.d2-338319030 .fill-N2{fill:#676c7e}.d2-338319030 .fill-B6{fill:#f7f8fe}.d2-338319030 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="662.5" cy="120.5" class="shape stroke-B1 fill-B6 s0" rx="361.5" ry="120.5"/></g><text x="662.5" y="118" class="text-bold fill-N1 s1"><tspan x="662.5" dy="0">무엇이 믿음을 정당화하는가.</tspan><tspan x="662.5" dy="18.5">그것에 믿는 사람이 반성으로 접근할 수 있어야 하는가</tspan></text></g><g ><g class="shape"><path d="M61 362h235v82H61z" class="stroke-B1 fill-B6 s0"/></g><text x="178.5" y="400.5" class="text-bold fill-N1 s1"><tspan x="178.5" dy="0">내재주의</tspan><tspan x="178.5" dy="18.5">접근할 수 있어야 한다</tspan></text></g><g ><g class="shape"><path d="M567 362h191v82H567z" class="stroke-B1 fill-B6 s0"/></g><text x="662.5" y="400.5" class="text-bold fill-N1 s1"><tspan x="662.5" dy="0">외재주의</tspan><tspan x="662.5" dy="18.5">그럴 필요는 없다</tspan></text></g><g ><g class="shape"><path d="M15 544h326v114H15z" class="stroke-B1 fill-B6 s0"/></g><text x="178" y="582.5" class="text-bold fill-N1 s1"><tspan x="178" dy="0">왜 그렇게 말하는가 —</tspan><tspan x="178" dy="17.25">정당화는 인식적 책임의 문제다.</tspan><tspan x="178" dy="17.25">내가 댈 수 없는 것으로 내 믿음이</tspan><tspan x="178" dy="17.25">정당해진다는 말은 이상하다</tspan></text></g><g ><g class="shape"><path d="M491 544h343v114H491z" class="stroke-B1 fill-B6 s0"/></g><text x="662.5" y="582.5" class="text-bold fill-N1 s1"><tspan x="662.5" dy="0">왜 그렇게 말하는가 —</tspan><tspan x="662.5" dy="17.25">어린아이와 동물도 안다.</tspan><tspan x="662.5" dy="17.25">자기 근거를 반성해 댈 수 없는데도</tspan><tspan x="662.5" dy="17.25">앎을 인정해야 하는 자리가 있다</tspan></text></g><text x="178" y="774" class="fill-N1 s1"><tspan x="178" dy="0">치르는 값 — 대부분의 지각과 기억에서</tspan><tspan x="178" dy="17.667">우리가 실제로 댈 수 있는 근거는 빈약하다.</tspan><tspan x="178" dy="17.667">아는 것이 크게 줄어든다</tspan></text><text x="662.5" y="774" class="fill-N1 s1"><tspan x="662.5" dy="0">치르는 값 — 통 속의 뇌는 우리와 똑같이 신중한데도</tspan><tspan x="662.5" dy="17.667">과정이 신빙성이 없으므로 정당화되지 않는다고 해야 한다.</tspan><tspan x="662.5" dy="17.667">이것을 새로운 악령 문제라 부른다</tspan></text><text x="1082.5" y="393" class="fill-N1 s1"><tspan x="1082.5" dy="0">이 갈림은 토대론·정합론과 가로지른다.</tspan><tspan x="1082.5" dy="17.667">내재주의 토대론도 외재주의 토대론도 있고,</tspan><tspan x="1082.5" dy="17.667">정합론은 대체로 내재주의 쪽이며 신빙론은 외재주의의 대표다</tspan></text><marker id="mk-d2-338319030-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-338319030-3488378134)" d="M419.128 210.705C226.6 283.2 178 313.7 178 358.5" class="connection stroke-B1 s0" mask="url(#d2-338319030)"/><text x="274" y="271" class="text-italic fill-N2 s1">그래야 한다</text><path fill="none" marker-end="url(#mk-d2-338319030-3488378134)" d="M662.983 243c-.383 46.4-.483 70.7-.483 115.5" class="connection stroke-B1 s0" mask="url(#d2-338319030)"/><text x="663" y="307" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-338319030-3488378134)" d="M178 446v94" class="connection stroke-B1 s0" mask="url(#d2-338319030)"/><path fill="none" marker-end="url(#mk-d2-338319030-3488378134)" d="M662.5 446v94" class="connection stroke-B1 s0" mask="url(#d2-338319030)"/><path fill="none" marker-end="url(#mk-d2-338319030-3488378134)" d="M178 660v94" class="connection stroke-B1 s0" mask="url(#d2-338319030)"/><path fill="none" marker-end="url(#mk-d2-338319030-3488378134)" d="M662.5 660v94" class="connection stroke-B1 s0" mask="url(#d2-338319030)"/><path fill="none" marker-end="url(#mk-d2-338319030-3488378134)" d="M886.832 215.802C1043 284.2 1082.5 316.5 1082.5 372.5" class="connection stroke-B1 s0" mask="url(#d2-338319030)"/><text x="1014.5" y="277" class="text-italic fill-N2 s1">주의</text><mask id="d2-338319030" width="1549" height="1013" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1549V912H-101z"/><path d="M222 255h104v21H222zM632 291h62v21h-62zM993 261h43v21h-43z"/></mask></svg>