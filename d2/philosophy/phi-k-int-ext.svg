<svg xmlns="http://www.w3.org/2000/svg" width="1023" height="1095" class="d2-3437481622 d2-svg" viewBox="-101 -101 1023 1095"><rect width="1023" height="1095" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3437481622 .text-bold{font-weight:700}.d2-3437481622 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3437481622 .fill-N1{fill:#0a0f25}.d2-3437481622 .fill-N2{fill:#676c7e}.d2-3437481622 .fill-B6{fill:#f7f8fe}.d2-3437481622 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="441" cy="80" class="shape stroke-B1 fill-B6 s0" rx="240" ry="80"/></g><text x="441" y="69.5" class="text-bold fill-N1 s1"><tspan x="441" dy="0">무엇이 믿음을 정당화하는가.</tspan><tspan x="441" dy="17.667">그것에 믿는 사람이</tspan><tspan x="441" dy="17.667">반성으로 접근할 수 있어야 하는가</tspan></text></g><g ><g class="shape"><path d="M9 307h235v82H9z" class="stroke-B1 fill-B6 s0"/></g><text x="126.5" y="345.5" class="text-bold fill-N1 s1"><tspan x="126.5" dy="0">내재주의</tspan><tspan x="126.5" dy="18.5">접근할 수 있어야 한다</tspan></text></g><g ><g class="shape"><path d="M345 307h191v82H345z" class="stroke-B1 fill-B6 s0"/></g><text x="440.5" y="345.5" class="text-bold fill-N1 s1"><tspan x="440.5" dy="0">외재주의</tspan><tspan x="440.5" dy="18.5">그럴 필요는 없다</tspan></text></g><g ><g class="shape"><path d="M0 514h252v146H0z" class="stroke-B1 fill-B6 s0"/></g><text x="126" y="552.5" class="text-bold fill-N1 s1"><tspan x="126" dy="0">왜 그렇게 말하는가 —</tspan><tspan x="126" dy="16.833">정당화는 인식적</tspan><tspan x="126" dy="16.833">책임의 문제다.</tspan><tspan x="126" dy="16.833">내가 댈 수 없는 것으로</tspan><tspan x="126" dy="16.833">내 믿음이 정당해진다는</tspan><tspan x="126" dy="16.833">말은 이상하다</tspan></text></g><g ><g class="shape"><path d="M312 514h257v146H312z" class="stroke-B1 fill-B6 s0"/></g><text x="440.5" y="552.5" class="text-bold fill-N1 s1"><tspan x="440.5" dy="0">왜 그렇게 말하는가 —</tspan><tspan x="440.5" dy="16.833">어린아이와 동물도 안다.</tspan><tspan x="440.5" dy="16.833">자기 근거를 반성해</tspan><tspan x="440.5" dy="16.833">댈 수 없는데도</tspan><tspan x="440.5" dy="16.833">앎을 인정해야 하는</tspan><tspan x="440.5" dy="16.833">자리가 있다</tspan></text></g><text x="126.5" y="800" class="fill-N1 s1"><tspan x="126.5" dy="0">치르는 값 —</tspan><tspan x="126.5" dy="17">대부분의 지각과 기억에서</tspan><tspan x="126.5" dy="17">우리가 실제로 댈 수 있는</tspan><tspan x="126.5" dy="17">근거는 빈약하다.</tspan><tspan x="126.5" dy="17">아는 것이 크게 줄어든다</tspan></text><text x="440.5" y="776" class="fill-N1 s1"><tspan x="440.5" dy="0">치르는 값 — 속는 세계의</tspan><tspan x="440.5" dy="16.625">사람은 우리와 똑같이</tspan><tspan x="440.5" dy="16.625">신중한데도 과정이</tspan><tspan x="440.5" dy="16.625">신빙성이 없으므로</tspan><tspan x="440.5" dy="16.625">정당화되지 않는다고</tspan><tspan x="440.5" dy="16.625">해야 한다.</tspan><tspan x="440.5" dy="16.625">이것을 새로운</tspan><tspan x="440.5" dy="16.625">악령 문제라 부른다</tspan></text><text x="708.5" y="297" class="fill-N1 s1"><tspan x="708.5" dy="0">이 갈림은 토대론·정합론과</tspan><tspan x="708.5" dy="16.625">가로지른다.</tspan><tspan x="708.5" dy="16.625">내재주의 토대론도</tspan><tspan x="708.5" dy="16.625">외재주의 토대론도 있고,</tspan><tspan x="708.5" dy="16.625">정합론은 대체로</tspan><tspan x="708.5" dy="16.625">내재주의 쪽이며</tspan><tspan x="708.5" dy="16.625">신빙론은 외재주의의</tspan><tspan x="708.5" dy="16.625">대표다</tspan></text><marker id="mk-d2-3437481622-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3437481622-3488378134)" d="M294.176 144.82C160 205.2 126 237.7 126 302.5" class="connection stroke-B1 s0" mask="url(#d2-3437481622)"/><text x="175" y="204" class="text-italic fill-N2 s1">그래야 한다</text><path fill="none" marker-end="url(#mk-d2-3437481622-3488378134)" d="M440.983 162c-.383 46.4-.483 75.7-.483 140.5" class="connection stroke-B1 s0" mask="url(#d2-3437481622)"/><text x="441" y="239" class="text-italic fill-N2 s1">아니다</text><path fill="none" marker-end="url(#mk-d2-3437481622-3488378134)" d="M126 391.5V510" class="connection stroke-B1 s0" mask="url(#d2-3437481622)"/><path fill="none" marker-end="url(#mk-d2-3437481622-3488378134)" d="M440.5 391.5V510" class="connection stroke-B1 s0" mask="url(#d2-3437481622)"/><path fill="none" marker-end="url(#mk-d2-3437481622-3488378134)" d="M126 662v118" class="connection stroke-B1 s0" mask="url(#d2-3437481622)"/><path fill="none" marker-end="url(#mk-d2-3437481622-3488378134)" d="M440.5 662v94" class="connection stroke-B1 s0" mask="url(#d2-3437481622)"/><path fill="none" marker-end="url(#mk-d2-3437481622-3488378134)" d="M572.764 147.943C681 205.8 708.5 232.7 708.5 277.5" class="connection stroke-B1 s0" mask="url(#d2-3437481622)"/><text x="664.5" y="202" class="text-italic fill-N2 s1">주의</text><mask id="d2-3437481622" width="1023" height="1095" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H922V994H-101z"/><path d="M123 188h104v21H123zM410 223h62v21h-62zM643 186h43v21h-43z"/></mask></svg>