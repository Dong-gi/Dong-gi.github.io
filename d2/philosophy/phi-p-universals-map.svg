<svg xmlns="http://www.w3.org/2000/svg" width="2239" height="1094" class="d2-3509652418 d2-svg" viewBox="-101 -101 2239 1094"><rect width="2239" height="1094" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3509652418 .fill-N1{fill:#0a0f25}.d2-3509652418 .fill-B6{fill:#f7f8fe}.d2-3509652418 .stroke-B1,.d2-3509652418 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="271" cy="405.5" class="shape stroke-B1 fill-B6 s0" rx="271" ry="90.5"/></g><text x="271" y="411" class="text-bold fill-N1 s1">빨간 것 둘이 정말 무언가를 공유하는가</text></g><g ><g class="shape"><path d="M681 166h212v82H681z" class="stroke-B1 fill-B6 s0"/></g><text x="787" y="204.5" class="text-bold fill-N1 s1"><tspan x="787" dy="0">실재론 — 공유한다.</tspan><tspan x="787" dy="18.5">그 하나가 보편자다</tspan></text></g><g ><g class="shape"><path d="M664 365h246v82H664z" class="stroke-B1 fill-B6 s0"/></g><text x="787" y="403.5" class="text-bold fill-N1 s1"><tspan x="787" dy="0">개념론 — 공유하는 것은</tspan><tspan x="787" dy="18.5">우리가 만든 개념이다</tspan></text></g><g ><g class="shape"><path d="M642 638h290v66H642z" class="stroke-B1 fill-B6 s0"/></g><text x="787" y="676.5" class="text-bold fill-N1 s1">유명론 — 개별자 말고는 없다</text></g><g ><g class="shape"><path d="M1075 0h388v98h-388z" class="stroke-B1 fill-B6 s0"/></g><text x="1269" y="38.5" class="text-bold fill-N1 s1"><tspan x="1269" dy="0">초월적 보편자 (플라톤)</tspan><tspan x="1269" dy="17.667">사례가 하나도 없어도 그 보편자는 있다.</tspan><tspan x="1269" dy="17.667">아직 아무도 못 만든 색도 있다</tspan></text></g><g ><g class="shape"><path d="M1083 158h373v98h-373z" class="stroke-B1 fill-B6 s0"/></g><text x="1269.5" y="196.5" class="text-bold fill-N1 s1"><tspan x="1269.5" dy="0">내재적 보편자 (아리스토텔레스)</tspan><tspan x="1269.5" dy="17.667">사례 안에만, 사례가 있는 동안만 있다.</tspan><tspan x="1269.5" dy="17.667">사례가 없는 보편자는 없다</tspan></text></g><g ><g class="shape"><path d="M1085 413h368v82h-368z" class="stroke-B1 fill-B6 s0"/></g><text x="1269" y="451.5" class="text-bold fill-N1 s1"><tspan x="1269" dy="0">술어 유명론</tspan><tspan x="1269" dy="18.5">둘 다 ‘빨갛다’ 가 참인 것들일 뿐이다</tspan></text></g><g ><g class="shape"><path d="M1142 555h255v82h-255z" class="stroke-B1 fill-B6 s0"/></g><text x="1269.5" y="593.5" class="text-bold fill-N1 s1"><tspan x="1269.5" dy="0">유사성 유명론</tspan><tspan x="1269.5" dy="18.5">둘이 서로 닮았을 뿐이다</tspan></text></g><g ><g class="shape"><path d="M1117 697h305v98h-305z" class="stroke-B1 fill-B6 s0"/></g><text x="1269.5" y="735.5" class="text-bold fill-N1 s1"><tspan x="1269.5" dy="0">트롭 이론</tspan><tspan x="1269.5" dy="17.667">사과마다 제 빨감이 따로 있고,</tspan><tspan x="1269.5" dy="17.667">그 빨감들이 서로 닮았다</tspan></text></g><text x="1269" y="332" class="fill-N1 s1"><tspan x="1269" dy="0">실재론이 갚을 빚 — 보편자가 어디에 어떻게 있는가.</tspan><tspan x="1269" dy="18.5">하나가 여러 자리에 통째로 있다는 것은 무슨 뜻인가</tspan></text><text x="1269" y="871" class="fill-N1 s1"><tspan x="1269" dy="0">유명론이 갚을 빚 — 왜 하필 그 낱말이 그것들에 걸치는가.</tspan><tspan x="1269" dy="18.5">‘닮았다’ 자체가 다시 여럿에 걸친 하나가 아닌가</tspan></text><text x="1821.5" y="594" class="fill-N1 s1"><tspan x="1821.5" dy="0">이 다툼은 미결이다. 어느 줄도 정답이 아니고,</tspan><tspan x="1821.5" dy="17.667">각 줄이 무엇을 설명하고 무엇을 대가로 치르는지가</tspan><tspan x="1821.5" dy="17.667">이 절이 보여야 할 전부다</tspan></text><marker id="mk-d2-3509652418-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3509652418-3488378134)" d="M400.702 324.95C553.4 230.8 609.8 207 677 207" class="connection stroke-B1 s0" mask="url(#d2-3509652418)"/><path fill="none" marker-end="url(#mk-d2-3509652418-3488378134)" d="M544 405.98c38-.38 62.4-.48 116-.48" class="connection stroke-B1 s0" mask="url(#d2-3509652418)"/><path fill="none" marker-end="url(#mk-d2-3509652418-3488378134)" d="M373.541 490.275C548 634.6 602 671 638 671" class="connection stroke-B1 s0" mask="url(#d2-3509652418)"/><path fill="none" marker-end="url(#mk-d2-3509652418-3488378134)" d="M839.552 164.739C953.2 72.399 1000.6 49 1071 49" class="connection stroke-B1 s0" mask="url(#d2-3509652418)"/><path fill="none" marker-end="url(#mk-d2-3509652418-3488378134)" d="M895 207h183.5" class="connection stroke-B1 s0" mask="url(#d2-3509652418)"/><path fill="none" marker-end="url(#mk-d2-3509652418-3488378134)" d="M818.335 636.511C949 490.799 1002.6 454 1081 454" class="connection stroke-B1 s0" mask="url(#d2-3509652418)"/><path fill="none" marker-end="url(#mk-d2-3509652418-3488378134)" d="M874.866 637.28C960.2 604.4 1013.9 596 1137.5 596" class="connection stroke-B1 s0" mask="url(#d2-3509652418)"/><path fill="none" marker-end="url(#mk-d2-3509652418-3488378134)" d="M874.866 704.72C960.2 737.6 1008.9 746 1112.5 746" class="connection stroke-B1 s0" mask="url(#d2-3509652418)"/><marker id="mk-d2-3509652418-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-3509652418-2177206569)" d="M851.67 248.6C955.6 317.1 996 334.5 1048 334.5" class="connection stroke-B2 s3" mask="url(#d2-3509652418)"/><path fill="none" marker-end="url(#mk-d2-3509652418-2177206569)" d="M820.384 704.944C949.4 839.5 992 873.5 1028 873.5" class="connection stroke-B2 s3" mask="url(#d2-3509652418)"/><mask id="d2-3509652418" width="2239" height="1094" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2239V993H-101z"/></mask></svg>