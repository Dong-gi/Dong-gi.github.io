<svg xmlns="http://www.w3.org/2000/svg" width="1205" height="1311" class="d2-1253879951 d2-svg" viewBox="-101 -101 1205 1311"><rect width="1205" height="1311" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1253879951 .fill-N1{fill:#0a0f25}.d2-1253879951 .fill-B6{fill:#f7f8fe}.d2-1253879951 .stroke-B1,.d2-1253879951 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{fill:#0d32b2}.s3{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="116.5" cy="462" class="shape stroke-B1 fill-B6 s0" rx="116.5" ry="53"/></g><text x="116.5" y="451.5" class="text-bold fill-N1 s1"><tspan x="116.5" dy="0">빨간 것 둘이</tspan><tspan x="116.5" dy="17.667">정말 무언가를</tspan><tspan x="116.5" dy="17.667">공유하는가</tspan></text></g><g ><g class="shape"><path d="M350 190h212v82H350z" class="stroke-B1 fill-B6 s0"/></g><text x="456" y="228.5" class="text-bold fill-N1 s1"><tspan x="456" dy="0">실재론 — 공유한다.</tspan><tspan x="456" dy="18.5">그 하나가 보편자다</tspan></text></g><g ><g class="shape"><path d="M333 425h246v82H333z" class="stroke-B1 fill-B6 s0"/></g><text x="456" y="463.5" class="text-bold fill-N1 s1"><tspan x="456" dy="0">개념론 — 공유하는 것은</tspan><tspan x="456" dy="18.5">우리가 만든 개념이다</tspan></text></g><g ><g class="shape"><path d="M350 726h212v82H350z" class="stroke-B1 fill-B6 s0"/></g><text x="456" y="764.5" class="text-bold fill-N1 s1"><tspan x="456" dy="0">유명론 —</tspan><tspan x="456" dy="18.5">개별자 말고는 없다</tspan></text></g><g ><g class="shape"><path d="M690 0h302v114H690z" class="stroke-B1 fill-B6 s0"/></g><text x="841" y="38.5" class="text-bold fill-N1 s1"><tspan x="841" dy="0">초월적 보편자 (플라톤)</tspan><tspan x="841" dy="17.25">사례가 하나도 없어도</tspan><tspan x="841" dy="17.25">그 보편자는 있다.</tspan><tspan x="841" dy="17.25">아직 아무도 못 만든 색도 있다</tspan></text></g><g ><g class="shape"><path d="M679 174h324v114H679z" class="stroke-B1 fill-B6 s0"/></g><text x="841" y="212.5" class="text-bold fill-N1 s1"><tspan x="841" dy="0">내재적 보편자 (아리스토텔레스)</tspan><tspan x="841" dy="17.25">사례 안에만,</tspan><tspan x="841" dy="17.25">사례가 있는 동안만 있다.</tspan><tspan x="841" dy="17.25">사례가 없는 보편자는 없다</tspan></text></g><g ><g class="shape"><path d="M735 493h212v98H735z" class="stroke-B1 fill-B6 s0"/></g><text x="841" y="531.5" class="text-bold fill-N1 s1"><tspan x="841" dy="0">술어 유명론</tspan><tspan x="841" dy="17.667">둘 다 ‘빨갛다’ 가</tspan><tspan x="841" dy="17.667">참인 것들일 뿐이다</tspan></text></g><g ><g class="shape"><path d="M714 651h255v82H714z" class="stroke-B1 fill-B6 s0"/></g><text x="841.5" y="689.5" class="text-bold fill-N1 s1"><tspan x="841.5" dy="0">유사성 유명론</tspan><tspan x="841.5" dy="18.5">둘이 서로 닮았을 뿐이다</tspan></text></g><g ><g class="shape"><path d="M689 793h305v98H689z" class="stroke-B1 fill-B6 s0"/></g><text x="841.5" y="831.5" class="text-bold fill-N1 s1"><tspan x="841.5" dy="0">트롭 이론</tspan><tspan x="841.5" dy="17.667">사과마다 제 빨감이 따로 있고,</tspan><tspan x="841.5" dy="17.667">그 빨감들이 서로 닮았다</tspan></text></g><text x="841.5" y="364" class="fill-N1 s1"><tspan x="841.5" dy="0">실재론이 갚을 빚 —</tspan><tspan x="841.5" dy="17">보편자가 어디에 어떻게 있는가.</tspan><tspan x="841.5" dy="17">하나가 여러 자리에</tspan><tspan x="841.5" dy="17">통째로 있다는 것은</tspan><tspan x="841.5" dy="17">무슨 뜻인가</tspan></text><text x="841.5" y="967" class="fill-N1 s1"><tspan x="841.5" dy="0">유명론이 갚을 빚 —</tspan><tspan x="841.5" dy="17">왜 하필 그 낱말이</tspan><tspan x="841.5" dy="17">그것들에 걸치는가.</tspan><tspan x="841.5" dy="17">‘닮았다’ 자체가 다시</tspan><tspan x="841.5" dy="17">여럿에 걸친 하나가 아닌가</tspan></text><text x="501.5" y="1072" class="fill-N1 s1"><tspan x="501.5" dy="0">이 다툼은 미결이다. 어느 줄도 정답이 아니고,</tspan><tspan x="501.5" dy="17.667">각 줄이 무엇을 설명하고 무엇을 대가로 치르는지가</tspan><tspan x="501.5" dy="17.667">이 절이 보여야 할 전부다</tspan></text><marker id="mk-d2-1253879951-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1253879951-3488378134)" d="M154.167 410.376C257 267.2 296.4 231 346 231" class="connection stroke-B1 s0" mask="url(#d2-1253879951)"/><path fill="none" marker-end="url(#mk-d2-1253879951-3488378134)" d="M235 465.05c38 .95 58 1.2 94 1.2" class="connection stroke-B1 s0" mask="url(#d2-1253879951)"/><path fill="none" marker-end="url(#mk-d2-1253879951-3488378134)" d="M144.96 514.754C255.2 716.2 296.4 767 346 767" class="connection stroke-B1 s0" mask="url(#d2-1253879951)"/><path fill="none" marker-end="url(#mk-d2-1253879951-3488378134)" d="M498.409 188.58C602.6 83.6 641.2 57 686 57" class="connection stroke-B1 s0" mask="url(#d2-1253879951)"/><path fill="none" marker-end="url(#mk-d2-1253879951-3488378134)" d="M564 231h111" class="connection stroke-B1 s0" mask="url(#d2-1253879951)"/><path fill="none" marker-end="url(#mk-d2-1253879951-3488378134)" d="M489.217 724.413C600.8 578.8 650.2 542 731 542" class="connection stroke-B1 s0" mask="url(#d2-1253879951)"/><path fill="none" marker-end="url(#mk-d2-1253879951-3488378134)" d="M552.833 725.2C613.4 698.8 645.9 692 709.5 692" class="connection stroke-B1 s0" mask="url(#d2-1253879951)"/><path fill="none" marker-end="url(#mk-d2-1253879951-3488378134)" d="M552.833 808.8C613.4 835.2 640.9 842 684.5 842" class="connection stroke-B1 s0" mask="url(#d2-1253879951)"/><marker id="mk-d2-1253879951-2177206569" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection s2"/></marker><path fill="none" marker-end="url(#mk-d2-1253879951-2177206569)" d="M501.47 272.856C603.2 366.7 644.7 390.5 703.5 390.5" class="connection stroke-B2 s3" mask="url(#d2-1253879951)"/><path fill="none" marker-end="url(#mk-d2-1253879951-2177206569)" d="M488.214 809.09C600.6 956.3 648.9 993.5 724.5 993.5" class="connection stroke-B2 s3" mask="url(#d2-1253879951)"/><mask id="d2-1253879951" width="1205" height="1311" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1205v1311H-101z"/></mask></svg>