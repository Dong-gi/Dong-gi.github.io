<svg xmlns="http://www.w3.org/2000/svg" width="1425" height="973" class="d2-3558564799 d2-svg" viewBox="-101 -101 1425 973"><rect width="1425" height="973" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3558564799 .fill-N1{fill:#0a0f25}.d2-3558564799 .fill-B6{fill:#f7f8fe}.d2-3558564799 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="606" cy="111" class="shape stroke-B1 fill-B6 s0" rx="333" ry="111"/></g><text x="606" y="108.5" class="text-bold fill-N1 s1"><tspan x="606" dy="0">결과주의의 뼈대</tspan><tspan x="606" dy="18.5">행위의 옳고 그름은 그 행위가 낳는 결과가 정한다</tspan></text></g><g ><g class="shape"><path d="M42 330h290v98H42z" class="stroke-B1 fill-B6 s0"/></g><text x="187" y="368.5" class="text-bold fill-N1 s1"><tspan x="187" dy="0">부품 ① 무엇이 좋은 결과인가</tspan><tspan x="187" dy="17.667">쾌락인가 · 선호의 만족인가 ·</tspan><tspan x="187" dy="17.667">객관적 목록인가</tspan></text></g><g ><g class="shape"><path d="M461 322h290v114H461z" class="stroke-B1 fill-B6 s0"/></g><text x="606" y="360.5" class="text-bold fill-N1 s1"><tspan x="606" dy="0">부품 ② 누구의 좋음을</tspan><tspan x="606" dy="17.25">어떻게 세는가</tspan><tspan x="606" dy="17.25">모두를 하나로 세고 더한다 —</tspan><tspan x="606" dy="17.25">총합과 공평성</tspan></text></g><g ><g class="shape"><path d="M865 330h330v98H865z" class="stroke-B1 fill-B6 s0"/></g><text x="1030" y="368.5" class="text-bold fill-N1 s1"><tspan x="1030" dy="0">부품 ③ 무엇을 결과로 평가하는가</tspan><tspan x="1030" dy="17.667">개별 행위인가 · 따를 규칙인가 ·</tspan><tspan x="1030" dy="17.667">성품이나 제도인가</tspan></text></g><g ><g class="shape"><path d="M0 536h374v162H0z" class="stroke-B1 fill-B6 s0"/></g><text x="187" y="574.5" class="text-bold fill-N1 s1"><tspan x="187" dy="0">①을 갈면</tspan><tspan x="187" dy="16.714">고전 공리주의는 쾌락을 넣는다.</tspan><tspan x="187" dy="16.714">경험 기계 사고실험이 그것을 흔든다 —</tspan><tspan x="187" dy="16.714">기계 안의 삶이 더 즐거워도</tspan><tspan x="187" dy="16.714">우리는 그 삶을 고르지 않는다.</tspan><tspan x="187" dy="16.714">그래서 선호 만족설이나</tspan><tspan x="187" dy="16.714">객관적 목록설로 옮겨 간다</tspan></text></g><g ><g class="shape"><path d="M434 552h343v130H434z" class="stroke-B1 fill-B6 s0"/></g><text x="605.5" y="590.5" class="text-bold fill-N1 s1"><tspan x="605.5" dy="0">②를 갈면</tspan><tspan x="605.5" dy="17">총합 대신 가장 나쁜 처지의 사람을</tspan><tspan x="605.5" dy="17">먼저 보는 셈법도 있다.</tspan><tspan x="605.5" dy="17">다만 총합을 버리면</tspan><tspan x="605.5" dy="17">결과주의의 단순함도 함께 빠진다</tspan></text></g><g ><g class="shape"><path d="M837 536h386v162H837z" class="stroke-B1 fill-B6 s0"/></g><text x="1030" y="574.5" class="text-bold fill-N1 s1"><tspan x="1030" dy="0">③을 갈면</tspan><tspan x="1030" dy="16.714">행위 공리주의에서</tspan><tspan x="1030" dy="16.714">규칙 공리주의로 간다.</tspan><tspan x="1030" dy="16.714">규칙 공리주의는 붕괴 반론을 받는다 —</tspan><tspan x="1030" dy="16.714">예외를 인정하면 행위 공리주의가 되고,</tspan><tspan x="1030" dy="16.714">인정하지 않으면 더 나쁜 결과를</tspan><tspan x="1030" dy="16.714">알면서 택하게 된다</tspan></text></g><text x="611" y="734" class="fill-N1 s1"><tspan x="611" dy="0">유연함의 값 — 부품을 갈아 끼울수록 반론은 피하지만 내용이 옅어진다.</tspan><tspan x="611" dy="17.667">좋음이 무엇이든 상관없다면</tspan><tspan x="611" dy="17.667">‘좋음을 늘려라’ 는 말은 거의 아무것도 배제하지 않는다</tspan></text><marker id="mk-d2-3558564799-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3558564799-3488378134)" d="M386.132 195.715C227.2 256.6 187 283.6 187 326" class="connection stroke-B1 s0" mask="url(#d2-3558564799)"/><path fill="none" marker-end="url(#mk-d2-3558564799-3488378134)" d="M605.98 224c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-3558564799)"/><path fill="none" marker-end="url(#mk-d2-3558564799-3488378134)" d="M826.872 195.703C989 256.6 1030 283.6 1030 326" class="connection stroke-B1 s0" mask="url(#d2-3558564799)"/><path fill="none" marker-end="url(#mk-d2-3558564799-3488378134)" d="M187 430v102" class="connection stroke-B1 s0" mask="url(#d2-3558564799)"/><path fill="none" marker-end="url(#mk-d2-3558564799-3488378134)" d="M605.5 438v110" class="connection stroke-B1 s0" mask="url(#d2-3558564799)"/><path fill="none" marker-end="url(#mk-d2-3558564799-3488378134)" d="M1030 430v102" class="connection stroke-B1 s0" mask="url(#d2-3558564799)"/><mask id="d2-3558564799" width="1425" height="973" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1425v973H-101z"/></mask></svg>