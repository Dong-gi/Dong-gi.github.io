<svg xmlns="http://www.w3.org/2000/svg" width="2322" height="648" class="d2-4003833623 d2-svg" viewBox="-101 -101 2322 648"><rect width="2322" height="648" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4003833623 .fill-N1{fill:#0a0f25}.d2-4003833623 .fill-B6{fill:#f7f8fe}.d2-4003833623 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="360" cy="223" class="shape stroke-B1 fill-B6 s0" rx="333" ry="111"/></g><text x="360" y="220.5" class="text-bold fill-N1 s1"><tspan x="360" dy="0">결과주의의 뼈대</tspan><tspan x="360" dy="18.5">행위의 옳고 그름은 그 행위가 낳는 결과가 정한다</tspan></text></g><g ><g class="shape"><path d="M842 16h436v82H842z" class="stroke-B1 fill-B6 s0"/></g><text x="1060" y="54.5" class="text-bold fill-N1 s1"><tspan x="1060" dy="0">부품 ① 무엇이 좋은 결과인가</tspan><tspan x="1060" dy="18.5">쾌락인가 · 선호의 만족인가 · 객관적 목록인가</tspan></text></g><g ><g class="shape"><path d="M851 182h418v82H851z" class="stroke-B1 fill-B6 s0"/></g><text x="1060" y="220.5" class="text-bold fill-N1 s1"><tspan x="1060" dy="0">부품 ② 누구의 좋음을 어떻게 세는가</tspan><tspan x="1060" dy="18.5">모두를 하나로 세고 더한다 — 총합과 공평성</tspan></text></g><g ><g class="shape"><path d="M820 348h480v82H820z" class="stroke-B1 fill-B6 s0"/></g><text x="1060" y="386.5" class="text-bold fill-N1 s1"><tspan x="1060" dy="0">부품 ③ 무엇을 결과로 평가하는가</tspan><tspan x="1060" dy="18.5">개별 행위인가 · 따를 규칙인가 · 성품이나 제도인가</tspan></text></g><g ><g class="shape"><path d="M1433 0h655v114h-655z" class="stroke-B1 fill-B6 s0"/></g><text x="1760.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="1760.5" dy="0">①을 갈면</tspan><tspan x="1760.5" dy="17.25">고전 공리주의는 쾌락을 넣는다. 경험 기계 사고실험이 그것을 흔든다 —</tspan><tspan x="1760.5" dy="17.25">기계 안의 삶이 더 즐거워도 우리는 그 삶을 고르지 않는다.</tspan><tspan x="1760.5" dy="17.25">그래서 선호 만족설이나 객관적 목록설로 옮겨 간다</tspan></text></g><g ><g class="shape"><path d="M1489 174h543v98h-543z" class="stroke-B1 fill-B6 s0"/></g><text x="1760.5" y="212.5" class="text-bold fill-N1 s1"><tspan x="1760.5" dy="0">②를 갈면</tspan><tspan x="1760.5" dy="17.667">총합 대신 가장 나쁜 처지의 사람을 먼저 보는 셈법도 있다.</tspan><tspan x="1760.5" dy="17.667">다만 총합을 버리면 결과주의의 단순함도 함께 빠진다</tspan></text></g><g ><g class="shape"><path d="M1400 332h720v114h-720z" class="stroke-B1 fill-B6 s0"/></g><text x="1760" y="370.5" class="text-bold fill-N1 s1"><tspan x="1760" dy="0">③을 갈면</tspan><tspan x="1760" dy="17.25">행위 공리주의에서 규칙 공리주의로 간다.</tspan><tspan x="1760" dy="17.25">규칙 공리주의는 붕괴 반론을 받는다 — 예외를 인정하면 행위 공리주의가 되고,</tspan><tspan x="1760" dy="17.25">인정하지 않으면 더 나쁜 결과를 알면서 택하게 된다</tspan></text></g><text x="360" y="410" class="fill-N1 s1"><tspan x="360" dy="0">유연함의 값 — 부품을 갈아 끼울수록 반론은 피하지만 내용이 옅어진다.</tspan><tspan x="360" dy="18.5">좋음이 무엇이든 상관없다면 ‘좋음을 늘려라’ 는 말은 거의 아무것도 배제하지 않는다</tspan></text><marker id="mk-d2-4003833623-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4003833623-3488378134)" d="M573.854 136.25C730.4 73 784.4 57 838 57" class="connection stroke-B1 s0" mask="url(#d2-4003833623)"/><path fill="none" marker-end="url(#mk-d2-4003833623-3488378134)" d="M695 223h152" class="connection stroke-B1 s0" mask="url(#d2-4003833623)"/><path fill="none" marker-end="url(#mk-d2-4003833623-3488378134)" d="M573.854 309.75C730.4 373 780 389 816 389" class="connection stroke-B1 s0" mask="url(#d2-4003833623)"/><path fill="none" marker-end="url(#mk-d2-4003833623-3488378134)" d="M1280 57h148.5" class="connection stroke-B1 s0" mask="url(#d2-4003833623)"/><path fill="none" marker-end="url(#mk-d2-4003833623-3488378134)" d="M1271 223h213.5" class="connection stroke-B1 s0" mask="url(#d2-4003833623)"/><path fill="none" marker-end="url(#mk-d2-4003833623-3488378134)" d="M1302 389h94" class="connection stroke-B1 s0" mask="url(#d2-4003833623)"/><mask id="d2-4003833623" width="2322" height="648" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2322v648H-101z"/></mask></svg>