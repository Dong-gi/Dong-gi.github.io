<svg xmlns="http://www.w3.org/2000/svg" width="1067" height="1020" class="d2-3464714236 d2-svg" viewBox="-101 -101 1067 1020"><rect width="1067" height="1020" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3464714236 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3464714236 .fill-N1{fill:#0a0f25}.d2-3464714236 .fill-B6{fill:#f7f8fe}.d2-3464714236 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="440" cy="70.5" class="shape stroke-B1 fill-B6 s0" rx="211" ry="70.5"/></g><text x="440" y="60" class="text-bold fill-N1 s1"><tspan x="440" dy="0">결과주의의 뼈대</tspan><tspan x="440" dy="17.667">행위의 옳고 그름은</tspan><tspan x="440" dy="17.667">그 행위가 낳는 결과가 정한다</tspan></text></g><g ><g class="shape"><path d="M10 241h232v130H10z" class="stroke-B1 fill-B6 s0"/></g><text x="126" y="279.5" class="text-bold fill-N1 s1"><tspan x="126" dy="0">부품 ①</tspan><tspan x="126" dy="17">무엇이 좋은 결과인가</tspan><tspan x="126" dy="17">쾌락인가 ·</tspan><tspan x="126" dy="17">선호의 만족인가 ·</tspan><tspan x="126" dy="17">객관적 목록인가</tspan></text></g><g ><g class="shape"><path d="M327 241h226v130H327z" class="stroke-B1 fill-B6 s0"/></g><text x="440" y="279.5" class="text-bold fill-N1 s1"><tspan x="440" dy="0">부품 ② 누구의 좋음을</tspan><tspan x="440" dy="17">어떻게 세는가</tspan><tspan x="440" dy="17">모두를 하나로 세고</tspan><tspan x="440" dy="17">더한다 —</tspan><tspan x="440" dy="17">총합과 공평성</tspan></text></g><g ><g class="shape"><path d="M642 241h209v130H642z" class="stroke-B1 fill-B6 s0"/></g><text x="746.5" y="279.5" class="text-bold fill-N1 s1"><tspan x="746.5" dy="0">부품 ③ 무엇을</tspan><tspan x="746.5" dy="17">결과로 평가하는가</tspan><tspan x="746.5" dy="17">개별 행위인가 ·</tspan><tspan x="746.5" dy="17">따를 규칙인가 ·</tspan><tspan x="746.5" dy="17">성품이나 제도인가</tspan></text></g><g ><g class="shape"><path d="M0 471h252v242H0z" class="stroke-B1 fill-B6 s0"/></g><text x="126" y="509.5" class="text-bold fill-N1 s1"><tspan x="126" dy="0">①을 갈면</tspan><tspan x="126" dy="16.417">고전 공리주의는</tspan><tspan x="126" dy="16.417">쾌락을 넣는다.</tspan><tspan x="126" dy="16.417">경험 기계 사고실험이</tspan><tspan x="126" dy="16.417">그것을 흔든다 —</tspan><tspan x="126" dy="16.417">기계 안의 삶이</tspan><tspan x="126" dy="16.417">더 즐거워도</tspan><tspan x="126" dy="16.417">우리는 그 삶을</tspan><tspan x="126" dy="16.417">고르지 않는다.</tspan><tspan x="126" dy="16.417">그래서 선호 만족설이나</tspan><tspan x="126" dy="16.417">객관적 목록설로</tspan><tspan x="126" dy="16.417">옮겨 간다</tspan></text></g><g ><g class="shape"><path d="M312 511h255v162H312z" class="stroke-B1 fill-B6 s0"/></g><text x="439.5" y="549.5" class="text-bold fill-N1 s1"><tspan x="439.5" dy="0">②를 갈면</tspan><tspan x="439.5" dy="16.714">총합 대신</tspan><tspan x="439.5" dy="16.714">가장 나쁜 처지의 사람을</tspan><tspan x="439.5" dy="16.714">먼저 보는 셈법도 있다.</tspan><tspan x="439.5" dy="16.714">다만 총합을 버리면</tspan><tspan x="439.5" dy="16.714">결과주의의 단순함도</tspan><tspan x="439.5" dy="16.714">함께 빠진다</tspan></text></g><g ><g class="shape"><path d="M627 487h238v210H627z" class="stroke-B1 fill-B6 s0"/></g><text x="746" y="525.5" class="text-bold fill-N1 s1"><tspan x="746" dy="0">③을 갈면</tspan><tspan x="746" dy="16.5">행위 공리주의에서</tspan><tspan x="746" dy="16.5">규칙 공리주의로 간다.</tspan><tspan x="746" dy="16.5">규칙 공리주의는</tspan><tspan x="746" dy="16.5">붕괴 반론을 받는다 —</tspan><tspan x="746" dy="16.5">예외를 인정하면</tspan><tspan x="746" dy="16.5">행위 공리주의가 되고,</tspan><tspan x="746" dy="16.5">인정하지 않으면</tspan><tspan x="746" dy="16.5">더 나쁜 결과를</tspan><tspan x="746" dy="16.5">알면서 택하게 된다</tspan></text></g><text x="432" y="749" class="fill-N1 s1"><tspan x="432" dy="0">유연함의 값 — 부품을 갈아 끼울수록</tspan><tspan x="432" dy="17">반론은 피하지만 내용이 옅어진다.</tspan><tspan x="432" dy="17">좋음이 무엇이든 상관없다면</tspan><tspan x="432" dy="17">‘좋음을 늘려라’ 는 말은</tspan><tspan x="432" dy="17">거의 아무것도 배제하지 않는다</tspan></text><marker id="mk-d2-3464714236-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-3464714236-3488378134)" d="M299.132 124.715C161 177.6 126 201 126 237" class="connection stroke-B1 s0" mask="url(#d2-3464714236)"/><path fill="none" marker-end="url(#mk-d2-3464714236-3488378134)" d="M439.98 143c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-3464714236)"/><path fill="none" marker-end="url(#mk-d2-3464714236-3488378134)" d="M577.86 124.733C712 177.6 746 201 746 237" class="connection stroke-B1 s0" mask="url(#d2-3464714236)"/><path fill="none" marker-end="url(#mk-d2-3464714236-3488378134)" d="M126 373v94" class="connection stroke-B1 s0" mask="url(#d2-3464714236)"/><path fill="none" marker-end="url(#mk-d2-3464714236-3488378134)" d="M439.5 373v134" class="connection stroke-B1 s0" mask="url(#d2-3464714236)"/><path fill="none" marker-end="url(#mk-d2-3464714236-3488378134)" d="M746 373v110" class="connection stroke-B1 s0" mask="url(#d2-3464714236)"/><mask id="d2-3464714236" width="1067" height="1020" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H966V919H-101z"/></mask></svg>