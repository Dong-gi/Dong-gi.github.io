<svg xmlns="http://www.w3.org/2000/svg" width="1351" height="1034" class="d2-1975274220 d2-svg" viewBox="-101 -101 1351 1034"><rect width="1351" height="1034" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1975274220 .fill-N1{fill:#0a0f25}.d2-1975274220 .fill-N2{fill:#676c7e}.d2-1975274220 .fill-B6{fill:#f7f8fe}.d2-1975274220 .stroke-B1,.d2-1975274220 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="531.5" cy="125" class="shape stroke-B1 fill-B6 s0" rx="375.5" ry="125"/></g><text x="531.5" y="106.5" class="text-bold fill-N1 s1"><tspan x="531.5" dy="0">인과적 상호작용 문제</tspan><tspan x="531.5" dy="17.25">엘리자베스의 물음 — 넓이 없는 것이 어떻게 미는가.</tspan><tspan x="531.5" dy="17.25">오늘의 형태 — 인과적 폐쇄 —</tspan><tspan x="531.5" dy="17.25">원인을 가진 물리적 사건에는 충분한 물리적 원인이 있다</tspan></text></g><g ><g class="shape"><path d="M6 371h302v146H6z" class="stroke-B1 fill-B6 s0"/></g><text x="157" y="409.5" class="text-bold fill-N1 s1"><tspan x="157" dy="0">상호작용론</tspan><tspan x="157" dy="16.833">마음과 몸이</tspan><tspan x="157" dy="16.833">정말로 서로를 움직인다.</tspan><tspan x="157" dy="16.833">인과적 폐쇄가 참이 아니거나,</tspan><tspan x="157" dy="16.833">물리 법칙이 열어 둔 틈에서</tspan><tspan x="157" dy="16.833">마음이 일한다</tspan></text></g><g ><g class="shape"><path d="M393 379h276v130H393z" class="stroke-B1 fill-B6 s0"/></g><text x="531" y="417.5" class="text-bold fill-N1 s1"><tspan x="531" dy="0">병행론</tspan><tspan x="531" dy="17">마음과 몸은</tspan><tspan x="531" dy="17">서로를 움직이지 않는다.</tspan><tspan x="531" dy="17">두 계열이 나란히 흐르도록</tspan><tspan x="531" dy="17">처음부터 맞춰져 있다</tspan></text></g><g ><g class="shape"><path d="M799 379h301v130H799z" class="stroke-B1 fill-B6 s0"/></g><text x="949.5" y="417.5" class="text-bold fill-N1 s1"><tspan x="949.5" dy="0">부수현상론</tspan><tspan x="949.5" dy="17">몸이 마음을 낳지만</tspan><tspan x="949.5" dy="17">마음은 아무것도 낳지 않는다.</tspan><tspan x="949.5" dy="17">마음은 기계에서 나는</tspan><tspan x="949.5" dy="17">소리 같은 것이다</tspan></text></g><g ><g class="shape"><path d="M0 638h313v194H0z" class="stroke-B2 fill-B6 s2"/></g><text x="156.5" y="676.5" class="text-bold fill-N1 s1"><tspan x="156.5" dy="0">물리학과 부딪친다.</tspan><tspan x="156.5" dy="16.556">그 틈이 어디인지,</tspan><tspan x="156.5" dy="16.556">왜 아직 아무도 못 봤는지</tspan><tspan x="156.5" dy="16.556">말해야 한다.</tspan><tspan x="156.5" dy="16.556">가장 강한 형태 — 인과적 폐쇄는</tspan><tspan x="156.5" dy="16.556">물리학의 정리가 아니라</tspan><tspan x="156.5" dy="16.556">지금까지의 탐구에서 뽑아낸</tspan><tspan x="156.5" dy="16.556">열거적 귀납의 결론이므로</tspan><tspan x="156.5" dy="16.556">반례가 나올 수 있는 명제다</tspan></text></g><g ><g class="shape"><path d="M373 686h316v98H373z" class="stroke-B2 fill-B6 s2"/></g><text x="531" y="724.5" class="text-bold fill-N1 s1"><tspan x="531" dy="0">왜 맞춰져 있는지를 설명하려면</tspan><tspan x="531" dy="17.667">큰 것을 끌어와야 한다.</tspan><tspan x="531" dy="17.667">설명의 값이 문제보다 커진다</tspan></text></g><g ><g class="shape"><path d="M749 638h400v194H749z" class="stroke-B2 fill-B6 s2"/></g><text x="949" y="676.5" class="text-bold fill-N1 s1"><tspan x="949" dy="0">아파서 소리쳤다는 말이 거짓이 된다.</tspan><tspan x="949" dy="16.556">더 아픈 값 — 아픔에 대해 말하는 일조차</tspan><tspan x="949" dy="16.556">아픔이 원인이 아니게 된다.</tspan><tspan x="949" dy="16.556">부수현상론이 참이면 내가 지금 감각질에</tspan><tspan x="949" dy="16.556">대해 말하고 있다는 사실을</tspan><tspan x="949" dy="16.556">감각질이 설명하지 못한다.</tspan><tspan x="949" dy="16.556">이 곤란은 이 장에서 끝나지 않는다 —</tspan><tspan x="949" dy="16.556">속성 이원론에도, 배제 논증에도,</tspan><tspan x="949" dy="16.556">15장의 좀비 논증에도 되돌아온다</tspan></text></g><marker id="mk-d2-1975274220-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1975274220-3488378134)" d="M319.212 228.897C189.4 294 156.5 322.7 156.5 367.5" class="connection stroke-B1 s0" mask="url(#d2-1975274220)"/><text x="214" y="287" class="text-italic fill-N2 s1">폐쇄를 부인한다</text><path fill="none" marker-end="url(#mk-d2-1975274220-3488378134)" d="M531 252v123.5" class="connection stroke-B1 s0" mask="url(#d2-1975274220)"/><text x="531" y="320" class="text-italic fill-N2 s1">인과 자체를 부인한다</text><path fill="none" marker-end="url(#mk-d2-1975274220-3488378134)" d="M759.825 225.817C910.8 293.4 949 324.3 949 375.5" class="connection stroke-B1 s0" mask="url(#d2-1975274220)"/><text x="882.5" y="286" class="text-italic fill-N2 s1">한 방향만 남긴다</text><path fill="none" marker-end="url(#mk-d2-1975274220-3488378134)" d="M156.5 518.5v116" class="connection stroke-B1 s0" mask="url(#d2-1975274220)"/><text x="156.5" y="583" class="text-italic fill-N2 s1">치르는 값</text><path fill="none" marker-end="url(#mk-d2-1975274220-3488378134)" d="M531 510.5v172" class="connection stroke-B1 s0" mask="url(#d2-1975274220)"/><text x="531.5" y="603" class="text-italic fill-N2 s1">치르는 값</text><path fill="none" marker-end="url(#mk-d2-1975274220-3488378134)" d="M949 510.5v124" class="connection stroke-B1 s0" mask="url(#d2-1975274220)"/><text x="949.5" y="579" class="text-italic fill-N2 s1">치르는 값</text><mask id="d2-1975274220" width="1351" height="1034" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1351V933H-101z"/><path d="M143 271h142v21H143zM439 304h184v21H439zM810 270h145v21H810zM114 567h85v21h-85zM489 587h85v21h-85zM907 563h85v21h-85z"/></mask></svg>