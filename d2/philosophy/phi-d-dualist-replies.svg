<svg xmlns="http://www.w3.org/2000/svg" width="2465" height="808" class="d2-2619750762 d2-svg" viewBox="-101 -101 2465 808"><rect width="2465" height="808" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-2619750762 .fill-N1{fill:#0a0f25}.d2-2619750762 .fill-N2{fill:#676c7e}.d2-2619750762 .fill-B6{fill:#f7f8fe}.d2-2619750762 .stroke-B1,.d2-2619750762 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:6,5.919384}</style><g ><g class="shape"><ellipse cx="345" cy="303" class="shape stroke-B1 fill-B6 s0" rx="345" ry="115"/></g><text x="345" y="284.5" class="text-bold fill-N1 s1"><tspan x="345" dy="0">인과적 상호작용 문제</tspan><tspan x="345" dy="17.25">엘리자베스의 물음 — 넓이 없는 것이 어떻게 미는가.</tspan><tspan x="345" dy="17.25">오늘의 형태 — 인과적 폐쇄 —</tspan><tspan x="345" dy="17.25">원인을 가진 물리적 사건의 원인은 물리적 사건이다</tspan></text></g><g ><g class="shape"><path d="M1123 40h407v114h-407z" class="stroke-B1 fill-B6 s0"/></g><text x="1326.5" y="78.5" class="text-bold fill-N1 s1"><tspan x="1326.5" dy="0">상호작용론</tspan><tspan x="1326.5" dy="17.25">마음과 몸이 정말로 서로를 움직인다.</tspan><tspan x="1326.5" dy="17.25">인과적 폐쇄가 참이 아니거나,</tspan><tspan x="1326.5" dy="17.25">물리 법칙이 열어 둔 틈에서 마음이 일한다</tspan></text></g><g ><g class="shape"><path d="M1144 246h365v114h-365z" class="stroke-B1 fill-B6 s0"/></g><text x="1326.5" y="284.5" class="text-bold fill-N1 s1"><tspan x="1326.5" dy="0">병행론</tspan><tspan x="1326.5" dy="17.25">마음과 몸은 서로를 움직이지 않는다.</tspan><tspan x="1326.5" dy="17.25">두 계열이 나란히 흐르도록</tspan><tspan x="1326.5" dy="17.25">처음부터 맞춰져 있다</tspan></text></g><g ><g class="shape"><path d="M1090 460h472v98h-472z" class="stroke-B1 fill-B6 s0"/></g><text x="1326" y="498.5" class="text-bold fill-N1 s1"><tspan x="1326" dy="0">부수현상론</tspan><tspan x="1326" dy="17.667">몸이 마음을 낳지만 마음은 아무것도 낳지 않는다.</tspan><tspan x="1326" dy="17.667">마음은 기계에서 나는 소리 같은 것이다</tspan></text></g><g ><g class="shape"><path d="M1907 0h313v194h-313z" class="stroke-B2 fill-B6 s2"/></g><text x="2063.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="2063.5" dy="0">물리학과 부딪친다.</tspan><tspan x="2063.5" dy="16.556">그 틈이 어디인지,</tspan><tspan x="2063.5" dy="16.556">왜 아직 아무도 못 봤는지</tspan><tspan x="2063.5" dy="16.556">말해야 한다.</tspan><tspan x="2063.5" dy="16.556">가장 강한 형태 — 인과적 폐쇄는</tspan><tspan x="2063.5" dy="16.556">물리학의 정리가 아니라</tspan><tspan x="2063.5" dy="16.556">지금까지의 탐구에서 뽑아낸</tspan><tspan x="2063.5" dy="16.556">열거적 귀납의 결론이므로</tspan><tspan x="2063.5" dy="16.556">반례가 나올 수 있는 명제다</tspan></text></g><g ><g class="shape"><path d="M1905 254h316v98h-316z" class="stroke-B2 fill-B6 s2"/></g><text x="2063" y="292.5" class="text-bold fill-N1 s1"><tspan x="2063" dy="0">왜 맞춰져 있는지를 설명하려면</tspan><tspan x="2063" dy="17.667">큰 것을 끌어와야 한다.</tspan><tspan x="2063" dy="17.667">설명의 값이 문제보다 커진다</tspan></text></g><g ><g class="shape"><path d="M1863 412h400v194h-400z" class="stroke-B2 fill-B6 s2"/></g><text x="2063" y="450.5" class="text-bold fill-N1 s1"><tspan x="2063" dy="0">아파서 소리쳤다는 말이 거짓이 된다.</tspan><tspan x="2063" dy="16.556">더 아픈 값 — 아픔에 대해 말하는 일조차</tspan><tspan x="2063" dy="16.556">아픔이 원인이 아니게 된다.</tspan><tspan x="2063" dy="16.556">부수현상론이 참이면 내가 지금 감각질에</tspan><tspan x="2063" dy="16.556">대해 말하고 있다는 사실을</tspan><tspan x="2063" dy="16.556">감각질이 설명하지 못한다.</tspan><tspan x="2063" dy="16.556">이 곤란은 이 장에서 끝나지 않는다 —</tspan><tspan x="2063" dy="16.556">속성 이원론에도, 배제 논증에도,</tspan><tspan x="2063" dy="16.556">15장의 좀비 논증에도 되돌아온다</tspan></text></g><marker id="mk-d2-2619750762-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2619750762-3488378134)" d="M574.87 216.292C826.6 121 936.5 97 1118.5 97" class="connection stroke-B1 s0" mask="url(#d2-2619750762)"/><text x="840" y="124" class="text-italic fill-N2 s1">폐쇄를 부인한다</text><path fill="none" marker-end="url(#mk-d2-2619750762-3488378134)" d="M692 303h447.5" class="connection stroke-B1 s0" mask="url(#d2-2619750762)"/><text x="917" y="309" class="text-italic fill-N2 s1">인과 자체를 부인한다</text><path fill="none" marker-end="url(#mk-d2-2619750762-3488378134)" d="M574.87 389.708C826.6 485 930 509 1086 509" class="connection stroke-B1 s0" mask="url(#d2-2619750762)"/><text x="824.5" y="490" class="text-italic fill-N2 s1">한 방향만 남긴다</text><path fill="none" marker-end="url(#mk-d2-2619750762-3488378134)" d="M1532.5 97h370" class="connection stroke-B1 s0" mask="url(#d2-2619750762)"/><text x="1718.5" y="103" class="text-italic fill-N2 s1">치르는 값</text><path fill="none" marker-end="url(#mk-d2-2619750762-3488378134)" d="M1511.5 303h390" class="connection stroke-B1 s0" mask="url(#d2-2619750762)"/><text x="1707.5" y="309" class="text-italic fill-N2 s1">치르는 값</text><path fill="none" marker-end="url(#mk-d2-2619750762-3488378134)" d="M1563.5 509h296" class="connection stroke-B1 s0" mask="url(#d2-2619750762)"/><text x="1712.5" y="515" class="text-italic fill-N2 s1">치르는 값</text><mask id="d2-2619750762" width="2465" height="808" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h2465v808H-101z"/><path d="M769 108h142v21H769zM825 293h184v21H825zM752 474h145v21H752zM1676 87h85v21h-85zM1665 293h85v21h-85zM1670 499h85v21h-85z"/></mask></svg>