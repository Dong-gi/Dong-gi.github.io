504v346H266z" class="stroke-B1 fill-N5"/></g><path d="M271 1559h81v21h-81z" class="fill-N5"/><text x="311.5" y="1575" class="fill-N1 s1">토큰 사용</text></g><marker id="mk-d2-2175906803-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-2175906803-3488378134)" d="M308 229h418" class="connection stroke-B1 s0" mask="url(#d2-2175906803)"/><text x="518.5" y="235" class="text-italic fill-N2 s1">권한 요청</text><path fill="none" marker-end="url(#mk-d2-2175906803-3488378134)" d="M728 319H92" class="connection stroke-B1 s0" mask="url(#d2-2175906803)"/><text x="409.5" y="325" class="text-italic fill-N2 s1">권한 요청</text><path fill="none" marker-end="url(#mk-d2-2175906803-3488378134)" d="M90 409h636" class="connection stroke-B1 s0" mask="url(#d2-2175906803)"/><text x="409.5" y="415" class="text-italic fill-N2 s1">권한 승인</text><path fill="none" marker-end="url(#mk-d2-2175906803-3488378134)" d="M728 499H310" class="connection stroke-B1 s0" mask="url(#d2-2175906803)"/><text x="518.5" y="505" class="text-italic fill-N2 s1">권한 승인</text><path fill="none" marker-end="url(#mk-d2-2175906803-3488378134)" d="M308 909h418" class="connection stroke-B1 s0" mask="url(#d2-2175906803)"/><text x="518.5" y="915" class="text-italic fill-N2 s1">토큰 요청</text><path fill="none" marker-end="url(#mk-d2-2175906803-3488378134)" d="M728 1303H310" class="connection stroke-B1 s0" mask="url(#d2-2175906803)"/><text x="518.5" y="1309" class="text-italic fill-N2 s1">토큰 발행</text><path fill="none" marker-end="url(#mk-d2-2175906803-3488378134)" d="M308 1608h211.5" class="connection stroke-B1 s0" mask="url(#d2-2175906803)"/><text x="414.5" y="1614" class="text-italic fill-N2 s1">자원 요청</text><path fill="none" marker-end="url(#mk-d2-2175906803-3488378134)" d="M525.5 1698H726" class="connection stroke-B1 s0" mask="url(#d2-2175906803)"/><text x="627" y="1704" class="text-italic fill-N2 s1">토큰 검증 요청</text><path fill="none" marker-end="url(#mk-d2-2175906803-3488378134)" d="M728 1788H527.5" class="connection stroke-B1 s0" mask="url(#d2-2175906803)"/><text x="626.5" y="1794" class="text-italic fill-N2 s1">토큰 검증</text><path fill="none" marker-end="url(#mk-d2-2175906803-3488378134)" d="M521.5 1878H310" class="connection stroke-B1 s0" mask="url(#d2-2175906803)"/><text x="414.5" y="1884" class="text-italic fill-N2 s1">자원 전송</text><g ><g class="shape"><path d="M528 583h383c1 0 2 0 3 1l17 16c1 1 1 2 1 3v94H527V584c0-1 0-1 1-1Z" class="stroke-B1 fill-N7 s0"/><path d="M931 697H528c-1 0-1 0-1-1V584c0-1 0-1 1-1h382c1 0 1 0 1 1v17c0 1 1 2 2 2h18c1 0 1 0 1 1v92c-1 1 0 1-1 1Z" class="stroke-B1 fill-N7 s0"/></g><text x="729.5" y="621.5" class="fill-N1 s1"><tspan x="729.5" dy="0">리디렉션을 이용한 경우,</tspan><tspan x="729.5" dy="17.25">Authorization server의 응답이 url에 존재하므로</tspan><tspan x="729.5" dy="17.25">앱 서버에서 먼저 처리한 다음</tspan><tspan x="729.5" dy="17.25">별도 url로 리디렉션하는 것이 좋다</tspan></text></g><g ><g class="shape"><path d="M149 767h294c1 0 2 0 3 1l17 16c1 1 1 2 1 3v46H148v-65c0-1 0-1 1-1Z" class="stroke-B1 fill-N7 s0"/><path d="M463 833H149c-1 0-1 0-1-1v-64c0-1 0-1 1-1h293c1 0 1 0 1 1v17c0 1 1 2 2 2h18c1 0 1 0 1 1v44c-1 1 0 1-1 1Z" class="stroke-B1 fill-N7 s0"/></g><text x="306" y="805.5" class="fill-N1 s1">Client는 authorization code를 받는다</text></g><g ><g class="shape"><path d="M131 994h329c1 0 2 0 3 1l17 16c1 1 1 2 1 3v46H130v-65c0-1 0-1 1-1Z" class="stroke-B1 fill-N7 s0"/><path d="M480 1060H131c-1 0-1 0-1-1v-64c0-1 0-1 1-1h328c1 0 1 0 1 1v17c0 1 1 2 2 2h18c1 0 1 0 1 1v44c-1 1 0 1-1 1Z" class="stroke-B1 fill-N7 s0"/></g><text x="305.5" y="1032.5" class="fill-N1 s1">authorization code + secret을 요청에 포함</text></g><g ><g class="shape"><path d="M129 1130h333c1 0 2 0 3 1l17 16c1 1 1 2 1 3v78H128v-97c0-1 0-1 1-1Z" class="stroke-B1 fill-N7 s0"/><path d="M482 1228H129c-1 0-1 0-1-1v-96c0-1 0-1 1-1h332c1 0 1 0 1 1v17c0 1 1 2 2 2h18c1 0 1 0 1 1v76c-1 1 0 1-1 1Z" class="stroke-B1 fill-N7 s0"/></g><text x="305.5" y="1168.5" class="fill-N1 s1"><tspan x="305.5" dy="0">Client는 미리 Authorization server에</tspan><tspan x="305.5" dy="17.667">등록되거나, 요청 내 정보로 검증되어</tspan><tspan x="305.5" dy="17.667">신뢰할 수 있음이 보장된다</tspan></text></g><g ><g class="shape"><path d="M567 1389h305c1 0 2 0 3 1l17 16c1 1 1 2 1 3v94H566v-113c0-1 0-1 1-1Z" class="stroke-B1 fill-N7 s0"/><path d="M892 1503H567c-1 0-1 0-1-1v-112c0-1 0-1 1-1h304c1 0 1 0 1 1v17c0 1 1 2 2 2h18c1 0 1 0 1 1v92c-1 1 0 1-1 1Z" class="stroke-B1 fill-N7 s0"/></g><text x="729.5" y="1427.5" class="fill-N1 s1"><tspan x="729.5" dy="0">access token + refresh token</tspan><tspan x="729.5" dy="17.25">refresh token은 access token 만료 등의</tspan><tspan x="729.5" dy="17.25">사유로 신규 access token을</tspan><tspan x="729.5" dy="17.25">발급받기 위해 요청할 때 사용</tspan></text></g><mask id="d2-2175906803" width="1161" height="2098" x="-89" y="-49" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-89-49h1161v2098H-89z"/><path d="M476 219h85v21h-85zM367 309h85v21h-85zM367 399h85v21h-85zM476 489h85v21h-85zM476 899h85v21h-85zM476 1293h85v21h-85zM372 1598h85v21h-85zM564 1688h126v21H564zM584 1778h85v21h-85zM372 1868h85v21h-85z"/></mask></svg>