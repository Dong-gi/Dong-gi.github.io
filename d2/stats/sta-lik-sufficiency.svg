<svg xmlns="http://www.w3.org/2000/svg" width="996" height="690" class="d2-583995173 d2-svg" viewBox="-101 -101 996 690"><rect width="996" height="690" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-583995173 .text-bold{font-weight:700}.d2-583995173 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-583995173 .fill-N1{fill:#0a0f25}.d2-583995173 .fill-N2{fill:#676c7e}.d2-583995173 .fill-B6{fill:#f7f8fe}.d2-583995173 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M230 0h317v82H230z" class="stroke-B1 fill-B6 s0"/></g><text x="388.5" y="38.5" class="text-bold fill-N1 s1"><tspan x="388.5" dy="0">자료 x₁, x₂, …, xₙ</tspan><tspan x="388.5" dy="18.5">예: 베르누이 열 번 1 0 0 1 1 0 0 0 1 0</tspan></text></g><g ><g class="shape"><path d="M87 203h176v82H87z" class="stroke-B1 fill-B6 s0"/></g><text x="175" y="241.5" class="text-bold fill-N1 s1"><tspan x="175" dy="0">충분통계량 T(x)</tspan><tspan x="175" dy="18.5">예: 합 ∑xᵢ = 4</tspan></text></g><g ><g class="shape"><path d="M429 203h345v82H429z" class="stroke-B1 fill-B6 s0"/></g><text x="601.5" y="241.5" class="text-bold fill-N1 s1"><tspan x="601.5" dy="0">T 가 주어졌을 때의 나머지</tspan><tspan x="601.5" dy="18.5">예: 1 이 열 자리 중 어느 네 자리인가</tspan></text></g><g ><g class="shape"><path d="M0 406h349v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="174.5" y="444.5" class="text-bold fill-N1 s1"><tspan x="174.5" dy="0">추론</tspan><tspan x="174.5" dy="18.5">가능도 · 최대가능도추정 · 사후분포</tspan></text></g><g ><g class="shape"><path d="M409 406h385v82H409z" class="stroke-B1 fill-B6 s0"/></g><text x="601.5" y="444.5" class="text-bold fill-N1 s1"><tspan x="601.5" dy="0">θ 에 대해 아무것도 말하지 않는다</tspan><tspan x="601.5" dy="18.5">배치 210 가지가 θ 와 무관하게 모두 1/210</tspan></text></g><marker id="mk-d2-583995173-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7"