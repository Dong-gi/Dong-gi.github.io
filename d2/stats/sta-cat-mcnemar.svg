<svg xmlns="http://www.w3.org/2000/svg" width="822" height="880" class="d2-504220123 d2-svg" viewBox="-101 -101 822 880"><rect width="822" height="880" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-504220123 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-504220123 .fill-N1{fill:#0a0f25}.d2-504220123 .fill-B5{fill:#edf0fd}.d2-504220123 .fill-B6{fill:#f7f8fe}.d2-504220123 .stroke-B1,.d2-504220123 .stroke-B2{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{stroke-width:2;stroke-dasharray:8,7.892511}.s3{stroke-width:3}</style><g ><g class="shape"><path d="M0 0h620v293H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="310" y="33" class="fill-N1" style="text-anchor:middle;font-size:28px">같은 100명을 캠페인 앞뒤로 두 번 물었다</text></g><g ><g class="shape"><path d="M111 414h398v82H111z" class="stroke-B1 fill-B6 s0"/></g><text x="310" y="452.5" class="text-bold fill-N1 s1"><tspan x="310" dy="0">앞 비율 − 뒤 비율 = (a+b)/n − (a+c)/n = (b − c)/n</tspan><tspan x="310" dy="18.5">a 와 d 는 빼는 순간 지워진다</tspan></text></g><g ><g class="shape"><path d="M18 596h585v82H18z" class="stroke-B1 fill-B6 s0"/></g><text x="310.5" y="634.5" class="text-bold fill-N1 s1"><tspan x="310.5" dy="0">귀무가설: 앞뒤 비율이 같다 ⟺ 불일치 b+c 건이 반반으로 갈린다</tspan><tspan x="310.5" dy="18.5">맥니마 통계량 (b − c)² / (b + c) = 5.0, 자유도 1 인 카이제곱과 견준다</tspan></text></g><text x="67" y="62" fill="transparent" class="text s1">·</text><text x="193.5" y="62" class="fill-N1 s1">뒤: 안다</text><text x="404.5" y="62" class="fill-N1 s1">뒤: 모른다</text><text x="98.5" y="93" class="fill-N1 s1">앞: 안다</text><g ><g class="shape"><path fill="transparent" d="M161 77h191v98H161z" class="stroke-B2 s2"/></g><text x="256.5" y="115.5" class="text-bold fill-N1 s1"><tspan x="256.5" dy="0">a = 45</tspan><tspan x="256.5" dy="17.667">앞뒤 모두 안다</tspan><tspan x="256.5" dy="17.667">(일치 칸)</tspan></text></g><g ><g class="shape"><path d="M362 77h191v98H362z" class="stroke-B1 fill-B5 s3"/></g><text x="457.5" y="115.5" class="text-bold fill-N1 s1"><tspan x="457.5" dy="0">b = 5</tspan><tspan x="457.5" dy="17.667">알다가 모르게 됨</tspan><tspan x="457.5" dy="17.667">(불일치 칸)</tspan></text></g><text x="108.5" y="201" class="fill-N1 s1">앞: 모른다</text><g ><g class="shape"><path d="M161 185h191v98H161z" class="stroke-B1 fill-B5 s3"/></g><text x="256.5" y="223.5" class="text-bold fill-N1 s1"><tspan x="256.5" dy="0">c = 15</tspan><tspan x="256.5" dy="17.667">모르다가 알게 됨</tspan><tspan x="256.5" dy="17.667">(불일치 칸)</tspan></text></g><g ><g class="shape"><path fill="transparent" d="M362 185h191v98H362z" class="stroke-B2 s2"/></g><text x="457.5" y="223.5" class="text-bold fill-N1 s1"><tspan x="457.5" dy="0">d = 35</tspan><tspan x="457.5" dy="17.667">앞뒤 모두 모른다</tspan><tspan x="457.5" dy="17.667">(일치 칸)</tspan></text></g><marker id="mk-d2-504220123-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-504220123-3488378134)" d="M310 294.5v116" class="connection stroke-B1 s0" mask="url(#d2-504220123)"/><text x="310.5" y="359" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">불일치 칸만 남는다</text><path fill="none" marker-end="url(#mk-d2-504220123-3488378134)" d="M310 498v94" class="connection stroke-B1 s0" mask="url(#d2-504220123)"/><mask id="d2-504220123" width="822" height="880" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h822v880h-822z"/><path d="M228 343h165v21H228z"/></mask></svg>