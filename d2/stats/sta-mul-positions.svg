<svg xmlns="http://www.w3.org/2000/svg" width="1159" height="794" class="d2-3791299998 d2-svg" viewBox="-101 -101 1159 794"><rect width="1159" height="794" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-3791299998 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-3791299998 .fill-N1{fill:#0a0f25}.d2-3791299998 .fill-B5{fill:#edf0fd}.d2-3791299998 .stroke-B1{stroke:#0d32b2}.s0{text-anchor:middle;font-size:16px}.s1{stroke-width:2}</style><g ><g class="shape"><path d="M0 0h957v378H0z" class="stroke-B1" style="fill:#e3e9fd;stroke-width:2"/></g><text x="478.5" y="33" class="fill-N1" style="text-anchor:middle;font-size:28px">유의수준 논쟁의 네 입장 — 무엇을 바꾸자고 하는가</text></g><g ><g class="shape"><path d="M166 478h625v114H166z" class="stroke-B1" style="fill:#f7f8fe;stroke-width:2"/></g><text x="478.5" y="516.5" class="text-bold fill-N1 s0"><tspan x="478.5" dy="0">넷이 모두 받아들이는 것 (ASA 2016 성명)</tspan><tspan x="478.5" dy="17.25"> </tspan><tspan x="478.5" dy="17.25">p값 하나로 결론을 내리지 않는다 · p값은 가설이 참일 확률이 아니다</tspan><tspan x="478.5" dy="17.25">p값은 효과의 크기가 아니다 · 무엇을 몇 번 분석했는지 모두 밝힌다</tspan></text></g><g ><g class="shape"><path d="M20 46h443v146H20z" class="stroke-B1 fill-B5 s1"/></g><text x="241.5" y="84.5" class="text-bold fill-N1 s0"><tspan x="241.5" dy="0">[가] 문턱을 낮추자</tspan><tspan x="241.5" dy="16.833">벤저민 외 (2018)</tspan><tspan x="241.5" dy="16.833"> </tspan><tspan x="241.5" dy="16.833">바꾸는 것: 문턱의 값</tspan><tspan x="241.5" dy="16.833">새 발견을 주장하는 기준을 0.05 에서 0.005 로.</tspan><tspan x="241.5" dy="16.833">그 사이의 결과는 ‘시사적’ 이라 부른다</tspan></text></g><g ><g class="shape"><path d="M483 46h454v146H483z" class="stroke-B1 fill-B5 s1"/></g><text x="710" y="84.5" class="text-bold fill-N1 s0"><tspan x="710" dy="0">[나] 문턱을 근거로 고르자</tspan><tspan x="710" dy="16.833">레이컨스 외 (2018)</tspan><tspan x="710" dy="16.833"> </tspan><tspan x="710" dy="16.833">바꾸는 것: 문턱을 정하는 근거</tspan><tspan x="710" dy="16.833">모든 연구에 같은 값을 쓰지 말고 두 오류의 값과</tspan><tspan x="710" dy="16.833">표본 크기로 정해 연구 전에 밝힌다</tspan></text></g><g ><g class="shape"><path d="M20 212h443v146H20z" class="stroke-B1 fill-B5 s1"/></g><text x="241.5" y="250.5" class="text-bold fill-N1 s0"><tspan x="241.5" dy="0">[다] 유의·비유의 판정을 그만두자</tspan><tspan x="241.5" dy="16.833">암라인 외 (2019), 맥셰인 외 (2019)</tspan><tspan x="241.5" dy="16.833"> </tspan><tspan x="241.5" dy="16.833">바꾸는 것: 보고 방식</tspan><tspan x="241.5" dy="16.833">p값은 연속량 그대로 보고하고 설계·사전 근거·</tspan><tspan x="241.5" dy="16.833">효과크기와 함께 판단한다</tspan></text></g><g ><g class="shape"><path d="M483 212h454v146H483z" class="stroke-B1 fill-B5 s1"/></g><text x="710" y="250.5" class="text-bold fill-N1 s0"><tspan x="710" dy="0">[라] 검정 대신 추정하자</tspan><tspan x="710" dy="16.833">커밍 (2014)</tspan><tspan x="710" dy="16.833"> </tspan><tspan x="710" dy="16.833">바꾸는 것: 분석의 중심</tspan><tspan x="710" dy="16.833">효과크기와 신뢰구간을 보고하고</tspan><tspan x="710" dy="16.833">여러 연구는 메타분석으로 모은다</tspan></text></g><mask id="d2-3791299998" width="1159" height="794" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1159v794H-101z"/></mask></svg>