">MNAR 에서는 X 를 알아도 빠진 값 Y 자체가 빠짐을 정한다.</tspan><tspan x="346" dy="17.25">이 화살표는 관측된 자료로 확인할 수 없다</tspan></text><marker id="mk-d2-1201819691-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection fill-B1"/></marker><path fill="none" marker-end="url(#mk-d2-1201819691-3488378134)" d="m476.362 165.147-95.085 66.56" class="connection stroke-B1 s0" mask="url(#d2-1201819691)"/><text x="428" y="205" class="text-italic fill-N2 s2">우연만</text><path fill="none" marker-end="url(#mk-d2-1201819691-3488378134)" d="m492.566 627.394-67.698 65.818" class="connection stroke-B1 s0" mask="url(#d2-1201819691)"/><path fill="none" marker-end="url(#mk-d2-1201819691-3488378134)" d="m229.529 627.29 78.413 66.131" class="connection stroke-B1 s0" mask="url(#d2-1201819691)"/><text x="269.5" y="667" class="text-italic fill-N2 s2">X 에 따라</text><path fill="none" marker-end="url(#mk-d2-1201819691-3488378134)" d="m492.566 1089.394-67.698 65.818" class="connection stroke-B1 s0" mask="url(#d2-1201819691)"/><path fill="none" marker-end="url(#mk-d2-1201819691-3488378134)" d="m229.529 1089.29 78.413 66.131" class="connection stroke-B1 s0" mask="url(#d2-1201819691)"/><text x="269.5" y="1129" class="text-italic fill-N2 s2">X 에 따라</text><marker id="mk-d2-1201819691-164681321" markerHeight="16" markerUnits="userSpaceOnUse" markerWidth="13" orient="auto" refX="8.5" refY="8" viewBox="0 0 13 16"><path stroke-width="3" d="m0 0 13 8-13 8z" class="connection fill-B1"/></marker><path fill="none" marker-end="url(#mk-d2-1201819691-164681321)" d="M370 1090.5v62" class="connection stroke-B1" mask="url(#d2-1201819691)" style="stroke-width:3"/><text x="370.5" y="1129" class="text-italic fill-N2 s2">빠진 값 자체</text><mask id="d2-1201819691" width="910" height="1707" x="-109" y="-89" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-109-89h910v1707h-910z"/><path d="M397 189h62v21h-62zM231 651h77v2