<svg xmlns="http://www.w3.org/2000/svg" width="1039" height="893" class="d2-4261992783 d2-svg" viewBox="-101 -101 1039 893"><rect width="1039" height="893" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-4261992783 .text-bold{font-weight:700}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-4261992783 .fill-N1{fill:#0a0f25}.d2-4261992783 .fill-B4{fill:#e3e9fd}.d2-4261992783 .fill-B5{fill:#edf0fd}.d2-4261992783 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:28px}.s2{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M25 0h787v184H25z" class="stroke-B1 fill-B4 s0"/></g><text x="418.5" y="33" class="fill-N1 s1">세 부품</text></g><g ><g class="shape"><path d="M0 305h837v345H0z" class="stroke-B1 fill-B4 s0"/></g><text x="418.5" y="338" class="fill-N1 s1">같은 틀, 다른 부품</text></g><text x="418.5" y="686" class="fill-N1 s2">세 모형의 연결함수는 모두 그 분포의 정준 연결이다 — 6장 지수족 꼴의 η 가 곧 선형 예측자가 된다</text><g ><g class="shape"><path d="M49 46h196v114H49z" class="stroke-B1 fill-B5 s0"/></g><text x="147" y="84.5" class="text-bold fill-N1 s2"><tspan x="147" dy="0">① 확률 성분</tspan><tspan x="147" dy="17.25">Yᵢ 가 따르는 분포</tspan><tspan x="147" dy="17.25">(6장의 지수족)</tspan><tspan x="147" dy="17.25">평균 μᵢ</tspan></text></g><g ><g class="shape"><path d="M269 46h263v114H269z" class="stroke-B1 fill-B5 s0"/></g><text x="400.5" y="92.5" class="text-bold fill-N1 s2"><tspan x="400.5" dy="0">② 선형 예측자</tspan><tspan x="400.5" dy="17.667">ηᵢ = β₀ + β₁xᵢ₁ + … + βₖxᵢₖ</tspan><tspan x="400.5" dy="17.667">(11장의 설계행렬 한 행)</tspan></text></g><g ><g class="shape"><path d="M556 46h232v114H556z" class="stroke-B1 fill-B5 s0"/></g><text x="672" y="84.5" class="text-bold fill-N1 s2"><tspan x="672" dy="0">③ 연결함수</tspan><tspan x="672" dy="17.25">g(μᵢ) = ηᵢ</tspan><tspan x="672" dy="17.25">평균을 어떤 눈금에서</tspan><tspan x="672" dy="17.25">직선으로 보는가</tspan></text></g><text x="27.5" y="367" class="text-bold fill-N1 s2">모형</text><text x="210.5" y="367" class="text-bold fill-N1 s2">① 분포</text><text x="409" y="367" class="text-bold fill-N1 s2">③ 연결함수</text><text x="680" y="367" class="text-bold fill-N1 s2">계수 하나가 뜻하는 것</text><g ><g class="shape"><path d="M8 380h168v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="92" y="418.5" class="text-bold fill-N1 s2"><tspan x="92" dy="0">선형 모형</tspan><tspan x="92" dy="18.5">(11장)</tspan></text></g><g ><g class="shape"><path d="M184 380h170v82H184z" class="stroke-B1 fill-B5 s0"/></g><text x="269" y="426.5" class="text-bold fill-N1 s2">정규분포</text></g><g ><g class="shape"><path d="M362 380h215v82H362z" class="stroke-B1 fill-B5 s0"/></g><text x="469.5" y="426.5" class="text-bold fill-N1 s2">항등: g(μ) = μ</text></g><g ><g class="shape"><path d="M585 380h244v82H585z" class="stroke-B1 fill-B5 s0"/></g><text x="707" y="426.5" class="text-bold fill-N1 s2">평균의 차</text></g><g ><g class="shape"><path d="M8 470h168v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="92" y="516.5" class="text-bold fill-N1 s2">로지스틱 회귀</text></g><g ><g class="shape"><path d="M184 470h170v82H184z" class="stroke-B1 fill-B5 s0"/></g><text x="269" y="516.5" class="text-bold fill-N1 s2">베르누이·이항</text></g><g ><g class="shape"><path d="M362 470h215v82H362z" class="stroke-B1 fill-B5 s0"/></g><text x="469.5" y="516.5" class="text-bold fill-N1 s2">로짓: g(p) = ln(p/(1−p))</text></g><g ><g class="shape"><path d="M585 470h244v82H585z" class="stroke-B1 fill-B5 s0"/></g><text x="707" y="508.5" class="text-bold fill-N1 s2"><tspan x="707" dy="0">로그오즈비</tspan><tspan x="707" dy="18.5">(지수를 씌우면 오즈비)</tspan></text></g><g ><g class="shape"><path d="M8 560h168v82H8z" class="stroke-B1 fill-B5 s0"/></g><text x="92" y="606.5" class="text-bold fill-N1 s2">푸아송 회귀</text></g><g ><g class="shape"><path d="M184 560h170v82H184z" class="stroke-B1 fill-B5 s0"/></g><text x="269" y="606.5" class="text-bold fill-N1 s2">푸아송</text></g><g ><g class="shape"><path d="M362 560h215v82H362z" class="stroke-B1 fill-B5 s0"/></g><text x="469.5" y="606.5" class="text-bold fill-N1 s2">로그: g(μ) = ln μ</text></g><g ><g class="shape"><path d="M585 560h244v82H585z" class="stroke-B1 fill-B5 s0"/></g><text x="707" y="598.5" class="text-bold fill-N1 s2"><tspan x="707" dy="0">로그 율비</tspan><tspan x="707" dy="18.5">(지수를 씌우면 율비)</tspan></text></g><marker id="mk-d2-4261992783-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-4261992783-3488378134)" d="M418.5 185.5v116" class="connection stroke-B1 s0" mask="url(#d2-4261992783)"/><text x="419" y="250" style="font-style:italic;fill:#676c7e;text-anchor:middle;font-size:16px">부품을 고르면 모형이 정해진다</text><mask id="d2-4261992783" width="1039" height="893" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101H938v893H-101z"/><path d="M287 234h264v21H287z"/></mask></svg>