<svg xmlns="http://www.w3.org/2000/svg" width="895" height="1250" class="d2-1812611865 d2-svg" viewBox="-101 -101 895 1250"><rect width="895" height="1250" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-1812611865 .text-bold{font-weight:700}.d2-1812611865 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1812611865 .fill-N1{fill:#0a0f25}.d2-1812611865 .fill-N2{fill:#676c7e}.d2-1812611865 .fill-B6{fill:#f7f8fe}.d2-1812611865 .fill-AA4{fill:#edf0fd}.d2-1812611865 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><path d="M238 24c0-24 98-24 109-24s109 0 109 24v86c0 24-98 24-109 24s-109 0-109-24z" class="stroke-B1 fill-AA4 s0"/><path d="M238 24c0 24 98 24 109 24s109 0 109-24" class="stroke-B1 fill-AA4 s0"/></g><text x="347" y="76.5" class="text-bold fill-N1 s1"><tspan x="347" dy="0">빈칸이 있는 자료</tspan><tspan x="347" dy="18.5">(관측된 값 + 빠진 값)</tspan></text></g><g ><g class="shape"><path d="M115 234h464v98H115z" class="stroke-B1 fill-B6 s0"/></g><text x="347" y="272.5" class="text-bold fill-N1 s1"><tspan x="347" dy="0">대체 모형</tspan><tspan x="347" dy="17.667">관측된 자료로 빠진 값의 사후예측분포를 세운다</tspan><tspan x="347" dy="17.667">(결과변수도 넣는다)</tspan></text></g><g ><g class="shape"><path d="M38 453h116v66H38z" class="stroke-B1 fill-B6 s0"/></g><text x="96" y="491.5" class="text-bold fill-N1 s1">완성본 1</text></g><g ><g class="shape"><path d="M289 453h116v66H289z" class="stroke-B1 fill-B6 s0"/></g><text x="347" y="491.5" class="text-bold fill-N1 s1">완성본 2</text></g><g ><g class="shape"><path d="M537 453h121v66H537z" class="stroke-B1 fill-B6 s0"/></g><text x="597.5" y="491.5" class="text-bold fill-N1 s1">완성본 m</text></g><g ><g class="shape"><path d="M0 619h191v82H0z" class="stroke-B1 fill-B6 s0"/></g><text x="95.5" y="657.5" class="text-bold fill-N1 s1"><tspan x="95.5" dy="0">분석 1</tspan><tspan x="95.5" dy="18.5">추정값과 그 분산</tspan></text></g><g ><g class="shape"><path d="M251 619h191v82H251z" class="stroke-B1 fill-B6 s0"/></g><text x="346.5" y="657.5" class="text-bold fill-N1 s1"><tspan x="346.5" dy="0">분석 2</tspan><tspan x="346.5" dy="18.5">추정값과 그 분산</tspan></text></g><g ><g class="shape"><path d="M502 619h191v82H502z" class="stroke-B1 fill-B6 s0"/></g><text x="597.5" y="657.5" class="text-bold fill-N1 s1"><tspan x="597.5" dy="0">분석 m</tspan><tspan x="597.5" dy="18.5">추정값과 그 분산</tspan></text></g><g ><g class="shape"><path d="M160 801h373v114H160z" class="stroke-B1 fill-B6 s0"/></g><text x="346.5" y="839.5" class="text-bold fill-N1 s1"><tspan x="346.5" dy="0">루빈 규칙</tspan><tspan x="346.5" dy="17.25">추정값 = m 개 추정값의 평균</tspan><tspan x="346.5" dy="17.25">T = W + (1 + 1/m) B</tspan><tspan x="346.5" dy="17.25">W: 대체 내 분산의 평균, B: 대체 간 분산</tspan></text></g><path fill="transparent" stroke="transparent" d="M25 935h642v113H25z" class="shape s0"/><text x="346" y="981" class="fill-N1 s1"><tspan x="346" dy="0">뽑기마다 모수부터 사후분포에서 새로 뽑고, 그 모수로 빈칸을 채운다.</tspan><tspan x="346" dy="17.667">완성본끼리 다른 만큼(B)이 빠진 값에 대한 불확실성이다.</tspan><tspan x="346" dy="17.667">하나만 채워 분석하면 B 가 통째로 빠져 표준오차가 작아진다</tspan></text><marker id="mk-d2-1812611865-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1812611865-3488378134)" d="M346.98 136c-.38 38-.48 58-.48 94" class="connection stroke-B1 s0" mask="url(#d2-1812611865)"/><path fill="none" marker-end="url(#mk-d2-1812611865-3488378134)" d="M232.669 332.304C123.3 380.3 95.5 404.7 95.5 449.5" class="connection stroke-B1 s0" mask="url(#d2-1812611865)"/><text x="139.5" y="379" class="text-italic fill-N2 s1">뽑기 1</text><path fill="none" marker-end="url(#mk-d2-1812611865-3488378134)" d="M346.5 333.5v116" class="connection stroke-B1 s0" mask="url(#d2-1812611865)"/><text x="347" y=