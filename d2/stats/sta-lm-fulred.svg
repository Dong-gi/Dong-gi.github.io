<svg xmlns="http://www.w3.org/2000/svg" width="937" height="1307" class="d2-1651834316 d2-svg" viewBox="-128 -89 937 1307"><rect width="937" height="1307" x="-128" y="-89" rx="0" style="fill:#fff"/><style>.d2-1651834316 .text-bold{font-weight:700}.d2-1651834316 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-1651834316 .fill-N1{fill:#0a0f25}.d2-1651834316 .fill-N2{fill:#676c7e}.d2-1651834316 .fill-B6{fill:#f7f8fe}.d2-1651834316 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}</style><g ><g class="shape"><ellipse cx="326" cy="63.5" class="shape stroke-B1 fill-B6 s0" rx="155" ry="51.5"/></g><text x="326" y="69" class="text-bold fill-N1 s1">같은 자료 (관측 n 개)</text></g><g ><g class="shape"><path d="M23 294h267v82H23z" class="stroke-B1 fill-B6 s0"/></g><text x="156.5" y="332.5" class="text-bold fill-N1 s1"><tspan x="156.5" dy="0">완전 모형</tspan><tspan x="156.5" dy="18.5">설명변수 k 개, 계수 k + 1 개</tspan></text></g><g ><g class="shape"><path d="M321 286h347v98H321z" class="stroke-B1 fill-B6 s0"/></g><text x="494.5" y="324.5" class="text-bold fill-N1 s1"><tspan x="494.5" dy="0">축소 모형</tspan><tspan x="494.5" dy="17.667">그 가운데 계수 q 개를 0 으로 묶는다</tspan><tspan x="494.5" dy="17.667">(귀무가설이 말하는 모형)</tspan></text></g><g ><g class="shape"><path d="M72 464h169v82H72z" class="stroke-B1 fill-B6 s0"/></g><text x="156.5" y="502.5" class="text-bold fill-N1 s1"><tspan x="156.5" dy="0">SSE(완전)</tspan><tspan x="156.5" dy="18.5">자유도 n − k − 1</tspan></text></g><g ><g class="shape"><path d="M380 454h229v98H380z" class="stroke-B1 fill-B6 s0"/></g><text x="494.5" y="492.5" class="text-bold fill-N1 s1"><tspan x="494.5" dy="0">SSE(축소)</tspan><tspan x="494.5" dy="17.667">자유도 n − k − 1 + q</tspan><tspan x="494.5" dy="17.667">언제나 SSE(완전) 이상</tspan></text></g><g ><g class="shape"><path d="M266 632h344v82H266z" class="stroke-B1 fill-B6 s0"/></g><text x="438" y="670.5" class="text-bold fill-N1 s1"><tspan x="438" dy="0">분자: 늘어난 몫을 제약 하나당으로</tspan><tspan x="438" dy="18.5">[SSE(축소) − SSE(완전)] ÷ q</tspan></text></g><g ><g class="shape"><path d="M12 632h234v82H12z" class="stroke-B1 fill-B6 s0"/></g><text x="129" y="670.5" class="text-bold fill-N1 s1"><tspan x="129" dy="0">분모: 잔차 평균제곱 s²</tspan><tspan x="129" dy="18.5">SSE(완전) ÷ (n − k − 1)</tspan></text></g><g ><g class="shape"><path d="M202 794h162v66H202z" class="stroke-B1 fill-B6 s0"/></g><text x="283" y="832.5" class="text-bold fill-N1 s1">F = 분자 ÷ 분모</text></g><g ><g class="shape"><path d="M85 930h397v82H85z" class="stroke-B1 fill-B6 s0"/></g><text x="283.5" y="968.5" class="text-bold fill-N1 s1"><tspan x="283.5" dy="0">귀무가설과 정규성 아래 F(q, n − k − 1) 분포</tspan><tspan x="283.5" dy="18.5">오른쪽 꼬리 넓이 = p값</tspan></text></g><path fill="transparent" stroke="transparent" d="M-27 1032h735v85H-27z" class="shape s0"/><text x="340.5" y="1072" class="fill-N1 s1"><tspan x="340.5" dy="0">q = 1 이면 F 는 그 계수의 t 통계량의 제곱과 같다.</tspan><tspan x="340.5" dy="18.5">축소 모형이 절편만 남긴 것이면 SSE(축소) = SST 이고 이것이 회귀 전체의 F 검정이다</tspan></text><marker id="mk-d2-1651834316-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-1651834316-3488378134)" d="m274.995 114-.403 176" class="connection stroke-B1 s0" mask="url(#d2-1651834316)"/><text x="274.5" y="209" class="text-italic fill-N2 s1">최소제곱</text><path fill="none" marker-end="url(#mk-d2-1651834316-3488378134)" d="m377.999 114-.081 168" class="connection stroke-B1 s0" mask="url(#d2-1651834316)"/><text x="377.5" y="205" class="text-italic fill-N2 s1">최소제곱</text><path fill="none" marker-end="url(#mk-d2-1651834316-3488378134)" d="M157.166 377.666v83" class="connection stroke-B1 s0" mask="url(#d2-1651834316)"/><path fill="none" marker-end="url(#mk-d2-1651834316-3488378134)" d=