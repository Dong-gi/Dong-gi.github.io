<svg xmlns="http://www.w3.org/2000/svg" width="1191" height="1242" class="d2-138610461 d2-svg" viewBox="-101 -101 1191 1242"><rect width="1191" height="1242" x="-101" y="-101" rx="0" style="fill:#fff"/><style>.d2-138610461 .text-bold{font-weight:700}.d2-138610461 .text-italic{font-style:italic}.connection,.shape{stroke-linejoin:round}.shape{shape-rendering:geometricPrecision}.connection{stroke-linecap:round}.d2-138610461 .fill-N1{fill:#0a0f25}.d2-138610461 .fill-N2{fill:#676c7e}.d2-138610461 .fill-B5{fill:#edf0fd}.d2-138610461 .fill-B6{fill:#f7f8fe}.d2-138610461 .stroke-B1{stroke:#0d32b2}.s0{stroke-width:2}.s1{text-anchor:middle;font-size:16px}.s2{text-anchor:middle;font-size:24px}</style><path fill="transparent" stroke="transparent" d="M0 0h989v967H0z" class="shape s0"/><text x="494" y="1003" class="fill-N1 s1"><tspan x="494" dy="0">플러그인 원리: 볼 수 없는 F 자리에 F̂n 을 놓고 같은 절차를 컴퓨터로 되풀이한다.</tspan><tspan x="494" dy="17.667">오차가 두 겹이다. B 가 유한해서 생기는 몬테카를로 오차는 B 를 늘리면 줄고,</tspan><tspan x="494" dy="17.667">F̂n 이 F 와 달라서 생기는 표본 오차는 자료를 더 모아야만 준다</tspan></text><g ><g class="shape"><path d="M80 116h317v771H80z" class="fill-B5" style="stroke:#0d32b2;stroke-width:2;stroke-dasharray:8,7.892511"/></g><text x="238.5" y="104" class="fill-N1 s2">실제 세계 (볼 수 없다)</text></g><g ><g class="shape"><path d="M479 116h428v771H479z" class="stroke-B1 fill-B5 s0"/></g><text x="693" y="104" class="fill-N1 s2">부트스트랩 세계 (계산할 수 있다)</text></g><g ><g class="shape"><ellipse cx="239" cy="185.5" class="shape stroke-B1 fill-B6 s0" rx="112" ry="39.5"/></g><text x="239" y="183" class="text-bold fill-N1 s1"><tspan x="239" dy="0">모집단 분포 F</tspan><tspan x="239" dy="18.5">(모른다)</tspan></text></g><g ><g class="shape"><path d="M111 346h255v82H111z" class="stroke-B1 fill-B6 s0"/></g><text x="238.5" y="384.5" class="text-bold fill-N1 s1"><tspan x="238.5" dy="0">크기 n 인 표본을</tspan><tspan x="238.5" dy="18.5">몇 번이고 다시 뽑는다면</tspan></text></g><g ><g class="shape"><path d="M110 549h257v66H110z" class="stroke-B1 fill-B6 s0"/></g><text x="238.5" y="587.5" class="text-bold fill-N1 s1">θ̂ 가 표본마다 달라진다</text></g><g ><g class="shape"><path d="M147 715h184v82H147z" class="stroke-B1 fill-B6 s0"/></g><text x="239" y="753.5" class="text-bold fill-N1 s1"><tspan x="239" dy="0">θ̂ 의 표본분포</tspan><tspan x="239" dy="18.5">→ 표준오차·구간</tspan></text></g><g ><g class="shape"><ellipse cx="693" cy="207.5" class="shape stroke-B1 fill-B6 s0" rx="184" ry="61.5"/></g><text x="693" y="197" class="text-bold fill-N1 s1"><tspan x="693" dy="0">경험분포 F̂n</tspan><tspan x="693" dy="17.667">(손에 든 표본, 각 값에 1/n)</tspan><tspan x="693" dy="17.667">F 의 자리를 대신한다</tspan></text></g><g ><g class="shape"><path d="M561 390h265v82H561z" class="stroke-B1 fill-B6 s0"/></g><text x="693.5" y="428.5" class="text-bold fill-N1 s1"><tspan x="693.5" dy="0">재표본 B 개</tspan><tspan x="693.5" dy="18.5">표본에서 n 개를 복원추출</tspan></text></g><g ><g class="shape"><path d="M627 593h133v66H627z" class="stroke-B1 fill-B6 s0"/></g><text x="693.5" y="631.5" class="text-bold fill-N1 s1">θ̂* 가 B 개</text></g><g ><g class="shape"><path d="M521 759h345v98H521z" class="stroke-B1 fill-B6 s0"/></g><text x="693.5" y="797.5" class="text-bold fill-N1 s1"><tspan x="693.5" dy="0">θ̂* 의 분포</tspan><tspan x="693.5" dy="17.667">→ 표준편차 = 부트스트랩 표준오차</tspan><tspan x="693.5" dy="17.667">→ 2.5%·97.5% 분위수 = 백분위수 구간</tspan></text></g><marker id="mk-d2-138610461-3488378134" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path stroke-width="2" d="m0 0 10 6-10 6z" class="connection" style="fill:#0d32b2"/></marker><path fill="none" marker-end="url(#mk-d2-138610461-3488378134)" d="M238.983 227c-.383 46.4-.483 70.7-.483 115.5" class="connection stroke-B1 s0" mask="url(#d2-138610461)"/><text x="238.5" y="291" class="text-italic fill-N2 s1">n 개를 뽑는다</text><path fill="none" marker-end="url(#mk-d2-138610461-3488378134)" d="M238.5 429.5v116" class="connection stroke-B1 s0" mask="url(#d2-138610461)"/><text x="239" y="494" class="text-italic fill-N2 s1">통계량 계산</text><path fill="none" marker-end="url(#mk-d2-138610461-3488378134)" d="M238.5 617v94" class="connection stroke-B1 s0" mask="url(#d2-138610461)"/><path fill="none" marker-end="url(#mk-d2-138610461-3488378134)" d="M693 271v115.5" class="connection stroke-B1 s0" mask="url(#d2-138610461)"/><text x="693.5" y="335" class="text-italic fill-N2 s1">n 개를 복원으로</text><path fill="none" marker-end="url(#mk-d2-138610461-3488378134)" d="M693 473.5v116" class="connection stroke-B1 s0" mask="url(#d2-138610461)"/><text x="693.5" y="538" class="text-italic fill-N2 s1">같은 통계량 계산</text><path fill="none" marker-end="url(#mk-d2-138610461-3488378134)" d="M693 661v94" class="connection stroke-B1 s0" mask="url(#d2-138610461)"/><mask id="d2-138610461" width="1191" height="1242" x="-101" y="-101" maskUnits="userSpaceOnUse"><path fill="#fff" d="M-101-101h1191v1242H-101z"/><path d="M181 275h115v21H181zM187 478h104v21H187zM626 319h135v21H626zM621 522h145v21H621z"/></mask></svg>