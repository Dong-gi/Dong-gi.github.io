android.useAndroidX=true

# AGP 9 의 내장 Kotlin 을 쓴다(기본값 true). 고를 수 있는 것이 아니다 —
# 외부 org.jetbrains.kotlin.android 을 적용하면 AGP 9.4 의 새 DSL 과 충돌해
# ApplicationExtensionImpl cannot be cast to BaseExtension 으로 설정이 죽는다.
# usb-tether 가 Kotlin 플러그인 없이 .kt 를 컴파일하던 것이 이 때문이었다.
android.builtInKotlin=true

kotlin.code.style=official

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
