<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>공유 폴더 — Web 테더링</title>
<!--
  폰의 공유 폴더를 다루는 화면 — 시놀로지·QNAP File Station, Nextcloud 의 파일 화면 꼴. Web 의 테더(tether 모듈의 FileServer)가 `GET /` 로
  내주고 모양(fileman.css)과 동작(fileman.js)은 따로 된 파일이다 — 서버의 CSP 가 이 서버의 스크립트·스타일만 받고 인라인 것을 받지 않는다.
  외부 리소스를 전혀 부르지 않는다(폰에서 내주고, 손님의 인터넷은 다른 길이라 CDN 은 폰의 데이터를 쓰고 오프라인에서 깨진다).

  이 쪽은 `http://192.168.49.1:8080` 에서 열리므로 secure context 가 아니다 — 서비스 워커·클립보드·File System Access 를 쓸 수 없다. 받기는
  `<a download>` 로 한다(fetch 로 받아 Blob 을 만들면 파일 전체가 메모리에 올라간다). 파일 이름은 늘 글로만 그린다(textContent).
-->
<link rel="stylesheet" href="/fileman.css">
<script src="/fileman.js" defer></script>
</head>
<body>
<div id="app">
  <header id="top">
    <button type="button" class="tb narrow-only" id="treeBtn" aria-label="폴더 나무" title="폴더 나무"></button>
    <h1 id="title">공유 폴더</h1>
    <div class="grow"></div>
    <div id="storage" hidden title=""><div class="meter"><i></i></div><span class="txt"></span></div>
    <span id="manageBadge" class="badge" hidden></span>
  </header>

  <div id="toolbar" role="toolbar" aria-label="도구">
    <button type="button" class="tb icon-only" id="upBtn" title="위 폴더 (Backspace)"></button>
    <button type="button" class="tb icon-only" id="refreshBtn" title="새로 고침 (R)"></button>
    <span class="sep wide-only"></span>
    <div class="menu-wrap">
      <button type="button" class="tb primary" id="uploadBtn" title="올리기 (U)" aria-haspopup="true"></button>
      <div class="menu" id="uploadMenu" hidden>
        <button type="button" id="uploadFilesBtn"></button>
        <button type="button" id="uploadFolderBtn"></button>
      </div>
    </div>
    <button type="button" class="tb manage" id="newFolderBtn" title="새 폴더 (N)"></button>
    <button type="button" class="tb" id="downloadBtn" title="받기 (D)"></button>
    <button type="button" class="tb manage" id="renameBtn" title="이름 바꾸기 (F2)"></button>
    <button type="button" class="tb manage" id="moveBtn" title="옮기기 (M)"></button>
    <button type="button" class="tb manage" id="copyBtn" title="복사 (C)"></button>
    <button type="button" class="tb manage danger" id="deleteBtn" title="지우기 (Delete)"></button>
    <button type="button" class="tb icon-only" id="infoBtn" title="정보 (I)"></button>
    <span class="sep wide-only"></span>
    <button type="button" class="tb manage icon-only" id="trashBtn" title="휴지통"></button>
    <button type="button" class="tb primary" id="restoreBtn" hidden></button>
    <button type="button" class="tb danger" id="purgeBtn" hidden></button>
    <button type="button" class="tb danger" id="emptyTrashBtn" hidden></button>
    <div class="grow"></div>
    <input type="search" id="filter" placeholder="이 폴더에서 찾기 (/)" aria-label="이 폴더에서 찾기" autocomplete="off" spellcheck="false">
    <select id="sortSel" aria-label="정렬">
      <option value="name:1">이름 ↑</option>
      <option value="name:-1">이름 ↓</option>
      <option value="size:-1">크기 큰 것부터</option>
      <option value="size:1">크기 작은 것부터</option>
      <option value="modified:-1">최근 것부터</option>
      <option value="modified:1">오래된 것부터</option>
      <option value="kind:1">종류</option>
    </select>
    <button type="button" class="tb icon-only" id="viewBtn" title="목록·격자 (V)"></button>
    <button type="button" class="tb wide-only icon-only" id="helpBtn" title="단축키 (?)"></button>
  </div>

  <nav id="crumbs" aria-label="경로"></nav>
  <div id="notice" hidden></div>

  <div id="main">
    <aside id="tree" aria-label="폴더 나무"></aside>
    <div id="treeBack"></div>
    <section id="pane">
      <div id="head" class="cols"></div>
      <div id="scroller" tabindex="0" role="listbox" aria-multiselectable="true" aria-label="항목">
        <div id="spacer"><div id="items"></div></div>
      </div>
      <div id="empty" hidden></div>
    </section>
  </div>

  <footer id="status" aria-live="polite"></footer>
</div>

<section id="queue" hidden aria-label="올리기">
  <header>
    <span class="grow" id="queueTitle"></span>
    <button type="button" id="queueClear">끝난 것 지우기</button>
    <button type="button" id="queueFold">접기</button>
  </header>
  <div class="list" id="queueList"></div>
</section>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="보기">
  <div class="vbar">
    <button type="button" class="vbtn" id="vClose" title="닫기 (Esc)" aria-label="닫기"></button>
    <span class="title" id="vTitle"></span>
    <span class="count" id="vCount"></span>
    <button type="button" class="vbtn" id="vZoomOut" title="작게 (-)" aria-label="작게"></button>
    <span class="zoomlabel" id="vZoom"></span>
    <button type="button" class="vbtn" id="vZoomIn" title="크게 (+)" aria-label="크게"></button>
    <button type="button" class="vbtn" id="vFit" title="화면에 맞추기 (0)" aria-label="화면에 맞추기"></button>
    <button type="button" class="vbtn" id="vDownload" title="받기" aria-label="받기"></button>
  </div>
  <div class="stage" id="vStage">
    <button type="button" class="side prev" id="vPrev" title="앞 (←)" aria-label="앞"></button>
    <button type="button" class="side next" id="vNext" title="뒤 (→)" aria-label="뒤"></button>
  </div>
</div>

<div id="dialogBack" hidden></div>
<div id="toasts" aria-live="assertive"></div>
<input type="file" id="pickFiles" multiple hidden>
<input type="file" id="pickFolder" webkitdirectory multiple hidden>
</body>
</html>
