# 동적 버전(+, latest.release, 범위)을 쓰지 않는다. 툴체인은 iroiro-viewer 가 이 기계에서 실측으로 정한 조합과 같다.
[versions]
agp = "9.4.1"
kotlin = "2.3.20"
# 사용자 승인(2026-10-04). 프록시(ProxyController)·문서 시작 스크립트·WebMessage 가 여기 있다. 순수 자바 AndroidX, 네이티브 없음.
webkit = "1.17.1"
# 사용자 승인(2026-10-05 — '따로 된 소리를 영상과 한 파일로 합치기 => media3 이용'). 그릇 읽기(추출기)만 — 플레이어는 들이지 않는다.
# iroiro-viewer 와 같은 판. 끌어오는 것: media3-common·container·decoder, Guava(33.3.1-android), androidx.annotation(-experimental).
media3 = "1.11.1"

[libraries]
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-media3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
