android.useAndroidX=true

# AGP 9 의 내장 Kotlin 을 쓴다(기본값 true). 외부 org.jetbrains.kotlin.android 을 적용하면 AGP 9.4 의 새 DSL 과 충돌해
# 설정이 죽는다(iroiro-viewer 의 함정 표).
android.builtInKotlin=true

kotlin.code.style=official

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# 구성 캐시는 끈다 — 디버그 빌드가 실험용 인증서(local 에서 만든 것)가 있는지를 구성 때 보고 네트워크 보안 설정을 고른다
# (app/build.gradle.kts). 캐시가 켜져 있으면 인증서를 만든 뒤에도 옛 판단이 남는다.
org.gradle.configuration-cache=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
