<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 345" width="700" height="345" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">조정으로 막지 못하는 그래프와 같은 자리에 도구를 붙인 그래프</title><desc id="d">왼쪽 칸에서는 상자를 친 잰 성질에서 나가는 화살표가 회색 점선이지만 점선 원으로 그린 못 잰 혼입에서 처치와 결과로 가는 화살표가 실선으로 남아 있다. 오른쪽 칸에는 그 못 잰 혼입이 그대로 있고 처치 왼쪽에 도구가 하나 더 붙어 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="58" width="330" height="236" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="180" y="44" text-anchor="middle" class="sm bold ink">조정의 길 — 재서 넣는다</text><rect x="40" y="77" width="96" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="88" cy="112" rx="39" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="88" y="112" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="88" dy="4.5">잰 성질</tspan></text><ellipse cx="262" cy="112" rx="54" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="262" y="112" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="262" dy="4.5">못 잰 혼입</tspan></text><ellipse cx="92" cy="244" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="92" y="244" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="92" dy="4.5">처치</tspan></text><ellipse cx="272" cy="244" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="272" y="244" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="272" dy="4.5">결과</tspan></text><path d="M89.18 150.98 L90.97 210.02" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M119.69 134.73 L244.37 224.18" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M219.35 145.12 L118.85 223.15" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M266.08 165.85 L269.43 210.1" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M118 244 L238 244" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="180" y="286" text-anchor="middle" class="sm ink2">못 잰 혼입이 만든 뒷문은 그대로다</text><rect x="355" y="58" width="330" height="236" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="520" y="44" text-anchor="middle" class="sm bold ink">도구의 길 — 밖에서 흔든다</text><ellipse cx="412" cy="112" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="412" y="112" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="412" dy="4.5">도구</tspan></text><ellipse cx="596" cy="112" rx="54" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="596" y="112" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="596" dy="4.5">못 잰 혼입</tspan></text><ellipse cx="432" cy="244" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="432" y="244" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="432" dy="4.5">처치</tspan></text><ellipse cx="612" cy="244" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="612" y="244" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="612" dy="4.5">결과</tspan></text><path d="M415.89 137.71 L426.91 210.38" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M553.93 145.86 L458.49 222.68" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M602.5 165.61 L607.91 210.25" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M458 244 L578 244" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="520" y="286" text-anchor="middle" class="sm ink2">뒷문을 그대로 두고 도구가 처치를 흔든다</text><text x="350" y="326" text-anchor="middle" class="sm bold ink">왼쪽 길이 막힌 자리에서 오른쪽 길을 찾는다</text>
</svg>