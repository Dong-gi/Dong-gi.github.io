<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">예측이 기대고 있던 화살표를 개입이 끊는 모습</title><desc id="d">왼쪽 칸에서는 갑이 처치와 결과 양쪽으로 화살표를 보내고 오른쪽 칸에서는 처치로 가는 화살표가 없다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="20" y="55" width="310" height="180" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="42" text-anchor="middle" class="sm bold ink">지금 세상 — 예측이 잘 맞는다</text><path d="M157.18 113.93 L121.04 152.33" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M192.82 113.93 L228.96 152.33" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><ellipse cx="175" cy="95" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="175" y="95" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="175" dy="4.5">갑</tspan></text><ellipse cx="95" cy="180" rx="30" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="95" y="180" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="95" dy="4.5">처치</tspan></text><ellipse cx="255" cy="180" rx="30" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="255" y="180" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="255" dy="4.5">결과</tspan></text><text x="175" y="224" text-anchor="middle" class="sm ink2">둘이 함께 움직인다</text><rect x="370" y="55" width="310" height="180" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="525" y="42" text-anchor="middle" class="sm bold ink">처치를 밖에서 정한 세상</text><path d="M542.82 113.93 L578.96 152.33" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><ellipse cx="525" cy="95" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="525" y="95" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">갑</tspan></text><ellipse cx="445" cy="180" rx="30" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="445" y="180" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="445" dy="4.5">처치</tspan></text><ellipse cx="605" cy="180" rx="30" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="605" y="180" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="605" dy="4.5">결과</tspan></text><text x="525" y="224" text-anchor="middle" class="sm ink2">갑에서 처치로 가는 화살표가 없다</text><text x="350" y="264" text-anchor="middle" class="sm bold ink">예측이 기대고 있던 것이 갑에서 처치로 가는 화살표다</text><text x="350" y="290" text-anchor="middle" class="sm bold ink">개입은 바로 그 화살표를 끊는다</text>
</svg>