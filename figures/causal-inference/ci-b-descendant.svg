<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" width="620" height="370" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">충돌부의 후손만 통제한 그래프</title><desc id="d">처치와 결과에서 충돌로 화살표가 들어가고 충돌에서 후손으로 화살표가 나간다. 상자는 후손에만 쳐져 있는데 충돌로 들어가는 두 화살표가 실선이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="275" y="40" text-anchor="middle" class="sm bold ink">충돌부는 놔두고 그 후손만 통제했다</text><ellipse cx="110" cy="95" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="110" y="95" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="110" dy="4.5">처치</tspan></text><ellipse cx="440" cy="95" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="440" y="95" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="440" dy="4.5">결과</tspan></text><ellipse cx="275" cy="185" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="275" y="185" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="275" dy="4.5">충돌</tspan></text><rect x="240" y="250" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="275" cy="285" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="275" y="285" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="275" dy="4.5">후손</tspan></text><path d="M132.83 107.45 L245.15 168.72" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M417.17 107.45 L304.85 168.72" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M275 211 L275 251" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M136 95 L406 95" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="275" y="345" text-anchor="middle" class="sm ink2">그래도 처치와 결과 사이에 없던 연관이 생긴다</text>
</svg>