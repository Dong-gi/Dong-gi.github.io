<title id="t">관측되지 않은 원인 때문에 어떤 집합도 뒷문 기준을 채우지 못하는 그래프</title><desc id="d">점선 원으로 그린 숨은 원인에서 처치와 결과로 실선 화살표가 나가고 상자를 친 나이에서 처치와 결과로 점선 화살표가 나간다</desc>
