<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">갈림길의 가운데를 통제하기 전과 후</title><desc id="d">가운데에서 처치와 결과로 화살표가 나간다. 왼쪽은 두 화살표가 실선이고, 오른쪽은 가운데에 상자를 쳐서 두 화살표가 회색 점선이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="50" width="330" height="196" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="179" y="38" text-anchor="middle" class="sm bold ink">가운데를 통제하지 않는다</text><ellipse cx="179" cy="106" rx="31.6" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="179" y="106" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="179" dy="4.5">가운데</tspan></text><ellipse cx="109" cy="196" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="109" y="196" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="109" dy="4.5">처치</tspan></text><ellipse cx="249" cy="196" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="249" y="196" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="249" dy="4.5">결과</tspan></text><path d="M159.6 130.94 L129.87 169.16" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M198.4 130.94 L228.13 169.16" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="179" y="236" text-anchor="middle" class="sm ink2">둘이 함께 움직인다</text><rect x="356" y="50" width="330" height="196" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="521" y="38" text-anchor="middle" class="sm bold ink">가운데를 통제한다</text><rect x="480.4" y="71" width="81.2" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="521" cy="106" rx="31.6" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="521" y="106" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="521" dy="4.5">가운데</tspan></text><ellipse cx="451" cy="196" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="451" y="196" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="451" dy="4.5">처치</tspan></text><ellipse cx="591" cy="196" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="591" y="196" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="591" dy="4.5">결과</tspan></text><path d="M501.6 130.94 L471.87 169.16" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M540.4 130.94 L570.13 169.16" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><text x="521" y="236" text-anchor="middle" class="sm ink2">한 값으로 묶어 보면 함께 움직이지 않는다</text><text x="350" y="272" text-anchor="middle" class="sm bold ink">갈림길도 가운데를 통제하면 막힌다</text>
</svg>