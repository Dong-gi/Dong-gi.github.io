l(#ar2)"/><text x="175" y="305" text-anchor="middle" class="sm ink2">시간과 결과 사이의 뒷문이 막힌다</text><rect x="365" y="52" width="320" height="275" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="525" y="38" text-anchor="middle" class="sm bold ink">그 공통 원인을 재지 못했다</text><ellipse cx="525" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="525" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">형편</tspan></text><ellipse cx="412" cy="205" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="412" y="205" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="412" dy="4.5">처치</tspan></text><rect x="490" y="170" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="525" cy="205" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="525" y="205" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">시간</tspan></text><ellipse cx="638" cy="205" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="638" y="205" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="638" dy="4.5">결과</tspan></text><path d="M525 126 L525 171" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M544.05 117.7 L613.09 181.86" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M438 205 L491 205" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M551 205 L604 205" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M438 205 Q521 340 604 205" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text x="452" y="145" text-anchor="middle" class="s