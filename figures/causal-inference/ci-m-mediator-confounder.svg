<title id="t">매개변수와 결과의 공통 원인이 있는 그래프</title><desc id="d">왼쪽은 여유와 시간 둘 다에 상자를 쳐서 모든 화살표가 점선이고, 오른쪽은 점선 원으로 그린 형편에서 시간과 결과로 나가는 화살표가 실선으로 남는다</desc>
<style>
