<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">두 변수를 잇는 경로가 둘인 그래프에서의 판정</title><desc id="d">혼입에서 처치와 결과로 화살표가 나가고 처치와 결과에서 충돌로 화살표가 들어간다. 왼쪽은 위쪽 두 화살표가 실선 아래쪽 두 화살표가 회색 점선이고, 오른쪽은 혼입에 상자를 쳐서 네 화살표가 모두 회색 점선이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="50" width="330" height="250" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="179" y="38" text-anchor="middle" class="sm bold ink">아무것도 통제하지 않는다</text><ellipse cx="179" cy="104" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="179" y="104" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="179" dy="4.5">혼입</tspan></text><ellipse cx="101" cy="186" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="101" y="186" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="101" dy="4.5">처치</tspan></text><ellipse cx="257" cy="186" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="257" y="186" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="257" dy="4.5">결과</tspan></text><ellipse cx="179" cy="268" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="179" y="268" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="179" dy="4.5">충돌</tspan></text><path d="M161.08 122.84 L124.43 161.37" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M196.92 122.84 L233.57 161.37" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M118.92 204.84 L155.57 243.37" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M239.08 204.84 L202.43 243.37" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><text x="179" y="320" text-anchor="middle" class="sm bold ink">위 경로가 열려 있으므로 d-분리가 아니다</text><rect x="356" y="50" width="330" height="250" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="521" y="38" text-anchor="middle" class="sm bold ink">혼입만 통제한다</text><rect x="486" y="69" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="521" cy="104" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="521" y="104" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="521" dy="4.5">혼입</tspan></text><ellipse cx="443" cy="186" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="443" y="186" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="443" dy="4.5">처치</tspan></text><ellipse cx="599" cy="186" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="599" y="186" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="599" dy="4.5">결과</tspan></text><ellipse cx="521" cy="268" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="521" y="268" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="521" dy="4.5">충돌</tspan></text><path d="M503.08 122.84 L466.43 161.37" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M538.92 122.84 L575.57 161.37" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M460.92 204.84 L497.57 243.37" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M581.08 204.84 L544.43 243.37" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><text x="521" y="320" text-anchor="middle" class="sm bold ink">두 경로가 다 막혔으므로 d-분리다</text>
</svg>