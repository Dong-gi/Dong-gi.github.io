<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">뒷문 기준의 두 조항을 지킨 통제 집합과 어긴 통제 집합</title><desc id="d">왼쪽은 혼입에만 상자를 쳐서 뒷문 경로가 점선이 되고 처치에서 매개를 거쳐 결과로 가는 경로는 실선으로 남는다. 오른쪽은 매개에도 상자를 쳐서 네 화살표가 모두 점선이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="60" width="320" height="220" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="45" text-anchor="middle" class="sm bold ink">혼입만 통제한다</text><rect x="140" y="85" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="175" cy="120" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="175" y="120" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="175" dy="4.5">혼입</tspan></text><ellipse cx="75" cy="220" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="75" y="220" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="75" dy="4.5">처치</tspan></text><ellipse cx="175" cy="220" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="175" y="220" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="175" dy="4.5">매개</tspan></text><ellipse cx="275" cy="220" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="275" y="220" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="275" dy="4.5">결과</tspan></text><path d="M156.62 138.38 L99.04 195.96" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M193.38 138.38 L250.96 195.96" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M101 220 L141 220" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M201 220 L241 220" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="175" y="268" text-anchor="middle" class="sm ink2">뒷문이 막히고 후손은 넣지 않았다</text><rect x="365" y="60" width="320" height="220" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="525" y="45" text-anchor="middle" class="sm bold ink">혼입과 매개를 함께 통제한다</text><rect x="490" y="85" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="525" cy="120" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="525" y="120" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">혼입</tspan></text><ellipse cx="425" cy="220" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="425" y="220" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="425" dy="4.5">처치</tspan></text><rect x="490" y="185" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="525" cy="220" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="525" y="220" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">매개</tspan></text><ellipse cx="625" cy="220" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="625" y="220" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="625" dy="4.5">결과</tspan></text><path d="M506.62 138.38 L449.04 195.96" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M543.38 138.38 L600.96 195.96" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M451 220 L491 220" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M551 220 L591 220" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><text x="525" y="268" text-anchor="middle" class="sm ink2">재려던 경로까지 막혔다</text><text x="350" y="312" text-anchor="middle" class="sm bold ink">두 조항 가운데 하나만 어겨도 그 집합은 쓸 수 없다</text>
</svg>