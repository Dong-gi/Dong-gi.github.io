<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 275" width="660" height="275" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">처치 이름 하나에서 서로 다른 시행 셋으로 갈라져 결과로 간다</title><desc id="d">왼쪽 처치 이름에서 세 갈래가 나와 각각 다른 시행으로 가고 셋 모두 오른쪽 결과로 이어진다</desc>
<style>
