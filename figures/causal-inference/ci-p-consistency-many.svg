<ellipse cx="100" cy="135" rx="62" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="100" y="135" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="100" dy="4.5">처치 이름 하나</tspan></text><ellipse cx="360" cy="60" rx="64" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="360" y="60" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="360" dy="4.5">실제로 한 것 가</tspan></text><ellipse cx="360" cy="135" rx="64" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="360" y="135" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="360" dy="4.5">실제로 한 것 나</tspan></text><ellipse cx="360" cy="210" rx="64" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="360" y="210" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="360" dy="4.5">실제로 한 것 다</tspan></text><ellipse cx="565" cy="135" rx="40" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="565" y="135" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="565" dy="4.5">결과</tspan></text><path d="M159.57 117.82 L290.82 79.96" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M162 135 L288 135" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M159.57 152.18 L290.82 190.04" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M420.1 81.99 L519.92 118.51" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M424 135 L517 135" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M420.1 188.01 L519.92 151.49" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="330" y="262" text-anchor="middle" class="sm bold ink">이름이 같아도 실제가 여럿이면 잠재결과가 하나