<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">조정으로 막히는 뒷문과 조정과 상관없이 남는 뒷문</title><desc id="d">같은 그래프를 두 번 그렸다. 오른쪽에서는 습관에 상자가 쳐져 위쪽 화살표 둘이 점선이 되었지만, 점선 원으로 그린 숨은 원인에서 나가는 아래쪽 화살표 둘은 양쪽 그림에서 똑같이 실선이다</desc>
<style>
