<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 315" width="700" height="315" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">같은 그래프에서 서로 다른 두 집합이 같은 뒷문 경로를 막는다</title><desc id="d">배경에서 처치와 소득으로, 소득에서 결과로 화살표가 나간다. 왼쪽은 배경에만 오른쪽은 소득에만 상자를 쳤고 두 경우 모두 뒷문 화살표가 점선이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
