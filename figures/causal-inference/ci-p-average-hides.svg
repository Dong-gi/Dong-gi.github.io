<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">개인 효과가 넷 둘 영 마이너스둘인 네 대상의 평균이 1이 된다</title><desc id="d">네 대상의 개인 효과가 서로 다르고 그 가운데 하나는 음수다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="320" y="40" text-anchor="middle" class="sm bold ink">같은 평균 뒤에 서로 다른 대상이 있다</text><ellipse cx="100" cy="95" rx="34" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="100" y="95" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="100" dy="4.5">가</tspan></text><text x="100" y="150" text-anchor="middle" class="sm ink2">개인 효과 4</text><ellipse cx="245" cy="95" rx="34" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="245" y="95" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="245" dy="4.5">나</tspan></text><text x="245" y="150" text-anchor="middle" class="sm ink2">개인 효과 2</text><ellipse cx="390" cy="95" rx="34" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="390" y="95" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="390" dy="4.5">다</tspan></text><text x="390" y="150" text-anchor="middle" class="sm ink2">개인 효과 0</text><ellipse cx="535" cy="95" rx="34" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="535" y="95" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="535" dy="4.5">라</tspan></text><text x="535" y="150" text-anchor="middle" class="sm ink2">개인 효과 -2</text><rect x="60" y="175" width="520" height="48" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="320" y="205" text-anchor="middle" class="sm bold ink">평균은 1인데 하나는 오히려 나빠졌다</text>
</svg>