<title id="t">결과에 닿을 수 없는 처치를 대신 놓아 보는 일</title><desc id="d">재지 못한 혼입이 실제 처치와 음성 대조 원인 양쪽에 화살표를 보내는데 음성 대조 원인은 결과로 가지 않는다</desc>
<style>
