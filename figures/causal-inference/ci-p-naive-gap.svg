<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 245" width="640" height="245" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">관측된 두 평균의 차이가 두 덩어리의 합으로 갈라진다</title><desc id="d">위 칸에서 화살표 둘이 내려가 아래 두 칸으로 나뉜다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="320" y="34" text-anchor="middle" class="sm bold ink">관측되는 차이를 두 덩어리로 가른다</text><rect x="70" y="46" width="500" height="48" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="320" y="76" text-anchor="middle" class="sm bold ink">처치군 평균 빼기 대조군 평균</text><path d="M240 96 L181.62 135.52" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M400 96 L458.38 135.52" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><rect x="50" y="146" width="240" height="68" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="170" y="174" text-anchor="middle" class="sm bold ink">처치집단 평균처치효과</text><text x="170" y="196" text-anchor="middle" class="sm ink2">재고 싶은 것</text><text x="320" y="182" text-anchor="middle" class="sm ink2">더하기</text><rect x="350" y="146" width="240" height="68" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="470" y="174" text-anchor="middle" class="sm bold ink">선택 편향</text><text x="470" y="196" text-anchor="middle" class="sm ink2">처치가 없었더라도 있던 차이</text>
</svg>