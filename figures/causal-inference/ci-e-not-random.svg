<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">성향점수로 묶은 그래프와 무선배정을 한 그래프</title><desc id="d">왼쪽은 상자를 친 잰 성질에서 나가는 화살표가 점선이지만 점선 원으로 그린 못 잰 성질에서 처치와 결과로 가는 화살표가 실선이다. 오른쪽은 처치로 들어오는 화살표가 동전에서 오는 것뿐이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="58" width="330" height="226" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="180" y="44" text-anchor="middle" class="sm bold ink">성향점수로 묶었을 때</text><rect x="37" y="70" width="96" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="85" cy="105" rx="39" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="85" y="105" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="85" dy="4.5">잰 성질</tspan></text><ellipse cx="258" cy="105" rx="52" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="258" y="105" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="258" dy="4.5">못 잰 성질</tspan></text><ellipse cx="90" cy="238" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="90" y="238" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="90" dy="4.5">처치</tspan></text><ellipse cx="270" cy="238" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="270" y="238" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="270" dy="4.5">결과</tspan></text><path d="M86.47 143.97 L88.72 204.02" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M116.67 127.77 L242.39 218.15" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M217.23 137.28 L116.66 216.9" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M262.67 156.79 L266.94 204.14" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M116 238 L236 238" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="180" y="274" text-anchor="middle" class="sm ink2">막지 못한 뒷문이 남는다</text><rect x="355" y="58" width="330" height="226" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="520" y="44" text-anchor="middle" class="sm bold ink">무선배정을 했을 때</text><ellipse cx="425" cy="105" rx="28" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="425" y="105" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="425" dy="4.5">동전</tspan></text><ellipse cx="600" cy="105" rx="52" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="600" y="105" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="600" dy="4.5">못 잰 성질</tspan></text><ellipse cx="430" cy="238" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="430" y="238" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="430" dy="4.5">처치</tspan></text><ellipse cx="610" cy="238" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="610" y="238" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="610" dy="4.5">결과</tspan></text><path d="M426.05 132.98 L428.72 204.02" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M603.9 156.85 L607.45 204.1" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M456 238 L576 238" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="520" y="274" text-anchor="middle" class="sm ink2">처치로 들어오는 화살표가 동전뿐이다</text><text x="350" y="312" text-anchor="middle" class="sm bold ink">점수로 묶는 일은 잰 성질에만 닿는다</text>
</svg>