<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">매개변수와 결과의 공통 원인이 처치의 자식인 그래프</title><desc id="d">처치에서 의욕으로, 의욕에서 시간과 결과로 화살표가 나간다. 왼쪽은 의욕에 상자가 없어 그 화살표들이 실선이고, 오른쪽은 상자를 쳐서 처치에서 의욕으로 가는 화살표까지 점선이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="60" width="320" height="276" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="46" text-anchor="middle" class="sm bold ink">의욕은 통제하지 않는다</text><ellipse cx="175" cy="110" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="175" y="110" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="175" dy="4.5">의욕</tspan></text><ellipse cx="62" cy="220" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="62" y="220" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="62" dy="4.5">처치</tspan></text><rect x="140" y="185" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="175" cy="220" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="175" y="220" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="175" dy="4.5">시간</tspan></text><ellipse cx="288" cy="220" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="288" y="220" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="288" dy="4.5">결과</tspan></text><path d="M80.63 201.86 L150.64 133.72" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M175 136 L175 186" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M193.63 128.14 L263.64 196.28" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M88 220 L141 220" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M201 220 L254 220" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M88 220 Q171 355 254 220" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text x="258" y="150" text-anchor="middle" class="sm ink2">열려 있다</text><text x="175" y="316" text-anchor="middle" class="sm ink2">시간과 결과 사이 뒷문이 열린 채다</text><rect x="365" y="60" width="320" height="276" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="525" y="46" text-anchor="middle" class="sm bold ink">의욕도 함께 통제한다</text><rect x="490" y="75" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="525" cy="110" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="525" y="110" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">의욕</tspan></text><ellipse cx="412" cy="220" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="412" y="220" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="412" dy="4.5">처치</tspan></text><rect x="490" y="185" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="525" cy="220" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="525" y="220" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">시간</tspan></text><ellipse cx="638" cy="220" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="638" y="220" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="638" dy="4.5">결과</tspan></text><path d="M430.63 201.86 L500.64 133.72" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M525 136 L525 186" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M543.63 128.14 L613.64 196.28" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M438 220 L491 220" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M551 220 L604 220" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M438 220 Q521 355 604 220" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text x="608" y="150" text-anchor="middle" class="sm ink2">지워진다</text><text x="525" y="316" text-anchor="middle" class="sm ink2">처치가 의욕을 거쳐 하던 일까지 지워진다</text><text x="350" y="366" text-anchor="middle" class="sm bold ink">어느 쪽을 골라도 남는 값은 직접효과가 아니다</text>
</svg>