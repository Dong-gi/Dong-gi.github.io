<ellipse cx="120" cy="70" rx="40" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="120" y="70" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="120" dy="4.5">자료</tspan></text><ellipse cx="120" cy="175" rx="95" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="120" y="175" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="120" dy="4.5">자료 밖에서 아는 것</tspan></text><ellipse cx="470" cy="122" rx="78" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="470" y="122" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="470" dy="4.5">어느 표를 볼지</tspan></text><path d="M159.57 75.88 L384.93 109.36" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M213.93 160.78 L384.97 134.88" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text x="300" y="78" text-anchor="middle" class="sm ink2">숫자를 준다</text><text x="310" y="186" text-anchor="middle" class="sm ink2">무엇이 먼저 오는지를 준다</text><text x="320" y="222" text-anchor="middle" class="sm bold ink">둘 중 하나만으로는 답이 나오지 않는다</text>
