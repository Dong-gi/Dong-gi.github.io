<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">같은 그래프에서 짚은 두 가지 줄</title><desc id="d">두 칸 모두 갑이 위에 을이 아래에 있고 처치와 결과가 가운데에 있다. 왼쪽 칸에서는 갑에서 양쪽으로 나가는 두 화살표가 짙게, 오른쪽 칸에서는 처치에서 을을 거쳐 결과로 가는 두 화살표가 짙게 그려져 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="50" width="320" height="225" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="38" text-anchor="middle" class="sm bold ink">경로</text><ellipse cx="175" cy="92" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="175" y="92" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="175" dy="4.5">갑</tspan></text><ellipse cx="95" cy="168" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="95" y="168" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="95" dy="4.5">처치</tspan></text><ellipse cx="255" cy="168" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="255" y="168" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="255" dy="4.5">결과</tspan></text><ellipse cx="175" cy="244" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="175" y="244" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="175" dy="4.5">을</tspan></text><path d="M156.15 109.91 L119.65 144.58" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M193.85 109.91 L230.35 144.58" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M113.85 185.91 L150.35 220.58" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M193.85 226.09 L230.35 191.42" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="175" y="296" text-anchor="middle" class="sm ink2">갑에서는 화살표가 둘 다 나간다</text><text x="175" y="316" text-anchor="middle" class="sm ink2">방향이 어긋나도 두 마디가 이어져 있다</text><rect x="365" y="50" width="320" height="225" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="525" y="38" text-anchor="middle" class="sm bold ink">인과 경로</text><ellipse cx="525" cy="92" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="525" y="92" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">갑</tspan></text><ellipse cx="445" cy="168" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="445" y="168" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="445" dy="4.5">처치</tspan></text><ellipse cx="605" cy="168" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="605" y="168" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="605" dy="4.5">결과</tspan></text><ellipse cx="525" cy="244" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="525" y="244" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">을</tspan></text><path d="M506.15 109.91 L469.65 144.58" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M543.85 109.91 L580.35 144.58" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M463.85 185.91 L500.35 220.58" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M543.85 226.09 L580.35 191.42" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="525" y="296" text-anchor="middle" class="sm ink2">처치에서 을을 거쳐 결과로 간다</text><text x="525" y="316" text-anchor="middle" class="sm ink2">내내 화살표 방향을 따라간다</text><text x="350" y="348" text-anchor="middle" class="sm bold ink">경로는 방향을 따지지 않는다. 방향을 따지는 것만 인과 경로다</text>
</svg>