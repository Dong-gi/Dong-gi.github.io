<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">평행추세가 성립하는 경우와 깨지는 경우</title><desc id="d">왼쪽 칸에서는 가정한 반사실 점선 하나뿐이고, 오른쪽 칸에서는 그 점선보다 더 가파른 실제 반사실 선이 하나 더 그려져 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="175" y="30" text-anchor="middle" class="sm bold ink">평행추세가 성립할 때</text><rect x="20" y="48" width="320" height="180" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><path d="M45 208 L330 208" stroke="var(--ink2)" stroke-width="1.2" fill="none"/><path d="M110 62 L110 208" stroke="var(--grid)" stroke-width="1" stroke-dasharray="4 3" fill="none"/><path d="M260 62 L260 208" stroke="var(--grid)" stroke-width="1" stroke-dasharray="4 3" fill="none"/><text x="110" y="224" text-anchor="middle" class="sm ink2">전</text><text x="260" y="224" text-anchor="middle" class="sm ink2">후</text><path d="M110 186 L260 166" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round"/><circle cx="110" cy="186" r="4.5" fill="var(--s2)"/><circle cx="260" cy="166" r="4.5" fill="var(--s2)"/><path d="M110 146 L260 86" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round"/><circle cx="110" cy="146" r="4.5" fill="var(--s1)"/><circle cx="260" cy="86" r="4.5" fill="var(--s1)"/><path d="M110 146 L260 126" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="260" cy="126" r="4.5" fill="var(--s1)"/><path d="M272 86 L272 126" stroke="var(--s3)" stroke-width="3.5" stroke-linecap="round" fill="none"/><text x="282" y="110" text-anchor="start" class="sm ink2">이중차분</text><text x="175" y="254" text-anchor="middle" class="sm bold ink">점선이 실제 반사실과 같다</text><text x="525" y="30" text-anchor="middle" class="sm bold ink">평행추세가 깨질 때</text><rect x="365" y="48" width="320" height="180" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><path d="M390 208 L675 208" stroke="var(--ink2)" stroke-width="1.2" fill="none"/><path d="M455 62 L455 208" stroke="var(--grid)" stroke-width="1" stroke-dasharray="4 3" fill="none"/><path d="M605 62 L605 208" stroke="var(--grid)" stroke-width="1" stroke-dasharray="4 3" fill="none"/><text x="455" y="224" text-anchor="middle" class="sm ink2">전</text><text x="605" y="224" text-anchor="middle" class="sm ink2">후</text><path d="M455 186 L605 166" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round"/><circle cx="455" cy="186" r="4.5" fill="var(--s2)"/><circle cx="605" cy="166" r="4.5" fill="var(--s2)"/><path d="M455 146 L605 86" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round"/><circle cx="455" cy="146" r="4.5" fill="var(--s1)"/><circle cx="605" cy="86" r="4.5" fill="var(--s1)"/><path d="M455 146 L605 126" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="605" cy="126" r="4.5" fill="var(--s1)"/><path d="M455 146 L605 106" fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 4"/><circle cx="605" cy="106" r="4.5" fill="var(--s3)"/><text x="525" y="254" text-anchor="middle" class="sm bold ink">실제 반사실이 더 가팔라 이중차분이 부풀려진다</text><path d="M50 290 L80 290" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round"/><text x="86" y="294" text-anchor="start" class="sm ink2">대조집단</text><path d="M180 290 L210 290" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round"/><text x="216" y="294" text-anchor="start" class="sm ink2">처치집단이 실제로 간 길</text><path d="M400 290 L430 290" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/><text x="436" y="294" text-anchor="start" class="sm ink2">가정한 반사실</text><path d="M560 290 L590 290" fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 4"/><text x="596" y="294" text-anchor="start" class="sm ink2">실제 반사실</text><text x="350" y="318" text-anchor="middle" class="sm bold ink">오른쪽에서는 점선이 실제와 어긋나 있고, 그 어긋남은 자료에 보이지 않는다</text>
</svg>