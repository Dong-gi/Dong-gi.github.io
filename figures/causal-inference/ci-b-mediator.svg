<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 292" width="700" height="292" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">매개를 통제하기 전과 후</title><desc id="d">처치에서 매개를 거쳐 결과로 가는 갈래와 처치에서 결과로 곧장 가는 갈래가 있다. 오른쪽은 매개에 상자를 쳐서 거쳐 가는 갈래가 점선이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="55" width="320" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="42" text-anchor="middle" class="sm bold ink">매개를 통제하지 않는다</text><ellipse cx="175" cy="110" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="175" y="110" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="175" dy="4.5">매개</tspan></text><ellipse cx="80" cy="175" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="80" y="175" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="80" dy="4.5">처치</tspan></text><ellipse cx="270" cy="175" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="270" y="175" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="270" dy="4.5">결과</tspan></text><path d="M101.46 160.32 L146.94 129.2" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M196.46 124.68 L241.94 155.8" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M106 175 L236 175" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="175" y="232" text-anchor="middle" class="sm ink2">두 갈래가 다 열려 총효과가 나온다</text><rect x="365" y="55" width="320" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="525" y="42" text-anchor="middle" class="sm bold ink">매개를 통제한다</text><rect x="490" y="75" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="525" cy="110" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="525" y="110" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">매개</tspan></text><ellipse cx="430" cy="175" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="430" y="175" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="430" dy="4.5">처치</tspan></text><ellipse cx="620" cy="175" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="620" y="175" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="620" dy="4.5">결과</tspan></text><path d="M451.46 160.32 L496.94 129.2" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M546.46 124.68 L591.94 155.8" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M456 175 L586 175" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="525" y="232" text-anchor="middle" class="sm ink2">곧바로 가는 몫만 남는다</text><text x="350" y="278" text-anchor="middle" class="sm bold ink">총효과를 원한다면 매개를 넣으면 안 된다</text>
</svg>