<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">합쳐서 센 표와 나눠서 센 표의 대소가 반대가 된다</title><desc id="d">합치면 기존 방식이 높고 과목으로 나누면 두 과목 모두 새 방식이 높다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="55" width="300" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="165" y="42" text-anchor="middle" class="sm bold ink">합쳐서 세면</text><text x="95" y="88" text-anchor="middle" class="sm bold ink">학습 방식</text><text x="245" y="88" text-anchor="middle" class="sm bold ink">합격률</text><text x="95" y="126" text-anchor="middle" class="sm ink2">새 방식</text><text x="245" y="126" text-anchor="middle" class="sm ink2">58%</text><text x="95" y="164" text-anchor="middle" class="sm ink2">기존 방식</text><text x="245" y="164" text-anchor="middle" class="sm ink2">76%</text><text x="165" y="215" text-anchor="middle" class="sm ink2">기존 방식이 높다</text><rect x="340" y="55" width="345" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="512" y="42" text-anchor="middle" class="sm bold ink">과목으로 나눠서 세면</text><text x="400" y="88" text-anchor="middle" class="sm bold ink">과목</text><text x="510" y="88" text-anchor="middle" class="sm bold ink">새 방식</text><text x="615" y="88" text-anchor="middle" class="sm bold ink">기존 방식</text><text x="400" y="126" text-anchor="middle" class="sm ink2">가 과목</text><text x="510" y="126" text-anchor="middle" class="sm ink2">90%</text><text x="615" y="126" text-anchor="middle" class="sm ink2">85%</text><text x="400" y="164" text-anchor="middle" class="sm ink2">나 과목</text><text x="510" y="164" text-anchor="middle" class="sm ink2">50%</text><text x="615" y="164" text-anchor="middle" class="sm ink2">40%</text><text x="512" y="215" text-anchor="middle" class="sm ink2">두 과목 다 새 방식이 높다</text><text x="350" y="285" text-anchor="middle" class="sm bold ink">같은 사람들을 센 것인데 대소가 반대다</text>
</svg>