<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">개입하기 전과 개입한 뒤의 그래프</title><desc id="d">왼쪽 칸에서는 을과 갑에서 처치로 화살표가 들어오고 갑에서 결과로도 화살표가 간다. 오른쪽 칸에서는 처치로 들어오던 화살표 둘이 없고 갑에서 결과로 가는 화살표와 처치에서 결과로 가는 화살표만 남아 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="50" width="320" height="195" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="38" text-anchor="middle" class="sm bold ink">관찰 — 그대로 두고 본다</text><ellipse cx="115" cy="88" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="115" y="88" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="115" dy="4.5">을</tspan></text><ellipse cx="230" cy="88" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="230" y="88" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="230" dy="4.5">갑</tspan></text><ellipse cx="100" cy="192" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="100" y="192" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="100" dy="4.5">처치</tspan></text><ellipse cx="250" cy="192" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="250" y="192" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="250" dy="4.5">결과</tspan></text><path d="M111.29 113.73 L104.85 158.35" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M209.7 104.24 L126.55 170.76" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M234.91 113.53 L243.58 158.61" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M126 192 L216 192" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="175" y="236" text-anchor="middle" class="sm ink2">처치로 화살표가 둘 들어온다</text><rect x="365" y="50" width="320" height="195" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="525" y="38" text-anchor="middle" class="sm bold ink">개입 — 우리가 정한다</text><ellipse cx="465" cy="88" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="465" y="88" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="465" dy="4.5">을</tspan></text><ellipse cx="580" cy="88" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="580" y="88" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="580" dy="4.5">갑</tspan></text><ellipse cx="450" cy="192" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="450" y="192" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="450" dy="4.5">처치</tspan></text><ellipse cx="600" cy="192" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="600" y="192" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="600" dy="4.5">결과</tspan></text><path d="M584.91 113.53 L593.58 158.61" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M476 192 L566 192" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="492" y="142" text-anchor="middle" class="sm ink2">둘 다 끊었다</text><text x="525" y="236" text-anchor="middle" class="sm ink2">나가는 화살표는 그대로다</text><text x="350" y="274" text-anchor="middle" class="sm bold ink">들어오는 화살표만 사라진다. 마디도 나머지 화살표도 그대로다</text>
</svg>