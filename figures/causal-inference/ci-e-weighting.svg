<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 265" width="700" height="265" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">가중치를 곱하기 전과 후의 네 칸 인원</title><desc id="d">왼쪽 표에서는 묶음마다 처치와 대조의 인원이 45 대 15 와 15 대 45 로 어긋나 있고, 오른쪽 표에서는 네 칸이 모두 60 이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="160" y="34" text-anchor="middle" class="sm bold ink">자료에 있는 사람 수</text><rect x="25" y="48" width="270" height="148" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="85" y="88" text-anchor="middle" class="sm ink2">점수 0.75</text><text x="215" y="88" text-anchor="middle" class="sm bold ink">처치 45 · 대조 15</text><text x="85" y="128" text-anchor="middle" class="sm ink2">점수 0.25</text><text x="215" y="128" text-anchor="middle" class="sm bold ink">처치 15 · 대조 45</text><text x="160" y="174" text-anchor="middle" class="sm bold ink">묶음마다 두 쪽 인원이 다르다</text><path d="M312 122 L380 122" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text x="350" y="104" text-anchor="middle" class="sm ink2">가중치를 곱한다</text><text x="540" y="34" text-anchor="middle" class="sm bold ink">가중치를 곱한 뒤</text><rect x="405" y="48" width="270" height="148" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="465" y="88" text-anchor="middle" class="sm ink2">점수 0.75</text><text x="595" y="88" text-anchor="middle" class="sm bold ink">처치 60 · 대조 60</text><text x="465" y="128" text-anchor="middle" class="sm ink2">점수 0.25</text><text x="595" y="128" text-anchor="middle" class="sm bold ink">처치 60 · 대조 60</text><text x="540" y="174" text-anchor="middle" class="sm bold ink">네 칸이 모두 같아졌다</text><text x="350" y="224" text-anchor="middle" class="sm bold ink">가중한 뒤에는 두 쪽이 각각 전체 집단을 한 벌씩 흉내 낸다</text><text x="350" y="248" text-anchor="middle" class="sm bold ink">그 둘을 그대로 견주면 된다</text>
</svg>