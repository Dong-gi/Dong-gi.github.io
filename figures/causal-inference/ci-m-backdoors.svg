<title id="t">매개분석이 막아야 하는 뒷문 세 자리</title><desc id="d">습관에서 처치와 결과로, 의욕에서 시간과 결과로, 여유에서 시간과 결과로 화살표가 나간다. 의욕은 처치에서 화살표를 받는다</desc>
