<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">충돌부의 후손만 통제한 그래프</title><desc id="d">처치와 결과에서 충돌로 화살표가 들어가고 충돌에서 후손으로 화살표가 나간다. 왼쪽은 상자가 없어 위쪽 두 화살표가 회색 점선이고, 오른쪽은 맨 아래 후손에만 상자를 쳤는데 위쪽 두 화살표가 실선이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="50" width="330" height="244" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="179" y="38" text-anchor="middle" class="sm bold ink">후손을 통제하지 않는다</text><ellipse cx="99" cy="100" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="99" y="100" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="99" dy="4.5">처치</tspan></text><ellipse cx="259" cy="100" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="259" y="100" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="259" dy="4.5">결과</tspan></text><ellipse cx="179" cy="172" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="179" y="172" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="179" dy="4.5">충돌</tspan></text><ellipse cx="179" cy="254" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="179" y="254" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="179" dy="4.5">후손</tspan></text><path d="M118.33 117.39 L153.73 149.26" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M239.67 117.39 L204.27 149.26" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M179 198 L179 220" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><rect x="356" y="50" width="330" height="244" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="521" y="38" text-anchor="middle" class="sm bold ink">후손만 통제한다</text><ellipse cx="441" cy="100" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="441" y="100" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="441" dy="4.5">처치</tspan></text><ellipse cx="601" cy="100" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="601" y="100" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="601" dy="4.5">결과</tspan></text><ellipse cx="521" cy="172" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="521" y="172" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="521" dy="4.5">충돌</tspan></text><rect x="486" y="219" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="521" cy="254" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="521" y="254" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="521" dy="4.5">후손</tspan></text><path d="M460.33 117.39 L495.73 149.26" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M581.67 117.39 L546.27 149.26" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M521 198 L521 220" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="350" y="316" text-anchor="middle" class="sm bold ink">충돌부를 건드리지 않아도 그 후손이 같은 일을 한다</text>
</svg>