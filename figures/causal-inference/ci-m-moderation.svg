<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 355" width="700" height="355" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">매개 구조와 조절이 있는 상황의 대비</title><desc id="d">왼쪽은 처치에서 시간을 거쳐 결과로 가는 화살표가 있고, 오른쪽은 처치에서 결과로 가는 화살표 하나만 있으며 경험 마디에서는 화살표가 나가지 않는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="58" width="320" height="208" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="44" text-anchor="middle" class="sm bold ink">매개 — 어떤 길로 가는가</text><ellipse cx="70" cy="195" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="70" y="195" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="70" dy="4.5">처치</tspan></text><ellipse cx="175" cy="120" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="175" y="120" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="175" dy="4.5">시간</tspan></text><ellipse cx="280" cy="195" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="280" y="195" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="280" dy="4.5">결과</tspan></text><path d="M91.16 179.89 L147.33 139.76" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M196.16 135.11 L252.33 175.24" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="175" y="248" text-anchor="middle" class="sm ink2">처치가 시간을 바꾸고 시간이 결과를 바꾼다</text><rect x="365" y="58" width="320" height="208" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="525" y="44" text-anchor="middle" class="sm bold ink">조절 — 누구에게 더 큰가</text><ellipse cx="525" cy="120" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="525" y="120" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="525" dy="4.5">경험</tspan></text><ellipse cx="420" cy="195" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="420" y="195" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="420" dy="4.5">처치</tspan></text><ellipse cx="630" cy="195" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="630" y="195" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="630" dy="4.5">결과</tspan></text><path d="M446 195 L596 195" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text x="525" y="88" text-anchor="middle" class="sm ink2">화살표가 나가지 않는다</text><text x="525" y="168" text-anchor="middle" class="sm ink2">이 화살표의 세기가 경험마다 다르다</text><text x="525" y="248" text-anchor="middle" class="sm ink2">길은 하나여도 세기는 사람마다 다를 수 있다</text><text x="350" y="296" text-anchor="middle" class="sm bold ink">매개는 마디에 대한 이야기, 조절은 화살표의 세기에 대한 이야기다</text><path d="M20 326 L46 326" stroke="var(--ink2)" stroke-width="2" fill="none" marker-end="url(#ark)"/><text x="54" y="330" class="sm ink2">열린 경로</text><path d="M175 326 L201 326" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#ark)"/><text x="209" y="330" class="sm ink2">막힌 경로</text><rect x="334" y="319" width="18" height="14" rx="3" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><text x="364" y="330" class="sm ink2">통제한 변수</text><ellipse cx="488" cy="326" rx="11" ry="8" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="509" y="330" class="sm ink2">관측되지 않은 변수</text>
</svg>