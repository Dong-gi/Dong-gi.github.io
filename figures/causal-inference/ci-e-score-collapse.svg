<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">성질 값의 조합 여섯이 성향점수 셋으로 모이는 모양</title><desc id="d">왼쪽 칸에 조합 여섯이 세로로 놓여 있고 각 조합에서 오른쪽 점수 세 칸 가운데 하나로 화살표가 간다. 두 조합씩 같은 점수로 모인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
