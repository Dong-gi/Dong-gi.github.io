<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="340" y="30" text-anchor="middle" class="sm bold ink">성질 조합이 여럿이어도 점수는 하나다</text><text x="150" y="62" text-anchor="middle" class="sm bold ink">잰 성질의 값 조합</text><text x="540" y="62" text-anchor="middle" class="sm bold ink">성향점수</text><rect x="30" y="78" width="240" height="264" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="150" y="114" text-anchor="middle" class="sm bold ink">조합 하나</text><text x="150" y="154" text-anchor="middle" class="sm bold ink">조합 둘</text><text x="150" y="194" text-anchor="middle" class="sm bold ink">조합 셋</text><text x="150" y="234" text-anchor="middle" class="sm bold ink">조합 넷</text><text x="150" y="274" text-anchor="middle" class="sm bold ink">조합 다섯</text><text x="150" y="314" text-anchor="middle" class="sm bold ink">조합 여섯</text><rect x="450" y="92" width="180" height="44" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="540" y="118" text-anchor="middle" class="sm bold ink">점수 0.8</text><rect x="450" y="188" width="180" height="44" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="540" y="214" text-anchor="middle" class="sm bold ink">점수 0.5</text><rect x="450" y="284" width="180" height="44" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="540" y="310" text-anchor="middle" class="sm bold ink">점수 0.2</text><path d="M275 110 L437 113.81" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M275 150 L437.17 115.66" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M275 190 L437.05 209.07" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M275 230 L437.05 210.93" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M275 270 L437.17 304.34" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M275 310 