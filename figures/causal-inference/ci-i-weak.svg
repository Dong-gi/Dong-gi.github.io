<rect x="20" y="58" width="310" height="214" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="44" text-anchor="middle" class="sm bold ink">도구가 처치를 크게 움직일 때</text><text x="45" y="96" text-anchor="start" class="sm ink2">도구에서 결과로 새어 든 것</text><rect x="45" y="110" width="26" height="22" rx="1" fill="var(--s3)" fill-opacity="0.5" stroke="var(--s3)" stroke-width="1.2"/><text x="80" y="128" text-anchor="start" class="sm ink2">0.01</text><text x="45" y="172" text-anchor="start" class="sm ink2">도구가 처치를 움직인 만큼</text><rect x="45" y="186" width="240" height="22" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="var(--s1)" stroke-width="1.2"/><text x="295" y="202" text-anchor="start" class="sm ink2">0.40</text><text x="175" y="250" text-anchor="middle" class="sm bold ink">답이 0.025 만큼 어긋난다</text><rect x="350" y="58" width="310" height="214" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="505" y="44" text-anchor="middle" class="sm bold ink">도구가 처치를 조금밖에 못 움직일 때</text><text x="375" y="96" text-anchor="start" class="sm ink2">도구에서 결과로 새어 든 것</text><rect x="375" y="110" width="26" height="22" rx="1" fill="var(--s3)" fill-opacity="0.5" stroke="var(--s3)" stroke-width="1.2"/><text x="410" y="128" text-anchor="start" class="sm ink2">0.01</text><text x="375" y="172" text-anchor="start" class="sm ink2">도구가 처치를 움직인 만큼</text><rect x="375" y="186" width="26" height="22" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="var(--s1)" stroke-width="1.2"/><text x="410" y="202" text-anchor="start" class="sm ink2">0.04</text><text x="505" y="250" text-anchor="middle" class="sm bold ink">답이 0.25 만큼 어긋난다</text><text x="340" y="300" text-anchor="middle" class="sm bold ink">새어 든 것이 같아도 분모가 작으면 크게 부풀려진다</text>
