<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">마디가 둘인 경로에서 한 마디만 막은 경우</title><desc id="d">원인에서 처치로, 원인에서 중간으로, 중간에서 결과로 화살표가 간다. 왼쪽은 세 화살표가 모두 실선이고, 오른쪽은 중간에만 상자를 쳐서 중간에 붙은 두 화살표가 회색 점선이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="50" width="330" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="179" y="38" text-anchor="middle" class="sm bold ink">아무것도 통제하지 않는다</text><ellipse cx="119" cy="110" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="119" y="110" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="119" dy="4.5">원인</tspan></text><ellipse cx="219" cy="110" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="219" y="110" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="219" dy="4.5">중간</tspan></text><ellipse cx="59" cy="200" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="59" y="200" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="59" dy="4.5">처치</tspan></text><ellipse cx="299" cy="200" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="299" y="200" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="299" dy="4.5">결과</tspan></text><path d="M104.58 131.63 L77.86 171.71" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M145 110 L185 110" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M236.27 129.43 L276.41 174.59" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="179" y="240" text-anchor="middle" class="sm ink2">마디 둘이 다 열려 경로가 열려 있다</text><rect x="356" y="50" width="330" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="521" y="38" text-anchor="middle" class="sm bold ink">중간만 통제한다</text><ellipse cx="461" cy="110" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="461" y="110" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="461" dy="4.5">원인</tspan></text><rect x="526" y="75" width="70" height="70" rx="4" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><ellipse cx="561" cy="110" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="561" y="110" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="561" dy="4.5">중간</tspan></text><ellipse cx="401" cy="200" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="401" y="200" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="401" dy="4.5">처치</tspan></text><ellipse cx="641" cy="200" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="641" y="200" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="641" dy="4.5">결과</tspan></text><path d="M446.58 131.63 L419.86 171.71" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M487 110 L527 110" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M578.27 129.43 L618.41 174.59" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ark)"/><text x="521" y="240" text-anchor="middle" class="sm ink2">원인 자리는 열려 있는데도 경로는 막혔다</text><text x="350" y="276" text-anchor="middle" class="sm bold ink">경로가 열려 있으려면 마디가 전부 열려 있어야 한다</text>
</svg>