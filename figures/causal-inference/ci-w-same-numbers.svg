<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">같은 표에서 배경 이야기에 따라 답이 갈린다</title><desc id="d">한 표에서 화살표 둘이 갈라져 서로 반대되는 두 답으로 간다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="105" y="78" text-anchor="middle" class="sm bold ink">표의 숫자는 하나뿐</text><rect x="20" y="92" width="170" height="108" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="105" y="128" text-anchor="middle" class="sm ink2">합치면 58% 대 76%</text><text x="105" y="158" text-anchor="middle" class="sm ink2">나누면 새 방식이 높다</text><rect x="300" y="30" width="380" height="100" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="490" y="22" text-anchor="middle" class="sm bold ink">과목이 방식보다 먼저 정해졌다</text><text x="490" y="66" text-anchor="middle" class="sm ink2">나눈 표를 본다</text><text x="490" y="96" text-anchor="middle" class="sm ink2">새 방식이 낫다</text><rect x="300" y="175" width="380" height="100" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="490" y="167" text-anchor="middle" class="sm bold ink">과목이 방식의 결과로 생겼다</text><text x="490" y="211" text-anchor="middle" class="sm ink2">합친 표를 본다</text><text x="490" y="241" text-anchor="middle" class="sm ink2">새 방식이 낫지 않다</text><path d="M198.51 136.09 L287.46 87.73" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M198.4 154.11 L287.81 209.67" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="350" y="292" text-anchor="middle" class="sm bold ink">갈림을 만든 것은 표가 아니라 표 밖에서 가져온 이야기다</text>
</svg>