<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 265" width="700" height="265" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">앞문으로 나가는 경로와 뒷문으로 들어오는 경로</title><desc id="d">같은 세 노드를 두 번 그렸다. 왼쪽은 처치에서 결과로 곧장 가는 화살표를, 오른쪽은 혼입에서 처치와 결과 양쪽으로 나가는 화살표를 굵게 그렸다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="48" width="320" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="36" text-anchor="middle" class="sm bold ink">처치에서 화살표가 나가며 시작한다</text><ellipse cx="175" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="175" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="175" dy="4.5">혼입</tspan></text><ellipse cx="85" cy="185" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="85" y="185" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="85" dy="4.5">처치</tspan></text><ellipse cx="265" cy="185" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="265" y="185" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="265" dy="4.5">결과</tspan></text><path d="M156.1 117.85 L109.72 161.65" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M193.9 117.85 L240.28 161.65" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M111 185 L231 185" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="175" y="232" text-anchor="middle" class="sm ink2">이것이 재려는 경로다</text><rect x="360" y="48" width="320" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="520" y="36" text-anchor="middle" class="sm bold ink">처치로 화살표가 들어오며 시작한다</text><ellipse cx="520" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="520" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="520" dy="4.5">혼입</tspan></text><ellipse cx="430" cy="185" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="430" y="185" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="430" dy="4.5">처치</tspan></text><ellipse cx="610" cy="185" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="610" y="185" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="610" dy="4.5">결과</tspan></text><path d="M501.1 117.85 L454.72 161.65" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M538.9 117.85 L585.28 161.65" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M456 185 L576 185" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="520" y="232" text-anchor="middle" class="sm ink2">이것이 뒷문 경로다</text>
</svg>