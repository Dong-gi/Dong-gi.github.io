<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">그래프에서 독립을 읽어내는 네 단계의 순서</title><desc id="d">네 개의 칸이 왼쪽에서 오른쪽으로 화살표로 이어져 있다. 경로를 전부 찾는 칸, 마디의 구조와 통제를 보는 칸, 한 마디라도 막혔으면 그 경로를 막힌 것으로 두는 칸, 경로가 전부 막혔으면 두 변수가 분리된 것으로 두는 칸이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="350" y="32" text-anchor="middle" class="sm bold ink">그래프에서 독립을 읽어내는 네 단계</text><rect x="18" y="62" width="136" height="88" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="86" y="56" text-anchor="middle" class="sm ink2">하나</text><text x="86" y="100" text-anchor="middle" class="sm bold ink">두 변수 사이의</text><text x="86" y="122" text-anchor="middle" class="sm bold ink">경로를 전부 찾는다</text><rect x="194" y="62" width="136" height="88" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="262" y="56" text-anchor="middle" class="sm ink2">둘</text><text x="262" y="100" text-anchor="middle" class="sm bold ink">경로마다 마디의</text><text x="262" y="122" text-anchor="middle" class="sm bold ink">구조와 통제를 본다</text><rect x="370" y="62" width="136" height="88" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="438" y="56" text-anchor="middle" class="sm ink2">셋</text><text x="438" y="100" text-anchor="middle" class="sm bold ink">한 마디라도 막혔으면</text><text x="438" y="122" text-anchor="middle" class="sm bold ink">그 경로는 막힘</text><rect x="546" y="62" width="136" height="88" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="614" y="56" text-anchor="middle" class="sm ink2">넷</text><text x="614" y="100" text-anchor="middle" class="sm bold ink">경로가 전부 막혔으면</text><text x="614" y="122" text-anchor="middle" class="sm bold ink">두 변수는 d-분리</text><path d="M154 106 L186 106" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M330 106 L362 106" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M506 106 L538 106" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="350" y="180" text-anchor="middle" class="sm bold ink">9장부터 이 순서를 그대로 쓴다</text>
</svg>