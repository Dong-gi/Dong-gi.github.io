xt><rect x="535" y="162" width="70" height="45" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="570" y="190" text-anchor="middle">대조</text><text x="330" y="252" text-anchor="middle" class="sm bold ink">층 안에서는 조정 변수의 값이 같다</text><text x="330" y="278" text-anchor="middle" class="sm ink2">그 안에서만 처치와 대조를 견준다</text>
