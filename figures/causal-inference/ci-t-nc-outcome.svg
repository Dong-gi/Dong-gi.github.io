<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">음성 대조 결과가 신호를 주는 이유</title><desc id="d">재지 못한 혼입이 두 결과 모두에 화살표를 보내고 처치는 한쪽에만 화살표를 보낸다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path d="M224.48 85.96 L133.68 156.58" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M265.52 85.96 L356.32 156.58" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M269.49 78.72 Q384.96 81.82 500.43 160.92" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M142 175 L340 175" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><ellipse cx="245" cy="70" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="245" y="70" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="245" dy="4.5">열의</tspan></text><ellipse cx="110" cy="175" rx="32" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="110" y="175" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="110" dy="4.5">이미지</tspan></text><ellipse cx="380" cy="175" rx="32" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="380" y="175" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="380" dy="4.5">조회수</tspan></text><ellipse cx="540" cy="175" rx="46" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="540" y="175" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="540" dy="4.5">옛글 조회</tspan></text><text x="245" y="36" text-anchor="middle" class="sm ink2">재지 못한 혼입</text><text x="110" y="222" text-anchor="middle" class="sm ink2">처치</text><text x="380" y="222" text-anchor="middle" class="sm ink2">재려는 결과</text><text x="540" y="222" text-anchor="middle" class="sm ink2">음성 대조 결과</text><text x="320" y="256" text-anchor="middle" class="sm bold ink">이미지에서 옛글 조회로 가는 화살표는 없다</text><text x="320" y="284" text-anchor="middle" class="sm bold ink">조정한 뒤에도 이미지와 옛글 조회가 이어져 있으면 남은 혼입의 신호다</text>
</svg>