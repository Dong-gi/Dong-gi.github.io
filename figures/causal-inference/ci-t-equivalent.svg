<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 344" width="700" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">화살표가 다른데 같은 독립을 함의하는 그래프들</title><desc id="d">마디 셋짜리 그래프 넷을 나란히 놓았다. 앞의 셋은 같은 독립을, 넷째는 다른 독립을 함의한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
