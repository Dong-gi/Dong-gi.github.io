<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="20" y="46" width="320" height="118" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="180" y="38" text-anchor="middle" class="sm bold ink">첫째 — 사슬</text><path d="M106 100 L146 100" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M206 100 L246 100" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><ellipse cx="80" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="80" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="80" dy="4.5">갑</tspan></text><ellipse cx="180" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="180" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="180" dy="4.5">을</tspan></text><ellipse cx="280" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="280" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="280" dy="4.5">병</tspan></text><text x="180" y="152" text-anchor="middle" class="sm ink2">을을 통제하면 갑과 병이 독립</text><rect x="360" y="46" width="320" height="118" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="520" y="38" text-anchor="middle" class="sm bold ink">둘째 — 방향이 반대인 사슬</text><path d="M594 100 L554 100" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M494 100 L454 100" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><ellipse cx="420" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="420" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="420" dy="4.5">갑</tspan></text><ellipse cx="520" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="520" y="100" text-anchor="middle" fill="var(--ink)" style="font-size: