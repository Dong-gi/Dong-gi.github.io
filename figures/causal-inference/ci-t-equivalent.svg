"none" stroke="var(--ink2)" stroke-width="1.8"/><text x="420" y="248" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="420" dy="4.5">갑</tspan></text><ellipse cx="520" cy="248" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="520" y="248" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="520" dy="4.5">을</tspan></text><ellipse cx="620" cy="248" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="620" y="248" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="620" dy="4.5">병</tspan></text><text x="520" y="300" text-anchor="middle" class="sm ink2">통제하지 않으면 갑과 병이 독립</text><text x="350" y="332" text-anchor="middle" class="sm bold ink">앞의 셋은 같은 독립을 함의해 자료가 갈라 주지 못하고 넷째만 갈린다</text>
</svg>