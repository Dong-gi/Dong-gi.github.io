<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 335" width="700" height="335" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">배제 제약이 깨진 그래프와 도구에 뒷문이 있는 그래프</title><desc id="d">왼쪽 칸에서는 도구에서 처치를 거치지 않고 결과로 바로 가는 화살표가 하나 더 그려져 있다. 오른쪽 칸에서는 점선 원으로 그린 숨은 원인에서 도구와 결과로 화살표가 함께 나간다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="58" width="330" height="232" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="180" y="44" text-anchor="middle" class="sm bold ink">배제 제약이 깨진 경우</text><ellipse cx="75" cy="120" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="75" y="120" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="75" dy="4.5">도구</tspan></text><ellipse cx="300" cy="120" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="300" y="120" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="300" dy="4.5">결과</tspan></text><ellipse cx="185" cy="235" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="185" y="235" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="185" dy="4.5">처치</tspan></text><path d="M92.97 138.79 L161.5 210.43" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M203.38 216.62 L275.96 144.04" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M101 120 L266 120" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><text x="188" y="108" text-anchor="middle" class="sm ink2">도구가 결과로 바로 간다</text><text x="180" y="278" text-anchor="middle" class="sm ink2">이 화살표가 있으면 도구가 아니다</text><rect x="355" y="58" width="330" height="232" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="520" y="44" text-anchor="middle" class="sm bold ink">도구에 뒷문이 있는 경우</text><ellipse cx="470" cy="118" rx="46" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="470" y="118" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="470" dy="4.5">숨은 원인</tspan></text><ellipse cx="410" cy="235" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="410" y="235" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="410" dy="4.5">도구</tspan></text><ellipse cx="520" cy="235" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="520" y="235" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="520" dy="4.5">처치</tspan></text><ellipse cx="630" cy="235" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="630" y="235" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="630" dy="4.5">결과</tspan></text><path d="M449.01 158.93 L425.51 204.75" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M507.13 145.15 L602.55 214.93" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M436 235 L486 235" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M546 235 L596 235" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="520" y="278" text-anchor="middle" class="sm ink2">도구가 우연으로 정해진 것이 아니었다</text><text x="350" y="320" text-anchor="middle" class="sm bold ink">두 경우 모두 자료로는 확인되지 않는다</text>
</svg>