.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="165" y="42" text-anchor="middle" class="sm bold ink">성질이 정할 때</text><rect x="20" y="52" width="290" height="190" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><ellipse cx="165" cy="96" rx="52" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="165" y="96" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="165" dy="4.5">대상의 성질</tspan></text><ellipse cx="72" cy="196" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="72" y="196" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="72" dy="4.5">처치</tspan></text><ellipse cx="258" cy="196" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="258" y="196" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="258" dy="4.5">결과</tspan></text><path d="M137.76 125.29 L95.15 171.1" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M192.24 125.29 L234.85 171.1" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M98 196 L224 196" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="475" y="42" text-anchor="middle" class="sm bold ink">동전이 정할 때</text><rect x="330" y="52" width="290" height="190" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><ellipse cx="475" cy="96" rx="52" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="475" y="96" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="475" dy="4.5">대상의 성질</tspan></text><ellipse cx="372" cy="96" rx="28" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="372" y="96" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="372" dy="4.5">동전</tspan></text><ellipse cx="382" cy="196" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="382" y="196" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="382" dy="4.5">처치</tspan></text><ellipse cx="568" cy="196" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="568" y="196" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="568" dy="4.5">결과</tspan></text><path d="M374.59 121.87 L378.62 162.17" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M502.24 125.29 L544.85 171.1" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M408 196 L534 196" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="320" y="268" text-anchor="middle" class="sm bold ink">차이는 성질에서 처치로 들어가는 화살표 하나다</text>
</svg>