<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">성질이 처치를 정하는 경우와 동전이 처치를 정하는 경우</title><desc id="d">왼쪽에서는 대상의 성질에서 처치와 결과로 화살표가 둘 다 나가고, 오른쪽에서는 처치로 들어오는 화살표가 동전에서 오는 것 하나뿐이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
