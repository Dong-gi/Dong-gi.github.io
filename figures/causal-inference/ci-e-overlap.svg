<title id="t">처치를 받은 쪽과 받지 않은 쪽의 성향점수 분포를 겹쳐 그린 두 경우</title><desc id="d">왼쪽에서는 두 무리의 막대가 점수 전 구간에 걸쳐 나란히 서 있고, 오른쪽에서는 낮은 점수 쪽에 처치 막대가 거의 없고 높은 점수 쪽에 대조 막대가 거의 없다</desc>
