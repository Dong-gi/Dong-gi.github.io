<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">여러 도구가 답하는 자리가 전체 안에서 좁아진 모습</title><desc id="d">물으려던 대상 전체를 나타내는 큰 칸 안에 도구변수와 잘라내기와 회귀 불연속이 답하는 좁은 칸 셋이 들어 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="20" y="60" width="680" height="175" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="360" y="48" text-anchor="middle" class="sm bold ink">물으려던 대상 — 전체</text><rect x="45" y="95" width="195" height="115" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="142" y="122" text-anchor="middle" class="sm bold ink">도구변수가 답하는 자리</text><text x="142" y="150" text-anchor="middle" class="sm ink2">순응자</text><text x="142" y="176" text-anchor="middle" class="sm ink2">누구인지 자료로 가릴 수 없다</text><rect x="262" y="95" width="195" height="115" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="359" y="122" text-anchor="middle" class="sm bold ink">잘라내기 뒤 남는 자리</text><text x="359" y="150" text-anchor="middle" class="sm ink2">겹치는 구간</text><text x="359" y="176" text-anchor="middle" class="sm ink2">점수로만 적힌다</text><rect x="479" y="95" width="195" height="115" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="576" y="122" text-anchor="middle" class="sm bold ink">회귀 불연속의 자리</text><text x="576" y="150" text-anchor="middle" class="sm ink2">기준값 근처</text><text x="576" y="176" text-anchor="middle" class="sm ink2">멀리 있는 대상은 빠진다</text><text x="360" y="264" text-anchor="middle" class="sm bold ink">이름은 셋 다 다른데 답하는 자리가 좁아졌다는 점은 같다</text><text x="360" y="292" text-anchor="middle" class="sm bold ink">가정이 약해질수록 자리가 좁아진다</text>
</svg>