<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한 화분에서 갈래가 둘로 나뉘고 각 갈래 끝에 값이 하나씩 있다</title><desc id="d">왼쪽 화분에서 두 화살표가 나와 처치했을 때와 처치하지 않았을 때로 갈라진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<ellipse cx="100" cy="125" rx="46" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="100" y="125" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="100" dy="4.5">한 화분</tspan></text><ellipse cx="420" cy="62" rx="60" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="420" y="62" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="420" dy="4.5">처치했을 때</tspan></text><ellipse cx="420" cy="188" rx="72" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="420" y="188" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="420" dy="4.5">처치하지 않았을 때</tspan></text><path d="M145.13 116.11 L353.28 75.14" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M145.13 133.89 L341.51 172.55" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="258" y="76" text-anchor="middle" class="sm ink2">처치를 한다면</text><text x="258" y="187" text-anchor="middle" class="sm ink2">하지 않는다면</text><text x="310" y="232" text-anchor="middle" class="sm bold ink">두 값이 다 정해져 있고 실제로 보이는 것은 한쪽뿐이다</text>
</svg>