<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">예측하는 물음과 세상을 바꾸는 물음</title><desc id="d">왼쪽 칸은 지난 달 매출에서 다음 달 매출로, 오른쪽 칸은 가격을 내리는 일에서 매출로 화살표가 간다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="45" width="340" height="165" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="185" y="32" text-anchor="middle" class="sm bold ink">예측하는 물음</text><ellipse cx="95" cy="105" rx="62" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="95" y="105" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="95" dy="4.5">지난 달 매출</tspan></text><ellipse cx="275" cy="105" rx="62" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="275" y="105" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="275" dy="4.5">다음 달 매출</tspan></text><path d="M157 105 L205 105" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="185" y="178" text-anchor="middle" class="sm ink2">세상을 그대로 두고 본다</text><rect x="375" y="45" width="310" height="165" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="530" y="32" text-anchor="middle" class="sm bold ink">바꾸는 물음</text><ellipse cx="455" cy="105" rx="62" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="455" y="105" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="455" dy="4.5">가격을 내린다</tspan></text><ellipse cx="615" cy="105" rx="34" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="615" y="105" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="615" dy="4.5">매출</tspan></text><path d="M517 105 L573 105" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="530" y="178" text-anchor="middle" class="sm ink2">세상에 손을 대고 본다</text><text x="350" y="238" text-anchor="middle" class="sm bold ink">왼쪽은 자료만으로 답할 수 있고 오른쪽은 그렇지 않다</text>
</svg>