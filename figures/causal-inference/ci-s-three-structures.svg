<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">경로 위의 가운데 마디가 가질 수 있는 세 가지 모양</title><desc id="d">같은 삼각 배치를 세 번 그렸다. 왼쪽은 처치에서 가운데를 거쳐 결과로 화살표가 이어지고, 가운데는 가운데에서 처치와 결과로 화살표가 나가며, 오른쪽은 처치와 결과에서 가운데로 화살표가 들어온다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="12" y="46" width="226" height="196" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="125" y="34" text-anchor="middle" class="sm bold ink">사슬</text><ellipse cx="125" cy="100" rx="31.6" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="125" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="125" dy="4.5">가운데</tspan></text><ellipse cx="63" cy="190" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="63" y="190" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="63" dy="4.5">처치</tspan></text><ellipse cx="187" cy="190" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="187" y="190" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="187" dy="4.5">결과</tspan></text><path d="M77.75 168.59 L102.53 132.61" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M142.93 126.02 L167.71 162" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="125" y="232" text-anchor="middle" class="sm ink2">가운데가 영향을 나른다</text><rect x="247" y="46" width="226" height="196" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="360" y="34" text-anchor="middle" class="sm bold ink">갈림길</text><ellipse cx="360" cy="100" rx="31.6" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="360" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="360" dy="4.5">가운데</tspan></text><ellipse cx="298" cy="190" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="298" y="190" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="298" dy="4.5">처치</tspan></text><ellipse cx="422" cy="190" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="422" y="190" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="422" dy="4.5">결과</tspan></text><path d="M342.07 126.02 L317.29 162" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M377.93 126.02 L402.71 162" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="360" y="232" text-anchor="middle" class="sm ink2">가운데가 둘을 함께 움직인다</text><rect x="482" y="46" width="226" height="196" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="595" y="34" text-anchor="middle" class="sm bold ink">충돌부</text><ellipse cx="595" cy="100" rx="31.6" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="595" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="595" dy="4.5">가운데</tspan></text><ellipse cx="533" cy="190" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="533" y="190" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="533" dy="4.5">처치</tspan></text><ellipse cx="657" cy="190" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="657" y="190" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="657" dy="4.5">결과</tspan></text><path d="M547.75 168.59 L572.53 132.61" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M642.25 168.59 L617.47 132.61" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><text x="595" y="232" text-anchor="middle" class="sm ink2">둘이 가운데에서 부딪힌다</text><text x="360" y="258" text-anchor="middle" class="sm bold ink">다른 것은 가운데 마디를 드나드는 화살표의 방향뿐이다</text>
</svg>