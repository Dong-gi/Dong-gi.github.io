0" cy="50" rx="39" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="440" y="50" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="440" dy="4.5">집합 가</tspan></text><ellipse cx="440" cy="120" rx="39" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="440" y="120" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="440" dy="4.5">집합 나</tspan></text><ellipse cx="440" cy="200" rx="39" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="440" y="200" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="440" dy="4.5">집합 다</tspan></text><ellipse cx="440" cy="270" rx="39" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="440" y="270" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="440" dy="4.5">집합 라</tspan></text><text x="630" y="54" text-anchor="middle" class="sm ink2">값 하나</text><text x="630" y="124" text-anchor="middle" class="sm ink2">값 둘</text><text x="630" y="204" text-anchor="middle" class="sm ink2">값 셋</text><text x="630" y="274" text-anchor="middle" class="sm ink2">값 넷</text><text x="632" y="148" text-anchor="middle" class="sm ink2">이것만 보고되었다</text><text x="230" y="20" text-anchor="middle" class="sm ink2">결과를 보고 나서 고르면 어느 갈래든 고를 수 있다</text><text x="350" y="312" text-anchor="middle" class="sm bold ink">미리 정해 두면 갈래가 하나로 좁혀지고 고르지 않은 갈래도 함께 남는다</text>
