<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">그래프와 조정 집합을 고르는 갈림이 만드는 값들</title><desc id="d">같은 자료에서 그래프 둘, 조정 집합 넷으로 갈라져 값이 넷 나오고 그중 하나만 보고된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
