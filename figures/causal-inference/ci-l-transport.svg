<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">실험이 답한 자리와 그 답을 옮기려는 자리</title><desc id="d">두 칸이 나란히 있고 그 사이를 잇는 화살표에 새 가정이라는 딱지가 붙어 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="20" y="65" width="250" height="175" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="145" y="52" text-anchor="middle" class="sm bold ink">실험이 답한 자리</text><text x="145" y="105" text-anchor="middle" class="sm ink2">이 사람들</text><text x="145" y="140" text-anchor="middle" class="sm ink2">이 시기</text><text x="145" y="175" text-anchor="middle" class="sm ink2">이 규모</text><text x="145" y="210" text-anchor="middle" class="sm ink2">이 방식</text><rect x="450" y="65" width="250" height="175" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="575" y="52" text-anchor="middle" class="sm bold ink">옮기려는 자리</text><text x="575" y="105" text-anchor="middle" class="sm ink2">다른 사람들</text><text x="575" y="140" text-anchor="middle" class="sm ink2">다른 시기</text><text x="575" y="175" text-anchor="middle" class="sm ink2">다른 규모</text><text x="575" y="210" text-anchor="middle" class="sm ink2">다른 방식</text><path d="M276 152 L436 152" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="360" y="130" text-anchor="middle" class="sm ink2">새 가정</text><text x="360" y="270" text-anchor="middle" class="sm bold ink">가운데 화살표를 놓아 주는 것은 자료가 아니라 새 가정이다</text><text x="360" y="296" text-anchor="middle" class="sm bold ink">실험이 아무리 잘되어도 그 화살표는 실험 안에 없다</text>
</svg>