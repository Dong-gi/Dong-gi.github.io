<rect x="15" y="62" width="215" height="190" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="122" y="48" text-anchor="middle" class="sm bold ink">처치를 끈다</text><ellipse cx="122" cy="118" rx="44" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="122" y="118" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="122" dy="4.5">처치 끔</tspan></text><ellipse cx="122" cy="196" rx="75" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="122" y="196" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="122" dy="4.5">시간은 껐을 때 값</tspan></text><text x="122" y="240" text-anchor="middle" class="sm ink2">자료에서 볼 수 있다</text><rect x="243" y="62" width="215" height="190" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="350" y="48" text-anchor="middle" class="sm bold ink">처치를 켠다</text><ellipse cx="350" cy="118" rx="44" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="350" y="118" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="350" dy="4.5">처치 켬</tspan></text><ellipse cx="350" cy="196" rx="75" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="350" y="196" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="350" dy="4.5">시간은 켰을 때 값</tspan></text><text x="350" y="240" text-anchor="middle" class="sm ink2">자료에서 볼 수 있다</text><rect x="471" y="62" width="215" height="190" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="578" y="48" text-anchor="middle" class="sm bold ink">엇갈린 조합</text><ellipse cx="578" cy="118" rx="44" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="578" y="118" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="578" dy="4.5">처치 켬</tspan></text><ellipse cx="578" cy="196" rx="75" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="578" y="196" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x=