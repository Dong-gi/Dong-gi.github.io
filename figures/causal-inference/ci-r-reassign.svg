<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">같은 화분 넷에서 배정만 바꾼 두 경우의 값</title><desc id="d">왼쪽은 가와 나에 처치했을 때, 오른쪽은 가와 다에 처치했을 때의 관측 평균과 순진한 비교와 선택 편향</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="170" y="40" text-anchor="middle" class="sm bold ink">가와 나에 처치</text><rect x="30" y="52" width="280" height="162" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="100" y="84" text-anchor="middle" class="sm ink2">처치군 관측</text><text x="230" y="84" text-anchor="middle" class="sm bold ink">9 와 8</text><text x="100" y="116" text-anchor="middle" class="sm ink2">대조군 관측</text><text x="230" y="116" text-anchor="middle" class="sm bold ink">4 와 4</text><text x="100" y="154" text-anchor="middle" class="sm ink2">순진한 비교</text><text x="230" y="154" text-anchor="middle" class="sm bold ink">4.5</text><text x="100" y="186" text-anchor="middle" class="sm ink2">선택 편향</text><text x="230" y="186" text-anchor="middle" class="sm bold ink">2</text><text x="490" y="40" text-anchor="middle" class="sm bold ink">가와 다에 처치</text><rect x="350" y="52" width="280" height="162" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="420" y="84" text-anchor="middle" class="sm ink2">처치군 관측</text><text x="550" y="84" text-anchor="middle" class="sm bold ink">9 와 5</text><text x="420" y="116" text-anchor="middle" class="sm ink2">대조군 관측</text><text x="550" y="116" text-anchor="middle" class="sm bold ink">6 과 4</text><text x="420" y="154" text-anchor="middle" class="sm ink2">순진한 비교</text><text x="550" y="154" text-anchor="middle" class="sm bold ink">2</text><text x="420" y="186" text-anchor="middle" class="sm ink2">선택 편향</text><text x="550" y="186" text-anchor="middle" class="sm bold ink">0</text><text x="330" y="240" text-anchor="middle" class="sm bold ink">화분도 잠재결과도 그대로다. 배정만 바뀌었다</text><text x="330" y="260" text-anchor="middle" class="sm bold ink">평균처치효과는 두 경우 다 2 다</text>
</svg>