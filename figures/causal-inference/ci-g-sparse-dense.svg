<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">마디가 넷인 그래프에 화살표를 넷 그린 경우와 여섯 다 그린 경우</title><desc id="d">두 칸 모두 갑과 을이 위에, 처치와 결과가 아래에 놓여 있다. 왼쪽 칸에는 화살표가 넷이고 오른쪽 칸에는 그릴 수 있는 자리 여섯이 모두 화살표로 채워져 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="50" width="320" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="38" text-anchor="middle" class="sm bold ink">성긴 그래프 — 화살표 넷</text><ellipse cx="100" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="100" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="100" dy="4.5">갑</tspan></text><ellipse cx="250" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="250" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="250" dy="4.5">을</tspan></text><ellipse cx="100" cy="200" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="100" y="200" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="100" dy="4.5">처치</tspan></text><ellipse cx="250" cy="200" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="250" y="200" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="250" dy="4.5">결과</tspan></text><path d="M100 126 L100 166" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M121.63 114.42 L221.71 181.14" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M250 126 L250 166" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M126 200 L216 200" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="175" y="268" text-anchor="middle" class="sm ink2">그리지 않은 자리가 둘 남아 있다</text><text x="175" y="288" text-anchor="middle" class="sm ink2">그 둘은 없다고 주장하는 중이다</text><rect x="365" y="50" width="320" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="525" y="38" text-anchor="middle" class="sm bold ink">빽빽한 그래프 — 화살표 여섯</text><ellipse cx="450" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="450" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="450" dy="4.5">갑</tspan></text><ellipse cx="600" cy="100" rx="26" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="600" y="100" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="600" dy="4.5">을</tspan></text><ellipse cx="450" cy="200" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="450" y="200" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="450" dy="4.5">처치</tspan></text><ellipse cx="600" cy="200" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="600" y="200" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="600" dy="4.5">결과</tspan></text><path d="M450 126 L450 166" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M471.63 114.42 L571.71 181.14" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M600 126 L600 166" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M476 200 L566 200" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M476 100 L566 100" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M578.37 114.42 L478.29 181.14" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="525" y="268" text-anchor="middle" class="sm ink2">그리지 않은 자리가 하나도 없다</text><text x="525" y="288" text-anchor="middle" class="sm ink2">아무것도 없다고 주장하지 않는다</text><text x="350" y="318" text-anchor="middle" class="sm bold ink">성길수록 강한 가정이다. 빽빽한 그래프는 거의 아무 말도 하지 않는다</text>
</svg>