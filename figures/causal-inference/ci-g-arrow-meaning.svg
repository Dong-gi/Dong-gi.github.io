<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">화살표를 그린 경우와 그리지 않은 경우</title><desc id="d">왼쪽 칸에는 처치에서 결과로 화살표가 하나 있고, 오른쪽 칸에는 같은 두 마디가 있는데 그 사이에 아무 화살표도 없다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="15" y="50" width="320" height="150" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="175" y="38" text-anchor="middle" class="sm bold ink">화살표를 그렸다</text><ellipse cx="95" cy="110" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="95" y="110" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="95" dy="4.5">처치</tspan></text><ellipse cx="255" cy="110" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="255" y="110" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="255" dy="4.5">결과</tspan></text><path d="M121 110 L221 110" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><text x="175" y="165" text-anchor="middle" class="sm ink2">처치를 바꾸면 결과가 바뀔 수 있다</text><text x="175" y="187" text-anchor="middle" class="sm ink2">있을 수 있다는 말이다</text><rect x="365" y="50" width="320" height="150" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><text x="525" y="38" text-anchor="middle" class="sm bold ink">화살표를 그리지 않았다</text><ellipse cx="445" cy="110" rx="26" ry="26" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text x="445" y="110" text-anchor="middle" fill="var(--s1)" style="font-size:13px"><tspan x="445" dy="4.5">처치</tspan></text><ellipse cx="605" cy="110" rx="26" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="605" y="110" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="605" dy="4.5">결과</tspan></text><text x="525" y="114" text-anchor="middle" class="sm ink2">아무것도 없다</text><text x="525" y="165" text-anchor="middle" class="sm ink2">처치를 바꿔도 결과는 그대로다</text><text x="525" y="187" text-anchor="middle" class="sm ink2">없다고 못 박은 말이다</text><text x="350" y="238" text-anchor="middle" class="sm bold ink">안 그린 자리가 더 센 주장을 한다</text>
</svg>