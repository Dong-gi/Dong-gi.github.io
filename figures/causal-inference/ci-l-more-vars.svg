<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">넣으면 예측은 좋아지고 조정은 나빠지는 마디</title><desc id="d">처치와 결과가 모두 앱 열기로 화살표를 보내고 앱 열기는 통제했다는 뜻의 상자에 둘러싸여 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
