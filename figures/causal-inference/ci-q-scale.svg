<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">값으로 나란한 반사실과 비율로 나란한 반사실</title><desc id="d">대조집단 선 하나와 처치집단의 출발점 하나가 있고, 그 출발점에서 점선 둘이 서로 다른 높이로 갈라져 나간다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="330" y="28" text-anchor="middle" class="sm bold ink">처치가 없었다면 어디에 있었을까</text><rect x="25" y="44" width="600" height="196" rx="6" fill="none" stroke="var(--grid)" stroke-width="1"/><path d="M60 206 L610 206" stroke="var(--ink2)" stroke-width="1.2" fill="none"/><text x="62" y="66" text-anchor="start" class="sm ink2">결과</text><path d="M160 58 L160 206" stroke="var(--grid)" stroke-width="1" stroke-dasharray="4 3" fill="none"/><path d="M440 58 L440 206" stroke="var(--grid)" stroke-width="1" stroke-dasharray="4 3" fill="none"/><text x="160" y="224" text-anchor="middle" class="sm ink2">바꾸기 전</text><text x="440" y="224" text-anchor="middle" class="sm ink2">바꾼 뒤</text><path d="M160 196 L440 178" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round"/><circle cx="160" cy="196" r="4.5" fill="var(--s2)"/><circle cx="440" cy="178" r="4.5" fill="var(--s2)"/><text x="148" y="200" text-anchor="end" class="sm ink2">대조 100</text><text x="456" y="182" text-anchor="start" class="sm ink2">대조 120</text><circle cx="160" cy="106" r="4.5" fill="var(--s1)"/><text x="148" y="110" text-anchor="end" class="sm ink2">처치 200</text><path d="M160 106 L440 88" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="440" cy="88" r="4.5" fill="var(--s1)"/><text x="456" y="92" text-anchor="start" class="sm ink2">값으로 나란하면 220</text><path d="M160 106 L440 70" fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 4"/><circle cx="440" cy="70" r="4.5" fill="var(--s3)"/><text x="456" y="74" text-anchor="start" class="sm ink2">비율로 나란하면 240</text><text x="330" y="268" text-anchor="middle" class="sm bold ink">대조집단은 값으로 20 늘었고 비율로는 1.2 배가 되었다</text><text x="330" y="292" text-anchor="middle" class="sm bold ink">어느 쪽을 나란하다고 부를지에 따라 점선이 다른 곳으로 간다</text>
</svg>