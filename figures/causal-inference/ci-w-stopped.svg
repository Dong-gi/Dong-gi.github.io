<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="700" height="310" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">다른 문서 셋이 멈춘 자리와 이 장이 이어받는 물음</title><desc id="d">확률 12장, 이산수학, 심리학 4장에서 각각 화살표가 나와 이 문서 3장으로 모인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="120" y="34" text-anchor="middle" class="sm bold ink">여기까지 왔다</text><text x="560" y="34" text-anchor="middle" class="sm bold ink">여기서 시작한다</text><ellipse cx="120" cy="80" rx="62" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="120" y="80" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="120" dy="4.5">확률 12장</tspan></text><text x="120" y="122" text-anchor="middle" class="sm ink2">상관과 인과는 다르다</text><ellipse cx="120" cy="168" rx="62" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="120" y="168" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="120" dy="4.5">이산수학</tspan></text><text x="120" y="210" text-anchor="middle" class="sm ink2">숫자가 왜 뒤집히는가</text><ellipse cx="120" cy="252" rx="62" ry="26" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text x="120" y="252" text-anchor="middle" fill="var(--ink)" style="font-size:13px"><tspan x="120" dy="4.5">심리학 4장</tspan></text><text x="120" y="294" text-anchor="middle" class="sm ink2">어떤 설계를 쓰는가</text><ellipse cx="560" cy="168" rx="66" ry="26" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text x="560" y="168" text-anchor="middle" fill="var(--s2)" style="font-size:13px"><tspan x="560" dy="4.5">이 문서 3장</tspan></text><text x="560" y="212" text-anchor="middle" class="sm ink2">그러면 무엇을 봐야 하는가</text><path d="M180.8 92.16 L487.44 153.49" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M182 168 L486 168" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M180.9 240.37 L487.31 181.88" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)"/>
</svg>