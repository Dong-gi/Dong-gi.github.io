.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path class="ax" marker-end="url(#ark)" d="M35.2 172 H497.2"/><path class="ax" stroke-width="1" d="M52 172 V165"/><text class="ink2 sm" x="52" y="192" text-anchor="middle">0</text><path class="ax" stroke-width="1" d="M94 172 V165"/><path class="ax" stroke-width="1" d="M136 172 V165"/><text class="ink2 sm" x="136" y="192" text-anchor="middle">2</text><path class="ax" stroke-width="1" d="M178 172 V165"/><path class="ax" stroke-width="1" d="M220 172 V165"/><text class="ink2 sm" x="220" y="192" text-anchor="middle">4</text><path class="ax" stroke-width="1" d="M262 172 V165"/><path class="ax" stroke-width="1" d="M304 172 V165"/><text class="ink2 sm" x="304" y="192" text-anchor="middle">6</text><path class="ax" stroke-width="1" d="M346 172 V165"/><path class="ax" stroke-width="1" d="M388 172 V165"/><text class="ink2 sm" x="388" y="192" text-anchor="middle">8</text><path class="ax" stroke-width="1" d="M430 172 V165"/><path class="ax" stroke-width="1" d="M472 172 V165"/><text class="ink2 sm" x="472" y="192" text-anchor="middle">10</text><text class="ink2 sm" x="501.4" y="177" text-anchor="start">x (m)</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M136 140 L388 140"/><text class="ink" x="262" y="132" text-anchor="middle">① 앞으로 6 m</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M388 100 L262 100"/><text class="ink" x="325" y="92" text-anchor="middle">② 뒤로 3 m</text><circle class="f3" cx="136" cy="172" r="4.5"/><circle class="f3" cx="262" cy="172" r="4.5"/><text class="ink2 sm" x="136" y="214" text-anchor="middle">출발</text><text class="ink2 sm" x="262" y="214" text-anchor="middle">도착</text><text class="ink bold" x="26" y="30" text-anchor="start">이동거리 = 6 m + 3 m = 9 m</text><text class="ink2 sm" x="26" y="48" text-anchor="start">실제로 지나온 길의 길이</text><text class="ink bold" x="310" y="30" text-anchor="start">변위 = 5 m − 2 m = +3 m</text><text class="ink2 sm" x="310" y="48" text-anchor="start">끝 위치 − 처음 위치</text><text class="ink2 sm" x="546" y="246" text-anchor="end">되돌아오면 이동거리는 늘지만 변위는 줄어든다</text>
</svg>