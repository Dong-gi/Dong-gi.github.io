<text class="ink bold" x="16" y="26" text-anchor="start">질량은 에너지의 한 형태다</text><rect x="86" y="82" width="56" height="168" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><text class="ink2 sm" x="114" y="270" text-anchor="middle">따로 있을 때</text><text class="ink2 sm" x="114" y="286" text-anchor="middle">부분들의 질량 합</text><rect x="190" y="110" width="56" height="140" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><text class="ink2 sm" x="218" y="270" text-anchor="middle">결합한 뒤</text><text class="ink2 sm" x="218" y="286" text-anchor="middle">전체의 질량</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round" d="M86 82 L268 82"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M272 96 L272 82"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M272 96 L272 110"/><text class="ink bold" x="280" y="100" text-anchor="start">Δm</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M280 120 L280 158"/><text class="ink2 sm" x="292" y="152" text-anchor="start">Δm c² 만큼</text><text class="ink2 sm" x="292" y="168" text-anchor="start">에너지로 나갔다</text><text class="ink2 sm" x="16" y="306" text-anchor="start">차이 Δm 은 실제보다 크게 그렸다</text><text class="ink bold" x="16" y="328" text-anchor="start">E = γmc²,  E<tspan baseline-shift="-22%" font-size="76%">0</tspan> = mc²,  K = (γ − 1)mc²</text><path class="gr" d="M396 246 V66"/><path class="gr" d="M499 246 V66"/><path class="gr" d="M602 246 V66"/><path class="gr" d="M396 246 H602"/><path class="gr" d="M396 201 H602"/><path class="gr" d="M396 156 H602"/><path class="gr" d="M396 111 H602"/><path class="gr" d="M396 66 H602"/><path class="ax" marker-end="url(#ark)" d="M396 246 H612"/><path class="ax" marker-end="url(#ark)" d="M396 246 V56"/><text class="sm ink2" x="49