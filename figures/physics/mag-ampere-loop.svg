<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">앙페르 법칙</title><desc id="d">고리가 감싼 전류가 합을 정한다</desc>
<style>
