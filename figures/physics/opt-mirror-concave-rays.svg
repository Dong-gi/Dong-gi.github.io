<text class="ink bold" x="16" y="26" text-anchor="start">오목거울 — 초점 바깥의 물체는 거꾸로 선 실상을 만든다</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round" d="M154.4 158 L526 158"/><path d="M477.49 254 L479.3 250.27 L481.04 246.5 L482.7 242.71 L484.29 238.88 L485.8 235.02 L487.24 231.13 L488.61 227.22 L489.9 223.28 L491.11 219.32 L492.25 215.33 L493.31 211.33 L494.3 207.3 L495.21 203.26 L496.04 199.2 L496.79 195.12 L497.46 191.03 L498.05 186.93 L498.57 182.82 L499.01 178.69 L499.36 174.56 L499.64 170.43 L499.84 166.29 L499.96 162.14 L500 158 L499.96 153.86 L499.84 149.71 L499.64 145.57 L499.36 141.44 L499.01 137.31 L498.57 133.18 L498.05 129.07 L497.46 124.97 L496.79 120.88 L496.04 116.8 L495.21 112.74 L494.3 108.7 L493.31 104.67 L492.25 100.67 L491.11 96.68 L489.9 92.72 L488.61 88.78 L487.24 84.87 L485.8 80.98 L484.29 77.12 L482.7 73.29 L481.04 69.5 L479.3 65.73 L477.49 62" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="2.4" stroke-linejoin="round"/><circle cx="392" cy="158" r="3.2" fill="var(--ink2)"/><text class="ink2 sm" x="392" y="178" text-anchor="middle">F</text><circle cx="284" cy="158" r="3.2" fill="var(--ink2)"/><text class="ink2 sm" x="284" y="178" text-anchor="middle">C</text><path fill="none" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar3)" d="M230 158 L230 104"/><text class="ink2 sm" x="230" y="96" text-anchor="middle">물체</text><path fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)" d="M230 104 L392 104"/><path fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" d="M392 104 L500 104"/><path fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)" d="M500 104 L353.12 165.78"/><path fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" d="M353.12 165.78 L255.2 206.96"/><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M230 104 L392 158"/><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" d="M392 158 L500 194"/><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M500 194 L353.12 194"/><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" d="M353.12 194 L255.2 194"/><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M230 104 L392 136.4"/><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" d="M392 136.4 L500 158"/><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M500 158 L353.12 187.38"/><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" d="M353.12 187.38 L255.2 206.96"/><path fill="none" stroke="var(--ink2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ark)" d="M320 158 L320 194"/><text class="ink bold" x="328" y="208" text-anchor="start">상</text><text class="ink bold" x="16" y="252" text-anchor="start">f = R/2 = 2, p = 5 → q = 3.33, m = −0.67</text><text class="ink2 sm" x="16" y="274" text-anchor="start">상은 F 와 C 사이에 거꾸로, 물체보다 작게 맺힌다. 스크린을 놓으면 실제로 비친다</text><text class="ink2 sm" x="16" y="296" text-anchor="start">① 축에 나란히 들어오면 초점을 지나 반사하고</text><text class="ink2 sm" x="16" y="316" text-anchor="start">② 초점을 지나 들어오면 축에 나란히 반사한다. ③ 꼭짓점에서는 광축 기준으로 대칭이다</text>
