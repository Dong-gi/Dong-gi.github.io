.02 L320.92 177.63 L323.24 173.12 L325.57 168.49 L327.89 163.73 L330.21 158.86 L332.53 153.87 L334.86 148.75 L337.18 143.52 L339.5 138.16 L341.82 132.69 L344.14 127.09 L346.47 121.38 L348.79 115.54 L351.11 109.58 L353.43 103.51 L355.76 97.31 L358.08 90.99 L360.4 84.55 L362.72 78 L365.04 71.32 L367.37 64.52 L369.69 57.6 L372.01 50.56 L374.33 43.4"/><path class="cv s2" stroke-dasharray="6 4" d="M73.67 93.33 L396.33 93.33"/><text class="ink" x="392.33" y="83.33" text-anchor="end">총 에너지 E = ½kA²</text><text class="ink" x="88.33" y="140" text-anchor="start">U = ½kx²</text><path class="gr" stroke-dasharray="4 3" d="M302.22 260 L302.22 93.33"/><path class="s3" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)" d="M302.22 209.58 L302.22 93.33"/><path class="s3" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)" d="M302.22 93.33 L302.22 209.58"/><text class="ink" x="310.22" y="151.46" text-anchor="start">K</text><text class="ink" x="310.22" y="234.79" text-anchor="start">U</text><circle class="f2" cx="357.22" cy="93.33" r="3.5"/><circle class="f2" cx="112.78" cy="93.33" r="3.5"/><text class="ink2 sm" x="363.22" y="109.33" text-anchor="start">반환점</text><text class="ink2 sm" x="106.78" y="109.33" text-anchor="end">반환점</text><text class="ink2 sm" x="235" y="252" text-anchor="middle">K 가 최대</text><text class="ink" x="546" y="100" text-anchor="end">어디서나 K + U = E</text><text class="ink2 sm" x="546" y="124" text-anchor="end">x = ±A 에서 K = 0 (멈춘다)</text><text class="ink2 sm" x="546" y="146" text-anchor="end">x = 0 에서 U = 0 (가장 빠르다)</text><text class="ink2 sm" x="546" y="168" text-anchor="end">U 가 x² 이므로 변위가 반이면</text><text class="ink2 sm" x="546" y="186" text-anchor="end">U 는 4분의 1 밖에 안 된다</text><text class="ink2 sm" x="16" y="310" text-anchor="start">가로선(총 에너지)과 포물선(위치에너지) 사이의 간격이 운동에너지다</text>
</svg>