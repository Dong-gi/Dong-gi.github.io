<text class="ink bold" x="320" y="36" text-anchor="middle">점선(등전위면)과 실선(전기력선)은 어디서나 직각으로 만난다</text><text class="ink bold" x="155" y="70" text-anchor="middle">점전하 둘레</text><circle cx="155" cy="190" r="34" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="155" cy="190" r="60" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="155" cy="190" r="86" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5" stroke-dasharray="5 4"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M171 190 L259 190"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M166.31 201.31 L228.54 263.54"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M155 206 L155 294"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M143.69 201.31 L81.46 263.54"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M139 190 L51 190"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M143.69 178.69 L81.46 116.46"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M155 174 L155 86"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M166.31 178.69 L228.54 116.46"/><circle cx="155" cy="190" r="14" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold" x="155" y="195" text-anchor="middle">+</text><text class="ink2 sm" x="155" y="320" text-anchor="middle">등전위면은 동심원, 전기력선은 반지름 방향</text><path d="M380 118 L590 118" fill="none" stroke="var(--s2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 246 L590 246" fill="none" stroke="var(--s1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 150 L590 150" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 sm" x="596" y="154" text-anchor="start">V<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><path d="M380 182 L590 182" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 sm" x="596" y="186" text-anchor="start">V<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><path d="M380 214 L590 214" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 sm" x="596" y="218" text-anchor="start">V<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M396 126 L396 238"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M425.67 126 L425.67 238"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M455.33 126 L455.33 238"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M485 126 L485 238"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M514.67 126 L514.67 238"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M544.33 126 L544.33 238"/><path class="s1" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M574 126 L574 238"/><text class="ink bold" x="485" y="70" text-anchor="middle">평행판 사이</text><text class="ink sm" x="485" y="282" text-anchor="middle">등전위면이 판과 나란하고 간격이 고르다</text><text class="ink2 sm" x="485" y="320" text-anchor="middle">같은 거리마다 전위가 같은 폭으로 떨어진다 → V = E d</text>
