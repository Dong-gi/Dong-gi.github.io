<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">도플러 효과</title><desc id="d">움직이는 파원이 만드는 촘촘한 앞쪽 파면</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="24" text-anchor="start">파원이 움직이면 앞쪽 파면이 촘촘해진다</text><path class="gr" stroke-dasharray="5 4" d="M40 196 H580"/><circle cx="234" cy="196" r="165" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-opacity="0.85"/><circle class="f1" cx="234" cy="196" r="2.5"/><circle cx="266" cy="196" r="110" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-opacity="0.85"/><circle class="f1" cx="266" cy="196" r="2.5"/><circle cx="298" cy="196" r="55" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-opacity="0.85"/><circle class="f1" cx="298" cy="196" r="2.5"/><circle class="f2" cx="330" cy="196" r="7"/><path class="s2" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M330 196 L382 196"/><text class="ink" x="340" y="178" text-anchor="start">파원  v<tspan baseline-shift="-22%" font-size="76%">s</tspan></text><path class="s3" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)" d="M375 222 L360 222"/><path class="s3" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)" d="M375 222 L390 222"/><text class="ink" x="444" y="226" text-anchor="start">짧아진 파장</text><path class="s3" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)" d="M165 222 L220 222"/><path class="s3" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)" d="M165 222 L110 222"/><text class="ink" x="165" y="242" text-anchor="middle">길어진 파장</text><text class="ink2 sm" x="552" y="182" text-anchor="end">앞쪽 관측자</text><text class="ink2 sm" x="552" y="200" text-anchor="end">높은 소리</text><text class="ink2 sm" x="46" y="182" text-anchor="start">뒤쪽 관측자</text><text class="ink2 sm" x="46" y="200" text-anchor="start">낮은 소리</text><circle class="f3" cx="566" cy="196" r="5"/><circle class="f3" cx="40" cy="196" r="5"/><text class="ink2 sm" x="16" y="352" text-anchor="start">점은 그 파면이 만들어질 때의 파원 위치다. 파면 자체는 매질을 기준으로 사방으로 같은 속력으로 퍼진다</text><text class="ink2 sm" x="16" y="370" text-anchor="start">파원이 뒤따라오므로 앞쪽에서는 간격이 좁아지고 뒤쪽에서는 넓어진다. 속력 v 는 그대로다</text>
</svg>