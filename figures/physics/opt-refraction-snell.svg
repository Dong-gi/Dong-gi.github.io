<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">굴절과 스넬 법칙</title><desc id="d">파장이 줄면서 꺾이는 파면</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="26" text-anchor="start">굴절 — 느린 매질에서 파장이 줄고, 그 때문에 방향이 꺾인다</text><rect x="0" y="208" width="640" height="162" fill="var(--s1)" fill-opacity="0.08"/><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" d="M24 208 L520 208"/><path fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" d="M286 92 L286 316"/><text class="ink2 sm" x="293" y="96" text-anchor="start">법선</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" d="M286 208 L327.01 166.99"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" d="M286 208 L234.85 235.34"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" d="M235.09 208 L276.1 166.99"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" d="M235.09 208 L183.94 235.34"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" d="M184.18 208 L225.19 166.99"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" d="M184.18 208 L133.03 235.34"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" d="M133.26 208 L174.28 166.99"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" d="M133.26 208 L82.11 235.34"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M179.93 101.93 L238.27 160.27"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" d="M238.27 160.27 L286 208"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M286 208 L320.22 272.03"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" d="M320.22 272.03 L348.23 324.41"/><path fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-dasharray="3 4" stroke-linecap="round" d="M286 208 L353.88 140.12"/><text class="ink2 sm" x="360.71" y="140.12" text-anchor="start">약하게 반사</text><path class="gr" d="M286 154 A54 54 0 0 0 247.82 169.82"/><text class="sm ink2" x="259.98" y="149.18" text-anchor="middle">θ<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><path class="gr" d="M286 266 A58 58 0 0 0 313.23 259.21"/><text class="sm ink2" x="303.42" y="281.86" text-anchor="middle">θ<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="24" y="78" text-anchor="start">n<tspan baseline-shift="-22%" font-size="76%">1</tspan> = 1.00 — 빠르다, 파장이 길다</text><text class="ink2 sm" x="24" y="326" text-anchor="start">n<tspan baseline-shift="-22%" font-size="76%">2</tspan> = 1.50 — 느리다, 파장이 짧다</text><text class="ink bold" x="540" y="104" text-anchor="start">n = c / v</text><text class="ink" x="540" y="132" text-anchor="start">n<tspan baseline-shift="-22%" font-size="76%">1</tspan> sin θ<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink" x="540" y="152" text-anchor="start">= n<tspan baseline-shift="-22%" font-size="76%">2</tspan> sin θ<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="540" y="186" text-anchor="start">진동수 f 는</text><text class="ink2 sm" x="540" y="202" text-anchor="start">그대로다</text><text class="ink2 sm" x="540" y="226" text-anchor="start">λ = v / f 이므로</text><text class="ink2 sm" x="540" y="242" text-anchor="start">λ<tspan baseline-shift="-22%" font-size="76%">2</tspan> = λ<tspan baseline-shift="-22%" font-size="76%">1</tspan> / n<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="24" y="354" text-anchor="start">파면이 경계에 비스듬히 닿으면 먼저 닿은 쪽이 먼저 느려져 대열 전체가 꺾인다</text>
</svg>