<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">원운동의 사영</title><desc id="d">원 위 점의 그림자가 단진동을 한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="26" text-anchor="start">원운동을 옆에서 보면 단진동이다</text><circle cx="180" cy="175" r="110" fill="none" stroke="var(--grid)" stroke-width="1.5" stroke-dasharray="5 4"/><path class="ax" stroke-width="2.5" d="M70 175 H290"/><text class="ink2 sm" x="64" y="179" text-anchor="end">−A</text><text class="ink2 sm" x="296" y="179" text-anchor="start">+A</text><path class="gr" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M180 175 L261.75 101.4"/><path class="gr" d="M220 175 A40 40 0 0 0 209.73 148.23"/><text class="sm ink2" x="230.41" y="159.65" text-anchor="middle">ωt</text><path class="gr" stroke-dasharray="4 3" d="M261.75 101.4 L261.75 175"/><circle class="f1" cx="261.75" cy="101.4" r="6"/><text class="ink" x="271.75" y="93.4" text-anchor="start">P</text><circle class="f2" cx="261.75" cy="175" r="6"/><text class="ink sm" x="269.75" y="195" text-anchor="start">Q (그림자)</text><path class="s3" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M261.75 101.4 L203.78 153.59"/><text class="ink2 sm" x="273.75" y="123.4" text-anchor="start">가속도 ω²A</text><path class="s3" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M261.75 175 L203.78 175"/><text class="ink2 sm" x="199.78" y="199" text-anchor="middle">가로 성분</text><path class="s1" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M180 311 L220 311"/><text class="ink2 sm" x="228" y="315" text-anchor="start">일정한 각속도 ω</text><text class="ink2 sm" x="340" y="70" text-anchor="start">P 는 반지름 A 인 원을 일정한 빠르기로 돈다.</text><text class="ink2 sm" x="340" y="91" text-anchor="start">Q 는 P 의 그림자. 지름 위를 왕복한다.</text><text class="ink2 sm" x="340" y="112" text-anchor="start"></text><text class="ink2 sm" x="340" y="133" text-anchor="start">P 의 가속도는 늘 중심을 향하고 크기는 ω²A.</text><text class="ink2 sm" x="340" y="154" text-anchor="start">Q 의 가속도는 그 가로 성분이므로</text><text class="ink" x="340" y="175" text-anchor="start">    a = −ω²x   (변위에 비례, 방향은 반대)</text><text class="ink2 sm" x="340" y="196" text-anchor="start"></text><text class="ink2 sm" x="340" y="217" text-anchor="start">힘으로 쓰면 F = ma = −mω²x.</text><text class="ink2 sm" x="340" y="238" text-anchor="start">용수철의 F = −kx 와 견주면 k = mω²,</text><text class="ink" x="340" y="259" text-anchor="start">따라서 ω = √(k/m).</text>
</svg>