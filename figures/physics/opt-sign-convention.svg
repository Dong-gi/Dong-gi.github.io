<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" width="640" height="392" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">부호 규약</title><desc id="d">빛이 실제로 지나가는 쪽이 +</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="26" text-anchor="start">부호 규약 — 빛이 실제로 지나가는 쪽을 +로 잡는다</text><text class="ink bold" x="16" y="58" text-anchor="start">렌즈</text><path fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)" d="M66 78 L150 78"/><text class="ink2 sm" x="158" y="82" text-anchor="start">빛이 이쪽에서 온다</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round" d="M60 130 L590 130"/><path d="M300 84 Q315 130 300 176 Q285 130 300 84 Z" fill="var(--s1)" fill-opacity="0.13" stroke="var(--s1)" stroke-width="1.8"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M235 174 L170 174"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M235 174 L300 174"/><text class="ink2 sm" x="235" y="168" text-anchor="middle">p &gt; 0 (물체)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M385 174 L300 174"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M385 174 L470 174"/><text class="ink2 sm" x="385" y="168" text-anchor="middle">q &gt; 0 : 실상</text><text class="ink2 sm" x="170" y="204" text-anchor="start">q &lt; 0 : 허상 (물체 쪽)</text><text class="ink2 sm" x="484" y="96" text-anchor="start">f &gt; 0 볼록(모으는 렌즈)</text><text class="ink2 sm" x="484" y="114" text-anchor="start">f &lt; 0 오목(퍼뜨리는 렌즈)</text><text class="ink bold" x="16" y="240" text-anchor="start">거울</text><path fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)" d="M66 262 L150 262"/><text class="ink2 sm" x="60" y="242" text-anchor="start">빛이 이쪽에서 와서 되돌아간다</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round" d="M60 306 L590 306"/><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" d="M300 258 L300 340"/><path fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" d="M300 258 L308 250"/><path fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" d="M300 268 L308 260"/><path fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" d="M300 278 L308 270"/><path fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" d="M300 288 L308 280"/><path fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" d="M300 298 L308 290"/><path fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" d="M300 308 L308 300"/><path fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" d="M300 318 L308 310"/><path fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" d="M300 328 L308 320"/><path fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" d="M300 338 L308 330"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M235 352 L170 352"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M235 352 L300 352"/><text class="ink2 sm" x="235" y="346" text-anchor="middle">p &gt; 0, q &gt; 0 : 실상 (거울 앞)</text><text class="ink2 sm" x="322" y="328" text-anchor="start">q &lt; 0 : 허상 (거울 뒤)</text><text class="ink2 sm" x="484" y="272" text-anchor="start">f &gt; 0 오목거울(모으는 거울)</text><text class="ink2 sm" x="484" y="290" text-anchor="start">f &lt; 0 볼록거울(퍼뜨리는 거울)</text><text class="ink2 sm" x="16" y="382" text-anchor="start">렌즈는 빛이 통과해 나가는 뒤쪽이 +, 거울은 빛이 되돌아 나오는 앞쪽이 +다</text>
</svg>