<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">보어 모형과 에너지 준위</title><desc id="d">n² 궤도와 에너지 사다리</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="26" text-anchor="start">보어 모형 — 정해진 궤도, 정해진 에너지</text><circle cx="160" cy="210" r="10.6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="4 4"/><text class="ink2 sm" x="186" y="236" text-anchor="start">n = 1</text><circle cx="160" cy="210" r="42.4" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="4 4"/><text class="ink2 sm" x="196.1" y="175.9" text-anchor="start">n = 2</text><circle cx="160" cy="210" r="95.4" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="4 4"/><text class="ink2 sm" x="233.73" y="138.27" text-anchor="start">n = 3</text><circle cx="160" cy="210" r="5" fill="var(--s2)"/><circle cx="170.6" cy="210" r="3.6" fill="var(--s1)"/><text class="ink bold" x="160" y="340" text-anchor="middle">r<tspan baseline-shift="-22%" font-size="76%">n</tspan> = n² a<tspan baseline-shift="-22%" font-size="76%">0</tspan>,  a<tspan baseline-shift="-22%" font-size="76%">0</tspan> = 52.9 pm</text><text class="ink2 sm" x="160" y="360" text-anchor="middle">반지름은 n² 에 비례해 빠르게 커진다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" d="M344 76 L600 76"/><text class="ink2 sm" x="604" y="80" text-anchor="start">E = 0 (이온화)</text><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" d="M360 322 L560 322"/><text class="ink2 sm" x="352" y="326" text-anchor="end">n = 1</text><text class="ink2 sm" x="568" y="326" text-anchor="start">-13.61 eV</text><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" d="M360 137.5 L560 137.5"/><text class="ink2 sm" x="352" y="141.5" text-anchor="end">n = 2</text><text class="ink2 sm" x="568" y="141.5" text-anchor="start">-3.40 eV</text><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" d="M360 103.33 L560 103.33"/><text class="ink2 sm" x="352" y="107.33" text-anchor="end">n = 3</text><text class="ink2 sm" x="568" y="107.33" text-anchor="start">-1.51 eV</text><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" d="M360 91.38 L560 91.38"/><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" d="M360 85.84 L560 85.84"/><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" d="M360 82.83 L560 82.83"/><text class="ink2 sm" x="352" y="89.84" text-anchor="end">n = 4, 5, 6 …</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M392 103.33 L392 134.5"/><text class="ink2 sm" x="387" y="120.42" text-anchor="end">656 nm</text><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M434 91.38 L434 134.5"/><text class="ink2 sm" x="439" y="114.44" text-anchor="start">486 nm</text><path fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)" d="M484 137.5 L484 319"/><text class="ink2 sm" x="489" y="229.75" text-anchor="start">122 nm</text><text class="ink2 sm" x="360" y="352" text-anchor="start">E<tspan baseline-shift="-22%" font-size="76%">n</tspan> = −13.606 eV / n². 위로 갈수록 준위가 촘촘해진다</text><text class="ink2 sm" x="360" y="372" text-anchor="start">떨어질 때 나오는 광자의 에너지가 두 준위의 차다</text>
</svg>