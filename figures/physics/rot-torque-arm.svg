<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 384" width="620" height="384" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">토크와 모멘트 팔</title><desc id="d">문을 미는 세 가지 방법</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="24" y="32" text-anchor="start">문을 위에서 내려다본 그림. 왼쪽 동그라미가 경첩(회전축)이다</text><rect x="70" y="160" width="330" height="16" rx="3" fill="var(--grid)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1.3"/><circle cx="70" cy="168" r="7" fill="none" stroke="var(--ink2)" stroke-width="2"/><circle cx="70" cy="168" r="2.5" class="ink2"/><text class="ink2 sm" x="70" y="198" text-anchor="middle">축</text><path class="s1" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1)" d="M400 168 L400 92"/><text class="ink" x="408" y="128" text-anchor="start">F</text><text class="ink2 sm" x="408" y="92" text-anchor="start">(가) τ = r F 로 최대</text><path class="s2" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar2)" d="M150 168 L150 92"/><text class="ink" x="158" y="128" text-anchor="start">F</text><text class="ink2 sm" x="158" y="92" text-anchor="start">(나) 같은 F 라도 r 이 작으면 τ 도 작다</text><path class="ax" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M70 224 L400 224"/><text class="ink2 sm" x="235" y="218" text-anchor="middle">r (축에서 작용점까지)</text><path class="gr" stroke-dasharray="4 3" d="M400 168 V230"/><rect x="70" y="292" width="330" height="16" rx="3" fill="var(--grid)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1.3"/><circle cx="70" cy="300" r="7" fill="none" stroke="var(--ink2)" stroke-width="2"/><circle cx="70" cy="300" r="2.5" class="ink2"/><path class="s3" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M400 300 L496 300"/><text class="ink" x="500" y="305" text-anchor="start">F</text><path class="s3" fill="none" stroke-width="1.6" stroke-dasharray="6 4" d="M44 300 H508"/><text class="ink2 sm" x="24" y="268" text-anchor="start">(다) 힘이 문을 따라 향하면 작용선이 축을 지난다 → τ = 0</text><text class="ink2 sm" x="40" y="326" text-anchor="start">작용선을 늘이면 축을 그대로 지난다</text><text class="ink2 sm" x="606" y="374" text-anchor="end">손잡이를 경첩 반대쪽에 다는 이유, 그리고 문을 옆으로 밀면 안 열리는 이유</text>
</svg>