<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">전자기 스펙트럼</title><desc id="d">파장에 따른 이름과 가시광선의 폭</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="26" text-anchor="start">전자기 스펙트럼 — 다른 것은 파장뿐이다</text><text class="ink2 sm" x="16" y="48" text-anchor="start">전부 같은 전자기파이고 진공에서의 속력도 모두 c 로 같다. 이름이 다른 것은 만드는 법과 쓰임이 다르기 때문이다.</text><rect x="60" y="130" width="37.5" height="46" fill="var(--s1)" fill-opacity="0.3" stroke="var(--ink2)" stroke-width="1"/><text class="ink" x="78.75" y="194" text-anchor="middle">감마선</text><rect x="97.5" y="130" width="112.5" height="46" fill="var(--s1)" fill-opacity="0.24" stroke="var(--ink2)" stroke-width="1"/><text class="ink" x="153.75" y="210" text-anchor="middle">X선</text><rect x="210" y="130" width="59.24" height="46" fill="var(--s1)" fill-opacity="0.18" stroke="var(--ink2)" stroke-width="1"/><text class="ink" x="239.62" y="194" text-anchor="middle">자외선</text><rect x="269.24" y="130" width="9.95" height="46" fill="var(--s1)" fill-opacity="0.55" stroke="var(--ink2)" stroke-width="1"/><path class="s2" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M274.22 122 L274.22 90"/><text class="ink bold" x="274.22" y="84" text-anchor="middle">가시광선</text><text class="ink2 sm" x="274.22" y="68" text-anchor="middle">380 nm 에서 700 nm 까지</text><rect x="279.19" y="130" width="118.31" height="46" fill="var(--s1)" fill-opacity="0.18" stroke="var(--ink2)" stroke-width="1"/><text class="ink" x="338.35" y="194" text-anchor="middle">적외선</text><rect x="397.5" y="130" width="112.5" height="46" fill="var(--s1)" fill-opacity="0.24" stroke="var(--ink2)" stroke-width="1"/><text class="ink" x="453.75" y="210" text-anchor="middle">마이크로파</text><rect x="510" y="130" width="150" height="46" fill="var(--s1)" fill-opacity="0.3" stroke="var(--ink2)" stroke-width="1"/><text class="ink" x="585" y="194" text-anchor="middle">전파</text><path class="ax" d="M60 228 H660"/><path class="ax" stroke-width="1" d="M60 228 V236"/><text class="ink2 sm" x="60" y="252" text-anchor="middle">10⁻¹²</text><path class="ax" stroke-width="1" d="M135 228 V236"/><text class="ink2 sm" x="135" y="252" text-anchor="middle">10⁻¹⁰</text><path class="ax" stroke-width="1" d="M210 228 V236"/><text class="ink2 sm" x="210" y="252" text-anchor="middle">10⁻⁸</text><path class="ax" stroke-width="1" d="M285 228 V236"/><text class="ink2 sm" x="285" y="252" text-anchor="middle">10⁻⁶</text><path class="ax" stroke-width="1" d="M360 228 V236"/><text class="ink2 sm" x="360" y="252" text-anchor="middle">10⁻⁴</text><path class="ax" stroke-width="1" d="M435 228 V236"/><text class="ink2 sm" x="435" y="252" text-anchor="middle">10⁻²</text><path class="ax" stroke-width="1" d="M510 228 V236"/><text class="ink2 sm" x="510" y="252" text-anchor="middle">10⁰</text><path class="ax" stroke-width="1" d="M585 228 V236"/><text class="ink2 sm" x="585" y="252" text-anchor="middle">10²</text><path class="ax" stroke-width="1" d="M660 228 V236"/><text class="ink2 sm" x="660" y="252" text-anchor="middle">10⁴</text><text class="ink2 sm" x="660" y="272" text-anchor="end">파장 λ (m) — 눈금 한 칸이 100배</text><text class="ink2 sm" x="60" y="272" text-anchor="start">짧다 · 진동수가 높다</text><text class="ink2 sm" x="16" y="320" text-anchor="start">c = f λ 이므로 파장이 짧을수록 진동수가 높다. 가시광선이 차지하는 폭은 전체에서 이만큼뿐이다</text>
</svg>