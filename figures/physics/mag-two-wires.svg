<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="26" text-anchor="start">나란한 두 도선은 서로 힘을 주고받는다</text><rect x="16" y="86" width="252" height="236" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.2"/><path class="s2" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar2)" d="M82 296 L82 144"/><text class="ink" x="74" y="146" text-anchor="end">I<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><path class="s2" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar2)" d="M202 296 L202 144"/><text class="ink" x="212" y="146" text-anchor="start">I<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><g stroke="var(--s1)" stroke-width="1.7" fill="none"><circle cx="202" cy="186" r="10"/><path d="M195.4 179.4 L208.6 192.6 M195.4 192.6 L208.6 179.4"/></g><text class="ink2 sm" x="186" y="191" text-anchor="end">I<tspan baseline-shift="-22%" font-size="76%">1</tspan> 이 만든 B</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M198 248 L150 248"/><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M86 248 L134 248"/><text class="ink" x="142" y="236" text-anchor="middle">F</text><path class="gr" stroke-dasharray="4 3" d="M82 308 H202"/><text class="ink2 sm" x="142" y="320" text-anchor="middle">d</text><text class="ink bold" x="142" y="110" text-anchor="middle">같은 방향  →  끌어당긴다</text><rect x="320" y="86" width="252" height="236" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.2"/><path class="s2" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar2)" d="M386 296 L386 144"/><text class="ink" x="378" y="146" text-anchor="end">I<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><path class="s2" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar2)" d="M506 144 L506 296"/><text class="ink" x="516" y="146" text-anchor="start">I<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><g stroke="var(--s1)" stroke-width="1.7" fill="none"><circle cx="506" cy="186" r="10"/><path d="M499.4 179.4 L512.6 192.6 M499.4 192.6 L512.6 179.4"/></g><text class="ink2 sm" x="490" y="191" text-anchor="end">I<tspan baseline-shift="-22%" font-size="76%">1</tspan> 이 만든 B</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M510 248 L558 248"/><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M382 248 L334 248"/><text class="ink" x="446" y="236" text-anchor="middle">F</text><path class="gr" stroke-dasharray="4 3" d="M386 308 H506"/><text class="ink2 sm" x="446" y="320" text-anchor="middle">d</text><text class="ink bold" x="446" y="110" text-anchor="middle">반대 방향  →  밀어낸다</text><text class="ink2 sm" x="16" y="56" text-anchor="start">1번이 만든 자기장 속에 2번이 놓여 있다고 보면 된다. 두 단계를 따로 따진다.</text><text class="ink2 sm" x="16" y="346" text-anchor="start">F / L = μ<tspan baseline-shift="-22%" font-size="76%">0</tspan> I<tspan baseline-shift="-22%" font-size="76%">1</tspan> I<tspan baseline-shift="-22%" font-size="76%">2</tspan> / (2π d).  같은 부호 전하가 밀어내는 것과 헷갈리기 쉬운 자리다</text>
</svg>