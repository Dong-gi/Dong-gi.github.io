<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 356" width="620" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">나란한 두 도선의 힘</title><desc id="d">같은 방향은 인력, 반대 방향은 척력</desc>
<style>
