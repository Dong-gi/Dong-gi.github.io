<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">포인팅 벡터</title><desc id="d">상자 안의 에너지가 한 면을 지나간다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="26" text-anchor="start">전자기파가 나르는 에너지</text><path d="M130 248 L130 108 L176 76 L176 216 Z" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><path d="M130 108 L424 108 L470 76 L176 76 Z" fill="var(--s1)" fill-opacity="0.08" stroke="var(--ink2)" stroke-width="1.3"/><path d="M424 248 L424 108 L470 76 L470 216 Z" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><path class="gr" d="M130 248 L424 248 L424 108"/><text class="ink" x="68" y="182" text-anchor="end">넓이 A</text><path class="ax" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M78 178 L78 108"/><path class="ax" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M78 178 L78 248"/><path class="gr" stroke-dasharray="4 3" d="M130 268 H424"/><text class="ink" x="277" y="286" text-anchor="middle">길이 = c Δt</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M154 198 L154 126"/><text class="ink" x="160" y="122" text-anchor="start">E</text><circle cx="204" cy="202" r="11" fill="none" stroke="var(--s2)" stroke-width="2"/><circle cx="204" cy="202" r="3.3" fill="var(--s2)"/><text class="ink2 sm" x="220" y="207" text-anchor="start">B (화면 밖)</text><path class="s3" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M444 178 L524 178"/><text class="ink bold" x="530" y="183" text-anchor="start">S</text><text class="ink2 sm" x="16" y="56" text-anchor="start">Δt 동안 이 상자 안의 에너지가 몽땅 오른쪽 면을 지나간다.</text><text class="ink bold" x="16" y="312" text-anchor="start">S = (1/μ<tspan baseline-shift="-22%" font-size="76%">0</tspan>) E × B  —  단위 넓이·단위 시간당 지나가는 에너지, 단위 W/m²</text><text class="ink2 sm" x="16" y="332" text-anchor="start">방향은 E 에서 B 로 오른손을 감을 때의 엄지, 즉 파가 나아가는 쪽이다</text><text class="ink2 sm" x="16" y="352" text-anchor="start">시간 평균을 낸 값이 세기 I 이고, 흡수하는 면은 I / c 만큼의 압력을 받는다</text>
</svg>