<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" width="620" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">깊이와 압력</title><desc id="d">깊을수록 큰 압력, 그릇 모양과는 무관</desc>
<style>
