<text class="ink bold" x="16" y="24" text-anchor="start">압력을 정하는 것은 깊이뿐이다</text><path d="M46 74 H256 V264 H46 Z" fill="var(--s1)" fill-opacity="0.14" stroke="none"/><path class="ax" d="M46 74 V264 H256 V74"/><path class="s1" fill="none" stroke-width="2" d="M46 74 H256"/><text class="ink2 sm" x="262" y="78" text-anchor="start">수면</text><path class="gr" stroke-dasharray="3 3" d="M62 131 H256"/><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M216.8 131 L252 131"/><text class="ink2 sm" x="108" y="125" text-anchor="start">h<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><path class="gr" stroke-dasharray="3 3" d="M62 188 H256"/><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M203.6 188 L252 188"/><text class="ink2 sm" x="108" y="182" text-anchor="start">h<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><path class="gr" stroke-dasharray="3 3" d="M62 245 H256"/><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M190.4 245 L252 245"/><text class="ink2 sm" x="108" y="239" text-anchor="start">h<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="62" y="74" width="34" height="171" fill="var(--s3)" fill-opacity="0.25" stroke="var(--s3)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="ink2 sm" x="79" y="284" text-anchor="middle">이 기둥의</text><text class="ink2 sm" x="79" y="300" text-anchor="middle">무게가 누른다</text><text class="ink" x="142" y="294" text-anchor="start">P = P<tspan baseline-shift="-22%" font-size="76%">0</tspan> + ρgh</text><text class="ink2 sm" x="142" y="314" text-anchor="start">깊을수록 벽을 세게 민다</text><path d="M330 96 V236 H376 V96 Z" fill="var(--s1)" fill-opacity="0.14" stroke="none"/><path class="ax" d="M330 96 V236 H376 V96 Z" fill="none"/><path d="M400 96 L476 96 L454 236 L422 236 Z" fill="var(--s1)" fill-opacity="0.14" stroke="none"/><path class="ax" d="M400 96 L476 96 L454 236 L422 236 Z" fill="none"/><path d="M512 96 L538 96 L556 236 L494 236 Z" fill="var(--s1)" fill-opacity="0.14" stroke="none"/><path class="ax" d="M512 96 L538 96 L556 236 L494 236 Z" fill="none"/><path class="gr" stroke-dasharray="4 3" d="M314 96 H566"/><text class="ink2 sm" x="310" y="100" text-anchor="end">같은 높이</text><path class="ax" stroke-width="2" d="M320 236 L570 236"/><path class="gr" d="M320 236 L312 228"/><path class="gr" d="M332 236 L324 228"/><path class="gr" d="M344 236 L336 228"/><path class="gr" d="M356 236 L348 228"/><path class="gr" d="M368 236 L360 228"/><path class="gr" d="M380 236 L372 228"/><path class="gr" d="M392 236 L384 228"/><path class="gr" d="M404 236 L396 228"/><path class="gr" d="M416 236 L408 228"/><path class="gr" d="M428 236 L420 228"/><path class="gr" d="M440 236 L432 228"/><path class="gr" d="M452 236 L444 228"/><path class="gr" d="M464 236 L456 228"/><path class="gr" d="M476 236 L468 228"/><path class="gr" d="M488 236 L480 228"/><path class="gr" d="M500 236 L492 228"/><path class="gr" d="M512 236 L504 228"/><path class="gr" d="M524 236 L516 228"/><path class="gr" d="M536 236 L528 228"/><path class="gr" d="M548 236 L540 228"/><path class="gr" d="M560 236 L552 228"/><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M353 202 L353 228"/><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M438 202 L438 228"/><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M525 202 L525 228"/><text class="ink" x="440" y="278" text-anchor="middle">바닥 압력이 셋 다 같다</text><text class="ink2 sm" x="440" y="298" text-anchor="middle">담긴 물의 양과는 무관하다</text><text class="ink2 sm" x="16" y="340" text-anchor="start">깊이가 두 배면 압력의 증가분도 두 배다. 그릇이 넓든 좁든 달라지지 않는다</text>
