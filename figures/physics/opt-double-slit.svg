<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 352" width="660" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이중슬릿 간섭</title><desc id="d">경로차 d sin θ 와 무늬 간격</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="26" text-anchor="start">이중슬릿 — 두 길의 길이 차이가 밝고 어두움을 정한다</text><path fill="none" stroke="var(--ink2)" stroke-width="4" stroke-linecap="round" d="M150 62 L150 136"/><path fill="none" stroke="var(--ink2)" stroke-width="4" stroke-linecap="round" d="M150 160 L150 232"/><path fill="none" stroke="var(--ink2)" stroke-width="4" stroke-linecap="round" d="M150 256 L150 318"/><path fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M84 148 L117 148"/><path fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" d="M117 148 L144 148"/><path fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M84 244 L117 244"/><path fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" d="M117 244 L144 244"/><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M150 148 L240.5 95.75"/><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" d="M240.5 95.75 L314.54 53"/><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M150 244 L240.5 191.75"/><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" d="M240.5 191.75 L314.54 149"/><path fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" d="M150 148 L191.57 220"/><path fill="none" stroke="var(--s2)" stroke-width="3.6" stroke-linecap="round" d="M150 244 L191.57 220"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M126 196 L126 148"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M126 196 L126 244"/><text class="ink" x="118" y="200" text-anchor="end">d</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round" d="M150 244 L270 244"/><path class="gr" d="M224 244 A74 74 0 0 0 214.09 207"/><text class="sm ink2" x="235" y="225.22" text-anchor="middle">θ</text><text class="ink" x="176" y="276" text-anchor="start">경로차 = d sin θ</text><text class="ink2 sm" x="320" y="244" text-anchor="start">보강(밝다) : d sin θ = mλ</text><text class="ink2 sm" x="320" y="266" text-anchor="start">상쇄(어둡다) : d sin θ = (m + 1/2) λ</text><text class="ink2 sm" x="320" y="288" text-anchor="start">m = 0, ±1, ±2, …</text><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" d="M546 56 L546 300"/><text class="ink2 sm" x="550" y="50" text-anchor="start">스크린</text><rect x="550" y="257" width="32" height="14" rx="3" fill="var(--s1)" fill-opacity="0.6"/><text class="ink2 sm" x="590" y="268" text-anchor="start">m = -2</text><rect x="550" y="213" width="32" height="14" rx="3" fill="var(--s1)" fill-opacity="0.6"/><text class="ink2 sm" x="590" y="224" text-anchor="start">m = -1</text><rect x="550" y="169" width="32" height="14" rx="3" fill="var(--s1)" fill-opacity="0.9"/><text class="ink2 sm" x="590" y="180" text-anchor="start">m = 0</text><rect x="550" y="125" width="32" height="14" rx="3" fill="var(--s1)" fill-opacity="0.6"/><text class="ink2 sm" x="590" y="136" text-anchor="start">m = 1</text><rect x="550" y="81" width="32" height="14" rx="3" fill="var(--s1)" fill-opacity="0.6"/><text class="ink2 sm" x="590" y="92" text-anchor="start">m = 2</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M566 154 L566 176"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M566 154 L566 132"/><text class="ink2 sm" x="16" y="340" text-anchor="start">스크린이 멀면 sin θ ≈ y / L 이므로 무늬 간격은 Δy = λL / d 로 고르게 벌어진다</text>
</svg>