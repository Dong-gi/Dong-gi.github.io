<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">v-t 그래프의 넓이</title><desc id="d">사다리꼴을 직사각형과 삼각형으로 나눈 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path d="M58 244 L299.67 244 L299.67 191.5 L58 191.5 Z" fill="var(--s1)" fill-opacity="0.16" stroke="none"/><path d="M58 191.5 L299.67 191.5 L299.67 60.25 Z" fill="var(--s2)" fill-opacity="0.22" stroke="none"/><path class="gr" d="M58 244 V34"/><path class="gr" d="M106.33 244 V34"/><path class="gr" d="M154.67 244 V34"/><path class="gr" d="M203 244 V34"/><path class="gr" d="M251.33 244 V34"/><path class="gr" d="M299.67 244 V34"/><path class="gr" d="M58 244 H348"/><path class="gr" d="M58 191.5 H348"/><path class="gr" d="M58 139 H348"/><path class="gr" d="M58 86.5 H348"/><path class="ax" marker-end="url(#ark)" d="M58 244 H358"/><path class="ax" marker-end="url(#ark)" d="M58 244 V24"/><text class="sm ink2" x="106.33" y="259" text-anchor="middle">1</text><text class="sm ink2" x="154.67" y="259" text-anchor="middle">2</text><text class="sm ink2" x="203" y="259" text-anchor="middle">3</text><text class="sm ink2" x="251.33" y="259" text-anchor="middle">4</text><text class="sm ink2" x="299.67" y="259" text-anchor="middle">5</text><text class="sm ink2" x="52" y="195.5" text-anchor="end">4</text><text class="sm ink2" x="52" y="143" text-anchor="end">8</text><text class="sm ink2" x="52" y="90.5" text-anchor="end">12</text><text class="sm ink2" x="362" y="248">t (s)</text><text class="sm ink2" x="50" y="26" text-anchor="end">v (m/s)</text><path class="cv s3" d="M58 191.5 L299.67 60.25"/><path class="gr" stroke-dasharray="4 3" d="M58 191.5 L299.67 191.5"/><path class="gr" stroke-dasharray="4 3" d="M299.67 244 L299.67 60.25"/><circle class="f3" cx="58" cy="191.5" r="3.5"/><circle class="f3" cx="299.67" cy="60.25" r="3.5"/><text class="ink" x="66" y="183.5" text-anchor="start">v<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><text class="ink" x="305.67" y="60.25" text-anchor="start">v</text><text class="ink" x="174" y="221.69" text-anchor="middle">직사각형  v<tspan baseline-shift="-22%" font-size="76%">0</tspan> t</text><text class="ink" x="227.17" y="133.75" text-anchor="middle">삼각형  ½ (v − v<tspan baseline-shift="-22%" font-size="76%">0</tspan>) t</text><text class="ink" x="378" y="62" text-anchor="start">v-t 그래프 아래 넓이가</text><text class="ink" x="378" y="82" text-anchor="start">그 시간 동안의 변위다</text><text class="ink2 sm" x="378" y="118" text-anchor="start">Δx = v<tspan baseline-shift="-22%" font-size="76%">0</tspan> t + ½ (v − v<tspan baseline-shift="-22%" font-size="76%">0</tspan>) t</text><text class="ink2 sm" x="378" y="140" text-anchor="start">v − v<tspan baseline-shift="-22%" font-size="76%">0</tspan> = a t 이므로</text><text class="ink bold" x="378" y="164" text-anchor="start">Δx = v<tspan baseline-shift="-22%" font-size="76%">0</tspan> t + ½ a t²</text><text class="ink2 sm" x="378" y="198" text-anchor="start">사다리꼴로 한 번에 보면</text><text class="ink2 sm" x="378" y="216" text-anchor="start">Δx = ½ (v<tspan baseline-shift="-22%" font-size="76%">0</tspan> + v) t</text><text class="ink2 sm" x="586" y="288" text-anchor="end">가속도가 일정하면 v-t 그래프가 직선이라 넓이를 도형으로 잴 수 있다</text>
</svg>