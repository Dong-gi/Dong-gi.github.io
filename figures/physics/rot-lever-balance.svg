xt><path class="ax" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M290 262 L386 262"/><text class="ink" x="338" y="256" text-anchor="middle">d<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><path class="gr" stroke-dasharray="4 3" d="M130 150 V268"/><path class="gr" stroke-dasharray="4 3" d="M386 150 V268"/><path class="gr" stroke-dasharray="4 3" d="M290 150 V268"/><text class="ink bold" x="24" y="34" text-anchor="start">평형의 두 조건: 힘의 합도 0, 토크의 합도 0</text><text class="ink2 sm" x="24" y="60" text-anchor="start">받침점을 축으로 잡으면 N 의 토크가 0 이라 식에서 사라진다</text><text class="ink" x="566" y="270" text-anchor="end">m<tspan baseline-shift="-22%" font-size="76%">1</tspan> g d<tspan baseline-shift="-22%" font-size="76%">1</tspan> = m<tspan baseline-shift="-22%" font-size="76%">2</tspan> g d<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="566" y="290" text-anchor="end">반시계 토크와 시계 토크가 같으면 기울지 않는다</text>
