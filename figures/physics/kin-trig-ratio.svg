<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">삼각비의 뜻</title><desc id="d">닮은 직각삼각형 두 개와 변의 비</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path class="cv s3" d="M55.25 218.5 L156.95 218.5 L156.95 141.63 L55.25 218.5"/><path class="cv s1" d="M55.25 218.5 L258.64 218.5 L258.64 64.75 L55.25 218.5"/><path class="gr" fill="none" d="M247.64 218.5 L247.64 207.5 L258.64 207.5"/><path class="gr" fill="none" d="M148.95 218.5 L148.95 210.5 L156.95 210.5"/><path class="gr" d="M95.25 218.5 A40 40 0 0 0 87.25 194.5"/><text class="sm ink2" x="106.48" y="205.42" text-anchor="middle">θ</text><text class="ink2 sm" x="156.95" y="238.5" text-anchor="middle">이웃한 변 4</text><text class="ink2 sm" x="266.64" y="141.63" text-anchor="start">마주보는 변 3</text><text class="ink2 sm" x="145.86" y="130.5" text-anchor="end">빗변 5</text><text class="ink2 sm" x="165.95" y="184.06" text-anchor="start">작은 삼각형 2 : 1.5 : 2.5</text><text class="ink" x="378" y="56" text-anchor="start">sin θ = 마주보는 변 ÷ 빗변</text><text class="ink2 sm" x="392" y="76" text-anchor="start">= 3 ÷ 5 = 0.60</text><text class="ink" x="378" y="106" text-anchor="start">cos θ = 이웃한 변 ÷ 빗변</text><text class="ink2 sm" x="392" y="126" text-anchor="start">= 4 ÷ 5 = 0.80</text><text class="ink" x="378" y="156" text-anchor="start">tan θ = 마주보는 변 ÷ 이웃한 변</text><text class="ink2 sm" x="392" y="176" text-anchor="start">= 3 ÷ 4 = 0.75</text><text class="ink2 sm" x="378" y="212" text-anchor="start">삼각형을 절반으로 줄여도</text><text class="ink bold" x="378" y="230" text-anchor="start">1.5 ÷ 2.5 = 0.60 으로 같다</text><text class="ink2 sm" x="586" y="278" text-anchor="end">각이 같으면 삼각형의 크기와 상관없이 변의 비가 정해진다</text>
</svg>