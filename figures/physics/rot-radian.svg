<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">라디안</title><desc id="d">호의 길이와 반지름이 같은 각이 1 rad</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="24" y="34" text-anchor="start">1 라디안이란</text><text class="ink" x="24" y="58" text-anchor="start">s = r θ  (θ 는 반드시 라디안)</text><circle cx="150" cy="180" r="80" fill="none" stroke="var(--grid)" stroke-width="1.4"/><path class="s2" fill="none" stroke-width="4.5" d="M230 180 A80 80 0 0 0 193.22 112.68"/><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M150 180 L230 180"/><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M150 180 L193.22 112.68"/><text class="ink" x="190" y="200" text-anchor="middle">r</text><text class="ink" x="164" y="122" text-anchor="middle">r</text><path class="gr" d="M184 180 A34 34 0 0 0 168.37 151.39"/><text class="sm ink2" x="192.12" y="160.99" text-anchor="middle">θ = 1 rad</text><text class="ink2 sm" x="238" y="130" text-anchor="start">호의 길이 s = r</text><text class="ink2 sm" x="24" y="288" text-anchor="start">호의 길이가 반지름과 같아지는 각을 1 rad 이라 한다</text><text class="ink2 sm" x="24" y="308" text-anchor="start">1 rad ≈ 57.3°</text><text class="ink bold" x="330" y="34" text-anchor="start">한 바퀴는 몇 라디안인가</text><circle cx="432" cy="180" r="80" fill="none" stroke="var(--s3)" stroke-width="4.5"/><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M432 180 L512 180"/><text class="ink" x="472" y="200" text-anchor="middle">r</text><text class="ink2 sm" x="432" y="88" text-anchor="middle">호 = 원둘레 2πr</text><text class="ink2 sm" x="330" y="288" text-anchor="start">한 바퀴의 호는 원둘레 2πr 이므로 θ = 2πr / r = 2π</text><text class="ink2 sm" x="330" y="308" text-anchor="start">360° = 2π rad,  180° = π rad</text>
</svg>