<path d="M550 185 L550 210" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="butt" stroke-linejoin="round"/><rect x="470" y="135" width="20" height="50" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><text class="ink sm" x="498" y="164" text-anchor="start">R<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="540" y="135" width="20" height="50" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><text class="ink sm" x="568" y="164" text-anchor="start">R<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink bold" x="378" y="164" text-anchor="end">V</text><path class="s1" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)" d="M424 94 L452 94"/><text class="ink bold" x="438" y="86" text-anchor="middle">I</text><path class="s2" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M468 128 L468 152"/><path class="s2" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M584 128 L584 152"/><text class="ink2 sm" x="462" y="142" text-anchor="end">I<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink2 sm" x="590" y="142" text-anchor="start">I<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink bold" x="500" y="62" text-anchor="middle">병렬</text><text class="ink sm" x="500" y="244" text-anchor="middle">전압이 같다. 전류가 나뉜다</text><text class="ink2 sm" x="500" y="268" text-anchor="middle">I = I<tspan baseline-shift="-22%" font-size="76%">1</tspan> + I<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink bold" x="500" y="292" text-anchor="middle">1/R = 1/R<tspan baseline-shift="-22%" font-size="76%">1</tspan> + 1/R<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="500" y="316" text-anchor="middle">합성 저항은 어느 쪽보다도 작다</text><text class="ink2 sm" x="320" y="34" text-anchor="middle">길을 하나 더 내주