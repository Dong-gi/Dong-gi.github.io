.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="26" text-anchor="start">자기장 안에 놓인 도선이 받는 힘</text><text class="ink2 sm" x="16" y="48" text-anchor="start">B 는 오른쪽 방향(가는 화살표). 도선의 각도만 바꾼다.</text><rect x="16" y="88" width="184" height="212" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.2"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M28 128 L188 128"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M28 152 L188 152"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M28 176 L188 176"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M28 268 L188 268"/><path class="s1" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1)" d="M108 256 L108 124"/><text class="ink" x="116" y="128" text-anchor="start">I</text><g stroke="var(--s3)" stroke-width="2" fill="none"><circle cx="156" cy="224" r="12"/><path d="M148.08 216.08 L163.92 231.92 M148.08 231.92 L163.92 216.08"/></g><text class="ink" x="172" y="229" text-anchor="start">F</text><text class="ink bold" x="108" y="112" text-anchor="middle">θ = 90°  →  F = B I L</text><rect x="228" y="88" width="184" height="212" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.2"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M240 128 L400 128"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M240 152 L400 152"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M240 176 L400 176"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M240 268 L400 268"/><path class="s1" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1)" d="M262.84 223 L377.16 157"/><text class="ink" x="385.16" y="161" text-anchor="start">I</text><g stroke="var(--s3)" stroke-width="2" fill="none"><circle cx="368" cy="224" r="12"/><path d="M360.08 216.08 L375.92 231.92 M360.08 231.92 L375.92 216.08"/></g><text class="ink" x="384" y="229" text-anchor="start">F</text><text class="ink bold" x="320" y="112" text-anchor="middle">θ = 30°  →  F = 0.5 B I L</text><rect x="440" y="88" width="184" height="212" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.2"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M452 128 L612 128"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M452 152 L612 152"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M452 176 L612 176"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M452 268 L612 268"/><path class="s1" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1)" d="M466 190 L598 190"/><text class="ink" x="606" y="194" text-anchor="start">I</text><text class="ink bold" x="532" y="229" text-anchor="middle">F = 0</text><text class="ink bold" x="532" y="112" text-anchor="middle">θ = 0°  →  F = 0</text><text class="ink2 sm" x="16" y="318" text-anchor="start">F = B I L sin θ.  θ 는 전류 방향과 B 사이의 각이고, 힘은 둘 모두에 수직이라 화면 안쪽(⊗)을 향한다</text><text class="ink2 sm" x="624" y="48" text-anchor="end">나란하면 힘이 0이다</text>
</svg>