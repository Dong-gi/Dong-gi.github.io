<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 340" width="610" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">강 건너기와 상대속도</title><desc id="d">두 가지 뱃머리 방향에 대한 속도 삼각형</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="20" y="96" width="270" height="154" rx="4" fill="var(--s1)" fill-opacity="0.07" stroke="none"/><path class="ax" d="M20 96 h270"/><path class="ax" d="M20 250 h270"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M44 118 L84 118"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M134 118 L174 118"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M224 118 L264 118"/><text class="ink2 sm" x="155" y="138" text-anchor="middle">강물이 흐르는 방향</text><text class="ink bold" x="20" y="34" text-anchor="start">(가) 뱃머리를 강과 수직으로</text><text class="ink2 sm" x="20" y="56" text-anchor="start">건너기는 빠르지만 하류로 밀린다</text><text class="ink2 sm" x="155" y="270" text-anchor="middle">출발 기슭</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M60 250 L60 170"/><text class="ink sm" x="54" y="210" text-anchor="end">배 4.0</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M60 170 L120 170"/><text class="ink sm" x="90" y="162" text-anchor="middle">강물 3.0</text><path class="s3" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M60 250 L120 170"/><text class="ink sm" x="126" y="206" text-anchor="start">땅에 대해 5.0</text><path class="gr" stroke-dasharray="5 4" d="M120 170 L175.5 96"/><circle class="f3" cx="175.5" cy="96" r="5"/><text class="ink2 sm" x="181.5" y="88" text-anchor="start">여기 닿는다</text><rect x="320" y="96" width="270" height="154" rx="4" fill="var(--s1)" fill-opacity="0.07" stroke="none"/><path class="ax" d="M320 96 h270"/><path class="ax" d="M320 250 h270"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M344 118 L384 118"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M434 118 L474 118"/><path class="s2" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M524 118 L564 118"/><text class="ink2 sm" x="455" y="138" text-anchor="middle">강물이 흐르는 방향</text><text class="ink bold" x="320" y="34" text-anchor="start">(나) 맞은편에 닿으려면</text><text class="ink2 sm" x="320" y="56" text-anchor="start">상류로 틀어 강물을 상쇄한다</text><text class="ink2 sm" x="455" y="270" text-anchor="middle">출발 기슭</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M430 250 L370 197.08"/><text class="ink sm" x="396" y="236" text-anchor="end">배 4.0</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M370 197.08 L430 197.08"/><text class="ink sm" x="400" y="189.08" text-anchor="middle">강물 3.0</text><path class="s3" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M430 250 L430 197.08"/><text class="ink sm" x="438" y="222" text-anchor="start">땅에 대해 2.65</text><path class="gr" stroke-dasharray="5 4" d="M430 197.07999999999998 V96"/><circle class="f3" cx="430" cy="96" r="5"/><text class="ink2 sm" x="436" y="88" text-anchor="start">바로 맞은편</text><text class="ink2 sm" x="596" y="328" text-anchor="end">배가 물에 대해 내는 속도 + 물이 땅에 대해 흐르는 속도 = 배가 땅에 대해 가는 속도</text>
</svg>