32 227.59"/><text class="sm ink2" x="402.18" y="145.06" text-anchor="middle">고리 2</text><text class="ink bold" x="310" y="40" text-anchor="middle">접합점 법칙: 들어오는 전류의 합 = 나가는 전류의 합</text><text class="ink2 sm" x="310" y="62" text-anchor="middle">위 접합점에서 I<tspan baseline-shift="-22%" font-size="76%">1</tspan> + I<tspan baseline-shift="-22%" font-size="76%">2</tspan> = I<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><text class="ink bold" x="310" y="300" text-anchor="middle">고리 법칙: 한 고리를 한 바퀴 돌며 전위 변화를 더하면 0</text><text class="ink2 sm" x="310" y="324" text-anchor="middle">올라간 만큼 내려와야 제자리다. 전하 보존과 에너지 보존을 회로에 옮긴 것이다</text>
