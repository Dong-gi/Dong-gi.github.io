ker-end="url(#ar3)" d="M210 340 L210 294"/><text class="ink2 sm" x="202" y="304" text-anchor="end">F (언제나 중심 쪽)</text><text class="ink2 sm" x="216" y="374" text-anchor="start">+q 가 여기로 들어온다</text><path class="gr" d="M452 90 V368"/><text class="ink2 sm" x="474" y="118" text-anchor="start">자기력은 속도에 수직이라</text><text class="ink2 sm" x="474" y="136" text-anchor="start">속력을 바꾸지 못한다.</text><text class="ink2 sm" x="474" y="154" text-anchor="start">방향만 계속 바꾸므로 원이 된다.</text><text class="ink bold" x="474" y="194" text-anchor="start">r = m v / (|q| B)</text><text class="ink2 sm" x="474" y="214" text-anchor="start">속력이 두 배면 원도 두 배</text><text class="ink bold" x="474" y="252" text-anchor="start">T = 2π m / (|q| B)</text><text class="ink2 sm" x="474" y="272" text-anchor="start">속력이 들어 있지 않다</text><text class="ink2 sm" x="474" y="290" text-anchor="start">= 한 바퀴 도는 시간은 같다</text><text class="ink2 sm" x="474" y="330" text-anchor="start">큰 원을 그리는 전하는</text><text class="ink2 sm" x="474" y="348" text-anchor="start">그만큼 빨리 돌기 때문이다</text>
