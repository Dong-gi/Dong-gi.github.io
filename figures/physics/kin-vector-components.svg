text><text class="ink" x="81.71" y="153" text-anchor="start">A<tspan baseline-shift="-22%" font-size="76%">y</tspan></text><text class="ink" x="175.46" y="131" text-anchor="end">A</text><text class="ink" x="368" y="62" text-anchor="start">크기와 방향으로 적힌 벡터를</text><text class="ink" x="368" y="82" text-anchor="start">가로·세로 두 수로 바꾼다</text><text class="ink2 sm" x="368" y="118" text-anchor="start">A<tspan baseline-shift="-22%" font-size="76%">x</tspan> = A cos θ = 5 × 0.80 = 4.0</text><text class="ink2 sm" x="368" y="138" text-anchor="start">A<tspan baseline-shift="-22%" font-size="76%">y</tspan> = A sin θ = 5 × 0.60 = 3.0</text><text class="ink2 sm" x="368" y="174" text-anchor="start">되돌아갈 때는 피타고라스</text><text class="ink bold" x="368" y="194" text-anchor="start">A = √(A<tspan baseline-shift="-22%" font-size="76%">x</tspan>² + A<tspan baseline-shift="-22%" font-size="76%">y</tspan>²) = 5.0</text><text class="ink2 sm" x="368" y="216" text-anchor="start">tan θ = A<tspan baseline-shift="-22%" font-size="76%">y</tspan> / A<tspan baseline-shift="-22%" font-size="76%">x</tspan> = 0.75</text><text class="ink2 sm" x="556" y="288" text-anchor="end">성분으로 바꾸면 축마다 따로 계산할 수 있다</text>
