class="ink" x="388" y="62" text-anchor="start">움직이기 전에는 마찰력이</text><text class="ink" x="388" y="82" text-anchor="start">미는 만큼만 커진다</text><text class="ink2 sm" x="388" y="118" text-anchor="start">정지마찰은 f ≤ μ<tspan baseline-shift="-22%" font-size="76%">s</tspan> N 이라는</text><text class="ink2 sm" x="388" y="136" text-anchor="start">부등식이지 등식이 아니다</text><text class="ink" x="388" y="172" text-anchor="start">한 번 미끄러지면 마찰이</text><text class="ink" x="388" y="192" text-anchor="start">조금 줄고 거의 일정해진다</text><text class="ink2 sm" x="388" y="226" text-anchor="start">N = 100 N, μ<tspan baseline-shift="-22%" font-size="76%">s</tspan> = 0.50, μ<tspan baseline-shift="-22%" font-size="76%">k</tspan> = 0.40 인 예</text><text class="ink2 sm" x="596" y="288" text-anchor="end">무거운 짐이 처음 밀 때 가장 힘든 이유가 이 꺾인 점이다</text>
