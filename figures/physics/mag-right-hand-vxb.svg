.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="16" y="26" text-anchor="start">자기력의 방향 — 오른손 법칙</text><text class="ink2 sm" x="16" y="48" text-anchor="start">오른손 네 손가락을 v 에서 B 쪽으로 감아쥐면 세운 엄지가 v × B 방향이다.</text><text class="ink2 sm" x="16" y="64" text-anchor="start">전하가 음수면 힘은 그 반대 방향이다.</text><rect x="22" y="90" width="184" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.2"/><text class="ink bold" x="114" y="112" text-anchor="middle">양전하</text><circle cx="70" cy="200" r="9" fill="var(--s2)" fill-opacity="0.85"/><text class="ink2 sm" x="70" y="204" text-anchor="middle">+</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M82 200 L156 200"/><text class="ink" x="160" y="205" text-anchor="start">v</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M70 190 L70 134"/><text class="ink" x="74" y="130" text-anchor="start">B</text><circle cx="120" cy="248" r="13" fill="none" stroke="var(--s3)" stroke-width="2"/><circle cx="120" cy="248" r="3.9" fill="var(--s3)"/><text class="ink" x="140" y="253" text-anchor="start">F</text><text class="ink2 sm" x="114" y="278" text-anchor="middle">힘은 화면 밖으로</text><rect x="238" y="90" width="184" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.2"/><text class="ink bold" x="330" y="112" text-anchor="middle">음전하</text><circle cx="286" cy="200" r="9" fill="var(--s1)" fill-opacity="0.85"/><text class="ink2 sm" x="286" y="204" text-anchor="middle">−</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M298 200 L372 200"/><text class="ink" x="376" y="205" text-anchor="start">v</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M286 190 L286 134"/><text class="ink" x="290" y="130" text-anchor="start">B</text><g stroke="var(--s3)" stroke-width="2" fill="none"><circle cx="336" cy="248" r="13"/><path d="M327.42 239.42 L344.58 256.58 M327.42 256.58 L344.58 239.42"/></g><text class="ink" x="356" y="253" text-anchor="start">F</text><text class="ink2 sm" x="330" y="278" text-anchor="middle">힘은 화면 안으로</text><rect x="454" y="90" width="184" height="200" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.2"/><text class="ink bold" x="546" y="112" text-anchor="middle">v 와 B 가 나란하면</text><circle cx="502" cy="200" r="9" fill="var(--s2)" fill-opacity="0.85"/><text class="ink2 sm" x="502" y="204" text-anchor="middle">+</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M514 200 L588 200"/><text class="ink" x="592" y="205" text-anchor="start">v</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M514 226 L588 226"/><text class="ink" x="592" y="231" text-anchor="start">B</text><text class="ink bold" x="546" y="160" text-anchor="middle">F = 0</text><text class="ink2 sm" x="546" y="278" text-anchor="middle">감아쥘 각이 없다</text><text class="ink bold" x="16" y="322" text-anchor="start">화면에 수직인 방향의 표기</text><circle cx="40" cy="348" r="10" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><circle cx="40" cy="348" r="3" fill="var(--ink2)"/><text class="ink2 sm" x="58" y="353" text-anchor="start">화면 밖으로 (다가오는 화살촉)</text><g stroke="var(--ink2)" stroke-width="1.6" fill="none"><circle cx="300" cy="348" r="10"/><path d="M293.4 341.4 L306.6 354.6 M293.4 354.6 L306.6 341.4"/></g><text class="ink2 sm" x="318" y="353" text-anchor="start">화면 안으로 (멀어지는 화살깃)</text><text class="ink bold" x="644" y="353" text-anchor="end">F = |q| v B sin θ</text>
</svg>