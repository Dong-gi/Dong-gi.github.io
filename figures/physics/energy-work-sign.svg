<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 292" width="620" height="292" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">일의 부호</title><desc id="d">같은 쪽·수직·반대쪽 세 경우</desc>
<style>
