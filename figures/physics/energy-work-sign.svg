</defs>
<text class="ink bold" x="20" y="32" text-anchor="start">일의 부호는 힘과 변위 사이의 각이 정한다</text><path class="ax" d="M24 150 H196"/><path class="gr" d="M24 150 L17 158"/><path class="gr" d="M38 150 L31 158"/><path class="gr" d="M52 150 L45 158"/><path class="gr" d="M66 150 L59 158"/><path class="gr" d="M80 150 L73 158"/><path class="gr" d="M94 150 L87 158"/><path class="gr" d="M108 150 L101 158"/><path class="gr" d="M122 150 L115 158"/><path class="gr" d="M136 150 L129 158"/><path class="gr" d="M150 150 L143 158"/><path class="gr" d="M164 150 L157 158"/><path class="gr" d="M178 150 L171 158"/><path class="gr" d="M192 150 L185 158"/><rect x="50" y="114" width="52" height="36" rx="3" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><path class="s2" fill="none" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar2)" d="M76 132 L138 132"/><text class="ink" x="144" y="137" text-anchor="start">F</text><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M36 184 L182 184"/><text class="ink2 sm" x="110" y="178" text-anchor="middle">변위 d</text><text class="ink2 sm" x="110" y="220" text-anchor="middle">θ = 0°,  cos 0° = 1</text><text class="ink bold" x="110" y="242" text-anchor="middle">W &gt; 0</text><path class="ax" d="M224 150 H396"/><path class="gr" d="M224 150 L217 158"/><path class="gr" d="M238 150 L231 158"/><path class="gr" d="M252 150 L245 158"/><path class="gr" d="M266 150 L259 158"/><path class="gr" d="M280 150 L273 158"/><path class="gr" d="M294 150 L287 158"/><path class="gr" d="M308 150 L301 158"/><path class="gr" d="M322 150 L315 158"/><path class="gr" d="M336 150 L329 158"/><path class="gr" d="M350 150 L343 158"/><path class="gr" d="M364 150 L357 158"/><path class="gr" d="M378 150 L371 158"/><path class="gr" d="M392 150 L385 158"/><rect x="250" y="114" width="52" height="36" rx="3" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><path class="s3" fill="none" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar3)" d="M276 132 L276 70"/><text class="ink" x="276" y="62" text-anchor="middle">F</text><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M236 184 L382 184"/><text class="ink2 sm" x="310" y="178" text-anchor="middle">변위 d</text><text class="ink2 sm" x="310" y="220" text-anchor="middle">θ = 90°,  cos 90° = 0</text><text class="ink bold" x="310" y="242" text-anchor="middle">W = 0</text><path class="ax" d="M424 150 H596"/><path class="gr" d="M424 150 L417 158"/><path class="gr" d="M438 150 L431 158"/><path class="gr" d="M452 150 L445 158"/><path class="gr" d="M466 150 L459 158"/><path class="gr" d="M480 150 L473 158"/><path class="gr" d="M494 150 L487 158"/><path class="gr" d="M508 150 L501 158"/><path class="gr" d="M522 150 L515 158"/><path class="gr" d="M536 150 L529 158"/><path class="gr" d="M550 150 L543 158"/><path class="gr" d="M564 150 L557 158"/><path class="gr" d="M578 150 L571 158"/><path class="gr" d="M592 150 L585 158"/><rect x="450" y="114" width="52" height="36" rx="3" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><path class="s1" fill="none" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar1)" d="M476 132 L414 132"/><text class="ink" x="408" y="137" text-anchor="end">F</text><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M436 184 L582 184"/><text class="ink2 sm" x="510" y="178" text-anchor="middle">변위 d</text><text class="ink2 sm" x="510" y="220" text-anchor="middle">θ = 180°,  cos 180° = −1</text><text class="ink bold" x="510" y="242" text-anchor="middle">W &lt; 0</text><text class="ink2 sm" x="310" y="280" text-anchor="middle">수직항력은 언제나 가운데 경우이고, 운동을 방해하는 마찰력은 언제나 오른쪽 경우다</text>
</svg>