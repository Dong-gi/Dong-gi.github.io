<text class="ink bold" x="16" y="26" text-anchor="start">직선 도선 둘레의 자기장</text><text class="ink2 sm" x="16" y="48" text-anchor="start">오른손 엄지를 전류 방향으로 세우면, 감아쥔 네 손가락이 자기장의 방향이다.</text><text class="ink2 sm" x="16" y="76" text-anchor="start">도선이 화면에 수직일 때 (전류가 나온다)</text><circle cx="170" cy="208" r="32" fill="none" stroke="var(--s1)" stroke-width="2.2"/><path class="s1" fill="none" stroke-width="2.6" marker-end="url(#ar1)" d="M173.34 176.18 A32 32 0 0 0 166.66 176.18"/><circle cx="170" cy="208" r="58" fill="none" stroke="var(--s1)" stroke-width="1.8"/><path class="s1" fill="none" stroke-width="2.2" marker-end="url(#ar1)" d="M176.06 150.32 A58 58 0 0 0 163.94 150.32"/><circle cx="170" cy="208" r="86" fill="none" stroke="var(--s1)" stroke-width="1.4"/><path class="s1" fill="none" stroke-width="1.7999999999999998" marker-end="url(#ar1)" d="M178.99 122.47 A86 86 0 0 0 161.01 122.47"/><circle cx="170" cy="208" r="116" fill="none" stroke="var(--s1)" stroke-width="1.1"/><path class="s1" fill="none" stroke-width="1.5" marker-end="url(#ar1)" d="M182.13 92.64 A116 116 0 0 0 157.87 92.64"/><circle cx="170" cy="208" r="12" fill="none" stroke="var(--s2)" stroke-width="2.2"/><circle cx="170" cy="208" r="3.6" fill="var(--s2)"/><text class="ink" x="190" y="213" text-anchor="start">I</text><text class="ink2 sm" x="16" y="348" text-anchor="start">멀수록 원이 성기다 — B 는 1/r 로 줄어든다</text><path class="gr" d="M330 64 V352"/><text class="ink2 sm" x="360" y="76" text-anchor="start">도선이 화면 안에 있을 때</text><path class="s2" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar2)" d="M498 296 L498 112"/><text class="ink" x="506" y="110" text-anchor="start">I</text><g stroke="var(--s1)" stroke-width="1.5" fill="none"><circle cx="542" cy="152" r="8"/><path d="M536.72 146.72 L547.28 157.28 M536.72 157.28 L547.28 146.72"/></g><g stroke="var(--s1)" stroke-width="1.5" fill="none"><circle cx="542" cy="254" r="8"/><path d="M536.72 248.72 L547.28 259.28 M536.72 259.28 L547.28 248.72"/></g><circle cx="454" cy="152" r="8" fill="none" stroke="var(--s1)" stroke-width="1.5"/><circle cx="454" cy="152" r="2.4" fill="var(--s1)"/><circle cx="454" cy="254" r="8" fill="none" stroke="var(--s1)" stroke-width="1.5"/><circle cx="454" cy="254" r="2.4" fill="var(--s1)"/><g stroke="var(--s1)" stroke-width="1.5" fill="none"><circle cx="580" cy="152" r="8"/><path d="M574.72 146.72 L585.28 157.28 M574.72 157.28 L585.28 146.72"/></g><g stroke="var(--s1)" stroke-width="1.5" fill="none"><circle cx="580" cy="254" r="8"/><path d="M574.72 248.72 L585.28 259.28 M574.72 259.28 L585.28 248.72"/></g><circle cx="416" cy="152" r="8" fill="none" stroke="var(--s1)" stroke-width="1.5"/><circle cx="416" cy="152" r="2.4" fill="var(--s1)"/><circle cx="416" cy="254" r="8" fill="none" stroke="var(--s1)" stroke-width="1.5"/><circle cx="416" cy="254" r="2.4" fill="var(--s1)"/><g stroke="var(--s1)" stroke-width="1.5" fill="none"><circle cx="618" cy="152" r="8"/><path d="M612.72 146.72 L623.28 157.28 M612.72 157.28 L623.28 146.72"/></g><g stroke="var(--s1)" stroke-width="1.5" fill="none"><circle cx="618" cy="254" r="8"/><path d="M612.72 248.72 L623.28 259.28 M612.72 259.28 L623.28 248.72"/></g><circle cx="378" cy="152" r="8" fill="none" stroke="var(--s1)" stroke-width="1.5"/><circle cx="378" cy="152" r="2.4" fill="var(--s1)"/><circle cx="378" cy="254" r="8" fill="none" stroke="var(--s1)" stroke-width="1.5"/><circle cx="378" cy="254" r="2.4" fill="var(--s1)"/><text class="ink2 sm" x="542" y="208" text-anchor="start">오른쪽은 안으로</text><text class="ink2 sm" x="454" y="208" text-anchor="end">왼쪽은 밖으로</text><text class="ink bold" x="360" y="348" text-anchor="start">B = μ<tspan baseline-shift="-22%" font-size="76%">0</tspan> I / (2π r)</text>
</svg>