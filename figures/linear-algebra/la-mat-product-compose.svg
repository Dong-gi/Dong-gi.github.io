roke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="606.4" y="209.52" text-anchor="middle">1</text><path d="M644 190.52 L644 196.52" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="644" y="209.52" text-anchor="middle">2</text><path d="M681.6 190.52 L681.6 196.52" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="681.6" y="209.52" text-anchor="middle">3</text><path d="M719.2 190.52 L719.2 196.52" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="719.2" y="209.52" text-anchor="middle">4</text><path d="M565.8 155.92 L571.8 155.92" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="561.8" y="159.92" text-anchor="end">1</text><path d="M565.8 118.32 L571.8 118.32" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="561.8" y="122.32" text-anchor="end">2</text><path d="M568.8 193.52 L644 193.52 L719.2 155.92 L644 155.92 Z" fill="var(--s3)" fill-opacity="0.2" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M568.8 193.52 L644 193.52"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M568.8 193.52 L644 155.92"/><text class="ink bold sm" x="651" y="185.52" text-anchor="start">ABe<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink bold sm" x="651" y="147.92" text-anchor="start">ABe<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M140 258 L640 258"/><text class="ink bold sm" x="390" y="250" text-anchor="middle">AB 를 한 번 곱한 것과 결과가 같다</text><text class="ink2 sm" x="390" y="286" text-anchor="middle">AB 의 j 번째 열은 A 에 B 의 j 번째 열을 곱한 것이다. 곱의 정의는 이 그림을 좌표로 옮겨 적은 것뿐이다</text><text class="ink2 sm" x="390" y="314" text-anchor="middle">그래서 곱은 오른쪽 것을 먼저 적용한다. AB 는 ‘B 를 하고 나서 A 를 한다’ 는 뜻이다</text>
