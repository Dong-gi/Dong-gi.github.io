<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">대수적 중복도와 기하적 중복도의 차이</title><desc id="d">고유값 3 이 두 번 겹치는 두 행렬. 3I 는 모든 방향이 고유방향이고 전단이 섞인 쪽은 가로축 하나만 남는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="26" text-anchor="middle">고유값이 같아도 제자리 직선에 남는 방향의 개수는 다를 수 있다</text><rect x="12" y="44" width="356" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="190" y="64" text-anchor="middle">고유공간이 평면 전체</text><text class="ink2 sm" x="190" y="81" text-anchor="middle">B = 3I  :  (x, y) → (3x, 3y)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M47 249 L341.6 249"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M189.8 286.8 L189.8 93"/><clipPath id="lasp27"><rect x="47" y="102" width="285.6" height="184.8"/></clipPath><g clip-path="url(#lasp27)"><path d="M152 249 L341 249" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M160.84 273.3 L305.63 151.81" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M189.8 286.8 L189.8 97.8" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M218.76 273.3 L73.97 151.81" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M189.8 249 L315.8 249"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M189.8 249 L231.8 249"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M189.8 249 L286.32 168.01"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M189.8 249 L221.97 222"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M189.8 249 L189.8 123"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M189.8 249 L189.8 207"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M189.8 249 L93.28 168.01"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M189.8 249 L157.63 222"/></g><text class="ink2 sm" x="190" y="302" text-anchor="middle">네 방향 모두 점선 위에 남는다 — 기하적 중복도 2</text><text class="ink bold sm" x="284.84" y="153.96" text-anchor="start">3배만 커진다</text><rect x="392" y="44" width="356" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="570" y="64" text-anchor="middle">고유공간이 직선 하나</text><text class="ink2 sm" x="570" y="81" text-anchor="middle">C  :  (x, y) → (3x + y, 3y)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M427 249 L721.6 249"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M569.8 286.8 L569.8 93"/><clipPath id="lasp28"><rect x="427" y="102" width="285.6" height="184.8"/></clipPath><g clip-path="url(#lasp28)"><path d="M532 249 L721 249" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M540.84 273.3 L685.63 151.81" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M569.8 286.8 L569.8 97.8" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M598.76 273.3 L453.97 151.81" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M569.8 249 L695.8 249"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M569.8 249 L611.8 249"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M569.8 249 L693.32 168.01"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M569.8 249 L601.97 222"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M569.8 249 L611.8 123"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M569.8 249 L569.8 207"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M569.8 249 L500.28 168.01"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M569.8 249 L537.63 222"/></g><text class="ink2 sm" x="570" y="302" text-anchor="middle">가로축 하나만 점선 위에 남는다 — 기하적 중복도 1</text><text class="ink bold sm" x="700" y="273" text-anchor="end">이 방향만 살아남는다</text><text class="ink2 sm" x="621.8" y="125" text-anchor="start">점선을 벗어났다</text><text class="ink2 sm" x="380" y="338" text-anchor="middle">가는 검은 화살표가 넣은 방향, 굵은 화살표가 나온 방향이다. 두 행렬 모두 고유값은 λ = 3 하나뿐이고 대수적 중복도는 2다</text>
</svg>