<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 336" width="780" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">AP = PD 를 열 단위로 읽는다</title><desc id="d">AP 의 j 열은 A p_j 이고 PD 의 j 열은 lambda_j p_j 이므로 두 행렬이 같다는 것은 열마다 고유벡터 관계가 성립한다는 뜻이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">AP = PD 는 열마다 A p<tspan baseline-shift="-22%" font-size="76%">j</tspan> = λ<tspan baseline-shift="-22%" font-size="76%">j</tspan> p<tspan baseline-shift="-22%" font-size="76%">j</tspan> 라는 말이다</text><rect x="12" y="44" width="340" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="182" y="64" text-anchor="middle">P 의 두 열을 A 에 통과시킨다</text><text class="ink2 sm" x="182" y="81" text-anchor="middle">A  :  (x, y) → (4x − y, 2x + y)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M99 257.6 L273.6 257.6"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M127.8 286.4 L127.8 83"/><path d="M163.8 254.6 L163.8 260.6" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="163.8" y="272.6" text-anchor="middle">1</text><path d="M199.8 254.6 L199.8 260.6" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="199.8" y="272.6" text-anchor="middle">2</text><path d="M235.8 254.6 L235.8 260.6" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="235.8" y="272.6" text-anchor="middle">3</text><path d="M124.8 221.6 L130.8 221.6" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="120.8" y="225.6" text-anchor="end">1</text><path d="M124.8 185.6 L130.8 185.6" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="120.8" y="189.6" text-anchor="end">2</text><path d="M124.8 149.6 L130.8 149.6" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="120.8" y="153.6" text-anchor="end">3</text><path d="M124.8 113.6 L130.8 113.6" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="120.8" y="117.6" text-anchor="end">4</text><path d="M102.6 282.8 L261 124.4" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M115.2 282.8 L208.8 95.6" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path fill="none" stroke="var(--s1)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar1)" d="M127.8 257.6 L235.8 149.6"/><path fill="none" stroke="var(--s2)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar2)" d="M127.8 257.6 L199.8 113.6"/><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M127.8 257.6 L163.8 221.6"/><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M127.8 257.6 L163.8 185.6"/><text class="ink2 sm" x="176.8" y="232.6" text-anchor="start">p<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="f1 bold sm" x="237.8" y="169.6" text-anchor="start">A p<tspan baseline-shift="-22%" font-size="76%">1</tspan> = 3 p<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink2 sm" x="141.8" y="187.6" text-anchor="start">p<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="f2 bold sm" x="208.8" y="117.6" text-anchor="start">A p<tspan baseline-shift="-22%" font-size="76%">2</tspan> = 2 p<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="182" y="302" text-anchor="middle">두 화살표 모두 제 점선 위에 남고 길이만 λ 배가 된다</text><rect x="364" y="44" width="404" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="566" y="64" text-anchor="middle">같은 사실을 열로 적으면</text><text class="ink2 sm" x="566" y="81" text-anchor="middle">j 열끼리만 견주면 된다</text><text class="ink bold sm" x="442" y="134" text-anchor="end">AP =</text><rect x="456" y="106" width="250" height="46" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.3"/><path d="M581 106 L581 152" fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="f1 bold sm" x="518.5" y="134" text-anchor="middle">A p<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="f2 bold sm" x="643.5" y="134" text-anchor="middle">A p<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink bold sm" x="442" y="204" text-anchor="end">PD =</text><rect x="456" y="176" width="250" height="46" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.3"/><path d="M581 176 L581 222" fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="f1 bold sm" x="518.5" y="204" text-anchor="middle">λ<tspan baseline-shift="-22%" font-size="76%">1</tspan> p<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="f2 bold sm" x="643.5" y="204" text-anchor="middle">λ<tspan baseline-shift="-22%" font-size="76%">2</tspan> p<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="566" y="172" text-anchor="middle">위아래가 같아야 한다</text><path d="M518.5 240 L518.5 258" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M643.5 240 L643.5 258" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="518.5" y="278" text-anchor="middle">A p<tspan baseline-shift="-22%" font-size="76%">1</tspan> = λ<tspan baseline-shift="-22%" font-size="76%">1</tspan> p<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink bold sm" x="643.5" y="278" text-anchor="middle">A p<tspan baseline-shift="-22%" font-size="76%">2</tspan> = λ<tspan baseline-shift="-22%" font-size="76%">2</tspan> p<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="566" y="302" text-anchor="middle">그래서 P 의 열은 고유벡터, D 의 대각성분은 그 고유값이어야 한다</text>
</svg>