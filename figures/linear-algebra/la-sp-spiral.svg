<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 316" width="744" height="316" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">켤레복소 고유값은 회전과 확대의 합성이다</title><desc id="d">고유값의 편각이 회전각을, 크기가 확대율을 정한다. 크기가 1 보다 크면 나선이 밖으로 감긴다</desc>
<style>
