<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 316" width="770" height="316" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">내적의 부호와 두 벡터가 이루는 각</title><desc id="d">예각이면 내적이 양수, 직각이면 0, 둔각이면 음수다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="385" y="26" text-anchor="middle">내적의 부호가 곧 두 벡터가 이루는 각의 종류다</text><rect x="18" y="44" width="234" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="135" y="64" text-anchor="middle">예각 — 내적이 양수</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M48 189.2 L250 189.2"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M124.8 218 L124.8 80"/><path d="M163.2 122.64 L163.2 197.2" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M124.8 197.2 L163.2 197.2" fill="none" stroke="var(--s3)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M124.8 189.2 L220.8 189.2"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M124.8 189.2 L163.2 122.64"/><path d="M158.8 189.2 A34 34 0 0 0 141.79 159.75" fill="none" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="167.23" y="168.69" text-anchor="middle">θ = 60°</text><text class="ink bold sm" x="224.8" y="206.2" text-anchor="middle">u</text><text class="ink bold sm" x="171.2" y="116.64" text-anchor="start">v</text><text class="ink bold sm" x="135" y="226" text-anchor="middle">u · v = 3.6 &gt; 0</text><text class="ink2 sm" x="135" y="244" text-anchor="middle">굵은 선분이 v 의 그림자</text><rect x="268" y="44" width="234" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="385" y="64" text-anchor="middle">직각 — 내적이 0</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M298 189.2 L500 189.2"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M374.8 218 L374.8 80"/><path d="M374.8 112.4 L374.8 197.2" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M374.8 197.2 L374.8 197.2" fill="none" stroke="var(--s3)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M374.8 189.2 L470.8 189.2"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M374.8 189.2 L374.8 112.4"/><path d="M408.8 189.2 A34 34 0 0 0 374.8 155.2" fill="none" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="409.45" y="158.55" text-anchor="middle">θ = 90°</text><text class="ink bold sm" x="474.8" y="206.2" text-anchor="middle">u</text><text class="ink bold sm" x="382.8" y="106.4" text-anchor="start">v</text><text class="ink bold sm" x="385" y="226" text-anchor="middle">u · v = 0</text><text class="ink2 sm" x="385" y="244" text-anchor="middle">그림자의 길이가 0 이다</text><rect x="518" y="44" width="234" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="635" y="64" text-anchor="middle">둔각 — 내적이 음수</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M548 189.2 L750 189.2"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M624.8 218 L624.8 80"/><path d="M586.4 122.64 L586.4 197.2" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M624.8 197.2 L586.4 197.2" fill="none" stroke="var(--s3)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M624.8 189.2 L720.8 189.2"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M624.8 189.2 L586.4 122.64"/><path d="M658.8 189.2 A34 34 0 0 0 607.81 159.75" fill="none" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="649.31" y="150.77" text-anchor="middle">θ = 120°</text><text class="ink bold sm" x="724.8" y="206.2" text-anchor="middle">u</text><text class="ink bold sm" x="578.4" y="116.64" text-anchor="end">v</text><text class="ink bold sm" x="635" y="226" text-anchor="middle">u · v = −3.6 &lt; 0</text><text class="ink2 sm" x="635" y="244" text-anchor="middle">굵은 선분이 v 의 그림자</text><text class="ink2 sm" x="385" y="304" text-anchor="middle">내적은 ‘v 를 u 위에 내린 그림자의 길이’ 에 ‘u 의 길이’ 를 곱한 값이다. 그림자가 u 와 반대쪽을 향하면 음수가 된다</text>
</svg>