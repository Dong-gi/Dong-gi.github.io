<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 366" width="780" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">행렬이 만드는 네 부분공간의 직교 관계</title><desc id="d">행공간과 영공간이 직교하고 열공간과 왼쪽 영공간이 직교하며 A 는 행공간을 열공간으로 일대일로 옮긴다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">행렬 하나가 만드는 네 부분공간 — 양쪽 모두 직각으로 갈린다</text><rect x="18" y="46" width="286" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="161" y="66" text-anchor="middle">정의역 쪽 — R^n</text><text class="ink2 sm" x="161" y="82" text-anchor="middle">x 가 사는 곳</text><path d="M69 176 L253 176" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M161 120 L161 232" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M174 176 L174 163 L161 163" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="161" cy="176" r="4.5" fill="var(--ink)"/><text class="ink bold sm" x="251" y="154" text-anchor="end">행공간 Row(A)</text><text class="ink2 sm" x="251" y="196" text-anchor="end">차원 r</text><text class="ink bold sm" x="161" y="110" text-anchor="middle">영공간 N(A)</text><text class="ink2 sm" x="161" y="252" text-anchor="middle">차원 n − r</text><text class="ink2 sm" x="153" y="194" text-anchor="end">0</text><text class="ink2 sm" x="161" y="280" text-anchor="middle">Ax = 0 은 모든 행과의 내적이 0 이라는 뜻이다</text><rect x="476" y="46" width="286" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="619" y="66" text-anchor="middle">공역 쪽 — R^m</text><text class="ink2 sm" x="619" y="82" text-anchor="middle">Ax 와 b 가 사는 곳</text><path d="M527 176 L711 176" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M619 120 L619 232" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M632 176 L632 163 L619 163" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="619" cy="176" r="4.5" fill="var(--ink)"/><text class="ink bold sm" x="709" y="154" text-anchor="end">열공간 Col(A)</text><text class="ink2 sm" x="709" y="196" text-anchor="end">차원 r</text><text class="ink bold sm" x="619" y="110" text-anchor="middle">왼쪽 영공간</text><text class="ink2 sm" x="619" y="252" text-anchor="middle">차원 m − r</text><text class="ink2 sm" x="611" y="194" text-anchor="end">0</text><text class="ink2 sm" x="619" y="280" text-anchor="middle">왼쪽 영공간은 A 의 전치의 영공간이다</text><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M312 146 L468 146"/><text class="ink bold sm" x="390" y="136" text-anchor="middle">A — 일대일로 옮긴다</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="5 4" d="M312 222 L613 180"/><text class="ink2 sm" x="380" y="250" text-anchor="middle">A — 전부 0 으로 보낸다</text><text class="ink2 sm" x="390" y="336" text-anchor="middle">왼쪽 두 공간의 차원을 더하면 n 이다. 이것이 계수-퇴화차수 정리를 직교로 다시 읽은 것이다</text><text class="ink2 sm" x="390" y="354" text-anchor="middle">최소제곱에서 쓰는 것은 오른쪽 그림이다. 잔차가 열공간과 직교한다는 말은 잔차가 왼쪽 영공간에 있다는 말과 같다</text>
</svg>