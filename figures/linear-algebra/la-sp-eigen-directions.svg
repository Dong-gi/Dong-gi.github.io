<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" width="760" height="326" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">고유벡터는 방향을 유지한다</title><desc id="d">보통의 벡터는 변환 뒤 방향이 틀어지지만 고유벡터는 같은 직선 위에 머문다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="26" text-anchor="middle">거의 모든 방향은 틀어진다. 틀어지지 않는 방향이 고유벡터다</text><rect x="12" y="44" width="356" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="190" y="64" text-anchor="middle">방향이 바뀌는 벡터</text><text class="ink2 sm" x="190" y="81" text-anchor="middle">화살표가 원래 방향에서 벗어난다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M91 219.4 L297.6 219.4"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M148 291.6 L148 85"/><path d="M148 219.4 L225.52 180.64" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M148 219.4 L186 219.4"/><path fill="none" stroke="var(--s1)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar1)" d="M148 219.4 L224 181.4"/><path d="M200 219.4 A52 52 0 0 0 194.51 196.14" fill="none" stroke="var(--ink2)" stroke-width="1.3"/><path d="M148 219.4 L186.76 141.88" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M148 219.4 L148 181.4"/><path fill="none" stroke="var(--s2)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar2)" d="M148 219.4 L186 143.4"/><path d="M148 167.4 A52 52 0 0 1 171.26 172.89" fill="none" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="206.9" y="208" text-anchor="start">틀어진 만큼</text><text class="ink2 sm" x="184" y="236.4" text-anchor="start">x</text><text class="ink sm" x="231" y="185.4" text-anchor="start">A x</text><text class="ink2 sm" x="130" y="185.4" text-anchor="start">y</text><text class="ink sm" x="192" y="139.4" text-anchor="start">A y</text><text class="ink2 sm" x="190" y="298" text-anchor="middle">Ax 는 x 의 배수가 아니다</text><rect x="392" y="44" width="356" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="570" y="64" text-anchor="middle">방향이 그대로인 벡터</text><text class="ink2 sm" x="570" y="81" text-anchor="middle">Ax 가 x 와 같은 직선 위에 있다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M471 219.4 L677.6 219.4"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M528 291.6 L528 85"/><path d="M482.4 265 L649.6 97.8" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M482.4 173.8 L611.6 303" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path fill="none" stroke="var(--s1)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar1)" d="M528 219.4 L642 105.4"/><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M528 219.4 L566 181.4"/><path fill="none" stroke="var(--s2)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar2)" d="M528 219.4 L566 257.4"/><text class="ink2 sm" x="544" y="181.4" text-anchor="start">b₁</text><text class="ink bold sm" x="622" y="95.4" text-anchor="start">A b₁ = 3b₁</text><text class="ink bold sm" x="574" y="265.4" text-anchor="start">A b₂ = b₂</text><text class="ink2 sm" x="570" y="298" text-anchor="middle">길이만 λ 배로 바뀐다 (λ = 3 과 λ = 1)</text>
</svg>