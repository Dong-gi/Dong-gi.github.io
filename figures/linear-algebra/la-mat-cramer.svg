<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 396" width="700" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">크라메르 공식의 넓이 그림</title><desc id="d">한 열을 상수 벡터로 바꾼 행렬의 행렬식은 원래 행렬식의 미지수 배가 된다</desc>
<style>
