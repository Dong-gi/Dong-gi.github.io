<text class="ink bold" x="350" y="26" text-anchor="middle">크라메르 공식 — 미지수는 두 넓이의 비다</text><rect x="20" y="44" width="310" height="294" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="175" y="64" text-anchor="middle">첫 열을 b 로 바꾼다</text><text class="ink2 sm" x="175" y="80" text-anchor="middle">넓이 6 ÷ 넓이 3 = 2</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M66 262.8 L292 262.8"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M82.2 279 L82.2 80"/><path d="M136.2 259.8 L136.2 265.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="136.2" y="278.8" text-anchor="middle">2</text><path d="M190.2 259.8 L190.2 265.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="190.2" y="278.8" text-anchor="middle">4</text><path d="M244.2 259.8 L244.2 265.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="244.2" y="278.8" text-anchor="middle">6</text><path d="M79.2 208.8 L85.2 208.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="75.2" y="212.8" text-anchor="end">2</text><path d="M79.2 154.8 L85.2 154.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="75.2" y="158.8" text-anchor="end">4</text><path d="M79.2 100.8 L85.2 100.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="75.2" y="104.8" text-anchor="end">6</text><path d="M82.2 262.8 L217.2 154.8 L244.2 100.8 L109.2 208.8 Z" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.5" stroke-linejoin="round"/><path d="M82.2 262.8 L136.2 235.8 L163.2 181.8 L109.2 208.8 Z" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.6" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M82.2 262.8 L136.2 235.8"/><path fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M82.2 262.8 L109.2 208.8"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M82.2 262.8 L217.2 154.8"/><text class="ink bold sm" x="225.2" y="150.8" text-anchor="start">b</text><text class="ink bold sm" x="148.2" y="241.8" text-anchor="start">a<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink bold sm" x="103.2" y="202.8" text-anchor="end">a<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink bold sm" x="174" y="165.6" text-anchor="middle">넓이 6</text><text class="ink bold sm" x="117.3" y="219.6" text-anchor="middle">3</text><text class="ink bold sm" x="175" y="316" text-anchor="middle">x<tspan baseline-shift="-22%" font-size="76%">1</tspan> = 6 ÷ 3 = 2</text><rect x="352" y="44" width="310" height="294" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="507" y="64" text-anchor="middle">둘째 열을 b 로 바꾼다</text><text class="ink2 sm" x="507" y="80" text-anchor="middle">넓이 3 ÷ 넓이 3 = 1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M398 262.8 L624 262.8"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M414.2 279 L414.2 80"/><path d="M468.2 259.8 L468.2 265.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="468.2" y="278.8" text-anchor="middle">2</text><path d="M522.2 259.8 L522.2 265.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="522.2" y="278.8" text-anchor="middle">4</text><path d="M576.2 259.8 L576.2 265.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="576.2" y="278.8" text-anchor="middle">6</text><path d="M411.2 208.8 L417.2 208.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="407.2" y="212.8" text-anchor="end">2</text><path d="M411.2 154.8 L417.2 154.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="407.2" y="158.8" text-anchor="end">4</text><path d="M411.2 100.8 L417.2 100.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="407.2" y="104.8" text-anchor="end">6</text><path d="M414.2 262.8 L468.2 235.8 L603.2 127.8 L549.2 154.8 Z" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.5" stroke-linejoin="round"/><path d="M414.2 262.8 L468.2 235.8 L495.2 181.8 L441.2 208.8 Z" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.6" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M414.2 262.8 L468.2 235.8"/><path fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M414.2 262.8 L441.2 208.8"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M414.2 262.8 L549.2 154.8"/><text class="ink bold sm" x="557.2" y="150.8" text-anchor="start">b</text><text class="ink bold sm" x="533" y="192.6" text-anchor="middle">넓이 3</text><text class="ink bold sm" x="449.3" y="219.6" text-anchor="middle">3</text><text class="ink bold sm" x="507" y="316" text-anchor="middle">x<tspan baseline-shift="-22%" font-size="76%">2</tspan> = 3 ÷ 3 = 1</text><text class="ink2 sm" x="350" y="366" text-anchor="middle">b = 2a<tspan baseline-shift="-22%" font-size="76%">1</tspan> + 1·a<tspan baseline-shift="-22%" font-size="76%">2</tspan> 이므로 b 와 a<tspan baseline-shift="-22%" font-size="76%">2</tspan> 가 만드는 넓이는 2a<tspan baseline-shift="-22%" font-size="76%">1</tspan> 과 a<tspan baseline-shift="-22%" font-size="76%">2</tspan> 가 만드는 넓이와 같다</text><text class="ink2 sm" x="350" y="384" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">2</tspan> 방향으로 미는 것은 넓이를 바꾸지 않기 때문이다. 그 넓이는 원래 넓이의 x<tspan baseline-shift="-22%" font-size="76%">1</tspan> 배다</text>
