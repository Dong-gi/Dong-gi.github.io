<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 348" width="748" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">기본 행 연산이 행렬식에 하는 일</title><desc id="d">배수는 행렬식을 그만큼 곱하고, 교환은 부호를 바꾸며, 다른 행의 배수를 더하는 것은 행렬식을 바꾸지 않는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="374" y="26" text-anchor="middle">기본 행 연산 세 가지가 넓이에 하는 일</text><rect x="16" y="44" width="222" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="127" y="64" text-anchor="middle">한 행을 2배 한다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M48 221.5 L208 221.5"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M60.5 234 L60.5 74"/><path d="M110.5 218.5 L110.5 224.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="110.5" y="237.5" text-anchor="middle">2</text><path d="M160.5 218.5 L160.5 224.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="160.5" y="237.5" text-anchor="middle">4</text><path d="M57.5 171.5 L63.5 171.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="53.5" y="175.5" text-anchor="end">2</text><path d="M57.5 121.5 L63.5 121.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="53.5" y="125.5" text-anchor="end">4</text><path d="M60.5 221.5 L110.5 196.5 L135.5 146.5 L85.5 171.5 Z" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M60.5 221.5 L110.5 196.5 L160.5 96.5 L110.5 121.5 Z" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.5" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M60.5 221.5 L110.5 196.5"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M60.5 221.5 L110.5 121.5"/><text class="ink bold sm" x="127" y="254" text-anchor="middle">넓이도 2배</text><text class="ink2 sm" x="127" y="274" text-anchor="middle">det 3 → 6</text><rect x="262" y="44" width="222" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="373" y="64" text-anchor="middle">두 행을 바꾼다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M294 221.5 L454 221.5"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M306.5 234 L306.5 74"/><path d="M356.5 218.5 L356.5 224.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="356.5" y="237.5" text-anchor="middle">2</text><path d="M406.5 218.5 L406.5 224.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="406.5" y="237.5" text-anchor="middle">4</text><path d="M303.5 171.5 L309.5 171.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="299.5" y="175.5" text-anchor="end">2</text><path d="M303.5 121.5 L309.5 121.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="299.5" y="125.5" text-anchor="end">4</text><path d="M306.5 221.5 L356.5 196.5 L381.5 146.5 L331.5 171.5 Z" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.5" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M306.5 221.5 L331.5 171.5"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M306.5 221.5 L356.5 196.5"/><path d="M325.28 183.93 A42 42 0 0 1 344.07 202.72" fill="none" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="346.81" y="185.19" text-anchor="middle">방향이 뒤집힌다</text><text class="ink bold sm" x="373" y="254" text-anchor="middle">넓이는 그대로</text><text class="ink2 sm" x="373" y="274" text-anchor="middle">det 3 → −3</text><rect x="508" y="44" width="222" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="619" y="64" text-anchor="middle">한 행의 배수를 다른 행에 더한다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M540 221.5 L700 221.5"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M552.5 234 L552.5 74"/><path d="M602.5 218.5 L602.5 224.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="602.5" y="237.5" text-anchor="middle">2</text><path d="M652.5 218.5 L652.5 224.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="652.5" y="237.5" text-anchor="middle">4</text><path d="M549.5 171.5 L555.5 171.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="545.5" y="175.5" text-anchor="end">2</text><path d="M549.5 121.5 L555.5 121.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="545.5" y="125.5" text-anchor="end">4</text><path d="M552.5 221.5 L602.5 196.5 L627.5 146.5 L577.5 171.5 Z" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M552.5 221.5 L602.5 196.5 L677.5 121.5 L627.5 146.5 Z" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.5" stroke-linejoin="round"/><path d="M557.5 169 L667.5 114" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M552.5 221.5 L602.5 196.5"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M552.5 221.5 L627.5 146.5"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M577.5 171.5 L621.25 149.75"/><text class="ink bold sm" x="619" y="254" text-anchor="middle">밑변도 높이도 그대로</text><text class="ink2 sm" x="619" y="274" text-anchor="middle">det 3 → 3</text><text class="ink2 sm" x="374" y="318" text-anchor="middle">오른쪽이 소거법의 핵심이다. v 를 u 와 나란한 방향으로 밀어도 밑변과 높이가 변하지 않으므로 넓이가 보존된다</text><text class="ink2 sm" x="374" y="336" text-anchor="middle">그래서 배수를 더하는 소거를 아무리 해도 행렬식은 바뀌지 않는다</text>
</svg>