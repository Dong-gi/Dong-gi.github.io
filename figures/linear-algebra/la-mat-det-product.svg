--s3)" fill-opacity="0.24" stroke="var(--s3)" stroke-width="1.6" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M506 146 L528 146"/><text class="ink bold sm" x="517" y="134" text-anchor="middle">A</text><rect x="532" y="46" width="224" height="180" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="644" y="66" text-anchor="middle">다시 A 를 적용</text><text class="ink2 sm" x="644" y="82" text-anchor="middle">넓이 4 = det A · det B</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M554 192.8 L754 192.8"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M569.2 208 L569.2 84"/><path d="M607.2 189.8 L607.2 195.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="607.2" y="208.8" text-anchor="middle">1</text><path d="M645.2 189.8 L645.2 195.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="645.2" y="208.8" text-anchor="middle">2</text><path d="M683.2 189.8 L683.2 195.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="683.2" y="208.8" text-anchor="middle">3</text><path d="M721.2 189.8 L721.2 195.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="721.2" y="208.8" text-anchor="middle">4</text><path d="M566.2 154.8 L572.2 154.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="562.2" y="158.8" text-anchor="end">1</text><path d="M566.2 116.8 L572.2 116.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="562.2" y="120.8" text-anchor="end">2</text><path d="M569.2 192.8 L645.2 192.8 L721.2 116.8 L645.2 116.8 Z" fill="var(--s3)" fill-opacity="0.24" stroke="var(--s3)" stroke-width="1.6" stroke-linejoin="round"/><text class="ink bold sm" x="390" y="254" text-anchor="middle">det B = 2 로 두 배, det A = 2 로 다시 두 배 → 모두 네 배</text><text class="ink2 sm" x="390" y="288" text-anchor="middle">이것이 det(AB) = det A · det B 의 전부다. 배율을 두 번 겪으면 배율이 곱해진다</text>
