.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="26" text-anchor="middle">핵은 0 으로 눌리는 방향, 상은 도달할 수 있는 곳</text><rect x="12" y="44" width="356" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="190" y="64" text-anchor="middle">정의역</text><text class="ink2 sm" x="190" y="81" text-anchor="middle">T(x, y) = (x + y, x + y)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M86 198 L303 198"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M190 302 L190 85"/><path d="M94 102 L286 294" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M174 102 L286 214" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><circle cx="270" cy="198" r="4.6" fill="var(--s1)"/><circle cx="230" cy="158" r="4.6" fill="var(--s1)"/><circle cx="190" cy="118" r="4.6" fill="var(--s1)"/><path fill="none" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar3)" d="M190 198 L246 254"/><text class="ink bold sm" x="236" y="274" text-anchor="start">핵 : x + y = 0</text><text class="ink sm" x="210" y="110" text-anchor="start">x + y = 2 인 점들</text><text class="ink2 sm" x="190" y="302" text-anchor="middle">점선 위의 점은 모두 같은 곳으로 간다</text><rect x="392" y="44" width="356" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="570" y="64" text-anchor="middle">공역</text><text class="ink2 sm" x="570" y="81" text-anchor="middle">상 = 직선 y = x</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M466 198 L683 198"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M570 302 L570 85"/><path d="M474 294 L666 102" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650" cy="118" r="5.6" fill="var(--s1)"/><circle cx="570" cy="198" r="5.6" fill="var(--s3)"/><text class="ink sm" x="642" y="106" text-anchor="start">(2, 2)</text><text class="ink bold sm" x="580" y="216" text-anchor="start">핵은 전부 여기로</text><text class="ink bold sm" x="482" y="258" text-anchor="start">상 = 열공간</text><text class="ink2 sm" x="570" y="302" text-anchor="middle">직선 밖의 점에는 도달하지 못한다</text>
</svg>