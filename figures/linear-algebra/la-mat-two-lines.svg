<text class="ink bold" x="385" y="26" text-anchor="middle">두 직선이 놓일 수 있는 방법은 세 가지뿐이다</text><rect x="18" y="44" width="234" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="135" y="64" text-anchor="middle">해가 하나</text><text class="ink2 sm" x="135" y="80" text-anchor="middle">한 점에서 만난다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M60 222 L217 222"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M81 243 L81 86"/><path d="M111 219 L111 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="111" y="238" text-anchor="middle">1</text><path d="M141 219 L141 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="141" y="238" text-anchor="middle">2</text><path d="M171 219 L171 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="171" y="238" text-anchor="middle">3</text><path d="M78 192 L84 192" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="74" y="196" text-anchor="end">1</text><path d="M78 162 L84 162" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="74" y="166" text-anchor="end">2</text><path d="M78 132 L84 132" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="74" y="136" text-anchor="end">3</text><text class="ink2 sm" x="221" y="226" text-anchor="start">x</text><text class="ink2 sm" x="90" y="99" text-anchor="start">y</text><path d="M60 111 L192 243" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M207 126 L90 243" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="141" cy="192" r="5.5" fill="var(--s3)"/><text class="ink bold sm" x="151" y="183" text-anchor="start">(2, 1)</text><text class="ink2 sm" x="135" y="270" text-anchor="middle">x + y = 3</text><text class="ink2 sm" x="135" y="290" text-anchor="middle">x − y = 1</text><rect x="268" y="44" width="234" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="385" y="64" text-anchor="middle">해가 없다</text><text class="ink2 sm" x="385" y="80" text-anchor="middle">나란해서 만나지 않는다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M310 222 L467 222"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M331 243 L331 86"/><path d="M361 219 L361 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="361" y="238" text-anchor="middle">1</text><path d="M391 219 L391 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="391" y="238" text-anchor="middle">2</text><path d="M421 219 L421 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="421" y="238" text-anchor="middle">3</text><path d="M328 192 L334 192" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="324" y="196" text-anchor="end">1</text><path d="M328 162 L334 162" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="324" y="166" text-anchor="end">2</text><path d="M328 132 L334 132" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="324" y="136" text-anchor="end">3</text><text class="ink2 sm" x="471" y="226" text-anchor="start">x</text><text class="ink2 sm" x="340" y="99" text-anchor="start">y</text><path d="M310 111 L442 243" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 171 L382 243" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="385" y="270" text-anchor="middle">x + y = 3</text><text class="ink2 sm" x="385" y="290" text-anchor="middle">x + y = 1</text><rect x="518" y="44" width="234" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="635" y="64" text-anchor="middle">해가 무수히 많다</text><text class="ink2 sm" x="635" y="80" text-anchor="middle">두 식이 같은 직선이다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M560 222 L717 222"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M581 243 L581 86"/><path d="M611 219 L611 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="611" y="238" text-anchor="middle">1</text><path d="M641 219 L641 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="641" y="238" text-anchor="middle">2</text><path d="M671 219 L671 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="671" y="238" text-anchor="middle">3</text><path d="M578 192 L584 192" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="574" y="196" text-anchor="end">1</text><path d="M578 162 L584 162" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="574" y="166" text-anchor="end">2</text><path d="M578 132 L584 132" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="574" y="136" text-anchor="end">3</text><text class="ink2 sm" x="721" y="226" text-anchor="start">x</text><text class="ink2 sm" x="590" y="99" text-anchor="start">y</text><path d="M560 111 L692 243" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 111 L692 243" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text class="ink2 sm" x="635" y="270" text-anchor="middle">x + y = 3</text><text class="ink2 sm" x="635" y="290" text-anchor="middle">2x + 2y = 6</text><text class="ink2 sm" x="385" y="336" text-anchor="middle">미지수가 둘인 일차방정식 하나는 직선 하나다. 연립방정식을 푼다는 것은 직선들의 공통점을 찾는 일이고, 그래서 답의 개수는 0 · 1 · 무한 셋뿐이다</text>
</svg>