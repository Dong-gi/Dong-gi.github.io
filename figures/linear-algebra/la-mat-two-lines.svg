<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 348" width="770" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">연립일차방정식의 해가 놓이는 세 경우</title><desc id="d">두 직선이 한 점에서 만나면 해가 하나, 나란하면 해가 없고, 겹치면 해가 무수히 많다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
