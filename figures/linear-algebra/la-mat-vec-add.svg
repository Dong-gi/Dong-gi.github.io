<text class="ink bold" x="385" y="26" text-anchor="middle">벡터의 세 가지 기본 동작</text><rect x="18" y="44" width="234" height="214" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="135" y="64" text-anchor="middle">합 — 이어 붙인다</text><text class="ink2 sm" x="135" y="80" text-anchor="middle">u + v = (4, 3)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M46 210.8 L227.6 210.8"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M65.8 230.6 L65.8 82"/><path d="M131.8 207.8 L131.8 213.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="131.8" y="226.8" text-anchor="middle">2</text><path d="M197.8 207.8 L197.8 213.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="197.8" y="226.8" text-anchor="middle">4</text><path d="M62.8 144.8 L68.8 144.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="58.8" y="148.8" text-anchor="end">2</text><path d="M65.8 210.8 L164.8 177.8 L197.8 111.8 L98.8 144.8 Z" fill="var(--s3)" fill-opacity="0.12" stroke="var(--ink2)" stroke-width="1" stroke-linejoin="round" stroke-dasharray="4 3"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M65.8 210.8 L164.8 177.8"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M164.8 177.8 L197.8 111.8"/><path fill="none" stroke="var(--s3)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar3)" d="M65.8 210.8 L197.8 111.8"/><text class="ink bold sm" x="118.6" y="197.6" text-anchor="start">u</text><text class="ink bold sm" x="184.6" y="148.1" text-anchor="start">v</text><text class="ink bold sm" x="121.9" y="15