<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 306" width="770" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">벡터의 합과 차와 스칼라배</title><desc id="d">합은 화살표를 이어 붙인 것, 차는 한 끝에서 다른 끝으로 가는 화살표, 스칼라배는 길이만 바꾼 것이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
