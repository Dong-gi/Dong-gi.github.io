x="385.1" y="222.35" text-anchor="middle">원점으로 옮긴 같은 벡터</text><rect x="518" y="44" width="234" height="214" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="635" y="64" text-anchor="middle">스칼라배 — 길이만 바뀐다</text><text class="ink2 sm" x="635" y="80" text-anchor="middle">방향은 그대로거나 정반대</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M544 158.4 L726.8 158.4"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M611.2 196.8 L611.2 86"/><path d="M659.2 155.4 L659.2 161.4" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="659.2" y="174.4" text-anchor="middle">2</text><path d="M707.2 155.4 L707.2 161.4" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="707.2" y="174.4" text-anchor="middle">4</text><path d="M608.2 110.4 L614.2 110.4" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="604.2" y="114.4" text-anchor="end">2</text><path fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar2)" d="M611.2 158.4 L707.2 110.4"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M611.2 158.4 L659.2 134.4"/><path fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M611.2 158.4 L635.2 146.4"/><path fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="5 4" d="M611.2 158.4 L563.2 182.4"/><text class="ink bold sm" x="709.6" y="104.4" text-anchor="start">2u</text><text class="ink bold sm" x="661.6" y="150.4" text-anchor="start">u</text><text class="ink bold sm" x="636.4" y="166.4" text-anchor="middle">½u</text><text class="ink bold sm" x="562" y="200.4" text-anchor="middle">−u</text><text class="ink2 sm" x="385" y="294" text-anchor="middle">이 두 동작(합과 스칼라배)만으로 벡터로 할 수 있는 일이 정해진다. 6장에서 벡터공간을 정의할 때 공리로 삼는 것이 바로 이 둘이다</text>
