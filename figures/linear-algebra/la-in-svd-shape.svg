<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 344" width="776" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">특이값 분해에서 각 조각의 크기</title><desc id="d">완전형과 축소형에서 U 시그마 V의 전치가 각각 어떤 크기인지 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="388" y="26" text-anchor="middle">A = U Σ V^T — 세 조각의 크기</text><rect x="14" y="44" width="402" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="215" y="64" text-anchor="middle">완전형</text><text class="ink2 sm" x="215" y="80" text-anchor="middle">U 와 V 가 정사각 직교행렬이다</text><rect x="70.5" y="106" width="51" height="85" rx="3" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="96" y="98" text-anchor="middle">A</text><text class="ink2 sm" x="96" y="211" text-anchor="middle">m × n</text><text class="ink bold" x="130" y="153.5" text-anchor="middle">=</text><rect x="138.5" y="106" width="85" height="85" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="181" y="98" text-anchor="middle">U</text><text class="ink2 sm" x="181" y="211" text-anchor="middle">m × m</text><text class="ink bold" x="232" y="153.5" text-anchor="middle">×</text><rect x="240.5" y="106" width="51" height="85" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><rect x="240.5" y="106" width="17" height="17" rx="1" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="0.8"/><rect x="257.5" y="123" width="17" height="17" rx="1" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="0.8"/><rect x="274.5" y="140" width="17" height="17" rx="1" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="0.8"/><text class="ink2 sm" x="266" y="183" text-anchor="middle">0</text><text class="ink bold sm" x="266" y="98" text-anchor="middle">Σ</text><text class="ink2 sm" x="266" y="211" text-anchor="middle">m × n</text><text class="ink bold" x="300" y="153.5" text-anchor="middle">×</text><rect x="308.5" y="123" width="51" height="51" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="334" y="98" text-anchor="middle">V^T</text><text class="ink2 sm" x="334" y="211" text-anchor="middle">n × n</text><rect x="430" y="44" width="332" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="596" y="64" text-anchor="middle">축소형</text><text class="ink2 sm" x="596" y="80" text-anchor="middle">0 만 있는 부분을 잘라낸 것 (r = 계수)</text><rect x="485.5" y="106" width="51" height="85" rx="3" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="511" y="98" text-anchor="middle">A</text><text class="ink2 sm" x="511" y="211" text-anchor="middle">m × n</text><text class="ink bold" x="545" y="153.5" text-anchor="middle">=</text><rect x="553.5" y="106" width="34" height="85" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="570.5" y="98" text-anchor="middle">U<tspan baseline-shift="-22%" font-size="76%">r</tspan></text><text class="ink2 sm" x="570.5" y="211" text-anchor="middle">m × r</text><text class="ink bold" x="596" y="153.5" text-anchor="middle">×</text><rect x="604.5" y="131.5" width="34" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><rect x="604.5" y="131.5" width="17" height="17" rx="1" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="0.8"/><rect x="621.5" y="148.5" width="17" height="17" rx="1" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="0.8"/><text class="ink bold sm" x="621.5" y="98" text-anchor="middle">Σ<tspan baseline-shift="-22%" font-size="76%">r</tspan></text><text class="ink2 sm" x="621.5" y="211" text-anchor="middle">r × r</text><text class="ink bold" x="647" y="153.5" text-anchor="middle">×</text><rect x="655.5" y="131.5" width="51" height="34" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="681" y="98" text-anchor="middle">V<tspan baseline-shift="-22%" font-size="76%">r</tspan>^T</text><text class="ink2 sm" x="681" y="211" text-anchor="middle">r × n</text><text class="ink bold sm" x="388" y="268" text-anchor="middle">Σ 는 대각선에만 값이 있고 그 값이 σ<tspan baseline-shift="-22%" font-size="76%">1</tspan> ≥ σ<tspan baseline-shift="-22%" font-size="76%">2</tspan> ≥ … ≥ 0 이다. 0 이 아닌 σ 의 개수가 계수 r 이다</text><text class="ink2 sm" x="388" y="288" text-anchor="middle">완전형은 이론을 적기 좋고 축소형은 계산과 저장에 쓴다. 두 형태가 주는 A 는 똑같다</text><text class="ink bold sm" x="388" y="310" text-anchor="middle">고유값 분해와 달리 정사각행렬이 아니어도 되고, 어떤 행렬에도 존재하며, σ 는 언제나 실수이고 0 이상이다</text><text class="ink2 sm" x="388" y="330" text-anchor="middle">대각화가 되지 않는 행렬도 특이값 분해는 된다. 그 점이 SVD 를 실무의 기본 도구로 만들었다</text>
</svg>