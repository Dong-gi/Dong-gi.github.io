<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 316" width="744" height="316" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">행렬의 열은 기저의 상이다</title><desc id="d">x 를 기저의 일차결합으로 적으면 T(x) 는 같은 계수로 기저의 상을 일차결합한 것이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
