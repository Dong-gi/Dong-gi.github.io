<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="372" y="26" text-anchor="middle">기저를 어디로 보내는지만 알면 나머지는 따라온다</text><rect x="12" y="44" width="356" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="190" y="64" text-anchor="middle">보내기 전</text><text class="ink2 sm" x="190" y="81" text-anchor="middle">x = 2e₁ + e₂</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M90 243.1 L293.4 243.1"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M114.3 267.4 L114.3 91"/><path d="M168.3 240.1 L168.3 246.1" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="168.3" y="258.1" text-anchor="middle">2</text><path d="M222.3 240.1 L222.3 246.1" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="222.3" y="258.1" text-anchor="middle">4</text><path d="M111.3 189.1 L117.3 189.1" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="107.3" y="193.1" text-anchor="end">2</text><path d="M111.3 135.1 L117.3 135.1" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="107.3" y="139.1" text-anchor="end">4</text><path d="M114.3 243.1 L168.3 243.1 L168.3 216.1" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M114.3 243.1 L141.3 243.1"/><path fill="none" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar3)" d="M114.3 243.1 L114.3 216.1"/><path fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1)" d="M114.3 243.1 L168.3 216.1"/><text class="ink sm" x="139.3" y="260.1" text-anchor="start">e₁</text><text class="ink sm" x="94.3" y="220.1" text-anchor="start">e₂</text><text class="ink bold sm" x="175.3" y="211.1" text-anchor="start">x = (2, 1)</text><text class="ink2 sm" x="190" y="288" text-anchor="middle">어떤 벡터든 e₁ 과 e₂ 의 일차결합이다</text><rect x="376" y="44" width="356" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="554" y="64" text-anchor="middle">보낸 뒤</text><text class="ink2 sm" x="554" y="81" text-anchor="middle">T(x) = 2T(e₁) + T(e₂)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M454 243.1 L657.4 243.1"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M478.3 267.4 L478.3 91"/><path d="M532.3 240.1 L532.3 246.1" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="532.3" y="258.1" text-anchor="middle">2</text><path d="M586.3 240.1 L586.3 246.1" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="586.3" y="258.1" text-anchor="middle">4</text><path d="M475.3 189.1 L481.3 189.1" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="471.3" y="193.1" text-anchor="end">2</text><path d="M475.3 135.1 L481.3 135.1" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="471.3" y="139.1" text-anchor="end">4</text><path d="M478.3 243.1 L586.3 189.1 L613.3 135.1" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M478.3 243.1 L532.3 216.1"/><path fill="none" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar3)" d="M478.3 243.1 L505.3 189.1"/><path fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1)" d="M478.3 243.1 L613.3 135.1"/><text class="ink sm" x="538.3" y="230.1" text-anchor="start">T(e₁) = (2, 1)</text><text class="ink sm" x="499.3" y="181.1" text-anchor="start">T(e₂) = (1, 2)</text><text class="ink bold sm" x="595.3" y="125.1" text-anchor="start">T(x) = (5, 4)</text><text class="ink2 sm" x="554" y="288" text-anchor="middle">두 상의 일차결합, 계수는 그대로</text>
