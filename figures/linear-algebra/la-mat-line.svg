<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 346" width="740" height="346" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">직선의 매개형과 법선형</title><desc id="d">출발점과 방향벡터로 적는 방법과 법선벡터에 수직인 점들로 적는 방법</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="370" y="26" text-anchor="middle">직선을 벡터로 적는 두 가지 방법</text><rect x="22" y="44" width="330" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="187" y="64" text-anchor="middle">매개형 — 출발점 + t · 방향</text><text class="ink2 sm" x="187" y="80" text-anchor="middle">x = P<tspan baseline-shift="-22%" font-size="76%">0</tspan> + t d</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M72 206 L298 206"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M120 242 L120 82"/><path d="M180 203 L180 209" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="180" y="222" text-anchor="middle">2</text><path d="M240 203 L240 209" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="240" y="222" text-anchor="middle">4</text><path d="M117 146 L123 146" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="113" y="150" text-anchor="end">2</text><path d="M78 212 L282 110" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="210" cy="146" r="3.4" fill="var(--ink2)"/><text class="ink2 sm" x="232" y="162" text-anchor="middle">t = 1</text><circle cx="270" cy="116" r="3.4" fill="var(--ink2)"/><text class="ink2 sm" x="292" y="132" text-anchor="middle">t = 2</text><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M150 176 L210 146"/><circle cx="150" cy="176" r="5" fill="var(--s3)"/><text class="ink bold sm" x="142" y="168" text-anchor="end">P<tspan baseline-shift="-22%" font-size="76%">0</tspan> (t = 0)</text><text class="ink bold sm" x="166.5" y="141.5" text-anchor="start">d = (2, 1)</text><text class="ink2 sm" x="187" y="282" text-anchor="middle">t 를 움직이면 직선 위의 점이 모두 나온다</text><rect x="378" y="44" width="330" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="543" y="64" text-anchor="middle">법선형 — 법선과 수직인 점들</text><text class="ink2 sm" x="543" y="80" text-anchor="middle">n · (x − P<tspan baseline-shift="-22%" font-size="76%">0</tspan>) = 0</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M428 206 L654 206"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M476 242 L476 82"/><path d="M536 203 L536 209" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="536" y="222" text-anchor="middle">2</text><path d="M596 203 L596 209" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="596" y="222" text-anchor="middle">4</text><path d="M473 146 L479 146" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="469" y="150" text-anchor="end">2</text><path d="M434 212 L638 110" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M506 176 L536 236"/><path fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M506 176 L566 146"/><circle cx="506" cy="176" r="5" fill="var(--s3)"/><circle cx="566" cy="146" r="4.5" fill="var(--s1)"/><path d="M510.92 185.84 L520.76 180.92 L515.84 171.08" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="498" y="168" text-anchor="end">P<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><text class="ink bold sm" x="548" y="240" text-anchor="start">n = (1, −2)</text><text class="ink bold sm" x="574" y="140" text-anchor="start">x</text><text class="ink2 sm" x="543" y="282" text-anchor="middle">x − 2y + 1 = 0 이라는 익숙한 식이 이것이다</text><text class="ink2 sm" x="370" y="334" text-anchor="middle">평면에서는 두 표현이 모두 직선을 준다. 공간으로 올라가면 매개형은 직선을, 법선형은 평면을 준다</text>
</svg>