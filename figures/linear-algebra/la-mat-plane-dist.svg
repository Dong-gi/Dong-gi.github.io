<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 352" width="740" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">평면의 방정식과 점에서 평면까지의 거리</title><desc id="d">평면은 법선에 수직인 점들의 모임이고 거리는 그 법선 방향으로의 정사영 길이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="370" y="26" text-anchor="middle">평면의 방정식과, 점에서 평면까지의 거리</text><rect x="22" y="44" width="330" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="187" y="64" text-anchor="middle">평면 — 법선에 수직인 점 전부</text><text class="ink2 sm" x="187" y="80" text-anchor="middle">n · (x − P<tspan baseline-shift="-22%" font-size="76%">0</tspan>) = 0</text><path d="M206.48 136.96 L89.09 203.75 L206.85 257.11 L324.24 190.32 Z" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4" stroke-linejoin="round"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M212 194 L212 129.23"/><path fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M212 194 L122.76 202.65"/><circle cx="212" cy="194" r="4.5" fill="var(--ink)"/><path d="M212 182 L200.06 183.16 L200.06 195.16" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="220" y="126.29" text-anchor="start">n</text><text class="ink bold sm" x="220" y="212" text-anchor="start">P<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><text class="ink bold sm" x="118.76" y="222.65" text-anchor="middle">x − P<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><text class="ink2 sm" x="187" y="270" text-anchor="middle">평면 안에서 어느 방향으로 가도 n 과 수직이다</text><rect x="378" y="44" width="330" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="543" y="64" text-anchor="middle">거리 — 그 벡터를 법선에 사영한 길이</text><text class="ink2 sm" x="543" y="80" text-anchor="middle">d = |n · (P − P<tspan baseline-shift="-22%" font-size="76%">0</tspan>)| ÷ ‖n‖</text><path d="M562.48 138.96 L445.09 205.75 L562.85 259.11 L680.24 192.32 Z" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4" stroke-linejoin="round"/><path d="M470.48 206.35 L470.48 147.47" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M568 196 L568 131.23"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M568 196 L470.48 147.47"/><circle cx="568" cy="196" r="4.5" fill="var(--ink)"/><circle cx="470.48" cy="147.47" r="5" fill="var(--s2)"/><circle cx="470.48" cy="206.35" r="3.6" fill="var(--ink2)"/><path d="M470.48 195.35 L481.42 194.19 L481.42 205.19" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="462.48" y="139.47" text-anchor="end">P</text><text class="ink bold sm" x="576" y="128.29" text-anchor="start">n</text><text class="ink bold sm" x="576" y="214" text-anchor="start">P<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><text class="ink bold sm" x="460.48" y="176.91" text-anchor="end">거리 d</text><text class="ink2 sm" x="543" y="270" text-anchor="middle">법선 방향 성분만 남기면 그것이 거리다</text><text class="ink2 sm" x="370" y="322" text-anchor="middle">거리를 재는 일이 결국 정사영이다. 평면에 나란한 성분은 아무리 길어도 거리에 보태지 않는다</text><text class="ink2 sm" x="370" y="340" text-anchor="middle">‖n‖ 으로 나누는 것은 법선을 길이 1 로 맞추기 위해서다</text>
</svg>