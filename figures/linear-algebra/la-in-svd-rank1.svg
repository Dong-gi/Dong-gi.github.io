<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 306" width="782" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">특이값 분해를 계수 1 조각의 합으로 읽기</title><desc id="d">2×2 행렬이 두 개의 계수 1 행렬로 갈리고 그 크기를 특이값이 정한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="391" y="26" text-anchor="middle">A = σ<tspan baseline-shift="-22%" font-size="76%">1</tspan> u<tspan baseline-shift="-22%" font-size="76%">1</tspan> v<tspan baseline-shift="-22%" font-size="76%">1</tspan>^T + σ<tspan baseline-shift="-22%" font-size="76%">2</tspan> u<tspan baseline-shift="-22%" font-size="76%">2</tspan> v<tspan baseline-shift="-22%" font-size="76%">2</tspan>^T — 계수 1 짜리 조각의 합</text><rect x="64" y="84" width="58" height="46" rx="2" fill="var(--s1)" fill-opacity="0.33" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="93" y="112" text-anchor="middle">3</text><rect x="122" y="84" width="58" height="46" rx="2" fill="var(--s1)" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="151" y="112" text-anchor="middle">0</text><rect x="64" y="130" width="58" height="46" rx="2" fill="var(--s1)" fill-opacity="0.44000000000000006" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="93" y="158" text-anchor="middle">4</text><rect x="122" y="130" width="58" height="46" rx="2" fill="var(--s1)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="151" y="158" text-anchor="middle">5</text><rect x="64" y="84" width="116" height="92" rx="3" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold sm" x="122" y="74" text-anchor="middle">A</text><text class="ink2 sm" x="122" y="196" text-anchor="middle">원래 행렬</text><text class="ink bold" x="214" y="136" text-anchor="middle">=</text><rect x="248" y="84" width="58" height="46" rx="2" fill="var(--s3)" fill-opacity="0.18333333333333335" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="277" y="112" text-anchor="middle">1.5</text><rect x="306" y="84" width="58" height="46" rx="2" fill="var(--s3)" fill-opacity="0.18333333333333335" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="335" y="112" text-anchor="middle">1.5</text><rect x="248" y="130" width="58" height="46" rx="2" fill="var(--s3)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="277" y="158" text-anchor="middle">4.5</text><rect x="306" y="130" width="58" height="46" rx="2" fill="var(--s3)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="335" y="158" text-anchor="middle">4.5</text><rect x="248" y="84" width="116" height="92" rx="3" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="306" y="74" text-anchor="middle">첫째 조각</text><text class="ink2 sm" x="306" y="196" text-anchor="middle">σ<tspan baseline-shift="-22%" font-size="76%">1</tspan> = 6.71 — 크다</text><text class="ink bold" x="398" y="136" text-anchor="middle">+</text><rect x="432" y="84" width="58" height="46" rx="2" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="461" y="112" text-anchor="middle">1.5</text><rect x="490" y="84" width="58" height="46" rx="2" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="519" y="112" text-anchor="middle">−1.5</text><rect x="432" y="130" width="58" height="46" rx="2" fill="var(--s2)" fill-opacity="0.18333333333333335" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="461" y="158" text-anchor="middle">−0.5</text><rect x="490" y="130" width="58" height="46" rx="2" fill="var(--s2)" fill-opacity="0.18333333333333335" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="519" y="158" text-anchor="middle">0.5</text><rect x="432" y="84" width="116" height="92" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold sm" x="490" y="74" text-anchor="middle">둘째 조각</text><text class="ink2 sm" x="490" y="196" text-anchor="middle">σ<tspan baseline-shift="-22%" font-size="76%">2</tspan> = 2.24 — 작다</text><path d="M558 64 L558 244" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="574" y="78" text-anchor="start">두 조각 모두 계수가 1 이다.</text><text class="ink2 sm" x="574" y="96" text-anchor="start">(모든 행이 서로 비례한다)</text><text class="ink sm" x="574" y="126" text-anchor="start">첫 조각만 남기면</text><text class="ink sm" x="574" y="144" text-anchor="start">오차가 정확히 둘째 조각이고</text><text class="ink bold sm" x="574" y="162" text-anchor="start">그 크기가 σ<tspan baseline-shift="-22%" font-size="76%">2</tspan> = 2.24 다.</text><text class="ink sm" x="574" y="192" text-anchor="start">‖A‖<tspan baseline-shift="-22%" font-size="76%">F</tspan>² = 3² + 4² + 5²</text><text class="ink bold sm" x="574" y="210" text-anchor="start">     = 50 = σ<tspan baseline-shift="-22%" font-size="76%">1</tspan>² + σ<tspan baseline-shift="-22%" font-size="76%">2</tspan>²</text><text class="ink2 sm" x="574" y="236" text-anchor="start">성분의 제곱 합이 σ 의 제곱 합이다</text><text class="ink2 sm" x="391" y="276" text-anchor="middle">큰 σ 에 딸린 조각이 행렬의 모양을 대부분 결정한다. 작은 조각을 버리는 것이 낮은 계수 근사다</text><text class="ink2 sm" x="391" y="294" text-anchor="middle">칸의 색이 진할수록 절댓값이 큰 성분이다</text>
</svg>