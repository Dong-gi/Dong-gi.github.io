<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 358" width="780" height="358" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">같은 변환, 다른 기저, 다른 행렬</title><desc id="d">표준기저에서는 뒤섞인 행렬이 기울어진 기저에서는 대각행렬이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">변환은 그대로다 — 바뀐 것은 그것을 적는 자(기저)뿐이다</text><rect x="12" y="44" width="366" height="298" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="195" y="64" text-anchor="middle">표준기저로 적으면</text><text class="ink2 sm" x="195" y="81" text-anchor="middle">열이 (2, 1) 과 (1, 2) — 대각행렬이 아니다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M86 227.2 L312.6 227.2"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M160.8 315.6 L160.8 89"/><path d="M160.8 227.2 L194.8 227.2 L194.8 193.2 L160.8 193.2 Z" fill="var(--ink2)" fill-opacity="0.08" stroke="var(--ink2)" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M160.8 227.2 L228.8 193.2 L262.8 125.2 L194.8 159.2 Z" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.4" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M160.8 227.2 L194.8 227.2"/><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M160.8 227.2 L160.8 193.2"/><path fill="none" stroke="var(--s1)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar1)" d="M160.8 227.2 L228.8 193.2"/><path fill="none" stroke="var(--s2)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar2)" d="M160.8 227.2 L194.8 159.2"/><text class="ink sm" x="234.8" y="205.2" text-anchor="start">A e₁</text><text class="ink sm" x="160.8" y="151.2" text-anchor="start">A e₂</text><text class="ink2 sm" x="195" y="328" text-anchor="middle">두 기저벡터가 모두 방향까지 바뀐다</text><rect x="402" y="44" width="366" height="298" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="585" y="64" text-anchor="middle">기저 {b₁, b₂} 로 적으면</text><text class="ink2 sm" x="585" y="81" text-anchor="middle">대각행렬 — b₁ 은 3배, b₂ 는 그대로</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M476 227.2 L702.6 227.2"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M550.8 315.6 L550.8 89"/><path d="M550.8 227.2 L584.8 193.2 L618.8 227.2 L584.8 261.2 Z" fill="var(--ink2)" fill-opacity="0.08" stroke="var(--ink2)" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M550.8 227.2 L652.8 125.2 L686.8 159.2 L584.8 261.2 Z" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.4" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M550.8 227.2 L584.8 193.2"/><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M550.8 227.2 L584.8 261.2"/><path fill="none" stroke="var(--s1)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar1)" d="M550.8 227.2 L652.8 125.2"/><path fill="none" stroke="var(--s2)" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ar2)" d="M550.8 227.2 L584.8 261.2"/><text class="ink2 sm" x="564.8" y="191.2" text-anchor="start">b₁</text><text class="ink sm" x="638.8" y="115.2" text-anchor="start">A b₁ = 3b₁</text><text class="ink sm" x="592.8" y="267.2" text-anchor="start">A b₂ = b₂</text><text class="ink2 sm" x="585" y="328" text-anchor="middle">두 방향 모두 방향이 그대로다</text>
</svg>