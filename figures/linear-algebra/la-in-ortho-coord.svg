.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="374" y="26" text-anchor="middle">기저가 직교하면 좌표를 내적 한 번으로 읽는다</text><rect x="20" y="44" width="348" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="194" y="64" text-anchor="middle">정규직교기저 { q<tspan baseline-shift="-22%" font-size="76%">1</tspan>, q<tspan baseline-shift="-22%" font-size="76%">2</tspan> }</text><text class="ink2 sm" x="194" y="80" text-anchor="middle">축이 서로 수직이고 길이가 1 이다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M96 230.8 L303.6 230.8"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M160.6 265 L160.6 84"/><path d="M148.44 239.92 L279.16 141.88" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M144.64 209.52 L117.28 173.04" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M236.6 116.8 L263.96 153.28" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M236.6 116.8 L133.24 194.32" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M160.6 230.8 L263.96 153.28"/><path fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M160.6 230.8 L133.24 194.32"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M160.6 230.8 L191 208"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M160.6 230.8 L137.8 200.4"/><path fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ark)" d="M160.6 230.8 L236.6 116.8"/><path d="M257.96 145.28 L249.96 151.28 L255.96 159.28" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="263.96" cy="153.28" r="4" fill="var(--s3)"/><circle cx="133.24" cy="194.32" r="4" fill="var(--s3)"/><text class="ink bold sm" x="197" y="225" text-anchor="start">q<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink bold sm" x="131.8" y="214.4" text-anchor="end">q<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink bold sm" x="244.6" y="112.8" text-anchor="start">u = (2, 3)</text><text class="ink bold sm" x="273.96" y="159.28" text-anchor="start">⟨u, q<tspan baseline-shift="-22%" font-size="76%">1</tspan>⟩ = 3.4</text><text class="ink bold sm" x="127.24" y="184.32" text-anchor="end">⟨u, q<tspan baseline-shift="-22%" font-size="76%">2</tspan>⟩ = 1.2</text><text class="ink2 sm" x="194" y="280" text-anchor="middle">u = 3.4 q<tspan baseline-shift="-22%" font-size="76%">1</tspan> + 1.2 q<tspan baseline-shift="-22%" font-size="76%">2</tspan> — 두 좌표를 따로따로 구했다</text><rect x="382" y="44" width="348" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="556" y="64" text-anchor="middle">기울어진 기저 { b<tspan baseline-shift="-22%" font-size="76%">1</tspan>, b<tspan baseline-shift="-22%" font-size="76%">2</tspan> }</text><text class="ink2 sm" x="556" y="80" text-anchor="middle">수선을 내려도 좌표가 나오지 않는다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M458 230.8 L665.6 230.8"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M522.6 265 L522.6 84"/><path d="M465.6 230.8 L651.8 230.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M492.2 261.2 L651.8 101.6" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M598.6 116.8 L484.6 230.8" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M598.6 116.8 L636.6 116.8" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M522.6 230.8 L484.6 230.8"/><path fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M522.6 230.8 L636.6 116.8"/><path fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M522.6 230.8 L560.6 230.8"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M522.6 230.8 L560.6 192.8"/><path fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ark)" d="M522.6 230.8 L598.6 116.8"/><circle cx="598.6" cy="230.8" r="3.4" fill="var(--ink2)"/><path d="M598.6 116.8 L598.6 230.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 3"/><text class="ink bold sm" x="564.6" y="248.8" text-anchor="start">b<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink bold sm" x="554.6" y="186.8" text-anchor="end">b<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink bold sm" x="590.6" y="110.8" text-anchor="end">u = (2, 3)</text><text class="ink bold sm" x="478.6" y="222.8" text-anchor="end">−1 b<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink bold sm" x="642.6" y="132.8" text-anchor="end">3 b<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="604.6" y="248.8" text-anchor="start">수선의 발은 2</text><text class="ink2 sm" x="556" y="280" text-anchor="middle">좌표는 (−1, 3) 인데 수선은 2 를 준다. 연립방정식을 풀어야 한다</text><text class="ink2 sm" x="374" y="332" text-anchor="middle">직교기저의 값어치가 이것이다. 축끼리 서로 간섭하지 않으므로 한 축의 좌표를 구할 때 다른 축을 볼 필요가 없다</text>
</svg>