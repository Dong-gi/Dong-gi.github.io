<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 344" width="748" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">정규직교기저에서 좌표는 내적으로 구해진다</title><desc id="d">직교하는 축에서는 수선의 발이 곧 좌표이지만 기울어진 축에서는 그렇지 않다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
