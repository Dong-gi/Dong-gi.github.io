<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 430" width="706" height="430" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">AB 와 BA 는 다르다</title><desc id="d">90도 회전과 x축 반사를 서로 다른 순서로 합성하면 서로 다른 반사가 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="353" y="26" text-anchor="middle">순서를 바꾸면 다른 변환이 된다</text><text class="ink bold sm" x="16" y="64" text-anchor="start">먼저 B, 다음 A  (AB)</text><rect x="30" y="72" width="146" height="132" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M44 135.04 L172.08 135.04"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M103.04 194.08 L103.04 66"/><path d="M103.04 135.04 L147.32 135.04 L147.32 123.97 L115.95 123.97 L115.95 98.14 L103.04 98.14 Z" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.6" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M184 138 L264 138"/><text class="ink2 sm" x="224" y="128" text-anchor="middle">B — x축 반사</text><rect x="276" y="72" width="146" height="132" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M290 135.04 L418.08 135.04"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M349.04 194.08 L349.04 66"/><path d="M349.04 135.04 L393.32 135.04 L393.32 146.11 L361.95 146.11 L361.95 171.94 L349.04 171.94 Z" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.6" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M430 138 L510 138"/><text class="ink2 sm" x="470" y="128" text-anchor="middle">A — 90° 회전</text><rect x="522" y="72" width="146" height="132" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M536 135.04 L664.08 135.04"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M595.04 194.08 L595.04 66"/><path d="M595.04 135.04 L595.04 90.76 L606.11 90.76 L606.11 122.12 L631.94 122.12 L631.94 135.04 Z" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.6" stroke-linejoin="round"/><text class="ink bold sm" x="595" y="220" text-anchor="middle">AB 는 직선 y = x 에 대한 반사</text><text class="ink bold sm" x="16" y="230" text-anchor="start">먼저 A, 다음 B  (BA)</text><rect x="30" y="238" width="146" height="132" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M44 301.04 L172.08 301.04"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M103.04 360.08 L103.04 232"/><path d="M103.04 301.04 L147.32 301.04 L147.32 289.97 L115.95 289.97 L115.95 264.14 L103.04 264.14 Z" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.6" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M184 304 L264 304"/><text class="ink2 sm" x="224" y="294" text-anchor="middle">A — 90° 회전</text><rect x="276" y="238" width="146" height="132" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M290 301.04 L418.08 301.04"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M349.04 360.08 L349.04 232"/><path d="M349.04 301.04 L349.04 256.76 L337.97 256.76 L337.97 288.13 L312.14 288.13 L312.14 301.04 Z" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.6" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M430 304 L510 304"/><text class="ink2 sm" x="470" y="294" text-anchor="middle">B — x축 반사</text><rect x="522" y="238" width="146" height="132" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M536 301.04 L664.08 301.04"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M595.04 360.08 L595.04 232"/><path d="M595.04 301.04 L595.04 345.32 L583.97 345.32 L583.97 313.95 L558.14 313.95 L558.14 301.04 Z" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.6" stroke-linejoin="round"/><text class="ink bold sm" x="595" y="386" text-anchor="middle">BA 는 직선 y = −x 에 대한 반사</text><text class="ink bold" x="353" y="404" text-anchor="middle">같은 두 행렬을 곱했는데 결과가 다르다. 행렬 곱에는 교환법칙이 없다</text><text class="ink2 sm" x="353" y="422" text-anchor="middle">반면 결합법칙은 성립한다. (AB)C 도 A(BC) 도 ‘C, B, A 순으로 적용한다’ 는 같은 말이기 때문이다</text>
</svg>