<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 348" width="770" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">가우스 소거법이 두 직선에 하는 일</title><desc id="d">행 연산을 거듭할수록 직선은 축과 나란해지고 교점은 그대로 남는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
