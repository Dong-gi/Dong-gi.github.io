.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="385" y="26" text-anchor="middle">가우스 소거법은 교점을 그대로 둔 채 직선만 단순하게 바꾼다</text><rect x="18" y="44" width="234" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="135" y="64" text-anchor="middle">처음</text><text class="ink2 sm" x="135" y="80" text-anchor="middle">기울어진 두 직선</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M60 222 L217 222"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M81 243 L81 86"/><path d="M111 219 L111 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="111" y="238" text-anchor="middle">1</text><path d="M141 219 L141 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="141" y="238" text-anchor="middle">2</text><path d="M171 219 L171 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="171" y="238" text-anchor="middle">3</text><path d="M78 192 L84 192" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="74" y="196" text-anchor="end">1</text><path d="M78 162 L84 162" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="74" y="166" text-anchor="end">2</text><path d="M78 132 L84 132" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="74" y="136" text-anchor="end">3</text><text class="ink2 sm" x="221" y="226" text-anchor="start">x</text><text class="ink2 sm" x="90" y="99" text-anchor="start">y</text><path d="M60 111 L192 243" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M207 126 L90 243" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="141" cy="192" r="5.5" fill="var(--s3)"/><text class="ink bold sm" x="151" y="183" text-anchor="start">(2, 1)</text><text class="ink2 sm" x="135" y="270" text-anchor="middle">x + y = 3</text><text class="ink2 sm" x="135" y="290" text-anchor="middle">x − y = 1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M255 174 L265 174"/><rect x="268" y="44" width="234" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="385" y="64" text-anchor="middle">R₂ ← R₁ − R₂</text><text class="ink2 sm" x="385" y="80" text-anchor="middle">한 직선이 수평이 되었다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M310 222 L467 222"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M331 243 L331 86"/><path d="M361 219 L361 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="361" y="238" text-anchor="middle">1</text><path d="M391 219 L391 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="391" y="238" text-anchor="middle">2</text><path d="M421 219 L421 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="421" y="238" text-anchor="middle">3</text><path d="M328 192 L334 192" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="324" y="196" text-anchor="end">1</text><path d="M328 162 L334 162" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="324" y="166" text-anchor="end">2</text><path d="M328 132 L334 132" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="324" y="136" text-anchor="end">3</text><text class="ink2 sm" x="471" y="226" text-anchor="start">x</text><text class="ink2 sm" x="340" y="99" text-anchor="start">y</text><path d="M310 111 L442 243" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 192 L457 192" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="391" cy="192" r="5.5" fill="var(--s3)"/><text class="ink bold sm" x="401" y="183" text-anchor="start">(2, 1)</text><text class="ink2 sm" x="385" y="270" text-anchor="middle">x + y = 3</text><text class="ink2 sm" x="385" y="290" text-anchor="middle">y = 1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M505 174 L515 174"/><rect x="518" y="44" width="234" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="635" y="64" text-anchor="middle">R₁ ← R₁ − R₂</text><text class="ink2 sm" x="635" y="80" text-anchor="middle">읽으면 그대로 답이다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M560 222 L717 222"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M581 243 L581 86"/><path d="M611 219 L611 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="611" y="238" text-anchor="middle">1</text><path d="M641 219 L641 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="641" y="238" text-anchor="middle">2</text><path d="M671 219 L671 225" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="671" y="238" text-anchor="middle">3</text><path d="M578 192 L584 192" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="574" y="196" text-anchor="end">1</text><path d="M578 162 L584 162" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="574" y="166" text-anchor="end">2</text><path d="M578 132 L584 132" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="574" y="136" text-anchor="end">3</text><text class="ink2 sm" x="721" y="226" text-anchor="start">x</text><text class="ink2 sm" x="590" y="99" text-anchor="start">y</text><path d="M641 243 L641 96" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 192 L707 192" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="641" cy="192" r="5.5" fill="var(--s3)"/><text class="ink bold sm" x="651" y="183" text-anchor="start">(2, 1)</text><text class="ink2 sm" x="635" y="270" text-anchor="middle">x = 2</text><text class="ink2 sm" x="635" y="290" text-anchor="middle">y = 1</text><text class="ink2 sm" x="385" y="336" text-anchor="middle">초록 점은 한 번도 움직이지 않았다. 행 연산이 해집합을 바꾸지 않는다는 말의 뜻이 이것이다</text>
</svg>