<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">부분공간으로의 정사영과 최단거리</title><desc id="d">벡터를 부분공간으로 내리면 나머지 조각이 그 공간과 직교하고, 그 발이 부분공간 안에서 가장 가까운 점이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="26" text-anchor="middle">부분공간으로 내리는 정사영 — 남는 조각은 그 공간과 직교한다</text><rect x="20" y="44" width="348" height="256" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="194" y="64" text-anchor="middle">u 를 부분공간 W 로 내린다</text><path d="M193.16 133.94 L88.46 193.5 L203.98 245.84 L308.68 186.28 Z" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4" stroke-linejoin="round"/><path d="M198 214.4 L198 111.04" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M198 184 L164.94 202.81"/><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M198 184 L234.48 200.53"/><path d="M133.21 205.33 L133.21 138.45" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ark)" d="M198 184 L133.21 138.45"/><path fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M198 184 L133.21 205.33"/><path d="M133.21 194.33 L143.66 190.89 L143.66 201.89" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="133.21" cy="205.33" r="4.4" fill="var(--s3)"/><text class="ink bold" x="125.21" y="134.45" text-anchor="end">u</text><text class="ink bold sm" x="167.56" y="218.59" text-anchor="start">w<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink bold sm" x="240" y="216.22" text-anchor="start">w<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink bold sm" x="304.68" y="178.28" text-anchor="end">W</text><text class="ink bold sm" x="206" y="115.04" text-anchor="start">W⊥</text><text class="ink bold sm" x="129.21" y="223.33" text-anchor="end">proj<tspan baseline-shift="-22%" font-size="76%">W</tspan> u</text><text class="ink bold sm" x="125.21" y="168.85" text-anchor="end">u − proj<tspan baseline-shift="-22%" font-size="76%">W</tspan> u</text><text class="ink2 sm" x="194" y="284" text-anchor="middle">두 조각의 합이 u 이고, 둘은 서로 직교한다</text><rect x="392" y="44" width="348" height="256" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="566" y="64" text-anchor="middle">그 발이 W 안에서 u 에 가장 가깝다</text><path d="M565.15 133.94 L460.46 193.5 L575.99 245.84 L680.67 186.28 Z" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4" stroke-linejoin="round"/><path d="M604.58 210.93 L505.21 138.45" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M604.58 210.93 L505.21 205.33" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 3"/><circle cx="604.58" cy="210.93" r="3" fill="var(--ink2)"/><path d="M621.3 173.45 L505.21 138.45" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M621.3 173.45 L505.21 205.33" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 3"/><circle cx="621.3" cy="173.45" r="3" fill="var(--ink2)"/><path d="M585.58 224.85 L505.21 138.45" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M585.58 224.85 L505.21 205.33" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 3"/><circle cx="585.58" cy="224.85" r="3" fill="var(--ink2)"/><path d="M505.21 205.33 L505.21 138.45" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="505.21" cy="138.45" r="4.4" fill="var(--ink)"/><circle cx="505.21" cy="205.33" r="5" fill="var(--s3)"/><path d="M505.21 194.33 L516.19 194.95 L516.19 205.95" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="497.21" y="134.45" text-anchor="end">u</text><text class="ink bold sm" x="501.21" y="223.33" text-anchor="end">수선의 발 p</text><text class="ink2 sm" x="591.58" y="238.85" text-anchor="start">q</text><text class="ink bold sm" x="566" y="266" text-anchor="middle">‖u − q‖² = ‖u − p‖² + ‖p − q‖²</text><text class="ink2 sm" x="566" y="284" text-anchor="middle">오른쪽 항이 0 이 될 때, 곧 q = p 일 때가 가장 가깝다</text><text class="ink2 sm" x="380" y="336" text-anchor="middle">오른쪽 등식은 직각삼각형의 피타고라스 정리일 뿐이다. 이 한 줄이 뒤의 최소제곱과 특이값 분해를 모두 떠받친다</text>
</svg>