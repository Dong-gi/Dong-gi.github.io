<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 306" width="764" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">QR 분해에서 각 조각의 모양</title><desc id="d">Q 의 열은 정규직교이고 R 은 상삼각이며 그 성분은 원래 열과 정규직교 벡터의 내적이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="382" y="26" text-anchor="middle">QR 분해 — 직교하는 부분과 상삼각 부분으로 나눈다</text><rect x="46" y="76" width="78" height="130" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold" x="85" y="66" text-anchor="middle">A</text><text class="ink2 sm" x="85" y="224" text-anchor="middle">m × n</text><path d="M72 76 L72 206" fill="none" stroke="var(--s1)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M98 76 L98 206" fill="none" stroke="var(--s1)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="150" y="147" text-anchor="middle">=</text><rect x="174" y="76" width="78" height="130" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold" x="213" y="66" text-anchor="middle">Q</text><text class="ink2 sm" x="213" y="224" text-anchor="middle">m × n</text><path d="M200 76 L200 206" fill="none" stroke="var(--s3)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M226 76 L226 206" fill="none" stroke="var(--s3)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="278" y="147" text-anchor="middle">×</text><rect x="302" y="102" width="26" height="26" rx="1" fill="var(--s2)" fill-opacity="0.28" stroke="var(--grid)" stroke-width="0.8"/><text class="ink bold sm" x="315" y="119" text-anchor="middle">∗</text><rect x="328" y="102" width="26" height="26" rx="1" fill="var(--s2)" fill-opacity="0.28" stroke="var(--grid)" stroke-width="0.8"/><text class="ink bold sm" x="341" y="119" text-anchor="middle">∗</text><rect x="354" y="102" width="26" height="26" rx="1" fill="var(--s2)" fill-opacity="0.28" stroke="var(--grid)" stroke-width="0.8"/><text class="ink bold sm" x="367" y="119" text-anchor="middle">∗</text><rect x="302" y="128" width="26" height="26" rx="1" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="0.8"/><text class="ink2 sm" x="315" y="145" text-anchor="middle">0</text><rect x="328" y="128" width="26" height="26" rx="1" fill="var(--s2)" fill-opacity="0.28" stroke="var(--grid)" stroke-width="0.8"/><text class="ink bold sm" x="341" y="145" text-anchor="middle">∗</text><rect x="354" y="128" width="26" height="26" rx="1" fill="var(--s2)" fill-opacity="0.28" stroke="var(--grid)" stroke-width="0.8"/><text class="ink bold sm" x="367" y="145" text-anchor="middle">∗</text><rect x="302" y="154" width="26" height="26" rx="1" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="0.8"/><text class="ink2 sm" x="315" y="171" text-anchor="middle">0</text><rect x="328" y="154" width="26" height="26" rx="1" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="0.8"/><text class="ink2 sm" x="341" y="171" text-anchor="middle">0</text><rect x="354" y="154" width="26" height="26" rx="1" fill="var(--s2)" fill-opacity="0.28" stroke="var(--grid)" stroke-width="0.8"/><text class="ink bold sm" x="367" y="171" text-anchor="middle">∗</text><rect x="302" y="102" width="78" height="78" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="341" y="66" text-anchor="middle">R</text><text class="ink2 sm" x="341" y="198" text-anchor="middle">n × n 상삼각</text><text class="ink sm" x="424" y="80" text-anchor="start">Q 의 열 q<tspan baseline-shift="-22%" font-size="76%">1</tspan> … q<tspan baseline-shift="-22%" font-size="76%">n</tspan> 은 A 의 열에</text><text class="ink sm" x="424" y="98" text-anchor="start">그람-슈미트를 돌린 정규직교 벡터다.</text><text class="ink bold sm" x="424" y="120" text-anchor="start">Q^T Q = I<tspan baseline-shift="-22%" font-size="76%">n</tspan>  (열끼리 내적하면 단위행렬)</text><text class="ink sm" x="424" y="150" text-anchor="start">R 의 성분은 그냥 내적이다.</text><text class="ink bold sm" x="424" y="170" text-anchor="start">r<tspan baseline-shift="-22%" font-size="76%">ij</tspan> = ⟨a<tspan baseline-shift="-22%" font-size="76%">j</tspan>, q<tspan baseline-shift="-22%" font-size="76%">i</tspan>⟩  이고  R = Q^T A</text><text class="ink sm" x="424" y="200" text-anchor="start">왜 아래쪽이 0 인가 —</text><text class="ink sm" x="424" y="220" text-anchor="start">a<tspan baseline-shift="-22%" font-size="76%">j</tspan> 는 q<tspan baseline-shift="-22%" font-size="76%">1</tspan> … q<tspan baseline-shift="-22%" font-size="76%">j</tspan> 만으로 만들어지므로</text><text class="ink sm" x="424" y="240" text-anchor="start">i &gt; j 이면 ⟨a<tspan baseline-shift="-22%" font-size="76%">j</tspan>, q<tspan baseline-shift="-22%" font-size="76%">i</tspan>⟩ = 0 이다.</text><path d="M412 70 L412 252" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="382" y="276" text-anchor="middle">LU 분해가 소거 과정을 저장한 것이었다면, QR 분해는 직교화 과정을 저장한 것이다</text><text class="ink2 sm" x="382" y="294" text-anchor="middle">열이 일차독립이면 언제나 가능하고, R 의 대각성분은 그람-슈미트가 만든 벡터의 길이라 모두 0 이 아니다</text>
</svg>