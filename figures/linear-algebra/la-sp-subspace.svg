<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 318" width="780" height="318" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">부분공간인 것과 아닌 것</title><desc id="d">원점을 지나는 직선은 부분공간이고, 원점을 비켜간 직선과 제1사분면은 부분공간이 아니다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">부분공간은 ‘원점을 품고, 더해도 늘려도 밖으로 나가지 않는’ 조각이다</text><rect x="12" y="44" width="244" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="134" y="64" text-anchor="middle">원점을 지나는 직선</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M38 176 L239 176"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M134 256 L134 87"/><path d="M38 224 L230 128" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M134 176 L214 136"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M134 176 L78 204"/><circle cx="158" cy="164" r="5" fill="var(--s3)"/><text class="ink sm" x="218" y="130" text-anchor="start">u</text><text class="ink sm" x="64" y="206" text-anchor="start">v</text><text class="ink sm" x="166" y="155" text-anchor="start">u + v</text><circle cx="134" cy="176" r="3.5" fill="var(--ink2)"/><text class="ink2 sm" x="134" y="274" text-anchor="middle">0 이 있고, 합도 스칼라배도</text><text class="ink bold sm" x="134" y="292" text-anchor="middle">직선을 벗어나지 않는다 — 부분공간</text><rect x="268" y="44" width="244" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="390" y="64" text-anchor="middle">원점을 지나지 않는 직선</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M294 192 L495 192"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M390 256 L390 87"/><path d="M294 200 L486 104" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M390 192 L350 172"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M390 192 L430 132"/><path d="M390 152 L390 112" fill="none" stroke="var(--s3)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="390" cy="112" r="5" fill="var(--s3)"/><text class="ink sm" x="336" y="170" text-anchor="start">u</text><text class="ink sm" x="436" y="134" text-anchor="start">v</text><text class="ink sm" x="356" y="106" text-anchor="start">u + v</text><circle cx="390" cy="192" r="4.5" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="399" y="213" text-anchor="start">0 은 직선 밖</text><text class="ink2 sm" x="390" y="274" text-anchor="middle">합이 직선을 벗어난다</text><text class="ink bold sm" x="390" y="292" text-anchor="middle">부분공간이 아니다</text><rect x="524" y="44" width="244" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="646" y="64" text-anchor="middle">제1사분면</text><path d="M646 176 L742 176 L742 96 L646 96 Z" fill="var(--s1)" fill-opacity="0.12" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M550 176 L751 176"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M646 256 L646 87"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M646 176 L706 136"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="5 4" d="M646 176 L586 216"/><text class="ink sm" x="711" y="132" text-anchor="start">u</text><text class="ink sm" x="564" y="222" text-anchor="start">−u</text><text class="ink2 sm" x="646" y="274" text-anchor="middle">더하기는 괜찮지만 −1 배가 밖으로</text><text class="ink bold sm" x="646" y="292" text-anchor="middle">부분공간이 아니다</text>
</svg>