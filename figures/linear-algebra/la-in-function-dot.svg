<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 352" width="790" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">함수 공간의 내적</title><desc id="d">두 함수의 곱이 만드는 넓이가 내적이고, 위아래 넓이가 지워지면 두 함수는 직교한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="395" y="26" text-anchor="middle">내적은 화살표만의 것이 아니다 — 함수끼리도 내적을 잰다</text><rect x="16" y="44" width="242" height="240" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="137" y="64" text-anchor="middle">내적 = 곱해서 넓이를 잰다</text><text class="ink2 sm" x="137" y="80" text-anchor="middle">f(x) = x,  g(x) = 1 − x</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M58 183.35 L232 183.35"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M66.48 228 L66.48 90"/><path d="M137.17 180.35 L137.17 186.35" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="137.17" y="199.35" text-anchor="middle">0.5</text><path d="M207.86 180.35 L207.86 186.35" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="207.86" y="199.35" text-anchor="middle">1</text><path d="M63.48 146.14 L69.48 146.14" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="59.48" y="150.14" text-anchor="end">0.5</text><path d="M63.48 108.93 L69.48 108.93" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="59.48" y="112.93" text-anchor="end">1</text><path d="M66.48 183.35 L66.48 183.35 L70.02 181.53 L73.55 179.81 L77.09 178.19 L80.62 176.65 L84.16 175.21 L87.69 173.86 L91.22 172.6 L94.76 171.44 L98.29 170.37 L101.83 169.4 L105.36 168.51 L108.9 167.72 L112.43 167.02 L115.97 166.42 L119.5 165.91 L123.03 165.49 L126.57 165.16 L130.1 164.93 L133.64 164.79 L137.17 164.74 L140.71 164.79 L144.24 164.93 L147.78 165.16 L151.31 165.49 L154.84 165.91 L158.38 166.42 L161.91 167.02 L165.45 167.72 L168.98 168.51 L172.52 169.4 L176.05 170.37 L179.59 171.44 L183.12 172.6 L186.66 173.86 L190.19 175.21 L193.72 176.65 L197.26 178.19 L200.79 179.81 L204.33 181.53 L207.86 183.35 L207.86 183.35 Z" fill="var(--s3)" fill-opacity="0.32" stroke="var(--s3)" stroke-width="1.8" stroke-linejoin="round"/><path d="M66.48 183.35 L207.86 108.93" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M66.48 108.93 L207.86 183.35" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="189.48" y="114.88" text-anchor="start">f</text><text class="ink bold sm" x="189.48" y="164.47" text-anchor="start">g</text><text class="ink bold sm" x="137.17" y="159.53" text-anchor="middle">f g</text><text class="ink2 sm" x="137" y="246" text-anchor="middle">색칠한 넓이가 ⟨f, g⟩ 다</text><text class="ink bold sm" x="137" y="266" text-anchor="middle">⟨f, g⟩ = ∫ x(1 − x) dx = 1/6</text><rect x="270" y="44" width="242" height="240" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="391" y="64" text-anchor="middle">직교 — 넓이가 서로 지워진다</text><text class="ink2 sm" x="391" y="80" text-anchor="middle">f(x) = 1,  h(x) = x − ½</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M312 175.45 L486 175.45"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M320.48 228 L320.48 90"/><path d="M391.17 172.45 L391.17 178.45" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="391.17" y="191.45" text-anchor="middle">0.5</text><path d="M461.86 172.45 L461.86 178.45" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="461.86" y="191.45" text-anchor="middle">1</text><path d="M317.48 141.77 L323.48 141.77" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="313.48" y="145.77" text-anchor="end">0.5</text><path d="M317.48 108.08 L323.48 108.08" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="313.48" y="112.08" text-anchor="end">1</text><path d="M320.48 175.45 L320.48 209.14 L391.17 175.45 Z" fill="var(--s2)" fill-opacity="0.34" stroke="var(--s2)" stroke-width="1.4" stroke-linejoin="round"/><path d="M391.17 175.45 L461.86 141.77 L461.86 175.45 Z" fill="var(--s3)" fill-opacity="0.34" stroke="var(--s3)" stroke-width="1.4" stroke-linejoin="round"/><path d="M320.48 108.08 L461.86 108.08" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.48 209.14 L461.86 141.77" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="442.07" y="101.08" text-anchor="start">f = 1</text><text class="ink bold sm" x="450.55" y="156.59" text-anchor="start">h</text><text class="ink bold sm" x="354.41" y="218.57" text-anchor="middle">넓이 − 1/8</text><text class="ink bold sm" x="422.28" y="126.95" text-anchor="middle">넓이 + 1/8</text><text class="ink2 sm" x="391" y="246" text-anchor="middle">위와 아래 넓이가 같아 합이 0 이다</text><text class="ink bold sm" x="391" y="266" text-anchor="middle">⟨f, h⟩ = 0 — 두 함수는 직교한다</text><rect x="524" y="44" width="242" height="240" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="645" y="64" text-anchor="middle">합이 적분이 된 것뿐이다</text><text class="ink2 sm" x="645" y="80" text-anchor="middle">유클리드 내적의 Σ 가 여기서는 ∫</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M566 208.8 L740 208.8"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M574.48 228 L574.48 90"/><path d="M645.17 205.8 L645.17 211.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="645.17" y="224.8" text-anchor="middle">0.5</text><path d="M715.86 205.8 L715.86 211.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="715.86" y="224.8" text-anchor="middle">1</text><path d="M571.48 176.8 L577.48 176.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="567.48" y="180.8" text-anchor="end">0.1</text><path d="M571.48 144.8 L577.48 144.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="567.48" y="148.8" text-anchor="end">0.2</text><path d="M571.48 112.8 L577.48 112.8" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="567.48" y="116.8" text-anchor="end">0.3</text><path d="M574.48 208.8 L574.48 190.05 L592.16 190.05 L592.16 208.8 Z" fill="var(--s1)" fill-opacity="0.24" stroke="var(--s1)" stroke-width="1" stroke-linejoin="round"/><path d="M592.16 208.8 L592.16 160.05 L609.83 160.05 L609.83 208.8 Z" fill="var(--s1)" fill-opacity="0.24" stroke="var(--s1)" stroke-width="1" stroke-linejoin="round"/><path d="M609.83 208.8 L609.83 140.05 L627.5 140.05 L627.5 208.8 Z" fill="var(--s1)" fill-opacity="0.24" stroke="var(--s1)" stroke-width="1" stroke-linejoin="round"/><path d="M627.5 208.8 L627.5 130.05 L645.17 130.05 L645.17 208.8 Z" fill="var(--s1)" fill-opacity="0.24" stroke="var(--s1)" stroke-width="1" stroke-linejoin="round"/><path d="M645.17 208.8 L645.17 130.05 L662.84 130.05 L662.84 208.8 Z" fill="var(--s1)" fill-opacity="0.24" stroke="var(--s1)" stroke-width="1" stroke-linejoin="round"/><path d="M662.84 208.8 L662.84 140.05 L680.52 140.05 L680.52 208.8 Z" fill="var(--s1)" fill-opacity="0.24" stroke="var(--s1)" stroke-width="1" stroke-linejoin="round"/><path d="M680.52 208.8 L680.52 160.05 L698.19 160.05 L698.19 208.8 Z" fill="var(--s1)" fill-opacity="0.24" stroke="var(--s1)" stroke-width="1" stroke-linejoin="round"/><path d="M698.19 208.8 L698.19 190.05 L715.86 190.05 L715.86 208.8 Z" fill="var(--s1)" fill-opacity="0.24" stroke="var(--s1)" stroke-width="1" stroke-linejoin="round"/><path d="M574.48 208.8 L576.84 203.56 L579.2 198.49 L581.55 193.6 L583.91 188.89 L586.26 184.36 L588.62 180 L590.98 175.82 L593.33 171.82 L595.69 168 L598.05 164.36 L600.4 160.89 L602.76 157.6 L605.11 154.49 L607.47 151.56 L609.83 148.8 L612.18 146.22 L614.54 143.82 L616.9 141.6 L619.25 139.56 L621.61 137.69 L623.97 136 L626.32 134.49 L628.68 133.16 L631.03 132 L633.39 131.02 L635.75 130.22 L638.1 129.6 L640.46 129.16 L642.82 128.89 L645.17 128.8 L647.53 128.89 L649.89 129.16 L652.24 129.6 L654.6 130.22 L656.95 131.02 L659.31 132 L661.67 133.16 L664.02 134.49 L666.38 136 L668.74 137.69 L671.09 139.56 L673.45 141.6 L675.8 143.82 L678.16 146.22 L680.52 148.8 L682.87 151.56 L685.23 154.49 L687.59 157.6 L689.94 160.89 L692.3 164.36 L694.66 168 L697.01 171.82 L699.37 175.82 L701.72 180 L704.08 184.36 L706.44 188.89 L708.79 193.6 L711.15 198.49 L713.51 203.56 L715.86 208.8" fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="645" y="246" text-anchor="middle">Σ f(x<tspan baseline-shift="-22%" font-size="76%">i</tspan>) g(x<tspan baseline-shift="-22%" font-size="76%">i</tspan>) Δx  →  ∫ f g dx</text><text class="ink2 sm" x="645" y="266" text-anchor="middle">칸을 잘게 쪼갠 끝이 적분이다</text><text class="ink2 sm" x="395" y="322" text-anchor="middle">벡터의 내적이 성분끼리 곱해 더하는 일이었다면, 함수의 내적은 같은 x 자리의 값끼리 곱해 적분하는 일이다</text><text class="ink2 sm" x="395" y="340" text-anchor="middle">자리가 유한개에서 연속으로 늘어난 것뿐이고, 직교 · 노름 · 각의 뜻은 그대로 따라온다</text>
</svg>