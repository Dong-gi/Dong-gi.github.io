<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 368" width="784" height="368" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">최소제곱으로 직선 맞추기</title><desc id="d">세로 거리의 제곱 합을 최소로 하는 직선이고 잔차는 상수열과 x열 모두와 직교한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
