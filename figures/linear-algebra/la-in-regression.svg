<text class="ink bold" x="392" y="26" text-anchor="middle">직선 맞추기 — 세로 거리의 제곱 합을 가장 작게 하는 직선</text><rect x="18" y="44" width="372" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="204" y="64" text-anchor="middle">맞춘 직선과 잔차</text><text class="ink2 sm" x="204" y="80" text-anchor="middle">y = 0.5 + 1.4 x</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M72 238.41 L322 238.41"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M81.23 246 L81.23 88"/><path d="M127.38 235.41 L127.38 241.41" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="127.38" y="254.41" text-anchor="middle">1</text><path d="M173.54 235.41 L173.54 241.41" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="173.54" y="254.41" text-anchor="middle">2</text><path d="M219.69 235.41 L219.69 241.41" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="219.69" y="254.41" text-anchor="middle">3</text><path d="M265.85 235.41 L265.85 241.41" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="265.85" y="254.41" text-anchor="middle">4</text><path d="M78.23 200.46 L84.23 200.46" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="74.23" y="204.46" text-anchor="end">2</text><path d="M78.23 162.51 L84.23 162.51" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="74.23" y="166.51" text-anchor="end">4</text><path d="M78.23 124.56 L84.23 124.56" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="74.23" y="128.56" text-anchor="end">6</text><text class="ink2 sm" x="326" y="242.41" text-anchor="start">x</text><text class="ink2 sm" x="90.23" y="101" text-anchor="start">y</text><path d="M81.23 228.92 L302.77 101.42" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M127.38 202.36 L127.38 200.46" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="127.38" cy="200.46" r="4.4" fill="var(--ink)"/><circle cx="127.38" cy="202.36" r="3" fill="var(--s1)"/><text class="ink bold sm" x="135.38" y="205.41" text-anchor="start">0.1</text><path d="M173.54 175.79 L173.54 181.49" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="173.54" cy="181.49" r="4.4" fill="var(--ink)"/><circle cx="173.54" cy="175.79" r="3" fill="var(--s1)"/><text class="ink bold sm" x="181.54" y="182.64" text-anchor="start">−0.3</text><path d="M219.69 149.23 L219.69 143.54" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="219.69" cy="143.54" r="4.4" fill="var(--ink)"/><circle cx="219.69" cy="149.23" r="3" fill="var(--s1)"/><text class="ink bold sm" x="227.69" y="150.38" text-anchor="start">0.3</text><path d="M265.85 122.67 L265.85 124.56" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="265.85" cy="124.56" r="4.4" fill="var(--ink)"/><circle cx="265.85" cy="122.67" r="3" fill="var(--s1)"/><text class="ink bold sm" x="273.85" y="127.62" text-anchor="start">−0.1</text><text class="ink bold sm" x="150.46" y="105.59" text-anchor="start">y = 0.5 + 1.4x</text><text class="ink bold sm" x="204" y="270" text-anchor="middle">잔차의 합 0.1 − 0.3 + 0.3 − 0.1 = 0</text><text class="ink bold sm" x="204" y="290" text-anchor="middle">x 와의 내적도 0.1 − 0.6 + 0.9 − 0.4 = 0</text><text class="ink2 sm" x="204" y="308" text-anchor="middle">이 두 줄이 정규방정식 두 줄이다</text><rect x="402" y="44" width="372" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="588" y="64" text-anchor="middle">무엇의 거리를 줄이는가</text><text class="ink2 sm" x="588" y="80" text-anchor="middle">세로 거리이지 수직 거리가 아니다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M456 238.41 L706 238.41"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M465.23 246 L465.23 88"/><path d="M511.38 235.41 L511.38 241.41" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="511.38" y="254.41" text-anchor="middle">1</text><path d="M557.54 235.41 L557.54 241.41" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="557.54" y="254.41" text-anchor="middle">2</text><path d="M603.69 235.41 L603.69 241.41" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="603.69" y="254.41" text-anchor="middle">3</text><path d="M649.85 235.41 L649.85 241.41" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="649.85" y="254.41" text-anchor="middle">4</text><path d="M462.23 200.46 L468.23 200.46" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="458.23" y="204.46" text-anchor="end">2</text><path d="M462.23 162.51 L468.23 162.51" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="458.23" y="166.51" text-anchor="end">4</text><path d="M462.23 124.56 L468.23 124.56" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="458.23" y="128.56" text-anchor="end">6</text><text class="ink2 sm" x="710" y="242.41" text-anchor="start">x</text><text class="ink2 sm" x="474.23" y="101" text-anchor="start">y</text><path d="M465.23 228.92 L686.77 101.42" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="511.38" cy="200.46" r="3" fill="var(--ink2)"/><circle cx="557.54" cy="181.49" r="3" fill="var(--ink2)"/><circle cx="603.69" cy="143.54" r="3" fill="var(--ink2)"/><circle cx="649.85" cy="124.56" r="3" fill="var(--ink2)"/><path d="M557.54 175.79 L557.54 132.15" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M557.54 132.15 L607.75 146.9" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M600.07 144.65 L595.42 138.14 L603.1 140.39" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="557.54" cy="132.15" r="5" fill="var(--ink)"/><circle cx="557.54" cy="175.79" r="3.4" fill="var(--s2)"/><circle cx="607.75" cy="146.9" r="3.4" fill="var(--ink2)"/><text class="ink bold sm" x="549.54" y="128.15" text-anchor="end">점 P</text><text class="ink bold sm" x="549.54" y="153.03" text-anchor="end">세로 거리</text><text class="ink2 sm" x="615.23" y="133.1" text-anchor="start">수직 거리</text><text class="ink bold sm" x="588" y="270" text-anchor="middle">최소제곱은 굵은 선(세로)의 제곱 합을 줄인다</text><text class="ink2 sm" x="588" y="290" text-anchor="middle">y 를 예측하는 것이 목적이라 y 방향 오차만 센다</text><text class="ink2 sm" x="588" y="308" text-anchor="middle">점선(수직 거리)을 줄이는 것은 10장의 주성분분석이다</text><text class="ink2 sm" x="392" y="338" text-anchor="middle">첫 줄은 잔차가 1 로만 이루어진 열과 직교한다는 뜻이고, 둘째 줄은 잔차가 x 열과 직교한다는 뜻이다</text><text class="ink2 sm" x="392" y="356" text-anchor="middle">점이 네 개이므로 직선 맞추기는 4차원 공간에서 평면으로 내리는 정사영이었다</text>
</svg>