<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">일차독립과 일차종속</title><desc id="d">세 벡터가 한 평면 위에 놓이면 종속이고, 하나가 평면을 벗어나면 독립이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="26" text-anchor="middle">갈림길은 하나다 — 세 벡터가 한 평면 위에 놓이는가</text><rect x="12" y="44" width="356" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="190" y="64" text-anchor="middle">일차종속</text><text class="ink2 sm" x="190" y="81" text-anchor="middle">w = u + v — 새 방향이 없다</text><path d="M170.32 255.94 L68.8 242.4 L238 157.8 L339.52 171.34 Z" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.3" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ark)" d="M202 210 L145.84 249.31"/><path fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ark)" d="M202 210 L295.6 210"/><path fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ark)" d="M202 210 L202 116.4"/><text class="ink2 sm" x="133.84" y="261.31" text-anchor="start">x</text><text class="ink2 sm" x="300.6" y="222" text-anchor="start">y</text><text class="ink2 sm" x="207" y="114.4" text-anchor="start">z</text><path fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M202 210 L158.8 204.24"/><path fill="none" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M202 210 L274 174"/><path fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M202 210 L230.8 168.24"/><path d="M158.8 204.24 L230.8 168.24" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M274 174 L230.8 168.24" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink sm" x="144.8" y="206.24" text-anchor="start">u</text><text class="ink sm" x="281" y="176" text-anchor="start">v</text><text class="ink sm" x="232.8" y="160.24" text-anchor="start">w</text><text class="ink2 sm" x="190" y="302" text-anchor="middle">w 가 평면 안에 갇혀 있다</text><rect x="392" y="44" width="356" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="570" y="64" text-anchor="middle">일차독립</text><text class="ink2 sm" x="570" y="81" text-anchor="middle">w 가 평면을 벗어난다</text><path d="M550.32 255.94 L448.8 242.4 L618 157.8 L719.52 171.34 Z" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="5 4"/><path fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ark)" d="M582 210 L525.84 249.31"/><path fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ark)" d="M582 210 L675.6 210"/><path fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ark)" d="M582 210 L582 116.4"/><text class="ink2 sm" x="513.84" y="261.31" text-anchor="start">x</text><text class="ink2 sm" x="680.6" y="222" text-anchor="start">y</text><text class="ink2 sm" x="587" y="114.4" text-anchor="start">z</text><path d="M592.08 195.38 L592.08 144.98" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M582 210 L538.8 204.24"/><path fill="none" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M582 210 L654 174"/><path fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M582 210 L592.08 144.98"/><text class="ink sm" x="524.8" y="206.24" text-anchor="start">u</text><text class="ink sm" x="661" y="176" text-anchor="start">v</text><text class="ink sm" x="600.08" y="148.98" text-anchor="start">w</text><text class="ink2 sm" x="570" y="302" text-anchor="middle">셋이 공간 전체를 생성한다</text>
</svg>