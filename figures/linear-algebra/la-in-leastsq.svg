<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 366" width="796" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">최소제곱해는 b 를 열공간에 정사영한 것이다</title><desc id="d">잔차가 열공간과 직교한다는 조건에서 정규방정식이 곧바로 나온다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="398" y="26" text-anchor="middle">해가 없는 Ax = b 에서 무엇을 구하는가 — b 를 열공간에 수직으로 내린다</text><rect x="18" y="44" width="424" height="288" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="230" y="64" text-anchor="middle">열공간은 평면이고 b 는 그 위에 없다</text><path d="M218.6 140.2 L102.6 206.2 L230.6 264.2 L346.6 198.2 Z" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4" stroke-linejoin="round"/><path d="M252.3 235.5 L146.8 149.9" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="252.3" cy="235.5" r="2.8" fill="var(--ink2)"/><path d="M283.8 181.6 L146.8 149.9" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="283.8" cy="181.6" r="2.8" fill="var(--ink2)"/><path d="M228.8 245.6 L146.8 149.9" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="228.8" cy="245.6" r="2.8" fill="var(--ink2)"/><path fill="none" stroke="var(--s1)" stroke-width="2.1" stroke-linecap="round" marker-end="url(#ar1)" d="M224 196 L192.1 214.15"/><path fill="none" stroke="var(--s1)" stroke-width="2.1" stroke-linecap="round" marker-end="url(#ar1)" d="M224 196 L259.2 211.95"/><path d="M146.8 220.3 L146.8 149.9" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ark)" d="M224 196 L146.8 149.9"/><path fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar3)" d="M224 196 L146.8 220.3"/><path d="M146.8 208.3 L158.25 204.7 L158.25 216.7" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="146.8" cy="149.9" r="4.6" fill="var(--ink)"/><circle cx="146.8" cy="220.3" r="5" fill="var(--s3)"/><text class="ink bold" x="138.8" y="145.9" text-anchor="end">b</text><text class="ink bold sm" x="194.65" y="230.97" text-anchor="start">a<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink bold sm" x="264.8" y="228.68" text-anchor="start">a<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink bold sm" x="342.6" y="190.2" text-anchor="end">열공간 Col(A)</text><text class="ink bold sm" x="138.8" y="183.5" text-anchor="end">잔차 r = b − Ax</text><text class="ink bold sm" x="146.8" y="246.3" text-anchor="middle">Ax (사영)</text><text class="ink2 sm" x="230" y="298" text-anchor="middle">Ax 가 갈 수 있는 곳은 색칠한 평면 전부다. b 는 그 위에 없다</text><text class="ink2 sm" x="230" y="316" text-anchor="middle">점선으로 이은 다른 점들은 모두 b 에서 더 멀다</text><rect x="456" y="44" width="322" height="288" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="617" y="64" text-anchor="middle">정규방정식은 여기서 나온다</text><rect x="474" y="92" width="286" height="28" rx="5" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="617" y="111" text-anchor="middle">잔차 r 이 열공간과 직교한다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M617 120 L617 126"/><rect x="474" y="128" width="286" height="28" rx="5" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="617" y="147" text-anchor="middle">A 의 열 하나하나와 내적이 0 이다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M617 156 L617 162"/><rect x="474" y="164" width="286" height="28" rx="5" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="617" y="183" text-anchor="middle">A^T r = 0</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M617 192 L617 198"/><rect x="474" y="200" width="286" height="28" rx="5" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="617" y="219" text-anchor="middle">A^T (b − Ax) = 0</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M617 228 L617 234"/><rect x="474" y="236" width="286" height="28" rx="5" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="617" y="255" text-anchor="middle">A^T A x = A^T b</text><text class="ink bold sm" x="617" y="280" text-anchor="middle">마지막 줄이 정규방정식이다</text><text class="ink2 sm" x="617" y="302" text-anchor="middle">A 의 열이 일차독립이면 A^T A 가 가역이라</text><text class="ink2 sm" x="617" y="320" text-anchor="middle">최소제곱해가 하나로 정해진다</text><text class="ink2 sm" x="398" y="354" text-anchor="middle">최소제곱은 새로운 아이디어가 아니다. 5장에서 점을 직선에 내리던 일을 벡터를 부분공간에 내리는 일로 한 칸 올린 것이다</text>
</svg>