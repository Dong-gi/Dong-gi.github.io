<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">스칼라 삼중곱은 평행육면체의 부피다</title><desc id="d">밑면의 넓이는 외적의 크기이고 높이는 세 번째 벡터의 법선 방향 성분이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="360" y="26" text-anchor="middle">스칼라 삼중곱 — 밑넓이 곱하기 높이</text><rect x="40" y="44" width="640" height="226" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="360" y="64" text-anchor="middle">u = (2,0,0), v = (1,2,0), w = (1,1,2)</text><text class="ink2 sm" x="360" y="80" text-anchor="middle">밑넓이 4, 높이 2, 부피 8</text><path d="M290 212 L232 245 L267 290.5 L325 257.5 Z" fill="var(--s1)" fill-opacity="0.08" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M293 179 L235 212 L270 257.5 L328 224.5 Z" fill="var(--s1)" fill-opacity="0.08" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M290 212 L232 245 L235 212 L293 179 Z" fill="var(--s1)" fill-opacity="0.08" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M325 257.5 L267 290.5 L270 257.5 L328 224.5 Z" fill="var(--s1)" fill-opacity="0.08" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M290 212 L325 257.5 L328 224.5 L293 179 Z" fill="var(--s1)" fill-opacity="0.08" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M232 245 L267 290.5 L270 257.5 L235 212 Z" fill="var(--s1)" fill-opacity="0.08" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M290 212 L232 245" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 212 L325 257.5" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 212 L293 179" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M232 245 L267 290.5" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M232 245 L235 212" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M325 257.5 L267 290.5" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M325 257.5 L328 224.5" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M293 179 L235 212" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M293 179 L328 224.5" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M267 290.5 L270 257.5" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M235 212 L270 257.5" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M328 224.5 L270 257.5" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 212 L232 245 L267 290.5 L325 257.5 Z" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.6" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M290 212 L232 245"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M290 212 L325 257.5"/><path fill="none" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar3)" d="M290 212 L293 179"/><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="5 4" d="M290 212 L290 116"/><path d="M293 179 L293 243" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink bold sm" x="258.1" y="248.15" text-anchor="middle">u</text><text class="ink bold sm" x="331.2" y="245.95" text-anchor="start">v</text><text class="ink bold sm" x="301.3" y="174.1" text-anchor="start">w</text><text class="ink2 sm" x="298" y="108" text-anchor="start">u × v 방향</text><text class="ink sm" x="464" y="118" text-anchor="start">밑면의 넓이 = ‖u × v‖ = 4</text><text class="ink sm" x="464" y="140" text-anchor="start">높이 = w 의 u × v 방향 성분 = 2</text><text class="ink bold sm" x="464" y="162" text-anchor="start">부피 = (u × v) · w = 8</text><text class="ink2 sm" x="464" y="190" text-anchor="start">이 값은 세 벡터를 행으로 쌓은</text><text class="ink2 sm" x="464" y="208" text-anchor="start">3×3 행렬의 행렬식과 같다</text><text class="ink2 sm" x="360" y="300" text-anchor="middle">내적이 ‘길이 × 그림자’ 였던 것과 같은 방식이다. u × v 와 w 를 내적하면 w 의 높이 성분만 남는다</text><text class="ink2 sm" x="360" y="318" text-anchor="middle">삼중곱이 0 이면 세 벡터가 한 평면 위에 있다는 뜻이고, 그것이 4장의 det = 0 이다</text>
</svg>