<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" width="760" height="326" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">회전변환의 고유값은 복소수다</title><desc id="d">회전은 실수 고유값을 갖지 않고, 복소평면 단위원 위의 켤레쌍을 고유값으로 갖는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="26" text-anchor="middle">회전은 어느 방향도 그대로 두지 않는다 — 그래서 고유값이 실수가 아니다</text><rect x="12" y="44" width="356" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="190" y="64" text-anchor="middle">90° 회전</text><text class="ink2 sm" x="190" y="81" text-anchor="middle">방향이 유지되는 벡터가 하나도 없다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M94 190.6 L292.2 190.6"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M188.6 285.2 L188.6 87"/><path d="M188.6 190.6 L261.7 190.6" fill="none" stroke="var(--grid)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M188.6 190.6 L188.6 117.5"/><path d="M188.6 190.6 L240.2 139" fill="none" stroke="var(--grid)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M188.6 190.6 L137 139"/><path d="M188.6 190.6 L188.6 117.5" fill="none" stroke="var(--grid)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M188.6 190.6 L115.5 190.6"/><path d="M188.6 190.6 L240.2 242.2" fill="none" stroke="var(--grid)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M188.6 190.6 L240.2 139"/><text class="ink2 sm" x="245.85" y="208.6" text-anchor="start">보내기 전</text><text class="ink sm" x="196.6" y="111.35" text-anchor="start">보낸 뒤</text><text class="ink2 sm" x="190" y="298" text-anchor="middle">모두 90° 돌아간다 — 실수 λ 로는 적을 수 없다</text><rect x="392" y="44" width="356" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="570" y="64" text-anchor="middle">복소평면에서 보면</text><text class="ink2 sm" x="570" y="81" text-anchor="middle">θ 만큼 회전한 곳에 켤레쌍이 있다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M474 189.5 L670 189.5"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M567.5 283 L567.5 87"/><text class="ink2 sm" x="674" y="193.5" text-anchor="start">실수축</text><path d="M622.5 189.5 L622.38 185.9 L622.03 182.32 L621.44 178.77 L620.63 175.26 L619.58 171.82 L618.31 168.45 L616.83 165.17 L615.13 162 L613.23 158.94 L611.13 156.02 L608.85 153.24 L606.39 150.61 L603.76 148.15 L600.98 145.87 L598.06 143.77 L595 141.87 L591.83 140.17 L588.55 138.69 L585.18 137.42 L581.74 136.37 L578.23 135.56 L574.68 134.97 L571.1 134.62 L567.5 134.5 L563.9 134.62 L560.32 134.97 L556.77 135.56 L553.26 136.37 L549.82 137.42 L546.45 138.69 L543.17 140.17 L540 141.87 L536.94 143.77 L534.02 145.87 L531.24 148.15 L528.61 150.61 L526.15 153.24 L523.87 156.02 L521.77 158.94 L519.87 162 L518.17 165.17 L516.69 168.45 L515.42 171.82 L514.37 175.26 L513.56 178.77 L512.97 182.32 L512.62 185.9 L512.5 189.5 L512.62 193.1 L512.97 196.68 L513.56 200.23 L514.37 203.74 L515.42 207.18 L516.69 210.55 L518.17 213.83 L519.87 217 L521.77 220.06 L523.87 222.98 L526.15 225.76 L528.61 228.39 L531.24 230.85 L534.02 233.13 L536.94 235.23 L540 237.13 L543.17 238.83 L546.45 240.31 L549.82 241.58 L553.26 242.63 L556.77 243.44 L560.32 244.03 L563.9 244.38 L567.5 244.5 L571.1 244.38 L574.68 244.03 L578.23 243.44 L581.74 242.63 L585.18 241.58 L588.55 240.31 L591.83 238.83 L595 237.13 L598.06 235.23 L600.98 233.13 L603.76 230.85 L606.39 228.39 L608.85 225.76 L611.13 222.98 L613.23 220.06 L615.13 217 L616.83 213.83 L618.31 210.55 L619.58 207.18 L620.63 203.74 L621.44 200.23 L622.03 196.68 L622.38 193.1 L622.5 189.5" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M567.5 189.5 L602.85 147.37" fill="none" stroke="var(--ink2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="602.85" cy="147.37" r="5.4" fill="var(--s1)"/><circle cx="602.85" cy="231.63" r="5.4" fill="var(--s2)"/><text class="ink sm" x="610.85" y="141.37" text-anchor="start">cos θ + i sin θ</text><text class="ink sm" x="610.85" y="245.63" text-anchor="start">cos θ − i sin θ</text><path d="M601.5 189.5 A34 34 0 0 0 589.35 163.45" fill="none" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="611" y="173.21" text-anchor="middle">θ</text><text class="ink2 sm" x="575.5" y="109" text-anchor="start">허수축</text><text class="ink2 sm" x="570" y="298" text-anchor="middle">크기 1, 편각 θ — 회전각이 그대로 편각이다</text>
</svg>