<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 396" width="812" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">최근접 점 쌍의 가운데 띠</title><desc id="d">가운데 선에서 폭 2δ 안의 점만 다시 보고, 그 안에서도 y 순으로 여섯 점만 견주면 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="406" y="26" text-anchor="middle">최근접 점 쌍 — 가운데 띠만 다시 보면 되고, 띠 안에서도 여섯 점만 보면 된다</text><rect x="22" y="48" width="452" height="288" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="248" y="68" text-anchor="middle">나누기 — 세로선으로 반씩</text><text class="ink2 sm" x="248" y="84" text-anchor="middle">δ = min(왼쪽 최소, 오른쪽 최소)</text><rect x="52" y="118" width="392" height="176" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="202" y="118" width="92" height="176" rx="3" fill="var(--s3)" fill-opacity="0.12" stroke="var(--s3)" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M248 110 L248 302" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="248" y="104" text-anchor="middle">가운데 선</text><circle cx="94" cy="148" r="4.5" fill="var(--s1)"/><circle cx="138" cy="214" r="4.5" fill="var(--s1)"/><circle cx="82" cy="260" r="4.5" fill="var(--s1)"/><circle cx="170" cy="174" r="4.5" fill="var(--s1)"/><circle cx="122" cy="286" r="4.5" fill="var(--s1)"/><circle cx="192" cy="246" r="4.5" fill="var(--s1)"/><circle cx="314" cy="158" r="4.5" fill="var(--s1)"/><circle cx="370" cy="222" r="4.5" fill="var(--s1)"/><circle cx="434" cy="166" r="4.5" fill="var(--s1)"/><circle cx="348" cy="280" r="4.5" fill="var(--s1)"/><circle cx="408" cy="264" r="4.5" fill="var(--s1)"/><circle cx="288" cy="246" r="4.5" fill="var(--s1)"/><path d="M138 214 L192 246" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="170" y="226" text-anchor="start">δ<tspan baseline-shift="-22%" font-size="76%">L</tspan></text><path d="M370 222 L408 264" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="396" y="242" text-anchor="start">δ<tspan baseline-shift="-22%" font-size="76%">R</tspan></text><circle cx="224" cy="190" r="5" fill="var(--s2)"/><circle cx="268" cy="212" r="5" fill="var(--s2)"/><path d="M224 190 L268 212" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="274" y="178" text-anchor="start">띠를 가로지르는 쌍</text><text class="ink2 sm" x="198" y="312" text-anchor="middle">폭 2δ</text><path d="M202 300 L294 300" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="248" y="324" text-anchor="middle">띠 밖의 쌍은 이미 δ 보다 멀다 — 다시 볼 필요가 없다</text><rect x="496" y="48" width="294" height="288" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="643" y="68" text-anchor="middle">띠 안에서 몇 개를 보나</text><text class="ink2 sm" x="643" y="84" text-anchor="middle">y 순으로 정렬해 두면</text><rect x="572" y="114" width="60" height="60" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="632" y="114" width="60" height="60" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="572" y="174" width="60" height="60" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="632" y="174" width="60" height="60" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="572" y="114" width="120" height="120" rx="3" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M632 104 L632 244" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="598" cy="136" r="4.5" fill="var(--s1)"/><circle cx="664" cy="154" r="4.5" fill="var(--s1)"/><circle cx="602" cy="202" r="4.5" fill="var(--s1)"/><circle cx="668" cy="218" r="4.5" fill="var(--s1)"/><circle cx="632" cy="234" r="5.5" fill="var(--s2)"/><text class="ink bold sm" x="644" y="250" text-anchor="start">지금 보는 점</text><text class="ink2 sm" x="564" y="174" text-anchor="end">2δ</text><text class="ink2 sm" x="632" y="96" text-anchor="middle">가로 2δ</text><text class="ink2 sm" x="643" y="274" text-anchor="middle">한 칸(δ/2 × δ/2)에는 점이 둘 이상 들어갈 수 없다.</text><text class="ink2 sm" x="643" y="294" text-anchor="middle">들어가면 그 둘의 거리가 δ 보다 작아 모순이다.</text><text class="ink bold sm" x="643" y="320" text-anchor="middle">그래서 뒤로 여섯 점만 보면 충분하다</text><text class="ink2 sm" x="406" y="382" text-anchor="middle">T(n) = 2T(n/2) + Θ(n) — 마스터 정리 둘째 경우이므로 Θ(n log n) 이다</text>
</svg>