<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 400" width="812" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">분할 가능 배낭과 0-1 배낭</title><desc id="d">가치 밀도가 높은 것부터 담는 탐욕은 쪼갤 수 있을 때만 최적이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="406" y="26" text-anchor="middle">쪼갤 수 있으면 탐욕이 맞고, 쪼갤 수 없으면 틀린다 (배낭 50 kg)</text><rect x="22" y="46" width="250" height="176" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="147" y="66" text-anchor="middle">가치 밀도로 줄을 세운다</text><text class="ink2 sm" x="147" y="82" text-anchor="middle">가치 ÷ 무게</text><text class="ink2 sm" x="52" y="112" text-anchor="start">A  10kg · 60원</text><rect x="174" y="100" width="72" height="16" rx="2" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="252" y="113" text-anchor="start">6</text><text class="ink2 sm" x="52" y="152" text-anchor="start">B  20kg · 100원</text><rect x="174" y="140" width="60" height="16" rx="2" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="240" y="153" text-anchor="start">5</text><text class="ink2 sm" x="52" y="192" text-anchor="start">C  30kg · 120원</text><rect x="174" y="180" width="48" height="16" rx="2" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="228" y="193" text-anchor="start">4</text><text class="ink2 sm" x="147" y="210" text-anchor="middle">A &gt; B &gt; C 순서다</text><rect x="288" y="46" width="502" height="176" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="539" y="66" text-anchor="middle">쪼갤 수 있으면 (분할 가능 배낭)</text><text class="ink2 sm" x="539" y="82" text-anchor="middle">밀도 높은 것부터 붓는다</text><rect x="330" y="110" width="450" height="44" rx="4" fill="none" fill-opacity="1" stroke="var(--ink)" stroke-width="1.6"/><rect x="330" y="110" width="90" height="44" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="375" y="130" text-anchor="middle">A 10kg</text><text class="ink2 sm" x="375" y="146" text-anchor="middle">60원</text><rect x="420" y="110" width="180" height="44" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="510" y="130" text-anchor="middle">B 20kg</text><text class="ink2 sm" x="510" y="146" text-anchor="middle">100원</text><rect x="600" y="110" width="180" height="44" rx="3" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="690" y="130" text-anchor="middle">C 의 2/3</text><text class="ink2 sm" x="690" y="146" text-anchor="middle">80원</text><text class="ink bold sm" x="555" y="186" text-anchor="middle">60 + 100 + 80 = 240 원 — 이것이 최적이다</text><text class="ink2 sm" x="555" y="206" text-anchor="middle">마지막 물건을 잘라 배낭을 남김없이 채웠다</text><path d="M40 242 L772 242" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="406" y="266" text-anchor="middle">쪼갤 수 없으면 (0-1 배낭) — 같은 순서로 담아 본다</text><text class="ink2 sm" x="221" y="296" text-anchor="middle">탐욕 · 밀도 순</text><rect x="56" y="306" width="330" height="34" rx="4" fill="none" fill-opacity="1" stroke="var(--ink)" stroke-width="1.4"/><rect x="56" y="306" width="66" height="34" rx="3" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="89" y="328" text-anchor="middle">A · 60원</text><rect x="122" y="306" width="132" height="34" rx="3" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="188" y="328" text-anchor="middle">B · 100원</text><text class="ink2 sm" x="320" y="328" text-anchor="middle">빈자리 20kg</text><text class="ink bold" x="221" y="362" text-anchor="middle">160 원</text><text class="ink2 sm" x="591" y="296" text-anchor="middle">최적</text><rect x="426" y="306" width="330" height="34" rx="4" fill="none" fill-opacity="1" stroke="var(--ink)" stroke-width="1.4"/><rect x="426" y="306" width="132" height="34" rx="3" fill="var(--s3)" fill-opacity="0.28" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="492" y="328" text-anchor="middle">B · 100원</text><rect x="558" y="306" width="198" height="34" rx="3" fill="var(--s3)" fill-opacity="0.28" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="657" y="328" text-anchor="middle">C · 120원</text><text class="ink bold" x="591" y="362" text-anchor="middle">220 원</text><text class="ink2 sm" x="406" y="390" text-anchor="middle">C 를 통째로 넣으려면 A 를 포기해야 하는데, 탐욕은 이미 A 를 넣은 뒤라 되돌릴 수 없다 — 12장의 자리다</text>
</svg>