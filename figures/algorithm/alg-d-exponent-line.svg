<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" width="780" height="268" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">곱셈 알고리즘의 지수 눈금</title><desc id="d">카라추바는 2 를 1.585 로, 스트라센은 3 을 2.807 로 내렸다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">분할정복이 옮겨 놓은 것은 계수가 아니라 지수다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M60 150 L740 150"/><path d="M80 150 L80 156" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="80" y="172" text-anchor="middle">1.0</text><path d="M240 150 L240 156" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="240" y="172" text-anchor="middle">1.5</text><path d="M400 150 L400 156" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="400" y="172" text-anchor="middle">2.0</text><path d="M560 150 L560 156" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="560" y="172" text-anchor="middle">2.5</text><path d="M720 150 L720 156" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="720" y="172" text-anchor="middle">3.0</text><text class="ink2 sm" x="746" y="155" text-anchor="start">n 의 지수</text><circle cx="267.2" cy="150" r="5" fill="var(--s2)"/><path d="M267.2 150 L267.2 110" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink bold sm" x="259.2" y="106" text-anchor="start">카라추바 곱셈</text><text class="ink2 sm" x="259.2" y="90" text-anchor="start">log₂3</text><circle cx="400" cy="150" r="5" fill="var(--ink2)"/><path d="M400 150 L400 196" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink bold sm" x="400" y="210" text-anchor="middle">곧이곧대로 곱셈</text><text class="ink2 sm" x="400" y="226" text-anchor="middle">n²</text><circle cx="519.36" cy="150" r="5" fill="var(--s3)"/><path d="M519.36 150 L519.36 110" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink bold sm" x="519.36" y="106" text-anchor="middle">이론상 가장 좋은 행렬 곱</text><text class="ink2 sm" x="519.36" y="90" text-anchor="middle">2.37 언저리 · 계속 갱신된다</text><circle cx="658.24" cy="150" r="5" fill="var(--s2)"/><path d="M658.24 150 L658.24 196" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink bold sm" x="666.24" y="210" text-anchor="end">스트라센 행렬 곱</text><text class="ink2 sm" x="666.24" y="226" text-anchor="end">log₂7</text><circle cx="720" cy="150" r="5" fill="var(--ink2)"/><path d="M720 150 L720 110" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink bold sm" x="728" y="106" text-anchor="end">곧이곧대로 행렬 곱</text><text class="ink2 sm" x="728" y="90" text-anchor="end">n³</text><text class="ink2 sm" x="390" y="238" text-anchor="middle">지수 0.2 의 차이가 별것 아니게 보이지만 n = 10⁶ 에서는 열여섯 배가 넘는 차이다.</text><text class="ink2 sm" x="390" y="256" text-anchor="middle">오른쪽 끝에 가까운 두 방법은 상수가 워낙 커서 실제로 쓰이는 크기가 서로 다르다</text>
</svg>