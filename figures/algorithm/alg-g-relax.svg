<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 314" width="764" height="314" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">완화 — 더 짧은 길을 찾으면 갈아탄다</title><desc id="d">u 까지의 거리에 간선 가중치를 더한 값이 v 의 현재 거리보다 작으면 갈아탄다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="382" y="24" text-anchor="middle">이 장의 모든 알고리즘이 이 연산 하나를 되풀이한다</text><rect x="14" y="42" width="366" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="197" y="62" text-anchor="middle">완화가 일어나는 경우</text><text class="ink2 sm" x="197" y="78" text-anchor="middle">u 를 거쳐 가면 더 짧다</text><path d="M132 158 L250 158" fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)"/><text class="ink2 bold sm" x="193" y="146" text-anchor="middle">4</text><circle cx="110" cy="158" r="22" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="110" y="163" text-anchor="middle">u</text><circle cx="276" cy="158" r="22" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="276" y="163" text-anchor="middle">v</text><text class="ink2 sm" x="110" y="122" text-anchor="middle">지금까지의 최단 3</text><text class="ink2 sm" x="276" y="122" text-anchor="middle">지금까지의 최단 9</text><text class="ink bold sm" x="197" y="204" text-anchor="middle">3 + 4 = 7</text><text class="ink2 sm" x="197" y="224" text-anchor="middle">7 &lt; 9 이므로 9 를 7 로 고친다</text><rect x="396" y="42" width="366" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="579" y="62" text-anchor="middle">완화가 일어나지 않는 경우</text><text class="ink2 sm" x="579" y="78" text-anchor="middle">u 를 거쳐 가면 더 멀다</text><path d="M514 158 L632 158" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 bold sm" x="575" y="146" text-anchor="middle">4</text><circle cx="492" cy="158" r="22" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="492" y="163" text-anchor="middle">u</text><circle cx="658" cy="158" r="22" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="658" y="163" text-anchor="middle">v</text><text class="ink2 sm" x="492" y="122" text-anchor="middle">지금까지의 최단 3</text><text class="ink2 sm" x="658" y="122" text-anchor="middle">지금까지의 최단 5</text><text class="ink bold sm" x="579" y="204" text-anchor="middle">3 + 4 = 7</text><text class="ink2 sm" x="579" y="224" text-anchor="middle">7 는 5 보다 작지 않다. 그대로 둔다</text><text class="ink2 sm" x="20" y="264" text-anchor="start">완화(relaxation) 란 ‘u 를 거쳐 가는 길이 지금 아는 길보다 짧으면 갈아탄다’ 이다.</text><text class="ink2 sm" x="20" y="282" text-anchor="start">갈아탈 때 v 의 직전 정점을 u 로 함께 적어 두면, 끝난 뒤 거꾸로 따라가 경로를 복원할 수 있다.</text><text class="ink2 sm" x="20" y="300" text-anchor="start">알고리즘마다 다른 것은 완화를 어떤 순서로 몇 번 하느냐뿐이다</text>
</svg>