<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 378" width="792" height="378" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">자르기 성질</title><desc id="d">자름을 건너는 최소 가중치 간선은 어떤 최소신장트리에도 들어 있다는 것을 바꿔치기로 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="396" y="24" text-anchor="middle">어떻게 잘라도 그 자름을 건너는 가장 싼 간선은 최소신장트리에 들어 있다</text><rect x="14" y="42" width="374" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="201" y="62" text-anchor="middle">자르기 성질</text><text class="ink2 sm" x="201" y="78" text-anchor="middle">점선이 자름이다. 두 무리로 아무렇게나 나눈다</text><path d="M76 125 L76 163" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 197 L76 235" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M316 125 L316 163" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M316 197 L316 235" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M93 180 L299 180" fill="none" stroke="var(--s3)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="196" y="197" text-anchor="middle">4</text><path d="M93 108 L299 108" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="196" y="125" text-anchor="middle">9</text><path d="M93 252 L299 252" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="196" y="269" text-anchor="middle">7</text><circle cx="76" cy="108" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="76" y="113" text-anchor="middle">a</text><circle cx="76" cy="180" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="76" y="185" text-anchor="middle">b</text><circle cx="76" cy="252" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="76" y="257" text-anchor="middle">c</text><circle cx="316" cy="108" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="316" y="113" text-anchor="middle">d</text><circle cx="316" cy="180" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="316" y="185" text-anchor="middle">e</text><circle cx="316" cy="252" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="316" y="257" text-anchor="middle">f</text><path d="M248 80 L236 128 L260 176 L234 228 L248 276" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text class="ink2 sm" x="28" y="292" text-anchor="start">자름을 건너는 간선은 4 · 7 · 9 셋이다.</text><text class="ink2 sm" x="28" y="308" text-anchor="start">그중 가장 싼 4 는 반드시 답에 들어간다</text><rect x="404" y="42" width="374" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="591" y="62" text-anchor="middle">왜 그런가 — 바꿔치기</text><text class="ink2 sm" x="591" y="78" text-anchor="middle">4 가 없는 최소신장트리를 가정하고 모순을 본다</text><rect x="440" y="96" width="130" height="140" rx="40" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1" stroke-dasharray="5 4"/><rect x="614" y="96" width="130" height="140" rx="40" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1" stroke-dasharray="5 4"/><path d="M470 142 L470 190" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M714 142 L714 190" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="470" cy="130" r="12" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="470" y="135" text-anchor="middle"></text><circle cx="470" cy="202" r="12" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="470" y="207" text-anchor="middle"></text><circle cx="714" cy="130" r="12" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="714" y="135" text-anchor="middle"></text><circle cx="714" cy="202" r="12" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="714" y="207" text-anchor="middle"></text><path d="M482 202 L702 202" fill="none" stroke="var(--s3)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="592" y="224" text-anchor="middle">4  (넣고 싶은 간선)</text><path d="M482 130 L702 130" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="592" y="118" text-anchor="middle">7  (지금 트리에 있는 간선)</text><text class="ink2 sm" x="418" y="264" text-anchor="start">4 를 넣으면 고리가 생기고, 그 고리는 자름을 한 번 더 건넌다.</text><text class="ink2 sm" x="418" y="284" text-anchor="start">건너는 그 간선 7 을 빼면 다시 트리인데</text><text class="ink2 sm" x="418" y="304" text-anchor="start">무게는 3 만큼 줄었다. 최소였다는 가정에 모순이다</text><text class="ink2 sm" x="20" y="336" text-anchor="start">크루스칼과 프림은 이 성질을 서로 다르게 쓴다.</text><text class="ink2 sm" x="20" y="354" text-anchor="start">크루스칼은 가장 싼 간선을 집어 들고 그것이 건너는 자름을 나중에 찾고,</text><text class="ink2 sm" x="20" y="372" text-anchor="start">프림은 자름을 먼저 정해 놓고(지금까지 자란 덩어리와 나머지) 그것을 건너는 가장 싼 간선을 고른다</text>
</svg>