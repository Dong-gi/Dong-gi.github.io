<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 368" width="792" height="368" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">union-find 의 두 요령</title><desc id="d">랭크가 낮은 트리를 높은 트리 밑에 붙이고 find 를 부른 김에 경로를 뿌리에 직접 붙인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="396" y="24" text-anchor="middle">두 요령이 있어야 거의 상수 시간이 된다 — 낮은 쪽을 붙이고, 지나간 길을 접는다</text><rect x="14" y="42" width="374" height="260" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="201" y="62" text-anchor="middle">랭크로 합치기</text><text class="ink2 sm" x="201" y="78" text-anchor="middle">낮은 트리를 높은 트리 밑에 붙인다</text><path d="M83.91 131.71 L65.72 172.64" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M96.09 131.71 L114.28 172.64" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M122 205 L122 235" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><circle cx="90" cy="118" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="90" y="123" text-anchor="middle">a</text><circle cx="58" cy="190" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="58" y="195" text-anchor="middle">b</text><circle cx="122" cy="190" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="122" y="195" text-anchor="middle">c</text><circle cx="122" cy="254" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="122" y="259" text-anchor="middle">d</text><text class="ink2 sm" x="90" y="96" text-anchor="middle">높이 2</text><path d="M268 133 L268 171" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><circle cx="268" cy="118" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="268" y="123" text-anchor="middle">e</text><circle cx="268" cy="190" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="268" y="195" text-anchor="middle">f</text><text class="ink2 sm" x="268" y="96" text-anchor="middle">높이 1</text><path fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M250 118 L110 118"/><text class="ink2 sm" x="180" y="148" text-anchor="middle">e 를 a 밑으로 붙인다</text><text class="ink2 sm" x="28" y="280" text-anchor="start">거꾸로 붙이면 높이가 3 이 된다. 낮은 쪽을 붙이면 2 그대로다</text><rect x="404" y="42" width="374" height="260" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="591" y="62" text-anchor="middle">경로 압축</text><text class="ink2 sm" x="591" y="78" text-anchor="middle">find 를 부른 김에 지나간 것을 뿌리에 직접 붙인다</text><path d="M470 154 L470 140" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M470 198 L470 186" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M470 242 L470 230" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><circle cx="470" cy="122" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="470" y="127" text-anchor="middle">r</text><circle cx="470" cy="168" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="470" y="173" text-anchor="middle">x</text><circle cx="470" cy="212" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="470" y="217" text-anchor="middle">y</text><circle cx="470" cy="256" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="470" y="261" text-anchor="middle">z</text><text class="ink2 bold sm" x="470" y="100" text-anchor="middle">전</text><path d="M619.77 200.35 L662.02 136.98" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M672 198 L672 140" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M724.23 200.35 L681.98 136.98" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><circle cx="672" cy="122" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="672" y="127" text-anchor="middle">r</text><circle cx="612" cy="212" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="612" y="217" text-anchor="middle">x</text><circle cx="672" cy="212" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="672" y="217" text-anchor="middle">y</text><circle cx="732" cy="212" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="732" y="217" text-anchor="middle">z</text><text class="ink2 bold sm" x="672" y="100" text-anchor="middle">후</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M524 190 L562 190"/><text class="ink2 sm" x="543" y="178" text-anchor="middle">find(z)</text><text class="ink2 sm" x="418" y="280" text-anchor="start">다음부터 x · y · z 의 find 가 한 걸음이면 끝난다</text><text class="ink2 sm" x="20" y="326" text-anchor="start">둘 중 하나만 쓰면 한 연산이 O(log n) 이고, 둘을 같이 쓰면 n 번 연산의 평균이 사실상 상수다.</text><text class="ink2 sm" x="20" y="344" text-anchor="start">정확히는 역 애커만 함수라는 아주 천천히 자라는 함수인데, 현실의 어떤 n 에서도 5 를 넘지 않는다.</text><text class="ink2 sm" x="20" y="362" text-anchor="start">경로 압축을 쓰면 트리의 실제 높이가 랭크보다 낮아진다. 그래서 랭크는 높이가 아니라 상한으로만 쓴다</text>
</svg>