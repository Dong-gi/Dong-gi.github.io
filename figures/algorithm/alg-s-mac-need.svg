<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 424" width="844" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">암호화만으로는 변조를 못 막는다</title><desc id="d">스트림 방식 암호문은 비트를 뒤집으면 평문도 뒤집힌다. 해시만 붙여서도 막을 수 없고 키를 섞은 MAC 이 필요하다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="422" y="26" text-anchor="middle">읽지 못하게 하는 것과 고치지 못하게 하는 것은 다른 일이다</text><text class="ink bold sm" x="40" y="72" text-anchor="start">① 암호문만 보낸다면 — CTR 모드에서 한 비트를 뒤집어 본다</text><text class="ink2 sm" x="228" y="94" text-anchor="end">평문</text><rect x="238" y="79" width="214" height="21" rx="2" fill="var(--ink2)" fill-opacity="0.2" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="345" y="94" text-anchor="middle">00110001  00110000  ⋯</text><text class="ink2 sm" x="466" y="94" text-anchor="start">‘10000원’ 의 앞 두 글자 1 과 0</text><text class="ink2 sm" x="228" y="120" text-anchor="end">키 스트림</text><rect x="238" y="105" width="214" height="21" rx="2" fill="none" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="345" y="120" text-anchor="middle">10100110  01011101  ⋯</text><text class="ink2 sm" x="466" y="120" text-anchor="start">공격자는 이것을 모른다</text><text class="ink2 sm" x="228" y="146" text-anchor="end">암호문</text><rect x="238" y="131" width="214" height="21" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="345" y="146" text-anchor="middle">10010111  01101101  ⋯</text><text class="ink2 sm" x="466" y="146" text-anchor="start">이대로 보낸다</text><text class="ink2 sm" x="228" y="172" text-anchor="end">공격자가 뒤집은 암호문</text><rect x="238" y="157" width="214" height="21" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.2"/><text class="ink sm" x="345" y="172" text-anchor="middle">10011111  01101101  ⋯</text><text class="ink bold sm" x="466" y="172" text-anchor="start">다섯째 비트 하나만 바꿨다</text><text class="ink2 sm" x="228" y="198" text-anchor="end">받는 쪽이 푼 평문</text><rect x="238" y="183" width="214" height="21" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.2"/><text class="ink sm" x="345" y="198" text-anchor="middle">00111001  00110000  ⋯</text><text class="ink bold sm" x="466" y="198" text-anchor="start">1 이 9 가 되어 ‘90000원’ 이 되었다</text><text class="ink bold sm" x="40" y="248" text-anchor="start">공격자는 내용을 읽지 못했는데도 내용을 바꿨다. 무엇으로 바뀌는지까지 조종할 수 있다</text><path d="M40 268 L804 268" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="40" y="290" text-anchor="start">② 그러면 해시를 함께 보내면 되는가 — 안 된다</text><rect x="40" y="302" width="254" height="92" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text class="ink bold sm" x="52" y="324" text-anchor="start">해시만 붙인다</text><text class="ink2 sm" x="52" y="344" text-anchor="start">메시지 + H(메시지)</text><text class="ink2 sm" x="52" y="361" text-anchor="start">공격자가 메시지를 바꾸고</text><text class="ink2 sm" x="52" y="378" text-anchor="start">H 를 다시 계산하면 그만이다</text><rect x="308" y="302" width="254" height="92" rx="5" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4"/><text class="ink bold sm" x="320" y="324" text-anchor="start">키를 섞은 해시 — MAC</text><text class="ink2 sm" x="320" y="344" text-anchor="start">메시지 + HMAC(키, 메시지)</text><text class="ink2 sm" x="320" y="361" text-anchor="start">키가 없으면 값을 다시 만들 수 없다</text><text class="ink2 sm" x="320" y="378" text-anchor="start">받는 쪽도 같은 키가 있어야 확인한다</text><rect x="576" y="302" width="254" height="92" rx="5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.4"/><text class="ink bold sm" x="588" y="324" text-anchor="start">왜 H(키 ‖ 메시지) 가 아닌가</text><text class="ink2 sm" x="588" y="344" text-anchor="start">흔한 해시 함수는 중간 상태를 이어받아</text><text class="ink2 sm" x="588" y="361" text-anchor="start">뒤에 덧붙인 메시지의 해시를 만들 수 있다</text><text class="ink2 sm" x="588" y="378" text-anchor="start">HMAC 은 두 번 해싱해 이 길을 막는다</text><text class="ink bold sm" x="422" y="414" text-anchor="middle">암호화는 기밀성만 준다. 무결성과 인증은 MAC 이 따로 준다 — 요즘 규격은 둘을 한 덩어리로 묶어 제공한다</text>
</svg>