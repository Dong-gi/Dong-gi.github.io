<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 412" width="844" height="412" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">전자 서명과 인증서 사슬</title><desc id="d">비밀키로 서명하고 공개키로 확인한다. 그 공개키가 진짜인지는 인증서 사슬이 보증한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="422" y="26" text-anchor="middle">서명은 거꾸로 쓴다 — 비밀키로 만들고 공개키로 확인한다</text><rect x="40" y="52" width="120" height="36" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="100" y="74" text-anchor="middle">메시지</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M160 70 L186 70"/><rect x="188" y="52" width="108" height="36" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="242" y="74" text-anchor="middle">해시 H</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M296 70 L322 70"/><rect x="324" y="52" width="150" height="36" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="399" y="74" text-anchor="middle">보내는 이의 비밀키</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M474 70 L500 70"/><rect x="502" y="52" width="110" height="36" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="557" y="74" text-anchor="middle">서명</text><text class="ink2 sm" x="624" y="74" text-anchor="start">메시지와 함께 보낸다</text><rect x="40" y="116" width="120" height="36" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="100" y="138" text-anchor="middle">받은 메시지</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M160 134 L186 134"/><rect x="188" y="116" width="108" height="36" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="242" y="138" text-anchor="middle">해시 H</text><rect x="324" y="116" width="150" height="36" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="399" y="138" text-anchor="middle">보내는 이의 공개키</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M502 134 L476 134"/><rect x="502" y="116" width="110" height="36" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="557" y="138" text-anchor="middle">받은 서명</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M324 134 L298 134"/><text class="ink bold sm" x="624" y="138" text-anchor="start">두 해시가 같으면 확인 끝</text><path d="M242 90 L242 114" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink bold sm" x="252" y="110" text-anchor="start">같은가?</text><text class="ink2 sm" x="40" y="178" text-anchor="start">메시지가 한 비트라도 바뀌면 해시가 달라지고, 서명은 비밀키 없이 다시 만들 수 없다</text><path d="M40 200 L804 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="40" y="232" text-anchor="start">그런데 그 공개키가 정말 그 사람 것인가 — 인증서가 답하는 질문이다</text><rect x="40" y="248" width="214" height="84" rx="5" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="52" y="270" text-anchor="start">뿌리 인증기관</text><text class="ink2 sm" x="52" y="290" text-anchor="start">브라우저와 운영체제에</text><text class="ink2 sm" x="52" y="307" text-anchor="start">미리 심어져 있다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M254 290 L280 290"/><rect x="284" y="248" width="214" height="84" rx="5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="296" y="270" text-anchor="start">중간 인증기관</text><text class="ink2 sm" x="296" y="290" text-anchor="start">뿌리의 비밀키로</text><text class="ink2 sm" x="296" y="307" text-anchor="start">서명받은 인증서</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M498 290 L524 290"/><rect x="528" y="248" width="214" height="84" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="540" y="270" text-anchor="start">서버 인증서</text><text class="ink2 sm" x="540" y="290" text-anchor="start">중간의 비밀키로</text><text class="ink2 sm" x="540" y="307" text-anchor="start">서명받았고, 서버의</text><text class="ink2 sm" x="540" y="324" text-anchor="start">공개키와 이름이 담겨 있다</text><text class="ink2 sm" x="772" y="284" text-anchor="middle">이 사슬을</text><text class="ink2 sm" x="772" y="302" text-anchor="middle">거꾸로 올라가며</text><text class="ink2 sm" x="772" y="320" text-anchor="middle">서명을 확인한다</text><text class="ink bold sm" x="422" y="366" text-anchor="middle">디피-헬만만으로는 가운데 낀 사람을 막을 수 없었다. 상대의 공개키가 진짜인지 확인해 주는 것이 이 사슬이다</text><text class="ink2 sm" x="422" y="388" text-anchor="middle">믿음의 출발점은 뿌리 인증기관이다. 그 하나가 뚫리면 그 아래 전부가 무너진다</text><text class="ink2 sm" x="422" y="408" text-anchor="middle">그래서 인증서에는 만료 시각이 있고, 잘못 발급된 것을 취소하는 별도의 절차가 있다</text>
</svg>