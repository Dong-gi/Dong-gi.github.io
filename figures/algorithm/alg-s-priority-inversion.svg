<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 372" width="836" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">우선순위 역전</title><desc id="d">락을 쥔 낮은 우선순위 스레드가 중간 우선순위 스레드에 밀려나면 높은 우선순위 스레드가 그만큼 기다린다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="418" y="26" text-anchor="middle">급한 일이 안 급한 일에 밀린다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M132 246 L748 246"/><text class="ink2 sm" x="754" y="251" text-anchor="start">시간</text><text class="ink bold sm" x="118" y="100" text-anchor="end">높음 H</text><path d="M132 114 L732 114" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="264" y="76" width="300" height="36" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4"/><text class="ink2 sm" x="414" y="99" text-anchor="middle">락이 풀리기를 기다리며 막혀 있다</text><rect x="564" y="76" width="120" height="36" rx="3" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold sm" x="624" y="99" text-anchor="middle">실행</text><text class="ink bold sm" x="118" y="156" text-anchor="end">중간 M</text><path d="M132 170 L732 170" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="348" y="132" width="216" height="36" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold sm" x="456" y="155" text-anchor="middle">실행 — 락과 아무 상관 없다</text><text class="ink bold sm" x="118" y="212" text-anchor="end">낮음 L</text><path d="M132 226 L732 226" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="168" y="188" width="180" height="36" rx="3" fill="var(--s3)" fill-opacity="0.28" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="258" y="211" text-anchor="middle">락을 잡고 실행</text><rect x="348" y="188" width="216" height="36" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4"/><text class="ink2 sm" x="456" y="211" text-anchor="middle">밀려나 멈춤</text><rect x="564" y="188" width="48" height="36" rx="3" fill="var(--s3)" fill-opacity="0.28" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="588" y="211" text-anchor="middle">푼다</text><path d="M264 68 L264 242" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="258" y="62" text-anchor="end">H 가 락을 원한다</text><path d="M348 68 L348 242" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="354" y="62" text-anchor="start">M 이 L 을 밀어낸다</text><path d="M564 68 L564 242" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="564" y="62" text-anchor="middle">L 이 락을 푼다</text><path d="M52 274 L784 274" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="418" y="296" text-anchor="middle">H 가 기다리는 것은 L 이 쥔 락인데, 정작 H 를 붙잡아 두는 것은 락과 아무 상관 없는 M 이다</text><text class="ink2 sm" x="418" y="318" text-anchor="middle">우선순위가 뒤집혔다. L 이 밀려나 있는 동안 락이 풀리지 않고, 그래서 H 가 M 보다 늦게 끝난다</text><text class="ink bold sm" x="418" y="344" text-anchor="middle">해결책은 우선순위 상속이다 — 락을 쥔 L 에게 기다리는 H 의 우선순위를 잠시 빌려주면 M 이 끼어들지 못한다</text><text class="ink2 sm" x="418" y="364" text-anchor="middle">1997년 화성 탐사선 패스파인더가 계속 재시동된 원인이 이것이었다고 알려져 있다</text>
</svg>