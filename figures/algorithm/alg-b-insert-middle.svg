<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 424" width="770" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">배열과 연결 리스트에 가운데 삽입하기</title><desc id="d">배열은 뒤 원소를 모두 밀어야 하고 연결 리스트는 화살표 두 개만 바꾼다</desc>
<style>
