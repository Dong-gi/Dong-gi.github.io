<text class="ink bold" x="385" y="24" text-anchor="middle">가운데에 하나 끼워 넣기 — 배열은 밀고, 리스트는 화살표만 고친다</text><text class="ink bold sm" x="26" y="62" text-anchor="start">배열</text><rect x="26" y="72" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="52" y="95" text-anchor="middle">a</text><rect x="78" y="72" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="104" y="95" text-anchor="middle">b</text><rect x="130" y="72" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="156" y="95" text-anchor="middle">c</text><rect x="182" y="72" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="208" y="95" text-anchor="middle">d</text><rect x="234" y="72" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="260" y="95" text-anchor="middle">e</text><rect x="286" y="72" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="354" y="96" text-anchor="start">처음</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M156 118 L202 136"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M208 118 L254 136"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M260 118 L306 136"/><rect x="26" y="142" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="52" y="165" text-anchor="middle">a</text><rect x="78" y="142" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="104" y="165" text-anchor="middle">b</text><rect x="130" y="142" width="52" height="36" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><rect x="182" y="142" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="208" y="165" text-anchor="middle">c</text><rect x="234" y="142" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="260" y="165" text-anchor="middle">d</text><rect x="286" y="142" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="312" y="165" text-anchor="middle">e</text><text class="ink2 sm" x="354" y="166" text-anchor="start">뒤 셋을 한 칸씩 민 뒤</text><rect x="26" y="200" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="52" y="223" text-anchor="middle">a</text><rect x="78" y="200" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="104" y="223" text-anchor="middle">b</text><rect x="130" y="200" width="52" height="36" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink" x="156" y="223" text-anchor="middle">x</text><rect x="182" y="200" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="208" y="223" text-anchor="middle">c</text><rect x="234" y="200" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="260" y="223" text-anchor="middle">d</text><rect x="286" y="200" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="312" y="223" text-anchor="middle">e</text><text class="ink2 sm" x="354" y="224" text-anchor="start">넣는다 — 최악 O(n)</text><text class="ink bold sm" x="26" y="252" text-anchor="start">연결 리스트</text><rect x="26" y="268" width="40" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="66" y="268" width="22" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="46" y="291" text-anchor="middle">a</text><rect x="146" y="268" width="40" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="186" y="268" width="22" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="166" y="291" text-anchor="middle">b</text><rect x="266" y="268" width="40" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="306" y="268" width="22" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="286" y="291" text-anchor="middle">c</text><rect x="386" y="268" width="40" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="426" y="268" width="22" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="406" y="291" text-anchor="middle">d</text><rect x="506" y="268" width="40" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="546" y="268" width="22" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="526" y="291" text-anchor="middle">e</text><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M77 285 L142 285"/><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M317 285 L382 285"/><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M437 285 L502 285"/><rect x="176" y="324" width="40" height="34" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><rect x="216" y="324" width="22" height="34" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><text class="ink" x="196" y="347" text-anchor="middle">x</text><path d="M197 285 C190 288 156 324 172 341" fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M227 341 C300 324 250 288 262 285" fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)"/><text class="ink2 sm" x="26" y="392" text-anchor="start">앞뒤 화살표 두 개만 고친다. 나머지 노드는 자리를 옮기지 않으므로 O(1) 이다.</text><text class="ink2 sm" x="26" y="412" text-anchor="start">단, 끼워 넣을 자리를 미리 알고 있어야 한다. 그 자리를 찾아가는 데는 여전히 O(n) 이 든다</text>
</svg>