<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 356" width="812" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">클리크와 정점 덮개의 환원</title><desc id="d">그래프의 간선을 뒤집으면 크기 k 인 클리크가 크기 n 빼기 k 인 정점 덮개로 바뀐다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="406" y="26" text-anchor="middle">클리크와 정점 덮개는 같은 문제를 뒤집어 본 것이다</text><rect x="22" y="46" width="346" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="195" y="66" text-anchor="middle">그래프 G — 간선 9개</text><text class="ink2 sm" x="195" y="82" text-anchor="middle">정점 덮개 {5, 6} · 크기 2</text><path d="M298 151 L298 209" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M279 132 L119 132" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M279 132 L217 132" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M280.9 140.29 L117.1 219.71" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M284.29 145.16 L211.71 214.84" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M280.9 219.71 L117.1 140.29" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M284.29 214.84 L211.71 145.16" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M279 228 L119 228" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M279 228 L217 228" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="132" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="100" y="136" text-anchor="middle">1</text><circle cx="198" cy="132" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="198" y="136" text-anchor="middle">2</text><circle cx="100" cy="228" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="100" y="232" text-anchor="middle">3</text><circle cx="198" cy="228" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="198" y="232" text-anchor="middle">4</text><circle cx="298" cy="132" r="19" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="298" y="136" text-anchor="middle">5</text><circle cx="298" cy="228" r="19" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="298" y="232" text-anchor="middle">6</text><rect x="424" y="46" width="346" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="597" y="66" text-anchor="middle">여집합 그래프 — 간선 6개</text><text class="ink2 sm" x="597" y="82" text-anchor="middle">클리크 {1,2,3,4} · 크기 4</text><path d="M521 132 L581 132" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M502 151 L502 209" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M515.57 145.3 L586.43 214.7" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M586.43 145.3 L515.57 214.7" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 151 L600 209" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M521 228 L581 228" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="502" cy="132" r="19" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="502" y="136" text-anchor="middle">1</text><circle cx="600" cy="132" r="19" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="600" y="136" text-anchor="middle">2</text><circle cx="502" cy="228" r="19" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="502" y="232" text-anchor="middle">3</text><circle cx="600" cy="228" r="19" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="600" y="232" text-anchor="middle">4</text><circle cx="700" cy="132" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="700" y="136" text-anchor="middle">5</text><circle cx="700" cy="228" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="700" y="232" text-anchor="middle">6</text><text class="ink2 sm" x="195" y="286" text-anchor="middle">색칠한 두 점이 모든 간선에 하나씩 닿는다</text><text class="ink2 sm" x="597" y="286" text-anchor="middle">색칠한 네 점이 서로 전부 이어져 있다</text><text class="ink bold sm" x="406" y="324" text-anchor="middle">G 에 크기 k 인 클리크가 있다  ⟺  여집합 그래프에 크기 n − k 인 정점 덮개가 있다.</text><text class="ink2 sm" x="406" y="344" text-anchor="middle">변환이 간선을 뒤집는 일뿐이라 O(n²) 이다. 그래서 한쪽이 NP-완전이면 다른 쪽도 NP-완전이다</text>
</svg>