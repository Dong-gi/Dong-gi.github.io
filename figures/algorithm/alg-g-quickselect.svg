<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 438" width="790" height="438" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">선택 문제와 quickselect</title><desc id="d">분할 뒤 한쪽만 파고들면 볼 양이 등비수열로 줄어 합이 2n 을 넘지 않는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="395" y="24" text-anchor="middle">정렬은 양쪽을 다 파지만 선택은 한쪽만 판다 — 그 차이가 n log n 과 n 이다</text><text class="ink2 sm" x="20" y="50" text-anchor="start">분할이 끝나면 피벗의 자리가 정해진다. 그 자리가 찾는 k 보다 크면 오른쪽은 볼 필요가 없다</text><rect x="178" y="68" width="34" height="28" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="195" y="87" text-anchor="middle">3</text><text class="ink2 sm" x="195" y="110" text-anchor="middle">1</text><rect x="212" y="68" width="34" height="28" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="229" y="87" text-anchor="middle">2</text><text class="ink2 sm" x="229" y="110" text-anchor="middle">2</text><rect x="246" y="68" width="34" height="28" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="263" y="87" text-anchor="middle">1</text><text class="ink2 sm" x="263" y="110" text-anchor="middle">3</text><rect x="280" y="68" width="34" height="28" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="297" y="87" text-anchor="middle">4</text><text class="ink2 sm" x="297" y="110" text-anchor="middle">4</text><rect x="314" y="68" width="34" height="28" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="331" y="87" text-anchor="middle">7</text><text class="ink2 sm" x="331" y="110" text-anchor="middle">5</text><rect x="348" y="68" width="34" height="28" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="365" y="87" text-anchor="middle">8</text><text class="ink2 sm" x="365" y="110" text-anchor="middle">6</text><rect x="382" y="68" width="34" height="28" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="399" y="87" text-anchor="middle">9</text><text class="ink2 sm" x="399" y="110" text-anchor="middle">7</text><rect x="416" y="68" width="34" height="28" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="433" y="87" text-anchor="middle">5</text><text class="ink2 sm" x="433" y="110" text-anchor="middle">8</text><rect x="450" y="68" width="34" height="28" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="467" y="87" text-anchor="middle">6</text><text class="ink2 sm" x="467" y="110" text-anchor="middle">9</text><rect x="484" y="68" width="34" height="28" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="501" y="87" text-anchor="middle">11</text><text class="ink2 sm" x="501" y="110" text-anchor="middle">10</text><rect x="518" y="68" width="34" height="28" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="535" y="87" text-anchor="middle">10</text><text class="ink2 sm" x="535" y="110" text-anchor="middle">11</text><rect x="552" y="68" width="34" height="28" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="569" y="87" text-anchor="middle">12</text><text class="ink2 sm" x="569" y="110" text-anchor="middle">12</text><text class="ink2 sm" x="172" y="86" text-anchor="end">값</text><text class="ink2 sm" x="172" y="110" text-anchor="end">몇 번째</text><text class="ink sm" x="600" y="86" text-anchor="start">피벗 4 는 4번째로 작다</text><text class="ink2 sm" x="228" y="134" text-anchor="middle">k = 3 이면 여기만</text><text class="ink2 sm" x="450" y="134" text-anchor="middle">통째로 버린다</text><rect x="14" y="152" width="380" height="210" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="204" y="172" text-anchor="middle">평균 — 반씩 줄어든다</text><text class="ink2 sm" x="204" y="188" text-anchor="middle">되풀이할 때마다 볼 것이 절반이 된다</text><rect x="120" y="204" width="216" height="20" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.3"/><text class="ink2 sm" x="112" y="219" text-anchor="end">n</text><rect x="120" y="236" width="108" height="20" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.3"/><text class="ink2 sm" x="112" y="251" text-anchor="end">n/2</text><rect x="120" y="268" width="54" height="20" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.3"/><text class="ink2 sm" x="112" y="283" text-anchor="end">n/4</text><rect x="120" y="300" width="27" height="20" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.3"/><text class="ink2 sm" x="112" y="315" text-anchor="end">n/8</text><text class="ink bold sm" x="28" y="350" text-anchor="start">n + n/2 + n/4 + … &lt; 2n → O(n)</text><rect x="406" y="152" width="380" height="210" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="596" y="172" text-anchor="middle">최악 — 하나씩만 줄어든다</text><text class="ink2 sm" x="596" y="188" text-anchor="middle">피벗이 매번 가장 작거나 가장 큰 값일 때</text><rect x="512" y="204" width="216" height="20" rx="2" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.3"/><text class="ink2 sm" x="504" y="219" text-anchor="end">n</text><rect x="512" y="236" width="198" height="20" rx="2" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.3"/><text class="ink2 sm" x="504" y="251" text-anchor="end">n−1</text><rect x="512" y="268" width="180" height="20" rx="2" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.3"/><text class="ink2 sm" x="504" y="283" text-anchor="end">n−2</text><rect x="512" y="300" width="162" height="20" rx="2" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.3"/><text class="ink2 sm" x="504" y="315" text-anchor="end">n−3</text><text class="ink bold sm" x="420" y="350" text-anchor="start">n + (n−1) + … ≈ n²/2 → O(n²)</text><text class="ink2 sm" x="20" y="394" text-anchor="start">퀵 정렬이라면 양쪽을 다 정렬해야 하므로 층마다 n 이 들고 층이 log n 개다.</text><text class="ink2 sm" x="20" y="414" text-anchor="start">피벗을 무작위로 고르면 평균이 O(n) 이고 최악은 여전히 O(n²) 이다. 확률이 아주 작을 뿐이다.</text><text class="ink2 sm" x="20" y="434" text-anchor="start">최악까지 O(n) 으로 묶으려면 피벗을 중앙값의 중앙값으로 고른다. 상수가 커서 실무에서는 드물다</text>
</svg>