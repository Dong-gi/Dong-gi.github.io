<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" width="800" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">편집 거리의 세 연산</title><desc id="d">대각선 이웃은 교체, 위 이웃은 삭제, 왼쪽 이웃은 삽입에 해당한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">편집 거리 — 왼쪽 · 위 · 대각선 세 이웃이 그대로 삽입 · 삭제 · 교체다</text><rect x="20" y="46" width="380" height="246" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="210" y="66" text-anchor="middle">한 칸을 정하는 세 후보</text><text class="ink2 sm" x="210" y="82" text-anchor="middle">d[i][j] 를 채운다</text><rect x="128" y="116" width="84" height="60" rx="3" fill="none" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="170" y="150" text-anchor="middle">d[i−1][j−1]</text><rect x="212" y="116" width="84" height="60" rx="3" fill="none" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="254" y="150" text-anchor="middle">d[i−1][j]</text><rect x="128" y="176" width="84" height="60" rx="3" fill="none" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="170" y="210" text-anchor="middle">d[i][j−1]</text><rect x="212" y="176" width="84" height="60" rx="3" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink bold sm" x="254" y="210" text-anchor="middle">d[i][j]</text><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M196 164 L234 198"/><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M254 162 L254 188"/><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M196 206 L224 206"/><text class="ink2 sm" x="38" y="250" text-anchor="start">대각선 — 두 글자가 같으면 +0, 다르면 교체 +1</text><text class="ink2 sm" x="38" y="268" text-anchor="start">위 — 윗글자를 삭제 +1        왼쪽 — 글자를 삽입 +1</text><text class="ink bold sm" x="38" y="286" text-anchor="start">셋 중 가장 작은 값을 적는다</text><rect x="418" y="46" width="362" height="246" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="599" y="66" text-anchor="middle">kitten 을 sitting 으로</text><text class="ink2 sm" x="599" y="82" text-anchor="middle">세 번이면 된다</text><rect x="452" y="116" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="468" y="137" text-anchor="middle">k</text><rect x="452" y="178" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="468" y="199" text-anchor="middle">s</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M468 148 L468 174"/><text class="ink bold sm" x="468" y="228" text-anchor="middle">교체</text><rect x="488" y="116" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink sm" x="504" y="137" text-anchor="middle">i</text><rect x="488" y="178" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink sm" x="504" y="199" text-anchor="middle">i</text><rect x="524" y="116" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink sm" x="540" y="137" text-anchor="middle">t</text><rect x="524" y="178" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink sm" x="540" y="199" text-anchor="middle">t</text><rect x="560" y="116" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink sm" x="576" y="137" text-anchor="middle">t</text><rect x="560" y="178" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink sm" x="576" y="199" text-anchor="middle">t</text><rect x="596" y="116" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="612" y="137" text-anchor="middle">e</text><rect x="596" y="178" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="612" y="199" text-anchor="middle">i</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M612 148 L612 174"/><text class="ink bold sm" x="612" y="228" text-anchor="middle">교체</text><rect x="632" y="116" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink sm" x="648" y="137" text-anchor="middle">n</text><rect x="632" y="178" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink sm" x="648" y="199" text-anchor="middle">n</text><rect x="668" y="116" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink2 sm" x="684" y="137" text-anchor="middle">·</text><rect x="668" y="178" width="32" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="684" y="199" text-anchor="middle">g</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M684 148 L684 174"/><text class="ink bold sm" x="684" y="228" text-anchor="middle">삽입</text><text class="ink bold" x="578" y="258" text-anchor="middle">편집 거리 = 3</text><text class="ink2 sm" x="578" y="282" text-anchor="middle">표의 오른쪽 아래 칸이 이 값이다</text><text class="ink2 sm" x="400" y="316" text-anchor="middle">맞춤법 검사, 유전자 서열 비교, 파일 차이 보기(diff)가 모두 이 표다.</text><text class="ink2 sm" x="400" y="336" text-anchor="middle">연산의 값을 바꾸면(예컨대 삽입만 비싸게) 표 채우는 규칙만 고치면 된다 — 이것이 DP 의 유연함이다</text>
</svg>