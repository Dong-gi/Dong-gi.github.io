<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">스택과 큐</title><desc id="d">스택은 같은 쪽에서 넣고 빼고 큐는 한쪽으로 넣어 반대쪽으로 뺀다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="24" text-anchor="middle">넣는 곳과 빼는 곳이 같은가 다른가 — 차이는 이것뿐이다</text><rect x="20" y="44" width="350" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="195" y="64" text-anchor="middle">스택 — 같은 쪽에서 넣고 뺀다</text><text class="ink2 sm" x="195" y="80" text-anchor="middle">나중에 넣은 것이 먼저 나온다</text><rect x="130" y="222" width="96" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="178" y="245" text-anchor="middle">A</text><rect x="130" y="188" width="96" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="178" y="211" text-anchor="middle">B</text><rect x="130" y="154" width="96" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="178" y="177" text-anchor="middle">C</text><path d="M128 120 L128 256 L228 256 L228 120" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M272 112 L206 140"/><text class="ink bold sm" x="276" y="108" text-anchor="start">넣기</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M150 140 L84 112"/><text class="ink bold sm" x="80" y="108" text-anchor="end">빼기</text><text class="ink2 sm" x="195" y="288" text-anchor="middle">C 가 가장 마지막에 들어왔고 가장 먼저 나간다</text><rect x="390" y="44" width="350" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="565" y="64" text-anchor="middle">큐 — 한쪽으로 넣고 반대쪽으로 뺀다</text><text class="ink2 sm" x="565" y="80" text-anchor="middle">먼저 넣은 것이 먼저 나온다</text><rect x="430" y="150" width="62" height="40" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="461" y="176" text-anchor="middle">A</text><rect x="492" y="150" width="62" height="40" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="523" y="176" text-anchor="middle">B</text><rect x="554" y="150" width="62" height="40" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="585" y="176" text-anchor="middle">C</text><path d="M428 146 L658 146" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M428 194 L658 194" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M682 170 L628 170"/><text class="ink bold sm" x="686" y="156" text-anchor="middle">넣기</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M418 170 L384 170"/><text class="ink bold sm" x="400" y="156" text-anchor="middle">빼기</text><text class="ink2 sm" x="565" y="288" text-anchor="middle">A 가 가장 먼저 들어왔고 가장 먼저 나간다</text><text class="ink2 sm" x="380" y="334" text-anchor="middle">둘 다 넣기와 빼기가 O(1) 이다. 자료를 어디에 두느냐가 아니라 어느 쪽 끝만 쓰기로 약속했느냐가 이 둘을 만든다</text>
</svg>