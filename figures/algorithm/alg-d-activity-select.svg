<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 478" width="828" height="478" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">활동 선택 문제</title><desc id="d">끝나는 시각이 이른 것부터 고르면 최대 개수가 나오지만 짧은 것부터 고르면 손해를 본다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="414" y="26" text-anchor="middle">겹치지 않게 가장 많이 고르려면 — 끝나는 시각이 이른 것부터</text><path d="M110 56 L110 282" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="110" y="50" text-anchor="middle">0</text><path d="M174 56 L174 282" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="174" y="50" text-anchor="middle">2</text><path d="M238 56 L238 282" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="238" y="50" text-anchor="middle">4</text><path d="M302 56 L302 282" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="302" y="50" text-anchor="middle">6</text><path d="M366 56 L366 282" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="366" y="50" text-anchor="middle">8</text><path d="M430 56 L430 282" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="430" y="50" text-anchor="middle">10</text><path d="M494 56 L494 282" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="494" y="50" text-anchor="middle">12</text><path d="M558 56 L558 282" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="558" y="50" text-anchor="middle">14</text><path d="M622 56 L622 282" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="622" y="50" text-anchor="middle">16</text><text class="ink2 sm" x="648" y="50" text-anchor="middle">시각</text><text class="ink bold sm" x="94" y="79" text-anchor="end">A</text><rect x="142" y="66" width="96" height="19" rx="3" fill="var(--s3)" fill-opacity="0.34" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="190" y="80" text-anchor="middle">1 – 4</text><text class="ink bold sm" x="642" y="80" text-anchor="start">고른다</text><text class="ink2 sm" x="94" y="106" text-anchor="end">B</text><rect x="206" y="93" width="64" height="19" rx="3" fill="var(--grid)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="238" y="107" text-anchor="middle">3 – 5</text><text class="ink2 sm" x="642" y="107" text-anchor="start">겹친다</text><text class="ink2 sm" x="94" y="133" text-anchor="end">C</text><rect x="110" y="120" width="192" height="19" rx="3" fill="var(--grid)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="206" y="134" text-anchor="middle">0 – 6</text><text class="ink2 sm" x="642" y="134" text-anchor="start">겹친다</text><text class="ink bold sm" x="94" y="160" text-anchor="end">D</text><rect x="270" y="147" width="64" height="19" rx="3" fill="var(--s3)" fill-opacity="0.34" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="302" y="161" text-anchor="middle">5 – 7</text><text class="ink bold sm" x="642" y="161" text-anchor="start">고른다</text><text class="ink2 sm" x="94" y="187" text-anchor="end">E</text><rect x="206" y="174" width="192" height="19" rx="3" fill="var(--grid)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="302" y="188" text-anchor="middle">3 – 9</text><text class="ink2 sm" x="642" y="188" text-anchor="start">겹친다</text><text class="ink2 sm" x="94" y="214" text-anchor="end">F</text><rect x="302" y="201" width="128" height="19" rx="3" fill="var(--grid)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="366" y="215" text-anchor="middle">6 – 10</text><text class="ink2 sm" x="642" y="215" text-anchor="start">겹친다</text><text class="ink bold sm" x="94" y="241" text-anchor="end">G</text><rect x="366" y="228" width="96" height="19" rx="3" fill="var(--s3)" fill-opacity="0.34" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="414" y="242" text-anchor="middle">8 – 11</text><text class="ink bold sm" x="642" y="242" text-anchor="start">고른다</text><text class="ink bold sm" x="94" y="268" text-anchor="end">H</text><rect x="494" y="255" width="128" height="19" rx="3" fill="var(--s3)" fill-opacity="0.34" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="558" y="269" text-anchor="middle">12 – 16</text><text class="ink bold sm" x="642" y="269" text-anchor="start">고른다</text><text class="ink2 sm" x="110" y="302" text-anchor="start">끝나는 시각 순으로 늘어놓았다. 앞서 고른 것이 끝난 뒤에 시작하면 고르고, 아니면 버린다 — 네 개.</text><path d="M40 322 L788 322" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="110" y="346" text-anchor="start">‘가장 짧은 것부터’ 는 왜 안 되는가</text><text class="ink2 sm" x="94" y="371" text-anchor="end">P</text><rect x="110" y="359" width="288" height="17" rx="3" fill="var(--grid)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="254" y="372" text-anchor="middle">0 – 9</text><text class="ink2 sm" x="642" y="372" text-anchor="start">이제 못 고른다</text><text class="ink2 sm" x="94" y="395" text-anchor="end">Q</text><rect x="366" y="383" width="96" height="17" rx="3" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.8"/><text class="ink2 sm" x="414" y="396" text-anchor="middle">8 – 11</text><text class="ink bold sm" x="642" y="396" text-anchor="start">가장 짧다 · 고른다</text><text class="ink2 sm" x="94" y="419" text-anchor="end">R</text><rect x="430" y="407" width="192" height="17" rx="3" fill="var(--grid)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="526" y="420" text-anchor="middle">10 – 16</text><text class="ink2 sm" x="642" y="420" text-anchor="start">이제 못 고른다</text><text class="ink2 sm" x="110" y="444" text-anchor="start">가장 짧은 Q 하나를 고르면 P 와 R 을 둘 다 잃는다. 하나 대 둘이다.</text><text class="ink bold sm" x="110" y="462" text-anchor="start">‘무엇이 좋아 보이는가’ 를 잘못 고르면 탐욕은 곧바로 무너진다</text>
</svg>