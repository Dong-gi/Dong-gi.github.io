<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 400" width="770" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">충돌 처리 — 체이닝과 개방 주소법</title><desc id="d">체이닝은 칸마다 목록을 매달고 개방 주소법은 비어 있는 다른 칸을 찾아 넣는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="385" y="24" text-anchor="middle">같은 칸을 두 키가 차지하려 할 때 — 밖에 매달거나, 옆칸으로 밀거나</text><rect x="14" y="42" width="366" height="300" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="197" y="62" text-anchor="middle">체이닝 — 칸마다 목록을 매단다</text><text class="ink2 sm" x="197" y="78" text-anchor="middle">충돌한 키는 그 목록에 이어 붙인다</text><rect x="60" y="92" width="40" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="50" y="111" text-anchor="end">0</text><path fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)" d="M104 106 L122 106"/><rect x="126" y="92" width="40" height="28" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="146" y="111" text-anchor="middle">E</text><rect x="60" y="126" width="40" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="50" y="145" text-anchor="end">1</text><rect x="60" y="160" width="40" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="50" y="179" text-anchor="end">2</text><path fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)" d="M104 174 L122 174"/><rect x="126" y="160" width="40" height="28" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="146" y="179" text-anchor="middle">A</text><path fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)" d="M170 174 L188 174"/><rect x="192" y="160" width="40" height="28" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="212" y="179" text-anchor="middle">D</text><path fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)" d="M236 174 L254 174"/><rect x="258" y="160" width="40" height="28" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="278" y="179" text-anchor="middle">G</text><rect x="60" y="194" width="40" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="50" y="213" text-anchor="end">3</text><path fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)" d="M104 208 L122 208"/><rect x="126" y="194" width="40" height="28" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="146" y="213" text-anchor="middle">B</text><rect x="60" y="228" width="40" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="50" y="247" text-anchor="end">4</text><rect x="60" y="262" width="40" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="50" y="281" text-anchor="end">5</text><path fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)" d="M104 276 L122 276"/><rect x="126" y="262" width="40" height="28" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="146" y="281" text-anchor="middle">C</text><path fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)" d="M170 276 L188 276"/><rect x="192" y="262" width="40" height="28" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="212" y="281" text-anchor="middle">F</text><text class="ink2 sm" x="196" y="326" text-anchor="middle">목록이 길어지면 그만큼 훑어야 한다</text><rect x="392" y="42" width="366" height="300" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="575" y="62" text-anchor="middle">개방 주소법 — 빈 칸을 찾아 옆으로 민다</text><text class="ink2 sm" x="575" y="78" text-anchor="middle">표 밖에 아무것도 두지 않는다</text><rect x="456" y="92" width="60" height="22" rx="2" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="446" y="108" text-anchor="end">0</text><text class="ink sm" x="486" y="108" text-anchor="middle">E</text><rect x="456" y="118" width="60" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="446" y="134" text-anchor="end">1</text><rect x="456" y="144" width="60" height="22" rx="2" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="446" y="160" text-anchor="end">2</text><text class="ink sm" x="486" y="160" text-anchor="middle">A</text><rect x="456" y="170" width="60" height="22" rx="2" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="446" y="186" text-anchor="end">3</text><text class="ink sm" x="486" y="186" text-anchor="middle">B</text><rect x="456" y="196" width="60" height="22" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.7"/><text class="ink2 sm" x="446" y="212" text-anchor="end">4</text><text class="ink sm" x="486" y="212" text-anchor="middle">D</text><rect x="456" y="222" width="60" height="22" rx="2" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="446" y="238" text-anchor="end">5</text><text class="ink sm" x="486" y="238" text-anchor="middle">C</text><rect x="456" y="248" width="60" height="22" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.7"/><text class="ink2 sm" x="446" y="264" text-anchor="end">6</text><text class="ink sm" x="486" y="264" text-anchor="middle">F</text><rect x="456" y="274" width="60" height="22" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.7"/><text class="ink2 sm" x="446" y="290" text-anchor="end">7</text><text class="ink sm" x="486" y="290" text-anchor="middle">G</text><path d="M522 155 C562 155 562 207 522 207" fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink2 sm" x="572" y="160" text-anchor="start">D 도 2번을 원했지만</text><text class="ink2 sm" x="572" y="186" text-anchor="start">차 있어서 3, 4 를 보다가</text><text class="ink2 sm" x="572" y="212" text-anchor="start">4번에 앉았다</text><text class="ink2 sm" x="574" y="326" text-anchor="middle">찬 칸이 뭉치면 탐사가 길어진다 — 군집화</text><text class="ink2 sm" x="385" y="372" text-anchor="middle">체이닝은 적재율이 1 을 넘어도 동작하고 삭제가 간단하다. 개방 주소법은 포인터가 없어 공간이 알뜰하고 캐시에 친하다.</text><text class="ink2 sm" x="385" y="392" text-anchor="middle">대신 개방 주소법은 적재율이 1 에 가까워지면 급격히 느려지고, 삭제할 때 빈 칸을 그냥 만들면 안 된다</text>
</svg>