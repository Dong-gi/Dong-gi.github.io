<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">재귀 트리로 재귀식 풀기</title><desc id="d">문제를 반으로 나누는 재귀식을 펼치면 층이 log n 개이고 층마다 비용이 n 이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="24" text-anchor="middle">재귀식을 나무로 펼치면 층마다 드는 비용이 보인다</text><path d="M285.32 78.57 L194.68 131.43" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M314.68 78.57 L405.32 131.43" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M168.94 152.91 L131.06 197.09" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M191.06 152.91 L228.94 197.09" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M408.94 152.91 L371.06 197.09" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M431.06 152.91 L468.94 197.09" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M119.59 226.99 L118.32 279" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M128.85 224.51 L163.23 280.9" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M236.36 226.6 L224.79 279.3" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M246.51 225.7 L269.02 279.99" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M353.49 225.7 L330.98 279.99" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M363.64 226.6 L375.21 279.3" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.15 224.51 L436.77 280.9" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M480.41 226.99 L481.68 279" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 244 L505 244" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text class="ink2 sm" x="300" y="258" text-anchor="middle">⋮   중간 층이 이렇게 이어진다   ⋮</text><circle cx="300" cy="70" r="17" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="300" y="75" text-anchor="middle">n</text><text class="ink sm" x="586" y="75" text-anchor="start">n</text><text class="ink2 sm" x="550" y="75" text-anchor="end">0 층</text><circle cx="180" cy="140" r="17" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="180" y="145" text-anchor="middle">n/2</text><circle cx="420" cy="140" r="17" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="420" y="145" text-anchor="middle">n/2</text><text class="ink sm" x="586" y="145" text-anchor="start">2 × n/2 = n</text><text class="ink2 sm" x="550" y="145" text-anchor="end">1 층</text><circle cx="120" cy="210" r="17" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="120" y="215" text-anchor="middle">n/4</text><circle cx="240" cy="210" r="17" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="240" y="215" text-anchor="middle">n/4</text><circle cx="360" cy="210" r="17" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="360" y="215" text-anchor="middle">n/4</text><circle cx="480" cy="210" r="17" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="480" y="215" text-anchor="middle">n/4</text><text class="ink sm" x="586" y="215" text-anchor="start">4 × n/4 = n</text><text class="ink2 sm" x="550" y="215" text-anchor="end">2 층</text><circle cx="118" cy="292" r="13" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="118" y="297" text-anchor="middle">1</text><circle cx="170" cy="292" r="13" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="170" y="297" text-anchor="middle">1</text><circle cx="222" cy="292" r="13" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="222" y="297" text-anchor="middle">1</text><circle cx="274" cy="292" r="13" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="274" y="297" text-anchor="middle">1</text><circle cx="326" cy="292" r="13" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="326" y="297" text-anchor="middle">1</text><circle cx="378" cy="292" r="13" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="378" y="297" text-anchor="middle">1</text><circle cx="430" cy="292" r="13" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="430" y="297" text-anchor="middle">1</text><circle cx="482" cy="292" r="13" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="482" y="297" text-anchor="middle">1</text><text class="ink sm" x="586" y="297" text-anchor="start">n × 1 = n</text><text class="ink2 sm" x="550" y="297" text-anchor="end">잎 층</text><path d="M560 56 L560 306" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="586" y="44" text-anchor="start">그 층의 비용 합</text><text class="ink bold sm" x="500" y="330" text-anchor="middle">층이 log₂ n + 1 개 × 층마다 n = n log₂ n</text><text class="ink2 sm" x="66" y="350" text-anchor="start">T(n) = 2T(n/2) + n 을 펼친 그림. 문제를 반으로 쪼개므로 층은 log₂ n 개 생기고,</text><text class="ink2 sm" x="66" y="368" text-anchor="start">층마다 합치는 비용은 언제나 n 이다. 두 값을 곱한 것이 전체 비용이다</text>
</svg>