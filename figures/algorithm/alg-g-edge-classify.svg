<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 366" width="792" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">깊이 우선 탐색의 간선 분류</title><desc id="d">트리 간선 · 뒤 간선 · 앞 간선 · 교차 간선을 발견 시각과 종료 시각으로 구분한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="396" y="24" text-anchor="middle">탐색이 지나간 간선이 트리를 이루고 나머지는 셋 중 하나로 분류된다</text><path d="M122 106 L220 106" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M242 124 L242 214" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M224 236 L126 236" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M392 124 L392 214" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M117.1 223.66 L225.99 121.09" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><path d="M104 124 L104 214" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M378.4 117.79 L258.63 221.59" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><circle cx="104" cy="106" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="104" y="111" text-anchor="middle">u</text><circle cx="242" cy="106" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="242" y="111" text-anchor="middle">v</text><circle cx="392" cy="106" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="392" y="111" text-anchor="middle">w</text><circle cx="104" cy="236" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="104" y="241" text-anchor="middle">x</text><circle cx="242" cy="236" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="242" y="241" text-anchor="middle">y</text><circle cx="392" cy="236" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="392" y="241" text-anchor="middle">z</text><path d="M410 227 C 476 200, 476 142, 410 115" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink2 sm" x="104" y="142" text-anchor="middle">1 / 8</text><text class="ink2 sm" x="242" y="142" text-anchor="middle">2 / 7</text><text class="ink2 sm" x="242" y="272" text-anchor="middle">3 / 6</text><text class="ink2 sm" x="104" y="272" text-anchor="middle">4 / 5</text><text class="ink2 sm" x="392" y="142" text-anchor="middle">9 / 12</text><text class="ink2 sm" x="392" y="272" text-anchor="middle">10 / 11</text><text class="ink2 sm" x="104" y="62" text-anchor="start">발견 시각 / 종료 시각</text><path d="M478 72 L512 72" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="520" y="76" text-anchor="start">트리 간선</text><text class="ink2 sm" x="478" y="93" text-anchor="start">탐색이 실제로 지나간 간선. 이것만 모으면 탐색 트리다</text><path d="M478 112 L512 112" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="520" y="116" text-anchor="start">뒤 간선 (back)</text><text class="ink2 sm" x="478" y="133" text-anchor="start">조상으로 되돌아간다. 이것이 있으면 순환이 있다</text><path d="M478 152 L512 152" fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="520" y="156" text-anchor="start">앞 간선 (forward)</text><text class="ink2 sm" x="478" y="173" text-anchor="start">이미 끝난 자손으로 건너뛴다</text><path d="M478 192 L512 192" fill="none" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="520" y="196" text-anchor="start">교차 간선 (cross)</text><text class="ink2 sm" x="478" y="213" text-anchor="start">조상도 자손도 아닌 곳으로 간다</text><text class="ink2 sm" x="20" y="324" text-anchor="start">분류 기준은 간선을 따라갈 때 상대 정점의 상태다. 처음 보면 트리, 아직 안 끝났으면 뒤, 이미 끝났으면 앞이나 교차다.</text><text class="ink2 sm" x="20" y="342" text-anchor="start">무방향 그래프에는 트리 간선과 뒤 간선만 생긴다. 앞 간선과 교차 간선은 방향이 있어야 나온다.</text><text class="ink2 sm" x="20" y="360" text-anchor="start">뒤 간선이 하나라도 있으면 순환이 있고, 하나도 없으면 없다 — 순환 탐지가 이 한 줄이다</text>
</svg>