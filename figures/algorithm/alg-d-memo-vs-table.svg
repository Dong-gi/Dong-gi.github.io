<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 366" width="812" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">메모이제이션과 상향식 표 채우기</title><desc id="d">하향식은 필요한 칸만 재귀로 채우고 상향식은 작은 것부터 표를 전부 채운다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="406" y="26" text-anchor="middle">같은 표를 채우는 두 방향</text><rect x="20" y="46" width="380" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="210" y="66" text-anchor="middle">하향식 — 메모이제이션</text><text class="ink2 sm" x="210" y="82" text-anchor="middle">재귀 그대로 두고 답을 적어 둔다</text><path d="M187.52 110.32 L152.48 133.68" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M213.35 108.84 L264.65 135.16" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M128.9 152.09 L107.1 171.91" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M153.27 148.99 L202.73 175.01" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M87.83 194.58 L78.17 209.42" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M107.89 191.15 L136.11 212.85" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M63.29 235.42 L58.71 244.58" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M81.15 232.03 L98.85 247.97" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="102" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="200" y="106" text-anchor="middle">F6</text><circle cx="140" cy="142" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="140" y="146" text-anchor="middle">F5</text><circle cx="278" cy="142" r="15" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="2" stroke-dasharray="4 3"/><text class="ink sm" x="278" y="146" text-anchor="middle">F4</text><circle cx="96" cy="182" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="96" y="186" text-anchor="middle">F4</text><circle cx="216" cy="182" r="15" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="2" stroke-dasharray="4 3"/><text class="ink sm" x="216" y="186" text-anchor="middle">F3</text><circle cx="70" cy="222" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="70" y="226" text-anchor="middle">F3</text><circle cx="148" cy="222" r="15" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="2" stroke-dasharray="4 3"/><text class="ink sm" x="148" y="226" text-anchor="middle">F2</text><circle cx="52" cy="258" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="52" y="262" text-anchor="middle">F2</text><circle cx="110" cy="258" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="110" y="262" text-anchor="middle">F1</text><text class="ink2 sm" x="308" y="192" text-anchor="middle">점선 원은 표에서</text><text class="ink2 sm" x="308" y="208" text-anchor="middle">꺼내 쓴 것 — 더 안 판다</text><text class="ink2 sm" x="210" y="288" text-anchor="middle">필요한 칸만 채운다. 재귀 깊이만큼 스택을 쓴다</text><rect x="412" y="46" width="380" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="602" y="66" text-anchor="middle">상향식 — 표 채우기</text><text class="ink2 sm" x="602" y="82" text-anchor="middle">작은 것부터 순서대로</text><rect x="456" y="142" width="42" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="477" y="167" text-anchor="middle">0</text><text class="ink2 sm" x="477" y="196" text-anchor="middle">0</text><rect x="498" y="142" width="42" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="519" y="167" text-anchor="middle">1</text><text class="ink2 sm" x="519" y="196" text-anchor="middle">1</text><rect x="540" y="142" width="42" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="561" y="167" text-anchor="middle">1</text><text class="ink2 sm" x="561" y="196" text-anchor="middle">2</text><rect x="582" y="142" width="42" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="603" y="167" text-anchor="middle">2</text><text class="ink2 sm" x="603" y="196" text-anchor="middle">3</text><rect x="624" y="142" width="42" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="645" y="167" text-anchor="middle">3</text><text class="ink2 sm" x="645" y="196" text-anchor="middle">4</text><rect x="666" y="142" width="42" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="687" y="167" text-anchor="middle">5</text><text class="ink2 sm" x="687" y="196" text-anchor="middle">5</text><rect x="708" y="142" width="42" height="40" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="729" y="167" text-anchor="middle">8</text><text class="ink2 sm" x="729" y="196" text-anchor="middle">6</text><text class="ink2 sm" x="477" y="132" text-anchor="middle">1</text><text class="ink2 sm" x="519" y="132" text-anchor="middle">2</text><text class="ink2 sm" x="561" y="132" text-anchor="middle">3</text><text class="ink2 sm" x="603" y="132" text-anchor="middle">4</text><text class="ink2 sm" x="645" y="132" text-anchor="middle">5</text><text class="ink2 sm" x="687" y="132" text-anchor="middle">6</text><text class="ink2 sm" x="729" y="132" text-anchor="middle">7</text><text class="ink2 sm" x="448" y="132" text-anchor="end">채우는 차례</text><path d="M687 184 Q706.5 206 726 184" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)"/><path d="M645 184 Q680.5 228 716 184" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink2 sm" x="602" y="264" text-anchor="middle">앞 두 칸만 보면 되므로 두 변수로도 된다</text><text class="ink2 sm" x="602" y="288" text-anchor="middle">표를 전부 채운다. 재귀가 없어 스택을 안 쓴다</text><text class="ink2 sm" x="406" y="334" text-anchor="middle">둘의 답은 같다. 부분문제 중 실제로 쓰이는 것이 적으면 하향식이, 어차피 다 쓰면 상향식이 유리하다.</text><text class="ink2 sm" x="406" y="354" text-anchor="middle">상향식은 채우는 순서를 사람이 정해야 한다 — 그 순서가 곧 부분문제 DAG 의 위상 순서다</text>
</svg>