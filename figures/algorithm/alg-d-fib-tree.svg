ity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="490" y="238" text-anchor="middle">F1</text><circle cx="699.25" cy="122" r="16" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="699.25" y="126" text-anchor="middle">F4</text><circle cx="629.5" cy="178" r="16" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="629.5" y="182" text-anchor="middle">F3</text><circle cx="583" cy="234" r="16" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="583" y="238" text-anchor="middle">F2</text><circle cx="552" cy="290" r="16" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="552" y="294" text-anchor="middle">F1</text><circle cx="614" cy="290" r="16" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="614" y="294" text-anchor="middle">F0</text><circle cx="676" cy="234" r="16" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="676" y="238" text-anchor="middle">F1</text><circle cx="769" cy="178" r="16" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="769" y="182" text-anchor="middle">F2</text><circle cx="738" cy="234" r="16" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="738" y="238" text-anchor="middle">F1</text><circle cx="800" cy="234" r="16" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="800" y="238" text-anchor="middle">F0</text><text class="ink bold sm" x="426" y="360" text-anchor="middle">F6 1번   ·   F5 1번   ·   F4 2번   ·   F3 3번   ·   F2 5번   ·   F1 8번   ·   F0 5번   =   모두 25번</text><text class="ink2 sm" x="426" y="382" text-anchor="middle">색이 같은 원은 똑같은 계산이다. 아래로 갈수록 같은 것이 늘어나고, n 이 커지면 호출 수가 F(n) 만큼, 곧 지수로 늘어난다.</text><text class="ink2 sm" x="426" y="402" text-anchor="middle">이것이 ‘겹치는 부분문제(overlapping subproblems)’ 다. 답을 한 번만 구해 적어 두면 25번이 7번이 된다</text>
