<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="720" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">선형 탐색의 최선 · 평균 · 최악</title><desc id="d">찾는 값의 위치에 따라 비교 횟수가 1에서 n까지 달라지고 평균은 그 중간이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="360" y="26" text-anchor="middle">같은 크기의 입력이라도 비용이 다르다 — 그래서 셋을 따로 잰다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M70 278 L552 278"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M70 278 L70 44"/><path d="M106.15 278 L106.15 282" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="106.15" y="295" text-anchor="middle">1</text><path d="M214.62 278 L214.62 282" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="214.62" y="295" text-anchor="middle">4</text><path d="M359.23 278 L359.23 282" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="359.23" y="295" text-anchor="middle">8</text><path d="M503.85 278 L503.85 282" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="503.85" y="295" text-anchor="middle">12</text><path d="M66 260.92 L70 260.92" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="62" y="264.92" text-anchor="end">1</text><path d="M66 209.69 L70 209.69" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="62" y="213.69" text-anchor="end">4</text><path d="M66 141.38 L70 141.38" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="62" y="145.38" text-anchor="end">8</text><path d="M66 73.08 L70 73.08" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="62" y="77.08" text-anchor="end">12</text><text class="ink2 sm" x="556" y="283" text-anchor="start">찾는 값이 놓인 자리</text><text class="ink2 sm" x="66" y="38" text-anchor="middle">비교 횟수</text><rect x="94.94" y="260.92" width="22.41" height="17.08" rx="3" fill="var(--s3)" fill-opacity="0.55" stroke="var(--s3)" stroke-width="1"/><rect x="131.1" y="243.85" width="22.41" height="34.15" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1"/><rect x="167.25" y="226.77" width="22.41" height="51.23" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1"/><rect x="203.41" y="209.69" width="22.41" height="68.31" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1"/><rect x="239.56" y="192.62" width="22.41" height="85.38" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1"/><rect x="275.71" y="175.54" width="22.41" height="102.46" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1"/><rect x="311.87" y="158.46" width="22.41" height="119.54" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1"/><rect x="348.02" y="141.38" width="22.41" height="136.62" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1"/><rect x="384.17" y="124.31" width="22.41" height="153.69" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1"/><rect x="420.33" y="107.23" width="22.41" height="170.77" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1"/><rect x="456.48" y="90.15" width="22.41" height="187.85" rx="3" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1"/><rect x="492.64" y="73.08" width="22.41" height="204.92" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1"/><path d="M70 167 L540 167" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/><text class="ink2 sm" x="546" y="171" text-anchor="start">평균 6.5</text><text class="ink bold sm" x="106.15" y="250.92" text-anchor="middle">최선 1</text><text class="ink bold sm" x="501.85" y="63.08" text-anchor="middle">최악 12</text><text class="ink2 sm" x="70" y="334" text-anchor="start">앞에서부터 훑어 찾는 알고리즘. 값이 첫 자리에 있으면 1번, 마지막에 있으면 12번 비교한다.</text><text class="ink2 sm" x="70" y="354" text-anchor="start">어느 자리든 같은 확률이라 보면 평균은 (n+1)/2 번이고, 이것도 n 에 비례하므로 최악과 평균이 같은 O(n) 이다</text>
</svg>