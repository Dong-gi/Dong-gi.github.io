<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 390" width="792" height="390" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">벨만-포드의 라운드와 음수 순환 탐지</title><desc id="d">모든 간선을 V-1 번 훑고 V 번째에 갱신이 일어나면 음수 순환이 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="396" y="24" text-anchor="middle">간선을 훑는 순서가 나쁘면 한 라운드에 정점 하나씩만 정해진다</text><rect x="14" y="42" width="374" height="306" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="201" y="62" text-anchor="middle">왜 V−1 라운드가 필요한가</text><text class="ink2 sm" x="201" y="78" text-anchor="middle">간선을 B→C, A→B, S→A 순서로 훑는다고 하자</text><path d="M78 122 L128 122" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 bold sm" x="105" y="137" text-anchor="middle">3</text><path d="M168 122 L218 122" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 bold sm" x="195" y="137" text-anchor="middle">2</text><path d="M258 122 L308 122" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 bold sm" x="285" y="137" text-anchor="middle">-1</text><circle cx="60" cy="122" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="60" y="127" text-anchor="middle">S</text><circle cx="150" cy="122" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="150" y="127" text-anchor="middle">A</text><circle cx="240" cy="122" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="240" y="127" text-anchor="middle">B</text><circle cx="330" cy="122" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="330" y="127" text-anchor="middle">C</text><text class="ink bold sm" x="190" y="188" text-anchor="middle">S</text><text class="ink bold sm" x="234" y="188" text-anchor="middle">A</text><text class="ink bold sm" x="278" y="188" text-anchor="middle">B</text><text class="ink bold sm" x="322" y="188" text-anchor="middle">C</text><text class="ink2 sm" x="162" y="210" text-anchor="end">0 (초기)</text><rect x="168" y="194" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="190" y="210" text-anchor="middle">0</text><rect x="212" y="194" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="234" y="210" text-anchor="middle">∞</text><rect x="256" y="194" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="278" y="210" text-anchor="middle">∞</text><rect x="300" y="194" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="322" y="210" text-anchor="middle">∞</text><text class="ink2 sm" x="162" y="236" text-anchor="end">1 라운드</text><rect x="168" y="220" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="190" y="236" text-anchor="middle">0</text><rect x="212" y="220" width="44" height="22" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="234" y="236" text-anchor="middle">3</text><rect x="256" y="220" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="278" y="236" text-anchor="middle">∞</text><rect x="300" y="220" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="322" y="236" text-anchor="middle">∞</text><text class="ink2 sm" x="162" y="262" text-anchor="end">2 라운드</text><rect x="168" y="246" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="190" y="262" text-anchor="middle">0</text><rect x="212" y="246" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="234" y="262" text-anchor="middle">3</text><rect x="256" y="246" width="44" height="22" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="278" y="262" text-anchor="middle">5</text><rect x="300" y="246" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="322" y="262" text-anchor="middle">∞</text><text class="ink2 sm" x="162" y="288" text-anchor="end">3 라운드</text><rect x="168" y="272" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="190" y="288" text-anchor="middle">0</text><rect x="212" y="272" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="234" y="288" text-anchor="middle">3</text><rect x="256" y="272" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="278" y="288" text-anchor="middle">5</text><rect x="300" y="272" width="44" height="22" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="322" y="288" text-anchor="middle">4</text><text class="ink2 sm" x="162" y="314" text-anchor="end">4 라운드</text><rect x="168" y="298" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="190" y="314" text-anchor="middle">0</text><rect x="212" y="298" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="234" y="314" text-anchor="middle">3</text><rect x="256" y="298" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="278" y="314" text-anchor="middle">5</text><rect x="300" y="298" width="44" height="22" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="322" y="314" text-anchor="middle">4</text><text class="ink2 sm" x="28" y="340" text-anchor="start">4 라운드에 변화가 없다 — 여기서 멈춰도 된다</text><rect x="404" y="42" width="374" height="306" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="591" y="62" text-anchor="middle">음수 순환 탐지</text><text class="ink2 sm" x="591" y="78" text-anchor="middle">C→A 간선 −5 를 더하면 고리의 합이 −4 다</text><path d="M468 122 L518 122" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 bold sm" x="495" y="137" text-anchor="middle">3</text><path d="M558 122 L608 122" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 bold sm" x="585" y="137" text-anchor="middle">2</text><path d="M648 122 L698 122" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 bold sm" x="675" y="137" text-anchor="middle">-1</text><circle cx="450" cy="122" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="450" y="127" text-anchor="middle">S</text><circle cx="540" cy="122" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="540" y="127" text-anchor="middle">A</text><circle cx="630" cy="122" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="630" y="127" text-anchor="middle">B</text><circle cx="720" cy="122" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="720" y="127" text-anchor="middle">C</text><path d="M706 138 C 660 196, 590 196, 552 140" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink2 bold sm" x="630" y="190" text-anchor="middle">−5</text><text class="ink2 sm" x="420" y="226" text-anchor="start">A → B → C → A 를 한 바퀴 돌면 2 + (−1) + (−5) = −4 다.</text><text class="ink2 sm" x="420" y="246" text-anchor="start">정점이 4 개이므로 3 라운드면 끝나야 하는데,</text><text class="ink2 sm" x="420" y="266" text-anchor="start">4 라운드에서도 값이 또 줄어든다.</text><text class="ink bold sm" x="420" y="292" text-anchor="start">V 번째 라운드에 갱신이 일어나면</text><text class="ink bold sm" x="420" y="312" text-anchor="start">음수 순환이 있다는 뜻이다</text><text class="ink2 sm" x="420" y="336" text-anchor="start">탐지가 알고리즘 안에 들어 있는 셈이다</text><text class="ink2 sm" x="20" y="382" text-anchor="start">최단경로는 간선을 많아야 V−1 개 지난다. 라운드마다 적어도 정점 하나가 확정되므로 V−1 라운드면 충분하다</text>
</svg>