<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 350" width="770" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">마스터 정리의 세 경우</title><desc id="d">층별 비용이 아래로 갈수록 커지는지 고른지 위가 큰지에 따라 답이 셋으로 갈린다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="385" y="24" text-anchor="middle">층별 비용이 늘어나는가 · 고른가 · 줄어드는가 — 세 경우는 이것뿐이다</text><rect x="14" y="40" width="236" height="252" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="132" y="60" text-anchor="middle">1. 잎이 무겁다</text><text class="ink2 sm" x="132" y="76" text-anchor="middle">아래로 갈수록 커진다</text><rect x="105.6" y="96" width="52.8" height="26" rx="3" fill="var(--s2)" fill-opacity="0.35" stroke="var(--s2)" stroke-width="1.2"/><text class="ink2 sm" x="228" y="114" text-anchor="start">0 층</text><rect x="91.52" y="130" width="80.96" height="26" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="228" y="148" text-anchor="start">1 층</text><rect x="72.16" y="164" width="119.68" height="26" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="228" y="182" text-anchor="start">2 층</text><rect x="44" y="198" width="176" height="26" rx="3" fill="var(--s3)" fill-opacity="0.35" stroke="var(--s3)" stroke-width="1.2"/><text class="ink2 sm" x="228" y="216" text-anchor="start">잎</text><text class="ink2 sm" x="132" y="250" text-anchor="middle">합치는 비용이 더 작다</text><text class="ink bold sm" x="132" y="272" text-anchor="middle">T(n) = Θ(잎 층의 비용)</text><rect x="264" y="40" width="236" height="252" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="382" y="60" text-anchor="middle">2. 고르다</text><text class="ink2 sm" x="382" y="76" text-anchor="middle">층마다 비슷하다</text><rect x="306.32" y="96" width="151.36" height="26" rx="3" fill="var(--s2)" fill-opacity="0.35" stroke="var(--s2)" stroke-width="1.2"/><text class="ink2 sm" x="478" y="114" text-anchor="start">0 층</text><rect x="306.32" y="130" width="151.36" height="26" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="478" y="148" text-anchor="start">1 층</text><rect x="306.32" y="164" width="151.36" height="26" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="478" y="182" text-anchor="start">2 층</text><rect x="306.32" y="198" width="151.36" height="26" rx="3" fill="var(--s3)" fill-opacity="0.35" stroke="var(--s3)" stroke-width="1.2"/><text class="ink2 sm" x="478" y="216" text-anchor="start">잎</text><text class="ink2 sm" x="382" y="250" text-anchor="middle">두 비용이 같은 크기다</text><text class="ink bold sm" x="382" y="272" text-anchor="middle">T(n) = Θ(잎 비용 × log n)</text><rect x="514" y="40" width="236" height="252" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="632" y="60" text-anchor="middle">3. 뿌리가 무겁다</text><text class="ink2 sm" x="632" y="76" text-anchor="middle">위로 갈수록 커진다</text><rect x="544" y="96" width="176" height="26" rx="3" fill="var(--s2)" fill-opacity="0.35" stroke="var(--s2)" stroke-width="1.2"/><text class="ink2 sm" x="728" y="114" text-anchor="start">0 층</text><rect x="572.16" y="130" width="119.68" height="26" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="728" y="148" text-anchor="start">1 층</text><rect x="591.52" y="164" width="80.96" height="26" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="728" y="182" text-anchor="start">2 층</text><rect x="605.6" y="198" width="52.8" height="26" rx="3" fill="var(--s3)" fill-opacity="0.35" stroke="var(--s3)" stroke-width="1.2"/><text class="ink2 sm" x="728" y="216" text-anchor="start">잎</text><text class="ink2 sm" x="632" y="250" text-anchor="middle">합치는 비용이 더 크다</text><text class="ink bold sm" x="632" y="272" text-anchor="middle">T(n) = Θ(f(n))</text><text class="ink2 sm" x="385" y="322" text-anchor="middle">막대의 가로 길이가 그 층 전체의 비용이다. 어느 쪽이 무거운지가 답을 정한다. 잎 층의 비용은 본문의 식으로 정확히 적는다.</text><text class="ink2 sm" x="385" y="340" text-anchor="middle">세 경우 사이에 틈이 있어서, 어느 쪽에도 해당하지 않는 재귀식에는 마스터 정리를 쓸 수 없다</text>
</svg>