<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" width="800" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">바꿔치기 논법</title><desc id="d">최적해에서 탐욕과 처음 갈리는 선택을 탐욕의 선택으로 바꿔도 나빠지지 않음을 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">탐욕이 옳음을 보이는 표준 수법 — 최적해를 탐욕해 쪽으로 한 칸씩 민다</text><text class="ink bold sm" x="134" y="93" text-anchor="end">탐욕해 G</text><rect x="150" y="68" width="96" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="198" y="92" text-anchor="middle">g<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="260" y="68" width="96" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="308" y="92" text-anchor="middle">g<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="370" y="68" width="96" height="40" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="418" y="92" text-anchor="middle">g<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="480" y="68" width="96" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="528" y="92" text-anchor="middle">g<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><text class="ink2 sm" x="598" y="93" text-anchor="start">탐욕이 고른 것</text><text class="ink bold sm" x="134" y="171" text-anchor="end">어떤 최적해 O</text><rect x="150" y="146" width="96" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="198" y="170" text-anchor="middle">g<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="260" y="146" width="96" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="308" y="170" text-anchor="middle">g<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="370" y="146" width="96" height="40" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="2"/><text class="ink sm" x="418" y="170" text-anchor="middle">o<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="480" y="146" width="96" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="528" y="170" text-anchor="middle">o<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><text class="ink2 sm" x="598" y="171" text-anchor="start">여기서 처음 갈린다</text><text class="ink bold sm" x="134" y="271" text-anchor="end">O 를 고친 것</text><rect x="150" y="246" width="96" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="198" y="270" text-anchor="middle">g<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="260" y="246" width="96" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="308" y="270" text-anchor="middle">g<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="370" y="246" width="96" height="40" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="2"/><text class="ink sm" x="418" y="270" text-anchor="middle">g<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="480" y="246" width="96" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="528" y="270" text-anchor="middle">o<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><text class="ink2 sm" x="598" y="271" text-anchor="start">갈리는 자리가 한 칸 뒤로</text><text class="ink2 sm" x="418" y="60" text-anchor="middle">↓ 처음 갈리는 자리</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M418 190 L418 240"/><text class="ink bold sm" x="430" y="218" text-anchor="start">o<tspan baseline-shift="-22%" font-size="76%">3</tspan> 를 g<tspan baseline-shift="-22%" font-size="76%">3</tspan> 로 바꿔치기</text><path d="M40 302 L760 302" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="400" y="322" text-anchor="middle">바꾼 것도 여전히 답이고 값이 나빠지지 않는다. 그러면 이 되풀이 끝에 O 가 G 가 된다 — G 도 최적이다</text><text class="ink bold sm" x="400" y="340" text-anchor="middle">보여야 할 것은 딱 하나, ‘바꿔도 나빠지지 않는다’ 이다</text>
</svg>