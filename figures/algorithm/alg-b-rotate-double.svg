.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="385" y="24" text-anchor="middle">x · y · z 가 꺾여 있으면 먼저 펴고 나서 돌린다 — 본문의 LR 예제</text><rect x="14" y="42" width="242" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="135" y="62" text-anchor="middle">처음 — 9 가 불균형</text><text class="ink2 sm" x="135" y="78" text-anchor="middle">z = 9, y = 3, x = 5 로 꺾였다</text><path d="M109.32 131.23 L88.68 156.77" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M133.27 128.62 L171.73 159.38" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M68.89 184.35 L54.11 207.65" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M87.3 184.23 L102.7 207.77" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M122.03 235.73 L139.97 260.27" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="118" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="120" y="123" text-anchor="middle">9</text><circle cx="78" cy="170" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="78" y="175" text-anchor="middle">3</text><circle cx="185" cy="170" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="185" y="175" text-anchor="middle">11</text><circle cx="45" cy="222" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="45" y="227" text-anchor="middle">1</text><circle cx="112" cy="222" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="112" y="227" text-anchor="middle">5</text><circle cx="150" cy="274" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="150" y="279" text-anchor="middle">7</text><rect x="264" y="42" width="242" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="385" y="62" text-anchor="middle">1단계 — 3 을 왼쪽으로 돌린다</text><text class="ink2 sm" x="385" y="78" text-anchor="middle">9, 5, 3 이 한 방향이 되었다</text><path d="M408.22 130.25 L381.78 157.75" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M432.35 129.68 L462.65 158.32" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M359.63 183.47 L340.37 208.53" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M380.37 183.47 L399.63 208.53" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.09 236.48 L306.91 259.52" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420" cy="118" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="420" y="123" text-anchor="middle">9</text><circle cx="370" cy="170" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="370" y="175" text-anchor="middle">5</text><circle cx="475" cy="170" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="475" y="175" text-anchor="middle">11</text><circle cx="330" cy="222" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="330" y="227" text-anchor="middle">3</text><circle cx="410" cy="222" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="410" y="227" text-anchor="middle">7</text><circle cx="298" cy="274" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="298" y="279" text-anchor="middle">1</text><rect x="514" y="42" width="242" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="635" y="62" text-anchor="middle">2단계 — 9 를 오른쪽으로 돌린다</text><text class="ink2 sm" x="635" y="78" text-anchor="middle">높이 차가 모두 1 이하가 되었다</text><path d="M618.56 142.58 L581.44 183.42" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M641.44 142.58 L678.56 183.42" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M561.86 210.92 L542.14 247.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M681.86 210.92 L662.14 247.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M698.14 210.92 L717.86 247.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="630" cy="130" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="630" y="135" text-anchor="middle">5</text><circle cx="570" cy="196" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="570" y="201" text-anchor="middle">3</text><circle cx="690" cy="196" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="690" y="201" text-anchor="middle">9</text><circle cx="534" cy="262" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="534" y="267" text-anchor="middle">1</text><circle cx="654" cy="262" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="654" y="267" text-anchor="middle">7</text><circle cx="726" cy="262" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="726" y="267" text-anchor="middle">11</text><text class="ink2 sm" x="26" y="330" text-anchor="start">한 번만 돌리면 꺾인 모양이 반대쪽으로 옮겨 갈 뿐 균형이 잡히지 않는다. 그래서 아래쪽을 먼저 펴 준다.</text><text class="ink2 sm" x="26" y="348" text-anchor="start">RL 은 이것의 거울상이다. 오른쪽 자식을 먼저 오른쪽으로 돌려 편 다음 전체를 왼쪽으로 돌린다</text>
</svg>