<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 356" width="770" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">AVL 트리의 이중 회전 LR</title><desc id="d">꺾인 모양은 아래쪽을 먼저 돌려 한 방향으로 편 뒤 다시 돌려야 균형이 잡힌다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
