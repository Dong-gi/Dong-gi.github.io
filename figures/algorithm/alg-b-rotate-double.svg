<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 356" width="770" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">AVL 트리의 이중 회전 LR</title><desc id="d">꺾인 모양은 아래쪽을 먼저 돌려 한 방향으로 편 뒤 다시 돌려야 균형이 잡힌다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="385" y="24" text-anchor="middle">x · y · z 가 꺾여 있으면 먼저 펴고 나서 돌린다 — 원문의 LR 예제</text><rect x="14" y="42" width="242" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="135" y="62" text-anchor="middle">처음 — 9 가 불균형</text><text class="ink2 sm" x="135" y="78" text-anchor="middle">z = 9, y = 3, x = 5 로 꺾였다</text><path d="M99.38 135.27 L72.62 168.73" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M122.91 133.06 L167.09 170.94" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 197 L38 227" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M71.1 196.36 L90.9 227.64" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M109.43 256.14 L126.57 281.86" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110" cy="122" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="110" y="127" text-anchor="middle">9</text><circle cx="62" cy="182" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="62" y="187" text-anchor="middle">3</text><circle cx="180" cy="182" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="180" y="187" text-anchor="middle">11</text><circle cx="30" cy="242" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="30" y="247" text-anchor="middle">1</text><circle cx="100" cy="242" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="100" y="247" text-anchor="middle">5</text><circle cx="136" cy="296" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="136" y="301" text-anchor="middle">7</text><rect x="264" y="42" width="242" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="385" y="62" text-anchor="middle">1단계 — 3 을 왼쪽으로 돌린다</text><text class="ink2 sm" x="385" y="78" text-anchor="middle">9, 5, 3 이 한 방향이 되었다</text><path d="M349.38 135.27 L322.62 168.73" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M372.91 133.06 L417.09 170.94" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M304 197 L288 227" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.1 196.36 L340.9 227.64" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M271.33 256.62 L256.67 281.38" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="122" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="360" y="127" text-anchor="middle">9</text><circle cx="312" cy="182" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="312" y="187" text-anchor="middle">5</text><circle cx="430" cy="182" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="430" y="187" text-anchor="middle">11</text><circle cx="280" cy="242" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="280" y="247" text-anchor="middle">3</text><circle cx="350" cy="242" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="350" y="247" text-anchor="middle">7</text><circle cx="248" cy="296" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="248" y="301" text-anchor="middle">1</text><rect x="514" y="42" width="242" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="635" y="62" text-anchor="middle">2단계 — 9 를 오른쪽으로 돌린다</text><text class="ink2 sm" x="635" y="78" text-anchor="middle">높이 차가 모두 1 이하가 되었다</text><path d="M618.56 142.58 L581.44 183.42" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M641.44 142.58 L678.56 183.42" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M561.86 210.92 L542.14 247.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M681.86 210.92 L662.14 247.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M698.14 210.92 L717.86 247.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="630" cy="130" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="630" y="135" text-anchor="middle">5</text><circle cx="570" cy="196" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="570" y="201" text-anchor="middle">3</text><circle cx="690" cy="196" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="690" y="201" text-anchor="middle">9</text><circle cx="534" cy="262" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="534" y="267" text-anchor="middle">1</text><circle cx="654" cy="262" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="654" y="267" text-anchor="middle">7</text><circle cx="726" cy="262" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="726" y="267" text-anchor="middle">11</text><text class="ink2 sm" x="26" y="330" text-anchor="start">한 번만 돌리면 꺾인 모양이 반대쪽으로 옮겨 갈 뿐 균형이 잡히지 않는다. 그래서 아래쪽을 먼저 펴 준다.</text><text class="ink2 sm" x="26" y="348" text-anchor="start">RL 은 이것의 거울상이다. 오른쪽 자식을 먼저 오른쪽으로 돌려 편 다음 전체를 왼쪽으로 돌린다</text>
</svg>