<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 426" width="800" height="426" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">위상 정렬 두 가지 방법</title><desc id="d">진입차수가 0 인 정점을 꺼내는 방법과 깊이 우선 종료 순서를 뒤집는 방법</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="24" text-anchor="middle">선후관계를 간선으로 적고 순서를 뽑는다 — 방법은 둘이고 답은 여럿이다</text><rect x="14" y="42" width="366" height="350" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="197" y="62" text-anchor="middle">방법 1 — 진입차수가 0 인 것부터 꺼낸다</text><text class="ink2 sm" x="197" y="78" text-anchor="middle">노드 위 작은 숫자가 진입차수다</text><path d="M87 122 L165 122" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M83.21 205.3 L169.68 135.22" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M87 216 L165 216" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M186 139 L186 195" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M201.76 128.36 L280.53 160.14" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M201.67 209.4 L280.65 176.15" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><circle cx="70" cy="122" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="70" y="127" text-anchor="middle">a</text><circle cx="70" cy="216" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="70" y="221" text-anchor="middle">b</text><circle cx="186" cy="122" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="186" y="127" text-anchor="middle">c</text><circle cx="186" cy="216" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="186" y="221" text-anchor="middle">d</text><circle cx="300" cy="168" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="300" y="173" text-anchor="middle">e</text><text class="ink2 bold sm" x="70" y="96" text-anchor="middle">0</text><text class="ink2 bold sm" x="70" y="190" text-anchor="middle">0</text><text class="ink2 bold sm" x="186" y="96" text-anchor="middle">2</text><text class="ink2 bold sm" x="186" y="190" text-anchor="middle">2</text><text class="ink2 bold sm" x="300" y="142" text-anchor="middle">2</text><text class="ink2 bold sm" x="30" y="262" text-anchor="start">단계</text><text class="ink2 bold sm" x="118" y="262" text-anchor="start">큐</text><text class="ink2 bold sm" x="196" y="262" text-anchor="start">줄어든 진입차수</text><text class="ink2 sm" x="30" y="282" text-anchor="start">시작</text><text class="ink sm" x="118" y="282" text-anchor="start">a b</text><text class="ink2 sm" x="196" y="282" text-anchor="start">—</text><text class="ink2 sm" x="30" y="300" text-anchor="start">a 꺼냄</text><text class="ink sm" x="118" y="300" text-anchor="start">b</text><text class="ink2 sm" x="196" y="300" text-anchor="start">c 가 1 로</text><text class="ink2 sm" x="30" y="318" text-anchor="start">b 꺼냄</text><text class="ink sm" x="118" y="318" text-anchor="start">c</text><text class="ink2 sm" x="196" y="318" text-anchor="start">c 가 0, d 가 1 로</text><text class="ink2 sm" x="30" y="336" text-anchor="start">c 꺼냄</text><text class="ink sm" x="118" y="336" text-anchor="start">d</text><text class="ink2 sm" x="196" y="336" text-anchor="start">d 가 0, e 가 1 로</text><text class="ink2 sm" x="30" y="354" text-anchor="start">d 꺼냄</text><text class="ink sm" x="118" y="354" text-anchor="start">e</text><text class="ink2 sm" x="196" y="354" text-anchor="start">e 가 0 으로</text><text class="ink2 sm" x="30" y="372" text-anchor="start">e 꺼냄</text><text class="ink sm" x="118" y="372" text-anchor="start">(빔)</text><text class="ink2 sm" x="196" y="372" text-anchor="start">끝</text><text class="ink bold sm" x="30" y="384" text-anchor="start">결과: a b c d e</text><rect x="396" y="42" width="390" height="350" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="591" y="62" text-anchor="middle">방법 2 — 깊이 우선의 종료 순서를 뒤집는다</text><text class="ink2 sm" x="591" y="78" text-anchor="middle">노드 위 작은 숫자가 종료 순서다</text><path d="M469 122 L547 122" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M465.21 205.3 L551.68 135.22" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M469 216 L547 216" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M568 139 L568 195" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M583.76 128.36 L662.53 160.14" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M583.67 209.4 L662.65 176.15" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><circle cx="452" cy="122" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="452" y="127" text-anchor="middle">a</text><circle cx="452" cy="216" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="452" y="221" text-anchor="middle">b</text><circle cx="568" cy="122" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="568" y="127" text-anchor="middle">c</text><circle cx="568" cy="216" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="568" y="221" text-anchor="middle">d</text><circle cx="682" cy="168" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="682" y="173" text-anchor="middle">e</text><text class="ink2 bold sm" x="452" y="96" text-anchor="middle">4</text><text class="ink2 bold sm" x="452" y="190" text-anchor="middle">5</text><text class="ink2 bold sm" x="568" y="96" text-anchor="middle">3</text><text class="ink2 bold sm" x="568" y="190" text-anchor="middle">2</text><text class="ink2 bold sm" x="682" y="142" text-anchor="middle">1</text><text class="ink2 sm" x="412" y="262" text-anchor="start">끝난 차례로 적으면</text><rect x="412" y="274" width="44" height="26" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="434" y="292" text-anchor="middle">e</text><rect x="456" y="274" width="44" height="26" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="478" y="292" text-anchor="middle">d</text><rect x="500" y="274" width="44" height="26" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="522" y="292" text-anchor="middle">c</text><rect x="544" y="274" width="44" height="26" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="566" y="292" text-anchor="middle">a</text><rect x="588" y="274" width="44" height="26" rx="2" fill="var(--grid)" fill-opacity="0.2" stroke="var(--grid)" stroke-width="1.8"/><text class="ink sm" x="610" y="292" text-anchor="middle">b</text><text class="ink2 sm" x="412" y="328" text-anchor="start">뒤집으면</text><rect x="412" y="340" width="44" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="434" y="358" text-anchor="middle">b</text><rect x="456" y="340" width="44" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="478" y="358" text-anchor="middle">a</text><rect x="500" y="340" width="44" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="522" y="358" text-anchor="middle">c</text><rect x="544" y="340" width="44" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="566" y="358" text-anchor="middle">d</text><rect x="588" y="340" width="44" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="610" y="358" text-anchor="middle">e</text><text class="ink bold sm" x="412" y="384" text-anchor="start">결과: b a c d e — 앞의 답과 다르지만 둘 다 옳다</text><text class="ink2 sm" x="20" y="420" text-anchor="start">순환이 있으면 방법 1 은 큐가 먼저 비고 방법 2 는 뒤 간선을 만난다. 그래서 순환 탐지가 덤으로 따라온다</text>
</svg>