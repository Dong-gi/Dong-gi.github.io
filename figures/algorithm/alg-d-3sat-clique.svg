<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 400" width="828" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">3SAT 에서 클리크로 가는 환원</title><desc id="d">절마다 세 점을 찍고 서로 다른 절이면서 모순이 아닌 리터럴끼리 이으면 절 수만 한 클리크가 곧 만족 배정이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="414" y="26" text-anchor="middle">3SAT 을 클리크 문제로 바꾼다 — 절마다 세 점을 찍고 모순이 아닌 것끼리 잇는다</text><text class="ink bold" x="414" y="52" text-anchor="middle">(x₁ ∨ ¬x₂ ∨ ¬x₃) ∧ (¬x₁ ∨ x₂ ∨ x₃) ∧ (x₁ ∨ x₂ ∨ x₃)</text><text class="ink2 sm" x="470" y="172" text-anchor="middle">절 1</text><text class="ink2 sm" x="300" y="244" text-anchor="middle">절 2</text><text class="ink2 sm" x="638" y="244" text-anchor="middle">절 3</text><path d="M414 120 L470 84 L526 120 L414 120" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M244 288 L300 324 L356 288 L244 288" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M582 288 L638 324 L694 288 L582 288" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M459.76 102.33 L366.24 269.67" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M480.11 102.41 L571.89 269.59" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M377 288 L561 288" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M399.06 134.76 L258.94 273.24" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 sm" x="56" y="190" text-anchor="start">x₁ 과 ¬x₁ 은 모순이라</text><text class="ink2 sm" x="56" y="208" text-anchor="start">잇지 않는다 (연한 점선)</text><text class="ink2 sm" x="56" y="238" text-anchor="start">같은 절 안끼리도</text><text class="ink2 sm" x="56" y="256" text-anchor="start">잇지 않는다</text><circle cx="414" cy="120" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="414" y="124" text-anchor="middle">x₁</text><circle cx="470" cy="84" r="21" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="470" y="88" text-anchor="middle">¬x₂</text><circle cx="526" cy="120" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="526" y="124" text-anchor="middle">¬x₃</text><circle cx="244" cy="288" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="244" y="292" text-anchor="middle">¬x₁</text><circle cx="300" cy="324" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="300" y="328" text-anchor="middle">x₂</text><circle cx="356" cy="288" r="21" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="356" y="292" text-anchor="middle">x₃</text><circle cx="582" cy="288" r="21" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="582" y="292" text-anchor="middle">x₁</text><circle cx="638" cy="324" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="638" y="328" text-anchor="middle">x₂</text><circle cx="694" cy="288" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="694" y="292" text-anchor="middle">x₃</text><path d="M40 342 L788 342" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="414" y="366" text-anchor="middle">절이 k 개일 때 크기 k 인 클리크가 있다 ⟺ 논리식을 참으로 만드는 값이 있다. 굵게 이어진 셋은 x₁ = 참, x₂ = 거짓, x₃ = 참 을 뜻한다.</text><text class="ink2 sm" x="414" y="386" text-anchor="middle">점을 찍고 선을 긋는 일이 논리식 길이에 비례하므로 변환 자체는 다항 시간이다 — 환원의 조건을 지켰다</text>
</svg>