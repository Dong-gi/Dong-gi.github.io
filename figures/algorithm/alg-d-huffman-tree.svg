<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 404" width="812" height="404" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">허프만 트리와 부호표</title><desc id="d">빈도가 높은 글자가 얕은 곳에 놓여 짧은 부호를 받는다. 어떤 부호도 다른 부호의 접두가 아니다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="406" y="26" text-anchor="middle">자주 나오는 글자가 뿌리에 가깝다 — 그것이 부호를 짧게 만든다</text><path d="M267.85 78.56 L194.15 121.44" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="224" y="98" text-anchor="end">0</text><path d="M304.15 78.56 L377.85 121.44" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="348" y="98" text-anchor="start">1</text><path d="M380.94 146.63 L341.06 185.37" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="354" y="164" text-anchor="end">0</text><path d="M411.06 146.63 L450.94 185.37" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="438" y="164" text-anchor="start">1</text><path d="M315.35 218.1 L296.65 249.9" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="299" y="232" text-anchor="end">0</text><path d="M335.39 218.78 L350.61 249.22" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="350" y="232" text-anchor="start">1</text><path d="M456.17 218.56 L439.83 249.44" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="441" y="232" text-anchor="end">0</text><path d="M477.04 217.87 L496.96 250.13" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="494" y="232" text-anchor="start">1</text><path d="M420.38 286.67 L405.62 315.33" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="406" y="299" text-anchor="end">0</text><path d="M439.62 286.67 L454.38 315.33" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="454" y="299" text-anchor="start">1</text><circle cx="286" cy="68" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="286" y="72" text-anchor="middle">100</text><circle cx="176" cy="132" r="21" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="176" y="136" text-anchor="middle">a 45</text><circle cx="396" cy="132" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="396" y="136" text-anchor="middle">55</text><circle cx="326" cy="200" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="326" y="204" text-anchor="middle">25</text><circle cx="466" cy="200" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="466" y="204" text-anchor="middle">30</text><circle cx="286" cy="268" r="21" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="286" y="272" text-anchor="middle">c 12</text><circle cx="360" cy="268" r="21" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="360" y="272" text-anchor="middle">b 13</text><circle cx="430" cy="268" r="21" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="430" y="272" text-anchor="middle">14</text><circle cx="508" cy="268" r="21" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="508" y="272" text-anchor="middle">d 16</text><circle cx="396" cy="334" r="21" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="396" y="338" text-anchor="middle">f 5</text><circle cx="464" cy="334" r="21" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="464" y="338" text-anchor="middle">e 9</text><text class="ink2 sm" x="176" y="178" text-anchor="middle">가장 자주 나오는 a 는</text><text class="ink bold sm" x="176" y="194" text-anchor="middle">한 걸음 — 부호가 1비트</text><text class="ink2 sm" x="592" y="66" text-anchor="start">글자   빈도   부호   비트</text><path d="M592 74 L782 74" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="598" y="96" text-anchor="start">a</text><text class="ink2 sm" x="650" y="96" text-anchor="end">45</text><text class="ink sm" x="668" y="96" text-anchor="start">0</text><text class="ink2 sm" x="770" y="96" text-anchor="end">45</text><text class="ink bold sm" x="598" y="120" text-anchor="start">b</text><text class="ink2 sm" x="650" y="120" text-anchor="end">13</text><text class="ink sm" x="668" y="120" text-anchor="start">101</text><text class="ink2 sm" x="770" y="120" text-anchor="end">39</text><text class="ink bold sm" x="598" y="144" text-anchor="start">c</text><text class="ink2 sm" x="650" y="144" text-anchor="end">12</text><text class="ink sm" x="668" y="144" text-anchor="start">100</text><text class="ink2 sm" x="770" y="144" text-anchor="end">36</text><text class="ink bold sm" x="598" y="168" text-anchor="start">d</text><text class="ink2 sm" x="650" y="168" text-anchor="end">16</text><text class="ink sm" x="668" y="168" text-anchor="start">111</text><text class="ink2 sm" x="770" y="168" text-anchor="end">48</text><text class="ink bold sm" x="598" y="192" text-anchor="start">e</text><text class="ink2 sm" x="650" y="192" text-anchor="end">9</text><text class="ink sm" x="668" y="192" text-anchor="start">1101</text><text class="ink2 sm" x="770" y="192" text-anchor="end">36</text><text class="ink bold sm" x="598" y="216" text-anchor="start">f</text><text class="ink2 sm" x="650" y="216" text-anchor="end">5</text><text class="ink sm" x="668" y="216" text-anchor="start">1100</text><text class="ink2 sm" x="770" y="216" text-anchor="end">20</text><path d="M592 250 L782 250" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="598" y="270" text-anchor="start">허프만</text><text class="ink bold sm" x="770" y="270" text-anchor="end">224 비트</text><text class="ink2 sm" x="598" y="292" text-anchor="start">길이 3 고정 부호</text><text class="ink2 sm" x="770" y="292" text-anchor="end">300 비트</text><text class="ink bold sm" x="598" y="320" text-anchor="start">25% 를 줄였다</text><text class="ink2 sm" x="406" y="372" text-anchor="middle">어떤 부호도 다른 부호의 앞부분이 아니다(글자가 모두 잎이므로). 그래서 띄어쓰기 없이 이어 붙여도 되읽을 수 있다.</text><text class="ink2 sm" x="406" y="392" text-anchor="middle">왼쪽 0, 오른쪽 1 로 읽으면 뿌리에서 잎까지의 길이가 곧 부호의 비트 수다</text>
</svg>