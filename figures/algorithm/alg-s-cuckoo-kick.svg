<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 396" width="852" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">쿠쿠 해싱의 밀어내기</title><desc id="d">키를 넣을 자리가 차 있으면 그 키를 다른 표의 제 자리로 밀어내고, 그것이 연쇄로 일어난다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="426" y="26" text-anchor="middle">자리가 차 있으면 밀어낸다 — 뻐꾸기가 남의 알을 밀어내듯이</text><text class="ink bold sm" x="62" y="78" text-anchor="start">T₁ — 해시 h₁ 이 정하는 자리</text><text class="ink bold sm" x="62" y="234" text-anchor="start">T₂ — 해시 h₂ 가 정하는 자리</text><rect x="62" y="104" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="88" y="156" text-anchor="middle">0</text><rect x="114" y="104" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="140" y="128" text-anchor="middle">별</text><text class="ink2 sm" x="140" y="156" text-anchor="middle">1</text><rect x="166" y="104" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="192" y="156" text-anchor="middle">2</text><rect x="218" y="104" width="52" height="38" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="244" y="128" text-anchor="middle">새</text><text class="ink2 sm" x="244" y="156" text-anchor="middle">3</text><rect x="270" y="104" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="296" y="156" text-anchor="middle">4</text><rect x="322" y="104" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="348" y="156" text-anchor="middle">5</text><rect x="374" y="104" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="400" y="156" text-anchor="middle">6</text><rect x="426" y="104" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="452" y="156" text-anchor="middle">7</text><rect x="374" y="104" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.9" stroke-dasharray="5 4"/><rect x="62" y="246" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="88" y="298" text-anchor="middle">0</text><rect x="114" y="246" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="140" y="270" text-anchor="middle">달</text><text class="ink2 sm" x="140" y="298" text-anchor="middle">1</text><rect x="166" y="246" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="192" y="298" text-anchor="middle">2</text><rect x="218" y="246" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="244" y="298" text-anchor="middle">3</text><rect x="270" y="246" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="296" y="298" text-anchor="middle">4</text><rect x="322" y="246" width="52" height="38" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="348" y="270" text-anchor="middle">해</text><text class="ink2 sm" x="348" y="298" text-anchor="middle">5</text><rect x="374" y="246" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="400" y="298" text-anchor="middle">6</text><rect x="426" y="246" width="52" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="452" y="298" text-anchor="middle">7</text><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M244 66 L244 98"/><text class="ink bold sm" x="244" y="58" text-anchor="middle">나비</text><text class="ink bold sm" x="260" y="58" text-anchor="start">①</text><path d="M236 162 Q290 200 336 240" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink bold sm" x="226" y="192" text-anchor="middle">②</text><path d="M370 244 Q444 186 406 150" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><text class="ink bold sm" x="386" y="194" text-anchor="middle">③</text><path d="M474 80 L474 132" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="486" y="92" text-anchor="start">① 나비를 넣는다. h₁(나비) = 3 인데</text><text class="ink2 sm" x="486" y="109" text-anchor="start">그 자리에 ‘새’ 가 앉아 있다.</text><text class="ink2 sm" x="486" y="126" text-anchor="start">나비를 앉히고 새를 일으킨다</text><path d="M474 174 L474 226" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="486" y="186" text-anchor="start">② 새의 다른 자리는 h₂(새) = 5 다.</text><text class="ink2 sm" x="486" y="203" text-anchor="start">거기에는 ‘해’ 가 있다.</text><text class="ink2 sm" x="486" y="220" text-anchor="start">새를 앉히고 해를 일으킨다</text><path d="M474 268 L474 302" fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="486" y="280" text-anchor="start">③ 해의 다른 자리는 h₁(해) = 6 이고</text><text class="ink2 sm" x="486" y="297" text-anchor="start">비어 있다. 여기서 멈춘다</text><path d="M52 330 L800 330" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="426" y="350" text-anchor="middle">찾기는 언제나 두 자리만 본다. T₁[h₁(x)] 와 T₂[h₂(x)] 뿐이므로 최악에도 상수 시간이다</text><text class="ink2 sm" x="426" y="370" text-anchor="middle">밀어내기가 고리를 돌아 끝나지 않을 수 있다. 정해진 횟수를 넘으면 표를 키우고 전부 다시 넣는다</text><text class="ink2 sm" x="426" y="388" text-anchor="middle">표의 절반 정도까지만 채우면 그 일이 드물다 — 남는 자리를 비워 두는 것이 쿠쿠 해싱이 치르는 값이다</text>
</svg>