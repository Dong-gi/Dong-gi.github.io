xt><path d="M204 244 L214 244 L209 253 Z" fill="var(--s2)"/><path d="M204 334 L214 334 L209 325 Z" fill="var(--s2)"/><rect x="300" y="277" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="315" y="295" text-anchor="middle">1</text><rect x="330" y="277" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="345" y="295" text-anchor="middle">2</text><rect x="360" y="277" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="375" y="295" text-anchor="middle">3</text><rect x="390" y="277" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="405" y="295" text-anchor="middle">4</text><rect x="420" y="277" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="435" y="295" text-anchor="middle">5</text><rect x="450" y="277" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="465" y="295" text-anchor="middle">7</text><rect x="480" y="277" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="510" y="277" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="300" y="268" text-anchor="start">결과</text><text class="ink sm" x="552" y="296" text-anchor="start">8 &lt; 9 → 왼쪽에서 8 을 꺼낸다</text><text class="ink2 sm" x="20" y="368" text-anchor="start">주황 삼각형이 각 줄에서 아직 안 꺼낸 첫 칸이다. 작은 쪽을 꺼내고 그 줄의 삼각형만 한 칸 나아간다.</text><text class="ink2 sm" x="20" y="386" text-anchor="start">값 하나를 옮길 때마다 견주기가 한 번이므로 합치기 전체가 두 줄의 길이 합, 곧 O(n) 이다.</text><text class="ink2 sm" x="20" y="404" text-anchor="start">결과를 따로 담아야 하므로 병합 정렬은 제자리가 아니다. 그 대가로 안정성을 얻는다</text>
