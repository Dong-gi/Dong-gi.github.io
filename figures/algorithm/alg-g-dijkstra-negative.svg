<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 344" width="786" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">음수 가중치에서 다익스트라가 깨지는 이유</title><desc id="d">음수 간선이 있으면 확정한 값이 나중에 줄어들 수 있고 음수 순환이 있으면 최단경로가 없다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="393" y="24" text-anchor="middle">음수 간선 하나면 ‘가장 가까운 것은 이미 끝났다’ 는 전제가 무너진다</text><rect x="14" y="42" width="374" height="232" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="201" y="62" text-anchor="middle">음수 간선 — 답이 틀린다</text><text class="ink2 sm" x="201" y="78" text-anchor="middle">S 에서 A 까지의 진짜 최단은 1 인데 2 라고 답한다</text><path d="M100.13 150.32 L194.05 120.88" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 bold sm" x="152.29" y="149.5" text-anchor="middle">2</text><path d="M100.13 161.68 L194.05 191.12" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 bold sm" x="145.71" y="191.5" text-anchor="middle">3</text><path d="M216 179 L216 137" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink2 bold sm" x="229" y="160" text-anchor="middle">-2</text><circle cx="82" cy="156" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="82" y="161" text-anchor="middle">S</text><circle cx="216" cy="114" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="216" y="119" text-anchor="middle">A</text><circle cx="216" cy="198" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="216" y="203" text-anchor="middle">B</text><text class="ink2 sm" x="256" y="100" text-anchor="start">A 를 2 로 확정한 뒤에</text><text class="ink2 sm" x="256" y="118" text-anchor="start">B 를 꺼내면 3 + (−2) = 1.</text><text class="ink2 sm" x="256" y="136" text-anchor="start">이미 확정한 A 를 고칠 수</text><text class="ink2 sm" x="256" y="154" text-anchor="start">없으므로 답이 틀린 채 끝난다</text><text class="ink2 sm" x="28" y="242" text-anchor="start">거리가 가장 작은 것을 꺼냈다는 사실이</text><text class="ink2 sm" x="28" y="260" text-anchor="start">‘더 짧은 길이 없다’ 를 뜻하지 않게 된다</text><rect x="404" y="42" width="368" height="232" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="588" y="62" text-anchor="middle">음수 순환 — 답 자체가 없다</text><text class="ink2 sm" x="588" y="78" text-anchor="middle">고리를 돌 때마다 값이 줄어든다</text><circle cx="510" cy="146" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="510" y="151" text-anchor="middle">P</text><circle cx="650" cy="146" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="650" y="151" text-anchor="middle">Q</text><path d="M523 133 C 558 100, 602 100, 637 133" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)"/><path d="M637 159 C 602 192, 558 192, 523 159" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink2 bold sm" x="580" y="102" text-anchor="middle">1</text><text class="ink2 bold sm" x="580" y="202" text-anchor="middle">−3</text><text class="ink2 sm" x="588" y="242" text-anchor="middle">한 바퀴 돌면 −2, 두 바퀴면 −4</text><text class="ink2 sm" x="588" y="260" text-anchor="middle">최솟값이 없으니 최단경로가 없다</text><text class="ink2 sm" x="20" y="300" text-anchor="start">음수 간선이 있으면 다익스트라를 쓸 수 없다. 벨만-포드로 바꾸어야 한다.</text><text class="ink2 sm" x="20" y="318" text-anchor="start">음수 순환이 있으면 어떤 알고리즘도 답을 낼 수 없다. 할 수 있는 일은 그것이 있다고 알려 주는 것뿐이다.</text><text class="ink2 sm" x="20" y="336" text-anchor="start">모든 가중치에 같은 수를 더해 음수를 없애는 요령은 통하지 않는다 — 간선 수가 다른 경로끼리 값이 뒤바뀐다</text>
</svg>