<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 336" width="852" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">재귀 트리가 표로 접히는 과정</title><desc id="d">겹치는 부분문제를 하나로 합치면 DAG 가 되고 그 위상 순서대로 펼치면 표가 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="426" y="26" text-anchor="middle">재귀 트리 → 겹친 것을 하나로 → 한 줄짜리 표</text><rect x="20" y="48" width="258" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="149" y="68" text-anchor="middle">재귀 트리</text><text class="ink2 sm" x="149" y="84" text-anchor="middle">같은 계산이 되풀이된다</text><path d="M138.51 124.72 L114.49 149.28" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M159.72 124.49 L185.28 149.51" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M96.2 172.81 L83.8 193.19" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M111.8 172.81 L124.2 193.19" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M189.06 173.3 L178.94 192.7" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M203.38 173.06 L214.62 192.94" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="149" cy="114" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="149" y="118" text-anchor="middle">F5</text><circle cx="104" cy="160" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="104" y="164" text-anchor="middle">F4</text><circle cx="196" cy="160" r="15" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink sm" x="196" y="164" text-anchor="middle">F3</text><circle cx="76" cy="206" r="15" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink sm" x="76" y="210" text-anchor="middle">F3</text><circle cx="132" cy="206" r="15" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink sm" x="132" y="210" text-anchor="middle">F2</text><circle cx="172" cy="206" r="15" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink sm" x="172" y="210" text-anchor="middle">F2</text><circle cx="222" cy="206" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="222" y="210" text-anchor="middle">F1</text><text class="ink2 sm" x="149" y="244" text-anchor="middle">가지가 두 배씩 벌어진다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M286 156 L316 156"/><text class="ink2 sm" x="301" y="144" text-anchor="middle">합친다</text><rect x="324" y="48" width="258" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="453" y="68" text-anchor="middle">겹친 것을 하나로 = DAG</text><text class="ink2 sm" x="453" y="84" text-anchor="middle">노드 7개 · 간선 10개</text><circle cx="348" cy="196" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="348" y="200" text-anchor="middle">0</text><circle cx="383" cy="196" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="383" y="200" text-anchor="middle">1</text><circle cx="418" cy="196" r="14" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink sm" x="418" y="200" text-anchor="middle">2</text><circle cx="453" cy="196" r="14" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink sm" x="453" y="200" text-anchor="middle">3</text><circle cx="488" cy="196" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="488" y="200" text-anchor="middle">4</text><circle cx="523" cy="196" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="523" y="200" text-anchor="middle">5</text><circle cx="558" cy="196" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="558" y="200" text-anchor="middle">6</text><path d="M410 182 Q399.5 166 389 182" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M412 184 Q384 144 356 184" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M445 182 Q434.5 166 424 182" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M447 184 Q419 144 391 184" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M480 182 Q469.5 166 459 182" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M482 184 Q454 144 426 184" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M515 182 Q504.5 166 494 182" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M517 184 Q489 144 461 184" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M550 182 Q539.5 166 529 182" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)"/><path d="M552 184 Q524 144 496 184" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 sm" x="453" y="110" text-anchor="middle">화살표는 ‘이것이 필요하다’ 를 가리킨다</text><text class="ink2 sm" x="453" y="230" text-anchor="middle">순환이 없다 — 8장의 DAG 다</text><text class="ink bold sm" x="453" y="250" text-anchor="middle">위상 순서대로 채우면 된다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M590 156 L620 156"/><text class="ink2 sm" x="605" y="144" text-anchor="middle">펼친다</text><rect x="628" y="48" width="204" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="730" y="68" text-anchor="middle">표 하나</text><text class="ink2 sm" x="730" y="84" text-anchor="middle">왼쪽에서 오른쪽으로</text><rect x="652" y="170" width="24" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="664" y="192" text-anchor="middle">0</text><text class="ink2 sm" x="664" y="218" text-anchor="middle">0</text><rect x="676" y="170" width="24" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="688" y="192" text-anchor="middle">1</text><text class="ink2 sm" x="688" y="218" text-anchor="middle">1</text><rect x="700" y="170" width="24" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink sm" x="712" y="192" text-anchor="middle">1</text><text class="ink2 sm" x="712" y="218" text-anchor="middle">2</text><rect x="724" y="170" width="24" height="34" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink sm" x="736" y="192" text-anchor="middle">2</text><text class="ink2 sm" x="736" y="218" text-anchor="middle">3</text><rect x="748" y="170" width="24" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="760" y="192" text-anchor="middle">3</text><text class="ink2 sm" x="760" y="218" text-anchor="middle">4</text><rect x="772" y="170" width="24" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="784" y="192" text-anchor="middle">5</text><text class="ink2 sm" x="784" y="218" text-anchor="middle">5</text><rect x="796" y="170" width="24" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="808" y="192" text-anchor="middle">8</text><text class="ink2 sm" x="808" y="218" text-anchor="middle">6</text><text class="ink bold sm" x="736" y="148" text-anchor="middle">F[k] = F[k−1] + F[k−2]</text><text class="ink bold sm" x="736" y="234" text-anchor="middle">계산 7번 · 공간 7칸</text><text class="ink2 sm" x="426" y="294" text-anchor="middle">트리에서 표로 접히는 조건은 두 가지다. 부분문제가 겹칠 것, 그리고 큰 답이 작은 답들로만 정해질 것.</text><text class="ink2 sm" x="426" y="316" text-anchor="middle">접고 나면 계산 횟수는 ‘서로 다른 부분문제의 수 × 한 칸을 채우는 값’ 이 된다 — 25번이 7번이 되었다</text>
</svg>