<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 448" width="852" height="448" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">경쟁 상태 — 두 스레드의 실행 순서가 엇갈린다</title><desc id="d">더하기 한 줄이 읽기 · 계산 · 쓰기 세 단계로 쪼개지고, 그 사이를 다른 스레드가 파고들면 결과가 사라진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="426" y="24" text-anchor="middle">두 스레드가 같은 잔액에 1 을 더한다 — 한 줄짜리 문장이 세 단계로 쪼개진다</text><text class="ink2 sm" x="426" y="46" text-anchor="middle">잔액 = 잔액 + 1     →     ① 읽는다   ② 1 을 더한다   ③ 쓴다</text><rect x="46" y="68" width="354" height="340" rx="6" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="223" y="90" text-anchor="middle">운이 좋을 때 — 겹치지 않는다</text><text class="ink2 sm" x="120" y="114" text-anchor="middle">스레드 A</text><text class="ink2 sm" x="276" y="114" text-anchor="middle">스레드 B</text><text class="ink2 sm" x="382" y="114" text-anchor="end">잔액</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M68 124 L68 374"/><text class="ink2 sm" x="62" y="248" text-anchor="middle">시간</text><rect x="80" y="130" width="122" height="26" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="141" y="147" text-anchor="middle">① 읽는다 → 0</text><text class="ink sm" x="382" y="148" text-anchor="end">0</text><rect x="80" y="170" width="122" height="26" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="141" y="187" text-anchor="middle">② 0 + 1 = 1</text><text class="ink sm" x="382" y="188" text-anchor="end">0</text><rect x="80" y="210" width="122" height="26" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="141" y="227" text-anchor="middle">③ 쓴다 → 1</text><text class="ink sm" x="382" y="228" text-anchor="end">1</text><rect x="236" y="250" width="122" height="26" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="297" y="267" text-anchor="middle">① 읽는다 → 1</text><text class="ink sm" x="382" y="268" text-anchor="end">1</text><rect x="236" y="290" width="122" height="26" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="297" y="307" text-anchor="middle">② 1 + 1 = 2</text><text class="ink sm" x="382" y="308" text-anchor="end">1</text><rect x="236" y="330" width="122" height="26" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="297" y="347" text-anchor="middle">③ 쓴다 → 2</text><text class="ink sm" x="382" y="348" text-anchor="end">2</text><path d="M66 374 L382 374" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="223" y="396" text-anchor="middle">잔액 = 2 — 맞다</text><rect x="452" y="68" width="354" height="340" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="629" y="90" text-anchor="middle">운이 나쁠 때 — 사이를 파고든다</text><text class="ink2 sm" x="526" y="114" text-anchor="middle">스레드 A</text><text class="ink2 sm" x="682" y="114" text-anchor="middle">스레드 B</text><text class="ink2 sm" x="788" y="114" text-anchor="end">잔액</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M474 124 L474 374"/><text class="ink2 sm" x="468" y="248" text-anchor="middle">시간</text><rect x="486" y="130" width="122" height="26" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="547" y="147" text-anchor="middle">① 읽는다 → 0</text><text class="ink sm" x="788" y="148" text-anchor="end">0</text><rect x="642" y="170" width="122" height="26" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="703" y="187" text-anchor="middle">① 읽는다 → 0</text><text class="ink sm" x="788" y="188" text-anchor="end">0</text><rect x="486" y="210" width="122" height="26" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="547" y="227" text-anchor="middle">② 0 + 1 = 1</text><text class="ink sm" x="788" y="228" text-anchor="end">0</text><rect x="642" y="250" width="122" height="26" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="703" y="267" text-anchor="middle">② 0 + 1 = 1</text><text class="ink sm" x="788" y="268" text-anchor="end">0</text><rect x="486" y="290" width="122" height="26" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="547" y="307" text-anchor="middle">③ 쓴다 → 1</text><text class="ink sm" x="788" y="308" text-anchor="end">1</text><rect x="642" y="330" width="122" height="26" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="703" y="347" text-anchor="middle">③ 쓴다 → 1</text><text class="ink sm" x="788" y="348" text-anchor="end">1</text><path d="M472 374 L788 374" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="629" y="396" text-anchor="middle">잔액 = 1 — 한 번이 사라졌다</text><text class="ink bold sm" x="426" y="428" text-anchor="middle">같은 프로그램이 같은 입력에서 어느 날은 맞고 어느 날은 틀린다. 이것이 경쟁 상태다</text><text class="ink2 sm" x="426" y="446" text-anchor="middle">엇갈리는 순서가 수없이 많고 그중 아주 일부만 틀리기 때문에, 시험으로 잡히지 않고 부하가 걸린 새벽에 터진다</text>
</svg>