<text class="ink bold" x="385" y="24" text-anchor="middle">규칙을 어긴 값은 더 큰 자식과 자리를 바꾸며 내려간다</text><rect x="14" y="42" width="242" height="240" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="135" y="62" text-anchor="middle">2 가 뿌리에 있다</text><text class="ink2 sm" x="135" y="78" text-anchor="middle">두 자식보다 작아 규칙 위반</text><path d="M124.08 129.8 L97.92 166.2" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M143.92 129.8 L170.08 166.2" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M80.78 195.39 L65.22 228.61" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M95.22 195.39 L110.78 228.61" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M173.19 195.57 L158.81 228.43" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M187.22 195.39 L202.78 228.61" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="134" cy="116" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="134" y="121" text-anchor="middle">2</text><circle cx="88" cy="180" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="88" y="185" text-anchor="middle">14</text><circle cx="180" cy="180" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="180" y="185" text-anchor="middle">10</text><circle cx="58" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="58" y="249" text-anchor="middle">8</text><circle cx="118" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x=