le cx="308" cy="244" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="308" y="249" text-anchor="middle">8</text><circle cx="368" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="368" y="249" text-anchor="middle">7</text><circle cx="402" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="402" y="249" text-anchor="middle">9</text><circle cx="460" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="460" y="249" text-anchor="middle">3</text><rect x="514" y="42" width="242" height="240" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="635" y="62" text-anchor="middle">다시 8 과 바꾸면 끝</text><text class="ink2 sm" x="635" y="78" text-anchor="middle">모든 부모가 자식보다 크다</text><path d="M624.08 129.8 L597.92 166.2" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M643.92 129.8 L670.08 166.2" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M580.78 195.39 L565.22 228.61" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M595.22 195.39 L610.78 228.61" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M673.19 195.57 L658.81 228.43" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M687.22 195.39 L702.78 228.61" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="634" cy="116" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="634" y="121" text-anchor="middle">14</text><circle cx="588" cy="180" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="588" y="185" text-anchor="middle">8</text><circle cx="680" cy="180" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="680" y="185" text-anchor="middle">10</text><circle cx="558" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="558" y="249" text-anchor="middle">2</text><circle cx="618" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="618" y="249" text-anchor="middle">7</text><circle cx="652" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="652" y="249" text-anchor="middle">9</text><circle cx="710" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="710" y="249" text-anchor="middle">3</text><text class="ink2 sm" x="26" y="304" text-anchor="start">바꿀 때마다 한 층씩 내려가므로 많아야 트리 높이만큼, 곧 O(log n) 번이면 끝난다. 올리기는 이것의 반대다.</text><text class="ink2 sm" x="26" y="322" text-anchor="start">넣기는 배열 맨 뒤에 붙이고 올리며, 꺼내기는 뿌리를 떼고 맨 뒤 값을 뿌리에 얹은 뒤 내린다</text>
</svg>