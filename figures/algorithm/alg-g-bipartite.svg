<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 336" width="782" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이분 그래프 판정</title><desc id="d">너비 우선 탐색의 층을 홀짝으로 칠하고 같은 색을 잇는 간선이 있는지 본다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="391" y="24" text-anchor="middle">너비 우선으로 층을 매기고 층의 홀짝으로 칠한다 — 같은 색끼리 이어지면 실패다</text><rect x="14" y="42" width="374" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="201" y="62" text-anchor="middle">짝수 길이 순환 — 이분 그래프다</text><text class="ink2 sm" x="201" y="78" text-anchor="middle">층 0 · 2 는 파랑, 층 1 · 3 은 주황. 성공</text><path d="M213.85 124.02 L243.15 140.98" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M257 165 L257 199" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M243.15 223.02 L213.85 239.98" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M186.15 239.98 L156.85 223.02" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M143 199 L143 165" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M156.85 140.98 L186.15 124.02" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="116" r="16" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="200" y="121" text-anchor="middle">a</text><circle cx="257" cy="149" r="16" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="257" y="154" text-anchor="middle">b</text><circle cx="257" cy="215" r="16" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="257" y="220" text-anchor="middle">c</text><circle cx="200" cy="248" r="16" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="200" y="253" text-anchor="middle">d</text><circle cx="143" cy="215" r="16" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="143" y="220" text-anchor="middle">e</text><circle cx="143" cy="149" r="16" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="143" y="154" text-anchor="middle">f</text><text class="ink2 sm" x="236" y="120" text-anchor="start">층 0</text><text class="ink2 sm" x="293" y="153" text-anchor="start">층 1</text><text class="ink2 sm" x="293" y="219" text-anchor="start">층 2</text><text class="ink2 sm" x="236" y="252" text-anchor="start">층 3</text><text class="ink2 sm" x="107" y="219" text-anchor="end">층 2</text><text class="ink2 sm" x="107" y="153" text-anchor="end">층 1</text><text class="ink2 sm" x="30" y="274" text-anchor="start">모든 간선이 파랑과 주황을 잇는다</text><rect x="404" y="42" width="364" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="586" y="62" text-anchor="middle">홀수 길이 순환 — 이분 그래프가 아니다</text><text class="ink2 sm" x="586" y="78" text-anchor="middle">같은 층 두 정점이 이어져 있다</text><path d="M577.84 121.76 L530.16 202.24" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M594.16 121.76 L641.84 202.24" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M538 216 L634 216" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="586" cy="108" r="16" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="586" y="113" text-anchor="middle">p</text><circle cx="522" cy="216" r="16" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="522" y="221" text-anchor="middle">q</text><circle cx="650" cy="216" r="16" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="650" y="221" text-anchor="middle">r</text><text class="ink2 sm" x="586" y="92" text-anchor="middle">층 0</text><text class="ink2 sm" x="496" y="222" text-anchor="middle">층 1</text><text class="ink2 sm" x="678" y="222" text-anchor="middle">층 1</text><text class="ink2 sm" x="586" y="252" text-anchor="middle">굵은 간선이 같은 층끼리 잇는다</text><text class="ink2 sm" x="420" y="274" text-anchor="start">q 와 r 을 다른 색으로 칠할 방법이 없다</text><text class="ink2 sm" x="20" y="312" text-anchor="start">판정은 너비 우선 탐색 한 번이면 끝난다. 간선을 볼 때마다 두 끝의 층이 홀짝이 다른지 확인하면 된다.</text><text class="ink2 sm" x="20" y="330" text-anchor="start">‘이분 그래프다’ 와 ‘홀수 길이 순환이 없다’ 는 정확히 같은 말이다</text>
</svg>