r="start">공간</text><text class="ink2 sm" x="200" y="324" text-anchor="start">V² 칸 (고정)</text><text class="ink2 sm" x="450" y="324" text-anchor="start">V + 2E 칸</text><text class="ink2 sm" x="24" y="342" text-anchor="start">1과 4가 이어졌나</text><text class="ink2 sm" x="200" y="342" text-anchor="start">O(1) — 칸 하나를 본다</text><text class="ink2 sm" x="450" y="342" text-anchor="start">O(차수) — 목록을 훑는다</text><text class="ink2 sm" x="24" y="360" text-anchor="start">4의 이웃을 전부</text><text class="ink2 sm" x="200" y="360" text-anchor="start">O(V) — 한 줄을 다 본다</text><text class="ink2 sm" x="450" y="360" text-anchor="start">O(차수) — 목록 길이만큼</text><text class="ink2 sm" x="24" y="380" text-anchor="start">희소 그래프(E 가 V 에 가까움)면 인접 리스트, 밀집 그래프거나 간선 확인이 잦으면 인접 행렬이다</text>
