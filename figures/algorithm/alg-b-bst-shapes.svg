<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 390" width="770" height="390" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">균형 잡힌 이진 탐색 트리와 치우친 트리</title><desc id="d">같은 값이라도 넣는 순서에 따라 높이가 log n 이 되기도 하고 n 이 되기도 한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="385" y="24" text-anchor="middle">같은 일곱 값이라도 넣은 순서에 따라 트리 모양이 딴판이 된다</text><rect x="14" y="42" width="366" height="300" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="197" y="62" text-anchor="middle">4, 2, 6, 1, 3, 5, 7 순으로 넣으면</text><text class="ink2 sm" x="197" y="78" text-anchor="middle">높이 2 — 균형</text><path d="M183.45 127.47 L138.55 168.53" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M208.55 127.47 L253.45 168.53" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M117.67 194.82 L98.33 229.18" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M134.33 194.82 L153.67 229.18" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M257.67 194.82 L238.33 229.18" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M274.33 194.82 L293.67 229.18" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="196" cy="116" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="196" y="121" text-anchor="middle">4</text><circle cx="126" cy="180" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="126" y="185" text-anchor="middle">2</text><circle cx="266" cy="180" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="266" y="185" text-anchor="middle">6</text><circle cx="90" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="90" y="249" text-anchor="middle">1</text><circle cx="162" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="162" y="249" text-anchor="middle">3</text><circle cx="230" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="230" y="249" text-anchor="middle">5</text><circle cx="302" cy="244" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="302" y="249" text-anchor="middle">7</text><path d="M208.55 127.47 L253.45 168.53" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M274.33 194.82 L293.67 229.18" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="196" y="296" text-anchor="middle">7 을 찾는 데 비교 3번</text><text class="ink2 sm" x="196" y="320" text-anchor="middle">높이가 log₂ n 이라 O(log n)</text><rect x="392" y="42" width="366" height="300" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="575" y="62" text-anchor="middle">1, 2, 3, 4, 5, 6, 7 순으로 넣으면</text><text class="ink2 sm" x="575" y="78" text-anchor="middle">높이 6 — 한쪽으로 치우침</text><path d="M463.25 113.92 L474.75 124.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.25 143.92 L508.75 154.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M531.25 173.92 L542.75 184.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M565.25 203.92 L576.75 214.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M599.25 233.92 L610.75 244.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M633.25 263.92 L644.75 274.08" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="452" cy="104" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="452" y="109" text-anchor="middle">1</text><circle cx="486" cy="134" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="486" y="139" text-anchor="middle">2</text><circle cx="520" cy="164" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="520" y="169" text-anchor="middle">3</text><circle cx="554" cy="194" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="554" y="199" text-anchor="middle">4</text><circle cx="588" cy="224" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="588" y="229" text-anchor="middle">5</text><circle cx="622" cy="254" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="622" y="259" text-anchor="middle">6</text><circle cx="656" cy="284" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="656" y="289" text-anchor="middle">7</text><path d="M463.25 113.92 L474.75 124.08" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.25 143.92 L508.75 154.08" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M531.25 173.92 L542.75 184.08" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M565.25 203.92 L576.75 214.08" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M599.25 233.92 L610.75 244.08" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M633.25 263.92 L644.75 274.08" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="574" y="320" text-anchor="middle">7 을 찾는 데 비교 7번 — 사실상 연결 리스트다</text><text class="ink2 sm" x="26" y="364" text-anchor="start">오른쪽 트리도 이진 탐색 트리의 규칙은 하나도 어기지 않았다. 규칙만으로는 모양을 보장하지 못한다는 것이 문제다.</text><text class="ink2 sm" x="26" y="382" text-anchor="start">정렬된 자료를 순서대로 넣는 일은 실무에서 아주 흔하다. 그래서 스스로 균형을 잡는 트리가 필요해진다</text>
</svg>