<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 392" width="828" height="392" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">모듈러 거듭제곱의 비대칭</title><desc id="d">지수에서 값을 구하는 것은 빠르지만 값에서 지수를 되찾는 이산로그 문제는 알려진 빠른 방법이 없다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="414" y="26" text-anchor="middle">3ˣ 을 17 로 나눈 나머지 — x 를 1 부터 16 까지 올려 본다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M84 252 L456 252"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M84 252 L84 40"/><path d="M105.18 252 L105.18 256" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="105.18" y="269" text-anchor="middle">1</text><path d="M168.71 252 L168.71 256" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="168.71" y="269" text-anchor="middle">4</text><path d="M253.41 252 L253.41 256" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="253.41" y="269" text-anchor="middle">8</text><path d="M338.12 252 L338.12 256" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="338.12" y="269" text-anchor="middle">12</text><path d="M422.82 252 L422.82 256" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="422.82" y="269" text-anchor="middle">16</text><path d="M80 240.24 L84 240.24" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="76" y="244.24" text-anchor="end">1</text><path d="M80 204.94 L84 204.94" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="76" y="208.94" text-anchor="end">4</text><path d="M80 157.88 L84 157.88" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="76" y="161.88" text-anchor="end">8</text><path d="M80 110.82 L84 110.82" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="76" y="114.82" text-anchor="end">12</text><path d="M80 63.76 L84 63.76" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="76" y="67.76" text-anchor="end">16</text><text class="ink2 sm" x="460" y="257" text-anchor="start">지수 x</text><text class="ink2 sm" x="80" y="34" text-anchor="middle">3ˣ mod 17</text><circle cx="105.18" cy="216.71" r="4.5" fill="var(--s1)"/><circle cx="126.35" cy="146.12" r="4.5" fill="var(--s1)"/><circle cx="147.53" cy="134.35" r="4.5" fill="var(--s1)"/><circle cx="168.71" cy="99.06" r="4.5" fill="var(--s1)"/><circle cx="189.88" cy="193.18" r="4.5" fill="var(--s1)"/><circle cx="211.06" cy="75.53" r="4.5" fill="var(--s1)"/><circle cx="232.24" cy="122.59" r="4.5" fill="var(--s1)"/><circle cx="253.41" cy="63.76" r="4.5" fill="var(--s1)"/><circle cx="274.59" cy="87.29" r="4.5" fill="var(--s1)"/><circle cx="295.76" cy="157.88" r="4.5" fill="var(--s1)"/><circle cx="316.94" cy="169.65" r="4.5" fill="var(--s1)"/><circle cx="338.12" cy="204.94" r="4.5" fill="var(--s1)"/><circle cx="359.29" cy="110.82" r="4.5" fill="var(--s1)"/><circle cx="380.47" cy="228.47" r="4.5" fill="var(--s1)"/><circle cx="401.65" cy="181.41" r="4.5" fill="var(--s1)"/><circle cx="422.82" cy="240.24" r="4.5" fill="var(--s1)"/><circle cx="211.06" cy="75.53" r="6" fill="var(--s2)"/><text class="ink bold sm" x="201.06" y="69.53" text-anchor="end">3⁶ = 15</text><text class="ink2 sm" x="84" y="296" text-anchor="start">점들이 아무 규칙 없이 흩어진다. 1 부터 16 까지가 한 번씩 나오지만</text><text class="ink2 sm" x="84" y="314" text-anchor="start">어느 지수가 어느 값을 내는지 짐작할 방법이 없다</text><rect x="502" y="58" width="288" height="106" rx="5" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="516" y="80" text-anchor="start">앞으로 가는 길 — 쉽다</text><text class="ink2 sm" x="516" y="100" text-anchor="start">x 를 알 때 3ˣ mod 17 을 구한다</text><text class="ink2 sm" x="516" y="117" text-anchor="start">10장의 빠른 거듭제곱으로</text><text class="ink2 sm" x="516" y="134" text-anchor="start">곱셈 log x 번이면 끝난다</text><text class="ink2 sm" x="516" y="151" text-anchor="start">지수가 2²⁰⁴⁸ 급이어도 수천 번이다</text><rect x="502" y="180" width="288" height="106" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="516" y="202" text-anchor="start">되돌아오는 길 — 어렵다</text><text class="ink2 sm" x="516" y="222" text-anchor="start">15 를 보고 x = 6 을 알아낸다</text><text class="ink2 sm" x="516" y="239" text-anchor="start">이것을 이산로그 문제라 한다</text><text class="ink2 sm" x="516" y="256" text-anchor="start">작은 수는 하나씩 해 보면 되지만</text><text class="ink2 sm" x="516" y="273" text-anchor="start">수가 커지면 알려진 빠른 방법이 없다</text><path d="M52 328 L776 328" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="414" y="350" text-anchor="middle">한쪽으로만 쉬운 계산 — 이 비대칭 하나가 공개키 암호 전체를 떠받친다</text><text class="ink2 sm" x="414" y="372" text-anchor="middle">어렵다는 것이 증명된 적은 없다. 빠른 방법이 아직 발견되지 않았을 뿐이라는 점을 잊지 말아야 한다</text>
</svg>