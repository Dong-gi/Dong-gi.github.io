<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 470" width="828" height="470" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">거스름돈 표가 채워지는 순서</title><desc id="d">0 원부터 차례로 채우고 마지막 동전이 무엇이었는지 세 가지를 견주어 가장 작은 것을 고른다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="414" y="26" text-anchor="middle">11장에서 탐욕이 진 문제 — 표를 왼쪽부터 채우면 답이 나온다 (동전 1 · 4 · 6)</text><text class="ink sm" x="414" y="50" text-anchor="middle">dp[m] = m 원을 만드는 데 드는 가장 적은 동전 수 = min( dp[m−1], dp[m−4], dp[m−6] ) + 1</text><rect x="168" y="76" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="197" y="98" text-anchor="middle">0</text><rect x="226" y="76" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="255" y="98" text-anchor="middle">1</text><rect x="284" y="76" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="313" y="98" text-anchor="middle">2</text><rect x="342" y="76" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="371" y="98" text-anchor="middle">3</text><rect x="400" y="76" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="458" y="76" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="516" y="76" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="574" y="76" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="632" y="76" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="156" y="98" text-anchor="end">3 원까지</text><text class="ink2 sm" x="702" y="98" text-anchor="start">1 원밖에 없다</text><rect x="168" y="134" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="197" y="156" text-anchor="middle">0</text><rect x="226" y="134" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="255" y="156" text-anchor="middle">1</text><rect x="284" y="134" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="313" y="156" text-anchor="middle">2</text><rect x="342" y="134" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="371" y="156" text-anchor="middle">3</text><rect x="400" y="134" width="58" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="429" y="156" text-anchor="middle">1</text><rect x="458" y="134" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="487" y="156" text-anchor="middle">2</text><rect x="516" y="134" width="58" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="545" y="156" text-anchor="middle">1</text><rect x="574" y="134" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="632" y="134" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="156" y="156" text-anchor="end">6 원까지</text><text class="ink2 sm" x="702" y="156" text-anchor="start">4 와 6 이 들어온다</text><rect x="168" y="278" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="197" y="300" text-anchor="middle">0</text><text class="ink2 sm" x="197" y="326" text-anchor="middle">0</text><rect x="226" y="278" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="255" y="300" text-anchor="middle">1</text><text class="ink2 sm" x="255" y="326" text-anchor="middle">1</text><rect x="284" y="278" width="58" height="34" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="313" y="300" text-anchor="middle">2</text><text class="ink2 sm" x="313" y="326" text-anchor="middle">2</text><rect x="342" y="278" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="371" y="300" text-anchor="middle">3</text><text class="ink2 sm" x="371" y="326" text-anchor="middle">3</text><rect x="400" y="278" width="58" height="34" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="429" y="300" text-anchor="middle">1</text><text class="ink2 sm" x="429" y="326" text-anchor="middle">4</text><rect x="458" y="278" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="487" y="300" text-anchor="middle">2</text><text class="ink2 sm" x="487" y="326" text-anchor="middle">5</text><rect x="516" y="278" width="58" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="545" y="300" text-anchor="middle">1</text><text class="ink2 sm" x="545" y="326" text-anchor="middle">6</text><rect x="574" y="278" width="58" height="34" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="603" y="300" text-anchor="middle">2</text><text class="ink2 sm" x="603" y="326" text-anchor="middle">7</text><rect x="632" y="278" width="58" height="34" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink" x="661" y="300" text-anchor="middle">2</text><text class="ink2 sm" x="661" y="326" text-anchor="middle">8</text><text class="ink bold sm" x="156" y="300" text-anchor="end">8 원</text><text class="ink2 sm" x="702" y="300" text-anchor="start">완성</text><text class="ink bold sm" x="414" y="196" text-anchor="middle">8 원 칸은 ‘마지막에 놓은 동전’ 세 가지를 견주어 정한다</text><path d="M603 278 Q631 254 659 278" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 sm" x="632" y="248" text-anchor="middle">1 원</text><path d="M429 278 Q544 236 659 278" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink bold sm" x="545" y="230" text-anchor="middle">4 원</text><path d="M313 278 Q486 218 659 278" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 sm" x="487" y="212" text-anchor="middle">6 원</text><text class="ink2 sm" x="228" y="360" text-anchor="end">마지막이 1 원이면</text><text class="ink2 sm" x="244" y="360" text-anchor="start">dp[7] + 1 = 2 + 1 = 3</text><text class="ink bold sm" x="228" y="382" text-anchor="end">마지막이 4 원이면</text><text class="ink bold sm" x="244" y="382" text-anchor="start">dp[4] + 1 = 1 + 1 = 2</text><text class="ink bold sm" x="452" y="382" text-anchor="start">← 가장 작다</text><text class="ink2 sm" x="228" y="404" text-anchor="end">마지막이 6 원이면</text><text class="ink2 sm" x="244" y="404" text-anchor="start">dp[2] + 1 = 2 + 1 = 3</text><text class="ink2 sm" x="414" y="436" text-anchor="middle">탐욕은 6 원을 먼저 집어 세 개였다. 표는 세 가지를 모두 견주므로 6 원을 안 쓰는 길을 놓치지 않는다.</text><text class="ink2 sm" x="414" y="458" text-anchor="middle">칸이 금액 수만큼, 칸마다 동전 종류만큼 견주므로 O(금액 × 동전 종류) 다</text>
</svg>