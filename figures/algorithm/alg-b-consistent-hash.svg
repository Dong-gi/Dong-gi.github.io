<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">일관 해싱의 고리</title><desc id="d">서버와 키를 같은 고리에 얹으면 서버가 늘어도 옮기는 키가 한 구간뿐이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="24" text-anchor="middle">서버 수가 바뀌어도 옮기는 키를 최소로 — 나머지 연산 대신 고리를 쓴다</text><circle cx="180" cy="200" r="86" fill="none" stroke="var(--grid)" stroke-width="2"/><text class="ink bold sm" x="180" y="194" text-anchor="middle">서버 3대</text><text class="ink2 sm" x="180" y="214" text-anchor="middle">키는 시계 방향으로</text><rect x="189.41" y="106.19" width="40" height="26" rx="4" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="209.41" y="124.19" text-anchor="middle">S1</text><rect x="203" y="261.48" width="40" height="26" rx="4" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="223" y="279.48" text-anchor="middle">S2</text><rect x="74.33" y="194.5" width="40" height="26" rx="4" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="94.33" y="212.5" text-anchor="middle">S3</text><circle cx="280.46" cy="142" r="4" fill="var(--ink2)"/><text class="ink2 sm" x="294.32" y="138" text-anchor="start">a</text><circle cx="282.42" cy="254.46" r="4" fill="var(--ink2)"/><text class="ink2 sm" x="296.55" y="265.97" text-anchor="start">b</text><circle cx="88.59" cy="271.42" r="4" fill="var(--ink2)"/><text class="ink2 sm" x="75.98" y="285.27" text-anchor="end">c</text><circle cx="102.38" cy="113.8" r="4" fill="var(--ink2)"/><text class="ink2 sm" x="91.67" y="105.9" text-anchor="end">d</text><text class="ink2 sm" x="180" y="316" text-anchor="middle">다음에 만나는 서버가 맡는다</text><circle cx="560" cy="200" r="86" fill="none" stroke="var(--grid)" stroke-width="2"/><text class="ink bold sm" x="560" y="194" text-anchor="middle">S4 를 끼워 넣으면</text><text class="ink2 sm" x="560" y="214" text-anchor="middle">옮기는 키는 a 하나뿐</text><rect x="569.41" y="106.19" width="40" height="26" rx="4" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="589.41" y="124.19" text-anchor="middle">S1</text><rect x="583" y="261.48" width="40" height="26" rx="4" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="603" y="279.48" text-anchor="middle">S2</text><rect x="454.33" y="194.5" width="40" height="26" rx="4" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="474.33" y="212.5" text-anchor="middle">S3</text><rect x="626" y="187" width="40" height="26" rx="4" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="646" y="205" text-anchor="middle">S4</text><circle cx="660.46" cy="142" r="4" fill="var(--s3)"/><text class="ink2 sm" x="674.32" y="138" text-anchor="start">a</text><circle cx="662.42" cy="254.46" r="4" fill="var(--ink2)"/><text class="ink2 sm" x="676.55" y="265.97" text-anchor="start">b</text><circle cx="468.59" cy="271.42" r="4" fill="var(--ink2)"/><text class="ink2 sm" x="455.98" y="285.27" text-anchor="end">c</text><circle cx="482.38" cy="113.8" r="4" fill="var(--ink2)"/><text class="ink2 sm" x="471.67" y="105.9" text-anchor="end">d</text><text class="ink2 sm" x="560" y="316" text-anchor="middle">b, c, d 는 그대로 남는다</text><path fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)" d="M320 200 L400 200"/><text class="ink bold sm" x="360" y="186" text-anchor="middle">서버 추가</text><text class="ink2 sm" x="26" y="344" text-anchor="start">키와 서버를 같은 해시 값의 고리 위에 얹고, 키는 시계 방향으로 처음 만나는 서버가 맡는다.</text><text class="ink2 sm" x="26" y="364" text-anchor="start">서버 번호 = 해시 mod 서버수 로 정하면 서버 수가 바뀔 때 거의 모든 키가 자리를 옮겨야 한다.</text><text class="ink2 sm" x="26" y="384" text-anchor="start">고리를 쓰면 새로 들어온 서버 앞 구간의 키만 옮긴다. 평균 1/n 만 움직인다</text>
</svg>