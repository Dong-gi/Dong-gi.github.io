.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="24" text-anchor="middle">아래층에 노드가 몰려 있고, 아래층일수록 적게 내려간다</text><path d="M258.29 93.37 L201.71 138.63" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M281.71 93.37 L338.29 138.63" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M180.77 159.82 L149.23 200.18" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M199.23 159.82 L230.77 200.18" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.77 159.82 L309.23 200.18" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M359.23 159.82 L390.77 200.18" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M133.63 225.58 L114.67 266.04" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M146.37 225.58 L165.33 266.04" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M233.63 225.58 L214.67 266.04" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M246.37 225.58 L265.33 266.04" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M302.32 226.82 L308.3 265.13" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M311.07 222.12 L361.88 268.58" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M402.32 226.82 L408.3 265.13" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M409.23 223.82 L443.23 267.33" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="84" r="15" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="270" y="89" text-anchor="middle"></text><text class="ink2 sm" x="508" y="89" text-anchor="start">0 층</text><text class="ink sm" x="590" y="89" text-anchor="end">1개</text><text class="ink sm" x="688" y="89" text-anchor="end">최대 3칸</text><text class="ink bold sm" x="748" y="89" text-anchor="end">3</text><circle cx="190" cy="148" r="15" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="190" y="153" text-anchor="middle"></text><circle cx="350" cy="148" r="15" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="350" y="153" text-anchor="middle"></text><text class="ink2 sm" x="508" y="153" text-anchor="start">1 층</text><text class="ink sm" x="590" y="153" text-anchor="end">2개</text><text class="ink sm" x="688" y="153" text-anchor="end">최대 2칸</text><text class="ink bold sm" x="748" y="153" text-anchor="end">4</text><circle cx="140" cy="212" r="15" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="140" y="217" text-anchor="middle"></text><circle cx="240" cy="212" r="15" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="240" y="217" text-anchor="middle"></text><circle cx="300" cy="212" r="15" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="300" y="217" text-anchor="middle"></text><circle cx="400" cy="212" r="15" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="400" y="217" text-anchor="middle"></text><text class="ink2 sm" x="508" y="217" text-anchor="start">2 층</text><text class="ink sm" x="590" y="217" text-anchor="end">4개</text><text class="ink sm" x="688" y="217" text-anchor="end">최대 1칸</text><text class="ink bold sm" x="748" y="217" text-anchor="end">4</text><circle cx="110" cy="276" r="11" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="110" y="281" text-anchor="middle"></text><circle cx="170" cy="276" r="11" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="170" y="281" text-anchor="middle"></text><circle cx="210" cy="276" r="11" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="210" y="281" text-anchor="middle"></text><circle cx="270" cy="276" r="11" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="270" y="281" text-anchor="middle"></text><circle cx="310" cy="276" r="11" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="310" y="281" text-anchor="middle"></text><circle cx="370" cy="276" r="11" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="370" y="281" text-anchor="middle"></text><circle cx="410" cy="276" r="11" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="410" y="281" text-anchor="middle"></text><circle cx="450" cy="276" r="11" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="450" y="281" text-anchor="middle"></text><text class="ink2 sm" x="508" y="281" text-anchor="start">3 층 (잎)</text><text class="ink sm" x="590" y="281" text-anchor="end">8개</text><text class="ink sm" x="688" y="281" text-anchor="end">0칸</text><text class="ink bold sm" x="748" y="281" text-anchor="end">0</text><text class="ink2 bold sm" x="590" y="58" text-anchor="end">노드 수</text><text class="ink2 bold sm" x="688" y="58" text-anchor="end">내려갈 칸</text><text class="ink2 bold sm" x="748" y="58" text-anchor="end">곱</text><path d="M500 66 L756 66" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 296 L756 296" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="688" y="316" text-anchor="end">합계</text><text class="ink bold sm" x="748" y="316" text-anchor="end">11</text><text class="ink2 sm" x="26" y="342" text-anchor="start">노드 15개짜리 힙을 아래층부터 훑으며 만들면 자리바꿈이 많아야 11번이다. 15 × log₂ 15 ≈ 59 가 아니다.</text><text class="ink2 sm" x="26" y="360" text-anchor="start">노드 절반이 잎이라 아예 일하지 않고 많이 내려가야 하는 노드는 위층에 몇 개뿐이다. 합은 언제나 2n 을 넘지 않는다</text>
</svg>