<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 368" width="780" height="368" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">힙 만들기가 O(n) 인 이유</title><desc id="d">아래층일수록 노드가 많지만 내려갈 칸이 적어 층별 비용의 합이 노드 수에 비례한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
