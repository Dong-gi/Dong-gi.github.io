 y="226" text-anchor="middle">1</text><rect x="143" y="212" width="15" height="20" rx="1" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="150.5" y="226" text-anchor="middle">0</text><rect x="158" y="212" width="15" height="20" rx="1" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="165.5" y="226" text-anchor="middle">1</text><rect x="173" y="212" width="15" height="20" rx="1" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="180.5" y="226" text-anchor="middle">0</text><rect x="188" y="212" width="15" height="20" rx="1" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="195.5" y="226" text-anchor="middle">1</text><rect x="203" y="212" width="15" height="20" rx="1" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="210.5" y="226" text-anchor="middle">0</text><rect x="218" y="212" width="15" height="20" rx="1" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="225.5" y="226" text-anchor="middle">0</text><text class="ink2 sm" x="240" y="225" text-anchor="middle">…</text><text class="ink2 sm" x="264" y="225" text-anchor="start">선행 0 이 0개</text><text class="ink bold sm" x="264" y="252" text-anchor="start">여섯 개 중 최대는 3 → 크기를 2⁴ = 16 쯤으로 짐작한다</text><rect x="452" y="46" width="328" height="190" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="466" y="66" text-anchor="start">왜 그렇게 짐작하는가</text><text class="ink2 sm" x="472" y="92" text-anchor="start">선행 0 이 1개 이상일 확률</text><text class="ink sm" x="702" y="92" text-anchor="middle">1/2</text><text class="ink2 sm" x="472" y="112" text-anchor="start">선행 0 이 2개 이상일 확률</text><text class="ink sm" x="702" y="112" text-anchor="middle">1/4</text><text class="ink2 sm" x="472" y="132" text-anchor="start">선행 0 이 k개 이상일 확률</text><text class="ink sm" x="702" y="132" text-anchor="middle">1/2ᵏ</text><path d="M466 162 L766 162" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="472" y="184" text-anchor="start">선행 0 이 k개인 값을 보려면</text><text class="ink2 sm" x="472" y="202" text-anchor="start">대략 2ᵏ 개를 뽑아 봐야 한다.</text><text class="ink bold sm" x="472" y="220" text-anchor="start">거꾸로 읽으면 크기 추정이 된다</text><path d="M52 268 L776 268" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="414" y="290" text-anchor="middle">같은 원소를 몇 번 넣어도 해시 값이 같으므로 최대 선행 0 이 변하지 않는다 — 중복이 저절로 무시된다</text><text class="ink2 sm" x="414" y="312" text-anchor="middle">이 추정 하나만으로는 못 쓴다. 운 나쁘게 앞머리가 긴 값 하나가 걸리면 추정이 통째로 두 배씩 뛴다.</text><text class="ink2 sm" x="414" y="332" text-anchor="middle">게다가 짐작할 수 있는 값이 1, 2, 4, 8, 16 … 뿐이라 그 사이를 표현하지 못한다.</text><text class="ink bold sm" x="414" y="356" text-anchor="middle">해결책은 하나뿐인 관측을 여럿으로 쪼개는 것이다 — 다음 그림</text>
</svg>