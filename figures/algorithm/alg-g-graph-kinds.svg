.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="396" y="24" text-anchor="middle">간선에 무엇을 얹느냐로 갈린다 — 방향, 가중치, 그리고 순환의 유무</text><rect x="14" y="40" width="252" height="164" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="140" y="60" text-anchor="middle">무방향 그래프</text><text class="ink2 sm" x="140" y="76" text-anchor="middle">간선에 방향이 없다</text><path d="M89.24 109.45 L126.76 96.55" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M153.24 96.55 L190.76 109.45" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M86.87 122.83 L129.13 157.17" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150.87 157.17 L193.13 122.83" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="114" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="76" y="119" text-anchor="middle">a</text><circle cx="140" cy="92" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="140" y="97" text-anchor="middle">b</text><circle cx="204" cy="114" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="204" y="119" text-anchor="middle">c</text><circle cx="140" cy="166" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="140" y="171" text-anchor="middle">d</text><rect x="270" y="40" width="252" height="164" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="396" y="60" text-anchor="middle">방향 그래프</text><text class="ink2 sm" x="396" y="76" text-anchor="middle">a 의 진출차수 2, c 의 진입차수 2</text><path d="M345.24 109.45 L378.98 97.85" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M409.24 96.55 L442.98 108.15" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M342.87 122.83 L382.03 154.65" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M406.87 157.17 L446.03 125.35" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><circle cx="332" cy="114" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="332" y="119" text-anchor="middle">a</text><circle cx="396" cy="92" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="396" y="97" text-anchor="middle">b</text><circle cx="460" cy="114" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="460" y="119" text-anchor="middle">c</text><circle cx="396" cy="166" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="396" y="171" text-anchor="middle">d</text><rect x="526" y="40" width="252" height="164" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="652" y="60" text-anchor="middle">가중 그래프</text><text class="ink2 sm" x="652" y="76" text-anchor="middle">간선마다 값이 붙는다</text><path d="M601.24 109.45 L638.76 96.55" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="623.58" y="117.4" text-anchor="middle">4</text><path d="M665.24 96.55 L702.76 109.45" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="680.42" y="117.4" text-anchor="middle">7</text><path d="M598.87 122.83 L641.13 157.17" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="613.06" y="152.54" text-anchor="middle">2</text><path d="M662.87 157.17 L705.13 122.83" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="690.94" y="152.54" text-anchor="middle">5</text><circle cx="588" cy="114" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="588" y="119" text-anchor="middle">a</text><circle cx="652" cy="92" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="652" y="97" text-anchor="middle">b</text><circle cx="716" cy="114" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="716" y="119" text-anchor="middle">c</text><circle cx="652" cy="166" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="652" y="171" text-anchor="middle">d</text><rect x="14" y="216" width="252" height="164" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="140" y="236" text-anchor="middle">DAG</text><text class="ink2 sm" x="140" y="252" text-anchor="middle">방향이 있고 순환이 없다</text><path d="M89.24 285.45 L122.98 273.85" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M153.24 272.55 L186.98 284.15" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M86.87 298.83 L126.03 330.65" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><path d="M150.87 333.17 L190.03 301.35" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><circle cx="76" cy="290" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="76" y="295" text-anchor="middle">a</text><circle cx="140" cy="268" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="140" y="273" text-anchor="middle">b</text><circle cx="204" cy="290" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="204" y="295" text-anchor="middle">c</text><circle cx="140" cy="342" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="140" y="347" text-anchor="middle">d</text><rect x="270" y="216" width="252" height="164" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="396" y="236" text-anchor="middle">트리</text><text class="ink2 sm" x="396" y="252" text-anchor="middle">연결 · 순환 없음 · 간선 n−1 개</text><path d="M345.24 285.45 L382.76 272.55" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M409.24 272.55 L446.76 285.45" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M396 282 L396 328" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="332" cy="290" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="332" y="295" text-anchor="middle">a</text><circle cx="396" cy="268" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="396" y="273" text-anchor="middle">b</text><circle cx="460" cy="290" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="460" y="295" text-anchor="middle">c</text><circle cx="396" cy="342" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="396" y="347" text-anchor="middle">d</text><rect x="526" y="216" width="252" height="164" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="652" y="236" text-anchor="middle">완전 그래프</text><text class="ink2 sm" x="652" y="252" text-anchor="middle">가능한 간선을 다 그은 것. 6개</text><path d="M601.24 285.45 L638.76 272.55" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M665.24 272.55 L702.76 285.45" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M598.87 298.83 L641.13 333.17" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.87 333.17 L705.13 298.83" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M602 290 L702 290" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M652 282 L652 328" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="588" cy="290" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="588" y="295" text-anchor="middle">a</text><circle cx="652" cy="268" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="652" y="273" text-anchor="middle">b</text><circle cx="716" cy="290" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="716" y="295" text-anchor="middle">c</text><circle cx="652" cy="342" r="14" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="652" y="347" text-anchor="middle">d</text><text class="ink2 sm" x="20" y="380" text-anchor="start">트리는 그래프의 특별한 경우다. 정점이 n 개인 무방향 그래프가 연결되어 있고 간선이 n−1 개면 반드시 트리다.</text><text class="ink2 sm" x="20" y="398" text-anchor="start">정점 n 개의 간선 수는 많아야 n(n−1)/2 개다. 그 수에 가까우면 밀집, 훨씬 적으면 희소 그래프라 한다</text>
</svg>