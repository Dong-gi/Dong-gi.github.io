<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 444" width="828" height="444" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">0-1 배낭의 표</title><desc id="d">물건을 하나씩 늘려 가며 용량별 최대 가치를 채우고 넣을지 말지 두 가지를 견준다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="414" y="26" text-anchor="middle">0-1 배낭 — 물건을 하나씩 늘려 가며 줄을 채운다 (용량 5)</text><text class="ink2 sm" x="312" y="74" text-anchor="middle">배낭에 남은 용량 w</text><text class="ink2 sm" x="177" y="96" text-anchor="middle">0</text><text class="ink2 sm" x="231" y="96" text-anchor="middle">1</text><text class="ink2 sm" x="285" y="96" text-anchor="middle">2</text><text class="ink2 sm" x="339" y="96" text-anchor="middle">3</text><text class="ink2 sm" x="393" y="96" text-anchor="middle">4</text><text class="ink2 sm" x="447" y="96" text-anchor="middle">5</text><text class="ink2 sm" x="140" y="96" text-anchor="end">물건</text><text class="ink2 sm" x="140" y="125" text-anchor="end">없음</text><rect x="150" y="104" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="177" y="126" text-anchor="middle">0</text><rect x="204" y="104" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="231" y="126" text-anchor="middle">0</text><rect x="258" y="104" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="285" y="126" text-anchor="middle">0</text><rect x="312" y="104" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="339" y="126" text-anchor="middle">0</text><rect x="366" y="104" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="393" y="126" text-anchor="middle">0</text><rect x="420" y="104" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="447" y="126" text-anchor="middle">0</text><text class="ink2 sm" x="140" y="159" text-anchor="end">1까지</text><rect x="150" y="138" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="177" y="160" text-anchor="middle">0</text><rect x="204" y="138" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="231" y="160" text-anchor="middle">0</text><rect x="258" y="138" width="54" height="34" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="285" y="160" text-anchor="middle">3</text><rect x="312" y="138" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="339" y="160" text-anchor="middle">3</text><rect x="366" y="138" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="393" y="160" text-anchor="middle">3</text><rect x="420" y="138" width="54" height="34" rx="2" fill="var(--ink2)" fill-opacity="0.22" stroke="var(--ink2)" stroke-width="1.9"/><text class="ink" x="447" y="160" text-anchor="middle">3</text><text class="ink2 sm" x="140" y="193" text-anchor="end">2까지</text><rect x="150" y="172" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="177" y="194" text-anchor="middle">0</text><rect x="204" y="172" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="231" y="194" text-anchor="middle">0</text><rect x="258" y="172" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="285" y="194" text-anchor="middle">3</text><rect x="312" y="172" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="339" y="194" text-anchor="middle">4</text><rect x="366" y="172" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="393" y="194" text-anchor="middle">4</text><rect x="420" y="172" width="54" height="34" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink" x="447" y="194" text-anchor="middle">7</text><text class="ink2 sm" x="140" y="227" text-anchor="end">3까지</text><rect x="150" y="206" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="177" y="228" text-anchor="middle">0</text><rect x="204" y="206" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="231" y="228" text-anchor="middle">0</text><rect x="258" y="206" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="285" y="228" text-anchor="middle">3</text><rect x="312" y="206" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="339" y="228" text-anchor="middle">4</text><rect x="366" y="206" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="393" y="228" text-anchor="middle">5</text><rect x="420" y="206" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="447" y="228" text-anchor="middle">7</text><text class="ink2 sm" x="140" y="261" text-anchor="end">4까지</text><rect x="150" y="240" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="177" y="262" text-anchor="middle">0</text><rect x="204" y="240" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="231" y="262" text-anchor="middle">0</text><rect x="258" y="240" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="285" y="262" text-anchor="middle">3</text><rect x="312" y="240" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="339" y="262" text-anchor="middle">4</text><rect x="366" y="240" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="393" y="262" text-anchor="middle">5</text><rect x="420" y="240" width="54" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="447" y="262" text-anchor="middle">7</text><text class="ink2 sm" x="427" y="151" text-anchor="start">가</text><text class="ink2 sm" x="265" y="151" text-anchor="start">나</text><text class="ink2 sm" x="427" y="185" text-anchor="start">답</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M447 168 L447 176"/><text class="ink2 sm" x="530" y="74" text-anchor="start">물건    무게   가치</text><path d="M530 82 L730 82" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="536" y="104" text-anchor="start">1번</text><text class="ink2 sm" x="626" y="104" text-anchor="end">2 kg</text><text class="ink2 sm" x="698" y="104" text-anchor="end">3 원</text><text class="ink bold sm" x="536" y="127" text-anchor="start">2번</text><text class="ink2 sm" x="626" y="127" text-anchor="end">3 kg</text><text class="ink2 sm" x="698" y="127" text-anchor="end">4 원</text><text class="ink2 sm" x="536" y="150" text-anchor="start">3번</text><text class="ink2 sm" x="626" y="150" text-anchor="end">4 kg</text><text class="ink2 sm" x="698" y="150" text-anchor="end">5 원</text><text class="ink2 sm" x="536" y="173" text-anchor="start">4번</text><text class="ink2 sm" x="626" y="173" text-anchor="end">5 kg</text><text class="ink2 sm" x="698" y="173" text-anchor="end">6 원</text><path d="M530 204 L730 204" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="536" y="226" text-anchor="start">답 dp[4][5] = 7</text><text class="ink2 sm" x="536" y="248" text-anchor="start">되짚으면 1번 + 2번</text><text class="ink2 sm" x="536" y="268" text-anchor="start">무게 2 + 3 = 5</text><text class="ink2 sm" x="536" y="286" text-anchor="start">11장의 탐욕은 160 원이었다</text><text class="ink bold sm" x="116" y="316" text-anchor="start">2번 물건(무게 3, 가치 4)을 쓸 수 있게 되었을 때 용량 5 칸을 정하는 법</text><text class="ink bold sm" x="130" y="338" text-anchor="end">가</text><text class="ink2 sm" x="142" y="338" text-anchor="start">안 넣는다 → 위 칸 그대로 dp[1][5] = 3</text><text class="ink bold sm" x="130" y="358" text-anchor="end">나</text><text class="ink2 sm" x="142" y="358" text-anchor="start">넣는다 → 무게 3 을 빼고 dp[1][2] + 4 = 3 + 4 = 7</text><text class="ink bold sm" x="130" y="378" text-anchor="end">답</text><text class="ink bold sm" x="142" y="378" text-anchor="start">큰 쪽인 7 을 적는다</text><text class="ink2 sm" x="414" y="412" text-anchor="middle">칸이 n × W 개이고 칸마다 상수 일이므로 O(nW) 다. 다만 W 는 입력에 적힌 수이지 입력의 길이가 아니다 —</text><text class="ink2 sm" x="414" y="432" text-anchor="middle">자릿수로 재면 지수다. 이런 것을 유사 다항 시간이라 하고 13장에서 다시 만난다</text>
</svg>