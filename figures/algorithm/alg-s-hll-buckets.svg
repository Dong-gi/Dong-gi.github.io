<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 424" width="836" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">HyperLogLog 의 버킷과 조화평균</title><desc id="d">해시를 버킷 번호와 나머지로 쪼개 여러 번 관측하고, 큰 값 하나에 끌려가지 않도록 조화평균으로 묶는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="418" y="26" text-anchor="middle">해시 하나를 둘로 쪼갠다 — 앞은 버킷 번호, 뒤는 선행 0 세는 자리</text><rect x="150" y="56" width="150" height="30" rx="3" fill="var(--s1)" fill-opacity="0.25" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="225" y="76" text-anchor="middle">앞 14비트</text><rect x="300" y="56" width="380" height="30" rx="3" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="490" y="76" text-anchor="middle">나머지 50비트</text><text class="ink2 sm" x="138" y="76" text-anchor="end">해시 64비트</text><text class="ink2 sm" x="225" y="104" text-anchor="middle">버킷 번호 (2¹⁴ = 16384 개)</text><text class="ink2 sm" x="490" y="104" text-anchor="middle">여기서 선행 0 을 세어 그 버킷의 최댓값만 남긴다</text><rect x="150" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="173" y="191" text-anchor="middle">3</text><text class="ink2 sm" x="173" y="218" text-anchor="middle">0</text><rect x="196" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="219" y="191" text-anchor="middle">5</text><text class="ink2 sm" x="219" y="218" text-anchor="middle">1</text><rect x="242" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="265" y="191" text-anchor="middle">2</text><text class="ink2 sm" x="265" y="218" text-anchor="middle">2</text><rect x="288" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="311" y="191" text-anchor="middle">4</text><text class="ink2 sm" x="311" y="218" text-anchor="middle">3</text><rect x="334" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="357" y="191" text-anchor="middle">3</text><text class="ink2 sm" x="357" y="218" text-anchor="middle">4</text><rect x="380" y="168" width="46" height="36" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink sm" x="403" y="191" text-anchor="middle">11</text><text class="ink2 sm" x="403" y="218" text-anchor="middle">5</text><rect x="426" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="449" y="191" text-anchor="middle">2</text><text class="ink2 sm" x="449" y="218" text-anchor="middle">6</text><rect x="472" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="495" y="191" text-anchor="middle">4</text><text class="ink2 sm" x="495" y="218" text-anchor="middle">7</text><rect x="518" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="541" y="191" text-anchor="middle">3</text><text class="ink2 sm" x="541" y="218" text-anchor="middle">8</text><rect x="564" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="587" y="191" text-anchor="middle">5</text><text class="ink2 sm" x="587" y="218" text-anchor="middle">9</text><rect x="610" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="633" y="191" text-anchor="middle">4</text><text class="ink2 sm" x="633" y="218" text-anchor="middle">10</text><rect x="656" y="168" width="46" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="679" y="191" text-anchor="middle">2</text><text class="ink2 sm" x="679" y="218" text-anchor="middle">11</text><text class="ink bold sm" x="138" y="190" text-anchor="end">버킷별 최대</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M403 144 L403 162"/><text class="ink bold sm" x="403" y="136" text-anchor="middle">운 나쁘게 걸린 값 하나</text><rect x="74" y="254" width="330" height="84" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text class="ink bold sm" x="88" y="276" text-anchor="start">산술평균으로 묶으면</text><text class="ink sm" x="88" y="298" text-anchor="start">버킷마다의 짐작 2ᵏ 을 더해 나눈다 → 약 183</text><text class="ink2 sm" x="88" y="318" text-anchor="start">큰 값 하나가 전체를 끌어올린다</text><rect x="430" y="254" width="330" height="84" rx="5" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4"/><text class="ink bold sm" x="444" y="276" text-anchor="start">조화평균으로 묶으면</text><text class="ink sm" x="444" y="298" text-anchor="start">역수를 더해 나눈 뒤 뒤집는다 → 약 9</text><text class="ink2 sm" x="444" y="318" text-anchor="start">큰 값의 역수는 작아서 영향이 작다</text><path d="M52 360 L784 360" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="418" y="382" text-anchor="middle">버킷이 많을수록 흔들림이 줄어든다. 표준 오차는 버킷 개수의 제곱근에 반비례해 1.04 ÷ √(버킷 수) 다</text><text class="ink2 sm" x="418" y="404" text-anchor="middle">버킷 16384 개면 오차 약 0.81%. 버킷마다 6비트만 있으면 되므로 전부 합쳐 12 KB 다</text>
</svg>