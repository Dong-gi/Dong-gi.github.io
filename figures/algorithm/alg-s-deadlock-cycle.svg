<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 400" width="844" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">교착 상태의 네 조건</title><desc id="d">기다림이 고리를 이루면 교착이다. 네 조건 중 하나만 깨면 교착이 생기지 않는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="422" y="26" text-anchor="middle">넷이 모두 갖춰졌을 때만 교착이 생긴다 — 하나만 깨면 된다</text><path fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)" d="M268 128 L152 128"/><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M114 166 L114 214"/><path fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)" d="M152 252 L268 252"/><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M306 214 L306 166"/><text class="ink2 sm" x="104" y="190" text-anchor="middle">기다린다</text><text class="ink2 sm" x="316" y="190" text-anchor="middle">기다린다</text><text class="ink2 sm" x="210" y="116" text-anchor="middle">쥐고 있다</text><text class="ink2 sm" x="210" y="268" text-anchor="middle">쥐고 있다</text><circle cx="114" cy="128" r="38" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="114" y="132" text-anchor="middle">스레드 A</text><circle cx="306" cy="128" r="38" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="306" y="132" text-anchor="middle">자원 1</text><circle cx="306" cy="252" r="38" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="306" y="256" text-anchor="middle">스레드 B</text><circle cx="114" cy="252" r="38" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="114" y="256" text-anchor="middle">자원 2</text><text class="ink bold sm" x="210" y="62" text-anchor="middle">기다림이 고리를 이루면 아무도 못 나간다</text><text class="ink2 sm" x="210" y="306" text-anchor="middle">자원 할당 그래프에 순환이 있는가 — 그것이 탐지의 기준이다</text><text class="ink bold sm" x="210" y="326" text-anchor="middle">잠그는 순서를 하나로 정하면 고리가 생길 수 없다</text><text class="ink bold sm" x="434" y="62" text-anchor="start">네 조건과 그것을 깨는 법</text><rect x="434" y="82" width="366" height="48" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="446" y="102" text-anchor="start">상호 배제</text><text class="ink2 sm" x="530" y="102" text-anchor="start">자원을 한 번에 하나만 쓴다</text><text class="ink2 sm" x="446" y="121" text-anchor="start">깨는 법: 쓸 수 있으면 공유 자원으로 바꾼다</text><rect x="434" y="138" width="366" height="48" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="446" y="158" text-anchor="start">점유하고 대기</text><text class="ink2 sm" x="530" y="158" text-anchor="start">쥔 채로 다른 것을 기다린다</text><text class="ink2 sm" x="446" y="177" text-anchor="start">깨는 법: 필요한 것을 한꺼번에 얻거나 모두 놓는다</text><rect x="434" y="194" width="366" height="48" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="446" y="214" text-anchor="start">빼앗지 못함</text><text class="ink2 sm" x="530" y="214" text-anchor="start">남이 쥔 것을 뺏을 수 없다</text><text class="ink2 sm" x="446" y="233" text-anchor="start">깨는 법: 기다리다 지치면 스스로 놓고 물러난다</text><rect x="434" y="250" width="366" height="48" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="446" y="270" text-anchor="start">순환 대기</text><text class="ink2 sm" x="530" y="270" text-anchor="start">기다림이 고리를 이룬다</text><text class="ink2 sm" x="446" y="289" text-anchor="start">깨는 법: 자원에 번호를 매겨 오름차순으로만 잠근다</text><text class="ink bold sm" x="434" y="322" text-anchor="start">실무에서 가장 많이 쓰는 것이 마지막 줄이다.</text><path d="M52 344 L792 344" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="422" y="366" text-anchor="middle">교착은 아무도 나아가지 못하는 것이고, 기아는 남들만 나아가고 나만 못 나아가는 것이다. 둘은 다르다</text><text class="ink2 sm" x="422" y="386" text-anchor="middle">교착은 멈춰 있으므로 보면 알 수 있지만, 기아는 시스템이 잘 도는 것처럼 보여 더 늦게 발견된다</text>
</svg>