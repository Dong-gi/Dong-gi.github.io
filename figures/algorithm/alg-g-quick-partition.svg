<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 404" width="792" height="404" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">퀵 정렬의 분할</title><desc id="d">왼쪽에서 오른쪽으로 한 번 훑으며 피벗보다 작은 값을 경계 안쪽으로 옮긴다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
