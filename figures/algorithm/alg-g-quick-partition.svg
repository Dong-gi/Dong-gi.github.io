0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="179" y="323" text-anchor="middle">3</text><rect x="196" y="304" width="34" height="28" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="213" y="323" text-anchor="middle">2</text><rect x="230" y="304" width="34" height="28" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="247" y="323" text-anchor="middle">1</text><rect x="264" y="304" width="34" height="28" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="281" y="323" text-anchor="middle">4</text><rect x="298" y="304" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="315" y="323" text-anchor="middle">7</text><rect x="332" y="304" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="349" y="323" text-anchor="middle">8</text><rect x="366" y="304" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="383" y="323" text-anchor="middle">9</text><rect x="400" y="304" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="417" y="323" text-anchor="middle">5</text><path d="M276 342 L286 342 L281 333 Z" fill="var(--s3)"/><text class="ink sm" x="281" y="356" text-anchor="middle">피벗</text><text class="ink sm" x="452" y="322" text-anchor="start">피벗을 경계 자리로 옮긴다 — 피벗이 제자리다</text><path d="M162 372 L264 372" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="213" y="388" text-anchor="middle">전부 4 보다 작다</text><path d="M298 372 L434 372" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="366" y="388" text-anchor="middle">전부 4 이상이다</text><text class="ink2 sm" x="452" y="372" text-anchor="start">이제 왼쪽 3개와 오른쪽 4개를 따로 정렬하면 끝이다.</text><text class="ink2 sm" x="452" y="390" text-anchor="start">피벗은 다시 건드리지 않는다</text>
