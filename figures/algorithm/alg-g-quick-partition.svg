<text class="ink bold" x="396" y="24" text-anchor="middle">한 번 훑으면서 피벗보다 작은 것을 왼쪽으로 몰아 놓는다</text><text class="ink2 sm" x="150" y="94" text-anchor="end">시작</text><rect x="162" y="76" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="179" y="95" text-anchor="middle">3</text><rect x="196" y="76" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="213" y="95" text-anchor="middle">7</text><rect x="230" y="76" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="247" y="95" text-anchor="middle">8</text><rect x="264" y="76" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="281" y="95" text-anchor="middle">5</text><rect x="298" y="76" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="315" y="95" text-anchor="middle">2</text><rect x="332" y="76" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="349" y="95" text-anchor="middle">1</text><rect x="366" y="76" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="383" y="95" text-anchor="middle">9</text><rect x="400" y="76" width="34" height="28" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="417" y="95" text-anchor="middle">4</text><path d="M174 114 L184 114 L179 105 Z" fill="var(--s1)"/><text class="ink sm" x="179" y="128" text-anchor="middle">경계</text><path d="M174 66 L184 66 L179 75 Z" fill="var(--s2)"/><text class="ink sm" x="179" y="61" text-anchor="middle">자리</text><text class="ink sm" x="452" y="94" text-anchor="start">피벗은 맨 뒤 4. 경계는 0 에서 출발</text><text class="ink2 sm" x="150" y="170" text-anchor="end">자리 = 4</text><rect x="162" y="152" width="34" height="28" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="179" y="171" text-anchor="middle">3</text><rect x="196" y="152" width="34" height="28" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="213" y="171" text-anchor="middle">2</text><rect x="230" y="152" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="247" y="171" text-anchor="middle">8</text><rect x="264" y="152" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="281" y="171" text-anchor="middle">5</text><rect x="298" y="152" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="315" y="171" text-anchor="middle">7</text><rect x="332" y="152" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="349" y="171" text-anchor="middle">1</text><rect x="366" y="152" width="34" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="383" y="171" text-anchor="middle">9</text><rect x="400" y="152" width="34" height="28" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="417" y="171" text-anchor="middle">4</text><path d="M242 190 L252 190 L247 181 Z" fill="var(--s1)"/><text class="ink sm" x="247" y="204" text-anchor="middle">경계</text><path d="M310 142 L320 142 L315 151 Z" fill="var(--s2)"/><text class="ink sm" x="315" y="137" text-anchor="middle">자리</text><text class="ink sm" x="452" y="170" text-anchor="start">2 &lt; 4 → 경계 자리와 교환하고 경계를 한 칸</text><text class="ink2 sm" x="150" y="246" text-anchor="end">자리 = 5</text><rect x="162" y="2