"132" text-anchor="middle">13</text><rect x="442" y="110" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="465" y="132" text-anchor="middle">25</text><rect x="488" y="110" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="511" y="132" text-anchor="middle">7</text><rect x="534" y="110" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="557" y="132" text-anchor="middle">11</text><text class="ink2 sm" x="110" y="165" text-anchor="end">h₃</text><rect x="120" y="144" width="46" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="143" y="166" text-anchor="middle">8</text><rect x="166" y="144" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="189" y="166" text-anchor="middle">19</text><rect x="212" y="144" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="235" y="166" text-anchor="middle">5</text><rect x="258" y="144" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="281" y="166" text-anchor="middle">33</text><rect x="304" y="144" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="327" y="166" text-anchor="middle">10</text><rect x="350" y="144" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="373" y="166" text-anchor="middle">21</text><rect x="396" y="144" width="46" height="34" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="419" y="166" text-anchor="middle">40</text><rect x="442" y="144" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="465" y="166" text-anchor="middle">3</text><rect x="488" y="144" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="511" y="166" text-anchor="middle">14</text><rect x="534" y="144" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="557" y="166" text-anchor="middle">26</text><text class="ink2 sm" x="110" y="199" text-anchor="end">h₄</text><rect x="120" y="178" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="143" y="200" text-anchor="middle">24</text><rect x="166" y="178" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="189" y="200" text-anchor="middle">12</text><rect x="212" y="178" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="235" y="200" text-anchor="middle">15</text><rect x="258" y="178" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="281" y="200" text-anchor="middle">7</text><rect x="304" y="178" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="327" y="200" text-anchor="middle">18</text><rect x="350" y="178" width="46" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="373" y="200" text-anchor="middle">9</text><rect x="396" y="178" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="419" y="200" text-anchor="middle">6</text><rect x="442" y="178" width="46" height="34" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="465" y="200" text-anchor="middle">38</text><rect x="488" y="178" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="511" y="200" text-anchor="middle">20</text><rect x="534" y="178" width="46" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="557" y="200" text-anchor="middle">31</text><text class="ink2 sm" x="110" y="46" text-anchor="end">해시</text><text class="ink2 sm" x="350" y="46" text-anchor="middle">카운터 열 w 개</text><text class="ink2 sm" x="64" y="144" text-anchor="middle">행 d 개</text><path d="M596 70 L596 130" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="606" y="84" text-anchor="start">‘사과’ 를 읽는다</text><text class="ink sm" x="606" y="104" text-anchor="start">12 · 8 · 8 · 9 중 최소 → 8</text><text class="ink2 sm" x="606" y="122" text-anchor="start">참값도 8 이었다</text><path d="M596 152 L596 212" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="606" y="166" text-anchor="start">‘배’ 를 읽는다</text><text class="ink sm" x="606" y="186" text-anchor="start">41 · 44 · 40 · 38 중 최소 → 38</text><text class="ink2 sm" x="606" y="204" text-anchor="start">참값은 30. 남의 몫이 얹혔다</text><path d="M52 254 L796 254" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="424" y="276" text-anchor="middle">칸 하나에는 그 칸으로 해시된 모든 원소의 몫이 함께 쌓인다. 그러니 어느 칸이든 참값보다 작을 수 없다</text><text class="ink2 sm" x="424" y="298" text-anchor="middle">곧 오차가 한쪽으로만 생긴다 — 과대 추정은 있어도 과소 추정은 없다.</text><text class="ink2 sm" x="424" y="318" text-anchor="middle">가장 작은 칸을 고르는 것은 ‘남의 몫이 가장 적게 얹힌 증언’ 을 고르는 일이다.</text><rect x="160" y="336" width="520" height="50" rx="5" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4"/><text class="ink bold sm" x="424" y="356" text-anchor="middle">열을 늘리면 얹히는 양이 줄고, 행을 늘리면 운 나쁜 경우가 줄어든다</text><text class="ink2 sm" x="424" y="376" text-anchor="middle">w = ⌈e/ε⌉ 열과 d = ⌈ln(1/δ)⌉ 행이면 오차가 εN 이하임을 확률 1−δ 로 보장한다</text>
</svg>