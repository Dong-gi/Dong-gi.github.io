<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 400" width="848" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">Count-Min Sketch 의 표와 최솟값 읽기</title><desc id="d">행마다 다른 해시로 카운터를 올리고 읽을 때 최솟값을 고른다. 오차는 과대 추정 쪽으로만 생긴다</desc>
