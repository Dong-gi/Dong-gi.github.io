<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 396" width="836" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">비교-교환(CAS) 고리</title><desc id="d">읽고 계산한 뒤 값이 아직 그대로일 때만 쓴다. 실패하면 처음부터 다시 한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="418" y="26" text-anchor="middle">락 없이 고치는 법 — 바꾸기 직전에 ‘아직 그대로인가’ 를 함께 묻는다</text><rect x="60" y="62" width="186" height="54" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="153" y="85.5" text-anchor="middle">① 읽는다</text><text class="ink sm" x="153" y="100.5" text-anchor="middle">옛값 = 잔액</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M246 89 L274 89"/><rect x="276" y="62" width="186" height="54" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="369" y="85.5" text-anchor="middle">② 계산한다</text><text class="ink sm" x="369" y="100.5" text-anchor="middle">새값 = 옛값 + 1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M462 89 L490 89"/><rect x="492" y="62" width="186" height="54" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="585" y="85.5" text-anchor="middle">③ 비교하고 바꾼다</text><text class="ink sm" x="585" y="100.5" text-anchor="middle">잔액이 아직 옛값이면 새값을 쓴다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M678 89 L712 89"/><rect x="714" y="62" width="108" height="54" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="768" y="85.5" text-anchor="middle">성공하면</text><text class="ink sm" x="768" y="100.5" text-anchor="middle">끝</text><path d="M585 116 Q276 172 153 120" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink bold sm" x="300" y="168" text-anchor="middle">실패하면 처음부터 다시 — 그 사이 누가 값을 바꿨다는 뜻이다</text><path d="M52 196 L784 196" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="60" y="220" text-anchor="start">③ 이 한 덩어리로 일어난다는 것이 열쇠다. 읽고 견주고 쓰는 일을 CPU 명령 하나가 나뉘지 않게 해 준다</text><rect x="60" y="244" width="348" height="96" rx="5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.4"/><text class="ink bold sm" x="74" y="266" text-anchor="start">락</text><text class="ink2 sm" x="74" y="288" text-anchor="start">· 못 들어가면 스레드를 재운다</text><text class="ink2 sm" x="74" y="306" text-anchor="start">· 기다리는 동안 CPU 를 쓰지 않는다</text><text class="ink2 sm" x="74" y="324" text-anchor="start">· 들고 있던 스레드가 멈추면 모두가 멈춘다</text><rect x="432" y="244" width="348" height="96" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text class="ink bold sm" x="446" y="266" text-anchor="start">CAS 고리</text><text class="ink2 sm" x="446" y="288" text-anchor="start">· 못 바꾸면 곧바로 다시 시도한다</text><text class="ink2 sm" x="446" y="306" text-anchor="start">· 기다리는 동안에도 CPU 를 쓴다</text><text class="ink2 sm" x="446" y="324" text-anchor="start">· 누군가는 언제나 앞으로 나아간다</text><text class="ink bold sm" x="418" y="364" text-anchor="middle">경쟁이 심하면 CAS 가 계속 실패해 오히려 느려진다. 짧고 드물게 부딪히는 자리에 쓴다</text><text class="ink2 sm" x="418" y="386" text-anchor="middle">값이 A 에서 B 로 갔다가 A 로 돌아오면 CAS 는 변화를 못 알아챈다 — 이것을 ABA 문제라 하고, 번호를 함께 붙여 푼다</text>
</svg>