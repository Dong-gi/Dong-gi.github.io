<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 400" width="844" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">생산자-소비자와 유계 버퍼</title><desc id="d">가득 참 · 비어 있음 · 동시 접근 세 가지를 세마포어 둘과 뮤텍스 하나로 막는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="422" y="26" text-anchor="middle">칸이 정해진 상자를 사이에 두고 — 세 가지를 한꺼번에 지켜야 한다</text><rect x="250" y="92" width="54" height="44" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="277" y="119" text-anchor="middle">자료</text><rect x="304" y="92" width="54" height="44" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="331" y="119" text-anchor="middle">자료</text><rect x="358" y="92" width="54" height="44" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="385" y="119" text-anchor="middle">자료</text><rect x="412" y="92" width="54" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="466" y="92" width="54" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="520" y="92" width="54" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="412" y="78" text-anchor="middle">유계 버퍼 — 칸 6개</text><text class="ink2 sm" x="331" y="154" text-anchor="middle">찬 칸 3</text><text class="ink2 sm" x="493" y="154" text-anchor="middle">빈 칸 3</text><rect x="60" y="92" width="150" height="44" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="135" y="118" text-anchor="middle">생산자</text><rect x="634" y="92" width="150" height="44" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="709" y="118" text-anchor="middle">소비자</text><path fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)" d="M210 114 L242 114"/><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M582 114 L632 114"/><rect x="60" y="190" width="348" height="106" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text class="ink bold sm" x="74" y="212" text-anchor="start">무엇이 잘못될 수 있는가</text><text class="ink2 sm" x="74" y="236" text-anchor="start">· 가득 찼는데 생산자가 또 넣는다 → 덮어쓴다</text><text class="ink2 sm" x="74" y="256" text-anchor="start">· 비었는데 소비자가 꺼낸다 → 쓰레기를 읽는다</text><text class="ink2 sm" x="74" y="276" text-anchor="start">· 둘이 동시에 같은 칸을 건드린다 → 하나가 사라진다</text><rect x="432" y="190" width="348" height="106" rx="5" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4"/><text class="ink bold sm" x="446" y="212" text-anchor="start">무엇으로 막는가</text><text class="ink2 sm" x="446" y="236" text-anchor="start">· 세마포어 빈칸 — 처음 6. 넣기 전에 하나 얻는다</text><text class="ink2 sm" x="446" y="256" text-anchor="start">· 세마포어 찬칸 — 처음 0. 꺼내기 전에 하나 얻는다</text><text class="ink2 sm" x="446" y="276" text-anchor="start">· 뮤텍스 — 버퍼를 실제로 건드리는 짧은 구간만 감싼다</text><path d="M52 314 L792 314" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="422" y="336" text-anchor="middle">세마포어는 개수를 센다. 값이 0 이면 얻으려는 스레드가 잠들고, 누가 반납하면 하나가 깨어난다</text><text class="ink2 sm" x="422" y="358" text-anchor="middle">순서가 중요하다. 세마포어를 먼저 얻고 뮤텍스를 나중에 잠가야 한다.</text><text class="ink bold sm" x="422" y="378" text-anchor="middle">뮤텍스를 쥔 채로 세마포어를 기다리면, 깨워 줄 상대가 뮤텍스를 못 얻어 둘 다 영원히 멈춘다</text>
</svg>