<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">트라이 — 문자열 사전</title><desc id="d">간선을 따라 글자를 하나씩 붙여 내려가고 뿌리에서 온 길이 곧 문자열이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="24" text-anchor="middle">문자열을 노드에 담지 않는다 — 뿌리에서 여기까지 온 길이 곧 문자열이다</text><path d="M149.37 89.5 L206.73 135.38" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 163 L220 193" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.73 220.62 L153.27 263.38" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 227 L220 257" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M233.27 220.62 L286.73 263.38" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M151.7 84.67 L403.43 142.21" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 163 L420 193" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 227 L420 257" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="140" cy="82" r="12" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="140" y="87" text-anchor="middle"></text><circle cx="220" cy="146" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="220" y="151" text-anchor="middle">c</text><circle cx="220" cy="210" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="220" y="215" text-anchor="middle">a</text><circle cx="140" cy="274" r="17" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="140" y="279" text-anchor="middle">r</text><circle cx="220" cy="274" r="17" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="220" y="279" text-anchor="middle">t</text><circle cx="300" cy="274" r="17" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="300" y="279" text-anchor="middle">p</text><circle cx="420" cy="146" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="420" y="151" text-anchor="middle">d</text><circle cx="420" cy="210" r="17" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="420" y="215" text-anchor="middle">o</text><circle cx="420" cy="274" r="17" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="420" y="279" text-anchor="middle">g</text><text class="ink2 sm" x="140" y="62" text-anchor="middle">뿌리 (빈 문자열)</text><text class="ink bold sm" x="140" y="310" text-anchor="middle">car</text><text class="ink bold sm" x="220" y="310" text-anchor="middle">cat</text><text class="ink bold sm" x="300" y="310" text-anchor="middle">cap</text><text class="ink bold sm" x="420" y="310" text-anchor="middle">dog</text><text class="ink bold sm" x="452" y="214" text-anchor="start">do</text><text class="ink2 sm" x="520" y="116" text-anchor="start">초록 테두리는 ‘여기서 단어가</text><text class="ink2 sm" x="520" y="134" text-anchor="start">끝난다’ 는 표시다. do 처럼</text><text class="ink2 sm" x="520" y="152" text-anchor="start">다른 단어의 앞부분인 단어가</text><text class="ink2 sm" x="520" y="170" text-anchor="start">있기 때문에 필요하다</text><text class="ink2 sm" x="520" y="210" text-anchor="start">car · cat · cap 은 앞 두 글자를</text><text class="ink2 sm" x="520" y="228" text-anchor="start">공유하고 그만큼 공간을 아낀다</text><text class="ink2 sm" x="26" y="332" text-anchor="start">길이 m 인 문자열을 찾는 데 드는 시간은 m 번의 내려가기, 곧 O(m) 이다. 사전에 든 단어가 몇 개든 상관없다.</text><text class="ink2 sm" x="26" y="352" text-anchor="start">해시 테이블도 O(m) 이지만 트라이는 ‘ca 로 시작하는 단어를 전부’ 같은 접두어 질의를 그대로 처리한다.</text><text class="ink2 sm" x="26" y="372" text-anchor="start">자동완성이 트라이를 쓰는 이유가 이것이다</text>
</svg>