<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 372" width="836" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">TOCTOU — 검사와 사용 사이의 틈</title><desc id="d">검사한 뒤 실제로 쓰기까지의 틈에 대상이 바뀌면 검사 결과가 아무 의미가 없어진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="418" y="26" text-anchor="middle">검사한 순간과 쓰는 순간 사이에 세상이 바뀐다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M150 226 L726 226"/><text class="ink2 sm" x="732" y="231" text-anchor="start">시간</text><text class="ink bold sm" x="136" y="92" text-anchor="end">프로그램</text><rect x="161.2" y="70" width="156.8" height="42" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="239.6" y="87.5" text-anchor="middle">① 이 이름의 파일이</text><text class="ink sm" x="239.6" y="102.5" text-anchor="middle">내 것인지 검사한다</text><rect x="497.2" y="70" width="179.2" height="42" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="586.8" y="87.5" text-anchor="middle">③ 그 이름으로</text><text class="ink sm" x="586.8" y="102.5" text-anchor="middle">파일을 연다</text><path d="M318 91 L497.2 91" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink bold sm" x="407.6" y="84" text-anchor="middle">틈</text><text class="ink bold sm" x="136" y="180" text-anchor="end">공격자</text><rect x="340.4" y="158" width="134.4" height="42" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="407.6" y="175.5" text-anchor="middle">② 그 이름을 시스템 파일로</text><text class="ink sm" x="407.6" y="190.5" text-anchor="middle">가는 링크로 바꾼다</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M407.6 156 L407.6 118"/><text class="ink bold sm" x="150" y="254" text-anchor="start">① 에서 검사한 대상과 ③ 에서 연 대상이 다르다. 검사는 그때의 진실이었을 뿐이다</text><path d="M52 278 L784 278" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="60" y="300" text-anchor="start">틈을 없앤다</text><text class="ink2 sm" x="196" y="300" text-anchor="start">검사와 사용을 한 덩어리로 만든다 — 열고 나서 그 열린 것에 대해 검사한다</text><text class="ink bold sm" x="60" y="322" text-anchor="start">이름 대신 손잡이</text><text class="ink2 sm" x="196" y="322" text-anchor="start">이름은 언제든 다른 것을 가리킬 수 있다. 한 번 연 대상을 그대로 들고 쓴다</text><text class="ink bold sm" x="60" y="344" text-anchor="start">같은 문제, 다른 얼굴</text><text class="ink2 sm" x="196" y="344" text-anchor="start">잔액을 확인하고 인출하기, 자리가 있는지 보고 예약하기도 모두 이 모양이다</text><text class="ink bold sm" x="60" y="366" text-anchor="start">스레드가 하나뿐이어도 생긴다. 파일 시스템과 운영체제라는 다른 참여자가 있기 때문이다</text>
</svg>