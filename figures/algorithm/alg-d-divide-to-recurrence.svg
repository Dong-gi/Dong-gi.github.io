<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" width="800" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">분할정복의 세 단계와 재귀식</title><desc id="d">문제를 a 개로 나누고 각각을 재귀로 풀고 f(n) 만큼 들여 합친다. 그 셋이 재귀식의 a, b, f(n) 이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">나누고 · 풀고 · 합친다 — 세 단계가 그대로 재귀식의 세 자리가 된다</text><rect x="210" y="46" width="180" height="34" rx="4" fill="none" fill-opacity="1" stroke="var(--ink)" stroke-width="1.6"/><text class="ink sm" x="300" y="67" text-anchor="middle">크기 n 인 문제</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M300 80 L130 116"/><rect x="68" y="118" width="124" height="32" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="130" y="138" text-anchor="middle">크기 n/b</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M130 150 L130 186"/><rect x="68" y="188" width="124" height="30" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.3"/><text class="ink sm" x="130" y="207" text-anchor="middle">부분해</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M130 218 L300 252"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M300 80 L300 116"/><rect x="238" y="118" width="124" height="32" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="300" y="138" text-anchor="middle">크기 n/b</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M300 150 L300 186"/><rect x="238" y="188" width="124" height="30" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.3"/><text class="ink sm" x="300" y="207" text-anchor="middle">부분해</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M300 218 L300 252"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M300 80 L470 116"/><rect x="408" y="118" width="124" height="32" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="470" y="138" text-anchor="middle">크기 n/b</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M470 150 L470 186"/><rect x="408" y="188" width="124" height="30" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.3"/><text class="ink sm" x="470" y="207" text-anchor="middle">부분해</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M470 218 L300 252"/><text class="ink2 sm" x="600" y="100" text-anchor="start">1. 나눈다 — a 개로</text><text class="ink2 sm" x="600" y="172" text-anchor="start">2. 정복한다 — 각각을 재귀로</text><text class="ink2 sm" x="600" y="246" text-anchor="start">3. 합친다 — f(n) 만큼 일한다</text><text class="ink2 sm" x="600" y="130" text-anchor="start">(그림에서는 a = 3)</text><text class="ink2 sm" x="600" y="202" text-anchor="start">(크기 1 이 되면 바로 답한다)</text><rect x="200" y="254" width="200" height="34" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.6"/><text class="ink sm" x="300" y="275" text-anchor="middle">전체의 답</text><path d="M40 306 L760 306" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="400" y="332" text-anchor="middle">T(n) = a · T(n/b) + f(n)</text><rect x="74" y="350" width="11" height="11" rx="2" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="92" y="360" text-anchor="start">a — 몇 조각으로 나누는가</text><rect x="314" y="350" width="11" height="11" rx="2" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="332" y="360" text-anchor="start">b — 조각 하나가 얼마나 작아지는가</text><rect x="554" y="350" width="11" height="11" rx="2" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1.2"/><text class="ink2 sm" x="572" y="360" text-anchor="start">f(n) — 나누고 합치는 데 드는 일</text><text class="ink2 sm" x="400" y="388" text-anchor="middle">재귀식을 세우는 일은 코드를 읽어 이 세 자리를 채우는 일이다. 나머지는 마스터 정리가 한다</text>
</svg>