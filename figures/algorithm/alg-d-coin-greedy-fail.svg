<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 356" width="812" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">거스름돈에서 탐욕이 지는 예</title><desc id="d">동전이 1, 4, 6 일 때 8 원을 탐욕으로 거슬러 주면 세 개가 필요하지만 4 원 두 개면 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="406" y="26" text-anchor="middle">동전이 1 · 4 · 6 원뿐인 나라에서 8 원을 거슬러 준다</text><rect x="22" y="48" width="372" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="208" y="68" text-anchor="middle">탐욕 — 매번 가장 큰 동전</text><text class="ink2 sm" x="208" y="84" text-anchor="middle">6 을 집고 나면 남은 2 를 1 로만 채운다</text><rect x="76" y="110" width="198" height="40" rx="3" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold" x="175" y="135" text-anchor="middle">6</text><rect x="274" y="110" width="33" height="40" rx="3" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold" x="290.5" y="135" text-anchor="middle">1</text><rect x="307" y="110" width="33" height="40" rx="3" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold" x="323.5" y="135" text-anchor="middle">1</text><path d="M76 150 L76 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="76" y="170" text-anchor="middle">0</text><path d="M109 150 L109 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 150 L142 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="142" y="170" text-anchor="middle">2</text><path d="M175 150 L175 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M208 150 L208 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="208" y="170" text-anchor="middle">4</text><path d="M241 150 L241 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M274 150 L274 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="274" y="170" text-anchor="middle">6</text><path d="M307 150 L307 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 150 L340 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="340" y="170" text-anchor="middle">8</text><text class="ink bold" x="208" y="200" text-anchor="middle">동전 3개</text><text class="ink2 sm" x="208" y="228" text-anchor="middle">6 → 남은 2 → 1 → 1</text><text class="ink2 sm" x="208" y="248" text-anchor="middle">한 번의 좋은 선택이 뒤를 망쳤다</text><rect x="418" y="48" width="372" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="604" y="68" text-anchor="middle">최적 — 6 을 아예 쓰지 않는다</text><text class="ink2 sm" x="604" y="84" text-anchor="middle">큰 동전을 포기하면 딱 맞는다</text><rect x="472" y="110" width="132" height="40" rx="3" fill="var(--s3)" fill-opacity="0.26" stroke="var(--s3)" stroke-width="1.7"/><text class="ink bold" x="538" y="135" text-anchor="middle">4</text><rect x="604" y="110" width="132" height="40" rx="3" fill="var(--s3)" fill-opacity="0.26" stroke="var(--s3)" stroke-width="1.7"/><text class="ink bold" x="670" y="135" text-anchor="middle">4</text><path d="M472 150 L472 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="472" y="170" text-anchor="middle">0</text><path d="M505 150 L505 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M538 150 L538 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="538" y="170" text-anchor="middle">2</text><path d="M571 150 L571 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M604 150 L604 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="604" y="170" text-anchor="middle">4</text><path d="M637 150 L637 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 150 L670 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="670" y="170" text-anchor="middle">6</text><path d="M703 150 L703 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M736 150 L736 156" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="736" y="170" text-anchor="middle">8</text><text class="ink bold" x="604" y="200" text-anchor="middle">동전 2개</text><text class="ink2 sm" x="604" y="228" text-anchor="middle">4 → 4</text><text class="ink2 sm" x="604" y="248" text-anchor="middle">지금 손해를 보는 선택이 전체로는 이긴다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M404 156 L408 156"/><path d="M40 288 L772 288" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="406" y="312" text-anchor="middle">탐욕은 되돌아보지 않는다. 그래서 ‘지금 가장 좋은 것’ 이 뒤에 무엇을 막는지 알 수 없다</text><text class="ink2 sm" x="406" y="336" text-anchor="middle">12장에서 같은 문제를 동적 계획법으로 다시 풀어 2 라는 답을 얻는다</text>
</svg>