<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 452" width="780" height="452" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">힙의 트리 표현과 배열 표현</title><desc id="d">완전 이진트리를 위층부터 왼쪽에서 오른쪽으로 배열에 적으면 첨자 계산으로 부모와 자식을 찾는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="24" text-anchor="middle">완전 이진트리는 배열 한 줄로 적을 수 있다 — 포인터가 필요 없다</text><path d="M236.15 93.85 L173.85 138.15" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M263.85 93.85 L326.15 138.15" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M149.53 161.4 L120.47 198.6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M170.72 161.19 L201.28 198.81" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.99 162.42 L309.01 197.58" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M350.72 161.19 L381.28 198.81" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M103.6 227.75 L90.4 260.25" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M117.22 227.39 L132.78 260.61" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.88 228.49 L200.12 259.51" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="84" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="250" y="89" text-anchor="middle">16</text><circle cx="160" cy="148" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="160" y="153" text-anchor="middle">14</text><circle cx="340" cy="148" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="340" y="153" text-anchor="middle">10</text><circle cx="110" cy="212" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="110" y="217" text-anchor="middle">8</text><circle cx="212" cy="212" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="212" y="217" text-anchor="middle">7</text><circle cx="300" cy="212" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="300" y="217" text-anchor="middle">9</text><circle cx="392" cy="212" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="392" y="217" text-anchor="middle">3</text><circle cx="84" cy="276" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="84" y="281" text-anchor="middle">2</text><circle cx="140" cy="276" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="140" y="281" text-anchor="middle">4</text><circle cx="196" cy="276" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="196" y="281" text-anchor="middle">1</text><text class="ink2 sm" x="270" y="70" text-anchor="middle">0</text><text class="ink2 sm" x="180" y="134" text-anchor="middle">1</text><text class="ink2 sm" x="360" y="134" text-anchor="middle">2</text><text class="ink2 sm" x="130" y="198" text-anchor="middle">3</text><text class="ink2 sm" x="232" y="198" text-anchor="middle">4</text><text class="ink2 sm" x="320" y="198" text-anchor="middle">5</text><text class="ink2 sm" x="412" y="198" text-anchor="middle">6</text><text class="ink2 sm" x="104" y="262" text-anchor="middle">7</text><text class="ink2 sm" x="160" y="262" text-anchor="middle">8</text><text class="ink2 sm" x="216" y="262" text-anchor="middle">9</text><text class="ink2 sm" x="250" y="56" text-anchor="middle">노드 옆의 작은 수가 배열 첨자다</text><rect x="96" y="316" width="54" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="123" y="340" text-anchor="middle">16</text><text class="ink2 sm" x="123" y="368" text-anchor="middle">0</text><rect x="150" y="316" width="54" height="38" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="177" y="340" text-anchor="middle">14</text><text class="ink2 sm" x="177" y="368" text-anchor="middle">1</text><rect x="204" y="316" width="54" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="231" y="340" text-anchor="middle">10</text><text class="ink2 sm" x="231" y="368" text-anchor="middle">2</text><rect x="258" y="316" width="54" height="38" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="285" y="340" text-anchor="middle">8</text><text class="ink2 sm" x="285" y="368" text-anchor="middle">3</text><rect x="312" y="316" width="54" height="38" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="339" y="340" text-anchor="middle">7</text><text class="ink2 sm" x="339" y="368" text-anchor="middle">4</text><rect x="366" y="316" width="54" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="393" y="340" text-anchor="middle">9</text><text class="ink2 sm" x="393" y="368" text-anchor="middle">5</text><rect x="420" y="316" width="54" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="447" y="340" text-anchor="middle">3</text><text class="ink2 sm" x="447" y="368" text-anchor="middle">6</text><rect x="474" y="316" width="54" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="501" y="340" text-anchor="middle">2</text><text class="ink2 sm" x="501" y="368" text-anchor="middle">7</text><rect x="528" y="316" width="54" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="555" y="340" text-anchor="middle">4</text><text class="ink2 sm" x="555" y="368" text-anchor="middle">8</text><rect x="582" y="316" width="54" height="38" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="609" y="340" text-anchor="middle">1</text><text class="ink2 sm" x="609" y="368" text-anchor="middle">9</text><text class="ink bold sm" x="84" y="341" text-anchor="end">배열</text><path d="M177 312 C177 286 285 286 285 312" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M177 312 C177 272 339 272 339 312" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)"/><text class="ink2 sm" x="96" y="396" text-anchor="start">1번 칸의 자식은 3번 칸과 4번 칸이다. 트리에서 14 의 자식이 8 과 7 인 것과 같다.</text><text class="ink bold sm" x="96" y="416" text-anchor="start">i 의 자식 = 2i + 1 과 2i + 2,    i 의 부모 = (i − 1) ÷ 2 의 몫</text><text class="ink2 sm" x="96" y="438" text-anchor="start">이 세 줄의 산술만으로 트리를 오르내린다. 저장하는 것은 값뿐이고 주소는 하나도 없다</text><text class="ink bold sm" x="508" y="116" text-anchor="start">힙 성질: 부모 ≥ 두 자식</text><text class="ink2 sm" x="508" y="138" text-anchor="start">형제끼리는 아무 관계가 없다.</text><text class="ink2 sm" x="508" y="156" text-anchor="start">그래서 힙은 정렬된 것이 아니고</text><text class="ink2 sm" x="508" y="174" text-anchor="start">가장 큰 값이 뿌리에 있다는 것만</text><text class="ink2 sm" x="508" y="192" text-anchor="start">보장된다</text><text class="ink2 sm" x="508" y="226" text-anchor="start">빈틈없이 채운 완전 이진트리라서</text><text class="ink2 sm" x="508" y="244" text-anchor="start">첨자 계산이 어긋나지 않는다</text>
</svg>