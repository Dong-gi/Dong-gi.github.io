<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 376" width="828" height="376" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">정점 덮개의 2-근사 알고리즘</title><desc id="d">덮이지 않은 간선의 양 끝을 함께 넣기를 되풀이하면 최적의 두 배를 넘지 않는 덮개가 나온다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="414" y="26" text-anchor="middle">풀 수 없으면 가까이 간다 — 정점 덮개를 최적의 두 배 안으로 맞추는 법</text><path d="M105 122 L167 122" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 122 L267 122" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M305 122 L367 122" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M373.22 136.06 L298.78 217.94" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M267 232 L205 232" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M167 232 L105 232" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M186 141 L186 213" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M286 141 L286 213" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="136" y="112" text-anchor="middle">1회</text><text class="ink bold sm" x="336" y="112" text-anchor="middle">2회</text><text class="ink bold sm" x="236" y="222" text-anchor="middle">3회</text><circle cx="86" cy="122" r="19" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="86" y="126" text-anchor="middle">a</text><circle cx="186" cy="122" r="19" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="186" y="126" text-anchor="middle">b</text><circle cx="286" cy="122" r="19" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="286" y="126" text-anchor="middle">c</text><circle cx="386" cy="122" r="19" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="386" y="126" text-anchor="middle">d</text><circle cx="286" cy="232" r="19" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="286" y="236" text-anchor="middle">e</text><circle cx="186" cy="232" r="19" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="186" y="236" text-anchor="middle">f</text><circle cx="86" cy="232" r="19" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="86" y="236" text-anchor="middle">g</text><text class="ink bold sm" x="86" y="288" text-anchor="start">얻은 덮개 {a, b, c, d, e, f} — 6개</text><text class="ink2 sm" x="86" y="308" text-anchor="start">최적은 {b, c, e, f} — 4개</text><text class="ink2 sm" x="86" y="328" text-anchor="start">6 ≤ 2 × 4 를 지켰다</text><text class="ink bold sm" x="470" y="96" text-anchor="start">절차</text><text class="ink2 sm" x="470" y="120" text-anchor="start">1. 아직 덮이지 않은 간선을 아무거나 하나 고른다</text><text class="ink2 sm" x="470" y="140" text-anchor="start">2. 그 간선의 양 끝을 둘 다 답에 넣는다</text><text class="ink2 sm" x="470" y="160" text-anchor="start">3. 그 두 점에 닿는 간선을 모두 지운다</text><text class="ink2 sm" x="470" y="180" text-anchor="start">4. 남은 간선이 없을 때까지 되풀이한다</text><text class="ink bold sm" x="470" y="226" text-anchor="start">왜 두 배를 넘지 않는가</text><text class="ink2 sm" x="470" y="250" text-anchor="start">굵게 고른 간선들은 끝점을 하나도 공유하지 않는다.</text><text class="ink2 sm" x="470" y="269" text-anchor="start">어떤 덮개든 그 간선 하나마다 적어도 한 점을 써야 하므로</text><text class="ink2 sm" x="470" y="288" text-anchor="start">최적해의 크기는 고른 간선 수 이상이다.</text><text class="ink2 sm" x="470" y="307" text-anchor="start">우리가 쓴 점은 정확히 그 두 배다.</text><text class="ink2 sm" x="414" y="368" text-anchor="middle">최적을 모르면서도 ‘최적의 두 배 안’ 이라고 말할 수 있다는 것이 근사 알고리즘의 요령이다</text>
</svg>