<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 400" width="812" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">카라추바 곱셈이 곱셈 하나를 더는 방법</title><desc id="d">네 곱 중 가운데 두 개의 합을 한 번의 곱으로 얻어 재귀식의 a 를 4 에서 3 으로 낮춘다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="406" y="26" text-anchor="middle">곱셈 네 번을 세 번으로 — 카라추바가 바꾼 것은 a 하나뿐이다</text><text class="ink sm" x="406" y="56" text-anchor="middle">1234 = 12·100 + 34,   5678 = 56·100 + 78     (a=12, b=34, c=56, d=78)</text><rect x="22" y="76" width="372" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="208" y="96" text-anchor="middle">곧이곧대로 펼치면</text><text class="ink2 sm" x="208" y="112" text-anchor="middle">곱셈 4번</text><text class="ink sm" x="208" y="142" text-anchor="middle">(a·100 + b)(c·100 + d)</text><text class="ink sm" x="208" y="162" text-anchor="middle">= ac·10000 + ad·100 + bc·100 + bd</text><rect x="56" y="194" width="68" height="34" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.7"/><text class="ink sm" x="90" y="215" text-anchor="middle">ac</text><rect x="140" y="194" width="68" height="34" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.7"/><text class="ink sm" x="174" y="215" text-anchor="middle">ad</text><rect x="224" y="194" width="68" height="34" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.7"/><text class="ink sm" x="258" y="215" text-anchor="middle">bc</text><rect x="308" y="194" width="68" height="34" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.7"/><text class="ink sm" x="342" y="215" text-anchor="middle">bd</text><text class="ink bold sm" x="208" y="254" text-anchor="middle">T(n) = 4 T(n/2) + Θ(n)</text><text class="ink2 sm" x="208" y="276" text-anchor="middle">잎 비용 n^log₂4 = n² 이 이긴다</text><text class="ink2 sm" x="208" y="300" text-anchor="middle">Θ(n²) — 초등학교 곱셈과 같다</text><rect x="418" y="76" width="372" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="604" y="96" text-anchor="middle">가운데 둘을 하나로 묶으면</text><text class="ink2 sm" x="604" y="112" text-anchor="middle">곱셈 3번</text><text class="ink2 sm" x="604" y="142" text-anchor="middle">가운데 계수 ad + bc 는 따로 구하지 않아도 된다</text><text class="ink sm" x="604" y="162" text-anchor="middle">(a+b)(c+d) − ac − bd = ad + bc</text><rect x="448" y="194" width="68" height="34" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.7"/><text class="ink sm" x="482" y="215" text-anchor="middle">ac</text><rect x="532" y="194" width="68" height="34" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.7"/><text class="ink sm" x="566" y="215" text-anchor="middle">bd</text><rect x="616" y="194" width="128" height="34" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.7"/><text class="ink sm" x="680" y="215" text-anchor="middle">(a+b)(c+d)</text><text class="ink bold sm" x="604" y="254" text-anchor="middle">T(n) = 3 T(n/2) + Θ(n)</text><text class="ink2 sm" x="604" y="276" text-anchor="middle">잎 비용 n^log₂3 ≈ n^1.585</text><text class="ink2 sm" x="604" y="300" text-anchor="middle">Θ(n^1.585) — 덧셈이 몇 번 늘어난 값이다</text><text class="ink2 sm" x="406" y="358" text-anchor="middle">두 재귀식의 차이는 a 가 4 냐 3 이냐 하나뿐이고, 그 하나가 지수를 2 에서 1.585 로 내린다.</text><text class="ink2 sm" x="406" y="378" text-anchor="middle">n = 10000 자리에서 n² 은 10⁸, n^1.585 는 10⁶ 남짓이다. 덧셈 몇 번을 더 하고 곱셈 하나를 던 결과다</text>
</svg>