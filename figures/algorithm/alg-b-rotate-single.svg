<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 476" width="780" height="476" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">AVL 트리의 단일 회전 LL 과 RR</title><desc id="d">치우친 세 노드가 한 방향이면 가운데 노드를 위로 올리는 한 번의 회전으로 균형이 맞는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
