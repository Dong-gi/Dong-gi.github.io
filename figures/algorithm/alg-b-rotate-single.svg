text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="24" text-anchor="middle">x · y · z 가 한 방향으로 늘어섰으면 한 번 돌리면 된다</text><text class="ink bold sm" x="26" y="62" text-anchor="start">LL — 왼쪽으로 두 번 내려간 모양. 오른쪽으로 한 번 돌린다</text><path d="M130 154 L186 212" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 96 L250 154" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 212 L40 264" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 212 L112 264" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M186 212 L165 246 L207 246 Z" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1.3" stroke-linejoin="round"/><text class="ink2 sm" x="186" y="238" text-anchor="middle">T3</text><path d="M250 154 L229 188 L271 188 Z" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1.3" stroke-linejoin="round"/><text class="ink2 sm" x="250" y="180" text-anchor="middle">T4</text><path d="M40 264 L19 298 L61 298 Z" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1.3" stroke-linejoin="round"/><text class="ink2 sm" x="40" y="290" text-anchor="middle">T1</text><path d="M112 264 L91 298 L133 298 Z" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1.3" stroke-linejoin="round"/><text class="ink2 sm" x="112" y="290" text-anchor="middle">T2</text><path d="M168.9 108.88 L141.1 141.12" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M118.9 166.88 L91.1 199.12" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="96" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="180" y="101" text-anchor="middle">z</text><circle cx="130" cy="154" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="130" y="159" text-anchor="middle">y</text><circle cx="80" cy="212" r="17" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="80" y="217" text-anchor="middle">x</text><path d="M488 170 L456 226" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M488 170 L524 226" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M608 170 L576 226" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M608 170 L644 226" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M456 226 L435 260 L477 260 Z" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1.3" stroke-linejoin="round"/><text class="ink2 sm" x="456" y="252" text-anchor="middle">T1</text><path d="M524 226 L503 260 L545 260 Z" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1.3" stroke-linejoin="round"/><text class="ink2 sm" x="524" y="252" text-anchor="middle">T2</text><path d="M576 226 L555 260 L597 260 Z" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1.3" stroke-linejoin="round"/><text class="ink2 sm" x="576" y="252" text-anchor="middle">T3</text><path d="M644 226 L623 260 L665 260 Z" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1.3" stroke-linejoin="round"/><text class="ink2 sm" x="644" y="252" text-anchor="middle">T4</text><path d="M536.37 118.4 L499.63 157.6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M559.63 118.4 L596.37 157.6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="548" cy="106" r="17" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="548" y="111" text-anchor="middle">y</text><circle cx="488" cy="170" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="488" y="175" text-anchor="middle">x</text><circle cx="608" cy="170" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="608" y="175" text-anchor="middle">z</text><path fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M340 170 L400 170"/><text class="ink bold sm" x="370" y="158" text-anchor="middle">회전</text><text class="ink2 sm" x="370" y="200" text-anchor="middle">y 가 올라가고</text><text class="ink2 sm" x="370" y="218" text-anchor="middle">z 가 내려온다.</text><text class="ink2 sm" x="370" y="236" text-anchor="middle">T3 만 자리를</text><text class="ink2 sm" x="370" y="254" text-anchor="middle">옮긴다</text><text class="ink bold sm" x="26" y="322" text-anchor="start">RR — 오른쪽으로 두 번 내려간 모양. 왼쪽으로 한 번 돌린다. LL 의 거울상이다</text><path d="M122.01 362.57 L147.99 385.43" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M172.01 406.57 L197.99 429.43" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110" cy="352" r="16" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="110" y="357" text-anchor="middle">z</text><circle cx="160" cy="396" r="16" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="160" y="401" text-anchor="middle">y</text><circle cx="210" cy="440" r="16" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="210" y="445" text-anchor="middle">x</text><path d="M537.32 377.91 L506.68 412.09" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M558.68 377.91 L589.32 412.09" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="548" cy="366" r="16" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="2"/><text class="ink" x="548" y="371" text-anchor="middle">y</text><circle cx="496" cy="424" r="16" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="496" y="429" text-anchor="middle">z</text><circle cx="600" cy="424" r="16" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="600" y="429" text-anchor="middle">x</text><path fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M340 400 L400 400"/><text class="ink bold sm" x="370" y="388" text-anchor="middle">회전</text><text class="ink2 sm" x="646" y="396" text-anchor="start">부분트리도 LL 과 같은 방식으로</text><text class="ink2 sm" x="646" y="414" text-anchor="start">좌우만 뒤집어 옮겨 간다</text>
</svg>