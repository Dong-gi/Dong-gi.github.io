<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 412" width="836" height="412" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">디피-헬만 키 교환을 색 섞기로</title><desc id="d">공개색에 각자의 비밀색을 섞어 교환하면 양쪽이 같은 색에 도달하지만 엿듣는 사람은 만들 수 없다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="418" y="26" text-anchor="middle">섞기는 쉽고 되돌리기는 어렵다 — 색으로 본 디피-헬만</text><rect x="392" y="58" width="52" height="40" rx="4" fill="#e6d278" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="418" y="114" text-anchor="middle">공개색</text><text class="ink2 sm" x="418" y="130" text-anchor="middle">누구나 본다</text><rect x="140" y="152" width="52" height="40" rx="4" fill="#dc6e5a" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="166" y="208" text-anchor="middle">앨리스의 비밀색</text><rect x="644" y="152" width="52" height="40" rx="4" fill="#6e96e6" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="670" y="208" text-anchor="middle">밥의 비밀색</text><rect x="258" y="152" width="52" height="40" rx="4" fill="#c65b2a" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="284" y="208" text-anchor="middle">공개색 + 앨리스</text><text class="ink2 sm" x="284" y="224" text-anchor="middle">주고받는다</text><rect x="526" y="152" width="52" height="40" rx="4" fill="#637c6c" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="552" y="208" text-anchor="middle">공개색 + 밥</text><text class="ink2 sm" x="552" y="224" text-anchor="middle">주고받는다</text><rect x="310" y="268" width="52" height="40" rx="4" fill="#553626" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="336" y="324" text-anchor="middle">받은 것 + 앨리스</text><rect x="474" y="268" width="52" height="40" rx="4" fill="#553526" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="500" y="324" text-anchor="middle">받은 것 + 밥</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M392 100 L300 148"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M444 100 L546 148"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M192 194 L276 210"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M670 194 L582 210"/><path d="M284 224 Q300 250 330 264" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M552 224 Q536 250 506 264" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink bold sm" x="418" y="250" text-anchor="middle">섞는 순서가 달라도 같은 색에 이른다</text><text class="ink bold" x="418" y="292" text-anchor="middle">같다</text><path d="M40 344 L796 344" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="40" y="366" text-anchor="start">수로 바꾸면</text><text class="ink2 sm" x="140" y="366" text-anchor="start">공개색은 (소수 p, 밑 g). 섞기는 gˣ mod p. 앨리스가 gᵃ 를, 밥이 gᵇ 를 보내고 둘 다 gᵃᵇ 를 얻는다</text><text class="ink bold sm" x="40" y="388" text-anchor="start">엿듣는 자는</text><text class="ink2 sm" x="140" y="388" text-anchor="start">g, gᵃ, gᵇ 를 모두 보지만 gᵃᵇ 를 만들 수 없다. a 나 b 를 알아내야 하는데 그것이 이산로그 문제다</text><text class="ink bold sm" x="40" y="410" text-anchor="start">막지 못하는 것</text><text class="ink2 sm" x="140" y="410" text-anchor="start">가운데서 양쪽과 따로 키를 맺는 중간자. 상대가 누구인지는 서명과 인증서가 따로 확인해야 한다</text>
</svg>