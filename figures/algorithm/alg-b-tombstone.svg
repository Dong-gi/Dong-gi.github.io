<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">개방 주소법의 삭제와 묘비</title><desc id="d">삭제한 자리를 그냥 비우면 탐사가 거기서 멈춰 뒤의 키를 찾지 못한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="24" text-anchor="middle">개방 주소법에서 그냥 지우면 뒤에 있는 것을 못 찾는다</text><text class="ink bold sm" x="156" y="101" text-anchor="end">처음</text><rect x="168" y="76" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="199" y="130" text-anchor="middle">0</text><rect x="230" y="76" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="261" y="101" text-anchor="middle">A</text><text class="ink2 sm" x="261" y="130" text-anchor="middle">1</text><rect x="292" y="76" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="323" y="101" text-anchor="middle">B</text><text class="ink2 sm" x="323" y="130" text-anchor="middle">2</text><rect x="354" y="76" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="385" y="101" text-anchor="middle">C</text><text class="ink2 sm" x="385" y="130" text-anchor="middle">3</text><rect x="416" y="76" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="447" y="130" text-anchor="middle">4</text><rect x="478" y="76" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="509" y="130" text-anchor="middle">5</text><rect x="540" y="76" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="571" y="130" text-anchor="middle">6</text><text class="ink2 sm" x="168" y="148" text-anchor="start">A · B · C 가 모두 1번 칸을 원했다. B 는 2번, C 는 3번으로 밀렸다</text><text class="ink bold sm" x="156" y="181" text-anchor="end">B 를 빈 칸으로 지우면</text><rect x="168" y="156" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="199" y="210" text-anchor="middle">0</text><rect x="230" y="156" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="261" y="181" text-anchor="middle">A</text><text class="ink2 sm" x="261" y="210" text-anchor="middle">1</text><rect x="292" y="156" width="62" height="40" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink2 sm" x="323" y="210" text-anchor="middle">2</text><rect x="354" y="156" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="385" y="181" text-anchor="middle">C</text><text class="ink2 sm" x="385" y="210" text-anchor="middle">3</text><rect x="416" y="156" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="447" y="210" text-anchor="middle">4</text><rect x="478" y="156" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="509" y="210" text-anchor="middle">5</text><rect x="540" y="156" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="571" y="210" text-anchor="middle">6</text><text class="ink2 sm" x="168" y="228" text-anchor="start">C 를 찾을 때 1 → 2 에서 빈 칸을 만나 ‘없다’ 고 답해 버린다</text><text class="ink bold sm" x="156" y="261" text-anchor="end">표시만 남기면</text><rect x="168" y="236" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="199" y="290" text-anchor="middle">0</text><rect x="230" y="236" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="261" y="261" text-anchor="middle">A</text><text class="ink2 sm" x="261" y="290" text-anchor="middle">1</text><rect x="292" y="236" width="62" height="40" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink" x="323" y="261" text-anchor="middle">×</text><text class="ink2 sm" x="323" y="290" text-anchor="middle">2</text><rect x="354" y="236" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="385" y="261" text-anchor="middle">C</text><text class="ink2 sm" x="385" y="290" text-anchor="middle">3</text><rect x="416" y="236" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="447" y="290" text-anchor="middle">4</text><rect x="478" y="236" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="509" y="290" text-anchor="middle">5</text><rect x="540" y="236" width="62" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="571" y="290" text-anchor="middle">6</text><text class="ink2 sm" x="168" y="308" text-anchor="start">× 는 ‘여기 있었지만 지웠다, 계속 가라’ 는 뜻이다. 탐사가 멈추지 않는다</text><text class="ink2 sm" x="26" y="320" text-anchor="start">이 표시를 묘비(tombstone)라 한다. 묘비가 쌓이면 표가 실제보다 꽉 찬 것처럼 느려지므로 가끔 표를 다시 짓는다</text>
</svg>