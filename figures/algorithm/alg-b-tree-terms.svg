.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="24" text-anchor="middle">트리를 말하려면 이 여섯 낱말이 필요하다</text><path d="M74 82 L446 82" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text class="ink2 sm" x="68" y="87" text-anchor="end">깊이 0</text><path d="M74 152 L446 152" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text class="ink2 sm" x="68" y="157" text-anchor="end">깊이 1</text><path d="M74 222 L446 222" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text class="ink2 sm" x="68" y="227" text-anchor="end">깊이 2</text><path d="M74 292 L446 292" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text class="ink2 sm" x="68" y="297" text-anchor="end">깊이 3</text><rect x="108" y="130" width="206" height="184" rx="10" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M265.79 93.05 L204.21 140.95" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M294.75 92.32 L365.25 141.68" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M178.29 165.67 L141.71 208.33" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M201.71 165.67 L238.29 208.33" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 170 L380 204" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M241.07 237.63 L218.93 276.37" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M259.26 237.43 L282.74 276.57" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="82" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="280" y="87" text-anchor="middle">A</text><circle cx="190" cy="152" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="190" y="157" text-anchor="middle">B</text><circle cx="380" cy="152" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="380" y="157" text-anchor="middle">C</text><circle cx="130" cy="222" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="130" y="227" text-anchor="middle">D</text><circle cx="250" cy="222" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="250" y="227" text-anchor="middle">E</text><circle cx="380" cy="222" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="380" y="227" text-anchor="middle">F</text><circle cx="210" cy="292" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="210" y="297" text-anchor="middle">G</text><circle cx="292" cy="292" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="292" y="297" text-anchor="middle">H</text><text class="ink2 sm" x="280" y="58" text-anchor="middle">뿌리(root) — 부모가 없는 단 하나의 노드</text><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M600 152 L404 152"/><text class="ink2 sm" x="606" y="156" text-anchor="start">C 의 차수(degree)는 1</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M600 222 L404 222"/><text class="ink2 sm" x="606" y="226" text-anchor="start">잎(leaf) — 자식이 없는 노드</text><path fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)" d="M600 292 L316 292"/><text class="ink2 sm" x="606" y="296" text-anchor="start">가장 깊은 잎까지가 높이 3</text><text class="ink2 sm" x="606" y="96" text-anchor="start">B 아래를 따로 떼면</text><text class="ink2 sm" x="606" y="114" text-anchor="start">그것도 트리다 — 부분트리</text><text class="ink2 sm" x="26" y="344" text-anchor="start">노드 n 개짜리 트리의 간선은 언제나 n − 1 개다. 뿌리를 뺀 모든 노드가 부모와 이어지는 간선을 정확히 하나씩 갖기 때문이다</text>
</svg>