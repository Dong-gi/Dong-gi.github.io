"4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="254" y="279" text-anchor="middle">P₁</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M254 288 L254 310"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M268 324 L286 324"/><rect x="288" y="309" width="44" height="30" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.3"/><text class="ink sm" x="310" y="328" text-anchor="middle">C₁</text><rect x="348" y="309" width="66" height="30" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.3"/><text class="ink sm" x="381" y="328" text-anchor="middle">nonce·2</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M414 324 L428 324"/><rect x="430" y="309" width="62" height="30" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="461" y="328" text-anchor="middle">E · 키</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M492 324 L510 324"/><circle cx="524" cy="324" r="12" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="524" y="329" text-anchor="middle">⊕</text><rect x="500" y="262" width="48" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="524" y="279" text-anchor="middle">P₂</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M524 288 L524 310"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M538 324 L556 324"/><rect x="558" y="309" width="44" height="30" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.3"/><text class="ink sm" x="580" y="328" text-anchor="middle">C₂</text><path d="M40 366 L812 366" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="426" y="388" text-anchor="middle">IV 와 nonce 는 비밀이 아니다. 다만 같은 열쇠로 두 번 쓰면 안 된다 — CTR 에서 그러면 두 평문의 XOR 이 그대로 드러난다</text><text class="ink2 sm" x="426" y="410" text-anchor="middle">세 모드 어느 것도 변조를 막지 못한다. 무결성은 뒤에 볼 MAC 이 따로 맡는다</text>
</svg>