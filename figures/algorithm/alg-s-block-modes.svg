<text class="ink bold" x="426" y="26" text-anchor="middle">블록을 이어 붙이는 세 가지 방법 — 암호 함수 자체는 똑같다</text><text class="ink bold" x="40" y="105" text-anchor="start">ECB</text><text class="ink bold sm" x="668" y="94" text-anchor="start">블록마다 따로 암호화한다</text><text class="ink2 sm" x="668" y="112" text-anchor="start">같은 평문 블록 → 같은 암호문 블록</text><text class="ink bold" x="40" y="217" text-anchor="start">CBC</text><text class="ink bold sm" x="668" y="206" text-anchor="start">앞 블록의 암호문을 섞는다</text><text class="ink2 sm" x="668" y="224" text-anchor="start">암호화는 차례대로, 복호화는 병렬로</text><text class="ink bold" x="40" y="329" text-anchor="start">CTR</text><text class="ink bold sm" x="668" y="318" text-anchor="start">평문은 암호 함수를 통과하지 않는다</text><text class="ink2 sm" x="668" y="336" text-anchor="start">암 · 복호화 모두 병렬로 된다</text><rect x="118" y="85" width="48" height="30" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="142" y="104" text-anchor="middle">P₁</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M166 100 L188 100"/><rect x="190" y="85" width="62" height="30" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="221" y="104" text-anchor="middle">E · 키</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M252 100 L274 100"/><rect x="276" y="85" width="48" height="30" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.3"/><text class="ink sm" x="300" y="104" text-anchor="middle">C₁</text><rect x="388" y="85" width="48" height="30" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="412" y="104" text-anchor="middle">P₂</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M436 100 L458 100"/><rect x="460" y="85" width="62" height="30" r