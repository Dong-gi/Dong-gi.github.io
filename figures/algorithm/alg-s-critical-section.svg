<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 396" width="828" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">임계 구역과 상호 배제</title><desc id="d">두 스레드의 임계 구역이 시간 위에서 겹치지 않게 만드는 것이 상호 배제다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="414" y="26" text-anchor="middle">한 번에 하나만 들어가는 구간을 만든다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M128 224 L704 224"/><text class="ink2 sm" x="710" y="229" text-anchor="start">시간</text><text class="ink bold sm" x="114" y="110" text-anchor="end">스레드 A</text><rect x="139.2" y="88" width="78.4" height="36" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink2 sm" x="178.4" y="111" text-anchor="middle">들어가기 전</text><rect x="217.6" y="88" width="168" height="36" rx="3" fill="var(--s1)" fill-opacity="0.25" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold sm" x="301.6" y="111" text-anchor="middle">임계 구역</text><rect x="385.6" y="88" width="89.6" height="36" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink2 sm" x="430.4" y="111" text-anchor="middle">나온 뒤</text><text class="ink bold sm" x="114" y="186" text-anchor="end">스레드 B</text><rect x="139.2" y="164" width="78.4" height="36" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink2 sm" x="178.4" y="187" text-anchor="middle">들어가기 전</text><rect x="217.6" y="164" width="168" height="36" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4"/><text class="ink2 sm" x="301.6" y="187" text-anchor="middle">기다린다 — 잠겨 있다</text><rect x="385.6" y="164" width="179.2" height="36" rx="3" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold sm" x="475.2" y="187" text-anchor="middle">임계 구역</text><rect x="564.8" y="164" width="89.6" height="36" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink2 sm" x="609.6" y="187" text-anchor="middle">나온 뒤</text><path d="M217.6 76 L217.6 218" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M385.6 76 L385.6 218" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M564.8 76 L564.8 218" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="217.6" y="70" text-anchor="middle">잠근다</text><text class="ink2 sm" x="385.6" y="70" text-anchor="middle">A 가 푼다 → B 가 들어간다</text><text class="ink2 sm" x="564.8" y="70" text-anchor="middle">B 가 푼다</text><text class="ink bold sm" x="128" y="252" text-anchor="start">두 임계 구역 상자가 시간 위에서 겹치지 않는다 — 이것이 상호 배제다</text><path d="M52 270 L776 270" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="304" width="14" height="14" rx="2" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><text class="ink bold sm" x="48" y="316" text-anchor="start">상호 배제</text><text class="ink2 sm" x="134" y="316" text-anchor="start">한 번에 한 스레드만 안에 있다</text><rect x="28" y="330" width="14" height="14" rx="2" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1.2"/><text class="ink bold sm" x="48" y="342" text-anchor="start">진행</text><text class="ink2 sm" x="134" y="342" text-anchor="start">아무도 안에 없으면 들어가려는 스레드 중 하나는 반드시 들어간다</text><rect x="28" y="356" width="14" height="14" rx="2" fill="var(--s3)" fill-opacity="0.55" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="48" y="368" text-anchor="start">유한 대기</text><text class="ink2 sm" x="134" y="368" text-anchor="start">기다리는 스레드가 언젠가는 들어간다 — 새치기가 끝없이 이어지지 않는다</text><text class="ink bold sm" x="28" y="294" text-anchor="start">임계 구역을 지키는 방법이 갖춰야 할 것 셋</text>
</svg>