<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 344" width="780" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">거듭제곱의 빠른 계산</title><desc id="d">지수를 이진법으로 적고 제곱을 되풀이해 만든 값 중 켜진 자리만 곱한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">x¹³ 을 구하는 데 곱셈 다섯 번이면 된다</text><text class="ink2 sm" x="64" y="68" text-anchor="start">13 을 이진법으로 적으면</text><rect x="250" y="52" width="40" height="30" rx="3" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="270" y="72" text-anchor="middle">1</text><text class="ink2 sm" x="270" y="98" text-anchor="middle">8</text><rect x="296" y="52" width="40" height="30" rx="3" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="316" y="72" text-anchor="middle">1</text><text class="ink2 sm" x="316" y="98" text-anchor="middle">4</text><rect x="342" y="52" width="40" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink" x="362" y="72" text-anchor="middle">0</text><text class="ink2 sm" x="362" y="98" text-anchor="middle">2</text><rect x="388" y="52" width="40" height="30" rx="3" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="408" y="72" text-anchor="middle">1</text><text class="ink2 sm" x="408" y="98" text-anchor="middle">1</text><text class="ink sm" x="446" y="72" text-anchor="start">= 8 + 4 + 1</text><text class="ink2 sm" x="446" y="96" text-anchor="start">켜진 자리만 곱한다</text><rect x="56" y="148" width="80" height="40" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="96" y="172" text-anchor="middle">x</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M136 168 L202 168"/><text class="ink2 sm" x="170" y="156" text-anchor="middle">제곱한다</text><rect x="204" y="148" width="80" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="244" y="172" text-anchor="middle">x²</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M284 168 L350 168"/><text class="ink2 sm" x="318" y="156" text-anchor="middle">제곱한다</text><rect x="352" y="148" width="80" height="40" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="392" y="172" text-anchor="middle">x⁴</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M432 168 L498 168"/><text class="ink2 sm" x="466" y="156" text-anchor="middle">제곱한다</text><rect x="500" y="148" width="80" height="40" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="540" y="172" text-anchor="middle">x⁸</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M96 190 L96 240"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M392 190 L392 240"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M540 190 L540 240"/><rect x="190" y="240" width="400" height="42" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.6"/><text class="ink sm" x="390" y="257.5" text-anchor="middle">x⁸ × x⁴ × x¹ = x¹³</text><text class="ink sm" x="390" y="272.5" text-anchor="middle">제곱 3번 + 곱셈 2번</text><text class="ink2 sm" x="390" y="310" text-anchor="middle">모두 5번. 곧이곧대로 열두 번 곱하는 것과 견주면 자릿수가 늘수록 차이가 벌어진다.</text><text class="ink2 sm" x="390" y="330" text-anchor="middle">지수를 반으로 줄이는 재귀이므로 T(n) = T(n/2) + 1, 곧 Θ(log n) 이다</text>
</svg>