oke-width="1"/><text class="ink bold sm" x="705" y="64" text-anchor="middle">3. 합치는 값이 비쌀 때</text><text class="ink2 sm" x="705" y="80" text-anchor="middle">f(n) 이 잎 비용을 눌러 버린다</text><rect x="612" y="108" width="180" height="22" rx="2" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.3"/><text class="ink2 sm" x="800" y="124" text-anchor="start">뿌리 — f(n) = n²</text><rect x="612" y="142" width="92" height="22" rx="2" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.3"/><text class="ink2 sm" x="712" y="158" text-anchor="start">다음 층 합 — n²/2</text><rect x="612" y="176" width="46" height="22" rx="2" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.3"/><text class="ink2 sm" x="666" y="192" text-anchor="start">n²/4</text><rect x="612" y="210" width="24" height="22" rx="2" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.3"/><text class="ink2 sm" x="644" y="226" text-anchor="start">n²/8</text><text class="ink2 sm" x="705" y="252" text-anchor="middle">맨 위 한 번이 전체를 정한다.</text><text class="ink2 sm" x="705" y="272" text-anchor="middle">나누는 수고를 해도 답은 Θ(n²) 그대로다</text><text class="ink2 sm" x="705" y="292" text-anchor="middle">(마스터 정리 셋째 경우)</text><text class="ink2 sm" x="410" y="332" text-anchor="middle">나눌 수 있다고 나누는 것이 이득은 아니다. 세 자리에서 각각 다른 답이 필요하다</text>
</svg>