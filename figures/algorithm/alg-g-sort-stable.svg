<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 348" width="790" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">안정성과 제자리 여부</title><desc id="d">안정 정렬은 키가 같은 원소의 입력 순서를 지키고, 제자리 정렬은 상수 칸만 더 쓴다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="395" y="24" text-anchor="middle">정렬을 고를 때 보는 두 가지 — 같은 값의 앞뒤가 남는가, 남의 자리를 빌리는가</text><rect x="14" y="42" width="452" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="240" y="62" text-anchor="middle">안정성 — 점수가 같은 두 사람의 순서</text><text class="ink2 sm" x="240" y="78" text-anchor="middle">입력에서 박이 이보다 앞에 있었다</text><text class="ink2 sm" x="112" y="114" text-anchor="end">입력</text><rect x="124" y="88" width="66" height="44" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="157" y="112" text-anchor="middle">3</text><text class="ink2 sm" x="157" y="126" text-anchor="middle">박</text><rect x="200" y="88" width="66" height="44" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="233" y="112" text-anchor="middle">1</text><text class="ink2 sm" x="233" y="126" text-anchor="middle">김</text><rect x="276" y="88" width="66" height="44" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="309" y="112" text-anchor="middle">3</text><text class="ink2 sm" x="309" y="126" text-anchor="middle">이</text><rect x="352" y="88" width="66" height="44" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="385" y="112" text-anchor="middle">2</text><text class="ink2 sm" x="385" y="126" text-anchor="middle">최</text><text class="ink2 sm" x="112" y="184" text-anchor="end">안정 정렬</text><rect x="124" y="158" width="66" height="44" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="157" y="182" text-anchor="middle">1</text><text class="ink2 sm" x="157" y="196" text-anchor="middle">김</text><rect x="200" y="158" width="66" height="44" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="233" y="182" text-anchor="middle">2</text><text class="ink2 sm" x="233" y="196" text-anchor="middle">최</text><rect x="276" y="158" width="66" height="44" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="309" y="182" text-anchor="middle">3</text><text class="ink2 sm" x="309" y="196" text-anchor="middle">박</text><rect x="352" y="158" width="66" height="44" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="385" y="182" text-anchor="middle">3</text><text class="ink2 sm" x="385" y="196" text-anchor="middle">이</text><text class="ink2 sm" x="112" y="254" text-anchor="end">불안정 정렬</text><rect x="124" y="228" width="66" height="44" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="157" y="252" text-anchor="middle">1</text><text class="ink2 sm" x="157" y="266" text-anchor="middle">김</text><rect x="200" y="228" width="66" height="44" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="233" y="252" text-anchor="middle">2</text><text class="ink2 sm" x="233" y="266" text-anchor="middle">최</text><rect x="276" y="228" width="66" height="44" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="309" y="252" text-anchor="middle">3</text><text class="ink2 sm" x="309" y="266" text-anchor="middle">이</text><rect x="352" y="228" width="66" height="44" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="385" y="252" text-anchor="middle">3</text><text class="ink2 sm" x="385" y="266" text-anchor="middle">박</text><text class="ink2 sm" x="28" y="292" text-anchor="start">가운데 줄은 박 · 이 순서가 그대로고 아래 줄은 뒤바뀌었다</text><rect x="478" y="42" width="298" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="627" y="62" text-anchor="middle">제자리 여부 — 배열 밖에 얼마나 더 쓰는가</text><text class="ink2 sm" x="627" y="78" text-anchor="middle">원소가 n 개일 때 필요한 추가 칸</text><text class="ink sm" x="494" y="96" text-anchor="start">제자리(in-place) — 삽입 · 힙 · 퀵</text><rect x="496" y="106" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="511" y="124" text-anchor="middle">5</text><rect x="526" y="106" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="541" y="124" text-anchor="middle">2</text><rect x="556" y="106" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="571" y="124" text-anchor="middle">8</text><rect x="586" y="106" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="601" y="124" text-anchor="middle">1</text><rect x="616" y="106" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="631" y="124" text-anchor="middle">9</text><rect x="646" y="106" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="661" y="124" text-anchor="middle">3</text><rect x="676" y="106" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="691" y="124" text-anchor="middle">7</text><rect x="706" y="106" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="721" y="124" text-anchor="middle">4</text><rect x="742" y="106" width="24" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.8"/><text class="ink2 sm" x="754" y="148" text-anchor="middle">상수</text><text class="ink sm" x="494" y="196" text-anchor="start">아닌 것 — 병합 정렬</text><rect x="496" y="206" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="511" y="224" text-anchor="middle">5</text><rect x="526" y="206" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="541" y="224" text-anchor="middle">2</text><rect x="556" y="206" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="571" y="224" text-anchor="middle">8</text><rect x="586" y="206" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="601" y="224" text-anchor="middle">1</text><rect x="616" y="206" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="631" y="224" text-anchor="middle">9</text><rect x="646" y="206" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="661" y="224" text-anchor="middle">3</text><rect x="676" y="206" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="691" y="224" text-anchor="middle">7</text><rect x="706" y="206" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="721" y="224" text-anchor="middle">4</text><rect x="496" y="240" width="30" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><rect x="526" y="240" width="30" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><rect x="556" y="240" width="30" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><rect x="586" y="240" width="30" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><rect x="616" y="240" width="30" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><rect x="646" y="240" width="30" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><rect x="676" y="240" width="30" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><rect x="706" y="240" width="30" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink2 sm" x="748" y="260" text-anchor="middle">n 칸</text><text class="ink2 sm" x="494" y="288" text-anchor="start">메모리가 빠듯하면 이 한 줄이 결정적이다</text><text class="ink2 sm" x="20" y="324" text-anchor="start">안정성이 필요한 까닭: 이름으로 한 번 정렬한 뒤 점수로 안정 정렬하면 점수가 같은 사람은 이름순이 된다.</text><text class="ink2 sm" x="20" y="342" text-anchor="start">불안정 정렬로는 이 두 단계 요령을 쓸 수 없다</text>
</svg>