<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 348" width="792" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">그래프의 기본 용어</title><desc id="d">정점 간선 차수 경로 순환 연결 요소를 한 그림에 표시했다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="396" y="24" text-anchor="middle">이 그림 하나에 이 장의 용어가 거의 다 들어 있다</text><path d="M111.74 125.59 L188.26 94.41" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 105 L204 183" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M110.39 141.06 L189.61 190.94" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M220.62 91.56 L299.38 108.44" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M220.35 204.67 L299.65 227.33" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 137 L420 199" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="96" cy="132" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="96" y="137" text-anchor="middle">v1</text><circle cx="204" cy="88" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="204" y="93" text-anchor="middle">v2</text><circle cx="204" cy="200" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="204" y="205" text-anchor="middle">v3</text><circle cx="316" cy="112" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="316" y="117" text-anchor="middle">v4</text><circle cx="316" cy="232" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="316" y="237" text-anchor="middle">v5</text><circle cx="420" cy="120" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="420" y="125" text-anchor="middle">v6</text><circle cx="420" cy="216" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="420" y="221" text-anchor="middle">v7</text><rect x="60" y="62" width="300" height="208" rx="10" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1" stroke-dasharray="6 5"/><rect x="384" y="84" width="74" height="170" rx="10" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1" stroke-dasharray="6 5"/><text class="ink2 sm" x="210" y="288" text-anchor="middle">연결 요소 1</text><text class="ink2 sm" x="421" y="272" text-anchor="middle">연결 요소 2</text><text class="ink2 sm" x="150" y="60" text-anchor="middle">주황 삼각형이 순환이다</text><text class="ink bold sm" x="482" y="74" text-anchor="start">정점 (vertex)</text><text class="ink2 sm" x="482" y="91" text-anchor="start">동그라미 7개. 집합 V</text><text class="ink bold sm" x="482" y="112" text-anchor="start">간선 (edge)</text><text class="ink2 sm" x="482" y="129" text-anchor="start">선 6개. 집합 E. 이 그래프는 G = (V, E)</text><text class="ink bold sm" x="482" y="150" text-anchor="start">차수 (degree)</text><text class="ink2 sm" x="482" y="167" text-anchor="start">v2 는 3, v4 와 v5 는 1, 붙은 간선 수</text><text class="ink bold sm" x="482" y="188" text-anchor="start">경로 (path)</text><text class="ink2 sm" x="482" y="205" text-anchor="start">v1 → v2 → v4. 같은 정점을 두 번 안 지나면 단순 경로</text><text class="ink bold sm" x="482" y="226" text-anchor="start">순환 (cycle)</text><text class="ink2 sm" x="482" y="243" text-anchor="start">v1 → v2 → v3 → v1. 출발점으로 돌아온다</text><text class="ink bold sm" x="482" y="264" text-anchor="start">연결 요소</text><text class="ink2 sm" x="482" y="281" text-anchor="start">서로 오갈 수 있는 덩어리. 여기서는 2개</text><text class="ink2 sm" x="20" y="324" text-anchor="start">간선 수는 정점 수와 무관하게 정해진다. 정점이 n 개면 간선은 0 개부터 n(n−1)/2 개까지 가능하다.</text><text class="ink2 sm" x="20" y="342" text-anchor="start">연결 요소가 2개라는 것은 v4 에서 v6 으로 가는 길이 아예 없다는 뜻이다</text>
</svg>