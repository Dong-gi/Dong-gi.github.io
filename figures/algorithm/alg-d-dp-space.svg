4" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><text class="ink2 sm" x="427" y="122" text-anchor="middle">직전 줄</text><text class="ink2 sm" x="427" y="198" text-anchor="middle">지금 줄</text><text class="ink2 sm" x="416" y="232" text-anchor="middle">한 줄을 다 채우면 자리를 맞바꾼다</text><text class="ink bold sm" x="416" y="252" text-anchor="middle">공간이 O(W) 로 준다</text><rect x="542" y="46" width="250" height="226" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="667" y="66" text-anchor="middle">줄 하나</text><text class="ink2 sm" x="667" y="82" text-anchor="middle">뒤에서부터 채우면</text><rect x="588" y="142" width="30" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><rect x="618" y="142" width="30" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><rect x="648" y="142" width="30" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><rect x="678" y="142" width="30" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><rect x="708" y="142" width="30" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><rect x="738" y="142" width="30" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M764 200 L594 200"/><text class="ink bold sm" x="678" y="200" text-anchor="middle">오른쪽에서 왼쪽으로</text><text class="ink2 sm" x="647" y="232" text-anchor="middle">앞에서부터 채우면 같은 물건을</text><text class="ink2 sm" x="647" y="252" text-anchor="middle">두 번 넣게 된다 — 흔한 버그다</text><text class="ink2 sm" x="406" y="308" text-anchor="middle">공간을 줄이면 잃는 것이 있다. 표를 지우고 나면 ‘무엇을 골랐는가’ 를 되짚을 수 없다.</text><text class="ink2 sm" x="406" y="328" text-anchor="middle">값만 필요하면 줄이고, 답 자체가 필요하면 