<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" width="800" height="404" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">크루스칼과 프림</title><desc id="d">같은 그래프에서 간선을 고르는 순서가 다르지만 최소신장트리는 같다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="24" text-anchor="middle">고르는 순서가 다르고 결과는 같다 — 둘 다 자르기 성질을 쓰기 때문이다</text><rect x="14" y="42" width="380" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="204" y="62" text-anchor="middle">크루스칼 — 싼 간선부터</text><text class="ink2 sm" x="204" y="78" text-anchor="middle">가중치 순서로 보되 고리를 만들면 버린다</text><path d="M102 106 L186 106" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="144" y="122" text-anchor="middle">1</text><path d="M222 106 L306 106" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="264" y="122" text-anchor="middle">7</text><path d="M84 124 L84 208" fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 bold sm" x="72" y="170" text-anchor="middle">4</text><path d="M204 124 L204 208" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="192" y="170" text-anchor="middle">2</text><path d="M324 124 L324 208" fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 bold sm" x="312" y="170" text-anchor="middle">8</text><path d="M102 226 L186 226" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="144" y="242" text-anchor="middle">3</text><path d="M222 226 L306 226" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="264" y="242" text-anchor="middle">5</text><path d="M96.73 118.73 L191.27 213.27" fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 bold sm" x="127.03" y="186.97" text-anchor="middle">6</text><path d="M191.27 118.73 L96.73 213.27" fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 bold sm" x="127.03" y="153.03" text-anchor="middle">9</text><circle cx="84" cy="106" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="84" y="111" text-anchor="middle">A</text><circle cx="204" cy="106" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="204" y="111" text-anchor="middle">B</text><circle cx="324" cy="106" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="324" y="111" text-anchor="middle">C</text><circle cx="84" cy="226" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="84" y="231" text-anchor="middle">D</text><circle cx="204" cy="226" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="204" y="231" text-anchor="middle">E</text><circle cx="324" cy="226" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="324" y="231" text-anchor="middle">F</text><text class="ink bold sm" x="144" y="97" text-anchor="middle">1째</text><text class="ink bold sm" x="217" y="170" text-anchor="middle">2째</text><text class="ink bold sm" x="144" y="217" text-anchor="middle">3째</text><text class="ink bold sm" x="264" y="217" text-anchor="middle">4째</text><text class="ink bold sm" x="264" y="97" text-anchor="middle">5째</text><rect x="406" y="42" width="380" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="596" y="62" text-anchor="middle">프림 — C 에서 시작해 키운다</text><text class="ink2 sm" x="596" y="78" text-anchor="middle">자란 덩어리에 붙은 간선 중 가장 싼 것</text><path d="M494 106 L578 106" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="536" y="122" text-anchor="middle">1</text><path d="M614 106 L698 106" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="656" y="122" text-anchor="middle">7</text><path d="M476 124 L476 208" fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 bold sm" x="464" y="170" text-anchor="middle">4</text><path d="M596 124 L596 208" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="584" y="170" text-anchor="middle">2</text><path d="M716 124 L716 208" fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 bold sm" x="704" y="170" text-anchor="middle">8</text><path d="M494 226 L578 226" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="536" y="242" text-anchor="middle">3</text><path d="M614 226 L698 226" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 bold sm" x="656" y="242" text-anchor="middle">5</text><path d="M488.73 118.73 L583.27 213.27" fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 bold sm" x="519.03" y="186.97" text-anchor="middle">6</text><path d="M583.27 118.73 L488.73 213.27" fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 bold sm" x="519.03" y="153.03" text-anchor="middle">9</text><circle cx="476" cy="106" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="476" y="111" text-anchor="middle">A</text><circle cx="596" cy="106" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="596" y="111" text-anchor="middle">B</text><circle cx="716" cy="106" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="716" y="111" text-anchor="middle">C</text><circle cx="476" cy="226" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="476" y="231" text-anchor="middle">D</text><circle cx="596" cy="226" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="596" y="231" text-anchor="middle">E</text><circle cx="716" cy="226" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="716" y="231" text-anchor="middle">F</text><text class="ink bold sm" x="656" y="97" text-anchor="middle">1째</text><text class="ink bold sm" x="536" y="97" text-anchor="middle">2째</text><text class="ink bold sm" x="609" y="170" text-anchor="middle">3째</text><text class="ink bold sm" x="536" y="217" text-anchor="middle">4째</text><text class="ink bold sm" x="656" y="217" text-anchor="middle">5째</text><text class="ink2 sm" x="30" y="288" text-anchor="start">버린 간선: 4 (고리) · 6 (고리) · 8 · 9</text><text class="ink2 sm" x="422" y="288" text-anchor="start">덩어리 밖으로 나가는 간선만 후보가 된다</text><text class="ink2 sm" x="20" y="342" text-anchor="start">초록 굵은 선이 최소신장트리다. 간선 5 개 = 정점 6 개 − 1, 무게 합은 1+2+3+5+7 = 18 로 양쪽이 같다.</text><text class="ink2 sm" x="20" y="360" text-anchor="start">크루스칼은 간선을 정렬해 O(E log E), 두 정점이 같은 덩어리인지 묻는 데 union-find 를 쓴다.</text><text class="ink2 sm" x="20" y="378" text-anchor="start">프림은 덩어리에 붙은 간선을 우선순위 큐에 담아 O(E log V) 다. 다익스트라와 거의 같은 코드다.</text><text class="ink2 sm" x="20" y="396" text-anchor="start">가중치가 모두 다르면 최소신장트리는 하나뿐이다. 같은 값이 있으면 여럿일 수 있고 두 방법이 다른 답을 낼 수 있다</text>
</svg>