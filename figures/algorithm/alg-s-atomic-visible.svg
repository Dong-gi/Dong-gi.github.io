<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 404" width="840" height="404" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">원자성과 가시성은 다른 문제다</title><desc id="d">한 핵이 쓴 값이 다른 핵에 보이지 않는 일과, 적은 순서가 지켜지지 않는 일은 원자성으로 풀리지 않는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="420" y="26" text-anchor="middle">고쳐야 할 것이 둘이다 — 나뉘지 않게 하는 것과 남에게 보이게 하는 것</text><rect x="46" y="52" width="372" height="296" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="232" y="74" text-anchor="middle">가시성 — 쓴 값이 아직 남에게 안 보인다</text><rect x="72" y="92" width="140" height="44" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="142" y="110.5" text-anchor="middle">핵 1 의 스레드 A</text><text class="ink sm" x="142" y="125.5" text-anchor="middle">멈춤 = 참 이라 썼다</text><rect x="252" y="92" width="140" height="44" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="322" y="110.5" text-anchor="middle">핵 2 의 스레드 B</text><text class="ink sm" x="322" y="125.5" text-anchor="middle">멈춤 을 계속 읽는다</text><rect x="72" y="154" width="140" height="34" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="142" y="175" text-anchor="middle">자기 캐시: 참</text><rect x="252" y="154" width="140" height="34" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.3"/><text class="ink sm" x="322" y="175" text-anchor="middle">자기 캐시: 거짓</text><path fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)" d="M142 136 L142 150"/><path fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M322 188 L322 136"/><rect x="142" y="216" width="180" height="34" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink sm" x="232" y="237" text-anchor="middle">주 메모리: 거짓</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M142 188 L186 214"/><text class="ink2 sm" x="232" y="268" text-anchor="middle">아직 내려쓰지 않았다</text><text class="ink2 sm" x="232" y="292" text-anchor="middle">B 의 반복문은 영원히 끝나지 않는다.</text><text class="ink2 sm" x="232" y="312" text-anchor="middle">읽기도 쓰기도 각각은 나뉘지 않았는데도 그렇다</text><text class="ink bold sm" x="232" y="336" text-anchor="middle">원자성만으로는 못 고친다</text><rect x="448" y="52" width="372" height="296" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="634" y="74" text-anchor="middle">재배치 — 적은 순서대로 실행되지 않는다</text><text class="ink2 sm" x="478" y="106" text-anchor="start">내가 적은 순서</text><text class="ink2 sm" x="660" y="106" text-anchor="start">실제로 실행될 수 있는 순서</text><rect x="478" y="122" width="150" height="32" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="553" y="142" text-anchor="middle">자료 = 42</text><rect x="478" y="162" width="150" height="32" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="553" y="182" text-anchor="middle">준비됨 = 참</text><rect x="660" y="122" width="150" height="32" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="735" y="142" text-anchor="middle">준비됨 = 참</text><rect x="660" y="162" width="150" height="32" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="735" y="182" text-anchor="middle">자료 = 42</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M634 154 L654 154"/><text class="ink2 sm" x="634" y="226" text-anchor="middle">컴파일러와 CPU 는 ‘한 스레드에서 본 결과가 같으면’</text><text class="ink2 sm" x="634" y="246" text-anchor="middle">순서를 마음대로 바꿀 수 있다. 두 문장 사이에 의존이 없기 때문이다</text><text class="ink2 sm" x="634" y="274" text-anchor="middle">다른 스레드는 준비됨 이 참인데 자료 가 42 가 아닌</text><text class="ink2 sm" x="634" y="294" text-anchor="middle">있을 수 없어 보이는 상태를 본다</text><text class="ink bold sm" x="634" y="322" text-anchor="middle">순서를 지키라고 못 박는 표시가 따로 필요하다</text><text class="ink bold sm" x="420" y="376" text-anchor="middle">락을 걸면 셋이 한꺼번에 해결된다. 상호 배제뿐 아니라 ‘락을 풀 때 내려쓰고 걸 때 다시 읽는다’ 는 약속이 붙어 있기 때문이다</text><text class="ink2 sm" x="420" y="396" text-anchor="middle">락 없이 원자적 연산만 쓰겠다면 이 약속을 손으로 챙겨야 한다. 락-프리 코드가 어려운 이유가 여기에 있다</text>
</svg>