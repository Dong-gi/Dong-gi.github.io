<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 432" width="844" height="432" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">RSA 의 뼈대</title><desc id="d">소수 둘로 N 과 φ 를 만들고 e·d ≡ 1 (mod φ) 인 두 지수를 정하면 암호화와 복호화가 서로를 되돌린다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="422" y="26" text-anchor="middle">RSA — 아주 작은 수로 한 번 돌려 본다</text><rect x="40" y="52" width="190" height="92" rx="5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="52" y="74" text-anchor="start">① 소수 두 개를 고른다</text><text class="ink2 sm" x="52" y="98" text-anchor="start">p = 5,  q = 11</text><text class="ink2 sm" x="52" y="118" text-anchor="start">실제로는 각각 1000자리쯤 된다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M230 98 L240 98"/><rect x="242" y="52" width="190" height="92" rx="5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="254" y="74" text-anchor="start">② 곱과 φ 를 구한다</text><text class="ink2 sm" x="254" y="98" text-anchor="start">N = p·q = 55</text><text class="ink2 sm" x="254" y="118" text-anchor="start">φ(N) = (p−1)(q−1) = 40</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M432 98 L442 98"/><rect x="444" y="52" width="190" height="92" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="456" y="74" text-anchor="start">③ 두 지수를 정한다</text><text class="ink2 sm" x="456" y="98" text-anchor="start">e = 3  (φ 와 서로소)</text><text class="ink2 sm" x="456" y="118" text-anchor="start">d = 27  (e·d ≡ 1 mod φ)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M634 98 L644 98"/><rect x="646" y="52" width="190" height="92" rx="5" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="658" y="74" text-anchor="start">④ 공개하고 감춘다</text><text class="ink2 sm" x="658" y="98" text-anchor="start">공개키 (N, e) = (55, 3)</text><text class="ink2 sm" x="658" y="118" text-anchor="start">비밀키 d = 27. p, q 는 지운다</text><rect x="72" y="176" width="130" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink sm" x="137" y="200" text-anchor="middle">평문 M = 7</text><path fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)" d="M202 196 L250 196"/><text class="ink2 sm" x="226" y="188" text-anchor="middle">공개키로</text><rect x="252" y="176" width="178" height="40" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="341" y="200" text-anchor="middle">7³ mod 55 = 13</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M430 196 L478 196"/><text class="ink2 sm" x="454" y="188" text-anchor="middle">비밀키로</text><rect x="480" y="176" width="190" height="40" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="575" y="200" text-anchor="middle">13²⁷ mod 55 = 7</text><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M670 196 L706 196"/><rect x="708" y="176" width="96" height="40" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="756" y="200" text-anchor="middle">평문으로</text><text class="ink2 sm" x="72" y="238" text-anchor="start">누구나 할 수 있다 — 공개키만 있으면 된다</text><text class="ink2 sm" x="480" y="238" text-anchor="start">d 를 아는 사람만 할 수 있다</text><path d="M40 262 L804 262" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="40" y="286" text-anchor="start">왜 되돌아오는가</text><text class="ink2 sm" x="40" y="308" text-anchor="start">e·d ≡ 1 (mod φ) 이므로 어떤 정수 k 에 대해 e·d = 1 + kφ 다.</text><text class="ink2 sm" x="40" y="328" text-anchor="start">그러면 M 을 e·d 제곱한 것은 M 을 1 + kφ 제곱한 것이고, 그것은 M × (M 을 φ 제곱한 것)을 k 제곱한 것이다.</text><text class="ink2 sm" x="40" y="348" text-anchor="start">오일러 정리가 M 을 φ 제곱하면 N 으로 나눈 나머지가 1 임을 보장하므로 남는 것은 M 뿐이다.</text><text class="ink2 sm" x="40" y="368" text-anchor="start">페르마 소정리(소수 p 에 대해 M 을 p−1 제곱하면 나머지가 1)를 소수 아닌 N 으로 넓힌 것이 오일러 정리다.</text><text class="ink bold sm" x="40" y="396" text-anchor="start">무엇에 기대고 있는가</text><text class="ink2 sm" x="196" y="396" text-anchor="start">N 을 알아도 p 와 q 를 되찾기 어렵다는 것. 그것을 알면 φ 가 나오고 φ 를 알면 d 가 나온다</text><text class="ink bold sm" x="40" y="418" text-anchor="start">실제 구현은 다르다</text><text class="ink2 sm" x="196" y="418" text-anchor="start">여기 적은 그대로 쓰면 안전하지 않다. 평문에 무작위 채움을 섞는 규격을 반드시 함께 쓴다</text>
</svg>