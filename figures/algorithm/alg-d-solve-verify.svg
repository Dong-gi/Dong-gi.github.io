<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 372" width="828" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">푸는 것과 답을 보고 확인하는 것</title><desc id="d">부분집합 합 문제는 찾는 데 2의 n 제곱 가지를 훑어야 하지만 답을 받으면 덧셈 한 번으로 확인된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="414" y="26" text-anchor="middle">문제: {3, 34, 4, 12, 5, 2} 에서 몇 개를 골라 합을 9 로 만들 수 있는가</text><rect x="20" y="48" width="386" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="213" y="68" text-anchor="middle">푼다 — 답을 찾아내야 한다</text><text class="ink2 sm" x="213" y="84" text-anchor="middle">고르는 방법이 2⁶ = 64 가지</text><rect x="72" y="100" width="46" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="95" y="121" text-anchor="middle">3</text><rect x="118" y="100" width="46" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="141" y="121" text-anchor="middle">34</text><rect x="164" y="100" width="46" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="187" y="121" text-anchor="middle">4</text><rect x="210" y="100" width="46" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="233" y="121" text-anchor="middle">12</text><rect x="256" y="100" width="46" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="279" y="121" text-anchor="middle">5</text><rect x="302" y="100" width="46" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="325" y="121" text-anchor="middle">2</text><text class="ink2 sm" x="213" y="156" text-anchor="middle">넣는다 · 뺀다 를 여섯 번 정한다</text><circle cx="213" cy="176" r="3.5" fill="var(--ink2)"/><path d="M213 176 L155.5 202" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M213 176 L270.5 202" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="155.5" cy="202" r="3.5" fill="var(--ink2)"/><path d="M155.5 202 L126.75 228" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M155.5 202 L184.25 228" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270.5" cy="202" r="3.5" fill="var(--ink2)"/><path d="M270.5 202 L241.75 228" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M270.5 202 L299.25 228" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="126.75" cy="228" r="3.5" fill="var(--grid)"/><circle cx="184.25" cy="228" r="3.5" fill="var(--grid)"/><circle cx="241.75" cy="228" r="3.5" fill="var(--grid)"/><circle cx="299.25" cy="228" r="3.5" fill="var(--grid)"/><text class="ink2 sm" x="213" y="254" text-anchor="middle">…  가지가 두 배씩 벌어져 잎이 64 개</text><text class="ink bold sm" x="213" y="280" text-anchor="middle">원소가 100 개면 2¹⁰⁰ 가지다</text><rect x="422" y="48" width="386" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="615" y="68" text-anchor="middle">확인한다 — 답을 받아 검사만 한다</text><text class="ink2 sm" x="615" y="84" text-anchor="middle">더하기 한 번이면 끝</text><text class="ink2 sm" x="615" y="106" text-anchor="middle">누가 답이라며 이것을 내민다 (증명서)</text><rect x="568" y="116" width="46" height="32" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink" x="591" y="137" text-anchor="middle">4</text><rect x="614" y="116" width="46" height="32" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink" x="637" y="137" text-anchor="middle">5</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M615 152 L615 176"/><rect x="514" y="178" width="200" height="36" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><text class="ink sm" x="614" y="200" text-anchor="middle">4 + 5 = 9 인가</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M615 216 L615 238"/><rect x="544" y="240" width="140" height="34" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.7"/><text class="ink sm" x="614" y="261" text-anchor="middle">그렇다</text><text class="ink bold sm" x="615" y="292" text-anchor="middle">원소가 100 개여도 덧셈 100 번 안쪽이다</text><path d="M40 322 L788 322" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="414" y="344" text-anchor="middle">P 는 왼쪽이 다항 시간인 문제들, NP 는 오른쪽이 다항 시간인 문제들이다.</text><text class="ink2 sm" x="414" y="364" text-anchor="middle">‘답이 없다’ 를 확인하는 데는 내밀 증명서가 없다는 점을 눈여겨보라 — 그래서 NP 는 예 · 아니오가 대칭이 아니다</text>
</svg>