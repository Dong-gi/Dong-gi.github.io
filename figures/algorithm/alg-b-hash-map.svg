<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">해시 함수가 키를 배열 첨자로 바꾼다</title><desc id="d">키를 해시 함수에 넣으면 버킷 번호가 나오고 서로 다른 키가 같은 번호를 받으면 충돌이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="24" text-anchor="middle">찾아다니는 대신 자리를 계산한다 — 그 계산기가 해시 함수다</text><rect x="40" y="76" width="90" height="32" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="85" y="97" text-anchor="middle">‘사과’</text><rect x="40" y="122" width="90" height="32" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="85" y="143" text-anchor="middle">‘포도’</text><rect x="40" y="168" width="90" height="32" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="85" y="189" text-anchor="middle">‘감귤’</text><rect x="40" y="214" width="90" height="32" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="85" y="235" text-anchor="middle">‘배’</text><text class="ink2 bold sm" x="85" y="62" text-anchor="middle">키</text><rect x="200" y="90" width="120" height="152" rx="6" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold" x="260" y="156" text-anchor="middle">h(키)</text><text class="ink2 sm" x="260" y="178" text-anchor="middle">해시 함수</text><rect x="470" y="66" width="130" height="34" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.7"/><text class="ink2 sm" x="460" y="88" text-anchor="end">0</text><rect x="470" y="100" width="130" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="460" y="122" text-anchor="end">1</text><rect x="470" y="134" width="130" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="460" y="156" text-anchor="end">2</text><rect x="470" y="168" width="130" height="34" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.7"/><text class="ink2 sm" x="460" y="190" text-anchor="end">3</text><rect x="470" y="202" width="130" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="460" y="224" text-anchor="end">4</text><rect x="470" y="236" width="130" height="34" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.7"/><text class="ink2 sm" x="460" y="258" text-anchor="end">5</text><text class="ink2 bold sm" x="535" y="52" text-anchor="middle">버킷 배열 (칸 6개)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M134 92 L196 110"/><path d="M324 110 C390 110 400 185 444 185" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M134 138 L196 148"/><path d="M324 148 C390 148 400 83 444 83" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M134 184 L196 186"/><path d="M324 186 C390 186 400 253 444 253" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M134 230 L196 224"/><path d="M324 224 C390 224 400 185 444 185" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink2 bold sm" x="354" y="292" text-anchor="middle">‘사과’ 와 ‘배’ 가 같은 3번 칸으로 갔다 — 충돌</text><text class="ink2 sm" x="26" y="314" text-anchor="start">키가 무엇이든 h 는 0 부터 5 사이의 수 하나를 내놓는다. 그 수가 곧 배열의 첨자이므로 넣기도 찾기도 한 번에 끝난다.</text><text class="ink2 sm" x="26" y="332" text-anchor="start">대신 키의 종류는 칸 수보다 훨씬 많으므로 서로 다른 키가 같은 칸을 받는 일이 반드시 생긴다</text>
</svg>