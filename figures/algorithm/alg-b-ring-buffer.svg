<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">원형 버퍼</title><desc id="d">배열의 끝에서 처음으로 돌아가는 두 개의 표시로 큐를 만든다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="24" text-anchor="middle">배열의 끝에 닿으면 처음으로 돌아간다 — 나머지 연산 하나로 끝난다</text><circle cx="156" cy="86" r="18" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="156" y="91" text-anchor="middle">0</text><circle cx="219.64" cy="112.36" r="18" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="219.64" y="117.36" text-anchor="middle">1</text><circle cx="246" cy="176" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="246" y="181" text-anchor="middle">2</text><circle cx="219.64" cy="239.64" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="219.64" y="244.64" text-anchor="middle">3</text><circle cx="156" cy="266" r="18" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="156" y="271" text-anchor="middle">4</text><circle cx="92.36" cy="239.64" r="18" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="92.36" y="244.64" text-anchor="middle">5</text><circle cx="66" cy="176" r="18" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="66" y="181" text-anchor="middle">6</text><circle cx="92.36" cy="112.36" r="18" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="92.36" y="117.36" text-anchor="middle">7</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M61.25 270.75 L76.8 255.2"/><text class="ink bold sm" x="55.25" y="274.75" text-anchor="end">앞</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M290 176 L268 176"/><text class="ink bold sm" x="296" y="180" text-anchor="start">뒤</text><text class="ink2 sm" x="156" y="170" text-anchor="middle">칸 8개</text><text class="ink2 sm" x="156" y="190" text-anchor="middle">든 것 5개</text><text class="ink bold sm" x="372" y="130" text-anchor="start">같은 상태를 배열로 펴 보면</text><rect x="372" y="190" width="44" height="40" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="394" y="215" text-anchor="middle">w</text><text class="ink2 sm" x="394" y="244" text-anchor="middle">0</text><rect x="416" y="190" width="44" height="40" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="438" y="215" text-anchor="middle">x</text><text class="ink2 sm" x="438" y="244" text-anchor="middle">1</text><rect x="460" y="190" width="44" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="482" y="244" text-anchor="middle">2</text><rect x="504" y="190" width="44" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="526" y="244" text-anchor="middle">3</text><rect x="548" y="190" width="44" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="570" y="244" text-anchor="middle">4</text><rect x="592" y="190" width="44" height="40" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="614" y="215" text-anchor="middle">s</text><text class="ink2 sm" x="614" y="244" text-anchor="middle">5</text><rect x="636" y="190" width="44" height="40" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="658" y="215" text-anchor="middle">t</text><text class="ink2 sm" x="658" y="244" text-anchor="middle">6</text><rect x="680" y="190" width="44" height="40" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="702" y="215" text-anchor="middle">u</text><text class="ink2 sm" x="702" y="244" text-anchor="middle">7</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M614 162 L614 184"/><text class="ink bold sm" x="614" y="156" text-anchor="middle">앞 = 5</text><path fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)" d="M482 162 L482 184"/><text class="ink bold sm" x="482" y="156" text-anchor="middle">뒤 = 2</text><text class="ink2 sm" x="372" y="274" text-anchor="start">든 값이 두 토막으로 보이지만 고리 위에서는 이어져 있다</text><text class="ink2 sm" x="26" y="348" text-anchor="start">넣기: 뒤 자리에 쓰고 뒤 ← (뒤 + 1) mod 8.   빼기: 앞 자리를 읽고 앞 ← (앞 + 1) mod 8.</text><text class="ink2 sm" x="26" y="368" text-anchor="start">두 연산 모두 O(1) 이고 원소를 옮기는 일이 없다. 큐를 배열 하나로 만들 때 쓰는 표준 수법이다.</text><text class="ink2 sm" x="26" y="388" text-anchor="start">가득 찬 상태와 텅 빈 상태가 둘 다 ‘앞 = 뒤’ 로 보이므로, 개수를 따로 세거나 한 칸을 비워 둔다</text>
</svg>