<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">캐시 지역성 — 붙어 있는 것이 빠른 이유</title><desc id="d">메모리는 줄 단위로 옮겨지므로 연속된 배열은 한 줄에 여러 값이 담기고 흩어진 노드는 그렇지 않다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="380" y="24" text-anchor="middle">메모리는 한 칸씩이 아니라 한 줄씩 퍼 온다 — 그래서 붙어 있는 편이 빠르다</text><text class="ink bold sm" x="26" y="58" text-anchor="start">배열을 앞에서 뒤로 훑을 때</text><rect x="26" y="96" width="42" height="34" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><rect x="68" y="96" width="42" height="34" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><rect x="110" y="96" width="42" height="34" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><rect x="152" y="96" width="42" height="34" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><rect x="194" y="96" width="42" height="34" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><rect x="236" y="96" width="42" height="34" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><rect x="278" y="96" width="42" height="34" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><rect x="320" y="96" width="42" height="34" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><rect x="362" y="96" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="404" y="96" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="446" y="96" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="488" y="96" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="530" y="96" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="572" y="96" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="614" y="96" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="656" y="96" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="24" y="92" width="340" height="42" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.6" stroke-dasharray="5 4"/><text class="ink2 sm" x="194" y="82" text-anchor="middle">한 번 퍼 오면 여덟 칸이 함께 온다</text><text class="ink2 sm" x="530" y="82" text-anchor="middle">다음 줄</text><text class="ink2 sm" x="26" y="156" text-anchor="start">느린 메모리를 건드리는 것은 여덟 칸에 한 번뿐이다. 나머지 일곱 번은 이미 가까이 와 있는 값을 쓴다</text><text class="ink bold sm" x="26" y="208" text-anchor="start">연결 리스트를 앞에서 뒤로 훑을 때</text><rect x="26" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="68" y="226" width="42" height="34" rx="2" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.6"/><rect x="110" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="152" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="194" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="236" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="278" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="320" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="362" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="404" y="226" width="42" height="34" rx="2" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.6"/><rect x="446" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="488" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="530" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="572" y="226" width="42" height="34" rx="2" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.6"/><rect x="614" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="656" y="226" width="42" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="24" y="222" width="340" height="42" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="360" y="222" width="340" height="42" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink2 sm" x="26" y="286" text-anchor="start">노드가 흩어져 있으면 한 줄을 퍼 와도 쓸 값이 하나뿐이다. 같은 개수를 훑어도 느린 메모리를 훨씬 자주 건드린다</text><text class="ink2 sm" x="26" y="332" text-anchor="start">복잡도는 둘 다 O(n) 이지만 실제 시간은 몇 배씩 차이 난다. 점근 표기가 감추는 상수가 여기에 들어 있다</text>
</svg>