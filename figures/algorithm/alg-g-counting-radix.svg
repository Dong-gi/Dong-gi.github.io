ddle">3</text><rect x="622" y="186" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="640" y="204" text-anchor="middle">839</text><text class="ink2 bold sm" x="640" y="226" text-anchor="middle">3</text><rect x="662" y="186" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="680" y="204" text-anchor="middle">355</text><text class="ink2 bold sm" x="680" y="226" text-anchor="middle">5</text><rect x="702" y="186" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="720" y="204" text-anchor="middle">457</text><text class="ink2 bold sm" x="720" y="226" text-anchor="middle">5</text><rect x="742" y="186" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="760" y="204" text-anchor="middle">657</text><text class="ink2 bold sm" x="760" y="226" text-anchor="middle">5</text><text class="ink2 sm" x="494" y="255" text-anchor="end">100의 자리</text><rect x="502" y="238" width="36" height="26" rx="2" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text class="ink sm" x="520" y="256" text-anchor="middle">329</text><text class="ink2 bold sm" x="520" y="278" text-anchor="middle">3</text><rect x="542" y="238" width="36" height="26" rx="2" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text class="ink sm" x="560" y="256" text-anchor="middle">355</text><text class="ink2 bold sm" x="560" y="278" text-anchor="middle">3</text><rect x="582" y="238" width="36" height="26" rx="2" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text class="ink sm" x="600" y="256" text-anchor="middle">436</text><text class="ink2 bold sm" x="600" y="278" text-anchor="middle">4</text><rect x="622" y="238" width="36" height="26" rx="2" fill="var(--