<text class="ink bold" x="400" y="24" text-anchor="middle">견주지 않고 세거나 나눠 담는다 — 그래서 n log n 벽 아래로 내려간다</text><rect x="14" y="42" width="386" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="207" y="62" text-anchor="middle">계수 정렬 — 값을 첨자로 쓴다</text><text class="ink2 sm" x="207" y="78" text-anchor="middle">값의 범위가 0 부터 5 까지인 것을 안다</text><text class="ink2 sm" x="28" y="96" text-anchor="start">입력</text><rect x="74" y="80" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="89" y="98" text-anchor="middle">2</text><rect x="104" y="80" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="119" y="98" text-anchor="middle">5</text><rect x="134" y="80" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="149" y="98" text-anchor="middle">3</text><rect x="164" y="80" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="179" y="98" text-anchor="middle">0</text><rect x="194" y="80" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="209" y="98" text-anchor="middle">2</text><rect x="224" y="80" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="239" y="98" text-anchor="middle">3</text><rect x="254" y="80" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="269" y="98" text-anchor="middle">0</text><rect x="284" y="80" width="30" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="299" y="98" text-anchor="middle">3</text><text class="ink2 sm" x="28" y="152" text-anchor="start">개수</text><rect x="74" y="136" width="40" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="94" y="154" text-anchor="middle">2</text><text class="ink2 sm" x="94" y="176" text-anchor="middle">0</text><rect x="114" y="136" width="40" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="134" y="154" text-anchor="middle">0</text><text class="ink2 sm" x="134" y="176" text-anchor="middle">1</text><rect x="154" y="136" width="40" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="174" y="154" text-anchor="middle">2</text><text class="ink2 sm" x="174" y="176" text-anchor="middle">2</text><rect x="194" y="136" width="40" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="214" y="154" text-anchor="middle">3</text><text class="ink2 sm" x="214" y="176" text-anchor="middle">3</text><rect x="234" y="136" width="40" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="254" y="154" text-anchor="middle">0</text><text class="ink2 sm" x="254" y="176" text-anchor="middle">4</text><rect x="274" y="136" width="40" height="26" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="294" y="154" text-anchor="middle">1</text><text class="ink2 sm" x="294" y="176" text-anchor="middle">5</text><text class="ink2 sm" x="324" y="152" text-anchor="start">값</text><text class="ink2 sm" x="324" y="174" text-anchor="start">첨자</text><text class="ink2 sm" x="28" y="226" text-anchor="start">결과</text><rect x="74" y="210" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="89" y="228" text-anchor="middle">0</text><rect x="104" y="210" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="119" y="228" text-anchor="middle">0</text><rect x="134" y="210" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="149" y="228" text-anchor="middle">2</text><rect x="164" y="210" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="179" y="228" text-anchor="middle">2</text><rect x="194" y="210" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="209" y="228" text-anchor="middle">3</text><rect x="224" y="210" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="239" y="228" text-anchor="middle">3</text><rect x="254" y="210" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="269" y="228" text-anchor="middle">3</text><rect x="284" y="210" width="30" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="299" y="228" text-anchor="middle">5</text><text class="ink2 sm" x="28" y="264" text-anchor="start">개수를 앞에서부터 누적하면 각 값이 결과의</text><text class="ink2 sm" x="28" y="282" text-anchor="start">몇 번째 칸부터 들어갈지가 정해진다. O(n + k)</text><text class="ink2 sm" x="28" y="300" text-anchor="start">값의 범위 k 가 크면 개수 배열이 그만큼 커진다</text><rect x="412" y="42" width="374" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="599" y="62" text-anchor="middle">기수 정렬 — 낮은 자리부터 안정 정렬</text><text class="ink2 sm" x="599" y="78" text-anchor="middle">자릿수 3 이면 세 번 훑는다</text><text class="ink2 sm" x="494" y="99" text-anchor="end">입력</text><rect x="502" y="82" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="520" y="100" text-anchor="middle">329</text><rect x="542" y="82" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="560" y="100" text-anchor="middle">457</text><rect x="582" y="82" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="600" y="100" text-anchor="middle">657</text><rect x="622" y="82" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="640" y="100" text-anchor="middle">839</text><rect x="662" y="82" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="680" y="100" text-anchor="middle">436</text><rect x="702" y="82" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="720" y="100" text-anchor="middle">720</text><rect x="742" y="82" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="760" y="100" text-anchor="middle">355</text><text class="ink2 sm" x="494" y="151" text-anchor="end">1의 자리</text><rect x="502" y="134" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="520" y="152" text-anchor="middle">720</text><text class="ink2 bold sm" x="520" y="174" text-anchor="middle">0</text><rect x="542" y="134" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="560" y="152" text-anchor="middle">355</text><text class="ink2 bold sm" x="560" y="174" text-anchor="middle">5</text><rect x="582" y="134" width="36" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="600" 