<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">얼마를 그냥 흘려보내야 하는가 — 후보 100명일 때</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M92 272 L624 272"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M92 272 L92 46"/><path d="M92 272 L92 276" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="92" y="289" text-anchor="middle">0</text><path d="M196 272 L196 276" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="196" y="289" text-anchor="middle">0.2</text><path d="M300 272 L300 276" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="300" y="289" text-anchor="middle">0.4</text><path d="M404 272 L404 276" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="404" y="289" text-anchor="middle">0.6</text><path d="M508 272 L508 276" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="508" y="289" text-anchor="middle">0.8</text><path d="M612 272 L612 276" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="612" y="289" text-anchor="middle">1</text><path d="M88 224.44 L92 224.44" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="84" y="228.44" text-anchor="end">0.1</text><path d="M88 176.89 L92 176.89" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="84" y="180.89" text-anchor="end">0.2</text><path d="M88 129.33 L92 129.33" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="84" y="133.33" text-anchor="end">0.3</text><path d="M88 81.78 L92 81.78" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="84" y="85.78" text-anchor="end">0.4</text><text class="ink2 sm" x="628" y="277" text-anchor="start">흘려보내는 비율 r/n</text><text class="ink2 sm" x="88" y="40" text-anchor="middle">최고를 뽑을 확률</text><path d="M102.4 232.27 L107.6 219.54 L112.8 208.39 L118 198.43 L123.2 189.42 L128.4 181.21 L133.6 173.67 L138.8 166.73 L144 160.32 L149.2 154.38 L154.4 148.88 L159.6 143.77 L164.8 139.03 L170 134.63 L175.2 130.54 L180.4 126.75 L185.6 123.24 L190.8 120 L196 117 L201.2 114.25 L206.4 111.72 L211.6 109.4 L216.8 107.3 L222 105.39 L227.2 103.67 L232.4 102.13 L237.6 100.77 L242.8 99.58 L248 98.56 L253.2 97.69 L258.4 96.98 L263.6 96.41 L268.8 95.99 L274 95.71 L279.2 95.56 L284.4 95.55 L289.6 95.66 L294.8 95.9 L300 96.27 L305.2 96.75 L310.4 97.34 L315.6 98.05 L320.8 98.88 L326 99.8 L331.2 100.84 L336.4 101.98 L341.6 103.22 L346.8 104.55 L352 105.99 L357.2 107.52 L362.4 109.14 L367.6 110.86 L372.8 112.66 L378 114.56 L383.2 116.54 L388.4 118.6 L393.6 120.75 L398.8 122.98 L404 125.29 L409.2 127.68 L414.4 130.15 L419.6 132.69 L424.8 135.31 L430 138 L435.2 140.77 L440.4 143.61 L445.6 146.52 L450.8 149.5 L456 152.55 L461.2 155.67 L466.4 158.85 L471.6 162.1 L476.8 165.42 L482 168.8 L487.2 172.24 L492.4 175.75 L497.6 179.31 L502.8 182.94 L508 186.63 L513.2 190.38 L518.4 194.18 L523.6 198.05 L528.8 201.97 L534 205.95 L539.2 209.98 L544.4 214.07 L549.6 218.22 L554.8 222.42 L560 226.67 L565.2 230.97 L570.4 235.33 L575.6 239.74 L580.8 244.2 L586 248.71 L591.2 253.27 L596.4 257.88 L601.6 262.54 L606.8 267.24" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M283.3 272 L283.3 72.27" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M92 97.05 L612 97.05" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><circle cx="284.4" cy="95.55" r="5" fill="var(--s2)"/><text class="ink bold sm" x="293.3" y="67.51" text-anchor="start">1/e ≈ 0.368</text><text class="ink2 sm" x="618" y="101.05" text-anchor="start">≈ 0.368</text><text class="ink bold sm" x="296.4" y="85.55" text-anchor="start">봉우리 r = 37</text><path d="M92 267.24 L612 267.24" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="497.6" y="258.24" text-anchor="middle">아무나 한 명 찍으면 1/100</text><text class="ink2 sm" x="92" y="304" text-anchor="start">왼쪽 끝: 너무 일찍 멈추면 기준이 없어 아무나 뽑게 된다.</text><text class="ink2 sm" x="92" y="324" text-anchor="start">오른쪽 끝: 너무 오래 보면 최고가 이미 지나가 버려 아무도 못 뽑는다.</text><text class="ink bold sm" x="92" y="346" text-anchor="start">봉우리가 1/e 자리에 있고 그때의 성공 확률도 1/e 다. 사람 수가 늘어도 이 값은 변하지 않는다</text>
</svg>