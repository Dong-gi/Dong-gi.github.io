<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 802 418" width="802" height="418" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">스택과 큐가 곧 DFS 와 BFS 다</title><desc id="d">같은 그래프에서 프런티어를 스택으로 쓰면 깊이 우선, 큐로 쓰면 너비 우선이 된다</desc>
