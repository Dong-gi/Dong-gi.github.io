xt><rect x="558" y="226" width="34" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="575" y="244" text-anchor="middle">4</text><rect x="592" y="226" width="34" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="609" y="244" text-anchor="middle">9</text><rect x="626" y="226" width="34" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="643" y="244" text-anchor="middle">16</text><text class="ink2 sm" x="444" y="284" text-anchor="end">5회</text><rect x="456" y="266" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="473" y="284" text-anchor="middle">1</text><rect x="490" y="266" width="34" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="507" y="284" text-anchor="middle">2</text><rect x="524" y="266" width="34" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="541" y="284" text-anchor="middle">3</text><rect x="558" y="266" width="34" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="575" y="284" text-anchor="middle">4</text><rect x="592" y="266" width="34" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="609" y="284" text-anchor="middle">9</text><rect x="626" y="266" width="34" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="643" y="284" text-anchor="middle">16</text><text class="ink2 sm" x="676" y="58" text-anchor="middle">정렬 완료 구간</text><text class="ink2 sm" x="20" y="350" text-anchor="start">힙 만들기 O(n) 에 꺼내기 n 번을 더한다. 꺼낼 때마다 내리기가 O(log n) 이므로 전체 O(n log n) 이다.</text><text class="ink2 sm" x="20" y="368" text-anchor="start">배열 한 개 안에서 앞은 힙, 뒤는 정렬 완료로 쓰므로 추가 칸이 상수다 — 제자리 정렬이다</text>
</svg>