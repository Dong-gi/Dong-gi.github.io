<text class="ink bold" x="391" y="24" text-anchor="middle">뿌리를 맨 뒤와 바꾸고 힙을 하나 줄인다 — 정렬된 구간이 뒤에서 자란다</text><path d="M159.74 94.94 L120.26 137.06" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180.26 94.94 L219.74 137.06" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M103.29 161.42 L84.71 198.58" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M116.71 161.42 L135.29 198.58" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M223.29 161.42 L204.71 198.58" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170" cy="84" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="170" y="89" text-anchor="middle">16</text><circle cx="110" cy="148" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="110" y="153" text-anchor="middle">4</text><circle cx="230" cy="148" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="230" y="153" text-anchor="middle">9</text><circle cx="78" cy="212" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="78" y="217" text-anchor="middle">2</text><circle cx="142" cy="212" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="142" y="217" text-anchor="middle">1</text><circle cx="198" cy="212" r="15" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="198" y="217" text-anchor="middle">3</text><circle cx="170" cy="84" r="15" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="2"/><text class="ink" x="170" y="89" text-anchor="middle">16</text><circle cx="198" cy="212" r="15" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/><text class="ink" x="198" y="217" text-anchor="middle">3</text><path d="M156 70 C 96 34, 268 250, 210 226" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ar2)"/><text class="ink2 sm" x="20" y="262" text-anchor="start">6장에서 만든 최대 힙 [16 4 9 2 1 3]</text><text class="ink2 sm" x="20" y="280" text-anchor="start">뿌리 16 과 맨 뒤 3 을 바꾸면 16 은 제자리가 된다</text><text class="ink2 sm" x="20" y="298" text-anchor="start">남은 다섯 개에서 3 을 내리면 다시 힙이다</text><text class="ink2 sm" x="444" y="84" text-anchor="end">힙 완성</text><rect x="456" y="66" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="473" y="84" text-anchor="middle">16</text><rect x="490" y="66" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="507" y="84" text-anchor="middle">4</text><rect x="524" y="66" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="541" y="84" text-anchor="middle">9</text><rect x="558" y="66" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="575" y="84" text-anchor="middle">2</text><rect x="592" y="66" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="609" y="84" text-anchor="middle">1</text><rect x="626" y="66" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="643" y="84" text-anchor="middle">3</text><text class="ink2 sm" x="444" y="124" text-anchor="end">1회</text><rect x="456" y="106" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="473" y="124" text-anchor="middle">9</text><rect x="490" y="106" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="507" y="124" text-anchor="middle">4</text><rect x="524" y="106" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="541" y="124" text-anchor="middle">3</text><rect x="558" y="106" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="575" y="124" text-anchor="middle">2</text><rect x="592" y="106" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="609" y="124" text-anchor="middle">1</text><rect x="626" y="106" width="34" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="643" y="124" text-anchor="middle">16</text><text class="ink2 sm" x="444" y="164" text-anchor="end">2회</text><rect x="456" y="146" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="473" y="164" text-anchor="middle">4</text><rect x="490" y="146" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="507" y="164" text-anchor="middle">2</text><rect x="524" y="146" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="541" y="164" text-anchor="middle">3</text><rect x="558" y="146" width="34" height="26" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="575" y="164" text-anchor="middle">1</text><rect x="592" y="146" width="34" height="26" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="609" y="164" text-anchor="middle">9</text><rect x="626" y="146" width="34" h