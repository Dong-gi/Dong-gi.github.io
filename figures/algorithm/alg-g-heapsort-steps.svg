<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 376" width="782" height="376" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">힙 정렬을 한 단계씩</title><desc id="d">뿌리와 맨 뒤를 바꾸고 힙 크기를 하나 줄이며 내리기를 되풀이한다</desc>
