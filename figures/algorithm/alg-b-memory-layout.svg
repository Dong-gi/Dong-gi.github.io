<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 400" width="770" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">배열의 연속 메모리와 연결 리스트의 흩어진 메모리</title><desc id="d">배열은 주소 계산으로 곧바로 접근하고 연결 리스트는 화살표를 차례로 따라가야 한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="385" y="24" text-anchor="middle">같은 다섯 값을 담아도 메모리에 놓이는 모양이 다르다</text><text class="ink bold sm" x="26" y="56" text-anchor="start">배열: 한 덩어리로 붙어 있다</text><rect x="26" y="84" width="74" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="63" y="109" text-anchor="middle">17</text><text class="ink2 sm" x="63" y="138" text-anchor="middle">1000</text><rect x="100" y="84" width="74" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="137" y="109" text-anchor="middle">4</text><text class="ink2 sm" x="137" y="138" text-anchor="middle">1004</text><rect x="174" y="84" width="74" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="211" y="109" text-anchor="middle">9</text><text class="ink2 sm" x="211" y="138" text-anchor="middle">1008</text><rect x="248" y="84" width="74" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="285" y="109" text-anchor="middle">23</text><text class="ink2 sm" x="285" y="138" text-anchor="middle">1012</text><rect x="322" y="84" width="74" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="359" y="109" text-anchor="middle">8</text><text class="ink2 sm" x="359" y="138" text-anchor="middle">1016</text><text class="ink2 sm" x="63" y="75" text-anchor="middle">[0]</text><text class="ink2 sm" x="137" y="75" text-anchor="middle">[1]</text><text class="ink2 sm" x="211" y="75" text-anchor="middle">[2]</text><text class="ink2 sm" x="285" y="75" text-anchor="middle">[3]</text><text class="ink2 sm" x="359" y="75" text-anchor="middle">[4]</text><text class="ink2 sm" x="26" y="162" text-anchor="start">칸마다 4바이트. 세 번째 칸의 주소는 1000 + 2 × 4 = 1008 로 계산된다 — 곱셈 한 번이면 끝이라 O(1) 이다</text><text class="ink bold sm" x="26" y="200" text-anchor="start">연결 리스트: 아무 데나 흩어져 있고 화살표로 이어진다</text><rect x="40" y="222" width="44" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="84" y="222" width="24" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="62" y="245" text-anchor="middle">17</text><text class="ink2 sm" x="72" y="215" text-anchor="middle">주소 2040</text><rect x="320" y="288" width="44" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="364" y="288" width="24" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="342" y="311" text-anchor="middle">4</text><text class="ink2 sm" x="352" y="281" text-anchor="middle">주소 1112</text><rect x="150" y="288" width="44" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="194" y="288" width="24" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="172" y="311" text-anchor="middle">9</text><text class="ink2 sm" x="182" y="281" text-anchor="middle">주소 3300</text><rect x="450" y="222" width="44" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="494" y="222" width="24" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="472" y="245" text-anchor="middle">23</text><text class="ink2 sm" x="482" y="215" text-anchor="middle">주소 2044</text><rect x="580" y="288" width="44" height="34" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="624" y="288" width="24" height="34" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="602" y="311" text-anchor="middle">8</text><text class="ink2 sm" x="612" y="281" text-anchor="middle">주소 1500</text><path d="M96 239 C206 273 206 305 316 305" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M376 305 C261 271 261 305 146 305" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M206 305 C326 271 326 239 446 239" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M506 239 C541 273 541 305 576 305" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)"/><text class="ink2 sm" x="658" y="310" text-anchor="start">끝</text><text class="ink2 sm" x="26" y="364" text-anchor="start">세 번째 값을 보려면 앞에서부터 화살표를 두 번 따라가야 한다 — 원소 수에 비례하므로 O(n) 이다.</text><text class="ink2 sm" x="26" y="384" text-anchor="start">파란 칸이 다음 노드의 주소다. 값 하나마다 주소 한 개를 더 저장하므로 공간도 더 쓴다</text>
</svg>