ty="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="280" y="227" text-anchor="middle">1</text><rect x="306" y="204" width="52" height="36" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="332" y="227" text-anchor="middle">2</text><rect x="358" y="204" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="384" y="227" text-anchor="middle">2</text><text class="ink2 sm" x="140" y="262" text-anchor="end">A</text><rect x="150" y="240" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="176" y="263" text-anchor="middle">0</text><rect x="202" y="240" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="228" y="263" text-anchor="middle">1</text><rect x="254" y="240" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="280" y="263" text-anchor="middle">2</text><rect x="306" y="240" width="52" height="36" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="332" y="263" text-anchor="middle">2</text><rect x="358" y="240" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="384" y="263" text-anchor="middle">2</text><text class="ink2 sm" x="140" y="298" text-anchor="end">T</text><rect x="150" y="276" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="176" y="299" text-anchor="middle">0</text><rect x="202" y="276" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="228" y="299" text-anchor="middle">1</text><rect x="254" y="276" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="280" y="299" text-anchor="middle">2</text><rect x="306" y="276" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="332" y="299" text-anchor="middle">2</text><rect x="358" y="276" width="52" height="36" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink" x="384" y="299" text-anchor="middle">3</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M370.02 284.32 L345.98 267.68"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M332 241 L332 239"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M318.02 212.32 L293.98 195.68"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M280 169 L280 167"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M266.02 140.32 L241.98 123.68"/><text class="ink2 sm" x="120" y="338" text-anchor="start">오른쪽 아래 칸(3)에서 거꾸로 따라간다. 대각선으로 움직인 자리의 글자를 모으면</text><text class="ink bold sm" x="120" y="358" text-anchor="start">가장 긴 공통 부분수열 A C T 가 나온다</text><text class="ink bold sm" x="566" y="88" text-anchor="start">한 칸을 채우는 규칙</text><rect x="566" y="100" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="592" y="100" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="566" y="124" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="592" y="124" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="592" y="124" width="26" height="24" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M579 112 L599 132"/><text class="ink2 sm" x="628" y="130" text-anchor="start">글자가 같다 → 대각선 + 1</text><rect x="566" y="158" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="592" y="158" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="566" y="182" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="592" y="182" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="592" y="182" width="26" height="24" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M605 170 L605 188"/><text class="ink2 sm" x="628" y="188" text-anchor="start">다르다 → 위 칸을 그대로</text><rect x="566" y="216" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="592" y="216" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="566" y="240" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="592" y="240" width="26" height="24" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="592" y="240" width="26" height="24" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M579 252 L597 252"/><text class="ink2 sm" x="628" y="246" text-anchor="start">다르다 → 왼쪽 칸을 그대로</text><text class="ink2 sm" x="406" y="378" text-anchor="middle">칸이 (길이+1) × (길이+1) 개이고 칸마다 상수 일이므로 O(mn) 이다. 두 줄만 들고 있으면 길이는 O(min(m,n)) 공간으로도 나온다.</text><text class="ink2 sm" x="406" y="400" text-anchor="middle">다만 부분수열 자체를 되짚으려면 표 전체가 있어야 한다 — 공간을 줄이면 잃는 것이 이것이다</text>
</svg>