.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="406" y="26" text-anchor="middle">두 문자열을 견주는 표 — 글자가 같으면 대각선, 다르면 위와 왼쪽 중 큰 쪽</text><text class="ink2 sm" x="120" y="66" text-anchor="start">세로 X = A G C A T   /   가로 Y = G A C T</text><text class="ink2 sm" x="176" y="88" text-anchor="middle">·</text><text class="ink2 sm" x="228" y="88" text-anchor="middle">G</text><text class="ink2 sm" x="280" y="88" text-anchor="middle">A</text><text class="ink2 sm" x="332" y="88" text-anchor="middle">C</text><text class="ink2 sm" x="384" y="88" text-anchor="middle">T</text><text class="ink2 sm" x="140" y="118" text-anchor="end">·</text><rect x="150" y="96" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="176" y="119" text-anchor="middle">0</text><rect x="202" y="96" width="52" height="36" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink" x="228" y="119" text-anchor="middle">0</text><rect x="254" y="96" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="280" y="119" text-anchor="middle">0</text><rect x="306" y="96" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="332" y="119" text-anchor="middle">0</text><rect x="358" y="96" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="384" y="119" text-anchor="middle">0</text><text class="ink2 sm" x="140" y="154" text-anchor="end">A</text><rect x="150" y="132" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="176" y="155" text-anchor="middle">0</text><rect x="202" y="132" width="52" height="36" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="228" y="155" text-anchor="middle">0</text><rect x="254" y="132" width="52" height="36" rx=