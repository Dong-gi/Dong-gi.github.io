<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 388" width="844" height="388" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">다항 시간 환원의 방향</title><desc id="d">A 를 B 로 환원하면 B 의 해결기로 A 를 풀 수 있고 따라서 B 는 적어도 A 만큼 어렵다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="422" y="26" text-anchor="middle">환원 A ≤ₚ B — 화살표는 A 에서 B 로 가는데 어려움은 거꾸로 전해진다</text><rect x="96" y="66" width="664" height="122" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="6 4"/><text class="ink2 sm" x="106" y="84" text-anchor="start">A 를 푸는 기계 (통째로 다항 시간)</text><rect x="20" y="100" width="100" height="52" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.7"/><text class="ink sm" x="70" y="122.5" text-anchor="middle">A 의 입력</text><text class="ink sm" x="70" y="137.5" text-anchor="middle">x</text><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M124 126 L162 126"/><rect x="166" y="100" width="152" height="52" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.7"/><text class="ink sm" x="242" y="122.5" text-anchor="middle">변환 f</text><text class="ink sm" x="242" y="137.5" text-anchor="middle">다항 시간에 바꾼다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M322 126 L358 126"/><rect x="362" y="100" width="116" height="52" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.7"/><text class="ink sm" x="420" y="122.5" text-anchor="middle">B 의 입력</text><text class="ink sm" x="420" y="137.5" text-anchor="middle">f(x)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M482 126 L518 126"/><rect x="522" y="100" width="152" height="52" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.7"/><text class="ink sm" x="598" y="122.5" text-anchor="middle">B 를 푸는 기계</text><text class="ink sm" x="598" y="137.5" text-anchor="middle">(있다고 치자)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M678 126 L714 126"/><rect x="718" y="100" width="106" height="52" rx="4" fill="none" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text class="ink sm" x="771" y="122.5" text-anchor="middle">예 / 아니오</text><text class="ink sm" x="771" y="137.5" text-anchor="middle">그대로 A 의 답</text><text class="ink bold sm" x="422" y="208" text-anchor="middle">변환이 반드시 지켜야 할 것:  x 가 예  ⟺  f(x) 가 예</text><path d="M40 236 L804 236" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="60" y="260" text-anchor="start">같은 그림을 읽는 두 가지 방법</text><rect x="60" y="272" width="340" height="46" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="230" y="291.5" text-anchor="middle">B 가 쉬우면 A 도 쉽다</text><text class="ink sm" x="230" y="306.5" text-anchor="middle">(B 의 기계 앞에 변환기를 붙이면 된다)</text><rect x="444" y="272" width="340" height="46" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="614" y="291.5" text-anchor="middle">A 가 어려우면 B 도 어렵다</text><text class="ink sm" x="614" y="306.5" text-anchor="middle">(위 문장의 대우다)</text><text class="ink bold sm" x="422" y="344" text-anchor="middle">새 문제 B 가 어렵다고 주장하려면 ‘이미 어렵다고 알려진 A’ 를 B 로 환원해야 한다.</text><text class="ink2 sm" x="422" y="366" text-anchor="middle">방향을 뒤집어 B 를 A 로 환원하면 아무것도 증명하지 못한다 — 가장 흔한 실수가 이것이다</text>
</svg>