<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 442" width="792" height="442" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">비교 정렬의 결정 트리</title><desc id="d">원소 세 개를 정렬하는 모든 비교의 갈림길을 나무로 그리면 잎이 3! 개이고 높이가 3 이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="396" y="24" text-anchor="middle">비교 정렬은 예 · 아니오 질문의 나무다 — 잎이 n! 개면 나무가 그만큼 깊어야 한다</text><path d="M376 82 L226 132" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="287" y="109" text-anchor="end">예</text><path d="M416 82 L566 132" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="505" y="109" text-anchor="start">아니오</text><path d="M186 164 L130 215" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="144" y="191.5" text-anchor="end">예</text><path d="M226 164 L276 214" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="265" y="191" text-anchor="start">아니오</text><path d="M566 164 L516 214" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="527" y="191" text-anchor="end">예</text><path d="M606 164 L662 215" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="648" y="191.5" text-anchor="start">아니오</text><path d="M280 246 L246 297" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="249" y="273.5" text-anchor="end">예</text><path d="M312 246 L346 297" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="343" y="273.5" text-anchor="start">아니오</text><path d="M480 246 L446 297" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="449" y="273.5" text-anchor="end">예</text><path d="M512 246 L546 297" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="543" y="273.5" text-anchor="start">아니오</text><rect x="354" y="50" width="84" height="32" rx="16" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="396" y="71" text-anchor="middle">a &lt; b ?</text><rect x="164" y="132" width="84" height="32" rx="16" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="206" y="153" text-anchor="middle">b &lt; c ?</text><rect x="544" y="132" width="84" height="32" rx="16" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="586" y="153" text-anchor="middle">b &lt; c ?</text><rect x="254" y="214" width="84" height="32" rx="16" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="296" y="235" text-anchor="middle">a &lt; c ?</text><rect x="454" y="214" width="84" height="32" rx="16" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="496" y="235" text-anchor="middle">a &lt; c ?</text><rect x="86" y="215" width="60" height="30" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="116" y="235" text-anchor="middle">a b c</text><rect x="646" y="215" width="60" height="30" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="676" y="235" text-anchor="middle">c b a</text><rect x="206" y="297" width="60" height="30" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="236" y="317" text-anchor="middle">a c b</text><rect x="326" y="297" width="60" height="30" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="356" y="317" text-anchor="middle">c a b</text><rect x="406" y="297" width="60" height="30" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="436" y="317" text-anchor="middle">b a c</text><rect x="526" y="297" width="60" height="30" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="556" y="317" text-anchor="middle">b c a</text><text class="ink bold sm" x="56" y="230" text-anchor="start">잎 6개</text><text class="ink2 sm" x="56" y="248" text-anchor="start">= 3!</text><text class="ink bold sm" x="772" y="312" text-anchor="end">높이 3</text><text class="ink2 sm" x="772" y="330" text-anchor="end">견주기 최대 3번</text><text class="ink2 sm" x="20" y="380" text-anchor="start">원소 세 개의 순서는 3! = 6 가지다. 어떤 비교 정렬도 이 여섯 가지를 모두 구분해야 하므로 잎이 6 개 이상이다.</text><text class="ink2 sm" x="20" y="400" text-anchor="start">높이 h 인 이진트리의 잎은 많아야 2^h 개이므로 2^h ≥ n! 이고, 양변에 로그를 취하면 h ≥ log₂(n!) 이다.</text><text class="ink2 sm" x="20" y="420" text-anchor="start">n! 의 뒤쪽 절반만 남겨도 n! ≥ (n/2)^(n/2) 이므로 h ≥ (n/2)·log₂(n/2), 곧 h = Ω(n log n) 이다.</text><text class="ink2 sm" x="20" y="440" text-anchor="start">최악의 입력은 가장 깊은 잎으로 가는 길이다. 그러니 어떤 비교 정렬도 그 깊이만큼은 견주어야 한다</text>
</svg>