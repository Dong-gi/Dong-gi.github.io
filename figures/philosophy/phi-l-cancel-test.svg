<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" width="900" height="414" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">취소 가능성 검사</title><desc id="d">함의는 취소하면 모순이 되고 함축은 취소해도 모순이 되지 않는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">취소 가능성 검사 — 뒤에 한마디를 붙여 모순이 되는지 본다</text><text class="ink2 sm" x="36" y="50" text-anchor="start">두 문장에 같은 검사를 건다. 갈리는 것은 검사가 아니라 문장이다</text><rect x="36" y="70" width="828" height="112" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="f2 bold" x="56" y="98" text-anchor="start">함의</text><text class="ink sm" x="104" y="98" text-anchor="start">‘학생 셋이 왔다’ 가 딸고 오는 것 — 학생이 왔다</text><rect x="56" y="116" width="380" height="50" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="246" y="138" text-anchor="middle">붙여 본다</text><text class="ink bold sm" x="246" y="158" text-anchor="middle">‘학생 셋이 왔다. 사실은 아무도 안 왔다’</text><path d="M446 141 L476 141" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)"/><rect x="486" y="116" width="172" height="50" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.6"/><path d="M508 133 L524 149" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round"/><path d="M524 133 L508 149" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round"/><text class="ink bold sm" x="546" y="146" text-anchor="start">모순이다</text><text class="ink2 sm" x="676" y="134" text-anchor="start">취소되지 않는다</text><text class="ink2 sm" x="676" y="154" text-anchor="start">문장의 뜻에 들어 있다</text><rect x="36" y="200" width="828" height="112" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="f1 bold" x="56" y="228" text-anchor="start">함축</text><text class="ink sm" x="104" y="228" text-anchor="start">‘어떤 학생이 왔다’ 가 딸고 오는 것 — 전부가 온 것은 아니다</text><rect x="56" y="246" width="380" height="50" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="246" y="268" text-anchor="middle">붙여 본다</text><text class="ink bold sm" x="246" y="288" text-anchor="middle">‘어떤 학생이 왔다. 사실은 전부 왔다’</text><path d="M446 271 L476 271" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)"/><rect x="486" y="246" width="172" height="50" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.6"/><circle cx="516" cy="271" r="9" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="2.6"/><text class="ink bold sm" x="546" y="276" text-anchor="start">모순이 아니다</text><text class="ink2 sm" x="676" y="264" text-anchor="start">취소된다</text><text class="ink2 sm" x="676" y="284" text-anchor="start">맥락과 협력 가정이 만든 것이다</text><path d="M36 340 L864 340" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round"/><text class="ink2 sm" x="36" y="362" text-anchor="start">아래 칸의 문장은 얄밉게 들릴지언정 모순으로 들리지 않는다. 그것이 함축이라는 판정의 근거다</text><text class="ink2 sm" x="36" y="382" text-anchor="start">함의는 문장의 뜻만으로 정해지고, 함축은 문장의 뜻에 맥락과 협력 가정이 더해져 정해진다</text><text class="ink2 sm" x="36" y="402" text-anchor="start">예외 — 관습적 함축은 취소되지 않는다. ‘그는 가난하지만 정직하다’ 가 실어 나르는 것이 그렇다. 이 검사는 대화상 함축에 대한 것이다</text>
</svg>