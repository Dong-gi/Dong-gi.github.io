<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">수반이 금지하는 세계 쌍과 허용하는 세계 쌍</title><desc id="d">물리적으로 같은데 마음이 다른 두 세계는 금지되고 물리적으로 다른데 마음이 같은 두 세계는 허용된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">수반이 금지하는 짝과 허용하는 짝</text><rect x="40" y="46" width="400" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold sm" x="240" y="72" text-anchor="middle">수반이 금지하는 짝</text><rect x="58" y="84" width="178" height="152" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="147" y="108" text-anchor="middle">세계 A</text><text class="ink2 sm" x="72" y="130" text-anchor="start">물리적 사실</text><text class="ink sm" x="72" y="150" text-anchor="start">원자 배치가 같다</text><text class="ink sm" x="72" y="167" text-anchor="start">신경 상태가 같다</text><path d="M72 188 L222 188" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/><text class="ink2 sm" x="72" y="208" text-anchor="start">마음의 사실</text><text class="ink bold sm" x="72" y="227" text-anchor="start">아프다</text><rect x="66" y="196" width="162" height="34" rx="4" fill="var(--s2)" fill-opacity="0.13" stroke="none" stroke-width="0"/><text class="ink2 sm" x="72" y="208" text-anchor="start">마음의 사실</text><text class="ink bold sm" x="72" y="227" text-anchor="start">아프다</text><rect x="244" y="84" width="178" height="152" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="333" y="108" text-anchor="middle">세계 B</text><text class="ink2 sm" x="258" y="130" text-anchor="start">물리적 사실</text><text class="ink sm" x="258" y="150" text-anchor="start">원자 배치가 같다</text><text class="ink sm" x="258" y="167" text-anchor="start">신경 상태가 같다</text><path d="M258 188 L408 188" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/><text class="ink2 sm" x="258" y="208" text-anchor="start">마음의 사실</text><text class="ink bold sm" x="258" y="227" text-anchor="start">아프지 않다</text><rect x="252" y="196" width="162" height="34" rx="4" fill="var(--s1)" fill-opacity="0.13" stroke="none" stroke-width="0"/><text class="ink2 sm" x="258" y="208" text-anchor="start">마음의 사실</text><text class="ink bold sm" x="258" y="227" text-anchor="start">아프지 않다</text><path d="M229 243 L251 265 M251 243 L229 265" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" fill="none"/><text class="ink2 sm" x="240" y="288" text-anchor="middle">아래가 같은데 위가 다르다 — 이런 짝은 없다</text><rect x="470" y="46" width="390" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.7"/><text class="ink bold sm" x="665" y="72" text-anchor="middle">수반이 허용하는 짝</text><rect x="484" y="84" width="178" height="152" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="573" y="108" text-anchor="middle">세계 C</text><text class="ink2 sm" x="498" y="130" text-anchor="start">물리적 사실</text><text class="ink sm" x="498" y="150" text-anchor="start">사람의 신경계</text><text class="ink sm" x="498" y="167" text-anchor="start">그 안의 어떤 상태</text><path d="M498 188 L648 188" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/><text class="ink2 sm" x="498" y="208" text-anchor="start">마음의 사실</text><text class="ink bold sm" x="498" y="227" text-anchor="start">아프다</text><rect x="492" y="196" width="162" height="34" rx="4" fill="var(--s2)" fill-opacity="0.13" stroke="none" stroke-width="0"/><text class="ink2 sm" x="498" y="208" text-anchor="start">마음의 사실</text><text class="ink bold sm" x="498" y="227" text-anchor="start">아프다</text><rect x="670" y="84" width="178" height="152" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="759" y="108" text-anchor="middle">세계 D</text><text class="ink2 sm" x="684" y="130" text-anchor="start">물리적 사실</text><text class="ink sm" x="684" y="150" text-anchor="start">문어의 신경계</text><text class="ink sm" x="684" y="167" text-anchor="start">구조가 다른 상태</text><path d="M684 188 L834 188" fill="none" stroke="var(--grid)" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/><text class="ink2 sm" x="684" y="208" text-anchor="start">마음의 사실</text><text class="ink bold sm" x="684" y="227" text-anchor="start">아프다</text><rect x="678" y="196" width="162" height="34" rx="4" fill="var(--s2)" fill-opacity="0.13" stroke="none" stroke-width="0"/><text class="ink2 sm" x="684" y="208" text-anchor="start">마음의 사실</text><text class="ink bold sm" x="684" y="227" text-anchor="start">아프다</text><path d="M654 252 L662.8 260.8 L676 242.1" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text class="ink2 sm" x="665" y="288" text-anchor="middle">위가 같은데 아래가 다르다 — 이런 짝은 있어도 된다</text><text class="ink2 sm" x="40" y="344" text-anchor="start">수반은 한 방향만 막는다. 아래에서 차이가 없으면 위에서도 차이가 있을 수 없다는 것이 전부다</text><text class="ink2 sm" x="40" y="364" text-anchor="start">오른쪽 칸을 막지 않는 것이 이 정식화의 값어치다 — 그래서 물리주의를 다수 실현과 함께 적을 수 있다</text><text class="ink2 sm" x="40" y="384" text-anchor="start">그런데 수반만으로는 부족하다. 수반은 함께 변한다는 것만 말하고 어느 쪽이 어느 쪽 때문인지를 말하지 않는다</text><text class="ink2 sm" x="40" y="404" text-anchor="start">그래서 조항이 하나 붙는다 — 물리적 사실을 복제하고 그 이상 아무것도 더하지 않으면 세계 전체가 복제된다</text>
</svg>