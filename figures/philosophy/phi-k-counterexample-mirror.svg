<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 340" width="830" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">논증의 반례와 개념 분석의 반례</title><desc id="d">반례는 주장이 금지한 조합을 실제로 하나 내놓는 일이며 논리학과 개념 분석에서 같은 모양이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="30" y="26" text-anchor="start">반례는 두 곳에서 같은 모양으로 작동한다</text><rect x="30" y="44" width="190" height="32" rx="4" fill="var(--grid)" fill-opacity="0.4" stroke="var(--grid)" stroke-width="1.5"/><text class="ink bold sm" x="42" y="65" text-anchor="start">묻는 것</text><rect x="226" y="44" width="290" height="32" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="238" y="65" text-anchor="start">논리학 — 논증 형식</text><rect x="522" y="44" width="278" height="32" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="534" y="65" text-anchor="start">인식론 — 개념 분석</text><rect x="30" y="76" width="190" height="41" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink2 sm" x="42" y="98" text-anchor="start">무엇을 주장하는가</text><rect x="226" y="76" width="290" height="41" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink sm" x="238" y="98" text-anchor="start">이 논증 형식은 타당하다</text><rect x="522" y="76" width="278" height="41" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink sm" x="534" y="98" text-anchor="start">앎이기 위한 필요충분조건은 JTB 다</text><rect x="30" y="117" width="190" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink2 sm" x="42" y="139" text-anchor="start">그 주장이 금지하는 것</text><rect x="226" y="117" width="290" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink sm" x="238" y="139" text-anchor="start">전제가 모두 참인데</text><text class="ink sm" x="238" y="156" text-anchor="start">결론이 거짓인 상황</text><rect x="522" y="117" width="278" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink sm" x="534" y="139" text-anchor="start">오른쪽은 만족하는데</text><text class="ink sm" x="534" y="156" text-anchor="start">왼쪽은 아닌 사례</text><rect x="30" y="175" width="190" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink2 sm" x="42" y="197" text-anchor="start">반례가 하는 일</text><rect x="226" y="175" width="290" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink sm" x="238" y="197" text-anchor="start">금지된 그 상황을</text><text class="ink sm" x="238" y="214" text-anchor="start">실제로 하나 내놓는다</text><rect x="522" y="175" width="278" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink sm" x="534" y="197" text-anchor="start">금지된 그 사례를</text><text class="ink sm" x="534" y="214" text-anchor="start">실제로 하나 내놓는다</text><rect x="30" y="233" width="190" height="41" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink2 sm" x="42" y="255" text-anchor="start">하나면 되는가</text><rect x="226" y="233" width="290" height="41" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink sm" x="238" y="255" text-anchor="start">하나면 부당함이 확립된다</text><rect x="522" y="233" width="278" height="41" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink sm" x="534" y="255" text-anchor="start">하나면 분석이 무너진다</text><text class="ink2 sm" x="30" y="300" text-anchor="start">왼쪽 칸은 논리학 문서 3장에서 정의한 그대로다. 오른쪽 칸에서 달라진 것은 판정 대상뿐이다 —</text><text class="ink2 sm" x="30" y="320" text-anchor="start">논증 대신 정의를 걸고, 상황 대신 사례를 내놓는다. 게티어가 한 일이 정확히 오른쪽 칸이다</text>
</svg>