<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">콩도르세 배심 정리의 두 얼굴</title><desc id="d">투표자 수에 따른 다수결의 정확도 곡선 셋. 각자 옳을 확률이 0.5 를 넘으면 1 로 수렴하고, 밑돌면 0 으로 수렴한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">콩도르세 배심 정리 — 사람이 많아지면 다수결이 어디로 가는가</text><path class="gr" d="M70 332 V82"/><path class="gr" d="M150 332 V82"/><path class="gr" d="M230 332 V82"/><path class="gr" d="M310 332 V82"/><path class="gr" d="M390 332 V82"/><path class="gr" d="M470 332 V82"/><path class="gr" d="M550 332 V82"/><path class="gr" d="M70 332 H550"/><path class="gr" d="M70 269.5 H550"/><path class="gr" d="M70 207 H550"/><path class="gr" d="M70 144.5 H550"/><path class="gr" d="M70 82 H550"/><path class="ax" marker-end="url(#ark)" d="M70 332 H560"/><path class="ax" marker-end="url(#ark)" d="M70 332 V72"/><text class="sm ink2" x="150" y="347" text-anchor="middle">11</text><text class="sm ink2" x="230" y="347" text-anchor="middle">21</text><text class="sm ink2" x="310" y="347" text-anchor="middle">31</text><text class="sm ink2" x="390" y="347" text-anchor="middle">41</text><text class="sm ink2" x="470" y="347" text-anchor="middle">51</text><text class="sm ink2" x="550" y="347" text-anchor="middle">61</text><text class="sm ink2" x="64" y="273.5" text-anchor="end">0.25</text><text class="sm ink2" x="64" y="211" text-anchor="end">0.5</text><text class="sm ink2" x="64" y="148.5" text-anchor="end">0.75</text><text class="sm ink2" x="64" y="86" text-anchor="end">1</text><text class="sm ink2" x="564" y="336">투표자 수</text><text class="sm ink2" x="70" y="64" text-anchor="middle">다수결이 옳을 확률</text><path class="cv s1" d="M70 182 L86 170 L102 161.36 L118 154.45 L134 148.64 L150 143.63 L166 139.21 L182 135.28 L198 131.73 L214 128.52 L230 125.59 L246 122.91 L262 120.44 L278 118.16 L294 116.05 L310 114.1 L326 112.27 L342 110.58 L358 108.99 L374 107.51 L390 106.13 L406 104.83 L422 103.61 L438 102.47 L454 101.39 L470 100.38 L486 99.43 L502 98.53 L518 97.69 L534 96.89 L550 96.13"/><path class="cv s3" d="M70 204.5 L86 203.25 L102 202.31 L118 201.53 L134 200.85 L150 200.24 L166 199.67 L182 199.15 L198 198.66 L214 198.2 L230 197.76 L246 197.34 L262 196.94 L278 196.56 L294 196.19 L310 195.83 L326 195.48 L342 195.14 L358 194.81 L374 194.49 L390 194.18 L406 193.88 L422 193.58 L438 193.29 L454 193.01 L470 192.73 L486 192.46 L502 192.19 L518 191.93 L534 191.67 L550 191.42"/><path class="cv s2" d="M70 219.5 L86 225.69 L102 230.28 L118 234.07 L134 237.36 L150 240.28 L166 242.94 L182 245.38 L198 247.64 L214 249.76 L230 251.75 L246 253.63 L262 255.42 L278 257.12 L294 258.74 L310 260.29 L326 261.78 L342 263.22 L358 264.59 L374 265.92 L390 267.2 L406 268.44 L422 269.64 L438 270.8 L454 271.93 L470 273.02 L486 274.08 L502 275.11 L518 276.11 L534 277.08 L550 278.03"/><path class="cv gr" stroke-dasharray="4 3" d="M70 207 L550 207"/><text class="ink2 sm" x="560" y="100.13" text-anchor="start">0.6 → 1 로 간다</text><text class="ink2 sm" x="560" y="195.42" text-anchor="start">0.51 → 느리지만 1 로 간다</text><text class="ink2 sm" x="560" y="282.03" text-anchor="start">0.45 → 0 으로 간다</text><text class="ink bold sm" x="40" y="368" text-anchor="start">위 두 곡선이 정리의 좋은 소식이고, 맨 아래 곡선이 같은 정리의 나쁜 소식이다</text><text class="ink2 sm" x="40" y="390" text-anchor="start">각자가 옳을 확률이 절반을 조금이라도 넘으면 수가 많아질수록 다수결은 거의 확실히 옳아진다</text><text class="ink2 sm" x="40" y="412" text-anchor="start">절반에 못 미치면 수가 많아질수록 다수결은 거의 확실히 틀린다. 큰 집단은 옳음도 그름도 함께 증폭한다</text><text class="ink2 sm" x="40" y="434" text-anchor="start">게다가 이 곡선은 투표가 서로 독립이라야 나온다. 같은 정보원을 보는 사람들의 오류는 서로 붙어 다니고, 그러면 곡선이 훨씬 눕는다</text>
</svg>