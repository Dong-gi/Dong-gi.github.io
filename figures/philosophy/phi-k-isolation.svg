<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">고립 반론</title><desc id="d">정합의 정도가 같은 두 믿음 체계 중 하나만 세계와 맞물려 있다면 정합만으로는 둘을 가를 수 없다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="30" y="26" text-anchor="start">정합의 정도가 똑같은 두 그물 — 그물 안만 보아서는 가를 수 없다</text><rect x="30" y="44" width="300" height="172" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="180" y="68" text-anchor="middle">세계와 맞물린 그물</text><path d="M104 110 L198 98" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round"/><path d="M104 110 L92 172" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round"/><path d="M198 98 L270 136" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round"/><path d="M198 98 L184 180" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round"/><path d="M270 136 L256 192" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round"/><path d="M92 172 L184 180" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round"/><path d="M184 180 L256 192" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round"/><path d="M104 110 L184 180" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round"/><path d="M198 98 L92 172" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round"/><circle cx="104" cy="110" r="12" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.5"/><circle cx="198" cy="98" r="12" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.5"/><circle cx="270" cy="136" r="12" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.5"/><circle cx="92" cy="172" r="12" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.5"/><circle cx="184" cy="180" r="12" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.5"/><circle cx="256" cy="192" r="12" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.5"/><text class="ink2 sm" x="180" y="210" text-anchor="middle">어긋남 없이 짜여 있다</text><rect x="452" y="44" width="300" height="172" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="602" y="68" text-anchor="middle">잘 지어낸 이야기</text><path d="M526 110 L620 98" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round"/><path d="M526 110 L514 172" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round"/><path d="M620 98 L692 136" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round"/><path d="M620 98 L606 180" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round"/><path d="M692 136 L678 192" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round"/><path d="M514 172 L606 180" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round"/><path d="M606 180 L678 192" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round"/><path d="M526 110 L606 180" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round"/><path d="M620 98 L514 172" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round"/><circle cx="526" cy="110" r="12" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.5"/><circle cx="620" cy="98" r="12" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.5"/><circle cx="692" cy="136" r="12" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.5"/><circle cx="514" cy="172" r="12" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.5"/><circle cx="606" cy="180" r="12" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.5"/><circle cx="678" cy="192" r="12" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.5"/><text class="ink2 sm" x="602" y="210" text-anchor="middle">어긋남 없이 짜여 있다</text><rect x="346" y="96" width="76" height="64" rx="5" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold sm" x="384" y="122" text-anchor="middle">세계</text><text class="ink2 sm" x="384" y="142" text-anchor="middle">(바깥)</text><path d="M344 116 L288.94 108.9" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round"/><path d="M282 108 L289.5 104.59 L288.39 113.2 z" fill="var(--s3)"/><path d="M424 116 L479.06 108.9" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M486 108 L479.61 113.2 L478.5 104.59 z" fill="var(--s2)"/><path d="M446 102 L464 120" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round"/><path d="M464 102 L446 120" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round"/><text class="ink2 sm" x="430" y="90" text-anchor="start">이 화살표가 없다</text><text class="ink2 sm" x="30" y="250" text-anchor="start">오른쪽 그물은 왼쪽만큼 정합적이다. 마디끼리 어긋나지 않고 새 믿음도 앞뒤가 맞게 들어간다.</text><text class="ink2 sm" x="30" y="272" text-anchor="start">정합만으로 정당화를 정의하면 두 그물이 똑같이 정당화된다고 말해야 한다 — 이것이 고립 반론이다.</text><text class="ink2 sm" x="30" y="294" text-anchor="start">정합론자의 대답은 ‘경험에서 온 믿음에 더 큰 무게를 준다’ 는 것인데, 그렇게 하는 순간 무게의 근거를</text><text class="ink2 sm" x="30" y="316" text-anchor="start">그물 바깥에서 끌어오는 것 아니냐는 되물음이 따라붙는다. 이 주고받음은 아직 끝나지 않았다</text>
</svg>