<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 306" width="770" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">확립과 반증의 비대칭</title><desc id="d">맞는 사례는 아무리 많아도 전칭 명제를 확립하지 못하지만 어긋나는 사례 하나는 거짓으로 만든다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">전칭 명제 — ‘모든 백조는 희다’</text><text class="ink2 sm" x="36" y="50" text-anchor="start">가로줄은 검사한 사례들이다. 오른쪽 끝은 아직 검사하지 않은 사례로 계속 이어진다</text><rect x="58" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="71" y="93" text-anchor="middle">✓</text><rect x="90" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="103" y="93" text-anchor="middle">✓</text><rect x="122" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="135" y="93" text-anchor="middle">✓</text><rect x="154" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="167" y="93" text-anchor="middle">✓</text><rect x="186" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="199" y="93" text-anchor="middle">✓</text><rect x="218" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="231" y="93" text-anchor="middle">✓</text><rect x="250" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="263" y="93" text-anchor="middle">✓</text><rect x="282" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="295" y="93" text-anchor="middle">✓</text><rect x="314" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="327" y="93" text-anchor="middle">✓</text><rect x="346" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="359" y="93" text-anchor="middle">✓</text><rect x="378" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="391" y="93" text-anchor="middle">✓</text><rect x="410" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="423" y="93" text-anchor="middle">✓</text><rect x="442" y="74" width="26" height="26" rx="4" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="455" y="93" text-anchor="middle">✗</text><rect x="474" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="487" y="93" text-anchor="middle">✓</text><rect x="506" y="74" width="26" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="519" y="93" text-anchor="middle">✓</text><rect x="538" y="74" width="26" height="26" rx="4" fill="none" fill-opacity="0.14" stroke="var(--grid)" stroke-width="1.2"/><rect x="570" y="74" width="26" height="26" rx="4" fill="none" fill-opacity="0.14" stroke="var(--grid)" stroke-width="1.2"/><rect x="602" y="74" width="26" height="26" rx="4" fill="none" fill-opacity="0.14" stroke="var(--grid)" stroke-width="1.2"/><rect x="634" y="74" width="26" height="26" rx="4" fill="none" fill-opacity="0.14" stroke="var(--grid)" stroke-width="1.2"/><rect x="666" y="74" width="26" height="26" rx="4" fill="none" fill-opacity="0.14" stroke="var(--grid)" stroke-width="1.2"/><text class="ink2 sm" x="58" y="122" text-anchor="start">검사한 사례</text><text class="ink2 sm" x="700" y="122" text-anchor="end">…</text><rect x="58" y="142" width="320" height="96" rx="4" fill="var(--s3)" fill-opacity="0.07" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="74" y="166" text-anchor="start">✓ 가 아무리 많아도</text><text class="ink sm" x="74" y="190" text-anchor="start">전칭 명제는 확립되지 않는다.</text><text class="ink sm" x="74" y="212" text-anchor="start">검사하지 않은 사례가 늘 남는다</text><rect x="410" y="142" width="300" height="96" rx="4" fill="var(--s2)" fill-opacity="0.07" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="426" y="166" text-anchor="start">✗ 가 하나면</text><text class="ink sm" x="426" y="190" text-anchor="start">전칭 명제는 거짓이다.</text><text class="ink sm" x="426" y="212" text-anchor="start">이 걸음은 연역이다 — 후건 부정</text><text class="ink2 sm" x="36" y="268" text-anchor="start">포퍼가 쓰는 비대칭은 여기까지다. 그런데 ✗ 라고 적는 일 자체가 관찰 진술이고, 관찰 진술도 틀릴 수 있다</text><text class="ink2 sm" x="36" y="290" text-anchor="start">게다가 실제 검사에서 ✗ 를 내놓는 것은 가설 하나가 아니라 가설과 보조 가정의 묶음이다</text>
</svg>