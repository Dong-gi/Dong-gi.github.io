<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">메리의 방과 지식 논증</title><desc id="d">흑백 방 안의 물리적 사실 전부와 문을 나선 뒤의 물음, 그리고 물리주의 쪽 두 응답</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">메리의 방 — 문을 나선 순간 무엇이 늘어나는가</text><path d="M40 52 L372 52" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"/><path d="M40 52 L40 262" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"/><path d="M40 262 L372 262" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"/><path d="M372 52 L372 133" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"/><path d="M372 181 L372 262" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"/><text class="ink2 sm" x="382" y="196" text-anchor="start">문</text><text class="ink bold sm" x="58" y="80" text-anchor="start">흑백 방 안</text><text class="ink2 sm" x="58" y="102" text-anchor="start">메리가 가진 것 — 색에 관한 물리적 사실 전부</text><text class="ink sm" x="58" y="130" text-anchor="start">빛의 파장</text><text class="ink sm" x="58" y="150" text-anchor="start">망막의 수용체</text><text class="ink sm" x="58" y="170" text-anchor="start">시각 피질에서 일어나는 일</text><text class="ink sm" x="58" y="190" text-anchor="start">사람이 색을 볼 때 뇌에서 벌어지는</text><text class="ink sm" x="58" y="210" text-anchor="start">모든 물리적 사실</text><text class="ink2 sm" x="58" y="242" text-anchor="start">겪은 적은 한 번도 없다 — 흑백 화면으로만 공부했다</text><path d="M316 157 L452 157" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink2 sm" x="394" y="145" text-anchor="middle">문을 나선다</text><rect x="462" y="56" width="398" height="88" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold sm" x="474" y="79" text-anchor="start">문 밖 — 처음으로 빨간 것을 본다</text><text class="ink2 sm" x="474" y="101" text-anchor="start">그는 무언가를 새로 아는가</text><text class="ink2 sm" x="474" y="119" text-anchor="start">대부분의 사람이 그렇다고 답한다</text><path d="M661 148 L661 176" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)"/><rect x="462" y="180" width="398" height="108" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="474" y="203" text-anchor="start">그렇다고 하면 걸음이 이렇게 간다</text><text class="ink2 sm" x="474" y="225" text-anchor="start">(P1) 방 안에서 물리적 사실을 모두 알았다</text><text class="ink2 sm" x="474" y="242" text-anchor="start">(P2) 나온 뒤 새로운 것을 안다</text><text class="ink2 sm" x="474" y="259" text-anchor="start">(C1) 물리적 사실이 아닌 사실이 있다</text><text class="ink2 sm" x="474" y="276" text-anchor="start">(C) 물리주의는 거짓이다</text><text class="ink bold sm" x="40" y="320" text-anchor="start">물리주의 쪽 응답 둘 — 둘 다 (P2) 를 다시 읽는다</text><rect x="40" y="330" width="400" height="92" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.7"/><text class="ink bold sm" x="52" y="353" text-anchor="start">능력 가설</text><text class="ink2 sm" x="52" y="375" text-anchor="start">얻은 것은 사실이 아니라 능력이다 —</text><text class="ink2 sm" x="52" y="393" text-anchor="start">상상하고 기억하고 다시 알아보는 능력</text><text class="ink2 sm" x="52" y="411" text-anchor="start">자전거 타는 법을 익히는 것과 같은 종류다</text><rect x="460" y="330" width="400" height="92" rx="4" fill="var(--s3)" fill-opacity="0.12" stroke="var(--s3)" stroke-width="1.7"/><text class="ink bold sm" x="472" y="353" text-anchor="start">현상 개념 전략</text><text class="ink2 sm" x="472" y="375" text-anchor="start">얻은 것은 옛 사실을 붙잡는 새 개념이다</text><text class="ink2 sm" x="472" y="393" text-anchor="start">헤스페루스와 포스포러스가 같은 모양이다</text><text class="ink2 sm" x="472" y="411" text-anchor="start">겪음으로만 얻어지는 개념이 있다면 그렇게 된다</text><text class="ink2 sm" x="40" y="448" text-anchor="start">두 응답은 같지 않다. 능력 가설은 얻은 것이 앎이 아니라 하고, 현상 개념 전략은 앎이지만 새 사실은 아니라 한다</text><text class="ink2 sm" x="40" y="468" text-anchor="start">잭슨 자신이 나중에 이 논증을 거부하고 물리주의 쪽으로 옮겼다. 만든 사람이 버렸다는 것이 논증을 반박하지는 않는다</text>
</svg>