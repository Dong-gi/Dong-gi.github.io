<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 340" width="812" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">꿈 논증의 핵심</title><desc id="d">깨어 있는 상황과 꿈꾸는 상황이 같은 증거를 남기면 그 증거로는 두 상황을 가를 수 없다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="30" y="26" text-anchor="start">두 상황이 안에서 같아 보인다면, 안에 있는 증거로는 어느 쪽인지 가를 수 없다</text><rect x="48" y="52" width="250" height="96" rx="6" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.7"/><text class="ink bold sm" x="173" y="80" text-anchor="middle">깨어서 손을 보고 있다</text><text class="ink2 sm" x="173" y="104" text-anchor="middle">눈앞에 손이 있고 빛이 들어온다</text><text class="ink2 sm" x="173" y="124" text-anchor="middle">손을 쥐면 감각이 온다</text><rect x="48" y="178" width="250" height="96" rx="6" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.7" stroke-dasharray="6 4"/><text class="ink bold sm" x="173" y="206" text-anchor="middle">손을 보는 꿈을 꾸고 있다</text><text class="ink2 sm" x="173" y="230" text-anchor="middle">눈앞에 손이 있고 빛이 들어온다</text><text class="ink2 sm" x="173" y="250" text-anchor="middle">손을 쥐면 감각이 온다</text><path d="M302 96 L393.82 144.72" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round"/><path d="M400 148 L391.78 148.55 L395.85 140.89 z" fill="var(--s3)"/><path d="M302 230 L393.82 181.28" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M400 178 L395.85 185.11 L391.78 177.45 z" fill="var(--s2)"/><rect x="406" y="128" width="208" height="70" rx="6" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold sm" x="510" y="156" text-anchor="middle">내가 지금 가진 증거</text><text class="ink2 sm" x="510" y="178" text-anchor="middle">두 상황에서 똑같다</text><path d="M618 163 L661 163" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round"/><path d="M668 163 L661 167.34 L661 158.66 z" fill="var(--ink2)"/><text class="ink sm" x="676" y="148" text-anchor="start">그러니 이 증거로는</text><text class="ink sm" x="676" y="166" text-anchor="start">두 상황을 가를 수</text><text class="ink sm" x="676" y="184" text-anchor="start">없다</text><text class="ink2 sm" x="30" y="300" text-anchor="start">회의주의자가 주장하는 것은 ‘너는 꿈을 꾸고 있다’ 가 아니다. 어느 쪽인지 가릴 수단이 안에 없다는 것뿐이다.</text><text class="ink2 sm" x="30" y="322" text-anchor="start">그래서 ‘꿈에서는 볼을 꼬집어도 아프지 않다’ 같은 반박은 과녁을 빗나간다 — 꿈은 그 반박도 함께 담을 수 있다</text>
</svg>