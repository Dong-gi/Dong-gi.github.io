<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">기계를 놓고 묻게 되는 세 물음</title><desc id="d">한 물음이 행동 이해 겪어짐이라는 세 물음으로 갈리고 칸과 칸을 잇는 화살표가 끊겨 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">한 덩어리로 보이는 물음이 실은 셋이다</text><rect x="320" y="46" width="260" height="42" rx="4" fill="var(--grid)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold sm" x="450" y="73" text-anchor="middle">기계가 생각할 수 있는가</text><rect x="40" y="132" width="250" height="136" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.7"/><text class="ink bold sm" x="52" y="156" text-anchor="start">물음 ① 행동</text><text class="ink bold sm" x="52" y="178" text-anchor="start">사람과 구별되지 않게</text><text class="ink2 sm" x="52" y="198" text-anchor="start">행동할 수 있는가</text><text class="ink2 sm" x="52" y="216" text-anchor="start">누구의 물음인가 — 튜링</text><text class="ink2 sm" x="52" y="234" text-anchor="start">재는 것 — 글로 주고받는 대화</text><text class="ink2 sm" x="52" y="252" text-anchor="start">통과해도 오른쪽 두 칸은 남는다</text><path d="M450 92 L165 128" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)"/><rect x="325" y="132" width="250" height="136" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold sm" x="337" y="156" text-anchor="start">물음 ② 이해</text><text class="ink bold sm" x="337" y="178" text-anchor="start">계산이 이해에</text><text class="ink2 sm" x="337" y="198" text-anchor="start">충분한가</text><text class="ink2 sm" x="337" y="216" text-anchor="start">누구의 물음인가 — 설</text><text class="ink2 sm" x="337" y="234" text-anchor="start">재는 것 — 내용, 곧 무언가에 관함</text><text class="ink2 sm" x="337" y="252" text-anchor="start">중국어 방이 겨눈 물음이다</text><path d="M450 92 L450 128" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)"/><rect x="610" y="132" width="250" height="136" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.7"/><text class="ink bold sm" x="622" y="156" text-anchor="start">물음 ③ 겪어짐</text><text class="ink bold sm" x="622" y="178" text-anchor="start">기계에 겪어지는 것이</text><text class="ink2 sm" x="622" y="198" text-anchor="start">있는가</text><text class="ink2 sm" x="622" y="216" text-anchor="start">누구의 물음인가 — 차머스 · 네이글</text><text class="ink2 sm" x="622" y="234" text-anchor="start">재는 것 — 어떠함</text><text class="ink2 sm" x="622" y="252" text-anchor="start">어려운 문제가 그대로 온다</text><path d="M450 92 L735 128" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M207 310 L408 310" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ark)"/><path d="M297.5 300 L317.5 320 M317.5 300 L297.5 320" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" fill="none"/><text class="ink bold sm" x="307.5" y="292" text-anchor="middle">따라 나오지 않는다</text><path d="M492 310 L693 310" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ark)"/><path d="M582.5 300 L602.5 320 M602.5 300 L582.5 320" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" fill="none"/><text class="ink bold sm" x="592.5" y="292" text-anchor="middle">따라 나오지 않는다</text><text class="ink2 sm" x="450" y="336" text-anchor="middle">가운데 칸을 통과해도 오른쪽 칸은 그대로 남는다</text><text class="ink2 sm" x="40" y="372" text-anchor="start">셋을 섞으면 논쟁 전체가 헛돈다. 설 자신이 ② 와 ‘기계가 생각할 수 있는가’ 를 갈라 두었다 — 뒤엣것에는 그렇다고 답한다. 뇌가 기계이고 생각하기 때문이다</text><text class="ink2 sm" x="40" y="392" text-anchor="start">② 에 ‘충분하지 않다’ 가 참이어도 그것은 계산으로 만든 체계에 대한 판정일 뿐, 다른 방식으로 만든 기계에 대한 판정은 아니다</text><text class="ink2 sm" x="40" y="412" text-anchor="start">③ 은 사람에 대해서도 풀리지 않은 물음이다. 기계에서 먼저 풀릴 이유가 없다</text><text class="ink2 sm" x="40" y="432" text-anchor="start">기계를 어떻게 대해야 하는가는 또 다른 층의 물음이고 이 그림에 없다. 그것은 19장의 일이다</text>
</svg>