<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">관련 대안의 안과 밖</title><desc id="d">앎이 요구하는 것은 관련된 대안의 배제뿐이라는 주장과 그 경계를 어디에 그을지의 다툼</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="30" y="26" text-anchor="start">안다고 하려면 어디까지의 대안을 배제해야 하는가</text><ellipse cx="250" cy="178" rx="200" ry="110" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="6 4"/><ellipse cx="250" cy="178" rx="112" ry="66" fill="var(--s3)" fill-opacity="0.12" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="250" y="88" text-anchor="middle">배제하지 않아도 되는 대안</text><text class="ink bold sm" x="250" y="132" text-anchor="middle">배제해야 하는 대안</text><circle cx="200" cy="172" r="5" fill="var(--s3)"/><text class="ink sm" x="210" y="177" text-anchor="start">저것은 말이다</text><circle cx="200" cy="202" r="5" fill="var(--s3)"/><text class="ink sm" x="210" y="207" text-anchor="start">저것은 얼룩 그림자다</text><circle cx="250" cy="258" r="5" fill="var(--s2)"/><text class="ink sm" x="262" y="263" text-anchor="start">내가 통 속의 뇌다</text><circle cx="322" cy="127" r="7" fill="none" stroke="var(--s2)" stroke-width="2.2"/><path d="M332 123 L464 108" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><text class="ink bold sm" x="472" y="96" text-anchor="start">얼룩말로 칠한 노새다</text><text class="ink2 sm" x="472" y="116" text-anchor="start">이것이 안쪽인가 바깥쪽인가 —</text><text class="ink2 sm" x="472" y="134" text-anchor="start">바로 여기서 다툰다</text><text class="ink bold sm" x="472" y="186" text-anchor="start">관련 대안 이론</text><text class="ink2 sm" x="472" y="204" text-anchor="start">바깥쪽이다. 배제하지 않아도 안다</text><text class="ink bold sm" x="472" y="234" text-anchor="start">회의주의자</text><text class="ink2 sm" x="472" y="252" text-anchor="start">원을 그을 근거가 없다</text><text class="ink2 sm" x="30" y="314" text-anchor="start">동물원 우리 앞에서 ‘저것은 얼룩말이다’ 를 안다고 말하는 데는 무리가 없다. 그런데 ‘얼룩말로 칠한 노새가</text><text class="ink2 sm" x="30" y="336" text-anchor="start">아님을 아는가’ 라고 따로 물으면 대답이 궁해진다. 두 대답이 다 자연스럽다는 것 자체가 이 절의 문제다</text>
</svg>