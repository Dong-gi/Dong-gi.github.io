<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 374" width="830" height="374" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">민감성과 안전성이 보는 범위</title><desc id="d">민감성은 명제가 거짓이 되는 가장 가까운 경우를 보고 안전성은 실제 경우 둘레 전체를 본다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="30" y="24" text-anchor="start">두 조건 다 ‘가까운 경우’ 를 보지만 보는 방향이 반대다</text><rect x="32" y="60" width="368" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="216" y="50" text-anchor="middle">민감성 — P 가 거짓이었다면 믿지 않았을 것이다</text><ellipse cx="216" cy="176" rx="152" ry="78" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="5 4"/><text class="ink2 sm" x="68" y="84" text-anchor="start">가까운 경우들</text><ellipse cx="332" cy="176" rx="52" ry="52" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.6"/><text class="ink2 sm" x="332" y="248" text-anchor="middle">P 가 거짓인 경우</text><circle cx="108" cy="176" r="6" fill="var(--s1)"/><text class="ink bold sm" x="108" y="160" text-anchor="middle">실제 경우</text><text class="ink2 sm" x="108" y="200" text-anchor="middle">P 참 · 믿는다</text><text class="ink sm" x="220" y="132" text-anchor="middle">가장 가까운 P 거짓 경우로 한 걸음</text><path d="M124 176 L265 176" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"/><path d="M272 176 L265 180.34 L265 171.66 z" fill="var(--s2)"/><circle cx="294" cy="176" r="7" fill="none" stroke="var(--s2)" stroke-width="2"/><text class="ink sm" x="216" y="276" text-anchor="middle">거기서도 여전히 믿는다면 민감하지 않다</text><text class="ink2 sm" x="216" y="294" text-anchor="middle">보는 곳은 그 한 점이다</text><rect x="430" y="60" width="368" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="614" y="50" text-anchor="middle">안전성 — 믿었다면 참이었을 것이다</text><ellipse cx="614" cy="176" rx="152" ry="78" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="5 4"/><text class="ink2 sm" x="466" y="84" text-anchor="start">가까운 경우들</text><ellipse cx="730" cy="176" rx="52" ry="52" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.6"/><text class="ink2 sm" x="730" y="248" text-anchor="middle">P 가 거짓인 경우</text><circle cx="506" cy="176" r="6" fill="var(--s1)"/><text class="ink bold sm" x="506" y="160" text-anchor="middle">실제 경우</text><text class="ink2 sm" x="506" y="200" text-anchor="middle">P 참 · 믿는다</text><ellipse cx="556" cy="176" rx="90" ry="62" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="2"/><text class="ink sm" x="554" y="104" text-anchor="middle">내가 P 를 믿는 가까운 경우들</text><circle cx="484" cy="146" r="5" fill="none" stroke="var(--s3)" stroke-width="1.6"/><circle cx="490" cy="208" r="5" fill="none" stroke="var(--s3)" stroke-width="1.6"/><circle cx="574" cy="142" r="5" fill="none" stroke="var(--s3)" stroke-width="1.6"/><circle cx="592" cy="212" r="5" fill="none" stroke="var(--s3)" stroke-width="1.6"/><circle cx="608" cy="170" r="5" fill="none" stroke="var(--s3)" stroke-width="1.6"/><circle cx="550" cy="134" r="5" fill="none" stroke="var(--s3)" stroke-width="1.6"/><circle cx="544" cy="220" r="5" fill="none" stroke="var(--s3)" stroke-width="1.6"/><text class="ink sm" x="614" y="276" text-anchor="middle">초록과 주황이 한 점도 겹치지 않으면 안전하다</text><text class="ink2 sm" x="614" y="294" text-anchor="middle">보는 곳은 초록 영역 전체다</text><text class="ink2 sm" x="30" y="336" text-anchor="start">민감성은 실제 경우에서 밖으로 한 걸음 나간 지점을 보고, 안전성은 내가 믿는 가까운 경우 전체를 본다.</text><text class="ink2 sm" x="30" y="358" text-anchor="start">그래서 한쪽만 통과하는 믿음이 생긴다 — 두 조건은 서로 다른 조건이지 같은 말의 다른 표현이 아니다</text>
</svg>