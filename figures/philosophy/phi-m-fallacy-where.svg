<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">일곱 오류가 걸리는 관문</title><desc id="d">논증 평가의 다섯 물음과 각 물음에서 걸리는 비형식 오류</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="34" y="28" text-anchor="start">오류 이름 대신 깨진 관문을 짚는다</text><text class="ink2 sm" x="34" y="50" text-anchor="start">왼쪽은 재구성을 마친 논증에 차례로 던지는 물음이고, 오른쪽은 그 물음에서 걸리는 흔한 실패다.</text><rect x="34" y="74" width="336" height="58" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold" x="50" y="109" text-anchor="start">1</text><text class="ink sm" x="74" y="109" text-anchor="start">결론과 전제를 제대로 짚었는가</text><path d="M370 103 L400 103" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><rect x="408" y="74" width="458" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="422" y="98" text-anchor="start">허수아비 — 상대가 내놓지 않은 결론을 무너뜨린다.</text><text class="ink2 sm" x="422" y="118" text-anchor="start">무너진 것은 상대의 논증이 아니다</text><rect x="34" y="142" width="336" height="58" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="50" y="177" text-anchor="start">2</text><text class="ink sm" x="74" y="177" text-anchor="start">전제가 결론과 관련이 있는가</text><path d="M370 171 L400 171" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><rect x="408" y="142" width="458" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="422" y="166" text-anchor="start">인신공격 — 말한 사람의 성질을 전제로 쓴다.</text><text class="ink2 sm" x="422" y="186" text-anchor="start">증언의 신빙성을 다투는 자리에서는 관련이 생긴다</text><rect x="34" y="210" width="336" height="58" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold" x="50" y="245" text-anchor="start">3</text><text class="ink sm" x="74" y="245" text-anchor="start">전제가 결론을 얼마나 뒷받침하는가</text><path d="M370 239 L400 239" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><rect x="408" y="210" width="458" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="422" y="234" text-anchor="start">성급한 일반화 — 표본이 결론의 범위를 못 받친다.</text><text class="ink2 sm" x="422" y="254" text-anchor="start">미끄러운 비탈 — 고리마다의 기제를 대지 못한다</text><rect x="34" y="278" width="336" height="58" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold" x="50" y="313" text-anchor="start">4</text><text class="ink sm" x="74" y="313" text-anchor="start">전제를 받아들일 이유가 있는가</text><path d="M370 307 L400 307" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><rect x="408" y="278" width="458" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="422" y="302" text-anchor="start">거짓 딜레마 — 선택지를 둘로 좁힌 전제가 거짓이다.</text><text class="ink2 sm" x="422" y="322" text-anchor="start">권위 호소 — 네 조건을 못 채운 권위를 전제로 쓴다</text><rect x="34" y="346" width="336" height="58" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="50" y="381" text-anchor="start">5</text><text class="ink sm" x="74" y="370" text-anchor="start">아직 결론을 믿지 않는 사람에게</text><text class="ink sm" x="74" y="390" text-anchor="start">이유가 되는가</text><path d="M370 375 L400 375" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)"/><rect x="408" y="346" width="458" height="58" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="422" y="370" text-anchor="start">선결문제 요구 — 결론을 이미 받아들인 사람만</text><text class="ink2 sm" x="422" y="390" text-anchor="start">전제를 받아들일 수 있다. 타당해도 소용이 없다</text><text class="ink2 sm" x="34" y="430" text-anchor="start">오른쪽 칸의 이름들은 어느 것도 그 자체로 판정이 아니다. 판정은 왼쪽 물음 가운데 무엇이 왜 깨졌는지를 대는 것이고,</text><text class="ink2 sm" x="34" y="450" text-anchor="start">같은 이름이 붙는 논증이라도 관문을 통과하면 좋은 논증이다.</text>
</svg>