<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 366" width="830" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">정당화의 후퇴와 그 끝 세 가지</title><desc id="d">근거를 계속 묻는 사슬은 무한히 이어지거나 기초에서 멈추거나 되돌아온다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
