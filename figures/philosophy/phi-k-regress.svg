<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="30" y="26" text-anchor="start">‘왜 그렇게 믿는가’ 를 계속 물으면 사슬이 생긴다. 그 사슬의 끝은 셋뿐이다</text><text class="ink bold sm" x="30" y="74" text-anchor="start">무한주의</text><text class="ink2 sm" x="30" y="92" text-anchor="start">멈추지 않는다</text><rect x="118" y="60" width="74" height="36" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="155" y="83" text-anchor="middle">믿음 P</text><rect x="226" y="60" width="74" height="36" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="263" y="83" text-anchor="middle">근거 1</text><path d="M220 78 L205 78" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M198 78 L205 73.66 L205 82.34 z" fill="var(--ink2)"/><rect x="334" y="60" width="74" height="36" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="371" y="83" text-anchor="middle">근거 2</text><path d="M328 78 L313 78" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M306 78 L313 73.66 L313 82.34 z" fill="var(--ink2)"/><rect x="442" y="60" width="74" height="36" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="479" y="83" text-anchor="middle">근거 3</text><path d="M436 78 L421 78" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M414 78 L421 73.66 L421 82.34 z" fill="var(--ink2)"/><text class="ink sm" x="556" y="84" text-anchor="start">· · · · ·</text><text class="ink2 sm" x="608" y="78" text-anchor="start">끝없이 새로운 근거가</text><text class="ink2 sm" x="608" y="94" text-anchor="start">계속 이어진다</text><text class="ink bold sm" x="30" y="174" text-anchor="start">토대론</text><text class="ink2 sm" x="30" y="192" text-anchor="start">어디선가 멈춘다</text><rect x="118" y="160" width="74" height="36" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="155" y="183" text-anchor="middle">믿음 P</text><rect x="226" y="160" width="74" height="36" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="263" y="183" text-anchor="middle">근거 1</text><path d="M220 178 L205 178" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M198 178 L205 173.66 L205 182.34 z" fill="var(--ink2)"/><rect x="334" y="160" width="74" height="36" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="371" y="183" text-anchor="middle">근거 2</text><path d="M328 178 L313 178" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M306 178 L313 173.66 L313 182.34 z" fill="var(--ink2)"/><rect x="442" y="160" width="118" height="36" rx="4" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="2"/><text class="ink bold sm" x="501" y="183" text-anchor="middle">기초 믿음</text><path d="M436 178 L421 178" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M414 178 L421 173.66 L421 182.34 z" fill="var(--ink2)"/><text class="ink2 sm" x="576" y="172" text-anchor="start">다른 믿음에 기대지 않고</text><text class="ink2 sm" x="576" y="188" text-anchor="start">정당화된다고 말한다</text><text class="ink bold sm" x="30" y="274" text-anchor="start">정합론</text><text class="ink2 sm" x="30" y="292" text-anchor="start">되돌아온다</text><rect x="118" y="260" width="74" height="36" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="155" y="283" text-anchor="middle">믿음 P</text><rect x="226" y="260" width="74" height="36" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="263" y="283" text-anchor="middle">근거 1</text><path d="M220 278 L205 278" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M198 278 L205 273.66 L205 282.34 z" fill="var(--ink2)"/><rect x="334" y="260" width="74" height="36" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="371" y="283" text-anchor="middle">근거 2</text><path d="M328 278 L313 278" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M306 278 L313 273.66 L313 282.34 z" fill="var(--ink2)"/><path d="M118 296 Q260 340 410 296" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><path d="M118 296 L130 304 L132 290 z" fill="var(--s3)"/><text class="ink2 sm" x="264" y="340" text-anchor="middle">서로가 서로를 받친다</text><text class="ink2 sm" x="486" y="272" text-anchor="start">사슬이 아니라 그물이라고</text><text class="ink2 sm" x="486" y="288" text-anchor="start">고쳐 말한다</text><text class="ink2 sm" x="30" y="336" text-anchor="start">넷째 길도 있다 —</text><text class="ink2 sm" x="30" y="354" text-anchor="start">정당화된 믿음이 없다</text>
</svg>