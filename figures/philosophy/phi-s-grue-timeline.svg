<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 336" width="782" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">그루 — 같은 자료에서 갈라지는 두 예측</title><desc id="d">시각 t 이전의 관찰은 초록 가설과 그루 가설에 똑같이 맞고, t 이후의 예측만 갈린다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">같은 자료에서 갈라지는 두 예측</text><path class="ax" fill="none" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M58 172 L742 172"/><text class="ink2 sm" x="742" y="192" text-anchor="end">시각</text><path d="M400 74 L400 266" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><text class="ink bold" x="400" y="66" text-anchor="middle">시각 t</text><circle cx="100" cy="172" r="5.5" fill="var(--s3)"/><circle cx="136" cy="172" r="5.5" fill="var(--s3)"/><circle cx="172" cy="172" r="5.5" fill="var(--s3)"/><circle cx="208" cy="172" r="5.5" fill="var(--s3)"/><circle cx="244" cy="172" r="5.5" fill="var(--s3)"/><circle cx="280" cy="172" r="5.5" fill="var(--s3)"/><circle cx="316" cy="172" r="5.5" fill="var(--s3)"/><circle cx="352" cy="172" r="5.5" fill="var(--s3)"/><text class="ink sm" x="96" y="150" text-anchor="start">지금까지 관찰한 에메랄드 — 모두 초록이고, 모두 그루다</text><path d="M400 172 L700 124" fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round"/><path d="M400 172 L700 232" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="520" cy="153.6" r="5.5" fill="var(--s3)"/><circle cx="520" cy="196" r="5.5" fill="var(--s1)"/><circle cx="600" cy="141.33" r="5.5" fill="var(--s3)"/><circle cx="600" cy="212" r="5.5" fill="var(--s1)"/><circle cx="680" cy="129.07" r="5.5" fill="var(--s3)"/><circle cx="680" cy="228" r="5.5" fill="var(--s1)"/><text class="ink sm" x="556" y="110" text-anchor="middle">‘초록’ 을 투사하면 — 앞으로도 초록</text><text class="ink sm" x="556" y="258" text-anchor="middle">‘그루’ 를 투사하면 — 앞으로는 파랑</text><text class="ink2 sm" x="36" y="296" text-anchor="start">그루 — 시각 t 이전에 관찰되었고 초록이거나, 그렇지 않고 파랑인</text><text class="ink2 sm" x="36" y="316" text-anchor="start">왼쪽 절반이 두 가설에 똑같다. 자료가 아니라 술어를 고르는 일이 예측을 가른다</text>
</svg>