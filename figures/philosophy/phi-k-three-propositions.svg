<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 366" width="838" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">회의주의 논증의 세 명제와 세 가지 선택</title><desc id="d">함께 참일 수 없는 세 명제 가운데 무엇을 버리느냐로 회의주의 무어 노직의 길이 갈린다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="24" y="26" text-anchor="start">이 세 명제는 함께 참일 수 없다. 어느 것을 버리든 값을 치른다</text><rect x="24" y="42" width="246" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="147" y="66" text-anchor="middle">회의주의</text><rect x="38" y="82" width="218" height="46" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="48" y="102" text-anchor="start">(1) 나는 내가 통 속의 뇌가</text><text class="ink sm" x="48" y="118" text-anchor="start">     아님을 알지 못한다</text><rect x="38" y="138" width="218" height="46" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="48" y="158" text-anchor="start">(2) 손이 있음을 안다면</text><text class="ink sm" x="48" y="174" text-anchor="start">     통 속의 뇌가 아님도 안다</text><rect x="38" y="194" width="218" height="46" rx="4" fill="var(--s2)" fill-opacity="0.08" stroke="var(--s2)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="ink2 sm" x="48" y="214" text-anchor="start">(3) 나는 내가 손이</text><text class="ink2 sm" x="48" y="230" text-anchor="start">     있음을 안다</text><path d="M44 202 L236 232" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"/><text class="ink2 sm" x="38" y="260" text-anchor="start">(3) 을 버린다</text><text class="ink2 sm" x="38" y="276" text-anchor="start">값 — 우리가 안다고 여기는</text><text class="ink2 sm" x="38" y="292" text-anchor="start">거의 전부를 내놓는다</text><rect x="296" y="42" width="246" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="419" y="66" text-anchor="middle">무어 · 외재주의</text><rect x="310" y="82" width="218" height="46" rx="4" fill="var(--s2)" fill-opacity="0.08" stroke="var(--s2)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="ink2 sm" x="320" y="102" text-anchor="start">(1) 나는 내가 통 속의 뇌가</text><text class="ink2 sm" x="320" y="118" text-anchor="start">     아님을 알지 못한다</text><path d="M316 90 L508 120" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"/><rect x="310" y="138" width="218" height="46" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="320" y="158" text-anchor="start">(2) 손이 있음을 안다면</text><text class="ink sm" x="320" y="174" text-anchor="start">     통 속의 뇌가 아님도 안다</text><rect x="310" y="194" width="218" height="46" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="320" y="214" text-anchor="start">(3) 나는 내가 손이</text><text class="ink sm" x="320" y="230" text-anchor="start">     있음을 안다</text><text class="ink2 sm" x="310" y="260" text-anchor="start">(1) 을 버린다</text><text class="ink2 sm" x="310" y="276" text-anchor="start">값 — 통 속의 뇌가 아님을</text><text class="ink2 sm" x="310" y="292" text-anchor="start">어떻게 아는지 말해야 한다</text><rect x="568" y="42" width="246" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="691" y="66" text-anchor="middle">노직 · 드레츠키</text><rect x="582" y="82" width="218" height="46" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="592" y="102" text-anchor="start">(1) 나는 내가 통 속의 뇌가</text><text class="ink sm" x="592" y="118" text-anchor="start">     아님을 알지 못한다</text><rect x="582" y="138" width="218" height="46" rx="4" fill="var(--s2)" fill-opacity="0.08" stroke="var(--s2)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="ink2 sm" x="592" y="158" text-anchor="start">(2) 손이 있음을 안다면</text><text class="ink2 sm" x="592" y="174" text-anchor="start">     통 속의 뇌가 아님도 안다</text><path d="M588 146 L780 176" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"/><rect x="582" y="194" width="218" height="46" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="592" y="214" text-anchor="start">(3) 나는 내가 손이</text><text class="ink sm" x="592" y="230" text-anchor="start">     있음을 안다</text><text class="ink2 sm" x="582" y="260" text-anchor="start">(2) 를 버린다</text><text class="ink2 sm" x="582" y="276" text-anchor="start">값 — 폐쇄 원리를 포기한다</text><text class="ink2 sm" x="582" y="292" text-anchor="start">아는 것의 귀결을 모를 수 있게 된다</text><text class="ink2 sm" x="24" y="330" text-anchor="start">이 그림에는 정답 칸이 없다. 셋 다 살아 있는 길이고, 어느 값을 치르는 것이 나은지가 아직 정해지지 않았다.</text><text class="ink2 sm" x="24" y="352" text-anchor="start">맥락주의는 넷째 길을 낸다 — 세 명제의 ‘안다’ 가 같은 뜻이 아니라서 애초에 부딪치지 않는다고 말한다</text>
</svg>