<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">앎의 세 조건과 각각을 빼면 통과해 버리는 사례</title><desc id="d">믿음·참·정당화 각 조건을 하나씩 제거하면 앎이 아닌 사례가 통과한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="34" y="26" text-anchor="start">앎의 세 조건 — 하나씩 빼 보면 그 조건이 무엇을 막고 있는지 드러난다</text><rect x="34" y="44" width="228" height="66" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.7"/><text class="ink bold" x="48" y="66" text-anchor="start">믿음</text><text class="ink2 sm" x="48" y="88" text-anchor="start">갑은 P 라고 믿는다</text><path d="M148 112 L148 133" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M148 140 L143.66 133 L152.34 133 z" fill="var(--ink2)"/><text class="ink2 sm" x="156" y="132" text-anchor="start">이 조건만 빼면</text><rect x="34" y="146" width="228" height="68" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="48" y="170" text-anchor="start">갑은 답을 맞혔지만</text><text class="ink sm" x="48" y="187" text-anchor="start">스스로는 찍었다고 여긴다</text><path d="M148 216 L148 233" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M148 240 L143.66 233 L152.34 233 z" fill="var(--ink2)"/><rect x="34" y="246" width="228" height="58" rx="5" fill="var(--grid)" fill-opacity="0.35" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="48" y="268" text-anchor="start">자기가 안 믿는 것을</text><text class="ink sm" x="48" y="284" text-anchor="start">안다고 하지 않는다</text><rect x="296" y="44" width="228" height="66" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold" x="310" y="66" text-anchor="start">참</text><text class="ink2 sm" x="310" y="88" text-anchor="start">P 가 참이다</text><path d="M410 112 L410 133" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M410 140 L405.66 133 L414.34 133 z" fill="var(--ink2)"/><text class="ink2 sm" x="418" y="132" text-anchor="start">이 조건만 빼면</text><rect x="296" y="146" width="228" height="68" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="310" y="170" text-anchor="start">갑은 확신을 가지고</text><text class="ink sm" x="310" y="187" text-anchor="start">거짓을 주장한다</text><path d="M410 216 L410 233" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M410 240 L405.66 233 L414.34 233 z" fill="var(--ink2)"/><rect x="296" y="246" width="228" height="58" rx="5" fill="var(--grid)" fill-opacity="0.35" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="310" y="268" text-anchor="start">거짓을 안다고</text><text class="ink sm" x="310" y="284" text-anchor="start">하지 않는다</text><rect x="558" y="44" width="228" height="66" rx="4" fill="var(--s3)" fill-opacity="0.12" stroke="var(--s3)" stroke-width="1.7"/><text class="ink bold" x="572" y="66" text-anchor="start">정당화</text><text class="ink2 sm" x="572" y="88" text-anchor="start">갑은 P 를 믿을</text><text class="ink2 sm" x="572" y="103" text-anchor="start">정당한 근거를 가진다</text><path d="M672 112 L672 133" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M672 140 L667.66 133 L676.34 133 z" fill="var(--ink2)"/><text class="ink2 sm" x="680" y="132" text-anchor="start">이 조건만 빼면</text><rect x="558" y="146" width="228" height="68" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="572" y="170" text-anchor="start">갑은 아무 근거 없이 찍었고</text><text class="ink sm" x="572" y="187" text-anchor="start">우연히 맞았다</text><path d="M672 216 L672 233" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M672 240 L667.66 233 L676.34 233 z" fill="var(--ink2)"/><rect x="558" y="246" width="228" height="58" rx="5" fill="var(--grid)" fill-opacity="0.35" stroke="var(--grid)" stroke-width="1.2"/><text class="ink sm" x="572" y="268" text-anchor="start">운으로 맞힌 것을</text><text class="ink sm" x="572" y="284" text-anchor="start">안다고 하지 않는다</text><text class="ink2 sm" x="34" y="330" text-anchor="start">셋 다 필요하다는 것이 여기까지의 결론이다. 셋을 합치면 충분한가 — 그것을 무너뜨리는 것이 게티어 사례다</text>
</svg>