<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">트롤리 사례와 세 원리의 예측을 맞춰 본 격자</title><desc id="d">갈림길과 육교에서는 세 원리가 실제 판단과 맞지만 고리 궤도에서 둘이 어긋난다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">세 원리가 예측하는 판정과 실제로 나오는 판정</text><rect x="40" y="50" width="196" height="54" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="72" text-anchor="start">아래로 — 사례</text><text class="ink bold sm" x="50" y="90" text-anchor="start">옆으로 — 무엇이 말하는가</text><rect x="236" y="50" width="166" height="54" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="319" y="82" text-anchor="middle">대다수의 판단</text><rect x="402" y="50" width="166" height="54" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="485" y="82" text-anchor="middle">이중효과</text><rect x="568" y="50" width="166" height="54" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="651" y="82" text-anchor="middle">수단으로 씀</text><rect x="734" y="50" width="166" height="54" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="817" y="82" text-anchor="middle">위협의 방향 전환</text><rect x="40" y="104" width="196" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="128" text-anchor="start">갈림길</text><text class="ink2 sm" x="50" y="148" text-anchor="start">스위치를 당긴다</text><rect x="236" y="104" width="166" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="319" y="134" text-anchor="middle">허용</text><rect x="402" y="104" width="166" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="485" y="134" text-anchor="middle">허용</text><rect x="568" y="104" width="166" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="651" y="134" text-anchor="middle">허용</text><rect x="734" y="104" width="166" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="817" y="134" text-anchor="middle">허용</text><rect x="40" y="166" width="196" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="190" text-anchor="start">육교</text><text class="ink2 sm" x="50" y="210" text-anchor="start">사람을 민다</text><rect x="236" y="166" width="166" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="319" y="196" text-anchor="middle">안 된다</text><rect x="402" y="166" width="166" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="485" y="196" text-anchor="middle">안 된다</text><rect x="568" y="166" width="166" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="651" y="196" text-anchor="middle">안 된다</text><rect x="734" y="166" width="166" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="817" y="196" text-anchor="middle">안 된다</text><rect x="40" y="228" width="196" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="252" text-anchor="start">고리 궤도</text><text class="ink2 sm" x="50" y="272" text-anchor="start">옆 선로가 본선으로 돌아온다</text><rect x="236" y="228" width="166" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="319" y="258" text-anchor="middle">대체로 허용</text><rect x="402" y="228" width="166" height="62" rx="3" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="485" y="258" text-anchor="middle">안 된다</text><text class="ink2 sm" x="485" y="278" text-anchor="middle">판단과 어긋난다</text><rect x="568" y="228" width="166" height="62" rx="3" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="651" y="258" text-anchor="middle">안 된다</text><text class="ink2 sm" x="651" y="278" text-anchor="middle">판단과 어긋난다</text><rect x="734" y="228" width="166" height="62" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="817" y="258" text-anchor="middle">허용</text><text class="ink2 sm" x="40" y="320" text-anchor="start">고리 궤도에서 세 원리 가운데 둘이 실제 판단과 어긋난다. 남은 하나도 다른 변형에서 걸린다</text><text class="ink2 sm" x="40" y="341" text-anchor="start">표를 다 채우는 원리를 아직 아무도 내놓지 못했다. 그것이 이 사례들이 남기는 결과다</text><text class="ink2 sm" x="40" y="362" text-anchor="start">결과주의는 세 사례를 모두 같게 본다. 그래서 판단의 차이를 원리로 설명하는 대신 편향으로 설명해야 한다</text>
</svg>