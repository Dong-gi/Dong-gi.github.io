<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="820" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">유형과 사례 — 세는 물음이 둘이다</title><desc id="d">바나나의 글자는 사례로 셋 유형으로 둘이고 서점의 같은 책은 사례로 다섯 유형으로 하나다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">‘몇 개 있는가’ 는 사실 두 물음이다</text><rect x="36" y="44" width="366" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="219" y="70" text-anchor="middle">낱말 ‘바나나’ 의 글자를 센다</text><rect x="103" y="88" width="64" height="48" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="135" y="118" text-anchor="middle">바</text><rect x="187" y="88" width="64" height="48" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="219" y="118" text-anchor="middle">나</text><rect x="271" y="88" width="64" height="48" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="303" y="118" text-anchor="middle">나</text><text class="ink2 sm" x="219" y="156" text-anchor="middle">사례 셋</text><path d="M219 166 L219 194" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)"/><rect x="143" y="198" width="64" height="44" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="175" y="226" text-anchor="middle">바</text><rect x="231" y="198" width="64" height="44" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="263" y="226" text-anchor="middle">나</text><text class="ink bold sm" x="219" y="266" text-anchor="middle">유형 둘</text><rect x="434" y="44" width="366" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="617" y="70" text-anchor="middle">서점에 놓인 같은 책을 센다</text><rect x="499" y="88" width="36" height="48" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.4"/><rect x="549" y="88" width="36" height="48" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.4"/><rect x="599" y="88" width="36" height="48" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.4"/><rect x="649" y="88" width="36" height="48" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.4"/><rect x="699" y="88" width="36" height="48" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.4"/><text class="ink2 sm" x="617" y="156" text-anchor="middle">사례 다섯</text><path d="M617 166 L617 194" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)"/><rect x="557" y="198" width="120" height="44" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="617" y="226" text-anchor="middle">그 책</text><text class="ink bold sm" x="617" y="266" text-anchor="middle">유형 하나</text><text class="ink2 sm" x="36" y="318" text-anchor="start">왼쪽에 셋이라 답하면 사례를 센 것이고 둘이라 답하면 유형을 센 것이다. 둘 다 맞다 — 다른 것을 센 것뿐이다</text><text class="ink2 sm" x="36" y="337" text-anchor="start">유형은 보편자 쪽에, 사례는 개별자 쪽에 놓인다. 그래서 유명론자는 유형을 말하는 문장을 다시 써야 할 빚을 진다</text><text class="ink2 sm" x="36" y="356" text-anchor="start">이 구분은 14장에서 유형 동일론과 사례 동일론을 가를 때 그대로 쓰인다</text>
</svg>