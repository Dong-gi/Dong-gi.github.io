<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 414" width="840" height="414" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">자유의지 논쟁의 네 자리</title><desc id="d">양립하는가와 자유의지가 있는가, 두 물음의 답 조합이 양립가능론·양립가능론적 회의론·자유지상론·강한 결정론을 만든다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">두 물음의 답을 조합하면 네 자리가 나온다</text><rect x="40" y="48" width="168" height="42" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="66" text-anchor="start">아래로 — 양립하는가</text><text class="ink bold sm" x="50" y="82" text-anchor="start">옆으로 — 자유의지가</text><rect x="208" y="48" width="316" height="42" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="220" y="74" text-anchor="start">우리에게 자유의지가 있다</text><rect x="524" y="48" width="316" height="42" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="536" y="74" text-anchor="start">우리에게 자유의지가 없다</text><rect x="40" y="90" width="168" height="116" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="116" text-anchor="start">양립한다</text><text class="ink2 sm" x="50" y="138" text-anchor="start">결정론이 참이어도</text><text class="ink2 sm" x="50" y="156" text-anchor="start">자유는 있을 수 있다</text><rect x="208" y="90" width="316" height="116" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.9"/><text class="ink bold sm" x="220" y="114" text-anchor="start">양립가능론 — 다수설</text><text class="ink2 sm" x="220" y="136" text-anchor="start">결정론이 참이어도 자유는 있을 수 있고,</text><text class="ink2 sm" x="220" y="154" text-anchor="start">실제로 우리에게 있다고 본다</text><text class="ink2 sm" x="220" y="172" text-anchor="start">자유를 강제·강박의 부재로 다시 잡는다</text><rect x="524" y="90" width="316" height="116" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="536" y="114" text-anchor="start">양립가능론적 회의론 — 드물다</text><text class="ink2 sm" x="536" y="136" text-anchor="start">양립은 하지만 자유의 조건이 실제로는</text><text class="ink2 sm" x="536" y="154" text-anchor="start">충족되지 않는다고 본다</text><text class="ink2 sm" x="536" y="172" text-anchor="start">자리는 비어 있지 않으나 드물게 채워진다</text><rect x="40" y="206" width="168" height="116" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="232" text-anchor="start">양립하지 않는다</text><text class="ink2 sm" x="50" y="254" text-anchor="start">결정론이 참이면</text><text class="ink2 sm" x="50" y="272" text-anchor="start">자유는 없다</text><rect x="208" y="206" width="316" height="116" rx="3" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="220" y="230" text-anchor="start">자유지상론</text><text class="ink2 sm" x="220" y="252" text-anchor="start">자유의지가 있으므로 결정론은 거짓이다</text><text class="ink2 sm" x="220" y="270" text-anchor="start">비결정성이 어디에 어떻게 놓여야</text><text class="ink2 sm" x="220" y="288" text-anchor="start">자유가 되는지를 말해야 한다</text><rect x="524" y="206" width="316" height="116" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.9"/><text class="ink bold sm" x="536" y="230" text-anchor="start">강한 결정론 · 강한 비양립가능론</text><text class="ink2 sm" x="536" y="252" text-anchor="start">자유의지는 없다. 결정론이 참이어서든,</text><text class="ink2 sm" x="536" y="270" text-anchor="start">거짓이더라도 비결정성이 자유를</text><text class="ink2 sm" x="536" y="288" text-anchor="start">만들어 주지 않아서든</text><text class="ink2 sm" x="40" y="348" text-anchor="start">‘결정론은 실제로 참인가’ 는 이 표의 축이 아니다. 그것이 셋째 물음이다</text><text class="ink2 sm" x="40" y="370" text-anchor="start">양립가능론은 결정론이 참이라고 주장하는 입장이 아니다. 참이든 거짓이든 자유는 무사하다고 말할 뿐이다</text><text class="ink2 sm" x="40" y="392" text-anchor="start">셋째 물음에 걸려 있는 것은 자유지상론뿐이다. 자유가 있다는 주장에서 결정론이 거짓이라는 결론이 곧바로 따라 나온다</text>
</svg>