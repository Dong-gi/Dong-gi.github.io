<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">행위의 도덕적 칸을 이론마다 다르게 나눈 띠 그림</title><desc id="d">금지·의무·허용·초과 의무의 경계가 네 이론에서 각각 다른 자리에 그어진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">어떤 행위가 어느 칸에 들어가는가 — 이론마다 선이 다르다</text><text class="ink bold sm" x="40" y="76" text-anchor="start">엄격한 행위 공리주의</text><rect x="232" y="58" width="376.96" height="40" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="420.48" y="82" text-anchor="middle">금지 — 최선이 아닌 것은 모두</text><rect x="608.96" y="58" width="231.04" height="40" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="724.48" y="82" text-anchor="middle">의무 — 최선인 것</text><text class="ink bold sm" x="40" y="144" text-anchor="start">문턱을 둔 결과주의</text><text class="ink2 sm" x="40" y="160" text-anchor="start">충분히 좋으면 허용한다</text><rect x="232" y="132" width="182.4" height="40" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="323.2" y="156" text-anchor="middle">금지</text><rect x="414.4" y="132" width="194.56" height="40" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="511.68" y="156" text-anchor="middle">의무</text><rect x="608.96" y="132" width="231.04" height="40" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="724.48" y="156" text-anchor="middle">해도 되고 안 해도 된다</text><text class="ink bold sm" x="40" y="218" text-anchor="start">의무론</text><text class="ink2 sm" x="40" y="234" text-anchor="start">제약과 선택지가 함께 있다</text><rect x="232" y="206" width="145.92" height="40" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="304.96" y="230" text-anchor="middle">제약 — 결과가 좋아도 금지</text><rect x="377.92" y="206" width="109.44" height="40" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="432.64" y="230" text-anchor="middle">의무</text><rect x="487.36" y="206" width="255.36" height="40" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="615.04" y="230" text-anchor="middle">선택지 — 해도 되고 안 해도 된다</text><rect x="742.72" y="206" width="97.28" height="40" rx="3" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="791.36" y="230" text-anchor="middle">초과 의무</text><text class="ink bold sm" x="40" y="292" text-anchor="start">덕 윤리</text><text class="ink2 sm" x="40" y="308" text-anchor="start">선을 규칙으로 긋지 않는다</text><rect x="232" y="280" width="608" height="40" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="ink sm" x="536" y="304" text-anchor="middle">유덕한 사람이 그 상황에서 무엇을 할지로 답한다</text><text class="ink2 sm" x="40" y="350" text-anchor="start">가장 눈에 띄는 것은 첫째 줄이다. 엄격한 행위 공리주의에는 ‘해도 되고 안 해도 되는’ 칸이 아예 없다</text><text class="ink2 sm" x="40" y="371" text-anchor="start">19장의 요구 과잉 논쟁은 이 가운데 띠가 얼마나 넓어야 하는가에 대한 다툼이다</text>
</svg>