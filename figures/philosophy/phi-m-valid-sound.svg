<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 806 350" width="806" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">타당·건전 되짚기</title><desc id="d">타당한가와 전제가 실제로 참인가를 두 축으로 놓은 네 칸</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="28" text-anchor="start">타당한가와 전제가 참인가는 다른 물음이다</text><rect x="36" y="48" width="140" height="42" rx="4" fill="var(--grid)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><rect x="176" y="48" width="294" height="42" rx="4" fill="var(--grid)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><rect x="470" y="48" width="294" height="42" rx="4" fill="var(--grid)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="188" y="74" text-anchor="start">전제가 실제로 모두 참</text><text class="ink bold sm" x="482" y="74" text-anchor="start">전제 가운데 거짓이 있다</text><rect x="36" y="90" width="140" height="84" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold" x="50" y="138" text-anchor="start">타당</text><rect x="176" y="90" width="294" height="84" rx="4" fill="var(--s1)" fill-opacity="0.07" stroke="var(--ink2)" stroke-width="1.2"/><rect x="470" y="90" width="294" height="84" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="188" y="122" text-anchor="start">건전하다</text><text class="ink2 sm" x="188" y="146" text-anchor="start">결론은 반드시 참이다</text><text class="ink bold sm" x="482" y="122" text-anchor="start">건전하지 않다</text><text class="ink2 sm" x="482" y="146" text-anchor="start">결론이 참인지는 이 논증으로 알 수 없다</text><rect x="36" y="174" width="140" height="84" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold" x="50" y="222" text-anchor="start">부당</text><rect x="176" y="174" width="294" height="84" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="470" y="174" width="294" height="84" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="188" y="206" text-anchor="start">건전하지 않다</text><text class="ink2 sm" x="188" y="230" text-anchor="start">반례가 있다. 결론이 참이더라도 이 논증 덕분이 아니다</text><text class="ink bold sm" x="482" y="206" text-anchor="start">건전하지 않다</text><text class="ink2 sm" x="482" y="230" text-anchor="start">전제도 어긋났고 짜임도 어긋났다</text><text class="ink2 sm" x="36" y="286" text-anchor="start">왼쪽 물음(타당한가)은 전제를 참이라고 쳤을 때의 물음이고, 위쪽 물음(전제가 참인가)은 세상에 대한 물음이다.</text><text class="ink2 sm" x="36" y="305" text-anchor="start">반례 하나 — 전제를 모두 참으로 만들면서 결론을 거짓으로 만드는 상황 — 가 있으면 아래 줄이고, 없으면 위 줄이다.</text>
</svg>