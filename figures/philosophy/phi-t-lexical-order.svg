<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 424" width="840" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">롤스의 두 원칙과 축차적 서열</title><desc id="d">세 단이 위에서 아래로 놓인 사다리. 평등한 기본적 자유가 첫째, 공정한 기회균등이 둘째, 차등 원칙이 셋째다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">두 원칙은 순서를 갖는다 — 축차적 서열</text><text class="ink2 sm" x="40" y="50" text-anchor="start">위 단이 충족되기 전에는 아래 단으로 내려가지 않는다. 아래 단의 이익으로 위 단을 사지 못한다</text><rect x="40" y="72" width="620" height="74" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.9"/><text class="ink bold sm" x="52" y="96" text-anchor="start">1단 — 제1원칙: 평등한 기본적 자유</text><text class="ink2 sm" x="52" y="118" text-anchor="start">각자가 같은 기본적 자유의 체계에 대해 동등한 권리를 갖는다.</text><text class="ink2 sm" x="52" y="136" text-anchor="start">양심·사상·정치 참여·신체의 자유, 법의 지배. 자유는 자유를 위해서만 제한된다</text><rect x="40" y="160" width="620" height="74" rx="3" fill="var(--s3)" fill-opacity="0.12" stroke="var(--s3)" stroke-width="1.9"/><text class="ink bold sm" x="52" y="184" text-anchor="start">2단 — 제2원칙 (a): 공정한 기회균등</text><text class="ink2 sm" x="52" y="206" text-anchor="start">직위와 직책이 형식적으로만이 아니라 실질적으로 모두에게 열려 있어야 한다.</text><text class="ink2 sm" x="52" y="224" text-anchor="start">같은 재능과 같은 의지를 가진 사람은 태어난 집안과 무관하게 같은 전망을 가져야 한다</text><rect x="40" y="248" width="620" height="74" rx="3" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="52" y="272" text-anchor="start">3단 — 제2원칙 (b): 차등 원칙</text><text class="ink2 sm" x="52" y="294" text-anchor="start">남는 사회경제적 불평등은 가장 불리한 처지에 있는 사람들에게</text><text class="ink2 sm" x="52" y="312" text-anchor="start">가장 큰 이익이 될 때에만 허용된다</text><path class="s1" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M694 92 L694 310"/><text class="ink2 sm" x="706" y="112" text-anchor="start">먼저</text><text class="ink2 sm" x="706" y="200" text-anchor="start">그 다음</text><text class="ink2 sm" x="706" y="288" text-anchor="start">마지막</text><text class="ink2 sm" x="40" y="354" text-anchor="start">이 순서를 빼고 요약하면 롤스가 아닌 다른 이론이 된다. 차등 원칙만 떼어 놓으면 자유를 팔아 몫을 사는 일이 허용되어 버린다</text><text class="ink2 sm" x="40" y="376" text-anchor="start">롤스가 든 예 — 가난한 사람의 몫을 크게 늘려 준다는 대가로 투표권을 거두는 안은 이 서열 아래에서 시작부터 후보가 되지 못한다</text><text class="ink2 sm" x="40" y="398" text-anchor="start">차등 원칙이 재는 것은 개인이 아니라 가장 불리한 처지라는 자리이고, 재는 눈금은 한 시점의 소득이 아니라 평생에 걸친 기본 가치의 전망이다</text>
</svg>