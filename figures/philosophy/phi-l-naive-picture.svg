<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 474" width="880" height="474" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">소박한 그림과 프레게의 세 수수께끼</title><desc id="d">이름에서 대상으로 가는 화살표 하나가 소박한 그림의 전부이고, 세 수수께끼가 그 화살표의 서로 다른 자리를 친다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">소박한 그림 — 이름의 의미는 그것이 가리키는 것이다</text><rect x="36" y="44" width="808" height="150" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="96" y="92" width="178" height="52" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold" x="185" y="124" text-anchor="middle">이름 ‘샛별’</text><circle cx="66" cy="118" r="11" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold sm" x="66" y="122.5" text-anchor="middle">1</text><path d="M284 118 L628 118" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)"/><text class="ink sm" x="456" y="106" text-anchor="middle">가리킨다 — 그리고 이것이 의미의 전부다</text><circle cx="456" cy="146" r="11" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold sm" x="456" y="150.5" text-anchor="middle">2</text><circle cx="680" cy="118" r="38" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="680" y="124" text-anchor="middle">금성</text><circle cx="756" cy="118" r="11" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="756" y="122.5" text-anchor="middle">3</text><text class="ink2 sm" x="440" y="180" text-anchor="middle">이름이 문장에 보태는 것은 저 대상 하나뿐이다</text><path d="M36 214 L844 214" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round"/><circle cx="60" cy="244" r="11" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold sm" x="60" y="248.5" text-anchor="middle">1</text><text class="ink bold sm" x="86" y="240" text-anchor="start">두 이름이 든 두 문장의 정보값이 다르다</text><text class="ink2 sm" x="86" y="264" text-anchor="start">‘샛별은 샛별이다’ 는 알려 주는 것이 없는데 ‘샛별은 개밥바라기다’ 는 알려 준다</text><text class="ink2 sm" x="844" y="240" text-anchor="end">치는 자리 — 이름 칸</text><path d="M36 286 L844 286" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round"/><circle cx="60" cy="316" r="11" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold sm" x="60" y="320.5" text-anchor="middle">2</text><text class="ink bold sm" x="86" y="312" text-anchor="start">바꿔 넣으면 문장의 값이 바뀐다</text><text class="ink2 sm" x="86" y="336" text-anchor="start">‘영수는 샛별이 새벽에 뜬다고 믿는다’ 가 참인데 이름만 바꾸면 거짓이 된다</text><text class="ink2 sm" x="844" y="312" text-anchor="end">치는 자리 — 화살표</text><path d="M36 358 L844 358" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round"/><circle cx="60" cy="388" r="11" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="60" y="392.5" text-anchor="middle">3</text><text class="ink bold sm" x="86" y="384" text-anchor="start">가리킬 것이 없는 이름이 있다</text><text class="ink2 sm" x="86" y="408" text-anchor="start">‘페가수스는 없다’ 를 우리는 이해하고 참이라 여긴다. 그런데 화살표 끝이 비어 있다</text><text class="ink2 sm" x="844" y="384" text-anchor="end">치는 자리 — 대상 칸</text><path d="M36 430 L844 430" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round"/><text class="ink2 sm" x="36" y="452" text-anchor="start">세 문장이 겨누는 것은 하나다 — ‘의미는 곧 지시체다’ 라는 등식. 다만 치는 자리가 각각 다르다</text>
</svg>