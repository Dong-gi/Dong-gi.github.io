<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">유형 동일론과 사례 동일론이 묶는 것</title><desc id="d">위 줄은 심적 유형과 물리 유형을 하나씩 묶고 아래 줄은 낱낱의 사건끼리 묶으며 다수 실현 논증은 위 줄만 끊는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">무엇과 무엇을 묶는가 — 두 주장의 세기가 다르다</text><rect x="40" y="44" width="820" height="152" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="58" y="70" text-anchor="start">유형 동일론 — 유형끼리 묶는다</text><rect x="64" y="92" width="212" height="48" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink sm" x="170" y="122" text-anchor="middle">심적 유형 — 고통</text><rect x="412" y="92" width="232" height="48" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink sm" x="528" y="122" text-anchor="middle">물리 유형 — C-섬유 발화</text><text class="ink2 sm" x="344" y="100" text-anchor="middle">같다</text><path d="M282 122 L406 122" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-start="url(#ar1)" marker-end="url(#ar1)"/><path d="M333 111 L355 133 M355 111 L333 133" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" fill="none"/><text class="ink bold sm" x="344" y="164" text-anchor="middle">다수 실현 논증이 여기를 끊는다</text><text class="ink2 sm" x="668" y="106" text-anchor="start">강하다</text><text class="ink2 sm" x="668" y="126" text-anchor="start">고통이 있는 곳에는 어디나</text><text class="ink2 sm" x="668" y="146" text-anchor="start">그 물리 유형이 있어야 한다</text><rect x="40" y="210" width="820" height="178" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="58" y="236" text-anchor="start">사례 동일론 — 낱낱의 사건끼리 묶는다</text><rect x="64" y="254" width="212" height="32" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="170" y="275" text-anchor="middle">지금 나의 이 아픔</text><rect x="412" y="254" width="232" height="32" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="528" y="275" text-anchor="middle">지금 내 뇌의 이 사건</text><path d="M282 270 L406 270" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-start="url(#ark)" marker-end="url(#ark)"/><rect x="64" y="296" width="212" height="32" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="170" y="317" text-anchor="middle">어제 그의 그 아픔</text><rect x="412" y="296" width="232" height="32" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="528" y="317" text-anchor="middle">그때 그의 뇌의 그 사건</text><path d="M282 312 L406 312" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-start="url(#ark)" marker-end="url(#ark)"/><rect x="64" y="338" width="212" height="32" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="170" y="359" text-anchor="middle">이 문어의 이 아픔</text><rect x="412" y="338" width="232" height="32" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="528" y="359" text-anchor="middle">이 문어의 신경계의 이 사건</text><path d="M282 354 L406 354" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-start="url(#ark)" marker-end="url(#ark)"/><text class="ink2 sm" x="668" y="268" text-anchor="start">약하다</text><text class="ink2 sm" x="668" y="288" text-anchor="start">짝마다 오른쪽이 서로 다른</text><text class="ink2 sm" x="668" y="308" text-anchor="start">종류의 사건이어도 된다</text><text class="ink2 sm" x="668" y="328" text-anchor="start">(칸 색이 다른 것이 그 뜻이다)</text><path d="M668 356 L674.4 362.4 L684 348.8" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text class="ink bold sm" x="694" y="361" text-anchor="start">이 줄은 그대로 남는다</text><text class="ink2 sm" x="40" y="416" text-anchor="start">위 줄이 참이면 아래 줄도 참이다. 그러나 아래 줄이 참이라고 위 줄이 참이 되지는 않는다</text><text class="ink2 sm" x="40" y="436" text-anchor="start">다음 절의 다수 실현 논증은 위 줄만 끊는다. 아래 줄은 조금도 다치지 않으므로 물리주의도 다치지 않는다</text><text class="ink2 sm" x="40" y="456" text-anchor="start">아래 줄만 남으면 잃는 것이 있다 — ‘고통이란 무엇인가’ 에 대한 일반적인 답이 없어진다</text>
</svg>