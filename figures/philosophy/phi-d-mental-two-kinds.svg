<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 462" width="890" height="462" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">물리적인 것과 마음을 아는 두 방식, 그리고 마음 상태의 두 갈래</title><desc id="d">왼쪽 줄과 오른쪽 줄이 어긋나는데도 가운데 화살표로 촘촘히 붙어 있고, 오른쪽 줄은 지향적 상태와 감각적 상태로 갈린다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">두 목록이 어긋나는데도 촘촘히 붙어 있다</text><rect x="40" y="46" width="316" height="190" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="56" y="72" text-anchor="start">물리적인 것을 아는 방식</text><text class="ink2 sm" x="56" y="100" text-anchor="start">공간의 어느 자리를 차지한다</text><text class="ink2 sm" x="56" y="121" text-anchor="start">크기와 모양과 질량이 있다</text><text class="ink2 sm" x="56" y="142" text-anchor="start">누구나 볼 수 있다</text><text class="ink2 sm" x="56" y="163" text-anchor="start">물리학 · 화학 · 생물학의 말로 적힌다</text><text class="ink2 sm" x="56" y="184" text-anchor="start">뇌도 그렇다 — 무게가 있고 자리가 있고</text><text class="ink2 sm" x="56" y="205" text-anchor="start">열어 보면 누구에게나 보인다</text><rect x="534" y="46" width="316" height="190" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="550" y="72" text-anchor="start">마음을 아는 방식</text><text class="ink2 sm" x="550" y="100" text-anchor="start">모양도 무게도 없다</text><text class="ink2 sm" x="550" y="121" text-anchor="start">머릿속 어느 자리냐는 물음이</text><text class="ink2 sm" x="550" y="142" text-anchor="start">이상하게 들린다</text><text class="ink2 sm" x="550" y="163" text-anchor="start">겪는 이에게만 그 방식으로 주어진다</text><text class="ink2 sm" x="550" y="184" text-anchor="start">남은 표정과 말과 뇌 영상을 볼 뿐</text><text class="ink2 sm" x="550" y="205" text-anchor="start">내가 겪는 방식으로 겪지는 못한다</text><text class="ink bold sm" x="445" y="86" text-anchor="middle">촘촘히 붙어 있다</text><path d="M374 106 L516 106" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M516 128 L374 128" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)"/><text class="ink2 sm" x="445" y="158" text-anchor="middle">마취제를 넣으면</text><text class="ink2 sm" x="445" y="178" text-anchor="middle">아픔이 사라진다</text><text class="ink2 sm" x="445" y="198" text-anchor="middle">뇌의 어느 부위가 상하면</text><text class="ink2 sm" x="445" y="218" text-anchor="middle">얼굴을 알아보지 못한다</text><text class="ink bold sm" x="40" y="270" text-anchor="start">오른쪽 줄은 다시 두 갈래로 갈린다 — 물리주의가 겪는 어려움이 갈래마다 다르기 때문이다</text><rect x="40" y="282" width="390" height="92" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.7"/><text class="ink bold sm" x="52" y="305" text-anchor="start">지향적 상태 — 무언가에 관한다</text><text class="ink2 sm" x="52" y="327" text-anchor="start">비가 온다는 믿음, 물을 마시고 싶다는 욕구</text><text class="ink2 sm" x="52" y="345" text-anchor="start">관하는 그 무엇을 내용이라 부른다</text><text class="ink2 sm" x="52" y="363" text-anchor="start">이쪽의 어려움은 15장의 지향성 절에서 다룬다</text><rect x="460" y="282" width="390" height="92" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold sm" x="472" y="305" text-anchor="start">감각적 상태 — 겪어지는 어떠함이 있다</text><text class="ink2 sm" x="472" y="327" text-anchor="start">치통, 빨강을 봄, 커피 냄새를 맡음</text><text class="ink2 sm" x="472" y="345" text-anchor="start">겪는 쪽에서 어떠함이 있다</text><text class="ink2 sm" x="472" y="363" text-anchor="start">이쪽의 어려움은 15장의 감각질 절에서 다룬다</text><text class="ink2 sm" x="40" y="402" text-anchor="start">두 갈래가 깨끗이 갈리지는 않는다. 무언가를 무서워하는 것은 내용도 갖고 느낌도 있다</text><text class="ink2 sm" x="40" y="422" text-anchor="start">이 그림이 보이는 것은 붙어 있음까지다. 붙어 있음과 같음은 다르다 —</text><text class="ink2 sm" x="40" y="442" text-anchor="start">붙어 있는 둘이 같은 것인지 다른 것인지를 두고 이 장의 입장들이 갈린다</text>
</svg>