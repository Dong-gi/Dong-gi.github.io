<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 372" width="872" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">선점과 과잉결정</title><desc id="d">대기하던 원인이 있을 때와 충분한 원인이 둘일 때 반사실 의존이 끊어진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">반사실 분석이 무너지는 두 자리</text><rect x="36" y="44" width="396" height="236" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="234" y="70" text-anchor="middle">선점 — 대기하던 원인이 있다</text><rect x="54" y="92" width="96" height="38" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="102" y="116" text-anchor="middle">갑이 쏜다</text><rect x="190" y="92" width="96" height="38" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="238" y="116" text-anchor="middle">총알이 간다</text><rect x="326" y="112" width="90" height="38" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="371" y="136" text-anchor="middle">죽는다</text><rect x="54" y="176" width="96" height="38" rx="4" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1.5"/><text class="ink sm" x="102" y="200" text-anchor="middle">을이 겨눈다</text><rect x="190" y="176" width="96" height="38" rx="4" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1.5"/><text class="ink sm" x="238" y="200" text-anchor="middle">쏘지 않는다</text><path d="M150 111 L188 111" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M286 111 L324 126" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M102 132 L102 174" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 sm" x="112" y="158" text-anchor="start">갑이 쏘았으므로</text><path d="M286 195 L324 152" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ark)"/><text class="ink2 sm" x="54" y="240" text-anchor="start">갑이 쏘지 않았다면 을이 쏘았을 것이므로 죽음은 그대로다</text><text class="ink2 sm" x="54" y="260" text-anchor="start">반사실 분석은 갑이 원인이 아니라고 한다 — 틀린 답이다</text><rect x="452" y="44" width="384" height="236" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="644" y="70" text-anchor="middle">과잉결정 — 각각으로 충분한 원인이 둘</text><rect x="470" y="92" width="96" height="38" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="518" y="116" text-anchor="middle">갑이 쏜다</text><rect x="600" y="92" width="96" height="38" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="648" y="116" text-anchor="middle">총알 A</text><rect x="470" y="176" width="96" height="38" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="518" y="200" text-anchor="middle">을이 쏜다</text><rect x="600" y="176" width="96" height="38" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="648" y="200" text-anchor="middle">총알 B</text><rect x="730" y="134" width="90" height="38" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="775" y="158" text-anchor="middle">죽는다</text><path d="M566 111 L598 111" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M696 111 L728 146" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M566 195 L598 195" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M696 195 L728 162" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)"/><text class="ink2 sm" x="470" y="240" text-anchor="start">갑이 없었어도 을 때문에 죽고, 을이 없었어도 갑 때문에 죽는다</text><text class="ink2 sm" x="470" y="260" text-anchor="start">반사실 분석은 둘 다 원인이 아니라고 한다 — 역시 틀린 답이다</text><text class="ink2 sm" x="36" y="314" text-anchor="start">두 반례가 치는 곳은 같다. ‘c 가 없었다면 e 도 없었을 것이다’ 라는 조건이 원인을 가려내기에 너무 셌던 것이다</text><text class="ink2 sm" x="36" y="333" text-anchor="start">5장에서 게티어 사례가 정당화된 참인 믿음을 무너뜨린 것과 같은 모양이다. 분석을 세우면 반례가 따라온다</text>
</svg>