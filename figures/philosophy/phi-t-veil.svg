<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 452" width="840" height="452" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">무지의 베일이 가리는 것과 남기는 것</title><desc id="d">왼쪽 칸은 원초적 입장의 당사자가 알 수 없는 것, 오른쪽 칸은 알고 있는 것이다. 위험 성향까지 가린다는 점이 최소극대화 논쟁의 열쇠다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">무지의 베일 — 가리는 것과 남기는 것</text><text class="ink2 sm" x="40" y="50" text-anchor="start">가른 기준: 원칙을 자기에게 유리하게 기울이는 데 쓸 수 있는 것은 가리고, 원칙을 고르려면 있어야 하는 일반 지식은 남긴다</text><rect x="40" y="68" width="360" height="250" rx="3" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="54" y="94" text-anchor="start">가린다 — 당사자가 알 수 없다</text><text class="ink2 sm" x="60" y="124" text-anchor="start">·</text><text class="ink2 sm" x="72" y="124" text-anchor="start">자기 계급과 사회적 지위</text><text class="ink2 sm" x="60" y="154" text-anchor="start">·</text><text class="ink2 sm" x="72" y="154" text-anchor="start">타고난 재능·능력·체력·지능</text><text class="ink2 sm" x="60" y="184" text-anchor="start">·</text><text class="ink2 sm" x="72" y="184" text-anchor="start">자기가 무엇을 좋은 삶으로 여기는지</text><text class="ink2 sm" x="60" y="214" text-anchor="start">·</text><text class="ink2 sm" x="72" y="214" text-anchor="start">자기 사회의 경제·정치 사정</text><text class="ink2 sm" x="60" y="244" text-anchor="start">·</text><text class="ink2 sm" x="72" y="244" text-anchor="start">자기가 어느 세대에 속하는지</text><text class="ink2 sm" x="60" y="274" text-anchor="start">·</text><text class="ink bold sm" x="72" y="274" text-anchor="start">위험을 얼마나 싫어하는 사람인지</text><rect x="440" y="68" width="360" height="250" rx="3" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.9"/><text class="ink bold sm" x="454" y="94" text-anchor="start">남긴다 — 당사자가 알고 있다</text><text class="ink2 sm" x="460" y="124" text-anchor="start">·</text><text class="ink2 sm" x="472" y="124" text-anchor="start">정치와 경제에 대한 일반 이론</text><text class="ink2 sm" x="460" y="154" text-anchor="start">·</text><text class="ink2 sm" x="472" y="154" text-anchor="start">사회 조직이 어떻게 굴러가는지</text><text class="ink2 sm" x="460" y="184" text-anchor="start">·</text><text class="ink2 sm" x="472" y="184" text-anchor="start">인간 심리의 일반 법칙</text><text class="ink2 sm" x="460" y="214" text-anchor="start">·</text><text class="ink2 sm" x="472" y="214" text-anchor="start">자원이 넘치지도 절망적으로 모자라지도</text><text class="ink2 sm" x="472" y="244" text-anchor="start">않다는 것 — 정의의 여건</text><text class="ink2 sm" x="460" y="274" text-anchor="start">·</text><text class="ink2 sm" x="472" y="274" text-anchor="start">자기가 기본 가치를 더 많이 원한다는 것</text><text class="ink2 sm" x="40" y="348" text-anchor="start">굵게 적은 줄이 뒤에 다툼거리가 된다. 위험 성향을 가려 버리면 당사자는 확률에 기대어 계산할 발판이 없다</text><text class="ink2 sm" x="40" y="370" text-anchor="start">롤스는 그래서 최소극대화가 합리적이라고 본다. 하사니는 모를 때는 모든 자리를 같은 확률로 놓고 평균을 재는 것이 합리적이라고 본다</text><text class="ink2 sm" x="40" y="392" text-anchor="start">베일은 정보를 없애는 장치가 아니라 협상력을 없애는 장치다. 남긴 목록이 모두 ‘누구에게나 같은’ 지식이라는 점을 확인하라</text><text class="ink2 sm" x="40" y="420" text-anchor="start">이것은 실제로 있었던 회의가 아니다. 원칙을 고를 때 어떤 정보를 근거로 삼는 것이 부당한지를 걸러 내는 사고실험이다</text>
</svg>