<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">트롤리의 두 사례 — 갈림길과 육교</title><desc id="d">왼쪽은 스위치로 전차를 옆 선로로 돌리는 사례, 오른쪽은 육교에서 사람을 밀어 전차를 멈추는 사례다. 죽는 사람과 사는 사람의 수는 같다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">갈림길과 육교 — 결과의 셈은 같다</text><rect x="40" y="46" width="396" height="218" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink bold sm" x="58" y="72" text-anchor="start">갈림길</text><text class="ink2 sm" x="58" y="92" text-anchor="start">스위치를 당기면 전차가 옆 선로로 간다</text><path d="M62 150 L416 150" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round"/><path d="M196 150 L280 214 L416 214" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round"/><rect x="64" y="140" width="26" height="18" rx="3" fill="var(--s1)" fill-opacity="0.85" stroke="var(--s1)" stroke-width="1.4"/><text class="ink2 sm" x="77" y="132" text-anchor="middle">전차</text><circle cx="330" cy="150" r="5" fill="var(--s2)"/><circle cx="348" cy="150" r="5" fill="var(--s2)"/><circle cx="366" cy="150" r="5" fill="var(--s2)"/><circle cx="384" cy="150" r="5" fill="var(--s2)"/><circle cx="402" cy="150" r="5" fill="var(--s2)"/><text class="ink2 sm" x="378" y="136" text-anchor="middle">다섯 사람</text><circle cx="384" cy="214" r="5" fill="var(--s3)"/><text class="ink2 sm" x="384" y="236" text-anchor="middle">한 사람</text><circle cx="196" cy="150" r="4" fill="var(--ink2)"/><text class="ink bold sm" x="196" y="178" text-anchor="middle">스위치</text><rect x="464" y="46" width="376" height="218" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink bold sm" x="482" y="72" text-anchor="start">육교</text><text class="ink2 sm" x="482" y="92" text-anchor="start">옆 사람을 밀어 떨어뜨리면 전차가 멈춘다</text><path d="M486 214 L822 214" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round"/><rect x="488" y="204" width="26" height="18" rx="3" fill="var(--s1)" fill-opacity="0.85" stroke="var(--s1)" stroke-width="1.4"/><text class="ink2 sm" x="501" y="196" text-anchor="middle">전차</text><circle cx="736" cy="214" r="5" fill="var(--s2)"/><circle cx="754" cy="214" r="5" fill="var(--s2)"/><circle cx="772" cy="214" r="5" fill="var(--s2)"/><circle cx="790" cy="214" r="5" fill="var(--s2)"/><circle cx="808" cy="214" r="5" fill="var(--s2)"/><text class="ink2 sm" x="784" y="200" text-anchor="middle">다섯 사람</text><path d="M578 152 L682 152" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round"/><path d="M586 152 L586 190" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M674 152 L674 190" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="600" cy="143" r="5" fill="var(--ink2)"/><text class="ink2 sm" x="600" y="128" text-anchor="middle">나</text><circle cx="654" cy="142" r="6.5" fill="var(--s3)"/><text class="ink2 sm" x="654" y="128" text-anchor="middle">한 사람</text><path class="s3" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M654 160 L654 202"/><text class="ink2 sm" x="40" y="296" text-anchor="start">두 사례에서 셈은 같다. 한 사람이 죽고 다섯 사람이 산다</text><text class="ink2 sm" x="40" y="317" text-anchor="start">그런데 같은 사람이 두 사례를 다르게 판단한다. 왼쪽은 대체로 허용된다고, 오른쪽은 대체로 안 된다고 답한다</text><text class="ink2 sm" x="40" y="338" text-anchor="start">그 차이가 이 절의 자료다. 무엇이 두 사례를 갈라 주는지가 물음이 된다</text>
</svg>