<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">뒤집힌 스펙트럼</title><desc id="d">두 사람의 겪어지는 어떠함만 서로 바뀌어 있고 입력과 출력과 낱말 쓰임은 모두 같다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">뒤집힌 스펙트럼 — 밖에서 재는 것은 모두 같다</text><text class="ink bold sm" x="220" y="64" text-anchor="middle">입력 ① 잘 익은 토마토</text><text class="ink bold sm" x="422" y="64" text-anchor="middle">입력 ② 잎사귀</text><text class="ink bold sm" x="692" y="64" text-anchor="middle">출력 — 말과 행동</text><text class="ink bold" x="58" y="130" text-anchor="start">갑</text><rect x="128" y="78" width="184" height="90" rx="4" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold sm" x="220" y="130" text-anchor="middle">어떠함 가</text><rect x="330" y="78" width="184" height="90" rx="4" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.7"/><text class="ink bold sm" x="422" y="130" text-anchor="middle">어떠함 나</text><rect x="532" y="78" width="320" height="90" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="546" y="103" text-anchor="start">토마토를 ‘빨갛다’ 고 부른다</text><text class="ink2 sm" x="546" y="122" text-anchor="start">잎사귀를 ‘초록이다’ 고 부른다</text><text class="ink2 sm" x="546" y="141" text-anchor="start">빨간 신호등에서 선다</text><text class="ink2 sm" x="546" y="160" text-anchor="start">빨강을 따뜻한 색이라 말한다</text><text class="ink bold" x="58" y="260" text-anchor="start">을</text><rect x="128" y="208" width="184" height="90" rx="4" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.7"/><text class="ink bold sm" x="220" y="260" text-anchor="middle">어떠함 나</text><rect x="330" y="208" width="184" height="90" rx="4" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold sm" x="422" y="260" text-anchor="middle">어떠함 가</text><rect x="532" y="208" width="320" height="90" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="546" y="233" text-anchor="start">토마토를 ‘빨갛다’ 고 부른다</text><text class="ink2 sm" x="546" y="252" text-anchor="start">잎사귀를 ‘초록이다’ 고 부른다</text><text class="ink2 sm" x="546" y="271" text-anchor="start">빨간 신호등에서 선다</text><text class="ink2 sm" x="546" y="290" text-anchor="start">빨강을 따뜻한 색이라 말한다</text><path d="M220 172 L422 204" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#ark)"/><path d="M422 172 L220 204" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#ark)"/><text class="ink bold sm" x="44" y="194" text-anchor="start">서로 바뀜</text><path d="M548 189 L554.4 195.4 L564 181.8" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text class="ink bold sm" x="574" y="194" text-anchor="start">이 칸은 글자 하나 다르지 않다</text><rect x="40" y="320" width="400" height="78" rx="4" fill="var(--s3)" fill-opacity="0.12" stroke="var(--s3)" stroke-width="1.7"/><text class="ink bold sm" x="52" y="343" text-anchor="start">같은 것</text><text class="ink2 sm" x="52" y="365" text-anchor="start">입력 · 출력 · 낱말 쓰임 · 행동</text><text class="ink2 sm" x="52" y="383" text-anchor="start">밖에서 잴 수 있는 것 가운데 다른 것이 없다</text><rect x="460" y="320" width="400" height="78" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold sm" x="472" y="343" text-anchor="start">다른 것</text><text class="ink2 sm" x="472" y="365" text-anchor="start">겪어지는 어떠함 하나뿐</text><text class="ink2 sm" x="472" y="383" text-anchor="start">두 사람 다 이 사실을 알아낼 방법이 없다</text><text class="ink2 sm" x="40" y="426" text-anchor="start">역할이 같은데 감각질이 다르다면 마음 상태는 역할로 정해지지 않는다. 이 사례의 표적은 기능주의다</text><text class="ink2 sm" x="40" y="446" text-anchor="start">기능주의 쪽 대응 — 색 공간은 대칭이 아니어서 실제로 뒤집으면 밝기와 대비 판단이 어긋나고 그것이 행동에 드러난다</text><text class="ink2 sm" x="40" y="466" text-anchor="start">그 대응이 보이는 것은 사람의 색에서 뒤집기가 어렵다는 것까지다. 대칭인 감각 차원을 가진 존재를 생각하면 사례가 되살아난다</text><text class="ink2 sm" x="40" y="486" text-anchor="start">칸의 색은 실제 색이 아니라 두 어떠함이 다르다는 표시일 뿐이다</text>
</svg>