<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">법칙 같은 일반화와 우연한 일반화</title><desc id="d">겉모양이 같은 두 전칭 문장이 미확인 사례와 반사실 조건문과 설명이라는 세 시험에서 갈린다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">겉모양이 같은 두 일반화가 세 시험에서 갈린다</text><rect x="36" y="46" width="208" height="52" rx="4" fill="var(--grid)" fill-opacity="0.35" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="78" text-anchor="start">시험</text><rect x="250" y="46" width="296" height="52" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="264" y="68" text-anchor="start">지름 1 km 가 넘는</text><text class="ink bold sm" x="264" y="86" text-anchor="start">금 덩어리는 없다</text><rect x="552" y="46" width="296" height="52" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="566" y="68" text-anchor="start">지름 1 km 가 넘는</text><text class="ink bold sm" x="566" y="86" text-anchor="start">우라늄 235 덩어리는 없다</text><rect x="36" y="102" width="208" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="50" y="134" text-anchor="start">아직 보지 않은 사례에도</text><text class="ink sm" x="50" y="154" text-anchor="start">걸치는가</text><rect x="250" y="102" width="296" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="264" y="134" text-anchor="start">걸친다고 볼 근거가 없다.</text><text class="ink2 sm" x="264" y="154" text-anchor="start">아직 안 본 곳에 있을 수 있다</text><rect x="552" y="102" width="296" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="566" y="134" text-anchor="start">걸친다. 어디를 보든</text><text class="ink2 sm" x="566" y="154" text-anchor="start">있을 수 없다</text><rect x="36" y="190" width="208" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="50" y="222" text-anchor="start">반사실 조건문을</text><text class="ink sm" x="50" y="242" text-anchor="start">떠받치는가</text><rect x="250" y="190" width="296" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="264" y="222" text-anchor="start">금을 더 모았더라면</text><text class="ink2 sm" x="264" y="242" text-anchor="start">그런 덩어리가 있었을 것이다</text><rect x="552" y="190" width="296" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="566" y="222" text-anchor="start">우라늄을 더 모았더라도</text><text class="ink2 sm" x="566" y="242" text-anchor="start">먼저 터졌을 것이다</text><rect x="36" y="278" width="208" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="50" y="310" text-anchor="start">왜 없는지를</text><text class="ink sm" x="50" y="330" text-anchor="start">설명하는가</text><rect x="250" y="278" width="296" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="264" y="310" text-anchor="start">설명하지 못한다.</text><text class="ink2 sm" x="264" y="330" text-anchor="start">그냥 없을 뿐이다</text><rect x="552" y="278" width="296" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="566" y="310" text-anchor="start">설명한다. 임계질량을</text><text class="ink2 sm" x="566" y="330" text-anchor="start">넘으면 유지되지 않는다</text><text class="ink2 sm" x="36" y="384" text-anchor="start">두 문장은 ‘그런 것은 하나도 없다’ 는 같은 모양이다. 규칙성만으로는 오른쪽이 왼쪽보다 나을 이유가 없다</text>
</svg>