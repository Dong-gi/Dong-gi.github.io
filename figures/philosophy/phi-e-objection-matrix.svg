<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">결과주의 · 의무론 · 덕 윤리가 서로에게 던지는 반론의 격자</title><desc id="d">세로가 반론을 던지는 쪽, 가로가 받는 쪽이며 대각선에는 각 이론이 스스로 감당하는 부담을 적었다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">셋이 서로에게 던지는 반론 — 세로가 던지는 쪽, 가로가 받는 쪽</text><rect x="40" y="48" width="132" height="32" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><rect x="172" y="48" width="240" height="32" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="292" y="69" text-anchor="middle">결과주의</text><rect x="412" y="48" width="240" height="32" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="532" y="69" text-anchor="middle">의무론</text><rect x="652" y="48" width="240" height="32" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="772" y="69" text-anchor="middle">덕 윤리</text><rect x="40" y="80" width="132" height="104" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="130" text-anchor="start">결과주의</text><text class="ink2 sm" x="50" y="148" text-anchor="start">가 던진다</text><rect x="172" y="80" width="240" height="104" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4"/><text class="ink bold sm" x="183" y="103" text-anchor="start">자기 부담</text><text class="ink2 sm" x="183" y="124" text-anchor="start">좋음의 이론을 갈아 끼울수록</text><text class="ink2 sm" x="183" y="141" text-anchor="start">내용이 옅어진다</text><rect x="412" y="80" width="240" height="104" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.9"/><text class="ink bold sm" x="423" y="103" text-anchor="start">더 나쁜 결과를 왜 택하나</text><text class="ink2 sm" x="423" y="124" text-anchor="start">제약의 역설 — 살인 다섯을</text><text class="ink2 sm" x="423" y="141" text-anchor="start">막는 살인 하나가 왜 금지인가</text><rect x="652" y="80" width="240" height="104" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.9"/><text class="ink bold sm" x="663" y="103" text-anchor="start">무엇을 하라는 말이 없다</text><text class="ink2 sm" x="663" y="124" text-anchor="start">성품을 말할 뿐 행위 지침을</text><text class="ink2 sm" x="663" y="141" text-anchor="start">주지 않는다</text><rect x="40" y="184" width="132" height="104" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="234" text-anchor="start">의무론</text><text class="ink2 sm" x="50" y="252" text-anchor="start">가 던진다</text><rect x="172" y="184" width="240" height="104" rx="3" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="183" y="207" text-anchor="start">사람을 총합의 그릇으로 쓴다</text><text class="ink2 sm" x="183" y="228" text-anchor="start">한 사람의 손해를 다른 사람의</text><text class="ink2 sm" x="183" y="245" text-anchor="start">이득으로 갚을 수 있게 된다</text><rect x="412" y="184" width="240" height="104" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4"/><text class="ink bold sm" x="423" y="207" text-anchor="start">자기 부담</text><text class="ink2 sm" x="423" y="228" text-anchor="start">준칙을 어떻게 적느냐로 답이</text><text class="ink2 sm" x="423" y="245" text-anchor="start">바뀐다. 의무끼리 충돌한다</text><rect x="652" y="184" width="240" height="104" rx="3" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="663" y="207" text-anchor="start">덕을 고르려면 옳음이 먼저다</text><text class="ink2 sm" x="663" y="228" text-anchor="start">무엇이 덕인지 정하는 데</text><text class="ink2 sm" x="663" y="245" text-anchor="start">이미 옳음의 기준이 쓰인다</text><rect x="40" y="288" width="132" height="104" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="338" text-anchor="start">덕 윤리</text><text class="ink2 sm" x="50" y="356" text-anchor="start">가 던진다</text><rect x="172" y="288" width="240" height="104" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.9"/><text class="ink bold sm" x="183" y="311" text-anchor="start">동기와 성품을 밖에 둔다</text><text class="ink2 sm" x="183" y="332" text-anchor="start">마지못해 도운 사람과 기꺼이</text><text class="ink2 sm" x="183" y="349" text-anchor="start">도운 사람이 같아진다</text><rect x="412" y="288" width="240" height="104" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.9"/><text class="ink bold sm" x="423" y="311" text-anchor="start">도덕을 규칙표로 좁힌다</text><text class="ink2 sm" x="423" y="332" text-anchor="start">규칙이 닿지 않는 자리를</text><text class="ink2 sm" x="423" y="349" text-anchor="start">판단할 능력을 설명 못 한다</text><rect x="652" y="288" width="240" height="104" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4"/><text class="ink bold sm" x="663" y="311" text-anchor="start">자기 부담</text><text class="ink2 sm" x="663" y="332" text-anchor="start">덕 목록이 문화마다 다르다.</text><text class="ink2 sm" x="663" y="349" text-anchor="start">안정된 성품이 있는지도 다툰다</text><text class="ink2 sm" x="40" y="420" text-anchor="start">표가 대칭이다. 어느 줄도 아직 지워지지 않았고, 대각선의 자기 부담도 아직 해결되지 않았다</text><text class="ink2 sm" x="40" y="441" text-anchor="start">실제 판정은 셋이 크게 갈리지 않는 경우가 많다. 갈리는 것은 판정이 아니라 그 판정을 대는 이유다</text>
</svg>