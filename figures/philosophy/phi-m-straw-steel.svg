<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">허수아비와 강철인간</title><desc id="d">주장의 강도 축 위에서 허수아비 판본·원래 주장·강철인간 판본의 자리</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="34" y="28" text-anchor="start">같은 주장의 여러 판본 — 공격은 어디에 맞아야 하는가</text><path d="M70 200 L800 200" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)"/><text class="ink2 sm" x="806" y="205" text-anchor="start">강함</text><text class="ink2 sm" x="70" y="224" text-anchor="start">약함</text><text class="ink2 sm" x="70" y="248" text-anchor="start">주장의 강도 — 오른쪽으로 갈수록 방어하기 쉽고 반박하기 어렵다</text><circle cx="180" cy="200" r="6" fill="var(--s2)"/><text class="ink bold sm" x="180" y="74" text-anchor="middle">허수아비 판본</text><text class="ink2 sm" x="180" y="100" text-anchor="middle">상대가 말하지 않은</text><text class="ink2 sm" x="180" y="120" text-anchor="middle">약한 형태로 고쳐 놓은 것</text><path d="M180 132 L180 188" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M180 212 L180 268" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="180" y="292" text-anchor="middle">여기를 때리면 상대는</text><text class="ink2 sm" x="180" y="312" text-anchor="middle">아무것도 잃지 않는다</text><circle cx="428" cy="200" r="6" fill="var(--ink2)"/><text class="ink bold sm" x="428" y="74" text-anchor="middle">글에 적힌 그대로</text><text class="ink2 sm" x="428" y="100" text-anchor="middle">상대가 실제로 쓴 문장</text><text class="ink2 sm" x="428" y="120" text-anchor="middle">읽기가 갈리는 자리가 남아 있다</text><path d="M428 132 L428 188" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M428 212 L428 268" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="428" y="292" text-anchor="middle">여기부터가</text><text class="ink2 sm" x="428" y="312" text-anchor="middle">정당한 공격 범위다</text><circle cx="656" cy="200" r="6" fill="var(--s1)"/><text class="ink bold sm" x="656" y="74" text-anchor="middle">강철인간 판본</text><text class="ink2 sm" x="656" y="100" text-anchor="middle">상대가 받아들일 수 있는</text><text class="ink2 sm" x="656" y="120" text-anchor="middle">가장 강한 형태</text><path d="M656 132 L656 188" fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M656 212 L656 268" fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="656" y="292" text-anchor="middle">여기를 무너뜨려야 상대가</text><text class="ink2 sm" x="656" y="312" text-anchor="middle">물러설 이유가 생긴다</text><path d="M744 184 L744 216" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/><text class="ink2 sm" x="800" y="248" text-anchor="end">이 오른쪽은 상대의 주장이 아니다</text><text class="ink2 sm" x="34" y="356" text-anchor="start">오른쪽으로 옮기는 것이 언제나 옳은 것은 아니다. 상대가 실제로 지지할 수 없는 판본을 세워 주는 것도 상대의 주장을 바꿔치기하는 일이다.</text>
</svg>