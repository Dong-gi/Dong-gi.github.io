<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 388" width="840" height="388" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">최소극대화와 평균 최대가 서로 다른 분배안을 고른다</title><desc id="d">세 분배안 A·B·C 를 다섯 자리로 적은 표. 가장 낮은 자리만 보면 C 가 가장 낫고, 평균을 보면 B 가 가장 낫다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">최소극대화는 C 를 고르고 평균 최대는 B 를 고른다</text><text class="ink2 sm" x="40" y="50" text-anchor="start">다섯 사회적 자리에 돌아가는 기본 가치의 양(설명을 위해 지어낸 수. 단위 없는 지수로 읽는다)</text><rect x="40" y="70" width="96" height="42" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="88" y="96" text-anchor="middle">분배안</text><rect x="136" y="70" width="96" height="42" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="184" y="88" text-anchor="middle">가장 낮은</text><text class="ink bold sm" x="184" y="104" text-anchor="middle">자리</text><rect x="232" y="70" width="96" height="42" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="280" y="96" text-anchor="middle">둘째</text><rect x="328" y="70" width="96" height="42" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="376" y="96" text-anchor="middle">셋째</text><rect x="424" y="70" width="96" height="42" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="472" y="96" text-anchor="middle">넷째</text><rect x="520" y="70" width="96" height="42" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="568" y="88" text-anchor="middle">가장 높은</text><text class="ink bold sm" x="568" y="104" text-anchor="middle">자리</text><rect x="616" y="70" width="96" height="42" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="664" y="96" text-anchor="middle">평균</text><rect x="40" y="112" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="88" y="138" text-anchor="middle">A</text><rect x="136" y="112" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="184" y="138" text-anchor="middle">30</text><rect x="232" y="112" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="280" y="138" text-anchor="middle">30</text><rect x="328" y="112" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="376" y="138" text-anchor="middle">30</text><rect x="424" y="112" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="472" y="138" text-anchor="middle">30</text><rect x="520" y="112" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="568" y="138" text-anchor="middle">30</text><rect x="616" y="112" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="664" y="138" text-anchor="middle">30</text><rect x="40" y="154" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="88" y="180" text-anchor="middle">B</text><rect x="136" y="154" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="184" y="180" text-anchor="middle">20</text><rect x="232" y="154" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="280" y="180" text-anchor="middle">40</text><rect x="328" y="154" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="376" y="180" text-anchor="middle">60</text><rect x="424" y="154" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="472" y="180" text-anchor="middle">90</text><rect x="520" y="154" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="568" y="180" text-anchor="middle">140</text><rect x="616" y="154" width="96" height="42" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="664" y="180" text-anchor="middle">70</text><rect x="40" y="196" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="88" y="222" text-anchor="middle">C</text><rect x="136" y="196" width="96" height="42" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.9"/><text class="ink bold sm" x="184" y="222" text-anchor="middle">35</text><rect x="232" y="196" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="280" y="222" text-anchor="middle">45</text><rect x="328" y="196" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="376" y="222" text-anchor="middle">55</text><rect x="424" y="196" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="472" y="222" text-anchor="middle">70</text><rect x="520" y="196" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="568" y="222" text-anchor="middle">95</text><rect x="616" y="196" width="96" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink2 sm" x="664" y="222" text-anchor="middle">60</text><rect x="40" y="252" width="14" height="3" rx="1" fill="var(--s1)" fill-opacity="1" stroke="var(--s1)" stroke-width="0"/><text class="ink2 sm" x="62" y="257" text-anchor="start">최소극대화 — 각 안의 가장 낮은 자리만 보고, 그중 가장 높은 것을 고른다. 20 · 30 · 35 가운데 35 이므로 C</text><rect x="40" y="276" width="14" height="3" rx="1" fill="var(--s2)" fill-opacity="1" stroke="var(--s2)" stroke-width="0"/><text class="ink2 sm" x="62" y="281" text-anchor="start">평균 최대 — 어느 자리에 놓일지 모르니 모든 자리를 같은 확률로 보고 기댓값을 잰다. 30 · 70 · 60 가운데 70 이므로 B</text><text class="ink2 sm" x="40" y="314" text-anchor="start">롤스: 확률을 댈 근거가 없고, 가장 낮은 자리에서의 20 과 35 의 차이는 받아들일 만한 삶과 아닌 삶의 차이일 수 있다</text><text class="ink2 sm" x="40" y="336" text-anchor="start">하사니: 그렇다면 어떤 비행기도 타서는 안 된다. 최악만 보는 규칙은 아주 작은 위험 때문에 아주 큰 이득을 늘 버리게 만든다</text><text class="ink bold sm" x="40" y="358" text-anchor="start">두 말이 다 그럴듯하다는 것이 이 자리가 미결인 이유다. 표만으로는 어느 규칙이 합리적인지 정해지지 않는다</text>
</svg>