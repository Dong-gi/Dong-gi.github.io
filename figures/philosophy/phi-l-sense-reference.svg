<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 426" width="880" height="426" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">표현 · 뜻 · 지시체의 삼각 구도</title><desc id="d">샛별과 개밥바라기는 뜻이 다른 두 갈래로 갈라져 금성이라는 한 지시체에서 만나고, 관념은 그와 다른 층에 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">뜻과 지시체 — 두 갈래 길이 한 점에서 만난다</text><text class="ink2 bold sm" x="126" y="60" text-anchor="middle">표현</text><text class="ink2 bold sm" x="360" y="60" text-anchor="middle">뜻 — 제시되는 방식</text><text class="ink2 bold sm" x="596" y="60" text-anchor="middle">지시체</text><text class="ink2 bold sm" x="767" y="60" text-anchor="middle">관념 — 다른 층</text><rect x="44" y="88" width="164" height="52" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold" x="126" y="120" text-anchor="middle">‘샛별’</text><rect x="250" y="82" width="220" height="64" rx="4" fill="var(--s1)" fill-opacity="0.08" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="360" y="108" text-anchor="middle">새벽에 가장 밝게</text><text class="ink sm" x="360" y="128" text-anchor="middle">빛나는 것으로 붙든다</text><path d="M208 114 L244 114" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M470 114 L552 140" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><rect x="44" y="176" width="164" height="52" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="126" y="208" text-anchor="middle">‘개밥바라기’</text><rect x="250" y="170" width="220" height="64" rx="4" fill="var(--s2)" fill-opacity="0.08" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="360" y="196" text-anchor="middle">저녁에 가장 밝게</text><text class="ink sm" x="360" y="216" text-anchor="middle">빛나는 것으로 붙든다</text><path d="M208 202 L244 202" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)"/><path d="M470 202 L552 176" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)"/><circle cx="596" cy="158" r="44" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold" x="596" y="164" text-anchor="middle">금성</text><text class="ink2 sm" x="596" y="228" text-anchor="middle">두 뜻이 한 점에서 만난다</text><rect x="690" y="76" width="154" height="244" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="706" y="96" width="122" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="767" y="121" text-anchor="middle">영수의 관념</text><rect x="706" y="152" width="122" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="767" y="177" text-anchor="middle">민아의 관념</text><rect x="706" y="208" width="122" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="767" y="233" text-anchor="middle">철수의 관념</text><text class="ink2 sm" x="767" y="282" text-anchor="middle">사람마다 다르고</text><text class="ink2 sm" x="767" y="302" text-anchor="middle">서로 견줄 수 없다</text><path d="M36 340 L844 340" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round"/><text class="ink2 sm" x="36" y="362" text-anchor="start">두 이름은 뜻이 다르고 지시체가 같다. 그래서 ‘샛별은 개밥바라기다’ 가 알려 주는 것이 있다</text><text class="ink2 sm" x="36" y="382" text-anchor="start">화살표는 한쪽으로만 간다. 뜻이 지시체를 정하지만, 지시체가 같다고 두 뜻이 같아지지는 않는다</text><text class="ink2 sm" x="36" y="402" text-anchor="start">망원경에 비유하면 달이 지시체, 렌즈에 맺힌 상이 뜻, 각자의 망막에 맺힌 상이 관념이다. 뜻은 여럿이 함께 붙들 수 있다</text>
</svg>