<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 492" width="890" height="492" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">고정지시어와 비고정지시어</title><desc id="d">이름은 세 세계에서 모두 같은 대상을 집고 확정 기술은 세계마다 다른 것을 집지만, 가장 작은 소수처럼 고정인 확정 기술도 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">고정지시어 — 세계가 바뀌어도 같은 것을 가리키는가</text><rect x="272" y="68" width="182" height="348" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="363" y="92" text-anchor="middle">실제 세계</text><text class="ink2 sm" x="363" y="110" text-anchor="middle">그가 알렉산더를 가르쳤다</text><rect x="472" y="68" width="182" height="348" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="563" y="92" text-anchor="middle">가능세계 w<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink2 sm" x="563" y="110" text-anchor="middle">그는 정치로 갔고</text><text class="ink2 sm" x="563" y="128" text-anchor="middle">다른 이가 가르쳤다</text><rect x="672" y="68" width="182" height="348" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="763" y="92" text-anchor="middle">가능세계 w<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="763" y="110" text-anchor="middle">알렉산더에게</text><text class="ink2 sm" x="763" y="128" text-anchor="middle">스승이 없었다</text><rect x="36" y="160" width="214" height="56" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.6"/><text class="ink2 sm" x="143" y="182" text-anchor="middle">이름</text><text class="ink bold sm" x="143" y="204" text-anchor="middle">‘아리스토텔레스’</text><text class="ink2 bold sm" x="143" y="234" text-anchor="middle">고정지시어</text><path d="M250 188 L854 188" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M302 188 L388 188" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><circle cx="406" cy="188" r="7" fill="var(--s1)"/><text class="ink bold sm" x="363" y="218" text-anchor="middle">아리스토텔레스</text><path d="M502 188 L588 188" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><circle cx="606" cy="188" r="7" fill="var(--s1)"/><text class="ink bold sm" x="563" y="218" text-anchor="middle">아리스토텔레스</text><path d="M702 188 L788 188" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)"/><circle cx="806" cy="188" r="7" fill="var(--s1)"/><text class="ink bold sm" x="763" y="218" text-anchor="middle">아리스토텔레스</text><rect x="36" y="250" width="214" height="56" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink2 sm" x="143" y="272" text-anchor="middle">확정 기술</text><text class="ink bold sm" x="143" y="294" text-anchor="middle">‘알렉산더를 가르친 사람’</text><text class="ink2 bold sm" x="143" y="324" text-anchor="middle">비고정지시어</text><path d="M250 278 L854 278" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M302 278 L388 278" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><circle cx="406" cy="278" r="7" fill="var(--s2)"/><text class="ink bold sm" x="363" y="308" text-anchor="middle">아리스토텔레스</text><path d="M502 278 L588 278" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><circle cx="606" cy="278" r="7" fill="var(--s2)"/><text class="ink bold sm" x="563" y="308" text-anchor="middle">그 다른 사람</text><path d="M702 278 L788 278" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ark)"/><circle cx="806" cy="278" r="7" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6" stroke-dasharray="3 3"/><text class="ink2 sm" x="763" y="308" text-anchor="middle">가리킬 것이 없다</text><rect x="36" y="340" width="214" height="56" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.6"/><text class="ink2 sm" x="143" y="362" text-anchor="middle">확정 기술</text><text class="ink bold sm" x="143" y="384" text-anchor="middle">‘가장 작은 소수’</text><text class="ink2 bold sm" x="143" y="414" text-anchor="middle">고정지시어 — 확정 기술인데도</text><path d="M250 368 L854 368" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M302 368 L388 368" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><circle cx="406" cy="368" r="7" fill="var(--s3)"/><text class="ink bold sm" x="363" y="398" text-anchor="middle">2</text><path d="M502 368 L588 368" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><circle cx="606" cy="368" r="7" fill="var(--s3)"/><text class="ink bold sm" x="563" y="398" text-anchor="middle">2</text><path d="M702 368 L788 368" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)"/><circle cx="806" cy="368" r="7" fill="var(--s3)"/><text class="ink bold sm" x="763" y="398" text-anchor="middle">2</text><path d="M36 432 L854 432" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round"/><text class="ink2 sm" x="36" y="454" text-anchor="start">고정지시어는 그 대상이 있는 세계라면 어디서나 그 대상을 가리키고 다른 것을 가리키는 일이 없다</text><text class="ink2 sm" x="36" y="474" text-anchor="start">갈리는 것은 표현의 문법이 아니라 세계마다 다른 것을 골라내느냐다. 아래 줄이 그것을 보인다</text>
</svg>