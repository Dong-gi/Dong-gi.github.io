<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 356" width="824" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">합의 정도의 세 등급</title><desc id="d">정설·다수설과 소수설·미결 셋을 이 문서가 각각 어떻게 적는지</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="28" text-anchor="start">이 문서가 쓰는 세 등급</text><rect x="36" y="46" width="152" height="32" rx="4" fill="var(--grid)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="48" y="67" text-anchor="start">등급</text><rect x="188" y="46" width="300" height="32" rx="4" fill="var(--grid)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="200" y="67" text-anchor="start">이 문서가 쓰는 방식</text><rect x="488" y="46" width="300" height="32" rx="4" fill="var(--grid)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="500" y="67" text-anchor="start">이 문서 안의 예</text><rect x="36" y="78" width="152" height="68" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.8"/><rect x="188" y="78" width="300" height="68" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="488" y="78" width="300" height="68" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="48" y="118" text-anchor="start">정설</text><text class="ink sm" x="200" y="105" text-anchor="start">그냥 서술한다.</text><text class="ink sm" x="200" y="126" text-anchor="start">아무 표시도 붙이지 않는다</text><text class="ink2 sm" x="500" y="105" text-anchor="start">게티어 사례가 정당화된 참인 믿음을</text><text class="ink2 sm" x="500" y="126" text-anchor="start">무너뜨린다 (5장)</text><rect x="36" y="146" width="152" height="68" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.8"/><rect x="188" y="146" width="300" height="68" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="488" y="146" width="300" height="68" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="48" y="186" text-anchor="start">다수설·소수설</text><text class="ink sm" x="200" y="173" text-anchor="start">다수설을 먼저 쓰고</text><text class="ink sm" x="200" y="194" text-anchor="start">소수설과 그 근거를 반드시 잇는다</text><text class="ink2 sm" x="500" y="173" text-anchor="start">물리주의와 이원론 (14장)</text><text class="ink2 sm" x="500" y="194" text-anchor="start">과학적 실재론과 반실재론 (9장)</text><rect x="36" y="214" width="152" height="68" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.8"/><rect x="188" y="214" width="300" height="68" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="488" y="214" width="300" height="68" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="48" y="254" text-anchor="start">미결</text><text class="ink sm" x="200" y="241" text-anchor="start">입장들을 나란히 놓는다.</text><text class="ink sm" x="200" y="262" text-anchor="start">저자가 고르지 않는다</text><text class="ink2 sm" x="500" y="241" text-anchor="start">인격 동일성의 기준 (13장)</text><text class="ink2 sm" x="500" y="262" text-anchor="start">결과주의·의무론·덕 윤리 (18장)</text><text class="ink2 sm" x="36" y="308" text-anchor="start">‘답이 없다’ 와 ‘아직 정해지지 않았다’ 는 다르다. 세 줄 가운데 아래 하나만 정해지지 않은 것이고,</text><text class="ink2 sm" x="36" y="327" text-anchor="start">그 줄에서도 무엇이 다투어지는지·각 입장이 무엇을 대가로 치르는지는 정해져 있다.</text>
</svg>