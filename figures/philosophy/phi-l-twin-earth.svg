<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">쌍둥이 지구 사고실험</title><desc id="d">오스카와 쌍둥이 오스카의 심리 상태는 같은데 두 사람의 낱말 물은 각각 H2O 와 XYZ 에 닿는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">쌍둥이 지구 — 머릿속은 같은데 낱말이 닿는 곳이 다르다</text><rect x="36" y="48" width="350" height="300" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="211" y="74" text-anchor="middle">지구, 1750년</text><text class="ink bold" x="211" y="98" text-anchor="middle">오스카</text><rect x="54" y="110" width="314" height="104" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.6"/><text class="ink2 sm" x="211" y="130" text-anchor="middle">머릿속 — 심리 상태</text><text class="ink sm" x="76" y="154" text-anchor="start">맑고 마실 수 있는 액체</text><text class="ink sm" x="76" y="174" text-anchor="start">강과 바다를 채우는 것</text><text class="ink sm" x="76" y="194" text-anchor="start">조성은 아직 아무도 모른다</text><rect x="116" y="228" width="190" height="38" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="211" y="253" text-anchor="middle">낱말 ‘물’</text><path d="M211 266 L211 290" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar2)"/><rect x="146" y="294" width="130" height="38" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="211" y="319" text-anchor="middle">H<tspan baseline-shift="-22%" font-size="76%">2</tspan>O</text><rect x="494" y="48" width="350" height="300" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="669" y="74" text-anchor="middle">쌍둥이 지구, 1750년</text><text class="ink bold" x="669" y="98" text-anchor="middle">쌍둥이 오스카</text><rect x="512" y="110" width="314" height="104" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.6"/><text class="ink2 sm" x="669" y="130" text-anchor="middle">머릿속 — 심리 상태</text><text class="ink sm" x="534" y="154" text-anchor="start">맑고 마실 수 있는 액체</text><text class="ink sm" x="534" y="174" text-anchor="start">강과 바다를 채우는 것</text><text class="ink sm" x="534" y="194" text-anchor="start">조성은 아직 아무도 모른다</text><rect x="574" y="228" width="190" height="38" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="669" y="253" text-anchor="middle">낱말 ‘물’</text><path d="M669 266 L669 290" fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)"/><rect x="604" y="294" width="130" height="38" rx="4" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold" x="669" y="319" text-anchor="middle">XYZ</text><path d="M416 156 L464 156" fill="none" stroke="var(--ink2)" stroke-width="2.6" stroke-linecap="round"/><path d="M416 168 L464 168" fill="none" stroke="var(--ink2)" stroke-width="2.6" stroke-linecap="round"/><text class="ink2 sm" x="440" y="196" text-anchor="middle">분자 하나까지</text><text class="ink2 sm" x="440" y="214" text-anchor="middle">같은 상태다</text><path d="M416 307 L464 307" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round"/><path d="M416 319 L464 319" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round"/><path d="M424 328 L456 298" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round"/><text class="ink2 bold sm" x="440" y="356" text-anchor="middle">외연이 다르다</text><path d="M36 384 L844 384" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round"/><text class="ink2 sm" x="36" y="406" text-anchor="start">설정 — 두 행성은 모든 면에서 같고 다른 것은 하나뿐이다. 그곳의 강과 바다를 채우는 액체는 H<tspan baseline-shift="-22%" font-size="76%">2</tspan>O 가 아니라 XYZ 이며 겉보기 · 맛 · 쓰임은 똑같다</text><text class="ink2 sm" x="36" y="426" text-anchor="start">위 상자가 같다는 것과 아래 화살표가 다른 곳에 닿는다는 것. 이 둘이 한 그림에 같이 있으므로 머릿속이 외연을 혼자서 정하지 못한다</text>
</svg>