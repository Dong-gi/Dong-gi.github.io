<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 360" width="830" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">신빙론의 잣대와 일반성 문제</title><desc id="d">신빙론은 믿음을 만든 과정의 참 비율로 정당화를 재는데 그 과정을 어느 넓이로 잡을지가 정해지지 않는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="30" y="26" text-anchor="start">신빙론의 잣대 — 그리고 그 잣대를 어디에 대는가</text><rect x="30" y="42" width="344" height="180" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><rect x="52" y="70" width="112" height="44" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink sm" x="108" y="90" text-anchor="middle">믿음을 만든</text><text class="ink bold sm" x="108" y="106" text-anchor="middle">과정</text><path d="M168 92 L199 92" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round"/><path d="M206 92 L199 96.34 L199 87.66 z" fill="var(--ink2)"/><circle cx="218" cy="78" r="8" fill="var(--s3)"/><circle cx="248" cy="78" r="8" fill="var(--s3)"/><circle cx="278" cy="78" r="8" fill="var(--s3)"/><circle cx="308" cy="78" r="8" fill="none" stroke="var(--s2)" stroke-width="2"/><circle cx="338" cy="78" r="8" fill="var(--s3)"/><circle cx="218" cy="108" r="8" fill="var(--s3)"/><circle cx="248" cy="108" r="8" fill="var(--s3)"/><circle cx="278" cy="108" r="8" fill="none" stroke="var(--s2)" stroke-width="2"/><circle cx="308" cy="108" r="8" fill="var(--s3)"/><circle cx="338" cy="108" r="8" fill="var(--s3)"/><text class="ink2 sm" x="218" y="138" text-anchor="start">이 과정이 내놓는 믿음들</text><text class="ink sm" x="52" y="138" text-anchor="start">참의 비율이 충분히 높으면</text><text class="ink sm" x="52" y="158" text-anchor="start">그 과정이 만든 믿음은 정당화되었다고 본다</text><text class="ink2 sm" x="52" y="190" text-anchor="start">믿는 사람이 그 비율을 알 필요는 없다</text><text class="ink2 sm" x="52" y="208" text-anchor="start">— 그래서 외재주의다</text><rect x="402" y="42" width="398" height="180" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="422" y="66" text-anchor="start">한 번의 그 믿음을 어느 넓이의 과정으로 셀 것인가</text><path d="M422 102 L572 102" fill="none" stroke="var(--s1)" stroke-width="4" stroke-linecap="round"/><text class="ink sm" x="422" y="94" text-anchor="start">시각</text><text class="ink2 sm" x="586" y="106" text-anchor="start">아주 넓게 잡으면 — 참의 비율이 높다</text><path d="M422 136 L528 136" fill="none" stroke="var(--s2)" stroke-width="4" stroke-linecap="round"/><text class="ink sm" x="422" y="128" text-anchor="start">어두울 때의 시각</text><text class="ink2 sm" x="586" y="140" text-anchor="start">중간으로 잡으면 — 비율이 뚝 떨어진다</text><path d="M422 170 L484 170" fill="none" stroke="var(--s3)" stroke-width="4" stroke-linecap="round"/><text class="ink sm" x="422" y="162" text-anchor="start">이 날 이 자리에서의 시각</text><text class="ink2 sm" x="586" y="174" text-anchor="start">아주 좁게 잡으면 — 비율이 0 또는 1 이다</text><text class="ink sm" x="422" y="208" text-anchor="start">어느 넓이가 옳은지를 신빙론 자체가 정해 주지 않는다</text><text class="ink2 sm" x="30" y="256" text-anchor="start">왼쪽이 신빙론이 사는 것이다 — 믿는 사람이 자기 근거를 들여다보지 못해도 정당화를 말할 수 있다.</text><text class="ink2 sm" x="30" y="278" text-anchor="start">아이가 눈으로 보고 믿는 것, 기억이 떠올려 주는 것에 정당화를 줄 수 있는 것이 이 입장의 힘이다.</text><text class="ink2 sm" x="30" y="306" text-anchor="start">오른쪽이 그 대가다 — 잣대를 대려면 과정을 하나로 지목해야 하는데 같은 사건이 여러 과정에 속한다.</text><text class="ink2 sm" x="30" y="328" text-anchor="start">이것을 일반성 문제라 부른다. 신빙론자들은 답을 여럿 내놓았지만 합의된 답은 아직 없다</text>
</svg>