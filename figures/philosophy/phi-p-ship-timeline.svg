<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 344" width="852" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">테세우스의 배의 두 계보</title><desc id="d">고쳐 온 배와 빼낸 널빤지로 조립한 배가 마지막 시점에 함께 있어 후보가 둘이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="36" y="26" text-anchor="start">테세우스의 배 — 계보가 둘로 갈라진다</text><text class="ink2 sm" x="36" y="50" text-anchor="start">수리 계보 — 해마다 널빤지 하나씩을 새것으로 간다</text><rect x="40" y="62" width="110" height="62" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="95" y="82" text-anchor="middle">시점 t0</text><text class="ink2 sm" x="95" y="100" text-anchor="middle">원래 널빤지 전부</text><rect x="52" y="108" width="86" height="8" rx="2" fill="var(--s1)" fill-opacity="0.75" stroke="var(--s1)" stroke-width="0.8"/><rect x="182" y="62" width="110" height="62" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="237" y="82" text-anchor="middle">시점 t1</text><text class="ink2 sm" x="237" y="100" text-anchor="middle">하나만 새것</text><rect x="194" y="108" width="64.5" height="8" rx="2" fill="var(--s1)" fill-opacity="0.75" stroke="var(--s1)" stroke-width="0.8"/><rect x="258.5" y="108" width="21.5" height="8" rx="2" fill="var(--s2)" fill-opacity="0.75" stroke="var(--s2)" stroke-width="0.8"/><rect x="324" y="62" width="110" height="62" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="379" y="82" text-anchor="middle">시점 t2</text><text class="ink2 sm" x="379" y="100" text-anchor="middle">절반이 새것</text><rect x="336" y="108" width="43" height="8" rx="2" fill="var(--s1)" fill-opacity="0.75" stroke="var(--s1)" stroke-width="0.8"/><rect x="379" y="108" width="43" height="8" rx="2" fill="var(--s2)" fill-opacity="0.75" stroke="var(--s2)" stroke-width="0.8"/><rect x="466" y="62" width="110" height="62" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="521" y="82" text-anchor="middle">시점 t3</text><text class="ink2 sm" x="521" y="100" text-anchor="middle">전부 새것</text><rect x="478" y="108" width="86" height="8" rx="2" fill="var(--s2)" fill-opacity="0.75" stroke="var(--s2)" stroke-width="0.8"/><path d="M150 93 L180 93" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M292 93 L322 93" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M434 93 L464 93" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)"/><path d="M576 93 L622 93" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><rect x="624" y="62" width="190" height="62" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold" x="719" y="86" text-anchor="middle">배 A</text><text class="ink2 sm" x="719" y="108" text-anchor="middle">계속 고쳐 온 배</text><path d="M237 128 L237 178" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#ark)"/><path d="M379 128 L379 178" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#ark)"/><path d="M521 128 L521 178" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#ark)"/><text class="ink2 sm" x="196" y="154" text-anchor="end">빼낸 널빤지</text><rect x="182" y="180" width="394" height="48" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3" stroke-dasharray="5 4"/><text class="ink sm" x="379" y="209" text-anchor="middle">창고 — 빼낸 널빤지를 하나도 버리지 않고 모아 둔다</text><path d="M578 204 L622 204" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)"/><rect x="624" y="180" width="190" height="48" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold sm" x="719" y="200" text-anchor="middle">배 B</text><text class="ink2 sm" x="719" y="219" text-anchor="middle">모아 둔 널빤지로 조립한 배</text><text class="ink2 sm" x="36" y="262" text-anchor="start">배 A 는 자리와 쓰임과 역사가 한 번도 끊기지 않았고, 배 B 는 재료가 처음 그대로다. 둘 다 ‘그 배’ 라 부를 이유가 있다</text><text class="ink2 sm" x="36" y="281" text-anchor="start">그런데 t3 에는 둘이 함께 있다. 한 대상이 둘일 수는 없으므로 적어도 하나는 그 배가 아니다</text><text class="ink2 sm" x="36" y="300" text-anchor="start">이 그림이 묻는 것은 배가 아니라 시간을 통한 동일성의 기준이다. 13장이 같은 물음을 사람에 대해 되풀이한다</text>
</svg>