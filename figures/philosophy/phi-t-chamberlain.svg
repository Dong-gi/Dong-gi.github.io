<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 396" width="840" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">윌트 체임벌린 사례에서 정형이 깨지는 과정</title><desc id="d">왼쪽은 모두가 똑같이 가진 분배, 오른쪽은 각자가 조금씩 넘겨준 뒤 한 사람만 크게 가진 분배다. 중간의 어느 단계에서도 강요나 속임이 없었다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">자발적인 이전만으로 정형이 깨진다</text><text class="ink bold sm" x="40" y="62" text-anchor="start">D1 — 당신이 고른 정형 원리가 정의롭다고 판정한 분배</text><rect x="46" y="144" width="22" height="70" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="78" y="144" width="22" height="70" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="110" y="144" width="22" height="70" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="142" y="144" width="22" height="70" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="174" y="144" width="22" height="70" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="206" y="144" width="22" height="70" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="238" y="144" width="22" height="70" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="270" y="144" width="22" height="70" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><path d="M40 214 L302 214" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><text class="ink2 sm" x="40" y="234" text-anchor="start">여덟 사람이 똑같이 가졌다고 하자</text><path class="s2" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M330 174 L422 174"/><text class="ink bold sm" x="376" y="158" text-anchor="middle">각자 25센트</text><text class="ink2 sm" x="376" y="196" text-anchor="middle">자발적으로 낸다</text><text class="ink2 sm" x="376" y="216" text-anchor="middle">속임도 강요도 없다</text><text class="ink bold sm" x="470" y="62" text-anchor="start">D2 — 이전이 끝난 뒤의 분배</text><rect x="476" y="156" width="22" height="58" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="508" y="156" width="22" height="58" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="540" y="156" width="22" height="58" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="572" y="156" width="22" height="58" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="604" y="156" width="22" height="58" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="636" y="156" width="22" height="58" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="668" y="156" width="22" height="58" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="700" y="156" width="22" height="58" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><rect x="746" y="62" width="30" height="152" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="761" y="50" text-anchor="middle">체임벌린</text><path d="M470 214 L788 214" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><text class="ink2 sm" x="470" y="234" text-anchor="start">정형이 깨졌다. 그런데 어느 단계에서 부당한 일이 있었는가</text><text class="ink bold sm" x="40" y="272" text-anchor="start">이 논증이 말하는 것은 ‘재분배는 나쁘다’ 가 아니다. 분배의 모양을 정해 두는 원리와 자발적 이전이 함께 갈 수 없다는 것이다</text><text class="ink2 sm" x="40" y="296" text-anchor="start">정형을 지키려면 둘 중 하나를 해야 한다. 사람들이 자기 몫으로 하려는 일을 계속 막거나, 하고 난 뒤에 계속 되돌리거나</text><text class="ink2 sm" x="40" y="318" text-anchor="start">반론이 들어오는 자리도 정해져 있다. D1 의 몫이 어떻게 정당해졌는가, 무엇을 자유의 침해로 셀 것인가, 같은 이전이 되풀이되면 어떻게 되는가</text><text class="ink2 sm" x="40" y="340" text-anchor="start">노직이 든 원래 숫자는 관중 100만 명에 25만 달러였다. 여기서는 그림으로 보이려고 사람 수를 여덟으로 줄였다</text>
</svg>