ke="var(--s3)" stroke-width="1.4" stroke-linecap="round"/><circle cx="520" cy="106" r="15" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="700" cy="100" r="15" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="468" cy="190" r="15" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="614" cy="166" r="15" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="744" cy="196" r="15" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="566" cy="240" r="15" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="690" cy="246" r="15" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><text class="ink2 sm" x="614" y="262" text-anchor="middle">어느 마디도 특별하지 않다. 서로가 서로의 근거다</text><text class="ink2 sm" x="30" y="300" text-anchor="start">토대론이 사는 값 — 기초 믿음이 어떻게 근거 없이 정당화되는지를 설명해야 한다</text><text class="ink2 sm" x="30" y="322" text-anchor="start">정합론이 사는 값 — 잘 짜였지만 세계와 어긋난 그물을 어떻게 걸러 낼지를 설명해야 한다</text>
