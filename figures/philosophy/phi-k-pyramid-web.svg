<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 348" width="830" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">토대론의 피라미드와 정합론의 그물</title><desc id="d">토대론은 정당화가 기초에서 위로만 흐른다고 보고 정합론은 믿음들이 서로를 받친다고 본다</desc>
