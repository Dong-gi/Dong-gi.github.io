<text class="ink bold" x="30" y="26" text-anchor="start">정당화가 한 방향으로 흐르는가, 서로를 받치는가</text><rect x="30" y="42" width="372" height="232" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.1"/><text class="ink bold sm" x="216" y="64" text-anchor="middle">토대론</text><rect x="168" y="88" width="96" height="34" rx="4" fill="var(--s1)" fill-opacity="0.11" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="216" y="110" text-anchor="middle">그 밖의 믿음</text><rect x="98" y="148" width="96" height="34" rx="4" fill="var(--s1)" fill-opacity="0.11" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="146" y="170" text-anchor="middle">중간 믿음</text><rect x="238" y="148" width="96" height="34" rx="4" fill="var(--s1)" fill-opacity="0.11" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="286" y="170" text-anchor="middle">중간 믿음</text><rect x="48" y="208" width="96" height="34" rx="4" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="96" y="230" text-anchor="middle">기초</text><rect x="168" y="208" width="96" height="34" rx="4" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="216" y="230" text-anchor="middle">기초</text><rect x="288" y="208" width="96" height="34" rx="4" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="336" y="230" text-anchor="middle">기초</text><path d="M146 148 L183.74 129.13" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M190 126 L185.68 133.01 L181.8 125.25 z" fill="var(--ink2)"/><path d="M286 148 L248.26 129.13" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M242 126 L250.2 125.25 L246.32 133.01 z" fill="var(--ink2)"/><path d="M96 208 L124.12 189.8" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><path d="M130 186 L126.48 193.45 L121.77 186.16 z" fill=