<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">다수 실현 가능성</title><desc id="d">가운데 위의 마음 유형 하나에서 사람 문어 규소 생물 사람 안의 변이라는 네 물리 유형으로 화살표가 뻗는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">같은 마음 유형이 여러 물리 유형으로 실현된다</text><text class="ink bold sm" x="40" y="66" text-anchor="start">위쪽 층</text><text class="ink2 sm" x="40" y="86" text-anchor="start">마음 유형은 하나</text><rect x="350" y="72" width="200" height="54" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold" x="450" y="105" text-anchor="middle">고통</text><path d="M40 158 L860 158" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><text class="ink bold sm" x="40" y="182" text-anchor="start">아래쪽 층</text><text class="ink2 sm" x="40" y="202" text-anchor="start">물리 유형은 여럿</text><rect x="64" y="226" width="186" height="90" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.7"/><text class="ink bold sm" x="76" y="249" text-anchor="start">사람</text><text class="ink2 sm" x="76" y="271" text-anchor="start">어떤 신경 상태</text><text class="ink2 sm" x="76" y="288" text-anchor="start">(C-섬유 발화라는</text><text class="ink2 sm" x="76" y="305" text-anchor="start">자리 표시)</text><path d="M450 130 L157 222" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)"/><rect x="268" y="226" width="186" height="90" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.7"/><text class="ink bold sm" x="280" y="249" text-anchor="start">문어</text><text class="ink2 sm" x="280" y="271" text-anchor="start">구조가 아주 다른</text><text class="ink2 sm" x="280" y="288" text-anchor="start">신경계의 다른 상태</text><path d="M450 130 L361 222" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)"/><rect x="472" y="226" width="186" height="90" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.7"/><text class="ink bold sm" x="484" y="249" text-anchor="start">규소로 만든 존재</text><text class="ink2 sm" x="484" y="271" text-anchor="start">신경계가 아닌 것으로</text><text class="ink2 sm" x="484" y="288" text-anchor="start">이루어진 상태</text><path d="M450 130 L565 222" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)"/><rect x="676" y="226" width="186" height="90" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.7"/><text class="ink bold sm" x="688" y="249" text-anchor="start">사람 안의 변이</text><text class="ink2 sm" x="688" y="271" text-anchor="start">뇌 손상 뒤 다른 부위가</text><text class="ink2 sm" x="688" y="288" text-anchor="start">그 일을 떠맡은 상태</text><path d="M450 130 L769 222" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink2 sm" x="40" y="348" text-anchor="start">위쪽 층에서 하나인 것이 아래쪽 층에서 여럿이면 유형끼리의 동일성은 성립할 수 없다</text><text class="ink2 sm" x="40" y="368" text-anchor="start">넷째 칸이 있어서 이 논증은 공상에 기대지 않는다. 규소 생물을 물리쳐도 문어가 남고, 문어를 물리쳐도 사람 안의 변이가 남는다</text><text class="ink2 sm" x="40" y="388" text-anchor="start">무너지는 것은 유형 동일론까지다. 낱낱의 사건끼리 묶는 사례 동일론과 물리주의 자체는 다치지 않는다</text><text class="ink2 sm" x="40" y="408" text-anchor="start">유형 동일론 쪽 되받음 — 동일화를 종에 상대적으로 한다. 대가는 ‘고통 그 자체’ 에 대한 일반적인 답이 없어지는 것이다</text>
</svg>