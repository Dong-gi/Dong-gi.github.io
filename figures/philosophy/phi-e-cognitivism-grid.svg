<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 452" width="864" height="452" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">메타윤리 입장을 두 물음으로 가른 표</title><desc id="d">세로는 도덕 문장이 믿음을 적는가 태도를 드러내는가, 가로는 그 문장을 참으로 만들 사실이 있는가로 나눈 네 칸</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="28" text-anchor="start">메타윤리 입장을 두 물음으로 가른다</text><rect x="40" y="48" width="176" height="44" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="66" text-anchor="start">아래로 — 도덕 문장은</text><text class="ink bold sm" x="50" y="82" text-anchor="start">옆으로 — 도덕 사실이</text><rect x="216" y="48" width="304" height="44" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="227" y="75" text-anchor="start">그 문장을 참으로 만들 것이 있다</text><rect x="520" y="48" width="304" height="44" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="531" y="75" text-anchor="start">그런 것은 없다</text><rect x="40" y="92" width="176" height="124" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="118" text-anchor="start">믿음을 적는다</text><text class="ink2 sm" x="50" y="140" text-anchor="start">참·거짓을 물을 수 있다</text><text class="ink2 sm" x="50" y="160" text-anchor="start">이 줄을 인지주의라</text><text class="ink2 sm" x="50" y="178" text-anchor="start">부른다</text><rect x="216" y="92" width="304" height="124" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.9"/><text class="ink bold sm" x="227" y="115" text-anchor="start">도덕 실재론 · 주관주의 · 상대주의</text><text class="ink2 sm" x="227" y="136" text-anchor="start">참인 도덕 문장이 실제로 있다</text><text class="ink2 sm" x="227" y="153" text-anchor="start">여기서 한 번 더 갈린다 — 그 참이</text><text class="ink2 sm" x="227" y="170" text-anchor="start">우리 태도에 의존하는가 아닌가</text><text class="ink2 sm" x="227" y="187" text-anchor="start">의존하지 않는다면 실재론이다</text><rect x="520" y="92" width="304" height="124" rx="3" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="531" y="115" text-anchor="start">오류 이론</text><text class="ink2 sm" x="531" y="136" text-anchor="start">도덕 문장은 사실을 적으려 하지만</text><text class="ink2 sm" x="531" y="153" text-anchor="start">적을 사실이 없어 모두 거짓이다</text><text class="ink2 sm" x="531" y="170" text-anchor="start">매키</text><rect x="40" y="216" width="176" height="124" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="242" text-anchor="start">태도를 드러낸다</text><text class="ink2 sm" x="50" y="264" text-anchor="start">참·거짓을 묻는 것이</text><text class="ink2 sm" x="50" y="284" text-anchor="start">자리를 잘못 잡은 것이다</text><text class="ink2 sm" x="50" y="304" text-anchor="start">이 줄이 비인지주의다</text><rect x="216" y="216" width="304" height="124" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4"/><text class="ink bold sm" x="227" y="239" text-anchor="start">거의 비어 있던 칸</text><text class="ink2 sm" x="227" y="260" text-anchor="start">태도를 드러낼 뿐인 문장을 참으로</text><text class="ink2 sm" x="227" y="277" text-anchor="start">만드는 사실이 따로 있다고 말하기</text><text class="ink2 sm" x="227" y="294" text-anchor="start">어렵다. 준실재론이 이 칸을 다시</text><text class="ink2 sm" x="227" y="311" text-anchor="start">채우려는 시도로 읽힌다</text><rect x="520" y="216" width="304" height="124" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.9"/><text class="ink bold sm" x="531" y="239" text-anchor="start">비인지주의</text><text class="ink2 sm" x="531" y="260" text-anchor="start">정서주의 · 규정주의 · 표현주의</text><text class="ink2 sm" x="531" y="277" text-anchor="start">도덕 문장이 하는 일은 사실 보고가</text><text class="ink2 sm" x="531" y="294" text-anchor="start">아니라 태도의 표현이다</text><text class="ink2 sm" x="40" y="370" text-anchor="start">실재론과 반실재론을 가르는 선은 이 표의 세로선이 아니다. 왼쪽 위 칸 안에 한 번 더 그어진다</text><text class="ink2 sm" x="40" y="391" text-anchor="start">상대주의는 왼쪽 위에 있다 — 참인 도덕 문장이 있되 그 참이 틀에 상대적이라고 본다</text><text class="ink2 sm" x="40" y="412" text-anchor="start">어느 칸도 지워지지 않았다. 도덕 실재론과 반실재론의 다툼은 미결이고, 근소한 차이다</text>
</svg>