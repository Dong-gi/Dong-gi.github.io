<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 320" width="848" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">필요조건·충분조건·필요충분조건</title><desc id="d">조건과 개념의 포함 관계 세 가지와 각각에서 나오는 반례의 방향</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="30" y="28" text-anchor="start">조건 C 와 개념 X 사이에 있을 수 있는 세 가지 관계</text><text class="ink bold sm" x="160" y="58" text-anchor="middle">C 는 X 의 필요조건</text><ellipse cx="160" cy="140" rx="118" ry="58" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.8"/><ellipse cx="160" cy="152" rx="62" ry="32" fill="var(--s1)" fill-opacity="0.24" stroke="var(--s1)" stroke-width="1.6"/><text class="ink2 sm" x="160" y="100" text-anchor="middle">C 를 만족하는 것</text><text class="ink sm" x="160" y="157" text-anchor="middle">X 인 것</text><text class="ink2 sm" x="160" y="226" text-anchor="middle">X 이면 반드시 C 다.</text><text class="ink2 sm" x="160" y="246" text-anchor="middle">C 가 아니면 X 가 아니다.</text><text class="ink2 sm" x="160" y="266" text-anchor="middle">여기서 나올 반례 — C 인데 X 가 아닌 것</text><text class="ink bold sm" x="430" y="58" text-anchor="middle">C 는 X 의 충분조건</text><ellipse cx="430" cy="140" rx="118" ry="58" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.8"/><ellipse cx="430" cy="152" rx="62" ry="32" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1.6"/><text class="ink2 sm" x="430" y="100" text-anchor="middle">X 인 것</text><text class="ink sm" x="430" y="157" text-anchor="middle">C 를 만족하는 것</text><text class="ink2 sm" x="430" y="226" text-anchor="middle">C 이면 반드시 X 다.</text><text class="ink2 sm" x="430" y="246" text-anchor="middle">X 라고 C 인 것은 아니다.</text><text class="ink2 sm" x="430" y="266" text-anchor="middle">여기서 나올 반례 — X 인데 C 가 아닌 것</text><text class="ink bold sm" x="700" y="58" text-anchor="middle">C 는 X 의 필요충분조건</text><ellipse cx="700" cy="140" rx="118" ry="58" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.8"/><ellipse cx="700" cy="140" rx="108" ry="48" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink sm" x="700" y="137" text-anchor="middle">X 인 것</text><text class="ink sm" x="700" y="158" text-anchor="middle">= C 를 만족하는 것</text><text class="ink2 sm" x="700" y="226" text-anchor="middle">두 방향이 다 성립한다.</text><text class="ink2 sm" x="700" y="246" text-anchor="middle">개념 분석이 노리는 것이 이것이다.</text><text class="ink2 sm" x="700" y="266" text-anchor="middle">반례가 어느 쪽에서도 나오지 않아야 한다</text><text class="ink2 sm" x="30" y="302" text-anchor="start">분석안을 내놓는다는 것은 오른쪽 그림이 되기를 바라며 조건 C 를 제안하는 일이고, 반례를 든다는 것은 왼쪽이나 가운데 그림임을 보이는 일이다.</text>
</svg>