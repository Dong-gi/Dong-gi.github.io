<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">바이러스의 구조와 크기</title><desc id="d">유전체와 캡시드, 때로는 외피가 전부다. 크기 사다리에서 보듯 리보솜을 담을 공간조차 없으므로 숙주 세포 밖에서는 증식할 수 없다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink2 sm" x="30" y="30" text-anchor="start">구조 — 세포에 있는 것 가운데 무엇이 없는지를 보라</text><circle cx="132" cy="130" r="62" fill="var(--s2)" fill-opacity="0.07" stroke="var(--s2)" stroke-width="2" stroke-dasharray="6 4"/><circle cx="132" cy="130" r="44" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="2"/><path d="M194 130 L206 130" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M175.84 86.16 L184.33 77.67" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 68 L132 56" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M88.16 86.16 L79.67 77.67" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 130 L58 130" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M88.16 173.84 L79.67 182.33" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 192 L132 204" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M175.84 173.84 L184.33 182.33" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 136 L122 116 L136 140 L150 118 L158 134" fill="none" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="132" y="226" text-anchor="middle">유전체 (DNA 또는 RNA)</text><text class="ink2 sm" x="132" y="244" text-anchor="middle">캡시드 = 단백질 껍질</text><text class="ink2 sm" x="132" y="262" text-anchor="middle">외피 = 숙주 막에서 빌린 것 (없는 것도 있다)</text><path d="M330 60 L330 250" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M324 228.3 L336 228.3" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="228.3" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="344" y="232.3" text-anchor="start">리보솜 25 nm</text><path d="M324 195.47 L336 195.47" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="195.47" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="344" y="199.47" text-anchor="start">보통의 바이러스 100 nm</text><path d="M324 140.94 L336 140.94" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="140.94" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="344" y="144.94" text-anchor="start">세균 1 µm = 1000 nm</text><path d="M324 76.81 L336 76.81" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="76.81" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="344" y="80.81" text-anchor="start">사람의 세포 15 µm</text><text class="ink2 sm" x="320" y="54" text-anchor="end">크게</text><text class="ink2 sm" x="320" y="254" text-anchor="end">작게</text><text class="ink2 sm" x="330" y="44" text-anchor="start">세로 눈금은 한 칸이 10배인 로그 눈금이다</text><text class="ink2 sm" x="330" y="276" text-anchor="start">바이러스는 세균보다 열 배 작고 리보솜보다 몇 배 클 뿐이다.</text><text class="ink bold sm" x="330" y="294" text-anchor="start">이 크기에는 리보솜도 대사 효소도 담을 자리가 없다.</text>
</svg>