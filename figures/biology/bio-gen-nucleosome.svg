<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 348" width="700" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">크로마틴의 접힘 단계와 접근성</title><desc id="d">접힌 정도가 전사인자의 접근 가능성을 정한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="350" y="26" text-anchor="middle">크로마틴 — 접혀 있는 정도가 곧 읽을 수 있는 정도다</text><rect x="16" y="50" width="208" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="120" y="69" text-anchor="middle">벌거벗은 DNA</text><text class="ink2 sm" x="120" y="85" text-anchor="middle">지름 약 2 nm</text><rect x="246" y="50" width="208" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="350" y="69" text-anchor="middle">뉴클레오솜 목걸이</text><text class="ink2 sm" x="350" y="85" text-anchor="middle">8량체에 약 147 염기쌍이 감긴다</text><rect x="476" y="50" width="208" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="580" y="69" text-anchor="middle">더 접힌 상태</text><text class="ink2 sm" x="580" y="85" text-anchor="middle">읽을 수 없다</text><path d="M40 150 L200 150" fill="none" stroke="var(--s1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 162 L200 162" fill="none" stroke="var(--s2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="120" y="208" text-anchor="middle">전사인자가 자유롭게 닿는다</text><circle cx="294" cy="156" r="19" fill="var(--s3)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><circle cx="294" cy="156" r="25" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="3"/><path d="M282 133 L276 120" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M294 133 L291 120" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M306 133 L306 120" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="156" r="19" fill="var(--s3)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><circle cx="350" cy="156" r="25" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="3"/><path d="M338 133 L332 120" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 133 L347 120" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M362 133 L362 120" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="406" cy="156" r="19" fill="var(--s3)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><circle cx="406" cy="156" r="25" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="3"/><path d="M394 133 L388 120" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M406 133 L403 120" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M418 133 L418 120" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M268 156 L276 156" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 156 L348 156" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M376 156 L404 156" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M432 156 L440 156" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="350" y="110" text-anchor="middle">히스톤 꼬리 — 여기에 표지가 붙는다</text><text class="ink2 sm" x="350" y="208" text-anchor="middle">느슨하면 아직 닿을 수 있다</text><circle cx="524" cy="128" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="562" cy="128" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="600" cy="128" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="638" cy="128" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="524" cy="154" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="562" cy="154" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="600" cy="154" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="638" cy="154" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="524" cy="180" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="562" cy="180" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="600" cy="180" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><circle cx="638" cy="180" r="15" fill="var(--ink2)" fill-opacity="0.36" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="580" y="208" text-anchor="middle">빽빽이 쌓이면 닿지 못한다</text><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M228 156 L242 156"/><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M458 156 L472 156"/><text class="ink bold" x="30" y="300" text-anchor="start">여는 수단</text><text class="ink2 sm" x="114" y="300" text-anchor="start">히스톤 꼬리의 아세틸화(양전하를 없애 결합을 약하게 한다), 리모델러가 뉴클레오솜 밀어내기</text><text class="ink bold" x="30" y="326" text-anchor="start">닫는 수단</text><text class="ink2 sm" x="114" y="326" text-anchor="start">탈아세틸화, 억압과 연관된 메틸 표지, DNA 메틸화가 부르는 억압 복합체</text>
</svg>