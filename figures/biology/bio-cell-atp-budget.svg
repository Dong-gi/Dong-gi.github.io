<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 356" width="690" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">ATP 수지</title><desc id="d">두 셔틀에 따른 포도당 1분자당 ATP 수량 비교</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">포도당 하나에서 ATP 몇 개가 나오는가 — 셔틀에 따라 갈린다</text><path class="gr" d="M84 260 H334"/><path class="gr" d="M84 210 H334"/><path class="gr" d="M84 160 H334"/><path class="gr" d="M84 110 H334"/><path class="ax" marker-end="url(#ark)" d="M84 260 H344"/><path class="ax" marker-end="url(#ark)" d="M84 260 V70"/><text class="sm ink2" x="78" y="214" text-anchor="end">10</text><text class="sm ink2" x="78" y="164" text-anchor="end">20</text><text class="sm ink2" x="78" y="114" text-anchor="end">30</text><text class="sm ink2" x="84" y="62" text-anchor="middle">ATP</text><rect x="109" y="240" width="75" height="20" rx="2" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.3"/><text class="ink sm" x="146.5" y="254" text-anchor="middle">4</text><rect x="109" y="115" width="75" height="125" rx="2" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="146.5" y="181.5" text-anchor="middle">25</text><rect x="109" y="100" width="75" height="15" rx="2" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.3"/><text class="ink sm" x="146.5" y="111.5" text-anchor="middle">3</text><text class="ink bold" x="146.5" y="90" text-anchor="middle">32</text><text class="ink2 sm" x="146.5" y="280" text-anchor="middle">말산-아스파르트산</text><text class="ink2 sm" x="146.5" y="296" text-anchor="middle">셔틀</text><rect x="234" y="240" width="75" height="20" rx="2" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.3"/><text class="ink sm" x="271.5" y="254" text-anchor="middle">4</text><rect x="234" y="140" width="75" height="100" rx="2" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="271.5" y="194" text-anchor="middle">20</text><rect x="234" y="110" width="75" height="30" rx="2" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.3"/><text class="ink sm" x="271.5" y="129" text-anchor="middle">6</text><text class="ink bold" x="271.5" y="100" text-anchor="middle">30</text><text class="ink2 sm" x="271.5" y="280" text-anchor="middle">글리세롤-3-인산</text><text class="ink2 sm" x="271.5" y="296" text-anchor="middle">셔틀</text><rect x="376" y="76" width="14" height="3" rx="1.5" class="f3"/><text class="sm ink2" x="396" y="82">기질 수준 인산화 (4개)</text><rect x="376" y="94" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="396" y="100">미토콘드리아 NADH × 2.5</text><rect x="376" y="112" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="396" y="118">FADH₂ × 1.5</text><text class="ink2 sm" x="376" y="160" text-anchor="start">두 막대의 차이는 딱 하나다.</text><text class="ink2 sm" x="376" y="178" text-anchor="start">세포질에서 만든 NADH 2개를</text><text class="ink2 sm" x="376" y="196" text-anchor="start">미토콘드리아 안으로 어떻게</text><text class="ink2 sm" x="376" y="214" text-anchor="start">넘기느냐. NADH 로 넘기면</text><text class="ink2 sm" x="376" y="232" text-anchor="start">2.5씩, FADH₂ 로 넘기면</text><text class="ink2 sm" x="376" y="250" text-anchor="start">1.5씩 받는다.</text><text class="ink2 sm" x="20" y="324" text-anchor="start">이 값들은 정수가 아니고 조건에 따라 변한다. ‘포도당 하나당 약 30-32개’라고 적는 것이 정직하다.</text><text class="ink2 sm" x="20" y="346" text-anchor="start">옛 교재의 36-38개는 NADH 당 3, FADH₂ 당 2 로 어림하던 시절의 값이다. 사실이 바뀐 것이 아니라 가정이 바뀌었다.</text>
</svg>