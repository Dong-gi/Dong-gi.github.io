<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 348" width="690" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">해당과정 ATP 누적</title><desc id="d">단계별 ATP 누적 그래프와 투자기·회수기의 구분</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">해당과정 — 먼저 2개를 쓰고 나중에 4개를 번다</text><path class="gr" d="M84 258 V82"/><path class="gr" d="M144 258 V82"/><path class="gr" d="M204 258 V82"/><path class="gr" d="M264 258 V82"/><path class="gr" d="M324 258 V82"/><path class="gr" d="M384 258 V82"/><path class="gr" d="M84 258 H384"/><path class="gr" d="M84 228.67 H384"/><path class="gr" d="M84 199.33 H384"/><path class="gr" d="M84 170 H384"/><path class="gr" d="M84 140.67 H384"/><path class="gr" d="M84 111.33 H384"/><path class="gr" d="M84 82 H384"/><path class="ax" marker-end="url(#ark)" d="M84 170 H394"/><path class="ax" marker-end="url(#ark)" d="M84 258 V72"/><text class="sm ink2" x="144" y="185" text-anchor="middle">2</text><text class="sm ink2" x="204" y="185" text-anchor="middle">4</text><text class="sm ink2" x="264" y="185" text-anchor="middle">6</text><text class="sm ink2" x="324" y="185" text-anchor="middle">8</text><text class="sm ink2" x="384" y="185" text-anchor="middle">10</text><text class="sm ink2" x="78" y="262" text-anchor="end">-3</text><text class="sm ink2" x="78" y="232.67" text-anchor="end">-2</text><text class="sm ink2" x="78" y="203.33" text-anchor="end">-1</text><text class="sm ink2" x="78" y="144.67" text-anchor="end">1</text><text class="sm ink2" x="78" y="115.33" text-anchor="end">2</text><text class="sm ink2" x="78" y="86" text-anchor="end">3</text><text class="sm ink2" x="84" y="64" text-anchor="middle">누적 ATP</text><text class="ink2 sm" x="234" y="296" text-anchor="middle">해당과정의 열 단계</text><path class="cv s1" d="M84 170 L114 170 L114 199.33 L174 199.33 L174 228.67 L294 228.67 L294 170 L384 170 L384 111.33"/><circle class="f2" cx="114" cy="199.33" r="3.5"/><circle class="f2" cx="174" cy="228.67" r="3.5"/><circle class="f1" cx="294" cy="170" r="3.5"/><circle class="f1" cx="384" cy="111.33" r="3.5"/><text class="ink sm" x="96" y="217.33" text-anchor="middle">헥소키네이스 −1</text><text class="ink sm" x="174" y="248.67" text-anchor="middle">PFK−1 −1</text><text class="ink sm" x="234" y="160" text-anchor="start">+2 (3탄당 2개 × 1)</text><text class="ink sm" x="364" y="101.33" text-anchor="start">+2</text><path class="gr" stroke-dasharray="4 3" d="M84 170 L384 170"/><text class="ink bold sm" x="432" y="84" text-anchor="start">투자기 (1-5단계)</text><text class="ink2 sm" x="432" y="104" text-anchor="start">ATP 2개를 써서 포도당에</text><text class="ink2 sm" x="432" y="122" text-anchor="start">인산을 붙인다. 그러면 세포</text><text class="ink2 sm" x="432" y="140" text-anchor="start">밖으로 새 나가지 못하고,</text><text class="ink2 sm" x="432" y="158" text-anchor="start">쪼개지기 쉬운 모양이 된다.</text><text class="ink bold sm" x="432" y="190" text-anchor="start">회수기 (6-10단계)</text><text class="ink2 sm" x="432" y="210" text-anchor="start">6탄당이 3탄당 2개로 갈라진</text><text class="ink2 sm" x="432" y="228" text-anchor="start">뒤이므로 모든 단계를 두 번</text><text class="ink2 sm" x="432" y="246" text-anchor="start">센다. ATP 4개와 NADH 2개.</text><text class="ink sm" x="20" y="322" text-anchor="start">순수지 = −2 + 4 = +2 ATP. 여기에 NADH 2개가 따로 남는다.</text><text class="ink2 sm" x="20" y="342" text-anchor="start">가장 흔한 실수는 갈라진 뒤의 단계에 2를 곱하는 것을 잊는 것이다. 갈라지기 전 단계는 그대로 한 번씩 센다.</text>
</svg>