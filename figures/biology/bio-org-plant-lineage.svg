<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 352" width="700" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">육상식물의 계통과 네 가지 혁신</title><desc id="d">녹조류에서 속씨식물까지의 계통수에 큐티클, 관다발, 종자, 꽃이 생긴 자리를 표시했다. 진화 방향은 배우체의 축소와 포자체의 우세다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
