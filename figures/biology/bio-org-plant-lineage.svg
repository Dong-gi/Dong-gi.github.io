xt-anchor="start">양치류</text><text class="ink2 sm" x="560" y="167" text-anchor="start">포자체 (2n)</text><text class="ink bold sm" x="439" y="219" text-anchor="start">겉씨식물</text><text class="ink2 sm" x="560" y="219" text-anchor="start">포자체 (2n)</text><text class="ink bold sm" x="439" y="271" text-anchor="start">속씨식물</text><text class="ink2 sm" x="560" y="271" text-anchor="start">포자체 (2n)</text><text class="ink sm" x="560" y="40" text-anchor="start">우세한 세대</text><rect x="161" y="147" width="8" height="18" rx="2" fill="var(--s3)" fill-opacity="0.85" stroke="var(--s3)" stroke-width="1"/><text class="ink bold sm" x="165" y="142" text-anchor="middle">①</text><rect x="231" y="192" width="8" height="18" rx="2" fill="var(--s3)" fill-opacity="0.85" stroke="var(--s3)" stroke-width="1"/><text class="ink bold sm" x="235" y="187" text-anchor="middle">②</text><rect x="301" y="231" width="8" height="18" rx="2" fill="var(--s3)" fill-opacity="0.85" stroke="var(--s3)" stroke-width="1"/><text class="ink bold sm" x="305" y="226" text-anchor="middle">③</text><rect x="376" y="257" width="8" height="18" rx="2" fill="var(--s3)" fill-opacity="0.85" stroke="var(--s3)" stroke-width="1"/><text class="ink bold sm" x="380" y="252" text-anchor="middle">④</text><text class="ink2 sm" x="30" y="26" text-anchor="start">가지에 번호를 찍으면 계통수가 ‘언제 무엇이 새로 생겼는가’의 지도가 된다</text><text class="ink sm" x="30" y="300" text-anchor="start">① 큐티클 · 기공 · 배 보호 — 마르지 않고 살기</text><text class="ink sm" x="30" y="318" text-anchor="start">② 관다발(물관부 · 체관부)과 리그닌 — 세우고 나르기</text><text class="ink sm" x="374" y="300" text-anchor="start">③ 종자와 꽃가루 — 물 없이 수정하기</text><text class="ink sm" x="374" y="318" text-anchor="start">④ 꽃 · 열매 · 중복수정 — 수분 효율과 산포</text><text class="ink2 sm" x="30" y="340" text-anchor="start">외울 것은 이름이 아니라 순서다. 각 혁신은 그 앞 단계가 풀지 못한 문제를 하나씩 푼다</text>
</svg>