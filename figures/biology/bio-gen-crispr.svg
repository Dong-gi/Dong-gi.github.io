<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 424" width="700" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">CRISPR-Cas9 의 표적 인식과 절단 뒤의 두 갈래</title><desc id="d">안내 RNA 가 자리를 정하고 수선 경로가 결과를 정한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="350" y="26" text-anchor="middle">CRISPR-Cas9 — 자르는 데까지가 이 도구의 일이다</text><rect x="130" y="110" width="420" height="24" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1.1"/><rect x="130" y="138" width="420" height="24" rx="3" fill="var(--s2)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="287.5" y="127" text-anchor="middle">표적 서열 20 글자</text><rect x="445" y="110" width="63" height="24" rx="3" fill="var(--s3)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="476.5" y="127" text-anchor="middle">PAM</text><text class="ink2 sm" x="518.5" y="102" text-anchor="middle">Cas9 이 확인하는 짧은 서열</text><text class="ink bold" x="120" y="127" text-anchor="end">5′</text><text class="ink bold" x="120" y="155" text-anchor="end">3′</text><rect x="130" y="74" width="315" height="22" rx="3" fill="var(--s2)" fill-opacity="0.35" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="287.5" y="90" text-anchor="middle">안내 RNA — 이 20 글자가 표적을 고른다</text><path d="M140.5 96 L140.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M161.5 96 L161.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M182.5 96 L182.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M203.5 96 L203.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M224.5 96 L224.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M245.5 96 L245.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.5 96 L266.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M287.5 96 L287.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M308.5 96 L308.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.5 96 L329.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M350.5 96 L350.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M371.5 96 L371.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M392.5 96 L392.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M413.5 96 L413.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M434.5 96 L434.5 110" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M382 98 L382 174" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3"/><text class="ink sm" x="392" y="192" text-anchor="start">PAM 에서 세 글자 앞을 자른다</text><ellipse cx="203.5" cy="192" rx="72" ry="19" fill="var(--ink2)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="203.5" y="197" text-anchor="middle">Cas9 (가위)</text><path d="M30 222 L670 222" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M310 228 L200 262"/><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M390 228 L500 262"/><rect x="30" y="268" width="300" height="130" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="180" y="287" text-anchor="middle">주형이 없으면</text><text class="ink2 sm" x="180" y="303" text-anchor="middle">비상동 말단 연결</text><rect x="370" y="268" width="300" height="130" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="520" y="287" text-anchor="middle">공여 DNA 를 함께 넣으면</text><text class="ink2 sm" x="520" y="303" text-anchor="middle">상동 재조합 수선</text><text class="ink sm" x="46" y="334" text-anchor="start">작은 삽입이나 결실이 남는다</text><text class="ink sm" x="46" y="354" text-anchor="start">대개 틀 이동 → 기능 상실</text><text class="ink2 sm" x="46" y="378" text-anchor="start">쉽고 효율이 높다</text><text class="ink sm" x="386" y="334" text-anchor="start">지정한 서열로 정확히 바뀐다</text><text class="ink sm" x="386" y="354" text-anchor="start">점변이 도입, 표지 삽입</text><text class="ink2 sm" x="386" y="378" text-anchor="start">효율이 낮고 세포 주기를 탄다</text><text class="ink2 sm" x="350" y="416" text-anchor="middle">자른 다음에 무엇이 되는지는 세포의 수선 경로가 정한다. 그래서 망가뜨리기는 쉽고 원하는 대로 바꾸기는 어렵다</text>
</svg>