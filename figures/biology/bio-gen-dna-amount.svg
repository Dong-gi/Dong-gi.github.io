<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">세포 주기에 따른 DNA 양</title><desc id="d">체세포분열과 감수분열에서 C 값이 어떻게 오르내리는지 비교</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path class="gr" d="M66 123.57 H438"/><path class="gr" d="M66 103.15 H438"/><path class="gr" d="M66 62.3 H438"/><path class="ax" marker-end="url(#ark)" d="M66 144 H448"/><path class="ax" marker-end="url(#ark)" d="M66 144 V38"/><text class="sm ink2" x="60" y="127.57" text-anchor="end">1</text><text class="sm ink2" x="60" y="107.15" text-anchor="end">2</text><text class="sm ink2" x="60" y="66.3" text-anchor="end">4</text><text class="sm ink2" x="58" y="40" text-anchor="end">DNA 양 (C)</text><path class="cv s1" d="M66 103.15 L140.4 103.15 L214.8 62.3 L348.72 62.3 L348.72 103.15 L438 103.15"/><text class="ink bold" x="122" y="34" text-anchor="start">체세포분열 — 2C 로 시작해 2C 로 끝난다</text><text class="ink2 sm" x="103.2" y="162" text-anchor="middle">G1</text><path d="M140.4 48 L140.4 144" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="177.6" y="162" text-anchor="middle">S</text><path d="M214.8 48 L214.8 144" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="259.44" y="162" text-anchor="middle">G2</text><path d="M304.08 48 L304.08 144" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="326.4" y="162" text-anchor="middle">M</text><path d="M348.72 48 L348.72 144" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="393.36" y="162" text-anchor="middle">딸세포</text><path class="gr" d="M66 289.57 H438"/><path class="gr" d="M66 269.15 H438"/><path class="gr" d="M66 228.3 H438"/><path class="ax" marker-end="url(#ark)" d="M66 310 H448"/><path class="ax" marker-end="url(#ark)" d="M66 310 V204"/><text class="sm ink2" x="60" y="293.57" text-anchor="end">1</text><text class="sm ink2" x="60" y="273.15" text-anchor="end">2</text><text class="sm ink2" x="60" y="232.3" text-anchor="end">4</text><text class="sm ink2" x="58" y="206" text-anchor="end">DNA 양 (C)</text><path class="cv s2" d="M66 269.15 L140.4 269.15 L214.8 228.3 L311.52 228.3 L311.52 269.15 L371.04 269.15 L371.04 289.57 L438 289.57"/><text class="ink bold" x="122" y="200" text-anchor="start">감수분열 — 복제는 한 번, 분열은 두 번이라 1C 로 끝난다</text><text class="ink2 sm" x="103.2" y="328" text-anchor="middle">G1</text><path d="M140.4 214 L140.4 310" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="177.6" y="328" text-anchor="middle">S</text><path d="M214.8 214 L214.8 310" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="244.56" y="328" text-anchor="middle">G2</text><path d="M274.32 214 L274.32 310" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="292.92" y="328" text-anchor="middle">감수 I</text><path d="M311.52 214 L311.52 310" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="341.28" y="328" text-anchor="middle">감수 II</text><path d="M371.04 214 L371.04 310" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="404.52" y="328" text-anchor="middle">배우자</text><text class="ink sm" x="460" y="74" text-anchor="start">S기에 DNA 양은 두 배가 되지만</text><text class="ink sm" x="460" y="92" text-anchor="start">염색체 수는 그대로다. 자매염색분체가</text><text class="ink sm" x="460" y="110" text-anchor="start">한 동원체에 붙어 있기 때문이다.</text><text class="ink sm" x="460" y="240" text-anchor="start">두 그래프의 앞부분은 완전히 같다.</text><text class="ink sm" x="460" y="258" text-anchor="start">갈라지는 곳은 두 번째 분열이 있느냐</text><text class="ink sm" x="460" y="276" text-anchor="start">뿐이고, 그 한 번이 2C 를 1C 로 만든다.</text>
</svg>