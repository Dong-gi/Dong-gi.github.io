<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 362" width="680" height="362" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">세포 주기의 네 시기</title><desc id="d">24시간 주기를 예로 든 G1, S, G2, M 의 상대적 길이와 G0</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path d="M170 162 L170 58 A104 104 0 0 1 196.92 262.46 Z" fill="var(--s1)" fill-opacity="0.2" stroke="var(--ink2)" stroke-width="1.2"/><path d="M170 162 L196.92 262.46 A104 104 0 0 1 69.54 135.08 Z" fill="var(--s2)" fill-opacity="0.26" stroke="var(--ink2)" stroke-width="1.2"/><path d="M170 162 L69.54 135.08 A104 104 0 0 1 143.08 61.54 Z" fill="var(--s1)" fill-opacity="0.34" stroke="var(--ink2)" stroke-width="1.2"/><path d="M170 162 L143.08 61.54 A104 104 0 0 1 170 58 Z" fill="var(--s3)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><circle cx="170" cy="162" r="104" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><text class="ink bold" x="238.05" y="151.04" text-anchor="middle">G1기</text><text class="ink2 sm" x="238.05" y="168.04" text-anchor="middle">11 h</text><text class="ink bold" x="121.46" y="208.54" text-anchor="middle">S기</text><text class="ink2 sm" x="121.46" y="225.54" text-anchor="middle">8 h</text><text class="ink bold" x="121.46" y="111.46" text-anchor="middle">G2기</text><text class="ink2 sm" x="121.46" y="128.46" text-anchor="middle">4 h</text><path d="M167 62 L148.51 35.15" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="150.51" y="29.15" text-anchor="end">M기 (분열기) 1 h</text><text class="ink sm" x="300" y="232" text-anchor="start">간기 = G1 + S + G2. 현미경으로 보면</text><text class="ink sm" x="300" y="250" text-anchor="start">아무 일도 없어 보이는 구간이다.</text><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M227.23 253.59 L196 292"/><rect x="60" y="296" width="176" height="50" rx="5" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="148" y="316" text-anchor="middle">G0 — 주기에서 빠져나옴</text><text class="ink2 sm" x="148" y="334" text-anchor="middle">분열하지 않고 제 일만 한다</text><text class="ink bold" x="300" y="44" text-anchor="start">한 바퀴가 세포 하나의 일생이다</text><text class="ink bold sm" x="300" y="72" text-anchor="start">G1기</text><text class="ink2 sm" x="346" y="72" text-anchor="start">자라고 소기관을 늘린다. 여기서</text><text class="ink bold sm" x="300" y="92" text-anchor="start"></text><text class="ink2 sm" x="346" y="92" text-anchor="start">주기를 계속 돌지 결정한다</text><text class="ink bold sm" x="300" y="112" text-anchor="start">S기</text><text class="ink2 sm" x="346" y="112" text-anchor="start">DNA 를 통째로 한 번 복제한다.</text><text class="ink bold sm" x="300" y="132" text-anchor="start"></text><text class="ink2 sm" x="346" y="132" text-anchor="start">염색체 수는 그대로다</text><text class="ink bold sm" x="300" y="152" text-anchor="start">G2기</text><text class="ink2 sm" x="346" y="152" text-anchor="start">복제가 제대로 됐는지 점검하고</text><text class="ink bold sm" x="300" y="172" text-anchor="start"></text><text class="ink2 sm" x="346" y="172" text-anchor="start">분열 장치를 준비한다</text><text class="ink bold sm" x="300" y="192" text-anchor="start">M기</text><text class="ink2 sm" x="346" y="192" text-anchor="start">핵과 세포질을 둘로 나눈다.</text><text class="ink bold sm" x="300" y="212" text-anchor="start"></text><text class="ink2 sm" x="346" y="212" text-anchor="start">가장 짧지만 눈에 보이는 시기다</text><text class="ink2 sm" x="300" y="278" text-anchor="start">적어 둔 시간은 24시간 만에 한 바퀴를</text><text class="ink2 sm" x="300" y="296" text-anchor="start">도는 배양 세포의 예다. 세포 종류마다</text><text class="ink2 sm" x="300" y="314" text-anchor="start">크게 다르고 특히 G1 이 많이 변한다.</text><text class="ink2 sm" x="300" y="338" text-anchor="start">신경세포처럼 G0 에서 평생 머무는 세포도 있다</text>
</svg>