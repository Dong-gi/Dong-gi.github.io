<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">원핵세포와 진핵세포</title><desc id="d">두 세포 유형의 구조 비교</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">원핵세포와 진핵세포 — 막으로 싼 방이 있는가</text><text class="ink bold sm" x="30" y="62" text-anchor="start">원핵세포 (세균·고세균)</text><rect x="30" y="120" width="190" height="96" rx="46" fill="var(--s1)" fill-opacity="0.08" stroke="var(--s1)" stroke-width="2"/><rect x="36" y="126" width="178" height="84" rx="40" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1" stroke-dasharray="4 3"/><path d="M92 152 C110 138, 140 142, 152 158 C164 174, 140 186, 118 180 C98 175, 84 166, 92 152 Z" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="122" y="168" text-anchor="middle">핵양체</text><circle cx="58" cy="140" r="3.4" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="70" cy="196" r="3.4" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="186" cy="142" r="3.4" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="176" cy="192" r="3.4" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="58" cy="176" r="3.4" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="196" cy="168" r="3.4" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M220 168 L244 168 L252 160 L244 152 L252 144" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="30" y="240" text-anchor="start">· 크기 0.5-5 μm</text><text class="ink2 sm" x="30" y="258" text-anchor="start">· 핵막이 없다. DNA 가 세포질에 그냥 있다</text><text class="ink2 sm" x="30" y="276" text-anchor="start">· 막으로 싼 소기관이 없다</text><text class="ink2 sm" x="30" y="294" text-anchor="start">· 리보솜은 있다 (작은 점)</text><text class="ink2 sm" x="30" y="312" text-anchor="start">· 대개 세포벽이 있고 편모를 갖기도 한다</text><text class="ink bold sm" x="370" y="62" text-anchor="start">진핵세포 (동물·식물·균류·원생생물)</text><ellipse cx="480" cy="160" rx="108" ry="78" fill="var(--s3)" fill-opacity="0.08" stroke="var(--s3)" stroke-width="2"/><circle cx="462" cy="148" r="34" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.6"/><circle cx="462" cy="148" r="30" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1" stroke-dasharray="3 3"/><circle cx="468" cy="142" r="8" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="0"/><text class="ink sm" x="462" y="152" text-anchor="middle">핵</text><ellipse cx="548" cy="190" rx="22" ry="11" fill="var(--s1)" fill-opacity="0.25" stroke="var(--s1)" stroke-width="1.3" transform="rotate(-20 548 190)"/><ellipse cx="420" cy="208" rx="20" ry="10" fill="var(--s1)" fill-opacity="0.25" stroke="var(--s1)" stroke-width="1.3" transform="rotate(15 420 208)"/><path d="M500 106 L530 116 L498 126 L532 136" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="506" cy="108" r="2.6" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="520" cy="120" r="2.6" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="508" cy="128" r="2.6" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="524" cy="136" r="2.6" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="576" y="104" text-anchor="end">소포체</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M578 108 L540 120"/><text class="ink2 sm" x="676" y="176" text-anchor="end">미토콘드리아</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M602 180 L570 188"/><text class="ink2 sm" x="370" y="240" text-anchor="start">· 크기 10-100 μm (부피로는 1000배 이상)</text><text class="ink2 sm" x="370" y="258" text-anchor="start">· 핵막이 DNA 를 따로 싸고 있다</text><text class="ink2 sm" x="370" y="276" text-anchor="start">· 막으로 싼 소기관이 여럿 있다</text><text class="ink2 sm" x="370" y="294" text-anchor="start">· 리보솜이 더 크다 (80S)</text><text class="ink2 sm" x="370" y="312" text-anchor="start">· 세포벽은 식물·균류만 갖는다</text><path d="M340 74 L340 322" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>