<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">분자시계는 직선의 기울기를 정하는 일이다</title><desc id="d">서열 차이 d 가 시간에 비례한다고 보고, 연대를 아는 보정점 하나로 기울기 2μ 를 정한다. 계통마다 속도가 달라 실제 값은 띠처럼 퍼진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path class="gr" d="M70 240 V44"/><path class="gr" d="M188.67 240 V44"/><path class="gr" d="M307.33 240 V44"/><path class="gr" d="M426 240 V44"/><path class="gr" d="M70 240 H426"/><path class="gr" d="M70 185.56 H426"/><path class="gr" d="M70 131.11 H426"/><path class="gr" d="M70 76.67 H426"/><path class="ax" marker-end="url(#ark)" d="M70 240 H436"/><path class="ax" marker-end="url(#ark)" d="M70 240 V34"/><text class="sm ink2" x="188.67" y="255" text-anchor="middle">20</text><text class="sm ink2" x="307.33" y="255" text-anchor="middle">40</text><text class="sm ink2" x="426" y="255" text-anchor="middle">60</text><text class="sm ink2" x="64" y="189.56" text-anchor="end">0.05</text><text class="sm ink2" x="64" y="135.11" text-anchor="end">0.1</text><text class="sm ink2" x="64" y="80.67" text-anchor="end">0.15</text><text class="sm ink2" x="440" y="244">시간 (백만 년)</text><text class="sm ink2" x="70" y="26" text-anchor="middle">자리당 치환 수 d</text><path d="M70 240 L426 57.07 L426 161.6 Z" fill="var(--s2)" fill-opacity="0.12" stroke="none" stroke-width="1"/><path class="cv s2" stroke-dasharray="5 4" d="M70 240 L426 57.07"/><path class="cv s2" stroke-dasharray="5 4" d="M70 240 L426 161.6"/><path class="cv s1" d="M70 240 L426 109.33"/><circle class="f3" cx="307.33" cy="152.89" r="5"/><path class="gr" stroke-dasharray="4 3" d="M307.33 240 L307.33 152.89"/><text class="ink sm" x="297.33" y="144.89" text-anchor="end">연대를 아는 보정점</text><text class="ink bold sm" x="402.27" y="134.04" text-anchor="end">기울기 = 2μ</text><text class="ink2 sm" x="438" y="92" text-anchor="start">가운데 실선이</text><text class="ink2 sm" x="438" y="110" text-anchor="start">일정한 속도를 가정한</text><text class="ink2 sm" x="438" y="128" text-anchor="start">이상적인 시계다.</text><text class="ink2 sm" x="438" y="156" text-anchor="start">계통마다 속도가 달라</text><text class="ink2 sm" x="438" y="174" text-anchor="start">실제 값은 옅은 띠만큼</text><text class="ink2 sm" x="438" y="192" text-anchor="start">퍼진다.</text><text class="ink2 sm" x="70" y="270" text-anchor="start">d = 2μt — 두 계통이 갈라진 뒤 각자 쌓으므로 시간에 2 가 곱해진다</text><text class="ink2 sm" x="70" y="288" text-anchor="start">보정점 하나로 기울기를 정하고, 그 기울기로 다른 분기의 연대를 거꾸로 읽는다</text>
</svg>