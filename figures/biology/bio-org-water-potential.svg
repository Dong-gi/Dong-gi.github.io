<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" width="680" height="322" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">수분퍼텐셜은 두 항의 합이다</title><desc id="d">세포의 용질퍼텐셜이 용액보다 낮아도 팽압이 그만큼을 상쇄하면 물은 움직이지 않는다. 비교해야 할 것은 합인 수분퍼텐셜이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="24" y="46" width="316" height="226" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="356" y="46" width="300" height="226" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><path d="M32 170 L332 170" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M364 170 L648 170" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="30" y="166" text-anchor="start">0</text><text class="ink2 sm" x="362" y="166" text-anchor="start">0</text><text class="ink bold sm" x="182" y="66" text-anchor="middle">세포를 Ψ = −0.50 MPa 인 용액에 넣었다</text><text class="ink bold sm" x="506" y="66" text-anchor="middle">같은 세포를 순수한 물에 넣었다</text><rect x="60" y="170" width="24" height="31" rx="2" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.5"/><text class="ink2 sm" x="72" y="215" text-anchor="middle">-0.50</text><path d="M90 170 L114 170" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="102" y="162" text-anchor="middle">0</text><rect x="120" y="170" width="24" height="31" rx="2" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.5"/><text class="ink2 sm" x="132" y="215" text-anchor="middle">-0.50</text><text class="ink sm" x="102" y="250" text-anchor="middle">0.20 mol/L 자당 용액</text><text class="ink2 sm" x="102" y="265" text-anchor="middle">(열린 비커라 압력이 없다)</text><rect x="196" y="170" width="24" height="49.6" rx="2" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.5"/><text class="ink2 sm" x="208" y="233.6" text-anchor="middle">-0.80</text><rect x="226" y="151.4" width="24" height="18.6" rx="2" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.5"/><text class="ink2 sm" x="238" y="144.4" text-anchor="middle">+0.30</text><rect x="256" y="170" width="24" height="31" rx="2" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.5"/><text class="ink2 sm" x="268" y="215" text-anchor="middle">-0.50</text><text class="ink sm" x="238" y="250" text-anchor="middle">세포</text><text class="ink2 sm" x="238" y="265" text-anchor="middle">(세포벽이 팽압을 만든다)</text><path d="M392 170 L416 170" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="404" y="162" text-anchor="middle">0</text><path d="M422 170 L446 170" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="434" y="162" text-anchor="middle">0</text><path d="M452 170 L476 170" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="464" y="162" text-anchor="middle">0</text><text class="ink sm" x="434" y="250" text-anchor="middle">순수한 물</text><text class="ink2 sm" x="434" y="265" text-anchor="middle"></text><rect x="528" y="170" width="24" height="49.6" rx="2" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.5"/><text class="ink2 sm" x="540" y="233.6" text-anchor="middle">-0.80</text><rect x="558" y="151.4" width="24" height="18.6" rx="2" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.5"/><text class="ink2 sm" x="570" y="144.4" text-anchor="middle">+0.30</text><rect x="588" y="170" width="24" height="31" rx="2" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.5"/><text class="ink2 sm" x="600" y="215" text-anchor="middle">-0.50</text><text class="ink sm" x="570" y="250" text-anchor="middle">같은 세포</text><text class="ink2 sm" x="570" y="265" text-anchor="middle"></text><text class="ink2 sm" x="182" y="92" text-anchor="middle">두 Ψ 가 같다 → 물의 순 이동이 없다</text><path fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar3)" d="M478 120 L524 120"/><text class="ink2 sm" x="501" y="108" text-anchor="middle">물이 세포로</text><text class="ink2 sm" x="30" y="26" text-anchor="start">물은 Ψ 가 높은 쪽에서 낮은 쪽으로 간다. 비교할 것은 Ψs 하나가 아니라 합인 Ψ 다</text><rect x="34" y="302" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="54" y="308">Ψs 용질퍼텐셜 (0 이하)</text><rect x="216" y="302" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="236" y="308">Ψp 압력퍼텐셜</text><rect x="360" y="302" width="14" height="3" rx="1.5" class="f3"/><text class="sm ink2" x="380" y="308">Ψ = Ψs + Ψp — 이동 방향을 정하는 값</text>
</svg>