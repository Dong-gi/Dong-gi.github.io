>내놓는다. 그래서 저장고 노릇을 한다.</text><rect x="74" y="320" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="94" y="326">성인 헤모글로빈</text><rect x="220" y="320" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="240" y="326">오른쪽으로 옮겨간 상태</text><rect x="430" y="320" width="14" height="3" rx="1.5" class="f3"/><text class="sm ink2" x="450" y="326">마이오글로빈</text><text class="ink2 sm" x="30" y="20" text-anchor="start">S 자 곡선의 가파른 구간이 조직의 분압 범위에 놓여 있다. 그래서 작은 변화가 큰 방출을 만든다</text>
</svg>