<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 456" width="660" height="456" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">메셀슨-스탈 실험이 예측하는 띠</title><desc id="d">세 복제 가설이 세대마다 서로 다른 띠 무늬를 예측한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="330" y="26" text-anchor="middle">세 가설은 서로 다른 띠를 예측한다 — 그래서 한 번의 실험으로 갈린다</text><text class="ink2 sm" x="330" y="46" text-anchor="middle">무거운 질소로 키운 세균을 가벼운 배지로 옮긴 뒤 DNA 를 밀도에 따라 가라앉힌다</text><text class="ink bold" x="210" y="78" text-anchor="middle">0세대</text><text class="ink bold" x="340" y="78" text-anchor="middle">1세대</text><text class="ink bold" x="470" y="78" text-anchor="middle">2세대</text><text class="ink bold" x="30" y="132" text-anchor="start">반보존적</text><text class="ink2 sm" x="30" y="152" text-anchor="start">관찰과 일치</text><rect x="186" y="98" width="48" height="92" rx="6" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--ink2)" stroke-width="1.2"/><rect x="189" y="167.6" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><rect x="316" y="98" width="48" height="92" rx="6" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--ink2)" stroke-width="1.2"/><rect x="319" y="141.84" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><rect x="446" y="98" width="48" height="92" rx="6" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--ink2)" stroke-width="1.2"/><rect x="449" y="141.84" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="0"/><rect x="449" y="114.24" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="0"/><path d="M26 196 L634 196" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="30" y="244" text-anchor="start">보존적</text><text class="ink2 sm" x="30" y="264" text-anchor="start">1세대에서 탈락</text><rect x="186" y="210" width="48" height="92" rx="6" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--ink2)" stroke-width="1.2"/><rect x="189" y="279.6" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><rect x="316" y="210" width="48" height="92" rx="6" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--ink2)" stroke-width="1.2"/><rect x="319" y="279.6" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="0"/><rect x="319" y="226.24" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="0"/><rect x="446" y="210" width="48" height="92" rx="6" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--ink2)" stroke-width="1.2"/><rect x="449" y="279.6" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.4" stroke="none" stroke-width="0"/><rect x="449" y="226.24" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.7" stroke="none" stroke-width="0"/><path d="M26 308 L634 308" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="30" y="356" text-anchor="start">분산적</text><text class="ink2 sm" x="30" y="376" text-anchor="start">2세대에서 탈락</text><rect x="186" y="322" width="48" height="92" rx="6" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--ink2)" stroke-width="1.2"/><rect x="189" y="391.6" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><rect x="316" y="322" width="48" height="92" rx="6" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--ink2)" stroke-width="1.2"/><rect x="319" y="365.84" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><rect x="446" y="322" width="48" height="92" rx="6" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--ink2)" stroke-width="1.2"/><rect x="449" y="351.12" width="42" height="8" rx="2" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><text class="ink2 sm" x="566" y="118" text-anchor="start">가벼움</text><text class="ink2 sm" x="566" y="184" text-anchor="start">무거움</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M554 126 L554 174"/><text class="ink2 sm" x="330" y="424" text-anchor="middle">1세대에서 띠가 하나이고 중간 밀도면 보존적 가설이 죽고, 2세대에서 띠가 둘로 갈라지면 분산적 가설이 죽는다</text><text class="ink2 sm" x="330" y="444" text-anchor="middle">남는 것은 반보존적 하나뿐이다. 좋은 실험이란 이렇게 여러 가설을 한꺼번에 갈라놓는 실험이다</text>
</svg>