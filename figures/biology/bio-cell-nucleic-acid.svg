<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">핵산의 구조</title><desc id="d">뉴클레오타이드의 세 부품과 두 가닥의 염기쌍</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">DNA — 뉴클레오타이드 세 부품, 두 가닥, 정해진 짝</text><rect x="24" y="52" width="210" height="252" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="129" y="72" text-anchor="middle">뉴클레오타이드 하나</text><circle cx="74" cy="130" r="20" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="74" y="135" text-anchor="middle">인산</text><path d="M104 178 L144 158 L176 186 L156 222 L112 216 Z" fill="var(--s3)" fill-opacity="0.24" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="140" y="196" text-anchor="middle">5탄당</text><rect x="178" y="118" width="46" height="34" rx="6" fill="var(--s1)" fill-opacity="0.24" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="201" y="139" text-anchor="middle">염기</text><path d="M88 146 L112 172" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M152 162 L180 144" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="130" y="254" text-anchor="middle">DNA 는 데옥시리보스 + A T G C</text><text class="ink2 sm" x="130" y="272" text-anchor="middle">RNA 는 리보스 + A U G C</text><rect x="252" y="52" width="404" height="252" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="454" y="72" text-anchor="middle">두 가닥이 짝을 이룬다</text><path d="M320 92 L320 264" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 92 L520 264" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="326" y="98" width="44" height="24" rx="4" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.1"/><text class="ink sm" x="348" y="115" text-anchor="middle">A</text><rect x="470" y="98" width="44" height="24" rx="4" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.1"/><text class="ink sm" x="492" y="115" text-anchor="middle">T</text><path d="M374 106 L466 106" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M374 114 L466 114" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="326" y="132" width="44" height="24" rx="4" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.1"/><text class="ink sm" x="348" y="149" text-anchor="middle">G</text><rect x="470" y="132" width="44" height="24" rx="4" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.1"/><text class="ink sm" x="492" y="149" text-anchor="middle">C</text><path d="M374 136 L466 136" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M374 144 L466 144" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M374 152 L466 152" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="326" y="166" width="44" height="24" rx="4" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.1"/><text class="ink sm" x="348" y="183" text-anchor="middle">T</text><rect x="470" y="166" width="44" height="24" rx="4" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.1"/><text class="ink sm" x="492" y="183" text-anchor="middle">A</text><path d="M374 174 L466 174" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M374 182 L466 182" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="326" y="200" width="44" height="24" rx="4" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.1"/><text class="ink sm" x="348" y="217" text-anchor="middle">C</text><rect x="470" y="200" width="44" height="24" rx="4" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.1"/><text class="ink sm" x="492" y="217" text-anchor="middle">G</text><path d="M374 204 L466 204" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M374 212 L466 212" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M374 220 L466 220" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="326" y="234" width="44" height="24" rx="4" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.1"/><text class="ink sm" x="348" y="251" text-anchor="middle">A</text><rect x="470" y="234" width="44" height="24" rx="4" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.1"/><text class="ink sm" x="492" y="251" text-anchor="middle">T</text><path d="M374 242 L466 242" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M374 250 L466 250" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink sm" x="320" y="90" text-anchor="middle">5'</text><text class="ink sm" x="520" y="90" text-anchor="middle">3'</text><text class="ink sm" x="320" y="282" text-anchor="middle">3'</text><text class="ink sm" x="520" y="282" text-anchor="middle">5'</text><text class="ink2 sm" x="646" y="148" text-anchor="end">두 가닥의</text><text class="ink2 sm" x="646" y="166" text-anchor="end">방향이 반대다</text><text class="ink2 sm" x="646" y="184" text-anchor="end">(역평행)</text><text class="ink2 sm" x="20" y="314" text-anchor="start">가운데 점선이 수소 결합이다. A 와 T 사이에는 2개, G 와 C 사이에는 3개가 생긴다. 그래서 G-C 가 많을수록 잘 안 떨어진다.</text><text class="ink2 sm" x="20" y="336" text-anchor="start">A 는 T 하고만, G 는 C 하고만 짝을 짓는다. 한 가닥만 알면 나머지 한 가닥이 저절로 정해진다는 것이 복제의 원리다.</text>
</svg>