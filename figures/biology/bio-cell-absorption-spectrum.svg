67 191.16 L418 200.74 L421.33 210.33 L424.67 219.3 L428 227.2 L431.33 233.81 L434.67 239.05 L438 243.02 L441.33 245.89 L444.67 247.88 L448 249.2 L451.33 250.04 L454.67 250.55 L458 250.85 L461.33 251.02 L464.67 251.11 L468 251.16 L471.33 251.18 L474.67 251.19 L478 251.2"/><rect x="500" y="76" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="520" y="82">엽록소 a 흡수</text><rect x="500" y="94" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="520" y="100">엽록소 b 흡수</text><rect x="500" y="112" width="14" height="3" rx="1.5" class="f3"/><text class="sm ink2" x="520" y="118">작용 스펙트럼</text><text class="ink sm" x="291.33" y="156.8" text-anchor="middle">초록은 거의 흡수하지 않는다</text><text class="ink2 sm" x="500" y="150" text-anchor="start">두 곡선이 대체로 겹치는 것이</text><text class="ink2 sm" x="500" y="168" text-anchor="start">엽록소가 주 색소라는 증거다.</text><text class="ink2 sm" x="500" y="196" text-anchor="start">500 nm 근처에서 작용 곡선만</text><text class="ink2 sm" x="500" y="214" text-anchor="start">솟아 있다. 엽록소가 아닌 다른</text><text class="ink2 sm" x="500" y="232" text-anchor="start">색소가 빛을 넘겨주고 있다는 뜻.</text><text class="ink2 sm" x="20" y="302" text-anchor="start">흡수 스펙트럼은 ‘색소가 어느 파장을 삼키는가’이고, 작용 스펙트럼은 ‘어느 파장을 주었을 때 광합성이 잘 되는가’다.</text><text class="ink2 sm" x="20" y="324" text-anchor="start">식물이 초록으로 보이는 이유는 초록을 반사하기 때문이고, 그것은 곧 초록을 가장 적게 쓰고 있다는 뜻이기도 하다.</text>
