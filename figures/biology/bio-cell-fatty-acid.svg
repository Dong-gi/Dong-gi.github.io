<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">포화와 불포화 지방산</title><desc id="d">곧은 사슬과 꺾인 사슬의 쌓임 차이</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">탄소 수가 같아도 꺾이면 녹는점이 내려간다</text><rect x="24" y="52" width="300" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="174" y="72" text-anchor="middle">포화 — 곧게 뻗는다</text><text class="ink2 sm" x="174" y="89" text-anchor="middle">이중 결합이 없다</text><path d="M70 116 L80 130 L70 144 L80 158 L70 172 L80 186 L70 200 L80 214 L70 228" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="74" cy="106" r="7" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path d="M104 116 L114 130 L104 144 L114 158 L104 172 L114 186 L104 200 L114 214 L104 228" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="108" cy="106" r="7" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path d="M138 116 L148 130 L138 144 L148 158 L138 172 L148 186 L138 200 L148 214 L138 228" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="142" cy="106" r="7" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="190" y="132" text-anchor="start">나란히 붙는 면이 넓다</text><text class="ink2 sm" x="190" y="150" text-anchor="start">→ 서로 당기는 힘의 합이 크다</text><text class="ink2 sm" x="190" y="168" text-anchor="start">→ 떼어 놓기 어렵다</text><text class="ink bold sm" x="190" y="196" text-anchor="start">녹는점이 높다</text><text class="ink2 sm" x="190" y="214" text-anchor="start">상온에서 고체</text><rect x="348" y="52" width="306" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="501" y="72" text-anchor="middle">cis 불포화 — 꺾인다</text><text class="ink2 sm" x="501" y="89" text-anchor="middle">이중 결합 자리에서 약 30° 굽는다</text><path d="M392 116 L402 130 L392 144 L402 158 L392 172 L404 186 L412 196 L420 186 L428 196 L436 186" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="396" cy="106" r="7" fill="var(--s2)" fill-opacity="0.32" stroke="var(--s2)" stroke-width="1.2"/><circle cx="397" cy="180" r="3.4" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M438 116 L448 130 L438 144 L448 158 L438 172 L450 186 L458 196 L466 186 L474 196 L482 186" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="442" cy="106" r="7" fill="var(--s2)" fill-opacity="0.32" stroke="var(--s2)" stroke-width="1.2"/><circle cx="443" cy="180" r="3.4" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M484 116 L494 130 L484 144 L494 158 L484 172 L496 186 L504 196 L512 186 L520 196 L528 186" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="488" cy="106" r="7" fill="var(--s2)" fill-opacity="0.32" stroke="var(--s2)" stroke-width="1.2"/><circle cx="489" cy="180" r="3.4" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="560" y="132" text-anchor="start">꺾여서 밀착하지 못한다</text><text class="ink2 sm" x="560" y="150" text-anchor="start">→ 닿는 면이 좁다</text><text class="ink2 sm" x="560" y="168" text-anchor="start">→ 쉽게 흐트러진다</text><text class="ink bold sm" x="560" y="196" text-anchor="start">녹는점이 낮다</text><text class="ink2 sm" x="560" y="214" text-anchor="start">상온에서 액체</text><text class="ink2 sm" x="24" y="278" text-anchor="start">검은 점이 cis 이중 결합 자리다. 탄소 수는 양쪽 모두 18개로 같고 다른 것은 이중 결합 하나뿐이다.</text><text class="ink2 sm" x="24" y="300" text-anchor="start">같은 원리가 세포막에도 적용된다. 추운 곳에 사는 생물은 막 지질의 불포화 비율을 올려 막이 굳는 것을 막는다.</text>
</svg>