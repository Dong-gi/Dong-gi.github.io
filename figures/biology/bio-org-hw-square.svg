<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">하디-바인베르크 식은 정사각형의 넓이다</title><desc id="d">한 변이 1 인 정사각형을 p 와 q 로 가로세로 자르면 네 칸의 넓이가 p², pq, pq, q² 가 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path d="M120 60 L253 60 L253 193 L120 193 Z" fill="var(--s1)" fill-opacity="0.22" stroke="none" stroke-width="1"/><path d="M253 60 L310 60 L310 193 L253 193 Z" fill="var(--s3)" fill-opacity="0.22" stroke="none" stroke-width="1"/><path d="M120 193 L253 193 L253 250 L120 250 Z" fill="var(--s3)" fill-opacity="0.22" stroke="none" stroke-width="1"/><path d="M253 193 L310 193 L310 250 L253 250 Z" fill="var(--s2)" fill-opacity="0.22" stroke="none" stroke-width="1"/><rect x="120" y="60" width="190" height="190" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><path d="M253 60 L253 250" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 193 L310 193" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="186.5" y="131.5" text-anchor="middle">p²</text><text class="ink" x="281.5" y="131.5" text-anchor="middle">pq</text><text class="ink" x="186.5" y="226.5" text-anchor="middle">pq</text><text class="ink bold sm" x="281.5" y="225.5" text-anchor="middle">q²</text><text class="ink2 sm" x="186.5" y="34" text-anchor="middle">A 정자 (p)</text><text class="ink2 sm" x="281.5" y="34" text-anchor="middle">a (q)</text><text class="ink2 sm" x="215" y="16" text-anchor="middle">아버지 쪽 배우자 주머니</text><text class="ink2 sm" x="110" y="130.5" text-anchor="end">A 난자 (p)</text><text class="ink2 sm" x="110" y="225.5" text-anchor="end">a (q)</text><text class="ink2 sm" x="328" y="82" text-anchor="start">한 변이 1 인 정사각형을</text><text class="ink2 sm" x="328" y="100" text-anchor="start">p 와 q 로 자른 것뿐이다.</text><text class="ink sm" x="328" y="126" text-anchor="start">넓이의 합 = 1 이므로</text><text class="ink bold" x="328" y="146" text-anchor="start">p² + 2pq + q² = 1</text><text class="ink2 sm" x="328" y="176" text-anchor="start">가운데 두 칸이 같은</text><text class="ink2 sm" x="328" y="194" text-anchor="start">이형접합자라 2pq 가 된다.</text><text class="ink2 sm" x="30" y="284" text-anchor="start">그림은 p = 0.7, q = 0.3 인 경우. 칸의 넓이가 곧 그 유전자형의 비율이다</text>
</svg>