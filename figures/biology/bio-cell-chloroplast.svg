<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 380" width="690" height="380" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">엽록체의 구조</title><desc id="d">외막·내막·틸라코이드와 스트로마·루멘의 배치</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">엽록체 — 막이 세 겹이고 방이 두 개다</text><ellipse cx="250" cy="176" rx="210" ry="108" fill="var(--s3)" fill-opacity="0.07" stroke="var(--s3)" stroke-width="2.2"/><ellipse cx="250" cy="176" rx="196" ry="96" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.6"/><ellipse cx="150" cy="148" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="150" cy="163" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="150" cy="178" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="150" cy="193" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="150" cy="208" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="250" cy="148" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="250" cy="163" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="250" cy="178" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="250" cy="193" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="250" cy="208" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="350" cy="148" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="350" cy="163" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="350" cy="178" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="350" cy="193" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><ellipse cx="350" cy="208" rx="34" ry="6" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><path d="M184 158 L216 200" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M284 200 L316 158" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="478" y="92" text-anchor="end">외막</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M482 96 L424 132"/><text class="ink2 sm" x="478" y="118" text-anchor="end">내막</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M482 122 L414 148"/><text class="ink2 sm" x="430" y="316" text-anchor="end">틸라코이드 — 이 막에 명반응 장치가 박혀 있다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M342 308 L296 224"/><text class="ink2 sm" x="66" y="256" text-anchor="start">스트로마 — 여기서 캘빈 회로가 돈다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M150 246 L190 224"/><text class="ink2 sm" x="72" y="106" text-anchor="start">그라나 (틸라코이드 무더기)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M120 112 L142 140"/><rect x="492" y="132" width="182" height="128" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="583" y="152" text-anchor="middle">두 방</text><text class="ink2 sm" x="504" y="174" text-anchor="start">루멘 — 틸라코이드 안쪽</text><text class="ink2 sm" x="504" y="192" text-anchor="start">양성자가 쌓이는 곳</text><text class="ink2 sm" x="504" y="220" text-anchor="start">스트로마 — 틸라코이드 바깥</text><text class="ink2 sm" x="504" y="238" text-anchor="start">ATP 와 NADPH 가 나오는 곳</text><text class="ink2 sm" x="20" y="344" text-anchor="start">미토콘드리아와 견주면 이렇다. 미토콘드리아는 막간 공간에 양성자를 쌓고, 엽록체는 틸라코이드 루멘에 쌓는다.</text><text class="ink2 sm" x="20" y="366" text-anchor="start">둘 다 ‘막을 사이에 둔 양성자 차이로 ATP 를 만든다’는 같은 장치를 쓴다. 방의 이름만 다르다.</text>
</svg>