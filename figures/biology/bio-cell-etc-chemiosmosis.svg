<text class="ink bold" x="20" y="30" text-anchor="start">화학삼투 — 전자의 에너지를 일단 ‘양성자 댐’에 저장한다</text><text class="ink bold sm" x="20" y="62" text-anchor="start">막간 공간 — 양성자가 쌓인다 (산성 쪽)</text><text class="ink2 sm" x="56" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="98" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="140" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="182" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="224" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="266" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="308" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="350" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="392" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="434" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="476" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="518" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="560" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="602" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="644" y="88" text-anchor="middle">H⁺</text><text class="ink2 sm" x="686" y="88" text-anchor="middle">H⁺</text><rect x="36" y="200" width="664" height="50" rx="3" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.4"/><rect x="60" y="184" width="76" height="82" rx="8" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="98" y="230" text-anchor="middle">I</text><rect x="176" y="184" width="62" height="82" rx="8" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="207" y="230" text-anchor="middle">II</text><rect x="300" y="184" width="76" height="82" rx="8" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="338" y="230" text-anchor="middle">III</text><rect x="434" y="184" width="76" height="82" rx="8" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="472" y="230" text-anchor="middle">IV</text><rect x="578" y="184" width="52" height="82" rx="8" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.5"/><path d="M604 266 L604 280" fill="none" stroke="var(--s3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="604" cy="308" r="30" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text class="ink sm" x="604" y="304" text-anchor="middle">ATP</text><text class="ink sm" x="604" y="320" text-anchor="middle">합성효소</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M98 274 L98 106"/><text class="ink sm" x="108" y="148" text-anchor="start">4 H⁺</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M338 274 L338 106"/><text class="ink sm" x="348" y="148" text-anchor="start">4 H⁺</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M472 274 L472 106"/><text class="ink sm" x="482" y="148" text-anchor="start">2 H⁺</text><path fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M604 106 L604 190"/><text class="ink sm" x="614" y="148" text-anchor="start">되돌아 내려온다</text><circle cx="268" cy="226" r="10" fill="var(--ink2)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="268" y="230" text-anchor="middle">Q</text><circle cx="406" cy="186" r="10" fill="var(--ink2)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="406" y="190" text-anchor="middle">c</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M140 226 L254 226"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M238 244 L262 234"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M282 226 L296 226"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M380 194 L394 188"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M418 188 L432 194"/><text class="ink2 sm" x="196" y="214" text-anchor="middle">전자</text><text class="ink2 sm" x="38" y="302" text-anchor="start">NADH → NAD⁺</text><text class="ink2 sm" x="160" y="302" text-anchor="start">석신산 → 푸마르산</text><text class="ink2 sm" x="400" y="302" text-anchor="start">½O₂ + 2H⁺ → H₂O</text><text class="ink2 sm" x="80" y="348" text-anchor="middle">H⁺</text><text class="ink2 sm" x="200" y="348" text-anchor="middle">H⁺</text><text class="ink2 sm" x="320" y="348" text-anchor="middle">H⁺</text><text class="ink2 sm" x="440" y="348" text-anchor="middle">H⁺</text><text class="ink sm" x="604" y="352" text-anchor="middle">ADP + Pi → ATP</text><text class="ink bold sm" x="20" y="378" text-anchor="start">기질 — 양성자가 적다 (염기성 쪽)</text><text class="ink2 sm" x="20" y="402" text-anchor="start">복합체 II 는 양성자를 퍼내지 않는다. 그래서 FADH₂ 로 들어온 전자는 ATP 를 덜 만든다.</text>
</svg>