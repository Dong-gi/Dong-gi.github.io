<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" width="720" height="414" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">화학삼투</title><desc id="d">미토콘드리아 내막의 복합체 배치와 양성자 흐름</desc>
<style>
