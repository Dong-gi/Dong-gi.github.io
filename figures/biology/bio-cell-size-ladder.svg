<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">크기의 사다리</title><desc id="d">원자에서 사람까지의 크기를 10배 눈금 위에 늘어놓은 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">생물학이 다루는 크기 — 눈금 한 칸이 10배다</text><path d="M79 186 L623 186" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 186 L95 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="95" y="210" text-anchor="middle">0.1 nm</text><path d="M146 186 L146 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="146" y="210" text-anchor="middle">1 nm</text><path d="M197 186 L197 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="197" y="210" text-anchor="middle">10 nm</text><path d="M248 186 L248 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="248" y="210" text-anchor="middle">100 nm</text><path d="M299 186 L299 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="299" y="210" text-anchor="middle">1 μm</text><path d="M350 186 L350 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="350" y="210" text-anchor="middle">10 μm</text><path d="M401 186 L401 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="401" y="210" text-anchor="middle">100 μm</text><path d="M452 186 L452 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="452" y="210" text-anchor="middle">1 mm</text><path d="M503 186 L503 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="503" y="210" text-anchor="middle">1 cm</text><path d="M554 186 L554 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="554" y="210" text-anchor="middle">10 cm</text><path d="M605 186 L605 194" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="605" y="210" text-anchor="middle">1 m</text><path d="M95 90 L95 181" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="95" cy="182" r="3.4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="95" y="82" text-anchor="middle">원자 하나 0.1 nm</text><path d="M161.3 126 L161.3 181" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="161.3" cy="182" r="3.4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="161.3" y="118" text-anchor="middle">DNA 이중나선 굵기 2 nm</text><path d="M227.6 90 L227.6 181" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="227.6" cy="182" r="3.4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="227.6" y="82" text-anchor="middle">리보솜 25 nm</text><path d="M283.7 126 L283.7 181" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="283.7" cy="182" r="3.4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="283.7" y="118" text-anchor="middle">세균 0.5 μm</text><path d="M355.1 90 L355.1 181" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="355.1" cy="182" r="3.4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="355.1" y="82" text-anchor="middle">사람 세포 20 μm</text><path d="M416.3 126 L416.3 181" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="416.3" cy="182" r="3.4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="416.3" y="118" text-anchor="middle">사람 난자 0.2 mm</text><path d="M565.73 90 L565.73 181" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="565.73" cy="182" r="3.4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="565.73" y="82" text-anchor="middle">사람 키 1.7 m</text><text class="ink2 sm" x="20" y="252" text-anchor="start">1 mm = 10⁻³ m</text><text class="ink2 sm" x="150" y="252" text-anchor="start">1 μm = 10⁻⁶ m = 0.001 mm</text><text class="ink2 sm" x="380" y="252" text-anchor="start">1 nm = 10⁻⁹ m = 0.001 μm</text><text class="ink2 sm" x="20" y="274" text-anchor="start">세포는 μm 자리, 세포 안의 분자는 nm 자리다. 두 자리 사이가 1000배 벌어져 있다.</text><text class="ink2 sm" x="664" y="30" text-anchor="end">왼쪽 끝과 오른쪽 끝은 100억 배 차이</text>
</svg>