<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 366" width="660" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">연관된 두 유전자좌의 검정교배 결과</title><desc id="d">부모형 조합이 기대보다 많고 재조합형이 적게 나온다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="330" y="26" text-anchor="middle">검정교배 AaBb × aabb 의 자손 1000 개체</text><text class="ink2 sm" x="330" y="46" text-anchor="middle">두 유전자좌가 독립이라면 네 갈래가 모두 250 이어야 한다</text><path d="M70 284 L520 284" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 284 L70 68" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 284 L520 284" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="64" y="288" text-anchor="end">0</text><path d="M70 231.5 L520 231.5" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="64" y="235.5" text-anchor="end">100</text><path d="M70 179 L520 179" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="64" y="183" text-anchor="end">200</text><path d="M70 126.5 L520 126.5" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="64" y="130.5" text-anchor="end">300</text><path d="M70 74 L520 74" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="64" y="78" text-anchor="end">400</text><rect x="85" y="105.5" width="74" height="178.5" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="122" y="97.5" text-anchor="middle">340</text><text class="ink bold" x="122" y="304" text-anchor="middle">A B</text><text class="ink2 sm" x="122" y="322" text-anchor="middle">부모형</text><rect x="185" y="200" width="74" height="84" rx="3" fill="var(--s2)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="222" y="192" text-anchor="middle">160</text><text class="ink bold" x="222" y="304" text-anchor="middle">A b</text><text class="ink2 sm" x="222" y="322" text-anchor="middle">재조합형</text><rect x="285" y="205.25" width="74" height="78.75" rx="3" fill="var(--s2)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="322" y="197.25" text-anchor="middle">150</text><text class="ink bold" x="322" y="304" text-anchor="middle">a B</text><text class="ink2 sm" x="322" y="322" text-anchor="middle">재조합형</text><rect x="385" y="100.25" width="74" height="183.75" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="422" y="92.25" text-anchor="middle">350</text><text class="ink bold" x="422" y="304" text-anchor="middle">a b</text><text class="ink2 sm" x="422" y="322" text-anchor="middle">부모형</text><path d="M70 152.75 L540 152.75" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text class="ink sm" x="546" y="146.75" text-anchor="start">독립이면</text><text class="ink sm" x="546" y="162.75" text-anchor="start">기대 250</text><text class="ink bold" x="546" y="200" text-anchor="start">재조합률</text><text class="ink2 sm" x="546" y="222" text-anchor="start">(160+150)/1000</text><text class="ink bold" x="546" y="244" text-anchor="start">= 0.31</text><text class="ink2 sm" x="546" y="266" text-anchor="start">→ 31 cM</text><text class="ink2 sm" x="330" y="334" text-anchor="middle">부모형이 많고 재조합형이 적다. 두 유전자좌가 같은 염색체에 있고 그 사이에서 교차가 가끔만 일어난다는 뜻이다</text><text class="ink2 sm" x="330" y="354" text-anchor="middle">어느 쪽이 부모형인지는 개수가 많은 쪽으로 판정한다. 미리 알고 있을 필요가 없다</text>
</svg>