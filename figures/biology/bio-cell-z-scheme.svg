<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 366" width="710" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">Z-도식</title><desc id="d">광계 II 와 광계 I 을 거치는 전자의 전위 변화</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">Z-도식 — 광자 두 번으로 전자를 물에서 NADP⁺ 까지 끌어올린다</text><text class="ink2 sm" x="20" y="50" text-anchor="start">세로축은 전자를 끌어당기는 세기(V)다. 위로 갈수록 약하게 당긴다 = 전자가 에너지를 더 많이 갖는다</text><path class="gr" d="M92 284 H488"/><path class="gr" d="M92 244 H488"/><path class="gr" d="M92 204 H488"/><path class="gr" d="M92 164 H488"/><path class="gr" d="M92 124 H488"/><path class="gr" d="M92 84 H488"/><path class="ax" marker-end="url(#ark)" d="M92 284 H498"/><path class="ax" marker-end="url(#ark)" d="M92 284 V66"/><text class="sm ink2" x="86" y="248" text-anchor="end">0.5</text><text class="sm ink2" x="86" y="208" text-anchor="end">0</text><text class="sm ink2" x="86" y="168" text-anchor="end">-0.5</text><text class="sm ink2" x="86" y="128" text-anchor="end">-1</text><text class="sm ink2" x="86" y="88" text-anchor="end">-1.5</text><path class="cv s1" d="M106.26 269.6 L133.18 269.6"/><circle class="f1" cx="119.72" cy="269.6" r="3.5"/><path class="cv s1" d="M157.74 276 L184.66 276"/><circle class="f1" cx="171.2" cy="276" r="3.5"/><path class="cv s1" d="M157.74 140 L184.66 140"/><circle class="f1" cx="171.2" cy="140" r="3.5"/><path class="cv s1" d="M209.22 204 L236.14 204"/><circle class="f1" cx="222.68" cy="204" r="3.5"/><path class="cv s1" d="M248.82 220 L275.74 220"/><circle class="f1" cx="262.28" cy="220" r="3.5"/><path class="cv s1" d="M288.42 233.6 L315.34 233.6"/><circle class="f1" cx="301.88" cy="233.6" r="3.5"/><path class="cv s1" d="M331.98 240 L358.9 240"/><circle class="f1" cx="345.44" cy="240" r="3.5"/><path class="cv s1" d="M331.98 100 L358.9 100"/><circle class="f1" cx="345.44" cy="100" r="3.5"/><path class="cv s1" d="M379.5 132 L406.42 132"/><circle class="f1" cx="392.96" cy="132" r="3.5"/><path class="cv s1" d="M430.98 178.4 L457.9 178.4"/><circle class="f1" cx="444.44" cy="178.4" r="3.5"/><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M133.18 269.6 L157.74 276"/><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M184.66 140 L209.22 204"/><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M236.14 204 L248.82 220"/><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M275.74 220 L288.42 233.6"/><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M315.34 233.6 L331.98 240"/><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M358.9 100 L379.5 132"/><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M406.42 132 L430.98 178.4"/><path class="s2" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M171.2 276 L171.2 140"/><path class="s2" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M345.44 240 L345.44 100"/><text class="ink sm" x="111.2" y="212" text-anchor="start">광자 흡수</text><text class="ink sm" x="285.44" y="172" text-anchor="start">광자 흡수</text><text class="ink sm" x="111.72" y="287.6" text-anchor="middle">물</text><text class="ink sm" x="175.2" y="294" text-anchor="start">P680 (광계 II)</text><text class="ink sm" x="167.2" y="130" text-anchor="middle">P680*</text><text class="ink sm" x="222.68" y="194" text-anchor="middle">PQ</text><text class="ink sm" x="262.28" y="238" text-anchor="middle">b6f</text><text class="ink sm" x="301.88" y="251.6" text-anchor="middle">PC</text><text class="ink sm" x="349.44" y="258" text-anchor="start">P700 (광계 I)</text><text class="ink sm" x="341.44" y="90" text-anchor="middle">P700*</text><text class="ink sm" x="392.96" y="122" text-anchor="middle">Fd</text><text class="ink sm" x="340.44" y="168.4" text-anchor="start">NADP⁺ → NADPH</text><text class="ink bold sm" x="528" y="106" text-anchor="start">읽는 법</text><text class="ink2 sm" x="528" y="126" text-anchor="start">주황 화살표는 빛이 준 힘이다.</text><text class="ink2 sm" x="528" y="144" text-anchor="start">위로 올라간다 = 에너지를 얻는다.</text><text class="ink2 sm" x="528" y="168" text-anchor="start">회색 화살표는 저절로 내려가는</text><text class="ink2 sm" x="528" y="186" text-anchor="start">구간이다. 이때 양성자를 루멘에</text><text class="ink2 sm" x="528" y="204" text-anchor="start">퍼내는 일이 뽑힌다.</text><text class="ink2 sm" x="528" y="228" text-anchor="start">광계가 둘인 이유가 여기 보인다.</text><text class="ink2 sm" x="528" y="246" text-anchor="start">+0.82 에서 −0.32 까지 한 번에</text><text class="ink2 sm" x="528" y="264" text-anchor="start">올리기에는 광자 하나가 모자란다.</text><text class="ink2 sm" x="20" y="330" text-anchor="start">전체 모양이 알파벳 Z 를 옆으로 눕힌 것과 닮아 Z-도식이라 부른다. 올라갔다 내려오고, 다시 올라갔다 내려온다.</text><text class="ink2 sm" x="20" y="352" text-anchor="start">물에서 뽑은 전자가 두 번의 광자 흡수로 NADP⁺ 까지 올라가는 것이 비순환적 흐름이고, 이때 산소가 나온다.</text>
</svg>