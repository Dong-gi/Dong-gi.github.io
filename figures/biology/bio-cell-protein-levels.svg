<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">단백질의 네 수준 구조</title><desc id="d">1차에서 4차까지의 단백질 구조</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">단백질 구조의 네 수준 — 같은 사슬을 점점 크게 본 것이다</text><rect x="24" y="54" width="148" height="196" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="98" y="74" text-anchor="middle">1차 — 서열</text><text class="ink2 sm" x="98" y="91" text-anchor="middle">아미노산의 차례</text><rect x="190" y="54" width="148" height="196" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="264" y="74" text-anchor="middle">2차 — 국소 모양</text><text class="ink2 sm" x="264" y="91" text-anchor="middle">나선과 병풍</text><rect x="356" y="54" width="148" height="196" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="430" y="74" text-anchor="middle">3차 — 사슬 하나의 접힘</text><text class="ink2 sm" x="430" y="91" text-anchor="middle">전체 3차원 모양</text><rect x="522" y="54" width="148" height="196" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="596" y="74" text-anchor="middle">4차 — 사슬 여럿의 조립</text><text class="ink2 sm" x="596" y="91" text-anchor="middle">완성된 복합체</text><circle cx="44" cy="150" r="8" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><path d="M44 150 L64 160" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="64" cy="160" r="8" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><path d="M64 160 L84 150" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="84" cy="150" r="8" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><path d="M84 150 L104 160" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="104" cy="160" r="8" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><path d="M104 160 L124 150" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="124" cy="150" r="8" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><path d="M124 150 L144 160" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="144" cy="160" r="8" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="98" y="200" text-anchor="middle">펩타이드 결합으로</text><text class="ink2 sm" x="98" y="218" text-anchor="middle">한 줄로 이어진다</text><path d="M212 120 C224 104 244 104 256 120 C268 136 288 136 300 120" fill="none" stroke="var(--s2)" stroke-width="2.4"/><path d="M212 138 C224 122 244 122 256 138 C268 154 288 154 300 138" fill="none" stroke="var(--s2)" stroke-width="2.4"/><text class="ink sm" x="264" y="172" text-anchor="middle">α-나선</text><path fill="none" stroke="var(--s3)" stroke-width="4" stroke-linecap="round" marker-end="url(#ar3)" d="M212 200 L300 200"/><path fill="none" stroke="var(--s3)" stroke-width="4" stroke-linecap="round" marker-end="url(#ar3)" d="M300 214 L212 214"/><text class="ink sm" x="264" y="236" text-anchor="middle">β-병풍</text><path d="M382 190 C368 150 410 118 438 138 C466 158 448 196 418 194 C398 192 396 168 414 164" fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round"/><circle cx="424" cy="162" r="30" fill="var(--s1)" fill-opacity="0.1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="430" y="220" text-anchor="middle">소수성 부분이 안쪽으로</text><text class="ink2 sm" x="430" y="238" text-anchor="middle">숨으면서 접힌다</text><circle cx="576" cy="138" r="24" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.4"/><circle cx="618" cy="138" r="24" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><circle cx="576" cy="180" r="24" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><circle cx="618" cy="180" r="24" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.4"/><text class="ink2 sm" x="596" y="220" text-anchor="middle">헤모글로빈은 사슬 4개</text><text class="ink2 sm" x="596" y="238" text-anchor="middle">모두 필요하다</text><text class="ink2 sm" x="20" y="282" text-anchor="start">1차 구조만 정해지면 나머지가 대개 따라온다. 그래서 유전자가 아미노산 차례 하나만 지정해도 기능이 정해진다.</text>
</svg>