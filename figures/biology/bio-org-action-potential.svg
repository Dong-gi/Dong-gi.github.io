<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">활동전위와 그것을 만드는 투과성 변화</title><desc id="d">막전위는 나트륨과 칼륨의 평형전위 사이를 오가며, 어느 쪽으로 끌려가는지는 그때그때의 상대 투과성이 정한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path class="gr" d="M74 232 V60"/><path class="gr" d="M130.67 232 V60"/><path class="gr" d="M187.33 232 V60"/><path class="gr" d="M244 232 V60"/><path class="gr" d="M300.67 232 V60"/><path class="gr" d="M357.33 232 V60"/><path class="gr" d="M414 232 V60"/><path class="gr" d="M74 232 H414"/><path class="gr" d="M74 178.25 H414"/><path class="gr" d="M74 124.5 H414"/><path class="gr" d="M74 70.75 H414"/><path class="ax" marker-end="url(#ark)" d="M74 232 H426"/><path class="ax" marker-end="url(#ark)" d="M74 232 V48"/><text class="ink2 sm" x="74" y="248" text-anchor="middle">0</text><text class="ink2 sm" x="130.67" y="248" text-anchor="middle">1</text><text class="ink2 sm" x="187.33" y="248" text-anchor="middle">2</text><text class="ink2 sm" x="244" y="248" text-anchor="middle">3</text><text class="ink2 sm" x="300.67" y="248" text-anchor="middle">4</text><text class="ink2 sm" x="357.33" y="248" text-anchor="middle">5</text><text class="ink2 sm" x="414" y="248" text-anchor="middle">6</text><text class="ink2 sm" x="68" y="236" text-anchor="end">-100</text><text class="ink2 sm" x="68" y="182.25" text-anchor="end">-50</text><text class="ink2 sm" x="68" y="128.5" text-anchor="end">0</text><text class="ink2 sm" x="68" y="74.75" text-anchor="end">50</text><text class="ink2 sm" x="74" y="40" text-anchor="middle">막전위 (mV)</text><path class="cv s2" stroke-dasharray="4 4" d="M74 58.92 L414 58.92"/><path class="cv s1" stroke-dasharray="4 4" d="M74 220.18 L414 220.18"/><path class="cv s3" stroke-dasharray="2 3" d="M74 183.63 L414 183.63"/><text class="ink2 sm" x="412" y="52.92" text-anchor="end">E<tspan baseline-shift="-22%" font-size="76%">Na</tspan> +61</text><text class="ink2 sm" x="412" y="214.18" text-anchor="end">E<tspan baseline-shift="-22%" font-size="76%">K</tspan> −89</text><text class="ink2 sm" x="81.67" y="177.63" text-anchor="start">역치 −55</text><path class="cv s1" d="M74 199.75 L108 199.75 L125 191.15 L130.67 183.63 L139.17 167.5 L147.67 135.25 L156.17 103 L164.67 85.8 L173.17 81.5 L181.67 92.25 L193 124.5 L204.33 167.5 L215.67 197.6 L227 210.5 L244 212.65 L278 208.35 L329 202.97 L414 199.75"/><circle class="f3" cx="130.67" cy="183.63" r="4"/><path class="gr" d="M74 350 V282"/><path class="gr" d="M130.67 350 V282"/><path class="gr" d="M187.33 350 V282"/><path class="gr" d="M244 350 V282"/><path class="gr" d="M300.67 350 V282"/><path class="gr" d="M357.33 350 V282"/><path class="gr" d="M414 350 V282"/><path class="gr" d="M74 350 H414"/><path class="gr" d="M74 288.18 H414"/><path class="ax" marker-end="url(#ark)" d="M74 350 H426"/><path class="ax" marker-end="url(#ark)" d="M74 350 V270"/><text class="ink2 sm" x="74" y="366" text-anchor="middle">0</text><text class="ink2 sm" x="130.67" y="366" text-anchor="middle">1</text><text class="ink2 sm" x="187.33" y="366" text-anchor="middle">2</text><text class="ink2 sm" x="244" y="366" text-anchor="middle">3</text><text class="ink2 sm" x="300.67" y="366" text-anchor="middle">4</text><text class="ink2 sm" x="357.33" y="366" text-anchor="middle">5</text><text class="ink2 sm" x="414" y="366" text-anchor="middle">6</text><text class="ink2 sm" x="68" y="354" text-anchor="end">0</text><text class="ink2 sm" x="68" y="292.18" text-anchor="end">1</text><text class="ink2 sm" x="244" y="384" text-anchor="middle">시간 (ms)</text><text class="ink2 sm" x="74" y="262" text-anchor="middle">상대 투과성</text><path class="cv s2" d="M74 348.76 L122.17 348.76 L136.33 325.27 L150.5 288.18 L164.67 303.64 L181.67 331.45 L198.67 345.05 L221.33 348.76 L414 348.76"/><path class="cv s1" d="M74 346.91 L142 346.29 L164.67 337.64 L187.33 319.09 L210 301.78 L232.67 306.73 L266.67 325.27 L312 340.73 L368.67 346.29 L414 346.91"/><text class="ink2 sm" x="154.5" y="290.18" text-anchor="start">P<tspan baseline-shift="-22%" font-size="76%">Na</tspan></text><text class="ink2 sm" x="221.67" y="297.78" text-anchor="start">P<tspan baseline-shift="-22%" font-size="76%">K</tspan></text><text class="ink bold sm" x="444" y="66" text-anchor="start">읽는 순서</text><text class="ink sm" x="444" y="84" text-anchor="start">① 자극이 막을 역치까지 밀어 올린다</text><text class="ink sm" x="444" y="102" text-anchor="start">② Na⁺ 통로가 열리고, 그 탈분극이</text><text class="ink2 sm" x="444" y="120" text-anchor="start">   더 많은 통로를 연다 (양성 되먹임)</text><text class="ink sm" x="444" y="138" text-anchor="start">③ Na⁺ 통로가 스스로 닫히고(불활성화)</text><text class="ink2 sm" x="444" y="156" text-anchor="start">   느린 K⁺ 통로가 열려 내려온다</text><text class="ink sm" x="444" y="174" text-anchor="start">④ K⁺ 통로가 늦게 닫혀 잠시 E<tspan baseline-shift="-22%" font-size="76%">K</tspan> 쪽으로</text><text class="ink2 sm" x="444" y="192" text-anchor="start">   더 내려간다 (과분극)</text><text class="ink bold sm" x="444" y="228" text-anchor="start">아래 그림이 위 그림의 원인이다.</text><text class="ink2 sm" x="444" y="246" text-anchor="start">막전위는 그때그때 투과성이 큰 이온의</text><text class="ink2 sm" x="444" y="264" text-anchor="start">평형전위 쪽으로 끌려간다. 정점이</text><text class="ink2 sm" x="444" y="282" text-anchor="start">E<tspan baseline-shift="-22%" font-size="76%">Na</tspan> 에 못 미치는 것은 K⁺ 투과성이</text><text class="ink2 sm" x="444" y="300" text-anchor="start">0 이 아니기 때문이다.</text><text class="ink sm" x="444" y="336" text-anchor="start">자극이 아무리 세도 정점의 높이는</text><text class="ink sm" x="444" y="354" text-anchor="start">같다. 세기는 높이가 아니라 발화</text><text class="ink sm" x="444" y="372" text-anchor="start">빈도로 전달된다.</text><text class="ink2 sm" x="30" y="26" text-anchor="start">가로 점선 둘은 앞 그림에서 구한 평형전위다. 곡선은 그 사이를 오간다</text><text class="ink2 sm" x="30" y="402" text-anchor="start">불응기 동안에는 새 활동전위가 생기지 않는다. 그래서 신호가 한 방향으로만 진행한다</text>
</svg>