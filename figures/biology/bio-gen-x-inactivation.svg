<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 344" width="690" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">X 염색체 불활성화와 모자이크</title><desc id="d">세포마다 독립적인 무작위 선택이 조각 무늬를 만든다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="345" y="26" text-anchor="middle">세포마다 무작위로 하나를 끄면 개체는 모자이크가 된다</text><text class="ink bold sm" x="40" y="76" text-anchor="start">발생 초기</text><ellipse cx="112" cy="130" rx="40" ry="36" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><rect x="94" y="105" width="10" height="50" rx="5" fill="var(--s1)" fill-opacity="0.9"/><circle cx="99" cy="122" r="2.9" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="120" y="105" width="10" height="50" rx="5" fill="var(--s2)" fill-opacity="0.9"/><circle cx="125" cy="122" r="2.9" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="112" y="184" text-anchor="middle">두 X 가 모두 켜져 있다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M162 126 L208 104"/><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M162 134 L208 172"/><text class="ink2 sm" x="186" y="92" text-anchor="middle">무작위</text><ellipse cx="252" cy="104" rx="38" ry="32" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><rect x="235" y="79" width="10" height="50" rx="5" fill="var(--s1)" fill-opacity="0.9"/><circle cx="240" cy="96" r="2.9" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="259" y="79" width="10" height="50" rx="5" fill="var(--s2)" fill-opacity="0.28"/><circle cx="264" cy="96" r="2.9" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M251 91 L277 117" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="252" cy="176" rx="38" ry="32" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><rect x="235" y="151" width="10" height="50" rx="5" fill="var(--s1)" fill-opacity="0.28"/><circle cx="240" cy="168" r="2.9" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M227 163 L253 189" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="259" y="151" width="10" height="50" rx="5" fill="var(--s2)" fill-opacity="0.9"/><circle cx="264" cy="168" r="2.9" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="296" y="100" text-anchor="start">이쪽 X 만 쓴다</text><text class="ink2 sm" x="296" y="118" text-anchor="start">(선택은 자손 세포에 그대로 이어진다)</text><text class="ink2 sm" x="296" y="180" text-anchor="start">저쪽 X 만 쓴다</text><text class="ink bold sm" x="536" y="76" text-anchor="middle">자라난 뒤의 표면</text><rect x="452" y="92" width="40" height="32" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="494" y="92" width="40" height="32" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="536" y="92" width="40" height="32" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="578" y="92" width="40" height="32" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="452" y="126" width="40" height="32" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="494" y="126" width="40" height="32" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="536" y="126" width="40" height="32" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="578" y="126" width="40" height="32" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="452" y="160" width="40" height="32" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="494" y="160" width="40" height="32" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="536" y="160" width="40" height="32" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="578" y="160" width="40" height="32" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="452" y="194" width="40" height="32" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="494" y="194" width="40" height="32" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="536" y="194" width="40" height="32" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="578" y="194" width="40" height="32" rx="3" fill="var(--s1)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="536" y="250" text-anchor="middle">한 세포에서 자란 무리가 한 조각이 된다</text><text class="ink2 sm" x="30" y="298" text-anchor="start">선택이 무작위이고 그 뒤의 세포 이동과 증식도 우연에 좌우되므로, 유전자형이 같아도 무늬는 개체마다 다르다.</text><text class="ink2 sm" x="30" y="320" text-anchor="start">삼색 고양이가 거의 모두 암컷인 것과 복제 고양이의 무늬가 원본과 다른 것이 같은 이유에서 나온다</text>
</svg>