(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="156" cy="114" r="4" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="210" cy="216" r="4" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="96" cy="165" r="4" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="148" y="104" text-anchor="end">마디 2</text><text class="ink2 sm" x="88" y="155" text-anchor="end">뿌리</text><path d="M323 64 L330 64 L330 144 L323 144" fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M349 104 L356 104 L356 144 L349 144" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="376" y="84" text-anchor="start">{A,B,C} = 단계통군</text><text class="ink2 sm" x="376" y="102" text-anchor="start">마디 2 와 그 후손을 다 담았다</text><text class="ink bold sm" x="376" y="132" text-anchor="start">{B,C} = 측계통군</text><text class="ink2 sm" x="376" y="150" text-anchor="start">같은 마디에서 나온 A 를 빠뜨렸다</text><text class="ink bold sm" x="376" y="180" text-anchor="start">{A,D} = 다계통군</text><text class="ink2 sm" x="376" y="198" text-anchor="start">공통 조상이 뿌리뿐이라</text><text class="ink2 sm" x="376" y="214" text-anchor="start">B, C, E 가 통째로 딸려온다</text><text class="ink2 sm" x="30" y="28" text-anchor="start">마디를 축으로 위아래를 뒤집어도 같은 나무다. 잎이 그려진 순서는 정보가 아니다</text>
</svg>