<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path d="M100 66 L100 70" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="100" y="62" text-anchor="middle">0</text><path d="M190 66 L190 70" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="190" y="62" text-anchor="middle">6</text><path d="M280 66 L280 70" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="280" y="62" text-anchor="middle">12</text><path d="M370 66 L370 70" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="370" y="62" text-anchor="middle">18</text><path d="M460 66 L460 70" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="460" y="62" text-anchor="middle">24</text><text class="ink2 sm" x="468" y="62" text-anchor="start">h</text><rect x="100" y="84" width="240" height="28" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="340" y="84" width="120" height="28" rx="2" fill="var(--ink2)" fill-opacity="0.55" stroke="var(--ink2)" stroke-width="1.2"/><rect x="100" y="134" width="180" height="28" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="280" y="134" width="180" height="28" rx="2" fill="var(--ink2)" fill-opacity="0.55" stroke="var(--ink2)" stroke-width="1.2"/><rect x="100" y="184" width="180" height="28" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="280" y="184" width="180" height="28" rx="2" fill="var(--ink2)" fill-opacity="0.55" stroke="var(--ink2)" stroke-width="1.2"/><rect x="100" y="234" width="180" height="28" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="280" y="234" width="180" height="28" rx="2" fill="var(--ink2)" fill-opacity="0.55" stroke="var(--ink2)" stroke-width="1.2"/><path d="M370 176 L370 216" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370" cy="173" r="4.5" fill="var(--s1)" fill-opacity="1" stroke="var(--s1)" stroke-width="2"/><path d="M370 226 L370 266" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370" cy="223" r="4.5" fill="var(--s1)" fill-opacity="1" stroke="var(--s1)" stroke-width="2"/><path d="M391 226 L391 266" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="391" cy="223" r="4.5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="2"/><text class="ink sm" x="100" y="77" text-anchor="start">(가) 명기 16 h + 암기 8 h</text><text class="ink2 sm" x="490" y="103" text-anchor="start">8 h</text><text class="ink bold" x="578" y="103" text-anchor="start">✕</text><text class="ink bold" x="654" y="103" text-anchor="start">○</text><text class="ink sm" x="100" y="127" text-anchor="start">(나) 명기 12 h + 암기 12 h</text><text class="ink2 sm" x="490" y="153" text-anchor="start">12 h</text><text class="ink bold" x="578" y="153" text-anchor="start">○</text><text class="ink bold" x="654" y="153" text-anchor="start">✕</text><text class="ink sm" x="100" y="177" text-anchor="start">(다) (나) 의 암기 한가운데에 적색광 섬광</text><text class="ink2 sm" x="490" y="203" text-anchor="start">6 h</text><text class="ink bold" x="578" y="203" text-anchor="start">✕</text><text class="ink bold" x="654" y="203" text-anchor="start">○</text><text class="ink sm" x="100" y="227" text-anchor="start">(라) (다) 직후 원적색광 섬광</text><text class="ink2 sm" x="490" y="253" text-anchor="start">12 h</text><text class="ink bold" x="578" y="253" text-anchor="start">○</text><text class="ink bold" x="654" y="253" text-anchor="start">✕</text><text class="ink sm" x="490" y="62" text-anchor="start">최장 암기</text><text class="ink sm" x="566" y="62" text-anchor="start">단일식물</text><text class="ink sm" x="642" y="62" text-anchor="start">장일식물</text><circle cx="112" cy="288" r="4.5" fill="var(--s1)" fill-opacity="1" stroke="var(--s1)" stroke-width="2"/><text class="ink2 sm" x="124" y="292" text-anchor="start">적색광 섬광 (약 660 nm)</text><circle cx="292" cy="288" r="4.5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="2"/><text class="ink2 sm" x="304" y="292" text-anchor="start">원적색광 섬광 (약 730 nm) — 앞의 효과를 취소한다</text><text class="ink2 sm" x="30" y="26" text-anchor="start">두 식물의 임계 암기를 11 h 로 놓았다. 단일식물은 그보다 길면, 장일식물은 짧으면 꽃이 핀다</text><text class="ink sm" x="30" y="44" text-anchor="start">(나)와 (다)를 견주는 것이 이 실험의 핵심이다. 명기의 총량은 같고 암기의 연속성만 다르다</text><text class="ink2 sm" x="30" y="318" text-anchor="start">결과가 갈린다는 것은 식물이 낮의 길이가 아니라 연속된 밤의 길이를 잰다는 뜻이다</text>
</svg>