<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">삼투와 세포의 부피</title><desc id="d">저장액·등장액·고장액에서 동물세포와 식물세포의 변화</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">같은 용액이라도 세포벽이 있으면 결과가 다르다</text><text class="ink bold sm" x="140" y="62" text-anchor="middle">저장액 (바깥이 묽다)</text><text class="ink bold sm" x="350" y="62" text-anchor="middle">등장액 (같다)</text><text class="ink bold sm" x="560" y="62" text-anchor="middle">고장액 (바깥이 진하다)</text><text class="ink2 sm" x="20" y="100" text-anchor="start">동물세포</text><text class="ink2 sm" x="20" y="222" text-anchor="start">식물세포</text><path d="M100 178 L660 178" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="140" cy="122" r="34" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.8"/><path d="M174 122 L186 122" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M158.37 150.61 L164.85 160.71" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M125.85 152.92 L120.86 163.83" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M106.34 126.8 L94.46 128.49" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M117.78 96.27 L109.93 87.19" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M149.64 89.4 L153.05 77.89" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="140" y="168" text-anchor="middle">부풀다 터진다</text><circle cx="350" cy="122" r="26" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.8"/><text class="ink sm" x="350" y="168" text-anchor="middle">그대로</text><circle cx="560" cy="122" r="18" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.8"/><circle cx="560" cy="122" r="26" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1" stroke-dasharray="3 3"/><text class="ink sm" x="560" y="168" text-anchor="middle">쭈그러든다</text><rect x="96" y="206" width="88" height="74" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="2.4"/><rect x="99" y="209" width="82" height="68" rx="6" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.6"/><text class="ink sm" x="140" y="300" text-anchor="middle">팽팽해진다 (팽윤)</text><rect x="306" y="206" width="88" height="74" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="2.4"/><rect x="314.74" y="213.76" width="70.52" height="58.48" rx="6" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.6"/><text class="ink sm" x="350" y="300" text-anchor="middle">약간 늘어진다</text><rect x="516" y="206" width="88" height="74" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="2.4"/><rect x="533.76" y="221.24" width="52.48" height="43.52" rx="6" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.6"/><text class="ink sm" x="560" y="300" text-anchor="middle">원형질분리</text><text class="ink2 sm" x="140" y="198" text-anchor="end">세포벽</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M146 194 L158 206"/><text class="ink2 sm" x="20" y="328" text-anchor="start">물은 용질이 적은 쪽에서 많은 쪽으로 간다. 동물세포에는 이 압력을 버틸 것이 없어 저장액에서 터지고, 식물세포는 세포벽이 받쳐 준다.</text>
</svg>