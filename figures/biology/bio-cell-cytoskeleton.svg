<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 330" width="690" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">세포골격 세 가지</title><desc id="d">미세소관·액틴 필라멘트·중간섬유의 구조와 성질 비교</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">세포골격 셋은 굵기도 하는 일도 다르다</text><rect x="24" y="52" width="200" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="124" y="72" text-anchor="middle">미세소관</text><text class="ink2 sm" x="124" y="89" text-anchor="middle">지름 약 25 nm</text><rect x="246" y="52" width="200" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="346" y="72" text-anchor="middle">액틴 필라멘트</text><text class="ink2 sm" x="346" y="89" text-anchor="middle">지름 약 7 nm</text><rect x="468" y="52" width="200" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="568" y="72" text-anchor="middle">중간섬유</text><text class="ink2 sm" x="568" y="89" text-anchor="middle">지름 약 10 nm</text><rect x="60" y="96" width="128" height="40" rx="8" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><circle cx="72" cy="105" r="6" fill="var(--s1)" fill-opacity="0.42" stroke="var(--s1)" stroke-width="1"/><circle cx="72" cy="127" r="6" fill="var(--s2)" fill-opacity="0.42" stroke="var(--s2)" stroke-width="1"/><circle cx="88" cy="105" r="6" fill="var(--s1)" fill-opacity="0.42" stroke="var(--s1)" stroke-width="1"/><circle cx="88" cy="127" r="6" fill="var(--s2)" fill-opacity="0.42" stroke="var(--s2)" stroke-width="1"/><circle cx="104" cy="105" r="6" fill="var(--s1)" fill-opacity="0.42" stroke="var(--s1)" stroke-width="1"/><circle cx="104" cy="127" r="6" fill="var(--s2)" fill-opacity="0.42" stroke="var(--s2)" stroke-width="1"/><circle cx="120" cy="105" r="6" fill="var(--s1)" fill-opacity="0.42" stroke="var(--s1)" stroke-width="1"/><circle cx="120" cy="127" r="6" fill="var(--s2)" fill-opacity="0.42" stroke="var(--s2)" stroke-width="1"/><circle cx="136" cy="105" r="6" fill="var(--s1)" fill-opacity="0.42" stroke="var(--s1)" stroke-width="1"/><circle cx="136" cy="127" r="6" fill="var(--s2)" fill-opacity="0.42" stroke="var(--s2)" stroke-width="1"/><circle cx="152" cy="105" r="6" fill="var(--s1)" fill-opacity="0.42" stroke="var(--s1)" stroke-width="1"/><circle cx="152" cy="127" r="6" fill="var(--s2)" fill-opacity="0.42" stroke="var(--s2)" stroke-width="1"/><circle cx="168" cy="105" r="6" fill="var(--s1)" fill-opacity="0.42" stroke="var(--s1)" stroke-width="1"/><circle cx="168" cy="127" r="6" fill="var(--s2)" fill-opacity="0.42" stroke="var(--s2)" stroke-width="1"/><circle cx="184" cy="105" r="6" fill="var(--s1)" fill-opacity="0.42" stroke="var(--s1)" stroke-width="1"/><circle cx="184" cy="127" r="6" fill="var(--s2)" fill-opacity="0.42" stroke="var(--s2)" stroke-width="1"/><text class="ink2 sm" x="124" y="154" text-anchor="middle">튜불린 두 종류가 관을 이룬다</text><text class="ink2 sm" x="40" y="182" text-anchor="start">· 양 끝의 성질이 다르다 (극성)</text><text class="ink2 sm" x="40" y="200" text-anchor="start">· 키네신·다이닌이 이 위를 걷는다</text><text class="ink2 sm" x="40" y="218" text-anchor="start">· 소포 장거리 운반, 섬모와 편모</text><text class="ink2 sm" x="40" y="236" text-anchor="start">· 분열 때 방추사가 된다</text><text class="ink2 sm" x="40" y="254" text-anchor="start">· 자랐다 무너졌다를 되풀이한다</text><path d="M268 116 Q279.83333333333337 94 291.6666666666667 116 Q303.5 138 315.3333333333333 116 Q327.16666666666663 94 339 116 Q350.83333333333337 138 362.6666666666667 116 Q374.5 94 386.3333333333333 116 Q398.16666666666663 138 410 116" fill="none" stroke="var(--s3)" stroke-width="3"/><path d="M268 116 Q279.83333333333337 138 291.6666666666667 116 Q303.5 94 315.3333333333333 116 Q327.16666666666663 138 339 116 Q350.83333333333337 94 362.6666666666667 116 Q374.5 138 386.3333333333333 116 Q398.16666666666663 94 410 116" fill="none" stroke="var(--s1)" stroke-width="3"/><text class="ink2 sm" x="340" y="160" text-anchor="middle">두 가닥이 서로 꼬여 있다</text><text class="ink2 sm" x="262" y="182" text-anchor="start">· 극성이 있다</text><text class="ink2 sm" x="262" y="200" text-anchor="start">· 미오신이 이 위를 걷는다</text><text class="ink2 sm" x="262" y="218" text-anchor="start">· 세포 표면 바로 아래에 그물을 이룬다</text><text class="ink2 sm" x="262" y="236" text-anchor="start">· 세포가 기어가는 데 쓰인다</text><text class="ink2 sm" x="262" y="254" text-anchor="start">· 분열 끝에 세포를 조르는 고리</text><path d="M492 104 q9 -6 18 0 q9 6 18 0 q9 -6 18 0 q9 6 18 0 q9 -6 18 0 q9 6 18 0 q9 -6 18 0" fill="none" stroke="var(--ink2)" stroke-width="2"/><path d="M492 112 q9 -6 18 0 q9 6 18 0 q9 -6 18 0 q9 6 18 0 q9 -6 18 0 q9 6 18 0 q9 -6 18 0" fill="none" stroke="var(--ink2)" stroke-width="2"/><path d="M492 120 q9 -6 18 0 q9 6 18 0 q9 -6 18 0 q9 6 18 0 q9 -6 18 0 q9 6 18 0 q9 -6 18 0" fill="none" stroke="var(--ink2)" stroke-width="2"/><path d="M492 128 q9 -6 18 0 q9 6 18 0 q9 -6 18 0 q9 6 18 0 q9 -6 18 0 q9 6 18 0 q9 -6 18 0" fill="none" stroke="var(--ink2)" stroke-width="2"/><text class="ink2 sm" x="566" y="160" text-anchor="middle">여러 가닥을 꼰 밧줄</text><text class="ink2 sm" x="484" y="182" text-anchor="start">· 극성이 없다</text><text class="ink2 sm" x="484" y="200" text-anchor="start">· 운동단백질이 붙지 않는다</text><text class="ink2 sm" x="484" y="218" text-anchor="start">· 잡아당기는 힘을 견딘다</text><text class="ink2 sm" x="484" y="236" text-anchor="start">· 핵막 안쪽을 받친다</text><text class="ink2 sm" x="484" y="254" text-anchor="start">· 셋 중 가장 안정하다</text><text class="ink2 sm" x="20" y="292" text-anchor="start">굵기 순서는 액틴(7 nm) &lt; 중간섬유(10 nm) &lt; 미세소관(25 nm) 이다.</text><text class="ink2 sm" x="20" y="312" text-anchor="start">앞의 둘은 뉴클레오타이드를 쓰며 끊임없이 조립과 해체를 되풀이한다. 뼈대라기보다 늘 다시 지어지는 비계에 가깝다.</text>
</svg>