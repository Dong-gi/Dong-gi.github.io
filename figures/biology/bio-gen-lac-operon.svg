<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 456" width="700" height="456" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">lac 오페론의 구조와 네 가지 조합</title><desc id="d">억압자와 활성자가 직렬로 걸린 조절 논리</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="350" y="26" text-anchor="middle">lac 오페론 — 신호 두 개를 받아 하나의 답을 낸다</text><text class="ink2 sm" x="350" y="46" text-anchor="middle">젖당이 있고 포도당이 없을 때만 강하게 전사한다</text><path d="M24 97 L676 97" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="84" width="84" height="26" rx="3" fill="var(--s3)" fill-opacity="0.24" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="70" y="102" text-anchor="middle">lacI</text><rect x="160" y="84" width="78" height="26" rx="3" fill="var(--s1)" fill-opacity="0.24" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="199" y="102" text-anchor="middle">CAP 자리</text><rect x="240" y="84" width="52" height="26" rx="3" fill="var(--ink2)" fill-opacity="0.18" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="266" y="102" text-anchor="middle">프로모터</text><rect x="294" y="84" width="52" height="26" rx="3" fill="var(--s2)" fill-opacity="0.26" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="320" y="102" text-anchor="middle">오퍼레이터</text><rect x="350" y="84" width="106" height="26" rx="3" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="403" y="102" text-anchor="middle">lacZ</text><rect x="458" y="84" width="106" height="26" rx="3" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="511" y="102" text-anchor="middle">lacY</text><rect x="566" y="84" width="106" height="26" rx="3" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="619" y="102" text-anchor="middle">lacA</text><text class="ink2 sm" x="70" y="76" text-anchor="middle">억압자를 만든다</text><text class="ink2 sm" x="199" y="76" text-anchor="middle">활성자가 앉는 자리</text><text class="ink2 sm" x="320" y="76" text-anchor="middle">억압자가 막는 자리</text><text class="ink2 sm" x="511" y="128" text-anchor="middle">세 유전자가 함께 전사되어 하나의 mRNA 가 된다</text><path d="M24 156 L676 156" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="46" y="184" text-anchor="start">포도당</text><text class="ink bold sm" x="122" y="184" text-anchor="start">젖당</text><text class="ink bold sm" x="220" y="184" text-anchor="start">억압자가 오퍼레이터에</text><text class="ink bold sm" x="380" y="184" text-anchor="start">CAP 이 프로모터에</text><text class="ink bold sm" x="512" y="184" text-anchor="start">전사량</text><text class="ink" x="46" y="222" text-anchor="start">있음</text><text class="ink" x="122" y="222" text-anchor="start">없음</text><text class="ink2 sm" x="220" y="222" text-anchor="start">붙어 있다 (차단)</text><text class="ink2 sm" x="380" y="222" text-anchor="start">못 붙는다</text><rect x="512" y="209" width="108" height="18" rx="3" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="628" y="222" text-anchor="start">없음</text><text class="ink" x="46" y="266" text-anchor="start">있음</text><text class="ink" x="122" y="266" text-anchor="start">있음</text><text class="ink2 sm" x="220" y="266" text-anchor="start">떨어졌다</text><text class="ink2 sm" x="380" y="266" text-anchor="start">못 붙는다</text><rect x="512" y="253" width="108" height="18" rx="3" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--grid)" stroke-width="1"/><rect x="512" y="253" width="8.64" height="18" rx="3" fill="var(--s3)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text class="ink2 sm" x="628" y="266" text-anchor="start">아주 낮음</text><text class="ink" x="46" y="310" text-anchor="start">없음</text><text class="ink" x="122" y="310" text-anchor="start">없음</text><text class="ink2 sm" x="220" y="310" text-anchor="start">붙어 있다 (차단)</text><text class="ink2 sm" x="380" y="310" text-anchor="start">붙었다</text><rect x="512" y="297" width="108" height="18" rx="3" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="628" y="310" text-anchor="start">없음</text><rect x="30" y="332" width="640" height="38" rx="5" fill="var(--s3)" fill-opacity="0.16" stroke="none" stroke-width="0"/><text class="ink" x="46" y="354" text-anchor="start">없음</text><text class="ink" x="122" y="354" text-anchor="start">있음</text><text class="ink2 sm" x="220" y="354" text-anchor="start">떨어졌다</text><text class="ink2 sm" x="380" y="354" text-anchor="start">붙었다</text><rect x="512" y="341" width="108" height="18" rx="3" fill="var(--ink2)" fill-opacity="0.06" stroke="var(--grid)" stroke-width="1"/><rect x="512" y="341" width="108" height="18" rx="3" fill="var(--s3)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text class="ink2 sm" x="628" y="354" text-anchor="start">강함</text><text class="ink2 sm" x="350" y="424" text-anchor="middle">억압자를 떼는 것은 젖당이고, CAP 을 켜는 것은 포도당이 없다는 사실이다. 두 조건이 다 맞아야 강한 전사가 나온다.</text><text class="ink2 sm" x="350" y="444" text-anchor="middle">셋째 줄을 눈여겨볼 것. CAP 이 붙어 있어도 억압자가 남아 있으면 전사는 0 이다</text>
</svg>