1 L264.07 114.62 L266.53 113.63 L269 112.74 L271.47 111.97 L273.93 111.3 L276.4 110.75 L278.87 110.32 L281.33 109.99 L283.8 109.78 L286.27 109.69 L288.73 109.72 L291.2 109.86 L293.67 110.12 L296.13 110.49 L298.6 110.98 L301.07 111.57 L303.53 112.29 L306 113.11 L308.47 114.04 L310.93 115.07 L313.4 116.22 L315.87 117.46 L318.33 118.8 L320.8 120.23 L323.27 121.76 L325.73 123.38 L328.2 125.08 L330.67 126.86 L333.13 128.73 L335.6 130.66 L338.07 132.67 L340.53 134.74 L343 136.87 L345.47 139.07 L347.93 141.31 L350.4 143.6 L352.87 145.94 L355.33 148.31 L357.8 150.72 L360.27 153.16 L362.73 155.63 L365.2 158.12 L367.67 160.63 L370.13 163.15 L372.6 165.68 L375.07 168.21 L377.53 170.75 L380 173.28"/><circle class="f3" cx="207.47" cy="158.46" r="4.5"/><path class="gr" stroke-dasharray="4 3" d="M207.47 260 L207.47 158.46"/><text class="ink sm" x="149.47" y="141.16" text-anchor="middle">약 25 °C 에서 뒤집힌다</text><text class="ink sm" x="117.2" y="174.1" text-anchor="start">C3</text><text class="ink sm" x="345.71" y="136.38" text-anchor="start">C4</text><text class="ink bold sm" x="414" y="84" text-anchor="start">C3 가 온도에 약한 이유</text><text class="ink2 sm" x="414" y="104" text-anchor="start">온도가 오르면 두 가지가 겹친다.</text><text class="ink2 sm" x="414" y="122" text-anchor="start">① 물에 녹은 CO₂ 가 O₂ 보다</text><text class="ink2 sm" x="414" y="140" text-anchor="start">   빠르게 줄어든다</text><text class="ink2 sm" x="414" y="158" text-anchor="start">② 루비스코가 CO₂ 를 가려내는</text><text class="ink2 sm" x="414" y="176" text-anchor="start">   능력 자체가 떨어진다</text><text class="ink2 sm" x="414" y="200" text-anchor="start">→ 광호흡이 늘어 순 고정이 준다.</text><text class="ink2 sm" x="414" y="228" text-anchor="start">C4 는 CO₂ 를 미리 농축해서</text><text class="ink2 sm" x="414" y="246" text-anchor="start">이 손실을 거의 없앤다.</text><text class="ink2 sm" x="20" y="322" text-anchor="start">C4 는 CO₂ 하나당 ATP 를 2개 더 쓴다. 서늘한 곳에서는 그 추가 비용이 손해이므로 C3 가 앞선다.</text><text class="ink2 sm" x="20" y="342" text-anchor="start">어느 쪽이 ‘더 나은 광합성’이냐는 물음은 성립하지 않는다. 답은 온도와 물 사정에 따라 갈린다.</text>
</svg>