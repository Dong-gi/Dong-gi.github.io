<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">pH 눈금</title><desc id="d">몸속 여러 곳의 pH 를 0에서 14 눈금 위에 표시</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">pH 눈금 — 한 칸이 수소 이온 농도 10배</text><rect x="70" y="136" width="275" height="28" rx="0" fill="var(--s2)" fill-opacity="0.14" stroke="none" stroke-width="0"/><rect x="345" y="136" width="275" height="28" rx="0" fill="var(--s1)" fill-opacity="0.14" stroke="none" stroke-width="0"/><rect x="70" y="136" width="550" height="28" rx="0" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><path d="M70 164 L70 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="70" y="186" text-anchor="middle">0</text><path d="M109.29 164 L109.29 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="109.29" y="186" text-anchor="middle">1</text><path d="M148.57 164 L148.57 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="148.57" y="186" text-anchor="middle">2</text><path d="M187.86 164 L187.86 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="187.86" y="186" text-anchor="middle">3</text><path d="M227.14 164 L227.14 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="227.14" y="186" text-anchor="middle">4</text><path d="M266.43 164 L266.43 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="266.43" y="186" text-anchor="middle">5</text><path d="M305.71 164 L305.71 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="305.71" y="186" text-anchor="middle">6</text><path d="M345 164 L345 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="345" y="186" text-anchor="middle">7</text><path d="M384.29 164 L384.29 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="384.29" y="186" text-anchor="middle">8</text><path d="M423.57 164 L423.57 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="423.57" y="186" text-anchor="middle">9</text><path d="M462.86 164 L462.86 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="462.86" y="186" text-anchor="middle">10</text><path d="M502.14 164 L502.14 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="502.14" y="186" text-anchor="middle">11</text><path d="M541.43 164 L541.43 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="541.43" y="186" text-anchor="middle">12</text><path d="M580.71 164 L580.71 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="580.71" y="186" text-anchor="middle">13</text><path d="M620 164 L620 170" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="620" y="186" text-anchor="middle">14</text><text class="ink sm" x="207.5" y="155" text-anchor="middle">산성</text><text class="ink sm" x="482.5" y="155" text-anchor="middle">염기성</text><path d="M96 84 L96 104 L140.71 122 L140.71 135" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="140.71" cy="136" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="96" y="78" text-anchor="middle">위액 1.8</text><path d="M214 84 L214 104 L258.57 122 L258.57 135" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="258.57" cy="136" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="214" y="78" text-anchor="middle">리소좀 안 4.8</text><path d="M336 84 L336 104 L337.14 122 L337.14 135" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="337.14" cy="136" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="336" y="78" text-anchor="middle">체온의 중성점 6.8</text><path d="M440 84 L440 104 L352.86 122 L352.86 135" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="352.86" cy="136" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="440" y="78" text-anchor="middle">세포질 7.2</text><path d="M526 84 L526 104 L360.71 122 L360.71 135" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360.71" cy="136" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="526" y="78" text-anchor="middle">혈액 7.4</text><path d="M606 84 L606 104 L384.29 122 L384.29 135" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="384.29" cy="136" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="606" y="78" text-anchor="middle">엽록체 스트로마 8.0</text><text class="ink2 sm" x="20" y="226" text-anchor="start">혈액 7.4 와 리소좀 4.8 은 pH 로 2.6 차이지만 수소 이온 농도로는 약 400배 차이다.</text><text class="ink2 sm" x="20" y="246" text-anchor="start">사람 혈액이 7.35 아래로 내려가거나 7.45 위로 올라가면 살지 못한다. 붙잡아 두는 장치가 완충계다.</text><text class="ink2 sm" x="20" y="272" text-anchor="start">중성의 정의는 pH 7 이 아니라 H⁺ 와 OH⁻ 의 농도가 같은 것이다. 체온에서 그 값은 약 6.8 이다.</text>
</svg>