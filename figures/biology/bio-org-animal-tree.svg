<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">동물의 몸 구조로 읽는 계통</title><desc id="d">해면동물부터 촉수담륜동물까지의 계통수에 조직, 좌우대칭, 선구와 후구가 갈린 자리를 표시했다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path d="M30 109 L70 109" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 60 L70 158" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 112 L120 203" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 164 L180 242" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 216 L240 268" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 60 L300 60" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 112 L300 112" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 164 L300 164" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 216 L300 216" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 268 L300 268" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 158 L120 158" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 203 L180 203" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 242 L240 242" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="309" y="61" text-anchor="start">해면동물</text><text class="ink2 sm" x="309" y="76" text-anchor="start">참된 조직이 없다</text><text class="ink bold sm" x="309" y="113" text-anchor="start">자포동물</text><text class="ink2 sm" x="309" y="128" text-anchor="start">히드라 · 해파리 · 산호</text><text class="ink bold sm" x="309" y="165" text-anchor="start">후구동물</text><text class="ink2 sm" x="309" y="180" text-anchor="start">극피동물 · 척삭동물</text><text class="ink bold sm" x="309" y="217" text-anchor="start">탈피동물</text><text class="ink2 sm" x="309" y="232" text-anchor="start">절지동물 · 선형동물</text><text class="ink bold sm" x="309" y="269" text-anchor="start">촉수담륜동물</text><text class="ink2 sm" x="309" y="284" text-anchor="start">연체동물 · 환형동물</text><rect x="91" y="149" width="8" height="18" rx="2" fill="var(--s3)" fill-opacity="0.85" stroke="var(--s3)" stroke-width="1"/><text class="ink bold sm" x="95" y="144" text-anchor="middle">①</text><rect x="146" y="194" width="8" height="18" rx="2" fill="var(--s3)" fill-opacity="0.85" stroke="var(--s3)" stroke-width="1"/><text class="ink bold sm" x="150" y="189" text-anchor="middle">②</text><rect x="206" y="233" width="8" height="18" rx="2" fill="var(--s3)" fill-opacity="0.85" stroke="var(--s3)" stroke-width="1"/><text class="ink bold sm" x="210" y="228" text-anchor="middle">③</text><rect x="264" y="155" width="8" height="18" rx="2" fill="var(--s3)" fill-opacity="0.85" stroke="var(--s3)" stroke-width="1"/><text class="ink bold sm" x="268" y="150" text-anchor="middle">④</text><text class="ink2 sm" x="462" y="66" text-anchor="start">가지에 찍은 번호가 그 자리에서</text><text class="ink2 sm" x="462" y="83" text-anchor="start">새로 생긴 몸 구조다.</text><text class="ink sm" x="462" y="117" text-anchor="start">① 참된 조직과 방사대칭, 이배엽</text><text class="ink sm" x="462" y="134" text-anchor="start">② 좌우대칭과 삼배엽, 앞뒤 축</text><text class="ink sm" x="462" y="151" text-anchor="start">③ 선구동물 — 먼저 뚫린 구멍이 입</text><text class="ink sm" x="462" y="168" text-anchor="start">④ 후구동물 — 먼저 뚫린 구멍이 항문</text><text class="ink2 sm" x="462" y="202" text-anchor="start">형태로 세운 옛 분류가 서열로 크게</text><text class="ink2 sm" x="462" y="219" text-anchor="start">수정된 자리가 ③ 이다. 선구동물이</text><text class="ink2 sm" x="462" y="236" text-anchor="start">탈피동물과 촉수담륜동물로 갈린다는</text><text class="ink2 sm" x="462" y="253" text-anchor="start">결론은 몸 구조만 보아서는 나오지</text><text class="ink2 sm" x="462" y="270" text-anchor="start">않았다.</text><text class="ink2 sm" x="30" y="26" text-anchor="start">동물을 나누는 축은 대칭성, 배엽 수, 그리고 입과 항문 중 무엇이 먼저 생기는가다</text><text class="ink2 sm" x="30" y="304" text-anchor="start">잎이 위아래로 놓인 순서에는 뜻이 없다. 정보는 오직 어떤 잎들이 한 마디를 이루는가에 있다</text>
</svg>