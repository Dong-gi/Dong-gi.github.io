<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">단성잡종 교배와 퍼넷 사각형</title><desc id="d">F1 에서 사라진 열성 형질이 F2 에서 4분의 1로 다시 나타난다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="350" y="26" text-anchor="middle">한 형질만 따라가기 — 사라졌던 형질이 F₂ 에서 4분의 1로 돌아온다</text><text class="ink bold" x="46" y="76" text-anchor="start">P</text><circle cx="112" cy="70" r="21" fill="var(--s1)" fill-opacity="0.85" stroke="var(--ink2)" stroke-width="1.4"/><circle cx="228" cy="70" r="21" fill="var(--s2)" fill-opacity="0.3" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold" x="112" y="75" text-anchor="middle">RR</text><text class="ink bold" x="228" y="75" text-anchor="middle">rr</text><text class="ink bold" x="170" y="76" text-anchor="middle">×</text><text class="ink2 sm" x="112" y="108" text-anchor="middle">둥근 (순계)</text><text class="ink2 sm" x="228" y="108" text-anchor="middle">주름 (순계)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M170 120 L170 148"/><text class="ink bold" x="46" y="180" text-anchor="start">F<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><circle cx="170" cy="176" r="21" fill="var(--s1)" fill-opacity="0.85" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold" x="170" y="181" text-anchor="middle">Rr</text><text class="ink2 sm" x="170" y="214" text-anchor="middle">전부 둥근 — 주름이 보이지 않는다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M170 226 L170 254"/><text class="ink2 sm" x="180" y="246" text-anchor="start">자가수분</text><text class="ink bold" x="46" y="292" text-anchor="start">F<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="82" y="274" width="132" height="26" rx="3" fill="var(--s1)" fill-opacity="0.85" stroke="var(--ink2)" stroke-width="1.2"/><rect x="214" y="274" width="44" height="26" rx="3" fill="var(--s2)" fill-opacity="0.3" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="148" y="292" text-anchor="middle">둥근 3</text><text class="ink bold" x="236" y="292" text-anchor="middle">1</text><text class="ink2 sm" x="82" y="322" text-anchor="start">표현형 3 : 1 — 주름이 돌아온 것이 열성이 사라지지 않았다는 증거다</text><path d="M336 54 L336 336" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink bold" x="510" y="76" text-anchor="middle">F<tspan baseline-shift="-22%" font-size="76%">1</tspan> 끼리의 교배 — 퍼넷 사각형</text><text class="ink2 sm" x="510" y="96" text-anchor="middle">가로·세로에 배우자를 적고 칸마다 합친다</text><text class="ink bold" x="478" y="121" text-anchor="middle">R</text><text class="ink bold" x="542" y="121" text-anchor="middle">r</text><text class="ink bold" x="435" y="167" text-anchor="end">R</text><text class="ink bold" x="435" y="231" text-anchor="end">r</text><rect x="446" y="130" width="64" height="64" rx="3" fill="var(--s1)" fill-opacity="0.85" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="478" y="161" text-anchor="middle">RR</text><text class="ink2 sm" x="478" y="178" text-anchor="middle">둥근</text><rect x="510" y="130" width="64" height="64" rx="3" fill="var(--s1)" fill-opacity="0.85" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="542" y="161" text-anchor="middle">Rr</text><text class="ink2 sm" x="542" y="178" text-anchor="middle">둥근</text><rect x="446" y="194" width="64" height="64" rx="3" fill="var(--s1)" fill-opacity="0.85" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="478" y="225" text-anchor="middle">Rr</text><text class="ink2 sm" x="478" y="242" text-anchor="middle">둥근</text><rect x="510" y="194" width="64" height="64" rx="3" fill="var(--s2)" fill-opacity="0.3" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="542" y="225" text-anchor="middle">rr</text><text class="ink2 sm" x="542" y="242" text-anchor="middle">주름</text><text class="ink" x="510" y="288" text-anchor="middle">RR : Rr : rr = 1 : 2 : 1  (유전자형)</text><text class="ink" x="510" y="310" text-anchor="middle">둥근 : 주름 = 3 : 1  (표현형)</text><text class="ink2 sm" x="510" y="336" text-anchor="middle">유전자형 비와 표현형 비는 다른 수다</text>
</svg>