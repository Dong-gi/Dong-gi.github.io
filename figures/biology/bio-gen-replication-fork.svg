<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" width="700" height="392" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">복제 분기점의 선도가닥과 지연가닥</title><desc id="d">5′→3′ 제약에서 두 가닥의 합성 방식이 갈라진다</desc>
<style>
