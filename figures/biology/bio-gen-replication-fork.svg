roke-linejoin="round"/><path d="M638 192 L638 208" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M652 192 L652 208" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="600" y="178" text-anchor="middle">아직 안 풀린 어미 이중나선</text><path d="M110 100 L350 100 L440 190" fill="none" stroke="var(--s1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 300 L350 300 L440 210" fill="none" stroke="var(--s2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="102" y="104" text-anchor="end">3′</text><text class="ink bold" x="102" y="304" text-anchor="end">5′</text><text class="ink sm" x="116" y="64" text-anchor="start">지연가닥 — 짧게 여러 번 만들고 나중에 잇는다 (오카자키 조각)</text><text class="ink2 sm" x="116" y="86" text-anchor="start">어미 가닥 (지연가닥의 주형)</text><text class="ink2 sm" x="116" y="322" text-anchor="start">어미 가닥 (선도가닥의 주형)</text><text class="ink sm" x="116" y="344" text-anchor="start">선도가닥 — 분기점을 따라가며 한 번에 이어 만든다</text><rect x="124" y="128" width="24" height="9" rx="3" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><path d="M150 132 L196 132" fill="none" stroke="var(--s3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="160" y="156" text-anchor="middle">조각 3</text><rect x="212" y="128" width="24" height="9" rx="3" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><path d="M238 132 L284 132" fill="none" stroke="var(--s3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="248" y="156" text-anchor="middle">조각 2</text><rect x="300" y="128" width="24" height="9" rx="3" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><path d="M326 132 L372 132" fill="none" stroke="var(--s3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="336" y="156" text-anchor="middle">조각 1</text><text class="ink2 sm" x="30" y="136" text-anchor="start">RNA 프라이머</text><path fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M200 178 L160 178"/><path fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M288 178 L248 178"/><text class="ink2 sm" x="120" y="204" text-anchor="start">조각 하나하나도 5′→3′ 다</text><path d="M150 272 L372 272" fill="none" stroke="var(--s3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M372 272 L408 240"/><text class="ink bold" x="142" y="276" text-anchor="end">5′</text><path d="M436 174 L472 200 L436 226 Z" fill="var(--ink2)" fill-opacity="0.3" stroke="none" stroke-width="1"/><text class="ink sm" x="478" y="248" text-anchor="start">헬리케이스</text><text class="ink2 sm" x="478" y="264" text-anchor="start">(여기서 풀린다)</text><text class="ink2 sm" x="350" y="380" text-anchor="middle">합성 방향은 언제나 5′→3′ 다. 지연가닥이 조각나는 것은 그 방향이 분기점 진행 방향과 반대이기 때문이다</text>
</svg>