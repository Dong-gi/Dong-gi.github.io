<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 402" width="700" height="402" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">trp 오페론의 억압과 감쇠</title><desc id="d">억압자에 의한 조절 위에 리보솜 위치에 따른 조기 종결이 겹쳐 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="350" y="26" text-anchor="middle">trp 오페론 — 두 층으로 조절한다</text><rect x="16" y="46" width="330" height="322" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="181" y="65" text-anchor="middle">1층 · 억압</text><text class="ink2 sm" x="181" y="81" text-anchor="middle">트립토판이 많으면 억압자를 켠다</text><rect x="354" y="46" width="330" height="322" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="519" y="65" text-anchor="middle">2층 · 감쇠</text><text class="ink2 sm" x="519" y="81" text-anchor="middle">리보솜이 어디서 멈추는지가 정한다</text><path d="M36 125 L330 125" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="112" width="56" height="26" rx="3" fill="var(--ink2)" fill-opacity="0.18" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="68" y="130" text-anchor="middle">프로모터</text><rect x="98" y="112" width="60" height="26" rx="3" fill="var(--s2)" fill-opacity="0.26" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="128" y="130" text-anchor="middle">오퍼레이터</text><rect x="160" y="112" width="164" height="26" rx="3" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="242" y="130" text-anchor="middle">trp 유전자들</text><text class="ink bold sm" x="36" y="200" text-anchor="start">트립토판이 많을 때</text><circle cx="70" cy="240" r="17" fill="var(--s2)" fill-opacity="0.7" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="70" y="245" text-anchor="middle">억압</text><text class="ink2 sm" x="102" y="232" text-anchor="start">트립토판이 억압자에 붙어</text><text class="ink2 sm" x="102" y="250" text-anchor="start">오퍼레이터를 막는다 → 전사 없음</text><text class="ink bold sm" x="36" y="292" text-anchor="start">트립토판이 적을 때</text><circle cx="70" cy="328" r="17" fill="var(--ink2)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="70" y="333" text-anchor="middle">억압</text><text class="ink2 sm" x="102" y="322" text-anchor="start">억압자가 떨어져 있어</text><text class="ink2 sm" x="102" y="340" text-anchor="start">전사가 진행된다</text><text class="ink bold sm" x="372" y="122" text-anchor="start">트립토판이 많을 때 — 리보솜이 안 멈춘다</text><path d="M372 176 L648 176" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="380" y="164" width="60" height="24" rx="3" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold sm" x="410" y="181" text-anchor="middle">1</text><rect x="446" y="164" width="60" height="24" rx="3" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold sm" x="476" y="181" text-anchor="middle">2</text><rect x="512" y="164" width="60" height="24" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold sm" x="542" y="181" text-anchor="middle">3</text><rect x="578" y="164" width="60" height="24" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold sm" x="608" y="181" text-anchor="middle">4</text><path d="M542 164 Q575 132 608 164" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink sm" x="575" y="144" text-anchor="middle">3-4 결합</text><text class="ink2 sm" x="372" y="210" text-anchor="start">2번 구역이 리보솜에 덮여 3-4 머리핀이 생긴다</text><text class="ink sm" x="372" y="228" text-anchor="start">→ 전사가 여기서 끊긴다</text><text class="ink bold sm" x="372" y="260" text-anchor="start">트립토판이 적을 때 — 리보솜이 멈춘다</text><path d="M372 312 L648 312" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="380" y="300" width="60" height="24" rx="3" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold sm" x="410" y="317" text-anchor="middle">1</text><rect x="446" y="300" width="60" height="24" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold sm" x="476" y="317" text-anchor="middle">2</text><rect x="512" y="300" width="60" height="24" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold sm" x="542" y="317" text-anchor="middle">3</text><rect x="578" y="300" width="60" height="24" rx="3" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold sm" x="608" y="317" text-anchor="middle">4</text><path d="M476 300 Q509 268 542 300" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink sm" x="509" y="280" text-anchor="middle">2-3 결합</text><text class="ink2 sm" x="372" y="346" text-anchor="start">2번이 드러나 2-3 결합이 먼저 생긴다</text><text class="ink sm" x="372" y="364" text-anchor="start">→ 종결 머리핀이 못 생겨 계속 간다</text><text class="ink2 sm" x="350" y="392" text-anchor="middle">두 층은 서로 독립이다. 한쪽을 망가뜨려도 다른 쪽은 그대로 작동한다</text>
</svg>