<text class="ink bold" x="20" y="30" text-anchor="start">무엇으로 보면 무엇이 보이는가</text><text class="ink2 sm" x="20" y="50" text-anchor="start">막대는 그 수단으로 ‘둘로 구별할 수 있는’ 범위다. 막대 왼쪽 끝이 그 수단의 분해능이다</text><path d="M110 250 L634 250" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 250 L120 258" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="120" y="274" text-anchor="middle">0.1 nm</text><path d="M191.43 250 L191.43 258" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="191.43" y="274" text-anchor="middle">1 nm</text><path d="M262.86 250 L262.86 258" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="262.86" y="274" text-anchor="middle">10 nm</text><path d="M334.29 250 L334.29 258" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="334.29" y="274" text-anchor="middle">100 nm</text><path d="M405.71 250 L405.71 258" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="405.71" y="274" text-anchor="middle">1 μm</text><path d="M477.14 250 L477.14 258" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="477.14" y="274" text-anchor="middle">10 μm</text><path d="M548.57 250 L548.57 258" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="548.57" y="274" text-anchor="middle">100 μm</text><path d="M620 250 L620 258" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="620" y="274" text-anchor="middle">1 mm</text><rect x="548.57" y="83" width="71.43" height="18" rx="4" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.2"/><text class="ink sm" x="104" y="97" text-anchor="end">맨눈</text><path d="M548.57 79 L548.57 246" fill="none" stroke="var(--s3)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="355.79" y="117" width="264.21" height="18" rx="4" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="104" y="131" text-anchor="end">광학현미경</text><path d="M355.79 113 L355.79 246" fill="none" stroke="var(--s1)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="284.36" y="151" width="335.64" height="18" rx="4" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><text class="ink sm" x="104" y="165" text-anchor="end">초해상 형광</text><path d="M284.36 147 L284.36 246" fill="none" stroke="var(--s2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="120" y="185" width="500" height="18" rx="4" fill="var(--ink2)" fill-opacity="0.22" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="104" y="199" text-anchor="end">전자현미경</text><path d="M120 181 L120 246" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="120" cy="246" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M120 242 L120 244" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="120" y="238" text-anchor="middle">원자</text><circle cx="212.93" cy="246" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M212.93 222 L212.93 244" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="212.93" y="218" text-anchor="middle">DNA 굵기</text><circle cx="291.28" cy="246" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M291.28 242 L291.28 244" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="291.28" y="238" text-anchor="middle">리보솜</text><circle cx="334.29" cy="246" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M334.29 222 L334.29 244" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="334.29" y="218" text-anchor="middle">바이러스</text><circle cx="384.21" cy="246" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M384.21 242 L384.21 244" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="384.21" y="238" text-anchor="middle">세균</text><circle cx="498.64" cy="246" r="3.2" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M498.64 222 L498.64 244" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="498.64" y="218" text-anchor="middle">사람 세포</text><text class="ink2 sm" x="664" y="306" text-anchor="end">리보솜은 광학현미경 막대 바깥에 있다. 형광으로 ‘점’은 보여도 개수는 셀 수 없다</text>
</svg>