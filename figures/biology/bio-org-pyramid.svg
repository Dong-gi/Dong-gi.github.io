<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 336" width="700" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">에너지 피라미드와 뒤집힌 생물량 피라미드</title><desc id="d">영양단계마다 10분의 1 만 남으므로 에너지 피라미드는 뒤집힐 수 없다. 반면 회전이 빠른 생산자는 적은 현존량으로 큰 생산량을 내므로 생물량 피라미드는 뒤집힐 수 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="30" y="246" width="200" height="30" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.4"/><path d="M232 261 L246 261" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="250" y="265" text-anchor="start">생산자 1.0 × 10⁴</text><rect x="120" y="212" width="20" height="30" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.4"/><path d="M142 227 L246 227" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="250" y="231" text-anchor="start">1차 소비자 1.0 × 10³</text><rect x="129" y="178" width="2" height="30" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.4"/><path d="M133 193 L246 193" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="250" y="197" text-anchor="start">2차 소비자 1.0 × 10²</text><rect x="129.2" y="144" width="1.6" height="30" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.4"/><path d="M132.8 159 L246 159" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="250" y="163" text-anchor="start">3차 소비자 1.0 × 10¹</text><text class="ink bold sm" x="130" y="66" text-anchor="middle">에너지 피라미드</text><text class="ink2 sm" x="130" y="84" text-anchor="middle">단위 kJ/(m² · yr)</text><text class="ink2 sm" x="130" y="102" text-anchor="middle">뒤집힐 수 없다</text><path d="M460 276 L480 276 L480 246 L460 246 Z" fill="var(--s3)" fill-opacity="0.25" stroke="var(--s3)" stroke-width="1.4"/><path d="M420 242 L520 242 L520 212 L420 212 Z" fill="var(--s3)" fill-opacity="0.25" stroke="var(--s3)" stroke-width="1.4"/><text class="ink2 sm" x="470" y="265" text-anchor="middle">식물플랑크톤 4</text><text class="ink2 sm" x="470" y="231" text-anchor="middle">동물플랑크톤 20</text><path d="M562 276 L662 276 L662 246 L562 246 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.4"/><path d="M602 242 L622 242 L622 212 L602 212 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.4"/><text class="ink2 sm" x="612" y="265" text-anchor="middle">400</text><text class="ink2 sm" x="612" y="231" text-anchor="middle">80</text><text class="ink bold sm" x="470" y="194" text-anchor="middle">생물량 g/m²</text><text class="ink2 sm" x="470" y="210" text-anchor="middle">(뒤집혀 있다)</text><text class="ink bold sm" x="612" y="194" text-anchor="middle">생산량 g/(m² · yr)</text><text class="ink2 sm" x="612" y="210" text-anchor="middle">(정상이다)</text><text class="ink bold sm" x="540" y="130" text-anchor="middle">같은 바다에서 잰 두 피라미드</text><text class="ink2 sm" x="540" y="150" text-anchor="middle">재는 대상이 다르다.</text><text class="ink2 sm" x="540" y="166" text-anchor="middle">하나는 순간의 재고, 하나는 시간당 흐름이다</text><text class="ink2 sm" x="30" y="26" text-anchor="start">왼쪽은 값에 비례해 그렸다. 위의 두 칸이 선처럼 얇은 것이 이 그림의 요점이다</text><text class="ink sm" x="30" y="306" text-anchor="start">열역학이 제약하는 것은 흐름이다. 생물량이 뒤집혀도 생산량이 뒤집히지 않으면 모순이 없다</text><text class="ink2 sm" x="30" y="324" text-anchor="start">식물플랑크톤은 나흘이 못 되어 몸 전체가 교체된다. 적은 재고로 큰 흐름을 낸다</text>
</svg>