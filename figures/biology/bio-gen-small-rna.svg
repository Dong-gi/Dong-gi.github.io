.5 156" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="518" cy="202" rx="68" ry="17" fill="var(--s3)" fill-opacity="0.3" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="518" y="207" text-anchor="middle">단백질 복합체</text><text class="ink sm" x="518" y="240" text-anchor="middle">표적을 잘라 버린다</text><text class="ink2 sm" x="30" y="282" text-anchor="start">맞는 자리가 짧다는 것이 miRNA 의 힘이자 문제다. 한 miRNA 가 수백 개의 mRNA 를 건드릴 수 있는 대신,</text><text class="ink2 sm" x="30" y="304" text-anchor="start">아무 기능이 없어도 우연히 맞는 자리가 유전체 안에 아주 많이 생긴다</text>
