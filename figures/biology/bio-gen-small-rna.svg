<text class="ink bold" x="345" y="26" text-anchor="middle">짧은 RNA 가 표적을 고르고, 얼마나 잘 맞는지가 결과를 정한다</text><rect x="16" y="50" width="322" height="204" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="177" y="69" text-anchor="middle">miRNA</text><text class="ink2 sm" x="177" y="85" text-anchor="middle">부분적으로만 맞는다</text><path d="M42 148 L318 148" fill="none" stroke="var(--ink2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="126" width="240" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="180" y="118" text-anchor="middle">mRNA 의 3′ 쪽 구간</text><rect x="60" y="156" width="240" height="22" rx="3" fill="var(--s2)" fill-opacity="0.28" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold sm" x="180" y="171" text-anchor="middle">앞쪽 일곱 글자만 맞는다</text><path d="M67.5 148 L67.5 156" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M82.5 148 L82.5 156" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M97.5 148 L97.5 156" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M112.5 148 L112.5 156" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M127.5 148 L127.5 156" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M142.5 148 L142.5 156" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M157.5 148 L157.5 156" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M172.5 148 L172.5 156" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M187.5 148 L187.5 156" fill="none" stroke="var(--grid)" str