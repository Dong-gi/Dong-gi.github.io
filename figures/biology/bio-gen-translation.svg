<text class="ink bold" x="345" y="26" text-anchor="middle">번역 — 리보솜은 코돈을 세 칸짜리 창으로 훑는다</text><path d="M56 246 L460 246" fill="none" stroke="var(--ink2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="96" y="231" width="50" height="30" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold" x="121" y="251" text-anchor="middle">AUG</text><rect x="150" y="231" width="50" height="30" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold" x="175" y="251" text-anchor="middle">GCA</text><rect x="204" y="231" width="50" height="30" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold" x="229" y="251" text-anchor="middle">UUC</text><rect x="258" y="231" width="50" height="30" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold" x="283" y="251" text-anchor="middle">GAU</text><rect x="312" y="231" width="50" height="30" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold" x="337" y="251" text-anchor="middle">AAG</text><rect x="366" y="231" width="50" height="30" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="1"/><text class="ink bold" x="391" y="251" text-anchor="middle">UGA</text><text class="ink bold" x="50" y="251" text-anchor="end">5′</text><text class="ink bold" x="466" y="251" text-anchor="start">3′</text><text class="ink2 sm" x="466" y="270" text-anchor="start">mRNA</text><rect x="144" y="148" width="166" height="84" rx="14" fill="var(--ink2)" fill-opacity="0.12" stroke="var(--ink2)" stroke-width="1.4"/><rect x="152" y="156" width="46" height="68" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="175" y="170" text-anchor="middle">E 자리</text><rect x="202" y="156" width="46" height="68" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="225" y="170" text-anchor="middle">P 자리</text><rect x="252" y="156" width="46" height="68" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="275" y="170" text-anchor="middle">A 자리</text><text class="ink bold" x="302" y="138" text-anchor="end">리보솜</text><path d="M160 192 L194 192 L186 224 L168 224 Z" fill="var(--s3)" fill-opacity="0.38" stroke="none" stroke-width="1"/><text class="ink sm" x="177" y="216" text-anchor="middle">CGU</text><path d="M210 192 L244 192 L236 224 L218 224 Z" fill="var(--s3)" fill-opacity="0.38" stroke="none" stroke-width="1"/><text class="ink sm" x="227" y="216" text-anchor="middle">AAG</text><circle cx="172" cy="126" r="8" fill="var(--s1)" fill-opacity="0.75" stroke="var(--ink2)" stroke-width="1"/><circle cx="188" cy="121" r="8" fill="var(--s1)" fill-opacity="0.75" stroke="var(--ink2)" stroke-width="1"/><circle cx="204" cy="116" r="8" fill="var(--s1)" fill-opacity="0.75" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="228" y="114" text-anchor="start">만들어지고 있는 펩타이드</text><text class="ink2 sm" x="40" y="292" text-anchor="start">① A 자리에 코돈과 맞는 tRNA 가 들어온다</text><text class="ink2 sm" x="40" y="310" text-anchor="start">② P 자리의 사슬이 A 자리 아미노산에 이어진다</text><text class="ink2 sm" x="40" y="328" text-anchor="start">③ 리보솜이 코돈 하나만큼 움직인다</text><text class="ink2 sm" x="420" y="292" text-anchor="start">tRNA 의 세 글자(안티코돈)가 코돈과</text><text class="ink2 sm" x="420" y="310" text-anchor="start">상보적으로 짝지어 어느 아미노산인지를</text><text class="ink2 sm" x="420" y="328" text-anchor="start">정한다 (안티코돈은 3′→5′ 로 적었다)</text>
