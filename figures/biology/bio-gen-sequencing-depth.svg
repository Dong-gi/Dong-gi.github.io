<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 342" width="690" height="342" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">시퀀싱 깊이와 빈 자리</title><desc id="d">짧은 읽기가 겹쳐 쌓이면서 각 위치의 깊이가 정해진다</desc>
<style>
