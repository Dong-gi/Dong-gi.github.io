<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">DNA 메틸화가 복제를 건너 유지되는 방식</title><desc id="d">CpG 의 대칭성 덕분에 반쪽만 메틸화된 상태에서 원래 표지를 복원할 수 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="350" y="26" text-anchor="middle">CpG 가 대칭이기 때문에 메틸 표지가 복사된다</text><text class="ink bold sm" x="116" y="84" text-anchor="middle">복제 전</text><rect x="50" y="120" width="132" height="26" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.1"/><rect x="50" y="154" width="132" height="26" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="116" y="138" text-anchor="middle">5′- C G -3′</text><text class="ink bold sm" x="116" y="172" text-anchor="middle">3′- G C -5′</text><circle cx="100" cy="110" r="8" fill="var(--s3)" fill-opacity="0.8" stroke="var(--ink2)" stroke-width="1"/><circle cx="132" cy="190" r="8" fill="var(--s3)" fill-opacity="0.8" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="116" y="220" text-anchor="middle">양쪽 가닥에 표지</text><text class="ink bold sm" x="350" y="84" text-anchor="middle">복제 직후</text><rect x="284" y="120" width="132" height="26" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.1"/><rect x="284" y="154" width="132" height="26" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="350" y="138" text-anchor="middle">5′- C G -3′</text><text class="ink bold sm" x="350" y="172" text-anchor="middle">3′- G C -5′</text><circle cx="334" cy="110" r="8" fill="var(--s3)" fill-opacity="0.8" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="350" y="220" text-anchor="middle">새 가닥에는 없다</text><text class="ink bold sm" x="584" y="84" text-anchor="middle">유지 효소가 일한 뒤</text><rect x="518" y="120" width="132" height="26" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.1"/><rect x="518" y="154" width="132" height="26" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink bold sm" x="584" y="138" text-anchor="middle">5′- C G -3′</text><text class="ink bold sm" x="584" y="172" text-anchor="middle">3′- G C -5′</text><circle cx="568" cy="110" r="8" fill="var(--s3)" fill-opacity="0.8" stroke="var(--ink2)" stroke-width="1"/><circle cx="600" cy="190" r="8" fill="var(--s3)" fill-opacity="0.8" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="584" y="220" text-anchor="middle">한쪽만 붙은 것을 알아보고 채운다</text><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M196 150 L274 150"/><text class="ink2 sm" x="235" y="140" text-anchor="middle">복제</text><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M430 150 L508 150"/><text class="ink2 sm" x="469" y="140" text-anchor="middle">유지 효소</text><circle cx="40" cy="292" r="8" fill="var(--s3)" fill-opacity="0.8" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="56" y="296" text-anchor="start">메틸기</text><text class="ink2 sm" x="126" y="296" text-anchor="start">CpG 는 반대 가닥에서도 CpG 다. 그래서 한쪽만 남아 있어도 어디에 표지가 있었는지 알 수 있다.</text><text class="ink2 sm" x="126" y="318" text-anchor="start">이 대칭성 하나가 발현 상태를 세포분열 너머로 전달하는 장치다</text>
</svg>