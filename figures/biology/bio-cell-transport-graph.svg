<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 336" width="690" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">수송 속도와 농도</title><desc id="d">단순 확산의 직선과 수송체를 쓰는 수송의 포화 곡선</desc>
<style>
