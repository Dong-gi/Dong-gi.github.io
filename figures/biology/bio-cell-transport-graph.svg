 136.27 L275.8 136 L278.27 135.73 L280.73 135.47 L283.2 135.22 L285.67 134.96 L288.13 134.72 L290.6 134.48 L293.07 134.24 L295.53 134.01 L298 133.78 L300.47 133.55 L302.93 133.33 L305.4 133.12 L307.87 132.9 L310.33 132.7 L312.8 132.49 L315.27 132.29 L317.73 132.09 L320.2 131.9 L322.67 131.71 L325.13 131.52 L327.6 131.33 L330.07 131.15 L332.53 130.97 L335 130.8 L337.47 130.62 L339.93 130.45 L342.4 130.29 L344.87 130.12 L347.33 129.96 L349.8 129.8 L352.27 129.64 L354.73 129.49 L357.2 129.33 L359.67 129.18 L362.13 129.03 L364.6 128.89 L367.07 128.75 L369.53 128.6 L372 128.46"/><path class="cv s1" stroke-dasharray="4 4" d="M76 109.33 L372 109.33"/><text class="ink sm" x="338" y="101.33" text-anchor="start">천장</text><text class="ink sm" x="309.4" y="135.6" text-anchor="start">단순 확산</text><text class="ink sm" x="140.4" y="155.73" text-anchor="start">수송체를 쓰는 수송</text><text class="ink bold sm" x="410" y="84" text-anchor="start">직선이면</text><text class="ink2 sm" x="410" y="104" text-anchor="start">결합할 자리가 없다는 뜻이다.</text><text class="ink2 sm" x="410" y="122" text-anchor="start">지질 이중층을 그냥 통과한다.</text><text class="ink2 sm" x="410" y="140" text-anchor="start">→ 단순 확산</text><text class="ink bold sm" x="410" y="174" text-anchor="start">천장이 있으면</text><text class="ink2 sm" x="410" y="194" text-anchor="start">결합할 자리의 수가 정해져 있다.</text><text class="ink2 sm" x="410" y="212" text-anchor="start">즉 단백질이 관여한다.</text><text class="ink2 sm" x="410" y="230" text-anchor="start">→ 촉진 확산이거나 능동 수송</text><text class="ink2 sm" x="20" y="304" text-anchor="start">천장이 보인 뒤 둘을 더 가르려면 물음을 하나 더 던진다. 농도가 낮은 쪽으로만 가는가, 높은 쪽으로도 밀어 올리는가.</text><text class="ink2 sm" x="20" y="326" text-anchor="start">밀어 올린다면 에너지를 쓰고 있다는 뜻이므로 능동 수송이다. 이 곡선은 4장의 효소 포화 곡선과 모양이 같다.</text>
</svg>