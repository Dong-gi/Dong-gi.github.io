<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 368" width="690" height="368" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">다인자 유전에서 계급이 늘어나는 모습</title><desc id="d">유전자좌가 늘수록 표현형 계급이 촘촘해지고 극단값이 드물어진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="345" y="26" text-anchor="middle">효과가 더해지는 유전자좌가 늘어나면 어떻게 되는가</text><rect x="16" y="46" width="216" height="284" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="124" y="65" text-anchor="middle">유전자좌 1개</text><text class="ink2 sm" x="124" y="81" text-anchor="middle">계급 3가지</text><rect x="51.67" y="184" width="30" height="76" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="66.67" y="276" text-anchor="middle">0</text><rect x="109" y="108" width="30" height="152" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="124" y="276" text-anchor="middle">1</text><rect x="166.33" y="184" width="30" height="76" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="181.33" y="276" text-anchor="middle">2</text><path d="M32 260 L216 260" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="124" y="296" text-anchor="middle">표현형을 키우는 대립유전자 수</text><text class="ink sm" x="124" y="316" text-anchor="middle">양 끝 계급의 비율 = 1/4</text><rect x="238" y="46" width="216" height="284" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="346" y="65" text-anchor="middle">유전자좌 2개</text><text class="ink2 sm" x="346" y="81" text-anchor="middle">계급 5가지</text><rect x="263.78" y="241" width="26.83" height="19" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="277.2" y="276" text-anchor="middle">0</text><rect x="298.18" y="184" width="26.83" height="76" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="311.6" y="276" text-anchor="middle">1</text><rect x="332.58" y="146" width="26.83" height="114" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="346" y="276" text-anchor="middle">2</text><rect x="366.98" y="184" width="26.83" height="76" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="380.4" y="276" text-anchor="middle">3</text><rect x="401.38" y="241" width="26.83" height="19" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="414.8" y="276" text-anchor="middle">4</text><path d="M254 260 L438 260" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="346" y="296" text-anchor="middle">표현형을 키우는 대립유전자 수</text><text class="ink sm" x="346" y="316" text-anchor="middle">양 끝 계급의 비율 = 1/16</text><rect x="460" y="46" width="216" height="284" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="568" y="65" text-anchor="middle">유전자좌 3개</text><text class="ink2 sm" x="568" y="81" text-anchor="middle">계급 7가지</text><rect x="484.7" y="255.25" width="19.17" height="4.75" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="494.29" y="276" text-anchor="middle">0</text><rect x="509.27" y="231.5" width="19.17" height="28.5" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="518.86" y="276" text-anchor="middle">1</text><rect x="533.85" y="188.75" width="19.17" height="71.25" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="543.43" y="276" text-anchor="middle">2</text><rect x="558.42" y="165" width="19.17" height="95" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="568" y="276" text-anchor="middle">3</text><rect x="582.99" y="188.75" width="19.17" height="71.25" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="592.57" y="276" text-anchor="middle">4</text><rect x="607.56" y="231.5" width="19.17" height="28.5" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="617.14" y="276" text-anchor="middle">5</text><rect x="632.13" y="255.25" width="19.17" height="4.75" rx="2" fill="var(--s1)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1"/><text class="ink2 sm" x="641.71" y="276" text-anchor="middle">6</text><path d="M476 260 L660 260" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.29 255.25 L518.86 231.5 L543.43 188.75 L568 165 L592.57 188.75 L617.14 231.5 L641.71 255.25" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 sm" x="568" y="296" text-anchor="middle">표현형을 키우는 대립유전자 수</text><text class="ink sm" x="568" y="316" text-anchor="middle">양 끝 계급의 비율 = 1/64</text><text class="ink2 sm" x="345" y="358" text-anchor="middle">계급이 촘촘해지고 양 끝이 드물어진다. 여기에 환경 차이가 더해지면 경계가 뭉개져 연속 분포로 보인다</text>
</svg>