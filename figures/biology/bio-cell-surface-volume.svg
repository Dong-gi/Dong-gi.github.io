<text class="ink bold" x="20" y="30" text-anchor="start">세포가 무한히 커질 수 없는 이유</text><path class="gr" d="M70 250 V60"/><path class="gr" d="M116.67 250 V60"/><path class="gr" d="M163.33 250 V60"/><path class="gr" d="M210 250 V60"/><path class="gr" d="M256.67 250 V60"/><path class="gr" d="M303.33 250 V60"/><path class="gr" d="M350 250 V60"/><path class="gr" d="M70 250 H350"/><path class="gr" d="M70 194.12 H350"/><path class="gr" d="M70 138.24 H350"/><path class="gr" d="M70 82.35 H350"/><path class="ax" marker-end="url(#ark)" d="M70 250 H360"/><path class="ax" marker-end="url(#ark)" d="M70 250 V50"/><text class="sm ink2" x="116.67" y="265" text-anchor="middle">2</text><text class="sm ink2" x="163.33" y="265" text-anchor="middle">4</text><text class="sm ink2" x="210" y="265" text-anchor="middle">6</text><text class="sm ink2" x="256.67" y="265" text-anchor="middle">8</text><text class="sm ink2" x="303.33" y="265" text-anchor="middle">10</text><text class="sm ink2" x="350" y="265" text-anchor="middle">12</text><text class="sm ink2" x="64" y="198.12" text-anchor="end">1</text><text class="sm ink2" x="64" y="142.24" text-anchor="end">2</text><text class="sm ink2" x="64" y="86.35" text-anchor="end">3</text><text class="sm ink2" x="364" y="254">r (μm)</text><text class="sm ink2" x="62" y="52" text-anchor="end">S/V (1/μm)</text><path class="cv s1" d="M91 63.73 L93.16 81.09 L95.32 95.49 L97.47 107.62 L99.63 117.99 L101.79 126.96 L103.95 134.78 L106.11 141.67 L108.27 147.78 L110.43 153.23 L112.58 158.14 L114.74 162.57 L116.9 166.59 L119.06 170.26 L121.22 173.62 L123.38 176.71 L125.53 179.56 L127.69 182.2 L129.85 184.64 L132.01 186.92 L134.17 189.04 L136.32 191.02 L138.48 192.88 L140.64 194.63 L142.8 196.27 L144.96 197.81 L147.12 199.27 L149.28 200.66 L151.43 201.96 L153.59 203.2 L155.75 204.38 L157.91 205.5 L160.07 206.57 L162.23 207.58 L164.38 208.55 L166.54 209.48 L168.7 210.37 L170.86 211.22 L173.02 212.03 L175.18 212.81 L177.33 213.55 L179.49 214.27 L181.65 214.96 L183.81 215.6