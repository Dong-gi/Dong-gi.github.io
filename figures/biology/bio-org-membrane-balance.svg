<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 384" width="700" height="384" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">평형전위는 두 힘이 균형을 이루는 지점이다</title><desc id="d">농도차가 칼륨을 밖으로 밀고, 밖으로 나간 양전하가 남긴 안쪽 음전하가 다시 안으로 당긴다. 두 힘이 같아지는 막전위가 평형전위다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="16" y="56" width="208" height="196" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="120" y="44" text-anchor="middle">1. 처음</text><path d="M116 74 L116 146" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M116 196 L116 238" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 74 L124 146" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 196 L124 238" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="106" y="70" text-anchor="end">밖</text><text class="ink2 sm" x="134" y="70" text-anchor="start">안</text><text class="ink sm" x="106" y="90" text-anchor="end">K⁺ 5</text><text class="ink sm" x="134" y="90" text-anchor="start">K⁺ 140</text><rect x="246" y="56" width="208" height="196" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="350" y="44" text-anchor="middle">2. K⁺ 이 조금 나간 뒤</text><path d="M346 74 L346 146" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M346 196 L346 238" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M354 74 L354 146" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M354 196 L354 238" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="336" y="70" text-anchor="end">밖</text><text class="ink2 sm" x="364" y="70" text-anchor="start">안</text><text class="ink sm" x="336" y="90" text-anchor="end">K⁺ 5</text><text class="ink sm" x="364" y="90" text-anchor="start">K⁺ 140</text><rect x="476" y="56" width="208" height="196" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="580" y="44" text-anchor="middle">3. 균형</text><path d="M576 74 L576 146" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M576 196 L576 238" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 74 L584 146" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 196 L584 238" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="566" y="70" text-anchor="end">밖</text><text class="ink2 sm" x="594" y="70" text-anchor="start">안</text><text class="ink sm" x="566" y="90" text-anchor="end">K⁺ 5</text><text class="ink sm" x="594" y="90" text-anchor="start">K⁺ 140</text><path fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1)" d="M172 170 L68 170"/><text class="ink2 sm" x="106" y="226" text-anchor="end">K⁺ 누출 통로</text><text class="ink bold sm" x="120" y="268" text-anchor="middle">막전위 0 mV</text><text class="ink2 sm" x="120" y="290" text-anchor="middle">농도차가 K⁺ 을 밖으로 민다</text><text class="ink2" x="362" y="116" text-anchor="start">−</text><text class="ink2" x="338" y="116" text-anchor="end">+</text><text class="ink2" x="362" y="140" text-anchor="start">−</text><text class="ink2" x="338" y="140" text-anchor="end">+</text><text class="ink2" x="362" y="208" text-anchor="start">−</text><text class="ink2" x="338" y="208" text-anchor="end">+</text><text class="ink2" x="362" y="232" text-anchor="start">−</text><text class="ink2" x="338" y="232" text-anchor="end">+</text><path fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1)" d="M402 162 L298 162"/><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M316 186 L384 186"/><text class="ink bold sm" x="350" y="268" text-anchor="middle">막전위 −40 mV</text><text class="ink2 sm" x="350" y="290" text-anchor="middle">나간 만큼 안쪽에 음전하가 쌓이고</text><text class="ink2 sm" x="350" y="306" text-anchor="middle">전기력이 도로 당기기 시작한다</text><text class="ink2" x="592" y="106" text-anchor="start">−</text><text class="ink2" x="568" y="106" text-anchor="end">+</text><text class="ink2" x="592" y="128" text-anchor="start">−</text><text class="ink2" x="568" y="128" text-anchor="end">+</text><text class="ink2" x="592" y="150" text-anchor="start">−</text><text class="ink2" x="568" y="150" text-anchor="end">+</text><text class="ink2" x="592" y="200" text-anchor="start">−</text><text class="ink2" x="568" y="200" text-anchor="end">+</text><text class="ink2" x="592" y="222" text-anchor="start">−</text><text class="ink2" x="568" y="222" text-anchor="end">+</text><text class="ink2" x="592" y="244" text-anchor="start">−</text><text class="ink2" x="568" y="244" text-anchor="end">+</text><path fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1)" d="M632 162 L528 162"/><path fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" marker-end="url(#ar2)" d="M528 186 L632 186"/><text class="ink bold sm" x="580" y="268" text-anchor="middle">막전위 = E<tspan baseline-shift="-22%" font-size="76%">K</tspan> = −89 mV</text><text class="ink2 sm" x="580" y="290" text-anchor="middle">두 힘의 크기가 같아져</text><text class="ink2 sm" x="580" y="306" text-anchor="middle">순 이동이 멈춘다</text><rect x="16" y="324" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="36" y="330">농도차가 미는 힘</text><rect x="200" y="324" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="220" y="330">전기력이 당기는 힘</text><text class="ink2 sm" x="16" y="26" text-anchor="start">가로로 놓인 셋은 시간 순서다. 농도는 적어 둔 값(mmol/L)에서 사실상 변하지 않는다</text><text class="ink sm" x="16" y="356" text-anchor="start">평형전위란 ‘농도차가 미는 힘과 전기력이 정확히 상쇄되는 막전위’다. 네른스트 식은 그 값을 준다</text><text class="ink2 sm" x="16" y="374" text-anchor="start">실제로 이동한 K⁺ 은 안쪽 총량의 십만 분의 일 수준이다. 그래서 농도는 그대로이고 전위만 바뀐다</text>
</svg>