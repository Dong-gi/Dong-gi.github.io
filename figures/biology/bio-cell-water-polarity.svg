<text class="ink bold" x="20" y="30" text-anchor="start">물 분자는 한쪽으로 치우친 자석이다</text><rect x="30" y="52" width="250" height="236" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="155" y="72" text-anchor="middle">분자 하나</text><text class="ink2 sm" x="155" y="89" text-anchor="middle">결합각 약 104.5°</text><path d="M155 158 L103 202" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M155 158 L207 202" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="155" cy="158" r="26" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="155" y="163" text-anchor="middle">O</text><circle cx="103" cy="202" r="16" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="103" y="207" text-anchor="middle">H</text><circle cx="207" cy="202" r="16" fill="var(--s2)" fill-opacity="0.28" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="207" y="207" text-anchor="middle">H</text><text class="ink sm" x="155" y="122" text-anchor="middle">δ⁻ 전자가 몰린 쪽</text><text class="ink sm" x="97" y="236" text-anchor="middle">δ⁺</text><text class="ink sm" x="213" y="236" text-anchor="middle">δ⁺</text><text class="ink2 sm" x="155" y="268" text-anchor="middle">산소가 전자를 더 세게 당긴다</text><rect x="300" y="52" width="330" height="236" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="465" y="72" text-anchor="middle">분자 여럿</text><text class="ink2 sm" x="465" y="89" text-anchor="middle">점선이 수소 결합</text><path d="M465 130 L439 152" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 130 L491 152" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="465" cy="130" r="14" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="465" y="134" text-anchor="middle">O</text><circle cx="439" cy="152" r="9" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><circle cx="491" cy="152" r="9" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><path d="M378 200 L369.32 232.93" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M378 200 L411.92 203.11" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="378" cy="200" r="14" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="378" y="204" text-anchor="middle">O</text><circle cx="369.32" cy="232.93" r="9" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><circle cx="411.92" cy="203.11" r="9" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><path d="M552 200 L518.08 203.11" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M552 200 L560.68 232.93" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="552" cy="200" r="14" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="552" y="204" text-anchor="middle">O</text><circle cx="518.08" cy="203.11" r="9" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><circle cx="560.68" cy="232.93" r="9" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><path d="M465 246 L491 224" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 246 L439 224" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="465" cy="246" r="14" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="465" y="250" text-anchor="middle">O</text><circle cx="491" cy="224" r="9" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><circle cx="439" cy="224" r="9" fill="var(--s2)" fill-opacity="0.26" stroke="var(--s2)" stroke-width="1.4"/><path d="M441 150 L404 182" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M489 150 L526 182" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M398 218 L443 240" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M532 218 L487 240" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="465" y="100" text-anchor="middle">한 분자가 최대 4개까지 붙잡는다</text><text class="ink2 sm" x="20" y="308" text-anchor="start">수소 결합 하나는 약 20 kJ/mol 로 공유 결합(약 400 kJ/mol)의 20분의 1이다. 약한 대신 수가 많고 끊임없이 다시 붙는다.</text>
