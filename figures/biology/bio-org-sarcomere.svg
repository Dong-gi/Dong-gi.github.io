<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 328" width="700" height="328" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">활주설과 길이-장력 곡선</title><desc id="d">필라멘트의 길이는 변하지 않고 겹치는 정도만 변한다. 겹침이 최대인 중간 길이에서 장력이 가장 크다</desc>
