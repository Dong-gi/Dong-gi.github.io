e-linejoin="round"/><path d="M191 193 L196 186" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M191 199 L196 206" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M206 193 L211 186" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M206 199 L211 206" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M221 193 L226 186" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M221 199 L226 206" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 183 L156 183" fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M246 183 L136 183" fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 209 L156 209" fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M246 209 L136 209" fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="46" y="76" text-anchor="start">A. 이완 — 근절 2.2 µm</text><text class="ink bold sm" x="46" y="166" text-anchor="start">B. 수축 — 근절 1.8 µm</text><text class="ink2 sm" x="340" y="111" text-anchor="start">겹침이 좁다</text><text class="ink2 sm" x="260" y="201" text-anchor="start">겹침이 넓다</text><rect x="40" y="242" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="60" y="248">액틴 (가는 필라멘트)</text><rect x="206" y="242" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="226" y="248">미오신 (굵은 필라멘트)</text><text class="ink sm" x="40" y="272" text-anchor="start">두 필라멘트의 길이는 A 와 B 에서 똑같다. 변하는 것은 겹치는 정도뿐이다</text><text class="ink2 sm" x="40" y="290" text-anchor="start">근절이 너무