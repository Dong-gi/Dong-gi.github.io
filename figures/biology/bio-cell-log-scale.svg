.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="20" y="30" text-anchor="start">십조 배 차이 나는 값을 한 줄에 적는 법</text><text class="ink2 sm" x="20" y="74" text-anchor="start">농도를 그대로 (mol/L)</text><path d="M90 116 L620 116" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 109 L620 123" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M95.3 109 L95.3 123" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M90.05 109 L90.05 123" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 109 L90 123" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 109 L90 123" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 109 L90 123" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 109 L90 123" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="620" y="140" text-anchor="middle">10⁻¹</text><text class="ink2 sm" x="94" y="140" text-anchor="start">나머지 여섯 눈금이 여기 전부 겹쳐 있다</text><text class="ink2 sm" x="90" y="98" text-anchor="middle">0</text><text class="ink2 sm" x="20" y="190" text-anchor="start">지수만 세면 (= 로그)</text><path d="M90 232 L620 232" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 225 L90 239" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="90" y="216" text-anchor="middle">10⁻¹</text><text class="ink2 sm" x="90" y="258" text-anchor="middle">-1</text><text class="ink2 sm" x="90" y="278" text-anchor="middle">pH 1</text><path d="M178.33 225 L178.33 239" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="178.33" y="216" text-anchor="middle">10⁻³</text><text class="ink2 sm" x="178.33" y="258" text-anchor="middle">-3</text><text class="ink2 sm" x="178.33" y="278" text-anchor="middle">pH 3</text><path d="M266.67 225 L266.67 239" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="266.67" y="216" text-anchor="middle">10⁻⁵</text><text class="ink2 sm" x="266.67" y="258" text-anchor="middle">-5</text><text class="ink2 sm" x="266.67" y="278" text-anchor="middle">pH 5</text><path d="M355 225 L355 239" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="355" y="216" text-anchor="middle">10⁻⁷</text><text class="ink2 sm" x="355" y="258" text-anchor="middle">-7</text><text class="ink2 sm" x="355" y="278" text-anchor="middle">pH 7</text><path d="M443.33 225 L443.33 239" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="443.33" y="216" text-anchor="middle">10⁻⁹</text><text class="ink2 sm" x="443.33" y="258" text-anchor="middle">-9</text><text class="ink2 sm" x="443.33" y="278" text-anchor="middle">pH 9</text><path d="M531.67 225 L531.67 239" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="531.67" y="216" text-anchor="middle">10⁻¹¹</text><text class="ink2 sm" x="531.67" y="258" text-anchor="middle">-11</text><text class="ink2 sm" x="531.67" y="278" text-anchor="middle">pH 11</text><path d="M620 225 L620 239" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="620" y="216" text-anchor="middle">10⁻¹³</text><text class="ink2 sm" x="620" y="258" text-anchor="middle">-13</text><text class="ink2 sm" x="620" y="278" text-anchor="middle">pH 13</text><text class="ink2 sm" x="20" y="258" text-anchor="start">log</text><text class="ink2 sm" x="20" y="278" text-anchor="start">−log</text><text class="ink2 sm" x="664" y="306" text-anchor="end">눈금이 고르게 퍼진다. 한 칸이 10배이므로 ‘몇 배 차이인가’를 뺄셈으로 읽는다</text>
</svg>