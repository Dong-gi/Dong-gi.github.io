<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 402" width="690" height="402" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">제한효소 소화의 전기영동과 절단 지도</title><desc id="d">단일 소화와 이중 소화의 밴드를 견주어 자른 자리를 정한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="345" y="26" text-anchor="middle">전기영동 — 작은 조각일수록 멀리 간다</text><text class="ink2 sm" x="345" y="46" text-anchor="middle">같은 시료를 세 가지로 잘라 밴드를 견주면 자른 자리를 되짚을 수 있다</text><rect x="76" y="78" width="300" height="240" rx="4" fill="var(--ink2)" fill-opacity="0.05" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="118" y="70" text-anchor="middle">크기 표지</text><rect x="94" y="86" width="48" height="8" rx="2" fill="var(--ink2)" fill-opacity="0.2" stroke="none" stroke-width="0"/><rect x="94" y="105.44" width="48" height="8" rx="2" fill="var(--ink2)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text class="ink2 sm" x="88" y="113.44" text-anchor="end">8 kb</text><rect x="94" y="128.5" width="48" height="8" rx="2" fill="var(--ink2)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text class="ink2 sm" x="88" y="136.5" text-anchor="end">6 kb</text><rect x="94" y="143.11" width="48" height="8" rx="2" fill="var(--ink2)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text class="ink2 sm" x="88" y="151.11" text-anchor="end">5 kb</text><rect x="94" y="184.06" width="48" height="8" rx="2" fill="var(--ink2)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text class="ink2 sm" x="88" y="192.06" text-anchor="end">3 kb</text><rect x="94" y="216.56" width="48" height="8" rx="2" fill="var(--ink2)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text class="ink2 sm" x="88" y="224.56" text-anchor="end">2 kb</text><rect x="94" y="272.11" width="48" height="8" rx="2" fill="var(--ink2)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text class="ink2 sm" x="88" y="280.11" text-anchor="end">1 kb</text><text class="ink bold sm" x="198" y="70" text-anchor="middle">효소 A</text><rect x="174" y="86" width="48" height="8" rx="2" fill="var(--ink2)" fill-opacity="0.2" stroke="none" stroke-width="0"/><rect x="174" y="143.11" width="48" height="8" rx="2" fill="var(--s1)" fill-opacity="0.7" stroke="none" stroke-width="0"/><rect x="174" y="184.06" width="48" height="8" rx="2" fill="var(--s1)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text class="ink bold sm" x="270" y="70" text-anchor="middle">효소 B</text><rect x="246" y="86" width="48" height="8" rx="2" fill="var(--ink2)" fill-opacity="0.2" stroke="none" stroke-width="0"/><rect x="246" y="128.5" width="48" height="8" rx="2" fill="var(--s1)" fill-opacity="0.7" stroke="none" stroke-width="0"/><rect x="246" y="216.56" width="48" height="8" rx="2" fill="var(--s1)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text class="ink bold sm" x="342" y="70" text-anchor="middle">A + B</text><rect x="318" y="86" width="48" height="8" rx="2" fill="var(--ink2)" fill-opacity="0.2" stroke="none" stroke-width="0"/><rect x="318" y="143.11" width="48" height="8" rx="2" fill="var(--s1)" fill-opacity="0.7" stroke="none" stroke-width="0"/><rect x="318" y="216.56" width="48" height="8" rx="2" fill="var(--s1)" fill-opacity="0.7" stroke="none" stroke-width="0"/><rect x="318" y="272.11" width="48" height="8" rx="2" fill="var(--s1)" fill-opacity="0.7" stroke="none" stroke-width="0"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M388 108 L388 302"/><text class="ink2 sm" x="396" y="162" text-anchor="start">작을수록</text><text class="ink2 sm" x="396" y="178" text-anchor="start">멀리 간다</text><text class="ink bold" x="470" y="116" text-anchor="start">되짚은 절단 지도</text><text class="ink2 sm" x="470" y="140" text-anchor="start">어느 소화에서도 합이 8.0 kb 다</text><rect x="470" y="204" width="190" height="20" rx="10" fill="var(--ink2)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1.2"/><path d="M517 198 L517 230" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M541 198 L541 230" fill="none" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="517" y="192" text-anchor="middle">B</text><text class="ink bold sm" x="541" y="174" text-anchor="middle">A</text><text class="ink2 sm" x="470" y="248" text-anchor="middle">0</text><text class="ink2 sm" x="517" y="248" text-anchor="middle">2.0</text><text class="ink2 sm" x="541" y="266" text-anchor="middle">3.0</text><text class="ink2 sm" x="660" y="248" text-anchor="middle">8.0 kb</text><text class="ink2 sm" x="470" y="300" text-anchor="start">좌우를 뒤집은 지도도 같은 밴드를 낸다.</text><text class="ink2 sm" x="470" y="318" text-anchor="start">방향은 이 실험만으로 정할 수 없다</text><text class="ink2 sm" x="345" y="390" text-anchor="middle">이동 거리는 크기의 로그에 대체로 비례한다. 그래서 큰 조각끼리는 잘 안 갈리고 작은 조각끼리는 잘 갈린다</text>
</svg>