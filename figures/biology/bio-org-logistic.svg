<title id="t">로지스틱 성장을 증가량으로 읽는다</title><desc id="d">개체 수가 K/2 일 때 한 해의 증가량이 최대가 되고, K 에 닿으면 0 이 된다. 증가량 곡선을 더해 나가면 S 자 곡선이 나온다</desc>
