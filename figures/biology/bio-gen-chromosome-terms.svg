<text class="ink bold" x="350" y="28" text-anchor="middle">세는 규칙 — 동원체 하나가 염색체 하나다</text><text class="ink2 sm" x="350" y="48" text-anchor="middle">복제해도 염색체 수는 늘지 않는다. 늘어나는 것은 염색분체 수와 DNA 양이다</text><rect x="16" y="66" width="216" height="232" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="124" y="85" text-anchor="middle">복제 전 (G1)</text><rect x="242" y="66" width="216" height="232" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="350" y="85" text-anchor="middle">복제 뒤 (S기를 지남)</text><rect x="468" y="66" width="216" height="232" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="576" y="85" text-anchor="middle">상동염색체 한 쌍</text><rect x="69.5" y="124" width="13" height="108" rx="6.5" fill="var(--s1)" fill-opacity="0.9"/><circle cx="76" cy="160.72" r="3.77" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M86 160.7 L118 182" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="122" y="186" text-anchor="start">동원체</text><text class="ink2 sm" x="30" y="254" text-anchor="start">염색분체 1 · 동원체 1</text><text class="ink sm" x="30" y="274" text-anchor="start">염색체 1개 · DNA 1몫</text><rect x="289.1" y="124" width="13" height="108" rx="6.5" fill="var(--s1)" fill-opacity="0.9"/><rect x="309.9" y="124" width="13" height="108" rx="6.5" fill="var(--s1)" fill-opacity="0.9"/><rect x="289.1" y="157.34" width="33.8" height="6.76" fill="var(--s1)" fill-opacity="0.9"/><circle cx="306" cy="160.72" r="3.77" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M286 134 L344 142" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="348" y="146" text-anchor="start">자매염색분체</text><text class="ink2 sm" x="348" y="162" text-anchor="start">(똑같은 복사본)</text><text class="ink2 sm" x="256" y="254" text-anchor="start">염색분체 2 · 동원체 1</text><text class="ink sm" x="256" y="274" text-anchor="start">염색체 1개 · DNA 2몫</text><text class="ink2 sm" x="530" y="114" text-anchor="middle">어머니 유래</text><text class="ink2 sm" x="608" y="114" text-anchor="middle">아버지 유래</text><rect x="513.1" y="138" width="13" height="84" rx="6.5" fill="var(--s1)" fill-opacity="0.9"/><rect x="533.9" y="138" width="13" height="84" rx="6.5" fill="var(--s1)" fill-opacity="0.9"/><rect x="513.1" y="163.18" width="33.8" height="6.76" fill="var(--s1)" fill-opacity="0.9"/><circle cx="530" cy="166.56" r="3.77" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="591.1" y="138" width="13" height="84" rx="6.5" fill="var(--s2)" fill-opacity="0.9"/><rect x="611.9" y="138" width="13" height="84" rx="6.5" fill="var(--s2)" fill-opacity="0.9"/><rect x="591.1" y="163.18" width="33.8" height="6.76" fill="var(--s2)" fill-opacity="0.9"/><circle cx="608" cy="166.56" r="3.77" fill="var(--ink)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="482" y="240" text-anchor="start">염색분체 4 · 동원체 2</text><text class="ink sm" x="482" y="260" text-anchor="start">염색체 2개</text><text class="ink2 sm" x="482" y="280" text-anchor="start">같은 유전자가 같은 순서로</text>
