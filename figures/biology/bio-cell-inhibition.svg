184.95 L387.5 184.9 L390.25 184.84 L393 184.79 L395.75 184.73 L398.5 184.68 L401.25 184.63 L404 184.58"/><path class="cv s1" stroke-dasharray="4 4" d="M74 103.67 L404 103.67"/><path class="cv s3" stroke-dasharray="4 4" d="M74 177.83 L404 177.83"/><text class="ink sm" x="338" y="117.02" text-anchor="start">저해 없음</text><text class="ink sm" x="358" y="145.2" text-anchor="start">경쟁적</text><text class="ink sm" x="346" y="191.18" text-anchor="start">비경쟁적</text><text class="ink bold sm" x="430" y="84" text-anchor="start">경쟁적 (competitive)</text><text class="ink2 sm" x="430" y="104" text-anchor="start">저해제가 기질 자리에 앉는다.</text><text class="ink2 sm" x="430" y="122" text-anchor="start">V max 는 그대로, K M 만 커진다.</text><text class="ink2 sm" x="430" y="140" text-anchor="start">기질을 많이 넣으면 이길 수 있다.</text><text class="ink bold sm" x="430" y="176" text-anchor="start">비경쟁적 (noncompetitive)</text><text class="ink2 sm" x="430" y="196" text-anchor="start">저해제가 다른 자리에 앉아</text><text class="ink2 sm" x="430" y="214" text-anchor="start">효소 모양을 바꾼다.</text><text class="ink2 sm" x="430" y="232" text-anchor="start">V max 가 내려가고 K M 은 그대로.</text><text class="ink2 sm" x="430" y="250" text-anchor="start">기질을 늘려도 이기지 못한다.</text><text class="ink2 sm" x="20" y="314" text-anchor="start">구별하는 물음은 하나다. 기질 농도를 아주 높이면 원래 속도를 되찾는가. 되찾으면 경쟁적, 못 되찾으면 비경쟁적이다.</text>
