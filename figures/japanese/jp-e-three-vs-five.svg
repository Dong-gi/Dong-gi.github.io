<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 342" width="760" height="342" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">세 갈래와 다섯 갈래가 갈리는 자리</title><desc id="d">다섯으로 나눈 쪽은 겸양어를 둘로 가르고, 높임이 아닌 접두사를 따로 세워 이름을 준다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">이 문서가 쓰는 세 갈래와 2007년 답신의 다섯 갈래를 나란히 놓았다</text><text class="ink2 sm" x="40" y="58" text-anchor="start">세 갈래</text><text class="ink2 sm" x="430" y="58" text-anchor="start">다섯 갈래</text><rect x="40" y="70" width="170" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="125" y="94" text-anchor="middle">정중어</text><path fill="none" stroke="var(--s3)" stroke-width="1.4" d="M216 90 L424 90"/><rect x="430" y="70" width="150" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="505" y="94" text-anchor="middle">정중어</text><text class="ink2 sm" x="600" y="94" text-anchor="start">です・ます</text><rect x="40" y="130" width="170" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="125" y="154" text-anchor="middle">존경어</text><path fill="none" stroke="var(--s1)" stroke-width="1.4" d="M216 150 L424 150"/><rect x="430" y="130" width="150" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="505" y="154" text-anchor="middle">존경어</text><text class="ink2 sm" x="600" y="154" text-anchor="start">いらっしゃる</text><rect x="40" y="190" width="170" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="125" y="214" text-anchor="middle">겸양어</text><path fill="none" stroke="var(--s2)" stroke-width="1.4" d="M216 204 L424 190"/><path fill="none" stroke="var(--s2)" stroke-width="1.4" d="M216 216 L424 250"/><rect x="430" y="190" width="150" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="505" y="214" text-anchor="middle">겸양어 I</text><text class="ink2 sm" x="600" y="214" text-anchor="start">もうしあげる</text><rect x="430" y="250" width="150" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="505" y="274" text-anchor="middle">겸양어 II</text><text class="ink2 sm" x="600" y="274" text-anchor="start">もうす</text><rect x="430" y="300" width="150" height="34" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="505" y="321" text-anchor="middle">미화어</text><text class="ink2 sm" x="600" y="322" text-anchor="start">おさけ</text><text class="ink2 sm" x="40" y="300" text-anchor="start">세 갈래에는 이 자리가 없다</text><text class="ink2 sm" x="40" y="322" text-anchor="start">높임이 아니라고 보아 따로 세운 것이다</text><text class="ink" x="40" y="264" text-anchor="start">갈리는 자리는 두 곳뿐이다</text></g>
</svg>