<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" width="760" height="288" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">문장 하나를 절 셋으로 자른 구조도</title><desc id="d">절마다 술어가 하나씩 있고, 절이 끝나는 자리에 잇는 말이 놓여 앞 절과 뒤 절의 관계를 적는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="46" y="30" text-anchor="start">실제 글의 문장은 절이 여럿이다. 잘라서 읽는다</text><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="5 4" d="M318 56 V142"/><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="5 4" d="M478 56 V142"/><text class="ink" x="46" y="80" text-anchor="start" style="font-size:16px">ほんはにしゅうかん</text><text class="f2" x="190" y="80" text-anchor="start" style="font-size:16px">かりられます</text><text class="f1" x="286" y="80" text-anchor="start" style="font-size:16px;font-weight:600">が、</text><text class="ink" x="318" y="80" text-anchor="start" style="font-size:16px">かえすひを</text><text class="f2" x="398" y="80" text-anchor="start" style="font-size:16px">すぎる</text><text class="f1" x="446" y="80" text-anchor="start" style="font-size:16px;font-weight:600">と、</text><text class="ink" x="478" y="80" text-anchor="start" style="font-size:16px">つぎのほんが</text><text class="f2" x="574" y="80" text-anchor="start" style="font-size:16px">かりられません。</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" d="M46 97 V104 H316 V97"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" d="M320 97 V104 H476 V97"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" d="M480 97 V104 H702 V97"/><text class="ink" x="181" y="126" text-anchor="middle">절 1</text><text class="ink" x="398" y="126" text-anchor="middle">절 2</text><text class="ink" x="591" y="126" text-anchor="middle">절 3 — 주절</text><path fill="none" stroke="var(--s1)" stroke-width="1.2" d="M302 134 L302 152"/><path fill="none" stroke="var(--s1)" stroke-width="1.2" d="M462 134 L462 152"/><rect x="266" y="152" width="72" height="28" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="302" y="170" text-anchor="middle">뒤집기</text><rect x="426" y="152" width="72" height="28" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="462" y="170" text-anchor="middle">조건</text><rect x="46" y="200" width="14" height="4" rx="2" class="f2"/><text class="ink2 sm" x="68" y="206" text-anchor="start">절의 술어</text><rect x="160" y="200" width="14" height="4" rx="2" class="f1"/><text class="ink2 sm" x="182" y="206" text-anchor="start">잇는 말</text><text class="ink" x="46" y="240" text-anchor="start">절마다 술어가 하나씩 있다. 문장 전체의 술어는 맨 끝의 것이다</text><text class="ink2 sm" x="46" y="266" text-anchor="start">잇는 말은 앞 절의 술어 뒤에 놓인다. 그 자리가 절의 경계다</text></g>
</svg>