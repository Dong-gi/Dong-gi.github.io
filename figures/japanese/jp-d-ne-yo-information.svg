<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">문장 끝의 두 짧은 말이 갈리는 기준</title><desc id="d">정보가 나에게만 있으면 알려 주는 쪽을, 둘 다 가지고 있으면 함께 확인하는 쪽을 쓴다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">정보가 누구에게 있는가로 갈린다</text><rect x="40" y="60" width="330" height="170" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="f1" x="205" y="84" text-anchor="middle">よ — 알려 준다</text><rect x="70" y="104" width="100" height="44" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="120" y="130" text-anchor="middle">나</text><rect x="240" y="104" width="100" height="44" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="290" y="130" text-anchor="middle">상대</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M172 126 L238 126"/><text class="ink2 sm" x="205" y="174" text-anchor="middle">정보가 내게만 있다</text><text class="ink" x="205" y="198" text-anchor="middle">かぎがおちましたよ</text><rect x="390" y="60" width="330" height="170" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="f3" x="555" y="84" text-anchor="middle">ね — 함께 확인한다</text><rect x="420" y="104" width="100" height="44" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="470" y="130" text-anchor="middle">나</text><rect x="590" y="104" width="100" height="44" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="640" y="130" text-anchor="middle">상대</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M522 120 L588 120"/><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M588 132 L522 132"/><text class="ink2 sm" x="555" y="174" text-anchor="middle">정보를 둘 다 가지고 있다</text><text class="ink" x="555" y="198" text-anchor="middle">きょうはあついですね</text><text class="f2 sm" x="40" y="262" text-anchor="start">자리를 바꿔 쓰면 상대가 아는 것을 가르치는 말이 되거나</text><text class="f2 sm" x="40" y="284" text-anchor="start">상대에게 없는 동의를 요구하는 말이 된다</text></g>
</svg>