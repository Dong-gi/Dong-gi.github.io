<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">안과 바깥을 가르는 선이 듣는 사람에 따라 옮겨간다</title><desc id="d">같은 상사가 왼쪽 자리에서는 선 바깥에 놓이고 오른쪽 자리에서는 선 안에 놓인다. 선의 자리를 정하는 것은 듣는 사람이다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">선을 어디에 긋는지는 듣는 사람이 정한다. 나와 같은 쪽에 남는 사람이 안이다</text><text class="ink2 sm" x="40" y="62" text-anchor="start">자리 1 — 듣는 사람이 같은 직장 사람</text><rect x="40" y="76" width="130" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="105" y="100" text-anchor="middle">나</text><rect x="40" y="124" width="130" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink sm" x="105" y="148" text-anchor="middle">안</text><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-dasharray="8 5" d="M190 70 V210"/><rect x="210" y="76" width="130" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="275" y="100" text-anchor="middle">상사</text><rect x="210" y="124" width="130" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="275" y="148" text-anchor="middle">듣는 사람</text><rect x="210" y="172" width="130" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink sm" x="275" y="193" text-anchor="middle">바깥</text><text class="ink2 sm" x="40" y="196" text-anchor="start">겸양어</text><text class="ink2 sm" x="275" y="226" text-anchor="middle">존경어</text><path fill="none" stroke="var(--grid)" stroke-width="2.4" stroke-dasharray="8 5" d="M388 62 V250"/><text class="ink2 sm" x="416" y="62" text-anchor="start">자리 2 — 듣는 사람이 다른 회사 사람</text><rect x="416" y="76" width="130" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="481" y="100" text-anchor="middle">나</text><rect x="416" y="124" width="130" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="481" y="148" text-anchor="middle">상사</text><rect x="416" y="172" width="130" height="34" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink sm" x="481" y="193" text-anchor="middle">안</text><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-dasharray="8 5" d="M566 70 V210"/><rect x="586" y="76" width="134" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="653" y="100" text-anchor="middle">듣는 사람</text><rect x="586" y="124" width="134" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink sm" x="653" y="148" text-anchor="middle">바깥</text><text class="ink2 sm" x="416" y="226" text-anchor="start">겸양어</text><text class="ink2 sm" x="653" y="196" text-anchor="middle">존경어</text><text class="ink" x="40" y="274" text-anchor="start">상사는 자리 1 에서 선 바깥에 있고 자리 2 에서 선 안에 있다</text><text class="ink" x="40" y="298" text-anchor="start">그래서 자리 1 에서는 상사의 행동에 존경어가 걸리고 자리 2 에서는 걸리지 않는다</text><text class="ink" x="40" y="324" text-anchor="start">안쪽 사람의 행동에는 겸양어가 걸린다. 자리 2 에서 상사가 그 안에 들어온다</text><text class="ink2 sm" x="40" y="350" text-anchor="start">굵은 점선이 선이고 그 자리가 옮겨간 것이 이 그림의 전부다</text></g>
</svg>