<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">같은 물음에 두 조사로 답할 때 갈리는 뜻</title><desc id="d">주격 표시로 답하면 다른 후보를 닫고, 주제 표시로 답하면 다른 후보에 대해서는 아무 말도 하지 않는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="32" text-anchor="start">누가 하는가를 묻는 물음에 두 가지로 답할 수 있다</text><rect x="40" y="46" width="190" height="38" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="135" y="69" text-anchor="middle">だれが</text><text class="ink2 sm" x="244" y="70" text-anchor="start">물음이 한 자리를 비워 두고 묻는다</text><rect x="40" y="118" width="190" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="135" y="142" text-anchor="middle">わたしが</text><circle cx="290" cy="138" r="15" fill="var(--s3)"/><circle cx="336" cy="138" r="15" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="382" cy="138" r="15" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink2 sm" x="290" y="172" text-anchor="middle">나</text><text class="ink2 sm" x="320" y="172" text-anchor="start">다른 후보</text><text class="ink" x="430" y="134" text-anchor="start">나이고 다른 사람은 아니다</text><text class="ink2 sm" x="430" y="154" text-anchor="start">비워 둔 자리를 채운다. 다른 후보를 닫는다</text><rect x="40" y="216" width="190" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="135" y="240" text-anchor="middle">わたしは</text><circle cx="290" cy="236" r="15" fill="var(--s2)"/><circle cx="336" cy="236" r="15" fill="none" stroke="var(--grid)" stroke-dasharray="4 3" stroke-width="1.4"/><circle cx="382" cy="236" r="15" fill="none" stroke="var(--grid)" stroke-dasharray="4 3" stroke-width="1.4"/><text class="ink2 sm" x="290" y="270" text-anchor="middle">나</text><text class="ink2 sm" x="320" y="270" text-anchor="start">다른 후보</text><text class="ink" x="430" y="232" text-anchor="start">나에 대해 말하면 그렇다</text><text class="ink2 sm" x="430" y="252" text-anchor="start">다른 후보에 대해서는 아무 말도 하지 않는다</text><text class="ink2 sm" x="40" y="302" text-anchor="start">이것이 두 조사의 뜻 차이가 가장 뚜렷하게 드러나는 자리다</text></g>
</svg>