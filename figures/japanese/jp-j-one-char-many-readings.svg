<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한 글자에서 읽는 법이 갈라지는 구조</title><desc id="d">가운데 한자 한 자에서 왼쪽으로 한국 한자음 하나가, 오른쪽으로 음독 셋과 훈독 셋이 뻗는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
