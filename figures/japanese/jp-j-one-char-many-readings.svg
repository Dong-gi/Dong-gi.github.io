.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="45" y="150" width="185" height="56" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="137.5" y="173.5" text-anchor="middle">한국 한자음은 하나</text><text class="ink" x="137.5" y="190.5" text-anchor="middle">행</text><rect x="320" y="150" width="150" height="56" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text class="ink" x="395" y="182" text-anchor="middle">한자 한 자</text><text class="ink2 sm" x="560" y="30" text-anchor="start">음독 — 중국음에서 온 것</text><rect x="560" y="40" width="165" height="32" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="642.5" y="60" text-anchor="middle">こう — 한음</text><rect x="560" y="80" width="165" height="32" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="642.5" y="100" text-anchor="middle">ぎょう — 오음</text><rect x="560" y="120" width="165" height="32" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="642.5" y="140" text-anchor="middle">あん — 당음</text><text class="ink2 sm" x="560" y="192" text-anchor="start">훈독 — 일본어 고유어</text><rect x="560" y="202" width="165" height="30" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="642.5" y="221" text-anchor="middle">いく</text><rect x="560" y="238" width="165" height="30" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="642.5" y="257" text-anchor="middle">ゆく</text><rect x="560" y="274" width="165" height="30" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="642.5" y="293" text-anchor="middle">おこなう</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M316 178 L236 178"/><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M474 172 L554 56"/><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M474 176 L554 96"/><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M474 180 L554 136"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M474 184 L554 217"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M474 188 L554 253"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M474 192 L554 289"/><text class="ink2 sm" x="45" y="240" text-anchor="start">한국어 쪽에서는</text><text class="ink2 sm" x="45" y="258" text-anchor="start">고를 것이 없다</text><text class="ink2 sm" x="45" y="330" text-anchor="start">어느 것을 쓰는지는 낱말마다 따로 정해져 있다</text></g>
