<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">경어의 갈래를 가리는 물음의 순서</title><desc id="d">높임의 꼴을 찾은 다음 그 꼴이 걸린 행동의 주인을 묻고, 주인이 누구인지에 따라 세 갈래로 갈린다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="40" y="30" width="250" height="44" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="165" y="56" text-anchor="middle">문장에서 높임의 꼴을 찾는다</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M165 78 L165 104"/><rect x="40" y="108" width="250" height="60" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="165" y="133" text-anchor="middle">그 꼴이 문장 끝의 말투인가</text><text class="ink sm" x="165" y="151" text-anchor="middle">행동에 걸린 것인가</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M294 138 L350 138"/><text class="ink2 sm" x="322" y="130" text-anchor="middle">말투</text><rect x="356" y="116" width="150" height="44" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="431" y="142" text-anchor="middle">정중어</text><text class="ink2 sm" x="520" y="142" text-anchor="start">です・ます</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M165 172 L165 200"/><text class="ink2 sm" x="176" y="190" text-anchor="start">행동</text><rect x="40" y="204" width="250" height="44" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="165" y="230" text-anchor="middle">그 행동의 주인은 누구인가</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M294 214 L350 200"/><rect x="356" y="178" width="150" height="44" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="431" y="204" text-anchor="middle">존경어</text><text class="ink2 sm" x="520" y="204" text-anchor="start">주인이 높이는 쪽</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M294 238 L350 252"/><rect x="356" y="230" width="150" height="44" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="431" y="256" text-anchor="middle">겸양어</text><text class="ink2 sm" x="520" y="256" text-anchor="start">주인이 나이거나 안쪽</text><text class="ink" x="40" y="296" text-anchor="start">갈래는 형태에서 바로 나오지 않는다. 행동의 주인을 찾는 물음이 앞에 온다</text><text class="ink2 sm" x="40" y="320" text-anchor="start">두 갈래를 섞는 오류는 거의 다 이 물음을 건너뛴 데서 나온다</text></g>
</svg>