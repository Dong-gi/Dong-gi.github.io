<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한 꼴이 세 갈래를 겸하는 것과 그 가운데 하나만 가리키는 꼴</title><desc id="d">위의 꼴은 세 갈래로 읽히고 아래의 꼴은 한 갈래만 가리킨다. 규범이 인정하지 않는 쪽에서 세 갈래가 갈라진다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">위는 화살표가 셋, 아래는 하나다. 이것이 이 그림에서 읽어낼 전부다</text><rect x="40" y="76" width="230" height="44" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="155" y="102" text-anchor="middle">たべられる</text><text class="f1 sm" x="40" y="68" text-anchor="start">규범이 싣는 꼴</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M278 98 L406 61"/><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M278 98 L406 105"/><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M278 98 L406 149"/><rect x="416" y="40" width="200" height="38" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="516" y="63" text-anchor="middle">수동</text><rect x="416" y="86" width="200" height="38" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="516" y="109" text-anchor="middle">가능</text><rect x="416" y="132" width="200" height="38" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="516" y="155" text-anchor="middle">존경</text><text class="ink2 sm" x="630" y="64" text-anchor="start">14장</text><text class="ink2 sm" x="630" y="110" text-anchor="start">11장</text><text class="ink2 sm" x="630" y="156" text-anchor="start">16장</text><rect x="40" y="216" width="230" height="44" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="155" y="242" text-anchor="middle">たべれる</text><text class="f2 sm" x="40" y="208" text-anchor="start">규범이 싣지 않는 꼴</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M278 238 L406 238"/><rect x="416" y="218" width="200" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="516" y="242" text-anchor="middle">가능</text><text class="f2 sm" x="630" y="242" text-anchor="start">이것만</text><text class="f2 sm" x="40" y="290" text-anchor="start">아래 꼴을 쓰는 사람의 말에서는 가능과 나머지 둘이 형태로 갈린다</text><text class="ink2 sm" x="40" y="312" text-anchor="start">규범이 싣지 않는 꼴이 체계적으로는 구별을 늘린다는 뜻이다</text></g>
</svg>