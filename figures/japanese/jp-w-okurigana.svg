<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 296" width="740" height="296" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">오쿠리가나가 하는 두 가지 일</title><desc id="d">왼쪽은 같은 한자에 다른 가나가 붙어 다른 낱말이 되는 것, 오른쪽은 같은 낱말의 꼬리만 바뀌는 것</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
