.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink2 sm" x="50" y="58" text-anchor="start">같은 한자에 붙는 가나가 다르면</text><text class="ink2 sm" x="50" y="76" text-anchor="start">다른 낱말이 된다</text><rect x="64" y="110" width="22" height="22" rx="3" class="f1"/><g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="105" y="128" text-anchor="middle" font-size="20">く</text></g><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M128 122 L166 122"/><text class="ink" x="174" y="127" text-anchor="start">가다</text><rect x="64" y="158" width="22" height="22" rx="3" class="f1"/><g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="105" y="176" text-anchor="middle" font-size="20">う</text></g><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M128 170 L166 170"/><text class="ink" x="174" y="175" text-anchor="start">행하다</text><path class="gr" fill="none" d="M355 46 V254"/><text class="ink2 sm" x="390" y="58" text-anchor="start">같은 낱말이라도 꼬리가 바뀌면</text><text class="ink2 sm" x="390" y="76" text-anchor="start">붙는 가나가 바뀐다</text><rect x="404" y="110" width="22" height="22" rx="3" class="f1"/><g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="445" y="128" text-anchor="middle" font-size="20">く</text></g><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M468 122 L506 122"/><text class="ink" x="514" y="127" text-anchor="start">간다</text><rect x="404" y="158" width="22" height="22" rx="3" class="f1"/><g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="445" y="176" text-anchor="middle" font-size="20">き</text></g><g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="475" y="176" text-anchor="middle" font-size="20">ま</text></g><g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="505" y="176" text-anchor="middle" font-size="20">す</text></g><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M528 170 L566 170"/><text class="ink" x="574" y="175" text-anchor="start">갑니다</text><rect x="404" y="206" width="22" height="22" rx="3" class="f1"/><g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="445" y="224" text-anchor="middle" font-size="20">か</text></g><g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="475" y="224" text-anchor="middle" font-size="20">な</text></g><g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="505" y="224" text-anchor="middle" font-size="20">い</text></g><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M528 218 L566 218"/><text class="ink" x="574" y="223" text-anchor="start">가지 않는다</text><text class="ink2 sm" x="50" y="278" text-anchor="start">사각형 하나가 한자 한 자를 대신한다. 그 뒤에 붙은 가나가 오쿠리가나다</text>
</svg>