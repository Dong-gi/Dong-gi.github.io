<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">주제 표시가 격 자리에 놓일 때의 형태</title><desc id="d">격을 표시하는 조사 여섯 갈래가 주제 표시와 만날 때, 위의 둘은 사라지고 아래 넷은 남아 뒤에 주제 표시가 붙는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="60" y="38" text-anchor="start">격을 표시하는 조사가 붙은 자리</text><text class="ink2 sm" x="285" y="38" text-anchor="start">주제로 올리면</text><text class="ink2 sm" x="465" y="38" text-anchor="start">무엇이 일어나는가</text><rect x="60" y="50" width="110" height="30" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="115" y="69" text-anchor="middle">が</text><rect x="60" y="90" width="110" height="30" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="115" y="109" text-anchor="middle">を</text><rect x="60" y="130" width="110" height="30" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="115" y="149" text-anchor="middle">に</text><rect x="60" y="170" width="110" height="30" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="115" y="189" text-anchor="middle">で</text><rect x="60" y="210" width="110" height="30" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="115" y="229" text-anchor="middle">へ</text><rect x="60" y="250" width="110" height="30" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="115" y="269" text-anchor="middle">から</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M176 65 L274 65"/><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M176 105 L274 105"/><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M176 145 L274 145"/><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M176 185 L274 185"/><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M176 225 L274 225"/><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M176 265 L274 265"/><rect x="280" y="50" width="150" height="30" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="355" y="69" text-anchor="middle">は</text><rect x="280" y="90" width="150" height="30" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="355" y="109" text-anchor="middle">は</text><rect x="280" y="130" width="150" height="30" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="355" y="149" text-anchor="middle">には</text><rect x="280" y="170" width="150" height="30" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="355" y="189" text-anchor="middle">では</text><rect x="280" y="210" width="150" height="30" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="355" y="229" text-anchor="middle">へは</text><rect x="280" y="250" width="150" height="30" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="355" y="269" text-anchor="middle">からは</text><rect x="455" y="50" width="265" height="70" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="587.5" y="80.5" text-anchor="middle">격을 표시하던 조사가 사라진다</text><text class="ink sm" x="587.5" y="97.5" text-anchor="middle">자리는 그대로다</text><rect x="455" y="130" width="265" height="150" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="587.5" y="200.5" text-anchor="middle">격을 표시하던 조사가 남고</text><text class="ink sm" x="587.5" y="217.5" text-anchor="middle">그 뒤에 주제 표시가 붙는다</text><text class="ink2 sm" x="60" y="312" text-anchor="start">주제로 올릴 때 격 표시가 지워지는 것과 남는 것이 갈린다. 자리 자체는 어느 쪽도 바뀌지 않는다</text></g>
</svg>