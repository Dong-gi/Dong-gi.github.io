<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">처음 알리는 것과 이미 아는 것의 흐름</title><desc id="d">처음 내놓을 때는 주격 표시로 내고, 같은 것이 아는 것이 된 다음 문장에서는 주제 표시로 받는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="32" text-anchor="start">이야기가 시작될 때와 이어질 때 표시가 갈린다</text><rect x="45" y="52" width="195" height="56" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="142.5" y="75.5" text-anchor="middle">처음 알리는 것</text><text class="ink" x="142.5" y="92.5" text-anchor="middle">が 로 내놓는다</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M248 80 L306 80"/><rect x="312" y="52" width="190" height="56" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="407" y="75.5" text-anchor="middle">이제 서로</text><text class="ink" x="407" y="92.5" text-anchor="middle">아는 것이 되었다</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M510 80 L568 80"/><rect x="574" y="52" width="145" height="56" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="646.5" y="75.5" text-anchor="middle">は 로</text><text class="ink" x="646.5" y="92.5" text-anchor="middle">받는다</text><text class="ink2 sm" x="45" y="150" text-anchor="start">첫 문장</text><rect x="130" y="132" width="320" height="32" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="290" y="152" text-anchor="middle">처음 나온 것 + が</text><rect x="462" y="132" width="130" height="32" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="527" y="152" text-anchor="middle">술어</text><text class="ink2 sm" x="45" y="198" text-anchor="start">다음 문장</text><rect x="130" y="180" width="320" height="32" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="290" y="200" text-anchor="middle">같은 것 + は</text><rect x="462" y="180" width="130" height="32" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink sm" x="527" y="200" text-anchor="middle">술어</text><path fill="none" stroke="var(--s3)" stroke-width="1.6" d="M290 166 L290 178"/><text class="ink" x="40" y="250" text-anchor="start">거꾸로 하면 어긋난다. 처음 나오는 것을 주제로 내놓으면</text><text class="ink2 sm" x="40" y="276" text-anchor="start">읽는 사람은 그것이 무엇을 가리키는지 알 수 없다</text></g>
</svg>