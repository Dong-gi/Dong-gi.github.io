<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">층은 문장 끝 한 곳에만 쌓인다</title><desc id="d">이어진 절이 끝나는 자리에는 층이 쌓이지 않고, 문장의 끝에서 한 번 쌓인다. 예외는 정중함 하나뿐이다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="32" text-anchor="start">한 문장 안에서 층이 쌓이는 자리는 하나다</text><rect x="40" y="62" width="200" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="140" y="89" text-anchor="middle">절 1</text><rect x="250" y="62" width="160" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="330" y="89" text-anchor="middle">절 2</text><rect x="420" y="62" width="140" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="490" y="89" text-anchor="middle">주절</text><rect x="570" y="62" width="170" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="655" y="89" text-anchor="middle">층이 여기 쌓인다</text><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="5 4" d="M245 56 V114"/><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="5 4" d="M415 56 V114"/><path fill="none" stroke="var(--s2)" stroke-width="1.2" d="M560 85 L570 85"/><text class="ink2 sm" x="140" y="134" text-anchor="middle">표시하지 않는다</text><text class="ink2 sm" x="330" y="134" text-anchor="middle">표시하지 않는다</text><text class="f2 sm" x="655" y="134" text-anchor="middle">정중함 · 부정 · 때 · 태도</text><rect x="40" y="172" width="700" height="62" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="f1" x="60" y="198" text-anchor="start">예외 넷 — 앞에 정중체가 올 수 있다</text><text class="ink" x="326" y="200" text-anchor="start" style="font-size:16px">から · ので · が · けど</text><text class="ink2 sm" x="60" y="222" text-anchor="start">그 경우에도 앞 절에 쌓이는 것은 정중함 하나뿐이다. 때와 태도는 끝에서만 쌓인다</text><text class="ink" x="40" y="268" text-anchor="start">중간의 짧은 꼴을 보고 문장의 때나 말투를 판정하지 않는다</text><text class="ink2 sm" x="40" y="292" text-anchor="start">앞은 보통체인데 뒤는 정중체라고 보이면 말투가 바뀐 것이 아니라 절이 이어진 것이다</text></g>
</svg>