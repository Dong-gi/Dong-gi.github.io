</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="40" y="30" text-anchor="start">같은 창문을 세 가지로 말한다</text><text class="ink2 sm" x="135" y="60" text-anchor="middle">자동사 + ている</text><rect x="40" y="72" width="190" height="66" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="135" y="97" text-anchor="middle">まどが</text><text class="ink" x="135" y="121" text-anchor="middle">あいて いる</text><text class="ink" x="135" y="164" text-anchor="middle">결과 상태</text><text class="ink2 sm" x="135" y="186" text-anchor="middle">어떻게 열렸는지 말하지 않는다</text><text class="ink2 sm" x="380" y="60" text-anchor="middle">타동사 + てある</text><rect x="285" y="72" width="190" height="66" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="380" y="97" text-anchor="middle">まどが</text><text class="ink" x="380" y="121" text-anchor="middle">あけて ある</text><text class="ink" x="380" y="164" text-anchor="middle">누가 그렇게 해 두었다</text><text class="ink2 sm" x="380" y="186" text-anchor="middle">사람의 손길이 문장에 들어온다</text><text class="ink2 sm" x="625" y="60" text-anchor="middle">타동사 + ている</text><rect x="530" y="72" width="190" height="66" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.8"/><text class="ink" x="625" y="97" text-anchor="middle">まどを</text><text class="ink" x="625" y="121" text-anchor="middle">あけて いる</text><text class="ink" x="625" y="164" text-anchor="middle">진행</text><text class="ink2 sm" x="625" y="186" text-anchor="middle">지금 여는 중이다</text><rect x="40" y="208" width="680" height="62" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="380" y="233" text-anchor="middle">왼쪽 둘은 같은 창문을 가리킬 수 있다</text><text class="ink" x="380" y="253" text-anchor="middle">갈리는 것은 사람의 손길을 문장에 넣는가다</text><text class="ink2 sm" x="40" y="300" text-anchor="start">진행과 결과 상태라는 이름은 13장이 세운 것이다</text></g>
