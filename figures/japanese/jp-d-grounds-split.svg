<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">짐작 표현을 고를 때 먼저 보는 것</title><desc id="d">근거가 어디서 왔는지에 따라 쓰는 표현이 갈린다. 확신의 세기보다 근거의 종류가 먼저다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">근거가 어디서 왔는가를 먼저 본다</text><text class="ink2 sm" x="60" y="56" text-anchor="start">근거</text><text class="ink2 sm" x="470" y="56" text-anchor="start">쓰는 표현</text><rect x="40" y="66" width="250" height="48" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="165" y="94" text-anchor="middle">아는 사실 · 약속 · 시간표</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M296 90 L456 90"/><rect x="466" y="66" width="254" height="48" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="593" y="94" text-anchor="middle">はずだ</text><rect x="40" y="128" width="250" height="48" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="165" y="156" text-anchor="middle">내 눈에 보이는 것</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M296 152 L456 152"/><rect x="466" y="128" width="254" height="48" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="593" y="156" text-anchor="middle">ようだ · 어간에 붙는 そうだ</text><rect x="40" y="190" width="250" height="48" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="165" y="218" text-anchor="middle">남에게 들은 것</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M296 214 L456 214"/><rect x="466" y="190" width="254" height="48" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="593" y="218" text-anchor="middle">사전형에 붙는 そうだ · らしい</text><rect x="40" y="252" width="250" height="48" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="165" y="280" text-anchor="middle">근거를 대지 않는다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M296 276 L456 276"/><rect x="466" y="252" width="254" height="48" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="593" y="280" text-anchor="middle">かもしれない · でしょう</text><text class="ink2 sm" x="40" y="328" text-anchor="start">같은 확신이라도 근거가 다르면 다른 표현을 쓴다</text></g>
</svg>