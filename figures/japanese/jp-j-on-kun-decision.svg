<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">음독인지 훈독인지 가리는 절차</title><desc id="d">한자가 둘 이상 붙었는지, 오쿠리가나가 붙었는지를 차례로 묻고 답을 얻는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="50" y="26" width="300" height="44" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="200" y="52" text-anchor="middle">한자가 둘 이상 붙어 있는가</text><rect x="430" y="26" width="280" height="44" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="570" y="52" text-anchor="middle">대개 음독</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M354 48 L426 48"/><text class="ink2 sm" x="390" y="40" text-anchor="middle">예</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M200 74 L200 106"/><text class="ink2 sm" x="208" y="96" text-anchor="start">아니오</text><rect x="50" y="108" width="300" height="44" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="200" y="134" text-anchor="middle">오쿠리가나가 붙어 있는가</text><rect x="430" y="108" width="280" height="44" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="570" y="134" text-anchor="middle">훈독</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M354 130 L426 130"/><text class="ink2 sm" x="390" y="122" text-anchor="middle">예</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M200 156 L200 188"/><text class="ink2 sm" x="208" y="178" text-anchor="start">아니오</text><rect x="50" y="190" width="300" height="44" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="200" y="216" text-anchor="middle">한자 하나가 낱말 전체인가</text><rect x="430" y="184" width="280" height="56" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="570" y="207.5" text-anchor="middle">대개 훈독</text><text class="ink" x="570" y="224.5" text-anchor="middle">음독으로 읽는 낱말도 있다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M354 212 L426 212"/><text class="ink2 sm" x="390" y="204" text-anchor="middle">예</text><rect x="50" y="278" width="660" height="60" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="380" y="303.5" text-anchor="middle">예외 — 앞과 뒤가 음독과 훈독으로 섞이는 낱말이 있다</text><text class="ink" x="380" y="320.5" text-anchor="middle">규칙으로 가려지지 않으므로 낱말째 익힌다</text></g>
</svg>