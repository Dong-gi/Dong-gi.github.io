<title id="t">악센트의 형 — 내려가는 자리가 형을 정한다</title><desc id="d">내려가지 않는 형이 하나, 내려가는 자리가 다른 형이 셋이다. 조사 자리까지 보아야 마지막 형이 드러난다.</desc>
