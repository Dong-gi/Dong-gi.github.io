<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한국어 화자가 틀리는 두 칸</title><desc id="d">낱말 첫머리와 가운데, 무성과 유성의 네 칸 가운데 두 칸에서 한국어 규칙이 반대 결과를 만든다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="332" y="74" text-anchor="middle">낱말 첫머리</text><text class="ink2 sm" x="570" y="74" text-anchor="middle">낱말 가운데</text><text class="ink bold" x="170" y="142" text-anchor="middle" font-size="22">か</text><text class="ink2 sm" x="190" y="146" text-anchor="end">무성</text><text class="ink bold" x="170" y="236" text-anchor="middle" font-size="22">が</text><text class="ink2 sm" x="190" y="240" text-anchor="end">유성</text><rect x="214" y="96" width="236" height="76" rx="6" fill="none" class="gr" stroke-width="1.5"/><text class="ink" x="332" y="126" text-anchor="middle">그대로 된다</text><text class="ink2 sm" x="332" y="148" text-anchor="middle">한국어 어두 평음도 떨리지 않는다</text><rect x="452" y="96" width="236" height="76" rx="6" class="f2" fill-opacity="0.15" stroke="none"/><rect x="452" y="96" width="236" height="76" rx="6" fill="none" class="s2" stroke-width="1.5"/><text class="f2" x="570" y="126" text-anchor="middle">유성으로 나온다</text><text class="ink2 sm" x="570" y="148" text-anchor="middle">한국어 규칙이 저절로 떨림을 넣는다</text><rect x="214" y="190" width="236" height="76" rx="6" class="f2" fill-opacity="0.15" stroke="none"/><rect x="214" y="190" width="236" height="76" rx="6" fill="none" class="s2" stroke-width="1.5"/><text class="f2" x="332" y="220" text-anchor="middle">무성으로 나온다</text><text class="ink2 sm" x="332" y="242" text-anchor="middle">한국어에 어두 유성음이 없다</text><rect x="452" y="190" width="236" height="76" rx="6" fill="none" class="gr" stroke-width="1.5"/><text class="ink" x="570" y="220" text-anchor="middle">그대로 된다</text><text class="ink2 sm" x="570" y="242" text-anchor="middle">한국어 규칙과 결과가 맞는다</text><path class="s2" fill="none" stroke-width="1.5" stroke-dasharray="5 4" d="M676 164 L226 202"/><text class="ink2 sm" x="360" y="286" text-anchor="middle">칠한 두 칸이 한국어 화자가 놓치는 자리다</text></g>
