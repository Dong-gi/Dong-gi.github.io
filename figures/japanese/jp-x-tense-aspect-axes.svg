<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" width="760" height="326" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이 장이 쓰는 두 축</title><desc id="d">위는 말하는 때를 기준으로 언제인지를 재는 축, 아래는 일이 어느 단계에 있는지를 재는 축이다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="f1" x="40" y="30" text-anchor="start">시제 — 말하는 때를 기준으로 언제인가</text><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M50 92 L726 92"/><path fill="none" stroke="var(--s1)" stroke-width="2" d="M390 74 V110"/><text class="f1" x="390" y="130" text-anchor="middle">말하는 때</text><text class="ink2" x="200" y="70" text-anchor="middle">지난 일</text><text class="ink2" x="560" y="70" text-anchor="middle">지금 · 앞일</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="5 4" d="M40 158 L720 158"/><text class="f2" x="40" y="192" text-anchor="start">상 — 그 일이 어느 단계에 있는가</text><rect x="220" y="226" width="280" height="26" rx="4" fill="none" stroke="var(--s2)" stroke-width="1.6"/><text class="ink" x="360" y="244" text-anchor="middle">하는 중</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" d="M220 214 V264"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" d="M500 214 V264"/><text class="ink2 sm" x="220" y="208" text-anchor="middle">시작</text><text class="ink2 sm" x="500" y="208" text-anchor="middle">끝</text><rect x="516" y="226" width="190" height="26" rx="4" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-dasharray="5 4"/><text class="ink2 sm" x="611" y="244" text-anchor="middle">끝난 뒤의 상태</text><text class="ink" x="40" y="292" text-anchor="start">아래 축에는 어제인지 내일인지가 들어 있지 않다. 두 축은 서로 다른 것을 묻는다</text><text class="ink2 sm" x="40" y="316" text-anchor="start">그래서 한 문장은 두 축에서 각각 한 값을 가진다</text></g>
</svg>