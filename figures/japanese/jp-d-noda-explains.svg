<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">설명을 대는 꼴이 무엇을 받는가</title><desc id="d">앞의 말이나 상황이 있을 때만 설명을 대는 꼴이 쓰인다. 받을 것이 없으면 설명할 것 없는 설명이 된다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">왼쪽에 받을 것이 있을 때 오른쪽 꼴이 쓰인다</text><text class="f3 sm" x="40" y="56" text-anchor="start">받을 것이 있다</text><rect x="40" y="64" width="250" height="56" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="165" y="87.5" text-anchor="middle">어째서 늦었습니까</text><text class="ink" x="165" y="104.5" text-anchor="middle">— 앞의 말</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M298 92 L378 92"/><text class="ink2 sm" x="338" y="82" text-anchor="middle">설명한다</text><rect x="388" y="64" width="330" height="56" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="553" y="87.5" text-anchor="middle">でんしゃがこなかったんです</text><text class="ink" x="553" y="104.5" text-anchor="middle">— 사정을 댄 말이 된다</text><text class="f2 sm" x="40" y="176" text-anchor="start">받을 것이 없다</text><rect x="40" y="184" width="250" height="56" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="165" y="216" text-anchor="middle">앞의 말도 상황도 없다</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="5 4" d="M298 212 L378 212"/><rect x="388" y="184" width="330" height="56" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="553" y="207.5" text-anchor="middle">わたしはがくせいなんです</text><text class="ink" x="553" y="224.5" text-anchor="middle">— 따지거나 변명하는 투가 된다</text><text class="ink2 sm" x="40" y="274" text-anchor="start">이 꼴이 하는 일은 문장을 정중하게 만드는 것이 아니라 앞을 설명하는 것이다</text></g>
</svg>