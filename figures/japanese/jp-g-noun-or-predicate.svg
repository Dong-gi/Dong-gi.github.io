<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">같은 글자가 명사 뒤와 술어 뒤에서 다른 일을 한다</title><desc id="d">왼쪽은 명사 뒤에 붙은 격조사이고 오른쪽은 술어 뒤에 붙은 잇는 말이다. 가르는 것은 앞에 놓인 것의 종류다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="88" y="34" text-anchor="start">명사 뒤 — 격조사 (9장)</text><text class="ink" x="410" y="34" text-anchor="start">술어 뒤 — 잇는 말 (19장)</text><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="6 5" d="M390 48 V232"/><rect x="20" y="70" width="52" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="46" y="91" text-anchor="middle">から</text><text class="ink" x="88" y="94" text-anchor="start" style="font-size:15px">えきからあるきます</text><text class="ink2 sm" x="88" y="118" text-anchor="start">걷기 시작하는 곳을 표시한다</text><text class="ink" x="410" y="94" text-anchor="start" style="font-size:15px">あめがふるから、でかけません</text><text class="ink2 sm" x="410" y="118" text-anchor="start">나가지 않는 이유를 표시한다</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" d="M20 140 L740 140"/><rect x="20" y="158" width="52" height="34" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="46" y="179" text-anchor="middle">が</text><text class="ink" x="88" y="182" text-anchor="start" style="font-size:15px">あめがふります</text><text class="ink2 sm" x="88" y="206" text-anchor="start">내리는 주체를 표시한다</text><text class="ink" x="410" y="182" text-anchor="start" style="font-size:15px">たかいですが、かいます</text><text class="ink2 sm" x="410" y="206" text-anchor="start">앞뒤가 어긋난다는 것을 표시한다</text><text class="ink" x="20" y="258" text-anchor="start">가르는 것은 뜻이 아니라 앞에 놓인 것이 명사인가 술어인가다</text></g>
</svg>