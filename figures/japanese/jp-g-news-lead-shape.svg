<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">뉴스 리드 첫 문장의 짜임</title><desc id="d">한 문장이 때 · 곳 · 일어난 일 · 그 결과의 넷으로 나뉜다. 리드가 긴 이유가 여기 있다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="50" y="30" text-anchor="start">리드는 한 문장에 넷을 몰아넣는다</text><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="5 4" d="M226 58 V100"/><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="5 4" d="M402 58 V100"/><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-dasharray="5 4" d="M498 58 V100"/><text class="ink" x="50" y="82" text-anchor="start" style="font-size:16px">よっかごごさんじごろ、</text><text class="ink" x="226" y="82" text-anchor="start" style="font-size:16px">とうきょうのえきまえで</text><text class="ink" x="402" y="82" text-anchor="start" style="font-size:16px">かじが</text><text class="f2" x="450" y="82" text-anchor="start" style="font-size:16px">あり、</text><text class="ink" x="498" y="82" text-anchor="start" style="font-size:16px">みせがふたつ</text><text class="f2" x="594" y="82" text-anchor="start" style="font-size:16px">やけた。</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" d="M50 93 V100 H224 V93"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" d="M228 93 V100 H400 V93"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" d="M404 93 V100 H496 V93"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" d="M500 93 V100 H658 V93"/><text class="ink" x="137" y="122" text-anchor="middle">언제</text><text class="ink" x="314" y="122" text-anchor="middle">어디서</text><text class="ink" x="450" y="122" text-anchor="middle">무엇이 있었고</text><text class="ink" x="579" y="122" text-anchor="middle">어떻게 되었다</text><path fill="none" stroke="var(--s2)" stroke-width="1.2" d="M466 130 L466 156"/><rect x="346" y="156" width="240" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="366" y="176" text-anchor="start" style="font-size:14px">ます</text><text class="ink2 sm" x="398" y="176" text-anchor="start">를 뗀 꼴이 절을 잇는다</text><text class="ink2 sm" x="366" y="194" text-anchor="start">글말에서 쓰는 이음이다</text><text class="ink" x="50" y="236" text-anchor="start">문장 전체의 술어는 맨 끝의 것 하나이고 때의 층도 거기에만 붙어 있다</text><text class="ink2 sm" x="50" y="262" text-anchor="start">리드가 긴 것은 낱말이 어려워서가 아니라 넷을 한 문장에 담기 때문이다</text></g>
</svg>