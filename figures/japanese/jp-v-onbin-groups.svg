<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="120" y="32" text-anchor="middle">1류 사전형의 끝</text><text class="ink2 sm" x="400" y="32" text-anchor="middle">て형의 끝</text><text class="ink2 sm" x="640" y="32" text-anchor="middle">이름</text><rect x="60" y="46" width="120" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="120" y="67" text-anchor="middle">く</text><rect x="60" y="86" width="120" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="120" y="107" text-anchor="middle">ぐ</text><rect x="60" y="132" width="120" height="34" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="120" y="153" text-anchor="middle">う · つ · る</text><rect x="60" y="178" width="120" height="34" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="120" y="199" text-anchor="middle">ぬ · ぶ · む</text><rect x="60" y="224" width="120" height="34" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="120" y="245" text-anchor="middle">す</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M184 63 L336 63"/><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M184 103 L336 103"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M184 149 L336 149"/><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M184 195 L336 195"/><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M184 241 L336 241"/><rect x="340" y="46" width="120" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="400" y="67" text-anchor="middle">いて</text><rect x="340" y="86" width="120" height="