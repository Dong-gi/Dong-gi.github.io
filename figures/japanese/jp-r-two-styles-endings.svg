.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">왼쪽 칸은 두 줄이 같다. 갈리는 것은 오른쪽 칸 하나뿐이다</text><text class="ink2 sm" x="60" y="60" text-anchor="start">문장의 앞부분</text><text class="ink2 sm" x="470" y="60" text-anchor="middle">문장 끝</text><text class="ink2 sm" x="660" y="60" text-anchor="middle">문체</text><rect x="40" y="70" width="340" height="40" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="210" y="94" text-anchor="middle">ほんを</text><rect x="392" y="70" width="156" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="470" y="94" text-anchor="middle">よむ</text><text class="f1" x="660" y="94" text-anchor="middle">보통체</text><rect x="40" y="120" width="340" height="40" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="210" y="144" text-anchor="middle">ほんを</text><rect x="392" y="120" width="156" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="470" y="144" text-anchor="middle">よみます</text><text class="f2" x="660" y="144" text-anchor="middle">정중체</text><rect x="40" y="186" width="340" height="40" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="210" y="210" text-anchor="middle">たなかさんは がくせい</text><rect x="392" y="186" width="156" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="470" y="210" text-anchor="middle">だ</text><text class="f1" x="660" y="210" text-anchor="middle">보통체</text><rect x="40" y="236" width="340" height="40" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="210" y="260" text-anchor="middle">たなかさんは がくせい</text><rect x="392" y="236" width="156" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="470" y="260" text-anchor="middle">です</text><text class="f2" x="660" y="260" text-anchor="middle">정중체</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M40 288 L380 288"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M40 282 L40 288"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M380 282 L380 288"/><text class="ink2 sm" x="392" y="292" text-anchor="start">이만큼은 문체를 고르는 일과 상관이 없다</text></g>
</svg>