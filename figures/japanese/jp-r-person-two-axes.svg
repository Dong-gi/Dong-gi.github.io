<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">1인칭을 가리키는 말이 놓이는 두 축</title><desc id="d">가로축은 글과 공식 자리에서 확인되는 축이고, 세로축은 이 문서가 확인하지 못한 축이라 점선으로 그렸다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">가로축은 확인되고 세로축은 확인되지 않았다. 두 축을 겹쳐 놓은 것이 문제다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M70 150 L720 150"/><text class="ink2 sm" x="70" y="176" text-anchor="start">격식이 없는 자리</text><text class="ink2 sm" x="710" y="176" text-anchor="end">격식 있는 자리</text><text class="f1 sm" x="400" y="196" text-anchor="middle">이 축은 글과 공식 자리에서 확인된다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M160 134 L160 150"/><text class="ink" x="160" y="126" text-anchor="middle">おれ</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M320 134 L320 150"/><text class="ink" x="320" y="126" text-anchor="middle">ぼく</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M480 134 L480 150"/><text class="ink" x="480" y="126" text-anchor="middle">わたし</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M640 134 L640 150"/><text class="ink" x="640" y="126" text-anchor="middle">わたくし</text><text class="ink2 sm" x="160" y="106" text-anchor="middle">글에 안 나온다</text><text class="ink2 sm" x="320" y="106" text-anchor="middle">글에 안 나온다</text><text class="ink2 sm" x="480" y="106" text-anchor="middle">글에 나온다</text><text class="ink2 sm" x="640" y="106" text-anchor="middle">가장 격식</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="5 4" d="M250 302 L250 168"/><text class="f2 sm" x="266" y="250" text-anchor="start">교재가 성별 축이라고 적어 온 축</text><text class="f2 sm" x="266" y="272" text-anchor="start">이 문서는 실제 사용을 확인하지 못했다</text><text class="ink2 sm" x="266" y="294" text-anchor="start">그래서 점선으로 두고 눈금을 적지 않는다</text></g>
</svg>