<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">る 로 끝나는 동사가 두 갈래로 갈리는 자리</title><desc id="d">る 앞 글자의 단에 따라 갈리고, 한쪽에만 예외가 있다. 아래는 사전형이 같은 두 낱말이다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="40" y="62" width="150" height="44" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text class="ink" x="115" y="88" text-anchor="middle">る 로 끝난다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M194 84 L250 56"/><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M194 84 L250 128"/><rect x="254" y="34" width="176" height="44" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="342" y="51" text-anchor="middle">る 앞이</text><text class="ink" x="342" y="69" text-anchor="middle">あ · う · お단</text><rect x="254" y="106" width="176" height="44" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="342" y="123" text-anchor="middle">る 앞이</text><text class="ink" x="342" y="141" text-anchor="middle">い · え단</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M434 56 L486 56"/><rect x="490" y="32" width="240" height="48" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="610" y="51" text-anchor="middle">1류 — 예외가 없다</text><text class="ink" x="610" y="69" text-anchor="middle">わかる · つくる · のる</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M434 128 L486 110"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M434 128 L486 158"/><rect x="490" y="88" width="240" height="44" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="610" y="114" text-anchor="middle">2류가 많다 — みる · たべる</text><rect x="490" y="138" width="240" height="44" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="610" y="164" text-anchor="middle">1류인 낱말도 있다 — かえる</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" d="M40 208 L720 208"/><text class="ink" x="40" y="234" text-anchor="start">사전형이 같으면 갈래도 같은가 — 아니다</text><rect x="40" y="248" width="330" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="205" y="266.5" text-anchor="middle">きる — 자르다 → きって</text><text class="ink" x="205" y="283.5" text-anchor="middle">1류</text><rect x="390" y="248" width="330" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="555" y="266.5" text-anchor="middle">きる — 입다 → きて</text><text class="ink" x="555" y="283.5" text-anchor="middle">2류</text><text class="ink2 sm" x="40" y="314" text-anchor="start">사전형의 모양만으로는 이 둘이 갈리지 않는다. て형이 갈라 준다</text></g>
</svg>