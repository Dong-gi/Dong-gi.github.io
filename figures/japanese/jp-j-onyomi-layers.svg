<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">음독이 여럿이 된 경로</title><desc id="d">중국음이 시기를 달리해 세 번 들어오고, 앞의 음이 지워지지 않아 셋이 함께 남는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="40" y="32" width="680" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="380" y="56" text-anchor="middle">중국의 한자음 — 들여온 시기마다 달랐다</text><rect x="90" y="148" width="150" height="58" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="165" y="172.5" text-anchor="middle">오음</text><text class="ink" x="165" y="189.5" text-anchor="middle">ぎょう</text><rect x="305" y="148" width="150" height="58" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="380" y="172.5" text-anchor="middle">한음</text><text class="ink" x="380" y="189.5" text-anchor="middle">こう</text><rect x="520" y="148" width="150" height="58" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="595" y="172.5" text-anchor="middle">당음</text><text class="ink" x="595" y="189.5" text-anchor="middle">あん</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M165 76 L165 144"/><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M380 76 L380 144"/><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M595 76 L595 144"/><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M165 208 L165 230"/><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M380 208 L380 230"/><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M595 208 L595 230"/><rect x="40" y="234" width="680" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="380" y="258" text-anchor="middle">일본어에 남은 음 — 셋이 함께 남았다</text><text class="ink2 sm" x="40" y="298" text-anchor="start">왼쪽이 이른 시기다. 새 음이 들어와도 이미 자리 잡은 낱말의 음은 바뀌지 않았다</text></g>
