<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한국어 을 · 를 자리에 が 가 오는 곳</title><desc id="d">한국어 네 줄이 같은 조사를 쓰는데 일본어에서는 첫 줄만 を 이고 나머지 셋은 が 다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="32" text-anchor="start">왼쪽 네 줄은 한국어에서 모두 같은 조사다</text><text class="ink" x="40" y="62" text-anchor="start">한국어</text><text class="ink" x="330" y="62" text-anchor="start">일본어</text><text class="ink" x="690" y="62" text-anchor="start">술어</text><path class="gr" d="M40 72 H744"/><text class="ink" x="40" y="104" text-anchor="start" style="font-size:17px">일본어<tspan fill="var(--s3)" font-weight="700">를 </tspan>공부한다</text><text class="ink" x="330" y="104" text-anchor="start" style="font-size:17px">にほんご<tspan fill="var(--s1)" font-weight="700">を</tspan>べんきょうします</text><text class="ink" x="690" y="101" text-anchor="start">동작</text><text class="ink" x="40" y="148" text-anchor="start" style="font-size:17px">일본어<tspan fill="var(--s3)" font-weight="700">를 </tspan>좋아한다</text><text class="ink" x="330" y="148" text-anchor="start" style="font-size:17px">にほんご<tspan fill="var(--s2)" font-weight="700">が</tspan>すきです</text><text class="ink" x="690" y="145" text-anchor="start">상태</text><text class="ink" x="40" y="192" text-anchor="start" style="font-size:17px">일본어<tspan fill="var(--s3)" font-weight="700">를 </tspan>안다</text><text class="ink" x="330" y="192" text-anchor="start" style="font-size:17px">にほんご<tspan fill="var(--s2)" font-weight="700">が</tspan>わかります</text><text class="ink" x="690" y="189" text-anchor="start">상태</text><text class="ink" x="40" y="236" text-anchor="start" style="font-size:17px">일본어<tspan fill="var(--s3)" font-weight="700">를 </tspan>할 수 있다</text><text class="ink" x="330" y="236" text-anchor="start" style="font-size:17px">にほんご<tspan fill="var(--s2)" font-weight="700">が</tspan>できます</text><text class="ink" x="690" y="233" text-anchor="start">상태</text><path class="gr" stroke-dasharray="4 3" d="M320 84 V292"/><text class="ink2 sm" x="40" y="314" text-anchor="start">술어가 동작인 첫 줄만 다른 조사를 받는다</text></g>
