<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">피해의 수동에서 영향이 누구에게 가는가</title><desc id="d">を 로 이어질 대상이 없는 사건에서도 수동이 만들어지고, 영향을 받은 사람이 주어가 된다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="f1" x="40" y="30" text-anchor="start">자동사의 수동 — 사건에 を 로 이어질 대상이 없다</text><rect x="40" y="44" width="200" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="140" y="71" text-anchor="middle">あめが ふる</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M244 67 L316 67"/><text class="f2 sm" x="280" y="56" text-anchor="middle">영향</text><rect x="320" y="44" width="160" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="400" y="71" text-anchor="middle">わたし</text><text class="ink" x="500" y="62" text-anchor="start">곤란해진 사람이</text><text class="ink" x="500" y="82" text-anchor="start">주어가 된다</text><text class="ink" x="40" y="122" text-anchor="start" style="font-size:17px">あめに ふられた</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" d="M40 146 L720 146"/><text class="f1" x="40" y="174" text-anchor="start">타동사의 수동 — を 가 그대로 남는 자리</text><rect x="40" y="188" width="170" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="125" y="215" text-anchor="middle">となりの ひと</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M214 211 L252 211"/><text class="f1 sm" x="233" y="200" text-anchor="middle">すう</text><rect x="256" y="188" width="130" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="321" y="215" text-anchor="middle">たばこ</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M390 211 L452 211"/><text class="f2 sm" x="421" y="200" text-anchor="middle">영향</text><rect x="456" y="188" width="160" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="536" y="215" text-anchor="middle">わたし</text><text class="ink" x="40" y="266" text-anchor="start" style="font-size:17px">たばこを すわれた</text><text class="ink" x="40" y="300" text-anchor="start">주어는 곤란해진 사람이고 を 는 자리를 그대로 지킨다</text><text class="ink2 sm" x="40" y="324" text-anchor="start">한국어에는 이 두 줄에 대응하는 수동이 없다</text></g>
</svg>