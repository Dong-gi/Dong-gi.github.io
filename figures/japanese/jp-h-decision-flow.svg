<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">두 조사 가운데 하나를 고르는 절차</title><desc id="d">구조가 정해 놓은 자리를 먼저 걸러 내고, 남으면 정보의 흐름과 대비로 가른다. 마지막 칸은 근사다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="40" y="26" width="330" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="205" y="50" text-anchor="middle">절 안의 주어인가 · 의문사인가</text><rect x="430" y="20" width="290" height="52" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="575" y="41.5" text-anchor="middle">が</text><text class="ink" x="575" y="58.5" text-anchor="middle">고를 여지가 없다</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M374 46 L426 46"/><text class="ink2 sm" x="400" y="38" text-anchor="middle">예</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M205 70 L205 88"/><text class="ink2 sm" x="213" y="86" text-anchor="start">아니오</text><rect x="40" y="92" width="330" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="205" y="116" text-anchor="middle">처음 알리는 것인가 · 있음이나 날씨인가</text><rect x="430" y="86" width="290" height="52" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="575" y="107.5" text-anchor="middle">が</text><text class="ink" x="575" y="124.5" text-anchor="middle">새로 내놓는다</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M374 112 L426 112"/><text class="ink2 sm" x="400" y="104" text-anchor="middle">예</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M205 136 L205 154"/><text class="ink2 sm" x="213" y="152" text-anchor="start">아니오</text><rect x="40" y="158" width="330" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="205" y="182" text-anchor="middle">앞에 나왔거나 서로 아는 것인가</text><rect x="430" y="152" width="290" height="52" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="575" y="173.5" text-anchor="middle">は</text><text class="ink" x="575" y="190.5" text-anchor="middle">주제로 받는다</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M374 178 L426 178"/><text class="ink2 sm" x="400" y="170" text-anchor="middle">예</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M205 202 L205 220"/><text class="ink2 sm" x="213" y="218" text-anchor="start">아니오</text><rect x="40" y="224" width="330" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="205" y="248" text-anchor="middle">여러 개를 견주고 있는가</text><rect x="430" y="218" width="290" height="52" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="575" y="239.5" text-anchor="middle">は</text><text class="ink" x="575" y="256.5" text-anchor="middle">대비</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M374 244 L426 244"/><text class="ink2 sm" x="400" y="236" text-anchor="middle">예</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M205 268 L205 286"/><text class="ink2 sm" x="213" y="284" text-anchor="start">아니오</text><rect x="40" y="290" width="330" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="205" y="314" text-anchor="middle">그것뿐이라고 못 박는가</text><rect x="430" y="284" width="290" height="52" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="575" y="305.5" text-anchor="middle">が</text><text class="ink" x="575" y="322.5" text-anchor="middle">배타</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M374 310 L426 310"/><text class="ink2 sm" x="400" y="302" text-anchor="middle">예</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M205 334 L205 352"/><text class="ink2 sm" x="213" y="350" text-anchor="start">아니오</text><rect x="40" y="356" width="680" height="44" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="380" y="382" text-anchor="middle">여기까지 갈리지 않으면 は 를 놓고 문맥을 다시 본다 — 이 마지막 칸이 절차의 한계다</text><text class="ink2 sm" x="40" y="418" text-anchor="start">첫 칸만 구조가 정한다. 아래로 갈수록 문맥이 정하므로 절차가 근사가 된다</text></g>
</svg>