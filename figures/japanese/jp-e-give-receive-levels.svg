<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">주고받기 동사와 그 경어형</title><desc id="d">주고받기 동사의 방향은 그대로 있고 경어형은 그 위에 누구를 높이는지만 얹는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">방향은 그대로다. 경어형이 더하는 것은 누구를 높이는지뿐이다</text><text class="ink2 sm" x="40" y="58" text-anchor="start">보통 꼴</text><text class="ink2 sm" x="200" y="58" text-anchor="start">방향</text><text class="ink2 sm" x="440" y="58" text-anchor="start">경어형</text><text class="ink2 sm" x="600" y="58" text-anchor="start">올라가는 쪽</text><rect x="40" y="70" width="130" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="105" y="94" text-anchor="middle">あげる</text><rect x="196" y="70" width="76" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="234" y="94" text-anchor="middle">안</text><path class="s1" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M280 90 L348 90"/><rect x="354" y="70" width="76" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="392" y="94" text-anchor="middle">바깥</text><rect x="440" y="70" width="140" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="510" y="94" text-anchor="middle">さしあげる</text><text class="ink" x="600" y="94" text-anchor="start">받는 쪽</text><rect x="40" y="130" width="130" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="105" y="154" text-anchor="middle">くれる</text><rect x="196" y="130" width="76" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="234" y="154" text-anchor="middle">안</text><path class="s1" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M348 150 L280 150"/><rect x="354" y="130" width="76" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="392" y="154" text-anchor="middle">바깥</text><rect x="440" y="130" width="140" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="510" y="154" text-anchor="middle">くださる</text><text class="ink" x="600" y="154" text-anchor="start">주는 쪽</text><rect x="40" y="190" width="130" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="105" y="214" text-anchor="middle">もらう</text><rect x="196" y="190" width="76" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="234" y="214" text-anchor="middle">안</text><path class="s1" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M348 210 L280 210"/><rect x="354" y="190" width="76" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="392" y="214" text-anchor="middle">바깥</text><rect x="440" y="190" width="140" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="510" y="214" text-anchor="middle">いただく</text><text class="ink" x="600" y="214" text-anchor="start">주는 쪽</text><text class="ink" x="40" y="268" text-anchor="start">주는 쪽이 올라가면 존경어가 되고 받는 쪽이 나이면 겸양어가 된다</text><text class="ink" x="40" y="292" text-anchor="start">그래서 어느 갈래가 붙을지는 방향이 이미 정해 놓는다. 고를 것이 없다</text><text class="ink2 sm" x="40" y="318" text-anchor="start">가운데 화살표가 15장이 세운 방향이다</text></g>
</svg>