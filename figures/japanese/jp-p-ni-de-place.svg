<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한국어 한 갈래가 두 갈래로 갈리는 자리</title><desc id="d">왼쪽 한국어 조사 하나가 술어를 묻는 갈림을 지나 に 와 で 로 갈라진다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="32" text-anchor="start">같은 한국어 조사가 술어에 따라 두 갈래로 갈린다</text><rect x="40" y="120" width="130" height="64" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.8"/><text class="ink" x="105" y="147.5" text-anchor="middle">한국어</text><text class="ink" x="105" y="164.5" text-anchor="middle">에 · 에서</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M174 152 L224 152"/><rect x="230" y="106" width="190" height="92" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><text class="ink" x="325" y="147.5" text-anchor="middle">술어가 있음 · 없음 ·</text><text class="ink" x="325" y="164.5" text-anchor="middle">도착을 나타내는가</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M424 132 L474 92"/><text class="ink2 sm" x="438" y="108" text-anchor="start">그렇다</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M424 172 L474 218"/><text class="ink2 sm" x="432" y="212" text-anchor="start">아니다</text><rect x="480" y="46" width="300" height="96" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="500" y="82" text-anchor="start" style="font-size:26px">に</text><text class="ink" x="538" y="78" text-anchor="start">있는 곳 · 도착점</text><text class="ink" x="500" y="118" text-anchor="start" style="font-size:17px">きょうしつ<tspan fill="var(--s2)" font-weight="700">に</tspan>います</text><rect x="480" y="182" width="300" height="96" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="500" y="218" text-anchor="start" style="font-size:26px">で</text><text class="ink" x="538" y="214" text-anchor="start">동작이 일어나는 곳</text><text class="ink" x="500" y="254" text-anchor="start" style="font-size:17px">きょうしつ<tspan fill="var(--s2)" font-weight="700">で</tspan>べんきょうします</text></g>
</svg>