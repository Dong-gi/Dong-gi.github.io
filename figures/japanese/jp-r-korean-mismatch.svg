h class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M266 211 L494 209"/><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M266 258 L494 218"/><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M266 272 L494 271"/><text class="ink2 sm" x="40" y="312" text-anchor="start">위의 둘은 하나로 모이고, 맨 아래 하나는 둘로 갈라진다</text></g>
