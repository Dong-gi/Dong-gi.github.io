부분은 어느 꼴에서도 그대로다</text><text class="ink" x="540" y="157" text-anchor="middle">활용은 する 쪽에서만 일어난다</text><text class="ink" x="540" y="191" text-anchor="middle">しない · します · して · した</text><text class="ink" x="40" y="262" text-anchor="start">아는 한자어 명사의 수가 그대로 동사의 수가 된다</text><text class="ink2 sm" x="40" y="288" text-anchor="start">한국어에서 ‘-하다’ 가 붙는 자리와 대체로 겹친다. 다만 뜻이 갈린 낱말이 있다</text></g>
