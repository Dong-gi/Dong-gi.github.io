<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">순서를 바꿀 수 있는 자리와 바꿀 수 없는 자리</title><desc id="d">같은 문장을 세 순서로 놓았다. 앞의 둘은 성립하고, 술어를 끝에 두지 않은 셋째는 성립하지 않는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="60" y="30" text-anchor="start">같은 문장을 순서만 바꿔 본다. 색이 든 칸이 술어다</text><text class="ink2 sm" x="60" y="54" text-anchor="start">기본 순서</text><rect x="60" y="60" width="175" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="147.5" y="84" text-anchor="middle">やまださんが</text><rect x="245" y="60" width="150" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="320" y="84" text-anchor="middle">ほんを</text><rect x="405" y="60" width="180" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="495" y="84" text-anchor="middle">よみます</text><text class="ink2 sm" x="600" y="84" text-anchor="start">뜻이 정해진다</text><text class="ink2 sm" x="60" y="134" text-anchor="start">덩어리 순서를 바꾼 것</text><rect x="60" y="140" width="150" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="135" y="164" text-anchor="middle">ほんを</text><rect x="220" y="140" width="175" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="307.5" y="164" text-anchor="middle">やまださんが</text><rect x="405" y="140" width="180" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="495" y="164" text-anchor="middle">よみます</text><text class="ink2 sm" x="600" y="164" text-anchor="start">뜻이 같다</text><text class="f2 sm" x="60" y="214" text-anchor="start">술어를 끝에 두지 않은 것</text><rect x="60" y="220" width="175" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="147.5" y="244" text-anchor="middle">やまださんが</text><rect x="245" y="220" width="180" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="335" y="244" text-anchor="middle">よみます</text><rect x="435" y="220" width="150" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="510" y="244" text-anchor="middle">ほんを</text><text class="f2 sm" x="600" y="244" text-anchor="start">성립하지 않는다</text><text class="ink2 sm" x="60" y="294" text-anchor="start">바꿀 수 있는 것은 조사가 붙은 덩어리끼리의 순서다</text><text class="f2 sm" x="60" y="316" text-anchor="start">술어의 자리는 바꿀 수 없다</text></g>
</svg>