<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">동사가 몇 류인지 가리는 절차</title><desc id="d">세 번 물으면 갈린다. 마지막 물음에서만 답이 하나로 정해지지 않는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="250" y="18" width="260" height="34" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="380" y="39" text-anchor="middle">사전형을 본다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M380 56 L380 76"/><rect x="150" y="78" width="340" height="38" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="320" y="101" text-anchor="middle">する · くる 이거나 명사 + する 인가</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M494 97 L552 97"/><text class="ink2 sm" x="523" y="89" text-anchor="middle">예</text><rect x="556" y="74" width="180" height="46" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="646" y="92" text-anchor="middle">3류</text><text class="ink" x="646" y="110" text-anchor="middle">이 둘뿐이다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M380 120 L380 140"/><text class="ink2 sm" x="388" y="137" text-anchor="start">아니오</text><rect x="150" y="142" width="340" height="38" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="320" y="165" text-anchor="middle">끝이 る 인가</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M494 161 L552 161"/><text class="ink2 sm" x="523" y="153" text-anchor="middle">아니오</text><rect x="556" y="138" width="180" height="46" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="646" y="156" text-anchor="middle">1류</text><text class="ink" x="646" y="174" text-anchor="middle">갈릴 여지가 없다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M380 184 L380 204"/><text class="ink2 sm" x="388" y="201" text-anchor="start">예</text><rect x="150" y="206" width="340" height="38" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="320" y="229" text-anchor="middle">る 앞이 い단이나 え단인가</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M494 225 L552 225"/><text class="ink2 sm" x="523" y="217" text-anchor="middle">아니오</text><rect x="556" y="202" width="180" height="46" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="646" y="220" text-anchor="middle">1류</text><text class="ink" x="646" y="238" text-anchor="middle">예외가 없다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M380 248 L380 268"/><text class="ink2 sm" x="388" y="265" text-anchor="start">예</text><rect x="90" y="270" width="580" height="52" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="380" y="291" text-anchor="middle">2류인 것이 많다. 그러나 1류인 낱말이 섞여 있다</text><text class="ink" x="380" y="309" text-anchor="middle">이 자리에서만 사전이나 ます형으로 확인해야 한다</text><text class="ink2 sm" x="90" y="344" text-anchor="start">섞여 있는 1류 — かえる · はいる · きる · しる · いる 처럼 낱말째 익힌다</text></g>
</svg>