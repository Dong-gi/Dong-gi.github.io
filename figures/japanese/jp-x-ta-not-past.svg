<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">た형이 나타나는 자리 다섯</title><desc id="d">맨 위 하나만 지난 일이고 나머지 넷은 지난 일이 아니다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="40" y="122" width="130" height="60" rx="6" fill="none" stroke="var(--ink2)" stroke-width="2"/><text class="ink" x="105" y="156" text-anchor="middle">た형</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M174 152 L246 44"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M174 152 L246 108"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M174 152 L246 152"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M174 152 L246 196"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M174 152 L246 250"/><rect x="250" y="24" width="470" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="485" y="48" text-anchor="middle">지난 일 — きのう よんだ</text><rect x="250" y="88" width="470" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="485" y="112" text-anchor="middle">찾던 것을 찾은 순간 — あった</text><rect x="250" y="132" width="470" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="485" y="156" text-anchor="middle">지금 막 알아차림 — あした は やすみ だった</text><rect x="250" y="176" width="470" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="485" y="200" text-anchor="middle">명사를 꾸미는 자리의 상태 — まがった みち</text><rect x="250" y="230" width="470" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="485" y="254" text-anchor="middle">입말에서 재촉하는 굳은 표현 — どいた どいた</text><text class="ink" x="40" y="302" text-anchor="start">주황 상자 넷은 지난 일이 아니다. 맨 아래는 쓰이는 낱말이 정해져 있어 따로 표시했다</text><text class="ink2 sm" x="40" y="326" text-anchor="start">그래서 이 꼴을 과거형이라고만 부르면 설명되지 않는 자리가 남는다</text></g>
</svg>