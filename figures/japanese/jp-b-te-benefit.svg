<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">옮겨 가는 것이 물건에서 이득으로 바뀐다</title><desc id="d">위와 아래가 같은 모양이다. 선을 지나는 방식은 그대로이고 옮겨 가는 것만 다르다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="f1" x="300" y="40" text-anchor="middle">안</text><text class="ink2" x="560" y="40" text-anchor="middle">바깥</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-dasharray="6 5" d="M420 52 L420 278"/><text class="ink2 sm" x="44" y="100" text-anchor="start">물건이</text><text class="ink2 sm" x="44" y="118" text-anchor="start">옮겨 간다</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M280 96 L600 96"/><text class="f2" x="620" y="102" text-anchor="start" style="font-size:16px">あげる</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M600 138 L280 138"/><text class="f1" x="620" y="144" text-anchor="start" style="font-size:16px">くれる</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 4" d="M40 172 L720 172"/><text class="ink2 sm" x="44" y="210" text-anchor="start">이득이</text><text class="ink2 sm" x="44" y="228" text-anchor="start">옮겨 간다</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M280 206 L600 206"/><text class="f2" x="620" y="212" text-anchor="start" style="font-size:16px">〜てあげる</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M600 248 L280 248"/><text class="f1" x="620" y="254" text-anchor="start" style="font-size:16px">〜てくれる</text><text class="ink2 sm" x="44" y="300" text-anchor="start">한국어의 -어 주다 는 이 두 방향을 한 꼴로 적는다. 방향은 조사가 나른다</text></g>
</svg>