<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">조건의 잇는 말 넷과 겹치는 자리</title><desc id="d">넷이 가운데의 넓은 겹침을 함께 쓰고, 바깥쪽에 저마다 자기만 하는 일을 하나씩 가진다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">넷이 나눠 가진 영역은 가운데에서 크게 겹친다</text><rect x="280" y="130" width="200" height="76" rx="38" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="6 4"/><text class="ink sm" x="380" y="152" text-anchor="middle">겹치는 자리</text><text class="ink sm" x="380" y="172" text-anchor="middle">둘 이상이 다 되는</text><text class="ink sm" x="380" y="192" text-anchor="middle">문장이 많다</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 4" d="M330 92 L300 150"/><rect x="40" y="48" width="290" height="64" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="60" y="90" text-anchor="start" style="font-size:21px;font-weight:600">と</text><text class="ink sm" x="114" y="76" text-anchor="start">앞이 성립하면 언제나</text><text class="ink sm" x="114" y="98" text-anchor="start">뒤가 따라온다</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 4" d="M430 92 L460 150"/><rect x="430" y="48" width="290" height="64" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="450" y="90" text-anchor="start" style="font-size:21px;font-weight:600">ば</text><text class="ink sm" x="504" y="76" text-anchor="start">일반적인 조건.</text><text class="ink sm" x="504" y="98" text-anchor="start">속담이 이 꼴이다</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 4" d="M330 260 L300 194"/><rect x="40" y="240" width="290" height="64" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="60" y="282" text-anchor="start" style="font-size:21px;font-weight:600">たら</text><text class="ink sm" x="114" y="268" text-anchor="start">그 일이 일어난 뒤.</text><text class="ink sm" x="114" y="290" text-anchor="start">제약이 가장 적다</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 4" d="M430 260 L460 194"/><rect x="430" y="240" width="290" height="64" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="450" y="282" text-anchor="start" style="font-size:21px;font-weight:600">なら</text><text class="ink sm" x="504" y="268" text-anchor="start">상대가 말한 것을 받는다.</text><text class="ink sm" x="504" y="290" text-anchor="start">앞뒤의 때가 뒤집힐 수 있다</text><text class="ink" x="40" y="326" text-anchor="start">가르는 시험은 뒤 절에 무엇이 오는가다. 부탁이나 명령이 오면 왼쪽 위가 빠진다</text></g>
</svg>