<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" width="760" height="326" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">절 안과 절 밖에 무엇이 오는가</title><desc id="d">명사를 꾸미는 절 안에는 주격 표시만 오고 주제 표시는 오지 못한다. 절 밖의 주제 표시는 문장 전체에 걸린다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="34" text-anchor="start">한 문장 안에 절이 들어 있을 때 어느 쪽에 무엇이 오는가</text><rect x="40" y="54" width="680" height="150" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.8"/><text class="ink2 sm" x="58" y="78" text-anchor="start">문장</text><rect x="70" y="92" width="330" height="94" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink2 sm" x="88" y="112" text-anchor="start">절 — 명사를 꾸미는 자리</text><rect x="90" y="126" width="130" height="44" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="155" y="143.5" text-anchor="middle">が</text><text class="ink" x="155" y="160.5" text-anchor="middle">온다</text><rect x="250" y="126" width="130" height="44" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="315" y="143.5" text-anchor="middle">は</text><text class="ink" x="315" y="160.5" text-anchor="middle">못 온다</text><text class="ink2 sm" x="450" y="112" text-anchor="start">절 밖 — 문장의 주제 자리</text><rect x="450" y="126" width="150" height="44" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="525" y="143.5" text-anchor="middle">は</text><text class="ink" x="525" y="160.5" text-anchor="middle">온다</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 3" d="M404 148 L446 148"/><text class="ink" x="40" y="240" text-anchor="start">절 안에서는 고를 여지가 없다. 아는 것이든 처음 나오는 것이든 が 가 온다</text><text class="ink2 sm" x="40" y="268" text-anchor="start">한국어도 이 자리에 은/는 을 넣지 못한다. 규칙의 모양은 겹친다</text><text class="ink2 sm" x="40" y="294" text-anchor="start">어긋나는 것은 판단의 근거다. 아는 것이니 은/는 이라는 감각이 여기서 헛돈다</text><text class="ink2 sm" x="40" y="318" text-anchor="start">문장 앞의 は 는 절 안으로 들어가지 않고 문장 전체에 걸린다</text></g>
</svg>