<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">두 보통체가 갈리는 문형과 갈리지 않는 문형</title><desc id="d">명사문과 な형용사문에서만 두 꼴이 다르고, い형용사문과 동사문에서는 같은 꼴이다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">아래 두 줄은 두 칸이 같다. 그래서 문체를 알아보려면 앞의 두 줄을 봐야 한다</text><text class="ink2 sm" x="60" y="66" text-anchor="start">문형</text><text class="f1 sm" x="360" y="66" text-anchor="middle">だ 쪽</text><text class="f3 sm" x="600" y="66" text-anchor="middle">である 쪽</text><text class="f3 sm" x="40" y="100" text-anchor="start">명사문</text><text class="f3 sm" x="40" y="118" text-anchor="start">갈린다</text><rect x="240" y="76" width="230" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="355" y="100" text-anchor="middle">がくせいだ</text><rect x="500" y="76" width="230" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="615" y="100" text-anchor="middle">がくせいである</text><text class="f3 sm" x="40" y="152" text-anchor="start">な형용사문</text><text class="f3 sm" x="40" y="170" text-anchor="start">갈린다</text><rect x="240" y="128" width="230" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="355" y="152" text-anchor="middle">しずかだ</text><rect x="500" y="128" width="230" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="615" y="152" text-anchor="middle">しずかである</text><text class="ink2 sm" x="40" y="210" text-anchor="start">い형용사문</text><rect x="240" y="186" width="230" height="40" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="355" y="210" text-anchor="middle">たかい</text><rect x="500" y="186" width="230" height="40" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="615" y="210" text-anchor="middle">たかい</text><text class="ink2 sm" x="40" y="262" text-anchor="start">동사문</text><rect x="240" y="238" width="230" height="40" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="355" y="262" text-anchor="middle">よむ</text><rect x="500" y="238" width="230" height="40" rx="6" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink" x="615" y="262" text-anchor="middle">よむ</text><text class="ink2 sm" x="40" y="296" text-anchor="start">회색으로 그린 두 줄은 두 쪽이 글자까지 같은 자리다</text></g>
</svg>