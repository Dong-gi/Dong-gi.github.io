<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">동사의 성질이 ている 의 뜻을 정하는 방식</title><desc id="d">시간이 걸리는 동사에서는 일의 안쪽을, 한순간에 끝나는 동사에서는 끝난 뒤를 가리킨다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="f1" x="40" y="30" text-anchor="start">시간이 걸리는 동사 — よむ · かく · たべる · ふる</text><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M50 92 L726 92"/><rect x="200" y="78" width="300" height="28" rx="4" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink2 sm" x="350" y="72" text-anchor="middle">일이 걸쳐 있는 구간</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M350 150 L350 110"/><text class="f1" x="350" y="168" text-anchor="middle">ている 이 가리키는 곳 — 하는 중</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="5 4" d="M40 202 L720 202"/><text class="f2" x="40" y="236" text-anchor="start">한순간에 끝나는 동사 — くる · しぬ · すわる · けっこんする</text><path class="ax" fill="none" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M50 292 L726 292"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" d="M280 272 V312"/><text class="ink2 sm" x="280" y="266" text-anchor="middle">일이 일어난 한 점</text><rect x="280" y="278" width="260" height="28" rx="4" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-dasharray="5 4"/><text class="ink2 sm" x="410" y="296" text-anchor="middle">끝난 뒤의 상태</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M410 350 L410 310"/><text class="f2" x="410" y="368" text-anchor="middle">ている 이 가리키는 곳 — 결과 상태</text></g>
</svg>