<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">모르는 한자를 찾는 절차</title><desc id="d">글이 디지털인지, 부수를 짚을 수 있는지에 따라 길이 갈리고, 마지막에 낱말을 다시 찾는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="250" y="22" width="260" height="38" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="380" y="45" text-anchor="middle">모르는 한자를 만났다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M380 64 L380 86"/><rect x="250" y="88" width="260" height="38" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="380" y="111" text-anchor="middle">글이 디지털인가</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M514 107 L588 107"/><text class="ink2 sm" x="551" y="99" text-anchor="middle">예</text><rect x="592" y="83" width="155" height="48" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="669.5" y="102.5" text-anchor="middle">복사해서 사전에</text><text class="ink" x="669.5" y="119.5" text-anchor="middle">붙여 넣는다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M380 130 L380 152"/><text class="ink2 sm" x="388" y="148" text-anchor="start">아니오</text><rect x="230" y="154" width="300" height="38" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="380" y="177" text-anchor="middle">부수를 짚을 수 있는가</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M534 173 L588 173"/><text class="ink2 sm" x="561" y="165" text-anchor="middle">예</text><rect x="592" y="149" width="155" height="48" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="669.5" y="168.5" text-anchor="middle">부수 색인에서</text><text class="ink" x="669.5" y="185.5" text-anchor="middle">획수 순으로 찾는다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M380 196 L380 218"/><text class="ink2 sm" x="388" y="214" text-anchor="start">아니오</text><rect x="180" y="220" width="400" height="48" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="380" y="239.5" text-anchor="middle">총획수 색인으로 찾거나</text><text class="ink" x="380" y="256.5" text-anchor="middle">기기의 손글씨 입력을 쓴다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M380 272 L380 294"/><rect x="120" y="296" width="520" height="54" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="380" y="318.5" text-anchor="middle">여기까지가 글자 찾기다. 얻는 것은 음독과 훈독의 목록이다</text><text class="ink" x="380" y="335.5" text-anchor="middle">낱말이 그중 어느 것을 쓰는지는 낱말로 다시 찾는다</text></g>
</svg>