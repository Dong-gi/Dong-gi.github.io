<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="32" text-anchor="start">촉음이 없으면</text><rect x="40" y="44" width="56" height="52" rx="7" class="s1" fill="none" stroke-width="1.6"/><text class="ink" x="68" y="79.36" text-anchor="middle" font-size="28">き</text><rect x="104" y="44" width="56" height="52" rx="7" class="s1" fill="none" stroke-width="1.6"/><text class="ink" x="132" y="79.36" text-anchor="middle" font-size="28">て</text><text class="ink" x="184" y="75" text-anchor="start">박 둘</text><text class="ink2 sm" x="40" y="140" text-anchor="start">촉음이 있으면</text><rect x="40" y="152" width="56" height="52" rx="7" class="s1" fill="none" stroke-width="1.6"/><text class="ink" x="68" y="187.36" text-anchor="middle" font-size="28">き</text><rect x="104" y="152" width="56" height="52" rx="7" class="s2" fill="none" stroke-width="2.6"/><rect x="104" y="152" width="56" height="52" rx="7" class="f2" fill-opacity="0.12" stroke="none"/><text class="ink" x="132" y="187.36" text-anchor="middle" font-size="28">っ</text><rect x="168" y="152" width="56" height="52" rx="7" class="s1" fill="none" stroke-width="1.6"/><text class="ink" x="196" y="187.36" text-anchor="middle" font-size="28">て</text><text class="ink" x="248" y="183" text-anchor="start">박 셋</text><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M132 210 L132 230"/><text class="ink2 sm" x="40" y="254" text-anchor="start">소리가 나지 않는 칸이다. 그래도 한 박이다</text></g>
