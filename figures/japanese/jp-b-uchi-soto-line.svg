<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">경계가 움직인다 — 같은 사람이 두 문장에서 다른 쪽에 놓인다</title><desc id="d">가운데 사람은 그대로이고, 문장에 함께 나온 사람이 달라지면서 경계선이 옮겨 간다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="f1 sm" x="240" y="52" text-anchor="end">안</text><text class="ink2 sm" x="262" y="52" text-anchor="start">바깥</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-dasharray="6 5" d="M250 58 L250 132"/><rect x="126" y="68" width="88" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="170" y="95" text-anchor="middle">나</text><rect x="288" y="68" width="88" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="f2" x="332" y="95" text-anchor="middle">동생</text><text class="ink" x="410" y="92" text-anchor="start" style="font-size:15px">わたしは おとうとに あげました</text><text class="f2 sm" x="410" y="114" text-anchor="start">동생이 바깥이다</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 4" d="M40 148 L720 148"/><path class="s2" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M252 148 L342 148"/><text class="f2 sm" x="358" y="142" text-anchor="start">경계가 이만큼 옮겨 간다</text><text class="f1 sm" x="338" y="186" text-anchor="end">안</text><text class="ink2 sm" x="360" y="186" text-anchor="start">바깥</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-dasharray="6 5" d="M348 192 L348 266"/><rect x="126" y="202" width="88" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="170" y="229" text-anchor="middle">나</text><rect x="226" y="202" width="88" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="f2" x="270" y="229" text-anchor="middle">동생</text><rect x="384" y="202" width="88" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="428" y="229" text-anchor="middle">친구</text><text class="ink" x="500" y="226" text-anchor="start" style="font-size:14px">ともだちが おとうとに くれました</text><text class="f1 sm" x="500" y="248" text-anchor="start">동생이 안이다</text><text class="ink2 sm" x="44" y="284" text-anchor="start">주황 상자는 두 줄에서 같은 사람이다. 선을 옮긴 것은 함께 나온 사람이다</text></g>
