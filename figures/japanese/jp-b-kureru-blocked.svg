<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한 동사가 못 오는 두 자리</title><desc id="d">세 줄 모두 같은 동사를 쓰려 한 것이고, 화살 머리가 안에 있는 줄만 성립한다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="44" y="32" text-anchor="start">세 줄 모두 くれる 를 쓰려 한 자리다</text><text class="f1 sm" x="322" y="60" text-anchor="middle">안</text><text class="ink2 sm" x="560" y="60" text-anchor="middle">바깥</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-dasharray="6 5" d="M430 70 L430 250"/><text class="ink2 sm" x="44" y="104" text-anchor="start">바깥에서 안으로</text><text class="f3" x="196" y="110" text-anchor="start" style="font-size:19px">○</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M700 100 L262 100"/><text class="f3 sm" x="262" y="84" text-anchor="middle">도착점</text><text class="ink2 sm" x="44" y="162" text-anchor="start">바깥에서 바깥으로</text><text class="f2" x="196" y="168" text-anchor="start" style="font-size:19px">×</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M700 158 L480 158"/><text class="f2 sm" x="480" y="142" text-anchor="middle">도착점</text><text class="ink2 sm" x="44" y="220" text-anchor="start">안에서 바깥으로</text><text class="f2" x="196" y="226" text-anchor="start" style="font-size:19px">×</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M262 216 L700 216"/><text class="f2 sm" x="700" y="200" text-anchor="middle">도착점</text><text class="ink2 sm" x="44" y="272" text-anchor="start">막힌 두 줄의 공통점은 하나다 — 화살 머리가 선의 바깥쪽에 있다</text></g>
</svg>