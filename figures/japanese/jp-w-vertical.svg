<title id="t">세로쓰기의 진행 방향</title><desc id="d">글자는 위에서 아래로, 줄은 오른쪽에서 왼쪽으로 나아가는 것을 화살표로 보인 것</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
