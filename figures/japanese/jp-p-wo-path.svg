<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">を 가 표시하는 경로와 기점, 그리고 で 와의 대조</title><desc id="d">왼쪽은 선을 따라가는 움직임, 가운데는 영역을 벗어나는 움직임, 오른쪽은 영역 안에 머무는 동작이다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="40" y="50" width="232" height="118" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4"/><text class="ink2 sm" x="52" y="44" text-anchor="start">경로 — 선을 따라간다</text><path class="gr" d="M60 130 H252"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M70 108 L244 108"/><text class="ink2 sm" x="60" y="152" text-anchor="start">길 위를 지나간다</text><text class="ink" x="40" y="196" text-anchor="start" style="font-size:18px">みち<tspan fill="var(--s2)" font-weight="700">を</tspan>あるきます</text><text class="ink2 sm" x="40" y="222" text-anchor="start">길을 걷습니다</text><rect x="290" y="50" width="232" height="118" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4"/><text class="ink2 sm" x="302" y="44" text-anchor="start">기점 — 영역을 벗어난다</text><rect x="306" y="84" width="62" height="60" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="337" y="158" text-anchor="middle">집</text><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M376 114 L500 114"/><text class="ink" x="290" y="196" text-anchor="start" style="font-size:18px">いえ<tspan fill="var(--s2)" font-weight="700">を</tspan>でます</text><text class="ink2 sm" x="290" y="222" text-anchor="start">집을 나섭니다</text><rect x="540" y="50" width="232" height="118" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4"/><text class="ink2 sm" x="552" y="44" text-anchor="start">장소 — 영역 안에 머문다</text><rect x="576" y="82" width="160" height="66" rx="30" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-dasharray="5 4"/><circle class="f1" cx="656" cy="115" r="5"/><text class="ink2 sm" x="656" y="158" text-anchor="middle">공원 안</text><text class="ink" x="540" y="196" text-anchor="start" style="font-size:18px">こうえん<tspan fill="var(--s1)" font-weight="700">で</tspan>あいます</text><text class="ink2 sm" x="540" y="222" text-anchor="start">공원에서 만납니다</text></g>
</svg>