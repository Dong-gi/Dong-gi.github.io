<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="32" text-anchor="start">붙는 순서가 고정되어 있다</text><text class="ink2 sm" x="214" y="62" text-anchor="middle">격조사 자리</text><text class="ink2 sm" x="292" y="62" text-anchor="middle">부조사 자리</text><rect x="40" y="76" width="130" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="105" y="108" text-anchor="middle" style="font-size:17px">とうきょう</text><rect x="178" y="76" width="72" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="214" y="108" text-anchor="middle" style="font-size:20px">に</text><rect x="258" y="76" width="72" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="294" y="108" text-anchor="middle" style="font-size:20px">も</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M340 99 L386 99"/><text class="ink" x="400" y="106" text-anchor="start" style="font-size:20px">とうきょう<tspan fill="var(--s2)" font-weight="700">にも</tspan></text><text class="ink" x="600" y="103" text-anchor="start">도쿄에도</text><rect x="40" y="152" width="130" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="105" y="184" text-anchor="middle" style="font-size:20px">ほん</text><rect x="178" y="152" width="72" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-dasharray="5 4"/><text class="ink" x="214" y="184" text-anchor="middle" style="font-size:20px">を</text><text class="ink" x="214" y="186" text-anchor="middle" fill="var(--s2)" style="font-size:30px">×</text><rect x="258" y="152" width="72" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="294" y="184" text-anchor="middle" style="font-size:20px">も</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M340 175 L386 175"/><text class="ink" x="400" y="182" text-anchor="start" style="font-size:20px">ほん<tspan fill="var(--s2)" font-weight="700">も</tspan></text><text class="ink" x="600" y="172" text-anchor="start">앞자리가 비워진다</text><text class="ink2 sm" x="600" y="190" text-anchor="start">주격 · 대격 조사만 그렇다</text><rect x="40" y="228" width="130" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="105" y="260" text-anchor="middle" style="font-size:17px">とうきょう</text><rect x="178" y="228" width="72" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="214" y="260" text-anchor="middle" style="font-size:20px">も</text><rect x="258" y="228" width="72" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="294" y="260" text-anchor="middle" style="font-size:20px">に</text><text class="ink" x="340" y="262" text-anchor="start" fill="var(--s2)" style="font-size:30px">×</text><text class="ink" x="386" y="255" text-anchor="start">이 순서로는 붙지 않는다</text><text class="ink2 sm" x="40" y="296" text-anchor="start">가운데 두 자리의 순서가 바뀌는 일이 없다</text></g>
</svg>