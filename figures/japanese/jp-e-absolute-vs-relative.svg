<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">두 언어에서 높임의 대상이 무엇으로 정해지는가</title><desc id="d">같은 사람에 대해 두 자리에서 말할 때, 왼쪽 언어는 두 자리에서 같은 높임을 쓰고 오른쪽 언어는 자리에 따라 갈린다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">같은 사람(직장 상사)에 대해 말한다. 듣는 사람만 바꾼다</text><text class="ink2 sm" x="40" y="62" text-anchor="start">한국어 — 기준이 사람에게 있다</text><rect x="40" y="74" width="150" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="115" y="93" text-anchor="middle">듣는 사람이</text><text class="ink sm" x="115" y="109" text-anchor="middle">같은 직장 사람</text><rect x="40" y="132" width="150" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="115" y="151" text-anchor="middle">듣는 사람이</text><text class="ink sm" x="115" y="167" text-anchor="middle">다른 회사 사람</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M196 97 L236 97"/><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M196 155 L236 155"/><rect x="242" y="74" width="118" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="301" y="101" text-anchor="middle">높인다</text><rect x="242" y="132" width="118" height="46" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="301" y="159" text-anchor="middle">높인다</text><rect x="40" y="196" width="320" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="200" y="220" text-anchor="middle">두 자리에서 같다</text><path fill="none" stroke="var(--grid)" stroke-width="2.4" stroke-dasharray="8 5" d="M388 56 V250"/><text class="ink2 sm" x="416" y="62" text-anchor="start">일본어 — 기준이 자리에 있다</text><rect x="416" y="74" width="150" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="491" y="93" text-anchor="middle">듣는 사람이</text><text class="ink sm" x="491" y="109" text-anchor="middle">같은 직장 사람</text><rect x="416" y="132" width="150" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="491" y="151" text-anchor="middle">듣는 사람이</text><text class="ink sm" x="491" y="167" text-anchor="middle">다른 회사 사람</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M572 97 L612 97"/><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M572 155 L612 155"/><rect x="618" y="74" width="102" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="669" y="101" text-anchor="middle">높인다</text><rect x="618" y="132" width="102" height="46" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="669" y="151" text-anchor="middle">높이지</text><text class="ink sm" x="669" y="167" text-anchor="middle">않는다</text><rect x="416" y="196" width="304" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink" x="568" y="220" text-anchor="middle">두 자리에서 갈린다</text><text class="ink" x="40" y="268" text-anchor="start">갈리는 것은 상사의 지위가 아니다. 지위는 두 자리에서 같다</text><text class="ink" x="40" y="292" text-anchor="start">갈리는 것은 그 상사가 말하는 자리에서 안에 있는지 바깥에 있는지다</text><text class="ink2 sm" x="40" y="318" text-anchor="start">왼쪽 열은 자리를 보지 않고 오른쪽 열은 자리를 먼저 본다</text></g>
</svg>