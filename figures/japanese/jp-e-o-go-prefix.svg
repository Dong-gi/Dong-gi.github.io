<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">두 접두사를 가리는 기준과 접두사가 하는 두 가지 일</title><desc id="d">어느 접두사가 붙는지는 낱말의 읽는 법이 대체로 정하고, 그 접두사가 무엇을 하는지는 그 낱말이 누구의 것인지가 정한다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">물음이 둘이다. 어느 것이 붙는가, 그리고 그것이 무엇을 하는가</text><text class="ink2 sm" x="40" y="60" text-anchor="start">물음 1 — 어느 것이 붙는가</text><rect x="40" y="74" width="130" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="105" y="98" text-anchor="middle">훈독 낱말</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M176 94 L216 94"/><rect x="222" y="74" width="66" height="40" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="255" y="98" text-anchor="middle">お</text><text class="ink" x="300" y="98" text-anchor="start">おなまえ・おてがみ</text><rect x="40" y="124" width="130" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="105" y="148" text-anchor="middle">음독 낱말</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M176 144 L216 144"/><rect x="222" y="124" width="66" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="255" y="148" text-anchor="middle">ご</text><text class="ink" x="300" y="148" text-anchor="start">ごじゅうしょ・ごいけん</text><rect x="40" y="174" width="248" height="36" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink sm" x="164" y="196" text-anchor="middle">예외 — 음독인데 お 가 붙는다</text><text class="ink" x="300" y="196" text-anchor="start">おでんわ・おじかん・おさけ</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 4" d="M40 228 L720 228"/><text class="ink2 sm" x="40" y="252" text-anchor="start">물음 2 — 무엇을 하는가. 그 낱말이 누구의 것인지를 물으면 갈린다</text><rect x="40" y="264" width="300" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="190" y="285" text-anchor="middle">상대의 것이다 — 높인다</text><text class="ink" x="352" y="286" text-anchor="start">おなまえ・ごいけん</text><rect x="40" y="304" width="300" height="34" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="190" y="325" text-anchor="middle">누구의 것도 아니다 — 곱게 만든다</text><text class="ink" x="352" y="326" text-anchor="start">おさけ・おちゃ</text></g>
</svg>