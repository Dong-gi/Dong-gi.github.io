<title id="t">に 와 で 의 용법 갈래</title><desc id="d">に 는 여섯 갈래, で 는 일곱 갈래를 가지고, 그중 진한 테두리를 두른 앞쪽 갈래에서만 서로 부딪힌다.</desc>
