height="30" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="435" y="105" text-anchor="middle">み</text><text class="ink" x="478" y="106" text-anchor="start">みない · みます · みる</text><text class="ink" x="478" y="128" text-anchor="start">みれば · みよう</text><text class="ink2 sm" x="404" y="176" text-anchor="start">え단에 머무는 것</text><rect x="404" y="188" width="62" height="30" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="435" y="207" text-anchor="middle">たべ</text><text class="ink" x="478" y="208" text-anchor="start">たべない · たべます · たべる</text><text class="ink" x="478" y="230" text-anchor="start">たべれば · たべよう</text><text class="ink2 sm" x="40" y="320" text-anchor="start">학교문법이 이 둘을 ‘다섯 단’ 과 ‘한 단’ 으로 이름 붙인 까닭이 이 그림이다</text></g>
