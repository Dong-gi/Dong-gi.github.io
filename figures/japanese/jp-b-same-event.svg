<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한 사건에 두 동사가 붙는 까닭</title><desc id="d">물건이 옮겨 가는 화살은 하나뿐이고, 말하는 사람이 어느 쪽에 서는가에 따라 동사가 갈린다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="112" y="36" width="250" height="62" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink2 sm" x="237" y="60" text-anchor="middle">말하는 사람이 이쪽에 서면</text><text class="f2" x="237" y="88" text-anchor="middle" style="font-size:19px">あげる</text><path fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-dasharray="4 4" d="M237 98 L237 136"/><rect x="180" y="136" width="116" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="238" y="166.5" text-anchor="middle" style="font-size:17px">たなか</text><rect x="470" y="136" width="116" height="46" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="528" y="166.5" text-anchor="middle" style="font-size:17px">やまだ</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M306 159 L462 159"/><text class="ink2 sm" x="384" y="130" text-anchor="middle">책 하나 — 사건은 하나뿐이다</text><path fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-dasharray="4 4" d="M528 182 L528 220"/><rect x="403" y="220" width="250" height="62" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink2 sm" x="528" y="244" text-anchor="middle">말하는 사람이 이쪽에 서면</text><text class="f1" x="528" y="272" text-anchor="middle" style="font-size:19px">くれる</text><text class="ink2 sm" x="44" y="306" text-anchor="start">화살은 그대로다. 옮겨 간 것은 말하는 사람의 자리이고, 그것이 동사를 바꾼다</text></g>
</svg>