.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="145" y="54" text-anchor="middle">주어</text><text class="ink2 sm" x="226" y="54" text-anchor="middle">조사</text><text class="ink2 sm" x="350" y="54" text-anchor="middle">목적어</text><text class="ink2 sm" x="426" y="54" text-anchor="middle">조사</text><text class="ink2 sm" x="605" y="54" text-anchor="middle">술어</text><text class="ink2 sm" x="20" y="98" text-anchor="start">한국어</text><rect x="90" y="74" width="110" height="38" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="145" y="97" text-anchor="middle">나</text><rect x="204" y="74" width="44" height="38" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="226" y="97" text-anchor="middle">가</text><rect x="300" y="74" width="100" height="38" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="350" y="97" text-anchor="middle">책</text><rect x="404" y="74" width="44" height="38" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="426" y="97" text-anchor="middle">을</text><rect x="510" y="74" width="190" height="38" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="605" y="97" text-anchor="middle">읽습니다</text><text class="ink2 sm" x="20" y="198" text-anchor="start">일본어</text><rect x="90" y="174" width="110" height="38" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="145" y="197" text-anchor="middle">わたし</text><rect x="204" y="174" width="44" height="38" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="226" y="197" text-anchor="middle">が</text><rect x="300" y="174" width="100" height="38" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="350" y="197" text-anchor="middle">ほん</text><rect x="404" y="174" width="44" height="38" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="426" y="197" text-anchor="middle">を</text><rect x="510" y="174" width="190" height="38" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="605" y="197" text-anchor="middle">よみます</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 3" d="M145 112 L145 174"/><path fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-dasharray="4 3" d="M226 112 L226 174"/><path fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="4 3" d="M350 112 L350 174"/><path fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-dasharray="4 3" d="M426 112 L426 174"/><path fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-dasharray="4 3" d="M605 112 L605 174"/><text class="ink2 sm" x="90" y="248" text-anchor="start">자리가 하나씩 맞물린다. 조사가 붙는 자리까지 같다</text><text class="ink2 sm" x="90" y="270" text-anchor="start">어순을 새로 익힐 것이 없다는 뜻이다</text></g>
