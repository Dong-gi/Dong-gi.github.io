<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 262" width="700" height="262" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">로마자 표기가 두 갈래로 갈리는 자리</title><desc id="d">가나 여섯 칸에 두 로마자 표기 체계를 나란히 적어, 여섯 칸 가운데 다섯 칸이 서로 다르게 적힌다는 것을 보인 것</desc>
<style>
