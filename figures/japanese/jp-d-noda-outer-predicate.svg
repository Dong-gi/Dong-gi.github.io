<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">설명을 대는 층이 새 술어가 되는 모양</title><desc id="d">안쪽 문장은 보통체로 끝난 꼴로 들어가고, 정중함은 그 층 뒤에서 다시 표시된다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">안쪽 문장이 통째로 들어가고, 정중함은 그 뒤에서 다시 붙는다</text><text class="ink2 sm" x="60" y="60" text-anchor="start">안쪽 — 보통체로 끝난 꼴</text><text class="ink2 sm" x="408" y="60" text-anchor="middle">태도</text><text class="ink2 sm" x="510" y="60" text-anchor="middle">정중함</text><rect x="60" y="70" width="300" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="210" y="94" text-anchor="middle">よむ</text><rect x="370" y="70" width="76" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="408" y="94" text-anchor="middle">の</text><rect x="452" y="70" width="116" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="510" y="94" text-anchor="middle">です</text><text class="ink2 sm" x="586" y="94" text-anchor="start">읽는 사정이다</text><rect x="60" y="130" width="300" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="210" y="154" text-anchor="middle">よまない</text><rect x="370" y="130" width="76" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="408" y="154" text-anchor="middle">の</text><rect x="452" y="130" width="116" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="510" y="154" text-anchor="middle">です</text><text class="ink2 sm" x="586" y="154" text-anchor="start">부정이 안쪽에 있다</text><rect x="60" y="190" width="300" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="210" y="214" text-anchor="middle">よまなかった</text><rect x="370" y="190" width="76" height="40" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="408" y="214" text-anchor="middle">の</text><rect x="452" y="190" width="116" height="40" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="510" y="214" text-anchor="middle">です</text><text class="ink2 sm" x="586" y="214" text-anchor="start">때도 안쪽에 있다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M60 246 L360 246"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M60 240 L60 246"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M360 240 L360 246"/><text class="ink2 sm" x="60" y="268" text-anchor="start">이 자리가 바뀌어도 오른쪽 두 칸은 그대로다</text><text class="f2 sm" x="60" y="292" text-anchor="start">그래서 이 꼴을 쓰면 정중함이 문장 끝으로 한 번 더 옮겨 간다</text></g>
</svg>