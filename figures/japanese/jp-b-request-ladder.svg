<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">부탁하는 네 꼴 — 걸린 조작의 수</title><desc id="d">왼쪽에서 오른쪽으로 갈수록 조작이 하나씩 더 걸린다. 조작의 수가 부드러움의 정도와 함께 간다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="40" y="34" text-anchor="start">같은 동작을 부탁하는 네 꼴. 위에 적은 것이 그 꼴에 새로 걸린 조작이다</text><text class="ink2 sm" x="101" y="108" text-anchor="middle">조작 없음</text><text class="f1 sm" x="264" y="90" text-anchor="middle">은혜의 방향</text><text class="f1 sm" x="264" y="108" text-anchor="middle">물음</text><text class="f1 sm" x="450" y="108" text-anchor="middle">받는 쪽으로</text><text class="f1 sm" x="647" y="90" text-anchor="middle">부정 물음</text><text class="f1 sm" x="647" y="108" text-anchor="middle">정중한 꼴</text><rect x="36" y="126" width="130" height="52" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="101" y="158.5" text-anchor="middle" style="font-size:15px">まって。</text><rect x="182" y="126" width="164" height="52" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="264" y="158.5" text-anchor="middle" style="font-size:15px">まってくれる？</text><rect x="362" y="126" width="176" height="52" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="450" y="158.5" text-anchor="middle" style="font-size:15px">まってもらえる？</text><rect x="554" y="126" width="186" height="52" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="647" y="158" text-anchor="middle" style="font-size:14px">まってもらえませんか。</text><text class="ink2 sm" x="101" y="200" text-anchor="middle">조작 0</text><text class="ink2 sm" x="264" y="200" text-anchor="middle">조작 2</text><text class="ink2 sm" x="450" y="200" text-anchor="middle">조작 3</text><text class="ink2 sm" x="647" y="200" text-anchor="middle">조작 5</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M40 226 L730 226"/><text class="ink2 sm" x="385" y="250" text-anchor="middle">조작이 겹칠수록 부드러워진다</text><text class="ink2 sm" x="40" y="288" text-anchor="start">조작이 적은 꼴이 틀린 꼴은 아니다 — 가까운 사이에서 쓰는 짧은 꼴이다</text></g>
</svg>