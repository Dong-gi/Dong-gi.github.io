<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">어느 갈래인지 가리는 절차</title><desc id="d">표기가 い 로 끝나는지 먼저 묻고, 그 다음 예외 목록을 묻는다. 확실하지 않을 때의 시험을 아래에 적었다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><rect x="50" y="26" width="330" height="46" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text x="215" y="54" text-anchor="middle" class="ink" style="font-size:14px">사전형의 표기가 い 로 끝나는가</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M384 49 L442 49"/><text class="ink2 sm" x="413" y="40" text-anchor="middle">아니오</text><rect x="446" y="26" width="264" height="46" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text x="578" y="54" text-anchor="middle" class="ink" style="font-size:14px">い형용사가 아니다</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M215 76 L215 104"/><text class="ink2 sm" x="223" y="96" text-anchor="start">예</text><rect x="50" y="106" width="330" height="48" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text x="215" y="126" text-anchor="middle" class="ink" style="font-size:14px">예외 목록에 드는 낱말인가</text><text x="215" y="144" text-anchor="middle" class="ink2" style="font-size:12px">きらい · きれい · ていねい</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M384 130 L442 130"/><text class="ink2 sm" x="413" y="121" text-anchor="middle">예</text><rect x="446" y="108" width="264" height="46" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text x="578" y="136" text-anchor="middle" class="ink" style="font-size:14px">な형용사</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M215 158 L215 186"/><text class="ink2 sm" x="223" y="178" text-anchor="start">아니오</text><rect x="50" y="188" width="330" height="46" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text x="215" y="216" text-anchor="middle" class="ink" style="font-size:14px">い형용사</text><text class="ink2 sm" x="400" y="214" text-anchor="start">가나로만 적는 낱말에는 첫 물음이 통하지 않는다</text><rect x="50" y="268" width="660" height="100" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text x="380" y="294.5" text-anchor="middle" class="ink" style="font-size:14px;font-weight:600">확실하지 않으면 시험한다</text><text x="380" y="313.5" text-anchor="middle" class="ink" style="font-size:13px">명사 앞에 놓아 본다 — な 가 필요하면 な형용사</text><text x="380" y="332.5" text-anchor="middle" class="ink" style="font-size:13px">과거로 만들어 본다 — かった 가 붙으면 い형용사</text><text x="380" y="351.5" text-anchor="middle" class="ink" style="font-size:13px">처음 보는 낱말은 사전이 갈래를 적어 준다</text></g>
</svg>