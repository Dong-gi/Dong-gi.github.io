<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">같은 갈래를 몇 겹 쌓았는지 세는 법</title><desc id="d">특별한 낱말과 틀과 수동과 같은 꼴을 겹쳐 쌓으면 같은 갈래가 세 번 붙는다. 규범과 실사용을 나눠 적는 자리다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">존경어를 만드는 방법 셋을 한 낱말에 겹쳐 쌓았다</text><rect x="40" y="52" width="240" height="38" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="160" y="75" text-anchor="middle">めしあがる</text><text class="ink2 sm" x="300" y="76" text-anchor="start">1겹 — 특별한 낱말</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M160 92 L160 108"/><rect x="40" y="112" width="240" height="38" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="160" y="135" text-anchor="middle">おめしあがりになる</text><text class="ink2 sm" x="300" y="136" text-anchor="start">2겹 — 틀을 더 씌웠다</text><path class="ax" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M160 152 L160 168"/><rect x="40" y="172" width="240" height="38" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="160" y="195" text-anchor="middle">おめしあがりになられる</text><text class="ink2 sm" x="300" y="196" text-anchor="start">3겹 — 수동과 같은 꼴까지</text><rect x="40" y="232" width="330" height="66" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="205" y="259.5" text-anchor="middle">규범이 적는 것</text><text class="ink sm" x="205" y="278.5" text-anchor="middle">같은 갈래를 겹쳐 쌓는 것을 인정하지 않는다</text><rect x="390" y="232" width="330" height="66" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="555" y="259.5" text-anchor="middle">관찰이 적는 것</text><text class="ink sm" x="555" y="278.5" text-anchor="middle">손님을 상대하는 자리에서 실제로 쓰인다</text><text class="ink2 sm" x="40" y="314" text-anchor="start">아래 두 칸은 서로를 지우지 않는다. 둘을 한 칸에 적으면 어느 하나가 지워진다</text></g>
</svg>