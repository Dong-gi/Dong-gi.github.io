<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">な형용사의 활용과 명사문의 활용</title><desc id="d">왼쪽은 명사, 오른쪽은 な형용사. 낱말은 그대로이고 뒤에 붙은 だ 가 같은 꼴로 바뀐다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="50" y="28" text-anchor="start">명사 — 8장의 명사문</text><text class="ink2 sm" x="470" y="28" text-anchor="start">な형용사</text><rect x="50" y="42" width="250" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text x="70" y="69" text-anchor="start" class="ink" style="font-size:18px">くるま</text><text x="124" y="69" text-anchor="start" class="f1" style="font-size:18px;font-weight:600">だ</text><text class="ink2 sm" x="380" y="67" text-anchor="middle">사전형</text><rect x="460" y="42" width="250" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text x="480" y="69" text-anchor="start" class="ink" style="font-size:18px">しずか</text><text x="534" y="69" text-anchor="start" class="f2" style="font-size:18px;font-weight:600">だ</text><rect x="50" y="92" width="250" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text x="70" y="119" text-anchor="start" class="ink" style="font-size:18px">くるま</text><text x="124" y="119" text-anchor="start" class="f1" style="font-size:18px;font-weight:600">だった</text><text class="ink2 sm" x="380" y="117" text-anchor="middle">た형</text><rect x="460" y="92" width="250" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text x="480" y="119" text-anchor="start" class="ink" style="font-size:18px">しずか</text><text x="534" y="119" text-anchor="start" class="f2" style="font-size:18px;font-weight:600">だった</text><rect x="50" y="142" width="250" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text x="70" y="169" text-anchor="start" class="ink" style="font-size:18px">くるま</text><text x="124" y="169" text-anchor="start" class="f1" style="font-size:18px;font-weight:600">ではない</text><text class="ink2 sm" x="380" y="167" text-anchor="middle">ない형</text><rect x="460" y="142" width="250" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text x="480" y="169" text-anchor="start" class="ink" style="font-size:18px">しずか</text><text x="534" y="169" text-anchor="start" class="f2" style="font-size:18px;font-weight:600">ではない</text><rect x="50" y="192" width="250" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text x="70" y="219" text-anchor="start" class="ink" style="font-size:18px">くるま</text><text x="124" y="219" text-anchor="start" class="f1" style="font-size:18px;font-weight:600">で</text><text class="ink2 sm" x="380" y="217" text-anchor="middle">て형</text><rect x="460" y="192" width="250" height="40" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text x="480" y="219" text-anchor="start" class="ink" style="font-size:18px">しずか</text><text x="534" y="219" text-anchor="start" class="f2" style="font-size:18px;font-weight:600">で</text><rect x="50" y="252" width="660" height="56" rx="6" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-dasharray="5 4"/><text x="380" y="275.5" text-anchor="middle" class="ink" style="font-size:14px">바뀌는 것은 낱말이 아니라 뒤에 붙은 だ 다</text><text x="380" y="294.5" text-anchor="middle" class="ink2" style="font-size:13px">그 だ 는 명사 뒤에서도 같은 꼴로 바뀐다</text></g>
</svg>