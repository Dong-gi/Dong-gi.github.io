<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">て형이 중심이 되는 짜임</title><desc id="d">て형 뒤의 빈 자리에 무엇이 붙느냐로 여러 표현이 만들어진다. 이 장은 자리를 만들고 뜻은 뒤 장들이 채운다.</desc>
<style>
