<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">사역수동에서 층이 겹쳐 붙는 것</title><desc id="d">한 술어 안에 다섯 층이 정해진 순서로 붙어 있고, 층마다 다른 장이 다룬다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink" x="50" y="34" text-anchor="start">8장이 말한 층이 실제로 층이라는 것이 이 꼴에서 드러난다</text><rect x="50" y="56" width="130" height="48" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.6"/><text class="ink" x="115" y="84" text-anchor="middle">よま</text><text class="ink" x="115" y="126" text-anchor="middle">뜻</text><text class="ink2 sm" x="115" y="148" text-anchor="middle">11장</text><rect x="190" y="56" width="100" height="48" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.6"/><text class="ink" x="240" y="84" text-anchor="middle">せ</text><text class="ink" x="240" y="126" text-anchor="middle">사역</text><text class="ink2 sm" x="240" y="148" text-anchor="middle">14장</text><rect x="300" y="56" width="110" height="48" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.6"/><text class="ink" x="355" y="84" text-anchor="middle">られ</text><text class="ink" x="355" y="126" text-anchor="middle">수동</text><text class="ink2 sm" x="355" y="148" text-anchor="middle">14장</text><rect x="420" y="56" width="110" height="48" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.6"/><text class="ink" x="475" y="84" text-anchor="middle">まし</text><text class="ink" x="475" y="126" text-anchor="middle">정중함</text><text class="ink2 sm" x="475" y="148" text-anchor="middle">16 · 18장</text><rect x="540" y="56" width="90" height="48" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.6"/><text class="ink" x="585" y="84" text-anchor="middle">た</text><text class="ink" x="585" y="126" text-anchor="middle">때</text><text class="ink2 sm" x="585" y="148" text-anchor="middle">13장</text><path class="ax" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ark)" d="M50 180 L630 180"/><text class="ink2 sm" x="50" y="204" text-anchor="start">안쪽 — 뜻에 가깝다</text><text class="ink2 sm" x="630" y="204" text-anchor="end">바깥쪽 — 문장 끝</text><rect x="40" y="226" width="680" height="62" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="380" y="251" text-anchor="middle">순서는 뒤집히지 않는다</text><text class="ink" x="380" y="271" text-anchor="middle">수동을 안에 넣고 사역을 밖에 붙인 꼴은 만들지 않는다</text><text class="ink2 sm" x="40" y="310" text-anchor="start">층을 하나씩 벗기면 よむ 가 남는다</text></g>
</svg>