<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">수동에서 무엇이 뒤집히고 무엇이 그대로인가</title><desc id="d">화살표의 방향은 그대로다. 바뀌는 것은 어느 쪽을 주어로 세우는가와 조사다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="30" text-anchor="start">능동</text><rect x="40" y="42" width="180" height="54" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.8"/><text class="ink" x="130" y="63.5" text-anchor="middle">せんせいが</text><text class="ink" x="130" y="82.5" text-anchor="middle">주어</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M224 69 L304 69"/><text class="f1 sm" x="264" y="58" text-anchor="middle">ほめる</text><rect x="308" y="42" width="180" height="54" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="398" y="73" text-anchor="middle">わたしを</text><text class="ink" x="40" y="128" text-anchor="start" style="font-size:17px">せんせいが わたしを ほめる</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" d="M40 152 L720 152"/><text class="ink2 sm" x="40" y="180" text-anchor="start">수동</text><rect x="40" y="192" width="180" height="54" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="130" y="223" text-anchor="middle">せんせいに</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M224 219 L304 219"/><text class="f1 sm" x="264" y="208" text-anchor="middle">ほめる</text><rect x="308" y="192" width="180" height="54" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.8"/><text class="ink" x="398" y="213.5" text-anchor="middle">わたしが</text><text class="ink" x="398" y="232.5" text-anchor="middle">주어</text><text class="ink" x="40" y="278" text-anchor="start" style="font-size:17px">わたしが せんせいに ほめられる</text><text class="f2" x="510" y="218" text-anchor="start">하는 쪽은 に 로 표시된다</text><text class="ink" x="40" y="312" text-anchor="start">두 줄에서 화살표는 같은 방향이다. 갈리는 것은 주어와 조사뿐이다</text></g>
</svg>