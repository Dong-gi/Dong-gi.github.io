<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">꾸미는 말이 앞에 오는 네 경우</title><desc id="d">네 줄 모두 꾸미는 말이 왼쪽에 있고, 사이에 끼는 것만 다르다. な, の, 그리고 아무것도 끼지 않는 두 줄.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="40" y="26" text-anchor="start">꾸미는 말은 앞에 온다 — 갈리는 것은 사이에 무엇이 끼는가뿐이다</text><text class="ink2 sm" x="40" y="71" text-anchor="start">い형용사</text><rect x="120" y="44" width="195" height="42" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text x="217.5" y="71" text-anchor="middle" class="ink" style="font-size:16px">たかい</text><rect x="325" y="49" width="40" height="32" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="345" y="71" text-anchor="middle" class="ink2" style="font-size:16px">—</text><rect x="375" y="44" width="145" height="42" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="447.5" y="71" text-anchor="middle" class="ink" style="font-size:16px">やま</text><text class="ink2 sm" x="540" y="71" text-anchor="start">높은 산</text><text class="ink2 sm" x="40" y="129" text-anchor="start">な형용사</text><rect x="120" y="102" width="195" height="42" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text x="217.5" y="129" text-anchor="middle" class="ink" style="font-size:16px">しずか</text><rect x="325" y="107" width="40" height="32" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text x="345" y="129" text-anchor="middle" class="f3" style="font-size:16px;font-weight:600">な</text><rect x="375" y="102" width="145" height="42" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="447.5" y="129" text-anchor="middle" class="ink" style="font-size:16px">へや</text><text class="ink2 sm" x="540" y="129" text-anchor="start">조용한 방</text><text class="ink2 sm" x="40" y="187" text-anchor="start">동사</text><rect x="120" y="160" width="195" height="42" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text x="217.5" y="187" text-anchor="middle" class="ink" style="font-size:16px">たべる  たべた</text><rect x="325" y="165" width="40" height="32" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="345" y="187" text-anchor="middle" class="ink2" style="font-size:16px">—</text><rect x="375" y="160" width="145" height="42" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="447.5" y="187" text-anchor="middle" class="ink" style="font-size:16px">ひと</text><text class="ink2 sm" x="540" y="187" text-anchor="start">먹는 사람 · 먹은 사람</text><text class="ink2 sm" x="40" y="245" text-anchor="start">명사</text><rect x="120" y="218" width="195" height="42" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text x="217.5" y="245" text-anchor="middle" class="ink" style="font-size:16px">にほんご</text><rect x="325" y="223" width="40" height="32" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text x="345" y="245" text-anchor="middle" class="f3" style="font-size:16px;font-weight:600">の</text><rect x="375" y="218" width="145" height="42" rx="6" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="447.5" y="245" text-anchor="middle" class="ink" style="font-size:16px">ほん</text><text class="ink2 sm" x="540" y="245" text-anchor="start">일본어 책</text><text class="ink2 sm" x="40" y="296" text-anchor="start">동사는 사전형과 た형이 그대로 붙는다. 두 꼴의 뜻이 갈리는 방식은 13장이 다룬다</text><text class="ink2 sm" x="40" y="318" text-anchor="start">8장이 세운 어순 규칙 하나로 네 줄이 함께 설명된다</text></g>
</svg>