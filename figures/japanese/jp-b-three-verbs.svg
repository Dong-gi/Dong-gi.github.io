<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">세 동사를 가르는 두 가지 — 화살의 방향과 주어의 자리</title><desc id="d">안과 바깥을 가르는 선 하나를 세 화살이 지난다. 지나는 방향과 주어로 세운 쪽이 세 동사를 정한다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="f1" x="44" y="32" text-anchor="start">안 — 나와 내 쪽</text><text class="ink2" x="372" y="32" text-anchor="start">바깥 — 그 밖</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-dasharray="6 5" d="M340 46 L340 274"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M208 96 L472 96"/><circle cx="194" cy="96" r="6" fill="none" stroke="var(--s2)" stroke-width="2"/><text class="ink2 sm" x="194" y="118" text-anchor="middle">주어</text><text class="f2" x="520" y="102" text-anchor="start" style="font-size:19px">あげる</text><text class="ink2 sm" x="520" y="124" text-anchor="start">도착점이 안이 아니다</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M472 168 L208 168"/><circle cx="486" cy="168" r="6" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink2 sm" x="486" y="154" text-anchor="middle">주어</text><text class="f1" x="520" y="174" text-anchor="start" style="font-size:19px">くれる</text><text class="ink2 sm" x="520" y="196" text-anchor="start">도착점이 반드시 안이다</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M472 240 L208 240"/><circle cx="194" cy="240" r="6" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink2 sm" x="194" y="262" text-anchor="middle">주어</text><text class="f1" x="520" y="246" text-anchor="start" style="font-size:19px">もらう</text><text class="ink2 sm" x="520" y="268" text-anchor="start">도착점이 반드시 안이다</text><text class="ink2 sm" x="44" y="302" text-anchor="start">아래 두 줄은 화살이 같다. 갈리는 것은 고리가 어느 쪽에 붙었는가뿐이다</text></g>
</svg>