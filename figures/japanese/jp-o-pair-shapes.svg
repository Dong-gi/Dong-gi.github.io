<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">자동사와 타동사 짝의 꼬리가 대응하는 방식</title><desc id="d">왼쪽 꼬리와 오른쪽 꼬리 사이에 되풀이되는 대응이 있다. 다만 예측 규칙은 아니고 예외가 섞여 있다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<g font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', Meiryo, 'MS Gothic', 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif"><text class="ink2 sm" x="128" y="32" text-anchor="middle">자동사</text><text class="ink2 sm" x="378" y="32" text-anchor="middle">타동사</text><text class="ink2 sm" x="500" y="32" text-anchor="start">꼬리의 대응</text><rect x="40" y="44" width="176" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="128" y="65" text-anchor="middle">はじまる</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M220 61 L282 61"/><rect x="290" y="44" width="176" height="34" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="378" y="65" text-anchor="middle">はじめる</text><text class="ink" x="492" y="66" text-anchor="start">〜ある  ⇒  〜える</text><rect x="40" y="88" width="176" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="128" y="109" text-anchor="middle">あく</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M220 105 L282 105"/><rect x="290" y="88" width="176" height="34" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="378" y="109" text-anchor="middle">あける</text><text class="ink" x="492" y="110" text-anchor="start">〜く · 〜つ  ⇒  〜える</text><rect x="40" y="132" width="176" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="128" y="153" text-anchor="middle">なおる</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M220 149 L282 149"/><rect x="290" y="132" width="176" height="34" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="378" y="153" text-anchor="middle">なおす</text><text class="ink" x="492" y="154" text-anchor="start">〜る  ⇒  〜す</text><rect x="40" y="176" width="176" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="128" y="197" text-anchor="middle">おちる</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M220 193 L282 193"/><rect x="290" y="176" width="176" height="34" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="378" y="197" text-anchor="middle">おとす</text><text class="ink" x="492" y="198" text-anchor="start">〜ちる  ⇒  〜とす</text><rect x="40" y="220" width="176" height="34" rx="6" fill="none" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="128" y="241" text-anchor="middle">われる</text><path class="s3" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar3)" d="M220 237 L282 237"/><rect x="290" y="220" width="176" height="34" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="378" y="241" text-anchor="middle">わる</text><text class="ink" x="492" y="242" text-anchor="start">〜れる  ⇒  〜る</text><path fill="none" stroke="var(--grid)" stroke-width="1.2" d="M40 278 L720 278"/><rect x="40" y="292" width="680" height="62" rx="6" fill="none" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="380" y="317" text-anchor="middle">예외를 같은 자리에 적어 둔다</text><text class="ink" x="380" y="337" text-anchor="middle">あずかる 는 〜ある 로 끝나는데 타동사다 · しぬ 와 たべる 는 짝이 아예 없다</text></g>
</svg>