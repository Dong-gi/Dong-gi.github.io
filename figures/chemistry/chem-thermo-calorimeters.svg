<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">두 종류의 열량계</title><desc id="d">커피컵 열량계와 봄베 열량계의 구조</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">무엇을 재느냐에 따라 그릇이 달라진다</text><rect x="30" y="56" width="320" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="190" y="77" text-anchor="middle">커피컵 열량계</text><text class="ink2 sm" x="190" y="94" text-anchor="middle">뚜껑이 헐거워 대기에 열려 있다 — 압력이 일정</text><rect x="122" y="164" width="136" height="94" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="none" stroke-width="0"/><rect x="120" y="130" width="140" height="130" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><rect x="108" y="266" width="164" height="-2" rx="2" fill="var(--s1)" fill-opacity="0" stroke="none" stroke-width="0"/><rect x="106" y="118" width="168" height="148" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><path d="M190 106 L190 176" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="190" cy="182" r="7" fill="var(--s2)" fill-opacity="0.9" stroke="var(--s2)" stroke-width="1"/><text class="ink2 sm" x="200" y="108" text-anchor="start">온도계</text><path d="M146 112 L146 200 L166 214" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="96" y="108" text-anchor="end">젓개</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M126 104 L143 110"/><text class="ink bold" x="190" y="284" text-anchor="middle">재는 값이 곧 q<tspan baseline-shift="-22%" font-size="76%">p</tspan> = ΔH</text><text class="ink2 sm" x="190" y="306" text-anchor="middle">중화열·용해열처럼 용액에서 하는 반응</text><rect x="370" y="56" width="320" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="530" y="77" text-anchor="middle">봄베 열량계</text><text class="ink2 sm" x="530" y="94" text-anchor="middle">두꺼운 강철 통 — 부피가 고정된다</text><rect x="432" y="150" width="196" height="126" rx="2" fill="var(--s1)" fill-opacity="0.12" stroke="none" stroke-width="0"/><rect x="430" y="118" width="200" height="160" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><rect x="474" y="168" width="112" height="84" rx="8" fill="var(--s2)" fill-opacity="0.14" stroke="var(--ink2)" stroke-width="3"/><text class="ink sm" x="530" y="202" text-anchor="middle">시료 + O₂</text><text class="ink2 sm" x="530" y="222" text-anchor="middle">(강철 통)</text><path d="M530 168 L530 132 L560 132" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="566" y="128" text-anchor="start">점화선</text><path d="M464 106 L464 176" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="464" cy="182" r="7" fill="var(--s2)" fill-opacity="0.9" stroke="var(--s2)" stroke-width="1"/><text class="ink2 sm" x="452" y="108" text-anchor="end">온도계</text><text class="ink bold" x="530" y="284" text-anchor="middle">재는 값이 q<tspan baseline-shift="-22%" font-size="76%">V</tspan> = ΔU</text><text class="ink2 sm" x="530" y="306" text-anchor="middle">연소열처럼 기체가 크게 드나드는 반응</text><text class="ink" x="360" y="356" text-anchor="middle">어느 쪽이든 원리는 하나다. 계가 잃은 열 = 물과 그릇이 얻은 열</text><text class="ink2 sm" x="360" y="378" text-anchor="middle">두 값이 다른 것이 아니라, 정압에서 잰 것이 ΔH 이고 정적에서 잰 것이 ΔU 다</text>
</svg>