hor="middle"></text><text class="ink bold" x="666" y="222" text-anchor="end">C 1 = 1</text><text class="ink bold" x="666" y="240" text-anchor="end">H 4 = 4</text><text class="ink bold" x="666" y="258" text-anchor="end">O 4 = 4</text><text class="ink bold" x="20" y="30" text-anchor="start">CH₄ + O₂ → CO₂ + H₂O 의 계수 맞추기</text><text class="ink2 sm" x="20" y="310" text-anchor="start">작은 공 = 수소, 큰 공 = 산소, 회색 = 탄소</text><text class="ink2 sm" x="20" y="330" text-anchor="start">계수만 고칠 수 있다. 아래첨자를 고치면 다른 물질이 되어 버린다</text>
