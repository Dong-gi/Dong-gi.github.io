<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">팽창 일</title><desc id="d">실린더 두 개와 P–V 그래프</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="36" text-anchor="start">팽창하는 기체는 주위를 밀어낸다 — 그 밀어냄이 일이다</text><rect x="69" y="206" width="90" height="79" rx="2" fill="var(--s1)" fill-opacity="0.18" stroke="none" stroke-width="0"/><rect x="66" y="92" width="96" height="196" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><rect x="69" y="195" width="90" height="11" rx="2" fill="var(--ink2)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1"/><text class="ink" x="114" y="310" text-anchor="middle">처음</text><text class="ink2 sm" x="114" y="330" text-anchor="middle">V₁ = 5.0 L</text><rect x="215" y="146" width="90" height="139" rx="2" fill="var(--s1)" fill-opacity="0.18" stroke="none" stroke-width="0"/><rect x="212" y="92" width="96" height="196" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><rect x="215" y="135" width="90" height="11" rx="2" fill="var(--ink2)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1"/><text class="ink" x="260" y="310" text-anchor="middle">나중</text><text class="ink2 sm" x="260" y="330" text-anchor="middle">V₂ = 15.0 L</text><path class="s2" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar2)" d="M180 200 L180 146"/><text class="ink2 sm" x="186" y="176" text-anchor="start">피스톤이 밀려 올라간다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M114 62 L114 88"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M260 62 L260 88"/><text class="ink2 sm" x="187" y="54" text-anchor="middle">바깥 압력 P = 100 kPa (일정)</text><path class="gr" d="M430 275 V100"/><path class="gr" d="M496.67 275 V100"/><path class="gr" d="M563.33 275 V100"/><path class="gr" d="M630 275 V100"/><path class="gr" d="M430 275 H670"/><path class="gr" d="M430 212.5 H670"/><path class="gr" d="M430 150 H670"/><path class="ax" marker-end="url(#ark)" d="M430 275 H680"/><path class="ax" marker-end="url(#ark)" d="M430 275 V90"/><text class="sm ink2" x="496.67" y="290" text-anchor="middle">5</text><text class="sm ink2" x="563.33" y="290" text-anchor="middle">10</text><text class="sm ink2" x="630" y="290" text-anchor="middle">15</text><text class="sm ink2" x="424" y="216.5" text-anchor="end">50</text><text class="sm ink2" x="424" y="154" text-anchor="end">100</text><text class="sm ink2" x="684" y="279">V (L)</text><text class="sm ink2" x="430" y="82" text-anchor="middle">P (kPa)</text><path d="M496.67 275 L496.67 150 L630 150 L630 275 Z" fill="var(--s2)" fill-opacity="0.22" stroke="none" stroke-width="1"/><path class="cv s2" d="M430 150 L662 150"/><text class="ink bold" x="563.33" y="200" text-anchor="middle">넓이 = P ΔV</text><text class="ink" x="563.33" y="235" text-anchor="middle">= 1000 J</text><text class="ink2 sm" x="496.67" y="135" text-anchor="middle">V₁</text><text class="ink2 sm" x="630" y="135" text-anchor="middle">V₂</text><text class="ink" x="550" y="312" text-anchor="middle">계가 한 일이므로  w = −P ΔV = −1000 J</text><text class="ink2 sm" x="744" y="386" text-anchor="end">1 kPa · L = 1 J 이므로 환산 계수가 따로 필요 없다</text>
</svg>