<text class="ink bold" x="26" y="34" text-anchor="start">알갱이 4개가 두 칸에 나뉘는 방법을 전부 세어 보면</text><rect x="56" y="62" width="88" height="60" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><path d="M100 62 L100 122" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="72" cy="80" r="5.5" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="96" cy="80" r="5.5" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="72" cy="102" r="5.5" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="96" cy="102" r="5.5" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><text class="ink sm" x="100" y="142" text-anchor="middle">4 : 0</text><rect x="186" y="62" width="88" height="60" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><path d="M230 62 L230 122" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="202" cy="80" r="5.5" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="226" cy="80" r="5.5" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="202" cy="102" r="5.5" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="246" cy="80" r="5.5" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><text class="ink sm" x="230" y="142" text-anchor="middle">3 : 1</text><rect x="316" y="62" width="88" height="60" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><path d="M360 62 L360 122" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="332" cy="80" r="5.5" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="356" cy="80" r="5.5" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="376" cy="80" r="5.5" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="400" cy="80" r="5.5" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><text class="ink sm" x="360" y="142" text-anchor="middle">2 : 2</text><rect x="446" y="62" width="88" height="60" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><path d="M490 62 L490 122" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="462" cy="80" r="5.5" fill="var(--s1)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="506" cy="80" r="5.5" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="530" cy="80" r="5.5" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="506" cy="102" r="5.5" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><text class="ink sm" x="490" y="142" text-anchor="middle">1 : 3</text><rect x="576" y="62" width="88" height="60" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><path d="M620 62 L620 122" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="636" cy="80" r="5.5" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="660" cy="80" r="5.5" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="636" cy="102" r="5.5" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><circle cx="660" cy="102" r="5.5" fill="var(--s2)" fill-opacity="0.85" stroke="none" stroke-width="0"/><text class="ink sm" x="620" y="142" text-anchor="middle">0 : 4</text><rect x="78" y="290" width="44" height="26" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink bold" x="100" y="282" text-anchor="middle">1</text><rect x="208" y="212" width="44" height="104" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink bold" x="230" y="204" text-anchor="middle">4</text><rect x="338" y="160" width="44" height="156" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink bold" x="360" y="152" text-anchor="middle">6</text><rect x="468" y="212" width="44" height="104" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink bold" x="490" y="204" text-anchor="middle">4</text><rect x="598" y="290" width="44" height="26" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink bold" x="620" y="282" text-anchor="middle">1</text><path d="M40 316 L676 316" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="36" y="334" text-anchor="start">가짓수 W</text><text class="ink" x="360" y="366" text-anchor="middle">전부 16가지인데 그중 6가지가 반반으로 나뉜 상태다. 가장 많은 쪽이 관측된다</text><text class="ink2 sm" x="360" y="390" text-anchor="middle">알갱이가 10²³ 개면 이 봉우리가 비교도 안 되게 뾰족해진다. 그래서 기체가 저절로 한쪽으로 몰리는 일은 없다</text>
