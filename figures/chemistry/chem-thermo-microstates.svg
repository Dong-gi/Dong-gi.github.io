<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">미시상태 세기</title><desc id="d">알갱이 4개의 배치 다섯 가지와 가짓수 막대</desc>
<style>
