<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">Q 와 K</title><desc id="d">수직선 위에서 방향을 판정하는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">지금 값 Q 를 목표 값 K 와 견주면 갈 방향이 정해진다</text><path d="M80 150 L620 150" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 116 L350 184" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="350" y="106" text-anchor="middle">K</text><text class="ink" x="350" y="206" text-anchor="middle">평형 (Q = K)</text><text class="ink2 sm" x="350" y="228" text-anchor="middle">알짜 변화가 없다</text><circle cx="190" cy="150" r="6" fill="var(--s1)" fill-opacity="0.9" stroke="none" stroke-width="0"/><text class="ink bold" x="190" y="130" text-anchor="middle">Q</text><path class="s1" fill="none" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar1)" d="M200 150 L330 150"/><text class="ink" x="190" y="206" text-anchor="middle">Q &amp;lt; K — 생성물이 모자란다</text><text class="ink bold" x="190" y="228" text-anchor="middle">정반응으로 간다</text><circle cx="510" cy="150" r="6" fill="var(--s2)" fill-opacity="0.9" stroke="none" stroke-width="0"/><text class="ink bold" x="510" y="130" text-anchor="middle">Q</text><path class="s2" fill="none" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" d="M500 150 L370 150"/><text class="ink" x="510" y="206" text-anchor="middle">Q &amp;gt; K — 생성물이 넘친다</text><text class="ink bold" x="510" y="228" text-anchor="middle">역반응으로 간다</text><text class="ink2 sm" x="72" y="155" text-anchor="end">작다</text><text class="ink2 sm" x="628" y="155" text-anchor="start">크다</text><text class="ink" x="350" y="276" text-anchor="middle">Q 는 K 와 똑같은 꼴의 식에 지금 이 순간의 농도(또는 분압)를 넣은 값이다</text><text class="ink2 sm" x="350" y="300" text-anchor="middle">어느 쪽이든 반응은 Q 를 K 쪽으로 끌고 간다. 방향 판정은 이 한 줄로 끝난다</text>
</svg>