3.33 154.21 L216.5 155.62 L219.67 157.03 L222.83 158.44 L226 159.85 L229.17 161.26 L232.33 162.67 L235.5 164.08 L238.67 165.49 L241.83 166.9 L245 168.3 L248.17 169.71 L251.33 171.12 L254.5 172.53 L257.67 173.94 L260.83 175.35 L264 176.76 L267.17 178.17 L270.33 179.58 L273.5 180.99 L276.67 182.4 L279.83 183.81 L283 185.22 L286.17 186.63 L289.33 188.04 L292.5 189.45 L295.67 190.86 L298.83 192.27 L302 193.68 L305.17 195.09 L308.33 196.5 L311.5 197.9 L314.67 199.31 L317.83 200.72 L321 202.13 L324.17 203.54 L327.33 204.95 L330.5 206.36 L333.67 207.77 L336.83 209.18 L340 210.59 L343.17 212 L346.33 213.41 L349.5 214.82 L352.67 216.23 L355.83 217.64 L359 219.05 L362.17 220.46 L365.33 221.87 L368.5 223.28 L371.67 224.69 L374.83 226.1 L378 227.5 L381.17 228.91 L384.33 230.32 L387.5 231.73 L390.67 233.14 L393.83 234.55 L397 235.96 L400.17 237.37 L403.33 238.78 L406.5 240.19 L409.67 241.6 L412.83 243.01 L416 244.42 L419.17 245.83 L422.33 247.24 L425.5 248.65 L428.67 250.06 L431.83 251.47 L435 252.88 L438.17 254.29 L441.33 255.7 L444.5 257.1 L447.67 258.51 L450.83 259.92 L454 261.33"/><path class="gr" stroke-dasharray="4 3" d="M264 272 L264 176.76"/><path class="gr" stroke-dasharray="4 3" d="M74 176.76 L264 176.76"/><circle class="f2" cx="264" cy="176.76" r="5"/><text class="ink bold sm" x="274" y="166.76" text-anchor="start">E° = 1.10 V</text><text class="ink bold" x="488" y="84" text-anchor="start">E = E° − (0.0592 / n) log Q</text><text class="ink2 sm" x="488" y="104" text-anchor="start">(25 °C, 이 그림은 n = 2)</text><text class="ink2 sm" x="488" y="138" text-anchor="start">Q 가 10배 커질 때마다</text><text class="ink2 sm" x="488" y="156" text-anchor="start">전압은 0.0296 V 씩 내려간다</text><text class="ink2 sm" x="488" y="188" text-anchor="start">Q &lt; 1 (생성물이 적다)  →  E &gt; E°</text><text class="ink2 sm" x="488" y="206" text-anchor="start">Q &gt; 1 (생성물이 많다)  →  E &lt; E°</text><text class="ink bold" x="488" y="240" text-anchor="start">Q = K 가 되면 E = 0</text><text class="ink2 sm" x="488" y="260" text-anchor="start">전지가 다 소모된 상태다</text><text class="ink bold" x="20" y="32" text-anchor="start">네른스트 식은 로그 Q 에 대한 일차함수다</text><text class="ink2 sm" x="20" y="328" text-anchor="start">기울기가 −(0.0592 / n) 이므로, 전자를 많이 주고받는 반응일수록 농도 변화에 덜 민감하다</text>
