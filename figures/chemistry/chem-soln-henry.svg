<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">헨리 법칙</title><desc id="d">분압에 대한 용해도 직선</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">기체가 녹는 양은 그 기체의 분압에 비례한다</text><path class="gr" d="M104 278 V62"/><path class="gr" d="M195.3 278 V62"/><path class="gr" d="M286.61 278 V62"/><path class="gr" d="M377.91 278 V62"/><path class="gr" d="M469.22 278 V62"/><path class="gr" d="M104 278 H524"/><path class="gr" d="M104 214.47 H524"/><path class="gr" d="M104 150.94 H524"/><path class="gr" d="M104 87.41 H524"/><path class="ax" marker-end="url(#ark)" d="M104 278 H534"/><path class="ax" marker-end="url(#ark)" d="M104 278 V52"/><text class="sm ink2" x="195.3" y="293" text-anchor="middle">100</text><text class="sm ink2" x="286.61" y="293" text-anchor="middle">200</text><text class="sm ink2" x="377.91" y="293" text-anchor="middle">300</text><text class="sm ink2" x="469.22" y="293" text-anchor="middle">400</text><text class="sm ink2" x="98" y="218.47" text-anchor="end">0.05</text><text class="sm ink2" x="98" y="154.94" text-anchor="end">0.1</text><text class="sm ink2" x="98" y="91.41" text-anchor="end">0.15</text><text class="sm ink2" x="538" y="282">CO₂ 분압 (kPa)</text><text class="sm ink2" x="96" y="54" text-anchor="end">c (mol/L)</text><path class="cv s1" d="M104 278 L505.74 87.92"/><circle class="f2" cx="469.22" cy="105.2" r="5"/><path class="gr" stroke-dasharray="4 3" d="M469.22 278 L469.22 105.2"/><path class="gr" stroke-dasharray="4 3" d="M104 105.2 L469.22 105.2"/><text class="ink" x="461.91" y="91.22" text-anchor="end">뚜껑을 닫아 둔 상태  0.136 mol/L</text><circle class="f2" cx="104.04" cy="277.98" r="5"/><text class="ink" x="118.61" y="255.13" text-anchor="start">뚜껑을 열면 여기까지 내려온다 (거의 0)</text><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M405.3 125.53 L158.78 252.59"/><text class="ink bold" x="314" y="166.19" text-anchor="middle">c = k<tspan baseline-shift="-22%" font-size="76%">H</tspan> P</text><text class="ink2 sm" x="314" y="186.52" text-anchor="middle">기울기가 k<tspan baseline-shift="-22%" font-size="76%">H</tspan></text><text class="ink" x="350" y="324" text-anchor="middle">차이만큼의 CO₂ 가 한꺼번에 빠져나온다. 500 mL 병이면 약 1.7 L 의 기체다</text><text class="ink2 sm" x="350" y="348" text-anchor="middle">온도를 올리면 k<tspan baseline-shift="-22%" font-size="76%">H</tspan> 가 작아져 기울기가 눕는다. 미지근한 음료가 더 심하게 넘치는 이유다</text>
</svg>