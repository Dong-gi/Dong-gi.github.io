<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">압력과 평형 이동</title><desc id="d">누르기 전과 뒤의 알갱이 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">부피를 줄이면 기체 알갱이 수가 적은 쪽으로 옮겨 간다</text><text class="ink bold" x="150" y="74" text-anchor="middle">누르기 전</text><rect x="60" y="90" width="180" height="180" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><circle cx="90" cy="124" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="105" cy="124" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="170" cy="130" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="185" cy="130" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="100" cy="196" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="115" cy="196" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="182" cy="202" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="197" cy="202" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="96" cy="248" r="9" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.2"/><circle cx="152" cy="240" r="9" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.2"/><circle cx="208" cy="256" r="9" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.2"/><text class="ink" x="150" y="292" text-anchor="middle">기체 알갱이 7개</text><text class="ink2 sm" x="150" y="312" text-anchor="middle">2SO₂ + O₂ ⇌ 2SO₃</text><path class="s3" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M266 180 L356 180"/><text class="ink" x="311" y="164" text-anchor="middle">부피를 절반으로</text><text class="ink2 sm" x="311" y="202" text-anchor="middle">모든 농도가 2배가 되어</text><text class="ink2 sm" x="311" y="220" text-anchor="middle">Q 가 K 보다 작아진다</text><text class="ink bold" x="470" y="74" text-anchor="middle">누른 뒤 새 평형</text><rect x="400" y="130" width="140" height="140" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><circle cx="426" cy="160" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="441" cy="160" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="480" cy="166" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="495" cy="166" r="9" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.2"/><circle cx="430" cy="218" r="9" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.2"/><circle cx="482" cy="224" r="9" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.2"/><circle cx="440" cy="252" r="9" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.2"/><circle cx="496" cy="254" r="9" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.2"/><text class="ink" x="470" y="292" text-anchor="middle">기체 알갱이 6개</text><text class="ink2 sm" x="470" y="312" text-anchor="middle">왼쪽 3몰이 오른쪽 2몰로 바뀌었다</text><text class="ink" x="350" y="348" text-anchor="middle">이 규칙은 양쪽 기체 몰수가 다를 때만 뜻이 있다. 같으면 눌러도 평형이 움직이지 않는다</text><text class="ink2 sm" x="350" y="372" text-anchor="middle">부피를 그대로 두고 아르곤 같은 기체만 넣는 것은 아무 영향이 없다. 각 성분의 농도가 그대로이기 때문이다</text>
</svg>