<text class="ink bold" x="26" y="34" text-anchor="start">부피를 줄이면 기체 알갱이 수가 적은 쪽으로 옮겨 간다</text><circle cx="429.5" cy="46" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="450.5" cy="46" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="440" cy="40" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="462" y="45" text-anchor="start">SO₂</text><circle cx="514.5" cy="40" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="525.5" cy="40" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><text class="ink sm" x="542" y="45" text-anchor="start">O₂</text><circle cx="600" cy="28" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="589.5" cy="46" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="610.5" cy="46" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="600" cy="40" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="622" y="45" text-anchor="start">SO₃</text><text class="ink2 sm" x="680" y="66" text-anchor="end">큰 공 = S, 작은 공 = O</text><text class="ink bold" x="150" y="74" text-anchor="middle">누르기 전</text><rect x="60" y="90" width="180" height="180" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><circle cx="83.5" cy="134" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="104.5" cy="134" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="94" cy="128" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><circle cx="150.5" cy="124" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="161.5" cy="124" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="199.5" cy="138" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="220.5" cy="138" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="210" cy="132" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><circle cx="104" cy="176" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="93.5" cy="194" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="114.5" cy="194" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="104" cy="188" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><circle cx="159.5" cy="188" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="180.5" cy="188" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="170" cy="182" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><circle cx="114.5" cy="242" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="125.5" cy="242" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="185.5" cy="242" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="206.5" cy="242" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="196" cy="236" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><text class="ink" x="150" y="292" text-anchor="middle">기체 알갱이 7개 — SO₂ 4 · O₂ 2 · SO₃ 1</text><text class="ink2 sm" x="150" y="312" text-anchor="middle">2SO₂ + O₂ ⇌ 2SO₃</text><path class="s3" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M266 180 L356 180"/><text class="ink" x="311" y="164" text-anchor="middle">부피를 절반으로</text><text class="ink2 sm" x="311" y="202" text-anchor="middle">모든 농도가 2배가 되어</text><text class="ink2 sm" x="311" y="220" text-anchor="middle">Q 가 K 보다 작아진다</text><text class="ink bold" x="470" y="74" text-anchor="middle">누른 뒤 새 평형</text><rect x="400" y="130" width="140" height="140" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><circle cx="430" cy="154" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="419.5" cy="172" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="440.5" cy="172" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="430" cy="166" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><circle cx="489.5" cy="168" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="510.5" cy="168" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="500" cy="162" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><circle cx="456.5" cy="206" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="467.5" cy="206" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="514" cy="202" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="503.5" cy="220" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="524.5" cy="220" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="514" cy="214" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><circle cx="419.5" cy="252" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="440.5" cy="252" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="430" cy="246" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><circle cx="492" cy="238" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="481.5" cy="256" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="502.5" cy="256" r="6" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="492" cy="250" r="8" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.2"/><text class="ink" x="470" y="292" text-anchor="middle">기체 알갱이 6개 — SO₂ 2 · O₂ 1 · SO₃ 3</text><text class="ink2 sm" x="470" y="312" text-anchor="middle">왼쪽 3몰이 오른쪽 2몰로 바뀌었다</text><text class="ink" x="350" y="348" text-anchor="middle">이 규칙은 양쪽 기체 몰수가 다를 때만 뜻이 있다. 같으면 눌러도 평형이 움직이지 않는다</text><text class="ink2 sm" x="350" y="372" text-anchor="middle">부피를 그대로 두고 아르곤 같은 기체만 넣는 것은 아무 영향이 없다. 각 성분의 농도가 그대로이기 때문이다</text>
</svg>