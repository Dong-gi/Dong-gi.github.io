238 274.13 L230 279.45 L222 284.67 L214 289.8 L206 294.84 L198 299.78 L190 304.63 L182 309.38 L174 314.04 L166 318.6 L158 323.07 L150 327.44 L142 331.72 L134 335.9 L126 339.99 L118 343.99 L110 347.89 L102 351.7 L94 355.41 L86 359.02 L78 362.55 Z" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1"/><path class="cv s3" stroke-dasharray="6 4" d="M78 360 L478 178.06"/><text class="ink2 sm" x="382" y="254.48" text-anchor="end">N = Z 선</text><text class="ink bold sm" x="358" y="160.7" text-anchor="middle">안정한 핵이 모인 띠</text><circle class="f2" cx="198" cy="247.2" r="4"/><path class="s2" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar2)" d="M198 247.2 L226 259.94"/><text class="ink2 sm" x="190" y="229.01" text-anchor="end">중성자가 많다</text><text class="ink bold sm" x="190" y="245.38" text-anchor="end">β⁻ 붕괴</text><circle class="f2" cx="262" cy="290.86" r="4"/><path class="s2" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar2)" d="M262 290.86 L234 278.13"/><text class="ink2 sm" x="274" y="287.23" text-anchor="start">양성자가 많다</text><text class="ink bold sm" x="274" y="303.6" text-anchor="start">β⁺ 붕괴 · 전자 포획</text><circle class="f2" cx="438" cy="100.47" r="4"/><path class="s3" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M438 100.47 L402 116.84"/><text class="ink bold sm" x="430" y="78.64" text-anchor="end">너무 무겁다 → α 붕괴</text><path class="gr" stroke-dasharray="4 3" d="M410 360 L410 105.29"/><text class="ink2 sm" x="466" y="334.53" text-anchor="end">Z = 83 오른쪽에는</text><text class="ink2 sm" x="466" y="350.9" text-anchor="end">안정한 핵이 하나도 없다</text><text class="ink bold" x="20" y="32" text-anchor="start">핵이 안정하려면 중성자와 양성자의 비가 맞아야 한다</text><text class="ink2 sm" x="20" y="408" text-anchor="start">가벼운 핵은 N ≒ Z 일 때 안정하지만, 무거워질수록 양성자끼리 밀어내는 힘이 커져</text><text class="ink2 sm" x="20" y="428" text-anchor="start">더 많은 중성자가 필요해진다. 띠에서 벗어난 핵은 벗어난 방향에 맞는 붕괴로 띠 쪽으로 돌아온다</text>
</svg>