<text class="ink bold" x="26" y="34" text-anchor="start">반응이 진행되면 G 는 골짜기를 따라 내려가 바닥에서 멈춘다</text><path class="gr" d="M92 294 V62"/><path class="gr" d="M327 294 V62"/><path class="gr" d="M562 294 V62"/><path class="ax" marker-end="url(#ark)" d="M92 294 H572"/><path class="ax" marker-end="url(#ark)" d="M92 294 V52"/><text class="sm ink2" x="327" y="309" text-anchor="middle">0.5</text><text class="sm ink2" x="562" y="309" text-anchor="middle">1</text><text class="sm ink2" x="576" y="298">반응이 진행된 정도</text><text class="sm ink2" x="84" y="54" text-anchor="end">G</text><path class="cv s1" d="M93.88 88.84 L97.77 94.77 L101.65 99.99 L105.54 104.8 L109.42 109.32 L113.31 113.62 L117.19 117.73 L121.08 121.69 L124.96 125.51 L128.85 129.21 L132.73 132.8 L136.62 136.28 L140.5 139.68 L144.39 142.99 L148.27 146.22 L152.16 149.38 L156.05 152.46 L159.93 155.48 L163.82 158.43 L167.7 161.32 L171.59 164.15 L175.47 166.93 L179.36 169.65 L183.24 172.32 L187.13 174.94 L191.01 177.5 L194.9 180.03 L198.78 182.5 L202.67 184.93 L206.55 187.32 L210.44 189.66 L214.33 191.96 L218.21 194.22 L222.1 196.44 L225.98 198.62 L229.87 200.76 L233.75 202.86 L237.64 204.93 L241.52 206.96 L245.41 208.95 L249.29 210.9 L253.18 212.82 L257.06 214.71 L260.95 216.56 L264.83 218.37 L268.72 220.16 L272.61 221.9 L276.49 223.62 L280.38 225.3 L284.26 226.94 L288.15 228.56 L292.03 230.14 L295.92 231.69 L299.8 233.21 L303.69 234.7 L307.57 236.15 L311.46 237.57 L315.34 238.96 L319.23 240.32 L323.11 241.64 L327 242.94 L330.89 244.2 L334.77 245.43 L338.66 246.63 L342.54 247.8 L346.43 248.93 L350.31 250.04 L354.2 251.11 L358.08 252.15 L361.97 253.16 L365.85 254.13 L369.74 255.07 L373.62 255.98 L377.51 256.86 L381.39 257.7 L385.28 258.51 L389.17 259.29 L393.05 260.03 L396.94 260.74 L400.82 261.41 L404.71 262.05 L408.59 262.65 L412.48 263.21 L416.36 263.74 L420.25 264.24 L424.13 264.69 L428.02 265.11 L431.9 265.48 L435.79 265.82 L439.67 266.12 L443.56 266.38 L447.45 266.59 L451.33 266.76 L455.22 266.89 L459.1 266.97 L462.99 267 L466.87 266.99 L470.76 266.93 L474.64 266.82 L478.53 266.66 L482.41 266.44 L486.3 266.16 L490.18 265.83 L494.07 265.43 L497.95 264.97 L501.84 264.45 L505.73 263.85 L509.61 263.18 L513.5 262.42 L517.38 261.59 L521.27 260.65 L525.15 259.62 L529.04 258.48 L532.92 257.22 L536.81 255.82 L540.69 254.26 L544.58 252.52 L548.46 250.56 L552.35 248.3 L556.23 245.65 L560.12 242.27"/><path class="gr" stroke-dasharray="4 3" d="M463.77 294 L463.77 267.01"/><circle class="f2" cx="463.77" cy="267.01" r="5"/><text class="ink bold" x="471.77" y="289.01" text-anchor="start">평형 — 여기서 ΔG = 0, Q = K</text><text class="ink sm" x="101.4" y="71.67" text-anchor="start">순수한 반응물만</text><text class="ink sm" x="552.6" y="226.33" text-anchor="end">순수한 생성물만</text><circle class="f1" cx="93.88" cy="88.84" r="4"/><circle class="f1" cx="560.12" cy="242.27" r="4"/><path class="s3" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M233 216.67 L350.5 216.67"/><text class="ink" x="233" y="205.07" text-anchor="start">정반응이 자발  (ΔG &lt; 0)</text><path class="s3" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M547.9 265 L496.2 265"/><text class="ink" x="545.55" y="255.33" text-anchor="end">역반응이 자발</text><path class="gr" stroke-dasharray="4 3" d="M93.88 88.84 L560.12 88.84"/><text class="ink2 sm" x="327" y="71.67" text-anchor="middle">ΔG° 는 양 끝의 높이 차이</text><text class="ink" x="340" y="344" text-anchor="middle">ΔG° 는 양 끝의 높이 차이이고, ΔG 는 지금 서 있는 자리의 기울기다. 둘은 다른 양이다</text><text class="ink2 sm" x="340" y="368" text-anchor="middle">바닥이 오른쪽 끝이 아니라 안쪽에 있는 것이 요점이다. 반응은 완결되지 않고 평형에서 멈춘다</text>
