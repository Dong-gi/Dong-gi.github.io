-s2)" stroke-width="1.5"/><text class="ink" x="299" y="225" text-anchor="middle"></text><circle cx="333" cy="220" r="7" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="333" y="225" text-anchor="middle"></text><circle cx="316" cy="193" r="7" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="316" y="198" text-anchor="middle"></text><text class="ink2 sm" x="400" y="215" text-anchor="start">NH₃ 4개가 생긴다</text><text class="ink bold" x="20" y="272" text-anchor="start">남은 것</text><circle cx="119" cy="274" r="13" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.5"/><text class="ink" x="119" y="279" text-anchor="middle"></text><circle cx="141" cy="274" r="13" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.5"/><text class="ink" x="141" y="279" text-anchor="middle"></text><text class="ink2 sm" x="180" y="279" text-anchor="start">N₂ 1개는 짝을 못 찾고 남는다</text><text class="ink2 sm" x="20" y="330" text-anchor="start">먼저 바닥나는 쪽(여기서는 H₂)이 한계 반응물이고, 생성물의 양은 그쪽이 정한다</text>
