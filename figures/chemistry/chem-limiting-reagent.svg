ar(--s2)" stroke-width="1.5"/><text class="ink" x="181" y="131" text-anchor="middle"></text><circle cx="195" cy="126" r="8" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="195" y="131" text-anchor="middle"></text><circle cx="215" cy="126" r="8" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="215" y="131" text-anchor="middle"></text><circle cx="229" cy="126" r="8" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="229" y="131" text-anchor="middle"></text><circle cx="249" cy="126" r="8" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="249" y="131" text-anchor="middle"></text><circle cx="263" cy="126" r="8" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="263" y="131" text-anchor="middle"></text><circle cx="283" cy="126" r="8" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="283" y="131" text-anchor="middle"></text><circle cx="297" cy="126" r="8" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.5"/><text class="ink" x="297" y="131" text-anchor="middle"></text><text class="ink2 sm" x="320" y="131" text-anchor="start">H₂ 6개</text><text class="ink2 sm" x="646" y="82" text-anchor="end">N₂ 로 따지면 NH₃ 6개까지 가능</text><text class="ink bold" x="646" y="126" text-anchor="end">H₂ 로 따지면 NH₃ 4개까지 가능 ←  적은 쪽</text><path d="M20 158 L640 158" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="20" y="196" text-anchor="start">실제로 일어난 것</text><circle cx="130" cy="210" r="13" fill="var(--s1)" fill-opacity="0.6" stroke="var(--s1)" stroke-width="1.5"/><text class="ink" x="130" y="215" text-anchor="middle"></text><circle cx="113" cy="220" r="7" fill="var(--s2)" fill-opacity="0.7" stroke="var(--s2)" stroke-width="1.5"/><text