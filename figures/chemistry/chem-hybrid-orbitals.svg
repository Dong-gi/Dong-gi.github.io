<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" width="660" height="280" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">혼성 오비탈</title><desc id="d">sp, sp2, sp3 혼성 오비탈의 배치</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="12" y="20" width="206" height="220" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="115" y="40" text-anchor="middle">sp</text><text class="ink2 sm" x="115" y="56" text-anchor="middle">직선 180°   예: 아세틸렌의 C</text><path transform="translate(115 146) rotate(0)" d="M0 0 C 13.64 -34 53.32 -30.6 62 0 C 53.32 30.6 13.64 34 0 0 Z" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(115 146) rotate(-180)" d="M0 0 C 4.4 -14 17.2 -12.6 20 0 C 17.2 12.6 4.4 14 0 0 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.2"/><path transform="translate(115 146) rotate(-180)" d="M0 0 C 13.64 -34 53.32 -30.6 62 0 C 53.32 30.6 13.64 34 0 0 Z" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(115 146) rotate(-360)" d="M0 0 C 4.4 -14 17.2 -12.6 20 0 C 17.2 12.6 4.4 14 0 0 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.2"/><circle cx="115" cy="146" r="6" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="226" y="20" width="206" height="220" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="329" y="40" text-anchor="middle">sp²</text><text class="ink2 sm" x="329" y="56" text-anchor="middle">평면삼각 120°   예: 에틸렌의 C</text><path transform="translate(329 146) rotate(-90)" d="M0 0 C 13.64 -34 53.32 -30.6 62 0 C 53.32 30.6 13.64 34 0 0 Z" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(329 146) rotate(-270)" d="M0 0 C 4.4 -14 17.2 -12.6 20 0 C 17.2 12.6 4.4 14 0 0 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.2"/><path transform="translate(329 146) rotate(-210)" d="M0 0 C 13.64 -34 53.32 -30.6 62 0 C 53.32 30.6 13.64 34 0 0 Z" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(329 146) rotate(-390)" d="M0 0 C 4.4 -14 17.2 -12.6 20 0 C 17.2 12.6 4.4 14 0 0 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.2"/><path transform="translate(329 146) rotate(-330)" d="M0 0 C 13.64 -34 53.32 -30.6 62 0 C 53.32 30.6 13.64 34 0 0 Z" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(329 146) rotate(-510)" d="M0 0 C 4.4 -14 17.2 -12.6 20 0 C 17.2 12.6 4.4 14 0 0 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.2"/><circle cx="329" cy="146" r="6" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="440" y="20" width="206" height="220" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="543" y="40" text-anchor="middle">sp³</text><text class="ink2 sm" x="543" y="56" text-anchor="middle">사면체 109.5°   예: 메테인의 C</text><path transform="translate(543 146) rotate(-90)" d="M0 0 C 13.64 -34 53.32 -30.6 62 0 C 53.32 30.6 13.64 34 0 0 Z" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(543 146) rotate(-270)" d="M0 0 C 4.4 -14 17.2 -12.6 20 0 C 17.2 12.6 4.4 14 0 0 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.2"/><path transform="translate(543 146) rotate(-210)" d="M0 0 C 13.64 -34 53.32 -30.6 62 0 C 53.32 30.6 13.64 34 0 0 Z" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(543 146) rotate(-390)" d="M0 0 C 4.4 -14 17.2 -12.6 20 0 C 17.2 12.6 4.4 14 0 0 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.2"/><path transform="translate(543 146) rotate(-330)" d="M0 0 C 13.64 -34 53.32 -30.6 62 0 C 53.32 30.6 13.64 34 0 0 Z" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(543 146) rotate(-510)" d="M0 0 C 4.4 -14 17.2 -12.6 20 0 C 17.2 12.6 4.4 14 0 0 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.2"/><path transform="translate(543 146) rotate(-270)" d="M0 0 C 13.64 -34 53.32 -30.6 62 0 C 53.32 30.6 13.64 34 0 0 Z" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(543 146) rotate(-450)" d="M0 0 C 4.4 -14 17.2 -12.6 20 0 C 17.2 12.6 4.4 14 0 0 Z" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.2"/><circle cx="543" cy="146" r="6" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="20" y="270" text-anchor="start">s 하나와 p 몇 개를 섞으면 같은 모양의 새 오비탈이 그 개수만큼 생긴다. 큰 잎이 결합에 쓰인다</text>
</svg>