<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">충돌의 방향</title><desc id="d">방향이 맞은 충돌과 어긋난 충돌의 비교</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="20" y="56" width="660" height="122" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="350" y="76" text-anchor="middle">방향이 맞은 충돌 — 반응이 된다</text><circle cx="110" cy="132" r="17" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="110" y="136" text-anchor="middle">A</text><path d="M127 132 L137 132" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="154" cy="132" r="17" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="154" y="136" text-anchor="middle">B</text><circle cx="250" cy="132" r="17" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="250" y="136" text-anchor="middle">C</text><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M230 132 L186 132"/><text class="ink bold" x="300" y="137" text-anchor="middle">→</text><circle cx="350" cy="132" r="17" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="350" y="136" text-anchor="middle">A</text><path class="s1" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)" d="M374 132 L412 132"/><circle cx="470" cy="132" r="17" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="470" y="136" text-anchor="middle">B</text><path d="M487 132 L497 132" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="514" cy="132" r="17" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="514" y="136" text-anchor="middle">C</text><text class="ink2 sm" x="560" y="137" text-anchor="start">A + B–C</text><text class="ink2 sm" x="30" y="196" text-anchor="start">C 가 B 쪽으로 다가온다 — 끊을 결합과 만들 결합이 한 줄에 놓인다</text><rect x="20" y="214" width="660" height="106" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="350" y="234" text-anchor="middle">방향이 어긋난 충돌 — 그냥 튕긴다</text><circle cx="150" cy="284" r="17" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="150" y="288" text-anchor="middle">A</text><path d="M167 284 L177 284" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="194" cy="284" r="17" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="194" y="288" text-anchor="middle">B</text><circle cx="84" cy="250" r="17" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="84" y="254" text-anchor="middle">C</text><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M98 262 L126 272"/><path class="s2" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="5 3" d="M140 266 L108 236"/><text class="ink bold" x="268" y="289" text-anchor="middle">→</text><text class="ink" x="300" y="289" text-anchor="start">A–B + C   (그대로)</text><text class="ink2 sm" x="300" y="310" text-anchor="start">C 가 A 쪽에서 부딪히면 B–C 결합을 만들 자리가 없다</text><text class="ink bold" x="20" y="32" text-anchor="start">부딪히기만 해서는 반응이 되지 않는다</text><text class="ink2 sm" x="20" y="350" text-anchor="start">반응이 되려면 두 조건이 함께 맞아야 한다. 활성화 에너지를 넘을 만큼의 에너지, 그리고 알맞은 방향</text>
</svg>