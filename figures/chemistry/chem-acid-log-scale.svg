<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">로그 눈금과 pH</title><desc id="d">농도 축과 로그 축을 위아래로 견준 그림</desc>
<style>
