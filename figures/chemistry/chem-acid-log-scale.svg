</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="24" y="40" text-anchor="start">농도를 있는 그대로 자 위에 찍으면</text><path d="M96 122 L652 122" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 122 L96 130" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="96" y="146" text-anchor="middle">0.00</text><path d="M204.8 122 L204.8 130" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="204.8" y="146" text-anchor="middle">0.02</text><path d="M313.6 122 L313.6 130" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="313.6" y="146" text-anchor="middle">0.04</text><path d="M422.4 122 L422.4 130" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="422.4" y="146" text-anchor="middle">0.06</text><path d="M531.2 122 L531.2 130" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="531.2" y="146" text-anchor="middle">0.08</text><path d="M640 122 L640 130" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="640" y="146" text-anchor="middle">0.10</text><text class="ink2 sm" x="660" y="127" text-anchor="start">mol/L</text><circle cx="640" cy="122" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="150.4" cy="122" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="101.44" cy="122" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="96.54" cy="122" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="96.05" cy="122" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="96.01" cy="122" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><path d="M640 116 L640 96" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink sm" x="640" y="90" text-anchor="middle">10⁻¹</text><path d="M150.4 116 L150.4 96" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink sm" x="150.4" y="90" text-anchor="middle">10⁻²</text><path class="s2" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M300 72 L130 110"/><text class="ink2 sm" x="306" y="68" text-anchor="start">10⁻³ 부터 아래는 전부 0 자리에 겹쳐 버린다</text><text class="ink bold" x="24" y="208" text-anchor="start">지수만 세어 늘어놓으면 고르게 퍼진다 — 이것이 로그다</text><path d="M84 300 L652 300" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 294 L96 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="96" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="96" y="284" text-anchor="middle">10⁻¹</text><text class="ink2 sm" x="96" y="326" text-anchor="middle">-1</text><text class="ink2 sm" x="96" y="348" text-anchor="middle">1</text><path d="M137.85 294 L137.85 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="137.85" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="137.85" y="326" text-anchor="middle">-2</text><text class="ink2 sm" x="137.85" y="348" text-anchor="middle">2</text><path d="M179.69 294 L179.69 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="179.69" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="179.69" y="284" text-anchor="middle">10⁻³</text><text class="ink2 sm" x="179.69" y="326" text-anchor="middle">-3</text><text class="ink2 sm" x="179.69" y="348" text-anchor="middle">3</text><path d="M221.54 294 L221.54 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="221.54" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="221.54" y="326" text-anchor="middle">-4</text><text class="ink2 sm" x="221.54" y="348" text-anchor="middle">4</text><path d="M263.38 294 L263.38 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="263.38" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="263.38" y="284" text-anchor="middle">10⁻⁵</text><text class="ink2 sm" x="263.38" y="326" text-anchor="middle">-5</text><text class="ink2 sm" x="263.38" y="348" text-anchor="middle">5</text><path d="M305.23 294 L305.23 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="305.23" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="305.23" y="326" text-anchor="middle">-6</text><text class="ink2 sm" x="305.23" y="348" text-anchor="middle">6</text><path d="M347.08 294 L347.08 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="347.08" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="347.08" y="284" text-anchor="middle">10⁻⁷</text><text class="ink2 sm" x="347.08" y="326" text-anchor="middle">-7</text><text class="ink2 sm" x="347.08" y="348" text-anchor="middle">7</text><path d="M388.92 294 L388.92 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="388.92" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="388.92" y="326" text-anchor="middle">-8</text><text class="ink2 sm" x="388.92" y="348" text-anchor="middle">8</text><path d="M430.77 294 L430.77 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430.77" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="430.77" y="284" text-anchor="middle">10⁻⁹</text><text class="ink2 sm" x="430.77" y="326" text-anchor="middle">-9</text><text class="ink2 sm" x="430.77" y="348" text-anchor="middle">9</text><path d="M472.62 294 L472.62 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="472.62" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="472.62" y="326" text-anchor="middle">-10</text><text class="ink2 sm" x="472.62" y="348" text-anchor="middle">10</text><path d="M514.46 294 L514.46 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="514.46" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="514.46" y="284" text-anchor="middle">10⁻¹¹</text><text class="ink2 sm" x="514.46" y="326" text-anchor="middle">-11</text><text class="ink2 sm" x="514.46" y="348" text-anchor="middle">11</text><path d="M556.31 294 L556.31 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="556.31" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="556.31" y="326" text-anchor="middle">-12</text><text class="ink2 sm" x="556.31" y="348" text-anchor="middle">12</text><path d="M598.15 294 L598.15 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="598.15" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="598.15" y="284" text-anchor="middle">10⁻¹³</text><text class="ink2 sm" x="598.15" y="326" text-anchor="middle">-13</text><text class="ink2 sm" x="598.15" y="348" text-anchor="middle">13</text><path d="M640 294 L640 306" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="300" r="4" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink sm" x="640" y="284" text-anchor="middle">10⁻¹⁴</text><text class="ink2 sm" x="640" y="326" text-anchor="middle">-14</text><text class="ink2 sm" x="640" y="348" text-anchor="middle">14</text><text class="ink2 sm" x="74" y="326" text-anchor="end">로그</text><text class="ink bold" x="74" y="348" text-anchor="end">pH</text><text class="ink2 sm" x="74" y="284" text-anchor="end">농도</text><rect x="96" y="356" width="540" height="56" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="366" y="378" text-anchor="middle">10⁻³ 은 10을 세 번 나눈 값이다. 그래서 로그는 −3 이고, 부호를 뒤집은 3 이 pH 다</text><text class="ink2 sm" x="366" y="398" text-anchor="middle">농도가 10배 묽어질 때마다 pH 는 정확히 1 씩 커진다</text>
