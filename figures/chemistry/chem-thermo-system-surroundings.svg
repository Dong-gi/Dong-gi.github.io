<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">계와 주위</title><desc id="d">계 상자와 열·일 화살표</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="36" text-anchor="start">계와 주위 — 에너지가 드나드는 두 통로</text><rect x="40" y="62" width="680" height="268" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.4" stroke-dasharray="7 5"/><text class="ink2 sm" x="56" y="84" text-anchor="start">주위 (surroundings) — 계 밖의 모든 것</text><rect x="300" y="148" width="160" height="112" rx="6" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold" x="380" y="184" text-anchor="middle">계 (system)</text><text class="ink2 sm" x="380" y="208" text-anchor="middle">지금 관심 있는 부분</text><text class="ink" x="380" y="236" text-anchor="middle">내부에너지 U</text><text class="ink bold" x="221" y="128" text-anchor="middle">열 q</text><path class="s2" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar2)" d="M148 172 L292 172"/><text class="ink" x="221" y="164" text-anchor="middle">q &gt; 0   흡열</text><text class="ink2 sm" x="221" y="192" text-anchor="middle">계가 열을 받았다</text><path class="s1" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar1)" d="M292 226 L148 226"/><text class="ink" x="221" y="218" text-anchor="middle">q &lt; 0   발열</text><text class="ink2 sm" x="221" y="246" text-anchor="middle">계가 열을 내놓았다</text><text class="ink bold" x="539" y="128" text-anchor="middle">일 w</text><path class="s2" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar2)" d="M612 172 L468 172"/><text class="ink" x="539" y="164" text-anchor="middle">w &gt; 0   압축</text><text class="ink2 sm" x="539" y="192" text-anchor="middle">주위가 계에 일을 했다</text><path class="s1" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar1)" d="M468 226 L612 226"/><text class="ink" x="539" y="218" text-anchor="middle">w &lt; 0   팽창</text><text class="ink2 sm" x="539" y="246" text-anchor="middle">계가 주위에 일을 했다</text><text class="ink bold" x="380" y="302" text-anchor="middle">제1법칙   ΔU = q + w</text><text class="ink2 sm" x="380" y="366" text-anchor="middle">부호는 언제나 계를 기준으로 정한다. 계로 들어오면 +, 계에서 나가면 −</text>
</svg>