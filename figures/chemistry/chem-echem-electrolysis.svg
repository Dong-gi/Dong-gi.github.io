ke-width="0"/><text class="ink bold" x="550" y="180" text-anchor="middle">O₂</text><text class="ink2 sm" x="550" y="288" text-anchor="middle">부피 1몫</text><circle cx="214" cy="300" r="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.3"/><circle cx="206" cy="268" r="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.3"/><circle cx="216" cy="240" r="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.3"/><circle cx="204" cy="214" r="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.3"/><circle cx="214" cy="190" r="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.3"/><circle cx="486" cy="296" r="3.6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.3"/><circle cx="494" cy="264" r="3.6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.3"/><circle cx="484" cy="230" r="3.6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.3"/><circle cx="492" cy="200" r="3.6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.3"/><text class="ink bold sm" x="230" y="348" text-anchor="middle">음극 — 환원이 일어난다</text><text class="ink sm" x="230" y="376" text-anchor="middle">2H₂O + 2e⁻ → H₂ + 2OH⁻</text><text class="ink bold sm" x="470" y="348" text-anchor="middle">양극 — 산화가 일어난다</text><text class="ink sm" x="470" y="376" text-anchor="middle">2H₂O → O₂ + 4H⁺ + 4e⁻</text><text class="ink bold" x="20" y="32" text-anchor="start">전기분해 — 전기를 넣어 저절로 일어나지 않는 반응을 억지로 시킨다</text><text class="ink2 sm" x="686" y="410" text-anchor="end">수소와 산소의 부피비가 2 대 1 인 것은 반응식의 계수 그대로다</text>
