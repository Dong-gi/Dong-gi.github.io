<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 390" width="740" height="390" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">증기압 내림</title><desc id="d">순수 용매와 용액의 증발 비교</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">용질이 표면을 차지하면 빠져나가는 분자가 줄어든다</text><rect x="46" y="64" width="200" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><rect x="50" y="178" width="192" height="82" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="none" stroke-width="0"/><text class="ink bold" x="146" y="56" text-anchor="middle">순수한 용매</text><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M70 172 L70 112"/><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M108 172 L108 96"/><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M146 172 L146 112"/><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M184 172 L184 96"/><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M222 172 L222 112"/><rect x="296" y="64" width="200" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><rect x="300" y="178" width="192" height="82" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="none" stroke-width="0"/><text class="ink bold" x="396" y="56" text-anchor="middle">비휘발성 용질을 녹인 용액</text><circle cx="322" cy="196" r="8" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="360" cy="214" r="8" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="398" cy="194" r="8" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="436" cy="216" r="8" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="466" cy="198" r="8" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="342" cy="240" r="8" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><circle cx="418" cy="242" r="8" fill="var(--s2)" fill-opacity="0.6" stroke="var(--s2)" stroke-width="1.2"/><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M320 172 L320 112"/><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M396 172 L396 96"/><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M472 172 L472 112"/><text class="ink" x="146" y="286" text-anchor="middle">증기압 P°</text><text class="ink" x="396" y="286" text-anchor="middle">증기압 P = x P°  (더 낮다)</text><path class="gr" d="M570 246 V96"/><path class="gr" d="M700 246 V96"/><path class="gr" d="M570 246 H700"/><path class="gr" d="M570 96 H700"/><path class="ax" marker-end="url(#ark)" d="M570 246 H710"/><path class="ax" marker-end="url(#ark)" d="M570 246 V86"/><text class="sm ink2" x="700" y="261" text-anchor="middle">1</text><text class="sm ink2" x="564" y="100" text-anchor="end">1</text><text class="sm ink2" x="714" y="250">x(용매)</text><text class="sm ink2" x="570" y="78" text-anchor="middle">P / P°</text><path class="cv s1" d="M570 246 L700 96"/><circle class="f2" cx="674" cy="126" r="4"/><text class="ink bold" x="635" y="76" text-anchor="middle">라울 법칙</text><text class="ink" x="370" y="330" text-anchor="middle">용질이 비휘발성이면 증기에는 용매만 있다. 그런데 표면의 일부를 용질이 차지하므로 나가는 수가 준다</text><text class="ink" x="370" y="356" text-anchor="middle">그래서 증기압이 용매의 몰분율만큼 줄어든다. 총괄성 네 가지가 전부 여기서 나온다</text><text class="ink2 sm" x="724" y="380" text-anchor="end">용질이 무엇인지는 상관없고 몇 개인지만 문제가 된다</text>
</svg>