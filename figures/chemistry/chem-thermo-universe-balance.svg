<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">우주의 엔트로피 수지</title><desc id="d">두 온도에서의 엔트로피 막대 비교</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">자발성은 계만 봐서는 판정할 수 없다 — 주위까지 더해야 한다</text><text class="ink2 sm" x="370" y="58" text-anchor="middle">CaCO₃(s) → CaO(s) + CO₂(g)   ΔH° = +179.2 kJ/mol,  ΔS°(계) = +160.2 J/(mol·K)</text><rect x="24" y="74" width="330" height="246" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="189" y="95" text-anchor="middle">25 °C (298 K)</text><path d="M48 214 L330 214" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="78" y="184.36" width="48" height="29.64" rx="2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="102" y="176.36" text-anchor="middle">+160.2</text><text class="ink sm" x="102" y="232" text-anchor="middle">ΔS<tspan baseline-shift="-22%" font-size="76%">계</tspan></text><rect x="168" y="214" width="48" height="111.19" rx="2" fill="var(--s2)" fill-opacity="0.34" stroke="var(--s2)" stroke-width="1.3"/><text class="ink sm" x="192" y="341.19" text-anchor="middle">-601.0</text><text class="ink sm" x="192" y="206" text-anchor="middle">ΔS<tspan baseline-shift="-22%" font-size="76%">주위</tspan></text><rect x="262" y="214" width="48" height="81.55" rx="2" fill="var(--s2)" fill-opacity="0.34" stroke="var(--s2)" stroke-width="1.3"/><text class="ink sm" x="286" y="311.55" text-anchor="middle">-440.8</text><text class="ink sm" x="286" y="206" text-anchor="middle">합</text><text class="ink bold" x="189" y="300" text-anchor="middle">우주 전체가 줄어든다 → 일어나지 않는다</text><rect x="386" y="74" width="330" height="246" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="551" y="95" text-anchor="middle">1127 °C (1400 K)</text><path d="M410 214 L692 214" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="440" y="184.36" width="48" height="29.64" rx="2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="464" y="176.36" text-anchor="middle">+160.2</text><text class="ink sm" x="464" y="232" text-anchor="middle">ΔS<tspan baseline-shift="-22%" font-size="76%">계</tspan></text><rect x="530" y="214" width="48" height="23.68" rx="2" fill="var(--s2)" fill-opacity="0.34" stroke="var(--s2)" stroke-width="1.3"/><text class="ink sm" x="554" y="253.68" text-anchor="middle">-128.0</text><text class="ink sm" x="554" y="206" text-anchor="middle">ΔS<tspan baseline-shift="-22%" font-size="76%">주위</tspan></text><rect x="624" y="208.04" width="48" height="5.96" rx="2" fill="var(--s3)" fill-opacity="0.34" stroke="var(--s3)" stroke-width="1.3"/><text class="ink sm" x="648" y="200.04" text-anchor="middle">+32.2</text><text class="ink sm" x="648" y="232" text-anchor="middle">합</text><text class="ink bold" x="551" y="300" text-anchor="middle">우주 전체가 늘어난다 → 저절로 일어난다</text><text class="ink" x="370" y="350" text-anchor="middle">ΔS(주위) = −ΔH(계) / T 이므로, 온도가 오르면 주위가 잃는 몫이 작아진다</text><text class="ink2 sm" x="370" y="374" text-anchor="middle">계의 몫은 그대로인데 주위의 몫만 줄어드는 것 — 이것이 고온에서 석회석이 분해되는 이유다</text>
</svg>