5 256.56"/><text class="ink bold sm" x="490.8" y="231.05" text-anchor="end">ΔH 는 그대로</text><text class="ink bold" x="20" y="32" text-anchor="start">촉매는 길을 바꾼다. 출발점과 도착점은 건드리지 않는다</text><text class="ink2 sm" x="20" y="330" text-anchor="start">반응물과 생성물의 높이가 그대로이므로 ΔH 도, 평형상수 K 도 변하지 않는다.</text><text class="ink2 sm" x="20" y="350" text-anchor="start">촉매는 정반응과 역반응의 속도를 같은 배로 키운다. 평형에 빨리 갈 뿐 더 멀리 가지 않는다.</text><text class="ink2 sm" x="20" y="370" text-anchor="start">가운데 골짜기는 중간체다. 촉매 반응이 대개 여러 단계로 나뉘는 이유다</text>
