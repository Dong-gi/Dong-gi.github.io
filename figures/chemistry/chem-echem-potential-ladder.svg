<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" width="660" height="520" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">표준 환원전위</title><desc id="d">F₂ 부터 Li 까지의 표준 환원전위를 세로 축에 늘어놓은 그림</desc>
