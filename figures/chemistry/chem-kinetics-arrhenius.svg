line-shift="-22%" font-size="76%">a</tspan> 를 구할 수 있다</text><text class="ink2 sm" x="462" y="270" text-anchor="start">오른쪽으로 갈수록 저온이다</text><text class="ink bold" x="20" y="32" text-anchor="start">아레니우스 식도 로그를 취하면 직선이 된다</text><text class="ink2 sm" x="20" y="348" text-anchor="start">이 그림은 E<tspan baseline-shift="-22%" font-size="76%">a</tspan> = 50 kJ/mol 로 그린 것이다. 기울기가 가파를수록 온도에 민감한 반응이다</text>
