302 L384 288.92"/><path class="gr" stroke-dasharray="4 3" d="M84 288.92 L384 288.92"/><circle class="f2" cx="384" cy="288.92" r="4.5"/><text class="ink bold sm" x="392" y="280.92" text-anchor="start">1/16</text><path class="gr" stroke-dasharray="4 3" d="M459 302 L459 295.46"/><path class="gr" stroke-dasharray="4 3" d="M84 295.46 L459 295.46"/><circle class="f2" cx="459" cy="295.46" r="4.5"/><text class="ink bold" x="490" y="94" text-anchor="start">반감기 한 번마다 절반</text><text class="ink2 sm" x="490" y="120" text-anchor="start">n 번 지나면 남는 양은</text><text class="ink2 sm" x="490" y="138" text-anchor="start">처음의 2ⁿ 분의 1 이다</text><text class="ink2 sm" x="490" y="164" text-anchor="start">3번 → 1/8 = 12.5 %</text><text class="ink2 sm" x="490" y="182" text-anchor="start">10번 → 약 0.1 %</text><text class="ink2 sm" x="490" y="208" text-anchor="start">반감기 횟수가 정수가</text><text class="ink2 sm" x="490" y="226" text-anchor="start">아니면 로그가 필요하다</text><text class="ink bold" x="490" y="254" text-anchor="start">N = N₀ e^(−λt)</text><text class="ink bold" x="490" y="274" text-anchor="start">t<tspan baseline-shift="-22%" font-size="76%">1/2</tspan> = ln2 / λ</text><text class="ink bold" x="20" y="32" text-anchor="start">방사성 붕괴는 반감기를 셀 줄 알면 대부분 풀린다</text><text class="ink2 sm" x="20" y="348" text-anchor="start">붕괴 확률은 핵이 얼마나 오래되었는지와 무관하다. 그래서 남은 비율만 시간의 함수가 된다.</text><text class="ink2 sm" x="20" y="368" text-anchor="start">온도·압력·화학 결합 상태를 바꿔도 반감기는 바뀌지 않는다. 화학 반응과 결정적으로 다른 점이다</text>
</svg>