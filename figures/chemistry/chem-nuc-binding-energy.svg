05.84" cy="124" r="2.6"/><circle class="f1" cx="108.96" cy="112.23" r="2.6"/><circle class="f1" cx="115.2" cy="110.91" r="2.6"/><circle class="f1" cx="121.44" cy="105.52" r="2.6"/><circle class="f1" cx="127.68" cy="101.12" r="2.6"/><circle class="f1" cx="133.92" cy="100.06" r="2.6"/><circle class="f1" cx="146.4" cy="98.7" r="2.6"/><circle class="f1" cx="171.36" cy="93.07" r="2.6"/><circle class="f1" cx="180.72" cy="92.95" r="2.6"/><circle class="f1" cx="215.04" cy="94.79" r="2.6"/><circle class="f1" cx="250.92" cy="98.62" r="2.6"/><circle class="f1" cx="271.2" cy="99.8" r="2.6"/><circle class="f1" cx="302.4" cy="102.82" r="2.6"/><circle class="f1" cx="333.6" cy="107.36" r="2.6"/><circle class="f1" cx="371.04" cy="111.08" r="2.6"/><circle class="f1" cx="408.48" cy="114.8" r="2.6"/><circle class="f1" cx="450.6" cy="121.3" r="2.6"/><circle class="f1" cx="455.28" cy="121.79" r="2.6"/><text class="ink bold sm" x="171.36" y="81.07" text-anchor="middle">⁵⁶Fe</text><text class="ink bold sm" x="441.28" y="139.79" text-anchor="middle">²³⁸U</text><path class="gr" stroke-dasharray="4 3" d="M90.24 133.47 L137.04 172.87"/><text class="ink bold sm" x="140.16" y="177.58" text-anchor="start">⁴He</text><path class="gr" stroke-dasharray="4 3" d="M87.12 273.82 L124.56 248.21"/><text class="ink2 sm" x="127.68" y="252.92" text-anchor="start">²H — 가장 헐겁다</text><path class="s3" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M130.8 208.19 L165.12 121.08"/><text class="ink bold sm" x="130.8" y="219.96" text-anchor="middle">핵융합</text><path class="s2" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar2)" d="M436.56 158.75 L280.56 125.79"/><text class="ink bold sm" x="445.92" y="177.58" text-anchor="middle">핵분열</text><path class="gr" stroke-dasharray="4 3" d="M171.36 300 L171.36 93.07"/><text class="ink2 sm" x="516" y="96" text-anchor="start">세로축은 핵자 하나당 결합에너지다.</text><text class="ink2 sm" x="516" y="114" text-anchor="start">클수록 단단히 묶여 있다</text><text class="ink bold sm" x="516" y="148" text-anchor="start">봉우리는 질량수 56 부터 62</text><text class="ink2 sm" x="516" y="166" text-anchor="start">(철·니켈) 근처, 약 8.8 MeV</text><text class="ink2 sm" x="516" y="200" text-anchor="start">봉우리 왼쪽에서는 합쳐야,</text><text class="ink2 sm" x="516" y="218" text-anchor="start">오른쪽에서는 쪼개야</text><text class="ink bold sm" x="516" y="236" text-anchor="start">에너지가 나온다</text><text class="ink2 sm" x="516" y="270" text-anchor="start">철보다 무거운 원소는 별의</text><text class="ink2 sm" x="516" y="288" text-anchor="start">평범한 연소로 만들어지지 않는다</text><text class="ink bold" x="20" y="32" text-anchor="start">핵자 하나당 결합에너지 — 어느 쪽으로 가야 에너지가 나오는가</text><text class="ink2 sm" x="20" y="368" text-anchor="start">양쪽 끝에서 가운데로 가는 변화만 에너지를 내놓는다. 그 가운데가 철이다</text>
</svg>