<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">증기압이 내려가면 액체로 있는 온도 구간이 양쪽으로 넓어진다</text><rect x="101.07" y="74" width="517.86" height="26" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.2"/><path d="M70 100 L650 100" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M101.07 100 L101.07 106" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="101.07" y="120" text-anchor="middle">0</text><path d="M230.54 100 L230.54 106" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="230.54" y="120" text-anchor="middle">25</text><path d="M360 100 L360 106" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="360" y="120" text-anchor="middle">50</text><path d="M489.46 100 L489.46 106" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="489.46" y="120" text-anchor="middle">75</text><path d="M618.93 100 L618.93 106" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="618.93" y="120" text-anchor="middle">100</text><text class="ink2 sm" x="662" y="104" text-anchor="start">°C</text><text class="ink" x="360" y="92" text-anchor="middle">물이 액체로 있는 구간</text><text class="ink2 sm" x="70" y="62" text-anchor="start">전체 눈금에서는 변화가 보이지 않는다 — 그래서 양 끝을 확대한다</text><rect x="40" y="158" width="300" height="128" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="190" y="180" text-anchor="middle">어는점 쪽을 확대</text><path d="M58 236 L322 236" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 236 L100 242" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="100" y="258" text-anchor="middle">-2.00</text><path d="M175 236 L175 242" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="175" y="258" text-anchor="middle">-1.00</text><path d="M250 236 L250 242" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="250" y="258" text-anchor="middle">0.00</text><circle cx="250" cy="236" r="5" fill="var(--s1)" fill-opacity="0.9" stroke="none" stroke-width="0"/><path d="M250 232 L250 220" fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink sm" x="250" y="214" text-anchor="middle">순수한 물  0.00</text><circle cx="110.5" cy="236" r="5" fill="var(--s2)" fill-opacity="0.9" stroke="none" stroke-width="0"/><path d="M110.5 232 L110.5 196" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink sm" x="110.5" y="190" text-anchor="middle">용액  −1.86</text><rect x="380" y="158" width="300" height="128" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="530" y="180" text-anchor="middle">끓는점 쪽을 확대</text><path d="M398 236 L662 236" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 236 L430 242" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="430" y="258" text-anchor="middle">99.80</text><path d="M510 236 L510 242" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="510" y="258" text-anchor="middle">100.20</text><path d="M590 236 L590 242" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="590" y="258" text-anchor="middle">100.60</text><circle cx="470" cy="236" r="5" fill="var(--s1)" fill-opacity="0.9" stroke="none" stroke-width="0"/><path d="M470 232 L470 220" fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink sm" x="470" y="214" text-anchor="middle">순수한 물  100.00</text><circle cx="572" cy="236" r="5" fill="var(--s2)" fill-opacity="0.9" stroke="none" stroke-width="0"/><path d="M572 232 L572 196" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink sm" x="572" y="190" text-anchor="middle">용액  100.51</text><text class="ink" x="360" y="320" text-anchor="middle">1.00 mol/kg 비전해질 수용액의 값이다. 어는점은 1.86 내려가고 끓는점은 0.51 올라간다</text><text class="ink2 sm" x="360" y="346" text-anchor="middle">두 값이 다른 것은 물의 K<tspan baseline-shift="-22%" font-size="76%">f</tspan> 와 K<tspan baseline-shift="-22%" font-size="76%">b</tspan> 가 다르기 때문이다. 어는점 쪽이 3배 넘게 예민하다</text><text class="ink2 sm" x="360" y="370" text-anchor="middle">전해질이면 갈라진 알갱이 수만큼 곱해야 한다 — 반트호프 인자 i</text>
</svg>