<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">시스-트랜스 이성질체</title><desc id="d">2-뷰텐의 시스형과 트랜스형</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="20" y="56" width="320" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="180" y="76" text-anchor="middle">시스 (cis)</text><text class="ink2 sm" x="180" y="92" text-anchor="middle">같은 것이 같은 쪽에</text><path d="M165 165.5 L195 165.5" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><path d="M165 170.5 L195 170.5" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink bold" x="152" y="173" text-anchor="middle">C</text><text class="ink bold" x="208" y="173" text-anchor="middle">C</text><path d="M141.14 157.66 L120.86 138.34" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink sm" x="110" y="133" text-anchor="middle">CH₃</text><path d="M141.14 178.34 L120.86 197.66" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink sm" x="110" y="213" text-anchor="middle">H</text><path d="M218.86 157.66 L239.14 138.34" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink sm" x="250" y="133" text-anchor="middle">CH₃</text><path d="M218.86 178.34 L239.14 197.66" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink sm" x="250" y="213" text-anchor="middle">H</text><rect x="360" y="56" width="320" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="520" y="76" text-anchor="middle">트랜스 (trans)</text><text class="ink2 sm" x="520" y="92" text-anchor="middle">같은 것이 반대쪽에</text><path d="M505 165.5 L535 165.5" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><path d="M505 170.5 L535 170.5" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink bold" x="492" y="173" text-anchor="middle">C</text><text class="ink bold" x="548" y="173" text-anchor="middle">C</text><path d="M481.14 157.66 L460.86 138.34" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink sm" x="450" y="133" text-anchor="middle">CH₃</text><path d="M481.14 178.34 L460.86 197.66" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink sm" x="450" y="213" text-anchor="middle">H</text><path d="M558.86 157.66 L579.14 138.34" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink sm" x="590" y="133" text-anchor="middle">H</text><path d="M558.86 178.34 L579.14 197.66" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink sm" x="590" y="213" text-anchor="middle">CH₃</text><text class="ink bold" x="20" y="32" text-anchor="start">이중결합은 축을 돌 수 없다. 그래서 두 가지가 따로 존재한다</text><text class="ink2 sm" x="20" y="292" text-anchor="start">단일결합이라면 축을 자유롭게 돌 수 있어 둘이 같은 물질이 된다. 이중결합은 π 결합이 회전을 막는다.</text><text class="ink2 sm" x="20" y="312" text-anchor="start">두 분자는 끓는점도 쌍극자 모멘트도 다르다. 서로 다른 물질이다.</text><text class="ink2 sm" x="20" y="332" text-anchor="start">고리 화합물에서도 고리가 회전을 막으므로 같은 종류의 이성질체가 생긴다</text>
</svg>