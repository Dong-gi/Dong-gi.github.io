<text class="ink bold" x="20" y="70" text-anchor="start">일산화탄소 CO</text><rect x="150" y="86" width="91.2" height="40" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="195.6" y="111" text-anchor="middle">탄소 12 g</text><rect x="241.2" y="86" width="121.6" height="40" rx="3" fill="var(--s2)" fill-opacity="0.35" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="302" y="111" text-anchor="middle">산소 16 g</text><text class="ink bold" x="20" y="174" text-anchor="start">이산화탄소 CO₂</text><rect x="150" y="190" width="91.2" height="40" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="195.6" y="215" text-anchor="middle">탄소 12 g</text><rect x="241.2" y="190" width="243.2" height="40" rx="3" fill="var(--s2)" fill-opacity="0.35" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="362.8" y="215" text-anchor="middle">산소 32 g</text><path d="M241.2 78 L241.2 242" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M362.8 78 L362.8 242" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path class="s2" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M241.2 64 L362.8 64"/><path class="s2" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M362.8 64 L241.2 64"/><text class="ink2 sm" x="302" y="56" text-anchor="middle">1몫</text><path class="s2" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M241.2 262 L484.4 262"/><path class="s2" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M484.4 262 L241.2 262"/><text class="ink2 sm" x="362.8" y="254" text-anchor="middle">2몫</text><text class="ink bold" x="20" y="34" text-anchor="start">같은 탄소 12 g 에 결합한 산소의 질량</text><text class="ink2 sm" x="606" y="288" text-anchor="end">16 g : 32 g = 1 : 2 — 간단한 정수비가 나온다</text>
