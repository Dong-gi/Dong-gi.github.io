<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">배수비례의 법칙</title><desc id="d">탄소 12 g 에 붙는 산소가 16 g 과 32 g 으로 1대2</desc>
<style>
