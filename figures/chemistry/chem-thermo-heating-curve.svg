<text class="ink bold" x="26" y="34" text-anchor="start">물 1 mol 에 열을 넣으면서 온도를 잰다</text><path class="gr" d="M84 316 V62"/><path class="gr" d="M170.67 316 V62"/><path class="gr" d="M257.33 316 V62"/><path class="gr" d="M344 316 V62"/><path class="gr" d="M430.67 316 V62"/><path class="gr" d="M517.33 316 V62"/><path class="gr" d="M84 294.83 H604"/><path class="gr" d="M84 259.56 H604"/><path class="gr" d="M84 224.28 H604"/><path class="gr" d="M84 189 H604"/><path class="gr" d="M84 153.72 H604"/><path class="gr" d="M84 118.44 H604"/><path class="gr" d="M84 83.17 H604"/><path class="ax" marker-end="url(#ark)" d="M84 259.56 H614"/><path class="ax" marker-end="url(#ark)" d="M84 316 V52"/><text class="sm ink2" x="170.67" y="274.56" text-anchor="middle">10</text><text class="sm ink2" x="257.33" y="274.56" text-anchor="middle">20</text><text class="sm ink2" x="344" y="274.56" text-anchor="middle">30</text><text class="sm ink2" x="430.67" y="274.56" text-anchor="middle">40</text><text class="sm ink2" x="517.33" y="274.56" text-anchor="middle">50</text><text class="sm ink2" x="78" y="298.83" text-anchor="end">-25</text><text class="sm ink2" x="78" y="228.28" text-anchor="end">25</text><text class="sm ink2" x="78" y="193" text-anchor="end">50</text><text class="sm ink2" x="78" y="157.72" text-anchor="end">75</text><text class="sm ink2" x="78" y="122.44" text-anchor="end">100</text><text class="sm ink2" x="78" y="87.17" text-anchor="end">125</text><text class="sm ink2" x="618" y="263.56">넣은 열 (kJ)</text><text class="sm ink2" x="76" y="54" text-anchor="end">온도 (°C)</text><path class="gr" stroke-dasharray="4 3" d="M209.58 259.56 L209.58 118.44"/><path class="gr" stroke-dasharray="4 3" d="M562.31 259.56 L562.31 118.44"/><path class="cv s1" d="M84 294.83 L92.15 259.56 L144.23 259.56 L209.58 118.44 L562.31 118.44 L569.59 83.17"/><text class="ink sm" x="104.8" y="296.24" text-anchor="start">얼음</text><text class="ink bold" x="117.8" y="242.62" text-anchor="middle">녹는 중</text><text class="ink2 sm" x="117.8" y="276.49" text-anchor="middle">6.0 kJ</text><text class="ink" x="155.07" y="155.13" text-anchor="start">물</text><text class="ink bold" x="385.6" y="101.51" text-anchor="middle">끓는 중</text><text class="ink2 sm" x="385.6" y="138.2" text-anchor="middle">40.7 kJ</text><text class="ink sm" x="578" y="76.11" text-anchor="end">수증기</text><circle class="f1" cx="92.15" cy="259.56" r="3"/><circle class="f1" cx="144.23" cy="259.56" r="3"/><circle class="f1" cx="209.58" cy="118.44" r="3"/><circle class="f1" cx="562.31" cy="118.44" r="3"/><text class="ink" x="360" y="356" text-anchor="middle">평평한 두 구간에서는 열을 넣어도 온도가 오르지 않는다. 그 열은 전부 분자를 떼어놓는 데 쓰인다</text><text class="ink2 sm" x="360" y="380" text-anchor="middle">기화에 드는 열이 융해의 약 7배다. 땀이 식혀 주는 효과가 이만큼 크다</text>
