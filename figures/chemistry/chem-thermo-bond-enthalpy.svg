<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">결합엔탈피 경로</title><desc id="d">원자 상태를 거치는 우회 경로</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">결합엔탈피 계산은 &amp;#34;다 끊었다가 다시 붙이는&amp;#34; 우회로다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M64 300 L64 84"/><text class="ink2 sm" x="58" y="76" text-anchor="middle">H</text><path d="M240 96 L470 96" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink" x="355" y="86" text-anchor="middle">H + H + Cl + Cl   (원자로 다 흩어진 상태)</text><path d="M110 252 L240 252" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink" x="110" y="242" text-anchor="start">H₂(g) + Cl₂(g)</text><path d="M470 300 L640 300" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink" x="640" y="322" text-anchor="end">2 HCl(g)</text><path class="s2" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M196 252 L196 96"/><text class="ink bold" x="188" y="162" text-anchor="end">끊는다 (흡열)</text><text class="ink" x="188" y="184" text-anchor="end">+678 kJ</text><path class="s1" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M546 96 L546 300"/><text class="ink bold" x="556" y="176" text-anchor="start">만든다 (발열)</text><text class="ink" x="556" y="198" text-anchor="start">−862 kJ</text><path d="M240 252 L430 252" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path class="s3" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M430 252 L430 300"/><text class="ink bold" x="440" y="284" text-anchor="start">알짜 ΔH ≈ −184 kJ</text><text class="ink" x="350" y="344" text-anchor="middle">끊는 데 든 것에서 만들며 나온 것을 뺀다.  ΔH ≈ 678 − 862 = −184 kJ</text><text class="ink2 sm" x="350" y="368" text-anchor="middle">표의 결합엔탈피가 여러 화합물의 평균값이므로 이 계산은 어디까지나 어림이다</text>
</svg>