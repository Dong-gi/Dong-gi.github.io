<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">K 의 크기</title><desc id="d">다섯 가지 K 값의 평형 조성 막대</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">K 의 크기는 평형에서 어느 쪽이 많은지를 말한다</text><rect x="130" y="76" width="248.4" height="26" rx="2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><rect x="378.4" y="76" width="1.6" height="26" rx="2" fill="var(--s2)" fill-opacity="0.5" stroke="var(--s2)" stroke-width="1"/><text class="ink" x="116" y="94" text-anchor="end">K = 10⁻⁵</text><text class="ink2 sm" x="394" y="94" text-anchor="start">거의 반응물만 — 반응이 일어나지 않은 것처럼 보인다</text><rect x="130" y="126" width="247.52" height="26" rx="2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><rect x="377.52" y="126" width="2.48" height="26" rx="2" fill="var(--s2)" fill-opacity="0.5" stroke="var(--s2)" stroke-width="1"/><text class="ink" x="116" y="144" text-anchor="end">K = 10⁻²</text><text class="ink2 sm" x="394" y="144" text-anchor="start">반응물 쪽으로 크게 치우친다</text><rect x="130" y="176" width="125" height="26" rx="2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><rect x="255" y="176" width="125" height="26" rx="2" fill="var(--s2)" fill-opacity="0.5" stroke="var(--s2)" stroke-width="1"/><text class="ink" x="116" y="194" text-anchor="end">K = 1</text><text class="ink2 sm" x="394" y="194" text-anchor="start">양쪽이 비슷하다</text><rect x="130" y="226" width="2.48" height="26" rx="2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><rect x="132.48" y="226" width="247.52" height="26" rx="2" fill="var(--s2)" fill-opacity="0.5" stroke="var(--s2)" stroke-width="1"/><text class="ink" x="116" y="244" text-anchor="end">K = 10²</text><text class="ink2 sm" x="394" y="244" text-anchor="start">생성물 쪽으로 크게 치우친다</text><rect x="130" y="276" width="0" height="26" rx="2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><rect x="130" y="276" width="250" height="26" rx="2" fill="var(--s2)" fill-opacity="0.5" stroke="var(--s2)" stroke-width="1"/><text class="ink" x="116" y="294" text-anchor="end">K = 10⁵</text><text class="ink2 sm" x="394" y="294" text-anchor="start">거의 생성물만 — 다 갔다고 보아도 된다</text><rect x="130" y="50" width="60" height="16" rx="2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="198" y="63" text-anchor="start">반응물</text><rect x="260" y="50" width="60" height="16" rx="2" fill="var(--s2)" fill-opacity="0.5" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="328" y="63" text-anchor="start">생성물</text><text class="ink" x="350" y="334" text-anchor="middle">K 는 ‘어디까지 가는가’만 말한다. ‘얼마나 빨리 가는가’는 전혀 말하지 않는다</text>
</svg>