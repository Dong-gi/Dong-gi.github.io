<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">분자의 극성</title><desc id="d">CO2 는 지워지고 H2O 는 남는 쌍극자</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="12" y="20" width="300" height="260" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="162" y="40" text-anchor="middle">CO₂ — 무극성 분자</text><text class="ink2 sm" x="162" y="56" text-anchor="middle">극성 결합 두 개가 서로 지운다</text><path d="M100 160 L224 160" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="162" cy="160" r="20" fill="var(--ink2)" fill-opacity="0.2" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink" x="162" y="165" text-anchor="middle">C</text><circle cx="86" cy="160" r="22" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.5"/><text class="ink" x="86" y="165" text-anchor="middle">O</text><circle cx="238" cy="160" r="22" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.5"/><text class="ink" x="238" y="165" text-anchor="middle">O</text><path class="s1" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M156 120 L100 120"/><path class="s1" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M168 120 L224 120"/><text class="ink bold" x="162" y="222" text-anchor="middle">합 = 0</text><text class="ink2 sm" x="162" y="244" text-anchor="middle">크기가 같고 방향이 반대다</text><text class="ink2 sm" x="162" y="106" text-anchor="middle">결합 쌍극자</text><rect x="328" y="20" width="300" height="260" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="478" y="40" text-anchor="middle">H₂O — 극성 분자</text><text class="ink2 sm" x="478" y="56" text-anchor="middle">굽어 있어 지워지지 않는다</text><path d="M478 176 L420 210" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M478 176 L536 210" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="478" cy="176" r="22" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.5"/><text class="ink" x="478" y="181" text-anchor="middle">O</text><circle cx="412" cy="214" r="16" fill="var(--ink2)" fill-opacity="0.2" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink" x="412" y="219" text-anchor="middle">H</text><circle cx="544" cy="214" r="16" fill="var(--ink2)" fill-opacity="0.2" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink" x="544" y="219" text-anchor="middle">H</text><path class="s1" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M430 216 L466 194"/><path class="s1" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M526 216 L490 194"/><path class="s2" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#ar2)" d="M478 182 L478 124"/><text class="ink bold" x="486" y="132" text-anchor="start">합이 남는다</text><text class="ink2 sm" x="478" y="264" text-anchor="middle">이 남은 화살표가 물의 모든 성질을 만든다</text><text class="ink2 sm" x="20" y="310" text-anchor="start">화살표는 전자가 끌려가는 쪽을 가리킨다. 결합이 극성이어도 모양에 따라 분자는 무극성일 수 있다</text>
</svg>