<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">표준 수소 전극</title><desc id="d">수소 기체를 흘리는 백금 전극과 1 mol/L 산 용액</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="122" y="178" width="206" height="160" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="none" stroke-width="0"/><rect x="120" y="140" width="210" height="200" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><rect x="190" y="58" width="46" height="226" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><path class="s3" fill="none" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar3)" d="M213 26 L213 54"/><text class="ink sm" x="228" y="34" text-anchor="start">H₂ 기체 100 kPa</text><rect x="204" y="116" width="18" height="150" rx="2" fill="var(--ink2)" fill-opacity="0.45" stroke="var(--ink2)" stroke-width="1.3"/><path d="M213 116 L213 96 L372 96" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink2 sm" x="380" y="100" text-anchor="start">측정하려는 반쪽 전지로</text><circle cx="198" cy="248" r="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4"/><circle cx="228" cy="230" r="5" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4"/><circle cx="202" cy="206" r="3.5" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4"/><circle cx="230" cy="188" r="4.5" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4"/><circle cx="196" cy="170" r="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="155" y="300" text-anchor="middle">H⁺ 1 mol/L</text><path d="M224 200 L372 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink bold sm" x="380" y="196" text-anchor="start">백금 전극</text><text class="ink2 sm" x="380" y="214" text-anchor="start">반응하지 않고 전자만 주고받는다</text><rect x="388" y="250" width="250" height="62" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="513" y="276" text-anchor="middle">E° ≡ 0 V</text><text class="ink2 sm" x="513" y="296" text-anchor="middle">재어서 얻은 값이 아니라 약속한 값이다</text><text class="ink bold" x="20" y="30" text-anchor="start">표준 수소 전극</text><text class="ink2 sm" x="20" y="370" text-anchor="start">2H⁺(1 mol/L) + 2e⁻ ⇌ H₂(100 kPa) 의 전위를 0 으로 약속한다.</text><text class="ink2 sm" x="20" y="390" text-anchor="start">전극 하나의 절대 전위는 잴 수 없다. 잴 수 있는 것은 언제나 두 전극의 차이뿐이다</text>
</svg>