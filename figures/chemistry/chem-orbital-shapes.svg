<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" width="660" height="440" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">s, p, d 오비탈의 모양</title><desc id="d">1s, 2s, 2p 세 방향, 3d 하나를 나란히 그린 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<defs><radialGradient id="sfade"><stop offset="0" stop-color="var(--s1)" stop-opacity="0.75"/><stop offset="0.55" stop-color="var(--s1)" stop-opacity="0.30"/><stop offset="1" stop-color="var(--s1)" stop-opacity="0.02"/></radialGradient><radialGradient id="sring"><stop offset="0" stop-color="var(--s1)" stop-opacity="0.70"/><stop offset="0.32" stop-color="var(--s1)" stop-opacity="0.05"/><stop offset="0.46" stop-color="var(--s2)" stop-opacity="0.05"/><stop offset="0.70" stop-color="var(--s2)" stop-opacity="0.34"/><stop offset="1" stop-color="var(--s2)" stop-opacity="0.02"/></radialGradient></defs><rect x="15" y="20" width="210" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="120" y="40" text-anchor="middle">1s</text><text class="ink2 sm" x="120" y="56" text-anchor="middle">공 모양. 방향이 없다</text><path d="M46 134 L194 134" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 60 L120 208" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="198" y="138" text-anchor="start">x</text><text class="ink2 sm" x="124" y="57" text-anchor="start">z</text><circle cx="120" cy="134" r="62" fill="url(#sfade)"/><circle cx="120" cy="134" r="62" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1" stroke-dasharray="4 3"/><rect x="228" y="20" width="210" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="333" y="40" text-anchor="middle">2s</text><text class="ink2 sm" x="333" y="56" text-anchor="middle">가운데를 자르면 마디가 하나</text><path d="M259 134 L407 134" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M333 60 L333 208" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="411" y="138" text-anchor="start">x</text><text class="ink2 sm" x="337" y="57" text-anchor="start">z</text><circle cx="333" cy="134" r="70" fill="url(#sring)"/><circle cx="333" cy="134" r="70" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1" stroke-dasharray="4 3"/><circle cx="333" cy="134" r="27" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="3 3"/><text class="ink2 sm" x="365" y="104" text-anchor="start">마디</text><rect x="441" y="20" width="210" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="546" y="40" text-anchor="middle">2p(z)</text><text class="ink2 sm" x="546" y="56" text-anchor="middle">z 축을 따라 아령 모양</text><path d="M472 134 L620 134" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M546 60 L546 208" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="624" y="138" text-anchor="start">x</text><text class="ink2 sm" x="550" y="57" text-anchor="start">z</text><path transform="translate(546 134) rotate(-90)" d="M0 0 C 14.52 -46 56.76 -41.4 66 0 C 56.76 41.4 14.52 46 0 0 Z" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(546 134) rotate(90)" d="M0 0 C 14.52 -46 56.76 -41.4 66 0 C 56.76 41.4 14.52 46 0 0 Z" fill="var(--s2)" fill-opacity="0.35" stroke="var(--s2)" stroke-width="1.2"/><text class="ink sm" x="560" y="88" text-anchor="start">+</text><text class="ink sm" x="560" y="188" text-anchor="start">−</text><rect x="15" y="226" width="210" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="120" y="246" text-anchor="middle">2p(x)</text><text class="ink2 sm" x="120" y="262" text-anchor="middle">같은 모양을 x 축으로 돌린 것</text><path d="M46 340 L194 340" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 266 L120 414" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="198" y="344" text-anchor="start">x</text><text class="ink2 sm" x="124" y="263" text-anchor="start">z</text><path transform="translate(120 340) rotate(0)" d="M0 0 C 14.52 -46 56.76 -41.4 66 0 C 56.76 41.4 14.52 46 0 0 Z" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(120 340) rotate(-180)" d="M0 0 C 14.52 -46 56.76 -41.4 66 0 C 56.76 41.4 14.52 46 0 0 Z" fill="var(--s2)" fill-opacity="0.35" stroke="var(--s2)" stroke-width="1.2"/><rect x="228" y="226" width="210" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="333" y="246" text-anchor="middle">2p(y)</text><text class="ink2 sm" x="333" y="262" text-anchor="middle">y 축은 화면 안쪽 방향</text><path d="M259 340 L407 340" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M333 266 L333 414" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="411" y="344" text-anchor="start">x</text><text class="ink2 sm" x="337" y="263" text-anchor="start">z</text><path d="M287.12 385.88 L378.88 294.12" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink2 sm" x="382.88" y="294.12" text-anchor="start">y</text><path transform="translate(333 340) rotate(-45)" d="M0 0 C 13.64 -40 53.32 -36 62 0 C 53.32 36 13.64 40 0 0 Z" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(333 340) rotate(-225)" d="M0 0 C 13.64 -40 53.32 -36 62 0 C 53.32 36 13.64 40 0 0 Z" fill="var(--s2)" fill-opacity="0.35" stroke="var(--s2)" stroke-width="1.2"/><rect x="441" y="226" width="210" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="546" y="246" text-anchor="middle">3d(xy)</text><text class="ink2 sm" x="546" y="262" text-anchor="middle">d 는 잎이 넷 (5장에서 쓴다)</text><path d="M472 340 L620 340" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M546 266 L546 414" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="624" y="344" text-anchor="start">x</text><text class="ink2 sm" x="550" y="263" text-anchor="start">y</text><path transform="translate(546 340) rotate(-45)" d="M0 0 C 12.76 -34 49.88 -30.6 58 0 C 49.88 30.6 12.76 34 0 0 Z" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(546 340) rotate(-135)" d="M0 0 C 12.76 -34 49.88 -30.6 58 0 C 49.88 30.6 12.76 34 0 0 Z" fill="var(--s2)" fill-opacity="0.35" stroke="var(--s2)" stroke-width="1.2"/><path transform="translate(546 340) rotate(-225)" d="M0 0 C 12.76 -34 49.88 -30.6 58 0 C 49.88 30.6 12.76 34 0 0 Z" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><path transform="translate(546 340) rotate(-315)" d="M0 0 C 12.76 -34 49.88 -30.6 58 0 C 49.88 30.6 12.76 34 0 0 Z" fill="var(--s2)" fill-opacity="0.35" stroke="var(--s2)" stroke-width="1.2"/><text class="ink2 sm" x="646" y="432" text-anchor="end">색은 파동의 부호(위상)다. 진하기가 전자를 발견할 확률에 해당한다</text>
</svg>