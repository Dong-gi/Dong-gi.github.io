<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">ΔG 와 온도</title><desc id="d">네 가지 부호 조합의 직선</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">ΔG 는 온도의 일차함수다 — 세로 절편이 ΔH, 기울기가 −ΔS</text><path class="gr" d="M92 326 V58"/><path class="gr" d="M197 326 V58"/><path class="gr" d="M302 326 V58"/><path class="gr" d="M407 326 V58"/><path class="gr" d="M512 326 V58"/><path class="gr" d="M92 313.82 H512"/><path class="gr" d="M92 252.91 H512"/><path class="gr" d="M92 192 H512"/><path class="gr" d="M92 131.09 H512"/><path class="gr" d="M92 70.18 H512"/><path class="ax" marker-end="url(#ark)" d="M92 192 H522"/><path class="ax" marker-end="url(#ark)" d="M92 326 V48"/><text class="sm ink2" x="197" y="207" text-anchor="middle">250</text><text class="sm ink2" x="302" y="207" text-anchor="middle">500</text><text class="sm ink2" x="407" y="207" text-anchor="middle">750</text><text class="sm ink2" x="512" y="207" text-anchor="middle">1000</text><text class="sm ink2" x="86" y="317.82" text-anchor="end">-200</text><text class="sm ink2" x="86" y="256.90999999999997" text-anchor="end">-100</text><text class="sm ink2" x="86" y="135.09" text-anchor="end">100</text><text class="sm ink2" x="86" y="74.18" text-anchor="end">200</text><text class="sm ink2" x="526" y="196">T (K)</text><text class="sm ink2" x="84" y="50" text-anchor="end">ΔG (kJ/mol)</text><path class="cv" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="7 4" d="M92 192 L512 192"/><path class="cv s1" d="M92 252.91 L512 313.82"/><path class="cv s2" d="M92 252.91 L512 131.09"/><circle class="f1" cx="302" cy="192" r="4"/><text class="ink2 sm" x="302" y="180" text-anchor="middle">전환 온도</text><path class="cv s3" d="M92 131.09 L512 252.91"/><circle class="f1" cx="302" cy="192" r="4"/><text class="ink2 sm" x="302" y="180" text-anchor="middle">전환 온도</text><path class="cv" stroke="var(--ink2)" stroke-dasharray="6 4" d="M92 131.09 L512 70.18"/><text class="ink bold" x="100.4" y="307.73" text-anchor="start">ΔG &lt; 0 — 자발</text><text class="ink2" x="100.4" y="76.27" text-anchor="start">ΔG &gt; 0 — 비자발</text><path d="M540 87 L572 87" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="582" y="92" text-anchor="start">ΔH &lt; 0,  ΔS &gt; 0</text><text class="ink2 sm" x="582" y="111" text-anchor="start">어느 온도에서나 자발</text><path d="M540 141 L572 141" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="582" y="146" text-anchor="start">ΔH &lt; 0,  ΔS &lt; 0</text><text class="ink2 sm" x="582" y="165" text-anchor="start">낮은 온도에서만 자발</text><path d="M540 195 L572 195" fill="none" stroke="var(--s3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="582" y="200" text-anchor="start">ΔH &gt; 0,  ΔS &gt; 0</text><text class="ink2 sm" x="582" y="219" text-anchor="start">높은 온도에서만 자발</text><path d="M540 249 L572 249" fill="none" stroke="var(--ink2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text class="ink" x="582" y="254" text-anchor="start">ΔH &gt; 0,  ΔS &lt; 0</text><text class="ink2 sm" x="582" y="273" text-anchor="start">어느 온도에서도 비자발</text><text class="ink" x="390" y="362" text-anchor="middle">가로 점선(ΔG = 0)을 지나는 지점이 전환 온도이고, 그 값이 ΔH / ΔS 다</text><text class="ink2 sm" x="390" y="386" text-anchor="middle">기울기의 부호를 정하는 것은 ΔS 다. 부호가 하나만 바뀌어도 그림이 완전히 달라진다</text>
</svg>