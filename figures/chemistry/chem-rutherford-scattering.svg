<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<circle cx="400" cy="80" r="46" fill="var(--s1)" fill-opacity="0.08" stroke="var(--grid)" stroke-width="1" stroke-dasharray="4 3"/><circle cx="400" cy="80" r="4.5" fill="var(--s2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="400" cy="175" r="46" fill="var(--s1)" fill-opacity="0.08" stroke="var(--grid)" stroke-width="1" stroke-dasharray="4 3"/><circle cx="400" cy="175" r="4.5" fill="var(--s2)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="400" cy="270" r="46" fill="var(--s1)" fill-opacity="0.08" stroke="var(--grid)" stroke-width="1" stroke-dasharray="4 3"/><circle cx="400" cy="270" r="4.5" fill="var(--s2)" fill-opacity="1" stroke="none" stroke-width="0"/><text class="ink2 sm" x="400" y="336" text-anchor="middle">금 원자 (점선 = 전자가 퍼져 있는 범위, 가운데 점 = 핵)</text><text class="ink2 sm" x="20" y="368" text-anchor="start">거의 다 그대로 통과 → 원자 속은 대부분 비어 있다</text><text class="ink2 sm" x="20" y="388" text-anchor="start">아주 드물게 크게 되튄다 → 가운데에 작고 무겁고 양전하인 덩어리가 있다</text><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M70 50 L600 50"/><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M70 128 L600 128"/><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M70 222 L600 222"/><path class="s3" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M70 300 L600 300"/><path d="M70 175 L340 175 Q 400 172 600 138" fill="none" stroke="var(--s1)" stroke-width="2" marker-end="url(#ar1)"/><path d="M70 80 L386 80 Q 406 78 280 26" fill="none" stroke="var(--s2)" stroke-width="2.4" marker-end="url(#ar2)"/><text class="ink" x="70" y="26" text-anchor="start">알파 입자를 쏜다</text><text class="ink2 sm" x="292" y="30" text-anchor="start">크게 되튄 것 (아주 드물다)</text>
