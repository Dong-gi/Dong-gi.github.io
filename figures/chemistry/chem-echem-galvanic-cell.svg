<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 510" width="740" height="510" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">갈바니 전지</title><desc id="d">아연-구리 전지의 전극·염다리·전자 흐름</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="92" y="238" width="186" height="140" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="none" stroke-width="0"/><rect x="90" y="200" width="190" height="180" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><rect x="452" y="238" width="186" height="140" rx="2" fill="var(--s2)" fill-opacity="0.1" stroke="none" stroke-width="0"/><rect x="450" y="200" width="190" height="180" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.8"/><rect x="130" y="150" width="18" height="200" rx="2" fill="var(--ink2)" fill-opacity="0.35" stroke="var(--ink2)" stroke-width="1.4"/><rect x="582" y="150" width="18" height="200" rx="2" fill="var(--s2)" fill-opacity="0.4" stroke="var(--s2)" stroke-width="1.4"/><path d="M139 150 L139 100 L347 100" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round"/><path d="M383 100 L591 100 L591 150" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="365" cy="100" r="18" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><text class="ink bold" x="365" y="105" text-anchor="middle">V</text><text class="ink bold" x="365" y="70" text-anchor="middle">1.10 V</text><path class="s1" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M210 100 L300 100"/><text class="ink sm" x="255" y="90" text-anchor="middle">e⁻ 가 흐른다</text><path class="s1" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M520 100 L440 100"/><path d="M240 300 L240 174 L490 174 L490 300" fill="none" stroke="var(--s3)" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round"/><path d="M240 300 L240 174 L490 174 L490 300" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink bold" x="365" y="166" text-anchor="middle">염다리 (KNO₃ 용액)</text><path class="s2" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M330 196 L262 196"/><text class="ink2 sm" x="338" y="200" text-anchor="start">NO₃⁻</text><path class="s2" fill="none" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M400 196 L468 196"/><text class="ink2 sm" x="392" y="200" text-anchor="end">K⁺</text><text class="ink bold" x="139" y="138" text-anchor="middle">아연 Zn</text><text class="ink bold" x="591" y="138" text-anchor="middle">구리 Cu</text><text class="ink bold" x="96" y="396" text-anchor="start">산화전극 (−)</text><text class="ink" x="96" y="416" text-anchor="start">Zn → Zn²⁺ + 2e⁻</text><text class="ink2 sm" x="96" y="436" text-anchor="start">전극이 녹아 가늘어진다</text><text class="ink bold" x="634" y="396" text-anchor="end">환원전극 (+)</text><text class="ink" x="634" y="416" text-anchor="end">Cu²⁺ + 2e⁻ → Cu</text><text class="ink2 sm" x="634" y="436" text-anchor="end">전극에 구리가 쌓인다</text><text class="ink2 sm" x="185" y="330" text-anchor="middle">Zn²⁺ 용액</text><text class="ink2 sm" x="545" y="330" text-anchor="middle">Cu²⁺ 용액</text><text class="ink bold" x="20" y="34" text-anchor="start">갈바니 전지 — 전자가 도선으로 돌아가게 만든 장치</text><text class="ink2 sm" x="365" y="476" text-anchor="middle">염다리가 없으면 왼쪽에 양전하가, 오른쪽에 음전하가 쌓여 몇 초 만에 전류가 멈춘다.</text><text class="ink2 sm" x="365" y="496" text-anchor="middle">염다리 속 이온이 반대로 옮겨가 그 전하를 중화해 주기 때문에 전류가 계속 흐른다</text>
</svg>