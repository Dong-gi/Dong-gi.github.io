<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">엔탈피 준위 그림</title><desc id="d">발열과 흡열의 준위 비교</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="26" y="34" text-anchor="start">ΔH 의 부호는 그림에서 &amp;#34;내려가느냐 올라가느냐&amp;#34;다</text><rect x="30" y="56" width="320" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="190" y="77" text-anchor="middle">발열 반응</text><text class="ink2 sm" x="190" y="94" text-anchor="middle">계의 엔탈피가 줄어든다</text><path d="M64 118 L168 118" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink" x="64" y="109" text-anchor="start">반응물</text><path d="M216 240 L320 240" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink" x="320" y="231" text-anchor="end">생성물</text><path d="M168 118 L192 118" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M192 240 L216 240" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path class="s1" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar1)" d="M192 118 L192 240"/><text class="ink bold" x="202" y="175" text-anchor="start">ΔH &amp;lt; 0</text><text class="ink2 sm" x="202" y="195" text-anchor="start">발열</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M50 250 L50 108"/><text class="ink2 sm" x="44" y="100" text-anchor="middle">H</text><text class="ink2 sm" x="190" y="288" text-anchor="middle">줄어든 만큼 주위로 나가 주위가 뜨거워진다</text><rect x="370" y="56" width="320" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="530" y="77" text-anchor="middle">흡열 반응</text><text class="ink2 sm" x="530" y="94" text-anchor="middle">계의 엔탈피가 늘어난다</text><path d="M404 240 L508 240" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink" x="404" y="231" text-anchor="start">반응물</text><path d="M556 118 L660 118" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink" x="660" y="109" text-anchor="end">생성물</text><path d="M508 240 L532 240" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M532 118 L556 118" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path class="s2" fill="none" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M532 240 L532 118"/><text class="ink bold" x="542" y="175" text-anchor="start">ΔH &amp;gt; 0</text><text class="ink2 sm" x="542" y="195" text-anchor="start">흡열</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M390 250 L390 108"/><text class="ink2 sm" x="384" y="100" text-anchor="middle">H</text><text class="ink2 sm" x="530" y="288" text-anchor="middle">늘어난 만큼 주위에서 빼앗아 주위가 차가워진다</text><text class="ink" x="360" y="336" text-anchor="middle">세로축은 엔탈피다. 가로축은 눈금이 아니라 &amp;#34;반응 전 → 반응 후&amp;#34;라는 순서일 뿐이다</text><text class="ink2 sm" x="360" y="360" text-anchor="middle">ΔH 는 두 준위의 높이 차이이고, 부호는 어느 쪽이 위인가가 정한다</text>
</svg>