<title id="t">Q-Q 그림 네 모양</title><desc id="d">정상 칸은 점이 직선 위에 있다. 두꺼운 꼬리 칸은 왼쪽 끝이 아래로, 오른쪽 끝이 위로 벗어난다. 오른쪽 치우침 칸은 아래로 볼록하게 휜다. 봉우리 둘 칸은 가운데가 가파르고 양끝이 눕는다. 점선은 사분위수 두 점을 이은 기준선이다</desc>
