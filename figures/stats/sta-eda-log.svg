<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 320" width="936" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">로그를 씌우면 배 차이가 간격 차이가 된다</title><desc id="d">오른쪽으로 치우친 두 집단(B 가 A 의 세 배)을 원래 척도와 자연로그 척도로 찍었다. 로그 척도에서 두 집단은 대칭이고 퍼짐이 같으며 간격 ln 3 만큼 떨어져 있다</desc>
