round" stroke-linejoin="round"/><circle cx="196" cy="104" r="4.5" fill="var(--s1)"/><circle cx="332.5" cy="220" r="4.5" fill="var(--s1)"/><path d="M202 104 L407.5 220" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="202" cy="104" r="4.5" fill="var(--s1)"/><circle cx="407.5" cy="220" r="4.5" fill="var(--s1)"/><path d="M220 104 L482.5 220" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="104" r="4.5" fill="var(--s1)"/><circle cx="482.5" cy="220" r="4.5" fill="var(--s1)"/><path d="M238 104 L557.5 220" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="238" cy="104" r="4.5" fill="var(--s1)"/><circle cx="557.5" cy="220" r="4.5" fill="var(--s1)"/><path d="M646 104 L632.5 220" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="646" cy="104" r="4.5" fill="var(--s2)"/><circle cx="632.5" cy="220" r="4.5" fill="var(--s2)"/><path d="M251.5 70 L251.5 110" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink sm" x="255.5" y="66" text-anchor="start">평균 30.25</text><path d="M199 84 L199 110" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink sm" x="195" y="80" text-anchor="end">중앙값 21.5</text><text class="ink bold sm" x="646" y="92" text-anchor="middle">96</text><text class="ink bold sm" x="632.5" y="208" text-anchor="middle">8</text><path d="M46 250 L694 250" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="370" y="274" text-anchor="middle">96 이 30 이었어도, 960 이었어도 순위는 8 이다. 값 축에서는 이 한 점 때문에 평균이 중앙값보다 8.75 위에 있다</text><text class="ink2 sm" x="370" y="296" text-anchor="middle">순위 축에서는 간격이 모두 1