<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">값을 순위로 바꾸기 — 이상점의 영향이 끝 순위 하나로 줄어든다</title><desc id="d">여덟 값 가운데 96 하나가 멀리 떨어져 있다. 순위 축으로 옮기면 그 점은 그냥 8 위다</desc>
