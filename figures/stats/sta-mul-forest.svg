<text class="ink bold" x="380" y="26" text-anchor="middle">결합 구간(마름모)은 다섯 연구의 어느 구간보다 좁다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M222.73 310 L222.73 57.43"/><path fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-dasharray="4 3" d="M299.29 310 L299.29 57.43"/><text class="ink2 sm" x="560" y="44" text-anchor="start">추정값 [95% 구간]  가중치</text><path fill="none" stroke="var(--s1)" stroke-width="2" d="M224.91 87.14 L438.73 87.14"/><rect x="328.14" y="83.46" width="7.35" height="7.35" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="1"/><text class="ink sm" x="140" y="91.14" text-anchor="end">연구 가</text><text class="ink sm" x="560" y="91.14" text-anchor="start">0.30 [0.01, 0.59]  11%</text><path fill="none" stroke="var(--s1)" stroke-width="2" d="M187.82 124.29 L330.36 124.29"/><rect x="254.57" y="119.77" width="9.03" height="9.03" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="1"/><text class="ink sm" x="140" y="128.29" text-anchor="end">연구 나</text><text class="ink sm" x="560" y="128.29" text-anchor="start">0.10 [-0.10, 0.30]  25%</text><path fill="none" stroke="var(--s1)" stroke-width="2" d="M243.82 161.43 L528.91 161.43"/><rect x="383.1" y="158.17" width="6.52" height="6.52" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="1"/><text class="ink sm" x="140" y="165.43" text-anchor="end">연구 다</text><text class="ink sm" x="560" y="165.43" text-anchor="start">0.45 [0.06, 0.84]  6%</text><path fill="none" stroke="var(--s1)" stroke-width="2" d="M238.44 198.57 L352.47 198.57"/><rect x="290.31" y="193.43" width="10.29" height="10.29" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="1"/><text class="ink sm" x="140" y="202.57" text-anchor="end">연구 라</text><text class="ink sm" x="560" y="202.57" text-anchor="start">0.20 [0.04, 0.36]  40%</text><path fill="none" stroke="var(--s1)" stroke-width="2" d="M228.11 235.71 L399.16 235.71"/><rect x="309.54" y="231.61" width="8.19" height="8.19" fill="var(--s1)" fill-opacity="1" stroke="none" stroke-width="1"/><text class="ink sm" x="140" y="239.71" text-anchor="end">연구 마</text><text class="ink sm" x="560" y="239.71" text-anchor="start">0.25 [0.01, 0.49]  18%</text><path d="M263.43 287.71 L299.29 279.71 L335.14 287.71 L299.29 295.71 Z" fill="var(--s2)"/><text class="ink bold sm" x="140" y="291.71" text-anchor="end">고정효과 결합</text><text class="ink bold sm" x="560" y="291.71" text-anchor="start">0.21 [0.11, 0.31]</text><text class="ink2 sm" x="150" y="326" text-anchor="middle">-0.2</text><text class="ink2 sm" x="222.73" y="326" text-anchor="middle">0</text><text class="ink2 sm" x="295.45" y="326" text-anchor="middle">0.2</text><text class="ink2 sm" x="368.18" y="326" text-anchor="middle">0.4</text><text class="ink2 sm" x="440.91" y="326" text-anchor="middle">0.6</text><text class="ink2 sm" x="513.64" y="326" text-anchor="middle">0.8</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M150 310 L550 310"/><text class="ink2 sm" x="150" y="345" text-anchor="start">네모 크기는 가중치(1/SE²)에 비례한다. 효과는 표준화 평균차 같은, 연구끼리 견줄 수 있는 척도다.</text>
