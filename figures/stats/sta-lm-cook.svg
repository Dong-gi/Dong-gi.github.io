<title id="t">레버리지와 잔차 평면 위의 쿡 거리</title><desc id="d">쿡 거리 등고선은 레버리지가 클수록 낮은 잔차에서 넘는다. 잔차만 큰 점, 레버리지만 큰 점은 영향이 작고 둘이 함께 큰 점이 영향점이다</desc>
