187.2"/><text class="ink sm" x="172" y="223.6" text-anchor="start">x₁=4 에서 간격 3</text><text class="ink2 sm" x="64" y="265.33" text-anchor="start">x₁=0 에서 간격 3</text><text class="ink2 sm" x="197" y="360" text-anchor="middle">두 집단의 기울기가 같다(2)</text><rect x="395" y="8" width="375" height="362" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="582.5" y="28" text-anchor="middle">상호작용까지: … + 1.5x₁x₂</text><path class="gr" d="M443 300 V54"/><path class="gr" d="M498 300 V54"/><path class="gr" d="M553 300 V54"/><path class="gr" d="M608 300 V54"/><path class="gr" d="M663 300 V54"/><path class="gr" d="M443 300 H663"/><path class="gr" d="M443 245.33 H663"/><path class="gr" d="M443 190.67 H663"/><path class="gr" d="M443 136 H663"/><path class="gr" d="M443 81.33 H663"/><path class="ax" marker-end="url(#ark)" d="M443 300 H673"/><path class="ax" marker-end="url(#ark)" d="M443 300 V44"/><text class="ink2 sm" x="443" y="316" text-anchor="middle">0</text><text class="ink2 sm" x="498" y="316" text-anchor="middle">2</text><text class="ink2 sm" x="553" y="316" text-anchor="middle">4</text><text class="ink2 sm" x="608" y="316" text-anchor="middle">6</text><text class="ink2 sm" x="663" y="316" text-anchor="middle">8</text><text class="ink2 sm" x="437" y="304" text-anchor="end">0</text><text class="ink2 sm" x="437" y="249.33" text-anchor="end">10</text><text class="ink2 sm" x="437" y="194.67" text-anchor="end">20</text><text class="ink2 sm" x="437" y="140" text-anchor="end">30</text><text class="ink2 sm" x="437" y="85.33" text-anchor="end">40</text><text class="ink2 sm" x="663" y="334" text-anchor="end">x₁</text><path d="M443 245.33 L663 157.87" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M443 228.93 L663 75.87" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 4"/><text class="ink2 sm" x="669" y="161.87" text-anchor="start">집단 P (x₂=0)</text><text class="ink2 sm" x="669" y="79.87" text-anchor="start">집단 Q (x₂=1)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-start="url(#ark)" marker-end="url(#ark)" d="M553 199.6 L553 154.4"/><text class="ink sm" x="557" y="223.6" text-anchor="start">x₁=4 에서 간격 9</text><text class="ink2 sm" x="449" y="265.33" text-anchor="start">x₁=0 에서 간격 3</text><text class="ink2 sm" x="582" y="360" text-anchor="middle">집단 Q 의 기울기는 2 + 1.5 = 3.5</text>
</svg>