<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 350" width="936" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">집락 내 상관이 커지면 유효 표본이 준다</title><desc id="d">설계효과는 집락 내 상관에 대해 직선으로 커지고 기울기는 집락 크기에서 1 을 뺀 값이다. 같은 1000명이라도 유효 표본 크기는 설계효과로 나눈 만큼 준다</desc>
