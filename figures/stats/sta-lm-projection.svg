<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">최소제곱은 열공간으로의 정사영</title><desc id="d">y 벡터를 설계행렬의 열공간 평면에 수직으로 내린 발이 적합값 ŷ 이고, 수직선이 잔차 e 다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path d="M60 340 L430 340 L600 235 L230 235 Z" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.4"/><text class="ink2 sm" x="76" y="372" text-anchor="start">X 의 열공간 — 열들의 일차결합 Xb 를 모두 모은 평면</text><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M170 318 L300 330"/><text class="ink2 sm" x="308" y="328" text-anchor="start">열 1 (모두 1)</text><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M170 318 L262 262"/><text class="ink2 sm" x="268" y="266" text-anchor="start">열 x</text><circle cx="170" cy="318" r="3" fill="var(--ink2)"/><text class="ink2 sm" x="160" y="322" text-anchor="end">O</text><path fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ark)" d="M170 318 L430 78"/><text class="ink" x="440" y="82" text-anchor="start">y (관측값 n 개를 세운 벡터)</text><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M170 318 L430 282"/><text class="ink" x="442" y="304" text-anchor="start">ŷ = Hy = Xβ̂ (그림자)</text><path d="M430 78 L430 282" fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text class="ink" x="440" y="180" text-anchor="start">e = y − ŷ (잔차)</text><text class="ink2 sm" x="440" y="198" text-anchor="start">평면의 모든 방향과 직교: Xᵀe = 0</text><path d="M430 268 L418 272 L418 286" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="322" cy="300" r="3.5" fill="var(--ink2)"/><path d="M430 78 L322 300" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text class="ink2 sm" x="316" y="290" text-anchor="end">Xb (다른 후보)</text><text class="ink2 sm" x="250" y="150" text-anchor="end">y 에서 평면 위 다른 점까지의</text><text class="ink2 sm" x="250" y="166" text-anchor="end">거리는 잔차보다 길다</text>
</svg>