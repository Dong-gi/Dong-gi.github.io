<title id="t">큰 비확률표본의 오차</title><desc id="d">자료에 드는 일이 답과 조금만 상관돼도 모집단의 1% 를 모은 자료의 오차가 무작위 표본 1000명의 표준오차보다 크다. 오차를 줄이는 것은 자료의 개수가 아니라 비율 f 와 상관 ρ 다</desc>
