>수염 끝 8</text><path fill="none" stroke="var(--ink2)" stroke-width="1.1" marker-start="url(#ark)" marker-end="url(#ark)" d="M192.7 118 L264.05 118"/><text class="ink2 sm" x="228.38" y="113" text-anchor="middle">IQR = 4</text><text class="ink sm" x="20" y="26" text-anchor="start">휴대전화 사용 시간(h) 11명 — 위: 상자그림, 아래: 같은 자료의 히스토그램(계급 폭 2 h)</text><rect x="174.86" y="322" width="35.68" height="78" rx="0" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1"/><rect x="210.54" y="296" width="35.68" height="104" rx="0" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1"/><rect x="246.22" y="348" width="35.67" height="52" rx="0" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1"/><rect x="281.89" y="374" width="35.68" height="26" rx="0" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1"/><rect x="674.32" y="374" width="35.68" height="26" rx="0" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1"/><path class="ax" marker-end="url(#ark)" d="M50 400 H720"/><path class="ax" marker-end="url(#ark)" d="M50 400 V260"/><path d="M139.19 400 L139.19 404" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="139.19" y="416" text-anchor="middle">0</text><path d="M228.38 400 L228.38 404" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="228.38" y="416" text-anchor="middle">5</text><path d="M317.57 400 L317.57 404" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="317.57" y="416" text-anchor="middle">10</text><path d="M406.76 400 L406.76 404" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="406.76" y="416" text-anchor="middle">15</text><path d="M495.95 400 L495.95 404" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="495.95" y="416" text-anchor="middle">20</text><path d="M585.14 400 L585.14 404" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="585.14" y="416" text-anchor="middle">25</text><path d="M674.32 400 L674.32 404" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="674.32" y="416" text-anchor="middle">30</text><path class="gr" d="M50 348 H710"/><text class="ink2 sm" x="44" y="352" text-anchor="end">2</text><path class="gr" d="M50 296 H710"/><text class="ink2 sm" x="44" y="300" text-anchor="end">4</text><text class="ink2 sm" x="710" y="432" text-anchor="end">사용 시간(h)</text><text class="ink2 sm" x="46" y="256" text-anchor="start">사람 수</text><path d="M85.68 270 L85.68 400" fill="none" stroke="var(--s2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M371.08 270 L371.08 400" fill="none" stroke="var(--s2)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
</svg>