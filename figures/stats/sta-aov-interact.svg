ext><text class="ink sm" x="700" y="118" text-anchor="end">58.8</text><text class="ink sm" x="470" y="146" text-anchor="start">효모</text><text class="ink sm" x="580" y="146" text-anchor="end">75</text><text class="ink sm" x="630" y="146" text-anchor="end">1</text><text class="ink sm" x="700" y="146" text-anchor="end">30.0</text><rect x="462" y="157" width="250" height="24" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="470" y="174" text-anchor="start">온도 × 효모</text><text class="ink sm" x="580" y="174" text-anchor="end">27</text><text class="ink sm" x="630" y="174" text-anchor="end">1</text><text class="ink sm" x="700" y="174" text-anchor="end">10.8</text><text class="ink sm" x="470" y="202" text-anchor="start">칸 안(잔차)</text><text class="ink sm" x="580" y="202" text-anchor="end">20</text><text class="ink sm" x="630" y="202" text-anchor="end">8</text><text class="ink sm" x="700" y="202" text-anchor="end"></text><text class="ink2 sm" x="470" y="260" text-anchor="start">25 °C → 35 °C 의 차: 효모 1 g 에서 4, 2 g 에서 10</text><text class="ink2 sm" x="470" y="280" text-anchor="start">두 차의 차의 절반 3 이 상호작용 효과</text><text class="ink bold" x="380" y="28" text-anchor="middle">선이 벌어진 만큼이 분산분석표의 상호작용 행이다</text>
