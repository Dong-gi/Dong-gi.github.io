<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 374" width="780" height="374" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">정지 문제의 대각선</title><desc id="d">프로그램을 행, 입력 문자열을 열로 놓고 멈추는지를 적은 표에서 대각선을 뒤집어 만든 집합이 어느 프로그램이 인식하는 집합과도 다르다는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">프로그램도 문자열이므로 프로그램과 입력을 같은 축에 놓을 수 있다</text><rect x="20" y="46" width="470" height="300" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="255" y="66" text-anchor="middle">칸은 ‘그 프로그램을 그 문자열에 돌리면 멈추는가’</text><text class="ink2 sm" x="255" y="82" text-anchor="middle">행은 프로그램, 열은 입력 문자열</text><text class="ink2 sm" x="224" y="104" text-anchor="middle">s₀</text><text class="ink2 sm" x="286" y="104" text-anchor="middle">s₁</text><text class="ink2 sm" x="348" y="104" text-anchor="middle">s₂</text><text class="ink2 sm" x="410" y="104" text-anchor="middle">s₃</text><rect x="194" y="111" width="60" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="256" y="143" width="60" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="318" y="175" width="60" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="380" y="207" width="60" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="184" y="131" text-anchor="end">P(s₀)</text><text class="ink sm" x="224" y="131" text-anchor="middle">멈춤</text><text class="ink sm" x="286" y="131" text-anchor="middle">안멈춤</text><text class="ink sm" x="348" y="131" text-anchor="middle">멈춤</text><text class="ink sm" x="410" y="131" text-anchor="middle">안멈춤</text><text class="ink bold sm" x="184" y="163" text-anchor="end">P(s₁)</text><text class="ink sm" x="224" y="163" text-anchor="middle">안멈춤</text><text class="ink sm" x="286" y="163" text-anchor="middle">안멈춤</text><text class="ink sm" x="348" y="163" text-anchor="middle">멈춤</text><text class="ink sm" x="410" y="163" text-anchor="middle">멈춤</text><text class="ink bold sm" x="184" y="195" text-anchor="end">P(s₂)</text><text class="ink sm" x="224" y="195" text-anchor="middle">멈춤</text><text class="ink sm" x="286" y="195" text-anchor="middle">멈춤</text><text class="ink sm" x="348" y="195" text-anchor="middle">안멈춤</text><text class="ink sm" x="410" y="195" text-anchor="middle">멈춤</text><text class="ink bold sm" x="184" y="227" text-anchor="end">P(s₃)</text><text class="ink sm" x="224" y="227" text-anchor="middle">안멈춤</text><text class="ink sm" x="286" y="227" text-anchor="middle">멈춤</text><text class="ink sm" x="348" y="227" text-anchor="middle">멈춤</text><text class="ink sm" x="410" y="227" text-anchor="middle">안멈춤</text><path d="M84 256 L440 256" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="sm bold" fill="var(--s2)" x="184" y="280" text-anchor="end">대각선</text><text class="sm bold" fill="var(--s3)" x="184" y="308" text-anchor="end">뒤집으면 안멈춤</text><text class="sm bold" fill="var(--s2)" x="224" y="280" text-anchor="middle">멈춤</text><text class="sm bold" fill="var(--s3)" x="224" y="308" text-anchor="middle">아니오</text><text class="sm bold" fill="var(--s2)" x="286" y="280" text-anchor="middle">안멈춤</text><text class="sm bold" fill="var(--s3)" x="286" y="308" text-anchor="middle">예</text><text class="sm bold" fill="var(--s2)" x="348" y="280" text-anchor="middle">안멈춤</text><text class="sm bold" fill="var(--s3)" x="348" y="308" text-anchor="middle">예</text><text class="sm bold" fill="var(--s2)" x="410" y="280" text-anchor="middle">안멈춤</text><text class="sm bold" fill="var(--s3)" x="410" y="308" text-anchor="middle">예</text><text class="ink2 sm" x="36" y="336" text-anchor="start">아래 줄이 집합 안멈춤 의 소속 여부다. 어느 행과도 대각선 자리에서 다르다</text><rect x="508" y="46" width="252" height="300" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="634" y="66" text-anchor="middle">결론</text><text class="sm bold" fill="var(--s1)" x="526" y="92" text-anchor="start">정의</text><text class="ink2 sm" x="526" y="112" text-anchor="start">lang(P) ::= P 가 멈추는 문자열 전체</text><text class="ink2 sm" x="526" y="131" text-anchor="start">안멈춤 ::= { s : 프로그램 P(s) 가</text><text class="ink2 sm" x="526" y="150" text-anchor="start">            s 에서 멈추지 않는다 }</text><text class="sm bold" fill="var(--s2)" x="526" y="186" text-anchor="start">정리</text><text class="ink2 sm" x="526" y="206" text-anchor="start">어떤 프로그램도 집합 안멈춤 을</text><text class="ink2 sm" x="526" y="225" text-anchor="start">인식하지 못한다. 인식한다면 그 프로그램</text><text class="ink2 sm" x="526" y="244" text-anchor="start">자신의 코드 s₀ 에서</text><text class="ink2 sm" x="526" y="263" text-anchor="start">s₀ ∈ 안멈춤 ↔ s₀ ∉ 안멈춤 이 된다</text><text class="sm bold" fill="var(--s1)" x="526" y="294" text-anchor="start">언어를 바꿔도 안 된다</text><text class="ink2 sm" x="24" y="360" text-anchor="start">이 표는 칸토어 정리의 표와 같은 모양이다. 다른 것은 축의 이름뿐이고, 그래서 계산의 한계가 무한집합의 크기 이야기에서 나온다</text>
</svg>