<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" width="720" height="402" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">DAG 의 사슬과 반사슬</title><desc id="d">여덟 작업의 DAG 를 깊이별 띠로 나누고, 크기 5 인 사슬과 크기 3 인 반사슬을 표시한 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="26" text-anchor="middle">사슬과 반사슬 — 최소 병렬 시간은 가장 긴 사슬의 크기다</text><rect x="50" y="54" width="350" height="52" rx="8" fill="var(--grid)" fill-opacity="0.35" stroke="none" stroke-width="1.3"/><text x="44" y="85" text-anchor="end" fill="var(--ink2)" class="sm">1단계</text><rect x="50" y="122" width="350" height="52" rx="8" fill="var(--grid)" fill-opacity="0.35" stroke="none" stroke-width="1.3"/><text x="44" y="153" text-anchor="end" fill="var(--ink2)" class="sm">2단계</text><rect x="50" y="190" width="350" height="52" rx="8" fill="var(--grid)" fill-opacity="0.35" stroke="none" stroke-width="1.3"/><text x="44" y="221" text-anchor="end" fill="var(--ink2)" class="sm">3단계</text><rect x="50" y="258" width="350" height="52" rx="8" fill="var(--grid)" fill-opacity="0.35" stroke="none" stroke-width="1.3"/><text x="44" y="289" text-anchor="end" fill="var(--ink2)" class="sm">4단계</text><rect x="50" y="322" width="350" height="52" rx="8" fill="var(--grid)" fill-opacity="0.35" stroke="none" stroke-width="1.3"/><text x="44" y="353" text-anchor="end" fill="var(--ink2)" class="sm">5단계</text><path fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" marker-end="url(#ar2)" d="M160 96 L160 132"/><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M285.61 86.99 L174.39 141.01"/><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M308.11 93.79 L331.89 134.21"/><path fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" marker-end="url(#ar2)" d="M149.41 160 L110.59 204"/><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M170.59 160 L209.41 204"/><path fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" marker-end="url(#ar2)" d="M110.59 228 L149.41 272"/><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M209.41 228 L170.59 272"/><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M333.43 162.59 L256.57 333.41"/><path fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" marker-end="url(#ar2)" d="M173.04 293.27 L236.96 338.73"/><circle cx="160" cy="80" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="160" y="84" text-anchor="middle" fill="var(--ink)" class="sm">A</text><circle cx="300" cy="80" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="300" y="84" text-anchor="middle" fill="var(--ink)" class="sm">B</text><circle cx="160" cy="148" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="160" y="152" text-anchor="middle" fill="var(--ink)" class="sm">C</text><circle cx="340" cy="148" r="16" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text x="340" y="152" text-anchor="middle" fill="var(--ink)" class="sm">G</text><circle cx="100" cy="216" r="16" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text x="100" y="220" text-anchor="middle" fill="var(--ink)" class="sm">D</text><circle cx="220" cy="216" r="16" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.6"/><text x="220" y="220" text-anchor="middle" fill="var(--ink)" class="sm">E</text><circle cx="160" cy="284" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="160" y="288" text-anchor="middle" fill="var(--ink)" class="sm">F</text><circle cx="250" cy="348" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="250" y="352" text-anchor="middle" fill="var(--ink)" class="sm">H</text><text x="430" y="80" text-anchor="start" fill="var(--s2)" class="sm bold">사슬 A → C → D → F → H</text><text x="430" y="100" text-anchor="start" fill="var(--ink2)" class="sm">다섯이 서로 견줄 수 있으므로 어떤 두 개도</text><text x="430" y="118" text-anchor="start" fill="var(--ink2)" class="sm">같은 단계에 둘 수 없다. 그래서 5 단계보다</text><text x="430" y="136" text-anchor="start" fill="var(--ink2)" class="sm">빨리 끝낼 수 없다.</text><text x="430" y="178" text-anchor="start" fill="var(--s3)" class="sm bold">반사슬 {D, E, G}</text><text x="430" y="198" text-anchor="start" fill="var(--ink2)" class="sm">셋 사이에는 어떤 방향으로도 길이 없다.</text><text x="430" y="216" text-anchor="start" fill="var(--ink2)" class="sm">그래서 셋을 동시에 해도 된다.</text><text x="430" y="258" text-anchor="start" fill="var(--ink2)" class="sm">깊이별 묶음 다섯 개가 각각 반사슬이고,</text><text x="430" y="276" text-anchor="start" fill="var(--ink2)" class="sm">그 다섯으로 정점 여덟이 모두 덮인다.</text><text x="430" y="300" text-anchor="start" fill="var(--s1)" class="sm">딜워스: 사슬의 크기가 t 이하이면</text><text x="430" y="318" text-anchor="start" fill="var(--s1)" class="sm">반사슬의 크기가 8/t 이상이다.</text><text x="430" y="336" text-anchor="start" fill="var(--s1)" class="sm">t = 4 로 두면 2 이상이 된다.</text><text class="ink2 sm" x="225" y="396" text-anchor="middle">띠 하나가 한 단계다. 굵은 길이 임계 경로이고 초록 정점이 최대 반사슬이다</text>
</svg>