<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">기댓값이 같고 분산이 다른 두 도박</title><desc id="d">같은 수직선 위에 두 도박의 결과를 놓아 기댓값은 같지만 흩어짐이 백만 배 다른 것을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">기댓값이 같은 두 도박 — 평균은 둘 다 1달러다</text><path d="M120 96 L580 96" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M171.11 92 L171.11 100" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="171.11" y="115" text-anchor="middle">-2000</text><path d="M298.89 92 L298.89 100" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="298.89" y="115" text-anchor="middle">-1000</text><path d="M426.67 92 L426.67 100" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="426.67" y="115" text-anchor="middle">0</text><path d="M554.44 92 L554.44 100" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="554.44" y="115" text-anchor="middle">1000</text><text class="ink bold sm" x="20" y="101" text-anchor="start">게임 가</text><circle cx="426.92" cy="96" r="5" fill="var(--s1)"/><circle cx="426.54" cy="96" r="5" fill="var(--s1)"/><circle cx="426.79" cy="96" r="6" fill="none" stroke="var(--s2)" stroke-width="2"/><text class="ink bold sm" x="438.79" y="80" text-anchor="start">평균 1</text><text class="ink2 sm" x="410.79" y="76" text-anchor="end">두 결과 +2 와 −1 이 이 점에 붙어 있다</text><path d="M120 186 L580 186" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M171.11 182 L171.11 190" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="171.11" y="205" text-anchor="middle">-2000</text><path d="M298.89 182 L298.89 190" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="298.89" y="205" text-anchor="middle">-1000</text><path d="M426.67 182 L426.67 190" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="426.67" y="205" text-anchor="middle">0</text><path d="M554.44 182 L554.44 190" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="554.44" y="205" text-anchor="middle">1000</text><text class="ink bold sm" x="20" y="191" text-anchor="start">게임 나</text><circle cx="554.7" cy="186" r="5" fill="var(--s1)"/><circle cx="170.98" cy="186" r="5" fill="var(--s1)"/><circle cx="426.79" cy="186" r="6" fill="none" stroke="var(--s2)" stroke-width="2"/><text class="ink2 sm" x="554.7" y="166" text-anchor="middle">+1002 (확률 2/3)</text><text class="ink2 sm" x="170.98" y="166" text-anchor="middle">−2001 (확률 1/3)</text><text class="ink bold sm" x="414.79" y="166" text-anchor="end">평균 1</text><path d="M20 232 L640 232" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="252" text-anchor="start">분산 Var 은 게임 가에서 2, 게임 나에서 2004002 이다. 표준편차로 바꾸면 √2 ≈ 1.41 달러와 약 1416 달러다.</text><text class="ink2 sm" x="20" y="272" text-anchor="start">기댓값은 두 게임을 구별하지 못한다. 표준편차는 구별한다 — 그것이 이 장에서 분산을 도입하는 이유다.</text><text class="ink2 sm" x="20" y="292" text-anchor="start">열 판을 하면 둘 다 평균 10달러를 딴다. 그런데 게임 나는 2만 달러를 잃는 일도 일어난다.</text>
</svg>