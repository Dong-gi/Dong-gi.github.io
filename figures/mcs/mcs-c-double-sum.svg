<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 358" width="780" height="358" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이중 합의 순서를 바꾼다</title><desc id="d">1 부터 1/j 까지 늘어놓은 삼각형 표에서 행의 합은 조화수이고 열의 합은 개수 곱하기 항이다. 두 방향의 총합이 같으므로 조화수의 합에 닫힌 형태가 나온다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">삼각형을 행으로 더하는 것과 열로 더하는 것은 같은 값이다</text><text class="ink2 sm" x="139" y="74" text-anchor="middle">j = 1</text><text class="ink2 sm" x="201" y="74" text-anchor="middle">j = 2</text><text class="ink2 sm" x="263" y="74" text-anchor="middle">j = 3</text><text class="ink2 sm" x="325" y="74" text-anchor="middle">j = 4</text><text class="ink2 sm" x="387" y="74" text-anchor="middle">j = 5</text><text class="ink2 sm" x="96" y="106" text-anchor="end">k = 1</text><rect x="108" y="84" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="139" y="106" text-anchor="middle">1</text><text class="ink bold sm" x="432" y="106" text-anchor="start">= H<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink2 sm" x="96" y="140" text-anchor="end">k = 2</text><rect x="108" y="118" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="139" y="140" text-anchor="middle">1</text><rect x="170" y="118" width="62" height="34" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.7"/><text class="ink sm" x="201" y="140" text-anchor="middle">1/2</text><text class="ink bold sm" x="432" y="140" text-anchor="start">= H<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="96" y="174" text-anchor="end">k = 3</text><rect x="108" y="152" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="139" y="174" text-anchor="middle">1</text><rect x="170" y="152" width="62" height="34" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.7"/><text class="ink sm" x="201" y="174" text-anchor="middle">1/2</text><rect x="232" y="152" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="263" y="174" text-anchor="middle">1/3</text><text class="ink bold sm" x="432" y="174" text-anchor="start">= H<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><text class="ink2 sm" x="96" y="208" text-anchor="end">k = 4</text><rect x="108" y="186" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="139" y="208" text-anchor="middle">1</text><rect x="170" y="186" width="62" height="34" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.7"/><text class="ink sm" x="201" y="208" text-anchor="middle">1/2</text><rect x="232" y="186" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="263" y="208" text-anchor="middle">1/3</text><rect x="294" y="186" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="325" y="208" text-anchor="middle">1/4</text><text class="ink bold sm" x="432" y="208" text-anchor="start">= H<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><text class="ink2 sm" x="96" y="242" text-anchor="end">k = 5</text><rect x="108" y="220" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="139" y="242" text-anchor="middle">1</text><rect x="170" y="220" width="62" height="34" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.7"/><text class="ink sm" x="201" y="242" text-anchor="middle">1/2</text><rect x="232" y="220" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="263" y="242" text-anchor="middle">1/3</text><rect x="294" y="220" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="325" y="242" text-anchor="middle">1/4</text><rect x="356" y="220" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="387" y="242" text-anchor="middle">1/5</text><text class="ink bold sm" x="432" y="242" text-anchor="start">= H<tspan baseline-shift="-22%" font-size="76%">5</tspan></text><text class="ink2 sm" x="432" y="74" text-anchor="start">행의 합</text><text class="ink2 sm" x="139" y="274" text-anchor="middle">5·(1/1)</text><text class="ink bold sm" x="201" y="274" text-anchor="middle">4·(1/2)</text><text class="ink2 sm" x="263" y="274" text-anchor="middle">3·(1/3)</text><text class="ink2 sm" x="325" y="274" text-anchor="middle">2·(1/4)</text><text class="ink2 sm" x="387" y="274" text-anchor="middle">1·(1/5)</text><text class="ink2 sm" x="96" y="274" text-anchor="end">열의 합</text><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M510 92 L510 246"/><text class="ink2 sm" x="518" y="124" text-anchor="start">행을 먼저</text><text class="ink2 sm" x="518" y="142" text-anchor="start">더하면</text><text class="ink bold sm" x="518" y="160" text-anchor="start">Σ H<tspan baseline-shift="-22%" font-size="76%">k</tspan></text><path d="M24 298 L756 298" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="24" y="322" text-anchor="start">열의 합은 계산하기 쉽다. j 번째 열에는 k = j 부터 k = n 까지 n − j + 1 개의 1/j 이 있다</text><text class="ink bold sm" x="24" y="344" text-anchor="start">그래서 Σ H<tspan baseline-shift="-22%" font-size="76%">k</tspan> = Σ (n+1)/j − Σ 1 = (n+1) H<tspan baseline-shift="-22%" font-size="76%">n</tspan> − n 이 나온다. 안쪽 합에 닫힌 형태가 없어도 순서만 바꾸면 된다</text>
</svg>