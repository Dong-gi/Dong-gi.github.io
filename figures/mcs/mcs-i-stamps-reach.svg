<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 292" width="780" height="292" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">3 과 5 로 만들 수 있는 금액</title><desc id="d">0 부터 15 까지의 칸에 만들 수 있는 금액을 초록, 만들 수 없는 1 2 4 7 을 주황으로 칠하고, 8 9 10 에서 3 을 더해 오른쪽으로 가는 화살표를 그린 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">8 부터는 빈틈이 없고, 세 칸씩 건너뛰어 무한히 이어진다</text><rect x="40" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="62" y="91" text-anchor="middle">0</text><rect x="84" y="66" width="44" height="40" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink sm" x="106" y="91" text-anchor="middle">1</text><rect x="128" y="66" width="44" height="40" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink sm" x="150" y="91" text-anchor="middle">2</text><rect x="172" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="194" y="91" text-anchor="middle">3</text><rect x="216" y="66" width="44" height="40" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink sm" x="238" y="91" text-anchor="middle">4</text><rect x="260" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="282" y="91" text-anchor="middle">5</text><rect x="304" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="326" y="91" text-anchor="middle">6</text><rect x="348" y="66" width="44" height="40" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink sm" x="370" y="91" text-anchor="middle">7</text><rect x="392" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="414" y="91" text-anchor="middle">8</text><rect x="436" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="458" y="91" text-anchor="middle">9</text><rect x="480" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="502" y="91" text-anchor="middle">10</text><rect x="524" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="546" y="91" text-anchor="middle">11</text><rect x="568" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="590" y="91" text-anchor="middle">12</text><rect x="612" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="634" y="91" text-anchor="middle">13</text><rect x="656" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="678" y="91" text-anchor="middle">14</text><rect x="700" y="66" width="44" height="40" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="722" y="91" text-anchor="middle">15</text><text class="ink2 sm" x="40" y="56" text-anchor="start">금액</text><circle cx="414" cy="86" r="22" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="458" cy="86" r="22" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="502" cy="86" r="22" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="sm bold" fill="var(--s1)" x="436" y="56" text-anchor="middle">확인해 두는 세 칸: 8 = 3+5, 9 = 3+3+3, 10 = 5+5</text><path d="M414 110 C414 150 546 150 546 112" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M458 110 C458 150 590 150 590 112" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M502 110 C502 150 634 150 634 112" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M546 110 C546 150 678 150 678 112" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M590 110 C590 150 722 150 722 112" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar3)"/><text class="sm bold" fill="var(--s3)" x="40" y="144" text-anchor="start">초록 = 3 과 5 로 만들 수 있다</text><text class="sm bold" fill="var(--s2)" x="250" y="144" text-anchor="start">주황 = 만들 수 없다 (1, 2, 4, 7)</text><text class="ink2 sm" x="44" y="176" text-anchor="start">동전 하나를 더 얹는 것이 귀납 단계다. 3 을 얹으면 세 칸 오른쪽으로 간다.</text><text class="ink2 sm" x="44" y="196" text-anchor="start">그래서 8, 9, 10 세 칸을 확보하면 그 오른쪽 전부가 따라온다. 확인할 초기값의 개수는 걸음의 크기가 정한다</text><text class="sm bold" fill="var(--s1)" x="44" y="220" text-anchor="start">한 칸(n → n+1)이 아니라 세 칸을 뛰므로 보통 귀납법이 아니라 강한 귀납법이 필요하다</text>
</svg>