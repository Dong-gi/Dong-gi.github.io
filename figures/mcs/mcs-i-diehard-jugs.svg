<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 362" width="780" height="362" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">물통 두 개 — 도달 가능한 상태와 불가능한 상태</title><desc id="d">위쪽은 3 L 과 5 L 물통으로 큰 통에 4 L 를 만드는 여덟 걸음, 아래쪽은 3 L 과 9 L 일 때 도달 가능한 상태가 3 의 배수 격자뿐이어서 4 L 를 만들 수 없다는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">5 L 물통으로는 되고 9 L 물통으로는 안 된다 — 불변량이 그 차이를 설명한다</text><rect x="20" y="46" width="740" height="128" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="390" y="66" text-anchor="middle">3 L 과 5 L : 여덟 걸음으로 큰 통에 4 L</text><text class="ink2 sm" x="390" y="82" text-anchor="middle">실행 하나를 제시하면 도달 가능성이 증명된다</text><rect x="34" y="104" width="66" height="28" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="67" y="123" text-anchor="middle">(0, 0)</text><text class="ink2 sm" x="67" y="150" text-anchor="middle">시작</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M102 118 L106 118"/><rect x="110" y="104" width="66" height="28" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="143" y="123" text-anchor="middle">(0, 3)</text><text class="ink2 sm" x="143" y="150" text-anchor="middle">작은 통 채움</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M178 118 L182 118"/><rect x="186" y="104" width="66" height="28" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="219" y="123" text-anchor="middle">(3, 0)</text><text class="ink2 sm" x="219" y="150" text-anchor="middle">작은 → 큰</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M254 118 L258 118"/><rect x="262" y="104" width="66" height="28" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="295" y="123" text-anchor="middle">(3, 3)</text><text class="ink2 sm" x="295" y="150" text-anchor="middle">작은 통 채움</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M330 118 L334 118"/><rect x="338" y="104" width="66" height="28" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="371" y="123" text-anchor="middle">(5, 1)</text><text class="ink2 sm" x="371" y="150" text-anchor="middle">작은 → 큰</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M406 118 L410 118"/><rect x="414" y="104" width="66" height="28" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="447" y="123" text-anchor="middle">(0, 1)</text><text class="ink2 sm" x="447" y="150" text-anchor="middle">큰 통 비움</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M482 118 L486 118"/><rect x="490" y="104" width="66" height="28" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="523" y="123" text-anchor="middle">(1, 0)</text><text class="ink2 sm" x="523" y="150" text-anchor="middle">작은 → 큰</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M558 118 L562 118"/><rect x="566" y="104" width="66" height="28" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="599" y="123" text-anchor="middle">(1, 3)</text><text class="ink2 sm" x="599" y="150" text-anchor="middle">작은 통 채움</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M634 118 L638 118"/><rect x="642" y="104" width="66" height="28" rx="4" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="675" y="123" text-anchor="middle">(4, 0)</text><text class="ink2 sm" x="675" y="150" text-anchor="middle">작은 → 큰</text><text class="ink2 sm" x="34" y="82" text-anchor="start">상태는 (큰 통의 물, 작은 통의 물) 이고 단위는 L</text><rect x="20" y="190" width="386" height="148" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="213" y="210" text-anchor="middle">3 L 과 9 L : 두 값이 언제나 3 의 배수다</text><circle cx="106" cy="284" r="5" fill="var(--s3)"/><circle cx="106" cy="242" r="5" fill="var(--s3)"/><circle cx="148" cy="284" r="5" fill="var(--s3)"/><circle cx="148" cy="242" r="5" fill="var(--s3)"/><circle cx="190" cy="284" r="5" fill="var(--s3)"/><circle cx="190" cy="242" r="5" fill="var(--s3)"/><circle cx="232" cy="284" r="5" fill="var(--s3)"/><circle cx="232" cy="242" r="5" fill="var(--s3)"/><text class="ink2 sm" x="106" y="304" text-anchor="middle">0</text><text class="ink2 sm" x="148" y="304" text-anchor="middle">3</text><text class="ink2 sm" x="190" y="304" text-anchor="middle">6</text><text class="ink2 sm" x="232" y="304" text-anchor="middle">9</text><text class="ink2 sm" x="90" y="247" text-anchor="end">3</text><text class="ink2 sm" x="90" y="289" text-anchor="end">0</text><text class="ink2 sm" x="190" y="324" text-anchor="middle">큰 통 (L)</text><text class="ink2 sm" x="64" y="267" text-anchor="middle">작은 통</text><path d="M155 277 L169 291" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M155 291 L169 277" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="sm bold" fill="var(--s2)" x="206" y="262" text-anchor="middle">4 L 자리는 격자에 없다</text><rect x="424" y="190" width="336" height="148" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="592" y="210" text-anchor="middle">불변량: 두 값이 3 의 배수다</text><text class="ink2 sm" x="444" y="240" text-anchor="start">여섯 가지 전이를 모두 확인한다. 3 의 배수를</text><text class="ink2 sm" x="444" y="258" text-anchor="start">채우거나 비우거나 옮겨도 3 의 배수다.</text><text class="ink2 sm" x="444" y="276" text-anchor="start">시작 상태 (0, 0) 에서 참이므로 모든 도달 가능한</text><text class="ink2 sm" x="444" y="294" text-anchor="start">상태에서 참이고, 4 는 3 의 배수가 아니다</text><text class="sm bold" fill="var(--s2)" x="444" y="320" text-anchor="start">주의: 불변량의 부정은 불변량이 아니다</text><text class="ink2 sm" x="20" y="356" text-anchor="start">(1, 0) 은 ‘3 의 배수’ 를 어기지만 거기서 (0, 0) 으로 갈 수 있다. 보존은 참인 쪽에서만 요구된다</text>
</svg>