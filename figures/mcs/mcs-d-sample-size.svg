<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">표본 n 명을 뽑아 지지율을 추정한다 — 오차 0.04 를 벗어날 확률의 상한</text><text class="ink2 sm" x="20" y="42" text-anchor="start">가로축은 표본 크기 n 이다</text><path class="gr" d="M70 250 V74"/><path class="gr" d="M150 250 V74"/><path class="gr" d="M195 250 V74"/><path class="gr" d="M270 250 V74"/><path class="gr" d="M390 250 V74"/><path class="gr" d="M70 250 H390"/><path class="gr" d="M70 232.4 H390"/><path class="gr" d="M70 214.8 H390"/><path class="gr" d="M70 179.6 H390"/><path class="gr" d="M70 144.4 H390"/><path class="gr" d="M70 109.2 H390"/><path class="gr" d="M70 74 H390"/><path class="ax" marker-end="url(#ark)" d="M70 250 H400"/><path class="ax" marker-end="url(#ark)" d="M70 250 V64"/><text class="sm ink2" x="150" y="265" text-anchor="middle">2000</text><text class="sm ink2" x="195" y="265" text-anchor="middle">3125</text><text class="sm ink2" x="270" y="265" text-anchor="middle">5000</text><text class="sm ink2" x="390" y="265" text-anchor="middle">8000</text><text class="sm ink2" x="64" y="236.4" text-anchor="end">0.05</text><text class="sm ink2" x="64" y="218.8" text-anchor="end">0.1</text><text class="sm ink2" x="64" y="183.6" text-anchor="end">0.2</text><text class="sm ink2" x="64" y="148.4" text-anchor="end">0.3</text><text class="sm ink2" x="64" y="113.2" text-anchor="end">0.4</text><text class="sm ink2" x="64" y="78" text-anchor="end">0.5</text><text class="sm ink2" x="404" y="254">n</text><text class="sm ink2" x="70" y="56" text-anchor="middle">상한</text><path class="cv s1" d="M82.8 78.13 L84.34 96.54 L85.87 111.39 L87.41 123.62 L88.94 133.87 L90.48 142.58 L92.02 150.07 L93.55 156.59 L95.09 162.31 L96.62 167.37 L98.16 171.88 L99.7 175.92 L101.23 179.56 L102.77 182.86 L104.3 185.87 L105.84 188.62 L107.38 191.14 L108.91 193.46 L110.45 195.61 L111.98 197.6 L113.52 199.45 L115.06 201.17 L116.59 202.78 L118.13 204.29 L119.66 205.7 L121.2 207.03 L122.74 208.28 L124.27 209.46 L125.81 210.58 L127.34 211.64 L128.88 212.64 L130.42 213.59 L131.95 214.49 L133.49 215.35 L135.02 216.17 L136.56 216.95 L138.1 217.69 L139.63 218.41 L141.17 219.09 L142.7 219.74 L144.24 220.37 L145.78 220.97 L147.31 221.54 L148.85 222.1 L150.38 222.63 L151.92 223.14 L153.46 223.64 L154.99 224.12 L156.53 224.57 L158.06 225.02 L159.6 225.45 L161.14 225.86 L162.67 226.26 L164.21 226.65 L165.74 227.02 L167.28 227.38 L168.82 227.74 L170.35 228.08 L171.89 228.41 L173.42 228.73 L174.96 229.04 L176.5 229.34 L178.03 229.64 L179.57 229.92 L181.1 230.2 L182.64 230.47 L184.18 230.73 L185.71 230.99 L187.25 231.24 L188.78 231.48 L190.32 231.72 L191.86 231.95 L193.39 232.17 L194.93 232.39 L196.46 232.6 L198 232.81 L199.54 233.02 L201.07 233.22 L202.61 233.41 L204.14 233.6 L205.68 233.79 L207.22 233.97 L208.75 234.14 L210.29 234.32 L211.82 234.49 L213.36 234.65 L214.9 234.82 L216.43 234.98 L217.97 235.13 L219.5 235.28 L221.04 235.43 L222.58 235.58 L224.11 235.72 L225.65 235.87 L227.18 236 L228.72 236.14 L230.26 236.27 L231.79 236.4 L233.33 236.53 L234.86 236.66 L236.4 236.78 L237.94 236.9 L239.47 237.02 L241.01 237.14 L242.54 237.25 L244.08 237.36 L245.62 237.47 L247.15 237.58 L248.69 237.69 L250.22 237.79 L251.76 237.9 L253.3 238 L254.83 238.1 L256.37 238.2 L257.9 238.29 L259.44 238.39 L260.98 238.48 L262.51 238.57 L264.05 238.66 L265.58 238.75 L267.12 238.84 L268.66 238.93 L270.19 239.01 L271.73 239.09 L273.26 239.18 L274.8 239.26 L276.34 239.34 L277.87 239.42 L279.41 239.49 L280.94 239.57 L282.48 239.65 L284.02 239.72 L285.55 239.79 L287.09 239.87 L288.62 239.94 L290.16 240.01 L291.7 240.08 L293.23 240.14 L294.77 240.21 L296.3 240.28 L297.84 240.34 L299.38 240.41 L300.91 240.47 L302.45 240.54 L303.98 240.6 L305.52 240.66 L307.06 240.72 L308.59 240.78 L310.13 240.84 L311.66 240.9 L313.2 240.95 L314.74 241.01 L316.27 241.07 L317.81 241.12 L319.34 241.18 L320.88 241.23 L322.42 241.28 L323.95 241.34 L325.49 241.39 L327.02 241.44 L328.56 241.49 L330.1 241.54 L331.63 241.59 L333.17 241.64 L334.7 241.69 L336.24 241.74 L337.78 241.78 L339.31 241.83 L340.85 241.88 L342.38 241.92 L343.92 241.97 L345.46 242.01 L346.99 242.06 L348.53 242.1 L350.06 242.14 L351.6 242.19 L353.14 242.23 L354.67 242.27 L356.21 242.31 L357.74 242.35 L359.28 242.39 L360.82 242.44 L362.35 242.47 L363.89 242.51 L365.42 242.55 L366.96 242.59 L368.5 242.63 L370.03 242.67 L371.57 242.7 L373.1 242.74 L374.64 242.78 L376.18 242.81 L377.71 242.85 L379.25 242.89 L380.78 242.92 L382.32 242.96 L383.86 242.99 L385.39 243.02 L386.93 243.06 L388.46 243.09 L390 243.13"/><path class="cv s2" stroke-dasharray="5 4" d="M70 232.4 L390 232.4"/><path class="gr" stroke-dasharray="4 3" d="M195 250 L195 232.4"/><circle class="f2" cx="195" cy="232.4" r="4.5"/><text class="ink bold sm" x="205" y="224.4" text-anchor="start">n = 3125 에서 1/20</text><text class="ink2 sm" x="386" y="224.4" text-anchor="end">0.05</text><text class="ink bold sm" x="424" y="74" text-anchor="start">상한을 세우는 순서</text><text class="ink2 sm" x="424" y="94" text-anchor="start">① Var[S<tspan baseline-shift="-22%" font-size="76%">n</tspan>] = npq ≤ n/4</text><text class="ink2 sm" x="424" y="112" text-anchor="start">② Var[S<tspan baseline-shift="-22%" font-size="76%">n</tspan>/n] ≤ 1/4n</text><text class="ink2 sm" x="424" y="130" text-anchor="start">③ 체비쇼프를 쓰면</text><text class="ink bold sm" x="436" y="148" text-anchor="start">1/(4n · 0.04²) = 156.25/n</text><text class="ink2 sm" x="424" y="176" text-anchor="start">이 값이 1/20 이하가 되려면</text><text class="ink bold sm" x="436" y="194" text-anchor="start">n ≥ 3125</text><text class="ink2 sm" x="424" y="220" text-anchor="start">유권자가 만 명이든 10억 명이든</text><text class="ink2 sm" x="424" y="236" text-anchor="start">같은 수다 — 모집단 크기가</text><text class="ink bold sm" x="424" y="252" text-anchor="start">식에 들어오지 않는다</text><path d="M20 272 L640 272" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="292" text-anchor="start">곡선이 1/n 로 떨어진다. 오차를 절반으로 줄이려면 x² 이 4분의 1이 되므로 표본은 네 배가 필요하다.</text><text class="ink2 sm" x="20" y="312" text-anchor="start">체르노프 한계를 쓰면 같은 신뢰도에 필요한 n 이 대략 4분의 1로 줄어든다 — 이항분포임을 더 쓰기 때문이다.</text>
</svg>