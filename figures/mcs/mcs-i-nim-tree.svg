<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 344" width="780" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">님 게임의 나무와 필승 전략</title><desc id="d">돌이 1 개와 2 개인 님 게임의 모든 진행을 나무로 그리고 각 판에서 둘 차례인 사람이 이기는지 지는지 표시한 그림, 그리고 게임의 재귀적 정의와 기본 정리</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">자기 차례에 ‘상대가 지는 판’ 이 하나라도 있으면 이긴다 — 없으면 진다</text><rect x="20" y="46" width="500" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="270" y="66" text-anchor="middle">님 ⟨1, 2⟩ 의 게임 나무</text><text class="ink2 sm" x="270" y="82" text-anchor="middle">돌을 마지막에 집는 사람이 이긴다</text><path d="M270 124 L110 162" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 124 L270 162" fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 124 L430 162" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 194 L64 232" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 194 L156 232" fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 194 L270 232" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 194 L430 232" fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="236" y="92" width="68" height="32" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="270" y="109" text-anchor="middle">⟨1, 2⟩</text><text class="sm bold" fill="var(--s1)" x="270" y="122" text-anchor="middle">승</text><rect x="76" y="162" width="68" height="32" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="110" y="179" text-anchor="middle">⟨2⟩</text><text class="sm bold" fill="var(--s1)" x="110" y="192" text-anchor="middle">승</text><rect x="236" y="162" width="68" height="32" rx="5" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="270" y="179" text-anchor="middle">⟨1, 1⟩</text><text class="sm bold" fill="var(--s2)" x="270" y="192" text-anchor="middle">패</text><rect x="396" y="162" width="68" height="32" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="430" y="179" text-anchor="middle">⟨1⟩</text><text class="sm bold" fill="var(--s1)" x="430" y="192" text-anchor="middle">승</text><rect x="30" y="232" width="68" height="32" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="64" y="249" text-anchor="middle">⟨1⟩</text><text class="sm bold" fill="var(--s1)" x="64" y="262" text-anchor="middle">승</text><rect x="122" y="232" width="68" height="32" rx="5" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="156" y="249" text-anchor="middle">⟨ ⟩</text><text class="sm bold" fill="var(--s2)" x="156" y="262" text-anchor="middle">패</text><rect x="236" y="232" width="68" height="32" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="270" y="249" text-anchor="middle">⟨1⟩</text><text class="sm bold" fill="var(--s1)" x="270" y="262" text-anchor="middle">승</text><rect x="396" y="232" width="68" height="32" rx="5" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="430" y="249" text-anchor="middle">⟨ ⟩</text><text class="sm bold" fill="var(--s2)" x="430" y="262" text-anchor="middle">패</text><text class="sm bold" fill="var(--s3)" x="40" y="284" text-anchor="start">굵은 초록 선 = 필승 수 (상대를 패 상태로 보낸다)</text><rect x="538" y="46" width="222" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="649" y="66" text-anchor="middle">게임도 재귀적 자료형이다</text><text class="sm bold" fill="var(--s1)" x="556" y="94" text-anchor="start">정의</text><text class="ink2 sm" x="556" y="114" text-anchor="start">기저: 승, 패 는 게임이다</text><text class="ink2 sm" x="556" y="132" text-anchor="start">구성자: 게임들의 공집합이</text><text class="ink2 sm" x="556" y="150" text-anchor="start">아닌 모임 G 도 게임이다.</text><text class="ink2 sm" x="556" y="168" text-anchor="start">G 의 원소가 첫 수 하나씩이다</text><text class="sm bold" fill="var(--s3)" x="556" y="202" text-anchor="start">기본 정리</text><text class="ink2 sm" x="556" y="222" text-anchor="start">어떤 게임에서도 두 사람 중</text><text class="ink2 sm" x="556" y="240" text-anchor="start">한쪽에게 필승 전략이 있다.</text><text class="ink2 sm" x="556" y="258" text-anchor="start">구조적 귀납법 한 번으로</text><text class="ink2 sm" x="556" y="276" text-anchor="start">증명된다</text><text class="ink2 sm" x="24" y="312" text-anchor="start">라벨의 뜻: ‘승’ 은 그 판에서 둘 차례인 사람이 이긴다는 것이다. 그래서 자식이 모두 ‘승’ 이면 부모는 ‘패’ 이고, 자식 하나라도 ‘패’ 면 부모는 ‘승’ 이다</text>
</svg>