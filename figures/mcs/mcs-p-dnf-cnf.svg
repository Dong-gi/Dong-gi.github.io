<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 392" width="780" height="392" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">진리표에서 DNF 와 CNF 를 직접 읽어내는 법</title><desc id="d">A 그리고 (B 또는 C) 의 여덟 줄 진리표에서, 참인 세 줄이 AND 절이 되고 거짓인 줄이 부호를 뒤집은 OR 절이 되는 것을 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">참인 줄에서 DNF, 거짓인 줄에서 CNF 를 읽는다</text><text class="ink2 sm" x="24" y="48" text-anchor="start">A ∧ (B ∨ C) 의 진리표. 마지막 열이 그 값이다</text><rect x="210" y="56" width="62" height="243" rx="2" fill="var(--s1)" fill-opacity="0.14" stroke="none" stroke-width="1.3"/><text class="ink bold sm" x="55" y="74" text-anchor="middle">A</text><text class="ink bold sm" x="117" y="74" text-anchor="middle">B</text><text class="ink bold sm" x="179" y="74" text-anchor="middle">C</text><text class="ink bold sm" x="241" y="74" text-anchor="middle">값</text><path d="M24 83 L272 83" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s3)" x="55" y="102" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="117" y="102" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="179" y="102" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="241" y="102" text-anchor="middle">T</text><path d="M24 110 L272 110" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s3)" x="55" y="129" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="117" y="129" text-anchor="middle">T</text><text class="sm" fill="var(--s2)" x="179" y="129" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="241" y="129" text-anchor="middle">T</text><path d="M24 137 L272 137" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s3)" x="55" y="156" text-anchor="middle">T</text><text class="sm" fill="var(--s2)" x="117" y="156" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="179" y="156" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="241" y="156" text-anchor="middle">T</text><path d="M24 164 L272 164" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s3)" x="55" y="183" text-anchor="middle">T</text><text class="sm" fill="var(--s2)" x="117" y="183" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="179" y="183" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="241" y="183" text-anchor="middle">F</text><path d="M24 191 L272 191" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s2)" x="55" y="210" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="117" y="210" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="179" y="210" text-anchor="middle">T</text><text class="sm" fill="var(--s2)" x="241" y="210" text-anchor="middle">F</text><path d="M24 218 L272 218" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s2)" x="55" y="237" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="117" y="237" text-anchor="middle">T</text><text class="sm" fill="var(--s2)" x="179" y="237" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="241" y="237" text-anchor="middle">F</text><path d="M24 245 L272 245" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s2)" x="55" y="264" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="117" y="264" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="179" y="264" text-anchor="middle">T</text><text class="sm" fill="var(--s2)" x="241" y="264" text-anchor="middle">F</text><path d="M24 272 L272 272" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s2)" x="55" y="291" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="117" y="291" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="179" y="291" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="241" y="291" text-anchor="middle">F</text><rect x="24" y="56" width="248" height="243" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><path fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)" d="M272 97 L308 97"/><text class="ink sm" x="316" y="101" text-anchor="start">A ∧ B ∧ C</text><path fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)" d="M272 124 L308 124"/><text class="ink sm" x="316" y="128" text-anchor="start">A ∧ B ∧ ¬C</text><path fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)" d="M272 151 L308 151"/><text class="ink sm" x="316" y="155" text-anchor="start">A ∧ ¬B ∧ C</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M272 178 L308 178"/><text class="ink sm" x="316" y="182" text-anchor="start">¬A ∨ B ∨ C</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M272 205 L308 205"/><text class="ink sm" x="316" y="209" text-anchor="start">A ∨ ¬B ∨ ¬C</text><text class="bold sm sm" x="462" y="101" text-anchor="start">참인 줄마다 AND 절 하나</text><text class="ink sm" x="462" y="128" text-anchor="start">DNF = 이 셋을 OR 로 묶은 것</text><text class="bold sm sm" x="462" y="182" text-anchor="start">거짓인 줄마다 OR 절 하나</text><text class="ink sm" x="462" y="209" text-anchor="start">리터럴의 부호를 모두 뒤집는다</text><text class="ink2 sm" x="462" y="236" text-anchor="start">남은 세 줄에서도 같은 방식으로 얻는다</text><text class="ink sm" x="462" y="263" text-anchor="start">CNF = 그 다섯 절을 AND 로 묶은 것</text><path d="M24 324 L756 324" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="24" y="350" text-anchor="start">DNF 는 ‘참이 되는 경우를 다 늘어놓은 것’ 이고 CNF 는 ‘거짓이 되는 경우를 다 막은 것’ 이다</text><text class="ink2 sm" x="24" y="372" text-anchor="start">이 방법이 언제나 통하므로 모든 논리식은 DNF 로도, CNF 로도 쓸 수 있다</text>
</svg>