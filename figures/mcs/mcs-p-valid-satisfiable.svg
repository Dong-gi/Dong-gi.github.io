<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">타당·만족가능·불만족의 세 무리</title><desc id="d">식 전체를 불만족, 만족가능하지만 타당하지 않음, 타당의 세 구역으로 나누고 부정이 양 끝을 뒤바꾸는 것을 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">식은 세 무리로 갈린다</text><rect x="40" y="54" width="700" height="100" rx="6" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><rect x="40" y="54" width="200" height="100" rx="6" fill="var(--s2)" fill-opacity="0.15" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="140" y="84" text-anchor="middle">불만족</text><text class="ink2 sm" x="140" y="108" text-anchor="middle">참이 되는 배정이 하나도 없다</text><text class="ink bold" x="140" y="136" text-anchor="middle">P ∧ ¬P</text><rect x="240" y="54" width="300" height="100" rx="6" fill="var(--ink2)" fill-opacity="0.15" stroke="var(--ink2)" stroke-width="1.6"/><text class="ink bold sm" x="390" y="84" text-anchor="middle">만족가능하지만 타당하지 않다</text><text class="ink2 sm" x="390" y="108" text-anchor="middle">참이 되는 배정도, 거짓이 되는 배정도 있다</text><text class="ink bold" x="390" y="136" text-anchor="middle">P ∨ Q</text><rect x="540" y="54" width="200" height="100" rx="6" fill="var(--s3)" fill-opacity="0.15" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="640" y="84" text-anchor="middle">타당</text><text class="ink2 sm" x="640" y="108" text-anchor="middle">어떤 배정에서도 참</text><text class="ink bold" x="640" y="136" text-anchor="middle">P ∨ ¬P</text><text class="ink2 sm" x="40" y="46" text-anchor="start">변수에 참·거짓을 배정하는 모든 방법을 놓고 본 식의 분류</text><path marker-start="url(#ar1)" d="M140 170 C 140 214 640 214 640 170" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)"/><text class="ink bold sm" x="390" y="230" text-anchor="middle">¬ 를 붙이면 양 끝이 서로 바뀐다</text><path d="M24 254 L756 254" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="24" y="278" text-anchor="start">P 가 타당하다 ⟺ ¬P 가 불만족이다. P 가 만족가능하다 ⟺ ¬P 가 타당하지 않다</text><text class="ink2 sm" x="24" y="300" text-anchor="start">두 식 F, G 가 동치라는 것은 (F ↔ G) 가 타당하다는 것이다. 동치는 타당성의 특수한 경우다</text>
</svg>