<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 296" width="800" height="296" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">수열을 생성함수로 접는다</title><desc id="d">피보나치 수열의 항을 차례로 거듭제곱의 계수 자리에 넣어 함수 하나로 만든다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">수열의 항을 계수 자리에 꽂으면 무한 수열이 함수 하나가 된다</text><rect x="108" y="72" width="52" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="134" y="93" text-anchor="middle">0</text><text class="ink2 sm" x="134" y="66" text-anchor="middle">f<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><rect x="160" y="72" width="52" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="186" y="93" text-anchor="middle">1</text><text class="ink2 sm" x="186" y="66" text-anchor="middle">f<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="212" y="72" width="52" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="238" y="93" text-anchor="middle">1</text><text class="ink2 sm" x="238" y="66" text-anchor="middle">f<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="264" y="72" width="52" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="290" y="93" text-anchor="middle">2</text><text class="ink2 sm" x="290" y="66" text-anchor="middle">f<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="316" y="72" width="52" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="342" y="93" text-anchor="middle">3</text><text class="ink2 sm" x="342" y="66" text-anchor="middle">f<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><rect x="368" y="72" width="52" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="394" y="93" text-anchor="middle">5</text><text class="ink2 sm" x="394" y="66" text-anchor="middle">f<tspan baseline-shift="-22%" font-size="76%">5</tspan></text><rect x="420" y="72" width="52" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="446" y="93" text-anchor="middle">8</text><text class="ink2 sm" x="446" y="66" text-anchor="middle">f<tspan baseline-shift="-22%" font-size="76%">6</tspan></text><rect x="472" y="72" width="52" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="498" y="93" text-anchor="middle">13</text><text class="ink2 sm" x="498" y="66" text-anchor="middle">f<tspan baseline-shift="-22%" font-size="76%">7</tspan></text><rect x="524" y="72" width="52" height="32" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="550" y="93" text-anchor="middle">⋯</text><text class="ink2 sm" x="550" y="66" text-anchor="middle"></text><text class="ink bold sm" x="94" y="94" text-anchor="end">수열</text><path fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar1)" d="M134 110 L134 134"/><path fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar1)" d="M186 110 L186 134"/><path fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar1)" d="M238 110 L238 134"/><path fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar1)" d="M290 110 L290 134"/><path fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar1)" d="M342 110 L342 134"/><path fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar1)" d="M394 110 L394 134"/><path fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar1)" d="M446 110 L446 134"/><path fill="none" stroke="var(--s1)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar1)" d="M498 110 L498 134"/><text class="ink bold sm" x="94" y="166" text-anchor="end">함수</text><text class="ink sm" x="108" y="166" text-anchor="start">F(x) = 0 + 1x + 1x² + 2x³ + 3x⁴ + 5x⁵ + 8x⁶ + 13x⁷ + ⋯</text><text class="ink bold sm" x="108" y="194" text-anchor="start">계수를 꺼내는 표기        [xⁿ] F(x) = f<tspan baseline-shift="-22%" font-size="76%">n</tspan></text><rect x="40" y="216" width="720" height="62" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink sm" x="58" y="242" text-anchor="start">수열에 대한 물음이 함수에 대한 대수 계산으로 바뀐다. 점화식은 방정식이 되고, 닫힌 형태를 얻는 일은 계수를 꺼내는 일이 된다</text><text class="ink2 sm" x="58" y="266" text-anchor="start">x 는 자리를 표시하는 표식일 뿐이어서 값을 대입하지 않는다. 수렴을 따지지 않아도 되는 까닭이 이것이다</text>
</svg>