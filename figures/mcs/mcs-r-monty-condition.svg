<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">조건을 걸면 표본공간이 줄어든다</title><desc id="d">몬티 홀의 결과 12개 가운데 조건에 맞는 셋만 남기고 확률을 다시 정규화하는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">조건을 건다는 것은 표본공간을 줄이고 남은 확률을 다시 1 로 맞추는 일이다</text><text class="ink2 sm" x="40" y="46" text-anchor="start">조건 전 — 결과 12 개</text><rect x="40" y="58" width="150" height="18" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1"/><text class="ink2 sm" x="48" y="71" text-anchor="start">(A,A,B)</text><text class="ink2 sm" x="182" y="71" text-anchor="end">1/18</text><rect x="40" y="78" width="150" height="18" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1"/><text class="ink2 sm" x="48" y="91" text-anchor="start">(A,A,C)</text><text class="ink2 sm" x="182" y="91" text-anchor="end">1/18</text><rect x="40" y="98" width="150" height="18" rx="2" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="48" y="111" text-anchor="start">(A,B,C)</text><text class="ink2 sm" x="182" y="111" text-anchor="end">1/9</text><rect x="40" y="118" width="150" height="18" rx="2" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="48" y="131" text-anchor="start">(A,C,B)</text><text class="ink2 sm" x="182" y="131" text-anchor="end">1/9</text><rect x="40" y="138" width="150" height="18" rx="2" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="48" y="151" text-anchor="start">(B,A,C)</text><text class="ink2 sm" x="182" y="151" text-anchor="end">1/9</text><rect x="40" y="158" width="150" height="18" rx="2" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="48" y="171" text-anchor="start">(B,B,A)</text><text class="ink2 sm" x="182" y="171" text-anchor="end">1/18</text><rect x="40" y="178" width="150" height="18" rx="2" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="48" y="191" text-anchor="start">(B,B,C)</text><text class="ink2 sm" x="182" y="191" text-anchor="end">1/18</text><rect x="40" y="198" width="150" height="18" rx="2" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="48" y="211" text-anchor="start">(B,C,A)</text><text class="ink2 sm" x="182" y="211" text-anchor="end">1/9</text><rect x="40" y="218" width="150" height="18" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1"/><text class="ink2 sm" x="48" y="231" text-anchor="start">(C,A,B)</text><text class="ink2 sm" x="182" y="231" text-anchor="end">1/9</text><rect x="40" y="238" width="150" height="18" rx="2" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="48" y="251" text-anchor="start">(C,B,A)</text><text class="ink2 sm" x="182" y="251" text-anchor="end">1/9</text><rect x="40" y="258" width="150" height="18" rx="2" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="48" y="271" text-anchor="start">(C,C,A)</text><text class="ink2 sm" x="182" y="271" text-anchor="end">1/18</text><rect x="40" y="278" width="150" height="18" rx="2" fill="var(--grid)" fill-opacity="0.1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="48" y="291" text-anchor="start">(C,C,B)</text><text class="ink2 sm" x="182" y="291" text-anchor="end">1/18</text><text class="ink2 sm" x="40" y="316" text-anchor="start">강조한 셋이 조건 [A 를 골랐고 B 에 염소]</text><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M206 150 L258 150"/><text class="ink2 sm" x="232" y="138" text-anchor="middle">조건</text><text class="ink2 sm" x="272" y="46" text-anchor="start">조건 후 — 결과 3 개, 확률을 Pr[Y] 로 나눈다</text><rect x="272" y="58" width="300" height="22" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="280" y="74" text-anchor="start">(A,A,B)</text><text class="ink2 sm" x="348" y="74" text-anchor="start">1/18</text><text class="ink2 sm" x="392" y="74" text-anchor="start">(1/18)/(2/9) = 1/4</text><rect x="272" y="84" width="300" height="22" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="280" y="100" text-anchor="start">(A,A,C)</text><text class="ink2 sm" x="348" y="100" text-anchor="start">1/18</text><text class="ink2 sm" x="392" y="100" text-anchor="start">(1/18)/(2/9) = 1/4</text><rect x="272" y="110" width="300" height="22" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.2"/><text class="ink2 sm" x="280" y="126" text-anchor="start">(C,A,B)</text><text class="ink2 sm" x="348" y="126" text-anchor="start">1/9</text><text class="ink bold sm" x="392" y="126" text-anchor="start">(1/9)/(2/9) = 1/2</text><text class="ink2 sm" x="272" y="154" text-anchor="start">Pr[Y] = 1/18 + 1/18 + 1/9 = 2/9</text><text class="ink bold sm" x="272" y="176" text-anchor="start">바꿔서 이기는 결과는 (C,A,B) 하나 → 1/2</text><rect x="272" y="192" width="300" height="118" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="422" y="211" text-anchor="middle">계산은 옳다. 조건이 틀렸다</text><text class="ink2 sm" x="284" y="234" text-anchor="start">참가자가 아는 것은 ‘카롤이 B 를 열었다’</text><text class="ink2 sm" x="284" y="254" text-anchor="start">인데, 위 조건은 (A,A,C) 까지 품는다</text><text class="ink2 sm" x="284" y="274" text-anchor="start">— 카롤이 C 를 연 결과다</text><text class="ink bold sm" x="284" y="298" text-anchor="start">그 잎을 빼면 (1/9)/(1/6) = 2/3</text><path d="M20 326 L640 326" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="344" text-anchor="start">조건부확률을 틀리는 흔한 방식은 계산이 아니라 조건을 잘못 고르는 것이다 — 아는 것을 다 넣어야 한다</text>
</svg>