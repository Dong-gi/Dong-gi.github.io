<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 312" width="780" height="312" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">문자열의 재귀적 구조와 길이 함수</title><desc id="d">1011 을 중첩된 쌍으로 펼친 모양, 자료형과 길이 함수의 정의 두 줄씩, 그리고 정의만으로 길이 4 를 계산해 나가는 여섯 단계</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">문자열은 ‘한 글자 더하기 남은 문자열’ 이고, 길이도 그 모양대로 정의된다</text><rect x="20" y="46" width="366" height="148" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="203" y="66" text-anchor="middle">1011 을 재귀적 정의대로 펼치면</text><text class="ink bold" x="40" y="98" text-anchor="start">⟨1, ⟨0, ⟨1, ⟨1, λ⟩⟩⟩⟩</text><text class="ink2 sm" x="40" y="128" text-anchor="start">λ 는 빈 문자열(6장)이고, ⟨a, s⟩ 는 글자 a 를</text><text class="ink2 sm" x="40" y="147" text-anchor="start">문자열 s 앞에 붙인 것이다. 프로그래밍 언어의</text><text class="ink2 sm" x="40" y="166" text-anchor="start">연결 리스트가 정확히 이 자료형이다</text><rect x="404" y="46" width="356" height="148" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="582" y="66" text-anchor="middle">정의는 두 줄뿐이다</text><text class="sm bold" fill="var(--s1)" x="424" y="96" text-anchor="start">자료형</text><text class="ink2 sm" x="424" y="116" text-anchor="start">기저: λ ∈ A*</text><text class="ink2 sm" x="424" y="135" text-anchor="start">구성자: a ∈ A 이고 s ∈ A* 이면 ⟨a, s⟩ ∈ A*</text><text class="sm bold" fill="var(--s3)" x="424" y="164" text-anchor="start">함수도 같은 두 줄로 정의한다</text><text class="ink2 sm" x="424" y="184" text-anchor="start">|λ| ::= 0 ,   |⟨a, s⟩| ::= 1 + |s|</text><rect x="20" y="208" width="740" height="86" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="390" y="228" text-anchor="middle">|1011| 을 정의만 써서 계산한다</text><rect x="44" y="248" width="96" height="28" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="92" y="267" text-anchor="middle">|1011|</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M142 262 L156 262"/><rect x="158" y="248" width="96" height="28" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="206" y="267" text-anchor="middle">1 + |011|</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M256 262 L270 262"/><rect x="272" y="248" width="96" height="28" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="320" y="267" text-anchor="middle">2 + |11|</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M370 262 L384 262"/><rect x="386" y="248" width="96" height="28" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="434" y="267" text-anchor="middle">3 + |1|</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M484 262 L498 262"/><rect x="500" y="248" width="96" height="28" rx="4" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="548" y="267" text-anchor="middle">4 + |λ|</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M598 262 L612 262"/><rect x="614" y="248" width="96" height="28" rx="4" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink bold sm" x="662" y="267" text-anchor="middle">4</text><text class="ink2 sm" x="24" y="306" text-anchor="start">한 걸음마다 구성자를 한 번 벗긴다. 그래서 구성자를 벗기는 횟수가 유한하다는 것이 곧 계산이 끝난다는 것이다</text>
</svg>