fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="400" cy="170" r="12" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="430" cy="215" r="12" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="270" y="254" text-anchor="start" fill="var(--ink2)" class="sm">정점 7 · 간선 5 · 요소 2</text><rect x="468" y="40" width="232" height="230" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="584" y="59" text-anchor="middle">신장나무</text><text class="ink2 sm" x="584" y="75" text-anchor="middle">연결 그래프 안에 늘 있다</text><path d="M532 90 L628 90" fill="none" stroke="var(--s3)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 102 L520 158" fill="none" stroke="var(--s3)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 102 L640 158" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M532 170 L628 170" fill="none" stroke="var(--s3)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M527.81 179.11 L572.19 230.89" fill="none" stroke="var(--s3)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M632.19 179.11 L587.81 230.89" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M529.98 96.66 L630.02 163.34" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="520" cy="90" r="12" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="640" cy="90" r="12" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="520" cy="170" r="12" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="640" cy="170" r="12" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="580" cy="240" r="12" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="484" y="254" text-anchor="start" fill="var(--s3)" class="sm">굵은 간선 넷이 정점 다섯을 모두 잇는다</text><text class="ink2 sm" x="360" y="296" text-anchor="middle">나무의 특징들은 서로 같은 말이다 — 경로가 유일하다 · 간선을 지우면 끊긴다 · 간선을 더하면 순환이 생긴다</text><text class="ink2 sm" x="360" y="316" text-anchor="middle">그리고 정점 수가 간선 수보다 정확히 하나 많다. 이 마지막 것이 계산에 가장 자주 쓰인다</text>
