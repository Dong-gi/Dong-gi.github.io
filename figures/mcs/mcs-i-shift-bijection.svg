<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" width="780" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">무한집합에 원소를 하나 더해도 크기가 같다</title><desc id="d">왼쪽은 무한집합에서 b 를 a0 으로 a0 을 a1 로 밀어 전단사를 만드는 그림, 오른쪽은 유한집합에서 마지막 화살표가 갈 곳이 없어 전단사가 없다는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">한 칸씩 밀면 자리가 남는다 — 유한집합에서는 결코 안 되는 일이다</text><rect x="20" y="46" width="386" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="213" y="66" text-anchor="middle">무한집합 A 와 A ∪ {b}</text><text class="ink2 sm" x="213" y="82" text-anchor="middle">전단사가 있다 → 같은 크기</text><text class="sm bold" fill="var(--s2)" x="96" y="88" text-anchor="middle">A ∪ {b}</text><text class="sm bold" fill="var(--s3)" x="300" y="88" text-anchor="middle">A</text><rect x="70" y="92" width="52" height="24" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.3"/><rect x="274" y="92" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><path fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M126 104 L270 104"/><text class="ink bold sm" x="96" y="109" text-anchor="middle">b</text><text class="ink bold sm" x="300" y="109" text-anchor="middle">a₀</text><rect x="70" y="122" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><rect x="274" y="122" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><path fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M126 134 L270 134"/><text class="ink bold sm" x="96" y="139" text-anchor="middle">a₀</text><text class="ink bold sm" x="300" y="139" text-anchor="middle">a₁</text><rect x="70" y="152" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><rect x="274" y="152" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><path fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M126 164 L270 164"/><text class="ink bold sm" x="96" y="169" text-anchor="middle">a₁</text><text class="ink bold sm" x="300" y="169" text-anchor="middle">a₂</text><rect x="70" y="182" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><rect x="274" y="182" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><path fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M126 194 L270 194"/><text class="ink bold sm" x="96" y="199" text-anchor="middle">a₂</text><text class="ink bold sm" x="300" y="199" text-anchor="middle">a₃</text><text class="ink bold sm" x="96" y="229" text-anchor="middle">⋮</text><text class="ink bold sm" x="300" y="229" text-anchor="middle">⋮</text><text class="ink2 sm" x="36" y="254" text-anchor="start">e(b) ::= a₀ ,   e(aₙ) ::= aₙ₊₁ ,   나머지는 그대로</text><rect x="424" y="46" width="336" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="592" y="66" text-anchor="middle">유한집합에서는 안 된다</text><text class="ink2 sm" x="592" y="82" text-anchor="middle">자리가 하나 모자란다</text><rect x="480" y="96" width="52" height="24" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.3"/><text class="ink bold sm" x="506" y="113" text-anchor="middle">b</text><rect x="638" y="96" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="664" y="113" text-anchor="middle">a₀</text><path fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M536 108 L634 108"/><rect x="480" y="126" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="506" y="143" text-anchor="middle">a₀</text><rect x="638" y="126" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="664" y="143" text-anchor="middle">a₁</text><path fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M536 138 L634 138"/><rect x="480" y="156" width="52" height="24" rx="4" fill="var(--grid)" fill-opacity="0.25" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="506" y="173" text-anchor="middle">a₁</text><rect x="638" y="156" width="52" height="24" rx="4" fill="none" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.7" stroke-dasharray="4 3"/><text class="ink2 sm" x="664" y="173" text-anchor="middle">?</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M536 168 L634 168"/><text class="sm bold" fill="var(--s2)" x="440" y="204" text-anchor="start">마지막 화살표가 갈 곳이 없다</text><text class="ink2 sm" x="440" y="230" text-anchor="start">|A ∪ {b}| = |A| + 1 이라 전단사가 없다</text><text class="ink2 sm" x="24" y="274" text-anchor="start">왼쪽 논증에 숨은 전제: A 가 무한이면 서로 다른 원소의 무한 열 a₀, a₁, a₂, … 를 뽑을 수 있다.</text><text class="ink2 sm" x="24" y="294" text-anchor="start">이것은 선택 공리에 기대는 대목이고, 이 장 마지막 절의 이야기다</text>
</svg>