xt class="ink2 sm" x="470" y="196" text-anchor="start">네 자리씩 좁혀진다</text><text class="ink bold sm" x="470" y="224" text-anchor="start">더 아는 것이 있어야</text><text class="ink bold sm" x="470" y="242" text-anchor="start">더 좁게 잡는다</text><text class="ink2 sm" x="470" y="262" text-anchor="start">평균만 → 마르코프</text><text class="ink2 sm" x="470" y="278" text-anchor="start">분산까지 → 체비쇼프</text><text class="ink2 sm" x="470" y="294" text-anchor="start">독립인 합 → 체르노프</text><path d="M20 314 L660 314" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="334" text-anchor="start">마르코프와 체비쇼프는 다항식으로 떨어지고 체르노프는 지수로 떨어진다. 그래서 로그 축에서 앞의 둘은 거의 눕고</text><text class="ink2 sm" x="20" y="352" text-anchor="start">체르노프만 참값과 나란히 내려간다. 그래도 참값과 체르노프 사이에도 여전히 몇 자리의 여유가 남는다.</text>
</svg>