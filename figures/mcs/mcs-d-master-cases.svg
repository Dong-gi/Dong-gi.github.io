<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">마스터 정리의 세 경우</title><desc id="d">재귀 트리에서 층마다의 일을 막대로 그려 잎이 지배하는 경우와 모든 층이 같은 경우와 뿌리가 지배하는 경우를 나란히 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">T(n) = a·T(n/b) + g(n) — 어느 층이 전체를 지배하는가로 세 경우가 갈린다</text><rect x="24" y="46" width="208" height="208" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="128" y="65" text-anchor="middle">1. 잎이 지배</text><text class="ink2 sm" x="128" y="81" text-anchor="middle">g(n) 이 작다</text><rect x="105.5" y="92" width="45" height="18" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1"/><rect x="96.5" y="118" width="63" height="18" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1"/><rect x="83" y="144" width="90" height="18" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1"/><rect x="65" y="170" width="126" height="18" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1"/><rect x="53" y="196" width="150" height="18" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1"/><text class="ink bold sm" x="128" y="226" text-anchor="middle">Θ(n^(log<tspan baseline-shift="-22%" font-size="76%">b</tspan> a))</text><rect x="240" y="46" width="208" height="208" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="344" y="65" text-anchor="middle">2. 모든 층이 같다</text><text class="ink2 sm" x="344" y="81" text-anchor="middle">g(n) = Θ(n^(log<tspan baseline-shift="-22%" font-size="76%">b</tspan> a))</text><rect x="269" y="92" width="150" height="18" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1"/><rect x="269" y="118" width="150" height="18" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1"/><rect x="269" y="144" width="150" height="18" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1"/><rect x="269" y="170" width="150" height="18" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1"/><rect x="269" y="196" width="150" height="18" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1"/><text class="ink bold sm" x="344" y="226" text-anchor="middle">Θ(n^(log<tspan baseline-shift="-22%" font-size="76%">b</tspan> a) · log n)</text><rect x="456" y="46" width="208" height="208" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="560" y="65" text-anchor="middle">3. 뿌리가 지배</text><text class="ink2 sm" x="560" y="81" text-anchor="middle">g(n) 이 크다</text><rect x="485" y="92" width="150" height="18" rx="3" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1"/><rect x="507.5" y="118" width="105" height="18" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1"/><rect x="524" y="144" width="72" height="18" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1"/><rect x="536" y="170" width="48" height="18" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1"/><rect x="545" y="196" width="30" height="18" rx="3" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1"/><text class="ink bold sm" x="560" y="226" text-anchor="middle">Θ(g(n))</text><path d="M20 264 L660 264" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="284" text-anchor="start">막대의 길이가 그 층에서 하는 일의 양이다. 등비수열이므로 첫 항이 크면 첫 항이, 마지막 항이 크면 마지막 항이,</text><text class="ink bold sm" x="20" y="302" text-anchor="start">모두 같으면 층 수만큼이 답이 된다. 이것이 마스터 정리 세 경우의 전부다.</text><text class="ink2 sm" x="20" y="322" text-anchor="start">잎의 개수는 a^(log<tspan baseline-shift="-22%" font-size="76%">b</tspan> n) = n^(log<tspan baseline-shift="-22%" font-size="76%">b</tspan> a) 이므로 2번 경우의 기준선이 그 값이 된다.</text>
</svg>