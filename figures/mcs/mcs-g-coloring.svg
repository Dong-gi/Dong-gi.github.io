<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">그래프 색칠과 채색수</title><desc id="d">삼각형 둘이 있는 시험 시간표 그래프를 3색으로 칠한 것과, 최대 차수 6 이지만 2색으로 칠해지는 별 그래프를 함께 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">색칠 — 인접한 두 정점은 다른 색이어야 한다</text><rect x="20" y="40" width="380" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="210" y="59" text-anchor="middle">시험 시간표: 채색수가 3 이다</text><text class="ink2 sm" x="210" y="75" text-anchor="middle">간선은 함께 듣는 학생이 있다는 뜻</text><path d="M136 118 L284 118" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M132.29 131.38 L187.71 164.62" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M287.71 131.38 L232.29 164.62" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M136 245 L284 245" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M131.6 230.53 L188.4 192.47" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M288.4 230.53 L231.6 192.47" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="210" cy="178" r="26" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="210" y="182" text-anchor="middle" fill="var(--ink)" class="sm">이산수학</text><circle cx="110" cy="118" r="26" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="110" y="122" text-anchor="middle" fill="var(--ink)" class="sm">확률</text><circle cx="310" cy="118" r="26" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><text x="310" y="122" text-anchor="middle" fill="var(--ink)" class="sm">물리</text><circle cx="110" cy="245" r="26" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="110" y="249" text-anchor="middle" fill="var(--ink)" class="sm">알고리즘</text><circle cx="310" cy="245" r="26" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><text x="310" y="249" text-anchor="middle" fill="var(--ink)" class="sm">기하</text><text x="36" y="290" text-anchor="start" fill="var(--s1)" class="sm">삼각형이 둘 있어 2색으로는 안 되고, 3색으로 실제로 칠했다</text><rect x="420" y="40" width="280" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="560" y="59" text-anchor="middle">별 그래프: 최대 차수 6, 채색수 2</text><text class="ink2 sm" x="560" y="75" text-anchor="middle">차수 한계는 아주 느슨할 수 있다</text><path d="M560 167 L560 119" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M572.99 174.5 L614.56 150.5" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M572.99 189.5 L614.56 213.5" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 197 L560 245" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M547.01 189.5 L505.44 213.5" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M547.01 174.5 L505.44 150.5" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="182" r="15" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><circle cx="560" cy="104" r="15" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="627.55" cy="143" r="15" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="627.55" cy="221" r="15" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="560" cy="260" r="15" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="492.45" cy="221" r="15" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="492.45" cy="143" r="15" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="436" y="290" text-anchor="start" fill="var(--s2)" class="sm">차수 한계 정리는 7색을 보장하지만 2색으로 끝난다</text><text class="ink2 sm" x="360" y="328" text-anchor="middle">최대 차수가 Δ 인 그래프는 언제나 Δ+1 색으로 칠할 수 있다. 이 상한이 딱 맞는 것은 완전 그래프이고, 별 그래프에서는 아주 헐렁하다</text><text class="ink2 sm" x="360" y="348" text-anchor="middle">최소 색 수를 실제로 구하는 일은 어렵다 — 3색으로 칠할 수 있는지 판정하는 것만으로도 SAT 만큼 어렵다</text>
</svg>