<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">배팅 두 배 전략과 무한 선형성</title><desc id="d">판마다 절댓값 기댓값이 5 로 일정해 급수가 발산하므로 무한 개 항에 선형성을 쓸 수 없음을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">판돈을 두 배로 올리는 전략 — 각 판의 기댓값은 0 인데 전체 기댓값은 10 이다</text><path class="gr" d="M82.75 222 V62"/><path class="gr" d="M120.25 222 V62"/><path class="gr" d="M157.75 222 V62"/><path class="gr" d="M195.25 222 V62"/><path class="gr" d="M232.75 222 V62"/><path class="gr" d="M270.25 222 V62"/><path class="gr" d="M307.75 222 V62"/><path class="gr" d="M345.25 222 V62"/><path class="gr" d="M64 222 H364"/><path class="gr" d="M64 172 H364"/><path class="gr" d="M64 122 H364"/><path class="gr" d="M64 72 H364"/><path class="ax" marker-end="url(#ark)" d="M64 222 H374"/><path class="ax" marker-end="url(#ark)" d="M64 222 V52"/><text class="sm ink2" x="82.75" y="237" text-anchor="middle">1</text><text class="sm ink2" x="120.25" y="237" text-anchor="middle">2</text><text class="sm ink2" x="157.75" y="237" text-anchor="middle">3</text><text class="sm ink2" x="195.25" y="237" text-anchor="middle">4</text><text class="sm ink2" x="232.75" y="237" text-anchor="middle">5</text><text class="sm ink2" x="270.25" y="237" text-anchor="middle">6</text><text class="sm ink2" x="307.75" y="237" text-anchor="middle">7</text><text class="sm ink2" x="345.25" y="237" text-anchor="middle">8</text><text class="sm ink2" x="58" y="176" text-anchor="end">5</text><text class="sm ink2" x="58" y="126" text-anchor="end">10</text><text class="sm ink2" x="58" y="76" text-anchor="end">15</text><text class="sm ink2" x="378" y="226">n 번째 판</text><path class="cv s2" d="M64 122 L364 122"/><circle class="f2" cx="82.75" cy="122" r="4"/><circle class="f2" cx="120.25" cy="122" r="4"/><circle class="f2" cx="157.75" cy="122" r="4"/><circle class="f2" cx="195.25" cy="122" r="4"/><circle class="f2" cx="232.75" cy="122" r="4"/><circle class="f2" cx="270.25" cy="122" r="4"/><circle class="f2" cx="307.75" cy="122" r="4"/><circle class="f2" cx="345.25" cy="122" r="4"/><text class="ink bold sm" x="217.75" y="110" text-anchor="start">Ex[|B<tspan baseline-shift="-22%" font-size="76%">n</tspan>|] = 10 — 판마다 같다</text><path class="cv s1" stroke-dasharray="5 4" d="M64 222 L364 222"/><text class="ink2 sm" x="285.25" y="212" text-anchor="end">Ex[B<tspan baseline-shift="-22%" font-size="76%">n</tspan>] = 0 — 판마다 공정하다</text><text class="ink2 sm" x="392" y="74" text-anchor="start">판돈 10·2^(n−1) 달러를</text><text class="ink2 sm" x="392" y="94" text-anchor="start">확률 2^(−(n−1)) 로 건다</text><text class="ink bold sm" x="392" y="122" text-anchor="start">곱하면 언제나 10 이다</text><text class="ink2 sm" x="392" y="150" text-anchor="start">Σ Ex[|B<tspan baseline-shift="-22%" font-size="76%">n</tspan>|] = 10 + 10 + ⋯</text><text class="sm bold" x="392" y="170" text-anchor="start">이 발산한다</text><text class="ink2 sm" x="392" y="198" text-anchor="start">무한 선형성의 조건이</text><text class="ink2 sm" x="392" y="216" text-anchor="start">깨진 것이다</text><path d="M20 248 L620 248" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="268" text-anchor="start">선형성을 무한히 많은 항에 쓰려면 Σ Ex[|R<tspan baseline-shift="-22%" font-size="76%">i</tspan>|] 가 수렴해야 한다. 여기서는 그렇지 않으므로 두 값이 다르다.</text><text class="ink2 sm" x="20" y="290" text-anchor="start">현실에서 이 전략이 안 되는 까닭도 같다 — 무한한 자금이 있어야 한다.</text><text class="ink2 sm" x="20" y="310" text-anchor="start">자금이 k 판 분량뿐이면 합이 유한해지고 기댓값은 다시 0(공정한 판) 또는 음수가 된다.</text>
</svg>