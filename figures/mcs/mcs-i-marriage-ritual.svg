<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 376" width="780" height="376" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">구혼 의식 나흘의 진행</title><desc id="d">남자 셋과 여자 셋의 선호 목록, 나흘 동안 각 남자가 누구에게 노래하고 언제 거절당하는지의 표, 그리고 종료 측도와 두 불변량의 요약</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">남자가 세레나데하는 상대는 나빠지기만 하고, 여자의 최선 구혼자는 좋아지기만 한다</text><rect x="20" y="46" width="250" height="176" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="145" y="66" text-anchor="middle">선호 목록 (왼쪽이 1순위)</text><text class="ink bold sm" x="44" y="108" text-anchor="start">갑</text><text class="ink2 sm" x="70" y="108" text-anchor="start">: A B C</text><text class="ink bold sm" x="44" y="132" text-anchor="start">을</text><text class="ink2 sm" x="70" y="132" text-anchor="start">: A C B</text><text class="ink bold sm" x="44" y="156" text-anchor="start">병</text><text class="ink2 sm" x="70" y="156" text-anchor="start">: B A C</text><text class="ink bold sm" x="160" y="108" text-anchor="start">A</text><text class="ink2 sm" x="180" y="108" text-anchor="start">: 을 갑 병</text><text class="ink bold sm" x="160" y="132" text-anchor="start">B</text><text class="ink2 sm" x="180" y="132" text-anchor="start">: 갑 병 을</text><text class="ink bold sm" x="160" y="156" text-anchor="start">C</text><text class="ink2 sm" x="180" y="156" text-anchor="start">: 병 갑 을</text><text class="sm bold" fill="var(--s1)" x="44" y="90" text-anchor="start">남자</text><text class="sm bold" fill="var(--s3)" x="160" y="90" text-anchor="start">여자</text><text class="ink2 sm" x="36" y="188" text-anchor="start">남자 셋이 모두 A 나 B 를 1순위로 두었다.</text><text class="ink2 sm" x="36" y="206" text-anchor="start">C 를 1순위로 둔 남자는 없다</text><rect x="288" y="46" width="472" height="176" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="524" y="66" text-anchor="middle">누구의 발코니 아래에서 노래하는가</text><text class="ink bold sm" x="421" y="100" text-anchor="middle">1일</text><text class="ink bold sm" x="503" y="100" text-anchor="middle">2일</text><text class="ink bold sm" x="585" y="100" text-anchor="middle">3일</text><text class="ink bold sm" x="667" y="100" text-anchor="middle">4일</text><text class="ink bold sm" x="362" y="134" text-anchor="middle">갑</text><rect x="396" y="118" width="50" height="24" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold sm" x="421" y="135" text-anchor="middle">A</text><path d="M402 130 L440 130" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="478" y="118" width="50" height="24" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="503" y="135" text-anchor="middle">B</text><rect x="560" y="118" width="50" height="24" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="585" y="135" text-anchor="middle">B</text><rect x="642" y="118" width="50" height="24" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="667" y="135" text-anchor="middle">B</text><text class="ink bold sm" x="362" y="162" text-anchor="middle">을</text><rect x="396" y="146" width="50" height="24" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="421" y="163" text-anchor="middle">A</text><rect x="478" y="146" width="50" height="24" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="503" y="163" text-anchor="middle">A</text><rect x="560" y="146" width="50" height="24" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="585" y="163" text-anchor="middle">A</text><rect x="642" y="146" width="50" height="24" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="667" y="163" text-anchor="middle">A</text><text class="ink bold sm" x="362" y="190" text-anchor="middle">병</text><rect x="396" y="174" width="50" height="24" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="421" y="191" text-anchor="middle">B</text><rect x="478" y="174" width="50" height="24" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold sm" x="503" y="191" text-anchor="middle">B</text><path d="M484 186 L522 186" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="174" width="50" height="24" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.7"/><text class="ink bold sm" x="585" y="191" text-anchor="middle">A</text><path d="M566 186 L604 186" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="642" y="174" width="50" height="24" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold sm" x="667" y="191" text-anchor="middle">C</text><text class="sm bold" fill="var(--s2)" x="392" y="216" text-anchor="start">줄이 그어진 칸 = 그날 거절당했다</text><text class="sm bold" fill="var(--s1)" x="667" y="216" text-anchor="middle">4일에 끝난다</text><rect x="636" y="112" width="62" height="88" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.9" stroke-dasharray="5 4"/><rect x="20" y="238" width="366" height="122" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="203" y="258" text-anchor="middle">왜 반드시 끝나는가 — 측도</text><text class="ink2 sm" x="40" y="284" text-anchor="start">아직 끝나지 않은 날에는 어떤 여자에게</text><text class="ink2 sm" x="40" y="302" text-anchor="start">구혼자가 둘 이상 있고, 그날 저녁 적어도</text><text class="ink2 sm" x="40" y="320" text-anchor="start">한 명이 목록에서 이름을 지운다.</text><text class="ink2 sm" x="40" y="338" text-anchor="start">남자 n 명의 목록에 든 이름은 처음 n² 개이고</text><text class="ink2 sm" x="40" y="356" text-anchor="start">늘어나는 일이 없다 → n² 일 안에 끝난다</text><rect x="404" y="238" width="356" height="122" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="582" y="258" text-anchor="middle">결과와 두 불변량</text><text class="sm bold" fill="var(--s1)" x="424" y="282" text-anchor="start">결과: 갑 −B, 을 −A, 병 −C</text><text class="ink2 sm" x="424" y="302" text-anchor="start">P: 지워진 여자는 그 남자보다 좋은 구혼자를</text><text class="ink2 sm" x="424" y="320" text-anchor="start">   이미 갖고 있다 → 모두 결혼하고 안정하다</text><text class="ink2 sm" x="424" y="338" text-anchor="start">Q: 지워진 여자는 그 남자에게 가망 없는 상대다</text><text class="ink2 sm" x="424" y="356" text-anchor="start">   → 남자는 가망 있는 최선의 짝을 얻는다</text>
</svg>