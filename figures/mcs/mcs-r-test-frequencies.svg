<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">검사의 양성 결과를 자연 빈도로 세어 보기</title><desc id="d">만 명을 병이 있는 100명과 건강한 9900명으로 나누어 양성자 585명 가운데 진짜 양성이 90명뿐임을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">‘정확도 95%’ 인 검사에서 양성이 나와도 병일 확률은 낮다 — 건강한 사람이 압도적으로 많기 때문이다</text><rect x="34" y="48" width="150" height="44" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold sm" x="109" y="68" text-anchor="middle">10000 명</text><text class="ink2 sm" x="109" y="85" text-anchor="middle">유병률 1%</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M184 70 L230 132"/><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M184 70 L230 226"/><rect x="234" y="112" width="132" height="40" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.3"/><text class="ink bold sm" x="300" y="130" text-anchor="middle">병이 있는 100 명</text><text class="ink2 sm" x="300" y="146" text-anchor="middle">민감도 90%</text><rect x="234" y="206" width="132" height="40" rx="4" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="300" y="224" text-anchor="middle">건강한 9900 명</text><text class="ink2 sm" x="300" y="240" text-anchor="middle">위양성 5%</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M366 132 L420 132"/><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M366 226 L420 226"/><rect x="424" y="112" width="176" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.3"/><text class="ink bold sm" x="512" y="138" text-anchor="middle">진짜 양성 90 명</text><rect x="424" y="206" width="176" height="40" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.3"/><text class="ink bold sm" x="512" y="232" text-anchor="middle">헛 양성 495 명</text><rect x="424" y="166" width="27.08" height="20" rx="2" fill="var(--s2)" fill-opacity="0.8" stroke="var(--s2)" stroke-width="1"/><rect x="451.08" y="166" width="148.92" height="20" rx="2" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1"/><text class="ink bold sm" x="512" y="202" text-anchor="middle">양성 585 명 가운데 90 명 — 약 15%</text><path d="M20 272 L640 272" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="294" text-anchor="start">수식으로는 Pr[병 | 양성] = 0.009 / (0.009 + 0.0495) ≈ 0.154 다. 사람 수로 세어 보면 같은 값이 눈에 보인다.</text><text class="ink bold sm" x="20" y="316" text-anchor="start">‘항상 음성’ 이라고만 답하는 검사도 정확도가 99% 다. 정확도라는 말이 얼마나 허술한지 알 수 있다.</text>
</svg>