<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" width="800" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">생성함수의 곱과 합성곱</title><desc id="d">두 급수의 항을 표로 늘어놓으면 차수가 같은 항이 대각선에 모이고, 그 대각선의 합이 곱의 계수가 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">같은 차수의 항이 대각선 위에 모인다</text><text class="ink2 sm" x="182" y="76" text-anchor="middle">b<tspan baseline-shift="-22%" font-size="76%">0</tspan> x⁰</text><text class="ink2 sm" x="278" y="76" text-anchor="middle">b<tspan baseline-shift="-22%" font-size="76%">1</tspan> x¹</text><text class="ink2 sm" x="374" y="76" text-anchor="middle">b<tspan baseline-shift="-22%" font-size="76%">2</tspan> x²</text><text class="ink2 sm" x="470" y="76" text-anchor="middle">b<tspan baseline-shift="-22%" font-size="76%">3</tspan> x³</text><text class="ink2 sm" x="122" y="114" text-anchor="end">a<tspan baseline-shift="-22%" font-size="76%">0</tspan> x⁰</text><rect x="134" y="88" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="182" y="113" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">0</tspan>b<tspan baseline-shift="-22%" font-size="76%">0</tspan> x⁰</text><rect x="230" y="88" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="278" y="113" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">0</tspan>b<tspan baseline-shift="-22%" font-size="76%">1</tspan> x¹</text><rect x="326" y="88" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="374" y="113" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">0</tspan>b<tspan baseline-shift="-22%" font-size="76%">2</tspan> x²</text><rect x="422" y="88" width="96" height="40" rx="2" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold sm" x="470" y="113" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">0</tspan>b<tspan baseline-shift="-22%" font-size="76%">3</tspan> x³</text><text class="ink2 sm" x="122" y="154" text-anchor="end">a<tspan baseline-shift="-22%" font-size="76%">1</tspan> x¹</text><rect x="134" y="128" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="182" y="153" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">1</tspan>b<tspan baseline-shift="-22%" font-size="76%">0</tspan> x¹</text><rect x="230" y="128" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="278" y="153" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">1</tspan>b<tspan baseline-shift="-22%" font-size="76%">1</tspan> x²</text><rect x="326" y="128" width="96" height="40" rx="2" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold sm" x="374" y="153" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">1</tspan>b<tspan baseline-shift="-22%" font-size="76%">2</tspan> x³</text><rect x="422" y="128" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="470" y="153" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">1</tspan>b<tspan baseline-shift="-22%" font-size="76%">3</tspan> x⁴</text><text class="ink2 sm" x="122" y="194" text-anchor="end">a<tspan baseline-shift="-22%" font-size="76%">2</tspan> x²</text><rect x="134" y="168" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="182" y="193" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">2</tspan>b<tspan baseline-shift="-22%" font-size="76%">0</tspan> x²</text><rect x="230" y="168" width="96" height="40" rx="2" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold sm" x="278" y="193" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">2</tspan>b<tspan baseline-shift="-22%" font-size="76%">1</tspan> x³</text><rect x="326" y="168" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="374" y="193" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">2</tspan>b<tspan baseline-shift="-22%" font-size="76%">2</tspan> x⁴</text><rect x="422" y="168" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="470" y="193" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">2</tspan>b<tspan baseline-shift="-22%" font-size="76%">3</tspan> x⁵</text><text class="ink2 sm" x="122" y="234" text-anchor="end">a<tspan baseline-shift="-22%" font-size="76%">3</tspan> x³</text><rect x="134" y="208" width="96" height="40" rx="2" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold sm" x="182" y="233" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">3</tspan>b<tspan baseline-shift="-22%" font-size="76%">0</tspan> x³</text><rect x="230" y="208" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="278" y="233" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">3</tspan>b<tspan baseline-shift="-22%" font-size="76%">1</tspan> x⁴</text><rect x="326" y="208" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="374" y="233" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">3</tspan>b<tspan baseline-shift="-22%" font-size="76%">2</tspan> x⁵</text><rect x="422" y="208" width="96" height="40" rx="2" fill="var(--s1)" fill-opacity="0.07" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="470" y="233" text-anchor="middle">a<tspan baseline-shift="-22%" font-size="76%">3</tspan>b<tspan baseline-shift="-22%" font-size="76%">3</tspan> x⁶</text><text class="ink bold sm" x="532" y="104" text-anchor="start">x³ 의 항이</text><text class="ink bold sm" x="532" y="124" text-anchor="start">이 대각선에</text><text class="ink bold sm" x="532" y="144" text-anchor="start">모여 있다</text><path d="M24 268 L776 268" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="24" y="292" text-anchor="start">[x³](A·B) = a<tspan baseline-shift="-22%" font-size="76%">0</tspan> b<tspan baseline-shift="-22%" font-size="76%">3</tspan> + a<tspan baseline-shift="-22%" font-size="76%">1</tspan> b<tspan baseline-shift="-22%" font-size="76%">2</tspan> + a<tspan baseline-shift="-22%" font-size="76%">2</tspan> b<tspan baseline-shift="-22%" font-size="76%">1</tspan> + a<tspan baseline-shift="-22%" font-size="76%">3</tspan> b<tspan baseline-shift="-22%" font-size="76%">0</tspan> — 이것이 합성곱이고, 세는 말로는 ‘사과 k 개와 바나나 3−k 개’를 k 마다 더한 것이다</text><text class="ink2 sm" x="24" y="314" text-anchor="start">그래서 서로 겹치지 않는 두 종류에서 고르는 방법의 생성함수는 두 생성함수의 곱이다(합성곱 규칙)</text>
</svg>