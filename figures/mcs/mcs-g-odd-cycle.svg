<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">홀수 순환과 2색 칠하기의 동등성</title><desc id="d">짝수 순환은 번갈아 칠해지고 홀수 순환은 어긋나며, 거리의 짝홀로 칠했을 때 같은 색 사이의 간선이 홀수 닫힌 보행을 만드는 것을 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">2색으로 칠할 수 있는 것과 홀수 순환이 없는 것은 같은 말이다</text><rect x="20" y="40" width="200" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="120" y="59" text-anchor="middle">짝수 순환 C<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><text class="ink2 sm" x="120" y="75" text-anchor="middle">번갈아 칠하면 맞는다</text><path d="M129.9 102.9 L162.1 135.1" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M162.1 154.9 L129.9 187.1" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M110.1 187.1 L77.9 154.9" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M77.9 135.1 L110.1 102.9" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="93" r="14" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><circle cx="172" cy="145" r="14" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="120" cy="197" r="14" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><circle cx="68" cy="145" r="14" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="120" y="222" text-anchor="middle" fill="var(--ink2)" class="sm">어긋나는 간선이 없다</text><rect x="240" y="40" width="200" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="340" y="59" text-anchor="middle">홀수 순환 C<tspan baseline-shift="-22%" font-size="76%">5</tspan></text><text class="ink2 sm" x="340" y="75" text-anchor="middle">한 바퀴 돌면 어긋난다</text><path d="M351.33 101.23 L378.13 120.7" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M385.13 142.25 L374.89 173.75" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M356.56 187.07 L323.44 187.07" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M305.11 173.75 L294.87 142.25" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M301.87 120.7 L328.67 101.23" fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="93" r="14" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><circle cx="389.45" cy="128.93" r="14" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="370.56" cy="187.07" r="14" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><circle cx="309.44" cy="187.07" r="14" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="290.55" cy="128.93" r="14" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="340" y="222" text-anchor="middle" fill="var(--s2)" class="sm">굵은 간선의 양 끝이 같은 색</text><rect x="460" y="40" width="240" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="580" y="59" text-anchor="middle">거꾸로 가는 논증</text><text class="ink2 sm" x="580" y="75" text-anchor="middle">거리의 짝홀로 칠해 본다</text><path d="M513 100 L547 100" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.99 108.32 L550.01 141.68" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M573 100 L627 100" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M573 150 L627 150" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 113 L640 137" fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="500" cy="100" r="13" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="500" y="104" text-anchor="middle" fill="var(--ink)" class="sm">r</text><circle cx="560" cy="100" r="13" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="560" cy="150" r="13" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><circle cx="640" cy="100" r="13" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><circle cx="640" cy="150" r="13" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="478" y="186" text-anchor="start" fill="var(--s2)" class="sm">같은 색 두 정점 사이에 간선이</text><text x="478" y="204" text-anchor="start" fill="var(--s2)" class="sm">있으면 그 간선과 두 보행이</text><text x="478" y="222" text-anchor="start" fill="var(--s2)" class="sm">홀수 길이 닫힌 보행을 만든다</text><text class="ink2 sm" x="360" y="274" text-anchor="middle">셋이 서로 같은 말이다 — 홀수 길이 순환이 있다 · 2색으로 칠할 수 없다 · 홀수 길이 닫힌 보행이 있다.</text><text class="ink2 sm" x="360" y="294" text-anchor="middle">오른쪽 그림이 ‘2색이 안 되면 홀수 닫힌 보행이 있다’를 보이는 자리이고, 거기서 순환까지 가는 데는 정렬성 원리를 쓴다</text><text class="ink2 sm" x="360" y="320" text-anchor="middle">이 정리 덕분에 13장 베네시망에서 급히 만들어 쓴 2색 칠하기 보조정리가 일반적인 사실의 특별한 경우가 된다</text>
</svg>