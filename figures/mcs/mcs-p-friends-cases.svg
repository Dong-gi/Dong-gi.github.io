<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 356" width="780" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">여섯 명이면 3인 클럽 또는 3인 낯선 무리가 있다</title><desc id="d">한 사람을 고르고 나머지 다섯을 만난 쪽과 아닌 쪽으로 가른 다음, 만난 쪽 셋에서 다시 두 경우로 나누는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">경우를 빠짐없이 나누었는지 확인하는 것이 증명의 일부다</text><rect x="16" y="48" width="244" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="138" y="68" text-anchor="middle">① 한 명 x 를 고른다</text><text class="ink2 sm" x="138" y="84" text-anchor="middle">x 를 만난 쪽 / 안 만난 쪽</text><circle cx="138" cy="140" r="6" fill="var(--ink)"/><text class="ink bold" x="138" y="130" text-anchor="middle">x</text><path d="M138 144 L64 216" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M138 144 L98 238" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M138 144 L132 216" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M138 144 L172 224" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M138 144 L210 242" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="64" cy="216" r="5" fill="var(--s1)"/><circle cx="98" cy="238" r="5" fill="var(--s1)"/><circle cx="132" cy="216" r="5" fill="var(--s1)"/><circle cx="172" cy="224" r="5" fill="var(--ink2)"/><circle cx="210" cy="242" r="5" fill="var(--ink2)"/><text class="ink bold sm" x="98" y="266" text-anchor="middle">만난 쪽 3명</text><text class="ink2 sm" x="192" y="266" text-anchor="middle">아닌 쪽 2명</text><text class="ink2 sm" x="30" y="286" text-anchor="start">한쪽은 반드시 3명 이상이다</text><rect x="268" y="48" width="244" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="390" y="68" text-anchor="middle">② 그 셋 중 두 명이 서로 만났다</text><text class="ink2 sm" x="390" y="84" text-anchor="middle">→ x 를 더해 3인 클럽</text><circle cx="390" cy="144" r="6" fill="var(--ink)"/><text class="ink bold" x="390" y="134" text-anchor="middle">x</text><path d="M390 148 L334 220" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 148 L394 244" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 148 L450 208" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M334 220 L394 244" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="334" cy="220" r="5" fill="var(--s1)"/><circle cx="394" cy="244" r="5" fill="var(--s1)"/><circle cx="450" cy="208" r="5" fill="var(--s1)"/><text class="ink2 sm" x="364" y="272" text-anchor="middle">이 한 변이 있으면</text><text class="ink2 sm" x="282" y="286" text-anchor="start">x 와 이 두 명이 3인 클럽이 된다</text><rect x="520" y="48" width="244" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="642" y="68" text-anchor="middle">③ 그 셋이 서로 아무도 안 만났다</text><text class="ink2 sm" x="642" y="84" text-anchor="middle">→ 그 셋이 곧 3인 낯선 무리</text><circle cx="642" cy="144" r="6" fill="var(--ink)"/><text class="ink bold" x="642" y="134" text-anchor="middle">x</text><path d="M642 148 L586 220" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M642 148 L646 244" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M642 148 L702 208" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M586 220 L646 244" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M646 244 L702 208" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M586 220 L702 208" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="586" cy="220" r="5" fill="var(--s3)"/><circle cx="646" cy="244" r="5" fill="var(--s3)"/><circle cx="702" cy="208" r="5" fill="var(--s3)"/><text class="ink2 sm" x="534" y="286" text-anchor="start">셋은 서로 모르는 사이다</text><text class="ink2 sm" x="16" y="320" text-anchor="start">②와 ③ 말고 다른 경우는 없다. 셋 중 서로 만난 짝이 있거나 없거나 둘 중 하나이기 때문이다.</text><text class="ink2 sm" x="16" y="340" text-anchor="start">안 만난 쪽이 3명 이상인 경우도 같은 방식으로 갈라진다 — 실선과 점선을 맞바꾸면 된다</text>
</svg>