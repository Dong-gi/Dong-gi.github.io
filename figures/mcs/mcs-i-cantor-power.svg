<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 352" width="780" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">칸토어 정리의 대각선 집합</title><desc id="d">원소 네 개인 집합에서 g 가 주는 부분집합들의 소속 여부를 행렬로 적고, 대각선을 뒤집어 얻은 집합이 어느 상과도 다르다는 것을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">‘자기가 자기 상에 들어 있는가’ 를 모두 뒤집으면 어느 상과도 다른 집합이 나온다</text><rect x="20" y="46" width="452" height="270" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="246" y="66" text-anchor="middle">A = {1, 2, 3, 4} 이고 g : A → pow(A) 라 하자</text><text class="ink2 sm" x="246" y="82" text-anchor="middle">칸은 x 가 g(a) 에 들어 있는가 (1 = 예)</text><text class="ink2 sm" x="226" y="104" text-anchor="middle">1</text><text class="ink2 sm" x="270" y="104" text-anchor="middle">2</text><text class="ink2 sm" x="314" y="104" text-anchor="middle">3</text><text class="ink2 sm" x="358" y="104" text-anchor="middle">4</text><rect x="211" y="111" width="30" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="255" y="141" width="30" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="299" y="171" width="30" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="343" y="201" width="30" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="186" y="131" text-anchor="end">g(1) = {2, 3}</text><text class="ink bold sm" x="226" y="131" text-anchor="middle">0</text><text class="ink bold sm" x="270" y="131" text-anchor="middle">1</text><text class="ink bold sm" x="314" y="131" text-anchor="middle">1</text><text class="ink bold sm" x="358" y="131" text-anchor="middle">0</text><text class="ink bold sm" x="186" y="161" text-anchor="end">g(2) = {2}</text><text class="ink bold sm" x="226" y="161" text-anchor="middle">0</text><text class="ink bold sm" x="270" y="161" text-anchor="middle">1</text><text class="ink bold sm" x="314" y="161" text-anchor="middle">0</text><text class="ink bold sm" x="358" y="161" text-anchor="middle">0</text><text class="ink bold sm" x="186" y="191" text-anchor="end">g(3) = ∅</text><text class="ink bold sm" x="226" y="191" text-anchor="middle">0</text><text class="ink bold sm" x="270" y="191" text-anchor="middle">0</text><text class="ink bold sm" x="314" y="191" text-anchor="middle">0</text><text class="ink bold sm" x="358" y="191" text-anchor="middle">0</text><text class="ink bold sm" x="186" y="221" text-anchor="end">g(4) = {1, 4}</text><text class="ink bold sm" x="226" y="221" text-anchor="middle">1</text><text class="ink bold sm" x="270" y="221" text-anchor="middle">0</text><text class="ink bold sm" x="314" y="221" text-anchor="middle">0</text><text class="ink bold sm" x="358" y="221" text-anchor="middle">1</text><path d="M40 248 L378 248" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="sm bold" fill="var(--s2)" x="186" y="272" text-anchor="end">대각선 a ∈ g(a)</text><text class="sm bold" fill="var(--s3)" x="186" y="300" text-anchor="end">뒤집으면 a ∈ A_g</text><text class="sm bold" fill="var(--s2)" x="226" y="272" text-anchor="middle">0</text><text class="sm bold" fill="var(--s3)" x="226" y="300" text-anchor="middle">1</text><text class="sm bold" fill="var(--s2)" x="270" y="272" text-anchor="middle">1</text><text class="sm bold" fill="var(--s3)" x="270" y="300" text-anchor="middle">0</text><text class="sm bold" fill="var(--s2)" x="314" y="272" text-anchor="middle">0</text><text class="sm bold" fill="var(--s3)" x="314" y="300" text-anchor="middle">1</text><text class="sm bold" fill="var(--s2)" x="358" y="272" text-anchor="middle">1</text><text class="sm bold" fill="var(--s3)" x="358" y="300" text-anchor="middle">0</text><text class="sm bold" fill="var(--s3)" x="410" y="300" text-anchor="start">= {1, 3}</text><rect x="490" y="46" width="270" height="270" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="625" y="66" text-anchor="middle">정의와 결론</text><text class="sm bold" fill="var(--s1)" x="508" y="92" text-anchor="start">정의</text><text class="ink bold sm" x="508" y="112" text-anchor="start">A_g ::= { a ∈ A : a ∉ g(a) }</text><text class="sm bold" fill="var(--s1)" x="508" y="144" text-anchor="start">왜 상에 없는가</text><text class="ink2 sm" x="508" y="164" text-anchor="start">A_g = g(a) 인 a 가 있다고 하자.</text><text class="ink2 sm" x="508" y="183" text-anchor="start">그 a 에서 두 집합을 비교하면</text><text class="ink2 sm" x="508" y="202" text-anchor="start">a ∈ A_g ↔ a ∉ g(a) = A_g 다.</text><text class="ink2 sm" x="508" y="221" text-anchor="start">‘들어 있으면 안 들어 있다’ — 모순</text><text class="sm bold" fill="var(--s2)" x="508" y="256" text-anchor="start">A strict pow(A)</text><text class="ink2 sm" x="508" y="276" text-anchor="start">어떤 A 에 대해서도 성립한다</text><text class="ink2 sm" x="24" y="336" text-anchor="start">이 표와 앞의 비트열 표는 같은 표다. 부분집합 하나가 비트열 하나이므로(6장) pow(ℕ) 이 무한 비트열 전체와 전단사다</text>
</svg>