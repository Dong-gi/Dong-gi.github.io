<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">병합정렬의 재귀 트리</title><desc id="d">층마다 조각의 개수가 두 배가 되고 크기가 절반이 되어 층마다의 일이 n 으로 유지되는 것을 보이는 재귀 트리</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">병합정렬의 재귀 트리 — 층마다 하는 일이 거의 같고 층 수가 log n 이다</text><rect x="73" y="62" width="454" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><text class="ink sm" x="300" y="78" text-anchor="middle">n</text><text class="ink2 sm" x="546" y="78" text-anchor="start">1개 × n 크기</text><text class="ink2 sm" x="54" y="78" text-anchor="end">층 0</text><rect x="73" y="108" width="224" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><text class="ink sm" x="185" y="124" text-anchor="middle">n/2</text><rect x="303" y="108" width="224" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><text class="ink sm" x="415" y="124" text-anchor="middle">n/2</text><path d="M300 84 L185 108" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 84 L415 108" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="546" y="124" text-anchor="start">2개 × n/2 크기</text><text class="ink2 sm" x="54" y="124" text-anchor="end">층 1</text><rect x="73" y="154" width="109" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><text class="ink sm" x="127.5" y="170" text-anchor="middle">n/4</text><rect x="188" y="154" width="109" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><text class="ink sm" x="242.5" y="170" text-anchor="middle">n/4</text><rect x="303" y="154" width="109" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><text class="ink sm" x="357.5" y="170" text-anchor="middle">n/4</text><rect x="418" y="154" width="109" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><text class="ink sm" x="472.5" y="170" text-anchor="middle">n/4</text><path d="M185 130 L127.5 154" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M185 130 L242.5 154" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M415 130 L357.5 154" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M415 130 L472.5 154" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="546" y="170" text-anchor="start">4개 × n/4 크기</text><text class="ink2 sm" x="54" y="170" text-anchor="end">층 2</text><rect x="73" y="200" width="51.5" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><rect x="130.5" y="200" width="51.5" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><rect x="188" y="200" width="51.5" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><rect x="245.5" y="200" width="51.5" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><rect x="303" y="200" width="51.5" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><rect x="360.5" y="200" width="51.5" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><rect x="418" y="200" width="51.5" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><rect x="475.5" y="200" width="51.5" height="22" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.1"/><path d="M127.5 176 L98.75 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M127.5 176 L156.25 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M242.5 176 L213.75 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M242.5 176 L271.25 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M357.5 176 L328.75 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M357.5 176 L386.25 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M472.5 176 L443.75 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M472.5 176 L501.25 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="546" y="216" text-anchor="start">⋮  (아래로 계속)</text><text class="ink2 sm" x="54" y="216" text-anchor="end">층 3</text><rect x="-6" y="252" width="620" height="46" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text class="ink bold sm" x="300" y="272" text-anchor="middle">층마다 병합에 드는 비교가 최대 n − (그 층의 조각 수) 이므로 층마다 n 보다 조금 작다</text><text class="ink sm" x="300" y="290" text-anchor="middle">층이 log₂ n 개이므로 전체는 n log₂ n 규모다 — 정확히는 n log₂ n − n + 1</text><path d="M20 300 L660 300" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="320" text-anchor="start">재귀 트리는 점화식을 눈으로 푸는 방법이다. 각 층의 일을 더하고 층 수를 곱하면 답의 규모가 나온다.</text><text class="ink2 sm" x="20" y="338" text-anchor="start">아래로 갈수록 조각이 작아지고 개수가 늘어나 곱이 유지되는 것이 이 점화식의 성격이다.</text>
</svg>