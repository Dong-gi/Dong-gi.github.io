<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">베네시망 라우팅의 제약 그래프와 2색 칠하기</title><desc id="d">패킷 8개를 점으로 두고 입력 제약을 점선 출력 제약을 실선으로 그린 뒤, 각 점에 선이 두 종류 하나씩이라 2색으로 칠할 수 있음을 설명한 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="22" text-anchor="middle">제약 그래프 — 같은 부분망에 넣을 수 없는 짝을 선으로 잇는다</text><path d="M247.21 92.77 Q234 172 247.21 251.23" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 4"/><path d="M304.05 114 Q238.69 160.69 192 226.05" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 4"/><path d="M329.23 169.21 Q250 156 170.77 169.21" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 4"/><path d="M308 226.05 Q261.31 160.69 195.95 114" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 4"/><path d="M267 75.69 Q290.06 75.28 306.08 91.88" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/><path d="M329.23 174.79 Q250 188 170.77 174.79" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/><path d="M178.22 223.34 Q166.12 172 178.22 120.66" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/><path d="M306.08 252.12 Q290.06 268.72 267 268.31" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/><circle cx="250" cy="76" r="17" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="250" y="80" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="250" y="53" text-anchor="middle" fill="var(--s1)" class="sm">위</text><circle cx="317.88" cy="104.12" r="17" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="317.88" y="108.12" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="336.97" y="89.03" text-anchor="start" fill="var(--s2)" class="sm">아래</text><circle cx="346" cy="172" r="17" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="346" y="176" text-anchor="middle" fill="var(--ink)" class="sm">2</text><text x="373" y="176" text-anchor="start" fill="var(--s1)" class="sm">위</text><circle cx="317.88" cy="239.88" r="17" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="317.88" y="243.88" text-anchor="middle" fill="var(--ink)" class="sm">3</text><text x="336.97" y="262.97" text-anchor="start" fill="var(--s1)" class="sm">위</text><circle cx="250" cy="268" r="17" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="250" y="272" text-anchor="middle" fill="var(--ink)" class="sm">4</text><text x="250" y="299" text-anchor="middle" fill="var(--s2)" class="sm">아래</text><circle cx="182.12" cy="239.88" r="17" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="182.12" y="243.88" text-anchor="middle" fill="var(--ink)" class="sm">5</text><text x="163.03" y="262.97" text-anchor="end" fill="var(--s1)" class="sm">위</text><circle cx="154" cy="172" r="17" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="154" y="176" text-anchor="middle" fill="var(--ink)" class="sm">6</text><text x="127" y="176" text-anchor="end" fill="var(--s2)" class="sm">아래</text><circle cx="182.12" cy="104.12" r="17" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="182.12" y="108.12" text-anchor="middle" fill="var(--ink)" class="sm">7</text><text x="163.03" y="89.03" text-anchor="end" fill="var(--s2)" class="sm">아래</text><text x="24" y="78" text-anchor="start" fill="var(--ink2)" class="sm">점선: 입력 쪽 제약</text><text x="24" y="96" text-anchor="start" fill="var(--ink)" class="sm">실선: 출력 쪽 제약</text><text x="24" y="122" text-anchor="start" fill="var(--s3)" class="sm">2 와 6 은 두 이유로</text><text x="24" y="140" text-anchor="start" fill="var(--s3)" class="sm">갈라져야 한다 — 겹친 선</text><rect x="430" y="50" width="270" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="565" y="69" text-anchor="middle">왜 반드시 2색으로 칠할 수 있는가</text><text x="446" y="90" text-anchor="start" fill="var(--ink2)" class="sm">점마다 점선이 한 개, 실선이 한 개다.</text><text x="446" y="106" text-anchor="start" fill="var(--ink2)" class="sm">그러니 어느 점에서 출발해 점선·실선을</text><text x="446" y="122" text-anchor="start" fill="var(--ink2)" class="sm">번갈아 따라가면 갈림길이 없다.</text><text x="446" y="138" text-anchor="start" fill="var(--ink2)" class="sm"></text><text x="446" y="154" text-anchor="start" fill="var(--ink2)" class="sm">따라가다 제자리로 돌아오면 그 고리는</text><text x="446" y="170" text-anchor="start" fill="var(--ink2)" class="sm">점선과 실선이 번갈아 나오므로</text><text x="446" y="186" text-anchor="start" fill="var(--ink)" class="sm bold">반드시 짝수 길이다. 짝수 고리는</text><text x="446" y="202" text-anchor="start" fill="var(--ink)" class="sm bold">한 칸씩 번갈아 칠할 수 있다.</text><text x="446" y="218" text-anchor="start" fill="var(--ink2)" class="sm"></text><text x="446" y="234" text-anchor="start" fill="var(--ink2)" class="sm">겹친 선은 두 점을 왕복할 뿐이라</text><text x="446" y="250" text-anchor="start" fill="var(--ink2)" class="sm">길이 2 인 짝수 고리다.</text><text class="ink2 sm" x="360" y="314" text-anchor="middle">위쪽 부분망으로 보낼 패킷과 아래쪽으로 보낼 패킷을 두 색으로 나눈 것이다. 색이 정해지면 첫 열과 마지막 열의 배선이 결정된다</text><text class="ink2 sm" x="360" y="334" text-anchor="middle">남은 것은 절반 크기 문제 둘이고, 그것은 귀납 가정이 해결해 준다</text>
</svg>