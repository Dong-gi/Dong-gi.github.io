<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 348" width="780" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">소인수분해가 존재한다는 것의 증명 구조</title><desc id="d">360 의 분해 나무와, 최소 반례를 두 조각으로 쪼개어 모순을 얻는 여섯 단계</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">최소 반례를 두 조각으로 쪼개면 두 조각은 반례가 아니다</text><path d="M150 81 L96 115" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 81 L212 115" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 145 L58 179" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 145 L124 179" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 145 L176 179" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 145 L252 179" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 209 L96 239" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 209 L152 239" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 209 L222 239" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 209 L282 239" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="150" cy="66" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="150" y="71" text-anchor="middle">360</text><circle cx="96" cy="130" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="96" y="135" text-anchor="middle">8</text><circle cx="212" cy="130" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="212" y="135" text-anchor="middle">45</text><circle cx="58" cy="194" r="17" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="58" y="199" text-anchor="middle">2</text><circle cx="124" cy="194" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="124" y="199" text-anchor="middle">4</text><circle cx="176" cy="194" r="17" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="176" y="199" text-anchor="middle">5</text><circle cx="252" cy="194" r="17" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="252" y="199" text-anchor="middle">9</text><circle cx="96" cy="254" r="17" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="96" y="259" text-anchor="middle">2</text><circle cx="152" cy="254" r="17" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="152" y="259" text-anchor="middle">2</text><circle cx="222" cy="254" r="17" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="222" y="259" text-anchor="middle">3</text><circle cx="282" cy="254" r="17" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.9"/><text class="ink sm" x="282" y="259" text-anchor="middle">3</text><text class="ink2 sm" x="20" y="300" text-anchor="start">360 = 2 · 2 · 2 · 3 · 3 · 5. 초록 동그라미가 더 쪼갤 수 없는 소수다</text><text class="ink2 sm" x="20" y="320" text-anchor="start">나무가 언제나 이렇게 끝난다는 것이 증명해야 할 내용이다</text><rect x="356" y="52" width="404" height="236" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="558" y="72" text-anchor="middle">왜 나무가 반드시 끝나는가</text><rect x="374" y="79" width="340" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="386" y="96" text-anchor="start">소수의 곱으로 못 쓰는 정수가 있다고 하자</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M544 105 L544 111"/><rect x="374" y="112" width="340" height="26" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.7"/><text class="ink sm" x="386" y="129" text-anchor="start">그중 가장 작은 것을 n 이라 한다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M544 138 L544 144"/><rect x="374" y="145" width="340" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="386" y="162" text-anchor="start">n 은 소수가 아니다 — 소수는 길이 1 인 곱이니까</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M544 171 L544 177"/><rect x="374" y="178" width="340" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="386" y="195" text-anchor="start">그러면 1 &lt; a, b &lt; n 인 두 정수의 곱 n = a · b 다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M544 204 L544 210"/><rect x="374" y="211" width="340" height="26" rx="4" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.7"/><text class="ink sm" x="386" y="228" text-anchor="start">a, b 는 n 보다 작으니 각각 소수의 곱으로 쓸 수 있다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M544 237 L544 243"/><rect x="374" y="244" width="340" height="26" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.7"/><text class="ink sm" x="386" y="261" text-anchor="start">두 곱을 이어 붙이면 n 도 소수의 곱이다 — 모순</text><text class="ink2 sm" x="356" y="314" text-anchor="start">초록 줄이 ‘n 보다 작은 곳에서는 참’ 이라는 정보를 쓰는 자리다</text>
</svg>