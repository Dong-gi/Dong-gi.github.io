<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 336" width="840" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">도넛 고르기와 비트열 사이의 전단사</title><desc id="d">맛별로 늘어놓은 도넛 열두 개의 경계 넉 군데에 막대를 세우고, 도넛을 0 막대를 1 로 적으면 1 이 넉 개인 길이 16 비트열이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="420" y="26" text-anchor="middle">맛의 경계에 막대를 세우면 도넛 고르기가 비트열이 된다</text><text class="ink sm" x="24" y="52" text-anchor="start">① 도넛 열두 개를 맛별로 늘어놓는다 — 사이가 넉 군데 벌어진다</text><circle cx="69" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="93" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink2 sm" x="81" y="114" text-anchor="middle">초콜릿</text><text class="ink2 sm" x="148" y="114" text-anchor="middle">레몬</text><circle cx="181" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="205" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="229" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="253" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="277" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="301" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink2 sm" x="241" y="114" text-anchor="middle">설탕</text><circle cx="357" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="381" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink2 sm" x="369" y="114" text-anchor="middle">글레이즈드</text><circle cx="437" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="461" cy="82" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink2 sm" x="449" y="114" text-anchor="middle">플레인</text><path d="M120 62 L120 98" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M152 62 L152 98" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M328 62 L328 98" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M408 62 L408 98" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink sm" x="24" y="134" text-anchor="start">② 벌어진 넉 군데에 막대를 세운다</text><circle cx="69" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="93" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><rect x="114" y="151" width="12" height="26" rx="2" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="1.4"/><rect x="146" y="151" width="12" height="26" rx="2" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="1.4"/><circle cx="181" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="205" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="229" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="253" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="277" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="301" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><rect x="322" y="151" width="12" height="26" rx="2" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="1.4"/><circle cx="357" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="381" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><rect x="402" y="151" width="12" height="26" rx="2" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="1.4"/><circle cx="437" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="461" cy="164" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink sm" x="24" y="222" text-anchor="start">③ 도넛을 0, 막대를 1 로 적으면 길이 16 인 비트열이고 1 이 정확히 넉 개다</text><rect x="60" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="74" y="257" text-anchor="middle">0</text><rect x="88" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="102" y="257" text-anchor="middle">0</text><rect x="116" y="238" width="28" height="28" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink sm" x="130" y="257" text-anchor="middle">1</text><rect x="144" y="238" width="28" height="28" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink sm" x="158" y="257" text-anchor="middle">1</text><rect x="172" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="186" y="257" text-anchor="middle">0</text><rect x="200" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="214" y="257" text-anchor="middle">0</text><rect x="228" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="242" y="257" text-anchor="middle">0</text><rect x="256" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="270" y="257" text-anchor="middle">0</text><rect x="284" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="298" y="257" text-anchor="middle">0</text><rect x="312" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="326" y="257" text-anchor="middle">0</text><rect x="340" y="238" width="28" height="28" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink sm" x="354" y="257" text-anchor="middle">1</text><rect x="368" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="382" y="257" text-anchor="middle">0</text><rect x="396" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="410" y="257" text-anchor="middle">0</text><rect x="424" y="238" width="28" height="28" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink sm" x="438" y="257" text-anchor="middle">1</text><rect x="452" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="466" y="257" text-anchor="middle">0</text><rect x="480" y="238" width="28" height="28" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="494" y="257" text-anchor="middle">0</text><path d="M24 292 L816 292" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="24" y="314" text-anchor="start">거꾸로도 된다. 1 이 넉 개인 길이 16 비트열이 주어지면 0 의 덩어리 길이가 맛별 개수다 — 짝짓기가 양방향이므로 전단사다</text><text class="ink bold sm" x="24" y="332" text-anchor="start">그래서 도넛 n 개를 k 가지 맛에서 고르는 방법의 수는 0 이 n 개, 1 이 k−1 개인 비트열의 수와 같다</text>
</svg>