<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 292" width="800" height="292" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">하노이 탑의 재귀적 해법 세 단계</title><desc id="d">작은 원판을 모두 가운데로 옮기고 가장 큰 원판을 옮긴 뒤 작은 원판을 다시 얹는 세 단계에서 점화식이 나온다</desc>
