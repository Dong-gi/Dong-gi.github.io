eight="12" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.2"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M266 136 L276 136"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M522 136 L532 136"/><path d="M24 238 L776 238" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="24" y="262" text-anchor="start">위가 방법을 주므로 t<tspan baseline-shift="-22%" font-size="76%">n</tspan> ≤ 2 t<tspan baseline-shift="-22%" font-size="76%">n−1</tspan> + 1 이고, 가장 큰 원판을 옮기기 전후에 반드시 이 일이 필요하므로 t<tspan baseline-shift="-22%" font-size="76%">n</tspan> ≥ 2 t<tspan baseline-shift="-22%" font-size="76%">n−1</tspan> + 1 이다</text><text class="ink bold sm" x="24" y="284" text-anchor="start">두 부등식이 만나 t<tspan baseline-shift="-22%" font-size="76%">n</tspan> = 2 t<tspan baseline-shift="-22%" font-size="76%">n−1</tspan> + 1 이 되고, 생성함수로 풀면 t<tspan baseline-shift="-22%" font-size="76%">n</tspan> = 2ⁿ − 1 이다</text>
