<text class="ink bold" x="400" y="26" text-anchor="middle">가장 큰 원판을 옮기려면 나머지가 한 기둥에 모여 있어야 한다</text><rect x="22" y="52" width="244" height="168" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="144" y="72" text-anchor="middle">1단계  작은 것 n−1 개를 옮긴다</text><text class="ink2 sm" x="144" y="88" text-anchor="middle">t<tspan baseline-shift="-22%" font-size="76%">n−1</tspan> 번</text><path d="M42 190 L246 190" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 190 L74 124" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M144 190 L144 124" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M214 190 L214 124" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="47.5" y="176" width="53" height="12" rx="2" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="1.2"/><rect x="123" y="176" width="42" height="12" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.2"/><rect x="128.5" y="162" width="31" height="12" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.2"/><rect x="134" y="148" width="20" height="12" rx="2" fill="var(--s1)" fill-opacity="0.28" stroke="var(--s1)" stroke-width="1.2"/><rect x="278" y="52" width="244" height="168" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="400" y="72" text-anchor="middle">2단계  가장 큰 것을 옮긴다</text><text class="ink2 sm" x="400" y="88" text-anchor="middle">1 번</text><path d="M298 190 L502 190" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 190 L330 124" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 190 L400 12