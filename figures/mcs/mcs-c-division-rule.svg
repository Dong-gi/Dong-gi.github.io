<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">나눗셈 규칙</title><desc id="d">룩 두 개의 배치 하나에 수열이 둘씩 대응하므로 수열의 수를 둘로 나누면 배치의 수가 된다. 오른쪽은 여러 상황에서의 k 값 목록</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">같은 것을 k 번씩 세었다면 k 로 나눈다</text><rect x="22" y="50" width="448" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="246" y="70" text-anchor="middle">ⓐ 룩 두 개 놓기 — 수열은 배치를 두 번씩 센다</text><text class="ink2 sm" x="44" y="90" text-anchor="start">수열 (r<tspan baseline-shift="-22%" font-size="76%">1</tspan>, c<tspan baseline-shift="-22%" font-size="76%">1</tspan>, r<tspan baseline-shift="-22%" font-size="76%">2</tspan>, c<tspan baseline-shift="-22%" font-size="76%">2</tspan>)</text><text class="ink2 sm" x="320" y="90" text-anchor="start">룩 두 개의 배치</text><rect x="44" y="98" width="118" height="24" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="103" y="115" text-anchor="middle">(1, a, 8, h)</text><rect x="44" y="130" width="118" height="24" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="103" y="147" text-anchor="middle">(8, h, 1, a)</text><rect x="320" y="114" width="106" height="28" rx="3" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="373" y="133" text-anchor="middle">배치 하나</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M168 110 L314 122"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M168 142 L314 131"/><rect x="44" y="160" width="118" height="24" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="103" y="177" text-anchor="middle">(3, c, 5, f)</text><rect x="44" y="192" width="118" height="24" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="103" y="209" text-anchor="middle">(5, f, 3, c)</text><rect x="320" y="176" width="106" height="28" rx="3" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="373" y="195" text-anchor="middle">배치 하나</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M168 172 L314 184"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M168 204 L314 193"/><rect x="44" y="222" width="118" height="24" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="103" y="239" text-anchor="middle">(2, b, 7, g)</text><rect x="44" y="254" width="118" height="24" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="103" y="271" text-anchor="middle">(7, g, 2, b)</text><rect x="320" y="238" width="106" height="28" rx="3" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="373" y="257" text-anchor="middle">배치 하나</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M168 234 L314 246"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M168 266 L314 255"/><text class="ink bold sm" x="44" y="296" text-anchor="start">수열이 (8 · 7)² 개이고 사상이 2 대 1 이므로 배치는 그 절반이다</text><rect x="492" y="50" width="286" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="635" y="70" text-anchor="middle">ⓑ k 는 상황마다 다르다</text><text class="ink2 sm" x="635" y="86" text-anchor="middle">|A| = k |B| 이므로 |B| = |A| / k</text><text class="ink sm" x="512" y="110" text-anchor="start">귀 → 사람</text><rect x="682" y="93" width="78" height="24" rx="3" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.3"/><text class="ink bold sm" x="721" y="110" text-anchor="middle">k = 2</text><text class="ink sm" x="512" y="146" text-anchor="start">손가락 → 사람</text><rect x="682" y="129" width="78" height="24" rx="3" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.3"/><text class="ink bold sm" x="721" y="146" text-anchor="middle">k = 10</text><text class="ink sm" x="512" y="182" text-anchor="start">자리 배치 → 원탁 배열</text><rect x="682" y="165" width="78" height="24" rx="3" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.3"/><text class="ink bold sm" x="721" y="182" text-anchor="middle">k = n</text><text class="ink sm" x="512" y="218" text-anchor="start">순열 → 크기 k 부분집합</text><rect x="682" y="201" width="78" height="24" rx="3" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.3"/><text class="ink bold sm" x="721" y="218" text-anchor="middle">k!(n−k)!</text><text class="ink sm" x="512" y="254" text-anchor="start">수열 → 두 쌍 포커 손</text><rect x="682" y="237" width="78" height="24" rx="3" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.3"/><text class="ink bold sm" x="721" y="254" text-anchor="middle">k = 2</text><text class="ink2 sm" x="512" y="296" text-anchor="start">k 를 잘못 세는 것이 가장 흔한 실수다</text>
</svg>