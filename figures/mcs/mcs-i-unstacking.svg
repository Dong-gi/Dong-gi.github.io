<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">상자 쪼개기 게임 — 어떻게 쪼개도 총점이 같다</title><desc id="d">상자 열 개를 5 와 5 로 쪼갠 경우와 1 과 9 로 쪼갠 경우의 점수를 각각 더해 둘 다 45 가 되는 것을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">어떻게 쪼개도 총점이 같다 — 첫 쪼갬의 점수와 두 조각의 점수가 서로 벌충한다</text><rect x="20" y="48" width="236" height="208" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="138" y="68" text-anchor="middle">반씩 쪼갠다</text><text class="ink2 sm" x="138" y="84" text-anchor="middle">첫 쪼갬 점수 5 · 5 = 25</text><rect x="94" y="100" width="88" height="26" rx="4" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="138" y="118" text-anchor="middle">상자 10 개</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M118 130 L76 164"/><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M158 130 L200 164"/><rect x="46" y="168" width="60" height="26" rx="4" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="76" y="186" text-anchor="middle">5 개</text><rect x="170" y="168" width="60" height="26" rx="4" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="200" y="186" text-anchor="middle">5 개</text><text class="ink2 sm" x="76" y="216" text-anchor="middle">5(5 − 1)/2 = 10</text><text class="ink2 sm" x="200" y="216" text-anchor="middle">5(5 − 1)/2 = 10</text><text class="sm bold" fill="var(--s2)" x="138" y="240" text-anchor="middle">합계 25 + 10 + 10 = 45</text><rect x="272" y="48" width="236" height="208" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="390" y="68" text-anchor="middle">한 개만 떼어 낸다</text><text class="ink2 sm" x="390" y="84" text-anchor="middle">첫 쪼갬 점수 1 · 9 = 9</text><rect x="346" y="100" width="88" height="26" rx="4" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="390" y="118" text-anchor="middle">상자 10 개</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M370 130 L328 164"/><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M410 130 L452 164"/><rect x="298" y="168" width="60" height="26" rx="4" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="328" y="186" text-anchor="middle">1 개</text><rect x="422" y="168" width="60" height="26" rx="4" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="452" y="186" text-anchor="middle">9 개</text><text class="ink2 sm" x="328" y="216" text-anchor="middle">1(1 − 1)/2 = 0</text><text class="ink2 sm" x="452" y="216" text-anchor="middle">9(9 − 1)/2 = 36</text><text class="sm bold" fill="var(--s2)" x="390" y="240" text-anchor="middle">합계 9 + 0 + 36 = 45</text><rect x="524" y="48" width="236" height="208" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="642" y="68" text-anchor="middle">어느 쪽이든 45 점</text><text class="ink2 sm" x="642" y="84" text-anchor="middle">n = 10 일 때 n(n−1)/2 = 45</text><text class="ink2 sm" x="540" y="108" text-anchor="start">강한 귀납법이 필요한 까닭:</text><text class="ink2 sm" x="540" y="127" text-anchor="start">10 개를 쪼개면 다음 판은 5 와 5 이거나</text><text class="ink2 sm" x="540" y="146" text-anchor="start">1 과 9 이거나 … 무엇이 될지 모른다.</text><text class="ink2 sm" x="540" y="165" text-anchor="start">한 칸 아래(9)만 가정해서는 안 되고</text><text class="ink2 sm" x="540" y="184" text-anchor="start">1 부터 9 까지 전부 가정해야 한다.</text><text class="sm bold" fill="var(--s1)" x="540" y="220" text-anchor="start">점수를 계산하지 않고 증명한다</text><text class="ink2 sm" x="540" y="240" text-anchor="start">(a+b)² − (a+b) 로 묶이는 것이 요점</text><text class="ink2 sm" x="24" y="288" text-anchor="start">따라야 할 감각: 총점이 전략과 무관하다는 것은 쪼개는 순서를 아무리 바꿔도 같은 항들이 다시 나타난다는 뜻이다.</text><text class="ink2 sm" x="24" y="308" text-anchor="start">실제 증명에서 계산한 것은 ab + a(a−1)/2 + b(b−1)/2 = (a+b)((a+b)−1)/2 한 줄뿐이다</text>
</svg>