/text><path d="M446 222 L688 222" fill="none" stroke="var(--grid)" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="434" y="227" text-anchor="end">−1</text><text class="ink bold sm" x="463" y="252.8" text-anchor="middle">[</text><text class="ink bold sm" x="489" y="252.8" text-anchor="middle">]</text><text class="ink bold sm" x="515" y="252.8" text-anchor="middle">]</text><text class="ink bold sm" x="541" y="252.8" text-anchor="middle">[</text><text class="ink bold sm" x="567" y="252.8" text-anchor="middle">[</text><text class="ink bold sm" x="593" y="252.8" text-anchor="middle">[</text><text class="ink bold sm" x="619" y="252.8" text-anchor="middle">[</text><text class="ink bold sm" x="645" y="252.8" text-anchor="middle">]</text><text class="ink bold sm" x="671" y="252.8" text-anchor="middle">]</text><path d="M450 200 L476 178 L502 200 L528 222 L554 200 L580 178 L606 156 L632 134 L658 156 L684 178" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="450" cy="200" r="3.2" fill="var(--s2)"/><circle cx="476" cy="178" r="3.2" fill="var(--s2)"/><circle cx="502" cy="200" r="3.2" fill="var(--s2)"/><circle cx="528" cy="222" r="3.2" fill="var(--s2)"/><circle cx="554" cy="200" r="3.2" fill="var(--s2)"/><circle cx="580" cy="178" r="3.2" fill="var(--s2)"/><circle cx="606" cy="156" r="3.2" fill="var(--s2)"/><circle cx="632" cy="134" r="3.2" fill="var(--s2)"/><circle cx="658" cy="156" r="3.2" fill="var(--s2)"/><circle cx="684" cy="178" r="3.2" fill="var(--s2)"/><circle cx="528" cy="222" r="9" fill="none" stroke="var(--s2)" stroke-width="2.2"/><text class="sm bold" fill="var(--s2)" x="450" y="100" text-anchor="start">어느 접두사에서 0 아래로 내려간다</text><text class="ink2 sm" x="24" y="288" text-anchor="start">구조적 귀납법으로 증명할 것은 두 가지다 — 왼쪽과 오른쪽 괄호의 개수가 같다(끝에서 0 으로 돌아온다),</text><text class="ink2 sm" x="24" y="308" text-anchor="start">그리고 모든 접두사에서 왼쪽이 오른쪽 이상이다(0 아래로 안 내려간다).</text><text class="ink2 sm" x="24" y="328" text-anchor="start">거꾸로 이 두 조건을 만족하면 반드시 짝이 맞는데, 그쪽은 강한 귀납법이 편하다 — 길이를 쪼개기 때문이다</text>
</svg>