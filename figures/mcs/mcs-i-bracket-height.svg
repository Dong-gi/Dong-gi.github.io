<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">왼쪽 괄호는 한 칸 올리고 오른쪽 괄호는 한 칸 내린다 — 짝이 맞는 것은 0 아래로 안 내려간다</text><rect x="20" y="46" width="366" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="203" y="66" text-anchor="middle">짝이 맞는 문자열</text><path d="M58 200 L334 200" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="50" y="205" text-anchor="end">0</text><path d="M62 178 L330 178" fill="none" stroke="var(--grid)" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="50" y="183" text-anchor="end">1</text><path d="M62 156 L330 156" fill="none" stroke="var(--grid)" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="50" y="161" text-anchor="end">2</text><path d="M62 134 L330 134" fill="none" stroke="var(--grid)" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="50" y="139" text-anchor="end">3</text><path d="M62 222 L330 222" fill="none" stroke="var(--grid)" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="50" y="227" text-anchor="end">−1</text><text class="ink bold sm" x="79" y="252.8" text-anchor="middle">[</text><text class="ink bold sm" x="105" y="252.8" text-anchor="middle">[</text><text class="ink bold sm" x="131" y="252.8" text-anchor="middle">[</text><text class="ink bold sm" x="157" y="252.8" text-anchor="middle">]</text><text class="ink bold sm" x="183" y="252.8" text-anchor="middle">]</text><text class="ink bold sm" x="209" y="252.8" text-anchor="middle">[</text><text class="ink bold sm" x="235" y="252.8" text-anchor="middle">]</text><text class="ink bold sm" x="261" y="252.8" text-anchor="middle">]</text><text class="ink bold sm" x="287" y="252.8" text-anchor=