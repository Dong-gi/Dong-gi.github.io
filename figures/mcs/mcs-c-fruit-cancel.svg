<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 306" width="800" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">네 가지 제약이 붙은 셈 문제가 약분된다</title><desc id="d">사과 바나나 오렌지 배에 각각 붙은 제약의 생성함수를 곱하면 거의 모두 약분되어 1 나누기 1 빼기 x 의 제곱만 남는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">조건이 복잡해도 곱해 놓으면 약분된다</text><rect x="30" y="56" width="176" height="96" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="118" y="80" text-anchor="middle">사과</text><text class="ink2 sm" x="118" y="104" text-anchor="middle">개수가 짝수</text><rect x="44" y="118" width="148" height="26" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="118" y="136" text-anchor="middle">1 / (1 − x²)</text><text class="ink bold" x="212" y="108" text-anchor="middle">×</text><rect x="218" y="56" width="176" height="96" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="306" y="80" text-anchor="middle">바나나</text><text class="ink2 sm" x="306" y="104" text-anchor="middle">개수가 5 의 배수</text><rect x="232" y="118" width="148" height="26" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="306" y="136" text-anchor="middle">1 / (1 − x⁵)</text><text class="ink bold" x="400" y="108" text-anchor="middle">×</text><rect x="406" y="56" width="176" height="96" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="494" y="80" text-anchor="middle">오렌지</text><text class="ink2 sm" x="494" y="104" text-anchor="middle">넷 이하</text><rect x="420" y="118" width="148" height="26" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="494" y="136" text-anchor="middle">(1 − x⁵) / (1 − x)</text><text class="ink bold" x="588" y="108" text-anchor="middle">×</text><rect x="594" y="56" width="176" height="96" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="682" y="80" text-anchor="middle">배</text><text class="ink2 sm" x="682" y="104" text-anchor="middle">하나 이하</text><rect x="608" y="118" width="148" height="26" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.3"/><text class="ink sm" x="682" y="136" text-anchor="middle">1 + x</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M400 158 L400 178"/><text class="ink bold" x="400" y="206" text-anchor="middle">1/(1 − x²) · 1/(1 − x⁵) · (1 − x⁵)/(1 − x) · (1 + x)  =  1/(1 − x)²</text><text class="ink2 sm" x="400" y="232" text-anchor="middle">1 − x² = (1 − x)(1 + x) 이므로 (1 + x) 가 지워지고, (1 − x⁵) 는 서로 지워진다</text><path d="M24 252 L776 252" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="24" y="276" text-anchor="start">[xⁿ] 1/(1 − x)² = n + 1 이므로 과일 n 개를 담는 방법은 n + 1 가지다. n = 6 이면 7 가지이고 손으로 세어 확인할 수 있다</text><text class="ink2 sm" x="24" y="298" text-anchor="start">네 조건을 손으로 따지면 경우가 뒤엉키지만, 곱으로 적어 두면 약분이 그 일을 대신한다</text>
</svg>