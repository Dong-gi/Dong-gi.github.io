<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">책 네 권으로 책 한 권 길이보다 멀리 내밀 수 있다</title><desc id="d">책 네 권을 위에서부터 절반, 사분의 일, 육분의 일, 팔분의 일씩 밀어 쌓으면 맨 위 책이 책상 모서리에서 25/24 책 길이만큼 나간다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">위에서부터 1/2, 1/4, 1/6, 1/8 씩 밀면 넘어지지 않는다</text><rect x="401.67" y="76" width="232" height="28" rx="2" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.4"/><text class="ink2 sm" x="411.67" y="96" text-anchor="start">맨 위 책</text><rect x="517.67" y="82" width="116" height="16" rx="1" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.1"/><text class="ink bold sm" x="641.67" y="96" text-anchor="start">1/2</text><rect x="285.67" y="108" width="232" height="28" rx="2" fill="var(--ink2)" fill-opacity="0.12" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="295.67" y="128" text-anchor="start">2번째 책</text><rect x="459.67" y="114" width="58" height="16" rx="1" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.1"/><text class="ink bold sm" x="525.67" y="128" text-anchor="start">1/4</text><rect x="227.67" y="140" width="232" height="28" rx="2" fill="var(--ink2)" fill-opacity="0.12" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="237.67" y="160" text-anchor="start">3번째 책</text><rect x="421" y="146" width="38.67" height="16" rx="1" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.1"/><text class="ink bold sm" x="467.67" y="160" text-anchor="start">1/6</text><rect x="189" y="172" width="232" height="28" rx="2" fill="var(--ink2)" fill-opacity="0.12" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="199" y="192" text-anchor="start">4번째 책</text><rect x="392" y="178" width="29" height="16" rx="1" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.1"/><text class="ink bold sm" x="429" y="192" text-anchor="start">1/8</text><rect x="52" y="204" width="340" height="22" rx="2" fill="var(--ink2)" fill-opacity="0.22" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="222" y="220" text-anchor="middle">책상</text><path d="M392 62 L392 238" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 sm" x="386" y="244" text-anchor="end">책상 모서리</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M392 56 L633.67 56"/><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M633.67 56 L392 56"/><text class="ink bold sm" x="512.83" y="48" text-anchor="middle">내민 길이 = H<tspan baseline-shift="-22%" font-size="76%">4</tspan> / 2 = 25/24 &gt; 1</text><rect x="24" y="256" width="320" height="86" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="184" y="276" text-anchor="middle">내민 길이는 H<tspan baseline-shift="-22%" font-size="76%">n</tspan> / 2 로 자란다</text><text class="ink sm" x="40" y="300" text-anchor="start">B<tspan baseline-shift="-22%" font-size="76%">n</tspan> = B<tspan baseline-shift="-22%" font-size="76%">n−1</tspan> + 1/(2n)  이므로  B<tspan baseline-shift="-22%" font-size="76%">n</tspan> = H<tspan baseline-shift="-22%" font-size="76%">n</tspan> / 2</text><text class="ink2 sm" x="40" y="322" text-anchor="start">H<tspan baseline-shift="-22%" font-size="76%">n</tspan> ∼ ln n 이므로 책을 늘리면 얼마든지 멀리 나간다</text><rect x="372" y="256" width="384" height="86" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="564" y="276" text-anchor="middle">그러나 매우 느리다</text><text class="ink sm" x="388" y="300" text-anchor="start">책 한 권 길이만큼 내밀려면 4권, 세 권 길이면 227권</text><text class="ink2 sm" x="388" y="322" text-anchor="start">내민 길이가 로그로 자라니 책 수는 지수로 늘어난다</text>
</svg>