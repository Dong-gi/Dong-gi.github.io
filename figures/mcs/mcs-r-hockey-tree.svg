<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 356" width="660" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">3전 2선승 대회의 조건부확률</title><desc id="d">1차전을 이긴다는 조건에서 대회 우승 확률을 나무 그림의 두 열로 계산하는 그림</desc>
<style>
