<text class="ink bold sm" x="20" y="24" text-anchor="start">조건부확률의 네 단계 방법 — 두 사건에 든 결과를 각각 표시하고 확률의 비를 잡는다</text><path d="M60 159 L144 99.5" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M152 99.5 L236 74" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M152 99.5 L236 125" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M244 125 L328 108" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M244 125 L328 142" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 159 L144 218.5" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M152 218.5 L236 193" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M244 193 L328 176" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M244 193 L328 210" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M152 218.5 L236 244" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="102" y="124.25" text-anchor="middle">1/2</text><text class="ink sm" x="148" y="91.5" text-anchor="middle">W</text><text class="ink2 sm" x="194" y="81.75" text-anchor="middle">2/3</text><text class="ink sm" x="247" y="78" text-anchor="start">W</text><text class="ink2 sm" x="194" y="107.25" text-anchor="middle">1/3</text><text class="ink sm" x="240" y="117" text-anchor="middle">L</text><text class="ink2 sm" x="286" y="111.5" text-anchor="middle">1/3</text><text class="ink sm" x="339" y="112" text-anchor="start">W</text><text class="ink2 sm" x="286" y="128.5" text-anchor=