<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">파스칼의 칩 가치 배정</title><desc id="d">두 사람의 칩을 아래에서 위로 r 의 거듭제곱으로 값을 매기면 각 판의 가치 기댓값이 0 이 되는 것을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">파스칼의 발상 — 칩의 가치를 r = q/p 의 거듭제곱으로 매기면 어떤 p 에서도 판이 공정해진다</text><text class="ink bold sm" x="104" y="62" text-anchor="middle">갑의 칩 n 개</text><rect x="56" y="206" width="96" height="22" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="104" y="220" text-anchor="middle">r¹</text><rect x="56" y="180" width="96" height="22" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="104" y="194" text-anchor="middle">r²</text><rect x="56" y="154" width="96" height="22" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="104" y="168" text-anchor="middle">⋮</text><rect x="56" y="128" width="96" height="22" rx="4" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="104" y="142" text-anchor="middle">rⁿ</text><path d="M48 232 L160 232" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="348" y="62" text-anchor="middle">을의 칩 m 개</text><rect x="300" y="206" width="96" height="22" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.2"/><text class="ink sm" x="348" y="220" text-anchor="middle">rⁿ⁺ᵐ</text><rect x="300" y="180" width="96" height="22" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.2"/><text class="ink sm" x="348" y="194" text-anchor="middle">⋮</text><rect x="300" y="154" width="96" height="22" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.2"/><text class="ink sm" x="348" y="168" text-anchor="middle">rⁿ⁺²</text><rect x="300" y="128" width="96" height="22" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.2"/><text class="ink sm" x="348" y="142" text-anchor="middle">rⁿ⁺¹</text><path d="M292 232 L404 232" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="56" y="250" text-anchor="start">아래가 바닥</text><text class="ink2 sm" x="300" y="250" text-anchor="start">아래가 바닥</text><path fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M292 126 L160 126"/><text class="ink2 sm" x="226" y="118" text-anchor="middle">확률 p</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M160 164 L292 164"/><text class="ink2 sm" x="226" y="182" text-anchor="middle">확률 q</text><rect x="408" y="66" width="250" height="96" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text class="ink bold sm" x="420" y="88" text-anchor="start">한 판의 가치 기댓값</text><text class="ink sm" x="420" y="110" text-anchor="start">rⁿ⁺¹·p − rⁿ·q</text><text class="ink sm" x="420" y="130" text-anchor="start">= rⁿ(q/p)·p − rⁿ·q</text><text class="ink bold sm" x="420" y="150" text-anchor="start">= 0</text><text class="ink2 sm" x="420" y="182" text-anchor="start">확률 p 로 이기면 을의 맨 위</text><text class="ink2 sm" x="420" y="198" text-anchor="start">칩을 가져오고, 확률 q 로 지면</text><text class="ink2 sm" x="420" y="214" text-anchor="start">자기 맨 위 칩을 내준다.</text><text class="ink2 sm" x="420" y="234" text-anchor="start">어느 쪽이든 가치의 줄</text><text class="ink bold sm" x="420" y="250" text-anchor="start">r, r², ⋯, rⁿ⁺ᵐ 은 그대로다</text><path d="M20 264 L660 264" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="284" text-anchor="start">모든 판의 가치 기댓값이 0 이므로 게임이 끝났을 때 갑이 가진 가치의 기댓값도 0 이다. 이 한 줄이 승률을 준다.</text><text class="ink2 sm" x="20" y="304" text-anchor="start">r = 1 (공정한 게임)이면 칩의 가치가 모두 1 이 되어 같은 식이 n/T 를 준다.</text>
</svg>