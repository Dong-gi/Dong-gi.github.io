<text class="ink bold sm" x="20" y="24" text-anchor="start">동전 셋을 던져 A<tspan baseline-shift="-22%" font-size="76%">1</tspan> = ‘1·2 가 같다’, A<tspan baseline-shift="-22%" font-size="76%">2</tspan> = ‘2·3 이 같다’, A<tspan baseline-shift="-22%" font-size="76%">3</tspan> = ‘3·1 이 같다’ 로 둔다</text><text class="ink2 sm" x="71" y="50" text-anchor="middle">결과</text><text class="ink2 sm" x="133" y="50" text-anchor="middle">확률</text><text class="ink2 sm" x="195" y="50" text-anchor="middle">A<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink2 sm" x="257" y="50" text-anchor="middle">A<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="319" y="50" text-anchor="middle">A<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="40" y="56" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="71" y="74" text-anchor="middle">HHH</text><rect x="102" y="56" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="133" y="74" text-anchor="middle">1/8</text><rect x="164" y="56" width="62" height="26" rx="1" fill="var(--s2)" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="195" y="74" text-anchor="middle">✓</text><rect x="226" y="56" width="62" height="26" rx="1" fill="var(--s2)" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="257" y="74" text-anchor="middle">✓</text><rect x="288" y="56" width="62" height="26" rx="1" fill="var(--s2)" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="319" y="74" text-anchor="middle">✓</text><rect x="40" y="82" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="71" y="100" text-anchor="middle">HHT</text><rect x="102" y="82" width="62" height="26" rx="1" f