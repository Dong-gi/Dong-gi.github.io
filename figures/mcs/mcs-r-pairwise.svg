<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 354" width="660" height="354" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">쌍마다 독립이지만 상호 독립이 아닌 세 사건</title><desc id="d">동전 세 개의 결과 여덟 개를 늘어놓고 세 사건이 쌍마다는 독립이나 셋을 함께 보면 독립이 아님을 확인하는 표</desc>
