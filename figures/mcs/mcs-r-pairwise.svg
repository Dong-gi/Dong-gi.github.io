152" text-anchor="middle">1/8</text><rect x="164" y="134" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="195" y="152" text-anchor="middle"></text><rect x="226" y="134" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="257" y="152" text-anchor="middle">✓</text><rect x="288" y="134" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="319" y="152" text-anchor="middle"></text><rect x="40" y="160" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="71" y="178" text-anchor="middle">THH</text><rect x="102" y="160" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="133" y="178" text-anchor="middle">1/8</text><rect x="164" y="160" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="195" y="178" text-anchor="middle"></text><rect x="226" y="160" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="257" y="178" text-anchor="middle">✓</text><rect x="288" y="160" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="319" y="178" text-anchor="middle"></text><rect x="40" y="186" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="71" y="204" text-anchor="middle">THT</text><rect x="102" y="186" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="133" y="204" text-anchor="middle">1/8</text><rect x="164" y="186" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="195" y="204" text-anchor="middle"></text><rect x="226" y="186" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="257" y="204" text-anchor="middle"></text><rect x="288" y="186" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="319" y="204" text-anchor="middle">✓</text><rect x="40" y="212" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="71" y="230" text-anchor="middle">TTH</text><rect x="102" y="212" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="133" y="230" text-anchor="middle">1/8</text><rect x="164" y="212" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="195" y="230" text-anchor="middle">✓</text><rect x="226" y="212" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="257" y="230" text-anchor="middle"></text><rect x="288" y="212" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="319" y="230" text-anchor="middle"></text><rect x="40" y="238" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="71" y="256" text-anchor="middle">TTT</text><rect x="102" y="238" width="62" height="26" rx="1" fill="none" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="133" y="256" text-anchor="middle">1/8</text><rect x="164" y="238" width="62" height="26" rx="1" fill="var(--s2)" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="195" y="256" text-anchor="middle">✓</text><rect x="226" y="238" width="62" height="26" rx="1" fill="var(--s2)" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="257" y="256" text-anchor="middle">✓</text><rect x="288" y="238" width="62" height="26" rx="1" fill="var(--s2)" fill-opacity="0.22" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="319" y="256" text-anchor="middle">✓</text><text class="ink2 sm" x="40" y="286" text-anchor="start">세 사건이 동시에 일어나는 결과는 HHH 와 TTT 둘뿐이다</text><rect x="366" y="52" width="274" height="96" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="503" y="71" text-anchor="middle">쌍마다는 독립이다</text><text class="ink2 sm" x="380" y="90" text-anchor="start">Pr[A<tspan baseline-shift="-22%" font-size="76%">1</tspan>] = Pr[A<tspan baseline-shift="-22%" font-size="76%">2</tspan>] = Pr[A<tspan baseline-shift="-22%" font-size="76%">3</tspan>] = 1/2</text><text class="ink2 sm" x="380" y="112" text-anchor="start">Pr[A<tspan baseline-shift="-22%" font-size="76%">1</tspan> ∩ A<tspan baseline-shift="-22%" font-size="76%">2</tspan>] = 1/4 = (1/2)(1/2)</text><text class="ink2 sm" x="380" y="134" text-anchor="start">다른 두 쌍도 마찬가지다</text><rect x="366" y="164" width="274" height="100" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="sm bold" x="503" y="186" text-anchor="middle">그러나 상호 독립은 아니다</text><text class="ink2 sm" x="380" y="210" text-anchor="start">Pr[A<tspan baseline-shift="-22%" font-size="76%">1</tspan> ∩ A<tspan baseline-shift="-22%" font-size="76%">2</tspan> ∩ A<tspan baseline-shift="-22%" font-size="76%">3</tspan>] = 2/8 = 1/4</text><text class="ink2 sm" x="380" y="232" text-anchor="start">곱은 (1/2)³ = 1/8 이다</text><text class="ink bold sm" x="380" y="254" text-anchor="start">1/4 ≠ 1/8 이므로 조건이 깨진다</text><path d="M20 296 L640 296" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="318" text-anchor="start">까닭은 셋 가운데 둘이 정해지면 나머지가 결정된다는 것이다 — 두 쌍이 같으면 세 번째 쌍도 반드시 같다.</text><text class="ink2 sm" x="20" y="340" text-anchor="start">상호 독립을 확인하려면 크기 2 이상인 모든 부분집합을 봐야 한다. 쌍만 보고 넘어가면 이 함정에 빠진다.</text>
</svg>