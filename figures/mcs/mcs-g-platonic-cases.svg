<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">정다면체가 다섯 개뿐인 이유</title><desc id="d">n 과 m 을 3 부터 6 까지 넣은 표에서 1/n + 1/m 이 1/2 를 넘는 칸이 다섯 개뿐임을 보이고 그 다섯의 꼭짓점 간선 면 수를 적은 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">1/n + 1/m 이 1/2 보다 커야 한다 — 그런 (n, m) 은 다섯 칸뿐이다</text><rect x="142" y="84" width="70" height="30" rx="2" fill="var(--s3)" fill-opacity="0.25" stroke="var(--s3)" stroke-width="1.6"/><rect x="212" y="84" width="70" height="30" rx="2" fill="var(--s3)" fill-opacity="0.25" stroke="var(--s3)" stroke-width="1.6"/><rect x="282" y="84" width="70" height="30" rx="2" fill="var(--s3)" fill-opacity="0.25" stroke="var(--s3)" stroke-width="1.6"/><rect x="142" y="114" width="70" height="30" rx="2" fill="var(--s3)" fill-opacity="0.25" stroke="var(--s3)" stroke-width="1.6"/><rect x="142" y="144" width="70" height="30" rx="2" fill="var(--s3)" fill-opacity="0.25" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="83" y="72" text-anchor="middle">면의 변 수 n</text><text class="ink bold sm" x="177" y="72" text-anchor="middle">m = 3</text><text class="ink bold sm" x="247" y="72" text-anchor="middle">m = 4</text><text class="ink bold sm" x="317" y="72" text-anchor="middle">m = 5</text><text class="ink bold sm" x="387" y="72" text-anchor="middle">m = 6</text><path d="M24 84 L422 84" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="83" y="106" text-anchor="middle">3</text><text class="ink sm" x="177" y="106" text-anchor="middle">2/3 ✓</text><text class="ink sm" x="247" y="106" text-anchor="middle">7/12 ✓</text><text class="ink sm" x="317" y="106" text-anchor="middle">8/15 ✓</text><text class="ink sm" x="387" y="106" text-anchor="middle">1/2 ✗</text><path d="M24 114 L422 114" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="83" y="136" text-anchor="middle">4</text><text class="ink sm" x="177" y="136" text-anchor="middle">7/12 ✓</text><text class="ink sm" x="247" y="136" text-anchor="middle">1/2 ✗</text><text class="ink sm" x="317" y="136" text-anchor="middle">9/20 ✗</text><text class="ink sm" x="387" y="136" text-anchor="middle">5/12 ✗</text><path d="M24 144 L422 144" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="83" y="166" text-anchor="middle">5</text><text class="ink sm" x="177" y="166" text-anchor="middle">8/15 ✓</text><text class="ink sm" x="247" y="166" text-anchor="middle">9/20 ✗</text><text class="ink sm" x="317" y="166" text-anchor="middle">2/5 ✗</text><text class="ink sm" x="387" y="166" text-anchor="middle">11/30 ✗</text><path d="M24 174 L422 174" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="83" y="196" text-anchor="middle">6</text><text class="ink sm" x="177" y="196" text-anchor="middle">1/2 ✗</text><text class="ink sm" x="247" y="196" text-anchor="middle">5/12 ✗</text><text class="ink sm" x="317" y="196" text-anchor="middle">11/30 ✗</text><text class="ink sm" x="387" y="196" text-anchor="middle">1/3 ✗</text><rect x="24" y="54" width="398" height="150" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text x="24" y="226" text-anchor="start" fill="var(--ink2)" class="sm">n 은 면의 변 수, m 은 한 꼭짓점에 모이는 면 수. 둘 다 3 이상이다</text><text x="24" y="246" text-anchor="start" fill="var(--ink2)" class="sm">n 이나 m 이 6 이상이면 왼쪽이 1/3 + 1/6 = 1/2 이하가 되어 끝난다</text><text x="24" y="268" text-anchor="start" fill="var(--s3)" class="sm bold">초록 칸 다섯 개가 실제 정다면체 다섯 개다</text><rect x="454" y="46" width="246" height="208" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="577" y="65" text-anchor="middle">남은 다섯</text><text class="ink bold sm" x="491" y="102" text-anchor="middle">n</text><text class="ink bold sm" x="533" y="102" text-anchor="middle">m</text><text class="ink bold sm" x="575" y="102" text-anchor="middle">v</text><text class="ink bold sm" x="617" y="102" text-anchor="middle">e</text><text class="ink bold sm" x="659" y="102" text-anchor="middle">f</text><path d="M470 108 L680 108" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="491" y="124" text-anchor="middle">3</text><text class="ink sm" x="533" y="124" text-anchor="middle">3</text><text class="ink sm" x="575" y="124" text-anchor="middle">4</text><text class="ink sm" x="617" y="124" text-anchor="middle">6</text><text class="ink sm" x="659" y="124" text-anchor="middle">4</text><path d="M470 132 L680 132" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="491" y="148" text-anchor="middle">4</text><text class="ink sm" x="533" y="148" text-anchor="middle">3</text><text class="ink sm" x="575" y="148" text-anchor="middle">8</text><text class="ink sm" x="617" y="148" text-anchor="middle">12</text><text class="ink sm" x="659" y="148" text-anchor="middle">6</text><path d="M470 156 L680 156" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="491" y="172" text-anchor="middle">3</text><text class="ink sm" x="533" y="172" text-anchor="middle">4</text><text class="ink sm" x="575" y="172" text-anchor="middle">6</text><text class="ink sm" x="617" y="172" text-anchor="middle">12</text><text class="ink sm" x="659" y="172" text-anchor="middle">8</text><path d="M470 180 L680 180" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="491" y="196" text-anchor="middle">3</text><text class="ink sm" x="533" y="196" text-anchor="middle">5</text><text class="ink sm" x="575" y="196" text-anchor="middle">12</text><text class="ink sm" x="617" y="196" text-anchor="middle">30</text><text class="ink sm" x="659" y="196" text-anchor="middle">20</text><path d="M470 204 L680 204" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="491" y="220" text-anchor="middle">5</text><text class="ink sm" x="533" y="220" text-anchor="middle">3</text><text class="ink sm" x="575" y="220" text-anchor="middle">20</text><text class="ink sm" x="617" y="220" text-anchor="middle">30</text><text class="ink sm" x="659" y="220" text-anchor="middle">12</text><rect x="470" y="84" width="210" height="144" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text x="577" y="238" text-anchor="middle" fill="var(--ink2)" class="sm">위에서부터 정사면체 · 정육면체 · 정팔면체</text><text class="ink2 sm" x="360" y="300" text-anchor="middle">1/m + 1/n = 1/e + 1/2 에서 e 가 양수이므로 왼쪽이 1/2 보다 커야 한다. 그 제약이 다섯 칸만 남긴다</text><text class="ink2 sm" x="360" y="322" text-anchor="middle">남은 다섯이 모두 실제로 존재한다는 것은 따로 확인해야 한다 — 부등식은 후보를 줄일 뿐 존재를 주지 않는다</text>
</svg>