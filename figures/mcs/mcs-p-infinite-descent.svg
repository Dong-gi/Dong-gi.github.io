<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">정렬집합에는 무한히 내려가는 열이 없다</title><desc id="d">왼쪽은 음이 아닌 정수에서 감소열이 0 에 닿아 멈추는 그림, 오른쪽은 양의 유리수에서 끝없이 내려가는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">정렬집합에서는 내려가는 계단이 언젠가 멈춘다</text><rect x="16" y="48" width="360" height="234" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="196" y="68" text-anchor="middle">음이 아닌 정수 위에서</text><text class="ink2 sm" x="196" y="84" text-anchor="middle">내려가다 반드시 바닥에 닿는다</text><circle cx="56" cy="132" r="5" fill="var(--s3)"/><text class="ink2 sm" x="56" y="120" text-anchor="middle">9</text><circle cx="110" cy="154" r="5" fill="var(--s3)"/><text class="ink2 sm" x="110" y="142" text-anchor="middle">7</text><path d="M56 132 L110 154" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="165" r="5" fill="var(--s3)"/><text class="ink2 sm" x="164" y="153" text-anchor="middle">6</text><path d="M110 154 L164 165" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="218" cy="198" r="5" fill="var(--s3)"/><text class="ink2 sm" x="218" y="186" text-anchor="middle">3</text><path d="M164 165 L218 198" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="272" cy="220" r="5" fill="var(--s3)"/><text class="ink2 sm" x="272" y="208" text-anchor="middle">1</text><path d="M218 198 L272 220" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="326" cy="231" r="5" fill="var(--s3)"/><text class="ink2 sm" x="326" y="219" text-anchor="middle">0</text><path d="M272 220 L326 231" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 242 L346 242" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text class="bold sm sm" x="30" y="262" text-anchor="start">0 에 닿으면 더 내려갈 곳이 없다</text><rect x="400" y="48" width="360" height="234" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="580" y="68" text-anchor="middle">양의 유리수 위에서</text><text class="ink2 sm" x="580" y="84" text-anchor="middle">끝없이 내려갈 수 있다</text><circle cx="436" cy="144" r="5" fill="var(--s2)"/><circle cx="482" cy="185" r="5" fill="var(--s2)"/><path d="M436 144 L482 185" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="528" cy="198.67" r="5" fill="var(--s2)"/><path d="M482 185 L528 198.67" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="574" cy="205.5" r="5" fill="var(--s2)"/><path d="M528 198.67 L574 205.5" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="209.6" r="5" fill="var(--s2)"/><path d="M574 205.5 L620 209.6" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="666" cy="212.33" r="5" fill="var(--s2)"/><path d="M620 209.6 L666 212.33" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="712" cy="214.29" r="5" fill="var(--s2)"/><path d="M666 212.33 L712 214.29" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="436" y="132" text-anchor="middle">1</text><path d="M420 242 L740 242" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text class="bold sm sm" x="414" y="262" text-anchor="start">0 에 닿지 않으니 끝없이 내려간다</text><text class="ink2 sm" x="20" y="316" text-anchor="start">이 차이가 컴퓨터과학에서 쓰인다. 한 걸음마다 값이 줄고 그 값이 정렬집합에 있으면 계산은 반드시 끝난다.</text><text class="ink2 sm" x="20" y="338" text-anchor="start">끝나지 않는다면 줄어드는 값들이 최소 원소 없는 부분집합을 만들 텐데, 정렬집합에서는 그럴 수 없다</text>
</svg>