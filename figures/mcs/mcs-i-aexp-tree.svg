<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 356" width="780" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">산술식의 나무 구조와 eval 계산</title><desc id="d">3 곱하기 x 제곱 더하기 2x 더하기 1 을 완전히 괄호로 적은 식의 나무와 각 부분식의 값, 그리고 eval 함수의 기저와 구성자 정의</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">구성자마다 규칙이 하나씩 — 그것이 eval 의 정의이고, 계산은 나무를 잎에서 뿌리로 올라오는 일이다</text><rect x="20" y="46" width="470" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="255" y="66" text-anchor="middle">[ [3*[x*x] ] + [ [2*x] + 1] ] 을 x = 2 에서 계산한다</text><path d="M255 112 L150 152" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M255 112 L360 152" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 184 L96 224" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 184 L204 224" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 184 L306 224" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 184 L414 224" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="223" y="81" width="64" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="255" y="101" text-anchor="middle">+</text><text class="sm bold" fill="var(--s2)" x="255" y="126" text-anchor="middle">17</text><rect x="118" y="153" width="64" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="150" y="173" text-anchor="middle">*</text><text class="sm bold" fill="var(--s2)" x="150" y="198" text-anchor="middle">12</text><rect x="328" y="153" width="64" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="360" y="173" text-anchor="middle">+</text><text class="sm bold" fill="var(--s2)" x="360" y="198" text-anchor="middle">5</text><rect x="64" y="225" width="64" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="96" y="245" text-anchor="middle">3</text><text class="sm bold" fill="var(--s2)" x="96" y="270" text-anchor="middle">3</text><rect x="172" y="225" width="64" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="204" y="245" text-anchor="middle">*</text><text class="sm bold" fill="var(--s2)" x="204" y="270" text-anchor="middle">4</text><rect x="274" y="225" width="64" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="306" y="245" text-anchor="middle">*</text><text class="sm bold" fill="var(--s2)" x="306" y="270" text-anchor="middle">4</text><rect x="382" y="225" width="64" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="414" y="245" text-anchor="middle">1</text><text class="sm bold" fill="var(--s2)" x="414" y="270" text-anchor="middle">1</text><text class="ink2 sm" x="204" y="282" text-anchor="middle">x · x</text><text class="ink2 sm" x="306" y="282" text-anchor="middle">2 · x</text><text class="sm bold" fill="var(--s2)" x="44" y="96" text-anchor="start">주황 숫자가 그 부분식의 값</text><rect x="508" y="46" width="252" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="634" y="66" text-anchor="middle">eval 의 정의</text><text class="ink2 sm" x="634" y="82" text-anchor="middle">x 의 값을 n 이라 한다</text><text class="sm bold" fill="var(--s1)" x="526" y="106" text-anchor="start">기저</text><text class="ink2 sm" x="526" y="126" text-anchor="start">eval(x, n) ::= n</text><text class="ink2 sm" x="526" y="145" text-anchor="start">eval(k, n) ::= k</text><text class="sm bold" fill="var(--s3)" x="526" y="172" text-anchor="start">구성자</text><text class="ink2 sm" x="526" y="192" text-anchor="start">eval([e₁+e₂], n) ::=</text><text class="ink2 sm" x="526" y="211" text-anchor="start">    eval(e₁, n) + eval(e₂, n)</text><text class="ink2 sm" x="526" y="230" text-anchor="start">eval([e₁*e₂], n) ::=</text><text class="ink2 sm" x="526" y="249" text-anchor="start">    eval(e₁, n) · eval(e₂, n)</text><text class="ink2 sm" x="526" y="268" text-anchor="start">eval(-[e₁], n) ::= − eval(e₁, n)</text><text class="ink2 sm" x="24" y="316" text-anchor="start">3x² + 2x + 1 은 Aexp 가 아니라 Aexp 의 줄임말이다. 지수도 우선순위도 정의에 없으므로 괄호를 다 적어야 하고, 그 덕에 나무 모양이 하나로 정해진다.</text><text class="ink2 sm" x="24" y="336" text-anchor="start">식을 나무로 보는 눈이 이 장의 소득이다 — 컴파일러가 표현식을 다루는 방식이 정확히 이것이다</text>
</svg>