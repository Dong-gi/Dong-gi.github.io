<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">평면 배치의 두 생성자</title><desc id="d">면 쪼개기는 간선과 면을 각각 하나 늘리고 다리 잇기는 간선을 하나 늘리며 면을 하나 줄인다는 것을 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">평면 배치를 재귀적으로 만드는 두 규칙 — 이것으로 구조적 귀납법을 쓴다</text><rect x="20" y="40" width="330" height="234" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="185" y="59" text-anchor="middle">면 쪼개기</text><text class="ink2 sm" x="185" y="75" text-anchor="middle">한 면 위의 두 정점을 이으면 면과 간선이 각각 하나 늘어난다</text><path d="M115.72 175 L115.72 145" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M128.63 125.59 L172.09 107.41" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M197.91 107.41 L241.37 125.59" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.28 145 L254.28 175" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M241.37 194.41 L197.91 212.59" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M172.09 212.59 L128.63 194.41" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M128.63 183.59 L241.37 136.41" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/><circle cx="115.72" cy="189" r="14" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="115.72" y="193" text-anchor="middle" fill="var(--ink)" class="sm">a</text><circle cx="115.72" cy="131" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="115.72" y="135" text-anchor="middle" fill="var(--ink)" class="sm">w</text><circle cx="185" cy="102" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="185" y="106" text-anchor="middle" fill="var(--ink)" class="sm">x</text><circle cx="254.28" cy="131" r="14" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="254.28" y="135" text-anchor="middle" fill="var(--ink)" class="sm">b</text><circle cx="254.28" cy="189" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="254.28" y="193" text-anchor="middle" fill="var(--ink)" class="sm">y</text><circle cx="185" cy="218" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="185" y="222" text-anchor="middle" fill="var(--ink)" class="sm">z</text><text x="30" y="246" text-anchor="start" fill="var(--s2)" class="sm">a w x b y z a 하나가 a w x b a 와 a b y z a 둘로 갈린다</text><text x="30" y="266" text-anchor="start" fill="var(--ink)" class="sm bold">v 그대로, e 하나 늘고, f 하나 늚 → v − e + f 는 그대로</text><rect x="370" y="40" width="330" height="234" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="535" y="59" text-anchor="middle">다리 잇기</text><text class="ink2 sm" x="535" y="75" text-anchor="middle">떨어진 두 배치를 이으면 면이 하나 줄고 간선이 하나 늘어난다</text><path d="M446 106 L488 106" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.74 118.52 L473.26 163.48" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M460.74 163.48 L438.26 118.52" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M602 124 L644 124" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M658 138 L658 180" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M644 194 L602 194" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M588 180 L588 138" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M480.85 178.06 L574.15 191.94" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/><circle cx="432" cy="106" r="14" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="502" cy="106" r="14" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="467" cy="176" r="14" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="588" cy="124" r="14" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="658" cy="124" r="14" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="658" cy="194" r="14" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><circle cx="588" cy="194" r="14" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><text x="380" y="246" text-anchor="start" fill="var(--s1)" class="sm">두 바깥면이 합쳐져 하나가 된다</text><text x="380" y="266" text-anchor="start" fill="var(--ink)" class="sm bold">v 는 더해지고, e 는 더한 뒤 +1, f 는 더한 뒤 −1</text><text class="ink2 sm" x="360" y="302" text-anchor="middle">기저는 정점 하나에 면 하나(길이 0 닫힌 보행)이고 1 − 0 + 1 = 2 다. 두 생성자가 v − e + f 를 바꾸지 않으므로</text><text class="ink2 sm" x="360" y="322" text-anchor="middle">오일러 공식이 구조적 귀납법 한 번으로 나온다. 다리 잇기에서는 2 + 2 − 2 = 2 라는 셈이 필요하다</text>
</svg>