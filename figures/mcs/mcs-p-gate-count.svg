<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 336" width="780" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">논리식을 줄이면 회로가 줄어든다</title><desc id="d">A 또는 (A 가 아니고 B) 를 게이트 세 개로 만든 회로와, 동치인 A 또는 B 를 게이트 한 개로 만든 회로를 나란히 놓은 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">같은 값을 내면서 게이트 셋이 하나가 된다</text><rect x="16" y="46" width="740" height="138" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="386" y="66" text-anchor="middle">A ∨ (¬A ∧ B) — 게이트 세 개</text><text class="ink bold" x="40" y="124" text-anchor="start">A</text><text class="ink bold" x="40" y="166" text-anchor="start">B</text><path d="M54 119 L90 119" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="119" r="3" fill="var(--ink2)"/><path d="M70 119 L70 84 L292 84 L292 104" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="102" width="58" height="34" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="119" y="124" text-anchor="middle">NOT</text><path d="M148 119 L190 128" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 161 L190 145" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="190" y="120" width="58" height="34" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="219" y="142" text-anchor="middle">AND</text><path d="M248 137 L292 126" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="292" y="104" width="58" height="34" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="321" y="126" text-anchor="middle">OR</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M350 121 L400 121"/><text class="ink2 sm" x="408" y="126" text-anchor="start">출력</text><text class="ink2 sm" x="474" y="116" text-anchor="start">게이트 3 개, 배선 6 개</text><text class="ink2 sm" x="474" y="140" text-anchor="start">칩 면적·전력·불량률이 모두 여기에 붙는다</text><rect x="16" y="196" width="740" height="88" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="386" y="216" text-anchor="middle">A ∨ B — 게이트 한 개. 진리표가 같다</text><text class="ink bold" x="40" y="240" text-anchor="start">A</text><text class="ink bold" x="40" y="268" text-anchor="start">B</text><path d="M54 235 L190 240" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 263 L190 256" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="190" y="231" width="58" height="34" rx="6" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="219" y="253" text-anchor="middle">OR</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M248 248 L400 248"/><text class="ink2 sm" x="408" y="253" text-anchor="start">출력</text><text class="ink2 sm" x="474" y="253" text-anchor="start">게이트 1 개, 배선 3 개</text><text class="ink2 sm" x="20" y="316" text-anchor="start">식을 줄이는 일이 곧 회로를 줄이는 일이다. 다만 ‘가장 짧은 동치식’ 을 찾는 문제 자체가 어렵다는 것이 이 장 뒷부분의 SAT 이야기다</text>
</svg>