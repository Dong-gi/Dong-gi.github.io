<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 328" width="780" height="328" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">말 색깔 가짜 증명이 무너지는 자리</title><desc id="d">왼쪽은 말 네 마리에서 앞 세 마리와 뒤 세 마리가 두 마리를 공유하는 그림, 오른쪽은 말 두 마리에서 공유하는 말이 없어 논증이 끊기는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">겹치는 부분이 있다는 전제가 가장 작은 곳에서 깨진다</text><rect x="20" y="48" width="360" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="200" y="68" text-anchor="middle">n = 3 → 4 : 논증이 통한다</text><text class="ink2 sm" x="200" y="84" text-anchor="middle">두 무리가 말 두 마리를 공유한다</text><rect x="60" y="140" width="48" height="42" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="84" y="167" text-anchor="middle">h₁</text><rect x="122" y="140" width="48" height="42" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="146" y="167" text-anchor="middle">h₂</text><rect x="184" y="140" width="48" height="42" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="208" y="167" text-anchor="middle">h₃</text><rect x="246" y="140" width="48" height="42" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="270" y="167" text-anchor="middle">h₄</text><path d="M54 126 L232 126" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s1)" x="54" y="118" text-anchor="start">앞 세 마리 — 같은 색</text><path d="M116 196 L300 196" fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s3)" x="116" y="212" text-anchor="start">뒤 세 마리 — 같은 색</text><rect x="118" y="134" width="114" height="54" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="2" stroke-dasharray="5 4"/><text class="sm bold" fill="var(--s2)" x="176" y="240" text-anchor="middle">겹치는 두 마리가 두 색을 잇는다</text><rect x="400" y="48" width="360" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="580" y="68" text-anchor="middle">n = 1 → 2 : 논증이 깨진다</text><text class="ink2 sm" x="580" y="84" text-anchor="middle">공유하는 말이 하나도 없다</text><rect x="500" y="140" width="48" height="42" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="524" y="167" text-anchor="middle">h₁</text><rect x="562" y="140" width="48" height="42" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink bold sm" x="586" y="167" text-anchor="middle">h₂</text><path d="M494 126 L542 126" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s1)" x="494" y="118" text-anchor="start">앞 한 마리</text><path d="M556 196 L610 196" fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s3)" x="556" y="212" text-anchor="start">뒤 한 마리</text><path d="M548 154 L562 168" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M548 168 L562 154" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="sm bold" fill="var(--s2)" x="530" y="240" text-anchor="middle">겹치는 말이 하나도 없다</text><text class="ink2 sm" x="24" y="276" text-anchor="start">가짜 증명의 문장 ‘h₁ 은 나머지 h₂ … h_n 과 같은 색이다’ 가 범인이다. 줄임표가 말이 몇 마리 있는 것처럼 보이게 하지만 n = 1 이면 하나도 없다.</text><text class="ink2 sm" x="24" y="296" text-anchor="start">P(1) 은 참이고 P(2) → P(3), P(3) → P(4) … 도 모두 참이다. 빠진 것은 P(1) → P(2) 하나뿐이고, 그 하나로 사슬 전체가 끊긴다.</text>
</svg>