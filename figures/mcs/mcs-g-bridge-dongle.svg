<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">다리와 동글이 있는 평면 그림</title><desc id="d">자른 간선이 한 면의 경계에 두 번 나오는 예와, 나무 모양 동글의 간선들이 모두 두 번 나오는 예를 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">면 경계가 늘 순환은 아니다 — 다리와 동글이 있으면 같은 간선을 두 번 지난다</text><rect x="20" y="40" width="330" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="185" y="59" text-anchor="middle">다리(bridge)</text><text class="ink2 sm" x="185" y="75" text-anchor="middle">자른 간선 c–e 가 한 면의 경계에 두 번 나온다</text><path d="M104 108 L166 108" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 122 L180 180" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M166 194 L104 194" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 180 L90 122" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M261.59 186.15 L300.41 159.85" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M312 166 L312 212" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M299.56 219.58 L262.44 200.42" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M194 194 L236 194" fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="108" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="90" y="112" text-anchor="middle" fill="var(--ink)" class="sm">a</text><circle cx="180" cy="108" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="180" y="112" text-anchor="middle" fill="var(--ink)" class="sm">b</text><circle cx="180" cy="194" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="180" y="198" text-anchor="middle" fill="var(--ink)" class="sm">c</text><circle cx="90" cy="194" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="90" y="198" text-anchor="middle" fill="var(--ink)" class="sm">d</text><circle cx="250" cy="194" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="250" y="198" text-anchor="middle" fill="var(--ink)" class="sm">e</text><circle cx="312" cy="152" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="312" y="156" text-anchor="middle" fill="var(--ink)" class="sm">f</text><circle cx="312" cy="226" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="312" y="230" text-anchor="middle" fill="var(--ink)" class="sm">g</text><text x="30" y="258" text-anchor="start" fill="var(--s2)" class="sm">바깥면: a b c e f g e c d a — c–e 가 두 번 나온다</text><rect x="370" y="40" width="330" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="535" y="59" text-anchor="middle">동글(dongle)</text><text class="ink2 sm" x="535" y="75" text-anchor="middle">다리로만 된 나무가 면 안에 달려 있다</text><path d="M454 108 L586 108" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 122 L600 200" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M586 214 L454 214" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 200 L440 122" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M589.51 204.73 L550.49 170.27" fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M528.02 153.76 L503.98 139.24" fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M528.46 168.93 L503.54 186.07" fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="440" cy="108" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="440" y="112" text-anchor="middle" fill="var(--ink)" class="sm">p</text><circle cx="600" cy="108" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="600" y="112" text-anchor="middle" fill="var(--ink)" class="sm">q</text><circle cx="600" cy="214" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="600" y="218" text-anchor="middle" fill="var(--ink)" class="sm">r</text><circle cx="440" cy="214" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="440" y="218" text-anchor="middle" fill="var(--ink)" class="sm">s</text><circle cx="540" cy="161" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="540" y="165" text-anchor="middle" fill="var(--ink)" class="sm">x</text><circle cx="492" cy="132" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="492" y="136" text-anchor="middle" fill="var(--ink)" class="sm">y</text><circle cx="492" cy="194" r="14" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="492" y="198" text-anchor="middle" fill="var(--ink)" class="sm">z</text><text x="378" y="258" text-anchor="start" fill="var(--s2)" class="sm">안쪽 면: p q r x y x z x r s p — 세 간선이 모두 두 번</text><text class="ink2 sm" x="360" y="286" text-anchor="middle">그래서 면의 경계를 순환이라 하지 못하고 닫힌 보행이라 해야 한다. 다리는 한 면의 경계에 두 번 나오는 간선이다</text><text class="ink2 sm" x="360" y="306" text-anchor="middle">다리가 아닌 간선은 서로 다른 두 면의 경계에 한 번씩 나온다. 어느 쪽이든 간선마다 두 번이 지켜진다</text><text class="ink2 sm" x="360" y="326" text-anchor="middle">이 사실이 뒤에서 간선 수의 상한을 얻는 열쇠다</text>
</svg>