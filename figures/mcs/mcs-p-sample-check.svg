3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="542.5" y="106" text-anchor="middle">30</text><rect x="551" y="62" width="17" height="30" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="559.5" y="106" text-anchor="middle"></text><rect x="568" y="62" width="17" height="30" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="576.5" y="106" text-anchor="middle"></text><rect x="585" y="62" width="17" height="30" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="593.5" y="106" text-anchor="middle"></text><rect x="602" y="62" width="17" height="30" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="610.5" y="106" text-anchor="middle"></text><rect x="619" y="62" width="17" height="30" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="627.5" y="106" text-anchor="middle"></text><rect x="636" y="62" width="17" height="30" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="644.5" y="106" text-anchor="middle"></text><rect x="653" y="62" width="17" height="30" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="661.5" y="106" text-anchor="middle"></text><rect x="670" y="62" width="17" height="30" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="678.5" y="106" text-anchor="middle"></text><rect x="687" y="62" width="17" height="30" rx="2" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.9"/><text class="ink2 sm" x="695.5" y="106" text-anchor="middle"></text><rect x="704" y="62" width="17" height="30" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink2 sm" x="712.5" y="106" text-anchor="middle">40</text><text class="ink2 sm" x="24" y="50" text-anchor="start">n = 0 부터 40 까지 p(n) = n² + n + 41 을 하나씩 소수인지 검사한 결과</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M752.5 148 L715.5 114"/><text class="ink bold sm" x="758.5" y="156" text-anchor="end">n = 40 에서 깨진다</text><text class="ink2 sm" x="758.5" y="174" text-anchor="end">p(40) = 1681 = 41 × 41</text><text class="ink2 sm" x="24" y="156" text-anchor="start">초록 칸 마흔 개는 모두 소수다</text><path d="M24 208 L756 208" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="24" y="234" text-anchor="start">오일러가 1769년에 내놓은 추측 — a⁴ + b⁴ + c⁴ = d⁴ 인 양의 정수는 없다</text><text class="ink2 sm" x="24" y="254" text-anchor="start">218년 뒤에 반례가 나왔다. a = 95800, b = 217519, c = 414560, d = 422481</text><text class="ink2 sm" x="24" y="278" text-anchor="start">검사할 수 있는 범위 안에 반례가 없다는 것은 아무것도 보장하지 않는다. 그래서 증명이 필요하다</text>
