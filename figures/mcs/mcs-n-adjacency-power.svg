<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">인접행렬의 제곱과 보행의 수</title><desc id="d">인접행렬과 그 제곱을 나란히 놓고, 값이 2 인 성분에 대응하는 두 보행을 오른쪽에 그린 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="26" text-anchor="middle">인접행렬을 제곱하면 길이 2 인 보행의 수가 나온다</text><text x="115" y="58" text-anchor="middle" fill="var(--ink)" class="sm bold">인접행렬 A</text><text x="87" y="76" text-anchor="middle" fill="var(--s1)" class="sm bold">a</text><text x="121" y="76" text-anchor="middle" fill="var(--s1)" class="sm bold">b</text><text x="155" y="76" text-anchor="middle" fill="var(--s1)" class="sm bold">c</text><text x="189" y="76" text-anchor="middle" fill="var(--s1)" class="sm bold">d</text><text x="64" y="105" text-anchor="end" fill="var(--s1)" class="sm bold">a</text><text x="87" y="105" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="121" y="105" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="155" y="105" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="189" y="105" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="64" y="133" text-anchor="end" fill="var(--s1)" class="sm bold">b</text><text x="87" y="133" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="121" y="133" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="155" y="133" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="189" y="133" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="64" y="161" text-anchor="end" fill="var(--s1)" class="sm bold">c</text><text x="87" y="161" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="121" y="161" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="155" y="161" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="189" y="161" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="64" y="189" text-anchor="end" fill="var(--s1)" class="sm bold">d</text><text x="87" y="189" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="121" y="189" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="155" y="189" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="189" y="189" text-anchor="middle" fill="var(--ink)" class="sm">0</text><path d="M66 84 L66 202" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 84 L210 202" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="345" y="58" text-anchor="middle" fill="var(--ink)" class="sm bold">A 를 제곱한 것</text><text x="317" y="76" text-anchor="middle" fill="var(--s1)" class="sm bold">a</text><text x="351" y="76" text-anchor="middle" fill="var(--s1)" class="sm bold">b</text><text x="385" y="76" text-anchor="middle" fill="var(--s1)" class="sm bold">c</text><text x="419" y="76" text-anchor="middle" fill="var(--s1)" class="sm bold">d</text><text x="294" y="105" text-anchor="end" fill="var(--s1)" class="sm bold">a</text><text x="317" y="105" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="351" y="105" text-anchor="middle" fill="var(--ink)" class="sm">0</text><rect x="371" y="91" width="28" height="22" rx="3" fill="var(--s2)" fill-opacity="0.25" stroke="var(--s2)" stroke-width="1.6"/><text x="385" y="105" text-anchor="middle" fill="var(--s2)" class="sm bold">2</text><text x="419" y="105" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="294" y="133" text-anchor="end" fill="var(--s1)" class="sm bold">b</text><text x="317" y="133" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="351" y="133" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="385" y="133" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="419" y="133" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="294" y="161" text-anchor="end" fill="var(--s1)" class="sm bold">c</text><text x="317" y="161" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="351" y="161" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="385" y="161" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="419" y="161" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="294" y="189" text-anchor="end" fill="var(--s1)" class="sm bold">d</text><text x="317" y="189" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="351" y="189" text-anchor="middle" fill="var(--ink)" class="sm">1</text><text x="385" y="189" text-anchor="middle" fill="var(--ink)" class="sm">0</text><text x="419" y="189" text-anchor="middle" fill="var(--ink)" class="sm">0</text><path d="M296 84 L296 202" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 84 L440 202" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="232" y="130" text-anchor="middle" fill="var(--ink2)">×</text><rect x="490" y="62" width="210" height="150" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="595" y="82" text-anchor="middle">a 에서 c 로 가는 길이 2 보행</text><text class="ink2 sm" x="595" y="99" text-anchor="middle">두 개다 — 그래서 칸이 2</text><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M545 110 L645 110"/><path fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar2)" d="M660 125 L660 165"/><path fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M530 125 L530 165"/><path fill="none" stroke="var(--s3)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar3)" d="M545 180 L645 180"/><circle cx="530" cy="110" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="530" y="114" text-anchor="middle" fill="var(--ink)" class="sm">a</text><circle cx="660" cy="110" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="660" y="114" text-anchor="middle" fill="var(--ink)" class="sm">b</text><circle cx="660" cy="180" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="660" y="184" text-anchor="middle" fill="var(--ink)" class="sm">c</text><circle cx="530" cy="180" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="530" y="184" text-anchor="middle" fill="var(--ink)" class="sm">d</text><text class="ink2 sm" x="360" y="248" text-anchor="middle">이유는 곱셈의 정의 그대로다. u 에서 v 로 가는 길이 2 보행은 가운데 정점 w 를 하나 고르는 일이고,</text><text class="ink2 sm" x="360" y="268" text-anchor="middle">w 마다 (u 에서 w 로 가는 수) × (w 에서 v 로 가는 수) 를 더한 것이 곧 행렬 곱의 (u, v) 성분이다</text><text class="ink2 sm" x="360" y="296" text-anchor="middle">같은 논증을 되풀이하면 A 의 k 제곱이 길이 k 보행을 센다</text>
</svg>