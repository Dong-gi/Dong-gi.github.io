<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">가정을 강하게 만들면 네 사분면 모두에 쓸 수 있다</text><rect x="20" y="48" width="232" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="136" y="68" text-anchor="middle">약한 가정: 상은 가운데에만</text><text class="ink2 sm" x="136" y="84" text-anchor="middle">P(n) 을 P(n+1) 에 쓸 수 없다</text><path d="M68 108 L68 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 108 L85 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M102 108 L102 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M119 108 L119 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M136 108 L136 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M153 108 L153 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 108 L170 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M187 108 L187 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 108 L204 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 108 L204 108" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 125 L204 125" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 142 L204 142" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 159 L204 159" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 176 L204 176" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 193 L204 193" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 210 L204 210" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 227 L204 227" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 244 L204 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="136" y="176" width="17" height="17" rx="1" fill="var(--s1)" fill-opacity="0.85" stroke="var(--s1)" stroke-width="1.5"/><path d="M136 108 L136 244" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 176 L204 176" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="102" y="147" text-anchor="middle">?</text><text class="ink bold" x="170" y="147" text-anchor="middle">?</text><text class="ink bold" x="102" y="215" text-anchor="middle">?</text><text class="ink2 sm" x="36" y="262" text-anchor="start">상이 든 사분면 말고 나머지 셋에는</text><text class="ink2 sm" x="36" y="280" text-anchor="start">상이 없어서 가정을 쓸 자격이 없다</text><text class="sm bold" fill="var(--s2)" x="36" y="302" text-anchor="start">가정이 모자라서 막힌다</text><rect x="274" y="48" width="232" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="390" y="68" text-anchor="middle">강한 가정: 상이 어디 있어도</text><text class="ink2 sm" x="390" y="84" text-anchor="middle">임시 상 셋으로 사분면을 채운다</text><path d="M322 108 L322 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M339 108 L339 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M356 108 L356 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M373 108 L373 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 108 L390 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M407 108 L407 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M424 108 L424 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M441 108 L441 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M458 108 L458 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 108 L458 108" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 125 L458 125" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 142 L458 142" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 159 L458 159" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 176 L458 176" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 193 L458 193" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 210 L458 210" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 227 L458 227" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 244 L458 244" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="424" y="125" width="17" height="17" rx="1" fill="var(--s1)" fill-opacity="0.85" stroke="var(--s1)" stroke-width="1.5"/><rect x="373" y="159" width="17" height="17" rx="1" fill="var(--s3)" fill-opacity="0.8" stroke="var(--s3)" stroke-width="1.5"/><rect x="390" y="159" width="17" height="17" rx="1" fill="var(--s3)" fill-opacity="0.8" stroke="var(--s3)" stroke-width="1.5"/><rect x="373" y="176" width="17" height="17" rx="1" fill="var(--s3)" fill-opacity="0.8" stroke="var(--s3)" stroke-width="1.5"/><path d="M390 108 L390 244" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 176 L458 176" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="290" y="262" text-anchor="start">이 셋을 L 타일 하나로 바꾸면 끝난다</text><text class="ink2 sm" x="290" y="280" text-anchor="start">네 사분면 모두 가정을 쓸 수 있다</text><text class="sm bold" fill="var(--s3)" x="290" y="302" text-anchor="start">더 센 주장이 더 쉽게 증명된다</text><rect x="528" y="48" width="232" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="644" y="68" text-anchor="middle">L 타일과 임시 상</text><rect x="568" y="96" width="22" height="22" rx="2" fill="var(--s3)" fill-opacity="0.35" stroke="var(--s3)" stroke-width="1.6"/><rect x="590" y="96" width="22" height="22" rx="2" fill="var(--s3)" fill-opacity="0.35" stroke="var(--s3)" stroke-width="1.6"/><rect x="568" y="118" width="22" height="22" rx="2" fill="var(--s3)" fill-opacity="0.35" stroke="var(--s3)" stroke-width="1.6"/><text class="ink2 sm" x="646" y="116" text-anchor="start">칸 세 개를 덮는 L 타일</text><text class="ink2 sm" x="646" y="134" text-anchor="start">(회전은 자유롭다)</text><rect x="568" y="174" width="22" height="22" rx="2" fill="var(--s1)" fill-opacity="0.85" stroke="var(--s1)" stroke-width="1.5"/><text class="ink2 sm" x="600" y="190" text-anchor="start">상 — 덮지 않는 한 칸</text><rect x="568" y="208" width="22" height="22" rx="2" fill="var(--s3)" fill-opacity="0.8" stroke="var(--s3)" stroke-width="1.5"/><text class="ink2 sm" x="600" y="224" text-anchor="start">임시 상 — 증명을 위한 장치</text><text class="ink2 sm" x="544" y="252" text-anchor="start">증명이 알고리즘을 준다. 사분면으로 쪼개고</text><text class="ink2 sm" x="544" y="270" text-anchor="start">임시 상 셋을 놓고 재귀로 내려가면</text><text class="ink2 sm" x="544" y="288" text-anchor="start">실제 타일 배치가 나온다 — 귀납 증명의</text><text class="ink2 sm" x="544" y="306" text-anchor="start">부수 효과 중 가장 값나가는 것이다</text>
</svg>