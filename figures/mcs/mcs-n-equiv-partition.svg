<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="26" text-anchor="middle">동치관계의 화살표는 덩어리 안에서만 오간다</text><rect x="20" y="44" width="330" height="210" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="185" y="64" text-anchor="middle">관계로 본 모습</text><text class="ink2 sm" x="185" y="81" text-anchor="middle">반사 · 대칭 · 추이를 모두 만족한다</text><path d="M109.88 121.87 Q138.88 125.52 162.75 108.66" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M160.12 98.13 Q131.12 94.48 107.25 111.34" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M97.11 134.85 Q101.11 162.94 123.28 180.64" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M132.89 175.15 Q128.89 147.06 106.72 129.36" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M164.97 111.15 Q140.38 138.5 136.56 175.08" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M145.03 178.85 Q169.62 151.5 173.44 114.92" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M86.75 107.4 C66.5 73.5 123.5 73.5 103.25 107.4" fill="none" stroke="var(--s1)" stroke-width="1.7" marker-end="url(#ar1)"/><path d="M166.75 87.4 C146.5 53.5 203.5 53.5 183.25 87.4" fill="none" stroke="var(--s1)" stroke-width="1.7" marker-end="url(#ar1)"/><path d="M126.75 177.4 C106.5 143.5 163.5 143.5 143.25 177.4" fill="none" stroke="var(--s1)" stroke-width="1.7" marker-end="url(#ar1)"/><circle cx="95" cy="120" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="95" y="124" text-anchor="middle" fill="var(--ink)" class="sm">a</text><circle cx="175" cy="100" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="175" y="104" text-anchor="middle" fill="var(--ink)" class="sm">b</text><circle cx="135" cy="190" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="135" y="194" text-anchor="middle" fill="var(--ink)" class="sm">c</text><path d="M256.58 133.48 Q269.19 159.29 296 169.61" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M303.42 161.52 Q290.81 135.71 264 125.39" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M244.97 134.13 Q234 165 244.97 195.87" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M255.03 195.87 Q266 165 255.03 134.13" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M295.07 176.44 Q271.94 178.68 258.61 197.71" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M264.93 208.56 Q288.06 206.32 301.39 187.29" fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)"/><path d="M241.75 107.4 C221.5 73.5 278.5 73.5 258.25 107.4" fill="none" stroke="var(--s3)" stroke-width="1.7" marker-end="url(#ar3)"/><path d="M301.75 162.4 C281.5 128.5 338.5 128.5 318.25 162.4" fill="none" stroke="var(--s3)" stroke-width="1.7" marker-end="url(#ar3)"/><path d="M241.75 197.4 C221.5 163.5 278.5 163.5 258.25 197.4" fill="none" stroke="var(--s3)" stroke-width="1.7" marker-end="url(#ar3)"/><circle cx="250" cy="120" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="250" y="124" text-anchor="middle" fill="var(--ink)" class="sm">d</text><circle cx="310" cy="175" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="310" y="179" text-anchor="middle" fill="var(--ink)" class="sm">e</text><circle cx="250" cy="210" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="250" y="214" text-anchor="middle" fill="var(--ink)" class="sm">f</text><rect x="390" y="44" width="310" height="210" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="545" y="64" text-anchor="middle">분할로 본 모습</text><text class="ink2 sm" x="545" y="81" text-anchor="middle">블록 두 개가 정점 전체를 덮는다</text><rect x="415" y="92" width="250" height="62" rx="10" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.8"/><text x="540" y="128" text-anchor="middle" fill="var(--ink)" class="sm bold">{a, b, c} — a 의 동치류</text><rect x="415" y="172" width="250" height="62" rx="10" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.8"/><text x="540" y="208" text-anchor="middle" fill="var(--ink)" class="sm bold">{d, e, f} — d 의 동치류</text><text class="ink2 sm" x="360" y="278" text-anchor="middle">왼쪽에서 오른쪽으로 가는 것은 동치류를 모으는 일이고, 오른쪽에서 왼쪽으로 가는 것은</text><text class="ink2 sm" x="360" y="296" text-anchor="middle">‘같은 블록에 있다’ 를 관계로 읽는 일이다. 두 방향이 서로 역이라 동치관계와 분할은 같은 것이다</text>
</svg>