<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">유도 변수 세 가지와 종료성</title><desc id="d">강하게 감소하는 자연수 값 측도는 종료를 보장하고, 약하게 감소하는 것과 유리수 값으로 강하게 감소하는 것은 보장하지 않음을 세 꺾은선으로 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">종료성을 보장하는 것은 ‘강하게 감소’ 와 ‘정렬집합’ 둘 다다 — 하나만으로는 안 된다</text><rect x="20" y="48" width="240" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="140" y="68" text-anchor="middle">강하게 감소 · 값은 ℕ</text><text class="sm bold" fill="var(--s3)" x="140" y="86" text-anchor="middle">끝난다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M64 182 L232 182"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M64 182 L64 100"/><text class="ink2 sm" x="230" y="198" text-anchor="end">걸음</text><text class="ink2 sm" x="52" y="98" text-anchor="middle">f</text><path d="M76 115.5 L103 134.5 L130 144 L157 163 L184 172.5 L211 182" fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="115.5" r="3.6" fill="var(--s3)"/><circle cx="103" cy="134.5" r="3.6" fill="var(--s3)"/><circle cx="130" cy="144" r="3.6" fill="var(--s3)"/><circle cx="157" cy="163" r="3.6" fill="var(--s3)"/><circle cx="184" cy="172.5" r="3.6" fill="var(--s3)"/><circle cx="211" cy="182" r="3.6" fill="var(--s3)"/><text class="ink2 sm" x="36" y="216" text-anchor="start">값이 0 에 닿으면 더 갈 수 없다.</text><text class="ink2 sm" x="36" y="234" text-anchor="start">실행 길이가 f(q) 이하로 묶인다</text><rect x="272" y="48" width="240" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="392" y="68" text-anchor="middle">약하게 감소 · 값은 ℕ</text><text class="sm bold" fill="var(--s2)" x="392" y="86" text-anchor="middle">끝나지 않을 수 있다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M316 182 L484 182"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M316 182 L316 100"/><text class="ink2 sm" x="482" y="198" text-anchor="end">걸음</text><text class="ink2 sm" x="304" y="98" text-anchor="middle">f</text><path d="M328 115.5 L355 134.5 L382 134.5 L409 134.5 L436 134.5 L463 134.5" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="328" cy="115.5" r="3.6" fill="var(--s2)"/><circle cx="355" cy="134.5" r="3.6" fill="var(--s2)"/><circle cx="382" cy="134.5" r="3.6" fill="var(--s2)"/><circle cx="409" cy="134.5" r="3.6" fill="var(--s2)"/><circle cx="436" cy="134.5" r="3.6" fill="var(--s2)"/><circle cx="463" cy="134.5" r="3.6" fill="var(--s2)"/><text class="ink2 sm" x="288" y="216" text-anchor="start">평평한 구간에서 영원히 돌 수 있다.</text><text class="ink2 sm" x="288" y="234" text-anchor="start">‘반드시 줄어든다’ 가 필요하다</text><rect x="524" y="48" width="240" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="644" y="68" text-anchor="middle">강하게 감소 · 값은 ℚ</text><text class="sm bold" fill="var(--s2)" x="644" y="86" text-anchor="middle">끝나지 않을 수 있다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M568 182 L736 182"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M568 182 L568 100"/><text class="ink2 sm" x="734" y="198" text-anchor="end">걸음</text><text class="ink2 sm" x="556" y="98" text-anchor="middle">f</text><path d="M580 115.5 L607 148.75 L634 165.38 L661 173.45 L688 177.72 L715 179.72" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="580" cy="115.5" r="3.6" fill="var(--s2)"/><circle cx="607" cy="148.75" r="3.6" fill="var(--s2)"/><circle cx="634" cy="165.38" r="3.6" fill="var(--s2)"/><circle cx="661" cy="173.45" r="3.6" fill="var(--s2)"/><circle cx="688" cy="177.72" r="3.6" fill="var(--s2)"/><circle cx="715" cy="179.72" r="3.6" fill="var(--s2)"/><text class="ink2 sm" x="540" y="216" text-anchor="start">0 에 다가가지만 닿지 않는다.</text><text class="ink2 sm" x="540" y="234" text-anchor="start">ℚ 는 정렬집합이 아니다 (4장)</text><text class="ink2 sm" x="24" y="274" text-anchor="start">넓혀 쓰는 법: 값이 ℕ 이 아니어도 정렬집합이면 된다. 그러면 실행 길이의 상한은 말할 수 없지만 언젠가 끝난다는 것은 보장된다.</text><text class="ink2 sm" x="24" y="294" text-anchor="start">4장에서 ‘정렬집합에는 무한 감소열이 없다’ 를 증명해 둔 것이 정확히 이 자리에 쓰인다</text>
</svg>