<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">원탁 배열은 순열을 n 으로 나눈 것</title><desc id="d">기사 넷의 자리 배치 넷이 돌리면 서로 같아져 하나의 배열이 된다. 순환 이동이 n 가지이므로 사상이 n 대 1 이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">돌려서 같아지는 자리 배치 넷이 배열 하나다</text><text class="ink sm" x="24" y="62" text-anchor="start">① 자리 배치 = 맨 위 자리에서 시계 방향으로 읽은 순열. 넷은 서로 다른 순열이다</text><circle cx="96" cy="138" r="38" fill="none" stroke="var(--grid)" stroke-width="1.4"/><rect x="81" y="89" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="96" y="105" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="119" y="127" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="134" y="143" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><rect x="81" y="165" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="96" y="181" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="43" y="127" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="58" y="143" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><text class="ink2 sm" x="96" y="200" text-anchor="middle">(k<tspan baseline-shift="-22%" font-size="76%">2</tspan>, k<tspan baseline-shift="-22%" font-size="76%">4</tspan>, k<tspan baseline-shift="-22%" font-size="76%">1</tspan>, k<tspan baseline-shift="-22%" font-size="76%">3</tspan>)</text><circle cx="238" cy="138" r="38" fill="none" stroke="var(--grid)" stroke-width="1.4"/><rect x="223" y="89" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="238" y="105" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><rect x="261" y="127" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="276" y="143" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="223" y="165" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="238" y="181" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="185" y="127" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="200" y="143" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="238" y="200" text-anchor="middle">(k<tspan baseline-shift="-22%" font-size="76%">4</tspan>, k<tspan baseline-shift="-22%" font-size="76%">1</tspan>, k<tspan baseline-shift="-22%" font-size="76%">3</tspan>, k<tspan baseline-shift="-22%" font-size="76%">2</tspan>)</text><circle cx="380" cy="138" r="38" fill="none" stroke="var(--grid)" stroke-width="1.4"/><rect x="365" y="89" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="380" y="105" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="403" y="127" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="418" y="143" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="365" y="165" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="380" y="181" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="327" y="127" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="342" y="143" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><text class="ink2 sm" x="380" y="200" text-anchor="middle">(k<tspan baseline-shift="-22%" font-size="76%">1</tspan>, k<tspan baseline-shift="-22%" font-size="76%">3</tspan>, k<tspan baseline-shift="-22%" font-size="76%">2</tspan>, k<tspan baseline-shift="-22%" font-size="76%">4</tspan>)</text><circle cx="522" cy="138" r="38" fill="none" stroke="var(--grid)" stroke-width="1.4"/><rect x="507" y="89" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="522" y="105" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="545" y="127" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="560" y="143" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="507" y="165" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="522" y="181" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><rect x="469" y="127" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="484" y="143" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink2 sm" x="522" y="200" text-anchor="middle">(k<tspan baseline-shift="-22%" font-size="76%">3</tspan>, k<tspan baseline-shift="-22%" font-size="76%">2</tspan>, k<tspan baseline-shift="-22%" font-size="76%">4</tspan>, k<tspan baseline-shift="-22%" font-size="76%">1</tspan>)</text><circle cx="706" cy="138" r="38" fill="none" stroke="var(--grid)" stroke-width="1.4"/><rect x="691" y="89" width="30" height="22" rx="3" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.4"/><text class="ink sm" x="706" y="105" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="729" y="127" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="744" y="143" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="691" y="165" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="706" y="181" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="653" y="127" width="30" height="22" rx="3" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.4"/><text class="ink sm" x="668" y="143" text-anchor="middle">k<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><text class="ink bold sm" x="706" y="200" text-anchor="middle">배열 하나</text><path d="M592 96 L592 180" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M592 138 L638 138"/><text class="ink2 sm" x="619" y="126" text-anchor="middle">돌리면</text><text class="ink2 sm" x="619" y="168" text-anchor="middle">같다</text><path d="M24 226 L776 226" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="24" y="250" text-anchor="start">② 옆에 누가 앉았는지만 따지면 넷이 모두 같다. 순환 이동 n 가지가 한 배열로 가므로 사상이 n 대 1 이다</text><text class="ink bold sm" x="24" y="274" text-anchor="start">③ 그래서 원탁 배열은 n! / n = (n−1)! 개다. n = 4 이면 4! / 4 = 6 개의 배열이 있다</text>
</svg>