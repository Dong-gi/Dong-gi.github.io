</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">왜 큰 자본으로도 이기지 못하는가 — 표류와 진동</text><path class="gr" d="M66 236 V56"/><path class="gr" d="M161 236 V56"/><path class="gr" d="M256 236 V56"/><path class="gr" d="M351 236 V56"/><path class="gr" d="M446 236 V56"/><path class="gr" d="M66 236 H446"/><path class="gr" d="M66 200 H446"/><path class="gr" d="M66 164 H446"/><path class="gr" d="M66 128 H446"/><path class="gr" d="M66 92 H446"/><path class="gr" d="M66 56 H446"/><path class="ax" marker-end="url(#ark)" d="M66 128 H456"/><path class="ax" marker-end="url(#ark)" d="M66 236 V46"/><text class="sm ink2" x="161" y="143" text-anchor="middle">25</text><text class="sm ink2" x="256" y="143" text-anchor="middle">50</text><text class="sm ink2" x="351" y="143" text-anchor="middle">75</text><text class="sm ink2" x="446" y="143" text-anchor="middle">100</text><text class="sm ink2" x="60" y="240" text-anchor="end">-60</text><text class="sm ink2" x="60" y="204" text-anchor="end">-40</text><text class="sm ink2" x="60" y="168" text-anchor="end">-20</text><text class="sm ink2" x="60" y="96" text-anchor="end">20</text><text class="sm ink2" x="60" y="60" text-anchor="end">40</text><text class="sm ink2" x="460" y="132">판 수 k</text><text class="sm ink2" x="66" y="38" text-anchor="middle">자본의 변화</text><path class="cv s2" stroke-dasharray="6 4" d="M66 128 L69.17 128.75 L72.33 129.5 L75.5 130.25 L78.67 131 L81.83 131.75 L85 132.5 L88.17 133.25 L91.33 134 L94.5 134.75 L97.67 135.5 L100.83 136.25 L104 137 L107.17 137.75 L110.33 138.5 L113.5 139.25 L116.67 140 L119.83 140.75 L123 141.5 L126.17 142.25 L129.33 143 L132.5 143.75 L135.67 144.5 L138.83 145.25 L142 146 L145.17 146.75 L148.33 147.5 L151.5 148.25 L154.67 149 L157.83 149.75 L161 150.5 L164.17 151.25 L167.33 152 L170.5 152.75 L173.67 153.5 L176.83 154.25 L180 155 L183.17 155.75 L186.33 156.5 L189.5 157.25 L192.67 158 L195.83 158.75 L199 159.5 L202.17 160.25 L205.33 161 L208.5 161.75 L211.67 162.5 L214.83 163.25 L218 164 L221.17 164