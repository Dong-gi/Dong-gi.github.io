<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">표류와 진동</title><desc id="d">편향된 무작위 행보에서 평균이 직선으로 내려가는 표류가 제곱근으로 자라는 진동을 압도하는 것을 보이는 그림</desc>
<style>
