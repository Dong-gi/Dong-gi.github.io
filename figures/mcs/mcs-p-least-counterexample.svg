<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 348" width="780" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">최소 반례를 잡는다는 발상</title><desc id="d">반례들 중 가장 작은 것을 c 라 하면 c 보다 작은 곳에서는 명제가 참이고, 그 정보로 c 보다 작은 반례를 만들어 모순을 얻는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">가장 작은 반례를 잡아 놓고, 그보다 작은 반례를 만들어 낸다</text><rect x="40" y="88" width="46" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="63" y="142" text-anchor="middle">0</text><rect x="86" y="88" width="46" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="109" y="142" text-anchor="middle">1</text><rect x="132" y="88" width="46" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="155" y="142" text-anchor="middle">2</text><rect x="178" y="88" width="46" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="201" y="142" text-anchor="middle">3</text><rect x="224" y="88" width="46" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="247" y="142" text-anchor="middle">4</text><rect x="270" y="88" width="46" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="293" y="142" text-anchor="middle">5</text><rect x="316" y="88" width="46" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="339" y="142" text-anchor="middle">6</text><rect x="362" y="88" width="46" height="40" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink2 sm" x="385" y="142" text-anchor="middle">7</text><rect x="408" y="88" width="46" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="431" y="142" text-anchor="middle">8</text><rect x="454" y="88" width="46" height="40" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink2 sm" x="477" y="142" text-anchor="middle">9</text><rect x="500" y="88" width="46" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="523" y="142" text-anchor="middle">10</text><rect x="546" y="88" width="46" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="569" y="142" text-anchor="middle">11</text><rect x="592" y="88" width="46" height="40" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink2 sm" x="615" y="142" text-anchor="middle">12</text><rect x="638" y="88" width="46" height="40" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.9"/><text class="ink2 sm" x="661" y="142" text-anchor="middle">13</text><text class="ink2 sm" x="40" y="74" text-anchor="start">주황 칸이 반례 — P(n) 이 거짓인 n. 아직 어디에 있는지 모른다</text><circle cx="385" cy="108" r="25" fill="none" stroke="var(--s2)" stroke-width="2.4"/><text class="bold sm" x="385" y="54" text-anchor="middle">가장 작은 반례 c</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M385 60 L385 82"/><rect x="40" y="154" width="322" height="26" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.4"/><text class="ink sm" x="201" y="172" text-anchor="middle">c 보다 작은 n 에서는 P(n) 이 참이다</text><text class="ink2 sm" x="376" y="172" text-anchor="start">여기가 쓸 수 있는 정보다</text><path d="M385 204 C 385 240 130 240 130 210" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink bold sm" x="395" y="250" text-anchor="start">c 에서 출발해 c 보다 작은 반례를 만들어 낸다</text><text class="ink2 sm" x="395" y="270" text-anchor="start">그런 것이 있으면 c 가 가장 작다는 데 어긋난다 — 모순</text><path d="M20 306 L760 306" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="330" text-anchor="start">결론은 ‘반례 집합이 비어 있다’ 다. 반례를 하나 찾아 없애는 것이 아니라, 최소 반례가 있을 수 없다는 것을 보인다</text>
</svg>