<text class="ink bold sm" x="20" y="24" text-anchor="start">반정수 x 를 고르고, 엿본 수 T 가 x 보다 크면 ‘이것이 큰 쪽’, 작으면 ‘다른 쪽이 큰 쪽’ 이라 답한다</text><path d="M62 163 L222 103" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 103 L390 88" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 103 L390 118" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 163 L222 163" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 163 L390 148" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 163 L390 178" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 163 L222 223" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 223 L390 208" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 223 L390 238" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="142" y="128" text-anchor="middle">L/n</text><text class="ink sm" x="226" y="95" text-anchor="middle">너무 작다</text><text class="ink2 sm" x="310" y="90.5" text-anchor="middle">1/2</text><text class="ink2 sm" x="310" y="105.5" text-anchor="middle">1/2</text><text class="ink2 sm" x="142" y="158" text-anchor="middle">(H−L)/n</text><text class="ink sm" x="226" y="155" text-anchor="middle">두 수 사이</text><text class="ink2 sm" x="310" y="150.5" text-anchor="middle">1/2</text><text class="ink2 sm" x="310" y="165.5" text-anchor="middle">1/2</text><text class="ink2 sm" x="142" y="188" text-anchor="middle">(n−H)/n</text><text class="ink sm" x="226" y="215" text-anchor="middle">너무 크다</text><text class="ink2 sm" x="310" y="210.5" text-anchor="middle">1/2</text><text class="ink2 sm" x="310" y="225.5" text-anchor="middle">1/2</text><circle cx="394" cy="88" r="3.5" fill="var(--s2)"/><circle cx="394" cy="118" r="3.5" fill="var(--s1)"/><circle cx="226" cy="103" r="3" fill="var(--ink2)"/><circle cx="394" cy="148" r="3.5" fill="var(--s2)"/><circle cx="394" cy="178" r="3.5" fill="var(--s2)"/><circle cx="226" cy="163" r="3" fill="var(--ink2)"/><circle cx="394" cy="208" r="3.5" fill="var(--s1)"/><circle cx="394" cy="238" r="3.5" fill="var(--s2)"/><circle cx="226" cy="223" r="3" fill="var(--ink2)"/><circle cx="58" cy="163" r="3" fill="var(--ink2)"/><text class="ink2 sm" x="58" y="60" text-anchor="middle">x 를 고른다</text><text class="ink2 sm" x="226" y="60" text-anchor="middle">x 는 어디에 떨어졌나</text><text class="ink bold sm" x="430" y="92" text-anchor="middle">T = H</text><text class="ink sm" x="430" y="122" text-anchor="middle">T = L</text><text class="ink bold sm" x="430" y="152" text-anchor="middle">T = H</text><text class="ink bold sm" x="430" y="182" text-anchor="middle">T = L</text><text class="ink sm" x="430" y="212" text-anchor="middle">T = H</text><text class="ink bold sm" x="430" y="242" text-anchor="middle">T = L</text><text class="ink2 sm" x="430" y="60" text-anchor="middle">엿본 수</text><text class="ink bold sm" x="508" y="92" text-anchor="middle">이긴다</text><text class="ink sm" x="508" y="122" text-anchor="middle">진다</text><text class="ink bold sm" x="508" y="152" text-anchor="middle">이긴다</text><text class="ink bold sm" x="508" y="182" text-anchor="middle">이긴다</text><text class="ink sm" x="508" y="212" text-anchor="middle">진다</text><text class="ink bold sm" x="508" y="242" text-anchor="middle">이긴다</text><text class="ink2 sm" x="508" y="60" text-anchor="middle">결과</text><text class="ink bold sm" x="596" y="92" text-anchor="middle">L/2n</text><text class="ink sm" x="596" y="122" text-anchor="middle">L/2n</text><text class="ink bold sm" x="596" y="152" text-anchor="middle">(H−L)/2n</text><text class="ink bold sm" x="596" y="182" text-anchor="middle">(H−L)/2n</text><text class="ink sm" x="596" y="212" text-anchor="middle">(n−H)/2n</text><text class="ink bold sm" x="596" y="242" text-anchor="middle">(n−H)/2n</text><text class="ink2 sm" x="596" y="60" text-anchor="middle">확률</text><rect x="30" y="256" width="600" height="58" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text class="ink bold" x="330" y="280" text-anchor="middle">Pr[이긴다] = 1/2 + (H − L)/2n ≥ 1/2 + 1/2n</text><text class="ink2 sm" x="330" y="302" text-anchor="middle">x 가 두 수 사이에 떨어지면 반드시 이기고, 아니면 반반이다 — 손해가 없는 도박이다</text>
</svg>