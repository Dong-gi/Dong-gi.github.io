<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">나눗셈 정리에서 몫과 나머지</title><desc id="d">수직선 위에 7 의 배수를 표시하고, 25 와 -11 에 대해 몫과 나머지를 읽어내는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="26" text-anchor="middle">나눗셈 정리 — 어떤 정수 n 도 7 의 배수 하나와 0 이상 7 미만인 나머지로 딱 한 가지로 갈린다</text><path d="M55 110 L675 110" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 103 L55 117" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="55" y="134" text-anchor="middle">-21</text><path d="M143.57 103 L143.57 117" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="143.57" y="134" text-anchor="middle">-14</text><path d="M232.14 103 L232.14 117" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="232.14" y="134" text-anchor="middle">-7</text><path d="M320.71 103 L320.71 117" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="320.71" y="134" text-anchor="middle">0</text><path d="M409.29 103 L409.29 117" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="409.29" y="134" text-anchor="middle">7</text><path d="M497.86 103 L497.86 117" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="497.86" y="134" text-anchor="middle">14</text><path d="M586.43 103 L586.43 117" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="586.43" y="134" text-anchor="middle">21</text><path d="M675 103 L675 117" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="675" y="134" text-anchor="middle">28</text><path d="M586.43 110 L637.04 110" fill="none" stroke="var(--s2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="637.04" cy="110" r="5.5" fill="var(--s1)"/><text x="647.04" y="98" text-anchor="start" fill="var(--s1)" class="sm bold">n = 25</text><text x="611.73" y="94" text-anchor="middle" fill="var(--s2)" class="sm bold">r = 4</text><text x="586.43" y="152" text-anchor="middle" fill="var(--s2)" class="sm">q · 7 = 21</text><text x="60" y="76" text-anchor="start" fill="var(--ink)" class="sm bold">n 이 양수: 25 = (3) · 7 + 4</text><path d="M55 222 L675 222" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 215 L55 229" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="55" y="246" text-anchor="middle">-21</text><path d="M143.57 215 L143.57 229" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="143.57" y="246" text-anchor="middle">-14</text><path d="M232.14 215 L232.14 229" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="232.14" y="246" text-anchor="middle">-7</text><path d="M320.71 215 L320.71 229" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="320.71" y="246" text-anchor="middle">0</text><path d="M409.29 215 L409.29 229" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="409.29" y="246" text-anchor="middle">7</text><path d="M497.86 215 L497.86 229" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="497.86" y="246" text-anchor="middle">14</text><path d="M586.43 215 L586.43 229" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="586.43" y="246" text-anchor="middle">21</text><path d="M675 215 L675 229" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="675" y="246" text-anchor="middle">28</text><path d="M143.57 222 L181.53 222" fill="none" stroke="var(--s2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="181.53" cy="222" r="5.5" fill="var(--s1)"/><text x="191.53" y="210" text-anchor="start" fill="var(--s1)" class="sm bold">n = -11</text><text x="162.55" y="206" text-anchor="middle" fill="var(--s2)" class="sm bold">r = 3</text><text x="143.57" y="264" text-anchor="middle" fill="var(--s2)" class="sm">q · 7 = -14</text><text x="60" y="188" text-anchor="start" fill="var(--ink)" class="sm bold">n 이 음수: -11 = (-2) · 7 + 3</text><text class="ink2 sm" x="360" y="288" text-anchor="middle">몫 q 는 n 을 넘지 않는 가장 오른쪽 눈금의 번호이므로 ⌊n / 7⌋ 이고, 나머지 r 는 그 눈금에서 오른쪽으로 남은 거리다</text>
</svg>