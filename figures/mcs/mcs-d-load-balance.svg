<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">무작위 부하 분산에 필요한 서버 수</title><desc id="d">서버 수에 따라 어느 서버든 과부하가 될 확률의 체르노프 상한이 지수적으로 줄어드는 것을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">게시글 24000개를 서버 m 대에 무작위로 뿌린다 — 어느 서버든 넘칠 확률의 상한</text><text class="ink2 sm" x="20" y="42" text-anchor="start">막대가 길수록 안전하다. 세로축은 상한이 1 보다 몇 자리 아래인지를 센 것이다</text><path class="gr" d="M100.71 256 V78"/><path class="gr" d="M145.23 256 V78"/><path class="gr" d="M189.74 256 V78"/><path class="gr" d="M234.26 256 V78"/><path class="gr" d="M278.77 256 V78"/><path class="gr" d="M323.29 256 V78"/><path class="gr" d="M74 256 H350"/><path class="gr" d="M74 221.77 H350"/><path class="gr" d="M74 187.54 H350"/><path class="gr" d="M74 153.31 H350"/><path class="gr" d="M74 119.08 H350"/><path class="gr" d="M74 84.85 H350"/><path class="ax" marker-end="url(#ark)" d="M74 256 H360"/><path class="ax" marker-end="url(#ark)" d="M74 256 V68"/><text class="sm ink2" x="100.71" y="271" text-anchor="middle">11</text><text class="sm ink2" x="145.23" y="271" text-anchor="middle">12</text><text class="sm ink2" x="189.74" y="271" text-anchor="middle">13</text><text class="sm ink2" x="234.26" y="271" text-anchor="middle">14</text><text class="sm ink2" x="278.77" y="271" text-anchor="middle">15</text><text class="sm ink2" x="323.29" y="271" text-anchor="middle">16</text><text class="sm ink2" x="68" y="225.77" text-anchor="end">5</text><text class="sm ink2" x="68" y="191.54" text-anchor="end">10</text><text class="sm ink2" x="68" y="157.31" text-anchor="end">15</text><text class="sm ink2" x="68" y="123.08" text-anchor="end">20</text><text class="sm ink2" x="68" y="88.85" text-anchor="end">25</text><text class="sm ink2" x="364" y="260">m</text><text class="sm ink2" x="66" y="70" text-anchor="end">자릿수</text><path class="cv s1" d="M100.71 256 L100.71 255.28"/><circle class="f2" cx="100.71" cy="255.28" r="4"/><path class="cv s1" d="M145.23 256 L145.23 235.46"/><circle class="f2" cx="145.23" cy="235.46" r="4"/><path class="cv s1" d="M189.74 256 L189.74 207.26"/><circle class="f2" cx="189.74" cy="207.26" r="4"/><path class="cv s1" d="M234.26 256 L234.26 173.3"/><circle class="f2" cx="234.26" cy="173.3" r="4"/><path class="cv s1" d="M278.77 256 L278.77 135.37"/><circle class="f2" cx="278.77" cy="135.37" r="4"/><path class="cv s1" d="M323.29 256 L323.29 94.76"/><circle class="f2" cx="323.29" cy="94.76" r="4"/><text class="ink bold sm" x="100.71" y="245.28" text-anchor="middle">0.78</text><text class="ink bold sm" x="145.23" y="225.46" text-anchor="middle">0.001</text><text class="ink bold sm" x="194.19" y="197.26" text-anchor="middle">8 × 10⁻⁸</text><text class="ink2 sm" x="319.29" y="84.76" text-anchor="end">10⁻²⁴ 아래</text><text class="ink bold sm" x="380" y="76" text-anchor="start">왜 10대로는 안 되는가</text><text class="ink2 sm" x="380" y="96" text-anchor="start">일이 24000 × 1/4 = 6000초다.</text><text class="ink2 sm" x="380" y="112" text-anchor="start">10대면 한 대에 정확히 600초 —</text><text class="ink2 sm" x="380" y="128" text-anchor="start">용량과 같으므로 절반쯤 넘친다</text><text class="ink2 sm" x="380" y="154" text-anchor="start">m 대일 때 한 대의 평균은</text><text class="ink bold sm" x="390" y="172" text-anchor="start">6000/m 초이고 c = m/10 이다</text><text class="ink2 sm" x="380" y="196" text-anchor="start">합집합 한계로 m 배 하면</text><text class="ink2 sm" x="390" y="214" text-anchor="start">어느 한 대라도 넘칠 확률</text><text class="ink bold sm" x="380" y="240" text-anchor="start">서버 한 대를 더 놓는 것이</text><text class="ink bold sm" x="380" y="256" text-anchor="start">확률을 세 자리씩 깎는다</text><path d="M20 274 L640 274" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="294" text-anchor="start">11대는 곧 넘치고, 12대는 며칠에 한 번 넘치고, 13대는 수백 년에 한 번 넘친다. 여유 30%가 이만큼을 산다.</text><text class="ink2 sm" x="20" y="314" text-anchor="start">작업의 길이를 하나도 모른 채 무작위로 뿌리기만 했는데도 이런 보장이 나온다는 것이 체르노프 한계의 쓸모다.</text>
</svg>