<text class="ink bold sm" x="20" y="24" text-anchor="start">이상한 주사위 — 마주 보는 면에 같은 수가 적혀 있어 각 수가 나올 확률이 1/3 이다</text><rect x="28" y="46" width="68" height="68" rx="8" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold" x="62" y="68" text-anchor="middle">A</text><text class="ink2 sm" x="62" y="92" text-anchor="middle">2  6  7</text><text class="ink2 sm" x="62" y="108" text-anchor="middle">각 1/3</text><rect x="158" y="46" width="68" height="68" rx="8" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold" x="192" y="68" text-anchor="middle">B</text><text class="ink2 sm" x="192" y="92" text-anchor="middle">1  5  9</text><text class="ink2 sm" x="192" y="108" text-anchor="middle">각 1/3</text><rect x="288" y="46" width="68" height="68" rx="8" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold" x="322" y="68" text-anchor="middle">C</text><text class="ink2 sm" x="322" y="92" text-anchor="middle">3  4  8</text><text class="ink2 sm" x="322" y="108" text-anchor="middle">각 1/3</text><text class="ink2 sm" x="48" y="142" text-anchor="start">A 대 B — 아홉 칸이 각각 1/9</text><text class="ink2 sm" x="50" y="178" text-anchor="end">2</text><text class="ink2 sm" x="77" y="158" text-anchor="middle">1</text><rect x="62" y="164" width="30" height="30" rx="3" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1"/><text class="ink2 sm" x="77" y="183" text-anchor="middle">A</text><rect x="92" y="164" width="30" height="30" rx="3" fill="var(--grid)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="107" y="183" text-anchor="middle">B</text><rect x="122" y="164" width="30" height="30" rx="3" fill="var(--grid)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="137" y="183" text-anchor="middle">B</text><text class="ink2 sm" x="50" y="208" text-anchor="end">6</text><text class="ink2 sm" x="107" y="158" text-anchor="middle">5</text><rect x="62" y="194" width="30" height="30" rx="3" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1"/><text class="ink2 sm" x="77" y="213" text-anchor="middle">A</text><rect x="92" y="194" width="30" height="30" rx="3" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1"/><text class="ink2 sm" x="107" y="213" text-anchor="middle">A</text><rect x="122" y="194" width="30" height="30" rx="3" fill="var(--grid)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="137" y="213" text-anchor="middle">B</text><text class="ink2 sm" x="50" y="238" text-anchor="end">7</text><text class="ink2 sm" x="137" y="158" text-anchor="middle">9</text><rect x="62" y="224" width="30" height="30" rx="3" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1"/><text class="ink2 sm" x="77" y="243" text-anchor="middle">A</text><rect x="92" y="224" width="30" height="30" rx="3" fill="var(--s2)" fill-opacity="0.24" stroke="var(--s2)" stroke-width="1"/><text class="ink2 sm" x="107" y="243" text-anchor="middle">A</text><rect x="122" y="224" width="30" height="30" rx="3" fill="var(--grid)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="137" y="243" text-anchor="middle">B</text><text class="ink bold sm" x="48" y="278" text-anchor="start">A 가 이기는 칸이 다섯 → 5/9</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M346.54 162.17 L376.66 214.1"/><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M367.2 234 L306.8 234"/><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M294.34 215.83 L324.46 163.9"/><circle cx="336" cy="144" r="17" fill="var(--grid)"/><text class="ink bold" x="336" y="149" text-anchor="middle">A</text><circle cx="388.2" cy="234" r="17" fill="var(--grid)"/><text class="ink bold" x="388.2" y="239" text-anchor="middle">B</text><circle cx="283.8" cy="234" r="17" fill="var(--grid)"/><text class="ink bold" x="283.8" y="239" text-anchor="middle">C</text><text class="ink bold sm" x="336" y="316" text-anchor="middle">한 번 굴리면 A 가 B 를, B 가 C 를, C 가 A 를 이긴다</text><text class="ink2 sm" x="336" y="336" text-anchor="middle">어느 것을 골라도 상대가 이길 주사위를 남겨 둘 수 있다</text><rect x="506" y="156" width="164" height="110" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="588" y="175" text-anchor="middle">두 번 굴리면</text><text class="sm bold" x="588" y="200" text-anchor="middle">뒤집힌다</text><text class="ink2 sm" x="588" y="226" text-anchor="middle">B 가 A 를 이긴다</text><text class="ink2 sm" x="588" y="248" text-anchor="middle">42/81 대 37/81</text><path d="M20 348 L670 348" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="368" text-anchor="start">‘더 자주 이긴다’ 는 관계는 추이적이지 않다 — 12장의 부분순서가 되지 못한다는 뜻이다.</text>
</svg>