<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">모자 되돌려주기와 기댓값의 선형성</title><desc id="d">다섯 사람이 모자를 무작위로 받는 그림과, 지시확률변수의 합으로 기댓값이 1 임을 얻는 계산</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">어려운 확률변수를 지시확률변수의 합으로 쪼갠다 — 선형성은 독립을 요구하지 않는다</text><rect x="50" y="66" width="46" height="26" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="73" y="84" text-anchor="middle">1번</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M100 79 L146 79"/><rect x="150" y="66" width="52" height="26" rx="3" fill="none" fill-opacity="0.2" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="176" y="84" text-anchor="middle">모자 3</text><text class="ink2 sm" x="214" y="84" text-anchor="start">G<tspan baseline-shift="-22%" font-size="76%">1</tspan> = 0</text><rect x="50" y="100" width="46" height="26" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="73" y="118" text-anchor="middle">2번</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M100 113 L146 113"/><rect x="150" y="100" width="52" height="26" rx="3" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="176" y="118" text-anchor="middle">모자 2</text><text class="ink bold sm" x="214" y="118" text-anchor="start">G<tspan baseline-shift="-22%" font-size="76%">2</tspan> = 1</text><rect x="50" y="134" width="46" height="26" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="73" y="152" text-anchor="middle">3번</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M100 147 L146 147"/><rect x="150" y="134" width="52" height="26" rx="3" fill="none" fill-opacity="0.2" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="176" y="152" text-anchor="middle">모자 5</text><text class="ink2 sm" x="214" y="152" text-anchor="start">G<tspan baseline-shift="-22%" font-size="76%">3</tspan> = 0</text><rect x="50" y="168" width="46" height="26" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="73" y="186" text-anchor="middle">4번</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M100 181 L146 181"/><rect x="150" y="168" width="52" height="26" rx="3" fill="none" fill-opacity="0.2" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="176" y="186" text-anchor="middle">모자 1</text><text class="ink2 sm" x="214" y="186" text-anchor="start">G<tspan baseline-shift="-22%" font-size="76%">4</tspan> = 0</text><rect x="50" y="202" width="46" height="26" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="73" y="220" text-anchor="middle">5번</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M100 215 L146 215"/><rect x="150" y="202" width="52" height="26" rx="3" fill="none" fill-opacity="0.2" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="176" y="220" text-anchor="middle">모자 4</text><text class="ink2 sm" x="214" y="220" text-anchor="start">G<tspan baseline-shift="-22%" font-size="76%">5</tspan> = 0</text><text class="ink2 sm" x="50" y="252" text-anchor="start">G = G<tspan baseline-shift="-22%" font-size="76%">1</tspan> + G<tspan baseline-shift="-22%" font-size="76%">2</tspan> + ⋯ + G<tspan baseline-shift="-22%" font-size="76%">n</tspan> — 이 경우 G = 1</text><rect x="330" y="60" width="300" height="92" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="480" y="79" text-anchor="middle">G<tspan baseline-shift="-22%" font-size="76%">i</tspan> 들은 독립이 아니다</text><text class="ink2 sm" x="344" y="100" text-anchor="start">n−1 명이 제 모자를 받으면 마지막 사람도</text><text class="ink2 sm" x="344" y="120" text-anchor="start">반드시 제 모자를 받는다.</text><text class="ink bold sm" x="344" y="142" text-anchor="start">그래도 선형성은 그대로 쓸 수 있다</text><rect x="330" y="166" width="300" height="116" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="480" y="192" text-anchor="middle">Ex[G<tspan baseline-shift="-22%" font-size="76%">i</tspan>] = Pr[G<tspan baseline-shift="-22%" font-size="76%">i</tspan> = 1] = 1/n</text><text class="bold" x="480" y="220" text-anchor="middle">Ex[G] = n · (1/n) = 1</text><text class="ink2 sm" x="480" y="248" text-anchor="middle">사람이 몇 명이든 평균 한 사람이</text><text class="ink2 sm" x="480" y="268" text-anchor="middle">제 모자를 돌려받는다</text><path d="M20 298 L640 298" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="316" text-anchor="start">G 의 분포는 계산하지 않았다. 알아낸 것은 각 지시변수의 확률 하나뿐이고 그것으로 충분했다.</text>
</svg>