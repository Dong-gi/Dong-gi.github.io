hor="start">체비쇼프는 Pr[|R − μ| ≥ cσ] ≤ 1/c² 만 말한다. 실제 꼬리는 그보다 훨씬 얇다.</text><text class="ink2 sm" x="24" y="282" text-anchor="start">c</text><text class="ink2 sm" x="90" y="282" text-anchor="start">체비쇼프 1/c²</text><text class="ink2 sm" x="230" y="282" text-anchor="start">실제 확률</text><text class="ink2 sm" x="350" y="282" text-anchor="start">몇 배 느슨한가</text><text class="ink sm" x="24" y="300" text-anchor="start">1</text><text class="ink sm" x="90" y="300" text-anchor="start">1</text><text class="ink sm" x="230" y="300" text-anchor="start">0.368</text><text x="350" y="300" text-anchor="start" fill="var(--s2)" class="sm" font-weight="600">약 3배</text><text class="ink sm" x="24" y="316" text-anchor="start">2</text><text class="ink sm" x="90" y="316" text-anchor="start">0.25</text><text class="ink sm" x="230" y="316" text-anchor="start">0.0569</text><text x="350" y="316" text-anchor="start" fill="var(--s2)" class="sm" font-weight="600">약 4배</text><text class="ink sm" x="24" y="332" text-anchor="start">3</text><text class="ink sm" x="90" y="332" text-anchor="start">0.111</text><text class="ink sm" x="230" y="332" text-anchor="start">0.00352</text><text x="350" y="332" text-anchor="start" fill="var(--s2)" class="sm" font-weight="600">약 32배</text><text class="ink2 sm" x="470" y="300" text-anchor="start">c = 1 에서는 아무것도</text><text class="ink2 sm" x="470" y="316" text-anchor="start">보장하지 못한다(1/1² = 1)</text><text class="ink bold sm" x="470" y="332" text-anchor="start">그래도 어떤 분포에나 통한다</text>
