<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">평면 그림의 면과 이산면</title><desc id="d">정점 4개 간선 6개인 평면 그림의 네 면에 번호를 붙이고 각 면의 경계 닫힌 보행을 표로 적은 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">면 — 곡선이 평면을 나누어 만드는 조각. 그 경계를 닫힌 보행으로 적은 것이 이산면이다</text><path d="M192.98 93.26 L117.02 236.74" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 250 L275 250" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M282.98 236.74 L207.02 93.26" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 95 L200 171" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M122.22 241.31 L187.78 194.69" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M277.78 241.31 L212.22 194.69" fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="170" text-anchor="middle" fill="var(--s1)" class="sm bold">I</text><text x="200" y="232" text-anchor="middle" fill="var(--s1)" class="sm bold">II</text><text x="234" y="170" text-anchor="middle" fill="var(--s1)" class="sm bold">III</text><text x="60" y="106" text-anchor="start" fill="var(--s2)" class="sm bold">IV — 바깥면</text><circle cx="200" cy="80" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="200" y="84" text-anchor="middle" fill="var(--ink)" class="sm">a</text><circle cx="110" cy="250" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="110" y="254" text-anchor="middle" fill="var(--ink)" class="sm">b</text><circle cx="290" cy="250" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="290" y="254" text-anchor="middle" fill="var(--ink)" class="sm">c</text><circle cx="200" cy="186" r="15" fill="var(--s3)" fill-opacity="0.22" stroke="var(--s3)" stroke-width="1.6"/><text x="200" y="190" text-anchor="middle" fill="var(--ink)" class="sm">d</text><rect x="360" y="46" width="340" height="226" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="530" y="65" text-anchor="middle">이산면 네 개</text><text class="ink2 sm" x="530" y="81" text-anchor="middle">각 면의 경계를 정점 수열로 적었다</text><text class="ink bold sm" x="423" y="100" text-anchor="middle">면</text><text class="ink bold sm" x="520" y="100" text-anchor="middle">경계 닫힌 보행</text><text class="ink bold sm" x="620" y="100" text-anchor="middle">길이</text><path d="M400 108 L646 108" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="423" y="126" text-anchor="middle">I</text><text class="ink sm" x="520" y="126" text-anchor="middle">a b d a</text><text class="ink sm" x="620" y="126" text-anchor="middle">3</text><path d="M400 134 L646 134" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="423" y="152" text-anchor="middle">II</text><text class="ink sm" x="520" y="152" text-anchor="middle">b c d b</text><text class="ink sm" x="620" y="152" text-anchor="middle">3</text><path d="M400 160 L646 160" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="423" y="178" text-anchor="middle">III</text><text class="ink sm" x="520" y="178" text-anchor="middle">a d c a</text><text class="ink sm" x="620" y="178" text-anchor="middle">3</text><path d="M400 186 L646 186" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="423" y="204" text-anchor="middle">IV</text><text class="ink sm" x="520" y="204" text-anchor="middle">a b c a</text><text class="ink sm" x="620" y="204" text-anchor="middle">3</text><rect x="400" y="82" width="246" height="130" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text x="400" y="236" text-anchor="start" fill="var(--ink)" class="sm bold">v − e + f = 4 − 6 + 4 = 2</text><text x="400" y="258" text-anchor="start" fill="var(--s2)" class="sm">간선마다 경계에 정확히 두 번 나온다</text><text class="ink2 sm" x="360" y="300" text-anchor="middle">바깥면도 다른 면과 다를 것이 없다. 구 위에 그린 뒤 어느 면을 뚫어 펼치는지에 따라 어느 면이든 바깥이 된다</text><text class="ink2 sm" x="360" y="320" text-anchor="middle">그래서 평면 배치에는 바깥면이라는 것이 아예 없다. 이산면들의 모음만 있다</text>
</svg>