<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 336" width="780" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">함의의 진리표 네 줄과 그 이유</title><desc id="d">P 이면 Q 의 진리표에서 거짓인 줄이 참-거짓 한 줄뿐임을 보이고, 시스템 명세를 한 식으로 묶는 데 그 규칙이 쓰이는 것을 설명한 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">거짓이 되는 줄은 하나뿐이다</text><rect x="180" y="50" width="78" height="150" rx="2" fill="var(--s1)" fill-opacity="0.14" stroke="none" stroke-width="1.3"/><text class="ink bold sm" x="63" y="68" text-anchor="middle">P</text><text class="ink bold sm" x="141" y="68" text-anchor="middle">Q</text><text class="ink bold sm" x="219" y="68" text-anchor="middle">P → Q</text><text class="ink bold sm" x="297" y="68" text-anchor="middle">줄 이름</text><path d="M24 80 L336 80" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s3)" x="63" y="102" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="141" y="102" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="219" y="102" text-anchor="middle">T</text><text class="sm" fill="var(--ink)" x="297" y="102" text-anchor="middle">(참참)</text><path d="M24 110 L336 110" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s3)" x="63" y="132" text-anchor="middle">T</text><text class="sm" fill="var(--s2)" x="141" y="132" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="219" y="132" text-anchor="middle">F</text><text class="sm" fill="var(--ink)" x="297" y="132" text-anchor="middle">(참거)</text><path d="M24 140 L336 140" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s2)" x="63" y="162" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="141" y="162" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="219" y="162" text-anchor="middle">T</text><text class="sm" fill="var(--ink)" x="297" y="162" text-anchor="middle">(거참)</text><path d="M24 170 L336 170" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s2)" x="63" y="192" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="141" y="192" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="219" y="192" text-anchor="middle">T</text><text class="sm" fill="var(--ink)" x="297" y="192" text-anchor="middle">(거거)</text><rect x="24" y="50" width="312" height="150" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="24" y="110" width="312" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="2.2"/><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M370 125 L322 125"/><text class="ink bold sm" x="378" y="129" text-anchor="start">약속을 어긴 유일한 줄</text><text class="ink2 sm" x="378" y="84" text-anchor="start">가정이 참이고 결론도 참 — 지켰다</text><text class="ink2 sm" x="378" y="174" text-anchor="start">가정이 거짓이면 어겼다고 할 수 없으니</text><text class="ink2 sm" x="378" y="194" text-anchor="start">아래 두 줄은 자동으로 참이다</text><path d="M24 212 L756 212" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="24" y="236" text-anchor="start">왜 이렇게 정하는가 — 명세 열두 줄을 하나의 식으로 묶고 싶기 때문이다</text><text class="ink sm" x="24" y="258" text-anchor="start">(C₁ → A₁) ∧ (C₂ → A₂) ∧ … ∧ (C₁₂ → A₁₂)</text><text class="ink2 sm" x="24" y="280" text-anchor="start">조건 C₂ 와 C₅ 만 성립하고 시스템이 A₂ 와 A₅ 만 했다면, 명세를 지킨 것이다.</text><text class="ink2 sm" x="24" y="300" text-anchor="start">그러려면 조건이 성립하지 않은 열 개의 함의가 모두 참이어야 한다. 위의 아래 두 줄이 그 일을 한다</text><text class="ink2 sm" x="24" y="326" text-anchor="start">인과관계는 없다. ‘돼지가 날면 계정이 털리지 않는다’ 도 수학적으로는 참인 함의다</text>
</svg>