<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 344" width="780" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">귀납법의 사슬과, 화살표 하나가 빠진 사슬</title><desc id="d">위쪽은 P(0) 에서 시작해 화살표로 이어지는 온전한 사슬, 아래쪽은 P(1) 에서 P(2) 로 가는 화살표가 빠져 그 뒤가 모두 근거를 잃은 사슬</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">귀납법은 첫 칸 하나와 다리 하나로 무한히 많은 칸을 채운다</text><text class="ink2 sm" x="36" y="50" text-anchor="start">온전한 귀납 증명</text><rect x="36" y="62" width="74" height="40" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="73" y="88" text-anchor="middle">P(0)</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M114 82 L130 82"/><rect x="136" y="62" width="74" height="40" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="173" y="88" text-anchor="middle">P(1)</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M214 82 L230 82"/><rect x="236" y="62" width="74" height="40" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="273" y="88" text-anchor="middle">P(2)</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M314 82 L330 82"/><rect x="336" y="62" width="74" height="40" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="373" y="88" text-anchor="middle">P(3)</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M414 82 L430 82"/><rect x="436" y="62" width="74" height="40" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="473" y="88" text-anchor="middle">P(4)</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M514 82 L530 82"/><rect x="536" y="62" width="74" height="40" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="573" y="88" text-anchor="middle">P(5)</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M614 82 L630 82"/><rect x="636" y="62" width="74" height="40" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="673" y="88" text-anchor="middle">P(n) …</text><circle cx="73" cy="82" r="30" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="sm bold" fill="var(--s1)" x="73" y="136" text-anchor="middle">기저 단계</text><text class="ink2 sm" x="188" y="136" text-anchor="start">귀납 단계 — 화살표 하나를 모든 n 에 대해 한꺼번에 증명한다</text><text class="ink2 sm" x="36" y="190" text-anchor="start">화살표 하나가 빠지면 그 뒤 전부가 무너진다 (말 색깔 가짜 증명이 이 모양이다)</text><rect x="36" y="202" width="74" height="40" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="73" y="228" text-anchor="middle">P(0)</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M114 222 L130 222"/><rect x="136" y="202" width="74" height="40" rx="4" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.8"/><text class="ink bold sm" x="173" y="228" text-anchor="middle">P(1)</text><path d="M215 214 L231 230" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 230 L231 214" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="236" y="202" width="74" height="40" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.8" stroke-dasharray="5 4"/><text class="ink bold sm" x="273" y="228" text-anchor="middle">P(2)</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M314 222 L330 222"/><rect x="336" y="202" width="74" height="40" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.8" stroke-dasharray="5 4"/><text class="ink bold sm" x="373" y="228" text-anchor="middle">P(3)</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M414 222 L430 222"/><rect x="436" y="202" width="74" height="40" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.8" stroke-dasharray="5 4"/><text class="ink bold sm" x="473" y="228" text-anchor="middle">P(4)</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M514 222 L530 222"/><rect x="536" y="202" width="74" height="40" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.8" stroke-dasharray="5 4"/><text class="ink bold sm" x="573" y="228" text-anchor="middle">P(5)</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M614 222 L630 222"/><rect x="636" y="202" width="74" height="40" rx="4" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.8" stroke-dasharray="5 4"/><text class="ink bold sm" x="673" y="228" text-anchor="middle">P(n) …</text><text class="sm bold" fill="var(--s2)" x="186" y="274" text-anchor="start">P(1) → P(2) 만 증명되지 않았다</text><text class="ink2 sm" x="42" y="300" text-anchor="start">이 자리 하나가 비면 P(2) 부터는 아무 근거가 없다. 다른 화살표를 아무리 많이 증명해도 소용없다.</text><text class="ink2 sm" x="42" y="320" text-anchor="start">그래서 귀납 단계의 논증이 정말 모든 n 에서 통하는지 — 특히 가장 작은 n 에서 — 확인하는 일이 증명의 일부다</text>
</svg>