<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">불량 짝과 안정한 짝짓기</title><desc id="d">남자 둘과 여자 둘의 선호를 순위로 적고, 서로를 배우자보다 좋아하는 불량 짝이 생기는 짝짓기와 그렇지 않은 안정한 짝짓기를 나란히 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">불량 짝은 서로를 배우자보다 좋아하는 한 쌍이다 — 그런 쌍이 없으면 안정하다</text><rect x="20" y="48" width="236" height="230" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="138" y="68" text-anchor="middle">선호 (선분에 적힌 수가 순위)</text><text class="ink2 sm" x="36" y="90" text-anchor="start">남자 둘은 모두 A 를 1순위로,</text><text class="ink2 sm" x="36" y="108" text-anchor="start">여자 둘은 모두 갑 을 1순위로 둔다</text><rect x="44" y="128" width="44" height="30" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="66" y="148" text-anchor="middle">갑</text><rect x="178" y="128" width="44" height="30" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="200" y="148" text-anchor="middle">A</text><rect x="44" y="184" width="44" height="30" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="66" y="204" text-anchor="middle">을</text><rect x="178" y="184" width="44" height="30" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="200" y="204" text-anchor="middle">B</text><path d="M90 144 L176 144" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="107.2" y="139" text-anchor="middle">1</text><text class="ink2 sm" x="158.8" y="139" text-anchor="middle">1</text><path d="M90 144 L176 200" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="107.2" y="150.2" text-anchor="middle">2</text><text class="ink2 sm" x="158.8" y="183.8" text-anchor="middle">2</text><path d="M90 200 L176 144" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="107.2" y="183.8" text-anchor="middle">1</text><text class="ink2 sm" x="158.8" y="150.2" text-anchor="middle">2</text><path d="M90 200 L176 200" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="107.2" y="195" text-anchor="middle">2</text><text class="ink2 sm" x="158.8" y="195" text-anchor="middle">1</text><rect x="272" y="48" width="236" height="230" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="390" y="68" text-anchor="middle">불안정한 짝짓기</text><text class="ink2 sm" x="390" y="84" text-anchor="middle">갑 −B, 을 −A</text><rect x="316" y="128" width="44" height="30" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="338" y="148" text-anchor="middle">갑</text><rect x="450" y="128" width="44" height="30" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="472" y="148" text-anchor="middle">A</text><rect x="316" y="184" width="44" height="30" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="338" y="204" text-anchor="middle">을</text><rect x="450" y="184" width="44" height="30" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="472" y="204" text-anchor="middle">B</text><path d="M362 144 L448 200" fill="none" stroke="var(--ink2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M362 200 L448 144" fill="none" stroke="var(--ink2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M362 144 L450 144" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text class="sm bold" fill="var(--s2)" x="390" y="118" text-anchor="middle">갑 과 A 가 불량 짝</text><text class="ink2 sm" x="288" y="258" text-anchor="start">둘 다 서로를 배우자보다 좋아한다</text><rect x="524" y="48" width="236" height="230" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="642" y="68" text-anchor="middle">안정한 짝짓기</text><text class="ink2 sm" x="642" y="84" text-anchor="middle">갑 −A, 을 −B</text><rect x="568" y="128" width="44" height="30" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="590" y="148" text-anchor="middle">갑</text><rect x="702" y="128" width="44" height="30" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="724" y="148" text-anchor="middle">A</text><rect x="568" y="184" width="44" height="30" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="590" y="204" text-anchor="middle">을</text><rect x="702" y="184" width="44" height="30" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="724" y="204" text-anchor="middle">B</text><path d="M614 144 L700 144" fill="none" stroke="var(--ink2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M614 200 L700 200" fill="none" stroke="var(--ink2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="540" y="258" text-anchor="start">갑 과 A 는 1순위끼리라 흔들리지 않는다</text><text class="ink2 sm" x="24" y="302" text-anchor="start">을 과 B 는 둘 다 상대를 2순위로 여기지만 그것은 문제가 아니다. 불량 짝이 되려면 ‘서로’ 를 배우자보다 좋아해야 한다</text>
</svg>