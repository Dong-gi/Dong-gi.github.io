<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 286" width="720" height="286" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">인접한 두 정점을 합치기</title><desc id="d">인접한 두 정점을 하나로 합치면 두 정점의 이웃을 모두 갖는 새 정점이 되고 평면성이 유지되는 것을 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">인접한 두 정점 합치기 — 평면성이 유지된다. 5색 정리에서 이것을 쓴다</text><rect x="20" y="40" width="300" height="196" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="170" y="59" text-anchor="middle">합치기 전</text><text class="ink2 sm" x="170" y="75" text-anchor="middle">n<tspan baseline-shift="-22%" font-size="76%">1</tspan> 과 n<tspan baseline-shift="-22%" font-size="76%">2</tspan> 는 인접하다</text><path d="M142.86 129.72 L207.14 168.28" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.67 133.75 L85.33 178.25" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M144.06 116.78 L185.94 101.22" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M216.36 161.45 L203.64 110.55" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M230.8 165.59 L265.2 132.41" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="130" cy="122" r="15" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="130" y="126" text-anchor="middle" fill="var(--ink)" class="sm">n<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><circle cx="220" cy="176" r="15" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="220" y="180" text-anchor="middle" fill="var(--ink)" class="sm">n<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><circle cx="76" cy="190" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="76" y="194" text-anchor="middle" fill="var(--ink)" class="sm">u</text><circle cx="200" cy="96" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="200" y="100" text-anchor="middle" fill="var(--ink)" class="sm">v</text><circle cx="276" cy="122" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="276" y="126" text-anchor="middle" fill="var(--ink)" class="sm">w</text><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M340 140 L390 140"/><rect x="410" y="40" width="290" height="196" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="555" y="59" text-anchor="middle">합친 뒤</text><text class="ink2 sm" x="555" y="75" text-anchor="middle">m 은 두 정점의 이웃을 모두 갖는다</text><path d="M528.16 149.21 L479.84 186.79" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 125 L540 111" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M554.46 144 L619.54 162" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="540" cy="140" r="15" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="540" y="144" text-anchor="middle" fill="var(--ink)" class="sm">m</text><circle cx="468" cy="196" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="468" y="200" text-anchor="middle" fill="var(--ink)" class="sm">u</text><circle cx="540" cy="96" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="540" y="100" text-anchor="middle" fill="var(--ink)" class="sm">v</text><circle cx="634" cy="166" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="634" y="170" text-anchor="middle" fill="var(--ink)" class="sm">w</text><text x="420" y="224" text-anchor="start" fill="var(--s1)" class="sm">v 로 가던 간선 두 개가 하나가 되었다</text><text class="ink2 sm" x="360" y="260" text-anchor="middle">두 정점이 인접하므로 그 간선을 따라 한쪽을 다른 쪽으로 끌어당기면 된다. 새로 엇갈리는 선은 생기지 않는다</text><text class="ink2 sm" x="360" y="280" text-anchor="middle">합친 뒤 정점이 하나 줄어들므로 정점 수에 대한 귀납법에서 귀납 가정을 쓸 수 있게 된다</text>
</svg>