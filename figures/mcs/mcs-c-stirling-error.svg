<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 316" width="780" height="316" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">스털링 근사의 상대 오차</title><desc id="d">n 이 1 일 때 약 8퍼센트, 10 일 때 1퍼센트 아래로 줄어드는 상대 오차 막대와 오차항의 정확한 범위</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">스털링 근사는 n 이 작아도 이미 잘 맞는다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M66 240 L458 240"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M66 240 L66 50"/><path d="M87.92 240 L87.92 244" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="87.92" y="257" text-anchor="middle">1</text><path d="M124.46 240 L124.46 244" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="124.46" y="257" text-anchor="middle">2</text><path d="M197.54 240 L197.54 244" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="197.54" y="257" text-anchor="middle">4</text><path d="M270.62 240 L270.62 244" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="270.62" y="257" text-anchor="middle">6</text><path d="M343.69 240 L343.69 244" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="343.69" y="257" text-anchor="middle">8</text><path d="M416.77 240 L416.77 244" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="416.77" y="257" text-anchor="middle">10</text><path d="M62 240 L66 240" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="58" y="244" text-anchor="end">0</text><path d="M62 202.13 L66 202.13" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="58" y="206.13" text-anchor="end">2</text><path d="M62 164.26 L66 164.26" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="58" y="168.26" text-anchor="end">4</text><path d="M62 126.38 L66 126.38" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="58" y="130.38" text-anchor="end">6</text><path d="M62 88.51 L66 88.51" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="58" y="92.51" text-anchor="end">8</text><text class="ink2 sm" x="462" y="245" text-anchor="start">n</text><text class="ink2 sm" x="72" y="46" text-anchor="start">오차(%)</text><rect x="77.92" y="80.11" width="20" height="159.89" rx="1" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="1.3"/><text class="ink bold sm" x="101.92" y="76.11" text-anchor="start">8.44%</text><rect x="114.46" y="160.08" width="20" height="79.92" rx="1" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="1.3"/><rect x="151" y="186.86" width="20" height="53.14" rx="1" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="1.3"/><rect x="187.54" y="200.22" width="20" height="39.78" rx="1" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="1.3"/><rect x="224.08" y="208.22" width="20" height="31.78" rx="1" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="1.3"/><rect x="260.62" y="213.54" width="20" height="26.46" rx="1" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="1.3"/><rect x="297.15" y="217.34" width="20" height="22.66" rx="1" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="1.3"/><rect x="333.69" y="220.18" width="20" height="19.82" rx="1" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="1.3"/><rect x="370.23" y="222.39" width="20" height="17.61" rx="1" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="1.3"/><rect x="406.77" y="224.16" width="20" height="15.84" rx="1" fill="var(--s1)" fill-opacity="0.55" stroke="none" stroke-width="1.3"/><text class="ink bold sm" x="416.77" y="214.16" text-anchor="middle">0.84%</text><path d="M66 221.06 L446 221.06" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 sm" x="460" y="225.06" text-anchor="start">1%</text><rect x="486" y="62" width="272" height="178" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="622" y="82" text-anchor="middle">오차의 정체</text><text class="ink2 sm" x="622" y="98" text-anchor="middle">n! = √(2πn) (n/e)ⁿ · e^ε(n)</text><text class="ink bold sm" x="504" y="116" text-anchor="start">1/(12n + 1) ≤ ε(n) ≤ 1/(12n)</text><text class="ink2 sm" x="504" y="142" text-anchor="start">ε(n) 이 늘 양수이므로</text><text class="ink sm" x="504" y="162" text-anchor="start">n! 은 언제나 √(2πn)(n/e)ⁿ 보다 크다</text><path d="M504 178 L740 178" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="504" y="200" text-anchor="start">ε(n) → 0 이므로</text><text class="ink bold sm" x="504" y="220" text-anchor="start">n! ∼ √(2πn)(n/e)ⁿ</text><text class="ink2 sm" x="24" y="278" text-anchor="start">적분 한계만으로는 n 배까지 벌어지는 상하한밖에 얻지 못했다. 스털링 공식은 그 틈을 백분율 단위로 좁힌다</text><text class="ink2 sm" x="24" y="300" text-anchor="start">놀라운 것은 정수만 곱해 만든 n! 의 근사식에 π 와 e 가 함께 나온다는 점이다</text>
</svg>