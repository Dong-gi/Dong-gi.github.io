<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">공정한 게임에서 자본에 따른 파산 확률</title><desc id="d">목표가 600 일 때 초기 자본 n 에 대한 승률이 정확히 n/600 인 직선임을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">공정한 게임(p = 1/2)에서 목표가 T = 600 일 때 초기 자본에 따른 승률</text><text class="ink2 sm" x="20" y="42" text-anchor="start">가로축은 초기 자본 n 이다</text><path class="gr" d="M70 250 V74"/><path class="gr" d="M119.33 250 V74"/><path class="gr" d="M218 250 V74"/><path class="gr" d="M316.67 250 V74"/><path class="gr" d="M366 250 V74"/><path class="gr" d="M70 250 H366"/><path class="gr" d="M70 206 H366"/><path class="gr" d="M70 162 H366"/><path class="gr" d="M70 118 H366"/><path class="gr" d="M70 74 H366"/><path class="ax" marker-end="url(#ark)" d="M70 250 H376"/><path class="ax" marker-end="url(#ark)" d="M70 250 V64"/><text class="sm ink2" x="119.33" y="265" text-anchor="middle">100</text><text class="sm ink2" x="218" y="265" text-anchor="middle">300</text><text class="sm ink2" x="316.67" y="265" text-anchor="middle">500</text><text class="sm ink2" x="366" y="265" text-anchor="middle">600</text><text class="sm ink2" x="64" y="210" text-anchor="end">0.25</text><text class="sm ink2" x="64" y="166" text-anchor="end">0.5</text><text class="sm ink2" x="64" y="122" text-anchor="end">0.75</text><text class="sm ink2" x="64" y="78" text-anchor="end">1</text><text class="sm ink2" x="380" y="254">n</text><text class="sm ink2" x="70" y="56" text-anchor="middle">Pr[목표 도달]</text><path class="cv s1" d="M70 250 L72.47 248.53 L74.93 247.07 L77.4 245.6 L79.87 244.13 L82.33 242.67 L84.8 241.2 L87.27 239.73 L89.73 238.27 L92.2 236.8 L94.67 235.33 L97.13 233.87 L99.6 232.4 L102.07 230.93 L104.53 229.47 L107 228 L109.47 226.53 L111.93 225.07 L114.4 223.6 L116.87 222.13 L119.33 220.67 L121.8 219.2 L124.27 217.73 L126.73 216.27 L129.2 214.8 L131.67 213.33 L134.13 211.87 L136.6 210.4 L139.07 208.93 L141.53 207.47 L144 206 L146.47 204.53 L148.93 203.07 L151.4 201.6 L153.87 200.13 L156.33 198.67 L158.8 197.2 L161.27 195.73 L163.73 194.27 L166.2 192.8 L168.67 191.33 L171.13 189.87 L173.6 188.4 L176.07 186.93 L178.53 185.47 L181 184 L183.47 182.53 L185.93 181.07 L188.4 179.6 L190.87 178.13 L193.33 176.67 L195.8 175.2 L198.27 173.73 L200.73 172.27 L203.2 170.8 L205.67 169.33 L208.13 167.87 L210.6 166.4 L213.07 164.93 L215.53 163.47 L218 162 L220.47 160.53 L222.93 159.07 L225.4 157.6 L227.87 156.13 L230.33 154.67 L232.8 153.2 L235.27 151.73 L237.73 150.27 L240.2 148.8 L242.67 147.33 L245.13 145.87 L247.6 144.4 L250.07 142.93 L252.53 141.47 L255 140 L257.47 138.53 L259.93 137.07 L262.4 135.6 L264.87 134.13 L267.33 132.67 L269.8 131.2 L272.27 129.73 L274.73 128.27 L277.2 126.8 L279.67 125.33 L282.13 123.87 L284.6 122.4 L287.07 120.93 L289.53 119.47 L292 118 L294.47 116.53 L296.93 115.07 L299.4 113.6 L301.87 112.13 L304.33 110.67 L306.8 109.2 L309.27 107.73 L311.73 106.27 L314.2 104.8 L316.67 103.33 L319.13 101.87 L321.6 100.4 L324.07 98.93 L326.53 97.47 L329 96 L331.47 94.53 L333.93 93.07 L336.4 91.6 L338.87 90.13 L341.33 88.67 L343.8 87.2 L346.27 85.73 L348.73 84.27 L351.2 82.8 L353.67 81.33 L356.13 79.87 L358.6 78.4 L361.07 76.93 L363.53 75.47 L366 74"/><circle class="f2" cx="119.33" cy="220.67" r="4"/><path class="gr" stroke-dasharray="4 3" d="M119.33 250 L119.33 220.67"/><circle class="f2" cx="218" cy="162" r="4"/><path class="gr" stroke-dasharray="4 3" d="M218 250 L218 162"/><circle class="f2" cx="316.67" cy="103.33" r="4"/><path class="gr" stroke-dasharray="4 3" d="M316.67 250 L316.67 103.33"/><text class="ink sm" x="125.33" y="234.67" text-anchor="start">1/6</text><text class="ink sm" x="224" y="176" text-anchor="start">1/2</text><text class="ink bold sm" x="310.67" y="95.33" text-anchor="end">5/6</text><text class="ink bold sm" x="414" y="76" text-anchor="start">두 사람의 게임으로 보기</text><text class="ink2 sm" x="414" y="96" text-anchor="start">갑이 500, 을이 100 을 갖고</text><text class="ink2 sm" x="414" y="112" text-anchor="start">한 사람이 빌 때까지 한다면</text><text class="ink bold sm" x="414" y="128" text-anchor="start">갑이 이길 확률이 5/6 이다</text><text class="ink2 sm" x="414" y="154" text-anchor="start">그런데 이겨서 얻는 것은 100,</text><text class="ink2 sm" x="414" y="170" text-anchor="start">져서 잃는 것은 500 이다</text><text class="ink bold sm" x="414" y="190" text-anchor="start">(5/6)·100 − (1/6)·500 = 0</text><text class="ink2 sm" x="414" y="214" text-anchor="start">공정한 판을 아무리 이어도</text><text class="ink2 sm" x="414" y="230" text-anchor="start">평균 이익은 0 이다</text><text class="ink bold sm" x="414" y="254" text-anchor="start">자본이 크면 자주 이기지만</text><text class="ink bold sm" x="414" y="270" text-anchor="start">질 때 크게 진다</text><path d="M20 286 L640 286" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="306" text-anchor="start">직선이라는 것이 요점이다. 승률은 초기 자본에 정확히 비례하고, 목표까지의 거리에 반비례한다.</text>
</svg>