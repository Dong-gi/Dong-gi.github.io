<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">편향된 게임에서 목표 이익에 따른 승률 상한</title><desc id="d">한 판의 승률이 18/38 일 때 목표 이익 m 에 대한 승률 상한이 (9/10)의 m 제곱으로 지수적으로 줄어드는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">한 판의 승률이 18/38 인 게임 — 목표 이익 m 에 따른 승률의 상한 (1/r)^m</text><text class="ink2 sm" x="20" y="42" text-anchor="start">r = q/p = 20/18 = 10/9 이므로 상한은 (9/10)^m 이다. 초기 자본이 얼마든 이 값을 넘지 못한다</text><path class="gr" d="M70 256 V84"/><path class="gr" d="M137.27 256 V84"/><path class="gr" d="M204.55 256 V84"/><path class="gr" d="M271.82 256 V84"/><path class="gr" d="M339.09 256 V84"/><path class="gr" d="M70 84 H366"/><path class="gr" d="M70 118.4 H366"/><path class="gr" d="M70 152.8 H366"/><path class="gr" d="M70 187.2 H366"/><path class="gr" d="M70 221.6 H366"/><path class="gr" d="M70 256 H366"/><path class="ax" marker-end="url(#ark)" d="M70 84 H376"/><path class="ax" marker-end="url(#ark)" d="M70 256 V74"/><text class="sm ink2" x="137.27" y="99" text-anchor="middle">50</text><text class="sm ink2" x="204.55" y="99" text-anchor="middle">100</text><text class="sm ink2" x="271.82" y="99" text-anchor="middle">150</text><text class="sm ink2" x="339.09" y="99" text-anchor="middle">200</text><text class="sm ink2" x="64" y="122.4" text-anchor="end">-2</text><text class="sm ink2" x="64" y="156.8" text-anchor="end">-4</text><text class="sm ink2" x="64" y="191.2" text-anchor="end">-6</text><text class="sm ink2" x="64" y="225.6" text-anchor="end">-8</text><text class="sm ink2" x="64" y="260" text-anchor="end">-10</text><text class="sm ink2" x="380" y="88">m</text><text class="sm ink2" x="62" y="76" text-anchor="end">log₁₀ 상한</text><path class="cv s1" d="M70 84 L72.47 85.44 L74.93 86.89 L77.4 88.33 L79.87 89.77 L82.33 91.21 L84.8 92.66 L87.27 94.1 L89.73 95.54 L92.2 96.99 L94.67 98.43 L97.13 99.87 L99.6 101.31 L102.07 102.76 L104.53 104.2 L107 105.64 L109.47 107.09 L111.93 108.53 L114.4 109.97 L116.87 111.41 L119.33 112.86 L121.8 114.3 L124.27 115.74 L126.73 117.19 L129.2 118.63 L131.67 120.07 L134.13 121.52 L136.6 122.96 L139.07 124.4 L141.53 125.84 L144 127.29 L146.47 128.73 L148.93 130.17 L151.4 131.62 L153.87 133.06 L156.33 134.5 L158.8 135.94 L161.27 137.39 L163.73 138.83 L166.2 140.27 L168.67 141.72 L171.13 143.16 L173.6 144.6 L176.07 146.04 L178.53 147.49 L181 148.93 L183.47 150.37 L185.93 151.82 L188.4 153.26 L190.87 154.7 L193.33 156.14 L195.8 157.59 L198.27 159.03 L200.73 160.47 L203.2 161.92 L205.67 163.36 L208.13 164.8 L210.6 166.24 L213.07 167.69 L215.53 169.13 L218 170.57 L220.47 172.02 L222.93 173.46 L225.4 174.9 L227.87 176.34 L230.33 177.79 L232.8 179.23 L235.27 180.67 L237.73 182.12 L240.2 183.56 L242.67 185 L245.13 186.44 L247.6 187.89 L250.07 189.33 L252.53 190.77 L255 192.22 L257.47 193.66 L259.93 195.1 L262.4 196.55 L264.87 197.99 L267.33 199.43 L269.8 200.87 L272.27 202.32 L274.73 203.76 L277.2 205.2 L279.67 206.65 L282.13 208.09 L284.6 209.53 L287.07 210.97 L289.53 212.42 L292 213.86 L294.47 215.3 L296.93 216.75 L299.4 218.19 L301.87 219.63 L304.33 221.07 L306.8 222.52 L309.27 223.96 L311.73 225.4 L314.2 226.85 L316.67 228.29 L319.13 229.73 L321.6 231.17 L324.07 232.62 L326.53 234.06 L329 235.5 L331.47 236.95 L333.93 238.39 L336.4 239.83 L338.87 241.27 L341.33 242.72 L343.8 244.16 L346.27 245.6 L348.73 247.05 L351.2 248.49 L353.67 249.93 L356.13 251.37 L358.6 252.82 L361.07 254.26 L363.53 255.7 L366 257.15"/><circle class="f2" cx="204.55" cy="162.7" r="4"/><path class="gr" stroke-dasharray="4 3" d="M204.55 256 L204.55 162.7"/><circle class="f2" cx="339.09" cy="241.41" r="4"/><path class="gr" stroke-dasharray="4 3" d="M339.09 256 L339.09 241.41"/><text class="ink bold sm" x="212.55" y="166.7" text-anchor="start">1/37648</text><text class="ink bold sm" x="333.09" y="233.41" text-anchor="end">1/14억</text><text class="ink bold sm" x="414" y="82" text-anchor="start">공정한 게임과 견주기</text><text class="ink2 sm" x="414" y="102" text-anchor="start">자본 500, 목표 600 이면</text><text class="ink2 sm" x="414" y="120" text-anchor="start">공정한 게임 → 5/6</text><text x="414" y="138" text-anchor="start" fill="var(--s2)" class="sm" font-weight="600">이 게임 → 1/37648 미만</text><text class="ink2 sm" x="414" y="164" text-anchor="start">자본을 50억으로 늘려도</text><text class="ink bold sm" x="414" y="180" text-anchor="start">같은 상한이 유효하다</text><text class="ink2 sm" x="414" y="206" text-anchor="start">상한이 초기 자본에</text><text class="ink2 sm" x="414" y="222" text-anchor="start">들어 있지 않기 때문이다</text><text class="ink2 sm" x="414" y="248" text-anchor="start">목표를 두 배로 하면</text><text class="ink bold sm" x="414" y="264" text-anchor="start">승률은 제곱이 된다</text><path d="M20 282 L640 282" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="302" text-anchor="start">로그 축에서 직선이라는 것은 승률이 목표 이익에 대해 지수적으로 떨어진다는 뜻이다.</text><text class="ink2 sm" x="20" y="322" text-anchor="start">한 판의 불리함은 2.6%p 뿐인데 100달러를 따려는 계획은 3만 번에 한 번도 성공하지 못한다.</text>
</svg>