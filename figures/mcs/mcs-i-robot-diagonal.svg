<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 348" width="780" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">대각선으로만 움직이는 로봇과 짝합 불변량</title><desc id="d">왼쪽은 좌표의 합이 짝수인 격자점만 도달 가능하고 (1,0) 은 갈 수 없음을 보이는 격자, 오른쪽은 네 가지 전이가 합을 0 이나 2 나 −2 만큼 바꾼다는 표</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">한 걸음마다 좌표의 합이 0, 2, −2 만큼 바뀐다 — 짝수는 짝수로만 간다</text><rect x="20" y="46" width="386" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="213" y="66" text-anchor="middle">도달 가능한 자리는 좌표의 합이 짝수인 자리뿐이다</text><path d="M94 86 L94 254" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M136 86 L136 254" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M178 86 L178 254" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 86 L220 254" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M262 86 L262 254" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M304 86 L304 254" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M346 86 L346 254" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M94 86 L346 86" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M94 128 L346 128" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M94 170 L346 170" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M94 212 L346 212" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M94 254 L346 254" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="94" cy="254" r="4.5" fill="var(--s3)"/><circle cx="94" cy="212" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="94" cy="170" r="4.5" fill="var(--s3)"/><circle cx="94" cy="128" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="94" cy="86" r="4.5" fill="var(--s3)"/><circle cx="136" cy="254" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="136" cy="212" r="4.5" fill="var(--s3)"/><circle cx="136" cy="170" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="136" cy="128" r="4.5" fill="var(--s3)"/><circle cx="136" cy="86" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="178" cy="254" r="4.5" fill="var(--s3)"/><circle cx="178" cy="170" r="4.5" fill="var(--s3)"/><circle cx="178" cy="128" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="178" cy="86" r="4.5" fill="var(--s3)"/><circle cx="220" cy="254" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="220" cy="212" r="4.5" fill="var(--s3)"/><circle cx="220" cy="170" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="220" cy="128" r="4.5" fill="var(--s3)"/><circle cx="220" cy="86" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="262" cy="254" r="4.5" fill="var(--s3)"/><circle cx="262" cy="212" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="262" cy="170" r="4.5" fill="var(--s3)"/><circle cx="262" cy="128" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="262" cy="86" r="4.5" fill="var(--s3)"/><circle cx="304" cy="254" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="304" cy="212" r="4.5" fill="var(--s3)"/><circle cx="304" cy="170" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="304" cy="128" r="4.5" fill="var(--s3)"/><circle cx="304" cy="86" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="346" cy="254" r="4.5" fill="var(--s3)"/><circle cx="346" cy="212" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="346" cy="170" r="4.5" fill="var(--s3)"/><circle cx="346" cy="128" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><circle cx="346" cy="86" r="4.5" fill="var(--s3)"/><circle cx="136" cy="212" r="10" fill="none" stroke="var(--s1)" stroke-width="2"/><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M144 204 L169 179"/><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M144 220 L169 245"/><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M128 204 L103 179"/><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M128 220 L103 245"/><path d="M170 204 L186 220" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 220 L186 204" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="sm bold" fill="var(--s2)" x="192" y="200" text-anchor="start">(1, 0) — 합이 1 이라 갈 수 없다</text><text class="ink2 sm" x="362" y="259" text-anchor="start">x</text><text class="ink2 sm" x="86" y="78" text-anchor="middle">y</text><circle cx="50" cy="270" r="4.5" fill="var(--s3)"/><text class="ink2 sm" x="64" y="274" text-anchor="start">합이 짝수 — 도달 가능</text><circle cx="230" cy="270" r="3.2" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink2 sm" x="244" y="274" text-anchor="start">합이 홀수 — 도달 불가</text><circle cx="50" cy="292" r="7" fill="none" stroke="var(--s1)" stroke-width="2"/><text class="ink2 sm" x="64" y="296" text-anchor="start">시작 상태 (0, 0) — 첫 걸음 네 갈래를 화살표로 그렸다</text><rect x="424" y="46" width="336" height="258" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="592" y="66" text-anchor="middle">전이가 합을 어떻게 바꾸는가</text><text class="ink2 sm" x="592" y="82" text-anchor="middle">네 가지 걸음이 전부다</text><text class="ink sm" x="448" y="108" text-anchor="start">(m, n) →  (m+1, n+1)</text><rect x="638" y="93" width="46" height="22" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.4"/><text class="ink bold sm" x="661" y="108" text-anchor="middle">+2</text><text class="ink2 sm" x="696" y="108" text-anchor="start">만큼 변한다</text><text class="ink sm" x="448" y="138" text-anchor="start">(m, n) →  (m+1, n−1)</text><rect x="638" y="123" width="46" height="22" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.4"/><text class="ink bold sm" x="661" y="138" text-anchor="middle">0</text><text class="ink2 sm" x="696" y="138" text-anchor="start">만큼 변한다</text><text class="ink sm" x="448" y="168" text-anchor="start">(m, n) →  (m−1, n+1)</text><rect x="638" y="153" width="46" height="22" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.4"/><text class="ink bold sm" x="661" y="168" text-anchor="middle">0</text><text class="ink2 sm" x="696" y="168" text-anchor="start">만큼 변한다</text><text class="ink sm" x="448" y="198" text-anchor="start">(m, n) →  (m−1, n−1)</text><rect x="638" y="183" width="46" height="22" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.4"/><text class="ink bold sm" x="661" y="198" text-anchor="middle">−2</text><text class="ink2 sm" x="696" y="198" text-anchor="start">만큼 변한다</text><path d="M448 234 L736 234" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="448" y="256" text-anchor="start">짝수에 0, 2, −2 를 더해도 짝수다. 그래서</text><text class="ink2 sm" x="448" y="274" text-anchor="start">‘합이 짝수다’ 는 보존되는 불변량이고,</text><text class="ink2 sm" x="448" y="292" text-anchor="start">시작 상태에서 참이므로 모든 도달 가능한 상태</text><text class="ink2 sm" x="448" y="310" text-anchor="start">에서 참이다</text><text class="ink2 sm" x="24" y="332" text-anchor="start">불변량 논증에서 실제로 하는 일은 이 네 줄을 확인하는 것이다. 전이가 몇 가지인지 빠짐없이 세는 것이 증명의 절반이다</text>
</svg>