<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">무한 확률공간의 나무 그림</title><desc id="d">번갈아 동전을 던져 먼저 앞면을 낸 사람이 이기는 게임의 무한 나무와 등비급수로 얻은 확률 2/3</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">두 사람이 번갈아 공정한 동전을 던져 먼저 앞면을 낸 사람이 이긴다 — 표본공간이 무한하다</text><path d="M77 77 L102 136" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="69" y="112" text-anchor="end">H 1/2</text><circle cx="104" cy="140" r="4" fill="var(--s2)"/><text class="ink bold sm" x="104" y="160" text-anchor="middle">1번 승</text><text class="ink2 sm" x="104" y="178" text-anchor="middle">1/2</text><path d="M79 74 L173 74" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="126" y="66" text-anchor="middle">T 1/2</text><circle cx="74" cy="74" r="3" fill="var(--ink2)"/><path d="M181 77 L206 136" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="173" y="112" text-anchor="end">H 1/2</text><circle cx="208" cy="140" r="4" fill="var(--s1)"/><text class="ink2 sm" x="208" y="160" text-anchor="middle">2번 승</text><text class="ink2 sm" x="208" y="178" text-anchor="middle">1/4</text><path d="M183 74 L277 74" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="230" y="66" text-anchor="middle">T 1/2</text><circle cx="178" cy="74" r="3" fill="var(--ink2)"/><path d="M285 77 L310 136" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="277" y="112" text-anchor="end">H 1/2</text><circle cx="312" cy="140" r="4" fill="var(--s2)"/><text class="ink bold sm" x="312" y="160" text-anchor="middle">1번 승</text><text class="ink2 sm" x="312" y="178" text-anchor="middle">1/8</text><path d="M287 74 L381 74" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="334" y="66" text-anchor="middle">T 1/2</text><circle cx="282" cy="74" r="3" fill="var(--ink2)"/><path d="M389 77 L414 136" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="381" y="112" text-anchor="end">H 1/2</text><circle cx="416" cy="140" r="4" fill="var(--s1)"/><text class="ink2 sm" x="416" y="160" text-anchor="middle">2번 승</text><text class="ink2 sm" x="416" y="178" text-anchor="middle">1/16</text><path d="M391 74 L485 74" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="438" y="66" text-anchor="middle">T 1/2</text><circle cx="386" cy="74" r="3" fill="var(--ink2)"/><path d="M493 77 L518 136" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="485" y="112" text-anchor="end">H 1/2</text><circle cx="520" cy="140" r="4" fill="var(--s2)"/><text class="ink bold sm" x="520" y="160" text-anchor="middle">1번 승</text><text class="ink2 sm" x="520" y="178" text-anchor="middle">1/32</text><circle cx="490" cy="74" r="3" fill="var(--ink2)"/><text class="ink2 sm" x="512" y="79" text-anchor="start">⋯ 끝없이 이어진다</text><text class="ink2 sm" x="34" y="79" text-anchor="end">시작</text><rect x="60" y="210" width="520" height="66" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold" x="320" y="236" text-anchor="middle">Pr[1번 승] = 1/2 + 1/8 + 1/32 + ⋯ = (1/2) · 1/(1 − 1/4) = 2/3</text><text class="ink2 sm" x="320" y="262" text-anchor="middle">2번은 1/3 이다. 두 값을 더하면 1 이므로 확률함수의 조건이 맞다</text><path d="M20 292 L620 292" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="312" text-anchor="start">표본공간은 {T^n H : n ∈ ℕ} 이고 Pr[T^n H] = 1/2^(n+1) 이다. ‘영원히 뒷면’ 은 잎이 아니므로 결과가 아니다.</text>
</svg>