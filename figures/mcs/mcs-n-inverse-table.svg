<text class="ink bold sm" x="360" y="26" text-anchor="middle">곱셈 역원은 법과 서로소인 수에만 있다</text><text x="58" y="58" text-anchor="start" fill="var(--ink)" class="sm bold">n = 15 — 15 와 서로소인 8 개에만 역원이 있다. φ(15) = 8</text><rect x="58" y="68" width="40" height="30" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="78" y="88" text-anchor="middle">0</text><text x="78" y="114" text-anchor="middle" fill="var(--ink2)" class="sm">없음</text><rect x="98" y="68" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="118" y="88" text-anchor="middle">1</text><text x="118" y="114" text-anchor="middle" fill="var(--s3)" class="sm">1</text><rect x="138" y="68" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="158" y="88" text-anchor="middle">2</text><text x="158" y="114" text-anchor="middle" fill="var(--s3)" class="sm">8</text><rect x="178" y="68" width="40" height="30" rx="2" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="198" y="88" text-anchor="middle">3</text><text x="198" y="114" text-anchor="middle" fill="var(--s2)" class="sm">없음</text><rect x="218" y="68" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="238" y="88" text-anchor="middle">4</text><text x="238" y="114" text-anchor="middle" fill="var(--s3)" class="sm">4</text><rect x="258" y="68" width="40" height="30" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="278" y="88" text-anchor="middle">5</text><text x="278" y="114" text-anchor="middle" fill="var(--ink2)" class="sm">없음</text><rect x="298" y="68" width="40" height="30" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="318" y="88" text-anchor="middle">6</text><text x="318" y="114" text-anchor="middle" fill="var(--ink2)" class="sm">없음</text><rect x="338" y="68" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="358" y="88" text-anchor="middle">7</text><text x="358" y="114" text-anchor="middle" fill="var(--s3)" class="sm">13</text><rect x="378" y="68" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="398" y="88" text-anchor="middle">8</text><text x="398" y="114" text-anchor="middle" fill="var(--s3)" class="sm">2</text><rect x="418" y="68" width="40" height="30" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="438" y="88" text-anchor="middle">9</text><text x="438" y="114" text-anchor="middle" fill="var(--ink2)" class="sm">없음</text><rect x="458" y="68" width="40" height="30" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="478" y="88" text-anchor="middle">10</text><text x="478" y="114" text-anchor="middle" fill="var(--ink2)" class="sm">없음</text><rect x="498" y="68" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="518" y="88" text-anchor="middle">11</text><text x="518" y="114" text-anchor="middle" fill="var(--s3)" class="sm">11</text><rect x="538" y="68" width="40" height="30" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="558" y="88" text-anchor="middle">12</text><text x="558" y="114" text-anchor="middle" fill="var(--ink2)" class="sm">없음</text><rect x="578" y="68" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="598" y="88" text-anchor="middle">13</text><text x="598" y="114" text-anchor="middle" fill="var(--s3)" class="sm">7</text><rect x="618" y="68" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="638" y="88" text-anchor="middle">14</text><text x="638" y="114" text-anchor="middle" fill="var(--s3)" class="sm">14</text><text x="58" y="142" text-anchor="start" fill="var(--ink2)" class="sm">아래 줄이 그 수의 역원이다.</text><text x="58" y="186" text-anchor="start" fill="var(--ink)" class="sm bold">n = 7 (소수) — 0 을 뺀 6 개 전부에 역원이 있다. φ(7) = 6</text><rect x="58" y="196" width="40" height="30" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1"/><text class="ink sm" x="78" y="216" text-anchor="middle">0</text><text x="78" y="242" text-anchor="middle" fill="var(--ink2)" class="sm">없음</text><rect x="98" y="196" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="118" y="216" text-anchor="middle">1</text><text x="118" y="242" text-anchor="middle" fill="var(--s3)" class="sm">1</text><rect x="138" y="196" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="158" y="216" text-anchor="middle">2</text><text x="158" y="242" text-anchor="middle" fill="var(--s3)" class="sm">4</text><rect x="178" y="196" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="198" y="216" text-anchor="middle">3</text><text x="198" y="242" text-anchor="middle" fill="var(--s3)" class="sm">5</text><rect x="218" y="196" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="238" y="216" text-anchor="middle">4</text><text x="238" y="242" text-anchor="middle" fill="var(--s3)" class="sm">2</text><rect x="258" y="196" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="278" y="216" text-anchor="middle">5</text><text x="278" y="242" text-anchor="middle" fill="var(--s3)" class="sm">3</text><rect x="298" y="196" width="40" height="30" rx="2" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.8"/><text class="ink sm" x="318" y="216" text-anchor="middle">6</text><text x="318" y="242" text-anchor="middle" fill="var(--s3)" class="sm">6</text><text x="390" y="196" text-anchor="start" fill="var(--ink2)" class="sm">법이 소수이면 0 만 빼고 다 가역이다.</text><text x="390" y="216" text-anchor="start" fill="var(--ink2)" class="sm">그래서 유리수처럼 나눗셈이 자유롭다.</text><text x="390" y="240" text-anchor="start" fill="var(--s2)" class="sm">3 은 15 와 서로소가 아니라 역원이 없고,</text><text x="390" y="258" text-anchor="start" fill="var(--s2)" class="sm">그래서 3 · 10 = 3 · 5 (Z<tspan baseline-shift="-22%" font-size="76%">15</tspan>) 에서</text><text x="390" y="276" text-anchor="start" fill="var(--s2)" class="sm">3 을 지울 수 없다.</text><text class="ink2 sm" x="240" y="300" text-anchor="middle">역원이 있는 것 · 소거할 수 있는 것 · 법과 서로소인 것이 정확히 같은 셋이다</text>
</svg>