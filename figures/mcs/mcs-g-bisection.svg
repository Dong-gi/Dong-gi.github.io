<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이분폭과 혼잡도의 하한</title><desc id="d">완전 이진 트리망의 이분폭이 2 임을 절단선으로 보이고, 비둘기집 원리로 혼잡도 하한을 얻는 논증을 적은 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">이분폭 — 반으로 자르려면 몇 개의 선을 끊어야 하는가</text><rect x="20" y="40" width="400" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="220" y="59" text-anchor="middle">완전 이진 트리망: 이분폭이 1 이다</text><text class="ink2 sm" x="220" y="75" text-anchor="middle">선 하나만 끊으면 입력 절반 · 출력 절반이 떨어져 나간다</text><path d="M105.97 214.45 L124.03 179.55" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M154.03 214.45 L135.97 179.55" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M265.97 214.45 L284.03 179.55" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M314.03 214.45 L295.97 179.55" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M140.15 159.88 L189.85 120.12" fill="none" stroke="var(--s2)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M278.96 161.13 L211.04 118.87" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="150" width="100" height="98" rx="10" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.6" stroke-dasharray="6 4"/><circle cx="200" cy="112" r="13" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><circle cx="130" cy="168" r="13" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><circle cx="290" cy="168" r="13" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><circle cx="100" cy="226" r="13" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="100" y="230" text-anchor="middle" fill="var(--ink)" class="sm">0</text><circle cx="160" cy="226" r="13" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="160" y="230" text-anchor="middle" fill="var(--ink)" class="sm">1</text><circle cx="260" cy="226" r="13" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><text x="260" y="230" text-anchor="middle" fill="var(--ink)" class="sm">2</text><circle cx="320" cy="226" r="13" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><text x="320" y="230" text-anchor="middle" fill="var(--ink)" class="sm">3</text><text x="216" y="110" text-anchor="start" fill="var(--s2)" class="sm">상자를 넘는 선은 하나뿐</text><text x="216" y="127" text-anchor="start" fill="var(--s2)" class="sm">— 이것을 끊으면 갈린다</text><text x="130" y="270" text-anchor="middle" fill="var(--s1)" class="sm">상자 안: 입력 2 · 출력 2</text><text x="300" y="270" text-anchor="middle" fill="var(--ink2)" class="sm">밖도: 입력 2 · 출력 2</text><rect x="440" y="40" width="260" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="570" y="59" text-anchor="middle">왜 하한이 되는가</text><text class="ink2 sm" x="570" y="75" text-anchor="middle">비둘기집 원리 한 줄</text><text x="456" y="92" text-anchor="start" fill="var(--ink2)" class="sm">상자 안의 입력을 모두 상자 밖 출력으로</text><text x="456" y="110" text-anchor="start" fill="var(--ink2)" class="sm">보내는 순열을 고른다. 그러면 경로</text><text x="456" y="128" text-anchor="start" fill="var(--ink2)" class="sm">N/2 개가 반드시 절단면을 넘어야 한다.</text><text x="456" y="146" text-anchor="start" fill="var(--ink2)" class="sm"></text><text x="456" y="164" text-anchor="start" fill="var(--ink2)" class="sm">넘을 수 있는 선이 w 개뿐이므로</text><text x="456" y="182" text-anchor="start" fill="var(--ink2)" class="sm">어떤 선 하나에는 경로가</text><text x="456" y="200" text-anchor="start" fill="var(--ink2)" class="sm">적어도 (N/2) / w 개 얹힌다.</text><text x="456" y="218" text-anchor="start" fill="var(--ink2)" class="sm"></text><text x="456" y="236" text-anchor="start" fill="var(--ink2)" class="sm">트리는 w = 1 이므로 N/2 이상이고,</text><text x="456" y="254" text-anchor="start" fill="var(--s2)" class="sm">실제 간선 혼잡도가 정확히 N/2 다.</text><text class="ink2 sm" x="360" y="316" text-anchor="middle">이분폭이 작다는 것은 ‘허리가 얇다’는 뜻이다. 허리가 얇으면 아무리 영리하게 라우팅해도 그곳이 막힌다</text><text class="ink2 sm" x="360" y="336" text-anchor="middle">거꾸로 혼잡도 1 을 얻으려면 이분폭이 N/2 이상이어야 하고, 그만큼의 배선을 실제로 깔아야 한다</text>
</svg>