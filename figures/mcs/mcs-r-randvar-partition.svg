<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">확률변수가 만드는 표본공간의 분할</title><desc id="d">동전 세 개의 결과 여덟 개를 앞면 개수로, 그리고 모두 같은지로 나눈 두 분할</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">확률변수는 결과마다 수를 하나 붙이는 함수다. 값이 같은 결과를 모으면 표본공간의 분할이 생긴다</text><text class="ink2 sm" x="36" y="56" text-anchor="start">C = 앞면의 개수 — 블록 네 개</text><rect x="36" y="64" width="76" height="44" rx="5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.4"/><text class="ink2 sm" x="70" y="92" text-anchor="middle">TTT</text><text class="ink bold sm" x="74" y="124" text-anchor="middle">C = 0</text><text class="ink2 sm" x="74" y="142" text-anchor="middle">Pr = 1/8</text><rect x="122" y="64" width="180" height="44" rx="5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.4"/><text class="ink2 sm" x="156" y="92" text-anchor="middle">HTT</text><text class="ink2 sm" x="208" y="92" text-anchor="middle">THT</text><text class="ink2 sm" x="260" y="92" text-anchor="middle">TTH</text><text class="ink bold sm" x="212" y="124" text-anchor="middle">C = 1</text><text class="ink2 sm" x="212" y="142" text-anchor="middle">Pr = 3/8</text><rect x="312" y="64" width="180" height="44" rx="5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.4"/><text class="ink2 sm" x="346" y="92" text-anchor="middle">HHT</text><text class="ink2 sm" x="398" y="92" text-anchor="middle">HTH</text><text class="ink2 sm" x="450" y="92" text-anchor="middle">THH</text><text class="ink bold sm" x="402" y="124" text-anchor="middle">C = 2</text><text class="ink2 sm" x="402" y="142" text-anchor="middle">Pr = 3/8</text><rect x="502" y="64" width="76" height="44" rx="5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.4"/><text class="ink2 sm" x="536" y="92" text-anchor="middle">HHH</text><text class="ink bold sm" x="540" y="124" text-anchor="middle">C = 3</text><text class="ink2 sm" x="540" y="142" text-anchor="middle">Pr = 1/8</text><text class="ink2 sm" x="36" y="186" text-anchor="start">M = 세 동전이 모두 같으면 1, 아니면 0 — 지시확률변수</text><rect x="36" y="194" width="128" height="44" rx="5" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.4"/><text class="ink2 sm" x="70" y="222" text-anchor="middle">HHH</text><text class="ink2 sm" x="122" y="222" text-anchor="middle">TTT</text><text class="ink bold sm" x="100" y="254" text-anchor="middle">M = 1</text><text class="ink2 sm" x="100" y="272" text-anchor="middle">Pr = 2/8</text><rect x="174" y="194" width="336" height="44" rx="5" fill="none" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.4"/><text class="ink2 sm" x="208" y="222" text-anchor="middle">HHT</text><text class="ink2 sm" x="260" y="222" text-anchor="middle">HTH</text><text class="ink2 sm" x="312" y="222" text-anchor="middle">HTT</text><text class="ink2 sm" x="364" y="222" text-anchor="middle">THH</text><text class="ink2 sm" x="416" y="222" text-anchor="middle">THT</text><text class="ink2 sm" x="468" y="222" text-anchor="middle">TTH</text><text class="ink bold sm" x="342" y="254" text-anchor="middle">M = 0</text><text class="ink2 sm" x="342" y="272" text-anchor="middle">Pr = 6/8</text><path d="M20 288 L640 288" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="308" text-anchor="start">C 와 M 은 독립이 아니다 — Pr[C = 2 ∩ M = 1] = 0 인데 Pr[C = 2]·Pr[M = 1] = (3/8)(1/4) ≠ 0 이다</text>
</svg>