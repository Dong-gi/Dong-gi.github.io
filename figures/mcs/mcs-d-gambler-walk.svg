<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">도박꾼의 자본이 걷는 무작위 행보</title><desc id="d">자본을 시간에 대해 그려 0 과 목표 T 사이를 오르내리다 한쪽 경계에 닿는 한 가지 경로를 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">자본을 시간에 대해 그리면 0 과 T 사이를 걷는 행보가 된다</text><path class="gr" d="M66 232 V56"/><path class="gr" d="M132.67 232 V56"/><path class="gr" d="M199.33 232 V56"/><path class="gr" d="M266 232 V56"/><path class="gr" d="M332.67 232 V56"/><path class="gr" d="M399.33 232 V56"/><path class="gr" d="M466 232 V56"/><path class="gr" d="M66 232 H466"/><path class="gr" d="M66 185.07 H466"/><path class="gr" d="M66 138.13 H466"/><path class="gr" d="M66 67.73 H466"/><path class="ax" marker-end="url(#ark)" d="M66 232 H476"/><path class="ax" marker-end="url(#ark)" d="M66 232 V46"/><text class="sm ink2" x="132.67" y="247" text-anchor="middle">5</text><text class="sm ink2" x="199.33" y="247" text-anchor="middle">10</text><text class="sm ink2" x="266" y="247" text-anchor="middle">15</text><text class="sm ink2" x="332.67" y="247" text-anchor="middle">20</text><text class="sm ink2" x="399.33" y="247" text-anchor="middle">25</text><text class="sm ink2" x="466" y="247" text-anchor="middle">30</text><text class="sm ink2" x="60" y="189.07" text-anchor="end">4</text><text class="sm ink2" x="60" y="142.13" text-anchor="end">8</text><text class="sm ink2" x="60" y="71.73" text-anchor="end">14</text><text class="sm ink2" x="480" y="236">판 수</text><text class="sm ink2" x="58" y="48" text-anchor="end">자본</text><path class="cv s2" stroke-dasharray="5 4" d="M66 67.73 L466 67.73"/><text class="ink bold sm" x="462" y="59.73" text-anchor="end">목표 T</text><text class="ink bold sm" x="226" y="224" text-anchor="start">파산 0</text><path class="cv s1" d="M66 138.13 L79.33 126.4 L92.67 138.13 L106 149.87 L119.33 138.13 L132.67 126.4 L146 114.67 L159.33 126.4 L172.67 138.13 L186 126.4 L199.33 138.13 L212.67 149.87 L226 161.6 L239.33 149.87 L252.67 138.13 L266 149.87 L279.33 161.6 L292.67 173.33 L306 161.6 L319.33 173.33 L332.67 185.07 L346 173.33 L359.33 185.07 L372.67 196.8 L386 208.53 L399.33 196.8 L412.67 208.53 L426 220.27 L439.33 232"/><circle class="f1" cx="66" cy="138.13" r="4.5"/><text class="ink sm" x="72" y="130.13" text-anchor="start">초기 자본 n</text><circle class="f2" cx="439.33" cy="232" r="5"/><text class="ink bold sm" x="443.33" y="222" text-anchor="start">파산했다</text><text class="ink bold sm" x="490" y="74" text-anchor="start">한 판마다</text><text class="ink2 sm" x="490" y="94" text-anchor="start">확률 p 로 +1</text><text class="ink2 sm" x="490" y="110" text-anchor="start">확률 q = 1 − p 로 −1</text><text class="ink2 sm" x="490" y="136" text-anchor="start">두 경계 가운데</text><text class="ink2 sm" x="490" y="152" text-anchor="start">어느 쪽에 먼저</text><text class="ink2 sm" x="490" y="168" text-anchor="start">닿는지가 문제다</text><text class="ink2 sm" x="490" y="196" text-anchor="start">목표 이익은</text><text class="ink bold sm" x="490" y="212" text-anchor="start">m = T − n</text><path d="M20 250 L640 250" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="270" text-anchor="start">한 걸음이 ±1 이므로 자본은 정수 위를 걷는다. 8장의 상태 기계로 보면 상태가 자본이고 0 과 T 가 종료 상태다.</text><text class="ink bold sm" x="20" y="290" text-anchor="start">무작위 행보의 물음은 늘 둘이다 — 어느 쪽 경계에 닿는가, 그리고 닿기까지 몇 걸음인가.</text>
</svg>