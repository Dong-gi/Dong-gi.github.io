<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 336" width="780" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">빠른 거듭제곱의 실행 추적과 불변량</title><desc id="d">a 는 3 b 는 5 일 때 x y z 의 값이 걸음마다 바뀌지만 y 곱하기 x 의 z 제곱은 243 으로 일정함을 보이는 표와, 부분 정당성과 종료성을 따로 증명한다는 설명</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">오른쪽 열이 한 줄도 바뀌지 않는다 — 그것이 이 프로그램이 옳은 이유다</text><rect x="322" y="58" width="162" height="160" rx="3" fill="var(--s3)" fill-opacity="0.14" stroke="none" stroke-width="1.3"/><text class="ink bold sm" x="68" y="79" text-anchor="middle">걸음</text><text class="ink bold sm" x="127" y="79" text-anchor="middle">x</text><text class="ink bold sm" x="189" y="79" text-anchor="middle">y</text><text class="ink bold sm" x="243" y="79" text-anchor="middle">z</text><text class="ink bold sm" x="297" y="79" text-anchor="middle">z 가</text><text class="ink bold sm" x="403" y="79" text-anchor="middle">y · xᶻ</text><path d="M40 90 L478 90" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="68" y="112" text-anchor="middle">0</text><text class="ink sm" x="127" y="112" text-anchor="middle">3</text><text class="ink sm" x="189" y="112" text-anchor="middle">1</text><text class="ink sm" x="243" y="112" text-anchor="middle">5</text><text class="ink sm" x="297" y="112" text-anchor="middle">홀수</text><text class="ink sm" x="403" y="112" text-anchor="middle">1 · 3⁵ = 243</text><path d="M40 122 L478 122" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="68" y="144" text-anchor="middle">1</text><text class="ink sm" x="127" y="144" text-anchor="middle">9</text><text class="ink sm" x="189" y="144" text-anchor="middle">3</text><text class="ink sm" x="243" y="144" text-anchor="middle">2</text><text class="ink sm" x="297" y="144" text-anchor="middle">짝수</text><text class="ink sm" x="403" y="144" text-anchor="middle">3 · 9² = 243</text><path d="M40 154 L478 154" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="68" y="176" text-anchor="middle">2</text><text class="ink sm" x="127" y="176" text-anchor="middle">81</text><text class="ink sm" x="189" y="176" text-anchor="middle">3</text><text class="ink sm" x="243" y="176" text-anchor="middle">1</text><text class="ink sm" x="297" y="176" text-anchor="middle">홀수</text><text class="ink sm" x="403" y="176" text-anchor="middle">3 · 81¹ = 243</text><path d="M40 186 L478 186" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="68" y="208" text-anchor="middle">3</text><text class="ink sm" x="127" y="208" text-anchor="middle">6561</text><text class="ink sm" x="189" y="208" text-anchor="middle">243</text><text class="ink sm" x="243" y="208" text-anchor="middle">0</text><text class="ink sm" x="297" y="208" text-anchor="middle">멈춤</text><text class="ink sm" x="403" y="208" text-anchor="middle">243 · 1 = 243</text><rect x="40" y="58" width="438" height="160" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="40" y="48" text-anchor="start">a = 3, b = 5 로 aᵇ 를 구한다</text><rect x="512" y="58" width="248" height="192" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="636" y="78" text-anchor="middle">두 가지를 따로 증명한다</text><text class="sm bold" fill="var(--s1)" x="530" y="106" text-anchor="start">부분 정당성 — 불변량</text><text class="ink2 sm" x="530" y="126" text-anchor="start">y · xᶻ = aᵇ 가 걸음마다 유지된다.</text><text class="ink2 sm" x="530" y="144" text-anchor="start">z = 0 에서 멈추면 y = aᵇ 다</text><text class="sm bold" fill="var(--s2)" x="530" y="174" text-anchor="start">종료성 — 측도</text><text class="ink2 sm" x="530" y="194" text-anchor="start">z 가 음이 아닌 정수이고 걸음마다</text><text class="ink2 sm" x="530" y="212" text-anchor="start">적어도 절반으로 줄어든다. 그래서</text><text class="ink2 sm" x="530" y="230" text-anchor="start">곱셈 횟수가 b 가 아니라 log b 규모다</text><text class="ink2 sm" x="40" y="264" text-anchor="start">넷째 줄에서 x 가 6561 까지 커졌는데도 답은 243 이다. y · xᶻ 에서 z = 0 이 되어 x 가 답에 아무 영향을 주지 않기 때문이다.</text><text class="ink2 sm" x="40" y="284" text-anchor="start">그래서 이 프로그램은 마지막 걸음에서 쓸데없는 제곱을 한 번 한다 — 옳음과 효율은 다른 문제다.</text><text class="sm bold" fill="var(--s1)" x="40" y="312" text-anchor="start">표는 확인이지 증명이 아니다. 증명은 두 경우(z 가 짝수 · 홀수)에서 등식을 다시 세우는 것이다</text>
</svg>