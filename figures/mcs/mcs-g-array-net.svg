l="var(--ink)" class="sm">out<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="123" y="189" width="34" height="22" rx="3" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text x="140" y="204" text-anchor="middle" fill="var(--s3)" class="sm">in<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="411" y="309" width="38" height="22" rx="3" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text x="430" y="324" text-anchor="middle" fill="var(--s1)" class="sm">out<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="123" y="249" width="34" height="22" rx="3" fill="none" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="140" y="264" text-anchor="middle" fill="var(--ink)" class="sm">in<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="511" y="309" width="38" height="22" rx="3" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text x="530" y="324" text-anchor="middle" fill="var(--s3)" class="sm">out<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><text x="600" y="96" text-anchor="start" fill="var(--ink2)" class="sm">행 i 를 따라</text><text x="600" y="114" text-anchor="start" fill="var(--ink2)" class="sm">열 π(i) 까지 가고</text><text x="600" y="132" text-anchor="start" fill="var(--ink2)" class="sm">거기서 아래로 내려간다</text><text x="600" y="164" text-anchor="start" fill="var(--ink)" class="sm bold">스위치 (i, j) 를 지날 수 있는</text><text x="600" y="182" text-anchor="start" fill="var(--ink)" class="sm bold">경로는 둘뿐이다 —</text><text x="600" y="200" text-anchor="start" fill="var(--s1)" class="sm">입력 i 에서 온 것과</text><text x="600" y="218" text-anchor="start" fill="var(--s2)" class="sm">출력 j 로 가는 것.</text><text x="600" y="244" text-anchor="start" fill="var(--ink)" class="sm bold">그래서 혼잡도가 2 다.</text><text class="ink2 sm" x="377.5" y="344" text-anchor="middle">값을 치른 곳은 스위치 수다. 배열은 스위치를 N² 개 쓴다 — N 이 1000 이면 백만 개다</text>
