<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 755 360" width="755" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">2차원 배열망과 그 안의 라우팅</title><desc id="d">4×4 배열망에서 네 경로가 각각 행을 따라가다 열에서 내려가는 모습과, 한 스위치에 경로가 둘까지만 모이는 이유를 적은 그림</desc>
