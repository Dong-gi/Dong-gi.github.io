ke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="506" y="244" text-anchor="start">하나만 있으면 되므로 아무 쌍이나 대면 된다</text><text class="ink2 sm" x="24" y="292" text-anchor="start">정의가 요구하는 것은 c 와 x<tspan baseline-shift="-22%" font-size="76%">0</tspan> 이 존재한다는 것뿐이다. 가장 작은 값을 찾을 필요가 없다</text><text class="ink2 sm" x="24" y="312" text-anchor="start">g 를 c 배로 늘려도 되므로 4x + 30 = O(x) 이고, 거꾸로 x = O(4x + 30) 이기도 하다. 둘은 Θ 로 묶인다</text>
