<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">뒤집힘의 개수의 기댓값</title><desc id="d">순열 3 1 5 2 4 의 뒤집힌 쌍을 호로 표시한 그림과 쌍마다 지시변수를 붙여 기댓값을 얻는 계산</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">뒤집힘(inversion) — 앞자리가 뒷자리보다 큰 쌍. 정렬 알고리즘이 옮겨야 하는 횟수와 직결된다</text><rect x="60" y="62" width="44" height="32" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="82" y="84" text-anchor="middle">3</text><text class="ink2 sm" x="82" y="54" text-anchor="middle">1</text><rect x="104" y="62" width="44" height="32" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="126" y="84" text-anchor="middle">1</text><text class="ink2 sm" x="126" y="54" text-anchor="middle">2</text><rect x="148" y="62" width="44" height="32" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="170" y="84" text-anchor="middle">5</text><text class="ink2 sm" x="170" y="54" text-anchor="middle">3</text><rect x="192" y="62" width="44" height="32" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="214" y="84" text-anchor="middle">2</text><text class="ink2 sm" x="214" y="54" text-anchor="middle">4</text><rect x="236" y="62" width="44" height="32" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="258" y="84" text-anchor="middle">4</text><text class="ink2 sm" x="258" y="54" text-anchor="middle">5</text><path d="M82 94 C 82 116, 126 116, 126 94" fill="none" stroke="var(--s2)" stroke-width="1.5"/><path d="M82 94 C 82 131, 214 131, 214 94" fill="none" stroke="var(--s2)" stroke-width="1.5"/><path d="M170 94 C 170 146, 214 146, 214 94" fill="none" stroke="var(--s2)" stroke-width="1.5"/><path d="M170 94 C 170 161, 258 161, 258 94" fill="none" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="60" y="202" text-anchor="start">뒤집힘이 4 개 — (3,1) (3,2) (5,2) (5,4)</text><rect x="344" y="52" width="292" height="128" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="490" y="71" text-anchor="middle">쌍마다 지시변수를 붙인다</text><text class="ink2 sm" x="358" y="92" text-anchor="start">X<tspan baseline-shift="-22%" font-size="76%">ij</tspan> = 1 ⟺ i 자리가 j 자리보다 크다</text><text class="ink2 sm" x="358" y="114" text-anchor="start">두 값 가운데 어느 쪽이 앞에 오는지는</text><text class="ink2 sm" x="358" y="134" text-anchor="start">반반이므로 Pr[X<tspan baseline-shift="-22%" font-size="76%">ij</tspan> = 1] = 1/2</text><text class="ink bold sm" x="358" y="162" text-anchor="start">쌍은 C(n,2) 개다</text><rect x="344" y="196" width="292" height="88" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="bold" x="490" y="224" text-anchor="middle">Ex[뒤집힘] = C(n,2)/2 = n(n−1)/4</text><text class="ink2 sm" x="490" y="252" text-anchor="middle">n = 5 이면 5 개. 예의 4 개는 그 근처다</text><text class="ink2 sm" x="490" y="272" text-anchor="middle">지시변수들은 독립이 아니다 — 상관없다</text><path d="M20 300 L640 300" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="320" text-anchor="start">이 값이 삽입 정렬의 평균 교환 횟수다. 분포를 구하려면 훨씬 어렵지만 평균은 두 줄로 나온다.</text>
</svg>