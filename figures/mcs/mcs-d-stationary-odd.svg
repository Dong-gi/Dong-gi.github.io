<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">정상분포로 수렴하지 않거나 정상분포가 여럿인 그래프</title><desc id="d">두 정점 왕복 그래프와 싱크가 둘인 그래프를 나란히 놓아 정상분포의 유일성과 수렴이 깨지는 경우를 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">정상분포가 있어도 도달하지 못하거나, 정상분포가 무한히 많은 경우</text><rect x="24" y="44" width="300" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="174" y="63" text-anchor="middle">왕복 그래프</text><text class="ink2 sm" x="174" y="79" text-anchor="middle">정상분포는 (1/2, 1/2) 하나뿐이다</text><circle cx="110" cy="130" r="18" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="110" y="135" text-anchor="middle">x</text><circle cx="240" cy="130" r="18" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="240" y="135" text-anchor="middle">y</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M128 122 L222 122"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M222 140 L128 140"/><text class="ink2 sm" x="175" y="112" text-anchor="middle">1</text><text class="ink2 sm" x="175" y="160" text-anchor="middle">1</text><text class="ink2 sm" x="44" y="190" text-anchor="start">x 에서 출발하면 확률이</text><text class="ink bold sm" x="44" y="208" text-anchor="start">(1,0), (0,1), (1,0), ⋯ 로 튄다</text><text class="ink2 sm" x="44" y="228" text-anchor="start">정상분포에 결코 가까워지지 않는다</text><rect x="352" y="44" width="304" height="200" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="504" y="63" text-anchor="middle">싱크가 둘인 그래프</text><text class="ink2 sm" x="504" y="79" text-anchor="middle">정상분포가 셀 수 없이 많다</text><circle cx="400" cy="106" r="18" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.5"/><text class="ink bold sm" x="400" y="111" text-anchor="middle">a</text><circle cx="504" cy="106" r="18" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="504" y="111" text-anchor="middle">b</text><circle cx="504" cy="178" r="18" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="504" y="183" text-anchor="middle">c</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M416 112 L488 106"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M414 120 L490 172"/><text class="ink2 sm" x="452" y="96" text-anchor="middle">1/2</text><text class="ink2 sm" x="440" y="160" text-anchor="middle">1/2</text><path d="M520 92 A16 16 0 1 1 520 120" fill="none" stroke="var(--ink2)" stroke-width="1.6" marker-end="url(#ark)"/><path d="M520 164 A16 16 0 1 1 520 192" fill="none" stroke="var(--ink2)" stroke-width="1.6" marker-end="url(#ark)"/><text class="ink2 sm" x="548" y="106" text-anchor="start">1 (제자리)</text><text class="ink2 sm" x="548" y="178" text-anchor="start">1 (제자리)</text><text class="ink bold sm" x="372" y="214" text-anchor="start">어떤 t 에 대해서도 (0, t, 1−t) 가 정상분포다</text><text class="ink2 sm" x="372" y="232" text-anchor="start">a 에는 아무도 돌아오지 않으므로 0 이 강제된다</text><path d="M20 258 L660 258" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="278" text-anchor="start">그래서 페이지랭크는 슈퍼 정점을 더해 그래프를 강하게 연결된 것으로 만든다. 강한 연결이면 정상분포가 유일하고</text><text class="ink2 sm" x="20" y="298" text-anchor="start">어디서 출발해도 충분히 오래 걸으면 그 분포에 가까워진다. 위 두 그래프에는 그 성질이 없다.</text>
</svg>