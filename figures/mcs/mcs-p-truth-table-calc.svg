<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 354" width="780" height="354" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">진리표를 한 열씩 채워 동치를 확인한다</title><desc id="d">A 또는 (A 가 아니고 B) 와 A 또는 B 의 진리표를 나란히 채워 두 열이 같음을 보인 표</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">복잡한 식은 안에서 바깥으로 한 열씩 채운다</text><rect x="408" y="50" width="96" height="150" rx="2" fill="var(--s1)" fill-opacity="0.14" stroke="none" stroke-width="1.3"/><rect x="504" y="50" width="96" height="150" rx="2" fill="var(--s1)" fill-opacity="0.14" stroke="none" stroke-width="1.3"/><text class="ink bold sm" x="72" y="68" text-anchor="middle">A</text><text class="ink bold sm" x="168" y="68" text-anchor="middle">B</text><text class="ink bold sm" x="264" y="68" text-anchor="middle">¬A</text><text class="ink bold sm" x="360" y="68" text-anchor="middle">¬A ∧ B</text><text class="ink bold sm" x="456" y="68" text-anchor="middle">A ∨ (¬A ∧ B)</text><text class="ink bold sm" x="552" y="68" text-anchor="middle">A ∨ B</text><path d="M24 80 L600 80" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s3)" x="72" y="102" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="168" y="102" text-anchor="middle">T</text><text class="sm" fill="var(--s2)" x="264" y="102" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="360" y="102" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="456" y="102" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="552" y="102" text-anchor="middle">T</text><path d="M24 110 L600 110" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s3)" x="72" y="132" text-anchor="middle">T</text><text class="sm" fill="var(--s2)" x="168" y="132" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="264" y="132" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="360" y="132" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="456" y="132" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="552" y="132" text-anchor="middle">T</text><path d="M24 140 L600 140" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s2)" x="72" y="162" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="168" y="162" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="264" y="162" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="360" y="162" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="456" y="162" text-anchor="middle">T</text><text class="sm" fill="var(--s3)" x="552" y="162" text-anchor="middle">T</text><path d="M24 170 L600 170" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sm" fill="var(--s2)" x="72" y="192" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="168" y="192" text-anchor="middle">F</text><text class="sm" fill="var(--s3)" x="264" y="192" text-anchor="middle">T</text><text class="sm" fill="var(--s2)" x="360" y="192" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="456" y="192" text-anchor="middle">F</text><text class="sm" fill="var(--s2)" x="552" y="192" text-anchor="middle">F</text><rect x="24" y="50" width="576" height="150" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><path fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)" d="M504 226 L504 206"/><text class="ink bold sm" x="24" y="248" text-anchor="start">색칠한 두 열이 네 줄 모두 같다. 그래서 두 식은 동치다</text><path d="M24 266 L756 266" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="24" y="290" text-anchor="start">채우는 순서: ¬A → ¬A ∧ B → A ∨ (¬A ∧ B). 안쪽 괄호가 먼저다</text><text class="ink2 sm" x="24" y="312" text-anchor="start">변수가 n 개면 줄 수는 2ⁿ 이다. 변수 30 개면 10억 줄이 넘어 손으로는 끝낼 수 없다</text><text class="ink2 sm" x="24" y="338" text-anchor="start">그래서 뒤에서 대수 규칙으로 식을 바꾸는 방법과, 그마저 어렵다는 SAT 이야기가 나온다</text>
</svg>