<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">오일러 회로가 있는 그래프와 없는 그래프</title><desc id="d">모든 차수가 짝수인 나비 모양 그래프에는 오일러 회로가 있고, 홀수 차수 정점이 둘인 그래프에는 열린 오일러 보행만 있다는 것을 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">오일러 회로 — 모든 간선을 정확히 한 번씩 지나 제자리로 돌아오기</text><rect x="20" y="40" width="330" height="220" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="185" y="59" text-anchor="middle">모든 차수가 짝수: 회로가 있다</text><text class="ink2 sm" x="185" y="75" text-anchor="middle">나비 모양. 간선 6개</text><path d="M70 116 L70 184" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M84.57 193.38 L165.43 156.62" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M165.43 143.38 L84.57 106.62" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M194.57 143.38 L275.43 106.62" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 116 L290 184" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M275.43 193.38 L194.57 156.62" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="100" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="70" y="104" text-anchor="middle" fill="var(--ink)" class="sm">a</text><text x="70" y="76" text-anchor="middle" fill="var(--ink2)" class="sm">deg 2</text><circle cx="70" cy="200" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="70" y="204" text-anchor="middle" fill="var(--ink)" class="sm">b</text><text x="70" y="176" text-anchor="middle" fill="var(--ink2)" class="sm">deg 2</text><circle cx="180" cy="150" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="180" y="154" text-anchor="middle" fill="var(--ink)" class="sm">c</text><text x="180" y="126" text-anchor="middle" fill="var(--ink2)" class="sm">deg 4</text><circle cx="290" cy="100" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="290" y="104" text-anchor="middle" fill="var(--ink)" class="sm">d</text><text x="290" y="76" text-anchor="middle" fill="var(--ink2)" class="sm">deg 2</text><circle cx="290" cy="200" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="290" y="204" text-anchor="middle" fill="var(--ink)" class="sm">e</text><text x="290" y="176" text-anchor="middle" fill="var(--ink2)" class="sm">deg 2</text><text x="36" y="240" text-anchor="start" fill="var(--s1)" class="sm">회로 하나: a b c d e c a — 간선 여섯 개를 한 번씩 쓴다</text><rect x="370" y="40" width="330" height="220" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="535" y="59" text-anchor="middle">홀수 차수 정점이 둘: 회로는 없다</text><text class="ink2 sm" x="535" y="75" text-anchor="middle">열린 보행만 있다. 간선 5개</text><path d="M446 100 L544 100" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 116 L560 184" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M544 200 L446 200" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 184 L430 116" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M442.68 109.76 L547.32 190.24" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="100" r="16" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="430" y="104" text-anchor="middle" fill="var(--ink)" class="sm">a</text><text x="406" y="104" text-anchor="end" fill="var(--ink2)" class="sm">deg 3</text><circle cx="560" cy="100" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="560" y="104" text-anchor="middle" fill="var(--ink)" class="sm">b</text><text x="584" y="104" text-anchor="start" fill="var(--ink2)" class="sm">deg 2</text><circle cx="560" cy="200" r="16" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="560" y="204" text-anchor="middle" fill="var(--ink)" class="sm">c</text><text x="584" y="204" text-anchor="start" fill="var(--ink2)" class="sm">deg 3</text><circle cx="430" cy="200" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="430" y="204" text-anchor="middle" fill="var(--ink)" class="sm">d</text><text x="406" y="204" text-anchor="end" fill="var(--ink2)" class="sm">deg 2</text><text x="386" y="240" text-anchor="start" fill="var(--s2)" class="sm">열린 보행: a b c d a c — 시작과 끝이 홀수 차수 정점이다</text><text class="ink2 sm" x="360" y="286" text-anchor="middle">이유는 한 줄이다 — 회로가 정점을 들어왔다 나갈 때마다 간선 두 개를 쓰므로 모든 차수가 짝수여야 한다.</text><text class="ink2 sm" x="360" y="306" text-anchor="middle">거꾸로 짝수이면 회로가 있다는 것은 닫힌 보행을 찾아 끼워 넣기를 되풀이해 증명한다</text>
</svg>