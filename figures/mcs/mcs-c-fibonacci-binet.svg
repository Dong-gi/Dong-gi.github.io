<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">비네 공식과 두 뿌리의 크기</title><desc id="d">피보나치 수와 황금비의 거듭제곱을 5의 제곱근으로 나눈 값이 거의 겹친다. 둘째 뿌리의 절댓값이 1 보다 작아 금방 사라지기 때문이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">피보나치 수는 큰 뿌리 하나로 거의 다 설명된다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M62 234 L418 234"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ark)" d="M62 234 L62 50"/><path d="M125.12 234 L125.12 238" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="125.12" y="251" text-anchor="middle">2</text><path d="M188.24 234 L188.24 238" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="188.24" y="251" text-anchor="middle">4</text><path d="M251.36 234 L251.36 238" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="251.36" y="251" text-anchor="middle">6</text><path d="M314.48 234 L314.48 238" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="314.48" y="251" text-anchor="middle">8</text><path d="M377.6 234 L377.6 238" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="377.6" y="251" text-anchor="middle">10</text><path d="M58 178.52 L62 178.52" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="54" y="182.52" text-anchor="end">20</text><path d="M58 123.03 L62 123.03" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="54" y="127.03" text-anchor="end">40</text><path d="M58 67.55 L62 67.55" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="54" y="71.55" text-anchor="end">60</text><text class="ink2 sm" x="422" y="239" text-anchor="start">n</text><text class="ink2 sm" x="68" y="46" text-anchor="start">값</text><rect x="79.56" y="231.23" width="14" height="2.77" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="93.56" y="231.99" width="14" height="2.01" rx="1" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="111.12" y="231.23" width="14" height="2.77" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="125.12" y="230.75" width="14" height="3.25" rx="1" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="142.68" y="228.45" width="14" height="5.55" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="156.68" y="228.74" width="14" height="5.26" rx="1" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="174.24" y="225.68" width="14" height="8.32" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="188.24" y="225.5" width="14" height="8.5" rx="1" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="205.8" y="220.13" width="14" height="13.87" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="219.8" y="220.24" width="14" height="13.76" rx="1" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="237.36" y="211.81" width="14" height="22.19" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="251.36" y="211.74" width="14" height="22.26" rx="1" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="268.92" y="197.94" width="14" height="36.06" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="282.92" y="197.98" width="14" height="36.02" rx="1" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="300.48" y="175.74" width="14" height="58.26" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="314.48" y="175.72" width="14" height="58.28" rx="1" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="332.04" y="139.68" width="14" height="94.32" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="346.04" y="139.69" width="14" height="94.31" rx="1" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="363.6" y="81.42" width="14" height="152.58" rx="1" fill="var(--s1)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="377.6" y="81.41" width="14" height="152.59" rx="1" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.3"/><rect x="96" y="78" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="116" y="84">f<tspan baseline-shift="-22%" font-size="76%">n</tspan></text><rect x="96" y="96" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="116" y="102">φⁿ / √5</text><rect x="438" y="62" width="322" height="172" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="599" y="82" text-anchor="middle">두 뿌리의 크기가 다르다</text><text class="ink bold sm" x="456" y="104" text-anchor="start">φ = (1 + √5)/2 = 1.618…</text><text class="ink sm" x="456" y="128" text-anchor="start">ψ = (1 − √5)/2 = −0.618…</text><path d="M456 144 L742 144" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="456" y="168" text-anchor="start">|ψ| &lt; 1 이므로 ψⁿ → 0 이고,</text><text class="ink2 sm" x="456" y="190" text-anchor="start">n = 10 에서 ψⁿ/√5 는 0.004 뿐이다</text><text class="ink bold sm" x="456" y="218" text-anchor="start">그래서 f<tspan baseline-shift="-22%" font-size="76%">n</tspan> ∼ φⁿ / √5</text><path d="M24 254 L776 254" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="24" y="278" text-anchor="start">f<tspan baseline-shift="-22%" font-size="76%">n</tspan> = (φⁿ − ψⁿ)/√5.  정수만 더해 만든 수열의 닫힌 형태에 √5 가 두 번 나오지만 서로 지워져 언제나 정수가 된다</text><text class="ink2 sm" x="24" y="300" text-anchor="start">부분분수가 두 뿌리를 갈라 주었고 그중 큰 것이 자라는 속도를 정한다 — 지수적으로 자란다는 것이 이 식에서 곧바로 보인다</text>
</svg>