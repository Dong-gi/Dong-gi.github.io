<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">8 이상의 정수는 3 의 배수와 5 의 배수의 합이다</title><desc id="d">8 부터 20 까지의 표현을 늘어놓고, c 에서 3 을 빼면 더 작은 수가 되어 이미 표현된다는 논증을 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">c − 3 을 쓸 수 있으면 c 도 쓸 수 있다</text><rect x="40" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="66" y="128" text-anchor="middle">8</text><rect x="92" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="118" y="128" text-anchor="middle">9</text><rect x="144" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="170" y="128" text-anchor="middle">10</text><rect x="196" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="222" y="128" text-anchor="middle">11</text><rect x="248" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="274" y="128" text-anchor="middle">12</text><rect x="300" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="326" y="128" text-anchor="middle">13</text><rect x="352" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="378" y="128" text-anchor="middle">14</text><rect x="404" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="430" y="128" text-anchor="middle">15</text><rect x="456" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="482" y="128" text-anchor="middle">16</text><rect x="508" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="534" y="128" text-anchor="middle">17</text><rect x="560" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="586" y="128" text-anchor="middle">18</text><rect x="612" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="638" y="128" text-anchor="middle">19</text><rect x="664" y="106" width="52" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="690" y="128" text-anchor="middle">20</text><text class="ink2 sm" x="40" y="94" text-anchor="start">8 이상의 정수를 3 의 배수와 5 의 배수의 합으로 적어 본 것</text><text class="ink2 sm" x="66" y="158" text-anchor="middle">3+5</text><text class="ink2 sm" x="118" y="158" text-anchor="middle">3·3</text><text class="ink2 sm" x="170" y="158" text-anchor="middle">5·5</text><text class="ink2 sm" x="222" y="158" text-anchor="middle">3+3+5</text><text class="ink2 sm" x="274" y="158" text-anchor="middle">3·4</text><text class="ink2 sm" x="326" y="158" text-anchor="middle">3+5+5</text><text class="ink2 sm" x="378" y="158" text-anchor="middle">3·3+5</text><text class="ink2 sm" x="430" y="158" text-anchor="middle">5·3</text><text class="ink2 sm" x="482" y="158" text-anchor="middle">3+3+5+5</text><text class="ink2 sm" x="534" y="158" text-anchor="middle">3·4+5</text><text class="ink2 sm" x="586" y="158" text-anchor="middle">3·6</text><text class="ink2 sm" x="638" y="158" text-anchor="middle">3+3+3+5+5</text><text class="ink2 sm" x="690" y="158" text-anchor="middle">5·4</text><circle cx="378" cy="123" r="22" fill="none" stroke="var(--s2)" stroke-width="2.2"/><circle cx="222" cy="123" r="22" fill="none" stroke="var(--s3)" stroke-width="2.2"/><path d="M378 84 C 378 54 222 54 222 84" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)"/><text class="ink bold sm" x="300" y="48" text-anchor="middle">3 을 뺀다</text><path d="M20 186 L760 186" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="212" text-anchor="start">증명이 하는 일은 이 화살표를 거꾸로 타는 것이다.</text><text class="ink2 sm" x="20" y="234" text-anchor="start">표현할 수 없는 8 이상의 정수 중 가장 작은 것을 c 라 하면 c ≥ 11 이다 (8, 9, 10 은 위에 적혀 있으니까).</text><text class="ink2 sm" x="20" y="256" text-anchor="start">c − 3 은 8 이상이고 c 보다 작으므로 c − 3 = 3a + 5b 로 쓸 수 있다.</text><text class="ink2 sm" x="20" y="278" text-anchor="start">양변에 3 을 더하면 c = 3(a + 1) + 5b 다. c 를 표현했으니 c 가 반례라는 데 어긋난다 — 모순</text><text class="ink2 sm" x="20" y="304" text-anchor="start">8, 9, 10 을 먼저 확인해 둔 것이 c ≥ 11 을 보장하고, 그래서 c − 3 ≥ 8 이 된다. 이 확인을 빼면 증명이 무너진다</text>
</svg>