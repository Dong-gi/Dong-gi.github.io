="302" text-anchor="start">세로축이 로그이므로 직선의 기울기가 곧 밑의 로그다. 두 직선의 기울기가 반대 부호인 것이 두 항의 운명을 갈랐다.</text><text class="ink bold sm" x="20" y="322" text-anchor="start">선형 점화식의 해가 지수적인 까닭이 여기 있다 — 특성근의 거듭제곱을 더한 것이 답이다.</text>
</svg>