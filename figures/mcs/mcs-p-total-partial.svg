<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 352" width="780" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">부분함수와 전함수</title><desc id="d">1 나누기 x 제곱이 0 에서 값을 갖지 않는 것과, 이진 문자열에서 1 을 찾는 함수가 0 만으로 된 문자열에서 값을 갖지 않는 것</desc>
