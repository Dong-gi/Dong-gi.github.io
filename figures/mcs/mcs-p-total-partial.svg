="582" y="82" text-anchor="middle">몇 번째 자리에서 처음 1 이 나오는가</text><rect x="424" y="94" width="90" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="469" y="112" text-anchor="middle">0010</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M520 107 L556 107"/><text class="ink sm" x="566" y="112" text-anchor="start">3</text><rect x="424" y="126" width="90" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="469" y="144" text-anchor="middle">100</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M520 139 L556 139"/><text class="ink sm" x="566" y="144" text-anchor="start">1</text><rect x="424" y="158" width="90" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.7"/><text class="ink sm" x="469" y="176" text-anchor="middle">0000</text><path fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M520 171 L556 171"/><text class="sm bold" fill="var(--s2)" x="566" y="176" text-anchor="start">없다</text><text class="ink2 sm" x="608" y="176" text-anchor="start">1 이 없으니 셀 것이 없다</text><rect x="424" y="190" width="90" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.1"/><text class="ink sm" x="469" y="208" text-anchor="middle">1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M520 203 L556 203"/><text class="ink sm" x="566" y="208" text-anchor="start">1</text><text class="ink2 sm" x="414" y="240" text-anchor="start">0 만으로 된 문자열에서는 값이 정해지지 않는다</text><path d="M20 268 L760 268" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="292" text-anchor="start">값이 정해진 정의역 원소들의 모임을 support 라 하고, support 가 정의역과 같으면 전함수(total function) 다</text><text class="ink2 sm" x="20" y="314" text-anchor="start">공역을 바꿔서는 부분함수가 전함수가 되지 않는다. 정의역을 support 까지 줄여야 한다</text><text class="ink2 sm" x="20" y="340" text-anchor="start">이 문서에서 그냥 ‘함수’ 라고 쓰면 부분함수일 수도 있다. 전함수라고 말해야 모든 원소에 값이 있다는 뜻이 된다</text>
