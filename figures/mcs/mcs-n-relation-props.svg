<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">관계의 성질을 방향 그래프로 그린 것</title><desc id="d">반사 · 비반사 · 대칭 · 비대칭 · 반대칭 · 추이를 각각 정점 세 개짜리 방향 그래프로 보인 여섯 그림</desc>
<style>
