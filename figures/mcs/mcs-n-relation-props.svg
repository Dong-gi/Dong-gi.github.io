59" cy="280" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="359" y="284" text-anchor="middle" fill="var(--ink)" class="sm">x</text><circle cx="309" cy="340" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="309" y="344" text-anchor="middle" fill="var(--ink)" class="sm">y</text><circle cx="409" cy="340" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="409" y="344" text-anchor="middle" fill="var(--ink)" class="sm">z</text><text x="359" y="368" text-anchor="middle" fill="var(--ink2)" class="sm">한 방향만. 다만 자기 고리는 허용</text><rect x="479" y="214" width="224" height="162" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="591" y="234" text-anchor="middle">추이</text><path fill="none" stroke="var(--s3)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar3)" d="M581.4 291.52 L550.6 328.48"/><path fill="none" stroke="var(--s3)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar3)" d="M556 340 L626 340"/><path fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="5 4" d="M600.6 291.52 L631.4 328.48"/><circle cx="591" cy="280" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="591" y="284" text-anchor="middle" fill="var(--ink)" class="sm">x</text><circle cx="541" cy="340" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="541" y="344" text-anchor="middle" fill="var(--ink)" class="sm">y</text><circle cx="641" cy="340" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="641" y="344" text-anchor="middle" fill="var(--ink)" class="sm">z</text><text x="591" y="368" text-anchor="middle" fill="var(--ink2)" class="sm">두 걸음으로 가면 한 걸음으로도 간다</text><text class="ink2 sm" x="360" y="392" text-anchor="middle">오른쪽 아래의 점선이 추이가 요구하는 간선이다. 강한 부분순서는 비반사이면서 추이인 것, 약한 부분순서는 반사이면서 반대칭이고 추이인 것이다</text>
