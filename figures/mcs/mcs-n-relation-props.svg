<text class="ink bold sm" x="360" y="26" text-anchor="middle">관계의 성질은 방향 그래프의 모양이다</text><rect x="15" y="42" width="224" height="162" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="127" y="62" text-anchor="middle">반사</text><path fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)" d="M117.4 119.52 L86.6 156.48"/><path d="M118.75 95.4 C98.5 61.5 155.5 61.5 135.25 95.4" fill="none" stroke="var(--s3)" stroke-width="1.7" marker-end="url(#ar3)"/><path d="M68.75 155.4 C48.5 121.5 105.5 121.5 85.25 155.4" fill="none" stroke="var(--s3)" stroke-width="1.7" marker-end="url(#ar3)"/><path d="M168.75 155.4 C148.5 121.5 205.5 121.5 185.25 155.4" fill="none" stroke="var(--s3)" stroke-width="1.7" marker-end="url(#ar3)"/><circle cx="127" cy="108" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="127" y="112" text-anchor="middle" fill="var(--ink)" class="sm">x</text><circle cx="77" cy="168" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="77" y="172" text-anchor="middle" fill="var(--ink)" class="sm">y</text><circle cx="177" cy="168" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="177" y="172" text-anchor="middle" fill="var(--ink)" class="sm">z</text><text x="127" y="196" text-anchor="middle" fill="var(--ink2)" class="sm">모든 정점에 자기 고리</text><rect x="247" y="42" width="224" height="162" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="359" y="62" text-anchor="middle">비반사</text><path fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)" d="M349.4 119.52 L318.6 156.48"/><path fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)" d="M324 168 L394 168"/><circle cx="359" cy="108" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="359" y="112" text-anchor="middle" fill="var(--ink)" class="sm">x</text><circle cx="309" cy="168" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="309" y="172" text-anchor="middle" fill="var(--ink)" class="sm">y</text><circle cx="409" cy="168" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="409" y="172" text-anchor="middle" fill="var(--ink)" class="sm">z</text><text x="359" y="196" text-anchor="middle" fill="var(--ink2)" class="sm">자기 고리가 하나도 없다</text><rect x="479" y="42" width="224" height="162" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="591" y="62" text-anchor="middle">대칭</text><path d="M576.36 111.29 Q542.95 118.79 541.6 153.01" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M555.64 164.71 Q589.05 157.21 590.4 122.99" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M553.86 175.72 Q591 198 628.14 175.72" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)"/><path d="M628.14 160.28 Q591 138 553.86 160.28" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar1)"/><circle cx="591" cy="108" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="591" y="112" text-anchor="middle" fill="var(--ink)" class="sm">x</text><circle cx="541" cy="168" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="541" y="172" text-anchor="middle" fill="var(--ink)" class="sm">y</text><circle cx="641" cy="168" r="15" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="641" y="172" text-anchor="middle" fill="var(--ink)" class="sm">z</text><text x="591" y="196" text-anchor="middle" fill="var(--ink2)" class="sm">한 방향이 있으면 반대도 있다</text><rect x="15" y="214" width="224" height="162" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="127" y="234" text-anchor="middle">비대칭