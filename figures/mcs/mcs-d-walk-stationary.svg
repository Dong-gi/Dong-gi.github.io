<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">그래프 위의 무작위 행보와 정상분포</title><desc id="d">네 정점 방향 그래프에 간선 확률을 매기고 정상분포 방정식을 세워 답이 3분의 1과 6분의 1이 되는 것을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">방향 그래프 위의 무작위 행보 — 각 간선을 1/(나가는 차수) 확률로 따른다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M128.52 105.77 L231.48 82.23"/><text class="ink2 sm" x="177.33" y="86.3" text-anchor="middle">1/2</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M127.46 117.48 L232.54 162.52"/><text class="ink2 sm" x="184.73" y="132.97" text-anchor="middle">1/2</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M268.08 83.85 L367.92 116.15"/><text class="ink2 sm" x="321.69" y="92.58" text-anchor="middle">1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M267.92 163.68 L368.08 128.32"/><text class="ink2 sm" x="314.01" y="138.68" text-anchor="middle">1</text><path d="M386 143 L386 216 L110 216 L110 131" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M110 200 L110 133"/><text class="ink2 sm" x="248" y="232" text-anchor="middle">d 에서 a 로 되돌아온다 (확률 1)</text><circle cx="110" cy="110" r="19" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="110" y="115" text-anchor="middle">a</text><circle cx="250" cy="78" r="19" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="250" y="83" text-anchor="middle">b</text><circle cx="250" cy="170" r="19" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="250" y="175" text-anchor="middle">c</text><circle cx="386" cy="122" r="19" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text class="ink bold sm" x="386" y="127" text-anchor="middle">d</text><text class="ink bold sm" x="452" y="74" text-anchor="start">정상분포의 정의</text><text class="ink2 sm" x="452" y="94" text-anchor="start">Pr[x 에 있다] =</text><text class="ink2 sm" x="464" y="110" text-anchor="start">Σ Pr[y 에 있다]/outdeg(y)</text><text class="ink2 sm" x="464" y="126" text-anchor="start">(y → x 인 간선마다)</text><text class="ink bold sm" x="452" y="152" text-anchor="start">이 그래프의 방정식</text><text class="ink2 sm" x="452" y="170" text-anchor="start">a = d</text><text class="ink2 sm" x="452" y="186" text-anchor="start">b = a/2,  c = a/2</text><text class="ink2 sm" x="452" y="202" text-anchor="start">d = b + c</text><text class="ink2 sm" x="452" y="218" text-anchor="start">a + b + c + d = 1</text><rect x="442" y="232" width="216" height="44" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text class="ink bold sm" x="452" y="252" text-anchor="start">풀면 (1/3, 1/6, 1/6, 1/3)</text><text class="ink2 sm" x="452" y="270" text-anchor="start">a 와 d 가 두 배 중요하다</text><path d="M20 292 L660 292" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="312" text-anchor="start">진입 차수만 세면 d 가 2 로 가장 크지만, 무작위 행보는 a 와 d 를 같게 본다 — a 를 지나야 b, c 에 갈 수 있기 때문이다.</text><text class="ink2 sm" x="20" y="332" text-anchor="start">마지막 줄(합이 1)이 없으면 모두 0 도 답이 되므로 반드시 함께 세운다.</text>
</svg>