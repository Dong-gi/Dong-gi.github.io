<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 386" width="780" height="386" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">대각선 논법</title><desc id="d">무한 비트열을 여섯 줄 늘어놓고 대각선 자리를 표시한 표, 그 대각선 D 와 각 자리를 뒤집은 C, 그리고 C 가 어떤 줄과도 다를 수밖에 없다는 논증</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">목록이 무엇이든 대각선을 뒤집으면 목록에 없는 것이 만들어진다</text><rect x="20" y="46" width="452" height="320" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="246" y="66" text-anchor="middle">무한 비트열을 모두 줄 세웠다고 하자</text><rect x="125" y="79" width="30" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="165" y="109" width="30" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="205" y="139" width="30" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="245" y="169" width="30" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="285" y="199" width="30" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><rect x="325" y="229" width="30" height="30" rx="4" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.6"/><text class="sm bold" fill="var(--s1)" x="104" y="99" text-anchor="end">A₀ =</text><text class="ink bold sm" x="140" y="99" text-anchor="middle">1</text><text class="ink bold sm" x="180" y="99" text-anchor="middle">0</text><text class="ink bold sm" x="220" y="99" text-anchor="middle">0</text><text class="ink bold sm" x="260" y="99" text-anchor="middle">0</text><text class="ink bold sm" x="300" y="99" text-anchor="middle">1</text><text class="ink bold sm" x="340" y="99" text-anchor="middle">1</text><text class="ink2 sm" x="374" y="99" text-anchor="start">⋯</text><text class="sm bold" fill="var(--s1)" x="104" y="129" text-anchor="end">A₁ =</text><text class="ink bold sm" x="140" y="129" text-anchor="middle">0</text><text class="ink bold sm" x="180" y="129" text-anchor="middle">1</text><text class="ink bold sm" x="220" y="129" text-anchor="middle">1</text><text class="ink bold sm" x="260" y="129" text-anchor="middle">1</text><text class="ink bold sm" x="300" y="129" text-anchor="middle">0</text><text class="ink bold sm" x="340" y="129" text-anchor="middle">1</text><text class="ink2 sm" x="374" y="129" text-anchor="start">⋯</text><text class="sm bold" fill="var(--s1)" x="104" y="159" text-anchor="end">A₂ =</text><text class="ink bold sm" x="140" y="159" text-anchor="middle">1</text><text class="ink bold sm" x="180" y="159" text-anchor="middle">1</text><text class="ink bold sm" x="220" y="159" text-anchor="middle">1</text><text class="ink bold sm" x="260" y="159" text-anchor="middle">1</text><text class="ink bold sm" x="300" y="159" text-anchor="middle">1</text><text class="ink bold sm" x="340" y="159" text-anchor="middle">1</text><text class="ink2 sm" x="374" y="159" text-anchor="start">⋯</text><text class="sm bold" fill="var(--s1)" x="104" y="189" text-anchor="end">A₃ =</text><text class="ink bold sm" x="140" y="189" text-anchor="middle">0</text><text class="ink bold sm" x="180" y="189" text-anchor="middle">1</text><text class="ink bold sm" x="220" y="189" text-anchor="middle">0</text><text class="ink bold sm" x="260" y="189" text-anchor="middle">0</text><text class="ink bold sm" x="300" y="189" text-anchor="middle">1</text><text class="ink bold sm" x="340" y="189" text-anchor="middle">0</text><text class="ink2 sm" x="374" y="189" text-anchor="start">⋯</text><text class="sm bold" fill="var(--s1)" x="104" y="219" text-anchor="end">A₄ =</text><text class="ink bold sm" x="140" y="219" text-anchor="middle">0</text><text class="ink bold sm" x="180" y="219" text-anchor="middle">0</text><text class="ink bold sm" x="220" y="219" text-anchor="middle">1</text><text class="ink bold sm" x="260" y="219" text-anchor="middle">0</text><text class="ink bold sm" x="300" y="219" text-anchor="middle">0</text><text class="ink bold sm" x="340" y="219" text-anchor="middle">0</text><text class="ink2 sm" x="374" y="219" text-anchor="start">⋯</text><text class="sm bold" fill="var(--s1)" x="104" y="249" text-anchor="end">A₅ =</text><text class="ink bold sm" x="140" y="249" text-anchor="middle">1</text><text class="ink bold sm" x="180" y="249" text-anchor="middle">0</text><text class="ink bold sm" x="220" y="249" text-anchor="middle">0</text><text class="ink bold sm" x="260" y="249" text-anchor="middle">1</text><text class="ink bold sm" x="300" y="249" text-anchor="middle">1</text><text class="ink bold sm" x="340" y="249" text-anchor="middle">1</text><text class="ink2 sm" x="374" y="249" text-anchor="start">⋯</text><text class="ink2 sm" x="104" y="280" text-anchor="end">⋮</text><path d="M40 280 L390 280" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="sm bold" fill="var(--s2)" x="104" y="306" text-anchor="end">D =</text><text class="sm bold" fill="var(--s3)" x="104" y="334" text-anchor="end">C =</text><text class="sm bold" fill="var(--s2)" x="140" y="306" text-anchor="middle">1</text><text class="sm bold" fill="var(--s3)" x="140" y="334" text-anchor="middle">0</text><text class="sm bold" fill="var(--s2)" x="180" y="306" text-anchor="middle">1</text><text class="sm bold" fill="var(--s3)" x="180" y="334" text-anchor="middle">0</text><text class="sm bold" fill="var(--s2)" x="220" y="306" text-anchor="middle">1</text><text class="sm bold" fill="var(--s3)" x="220" y="334" text-anchor="middle">0</text><text class="sm bold" fill="var(--s2)" x="260" y="306" text-anchor="middle">0</text><text class="sm bold" fill="var(--s3)" x="260" y="334" text-anchor="middle">1</text><text class="sm bold" fill="var(--s2)" x="300" y="306" text-anchor="middle">0</text><text class="sm bold" fill="var(--s3)" x="300" y="334" text-anchor="middle">1</text><text class="sm bold" fill="var(--s2)" x="340" y="306" text-anchor="middle">1</text><text class="sm bold" fill="var(--s3)" x="340" y="334" text-anchor="middle">0</text><text class="ink2 sm" x="374" y="306" text-anchor="start">⋯</text><text class="ink2 sm" x="374" y="334" text-anchor="start">⋯</text><text class="ink2 sm" x="36" y="362" text-anchor="start">D 는 대각선, C 는 D 의 각 자리를 뒤집은 것</text><rect x="490" y="46" width="270" height="320" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="625" y="66" text-anchor="middle">왜 C 가 목록에 없는가</text><text class="ink2 sm" x="508" y="94" text-anchor="start">C 가 목록의 n 번째 줄 Aₙ 이라고 하자.</text><text class="ink2 sm" x="508" y="113" text-anchor="start">두 비트열이 같으면 모든 자리가 같으므로</text><text class="ink2 sm" x="508" y="132" text-anchor="start">특히 n 번째 자리가 같아야 한다.</text><text class="ink2 sm" x="508" y="151" text-anchor="start"></text><text class="ink2 sm" x="508" y="170" text-anchor="start">그런데 C 의 n 번째 자리는 정의상</text><text class="ink2 sm" x="508" y="189" text-anchor="start">Aₙ 의 n 번째 자리를 뒤집은 것이다.</text><text class="ink2 sm" x="508" y="208" text-anchor="start">같으면서 다르다 — 모순이다</text><text class="sm bold" fill="var(--s1)" x="508" y="250" text-anchor="start">어느 목록에서도 통한다</text><text class="ink2 sm" x="508" y="270" text-anchor="start">줄 세우는 방법을 아무리 잘 고안해도</text><text class="ink2 sm" x="508" y="289" text-anchor="start">C 를 그 방법에 넣어 다시 뒤집으면 또</text><text class="ink2 sm" x="508" y="308" text-anchor="start">빠진 것이 나온다. 그래서 무한 비트열</text><text class="ink2 sm" x="508" y="327" text-anchor="start">전체는 가산이 아니다</text><text class="sm bold" fill="var(--s2)" x="508" y="352" text-anchor="start">이 그림이 이 장의 뼈대다</text>
</svg>