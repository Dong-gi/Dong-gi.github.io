e-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="268" text-anchor="start">주의 — 균등하지 않은 공간에서 개수만 세면 틀린다. 몬티 홀의 잎 12 개가 바로 그 경우다.</text><text class="ink2 sm" x="20" y="288" text-anchor="start">먼저 ‘결과들이 같은 확률인가’ 를 확인하고, 그때만 개수 세기로 넘어간다.</text>
