<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 406" width="780" height="406" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">정렬성 원리가 성립하는 곳과 성립하지 않는 곳</title><desc id="d">음이 아닌 정수에는 최소 원소가 있고, 음의 정수와 양의 유리수에는 없다는 것을 수직선으로 보인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">조건 하나만 빼도 최소 원소는 사라진다</text><text class="bold sm sm" x="20" y="68" text-anchor="start">음이 아닌 정수 — 정렬되어 있다</text><path d="M40 104 L700 104" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="104" r="5" fill="var(--s3)"/><text class="ink2 sm" x="60" y="126" text-anchor="middle">0</text><circle cx="138" cy="104" r="5" fill="var(--s3)"/><text class="ink2 sm" x="138" y="126" text-anchor="middle">1</text><circle cx="216" cy="104" r="5" fill="var(--s3)"/><text class="ink2 sm" x="216" y="126" text-anchor="middle">2</text><circle cx="294" cy="104" r="5" fill="var(--s3)"/><text class="ink2 sm" x="294" y="126" text-anchor="middle">3</text><circle cx="372" cy="104" r="5" fill="var(--s3)"/><text class="ink2 sm" x="372" y="126" text-anchor="middle">4</text><circle cx="450" cy="104" r="5" fill="var(--s3)"/><text class="ink2 sm" x="450" y="126" text-anchor="middle">5</text><circle cx="528" cy="104" r="5" fill="var(--s3)"/><text class="ink2 sm" x="528" y="126" text-anchor="middle">6</text><circle cx="606" cy="104" r="5" fill="var(--s3)"/><text class="ink2 sm" x="606" y="126" text-anchor="middle">7</text><text class="ink2 sm" x="694" y="90" text-anchor="end">계속</text><circle cx="60" cy="104" r="11" fill="none" stroke="var(--s3)" stroke-width="2.2"/><text class="bold sm sm" x="78" y="92" text-anchor="start">최소 원소</text><text class="ink2 sm" x="20" y="150" text-anchor="start">왼쪽 끝이 있다. 아무 부분집합을 잡아도 그 안에서 왼쪽 끝이 있다</text><text class="bold sm sm" x="20" y="172" text-anchor="start">음의 정수 — 정렬되어 있지 않다</text><path d="M40 208 L700 208" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="680" cy="208" r="5" fill="var(--s2)"/><text class="ink2 sm" x="680" y="230" text-anchor="middle">-1</text><circle cx="602" cy="208" r="5" fill="var(--s2)"/><text class="ink2 sm" x="602" y="230" text-anchor="middle">-2</text><circle cx="524" cy="208" r="5" fill="var(--s2)"/><text class="ink2 sm" x="524" y="230" text-anchor="middle">-3</text><circle cx="446" cy="208" r="5" fill="var(--s2)"/><text class="ink2 sm" x="446" y="230" text-anchor="middle">-4</text><circle cx="368" cy="208" r="5" fill="var(--s2)"/><text class="ink2 sm" x="368" y="230" text-anchor="middle">-5</text><circle cx="290" cy="208" r="5" fill="var(--s2)"/><text class="ink2 sm" x="290" y="230" text-anchor="middle">-6</text><circle cx="212" cy="208" r="5" fill="var(--s2)"/><text class="ink2 sm" x="212" y="230" text-anchor="middle">-7</text><text class="ink2 sm" x="44" y="194" text-anchor="start">계속</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M102 208 L42 208"/><text class="ink2 sm" x="20" y="254" text-anchor="start">왼쪽으로 끝없이 이어진다. 최소 원소가 없다</text><text class="bold sm sm" x="20" y="276" text-anchor="start">양의 유리수 — 정렬되어 있지 않다</text><path d="M40 312 L700 312" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="680" cy="312" r="4" fill="var(--s2)"/><circle cx="370" cy="312" r="4" fill="var(--s2)"/><circle cx="266.67" cy="312" r="4" fill="var(--s2)"/><circle cx="215" cy="312" r="4" fill="var(--s2)"/><circle cx="184" cy="312" r="4" fill="var(--s2)"/><circle cx="163.33" cy="312" r="4" fill="var(--s2)"/><circle cx="148.57" cy="312" r="4" fill="var(--s2)"/><circle cx="137.5" cy="312" r="4" fill="var(--s2)"/><circle cx="128.89" cy="312" r="4" fill="var(--s2)"/><circle cx="122" cy="312" r="4" fill="var(--s2)"/><circle cx="116.36" cy="312" r="4" fill="var(--s2)"/><circle cx="111.67" cy="312" r="4" fill="var(--s2)"/><circle cx="107.69" cy="312" r="4" fill="var(--s2)"/><circle cx="104.29" cy="312" r="4" fill="var(--s2)"/><path d="M60 303 L60 321" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text class="ink2 sm" x="60" y="334" text-anchor="middle">0</text><text class="ink2 sm" x="266.67" y="334" text-anchor="middle">1/3</text><text class="ink2 sm" x="370" y="334" text-anchor="middle">1/2</text><text class="ink2 sm" x="680" y="334" text-anchor="middle">1</text><text class="ink2 sm" x="300" y="286" text-anchor="start">끝없이 왼쪽으로 몰린다</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M296 290 L94 302"/><text class="ink2 sm" x="20" y="358" text-anchor="start">0 에 가까워지지만 0 은 이 집합에 없다. 최소 원소가 없다</text><path d="M20 366 L760 366" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="392" text-anchor="start">정렬성 원리가 말하는 것은 첫째 줄의 성질이다. 나머지 두 줄은 그 성질이 공짜가 아니라는 증거다</text>
</svg>