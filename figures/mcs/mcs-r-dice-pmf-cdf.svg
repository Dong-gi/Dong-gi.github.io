<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">두 주사위 합의 pmf 와 cdf</title><desc id="d">주사위 두 개의 합의 확률질량함수와 누적분포함수를 나란히 그린 막대그래프</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">같은 확률변수를 두 방식으로 그린다 — 값마다의 확률(pmf)과 그 이하일 확률(cdf)</text><text class="ink2 sm" x="38" y="56" text-anchor="start">pmf — PDF<tspan baseline-shift="-22%" font-size="76%">T</tspan>(x) = Pr[T = x]</text><rect x="44" y="180.67" width="20" height="19.33" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><text class="ink2 sm" x="54" y="214" text-anchor="middle">2</text><rect x="70" y="161.33" width="20" height="38.67" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><text class="ink2 sm" x="80" y="214" text-anchor="middle">3</text><rect x="96" y="142" width="20" height="58" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><text class="ink2 sm" x="106" y="214" text-anchor="middle">4</text><rect x="122" y="122.67" width="20" height="77.33" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><text class="ink2 sm" x="132" y="214" text-anchor="middle">5</text><rect x="148" y="103.33" width="20" height="96.67" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><text class="ink2 sm" x="158" y="214" text-anchor="middle">6</text><rect x="174" y="84" width="20" height="116" rx="1" fill="var(--s2)" fill-opacity="0.82" stroke="var(--s2)" stroke-width="0.8"/><text class="ink2 sm" x="184" y="214" text-anchor="middle">7</text><rect x="200" y="103.33" width="20" height="96.67" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><text class="ink2 sm" x="210" y="214" text-anchor="middle">8</text><rect x="226" y="122.67" width="20" height="77.33" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><text class="ink2 sm" x="236" y="214" text-anchor="middle">9</text><rect x="252" y="142" width="20" height="58" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><text class="ink2 sm" x="262" y="214" text-anchor="middle">10</text><rect x="278" y="161.33" width="20" height="38.67" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><text class="ink2 sm" x="288" y="214" text-anchor="middle">11</text><rect x="304" y="180.67" width="20" height="19.33" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><text class="ink2 sm" x="314" y="214" text-anchor="middle">12</text><path d="M38 200 L332 200" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="30" y="84" text-anchor="end">6/36</text><text class="ink2 sm" x="30" y="142" text-anchor="end">3/36</text><text class="ink2 sm" x="30" y="204" text-anchor="end">0</text><text class="ink bold sm" x="184" y="76" text-anchor="start">합 7 이 가장 흔하다</text><text class="ink2 sm" x="44" y="232" text-anchor="start">막대 넓이의 합이 1 이다</text><text class="ink2 sm" x="372" y="56" text-anchor="start">cdf — CDF<tspan baseline-shift="-22%" font-size="76%">T</tspan>(x) = Pr[T ≤ x]</text><rect x="378" y="196.78" width="20" height="3.22" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="388" y="214" text-anchor="middle">2</text><rect x="404" y="190.33" width="20" height="9.67" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="414" y="214" text-anchor="middle">3</text><rect x="430" y="180.67" width="20" height="19.33" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="440" y="214" text-anchor="middle">4</text><rect x="456" y="167.78" width="20" height="32.22" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="466" y="214" text-anchor="middle">5</text><rect x="482" y="151.67" width="20" height="48.33" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="492" y="214" text-anchor="middle">6</text><rect x="508" y="132.33" width="20" height="67.67" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="518" y="214" text-anchor="middle">7</text><rect x="534" y="116.22" width="20" height="83.78" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="544" y="214" text-anchor="middle">8</text><rect x="560" y="103.33" width="20" height="96.67" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="570" y="214" text-anchor="middle">9</text><rect x="586" y="93.67" width="20" height="106.33" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="596" y="214" text-anchor="middle">10</text><rect x="612" y="87.22" width="20" height="112.78" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="622" y="214" text-anchor="middle">11</text><rect x="638" y="84" width="20" height="116" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><text class="ink2 sm" x="648" y="214" text-anchor="middle">12</text><path d="M372 200 L666 200" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="366" y="84" text-anchor="end">1</text><text class="ink2 sm" x="366" y="142" text-anchor="end">1/2</text><text class="ink2 sm" x="366" y="204" text-anchor="end">0</text><text class="ink2 sm" x="378" y="232" text-anchor="start">왼쪽 막대들을 차례로 쌓은 것이다</text><path d="M20 258 L640 258" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="280" text-anchor="start">두 그림에는 표본공간이 없다. 그래서 서로 다른 실험의 확률변수가 같은 pmf 를 가질 수 있다.</text><text class="ink2 sm" x="20" y="302" text-anchor="start">분포에 이름이 붙는 것이 그 때문이다 — 베르누이, 균등, 이항, 기하.</text>
</svg>