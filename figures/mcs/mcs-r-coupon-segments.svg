<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">쿠폰 수집가 문제를 구간으로 자르기</title><desc id="d">수집 과정을 새 종류가 나올 때마다 잘라 각 구간의 평균 길이를 더해 n 곱하기 조화수를 얻는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">쿠폰 수집가 — n 종류를 모두 모으기까지 몇 번 사야 하는가. 구간으로 잘라 각각의 평균을 더한다</text><rect x="44" y="66" width="68" height="40" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.3"/><text class="ink2 sm" x="78" y="91" text-anchor="middle">파랑</text><text class="ink bold sm" x="78" y="58" text-anchor="middle">X<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><text class="ink2 sm" x="78" y="124" text-anchor="middle">평균 n/n</text><rect x="120" y="66" width="68" height="40" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.3"/><text class="ink2 sm" x="154" y="91" text-anchor="middle">초록</text><text class="ink bold sm" x="154" y="58" text-anchor="middle">X<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="ink2 sm" x="154" y="124" text-anchor="middle">평균 n/(n−1)</text><rect x="196" y="66" width="124" height="40" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.3"/><text class="ink2 sm" x="230" y="91" text-anchor="middle">초록</text><text class="ink2 sm" x="286" y="91" text-anchor="middle">빨강</text><text class="ink bold sm" x="258" y="58" text-anchor="middle">X<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="ink2 sm" x="258" y="124" text-anchor="middle">평균 n/(n−2)</text><rect x="328" y="66" width="124" height="40" rx="4" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.3"/><text class="ink2 sm" x="362" y="91" text-anchor="middle">파랑</text><text class="ink2 sm" x="418" y="91" text-anchor="middle">주황</text><text class="ink bold sm" x="390" y="58" text-anchor="middle">X<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><text class="ink2 sm" x="390" y="124" text-anchor="middle">평균 n/(n−3)</text><rect x="460" y="66" width="180" height="40" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.3"/><text class="ink2 sm" x="494" y="91" text-anchor="middle">파랑</text><text class="ink2 sm" x="550" y="91" text-anchor="middle">주황</text><text class="ink2 sm" x="606" y="91" text-anchor="middle">회색</text><text class="ink bold sm" x="550" y="58" text-anchor="middle">X<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><text class="ink2 sm" x="550" y="124" text-anchor="middle">평균 n/(n−4)</text><text class="ink2 sm" x="44" y="158" text-anchor="start">구간은 새로운 종류를 얻는 순간 끝난다. k 종류를 가졌을 때 새 것이 나올 확률은 (n−k)/n 이다.</text><text class="ink2 sm" x="44" y="178" text-anchor="start">그래서 평균 시간이 n/(n−k) 다 — 평균 고장 시간 규칙이다.</text><rect x="44" y="200" width="574" height="62" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold" x="331" y="226" text-anchor="middle">Ex[T] = n/n + n/(n−1) + ⋯ + n/2 + n/1 = n·H<tspan baseline-shift="-22%" font-size="76%">n</tspan> ≈ n ln n</text><text class="ink2 sm" x="331" y="248" text-anchor="middle">주사위 여섯 눈을 모두 보려면 평균 6·H<tspan baseline-shift="-22%" font-size="76%">6</tspan> ≈ 14.7 번, 생일 365 가지는 약 2365 명</text><path d="M20 278 L640 278" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="300" text-anchor="start">16장의 조화수가 여기서 다시 나온다. 마지막 한 종류를 기다리는 데 평균 n 번이 드는 것이 합의 대부분이다.</text>
</svg>