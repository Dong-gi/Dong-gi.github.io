<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">심슨의 역설의 수치</title><desc id="d">두 학과에서는 여성 합격률이 각각 더 높지만 합치면 남성 합격률이 높아지는 막대그래프</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">심슨의 역설 — 두 학과에서 모두 여성 합격률이 높은데 전체로는 남성이 높다</text><text class="ink bold sm" x="118" y="56" text-anchor="middle">전산 (CS)</text><path d="M44 214 L192 214" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="154" width="42" height="60" rx="2" fill="var(--s1)" fill-opacity="0.75" stroke="var(--s1)" stroke-width="1"/><text class="ink bold sm" x="85" y="148" text-anchor="middle">40%</text><text class="ink2 sm" x="85" y="229" text-anchor="middle">남</text><text class="ink2 sm" x="85" y="245" text-anchor="middle">2/5</text><rect x="130" y="139" width="42" height="75" rx="2" fill="var(--s2)" fill-opacity="0.75" stroke="var(--s2)" stroke-width="1"/><text class="ink bold sm" x="151" y="133" text-anchor="middle">50%</text><text class="ink2 sm" x="151" y="229" text-anchor="middle">여</text><text class="ink2 sm" x="151" y="245" text-anchor="middle">50/100</text><text class="sm bold" x="118" y="266" text-anchor="middle">여성이 높다</text><text class="ink bold sm" x="314" y="56" text-anchor="middle">전기 (EE)</text><path d="M240 214 L388 214" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="109" width="42" height="105" rx="2" fill="var(--s1)" fill-opacity="0.75" stroke="var(--s1)" stroke-width="1"/><text class="ink bold sm" x="281" y="103" text-anchor="middle">70%</text><text class="ink2 sm" x="281" y="229" text-anchor="middle">남</text><text class="ink2 sm" x="281" y="245" text-anchor="middle">70/100</text><rect x="326" y="94" width="42" height="120" rx="2" fill="var(--s2)" fill-opacity="0.75" stroke="var(--s2)" stroke-width="1"/><text class="ink bold sm" x="347" y="88" text-anchor="middle">80%</text><text class="ink2 sm" x="347" y="229" text-anchor="middle">여</text><text class="ink2 sm" x="347" y="245" text-anchor="middle">4/5</text><text class="sm bold" x="314" y="266" text-anchor="middle">여성이 높다</text><text class="ink bold sm" x="510" y="56" text-anchor="middle">전체</text><path d="M436 214 L584 214" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="456" y="111.14" width="42" height="102.86" rx="2" fill="var(--s1)" fill-opacity="0.75" stroke="var(--s1)" stroke-width="1"/><text class="ink bold sm" x="477" y="105.14" text-anchor="middle">69%</text><text class="ink2 sm" x="477" y="229" text-anchor="middle">남</text><text class="ink2 sm" x="477" y="245" text-anchor="middle">72/105</text><rect x="522" y="136.86" width="42" height="77.14" rx="2" fill="var(--s2)" fill-opacity="0.75" stroke="var(--s2)" stroke-width="1"/><text class="ink bold sm" x="543" y="130.86" text-anchor="middle">51%</text><text class="ink2 sm" x="543" y="229" text-anchor="middle">여</text><text class="ink2 sm" x="543" y="245" text-anchor="middle">54/105</text><text class="sm bold" x="510" y="266" text-anchor="middle">남성이 높다</text><path d="M20 280 L640 280" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="300" text-anchor="start">까닭은 지원 분포다. 여성은 합격률 낮은 CS 에 100 명, 높은 EE 에 5 명 몰렸고 남성은 반대다.</text><text class="ink2 sm" x="20" y="320" text-anchor="start">조건부확률은 조건마다 다른 가중치로 평균된다. 가중치를 무시하고 비율만 더하면 반대 결론이 나온다.</text>
</svg>