<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 394" width="720" height="394" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">방향 그래프와 단순 그래프의 차이</title><desc id="d">같은 그림에서 화살표와 자기 고리를 지우면 진입차수와 진출차수가 차수 하나로 합쳐지고 간선 수가 줄어드는 것을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">방향을 지우면 무엇이 달라지는가 — 12장의 방향 그래프와 이 장의 단순 그래프</text><rect x="20" y="40" width="330" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="185" y="59" text-anchor="middle">12장: 방향 그래프</text><text class="ink2 sm" x="185" y="75" text-anchor="middle">화살표가 있고 자기 고리도 된다</text><path d="M105.21 122.98 Q145 136 184.79 122.98" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)"/><path d="M184.79 113.02 Q145 100 105.21 113.02" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M200 134 L200 192"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M184 208 L106 208"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M102.38 197.87 L187.62 128.13"/><path d="M81.2 104.56 C59.6 70 120.4 70 98.8 104.56" fill="none" stroke="var(--s2)" stroke-width="1.6" marker-end="url(#ar2)"/><circle cx="90" cy="118" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="90" y="122" text-anchor="middle" fill="var(--ink)" class="sm">a</text><circle cx="200" cy="118" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="200" y="122" text-anchor="middle" fill="var(--ink)" class="sm">b</text><circle cx="200" cy="208" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="200" y="212" text-anchor="middle" fill="var(--ink)" class="sm">c</text><circle cx="90" cy="208" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="90" y="212" text-anchor="middle" fill="var(--ink)" class="sm">d</text><text class="ink bold sm" x="101" y="248" text-anchor="middle">정점</text><text class="ink bold sm" x="163" y="248" text-anchor="middle">indeg</text><text class="ink bold sm" x="225" y="248" text-anchor="middle">outdeg</text><path d="M70 252 L256 252" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="101" y="266" text-anchor="middle">a</text><text class="ink sm" x="163" y="266" text-anchor="middle">2</text><text class="ink sm" x="225" y="266" text-anchor="middle">2</text><path d="M70 274 L256 274" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="101" y="288" text-anchor="middle">b</text><text class="ink sm" x="163" y="288" text-anchor="middle">2</text><text class="ink sm" x="225" y="288" text-anchor="middle">2</text><rect x="70" y="230" width="186" height="66" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><rect x="370" y="40" width="330" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="535" y="59" text-anchor="middle">14장: 단순 그래프</text><text class="ink2 sm" x="535" y="75" text-anchor="middle">방향이 없고 자기 고리와 겹친 간선이 없다</text><path d="M456 118 L534 118" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M550 134 L550 192" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M534 208 L456 208" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M452.38 197.87 L537.62 128.13" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="440" cy="118" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="440" y="122" text-anchor="middle" fill="var(--ink)" class="sm">a</text><circle cx="550" cy="118" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="550" y="122" text-anchor="middle" fill="var(--ink)" class="sm">b</text><circle cx="550" cy="208" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="550" y="212" text-anchor="middle" fill="var(--ink)" class="sm">c</text><circle cx="440" cy="208" r="16" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="440" y="212" text-anchor="middle" fill="var(--ink)" class="sm">d</text><text class="ink bold sm" x="451" y="248" text-anchor="middle">정점</text><text class="ink bold sm" x="513" y="248" text-anchor="middle">deg</text><path d="M420 252 L544 252" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="451" y="266" text-anchor="middle">a</text><text class="ink sm" x="513" y="266" text-anchor="middle">1</text><path d="M420 274 L544 274" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="451" y="288" text-anchor="middle">b</text><text class="ink sm" x="513" y="288" text-anchor="middle">3</text><rect x="420" y="230" width="124" height="66" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text x="556" y="248" text-anchor="start" fill="var(--s2)" class="sm">자기 고리가 없어졌고</text><text x="556" y="268" text-anchor="start" fill="var(--s1)" class="sm">두 방향 간선 한 쌍이</text><text x="556" y="288" text-anchor="start" fill="var(--s1)" class="sm">간선 하나가 되었다</text><text class="ink2 sm" x="360" y="340" text-anchor="middle">차수가 하나로 합쳐지고, 간선은 두 원소 집합 {u, v} 로 적을 수 있다</text><text class="ink2 sm" x="360" y="360" text-anchor="middle">순환의 정의도 바뀐다 — a b a 는 같은 간선을 왕복한 것이라 순환으로 세지 않는다</text><text class="ink2 sm" x="360" y="380" text-anchor="middle">그래서 단순 그래프의 순환은 길이 3 이상이다</text>
</svg>