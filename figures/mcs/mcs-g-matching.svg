<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이분 그래프의 매칭과 병목</title><desc id="d">지원자 4명과 일자리 5개 사이의 매칭을 굵은 간선으로 보이고, 세 지원자가 일 둘만 할 수 있는 병목의 예를 함께 그린 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="24" text-anchor="middle">매칭 — 왼쪽을 모두 덮을 수 있는가</text><rect x="20" y="40" width="400" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="220" y="59" text-anchor="middle">매칭이 있는 경우</text><text class="ink2 sm" x="220" y="75" text-anchor="middle">지원자마다 자기가 할 수 있는 일자리 하나씩</text><path d="M125.94 108.63 L304.06 93.37" fill="none" stroke="var(--s3)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M125.88 111.97 L304.12 134.03" fill="none" stroke="var(--grid)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M125.9 158.18 L304.1 137.82" fill="none" stroke="var(--s3)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M125.93 161.52 L304.07 178.48" fill="none" stroke="var(--grid)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M125.84 207.74 L304.16 182.26" fill="none" stroke="var(--s3)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M125.96 211.06 L304.04 222.94" fill="none" stroke="var(--grid)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M125.77 257.3 L304.23 226.7" fill="none" stroke="var(--s3)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M125.99 260.61 L304.01 267.39" fill="none" stroke="var(--grid)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110" cy="110" r="16" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="110" y="114" text-anchor="middle" fill="var(--ink)" class="sm">a</text><circle cx="110" cy="160" r="16" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="110" y="164" text-anchor="middle" fill="var(--ink)" class="sm">b</text><circle cx="110" cy="210" r="16" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="110" y="214" text-anchor="middle" fill="var(--ink)" class="sm">c</text><circle cx="110" cy="260" r="16" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><text x="110" y="264" text-anchor="middle" fill="var(--ink)" class="sm">d</text><circle cx="320" cy="92" r="16" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="320" y="96" text-anchor="middle" fill="var(--ink)" class="sm">1</text><circle cx="320" cy="136" r="16" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="320" y="140" text-anchor="middle" fill="var(--ink)" class="sm">2</text><circle cx="320" cy="180" r="16" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="320" y="184" text-anchor="middle" fill="var(--ink)" class="sm">3</text><circle cx="320" cy="224" r="16" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="320" y="228" text-anchor="middle" fill="var(--ink)" class="sm">4</text><circle cx="320" cy="268" r="16" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="320" y="272" text-anchor="middle" fill="var(--ink)" class="sm">5</text><text x="60" y="88" text-anchor="start" fill="var(--s1)" class="sm bold">지원자</text><text x="360" y="76" text-anchor="start" fill="var(--s2)" class="sm bold">일자리</text><text x="40" y="296" text-anchor="start" fill="var(--s3)" class="sm">굵은 간선 넷이 매칭이다. 지원자마다 차수가 2 이상이고 일자리마다 차수가 2 이하다</text><rect x="440" y="40" width="260" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="570" y="59" text-anchor="middle">병목이 있는 경우</text><text class="ink2 sm" x="570" y="75" text-anchor="middle">매칭이 있을 수 없다</text><path d="M525.76 120.79 L624.24 138.21" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M524.13 125.5 L625.87 179.5" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M525.76 161.21 L624.24 143.79" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M525.76 166.79 L624.24 184.21" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M524.13 202.5 L625.87 148.5" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M525.76 207.21 L624.24 189.79" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="510" cy="118" r="16" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="510" y="122" text-anchor="middle" fill="var(--ink)" class="sm">p</text><circle cx="510" cy="164" r="16" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="510" y="168" text-anchor="middle" fill="var(--ink)" class="sm">q</text><circle cx="510" cy="210" r="16" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text x="510" y="214" text-anchor="middle" fill="var(--ink)" class="sm">r</text><circle cx="640" cy="141" r="16" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><text x="640" y="145" text-anchor="middle" fill="var(--ink)" class="sm">1</text><circle cx="640" cy="187" r="16" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><text x="640" y="191" text-anchor="middle" fill="var(--ink)" class="sm">2</text><rect x="486" y="96" width="50" height="138" rx="8" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="570" y="254" text-anchor="middle" fill="var(--s2)" class="sm bold">S = {p, q, r}</text><text x="570" y="272" text-anchor="middle" fill="var(--s2)" class="sm bold">N(S) = {1, 2}</text><text x="570" y="292" text-anchor="middle" fill="var(--ink)" class="sm bold">|S| = 3 &gt; 2 = |N(S)|</text><text class="ink2 sm" x="360" y="332" text-anchor="middle">병목이 하나라도 있으면 매칭이 없다는 것은 쉽다. 홀의 정리는 그 역 — 병목이 하나도 없으면 매칭이 반드시 있다 — 을 말한다</text><text class="ink2 sm" x="360" y="352" text-anchor="middle">부분집합이 지수 개나 되는데도 조건이 충분하다는 것이 이 정리의 힘이고, 증명은 강한 귀납법이다</text>
</svg>