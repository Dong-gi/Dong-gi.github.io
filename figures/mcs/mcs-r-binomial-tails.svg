troke="var(--s3)" stroke-width="0.8"/><rect x="630" y="181.74" width="11" height="12.26" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><rect x="644" y="192.16" width="11" height="1.84" rx="1" fill="var(--s3)" fill-opacity="0.82" stroke="var(--s3)" stroke-width="0.8"/><path d="M358 194 L660 194" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="369.5" y="210" text-anchor="middle">0</text><text class="ink2 sm" x="439.5" y="210" text-anchor="middle">5</text><text class="ink2 sm" x="509.5" y="210" text-anchor="middle">10</text><text class="ink2 sm" x="579.5" y="210" text-anchor="middle">15</text><text class="ink2 sm" x="649.5" y="210" text-anchor="middle">20</text><text class="ink bold sm" x="42" y="240" text-anchor="start">강조한 부분이 꼬리(tail)다</text><text class="ink2 sm" x="42" y="260" text-anchor="start">100 번 던져 앞면이 25 번 이하일 확률은 300 만 분의 1 미만이다</text><path d="M20 276 L652 276" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="296" text-anchor="start">컴퓨터과학의 확률 분석은 대개 이 꼬리를 위에서 잡는 일이다 — 나쁜 일이 일어날 확률을 재는 것이다.</text><text class="ink2 sm" x="20" y="314" text-anchor="start">봉우리의 높이는 스털링 근사로 1/√(2πnpq) 정도임을 보일 수 있다.</text>
