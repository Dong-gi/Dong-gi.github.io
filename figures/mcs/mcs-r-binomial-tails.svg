<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 320" width="672" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이항분포의 봉우리와 꼬리</title><desc id="d">n = 20 에서 p = 1/2 와 p = 3/4 인 이항분포의 확률질량함수와 양쪽 꼬리</desc>
