<text class="ink bold sm" x="20" y="24" text-anchor="start">이항분포 — 독립인 동전 n 번 가운데 앞면이 k 번일 확률. 봉우리에서 멀어지면 급히 작아진다</text><text class="ink2 sm" x="38" y="54" text-anchor="start">p = 1/2 — 봉우리는 k = 10</text><rect x="42" y="194" width="11" height="0" rx="1" fill="var(--s2)" fill-opacity="0.82" stroke="var(--s2)" stroke-width="0.8"/><rect x="56" y="193.99" width="11" height="0.01" rx="1" fill="var(--s2)" fill-opacity="0.82" stroke="var(--s2)" stroke-width="0.8"/><rect x="70" y="193.89" width="11" height="0.11" rx="1" fill="var(--s2)" fill-opacity="0.82" stroke="var(--s2)" stroke-width="0.8"/><rect x="84" y="193.37" width="11" height="0.63" rx="1" fill="var(--s2)" fill-opacity="0.82" stroke="var(--s2)" stroke-width="0.8"/><rect x="98" y="191.32" width="11" height="2.68" rx="1" fill="var(--s2)" fill-opacity="0.82" stroke="var(--s2)" stroke-width="0.8"/><rect x="112" y="185.42" width="11" height="8.58" rx="1" fill="var(--s2)" fill-opacity="0.82" stroke="var(--s2)" stroke-width="0.8"/><rect x="126" y="172.56" width="11" height="21.44" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><rect x="140" y="151.12" width="11" height="42.88" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><rect x="154" y="124.32" width="11" height="69.68" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><rect x="168" y="101.1" width="11" height="92.9" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><rect x="182" y="91.81" width="11" height="102.19" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><rect x="196" y="101.1" width="11" height="92.9" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><rect x="210" y="124.32" width="11" height="69.68" rx="1" fill="var(--s1)" fill-opacity="0.82" stroke="var(--s1)" stroke-width="0.8"/><rect x="224" y="151.12" width="11" height="42.88" rx="1" fill="var(--s1)" 