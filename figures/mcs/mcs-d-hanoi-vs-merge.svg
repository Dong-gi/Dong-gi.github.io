<title id="t">하노이 탑과 병합정렬의 해 견주기</title><desc id="d">2의 n 제곱과 n log n 을 상용로그 축에 그려 부분문제 크기의 차이가 해의 규모를 완전히 갈라 놓는 것을 보이는 그림</desc>
