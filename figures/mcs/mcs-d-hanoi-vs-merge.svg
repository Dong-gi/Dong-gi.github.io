8 L345 77.73 L347.5 76.18 L350 74.63 L352.5 73.09 L355 71.54 L357.5 69.99 L360 68.44 L362.5 66.89 L365 65.34 L367.5 63.79 L370 62.24"/><text class="ink bold sm" x="306.86" y="122.6" text-anchor="end">하노이 T<tspan baseline-shift="-22%" font-size="76%">n</tspan> = 2T<tspan baseline-shift="-22%" font-size="76%">n−1</tspan> + 1</text><text class="ink bold sm" x="354.48" y="220.84" text-anchor="end">병합정렬 T<tspan baseline-shift="-22%" font-size="76%">n</tspan> = 2T<tspan baseline-shift="-22%" font-size="76%">n/2</tspan> + n − 1</text><circle class="f2" cx="370" cy="65.19" r="4"/><circle class="f1" cx="370" cy="229.44" r="4"/><text class="ink bold sm" x="396" y="74" text-anchor="start">n = 64 에서</text><text x="396" y="96" text-anchor="start" fill="var(--s2)" class="sm" font-weight="600">하노이  1.8 × 10¹⁹ 걸음</text><text x="396" y="114" text-anchor="start" fill="var(--s1)" class="sm" font-weight="600">병합정렬  321 번 비교</text><text class="ink2 sm" x="396" y="142" text-anchor="start">점화식의 차이는 두 곳이다</text><text class="ink bold sm" x="396" y="162" text-anchor="start">부분문제의 크기</text><text class="ink2 sm" x="406" y="178" text-anchor="start">n − 1 (거의 그대로)</text><text class="ink2 sm" x="406" y="194" text-anchor="start">n/2 (절반)</text><text class="ink bold sm" x="396" y="216" text-anchor="start">한 번의 추가 작업</text><text class="ink2 sm" x="406" y="232" text-anchor="start">1 (아주 적다)</text><text class="ink2 sm" x="406" y="248" text-anchor="start">n − 1 (많다)</text><path d="M20 274 L640 274" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="20" y="294" text-anchor="start">병합정렬이 추가 작업은 훨씬 많은데도 압도적으로 빠르다. 부분문제를 얼마나 줄이는지가 전부를 정한다.</text><text class="ink2 sm" x="20" y="314" text-anchor="start">점선은 원판 옮기기에 크기만큼 시간이 드는 하노이 변형(2·2ⁿ − n − 2)이다. 추가 작업을 1 에서 n 으로 늘려도 두 배뿐이다.</text>
