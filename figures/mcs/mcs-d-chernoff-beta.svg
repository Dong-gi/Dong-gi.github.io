<text class="ink bold sm" x="20" y="24" text-anchor="start">체르노프 한계의 지수 β(c) = c ln c − c + 1</text><path class="gr" d="M66 254 V58"/><path class="gr" d="M135 254 V58"/><path class="gr" d="M204 254 V58"/><path class="gr" d="M273 254 V58"/><path class="gr" d="M342 254 V58"/><path class="gr" d="M66 254 H342"/><path class="gr" d="M66 226 H342"/><path class="gr" d="M66 198 H342"/><path class="gr" d="M66 170 H342"/><path class="gr" d="M66 142 H342"/><path class="gr" d="M66 114 H342"/><path class="gr" d="M66 86 H342"/><path class="gr" d="M66 58 H342"/><path class="ax" marker-end="url(#ark)" d="M66 254 H352"/><path class="ax" marker-end="url(#ark)" d="M66 254 V48"/><text class="sm ink2" x="135" y="269" text-anchor="middle">1.5</text><text class="sm ink2" x="204" y="269" text-anchor="middle">2</text><text class="sm ink2" x="273" y="269" text-anchor="middle">2.5</text><text class="sm ink2" x="342" y="269" text-anchor="middle">3</text><text class="sm ink2" x="60" y="230" text-anchor="end">0.2</text><text class="sm ink2" x="60" y="202" text-anchor="end">0.4</text><text class="sm ink2" x="60" y="174" text-anchor="end">0.6</text><text class="sm ink2" x="60" y="146" text-anchor="end">0.8</text><text class="sm ink2" x="60" y="118" text-anchor="end">1</text><text class="sm ink2" x="60" y="90" text-anchor="end">1.2</text><text class="sm ink2" x="60" y="62" text-anchor="end">1.4</text><text class="sm ink2" x="356" y="258">c</text><text class="sm ink2" x="66" y="40" text-anchor="middle">β(c)</text><path class="cv s1" d="M66 254 L67.38 253.99 L68.76 253.97 L70.14 253.94 L71.52 253.89 L72.9 253.83 L74.28 253.75 L75.66 253.66 L77.04 253.56 L78.42 253.45 L79.8 253.32 L81.18 253.18 L82.56 253.03 L83.94 252.87 L85.32 252.69 L86.7 252.5 L88.08 252.3 L89.46 252.08 L90.84 251.86 L92.22 251.62 L93.6 251.37 L94.98 251.11 L96.36 250.84 L97.74 250.55 L99.12 250.26 L100.5 249.95 L101.88 249.63 L103.26 249.3 L104.64 248.96 L106.02 248.61 L107.4 248.25 L108.78 247.88 L110.16 247.49 L111.54 247.1 L112