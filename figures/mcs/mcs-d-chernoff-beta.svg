55 L301.98 115.16 L303.36 113.76 L304.74 112.36 L306.12 110.95 L307.5 109.53 L308.88 108.11 L310.26 106.69 L311.64 105.26 L313.02 103.83 L314.4 102.39 L315.78 100.95 L317.16 99.5 L318.54 98.04 L319.92 96.58 L321.3 95.12 L322.68 93.65 L324.06 92.18 L325.44 90.7 L326.82 89.22 L328.2 87.73 L329.58 86.23 L330.96 84.74 L332.34 83.23 L333.72 81.73 L335.1 80.21 L336.48 78.7 L337.86 77.18 L339.24 75.65 L340.62 74.12 L342 72.58"/><circle class="f2" cx="93.6" cy="251.37" r="4"/><circle class="f2" cx="107.4" cy="248.25" r="4"/><circle class="f2" cx="204" cy="199.92" r="4"/><path class="gr" stroke-dasharray="4 3" d="M100.5 248.4 L121.2 133.6"/><text class="ink sm" x="123.96" y="94.4" text-anchor="start">β(1.2) = 0.0188</text><text class="ink sm" x="123.96" y="116.8" text-anchor="start">β(1.3) = 0.0411</text><text class="ink2 sm" x="123.96" y="139.2" text-anchor="start">거의 0 이지만 0 은 아니다</text><text class="ink bold sm" x="212" y="203.92" text-anchor="start">β(2) = 0.386</text><text class="ink bold sm" x="380" y="74" text-anchor="start">Pr[T ≥ c·Ex[T]] ≤ e^(−β(c)·Ex[T])</text><text class="ink2 sm" x="380" y="98" text-anchor="start">β 는 지수 자리에 있고 Ex[T] 가</text><text class="ink2 sm" x="380" y="114" text-anchor="start">곱해진다. 그래서 β 가 조금만</text><text class="ink2 sm" x="380" y="130" text-anchor="start">커져도 한계는 크게 무너진다</text><text class="ink bold sm" x="380" y="156" text-anchor="start">동전 1000번, Ex[T] = 500</text><text x="380" y="176" text-anchor="start" fill="var(--s2)" class="sm" font-weight="600">c = 1.2 → 8.3 × 10⁻⁵</text><text x="380" y="194" text-anchor="start" fill="var(--s2)" class="sm" font-weight="600">c = 1.3 → 1.2 × 10⁻⁹</text><text class="ink2 sm" x="380" y="218" text-anchor="start">β 가 2배가 되었을 뿐인데</text><text class="ink2 sm" x="380" y="234" text-anchor="start">확률은 다섯 자리가 줄었다</text><text class="ink2 sm" x="380" y="256" text-anchor="start">β(1) = 0 — c = 1 에서는</text><text class="ink2 sm" x="380" y="272" text-anchor="start">아무것도 말하지 못한다</text><path d="M20 288 L640 288" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="308" text-anchor="start">β 는 c = 1 에서 0 이고 그 뒤로 자란다. 평균을 조금 넘는 것은 흔하고 크게 넘는 것은 지수적으로 드물다는 뜻이다.</text>
</svg>