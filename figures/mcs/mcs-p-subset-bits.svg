<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" width="780" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">부분집합과 비트열 사이의 전단사</title><desc id="d">원소 열 개 중 다섯 개를 고른 부분집합을 길이 10 의 비트열로 옮긴 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">부분집합 하나가 비트열 하나다</text><text class="ink2 sm" x="46" y="110" text-anchor="end">원소</text><rect x="60" y="88" width="62" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="91" y="110" text-anchor="middle">a₁</text><rect x="122" y="88" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="153" y="110" text-anchor="middle">a₂</text><rect x="184" y="88" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="215" y="110" text-anchor="middle">a₃</text><rect x="246" y="88" width="62" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="277" y="110" text-anchor="middle">a₄</text><rect x="308" y="88" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="339" y="110" text-anchor="middle">a₅</text><rect x="370" y="88" width="62" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="401" y="110" text-anchor="middle">a₆</text><rect x="432" y="88" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="463" y="110" text-anchor="middle">a₇</text><rect x="494" y="88" width="62" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="525" y="110" text-anchor="middle">a₈</text><rect x="556" y="88" width="62" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="587" y="110" text-anchor="middle">a₉</text><rect x="618" y="88" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="649" y="110" text-anchor="middle">a₁₀</text><text class="ink2 sm" x="46" y="166" text-anchor="end">비트</text><rect x="60" y="144" width="62" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="91" y="166" text-anchor="middle">0</text><rect x="122" y="144" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="153" y="166" text-anchor="middle">1</text><rect x="184" y="144" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="215" y="166" text-anchor="middle">1</text><rect x="246" y="144" width="62" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="277" y="166" text-anchor="middle">0</text><rect x="308" y="144" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="339" y="166" text-anchor="middle">1</text><rect x="370" y="144" width="62" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="401" y="166" text-anchor="middle">0</text><rect x="432" y="144" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="463" y="166" text-anchor="middle">1</text><rect x="494" y="144" width="62" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="525" y="166" text-anchor="middle">0</text><rect x="556" y="144" width="62" height="34" rx="2" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink" x="587" y="166" text-anchor="middle">0</text><rect x="618" y="144" width="62" height="34" rx="2" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.9"/><text class="ink" x="649" y="166" text-anchor="middle">1</text><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M91 124 L91 140"/><path fill="none" stroke="var(--s1)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar1)" d="M153 124 L153 140"/><path fill="none" stroke="var(--s1)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar1)" d="M215 124 L215 140"/><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M277 124 L277 140"/><path fill="none" stroke="var(--s1)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar1)" d="M339 124 L339 140"/><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M401 124 L401 140"/><path fill="none" stroke="var(--s1)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar1)" d="M463 124 L463 140"/><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M525 124 L525 140"/><path fill="none" stroke="var(--grid)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M587 124 L587 140"/><path fill="none" stroke="var(--s1)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar1)" d="M649 124 L649 140"/><text class="ink2 sm" x="60" y="74" text-anchor="start">S = { a₂, a₃, a₅, a₇, a₁₀ } 을 비트열로 옮긴 것</text><text class="ink sm" x="60" y="204" text-anchor="start">0 1 1 0 1 0 1 0 0 1 — i 번째 비트가 1 인 것이 aᵢ ∈ S 라는 뜻이다</text><path d="M20 226 L760 226" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="250" text-anchor="start">이 대응은 전단사다. 비트열에서 부분집합을 되돌릴 수 있고, 서로 다른 부분집합은 서로 다른 비트열이 된다</text><text class="ink2 sm" x="20" y="272" text-anchor="start">길이 n 인 비트열은 2ⁿ 개다. 전단사가 있으면 크기가 같으므로 원소 n 개인 집합의 부분집합은 2ⁿ 개다</text><text class="ink2 sm" x="20" y="298" text-anchor="start">세지 않고 짝을 지어 세는 것 — 이 수법이 10장에서 무한집합의 크기를 재는 유일한 방법이 된다</text>
</svg>