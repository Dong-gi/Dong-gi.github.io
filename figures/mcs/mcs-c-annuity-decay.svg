<title id="t">연금 지급액의 현재가치는 등비수열로 줄어든다</title><desc id="d">왼쪽은 해마다 받는 돈의 현재가치를 막대로 그린 것, 오른쪽은 지급 기간에 따른 연금의 총 현재가치</desc>
