<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 442" width="780" height="442" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이항관계의 다섯 가지 성질을 화살표로</title><desc id="d">함수, 전, 전사, 단사, 전단사 각각에 대해 성질을 만족하는 그림과 만족하지 않는 그림을 나란히 놓았다</desc>
