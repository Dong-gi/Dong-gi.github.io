<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">유클리드 알고리즘의 보존되는 불변량</title><desc id="d">두 예에 대해 상태 (x, y) 가 바뀌는 동안 gcd 열이 상수로 유지되는 것을 보이는 표</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="26" text-anchor="middle">유클리드 알고리즘 — 오른쪽 열이 한 줄도 바뀌지 않는다</text><text x="50" y="52" text-anchor="start" fill="var(--s1)" class="sm bold">gcd(1147, 899) = 31</text><rect x="275" y="62" width="75" height="200" rx="2" fill="var(--s3)" fill-opacity="0.15" stroke="none" stroke-width="1.3"/><text class="ink bold sm" x="87.5" y="80" text-anchor="middle">x</text><text class="ink bold sm" x="162.5" y="80" text-anchor="middle">y</text><text class="ink bold sm" x="237.5" y="80" text-anchor="middle">rem(x, y)</text><text class="ink bold sm" x="312.5" y="80" text-anchor="middle">gcd(x, y)</text><path d="M50 87 L350 87" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="87.5" y="104" text-anchor="middle">1147</text><text class="ink sm" x="162.5" y="104" text-anchor="middle">899</text><text class="ink sm" x="237.5" y="104" text-anchor="middle">248</text><text class="ink sm" x="312.5" y="104" text-anchor="middle">31</text><path d="M50 112 L350 112" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="87.5" y="129" text-anchor="middle">899</text><text class="ink sm" x="162.5" y="129" text-anchor="middle">248</text><text class="ink sm" x="237.5" y="129" text-anchor="middle">155</text><text class="ink sm" x="312.5" y="129" text-anchor="middle">31</text><path d="M50 137 L350 137" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="87.5" y="154" text-anchor="middle">248</text><text class="ink sm" x="162.5" y="154" text-anchor="middle">155</text><text class="ink sm" x="237.5" y="154" text-anchor="middle">93</text><text class="ink sm" x="312.5" y="154" text-anchor="middle">31</text><path d="M50 162 L350 162" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="87.5" y="179" text-anchor="middle">155</text><text class="ink sm" x="162.5" y="179" text-anchor="middle">93</text><text class="ink sm" x="237.5" y="179" text-anchor="middle">62</text><text class="ink sm" x="312.5" y="179" text-anchor="middle">31</text><path d="M50 187 L350 187" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="87.5" y="204" text-anchor="middle">93</text><text class="ink sm" x="162.5" y="204" text-anchor="middle">62</text><text class="ink sm" x="237.5" y="204" text-anchor="middle">31</text><text class="ink sm" x="312.5" y="204" text-anchor="middle">31</text><path d="M50 212 L350 212" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="87.5" y="229" text-anchor="middle">62</text><text class="ink sm" x="162.5" y="229" text-anchor="middle">31</text><text class="ink sm" x="237.5" y="229" text-anchor="middle">0</text><text class="ink sm" x="312.5" y="229" text-anchor="middle">31</text><path d="M50 237 L350 237" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="87.5" y="254" text-anchor="middle">31</text><text class="ink sm" x="162.5" y="254" text-anchor="middle">0</text><text class="ink sm" x="237.5" y="254" text-anchor="middle">—</text><text class="ink sm" x="312.5" y="254" text-anchor="middle">31</text><rect x="50" y="62" width="300" height="200" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text x="420" y="52" text-anchor="start" fill="var(--s1)" class="sm bold">gcd(26, 21) = 1</text><rect x="630" y="62" width="70" height="125" rx="2" fill="var(--s3)" fill-opacity="0.15" stroke="none" stroke-width="1.3"/><text class="ink bold sm" x="455" y="80" text-anchor="middle">x</text><text class="ink bold sm" x="525" y="80" text-anchor="middle">y</text><text class="ink bold sm" x="595" y="80" text-anchor="middle">rem(x, y)</text><text class="ink bold sm" x="665" y="80" text-anchor="middle">gcd(x, y)</text><path d="M420 87 L700 87" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="455" y="104" text-anchor="middle">26</text><text class="ink sm" x="525" y="104" text-anchor="middle">21</text><text class="ink sm" x="595" y="104" text-anchor="middle">5</text><text class="ink sm" x="665" y="104" text-anchor="middle">1</text><path d="M420 112 L700 112" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="455" y="129" text-anchor="middle">21</text><text class="ink sm" x="525" y="129" text-anchor="middle">5</text><text class="ink sm" x="595" y="129" text-anchor="middle">1</text><text class="ink sm" x="665" y="129" text-anchor="middle">1</text><path d="M420 137 L700 137" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="455" y="154" text-anchor="middle">5</text><text class="ink sm" x="525" y="154" text-anchor="middle">1</text><text class="ink sm" x="595" y="154" text-anchor="middle">0</text><text class="ink sm" x="665" y="154" text-anchor="middle">1</text><path d="M420 162 L700 162" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="455" y="179" text-anchor="middle">1</text><text class="ink sm" x="525" y="179" text-anchor="middle">0</text><text class="ink sm" x="595" y="179" text-anchor="middle">—</text><text class="ink sm" x="665" y="179" text-anchor="middle">1</text><rect x="420" y="62" width="280" height="125" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text x="420" y="220" text-anchor="start" fill="var(--ink2)" class="sm">두 걸음이면 x 가 절반 이하로 줄어든다.</text><text x="420" y="238" text-anchor="start" fill="var(--ink2)" class="sm">그래서 걸음 수가 자릿수에 비례한다.</text><text class="ink2 sm" x="360" y="285" text-anchor="middle">y 가 0 이 되는 순간 gcd(x, 0) = x 이므로 그때의 x 가 답이다. 표는 확인이지 증명이 아니다 —</text><text class="ink2 sm" x="360" y="305" text-anchor="middle">증명은 gcd(x, y) = gcd(y, rem(x, y)) 한 줄이 전이마다 성립함을 보이는 것이다</text>
</svg>