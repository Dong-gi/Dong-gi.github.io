<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">나무 그림이 옳은 이유</title><desc id="d">뿌리에서 잎까지 가는 한 경로의 간선 확률이 각각 조건부확률이고, 그 곱이 결과의 확률이라는 것을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="20" y="24" text-anchor="start">나무의 간선에 적은 수는 조건부확률이고, 곱하기는 곱셈 규칙이다</text><path d="M75 96 L225 76" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="150" y="74" text-anchor="middle">Pr[E<tspan baseline-shift="-22%" font-size="76%">1</tspan>]</text><text class="ink2 sm" x="150" y="108" text-anchor="middle">뿌리에서 첫 갈림</text><path d="M235 76 L385 112" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="310" y="82" text-anchor="middle">Pr[E<tspan baseline-shift="-22%" font-size="76%">2</tspan> | E<tspan baseline-shift="-22%" font-size="76%">1</tspan>]</text><text class="ink2 sm" x="310" y="116" text-anchor="middle">첫 갈림을 지난 뒤</text><path d="M395 112 L535 92" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="465" y="90" text-anchor="middle">Pr[E<tspan baseline-shift="-22%" font-size="76%">3</tspan> | E<tspan baseline-shift="-22%" font-size="76%">1</tspan> ∩ E<tspan baseline-shift="-22%" font-size="76%">2</tspan>]</text><text class="ink2 sm" x="465" y="124" text-anchor="middle">둘을 지난 뒤</text><path d="M75 96 L122 130" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M235 76 L276 40" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M395 112 L440 80" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="96" r="3.5" fill="var(--ink2)"/><circle cx="230" cy="76" r="3.5" fill="var(--ink2)"/><circle cx="390" cy="112" r="3.5" fill="var(--ink2)"/><circle cx="540" cy="92" r="4.5" fill="var(--s2)"/><text class="ink2 sm" x="70" y="84" text-anchor="middle">뿌리</text><text class="ink bold sm" x="552" y="96" text-anchor="start">잎 — 결과 하나</text><rect x="40" y="168" width="580" height="60" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text class="ink bold" x="330" y="194" text-anchor="middle">Pr[E<tspan baseline-shift="-22%" font-size="76%">1</tspan> ∩ E<tspan baseline-shift="-22%" font-size="76%">2</tspan> ∩ E<tspan baseline-shift="-22%" font-size="76%">3</tspan>] = Pr[E<tspan baseline-shift="-22%" font-size="76%">1</tspan>] · Pr[E<tspan baseline-shift="-22%" font-size="76%">2</tspan> | E<tspan baseline-shift="-22%" font-size="76%">1</tspan>] · Pr[E<tspan baseline-shift="-22%" font-size="76%">3</tspan> | E<tspan baseline-shift="-22%" font-size="76%">1</tspan> ∩ E<tspan baseline-shift="-22%" font-size="76%">2</tspan>]</text><text class="ink2 sm" x="330" y="216" text-anchor="middle">조건부확률의 정의를 세 번 쓴 것이 전부다 — 이것이 ‘경로의 수를 곱한다’ 의 정체다</text><path d="M20 250 L640 250" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="20" y="272" text-anchor="start">증명은 정의를 펼치면 분모와 분자가 차례로 지워지는 것을 보이면 끝난다. n 개 간선으로 가는 것은 귀납법이다.</text><text class="ink bold sm" x="20" y="294" text-anchor="start">그래서 간선 확률을 매길 때 물어야 할 것은 하나다 — ‘여기까지 왔다고 할 때’ 이 갈림이 얼마나 자주 일어나는가.</text><text class="ink2 sm" x="20" y="314" text-anchor="start">간선 확률의 합이 갈림마다 1 이 되는 것도 이 때문이다.</text>
</svg>