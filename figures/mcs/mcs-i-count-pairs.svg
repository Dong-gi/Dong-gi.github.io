<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 364" width="780" height="364" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">쌍과 유리수를 줄 세우기</title><desc id="d">자연수 쌍의 격자를 대각선 방향으로 훑어 각 쌍에 번호를 붙이는 경로와, 같은 방법으로 양의 유리수도 가산이 되는 설명</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">대각선을 따라 훑으면 어떤 쌍도 유한한 걸음 안에 번호를 받는다</text><rect x="20" y="46" width="440" height="286" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="240" y="66" text-anchor="middle">ℕ × ℕ 의 모든 쌍에 번호를 붙인다</text><text class="ink2 sm" x="118" y="104" text-anchor="middle">0</text><text class="ink2 sm" x="94" y="127" text-anchor="end">0</text><text class="ink2 sm" x="166" y="104" text-anchor="middle">1</text><text class="ink2 sm" x="94" y="175" text-anchor="end">1</text><text class="ink2 sm" x="214" y="104" text-anchor="middle">2</text><text class="ink2 sm" x="94" y="223" text-anchor="end">2</text><text class="ink2 sm" x="262" y="104" text-anchor="middle">3</text><text class="ink2 sm" x="94" y="271" text-anchor="end">3</text><text class="ink2 sm" x="310" y="104" text-anchor="middle">4</text><text class="ink2 sm" x="94" y="319" text-anchor="end">4</text><text class="ink2 sm" x="214" y="84" text-anchor="middle">두 번째 성분</text><text class="ink2 sm" x="54" y="223" text-anchor="middle">첫 번째</text><path d="M118 122 L166 122 L118 170 L214 122 L166 170 L118 218 L262 122 L214 170 L166 218 L118 266 L310 122 L262 170 L214 218 L166 266 L118 314 L310 170 L262 218 L214 266 L166 314 L310 218 L262 266 L214 314 L310 266 L262 314 L310 314" fill="none" stroke="var(--s1)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="118" cy="122" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="127" y="114" text-anchor="start">0</text><circle cx="166" cy="122" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="175" y="114" text-anchor="start">1</text><circle cx="214" cy="122" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="223" y="114" text-anchor="start">3</text><circle cx="262" cy="122" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="271" y="114" text-anchor="start">6</text><circle cx="310" cy="122" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="319" y="114" text-anchor="start">10</text><circle cx="118" cy="170" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="127" y="162" text-anchor="start">2</text><circle cx="166" cy="170" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="175" y="162" text-anchor="start">4</text><circle cx="214" cy="170" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="223" y="162" text-anchor="start">7</text><circle cx="262" cy="170" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="271" y="162" text-anchor="start">11</text><circle cx="310" cy="170" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="319" y="162" text-anchor="start">15</text><circle cx="118" cy="218" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="127" y="210" text-anchor="start">5</text><circle cx="166" cy="218" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="175" y="210" text-anchor="start">8</text><circle cx="214" cy="218" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="223" y="210" text-anchor="start">12</text><circle cx="262" cy="218" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="271" y="210" text-anchor="start">16</text><circle cx="310" cy="218" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="319" y="210" text-anchor="start">19</text><circle cx="118" cy="266" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="127" y="258" text-anchor="start">9</text><circle cx="166" cy="266" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="175" y="258" text-anchor="start">13</text><circle cx="214" cy="266" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="223" y="258" text-anchor="start">17</text><circle cx="262" cy="266" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="271" y="258" text-anchor="start">20</text><circle cx="310" cy="266" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="319" y="258" text-anchor="start">22</text><circle cx="118" cy="314" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="127" y="306" text-anchor="start">14</text><circle cx="166" cy="314" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="175" y="306" text-anchor="start">18</text><circle cx="214" cy="314" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="223" y="306" text-anchor="start">21</text><circle cx="262" cy="314" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="271" y="306" text-anchor="start">23</text><circle cx="310" cy="314" r="4" fill="var(--s3)"/><text class="sm bold" fill="var(--s1)" x="319" y="306" text-anchor="start">24</text><text class="ink2 sm" x="24" y="352" text-anchor="start">점 옆의 파란 수가 그 쌍이 받는 번호다. 가로로 훑으면 첫 줄에서 영원히 못 벗어나므로 대각선으로 훑어야 한다</text><rect x="478" y="46" width="282" height="286" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="619" y="66" text-anchor="middle">같은 줄 세우기로 ℚ⁺ 도 가산이다</text><text class="ink2 sm" x="496" y="92" text-anchor="start">쌍 (i, j) 를 분수 i / j 로 읽으면</text><text class="ink2 sm" x="496" y="111" text-anchor="start">ℕ × ℕ 의 줄 세우기가 곧 유리수의 줄</text><text class="ink2 sm" x="496" y="130" text-anchor="start">세우기가 된다. 중복(1/2 와 2/4)이</text><text class="ink2 sm" x="496" y="149" text-anchor="start">나오지만 문제가 아니다 — 가산이라는 것은</text><text class="ink2 sm" x="496" y="168" text-anchor="start">중복을 허용한 목록에 다 나온다는 뜻이고,</text><text class="ink2 sm" x="496" y="187" text-anchor="start">그것이 ℕ surj C 다</text><text class="sm bold" fill="var(--s2)" x="496" y="218" text-anchor="start">되돌아볼 것</text><text class="ink2 sm" x="496" y="238" text-anchor="start">유리수는 두 정수 사이를 빽빽이 메우는데도</text><text class="ink2 sm" x="496" y="257" text-anchor="start">정수보다 많지 않다. 촘촘함과 크기는</text><text class="ink2 sm" x="496" y="276" text-anchor="start">다른 이야기다</text>
</svg>