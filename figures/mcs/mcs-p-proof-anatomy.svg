<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">증명 한 편에서 각 줄이 하는 일</title><desc id="d">루트 2 가 무리수라는 귀류법 증명의 일곱 줄에, 계획 선언·가정·근거·모순·끝맺음이라는 역할을 붙인 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">읽는 사람을 위해 쓰면 줄마다 하는 일이 다르다</text><rect x="20" y="46" width="470" height="282" rx="6" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink sm" x="36" y="76" text-anchor="start">귀류법을 쓴다.</text><path d="M496 71 L516 71" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="524" y="75" text-anchor="start">계획을 먼저 밝힌다</text><text class="ink sm" x="36" y="114" text-anchor="start">√2 가 유리수라 하자. 그러면 기약분수 n / d 로 쓸 수 있다.</text><path d="M496 109 L516 109" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="524" y="113" text-anchor="start">가정을 식으로 적는다</text><text class="ink sm" x="36" y="152" text-anchor="start">양변을 제곱하면 2d² = n² 이다.</text><text class="ink sm" x="36" y="190" text-anchor="start">n² 이 짝수이므로 n 도 짝수다. n = 2k 라 하자.</text><path d="M496 185 L516 185" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="524" y="189" text-anchor="start">한 줄마다 근거를 댄다</text><text class="ink sm" x="36" y="228" text-anchor="start">2d² = 4k² 이므로 d² = 2k² 이고, 따라서 d 도 짝수다.</text><text class="ink sm" x="36" y="266" text-anchor="start">n 과 d 가 모두 짝수인데 n / d 는 기약분수였다. 모순이다.</text><path d="M496 261 L516 261" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="524" y="265" text-anchor="start">모순을 명시한다</text><text class="ink sm" x="36" y="304" text-anchor="start">따라서 √2 는 무리수다.</text><path d="M496 299 L516 299" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="524" y="303" text-anchor="start">결론을 직접 적고 끝맺는다</text><text class="ink2 sm" x="20" y="38" text-anchor="start">증명 (√2 는 무리수다)</text><text class="ink2 sm" x="20" y="356" text-anchor="start">기호를 늘어놓은 계산이 아니라 문장으로 이어진 글이어야 한다. ‘자명하다’ 로 넘어간 자리가 대개 증명이 무너진 자리다</text>
</svg>