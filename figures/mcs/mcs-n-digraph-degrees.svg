<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="360" y="26" text-anchor="middle">방향 그래프 — 진입차수의 합과 진출차수의 합은 언제나 같다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M127 110 L263 110"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M110 127 L110 228"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M266.69 120.57 L123.31 234.43"/><path d="M269.63 123.47 Q228 177.5 269.63 231.53" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)"/><path d="M290.37 231.53 Q332 177.5 290.37 123.47" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M127 245 L263 245"/><circle cx="110" cy="110" r="17" fill="none" stroke="var(--s1)" stroke-width="1.6"/><text x="110" y="114" text-anchor="middle" fill="var(--ink)" class="sm">a</text><circle cx="280" cy="110" r="17" fill="none" stroke="var(--s1)" stroke-width="1.6"/><text x="280" y="114" text-anchor="middle" fill="var(--ink)" class="sm">b</text><circle cx="280" cy="245" r="17" fill="none" stroke="var(--s1)" stroke-width="1.6"/><text x="280" y="249" text-anchor="middle" fill="var(--ink)" class="sm">c</text><circle cx="110" cy="245" r="17" fill="none" stroke="var(--s1)" stroke-width="1.6"/><text x="110" y="249" text-anchor="middle" fill="var(--ink)" class="sm">d</text><text x="215" y="285" text-anchor="middle" fill="var(--ink2)" class="sm">정점 4 개, 간선 6 개</text><text x="300" y="155" text-anchor="start" fill="var(--ink2)" class="sm">두 정점 사이에</text><text x="300" y="173" text-anchor="start" fill="var(--ink2)" class="sm">양방향 간선이 있어도 된다</text><rect x="512" y="60" width="82" height="162" rx="2" fill="var(--s3)" fill-opacity="0.15" stroke="none" stroke-width="1.3"/><rect x="594" y="60" width=