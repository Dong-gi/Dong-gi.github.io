none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text x="430" y="250" text-anchor="start" fill="var(--ink2)" class="sm">두 합이 같은 것은 둘 다 간선 수를 센 것이기 때문이다.</text><text x="430" y="268" text-anchor="start" fill="var(--ink2)" class="sm">간선마다 머리가 하나, 꼬리가 하나다.</text>
