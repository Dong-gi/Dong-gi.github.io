<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">확률의 덧셈정리</title><desc id="d">두 사건의 확률을 그냥 더하면 겹친 부분을 두 번 세게 되므로 한 번 빼 준다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><rect x="80" y="48" width="400" height="190" rx="6" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold" x="92" y="68" text-anchor="start">S</text><circle cx="240" cy="145" r="76" fill="var(--s1)" fill-opacity="0.22" stroke="var(--s1)" stroke-width="1.6"/><circle cx="336" cy="145" r="76" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="190" y="98" text-anchor="middle">A</text><text class="ink bold" x="388" y="98" text-anchor="middle">B</text><text class="ink sm" x="288" y="150" text-anchor="middle">A ∩ B</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M288 216 L288 176"/><text class="ink2 sm" x="288" y="232" text-anchor="middle">이 부분이 두 번 세어진다</text><text class="ink bold" x="290" y="274" text-anchor="middle">P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</text><text class="ink2 sm" x="290" y="300" text-anchor="middle">4장 포함배제 원리를 그대로 확률로 옮긴 것이다</text>
</svg>