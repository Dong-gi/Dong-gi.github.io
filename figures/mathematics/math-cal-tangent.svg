 196.23 L278.77 194.01 L281.52 191.76 L284.27 189.48 L287.01 187.15 L289.76 184.8 L292.51 182.41 L295.25 179.98 L298 177.52 L300.75 175.03 L303.49 172.5 L306.24 169.93 L308.99 167.34 L311.73 164.7 L314.48 162.03 L317.23 159.33 L319.98 156.59 L322.72 153.82 L325.47 151.01 L328.22 148.17 L330.96 145.29 L333.71 142.38 L336.46 139.44 L339.2 136.46 L341.95 133.44 L344.7 130.39 L347.45 127.3 L350.19 124.18 L352.94 121.03 L355.69 117.84 L358.43 114.62 L361.18 111.36 L363.93 108.06 L366.67 104.74 L369.42 101.37 L372.17 97.98 L374.92 94.54 L377.66 91.08 L380.41 87.57 L383.16 84.04 L385.9 80.47 L388.65 76.86 L391.4 73.22 L394.14 69.54 L396.89 65.83 L399.64 62.09 L402.39 58.31 L405.13 54.49 L407.88 50.64 L410.63 46.76 L413.37 42.84"/><path class="cv s3" d="M143.25 289.04 L422.53 53.65"/><path class="cv s3" stroke-dasharray="6 4" d="M140.51 280.16 L349.28 148.19"/><path class="cv s2" d="M111.2 281.32 L367.59 173.27"/><circle cx="193.61" cy="246.59" r="5" fill="var(--s2)"/><circle cx="376.75" cy="92.24" r="5" fill="var(--s1)"/><circle cx="285.18" cy="188.71" r="4.2" fill="var(--s1)"/><text class="ink sm" x="181.61" y="237.59" text-anchor="end">P (a, f(a))</text><text class="ink sm" x="368.75" y="80.24" text-anchor="end">Q (a+h, f(a+h))</text><text class="ink sm" x="276.18" y="180.71" text-anchor="end">Q′</text><text class="ink" x="285.18" y="237.59" text-anchor="middle">Δx = h</text><text class="ink" x="384.75" y="169.41" text-anchor="start">Δy</text><text class="f2 bold sm" x="312.65" y="216.68" text-anchor="start">접선</text><text class="f3 bold sm" x="381.33" y="56.06" text-anchor="end">할선</text><text class="ink bold sm" x="474" y="72" text-anchor="start">할선 PQ 의 기울기</text><text class="ink sm" x="474" y="96" text-anchor="start">= Δy / Δx</text><text class="ink sm" x="474" y="120" text-anchor="start">= (f(a+h) − f(a)) / h</text><text class="ink2 sm" x="474" y="168" text-anchor="start">h 를 줄이면 Q 가 P 로 다가가고</text><text class="ink2 sm" x="474" y="192" text-anchor="start">할선은 접선으로 다가간다.</text><text class="ink sm" x="474" y="240" text-anchor="start">그 극한값이 미분계수 f′(a) 이고</text><text class="ink sm" x="474" y="264" text-anchor="start">접선의 기울기다.</text><text class="ink2 sm" x="350" y="322" text-anchor="middle">미분은 이 그림 한 장이다 — 두 점을 잇는 기울기에서 한 점에서의 기울기로 넘어가는 일</text>
</svg>