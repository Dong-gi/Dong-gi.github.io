<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><rect x="28" y="128" width="132" height="56" rx="5" fill="none" fill-opacity="0.18" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="94" y="148" text-anchor="middle">검사받는 사람</text><text class="ink bold" x="94" y="166" text-anchor="middle">10000명</text><rect x="232" y="46" width="124" height="56" rx="5" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="1.4"/><text class="ink" x="294" y="66" text-anchor="middle">병이 있다</text><text class="ink bold" x="294" y="84" text-anchor="middle">100명</text><rect x="232" y="214" width="124" height="56" rx="5" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="294" y="234" text-anchor="middle">병이 없다</text><text class="ink bold" x="294" y="252" text-anchor="middle">9900명</text><rect x="452" y="20" width="124" height="46" rx="5" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="514" y="48" text-anchor="middle">양성  99명</text><rect x="452" y="78" width="124" height="46" rx="5" fill="none" fill-opacity="0.18" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="514" y="106" text-anchor="middle">음성  1명</text><rect x="452" y="188" width="124" height="46" rx="5" fill="var(--s2)" fill-opacity="0.3" stroke="var(--s2)" stroke-width="1.4"/><text class="ink" x="514" y="216" text-anchor="middle">양성  495명</text><rect x="452" y="246" width="124" height="46" rx="5" fill="none" fill-opacity="0.18" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="514" y="274" text-anchor="middle">음성  9405명</text><path fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar1)" d="M164 150 L228 82"/><path fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)" d="M164 162 L228 234"/><path fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M360 66 L448 46"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M360 80 L448 100"/><path fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M360 228 L448 210"/><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M360 242 L448 266"/><text class="ink2 sm" x="186" y="88" text-anchor="start">1%</text><text class="ink2 sm" x="186" y="208" text-anchor="start">99%</text><text class="ink2 sm" x="392" y="36" text-anchor="start">99%</text><text class="ink2 sm" x="396" y="104" text-anchor="start">1%</text><text class="ink2 sm" x="392" y="198" text-anchor="start">5%</text><text class="ink2 sm" x="396" y="272" text-anchor="start">95%</text><path d="M600 30 L600 240" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 sm" x="612" y="116" text-anchor="start">양성은</text><text class="ink2 sm" x="612" y="136" text-anchor="start">모두</text><text class="ink bold" x="612" y="158" text-anchor="start">594명</text><text class="ink" x="360" y="320" text-anchor="middle">양성 594명 가운데 실제로 병이 있는 사람은 99명뿐이다.  99 ÷ 594 ≈ 0.17</text><text class="ink2 sm" x="360" y="342" text-anchor="middle">검사가 99% 맞는데도 양성의 대부분이 건강한 사람인 이유는 건강한 사람이 훨씬 많기 때문이다</text>
