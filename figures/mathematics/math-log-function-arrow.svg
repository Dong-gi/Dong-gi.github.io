<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 268" width="776" height="268" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">무엇이 함수인가</title><desc id="d">정의역의 원소마다 화살표가 하나씩 정확히 나가야 함수다.</desc>
