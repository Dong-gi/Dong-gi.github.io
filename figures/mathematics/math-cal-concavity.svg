<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 332" width="700" height="332" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">볼록의 방향과 변곡점</title><desc id="d">위로 볼록한 곳에서는 접선이 곡선 위에, 아래로 볼록한 곳에서는 접선이 곡선 아래에 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
