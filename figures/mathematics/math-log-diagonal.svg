<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 336" width="700" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">칸토어의 대각선 논법</title><desc id="d">목록의 대각선 숫자를 모두 바꾸면 목록의 어느 줄과도 다른 수가 만들어진다.</desc>
