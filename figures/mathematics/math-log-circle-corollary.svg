<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 336" width="786" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">원주각 정리의 따름정리</title><desc id="d">지름의 원주각, 내접사각형의 대각, 접현각이 모두 원주각 정리에서 나온다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
