<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="393" y="26" text-anchor="middle">원주각 정리에서 바로 나오는 세 가지</text><text class="ink bold sm" x="140" y="56" text-anchor="middle">① 지름에 대한 원주각</text><circle cx="140" cy="178" r="82" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><path d="M58 178 L222 178" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 178 L222 178 L101.5 105.6 Z" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.8" stroke-linejoin="round"/><path d="M94.81 116.74 L105.95 123.44 L112.65 112.29" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="178" r="4" fill="var(--ink2)"/><text class="ink sm" x="48" y="184" text-anchor="end">A</text><circle cx="222" cy="178" r="4" fill="var(--ink2)"/><text class="ink sm" x="232" y="184" text-anchor="start">B</text><circle cx="101.5" cy="105.6" r="4" fill="var(--ink2)"/><text class="ink sm" x="101.5" y="93.6" text-anchor="middle">P</text><circle cx="140" cy="178" r="3.5" fill="var(--ink2)"/><text class="ink sm" x="146" y="194" text-anchor="start">O</text><text class="ink2 sm" x="140" y="302" text-anchor="middle">중심각이 180° 이므로 항상 90°</text><text class="ink bold sm" x="393" y="56" text-anchor="middle">② 원에 내접하는 사각형</text><circle cx="393" cy="178" r="82" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><path d="M362.28 101.97 L314.18 200.6 L423.72 254.03 L470.05 149.95 Z" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.8" stroke-linejoin="round"/><path d="M352.64 121.74 A22 22 0 0 0 382.38 110.92" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="374.94" y="140.74" text-anchor="middle">α</text><path d="M432.67 233.93 A22 22 0 0 0 403.94 244.38" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="423.72" y="228.03" text-anchor="middle">180° − α</text><circle cx="362.28" cy="101.97" r="4" fill="var(--ink2)"/><text class="ink sm" x="362.28" y="89.97" text-anchor="middle">A</text><circle cx="314.18" cy="200.6" r="4" fill="var(--ink2)"/><text class="ink sm" x="304.18" y="204.6" text-anchor="end">B</text><circle cx="423.72" cy="254.03" r="4" fill="var(--ink2)"/><text class="ink sm" x="419.72" y="272.03" text-anchor="middle">C</text><circle cx="470.05" cy="149.95" r="4" fill="var(--ink2)"/><text class="ink sm" x="480.05" y="151.95" text-anchor="start">D</text><text class="ink2 sm" x="393" y="302" text-anchor="middle">마주 보는 두 내각의 합이 180°</text><text class="ink bold sm" x="646" y="60" text-anchor="middle">③ 접선과 현이 이루는 각</text><circle cx="646" cy="168" r="78" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><path d="M530 246 L752 246" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="526" y="250" text-anchor="end">Q</text><path d="M646 246 L568.76 157.14" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M646 246 L705.75 117.86" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M568.76 157.14 L705.75 117.86" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 246 A26 26 0 0 1 628.94 226.38" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><path d="M682.68 124.48 A24 24 0 0 0 695.61 139.61" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><circle cx="646" cy="246" r="4" fill="var(--ink2)"/><text class="ink sm" x="652" y="262" text-anchor="start">T</text><circle cx="568.76" cy="157.14" r="4" fill="var(--ink2)"/><text class="ink sm" x="558.76" y="161.14" text-anchor="end">A</text><circle cx="705.75" cy="117.86" r="4" fill="var(--ink2)"/><text class="ink sm" x="715.75" y="113.86" text-anchor="start">P</text><text class="ink2 sm" x="646" y="298" text-anchor="middle">접현각 ∠ATQ 와 원주각 ∠APT 가