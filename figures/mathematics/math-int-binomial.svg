<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이항분포 — 10번 시행에서 성공 횟수의 분포</title><desc id="d">성공 확률 0.3 으로 10번 시행할 때 성공 횟수별 확률을 막대로 그린 것. 평균은 3, 표준편차는 약 1.45 이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><path class="ax" marker-end="url(#ark)" d="M68 256 H508"/><path class="ax" marker-end="url(#ark)" d="M97.66 256 V46"/><text class="sm ink2" x="91.66" y="193.33" text-anchor="end">0.1</text><text class="sm ink2" x="91.66" y="126.67" text-anchor="end">0.2</text><text class="sm ink2" x="91.66" y="60" text-anchor="end">0.3</text><text class="sm ink2" x="512" y="260">k</text><rect x="84.32" y="237.17" width="26.68" height="18.83" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="97.66" y="273" text-anchor="middle">0</text><rect x="121.38" y="175.29" width="26.68" height="80.71" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="134.72" y="273" text-anchor="middle">1</text><rect x="158.45" y="100.35" width="26.68" height="155.65" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="171.79" y="273" text-anchor="middle">2</text><rect x="195.52" y="78.11" width="26.68" height="177.89" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="208.86" y="273" text-anchor="middle">3</text><rect x="232.59" y="122.59" width="26.68" height="133.41" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="245.93" y="273" text-anchor="middle">4</text><rect x="269.66" y="187.39" width="26.68" height="68.61" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="283" y="273" text-anchor="middle">5</text><rect x="306.73" y="231.5" width="26.68" height="24.5" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="320.07" y="273" text-anchor="middle">6</text><rect x="343.8" y="250" width="26.68" height="6" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="357.14" y="273" text-anchor="middle">7</text><rect x="380.87" y="255.04" width="26.68" height="0.96" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="394.21" y="273" text-anchor="middle">8</text><rect x="417.94" y="255.91" width="26.68" height="0.09" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="431.28" y="273" text-anchor="middle">9</text><rect x="455" y="256" width="26.68" height="0" rx="2" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="468.34" y="273" text-anchor="middle">10</text><path d="M208.86 256 L208.86 66" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text class="ink" x="214.86" y="60" text-anchor="start">μ = np = 3</text><path fill="none" stroke="var(--s2)" stroke-width="1.4" marker-start="url(#ar2)" marker-end="url(#ar2)" d="M208.86 214.67 L262.58 214.67"/><text class="ink sm" x="270.58" y="218.67" text-anchor="start">σ ≈ 1.45</text><text class="ink" x="524" y="84" text-anchor="start">n = 10 번 던지고</text><text class="ink" x="524" y="106" text-anchor="start">한 번의 성공 확률이</text><text class="ink" x="524" y="128" text-anchor="start">p = 0.3 일 때</text><text class="ink2 sm" x="524" y="164" text-anchor="start">성공 횟수 k 의 분포</text><text class="ink bold" x="524" y="200" text-anchor="start">μ = np</text><text class="ink bold" x="524" y="224" text-anchor="start">σ² = np(1 − p)</text><text class="ink sm" x="330" y="300" text-anchor="middle">막대의 높이를 모두 더하면 정확히 1 이다. 이것이 확률분포라는 말의 뜻이다</text><text class="ink2 sm" x="330" y="324" text-anchor="middle">p 가 0.5 보다 작으면 왼쪽으로 치우치고, n 이 커지면 종 모양에 가까워진다</text>
</svg>