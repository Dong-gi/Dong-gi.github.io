<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">조건부확률 — 전체집합이 B 로 줄어든다</title><desc id="d">B 가 일어났음을 알면 가능한 결과가 B 안으로 제한되므로 확률의 분모가 S 에서 B 로 바뀐다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="160" y="48" text-anchor="middle">아무것도 모를 때</text><rect x="46" y="66" width="232" height="150" rx="6" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink2 sm" x="56" y="84" text-anchor="start">S</text><circle cx="126" cy="145" r="54" fill="var(--s1)" fill-opacity="0.2" stroke="var(--s1)" stroke-width="1.5"/><circle cx="196" cy="145" r="54" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold" x="90" y="106" text-anchor="middle">A</text><text class="ink bold" x="232" y="106" text-anchor="middle">B</text><text class="ink2 sm" x="160" y="236" text-anchor="middle">P(A) = A 의 크기 ÷ S 의 크기</text><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M298 145 L366 145"/><text class="ink2 sm" x="332" y="122" text-anchor="middle">B 가</text><text class="ink2 sm" x="332" y="176" text-anchor="middle">일어났다</text><text class="ink bold" x="524" y="48" text-anchor="middle">B 가 일어난 것을 안 뒤</text><rect x="400" y="66" width="248" height="150" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1" stroke-dasharray="5 4"/><circle cx="524" cy="145" r="62" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.8"/><path d="M481 101 A62 62 0 0 0 481 189 A54 54 0 0 0 481 101 Z" fill="var(--s3)" fill-opacity="0.42" stroke="none"/><text class="ink bold" x="590" y="106" text-anchor="middle">B</text><text class="ink sm" x="474" y="150" text-anchor="middle">A ∩ B</text><text class="ink2 sm" x="524" y="236" text-anchor="middle">새 전체집합은 B 다</text><text class="ink bold" x="340" y="278" text-anchor="middle">P(A | B) = P(A ∩ B) ÷ P(B)</text><text class="ink2 sm" x="340" y="300" text-anchor="middle">분모가 S 에서 B 로 바뀐 것이 조건부확률의 전부다</text>
</svg>