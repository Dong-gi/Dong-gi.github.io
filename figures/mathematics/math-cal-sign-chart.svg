<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="350" y="30" text-anchor="middle">(x + 2)(x − 1) / (x − 3) ≥ 0 의 부호표</text><path d="M130 72 L615 72" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 66 L220 78" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="220" y="58" text-anchor="middle">−2</text><path d="M220 80 L220 290" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M360 66 L360 78" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="360" y="58" text-anchor="middle">1</text><path d="M360 80 L360 290" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M500 66 L500 78" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink sm" x="500" y="58" text-anchor="middle">3</text><path d="M500 80 L500 290" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="120" y="76" text-anchor="end">x</text><text class="ink2 sm" x="120" y="115" text-anchor="end">x + 2</text><text class="ink2" x="175" y="116" text-anchor="middle">−</text><text class="ink2" x="290" y="116" text-anchor="middle">+</text><text class="ink2" x="430" y="116" text-anchor="middle">+</text><text class="ink2" x="557.5" y="116" text-anchor="middle">+</text><text class="ink2 sm" x="120" y="153" text-anchor="end">x − 1</text><text class="ink2" x="175" y="154" text-anchor="middle">−</text><text class="ink2" x="290" y="154" text-anchor="middle">−</text><text class="ink2" x="430" y="154" text-anchor="middle">+</text><text class="ink2" x="557.5" y="154" text-anchor="middle">+</text><text class="ink2 sm" x="120" y="191" text-anchor="end">x − 3</text><text class="ink2" x="175" y="192" text-anchor="middle">−</text><text class="ink2" x="290" y="192" text-anchor="middle">−</text><text class="ink2" x="430" y="192" text-anchor="middle">−</text><text class="ink2" x="557.5" y="192" text-anchor="middle">+</text><text class="ink bold sm" x="120" y="237" text-anchor="end">전체</text><text class="f2 bold" x="175" y="238" text-anchor="middle">−</text><text class="f3 bold" x="290" y="238" text-anchor="middle">+</text><text class="f2 bold" x="430" y="238" text-anchor="middle">−</text><text class="f3 bold" x="557.5" y="238" text-anchor="middle">+</text><path d="M110 208 L625 208" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="120" y="279" text-anchor="end">해</text><path d="M130 275 L615 275" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 275 L360 275" fill="none" stroke="var(--s3)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 275 L615 275" fill="none" stroke="var(--s3)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="275" r="5" fill="var(--s3)"/><circle cx="360" cy="275" r="5" fill="var(--s3)"/><circle cx="500" cy="275" r="5" fill="var(--bgfix)" stroke="var(--s2)" stroke-width="2"/><text class="ink2 sm" x="512" y="258" text-anchor="start">x = 3 은 분모가 0 이라 제외</text><text class="ink bold" x="350" y="312" text-anchor="middle">해 : −2 ≤ x ≤ 1 또는 x &gt; 3</text>
</svg>