<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 322" width="700" height="322" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">인수마다 부호를 적어 전체 부호를 얻는 부호표</title><desc id="d">각 인수가 0 이 되는 점으로 수직선을 나누고 구간마다 부호를 곱한다</desc>
<style>
