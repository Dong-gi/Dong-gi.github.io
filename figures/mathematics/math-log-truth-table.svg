<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">기본 논리 연산의 진리표</title><desc id="d">부정, 논리곱, 논리합, 조건문의 진리표. 조건문은 p 가 거짓인 두 줄에서 참이다.</desc>
