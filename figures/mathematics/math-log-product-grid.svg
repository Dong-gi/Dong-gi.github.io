<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">곱집합을 격자로 보기</title><desc id="d">A 의 원소를 가로, B 의 원소를 세로에 놓으면 순서쌍이 격자의 자리가 된다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="310" y="28" text-anchor="middle">A × B — 순서쌍을 격자의 자리로 본다</text><path d="M130 236 L500 236" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 236 L130 76" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="510" y="240" text-anchor="start">A</text><text class="ink bold sm" x="126" y="66" text-anchor="middle">B</text><text class="ink sm" x="180" y="256" text-anchor="middle">1</text><path d="M180 236 L180 100" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink sm" x="300" y="256" text-anchor="middle">2</text><path d="M300 236 L300 100" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink sm" x="420" y="256" text-anchor="middle">3</text><path d="M420 236 L420 100" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink sm" x="118" y="204" text-anchor="end">a</text><path d="M130 200 L470 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink sm" x="118" y="120" text-anchor="end">b</text><path d="M130 116 L470 116" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="180" cy="200" r="5" fill="var(--s1)"/><text class="ink sm" x="190" y="190" text-anchor="start">(1, a)</text><circle cx="180" cy="116" r="5" fill="var(--s2)"/><text class="ink sm" x="190" y="106" text-anchor="start">(1, b)</text><circle cx="300" cy="200" r="5" fill="var(--s1)"/><text class="ink sm" x="310" y="190" text-anchor="start">(2, a)</text><circle cx="300" cy="116" r="5" fill="var(--s2)"/><text class="ink sm" x="310" y="106" text-anchor="start">(2, b)</text><circle cx="420" cy="200" r="5" fill="var(--s1)"/><text class="ink sm" x="430" y="190" text-anchor="start">(3, a)</text><circle cx="420" cy="116" r="5" fill="var(--s2)"/><text class="ink sm" x="430" y="106" text-anchor="start">(3, b)</text><text class="ink2 sm" x="310" y="284" text-anchor="middle">자리가 3 × 2 = 6 개다. 원소 개수의 곱이 곱집합의 크기가 되는 이유가 이 격자다</text>
</svg>