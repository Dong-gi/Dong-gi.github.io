<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 252" width="776" height="252" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">집합 연산 네 가지</title><desc id="d">합집합, 교집합, 차집합, 여집합을 벤 다이어그램으로 나란히 보인다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
