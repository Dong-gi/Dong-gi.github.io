<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="388" y="26" text-anchor="middle">네 가지 집합 연산 — 칠한 부분이 결과다</text><rect x="14" y="46" width="182" height="158" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="105" y="67" text-anchor="middle">A ∪ B  합집합</text><path d="M40 134 a 42 42 0 1 0 84 0 a 42 42 0 1 0 -84 0 Z M84 134 a 42 42 0 1 0 84 0 a 42 42 0 1 0 -84 0 Z" fill="var(--s1)" fill-opacity="0.28" stroke="none" stroke-width="1.5"/><rect x="26" y="78" width="158" height="112" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink2 sm" x="31" y="92" text-anchor="start">U</text><circle cx="82" cy="134" r="42" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><circle cx="126" cy="134" r="42" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold sm" x="60" y="118" text-anchor="middle">A</text><text class="ink bold sm" x="148" y="118" text-anchor="middle">B</text><rect x="206" y="46" width="182" height="158" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="297" y="67" text-anchor="middle">A ∩ B  교집합</text><path d="M296 98.22 A42 42 0 0 1 296 169.78 A42 42 0 0 1 296 98.22 Z" fill="var(--s1)" fill-opacity="0.34" stroke="none" stroke-width="1.5"/><rect x="218" y="78" width="158" height="112" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink2 sm" x="223" y="92" text-anchor="start">U</text><circle cx="274" cy="134" r="42" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><circle cx="318" cy="134" r="42" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold sm" x="252" y="118" text-anchor="middle">A</text><text class="ink bold sm" x="340" y="118" text-anchor="middle">B</text><rect x="398" y="46" width="182" height="158" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="489" y="67" text-anchor="middle">A − B  차집합</text><path d="M424 134 a 42 42 0 1 0 84 0 a 42 42 0 1 0 -84 0 Z M488 98.22 A42 42 0 0 1 488 169.78 A42 42 0 0 1 488 98.22 Z" fill="var(--s1)" fill-opacity="0.28" fill-rule="evenodd" stroke="none" stroke-width="1.5"/><rect x="410" y="78" width="158" height="112" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink2 sm" x="415" y="92" text-anchor="start">U</text><circle cx="466" cy="134" r="42" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><circle cx="510" cy="134" r="42" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold sm" x="444" y="118" text-anchor="middle">A</text><text class="ink bold sm" x="532" y="118" text-anchor="middle">B</text><rect x="590" y="46" width="182" height="158" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="681" y="67" text-anchor="middle">Aᶜ  여집합</text><path d="M602 78 H760 V190 H602 Z M616 134 a 42 42 0 1 0 84 0 a 42 42 0 1 0 -84 0 Z" fill="var(--s1)" fill-opacity="0.22" fill-rule="evenodd" stroke="none" stroke-width="1.5"/><rect x="602" y="78" width="158" height="112" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink2 sm" x="607" y="92" text-anchor="start">U</text><circle cx="658" cy="134" r="42" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><circle cx="702" cy="134" r="42" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold sm" x="636" y="118" text-anchor="middle">A</text><text class="ink bold sm" x="724" y="118" text-anchor="middle">B</text><text class="ink2 sm" x="388" y="242" text-anchor="middle">여집합은 전체집합 U 를 정해 두어야 뜻이 생긴다</text>
</svg>