<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">라디안은 호의 길이를 반지름으로 잰 각이다</title><desc id="d">왼쪽은 호의 길이가 반지름과 같아지는 각이 1 라디안이라는 정의, 오른쪽은 한 바퀴가 2π 라디안이라는 환산</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="28" y="32" width="288" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="172" y="52" text-anchor="middle">1 라디안의 정의</text><circle cx="168" cy="182" r="88" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.4"/><path d="M168 182 L256 182" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M168 182 L215.55 107.95" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M256 182 A 88 88 0 0 0 215.55 107.95" fill="none" stroke="var(--s2)" stroke-width="4"/><path class="gr" d="M200 182 A32 32 0 0 0 185.29 155.07"/><text class="sm ink2" x="208.37" y="163.94" text-anchor="middle">1 rad</text><text class="ink" x="216.4" y="202" text-anchor="middle">r</text><text class="ink bold" x="168" y="80" text-anchor="middle">호의 길이 = r</text><path fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M206 86 L238.02 131"/><text class="ink2 sm" x="172" y="292" text-anchor="middle">반지름과 호의 길이가 같아지는 각 ≈ 57.3°</text><rect x="344" y="32" width="288" height="272" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="488" y="52" text-anchor="middle">한 바퀴는 2π 라디안</text><circle cx="488" cy="182" r="84" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.4"/><circle cx="488" cy="182" r="60" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="2" stroke-dasharray="6 4"/><circle cx="572" cy="182" r="4" fill="var(--s1)"/><text class="ink sm" x="582" y="187" text-anchor="start">0° = 0</text><circle cx="488" cy="98" r="4" fill="var(--s1)"/><text class="ink sm" x="488" y="86" text-anchor="middle">90° = π/2</text><circle cx="404" cy="182" r="4" fill="var(--s1)"/><text class="ink sm" x="394" y="187" text-anchor="end">180° = π</text><circle cx="488" cy="266" r="4" fill="var(--s1)"/><text class="ink sm" x="488" y="288" text-anchor="middle">270° = 3π/2</text><text class="ink bold" x="488" y="187" text-anchor="middle">2π = 360°</text>
</svg>