xt class="ink sm" x="456" y="146" text-anchor="start">f′ &lt; 0 인 구간에서 f 는 내린다</text><text class="ink sm" x="456" y="170" text-anchor="start">f′ = 0 은 방향이 바뀌는 후보</text><text class="ink2 sm" x="456" y="218" text-anchor="start">아래 그래프가 x축을 지나는 자리가</text><text class="ink2 sm" x="456" y="242" text-anchor="start">위 그래프의 봉우리와 골짜기다.</text><text class="ink2 sm" x="456" y="290" text-anchor="start">부호가 바뀌지 않고 스치기만 하면</text><text class="ink2 sm" x="456" y="314" text-anchor="start">극값이 아니다. y = x³ 의 원점이</text><text class="ink2 sm" x="456" y="338" text-anchor="start">그런 경우다.</text><text class="ink2 sm" x="350" y="398" text-anchor="middle">도함수의 그래프만 있으면 원래 함수의 개형을 그릴 수 있다. 이 장의 후반부가 그 작업이다</text>
</svg>