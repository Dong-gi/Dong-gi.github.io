<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">절댓값 두 개의 합은 거리의 합이다</title><desc id="d">|x−1| + |x+2| 는 두 점 사이에서 3 으로 일정하고 바깥에서 기울기 ±2 로 늘어난다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M70 256.4 L482 256.4"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M282.24 285 L282.24 18"/><path d="M118.98 252.9 L118.98 259.9" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="118.98" y="273.4" text-anchor="middle">−4</text><path d="M200.61 252.9 L200.61 259.9" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="200.61" y="273.4" text-anchor="middle">−2</text><path d="M363.88 252.9 L363.88 259.9" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="363.88" y="273.4" text-anchor="middle">2</text><path d="M445.51 252.9 L445.51 259.9" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="445.51" y="273.4" text-anchor="middle">4</text><path d="M278.74 137.24 L285.74 137.24" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="274.24" y="141.24" text-anchor="end">5</text><path d="M278.74 41.92 L285.74 41.92" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="274.24" y="45.92" text-anchor="end">9</text><text class="ink2 sm" x="486" y="261.4" text-anchor="start">x</text><text class="ink2 sm" x="290.24" y="18" text-anchor="start">y</text><path class="cv s1" d="M78.16 41.92 L200.61 184.91 L323.06 184.91 L445.51 41.92"/><path class="cv s3" stroke-dasharray="6 4" d="M70 137.24 L470 137.24"/><circle cx="159.8" cy="137.24" r="5" fill="var(--s2)"/><circle cx="363.88" cy="137.24" r="5" fill="var(--s2)"/><path d="M159.8 256.4 L363.88 256.4" fill="none" stroke="var(--s2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M159.8 137.24 L159.8 256.4" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M363.88 137.24 L363.88 256.4" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink" x="261.84" y="286.4" text-anchor="middle">해 : −3 ≤ x ≤ 2</text><text class="ink2 sm" x="261.84" y="174.91" text-anchor="middle">가운데는 3 으로 일정</text><text class="ink" x="505" y="66" text-anchor="start">y = |x − 1| + |x + 2|</text><text class="ink2 sm" x="505" y="114" text-anchor="start">수직선 위의 점 x 에서</text><text class="ink2 sm" x="505" y="138" text-anchor="start">1 까지의 거리와</text><text class="ink2 sm" x="505" y="162" text-anchor="start">−2 까지의 거리를 더한 값.</text><text class="ink2 sm" x="505" y="210" text-anchor="start">두 점 사이에 있으면 합이</text><text class="ink2 sm" x="505" y="234" text-anchor="start">언제나 3 (두 점의 간격).</text><text class="ink sm" x="505" y="282" text-anchor="start">y ≤ 5 인 구간이 부등식의 해</text>
</svg>