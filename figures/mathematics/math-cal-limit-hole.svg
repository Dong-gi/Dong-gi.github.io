<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 316" width="700" height="316" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">극한은 그 점에서의 함숫값과 무관하다</title><desc id="d">같은 곡선이 x = 2 에서 값이 없거나, 다른 값을 갖거나, 극한과 같은 값을 갖는 세 경우</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><rect x="42" y="64" width="176" height="158" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="130" y="44" text-anchor="middle">(1) 값이 없다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M42 222 L230 222"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M42 222 L42 52"/><path d="M122 218.5 L122 225.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="122" y="239" text-anchor="middle">2</text><path d="M38.5 129.06 L45.5 129.06" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="34" y="133.06" text-anchor="end">4</text><text class="ink2 sm" x="234" y="227" text-anchor="start">x</text><text class="ink2 sm" x="50" y="52" text-anchor="start">y</text><path class="gr" stroke-dasharray="4 3" d="M122 222 L122 129.06"/><path class="gr" stroke-dasharray="4 3" d="M42 129.06 L122 129.06"/><path class="cv s1" d="M42 175.53 L120.8 129.76"/><path class="cv s1" d="M123.2 128.36 L214 75.62"/><circle cx="122" cy="129.06" r="4.5" fill="var(--bgfix)" stroke="var(--s1)" stroke-width="2"/><text class="ink sm" x="130" y="250" text-anchor="middle">x = 2 에서</text><text class="ink sm" x="130" y="268" text-anchor="middle">정의되지 않는다</text><rect x="262" y="64" width="176" height="158" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="350" y="44" text-anchor="middle">(2) 값이 따로 있다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M262 222 L450 222"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M262 222 L262 52"/><path d="M342 218.5 L342 225.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="342" y="239" text-anchor="middle">2</text><path d="M258.5 129.06 L265.5 129.06" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="254" y="133.06" text-anchor="end">4</text><text class="ink2 sm" x="454" y="227" text-anchor="start">x</text><text class="ink2 sm" x="270" y="52" text-anchor="start">y</text><path class="gr" stroke-dasharray="4 3" d="M342 222 L342 129.06"/><path class="gr" stroke-dasharray="4 3" d="M262 129.06 L342 129.06"/><path class="cv s1" d="M262 175.53 L340.8 129.76"/><path class="cv s1" d="M343.2 128.36 L434 75.62"/><circle cx="342" cy="129.06" r="4.5" fill="var(--bgfix)" stroke="var(--s1)" stroke-width="2"/><circle cx="342" cy="198.76" r="4.5" fill="var(--s2)"/><text class="ink sm" x="350" y="250" text-anchor="middle">f(2) = 1 이라고</text><text class="ink sm" x="350" y="268" text-anchor="middle">따로 정해 두었다</text><rect x="482" y="64" width="176" height="158" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="570" y="44" text-anchor="middle">(3) 값이 극한과 같다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M482 222 L670 222"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M482 222 L482 52"/><path d="M562 218.5 L562 225.5" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="562" y="239" text-anchor="middle">2</text><path d="M478.5 129.06 L485.5 129.06" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="474" y="133.06" text-anchor="end">4</text><text class="ink2 sm" x="674" y="227" text-anchor="start">x</text><text class="ink2 sm" x="490" y="52" text-anchor="start">y</text><path class="gr" stroke-dasharray="4 3" d="M562 222 L562 129.06"/><path class="gr" stroke-dasharray="4 3" d="M482 129.06 L562 129.06"/><path class="cv s1" d="M482 175.53 L560.8 129.76"/><path class="cv s1" d="M563.2 128.36 L654 75.62"/><circle cx="562" cy="129.06" r="4.5" fill="var(--s1)"/><text class="ink sm" x="570" y="250" text-anchor="middle">f(2) = 4 다.</text><text class="ink sm" x="570" y="268" text-anchor="middle">이때만 연속이라 부른다</text><text class="ink bold" x="350" y="300" text-anchor="middle">셋 다 x → 2 일 때 함숫값은 4 에 가까워진다. 극한은 x = 2 에 무슨 일이 있든 상관하지 않는다</text>
</svg>