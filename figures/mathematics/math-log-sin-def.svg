<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" width="750" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">직각삼각형의 삼각비</title><desc id="d">닮음 때문에 변의 비가 각만으로 정해진다. 45° 와 30°·60° 의 값은 두 삼각형에서 바로 읽는다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="375" y="26" text-anchor="middle">직각삼각형의 삼각비 — 각이 같으면 비도 같다</text><path d="M50 258 L260 258 L260 132 Z" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1.9" stroke-linejoin="round"/><path d="M155 258 L155 195" fill="none" stroke="var(--s2)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M248 258 L248 246 L260 246" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 258 L145 248 L155 248" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 258 A40 40 0 0 0 84.3 237.42" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="103" y="247.32" text-anchor="middle">θ</text><circle cx="50" cy="258" r="3.5" fill="var(--ink2)"/><text class="ink2 sm" x="155" y="300" text-anchor="middle">작은 삼각형과 큰 삼각형은 닮음</text><text class="ink sm" x="150" y="174" text-anchor="middle">빗변</text><text class="ink sm" x="276" y="198" text-anchor="start">높이 (θ 의 대변)</text><text class="ink sm" x="155" y="276" text-anchor="middle">밑변 (θ 의 이웃변)</text><path d="M388 58 L388 300" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="404" y="80" text-anchor="start">sin θ = 높이 ÷ 빗변</text><text class="ink bold sm" x="404" y="104" text-anchor="start">cos θ = 밑변 ÷ 빗변</text><text class="ink bold sm" x="404" y="128" text-anchor="start">tan θ = 높이 ÷ 밑변</text><text class="ink2 sm" x="404" y="152" text-anchor="start">크기와 무관하게 θ 만으로 정해진다</text><path d="M416 268 L496 268 L496 188 Z" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8" stroke-linejoin="round"/><path d="M486 268 L486 258 L496 258" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M442 268 A26 26 0 0 0 434.38 249.62" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="453.88" y="256.31" text-anchor="middle">45°</text><text class="ink sm" x="456" y="286" text-anchor="middle">1</text><text class="ink sm" x="504" y="232" text-anchor="start">1</text><text class="ink sm" x="442" y="216" text-anchor="middle">√2</text><path d="M572 268 L642 268 L642 147 Z" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.8" stroke-linejoin="round"/><path d="M632 268 L632 258 L642 258" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 268 A28 28 0 0 0 586.02 243.76" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="609.25" y="250.52" text-anchor="middle">60°</text><path d="M629.98 167.77 A24 24 0 0 0 642 171" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="631.89" y="188.67" text-anchor="middle">30°</text><text class="ink sm" x="607" y="286" text-anchor="middle">1</text><text class="ink sm" x="650" y="212" text-anchor="start">√3</text><text class="ink sm" x="590" y="200" text-anchor="middle">2</text><text class="ink2 sm" x="528" y="306" text-anchor="middle">자주 쓰는 두 삼각형</text>
</svg>