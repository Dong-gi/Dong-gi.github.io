<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">1부터 n 까지의 합</title><desc id="d">같은 계단 두 벌을 맞물려 n(n+1) 칸의 직사각형을 만든다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="350" y="30" text-anchor="middle">1 + 2 + 3 + 4 + 5 을 두 벌 맞물리면</text><rect x="132" y="66" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="164" y="66" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="196" y="66" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="228" y="66" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="260" y="66" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="292" y="66" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="132" y="98" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="164" y="98" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="196" y="98" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="228" y="98" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="260" y="98" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="292" y="98" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="132" y="130" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="164" y="130" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="196" y="130" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="228" y="130" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="260" y="130" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="292" y="130" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="132" y="162" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="164" y="162" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="196" y="162" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="228" y="162" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="260" y="162" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="292" y="162" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="132" y="194" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="164" y="194" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="196" y="194" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="228" y="194" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="260" y="194" width="32" height="32" rx="2" fill="var(--s1)" fill-opacity="0.26" stroke="var(--s1)" stroke-width="1.2"/><rect x="292" y="194" width="32" height="32" rx="2" fill="var(--s2)" fill-opacity="0.22" stroke="var(--s2)" stroke-width="1.2"/><rect x="132" y="66" width="192" height="160" rx="3" fill="none" fill-opacity="1" stroke="var(--ink)" stroke-width="2"/><text class="ink2 sm" x="228" y="54" text-anchor="middle">n + 1 = 6 칸</text><path d="M118 66 L110 66 L110 226 L118 226" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="102" y="150" text-anchor="end">n = 5 줄</text><text class="ink sm" x="372" y="100" text-anchor="start">파란 계단 = 1+2+3+4+5</text><text class="ink sm" x="372" y="126" text-anchor="start">주황 계단 = 5+4+3+2+1</text><text class="ink sm" x="372" y="158" text-anchor="start">둘을 더하면 직사각형</text><text class="ink bold" x="372" y="182" text-anchor="start">5 × 6 = 30 칸</text><text class="ink sm" x="372" y="214" text-anchor="start">따라서 한 벌은 30 ÷ 2 = 15</text><text class="ink bold sm" x="372" y="240" text-anchor="start">일반형은 n(n+1) ÷ 2</text><text class="ink2 sm" x="350" y="286" text-anchor="middle">그림은 n = 5 만 보여 준다. 모든 n 에 대해 성립함을 보이려면 귀납법이 필요하다</text>
</svg>