<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">유리수의 조밀성 — 두 유리수 사이에 늘 또 다른 유리수가 있다</title><desc id="d">구간을 절반씩 계속 자르는 그림. 중점을 취하는 일이 끝나지 않으므로 유리수는 조밀하다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink" x="66" y="36" text-anchor="start">두 유리수 사이의 중점도 유리수다. 그 중점과 a 사이에 또 중점이 있다.</text><text class="ink2 sm" x="66" y="56" text-anchor="start">이 과정은 끝나지 않는다 — 아무리 좁은 구간에도 유리수가 무한히 많다.</text><path d="M62.08 180 L582.88 180" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M72 180 L72 187" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="72" y="204" text-anchor="middle">0</text><path d="M568 180 L568 187" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="568" y="204" text-anchor="middle">1</text><path d="M161.28 175 Q 329.92 106 498.56 175" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="329.92" cy="180" r="4" fill="var(--s2)"/><path d="M161.28 175 Q 245.6 132 329.92 175" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="245.6" cy="180" r="4" fill="var(--s2)"/><path d="M161.28 175 Q 203.44 154 245.6 175" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="203.44" cy="180" r="4" fill="var(--s2)"/><circle cx="161.28" cy="180" r="5" fill="var(--s1)"/><circle cx="498.56" cy="180" r="5" fill="var(--s1)"/><text class="ink" x="161.28" y="204" text-anchor="middle">a</text><text class="ink" x="498.56" y="204" text-anchor="middle">b</text><text class="ink" x="329.92" y="98" text-anchor="middle">(a+b)/2</text>
</svg>