<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">직각삼각형의 삼각비를 단위원 위의 좌표로 넓힌다</title><desc id="d">왼쪽은 예각에서만 쓸 수 있는 직각삼각형의 비, 오른쪽은 어떤 각에서도 쓸 수 있는 단위원 위 점의 좌표</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="24" y="30" width="300" height="286" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="174" y="50" text-anchor="middle">5장 — 직각삼각형의 비</text><text class="ink2 sm" x="174" y="67" text-anchor="middle">0° 와 90° 사이에서만 뜻이 있다</text><path d="M76 256 L268 256 L268 116 Z" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="2"/><path class="gr" fill="none" d="M255 256 L255 243 L268 243"/><path class="gr" d="M116 256 A40 40 0 0 0 108.36 232.49"/><text class="sm ink2" x="127.36" y="243.31" text-anchor="middle">θ</text><text class="ink2 sm" x="172" y="276" text-anchor="middle">밑변 a</text><text class="ink2 sm" x="276" y="190" text-anchor="start">높이 b</text><text class="ink2 sm" x="152" y="174" text-anchor="middle">빗변 c</text><text class="ink" x="174" y="300" text-anchor="middle">sin θ = b/c,  cos θ = a/c,  tan θ = b/a</text><rect x="352" y="30" width="304" height="286" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="504" y="50" text-anchor="middle">7장 — 단위원</text><text class="ink2 sm" x="504" y="67" text-anchor="middle">반지름 1 인 원. 어떤 각에서도 뜻이 있다</text><circle cx="516" cy="190" r="84" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.4"/><path d="M414 190 L618 190" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M516 286 L516 88" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M516 190 L459.79 127.58" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M459.79 127.58 L459.79 190" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M459.79 127.58 L516 127.58" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M516 190 L516 127.58" fill="none" stroke="var(--s2)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M516 190 L459.79 190" fill="none" stroke="var(--s3)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="459.79" cy="127.58" r="5" fill="var(--s1)"/><path class="gr" d="M546 190 A30 30 0 0 0 495.93 167.71"/><text class="ink2 sm" x="501" y="154" text-anchor="middle">θ</text><text class="ink bold" x="505" y="94" text-anchor="end">P(cos θ, sin θ)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M470 100 L461.79 119.58"/><text class="ink2 sm" x="526" y="134.58" text-anchor="start">sin θ</text><text class="ink2 sm" x="487.9" y="210" text-anchor="middle">cos θ &lt; 0</text><text class="ink2 sm" x="558" y="182" text-anchor="middle">1</text><text class="ink2 sm" x="504" y="302" text-anchor="middle">좌표를 그대로 읽으면 부호까지 함께 나온다</text>
</svg>