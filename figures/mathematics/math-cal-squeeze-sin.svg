<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">부채꼴 넓이를 견주어 sin x 와 x 의 비를 구한다</title><desc id="d">반지름 1 인 원에서 삼각형 OAT, 부채꼴 OAT, 삼각형 OBT 의 넓이가 차례로 커진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><rect x="26" y="56" width="200" height="180" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="126" y="36" text-anchor="middle">삼각형 OAT</text><path d="M64 216 L192 216 L159.12 130.35 Z" fill="var(--s1)" fill-opacity="0.28" stroke="none" stroke-width="1.4"/><path d="M192 216 A128 128 0 0 0 64 88" fill="none" stroke="var(--grid)" stroke-width="1.3"/><path d="M64 216 L210 216" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 216 L64 70" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 216 L192 100.75" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M192 216 L192 100.75" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M159.12 130.35 L192 216" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="64" cy="216" r="3.2" fill="var(--ink2)"/><circle cx="192" cy="216" r="3.2" fill="var(--ink2)"/><circle cx="159.12" cy="130.35" r="3.6" fill="var(--ink2)"/><circle cx="192" cy="100.75" r="3.2" fill="var(--ink2)"/><text class="ink2 sm" x="52" y="232" text-anchor="middle">O</text><text class="ink2 sm" x="194" y="234" text-anchor="middle">T</text><text class="ink2 sm" x="147.12" y="126.35" text-anchor="end">A</text><text class="ink2 sm" x="200" y="104.75" text-anchor="start">B</text><path class="gr" d="M104 216 A40 40 0 0 0 93.73 189.23"/><text class="sm ink2" x="114.41" y="200.65" text-anchor="middle">x</text><text class="ink" x="126" y="254" text-anchor="middle">넓이 = ½ · 1 · sin x</text><rect x="250" y="56" width="200" height="180" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="350" y="36" text-anchor="middle">부채꼴 OAT</text><path d="M288 216 L416 216 A128 128 0 0 0 383.12 130.35 Z" fill="var(--s3)" fill-opacity="0.3" stroke="none"/><path d="M416 216 A128 128 0 0 0 288 88" fill="none" stroke="var(--grid)" stroke-width="1.3"/><path d="M288 216 L434 216" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M288 216 L288 70" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M288 216 L416 100.75" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M416 216 L416 100.75" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="288" cy="216" r="3.2" fill="var(--ink2)"/><circle cx="416" cy="216" r="3.2" fill="var(--ink2)"/><circle cx="383.12" cy="130.35" r="3.6" fill="var(--ink2)"/><circle cx="416" cy="100.75" r="3.2" fill="var(--ink2)"/><text class="ink2 sm" x="276" y="232" text-anchor="middle">O</text><text class="ink2 sm" x="418" y="234" text-anchor="middle">T</text><text class="ink2 sm" x="371.12" y="126.35" text-anchor="end">A</text><text class="ink2 sm" x="424" y="104.75" text-anchor="start">B</text><path class="gr" d="M328 216 A40 40 0 0 0 317.73 189.23"/><text class="sm ink2" x="338.41" y="200.65" text-anchor="middle">x</text><text class="ink" x="350" y="254" text-anchor="middle">넓이 = ½ · 1² · x</text><rect x="474" y="56" width="200" height="180" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="574" y="36" text-anchor="middle">삼각형 OBT</text><path d="M512 216 L640 216 L640 100.75 Z" fill="var(--s2)" fill-opacity="0.26" stroke="none" stroke-width="1.4"/><path d="M640 216 A128 128 0 0 0 512 88" fill="none" stroke="var(--grid)" stroke-width="1.3"/><path d="M512 216 L658 216" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M512 216 L512 70" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M512 216 L640 100.75" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 216 L640 100.75" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="512" cy="216" r="3.2" fill="var(--ink2)"/><circle cx="640" cy="216" r="3.2" fill="var(--ink2)"/><circle cx="607.12" cy="130.35" r="3.6" fill="var(--ink2)"/><circle cx="640" cy="100.75" r="3.2" fill="var(--ink2)"/><text class="ink2 sm" x="500" y="232" text-anchor="middle">O</text><text class="ink2 sm" x="642" y="234" text-anchor="middle">T</text><text class="ink2 sm" x="595.12" y="126.35" text-anchor="end">A</text><text class="ink2 sm" x="648" y="104.75" text-anchor="start">B</text><path class="gr" d="M552 216 A40 40 0 0 0 541.73 189.23"/><text class="sm ink2" x="562.41" y="200.65" text-anchor="middle">x</text><text class="ink" x="574" y="254" text-anchor="middle">넓이 = ½ · 1 · tan x</text><text class="ink bold" x="226" y="150" text-anchor="middle">⊂</text><text class="ink bold" x="450" y="150" text-anchor="middle">⊂</text><text class="ink bold" x="350" y="288" text-anchor="middle">0 &lt; x &lt; π/2 에서 세 영역은 차례로 포함되므로      ½ sin x  &lt;  ½ x  &lt;  ½ tan x</text><text class="ink" x="350" y="314" text-anchor="middle">양변을 ½ sin x 로 나누면   1  &lt;  x / sin x  &lt;  1 / cos x</text><text class="ink" x="350" y="338" text-anchor="middle">x → 0 이면 오른쪽 끝이 1 로 가고, 가운데도 1 로 갈 수밖에 없다</text><text class="ink2 sm" x="350" y="360" text-anchor="middle">반지름이 1 이고 각을 라디안으로 재기 때문에 부채꼴 넓이가 ½ x 로 단순해진다. 도수로 쟀다면 이 결과는 나오지 않는다</text>
</svg>