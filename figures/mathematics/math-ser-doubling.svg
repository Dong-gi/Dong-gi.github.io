<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">두 배씩 늘어나는 항의 합은 다음 항보다 1 작다</title><desc id="d">길이 1, 2, 4, 8, 16 인 막대를 이어 붙이면 길이 32 인 막대 하나에 1 만큼 모자란다는 것을 보이는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="46" y="62" width="512" height="38" rx="0" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.8"/><text class="ink bold" x="302" y="87" text-anchor="middle">2⁵ = 32</text><text class="ink2 sm" x="46" y="50" text-anchor="start">다음 막대 하나</text><rect x="46" y="152" width="16" height="38" rx="0" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold" x="54" y="177" text-anchor="middle">1</text><rect x="62" y="152" width="32" height="38" rx="0" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold" x="78" y="177" text-anchor="middle">2</text><rect x="94" y="152" width="64" height="38" rx="0" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold" x="126" y="177" text-anchor="middle">4</text><rect x="158" y="152" width="128" height="38" rx="0" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold" x="222" y="177" text-anchor="middle">8</text><rect x="286" y="152" width="256" height="38" rx="0" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.8"/><text class="ink bold" x="414" y="177" text-anchor="middle">16</text><text class="ink2 sm" x="46" y="140" text-anchor="start">앞의 막대를 모두 이어 붙인 것 — 1 + 2 + 4 + 8 + 16 = 31</text><rect x="542" y="152" width="16" height="38" rx="0" fill="var(--s3)" fill-opacity="0.3" stroke="var(--s3)" stroke-width="1.8"/><path d="M550 198 L550 220" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="550" y="236" text-anchor="middle">1 만큼 모자란다</text><path d="M558 100 L558 152" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M542 100 L542 152" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink bold" x="46" y="272" text-anchor="start">1 + 2 + 4 + 8 + 16 = 2⁵ − 1</text><text class="ink2 sm" x="46" y="296" text-anchor="start">어느 항이든 그 앞의 모든 항을 합친 것보다 정확히 1 만큼 크다. 그래서 부분합은 다음 항에서 1 을 뺀 값이고,</text><text class="ink2 sm" x="46" y="314" text-anchor="start">배열을 두 배씩 늘리며 옮긴 총 횟수가 마지막 크기의 두 배를 넘지 못하는 이유도 이 그림 하나다.</text>
</svg>