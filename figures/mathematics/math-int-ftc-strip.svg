<title id="t">미적분학의 기본정리 — 넓이를 h 만큼 늘려 보면</title><desc id="d">x 에서 x+h 까지 늘어난 넓이는 높이 f(x), 너비 h 인 직사각형에 가깝다. h 를 0 으로 보내면 넓이 함수의 도함수가 f(x) 가 된다</desc>
