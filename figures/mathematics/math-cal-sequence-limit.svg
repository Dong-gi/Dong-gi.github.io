<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 318" width="700" height="318" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">수렴하는 수열과 진동하는 수열</title><desc id="d">1/n 은 어떤 폭의 띠를 잡아도 어느 항부터 그 안에 머물지만, 1 과 −1 을 오가는 수열은 그렇지 않다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
