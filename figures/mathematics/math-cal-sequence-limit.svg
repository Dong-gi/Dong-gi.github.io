xt class="ink2 sm" x="620.62" y="169" text-anchor="middle">12</text><path d="M384.5 217.19 L391.5 217.19" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="380" y="221.19" text-anchor="end">−1</text><path d="M384.5 86.81 L391.5 86.81" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="380" y="90.81" text-anchor="end">1</text><text class="ink2 sm" x="656" y="157" text-anchor="start">n</text><text class="ink2 sm" x="396" y="52" text-anchor="start">b<tspan baseline-shift="-22%" font-size="76%">n</tspan></text><circle cx="407.38" cy="217.19" r="3.6" fill="var(--s2)"/><circle cx="426.77" cy="86.81" r="3.6" fill="var(--s2)"/><circle cx="446.15" cy="217.19" r="3.6" fill="var(--s2)"/><circle cx="465.54" cy="86.81" r="3.6" fill="var(--s2)"/><circle cx="484.92" cy="217.19" r="3.6" fill="var(--s2)"/><circle cx="504.31" cy="86.81" r="3.6" fill="var(--s2)"/><circle cx="523.69" cy="217.19" r="3.6" fill="var(--s2)"/><circle cx="543.08" cy="86.81" r="3.6" fill="var(--s2)"/><circle cx="562.46" cy="217.19" r="3.6" fill="var(--s2)"/><circle cx="581.85" cy="86.81" r="3.6" fill="var(--s2)"/><circle cx="601.23" cy="217.19" r="3.6" fill="var(--s2)"/><circle cx="620.62" cy="86.81" r="3.6" fill="var(--s2)"/><text class="ink bold" x="634.18" y="116.15" text-anchor="end">b<tspan baseline-shift="-22%" font-size="76%">n</tspan> = (−1) 의 n 제곱</text><text class="ink2 sm" x="393.82" y="144.18" text-anchor="start">어느 값에도 가까워지지 않는다</text><text class="ink" x="188" y="268" text-anchor="middle">어떤 폭의 띠를 그려도</text><text class="ink" x="188" y="288" text-anchor="middle">유한 개만 밖에 남는다</text><text class="ink" x="514" y="268" text-anchor="middle">폭 1 짜리 띠를 그리면</text><text class="ink" x="514" y="288" text-anchor="middle">언제나 무한히 많이 밖에 남는다</text><text class="ink2 sm" x="350" y="310" text-anchor="middle">수렴한다는 말의 뜻은 ‘어떤 오차 폭을 잡아도 결국 그 안에 들어와 머문다’ 이다</text>
</svg>