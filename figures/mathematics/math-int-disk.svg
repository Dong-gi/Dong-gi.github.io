<title id="t">회전체의 부피 — 얇은 원판으로 썰어 더한다</title><desc id="d">x축을 축으로 회전시킨 입체를 x 자리에서 얇게 썰면 반지름 f(x) 인 원판이 된다. 그 넓이 πf(x)² 를 적분하면 부피가 나온다</desc>
