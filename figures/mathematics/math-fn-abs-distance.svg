<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">절댓값을 거리로 읽으면 절댓값 부등식이 구간이 된다</title><desc id="d">위는 두 점 사이 거리로서의 절댓값, 아래는 a 를 중심으로 반지름 r 인 구간</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink" x="58" y="40" text-anchor="start">절댓값은 거리다 — |x − a| 는 수직선에서 x 와 a 사이의 거리</text><path d="M75.6 116 L568.4 116" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M98 116 L98 122" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="98" y="138" text-anchor="middle">-4</text><path d="M154 116 L154 122" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="154" y="138" text-anchor="middle">-3</text><path d="M210 116 L210 122" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="210" y="138" text-anchor="middle">-2</text><path d="M266 116 L266 122" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="266" y="138" text-anchor="middle">-1</text><path d="M322 116 L322 122" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="322" y="138" text-anchor="middle">0</text><path d="M378 116 L378 122" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="378" y="138" text-anchor="middle">1</text><path d="M434 116 L434 122" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="434" y="138" text-anchor="middle">2</text><path d="M490 116 L490 122" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="490" y="138" text-anchor="middle">3</text><path d="M546 116 L546 122" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="546" y="138" text-anchor="middle">4</text><circle cx="266" cy="116" r="5" fill="var(--s1)"/><circle cx="490" cy="116" r="5" fill="var(--s2)"/><text class="ink" x="266" y="102" text-anchor="middle">a = −1</text><text class="ink" x="490" y="102" text-anchor="middle">x = 3</text><path d="M266 80 L490 80" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M266 74 L266 86" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 74 L490 86" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="378" y="70" text-anchor="middle">|3 − (−1)| = 4</text><text class="ink" x="58" y="176" text-anchor="start">그래서 |x − a| &lt; r 은 ‘a 에서 r 보다 가까운 점’, 곧 하나의 구간이다</text><path d="M75.6 220 L568.4 220" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M154 220 L378 220" fill="none" stroke="var(--s1)" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="154" cy="220" r="5.5" fill="var(--bgfix)" stroke="var(--s1)" stroke-width="2"/><circle cx="378" cy="220" r="5.5" fill="var(--bgfix)" stroke="var(--s1)" stroke-width="2"/><circle cx="266" cy="220" r="4" fill="var(--ink)"/><text class="ink" x="266" y="242" text-anchor="middle">a</text><text class="ink2 sm" x="154" y="242" text-anchor="middle">a − r</text><text class="ink2 sm" x="378" y="242" text-anchor="middle">a + r</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M266 200 L158 200"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M266 200 L374 200"/><text class="ink2 sm" x="210" y="192" text-anchor="middle">r</text><text class="ink2 sm" x="322" y="192" text-anchor="middle">r</text>
</svg>