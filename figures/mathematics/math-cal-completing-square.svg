.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><rect x="60" y="66" width="110" height="110" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.4"/><text class="ink bold" x="115" y="126" text-anchor="middle">x²</text><rect x="170" y="66" width="60" height="110" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="200" y="126" text-anchor="middle">3x</text><rect x="60" y="176" width="110" height="60" rx="3" fill="var(--s3)" fill-opacity="0.18" stroke="var(--s3)" stroke-width="1.4"/><text class="ink" x="115" y="211" text-anchor="middle">3x</text><rect x="170" y="176" width="60" height="60" rx="3" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink2" x="200" y="211" text-anchor="middle">9</text><text class="ink2 sm" x="52" y="125" text-anchor="end">x</text><text class="ink2 sm" x="52" y="210" text-anchor="end">3</text><text class="ink2 sm" x="115" y="56" text-anchor="middle">x</text><text class="ink2 sm" x="200" y="56" text-anchor="middle">3</text><text class="ink bold" x="145" y="262" text-anchor="middle">x² + 6x</text><text class="ink2 sm" x="145" y="282" text-anchor="middle">모자란 칸이 9 다</text><path fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M255 150 L315 150"/><text class="ink2 sm" x="285" y="138" text-anchor="middle">9 를 더한다</text><rect x="345" y="66" width="170" height="170" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.4"/><rect x="455" y="176" width="60" height="60" rx="3" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ink bold" x="408" y="136" text-anchor="middle">(x + 3)²</text><text class="ink2" x="485" y="211" text-anchor="middle">9</text><text class="ink2 sm" x="525" y="155" text-anchor="start">x + 3</text><text class="ink2 sm" x="430" y="56" text-anchor="middle">x + 3</text><text class="ink bold" x="430" y="262" text-anchor="middle">(x + 3)² − 9</text><text class="ink2 sm" x="430" y="282" text-anchor="middle">더한 9 를 다시 뺀다</text>
