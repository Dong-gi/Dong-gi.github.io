<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 335" width="660" height="335" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">산술평균과 기하평균을 반원 위에서 견준다</title><desc id="d">지름을 a 와 b 로 나눈 점에서 세운 수선의 길이가 √(ab) 이고 반지름이 (a+b)/2 다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><path d="M530 250 A200 200 0 0 0 130 250" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><path d="M130 250 L530 250" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 250 L230 76.79" fill="none" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 250 L230 76.79" fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path fill="none" stroke="var(--ink2)" stroke-width="1.2" d="M242 238 L242 250 L230 250"/><circle cx="230" cy="76.79" r="4.5" fill="var(--s2)"/><circle cx="130" cy="250" r="3.5" fill="var(--ink2)"/><circle cx="530" cy="250" r="3.5" fill="var(--ink2)"/><circle cx="230" cy="250" r="3.5" fill="var(--ink2)"/><circle cx="330" cy="250" r="3.5" fill="var(--ink2)"/><text class="ink2 sm" x="124" y="268" text-anchor="end">A</text><text class="ink2 sm" x="536" y="268" text-anchor="start">B</text><text class="ink2 sm" x="230" y="288" text-anchor="middle">H</text><text class="ink2 sm" x="330" y="288" text-anchor="middle">O</text><text class="ink2 sm" x="222" y="68.79" text-anchor="end">P</text><text class="ink bold" x="180" y="270" text-anchor="middle">a</text><text class="ink bold" x="380" y="270" text-anchor="middle">b</text><text class="f2 bold" x="220" y="170" text-anchor="end">√(ab)</text><text class="f1" x="300" y="128" text-anchor="start">반지름 = (a + b)/2</text><text class="ink bold" x="330" y="36" text-anchor="middle">지름이 a + b 인 반원</text><text class="ink sm" x="330" y="310" text-anchor="middle">빗변(반지름)은 직각변(높이)보다 짧을 수 없다  →  (a + b)/2 ≥ √(ab)</text><text class="ink2 sm" x="330" y="328" text-anchor="middle">두 값이 같아지는 것은 H 가 중심 O 에 올 때, 곧 a = b 인 경우뿐이다</text>
</svg>