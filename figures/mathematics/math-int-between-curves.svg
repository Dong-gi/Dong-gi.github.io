23" text-anchor="start">y = x²</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" marker-start="url(#ar3)" marker-end="url(#ar3)" d="M195.17 191.14 L195.17 155.43"/><text class="ink sm" x="203.17" y="177.29" text-anchor="start">위 − 아래</text><circle class="f3" cx="299.33" cy="84" r="4"/><circle class="f3" cx="91" cy="226.86" r="4"/><text class="ink sm" x="404" y="78" text-anchor="start">두 곡선이 만나는 x 를 먼저 구한다.</text><text class="ink sm" x="404" y="100" text-anchor="start">x = x² 에서 x = 0 과 x = 1.</text><text class="ink sm" x="404" y="136" text-anchor="start">그 사이에서는 언제나 x ≥ x² 이므로</text><text class="ink sm" x="404" y="158" text-anchor="start">위에 있는 것은 y = x 쪽이다.</text><text class="ink bold" x="404" y="196" text-anchor="start">넓이 = ∫ (위 − 아래) dx</text><text class="ink bold" x="404" y="222" text-anchor="start">= 1/2 − 1/3 = 1/6</text><text class="ink2 sm" x="404" y="252" text-anchor="start">위아래가 뒤바뀌는 구간이 있으면</text><text class="ink2 sm" x="404" y="272" text-anchor="start">거기서 끊어 따로 적분해야 한다.</text>
