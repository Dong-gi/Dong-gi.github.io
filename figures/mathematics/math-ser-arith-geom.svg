<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path class="gr" d="M90.39 296 V34"/><path class="gr" d="M147.71 296 V34"/><path class="gr" d="M205.02 296 V34"/><path class="gr" d="M262.34 296 V34"/><path class="gr" d="M319.66 296 V34"/><path class="gr" d="M376.98 296 V34"/><path class="gr" d="M434.29 296 V34"/><path class="gr" d="M491.61 296 V34"/><path class="gr" d="M56 223.22 H526"/><path class="gr" d="M56 150.44 H526"/><path class="gr" d="M56 77.67 H526"/><path class="ax" marker-end="url(#ark)" d="M56 296 H536"/><path class="ax" marker-end="url(#ark)" d="M56 296 V24"/><text class="sm ink2" x="90.39" y="311" text-anchor="middle">1</text><text class="sm ink2" x="147.71" y="311" text-anchor="middle">2</text><text class="sm ink2" x="205.02" y="311" text-anchor="middle">3</text><text class="sm ink2" x="262.34" y="311" text-anchor="middle">4</text><text class="sm ink2" x="319.66" y="311" text-anchor="middle">5</text><text class="sm ink2" x="376.98" y="311" text-anchor="middle">6</text><text class="sm ink2" x="434.29" y="311" text-anchor="middle">7</text><text class="sm ink2" x="491.61" y="311" text-anchor="middle">8</text><text class="sm ink2" x="50" y="227.22" text-anchor="end">10</text><text class="sm ink2" x="50" y="154.44" text-anchor="end">20</text><text class="sm ink2" x="50" y="81.67" text-anchor="end">30</text><text class="sm ink2" x="540" y="300">n</text><text class="sm ink2" x="56" y="16" text-anchor="middle">항의 값</text><path class="cv s1" stroke-dasharray="5 4" d="M90.39 281.44 L147.71 259.61 L205.02 237.78 L262.34 215.94 L319.66 194.11 L376.98 172.28 L434.29 150.44 L491.61 128.61"/><path class="cv s2" stroke-dasharray="5 4" d="M90.39 281.44 L147.71 274.17 L205.02 263.25 L262.34 246.88 L319.66 222.31 L376.98 185.47 L434.29 130.2 L491.61 47.3"/><circle class="f1" cx="90.39" cy="281.44" r="4.5"/><circle class="f1" cx="147.71" cy="259.61" r="4.5"/><circle class="f1" cx="205.02" cy="237.78" r="4.5"/><circle class="f1" cx="262.34" cy="215.94" r="4.5"/><circle class="f1" cx="319.66" cy="194.11" r="4.5"/><circle class="f1" cx="376.98" cy="172.28" r="4.5"/><circle class="f1" cx="434.29" cy="150.44" r="4.5"/><circle class="f1" cx="491.61" cy="128.61" r="4.5"/><circle class="f2" cx="90.39" cy="281.44" r="4.5"/><circle class="f2" cx="147.71" cy="274.17" r="4.5"/><circle class="f2" cx="205.02" cy="263.25" r="4.5"/><circle class="f2" cx="262.34" cy="246.88" r="4.5"/><circle class="f2" cx="319.66" cy="222.31" r="4.5"/><circle class="f2" cx="376.98" cy="185.47" r="4.5"/><circle class="f2" cx="434.29" cy="130.2" r="4.5"/><circle class="f2" cx="491.61" cy="47.3" r="4.5"/><text class="ink2 sm" x="176.37" y="240.69" text-anchor="middle">+3</text><text class="ink2 sm" x="348.32" y="223.75" text-anchor="middle">×1.5</text><rect x="98.99" y="39.1" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="118.99" y="45.1">등차수열  a<tspan baseline-shift="-22%" font-size="76%">n</tspan> = 2 + 3(n − 1)</text><rect x="98.99" y="57.099999999999994" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="118.99" y="63.099999999999994">등비수열  b<tspan baseline-shift="-22%" font-size="76%">n</tspan> = 2 × 1.5ⁿ⁻¹</text><path class="gr" stroke-dasharray="4 3" d="M442.89 296 L442.89 77.67"/><text class="ink2 sm" x="436.89" y="73.3" text-anchor="end">여기서 앞지른다</text><text class="ink2 sm" x="56" y="330" text-anchor="start">등차는 같은 값을 더하므로 점이 직선 위에 놓인다. 등비는 같은 값을 곱하므로 처음에는 뒤처지다가</text><text class="ink2 sm" x="56" y="348" text-anchor="start">어느 지점부터 걷잡을 수 없이 벌어진다. 공비가 1 보다 크면 이 추월은 반드시 일어난다.</text>
</svg>