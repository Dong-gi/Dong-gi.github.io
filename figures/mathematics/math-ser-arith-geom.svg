<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">등차수열과 등비수열의 항이 자라는 모양</title><desc id="d">같은 값을 더하는 등차수열의 점은 직선 위에 놓이고, 같은 값을 곱하는 등비수열의 점은 처음에 뒤처졌다가 결국 앞지른다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
