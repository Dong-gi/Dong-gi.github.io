<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 306" width="770" height="306" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">평행선의 각과 삼각형 내각의 합</title><desc id="d">엇각이 같다는 사실에서 삼각형 세 내각의 합이 180° 라는 정리가 나온다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="385" y="26" text-anchor="middle">평행선이 만드는 각과, 그것으로 얻는 첫 정리</text><rect x="14" y="42" width="356" height="240" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="192" y="63" text-anchor="middle">동위각과 엇각은 같다</text><path d="M50 128 L340 128" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 214 L340 214" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M89.6 72 L237.5 246" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="137.2" cy="128" r="3.5" fill="var(--ink2)"/><circle cx="210.3" cy="214" r="3.5" fill="var(--ink2)"/><path d="M163.2 128 A26 26 0 0 1 154.04 147.81" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="174.41" y="149.21" text-anchor="middle">α</text><path d="M236.3 214 A26 26 0 0 1 227.14 233.81" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="247.51" y="235.21" text-anchor="middle">α</text><path d="M193.46 194.19 A26 26 0 0 0 184.3 214" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="173.09" y="200.79" text-anchor="middle">α</text><text class="ink2 sm" x="338" y="116" text-anchor="end">두 직선은 평행</text><text class="ink2 sm" x="196" y="268" text-anchor="middle">같은 자리의 각(동위각)과 엇갈린 각(엇각)이 같다</text><rect x="390" y="42" width="366" height="240" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="573" y="63" text-anchor="middle">삼각형 세 내각의 합은 180°</text><path d="M520 140 L430 246 L656 246 Z" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/><path d="M424 140 L666 140" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text class="ink2 sm" x="672" y="126" text-anchor="end">A 를 지나는 평행선</text><circle cx="520" cy="140" r="4" fill="var(--ink2)"/><text class="ink sm" x="516" y="128" text-anchor="middle">A</text><circle cx="430" cy="246" r="4" fill="var(--ink2)"/><text class="ink sm" x="418" y="260" text-anchor="middle">B</text><circle cx="656" cy="246" r="4" fill="var(--ink2)"/><text class="ink sm" x="668" y="260" text-anchor="middle">C</text><path d="M460 246 A30 30 0 0 0 449.42 223.13" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="470.84" y="231.1" text-anchor="middle">β</text><path d="M632.34 227.56 A30 30 0 0 0 626 246" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="613.44" y="235.37" text-anchor="middle">γ</text><path d="M503.17 159.82 A26 26 0 0 1 494 140" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="482.79" y="161.22" text-anchor="middle">β</text><path d="M546 140 A26 26 0 0 1 540.51 155.98" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="558.77" y="157.33" text-anchor="middle">γ</text><path d="M551.55 164.59 A40 40 0 0 1 494.11 170.49" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="525.62" y="198.71" text-anchor="middle">α</text><text class="ink2 sm" x="573" y="272" text-anchor="middle">A 에 모인 β + α + γ 가 한 직선을 이룬다</text>
</svg>