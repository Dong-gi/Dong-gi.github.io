<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 348" width="786" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">원주각 정리의 세 가지 경우</title><desc id="d">중심 O 가 원주각 안, 변 위, 밖에 있는 세 경우로 나누어 원주각이 중심각의 절반임을 본다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="393" y="26" text-anchor="middle">원주각 = 중심각의 절반 — 세 경우로 나누어 증명한다</text><text class="ink bold sm" x="140" y="50" text-anchor="middle">① O 가 각 안에 있다</text><circle cx="140" cy="176" r="84" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><path d="M140 92 L61.07 204.73" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 92 L218.93 204.73" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 176 L61.07 204.73" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 176 L218.93 204.73" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 92 L140 260" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M126.23 111.66 A24 24 0 0 0 153.77 111.66" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="140" y="135" text-anchor="middle">θ</text><path d="M119.33 183.52 A22 22 0 0 0 160.67 183.52" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="140" y="217" text-anchor="middle">2θ</text><circle cx="140" cy="92" r="4" fill="var(--ink2)"/><text class="ink sm" x="140" y="80" text-anchor="middle">P</text><circle cx="61.07" cy="204.73" r="4" fill="var(--ink2)"/><text class="ink sm" x="50.07" y="210.73" text-anchor="end">A</text><circle cx="218.93" cy="204.73" r="4" fill="var(--ink2)"/><text class="ink sm" x="229.93" y="210.73" text-anchor="start">B</text><circle cx="140" cy="176" r="3.5" fill="var(--ink2)"/><text class="ink sm" x="149" y="170" text-anchor="start">O</text><text class="ink2 sm" x="140" y="304" text-anchor="middle">이등변삼각형 둘로 쪼갠다</text><text class="ink bold sm" x="393" y="50" text-anchor="middle">② O 가 변 위에 있다</text><circle cx="393" cy="176" r="84" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><path d="M393 92 L310.28 190.59" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 92 L393 260" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 176 L310.28 190.59" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 176 L393 260" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 92 L393 260" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M377.57 110.39 A24 24 0 0 0 393 116" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="379.66" y="132.65" text-anchor="middle">θ</text><path d="M371.33 179.82 A22 22 0 0 0 393 198" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="369.22" y="208.34" text-anchor="middle">2θ</text><circle cx="393" cy="92" r="4" fill="var(--ink2)"/><text class="ink sm" x="393" y="80" text-anchor="middle">P</text><circle cx="310.28" cy="190.59" r="4" fill="var(--ink2)"/><text class="ink sm" x="299.28" y="196.59" text-anchor="end">A</text><circle cx="393" cy="260" r="4" fill="var(--ink2)"/><text class="ink sm" x="403" y="274" text-anchor="start">B</text><circle cx="393" cy="176" r="3.5" fill="var(--ink2)"/><text class="ink sm" x="403" y="170" text-anchor="start">O</text><text class="ink2 sm" x="393" y="304" text-anchor="middle">이등변삼각형 하나로 끝난다</text><text class="ink bold sm" x="646" y="50" text-anchor="middle">③ O 가 각 밖에 있다</text><circle cx="646" cy="176" r="84" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><path d="M573.25 134 L718.75 134" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M573.25 134 L728.72 190.59" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M646 176 L718.75 134" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M646 176 L728.72 190.59" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M573.25 134 L718.75 218" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M597.25 134 A24 24 0 0 1 595.81 142.21" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="611.66" y="144.77" text-anchor="middle">θ</text><path d="M665.05 165 A22 22 0 0 1 667.67 179.82" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink2 sm" x="682.44" y="173.58" text-anchor="middle">2θ</text><circle cx="573.25" cy="134" r="4" fill="var(--ink2)"/><text class="ink sm" x="563.25" y="128" text-anchor="end">P</text><circle cx="718.75" cy="134" r="4" fill="var(--ink2)"/><text class="ink sm" x="724.75" y="124" text-anchor="start">A</text><circle cx="728.72" cy="190.59" r="4" fill="var(--ink2)"/><text class="ink sm" x="739.72" y="196.59" text-anchor="start">B</text><circle cx="646" cy="176" r="3.5" fill="var(--ink2)"/><text class="ink sm" x="644" y="196" text-anchor="middle">O</text><text class="ink2 sm" x="646" y="304" text-anchor="middle">두 각의 차로 얻는다</text><text class="ink2 sm" x="393" y="338" text-anchor="middle">세 경우 어디서나 ∠AOB = 2∠APB 다. P 를 원 위에서 옮겨도 원주각은 변하지 않는다</text>
</svg>