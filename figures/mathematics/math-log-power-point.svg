<text class="ink bold" x="383" y="26" text-anchor="middle">방멱 — 점을 지나는 직선을 어떻게 긋든 두 길이의 곱이 같다</text><text class="ink bold sm" x="172" y="62" text-anchor="middle">점이 원 안에 있을 때</text><circle cx="172" cy="194" r="95" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><path d="M261.97 224.47 L192 214 L241.15 128.9 Z" fill="var(--s1)" fill-opacity="0.14" stroke="none" stroke-width="1.6" stroke-linejoin="round"/><path d="M150.17 286.4 L192 214 L77.03 196.8 Z" fill="var(--s2)" fill-opacity="0.14" stroke="none" stroke-width="1.6" stroke-linejoin="round"/><path d="M261.97 224.47 L77.03 196.8" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M241.15 128.9 L150.17 286.4" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M261.97 224.47 L241.15 128.9" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M150.17 286.4 L77.03 196.8" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="192" cy="214" r="4" fill="var(--s2)"/><text class="ink sm" x="200" y="230" text-anchor="start">P</text><circle cx="261.97" cy="224.47" r="4" fill="var(--ink2)"/><text class="ink sm" x="269.97" y="228.47" text-anchor="start">A</text><circle cx="77.03" cy="196.8" r="4" fill="var(--ink2)"/><text class="ink sm" x="69.03" y="200.8" text-anchor="end">B</text><circle cx="241.15" cy="128.9" r="4" fill="var(--ink2)"/><text class="ink sm" x="249.15" y="122.9" text-anchor="start">C</text><circle cx="150.17" cy="286.4" r="4" fill="var(--ink2)"/><text class="ink sm" x="142.17" y="298.4" text-anchor="end">D</text><circle cx="172" cy="194" r="3.5" fill="var(--ink2)"/><text class="ink sm" x="158" y="188" text-anchor="end">O</text><text class="ink2 sm" x="172" y="322" text-anchor="middle">△APC 와 △DPB 가 닮음이다</text><text class="ink bold sm" x="172" y="342" text-anchor="middle">PA · PB = PC · PD</text><text class="ink bold sm" x="560" y="62" text-anchor="middle">점이 원 밖에 있을 때</text><circle cx="592" cy="190" r="90" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><path d="M392 225 L679.49 211" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M392 225 L538.8 117.4" fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M592 190 L538.8 117.4" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M545.3 126.27 L536.43 132.78 L529.93 123.9" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="392" cy="225" r="4" fill="var(--s2)"/><text class="ink sm" x="384" y="239" text-anchor="end">P</text><circle cx="506.95" cy="219.4" r="4" fill="var(--ink2)"/><text class="ink sm" x="504.95" y="239.4" text-anchor="middle">C</text><circle cx="679.49" cy="211" r="4" fill="var(--ink2)"/><text class="ink sm" x="688.49" y="215" text-anchor="start">D</text><circle cx="538.8" cy="117.4" r="4" fill="var(--ink2)"/><text class="ink sm" x="538.8" y="105.4" text-anchor="middle">T</text><circle cx="592" cy="190" r="3.5" fill="var(--ink2)"/><text class="ink sm" x="596" y="180" text-anchor="start">O</text><text class="ink2 sm" x="560" y="322" text-anchor="middle">접선이면 두 교점이 T 하나로 겹친다</text><text class="ink bold sm" x="560" y="342" text-anchor="middle">PC · PD = PT²</text>
