<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 352" width="766" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">방멱정리</title><desc id="d">점을 지나는 직선을 어떻게 긋든 원과 만나는 두 점까지의 거리의 곱이 일정하다.</desc>
<style>
