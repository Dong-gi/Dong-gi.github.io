<text class="ink bold" x="385" y="26" text-anchor="middle">드모르간 법칙 — 가운데와 오른쪽은 같은 영역이다</text><rect x="18" y="50" width="230" height="162" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="133" y="71" text-anchor="middle">p ∧ q</text><path d="M133 106.49 A44 44 0 0 1 133 181.51 A44 44 0 0 1 133 106.49 Z" fill="var(--s1)" fill-opacity="0.34" stroke="none" stroke-width="1.5"/><rect x="30" y="88" width="206" height="112" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><circle cx="110" cy="144" r="44" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><circle cx="156" cy="144" r="44" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold sm" x="86" y="128" text-anchor="middle">p</text><text class="ink bold sm" x="180" y="128" text-anchor="middle">q</text><rect x="270" y="50" width="230" height="162" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="385" y="71" text-anchor="middle">¬(p ∧ q)</text><path d="M282 88 H488 V200 H282 Z M385 106.49 A44 44 0 0 1 385 181.51 A44 44 0 0 1 385 106.49 Z" fill="var(--s2)" fill-opacity="0.24" fill-rule="evenodd" stroke="none" stroke-width="1.5"/><rect x="282" y="88" width="206" height="112" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><circle cx="362" cy="144" r="44" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><circle cx="408" cy="144" r="44" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold sm" x="338" y="128" text-anchor="middle">p</text><text class="ink bold sm" x="432" y="128" text-anchor="middle">q</text><rect x="522" y="50" width="230" height="162" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="637" y="71" text-anchor="middle">¬p ∨ ¬q</text><path d="M534 88 H740 V200 H534 Z M637 106.49 A44 44 0 0 1 637 181.51 A44 44 0 0 1 637 106.49 Z" fill="var(--s3)" fill-opacity="0.24" fill-rule="evenodd" stroke="none" stroke-width="1.5"/><rect x="534" y="88" width="206" height="112" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><circle cx="614" cy="144" r="44" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><circle cx="660" cy="144" r="44" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink bold sm" x="590" y="128" text-anchor="middle">p</text><text class="ink bold sm" x="684" y="128" text-anchor="middle">q</text><text class="ink2 sm" x="385" y="258" text-anchor="middle">칠한 부분이 그 명제가 참이 되는 경우다</text>
