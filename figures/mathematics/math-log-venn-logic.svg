<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 270" width="770" height="270" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">드모르간 법칙의 영역 그림</title><desc id="d">논리곱의 부정과 부정의 논리합이 같은 영역임을 보인다.</desc>
