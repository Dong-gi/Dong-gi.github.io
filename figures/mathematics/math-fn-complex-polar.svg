<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 344" width="660" height="344" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">복소수의 극형식과, i 를 곱하는 것이 90도 회전이라는 사실</title><desc id="d">왼쪽은 길이 r 과 각 θ 로 복소수를 적는 방법, 오른쪽은 i 를 곱하면 길이는 그대로이고 각만 90도 커진다는 것</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="28" y="30" width="288" height="302" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="172" y="50" text-anchor="middle">극형식</text><path class="ax" marker-end="url(#ark)" d="M64 186 H286"/><path class="ax" marker-end="url(#ark)" d="M170 292 V70"/><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M170 186 L222.24 123.75"/><circle class="f1" cx="222.24" cy="123.75" r="4.5"/><path class="gr" stroke-dasharray="4 3" d="M222.24 123.75 L222.24 186"/><path class="gr" stroke-dasharray="4 3" d="M222.24 123.75 L170 123.75"/><path class="gr" d="M210 186 A40 40 0 0 0 195.71 155.36"/><text class="sm ink2" x="218.94" y="167.18" text-anchor="middle">θ</text><text class="ink bold" x="231.24" y="117.75" text-anchor="start">z</text><text class="ink" x="189.05" y="142.15" text-anchor="middle">r</text><text class="ink2 sm" x="222.24" y="206" text-anchor="middle">r cos θ</text><text class="ink2 sm" x="161" y="127.75" text-anchor="end">r sin θ</text><text class="ink" x="172" y="318" text-anchor="middle">z = r(cos θ + i sin θ)</text><rect x="344" y="30" width="288" height="302" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="488" y="50" text-anchor="middle">i 를 곱한다</text><path class="ax" marker-end="url(#ark)" d="M386 186 H608"/><path class="ax" marker-end="url(#ark)" d="M492 292 V70"/><text class="sm ink2" x="558.25" y="201" text-anchor="middle">1</text><path class="s1" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar1)" d="M492 186 L571.5 152.88"/><path class="s2" fill="none" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar2)" d="M492 186 L458.88 106.5"/><text class="ink bold" x="580.5" y="154.88" text-anchor="start">z</text><text class="ink bold" x="451.88" y="97.5" text-anchor="end">iz</text><path class="gr" d="M549.24 162.17 A62 62 0 0 0 468.17 128.76"/><text class="sm ink2" x="520.96" y="119.73" text-anchor="middle">90°</text><text class="ink" x="488" y="318" text-anchor="middle">길이는 그대로, 각만 90° 커진다</text>
</svg>