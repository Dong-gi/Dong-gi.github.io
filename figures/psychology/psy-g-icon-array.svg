<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">기저율을 눈으로 세기</title><desc id="d">1000칸 가운데 경보가 울린 22칸과 그중 진짜 위조인 2칸</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<defs><pattern id="psyGcell" width="14" height="14" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="10" height="10" rx="2" fill="var(--grid)"/></pattern></defs><rect x="96" y="86" width="560" height="350" fill="url(#psyGcell)"/><rect x="97" y="101" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="195" y="409" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="461" y="171" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="111" y="311" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="475" y="409" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="321" y="129" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="587" y="367" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="167" y="325" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="237" y="283" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="181" y="87" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="503" y="115" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="321" y="423" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="307" y="367" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="531" y="129" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="279" y="87" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="433" y="157" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="391" y="101" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="265" y="199" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="391" y="339" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="209" y="213" width="12" height="12" rx="2" fill="var(--s2)" fill-opacity="0.9"/><rect x="223" y="213" width="12" height="12" rx="2" fill="var(--s1)"/><rect x="220" y="210" width="16" height="16" rx="3" fill="none" stroke="var(--ink)" stroke-width="2"/><rect x="573" y="339" width="12" height="12" rx="2" fill="var(--s1)"/><rect x="570" y="336" width="16" height="16" rx="3" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="ink bold" x="450" y="38" text-anchor="middle">지폐 1,000장 — 경보가 울린 22장 가운데 진짜 위조는 2장</text><text class="ink2 sm" x="450" y="62" text-anchor="middle">작은 칸 하나가 지폐 한 장이다. 세로 25줄 × 가로 40칸 = 1,000장</text><rect x="96" y="460" width="14" height="14" rx="2" fill="var(--s1)"/><rect x="93" y="457" width="20" height="20" rx="3" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="ink sm" x="126" y="472" text-anchor="start">위조이고 경보도 울렸다 — 2장</text><rect x="356" y="460" width="14" height="14" rx="2" fill="var(--s2)" fill-opacity="0.9"/><text class="ink sm" x="386" y="472" text-anchor="start">진짜인데 경보가 울렸다 — 20장</text><rect x="636" y="460" width="14" height="14" rx="2" fill="var(--grid)"/><text class="ink sm" x="666" y="472" text-anchor="start">경보가 울리지 않았다 — 978장</text><text class="ink2 sm" x="450" y="504" text-anchor="middle">검사가 위조를 놓치지 않고 진짜를 2%만 잘못 걸러도, 경보의 열에 아홉은 진짜 지폐다</text>
</svg>