<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이 장이 다루는 결과들이 재현 검사에서 어떻게 되었는가</title><desc id="d">검사를 많이 받은 결과 가운데 살아남은 것과 무너진 것이 함께 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<path class="ax" marker-end="url(#ark)" d="M116 356 H506"/><path class="ax" marker-end="url(#ark)" d="M116 356 V46"/>
<text class="ink2 sm" x="306" y="404" text-anchor="middle">독립적인 재현 검사를 얼마나 받았는가</text>
<text class="ink2 sm" x="116" y="420" text-anchor="middle">적게</text>
<text class="ink2 sm" x="496" y="420" text-anchor="middle">많이</text>
<text class="ink2 sm" x="40" y="42" text-anchor="start">그 검사에서 어떻게 되었는가</text>
<text class="ink2 sm" x="108" y="68" text-anchor="end">버팀</text>
<text class="ink2 sm" x="108" y="344" text-anchor="end">무너짐</text>
<path d="M116 206 L496 206" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<circle cx="154" cy="332" r="10" fill="var(--s2)"/>
<text x="154" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
<circle cx="458" cy="326" r="10" fill="var(--s2)"/>
<text x="458" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
<circle cx="427.6" cy="308" r="10" fill="var(--s2)"/>
<text x="427.6" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
<circle cx="442.8" cy="284" r="10" fill="var(--s2)"/>
<text x="442.8" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
<circle cx="473.2" cy="269" r="10" fill="var(--s2)"/>
<text x="473.2" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
<circle cx="450.4" cy="248" r="10" fill="var(--s2)"/>
<text x="450.4" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
<circle cx="306" cy="200" r="10" fill="var(--s1)"/>
<text x="306" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
<circle cx="275.6" cy="176" r="10" fill="var(--s1)"/>
<text x="275.6" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
<circle cx="442.8" cy="164" r="10" fill="var(--s3)"/>
<text x="442.8" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">9</text>
