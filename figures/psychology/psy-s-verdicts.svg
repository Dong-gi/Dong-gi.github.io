<text x="435.2" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">10</text>
<circle cx="404.8" cy="89" r="10" fill="var(--s3)"/>
<text x="404.8" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">11</text>
<circle cx="450.4" cy="104" r="10" fill="var(--s3)"/>
<text x="450.4" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">12</text>
<text class="ink sm" x="548" y="84" text-anchor="start">1. 스탠퍼드 감옥 실험 — 연구로 성립하지 않는다</text>
<text class="ink sm" x="548" y="108" text-anchor="start">2. 자아 고갈 — 다중연구실에서 효과 거의 0</text>
<text class="ink sm" x="548" y="132" text-anchor="start">3. 사회적 점화 — 재현 실패</text>
<text class="ink sm" x="548" y="156" text-anchor="start">4. 파워 포즈, 호르몬과 행동 — 재현되지 않음</text>
<text class="ink sm" x="548" y="180" text-anchor="start">5. 행위자-관찰자 비대칭 — 메타분석에서 거의 0</text>
<text class="ink sm" x="548" y="204" text-anchor="start">6. 암묵적 연합 검사의 개인 행동 예측력 — 작다</text>
<text class="ink sm" x="548" y="228" text-anchor="start">7. 밀그램 복종 — 결과는 되풀이, 해석은 논쟁</text>
<text class="ink sm" x="548" y="252" text-anchor="start">8. 인지부조화 — 틀은 살아 있고 대안 설명과 겨룬다</text>
<text class="ink sm" x="548" y="276" text-anchor="start">9. 파워 포즈, 주관적 보고 — 재현되었다</text>
<text class="ink sm" x="548" y="300" text-anchor="start">10. 방관자 효과 — 메타분석에서 지지됨</text>
<text class="ink sm" x="548" y="324" text-anchor="start">11. 대응 편향 — 다중연구실에서 되풀이됨</text>
<text class="ink sm" x="548" y="348" text-anchor="start">12. 애쉬 동조 — 여러 나라에서 되풀이됨</text>
<text class="ink2 sm" x="46" y="434" text-anchor="start">두 축 다 눈금이 없다. 이 배치는 본문의 판정을 옮긴 지도이고 어느 연구의 수치도 아니다</text>
</svg>