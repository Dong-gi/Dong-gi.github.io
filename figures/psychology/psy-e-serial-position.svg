rcle class="f2" cx="336" cy="257.33" r="3"/><circle class="f2" cx="376" cy="261.02" r="3"/><circle class="f2" cx="416" cy="263.45" r="3"/><circle class="f2" cx="456" cy="265.06" r="3"/><circle class="f2" cx="496" cy="266.11" r="3"/><circle class="f2" cx="536" cy="266.81" r="3"/><circle class="f2" cx="576" cy="267.27" r="3"/><circle class="f2" cx="616" cy="267.57" r="3"/><circle class="f2" cx="656" cy="267.77" r="3"/><text class="ink bold sm" x="336" y="230.85" text-anchor="middle">바로 회상</text><text class="ink bold sm" x="336" y="281.33" text-anchor="middle">딴 일을 시키고 회상</text><text class="ink2 sm" x="100" y="99.36" text-anchor="start">처음쪽 이점</text><text class="ink2 sm" x="654" y="81.44" text-anchor="end">끝쪽 이점</text><text class="ink2 sm" x="376" y="334" text-anchor="middle">목록에서 몇 번째로 제시된 낱말인가</text><text class="ink2 sm" x="30" y="66" text-anchor="start">세로축 — 회상된 비율 (눈금 없음)</text><rect x="676" y="92" width="166" height="120" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink bold sm" x="692" y="116" text-anchor="start">읽는 법</text><text class="ink2 sm" x="692" y="140" text-anchor="start">30초쯤 딴 일을</text><text class="ink2 sm" x="692" y="158" text-anchor="start">시키면 끝쪽만</text><text class="ink2 sm" x="692" y="176" text-anchor="start">무너진다. 처음쪽은</text><text class="ink2 sm" x="692" y="194" text-anchor="start">거의 그대로다</text><text class="ink bold" x="430" y="34" text-anchor="middle">목록의 처음과 끝이 잘 남는다 — 도식</text><text class="ink2 sm" x="430" y="372" text-anchor="middle">세로축에 눈금을 달지 않았다. 값이 아니라 두 곡선의 모양 차이를 읽는 그림이다</text>
</svg>