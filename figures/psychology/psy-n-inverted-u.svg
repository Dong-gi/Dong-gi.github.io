<title id="t">각성과 수행의 뒤집힌 U 곡선</title><desc id="d">꼭대기가 과제 난이도에 따라 옮겨 간다는 그림. 눈금 없는 도식이며 오른쪽에 이 곡선을 쓸 때의 단서가 있다</desc>
