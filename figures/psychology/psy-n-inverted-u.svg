<path class="gr" stroke-dasharray="4 3" d="M246 312 L246 87"/>
<text class="ink bold sm" x="556" y="96" text-anchor="start">이 곡선을 쓸 때 조심할 것</text>
<text class="ink2 sm" x="556" y="124" text-anchor="start">원 연구는 20세기 초의 동물</text>
<text class="ink2 sm" x="556" y="144" text-anchor="start">실험이었다. 그 뒤 사람의</text>
<text class="ink2 sm" x="556" y="164" text-anchor="start">온갖 상황으로 넓혀 쓰였다.</text>
<text class="ink2 sm" x="556" y="198" text-anchor="start">‘각성’ 이 무엇인지가 자리마다</text>
<text class="ink2 sm" x="556" y="218" text-anchor="start">다르게 조작적으로 정의된다.</text>
<text class="ink2 sm" x="556" y="252" text-anchor="start">꼭대기가 어디인지는 사후에만</text>
<text class="ink2 sm" x="556" y="272" text-anchor="start">말할 수 있어서, 어떤 결과가</text>
<text class="ink2 sm" x="556" y="292" text-anchor="start">나와도 설명이 된다.</text>
<text class="ink2 sm" x="556" y="326" text-anchor="start">축에 눈금이 없는 것은</text>
<text class="ink2 sm" x="556" y="346" text-anchor="start">도식이기 때문이다.</text>
</svg>