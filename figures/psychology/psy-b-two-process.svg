 stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="599.12" y="306" text-anchor="middle">15시</text><path d="M727.9 286 L727.9 291" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="727.9" y="306" text-anchor="middle">23시</text><text class="ink bold sm" x="56" y="320" text-anchor="start">· 파란 곡선은 깨어 있는 시간이 길수록 올라가고 자는 동안 내려간다. ‘얼마나 오래 깨어 있었나’ 다</text><text class="ink bold sm" x="56" y="340" text-anchor="start">· 초록 점선 두 개는 하루 주기다. 시간이 지나기만 해도 위아래로 출렁인다. ‘지금이 하루 중 언제인가’ 다</text><text class="ink2 sm" x="56" y="360" text-anchor="start">· 둘이 따로 움직이므로, 같은 시간을 깨어 있어도 하루 중 언제인가에 따라 졸림이 다르다</text><text class="ink2 sm" x="56" y="380" text-anchor="start">· 이 그림은 잠을 정하는 두 갈래를 보이는 도식이며, 잠의 기능에 대해서는 아무 말도 하지 않는다</text>
</svg>