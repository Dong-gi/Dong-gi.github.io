<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="430" y="30" text-anchor="middle">심리학이 자료로 인정한 것의 변화</text><path d="M50 296 L830 296" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M112.94 296 L112.94 303" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="112.94" y="320" text-anchor="middle">1880</text><path d="M284.71 296 L284.71 303" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="284.71" y="320" text-anchor="middle">1920</text><path d="M456.47 296 L456.47 303" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="456.47" y="320" text-anchor="middle">1960</text><path d="M628.24 296 L628.24 303" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="628.24" y="320" text-anchor="middle">2000</text><path d="M108.65 104 L108.65 296" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="108.65" cy="296" r="5" fill="var(--s1)"/><rect x="22.65" y="54" width="172" height="50" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="108.65" y="72" text-anchor="middle">1879  분트, 라이프치히 실험실</text><text class="ink2 sm" x="108.65" y="92" text-anchor="middle">내성 보고를 자료로 삼는다</text><path d="M134.41 174 L134.41 296" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="134.41" cy="296" r="5" fill="var(--s1)"/><rect x="48.41" y="124" width="172" height="50" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text class="ink sm" x="134.41" y="142" text-anchor="middle">1885  에빙하우스, 기억 실험</text><text class="ink2 sm" x="134.41" y="162" text-anchor="middle">기억을 재는 절차를 만든다</text><path d="M254.65 244 L254.65 296" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="254.65" cy="296" r="5" fill="var(--s2)"/><rect x="168.65" y="194" width="172" height="50" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="254.65" y="212" text-anchor="middle">1913  왓슨, 행동주의 선언</text><text class="ink2 sm" x="254.65" y="232" text-anchor="middle">내성을 자료에서 뺀다</text><path d="M439.29 104 L439.29 296" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="439.29" cy="296" r="5" fill="var(--s3)"/><rect x="353.29" y="54" width="172" height="50" rx="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="439.29" y="72" text-anchor="middle">1956  인지혁명이 시작된다</text><text class="ink2 sm" x="439.29" y="92" text-anchor="middle">속의 처리 과정을 모형으로 세운다</text><path d="M542.35 174 L542.35 296" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="542.35" cy="296" r="5" fill="var(--s3)"/><rect x="456.35" y="124" width="172" height="50" rx="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text class="ink sm" x="542.35" y="142" text-anchor="middle">1980  인지신경과학</text><text class="ink2 sm" x="542.35" y="162" text-anchor="middle">뇌 측정이 자료로 들어온다</text><path d="M675.47 244 L675.47 296" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="675.47" cy="296" r="5" fill="var(--s2)"/><rect x="589.47" y="194" width="172" height="50" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink sm" x="675.47" y="212" text-anchor="middle">2011  재현 위기</text><text class="ink2 sm" x="675.47" y="232" text-anchor="middle">자료 얻는 절차 자체를 검사한다</text>
</svg>