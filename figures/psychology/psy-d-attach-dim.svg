<text class="ink bold" x="146" y="79.2" text-anchor="start">가</text>
<text class="ink bold" x="510" y="79.2" text-anchor="end">나</text>
<text class="ink bold" x="146" y="364" text-anchor="start">다</text>
<text class="ink bold" x="510" y="364" text-anchor="end">라</text>
<text class="ink bold sm" x="566" y="96" text-anchor="start">네 칸은 나중에 그은 것이다</text>
<text class="ink2 sm" x="566" y="122" text-anchor="start">점이 칸마다 뭉쳐 있지 않다.</text>
<text class="ink2 sm" x="566" y="142" text-anchor="start">한 덩어리로 퍼져 있고 그 위에</text>
<text class="ink2 sm" x="566" y="162" text-anchor="start">선을 그은 모양이다.</text>
<text class="ink2 sm" x="566" y="196" text-anchor="start">그래서 경계 가까이의 아이는</text>
<text class="ink2 sm" x="566" y="216" text-anchor="start">다시 재면 칸이 바뀔 수 있다.</text>
<text class="ink2 sm" x="566" y="250" text-anchor="start">점은 씨앗을 고정한 난수로</text>
<text class="ink2 sm" x="566" y="270" text-anchor="start">만든 도식이다. 실제 자료가</text>
<text class="ink2 sm" x="566" y="290" text-anchor="start">아니다.</text>
