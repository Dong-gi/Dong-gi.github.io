cx="210" cy="216.21" r="6" fill="var(--s2)"/><circle cx="310" cy="202.06" r="6" fill="var(--s2)"/><path d="M210 216.21 L310 202.06" fill="none" stroke="var(--s2)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="200" y="221.21" text-anchor="end">42</text><text class="ink bold sm" x="320" y="207.06" text-anchor="start">47</text><rect x="452" y="78" width="336" height="90" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink sm" x="468" y="102" text-anchor="start">굵은 선 — 1차에서 아래쪽만 골라낸 사람들</text><text class="ink2 sm" x="468" y="124" text-anchor="start">아무 처치도 하지 않았다. 두 측정 사이에</text><text class="ink2 sm" x="468" y="144" text-anchor="start">한 일이 하나도 없다</text><rect x="452" y="186" width="336" height="112" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.4"/><text class="ink bold sm" x="468" y="210" text-anchor="start">그런데 평균이 올라갔다</text><text class="ink2 sm" x="468" y="232" text-anchor="start">점수에는 실력과 그날의 우연이 섞여 있고,</text><text class="ink2 sm" x="468" y="252" text-anchor="start">아래쪽만 고르면 우연이 나쁜 쪽이던 사람이</text><text class="ink2 sm" x="468" y="272" text-anchor="start">많이 뽑힌다. 그 우연은 되풀이되지 않는다</text><text class="ink bold" x="410" y="30" text-anchor="middle">평균으로의 회귀 — 씨앗을 고정한 난수로 만든 도식</text><text class="ink2 sm" x="410" y="332" text-anchor="middle">처치를 준 뒤 이 그림을 보면 처치가 효과를 낸 것처럼 읽힌다. 통제 집단이 필요한 이유가 이것이다</text>
