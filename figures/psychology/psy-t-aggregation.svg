<text class="ink2 sm" x="556" y="176" text-anchor="start">왼쪽 끝의 점 하나만 보면</text>
<text class="ink2 sm" x="556" y="196" text-anchor="start">‘일관성이 없다’ 로 읽힌다.</text>
<text class="ink2 sm" x="556" y="216" text-anchor="start">같은 값을 스무 번 합치면</text>
<text class="ink2 sm" x="556" y="236" text-anchor="start">오른쪽 끝이 된다.</text>
<text class="ink2 sm" x="556" y="270" text-anchor="start">자료가 달라진 것이 아니다.</text>
<text class="ink2 sm" x="556" y="290" text-anchor="start">세는 단위를 바꾼 것이다.</text>
