.83 283.25 L691.25 285.73 L697.67 287.86 L704.08 289.68 L710.5 291.22 L716.92 292.52 L723.33 293.59 L729.75 294.48 L736.17 295.21 L742.58 295.81 L749 296.29 L755.42 296.67 L761.83 296.97 L768.25 297.22 L774.67 297.4 L781.08 297.55 L787.5 297.66 L793.92 297.75 L800.33 297.81 L806.75 297.86 L813.17 297.9 L819.58 297.93 L826 297.95"/><path d="M441 298 L441 158.8" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text class="ink bold" x="450" y="168.47" text-anchor="start">준거</text><text class="ink bold sm" x="252.35" y="182" text-anchor="end">신호가 없을 때 (잡음뿐)</text><path class="gr" stroke-dasharray="4 3" d="M256.2 183.93 L298.55 205.2"/><text class="ink bold sm" x="637.35" y="182" text-anchor="start">신호가 있을 때</text><path class="gr" stroke-dasharray="4 3" d="M633.5 183.93 L595 205.2"/><path class="gr" stroke-dasharray="4 3" d="M364 143.72 L364 116.27"/><path class="gr" stroke-dasharray="4 3" d="M518 143.72 L518 116.27"/><path class="" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M364 116.27 L518 116.27"/><path class="" fill="none" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M518 116.27 L364 116.27"/><text class="ink bold sm" x="441" y="106.27" text-anchor="middle">민감도 — 두 봉우리 사이의 거리</text><text class="ink bold sm" x="595" y="253.53" text-anchor="middle">적중</text><text class="ink bold sm" x="488.74" y="280.6" text-anchor="middle">오경보</text><text class="ink2 sm" x="431" y="322" text-anchor="end">여기 왼쪽이면 ‘없다’ 라고 답한다</text><text class="ink2 sm" x="451" y="322" text-anchor="start">여기 오른쪽이면 ‘있다’ 라고 답한다</text><text class="ink bold sm" x="56" y="372" text-anchor="start">칠해진 두 넓이가 관찰자가 내놓는 답의 전부다. 준거 오른쪽의 파랑 전체가 적중률이고, 주황이 겹쳐 보라로 보이는 부분이 오경보율이다.</text><text class="ink2 sm" x="56" y="394" text-anchor="start">준거를 왼쪽으로 옮기면 적중률과 오경보율이 함께 커지고, 오른쪽으로 옮기면 함께 작아진다. 그동안 봉우리 사이 거리는 그대로다.</text><text class="ink2 sm" x="56" y="416" text-anchor="start">그래서 적중률 하나만 보고는 잘 알아채는 사람과 ‘있다’ 라고 자주 답하는 사람을 가릴 수 없다.</text>
</svg>