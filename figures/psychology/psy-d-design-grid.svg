<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">출생 연도와 측정 연도로 만든 표</title><desc id="d">세로 한 줄은 횡단, 가로 한 줄은 종단, 같은 나이가 나오는 두 칸은 계열 설계가 견주는 자리다</desc>
