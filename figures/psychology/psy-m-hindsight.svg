<text class="ink bold" x="410" y="34" text-anchor="middle">같은 물음, 다른 순서</text><text class="ink2 sm" x="410" y="54" text-anchor="middle">가상의 자료로 만든 도식이다</text><text class="ink bold" x="24" y="92" text-anchor="start">결과를 모르는 집단</text><text class="ink2 sm" x="24" y="110" text-anchor="start">‘이 실험이 성공할 확률은?’</text><path d="M200 126 L740 126" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="362" cy="126" r="5" fill="var(--s1)"/><circle cx="426.8" cy="126" r="5" fill="var(--s1)"/><circle cx="459.2" cy="126" r="5" fill="var(--s1)"/><circle cx="497" cy="126" r="5" fill="var(--s1)"/><circle cx="534.8" cy="126" r="5" fill="var(--s1)"/><circle cx="578" cy="126" r="5" fill="var(--s1)"/><path d="M476.3 110 L476.3 142" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="476.3" y="158" text-anchor="middle">평균 51</text><text class="ink bold" x="24" y="196" text-anchor="start">결과를 아는 집단</text><text class="ink2 sm" x="24" y="214" text-anchor="start">‘성공했다고 들었다. 미리 알았다면 얼마로 봤겠는가?’</text><path d="M200 230 L740 230" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="534.8" cy="230" r="5" fill="var(--s2)"/><circle cx="578" cy="230" r="5" fill="var(--s2)"/><circle cx="599.6" cy="230" r="5" fill="var(--s2)"/><circle cx="621.2" cy="230" r="5" fill="var(--s2)"/><circle cx="653.6" cy="230" r="5" fill="var(--s2)"/><circle cx="686" cy="230" r="5" fill="var(--s2)"/><path d="M612.2 214 L612.2 246" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="612.2" y="262" text-anchor="middle">평균 76</text><text class="ink2 sm" x="200" y="290" text-anchor="middle">0%</text><path d="M200 276 L200 282" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="335" y="290" text-ancho