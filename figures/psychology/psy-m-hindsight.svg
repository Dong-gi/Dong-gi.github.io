<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">사후과잉확신</title><desc id="d">결과를 모르는 집단과 아는 집단의 확률 추정 비교 도식</desc>
