<text class="ink bold sm" x="492" y="104" text-anchor="start">주황 점이 뒤집힌 사람이다</text>
<text class="ink2 sm" x="492" y="130" text-anchor="start">한 번은 문턱을 넘고 한 번은</text>
<text class="ink2 sm" x="492" y="150" text-anchor="start">못 넘었다. 전부 문턱 가까이에</text>
<text class="ink2 sm" x="492" y="170" text-anchor="start">몰려 있다.</text>
<text class="ink2 sm" x="492" y="204" text-anchor="start">검사가 나빠서가 아니다.</text>
<text class="ink2 sm" x="492" y="224" text-anchor="start">어떤 검사에도 오차가 있고,</text>
<text class="ink2 sm" x="492" y="244" text-anchor="start">한 점으로 자르면 오차가</text>
<text class="ink2 sm" x="492" y="264" text-anchor="start">합격과 불합격을 가른다.</text>
<text class="ink2 sm" x="492" y="298" text-anchor="start">이 그림에서 뒤집힌 사람은</text>
<text class="ink2 sm" x="492" y="318" text-anchor="start">150명 가운데 22명이다.</text>
<text class="ink2 sm" x="492" y="352" text-anchor="start">점은 씨앗 고정 난수로 만든</text>
<text class="ink2 sm" x="492" y="372" text-anchor="start">도식이다. 실제 자료가 아니다.</text>
</svg>