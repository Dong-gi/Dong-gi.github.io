<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한 사람이 나설 확률과 누군가 나설 확률</title><desc id="d">사람이 많아지면 개인이 나설 확률은 내려가고 누군가 나설 확률은 올라간다</desc>
<style>
