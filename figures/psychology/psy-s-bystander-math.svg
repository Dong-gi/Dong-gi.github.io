<rect x="544" y="88" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="564" y="94">누군가 한 사람이라도 나설 확률</text><rect x="544" y="106" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="564" y="112">지목된 한 사람이 나설 확률</text>
<text class="ink bold sm" x="544" y="158" text-anchor="start">두 곡선이 반대 방향으로 간다</text>
<text class="ink2 sm" x="544" y="186" text-anchor="start">아래 곡선이 내려가는 것이</text>
<text class="ink2 sm" x="544" y="206" text-anchor="start">방관자 효과다. 사람이 많을수록</text>
<text class="ink2 sm" x="544" y="226" text-anchor="start">한 사람이 나설 확률은 준다.</text>
<text class="ink2 sm" x="544" y="258" text-anchor="start">그런데 사람 수가 함께 늘므로</text>
<text class="ink2 sm" x="544" y="278" text-anchor="start">누군가는 나설 확률이 오른다.</text>
<text class="ink2 sm" x="544" y="310" text-anchor="start">‘도움을 받을 확률’ 을 물었는지</text>
<text class="ink2 sm" x="544" y="330" text-anchor="start">‘이 사람이 도울 확률’ 을 물었는지에</text>
<text class="ink2 sm" x="544" y="350" text-anchor="start">따라 답이 반대가 된다.</text>
<text class="ink2 sm" x="46" y="392" text-anchor="start">아래 곡선의 모양은 보기로 정한 것이고, 위 곡선은 그것에서 계산한 값이다. 자료가 아니다</text>
</svg>