<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한 덩어리 분포를 잘라 두 유형을 만드는 일</title><desc id="d">골짜기 없는 분포를 가운데서 자르면 유형이 생기지만 경계는 자료에 있던 것이 아니다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
