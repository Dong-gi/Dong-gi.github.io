<text class="ink bold" x="210.4" y="332" text-anchor="middle">유형 가</text>
<text class="ink bold" x="449.6" y="332" text-anchor="middle">유형 나</text>
<text class="ink2 sm" x="330" y="64.43" text-anchor="middle">여기서 자른다</text>
<text class="ink bold sm" x="330" y="293.48" text-anchor="middle">흔들리는 구간</text>
<text class="ink bold sm" x="596" y="108" text-anchor="start">분포에 골짜기가 없다</text>
<text class="ink2 sm" x="596" y="134" text-anchor="start">두 덩어리라면 가운데가</text>
<text class="ink2 sm" x="596" y="154" text-anchor="start">비어 있어야 한다.</text>
<text class="ink2 sm" x="596" y="174" text-anchor="start">가장 사람이 많은 자리가</text>
<text class="ink2 sm" x="596" y="194" text-anchor="start">바로 경계다.</text>
<text class="ink2 sm" x="596" y="228" text-anchor="start">경계 바로 왼쪽과 오른쪽은</text>
<text class="ink2 sm" x="596" y="248" text-anchor="start">서로 거의 같고, 같은 유형의</text>
<text class="ink2 sm" x="596" y="268" text-anchor="start">양 끝끼리는 아주 다르다.</text>
<text class="ink2 sm" x="596" y="302" text-anchor="start">주황 띠 안의 사람은 다시 재면</text>
<text class="ink2 sm" x="596" y="322" text-anchor="start">유형이 바뀐다. 곡선은 도식이다.</text>
</svg>