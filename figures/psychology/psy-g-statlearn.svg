154" text-anchor="middle">다</text><rect x="712" y="124" width="50" height="44" rx="5" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text class="ink" x="737" y="154" text-anchor="middle">쿠</text><path d="M138 124 C 146 106 158 106 166 124" fill="none" stroke="var(--s1)" stroke-width="4"/><path d="M194 124 C 202 106 214 106 222 124" fill="none" stroke="var(--s1)" stroke-width="4"/><path d="M250 124 C 258 106 270 106 278 124" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M306 124 C 314 106 326 106 334 124" fill="none" stroke="var(--s1)" stroke-width="4"/><path d="M362 124 C 370 106 382 106 390 124" fill="none" stroke="var(--s1)" stroke-width="4"/><path d="M418 124 C 426 106 438 106 446 124" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M474 124 C 482 106 494 106 502 124" fill="none" stroke="var(--s1)" stroke-width="4"/><path d="M530 124 C 538 106 550 106 558 124" fill="none" stroke="var(--s1)" stroke-width="4"/><path d="M586 124 C 594 106 606 106 614 124" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M642 124 C 650 106 662 106 670 124" fill="none" stroke="var(--s1)" stroke-width="4"/><path d="M698 124 C 706 106 718 106 726 124" fill="none" stroke="var(--s1)" stroke-width="4"/><text class="ink2 sm" x="180" y="196" text-anchor="middle">낱말 하나</text><text class="ink2 sm" x="348" y="196" text-anchor="middle">낱말 하나</text><text class="ink2 sm" x="516" y="196" text-anchor="middle">낱말 하나</text><text class="ink2 sm" x="96" y="84" text-anchor="start">굵은 선 — 앞 소리가 나오면 뒤 소리가 거의 늘 따라온다</text><text class="ink2 sm" x="526" y="84" text-anchor="start">가는 점선 — 무엇이 따라올지 정해져 있지 않다</text><rect x="96" y="232" width="720" height="86" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text class="ink2 sm" x="114" y="258" text-anchor="start">들리는 것은 끊김 없는 소리의 줄이다. 띄어쓰기도 쉼도 없다.</text><text class="ink2 sm" x="114" y="280" text-anchor="start">그런데 이어짐이 약해지는 자리가 낱말 경계와 겹친다. 그 자리를 찾아내는 것만으로</text><text class="ink2 sm" x="114" y="302" text-anchor="start">낱말의 후보가 나온다 — 뜻을 하나도 모르는 채로.</text><text class="ink bold" x="450" y="44" text-anchor="middle">소리의 줄에서 낱말을 오려 내는 법</text><text class="ink2 sm" x="450" y="68" text-anchor="middle">실험에서 쓰는 소리는 뜻이 없는 인공 음절이다. 위의 글자는 그 자리를 대신한 것이다</text>
</svg>