9 48.26 L286.58 47.94 L292.12 47.67 L297.5 47.43 L302.72 47.23 L307.76 47.05 L312.62 46.89 L317.29 46.76 L321.77 46.64 L326.04 46.54 L330.12 46.46 L333.99 46.38 L337.65 46.32 L341.12 46.27 L344.38 46.22 L347.45 46.19 L350.32 46.15 L353 46.13 L355.5 46.1 L357.82 46.09 L359.97 46.07 L361.95 46.06 L363.78 46.05 L365.46 46.04 L366.99 46.03 L368.4 46.03 L369.67 46.02 L370.83 46.02 L371.88 46.01 L372.83 46.01 L373.68 46.01 L374.45 46.01 L375.13 46.01 L375.74 46 L376.29 46 L376.77 46 L377.2 46 L377.57 46 L377.91 46 L378.2 46 L378.45 46 L378.67 46 L378.87 46 L379.03 46 L379.18 46 L379.3 46 L379.41 46 L379.5 46 L379.58 46 L379.65 46 L379.71 46 L379.76 46 L379.8 46"/><text class="ink bold sm" x="190.56" y="50.44" text-anchor="middle">민감도 2</text><path class="gr" stroke-dasharray="4 3" d="M103.77 137.32 L175.32 137.32"/><circle class="f1" cx="103.77" cy="137.32" r="5.5"/><text class="ink sm" x="111.77" y="125.32" text-anchor="start">엄격한 준거</text><circle class="f1" cx="130.98" cy="92.98" r="5.5"/><text class="ink sm" x="121.98" y="96.98" text-anchor="end">중립</text><circle class="f1" cx="175.32" cy="65.77" r="5.5"/><text class="ink sm" x="185.32" y="70.77" text-anchor="start">느슨한 준거</text><circle class="f3" cx="175.32" cy="137.32" r="5.5"/><text class="ink sm" x="185.32" y="157.32" text-anchor="start">적중률은 같고 민감도가 작다</text><text class="ink bold sm" x="438" y="70" text-anchor="start">한 곡선 위의 점들은 민감도가 같다.</text><text class="ink2 sm" x="438" y="91" text-anchor="start">준거만 다르다. 느슨하게 답하면 오른쪽 위로,</text><text class="ink2 sm" x="438" y="112" text-anchor="start">엄격하게 답하면 왼쪽 아래로 미끄러진다.</text><text class="ink2 sm" x="438" y="133" text-anchor="start"></text><text class="ink bold sm" x="438" y="154" text-anchor="start">적중률이 0.84 인 관찰자와 0.93 인 관찰자가</text><text class="ink2 sm" x="438" y="175" text-anchor="start">같은 곡선 위에 있을 수 있다. 그러면 둘은</text><text class="ink2 sm" x="438" y="196" text-anchor="start">민감도가 같고 답하는 버릇만 다른 것이다.</text><text class="ink2 sm" x="438" y="217" text-anchor="start"></text><text class="ink bold sm" x="438" y="238" text-anchor="start">가로로 그은 점선 위의 두 점은 적중률이 같다.</text><text class="ink2 sm" x="438" y="259" text-anchor="start">그런데 곡선이 다르므로 민감도가 다르다.</text><text class="ink2 sm" x="438" y="280" text-anchor="start"></text><text class="ink bold sm" x="438" y="301" text-anchor="start">오경보율을 함께 보지 않으면 이 구별을 할 수 없다.</text><text class="ink2 sm" x="438" y="322" text-anchor="start">왼쪽 위로 갈수록 민감도가 크고,</text><text class="ink2 sm" x="438" y="343" text-anchor="start">대각선은 신호와 잡음을 전혀 못 가르는 상태다.</text>
</svg>