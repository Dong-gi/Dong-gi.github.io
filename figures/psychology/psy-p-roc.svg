<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 424" width="860" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">ROC 곡선</title><desc id="d">준거를 옮기면 같은 곡선 위를 움직이고 민감도가 달라져야 다른 곡선으로 간다</desc>
<style>
