<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">비교 조건이 효과크기를 바꾼다</title><desc id="d">같은 개입이라도 무엇과 견주느냐에 따라 보고되는 효과크기가 달라진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="60" y="52" text-anchor="start">같은 개입을 무엇과 견주었는가에 따라 나오는 효과크기</text>
<path d="M300 82 L300 300" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ink2 sm" x="300" y="322" text-anchor="middle">0</text>
<text class="ink2 sm" x="410" y="322" text-anchor="start">효과크기가 커지는 쪽</text>
<rect x="300" y="94" width="220" height="34" rx="3" fill="var(--s2)" fill-opacity="0.8" stroke="var(--s2)" stroke-width="1.4"/>
<text class="ink bold sm" x="284" y="117" text-anchor="end">아무것도 하지 않은 집단과 견줌</text>
<text class="ink2 sm" x="532" y="117" text-anchor="start">가장 크게 나온다</text>
<rect x="300" y="148" width="158.4" height="34" rx="3" fill="var(--s2)" fill-opacity="0.8" stroke="var(--s2)" stroke-width="1.4"/>
<text class="ink bold sm" x="284" y="171" text-anchor="end">대기자 명단과 견줌</text>
<text class="ink2 sm" x="470.4" y="171" text-anchor="start">기다리는 동안 나빠지는 몫이 섞인다</text>
<rect x="300" y="202" width="88" height="34" rx="3" fill="var(--s1)" fill-opacity="0.8" stroke="var(--s1)" stroke-width="1.4"/>
<text class="ink bold sm" x="284" y="225" text-anchor="end">겉모양만 갖춘 다른 활동과 견줌</text>
<text class="ink2 sm" x="400" y="225" text-anchor="start">기대와 관심의 몫이 빠진다</text>
<rect x="300" y="256" width="26.4" height="34" rx="3" fill="var(--s3)" fill-opacity="0.8" stroke="var(--s3)" stroke-width="1.4"/>
<text class="ink bold sm" x="284" y="279" text-anchor="end">이미 쓰이는 다른 처치와 견줌</text>
<text class="ink2 sm" x="338.4" y="279" text-anchor="start">가장 작게 나온다</text>
</svg>