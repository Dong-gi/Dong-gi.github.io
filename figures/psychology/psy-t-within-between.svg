<text class="ink bold sm" x="241" y="218.15" text-anchor="middle">집단 안의 차이</text>
<path class="s1" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M241 323.85 L422.29 323.85"/>
<path class="s1" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#ar1)" d="M422.29 323.85 L241 323.85"/>
<text class="ink bold sm" x="331.64" y="347.85" text-anchor="middle">집단 사이의 차이</text>
<text class="ink bold sm" x="608" y="116" text-anchor="start">같은 씨앗 봉지에서</text>
<text class="ink bold sm" x="608" y="136" text-anchor="start">한 줌씩 나눠 심었다</text>
<text class="ink2 sm" x="608" y="170" text-anchor="start">한 화분 안에서 키가 다른 것은</text>
<text class="ink2 sm" x="608" y="190" text-anchor="start">흙이 같으므로 씨앗의 차이다.</text>
<text class="ink2 sm" x="608" y="210" text-anchor="start">즉 집단 안의 유전율이 1 이다.</text>
<text class="ink2 sm" x="608" y="244" text-anchor="start">그런데 두 화분의 평균이 다른</text>
<text class="ink2 sm" x="608" y="264" text-anchor="start">것은 전부 흙 때문이다. 씨앗은</text>
<text class="ink2 sm" x="608" y="284" text-anchor="start">같은 봉지에서 나왔다.</text>
<text class="ink bold sm" x="608" y="318" text-anchor="start">집단 안의 유전율이 아무리</text>
<text class="ink bold sm" x="608" y="338" text-anchor="start">높아도 집단 사이의 차이에</text>
<text class="ink bold sm" x="608" y="358" text-anchor="start">대해서는 아무 말도 하지 않는다.</text>
</svg>