<title id="t">집단 안의 차이와 집단 사이의 차이는 다른 물음이다</title><desc id="d">같은 씨앗을 두 흙에 나눠 심으면 집단 안의 차이는 유전이고 집단 사이의 차이는 흙이다</desc>
