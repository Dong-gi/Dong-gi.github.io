<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">역추론과 기저율</title><desc id="d">영역이 켜졌다는 사실에서 심리 과정을 되짚을 때 기저율이 답을 정한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="70" y="86" width="108" height="240" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><rect x="178" y="86" width="252" height="240" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.6"/><rect x="70" y="158" width="108" height="168" rx="4" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.6"/><rect x="178" y="230" width="252" height="96" rx="4" fill="var(--s2)" fill-opacity="0.5" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="124" y="56" text-anchor="middle">그 과정이</text><text class="ink bold sm" x="124" y="72" text-anchor="middle">있는 과제 30%</text><text class="ink bold sm" x="304" y="56" text-anchor="middle">그 과정이 없는 과제 70%</text><text class="ink sm" x="124" y="184" text-anchor="middle">켜짐</text><text class="ink sm" x="124" y="202" text-anchor="middle">70%</text><text class="ink sm" x="304" y="256" text-anchor="middle">그래도 켜짐 40%</text><text class="ink2 sm" x="250" y="348" text-anchor="middle">가로 폭 = 과제의 비율 · 세로 높이 = 켜지는 비율</text><text class="ink2 sm" x="250" y="366" text-anchor="middle">그래서 칠해진 넓이가 실제 건수의 비율이다</text><text class="ink bold sm" x="560" y="106" text-anchor="start">이제 켜진 경우만 모아 본다</text><text class="ink2 sm" x="560" y="126" text-anchor="start">넓이의 비가 그대로 답이다</text><rect x="560" y="150" width="107.14" height="58" rx="4" fill="var(--s1)" fill-opacity="0.55" stroke="var(--s1)" stroke-width="1.6"/><rect x="667.14" y="150" width="142.86" height="58" rx="4" fill="var(--s2)" fill-opacity="0.5" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="613.57" y="185" text-anchor="middle">43%</text><text class="ink bold" x="738.57" y="185" text-anchor="middle">57%</text><text class="ink sm" x="560" y="232" text-anchor="start">그 과정이었을 확률 43%</text><text class="ink sm" x="560" y="252" text-anchor="start">아니었을 확률 57%</text><text class="ink bold sm" x="560" y="290" text-anchor="start">켜졌다는 사실만으로는</text><text class="ink bold sm" x="560" y="310" text-anchor="start">동전 던지기보다 나을 것이 없다</text><text class="ink bold" x="70" y="32" text-anchor="start">어떤 영역이 켜졌다. 그 심리 과정이 일어난 것인가</text>
</svg>