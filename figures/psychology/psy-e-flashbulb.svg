sm" x="358" y="332" text-anchor="middle">사건이 있고 나서 흐른 해 수</text><text class="ink2 sm" x="34" y="76" text-anchor="start">높음</text><rect x="630" y="96" width="212" height="128" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="646" y="122" text-anchor="start">어떻게 알 수 있나</text><text class="ink2 sm" x="646" y="146" text-anchor="start">사건 바로 다음 날 적어 둔</text><text class="ink2 sm" x="646" y="164" text-anchor="start">기록이 있어야 한다. 그것과</text><text class="ink2 sm" x="646" y="182" text-anchor="start">뒤의 보고를 맞춰 보는 것이</text><text class="ink2 sm" x="646" y="200" text-anchor="start">이 연구들의 설계다</text><text class="ink bold" x="430" y="36" text-anchor="middle">생생함은 정확함이 아니다 — 도식</text><text class="ink2 sm" x="430" y="366" text-anchor="middle">여러 추적 연구가 보고한 방향을 옮긴 도식이다. 값이 아니라 두 선이 갈라진다는 것만 읽는다</text>
</svg>