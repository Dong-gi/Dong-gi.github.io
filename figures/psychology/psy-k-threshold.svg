<path d="M352 300 L352 90" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<path d="M389.8 300 L389.8 90" fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<text class="ink2 sm" x="352" y="80" text-anchor="middle">문턱을 여기 두면</text>
<text class="ink2 sm" x="395.8" y="102" text-anchor="start">여기 두면</text>
<text class="ink bold sm" x="370.9" y="326" text-anchor="middle">이만큼의 사람이 편을 바꾼다</text>
<text class="ink bold sm" x="556" y="106" text-anchor="start">문턱은 자료에서 발견된 것이</text>
<text class="ink bold sm" x="556" y="126" text-anchor="start">아니라 정해진 것이다</text>
<text class="ink2 sm" x="556" y="158" text-anchor="start">분포에 골짜기가 없으면 어디를</text>
<text class="ink2 sm" x="556" y="178" text-anchor="start">잘라도 자를 수 있다. 그리고</text>
<text class="ink2 sm" x="556" y="198" text-anchor="start">어디를 자르느냐가 이름을 받는</text>
<text class="ink2 sm" x="556" y="218" text-anchor="start">사람 수를 크게 바꾼다.</text>
<text class="ink2 sm" x="556" y="250" text-anchor="start">그래서 분류 체계가 개정될 때마다</text>
<text class="ink2 sm" x="556" y="270" text-anchor="start">이 자리가 논쟁이 된다.</text>
<text class="ink2 sm" x="556" y="302" text-anchor="start">가로축은 이름 없는 보기다.</text>
<text class="ink2 sm" x="556" y="322" text-anchor="start">특정한 무엇에 대한 그림이 아니다.</text>
</svg>