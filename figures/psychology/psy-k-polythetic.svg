<text class="ink" x="190" y="296" text-anchor="start">열 개 가운데 다섯 개 이상을 만족하는 조합은 638가지다.</text>
<text class="ink2" x="190" y="320" text-anchor="start">하나의 이름 아래 638가지가 들어 있다는 뜻이다.</text>
<text class="ink2 sm" x="190" y="352" text-anchor="start">항목은 전부 이름 없는 보기다. 이 그림은 분류 규칙의 성질에 대한 것이지 무엇을 판별하는 방법이 아니다.</text>
