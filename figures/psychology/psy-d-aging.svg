<title id="t">같은 능력을 횡단으로 잰 곡선과 종단으로 잰 곡선</title><desc id="d">횡단은 이른 나이부터 꾸준히 내려가고 종단은 오래 유지되다 늦게 내려간다. 눈금 없는 도식이다</desc>
