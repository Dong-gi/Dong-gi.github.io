<text class="ink bold" x="478" y="216.04" text-anchor="middle">횡단</text>
<text class="ink bold" x="406" y="111.29" text-anchor="middle">종단</text>
<text class="ink bold sm" x="624" y="108" text-anchor="start">두 곡선이 갈리는 까닭</text>
<text class="ink2 sm" x="624" y="134" text-anchor="start">횡단에서 80세와 30세는</text>
<text class="ink2 sm" x="624" y="154" text-anchor="start">나이만 다른 것이 아니라</text>
<text class="ink2 sm" x="624" y="174" text-anchor="start">자란 시대가 다르다.</text>
<text class="ink2 sm" x="624" y="208" text-anchor="start">종단에서는 시대가 같지만</text>
<text class="ink2 sm" x="624" y="228" text-anchor="start">탈락과 연습이 끼어든다.</text>
<text class="ink2 sm" x="624" y="262" text-anchor="start">세로축 눈금은 일부러</text>
<text class="ink2 sm" x="624" y="282" text-anchor="start">넣지 않았다. 모양만</text>
<text class="ink2 sm" x="624" y="302" text-anchor="start">옮긴 도식이다.</text>
</svg>