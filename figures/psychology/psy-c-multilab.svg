<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="410" y="32" text-anchor="middle">연구실 하나가 아니라 여럿이 같은 절차로 잰다</text><text class="ink bold sm" x="30" y="76" text-anchor="start">원 연구</text><path d="M401.5 72 L632.5 72" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M401.5 66 L401.5 78" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M632.5 66 L632.5 78" fill="none" stroke="var(--s2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="517" cy="72" r="5.5" fill="var(--s2)"/><text class="ink2 sm" x="644.5" y="77" text-anchor="start">표본이 작아 구간이 넓다</text><text class="ink2 sm" x="286" y="106" text-anchor="middle">효과 0</text><path d="M24 96 L796 96" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="30" y="120" text-anchor="start">되풀이한 연구실들</text><path d="M61.31 138 L303.87 138" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="182.59" cy="138" r="3.6" fill="var(--s1)"/><path d="M195.08 157 L393.99 157" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="294.53" cy="157" r="3.6" fill="var(--s1)"/><path d="M283.41 176 L467.71 176" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="375.56" cy="176" r="3.6" fill="var(--s1)"/><path d="M186.76 195 L390.36 195" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="288.56" cy="195" r="3.6" fill="var(--s1)"/><path d="M106.83 214 L307.63 214" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="207.23" cy="214" r="3.6" fill="var(--s1)"/><path d="M239.88 233 L410.66 233" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="325.27" cy="233" r="3.6" fill="var(--s1)"/><path d="M171 252 L391.42 252" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="281.21" cy="252" r="3.6" fill="var(--s1)"/><path d="M215.94 271 L422.91 271" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="319.43" cy="271" r="3.6" fill="var(--s1)"/><path d="M174.56 290 L359.15 290" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="266.86" cy="290" r="3.6" fill="var(--s1)"/><path d="M88.07 309 L306.77 309" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="197.42" cy="309" r="3.6" fill="var(--s1)"/><path d="M233.98 328 L420.74 328" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="327.36" cy="328" r="3.6" fill="var(--s1)"/><path d="M24 347 L796 347" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold sm" x="30" y="366" text-anchor="start">전부 합치면</text><path d="M267.85 361 L304.15 361" fill="none" stroke="var(--s3)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="286" cy="361" r="5.5" fill="var(--s3)"/><text class="ink sm" x="310.75" y="366" text-anchor="start">구간이 좁아지고 0 을 감싼다</text><path d="M286 114 L286 377" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text class="ink2 sm" x="410" y="400" text-anchor="middle">가로 막대는 추정값의 불확실성 구간이다. 구간이 0 을 감싸면 효과가 있다고 말할 수 없다</text>
</svg>