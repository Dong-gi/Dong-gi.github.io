 text-anchor="start">있다면 언제인가다.</text><text class="ink2 sm" x="660" y="248" text-anchor="start">자료를 많이 모을수록</text><text class="ink2 sm" x="660" y="266" text-anchor="start">이 물음이 예리해진다</text><text class="ink bold" x="440" y="38" text-anchor="middle">같은 자료, 두 가지 모양 — 도식</text><text class="ink2 sm" x="440" y="374" text-anchor="middle">세로축에 눈금을 달지 않았다. 두 곡선은 실제 자료가 아니라 논쟁의 두 입장을 그린 것이다</text>
