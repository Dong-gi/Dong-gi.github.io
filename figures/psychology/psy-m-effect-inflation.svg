4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/><text class="ink2 sm" x="332" y="355" text-anchor="start">유의성 문턱 — 이 위로 올라간 연구가 유의하다고 보고된다</text><rect x="624" y="92" width="200" height="166" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text class="ink bold sm" x="640" y="118" text-anchor="start">큰 점만 출판되면</text><text class="ink2 sm" x="640" y="142" text-anchor="start">문헌에 남는 값이 참값보다</text><text class="ink2 sm" x="640" y="162" text-anchor="start">크다. 그리고 표본이</text><text class="ink2 sm" x="640" y="182" text-anchor="start">작을수록 더 크게</text><text class="ink2 sm" x="640" y="202" text-anchor="start">부풀린다</text><text class="ink2 sm" x="640" y="232" text-anchor="start">6장이 이것을 다시 쓴다</text><text class="ink bold" x="420" y="30" text-anchor="middle">작은 표본에서 유의한 결과는 효과를 부풀린다 — 도식</text><text class="ink2 sm" x="420" y="386" text-anchor="middle">문턱 곡선의 정확한 위치는 검정 방법이 정한다. 여기서는 왼쪽에서 높고 오른쪽에서 낮다는 모양만 보인다</text>
