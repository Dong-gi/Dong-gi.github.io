<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 322" width="860" height="322" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">방출이 의미론에서 하는 일</title><desc id="d">가정이 열린 줄과 방출된 줄을 나란히 놓고, 방출된 가정이 기대는 목록에서 빠지는 대신 조건문의 앞자리로 옮겨 감을 점선 경로로 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="20" y="30" width="372" height="176" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="206" y="52" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">j 번 줄 — 가정 φ 가 아직 열려 있다</text><rect x="44" y="76" width="150" height="96" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text x="119" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11">기대고 있는 것</text><text x="60" y="122" text-anchor="start" fill="var(--ink)" font-size="11">Γ<tspan baseline-shift="-22%" font-size="76%">k</tspan> 의 식들</text><text x="60" y="150" text-anchor="start" fill="var(--s2)" font-weight="600">φ</text><text x="214" y="128" text-anchor="start" fill="var(--ink2)">⊨</text><text x="246" y="128" text-anchor="start" fill="var(--ink)">ψ</text><text x="110" y="194" text-anchor="start" fill="var(--ink2)" font-size="11">귀납 가설이 주는 것</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M400 118 L456 118"/><text x="428" y="104" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">방출</text><rect x="468" y="30" width="372" height="176" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="654" y="52" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">k 번 줄 — 가정을 닫았다</text><rect x="492" y="76" width="150" height="96" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text x="567" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11">기대고 있는 것</text><text x="508" y="122" text-anchor="start" fill="var(--ink)" font-size="11">Γ<tspan baseline-shift="-22%" font-size="76%">k</tspan> 의 식들</text><text x="508" y="150" text-anchor="start" fill="var(--ink2)" font-size="11">(φ 가 빠졌다)</text><text x="662" y="128" text-anchor="start" fill="var(--ink2)">⊨</text><text x="694" y="128" text-anchor="start" fill="var(--s2)" font-weight="600">φ</text><text x="710" y="128" text-anchor="start" fill="var(--ink)">→ ψ</text><text x="492" y="194" text-anchor="start" fill="var(--ink2)" font-size="11">보여야 하는 것</text><path d="M68 158 L68 236 L694 236 L694 140" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="381" y="254" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">φ 는 사라지지 않고 화살표의 앞자리로 옮겨 갔다</text><path d="M40 274 L820 274" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="300" text-anchor="middle" fill="var(--ink)" font-size="11">두 줄이 같은 말이라는 보장이 6장의 의미론적 연역정리다. 7장이 ‘같은 문장이 두 번 나온 것’ 이라고 적어 둔 자리가 여기서 만난다</text>
</svg>