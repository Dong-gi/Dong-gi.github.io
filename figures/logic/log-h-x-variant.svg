<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" width="800" height="336" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">배정을 한 자리만 고치기</title><desc id="d">두 표가 x 행만 다르고 나머지 행은 같다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">정의역이 D = { 1, 2, 3 } 일 때의 배정 g 와, 그것을 한 자리만 고친 g[x ↦ 3]</text><rect x="14" y="48" width="320" height="214" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="174" y="68" text-anchor="middle">배정 g</text><text class="ink2 sm" x="174" y="85" text-anchor="middle">변수는 무한히 많고 g 는 그 전부에 값을 준다</text><text x="92" y="106" text-anchor="middle" fill="var(--ink2)" font-size="11">변수</text><text x="232" y="106" text-anchor="middle" fill="var(--ink2)" font-size="11">D 안의 값</text><path d="M44 115 L304 115" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="142" text-anchor="middle" fill="var(--ink)" font-weight="600">x</text><text x="169" y="142" text-anchor="middle" fill="var(--ink2)">↦</text><text x="232" y="142" text-anchor="middle" fill="var(--ink)" font-weight="600">1</text><text x="92" y="172" text-anchor="middle" fill="var(--ink)" font-weight="600">y</text><text x="169" y="172" text-anchor="middle" fill="var(--ink2)">↦</text><text x="232" y="172" text-anchor="middle" fill="var(--ink)" font-weight="600">2</text><text x="92" y="202" text-anchor="middle" fill="var(--ink)" font-weight="600">z</text><text x="169" y="202" text-anchor="middle" fill="var(--ink2)">↦</text><text x="232" y="202" text-anchor="middle" fill="var(--ink)" font-weight="600">1</text><text x="92" y="232" text-anchor="middle" fill="var(--ink)" font-weight="600">x₁</text><text x="169" y="232" text-anchor="middle" fill="var(--ink2)">↦</text><text x="232" y="232" text-anchor="middle" fill="var(--ink)" font-weight="600">3</text><text x="92" y="262" text-anchor="middle" fill="var(--ink2)">⋮</text><text x="232" y="262" text-anchor="middle" fill="var(--ink2)">⋮</text><rect x="466" y="48" width="320" height="214" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="626" y="68" text-anchor="middle">고친 배정 g[x ↦ 3]</text><text class="ink2 sm" x="626" y="85" text-anchor="middle">x 한 자리만 다르고 나머지는 g 와 같다</text><text x="544" y="106" text-anchor="middle" fill="var(--ink2)" font-size="11">변수</text><text x="684" y="106" text-anchor="middle" fill="var(--ink2)" font-size="11">D 안의 값</text><path d="M496 115 L756 115" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="124" width="260" height="26" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.2"/><text x="544" y="142" text-anchor="middle" fill="var(--ink)" font-weight="600">x</text><text x="621" y="142" text-anchor="middle" fill="var(--ink2)">↦</text><text x="684" y="142" text-anchor="middle" fill="var(--s2)" font-weight="600">3</text><text x="544" y="172" text-anchor="middle" fill="var(--ink)" font-weight="600">y</text><text x="621" y="172" text-anchor="middle" fill="var(--ink2)">↦</text><text x="684" y="172" text-anchor="middle" fill="var(--ink)" font-weight="600">2</text><text x="544" y="202" text-anchor="middle" fill="var(--ink)" font-weight="600">z</text><text x="621" y="202" text-anchor="middle" fill="var(--ink2)">↦</text><text x="684" y="202" text-anchor="middle" fill="var(--ink)" font-weight="600">1</text><text x="544" y="232" text-anchor="middle" fill="var(--ink)" font-weight="600">x₁</text><text x="621" y="232" text-anchor="middle" fill="var(--ink2)">↦</text><text x="684" y="232" text-anchor="middle" fill="var(--ink)" font-weight="600">3</text><text x="544" y="262" text-anchor="middle" fill="var(--ink2)">⋮</text><text x="684" y="262" text-anchor="middle" fill="var(--ink2)">⋮</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M346 152 L456 152"/><text x="401" y="138" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">x 자리만</text><text x="401" y="174" text-anchor="middle" fill="var(--ink2)" font-size="11">나머지는</text><text x="401" y="190" text-anchor="middle" fill="var(--ink2)" font-size="11">그대로</text><path d="M14 286 L786 286" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="308" text-anchor="middle" fill="var(--ink)" font-size="11">∀x 조항이 하는 일이 이 갈아 끼움이다 — D 의 원소 d 마다 g[x ↦ d] 를 만들어 확인한다.</text><text x="400" y="326" text-anchor="middle" fill="var(--ink2)" font-size="11">갈아 끼우는 자리가 하나뿐이므로 안쪽 한정사가 바깥 한정사의 변수를 흐트러뜨리지 않는다.</text>
</svg>