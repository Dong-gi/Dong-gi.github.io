<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 364" width="780" height="364" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">명제논리의 어휘 세 무리와 어휘가 아닌 기호들</title><desc id="d">문장문자는 무한히 많고 번호를 붙일 수 있으며, 연결자는 부정 논리곱 논리합 함의 동치 다섯 개로 항수가 정해져 있고, 괄호는 구두점이다. 모순 기호와 귀결 기호, 한정사, 메타언어 변수는 어휘가 아니다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">어휘는 세 무리뿐이고, 이 목록에 없는 기호는 논리식 안에 나타날 수 없다</text><rect x="20" y="44" width="232" height="176" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="136" y="64" text-anchor="middle">문장문자</text><text class="ink2 sm" x="136" y="80" text-anchor="middle">무한히 많다</text><text class="sm bold" fill="var(--s1)" x="44" y="112" text-anchor="start">P</text><text class="sm bold" fill="var(--s1)" x="86" y="112" text-anchor="start">Q</text><text class="sm bold" fill="var(--s1)" x="128" y="112" text-anchor="start">R</text><text class="sm bold" fill="var(--s1)" x="44" y="142" text-anchor="start">P<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text class="sm bold" fill="var(--s1)" x="82" y="142" text-anchor="start">P<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text class="sm bold" fill="var(--s1)" x="120" y="142" text-anchor="start">P<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><text class="sm bold" fill="var(--s1)" x="158" y="142" text-anchor="start">P<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><text class="sm bold" fill="var(--s1)" x="196" y="142" text-anchor="start">…</text><text class="ink2 sm" x="38" y="172" text-anchor="start">번호를 붙일 수 있으므로</text><text class="ink2 sm" x="38" y="189" text-anchor="start">모자랄 일이 없고, 그러면서도</text><text class="ink2 sm" x="38" y="206" text-anchor="start">하나씩 세어 나갈 수 있다</text><rect x="266" y="44" width="268" height="176" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="400" y="64" text-anchor="middle">연결자 다섯</text><text class="ink2 sm" x="400" y="80" text-anchor="middle">항수가 정해져 있다</text><text class="sm bold" fill="var(--s2)" x="292" y="106" text-anchor="start">¬</text><text class="ink sm" x="330" y="106" text-anchor="start">부정</text><text class="ink2 sm" x="430" y="106" text-anchor="start">1항</text><text class="ink2 sm" x="478" y="106" text-anchor="start">재료 하나</text><text class="sm bold" fill="var(--s2)" x="292" y="127" text-anchor="start">∧</text><text class="ink sm" x="330" y="127" text-anchor="start">논리곱</text><text class="ink2 sm" x="430" y="127" text-anchor="start">2항</text><text class="ink2 sm" x="478" y="127" text-anchor="start">재료 둘</text><text class="sm bold" fill="var(--s2)" x="292" y="148" text-anchor="start">∨</text><text class="ink sm" x="330" y="148" text-anchor="start">논리합</text><text class="ink2 sm" x="430" y="148" text-anchor="start">2항</text><text class="ink2 sm" x="478" y="148" text-anchor="start">재료 둘</text><text class="sm bold" fill="var(--s2)" x="292" y="169" text-anchor="start">→</text><text class="ink sm" x="330" y="169" text-anchor="start">함의</text><text class="ink2 sm" x="430" y="169" text-anchor="start">2항</text><text class="ink2 sm" x="478" y="169" text-anchor="start">재료 둘</text><text class="sm bold" fill="var(--s2)" x="292" y="190" text-anchor="start">↔</text><text class="ink sm" x="330" y="190" text-anchor="start">동치</text><text class="ink2 sm" x="430" y="190" text-anchor="start">2항</text><text class="ink2 sm" x="478" y="190" text-anchor="start">재료 둘</text><rect x="548" y="44" width="212" height="176" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="654" y="64" text-anchor="middle">괄호</text><text class="ink2 sm" x="654" y="80" text-anchor="middle">구두점이다</text><text class="sm bold" fill="var(--s3)" x="624" y="126" text-anchor="start">(</text><text class="sm bold" fill="var(--s3)" x="676" y="126" text-anchor="start">)</text><text class="ink2 sm" x="566" y="154" text-anchor="start">뜻을 가진 기호가 아니다.</text><text class="ink2 sm" x="566" y="171" text-anchor="start">어느 조항이 어디에 쓰였는지를</text><text class="ink2 sm" x="566" y="188" text-anchor="start">종이에 남기는 표시일 뿐이다</text><rect x="20" y="234" width="740" height="96" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="390" y="254" text-anchor="middle">어휘에 없는 것 — 섞여 들어오기 쉬운 기호들</text><text class="ink2 sm" x="40" y="278" text-anchor="start">⊥ — 7장에서 어휘에 더한다. 어휘를 늘리는 일이 곧 정의에 조항 하나를 더하는 일이다</text><text class="ink2 sm" x="40" y="296" text-anchor="start">∀ ∃ — 9장에서 다른 언어를 세울 때 쓴다. 명제논리의 어휘에는 없다</text><text class="ink2 sm" x="40" y="314" text-anchor="start">φ ψ Γ — 메타언어의 변수다. 논리식 안에 이 글자가 적히는 일은 없다. 마지막 절에서 다룬다</text>
</svg>