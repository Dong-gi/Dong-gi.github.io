<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">튜링 기계의 네 부품</title><desc id="d">테이프와 헤드와 상태와 전이표를 한 장에 놓고, 유한한 것과 무한한 것을 갈라 적었다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="410" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">튜링 기계 M — 부품은 넷이고 그중 무한한 것은 테이프 하나뿐이다</text><rect x="113" y="62" width="54" height="46" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="140" y="91" text-anchor="middle" fill="var(--ink)">…</text><rect x="167" y="62" width="54" height="46" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="194" y="91" text-anchor="middle" fill="var(--ink)">□</text><rect x="221" y="62" width="54" height="46" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="248" y="91" text-anchor="middle" fill="var(--ink)">1</text><rect x="275" y="62" width="54" height="46" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="302" y="91" text-anchor="middle" fill="var(--ink)">0</text><rect x="329" y="62" width="54" height="46" rx="2" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.8"/><text x="356" y="91" text-anchor="middle" fill="var(--s2)" font-weight="600">1</text><rect x="383" y="62" width="54" height="46" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="410" y="91" text-anchor="middle" fill="var(--ink)">1</text><rect x="437" y="62" width="54" height="46" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="464" y="91" text-anchor="middle" fill="var(--ink)">0</text><rect x="491" y="62" width="54" height="46" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="518" y="91" text-anchor="middle" fill="var(--ink)">□</text><rect x="545" y="62" width="54" height="46" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="572" y="91" text-anchor="middle" fill="var(--ink)">□</text><rect x="599" y="62" width="54" height="46" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="626" y="91" text-anchor="middle" fill="var(--ink)">□</text><rect x="653" y="62" width="54" height="46" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="680" y="91" text-anchor="middle" fill="var(--ink)">…</text><text x="101" y="92" text-anchor="end" fill="var(--ink2)" font-size="11">왼쪽으로</text><text x="719" y="92" text-anchor="start" fill="var(--ink2)" font-size="11">오른쪽으로</text><text x="410" y="50" text-anchor="middle" fill="var(--ink2)" font-size="11">테이프 — 칸마다 기호 하나. 거의 모든 칸이 빈칸 □ 이고 양쪽으로 끝이 없다</text><path d="M356 112 L345 126 L367 126 z" fill="var(--s1)"/><path d="M356 126 L356 148" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="264" y="148" width="184" height="34" rx="5" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.6"/><text x="356" y="170" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">헤드 — 이 칸 하나를 본다</text><ellipse cx="72" cy="165" rx="46" ry="26" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.8"/><text x="72" y="163" text-anchor="middle" fill="var(--s3)" font-size="11">상태</text><text x="72" y="180" text-anchor="middle" fill="var(--s3)" font-weight="600">q<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="72" y="212" text-anchor="middle" fill="var(--ink2)" font-size="11">유한 개 가운데 하나</text><rect x="14" y="226" width="400" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="214" y="246" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">전이표 δ — 기계 M 은 이 표가 전부다</text><text x="214" y="263" text-anchor="middle" fill="var(--ink2)" font-size="11">지금 상태와 읽은 기호로 줄 하나가 정해진다</text><text x="46" y="292" text-anchor="start" fill="var(--ink2)" font-size="11">상태</text><text x="122" y="292" text-anchor="start" fill="var(--ink2)" font-size="11">읽음</text><text x="210" y="292" text-anchor="start" fill="var(--ink2)" font-size="11">새 상태</text><text x="288" y="292" text-anchor="start" fill="var(--ink2)" font-size="11">쓸 기호</text><text x="356" y="292" text-anchor="start" fill="var(--ink2)" font-size="11">이동</text><path d="M34 302 L394 302" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="332" text-anchor="start" fill="var(--ink)" font-size="11">q<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><text x="122" y="332" text-anchor="start" fill="var(--ink)" font-size="11">1</text><text x="210" y="332" text-anchor="start" fill="var(--ink)" font-size="11">q<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="288" y="332" text-anchor="start" fill="var(--ink)" font-size="11">1</text><text x="356" y="332" text-anchor="start" fill="var(--ink)" font-size="11">오른쪽</text><rect x="34" y="342" width="360" height="26" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.2"/><text x="46" y="360" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">q<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="122" y="360" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">1</text><text x="210" y="360" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">q<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text x="288" y="360" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">0</text><text x="356" y="360" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">오른쪽</text><text x="46" y="388" text-anchor="start" fill="var(--ink)" font-size="11">q<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="122" y="388" text-anchor="start" fill="var(--ink)" font-size="11">0</text><text x="210" y="388" text-anchor="start" fill="var(--ink)" font-size="11">q<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="288" y="388" text-anchor="start" fill="var(--ink)" font-size="11">0</text><text x="356" y="388" text-anchor="start" fill="var(--ink)" font-size="11">오른쪽</text><text x="46" y="416" text-anchor="start" fill="var(--ink)" font-size="11">q<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text x="122" y="416" text-anchor="start" fill="var(--ink)" font-size="11">□</text><text x="210" y="416" text-anchor="start" fill="var(--ink)" font-size="11">q<tspan baseline-shift="-22%" font-size="76%">halt</tspan></text><text x="288" y="416" text-anchor="start" fill="var(--ink)" font-size="11">1</text><text x="356" y="416" text-anchor="start" fill="var(--ink)" font-size="11">왼쪽</text><text x="214" y="460" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">지금 q<tspan baseline-shift="-22%" font-size="76%">1</tspan> 이고 1 을 읽었으므로 색칠한 줄이 다음 걸음이다</text><rect x="428" y="226" width="378" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="617" y="246" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">무엇이 유한하고 무엇이 무한한가</text><text x="617" y="263" text-anchor="middle" fill="var(--ink2)" font-size="11">이 갈라짐이 다음 절 전체를 떠받친다</text><text x="450" y="306" text-anchor="start" fill="var(--ink)" font-size="11">상태 집합 Q</text><text x="784" y="306" text-anchor="end" fill="var(--s3)" font-size="11" font-weight="600">유한</text><text x="450" y="331" text-anchor="start" fill="var(--ink)" font-size="11">기호 집합 Σ (□ 포함)</text><text x="784" y="331" text-anchor="end" fill="var(--s3)" font-size="11" font-weight="600">유한</text><text x="450" y="356" text-anchor="start" fill="var(--ink)" font-size="11">전이표 δ 의 줄 수</text><text x="784" y="356" text-anchor="end" fill="var(--s3)" font-size="11" font-weight="600">유한</text><text x="450" y="381" text-anchor="start" fill="var(--ink)" font-size="11">테이프의 칸</text><text x="784" y="381" text-anchor="end" fill="var(--s2)" font-size="11" font-weight="600">무한</text><text x="450" y="406" text-anchor="start" fill="var(--ink)" font-size="11">한 계산이 밟는 걸음 수</text><text x="784" y="406" text-anchor="end" fill="var(--s2)" font-size="11" font-weight="600">유한할 수도, 아닐 수도</text><path d="M446 420 L788 420" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="617" y="442" text-anchor="middle" fill="var(--ink)" font-size="11">유한한 것만 적으면 기계 하나가 온전히 적힌다.</text><text x="617" y="460" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">그래서 기계도 문자열이고, 다른 기계의 입력이 된다</text>
</svg>