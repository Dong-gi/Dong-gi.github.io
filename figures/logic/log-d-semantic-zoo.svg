<text class="ink bold" x="395" y="26" text-anchor="middle">의미론의 개념은 전부 ‘어느 배당에서 참인가’ 하나로 정해진다</text><rect x="14" y="44" width="380" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="204" y="64" text-anchor="middle">한 논리식이 배당 여덟 개에서 갖는 값</text><text class="ink sm" x="34" y="84" text-anchor="start">항진명제 — 참인 칸이 전부다</text><rect x="34" y="94" width="34" height="26" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="51" y="111" text-anchor="middle">T</text><rect x="72" y="94" width="34" height="26" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="89" y="111" text-anchor="middle">T</text><rect x="110" y="94" width="34" height="26" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="127" y="111" text-anchor="middle">T</text><rect x="148" y="94" width="34" height="26" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="165" y="111" text-anchor="middle">T</text><rect x="186" y="94" width="34" height="26" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="203" y="111" text-anchor="middle">T</text><rect x="224" y="94" width="34" height="26" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="241" y="111" text-anchor="middle">T</text><rect x="262" y="94" width="34" height="26" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="279" y="111" text-anchor="middle">T</text><rect x="300" y="94" width="34" height="26" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.2"/><text class="ink sm" x="317" y="111" text-anchor="middle">T</text><text class="ink sm" x="34" y="150" text-anchor="start">모순 — 참인 칸이 하나도 없