<title id="t">항진명제 · 모순 · 우연과 의미론적 귀결을 배당의 칸으로 본 그림</title><desc id="d">배당 여덟 개를 칸으로 늘어놓고 어느 칸에서 참인지로 항진명제와 모순과 우연을 가르고, 귀결을 칸의 포함 관계로 보인다</desc>
