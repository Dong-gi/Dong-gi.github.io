<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 378" width="780" height="378" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">결합 우선순위 사다리와 괄호 복원 네 걸음</title><desc id="d">부정이 가장 세게 묶고 논리곱 논리합 함의 동치 순으로 약해지는 사다리와, 괄호를 지운 기호열에 우선순위를 따라 괄호를 하나씩 되돌리는 네 단계</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">세게 묶는 것이 먼저 괄호를 갖는다 — 위에서 아래로 한 칸씩 내려가며 괄호를 채운다</text><rect x="20" y="44" width="212" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="126" y="64" text-anchor="middle">결합 우선순위</text><text class="ink2 sm" x="126" y="80" text-anchor="middle">위가 세고 아래가 약하다</text><rect x="41" y="98" width="42" height="24" rx="5" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="62" y="114" text-anchor="middle">¬</text><text class="sm bold" fill="var(--s2)" x="92" y="114" text-anchor="start">가장 세게 묶는다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M62 123 L62 127"/><rect x="41" y="128" width="42" height="24" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="62" y="144" text-anchor="middle">∧</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M62 153 L62 157"/><rect x="41" y="158" width="42" height="24" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="62" y="174" text-anchor="middle">∨</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M62 183 L62 187"/><rect x="41" y="188" width="42" height="24" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="62" y="204" text-anchor="middle">→</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M62 213 L62 217"/><rect x="41" y="218" width="42" height="24" rx="5" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="62" y="234" text-anchor="middle">↔</text><text class="sm bold" fill="var(--s3)" x="92" y="234" text-anchor="start">가장 약하게 묶는다</text><text class="ink2 sm" x="36" y="262" text-anchor="start">∧ 과 ∨ 가 이어지면 왼쪽으로 묶고</text><text class="ink2 sm" x="36" y="279" text-anchor="start">→ 와 ↔ 가 이어지면 오른쪽으로 묶는다</text><rect x="246" y="44" width="514" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="503" y="64" text-anchor="middle">괄호를 되돌리는 세 걸음</text><text class="ink2 sm" x="503" y="80" text-anchor="middle">¬P ∧ Q → R ∨ S 가 가리키는 적형식을 찾는다</text><text class="sm bold" fill="var(--ink2)" x="266" y="118" text-anchor="start">0</text><text class="ink" x="288" y="119" text-anchor="start">¬P ∧ Q → R ∨ S</text><text class="sm" fill="var(--ink2)" x="482" y="118" text-anchor="start">줄임말이다. 적형식이 아니다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M272 125 L272 140"/><text class="sm bold" fill="var(--ink2)" x="266" y="154" text-anchor="start">1</text><text class="ink" x="288" y="155" text-anchor="start">(¬P ∧ Q) → R ∨ S</text><text class="sm" fill="var(--s2)" x="482" y="154" text-anchor="start">¬ 가 가장 세고 ∧ 이 다음이다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M272 161 L272 176"/><text class="sm bold" fill="var(--ink2)" x="266" y="190" text-anchor="start">2</text><text class="ink" x="288" y="191" text-anchor="start">(¬P ∧ Q) → (R ∨ S)</text><text class="sm" fill="var(--s1)" x="482" y="190" text-anchor="start">∨ 가 그다음이다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M272 197 L272 212"/><text class="sm bold" fill="var(--ink2)" x="266" y="226" text-anchor="start">3</text><text class="ink bold" x="288" y="227" text-anchor="start">((¬P ∧ Q) → (R ∨ S))</text><text class="sm" fill="var(--s3)" x="482" y="226" text-anchor="start">→ 가 가장 약하다. 적형식이다</text><text class="ink2 sm" x="266" y="252" text-anchor="start">3 번 줄만 정의가 인정하는 기호열이고 위 세 줄은 그것을 가리키는 줄임말이다.</text><text class="ink2 sm" x="266" y="270" text-anchor="start">¬P 에는 어느 단계에서도 괄호가 붙지 않는다 — ¬ 조항은 괄호를 두르지 않기 때문이다</text><text class="ink2 sm" x="24" y="316" text-anchor="start">읽어낼 것 — 이 사다리는 문법이 아니라 관습이다. 정의에는 우선순위라는 조항이 없고, 이항 조항마다 괄호를 두르라는 말만 있다.</text><text class="ink2 sm" x="24" y="336" text-anchor="start">그래서 괄호를 지운 줄임말은 적형식이 아니고, 적형식을 가리키는 이름이다. 13장 이후 ‘모든 적형식에 대하여’ 를 증명할 때</text><text class="ink2 sm" x="24" y="356" text-anchor="start">확인할 조항이 여섯 개(기저 하나와 연결자 다섯)로 끝나는 것이 이 구분 덕이다 — 관습까지 조항으로 치면 증명이 늘어난다</text>
</svg>