<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" width="880" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">도출의 줄마다 딸리는 가정 집합과 줄의 불변량</title><desc id="d">피치 스타일 도출표 오른쪽에 각 줄이 기대는 가정 집합과 그 줄의 의미론적 귀결 주장을 나란히 적어, 방출이 일어나는 줄에서 가정 집합이 줄어들고 마지막 줄에서 비게 됨을 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="34" y="44" text-anchor="start" fill="var(--ink)" font-weight="600">도출 한 벌과, 그 도출이 줄마다 지고 있는 장부</text><text x="34" y="66" text-anchor="start" fill="var(--ink2)" font-size="11">왼쪽 셋은 7장이 적던 것 그대로다. 오른쪽 둘이 이 장에서 새로 붙는 열이다</text><text x="48" y="96" text-anchor="end" fill="var(--ink2)" font-size="11">줄</text><text x="66" y="96" text-anchor="start" fill="var(--ink2)" font-size="11">논리식</text><text x="224" y="96" text-anchor="start" fill="var(--ink2)" font-size="11">근거</text><text x="334" y="96" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">기대고 있는 것</text><text x="504" y="96" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">줄의 불변량</text><path d="M28 104 L840 104" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M69 103 L60 103 L60 228" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M83 137 L74 137 L74 194" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="118" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="79" y="118" text-anchor="start" fill="var(--ink)">P</text><text x="224" y="118" text-anchor="start" fill="var(--ink2)" font-size="11">가정</text><text x="334" y="118" text-anchor="start" fill="var(--ink)" font-size="11">Γ<tspan baseline-shift="-22%" font-size="76%">1</tspan> = {P}</text><text x="504" y="118" text-anchor="start" fill="var(--ink)" font-size="11">{P} ⊨ P</text><text x="48" y="152" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="93" y="152" text-anchor="start" fill="var(--ink)">Q</text><text x="224" y="152" text-anchor="start" fill="var(--ink2)" font-size="11">가정</text><text x="334" y="152" text-anchor="start" fill="var(--ink)" font-size="11">Γ<tspan baseline-shift="-22%" font-size="76%">2</tspan> = {P, Q}</text><text x="504" y="152" text-anchor="start" fill="var(--ink)" font-size="11">{P, Q} ⊨ Q</text><text x="48" y="186" text-anchor="end" fill="var(--ink2)" font-size="11">3</text><text x="93" y="186" text-anchor="start" fill="var(--ink)">P</text><text x="224" y="186" text-anchor="start" fill="var(--ink2)" font-size="11">1 R</text><text x="334" y="186" text-anchor="start" fill="var(--ink)" font-size="11">Γ<tspan baseline-shift="-22%" font-size="76%">3</tspan> = {P, Q}</text><text x="504" y="186" text-anchor="start" fill="var(--ink)" font-size="11">{P, Q} ⊨ P</text><text x="48" y="220" text-anchor="end" fill="var(--ink2)" font-size="11">4</text><text x="79" y="220" text-anchor="start" fill="var(--ink)">Q → P</text><text x="224" y="220" text-anchor="start" fill="var(--ink2)" font-size="11">2–3 →I</text><text x="334" y="220" text-anchor="start" fill="var(--ink)" font-size="11">Γ<tspan baseline-shift="-22%" font-size="76%">4</tspan> = {P}</text><text x="504" y="220" text-anchor="start" fill="var(--ink)" font-size="11">{P} ⊨ Q → P</text><text x="48" y="254" text-anchor="end" fill="var(--ink2)" font-size="11">5</text><text x="65" y="254" text-anchor="start" fill="var(--ink)">P → (Q → P)</text><text x="224" y="254" text-anchor="start" fill="var(--ink2)" font-size="11">1–4 →I</text><text x="334" y="254" text-anchor="start" fill="var(--ink)" font-size="11">Γ<tspan baseline-shift="-22%" font-size="76%">5</tspan> = ∅</text><text x="504" y="254" text-anchor="start" fill="var(--ink)" font-size="11">⊨ P → (Q → P)</text><rect x="326" y="204" width="118" height="24" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><rect x="326" y="238" width="118" height="24" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M614 216 L642 216"/><text x="650" y="188" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">방출이 일어난 줄</text><text x="650" y="208" text-anchor="start" fill="var(--s2)" font-size="11">Γ 에서 식이 빠지고</text><text x="650" y="228" text-anchor="start" fill="var(--s2)" font-size="11">그만큼 식이 무거워진다</text><text x="650" y="248" text-anchor="start" fill="var(--s2)" font-size="11">값은 바뀌지 않는다</text><path d="M28 288 L840 288" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="310" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">마지막 줄의 Γ 가 비었다. 그래서 그 줄의 불변량이 곧 ⊨ P → (Q → P) 라는 정리가 된다</text><text x="34" y="330" text-anchor="start" fill="var(--ink2)" font-size="11">건전성 증명이 실제로 증명하는 것은 마지막 줄 하나가 아니라 이 열 전체다</text>
</svg>