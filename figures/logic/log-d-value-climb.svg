<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 452" width="780" height="452" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">논리식의 값은 구조를 따라 재귀적으로 정해진다</title><desc id="d">문장문자에 배당된 값이 나무의 잎에 놓이고, 연결자마다 진리함수를 한 번씩 적용하며 뿌리까지 값이 올라간다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">값은 잎에서 뿌리로 올라간다 — 한 단계가 진리함수 한 번</text><text class="ink2 sm" x="390" y="48" text-anchor="middle">φ = ¬(P ∧ Q) → (R ∨ Q) — 배당 v 는 P = T, Q = F, R = T</text><path d="M370.93 108.79 L244.07 167.21" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M409.07 108.79 L535.93 167.21" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 197 L225 235" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M210.64 271.32 L164.36 320.68" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M239.36 271.32 L285.64 320.68" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M546.09 195.01 L488.91 316.99" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M563.91 195.01 L621.09 316.99" fill="none" stroke="var(--grid)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="390" cy="100" r="21" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink bold" x="390" y="106" text-anchor="middle">→</text><rect x="417" y="87" width="26" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><text class="ink sm" x="430" y="103" text-anchor="middle">T</text><circle cx="225" cy="176" r="21" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink bold" x="225" y="182" text-anchor="middle">¬</text><rect x="252" y="163" width="26" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><text class="ink sm" x="265" y="179" text-anchor="middle">T</text><circle cx="555" cy="176" r="21" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink bold" x="555" y="182" text-anchor="middle">∨</text><rect x="582" y="163" width="26" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><text class="ink sm" x="595" y="179" text-anchor="middle">T</text><circle cx="225" cy="256" r="21" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink bold" x="225" y="262" text-anchor="middle">∧</text><rect x="252" y="243" width="26" height="24" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.6"/><text class="ink sm" x="265" y="259" text-anchor="middle">F</text><circle cx="150" cy="336" r="21" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink bold" x="150" y="342" text-anchor="middle">P</text><rect x="137" y="366" width="26" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><text class="ink sm" x="150" y="382" text-anchor="middle">T</text><circle cx="300" cy="336" r="21" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink bold" x="300" y="342" text-anchor="middle">Q</text><rect x="287" y="366" width="26" height="24" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.6"/><text class="ink sm" x="300" y="382" text-anchor="middle">F</text><circle cx="480" cy="336" r="21" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink bold" x="480" y="342" text-anchor="middle">R</text><rect x="467" y="366" width="26" height="24" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><text class="ink sm" x="480" y="382" text-anchor="middle">T</text><circle cx="630" cy="336" r="21" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><text class="ink bold" x="630" y="342" text-anchor="middle">Q</text><rect x="617" y="366" width="26" height="24" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.6"/><text class="ink sm" x="630" y="382" text-anchor="middle">F</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M300 78 L356 92"/><text class="ink sm" x="296" y="74" text-anchor="end">뿌리의 값이 문장 전체의 값이다</text><text class="ink bold" x="456" y="112" text-anchor="start">v ⊨ φ</text><rect x="60" y="396" width="660" height="30" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink sm" x="96" y="416" text-anchor="start">1) T ∧ F 는 F</text><text class="ink sm" x="261" y="416" text-anchor="start">2) ¬F 는 T</text><text class="ink sm" x="426" y="416" text-anchor="start">3) T ∨ F 는 T</text><text class="ink sm" x="591" y="416" text-anchor="start">4) T → T 는 T</text><text class="ink2 sm" x="390" y="442" text-anchor="middle">괄호 구조가 계산 순서를 정한다 — 5장의 재귀적 문법 규칙 하나마다 값 계산 규칙 하나가 붙는다</text>
</svg>