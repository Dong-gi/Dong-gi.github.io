<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한정사 규칙 넷의 변수 조건을 한자리에 모은 그림</title><desc id="d">도출 한 벌에서 이름을 살펴볼 세 곳을 표시하고 규칙 넷이 각각 어느 곳을 보는지 표로 정리한 뒤 새 이름을 쓰면 조건이 저절로 통과된다는 요령을 적었다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="30" width="470" height="310" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="249" y="51" text-anchor="middle">살펴볼 곳은 셋이다 — 도출 한 벌에 표시해 둔다</text><path d="M68 136 L60 136 L60 244" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="92" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="64" y="92" text-anchor="start" fill="var(--ink)">∃x Fx</text><text x="256" y="92" text-anchor="start" fill="var(--ink2)" font-size="11">전제</text><text x="50" y="121" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="64" y="121" text-anchor="start" fill="var(--ink)">∀x (Fx → Gx)</text><text x="256" y="121" text-anchor="start" fill="var(--ink2)" font-size="11">전제</text><text x="50" y="150" text-anchor="end" fill="var(--ink2)" font-size="11">3</text><text x="77" y="150" text-anchor="start" fill="var(--ink)">Fc</text><text x="256" y="150" text-anchor="start" fill="var(--ink2)" font-size="11">가정</text><text x="50" y="179" text-anchor="end" fill="var(--ink2)" font-size="11">4</text><text x="77" y="179" text-anchor="start" fill="var(--ink)">Fc → Gc</text><text x="256" y="179" text-anchor="start" fill="var(--ink2)" font-size="11">2 ∀E</text><text x="50" y="208" text-anchor="end" fill="var(--ink2)" font-size="11">5</text><text x="77" y="208" text-anchor="start" fill="var(--ink)">Gc</text><text x="256" y="208" text-anchor="start" fill="var(--ink2)" font-size="11">3, 4 →E</text><text x="50" y="237" text-anchor="end" fill="var(--ink2)" font-size="11">6</text><text x="77" y="237" text-anchor="start" fill="var(--ink)">∃x Gx</text><text x="256" y="237" text-anchor="start" fill="var(--ink2)" font-size="11">5 ∃I</text><text x="50" y="266" text-anchor="end" fill="var(--ink2)" font-size="11">7</text><text x="64" y="266" text-anchor="start" fill="var(--ink)">∃x Gx</text><text x="256" y="266" text-anchor="start" fill="var(--ink2)" font-size="11">1, 3–6 ∃E</text><text x="190" y="92" text-anchor="start" fill="var(--s1)" font-weight="600">①</text><text x="212" y="92" text-anchor="start" fill="var(--s2)" font-weight="600">②</text><text x="190" y="121" text-anchor="start" fill="var(--s1)" font-weight="600">①</text><text x="190" y="266" text-anchor="start" fill="var(--s3)" font-weight="600">③</text><text x="32" y="306" text-anchor="start" fill="var(--ink)" font-size="11">이 도출에서 c 는 ①②③ 어디에도 없다. 그래서 7 번 줄을 적을 수 있다</text><rect x="500" y="30" width="386" height="310" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="693" y="51" text-anchor="middle">규칙 넷이 각각 어디를 보는가</text><text x="524" y="74" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">규칙</text><text x="578" y="74" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">모양</text><text x="742" y="74" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">c 가 없어야 하는 곳</text><path d="M516 84 L872 84" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="524" y="112" text-anchor="start" fill="var(--ink)" font-weight="600">∀E</text><text x="578" y="112" text-anchor="start" fill="var(--ink)" font-size="11">∀x φ 에서 φ[a/x]</text><text x="742" y="112" text-anchor="start" fill="var(--ink2)" font-size="11">아무 데도 안 본다</text><path d="M516 126 L872 126" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="524" y="152" text-anchor="start" fill="var(--ink)" font-weight="600">∃I</text><text x="578" y="152" text-anchor="start" fill="var(--ink)" font-size="11">φ[a/x] 에서 ∃x φ</text><text x="742" y="152" text-anchor="start" fill="var(--ink2)" font-size="11">아무 데도 안 본다</text><path d="M516 166 L872 166" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="524" y="192" text-anchor="start" fill="var(--ink)" font-weight="600">∀I</text><text x="578" y="192" text-anchor="start" fill="var(--ink)" font-size="11">φ[c/x] 에서 ∀x φ</text><text x="742" y="192" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">① 과 결론 ∀x φ</text><path d="M516 206 L872 206" fill="none" stroke="var(--grid)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="524" y="232" text-anchor="start" fill="var(--ink)" font-weight="600">∃E</text><text x="578" y="232" text-anchor="start" fill="var(--ink)" font-size="11">∃x φ 와 갈래에서 ψ</text><text x="742" y="232" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">① ② ③ 셋 다</text><text x="524" y="290" text-anchor="start" fill="var(--ink2)" font-size="11">위 둘은 이름을 내가 골라 쓴다. 아래 둘은 이름이</text><text x="524" y="310" text-anchor="start" fill="var(--ink2)" font-size="11">아무 것이어도 되어야 하므로 조건이 붙는다.</text><rect x="14" y="356" width="872" height="128" rx="6" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.4"/><text x="38" y="384" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">① 열린 가정 — 그 줄이 기대고 있는 전제와 아직 방출되지 않은 가정 전부</text><text x="38" y="406" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">② 규칙의 재료가 된 ∃x φ</text><text x="330" y="406" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">③ 규칙이 내놓는 결론 ψ</text><text x="38" y="438" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">실전 요령 — ∀I 나 ∃E 를 쓸 때마다 도출 어디에도 없던 새 이름을 만들어 쓰면 ①②③ 셋이 저절로 통과된다.</text><text x="38" y="462" text-anchor="start" fill="var(--ink2)" font-size="11">조건을 실제로 따지는 일이 남는 것은 남의 도출을 검사할 때이고, 그때 볼 곳이 위 표의 오른쪽 칸이다.</text>
</svg>