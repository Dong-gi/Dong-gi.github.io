<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">경우 나누기의 모양 — 두 부증명이 같은 결론에 닿아야 그 결론이 밖으로 나온다</title><desc id="d">왼쪽은 P ∨ Q 와 두 조건문에서 R 을 얻는 여덟 줄짜리 도출, 오른쪽은 같은 것을 갈라졌다 모이는 상자 그림으로 다시 그린 것</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="400" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">∨E 는 목표를 두 번 증명하게 만든다</text><text x="400" y="46" text-anchor="middle" fill="var(--ink2)" font-size="11">두 부증명의 마지막 줄이 같아야 하고, 그 줄만 상자 밖으로 나온다</text><rect x="22" y="66" width="452" height="252" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="42" y="89" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="60" y="89" text-anchor="start" fill="var(--ink)">P ∨ Q</text><text x="464" y="89" text-anchor="end" fill="var(--ink2)" font-size="11">전제</text><text x="42" y="119" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="60" y="119" text-anchor="start" fill="var(--ink)">P → R</text><text x="464" y="119" text-anchor="end" fill="var(--ink2)" font-size="11">전제</text><text x="42" y="149" text-anchor="end" fill="var(--ink2)" font-size="11">3</text><text x="60" y="149" text-anchor="start" fill="var(--ink)">Q → R</text><text x="464" y="149" text-anchor="end" fill="var(--ink2)" font-size="11">전제</text><text x="42" y="179" text-anchor="end" fill="var(--ink2)" font-size="11">4</text><path d="M52 160 L52 190" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="179" text-anchor="start" fill="var(--ink)">P</text><text x="464" y="179" text-anchor="end" fill="var(--ink2)" font-size="11">가정</text><text x="42" y="209" text-anchor="end" fill="var(--ink2)" font-size="11">5</text><path d="M52 190 L52 220" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="209" text-anchor="start" fill="var(--ink)">R</text><text x="464" y="209" text-anchor="end" fill="var(--ink2)" font-size="11">2, 4 →E</text><text x="42" y="239" text-anchor="end" fill="var(--ink2)" font-size="11">6</text><path d="M52 220 L52 250" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="239" text-anchor="start" fill="var(--ink)">Q</text><text x="464" y="239" text-anchor="end" fill="var(--ink2)" font-size="11">가정</text><text x="42" y="269" text-anchor="end" fill="var(--ink2)" font-size="11">7</text><path d="M52 250 L52 280" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="269" text-anchor="start" fill="var(--ink)">R</text><text x="464" y="269" text-anchor="end" fill="var(--ink2)" font-size="11">3, 6 →E</text><rect x="22" y="280" width="452" height="30" rx="2" fill="var(--s3)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text x="42" y="299" text-anchor="end" fill="var(--ink2)" font-size="11">8</text><text x="60" y="299" text-anchor="start" fill="var(--ink)" font-weight="600">R</text><text x="464" y="299" text-anchor="end" fill="var(--ink2)" font-size="11">1, 4–5, 6–7 ∨E</text><path d="M52 220 L64 220" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 280 L64 280" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="642" y="92" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">모양</text><rect x="590" y="104" width="104" height="32" rx="4" fill="none" fill-opacity="1" stroke="var(--ink)" stroke-width="1.6"/><text x="642" y="125" text-anchor="middle" fill="var(--ink)" font-weight="600">P ∨ Q</text><rect x="520" y="178" width="104" height="50" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.6"/><text x="572" y="198" text-anchor="middle" fill="var(--ink)" font-size="11">P 를 가정</text><text x="572" y="217" text-anchor="middle" fill="var(--s1)" font-size="11">R 까지 간다</text><rect x="660" y="178" width="104" height="50" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text x="712" y="198" text-anchor="middle" fill="var(--ink)" font-size="11">Q 를 가정</text><text x="712" y="217" text-anchor="middle" fill="var(--s2)" font-size="11">R 까지 간다</text><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M624 136 L574 174"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M660 136 L710 174"/><rect x="590" y="268" width="104" height="32" rx="4" fill="var(--s3)" fill-opacity="0.16" stroke="var(--s3)" stroke-width="1.8"/><text x="642" y="289" text-anchor="middle" fill="var(--ink)" font-weight="600">R</text><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M574 230 L624 264"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M710 230 L660 264"/><text x="642" y="322" text-anchor="middle" fill="var(--ink2)" font-size="11">두 갈래가 같은 곳에 닿아야만</text><text x="642" y="340" text-anchor="middle" fill="var(--ink2)" font-size="11">R 이 상자 밖으로 나온다</text><rect x="22" y="366" width="452" height="84" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="40" y="390" text-anchor="start" fill="var(--ink)" font-size="11">값 — ∨ 를 쓸 수 있게 해 주는 규칙은 이것뿐이다</text><text x="40" y="410" text-anchor="start" fill="var(--s2)" font-size="11">비용 — 목표가 반으로 쪼개지지 않는다. 같은 목표를 두 번 증명한다</text><text x="40" y="430" text-anchor="start" fill="var(--ink2)" font-size="11">그래서 전제에 ∨ 가 있을 때만 꺼낸다. 목표가 ∨ 인 것은 이유가 못 된다</text>
</svg>