<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">진리 보조정리 — 진리표 조항과 극대 일관 집합의 성질이 한 줄씩 짝을 이룬다</title><desc id="d">왼쪽 사다리는 의미론의 조항, 오른쪽 사다리는 증명 체계가 준 소속 조건. 가로대가 하나씩 대응한다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="450" y="28" text-anchor="middle" fill="var(--ink)" font-weight="600">진리 보조정리 — 두 사다리의 가로대가 하나씩 짝을 이룬다</text><text x="450" y="52" text-anchor="middle" fill="var(--ink2)" font-size="11">Γ* 에서 배당을 읽어낸다:  v(P) = T 인 것은 P ∈ Γ* 일 때.  그러면 모든 적형식에서 값과 소속이 일치한다</text><text x="252" y="96" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">6장 — 확장 배당의 조항</text><text x="668" y="96" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">앞 절 — 극대 일관 집합 Γ* 의 성질</text><rect x="66" y="101" width="372" height="32" rx="3" fill="var(--s1)" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="78" y="122" text-anchor="start" fill="var(--ink)" font-size="11">P 의 값이 T 다</text><rect x="470" y="101" width="396" height="32" rx="3" fill="var(--s2)" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="482" y="122" text-anchor="start" fill="var(--ink)" font-size="11">P ∈ Γ* 다 — 배당을 그렇게 정했다</text><path d="M438 117 L470 117" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="454" y="121" text-anchor="middle" fill="var(--ink2)" font-size="11">⟺</text><rect x="66" y="147" width="372" height="32" rx="3" fill="var(--s1)" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="78" y="168" text-anchor="start" fill="var(--ink)" font-size="11">⊥ 의 값은 어느 배당에서나 F 다</text><rect x="470" y="147" width="396" height="32" rx="3" fill="var(--s2)" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="482" y="168" text-anchor="start" fill="var(--ink)" font-size="11">⊥ ∉ Γ* 다 — 들었다면 비일관적이다</text><path d="M438 163 L470 163" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="454" y="167" text-anchor="middle" fill="var(--ink2)" font-size="11">⟺</text><rect x="66" y="193" width="372" height="32" rx="3" fill="var(--s1)" fill-opacity="0.07" stroke="var(--s1)" stroke-width="1.3"/><text x="78" y="214" text-anchor="start" fill="var(--ink)" font-size="11">¬φ 가 T ⟺ φ 가 F</text><rect x="470" y="193" width="396" height="32" rx="3" fill="var(--s2)" fill-opacity="0.07" stroke="var(--s2)" stroke-width="1.3"/><text x="482" y="214" text-anchor="start" fill="var(--ink)" font-size="11">¬φ ∈ Γ* ⟺ φ ∉ Γ*</text><path d="M438 209 L470 209" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="454" y="213" text-anchor="middle" fill="var(--ink2)" font-size="11">⟺</text><rect x="66" y="239" width="372" height="32" rx="3" fill="var(--s1)" fill-opacity="0.07" stroke="var(--s1)" stroke-width="1.3"/><text x="78" y="260" text-anchor="start" fill="var(--ink)" font-size="11">φ ∧ ψ 가 T ⟺ 둘 다 T</text><rect x="470" y="239" width="396" height="32" rx="3" fill="var(--s2)" fill-opacity="0.07" stroke="var(--s2)" stroke-width="1.3"/><text x="482" y="260" text-anchor="start" fill="var(--ink)" font-size="11">φ ∧ ψ ∈ Γ* ⟺ 둘 다 Γ* 에 있다</text><path d="M438 255 L470 255" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="454" y="259" text-anchor="middle" fill="var(--ink2)" font-size="11">⟺</text><rect x="66" y="285" width="372" height="32" rx="3" fill="var(--s1)" fill-opacity="0.07" stroke="var(--s1)" stroke-width="1.3"/><text x="78" y="306" text-anchor="start" fill="var(--ink)" font-size="11">φ ∨ ψ 가 T ⟺ 적어도 하나가 T</text><rect x="470" y="285" width="396" height="32" rx="3" fill="var(--s2)" fill-opacity="0.07" stroke="var(--s2)" stroke-width="1.3"/><text x="482" y="306" text-anchor="start" fill="var(--ink)" font-size="11">φ ∨ ψ ∈ Γ* ⟺ 적어도 하나가 Γ* 에 있다</text><path d="M438 301 L470 301" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="454" y="305" text-anchor="middle" fill="var(--ink2)" font-size="11">⟺</text><rect x="66" y="331" width="372" height="32" rx="3" fill="var(--s1)" fill-opacity="0.07" stroke="var(--s1)" stroke-width="1.3"/><text x="78" y="352" text-anchor="start" fill="var(--ink)" font-size="11">φ → ψ 가 T ⟺ φ 가 F 이거나 ψ 가 T</text><rect x="470" y="331" width="396" height="32" rx="3" fill="var(--s2)" fill-opacity="0.07" stroke="var(--s2)" stroke-width="1.3"/><text x="482" y="352" text-anchor="start" fill="var(--ink)" font-size="11">φ → ψ ∈ Γ* ⟺ φ ∉ Γ* 이거나 ψ ∈ Γ*</text><path d="M438 347 L470 347" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="454" y="351" text-anchor="middle" fill="var(--ink2)" font-size="11">⟺</text><rect x="66" y="377" width="372" height="32" rx="3" fill="var(--s1)" fill-opacity="0.07" stroke="var(--s1)" stroke-width="1.3"/><text x="78" y="398" text-anchor="start" fill="var(--ink)" font-size="11">φ ↔ ψ 가 T ⟺ 두 값이 같다</text><rect x="470" y="377" width="396" height="32" rx="3" fill="var(--s2)" fill-opacity="0.07" stroke="var(--s2)" stroke-width="1.3"/><text x="482" y="398" text-anchor="start" fill="var(--ink)" font-size="11">φ ↔ ψ ∈ Γ* ⟺ 둘 다 있거나 둘 다 없다</text><path d="M438 393 L470 393" fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="454" y="397" text-anchor="middle" fill="var(--ink2)" font-size="11">⟺</text><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M38 412 L38 98"/><text x="38" y="90" text-anchor="middle" fill="var(--s3)" font-size="10">귀납</text><text x="38" y="426" text-anchor="middle" fill="var(--s3)" font-size="10">기저</text><text x="66" y="442" text-anchor="start" fill="var(--ink2)" font-size="11">아래 두 칸은 정의와 일관성으로 직접 맞춘다. 위 다섯 칸은 짝이 맞으므로 귀납 가정에서 저절로 따라온다.</text><text x="66" y="460" text-anchor="start" fill="var(--ink2)" font-size="11">왼쪽 사다리는 6장이 세웠고 오른쪽 사다리는 규칙 열일곱 개가 세웠는데 가로대가 하나도 어긋나지 않는다 — 이것이 완전성의 심장이다.</text>
</svg>