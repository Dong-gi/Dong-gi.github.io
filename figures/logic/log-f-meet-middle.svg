<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 468" width="800" height="468" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">목표에서 거꾸로 간 길과 전제에서 앞으로 민 길이 같은 식에서 만난다</title><desc id="d">왼쪽은 목표 (P ∧ Q) → R 을 →I 로 쪼개 새 목표 R 에 이르는 흐름, 오른쪽은 전제와 가정을 ∧E 와 →E 로 풀어 R 에 이르는 흐름, 아래에서 두 흐름이 R 에서 만난다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="400" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">거꾸로 간 목표와 앞으로 민 전제가 같은 식에서 만난다</text><text x="400" y="46" text-anchor="middle" fill="var(--ink2)" font-size="11">전제 P → (Q → R) 에서 (P ∧ Q) → R 을 얻는 문제</text><rect x="14" y="60" width="372" height="246" rx="6" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.2"/><text x="200" y="81" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">거꾸로 — 목표를 쪼갠다</text><text x="200" y="98" text-anchor="middle" fill="var(--ink2)" font-size="11">주연결자를 보고 마지막 수를 정한다</text><rect x="34" y="108" width="332" height="46" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="48" y="128" text-anchor="start" fill="var(--ink)">목표  (P ∧ Q) → R</text><text x="48" y="145" text-anchor="start" fill="var(--ink2)" font-size="11">주연결자가 → 이다</text><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M200 154 L200 168"/><rect x="34" y="170" width="332" height="46" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="48" y="190" text-anchor="start" fill="var(--ink)">→I 를 마지막 수로 쓴다</text><text x="48" y="207" text-anchor="start" fill="var(--ink2)" font-size="11">P ∧ Q 를 가정한다</text><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar1)" d="M200 216 L200 230"/><rect x="34" y="232" width="332" height="46" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="2"/><text x="48" y="252" text-anchor="start" fill="var(--ink)" font-weight="600">새 목표  R</text><text x="48" y="269" text-anchor="start" fill="var(--ink2)" font-size="11">R 은 원자다 — 더 쪼갤 수 없다</text><text x="200" y="322" text-anchor="middle" fill="var(--s1)" font-size="11">거꾸로 가기는 여기서 멈춘다</text><rect x="400" y="60" width="386" height="246" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.2"/><text x="593" y="81" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">앞으로 — 손에 든 것을 푼다</text><text x="593" y="98" text-anchor="middle" fill="var(--ink2)" font-size="11">가정도 손에 든 것에 들어간다</text><rect x="420" y="108" width="348" height="46" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="434" y="128" text-anchor="start" fill="var(--ink)">P → (Q → R) 과 P ∧ Q</text><text x="434" y="145" text-anchor="start" fill="var(--ink2)" font-size="11">전제 하나, 가정 하나</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M594 154 L594 168"/><rect x="420" y="170" width="348" height="46" rx="4" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="434" y="190" text-anchor="start" fill="var(--ink)">∧E 두 번 → P 와 Q</text><text x="434" y="207" text-anchor="start" fill="var(--ink2)" font-size="11">언제나 안전한 수</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M594 216 L594 230"/><rect x="420" y="232" width="348" height="46" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="2"/><text x="434" y="252" text-anchor="start" fill="var(--ink)" font-weight="600">→E → Q → R,  다시 →E → R</text><text x="434" y="269" text-anchor="start" fill="var(--ink2)" font-size="11">전건을 손에 넣었으니 뗄 수 있다</text><text x="594" y="322" text-anchor="middle" fill="var(--s2)" font-size="11">앞으로 밀기도 여기서 멈춘다</text><rect x="258" y="348" width="284" height="52" rx="6" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="2"/><text x="400" y="372" text-anchor="middle" fill="var(--ink)" font-weight="600">두 쪽이 모두 R 을 가리킨다</text><text x="400" y="391" text-anchor="middle" fill="var(--ink2)" font-size="11">증명이 닫히는 자리다</text><path fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar1)" d="M200 330 L300 350"/><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M594 330 L500 350"/><text x="400" y="428" text-anchor="middle" fill="var(--ink2)" font-size="11">어느 한쪽만으로는 닿지 않는다 — 목표를 쪼개야 P ∧ Q 가 손에 들어오고,</text><text x="400" y="446" text-anchor="middle" fill="var(--ink2)" font-size="11">전제를 풀어야 그 P ∧ Q 가 쓸모를 얻는다</text>
</svg>