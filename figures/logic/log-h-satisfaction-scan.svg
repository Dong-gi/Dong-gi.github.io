<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" width="800" height="404" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한정사 조항의 훑기</title><desc id="d">정의역의 원소마다 배정을 갈아 끼워 확인한 세 줄을 ∀ 와 ∃ 가 서로 다르게 읽는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">한정사 조항은 이름이 아니라 D 의 원소를 훑는다</text><rect x="14" y="44" width="218" height="226" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="123" y="64" text-anchor="middle">쓰는 모형</text><text class="ink2 sm" x="123" y="81" text-anchor="middle">D = { 1, 2, 3 },  I(F) = { 1, 2 }</text><rect x="38" y="96" width="170" height="160" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="6 4"/><ellipse cx="110" cy="152" rx="52" ry="28" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><circle cx="88" cy="152" r="6" fill="var(--ink)"/><text class="ink bold sm" x="88" y="172" text-anchor="middle">1</text><circle cx="132" cy="152" r="6" fill="var(--ink)"/><text class="ink bold sm" x="132" y="172" text-anchor="middle">2</text><circle cx="170" cy="212" r="6" fill="var(--ink)"/><text class="ink bold sm" x="170" y="232" text-anchor="middle">3</text><text x="110" y="118" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">I(F)</text><text x="48" y="216" text-anchor="start" fill="var(--ink2)" font-size="11">3 은 밖에 있다</text><rect x="248" y="44" width="538" height="226" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="517" y="64" text-anchor="middle">Fx 를 D 의 원소마다 확인한다 — 확인할 것은 세 줄뿐이다</text><text x="286" y="92" text-anchor="middle" fill="var(--ink2)" font-size="11">훑는 원소 d</text><text x="420" y="92" text-anchor="middle" fill="var(--ink2)" font-size="11">갈아 낀 배정</text><text x="604" y="92" text-anchor="middle" fill="var(--ink2)" font-size="11">그 배정에서 Fx 는</text><text x="742" y="92" text-anchor="middle" fill="var(--ink2)" font-size="11">결과</text><path d="M268 102 L766 102" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="268" y="115" width="498" height="34" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1"/><text x="286" y="137" text-anchor="middle" fill="var(--ink)" font-weight="600">1</text><text x="420" y="137" text-anchor="middle" fill="var(--ink)">g[x ↦ 1]</text><text x="604" y="137" text-anchor="middle" fill="var(--ink)">1 ∈ I(F)</text><text x="742" y="138" text-anchor="middle" fill="var(--s1)" font-weight="600">✓</text><rect x="268" y="157" width="498" height="34" rx="4" fill="var(--s1)" fill-opacity="0.1" stroke="var(--s1)" stroke-width="1"/><text x="286" y="179" text-anchor="middle" fill="var(--ink)" font-weight="600">2</text><text x="420" y="179" text-anchor="middle" fill="var(--ink)">g[x ↦ 2]</text><text x="604" y="179" text-anchor="middle" fill="var(--ink)">2 ∈ I(F)</text><text x="742" y="180" text-anchor="middle" fill="var(--s1)" font-weight="600">✓</text><rect x="268" y="199" width="498" height="34" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1"/><text x="286" y="221" text-anchor="middle" fill="var(--ink)" font-weight="600">3</text><text x="420" y="221" text-anchor="middle" fill="var(--ink)">g[x ↦ 3]</text><text x="604" y="221" text-anchor="middle" fill="var(--ink)">3 ∉ I(F)</text><text x="742" y="222" text-anchor="middle" fill="var(--s2)" font-weight="600">✗</text><rect x="14" y="288" width="380" height="100" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text x="204" y="314" text-anchor="middle" fill="var(--ink)" font-weight="600">∀x Fx — 세 줄이 모두 ✓ 여야 한다</text><text x="204" y="338" text-anchor="middle" fill="var(--ink2)" font-size="11">셋째 줄이 ✗ 이므로 거짓이다.</text><text x="204" y="358" text-anchor="middle" fill="var(--ink2)" font-size="11">반례로 내놓을 것은 원소 3 하나다</text><rect x="406" y="288" width="380" height="100" rx="6" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.4"/><text x="596" y="314" text-anchor="middle" fill="var(--ink)" font-weight="600">∃x Fx — 한 줄만 ✓ 면 된다</text><text x="596" y="338" text-anchor="middle" fill="var(--ink2)" font-size="11">첫째 줄에서 이미 끝났다. 참이다.</text><text x="596" y="358" text-anchor="middle" fill="var(--ink2)" font-size="11">증거로 내놓을 것은 원소 1 하나다</text>
</svg>