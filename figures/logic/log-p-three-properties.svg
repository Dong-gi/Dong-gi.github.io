<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">반사적 추이적 유클리드적 — 세 프레임 성질의 모양</title><desc id="d">세 칸에 각각 자기 고리, 두 걸음을 잇는 지름길, 한 점에서 보이는 두 세계를 잇는 화살표를 그리고 대응하는 공리 T 4 5 를 아래에 적었다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="450" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">점선 화살표를 보라 — 그 화살표가 반드시 있어야 한다는 요구가 곧 그 성질이다</text><rect x="20" y="44" width="276" height="270" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="158" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">반사적 (reflexive)</text><text x="158" y="81" text-anchor="middle" fill="var(--ink2)" font-size="11">모든 w 에 대해 wRw</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M147 190 C113.2 132, 202.8 132, 169 190"/><circle cx="158" cy="214" r="26" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="158" y="219" text-anchor="middle" fill="var(--s1)" font-weight="600">w</text><text x="158" y="128" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">자기 자신이 보인다</text><text x="158" y="296" text-anchor="middle" fill="var(--ink)" font-weight="600">T   □φ → φ</text><rect x="312" y="44" width="276" height="270" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="450" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">추이적 (transitive)</text><text x="450" y="81" text-anchor="middle" fill="var(--ink2)" font-size="11">wRu 이고 uRt 이면 wRt</text><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M389.03 168.96 L431.08 220.72"/><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M467.03 223.04 L509.08 171.28"/><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="6 4" d="M399 148 L498 148"/><circle cx="372" cy="148" r="22" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="372" y="153" text-anchor="middle" fill="var(--s1)" font-weight="600">w</text><circle cx="450" cy="244" r="22" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="450" y="249" text-anchor="middle" fill="var(--s1)" font-weight="600">u</text><circle cx="528" cy="148" r="22" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="528" y="153" text-anchor="middle" fill="var(--s1)" font-weight="600">t</text><text x="450" y="118" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">두 걸음이 한 걸음으로</text><text x="450" y="296" text-anchor="middle" fill="var(--ink)" font-weight="600">4   □φ → □□φ</text><rect x="604" y="44" width="276" height="270" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="742" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">유클리드적 (euclidean)</text><text x="742" y="81" text-anchor="middle" fill="var(--ink2)" font-size="11">wRu 이고 wRt 이면 uRt</text><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M726.92 152.39 L692.76 203.12"/><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M757.69 151.97 L794.56 203.59"/><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="6 4" d="M703 228 L782 228"/><circle cx="742" cy="130" r="22" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="742" y="135" text-anchor="middle" fill="var(--s1)" font-weight="600">w</text><circle cx="676" cy="228" r="22" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="676" y="233" text-anchor="middle" fill="var(--s1)" font-weight="600">u</text><circle cx="812" cy="228" r="22" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="812" y="233" text-anchor="middle" fill="var(--s1)" font-weight="600">t</text><text x="742" y="270" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">보이는 둘끼리도 서로 보인다</text><text x="742" y="296" text-anchor="middle" fill="var(--ink)" font-weight="600">5   ◇φ → □◇φ</text><path d="M20 336 L880 336" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="360" text-anchor="start" fill="var(--ink)" font-size="11">유클리드적은 w · u · t 를 어떻게 고르든 성립해야 하므로 u 와 t 를 맞바꾼 것도 요구된다 — 점선은 사실 양쪽 방향이다.</text><text x="24" y="382" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">그래서 반사적이면서 유클리드적이면 대칭적이고 추이적이게 된다. 그 셋을 다 갖춘 관계가 동치관계이고, 그것이 S5 다.</text><text x="24" y="408" text-anchor="start" fill="var(--ink2)" font-size="11">세 그림 어디에도 논리식이 없다는 것을 눈여겨보라. 이것은 관계 R 에 대한 조건이지 대상언어의 문장이 아니다.</text>
</svg>