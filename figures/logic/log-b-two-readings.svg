<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">괄호 없는 글자열은 두 나무로 갈라진다</title><desc id="d">P ∧ Q ∨ R 이 ∧ 를 꼭대기로 하는 나무와 ∨ 를 꼭대기로 하는 나무로 갈라지고, 꼭대기 연결자가 주연결자라는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="360" y="28" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="600">괄호가 없는 P ∧ Q ∨ R 은 서로 다른 두 문장으로 갈라진다</text><text x="180" y="66" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="600">읽기 ①   P ∧ (Q ∨ R)</text><path d="M180 125 L106 165" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 125 L254 165" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="108" r="17" fill="var(--s2)" stroke="var(--s2)" stroke-width="0"/><text x="180" y="113" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">∧</text><circle cx="180" cy="108" r="22" fill="none" stroke="var(--s2)" stroke-width="2"/><text x="209" y="100" text-anchor="start" fill="var(--s2)" font-size="11">주연결자</text><path d="M254 199 L210 239" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M254 199 L298 239" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="106" cy="182" r="17" fill="var(--grid)" stroke="var(--ink2)" stroke-width="1.2"/><text x="106" y="187" text-anchor="middle" fill="var(--ink)" font-size="14">P</text><circle cx="254" cy="182" r="17" fill="var(--s1)" stroke="var(--s1)" stroke-width="0"/><text x="254" y="187" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">∨</text><circle cx="210" cy="256" r="17" fill="var(--grid)" stroke="var(--ink2)" stroke-width="1.2"/><text x="210" y="261" text-anchor="middle" fill="var(--ink)" font-size="14">Q</text><circle cx="298" cy="256" r="17" fill="var(--grid)" stroke="var(--ink2)" stroke-width="1.2"/><text x="298" y="261" text-anchor="middle" fill="var(--ink)" font-size="14">R</text><text x="540" y="66" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="600">읽기 ②   (P ∧ Q) ∨ R</text><path d="M540 125 L466 165" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 125 L614 165" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="540" cy="108" r="17" fill="var(--s2)" stroke="var(--s2)" stroke-width="0"/><text x="540" y="113" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">∨</text><circle cx="540" cy="108" r="22" fill="none" stroke="var(--s2)" stroke-width="2"/><text x="569" y="100" text-anchor="start" fill="var(--s2)" font-size="11">주연결자</text><path d="M466 199 L422 239" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M466 199 L510 239" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="614" cy="182" r="17" fill="var(--grid)" stroke="var(--ink2)" stroke-width="1.2"/><text x="614" y="187" text-anchor="middle" fill="var(--ink)" font-size="14">R</text><circle cx="466" cy="182" r="17" fill="var(--s1)" stroke="var(--s1)" stroke-width="0"/><text x="466" y="187" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">∧</text><circle cx="422" cy="256" r="17" fill="var(--grid)" stroke="var(--ink2)" stroke-width="1.2"/><text x="422" y="261" text-anchor="middle" fill="var(--ink)" font-size="14">P</text><circle cx="510" cy="256" r="17" fill="var(--grid)" stroke="var(--ink2)" stroke-width="1.2"/><text x="510" y="261" text-anchor="middle" fill="var(--ink)" font-size="14">Q</text><path d="M360 60 L360 290" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M20 302 L700 302" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="324" text-anchor="start" fill="var(--ink)" font-size="12">P 가 거짓, R 이 참인 상황에서 ① 은 거짓이고 ② 는 참이다. 답이 갈리니 다른 문장이다.</text><text x="20" y="344" text-anchor="start" fill="var(--ink2)" font-size="12">꼭대기에 선 연결자를 주연결자라 한다. ① 은 논리곱 문장, ② 는 논리합 문장이다.</text>
</svg>