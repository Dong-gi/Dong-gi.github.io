<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 386" width="800" height="386" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">산술의 비표준 모형</title><desc id="d">위는 표준 자연수, 아래는 표준 부분 뒤에 앞뒤로 끝없는 사슬이 붙은 모형이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">산술의 비표준 모형 — 표준 부분 뒤에 앞뒤로 끝없는 사슬이 붙는다</text><text x="28" y="74" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">표준 모형 ℕ</text><path d="M28 112 L560 112" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="112" r="5.5" fill="var(--s1)"/><text x="58" y="131" text-anchor="middle" fill="var(--ink2)" font-size="11">0</text><circle cx="120" cy="112" r="5.5" fill="var(--s1)"/><text x="120" y="131" text-anchor="middle" fill="var(--ink2)" font-size="11">1</text><circle cx="182" cy="112" r="5.5" fill="var(--s1)"/><text x="182" y="131" text-anchor="middle" fill="var(--ink2)" font-size="11">2</text><circle cx="244" cy="112" r="5.5" fill="var(--s1)"/><text x="244" y="131" text-anchor="middle" fill="var(--ink2)" font-size="11">3</text><circle cx="306" cy="112" r="5.5" fill="var(--s1)"/><text x="306" y="131" text-anchor="middle" fill="var(--ink2)" font-size="11">4</text><circle cx="368" cy="112" r="5.5" fill="var(--s1)"/><text x="368" y="131" text-anchor="middle" fill="var(--ink2)" font-size="11">5</text><circle cx="430" cy="112" r="5.5" fill="var(--s1)"/><text x="430" y="131" text-anchor="middle" fill="var(--ink2)" font-size="11">6</text><text x="510" y="117" text-anchor="middle" fill="var(--s1)" font-weight="600">…</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M536 112 L574 112"/><text x="596" y="116" text-anchor="start" fill="var(--ink2)" font-size="11">끝없이 이어지고, 이것이 전부다</text><text x="28" y="186" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">비표준 모형 ℳ*</text><path d="M28 224 L368 224" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="224" r="5.5" fill="var(--s1)"/><text x="58" y="243" text-anchor="middle" fill="var(--ink2)" font-size="11">0</text><circle cx="120" cy="224" r="5.5" fill="var(--s1)"/><text x="120" y="243" text-anchor="middle" fill="var(--ink2)" font-size="11">1</text><circle cx="182" cy="224" r="5.5" fill="var(--s1)"/><text x="182" y="243" text-anchor="middle" fill="var(--ink2)" font-size="11">2</text><circle cx="244" cy="224" r="5.5" fill="var(--s1)"/><text x="244" y="243" text-anchor="middle" fill="var(--ink2)" font-size="11">3</text><circle cx="306" cy="224" r="5.5" fill="var(--s1)"/><text x="306" y="243" text-anchor="middle" fill="var(--ink2)" font-size="11">4</text><text x="330" y="229" text-anchor="middle" fill="var(--s1)" font-weight="600">…</text><text x="178" y="260" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">표준 부분 — 0 에서 유한 걸음으로 닿는 것</text><rect x="430" y="194" width="344" height="62" rx="8" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.5"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M452 224 L424 224"/><path d="M456 224 L750 224" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="486" cy="224" r="5.5" fill="var(--s2)"/><text x="486" y="243" text-anchor="middle" fill="var(--ink2)" font-size="11">k−2</text><circle cx="548" cy="224" r="5.5" fill="var(--s2)"/><text x="548" y="243" text-anchor="middle" fill="var(--ink2)" font-size="11">k−1</text><circle cx="610" cy="224" r="5.5" fill="var(--s2)"/><text x="610" y="243" text-anchor="middle" fill="var(--ink2)" font-size="11">k</text><circle cx="672" cy="224" r="5.5" fill="var(--s2)"/><text x="672" y="243" text-anchor="middle" fill="var(--ink2)" font-size="11">k+1</text><circle cx="734" cy="224" r="5.5" fill="var(--s2)"/><text x="734" y="243" text-anchor="middle" fill="var(--ink2)" font-size="11">k+2</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M752 224 L782 224"/><text x="602" y="186" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">은하 — 앞으로도 뒤로도 끝이 없다</text><text x="602" y="276" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">k 는 0 보다도 1 보다도 2 보다도 … 크다.</text><text x="602" y="293" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">그런데 0 에서 k 로 가는 유한 걸음이 없다</text><path d="M388 224 L412 224" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><rect x="14" y="316" width="772" height="58" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="400" y="340" text-anchor="middle" fill="var(--ink)" font-size="11">두 줄은 눈으로 보면 전혀 다르다. 그런데 1차 논리의 문장으로는 하나도 구별되지 않는다 —</text><text x="400" y="362" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">산술의 참인 문장을 전부 모아도 아래 줄을 걸러 내지 못한다</text>
</svg>