<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 348" width="780" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">적형식 전체에 번호를 붙이는 대각선 훑기</title><desc id="d">기호 수로 줄을 나눈 격자에서 각 줄이 무한하고 줄도 무한하지만 대각선 순서로 훑으면 모든 칸에 번호가 붙는 그림, 그리고 이 사실이 컴팩트성에 쓰인다는 메모</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">줄마다 무한히 많고 줄도 무한히 많지만, 대각선으로 훑으면 빠짐없이 번호가 붙는다</text><rect x="20" y="44" width="470" height="228" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="255" y="64" text-anchor="middle">기호 수로 줄을 나눈다</text><text class="ink2 sm" x="255" y="80" text-anchor="middle">각 줄 안에서는 문장문자 번호 순으로 늘어놓는다</text><text class="ink bold sm" x="38" y="118" text-anchor="start">기호 1개</text><text class="ink2 sm" x="104" y="118" text-anchor="start">P, Q, R, P<tspan baseline-shift="-22%" font-size="76%">1</tspan>, …</text><text class="ink bold sm" x="38" y="148" text-anchor="start">기호 2개</text><text class="ink2 sm" x="104" y="148" text-anchor="start">¬P, ¬Q, ¬R, …</text><text class="ink bold sm" x="38" y="178" text-anchor="start">기호 3개</text><text class="ink2 sm" x="104" y="178" text-anchor="start">¬¬P, ¬¬Q, …</text><text class="ink bold sm" x="38" y="208" text-anchor="start">기호 4개</text><text class="ink2 sm" x="104" y="208" text-anchor="start">¬¬¬P, …</text><text class="ink bold sm" x="38" y="238" text-anchor="start">기호 5개</text><text class="ink2 sm" x="104" y="238" text-anchor="start">(P ∧ Q), (P ∨ Q), …</text><rect x="236" y="98" width="46" height="30" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><rect x="282" y="98" width="46" height="30" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><rect x="328" y="98" width="46" height="30" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><rect x="374" y="98" width="46" height="30" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><rect x="420" y="98" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="236" y="128" width="46" height="30" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><rect x="282" y="128" width="46" height="30" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><rect x="328" y="128" width="46" height="30" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><rect x="374" y="128" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="420" y="128" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="236" y="158" width="46" height="30" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><rect x="282" y="158" width="46" height="30" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><rect x="328" y="158" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="374" y="158" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="420" y="158" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="236" y="188" width="46" height="30" rx="3" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.5"/><rect x="282" y="188" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="328" y="188" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="374" y="188" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="420" y="188" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="236" y="218" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="282" y="218" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="328" y="218" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="374" y="218" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><rect x="420" y="218" width="46" height="30" rx="3" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="0.9"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="5 4" d="M297 121 L267 135"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="5 4" d="M343 121 L267 165"/><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="5 4" d="M389 121 L267 195"/><text class="ink bold sm" x="259" y="118" text-anchor="middle">1</text><text class="ink bold sm" x="305" y="118" text-anchor="middle">2</text><text class="ink bold sm" x="351" y="118" text-anchor="middle">4</text><text class="ink bold sm" x="397" y="118" text-anchor="middle">7</text><text class="ink2 sm" x="443" y="118" text-anchor="middle">11</text><text class="ink bold sm" x="259" y="148" text-anchor="middle">3</text><text class="ink bold sm" x="305" y="148" text-anchor="middle">5</text><text class="ink bold sm" x="351" y="148" text-anchor="middle">8</text><text class="ink2 sm" x="397" y="148" text-anchor="middle">12</text><text class="ink2 sm" x="443" y="148" text-anchor="middle">17</text><text class="ink bold sm" x="259" y="178" text-anchor="middle">6</text><text class="ink bold sm" x="305" y="178" text-anchor="middle">9</text><text class="ink2 sm" x="351" y="178" text-anchor="middle">13</text><text class="ink2 sm" x="397" y="178" text-anchor="middle">18</text><text class="ink2 sm" x="443" y="178" text-anchor="middle">24</text><text class="ink bold sm" x="259" y="208" text-anchor="middle">10</text><text class="ink2 sm" x="305" y="208" text-anchor="middle">14</text><text class="ink2 sm" x="351" y="208" text-anchor="middle">19</text><text class="ink2 sm" x="397" y="208" text-anchor="middle">25</text><text class="ink2 sm" x="443" y="208" text-anchor="middle">32</text><text class="ink2 sm" x="259" y="238" text-anchor="middle">15</text><text class="ink2 sm" x="305" y="238" text-anchor="middle">20</text><text class="ink2 sm" x="351" y="238" text-anchor="middle">26</text><text class="ink2 sm" x="397" y="238" text-anchor="middle">33</text><text class="ink2 sm" x="443" y="238" text-anchor="middle">41</text><text class="sm bold" fill="var(--s2)" x="38" y="272" text-anchor="start">주황 점선이 번호를 붙여 나가는 순서다</text><rect x="504" y="44" width="256" height="228" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="632" y="64" text-anchor="middle">이 그림이 쓰이는 곳</text><text class="sm bold" fill="var(--s1)" x="522" y="100" text-anchor="start">왜 줄을 나눌 수 있는가</text><text class="ink2 sm" x="522" y="120" text-anchor="start">적형식은 조항을 유한 번 적용해</text><text class="ink2 sm" x="522" y="137" text-anchor="start">만든 것이므로 기호가 유한 개다.</text><text class="ink2 sm" x="522" y="154" text-anchor="start">무한히 긴 연언은 애초에 없다</text><text class="sm bold" fill="var(--s3)" x="522" y="188" text-anchor="start">어디에 쓰는가</text><text class="ink2 sm" x="522" y="208" text-anchor="start">15장 컴팩트성. 증명도 유한하고</text><text class="ink2 sm" x="522" y="225" text-anchor="start">논리식도 유한하다는 두 사실이</text><text class="ink2 sm" x="522" y="242" text-anchor="start">그 정리를 떠받친다</text><text class="ink2 sm" x="24" y="294" text-anchor="start">읽어낼 것 — 어휘가 무한한데도 전체를 한 줄로 세울 수 있다. 문장문자에 번호가 있어 각 줄을 늘어놓을 수 있고, 줄의 개수도 셀 수 있기 때문이다.</text><text class="ink2 sm" x="24" y="314" text-anchor="start">‘셀 수 있다’ 는 이 장에서 ‘1, 2, 3, … 을 빠짐없이 붙일 수 있다’ 는 뜻으로만 쓴다. 정확한 정의는 15장에서 다시 세운다</text>
</svg>