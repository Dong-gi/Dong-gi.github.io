<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 372" width="840" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">가정의 범위를 어기는 두 가지 잘못</title><desc id="d">닫힌 범위 안의 줄을 밖에서 인용하는 잘못과 가정을 방출하지 않고 결론으로 삼는 잘못을 도출표 두 벌로 나란히 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="34" width="400" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="214" y="55" text-anchor="middle">잘못 하나 — 닫힌 범위 안의 줄을 밖에서 인용한다</text><path d="M76 77 L68 77 L68 132" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="92" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="86" y="92" text-anchor="start" fill="var(--ink)">P</text><text x="248" y="92" text-anchor="start" fill="var(--ink2)" font-size="11">가정</text><text x="58" y="124" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="86" y="124" text-anchor="start" fill="var(--ink)">P ∨ Q</text><text x="248" y="124" text-anchor="start" fill="var(--ink2)" font-size="11">1 ∨I</text><text x="58" y="156" text-anchor="end" fill="var(--ink2)" font-size="11">3</text><text x="72" y="156" text-anchor="start" fill="var(--ink)">P → (P ∨ Q)</text><text x="248" y="156" text-anchor="start" fill="var(--ink2)" font-size="11">1–2 →I</text><text x="58" y="188" text-anchor="end" fill="var(--ink2)" font-size="11">4</text><text x="72" y="188" text-anchor="start" fill="var(--ink)">P ∨ Q</text><text x="248" y="188" text-anchor="start" fill="var(--ink2)" font-size="11">2 R</text><rect x="232" y="172" width="76" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="2"/><text x="38" y="226" text-anchor="start" fill="var(--ink)" font-size="11">4 번 줄이 2 번 줄을 인용했다. 2 번 줄은 가정 1 아래</text><text x="38" y="246" text-anchor="start" fill="var(--ink2)" font-size="11">에서만 얻은 것이고, 3 번 줄에서 범위가 닫혔다.</text><text x="38" y="266" text-anchor="start" fill="var(--ink2)" font-size="11">닫힌 범위 안의 줄은 밖에서 없는 것과 같다.</text><rect x="426" y="34" width="400" height="250" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="626" y="55" text-anchor="middle">잘못 둘 — 가정을 열어 놓은 채 끝낸다</text><path d="M488 77 L480 77 L480 132" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="92" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="498" y="92" text-anchor="start" fill="var(--ink)">P</text><text x="660" y="92" text-anchor="start" fill="var(--ink2)" font-size="11">가정</text><text x="470" y="124" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="498" y="124" text-anchor="start" fill="var(--ink)">P ∨ Q</text><text x="660" y="124" text-anchor="start" fill="var(--ink2)" font-size="11">1 ∨I</text><text x="462" y="168" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">여기서 멈추고 ⊢ P ∨ Q 라고 적는다</text><text x="450" y="226" text-anchor="start" fill="var(--ink)" font-size="11">가정 1 이 열린 채로 남아 있다. 이 도출이 보인 것은</text><text x="450" y="246" text-anchor="start" fill="var(--ink2)" font-size="11">P ⊢ P ∨ Q 이지 ⊢ P ∨ Q 가 아니다. 열린 가정은</text><text x="450" y="266" text-anchor="start" fill="var(--ink2)" font-size="11">전제로 세거나 방출하거나 둘 중 하나여야 한다.</text><path d="M40 306 L800 306" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="332" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">두 잘못은 하나를 놓친 결과다 — 줄 하나가 무엇에 기대고 있는지</text><text x="420" y="354" text-anchor="middle" fill="var(--ink2)" font-size="11">도출을 검사할 때 줄마다 물을 것은 둘이다. 근거가 규칙 모양과 맞는가, 인용한 줄이 지금 손닿는 범위에 있는가</text>
</svg>