<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" width="800" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">수를 세는 문장을 다 모으면 무한 모형이 강제된다</title><desc id="d">왼쪽은 유한 부분집합이 늘 유한 모형을 갖는다는 것, 오른쪽은 전체의 모형이 유한할 수 없다는 것을 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">Λ = { λ₂, λ₃, λ₄, … } — 유한 부분집합은 모두 모형을 갖고, 전체의 모형은 무한하다</text><rect x="14" y="46" width="380" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="204" y="66" text-anchor="middle">유한 부분집합 Δ ⊆ Λ</text><text class="ink2 sm" x="204" y="83" text-anchor="middle">Δ = { λ₂, λ₃, λ₅, λ₉ } — 가장 큰 첨자가 9</text><rect x="44" y="118" width="320" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.4" stroke-dasharray="6 4"/><text x="356" y="206" text-anchor="end" fill="var(--ink2)" font-size="11">D</text><circle cx="74" cy="158" r="5.5" fill="var(--s1)"/><text x="74" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">1</text><circle cx="107" cy="158" r="5.5" fill="var(--s1)"/><text x="107" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">2</text><circle cx="140" cy="158" r="5.5" fill="var(--s1)"/><text x="140" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">3</text><circle cx="173" cy="158" r="5.5" fill="var(--s1)"/><text x="173" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">4</text><circle cx="206" cy="158" r="5.5" fill="var(--s1)"/><text x="206" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">5</text><circle cx="239" cy="158" r="5.5" fill="var(--s1)"/><text x="239" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">6</text><circle cx="272" cy="158" r="5.5" fill="var(--s1)"/><text x="272" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">7</text><circle cx="305" cy="158" r="5.5" fill="var(--s1)"/><text x="305" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">8</text><circle cx="338" cy="158" r="5.5" fill="var(--s1)"/><text x="338" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">9</text><text x="204" y="244" text-anchor="middle" fill="var(--ink)" font-size="11">크기 9 인 모형 하나가 Δ 의 네 문장을 전부 참으로 만든다</text><text x="204" y="264" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">어떤 유한 부분집합을 잡아도 이렇게 된다 —</text><text x="204" y="281" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">가장 큰 첨자만큼 점을 찍으면 끝이다</text><rect x="406" y="46" width="380" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="596" y="66" text-anchor="middle">Λ 전체</text><text class="ink2 sm" x="596" y="83" text-anchor="middle">첨자에 끝이 없다</text><rect x="436" y="118" width="320" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.4" stroke-dasharray="6 4"/><circle cx="466" cy="158" r="5.5" fill="var(--s2)"/><text x="466" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">1</text><circle cx="499" cy="158" r="5.5" fill="var(--s2)"/><text x="499" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">2</text><circle cx="532" cy="158" r="5.5" fill="var(--s2)"/><text x="532" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">3</text><circle cx="565" cy="158" r="5.5" fill="var(--s2)"/><text x="565" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">4</text><circle cx="598" cy="158" r="5.5" fill="var(--s2)"/><text x="598" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">5</text><circle cx="631" cy="158" r="5.5" fill="var(--s2)"/><text x="631" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">6</text><circle cx="664" cy="158" r="5.5" fill="var(--s2)"/><text x="664" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">7</text><circle cx="697" cy="158" r="5.5" fill="var(--s2)"/><text x="697" y="177" text-anchor="middle" fill="var(--ink2)" font-size="11">8</text><text x="736" y="163" text-anchor="middle" fill="var(--s2)" font-weight="600">…</text><text x="748" y="206" text-anchor="end" fill="var(--ink2)" font-size="11">D</text><text x="596" y="244" text-anchor="middle" fill="var(--ink)" font-size="11">크기 n 인 모형은 λₙ₊₁ 을 거짓으로 만든다</text><text x="596" y="264" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">그러므로 Λ 의 모형은 유한할 수 없다 —</text><text x="596" y="281" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">무한 정의역이 강제된다</text><path fill="none" stroke="var(--ink2)" stroke-width="0" stroke-linecap="round" marker-end="url(#ark)" d="M396 172 L404 172"/><rect x="14" y="316" width="772" height="66" rx="6" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text x="400" y="342" text-anchor="middle" fill="var(--ink)" font-size="11">컴팩트성이 하는 일은 왼쪽의 유한 모형들을 이어 붙이는 것이 아니다.</text><text x="400" y="364" text-anchor="middle" fill="var(--s3)" font-size="11" font-weight="600">이어 붙이지 않고도 오른쪽이 존재한다고 보증하는 것이다 — 그래서 오른쪽 점들의 정체는 끝내 알 수 없다</text>
</svg>