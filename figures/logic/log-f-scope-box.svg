<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" width="800" height="452" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">부증명 상자가 닫히면 그 안의 줄은 다시 부를 수 없다</title><desc id="d">피치 스타일 도출 일곱 줄에서 2번부터 4번까지가 닫힌 상자 안에 있어 7번 줄에서 부를 수 없고, 상자 밖의 1번과 상자를 요약한 5번만 부를 수 있음을 색으로 갈라 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="400" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">지금 줄에서 부를 수 있는 줄과 부를 수 없는 줄</text><text x="400" y="46" text-anchor="middle" fill="var(--ink2)" font-size="11">세로 막대는 부증명 하나를 뜻한다. 막대가 끊긴 자리에서 그 상자는 닫힌다</text><rect x="22" y="66" width="470" height="222" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><rect x="22" y="70" width="470" height="30" rx="2" fill="var(--s3)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text x="42" y="89" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="60" y="89" text-anchor="start" fill="var(--ink)">P → Q</text><text x="482" y="89" text-anchor="end" fill="var(--ink2)" font-size="11">전제</text><rect x="22" y="100" width="470" height="30" rx="2" fill="var(--s2)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text x="42" y="119" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><path d="M52 100 L52 130" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="119" text-anchor="start" fill="var(--ink)">P</text><text x="482" y="119" text-anchor="end" fill="var(--ink2)" font-size="11">가정</text><rect x="22" y="130" width="470" height="30" rx="2" fill="var(--s2)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text x="42" y="149" text-anchor="end" fill="var(--ink2)" font-size="11">3</text><path d="M52 130 L52 160" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="149" text-anchor="start" fill="var(--ink)">Q</text><text x="482" y="149" text-anchor="end" fill="var(--ink2)" font-size="11">1, 2 →E</text><rect x="22" y="160" width="470" height="30" rx="2" fill="var(--s2)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text x="42" y="179" text-anchor="end" fill="var(--ink2)" font-size="11">4</text><path d="M52 160 L52 190" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="179" text-anchor="start" fill="var(--ink)">P ∧ Q</text><text x="482" y="179" text-anchor="end" fill="var(--ink2)" font-size="11">2, 3 ∧I</text><rect x="22" y="190" width="470" height="30" rx="2" fill="var(--s3)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text x="42" y="209" text-anchor="end" fill="var(--ink2)" font-size="11">5</text><text x="60" y="209" text-anchor="start" fill="var(--ink)">P → (P ∧ Q)</text><text x="482" y="209" text-anchor="end" fill="var(--ink2)" font-size="11">2–4 →I</text><text x="42" y="239" text-anchor="end" fill="var(--ink2)" font-size="11">6</text><path d="M52 220 L52 250" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="239" text-anchor="start" fill="var(--ink)">¬Q</text><text x="482" y="239" text-anchor="end" fill="var(--ink2)" font-size="11">가정</text><text x="42" y="269" text-anchor="end" fill="var(--ink2)" font-size="11">7</text><path d="M52 250 L52 280" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="269" text-anchor="start" fill="var(--ink)">Q</text><text x="482" y="269" text-anchor="end" fill="var(--ink2)" font-size="11">?</text><path d="M52 220 L64 220" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 278 L484 278" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="512" y="66" width="268" height="84" rx="6" fill="var(--s3)" fill-opacity="0.12" stroke="var(--s3)" stroke-width="1.6"/><text x="526" y="90" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">7번 줄에서 부를 수 있는 줄</text><text x="526" y="112" text-anchor="start" fill="var(--ink2)" font-size="11">1번 — 상자 밖에 있다</text><text x="526" y="130" text-anchor="start" fill="var(--ink2)" font-size="11">5번 — 상자가 닫힌 뒤 밖에 적혔다</text><rect x="512" y="166" width="268" height="102" rx="6" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.6"/><text x="526" y="190" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">부를 수 없는 줄</text><text x="526" y="212" text-anchor="start" fill="var(--ink2)" font-size="11">2 · 3 · 4번 — 5번에서 상자가 닫혔다</text><text x="526" y="230" text-anchor="start" fill="var(--ink2)" font-size="11">그 줄들은 가정 P 아래에서만 참이다</text><text x="526" y="248" text-anchor="start" fill="var(--ink2)" font-size="11">지금은 P 를 가정하고 있지 않다</text><path fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar2)" d="M500 190 L506 190"/><path fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)" d="M500 100 L506 100"/><rect x="22" y="300" width="758" height="62" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="40" y="324" text-anchor="start" fill="var(--ink)" font-size="11">규칙 하나 — 어떤 줄을 부르려면 그 줄을 감싼 상자가 모두 아직 열려 있어야 한다.</text><text x="40" y="344" text-anchor="start" fill="var(--ink2)" font-size="11">상자가 하나라도 닫혔으면 그 줄은 없는 것과 같다. 남은 것은 상자 전체를 요약한 5번 줄뿐이다.</text><text x="400" y="392" text-anchor="middle" fill="var(--ink2)" font-size="11">5번 줄 하나가 상자 안의 세 줄을 대신한다 — 부증명이 남기는 것은 그 안의 줄들이 아니라 조건문 한 줄이다</text><text x="400" y="420" text-anchor="middle" fill="var(--ink)" font-size="11">증명을 다 쓴 뒤 이 검사를 한 번 돌리는 것만으로 흔한 오류의 절반이 걸러진다</text>
</svg>