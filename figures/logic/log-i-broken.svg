<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">변수 조건을 어긴 도출과 그 결론이 거짓임을 보이는 모형</title><desc id="d">한정사 순서를 뒤바꾸는 도출에서 전칭 일반화가 조건을 어긴 줄을 표시하고 정의역이 둘인 모형에서 전제가 참이고 결론이 거짓임을 확인한다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="30" width="458" height="334" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="243" y="51" text-anchor="middle">조건을 무시한 도출 — 한정사 순서를 뒤바꾼다</text><path d="M80 136 L72 136 L72 215" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="92" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="76" y="92" text-anchor="start" fill="var(--ink)">∀x ∃y Gxy</text><text x="274" y="92" text-anchor="start" fill="var(--ink2)" font-size="11">전제</text><text x="62" y="121" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="76" y="121" text-anchor="start" fill="var(--ink)">∃y Gcy</text><text x="274" y="121" text-anchor="start" fill="var(--ink2)" font-size="11">1 ∀E</text><text x="62" y="150" text-anchor="end" fill="var(--ink2)" font-size="11">3</text><text x="89" y="150" text-anchor="start" fill="var(--ink)">Gcc<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="274" y="150" text-anchor="start" fill="var(--ink2)" font-size="11">가정</text><text x="62" y="179" text-anchor="end" fill="var(--ink2)" font-size="11">4</text><text x="89" y="179" text-anchor="start" fill="var(--ink)">∀x Gxc<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="274" y="179" text-anchor="start" fill="var(--ink2)" font-size="11">3 ∀I</text><text x="62" y="208" text-anchor="end" fill="var(--ink2)" font-size="11">5</text><text x="89" y="208" text-anchor="start" fill="var(--ink)">∃y ∀x Gxy</text><text x="274" y="208" text-anchor="start" fill="var(--ink2)" font-size="11">4 ∃I</text><text x="62" y="237" text-anchor="end" fill="var(--ink2)" font-size="11">6</text><text x="76" y="237" text-anchor="start" fill="var(--ink)">∃y ∀x Gxy</text><text x="274" y="237" text-anchor="start" fill="var(--ink2)" font-size="11">2, 3–5 ∃E</text><rect x="82" y="160" width="82" height="25" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="2"/><text x="44" y="266" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">4 번 줄이 위반이다. ∀I 는 c 가 열린 가정에 없기를 요구하는데,</text><text x="44" y="286" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">그때 열린 가정에 3 번 줄 Gcc<tspan baseline-shift="-22%" font-size="76%">1</tspan> 이 있고 거기에 c 가 들어 있다.</text><text x="44" y="316" text-anchor="start" fill="var(--ink2)" font-size="11">나머지 다섯 줄은 규칙을 옳게 썼다. 6 번 줄의 ∃E 도 조건을 다 지켰다</text><text x="44" y="336" text-anchor="start" fill="var(--ink2)" font-size="11">— c<tspan baseline-shift="-22%" font-size="76%">1</tspan> 이 열린 가정에도 ∃y Gcy 에도 결론에도 없다. 무너뜨린 것은 줄 하나다.</text><rect x="490" y="30" width="396" height="334" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="688" y="51" text-anchor="middle">10장의 모형 ℳ<tspan baseline-shift="-22%" font-size="76%">1</tspan> 로 결론을 확인한다</text><text x="688" y="76" text-anchor="middle" fill="var(--ink)" font-size="11">D = {1, 2},  I(G) = {⟨1,1⟩, ⟨2,2⟩}</text><circle cx="618" cy="130" r="5" fill="var(--s1)"/><text x="618" y="152" text-anchor="middle" fill="var(--ink)" font-size="11">1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" marker-end="url(#ark)" d="M612 124 A 15 15 0 1 1 625 125"/><circle cx="758" cy="130" r="5" fill="var(--s1)"/><text x="758" y="152" text-anchor="middle" fill="var(--ink)" font-size="11">2</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" marker-end="url(#ark)" d="M752 124 A 15 15 0 1 1 765 125"/><text x="688" y="182" text-anchor="middle" fill="var(--ink2)" font-size="11">화살표가 제자리로만 돌아온다</text><path d="M516 200 L860 200" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="524" y="226" text-anchor="start" fill="var(--ink)" font-size="11">전제  ∀x ∃y Gxy</text><text x="830" y="226" text-anchor="end" fill="var(--s3)" font-size="11" font-weight="600">참</text><text x="524" y="250" text-anchor="start" fill="var(--ink2)" font-size="11">각 점이 자기에게 가는 화살표를 하나씩 갖는다</text><text x="524" y="278" text-anchor="start" fill="var(--ink)" font-size="11">결론  ∃y ∀x Gxy</text><text x="830" y="278" text-anchor="end" fill="var(--s2)" font-size="11" font-weight="600">거짓</text><text x="524" y="302" text-anchor="start" fill="var(--ink2)" font-size="11">모든 화살표를 받는 점이 없다</text><rect x="14" y="382" width="872" height="104" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text x="38" y="410" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">조건을 빼면 무엇이 무너지는가</text><text x="38" y="436" text-anchor="start" fill="var(--ink)" font-size="11">전제가 참인 모형에서 결론이 거짓이다. 즉 이 도출은 ⊨ 가 인정하지 않는 것을 ⊢ 로 얻어 냈다.</text><text x="38" y="460" text-anchor="start" fill="var(--ink2)" font-size="11">‘⊢ 이면 ⊨ 이다’ 를 지키는 것이 13장의 건전성이고, 그 증명은 규칙마다 이 확인을 한 번씩 한다.</text>
</svg>