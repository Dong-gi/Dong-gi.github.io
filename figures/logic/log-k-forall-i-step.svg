<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 402" width="880" height="402" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">전칭 일반화 규칙의 건전성 확인에서 변수 조건이 쓰이는 자리</title><desc id="d">원래 모형에서 임시 이름의 해석만 바꾼 모형으로 갈아탔다가 되돌아오는 네 걸음을 그리고, 첫 걸음이 변수 조건의 첫 항목을, 마지막 걸음이 둘째 항목을 쓴다는 것을 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="34" y="44" text-anchor="start" fill="var(--ink)" font-weight="600">∀I 가 건전함을 확인하는 네 걸음 — 모형을 한 번 갈아탔다가 되돌아온다</text><rect x="34" y="70" width="226" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text x="147" y="96" text-anchor="middle" fill="var(--s1)" font-weight="600">ℳ</text><text x="147" y="120" text-anchor="middle" fill="var(--ink)" font-size="11">Γ<tspan baseline-shift="-22%" font-size="76%">k</tspan> 를 모두 참으로 만든다</text><text x="147" y="140" text-anchor="middle" fill="var(--ink2)" font-size="11">D 의 원소 d 를 아무거나 잡는다</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ark)" d="M266 111 L330 111"/><text x="298" y="102" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">①</text><rect x="336" y="70" width="226" height="82" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.5"/><text x="449" y="96" text-anchor="middle" fill="var(--s2)" font-weight="600">ℳ*  —  c 만 d 로 해석</text><text x="449" y="120" text-anchor="middle" fill="var(--ink)" font-size="11">Γ<tspan baseline-shift="-22%" font-size="76%">k</tspan> 를 여전히 참으로 만든다</text><text x="449" y="140" text-anchor="middle" fill="var(--ink2)" font-size="11">근거 — 이름 바꾸기 보조정리</text><text x="576" y="92" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">조건 (가)</text><text x="576" y="112" text-anchor="start" fill="var(--ink2)" font-size="11">c 가 열린 가정에 없다.</text><text x="576" y="130" text-anchor="start" fill="var(--ink2)" font-size="11">없으니 해석을 바꿔도</text><text x="576" y="148" text-anchor="start" fill="var(--ink2)" font-size="11">전제가 흔들리지 않는다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M449 158 L449 196"/><text x="462" y="182" text-anchor="start" fill="var(--ink2)" font-size="11">② 귀납 가설 — ℳ* ⊨ φ[c/x]</text><rect x="336" y="202" width="226" height="62" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text x="449" y="226" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">③ 대입 보조정리</text><text x="449" y="248" text-anchor="middle" fill="var(--ink)" font-size="11">ℳ* 에서 x 자리에 d 를 꽂아 φ</text><path d="M336 233 L300 233" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M300 233 L300 168"/><path d="M300 168 L176 168" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M176 168 L176 158"/><text x="34" y="200" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">④ 되돌아온다 — ℳ 에서도 같은 결론</text><text x="34" y="236" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">조건 (나)</text><text x="34" y="254" text-anchor="start" fill="var(--ink2)" font-size="11">c 가 결과 ∀x φ 에 없으니 φ 에도 없다.</text><text x="34" y="272" text-anchor="start" fill="var(--ink2)" font-size="11">없으니 c 의 해석을 되돌려도 값이 같다</text><path d="M34 322 L846 322" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="348" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">d 를 아무거나 잡았는데 결론이 나왔으므로 모든 d 에 대해 성립하고, ∀ 조항에 의해 ℳ ⊨ ∀x φ 다</text><text x="440" y="374" text-anchor="middle" fill="var(--ink2)" font-size="11">조건 (가)가 없으면 ① 이 막히고 조건 (나)가 없으면 ④ 가 막힌다. 11장이 문법으로만 적어 둔 조건 하나에 걸음 하나가 대응한다</text><text x="440" y="396" text-anchor="middle" fill="var(--ink2)" font-size="11">∃E 도 같은 그림이고, 조건이 셋이라 되돌아올 때 결론 ψ 에 대해서도 같은 확인을 한 번 더 한다</text>
</svg>