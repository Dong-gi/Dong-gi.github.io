<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한정사 순서를 바꾸는 두 방향의 도출 비교</title><desc id="d">되는 방향과 안 되는 방향의 도출을 나란히 놓고 전칭 일반화를 쓰는 줄에서 임시 이름이 열린 가정에 들어 있는지 여부가 둘을 가른다는 것을 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="30" width="418" height="292" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="223" y="51" text-anchor="middle">되는 방향 — ∃y ∀x Gxy 에서 ∀x ∃y Gxy</text><path d="M78 104 L70 104 L70 209" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="90" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="74" y="90" text-anchor="start" fill="var(--ink)">∃y ∀x Gxy</text><text x="272" y="90" text-anchor="start" fill="var(--ink2)" font-size="11">전제</text><text x="60" y="118" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="87" y="118" text-anchor="start" fill="var(--ink)">∀x Gxc<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="272" y="118" text-anchor="start" fill="var(--ink2)" font-size="11">가정</text><text x="60" y="146" text-anchor="end" fill="var(--ink2)" font-size="11">3</text><text x="87" y="146" text-anchor="start" fill="var(--ink)">Gcc<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="272" y="146" text-anchor="start" fill="var(--ink2)" font-size="11">2 ∀E</text><text x="60" y="174" text-anchor="end" fill="var(--ink2)" font-size="11">4</text><text x="87" y="174" text-anchor="start" fill="var(--ink)">∃y Gcy</text><text x="272" y="174" text-anchor="start" fill="var(--ink2)" font-size="11">3 ∃I</text><text x="60" y="202" text-anchor="end" fill="var(--ink2)" font-size="11">5</text><text x="87" y="202" text-anchor="start" fill="var(--ink)">∀x ∃y Gxy</text><text x="272" y="202" text-anchor="start" fill="var(--ink2)" font-size="11">4 ∀I</text><text x="60" y="230" text-anchor="end" fill="var(--ink2)" font-size="11">6</text><text x="74" y="230" text-anchor="start" fill="var(--ink)">∀x ∃y Gxy</text><text x="272" y="230" text-anchor="start" fill="var(--ink2)" font-size="11">1, 2–5 ∃E</text><rect x="70" y="190" width="96" height="25" rx="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="2"/><text x="42" y="264" text-anchor="start" fill="var(--ink)" font-size="11">5 번 줄의 ∀I 에서 c 를 찾아본다. 열린 가정은 1 번 줄과</text><text x="42" y="284" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">2 번 줄이고 둘 다 c 가 없다. 통과.</text><rect x="448" y="30" width="418" height="292" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="657" y="51" text-anchor="middle">안 되는 방향 — ∀x ∃y Gxy 에서 ∃y ∀x Gxy</text><path d="M512 132 L504 132 L504 209" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="494" y="90" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="508" y="90" text-anchor="start" fill="var(--ink)">∀x ∃y Gxy</text><text x="706" y="90" text-anchor="start" fill="var(--ink2)" font-size="11">전제</text><text x="494" y="118" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="508" y="118" text-anchor="start" fill="var(--ink)">∃y Gcy</text><text x="706" y="118" text-anchor="start" fill="var(--ink2)" font-size="11">1 ∀E</text><text x="494" y="146" text-anchor="end" fill="var(--ink2)" font-size="11">3</text><text x="521" y="146" text-anchor="start" fill="var(--ink)">Gcc<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="706" y="146" text-anchor="start" fill="var(--ink2)" font-size="11">가정</text><text x="494" y="174" text-anchor="end" fill="var(--ink2)" font-size="11">4</text><text x="521" y="174" text-anchor="start" fill="var(--ink)">∀x Gxc<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="706" y="174" text-anchor="start" fill="var(--ink2)" font-size="11">3 ∀I</text><text x="494" y="202" text-anchor="end" fill="var(--ink2)" font-size="11">5</text><text x="521" y="202" text-anchor="start" fill="var(--ink)">∃y ∀x Gxy</text><text x="706" y="202" text-anchor="start" fill="var(--ink2)" font-size="11">4 ∃I</text><text x="494" y="230" text-anchor="end" fill="var(--ink2)" font-size="11">6</text><text x="508" y="230" text-anchor="start" fill="var(--ink)">∃y ∀x Gxy</text><text x="706" y="230" text-anchor="start" fill="var(--ink2)" font-size="11">2, 3–5 ∃E</text><rect x="504" y="162" width="96" height="25" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="2"/><text x="476" y="264" text-anchor="start" fill="var(--ink)" font-size="11">4 번 줄의 ∀I 에서 c 를 찾아본다. 열린 가정에 3 번 줄</text><text x="476" y="284" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">Gcc<tspan baseline-shift="-22%" font-size="76%">1</tspan> 이 있고 거기에 c 가 있다. 막힌다.</text><path d="M42 346 L840 346" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="372" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">두 도출의 줄 수와 규칙 이름이 똑같다. 갈라지는 것은 ∀I 를 쓰는 줄에서 c 가 열린 가정에 있는가 하나다</text><text x="440" y="396" text-anchor="middle" fill="var(--ink2)" font-size="11">왼쪽은 임시 이름 c<tspan baseline-shift="-22%" font-size="76%">1</tspan> 이 가정에 들어 있고 일반화하려는 c 는 들어 있지 않다. 오른쪽은 가정 하나에 둘이 함께 들어 있다</text>
</svg>