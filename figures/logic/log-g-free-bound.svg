<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 424" width="780" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">자유 나타남과 속박 나타남, 그리고 한정사의 범위</title><desc id="d">세 적형식에서 변수의 나타남마다 자유인지 속박인지 표시하고 한정사의 범위를 꺾쇠로 나타낸 그림. 둘째 식에서는 같은 변수 x 가 속박된 나타남과 자유 나타남을 함께 갖는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="390" y="26" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">자유와 속박은 변수에 붙는 성질이 아니라 변수의 나타남 하나하나에 붙는 성질이다</text><text x="48.5" y="96" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∀</text><text x="65.5" y="96" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="82.5" y="96" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">(</text><text x="99.5" y="96" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">F</text><text x="116.5" y="96" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="150.5" y="96" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">→</text><text x="184.5" y="96" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">G</text><text x="201.5" y="96" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="218.5" y="96" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">)</text><path d="M74.5 106 L74.5 112 L226.5 112 L226.5 106" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="150.5" y="126" text-anchor="middle" style="font-size:10px" fill="var(--s3)" font-weight="600">∀x 의 범위</text><text x="65.5" y="76" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="116.5" y="76" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="201.5" y="76" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="354" y="92" text-anchor="start" style="font-size:12px" fill="var(--ink2)">x 의 나타남이 셋인데 모두 ∀x 의 범위 안에 있다.</text><text x="354" y="111" text-anchor="start" style="font-size:12px" fill="var(--ink2)">자유 나타남이 하나도 없으므로 이것은 문장이다</text><text x="48.5" y="198" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">(</text><text x="65.5" y="198" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∀</text><text x="82.5" y="198" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="116.5" y="198" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">F</text><text x="133.5" y="198" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="167.5" y="198" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∧</text><text x="201.5" y="198" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">G</text><text x="218.5" y="198" text-anchor="middle" style="font-size:20px" fill="var(--s2)" font-weight="600">x</text><text x="235.5" y="198" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">)</text><path d="M108.5 208 L108.5 214 L141.5 214 L141.5 208" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="228" text-anchor="middle" style="font-size:10px" fill="var(--s3)" font-weight="600">∀x 의 범위</text><text x="82.5" y="178" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="133.5" y="178" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="218.5" y="178" text-anchor="middle" style="font-size:10px" fill="var(--s2)" font-weight="600">자유</text><text x="354" y="194" text-anchor="start" style="font-size:12px" fill="var(--ink2)">∀x 의 범위는 Fx 까지다. Gx 의 x 는 범위 밖이라 자유다.</text><text x="354" y="213" text-anchor="start" style="font-size:12px" fill="var(--ink2)">같은 변수 x 가 한 식 안에서 속박이기도 자유이기도 하다</text><text x="48.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∃</text><text x="65.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">y</text><text x="82.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">(</text><text x="99.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">G</text><text x="116.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--s2)" font-weight="600">x</text><text x="133.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">y</text><text x="167.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∧</text><text x="201.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∀</text><text x="218.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="252.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">F</text><text x="269.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="286.5" y="300" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">)</text><path d="M74.5 310 L74.5 316 L294.5 316 L294.5 310" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="184.5" y="330" text-anchor="middle" style="font-size:10px" fill="var(--s3)" font-weight="600">∃y 의 범위</text><text x="65.5" y="280" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="133.5" y="280" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="218.5" y="280" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="269.5" y="280" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="116.5" y="265" text-anchor="middle" style="font-size:10px" fill="var(--s2)" font-weight="600">자유</text><text x="354" y="296" text-anchor="start" style="font-size:12px" fill="var(--ink2)">y 의 나타남 둘은 ∃y 가 잡고 오른쪽 x 둘은 ∀x 가 잡는다.</text><text x="354" y="315" text-anchor="start" style="font-size:12px" fill="var(--ink2)">Gxy 의 x 는 그것을 잡는 한정사가 없어 자유다</text><path fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)" stroke-dasharray="4 3" d="M116.5 62 L69.5 62"/><path fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)" stroke-dasharray="4 3" d="M201.5 48 L69.5 48"/><text x="216" y="52" text-anchor="start" style="font-size:10px" fill="var(--s1)" font-weight="600">∀x 가 잡는다</text><path d="M20 348 L760 348" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="368" text-anchor="start" style="font-size:11px" fill="var(--ink2)">읽어낼 것 — 판정은 나타남마다 하나씩 한다. 그 자리를 감싸는 한정사들을 안쪽에서 바깥쪽으로 훑어, 같은 변수를 쓴 한정사가</text><text x="24" y="387" text-anchor="start" style="font-size:11px" fill="var(--ink2)">하나라도 있으면 속박이고 하나도 없으면 자유다. 둘 있으면 가장 가까운 것이 잡는다. 한정사에 붙어 있는 변수 자신도 속박이다.</text><text x="24" y="406" text-anchor="start" style="font-size:11px" fill="var(--ink2)">자유 나타남이 하나도 없는 적형식을 문장이라 하고, 10장에서 참·거짓이 붙는 것은 문장뿐이다</text>
</svg>