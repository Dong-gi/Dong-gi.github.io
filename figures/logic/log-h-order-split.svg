<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한정사 순서를 가르는 두 모형</title><desc id="d">왼쪽 모형에는 모든 화살표를 받는 점이 없고 오른쪽 모형에는 있다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">∀x∃y Gxy 와 ∃y∀x Gxy 를 가르는 것은 ‘모두를 받는 점’ 이 있는가다</text><rect x="14" y="46" width="380" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="204" y="66" text-anchor="middle">모형 ℳ1</text><text class="ink2 sm" x="204" y="83" text-anchor="middle">D = { 1, 2 },  I(G) = { (1,1), (2,2) }</text><rect x="60" y="106" width="290" height="106" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="6 4"/><circle cx="140" cy="170" r="6" fill="var(--ink)"/><text class="ink bold sm" x="140" y="190" text-anchor="middle">1</text><circle cx="270" cy="170" r="6" fill="var(--ink)"/><text class="ink bold sm" x="270" y="190" text-anchor="middle">2</text><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M132.2 152.25 C114 121.7 166 121.7 148.06 152.64"/><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M262.2 152.25 C244 121.7 296 121.7 278.06 152.64"/><text x="205" y="124" text-anchor="middle" fill="var(--ink2)" font-size="11">화살표가 제자리로만 돌아온다</text><text x="204" y="238" text-anchor="middle" fill="var(--s1)" font-weight="600">∀x∃y Gxy — 참</text><text x="204" y="258" text-anchor="middle" fill="var(--ink2)" font-size="11">x = 1 은 y = 1 로, x = 2 는 y = 2 로 받는다</text><text x="204" y="284" text-anchor="middle" fill="var(--s2)" font-weight="600">∃y∀x Gxy — 거짓</text><text x="204" y="304" text-anchor="middle" fill="var(--ink2)" font-size="11">y = 1 은 x = 2 에서, y = 2 는 x = 1 에서 막힌다</text><rect x="406" y="46" width="380" height="274" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="596" y="66" text-anchor="middle">모형 ℳ2</text><text class="ink2 sm" x="596" y="83" text-anchor="middle">D = { 1, 2 },  I(G) = { (1,1), (2,1) }</text><rect x="452" y="106" width="290" height="106" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="6 4"/><ellipse cx="532" cy="170" rx="27" ry="25" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><circle cx="532" cy="170" r="6" fill="var(--ink)"/><text class="ink bold sm" x="532" y="190" text-anchor="middle">1</text><circle cx="662" cy="170" r="6" fill="var(--ink)"/><text class="ink bold sm" x="662" y="190" text-anchor="middle">2</text><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M524.2 152.25 C506 121.7 558 121.7 540.06 152.64"/><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M650 170 L566 170"/><text x="597" y="124" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">점 1 이 모든 화살표를 받는다</text><text x="596" y="238" text-anchor="middle" fill="var(--s1)" font-weight="600">∀x∃y Gxy — 참</text><text x="596" y="258" text-anchor="middle" fill="var(--ink2)" font-size="11">y = 1 하나로 x 둘을 모두 받는다</text><text x="596" y="284" text-anchor="middle" fill="var(--s1)" font-weight="600">∃y∀x Gxy — 참</text><text x="596" y="304" text-anchor="middle" fill="var(--ink2)" font-size="11">먼저 고른 y 하나가 x 를 모두 받아 낸다</text><rect x="14" y="340" width="772" height="78" rx="6" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text x="400" y="366" text-anchor="middle" fill="var(--ink)" font-weight="600">ℳ1 하나가 ∀x∃y Gxy ⊨ ∃y∀x Gxy 를 깬다 — 전제가 참인데 결론이 거짓인 모형이 실제로 있다</text><text x="400" y="390" text-anchor="middle" fill="var(--ink2)" font-size="11">반대 방향 ∃y∀x Gxy ⊨ ∀x∃y Gxy 는 어떤 모형에서도 깨지지 않는다.</text><text x="400" y="408" text-anchor="middle" fill="var(--ink2)" font-size="11">모두를 받는 점이 하나 있으면 각 x 는 그것을 고르면 되기 때문이다.</text>
</svg>