<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 432" width="780" height="432" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">대입의 두 경우 — 개체상수를 넣는 안전한 대입과 변수 포획</title><desc id="d">위쪽은 개체상수를 넣어 자유 나타남만 바뀌고 속박 나타남은 그대로인 안전한 대입, 아래쪽은 변수를 넣었더니 존재 한정사에 잡혀 뜻이 달라지는 포획과 속박 변수의 이름을 바꿔 피하는 방법</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="390" y="26" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">대입은 자유 나타남만 바꾼다 — 바꿔 넣은 자리에서 새 변수가 잡히면 대입이 망가진다</text><rect x="20" y="42" width="740" height="138" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="390" y="62" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">안전한 대입 — 개체상수를 넣는다</text><text x="390" y="79" text-anchor="middle" style="font-size:11px" fill="var(--ink2)">넣는 것에 변수가 없으므로 잡힐 것이 없다</text><text x="68.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">(</text><text x="85.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∀</text><text x="102.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="136.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">F</text><text x="153.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="187.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∧</text><text x="221.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">G</text><text x="238.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--s2)" font-weight="600">x</text><text x="255.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">)</text><text x="102.5" y="108" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="153.5" y="108" text-anchor="middle" style="font-size:10px" fill="var(--s1)" font-weight="600">속박</text><text x="238.5" y="108" text-anchor="middle" style="font-size:10px" fill="var(--s2)" font-weight="600">자유</text><text x="276" y="130" text-anchor="start" style="font-size:19px" fill="var(--s3)" font-weight="600">[a/x]</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M336 124 L378 124"/><text x="402.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">(</text><text x="419.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∀</text><text x="436.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="470.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">F</text><text x="487.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">x</text><text x="521.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∧</text><text x="555.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">G</text><text x="572.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--s3)" font-weight="600">a</text><text x="589.5" y="130" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">)</text><text x="572.5" y="108" text-anchor="middle" style="font-size:10px" fill="var(--s3)" font-weight="600">바뀐 자리</text><text x="614" y="130" text-anchor="start" style="font-size:11px" fill="var(--ink2)">속박은 그대로다</text><text x="60" y="160" text-anchor="start" style="font-size:11px" fill="var(--ink2)">대입 표기 [a/x] 는 위가 들어가는 것, 아래가 밀려나는 것이다. 방향을 반대로 적는 책도 있으니 이 문서의 약속을 기억하라</text><rect x="20" y="196" width="740" height="152" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="390" y="216" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">포획 — 변수를 넣었더니 한정사에 잡혔다</text><text x="390" y="233" text-anchor="middle" style="font-size:11px" fill="var(--ink2)">넣은 y 는 원래 자유였는데 ∃y 의 범위 안으로 들어가 버린다</text><text x="68.5" y="286" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∃</text><text x="85.5" y="286" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">y</text><text x="119.5" y="286" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">G</text><text x="136.5" y="286" text-anchor="middle" style="font-size:20px" fill="var(--s2)" font-weight="600">x</text><text x="153.5" y="286" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">y</text><text x="136.5" y="264" text-anchor="middle" style="font-size:10px" fill="var(--s2)" font-weight="600">자유</text><text x="174" y="286" text-anchor="start" style="font-size:19px" fill="var(--s2)" font-weight="600">[y/x]</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M234 280 L276 280"/><text x="300.5" y="286" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">∃</text><text x="317.5" y="286" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">y</text><text x="351.5" y="286" text-anchor="middle" style="font-size:20px" fill="var(--ink)" font-weight="600">G</text><text x="368.5" y="286" text-anchor="middle" style="font-size:20px" fill="var(--s2)" font-weight="600">y</text><text x="385.5" y="286" text-anchor="middle" style="font-size:20px" fill="var(--s1)" font-weight="600">y</text><path fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="4 3" d="M368.5 264 L317.5 264"/><text x="386.5" y="260" text-anchor="start" style="font-size:11px" fill="var(--s2)" font-weight="600">∃y 가 잡아 버렸다</text><path d="M60 304 L700 304" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="60" y="324" text-anchor="start" style="font-size:12px" fill="var(--s3)" font-weight="600">피하는 법 — 속박 변수의 이름을 먼저 바꾼다.</text><text x="316" y="324" text-anchor="start" style="font-size:11px" fill="var(--ink2)">∃y Gxy 를 ∃z Gxz 로 고치면 넣은 y 가 자유로 남는다</text><text x="24" y="376" text-anchor="start" style="font-size:11px" fill="var(--ink2)">읽어낼 것 — 개체상수에는 변수가 없어 언제나 안전하다. 그래서 11장은 한정사 규칙을 개체상수로만 진술하고 포획이 아예 일어나지 않게 한다.</text><text x="24" y="395" text-anchor="start" style="font-size:11px" fill="var(--ink2)">대신 그 자리에 다른 종류의 조건이 붙는다 — 쓴 이름이 열린 가정에 나타나지 않아야 한다는 조건이다. 목적은 같다.</text><text x="24" y="414" text-anchor="start" style="font-size:11px" fill="var(--ink2)">대입한 결과가 원래 식이 말하지 않은 것을 말하게 두지 않는 것이다</text>
</svg>