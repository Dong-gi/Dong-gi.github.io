<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 366" width="700" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">포함적 또는와 배타적 또는가 갈리는 칸은 하나뿐이다</title><desc id="d">커피와 차를 마셨는가로 만든 네 칸 격자. 둘 다 마신 칸에서만 두 읽기의 판정이 다르다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="350" y="28" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="600">‘커피 또는 차를 마셨다’ 를 참으로 받아들이는 칸</text><text x="295" y="80" text-anchor="middle" fill="var(--ink2)" font-size="12">차를 마셨다</text><text x="545" y="80" text-anchor="middle" fill="var(--ink2)" font-size="12">차를 마시지 않았다</text><text x="160" y="148" text-anchor="end" fill="var(--ink2)" font-size="12">커피를 마셨다</text><text x="160" y="248" text-anchor="end" fill="var(--ink2)" font-size="12">커피를 마시지 않았다</text><rect x="176" y="100" width="238" height="88" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="2.4"/><text x="295" y="128" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="600">둘 다 마셨다</text><text x="295" y="148" text-anchor="middle" fill="var(--s2)" font-size="12">포함적 읽기 — 참</text><text x="295" y="168" text-anchor="middle" fill="var(--s2)" font-size="12">배타적 읽기 — 거짓</text><rect x="426" y="100" width="238" height="88" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.3"/><text x="545" y="128" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="600">커피만 마셨다</text><text x="545" y="148" text-anchor="middle" fill="var(--s3)" font-size="12">두 읽기 모두 참</text><rect x="176" y="200" width="238" height="88" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.3"/><text x="295" y="228" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="600">차만 마셨다</text><text x="295" y="248" text-anchor="middle" fill="var(--s3)" font-size="12">두 읽기 모두 참</text><rect x="426" y="200" width="238" height="88" rx="4" fill="var(--ink2)" fill-opacity="0.05" stroke="var(--ink2)" stroke-width="1.3"/><text x="545" y="228" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="600">아무것도 안 마셨다</text><text x="545" y="248" text-anchor="middle" fill="var(--ink2)" font-size="12">두 읽기 모두 거짓</text><path d="M20 312 L680 312" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="334" text-anchor="start" fill="var(--ink)" font-size="12">네 칸 중 갈리는 칸은 왼쪽 위 하나뿐이다. 그러니 판별 물음도 하나다 — 둘 다일 때도 참인가.</text><text x="20" y="354" text-anchor="start" fill="var(--ink2)" font-size="12">논리학은 ∨ 를 포함적 쪽으로 정한다. 배타로 읽어야 하면 (P ∨ Q) ∧ ¬(P ∧ Q) 로 조립해 적는다.</text>
</svg>