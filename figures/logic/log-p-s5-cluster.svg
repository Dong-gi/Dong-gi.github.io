<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">S5 프레임은 서로 통하는 덩어리로 갈라지고 양상이 붕괴한다</title><desc id="d">왼쪽은 동치관계가 세계를 덩어리로 나누는 모습이고 오른쪽은 그 결과로 겹친 양상이 하나로 줄어드는 네 등가식이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="450" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">S5 에서는 어느 세계에서 보아도 보이는 것이 같다 — 그래서 양상이 쌓이지 않는다</text><rect x="20" y="44" width="486" height="316" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="263" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">R 이 동치관계이면 W 가 덩어리로 갈라진다</text><text x="263" y="81" text-anchor="middle" fill="var(--ink2)" font-size="11">덩어리 안에서는 모든 짝이 서로 보이고 덩어리 사이에는 화살표가 없다</text><rect x="48" y="118" width="236" height="190" rx="14" fill="var(--s1)" fill-opacity="0.07" stroke="var(--s1)" stroke-width="1.4" stroke-dasharray="6 4"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" marker-start="url(#ark)" d="M128 252 L201 252"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" marker-start="url(#ark)" d="M120.08 235.1 L150 199.21"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" marker-start="url(#ark)" d="M211.92 235.1 L182 199.21"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M95 235 C82 203, 130 203, 117 235"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M215 235 C202 203, 250 203, 237 235"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M155 163 C142 131, 190 131, 177 163"/><circle cx="106" cy="252" r="19" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="106" y="257" text-anchor="middle" fill="var(--s1)" font-weight="600">w</text><circle cx="226" cy="252" r="19" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="226" y="257" text-anchor="middle" fill="var(--s1)" font-weight="600">u</text><circle cx="166" cy="180" r="19" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="166" y="185" text-anchor="middle" fill="var(--s1)" font-weight="600">t</text><text x="166" y="332" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">덩어리 하나 — 셋이 서로 통한다</text><rect x="316" y="118" width="168" height="190" rx="14" fill="var(--s3)" fill-opacity="0.09" stroke="var(--s3)" stroke-width="1.4" stroke-dasharray="6 4"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" marker-start="url(#ark)" d="M382 230 L415 230"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M349 213 C336 181, 384 181, 371 213"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M429 213 C416 181, 464 181, 451 213"/><circle cx="360" cy="230" r="19" fill="var(--s3)" fill-opacity="0.12" stroke="var(--s3)" stroke-width="1.8"/><text x="360" y="235" text-anchor="middle" fill="var(--s3)" font-weight="600">x</text><circle cx="440" cy="230" r="19" fill="var(--s3)" fill-opacity="0.12" stroke="var(--s3)" stroke-width="1.8"/><text x="440" y="235" text-anchor="middle" fill="var(--s3)" font-weight="600">y</text><text x="398" y="332" text-anchor="middle" fill="var(--s3)" font-size="11" font-weight="600">다른 덩어리 — 저기가 안 보인다</text><rect x="522" y="44" width="358" height="316" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="701" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">그 결과 — 양상이 쌓여도 늘어나지 않는다</text><text x="701" y="81" text-anchor="middle" fill="var(--ink2)" font-size="11">앞에 무엇이 붙든 맨 뒤의 것 하나만 남는다</text><rect x="538" y="107" width="326" height="30" rx="4" fill="var(--s1)" fill-opacity="0.09" stroke="var(--s1)" stroke-width="1.1"/><text x="562" y="128" text-anchor="start" fill="var(--ink)" font-weight="600">□□φ  ↔  □φ</text><rect x="538" y="145" width="326" height="30" rx="4" fill="var(--s1)" fill-opacity="0.09" stroke="var(--s1)" stroke-width="1.1"/><text x="562" y="166" text-anchor="start" fill="var(--ink)" font-weight="600">◇□φ  ↔  □φ</text><rect x="538" y="183" width="326" height="30" rx="4" fill="var(--s1)" fill-opacity="0.09" stroke="var(--s1)" stroke-width="1.1"/><text x="562" y="204" text-anchor="start" fill="var(--ink)" font-weight="600">□◇φ  ↔  ◇φ</text><rect x="538" y="221" width="326" height="30" rx="4" fill="var(--s1)" fill-opacity="0.09" stroke="var(--s1)" stroke-width="1.1"/><text x="562" y="242" text-anchor="start" fill="var(--ink)" font-weight="600">◇◇φ  ↔  ◇φ</text><text x="538" y="306" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">S5 에서 서로 다른 양상은 셋뿐이다 — 없음 · □ · ◇</text><text x="538" y="328" text-anchor="start" fill="var(--ink2)" font-size="11">S4 에서는 열넷이라고 알려져 있다</text><path d="M20 384 L880 384" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="408" text-anchor="start" fill="var(--ink)" font-size="11">이유는 왼쪽 그림에 있다. □φ 를 판정하려고 덩어리 안의 어느 세계로 옮겨 가도 그 세계가 보는 것은 같은 덩어리 전체다.</text><text x="24" y="430" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">그러니 한 번 물은 것을 다시 물어도 답이 같다. 겹쳐 붙인 □ 와 ◇ 가 하나로 줄어드는 것이 그 뜻이다.</text><text x="24" y="456" text-anchor="start" fill="var(--ink2)" font-size="11">S5 가 편해 보이지만 편한 것이 늘 옳은 것은 아니다. 인식 읽기에서 이 붕괴는 ‘모르면 모른다는 것을 안다’ 는 강한 주장이 된다.</text>
</svg>