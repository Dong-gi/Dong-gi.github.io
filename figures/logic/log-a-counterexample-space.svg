<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 802 352" width="802" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">반례 — 두 영역이 겹치는가</title><desc id="d">전제를 모두 참으로 만드는 상황과 결론을 거짓으로 만드는 상황이 겹치면 그 점이 반례다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold sm" x="206" y="26" text-anchor="middle">타당한 논증 — 두 영역이 겹치지 않는다</text><text class="ink bold sm" x="594" y="26" text-anchor="middle">부당한 논증 — 겹치는 점이 있다</text><rect x="36" y="44" width="340" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="46" y="62" text-anchor="start">상상할 수 있는 모든 상황</text><ellipse cx="120" cy="158" rx="72" ry="58" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><ellipse cx="296" cy="158" rx="66" ry="54" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.6"/><text class="ink sm" x="120" y="162" text-anchor="middle">전제 모두 참</text><text class="ink sm" x="296" y="162" text-anchor="middle">결론 거짓</text><text class="ink2 sm" x="206" y="240" text-anchor="middle">겹치는 점이 하나도 없다 → 반례가 없다</text><rect x="424" y="44" width="340" height="216" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink2 sm" x="434" y="62" text-anchor="start">상상할 수 있는 모든 상황</text><ellipse cx="516" cy="158" rx="84" ry="58" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><ellipse cx="648" cy="158" rx="72" ry="54" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.6"/><text class="ink sm" x="486" y="162" text-anchor="middle">전제 모두 참</text><text class="ink sm" x="678" y="162" text-anchor="middle">결론 거짓</text><circle cx="588" cy="158" r="5" fill="var(--s2)"/><path d="M588 166 L588 226" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><text class="ink bold sm" x="588" y="244" text-anchor="middle">이 점 하나가 반례다</text><text class="ink2 sm" x="36" y="292" text-anchor="start">파란 영역 — 전제를 모두 참으로 만드는 상황들. 주황 영역 — 결론을 거짓으로 만드는 상황들</text><text class="ink2 sm" x="36" y="314" text-anchor="start">타당함을 보이려면 영역 전체가 겹치지 않음을 확인해야 하고, 부당함을 보이려면 겹치는 점 하나를 내놓으면 된다</text><text class="ink2 sm" x="36" y="336" text-anchor="start">드는 수고가 이렇게 다르다는 것이 이 문서가 반례를 먼저 가르치는 이유다</text>
</svg>