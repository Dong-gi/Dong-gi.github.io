<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 366" width="822" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">조건문을 쓰는 네 형식</title><desc id="d">전건 긍정과 후건 부정은 타당하고 후건 긍정과 전건 부정은 같은 반례로 무너진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="36" y="30" width="356" height="132" rx="6" fill="var(--s3)" fill-opacity="0.07" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="52" y="55" text-anchor="start">전건 긍정 (modus ponens)</text><text class="ink" x="98" y="86" text-anchor="middle">φ → ψ</text><text class="ink" x="98" y="108" text-anchor="middle">φ</text><path d="M62 118 L134 118" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><text class="ink" x="98" y="140" text-anchor="middle">ψ</text><text class="ink bold sm" x="160" y="86" text-anchor="start">타당하다</text><text class="ink2 sm" x="160" y="110" text-anchor="start">전제를 모두 참으로 만들면서</text><text class="ink2 sm" x="160" y="130" text-anchor="start">결론을 거짓으로 만드는 상황이 없다</text><rect x="428" y="30" width="356" height="132" rx="6" fill="var(--s3)" fill-opacity="0.07" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="444" y="55" text-anchor="start">후건 부정 (modus tollens)</text><text class="ink" x="490" y="86" text-anchor="middle">φ → ψ</text><text class="ink" x="490" y="108" text-anchor="middle">¬ψ</text><path d="M454 118 L526 118" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><text class="ink" x="490" y="140" text-anchor="middle">¬φ</text><text class="ink bold sm" x="552" y="86" text-anchor="start">타당하다</text><text class="ink2 sm" x="552" y="110" text-anchor="start">ψ 가 거짓인데 φ 가 참이면</text><text class="ink2 sm" x="552" y="130" text-anchor="start">φ → ψ 가 거짓이 되어 전제와 어긋난다</text><rect x="36" y="186" width="356" height="132" rx="6" fill="var(--s2)" fill-opacity="0.07" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="52" y="211" text-anchor="start">후건 긍정 (오류)</text><text class="ink" x="98" y="242" text-anchor="middle">φ → ψ</text><text class="ink" x="98" y="264" text-anchor="middle">ψ</text><path d="M62 274 L134 274" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><text class="ink" x="98" y="296" text-anchor="middle">φ</text><text class="ink bold sm" x="160" y="242" text-anchor="start">부당하다</text><text class="ink2 sm" x="160" y="266" text-anchor="start">반례 — φ 는 거짓, ψ 는 참</text><text class="ink2 sm" x="160" y="286" text-anchor="start">전제는 둘 다 참, 결론은 거짓</text><rect x="428" y="186" width="356" height="132" rx="6" fill="var(--s2)" fill-opacity="0.07" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="444" y="211" text-anchor="start">전건 부정 (오류)</text><text class="ink" x="490" y="242" text-anchor="middle">φ → ψ</text><text class="ink" x="490" y="264" text-anchor="middle">¬φ</text><path d="M454 274 L526 274" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round"/><text class="ink" x="490" y="296" text-anchor="middle">¬ψ</text><text class="ink bold sm" x="552" y="242" text-anchor="start">부당하다</text><text class="ink2 sm" x="552" y="266" text-anchor="start">반례 — φ 는 거짓, ψ 는 참</text><text class="ink2 sm" x="552" y="286" text-anchor="start">위 칸과 반례가 똑같다</text><text class="ink2 sm" x="36" y="346" text-anchor="start">아래 두 형식은 반례 하나로 함께 무너진다. φ 가 거짓이고 ψ 가 참이면 φ → ψ 는 참이 되기 때문이다</text>
</svg>