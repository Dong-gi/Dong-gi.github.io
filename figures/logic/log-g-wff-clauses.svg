<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 466" width="780" height="466" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">5장의 적형식 정의와 9장의 적형식 정의를 나란히 놓은 것</title><desc id="d">기저 재귀 폐포 세 조항이 두 정의에 그대로 있고, 기저의 문장문자가 원자식으로 바뀌고 재귀에 한정사 조항이 붙는 두 곳만 달라진다. 폐포 조항은 같고 확인할 갈래가 여섯에서 아홉으로 는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="390" y="26" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">조항은 여전히 셋이다 — 달라진 곳이 정확히 두 군데뿐이라는 것이 이 그림의 전부다</text><text x="202" y="52" text-anchor="middle" style="font-size:13px" fill="var(--ink2)" font-weight="600">5장 — 명제논리의 적형식</text><text x="578" y="52" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">9장 — 술어논리의 적형식</text><rect x="20" y="64" width="364" height="54" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="396" y="64" width="364" height="54" rx="5" fill="var(--s1)" fill-opacity="0.08" stroke="var(--s1)" stroke-width="1.4"/><text x="34" y="88" text-anchor="start" style="font-size:11.5px" fill="var(--ink2)">기저 — 모든 문장문자는 적형식이다</text><text x="410" y="88" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">기저 — 모든 원자식은 적형식이다</text><text x="410" y="107" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">⊥ 도 적형식이다 — 7장에서 그대로 온다</text><text x="748" y="108" text-anchor="end" style="font-size:10px" fill="var(--s2)" font-weight="600">바뀐 첫째 자리</text><path fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M388 91 L390 91"/><rect x="20" y="126" width="364" height="148" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="396" y="126" width="364" height="148" rx="5" fill="var(--s1)" fill-opacity="0.08" stroke="var(--s1)" stroke-width="1.4"/><text x="34" y="150" text-anchor="start" style="font-size:11.5px" fill="var(--ink2)">재귀 — φ 가 적형식이면 ¬φ 도 적형식이다</text><text x="34" y="169" text-anchor="start" style="font-size:11.5px" fill="var(--ink2)">φ 와 ψ 가 적형식이면 (φ ∧ ψ), (φ ∨ ψ),</text><text x="34" y="188" text-anchor="start" style="font-size:11.5px" fill="var(--ink2)">(φ → ψ), (φ ↔ ψ) 도 적형식이다</text><text x="410" y="150" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">재귀 — φ 가 적형식이면 ¬φ 도 적형식이다</text><text x="410" y="169" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">φ 와 ψ 가 적형식이면 (φ ∧ ψ), (φ ∨ ψ),</text><text x="410" y="188" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">(φ → ψ), (φ ↔ ψ) 도 적형식이다</text><text x="410" y="226" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">φ 가 적형식이고 x 가 변수이면</text><text x="410" y="245" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">∀xφ 와 ∃xφ 도 적형식이다</text><text x="748" y="264" text-anchor="end" style="font-size:10px" fill="var(--s2)" font-weight="600">바뀐 둘째 자리</text><path fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M388 200 L390 200"/><rect x="20" y="282" width="364" height="62" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="396" y="282" width="364" height="62" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="34" y="306" text-anchor="start" style="font-size:11.5px" fill="var(--ink2)">폐포 — 위 두 조항을 유한 번 적용해</text><text x="34" y="325" text-anchor="start" style="font-size:11.5px" fill="var(--ink2)">얻어지는 기호열만이 적형식이다</text><text x="410" y="306" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">폐포 — 위 두 조항을 유한 번 적용해</text><text x="410" y="325" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">얻어지는 기호열만이 적형식이다</text><text x="748" y="334" text-anchor="end" style="font-size:10px" fill="var(--s3)" font-weight="600">글자 하나 바뀌지 않는다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M388 313 L390 313"/><rect x="20" y="352" width="364" height="58" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="396" y="352" width="364" height="58" rx="5" fill="var(--s1)" fill-opacity="0.08" stroke="var(--s1)" stroke-width="1.4"/><text x="34" y="376" text-anchor="start" style="font-size:11.5px" fill="var(--ink2)">‘모든 적형식에 대하여’ 를 증명할 때 확인할 갈래 여섯</text><text x="34" y="395" text-anchor="start" style="font-size:11.5px" fill="var(--ink2)">문장문자 · ¬ · ∧ · ∨ · → · ↔ (7장의 ⊥ 을 넣으면 일곱)</text><text x="410" y="376" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">‘모든 적형식에 대하여’ 를 증명할 때 확인할 갈래 아홉</text><text x="410" y="395" text-anchor="start" style="font-size:11.5px" fill="var(--ink)">원자식 · ⊥ · ¬ · ∧ · ∨ · → · ↔ · ∀ · ∃</text><path fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)" d="M388 381 L390 381"/><text x="24" y="432" text-anchor="start" style="font-size:11px" fill="var(--ink2)">읽어낼 것 — 폐포 조항이 글자 하나 바뀌지 않는다는 것이 요점이다. 그래서 13장의 구조적 귀납법이 그대로 쓰이고, 5장에서</text><text x="24" y="451" text-anchor="start" style="font-size:11px" fill="var(--ink2)">여섯 갈래를 확인하던 증명이 여기서는 아홉 갈래가 된다. ⊥ 은 7장이 더한 것이고 ∀ · ∃ 가 이 장이 더한 둘이다</text>
</svg>