<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">린덴바움 보조정리 — 일관적인 집합을 극대 일관 집합으로 키우는 계단</title><desc id="d">적형식을 번호 순으로 하나씩 물어 넣거나 건너뛴다. 계단이 오른쪽으로만 자라고 합집합이 그 끝이다.</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="450" y="28" text-anchor="middle" fill="var(--ink)" font-weight="600">일관적인 Γ 를 극대 일관 집합 Γ* 로 키운다 — 린덴바움 보조정리</text><text x="450" y="52" text-anchor="middle" fill="var(--ink2)" font-size="11">5장이 준 것: 적형식 전체를 한 줄로 세울 수 있다.   φ<tspan baseline-shift="-22%" font-size="76%">1</tspan> = P,   φ<tspan baseline-shift="-22%" font-size="76%">2</tspan> = Q,   φ<tspan baseline-shift="-22%" font-size="76%">3</tspan> = ¬P,   φ<tspan baseline-shift="-22%" font-size="76%">4</tspan> = P ∧ Q,   …</text><text x="118" y="96" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">자라나는 집합 — 시작은 Γ = { P → Q }</text><text x="428" y="96" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">그 단계에서 묻는 것 하나</text><text x="106" y="134" text-anchor="end" fill="var(--ink)" font-size="11" font-weight="600">Γ<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><rect x="118" y="115" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text x="154" y="134" text-anchor="middle" fill="var(--ink)" font-size="11">P → Q</text><text x="428" y="134" text-anchor="start" fill="var(--ink2)" font-size="11">아직 아무것도 묻지 않았다. 주어진 집합 그대로다</text><text x="106" y="178" text-anchor="end" fill="var(--ink)" font-size="11" font-weight="600">Γ<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="118" y="159" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text x="154" y="178" text-anchor="middle" fill="var(--ink)" font-size="11">P → Q</text><rect x="190" y="159" width="72" height="27" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text x="226" y="178" text-anchor="middle" fill="var(--ink)" font-size="11">P</text><text x="428" y="178" text-anchor="start" fill="var(--ink2)" font-size="11">φ<tspan baseline-shift="-22%" font-size="76%">1</tspan> = P 를 넣어도 일관적인가 — 그렇다. 넣는다</text><text x="106" y="222" text-anchor="end" fill="var(--ink)" font-size="11" font-weight="600">Γ<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="118" y="203" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text x="154" y="222" text-anchor="middle" fill="var(--ink)" font-size="11">P → Q</text><rect x="190" y="203" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text x="226" y="222" text-anchor="middle" fill="var(--ink)" font-size="11">P</text><rect x="262" y="203" width="72" height="27" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text x="298" y="222" text-anchor="middle" fill="var(--ink)" font-size="11">Q</text><text x="428" y="222" text-anchor="start" fill="var(--ink2)" font-size="11">φ<tspan baseline-shift="-22%" font-size="76%">2</tspan> = Q 를 넣어도 일관적인가 — 그렇다. 넣는다</text><text x="106" y="266" text-anchor="end" fill="var(--ink)" font-size="11" font-weight="600">Γ<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="118" y="247" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text x="154" y="266" text-anchor="middle" fill="var(--ink)" font-size="11">P → Q</text><rect x="190" y="247" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text x="226" y="266" text-anchor="middle" fill="var(--ink)" font-size="11">P</text><rect x="262" y="247" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text x="298" y="266" text-anchor="middle" fill="var(--ink)" font-size="11">Q</text><rect x="334" y="247" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--s2)" stroke-width="1.3" stroke-dasharray="4 3"/><text x="370" y="266" text-anchor="middle" fill="var(--ink)" font-size="11">¬P  ✗</text><text x="428" y="266" text-anchor="start" fill="var(--s2)" font-size="11">φ<tspan baseline-shift="-22%" font-size="76%">3</tspan> = ¬P 는 어떤가 — Γ<tspan baseline-shift="-22%" font-size="76%">2</tspan> 에서 P 가 도출된다. ⊥ 가 나오므로 건너뛴다</text><text x="106" y="310" text-anchor="end" fill="var(--ink)" font-size="11" font-weight="600">Γ<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><rect x="118" y="291" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text x="154" y="310" text-anchor="middle" fill="var(--ink)" font-size="11">P → Q</text><rect x="190" y="291" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text x="226" y="310" text-anchor="middle" fill="var(--ink)" font-size="11">P</text><rect x="262" y="291" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--ink2)" stroke-width="1.3"/><text x="298" y="310" text-anchor="middle" fill="var(--ink)" font-size="11">Q</text><rect x="334" y="291" width="72" height="27" rx="3" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.3"/><text x="370" y="310" text-anchor="middle" fill="var(--ink)" font-size="11">P ∧ Q</text><text x="428" y="310" text-anchor="start" fill="var(--ink2)" font-size="11">φ<tspan baseline-shift="-22%" font-size="76%">4</tspan> = P ∧ Q 를 넣어도 일관적인가 — 그렇다. 넣는다</text><text x="106" y="368" text-anchor="end" fill="var(--ink)" font-weight="600">Γ*</text><rect x="118" y="349" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--s3)" stroke-width="1.3"/><text x="154" y="368" text-anchor="middle" fill="var(--ink)" font-size="11">P → Q</text><rect x="190" y="349" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--s3)" stroke-width="1.3"/><text x="226" y="368" text-anchor="middle" fill="var(--ink)" font-size="11">P</text><rect x="262" y="349" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--s3)" stroke-width="1.3"/><text x="298" y="368" text-anchor="middle" fill="var(--ink)" font-size="11">Q</text><rect x="334" y="349" width="72" height="27" rx="3" fill="none" fill-opacity="0" stroke="var(--s3)" stroke-width="1.3"/><text x="370" y="368" text-anchor="middle" fill="var(--ink)" font-size="11">P ∧ Q</text><text x="410" y="368" text-anchor="start" fill="var(--ink2)" font-size="11">⋯</text><text x="428" y="361" text-anchor="start" fill="var(--s3)" font-size="11">모든 단계를 합친다. Γ<tspan baseline-shift="-22%" font-size="76%">0</tspan> ⊆ Γ<tspan baseline-shift="-22%" font-size="76%">1</tspan> ⊆ Γ<tspan baseline-shift="-22%" font-size="76%">2</tspan> ⊆ ⋯ 이므로</text><text x="428" y="377" text-anchor="start" fill="var(--s3)" font-size="11">합집합 Γ* 는 이 사슬의 끝이다</text><path d="M40 394 L860 394" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round"/><text x="40" y="414" text-anchor="start" fill="var(--ink2)" font-size="11">합집합이 일관적인 까닭 — Γ* ⊢ ⊥ 이라면 그 도출이 유한하므로(7장) 인용한 가정도 유한하고, 그 유한 개는 어떤 한 단계 Γ<tspan baseline-shift="-22%" font-size="76%">n</tspan> 에 다 들어 있다.</text><text x="40" y="432" text-anchor="start" fill="var(--ink2)" font-size="11">그러면 Γ<tspan baseline-shift="-22%" font-size="76%">n</tspan> ⊢ ⊥ 이 되어 그 단계의 일관성에 어긋난다.   건너뛴 식도 버려지지 않는다 — φ 를 못 넣은 것은 ¬φ 가 이미 도출된다는 뜻이다.</text>
</svg>