<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">모형의 구성</title><desc id="d">왼쪽은 정의역의 점 셋과 술어가 고른 부분집합·화살표, 오른쪽은 같은 내용을 집합으로 적은 목록</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">모형 ℳ = ⟨ D, I ⟩ — 점들의 모임 하나와, 그 점들을 고르는 방법 하나</text><rect x="14" y="44" width="404" height="366" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="216" y="64" text-anchor="middle">그림으로 본 모형</text><text class="ink2 sm" x="216" y="81" text-anchor="middle">상수는 점 하나를 가리키고 술어는 점들을 고른다</text><rect x="96" y="118" width="300" height="214" rx="10" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.4" stroke-dasharray="6 4"/><text x="386" y="322" text-anchor="end" fill="var(--ink2)" font-size="11">정의역 D</text><ellipse cx="196" cy="176" rx="88" ry="40" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text x="196" y="128" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">I(F) 가 고른 것</text><circle cx="148" cy="176" r="6" fill="var(--ink)"/><text class="ink bold sm" x="148" y="196" text-anchor="middle">1</text><circle cx="244" cy="176" r="6" fill="var(--ink)"/><text class="ink bold sm" x="244" y="196" text-anchor="middle">2</text><circle cx="300" cy="282" r="6" fill="var(--ink)"/><text class="ink bold sm" x="300" y="302" text-anchor="middle">3</text><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M152 190 Q209.1 252.57 292 270"/><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M250 190 Q260.94 236.11 296 268"/><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ar2)" d="M292.8 263 C276 234.8 324 234.8 307.44 263.36"/><text x="346" y="152" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">I(G) 가 고른</text><text x="346" y="168" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">화살표</text><text x="52" y="180" text-anchor="start" fill="var(--ink)" font-weight="600">a</text><path fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)" d="M64 176 L136 176"/><text x="52" y="296" text-anchor="start" fill="var(--ink)" font-weight="600">b</text><path fill="none" stroke="var(--s3)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar3)" d="M64 292 L286 285"/><text x="30" y="200" text-anchor="start" fill="var(--ink2)" font-size="11">상수</text><rect x="432" y="44" width="354" height="366" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="609" y="64" text-anchor="middle">적어 본 모형</text><text class="ink2 sm" x="609" y="81" text-anchor="middle">위 그림에 든 정보가 이것뿐이다</text><text x="452" y="100" text-anchor="start" fill="var(--ink)" font-weight="600">D = { 1, 2, 3 }</text><text x="452" y="127" text-anchor="start" fill="var(--ink2)" font-size="11">— 비어 있으면 안 된다</text><text x="452" y="151" text-anchor="start" fill="var(--ink)" font-weight="600">I(a) = 1</text><text x="452" y="178" text-anchor="start" fill="var(--ink)" font-weight="600">I(b) = 3</text><text x="452" y="205" text-anchor="start" fill="var(--ink2)" font-size="11">— 상수는 D 의 원소 하나</text><text x="452" y="229" text-anchor="start" fill="var(--ink)" font-weight="600">I(F) = { 1, 2 }   ⊆ D</text><text x="452" y="256" text-anchor="start" fill="var(--ink2)" font-size="11">— 1항 술어는 D 의 부분집합</text><text x="452" y="280" text-anchor="start" fill="var(--ink)" font-weight="600">I(G) = { (1,3), (2,3), (3,3) }</text><text x="452" y="307" text-anchor="start" fill="var(--ink)" font-weight="600">       ⊆ D × D</text><text x="452" y="334" text-anchor="start" fill="var(--ink2)" font-size="11">— 2항 술어는 순서쌍의 집합</text><path d="M452 344 L768 344" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="452" y="366" text-anchor="start" fill="var(--ink2)" font-size="11">술어의 뜻은 여기서 끝난다. ‘F 는 빨갛다는 뜻’ 같은</text><text x="452" y="384" text-anchor="start" fill="var(--ink2)" font-size="11">설명은 모형 안에 없다 — 고른 집합이 곧 뜻이다</text>
</svg>