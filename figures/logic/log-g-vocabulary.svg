<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 396" width="780" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">술어논리의 어휘와 어휘가 아닌 기호들</title><desc id="d">개체상수와 변수가 항을 이루고 항수가 붙은 술어와 한정사 두 개가 더해지며 연결자 다섯과 괄호와 ⊥ 는 5장과 7장에서 그대로 온다. 함수기호와 문장문자와 쉼표는 어휘가 아니다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="390" y="26" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">5장의 어휘에서 문장문자가 빠지고 세 무리가 들어왔다 — 목록에 없는 기호는 하나도 쓸 수 없다</text><rect x="20" y="42" width="240" height="206" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="140" y="62" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">대상을 가리키는 기호</text><text x="140" y="79" text-anchor="middle" style="font-size:11px" fill="var(--ink2)">이 둘이 항을 이룬다</text><text x="38" y="104" text-anchor="start" style="font-size:12px" fill="var(--s1)" font-weight="600">개체상수</text><text x="112" y="106" text-anchor="start" style="font-size:15px" fill="var(--ink)" font-weight="600">a  b  c  a₁  a₂  …</text><text x="38" y="126" text-anchor="start" style="font-size:11px" fill="var(--ink2)">정해진 하나를 가리킨다</text><text x="38" y="164" text-anchor="start" style="font-size:12px" fill="var(--s2)" font-weight="600">변수</text><text x="112" y="166" text-anchor="start" style="font-size:15px" fill="var(--ink)" font-weight="600">x  y  z  x₁  x₂  …</text><text x="38" y="186" text-anchor="start" style="font-size:11px" fill="var(--ink2)">혼자서는 무엇을 가리키는지 정해지지 않는다</text><rect x="274" y="42" width="236" height="206" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="392" y="62" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">문장을 만드는 기호</text><text x="392" y="79" text-anchor="middle" style="font-size:11px" fill="var(--ink2)">술어에는 항수가 붙어 있다</text><text x="294" y="106" text-anchor="start" style="font-size:15px" fill="var(--s3)" font-weight="600">F</text><text x="320" y="106" text-anchor="start" style="font-size:11px" fill="var(--ink2)">1항</text><text x="364" y="106" text-anchor="start" style="font-size:14px" fill="var(--ink)" font-weight="600">Fa   Fx</text><text x="294" y="129" text-anchor="start" style="font-size:15px" fill="var(--s3)" font-weight="600">G</text><text x="320" y="129" text-anchor="start" style="font-size:11px" fill="var(--ink2)">2항</text><text x="364" y="129" text-anchor="start" style="font-size:14px" fill="var(--ink)" font-weight="600">Gab   Gxy</text><text x="294" y="152" text-anchor="start" style="font-size:15px" fill="var(--s3)" font-weight="600">H</text><text x="320" y="152" text-anchor="start" style="font-size:11px" fill="var(--ink2)">3항</text><text x="364" y="152" text-anchor="start" style="font-size:14px" fill="var(--ink)" font-weight="600">Habc</text><text x="294" y="184" text-anchor="start" style="font-size:15px" fill="var(--s1)" font-weight="600">한정사    ∀    ∃</text><text x="294" y="206" text-anchor="start" style="font-size:11px" fill="var(--ink2)">술어의 항수는 미리 정해지고 바뀌지 않는다</text><rect x="524" y="42" width="236" height="206" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="642" y="62" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">5장에서 그대로 오는 것</text><text x="642" y="79" text-anchor="middle" style="font-size:11px" fill="var(--ink2)">뜻도 항수도 그대로다</text><text x="544" y="104" text-anchor="start" style="font-size:17px" fill="var(--s2)" font-weight="600">¬   ∧   ∨   →   ↔</text><text x="544" y="124" text-anchor="start" style="font-size:11px" fill="var(--ink2)">연결자 다섯. ¬ 만 1항이다</text><text x="544" y="162" text-anchor="start" style="font-size:17px" fill="var(--s3)" font-weight="600">(        )</text><text x="544" y="182" text-anchor="start" style="font-size:11px" fill="var(--ink2)">괄호. 뜻이 없는 구두점이다</text><text x="544" y="220" text-anchor="start" style="font-size:17px" fill="var(--s1)" font-weight="600">⊥</text><text x="544" y="238" text-anchor="start" style="font-size:11px" fill="var(--ink2)">7장이 어휘에 더한 것. 항수 0 이다</text><rect x="20" y="262" width="740" height="106" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="390" y="282" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">어휘에 없는 것 — 이 장에서 가장 자주 섞여 들어오는 셋</text><text x="40" y="308" text-anchor="start" style="font-size:12px" fill="var(--ink2)">함수기호 f g — 이 문서는 쓰지 않기로 정했다. 그래서 항의 재귀 조항이 비어 있고, 항은 개체상수 아니면 변수 둘뿐이다</text><text x="40" y="328" text-anchor="start" style="font-size:12px" fill="var(--ink2)">문장문자 P Q R — 술어논리의 어휘에서 빠졌다. 그래서 술어에 P 를 쓰지 않는다. 술어는 F G H 로만 적는다</text><text x="40" y="348" text-anchor="start" style="font-size:12px" fill="var(--ink2)">쉼표 — 5장과 같다. 원자식은 Gab 처럼 항을 나란히 붙여 적으므로 Gab 안에 쉼표도 괄호도 없다</text>
</svg>