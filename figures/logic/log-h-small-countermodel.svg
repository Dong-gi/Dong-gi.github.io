<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" width="800" height="388" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">작은 정의역으로 만드는 반례 모형</title><desc id="d">정의역의 점을 하나씩 늘리며 각 크기에서 처음으로 가릴 수 있게 되는 것</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">반례 모형의 정의역은 필요한 구별만큼만 키운다</text><rect x="14" y="46" width="250" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="139" y="66" text-anchor="middle">정의역이 한 점</text><text class="ink2 sm" x="139" y="83" text-anchor="middle">고를 수 있는 부분집합은 둘뿐</text><rect x="46" y="100" width="186" height="78" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="6 4"/><circle cx="139" cy="132" r="6" fill="var(--ink)"/><text class="ink bold sm" x="139" y="152" text-anchor="middle">1</text><text x="139" y="194" text-anchor="middle" fill="var(--ink2)" font-size="11">I(F) = ∅ 아니면 { 1 }</text><path d="M36 212 L242 212" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="139" y="234" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">이것으로 깨지는 것</text><text x="139" y="258" text-anchor="middle" fill="var(--ink)" font-weight="600">∃x Fx</text><text x="139" y="282" text-anchor="middle" fill="var(--ink2)" font-size="11">I(F) = ∅ 로 두면 거짓이다</text><rect x="275" y="46" width="250" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="400" y="66" text-anchor="middle">정의역이 두 점</text><text class="ink2 sm" x="400" y="83" text-anchor="middle">처음으로 안과 밖이 갈린다</text><rect x="307" y="100" width="186" height="78" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="6 4"/><ellipse cx="360" cy="138" rx="34" ry="26" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><circle cx="360" cy="134" r="6" fill="var(--ink)"/><text class="ink bold sm" x="360" y="154" text-anchor="middle">1</text><circle cx="452" cy="134" r="6" fill="var(--ink)"/><text class="ink bold sm" x="452" y="154" text-anchor="middle">2</text><text x="400" y="194" text-anchor="middle" fill="var(--ink2)" font-size="11">I(F) = { 1 } — 하나는 안, 하나는 밖</text><path d="M297 212 L503 212" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="234" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">이것으로 깨지는 것</text><text x="400" y="258" text-anchor="middle" fill="var(--ink)" font-weight="600">∃x Fx → ∀x Fx</text><text x="400" y="282" text-anchor="middle" fill="var(--ink2)" font-size="11">앞은 참인데 뒤가 거짓이다</text><rect x="536" y="46" width="250" height="268" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="661" y="66" text-anchor="middle">정의역이 세 점</text><text class="ink2 sm" x="661" y="83" text-anchor="middle">처음으로 건너뛰기가 막힌다</text><rect x="568" y="100" width="186" height="78" rx="8" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="6 4"/><circle cx="600" cy="134" r="6" fill="var(--ink)"/><text class="ink bold sm" x="600" y="154" text-anchor="middle">1</text><circle cx="661" cy="134" r="6" fill="var(--ink)"/><text class="ink bold sm" x="661" y="154" text-anchor="middle">2</text><circle cx="722" cy="134" r="6" fill="var(--ink)"/><text class="ink bold sm" x="722" y="154" text-anchor="middle">3</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M609 132 L648 132"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M670 132 L709 132"/><path fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-dasharray="5 4" d="M600 148 Q661 190 722 148"/><text x="661" y="184" text-anchor="middle" fill="var(--ink2)" font-weight="600">✗</text><text x="661" y="194" text-anchor="middle" fill="var(--ink2)" font-size="11">1 에서 3 으로 가는 화살표는 없다</text><path d="M558 212 L764 212" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="661" y="234" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">이것으로 깨지는 것</text><text x="661" y="258" text-anchor="middle" fill="var(--ink)" font-weight="600">∀x∀y∀z (Gxy ∧ Gyz → Gxz)</text><text x="661" y="282" text-anchor="middle" fill="var(--ink2)" font-size="11">두 점으로는 이 반례를 만들 수 없다</text><path d="M14 334 L786 334" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="356" text-anchor="middle" fill="var(--ink)" font-size="11">먼저 무엇을 구별해야 하는지 세고, 그만큼의 점만 놓는다. 대부분 셋을 넘지 않는다.</text><text x="400" y="376" text-anchor="middle" fill="var(--ink2)" font-size="11">큰 정의역이 필요해 보이면 대개 구별을 잘못 센 것이다.</text>
</svg>