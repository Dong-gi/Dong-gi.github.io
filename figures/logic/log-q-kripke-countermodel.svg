<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">직관주의 크립키 반례 모형 둘</title><desc id="d">세계 둘짜리 모형이 배중률과 이중부정 제거를 떨어뜨리고, 갈래가 있는 세 세계짜리 모형이 드모르간의 한 방향을 떨어뜨린다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="450" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">반례 모형 둘 — 세계를 ‘지금까지 증명해 놓은 것’ 으로 읽는다</text><rect x="24" y="44" width="400" height="320" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="224" y="65" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">세계 둘 — 배중률과 이중부정 제거가 함께 떨어진다</text><text x="224" y="82" text-anchor="middle" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">0</tspan> ≤ w<tspan baseline-shift="-22%" font-size="76%">1</tspan> 이고 P 는 w<tspan baseline-shift="-22%" font-size="76%">1</tspan> 에서만 성립한다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M150 282 L150 180"/><text x="162" y="228" text-anchor="start" fill="var(--ink2)" font-size="11">더 알게 된다</text><circle cx="150" cy="160" r="9" fill="var(--s2)"/><text x="132" y="165" text-anchor="end" fill="var(--ink)" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="174" y="148" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">P 를 강제한다</text><text x="174" y="166" text-anchor="start" fill="var(--ink2)" font-size="11">그러므로 ¬P 는 강제하지 않는다</text><circle cx="150" cy="300" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><text x="132" y="305" text-anchor="end" fill="var(--ink)" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><text x="174" y="296" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">P 를 강제하지 않는다</text><text x="174" y="314" text-anchor="start" fill="var(--ink2)" font-size="11">¬P 도 아니다 — 위에서 P 가 나온다</text><text x="44" y="392" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">0</tspan> ⊮ P ∨ ¬P</text><text x="180" y="392" text-anchor="start" fill="var(--ink2)" font-size="11">양쪽 다 아니다</text><text x="44" y="414" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">0</tspan> ⊩ ¬¬P</text><text x="180" y="414" text-anchor="start" fill="var(--ink2)" font-size="11">¬P 를 강제하는 세계가 없다</text><text x="44" y="436" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">0</tspan> ⊮ ¬¬P → P</text><text x="180" y="436" text-anchor="start" fill="var(--ink2)" font-size="11">자기 자신이 반례다</text><rect x="452" y="44" width="424" height="320" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="664" y="65" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">갈래 하나 — 드모르간의 막힌 방향이 떨어진다</text><text x="664" y="82" text-anchor="middle" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">1</tspan> 에서만 P, w<tspan baseline-shift="-22%" font-size="76%">2</tspan> 에서만 Q 가 성립한다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M612 284 L536 178"/><path fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ark)" d="M628 284 L704 178"/><circle cx="530" cy="160" r="9" fill="var(--s2)"/><text x="530" y="142" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">1</tspan> — P 만</text><circle cx="710" cy="160" r="9" fill="var(--s3)"/><text x="710" y="142" text-anchor="middle" fill="var(--s3)" font-size="11" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">2</tspan> — Q 만</text><circle cx="620" cy="300" r="9" fill="none" stroke="var(--s1)" stroke-width="2"/><text x="620" y="324" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">0</tspan> — 아무 원자도 강제하지 않는다</text><text x="472" y="392" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">0</tspan> ⊩ ¬(P ∧ Q)</text><text x="618" y="392" text-anchor="start" fill="var(--ink2)" font-size="11">P ∧ Q 를 강제하는 세계가 하나도 없다</text><text x="472" y="414" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">0</tspan> ⊮ ¬P</text><text x="618" y="414" text-anchor="start" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">1</tspan> 이 P 를 강제한다</text><text x="472" y="436" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">0</tspan> ⊮ ¬Q</text><text x="618" y="436" text-anchor="start" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">2</tspan> 가 Q 를 강제한다</text><text x="24" y="456" text-anchor="start" fill="var(--ink2)" font-size="11">→ 와 ¬ 의 조항이 ‘더 아는 모든 세계’ 를 내다보기 때문에 위쪽 세계가 아래쪽 세계의 부정을 막는다. 그것이 두 모형이 하는 일 전부다.</text>
</svg>