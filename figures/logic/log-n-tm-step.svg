<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">튜링 기계의 한 걸음</title><desc id="d">전이표의 줄 하나가 칸 하나와 헤드 자리와 상태를 바꾸는 모습을 앞뒤로 나란히 놓았다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="450" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">전이 한 번 — 바뀌는 것은 칸 하나와 헤드 자리와 상태, 이 셋뿐이다</text><text x="144" y="94" text-anchor="end" fill="var(--ink2)" font-weight="600">앞</text><rect x="168" y="66" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="194" y="94" text-anchor="middle" fill="var(--ink)">□</text><rect x="220" y="66" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="246" y="94" text-anchor="middle" fill="var(--ink)">1</text><rect x="272" y="66" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="298" y="94" text-anchor="middle" fill="var(--ink)">0</text><rect x="324" y="66" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="350" y="94" text-anchor="middle" fill="var(--ink)">1</text><rect x="376" y="66" width="52" height="44" rx="2" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.8"/><text x="402" y="94" text-anchor="middle" fill="var(--s2)" font-weight="600">1</text><rect x="428" y="66" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="454" y="94" text-anchor="middle" fill="var(--ink)">0</text><rect x="480" y="66" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="506" y="94" text-anchor="middle" fill="var(--ink)">□</text><rect x="532" y="66" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="558" y="94" text-anchor="middle" fill="var(--ink)">□</text><path d="M402 114 L391 128 L413 128 z" fill="var(--s1)"/><ellipse cx="72" cy="88" rx="34" ry="20" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.7"/><text x="72" y="93" text-anchor="middle" fill="var(--s3)" font-weight="600">q<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="180" y="152" width="356" height="46" rx="5" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.6"/><text x="358" y="176" text-anchor="middle" fill="var(--s2)" font-weight="600">δ(q<tspan baseline-shift="-22%" font-size="76%">1</tspan>, 1) = (q<tspan baseline-shift="-22%" font-size="76%">2</tspan>, 0, 오른쪽)</text><text x="358" y="193" text-anchor="middle" fill="var(--ink2)" font-size="11">읽은 것이 1 이므로 이 줄이 쓰인다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M402 130 L402 146"/><path fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ark)" d="M402 202 L402 240"/><text x="144" y="278" text-anchor="end" fill="var(--ink2)" font-weight="600">뒤</text><rect x="168" y="250" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="194" y="278" text-anchor="middle" fill="var(--ink)">□</text><rect x="220" y="250" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="246" y="278" text-anchor="middle" fill="var(--ink)">1</text><rect x="272" y="250" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="298" y="278" text-anchor="middle" fill="var(--ink)">0</text><rect x="324" y="250" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="350" y="278" text-anchor="middle" fill="var(--ink)">1</text><rect x="376" y="250" width="52" height="44" rx="2" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.8"/><text x="402" y="278" text-anchor="middle" fill="var(--s2)" font-weight="600">0</text><rect x="428" y="250" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="454" y="278" text-anchor="middle" fill="var(--ink)">0</text><rect x="480" y="250" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="506" y="278" text-anchor="middle" fill="var(--ink)">□</text><rect x="532" y="250" width="52" height="44" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="558" y="278" text-anchor="middle" fill="var(--ink)">□</text><path d="M454 298 L443 312 L465 312 z" fill="var(--s1)"/><ellipse cx="72" cy="272" rx="34" ry="20" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.7"/><text x="72" y="277" text-anchor="middle" fill="var(--s3)" font-weight="600">q<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text x="610" y="256" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">1 을 0 으로 고쳐 썼다</text><text x="610" y="276" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">헤드가 한 칸 오른쪽으로 갔다</text><text x="610" y="296" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">상태가 q<tspan baseline-shift="-22%" font-size="76%">1</tspan> 에서 q<tspan baseline-shift="-22%" font-size="76%">2</tspan> 로 바뀌었다</text><text x="610" y="322" text-anchor="start" fill="var(--ink2)" font-size="11">나머지 칸은 손대지 않는다</text><path d="M20 344 L880 344" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="364" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">이 걸음을 되풀이한다. 정지 상태에 닿으면 멈추고, 닿지 않으면 영원히 이어진다</text>
</svg>