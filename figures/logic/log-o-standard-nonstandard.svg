<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">표준 모형과 비표준 모형에서 괴델 문장의 값이 갈린다</title><desc id="d">위 수직선은 표준 모형이고 아래 수직선은 표준 부분 뒤에 비표준 덩어리가 붙은 모형이다. 괴델 문장은 위에서 참이고 아래에서 거짓이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="450" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">‘참인데 증명할 수 없다’ 의 참은 어느 모형에서의 참인가</text><rect x="20" y="46" width="860" height="148" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="450" y="66" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">표준 모형 ℕ — 우리가 뜻한 자연수</text><text x="450" y="83" text-anchor="middle" fill="var(--ink2)" font-size="11">0 에서 시작해 S 를 거듭 붙여 닿는 것만 있다</text><path d="M64 146 L700 146" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="146" r="5" fill="var(--s1)"/><text x="90" y="166" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">0</text><circle cx="170" cy="146" r="5" fill="var(--s1)"/><text x="170" y="166" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">1</text><circle cx="250" cy="146" r="5" fill="var(--s1)"/><text x="250" y="166" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">2</text><circle cx="330" cy="146" r="5" fill="var(--s1)"/><text x="330" y="166" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">3</text><circle cx="410" cy="146" r="5" fill="var(--s1)"/><text x="410" y="166" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">4</text><circle cx="490" cy="146" r="5" fill="var(--s1)"/><text x="490" y="166" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">5</text><text x="600" y="151" text-anchor="start" fill="var(--ink2)" font-weight="600">· · ·</text><text x="714" y="150" text-anchor="start" fill="var(--ink2)" font-size="11">끝이 없지만 빈틈이 없다</text><text x="90" y="128" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">G 는 여기서 참이다 — 이 줄의 어떤 점도 G 의 도출 번호가 아니다</text><rect x="20" y="208" width="860" height="172" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="450" y="228" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">비표준 모형 — T ⊬ G 이므로 완전성 정리가 존재를 보장한다</text><text x="450" y="245" text-anchor="middle" fill="var(--ink2)" font-size="11">T 의 공리를 모두 만족하지만 G 는 여기서 거짓이다</text><path d="M64 306 L420 306" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="306" r="5" fill="var(--s1)"/><text x="90" y="326" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">0</text><circle cx="166" cy="306" r="5" fill="var(--s1)"/><text x="166" y="326" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">1</text><circle cx="242" cy="306" r="5" fill="var(--s1)"/><text x="242" y="326" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">2</text><circle cx="318" cy="306" r="5" fill="var(--s1)"/><text x="318" y="326" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">3</text><circle cx="394" cy="306" r="5" fill="var(--s1)"/><text x="394" y="326" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">4</text><text x="432" y="311" text-anchor="start" fill="var(--ink2)" font-weight="600">· · ·</text><text x="90" y="282" text-anchor="start" fill="var(--s1)" font-size="11">표준 부분 — 여기까지는 ℕ 과 똑같다</text><rect x="516" y="278" width="344" height="56" rx="6" fill="var(--s2)" fill-opacity="0.13" stroke="var(--s2)" stroke-width="1.5"/><path d="M536 306 L844 306" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><circle cx="600" cy="306" r="5" fill="var(--s2)"/><text x="600" y="326" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">c−1</text><circle cx="690" cy="306" r="5" fill="var(--s2)"/><text x="690" y="326" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">c</text><circle cx="780" cy="306" r="5" fill="var(--s2)"/><text x="780" y="326" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">c+1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M470 306 L508 306"/><text x="489" y="332" text-anchor="middle" fill="var(--ink2)" font-size="11">틈</text><text x="688" y="358" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">비표준 원소 — 0 에서 S 를 유한 번 붙여서는 닿을 수 없다</text><text x="26" y="406" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">이 모형에서는 ∃y Prf(y, ⌜G⌝) 가 참이다 — 그 y 가 저 상자 안의 원소이기 때문이다.</text><text x="26" y="426" text-anchor="start" fill="var(--ink)" font-size="11">그 y 는 자연수가 아니므로 진짜 도출을 코딩하지 않는다. 종이에 적을 수 있는 G 의 도출은 여전히 하나도 없다.</text>
</svg>