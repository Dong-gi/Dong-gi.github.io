<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">전칭에는 함의를 존재에는 논리곱을 쓰는 이유</title><desc id="d">논의 영역 안에 F 원과 G 원을 그려 네 후보 식을 견주는 그림. 전칭에 논리곱을 쓰면 요구가 너무 세지고 존재에 함의를 쓰면 요구가 너무 약해진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="390" y="26" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">한정사는 논의 영역 전체를 훑는다 — 영역을 F 인 것으로 좁히는 일을 ∀ 는 → 로, ∃ 는 ∧ 로 한다</text><rect x="20" y="44" width="360" height="194" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="36" y="74" text-anchor="start" style="font-size:18px" fill="var(--ink)" font-weight="600">∀x(Fx → Gx)</text><rect x="275" y="56" width="86" height="24" rx="5" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.5"/><text x="318" y="71.96" text-anchor="middle" style="font-size:11px" fill="var(--ink)" font-weight="600">맞는 옮김</text><rect x="36" y="88" width="140" height="96" rx="5" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text x="42" y="102" text-anchor="start" style="font-size:11px" fill="var(--ink2)" font-weight="600">D</text><circle cx="112" cy="140" r="32" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.5"/><circle cx="104" cy="140" r="16" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="1.5"/><text x="104" y="144" text-anchor="middle" style="font-size:12px" fill="var(--s1)" font-weight="600">F</text><text x="132" y="121" text-anchor="middle" style="font-size:12px" fill="var(--s3)" font-weight="600">G</text><text x="196" y="138" text-anchor="start" style="font-size:14px" fill="var(--s3)" font-weight="600">모든 F 는 G 다</text><text x="36" y="206" text-anchor="start" style="font-size:11px" fill="var(--ink2)">F 원이 통째로 G 원 안에 들어가면 된다. F 가 아닌 것에 대해서는</text><text x="36" y="224" text-anchor="start" style="font-size:11px" fill="var(--ink2)">→ 의 전건이 거짓이라 이 식이 아무것도 요구하지 않는다</text><rect x="400" y="44" width="360" height="194" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="416" y="74" text-anchor="start" style="font-size:18px" fill="var(--ink)" font-weight="600">∀x(Fx ∧ Gx)</text><rect x="655" y="56" width="86" height="24" rx="5" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.5"/><text x="698" y="71.96" text-anchor="middle" style="font-size:11px" fill="var(--ink)" font-weight="600">틀린 옮김</text><rect x="416" y="88" width="140" height="96" rx="5" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text x="422" y="102" text-anchor="start" style="font-size:11px" fill="var(--ink2)" font-weight="600">D</text><circle cx="468" cy="140" r="28" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><circle cx="506" cy="140" r="28" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.5"/><text x="450" y="144" text-anchor="middle" style="font-size:12px" fill="var(--s1)" font-weight="600">F</text><text x="524" y="144" text-anchor="middle" style="font-size:12px" fill="var(--s3)" font-weight="600">G</text><circle cx="432.8" cy="168.64" r="4.5" fill="var(--s2)"/><text x="576" y="138" text-anchor="start" style="font-size:14px" fill="var(--s2)" font-weight="600">너무 세다</text><text x="416" y="206" text-anchor="start" style="font-size:11px" fill="var(--ink2)">영역 전체가 F 이면서 G 여야 한다. 점 하나만 있어도 무너진다.</text><text x="416" y="224" text-anchor="start" style="font-size:11px" fill="var(--ink2)">‘모든 것이 F 다’ 까지 말해 버리는 것이 잘못이다</text><rect x="20" y="262" width="360" height="194" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="36" y="292" text-anchor="start" style="font-size:18px" fill="var(--ink)" font-weight="600">∃x(Fx ∧ Gx)</text><rect x="275" y="274" width="86" height="24" rx="5" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.5"/><text x="318" y="289.96" text-anchor="middle" style="font-size:11px" fill="var(--ink)" font-weight="600">맞는 옮김</text><rect x="36" y="306" width="140" height="96" rx="5" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text x="42" y="320" text-anchor="start" style="font-size:11px" fill="var(--ink2)" font-weight="600">D</text><circle cx="88" cy="358" r="28" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><circle cx="126" cy="358" r="28" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.5"/><text x="70" y="362" text-anchor="middle" style="font-size:12px" fill="var(--s1)" font-weight="600">F</text><text x="144" y="362" text-anchor="middle" style="font-size:12px" fill="var(--s3)" font-weight="600">G</text><circle cx="106" cy="358.8" r="4.5" fill="var(--s3)"/><text x="196" y="356" text-anchor="start" style="font-size:14px" fill="var(--s3)" font-weight="600">어떤 F 는 G 다</text><text x="36" y="424" text-anchor="start" style="font-size:11px" fill="var(--ink2)">겹치는 자리에 초록 점 하나만 있으면 된다. ∧ 이 F 인 것과</text><text x="36" y="442" text-anchor="start" style="font-size:11px" fill="var(--ink2)">G 인 것을 한 대상에게 동시에 요구하기 때문이다</text><rect x="400" y="262" width="360" height="194" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="416" y="292" text-anchor="start" style="font-size:18px" fill="var(--ink)" font-weight="600">∃x(Fx → Gx)</text><rect x="655" y="274" width="86" height="24" rx="5" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.5"/><text x="698" y="289.96" text-anchor="middle" style="font-size:11px" fill="var(--ink)" font-weight="600">틀린 옮김</text><rect x="416" y="306" width="140" height="96" rx="5" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.3"/><text x="422" y="320" text-anchor="start" style="font-size:11px" fill="var(--ink2)" font-weight="600">D</text><circle cx="468" cy="358" r="28" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><circle cx="506" cy="358" r="28" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.5"/><text x="450" y="362" text-anchor="middle" style="font-size:12px" fill="var(--s1)" font-weight="600">F</text><text x="524" y="362" text-anchor="middle" style="font-size:12px" fill="var(--s3)" font-weight="600">G</text><circle cx="542" cy="386.64" r="4.5" fill="var(--s2)"/><text x="576" y="356" text-anchor="start" style="font-size:14px" fill="var(--s2)" font-weight="600">너무 약하다</text><text x="416" y="424" text-anchor="start" style="font-size:11px" fill="var(--ink2)">F 가 아닌 점 하나만 있어도 → 의 전건이 거짓이라 성립한다.</text><text x="416" y="442" text-anchor="start" style="font-size:11px" fill="var(--ink2)">F 와 G 에 대해 사실상 아무 말도 하지 않는 식이다</text><text x="24" y="472" text-anchor="start" style="font-size:11px" fill="var(--ink2)">읽어낼 것 — 점 하나가 무엇을 말하는지가 칸마다 다르다. 아래 왼쪽의 초록 점은 식을 성립시키는 증인이고, 오른쪽 두 칸의</text><text x="24" y="491" text-anchor="start" style="font-size:11px" fill="var(--ink2)">주황 점은 그 옮김이 틀렸다는 증거다. 정확한 진리조건은 10장에서 정의한다</text>
</svg>