<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">해석표에서 등호 칸만 잠겨 있다</title><desc id="d">왼쪽 표의 아래 한 줄은 모형이 채우지 못하고, 오른쪽 그림은 그때 강제되는 대각선을 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">해석 I 는 기호마다 D 안에서 무엇을 고를지 정한다 — 그런데 = 칸은 고를 수 없다</text><rect x="14" y="46" width="388" height="338" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="208" y="66" text-anchor="middle">해석표</text><text class="ink2 sm" x="208" y="83" text-anchor="middle">위 세 줄은 모형이 채우고 맨 아랫줄은 못 채운다</text><text x="40" y="104" text-anchor="start" fill="var(--ink2)" font-size="11">기호</text><text x="126" y="104" text-anchor="start" fill="var(--ink2)" font-size="11">해석 I 가 무엇을 주는가</text><path d="M30 114 L388 114" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="148" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">a</text><text x="126" y="140" text-anchor="start" fill="var(--ink2)" font-size="11">원소 하나를 받는다</text><text x="126" y="159" text-anchor="start" fill="var(--ink)" font-size="11">I(a) = 1</text><text x="40" y="202" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">F  (1항)</text><text x="126" y="194" text-anchor="start" fill="var(--ink2)" font-size="11">D 의 부분집합을 받는다</text><text x="126" y="213" text-anchor="start" fill="var(--ink)" font-size="11">I(F) = { 1, 2 }</text><text x="40" y="256" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">G  (2항)</text><text x="126" y="248" text-anchor="start" fill="var(--ink2)" font-size="11">D × D 의 부분집합을 받는다</text><text x="126" y="267" text-anchor="start" fill="var(--ink)" font-size="11">I(G) = { (1,3), (3,3) }</text><rect x="30" y="284" width="356" height="48" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.4"/><text x="40" y="310" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">=  (2항)</text><text x="126" y="302" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">고를 수 없다 — 모형이 무엇이든</text><text x="126" y="321" text-anchor="start" fill="var(--s2)" font-size="11">{ (1,1), (2,2), (3,3) }</text><rect x="418" y="46" width="368" height="338" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="602" y="66" text-anchor="middle">I(=) 가 강제되는 모양</text><text class="ink2 sm" x="602" y="83" text-anchor="middle">D = { 1, 2, 3 } 위의 화살표를 다 그려 보면</text><circle cx="498" cy="196" r="6" fill="var(--ink)"/><text class="ink bold sm" x="498" y="216" text-anchor="middle">1</text><circle cx="588" cy="196" r="6" fill="var(--ink)"/><text class="ink bold sm" x="588" y="216" text-anchor="middle">2</text><circle cx="678" cy="196" r="6" fill="var(--ink)"/><text class="ink bold sm" x="678" y="216" text-anchor="middle">3</text><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M490.2 182.25 C472 151.7 524 151.7 506.06 182.64"/><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M580.2 182.25 C562 151.7 614 151.7 596.06 182.64"/><path fill="none" stroke="var(--s2)" stroke-width="2" stroke-linecap="round" marker-end="url(#ar2)" d="M670.2 182.25 C652 151.7 704 151.7 686.06 182.64"/><path d="M506 226 L580 226" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M596 226 L670 226" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="588" y="256" text-anchor="middle" fill="var(--ink2)" font-size="11">서로 다른 두 점을 잇는 화살표는</text><text x="588" y="273" text-anchor="middle" fill="var(--ink2)" font-size="11">어느 모형에도 하나도 없다</text><text x="588" y="134" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">점마다 제자리로 오는 화살표 하나씩</text><text x="588" y="151" text-anchor="middle" fill="var(--s2)" font-size="11">— 이것을 대각선이라 한다</text><path d="M432 316 L772 316" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="588" y="340" text-anchor="middle" fill="var(--ink)" font-size="11">F 와 G 는 갈아끼워도 되지만 = 는 갈아끼울 수 없다.</text><text x="588" y="358" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">그것이 4장의 낱말로 논리 상항이라는 뜻이다</text>
</svg>