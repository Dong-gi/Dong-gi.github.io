<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 356" width="780" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">괄호가 없는 기호열이 두 개의 나무로 갈린다</title><desc id="d">P 논리곱 Q 논리합 R 이라는 기호열이 논리합을 뿌리로 하는 나무와 논리곱을 뿌리로 하는 나무 두 가지로 읽히는 그림. 묶는 순서만 다르고 잎의 순서는 같다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">같은 기호열에서 나무가 둘 나온다 — 정의가 이항 조항마다 괄호를 두르는 것이 이것을 막는다</text><text class="sm bold" fill="var(--s2)" x="390" y="52" text-anchor="middle">P ∧ Q ∨ R</text><rect x="20" y="66" width="366" height="208" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="203" y="86" text-anchor="middle">읽기 하나 — ((P ∧ Q) ∨ R)</text><text class="ink2 sm" x="203" y="102" text-anchor="middle">주연결자가 ∨ 이다</text><path d="M212 139 L140 163" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 139 L312 163" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 193 L94 217" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 193 L188 217" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="189" y="109" width="46" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="212" y="128" text-anchor="middle">∨</text><rect x="117" y="163" width="46" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold sm" x="140" y="182" text-anchor="middle">∧</text><rect x="289" y="163" width="46" height="30" rx="5" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="312" y="182" text-anchor="middle">R</text><rect x="71" y="217" width="46" height="30" rx="5" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="94" y="236" text-anchor="middle">P</text><rect x="165" y="217" width="46" height="30" rx="5" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="188" y="236" text-anchor="middle">Q</text><text class="sm bold" fill="var(--s1)" x="40" y="128" text-anchor="start">뿌리가 ∨</text><text class="sm bold" fill="var(--s1)" x="40" y="262" text-anchor="start">먼저 묶이는 것은 P 와 Q 다</text><rect x="400" y="66" width="360" height="208" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="580" y="86" text-anchor="middle">읽기 둘 — (P ∧ (Q ∨ R))</text><text class="ink2 sm" x="580" y="102" text-anchor="middle">주연결자가 ∧ 이다</text><path d="M568 139 L496 163" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M568 139 L656 163" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M656 193 L612 217" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M656 193 L704 217" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="545" y="109" width="46" height="30" rx="5" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="568" y="128" text-anchor="middle">∧</text><rect x="473" y="163" width="46" height="30" rx="5" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="496" y="182" text-anchor="middle">P</text><rect x="633" y="163" width="46" height="30" rx="5" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold sm" x="656" y="182" text-anchor="middle">∨</text><rect x="589" y="217" width="46" height="30" rx="5" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="612" y="236" text-anchor="middle">Q</text><rect x="681" y="217" width="46" height="30" rx="5" fill="var(--s3)" fill-opacity="0.14" stroke="var(--s3)" stroke-width="1.6"/><text class="ink bold sm" x="704" y="236" text-anchor="middle">R</text><text class="sm bold" fill="var(--s2)" x="418" y="128" text-anchor="start">뿌리가 ∧</text><text class="sm bold" fill="var(--s2)" x="418" y="262" text-anchor="start">먼저 묶이는 것은 Q 와 R 다</text><text class="ink2 sm" x="24" y="296" text-anchor="start">읽어낼 것 — 두 나무는 마디의 개수도 잎의 순서도 같고 오직 묶는 순서만 다르다. 그런데 묶는 순서가 그 식이 무엇인지를 정한다.</text><text class="ink2 sm" x="24" y="316" text-anchor="start">정의를 따르면 두 식은 처음부터 서로 다른 기호열이다. ‘P ∧ Q ∨ R’ 은 정의에 따른 적형식이 아니라 괄호를 지운 줄임말이고,</text><text class="ink2 sm" x="24" y="336" text-anchor="start">어느 쪽 줄임말인지는 우선순위 관습이 정한다. 두 식의 뜻이 실제로 다른지는 6장에서 확인한다 — 이 장은 모양만 본다</text>
</svg>