<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 396" width="860" height="396" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">전칭 일반화가 이름 하나 때문에 막히는 자리</title><desc id="d">전제에 든 이름 a 를 그대로 일반화한 틀린 도출과 새 이름 c 를 만들어 쓴 옳은 도출을 나란히 놓아 변수 조건이 무엇을 확인하는지 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="30" width="404" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="216" y="51" text-anchor="middle">틀린 도출 — 전제에 이미 든 이름 a 를 일반화한다</text><text x="58" y="90" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="70" y="90" text-anchor="start" fill="var(--ink)">Fa</text><text x="256" y="90" text-anchor="start" fill="var(--ink2)" font-size="11">전제</text><text x="58" y="120" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="70" y="120" text-anchor="start" fill="var(--ink)">∀x Fx</text><text x="256" y="120" text-anchor="start" fill="var(--ink2)" font-size="11">1 ∀I</text><rect x="232" y="100" width="74" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="2"/><text x="40" y="170" text-anchor="start" fill="var(--ink)" font-size="11">2 번 줄이 기대고 있는 열린 가정은 1 번 줄 Fa 다.</text><text x="40" y="190" text-anchor="start" fill="var(--ink2)" font-size="11">그 안에 a 가 들어 있다. a 는 아무 대상이 아니라</text><text x="40" y="210" text-anchor="start" fill="var(--ink2)" font-size="11">전제가 특별히 지목한 대상이므로 일반화할 수 없다.</text><text x="40" y="238" text-anchor="start" fill="var(--s2)" font-size="11">D = {1, 2}, I(a) = 1, I(F) = {1} 에서 Fa 는 참</text><text x="40" y="256" text-anchor="start" fill="var(--s2)" font-size="11">이고 ∀x Fx 는 거짓이다 — 거짓을 증명한 셈이다</text><rect x="438" y="30" width="404" height="244" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="640" y="51" text-anchor="middle">옳은 도출 — 새 이름 c 를 만들어 쓴다</text><text x="482" y="90" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="494" y="90" text-anchor="start" fill="var(--ink)">∀x (Fx ∧ Gx)</text><text x="680" y="90" text-anchor="start" fill="var(--ink2)" font-size="11">전제</text><text x="482" y="120" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="494" y="120" text-anchor="start" fill="var(--ink)">Fc ∧ Gc</text><text x="680" y="120" text-anchor="start" fill="var(--ink2)" font-size="11">1 ∀E</text><text x="482" y="150" text-anchor="end" fill="var(--ink2)" font-size="11">3</text><text x="494" y="150" text-anchor="start" fill="var(--ink)">Fc</text><text x="680" y="150" text-anchor="start" fill="var(--ink2)" font-size="11">2 ∧E</text><text x="482" y="180" text-anchor="end" fill="var(--ink2)" font-size="11">4</text><text x="494" y="180" text-anchor="start" fill="var(--ink)">∀x Fx</text><text x="680" y="180" text-anchor="start" fill="var(--ink2)" font-size="11">3 ∀I</text><rect x="656" y="160" width="74" height="26" rx="4" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="2"/><text x="464" y="236" text-anchor="start" fill="var(--ink)" font-size="11">열린 가정은 1 번 줄뿐이고 거기에 c 가 없다.</text><text x="464" y="256" text-anchor="start" fill="var(--ink2)" font-size="11">c 에 대해 우리가 따로 아는 것이 하나도 없으므로 통과다.</text><path d="M40 300 L820 300" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="328" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">두 도출의 차이는 이름 하나다 — a 는 전제가 이미 지목한 이름이고 c 는 우리가 방금 만든 이름이다</text><text x="430" y="352" text-anchor="middle" fill="var(--ink2)" font-size="11">∀I 가 요구하는 것은 그 줄의 이름이 아무 대상을 가리켜도 상관없어야 한다는 것이고,</text><text x="430" y="372" text-anchor="middle" fill="var(--ink2)" font-size="11">그것을 문법으로 확인하는 방법이 ‘열린 가정 목록에 그 이름이 없는가’ 하나다</text>
</svg>