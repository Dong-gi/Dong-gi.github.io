<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 348" width="780" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">같은 논증을 명제논리와 술어논리로 옮긴 것의 비교</title><desc id="d">왼쪽은 세 문장을 서로 무관한 문장문자 P Q R 로 옮겨 아무 연결이 없고, 오른쪽은 술어와 이름으로 갈라 F 와 G 와 a 가 여러 문장에 되풀이되는 것이 드러난다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="390" y="26" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">같은 논증을 두 언어로 옮긴 것 — 오른쪽에서만 낱말의 되풀이가 보인다</text><rect x="20" y="42" width="358" height="212" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="199" y="62" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">명제논리로 옮기면</text><text x="199" y="79" text-anchor="middle" style="font-size:11px" fill="var(--ink2)">원자는 더 쪼개지지 않는다</text><text x="38" y="116" text-anchor="start" style="font-size:12px" fill="var(--ink2)">모든 사람은 죽는다</text><rect x="212" y="97" width="40" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text x="232" y="117.76" text-anchor="middle" style="font-size:16px" fill="var(--ink)" font-weight="600">P</text><text x="262" y="116" text-anchor="start" style="font-size:11px" fill="var(--ink2)">전제</text><text x="38" y="158" text-anchor="start" style="font-size:12px" fill="var(--ink2)">소크라테스는 사람이다</text><rect x="212" y="139" width="40" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text x="232" y="159.76" text-anchor="middle" style="font-size:16px" fill="var(--ink)" font-weight="600">Q</text><text x="262" y="158" text-anchor="start" style="font-size:11px" fill="var(--ink2)">전제</text><text x="38" y="200" text-anchor="start" style="font-size:12px" fill="var(--ink2)">소크라테스는 죽는다</text><rect x="212" y="181" width="40" height="30" rx="5" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.5"/><text x="232" y="201.76" text-anchor="middle" style="font-size:16px" fill="var(--ink)" font-weight="600">R</text><text x="262" y="200" text-anchor="start" style="font-size:11px" fill="var(--ink2)">결론</text><text x="38" y="238" text-anchor="start" style="font-size:12px" fill="var(--s2)" font-weight="600">세 상자 사이에 아무 연결이 없다</text><rect x="398" y="42" width="362" height="212" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="579" y="62" text-anchor="middle" style="font-size:13px" fill="var(--ink)" font-weight="600">술어논리로 옮기면</text><text x="579" y="79" text-anchor="middle" style="font-size:11px" fill="var(--ink2)">원자 안이 술어와 이름으로 갈린다</text><text x="420" y="118" text-anchor="start" style="font-size:18px" fill="var(--ink)" font-weight="600">∀x(Fx → Gx)</text><text x="700" y="116" text-anchor="start" style="font-size:11px" fill="var(--ink2)">전제</text><text x="420" y="160" text-anchor="start" style="font-size:18px" fill="var(--ink)" font-weight="600">Fa</text><text x="700" y="158" text-anchor="start" style="font-size:11px" fill="var(--ink2)">전제</text><text x="420" y="202" text-anchor="start" style="font-size:18px" fill="var(--ink)" font-weight="600">Ga</text><text x="700" y="200" text-anchor="start" style="font-size:11px" fill="var(--ink2)">결론</text><path d="M436 124 L436 148 L426 148" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M482 124 L500 124 L500 190 L428 190" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M440 162 L560 162 L560 196 L442 196" fill="none" stroke="var(--s3)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="578" y="128" text-anchor="start" style="font-size:11px" fill="var(--s1)" font-weight="600">F 가 두 곳에</text><text x="578" y="148" text-anchor="start" style="font-size:11px" fill="var(--s2)" font-weight="600">G 가 두 곳에</text><text x="578" y="168" text-anchor="start" style="font-size:11px" fill="var(--s3)" font-weight="600">a 가 두 곳에</text><text x="420" y="238" text-anchor="start" style="font-size:12px" fill="var(--s3)" font-weight="600">되풀이가 논증을 떠받친다</text><text x="24" y="278" text-anchor="start" style="font-size:11px" fill="var(--ink2)">읽어낼 것 — 왼쪽 세 상자는 서로 아무 관계가 없는 별개의 문자다. 그래서 앞의 둘이 참이면서 셋째가 거짓인 배당이 있고,</text><text x="24" y="297" text-anchor="start" style="font-size:11px" fill="var(--ink2)">6장의 뜻으로 [P, Q ∴ R] 은 부당한 형식이다. 그런데 원래 논증은 타당하다. 명제논리가 틀린 것이 아니라 논증을 떠받치는</text><text x="24" y="316" text-anchor="start" style="font-size:11px" fill="var(--ink2)">것이 원자 안에 있어 보이지 않는 것이다. 오른쪽은 그 안을 열어 술어 F · G 와 이름 a 로 갈랐고, 그러자 되풀이가 드러난다.</text><text x="24" y="335" text-anchor="start" style="font-size:11px" fill="var(--ink2)">이 장이 하는 일은 오른쪽 기호열들이 무엇인지를 모양만으로 정하는 것이다 — 타당성 자체는 10장과 11장의 몫이다</text>
</svg>