<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 376" width="780" height="376" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">진리값 배당은 문장문자에서 진리값으로 가는 함수다</title><desc id="d">왼쪽은 문장문자 P Q R 에서 T 와 F 로 화살표가 하나씩 나가는 함수 그림, 오른쪽은 그 함수 여덟 개를 줄로 늘어놓은 진리표</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="390" y="26" text-anchor="middle">배당은 문장문자마다 T 나 F 를 하나씩 골라 주는 함수다</text><rect x="14" y="44" width="350" height="300" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="189" y="64" text-anchor="middle">함수로 본 배당 v</text><text class="ink2 sm" x="189" y="81" text-anchor="middle">정의역은 문장문자, 공역은 { T, F }</text><ellipse cx="104" cy="212" rx="54" ry="78" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink2 sm" x="104" y="124" text-anchor="middle">문장문자</text><circle cx="104" cy="172" r="4" fill="var(--s1)"/><text class="ink" x="88" y="177" text-anchor="end">P</text><circle cx="104" cy="212" r="4" fill="var(--s1)"/><text class="ink" x="88" y="217" text-anchor="end">Q</text><circle cx="104" cy="252" r="4" fill="var(--s1)"/><text class="ink" x="88" y="257" text-anchor="end">R</text><ellipse cx="288" cy="212" rx="44" ry="64" fill="none" stroke="var(--grid)" stroke-width="1.4"/><text class="ink2 sm" x="288" y="136" text-anchor="middle">{ T, F }</text><circle cx="288" cy="190" r="4" fill="var(--ink2)"/><text class="ink bold" x="302" y="195" text-anchor="start">T</text><circle cx="288" cy="240" r="4" fill="var(--ink2)"/><text class="ink bold" x="302" y="245" text-anchor="start">F</text><path fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M160 172 L280 188"/><path fill="none" stroke="var(--s2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M160 212 L280 237"/><path fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M160 252 L280 195"/><text class="ink2 sm" x="189" y="314" text-anchor="middle">v(P) = T,  v(Q) = F,  v(R) = T</text><text class="ink2 sm" x="189" y="332" text-anchor="middle">문자마다 화살표가 정확히 하나씩 나간다</text><rect x="380" y="44" width="386" height="300" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="573" y="64" text-anchor="middle">진리표의 한 줄 = 배당 하나</text><text class="ink2 sm" x="573" y="81" text-anchor="middle">문장문자가 셋이면 배당은 모두 여덟 개</text><text class="ink2 sm" x="456" y="108" text-anchor="end">이름</text><text class="ink bold sm" x="491" y="108" text-anchor="middle">P</text><text class="ink bold sm" x="537" y="108" text-anchor="middle">Q</text><text class="ink bold sm" x="583" y="108" text-anchor="middle">R</text><text class="ink2 sm" x="456" y="132.5" text-anchor="end">v<tspan baseline-shift="-22%" font-size="76%">0</tspan></text><rect x="471" y="118" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="491" y="132.5" text-anchor="middle">T</text><rect x="517" y="118" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="537" y="132.5" text-anchor="middle">T</text><rect x="563" y="118" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="583" y="132.5" text-anchor="middle">T</text><text class="ink2 sm" x="456" y="157.5" text-anchor="end">v<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><rect x="471" y="143" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="491" y="157.5" text-anchor="middle">T</text><rect x="517" y="143" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="537" y="157.5" text-anchor="middle">T</text><rect x="563" y="143" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="583" y="157.5" text-anchor="middle">F</text><text class="ink2 sm" x="456" y="182.5" text-anchor="end">v<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><rect x="471" y="168" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="2.2"/><text class="ink sm" x="491" y="182.5" text-anchor="middle">T</text><rect x="517" y="168" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="2.2"/><text class="ink sm" x="537" y="182.5" text-anchor="middle">F</text><rect x="563" y="168" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="2.2"/><text class="ink sm" x="583" y="182.5" text-anchor="middle">T</text><text class="ink2 sm" x="456" y="207.5" text-anchor="end">v<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><rect x="471" y="193" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="491" y="207.5" text-anchor="middle">T</text><rect x="517" y="193" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="537" y="207.5" text-anchor="middle">F</text><rect x="563" y="193" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="583" y="207.5" text-anchor="middle">F</text><text class="ink2 sm" x="456" y="232.5" text-anchor="end">v<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><rect x="471" y="218" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="491" y="232.5" text-anchor="middle">F</text><rect x="517" y="218" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="537" y="232.5" text-anchor="middle">T</text><rect x="563" y="218" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="583" y="232.5" text-anchor="middle">T</text><text class="ink2 sm" x="456" y="257.5" text-anchor="end">v<tspan baseline-shift="-22%" font-size="76%">5</tspan></text><rect x="471" y="243" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="491" y="257.5" text-anchor="middle">F</text><rect x="517" y="243" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="537" y="257.5" text-anchor="middle">T</text><rect x="563" y="243" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="583" y="257.5" text-anchor="middle">F</text><text class="ink2 sm" x="456" y="282.5" text-anchor="end">v<tspan baseline-shift="-22%" font-size="76%">6</tspan></text><rect x="471" y="268" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="491" y="282.5" text-anchor="middle">F</text><rect x="517" y="268" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="537" y="282.5" text-anchor="middle">F</text><rect x="563" y="268" width="40" height="21" rx="2" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1"/><text class="ink sm" x="583" y="282.5" text-anchor="middle">T</text><text class="ink2 sm" x="456" y="307.5" text-anchor="end">v<tspan baseline-shift="-22%" font-size="76%">7</tspan></text><rect x="471" y="293" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="491" y="307.5" text-anchor="middle">F</text><rect x="517" y="293" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="537" y="307.5" text-anchor="middle">F</text><rect x="563" y="293" width="40" height="21" rx="2" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1"/><text class="ink sm" x="583" y="307.5" text-anchor="middle">F</text><rect x="466" y="166" width="142" height="25" rx="3" fill="none" fill-opacity="1" stroke="var(--ink)" stroke-width="1.8"/><text class="ink sm" x="618" y="182.5" text-anchor="start">이 줄이 왼쪽 그림이다</text><text class="ink2 sm" x="573" y="330" text-anchor="middle">여덟 줄은 서로 다른 여덟 개의 함수다</text><text class="ink2 sm" x="390" y="364" text-anchor="middle">문장문자가 n 개면 배당은 2ⁿ 개. 진리표를 다 채운다는 것은 그 2ⁿ 개 함수를 빠짐없이 훑는다는 뜻이다</text>
</svg>