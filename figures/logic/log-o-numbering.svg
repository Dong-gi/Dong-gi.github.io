<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">괴델 수 매기기를 실제로 한 번 해 본다</title><desc id="d">기호열 0 = 0 에 기호 코드를 붙이고 자리마다 소수의 거듭제곱으로 묶어 196830 을 얻는다. 유일 인수분해가 이 대응을 되돌린다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="450" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">문장 하나에 번호를 붙여 본다 — 그리고 그 번호에서 문장을 되찾는다</text><text x="26" y="79" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">① 기호열</text><rect x="200" y="58" width="60" height="30" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text x="230" y="79" text-anchor="middle" fill="var(--s1)" font-size="16" font-weight="600">0</text><rect x="300" y="58" width="60" height="30" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text x="330" y="79" text-anchor="middle" fill="var(--s1)" font-size="16" font-weight="600">=</text><rect x="400" y="58" width="60" height="30" rx="4" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.5"/><text x="430" y="79" text-anchor="middle" fill="var(--s1)" font-size="16" font-weight="600">0</text><text x="505" y="79" text-anchor="start" fill="var(--ink2)" font-size="11">— 산술의 언어로 적은 문장 0 = 0</text><text x="26" y="148" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">② 기호 코드</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M230 92 L230 118"/><text x="230" y="148" text-anchor="middle" fill="var(--ink)" font-weight="600">1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M330 92 L330 118"/><text x="330" y="148" text-anchor="middle" fill="var(--ink)" font-weight="600">9</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M430 92 L430 118"/><text x="430" y="148" text-anchor="middle" fill="var(--ink)" font-weight="600">1</text><text x="505" y="148" text-anchor="start" fill="var(--ink2)" font-size="11">— 기호마다 홀수 하나를 미리 정해 둔다</text><text x="26" y="218" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">③ 거듭제곱</text><text x="330" y="196" text-anchor="middle" fill="var(--ink2)" font-size="11">자리 1 · 2 · 3 에 소수 2 · 3 · 5</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M230 160 L230 178"/><text x="230" y="224" text-anchor="middle" fill="var(--s2)" font-size="16" font-weight="600">2¹</text><text x="230" y="242" text-anchor="middle" fill="var(--ink2)" font-size="11">= 2</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M330 160 L330 178"/><text x="330" y="224" text-anchor="middle" fill="var(--s2)" font-size="16" font-weight="600">3⁹</text><text x="330" y="242" text-anchor="middle" fill="var(--ink2)" font-size="11">= 19683</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M430 160 L430 178"/><text x="430" y="224" text-anchor="middle" fill="var(--s2)" font-size="16" font-weight="600">5¹</text><text x="430" y="242" text-anchor="middle" fill="var(--ink2)" font-size="11">= 5</text><text x="505" y="224" text-anchor="start" fill="var(--ink2)" font-size="11">— 자리 번호는 소수의 순서로, 코드는 지수로</text><text x="26" y="297" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">④ 곱한다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ark)" d="M330 254 L330 274"/><rect x="180" y="272" width="340" height="38" rx="5" fill="var(--s2)" fill-opacity="0.13" stroke="var(--s2)" stroke-width="1.5"/><text x="350" y="297" text-anchor="middle" fill="var(--s2)" font-size="16" font-weight="600">2¹ · 3⁹ · 5¹  =  196830</text><text x="540" y="297" text-anchor="start" fill="var(--ink2)" font-size="11">— 이것이 괴델 수다</text><path d="M180 291 L152 291 L152 79 L188 79" fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M188 79 L196 79"/><text x="144" y="168" text-anchor="end" fill="var(--s3)" font-size="11" font-weight="600">되돌리기</text><text x="144" y="185" text-anchor="end" fill="var(--s3)" font-size="11">유일 인수분해</text><path d="M26 334 L874 334" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="358" text-anchor="start" fill="var(--ink)" font-size="11">196830 을 소인수로 쪼개는 길은 2¹ · 3⁹ · 5¹ 말고 없다. 그래서 번호에서 기호열이 하나로 정해진다 —</text><text x="26" y="376" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">5장의 유일 가독성이 문법에서 한 일을, 유일 인수분해가 번호에서 한다.</text><text x="26" y="402" text-anchor="start" fill="var(--ink2)" font-size="11">수가 커지는 것은 문제가 아니다. 우리는 이 수를 계산할 일이 없다. 필요한 것은 대응이 서로 다른 기호열에 서로 다른 수를 주고,</text><text x="26" y="420" text-anchor="start" fill="var(--ink2)" font-size="11">기계가 양쪽으로 오갈 수 있다는 사실뿐이다.</text>
</svg>