<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="720" height="292" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">문장을 조각내어 논리 상항과 원자로 가른다</title><desc id="d">‘비가 오지 않으면 길이 마르거나 바람이 분다’ 를 여섯 조각으로 잘라 셋은 기호로, 셋은 원자 글자로 바꾸는 그림</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="360" y="28" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="600">한국어에서는 논리 상항이 따로 선 낱말이 아니라 어미로 붙어 있다</text><rect x="104" y="48" width="82" height="37" rx="4" fill="var(--s1)" fill-opacity="0.06" stroke="var(--s1)" stroke-width="1.4"/><text x="145" y="72" text-anchor="middle" fill="var(--ink)" font-size="13">비가 오</text><text x="145" y="102" text-anchor="middle" fill="var(--s1)" font-size="11">원자가 될 조각</text><path d="M145 110 L145 136" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)"/><text x="145" y="160" text-anchor="middle" fill="var(--s1)" font-size="21" font-weight="600">P</text><rect x="196" y="48" width="67" height="37" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="2.2"/><text x="229.5" y="72" text-anchor="middle" fill="var(--ink)" font-size="13">지 않</text><text x="229.5" y="102" text-anchor="middle" fill="var(--s2)" font-size="11">논리 상항</text><path d="M229.5 110 L229.5 136" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)"/><text x="229.5" y="160" text-anchor="middle" fill="var(--s2)" font-size="21" font-weight="600">¬</text><rect x="273" y="48" width="52" height="37" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="2.2"/><text x="299" y="72" text-anchor="middle" fill="var(--ink)" font-size="13">으면</text><text x="299" y="102" text-anchor="middle" fill="var(--s2)" font-size="11">논리 상항</text><path d="M299 110 L299 136" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)"/><text x="299" y="160" text-anchor="middle" fill="var(--s2)" font-size="21" font-weight="600">→</text><rect x="335" y="48" width="97" height="37" rx="4" fill="var(--s1)" fill-opacity="0.06" stroke="var(--s1)" stroke-width="1.4"/><text x="383.5" y="72" text-anchor="middle" fill="var(--ink)" font-size="13">길이 마르</text><text x="383.5" y="102" text-anchor="middle" fill="var(--s1)" font-size="11">원자가 될 조각</text><path d="M383.5 110 L383.5 136" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)"/><text x="383.5" y="160" text-anchor="middle" fill="var(--s1)" font-size="21" font-weight="600">Q</text><rect x="442" y="48" width="52" height="37" rx="4" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="2.2"/><text x="468" y="72" text-anchor="middle" fill="var(--ink)" font-size="13">거나</text><text x="468" y="102" text-anchor="middle" fill="var(--s2)" font-size="11">논리 상항</text><path d="M468 110 L468 136" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar2)"/><text x="468" y="160" text-anchor="middle" fill="var(--s2)" font-size="21" font-weight="600">∨</text><rect x="504" y="48" width="112" height="37" rx="4" fill="var(--s1)" fill-opacity="0.06" stroke="var(--s1)" stroke-width="1.4"/><text x="560" y="72" text-anchor="middle" fill="var(--ink)" font-size="13">바람이 분다</text><text x="560" y="102" text-anchor="middle" fill="var(--s1)" font-size="11">원자가 될 조각</text><path d="M560 110 L560 136" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar1)"/><text x="560" y="160" text-anchor="middle" fill="var(--s1)" font-size="21" font-weight="600">R</text><path d="M40 182 L680 182" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="204" text-anchor="middle" fill="var(--ink2)" font-size="12">낱말 차례대로 읽으면 P ¬ → Q ∨ R 이다. 기호로 적으려면 차례를 다시 잡아야 한다</text><text x="360" y="240" text-anchor="middle" fill="var(--ink)" font-size="23" font-weight="600">¬P → (Q ∨ R)</text><text x="360" y="268" text-anchor="middle" fill="var(--ink2)" font-size="12">괄호는 원문에 없다. 옮기는 사람이 넣는 것이다</text>
</svg>