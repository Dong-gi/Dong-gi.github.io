<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">한정사 둘이 같은 점을 두 번 집는다</title><desc id="d">점이 하나뿐인 모형에서 두 존재 한정사가 같은 원소를 골라 식이 참이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="400" y="26" text-anchor="middle">왜 ∃x ∃y (Fx ∧ Fy) 가 ‘F 인 것이 둘 있다’ 를 말하지 못하는가</text><rect x="14" y="46" width="380" height="232" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="204" y="66" text-anchor="middle">점이 하나뿐인 모형</text><text class="ink2 sm" x="204" y="83" text-anchor="middle">D = { 1 },  I(F) = { 1 }</text><rect x="96" y="118" width="216" height="116" rx="10" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.4" stroke-dasharray="6 4"/><text x="302" y="224" text-anchor="end" fill="var(--ink2)" font-size="11">D</text><ellipse cx="204" cy="168" rx="62" ry="34" fill="var(--s1)" fill-opacity="0.14" stroke="var(--s1)" stroke-width="1.6"/><text x="204" y="130" text-anchor="middle" fill="var(--s1)" font-size="11" font-weight="600">I(F)</text><circle cx="204" cy="168" r="6" fill="var(--ink)"/><text class="ink bold sm" x="204" y="188" text-anchor="middle">1</text><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M116 110 L190 156"/><path fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar3)" d="M296 110 L220 156"/><text x="112" y="102" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">x 가 집는 것</text><text x="300" y="102" text-anchor="middle" fill="var(--s3)" font-size="11" font-weight="600">y 가 집는 것</text><rect x="406" y="46" width="380" height="232" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="596" y="66" text-anchor="middle">10장의 조항이 무엇을 요구하는가</text><text class="ink2 sm" x="596" y="83" text-anchor="middle">갈아 끼우는 원소 둘이 달라야 한다는 말이 없다</text><text x="426" y="116" text-anchor="start" fill="var(--ink2)" font-size="11">∃x 조항 — 어떤 d ∈ D 가 있어</text><text x="426" y="142" text-anchor="start" fill="var(--ink2)" font-size="11">∃y 조항 — 어떤 e ∈ D 가 있어</text><text x="426" y="168" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">d = 1, e = 1 로 잡아도 된다</text><text x="426" y="194" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">그러면 F1 ∧ F1 이고 참이다</text><rect x="420" y="210" width="352" height="48" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text x="596" y="231" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">F 인 것이 하나뿐인 모형에서 참이 되었다</text><text x="596" y="248" text-anchor="middle" fill="var(--ink2)" font-size="11">그러니 이 식은 ‘둘’ 을 말하지 않는다</text><rect x="14" y="294" width="772" height="52" rx="6" fill="none" fill-opacity="1" stroke="var(--s3)" stroke-width="1.5"/><text x="400" y="316" text-anchor="middle" fill="var(--ink)" font-weight="600">∃x ∃y (Fx ∧ Fy ∧ x ≠ y) — 마지막 덩어리 하나가 d = e 를 막는다</text><text x="400" y="336" text-anchor="middle" fill="var(--ink2)" font-size="11">한정사를 몇 개 더 붙여도 이 일은 못 한다. 두 자리가 다르다는 말은 = 만 할 수 있다</text>
</svg>