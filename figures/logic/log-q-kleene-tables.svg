<text x="450" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">클레이니의 세 값 — 미정 자리에 T 를 넣든 F 를 넣든 결과가 같으면 그 값을 쓴다</text><text x="144" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">φ ∧ ψ</text><text x="81" y="96" text-anchor="start" fill="var(--ink)"></text><text x="123" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">T</text><text x="165" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">U</text><text x="207" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">F</text><text x="81" y="126" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">T</text><rect x="102" y="110" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="123" y="130" text-anchor="middle" fill="var(--ink)">T</text><rect x="144" y="110" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="165" y="130" text-anchor="middle" fill="var(--ink2)">U</text><rect x="186" y="110" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="207" y="130" text-anchor="middle" fill="var(--ink)">F</text><text x="81" y="156" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">U</text><rect x="102" y="140" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="123" y="160" text-anchor="middle" fill="var(--ink2)">U</text><rect x="144" y="140" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="165" y="160" text-anchor="middle" fill="var(--ink2)">U</text><rect x="186" y="140" width="42" height="30" rx="2" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text x="207" y="160" text-anchor="middle" fill="var(--s2)" font-weight="600">F</text><text x="81" y="186" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">F</text><rect x="102" y="170" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="123" y="190" text-anchor="middle" fill="var(--ink)">F</text><rect x="144" y="170" width="42" height="30" rx="2" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text x="165" y="190" text-anchor="middle" fill="var(--s2)" font-weight="600">F</text><rect x="186" y="170" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="207" y="190" text-anchor="middle" fill="var(--ink)">F</text><text x="352" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">φ ∨ ψ</text><text x="289" y="96" text-anchor="start" fill="var(--ink)"></text><text x="331" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">T</text><text x="373" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">U</text><text x="415" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">F</text><text x="289" y="126" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">T</text><rect x="310" y="110" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="331" y="130" text-anchor="middle" fill="var(--ink)">T</text><rect x="352" y="110" width="42" height="30" rx="2" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text x="373" y="130" text-anchor="middle" fill="var(--s2)" font-weight="600">T</text><rect x="394" y="110" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="415" y="130" text-anchor="middle" fill="var(--ink)">T</text><text x="289" y="156" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">U</text><rect x="310" y="140" width="42" height="30" rx="2" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text x="331" y="160" text-anchor="middle" fill="var(--s2)" font-weight="600">T</text><rect x="352" y="140" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="373" y="160" text-anchor="middle" fill="var(--ink2)">U</text><rect x="394" y="140" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="415" y="160" text-anchor="middle" fill="var(--ink2)">U</text><text x="289" y="186" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">F</text><rect x="310" y="170" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="331" y="190" text-anchor="middle" fill="var(--ink)">T</text><rect x="352" y="170" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="373" y="190" text-anchor="middle" fill="var(--ink2)">U</text><rect x="394" y="170" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="415" y="190" text-anchor="middle" fill="var(--ink)">F</text><text x="560" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">φ → ψ</text><text x="497" y="96" text-anchor="start" fill="var(--ink)"></text><text x="539" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">T</text><text x="581" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">U</text><text x="623" y="96" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">F</text><text x="497" y="126" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">T</text><rect x="518" y="110" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="539" y="130" text-anchor="middle" fill="var(--ink)">T</text><rect x="560" y="110" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="581" y="130" text-anchor="middle" fill="var(--ink2)">U</text><rect x="602" y="110" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="623" y="130" text-anchor="middle" fill="var(--ink)">F</text><text x="497" y="156" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">U</text><rect x="518" y="140" width="42" height="30" rx="2" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text x="539" y="160" text-anchor="middle" fill="var(--s2)" font-weight="600">T</text><rect x="560" y="140" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="581" y="160" text-anchor="middle" fill="var(--ink2)">U</text><rect x="602" y="140" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="623" y="160" text-anchor="middle" fill="var(--ink2)">U</text><text x="497" y="186" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">F</text><rect x="518" y="170" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="539" y="190" text-anchor="middle" fill="var(--ink)">T</text><rect x="560" y="170" width="42" height="30" rx="2" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="1.6"/><text x="581" y="190" text-anchor="middle" fill="var(--s2)" font-weight="600">T</text><rect x="602" y="170" width="42" height="30" rx="2" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text x="623" y="190" text-anchor="middle" fill="var(--ink)">T</text><text x="760" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">¬φ</text><text x="736" y="130" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">T</text><rect x="756" y="110" width="42" height="30" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="777" y="130" text-anchor="middle" fill="var(--ink)">F</text><text x="736" y="160" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">U</text><rect x="756" y="140" width="42" height="30" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="777" y="160" text-anchor="middle" fill="var(--ink2)">U</text><text x="736" y="190" text-anchor="middle" fill="var(--ink2)" font-size="11" font-weight="600">F</text><rect x="756" y="170" width="42" height="30" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="777" y="190" text-anchor="middle" fill="var(--ink)">T</text><rect x="60" y="220" width="780" height="60" rx="5" fill="var(--s2)" fill-opacity="0.08" stroke="var(--s2)" stroke-width="1.4"/><text x="76" y="243" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">색이 든 칸 — 입력에 U 가 있는데도 값이 정해진 자리다.</text><text x="76" y="263" text-anchor="start" fill="var(--ink2)" font-size="11">F ∧ U = F 인 것은 F 한쪽이 이미 결과를 정해 버렸기 때문이고, T ∨ U = T 도 같은 까닭이다. 프로그램의 단축 평가와 같다.</text><rect x="60" y="296" width="380" height="108" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="76" y="320" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">배중률에 U 를 넣어 본다</text><text x="76" y="344" text-anchor="start" fill="var(--ink2)" font-size="11">P = U 이면 ¬P = U 이고 U ∨ U = U 다.</text><text x="76" y="364" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">지정값은 T 하나뿐이므로 P ∨ ¬P 는 항진명제가 아니다.</text><text x="76" y="388" text-anchor="start" fill="var(--ink2)" font-size="11">첫 절이 예고한 ‘세 번째 경우’ 가 정확히 이 줄이다.</text><rect x="460" y="296" width="380" height="108" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="476" y="320" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">항진명제가 하나도 없다</text><text x="476" y="344" text-anchor="start" fill="var(--ink2)" font-size="11">문장문자에 전부 U 를 주면 표 어디를 지나도 U 가 나온다.</text><text x="476" y="364" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">그러므로 문장문자와 연결자만으로 만든 식은 모두 U 를 받는다.</text><text x="476" y="388" text-anchor="start" fill="var(--ink2)" font-size="11">값어치 있는 것은 정리 목록이 아니라 타당한 논증의 목록이다.</text>
</svg>