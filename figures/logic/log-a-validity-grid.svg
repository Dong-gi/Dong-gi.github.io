<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 352" width="782" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">전제와 결론의 실제 참·거짓 네 조합</title><desc id="d">타당성이 금지하는 조합은 전제가 모두 참인데 결론이 거짓인 한 칸뿐이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text class="ink bold" x="40" y="26" text-anchor="start">전제와 결론의 실제 참·거짓 — 네 조합</text><rect x="40" y="44" width="190" height="34" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="50" y="66" text-anchor="start">전제의 실제 참·거짓</text><rect x="230" y="44" width="130" height="34" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="240" y="66" text-anchor="start">결론의 실제 참·거짓</text><rect x="360" y="44" width="382" height="34" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold sm" x="370" y="66" text-anchor="start">타당한 논증에서 일어날 수 있나</text><rect x="40" y="78" width="190" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="50" y="104" text-anchor="start">모두 참</text><rect x="230" y="78" width="130" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="240" y="104" text-anchor="start">참</text><rect x="360" y="78" width="382" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="370" y="104" text-anchor="start">있다 — 이것이 건전한 논증이다</text><rect x="40" y="120" width="190" height="42" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="50" y="146" text-anchor="start">모두 참</text><rect x="230" y="120" width="130" height="42" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="240" y="146" text-anchor="start">거짓</text><rect x="360" y="120" width="382" height="42" rx="3" fill="var(--s2)" fill-opacity="0.16" stroke="var(--s2)" stroke-width="1.9"/><text class="ink bold sm" x="370" y="146" text-anchor="start">없다 — 타당성이 막는 칸은 이 하나뿐이다</text><rect x="40" y="162" width="190" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="50" y="188" text-anchor="start">하나라도 거짓</text><rect x="230" y="162" width="130" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="240" y="188" text-anchor="start">참</text><rect x="360" y="162" width="382" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="370" y="188" text-anchor="start">있다</text><rect x="40" y="204" width="190" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="50" y="230" text-anchor="start">하나라도 거짓</text><rect x="230" y="204" width="130" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="240" y="230" text-anchor="start">거짓</text><rect x="360" y="204" width="382" height="42" rx="3" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink sm" x="370" y="230" text-anchor="start">있다</text><text class="ink2 sm" x="40" y="286" text-anchor="start">타당성이 금지하는 것은 둘째 줄 하나뿐이다. 나머지 세 줄은 타당한 논증에도 부당한 논증에도 그대로 나타난다</text><text class="ink2 sm" x="40" y="308" text-anchor="start">그래서 전제나 결론이 실제로 참인지만 보고는 타당한지 알 수 없다. 거꾸로 타당한지만 보고 전제가 참인지도 알 수 없다</text><text class="ink2 sm" x="40" y="330" text-anchor="start">부당한 논증은 네 줄 어디에나 나타날 수 있다. 둘째 줄에 나타날 수 있다는 것이 곧 부당함의 뜻이다</text>
</svg>