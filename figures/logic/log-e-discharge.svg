<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 424" width="820" height="424" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">가정의 범위와 방출을 피치 스타일 도출표로 보인 그림</title><desc id="d">네 줄이 가정 하나에 기대고 있고 마지막 줄에서 그 가정이 방출되어 기댄 가정이 없어지는 과정을 줄 번호와 범위선으로 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="34" width="792" height="252" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="410" y="55" text-anchor="middle">도출 한 벌 — 전제 없이 (P ∧ Q) → (Q ∧ P) 를 얻는다</text><text x="64" y="86" text-anchor="end" fill="var(--ink2)" font-size="11" font-weight="600">줄</text><text x="88" y="86" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">논리식</text><text x="300" y="86" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">근거</text><text x="396" y="86" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">이 줄이 기대고 있는 가정</text><path d="M36 94 L560 94" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 107 L78 107 L78 220" fill="none" stroke="var(--s1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="122" text-anchor="end" fill="var(--ink2)" font-size="11">1</text><text x="96" y="122" text-anchor="start" fill="var(--ink)">P ∧ Q</text><text x="300" y="122" text-anchor="start" fill="var(--ink2)" font-size="11">가정</text><text x="396" y="122" text-anchor="start" fill="var(--ink2)" font-size="11">가정 1</text><text x="64" y="152" text-anchor="end" fill="var(--ink2)" font-size="11">2</text><text x="96" y="152" text-anchor="start" fill="var(--ink)">Q</text><text x="300" y="152" text-anchor="start" fill="var(--ink2)" font-size="11">1 ∧E</text><text x="396" y="152" text-anchor="start" fill="var(--ink2)" font-size="11">가정 1</text><text x="64" y="182" text-anchor="end" fill="var(--ink2)" font-size="11">3</text><text x="96" y="182" text-anchor="start" fill="var(--ink)">P</text><text x="300" y="182" text-anchor="start" fill="var(--ink2)" font-size="11">1 ∧E</text><text x="396" y="182" text-anchor="start" fill="var(--ink2)" font-size="11">가정 1</text><text x="64" y="212" text-anchor="end" fill="var(--ink2)" font-size="11">4</text><text x="96" y="212" text-anchor="start" fill="var(--ink)">Q ∧ P</text><text x="300" y="212" text-anchor="start" fill="var(--ink2)" font-size="11">2, 3 ∧I</text><text x="396" y="212" text-anchor="start" fill="var(--ink2)" font-size="11">가정 1</text><text x="64" y="242" text-anchor="end" fill="var(--ink2)" font-size="11">5</text><text x="82" y="242" text-anchor="start" fill="var(--ink)">(P ∧ Q) → (Q ∧ P)</text><text x="300" y="242" text-anchor="start" fill="var(--ink2)" font-size="11">1–4 →I</text><text x="396" y="242" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">없음</text><path fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M556 118 L516 118"/><text x="562" y="122" text-anchor="start" fill="var(--ink)" font-size="11">가정을 연다. 여기서 범위가 시작된다</text><text x="562" y="182" text-anchor="start" fill="var(--ink2)" font-size="11">이 세 줄도 모두 가정 1 아래에 있다</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M556 238 L516 238"/><text x="562" y="242" text-anchor="start" fill="var(--ink)" font-size="11">방출. 범위가 닫히고 기댄 것이 없어진다</text><rect x="388" y="226" width="58" height="24" rx="4" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text x="24" y="314" text-anchor="start" fill="var(--ink2)" font-size="11">1–4 번 줄은 전부 가정 1 아래서 얻은 것이다. 그 줄들만으로는 아직 아무것도 주장하지 못한다</text><text x="24" y="338" text-anchor="start" fill="var(--ink)" font-size="11">5 번 줄에서 가정 1 이 방출된다. 기댄 가정이 없어졌으므로 이 줄은 전제 없이 주장할 수 있다 — 그런 식이 정리다</text><text x="24" y="366" text-anchor="start" fill="var(--ink2)" font-size="11">¬I 도 같은 일을 한다. 다른 것은 범위 안에서 ⊥ 를 얻어야 한다는 것뿐이다</text><text x="410" y="404" text-anchor="middle" fill="var(--ink2)" font-size="11">→I 가 하는 일은 참을 만들어 내는 것이 아니라 기댄 가정 하나를 화살표 왼쪽으로 옮겨 적는 것이다</text>
</svg>