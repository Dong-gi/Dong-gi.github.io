<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 484" width="830" height="484" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">결정 가능과 반결정 가능의 세 겹</title><desc id="d">결정 가능이 반결정 가능 안에 있고 그 바깥에 반결정조차 안 되는 문제가 있다. 여집합을 취하면 가운데 띠의 문제는 바깥으로 나간다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="415" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">판정 문제의 세 겹 — 여집합을 취하면 자리가 어떻게 움직이는가</text><rect x="26" y="46" width="560" height="386" rx="14" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><text x="44" y="70" text-anchor="start" fill="var(--ink2)" font-size="11" font-weight="600">모든 판정 문제</text><rect x="52" y="88" width="508" height="322" rx="12" fill="var(--s2)" fill-opacity="0.08" stroke="var(--s2)" stroke-width="1.8"/><text x="70" y="112" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">반결정 가능 — ‘예’ 이면 언젠가 멈춘다</text><rect x="80" y="130" width="452" height="176" rx="10" fill="var(--s3)" fill-opacity="0.12" stroke="var(--s3)" stroke-width="1.8"/><text x="98" y="154" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">결정 가능 — 어느 입력에서도 반드시 멈춘다</text><text x="104" y="184" text-anchor="start" fill="var(--ink)" font-size="11">· 명제논리에서 φ 가 항진명제인가</text><text x="104" y="208" text-anchor="start" fill="var(--ink)" font-size="11">· 적힌 도출 한 벌이 규칙을 지키는가</text><text x="104" y="232" text-anchor="start" fill="var(--ink)" font-size="11">· 단항 술어논리에서 ⊨ φ 인가</text><text x="104" y="284" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">여집합도 여기 남는다 — 답을 뒤집으면 된다</text><text x="104" y="336" text-anchor="start" fill="var(--ink)" font-size="11">· 정지 문제 — M 을 w 에 돌리면 멈추는가</text><text x="104" y="360" text-anchor="start" fill="var(--ink)" font-size="11">· 술어논리에서 ⊨ φ 인가 — 결정 문제</text><text x="104" y="392" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">여기 있는 것의 여집합은 바깥으로 튕겨 나간다</text><rect x="594" y="46" width="222" height="392" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="705" y="66" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">바깥 — 반결정조차 안 된다</text><rect x="606" y="92" width="196" height="48" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="704" y="112" text-anchor="middle" fill="var(--ink)" font-size="11">M 이 w 에서 안 멈추는가</text><text x="704" y="129" text-anchor="middle" fill="var(--ink2)" font-size="11">정지 문제의 여집합</text><rect x="606" y="154" width="196" height="48" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="704" y="174" text-anchor="middle" fill="var(--ink)" font-size="11">⊨ φ 가 아닌가</text><text x="704" y="191" text-anchor="middle" fill="var(--ink2)" font-size="11">결정 문제의 여집합</text><rect x="606" y="216" width="196" height="48" rx="5" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1.2"/><text x="704" y="236" text-anchor="middle" fill="var(--ink)" font-size="11">φ 가 만족가능한가</text><text x="704" y="253" text-anchor="middle" fill="var(--ink2)" font-size="11">⊨ ¬φ 의 여집합</text><text x="704" y="306" text-anchor="middle" fill="var(--ink2)" font-size="11">이 셋은 mcs 가 대각선 논법으로</text><text x="704" y="322" text-anchor="middle" fill="var(--ink2)" font-size="11">건드린 자리와 같은 층이다</text><rect x="606" y="338" width="196" height="86" rx="5" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.4"/><text x="704" y="360" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">둘 다 반결정 가능이면</text><text x="704" y="377" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">결정 가능해진다</text><text x="704" y="398" text-anchor="middle" fill="var(--ink2)" font-size="11">그래서 가운데 띠의 여집합은</text><text x="704" y="414" text-anchor="middle" fill="var(--ink2)" font-size="11">반드시 바깥이다</text><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="6 4" d="M452 348 L598 116"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" stroke-dasharray="6 4" d="M452 360 L598 178"/><path d="M26 454 L804 454" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="415" y="474" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">읽어야 할 것은 세 겹이 진짜로 겹겹이라는 것 — 가운데 띠가 비어 있지 않다는 사실이 이 장의 결과다</text>
</svg>