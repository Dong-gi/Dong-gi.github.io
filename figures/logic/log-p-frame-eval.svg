<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">크립케 모형 하나에서 상자와 마름모의 값을 실제로 계산한다</title><desc id="d">네 세계와 네 화살표로 된 모형에서 P, ◇P, □P, □Q, □□P 의 값을 첫 세계에서 하나씩 따진다. 막다른 세계에서는 □ 가 공허하게 참이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<text x="450" y="26" text-anchor="middle" fill="var(--ink)" font-weight="600">□ 의 값은 이 세계가 아니라 이 세계에서 보이는 세계들이 정한다</text><rect x="20" y="44" width="430" height="316" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="235" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">ℳ = ⟨W, R, V⟩</text><text x="235" y="82" text-anchor="middle" fill="var(--ink2)" font-size="11">R = { ⟨w<tspan baseline-shift="-22%" font-size="76%">1</tspan>,w<tspan baseline-shift="-22%" font-size="76%">2</tspan>⟩, ⟨w<tspan baseline-shift="-22%" font-size="76%">1</tspan>,w<tspan baseline-shift="-22%" font-size="76%">3</tspan>⟩, ⟨w<tspan baseline-shift="-22%" font-size="76%">2</tspan>,w<tspan baseline-shift="-22%" font-size="76%">4</tspan>⟩, ⟨w<tspan baseline-shift="-22%" font-size="76%">3</tspan>,w<tspan baseline-shift="-22%" font-size="76%">2</tspan>⟩ }</text><text x="235" y="99" text-anchor="middle" fill="var(--ink2)" font-size="11">V(P) = {w<tspan baseline-shift="-22%" font-size="76%">2</tspan>, w<tspan baseline-shift="-22%" font-size="76%">3</tspan>} · V(Q) = {w<tspan baseline-shift="-22%" font-size="76%">3</tspan>, w<tspan baseline-shift="-22%" font-size="76%">4</tspan>} — 원 아래는 참인 원자</text><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M127.21 209.16 L202.15 168.28"/><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M127.21 238.84 L202.15 279.72"/><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M259.21 166.84 L334.15 207.72"/><path fill="none" stroke="var(--ink2)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ark)" d="M232 265 L232 186"/><circle cx="100" cy="224" r="26" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="100" y="229" text-anchor="middle" fill="var(--s1)" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">1</tspan></text><text x="100" y="267" text-anchor="middle" fill="var(--ink2)" font-size="11">(없음)</text><circle cx="232" cy="152" r="26" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="232" y="157" text-anchor="middle" fill="var(--s1)" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">2</tspan></text><text x="232" y="195" text-anchor="middle" fill="var(--ink2)" font-size="11">P</text><circle cx="232" cy="296" r="26" fill="var(--s1)" fill-opacity="0.12" stroke="var(--s1)" stroke-width="1.8"/><text x="232" y="301" text-anchor="middle" fill="var(--s1)" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">3</tspan></text><text x="232" y="339" text-anchor="middle" fill="var(--ink2)" font-size="11">P, Q</text><circle cx="364" cy="224" r="26" fill="var(--s2)" fill-opacity="0.12" stroke="var(--s2)" stroke-width="1.8"/><text x="364" y="229" text-anchor="middle" fill="var(--s2)" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">4</tspan></text><text x="364" y="267" text-anchor="middle" fill="var(--ink2)" font-size="11">Q</text><text x="364" y="182" text-anchor="middle" fill="var(--s2)" font-size="11" font-weight="600">막다른 세계</text><text x="364" y="288" text-anchor="middle" fill="var(--s2)" font-size="11">나가는 화살표가 없다</text><rect x="466" y="44" width="414" height="316" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="673" y="64" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">w<tspan baseline-shift="-22%" font-size="76%">1</tspan> 에서 하나씩 따져 본다</text><text x="673" y="81" text-anchor="middle" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">1</tspan> 이 보는 것은 w<tspan baseline-shift="-22%" font-size="76%">2</tspan> 와 w<tspan baseline-shift="-22%" font-size="76%">3</tspan> 뿐이다</text><rect x="482" y="102" width="382" height="34" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.2"/><text x="498" y="124" text-anchor="start" fill="var(--ink)" font-weight="600">P</text><text x="566" y="124" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">거짓</text><text x="612" y="124" text-anchor="start" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">1</tspan> ∉ V(P)</text><rect x="482" y="142" width="382" height="34" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.2"/><text x="498" y="164" text-anchor="start" fill="var(--ink)" font-weight="600">◇P</text><text x="566" y="164" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">참</text><text x="612" y="164" text-anchor="start" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">2</tspan> 에서 P 가 참이다</text><rect x="482" y="182" width="382" height="34" rx="4" fill="var(--s3)" fill-opacity="0.1" stroke="var(--s3)" stroke-width="1.2"/><text x="498" y="204" text-anchor="start" fill="var(--ink)" font-weight="600">□P</text><text x="566" y="204" text-anchor="start" fill="var(--s3)" font-size="11" font-weight="600">참</text><text x="612" y="204" text-anchor="start" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">2</tspan> 도 w<tspan baseline-shift="-22%" font-size="76%">3</tspan> 도 P 다</text><rect x="482" y="222" width="382" height="34" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.2"/><text x="498" y="244" text-anchor="start" fill="var(--ink)" font-weight="600">□Q</text><text x="566" y="244" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">거짓</text><text x="612" y="244" text-anchor="start" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">2</tspan> 에서 Q 가 거짓이다</text><rect x="482" y="262" width="382" height="34" rx="4" fill="var(--s2)" fill-opacity="0.1" stroke="var(--s2)" stroke-width="1.2"/><text x="498" y="284" text-anchor="start" fill="var(--ink)" font-weight="600">□□P</text><text x="566" y="284" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">거짓</text><text x="612" y="284" text-anchor="start" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">2</tspan> 에서 □P 가 거짓</text><text x="482" y="322" text-anchor="start" fill="var(--ink2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">2</tspan> 가 보는 것은 w<tspan baseline-shift="-22%" font-size="76%">4</tspan> 뿐이고 거기서 P 가 거짓이다</text><text x="482" y="344" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">셋째 줄과 다섯째 줄 — 이 모형에서 4 가 깨진다</text><path d="M20 380 L880 380" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="404" text-anchor="start" fill="var(--ink)" font-size="11">조항 하나만 새것이다. ¬ ∧ ∨ → ↔ 는 그 세계 안에서 6장 그대로 계산되고, □ 와 ◇ 만 화살표를 따라 다른 세계로 나간다.</text><text x="24" y="424" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">□φ 는 보이는 모든 세계에서 φ 가 참일 때, ◇φ 는 보이는 세계 중 하나에서 φ 가 참일 때 참이다.</text><text x="24" y="452" text-anchor="start" fill="var(--s2)" font-size="11">w<tspan baseline-shift="-22%" font-size="76%">4</tspan> 를 보라. 나가는 화살표가 하나도 없으므로 ‘보이는 모든 세계에서 참’ 이 공허하게 성립한다. w<tspan baseline-shift="-22%" font-size="76%">4</tspan> 에서는 □⊥ 조차 참이고</text><text x="24" y="472" text-anchor="start" fill="var(--s2)" font-size="11">◇(P ∨ ¬P) 조차 거짓이다. 6장의 공허하게 참이 여기서 되돌아온다 — 그리고 w<tspan baseline-shift="-22%" font-size="76%">1</tspan> 에서도 w<tspan baseline-shift="-22%" font-size="76%">4</tspan> 에서도 □P → P 가 무너진다.</text><text x="24" y="498" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">무너지는 이유는 하나다. 이 프레임에는 자기 자신으로 가는 화살표가 없다.</text>
</svg>