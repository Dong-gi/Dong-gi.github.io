<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">자연수 귀납법과 구조적 귀납법의 대응</title><desc id="d">왼쪽에 0 에서 시작해 하나씩 올라가는 자연수 사다리를, 오른쪽에 문장문자에서 시작해 조항을 따라 올라가는 적형식 파스 트리를 나란히 놓고 기저 단계와 귀납 단계가 서로 대응함을 보인다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<rect x="14" y="30" width="380" height="322" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="204" y="52" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">자연수에 대한 귀납법 — 사다리 한 줄</text><circle cx="62" cy="310" r="7" fill="var(--s2)"/><text x="44" y="315" text-anchor="end" fill="var(--ink)" font-size="11">0</text><circle cx="62" cy="268" r="7" fill="var(--s1)"/><text x="44" y="273" text-anchor="end" fill="var(--ink)" font-size="11">1</text><circle cx="62" cy="226" r="7" fill="var(--s1)"/><text x="44" y="231" text-anchor="end" fill="var(--ink)" font-size="11">2</text><circle cx="62" cy="184" r="7" fill="var(--s1)"/><text x="44" y="189" text-anchor="end" fill="var(--ink)" font-size="11">3</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M62 301 L62 279"/><text x="74" y="293" text-anchor="start" fill="var(--ink2)" font-size="11">+1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M62 259 L62 237"/><text x="74" y="251" text-anchor="start" fill="var(--ink2)" font-size="11">+1</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M62 217 L62 195"/><text x="74" y="209" text-anchor="start" fill="var(--ink2)" font-size="11">+1</text><text x="62" y="160" text-anchor="middle" fill="var(--ink2)">⋮</text><text x="122" y="95" text-anchor="start" fill="var(--ink)" font-size="11" font-weight="600">왜 이 둘로 충분한가</text><text x="122" y="113" text-anchor="start" fill="var(--ink2)" font-size="11">자연수가 0 에서 출발해 +1 을</text><text x="122" y="131" text-anchor="start" fill="var(--ink2)" font-size="11">유한 번 적용해 만들어지기 때문</text><text x="122" y="149" text-anchor="start" fill="var(--ink2)" font-size="11">어떤 수든 0 까지 내려가는</text><text x="122" y="167" text-anchor="start" fill="var(--ink2)" font-size="11">유한한 사다리가 있다</text><text x="122" y="205" text-anchor="start" fill="var(--s1)" font-size="11" font-weight="600">귀납 단계</text><text x="122" y="223" text-anchor="start" fill="var(--ink)" font-size="11">n 이 가지면 n+1 도 갖는다</text><text x="122" y="298" text-anchor="start" fill="var(--s2)" font-size="11" font-weight="600">기저 단계</text><text x="122" y="316" text-anchor="start" fill="var(--ink)" font-size="11">0 이 성질을 갖는다</text><rect x="406" y="30" width="460" height="322" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text x="636" y="52" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">적형식에 대한 구조적 귀납법 — 사다리가 나무가 된다</text><path d="M486 232 L540 188" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M594 232 L540 188" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M742 232 L742 188" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 164 L636 120" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M742 164 L636 120" fill="none" stroke="var(--grid)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="636" y="113" text-anchor="middle" fill="var(--ink)">((P ∧ Q) → ¬R)</text><text x="540" y="181" text-anchor="middle" fill="var(--ink)">(P ∧ Q)</text><text x="742" y="181" text-anchor="middle" fill="var(--ink)">¬R</text><text x="486" y="249" text-anchor="middle" fill="var(--s2)" font-weight="600">P</text><text x="594" y="249" text-anchor="middle" fill="var(--s2)" font-weight="600">Q</text><text x="742" y="249" text-anchor="middle" fill="var(--s2)" font-weight="600">R</text><text x="608" y="152" text-anchor="end" fill="var(--s1)" font-size="11">→ 조항</text><text x="500" y="218" text-anchor="end" fill="var(--s1)" font-size="11">∧ 조항</text><text x="760" y="218" text-anchor="start" fill="var(--s1)" font-size="11">¬ 조항</text><path d="M440 268 L830 268" fill="none" stroke="var(--s2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="440" y="288" text-anchor="start" fill="var(--s2)" font-size="11">기저 갈래 — 문장문자와 ⊥ 가 여기 놓인다. 확인할 갈래 둘</text><text x="440" y="314" text-anchor="start" fill="var(--s1)" font-size="11">조항 갈래 — 위로 올라가는 각 단계마다 하나씩. ¬ 와 이항 넷, 모두 다섯</text><path d="M40 372 L840 372" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="398" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">두 사다리의 칸이 하나씩 대응한다. 0 자리에 문장문자와 ⊥ 가 오고, +1 자리에 조항 여섯이 온다</text><text x="440" y="420" text-anchor="middle" fill="var(--ink2)" font-size="11">정당한 근거도 같다 — 자연수는 +1 을 유한 번, 적형식은 조항을 유한 번 적용해 만들어진다. 뒤엣것이 5장의 폐포 조항이다</text>
</svg>