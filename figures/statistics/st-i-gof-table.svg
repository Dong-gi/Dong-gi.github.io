<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 392" width="740" height="392" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">적합도 검정과 독립성 검정</title><desc id="d">주사위 눈의 관측도수와 기대도수의 비교, 그리고 두 집단 찬반 분할표에서 기대도수를 만드는 방법</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="370" y="24" text-anchor="middle">두 검정 모두 같은 식이다 — 관측도수와 기대도수의 차를 기대도수로 재서 더한다</text><rect x="36" y="46" width="340" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="206" y="65" text-anchor="middle">적합도 검정</text><text class="ink2 sm" x="206" y="81" text-anchor="middle">주사위 60번, 눈마다 기대 10회</text><path class="ax" marker-end="url(#ark)" d="M74 224 H362"/><path class="ax" marker-end="url(#ark)" d="M74 224 V86"/><text class="ink2 sm" x="100.9" y="240" text-anchor="middle">1</text><text class="ink2 sm" x="145.74" y="240" text-anchor="middle">2</text><text class="ink2 sm" x="190.58" y="240" text-anchor="middle">3</text><text class="ink2 sm" x="235.42" y="240" text-anchor="middle">4</text><text class="ink2 sm" x="280.26" y="240" text-anchor="middle">5</text><text class="ink2 sm" x="325.1" y="240" text-anchor="middle">6</text><text class="ink2 sm" x="68" y="188" text-anchor="end">5</text><text class="ink2 sm" x="68" y="148" text-anchor="end">10</text><text class="ink2 sm" x="68" y="108" text-anchor="end">15</text><rect x="88.34" y="160" width="25.11" height="64" rx="1.2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><rect x="133.18" y="152" width="25.11" height="72" rx="1.2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><rect x="178.02" y="112" width="25.11" height="112" rx="1.2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><rect x="222.86" y="168" width="25.11" height="56" rx="1.2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><rect x="267.7" y="120" width="25.11" height="104" rx="1.2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><rect x="312.54" y="152" width="25.11" height="72" rx="1.2" fill="var(--s1)" fill-opacity="0.34" stroke="var(--s1)" stroke-width="1"/><path d="M74 144 L352 144" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink sm" x="358" y="136" text-anchor="end">기대 10</text><text class="ink bold sm" x="206" y="256" text-anchor="middle">χ² = 4.00,  자유도 5</text><text class="ink2 sm" x="206" y="280" text-anchor="middle">임곗값 11.07 보다 작다 — 기각하지 못한다</text><rect x="392" y="46" width="312" height="254" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="548" y="65" text-anchor="middle">독립성 검정</text><text class="ink2 sm" x="548" y="81" text-anchor="middle">두 집단 × 찬반, 위가 관측 아래가 기대</text><text class="ink2 sm" x="507" y="100" text-anchor="middle">찬성</text><text class="ink2 sm" x="581" y="100" text-anchor="middle">반대</text><text class="ink2 sm" x="655" y="100" text-anchor="middle">합</text><text class="ink2 sm" x="462" y="132" text-anchor="end">집단 A</text><rect x="470" y="106" width="74" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="507" y="123" text-anchor="middle">50</text><text class="ink2 sm" x="507" y="139" text-anchor="middle">(40)</text><rect x="544" y="106" width="74" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="581" y="123" text-anchor="middle">50</text><text class="ink2 sm" x="581" y="139" text-anchor="middle">(60)</text><text class="ink2 sm" x="655" y="130" text-anchor="middle">100</text><text class="ink2 sm" x="462" y="172" text-anchor="end">집단 B</text><rect x="470" y="146" width="74" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="507" y="163" text-anchor="middle">30</text><text class="ink2 sm" x="507" y="179" text-anchor="middle">(40)</text><rect x="544" y="146" width="74" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold sm" x="581" y="163" text-anchor="middle">70</text><text class="ink2 sm" x="581" y="179" text-anchor="middle">(60)</text><text class="ink2 sm" x="655" y="170" text-anchor="middle">100</text><text class="ink2 sm" x="507" y="204" text-anchor="middle">80</text><text class="ink2 sm" x="581" y="204" text-anchor="middle">120</text><text class="ink2 sm" x="655" y="204" text-anchor="middle">200</text><text class="ink sm" x="548" y="222" text-anchor="middle">기대도수 = 행합 × 열합 / 총합</text><text class="ink bold sm" x="548" y="256" text-anchor="middle">χ² = 8.33,  자유도 (2−1)(2−1) = 1</text><text class="ink2 sm" x="548" y="280" text-anchor="middle">임곗값 3.84 보다 크다 — 기각한다</text><path d="M46 316 L694 316" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="370" y="338" text-anchor="middle">기대도수로 나누는 이유는 같은 크기의 차이라도 기대도수가 작을 때 더 놀랍기 때문이다</text><text class="ink" x="370" y="360" text-anchor="middle">오른쪽 꼬리만 본다. χ² 가 크다는 것은 어느 쪽으로든 어긋났다는 뜻이므로 방향이 하나뿐이다</text><text class="ink2 sm" x="370" y="382" text-anchor="middle">기대도수가 5 보다 작은 칸이 있으면 근사가 나빠진다. 칸을 합치거나 정확검정을 쓴다</text>
</svg>