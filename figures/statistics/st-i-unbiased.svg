<title id="t">불편성 — 추정량의 표본분포의 중심이 참값에 맞는가</title><desc id="d">두 추정량의 표본분포를 겹쳐 그린 것. 하나는 중심이 참값에 맞고 다른 하나는 오른쪽으로 밀려 있다</desc>
