none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="4 3" d="M251.82 252 L638.18 252"/><text class="ink2 sm" x="345" y="270" text-anchor="middle">제곱</text><path d="M70 290 L670 290" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="370" y="316" text-anchor="middle">같은 확률이 더 넓은 자리에 퍼지면 밀도는 낮아진다. 그 배율이 |dx/dy| 다</text><text class="ink" x="370" y="342" text-anchor="middle">x = √y 이므로 dx/dy = 1/(2√y) 이고, f<tspan baseline-shift="-22%" font-size="76%">Y</tspan>(y) = 0.5 × 1/(2√y) = 1/(4√y) 가 된다</text><text class="ink2 sm" x="370" y="368" text-anchor="middle">넓이는 어느 쪽에서 재도 1 이다. 옮겨진 것은 확률이 아니라 그 확률이 놓인 자리다</text>
</svg>