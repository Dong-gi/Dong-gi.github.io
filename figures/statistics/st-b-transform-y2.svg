<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 376" width="740" height="376" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">변환하면 밀도가 눌리고 늘어난다</title><desc id="d">균등분포를 제곱하면 같은 확률이 더 넓은 구간으로 퍼져 밀도가 낮아진다. 그 배율이 도함수의 절댓값이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
