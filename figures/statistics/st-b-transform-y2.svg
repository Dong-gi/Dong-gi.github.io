<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="370" y="28" text-anchor="middle">Y = X² — 균등하게 놓인 구간이 고르지 않게 옮겨진다</text><text class="ink" x="170" y="60" text-anchor="middle">X 는 0 과 2 사이 균등</text><rect x="70" y="133" width="181.82" height="59" rx="0" fill="var(--s1)" fill-opacity="0.25" stroke="var(--s1)" stroke-width="1.6"/><path d="M115.45 192 L115.45 133" fill="none" stroke="var(--s1)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M160.91 192 L160.91 133" fill="none" stroke="var(--s1)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.36 192 L206.36 133" fill="none" stroke="var(--s1)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path class="ax" marker-end="url(#ark)" d="M70 192 H280"/><path class="ax" marker-end="url(#ark)" d="M70 192 V64"/><text class="sm ink2" x="160.91" y="207" text-anchor="middle">1</text><text class="sm ink2" x="251.82" y="207" text-anchor="middle">2</text><text class="sm ink2" x="64" y="137" text-anchor="end">0.5</text><text class="ink sm" x="160.91" y="123" text-anchor="middle">f<tspan baseline-shift="-22%" font-size="76%">X</tspan>(x) = 0.5</text><text class="ink2 sm" x="170" y="230" text-anchor="middle">너비가 같은 네 칸</text><text class="ink" x="540" y="60" text-anchor="middle">Y = X² 는 0 과 4 사이</text><path d="M423.41 192 L423.41 89.39 L426.09 115.25 L428.78 128.06 L431.46 136.04 L434.15 141.63 L436.83 145.82 L439.52 149.12 L442.2 151.79 L444.89 154.02 L447.57 155.92 L450.26 157.56 L452.94 158.99 L455.63 160.26 L458.31 161.39 L460.99 162.41 L463.68 163.33 L466.36 164.18 L469.05 164.95 L471.73 165.66 L474.42 166.32 L477.1 166.93 L479.79 167.5 L482.47 168.03 L485.16 168.53 L487.84 169 L490.53 169.44 L493.21 169.86 L495.89 170.25 L498.58 170.63 L501.26 170.98 L503.95 171.32 L506.63 171.65 L509.32 171.95 L512 172.25 L514.69 172.53 L517.37 172.8 L520.06 173.06 L522.74 173.31 L525.43 173.55 L528.11 173.7