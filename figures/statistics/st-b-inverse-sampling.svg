="var(--s3)"/><path d="M116 103.14 L247.96 103.14" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M247.96 103.14 L247.96 252" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="103.14" r="3" fill="var(--s1)"/><circle cx="247.96" cy="262" r="3.4" fill="var(--s3)"/><path d="M116 89.61 L296.83 89.61" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.83 89.61 L296.83 252" fill="none" stroke="var(--grid)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="89.61" r="3" fill="var(--s1)"/><circle cx="296.83" cy="262" r="3.4" fill="var(--s3)"/><text class="ink bold" x="256" y="44" text-anchor="middle">세로축에 고르게 놓은 점을 곡선을 통해 가로축으로 내린다</text><text class="ink sm" x="52" y="156" text-anchor="middle">고르게</text><text class="ink sm" x="52" y="174" text-anchor="middle">놓는다</text><text class="ink sm" x="257" y="288" text-anchor="middle">왼쪽에 몰리고 오른쪽에서 성기다</text><text class="ink" x="424" y="88" text-anchor="start">난수 U 는 0 과 1 사이에서</text><text class="ink" x="424" y="108" text-anchor="start">고르게 뽑는다.</text><text class="ink bold" x="424" y="140" text-anchor="start">X = F⁻¹(U) 로 옮기면</text><text class="ink bold" x="424" y="160" text-anchor="start">X 의 누적분포함수가</text><text class="ink bold" x="424" y="180" text-anchor="start">정확히 F 가 된다.</text><text class="ink2 sm" x="424" y="212" text-anchor="start">F 가 가파른 곳에서 점이 촘촘해지고</text><text class="ink2 sm" x="424" y="232" text-anchor="start">완만한 곳에서 성기게 놓인다.</text><path d="M60 306 L668 306" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="360" y="332" text-anchor="middle">증명은 한 줄이다. P(F⁻¹(U) ≤ x) = P(U ≤ F(x)) = F(x)</text><text class="ink" x="360" y="358" text-anchor="middle">균등난수 하나만 있으면 어떤 분포든 만들어 낼 수 있다는 뜻이다</text>
</svg>