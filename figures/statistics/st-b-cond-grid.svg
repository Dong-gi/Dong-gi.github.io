rx="0" fill="var(--s1)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><rect x="420" y="180" width="26" height="26" rx="0" fill="var(--s1)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><rect x="420" y="206" width="26" height="26" rx="0" fill="var(--s1)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><rect x="446" y="154" width="26" height="26" rx="0" fill="var(--s1)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><rect x="446" y="180" width="26" height="26" rx="0" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="446" y="180" width="26" height="26" rx="0" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><rect x="446" y="206" width="26" height="26" rx="0" fill="var(--s1)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><rect x="472" y="128" width="26" height="26" rx="0" fill="var(--s1)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><rect x="472" y="154" width="26" height="26" rx="0" fill="var(--s1)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><rect x="472" y="180" width="26" height="26" rx="0" fill="var(--s1)" fill-opacity="0.18" stroke="var(--grid)" stroke-width="1"/><rect x="472" y="206" width="26" height="26" rx="0" fill="var(--s2)" fill-opacity="0.55" stroke="var(--grid)" stroke-width="1"/><rect x="472" y="206" width="26" height="26" rx="0" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.8"/><text class="ink sm" x="420" y="254" text-anchor="middle">P(두 눈이 같다 | 합 ≥ 9) = 2/10 = 0.2</text><text class="ink2 sm" x="524" y="104" text-anchor="start">테두리 친 칸이 ‘두 눈이 같다’</text><text class="ink2 sm" x="524" y="124" text-anchor="start">연한 칸이 ‘합이 9 이상’</text><text class="ink2 sm" x="524" y="152" text-anchor="start">조건을 알면 6개 중 4개가</text><text class="ink2 sm" x="524" y="172" text-anchor="start">사라지고 (5,5) 와 (6,6) 만</text><text class="ink2 sm" x="524" y="192" text-anchor="start">남는다. 분모는 36 에서 10 으로,</text><text class="ink2 sm" x="524" y="212" text-anchor="start">분자는 6 에서 2 로 줄었다.</text><path d="M70 274 L660 274" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="360" y="300" text-anchor="middle">P(A|B) = P(A∩B) / P(B) 의 분자 분모를 36으로 곱하면 그대로 칸 수의 비가 된다</text><text class="ink2 sm" x="360" y="322" text-anchor="middle">분모가 S 에서 B 로 줄었을 뿐, 확률의 공리는 줄어든 세계 안에서도 그대로 성립한다</text>
</svg>