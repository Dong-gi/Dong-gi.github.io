1 140.46 L305.88 138.16 L308.06 135.8 L310.23 133.38 L312.4 130.9 L314.58 128.35 L316.75 125.74 L318.92 123.06 L321.1 120.31 L323.27 117.49 L325.44 114.6 L327.62 111.63 L329.79 108.58 L331.96 105.45 L334.13 102.24 L336.31 98.95 L338.48 95.57 L340.65 92.1 L342.83 88.54 L345 84.89 L347.17 81.14 L349.35 77.29 L351.52 73.33 L353.69 69.28"/><path class="cv s1" stroke-dasharray="6 4" d="M132.15 240.38 L374.46 122.25"/><circle class="f1" cx="236" cy="189.75" r="4.5"/><text class="ink" x="224" y="219.75" text-anchor="end">M(0) = 1</text><text class="ink sm" x="92.92" y="80.06" text-anchor="start">점선 = t = 0 의 접선</text><text class="ink bold" x="92.92" y="99.75" text-anchor="start">기울기 = μ = 2</text><text class="ink" x="341.38" y="79.58" text-anchor="end">M(t)</text><text class="ink bold" x="86" y="44" text-anchor="start">X 는 1 과 3 을 각각 확률 1/2 로 갖는다</text><text class="ink bold" x="412" y="88" text-anchor="start">M(t) = E[e^tX]</text><text class="ink2 sm" x="412" y="110" text-anchor="start">     = (e^t + e^3t)/2</text><text class="ink2 sm" x="412" y="142" text-anchor="start">M′(t) = (e^t + 3e^3t)/2</text><text class="ink bold" x="412" y="162" text-anchor="start">M′(0) = 2 = E[X]</text><text class="ink2 sm" x="412" y="192" text-anchor="start">M″(t) = (e^t + 9e^3t)/2</text><text class="ink bold" x="412" y="212" text-anchor="start">M″(0) = 5 = E[X²]</text><text class="ink" x="412" y="240" text-anchor="start">V(X) = 5 − 2² = 1</text><path d="M86 268 L670 268" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="360" y="292" text-anchor="middle">t = 0 에서 몇 번 미분하느냐가 몇 차 적률을 뽑느냐를 정한다</text><text class="ink" x="360" y="316" text-anchor="middle">M(t) = 1 + μt + E[X²]t²/2! + ⋯ 이므로 t 의 거듭제곱 앞에 적률이 하나씩 얹혀 있다</text><text class="ink2 sm" x="360" y="338" text-anchor="middle">분포 전체를 함수 하나로 압축한 것이라 7·8·9장에서 계속 쓰인다</text>
