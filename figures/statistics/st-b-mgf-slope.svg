<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">적률생성함수를 t = 0 에서 미분하면 적률이 나온다</title><desc id="d">M(t) 곡선의 원점에서의 기울기가 평균이고 두 번 미분한 값이 2차 적률이다</desc>
<style>
