<title id="t">검정력 곡선 — 표본 크기와 효과 크기가 정한다</title><desc id="d">표본 크기 4, 16, 64 에서 참 모평균에 따른 검정력. 같은 차이라도 표본이 작으면 잡을 확률이 낮다</desc>
