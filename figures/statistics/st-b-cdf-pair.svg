<title id="t">누적분포함수 — 이산은 계단, 연속은 매끈한 곡선</title><desc id="d">이산에서는 F 가 확률만큼 뛰고 연속에서는 왼쪽 넓이가 그대로 F 가 된다. 기울기가 밀도다</desc>
