4.69 144.12 L307.06 141.57 L309.43 138.99 L311.81 136.39 L314.18 133.76 L316.55 131.1 L318.93 128.41 L321.3 125.7 L323.67 122.96 L326.04 120.2 L328.42 117.4 L330.79 114.58 L333.16 111.73 L335.54 108.86 L337.91 105.95 L340.28 103.02 L342.66 100.06 L345.03 97.08 L347.4 94.07 L349.77 91.03 L352.15 87.96 L354.52 84.87 L356.89 81.75 L359.27 78.6 L361.64 75.42 L364.01 72.22 L366.39 68.99 L368.76 65.73"/><path class="cv s1" stroke-dasharray="6 4" d="M137.23 255.14 L350.13 90.57"/><circle class="f2" cx="137.23" cy="255.14" r="3.5"/><circle class="f2" cx="350.13" cy="90.57" r="3.5"/><circle class="f1" cx="243.68" cy="172.86" r="4.5"/><circle class="f3" cx="243.68" cy="200.29" r="4.5"/><path class="gr" stroke-dasharray="4 3" d="M243.68 262 L243.68 172.86"/><path class="gr" stroke-dasharray="4 3" d="M84 172.86 L243.68 172.86"/><path class="gr" stroke-dasharray="4 3" d="M84 200.29 L243.68 200.29"/><text class="ink bold" x="231.68" y="164.86" text-anchor="end">E[g(X)] = 4.68</text><text class="ink bold" x="255.68" y="220.29" text-anchor="start">g(E[X]) = 3.24</text><text class="ink sm" x="376.74" y="201.05" text-anchor="middle">g(x) = 0.36x²</text><text class="ink bold" x="249" y="44" text-anchor="middle">아래로 볼록한 g 에서는 E[g(X)] 가 g(E[X]) 보다 크다</text><text class="ink" x="440" y="92" text-anchor="start">X 는 1 과 5 를</text><text class="ink" x="440" y="112" text-anchor="start">각각 확률 1/2 로 갖는다.</text><text class="ink2 sm" x="440" y="142" text-anchor="start">E[X] = 3</text><text class="ink2 sm" x="440" y="162" text-anchor="start">g(3) = 3.24</text><text class="ink2 sm" x="440" y="182" text-anchor="start">(0.36 + 9.0)/2 = 4.68</text><text class="ink2 sm" x="440" y="212" text-anchor="start">차이 1.44 는 곡선과</text><text class="ink2 sm" x="440" y="232" text-anchor="start">현 사이의 간격이다.</text><path d="M84 294 L656 294" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="350" y="320" text-anchor="middle">평균을 먼저 내고 함수를 씌우는 것과 함수를 씌우고 평균을 내는 것은 다르다</text><text class="ink2 sm" x="350" y="344" text-anchor="middle">직선(g(x) = ax + b)일 때만 두 값이 같다. 그것이 기댓값의 선형성이 말하는 전부다</text>
</svg>