"ink2 sm" x="420" y="250" text-anchor="middle">4</text><text class="ink2 sm" x="510" y="250" text-anchor="middle">5</text><text class="ink2 sm" x="90" y="200.8" text-anchor="end">0</text><text class="ink2 sm" x="90" y="163.6" text-anchor="end">4</text><text class="ink2 sm" x="90" y="126.4" text-anchor="end">8</text><text class="ink2 sm" x="90" y="89.2" text-anchor="end">12</text><text class="ink2 sm" x="90" y="52" text-anchor="end">16</text><path class="cv s1" d="M105 180.53 L510 109.38"/><circle cx="150" cy="168.9" r="4" fill="var(--ink)"/><circle cx="240" cy="150.3" r="4" fill="var(--ink)"/><circle cx="330" cy="159.6" r="4" fill="var(--ink)"/><circle cx="420" cy="122.4" r="4" fill="var(--ink)"/><circle cx="510" cy="103.8" r="4" fill="var(--ink)"/><path d="M330 230.28 L330 57.3" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text class="ink2 sm" x="330" y="69.3" text-anchor="middle">x̄ — 두 띠가 가장 좁은 곳</text><rect x="586" y="66" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="606" y="72">평균의 신뢰구간</text><rect x="586" y="84" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="606" y="90">개별값의 예측구간</text><text class="ink sm" x="586" y="122" text-anchor="start">x<tspan baseline-shift="-22%" font-size="76%">0</tspan> = 4 에서</text><text class="ink bold sm" x="586" y="142" text-anchor="start">ŷ = 7.7</text><text class="ink sm" x="586" y="164" text-anchor="start">신뢰 ±2.27</text><text class="ink sm" x="586" y="184" text-anchor="start">예측 ±4.73</text><text class="ink2 sm" x="586" y="210" text-anchor="start">두 배 넘게 넓다</text><path d="M46 266 L694 266" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="370" y="288" text-anchor="middle">평균의 구간은 직선의 위치가 얼마나 불확실한가만 담는다. 표본을 늘리면 0 으로 줄어든다</text><text class="ink bold" x="370" y="312" text-anchor="middle">예측구간은 여기에 개체 자체의 흔들림 σ² 를 더한다. 표본을 늘려도 그 몫은 남는다</text><text class="ink2 sm" x="370" y="336" text-anchor="middle">두 띠 모두 x̄ 에서 좁고 멀어질수록 벌어진다. 자료 범위 밖의 예측을 조심해야 하는 이유다</text>
</svg>