<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="370" y="26" text-anchor="middle">과녁의 중심이 참값, 점 하나가 표본 하나에서 나온 추정값이다</text><text class="ink bold sm" x="118" y="62" text-anchor="middle">편향 작고 분산 작다</text><circle cx="118" cy="158" r="46" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="118" cy="158" r="31" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="118" cy="158" r="16" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="118" cy="158" r="3.2" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="1.5"/><circle cx="117.58" cy="165.78" r="3.2" fill="var(--s1)"/><circle cx="116.17" cy="160.07" r="3.2" fill="var(--s1)"/><circle cx="116.85" cy="169.4" r="3.2" fill="var(--s1)"/><circle cx="115.01" cy="154.07" r="3.2" fill="var(--s1)"/><circle cx="137.68" cy="149.59" r="3.2" fill="var(--s1)"/><circle cx="122.39" cy="154.79" r="3.2" fill="var(--s1)"/><circle cx="128.86" cy="151.44" r="3.2" fill="var(--s1)"/><circle cx="123.55" cy="163.89" r="3.2" fill="var(--s1)"/><circle cx="102.09" cy="168.21" r="3.2" fill="var(--s1)"/><circle cx="128.8" cy="153.61" r="3.2" fill="var(--s1)"/><circle cx="104.51" cy="148.63" r="3.2" fill="var(--s1)"/><circle cx="104.62" cy="159.89" r="3.2" fill="var(--s1)"/><circle cx="111.21" cy="159.5" r="3.2" fill="var(--s1)"/><circle cx="122.68" cy="153.12" r="3.2" fill="var(--s1)"/><text class="ink2 sm" x="118" y="228" text-anchor="middle">가장 좋다</text><text class="ink bold sm" x="290" y="62" text-anchor="middle">편향 작고 분산 크다</text><circle cx="290" cy="158" r="46" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="290" cy="158" r="31" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="290" cy="158" r="16" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="290" cy="158" r="3.2" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="1.5"/><circle cx="265.2" cy="167.35" r="3.2" fill="var(--s1)"/><circle cx="326.09" cy="155.3" r="3.2" fill="var(--s1)"/><circle cx="296.06" cy="175.62" r="3.2" fill="var(--s1)"/><circle cx="269.15" cy="110.83" r="3.2" fill="var(--s1)"/><circle cx="302.06" cy="151.45" r="3.2" fill="var(--s1)"/><circle cx="270.95" cy="169.48" r="3.2" fill="var(--s1)"/><circle cx="295.33" cy="159.76" r="3.2" fill="var(--s1)"/><circle cx="309.28" cy="123.38" r="3.2" fill="var(--s1)"/><circle cx="304.32" cy="146.79" r="3.2" fill="var(--s1)"/><circle cx="305.77" cy="138.17" r="3.2" fill="var(--s1)"/><circle cx="287.35" cy="209.9" r="3.2" fill="var(--s1)"/><circle cx="267.6" cy="154.61" r="3.2" fill="var(--s1)"/><circle cx="298.78" cy="160.45" r="3.2" fill="var(--s1)"/><circle cx="262.05" cy="188.92" r="3.2" fill="var(--s1)"/><text class="ink2 sm" x="290" y="228" text-anchor="middle">평균은 맞지만 한 번의 값은 못 믿는다</text><text class="ink bold sm" x="462" y="62" text-anchor="middle">편향 크고 분산 작다</text><circle cx="462" cy="158" r="46" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="462" cy="158" r="31" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="462" cy="158" r="16" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="462" cy="158" r="3.2" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="1.5"/><circle cx="484.55" cy="145.8" r="3.2" fill="var(--s1)"/><circle cx="482.18" cy="149.08" r="3.2" fill="var(--s1)"/><circle cx="479.38" cy="145.06" r="3.2" fill="var(--s1)"/><circle cx="487.15" cy="142.34" r="3.2" fill="var(--s1)"/><circle cx="491.09" cy="146.47" r="3.2" fill="var(--s1)"/><circle cx="491.18" cy="149.35" r="3.2" fill="var(--s1)"/><circle cx="471.03" cy="137.91" r="3.2" fill="var(--s1)"/><circle cx="476.19" cy="127.48" r="3.2" fill="var(--s1)"/><circle cx="493.92" cy="133.4" r="3.2" fill="var(--s1)"/><circle cx="479.97" cy="143.66" r="3.2" fill="var(--s1)"/><circle cx="488.1" cy="142.09" r="3.2" fill="var(--s1)"/><circle cx="482.03" cy="152.67" r="3.2" fill="var(--s1)"/><circle cx="486.1" cy="138.73" r="3.2" fill="var(--s1)"/><circle cx="483.13" cy="161.98" r="3.2" fill="var(--s1)"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M462 158 L484 144"/><text class="ink2 sm" x="462" y="228" text-anchor="middle">늘 같은 쪽으로 빗맞힌다</text><text class="ink bold sm" x="634" y="62" text-anchor="middle">편향 크고 분산 크다</text><circle cx="634" cy="158" r="46" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="634" cy="158" r="31" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="634" cy="158" r="16" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><circle cx="634" cy="158" r="3.2" fill="var(--ink2)" fill-opacity="1" stroke="none" stroke-width="1.5"/><circle cx="627.3" cy="145.67" r="3.2" fill="var(--s1)"/><circle cx="616.9" cy="140.37" r="3.2" fill="var(--s1)"/><circle cx="675.78" cy="144.41" r="3.2" fill="var(--s1)"/><circle cx="680.62" cy="149.16" r="3.2" fill="var(--s1)"/><circle cx="664.02" cy="142.32" r="3.2" fill="var(--s1)"/><circle cx="643.19" cy="137.77" r="3.2" fill="var(--s1)"/><circle cx="696.05" cy="163.57" r="3.2" fill="var(--s1)"/><circle cx="632.22" cy="142.09" r="3.2" fill="var(--s1)"/><circle cx="651.09" cy="132.17" r="3.2" fill="var(--s1)"/><circle cx="669.44" cy="159.27" r="3.2" fill="var(--s1)"/><circle cx="666.77" cy="171.97" r="3.2" fill="var(--s1)"/><circle cx="659.99" cy="143.96" r="3.2" fill="var(--s1)"/><circle cx="626.72" cy="126.56" r="3.2" fill="var(--s1)"/><circle cx="673.91" cy="116.7" r="3.2" fill="var(--s1)"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M634 158 L656 144"/><text class="ink2 sm" x="634" y="228" text-anchor="middle">가장 나쁘다</text><path d="M46 254 L694 254" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="370" y="282" text-anchor="middle">평균제곱오차 MSE(θ̂) = 분산 + 편향²  — 두 가지 나쁨을 하나의 수로 합친 것이다</text><text class="ink" x="370" y="308" text-anchor="middle">가운데 두 칸을 견주는 것이 요점이다. 편향이 있어도 분산이 훨씬 작으면 MSE 가 더 작을 수 있다</text><text class="ink2 sm" x="370" y="332" text-anchor="middle">그래서 ‘불편이면 무조건 좋다’ 가 아니다. 무엇을 줄이려는지 먼저 정해야 한다</text>
</svg>