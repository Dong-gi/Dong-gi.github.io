<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">나무 그림으로 본 전확률 정리와 베이즈 정리</title><desc id="d">두 원인에서 갈라진 가지의 확률을 곱해 끝값을 얻고 그것을 더하면 전확률, 그중 하나의 몫이 베이즈의 답이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="380" y="26" text-anchor="middle">가지를 따라 곱하고, 끝을 모아 더한다</text><circle cx="92" cy="168" r="4" fill="var(--ink2)"/><text class="ink2 sm" x="92" y="192" text-anchor="middle">시작</text><path d="M100 168 L288 104" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="190" y="128" text-anchor="middle">P = 0.30</text><circle cx="300" cy="104" r="4" fill="var(--s1)"/><text class="ink" x="288" y="90" text-anchor="middle">원인 B<tspan baseline-shift="-22%" font-size="76%">1</tspan> (기계 1)</text><path d="M308 104 L528 68" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="420" y="79" text-anchor="middle">P = 0.80</text><circle cx="540" cy="68" r="4" fill="var(--s2)"/><text class="ink bold" x="552" y="72" text-anchor="start">불량   0.30 × 0.80 = 0.240</text><path d="M308 104 L528 140" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="420" y="115" text-anchor="middle">P = 0.20</text><circle cx="540" cy="140" r="4" fill="var(--grid)"/><text class="ink2 sm" x="552" y="144" text-anchor="start">정상   0.30 × 0.20 = 0.060</text><path d="M100 168 L288 236" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="190" y="194" text-anchor="middle">P = 0.70</text><circle cx="300" cy="236" r="4" fill="var(--s3)"/><text class="ink" x="288" y="258" text-anchor="middle">원인 B<tspan baseline-shift="-22%" font-size="76%">2</tspan> (기계 2)</text><path d="M308 236 L528 200" fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="420" y="211" text-anchor="middle">P = 0.15</text><circle cx="540" cy="200" r="4" fill="var(--s2)"/><text class="ink bold" x="552" y="204" text-anchor="start">불량   0.70 × 0.15 = 0.105</text><path d="M308 236 L528 272" fill="none" stroke="var(--grid)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="420" y="247" text-anchor="middle">P = 0.85</text><circle cx="540" cy="272" r="4" fill="var(--grid)"/><text class="ink2 sm" x="552" y="276" text-anchor="start">정상   0.70 × 0.85 = 0.595</text><path d="M92 296 L700 296" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="92" y="318" text-anchor="start">전확률: P(불량) = 0.240 + 0.105 = 0.345</text><text class="ink" x="430" y="318" text-anchor="start">베이즈: P(B<tspan baseline-shift="-22%" font-size="76%">1</tspan> | 불량) = 0.240 / 0.345 ≈ 0.696</text>
</svg>