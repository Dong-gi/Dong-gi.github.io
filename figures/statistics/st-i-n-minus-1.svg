<title id="t">표본분산이 n − 1 로 나누는 이유</title><desc id="d">표본평균 기준의 제곱합은 참값 기준의 제곱합보다 언제나 작고, 그 차이가 정확히 n 곱하기 표본평균의 분산이다</desc>
<style>
