<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">상관계수와 회귀 — 두 회귀직선, SD 선, 평균으로의 회귀</title><desc id="d">같은 자료에 y 를 x 로 회귀한 직선과 x 를 y 로 회귀한 직선, 그리고 SD 선을 함께 그렸다. 표준화한 축에서는 회귀직선의 기울기가 상관계수와 같다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="370" y="24" text-anchor="middle">같은 자료에 직선이 하나만 있는 것이 아니다. 무엇으로 무엇을 맞히려는지가 직선을 정한다</text><rect x="36" y="44" width="356" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="214" y="63" text-anchor="middle">두 회귀직선과 SD 선</text><text class="ink2 sm" x="214" y="79" text-anchor="middle">셋 다 (x̄, ȳ) 를 지나고 기울기만 다르다</text><path class="ax" marker-end="url(#ark)" d="M88 234 H374"/><path class="ax" marker-end="url(#ark)" d="M88 234 V84"/><text class="ink2 sm" x="126.74" y="250" text-anchor="middle">1</text><text class="ink2 sm" x="175.16" y="250" text-anchor="middle">2</text><text class="ink2 sm" x="223.58" y="250" text-anchor="middle">3</text><text class="ink2 sm" x="272" y="250" text-anchor="middle">4</text><text class="ink2 sm" x="320.42" y="250" text-anchor="middle">5</text><text class="ink2 sm" x="82" y="204.67" text-anchor="end">3</text><text class="ink2 sm" x="82" y="171.33" text-anchor="end">6</text><text class="ink2 sm" x="82" y="138" text-anchor="end">9</text><text class="ink2 sm" x="82" y="104.67" text-anchor="end">12</text><path class="cv s2" stroke-dasharray="6 4" d="M97.68 225.11 L354.32 107.33"/><path class="cv s3" stroke-dasharray="2 4" d="M97.68 220.6 L354.32 112.02"/><path class="cv s1" d="M97.68 216.44 L354.32 116.33"/><circle cx="126.74" cy="200.67" r="4" fill="var(--ink)"/><circle cx="175.16" cy="178.44" r="4" fill="var(--ink)"/><circle cx="223.58" cy="189.56" r="4" fill="var(--ink)"/><circle cx="272" cy="145.11" r="4" fill="var(--ink)"/><circle cx="320.42" cy="122.89" r="4" fill="var(--ink)"/><circle cx="223.58" cy="167.33" r="5.5" fill="var(--ink)"/><text class="ink bold sm" x="217.16" y="160.67" text-anchor="end">(x̄, ȳ)</text><rect x="238" y="178" width="14" height="3" rx="1.5" class="f1"/><text class="sm ink2" x="258" y="184">y 를 x 로 회귀</text><rect x="238" y="196" width="14" height="3" rx="1.5" class="f3"/><text class="sm ink2" x="258" y="202">SD 선</text><rect x="238" y="214" width="14" height="3" rx="1.5" class="f2"/><text class="sm ink2" x="258" y="220">x 를 y 로 회귀</text><text class="ink2 sm" x="214" y="272" text-anchor="middle">기울기는 1.70 · 1.84 · 2.00 순으로 서 있다</text><text class="ink2 sm" x="214" y="290" text-anchor="middle">x 를 y 로 잰 기울기 0.50 을 이 평면에 그리면 2.00 이 된다</text><rect x="408" y="44" width="296" height="262" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="556" y="63" text-anchor="middle">표준화한 축에서 본 기울기</text><text class="ink2 sm" x="556" y="79" text-anchor="middle">z 단위로 바꾸면 기울기가 곧 r 이다</text><path d="M470 179.84 L628 179.84" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M544.16 254 L544.16 96" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="479.67" y="172.84" text-anchor="middle">−2</text><text class="ink2 sm" x="511.92" y="172.84" text-anchor="middle">−1</text><text class="ink2 sm" x="576.41" y="194.84" text-anchor="middle">1</text><text class="ink2 sm" x="608.65" y="194.84" text-anchor="middle">2</text><text class="ink2 sm" x="538.16" y="248.33" text-anchor="end">−2</text><text class="ink2 sm" x="538.16" y="216.08" text-anchor="end">−1</text><text class="ink2 sm" x="538.16" y="151.59" text-anchor="end">1</text><text class="ink2 sm" x="538.16" y="119.35" text-anchor="end">2</text><path d="M473.22 250.78 L621.55 102.45" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path class="cv s1" d="M473.22 229.49 L621.55 125.67"/><path class="cv s2" stroke-dasharray="5 4" d="M473.22 201.12 L621.55 156.62"/><text class="ink2 sm" x="632" y="106.45" text-anchor="start">r = 1</text><text class="ink bold sm" x="632" y="129.67" text-anchor="start">r = 0.7</text><text class="ink2 sm" x="632" y="160.62" text-anchor="start">r = 0.3</text><path d="M608.65 179.84 L608.65 115.35" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="608.65" cy="115.35" r="3.4" fill="var(--ink2)"/><circle cx="608.65" cy="134.69" r="4.2" fill="var(--s1)"/><circle cx="608.65" cy="160.49" r="3.4" fill="var(--s2)"/><path fill="none" stroke="var(--s2)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar2)" d="M615.1 116.96 L615.1 156.62"/><text class="ink2 sm" x="556" y="276" text-anchor="middle">z<tspan baseline-shift="-22%" font-size="76%">x</tspan> = 2 인 개체의 예측은 2 가 아니라 2r 이다</text><text class="ink2 sm" x="556" y="294" text-anchor="middle">r 이 작을수록 평균 쪽으로 더 눌린다</text><path d="M46 322 L694 322" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="370" y="344" text-anchor="middle">표준화하면 기울기가 곧 r 이 된다. 그래서 회귀계수를 b<tspan baseline-shift="-22%" font-size="76%">1</tspan> = r s<tspan baseline-shift="-22%" font-size="76%">y</tspan> / s<tspan baseline-shift="-22%" font-size="76%">x</tspan> 로 적을 수 있다</text><text class="ink" x="370" y="368" text-anchor="middle">y 를 x 로 잰 기울기 1.70 과 x 를 y 로 잰 기울기 0.50 의 곱이 0.85 = R² 이다</text><text class="ink2 sm" x="370" y="392" text-anchor="middle">SD 선의 기울기는 두 회귀 기울기의 기하평균이다. 어느 쪽을 맞히든 회귀직선은 SD 선보다 완만하다</text>
</svg>