<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">확률변수는 표본공간에서 실수로 가는 함수다</title><desc id="d">동전 두 개의 결과 네 개가 앞면 횟수 0 1 2 로 옮겨진다. 값 하나에 결과 여럿이 모이면 확률이 더해진다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="350" y="30" text-anchor="middle">확률변수 X 는 표본공간의 결과 하나하나에 실수 하나를 붙이는 함수다</text><ellipse cx="130" cy="150" rx="82" ry="94" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><text class="ink" x="130" y="44" text-anchor="middle">표본공간 S</text><circle cx="96" cy="92" r="4" fill="var(--s1)"/><text class="ink" x="110" y="97" text-anchor="start">앞 앞</text><path fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar2)" d="M206 92 L583.43 170"/><circle cx="96" cy="130" r="4" fill="var(--s1)"/><text class="ink" x="110" y="135" text-anchor="start">앞 뒤</text><path fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar2)" d="M206 130 L512 170"/><circle cx="96" cy="168" r="4" fill="var(--s1)"/><text class="ink" x="110" y="173" text-anchor="start">뒤 앞</text><path fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar2)" d="M206 168 L512 170"/><circle cx="96" cy="206" r="4" fill="var(--s1)"/><text class="ink" x="110" y="211" text-anchor="start">뒤 뒤</text><path fill="none" stroke="var(--s2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ar2)" d="M206 206 L440.57 170"/><path d="M420 172 L620 172" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M448.57 166 L448.57 178" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="448.57" y="196" text-anchor="middle">0</text><path d="M520 166 L520 178" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="520" y="196" text-anchor="middle">1</text><path d="M591.43 166 L591.43 178" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="591.43" y="196" text-anchor="middle">2</text><text class="ink" x="520" y="78" text-anchor="middle">실수 — X 가 가지는 값</text><text class="ink2 sm" x="520" y="100" text-anchor="middle">(앞면이 나온 횟수)</text><text class="ink2 sm" x="520" y="220" text-anchor="middle">결과 두 개가 같은 값으로 간다</text><text class="ink bold" x="520" y="240" text-anchor="middle">P(X = 1) = 1/4 + 1/4 = 1/2</text><path d="M48 258 L652 258" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="350" y="282" text-anchor="middle">‘X = 1’ 은 수가 아니라 사건이다. 그 값으로 가는 결과들을 모은 부분집합을 가리킨다</text>
</svg>