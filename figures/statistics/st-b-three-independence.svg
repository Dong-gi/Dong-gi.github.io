<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">쌍마다 독립이지만 셋이 독립은 아닌 예</title><desc id="d">동전 두 개에서 만든 세 사건은 짝마다 곱셈이 성립하지만 셋의 교집합에서는 성립하지 않는다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="360" y="28" text-anchor="middle">동전 두 개. A = 첫째가 앞, B = 둘째가 앞, C = 둘의 면이 같다</text><rect x="76" y="84" width="74" height="74" rx="0" fill="var(--s2)" fill-opacity="0.5" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="113" y="112" text-anchor="middle">앞 앞</text><text class="ink2 sm" x="113" y="132" text-anchor="middle">확률 1/4</text><text class="ink2 sm" x="113" y="150" text-anchor="middle">A B C</text><rect x="150" y="84" width="74" height="74" rx="0" fill="var(--s1)" fill-opacity="0.12" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="187" y="112" text-anchor="middle">앞 뒤</text><text class="ink2 sm" x="187" y="132" text-anchor="middle">확률 1/4</text><text class="ink2 sm" x="187" y="150" text-anchor="middle">A</text><rect x="76" y="158" width="74" height="74" rx="0" fill="var(--s1)" fill-opacity="0.12" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="113" y="186" text-anchor="middle">뒤 앞</text><text class="ink2 sm" x="113" y="206" text-anchor="middle">확률 1/4</text><text class="ink2 sm" x="113" y="224" text-anchor="middle">B</text><rect x="150" y="158" width="74" height="74" rx="0" fill="var(--s1)" fill-opacity="0.12" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink bold" x="187" y="186" text-anchor="middle">뒤 뒤</text><text class="ink2 sm" x="187" y="206" text-anchor="middle">확률 1/4</text><text class="ink2 sm" x="187" y="224" text-anchor="middle">C</text><text class="ink sm" x="150" y="250" text-anchor="middle">세 사건 모두 확률 1/2 이다</text><rect x="258" y="76" width="400" height="28" rx="4" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="268" y="96" text-anchor="start">P(A∩B) = 1/4</text><text class="ink" x="430" y="96" text-anchor="start">P(A)P(B) = 1/4</text><text class="ink2 sm" x="600" y="96" text-anchor="start">같다</text><rect x="258" y="110" width="400" height="28" rx="4" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="268" y="130" text-anchor="start">P(A∩C) = 1/4</text><text class="ink" x="430" y="130" text-anchor="start">P(A)P(C) = 1/4</text><text class="ink2 sm" x="600" y="130" text-anchor="start">같다</text><rect x="258" y="144" width="400" height="28" rx="4" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="268" y="164" text-anchor="start">P(B∩C) = 1/4</text><text class="ink" x="430" y="164" text-anchor="start">P(B)P(C) = 1/4</text><text class="ink2 sm" x="600" y="164" text-anchor="start">같다</text><rect x="258" y="178" width="400" height="28" rx="4" fill="var(--s2)" fill-opacity="0.14" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="268" y="198" text-anchor="start">P(A∩B∩C) = 1/4</text><text class="ink bold" x="430" y="198" text-anchor="start">P(A)P(B)P(C) = 1/8</text><text class="ink bold" x="600" y="198" text-anchor="start">다르다</text><path d="M76 262 L660 262" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="360" y="286" text-anchor="middle">셋을 짝지어 보면 전부 독립인데 셋을 한꺼번에 보면 독립이 아니다</text><text class="ink2 sm" x="360" y="310" text-anchor="middle">A 와 B 를 알면 C 는 완전히 정해진다. 그래서 세 사건의 독립은 짝만으로 정의할 수 없다</text>
</svg>