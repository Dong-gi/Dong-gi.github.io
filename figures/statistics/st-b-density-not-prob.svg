<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">밀도는 확률이 아니다 — 넓이가 확률이다</title><desc id="d">밀도의 높이는 1 을 넘을 수 있고 단위를 바꾸면 값이 달라진다. 변하지 않는 것은 구간 아래의 넓이뿐이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="390" y="30" text-anchor="middle">밀도는 확률이 아니다 — 확률은 넓이다</text><text class="ink bold" x="150" y="62" text-anchor="middle">높이가 1 을 넘어도 된다</text><rect x="82.71" y="113" width="82.82" height="125" rx="0" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.8"/><path class="ax" marker-end="url(#ark)" d="M62 238 H248"/><path class="ax" marker-end="url(#ark)" d="M82.71 238 V78"/><text class="sm ink2" x="165.53" y="253" text-anchor="middle">0.4</text><text class="sm ink2" x="76.71" y="192" text-anchor="end">1</text><text class="sm ink2" x="76.71" y="142" text-anchor="end">2</text><text class="sm ink2" x="76.71" y="92" text-anchor="end">3</text><text class="ink sm" x="124.12" y="101" text-anchor="middle">f(x) = 2.5</text><text class="ink bold" x="124.12" y="175.5" text-anchor="middle">넓이 1</text><text class="ink2 sm" x="150" y="272" text-anchor="middle">0.4 × 2.5 = 1 이므로 넓이는 1 이다.</text><text class="ink2 sm" x="150" y="290" text-anchor="middle">높이 2.5 는 확률일 수 없다.</text><text class="ink bold" x="384" y="62" text-anchor="middle">좁은 띠의 넓이가 확률이다</text><path d="M296 238 L296 235.42 L298.2 234.87 L300.4 234.22 L302.6 233.45 L304.8 232.56 L307 231.53 L309.2 230.34 L311.4 228.97 L313.6 227.42 L315.8 225.65 L318 223.66 L320.2 221.43 L322.4 218.94 L324.6 216.19 L326.8 213.17 L329 209.87 L331.2 206.28 L333.4 202.41 L335.6 198.26 L337.8 193.84 L340 189.18 L342.2 184.28 L344.4 179.18 L346.6 173.92 L348.8 168.52 L351 163.04 L353.2 157.52 L355.4 152.01 L357.6 146.58 L359.8 141.28 L362 136.18 L364.2 131.33 L366.4 126.79 L368.6 122.63 L370.8 118.89 L373 115.64 L375.2 112.91 L377.4 110.75 L379.6 109.18 L381.8 108.23 L384 107.91 L386.2 108.23 L388.4 109.18 L390.6 110.75 L392.8 112.91 L395 115.64 L397.2 118.89 L399.4 122.63 L401.6 126.79 L403.8 131.33 L406 136.18 L408.2 141.28 L410.4 146.58 L412.6 152.01 L414.8 157.52 L417 163.04 L419.2 168.52 L421.4 173.92 L423.6 179.18 L425.8 184.28 L428 189.18 L430.2 193.84 L432.4 198.26 L434.6 202.41 L436.8 206.28 L439 209.87 L441.2 213.17 L443.4 216.19 L445.6 218.94 L447.8 221.43 L450 223.66 L452.2 225.65 L454.4 227.42 L456.6 228.97 L458.8 230.34 L461 231.53 L463.2 232.56 L465.4 233.45 L467.6 234.22 L469.8 234.87 L472 235.42 L472 238 Z" fill="var(--s1)" fill-opacity="0.12" stroke="none"/><rect x="402.86" y="143.54" width="12.57" height="94.46" rx="0" fill="var(--s2)" fill-opacity="0.55" stroke="var(--s2)" stroke-width="1.2"/><path class="ax" marker-end="url(#ark)" d="M296 238 H482"/><path class="ax" marker-end="url(#ark)" d="M296 238 V78"/><text class="sm ink2" x="321.14" y="253" text-anchor="middle">1</text><text class="sm ink2" x="384" y="253" text-anchor="middle">3</text><text class="sm ink2" x="446.86" y="253" text-anchor="middle">5</text><path class="cv s2" d="M297.57 235.03 L299.01 234.64 L300.45 234.2 L301.89 233.71 L303.33 233.17 L304.77 232.58 L306.21 231.92 L307.65 231.19 L309.1 230.4 L310.54 229.53 L311.98 228.58 L313.42 227.55 L314.86 226.43 L316.3 225.22 L317.74 223.91 L319.18 222.49 L320.62 220.97 L322.06 219.34 L323.5 217.6 L324.94 215.74 L326.38 213.77 L327.82 211.67 L329.26 209.45 L330.7 207.11 L332.14 204.65 L333.58 202.07 L335.02 199.37 L336.46 196.55 L337.9 193.63 L339.35 190.59 L340.79 187.45 L342.23 184.22 L343.67 180.9 L345.11 177.51 L346.55 174.04 L347.99 170.52 L349.43 166.96 L350.87 163.37 L352.31 159.75 L353.75 156.14 L355.19 152.54 L356.63 148.96 L358.07 145.43 L359.51 141.97 L360.95 138.58 L362.39 135.29 L363.83 132.11 L365.27 129.07 L366.71 126.17 L368.15 123.44 L369.6 120.88 L371.04 118.52 L372.48 116.37 L373.92 114.44 L375.36 112.74 L376.8 111.28 L378.24 110.08 L379.68 109.13 L381.12 108.46 L382.56 108.05 L384 107.91 L385.44 108.05 L386.88 108.46 L388.32 109.13 L389.76 110.08 L391.2 111.28 L392.64 112.74 L394.08 114.44 L395.52 116.37 L396.96 118.52 L398.4 120.88 L399.85 123.44 L401.29 126.17 L402.73 129.07 L404.17 132.11 L405.61 135.29 L407.05 138.58 L408.49 141.97 L409.93 145.43 L411.37 148.96 L412.81 152.54 L414.25 156.14 L415.69 159.75 L417.13 163.37 L418.57 166.96 L420.01 170.52 L421.45 174.04 L422.89 177.51 L424.33 180.9 L425.77 184.22 L427.21 187.45 L428.65 190.59 L430.1 193.63 L431.54 196.55 L432.98 199.37 L434.42 202.07 L435.86 204.65 L437.3 207.11 L438.74 209.45 L440.18 211.67 L441.62 213.77 L443.06 215.74 L444.5 217.6 L445.94 219.34 L447.38 220.97 L448.82 222.49 L450.26 223.91 L451.7 225.22 L453.14 226.43 L454.58 227.55 L456.02 228.58 L457.46 229.53 L458.9 230.4 L460.35 231.19 L461.79 231.92 L463.23 232.58 L464.67 233.17 L466.11 233.71 L467.55 234.2 L468.99 234.64 L470.43 235.03"/><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M461.43 140.17 L418.29 139.54"/><text class="ink sm" x="465.43" y="144.17" text-anchor="start">넓이</text><text class="ink bold" x="384" y="272" text-anchor="middle">P(x ≤ X ≤ x+Δx) ≈ f(x) Δx</text><text class="ink2 sm" x="384" y="290" text-anchor="middle">밀도에 너비를 곱해야 확률이 된다.</text><text class="ink bold" x="628" y="62" text-anchor="middle">자를 바꾸면 높이가 바뀐다</text><rect x="573.85" y="138" width="67.69" height="100" rx="0" fill="var(--s1)" fill-opacity="0.3" stroke="var(--s1)" stroke-width="1.8"/><path class="ax" marker-end="url(#ark)" d="M540 238 H726"/><path class="ax" marker-end="url(#ark)" d="M560.31 238 V78"/><text class="sm ink2" x="628" y="253" text-anchor="middle">0.5</text><text class="sm ink2" x="695.69" y="253" text-anchor="middle">1</text><text class="sm ink2" x="554.31" y="192" text-anchor="end">1</text><text class="sm ink2" x="554.31" y="142" text-anchor="end">2</text><text class="sm ink2" x="554.31" y="92" text-anchor="end">3</text><text class="ink sm" x="607.69" y="126" text-anchor="middle">f(x) = 2.0  (단위 1/m)</text><text class="ink bold" x="607.69" y="188" text-anchor="middle">넓이 1</text><text class="ink2 sm" x="628" y="272" text-anchor="middle">같은 분포를 cm 로 재면 높이는 0.02 다.</text><text class="ink2 sm" x="628" y="290" text-anchor="middle">그래도 넓이는 여전히 1 이다.</text><path d="M62 308 L716 308" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="390" y="330" text-anchor="middle">세 칸이 같은 말을 한다. 밀도의 높이 하나만으로는 아무 확률도 읽을 수 없다</text><text class="ink" x="390" y="354" text-anchor="middle">읽을 수 있는 것은 구간을 정한 뒤의 넓이뿐이다. 그래서 P(X = c) = 0 이 되어도 모순이 없다</text><text class="ink2 sm" x="390" y="380" text-anchor="middle">밀도가 두 배 높다는 말은 ‘그 근처가 두 배 잘 나온다’는 뜻이지 ‘확률이 두 배’라는 뜻이 아니다</text>
</svg>