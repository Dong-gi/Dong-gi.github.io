"var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="311" y="87.33" text-anchor="middle">6</text><rect x="335.28" y="117.94" width="29.77" height="118.06" rx="1" fill="var(--s1)" fill-opacity="0.45" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="350.17" y="110.94" text-anchor="middle">5</text><rect x="374.45" y="141.56" width="29.77" height="94.44" rx="1" fill="var(--s1)" fill-opacity="0.45" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="389.33" y="134.56" text-anchor="middle">4</text><rect x="413.62" y="165.17" width="29.76" height="70.83" rx="1" fill="var(--s1)" fill-opacity="0.45" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="428.5" y="158.17" text-anchor="middle">3</text><rect x="452.78" y="188.78" width="29.77" height="47.22" rx="1" fill="var(--s1)" fill-opacity="0.45" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="467.67" y="181.78" text-anchor="middle">2</text><rect x="491.95" y="212.39" width="29.77" height="23.61" rx="1" fill="var(--s1)" fill-opacity="0.45" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="506.83" y="205.39" text-anchor="middle">1</text><text class="ink bold" x="311" y="44" text-anchor="middle">주사위 두 개의 합 X — 확률질량함수 p(x)</text><text class="ink2 sm" x="311" y="274" text-anchor="middle">x (두 눈의 합)</text><text class="ink2 sm" x="72" y="52" text-anchor="middle">p(x)</text><text class="ink2 sm" x="566" y="96" text-anchor="start">막대 위의 수는</text><text class="ink2 sm" x="566" y="116" text-anchor="start">그 합을 만드는</text><text class="ink2 sm" x="566" y="136" text-anchor="start">칸의 개수다.</text><text class="ink2 sm" x="566" y="166" text-anchor="start">모두 더하면 36,</text><text class="ink bold" x="566" y="186" text-anchor="start">확률의 합은 1 이다.</text><path d="M76 292 L648 292" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="350" y="316" text-anchor="middle">이산확률변수에서는 막대의 높이가 그대로 확률이다. p(x) ≥ 0 이고 높이를 다 더하면 1 이다</text><text class="ink2 sm" x="350" y="340" text-anchor="middle">값 사이의 자리(예컨대 4.5)에는 막대가 없다. 그 값은 나오지 않는다</text>
