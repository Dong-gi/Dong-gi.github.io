<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" width="700" height="356" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">확률질량함수 — 주사위 두 개의 합</title><desc id="d">합 2 부터 12 까지의 확률을 막대로 그린 것. 7 에서 가장 높고 높이의 합은 1 이다</desc>
<style>
