<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 386" width="740" height="386" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">모집단에서 표본으로, 표본에서 표본분포로</title><desc id="d">치우친 모집단에서 크기 5 인 표본을 여러 번 뽑으면 표본평균이 표본마다 다르고, 그 값들이 이루는 분포가 표본분포다</desc>
