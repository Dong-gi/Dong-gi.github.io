<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="360" y="28" text-anchor="middle">두 변수를 함께 보면 표 하나가 된다. 가장자리 합이 주변분포다</text><text class="ink bold" x="176" y="84" text-anchor="middle">x = 0</text><text class="ink bold" x="268" y="84" text-anchor="middle">x = 1</text><text class="ink bold" x="360" y="84" text-anchor="middle">x = 2</text><text class="ink bold" x="118" y="124" text-anchor="end">y = 0</text><text class="ink bold" x="118" y="170" text-anchor="end">y = 1</text><text class="ink bold" x="118" y="216" text-anchor="end">y = 2</text><rect x="130" y="96" width="92" height="46" rx="0" fill="var(--s1)" fill-opacity="0.24000000000000005" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="176" y="125" text-anchor="middle">0.10</text><rect x="222" y="96" width="92" height="46" rx="0" fill="var(--s1)" fill-opacity="0.16000000000000003" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="268" y="125" text-anchor="middle">0.05</text><rect x="314" y="96" width="92" height="46" rx="0" fill="var(--s1)" fill-opacity="0.16000000000000003" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="360" y="125" text-anchor="middle">0.05</text><rect x="130" y="142" width="92" height="46" rx="0" fill="var(--s1)" fill-opacity="0.20800000000000002" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="176" y="171" text-anchor="middle">0.08</text><rect x="222" y="142" width="92" height="46" rx="0" fill="var(--s1)" fill-opacity="0.4000000000000001" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="268" y="171" text-anchor="middle">0.20</text><rect x="314" y="142" width="92" height="46" rx="0" fill="var(--s1)" fill-opacity="0.272" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="360" y="171" text-anchor="middle">0.12</text><rect x="130" y="188" width="92" height="46" rx="0" fill="var(--s1)" fill-opacity="0.112" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="176" y="217" text-anchor="middle">0.02</text><rect x="222" y="188" width="92" height="46" rx="0" fill="var(--s1)" fill-opacity="0.32" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="268" y="217" text-anchor="middle">0.15</text><rect x="314" y="188" width="92" height="46" rx="0" fill="var(--s1)" fill-opacity="0.44800000000000006" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="360" y="217" text-anchor="middle">0.23</text><rect x="130" y="96" width="276" height="138" rx="0" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.5"/><rect x="130" y="242" width="92" height="34" rx="3" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.2"/><text class="ink bold" x="176" y="264" text-anchor="middle">0.20</text><rect x="222" y="242" width="92" height="34" rx="3" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.2"/><text class="ink bold" x="268" y="264" text-anchor="middle">0.40</text><rect x="314" y="242" width="92" height="34" rx="3" fill="var(--s2)" fill-opacity="0.18" stroke="var(--s2)" stroke-width="1.2"/><text class="ink bold" x="360" y="264" text-anchor="middle">0.40</text><rect x="414" y="102" width="66" height="34" rx="3" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold" x="447" y="124" text-anchor="middle">0.20</text><rect x="414" y="148" width="66" height="34" rx="3" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold" x="447" y="170" text-anchor="middle">0.40</text><rect x="414" y="194" width="66" height="34" rx="3" fill="var(--s3)" fill-opacity="0.2" stroke="var(--s3)" stroke-width="1.2"/><text class="ink bold" x="447" y="216" text-anchor="middle">0.40</text><text class="ink2 sm" x="268" y="298" text-anchor="middle">X 의 주변분포 g(x) — 세로로 더한 것</text><text class="ink2 sm" x="447" y="84" text-anchor="middle">Y 의 주변</text><text class="ink bold" x="447" y="264" text-anchor="middle">1.00</text><text class="ink2 sm" x="447" y="298" text-anchor="middle">전체 합</text><path d="M62 316 L660 316" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="360" y="342" text-anchor="middle">주변분포는 관심 없는 변수를 더해서 지운 것이다. 표의 가장자리에 적어서 붙은 이름이다</text><text class="ink2 sm" x="360" y="366" text-anchor="middle">주변분포만 보아서는 두 변수의 관계를 알 수 없다. 그 정보는 표 안쪽에 있다</text>
</svg>