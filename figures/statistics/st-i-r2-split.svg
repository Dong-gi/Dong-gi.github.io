<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">분산 분해와 결정계수</title><desc id="d">한 점의 편차를 설명된 몫과 남은 몫으로 쪼개고, 제곱해 더하면 총제곱합이 두 조각으로 나뉜다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="370" y="24" text-anchor="middle">한 점의 편차를 두 조각으로 쪼갠다. 직선이 설명한 몫과 남은 몫</text><rect x="36" y="44" width="372" height="236" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="222" y="63" text-anchor="middle">점 하나에서 본 분해</text><text class="ink2 sm" x="222" y="79" text-anchor="middle">(y − ȳ) = (ŷ − ȳ) + (y − ŷ)</text><path class="ax" marker-end="url(#ark)" d="M82 214 H392"/><path class="ax" marker-end="url(#ark)" d="M82 214 V82"/><text class="ink2 sm" x="116.43" y="230" text-anchor="middle">1</text><text class="ink2 sm" x="165.61" y="230" text-anchor="middle">2</text><text class="ink2 sm" x="214.79" y="230" text-anchor="middle">3</text><text class="ink2 sm" x="263.97" y="230" text-anchor="middle">4</text><text class="ink2 sm" x="313.15" y="230" text-anchor="middle">5</text><text class="ink2 sm" x="76" y="196.78" text-anchor="end">2</text><text class="ink2 sm" x="76" y="175.57" text-anchor="end">4</text><text class="ink2 sm" x="76" y="154.35" text-anchor="end">6</text><text class="ink2 sm" x="76" y="133.13" text-anchor="end">8</text><text class="ink2 sm" x="76" y="111.91" text-anchor="end">10</text><path d="M82 150.35 L382 150.35" fill="none" stroke="var(--ink2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink2 sm" x="89.38" y="143.35" text-anchor="start">ȳ = 6</text><path class="cv s1" d="M82 199.04 L362.33 96.24"/><circle cx="116.43" cy="182.17" r="3.6" fill="var(--ink)"/><circle cx="165.61" cy="160.96" r="3.6" fill="var(--ink)"/><circle cx="214.79" cy="171.57" r="3.6" fill="var(--ink)"/><circle cx="263.97" cy="129.13" r="3.6" fill="var(--ink)"/><circle cx="313.15" cy="107.91" r="3.6" fill="var(--ink)"/><path d="M333.8 150.35 L333.8 107.91" fill="none" stroke="var(--ink2)" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink bold sm" x="333.8" y="100.91" text-anchor="middle">4.0</text><path d="M353.48 150.35 L353.48 114.28" fill="none" stroke="var(--s1)" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink bold sm" x="353.48" y="107.28" text-anchor="middle">3.4</text><path d="M373.15 114.28 L373.15 107.91" fill="none" stroke="var(--s2)" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="round"/><text class="ink bold sm" x="373.15" y="100.91" text-anchor="middle">0.6</text><circle cx="313.15" cy="107.91" r="4.6" fill="var(--ink)"/><circle cx="313.15" cy="114.28" r="3.4" fill="var(--s1)"/><text class="ink2 sm" x="214" y="252" text-anchor="middle">막대는 왼쪽부터 회색 전체 · 파랑 설명된 · 주황 남은</text><text class="ink bold sm" x="214" y="272" text-anchor="middle">전체 = 설명된 + 남은,  4.0 = 3.4 + 0.6</text><rect x="424" y="44" width="280" height="236" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="564" y="63" text-anchor="middle">제곱해 모두 더하면</text><text class="ink2 sm" x="564" y="79" text-anchor="middle">교차항이 0 이어서 그대로 쪼개진다</text><rect x="462" y="106" width="200" height="30" rx="3" fill="var(--s1)" fill-opacity="0.35" stroke="var(--s1)" stroke-width="1"/><text class="ink bold sm" x="562" y="126" text-anchor="middle">SST = 34.0</text><rect x="462" y="150" width="170" height="30" rx="3" fill="var(--s3)" fill-opacity="0.4" stroke="var(--s3)" stroke-width="1"/><rect x="632" y="150" width="30" height="30" rx="3" fill="var(--s2)" fill-opacity="0.4" stroke="var(--s2)" stroke-width="1"/><text class="ink bold sm" x="547" y="170" text-anchor="middle">SSR 28.9</text><text class="ink bold sm" x="647" y="198" text-anchor="middle">SSE 5.1</text><text class="ink bold" x="564" y="230" text-anchor="middle">R² = SSR/SST = 0.85</text><text class="ink2 sm" x="564" y="254" text-anchor="middle">흩어짐의 85% 를 직선이 설명한다</text><path d="M46 294 L694 294" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="370" y="316" text-anchor="middle">R² 은 ‘y 의 흩어짐 가운데 x 로 설명되는 몫’ 이다. 0 과 1 사이이고 단위가 없다</text><text class="ink2 sm" x="370" y="340" text-anchor="middle">R² 이 크다는 것이 인과를 뜻하지도, 모형이 옳다는 것을 뜻하지도 않는다</text>
</svg>