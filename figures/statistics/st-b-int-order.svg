" text-anchor="middle">같다</text><path d="M66 274 L656 274" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="360" y="298" text-anchor="middle">영역이 직사각형이고 적분 범위가 상수이면 순서를 자유롭게 바꿔도 된다</text><text class="ink2 sm" x="360" y="318" text-anchor="middle">영역이 비스듬하면 안쪽 적분의 범위에 바깥 변수가 들어가고, 그때는 순서를 바꿀 때 범위를 다시 읽어야 한다</text>
