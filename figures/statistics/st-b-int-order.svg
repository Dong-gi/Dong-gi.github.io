<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="360" y="28" text-anchor="middle">직사각형 영역에서는 어느 쪽을 먼저 적분해도 답이 같다</text><text class="ink" x="170" y="62" text-anchor="middle">세로로 잘라 y 부터</text><rect x="87.72" y="113.5" width="144.83" height="93.75" rx="0" fill="var(--s1)" fill-opacity="0.16" stroke="var(--s1)" stroke-width="1.6"/><rect x="87.72" y="113.5" width="18.11" height="93.75" rx="0" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="0.9"/><rect x="105.83" y="113.5" width="18.1" height="93.75" rx="0" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="0.9"/><rect x="123.93" y="113.5" width="18.1" height="93.75" rx="0" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="0.9"/><rect x="142.03" y="113.5" width="18.11" height="93.75" rx="0" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="0.9"/><rect x="160.14" y="113.5" width="18.1" height="93.75" rx="0" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="0.9"/><rect x="178.24" y="113.5" width="18.1" height="93.75" rx="0" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="0.9"/><rect x="196.34" y="113.5" width="18.11" height="93.75" rx="0" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="0.9"/><rect x="214.45" y="113.5" width="18.1" height="93.75" rx="0" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-width="0.9"/><path fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)" d="M142.03 201 L142.03 119.75"/><path class="ax" marker-end="url(#ark)" d="M66 207.25 H286"/><path class="ax" marker-end="url(#ark)" d="M87.72 226 V66"/><text class="sm ink2" x="160.14" y="222.25" text-anchor="middle">1</text><text class="sm ink2" x="232.55" y="222.25" text-anchor="middle">2</text><text class="sm ink2" x="81.72" y="148.75" text-anchor="end">1</text><text class="ink2 sm" x="2