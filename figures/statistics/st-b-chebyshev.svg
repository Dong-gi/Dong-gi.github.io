" text-anchor="start">0.111</text><text class="ink" x="566" y="160" text-anchor="start">0.0027</text><text class="ink2 sm" x="654" y="160" text-anchor="start">0</text><rect x="392" y="172" width="320" height="26" rx="3" fill="none" fill-opacity="0" stroke="var(--grid)" stroke-width="1"/><text class="ink" x="404" y="192" text-anchor="start">4</text><text class="ink" x="432" y="192" text-anchor="start">0.0625</text><text class="ink" x="566" y="192" text-anchor="start">0.00006</text><text class="ink2 sm" x="654" y="192" text-anchor="start">0</text><text class="ink2 sm" x="552" y="240" text-anchor="middle">상한이 실제보다 다섯 배에서 천 배까지 크다</text><path d="M66 278 L712 278" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="380" y="302" text-anchor="middle">P(|X − μ| ≥ kσ) ≤ 1/k² — 분포의 모양을 하나도 가정하지 않고 얻은 결과다</text><text class="ink" x="380" y="326" text-anchor="middle">모양을 알면 훨씬 좋은 답을 낼 수 있다. 모양을 모를 때에도 쓸 수 있다는 것이 이 부등식의 값어치다</text><text class="ink2 sm" x="380" y="350" text-anchor="middle">k ≤ 1 이면 상한이 1 이상이라 아무 말도 하지 않는다</text>
