<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 366" width="740" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">산점도, 최소제곱 직선, 잔차</title><desc id="d">자료 다섯 점과 최소제곱 직선, 각 점의 세로 방향 잔차. 최소제곱이 줄이는 것은 수직 거리가 아니라 세로 거리다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="370" y="24" text-anchor="middle">직선을 고르는 기준은 ‘세로 거리의 제곱합을 가장 작게’ 다</text><rect x="36" y="44" width="356" height="228" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="214" y="63" text-anchor="middle">자료와 최소제곱 직선</text><text class="ink2 sm" x="214" y="79" text-anchor="middle">점선이 잔차 — 관측값에서 직선까지의 세로 거리</text><path class="ax" marker-end="url(#ark)" d="M84 210 H376"/><path class="ax" marker-end="url(#ark)" d="M84 210 V82"/><text class="ink2 sm" x="120.56" y="226" text-anchor="middle">1</text><text class="ink2 sm" x="172.78" y="226" text-anchor="middle">2</text><text class="ink2 sm" x="225" y="226" text-anchor="middle">3</text><text class="ink2 sm" x="277.22" y="226" text-anchor="middle">4</text><text class="ink2 sm" x="329.44" y="226" text-anchor="middle">5</text><text class="ink2 sm" x="78" y="193.48" text-anchor="end">2</text><text class="ink2 sm" x="78" y="172.96" text-anchor="end">4</text><text class="ink2 sm" x="78" y="152.43" text-anchor="end">6</text><text class="ink2 sm" x="78" y="131.91" text-anchor="end">8</text><text class="ink2 sm" x="78" y="111.39" text-anchor="end">10</text><path class="cv s1" d="M84 195.53 L366 101.34"/><path d="M120.56 179.22 L120.56 183.32" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="120.56" cy="179.22" r="4" fill="var(--ink)"/><circle cx="120.56" cy="183.32" r="2.6" fill="var(--s1)"/><text class="ink2 sm" x="127.56" y="185.27" text-anchor="start">+0.4</text><path d="M172.78 158.7 L172.78 165.88" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="172.78" cy="158.7" r="4" fill="var(--ink)"/><circle cx="172.78" cy="165.88" r="2.6" fill="var(--s1)"/><text class="ink2 sm" x="179.78" y="166.29" text-anchor="start">+0.7</text><path d="M225 168.96 L225 148.43" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="225" cy="168.96" r="4" fill="var(--ink)"/><circle cx="225" cy="148.43" r="2.6" fill="var(--s1)"/><text class="ink2 sm" x="232" y="162.7" text-anchor="start">−2.0</text><path d="M277.22 127.91 L277.22 130.99" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="277.22" cy="127.91" r="4" fill="var(--ink)"/><circle cx="277.22" cy="130.99" r="2.6" fill="var(--s1)"/><text class="ink2 sm" x="284.22" y="133.45" text-anchor="start">+0.3</text><path d="M329.44 107.39 L329.44 113.55" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="329.44" cy="107.39" r="4" fill="var(--ink)"/><circle cx="329.44" cy="113.55" r="2.6" fill="var(--s1)"/><text class="ink2 sm" x="336.44" y="114.47" text-anchor="start">+0.6</text><text class="ink bold sm" x="214" y="254" text-anchor="middle">ŷ = 0.9 + 1.7x,  잔차제곱합 5.1</text><rect x="408" y="44" width="296" height="228" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="556" y="63" text-anchor="middle">왜 세로 거리인가</text><text class="ink2 sm" x="556" y="79" text-anchor="middle">x 로 y 를 맞히는 것이 목적이다</text><path class="cv s1" d="M456.16 215.09 L655.84 133.64"/><path d="M510.24 121.76 L510.24 193.03" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.24 121.76 L597.6 157.39" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="510.24" cy="121.76" r="4.5" fill="var(--ink)"/><text class="ink bold sm" x="505.25" y="150.61" text-anchor="end">세로 거리</text><text class="ink2 sm" x="505.25" y="166.61" text-anchor="end">이것을 줄인다</text><text class="ink2 sm" x="566.4" y="109.88" text-anchor="start">수직 거리</text><text class="ink2 sm" x="566.4" y="125.88" text-anchor="start">이것이 아니다</text><text class="ink2 sm" x="556" y="254" text-anchor="middle">x 는 정확히 안다고 보고 y 의 오차만 센다</text><path d="M46 288 L694 288" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="370" y="310" text-anchor="middle">잔차의 합은 언제나 0 이다. 그래서 잔차를 그냥 더해 좋은 직선을 고를 수는 없다</text><text class="ink" x="370" y="332" text-anchor="middle">절댓값을 쓰는 방법도 있지만 제곱을 쓰면 미분이 되고 답이 식으로 나온다</text><text class="ink2 sm" x="370" y="356" text-anchor="middle">대가는 제곱이 큰 잔차를 크게 벌준다는 것 — 이상점 하나에 끌려가기 쉽다</text>
</svg>