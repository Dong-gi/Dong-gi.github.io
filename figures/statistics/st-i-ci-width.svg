<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 348" width="740" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">신뢰구간의 폭을 정하는 것 — 신뢰수준과 표본 크기</title><desc id="d">신뢰수준을 올리면 구간이 넓어지고 표본을 늘리면 좁아진다. 폭은 표본 크기의 제곱근에 반비례한다</desc>
