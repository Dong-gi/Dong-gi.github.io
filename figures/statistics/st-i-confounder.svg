"var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="370" y="310" text-anchor="middle">층 안에서는 상관이 사라졌다. 두 변수를 함께 움직인 것은 X 가 아니라 Z 였다</text><text class="ink" x="370" y="334" text-anchor="middle">상관이 인과가 아닌 세 가지 이유 — 방향이 반대일 수 있다, 교란변수가 있을 수 있다, 우연일 수 있다</text><text class="ink2 sm" x="370" y="358" text-anchor="middle">인과를 말하려면 무작위 배정 실험을 하거나 교란변수를 찾아 통제해야 한다</text><text class="ink2 sm" x="370" y="380" text-anchor="middle">3장의 심슨의 역설이 바로 이 구조이며, 거기서는 층을 나눌 때 부호까지 뒤집혔다</text>
