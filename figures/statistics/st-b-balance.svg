<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 348" width="700" height="348" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">기댓값은 확률분포의 무게중심이다</title><desc id="d">막대의 높이를 무게로 보면 균형이 잡히는 자리가 기댓값이다. 편차에 확률을 곱해 더하면 0 이 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><path class="ax" marker-end="url(#ark)" d="M92 226 H502"/><path class="ax" marker-end="url(#ark)" d="M92 226 V66"/><text class="ink2 sm" x="143.85" y="242" text-anchor="middle">1</text><text class="ink2 sm" x="217.93" y="242" text-anchor="middle">2</text><text class="ink2 sm" x="292" y="242" text-anchor="middle">3</text><text class="ink2 sm" x="366.07" y="242" text-anchor="middle">4</text><text class="ink2 sm" x="440.15" y="242" text-anchor="middle">5</text><text class="ink2 sm" x="86" y="194.29" text-anchor="end">0.1</text><text class="ink2 sm" x="86" y="158.57" text-anchor="end">0.2</text><text class="ink2 sm" x="86" y="122.86" text-anchor="end">0.3</text><rect x="126.07" y="190.29" width="35.56" height="35.71" rx="1" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="143.85" y="183.29" text-anchor="middle">0.10</text><rect x="200.15" y="172.43" width="35.55" height="53.57" rx="1" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="217.93" y="165.43" text-anchor="middle">0.15</text><rect x="274.22" y="154.57" width="35.56" height="71.43" rx="1" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="292" y="147.57" text-anchor="middle">0.20</text><rect x="348.3" y="101" width="35.55" height="125" rx="1" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="366.07" y="94" text-anchor="middle">0.35</text><rect x="422.37" y="154.57" width="35.56" height="71.43" rx="1" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.2"/><text class="ink2 sm" x="440.15" y="147.57" text-anchor="middle">0.20</text><path d="M92 232 L492 232" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.63 234 L308.63 256 L334.63 256 Z" fill="var(--s2)" fill-opacity="0.75"/><text class="ink bold" x="321.63" y="272" text-anchor="middle">받침점 μ = 3.40</text><text class="ink bold" x="292" y="52" text-anchor="middle">기댓값은 확률을 무게로 본 막대의 균형점이다</text><text class="ink bold" x="520" y="96" text-anchor="start">E(X) = Σ x p(x)</text><text class="ink2 sm" x="520" y="122" text-anchor="start">= 1(0.1) + 2(0.15)</text><text class="ink2 sm" x="520" y="142" text-anchor="start">  + 3(0.2) + 4(0.35)</text><text class="ink2 sm" x="520" y="162" text-anchor="start">  + 5(0.2) = 3.4</text><text class="ink2 sm" x="520" y="192" text-anchor="start">값이 나올 자리는 아니다.</text><path d="M92 290 L652 290" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="350" y="314" text-anchor="middle">받침점을 다른 곳에 두면 막대가 기운다. 그 기울어진 정도의 합이 0 이 되는 곳이 기댓값이다</text><text class="ink2 sm" x="350" y="338" text-anchor="middle">즉 Σ (x − μ) p(x) = 0 이다. 평균에서의 편차는 확률로 가중하면 서로 지워진다</text>
</svg>