<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><rect x="70" y="74" width="221.25" height="58" rx="0" fill="var(--s1)" fill-opacity="0.12" stroke="none" stroke-width="1.5"/><path d="M60 132 L676 132" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M660 132 L682 132"/><text class="ink2 sm" x="688" y="137" text-anchor="start">시간</text><path d="M121.63 116 L121.63 148" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="121.63" cy="116" r="3.4" fill="var(--s2)"/><path d="M180.63 116 L180.63 148" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180.63" cy="116" r="3.4" fill="var(--s2)"/><path d="M232.25 116 L232.25 148" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="232.25" cy="116" r="3.4" fill="var(--s2)"/><path d="M357.63 116 L357.63 148" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="357.63" cy="116" r="3.4" fill="var(--s2)"/><path d="M401.88 116 L401.88 148" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="401.88" cy="116" r="3.4" fill="var(--s2)"/><path d="M468.25 116 L468.25 148" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="468.25" cy="116" r="3.4" fill="var(--s2)"/><path d="M601 116 L601 148" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="601" cy="116" r="3.4" fill="var(--s2)"/><path d="M70 132 L70 138" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M143.75 132 L143.75 138" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M217.5 132 L217.5 138" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M291.25 132 L291.25 138" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M365 132 L365 138" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M438.75 132 L438.75 138" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M512.5 132 L512.5 138" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M586.25 132 L586.25 138" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M660 132 L660 138" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="70" y="154" text-anchor="middle">0</text><text class="ink2 sm" x="217.5" y="154" text-anchor="middle">2</text><text class="ink2 sm" x="365" y="154" text-anchor="middle">4</text><text class="ink2 sm" x="512.5" y="154" text-anchor="middle">6</text><text class="ink2 sm" x="660" y="154" text-anchor="middle">8</text><path d="M70 74 L291.25 74" fill="none" stroke="var(--s1)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink bold sm" x="180.63" y="66" text-anchor="middle">구간 [0, 3] 안의 사건 수 = 3 → 푸아송 분포 (평균 3λ)</text><path fill="none" stroke="var(--s3)" stroke-width="1.4" marker-start="url(#ar3)" marker-end="url(#ar3)" d="M70 178 L121.63 178"/><text class="ink sm" x="95.81" y="195" text-anchor="middle">첫 사건까지</text><path fill="none" stroke="var(--s3)" stroke-width="1.4" marker-start="url(#ar3)" marker-end="url(#ar3)" d="M121.63 178 L180.63 178"/><text class="ink sm" x="151.13" y="195" text-anchor="middle">다음까지</text><path fill="none" stroke="var(--s3)" stroke-width="1.4" marker-start="url(#ar3)" marker-end="url(#ar3)" d="M180.63 178 L232.25 178"/><text class="ink sm" x="206.44" y="195" text-anchor="middle">그다음</text><text class="ink bold sm" x="409.25" y="183" text-anchor="start">간격 하나하나 → 지수분포 (평균 1/λ)</text><path fill="none" stroke="var(--s2)" stroke-width="1.4" marker-start="url(#ar2)" marker-end="url(#ar2)" d="M70 226 L232.25 226"/><text class="ink bold sm" x="52" y="248" text-anchor="start">세 번째 사건이 일어날 때까지의 시간 → 감마분포 (α = 3)</text><path d="M52 272 L688 272" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="370" y="296" text-anchor="middle">같은 하나의 그림을 세 가지로 읽은 것이다. 세는 것을 바꾸면 분포가 바뀐다</text><text class="ink2 sm" x="370" y="322" text-anchor="middle">사건이 서로 독립이고 발생률 λ 가 일정하다는 가정이 셋 모두의 뿌리다</text><text class="ink bold" x="52" y="40" text-anchor="start">푸아송 과정 — 시간 위에 흩어진 사건들</text>
</svg>