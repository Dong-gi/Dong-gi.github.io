<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="720" height="366" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">E[g(X)] 는 X 의 분포로 바로 계산한다</title><desc id="d">g 를 씌우면 값이 옮겨 가고 겹칠 수 있지만 확률은 따라간다. 그래서 원래 분포로 곧장 더해도 된다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="360" y="28" text-anchor="middle">g(X) 의 기댓값을 구하려고 g(X) 의 분포를 새로 만들 필요는 없다</text><text class="ink" x="184" y="64" text-anchor="middle">X 의 분포</text><rect x="91.29" y="114.67" width="16.85" height="73.33" rx="1" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.2"/><rect x="133.43" y="114.67" width="16.86" height="73.33" rx="1" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.2"/><rect x="175.57" y="114.67" width="16.86" height="73.33" rx="1" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.2"/><rect x="217.71" y="114.67" width="16.86" height="73.33" rx="1" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.2"/><rect x="259.86" y="114.67" width="16.85" height="73.33" rx="1" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.2"/><path class="ax" marker-end="url(#ark)" d="M66 188 H312"/><path class="ax" marker-end="url(#ark)" d="M66 188 V68"/><text class="ink2 sm" x="99.71" y="204" text-anchor="middle">-2</text><text class="ink2 sm" x="141.86" y="204" text-anchor="middle">-1</text><text class="ink2 sm" x="184" y="204" text-anchor="middle">0</text><text class="ink2 sm" x="226.14" y="204" text-anchor="middle">1</text><text class="ink2 sm" x="268.29" y="204" text-anchor="middle">2</text><text class="ink2 sm" x="184" y="226" text-anchor="middle">다섯 값이 모두 확률 0.2</text><text class="ink" x="538" y="64" text-anchor="middle">Y = X² 의 분포</text><rect x="445.29" y="151.33" width="16.85" height="36.67" rx="1" fill="var(--s2)" fill-opacity="0.4" stroke="var(--s2)" stroke-width="1.2"/><rect x="487.43" y="114.67" width="16.86" height="73.33" rx="1" fill="var(--s2)" fill-opacity="0.4" stroke="var(--s2)" stroke-width="1.2"/><rect x="613.86" y="114.67" width="16.85" height="73.33" rx="1" fill="var(--s2)" fill-opacity="0.4" stroke="var(--s2)" stroke-width="1.2"/><path class="ax" marker-end="url(#ark)" d="M420 188 H666"/><path class="ax" marker-end="url(#ark)" d="M420 188 V68"/><text class="ink2 sm" x="453.71" y="204" text-anchor="middle">0</text><text class="ink2 sm" x="495.86" y="204" text-anchor="middle">1</text><text class="ink2 sm" x="538" y="204" text-anchor="middle">2</text><text class="ink2 sm" x="580.14" y="204" text-anchor="middle">3</text><text class="ink2 sm" x="622.29" y="204" text-anchor="middle">4</text><text class="ink2 sm" x="538" y="226" text-anchor="middle">−1 과 1 이 같은 자리로 겹친다</text><path fill="none" stroke="var(--ink2)" stroke-width="0.9" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="3 3" d="M99.71 248 L622.29 248"/><path fill="none" stroke="var(--ink2)" stroke-width="0.9" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="3 3" d="M141.86 248 L495.86 248"/><path fill="none" stroke="var(--ink2)" stroke-width="0.9" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="3 3" d="M184 248 L453.71 248"/><path fill="none" stroke="var(--ink2)" stroke-width="0.9" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="3 3" d="M226.14 248 L495.86 248"/><path fill="none" stroke="var(--ink2)" stroke-width="0.9" stroke-linecap="round" marker-end="url(#ark)" stroke-dasharray="3 3" d="M268.29 248 L622.29 248"/><text class="ink bold" x="360" y="274" text-anchor="middle">두 길이 같은 답을 준다</text><path d="M66 292 L656 292" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="360" y="316" text-anchor="middle">새 분포로: 0(0.2) + 1(0.4) + 4(0.4) = 2.0</text><text class="ink" x="360" y="338" text-anchor="middle">옛 분포로: (−2)²(0.2) + (−1)²(0.2) + 0²(0.2) + 1²(0.2) + 2²(0.2) = 2.0</text><text class="ink2 sm" x="360" y="360" text-anchor="middle">뒤쪽이 무의식적 통계학자의 법칙이다. g 를 값에만 씌우고 확률은 그대로 쓴다</text>
</svg>