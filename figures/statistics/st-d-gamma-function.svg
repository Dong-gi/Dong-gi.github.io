<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 372" width="740" height="372" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">감마함수와 Γ(1/2) 의 값</title><desc id="d">감마함수 곡선 위에서 정수 자리의 값이 계승과 같고, 평면을 고리로 잘라 더하면 가우스 적분의 값이 나온다</desc>
<style>
