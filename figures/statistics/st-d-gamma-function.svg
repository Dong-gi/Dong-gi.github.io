1 1 600 160 A36 36 0 1 1 528 160 Z" fill="var(--s1)" fill-opacity="0.28" fill-rule="evenodd" stroke="none"/><path fill="none" stroke="var(--s2)" stroke-width="1.3" marker-start="url(#ar2)" marker-end="url(#ar2)" d="M564 160 L608 160"/><text class="ink sm" x="614" y="154" text-anchor="start">r</text><circle cx="564" cy="160" r="2.6" fill="var(--ink2)"/><text class="ink sm" x="564" y="256" text-anchor="middle">고리 넓이 = 2πr dr,  높이 = e^(−r²)</text><text class="ink bold sm" x="564" y="278" text-anchor="middle">더하면 ∫ 2πr e^(−r²) dr = π</text><text class="ink" x="370" y="330" text-anchor="middle">평면 전체에서 e^(−x²−y²) 아래 부피가 π 이고, 그 부피는 ∫ e^(−x²) dx 의 제곱이다</text><text class="ink2 sm" x="370" y="356" text-anchor="middle">그래서 ∫ e^(−x²) dx = √π 이고, 치환하면 Γ(1/2) = √π 가 된다</text>
</svg>