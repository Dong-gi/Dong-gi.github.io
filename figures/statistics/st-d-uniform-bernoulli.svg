<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이산균등분포와 베르누이 시행의 확률질량</title><desc id="d">왼쪽은 여섯 값이 모두 1/6 인 이산균등분포, 오른쪽은 실패 0.7 성공 0.3 인 베르누이 시행이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><rect x="40" y="40" width="300" height="232" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="190" y="59" text-anchor="middle">이산균등분포</text><text class="ink2 sm" x="190" y="75" text-anchor="middle">주사위 눈 — 값 6개가 모두 1/6</text><rect x="90.45" y="132.36" width="24.32" height="75.64" rx="1.2" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1"/><rect x="126.2" y="132.36" width="24.32" height="75.64" rx="1.2" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1"/><rect x="161.96" y="132.36" width="24.32" height="75.64" rx="1.2" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1"/><rect x="197.72" y="132.36" width="24.32" height="75.64" rx="1.2" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1"/><rect x="233.48" y="132.36" width="24.32" height="75.64" rx="1.2" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1"/><rect x="269.23" y="132.36" width="24.32" height="75.64" rx="1.2" fill="var(--s1)" fill-opacity="0.32" stroke="var(--s1)" stroke-width="1"/><path class="ax" marker-end="url(#ark)" d="M74 208 H320"/><path d="M102.61 208 L102.61 213" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="102.61" y="223" text-anchor="middle">1</text><path d="M138.36 208 L138.36 213" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="138.36" y="223" text-anchor="middle">2</text><path d="M174.12 208 L174.12 213" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="174.12" y="223" text-anchor="middle">3</text><path d="M209.88 208 L209.88 213" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="209.88" y="223" text-anchor="middle">4</text><path d="M245.64 208 L245.64 213" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="245.64" y="223" text-anchor="middle">5</text><path d="M281.39 208 L281.39 213" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="281.39" y="223" text-anchor="middle">6</text><path d="M74 132.36 L310 132.36" fill="none" stroke="var(--s2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink sm" x="316" y="124.36" text-anchor="end">1/6</text><text class="ink sm" x="190" y="250" text-anchor="middle">μ = 3.5,  σ² = 35/12 ≈ 2.92</text><rect x="360" y="40" width="300" height="232" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="510" y="59" text-anchor="middle">베르누이 시행</text><text class="ink2 sm" x="510" y="75" text-anchor="middle">값 두 개 — 성공 p, 실패 1 − p</text><rect x="452.5" y="110.82" width="35.2" height="97.18" rx="1.2" fill="var(--s3)" fill-opacity="0.34" stroke="var(--s3)" stroke-width="1"/><rect x="536.3" y="166.35" width="35.2" height="41.65" rx="1.2" fill="var(--s3)" fill-opacity="0.34" stroke="var(--s3)" stroke-width="1"/><path class="ax" marker-end="url(#ark)" d="M424 208 H610"/><text class="ink2 sm" x="470.1" y="224" text-anchor="middle">0 (실패)</text><text class="ink2 sm" x="553.9" y="224" text-anchor="middle">1 (성공)</text><text class="ink sm" x="470.1" y="102.82" text-anchor="middle">0.7</text><text class="ink sm" x="553.9" y="158.35" text-anchor="middle">0.3</text><text class="ink sm" x="510" y="250" text-anchor="middle">p = 0.3 일 때  μ = 0.3,  σ² = 0.21</text><text class="ink2 sm" x="350" y="300" text-anchor="middle">두 분포 모두 값이 몇 개뿐이다. 뒤에 나오는 분포는 전부 이 둘을 되풀이해 만든다</text>
</svg>