<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="380" y="28" text-anchor="middle">이중적분은 두 번의 보통 적분이다. 안쪽부터 차례로 한다</text><path d="M96 226 L200 226 L252 186 L148 186 Z" fill="var(--grid)" fill-opacity="0.35" stroke="var(--ink2)" stroke-width="1.2"/><path d="M124.6 204 L124.6 180.32 L129.8 176.32 L135 172.72 L140.2 169.52 L145.4 166.72 L150.6 164.32 L155.8 162.32 L161 160.72 L166.2 159.52 L171.4 158.72 L176.6 158.32 L181.8 158.32 L187 158.72 L192.2 159.52 L197.4 160.72 L202.6 162.32 L207.8 164.32 L213 166.72 L218.2 169.52 L223.4 172.72 L228.6 176.32 L228.6 204 Z" fill="var(--s1)" fill-opacity="0.4" stroke="var(--s1)" stroke-width="1.6"/><text class="ink bold" x="150" y="62" text-anchor="middle">안쪽 적분 — y 를 고정한다</text><text class="ink2 sm" x="150" y="264" text-anchor="middle">y 를 상수로 두고 x 로만 적분한다</text><text class="ink" x="150" y="284" text-anchor="middle">결과는 이 단면의 넓이 A(y) 다</text><path d="M456 226 L560 226 L612 186 L508 186 Z" fill="var(--grid)" fill-opacity="0.35" stroke="var(--ink2)" stroke-width="1.2"/><path d="M508 186 L508 154.4 L514.5 149.46 L521 145.15 L527.5 141.46 L534 138.4 L540.5 135.96 L547 134.15 L553.5 132.96 L560 132.4 L566.5 132.46 L573 133.15 L579.5 134.46 L586 136.4 L592.5 138.96 L599 142.15 L605.5 145.96 L612 150.4 L612 186 Z" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1"/><path d="M499.33 192.67 L499.33 164 L505.83 159.06 L512.33 154.75 L518.83 151.06 L525.33 148 L531.83 145.56 L538.33 143.75 L544.83 142.56 L551.33 142 L557.83 142.06 L564.33 142.75 L570.83 144.06 L577.33 146 L583.83 148.56 L590.33 151.75 L596.83 155.56 L603.33 160 L603.33 192.67 Z" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1"/><path d="M490.67 199.33 L490.67 173.6 L497.17 168.66 L503.67 164.35 L510.17 160.66 L516.67 157.6 L523.17 155.16 L529.67 153.35 L536.17 152.16 L542.67 151.6 L549.17 151.66 L555.67 152.35 L562.17 153.66 L568.67 155.6 L575.17 158.16 L581.67 161.35 L588.17 165.16 L594.67 169.6 L594.67 199.33 Z" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1"/><path d="M482 206 L482 183.2 L488.5 178.26 L495 173.95 L501.5 170.26 L508 167.2 L514.5 164.76 L521 162.95 L527.5 161.76 L534 161.2 L540.5 161.26 L547 161.95 L553.5 163.26 L560 165.2 L566.5 167.76 L573 170.95 L579.5 174.76 L586 179.2 L586 206 Z" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1"/><path d="M473.33 212.67 L473.33 192.8 L479.83 187.86 L486.33 183.55 L492.83 179.86 L499.33 176.8 L505.83 174.36 L512.33 172.55 L518.83 171.36 L525.33 170.8 L531.83 170.86 L538.33 171.55 L544.83 172.86 L551.33 174.8 L557.83 177.36 L564.33 180.55 L570.83 184.36 L577.33 188.8 L577.33 212.67 Z" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1"/><path d="M464.67 219.33 L464.67 202.4 L471.17 197.46 L477.67 193.15 L484.17 189.46 L490.67 186.4 L497.17 183.96 L503.67 182.15 L510.17 180.96 L516.67 180.4 L523.17 180.46 L529.67 181.15 L536.17 182.46 L542.67 184.4 L549.17 186.96 L555.67 190.15 L562.17 193.96 L568.67 198.4 L568.67 219.33 Z" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1"/><path d="M456 226 L456 212 L462.5 207.06 L469 202.75 L475.5 199.06 L482 196 L488.5 193.56 L495 191.75 L501.5 190.56 L508 190 L514.5 190.06 L521 190.75 L527.5 192.06 L534 194 L540.5 196.56 L547 199.75 L553.5 203.56 L560 208 L560 226 Z" fill="var(--s2)" fill-opacity="0.2" stroke="var(--s2)" stroke-width="1"/><text class="ink bold" x="520" y="62" text-anchor="middle">바깥 적분 — 단면을 y 방향으로 쌓는다</text><text class="ink2 sm" x="520" y="264" text-anchor="middle">A(y) 를 y 로 적분한다</text><text class="ink" x="520" y="284" text-anchor="middle">결과는 곡면 아래의 부피 = 확률이다</text><path fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ark)" d="M288 180 L372 180"/><text class="ink2 sm" x="330" y="166" text-anchor="middle">모으면</text><path d="M80 304 L690 304" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="380" y="328" text-anchor="middle">∫∫ f(x,y) dx dy 에서 안쪽 dx 를 먼저 계산한다. 그동안 y 는 그냥 상수다</text><text class="ink2 sm" x="380" y="352" text-anchor="middle">새 기술은 없다. 미적분에서 배운 적분을 두 번 하되 한 번은 다른 문자를 상수로 두는 것뿐이다</text>
</svg>