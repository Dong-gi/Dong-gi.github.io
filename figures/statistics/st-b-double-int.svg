<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">이중적분은 안쪽부터 차례로 하는 두 번의 적분이다</title><desc id="d">한 y 를 고정해 자른 단면의 넓이를 먼저 구하고 그 넓이를 y 방향으로 쌓으면 곡면 아래 부피가 된다</desc>
<style>
