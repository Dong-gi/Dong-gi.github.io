<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="370" y="24" text-anchor="middle">절편을 최적으로 맞춰 두면 남는 것은 기울기 하나뿐이고, 제곱합은 그 이차함수다</text><rect x="36" y="44" width="330" height="226" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="201" y="63" text-anchor="middle">제곱합 S(b<tspan baseline-shift="-22%" font-size="76%">1</tspan>)</text><text class="ink2 sm" x="201" y="79" text-anchor="middle">위로 열린 포물선 — 최소가 하나뿐이다</text><path class="ax" marker-end="url(#ark)" d="M78 208 H362"/><path class="ax" marker-end="url(#ark)" d="M78 208 V86"/><text class="ink2 sm" x="105.4" y="224" text-anchor="middle">0.5</text><text class="ink2 sm" x="151.07" y="224" text-anchor="middle">1</text><text class="ink2 sm" x="196.73" y="224" text-anchor="middle">1.5</text><text class="ink2 sm" x="242.4" y="224" text-anchor="middle">2</text><text class="ink2 sm" x="288.07" y="224" text-anchor="middle">2.5</text><text class="ink2 sm" x="333.73" y="224" text-anchor="middle">3</text><text class="ink2 sm" x="72" y="168.92" text-anchor="end">10</text><text class="ink2 sm" x="72" y="125.85" text-anchor="end">20</text><path class="cv s1" d="M78 89.11 L79.52 91.25 L81.04 93.37 L82.57 95.46 L84.09 97.53 L85.61 99.58 L87.13 101.6 L88.66 103.6 L90.18 105.57 L91.7 107.52 L93.22 109.45 L94.74 111.35 L96.27 113.23 L97.79 115.09 L99.31 116.92 L100.83 118.72 L102.36 120.51 L103.88 122.26 L105.4 124 L106.92 125.71 L108.44 127.4 L109.97 129.06 L111.49 130.7 L113.01 132.32 L114.53 133.91 L116.06 135.48 L117.58 137.02 L119.1 138.54 L120.62 140.03 L122.14 141.51 L123.67 142.95 L125.19 144.38 L126.71 145.78 L128.23 147.15 L129.76 148.51 L131.28 149.83 L132.8 151.14 L134.32 152.42 L135.84 153.68 L137.37 154.91 L138.89 156.12 L140.41 157.3 L141.93 158.46 L143.46 159.6 L144.98 160.71 L146.5 161.8 L148.02 162.86 L149.54 163.91 L151.07 164.92 L152.59 165.92 L154.11 166.89 L155.63 167.83 L157.16 168.75 L158.68 169.6