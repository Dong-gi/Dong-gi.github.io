t><circle cx="215" cy="186.03" r="4.5" fill="var(--s2)"/><text class="ink bold sm" x="215" y="176.03" text-anchor="middle">5.1</text><circle cx="278.93" cy="164.92" r="4.5" fill="var(--ink2)"/><text class="ink bold sm" x="278.93" y="154.92" text-anchor="middle">10.0</text><text class="ink2 sm" x="215" y="208.03" text-anchor="middle">b<tspan baseline-shift="-22%" font-size="76%">1</tspan> = 1.7</text><text class="ink2 sm" x="201" y="254" text-anchor="middle">미분해서 0 인 곳이 유일한 최소다</text><rect x="382" y="44" width="322" height="226" rx="6" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><text class="ink bold" x="543" y="63" text-anchor="middle">같은 세 기울기의 직선</text><text class="ink2 sm" x="543" y="79" text-anchor="middle">셋 다 (x̄, ȳ) 를 지난다</text><path class="ax" marker-end="url(#ark)" d="M424 208 H684"/><path class="ax" marker-end="url(#ark)" d="M424 208 V86"/><text class="ink2 sm" x="456.41" y="224" text-anchor="middle">1</text><text class="ink2 sm" x="502.7" y="224" text-anchor="middle">2</text><text class="ink2 sm" x="549" y="224" text-anchor="middle">3</text><text class="ink2 sm" x="595.3" y="224" text-anchor="middle">4</text><text class="ink2 sm" x="641.59" y="224" text-anchor="middle">5</text><text class="ink2 sm" x="418" y="174.67" text-anchor="end">4</text><text class="ink2 sm" x="418" y="137.33" text-anchor="end">8</text><text class="ink2 sm" x="418" y="100" text-anchor="end">12</text><path class="cv s1" stroke-dasharray="5 4" d="M428.63 176.27 L669.37 127.73"/><path class="cv s2" d="M428.63 193.25 L669.37 110.75"/><path class="cv s1" stroke-dasharray="5 4" d="M428.63 210.24 L669.37 93.76"/><circle cx="456.41" cy="180" r="4" fill="var(--ink)"/><circle cx="502.7" cy="161.33" r="4" fill="var(--ink)"/><circle cx="549" cy="170.67" r="4" fill="var(--ink)"/><circle cx="595.3" cy="133.33" r="4" fill="var(--ink)"/><circle cx="641.59" cy="114.67" r="4" fill="var(--ink)"/><circle cx="549" cy="152" r="5" fill="var(--s3)"/><text class="ink bold sm" x="435.57" y="106.27" text-anchor="start">(x̄, ȳ)</text><path fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#ark)" d="M467.98 110 L540.67 147.8"/><text class="ink2 sm" x="543" y="254" text-anchor="middle">가운데 실선이 최소제곱 직선</text><path d="M46 288 L694 288" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="370" y="310" text-anchor="middle">두 후보의 제곱합이 똑같이 10.0 인 것에 주목하라. 최소에서 같은 거리만큼 어긋났기 때문이다</text><text class="ink2 sm" x="370" y="334" text-anchor="middle">이차함수라는 것이 최소제곱의 값어치다. 최솟값이 하나뿐이고 미분 한 번으로 식이 나온다</text>
</svg>