<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 352" width="740" height="352" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">최소제곱 — 제곱합이 기울기의 이차함수라 최소가 하나다</title><desc id="d">기울기를 바꾸며 잔차제곱합을 그린 포물선과, 세 후보 기울기에 해당하는 직선들</desc>
<style>
