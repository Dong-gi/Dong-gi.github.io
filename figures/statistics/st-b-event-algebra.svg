<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">사건 연산은 집합 연산이다</title><desc id="d">합집합 교집합 여집합 차집합을 벤 다이어그램 네 칸으로 보인 것. 겹침이 없으면 배반이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink" x="370" y="32" text-anchor="middle">사건은 표본공간 S 의 부분집합이다. 말과 집합 연산이 하나씩 짝을 이룬다</text><rect x="28" y="66" width="158" height="112" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="35" y="81" text-anchor="start">S</text><circle cx="86" cy="126" r="37" fill="var(--s1)" fill-opacity="0.25" stroke="none" stroke-width="1.5"/><circle cx="128" cy="126" r="37" fill="var(--s1)" fill-opacity="0.25" stroke="none" stroke-width="1.5"/><circle cx="86" cy="126" r="37" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.6"/><circle cx="128" cy="126" r="37" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="60" y="130" text-anchor="middle">A</text><text class="ink bold" x="154" y="130" text-anchor="middle">B</text><text class="ink bold sm" x="107" y="54" text-anchor="middle">둘 중 적어도 하나   A ∪ B</text><rect x="210" y="66" width="158" height="112" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="217" y="81" text-anchor="start">S</text><clipPath id="cA1"><circle cx="268" cy="126" r="37"/></clipPath><g clip-path="url(#cA1)"><circle cx="310" cy="126" r="37" fill="var(--s2)" fill-opacity="0.5" stroke="none" stroke-width="1.5"/></g><circle cx="268" cy="126" r="37" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.6"/><circle cx="310" cy="126" r="37" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="242" y="130" text-anchor="middle">A</text><text class="ink bold" x="336" y="130" text-anchor="middle">B</text><text class="ink bold sm" x="289" y="54" text-anchor="middle">둘 다   A ∩ B</text><rect x="392" y="66" width="158" height="112" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="399" y="81" text-anchor="start">S</text><mask id="mA"><rect x="392" y="66" width="158" height="112" fill="white"/><circle cx="450" cy="126" r="37" fill="black"/></mask><rect x="392" y="66" width="158" height="112" fill="var(--s3)" fill-opacity="0.3" mask="url(#mA)"/><circle cx="450" cy="126" r="37" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.6"/><circle cx="492" cy="126" r="37" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="424" y="130" text-anchor="middle">A</text><text class="ink bold" x="518" y="130" text-anchor="middle">B</text><text class="ink bold sm" x="471" y="54" text-anchor="middle">일어나지 않는다   Aᶜ</text><rect x="554" y="66" width="158" height="112" rx="4" fill="none" fill-opacity="1" stroke="var(--ink2)" stroke-width="1.2"/><text class="ink2 sm" x="561" y="81" text-anchor="start">S</text><mask id="mAB"><circle cx="612" cy="126" r="37" fill="white"/><circle cx="654" cy="126" r="37" fill="black"/></mask><circle cx="612" cy="126" r="37" fill="var(--s1)" fill-opacity="0.35" mask="url(#mAB)"/><circle cx="612" cy="126" r="37" fill="none" fill-opacity="1" stroke="var(--s1)" stroke-width="1.6"/><circle cx="654" cy="126" r="37" fill="none" fill-opacity="1" stroke="var(--s2)" stroke-width="1.6"/><text class="ink bold" x="586" y="130" text-anchor="middle">A</text><text class="ink bold" x="680" y="130" text-anchor="middle">B</text><text class="ink bold sm" x="633" y="54" text-anchor="middle">A 이지만 B 는 아니다</text><path d="M28 212 L712 212" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="370" y="240" text-anchor="middle">겹치는 부분이 비면(A ∩ B = ∅) 두 사건은 배반이다. 배반은 집합의 관계이고 독립은 확률의 관계다</text><text class="ink2 sm" x="370" y="266" text-anchor="middle">공리가 그냥 더해도 된다고 보증하는 것은 왼쪽 그림이 아니라 배반인 경우뿐이다</text>
</svg>