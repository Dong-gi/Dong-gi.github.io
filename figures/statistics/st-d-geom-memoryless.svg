t class="ink2 sm" x="556.05" y="243" text-anchor="middle">5</text><path d="M584.14 228 L584.14 233" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="584.14" y="243" text-anchor="middle">6</text><path d="M612.24 228 L612.24 233" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="612.24" y="243" text-anchor="middle">7</text><path d="M640.33 228 L640.33 233" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="640.33" y="243" text-anchor="middle">8</text><text class="ink2 sm" x="540" y="96" text-anchor="middle">남은 기다림의 분포는 처음과 똑같다</text><text class="ink bold sm" x="540" y="268" text-anchor="middle">P(X &gt; 5 + k | X &gt; 5) = P(X &gt; k)</text><text class="ink" x="365" y="320" text-anchor="middle">‘다섯 번이나 안 나왔으니 이제 나올 때가 됐다’ 는 틀렸다. 동전은 앞의 결과를 기억하지 못한다</text><text class="ink2 sm" x="365" y="344" text-anchor="middle">기하분포는 이 성질을 갖는 유일한 이산분포다</text>
