<title id="t">기하분포의 확률질량과 무기억성</title><desc id="d">첫 성공까지의 시행 횟수 분포는 1 에서 가장 크고 지수적으로 줄어들며, 이미 몇 번 실패했든 남은 기다림의 분포가 같다</desc>
