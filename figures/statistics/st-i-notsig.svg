<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 334" width="740" height="334" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">유의하지 않은 두 가지 경우 — 좁은 구간과 넓은 구간</title><desc id="d">둘 다 0 을 품어 유의하지 않지만 좁은 구간은 차이가 작다는 정보이고 넓은 구간은 정보가 없다는 뜻이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="370" y="24" text-anchor="middle">세 연구 모두 두 집단의 차이를 추정했다. 가와 나는 둘 다 유의하지 않다</text><rect x="144.46" y="63.6" width="80.77" height="136.8" rx="3" fill="var(--grid)" fill-opacity="0.4" stroke="none" stroke-width="1.5"/><text class="ink2 sm" x="184.85" y="57.8" text-anchor="middle">실용적으로 무시할 수 있는 범위</text><path d="M184.85 202.3 L184.85 66.64" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M168.69 94 L217.15 94" fill="none" stroke="var(--s1)" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="round"/><path d="M168.69 100.08 L168.69 87.92" fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M217.15 100.08 L217.15 87.92" fill="none" stroke="var(--s1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="192.92" cy="94" r="5" fill="var(--s1)"/><text class="ink bold sm" x="88" y="99" text-anchor="end">연구 가</text><text class="ink sm" x="534" y="99" text-anchor="start">유의하지 않다 — 그리고 좁다</text><path d="M144.46 132 L467.54 132" fill="none" stroke="var(--s2)" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="round"/><path d="M144.46 138.08 L144.46 125.92" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M467.54 138.08 L467.54 125.92" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="306" cy="132" r="5" fill="var(--s2)"/><text class="ink bold sm" x="88" y="137" text-anchor="end">연구 나</text><text class="ink sm" x="534" y="137" text-anchor="start">유의하지 않다 — 그러나 넓다</text><path d="M205.04 170 L406.96 170" fill="none" stroke="var(--s3)" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="round"/><path d="M205.04 176.08 L205.04 163.92" fill="none" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.96 176.08 L406.96 163.92" fill="none" stroke="var(--s3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="306" cy="170" r="5" fill="var(--s3)"/><text class="ink bold sm" x="88" y="175" text-anchor="end">연구 다</text><text class="ink sm" x="534" y="175" text-anchor="start">유의하다</text><path class="ax" marker-end="url(#ark)" d="M96 202.3 H526"/><path d="M104.08 202.3 L104.08 207.3" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="104.08" y="217.3" text-anchor="middle">−2</text><path d="M184.85 202.3 L184.85 207.3" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="184.85" y="217.3" text-anchor="middle">0</text><path d="M265.62 202.3 L265.62 207.3" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="265.62" y="217.3" text-anchor="middle">2</text><path d="M346.38 202.3 L346.38 207.3" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="346.38" y="217.3" text-anchor="middle">4</text><path d="M427.15 202.3 L427.15 207.3" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="427.15" y="217.3" text-anchor="middle">6</text><path d="M507.92 202.3 L507.92 207.3" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink2 sm" x="507.92" y="217.3" text-anchor="middle">8</text><text class="ink2 sm" x="306" y="234.3" text-anchor="middle">가로축은 두 집단의 평균 차이</text><path d="M46 252 L694 252" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink bold" x="370" y="274" text-anchor="middle">연구 가는 ‘차이가 있어도 작다’ 고 말할 근거가 있다. 연구 나는 아무것도 말하지 못한다</text><text class="ink" x="370" y="296" text-anchor="middle">나의 구간은 7 만큼의 큰 차이도 배제하지 않는다. 표본이 모자라 판단을 못 한 것이다</text><text class="ink2 sm" x="370" y="320" text-anchor="middle">그래서 검정 결과만 보고하면 안 된다. 추정값과 구간을 함께 보아야 둘을 가를 수 있다</text>
</svg>