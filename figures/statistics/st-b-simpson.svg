<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
<title id="t">심슨의 역설 — 나눠 보면 이기는데 합치면 진다</title><desc id="d">두 환자군 모두에서 앞서던 쪽이 합친 수치에서는 뒤진다. 두 병원의 환자 구성이 다르기 때문이다</desc>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--grid:#d8d7d2}
@media (prefers-color-scheme:dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a38}}
.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}
.ax{stroke:var(--ink2);stroke-width:1.5;fill:none}
.gr{stroke:var(--grid);stroke-width:1;fill:none}
.s1{stroke:var(--s1)}.s2{stroke:var(--s2)}.s3{stroke:var(--s3)}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.cv{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-size:13px}
.sm{font-size:11px}
.bold{font-weight:600}
</style>
<defs>
<marker id="ar1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s1)"/></marker>
<marker id="ar2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s2)"/></marker>
<marker id="ar3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--s3)"/></marker>
<marker id="ark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink2)"/></marker>
</defs>
<style>svg{--bgfix:#ffffff}@media (prefers-color-scheme:dark){svg{--bgfix:#121212}}</style><text class="ink bold" x="370" y="28" text-anchor="middle">두 병원의 치료 성공률 — 직접 만든 표다</text><text class="ink bold" x="130" y="62" text-anchor="middle">경증 환자</text><rect x="60" y="80" width="54" height="118" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="60" y="91.8" width="54" height="106.2" rx="2" fill="var(--s1)" fill-opacity="0.45" stroke="var(--s1)" stroke-width="1.2"/><text class="ink bold" x="87" y="83.8" text-anchor="middle">90%</text><text class="ink2 sm" x="87" y="216" text-anchor="middle">병원 가</text><text class="ink2 sm" x="87" y="232" text-anchor="middle">90/100</text><rect x="146" y="80" width="54" height="118" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="146" y="85.9" width="54" height="112.1" rx="2" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="1.2"/><text class="ink bold" x="173" y="77.9" text-anchor="middle">95%</text><text class="ink2 sm" x="173" y="216" text-anchor="middle">병원 나</text><text class="ink2 sm" x="173" y="232" text-anchor="middle">19/20</text><text class="ink bold" x="326" y="62" text-anchor="middle">중증 환자</text><rect x="256" y="80" width="54" height="118" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="256" y="162.6" width="54" height="35.4" rx="2" fill="var(--s1)" fill-opacity="0.45" stroke="var(--s1)" stroke-width="1.2"/><text class="ink bold" x="283" y="154.6" text-anchor="middle">30%</text><text class="ink2 sm" x="283" y="216" text-anchor="middle">병원 가</text><text class="ink2 sm" x="283" y="232" text-anchor="middle">30/100</text><rect x="342" y="80" width="54" height="118" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="342" y="150.8" width="54" height="47.2" rx="2" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="1.2"/><text class="ink bold" x="369" y="142.8" text-anchor="middle">40%</text><text class="ink2 sm" x="369" y="216" text-anchor="middle">병원 나</text><text class="ink2 sm" x="369" y="232" text-anchor="middle">72/180</text><text class="ink bold" x="572" y="62" text-anchor="middle">합쳐 보면</text><rect x="502" y="80" width="54" height="118" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="502" y="127.2" width="54" height="70.8" rx="2" fill="var(--s1)" fill-opacity="0.45" stroke="var(--s1)" stroke-width="1.2"/><text class="ink bold" x="529" y="119.2" text-anchor="middle">60%</text><text class="ink2 sm" x="529" y="216" text-anchor="middle">병원 가</text><text class="ink2 sm" x="529" y="232" text-anchor="middle">120/200</text><rect x="588" y="80" width="54" height="118" rx="2" fill="none" fill-opacity="1" stroke="var(--grid)" stroke-width="1"/><rect x="588" y="144.31" width="54" height="53.69" rx="2" fill="var(--s2)" fill-opacity="0.45" stroke="var(--s2)" stroke-width="1.2"/><text class="ink bold" x="615" y="136.31" text-anchor="middle">46%</text><text class="ink2 sm" x="615" y="216" text-anchor="middle">병원 나</text><text class="ink2 sm" x="615" y="232" text-anchor="middle">91/200</text><path d="M452 56 L452 252" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text class="ink" x="216" y="256" text-anchor="middle">두 군 모두 병원 나가 앞선다</text><text class="ink bold" x="572" y="256" text-anchor="middle">그런데 뒤집힌다</text><path d="M54 274 L686 274" fill="none" stroke="var(--grid)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="ink" x="370" y="298" text-anchor="middle">병원 가는 경증 환자를, 병원 나는 중증 환자를 훨씬 많이 받았다. 환자 구성이 다른 것이 원인이다</text><text class="ink2 sm" x="370" y="322" text-anchor="middle">조건부확률을 조건 없이 합치면 이런 뒤집힘이 일어난다. 합친 수만 보고 비교하면 안 된다</text>
</svg>